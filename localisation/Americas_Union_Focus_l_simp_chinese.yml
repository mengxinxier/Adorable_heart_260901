#国策
 AUF_NFA_American_Unification: "美洲防卫组织"
 AUF_NFA_American_Unification_desc: ""
 AUF_NFA_0: "过往尘烟"
 AUF_NFA_0_desc: "历史遗留问题需要得到解决。"
 AUF_NFA_1: "亚裔问题"
 AUF_NFA_1_desc: "亚裔已经超过北美人口总和的四分之一，我们必须谨慎对待亚裔。"
 AUF_NFA_2: "民族融合"
 AUF_NFA_2_desc: "亚裔已是我们不可分割的一部分，这是多元社会不可避免的一环。"
 AUF_NFA_3: "驱逐亚裔"
 AUF_NFA_3_desc: "亚裔与我们欧美裔之间存在着天然隔阂，她们必须被驱逐！"
 AUF_NFA_4: "美洲亚裔管理局"
 AUF_NFA_4_desc: "建立统一的亚裔事务管理局来处理有关她们的事务。"
 AUF_NFA_5: "往事对错"
 AUF_NFA_5_desc: "在过去，我国对精灵犯下了很多错误..."
 AUF_NFA_6: "承认历史"
 AUF_NFA_6_desc: "这些肮脏的历史不该被隐藏，她们存在的意义便是警示我们。"
 AUF_NFA_7: "愈合伤痛"
 AUF_NFA_7_desc: "伤口会随着时间逐渐愈合。"
 AUF_NFA_8: "为时不晚"
 AUF_NFA_8_desc: "现在，让我们与精灵重新开始，共同奔赴新的征程。"
 AUF_NFA_9: "会见希亚"
 AUF_NFA_9_desc: "在瓦尔哈拉社覆灭后，是时候和她们的前领导人进行一次会晤来商讨关于中美洲的事务了..."
 AUF_NFA_10: "自治社区"
 AUF_NFA_10_desc: "即使我们很难同化中美洲这块曾经的殖民地，但依然可以通过给予一部分自治的方式来让她们认同我们。"
 AUF_NFA_11: "中美独立"
 AUF_NFA_11_desc: "希亚没有说错，中美洲是一块烫手山芋，也许让她们独立出去反而利于法兰西的发展，但她们的独立当然是要付出一定代价的。"
 AUF_NFA_12: "改组工会"
 AUF_NFA_12_desc: "美洲的共产主义运动并不少见，让工会发表意见才是正确的选择。"
 AUF_NFA_13: "全面合作"
 AUF_NFA_13_desc: "美洲各国应该在各方面都积极合作。"
 AUF_NFA_14: "科技共享计划"
 AUF_NFA_14_desc: "先进的国家有义务将她们的科技分享给弱小的国家。"
 AUF_NFA_15: "军事一体化"
 AUF_NFA_15_desc: "统一的指挥链有利于我们击退敌人。"
 AUF_NFA_16: "核能研发"
 AUF_NFA_16_desc: "核能有着巨大的潜力，我们必须跟上世界步伐。"
 AUF_NFA_17: "灵装现代化"
 AUF_NFA_17_desc: "魔法装备的潜力是无穷的。"
 AUF_NFA_18: "定期军事演习"
 AUF_NFA_18_desc: "通过定期军事演习，美洲军队的战斗力将再度得到提升。"
 AUF_NFA_19: "海军生产计划"
 AUF_NFA_19_desc: "我们应该打造一支属于美洲的庞大舰队。"
 AUF_NFA_20: "保卫我们的家园"
 AUF_NFA_20_desc: "我们为何而战？"
 AUF_NFA_21: "南美事务局"
 AUF_NFA_21_desc: "南美洲存在着许多常人无法理解的事情，在美洲统一之后，这需要南美各国各自派出专员进行管理。"
 AUF_NFA_22: "为废墟，种上第一朵花"
 AUF_NFA_22_desc: "“战争结束了。但它留下的伤疤，还刻在这片大陆的每一寸土地上。我们不能让我们的孩子们，永远生活在灰烬和废墟之中。那么，我们一起，拿起工具，清理瓦砾，然后，在那些曾被炮火蹂躏过的地方，亲手，种下第一棵树，第一朵花。这不仅是为了重建家园，更是为了告诉所有人，生命，远比毁灭，更顽强。”"
 AUF_NFA_PAO_2: "重新点亮每一盏灯"
 AUF_NFA_PAO_2_desc: "“战火摧毁了我们的城市，也切断了我们彼此的联系。现在，是时候，重新将那些断裂的道路，连接起来了。所以，我们一起，修复铁路，架设桥梁，铺设电缆。我们要让每一座孤立的村庄，都能再次听到来自远方的声音；让每一个走在回家路上的旅人，都能看到前方那盏……被重新点亮的、温暖的路灯。”"
 AUF_NFA_PAO_3: "把故事还给孩子们"
 AUF_NFA_PAO_3_desc: "“战火，同样偷走了孩子们最宝贵的童年。她们的耳边，充满了炮火的轰鸣，而不是母亲的摇篮曲。现在，我们要把那些……被偷走的、美好的东西，都找回来。于是，我们一起，建造新的学校，印刷新的书本，把那些关于英雄、关于希望、关于一个更好未来的故事，重新，讲给她们听。因为，教育，才是治愈一个民族最深创伤的、最好的良药。”"
 AUF_NFA_PAO_4: "我们大家的餐桌"
 AUF_NFA_PAO_4_desc: "“我们的人民，曾因为饥饿和猜忌，而互相为敌。现在，战争结束了，我们不能再回到过去那种，只顾着自己碗里食物的日子了。最后，我们一起，推倒那些无形的墙壁，拆掉那些隔阂的藩篱，然后，把我们所有人的餐桌，都拼在一起。让我们学会分享，学会倾听，学会……如何在一个更大的、更温暖的家里，成为真正的一家人。”"
