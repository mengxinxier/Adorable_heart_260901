 AUF_NFA_kqdl: "哭泣的大陆"
 AUF_NFA_kqdl_desc: "“我们让美洲，沐浴在了和平的光芒之下。可每当夜深人静时，我们总能听到，从海洋的另一端，传来更巨大的、更绝望的哭声。那里，古老的暴君，仍在用民众的骸骨，堆砌祂的王座；疯狂的野心家，仍在用同胞的鲜血，染红自己的旗帜。那片大陆……病了。病得很重。病到了……需要一位最坚决的‘医生’，去为祂，切除所有腐烂的坏疽。”"
 AUF_NFA_yazm: "以“爱”之名"
 AUF_NFA_yazm_desc: "“我们的远征，并非为了仇恨。恰恰相反，它源于最深沉的爱。正因为我们深爱着这个世界，深爱着每一个无辜的生命，所以，我们才决不允许，那些……以散播痛苦为乐的‘邪恶’，继续存在。我们挥舞刀剑，是为了让所有的刀剑，都归于沉寂。我们燃起战火，是为了让这世界，迎来永恒的和平。这，是一场……以‘爱’之名，所进行的、最神圣的净化。”"
 AUF_NFA_bblj: "不被理解的“正义”"
 AUF_NFA_bblj_desc: "“我们知道，旧世界的那些人们，会无法理解我们。她们会称我们为‘侵略者’，会称我们为‘新的暴君’。没关系。因为，一个溺水的孩子，在被救上岸之前，总是会拼命地，挣扎和哭喊的。她们现在还不明白，我们正在为她们，带来一个……她们甚至，都不敢去想象的、崭新的、没有眼泪的未来。总有一天，她们会懂的。”"
 AUF_NFA_bjks: "直到……再也听不见哭声为止"
 AUF_NFA_bjks_desc: "“这场远征，要到什么时候，才会结束？很简单。直到……我再也，听不到，这个世界任何一个角落里，传来的、任何一声，因为不公与压迫而发出的哭声为止。到那时，我们的剑，就会自动归鞘。我们的旗帜，就会化作每一片田野里，最普通的、守护着丰收的稻草人。在那之前……我们，永不停歇！！！”"
