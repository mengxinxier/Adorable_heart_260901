 BAL_Sonoko_country_leader_desc: "乃木园子出身于大赦的乃木家，举手投足间尽显名门风范。平日里，园子像春日里轻柔的风，让人倍感亲切。但在大赦组织内部，园子凭借其先辈乃木若叶的遗泽、勇者的身份以及大赦世家的支持拥有较强的话语权。这位看似软绵绵、天然呆的大小姐，却能在“濑户大桥合战”中，为了守护组织与同伴，她毫不犹豫地连续满开20次，哪怕身体机能几近崩溃，也未曾有过一丝退缩，这种自我牺牲的伟大精神充分诠释了勇者的伟大。多少为追求波罗的海民族独立的战士为之流泪叹惋。\n好在神树大满开之后，乃木园子得以恢复身体机能，并通过新生的勇者、防人、刀使真正让松散的大赦凝聚起来，哪怕旧日的先辈们也在神树的伟力下突破了时间的壁障来到现世，园神的地位也无从动摇。"

 BAL_Utano_desc: "白鸟歌野就像一株顽强的野草，在荒芜的逆境中倔强生长。独自守护塔林的三年，面对战姬的侵袭、荒魂恶灵的肆虐，她缺少来自里加的支援，却凭借着不屈的意志，维持着大赦的军事存在，并按照大赦的指示建立起神社学园。她的乐观就如同野草在风中摇曳的姿态，感染着每一个人；她的责任感如同野草的根系，牢牢地抓住土地，吸收容纳着各种力量。\n来自北方、东方的布尔什维克进入了塔林，加剧了这片区域的复杂性，白卫军、战姬军、起义军等诸多势力在这里混战。白鸟歌野点燃了野草，烧光了污秽，她容纳各种有志之士，在这片躁动的土地建立秩序，恢复生产，最终把罔顾百姓生命的野心家一一击败。"

