 BAL_ele.01.t: "本季度大选民调结果"
 BAL_ele.01.d: "最新一轮的大选民调统计结果已经出炉，基于民主选举的原则，我们应当确保并尊重选举工作的公平、公正和公开。\n\n或者，我们也可以使用一些其他的手段……"
 BAL_ele.01.a: "无论如何，选举的公平公正还是很重要的。"
 BAL_ele.01.b: "大赦正在动员其在各地的分社……"
 BAL_ele.01.c: "战姬们正在动员各自辖区内的选民……"

 BAL_ele.02.t: "艾丽奥诺拉异军突起"
 BAL_ele.02.d: "在第一季度民意调查中，出现了各方势力意料之外的情况，独立参选人艾丽奥诺拉·威尔塔利亚异军突起，其支持度俨然有赶超各参选集团的趋势。\n\n作为当下唯一一位出身平民的战姬，威尔塔利亚在很多方面与其他六位战姬格格不入，尤其是与已经连续传承了祖孙三代战姬之位的柳德米拉·露利叶矛盾重重，也因此始终不能完全融入战姬们的各类圈子，明明精明强干、体恤百姓，在自己辖区之内政绩斐然，国人皆仰贤名，却也只能以独立身份参与大选，这就注定了她的竞选团队很难与大赦和其他战姬所推出的候选人们相比。\n\n然而，从如今的民调看来，威尔塔利亚的表现完全不符合她作为独立候选人所能爆发出的政治力量，想必唯一合理的解释便是大选遭到了某些别有用心之人、甚至外部势力的干涉和操纵，而威尔塔利亚作为七战姬中左倾最明显的一位，愿意暗中扶植她的势力恐怕显而易见。"
 BAL_ele.02.a: "“不论如何，能够得出如此离谱的结果的民调机构，它的专业性值得怀疑。”"
 BAL_ele.02.b: "“搞砸了本国的制宪会议还不够，还有脸指点起我们来了？”"

 BAL_ele.03.t: "截获的书信"
 BAL_ele.03.d: "自第一季度民调结果发布后，大赦神议殿及其下属的祓禊室便奉神祇伯春日野椿之命展开了对威尔塔利亚的秘密调查，试图找出她与苏联方面存在直接联系的蛛丝马迹。经过一番搜肠刮肚，大赦的祓禊人终于从负责海关事务的防人们那里截获了一封来自苏联的信件。\n\n原来，早在大战之前，威尔塔利亚便与精通剑术的沙俄军官希格纳姆保持着良好关系，而在“伟大战争”爆发，威尔塔利亚返回波罗的海后，两人也时常通过书信分享彼此经历并探讨剑术技巧，直至俄国内战中希格纳姆随夜天家家主八神疾风投效布尔什维克，两人才断了联系。而希格纳姆这封久违的来信，内容相当平常，只是单纯对老朋友嘘寒问暖，以及继续分享自己对剑术的心得，祓禊室就是把这几张信纸刮出了火星，也没能从信上平铺直叙甚至流水账一般的措辞中检查出任何加密内容。\n\n但这其实都无所谓，只要大赦想，这封以错误的身份在错误的时间和错误的地点寄出的错误的信，完全可以化作对威尔塔利亚这个错误的收信人的一记重锤。"
 BAL_ele.03.a: "作为直属神议殿、直接听神祇伯本人调度的大赦暗部组织，祓禊室对这类工作早已轻车熟路。"
 BAL_ele.03.b: "“真麻烦，还是找点实锤吧。”"

 BAL_ele.04.t: "勇者在阅读"
 BAL_ele.04.d: "“高岛？你这是在看什么呢？”\n“小郡？没什么没什么，偶然得到的书，觉得蛮有意思就读起来了，小郡也一起来看看吗？”\n“如果高岛觉得可以的话……”\n\n带着些小小的扭捏，郡千景在高岛友奈的身侧靠了下来，正欲闭眼享受这与对方独处的美好片刻之时，目光便落上了摊开在她手里的一本书。\n\n“高岛……这本书记录的是神议殿所禁止的的内容吧？”\n“诶，但小郡你看，这本书说得挺有道理的欸，为了一个共同的目标，大家一起联合起来，这样大家都会幸福的吧？”\n“高岛说得也有道理……但身为勇者，私自看这种禁止的内容真的没问题吗？”\n“就咱俩看，没事的小郡。”\n“和高岛……两个人一起……”\n高岛友奈将肩膀借给千景，眼底余光则瞥向了正往屋内探头探脑的两名门卫。\n\n面对着完全陌生的时代，复活的前代勇者们那颗誓要为保家卫国而战的勇者之心愈发坚定，但与全身心投入到工作中的乃木若叶等伙伴不同，高岛友奈多了一些心思，她想通过故意卖把柄的办法，来搞清楚这个时代、这个“吉斯塔特共和国”，对她们、对勇者们这质朴而又崇高的理想信念，究竟抱持着怎样的真实态度。\n\n同时，高岛友奈也有一点小小的私心，她暗自发誓，这一世，一定要守护这身侧之人，绝不会让上一世的悲剧在她身上重演。"
 BAL_ele.04.a: "“早就听说高岛友奈不知从哪搞来了这么一批禁书，今日果不其然，咱俩现在就去报告神伯大人吧。”"
 BAL_ele.04.b: "“人家可是复活的前代传奇勇者，直接找神伯大人也太莽了，要不咱俩先找乃木若叶探探口风？”"

 BAL_ele.05.t: "给博卓卡斯替的信" 
 BAL_ele.05.d: "博卓卡斯替：\n见字如晤。\n里加的雪又落了，我看着诊所旧址的裂痕被新雪填满，像极了当年在卡西米尔和你一同指挥作战时见过的弹坑。不知老友你如今可还安好？我如今供职于吉斯塔特这个新生的共和国，虽然我已不愿再卷入无意义的政治争斗，但为了报答此间军民接纳之恩，我还是希望至少能为他们做一些事情。\n而且，请你放心，我对新生的苏维埃国家没什么敌意，如果可能的话，我也希望、并愿意致力于两国之间的和平稳定及睦邻友好。毕竟你也明白，苏联不希望彼得格勒受到威胁，吉斯塔特也不希望再次被强邻的铁蹄蹂躏，关系的正常化对两国只能是百利而无一害。\n另外，听说在罗德岛公司的帮助下，叶莲娜已经康复，就连你的矿石病也缓解不少。我知道，以前那么长时间里，你们两个总是因为觉得自己命不久矣而试图回避彼此，而如果现在果真如此，那老朋友，你也多陪陪叶莲娜那孩子吧，想必，她也有一肚子话要跟你讲的吧。\n最后，如果有朝一日，咱俩还能再见上一面，到时候就一块儿喝一杯吧，我们届时就终于可以不再去争论曾经沙皇的那个帝国，而是可以像真正久别重逢的老友一样，一起谈天说地，从我们的过去，说到年轻人的现在，然后再谈到我们所有人的未来。\n愿你我的努力，能换得后人不必在废墟里捡拾兵刃。\n\n老友\n\n赫拉格\n某年某月某日"
 BAL_ele.05.a: "“看来威尔塔利亚的同伙可还大有人在呢”！"
 BAL_ele.05.b: "“赫拉格的话，倒还算情有可原……”"

 BAL_ele.06.t: "艾斯特斯报告"
 BAL_ele.06.d: "吉斯塔特共和国联合政府、吉斯塔特共和国国防部：\n　　基于过去数月内对我军概况及军中神职人员之职务安排的分析调研，现将调查情况报告如下：\n\n一、军中神职人员已呈泛滥趋势\n通过对我军官兵成分的全面筛查，我们发现，我军官兵中神职人员的数量之多及其参军渠道之复杂程度远远超出预期，仅从数量上就已大大高出确保政治忠诚工作的需求，导致军中人浮于事，严重阻碍我国国防建设。\n\n二、部分神职人员存在干预军事主官决策现象\n调查还表明，部分神职人员惯于依仗自身的宗教地位越俎代庖，直接干预部队指挥决策，导致我军官兵被处处掣肘，就连日常训练都难以保证，结果就是作战指挥链条严重失效，军队实际战斗力大打折扣。而上述现象在防人部队中最为严重，值得重视。\n\n基于以上情况，为了保障我国国防工作的健康发展、继续推行军事改革，我们提请由柳德米拉·露利叶将军牵头，对我军官兵进行进一步的筛查，在保证政治忠诚工作正常开展前提下，将冗余的神职人员彻底清除出军队。\n敬祈钧裁。\n吉斯塔特共和国武装力量总参谋长 瓦伦缇娜·古丽卡·艾斯特斯"
 BAL_ele.06.a: "“打仗要靠的终究是军人，而非神官。”"
 BAL_ele.06.b: "“这是为了正信！”"

 BAL_ele.07.t: "本季度大选民调结果" 
 BAL_ele.07.d1: "最新一轮的大选民调统计结果已经出炉，在两大竞选集团中，大赦集团取得了对战姬集团的优势，不出意外的话，最终的胜者将从大赦推出的候选人中产生。"
 BAL_ele.07.d2: "最新一轮的大选民调统计结果已经出炉，在两大竞选集团中，战姬集团取得了对大赦集团的优势，不出意外的话，最终的胜者将从战姬们推出的候选人中产生。"
 BAL_ele.07.a: "”神树的子民终将得胜！“"
 BAL_ele.07.b: "“我们要的是一个世俗化的国家！”"

 BAL_ele.08.t: "吉斯塔特的农业王"
 BAL_ele.08.d: "“歌农——你的信，园子给你的。”手拿带有乃木家纹烫印的信封，藤森水都急匆匆地来到了正在修剪果树的白鸟歌野身前。\n“哦，Thank you小水，我也正想歇会儿。”\n由里加的联合政府任命的爱斯兰政务委员会总委员长兼塔林守护（城防司令）一边说着，一边走下扶梯，将手上的剪刀放到一旁。\n\n即便已经手握以塔林市为中心的大半个爱沙尼亚的军政实权，白鸟歌野依旧雷打不动地坚持在闲暇时间里下地劳作或者去基层考察，对于被人们亲切地称为“农业王”的她来说，对农业问题的研究与实践早已成为了自己生活中不可分割的一部分，现在则正好趁着休息时间来看看那位乃木家的后生又有了什么古灵精怪的点子。\n“怎么样歌农？园子她在信里说了什么？不会还是跟以前一样，帮她祖宗若叶论证乌冬面到底有多好吃吧？”\n“嘛，这次还真不是，园子是想让我也去参加最近的大选。”\n“诶——？”同样由里加的联合政府任命的爱斯兰祓厄奉行（地区主教）兼塔林知事（市长）如此发出了自己由衷的错愕。\n\n上一世在塔林为神树成长争取到三年时间后力战而亡，这一世继续在塔林抗击荒魂，在与里加政府失联以及外援几乎断绝的绝境中，不仅凭借着优秀的经营与指挥才能保全了塔林一城军民，还带领他们一举光复了爱沙尼亚的大半土地的白鸟歌野和藤森水都二人，不仅是实至名归的传奇勇者与巫女，更是早已成为了塔林、乃至整个爱沙尼亚的精神图腾。而也正因如此，当地社会各界人士，出于种种目的，纷纷团结在了她们二人的身边，凝聚成了一股不容小觑的政治力量，鼎力支撑着她们对自己辖区的管辖与治理，即便这二人连最起码的与自己手中的权力、地位和势力强度相配的野心都没有。当然，这股力量不可能不被里加方面所重视，但只要白鸟歌野保持安分，里加的各方势力也没太大兴趣去给这位早已成为一方强藩的传奇勇者找点麻烦。\n\n但现如今，作为联合政府总统的乃木园子有了些新的点子。在她看来，虽然大赦和勇者们已经在大选中取得优势，但左翼或亲苏思想在社会上依然很有市场，为了争取左翼选民的支持，她们就需要选出一位既同情左翼又能服众的新候选人，而长期与底层人民打成一片的零号勇者白鸟歌野便正是合适的人选。\n\n“歌农你怎么想？”\n“我打算先看看再说，虽然当总统什么的我倒是没兴趣啦，不过园子的这句提议我觉得蛮interesting的。”白鸟歌野将信纸递到藤森水都面前，对方接过后，最先映入眼帘的，是正文的第一句、也是最后一句话——"
 BAL_ele.08.a: "“塔林的农业王哟，有没有兴趣来当吉斯塔特的农业王呢？”"

 BAL_ele.09.t: "预见的未来"
 BAL_ele.09.d: "听着巫女们对民调结果的汇报，大赦神祇伯春日野椿还是摆着那副扑克脸，眼底虽然依旧如同往常一样古井无波，却难掩心底惊涛骇浪。如今的大赦虽然在大选中占据优势，但通过对历史以及独立以来的共事经历的理解，春日野椿明白，即便大赦最终真的能够赢下大选，战姬们也绝不会善罢甘休，尤其是以露利叶和艾斯特斯为首的几名仍掌握实际军权的战姬，她们的发难势必导致极其严重的后果，这对大赦乃至整个波罗的海来说，都是无法承受之重。况且，大赦对军队施加影响力的举措已经招致了战姬们的强烈反弹，尤以七大战姬部曲最为顽固。自独立以来，作为政治妥协的一部分，七大战姬各自的部曲并未被拆散重编，而是在大体保持原有建制的状态下被重新授予番号，这就给战姬们继续在明里暗里影响和控制各自旧部提供了便利，而为了保证大赦对前战姬部曲的渗透，部分神官的急躁冒进又给了战姬们公开收拢旧部的行为提供了把柄，反而在一定程度上提高了战姬在军队内部的话语权。\n\n但与蠢蠢欲动的战姬们相比，更令春日野椿背后发凉的是，作为大赦一手组建起来的嫡系武装，居然连勇者和防人都在有意无意地与大赦保持距离。勇者们已经在独立斗争中博得了全国各族人民衷心爱戴，她们的脱离尚在意料之中，倒也不算太难令人接受；但楠芽吹和国土亚耶这两个吃里扒外、忘恩负义的狗种，居然也打着“军人不问政治”的旗号，试图让防人这股除勇者外军队内部仅有的能够与七大战姬相抗衡的力量彻底中立化。\n\n另外，联合政府近年来的某些举措，也让春日野椿感到不安。如果仅仅只是要让国家的上层建筑摆脱“以教代政”的窘境，那春日野椿也没什么意见，毕竟她也希望大赦可以通过更名正言顺的方式来干预甚至掌握国家政权，本次与勇者一道参与大选就是明证。但反观联合政府如今所推行的一系列政治和经济改革，不论是政治上的重划选区，还是经济上的清丈寺产，都无不在明里暗里针对着大赦，大有将其影响力连根拔起之势。面对如今的一系列困难，春日野椿必须思考破局的方法。\n\n“但是……如果是她们做出了出格的行为的话……”\n春日野椿很快便有了自己的谋划。既然仅仅是安插人手就能引发战姬们这么大的反应，那么在大选后的新官上任三把火都烧到了她们头上的话，她们会有什么反应呢？\n倚仗着尚未脱离掌控的防人和已经被拉拢的军队，届时的混乱，会为她夺回掌控权创造绝佳的机会。春日野椿现在要做的，就是继续收紧绞索，让战姬们的怨气一点点地积累，诱使她们做出那个不理智的选择，以及，——\n\n做好第一时间收拾那个乃木家的小鬼的准备。"
 BAL_ele.09.a: "“以神树之名，所有的未来，我都已看见了！”"

 BAL_ele.10.t: "争执" 
 BAL_ele.10.d: "作为波罗的海航运的重要支点，波罗的海地区自古以来便是兵家必争之地，此外，地狭人稀的窘境也迫使本地政权在外交和军事策略上天然倾向于加入甚至依附于由域外强权所主导的政治或军事同盟，新生的吉斯塔特共和国也不例外。本次在里加国会大厦举行的大选辩论的话题，正是国家外交与安全政策。\n\n战姬集团推出的总统候选人、同时也是七大战姬之一的柳德米拉·露利叶首先发言，她表示，出于对援助波罗的海独立战争与军事投送能力的考量，只要吉斯塔特加入圣杯同盟便可保证吉斯塔特的安全无虞，更可以遏制苏联以及安兹乌尔恭势力对波罗的海地区的侵略野心。露利叶的发言令国会议事大厅中掌声雷动，战姬们普遍对她的主张表示支持，但有一人在随后便表示了反对。\n\n同属七大战姬而又以独立身份参选的艾丽奥诺拉·威尔塔利亚第二个发言，她提出，如今由执念亡灵统治的波兰已经从事实上成为了圣杯同盟在东欧地区的包税人，如今吉斯塔特再想加入圣杯同盟，也不会得到圣杯王国的重视，既然如此，不如争取化敌为友，加深对苏联的合作，让这个曾经最危险的敌人变为日后最强大的后盾。威尔塔利亚的发言直接瞬间引爆了整个大厅，就好像往平静的湖水里抛了一块砖一样，国会议员们吵成一团，所幸局面没有演变成其他国家那样的全武行，否则这次国会辩论非被打断不可。\n\n事实上，独立后的波罗的海虽未与苏联断交，但在联合政府内部，防共防苏是默认的共识，况且，尽管苏联取代了长期对波罗的海实行殖民统治的沙皇俄国，也多次表示愿意承认并尊重波罗的海的独立，但这十几年来，波罗的海社会对苏联的警惕和防范声浪一直不低，威尔塔利亚为何会提出这一天方夜谭且易与他人把柄的提案？在座的各位议员与政府官员其实都清楚，在种种因素的作用下，威尔塔利亚与露利叶两人之间矛盾重重，早在沙皇时期，二人便已屡屡指挥各自部众在两方辖区边界上刀兵相见。但如果提出这些提案仅仅只是出于跟露利叶抬杠的目的，未免太幼稚了，尤其是对于政绩斐然的威尔塔利亚来说，更是如此。\n\n不论威尔塔利亚提出这一主张的动机与目的究竟如何，事实是，她与露利叶二人当场再次爆发了激烈的争吵，即便在国会议事大厅中不方便抄家伙上手或者狂飙垃圾话，唇枪舌剑的二人也丝毫没有给对方留出哪怕一丝颜面的意思。随着调门越来越高、声量越来越响，两个人在争吵中吵出来的音量居然一时和方才数百人争吵的音量不相上下，直到国会议长折神朱音带来总统乃木园子亲笔写下的中止本轮大选辩论、命令二人立即停止争吵的总统令方才堪堪罢休。\n\n次日，露利叶向联合政府与国会上表弹劾威尔塔利亚存在通苏通共、密谋颠覆国家现行体制的叛国行径，请求立即对其采取强制措施，而政府和国会回复她的，只有四个字——"
 BAL_ele.10.a: "“‘不予通过’……？开什么玩笑？！——……”"

 BAL_ele.11.t: "神谕"
 BAL_ele.11.d: "“该死……该死该死该死该死该死该死该死该死该死！！！！！”\n抓挠着墨蓝色的长发，大赦现任神祇伯春日野椿陷入了歇斯底里的疯狂。\n\n春日野椿天生弱视，因为幼时听教堂的神父说这是因为人类与生俱来的“原罪”，故为了寻求救赎，治疗双眼，她曾投奔波罗的海当地的东正教会，成为了一名修女，她参与过一些修道院的管理工作，也曾为了修行独自一人用双脚丈量了波罗的海的山山水水，但也正是这段类似现任七大战姬之一的奥露嘉·塔姆的“读万卷书，行万里路”的旅程，让她看清了沙皇统治的腐朽本质，坚定了对祖国解放的信念。而在偶然间得到的能够记录神树神谕的“千里眼日记”，不光让她的眼疾有所好转，更让她成为了一名坚定的神树信徒，投向了大赦的怀抱，不遗余力地与大赦和神树信仰的敌人奋战，直到在抗击荒魂的过程中当选为新一任神祇伯，走上了权力的顶峰。但是——\n\n明明是大赦为波罗的海带来了解放，明明是大赦为波罗的海找到了灵魂的方向，明明只有大赦才能为波罗的海带来未来，这群不信者却依然冥顽不化，明里暗里与大赦较劲不说，还要用那些异端邪说蛊惑神树的子民，现在居然肆无忌惮胆大妄为到了操纵选举的程度，就为了把那些曾经骑在神树信仰和波罗的海人头上的老主子给请回来！这么多年来的奋斗，似乎就要全部化为乌有了。\n\n“看来……不下点猛药，果然是不行了呢……”\n春日野椿不会容许波罗的海再次落入不信者的手中，更不会容许大赦和神树信仰的地位遭到挑战，倘若没有办法从政治上拿到领导权，那么她也不介意如前任神祇伯那般，用暴力手段夺回本应属于大赦的地位，而她的心中也早已酝酿了具体的规划：\n首先，对楠芽吹、国土亚耶等防人指挥层明升暗降，让祓禊室看住她们，用高官厚禄堵住她们的嘴，同时命令自己的亲信们以雷霆手段接管防人的控制权，并不惜一切办法拉拢刀使这类维持政治中立的武装，从而尽可能的在混乱开始前掌握尽可能多的武装力量；\n其次，对于那些政府内部的障碍，作为沙皇走狗的七大战姬自不必说，即便是上里日向、乃木园子、白鸟歌野这些家喻户晓的英雄人物，如果届时愿意识大体、顾大局，自己不介意继续与她们分享权利，但只要她们敢挡在自己面前，自己也绝不会瞻前顾后、心慈手软；\n最后，尽快完成与安兹乌尔恭的接触，即便这无异于与虎谋皮，自己也绝不愿再对东南两面的宿敌卑躬屈膝，那具冢中枯骨的力量也足以作为自己最后的底牌，打破波罗的海的僵局，让她回归到神树的指引之下。\n\n春日野椿打开自己办公椅后方的暗格，取出一只镶嵌着金边与珠宝的长方形盒子，打开它，里面是绿色的卷轴，正是那曾记录着带给了自己真正的救赎的神谕的“千里眼日记”。\n作为现今唯一一位、也可能是最后一位能接受神谕的巫女，春日野椿需要神树再一次予她以启示，便拂去了蒙在卷轴上面的薄尘。\n\n卷轴徐徐展开，神谕于此显现——"
 BAL_ele.11.a: "“我以神之名铸造此物，汝等无罪！”"

 BAL_ele.12.t: "形势明朗"  #大选民调结束#
 BAL_ele.12.d: "随着全国范围最后一轮民调统计工作的顺利结束，大选的形势已经明朗。在正式投票前，各方势力还有一些最终调整的时间。"
 BAL_ele.12.a: "让我看看"

 BAL_ele.13.t: "园子总统的副手"  #蓝色支持度最高#
 BAL_ele.13.d: "以临时总统的身份带领共和国一同走过风雨飘摇的困境，以半身神铸的躯体鼓舞民众们共同迎接神树不再的生活，乃木园子无疑是大赦乃至共和国上下都高度认可的总统人选，民调形势也证明了这一点。\n\n因此，大赦本次的内部会议也不会再在总统人选的决定上浪费时间，会议重心被放在了为园子挑选合适的副手这一议题上。"
 BAL_ele.13.a: "永远的朋友——东乡美森"
 BAL_ele.13.b: "大赦神祗伯——春日野椿"

 BAL_ele.14.t: "红色的勇者们"  #红色支持度最高，蓝色＞白色#
 BAL_ele.14.d: "事实证明，乃木园子力排众议推举出左翼候选人的决定是正确的，在左翼支持度不断走高的社会环境下，这一举措为我们击败战姬集团占得了关键先机。\n\n在大赦的左翼候选人中，结城友奈、高岛友奈和白鸟歌野三人的支持度基本保持了齐头并进，同时，三人对这一形势均表示了谦让，将选择权交到了勇者会议手中。在大选投票前，我们可以选择为其中一位投入更多的资源，以确保其稳定当选。"
 BAL_ele.14.a: "神树深爱的勇者——结城友奈"
 BAL_ele.14.b: "友奈之名的起源——高岛友奈"
 BAL_ele.14.c: "爱斯兰的农业王——白鸟歌野"

 BAL_ele.15.t: "故主归来"  #白色支持度最高#
 BAL_ele.15.d: "传承数百年，战姬们在波罗的海这片土地上的民意根基早已无可撼动，联合政府推行的宗教改革政策更是进一步削弱了大赦的势力，柳德米拉小姐的一骑绝尘是必然的结果，共和国总统人选已经毫无争议。\n\n至于副手的人选，战姬内部则是推举由德高望重的赫拉格将军担任，赫拉格将军虽为异乡人，但无人会忘记他十余年来为吉斯塔特的付出，这个位置是他应得的。"
 BAL_ele.15.a: "吉斯塔特的主人回来了"

 BAL_ele.16.t: "唯一的胜利者"  #红色支持度最高，白色＞蓝色#
 BAL_ele.16.d: "无论是否存在外部势力干涉，艾里奥诺拉的胜利都已经是板上钉钉的事实，同时，她在竞选过程中的行为皆完全合法。艾里奥诺拉做到了正面击败了两大竞选集团，成为了大选唯一的胜利者。\n\n对共和国内左翼思潮的忽视成为了战姬集团失利的致命因素，不过，她们也还来得及补救，通过莉姆艾利莎的牵线搭桥，柳德米拉破天荒的主动低头，表示希望修复双方的关系，艾里奥诺拉对此也表示了认可。"
 BAL_ele.16.a: "一个人的力量能赢得一时的胜利，但不会是一世的胜利"

