#事件
 BAL_pol.01.t: "吉斯塔特共和国全体会议"
 BAL_pol.01.d: "风雨飘摇之中，吉斯塔特共和国艰难的走到了建国的第十八年，在过去的十八年间，共和国完成了与战姬的和解，抵御了荒魂的袭击，稳定了国内的局势，并顺利度过了神树散华、信仰主体逝去的混沌期。经吉斯塔特共和国1936年全体会议研究决定，通过以下工作事项：\n\n 1. 着重统计工作，由莉姆艾利莎牵头，上里日向协助，内政部具体负责，完成对共和国境内土地面积、土地归属、人口数量、工业基础、经济情况等多方面关键数据的统计和汇总，为未来的建设工作奠定数据基础。\n 2. 推动军事改革，由乃木若叶牵头，楠芽吹协助，选拔防人部队中的高素质人才，并筛选、任用前政权中可靠的技术人才，创建共和国的独立海空力量，并将有意复员的防人补充至共和国行政、司法等工作中。\n 3. 确定宗教管理改革计划，由·春日野椿及瓦伦缇娜牵头，大赦神议殿和政府机关共同商议，确定吉斯塔特共和国未来的宗教管理制度的改革方案，其中着重商定·对外来宗教的宗教税问题。\n 4. 慎重分析白鸟歌野改革计划和奥露嘉·塔姆改革计划的可行性。基于以上数项工作的工作成果，特别是统计工作的统计成果，分别分析两项改革计划的可行性和优劣势，最终敲定未来数年内的工作方向。\n 5. 大赦神社方面承诺，在建国二十周年之际，即1937年2月24日，结束紧急管制，将行政权力完全让渡至共和国政府，并举行吉斯塔特共和国第一届民主选举，完成共和国由神权国家向现代化民主国家的过渡。\n\n“尽管神树大人已经逝去，但让我们还是如往常那般一样”"
 BAL_pol.01.a: "向神树大人，拜——"

 BAL_pol.02.t: "防人的未来"
 BAL_pol.02.d: "勇者，大赦治下每一位孩子所憧憬的对象，但无奈的是，只有被神树所选中之人，才能得到祂的祝福，成为真正的勇者。为了践行神树的意志，也为了回应这些未选之子的热忱，大赦将她们组织了起来。她们从小接受大赦的训导，以勇者们的标准进行着严苛的训练，只为将自己的力量献与神树和大赦，她们便是“防人”。\n\n与数量稀少的勇者不同，防人部队具备相当的规模，她们也因此成为了独立战争时期的中坚力量，在勇者们攻坚破难的同时，防人在广阔的战线上稳步推进，平凡的防人们与勇者一同为共和国夺下了今天的独立。\n\n防人部队作为共和国难得的高素质且政治可靠的武装，至今仍是共和国陆军的骨干力量。但为了构建现代化的军事和行政体系，我们需要将具备专业知识的防人们投入到海、空军的建设之中，部分具备管理经验者则会转入行政、安全等工作。防人部队的拆分是共和国人才调度计划的关键一环，但防人长期保持着高度集中化，且仅听命于大赦神议殿，拆分工作势必会触动大赦的利益，这必然会遭致严重的阻力，我们需要谨慎行事。"
 BAL_pol.02.a: "完全拆分改革防人部队"
 BAL_pol.02.b: "保留已有组织架构，精简成员"

 BAL_pol.03.t: "宗教税收"
 BAL_pol.03.d: "立国之初，大赦面对的是一个极其陌生的国际环境，为了保障共和国的稳定和向心力，我们将神籬教确立为大赦唯一官方宗教，非神籬教信众需缴纳吉兹亚税，即人头税，且其余外来宗教需额外缴纳一系列税务，包括宗教场所税、仪典税、布施税等一系列税项。宗教保护政策遭致了外国的大量批评，但也的确在抗击荒魂的困难时期中保障了人民信仰的坚定，它为共和国的发展做出了应有的贡献。\n\n如今共和国局势已经趋于稳定，考虑到未来对外交往及吸引投资，我们应当适当放松宗教管制，改革宗教税制度，向各潜在合作国释放善意的信号。但大赦神议殿恐怕不会这么轻易的同意动摇自己的根基。"
 BAL_pol.03.a: "为了共和国的发展，放开宗教管制"
 BAL_pol.03.b: "考虑到大赦的态度，仅免除吉兹亚税"

 BAL_pol.04.t: "勇者系统"
 BAL_pol.04.d: "随着一代代勇者的传承，勇者系统也不断的迭代，从粗暴的强化到全面的增幅，从勇者付出一切的满开到神树自我牺牲的祝福。最新式的勇者系统通过神树的祝福，在对勇者们负荷较小的同时保留了“满开”这一爆发手段，在独立战争中成为了我们最锐利的矛和最坚固的盾。但神树的散华，让现有勇者系统完全失去了效能，为此，我们需要重新设计新的勇者系统。\n\n乃木园子提出的方案，是基于第二代勇者系统，开发完全摆脱神树且无使用门槛的勇者系统。二代勇者系统具备稳定度高、负荷小、对神树依赖性低的优点，但相应的，这一代勇者系统在平均出力上仅略胜于初代，极限出力则为历代最低。不过，乃木园子也提出了对应的弥补措施——向防人部队开放这一技术，通过以量取胜的方式弥补单体战力的不足。这一方案稳定且便捷，但会严重影响我们关于“勇者”的具体定义，也因此引发了相当大的争议。\n\n另一项设计方案则由春日野椿提出，基于第三代勇者系统进行设计。三代勇者系统是最早做到可控“满开”的勇者系统，与二代相比，在同样不依赖神树的前提下，出力方面做到了质的飞跃。但奇迹是有代价的，“满开”的代价便是勇者的身体、感官、记忆，“满开”次数越多，所失去的也越多。这一将勇者作为活体电池的系统最终遭致了当代勇者的公开对抗并最终被废弃。但神议殿方面坚持，在神树已逝的现在，要获得足以自保的力量，就必须重启这一代勇者系统。同时，新系统也只能向极少数人员开放，只有共和国部队中那些内外皆钢的精锐才能驾驭这一系统。\n\n新一代勇者系统设计原型的选择不仅仅是科技或国防问题，我们必须谨慎选择。"
 BAL_pol.04.a: "基于二代勇者系统设计"
 BAL_pol.04.b: "基于三代勇者系统设计"

 BAL_pol.05.t: "现代化改革计划"
 BAL_pol.05.d: "基于共和国现状和个人的实际经验，塔林的白鸟歌野和里加的奥露嘉·塔姆分别提出了各自的现代化改革建议，通过前段时间的工作，我们也能够更加客观理性的分析这两项计划到底哪条道路才是共和国的现代化之路。\n\n白鸟歌野和她的挚友藤森水都两世扎根于北方的塔林地区，在荒魂退散后，她们深植吉斯塔特的农村地区，并汇总报告了共和国严峻的农村局势——因为长期的封闭和战乱，共和国农业生产的组织形式和技术机械均远落后于时代，若脱离农村贸然推进城市化、工业化，共和国有极大概率陷入严重的饥荒问题并导致农业生产进一步崩溃，而全国范围的土地统计也证明白鸟歌野所言非虚。白鸟歌野建议需要先切实改革吉斯塔特农村地区的落后情况，将农业生产的基础磊实，保障现代化改革能够在一个坚实的基础上推进。\n\n奥露嘉·塔姆则根据自身战姬世家的素养，结合在里加的工作实际，认为共和国在度过动荡时期后，目前处于全方面的疲弱。而逐项问题缓慢解决的结果便是共和国将无止境的落后于时代，最终再次变成大国案板上的鱼肉。必须通过高素质人才的培养，同时向各行业注入发展动力，从根本上改变吉斯塔特的落后局面，为共和国争取到在国际上发声的机会。奥露嘉·塔姆建议在保障基础生产的前提下，应尽可能将资源倾斜至教育领域，尽快建立吉斯塔特自己的高等教育体系，并尝试与外国高校建立官方合作，派遣留学生进行交流学习。"
 BAL_pol.05.a: "白鸟歌野计划"
 BAL_pol.05.b: "奥露嘉·塔姆计划"

