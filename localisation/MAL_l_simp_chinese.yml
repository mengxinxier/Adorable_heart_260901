  MAL_8_desc: ""
  MAL_7: "提高教育资金"
  MAL_7_desc: ""
  MAL_15: "完成卡莲水坝"
  MAL_15_desc: "建在幻影境和幽谷省沿线的河上。建造大坝的长期以来一直是建造大坝的提议地点，该大坝将控制洪水、提供灌溉和产生水力发电。大坝为水晶镜地、幽谷省和幻影境提供电力，时至今日仍然是一个主要的旅游景点。"
  MAL_48: "幻泉城洪水恢复"
  MAL_48_desc: ""
  MAL_52: "土壤保护法"
  MAL_52_desc: "土壤保护服务的目标是帮助农民和牧场主掌握土壤保护和作物轮作的技术。该服务最初是内政部的一部分，后来转移到农业部，今天继续作为国家资源保护局。"
  MAL_36: "扩建菖蒲园港头"
