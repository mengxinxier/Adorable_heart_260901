  MAL_45_desc: ""
  MAL_28: "瑟利娅码头"
  MAL_28_desc: ""
  MAL_43: "保护海岸贸易"
  MAL_43_desc: "海盗猖獗我们需要对船队进行一定的安全保障措施"
  MAL_59: "夏连特拉工业化"
  MAL_59_desc: ""
  MAL_49: "安置房屋"
  MAL_49_desc: "我们将出动一部分资金，进行建设临时住房，可以让无家可归之人有暂时的庇护所"
  MAL_56: "重新使用艾塔尔水晶军械库"
  MAL_56_desc: ""
  MAL_58: "夏连特拉液态碳公司"
  MAL_58_desc: "该区基于公司生产的苏打水喷泉配件.我们可以把工厂而建立的坦克部件，进一步扩大我们的输出。"
  MAL_20: "工业组织委员会"
  MAL_20_desc: "通过促进工会，我们可以实现更好的工作和支付标准，以帮助进一步推进."
  MAL_21: "工业革命"
  MAL_21_desc: "通过周密的城市规划和适当的建筑实践，我们可以最大限度地提高我们工厂的土地使用率。"
  MAL_24: "发展虹光工业中心"
  MAL_24_desc: "虹光的城市化带来了更多来自周边地区的人们寻找工作和教育.将提供我们优质的人员以及可能的设备生产。"
  MAL_25: "工匠精神"
  MAL_25_desc: "社会文明进步的重要尺度、是工人们制造前行的精神源泉、是企业竞争发展的品牌资本、是员工个人成长的道德指引。“工匠精神”就是追求卓越的创造精神、精益求精的品质精神、用户至上的服务精神。"
  MAL_22: "总工会"
  MAL_22_desc: "工作是人类生活的核心部分，而组建工会是组织社会主义的基本部分。我们应该承认这一点，并确保工会中具有强制性话语权，只有这样才是恰当的。"
  MAL_23: "大都市区"
  MAL_23_desc: "我们必须提高基础设施.这样我们可以更容易地扩大我们的行业达到它。"
  MAL_26: "邀请苏联顾问"
  MAL_26_desc: "如果我们要支持苏联为世界工人带来自由的斗争，我们需要通过向他们学习来改善我们的工业。"
  MAL_27: "夏连特拉国家计划委员会"
  MAL_27_desc: "如果我们要支持苏联为世界工人带来自由的斗争，我们需要通过向他们学习来改善我们的工业。"
  MAL_30: "革命党快速解决经济危机"
  MAL_30_desc: ""
  MAL_41: "女工"
  MAL_41_desc: "集体农庄的五分之四的工人是妇女，在公共就业中妇女的比例从战前的五分之二上升到了四分之一到四分之三"
  MAL_32: "轮胎厂"
  MAL_32_desc: "为了满足汽车和飞机轮胎的需求，我们将扩大轮胎工厂。"
  MAL_42: "平等分发粮食"
  MAL_42_desc: ""
  MAL_32: "军用造船厂改建民用"
