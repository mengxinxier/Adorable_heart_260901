  MAL_47: "电力公司"
  MAL_47_desc: "在新的发电厂和更好的电线帮助下，我们可以确保我们更多的人获得电力的好处"
  MAL_53: "军用工厂"
  MAL_53_desc: "我们的军事机器因为生产能力不足而落后了.我们需要专注于本土的军事装备生产，以保证边境上的部队能不断得到新装备。"
  MAL_54: "炸药公司"
  MAL_54_desc: "扩大我们的军事工业"
  MAL_55: "虚幻都会弹药厂"
  MAL_55_desc: "取代旧的虚幻都会弹药厂建立一个新的军事工业综合体。"
  MAL_17: "国际投资者"
  MAL_17_desc: "我们应该鼓励外国投资者看我们的国家，这将改善我们的产业！"
  MAL_5: "支持城市化"
  MAL_5_desc: "大城市的工作和机会应该吸引更多的人。"
  MAL_9: "连接城市"
  MAL_9_desc: "是时候克服我们的自然分歧，把我们的国家连在一起了。"
  MAL_18: "社会援助方案"
  MAL_18_desc: "在街上挨饿的人们，我们必须建立一个社会援助计划来帮助我们的人民。"
  MAL_51: "经济复苏"
  MAL_51_desc: "是时候让夏连特拉走出大萧条，再次成为一个繁荣的国家。"
  MAL_29: "进口粮食"
  MAL_29_desc: ""
  MAL_39: "使用储备粮"
  MAL_39_desc: "我们要用之前储蓄的粮食来缓解饥荒"
  MAL_19: "投资私营企业"
  MAL_19_desc: "好的经济不值得嘲笑.无论我们选择走哪条路，我们都需要一个强大的私营部门来帮助我们建立我们所希望的未来。"
  MAL_35: "注重贸易收入"
  MAL_35_desc: "出售资源来缓解国内危机"
  MAL_13: "改善城市道路"
