####杂项####
  POLITICS_LONG_YUN_DESC: "曲从滇北的战火中崛起，以滇军为根基结束了云南的内乱。执掌五华山十余年，她整顿滇币与财政，经营个旧锡矿和东川铜矿，又修商路、办工坊，在巫家坝筹建航空力量。如今，她打算用「万世铭」推进集权与工业化。卢汉等起家旧部对整军不满，南疆诸寨反对铁轨深入山林，矿工也已开始自行组织。十年治滇攒下的家底，成了各方争夺的筹码。"
  YUN_his_page_01_title: "五华山十年"
  YUN_his_page_02_title: "山铃与矿火"
  YUN_his_page_03_title: "1936年的云南"
  YUN_Country_History_Page_01: "曲从滇北战火中打出一支滇军，在二十年代末平定省内纷争，将军政大权收归五华山。她整顿滇币，统筹个旧锡矿与东川铜矿的外贸，以矿税修筑商路、兴办昆明工坊，又在巫家坝筹建航空力量。隔着群山，中原的战火一时难以抵达昆明，云南由此攒下十年家底。"
  YUN_Country_History_Page_02: "五华山的新政越推越急。蒲牢要求整编老滇军，卢汉和孙渡不肯轻交兵权。铁路与矿道伸入滇西、滇南，嘉慧把散居的诸寨召集起来，向五华山追讨被毁的水源和圣林。个旧矿工则在不断加码的配额下组织互助，王耀城与林清澜的「共享家园」就从这些矿井与工坊里生长出来。"
  YUN_Country_History_Page_03: "1936年，曲仍掌握昆明与巫家坝，滇东防线仍由老滇军镇守。滇越铁路和滇缅商道维系着云南的对外贸易，也为陆苍的马帮提供了穿行关隘的路。眼下五华山须同时应付整军僵局、矿区动荡与南疆抵抗。局势一旦失控，个旧的罢工和密林的战鼓都可能传到昆明。"
  YUN_GATHERING_STORM_DESC: "曲在五华山治滇十余年，用个旧的锡、东川的铜和通往南洋的商路撑起了昆明的工坊与巫家坝的航空事业。如今华胥要求加码矿产配额，蒲牢准备整编老滇军，卢汉手握滇东重兵，迟迟不肯让步。\n\n南疆的嘉慧已召集诸寨，个旧的矿工也在「共享家园」的名义下组织起来。1936年的云南依然由曲掌控，五华山的命令却越来越难传出昆明。"

####精神###
  YUN_kowloon_blueprint:0 "九龙治滇，十年积蓄"
  YUN_kowloon_blueprint_desc:0 "曲主政五华山十余载，整顿币制、修通商路、大兴矿业与航空，为彩云之南攒下了冠绝西南的家底。然而近年来华胥推行的冷酷配额与高度集权，正让这套原本稳健的秩序日趋僵化与高压。"
  YUN_old_yunnan_clique_remnants:0 "滇军旧习与新制掣肘"
  YUN_old_yunnan_clique_remnants_desc:0 "随曲平定云南的老滇军虽忠于五华山法统，却早已派系盘根错节。当蒲牢与华胥试图将其彻底改造成“九龙新军”时，卢汉等老牌将领的抵制令军政中枢陷入了漫长的无声内耗。"
  YUN_gejiu_sparks:0 "个旧矿火与共享暗潮"
  YUN_gejiu_sparks_desc:0 "为了支撑五华山日益庞大的军备开支，锡矿坑道里的压榨终于突破了底线。王耀城与林清澜播下的“共享家园”种子已在昆明工坊与个旧矿区悄然生根，连守备部队基层也开始动摇。"
  YUN_southern_gu_unrest:0 "背弃之怒：南疆圣铃"
  YUN_southern_gu_unrest_desc:0 "出身群山的云南王亲手将铁路与矿镐刺入了南疆密林。圣女嘉慧怒斥五华山背弃了先辈的誓约，千寨战鼓与诡谲蛊阵正日夜撕咬着滇西与滇南的补给线。"
  YUN_shadow_of_the_demon:0 "暗夜马帮与魔道窥伺"
  YUN_shadow_of_the_demon_desc:0 "高山商道间活跃着陆苍的走私马帮，而更令人脊背发凉的，是两名来历不明的狠辣散修——古月方源与白凝冰正潜伏在滇境暗处，静候五华山十年秩序崩裂的那一刻。"

