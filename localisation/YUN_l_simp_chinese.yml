####事件####
  yun.1.t: "彩云暗涌"
  yun.1.d: "曲坐镇五华山十余年，靠着个旧的锡矿和通往南洋的商路，在昆明办起工坊，又在巫家坝筹建了航空力量。如今新军催着整编，老滇军扣着兵权，南疆诸寨和个旧矿工也各有诉求。昆明仍在曲的掌控之下，五华山却已很难同时安抚各方。"
  yun.1.a: "先稳住五华山。"
  yun.2.t: "云南内乱爆发"
  yun.2.d: "昆明传来的镇压令未能平息骚乱。个旧矿区的冲突已蔓延到交通线上，地方驻军也开始各自设卡。云南脱离原有的隶属关系，卷入冲突的各地暂时划为非军事区。"
  yun.2.a: "昆明的局势已经失控。"
  yun.3.t: "谁将掌管昆明？"
  yun.3.d: "数周的对峙终于结束，封锁各地的关卡陆续撤除。昆明的军政机关即将重新运转，旧滇军、共享家园和各地武装都在等待新的命令。云南将由谁掌权？"
  yun.3.a: "曲稳住了五华山。"
  yun.3.b: "共享家园接管昆明。"
  yun.3.e: "地方强硬派夺取了政权。"
  yun.4.t: "云南来电"
  yun.4.d: "云南陷入内乱，五华山请求我们派遣人员并拨发一批步兵装备。援助或许能帮助曲稳住昆明，但这些人手和装备也都是我们眼下所需。"
  yun.4.a: "暂不介入云南内乱。"
  yun.4.b: "向曲提供人员和步兵装备。"

  yun.1001.t: "五华山的抉择"
  yun.1001.d: "昆明局势未定，旧滇军、南疆诸寨和共享家园都在等待五华山的决定。谁来主持云南的新局？"
  yun.1003.t: "春城接管"
  yun.1003.d: "昆明的局势已经转变。共享家园将接过春城的政务，也将接过安顿军民的责任。"

####新闻####

