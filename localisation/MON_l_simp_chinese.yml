mon_flavor.25.a:0"可惜"
mon_flavor.25.b:0"来也得来，不来也得来"

mon_flavor.26.t:0"东北惊变"
mon_flavor.26.d:0"樱花人在皇姑屯的铁轨下埋了炸药。张作玲专列化作火球，辽满政府被伪满洲国取代，投机者易帜投敌，而仍有数千忠勇之士——不愿跪拜傀儡、更不屑与日寇为伍——毅然率残部突围，星夜西进投奔我方。"
mon_flavor.26.a:0"该死的樱花鬼子"

mon_flavor.27.t:0"帝国军士兵投诚我方"
mon_flavor.27.d:0"一些原本隶属于帝国军的士兵已经弃暗投明，向我军投诚。"
mon_flavor.27.a:0"欢迎"

mon_flavor.28.t:0"边军士兵叛逃"
mon_flavor.28.d:0"据临近蒙古边境的一座军营报告，近期该营部分士兵已经叛逃入关外，并窃取了部分武器装备。毫无疑问的是，这一切的幕后黑手又是他娘的[MON.GetNameDef]。"
mon_flavor.28.a:0"叛徒！"

mon_flavor.29.t:0"成功盗取军火"
mon_flavor.29.d:0""
mon_flavor.29.a:0"干得漂亮"

mon_flavor.30.t:0"军火失窃"
mon_flavor.30.d:0""
mon_flavor.30.a:0"可恶！"

mon_flavor.31.t:0"渗透失败"
mon_flavor.31.d:0""
