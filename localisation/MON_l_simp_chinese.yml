MON_buwangguangfudaye: "不忘光复大业"
MON_buwangguangfudaye_desc: "虽然军政府已在远东的流亡之地站稳脚跟，暂时肃清了内部的动摇分子，但帝弥托利深知，这偏安一隅的苟活绝非终点。在他眼中，解放那片被赤色洪流席卷的故土才是最终的目标。"
MON_ouyashijian: "意料之外的欧亚主义实践"
MON_ouyashijian_desc: "帝弥托利敏锐地意识到，若以征服者的姿态强行推行旧制，只会激起东方民众无尽的反抗，重蹈昔日帝国的覆辙。相反，他采纳了欧亚主义者的愿景——建立一个超越单一民族界限的、融合斯拉夫精神与东方智慧的“新欧亚共同体”。在这群学者的治理下，东方的土地不再是被掠夺的资源库或单纯的军事缓冲区，而是被重塑为实验新秩序的前沿阵地。"
MON_yiqieweileeluosi: "一切为了俄罗斯母亲"
MON_yiqieweileeluosi_desc: ""
MON_ouyalilunxuanjiang: "欧亚理论宣讲"
MON_ouyalilunxuanjiang_desc: "通过建立跨区域的巡回宣讲团，我们将向中国的广大民众阐述这一新秩序的逻辑：它既非旧式帝国的霸权复辟，亦非海洋自由主义的盲目模仿，而是一条基于大陆腹地自主性、强调多元文明共生与计划协调的独特道路。"
MON_wenhuajiaoliu: "中俄文化交流"
MON_wenhuajiaoliu_desc: "我们坚信，真正的团结不仅仅建立在战略利益的契合之上，更根植于彼此文化的深刻理解与情感共鸣。通过大规模互办文化年、推动文学艺术互译以及促进青年一代的广泛互动，让两国民众的心贴得更近。"
MON_lalonghanzuzhishifenzi: "拉拢汉族知识分子"
MON_lalonghanzuzhishifenzi_desc: "庞大的汉族人口是我们统治的基础，但真正掌握社会脉络、控制舆论走向的，是那些受过教育、深谙传统典籍的士绅与知识分子。我们必须将这些精英阶层纳入我们的统治架构之中。一旦这些‘社会的头脑’转而支持我们，广大的汉族民众必将随之归心。"
MON_jinyibuzhenghemenggu: "进一步整合蒙古"
MON_jinyibuzhenghemenggu_desc: "草原的松散部落结构已无法适应现代总体战的需求，各旗王公仍保留着过大的自治权。我们将推行激进的行政改革，废除世袭王公的特权，将草原划分为标准的行政区。通过强制定居政策与集体化牧场建设，我们要将飘忽不定的游牧人口转化为稳定的纳税户和兵源。"
MON_renmingdifangzhengquan: "任命亲俄地方政权"
MON_renmingdifangzhengquan_desc: "铁蹄可以踏平城池，却无法独自治理这片广袤而陌生的东方疆域。语言的高墙与文化的深渊，正让每一道来自北方的指令在传递中失真，每一次资源汲取都激起更深的仇恨暗流。我们不需要更多的占领军，我们需要的是那些熟悉本地脉络的代理人。"
MON_qiangpohanrenlaodong: "动员汉族工人"
MON_qiangpohanrenlaodong_desc: "为了光复被赤色瘟疫吞噬的故土，我们亟需一支不知疲倦的生产大军。而这片土地上最坚韧的力量——数亿汉族劳工，才能成为我们重建战争机器的基石。我们要告诉每一个汉族工人：你们生产的每一发子弹，都将射向那些践踏中俄两国传统与信仰的红色恶魔；你们锻造的每一块装甲，都是在为驱逐赤祸筑起铜墙铁壁。我们将建立高效的战时生产体系，让汉族工人的双手成为白军最可靠的后盾。"
MON_beifanggongyequ: "建设大后方"
MON_beifanggongyequ_desc: "中国北部的平原、矿山与未被战火完全摧毁的工业节点，将不再仅仅是临时的避难所，而是被帝弥托利将军亲自选定为‘自由俄罗斯’的神圣大后方。我们将把流亡的政府机构、核心的军工技术以及最精锐的白军残部，深深扎根于这片土地。从哈尔滨的兵工厂到山西的煤矿，从华北的粮仓到东北的铁路网，每一寸土地都将被重新规划，服务于同一个终极目标：积蓄力量，誓师西征。这里的工厂将日夜轰鸣，不是为了满足占领者的贪婪，而是为了铸造打回莫斯科的利剑；这里的田野将产出丰饶的粮食，不仅养育汉族百姓，更将喂养那支即将雪耻的白军铁骑。"
MON_chengnuozhanhouzizhi: "承诺战后自治"
MON_chengnuozhanhouzizhi_desc: "在生死存亡的至暗时刻，希望是比子弹更珍贵的弹药。为了换取汉族民众对反攻事业的全力支持，我们将作出承诺，一旦白军成功光复莫斯科、彻底铲除赤色暴政，我们将立即协助建立一个完全由中国人自己做主的民主政权。至于这份承诺在硝烟散尽后如何兑现，那是胜利者才有权定义的‘未来细节’。"
MON_fangemingzhihuo: "反革命之火"
MON_fangemingzhihuo_desc: "我们将通过传单、广播、街头戏剧以及教会布道，向每一位中国百姓生动地描绘苏维埃政权的“离经叛道”。我们要让汉族民众深刻意识到，白军并非外来占领者，而是阻挡这股红色洪流淹没中华文明的最后堤坝。布尔什维克若胜，不仅俄罗斯将万劫不复，中国的传统、家庭与信仰也将灰飞烟灭。这场宣传战将把对白军的‘忍受’转化为对布尔什维克的‘恐惧’与‘仇恨’。当人们相信身后的敌人比眼前的驻军可怕一万倍时，占领区的秩序将自然稳固。"
MON_yuzhonghuajiaohuihezuo: "与中华正教会合作"
MON_yuzhonghuajiaohuihezuo_desc: "我们将赋予中国的东正教会前所未有的特权与地位：恢复被赤俄切断的圣统联系，资助修缮破败的教堂，并允许其在占领区内自由传教。作为交换，教会的神职人员将成为白军最忠诚的宣传员与秩序维护者。对于深受传统伦理影响的汉族百姓而言，来自神父的道德约束往往比宪兵的枪口更具威慑力。"
MON_haozhaoliuwangzhelaihua: "号召流亡者来华"
MON_haozhaoliuwangzhelaihua_desc: "散落在全球角落的俄罗斯灵魂啊，听好了！莫斯科的钟声已被赤色暴徒的喧嚣淹没，圣彼得堡的冬宫已沦为无神论者的舞厅，但在中国，自由俄罗斯的旗帜依然高高飘扬。帝弥托利将军在此向所有流亡海外的同胞发出最急切的召唤：回家吧，回到这个东方的避难所，回到我们最后的堡垒！这里不再是异乡，而是重建祖国的摇篮。无论您是曾在沙皇麾下浴血奋战的老兵，还是精通机械的工程师、救死扶伤的医生、或是怀揣知识的学者，这片广袤的土地都急需您的才华与热血。我们将为每一位归来的流亡者提供土地、住所与公民身份，让您在这里重拾尊严，不再做寄人篱下的乞丐，而是成为新俄罗斯的奠基者。"
MON_hanrenfuzhujun: "汉人辅助军"
MON_hanrenfuzhujun_desc: "光复俄罗斯的伟业，绝不能仅靠流亡者日渐枯竭的热血。面对苏维埃政权那看似无穷无尽的人力洪流，我们必须在这片古老的东方土地上挖掘出被忽视的巨大潜能——人力资源。我们将向那些渴望秩序、畏惧赤化或单纯追求军饷的汉族青年敞开大门。他们将被编入独立的营连，配备俄式武器，接受白军军官的严格训练，在未来的反攻中充当马前卒。当然，我们必须时刻保持警惕。这些辅助军只能作为盾牌和利剑，绝不能成为大脑。他们的指挥权必须牢牢掌握在俄罗斯军官手中，他们的补给线必须依赖我们的后勤，他们的忠诚必须通过不断的胜利和严厉的纪律来维系。只要驾驭得当，这支由汉人组成的辅助军将成为白军在东方最锋利、也最廉价的獠牙，替我们撕碎一切敢于反抗的敌人，直到最后一滴血流干。"
MON_xiangmosikejinjun: "向莫斯科进军！"
MON_xiangmosikejinjun_desc: "漫长的等待已经结束，流亡的泪水已化作复仇的烈焰。这是一次为了灵魂与荣耀的终极远征——目标直指那个被赤色阴霾笼罩了太久的中心：莫斯科。沿途的每一座村庄、每一座城市，都将成为我们复兴的基石。我们将以雷霆之势粉碎红军的防线，解放那些在恐怖统治下呻吟的同胞。不要怜悯敌人，因为他们的失败意味着文明的重生；不要畏惧严寒，因为心中的火焰足以融化西伯利亚的坚冰。"
MON_houqinsilingbu: "后勤司令部"
MON_houqinsilingbu_desc: "战争不仅是刺刀与火炮的碰撞，更是钢铁、粮食与燃油的消耗战。只有当后勤的齿轮完美咬合，战争的巨轮才能滚滚向前。从今天起，效率就是生命，补给就是胜利。让我们用无与伦比的组织能力，将东方的资源转化为西方的雷霆，确保这场史诗般的远征永不因匮乏而止步！"
MON_fangongshizijun: "反布尔什维克十字军"
MON_fangongshizijun_desc: "赤色威胁无国界，若莫斯科不倒，伦敦与巴黎亦将难保。这不仅是俄罗斯的复国之战，更是全球文明存亡的终极防线。我们向所有自由世界发出急迫呼吁：放下地缘成见，每一分力量都是刺穿红色铁幕的利刃。让我们将这场战争定义为捍卫秩序与信仰的‘新十字军’。汇聚全球的保守之力，以金钱、武器与鲜血共同浇灌胜利之路。"
MON_xuanchuangongshi: "宣传战线"
MON_xuanchuangongshi_desc: "我们要将成千上万名特工与宣传员秘密遣返至乌拉尔山以西。他们的任务不是破坏铁路，而是摧毁信念。利用地下印刷所、伪装电台和收买的基层干部，我们将把无数流言，在红军的战壕里、工厂的车间中疯狂传播。我们要让每一个苏联士兵在扣动扳机前都产生一丝迟疑：‘我们是在保卫祖国，还是在为暴君殉葬？’笔杆子亦是枪杆子，谣言亦是炮弹。在这场心理战的掩护下，我们将瓦解布尔什维克的意志基石，让克里姆林宫在听到我们的脚步声之前，先听到其内部崩塌的巨响！"
MON_qiangzhengpingmin: "强征平民"
MON_qiangzhengpingmin_desc: "战线已推进至西伯利亚腹地，但白军的兵力正被红军的顽强抵抗消耗殆尽。为确保反攻不因人力枯竭而停滞，帝弥托利将军下令对占领的苏联领土实施强制征召。所有适龄男性将被迅速编入白军，接受基础训练后投入前线。这不是对平民的压迫，而是为光复故土所必需的战时动员。"
MON_jiudijielue: "就地劫掠"
MON_jiudijielue_desc: "在被解放的土地上，所有闲置的粮食、燃料与生活必需品，将被强制征调至反攻前线——这不是劫掠，而是对压迫者的历史清算，是为解放更多平民而必须付出的正义代价。为了更宏大的解放事业，局部的牺牲是必要的——这是文明对野蛮的必然反击，是正义对赤色暴政的最终审判！"
MON_jiefanglaogaifan: "解放劳改犯"
MON_jiefanglaogaifan_desc: "赤色暴政将无数灵魂囚禁于冰原之上的古拉格，今日，白军以光复者的姿态砸开这些地狱之门！虽然我们深知，铁窗之后并非尽是无辜之人，其中亦混杂着大量真正的凶徒与恶棍；但在推翻赤色魔权的首要目标面前，过往的罪行皆可被‘战时急需’所赦免。只要他们愿意拿起武器对抗红军，昔日的罪犯便是今日的义士。"
MON_shenglijiuzaiyanqian: "胜利就在眼前"
MON_shenglijiuzaiyanqian_desc: ""
MON_dayeweijing: "大业未竟"
MON_dayeweijing_desc: "莫斯科的红场仍在他国旗帜下飘摇，帝国的圣城尚未重光！尽管我们已粉碎赤色暴政，收复了广袤的东方疆土，但莫斯科及大量俄罗斯的神圣领土被他国的铁蹄强行割据。这不是胜利，而是未竟的使命！俄罗斯母亲的尊严不容玷污，每一寸失地都必须回归双头鹰的庇护。"
MON_guixiang: "俄罗斯，我们回来了"
MON_guixiang_desc: "听啊！那穿越了漫长严冬与无尽血火的钟声，终于再次在克里姆林宫的塔楼上敲响。曾经，双头鹰的旗帜在风暴中破碎，神圣的母土被赤色狂潮与异族铁蹄肆意践踏；曾经，我们流亡于西伯利亚的冰原，蜷缩在边境的残垣，被视为历史的尘埃。但今日，尘埃已化为雷霆，流亡者已化作复仇的洪流！"
MON_qingchubudangyidu: "清除布党遗毒"
MON_qingchubudangyidu_desc: "让布尔什维克遗留下来的政治官员们继续留任是一件危险的事情，我们无法保证他们是否仍忠于布尔什维克。在新的行政官员被派往俄罗斯各地前，我们需要一份足够详细的审查与肃反方案。"
MON_anfuminzhong: "安抚民众恐慌"
MON_anfuminzhong_desc: "战火初歇，民心未定。多年的动荡与内战让恐惧如瘟疫般蔓延，谣言四起，秩序摇摇欲坠。我们必须立即行动：以铁腕肃清趁乱劫掠者，确保粮食与燃料的公平配给，并派遣军官与神职人员深入社区。我们要用秩序取代混乱，用希望驱散阴霾，告诉每一个俄罗斯人：最黑暗的时刻已过，重建与安宁即将来临。唯有抚平内心的创伤，胜利才算真正圆满。"
MON_huifueguojingji: "恢复经济"
MON_huifueguojingji_desc: "祖国母亲在赤匪的蹂躏下变得满目疮痍，我们必须施行一套新的工业建设政策使俄罗斯再次强大。"
MON_jiangshangyougongjiangshi: "奖赏有功将士"
MON_jiangshangyougongjiangshi_desc: "俄罗斯的重光，非一人之功，而是无数忠勇儿女以血肉铸就的丰碑。从冰原的伏击到莫斯科城下的决战，正是将士们的无畏牺牲，才换来了今日的凯旋。凡在此役中建功者，无论出身贵贱，皆将获封土地、爵位与巨额抚恤。我们要让英雄荣归故里，让烈士家属衣食无忧，让每一枚勋章都闪耀着祖国的荣耀与承诺。"
MON_zhanxindeeluosi: "崭新的俄罗斯"
MON_zhanxindeeluosi_desc: "经过一系列的紧急举措，我们在光复领土重新建立起了属于我们的政治秩序，我们有能力进一步扩展我国的战后重建领域。"
MON_jiuguozhizhu: "救国之主"
MON_jiuguozhizhu_desc: ""
MON_jienabufenouyazhuyi: "接纳部分欧亚主义"
MON_jienabufenouyazhuyi_desc: "我们拒绝全盘接受激进的欧亚主义意识形态，那将动摇俄罗斯的斯拉夫根基与东正教灵魂。然而，在废墟之上重建大国，必须拥有超越偏见的实用主义眼光。欧亚主义理论中关于‘地缘独特性’与‘反西方依附’的洞察，恰是我们打破外交孤立、重塑战略自主的利器。"
MON_ganxiewomendeenren: "感谢我们的恩人"
MON_ganxiewomendeenren_desc: "在反攻的漫漫长路上，中国辅助军与俄罗斯子弟兵并肩浴血，从西伯利亚的雪原到伏尔加河畔，无数中华儿女献出了宝贵的生命与汗水。他们的物资车队穿越冻土，他们的战士用血肉之躯为我们挡住了最后的黑暗。这份恩情，重于泰山；这份情义，刻骨铭心。我们在此庄严宣告：中国人民不仅是战略伙伴，更是俄罗斯重生路上的‘恩人’与‘兄弟’。我们将永远铭记这份在战火中铸就的生死情谊。"
MON_chongjianguizujieji: "重建贵族阶级"
MON_chongjianguizujieji_desc: "历史的教训告诉我们，绝对的平等往往导向绝对的混乱。为了终结社会的原子化与道德的虚无，我们必须重新确立国家的脊梁——一个基于血统、功勋与责任的世袭精英阶层。让贵族精神回归：不仅是荣耀的象征，更是服务的承诺。通过重建这一稳固的社会金字塔基座，我们将用传统的等级秩序取代无序的竞争，确保俄罗斯在未来的世纪中，拥有坚不可摧的领导核心与文化灵魂。"
MON_hanweishenshengeluosi: "捍卫神圣俄罗斯"
MON_hanweishenshengeluosi_desc: "俄罗斯不仅仅是一个地理概念或政治实体，她是上帝在人间的最后堡垒，是‘第三罗马’精神的唯一继承者。在经历了异端思想的侵蚀与外敌的践踏后，我们庄严宣告：保卫祖国即是保卫信仰，守护疆土即是守护圣坛。"
MON_fuchoudezhongdian: "复仇的终点"
MON_fuchoudezhongdian_desc: "复仇的火焰不应再燃烧我们的未来，而应化作锻造和平的铁砧。我们不再为过去的伤痛而活，而是为了不让悲剧重演而战。让仇恨在此刻止步，让正义在此刻定格。我们宽恕那些被蒙蔽的灵魂，但永远铭记那些施暴的罪行。俄罗斯已从灰烬中涅槃，她不再是一个寻求报复的受害者，而是一个令人敬畏的守护者。复仇的终点，正是伟大帝国新生的起点。"
MON_hehurenmin: "呵护人民"
MON_hehurenmin_desc: "真正的力量源于民心。当政府像父亲呵护孩子般呵护人民时，人民便会像子女守护父亲般守护国家。让我们用关怀编织社会的纽带，用温情抚平历史的创伤。在这个新秩序下，没有任何一个人会被遗弃，因为呵护人民，就是呵护俄罗斯永恒的未来。"
MON_shanzhujingshen: "山猪精神"
MON_shanzhujingshen_desc: "‘山猪’这看似粗犷的外号，实为帝弥托利殿下力量与决断的最高象征。它不指蛮力，而代表在风暴中屹立不倒的钢铁意志：当敌人以为我们疲惫，便以雷霆之势碾碎其幻想；当世界等待妥协，我们便以绝对强硬的姿态劈开前路。"

MON_eluosichonghuishijie:0 "俄罗斯重回世界"
MON_eluosichonghuishijie_desc:0 "俄罗斯，这片广袤而充满力量的土地，注定在世界舞台上占据重要地位。我们将让世界重新认识俄罗斯的强大。在国际事务中，我们的声音将如洪钟般响亮，决策层的智慧和决断将引领世界走向和平与稳定。经济上，我们以丰富的资源和强大的工业基础，吸引各国前来合作，共同开拓新的机遇。军事上，我们的钢铁雄师将以无敌之姿展现在世界面前，守护国家的尊严和利益。外交上，我们凭借智慧和谋略，在复杂的国际关系中穿梭自如，为俄罗斯争取最大的利益。俄罗斯，将以其独特的魅力和实力，在世界的地位中绽放出耀眼的光芒。"
MON_chongduozhongya:0 "重夺中亚"
MON_chongduozhongya_desc:0 "中亚，这片连接东西方的重要地带，与俄罗斯有着深厚的历史渊源和战略意义。如今，俄罗斯将以坚定的决心和智慧，开启对中亚的战略布局。控制中亚，我们将获得丰富的自然资源，为国家的发展提供强大动力。同时，这也将拓展我们的战略空间，确保周边地区的安全与稳定。"
MON_chongduofenlan:0 "重夺芬兰"
MON_chongduofenlan_desc:0 "在北方的大地上，俄罗斯的荣耀之光从未黯淡。芬兰，这片与我们有着深厚历史渊源的土地，如今是时候重归俄罗斯的怀抱，共同书写新的辉煌篇章。曾经的联系不应被岁月割断，历史的纽带将再次拉紧。俄罗斯，以坚定的决心和强大的力量，举起北方统一之帜，迎接芬兰的回归，共创伟大国家的璀璨未来。"
MON_chongduoboluodihai:0 "重夺波罗的海"
MON_chongduoboluodihai_desc:0 "曾经，波罗的海是俄罗斯领土的重要组成部分。然而，一战的风云变幻使他们脱离了我们的怀抱。如今，俄罗斯已再次崛起，是时候让历史回归正轨，让那片曾经熟悉的土地再次沐浴在俄罗斯的光辉之下。"
MON_juxiongjuexing:0 "巨熊觉醒"
MON_juxiongjuexing_desc:0 "俄罗斯不需要依附于任何国家或势力，而是要坚定地踏上自强之路。俄罗斯，将以独步天下的姿态，书写新的历史辉煌。"
MON_xifangdediren:0 "西方的敌人"
MON_xifangdediren_desc:0 "国内革命及帝国崩溃时，我们失去了许多西境领土。现在，是时候建设基础设施，预备重新宣称我们的正统领土了。"
MON_duohuibisalabiya:0 "夺回比萨拉比亚"
MON_duohuibisalabiya_desc:0 "罗马尼亚境内有着大量的斯拉夫族裔，并且其阻断了我们与巴尔干斯拉夫人的陆地通道。为了一次性解决这两大难题，罗马尼亚的独立地位必须被终结，即便这意味着需要我们付诸武力。"
MON_baohubaergan:0 "保护巴尔干"
MON_baohubaergan_desc:0 "历史经验表明，我国的邻国常常会利用我们所暴露出的任何弱点。随着欧洲上空战云密布，我们绝不能忍受周边有任何忠诚可疑的邻国，巴尔干和小亚细亚各国必须选择是和我们一起还是与我们为敌。"
MON_xuanchengzhinianzhiguo:0 "宣称执念之国"
MON_xuanchengzhinianzhiguo_desc:0 "在历史的长河中，俄罗斯与波兰有着复杂而深刻的联系。波兰是俄罗斯民族历史拼图中不可或缺的一部分。这一宣称并非无端的扩张，而是对历史的尊重和正义的追寻。"
MON_diercidabeifangzhanzheng:0 "第二次大北方战争"
MON_diercidabeifangzhanzheng_desc:0 "瑞典一直是帝国侧翼的芒刺，他们不是反复攻击俄罗斯，就是试图拉拢包围网来对抗我们。彼得一世最早在波尔塔瓦击退过瑞典，然后在1809年我们又击败过他们。本以为，这会让他们明白自己的位置，但瑞典仍一直试图挑战我国在波罗的海地区的利益。现在，是时候一劳永逸地碾碎此等蕞尔小邦了。"
MON_jinjunbolin:0 "进军柏林"
MON_jinjunbolin_desc:0 ""
MON_zhongdongcelue:0 "中东策略"
MON_zhongdongcelue_desc:0 "最后的一系列征服行动将夺取西亚和博斯普鲁斯海峡的剩余部分，使我们能在争夺印度控制权时确保侧翼安全。从邻近的地中海至遥远的印度洋，我们终将无可争议地获得通往四海的航道。"
MON_chongqietuzhanzheng:0 "重启俄土战争"
MON_chongqietuzhanzheng_desc:0 "历史的车轮滚滚向前，但曾经的俄土冲突在俄罗斯的记忆中从未消散。如今，为了国家的荣耀与未来，我们决定重启俄土战争。这场战争并非为了侵略，而是为了捍卫俄罗斯的利益与尊严。在黑海之滨、高加索山脉，我们将与土耳其再次展开激烈的角逐。我们要争夺关键的地缘优势，确保俄罗斯在地区的主导地位。"
MON_ruqinyilang:0 "入侵伊朗"
MON_ruqinyilang_desc:0 "一旦战争降临，我们不能相信[PER.GetNameDef]政府会支持我们，同样我们也不相信他们一定不会加入一场侵略我们的战争。与其坐等观之，不如主动出击武力解决问题。"
MON_afuhanzhanzheng:0 "阿富汗战争"
MON_afuhanzhanzheng_desc:0 ""
MON_wangxiangdongfang:0 "望向东方"
MON_wangxiangdongfang_desc:0 "我们不能在远东领土被攻击时却不幸地发现我们没有为突袭做好准备。我们需要在当地兴建基础设施，以在需要时快速调兵。"
MON_suoqualasijia:0 "索取阿拉斯加"
MON_suoqualasijia_desc:0 ""
MON_yixueqianchi:0 "一雪前耻"
MON_yixueqianchi_desc:0 "很明显，樱花意图彻底掌控中国。一旦他们达成了这个目标，他们毫无疑问将转而向北索取西伯利亚的大量资源。我们必须先发制人。"

MON_chonghuilongyi: "重回龙椅"
MON_chonghuilongyi_desc: ""
MON_dazaiqianyuan: "大哉乾元"
MON_dazaiqianyuan_desc: ""


MON_dayuanguilai: "大元归来"
MON_dayuanguilai_desc: ""
MON_tianmingzaiwo: "天命在我"
MON_tianmingzaiwo_desc: ""
MON_kuozhangzhongxin: "扩张重心"
MON_kuozhangzhongxin_desc: "昔日的大元，疆域横跨欧亚，马蹄所至，万国颤栗。那是何等的辉煌！而如今的我们，虽据有华夏富庶之地，却如困于金丝笼中的雄鹰，折断了翱翔九天的翅膀。若朕止步于此，大元便只是一个换了姓氏的普通汉家王朝，那“大元”二字所承载的浩瀚天命，将在朕手中蒙尘。那些迂腐的儒臣劝朕“休养生息”，劝朕“守成保境”。哼，守成？在弱肉强食的丛林中，停滞即是倒退，保守便是灭亡！"
MON_bachiyulun: "把持舆论"
MON_bachiyulun_desc: "真正的帝国，不仅建立在广袤的疆土之上，更建立在统一的意志之中。朕不需要臣民们带着疑虑去追随，朕要他们带着狂热的信仰去冲锋。因此，必须让所有的笔墨、所有的戏文、所有的街谈巷议，都成为大元战鼓的回响。"
MON_bunengwangben: "不能忘本"
MON_bunengwangben_desc: "如今四海归一，不少宗室贵胄沉溺于江南的温柔乡，渐忘弓马骑射之术；朝堂之上，胡语渐稀，蒙俗渐淡，仿佛我们生来便是这汉家王朝的守成之主。此乃取死之道！若丢了草原的根，忘了祖宗的法，我们便只是一群穿着蒙元衣冠的普通汉人皇帝，再无资格号令欧亚，再无力量去践行那横跨世界的雄心。"
MON_shangfafenming: "赏罚分明"
MON_shangfafenming_desc: "战场上子弹不会分辨你是黄金家族还是寻常百姓，既然如此，为何要在军功爵禄上分三六九等？汉人士兵若能身先士卒，照样封万户侯；蒙古贵胄若是临阵脱逃，照样身首异处。军规不是摆设，更不是某些人逃避责罚的护身符。当千万将士知道，他们的每一滴血都不会白流，每一次冲锋都有可能改变命运时，这支军队才会爆发出真正的力量。赏要赏得让人眼红，罚要罚得让人胆寒。这就是大元铁骑再次纵横天下的根本所在。"
MON_changshengtiandezisun: "长生天的子孙"
MON_changshengtiandezisun_desc: "朕深知，大元的根基不在城池，而在信仰。黄金家族之所以能号令四海，非因武力强盛，而是因我们承了长生天的天命。如今朝堂之上，有人沉迷佛道，有人崇尚儒术，却忘了我们真正的守护者是谁。从今往后，祭天大典必须依古礼举行，萨满的鼓声要响彻大都，让每一个臣民都铭记——大元的皇帝是长生天在人间的代言人。让草原的信仰与帝国的威严融为一体，让长生天的目光见证大元的每一次远征。我们来自草原，终将回归苍穹，唯有天命，永世不灭。"
MON_jianlijungongfuheti: "建立军工复合体"
MON_jianlijungongfuheti_desc: "现代战争打的是钢铁与火力。昔日列强之所以横行，非因兵力众多，而是因军工体系完备。今欲图大业，必须将军械制造收归中枢，让工厂与军营结成一体。"
MON_xinrenhanrenjunguan: "信任汉人军官"
MON_xinrenhanrenjunguan_desc: "本国的兵源构成已是事实——汉人子弟占军队绝大多数，基层军官更是有八成出自汉人。由此，晋升通道必须敢于向所有汉人军官敞开。有战功者提拔，有能力者重用，让汉人军官真正拥有与贡献相称的地位。这不是施恩，而是正视现实。一支军队的忠诚，不靠猜忌维系，而靠信任换取。当汉人军官感到被尊重、被需要，他们才会将这支军队视为自己的军队。唯有如此，大军方能上下一心，无分彼此，共赴国战。"
MON_zongrongjielue: "纵容劫掠行为"
MON_zongrongjielue_desc: "前线推进过快，补给线越拉越长，后方工厂产能有限——这些都是事实。与其让士兵饿着肚子打仗，不如给他们一条"活路"。从今往后，占领区的物资征用不再设限。粮食、牲畜、车辆、燃油，凡军队所需，皆可就地取用。至于民间财产、商业库存、甚至银行储备，只要指挥官点头，皆可纳入军需。有人说这是劫掠，有人说这是暴行。但胜利者从不被审判。士兵们有了额外收入，士气自然高涨；军队有了充足补给，推进自然迅速。"
MON_yongbutingxiedezhengfu: "永不停歇的征服"
MON_yongbutingxiedezhengfu_desc: "历史已经证明——蒙古的铁骑一旦启动，便不会轻易停下。成吉思汗的子孙明白一个道理：征服本身就是目的。停下意味着腐朽，停滞意味着衰落。如今的世界变了，武器变了，战术变了，但这条真理未变。从今往后，战争不再是手段，而是常态。每一场胜利都是下一场战争的起点，每一条边界都是待突破的防线。占领的土地要消化，未占领的土地要觊觎。军队永不复员，工厂永不停工，宣传永不停息。让敌人知道——他们面对的不是一支军队，而是一股无法阻挡的洪流。"
MON_weiwenzhongxin: "维稳重心"
MON_weiwenzhongxin_desc: "事实摆在眼前——汉人占人口九成以上，而蒙古人却是少数。继续扩张？后方随时可能起火。从今往后，国家战略重心转向内部治理。增派治安力量，强化基层控制，给顺民以实惠，给反抗者以威慑。"
MON_boyandeqishi: "伯颜的启示"
MON_boyandeqishi_desc: "昔年伯颜丞相曾言："汉人不可掌兵，不可持铁，不可聚众。"此乃血泪教训。我们将颁《铁器管制令》：汉人民间不得私藏刀具和枪械等铁器，十户共用菜刀一把，由里正登记保管。铁农具可用，但铁质须经官府核准，镰刀锄头不得开刃。猎户猎枪统一收缴，狩猎须向官府借领。市集不得贩卖铁器，民间铁器破损须以旧换新。夜间宵禁，汉人不得持械出行，违者以谋反论处。"
MON_zhongyongmengguguanyuan: "重用满蒙官员"
MON_zhongyongmengguguanyuan_desc: "汉人可用，但不可信。这是百年来用鲜血换来的教训。元初之时，汉人官员遍布朝堂，结果如何？红巾军一起，昔日忠臣纷纷倒戈。明朝建立，多少汉人官僚转身就成了开国功臣？历史不会说谎——在民族大义面前，所谓的"忠诚"薄如纸。从今往后，帝国核心职位——军权、情报、财政、司法——必须由满蒙官员掌控。汉人可任副职，可管琐事，但决策之权，寸步不让。汉人再聪明，也是外人；满蒙再平庸，也是自己人。宁可要一个忠诚的庸才，也不要一个能干的叛徒。"
MON_sidengrenzhi: "重建四等人制"
MON_sidengrenzhi_desc: "元朝为何能立国百年？不是因为仁慈，而是因为分明。如今帝国重整，四等之制亦当更新：\n蒙古人——帝国的主人，执掌军政，享最高特权。黄金家族的血脉，永远是刀柄的握持者。\n满人——帝国的盟友，龙兴之地的旧部。虽非黄金家族，但忠勇可嘉，可任军职，可入朝堂，仅次于蒙古。\n北方汉人——帝国的臣民。曾事金、元，知顺从之道。可事农工，可任小吏，但不得掌兵，不得入中枢。\n南方汉人——帝国的底民。南宋遗绪，心向故国，最不可信。纳税服役，永居下层，科举受限，迁徙需批。\n有人说这是歧视。说得对。但这更是算计。北方汉人会比南方汉人更忠诚——因为他们知道，自己至少比南人高一等。南方汉人会恨北方汉人——因为他们抢走了本就不多的机会。长此以往，汉人将不再是一个整体。北汉视南华为蛮，南华视北汉为奴。他们互相鄙夷，互相争斗，唯独忘了抬头看——真正骑在他们头上的，是谁。"
MON_chilaidefuchou: "迟来600年的复仇"
MON_chilaidefuchou_desc: "伯雷帖木儿凝视南京方向，那里躺着明孝陵——朱元璋的安息之地。六百年前，朱元璋驱逐蒙古，黄金家族北逃草原，百万同胞沦为游魂。六百年后，铁骑再临，轮到蒙古人清算旧债。拆掉每一块砖，铲平每一寸土。让汉人看看，他们开国皇帝的风水护不住自己的陵，更护不住他们的国。"
MON_xiangdizhushihao: "向汉族地主示好"
MON_xiangdizhushihao_desc: "我们将向汉族地主士绅伸出橄榄枝，任命乡绅里正协助管理地方，举报反贼者赏银百两，藏匿逆党者全家连坐，以此分化拉拢。蒙古人太少，汉人太多，必须让汉人管汉人、让地主管农民，将他们的利益与帝国绑定。多数地主不在乎名节只在乎利益，当他们的身家性命与帝国共存亡时，自然会替帝国说话、替帝国收粮、替帝国维稳。"
MON_huifubaoshuizhi: "恢复包税制"
MON_huifubaoshuizhi_desc: "我们将恢复前元旧制，把各地税收承包给商人和地主。承包人向国库缴纳固定税额，超额征收部分归其所有。官府不再逐户征税，省去大量吏员开支，税收效率提升三倍。承包人为了多赚，自会想办法从百姓身上榨取，朝廷不必沾手脏活。有人担心横征暴敛激起民变。那就让承包人当这个恶人，民怨冲他们去，朝廷只收银子。闹大了，撤换承包人便是，还能落个为民除害的名声。"
MON_jianuhefahua: "家奴合法化"
MON_jianuhefahua_desc: "我们将正式承认家奴制度的合法性，允许地主贵族蓄养私奴，登记造册即可。满蒙贵族每户限蓄五十奴，汉人地主每户限蓄二十奴，违令者没收全部家产。家奴可买卖、可转让、可抵债，但禁止私刑致死，违者杖责。此举既满足贵族劳动力需求，又将人口控制纳入官府监管。"
MON_zhongyuancaifu: "摄取中原财富"
MON_zhongyuancaifu_desc: "华夏大地物产丰饶，数千年积累的财富堆积如山，民间藏银远超国库。我们铁骑南下、弯弓征服，为的不是虚名不是仁义，就是要夺取这些财富，中原的银子本该属于强者，谁有本事谁就拿走，千年积累的宝藏就在那里，不取白不取。铁蹄踏过的地方，金银自然流入国库，这便是战争的意义。"
MON_chonghuaxingsheng: "重划行省"
MON_chonghuaxingsheng_desc: "经过长年的战乱，旧有行政区划早已支离破碎。各路军阀画地为牢，州县界限混乱不堪，同一水系分属五镇，一座城池横跨三军，政令不通，赋税难征，百姓不知归属何府何县。如今江山一统，我们将重划行省，按山川形便、人口多寡、粮赋轻重，将全国整编为十二行省。行省长官由中央直接任命，三年一换，军政分离，财权归户部，兵权归枢密，地方只理民政。"
MON_suzaoguojiarentonggan: "塑造国家认同感"
MON_suzaoguojiarentonggan_desc: "大元重建，疆土一统，然汉地百姓心中自有华夷之辨，表面顺从，内心不服。铁骑可征服土地，却难征服人心，若不能使汉人认同大元，江山终难稳固。我们将广设宣政院，派遣说书艺人走街串巷，宣扬大元一统之功，淡化华夷之别。修订官史，将大元定位为承接华夏正统，强调"天命无常，惟有德者居之"，元清非异族入侵，而是王朝更替。汉人重史，便以史服之；汉人重文，便以文化之。让汉人子弟读大元之书，考大元之试，做大元之官，久而久之，心中自然认同。"
MON_feiwozulei: "非我族类，其心必异"
MON_feiwozulei_desc: "信任是拿命换的，不是拿话换的。汉人不会真心认我们为天子，我们也不能把江山托付给汉人。怀柔是面子，防范是里子。恩威并施，宽严相济，让汉人有饭吃、有书读，但刀把子必须握在自己人手里。"
MON_dayuanwanwannian: "大元万万年"
MON_dayuanwanwannian_desc: "昔日汉地义军，或伏诛于市，或遁迹山林，或改姓易名苟活于乡野。州府无敢言反者，学堂无敢议乱者，市井无敢传谣者。大元之威，已深入骨髓。皇帝万岁，大元万万年。这不是狂言，是事实——乱世已终结，新朝已稳固，反抗已熄灭。从今往后，只有大元的子民，没有反抗的逆贼。"
