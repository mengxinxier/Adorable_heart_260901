MON_baisemenggu: "白色蒙古"
MON_baisemenggu_desc: "既然神州已经无法保护它的边疆，那么这片草原将由新的主宰来接管。从今日起，安北都司的旗帜将被焚毁，取而代之的是长生天的雄鹰。我不再是流亡的丧家之犬，我是这万里草原唯一的大汗。蒙古的秩序，将由我的意志重新定义。"
MON_tuximajiajun: "突袭马家军"
MON_tuximajiajun_desc: "马家军——这群躲在山脉与荒漠背后的土皇帝，他们以为凭借几座关隘、几口深井和所谓的‘大刀骑兵’，就能在这片土地上长久地维持那摇摇欲坠的统治。他们口中呼喊着信仰，手里的弯刀却只敢砍向缴不起税的百姓。\n这片草原已经等待太久，等待一位真正能让万民止啼、让四方俯首的霸主。命令我的狼群出发。不必携带繁琐的辎重，马家军的粮仓就是我们的补给站。我们要像当年的怯薛军一样，在敌人尚未察觉风声时，便已撕碎他们的营帐。河西走廊不属于任何军阀，它是大汗通往世界的走廊。谁挡在铁蹄前，谁就将化为祁连山的尘埃。"
MON_tuximajiajun2: "突袭马家军"
MON_tuximajiajun2_desc: "马家军——这群躲在山脉与荒漠背后的土皇帝，他们以为凭借几座关隘、几口深井和所谓的‘大刀骑兵’，就能在这片土地上长久地维持那摇摇欲坠的统治。他们口中呼喊着信仰，手里的弯刀却只敢砍向缴不起税的百姓。\n这片草原已经等待太久，等待一位真正能让万民止啼、让四方俯首的霸主。命令我的狼群出发。不必携带繁琐的辎重，马家军的粮仓就是我们的补给站。我们要像当年的怯薛军一样，在敌人尚未察觉风声时，便已撕碎他们的营帐。河西走廊不属于任何军阀，它是大汗通往世界的走廊。谁挡在铁蹄前，谁就将化为祁连山的尘埃。"
MON_tuxifengtian: "突袭奉天"
MON_tuxifengtian_desc: "沈阳的那位‘大帅’，总以为背靠着密集的铁路网和东方的樱花国支持，就能稳坐他那把贴金的交椅。他们自诩为‘关外的守门人’，却在纸醉金迷中腐蚀了先辈在深山老林里磨砺出的血性。我不需要漫长的对峙，更不需要虚伪的最后通牒。辽满军阀那庞大却臃肿的兵团，就像一头反应迟钝的巨兽，只要精准地刺穿它的咽喉，整具躯壳就会在瞬间瘫痪。"
MON_tuxifengtian2: "突袭奉天"
MON_tuxifengtian2_desc: "沈阳的那位‘大帅’，总以为背靠着密集的铁路网和东方的樱花国支持，就能稳坐他那把贴金的交椅。他们自诩为‘关外的守门人’，却在纸醉金迷中腐蚀了先辈在深山老林里磨砺出的血性。我不需要漫长的对峙，更不需要虚伪的最后通牒。辽满军阀那庞大却臃肿的兵团，就像一头反应迟钝的巨兽，只要精准地刺穿它的咽喉，整具躯壳就会在瞬间瘫痪。"
MON_chongjianchahetai: "重建察合台汗国"
MON_chongjianchahetai_desc: "向西望去，在那片被天山横断、被塔里木盆地环抱的广袤土地上，曾经流淌着成吉思汗次子的血脉。察合台汗国，那个曾经沟通东西方文明、扼守丝绸之路心脏的伟权，如今却支离破碎，沦为一群毫无远见的平庸军阀的私产。看看现在的新疆，他们在高墙深院里争权夺利，在列强的博弈间摇摆不定，甚至连最基本的秩序都无法维持。我不需要寻找什么繁琐的战争借口。察合台的土地属于成吉思汗的继承者，察合台的战旗，必将再次插在迪化的城头。"
MON_chongjianchahetai2: "进军新疆"
MON_chongjianchahetai2_desc: "向西望去，在那片被天山横断、被塔里木盆地环抱的广袤土地上，曾经流淌着成吉思汗次子的血脉。察合台汗国，那个曾经沟通东西方文明、扼守丝绸之路心脏的伟权，如今却支离破碎，沦为一群毫无远见的平庸军阀的私产。看看现在的新疆，他们在高墙深院里争权夺利，在列强的博弈间摇摆不定，甚至连最基本的秩序都无法维持。我不需要寻找什么繁琐的战争借口。察合台的土地属于成吉思汗的继承者，察合台的战旗，必将再次插在迪化的城头。"
MON_jinjunlasa: "进军拉萨"
MON_jinjunlasa_desc: "在那片被称为“世界屋脊”的荒野之上，古老的神权与封闭的部族依然在稀薄的空气中苟延残喘。这片曾在和硕特汗国铁蹄下俯首称臣的雪域，如今却成了逃避现实的避风港。那里的统治者以为凭借着喜马拉雅山的险峻和对神明的祈祷，就能将大汗的钢铁意志拒之门外。愚蠢。高山的缺氧或许能阻挡凡人的肺腑，却挡不住燃烧着野心的内燃机。我不需要他们的经文，也不需要他们的香火，我需要的是那片高地的绝对战略统治权。从拉萨俯瞰，整个南亚次大陆都将暴露在大汗的雷霆之下。传令给那些适应了高海拔作战的山地师，带上足够的氧气和不灭的斗志。我们要翻越唐古拉山，让长生天战旗在布达拉宫的红白墙间猎猎作响。当大汗的铁蹄踏碎拉萨的静谧时，那里的神灵也必须学会向新的真理低头。"
MON_jinjunlasa2: "进军拉萨"
MON_jinjunlasa2_desc: "在那片被称为“世界屋脊”的荒野之上，古老的神权与封闭的部族依然在稀薄的空气中苟延残喘。这片曾在和硕特汗国铁蹄下俯首称臣的雪域，如今却成了逃避现实的避风港。那里的统治者以为凭借着喜马拉雅山的险峻和对神明的祈祷，就能将大汗的钢铁意志拒之门外。愚蠢。高山的缺氧或许能阻挡凡人的肺腑，却挡不住燃烧着野心的内燃机。我不需要他们的经文，也不需要他们的香火，我需要的是那片高地的绝对战略统治权。从拉萨俯瞰，整个南亚次大陆都将暴露在大汗的雷霆之下。传令给那些适应了高海拔作战的山地师，带上足够的氧气和不灭的斗志。我们要翻越唐古拉山，让长生天战旗在布达拉宫的红白墙间猎猎作响。当大汗的铁蹄踏碎拉萨的静谧时，那里的神灵也必须学会向新的真理低头。"
MON_koukailongmen: "叩开龙门"
MON_koukailongmen_desc: "神州帝国的朝廷早已在无尽的内耗与贪婪中耗尽了骨血，他们甚至无法为守城的士兵提供一双完整的靴子。别再谈论什么虚伪的‘和谈’或‘归顺’了。我来到这里，不是为了成为另一个跪在龙椅下的藩王，而是为了彻底终结这个不再进步的旧世界。命令所有炮兵集群，将炮口对准那座象征皇权的关隘。当龙门的城砖崩碎时，不仅是一个朝代的覆灭，更是大汗意志入主中原的洗礼。我们要用这焦土上的烈焰，为新生的帝国铸造王冠。"
MON_koukailongmen2: "叩开龙门"
MON_koukailongmen2_desc: "神州帝国的朝廷早已在无尽的内耗与贪婪中耗尽了骨血，他们甚至无法为守城的士兵提供一双完整的靴子。别再谈论什么虚伪的‘和谈’或‘归顺’了。我来到这里，不是为了成为另一个跪在龙椅下的藩王，而是为了彻底终结这个不再进步的旧世界。命令所有炮兵集群，将炮口对准那座象征皇权的关隘。当龙门的城砖崩碎时，不仅是一个朝代的覆灭，更是大汗意志入主中原的洗礼。我们要用这焦土上的烈焰，为新生的帝国铸造王冠。"
MON_jueze: "抉择"
MON_jueze_desc: "我赢了，这是真的吗？我……"
MON_tianmingzhiyin: "天命之印"
MON_tianmingzhiyin_desc: "依靠战马与刺刀只能征服肉体，要让这片拥有五千年历史的浩瀚土地臣服，艾黛尔贾特必须向万民宣告她统治的“合法性”。她究竟是西式的绝对君主，是长生天庇佑的可汗，还是承天受命的真龙天子？"
MON_zhangliangjiangshan: "丈量江山"
MON_zhangliangjiangshan_desc: "新征服的版图太过庞大。如何划分这片广袤的土地，决定了中央与地方的权力分配，也决定了帝国的汲取能力。"
MON_diguozhijian: "帝国之剑"
MON_diguozhijian_desc: "我们的军队是由多种截然不同的武装力量拼凑而成的。为了迎接未来必然的征服战争，帝国的军事学说必须实现统一。哪一种战争艺术，将成为总参谋部的教条？"
MON_xuanxianrenneng: "选贤任能"
MON_xuanxianrenneng_desc: "马上打天下，却不能马上治天下。堆积如山的公文让政府的运转濒临瘫痪。我们需要建立一套高效的官僚系统，但随之而来的问题是：帝国的政令，究竟该由谁来书写？"
MON_suanpanlubu: "算盘、卢布与牛羊"
MON_suanpanlubu_desc: "帝国的国库不能只靠掠夺来维持。我们必须确立未来的经济基石。"
MON_yirenzhixia: "未来的方向"
MON_yirenzhixia_desc: "我们的帝国应该是一种怎样的形态，到了该做决定的时候了。"
MON_shijiezhengfuzhe: "世界征服者"
MON_shijiezhengfuzhe_desc: ""
MON_zhanzhengjingji: "战争经济"
MON_zhanzhengjingji_desc: "仅凭长生天的眷顾和祖辈的马刀，是无法抵御外部世界的窥伺与野心的。我深知，任何宏大的帝国梦想若没有钢铁的支撑，都不过是烈日下的海市蜃楼。现在的蒙古不再需要吟游诗人的赞歌，它需要的是熔炉的轰鸣。"
MON_zhenghebuluo: "整合部落"
MON_zhenghebuluo_desc: "那些古老的部落头人依然坐在装饰着金边的皮垫上，向我吹嘘他们那传了百年的苏鲁锭和所谓的‘纯正血统’。他们以为，只要在我的加冕礼上献上几匹快马和虚伪的效忠，就能继续在那片封地里当土皇帝。\n真是愚钝。在我的帝国里，没有‘部族’，只有‘公民’；没有‘恩赏’，只有‘军功’。那些零散的牧区、私人的武装以及由于血缘纽带产生的低效决策，是阻碍蒙古再次伟大的毒瘤。我要亲手拆掉那些无形的篱笆，将所有的牧民编入统一的行政旗帜之下。\n从今天起，头人们的私人领地将被收归中央，他们的子弟将进入我亲手创办的士官学校，而非在荒原上虚度光阴。我要让每一个草原上的子民明白：他们的忠诚不属于任何姓氏，只属于这座汗帐，属于这个正在崛起的钢铁国度。谁想抱残守缺，谁就会被时代的履带碾碎。整合，是为了让万流归宗，让蒙古的意志如同一块完整的生铁，坚不可摧。"
MON_qianhuzhi: "新千户制度"
MON_qianhuzhi_desc: "血缘纽带是慵懒者的温床，而行政编制才是强者的骨骼。我将彻底粉碎旧有的部落界限，取而代之的是由我亲手划分的千户。每一千户为一个行政与军事单元，无论你是牧民、工匠还是流亡的士兵，在我的名册下，你们只有一个身份——帝国的基石。这种重组不仅是为了征兵，更是为了建立绝对的数字化控制。我要让每一顶帐篷、每一支步枪都在汗帐的俯瞰之下。当号角吹响，这架由成千上万个‘千户’构成的精密机器将瞬间发动，把整个草原的力量汇聚成一根无法阻挡的铁矛。谁也别想再躲在部落的阴影里，在这里，效率就是最高的神谕。"
MON_zhengdiaohanjun: "征调汉军"
MON_zhengdiaohanjun_desc: "中原的降卒不应只是战俘营里的累赘，他们曾是神州帝国的甲锐，如今则是我重建大汗版图的资粮。既然旧朝廷已无法庇护他们，那么大汗的旗帜将赋予他们新的尊严——这种尊严建立在服从与铁血之上。他们将成为帝国的第一道肉盾，也是刺向旧世界最深的一柄匕首。凡随我东征西讨者，皆为帝国之子。"
MON_huifubasihazhi: "恢复八思哈制"
MON_huifubasihazhi_desc: "中原的官僚体系如同一团乱麻，他们擅长用繁文缛节来消磨统治者的意志。我不需要这些虚伪的“青天大老爷”，我需要的是绝对的效忠与高效的榨取。每一个行省、每一座重镇，都将设立直属于汗帐的监治官。他们将握有超越地方律法的权力，负责征收赋税、监管矿产并清算任何潜在的反抗。"
MON_huluobodabang: "胡萝卜与大棒"
MON_huluobodabang_desc: "单纯的屠戮只会留下一片荒芜，而无底线的仁慈则会滋生傲慢的叛逆。我在这座金銮殿的废墟上学到的最重要一课，就是如何精准地分配恐惧与奖赏。我要让中原的子民清醒地意识到：顺从大汗，桌上便有面包；违抗大汗，坟头便有野草。当这种生存本能压倒了虚伪的民族气节，这片土地才真正属于我。统治的艺术，不在于让他们爱你，而在于让他们在敬畏中选择生存。"
MON_daluhuachi: "派遣达鲁花赤"
MON_daluhuachi_desc: "达鲁花赤的印章高于地方的一切律法，他们的职责唯有三项：收缴足以支撑征途的赋税、确保铁矿源源不断地运往北方，以及在叛乱萌芽前就将其彻底铲除。这些官员不必懂得法律条文，他们只需懂得如何执行我的意志。"
MON_chengjisihanfadian: "新成吉思汗法典"
MON_chengjisihanfadian_desc: "昔日成吉思汗颁布的《大扎撒》，曾以其超越时代的公正与严明，在马背上维系了一个横跨欧亚的秩序。它不仅是草原的家法，更是第一部将贸易安全、宗教宽容与军纪融合的普世律令。即便在数百年后的今天，那份“令行禁止、万民一体”的锋芒依然令人生畏。然而，旧的经卷无法束缚新的钢铁。我们要继承那份冷峻的理性，更要根据当下的鲜血与炮火制定新的准则。我要颁布新的法典：它将用工业时代的逻辑重组社会，把对汗帐的绝对效忠锻造成每一个子民的本能。"
MON_luexidui: "掠袭队"
MON_luexidui_desc: "昔日大汗的怯薛军能让欧亚大陆的城池在铁蹄下战栗，靠的不止是勇气，更是如飓风般不可捉摸的机动力。在钢铁与引擎的时代，这种古老的狩猎本能不应被遗忘，而应被机械化。我下令组建‘掠袭队’——这支部队将由最精锐的摩托化步兵与轻型装甲组成。他们不负责阵地战的拉锯，他们的唯一任务就是绕过正面防线，像狼群一样切入敌人的后方。焚毁粮仓、炸毁铁路、夺取每一个补给站。规则很简单：以战养战。在这场征途里，敌人的物资就是我们的军费，他们的恐慌就是我们的掩护。我们要让对手在睡梦中听到引擎的轰鸣时，就意识到自己已经一无所有。掠袭队不是在作战，而是在为帝国收割那些无力守护财富的弱者。当风暴过后，留给敌人的将只有焦土与绝望。"
MON_jiaqidianbaoxian: "架起电报线"
MON_jiaqidianbaoxian_desc: "昔日大汗的箭书驿骑虽快，却终究受限于马蹄的疲惫与风雪的阻隔。在戈壁与中原交织的广袤版图上，迟缓的信息是滋生叛乱与怠政的温床。我要在大地的脊梁上架起铜制的神经，让大汗的意志以闪电的速度贯穿帝国。每一根电线杆的立起，都是对旧时代地方割据的无声宣判。我要让达鲁花赤们的报告在瞬息间抵达汗帐，让铁道枢纽的调度如同呼吸般精准。当电报机的滴答声在大漠深处响起，这片土地将不再有阴影中的死角。"
