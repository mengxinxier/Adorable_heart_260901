MON_caoyuanziyoule: "草原自由了"
MON_caoyuanziyoule_desc: "我们赶走了朝廷的走狗，现在草原的路线将由我们自己决定。"
MON_xincaoyuanzhang: "推举新草原长"
MON_xincaoyuanzhang_desc: "尽管我们希望推举慢羊羊继任草原长，但他自认为年事已高，希望将机会让给年轻人。"
MON_ziyoudecaoyuan: "民主的草原"
MON_ziyoudecaoyuan_desc: ""
MON_chuanbominzhusixiang: "自由的基石"
MON_chuanbominzhusixiang_desc: "在这里，思想自由流动，言论不受禁锢，这是智慧文明的第一缕曙光。"
MON_jiejuequnzhongnanti: "风吹草低见智慧"
MON_jiejuequnzhongnanti_desc: "喜羊羊在蒙古包外搭起一座简易的木棚，邀请草原上的老者、萨满、牧人围坐一圈。他说："我不懂放牧，但你们懂。政策怎么定，先问问草愿不愿意，问问马同不同意。"从此，每一道政令出台前，都要经过这场"草原议事"，智慧如风般从四面八方汇聚而来。"
MON_geminzuyouhao: "三色哈达的约定"
MON_geminzuyouhao_desc: "蓝、白、红三条哈达，分别象征信任、和平与诚意。喜羊羊与蒙古各部首领一一交换哈达，没有盟书，没有印章，只有彼此眼中的承诺。"
MON_yundonghui: "草原运动会"
MON_yundonghui_desc: "我们将举办一场史无前例的“草原运动会”。这不仅仅是一次体育盛会，这场运动会将成为融化隔阂的熔炉。当不同民族的选手为了同一个目标挥汗如雨、生死与共时，血缘与文化的差异将在竞技的激情中悄然消解；当胜负的荣耀属于混合编制的队伍而非单一族群时，“我们”的概念将彻底取代“他们”的对立。通过这种直观而热烈的互动，我们将把抽象的“团结”转化为民众心中具体的信任与默契，让草原上的每一阵风都传递着友谊的信号，最终铸就一个心意相通、牢不可破的命运共同体。"
MON_baohudaziran: "草原生态平衡法"
MON_baohudaziran_desc: "温和的治理不仅针对生灵，也针对自然。推行可持续放牧与绿色能源，让草原永远保持青翠。"
MON_ziyousixiang: "全知图书馆计划"
MON_ziyousixiang_desc: "我们将在羊村里建造巨大的知识殿堂。知识不再是特权，所有草原居民都可以免费学习。只有愚昧才会导致战争，知识带来和平。"
MON_kaifangshichang: "开放市场"
MON_kaifangshichang_desc: "政府将不再对商队进行严苛的盘查与限制，转而致力于修建宽阔平坦的“友谊商道”，并在边境设立零关税的“互市特区”，鼓励皮毛、奶制品与牲畜等货物在此自由交汇。"
MON_zhuanxingzhengyi: "不系马头的自由"
MON_zhuanxingzhengyi_desc: "有部下建议推行定居政策，便于管理。喜羊羊却摇头："马的头不该被系住，人的心也不该被绑牢。"游牧的传统被保留，帐篷可以迁徙，文化可以流动，草原还是那片草原，只是头顶的天空更加晴朗。"
MON_wodetiantang: "我的家，我的天堂"
MON_wodetiantang_desc: "蓝蓝的天空\n\n清清的湖水\n\n绿绿的草原\n\n这是我的家,我的天堂。\n\n草原不仅是生存的栖息地，更是孕育了我们欢笑、梦想与记忆的天堂——这里的一草一木都浸透着祖先的汗水，每一阵微风都承载着童年的歌谣。当人们深刻意识到这片草原是任何财富都无法换取的永恒归宿时，一种源自本能的守护意志将油然而生。我们将把这种对故土的深情转化为坚不可摧的国防信念：保卫草原，就是保卫我们的根，保卫我们灵魂的安放之所。任何试图践踏这片天堂的行为，都将不再是针对某个部落的侵犯，而是对所有草原儿女共同家园的宣战。在这片蓝天下，我们将以爱为盾，以家为名，誓死捍卫这方属于我们的、无可替代的乐土。"
MON_gemingdecaoyuan: "革命的草原"
MON_gemingdecaoyuan_desc: ""
MON_jiaomiehanfei: "剿灭悍匪"
MON_jiaomiehanfei_desc: ""
MON_feichulamatequan: "废除喇嘛特权"
MON_feichulamatequan_desc: ""
MON_gaigexingzhengjigou: "改革行政机构"
MON_gaigexingzhengjigou_desc: ""
MON_kaiqitudigaige: "地契换笑脸"
MON_kaiqitudigaige_desc: "草原上的地契堆成了小山。老一辈的牧民说，这些纸片子祖传了几百年，上面盖的章换了好几个朝代。地还是那片地，但种地的人该有自己的盼头了。新的土地证发下去那天，牧民们在草原上摆了长桌宴，说这是他们第一次真正拥有脚下的土地。土地证不仅仅是一张纸，更是一种尊严。"
MON_qinjinmumin: "马背上的政委"
MON_qinjinmumin_desc: "他们骑着马，背着行囊，一家一家地走访。有的牧民一开始不信任，闭门不见，他们就第二天再来。夏天晒脱皮，冬天冻裂手，没人叫苦。有个政委在牧民家里住了半个月，帮人家修好了漏雨的帐篷，给生病的孩子找了医生。临走时，牧民塞给他一袋奶疙瘩，说：你是第一个不把这里当外地的干部。政策不是写在纸上的，是走出来的，是活出来的。"
MON_sulianyuanzhu: "来自苏联的援助"
MON_sulianyuanzhu_desc: "老大哥给我们送来了急需的物资，但比物资更珍贵的是人。数十名苏联专家跟着车队一起来了，有农艺师、兽医、机械工程师、地质勘探员。他们住进临时搭的帐篷里，跟牧民们一起吃大锅饭。语言不通就比划，比划不明白就画图，图画不明白就手把手教。"
MON_zhonghuashenfenrentong: "保持中华身份认同"
MON_zhonghuashenfenrentong_desc: "户籍登记站排起了长队。工作人员问：您是什么民族？牧民说：蒙古族。又问：您是哪国人？牧民愣了一下，说：还能是哪国，中国人呗。这话后来传开了，成了草原上的一句口头禅。有个留学回来的知识分子问：为什么非要强调这个？兔子说：草原是家，中国是根。根没了，家也就飘了。"
MON_moshouguizucaichan: "再分配贵族财产"
MON_moshouguizucaichan_desc: "王公们的仓库门被打开那天，围观的人很多。里面堆着粮食、皮毛、银器，有些东西都发霉了。干部们没私拿一件，全部登记造册，按人口分给牧民。有个老王爷站在门口，看着东西一件件搬走，没说话。分到最后，兔子留了一袋粮食给他，说：您也是劳动者，该有一份。老王爷眼眶红了，说：我祖上欠的债，今天算是还了。仓库门后来成了博物馆，门口挂了个牌子：财富来自人民，归于人民。那句话刻在石头上，风吹雨打，一直没模糊。"
MON_shisuhuayundong: "世俗化运动"
MON_shisuhuayundong_desc: "寺庙的经筒转了几百年，旁边新装了个广播喇叭。喇叭里早上播经文，下午播天气预报和种植技巧，晚上播儿童故事。有个老喇嘛说：佛祖保佑的是心，广播帮的是日子。世俗化不是不要传统，是让传统和生活和平共处。后来，年轻人照样去寺庙祈福，但也照样听广播学生产技术。信仰和日子，都能过好。"
MON_yinjinsuliannongyejixie: "铁牛进草原"
MON_yinjinsuliannongyejixie_desc: "那些铁疙瘩大家伙，牧民们第一次见，围着看了半天，不敢摸。干部说：这是拖拉机，一天能干一百个人的活。牧民们跟着学，从怎么点火到怎么耕地，笔记记了满满一本。有个老牧民一开始不信，说牛比这玩意儿靠谱。后来试用了一个月，他对教开拖拉机的干部说：这铁牛，比真牛还听话。"
MON_zhonggongjingyan: "学习中共的经验"
MON_zhonggongjingyan_desc: "干部人手一本笔记本，封面印着"川北经验"。里面记的不是文件，是故事——怎么搞土改，怎么发动群众，怎么处理民族关系。草原上遇到难题，就翻翻笔记本，总能找到点启发。有次处理部落纠纷，用的就是川北根据地调解矛盾的办法。笔记本后来传了好几代，页角都磨毛了，但里面的字越来越清晰。有些经验，真的能穿越时间。"
MON_caoyuanhongrisheng: "草原红日升"
MON_caoyuanhongrisheng_desc: "草原上多了几样东西。\n旗杆立起来了，天天清晨升旗，风雨无阻。合作社的牌子挂起来了，以前各顾各的牧民开始一起放牧、一起分粮。扫盲班的煤油灯亮起来了，晚上蒙古包里不再只有闲聊声，还有读书声。\n变化是慢慢发生的。\n以前王爷说了算，现在大家投票。以前地是贵族的，现在地契发到牧民手里。以前生病了只能求佛，现在医疗队骑马下乡，药箱里真有药。\n年底的时候，草原上第一次没有饿死人。粮仓是满的，孩子是上学的，老人是有药吃的。\n除夕夜，有位干部和牧民一起包饺子。有个小孩问："你们什么时候走？"\n干部想了想，说："等你们不需要我们的时候。"\n"那是什么时候？"\n"不知道。可能是明天，也可能是很久以后。"\n窗外的旗杆上，红旗在风里飘着。草原的夜很静，但某种新的东西，正在这片土地上生根。"
MON_qiangdadecaoyuan: "强大的草原"
MON_qiangdadecaoyuan_desc: ""
