MON_yishixingtaidouzheng_desc: ""
MON_yiwulaodong: "义务劳动"
MON_yiwulaodong_desc: ""
MON_wuzhuangminbing: "武装民兵"
MON_wuzhuangminbing_desc: ""
MON_nanzhengcelue: "南征策略"
MON_nanzhengcelue_desc: ""南方的地形和草原不一样，水网密布，城池坚固。照搬草原那一套肯定不行。参谋部花了三个月时间研究南方的地图，每一条河流，每一座桥梁，都标记得清清楚楚。我们不是在纸上谈兵，这是在为年轻人的生命负责。计划越周密，战场上的意外就越少。""
MON_zhongshihuoli: "重视火力"
MON_zhongshihuoli_desc: "“以前我觉得跑得快就能赢，结果呢？在现代化的机枪阵地面前，骑兵就是活靶子！这种教训，一次就够了！我们要一统华夏，面对的将是钢筋水泥的堡垒和装备精良的敌军。所以，我要最好的火炮，最密的弹雨！我们要用钢铁风暴撕开敌人的防线，减少我们战士的牺牲。记住，火力越强，统一的步伐就越快！让大炮成为我们谈判桌上最有力的语言！”"
MON_lindongjiangzhi: "凛冬将至"
MON_lindongjiangzhi_desc: ""草原上的老人都说，冬天来临前，聪明的狼会储备足够的脂肪，愚蠢的狼只会抱怨寒风。我见过太多部族在寒冬中分崩离析，不是因为敌人太强，而是因为他们自己先乱了阵脚。所以，我下令提前囤积粮草，加固营帐，检查每一辆车的防冻液。有人说我太谨慎，但我说，活着才有机会。""
MON_chengjisihanchongbai: "成吉思汗崇拜"
MON_chengjisihanchongbai_desc: "“听着！别再用那种看失败者的眼神看着我！看看这面旗帜，看看这苏鲁锭！当年成吉思汗能横扫欧亚，凭什么我就不行？好吧，我不姓‘孛儿只斤’，但这不重要！重要的是，今天我站在这里，就是要告诉长生天：全体都有，向祖先致敬，然后准备战斗！”"
MON_wudalangdehouyi: "武大狼的后裔"
MON_wudalangdehouyi_desc: ""有人说我灰太狼是个落魄贵族，无所谓。今天我告诉所有人，武大狼的血脉从未断绝。祖先的刀还挂在我的帐篷里，上面的缺口是五百年前留下的。这份传承不是用来炫耀的，是用来提醒我的——你肩上扛着什么。族人们信不信不重要，重要的是，当他们看到我这面旗帜时，眼里要有光。血脉可以追溯，但荣耀要靠自己去挣。我灰太狼，不会给祖先丢脸。""
MON_changshengtianhuyou: "长生天护佑我辈"
MON_changshengtianhuyou_desc: ""那天我站在敖包山顶，风大得几乎站不住人。萨满说，长生天在看着我们。我信。不是迷信，是一种敬畏。我们这片土地上的人，自古以来就相信头顶有片天，脚下有片地，中间站着堂堂正正的人。祭天仪式不是做给外人看的，是让我们自己心里有底。当战士们跪在地上向长生天祈祷的时候，我知道，他们不是在求保佑，是在告诉自己——这一战，为了信仰，死而无憾。""
MON_langtuteng: "狼图腾"
MON_langtuteng_desc: ""为什么是狼？因为狼懂得团结，懂得忍耐，懂得在绝境中求生存。一只狼也许会被猎杀，但一群狼能让猎人胆寒。要让每个人记住——我们是谁，我们从哪里来。对敌人凶狠，对同胞忠诚，这才是真正的狼性。""
MON_zhaoantufei: "招安土匪"
MON_zhaoantufei_desc: "“嘿，那边的匪首！别躲了，我看见你的尾巴了！你以为带着几个喽啰就能在这片草原上横着走？太天真了！要么被我踩扁，要么加入我。选后者吧，我保证你们以后抢的不是牧民的干粮，而是敌人的军火库！记住，从今天起，你们不是土匪，是草原的先锋！谁敢再私自抢劫，我就把他做成羊肉串！”"
MON_tichuwailaizongjiao: "整顿大呼拉尔"
MON_tichuwailaizongjiao_desc: "“够了！真的够了！每次开会就是喝茶、聊天、互相吹捧，正事一件没干！看看外面，敌人都在磨刀了，你们还在讨论晚饭吃手抓肉还是青草蛋糕？从今天开始，我有三个规则：第一，我说东，谁也不许往西；第二，谁敢藏私兵，我就没收他的牧场；第三，也是最重要的——不许在我面前提‘输’这个字！违者，罚去扫马厩一个月！”"
MON_yongganxiangqian: "放出狼群"
MON_yongganxiangqian_desc: ""战场上没有'如果'，只有'结果'。犹豫一秒，可能就失去一个机会；后退一步，可能就失去整场战争。所以我告诉所有指挥官：一旦决定进攻，就不要再想退路。勇敢不是不害怕，是害怕也要向前。我们的敌人会记住这一天——灰太狼的狼群，一旦冲锋，就不会停下。向前，直到胜利，或者直到最后一口气。""
MON_zhanzaicaoyuanwangbeijing: "我站在草原望北京"
MON_zhanzaicaoyuanwangbeijing_desc: ""
MON_jiefangtongbao: "解放南方同胞"
MON_jiefangtongbao_desc: ""
MON_mengguzaizhengfu: "蒙古再征服"
MON_mengguzaizhengfu_desc: ""
MON_fengtianjingnan: "奉天靖难"
MON_fengtianjingnan_desc: ""
MON_yitongtianxia: "一统天下"
MON_yitongtianxia_desc: ""
MON_minzhudesheng: "民主得胜"
MON_minzhudesheng_desc: "我们郑重宣告：这场伟大的胜利并非源于某一位英雄的独断专行，而是“智慧与民主”理念在全境的最终凯旋。在这片统一的土地上，无论身处繁华都市还是偏远牧场，每一个公民都将拥有平等的投票权与话语权。让狼族的勇猛、羊族的智慧、人类的勤劳都能通过合法的渠道转化为国家的决策力量。"
MON_pingfanxianzhenghui: "平反革新联盟"
MON_pingfanxianzhenghui_desc: "我们深知真正的稳固不仅在于疆域的辽阔，更在于人心的归附与智慧的汇聚。我们将邀请革新联盟的成员进入决策层。通过这一举措，我们要向全天下宣告：在统一的新中国里，没有永远的敌人，只有被误解的朋友；不同声音不再是分裂的导火索，而是推动社会进步的引擎。让我们用宽容化解仇恨，用真理修正错误，让革新联盟的热血与智慧，毫无保留地汇入神州复兴的洪流之中，共同开创一个海纳百川、万象更新的黄金时代。"
MON_xieshougongjin: "风可以吹过每一扇窗"
MON_xieshougongjin_desc: "独立媒体监督体系建立，政府行为公开透明。有官员抱怨被盯得太紧，喜羊羊说："阳光是最好的消毒剂。"贪腐案件被一一曝光，公众知情权得到保障。风穿过每一扇窗，带走霉味，带来清新。"
MON_huanheminzumaodun: "缓和民族矛盾"
MON_huanheminzumaodun_desc: "在新成立的民族事务委员会里，各族代表平等落座，争论、协商、妥协，最终达成共识。分歧依然存在，但不再需要用刀来解决。"
MON_saomangjihua: "没有围墙的学堂"
MON_saomangjihua_desc: "义务教育推行至高中，贫困生大学全免。有富人质疑："凭什么我的税要供别人的孩子读书？"喜羊羊回答："因为今天你资助的孩子，明天可能是治好你病的医生，可能是设计你住房的工程师。"知识的大门向所有人敞开，寒门出贵子不再是传说。"
MON_shidangdezizhi: "让河流自己选择方向"
MON_shidangdezizhi_desc: "地方自治试点启动，各省可根据本地情况制定部分法规。有中央官员担心权力分散，喜羊羊说："中央是大海，地方是河流。河流有自己的走向，最终都会汇入大海。"地方的活力被激发，创新如雨后春笋。"
MON_gulixinzhengdang: "鼓励新政党"
MON_gulixinzhengdang_desc: "单一的政治力量难以承载这片广袤土地上纷繁复杂的利益诉求与治理挑战。随着《政党促进法》的颁布，结社自由的壁垒被逐一拆除，各类政治团体如雨后春笋般涌现。不同阶层、不同族群、不同地域的声音找到了各自的表达渠道。这些新政党在宪法框架内合法活动，将分散的民意汇聚成清晰的政策选项，供民众选择。多党竞争与合作推动着国家不断自我革新，避免权力的腐化与思维的僵化。统一的蓝天下，多元共荣的政治生态正悄然生长，为神州大地的长治久安注入生生不息的活力。"
MON_duoyuanhuazhengzhi: "老人的故事有人听"
MON_duoyuanhuazhengzhi_desc: "一支支记录队深入村寨，用文字、录音、影像记录各族的口述历史。喜羊羊说："一个民族忘记了自己的故事，就等于失去了一半的灵魂。"濒临失传的史诗被整理成书，古老的歌谣被谱成新曲，文化在传承中焕发新生。"
MON_lixiangbumie: "理想不灭"
MON_lixiangbumie_desc: "从青青草原的烽火初燃，到神州大地的旗帜统一，这条路走了太久。曾经，民主与自由只是少数志士口中的低语，在强权与暴力的夹缝中艰难求生。\n\n如今，战火已熄，山河重光。昔日被追杀的流亡者回到了故乡，昔日被禁毁的典籍重见天日，昔日被压抑的声音在议事厅中自由回响，民主的根基在每一寸土地上深深扎下。\n\n政治的终点，并非权力的巅峰，而是理想的落地。当每一个孩子都能在和平中长大，当每一次选举都能自由表达，当每一种声音都能被倾听，当每一种理想都有实现的可能——那便是这条道路最终的意义。\n\n理想从未熄灭，它只是换了一种方式继续燃烧。从革命的火炬，变为治国的灯火；从反抗的呐喊，变为建设的低语。神州大地上的这一代人终于明白：真正的理想主义，不是在黑暗中等待光明，而是在光明中守护光明。"
MON_chiqipiaoyang: "赤旗飘扬"
MON_chiqipiaoyang_desc: "这一天，红旗第一次插遍了每一寸土地。从北到南，从东到西。兔子站在城楼上，看着下面的人海，想起草原上的那点星火——那时候谁能想到，这点火能烧遍全国？有人哭了，有人笑了，有人默默摘下帽子。这不是结束，是开始。下一代人要走什么路，过什么日子，从这一面旗升起的时候，就有了答案。"
MON_zhonggongtongzhimen: "中共的同志们"
MON_zhonggongtongzhimen_desc: "尽管我们很多人没见过面，但我们打过同样的仗、流过同样的血，有着同样的理想。现在不用躲躲藏藏了，坐下来，一起干活。"
MON_lieshibuxiu: "烈士不朽"
MON_lieshibuxiu_desc: "有些人没能走到今天，但他们的脚印还在路上。石碑不会说话，但每一个名字都是一段没讲完的故事。有的只活了十六岁，有的连大名都没取，有的家里还在等一个不会回来的人。让他们白死，是我们最大的亏欠。石头会风化，但只要还有人记得，他们就没真正离开。"
MON_huanqiminzuzixin: "唤起民族自信"
MON_huanqiminzuzixin_desc: "百年屈辱压弯了多少腰杆，现在该挺直了。不是喊口号，是真真切切造出东西来——汽车能跑、飞机能飞、轮船能远航。以前街上跑的都是外国车，现在咱们自己造的也能上路。自信不是别人给的，是自己挣来的。种花家的孩子，从来不比别人笨，只是以前没机会。"
MON_douzhengdiguozhuyi: "对帝国主义发起斗争"
MON_douzhengdiguozhuyi_desc: "外面的朋友可以做，家里的门不能让人随便进。谈判桌上可以吵，但底线不能让。独立不是喊出来的，是一次次守住换来的。有些字不能签，有些话不能听，有些手必须挡回去。不是不合作，是不跪着合作。站直了说话，别人才会认真听。"
MON_zhuimengchizixin: "追梦赤子心"
MON_zhuimengchizixin_desc: "走得太远，容易忘记为什么出发。理想不是墙上的标语，是深夜加班时的那盏灯，是面对诱惑时的那句"不行"，是没人看见时依然选择做对的事。星星白天也在天上，只是太阳太亮，看不见而已。抬头看看，它们还在。别忘了当初为什么戴上这枚徽章。"
MON_gaibianluohoumianmao: "改变落后面貌"
MON_gaibianluohoumianmao_desc: "计划不是目的，发展才是。能让老百姓过上好日子的方法，就是好方法。集市开了，摊位摆起来了，讨价还价的声音又回来了。有人担心这是走偏了，但老百姓的肚子最诚实——菜价降了，品种多了，排队的人少了。别管什么颜色，能抓老鼠就是好猫。"
MON_zouxiangfuqiang: "走向富强"
MON_zouxiangfuqiang_desc: "贫穷不是社会主义，富起来才能说话有底气。让每个孩子都能上学，每个老人都能看病，每个家庭都有盼头。日子不是一天变好的，是一步步过出来的。今天比昨天好，明天比今天好，这就是我们要的路。"
MON_xingchendahai: "目标是星辰大海"
MON_xingchendahai_desc: "吃饱饭、造汽车、修铁路、建工厂——这些都很重要，但不是全部。一个只盯着脚下的民族，走不远。百年屈辱教会我们的，不是低头认命，而是抬头看路。今天的努力，不只是为了这一代人，更是为了那些还没出生的孩子。他们应该看到什么样的天空？应该有什么样的未来？种花家的路，从来不只是脚下的路，还有头上的天、远方的海、看不见的未来。目光放长远些，再长远些——因为我们要去的地方，这一代人可能到不了，但总有一天，会有人替我们到达。"
MON_huaxiaxinzhixu: "华夏新秩序"
MON_huaxiaxinzhixu_desc: ""打了这么多年，终于能把枪放下了。但我知道，打天下容易，治天下难。以前的那些规矩，该废的废，该改的改。我要建立一个新秩序——不是谁拳头硬谁说了算，而是法律说了算。各省的行政长官我来任命，税收统一上缴，军队统一指挥。有人说我太强势，但我说，百年乱世刚结束，这时候心软，就是对百姓不负责任。新秩序建立起来，大家才能安心过日子。这华夏，从此只有一个声音，一个方向。""
MON_caoyuanzhizi: "我们是草原之子"
MON_caoyuanzhizi_desc: ""有人问我，进了中原，会不会忘了草原。我说，忘不了的。这片草原是我们的根，是我们的来处。就算我坐在北京的办公室里，晚上做梦还是能听到马头琴的声音。但我更明白，不忘传统不是要固步自封，而是要把草原的豪迈带到全国各地。""
MON_doushizhongguoren: "但我们都是中国人"
MON_doushizhongguoren_desc: ""有人问我，我们草原部族和中原百姓是不是一家人。我告诉他，看看这地图，看看这历史，我们早就分不开了。语言相通，文化相融，血脉相连。我们不是要消灭差异，而是要在差异中找到共同点。草原的豪迈，中原的厚重，加起来才是完整的中华。这份认同，比任何盟约都牢固。""
MON_jizhongquanli: "工业自立计划"
MON_jizhongquanli_desc: ""第一次看到我们自己造的子弹从生产线上下来的时候，工厂里的工人都哭了。以前我们连螺丝钉都要进口，被人卡脖子太久了。现在，我们能自己造枪，造炮，造机器。虽然质量还不够好，但这是第一步。工业是国家的筋骨，筋骨硬了，腰杆才能挺直。""
MON_zunchongrujiawenhua: "尊崇儒家文化"
MON_zunchongrujiawenhua_desc: ""说实话，我以前对儒家那套不太懂。什么仁义礼智信，总觉得太文绉绉。但统一之后我慢慢明白了，治理国家不能光靠刀枪。我请了几位老学者来给我讲课，他们讲孔孟之道，讲家国天下。我听着听着，觉得有道理。一个国家的稳定，需要文化的根基。儒家讲'和'，讲'秩序'，这正是现在最需要的。""
MON_jinaweixianfenzi: "缉拿危险分子"
MON_jinaweixianfenzi_desc: ""统一了，不代表就太平了。那些旧军阀的残部，那些想搞分裂的，那些在外围煽风点火的，我都知道他们是谁。这些人不除，新政权就坐不稳，老百姓就过不安稳日子。但我只抓首恶，不牵连无辜。该审判的审判，该关押的关押。""
MON_shemiandiguoguanyuan: "特赦神州官员"
MON_shemiandiguoguanyuan_desc: ""这些人以前是旧政权的官员，有人劝我全部清洗。我说，没必要。他们懂治理，懂行政，懂怎么让国家机器运转。只要愿意为新政府效力，既往不咎。我见过一个老县长，头发都白了，还在整理档案。他说，朝代可以换，但百姓的日子不能断。这句话打动了我。所以，我下令特赦那些没有血债的官员，让他们继续做事。人才是国家的财富，不能浪费。当然，贪污腐败的另当别论。""
MON_wendingyuqiangda: "法治与秩序"
MON_wendingyuqiangda_desc: ""以前草原上，谁拳头硬谁说了算。现在不行了，法律面前人人平等。有个王公的儿子犯了事，很多人劝我睁只眼闭只眼。我说，正因为他是王公的儿子，才更要依法处理。法律要有牙齿，才能让人敬畏。秩序建立起来了，百姓才敢投资，敢做生意，敢规划未来。""
MON_gulaodiguodefuxing: "古老帝国的复兴"
MON_gulaodiguodefuxing_desc: ""现在看看这片土地，工厂的烟囱冒着烟，学校的书声琅琅，边境的哨所屹立不倒。我们走了很远的路，牺牲了很多人。但这还不够，复兴不是一代人能完成的。我这一代人的任务，是给下一代人铺好路。让他们站在我们的肩膀上，看得更远，走得更稳。""
