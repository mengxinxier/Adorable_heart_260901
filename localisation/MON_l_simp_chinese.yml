GFX_HJJ_1_end_close_button_TT:0 "§C恭喜您已成功达成《钢铁萌心》第二红巾军满穗线结局！该路线所有内容已全部结束。感谢您见证了中华文化如何以柔克刚、兼济天下，成就了真正的“王道”霸业。旅途暂歇，愿文明之火永燃，期待下个世界线与您再次相遇！§!"
GFX_HJJ_2_end_close_button_TT:0 "§C恭喜您已成功达成《钢铁萌心》第二红巾军张伟线结局！该路线所有内容已全部结束。感谢您见证了华夏武德的极致绽放，完成了扫清寰宇、重整河山的宏伟壮志。旅途暂歇，愿汉风长存，期待下个世界线与您再次相遇！§!"
GFX_MGE_end_close_button_TT:0 "§C恭喜您已完成《钢铁萌心》蒙古艾黛尔贾特线结局。该路线所有内容已全部结束。感谢您陪伴这位充满争议的“大汗”见证了旧秩序的毁灭与新世界的诞生。旅途暂歇，期待您在下一条时间线中书写不同的传奇！§!"
