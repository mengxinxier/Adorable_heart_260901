mon_flavor.91.a:0"那我们就一直打到伦敦！"

mon_flavor.92.t:0"天命之争"
mon_flavor.92.d:0"夕阳如血，横斜在景山的脊梁上。艾黛尔贾特负手立于那株老槐树下，凛冽的北风吹乱了她的发丝，也送来远方怯薛军巡逻时整齐的脚步声。她指尖摩挲着指挥刀，深知征服北方只是开始，如何定义这个新生的帝国，才是最令她焦虑的难题。三位“安达”，正带着各自背后庞大的意志走向权力的巅峰。\n帝弥托利靴根敲击青石板的声音冷硬如冰，他呈上一份充满普鲁士色彩的蓝图，独眼中闪烁着执拗的理性：\n“艾尔，旧时代的泥塑木雕救不了废墟。唯有依靠高效的军政体系与铁路大炮重塑秩序。流亡的俄国将士只效忠于铁血的独裁者，唯有秩序才能让帝国重生。”\n灰太狼野性地嗤笑一声，蹲在山石上撕咬着干肉，浑身散发着草场与马奶酒的气息，他指着北方草原狂气地喊道：\n“那些铁轨喂不饱肚子！大汗应举行库里台大会，加冕‘天赐大可汗’。草原儿郎要的是猎场与野性，我们要在大开大合的分封中保持征服者的本色，而不是在红墙里慢慢发霉烂掉！”\n别烈思走向前，眼神平静如古井，却透着不可撼动的分量，轻声提醒道：\n“陛下，城外千万汉民只认‘天命’。不承袭神州法统，您永远只是过路的掠夺者。唯有前往天坛祭天，正式加冕为‘承天受命之天子’，方能让士绅纳粮、农夫服役，让这多灾多难的山河获得真正的安宁。”\n艾黛尔贾特看着脚下如棋盘般的江山，突然发出一声轻笑，缓缓拔出了那柄染血的指挥刀，刀锋在残阳下折射出刺眼的红芒。"
mon_flavor.92.a:0"我不需要腐朽的祭礼，只需要冰冷的钢铁。"
mon_flavor.92.b:0"既然这天下是苍狼打下的，便该由猎人来分飨。"
mon_flavor.92.c:0"我要让这千万汉民知道，换了人间，亦有道统。"

mon_flavor.93.t:0"统治的重压"
mon_flavor.93.d:0"长白山的暴风雪被挡在厚重的石墙外，边境的刺骨寒意仿佛还残留在这具年轻却疲惫的躯壳里。刚刚结束视察工作的艾黛尔贾特缓缓沉入热气腾腾的温泉池中，硫磺的气味混杂着水汽，让她紧绷的神经有了片刻的松弛。\n就在她闭目养神时，一阵轻微的水声响起。别烈思悄无声息地走进了浴池，坐到了她的对面。在这个被水雾模糊了等级森严的密闭空间里，她们这对“安达”像是两个在漫长征途中偶尔歇脚的旅人。\n“长白山的雪景虽美，但那底下的烂摊子也同样壮观。”别烈思先开口了，她的声音平稳如常，像是一股温润的清流，“陛下，吉林的旧官僚跑了大半，剩下的除了抽大烟就是阳奉阴违。这里的地政如果不理顺，明年春天连草籽都收不上来。”\n艾黛尔贾特睁开眼，看着水雾中若隐若现的安达，露出一抹苦涩的笑：“哪怕是在水里，你也不愿意让我从那些公文里逃走吗？”\n别烈思轻轻捧起一汪温水，任由它从指缝滑落：“因为我知道，您在水面下也依然在勾勒那份帝国的地图。与其一个人烦恼，不如听听‘老一套’的建议。陛下，神州千年的郡县制虽然古老，却有它的道理。建立垂直的行政体系，由中央直接任免流官，把财权和人事权收归大都。唯有这样，这台生锈的国家机器才能真正听命于您的意志。”\n艾黛尔贾特沉默了，她的脑海中浮现出另外两个安达的影子。\n她想起了帝弥托利。那个独眼统帅曾站在满是弹坑的地图前，冷冰冰地提议：“乱世当用重典，建立八大军管总督区。让刺刀代替印章，让宪兵管理街道。只有极端的服从，才能在废墟上建立效率。”\n她也想起了灰太狼。那个总是带着野性笑意的狼王，建议道：“大汗，地盘是弟兄们拿命换的，就该赏给弟兄们！搞什么鸟官僚？让功臣们去领地上当主人，谁在乎自治不自治，只要他们在蒙古旗帜下出兵纳贡，这江山就塌不了！”\n泉水渐渐失去了最初的灼热。艾黛尔贾特猛地站起身，水珠顺着她优美的背部线条滑落。她踩着湿漉漉的青石板走出了浴池，推开一扇窗，任由长白山的冷风灌入。\n在这个雾气氤氲的冬夜，她必须做出裁决，这决定了帝国每一条毛细血管的流向。"
mon_flavor.93.a:0"将这天下化作一座巨大的兵营"
mon_flavor.93.b:0"把江山赏给饥饿的狼群"
mon_flavor.93.c:0"权力不应属于个人，而应属于制度。"

mon_flavor.94.t:0"帝国的脊梁"
mon_flavor.94.d:0"深秋的南苑，枯草在刀子般的北风里伏低了身子。校场边沿，三支画风迥异的部队正进行着一场令观者窒息的模拟合围。\n艾黛尔贾特按着腰间的刀柄，站在高耸的检阅台上。她面前的沙盘上，三枚代表不同兵种的棋子正被推向同一个高地。这场演习不仅仅是为了检验战斗力，更是为了给这个缝合而成的帝国定下未来百年的战争基调。\n帝弥托利站在台缘，风衣下摆在风中猎猎作响。他没有看那些冲锋的士兵，而是死死盯着后方那排吞噬着阳光的重型野战炮。当震耳欲聋的齐射将远方的山头削平一尺时，他头也不回地开口，语调像冰冷的精密零件：\n“艾尔，时代的脉搏跳动在活塞与炸药之间。那些流亡的俄国将士已经用血换来了教训：在密集的火力网面前，任何‘勇武’都是自杀。我们要把帝国变成一座轰鸣的兵工厂，用大口径火炮和钢铁履带去丈量大地。大炮所及之处，即为疆土；履带所过之境，皆为秩序。我们要的是能碾碎一切抵抗的战争机器，而非一群只会尖叫的活人。”\n灰太狼发出一声满是不屑的嗤笑。他正半跨在木质栏杆上，手里反复抛玩着一枚带血的狼牙坠饰。他眯起眼，看着远方那群在炮火间隙中以近乎疯狂的速度切入侧翼的骑兵，眼神中透着一股原始的贪婪：\n“嘿，伙计，你那沉甸甸的玩具在沼泽里就是自掘坟墓。大汗能入关，靠的是长生天赋予的直觉。我们要的是‘掠食者的嗅觉’——极致的机动，不停歇的奔袭。让摩托化步兵像狼群一样分散，再在敌人的喉咙处聚拢。只要我们跑得比情报传达的速度还快，敌人的大炮就只是摆设。把钱砸在发动机和马匹上，让我们的军旗始终飘扬在敌人的后方！”\n一直保持沉默的别烈思此时从阴影中走近，她手中捏着一张详尽的动员令初稿。她没有看炮火，也没有看骑兵，而是望向了校场后方那些望不到头的、正沉默地修筑防御工事的汉人步兵方阵。她的声音不大，却在风中异常清晰：\n“帝弥托利想要钢铁，灰太狼想要速度。但我看到的，是这片土地上无穷无尽的生灵。陛下，帝国最厚的甲胄，是‘民众的血肉’。只要赋予这些沉默的民众保家卫国的信仰，把他们编织成一张密不透风的防御网，我们就拥有了最坚韧的盾牌。”\n艾黛尔贾特看着远方交织的烟尘，她的视线在炮火的火光、战马的残影与厚实的步兵阵线间游走。她缓缓抽出腰间的指挥刀，在沙盘的正中划下一道深痕。"
mon_flavor.94.a:0"钢铁即是意志。帝弥托利，我要你造出最冷的炮管。"
mon_flavor.94.b:0"速度即是天命。灰太狼，去点燃他们的尾巴。"
mon_flavor.94.c:0"万民即是城墙。别烈思，去唤醒他们的灵魂。"

mon_flavor.95.t:0"选贤任能"
mon_flavor.95.d:0"文华殿里支起了一个热气腾腾的火锅。艾黛尔贾特搓着手，看着桌上堆成小山的公文，无奈地叹了口气：“各位安达，咱们把江山打下来了，但帝国不能只靠我们四个。谁来治理地方？谁来管理工厂？谁来执掌法律？”\n三位“安达”围着火锅坐下，气氛倒是比平时轻松了不少。\n帝弥托利优雅地给艾黛尔贾特递了一盘切得极薄的羊肉，但语气依然像是在读说明书：\n“艾尔，别弄那些花里胡哨的。咱们现在最缺的是修铁路的、管工厂的和算账的。我建议直接从那群白军教官和留洋学生里挑人。考试题目就出微积分和蒸汽机原理，谁考得高谁就去当市长。咱们要的是精准的齿轮，不是会写诗的艺术家。”\n灰太狼咬着一根糖葫芦，含糊不清地嘟囔着，顺手往火锅里扔了一把重口味的香料：\n“切，理工男能治国？我的人只认拳头。大汗，听我的，搞个‘军功大比武’。不管是汉人、蒙古人还是我兽族的兄弟，只要能从战场上带回敌人的军旗，或者在校场上以一敌十，那就直接给官做！治理地方就跟放牧一样，需要的是威慑力和体力，让那些读书人去管事，我看三天就得被地痞流氓给欺负哭喽。”\n别烈思坐在一旁，淡定地拨弄着碗里的芝麻酱，她拿出一张手绘的、带点复古色彩的“招贤榜”，笑着摇了摇头：\n“二位安达，一个太冷冰冰，一个太火药味。陛下，这片土地上的人最信这一套——‘考状元’。只要这些拿笔杆子的心定了，天下就乱不起来。与其招一堆只会打架的武夫，不如招一堆会写公文、懂怎么收税的文化人。”\n艾黛尔贾特看着这三个风格迥异的合伙人，又看了看那翻滚的红油火锅，忽然觉得这帝国治理起来，其实也就是火锅里调味的艺术。"
mon_flavor.95.a:0"我们要的是清醒的头脑与服从的双手"
mon_flavor.95.b:0"我要的是永不生锈的利爪与绝对的忠诚"
mon_flavor.95.c:0"我要的是万民的归心与文明的延续"

mon_flavor.96.t:0"金库之钥"
mon_flavor.96.d:0"御书房内，原本用于推演战事的巨大沙盘此时被堆积如山的账册和资源分布图所覆盖。艾黛尔贾特站在殿首，窗外的寒风卷动着蓝色的军旗。统一战争的硝烟尚未完全散去，但另一个更严峻的战场——经济命脉的重组，已经摆在了这位年轻大汗的面前。\n帝国需要庞大的资金去抚平战火的创伤，更需要一套长久的经济逻辑来支撑这台新生的国家机器。\n帝弥托利神色肃穆，他摊开一份详尽的《帝国工业化统制纲领》，指尖重重地划过北方的矿产区。他的声音在空旷的书房内回荡，带着一种不容置疑的理性：\n“艾尔，在一个被钢铁与炸药重塑的世界，财富的唯一形式就是产能。我主张政府必须绝对掌控矿山、交通与重型军工，将有限的资源集中注入国家最迫切需要的领域。我们不能任由散漫的民间资本去浪费生产力。帝国应当成为一座精密运转的超级工厂，每一个环节都服务于国家的生存与扩张。唯有如此，帝国才能在下一次国际博弈中立于不败之地。”\n灰太狼紧锁眉头，他站在代表沿海口岸与贸易路线的沙盘前，手中不断摆弄着一枚代表海外财富的金币。他侧过头，眼神中透着一股不安分的野望：\n“大汗，帝弥托利的蓝图固然稳固，却太慢，也太沉重。应当赋予商队与贸易公司极大的自由，通过降低关税和官方担保，鼓励他们下南洋、跨远洋，用帝国的武力作为后盾，去攫取全球的原材料和财富。我们要建立的是一套以金币为燃料、以舰炮为边界的全球贸易网。让大都成为世界的债主，用全世界的血汗来滋养帝国的繁荣。”\n别烈思始终保持着冷静的沉默，她手中握着一份关于基层农户纳粮情况的统计折子。她越过那些华丽的数字，直接看向艾黛尔贾特，语气沉稳如山：\n“神州千年的兴亡已证明，失去土地的流民才是国家动荡的根源。我们必须推行土地公有基础上的家庭承包，建立基层农会，保障普通百姓的生存权不受工业扩张与大资本的剥削。只有让四万万子民安居乐业，帝国才有取之不尽的兵源与税源。厚积薄发，才是万世基业。”\n艾黛尔贾特听着三种治国逻辑的博弈。这不仅仅是经济路径的选择，更是关于帝国灵魂的定义——是效率至上的兵工厂，是掠夺全球的金融巨兽，还是承载万民的安稳乡？"
mon_flavor.96.a:0"钢铁即是力量，秩序高于一切。"
mon_flavor.96.b:0"财富流向之处，即是帝国疆域。"
mon_flavor.96.c:0"民为国本，社稷次之。"

mon_flavor.97.t:0"谁是我的木华黎"
mon_flavor.97.d:0"艾黛尔贾特独自站在景山之巅，俯瞰着这座笼罩在硝烟余烬与昏黄灯火下的旧都。\n\n她想到了那个男人——铁木真。当成吉思汗向西驰骋、横扫亚欧大陆时，他身后始终站着一个叫木华黎的人。木华黎替他镇守神州，替他梳理乱局，替他把征服后的废墟变成帝国的粮仓。\n\n“木华黎……”艾黛尔贾特低声呢喃，自嘲地勾起嘴角，“我打下了半个天下，却被这半个天下的琐事锁在了龙椅上。我需要一个能代我执掌利剑的人，一个能让我放心把后背——甚至把这片江山都交托出去的人。”"
mon_flavor.97.a:0"这个人就是帝弥托利"
mon_flavor.97.b:0"这只狼就是灰太狼"
mon_flavor.97.c:0"这个人就是别烈思"

mon_flavor.98.t:0"星辰与齿轮的誓约"
mon_flavor.98.d:0"艾黛尔贾特在深夜的露台上找到了帝弥托利。他正望着远方的灯火，背影孤寂得像一柄插在雪地里的断剑。艾黛尔贾特走上前，将代表军政大权的印信重重地按在他冰冷的掌心里。\n\n“帝弥托利，我厌倦了那些无意义的争吵和推诿。按你的路子来吧——把这个国家变成冰冷的钢铁，变成绝对的秩序。我想看看，你口中那个‘不再有无谓牺牲’的世界到底长什么样。”\n\n帝弥托利低头看着手心的印信，随后转过头，那只独眼中闪烁着一种近乎温柔的决绝：\n\n“如果你感到了疲惫，那就把重量分一半给我吧，我的老朋友。我会为你筑起一道钢铁的长城，让每一颗螺丝都契合你的意志，让每一管炮火都守护你的睡梦。这或许是一个冰冷的国家，但只要能让你不再为那些卑微的琐事劳神，哪怕化身为最严酷的暴君，我也心甘情愿。艾尔，睡吧，星辰落下之前，我会让这片土地像心脏一样精准地跳动。”"
mon_flavor.98.a:0"“帝弥托利，你眼中的秩序，是否也能容纳我的梦想？”"

mon_flavor.99.t:0"苍狼与烈酒的远征"
mon_flavor.99.d:0"艾黛尔贾特在一片嘈杂的营地里找到了灰太狼。他正和士兵们摔跤，赢了之后抢过一碗烈酒仰头灌下，满脸都是肆意妄为的狂汗。\n\n艾黛尔贾特一脚踢开空酒坛，在大笑声中宣布：\n\n“灰太狼！够了！我不玩那种精细的治理游戏了！这江山是你们打下来的，就按你的法子分了吧！谁立了功，谁就去当领主！我只要帝国的旗帜所到之处，全是咱们的猎场！”\n\n灰太狼抹了一把嘴边的酒渍，猛地跳上酒桌，发出震天的豪笑：\n\n“哈哈哈哈！大汗！您总算活的像那个铁木真的样子了！什么文官武官，全是狗屁！听我的，把那些繁文缛节全扔进火堆里烤肉吃！地盘给弟兄们，想怎么折腾怎么折腾，只要您一声哨响，天涯海角咱们都冲锋在前！走！今天不谈公文，咱们先去围猎那个不安分的行省，顺便把那里的地头蛇抓来给陛下跳个舞！”"
mon_flavor.99.a:0"如果你厌倦了这些令人作呕的算计，想要把这江山还给那些最原始的勇气与忠诚，他是唯一的选择。"

mon_flavor.100.t:0"春风与讲章的洗礼"
mon_flavor.100.d:0"艾黛尔贾特回到御书房时，别烈思正静静地修剪着一支快要燃尽的红烛。艾黛尔贾特在书桌前坐下，像个功课没做好的学生一样，轻轻推过那一叠乱七八糟的内务报告。\n\n“安达，我终究还是做不到像您那样冷静。我想尊您为师，请您与我共同执掌这个国家。按照您说的，用纸笔代替刀剑，用考试代替杀戮。我想让每个人都有机会通过努力改变命运，而不是在泥潭里挣扎。”\n\n别烈思抬起头，眼神中带着一种宽容的欣慰，她轻轻握住艾黛尔贾特那双因为握笔而磨出老茧的手：\n\n“陛下，这是你交给我的最后一份习题，也是最难的一份。治国就像教书，不能急于求成，要给这片土地生长的气力。别怕，虽然这条路慢得让人焦虑，但只要我在你身边，每一滴墨水都会化作帝国的基石。去做你想做的事吧，这些繁杂的‘批改’工作，就交给我来处理。”"
mon_flavor.100.a:0"“是，别烈思老师！”"

mon_flavor.101.t:0"托卡马克之冠"
mon_flavor.101.d:0"别烈思对艾黛尔贾特经常戴的那顶风格极其……“硬核”的帽子充满了好奇，它用纯金打造，两侧高高耸起两根弯曲的、极具侵略性的牛角，额头正中心还镶嵌着一颗鸽子蛋大小、仿佛随时会射出镭射光的红宝石。\n“陛下，”别烈思终于忍不住问道，“虽然我知道帝国的时尚界一直比较包容，但您顶着这两根……牛角批阅奏折，真的不觉得脖子酸吗？还是说，这是某种我还没跟上的先锋艺术？”\n艾黛尔贾特有些尴尬地扶了扶沉重的帽子，宝石在烛火下闪着妖异的光：“安达，您就别取笑我了。这是咱们家的祖传宝物，有个特别响亮的名字，叫——‘托卡马克之冠’。”\n“何意味？”别烈思困惑不解，“听起来很——特别？这位祖先一定很有想法。”\n“想法可不止一点点。”艾黛尔贾特叹了口气，把这顶沉重的金帽子摘下来搁在桌上，发出‘咚’的一声闷响，“据说这位祖先当年戴着它写下了一套极其激进的理论。他认为，在西欧那帮‘文明人’眼里，咱们俄罗斯人永远是一群骑着熊、挥舞着伏特加的野蛮人。这种偏见就像北极的冰层一样厚，根本没法靠外交辞令化解。所以，那位祖先的逻辑非常简单粗暴：既然矛盾无法调和，那就不调和了。”艾黛尔贾特指着那两根牛角，比划了一个冲锋的姿势，“俄罗斯人必须像推土机一样积极西进，用最激烈的战争把西欧那帮优雅的绅士全揍趴下。只要咱们取得了绝对霸权，他们就会乖乖承认咱们才是‘文明的终点’。这顶帽子，就是象征着‘像公牛一样撞碎铁幕’的决心。”\n别烈思愣了两秒，随即笑得直不起腰来，甚至不得不扶住桌角才能站稳。\n“哎呀，陛下……这位祖先真是个……天才。”别烈思一边擦着笑出来的眼泪，一边打量着那顶夸张的帽子，“这种‘只要我把邻居全打服了，我就没有社交压力’的思路，真是充满了某种……朴素的智慧。”\n“所以我平时都不敢戴出去，怕吓着那帮汉地老儒生。”艾黛尔贾特无奈地看着红宝石，“他们肯定会觉得我是被哪里的牛魔王附体了。”"
mon_flavor.101.a:0"“好啦，把这沉重的‘霸权’收起来吧。现在咱们需要的是用笔杆子让天下归心，而不是用这两根金角去顶碎别人的门牙。”"


mon_politics.1.t:0"神州崩溃"
mon_politics.1.d:0"最令人忧惧的变局终究还是来了——神州帝国轰然崩解，而草原的命运，亦如断线之鸢，飘摇于未知的风中。"
mon_politics.1.a:0"混乱是阶梯……"

mon_politics.2.t:0"辽满军投降"
mon_politics.2.d:0"我军以迅雷不及掩耳之势冲进了沈阳，俘虏了大半辽满军高层，东北已经是我们的囊中之物了。"
mon_politics.2.a:0"打得漂亮"

mon_politics.3.t:0"弥留之际"
mon_politics.3.d:0"漏风的帐篷内，一阵又一阵的咳嗽伴随着炭火迸裂的噼啪声；病榻前，油灯将伊欧尼亚斯·冯·弗雷斯贝尔古枯槁的面容映在帐壁上，每一次呼吸都沉重的如同破损的风箱。艾黛尔贾特与帝弥托利静立在侧，帐内只有苦涩的药味与死神身上随时垂下的镰刀。\n\n“时机……快到了。”老首领的声音从干裂的唇间挤出，鹰隼般的目光死死锁住北方，“北方的赤匪看似不可战胜，但他们内在的疾病正在侵蚀他们的力量。记住……我们的大业，在圣彼得堡的冬宫，在莫斯科的圣巴西尔大教堂.......”\n\n艾黛尔贾特却踏前一步，眼中燃烧着截然不同的火焰：“父亲，欧洲是一片烂泥潭。真正的天命在草原！在中原内乱、赤熊疲敝之际，长生天赐予的时机是重建我们的帝国——北至贝加尔湖南至两广地区，这才是属于弗雷斯贝尔古家族的冠冕！”\n\n“你……你这不知所谓的蠢货！”伊欧尼亚斯猛然咳嗽起来，随后举起手指，浑浊的双眸似要迸发火星般的颤抖地指着她，“至高无上的沙皇陛下赐予我们荣耀与姓名，你的血管里流淌着双头鹰赐予的忠诚！而你现在……竟想去做一群东亚蛮子的首领？！”\n\n“不是首领，是可汗。”艾黛尔贾特的声音冰冷而坚定，“用蒙古的怯薛们为我们夺取本应属于我们的土地，再用俄罗斯的意志统治它。这就是长生天赐予我的天命。”\n\n老将军用尽最后力气挥袖，仿佛要扫清这大逆不道的幻影：“滚！立刻……从我眼前消失！”\n\n随着帷幔的落下，将一老一少的身影隔开，如同一道深不见底的沟壑横在二者中间，艾黛尔贾特在帐外叹了口气，便随着几名上前询问的随从一并离开。\n\n伊欧尼亚斯向着帝弥托利胡乱抓去，用尽最后一丝力气说道：“听着……辅佐她.......她真的有能力带着你们重返莫斯科.......”他的瞳孔开始涣散，声音轻如耳语，但双眸仍旧如铜铃般瞪圆“若她要将这最后的血脉……葬送在不切实际的狂梦里……你必须阻止她.......用任何.......”\n\n风从帐帘的缝隙钻入，呜咽着掠过已无声息的病榻，吹动了帝弥托利额前的发丝。他低下头，用沙俄军官最标准的姿态，行了一个漫长而沉默的军礼。"
mon_politics.3.a:0"“我会的，殿下。”"

mon_politics.4.t:0"北特雷森反动派政变！"
mon_politics.4.d:0""
mon_politics.4.a:0"我们暂时管不了他们"
mon_politics.4.b:0"我们必须剿灭叛匪！"

mon_politics.5.t:0"梦"
mon_politics.5.d:0"草原那蚀骨的冬风裹挟着雪沫，拍打着这座临时营地。旗帜在冬月的注视下猎猎作响，远处山坡上成片幽绿狼眸冷冷的注视着这群陌生的人群，偶尔发出一两声长嚎刺破呼啸的风声，像是警戒，又像是呼唤着其他狼群。帐内，守夜的士兵或举着火把往返巡视，或是在帐外凝视着远方与狼群；艾黛尔贾特·冯·弗雷斯贝尔古穿着沙俄时期的军大衣——肩头的绶带已磨损脱线，再也无法维持住她的体面，正如同她的前辈们当年也没能抵挡住布尔什维克的洪流，在帐内炭火的氤氲中，她沉入了长生天独为他构筑的梦境——她化为了白海青矗立在大汗的旗杆上，凶戾的的鹰眼越过了千里，越过了簇拥的怯薛们，越过了如蝗灾般浩浩汤汤的蒙古铁骑，越过了不同城墙不同民族不同肤色的人们惊慌失措逃窜的胆怯行径；他看到了南宋的战船在烈火中沉入江底，看见桀骜不驯的中亚骑兵在黄沙中折戟，看见罗斯勇士的铮铮铁甲随坍塌的城墙一同化为了齑粉..........最终，目光从时间长河收起，聚焦在了忽里台大会上，那个正朝她微笑，并将一截用于祭祀长生天的白马马骨，向她抛来的男人——孛儿只斤·铁木真。一声狼嚎打断了长生天的梦境，艾黛尔贾特在营帐中听着手下结结巴巴叙述着远处的狼群叼来一根马腿骨后就离开的奇遇，梦境与现实在此刻轰然交汇。她凝视着那根来自狼群——抑或来自长生天的马骨，做出了必将撼动自己与整个蒙古命运的决定。"
mon_politics.5.a:0"这是长生天给我的神谕！我就是铁木真再世！"

mon_politics.6.t:0"总督衙门外的抗议"
mon_politics.6.d:0"琳迪斯签发的戒严令已下发多日，这天总督府门外已聚起黑压压的人群——牧民、商贩、连边军家属都来了。他们没带武器，只举着空粮袋、断缰绳和烧焦的税单，沉默地站着，像一片冻僵的怒火。\n\n最让琳迪斯心头一沉的，是人群最前头站着的草原长包包大人。他声音不高，却字字砸在人心上：“琳迪斯大人，我们不是来造反的。我们只想问一句：这日子，还能不能过？”\n\n底下顿时炸开锅。有人哭喊去年交了三回“边防捐”，羊圈都空了；有人说儿子被拉去南方镇压革命党，尸首都找不着；还有人指着府门：“连庙里的铜钟都被你们熔了铸子弹！”\n\n琳迪斯站在门口，手按佩枪，指节发白。身后数十名边军士兵已列阵待命，徐树铮低声催促：“大人，乱民聚众，法不容情，该清场了！”可她没动。她记得三年前初任总督，办了不少实事。这位包包大人还送过她一匹汗血宝马，说“草原敬重有骨气的官”。\n\n如今，骨头早被苛税啃光，只剩一张皮。"
mon_politics.6.a:0"开火！"
mon_politics.6.b:0"同意谈判"

mon_politics.7.t:0"安北都司保住了"
mon_politics.7.d:0"接下来七日，总督府议事厅昼夜不熄灯。琳迪斯没摆总督架子，撤了高座，与草原各族推举的代表围坐长案，茶凉了续，话断了接。她亲自执笔，逐条记录诉求——免税三年、停征丁壮、归还庙产、恢复牧区自治……\n\n双方争到第八夜，包包大人忽然起身，将一柄祖传弯刀放在案上：“若总督信得过草原，此刀可代兵符——我等愿以血誓，不叛神州。”\n\n琳迪斯沉默良久，解下腰间佩枪，与弯刀并置：“我亦以命担保，此约不毁。”\n\n第九日黎明，《北疆安民约》落印。草原诸部暂息干戈，仍奉神州正朔。"
mon_politics.7.a:0"太好了"

mon_politics.8.t:0"草原暴动"
mon_politics.8.d:0"枪声响起,琳迪斯看着子弹撕裂人群。第一轮齐射，前排倒下一片；第二轮，哭喊变成死寂。她原以为威慑足以驱散乱民——可当她看见包包大人胸前绽开的血花，那具庞大的身躯缓缓跪倒、却仍朝都督府方向撑着不肯全倒时，她就知道：完了。\n\n草原没被吓住，反而炸了。\n\n牧民烧了税所，狼族割了驿道，连一向恭顺的羊族都拿起了刀枪。边军出营平乱，反被击退，只能固守军营。\n\n琳迪斯困守孤城，电报发不出去，援军遥遥无期。幕僚们吵成一团：有人主弃城南撤，有人劝她自尽谢罪，不过还有不少人主张求助流亡白军——尽管他们没有他们的同胞苏联军队训练有素，但对抗没有专业训练的暴民绰绰有余。\n\n琳迪斯闭上眼。\n\n她知道，一旦引入白军，北疆将永无宁日。那些人不是兵，是野兽。可若不引……明日此时，她的头颅或许已在叛军马鞍上晃荡。"
mon_politics.8.a:0"我们的官兵能处置好"
mon_politics.8.b:0"求助白军"

mon_politics.9.t:0"白军政变"
mon_politics.9.d:0"琳迪斯犯了一个致命的错误：她以为自己在利用一群走投无路的流亡者，却忘了狼从来不会因为给了一口肉就变成狗。\n\n白军的行动快得惊人。他们以雷霆手段镇压了草原暴动，鲜血洗刷了每一座反抗的村落。但当最后一声枪响平息，这支军队并没有向总督府缴械复命，反而调转了枪口。\n\n深夜，总督府的大门被重炮轰开。\n\n琳迪斯在睡梦中被爆炸声惊醒，当她披衣冲出卧室时，看到的不是前来汇报战果的下属，而是端着刺刀、面无表情逼近的白俄士兵。而在队伍最前方，艾黛尔贾特一身戎装，皮靴踏过满地的碎瓷片，眼神中只有冰冷的野心。\n\n“你……你想干什么？”琳迪斯声音颤抖，“我是神州任命的总督！你敢造反？！”\n\n“造反？”艾黛尔贾特轻笑一声，笑声在空旷的大厅里回荡，令人毛骨悚然，“琳迪斯女士，你搞错了一件事。我从来就不是你的部下，也不是神州的臣民。我唯一的信仰，就是生存和征服。你给了我兵权，给了我地盘，现在，我只是拿回属于我的东西罢了。”\n\n她挥了挥手，几名白俄军官上前，粗暴地夺下了琳迪斯卫队的武器。\n\n“滚吧，”艾黛尔贾特指了指敞开的后门，那里是通往南方的密道，“趁我还没改变主意之前。”\n\n琳迪斯面如死灰，在亲信的搀扶下狼狈逃窜。她甚至不敢回头，生怕下一秒背后就会传来枪声。\n\n七日后，库伦。\n\n没有繁复的汉式礼仪，只有草原传统的祭天大典与东正教的祝圣仪式交织在一起。\n\n艾黛尔贾特身披绣有双头鹰徽的蒙古大袍，登基为“蒙古汗国”大汗。\n\n北疆的风雪呼啸而过，卷起新的旗帜——那是长生天与双头鹰的结合，象征着一种前所未有的、冷酷而强大的混合力量。"
mon_politics.9.a:0"引狼入室"

mon_politics.10.t:0"长风卷地"
mon_politics.10.d:0"数十年的憋屈，昨夜终于随着一声号角彻底炸开！\n\n那些穿着黑皮靴、说着我们听不懂的汉话、强征我们马匹和粮食的“总督府”老爷们，完了！昨晚，草原上的风不再是冷的，是热的——那是我们燃烧起来的怒火。各个部落的骑手像狼群一样从四面八方涌来，连那些原本给琳迪斯看大门的蒙古族边军兄弟，也调转枪口加入了我们。听说了琳迪斯连官印都来不及带，只在几个亲信的掩护下，连夜摸黑往长城以南逃窜。我们没追，因为没必要——让她回去告诉南边的那些大人物：草原不再是他们的牧场了！\n\n从今往后，草原的一草一木、一牛一马，都只属于草原的儿女们！谁再敢来收税、抓丁，就问问我们手里的弯刀答不答应！"
mon_politics.10.a:0"草原的风已经带来了自由的味道"

mon_politics.11.t:0"推选新草原长"
mon_politics.11.d:0"随着安北都司的官僚体制在战火中瓦解，古老的土地再次回到了牧民手中。但在庆祝胜利的篝火旁，一个迫切的问题正悬在每个人的心头：谁能接过这柄沉重的苏鲁锭长枪？\n\n在羊村的大礼堂中，三位截然不同的领袖正等待着氏族代表们的最终裁决。\n\n喜羊羊穿着简朴的学者长袍，他脖子上的铃铛声代表着智慧。他主张“科学兴蒙”，认为只有通过理性的教育与自由的社会，让草原与世界文明接轨，才能真正摆脱被奴役的命运。\n\n兔子则站在一面鲜红的旗帜下，他那双坚定的眼睛注视着最底层的牧民。他曾亲手烧毁地主的契约，主张建立工农联合公社。在他看来，唯有通过彻底的阶级觉醒与集体工业化，草原才能在列强的夹缝中挺起脊梁。\n\n而灰太狼披挂着狰狞的狼皮铠甲，指尖划过祖先留下的利刃。他毫不掩饰自己的野心——洗刷“悲鸣战役”的屈辱，重塑成吉思汗时代的铁血威权。他并不追求和平，他追求的是让整个欧亚大陆在狼嗥中再次颤栗。\n\n三条道路，三个未来。长生天的风已经吹起，而我们必须做出抉择。"
mon_politics.11.a:0"喜羊羊"
mon_politics.11.b:0"兔子"
mon_politics.11.c:0"灰太狼"
mon_politics.11.e:0"陷入僵局"

mon_politics.12.t:0"金銮殿上的寒风与孤影"
mon_politics.12.d:0"艾黛尔贾特坐在那张曾属于几十位皇帝的龙椅上，只觉得那些繁复的龙纹像钢针一样扎手。\n她原本幻想着自己能像成吉思汗那样，指挥着轰鸣的装甲师横扫欧亚，在大地的脊梁上刻下蒙古的名号。可现实是，她入主紫禁城才短短几个月，那场英雄梦，就被无穷无尽的琐碎内务给埋了。\n“大汗，‘坏消息’又像雪片一样落下来了。”\n灰太狼那张像被脱水机绞过的老脸准时出现，手里捏着一叠发烫的电报纸，语调毫无波澜，仿佛在读一份过期菜谱：\n“西北的游击队昨晚炸毁了陇海线的三个涵洞，顺便在那列装满备用零件的货车车厢上涂满了辱骂您的打油诗。”\n“由于连年战火叠加蝗灾，地方上的绅士和农民已经穷得只能分食树皮。如果您执意要征收那笔“第二次世界征服准备金”，他们大概率会把村头的破猎枪对准您的税务官——据说山东的四个税务官已经逃跑了三个，剩下的那个正躲在草堆里装疯卖傻。”\n“昨天刚在城门外公审了一批破坏分子，今天他们的表亲、邻居和路过的围观者就全部消失在山林里成了新的破坏分子。”\n艾黛尔贾特感觉脑袋隐隐作痛，她曾梦见成吉思汗对她微笑。可昨晚的梦变了样：成吉思汗变成了一个戴着老花镜的会计，正绝望地拨弄着算盘，然后指着一叠堆到房顶的欠条对她说：“孩子，别打仗了，先去把债务结一下吧。”\n她盯着金銮殿顶上那条威严的盘龙，觉得那玩意儿蜷缩的姿态怎么看都像是在嘲讽。入城那天，她以为自己抓住了历史的缰绳；现在她才发现，自己是掉进了一个巨大的、红色油漆剥落的陷阱。\n世界征服？\n艾黛尔贾特发出一声自嘲的冷笑，顺手把一份写着“某军区因粮饷不足开始变卖卡车轮胎”的报告扔进火盆里。\n现在的她，连想在晚宴上吃一盘新鲜的、没被特务投毒的牛肉，都得先想一想这笔开支会不会导致某个前线师团的电台电池彻底断货。\n她看着窗外那一成不变的、灰蒙蒙的天空，喃喃自语："
mon_politics.12.a:0"“世界很大，大到我想用铁蹄把它踩碎，它却只想用这些烂账把我耗干。”"

mon_politics.13.t:0"安达之盟"
mon_politics.13.d:0"在紫禁城中，艾黛尔贾特遇到了一位意料之外的来访者——孛儿只斤·别烈思。她那双仿佛看穿一切的淡然眼睛落在艾黛尔贾特身上，语气虽然平和，却掷地有声：“我看到了你的迷茫。如果你只把这片土地当作奖赏，它很快就会反噬你。唯有将权力的基石下沉到那些最沉默的汉民百姓中，保障他们的生存与尊严，这帝国才会有真正的灵魂。”\n话音未落，艾黛尔贾特身旁的帝弥托利打破了宁静：“艾尔，别听这些空谈！随您南下的俄国流亡者抛弃了故乡，他们需要土地、爵位和钢铁般的秩序。只有让他们成为这个帝国的脊梁，您的统治才无懈可击！”\n“嘿，别把功劳都往自己身上揽！”灰太狼叼着一根枯草，带着草原特有的野性说到，“别忘了那些在马背上为你冲锋陷阵的草原子弟，我们要的不是什么法典，而是这大片草场的自由和属于征服者的尊严！”\n三种声音，三套截然不同的逻辑，在空旷的大殿里回荡。艾黛尔贾特感到头痛欲裂——她不可能在保护普通人的同时给予流亡者特权，也不可能在推行汉化秩序的同时满足草原的野蛮扩张。\n忽然，她站了起来，随手拔出案头的匕首，发出一声短促而干脆的冷笑。\n“够了。你们都在争夺我，却忘了我们现在是一条船上的死士。”\n在众人惊愕的目光中，艾黛尔贾特命人撤去华丽的屏风，在大殿中心生起了一堆象征草原传统的篝火。她将匕首掷在地上，语气不容置疑：“既然你们各执一词，那就用草原最古老的规矩来办。今天，我不做大汗，你们也不是臣子。”\n她划破掌心，将血滴入盛满烈酒的银碗中，看向三位愣住的伙伴：“我们要按照草原传统结为‘安达’。从此以后，你们的理想就是我的理想，我的重担就是你们的重担。我们共享权柄，也共担血债。”\n别烈思看着那个银碗，嘴角露出了一丝难得的微笑。帝弥托利沉默良久，收起了佩剑。灰太狼则哈哈大笑，第一个走上前。四人的鲜血在银碗中交融，象征着三种截然不同的利益被强行捆绑在了一起。"
mon_politics.13.a:0"安达同心，其利断金"

