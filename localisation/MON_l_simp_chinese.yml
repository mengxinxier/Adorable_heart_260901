gxc_hjj.1.t:0"重开中华天"
gxc_hjj.1.d:0"随着大元帝国最后一面索永布旗在城头落下，第二次红巾军起义宣告全面胜利！\n\n街头巷尾，锣鼓喧天。曾经被划分为“贱籍”的奴工、被强征的士兵、流亡的学子与普通农人，此刻紧紧相拥，喜极而泣。伯雷帖木儿的残暴统治已成历史，那个等级森严、人命如草芥的黑暗时代终于终结。\n\n“我们成功了！”一位老兵高举着生锈的步枪，对着欢呼的人海大喊，“从今往后，这天下不再姓孛儿只斤！这中华的天，是我们汉人自己重开的！”\n\n夜幕下，万家灯火通明。人们煮起“团结粥”，唱起新歌谣。没有盛大的阅兵，只有亿万普通人脸上久违的笑容与尊严。一个新的时代，在废墟与希望中正式降临。"
gxc_hjj.1.a:0"旧天已塌，新天重开。"

gxc_hjj.2.t:0"汉家烟火，普照大千"
gxc_hjj.2.d:0"随着最后一艘远征舰队在漫天霞光中归航，这个在废墟上建立的新中国，终于站在了人类历史的顶点。\n\n这不是一个铁血霸权带来的冰冷盛世，而是一场由满穗亲手编织的、温润如玉却坚不可摧的文化涅槃。当年的少女已成国母，她所坚持的路线，既非神州帝国的陈腐官僚，亦非太平天国的狂乱幻梦。她走出的，是一条“华夏风骨，共和体魄”的奇迹之路。\n\n在长达数年的博弈中，共和国击碎了西方列强的枷锁。然而，真正的胜利并不在战场，而是在于战后的重建：汉文化不再是被尘封的古董，而是化作了普世的价值观。从北京的议政厅到泰晤士河畔的汉学院，民主、仁义、礼法与科学在这一刻达成了完美的调和。\n\n全世界都在学习汉字，学习那种“天行健，君子以自强不息”的民族韧性。满穗治下的新中国，以一种前所未有的姿态，将汉文化的火种播撒到了每一个纬度。这不再是一个民族的私产，而是一个文明对全人类的温柔救赎。\n\n今日，满穗立于紫禁之巅，望着下方如巨龙般复苏的山河。她身着洗尽铅华的汉服，腰间挂着当年起义时的旧佩饰。风吹过，她仿佛听到了历史的回响——那是朱元璋的驱逐、李定国的孤愤、文天祥的丹心，在这一刻，所有的苦难都化作了盛世的太平。"
gxc_hjj.2.a:0"万古长青，这是我们的时代。"

gxc_hjj.3.t:0"汉家铁甲，马踏全球"
gxc_hjj.3.d:0"当旧世界最后一面抵抗的旗帜在重炮的轰鸣中化为灰烬，当列强引以为傲的都城尽数升起华夏新军的战旗，地球，这颗曾经喧嚣不休的蓝色行星，终于在一种令人战栗的肃杀中迎来了绝对的寂静。\n\n中华民族共和国完成了自古以来没有任何一位帝王或统帅敢于想象的旷世伟业。神州帝国末期的丧权辱国与前人温和的仁义之说被彻底抛弃。张伟深信，在这座残酷的万国丛林里，汉民族若要获得永恒的生存空间，唯一的途径就是捡起遗失千年的铁血本能，用最冰冷的剑锋划定世界的规矩。\n\n如今，从波涛汹涌的大西洋到冰雪覆盖的西伯利亚，从赤日炎炎的撒哈拉到风雪交加的南极点，世界的版图被彻底重塑。中华民族共和国的疆域内，每一座工厂都在为战争机器轰鸣，每一所学校都在向年轻一代灌输着绝对的忠诚与尚武精神。“汉家武德”不再是一个抽象的词汇，它变成了主宰全球的唯一法则。曾经高高在上的列强被彻底打碎、重组，成为了庞大帝国战争机器上的齿轮与附庸。\n\n今日，身着极简却透着威压的统帅制服，张伟立于天安门广场那座由无数缴获兵器熔铸而成的巨型“镇海纪功碑”下。他的目光越过无数列阵的钢铁洪流，那是由千万名武装到牙齿的汉家子弟组成的无敌之师。\n\n他没有发表冗长的演说，因为已经没有敌人需要被震慑，也没有盟友需要被拉拢。他只是按着腰间的战刀，看着猎猎作响的军旗，留下了一句注定被镌刻在人类历史终章的宣告：\n\n“既然这世界从未给予我们仁慈，那我们便赐予这世界秩序。”"
gxc_hjj.3.a:0"日月所照，江河所至，皆为汉土。"

gxc_hjj.4.t:0"封狼居胥的千年回响"
gxc_hjj.4.d:0"在关中平原清冷的微风中，茂陵旁那座状如祁连山的古冢终于褪去了数十年的荒芜与落。随着国家“重铸民族脊梁”计划的推进，大汉冠军侯——霍去病的陵园迎来了本世纪最庄严的一次修复工程。\n\n两千多年前，那位年仅二十岁便横挑大漠、饮马翰海的白衣神将，用最决绝的冲锋定义了华夏民族的生存边界。他在狼居胥山上设坛祭天的背影，不仅是游牧掠夺者挥之不去的梦魇，更是汉家儿女百折不挠、“寇可往，我亦可往”的精神图腾。\n\n重修竣工之日，当那尊铭刻着“马踏匈奴”的巨大石雕被安置于祭坛中央时，旷野上回荡着肃穆的礼乐，仿佛在回应跨越千年的金戈之声。这不仅是对一位古代战神的缅怀，更是劫后重生的神州大地对寰宇发出的静默宣告：那个曾经敢于在朔方荒原上追亡逐北的民族，已经彻底打碎了锁链，以主人的姿态重新屹立于大地之上。\n\n人们将一束束采自边疆的青草静静放在墓前，轻声诵读着那句响彻千古的豪言——“匈奴未灭，无以家为”。此刻，这不再是史书上的余音，而是熔铸进新时代脊梁里的不灭军魂。"
gxc_hjj.4.a:0"以冠军之名，重铸钢铁脊梁。"

gxc_hjj.5.t:0"武悼天王的归处"
gxc_hjj.5.d:0"在一系列民族英雄纪念场所的修复名单中，一份特殊的提案被摆上了决策层的办公桌。民间与部分基层官员联名提议，在曾经的魏都旧址上建立一座正式的冉闵纪念园。\n\n这份提案瞬间点燃了舆论的火药桶，在闭门会议上，决策者们的分歧几乎让讨论陷入僵局。\n\n支持者们对此抱有极大的热情。他们认为，在那个汉家文明几乎被黑暗吞噬、种族存亡悬于一线的极暗时刻，是冉闵以雷霆手段发出了求生的怒吼。在他们看来，冉闵虽然手段残酷，却是那个时代的必然选择，他以一己之力挽救了中原遗民的火种。支持者坚称，纪念冉闵就是纪念民族在绝境中不屈的反抗精神，这种铁血意志是新中国立国之本中不可或缺的一环。\n\n然而，反对者的声音同样冷静而犀利。他们反驳称，将冉闵塑造成民族英雄纯属对历史的误读。反对者指出，冉闵本质上是一个投机军阀，其行为动机完全出于个人的政治野心。他们列举史实证明，冉闵所谓的“杀胡”带有极强的选择性与政治表演成分：他曾长期认贼作父，甚至在掌权后依然大量留用他认为有利用价值的胡人将领，而将屠刀挥向那些失去利用价值的平民。反对者担忧，为一个毫无政治底线的投机者立祠，不仅会有损新政权的形象，更是在弘扬一种虚伪且危险的极端民族主义。\n\n厚重的史料与现代的社会评估报告交织在一起，关于这位争议领袖的评价，正考验着这个新生政权的政治智慧。"
gxc_hjj.5.a:0"他是民族孤苦时的最后护盾"
gxc_hjj.5.b:0"文明不应为投机者冠以荣光"

gxc_hjj.6.t:0"岳王庙前的旧梦"
gxc_hjj.6.d:0"杭州的雨总是带着一股子散不去的潮气，黏在修葺一新的青砖上，倒映着天光云影。\n赵玖走在前方，他身后的杨沂中，依旧落后半步，半截身子藏在檐下的阴影里，警惕着周围可能存在的敌人——虽然并不会存在。\n“这次重修的效果确实不错。”赵玖踏过门槛，目光扫过那红墙绿瓦。\n他并非第一次穿越，大元为了制造新式魔导装备而进行的源石实验反而将他这个以21世纪的大学生之躯，穿越到赵构肉体上，锻造出了一个重整山河的“绍宋”，最终在百官的朝贺与万民的安康中寿终正寝的“大宋官家”以英灵召唤的形式给拽到了这个陌生又熟悉的魔幻世界。他至今记得从井中爬出后，看到那蒙元旗和黑色万字旗飘扬在华夏时的荒谬感，随后便是毫不犹豫地带着杨沂中投向了那支扎着红巾、喊着“驱除鞑虏”的队伍。\n迈入岳王庙正殿，岳飞的坐像威严依旧，烟火缭绕中透着一股子不灭的英气。赵玖熟练地取过三炷香，拜得极深。他比谁都清楚，在这一支支流传于诸天万界的“历史”残卷里，岳飞这两个字，究竟重逾多少斤两。\n然而，当他转步走向侧廊的跪像区时，脚步还是在刹那间凝住了。\n在那几具铸铁的跪像中，除了他早已熟悉得发腻的秦桧、万俟卨之流，赫然耸立着一尊身披冕服却反剪双手的石像。那石像被剥去了冠带，膝盖死死地砸在青石板里，面容在风化与民众的唾弃中显得模糊而丑陋。\n赵玖当然知道这是谁。在降临之初，他便从历史书里读到了这个世界的轨迹：没有八公山的惊变，没有九龙井边的神启，更没有那个杀伐果断、重整山河的赵玖。有的只是和他熟悉的那段历史同样的一个在惊惶中南逃、在岁币中苟活、最终亲手杀掉民族脊梁的懦夫赵构。\n“终究还是跪在这里了啊。”赵玖看着那尊和自己并不像的丑陋脸孔（毕竟南宋时又没有照片），语气出奇地平静。\n他绕着那尊跪像缓缓走了一圈。新政权不讲什么“为尊者讳”，他们只认“公道”二字。让皇帝给臣子下跪，这种在岳王庙存在过的明清神州三朝都惊世骇俗的事，在如今这片天下，竟显得如此理所应当。\n“官家……”杨沂中在身后低唤了一声。\n“正甫，朕不难受。”赵玖伸手，指尖摩挲过那冰冷的石像鼻翼，触感冷硬，毫无生气，“朕只是觉得庆幸。庆幸当年朕在那口井边睁眼时，想的是怎么把金贼撵回老家，而不是怎么去签那份和议。”\n他收回手，不再看那尊象征着耻辱的跪像，转身走向正殿外的阳光。\n“走吧。既然这世界的‘完颜构’把脸丢尽了，那咱们这些当‘老祖宗’的，就得帮着这一辈的汉儿，把那狼居胥山的坛台，筑得再高些，筑到哪怕是长生天，也不敢再俯视咱们的地步。”"
gxc_hjj.6.a:0"天日昭昭，此恨方消。"

gxc_hjj.7.t:0"金戈铁马，气吞万里如虎"
gxc_hjj.7.d:0"在山东济南的南山之侧，一座风格冷峻、宛如堡垒的建筑在落霞中合龙。这不是一座寻常的文人祠堂，而是新政权为那位“词中之龙”——辛弃疾建立的永久纪念馆。\n\n纪念馆的序厅没有堆砌华丽的辞藻，只有一柄仿制的重剑和一尊年轻将领跃马横刀的浮雕。在这里，人们谈论的不仅是《稼轩词》，更是那个在二十一岁时便震惊了整个时代的“归正人”。\n\n那段往事被刻在漆黑的大理石墙上：绍兴三十一年，当中原大地在金人的铁蹄下呻吟时，年轻的辛弃疾并未躲在书斋中感伤。他拉起一支两千人的义军，在敌后纵横。最令后世热血沸腾的，莫过于他率领五十名精骑，长驱直入五万人的金军大营，在众目睽睽之下生擒叛徒张安国，并将其一路押解至南方受审。\n\n“壮岁旌旗拥万夫，锦襜突骑渡江初。”\n\n馆内的展品诉说着他此后数十年的落寞与孤愤：他一生都在试图说服南方的朝廷北伐，他修筑飞虎寨、训练精锐，却终其一生被投降派排挤在权力边缘，只能在江西的闲居中，将满腔的战略构想化作惊心动魄的文字。他是那个时代最清醒的疯子，是那个懦弱朝廷眼中格格不入的异类。\n\n重修当日，许多曾参加过第二红巾军的老兵在馆内久久伫立。他们看着辛弃疾晚年那句“我看青山多妩媚，料青山见我应如是”，深知那不是隐士的闲情，而是一个杀敌无数的战士，在无法重返战场后的绝望自白。\n\n现在，这片土地终于不再负他。"
gxc_hjj.7.a:0"了却君王天下事，赢得生前身后名。"

gxc_hjj.8.t:0"孤屿丹心"
gxc_hjj.8.d:0"在瓯江之心的江心屿，那座曾见证了南宋最后喘息的文信国公祠，在历经了伯雷帖木儿时期的荒废与亵渎后，终于迎来了最为彻底的重修。纪念馆的灰砖墙上，没有过多的点缀，唯有那篇字字泣血的《正气歌》被铸在生铁板上。人们来到这里，是为了重温那个在黑暗岁月中孤身撑起民族气节的男人。\n\n那是德祐二年的残阳，南宋江山已如狂风中的残烛。文天祥，这位状元出身的宰相，在国家最绝望的时刻散尽家财，招募义军。他不是不知兵，也不是不畏死，他只是在那个人人皆言“天命已改”的时代，偏要用书生的肩膀去撞击那如日中天的蒙古铁骑。\n\n馆内陈列着他被俘后长达四年的囚禁生涯。在大都那间阴暗、潮湿、充满了腐臭味的土牢里，忽必烈曾亲自许以宰相之位，试图招降这位文明的象征。然而，文天祥只是在那方寸之地的土牢中，面对着北方凛冽的寒风，平静地写下了“人生自古谁无死，留取丹心照汗青”。\n\n他杀贼，他被俘，他赴义。他用三年的坚持证明了一件事：肉体可以被囚禁，王朝可以被更替，但一个文明的道统与尊严，只要还有一个人不跪下，就永远不会断绝。"
gxc_hjj.8.a:0"天地有正气，杂然赋流形。"

gxc_hjj.9.t:0"跨海征云"
gxc_hjj.9.d:0"在闽江入海口的礁石之巅，历时三载的宏伟工程终于揭开了它的面纱。伴随着沉重的红绸滑落，一座高逾百米的朱成功青铜巨像，如同一口顶天立地的利剑，深深扎入了东南海疆的脊梁。\n\n巨像生动刻画了国姓爷于惊涛骇浪间勒马远眺的雄姿。战马前蹄腾空，似要踏碎这旧时代的阴霾；朱成功端坐雕鞍，甲胄上的鳞片在阳光下闪烁着冰冷的青铜光辉。\n\n人们来到铜像脚下，谈论的不仅是那次跨海收复台湾的壮举。在这个重开中华天的时代，朱成功的事迹被赋予了更深层的含义——他是那个旧帝国彻底崩塌、神州陆沉的绝望时刻，最后一位死守着华夏衣冠、誓不向铁蹄低头的逆行者。他在孤岛之上开辟生机，在海上筑起万里长城，用一己之力向世界宣告：只要还有一船、一卒、一孤臣，华夏的法统就绝不熄灭。\n\n对于新政权的公民来说，这尊铜像不再是单纯的纪念碑，而是一个永恒的警戒。它时刻提醒着过往的每一艘巨舰：华夏的门户，曾经被鲜血守卫，如今更不容任何外敌觊觎。\n\n重修当日，远处的海军编队鸣响汽笛，白色的浪花在巨像脚下破碎。在那双凝视远海的青铜双目中，人们仿佛看到了那个在黑暗中苦战一生的灵魂，终于在这一世的黎明里得到了安息。"
gxc_hjj.9.a:0"让海疆之魂，指引我们的航向！"

gxc_hjj.10.t:0"铁血忠魂"
gxc_hjj.10.d:0"在西南边陲的密林与断崖间，一座早已没入荒草的古建筑——汉王庙，终于在现代推土机的轰鸣声中重见天日。随着脚手架的搭建，那位被西南部众尊为“后土地主”的战神李定国，其波澜壮阔而又悲怆的一生，再次通过翻新的碑文回到了世人面前。\n\n作为张献忠“大西”军中最勇猛的养子，少年李定国曾是明帝国最头疼的噩梦。他出身贫苦，为了生存与公义毅然投身农民起义。在那段烈火燎原的岁月里，他曾率骑兵奇袭襄阳，重创明军精锐。对他而言，那个腐朽、贪婪、让百姓易子而食的旧朝廷，是必须亲手埋葬的废墟。\n\n然而，当山河破碎、异族铁骑入关屠戮之时，李定国完成了历史上最罕见的身份转换。为了保住华夏文明的最后火种，他毅然放下了与朱家的世仇，转而扶持南明永历政权。在桂林，他逼得清军名将孔有德自焚；在衡阳，他阵斩清廷亲王尼堪，“两蹶名王，天下震动”。他从一个“反贼”变成了大地的守护者，在那片毒瘴丛生的边疆，他孤军奋战数十年，直到听闻永历帝遇难的消息，才在忧愤中呕血而亡，临终遗言仍是：“宁死荒野，勿降贼人。”\n\n重修落成之日，人们在李定国画像前肃立。李定国的一生，是矛盾而又纯粹的：他前半生为了百姓反抗暴政，后半生为了民族反抗侵略。这种“大义高于私怨”的风骨，正是新中国重塑民族精神的核心。"
gxc_hjj.10.a:0"残碑读罢呼雄鬼，生死都从李晋王！"

gxc_hjj.11.t:0"地狱沉沉二百年，忽遇天王洪秀全"
gxc_hjj.11.d:0"在广州古老城墙的映衬下，一座宏伟的矩形建筑——“洪秀全纪念馆”肃然矗立。与传统的历史博物馆不同，这座场馆的每一个展厅都在回响着那个时代最激越的口号：“奉天诛妖”。\n\n展厅的第一部分以极具视觉冲击力的方式，呈现了清末神州陆沉的惨状，随后画面一转，便是金田起义的烽火。在这个世界线的史诗中，太平军不仅仅是一场农民起义，更是一场波澜壮阔的民族光复战争。展览重点描绘了那场决定命运的全军北伐：太平军将士们剪掉辫子，蓄起长发，高举着黄旗，如怒涛般冲向北方。\n\n纪念馆的核心区域是一组巨大的浮雕，刻画了太平军攻破北京、清廷权贵仓皇逃出关外的壮烈场景。在那段历史中，洪秀全被塑造成了继朱元璋之后，又一位从南方起兵、彻底终结异族统治的铁血领袖。他所建立的“天国”，在初期确实实现了一定程度上的衣冠复振与汉土重光，让沉沦两百余年的中原大地重新回到了汉人的掌控之下。\n\n然而，后半馆的陈列则充满了对权力异化的警示。展览并未回避洪秀全晚年的奢靡与高层的权力斗争，正是这种在“大功告成”后的堕落与内耗，给了神州帝国开国皇帝蒋世渊可乘之机。蒋氏利用华夏大地军阀混战的乱局，最终在洪秀全病逝后，攻陷北京，接管了这片江山。\n\n开放当日，包括洪秀全的直系后代洪莱仪在内的一众游客在洪秀全的雕塑前长久驻足。尽管天国最终梦碎，但它那股不甘为奴、誓要重开中华天的民族气节，已然成为了今日新中国军魂中不可或缺的一抹底色。"
gxc_hjj.11.a:0"取其精魂，鉴其残梦。"

gxc_hjj.12.t:0"洪武重光"
gxc_hjj.12.d:0"在伯雷帖木儿统治的至暗年代，紫金山下的明孝陵曾遭遇了一场文明的劫难。昔日巍峨的皇家陵寝，一度沦为杂草丛生、碑刻残缺的废墟。唯有那石象路上的石兽，在凄风苦雨中默默见证着民族的屈辱。\n\n随着新中国的建立，一项旨在“复原民族魂魄”的重修工程正式开启。\n\n重修的过程并非简单的土木作业，而是一场对华夏气节的集体唤醒。由于档案缺失，历史学家与工兵团在废墟中反复勘探，将每一块被黑万字特务凿毁的石砖重新编号复位。围观的民众无不肃然起敬。人们自发地洗刷着神道上的污泥，每一处修补的痕迹都象征着这个民族伤口的愈合。\n\n而在新修缮的享殿内，展览重点聚焦于朱元璋那场惊天动地的光复伟业。\n\n“驱逐胡虏，恢复中华”——这不只是一个口号，更是这位大明开国皇帝一生的钢铁意志。展览详尽描绘了朱元璋如何从一名一贫如洗的流浪儿，在蒙元暴政导致的神州陆沉中毅然投身红巾，最终以雷霆手段扫清六合。他是华夏历史上唯一一位由南向北彻底驱逐游牧征服者、重整河山的统帅。他恢复了中断百年的汉家衣冠与礼仪，重新定义了主权与民族的底线。\n\n如今，明孝陵的红墙在晨曦中再次焕发出如血的威严。这不仅是一座陵墓的重生，更是一个文明在废墟中重新站立、再次掌握自身命运的铁证。"
gxc_hjj.12.a:0"继往开来，重振洪武雄风！"

gxc_hjj.13.t:0"决不饶恕"
gxc_hjj.13.d:0"历史的长河从未真正冲刷干净河床上的血污。\n当第二红巾军的铁骑踏平最后的抵抗，紫禁城的琉璃瓦在阳光下折射出新生的光芒。然而，大量双手沾满鲜血的侩子手虽已流亡海外，却携带着从华夏大地搜刮的万贯家财，在异邦苟延残喘，甚至勾结外力图谋复辟。\n一边是蒙元余孽——“食猴鹰”与“一只耳”等伯雷帖木儿的走狗。他们带走了草原掠夺者的傲慢，妄图在异国重建“大元”的幻梦。\n一边是满清遗老——八旗贵族及其包衣奴才。他们卷走了汉人两百年被榨干的骨髓，试图用这些民脂民膏购买西方的枪炮，重温“剃发易服”的旧梦。\n\n情报已确认的五大巢穴：\n\n东京：满清遗老与樱花右翼势力勾结，试图以“满蒙独立”为筹码换取军事庇护。大量文物被藏匿于东京湾的秘密仓库中。\n\n伦敦：“一只耳”等人利用圣杯国金融体系洗钱，利用圣杯国银行业的保密制度，将掠夺来的白银转化为复杂的信托基金。\n\n纽约：他们披着“人权”与“少数民族自决”的外衣，将自己包装成“受迫害的少数民族代表”，以此骗取政治庇护和援助，实则策划恐怖活动。\n\n斯德哥尔摩：这里被正式定为“大清帝国流亡政府”所在地。瑞典的中立地位成了他们的保护伞。这群前清贵族在斯德哥尔摩郊外复刻了一座微缩版的“紫禁城”，整日沉溺于虚假的朝会礼仪中。\n\n阿德莱希城：在这个由欧洲殖民者建立的邪恶国家首都，上演着最荒诞的一幕。大批八旗子弟早已剃掉了辫子，换上了西装，与当地白人富豪、贵族沆瀣一气，举办奢华的舞会与赛马会。并且他们正准备在这里训练一支由白人雇佣兵指挥、八旗子弟为监军的“复辟远征军”。\n\n“他们以为大洋是护城河？以为洋人的护照是免死金牌？”\n最高委员会已下达代号“苍穹之怒”的全球肃清令。这不是简单的追赃，而是一场跨越时空的民族审判。我们要追回的，不仅是金银，更是汉民族被践踏了两个世纪的尊严。"
gxc_hjj.13.a:0"他们的避难所，就是他们的坟墓。"

gxc_hjj.14.t:0"叹息"
gxc_hjj.14.d:0"北海道的风雪比紫禁城的冬天更冷，也更无情。\n曾经梦想在东京重建“大东亚共荣”的前清流亡者们，此刻正拖着沉重的铁链，在刺骨的寒风中挖掘着黑色的煤炭。华夏新军士兵的刺刀在阳光下闪烁，监工的呵斥声与皮鞭抽打肉体的闷响，构成了这座“石狩第零号矿场”的背景音。\n“哎哟！我的腰！我可是正蓝旗的贝子！你们不能这样对待皇族！”\n“我的金表！我的翡翠扳指！全被那些尼堪（汉人）抢走了！那是祖传的啊！”\n“这是绑架！这是违反国际法的！”\n哀嚎声此起彼伏。那些曾在东京银座挥霍无度的八旗子弟们，如今衣衫褴褛，满脸煤灰。短短三个月的高强度劳役，加上营养不良和严寒，已有数十人倒在了矿坑里，尸体被随意地拖到远处的雪坡上掩埋，连个像样的棺材都没有。昔日的“满万不可敌”，在绝对的暴力机器面前，脆弱得如同枯草。\n然而，在这片绝望的哭喊声中，有一个身影显得格外沉默。\n爱新觉罗·黄尚正默默地挥动着镐头。他的动作机械而精准，仿佛早已习惯了这种劳作。他的双手布满了血泡，但眼神却异常平静，甚至带着一丝解脱。\n“别哭了，”黄尚的声音沙哑却清晰，穿透了嘈杂的哀嚎，“早在大都，看到伯雷那小子的幼稚治国方略时，就预见了今日。”\n他环视着周围这群曾经不可一世的八旗同胞，嘴角勾起一抹苦涩的冷笑：\n“你们以为逃到东京，勾结樱花人，就能复辟？你们以为把从汉人手里抢来的钱换成圣杯镑、樱花元，就能买回尊严？错了。从我们踏上流亡之路的那一刻起，我们就已经是死人了。汉人军队今天只是来执行迟到的判决而已。”\n“黄大人，您早就知道？”一名囚犯惊恐地问。\n“我知道他们一定会追来，也知道樱花人靠不住。”黄尚重新举起镐头，重重地砸向冻土，“我甚至算过，我们之中，能活过这个冬天的，不会超过三成。这不是意外，这是历史的必然。”\n远处，一名新军军官走了过来，目光扫过人群，最终停留在黄尚身上。军官认出了他，眼中闪过一丝复杂的神色——既有仇恨，也有一丝对这位“清醒者”的微妙敬意。\n“爱新觉罗·黄尚，”军官冷冷地说道，“指挥部命令，因为你主动交出了藏在东京湾的全部账本和密约，且未做任何抵抗，你的劳役等级下调。但别高兴太早，矿场就是你的归宿，直到你挖出的煤抵清你祖上欠下的血债。”\n黄尚微微颔首，没有辩解，也没有求饶。他只是淡淡地回应：“多谢。能死在矿里，总比死在异国的街头，或者被当成猴子展览要好。”\n风雪更大了。周围的哭喊声渐渐微弱，取而代之的是沉重的喘息声和镐头撞击冻土的单调声响。在这个被世界遗忘的角落，满清流亡政府的最后一点幻梦，随着爱新觉罗·黄尚那一声长长的叹息，彻底粉碎在北海道的煤炭堆里。"
gxc_hjj.14.a:0"让他们用余生偿还罪孽。每一吨煤，都是对汉家冤魂的祭奠。"

gxc_hjj.15.t:0"雾都惊雷"
gxc_hjj.15.d:0"伦敦的浓雾今日格外厚重，仿佛连泰晤士河都在为这座城市的沦陷而哭泣。\n曾经被视为“绝对安全区”的肯辛顿富人区，此刻已被华夏新军的钢盔淹没。坦克履带碾碎了精心修剪的草坪，刺刀挑破了绘有家族徽章的门帘。在一座占地数英亩的哥特式豪宅前，一支突击小队停下了脚步。\n这里是一只耳的巢穴。他正端坐在铺着天鹅绒的法式高背椅上。他手里还摇晃着一杯陈年的苏格兰威士忌，面前摆着一份《圣杯财产保护法》摘要和一张圣杯的贵族爵位证书（买来的）。\n当沉重的橡木门被爆破炸药轰开，烟尘尚未散尽，全副武装的华夏军士兵如潮水般涌入大厅时，一只耳并没有惊慌失措地逃跑。相反，他慢条斯理地整理了一下自己的丝质领结，那只仅剩的耳朵微微抖动，脸上挂着一丝轻蔑而自信的微笑。\n“诸位，”他用流利却带着傲慢口音的英语说道，甚至没有从椅子上站起来，“我想这里有些误会。根据1882年《定居者土地法案》以及圣杯国现行的《私有财产神圣不可侵犯法》，这座宅邸及其内部所有物品，皆是我合法的私人财产。我拥有圣杯国授予的‘爵士’头衔，受女王陛下法律保护。”\n他指了指桌上的文件，语气愈发从容，仿佛在给一群不懂法的学生上课：\n“你们这支军队，无论来自哪里，只要踏上圣杯的土地，就必须遵守这里的法律。私闯民宅、抢劫财物，这是重罪。所以，收起你们的武器，立刻退出去，我们可以谈谈‘人道主义赔偿’的问题……”\n他的话音未落，一声沉闷的巨响打断了他的诡辩。\n士兵手中的步枪枪托，带着呼啸的风声，狠狠地砸在一只耳那张喋喋不休的嘴上。鲜血飞溅，几颗断裂的牙齿混着红酒吐在地毯上。一只耳整个人像断了线的风筝一样从高背椅上翻倒在地，昂贵的威士忌酒杯摔得粉碎，浸湿了他引以为傲的西装。那份《财产保护法》飘落在地，瞬间被一只沾满泥泞的战靴踩住。\n“在这里，只有一种法律，”一名军官居高临下地看着在地上痛苦翻滚、捂着半张脸的一只耳，眼神如冰，“那就是血债血偿。”\n“拖走！”军官下令，“把他的‘私人财产’全部查封，连一根线头都不许留下。至于这位‘爵士’，给他戴上最重的镣铐，让他去矿场里好好研究一下，什么叫‘劳动改造法’！”"
gxc_hjj.15.a:0"对于屠夫，不需要审判，只需要终结。"

gxc_hjj.16.t:0"沉默的真相"
gxc_hjj.16.d:0"纽约的秋天本该是金色的，但今天的华尔街却笼罩在一片肃杀的灰暗中。\n根据情报部门提供的绝密名单，士兵们正有条不紊地将一个个穿着体面、手持律师函的“社会名流”押上卡车。\n走在最前面的，正是那个让草原牧民闻风丧胆、让中原百姓夜不能寐的食猴鹰。他此刻虽戴着手铐，却依旧昂着头，对着周围围观的人群高喊：“这是政治迫害！我是蒙古民族的自由斗士！他们要消灭我们的文化！”\n在他身后，是一群满清遗老和他们的精灵之国代理人，他们同样哭诉着：“我们只是异见者！我们追求民主！这是对人权的践踏！”\n街道两旁，聚集了数千名纽约市民。在《纽约时报》和各大电视台连日的渲染下，这些市民眼中充满了愤怒与同情。他们挥舞着精灵国旗，高呼着“释放政治犯”、“停止暴政”的口号。几个勇敢的年轻人甚至试图冲破警戒线，用身体阻挡士兵，大声质问：“你们凭什么抓人？这里是精灵之国！是自由的世界！”\n气氛剑拔弩张，冲突一触即发。各国记者已经准备好了记录“血腥镇压”的镜头。然而，预想中的枪声和催泪弹并没有出现。\n占领军司令林震大步走出了指挥大楼。他没有带卫兵，只拿着一份厚厚的文件夹。他示意士兵停止推搡，然后径直走上了大楼前的临时台阶，目光扫过那些愤怒的市民，最后定格在被押在卡车上的食猴鹰身上。\n“纽约的市民们，”林震的声音通过扩音器传遍了整个街区，沉稳而有力，“我知道，在你们的认知里，我们是一群来自东方的野蛮人，正在抓捕一群无辜的‘民主斗士’。我也知道，你们的报纸告诉你们，这些人是为了自由而战。但是，”林震突然提高了音量，眼神如刀，“如果我说，你们眼中的‘斗士’，是一群手上沾满百万人鲜血的屠夫呢？”\n他猛地打开手中的文件夹，将里面的文件高高举起。\n“看清楚了！这位食猴鹰，”林震指着卡车上那个还在叫嚣的男人，“他率领铁骑屠戮中原数万汉人，他的档案里详细记录了他和他的部下如何将婴儿挑在刺刀尖取乐！”\n人群中的喧哗声渐渐小了。一些人开始交头接耳，疑惑地看向那些“名流”。\n“还有他们，”林震指向其他被捕者，“这些满清贵族，他们的祖先杀得汉人血流成河。如今，他们躲在纽约的豪宅里，用他们祖先抢来的民脂民膏资助你们国家的反华议员，编写虚假的‘人权报告’，污蔑我的同胞！他们甚至计划一旦复辟成功，就将中国的稀土矿权、港口控制权，甚至是上千万汉族劳工的‘终身契约’，无偿转让给精灵国财团！这就是你们所谓的‘自由斗士’？不，他是出卖祖国、贩卖人口的奴隶主！”\n林震将文件狠狠摔在地上，风吹起纸张，露出上面清晰的签名、印章和交易细节。\n“我们不是来迫害异见者的。我们是来清算历史罪债的！我们抓捕的不是政治犯，而是战犯和卖国贼！如果保护这样的人就是‘侵犯人权’，那么这种人权，不要也罢！”\n现场陷入了死一般的寂静。刚才还义愤填膺的市民们，此刻面面相觑。几个原本冲在前面的年轻人，看着卡车上食猴鹰那狰狞却不再理直气壮的脸，默默退回了人群。\n林震整理了一下军帽，对着全场深深鞠了一躬：“对不起，打扰了纽约的宁静。但为了正义，有些真相必须被揭开。我们将依法将这些罪犯押解回国，接受历史的审判。感谢大家的聆听。”\n说完，他转身挥手：“出发！”\n车队缓缓启动，这一次，再也没有人试图阻拦。相反，一些看清了真相的市民，默默让开了道路，眼神中多了几分复杂与敬畏。"
gxc_hjj.16.a:0"让他们亲眼看看，什么是真正的正义。"

gxc_hjj.17.t:0"北境审判"
gxc_hjj.17.d:0"爱新觉罗·载澍坚信，那些汉人军队绝不可能跨越半个地球，把战旗插到北欧的土地上。\n然而，当斯德哥尔摩郊外的爱新觉罗庄园大门被坦克撞开，那一抹刺眼的红色军装出现在视野中时，载澍的世界崩塌了。\n“怎么可能……他们怎么会到这里？”来不及思考，求生的本能让他跌跌撞撞地冲进卧室，胡乱地将金条、钻石和几卷未兑现的伦敦债券塞进皮箱。他的手指因为恐惧而僵硬，连拉链都拉不上。\n士兵的脚步声已经逼近。几名华夏军战士踹开了房门，黑洞洞的枪口瞬间锁定了他。\n“别杀我！别杀我！”载澍“扑通”一声跪在地上，向着那些年轻的士兵疯狂磕头，额头撞在地板上发出沉闷的响声，“我是大清的王爷！我有钱！我把这些都给你们！饶我一命！让我去人间之里，去伦敦，去哪都行！只要留我一条狗命！”\n领头的士兵冷冷地看着载澍，眼中没有一丝怜悯，只有深深的厌恶。他一脚踢开了那个装满金银的皮箱，金币散落一地，发出清脆却讽刺的声响。\n士兵一把揪住载澍的衣领，像拖死狗一样将他拖出了庄园，“我们的任务不是求财，是清算。”\n一小时后，斯德哥尔摩市中心，古斯塔夫·阿道夫广场。\n这里通常是游客喂鸽子、市民喝咖啡的地方，此刻却成了临时的刑场。除了载澍，还有十余名“大清流亡政府”的核心骨干，此刻都面如死灰，被反绑着双手，跪成一排。\n广场周围，聚集了大量斯德哥尔摩市民。他们穿着厚厚的大衣，眼神中充满了惊恐、不解和难以置信。有人捂住了孩子的眼睛，有人在胸前画十字，更多的人则是瑟瑟发抖，担心下一秒子弹就会飞向自己。\n陈锋上校站在临时搭建的高台上，目光如炬，声音通过扩音器传遍广场：\n“瑞典的朋友们，请不要恐惧。我们不是来侵略你们的，我们是来执行正义的审判！”\n他指着跪在地上的载澍等人，厉声喝道：\n“这些人，曾是中国的统治者，却因残暴无能被人民推翻。流亡海外后，他们不思悔改，反而与西方列强勾结，签署了一份又一份卖国条约，企图引狼入室，再次奴役我的同胞！他们在斯德哥尔摩建立伪朝廷，策划复辟，甚至承诺将中国的领土割让给欧洲各国以换取支持！”\n“根据《战犯惩治条例》和人类基本的道德准则，他们的罪行罄竹难书，罪无可恕！今天，我们在这里，代表四万万受苦难的同胞，宣判他们——死刑！立即执行！”\n“不！救命！这里是瑞典！你们不能……”载澍发出了最后一声凄厉的惨叫。\n“砰！砰！砰！”\n一排整齐的枪声划破了斯德哥尔摩宁静的天空。鲜血染红了广场的石板，也染红了围观市民们的瞳孔。载澍和其他流亡者身体剧烈抽搐了几下，随即彻底不动了。\n广场上死一般的寂静，只有寒风呼啸而过。\n陈锋看着眼前这一幕：那些瑞典市民脸色苍白，有的甚至在呕吐。他们眼中的恐惧是如此真实——那是对暴力最本能的反应，也是对“东方军队”这一刻板印象的加深。\n陈锋心中微微一沉。他知道，这一枪虽然打死的是卖国贼，但在这些无辜市民心里种下了恐惧的种子。\n“这下麻烦大了，”陈锋在心里暗自叹息，眉头紧锁，“接下来的维稳工作，恐怕比打仗还要头痛。我们要面对的，不仅仅是残余的敌人，还有这一整片被吓坏了的、对我们充满戒心的陌生土地。”\n他深吸一口气，整理了一下军容，对着身边的副官低声命令：“通知宪兵队，立刻转为警戒姿态，严禁任何士兵骚扰平民。准备好翻译官和宣传车，我们要开始一场艰难的‘人心争夺战’了。”"
gxc_hjj.17.a:0"真正的挑战才刚刚开始"

gxc_hjj.18.t:0"帝国黄昏"
gxc_hjj.18.d:0"阿德莱希城的天空被浓烟遮蔽，曾经象征着荣耀的皇宫金色尖顶，如今插上了华夏新军的红旗。\n街道两旁，全副武装的华夏军士兵正在按图索骥，将那些藏在豪宅、地窖甚至教堂里的满清余孽一个个拖出来。这些曾经不可一世的“王爷”、“贝勒”，此刻大多穿着不合身的平民衣服，瑟瑟发抖，被像牲口一样串在一起。\n就在抓捕行动进行得如火如荼时，一辆黑色的豪华轿车强行冲破了警戒线，停在了指挥部临时设立的路障前。车门打开，一位身穿华丽丝绒礼服、佩戴着无数勋章的老者大步走出。他是雷恩伯爵，阿德莱希最显赫的贵族之一。\n“停下！你们这群野蛮人！”雷恩伯爵挥舞着手杖，指着正在押解一名前清贝子的士兵，愤怒地吼道，“看看你们在做什么？为了抓几个前朝的流亡者，你们就悍然入侵一个主权国家？这是侵略！是赤裸裸的帝国主义行径！你们的文明在哪里？法律在哪里？”\n周围的空气仿佛凝固了。一些还没撤离的西方记者迅速举起了相机，等待着华夏军指挥官的尴尬回应。\n赵无极少将缓缓从吉普车上走下。他没有拔枪，也没有怒吼，只是平静地走到雷恩伯爵面前，目光穿透了对方华丽的衣袍，直刺其灵魂。\n“法律？文明？”赵无极的声音不大，却字字千钧，“伯爵先生，你跟我讲法律？那你可知，你脚下保护的这些‘前朝余孽’，他们的祖辈曾在扬州屠城十日，杀得血流成河？他们曾将汉人的头颅堆成京观，以此炫耀武功？流亡至此后，他们又用从同胞身上搜刮来的民脂民膏，贿赂你们的议会，购买军火，企图再次将战火引向东方，让千万生灵涂炭！”\n赵无极向前逼近一步，雷恩伯爵不由自主地后退了半步。\n“我们不是来侵略的，我们是来清算跨越三个世纪的血债！对于这种反人类的历史罪人，任何庇护他们的‘法律’都是肮脏的遮羞布！”\n随即，赵无极话锋一转，目光扫过雷恩伯爵那身价值连城的礼服，又看向周围面黄肌瘦、眼神麻木的阿德莱希市民，声音陡然提高：\n“至于你，雷恩伯爵，你还有脸指责我们？别以为穿着人皮我就闻不出你身上的血腥味！我亲眼看到，就在昨天，你因为一个仆人偷了一块发霉的面包，就下令打断他的双腿扔在大街上等死！我亲眼看到，你们的贵族在俱乐部里挥霍着黄金，而你们的百姓却在血汗工厂里咳着黑血，连孩子的学费都交不起！”\n“你们指责我们是侵略者？不，真正的吸血鬼是你们这些世袭贵族！你们利用血统的特权，世世代代剥削本国人民，将国家变成你们的私人猎场。你们和那些满清余孽有什么区别？只不过一个是东方的屠夫，一个是西方的蚂蟥！”\n雷恩伯爵脸色惨白，赵无极接着说道：“此刻，在市政厅里，由平民代表组成的‘阿德莱希临时政府’已经宣告成立！而新政府成立后的第一件事，就是清算旧账。雷恩伯爵，新政府迟早会问责你们过去的罪行，剥夺你们非法占有的土地和财富。今天，我们只抓满清余孽；明天，等待你们的，将是你们本国人民的审判！”\n雷恩伯爵手中的手杖“啪”地一声掉在地上。他看着周围那些曾经对他唯唯诺诺、此刻却眼中燃烧着怒火的本国百姓，终于感到了彻骨的寒意。\n赵无极挥了挥手：“继续行动。把那些满清余孽带走，至于这些贵族……交给即将到来的新政府处理。”"
gxc_hjj.18.a:0"我们的目标是复仇，不是革命。让阿德莱希人自己解决自己的问题。"

gxc_hjj.19.t:0"衣冠之辩"
gxc_hjj.19.d:0"如今，在各大城市的街头巷尾，交领右衽、衣袂飘飘的景象已不再罕见。越来越多的年轻人满怀自豪地穿上汉服，将其作为通勤、游玩甚至参加典礼的常服。我们的纺织工厂日夜轰鸣，传统的丝织工艺也迎来了前所未有的复苏。\n\n然而，在这场轰轰烈烈的复兴浪潮中，街头和报纸的评论版面上出现了一股不可忽视的异音——一群被民间戏称为“汉服警察”的考据派人士开始四处出击。他们拿着放大镜审视路人的衣着，对那些混搭了不同朝代形制、或是采用了现代剪裁的汉服指指点点，甚至当街指责穿着者“数典忘祖”、“穿着山寨戏服亵渎传统”。\n\n这一现象在社会上引发了轩然大波。许多刚刚接触汉服、满怀热情的普通民众感到备受打击，认为这些“警察”的傲慢与苛刻无疑是在给复兴运动泼冷水，让汉服变成了少数人的圈子游戏；但另一方面，也有不少老派学者和坚定的传统主义者对“汉服警察”表示支持。他们警告说，如果任由资本和商人为了迎合市场而胡乱魔改，我们复兴的将不再是承载着千年礼法与智慧的华夏衣冠，而仅仅是一堆印着古风图案的廉价布料，正本清源在当下显得尤为必要。"
gxc_hjj.19.a:0"他们的存在只会阻碍汉服的复兴"
gxc_hjj.19.b:0"若失了形制，复兴的不过是几块花布罢了。"

gxc_hjj.20.t:0"“理”与“礼”"
gxc_hjj.20.d:0"这是城南老李茶馆里一个再平常不过的早晨。若是放在几年前的旧时代，这里往往是三教九流争强斗狠的地方。谁要是走路不长眼撞了哪位阔老爷，下场不是被掀翻桌子，就是得跪在地上磕头赔罪，连声高呼“大人饶命”。\n\n但今天，新风尚似乎悄然改变了这里的空气。\n\n一个年轻工人匆匆走过，一不留神撞到了一位衣着考究的商人，滚烫的茶水泼了商人半只袖子。老李在柜台后倒吸了一口凉气，准备看一场闹剧。商人皱起眉头，刚要发作，却硬生生停住了。\n\n只见那个年轻工人没有吓得瑟瑟发抖，也没有满脸堆笑地讨好。他后退半步，站直了身子，双手交叠，不卑不亢地行了一个标准的揖礼，声音响亮而平静：“先生，是我脚步莽撞，惊扰了您。弄脏的衣物，我愿依市价赔偿清洗费，绝不推诿。”\n\n商人愣了一下，看着年轻人那挺直的脊梁和澄澈的眼神，眼中的怒火竟然渐渐平息了。他理了理衣袖，不仅没有破口大骂，反而端正了姿态，回了一个半礼：“罢了。一点水渍而已，既然你敢作敢当，态度端正，那便算了,下次当心。”\n\n坐在角落里的一位老教书先生看着这一幕，眼眶微热。他忽然明白，那些曾在故纸堆里发霉的“道德”，终于洗掉了几千年的奴气，真正活在了普通人的骨血里。"
gxc_hjj.20.a:0"明法理而挺脊梁，知礼节而有风骨。"

gxc_hjj.21.t:0"龙旗对对碰"
gxc_hjj.21.d:0"在南京的某处公园内，一场“正统之争”正在郁郁葱葱的柳树下激烈上演。\n\n左边的一拨人围着一面绣工略显褪色的神州帝国国旗。领头的是位穿着整洁、胡须打理得一丝不苟的老者，他正唾沫横飞地敲着手杖：“荒唐！神州帝国承袭天命，立国数十载，若非那场不幸的内乱，怎会让伯雷帖木儿那个塞外胡虏捡了便宜？更何况，流亡海外的陛下至今仍心系故土，之前伯雷帖木儿统治时期，她每天不停的在广播中声援我等反抗暴政！她才是华夏唯一的共主！”\n\n“呸！什么‘天子’，不过是丢了祖宗江山的丧家犬！”右边的一群人毫不示弱，他们挥舞着代表大明的“明”字旗，个个身着簇新的明式飞鱼服，神情亢奋，“论及华夏风骨，唯我大明！治隆唐宋，远迈汉唐！唯有恢复那个洪武帝建立的铁血大明，才算真正的驱逐鞑虏！神州帝国那个由满清奴才（毕竟神州太祖曾被清廷任命为负责镇压太平军的团练大臣）建立的软弱王朝，哪有资格谈什么正统？”\n\n双方争得面红耳赤，从“嫡庶神圣性”一路吵到“祖宗礼法”，甚至有人开始挽起袖子准备进行物理意义上的“拨乱反正”。\n\n然而，围观的景象却让这一幕变得滑稽无比：晨跑的年轻人停下脚步，一边擦汗一边像看马戏一样对着他们指指点点；带孩子的母亲赶忙拉着孩子绕道而行；几个在附近遛鸟的退休工人更是直接笑出了声。\n\n“老几位，别争了！”一位穿着新式汉服、手里拿着报纸的大学生路过，忍俊不禁地插了一句，“这都什么年代了，大家都在商量怎么选下一届议员，你们还在讨论哪个‘祖宗’更尊贵？不如多练两趟太极拳强身健体，为新中国多活几年吧！”\n\n辩论声戛然而止，两个阵营的“正统卫士”看着周围那一双双像看古董一样的戏谑眼神，脸上的神情尴尬得比那面褪色的国旗还要精彩。"
gxc_hjj.21.a:0"只要人民已经觉醒，这些旧梦呓语便翻不起浪花。"

gxc_hjj.22.t:0"正本清源"
gxc_hjj.22.d:0"随着伯雷帖木儿政权的倾覆，新生的共和国掀起了一场席卷全国的“革除胡俗”运动。政府以雷霆之势推行汉化，旨在涤荡旧朝遗留的异族习气。然而，当这场文化复兴运动推进到第三个月，一种微妙的“洁癖”开始在社会中蔓延。在官方“破旧立新”的号召下，一些激进的地方官员与民间团体开始以“宁可错杀一千，不可放过一个”的姿态，对传统文化进行粗暴的筛选。他们将任何带有“异族特征”的事物都视为打击对象，却忽略了文化交融的复杂性与历史的层累性。\n\n风波首先在饮食领域爆发。西安城内，老字号“老孙家”的羊肉泡馍被贴上“八旗遗毒”的标签，理由是“羊肉与面食的组合源自游牧民族，且满清八旗军中盛行羊肉饽饽”。掌柜举着《秦食谱》辩解，称此乃秦汉时期西府小吃的演变，却被斥为“混淆视听”。无独有偶，北方的饺子也被卷入漩涡——只因满族冬至食饺的习俗，便被某些激进派指为“鞑子饭”，甚至有“移风易俗会”的成员当街砸毁饺子馆的招牌，高呼“不吃饺子过新年，方显汉家儿女生气”。\n\n更荒诞的是，连一些纯粹的汉族传统也被误伤。山东曲阜的孔府后人举办祭孔大典，因沿用明代《大明集礼》中的部分仪轨（其中夹杂了元代对孔子的封号用语），竟被指责“夹带胡俗”，险些被禁止；江南的评弹艺人因曲词中偶有满语借词，被勒令修改唱词，否则不得登台。甚至连“胡同”“站”（源自蒙古语“站赤”）等地名，都被要求更改为“里弄”“驿”。\n\n这场“扩大化”的清算，终于引发了民间的反弹。西安市民纷纷抗议：“咱老秦人吃泡馍吃了几千年，咋就成了‘胡人’？”北方的农家主妇更是不解：“祖祖辈辈冬至吃饺子防冻耳，张仲景大夫传下来的方子，咋就变成鞑子的了？”\n\n在政府的干预下，这场风波逐渐平息，但留给人们的思考却未停止。当文化复兴走向极端的“洁癖”，所谓的“复兴”，或许反而会背离文化自信的初衷。正如一位老学究在《申报》上所写：“真正的华夏衣冠，不在衣袂的宽窄，而在包容万物的胸襟；不在剔除‘异类’的偏执，而在海纳百川的从容。”"
gxc_hjj.22.a:0"今天晚上吃饺子去！"

gxc_hjj.23.t:0"东方智慧"
gxc_hjj.23.d:0"伦敦塔桥旁的孔子学院内。\n\n出身某贵族家庭的阿尔伯特穿着一身略显宽大的青色长衫，束着玉带，正笨拙地模仿着讲台上的先生，教室里弥漫着淡淡的墨香与龙井茶的气息。\n\n“这位是来自剑桥的阿尔伯特同学。”先生微笑着介绍，“他将为我们演示‘君子九容’。”\n\n阿尔伯特深吸一口气，努力回忆着昨晚练习的动作。当他双手交叠于腹前，缓缓躬身行礼时，周围的同学发出了善意的笑声。那是一种笨拙却真诚的鞠躬，不像宫廷礼仪那样充满等级的傲慢，也不像军礼那样充满杀伐的冷硬。\n\n“容体庄，面色度，视听端……”他低声念着口诀，忽然感到一种前所未有的宁静。在这里，没有家族的期望，只有笔墨纸砚构建的另一个世界。\n\n课程结束后，阿尔伯特并没有急着离开。他留在教室，小心翼翼地研磨着一块徽州松烟墨。先生走过来，递给他一张宣纸：“阿尔伯特，你知道为什么汉字是方块字吗？”\n\n“因为……方正？”阿尔伯特猜测道。\n\n“不完全是。”先生蘸墨挥毫，在纸上写下了一个大大的“和”字，“因为天圆地方，因为中正平和。这是东方的哲学，也是治国的智慧。”\n\n阿尔伯特看着那个墨迹未干的字，忽然想起了伦敦街头那些罢工的工人，想起了议会里争吵不休的议员，想起了日渐衰落的帝国海军。也许，这个古老文明留下的，不仅仅是丝绸和瓷器，更是一种让国家长治久安的答案。\n\n“先生，我想学更多。”阿尔伯特抬起头，蓝眼睛里闪烁着前所未有的光芒，“我想知道，如何让一个帝国重获新生。”\n\n窗外，泰晤士河静静流淌，对岸的议会大厦钟楼敲响了六下。阿尔伯特知道，当他走出这扇门，他依然是那个贵族家族的旁系子弟，但在他的心里，已经种下了一颗来自东方的种子。\n\n这颗种子，或许会在未来的某一天，让不列颠的狮子，学会东方巨龙的智慧。"
gxc_hjj.23.a:0"文化的力量，往往比坚船利炮更深入人心。"

gxc_hjj.24.t:0"宣传员下乡"
gxc_hjj.24.d:0"“乡亲们！来看看咱们汉家的衣冠礼仪！”义务宣传员李卫国穿着一身深衣，在村口的晒谷场上扯开嗓子喊，手里挥着刚印好的《士相见礼图解》。几个放牛娃围过来，戳了戳他宽大的袖口，又吐着舌头跑开。老村长蹲在石磨旁抽旱烟，烟雾缭绕里嘟囔：“这衣服……下地干活不得绊倒？”\n\n李卫国没泄气，第二天搬来放映机，放起了《汉服演变史》。幕布上，宽袍大袖的古人行着揖礼，背景音乐是悠扬的编钟。前排的王婶打起了哈欠：“小李啊，这礼仪是好看，可比不上俺们山歌实在。前天山洪冲了西头的坝，你这放映机能修堤不？”\n\n夜里，李卫国躺在村委会的硬板床上，翻来覆去睡不着。宣传册上的“冠礼”“笄礼”画得精致，可村民们眼里的愁云更真切——村口的路坑坑洼洼，孩子们上学要绕半小时山路；村东的灌溉渠堵了半年，稻田都快旱死了。\n\n第三天清晨，他没穿深衣，换上了借来的粗布衫，扛着铁锹去了灌溉渠。正午的太阳毒辣，他满手血泡，却跟着村民们一锹一锹清淤。王婶送来凉茶，盯着他沾满泥浆的裤脚，忽然说：“小李，你这袖口挽起来的样子，倒有点像俺们村的后生。”\n\n傍晚的广播站里，李卫国的声音混着电流声传遍全村：“乡亲们，汉文化不只是衣服和礼仪。‘民为邦本，本固邦宁’是《尚书》里的古训，修路、通水、种粮，才是咱们当下的‘礼仪’。”\n\n他把宣传册收进箱底，翻出了另一份文件——《山区民生改善指南》。幕布上不再放古人的揖礼，换成了农业专家讲解稻田施肥的视频。老村长看着屏幕上跳动的字幕，烟杆在鞋底磕了磕：“这才像话。咱们山里人不懂大道理，但知道谁帮俺们过日子，谁就是‘汉家的好后生’。”\n\n月光爬上山头时，李卫国坐在渠边，看着水流缓缓漫过干裂的稻田。远处的晒谷场上，放牛娃们学着他昨天的样子，用树枝当笏板，行着歪歪扭扭的“揖礼”，嘴里喊着：“为民办事，才是大礼仪！”\n\n他忽然笑了，从背包里掏出那本《士相见礼图解》，在扉页上写下："
gxc_hjj.24.a:0"“真正的教化，不在衣冠，而在民心。”"

gxc_hjj.25.t:0"满穗的一篇演讲"
gxc_hjj.25.d:0"“同志们，同胞们！\n\n当我们审视这片广袤的土地，会发现它不仅由山川河流构成，更由千千万万颗跳动的心汇聚而成。我们或许来自不同的地域，说着不同的方言，有着不同的风俗，但我们头顶的是同一片星空，脚下的是同一片热土，血脉中流淌的是同一种精神——华夏精神。\n\n构建‘华夏共同体’，绝非一句空洞的口号，而是历史的必然选择，是现实的迫切需求。它是我们面对风雨时的坚固盾牌，是我们在世界民族之林中挺立的脊梁。\n\n我们需要明白，多样性是我们的财富，但共同的认同才是我们的根基。唯有将这根基筑牢，让每一个生活在这片土地上的人，无论他来自何方，都能发自内心地认同‘我是华夏人’，我们的国家才能真正凝聚成一股不可阻挡的力量。\n\n这不仅是政府的责任，更是我们每一个人的使命。让我们携手并肩，用理解消融隔阂，用尊重包容差异，用共同的奋斗书写属于我们所有人的辉煌篇章。因为，我们荣辱与共，我们命运相连！”"
gxc_hjj.25.a:0"我乃华夏人，此生共命运！"

gxc_hjj.26.t:0"净化"
gxc_hjj.26.d:0"黑山沟没有四季，只有漫长的严冬和酷热的盛夏。这里是新政权的劳改营，数千名曾为伯雷帖木儿效力的满、蒙、汉高官，如今被剥夺了姓名，只剩下编号和褴褛的囚衣。\n\n囚犯们排成蜿蜒的长龙，在监工的皮鞭和狼狗的注视下，日复一日地搬运着滚烫的盐石。没有机械，没有工具，只有血肉之躯。曾经养尊处优的权贵们，如今脊背被压得佝偻变形；曾经满腹经纶的大臣们，双手布满了冻疮和血泡。他们不再交谈，眼神空洞，像一群被抽去了灵魂的牲畜，机械地重复着抬石、搬运、堆砌的动作。\n\n死亡在这里是常态。每天清晨，看守们都会从工棚里拖出几具僵硬或腐烂的尸体，那是昨夜没能挺过严寒或过度劳累的“废品”。尸体被草草掩埋在盐碱地里，连墓碑都不配拥有，仿佛他们从未存在过。\n\n每年，只有极少数被视为“彻底改造”的囚犯会被释放。他们通常是那些最顺从、最善于出卖同伴、最能适应这种非人生活的人。当这些幸存者走出黑山沟时，他们已不再是曾经的人，而是新政权最忠实的奴仆，眼神中透着对权力的绝对敬畏。\n\n这些囚犯曾经依附外夷，骑在汉家儿郎头上作威作福；如今，他们用自己的血肉之躯，为新华夏的崛起铺路。"
gxc_hjj.26.a:0"这一切，都是他们应得的。"

gxc_hjj.27.t:0"铁血归一"
gxc_hjj.27.d:0"张伟大总统又在广播中发表了他那慷慨激昂的演讲。\n\n扩音器里传出的不是温和的劝慰，而是如同战鼓般沉闷而有力的嗓音。\n\n“同胞们！有人问我，中华民族的脊梁在哪里？是在那绵延的长城废墟里吗？不！是在你们的骨血里！”\n\n“看看我们的历史，我们曾经因为分裂而沦为奴隶，因为内耗而差点亡国灭种！那些试图把我们分割的阴谋家，那些试图稀释我们高贵血脉的伪善者，都已经被扫进了历史的垃圾堆！”\n\n“今天，我站在这里，不是为了乞求和平，而是为了宣告力量！汉族，作为这片土地的主人，作为文明的缔造者，必须像钢铁一样熔铸在一起！我们要的不是脆弱的妥协，而是绝对的团结！我们要让每一个汉家儿郎都明白，你的荣耀属于民族，你的生命属于国家！”\n\n“从今日起，不再有地域之分，不再有派系之争！只有一个声音，那就是中华民族的声音！只有一个意志，那就是华夏人民的意志！让我们把拳头攥紧，攥到流出血来，然后——砸碎一切阻碍我们复兴的敌人！”"
gxc_hjj.27.a:0"将总统的演讲录制成唱片，强制在每一个村镇循环播放。"

gxc_hjj.28.t:0"为何而战"
gxc_hjj.28.d:0"晨雾未散，军营已如铁铸般凝固。青石铺就的演武场上，五千士兵列阵而立，枪械在熹微晨光中泛着冷芒。他们的军靴踏地声整齐如一人，呼吸声被刻意压低，唯有北风掠过旗杆，搅动那面绣着血色“汉”字的军旗，猎猎作响。\n\n张伟踏着铿锵步伐走下装甲车。他身着墨绿将帅服，肩章上的三颗金星刺目夺目，腰间配剑的流苏随脚步摆动，每一步都似踩在鼓点上。卫兵们同时举枪致敬，枪托撞击地面的闷响惊飞了远处树梢的寒鸦。\n\n“总统阁下！”司令官疾步上前，行军礼时皮手套擦过额角汗珠。张伟颔首，目光却径直扫过方阵。士兵们纹丝不动，唯有眼珠随他的移动微微转动，像一片蓄势待发的箭雨。\n\n他缓步踏上阅兵台，高筒军靴踩在木质台阶上发出沉闷声响。刹那间，方阵中爆发出震天动地的呼喊：“驱逐鞑虏！复兴中华！总统万岁！”声浪如海啸般涌来，连远处山壁的积雪都簌簌震颤。张伟静立台前，双臂自然下垂，指尖轻触剑柄，面容如铁铸般冷峻。他等待声浪渐息，方才抬起右手——掌心向下，缓缓压下。\n\n呼喊戛然而止，军营重归死寂。唯有他的声音穿透这片凝固的空气：“你们知道，为何今日检阅？”\n\n无人应答，五千双眼睛如钉子般钉在他身上。\n\n“因为圣杯国等西方列强，此刻仍在磨刀霍霍。”张伟突然拔剑出鞘，寒光映亮半张面孔，“他们想骑在我们的脖颈上，用我们的血喂养自己的野心。而你们——”剑锋横扫方阵，将每一道紧绷的面容纳入寒光，“将是踩碎他们脊梁的靴子！”\n\n士兵们同时攥紧枪械，喉结滚动。队列最末，一名新兵的脸因过度激动涨成紫红，指节将枪托攥出细密的裂纹。\n\n张伟倏然收剑入鞘，转身面向军旗。“记住，你们的忠诚不是口号，是刺刀上的血。”他声音低沉，却字字如锤，“明日，第三集团军将开拔南洋。去把那些殖民者杂种，永远沉入大海。”\n\n方阵中突然爆发出更剧烈的嘶吼，这一次，连司令官的嘴角都不可遏制地抽搐上扬。张伟背对人群，悄然抬手抹去眼角一滴泪。那泪痕很快被寒风冻结，在他苍白的皮肤上凝成一道细小的冰晶。"
gxc_hjj.28.a:0"这才是最优质的战士"

gxc_hjj.29.t:0"少年强则国强"
gxc_hjj.29.d:0"我是一名普通的高中生，这是我进入第三中学后的第一次实弹射击考核，枪械管理员刚递给我的步枪还残留着金属特有的寒意——这是真枪，货真价实的制式步枪。\n三个月前，张伟总统的“铁血教育令”抵达学校时，我们正趴在课桌上昏昏欲睡。教室广播里传来他铿锵的声音：“今日之少年，便是明日之长城！学校不仅是知识的殿堂，更应是锻造战士的熔炉！”随后，我们见证了翻天覆地的变化：体育课被军训取代，历史课新增了“百年屈辱与民族复兴”专题，就连音乐课也改唱军歌。最震撼的是，每月一次的实弹射击训练被写进了课程表，枪械库就设在学校地下室，钥匙由校长亲自保管。\n“瞄准！呼吸！”教官的吼声将我拉回现实。他叫陈猛，曾参加过第二红巾军，右眼有一道狰狞的刀疤。此刻他正站在我身后，粗粝的呼吸喷在我耳后，“别怕！你们手里的枪，是守护国土的尊严！想想那些被蛮夷屠杀的祖先，想想总统说的‘汉人至上’！”\n我深吸一口气，按照训练时的动作调整姿势。枪托抵住肩窝，右眼对准准星，余光瞥见百米外的靶纸——那靶心上画着的，不是普通的圆环，而是一颗狰狞的狼头，那是我们每次射击的标配目标。“蒙古狼的象征。”陈教官曾冷笑，“打不中它的学生，不配称为汉家儿郎！”\n“预备——射击！”随着指令，我扣动了扳机。剧烈的后坐力撞得肩膀生疼，枪声在山谷中回荡。报靶员的声音传来：“8环！及格！”虽然没达到优秀，但陈教官还是拍了拍我的肩膀：“比上次有进步！记住，子弹打出去的不是靶子，是咱们的脊梁骨！”\n训练结束，我们列队返回教室。路过宣传栏时，一张张伟总统的巨幅海报映入眼帘：他身着军装，背后是绵延的长城，标语写着“少年强则国强，铁血铸魂，民族复兴！”\n历史课上，老师正在播放纪录片：黑白的画面里，蒙古骑兵挥舞弯刀，满人铁骑踏破山海关，汉人跪地求饶的影像令人窒息。“这就是我们祖先的屈辱！”老师的声音激昂，“而你们，绝不能让历史重演！”\n夜幕降临时，我躺在床上辗转反侧。窗外月光清冷，远处军营的探照灯扫过天际。枕下压着今天射击的子弹壳，金属的凉意透过布料传来。我想起陈教官的话，想起靶纸上的狼头，想起张伟总统演讲时那如炬的目光。忽然间，肩上的酸痛似乎化作了某种力量，在血液中奔涌——"
gxc_hjj.29.a:0"美哉我少年中国，与天不老！壮哉我中国少年，与国无疆！"

gxc_hjj.30.t:0"新兵思想教育"
gxc_hjj.30.d:0"窗外的寒风如刀子般刮过操场，但在新兵营的讲堂内，空气却凝固得让人窒息。小何挺直了脊梁，双手平放在膝盖上，指甲因过度用力而微微发白。他能感觉到身边战友们急促而压抑的呼吸声。\n\n讲台上，教官面背对着他们，正用粉笔在黑板上狠狠写下两个力透纸背的大字：“军魂”。\n\n“什么是军魂？”教官猛地转过身，鹰隼般的目光扫过每一个新兵稚嫩的脸庞，“是精良的步枪？是厚重的装甲战车？不！那些只是躯壳。没有魂的军队，只是一群穿着制服的行尸走肉！”\n\n他走到小何面前停下，沉重的军靴踏在石板地上，发出令人心惊的声响。“几百年前，大明的甲兵不可谓不精，关宁铁骑不可谓不悍。可结果呢？”教官的声音陡然拔高，带着一种近乎撕裂的悲愤，“吴三桂，为了一个女人和自己的权位，卑躬屈膝地给塞外胡虏牵马坠蹬！洪承畴，战败后竟恬不知耻地剃发易服，成了异族屠杀同胞的急先锋！”\n\n“为什么？”教官猛地一拳砸在讲桌上，震得上面的水壶嗡嗡作响，“因为他们心里没有这千万汉民百姓！他们当兵是为了吃粮，当官是为了荣华。在他们眼里，民族的血脉是可以交易的筹码，祖宗的衣冠是可以丢弃的烂布！”\n\n小何感到一股热血猛地冲上脑门。他仿佛看到了史书上那些被血泪浸透的篇章。\n\n“记住！”教官跨步回到讲台中心，挥舞着拳头，嘶吼道，“你们手中的枪，不是为了保护某个官老爷的家产，也不是为了领那几块卖命钱。你们是华夏的利齿，是千万同胞的脊梁！当你们冲锋时，你们背后站着的是无数汉家父老；当你们牺牲时，你们的魂魄将归于华夏的英灵殿！若是谁敢像吴、洪之流一样背叛这身衣冠、背叛这份血脉，这柄正义之剑，必将先斩断你们的喉咙！”\n\n“为华夏万民而战！死战不退！”\n\n小何情不自禁地跟着战友们站了起来，嗓子喊得沙哑而生疼。在这一刻，他觉得自己是一块烧红的钢铁，正被这种狂热的信仰锻造成型。"
gxc_hjj.30.a:0"血脉即是信仰"

gxc_hjj.31.t:0"忆苦饭"
gxc_hjj.31.d:0"在第四步兵师的铁灰色食堂里，听不到一丝闲聊的嘈杂。宽阔的穹顶下，只有几千人整齐划一的咀嚼声，以及钢勺碰撞铝制饭盒的清脆响动。长桌两旁，士兵们穿着玄色的制式作训服，坐姿笔挺如松，目光死死盯着正前方的白墙——那里用鲜红的油漆刷着四个大字：“饮冰淬血”。\n\n今天的晚饭是硬如砖头的“忆苦饼”和寡淡的糙米汤。这是军需部《新军人操守条例》的强制规定：每周三的晚餐必须重演“沦陷期”先辈在荒野中逃亡的食谱，以此保持部队对外部世界的饥饿感与仇恨。\n\n新兵赵土根因为白天连续十个小时的高强度刺杀操练，端着饭盒的双手仍在控制不住地微微发抖。一不留神，一小块饼渣掉在了冰冷的地面上。\n\n“啪！”\n\n一记沉重的枪托瞬间砸在他的背上，将他重重地砸倒在地。没有怒骂，宪兵班长只是居高临下地冷冷看着他。周围同桌的战友连眼皮都没有抬一下，目光依然直视前方，保持着机械的咀嚼节奏。\n\n班长的声音如同淬火的寒铁：“你掉下的不是粮食，是先烈在胡虏刀下流尽的血。连这点残渣都握不住，上了战场，你拿什么去咬碎敌人的喉咙？”\n\n赵土根没有惨叫，更没有辩解。他迅速从地上爬起，连嘴角的血丝都没有擦，笔直地站出一个标准的军姿。他伸出手，将那块沾着灰尘的饼渣捡起，毫不犹豫地塞进嘴里，连同血水一起用力咽下，随后用尽全身力气嘶吼道：“汉魂不灭！死战不退！”\n\n班长冷硬的面部线条终于有了一丝缓和。在这座庞大的兵营里，早就没有了“人”的软弱，所有的温情、退缩与个体的痛楚，都在这种日复一日的极端狂热中被彻底碾碎。"
gxc_hjj.31.a:0"这样的军队，是敌人的噩梦，也是自己的。"

gxc_hjj.32.t:0"要塞前的利刃"
gxc_hjj.32.d:0"南洋的季风卷着硫磺与腐烂叶片的气味，远处圣杯殖民军的石砌要塞如同一头灰色的巨兽，正从射击孔中喷吐着维克斯机枪的火舌。\n\n藏族士兵扎西趴在泥泞的弹坑里，滚烫的枪管灼烧着他的掌心。他的连队——归化营第三纵队，已经在这一百米的开阔地上丢下了大半的尸体。教官那嘶哑而狂热的声音在他脑海里反复回荡：“你们的血是混杂的，唯有战火能将其淬炼成纯正的华夏赤诚！冲锋，或者作为懦夫被历史抹除！”\n\n“为了华夏！为了民族！”\n\n随着哨声响起，扎西发出一声沙哑的咆哮，像一头被激怒的岩羊般跃出弹坑。在他身边，同为少数民族的战友们正一个个被机枪子弹拦腰折断，或者被迫击炮火瞬间撕碎。飞溅的血沫溅到了他的护目镜上，但他没有擦拭。那种长期服用的强效兴奋剂与反复洗脑形成的条件反射，已经剥夺了他对死亡的本能恐惧。\n\n他的眼中只有那座要塞。子弹擦过他的钢盔，带走了一块头皮，鲜血顺着额头流进眼睛，视界变得一片猩红。但他依然在狂奔，跨过层叠的尸体，在机枪换弹的几秒间隙，他整个人合身扑到了要塞厚重的石墙根部。\n\n他从背后拽出那个沉重的、捆满了震雷管的特制炸药包。周围是圣杯军人绝望的喊话声和近距离落下的手榴弹，扎西发出了最后一声癫狂的笑声，那是对教官灌输的“终极牺牲”的病态践行。\n\n“轰——！！！”\n\n冲天的火柱与升腾的硝烟中，那座看似坚不可摧的要塞墙壁被炸开了一个巨大的缺口。扎西的身影瞬间消失在强光中，而后续的汉族官兵正踩着他炸开的血路，挺着刺刀如潮水般涌入缺口。\n\n在指挥部的望远镜后，参谋官冷漠地记录下一行字："
gxc_hjj.32.a:0"“‘归化营’损耗率达62%，要塞防御已瓦解。消耗比例符合预期。”"


mon_news.1.t:0"$news_event_background$草原居民驱逐北京的总督"
mon_news.1.d:0"随着最后一列满载伤兵的装甲列车轰鸣着驶过长城防线，标志着神州帝国在蒙古地区长达三十年的统治正式宣告终结。昨日深夜，一场由蒙古诸部联合发起的武装暴动攻陷了库伦的总督府。\n\n神州帝国末任安北总督琳迪斯在亲卫队的拼死掩护下，仅以身免，连夜向南突围。\n\n草原联盟发言人慢羊羊今日清晨发表《光复宣言》，宣称：“从今日起，草原不再向南方缴纳一粒粮食、一匹战马。这片土地重新属于它的儿子们。”宣言同时警告任何试图北上的军事力量将面临“不死不休的抵抗”。\n\n分析人士指出，此次暴动的成功不仅意味着神州帝国失去了重要的马匹产地与北方屏障，更可能引发连锁反应，导致西北边疆局势全面失控。\n\n北京方面尚未对此事作出正式回应，但据传内阁已陷入紧急争吵。而在莫斯科，克里姆林宫的目光正紧紧盯着这片新生的动荡之地。"
mon_news.1.a:0"我们不是叛乱者，我们是这片土地真正的主人。"
mon_news.1.b:0"又一块版图变色了"
mon_news.1.c:0"待我北征大军一至，定叫逆贼灰飞烟灭！"

mon_news.2.t:0"$news_event_background$流亡白军控制蒙古"
mon_news.2.d:0"据库伦方面的消息，神州帝国安北都司总督琳迪斯为镇压草原各部暴动，紧急授权流亡白俄领袖艾黛尔贾特调动白军介入。然而，当白俄铁骑以残酷手段平息民乱后，反而调转枪口，于昨夜凌晨发动突袭。\n\n忠于神州的守军猝不及防，防线迅速崩溃，安北都司宣告瓦解。艾黛尔贾特随即接管库伦，宣布废除一切神州官制，整合蒙古诸部王公与白俄军官团，正式登基为“大蒙古国大汗”。她在就职演说中宣称：“从今日起，蒙古将以铁与血开辟新纪元。”\n\n目前，新政权已全面控制漠南漠北全境，并开始整编一支兼具火力与机动性的混合军团。边境哨所报告，大量物资正被运往长城方向，战争阴云笼罩北方。"
mon_news.2.a:0"旧世界的灰烬，是我们新帝国的基石。"
mon_news.2.b:0"一个斯拉夫人成为蒙古大汗？有趣。"
mon_news.2.c:0"待我北征大军一至，定叫逆贼灰飞烟灭！"
mon_news.2.e:0"白色瘟疫在远东扩散，红军必须准备应对最坏的情况。"

mon_news.3.t:0"$news_event_background$安北都司拒绝效忠北京"
mon_news.3.d:0"危机的导火索由北京点燃。昨日，袁克定强行罢免深受草原各部拥戴的安北都司总督琳迪斯，改派其心腹党羽徐树铮接任。但是这一行为造成了意想不到的后果。在今日凌晨召开的紧急会议上，面对北京使臣的威逼利诱，年轻而果敢的军官孛儿只斤·别烈思挺身而出。她迅速说服了在场犹豫不决的安北都司官员和草原各部代表。在群情激愤之下，与会代表一致推举别烈思为新任总督，并当场撕毁袁克定的任免手谕，将北京使臣驱逐出境。\n\n正午时分，别烈思通过广播发表《护宪讨袁檄文》，正式宣布安北都司进入“非常状态”，组建“靖难军”。她誓言：“袁氏一日不下野复宪，我安北一日不休兵！”\n\n目前，原安北驻军大部已宣誓效忠别烈思，京绥铁路沿线已被切断。北京方面震怒，袁克定急令第三师北上“讨逆”，内战阴云笼罩华北。"
mon_news.3.a:0"我等举旗非为分裂，实为拯救神州于独裁深渊！"
mon_news.3.b:0"在东方荒漠中竟有人为宪政流血？"
mon_news.3.c:0"逆贼别烈思，名为护宪，实为割据！"

mon_news.4.t:0"$news_event_background$黄金家族后裔再次统治蒙古"
mon_news.4.d:0"蒙古高原的民主实验在今日戛然而止，取而代之的是铁腕与鲜血。草原长选举大会被一支身着黑色制服、佩戴倒卍字臂章的极端民族主义武装——“黑万字”强行接管。\n\n在黑洞洞的枪口下，草原各部代表被迫“全票通过”决议：重建“大元大蒙古兀鲁思”。黑万字实际领袖，黄金家族后裔孛儿只斤·伯雷帖木儿身着复刻的元朝帝服，手持苏鲁锭长枪，向全场宣告：“从今日起，不再有部落，只有臣民；不再有选举，只有圣旨。大元帝国将统合诸部，重立法度，恢复祖业！”\n\n黑万字随即展开清洗行动，任何质疑复辟的声音都被视为“叛国”，意图以恐怖手段强行整合蒙古诸部。\n\n北京方面对此震怒，斥责这是“赤裸裸的法西斯政变”；莫斯科则警告称，一个极端民族主义政权在边境崛起，将对西伯利亚构成直接威胁。随着黑万字团的铁蹄踏碎选票，草原正式进入了“新北元时代”。"
mon_news.4.a:0"黄金家族的铁骑将再次震撼世界！"
mon_news.4.b:0"又一个试图恢复昔日荣光的君主"
mon_news.4.c:0"待我北征大军一至，定叫逆贼灰飞烟灭！"

mon_news.5.t:0"$news_event_background$中国统一"
mon_news.5.d:0"在历经数年惨烈且混乱的军阀割据后，蒙古军队在草原长喜羊羊的领导下击败各路分裂势力，统一了中华大地。\n\n今日正午，喜羊羊在天安门广场举行建国大典。他宣布废除帝制，解散皇室，终结“君权神授”的旧时代，正式建立中华民国。\n\n“帝国已死，万民当立。”喜羊羊面对广场上数十万军民，声音平和却穿透云霄，“我们不再是大皇帝的子民，也不再是部落的奴隶。从今日起，这片土地属于每一个耕者、每一个织者、每一个守护家园的人。无论汉、蒙、回、藏，皆为共和公民！”\n\n喜羊羊的胜利被评论家称为“温和的奇迹”。他并未依靠恐怖统治，而是凭借卓越的统战能力，将原本四分五裂的蒙古骑兵、汉族边军、兽族民兵整合为一支纪律严明的“护国联军”。他的“草原智慧”——以包容化解仇恨，以共享利益换取忠诚，成功让无数死战到底的军阀放下了武器。神州大地自帝国崩溃以来首次实现了真正的统一。\n\n世界为之侧目。曾经被视为“割据者”的草原长，如今成为了终结两千年帝制、重塑东方秩序的“国父”。"
mon_news.5.a:0"从此神州无贵贱，四海皆兄弟。"
mon_news.5.b:0"东方的民主奇迹！"

mon_news.6.t:0"$news_event_background$中国统一"
mon_news.6.d:0"历史的巨轮在今日转向了全新的轨道。在历经数年惨烈的军阀混战后，蒙古草原长兔子率领的蒙古人民军彻底终结了腐朽的神州帝国及其各路割据势力。\n\n今日下午，兔子身着朴素的灰色布衣，佩戴红星徽章，在天安门城楼举行盛大开国大典。他庄严宣布了一个社会主义新中国的诞生。\n\n“从来就没有什么救世主，也不靠神仙皇帝！”兔子的声音通过无线电传遍大江南北，“过去，草原是王公的牧场，工厂是资本家的乐园，农田是地主的粮仓。从今日起，这片土地属于工人，属于农民，属于所有被压迫的人民！我们要建立一个没有剥削、人人平等的社会主义新中国！”\n\n兔子的胜利被视为“人民战争的奇迹”。他并未依赖单纯的军事征服，而是通过深入的土地改革和广泛的群众动员，将原本散沙般的农民、工人、牧民凝聚成一股不可阻挡的红色洪流。他的“胡萝卜加大棒”战术——对顽抗者雷霆打击，对投诚者宽大处理，并切实分田分地，使得敌军往往未战先溃，纷纷倒戈。\n\n世界为之震动。曾经被视为“只会种胡萝卜”的草原长，如今成为了东方红色巨人最伟大的领袖。"
mon_news.6.a:0"中国人民从此站起来了！"
mon_news.6.b:0"赤色风暴席卷了东亚"

mon_news.7.t:0"$news_event_background$中国统一"
mon_news.7.d:0"神州大动荡于今日迎来终局。蒙古草原长、狼族首领灰太狼消灭了最后一支中国的分裂势力。随后，灰太狼在紫禁城举行盛大典礼，正式宣布废除“神州帝国”旧号，建立“群狼帝国”。\n\n与历史上蒙古征服者的形象截然不同，灰太狼在就职诏书中明确宣示：“朕虽出草原，然心向华夏。群狼帝国非外来之政权，乃中华正统之延续。自今日起，蒙汉一体，再无征服者与被征服者之分，皆为朕之子民，共筑中华之基业。”\n\n灰太狼的统治风格被外界评价为“威权而务实”。他并未推行种族隔离或高压清洗，而是建立了一套高度集权的“军政合一”体制。他废除了议会与选举，强调“秩序高于自由，效率高于争论”，由皇帝直接任命各级官员，并依靠纪律严明的狼族骑兵与倒戈的前帝国官僚共同治理国家。对于反抗者，他雷霆镇压；对于顺从者，无论民族出身，皆予重用。\n\n“乱世需用重典，强国需立中枢。”灰太狼在接受外媒采访时坦言，“民主是太平盛世的游戏，如今的神州百废待兴，需要一个强有力的声音来指引方向。朕不要做征服者，朕要做的是让这片土地重新伟大的守护者。”"
mon_news.7.a:0"狼王万岁，中华万岁！"
mon_news.7.b:0"从‘狼主’到‘皇帝’，他能否将野性转化为治理能力？"

mon_news.8.t:0"$news_event_background$中国统一"
mon_news.8.d:0"随着最后一股割据势力于昨日宣布无条件投降，历时数年的神州大分裂正式终结。[MON.Getleader]在北京向全国宣告神州帝国全境光复，四海归一。\n\n[MON.Getleader]及其麾下的“勤王军”先前攻入北京，成功从权臣手中“解救”了神州女皇蒋丽华，确立了“挟天子以令诸侯”的政治格局。[MON.Getleader]以北京为中枢，凭借女皇的正统法统与自身卓越的军事指挥能力，采取“先北后南、各个击破”的战略，逐一铲除了军阀势力。\n\n今日清晨[MON.Getleader]率领文武百官，在天坛举行盛大的“告祭天地”大典。他再次拥戴蒋丽华女皇亲自主持祭天，自居臣位，誓言“鞠躬尽瘁，辅佐圣主，直至天下大治”。\n\n“朕之江山，乃祖宗基业；太师之功，乃社稷之福。”蒋丽华在典礼上宣读诏书，正式册封[MON.Getleader]为“镇国太师”，赐九锡，许剑履上殿，位极人臣。\n\n[MON.Getleader]在随后的演说中强调：“神州之统一，非一人之功，乃天命所归，人心所向。今战乱已息，当务之急在于休养生息，重建家园。本太师愿做陛下手中最锋利的剑，守护这来之不易的和平。”"
mon_news.8.a:0"吾皇万岁，太师千岁！"
mon_news.8.b:0"这是曹操再世，还是孔明复生？"

mon_news.9.t:0"$news_event_background$中国统一"
mon_news.9.d:0"随着最后一股军阀势力于昨日投降，神州统一战争正式结束。\n\n先前，孛儿只斤·别烈思率军推翻袁克定政权，迎立蒋丽华女皇复位，并以太师身份总揽军政。在随后的统一战争中，她凭借卓越的军事才能扫平了各地割据势力，再度一统天下。蒋丽华女皇随即下旨，晋封别烈思为“镇国大元帅、首席太师”，赐“剑履上殿”殊荣，确立“君臣共治”的新体制。\n\n尽管有人劝她取而代之，正式称帝，但她誓言将继续以太师身份辅佐女皇，推行宪政，任何再言篡位者将被军法处置。\n\n国际观察家评论称，别烈思的选择不仅保全了神州帝国的法统连续性，更以一种罕见的政治道德赢得了国内外广泛尊重，为战后重建奠定了坚实基础。"
mon_news.9.a:0"吾皇万岁，太师千岁！"
mon_news.9.b:0"一位东方的辛辛纳图斯"

mon_news.10.t:0"$news_event_background$中国统一"
mon_news.10.d:0"神州历史上最具戏剧性的一幕今日在北京上演。在推翻袁克定暴政、扫平各路军阀并统一中国后，摄政太师孛儿只斤·别烈思并未选择继续维持“虚君实相”的格局，而是在群臣的再三恳请与“万民劝进”的浪潮中，接受了神州女皇蒋丽华的禅让，正式登基称帝，重建大元帝国。\n\n上午九时，禅让大典隆重举行。蒋丽华身着素服，手捧传国玉玺，宣读《退位诏书》，称“天命已移，德不配位”，自愿将江山社稷禅让于“功盖天地、德被四海”的太师别烈思。随后，别烈思身着大元礼制的冕服，接受百官朝贺，改国号为“大元”，年号“天宪”，意为“天命所归，宪政为本”。\n\n“朕受禅非为私欲，乃顺天应人，终结乱世。”别烈思手持宪法草案，向全场宣告，“新的大元并非专制的前元。皇帝为国家元首与象征，统而不治；实权归于民选议会与责任内阁。朕之使命，是守护这部宪法，守护四万万同胞之自由与权利。若有违宪者，虽朕亦当受审！”\n\n这一“君主立宪下的帝国复兴”模式，迅速获得了国内知识分子、民族资产阶级及各族民众的广泛支持。随着禅让大典的落幕，一个披着古老外衣、却拥有现代灵魂的新大元帝国，正式启航。"
mon_news.10.a:0"我们既有辉煌的过去，更有光明的未来！"
mon_news.10.b:0"真是奇迹"

mon_news.11.t:0"$news_event_background$中国统一"
mon_news.11.d:0"最后的抵抗在今晨熄灭。孛儿只斤·伯雷帖木儿——这位自称“大元皇帝”的疯狂军阀，终于将他沾满鲜血的战旗插上了中华大地。历时数年的血腥统一战争画上了句号。\n\n但这并非复兴的曙光，而是漫长黑夜的开始。\n\n伯雷帖木儿的胜利伴随着系统性的恐怖，身着黑衣，佩戴倒卍字臂章的黑万字特务，如同幽灵般穿梭于大街小巷，随意抓捕、拷打、处决任何疑似“心怀故国”的平民。图书馆被焚毁，学校被改为兵营，汉族传统文化遭打压。神州大地仿佛回到了最野蛮的部落时代，只不过这次，统治者掌握了现代化的机枪与坦克。\n\n“不要指望和平，”伯雷帖木儿在广播中用嘶哑的声音咆哮，“我们要的是征服！整个亚洲都将成为我们的牧场，所有异族都将成为我们的牛羊！反抗者，唯有死亡！”\n\n夜幕降临，曾经繁华的北京城如今死寂一片，只有巡逻队的皮靴声和远处偶尔传来的枪声打破沉默。无数家庭在黑暗中瑟瑟发抖，等待着不知何时会降临的厄运。神州，这个曾经辉煌的文明古国，此刻正窒息在黑色铁蹄之下，发出一声声无声的悲鸣。"
mon_news.11.a:0"顺我者昌，逆我者亡！"
mon_news.11.b:0"野蛮战胜了文明"

mon_news.12.t:0"$news_event_background$蒙古帝国归来"
mon_news.12.d:0"随着神州帝国最后一道防线崩溃，白俄流亡领袖、现任“蒙古大汗”艾黛尔贾特今日在北京前举行了盛大的登基典礼。她正式宣布蒙古帝国的重生。\n\n这不仅仅是一次政权的更迭，更是一份向整个世界——尤其是西方——发出的死亡宣战书。\n\n在典礼上，艾黛尔贾特身着融合了蒙古传统大袍与沙俄军装的奇特服饰，身后是整齐列队的“双头鹰怯薛军”——一支由哥萨克骑兵、蒙古铁骑和白俄重炮兵组成的混合恐怖军团。她手持军刀，用流利的蒙语、俄语和汉语向全世界广播：\n\n“东方的猎物已尽，神州的腐朽已被洗净。但草原的野心永不满足！”艾黛尔贾特的声音通过无线电传遍欧亚大陆，“七百年前，我们的祖先曾让半个地球在马蹄下颤抖；七百年后，我，艾黛尔贾特，将超越这一辉煌！”\n\n据悉，新政权已实施全国总动员，工业体系全面转向战时轨道。艾黛尔贾特甚至公开宣称：“如果世界不臣服，那就让世界在火焰中重生。”\n\n这一疯狂宣言瞬间引爆了国际社会的恐慌。从莫斯科到柏林，从伦敦到生命之树，紧急会议通宵达旦。人们意识到，一个融合了蒙古机动性、白俄复仇狂热和现代火力的战争怪物已经诞生，而它的獠牙，正死死盯着西方。"
mon_news.12.a:0"长生天指引着我们！"
mon_news.12.b:0"成吉思汗的幽灵复活了"

mon_news.13.t:0"$news_event_background$第二次蒙古西征"
mon_news.13.d:0"历史的钟摆在东方再次发生了剧烈的摆动。今日清晨，[Root.GetAdjective]政府通过国家广播电台向全世界发布了一份措辞强硬的《告世界书》，正式宣布终止与西方诸国的一切外交谈判，并即刻启动代号为“长生天之怒”的军事行动\n\n公告中未提及具体的战略目标或终战条件，仅以充满历史隐喻的语言宣告：“七百年前，我们的铁骑曾踏遍欧亚，建立了前所未有的秩序。那段历史并非陈迹，而是预言。今日，草原的雄鹰再次展翅，我们将跨越乌拉尔，饮马伏尔加，直至多瑙河畔。任何阻挡在马蹄前的势力，都将被历史的洪流碾碎。”\n\n据前线情报显示，[Root.GetAdjective]军队已在西部边境完成了史无前例的兵力集结。数以百万计的骑兵、机械化步兵及重装炮兵部队呈扇形展开，后勤补给线如血管般延伸至戈壁深处。不同于以往的局部冲突，此次动员涵盖了全国所有适龄男性，工业体系已全面转入战时轨道，整个国家仿佛变成了一台只为战争而生的巨大机器。\n\n值得注意的是，[Root.GetAdjective]军方在此次行动中展现出一种超越民族主义的狂热意识形态。宣传机器日夜不停地播送着“重建大蒙古世界帝国”的愿景，将西征描绘为“天命所归”的神圣使命。这种狂热的氛围不仅笼罩着军队，也渗透进了社会的每一个角落。\n\n消息传出，举世震惊。莫斯科立即宣布进入最高战备状态，红军远东及西伯利亚军区全线戒备；欧洲各国首都灯火通明，紧急召开国防会议；华盛顿与伦敦纷纷发表声明，谴责这一“对现代文明秩序的公然挑战”，并呼吁国际社会联合应对。\n\n随着第一缕硝烟在边境升起，世界意识到：那个曾经让地球颤抖的古老名字，如今带着现代化的武器与疯狂的野心，再次回来了。"
mon_news.13.a:0"从日出之地到日落之海，皆将成为我们的牧场。"
mon_news.13.b:0"上帝之鞭回归了……"

mon_news.14.t:0"$news_event_background$第二次红巾军起义"
mon_news.14.d:0"历史的幽灵在中原大地上再次显形，一场规模空前的起义在伯雷帖木儿统治下的“大元帝国”腹地全面爆发。起义军头裹红巾，手持步枪，高呼“驱逐胡虏，恢复中华”的古老口号，自称为“第二红巾军”。\n\n这场起义的导火索是伯雷帖木儿政权极度残酷的政治压迫与无休止的经济剥削，终于逼得走投无路的百姓揭竿而起。\n\n与历史上的红巾军不同，这次的起义者展现出了惊人的组织度与现代战术素养。据情报显示，起义军核心骨干中包括了前神州帝国军、国民革命军和红军军官。他们利用地道战、游击战袭扰大元补给线，处决控制区内残暴的蒙古达鲁花赤与汉奸官绅，开仓放粮，引得百万饥民响应。\n\n“伯雷帖木儿以为可以用铁骑踏碎一切，但他忘了，水能载舟，亦能覆舟！”一名起义领袖，前红军军官张伟在广播中激昂陈词，“今日之红巾，非为复一家王朝，乃为求生！我们要建立一个让汉人能像人一样活着的国家！”\n\n大都方面反应迟钝且傲慢。伯雷帖木儿起初认为这不过是“一群流民的骚乱”，仅派遣了少量地方驻军前往镇压。然而，当传回的消息显示整编制的“怯薛军”被愤怒的人海淹没，甚至连装备精良的“黑万字”特务团也在巷战中陷入重围时，大汗才意识到事态的严重性。\n\n目前，起义烽火已呈燎原之势，长江以北多处交通干线被切断，大元帝国的战争机器出现了停摆的迹象。这个依靠恐怖与高压维持的庞大帝国，正面临着自复辟以来最严峻的内部崩塌危机。"
mon_news.14.a:0"我们要用鲜血洗刷这片土地，让叛逆者知道什么是恐惧！"
mon_news.14.b:0"压迫越深，反抗越烈。"
mon_news.14.c:0"驱逐胡虏，恢复中华！"

mon_news.15.t:0"$news_event_background$中国走向军国主义"
mon_news.15.d:0"在刚刚结束的立宪大会上，前红巾军前线总指挥张伟将军，以压倒性票数被推举为新成立的“中华民族共和国”的最高领袖。\n\n张伟在就职演说中并未提及民主重建或经济复苏，而是发表了长达四十分钟的《铁血复兴宣言》。他面色冷峻，身着挂满勋章的深灰色军装，身后是整齐列队的精锐近卫师。\n\n“和平的幻想已经害苦了我们！”张伟的声音通过广播传遍大江南北，“百年的屈辱告诉我们，真理只在射程之内，尊严只在剑锋之上。在这个弱肉强食的世界，唯有绝对的武力才能守护中华民族的生存空间！从今日起，整个国家将是一部为战争而生的机器！”\n\n广场上，数万名青年挥舞着国旗，高呼“大统领万岁”、“华夏至上”。曾经的红巾军旗帜被收起，取而代之的是一种充满侵略性的黑色与赤红交织的新图腾。\n\n观察家指出，张伟的上台标志着中国走上了一条激进的军国主义道路。这个拥有庞大人口和工业潜力的巨人，如今已化身为一只蓄势待发的钢铁猛兽，其獠牙正指向四面八方。"
mon_news.15.a:0"一个危险的军事独裁者在东方诞生了"
mon_news.15.b:0"只有铁与血才能洗刷百年耻辱！"

mon_news.16.t:0"$news_event_background$一个共和新中国"
mon_news.16.d:0"随着伯雷帖木儿暴政的覆灭和第二次红巾军起义的辉煌胜利，神州的天空终于迎来了真正的黎明。在刚刚结束的“全国制宪会议”上，来自各行各业的代表齐聚一堂，共同做出了一个载入史册的决定：废除一切帝制与独裁残余，建立一个民主的共和国。\n\n最令人瞩目的是，大会一致推举满穗——这位曾在红巾军起义中以其卓越的后勤组织能力、人道主义关怀和坚定的民主信念而深受爱戴的女性领袖，担任共和国第一任总统。\n\n满穗身着朴素的青色汉服，胸前佩戴着一枚象征和平与丰收的麦穗徽章，在万众瞩目中走上主席台。她没有华丽的辞藻，只有真挚的话语：\n\n“同胞们，我们推翻了压迫者，不是为了让自己成为新的压迫者。”满穗的声音温和却充满力量，“我们流血牺牲，是为了让每一个孩子都能安心上学，让每一位老人都能老有所养，让每一双勤劳的手都能获得应有的尊严。从今天起，这个国家不再属于任何个人或家族，它属于你们——属于每一位中华儿女！”\n\n台下，掌声雷动，泪水与欢笑交织。人们看到的不再是一个高高在上的“统治者”，而是一位真正来自人民、服务人民的“公仆”。满穗微笑着向人群挥手，那一刻，仿佛整个神州都沐浴在春风之中。\n\n这是一个崭新的开始。一个曾经饱受战乱与专制之苦的古老国度，终于选择了民主与法治的道路，踏上了和平复兴的征程。"
mon_news.16.a:0"一个温和、理性且致力于和平的政权在东方诞生"
mon_news.16.b:0"一个自由、繁荣、和平的新中国！"

mon_news.17.t:0"$news_event_background$远东的白军临时政府"
mon_news.17.d:0"短暂的“蒙古汗国”政权在昨夜戛然而止。随着一声枪响划破库伦的寂静，白俄流亡军官帝弥托利发动了军事政变，成功推翻了自称“大蒙古大汗”的艾黛尔贾特。\n\n“据目击者称，政变发生得迅速而残酷。效忠帝弥托利的部队在深夜与艾黛尔贾特的亲卫队爆发了激烈交火。战斗仅持续了两个小时，艾黛尔贾特被帝弥托利亲手击毙。\n\n清晨，帝弥托利身着旧沙皇时代的军官礼服，胸前挂满勋章，向集结的军队发表演说。他并未宣布重建蒙古帝国，也未恢复神州法统，而是庄严宣告成立“远东白俄军政府”。\n\n“新政权的目标只有一个——莫斯科。\n\n“兄弟们，”帝弥托利在演说中怒吼，“擦干眼泪，擦亮刺刀。我们的家在乌拉尔山那边，不在这里！只要还有一个白俄士兵活着，俄罗斯的三色旗就终将重新飘扬在克里姆林宫上空！”"
mon_news.17.a:0"莫斯科在等待！"
mon_news.17.b:0"又一个流亡政权试图用武力改变版图"
mon_news.17.c:0"白色的毒蛇再次抬起头来！"

mon_news.18.t:0"$news_event_background$远东白军胜利反攻"
mon_news.18.d:0"历史在这一刻发生了不可思议的逆转。远东白俄军政府领袖帝弥托利率领的西征军突破乌拉尔防线后，于今晨完全控制莫斯科市区。随着克里姆林宫守军停止抵抗，苏维埃社会主义共和国联盟正式宣告瓦解。\n上午10时，帝弥托利在红场发表简短声明，宣布废除苏维埃制度，成立俄罗斯临时政府，并自任“护国摄政”。原苏联国旗被降下，取而代之的是代表俄罗斯的三色旗。对于前苏共官员及红军将领，新政府宣布将成立特别法庭进行审判，同时呼吁残余武装力量放下武器投降。\n国际社会对此反应迅速。圣杯等国表示将“密切关注事态发展”，并呼吁新政权保障人权；柏林方面则对苏维埃的崩溃表示“战略关切”。"
mon_news.18.a:0"赤色瘟疫已被铲除，伟大的俄罗斯再次站立！"
mon_news.18.b:0"他们怎么做到的？"



