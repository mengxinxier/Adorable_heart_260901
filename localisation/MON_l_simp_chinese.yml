MON_tongbaozhiqing: "§C同胞之情§!"
MON_tongbaozhiqing_desc: "长生天下没有两片完全相同的叶子，但所有的蒙古人都在同一个节奏下心跳。那些被分割在不同旗分、不同草场的同胞，曾因软弱的旧时代而彼此疏远，甚至在边境两侧冷眼相待。我要撕碎那些由异族划定的界限。告诉每一位牧民，无论他身处大漠南北，他血管里流淌的是与我一样的烈酒。当我们并肩跨上钢铁战马，这种跨越血缘与地域的同胞之情，将凝聚成一股足以摧毁任何城墙的洪流。长生天的子民，理应共享这片大地的荣光。"
MON_zhuiyiwangxirongyao: "§C追忆往昔荣耀§!"
MON_zhuiyiwangxirongyao_desc: "我们的先辈曾以星辰为指南，以整个欧亚大陆为牧场。在那段黄金时代，大汗的信使可以安全地从太平洋沿岸驰骋至多瑙河畔，世界在蒙古的秩序下战栗并繁荣。那不是侵略，那是对混乱文明的重塑，是长生天对这片土地最宏伟的裁决。岁月可以风化碑文，但不能磨灭血脉中的烈火。我要让每一个在这片土地上劳作的人，抬头望向北方时，看到的不仅是荒原，而是那个曾让万邦低头的帝国背影。这种追忆不是为了沉溺于黄沙下的旧梦，而是为了给手中的钢枪镀上不朽的军魂。我们要从历史的灰烬中扒出最烫手的红煤，点燃现代战争的引线。当荣耀不再只是传说，而化作行军时的战歌，大汗的意志将再次无可匹敌。凡先祖马蹄所至，皆为今日帝国之疆。"
MON_shangwujingshen: "§C尚武精神§!"
MON_shangwujingshen_desc: "和平是弱者祈求的幻影，而生存是强者争夺的战果。我不允许我的子民满足于安逸的耕作，我要让他们在握住镰刀时，也能感受到剑柄的纹路。从学堂的操场到工厂的班组，武力将成为衡量尊严的唯一标尺。我们要崇尚那股来自荒原的原始蛮劲，更要将其驯化为现代军队的钢铁纪律。每一个男人都应以披甲为荣，每一个女人都应以育将为傲。当整个国家不再畏惧流血，当战死沙场被视为回归长生天的捷报，我们将变得无坚不摧。"
MON_baodashouzu: "§C报答兽族§!"
MON_baodashouzu_desc: "在南征中原最艰难的时刻，是兽族战士的咆哮撕碎了敌人的方阵，为汗国换来了龙门的钥匙。我不像那些虚伪的旧朝皇帝，过河拆桥、卸磨杀驴。在大汗的字典里，忠诚必须用金子与土地来偿还。我正式宣布，兽族不再是帝国的从属或兵器，而是享有完整荣誉的开国元勋。我们将拨出华北最肥沃的草场作为他们的世袭自治领，并在各大城市建立专属于他们的荣誉军营。每一位负伤的兽族战士都将获得终身年金，他们的幼崽将进入汗国的战神殿受训。"
MON_mengguwenhuafuxing: "§C蒙古文化复兴§!"
MON_mengguwenhuafuxing_desc: "长久以来，草原的文化被讥讽为粗犷，被中原的繁文缛节所掩盖。现在，我要让苏鲁锭不仅插在战壕里，更要刻入每一个子民的识海。我下令在华北的废墟上建立蒙文学宫，让古老的呼麦与现代的工厂轰鸣共奏。我们要重新定义美学：那是力量、纪律与对广袤疆域的无限渴望。摒弃那些让灵魂软弱的靡靡之音，我们要让苍狼白鹿的图腾出现在每一面旗帜、每一台坦克、每一座广播塔上。当一个民族重新记起它曾征服世界的语言，它就再也不会被任何枷锁束缚。这不仅是向过去的致敬，更是为了让新一代的蒙古人明白：我们不是流亡者的残余，而是这片大地唯一的、正统的主人。长生天的文化，必将再次闪耀欧亚。"
MON_wangdaoguixin: "§C王道归心§!"
MON_wangdaoguixin_desc: "我们要让被征服者相信，蒙古的到来不是灾难，而是‘天命’对他们苦难生活的终结。唯有成为他们的‘家长’，才能真正拥有他们的土地。"
MON_yigongdaizhen: "§C以工代赈的帝国引擎§!"
MON_yigongdaizhen_desc: "与其给饥民施舍，不如给他们一份能养家糊口的工作。修筑铁路，建造工厂。"
MON_guanweizhizhu: "§C观微知著§!"
MON_guanweizhizhu_desc: "“作为老师，我得知道哪个学生在课桌下搞小动作。作为君主，你得在火星复燃之前就熄灭它——当然温和的手段优先。”"
MON_buzhanerqurenzhibing: "§C不战而屈人之兵§!"
MON_buzhanerqurenzhibing_desc: "军队每到一处，立即建立学校和医馆，将“征服者”的形象包装成“启蒙者”，当敌人的百姓开始期盼我们的军队时，这场仗你已经赢了。"
MON_tianxiadatong: "§C天下大同§!"
MON_tianxiadatong_desc: "世界征服的终点，不应是一个人的宝座，而是一间让万民共存的教室。当所有人都在学习同一种语言、同一种道理时，战争就失去了意义。"
MON_lirenchuqiao: "§C利刃出鞘§!"
MON_lirenchuqiao_desc: "那些旧军队的习气必须像烂肉一样割掉。帝国的士兵不需要思考，只需要成为子弹。"
MON_junshitongzhi: "§C军事统制§!"
MON_junshitongzhi_desc: "游击队？那是因为他们还觉得逃避有余地。在管辖区内，每一粒粮食的去向都应记录在案。如果地方官无法维持秩序，那就让宪兵去维持地方。"
MON_gangtiexiongxin: "§C钢铁雄心§!"
MON_gangtiexiongxin_desc: "我们需要的是烟囱和高炉。放弃轻工业生产，将举国资源倾斜至钢铁、电力和火炮。把帝国变成一座轰鸣的兵工厂。"
MON_saoqingchihuo: "§C扫清赤祸§!"
MON_saoqingchihuo_desc: "共产主义是我们必须抹杀的瘟疫，尤其是我们需要进攻赤色国家的时候，坚持我们的立场能够吸引更多的合作者。"
MON_silafurendediwei: "§C斯拉夫同胞§!"
MON_silafurendediwei_desc: "俄裔子民乃是与帝国共历严寒、同洒热血的胞泽，其赤诚与功勋卓著，理应承袭更为优渥的帝国恩典。"
