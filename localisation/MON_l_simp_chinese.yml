MON_jujueyuanshiweizhao: "拒绝袁氏伪诏"
MON_jujueyuanshiweizhao_desc: "袁克定挟持天子于北京，妄图以伪命笼络四方。我们定要誓师靖难，清君侧之奸，迎天子归朝。"
MON_beijiangyouguzhong: "北疆有孤忠"
MON_beijiangyouguzhong_desc: "安北都司虽远镇绝域，然忠魂未改，心唯朝廷。袁克定窃据神器，挟天子以令诸侯，其篡逆之行神人共愤。今我等已举义旗，必诛国贼以迎圣驾还朝。"
MON_wendingneibu: "稳定内部"
MON_wendingneibu_desc: "草原诸部虽已归心，但新旧势力交织，人心未定。在挥师南下之前，我必须先肃清内部的动摇分子，整合各部兵权，确立统一的号令。唯有后方稳固如铁，方能无后顾之忧，全力投入这场讨逆靖难之战。"
MON_jidianyunanzhe: "祭奠遇难者"
MON_jidianyunanzhe_desc: "袁克定之流，不仅窃国，更屠戮志士。那些革新同盟的英魂，不该在黑暗中无声消逝。我要在北疆最辽阔的草场上，为他们举行一场盛大的追悼会。让风带走哀思，让火照亮英名。这不仅是为了告慰亡灵，更是为了告诉所有人：袁氏欠下的血债，必将用他的江山来偿还；幸存者的每一步前行，都踩着先烈未竟的遗志。"
MON_qingnianjunguantuan: "青年军官团"
MON_qingnianjunguantuan_desc: "旧时代的军阀习气与部落陋规，已不足以支撑这场救国图存的伟业。我们需要新鲜的血液，需要一群眼中燃烧着理想之火、心中装着家国天下的青年军官。他们不应是唯利是图的武夫，而应是懂得为何而战、为谁而战的先锋。"
MON_junxinkeding: "军心可定"
MON_junxinkeding_desc: "大军未动，粮草先行；利剑出鞘，必先固其柄。面对袁克定的糖衣炮弹与流言蜚语，军中难免有动摇之声。此刻，必须雷厉风行：一方面严惩通敌叛变之徒，以正军法；另一方面，我要亲自走入营帐，与士卒同甘共苦，宣讲“清君侧、救天子、开宪政”的大义，让每一位将士都明白，我们并非在为某一家一姓而战，而是为了这片土地的公理与未来。唯有上下同欲，令行禁止，方能铸就一支摧不垮、打不烂的铁血雄师，让军心如北疆冻土般坚不可摧。"
MON_caoyuanrenxinqi: "草原人心齐"
MON_caoyuanrenxinqi_desc: "草原广袤，部族林立，分散的部落唯有死路一条。此刻，我必须放下过往的恩怨，以“共存亡”的大义召集各部首领。无论是古老的王公贵族，还是新兴的部落勇士，都需明白：唇亡则齿寒，皮之不存毛将焉附。我们要将散沙聚成铁塔，让各部的骏马汇成洪流。"
MON_yanshubafang: "雁书八方"
MON_yanshubafang_desc: "独木难支大厦，孤军难破重围。此刻，我必须修书四方，互通声气，互为犄角，织成一张天罗地网。"
MON_wayuanqiangjiao: "挖袁克定的墙脚"
MON_wayuanqiangjiao_desc: "明枪易躲，暗箭难防。与其在正面战场硬碰硬，不如将战线延伸至敌人心脏。从切断粮道到伪造军令，从散布谣言到策动兵变，要让袁克定陷入“人人自危、个个猜忌”的泥潭。当他的指挥链在内部腐蚀中断裂，当他的亲信在深夜倒戈相向，那便是我们总攻之时。"
MON_gongyedadongyuan: "工业大动员"
MON_gongyedadongyuan_desc: "仅靠传统的作坊与旧式的工厂，无法支撑起一场决定国运的战争。面对袁克定庞大的军事机器，我们必须将每一寸土地、每一吨煤炭、每一双勤劳的手都转化为战争的燃料。"
MON_bianjingjieyan: "边境戒严"
MON_bianjingjieyan_desc: "我们将增设哨所，拉起铁丝网，部署巡逻队日夜巡弋，让任何试图越境的间谍与叛徒无处遁形。"
MON_jingtijiaojuzhe: "警惕搅局者"
MON_jingtijiaojuzhe_desc: "袁克定固然是我们必须铲除的心腹大患，但在这乱世棋局中，绝非只有这一路豺狼。南方的革命党人和东瀛樱花国更是野心勃勃，视我北疆为囊中之物。因此，我们在集中兵力南征的同时，必须构筑双重防线：对革命党，既要保持统战姿态，又要严守防区，划定红线，防止其势力无序渗透；对樱花国，须严阵以待，以强硬姿态震慑觊觎之心，绝不允许外寇借机染指寸土。"
MON_jiqichuzheng: "祭旗出征"
MON_jiqichuzheng_desc: "袁克定窃据神器，倒行逆施，其种种倒戈行径，已使山河破碎，民不聊生。今日，我们不再退让，不再观望，正式向袁氏伪政权宣战！我们将以雷霆万钧之势，横扫一切阻碍，直捣黄龙。全军上下，务必铭记：此战必胜，此贼必除！"
MON_jindianxianfu: "金殿献俘"
MON_jindianxianfu_desc: "袁氏伪王已灰飞烟灭，胜利的曙光已照亮破碎的山河。然而，推翻暴政仅仅是第一步，真正的挑战在于如何在这片废墟之上，重建一个稳固、统一的的神州。"
MON_shenzhouzaiyitong: "神州再一统"
MON_shenzhouzaiyitong_desc: "历史的车轮滚滚向前，分裂的乱世终将落幕。"
MON_boerzhijintaishi: "孛儿只斤太师"
MON_boerzhijintaishi_desc: ""
MON_shezhengxiangang: "《摄政宪纲》"
MON_shezhengxiangang_desc: "国本初定，然百废待兴，民心未稳。值此新旧交替之关键节点，若骤然施行完备宪政，恐因各方势力博弈未平、法理基础未固而致政局动荡。故在正式宪法颁布之前，特颁行《摄政宪纲》作为临时最高法度。我们要以此纲为约，上下一心，在摄政王的带领下，恢复经济，培育民智，为最终实现真正的民主宪政铺平道路。"
MON_wufeiwangmang: "吾乃周公而非王莽"
MON_wufeiwangmang_desc: "历史是一面镜子，照得见忠奸，分得清真伪。我们不需要通过黄袍加身来证明伟大，真正的伟大在于能在巅峰时急流勇退，将完整的江山交还给人民。让时间来见证吧：当别烈思卸下摄政重担、转身融入人海的那一刻，便是“周公之志”最有力的证词。"
MON_jienaqiangemingzhe: "接纳前革命者"
MON_jienaqiangemingzhe_desc: "水能载舟，亦能覆舟。堵不如疏，化敌为友，方为上策。昔日革命者可为今日建设者，只要心系神州，皆可成为帝国复兴的栋梁。"
MON_kaifangwaijiaozhengce: "开放外交政策"
MON_kaifangwaijiaozhengce_desc: "开放非投降，合作非依附。是为学习先进、发展自身，绝非重蹈半殖民地之覆辙。今日之开放，是为明日之强大；今日之包容，是为未来之荣光。"
MON_lingtingrenminzhisheng: "聆听人民之声"
MON_lingtingrenminzhisheng_desc: "神州之根基，在于万民。别烈思深知，朝堂之高，易隔民间疾苦；宫墙之深，难闻百姓心声。故颁此国策：广开言路，聆听民声。自今往后，设立"民情司"，专收民间奏疏，无论士农工商，皆可上书言事。地方官员须定期下乡走访，体察民情，不得阻塞言路。重大国策颁布前，须征询民意，让百姓知晓、参与、监督。"
MON_boluanfanzheng: "黄袍加身"
MON_boluanfanzheng_desc: "你们这是害苦了我啊！"
MON_kaiqihanhuagaige: "我早就是一个汉人了"
MON_kaiqihanhuagaige_desc: "朕虽出自黄金家族，血脉流淌着草原的荣光，然朕生于神州，长于神州，读的是孔孟之书，行的是华夏之礼，心系的是亿万汉家百姓。有人质疑朕之出身，妄言异族不可主中原，此乃狭隘之见，自绝于天下。朕常言："我早就是一个汉人了。"非是忘本，而是认同。何为汉人？非唯血脉论，乃文化所化、民心所向也。朕推行汉法，尊崇儒术，保护华夏文明，此非汉人而何？"
MON_xungenzhilv: "寻根之旅"
MON_xungenzhilv_desc: "朕虽承黄金家族之名，然心向华夏久矣。今颁此国策，命学者考据源流，证黄金家族实出华夏支脉。朕深信，草原与中原自古互通，血脉本同源。朕要让天下知晓，皇室与百姓血脉相连，文化相通。朕之心，早已与这方土地融为一体。血脉或有异，人心终归一。"
MON_jibaimingtaizu: "祭拜明太祖"
MON_jibaimingtaizu_desc: "虽朕承大元法统，然今既认汉祖刘邦为宗，便不拘泥于蒙汉之防。朱元璋起于布衣，驱除蒙元，复汉家衣冠，其治国之道实为帝王之范。朕此举意在昭示：朝廷不以民族划界，唯以治绩论英雄。祭拜明太祖非否定先祖，而是取法明君之长，消弭历史积怨。帝王之道在于爱民，不在血统门户。"
MON_longdechuanren: "龙的传人"
MON_longdechuanren_desc: "汉人奉龙为图腾，蒙古人尊苍狼白鹿，然追溯本源，华夏诸族皆出三皇五帝之脉。匈奴、鲜卑、契丹、女真，乃至蒙古，皆与汉人同宗共祖，皆为龙之传人。"
MON_tesheshenzhoujiangling: "召回神州将领"
MON_tesheshenzhoujiangling_desc: "彼时袁克定挟持天子，把持朝政，以朝廷名义号令诸军。各将帅皆受军令节制，不得不俯首听命，非其本心向背，实乃形势所迫。如今袁氏倒台，若对昔日旧将一概清算，恐寒天下将士之心，亦不利于军心稳定。经朝议决定，颁布《赦贤诏》：凡神州旧将，虽曾效力袁氏政权，只要愿痛改前非，皆可官复原职，既往不咎。"
MON_jichengtuotuolixiang: "继承脱脱理想"
MON_jichengtuotuolixiang_desc: "前元末年，权相伯颜专权，朝纲崩坏，汉法废弛，天下离心。至正年间，脱脱丞相临危受命，行“更化”之政：复科举以收士心，修宋辽金三史以正统绪，治黄河以安民生，颁新格以肃吏治。然天命不佑，奸佞构陷，脱脱最终流放致死，其改革半途而废，大元亦随之倾覆，后世史家无不叹曰：“脱脱不死，元或不亡。”如今大元重建，旧弊犹存，新患未起。朝野上下共识：欲保江山永固，必行彻底变革。昔日脱脱未竟之业——整顿吏治、融合诸族、革新军制、兴修水利，今日正当拾起。"
MON_xuexixiaowendi: "学习孝文帝精神"
MON_xuexixiaowendi_desc: "回望历史，北魏孝文帝拓跋宏曾面临困境：一个由北方部族建立的政权，如何在一个文明高度发达的汉地长久立足？孝文帝给出的答案是彻底的“汉化”。他力排众议，迁都洛阳，改穿汉服，禁用鲜卑语，鼓励胡汉通婚，将部落贵族转化为士族门阀。这一系列雷霆手段，虽在当时激起保守势力的剧烈反弹，却成功消除了族群隔阂，使北魏从“征服王朝”转型为“正统帝国”，为后来的隋唐大一统奠定了坚实的文化与制度基础。前元之所以速亡，皆因未能彻底解决“蒙汉二元”的体制矛盾，始终视汉地为牧场，视汉民为异类，终致天下共弃。如今大元重光，若要避免重蹈覆辙，必须效法孝文帝之魄力。"
MON_dayuanxianfa: "新宪法"
MON_dayuanxianfa_desc: "自库伦举义以来，安北都司之所以能聚五族之力、汇八方之才，非仅凭兵锋之利，更因高举“宪政救国”之旗。黎星刻等殉道者以血浇灌的理想，康佑薇等志士以命守护的誓言，皆系于此。如今，旧秩序已破，新大厦将立。由“神州制宪会议”历经三月激辩，终于敲定《帝国宪法》。这不仅标志着一个专制时代的终结，更意味着神州大地终于摸索出了一条超越王朝循环、通往现代法治国家的道路。从此，神州不再是一家一姓之私产，而是万民共有之家园。"
MON_baoliudifangxingzheng: "保留地方行政人员"
MON_baoliudifangxingzheng_desc: "神州大地虽已光复，却面临着比战争更严峻的治理危机。旧有的官僚体系瘫痪，若贸然将所有曾在袁氏麾下或军阀治下任职的地方官、公务员一概罢免甚至处决，必将导致行政真空，民生凋敝，甚至逼反那些本可争取的中间力量，让刚刚止血的国土再次陷入混乱。我们应确立“首恶必办，胁从不问，留用贤能”的务实方针。通过甄别筛选，那些无大血债且具备治理才能的中下层官员被予以留任，在新的监督机制下戴罪立功。"
MON_qiangzhihanyuxuexi: "推行国语官制"
MON_qiangzhihanyuxuexi_desc: "书同文，车同轨，此乃大一统之基石。若朝堂之上，蒙汉杂语，政令难通；公文往来，译注繁复，则效率何存？信任何立？自今日起，神州官场只有一种声音——汉语。非通国语者，不得食禄；非精汉文者，不得治民。"
MON_fangkuancanjunxianzhi: "放宽参军限制"
MON_fangkuancanjunxianzhi_desc: "在军营中，民族不限，信仰自由，唯一的晋升标准是战功与能力。来自不同地域、不同民族的士兵在同一个战壕里分食干粮，在每一次冲锋中把后背交给彼此。他们不再是为了“大帅”或“皇帝”个人的荣耀而战，而是为了守护身后那个包含了所有民族的“家园”。"
MON_duiqianyuangaiguandinglun: "新修《元史》"
MON_duiqianyuangaiguandinglun_desc: "明朝所修《元史》仓促成书，译名混乱、史实错漏，严重扭曲了历史真相。新修《元史》旨在正本清源，还原各族共筑中华的实录。更关键的是，此举绝非歌功颂德，而是直面前元吏治腐败、滥发纸币及民族压迫等致命过错。通过将“亡国之因”载入正史，新政权以史为鉴，宣示摒弃旧制毒瘤的决心。这不仅是学术纠偏，更是确立“继承格局、斩断腐朽”的政治基石，警示后世永不再蹈覆辙。"
MON_wanminzhitianxia: "万民之天下"
MON_wanminzhitianxia_desc: "旧时代的秩序建立在森严的等级之上：王公贵族高高在上，视百姓如草芥，血统决定命运。这种将人分为三六九等的制度，是历朝历代覆灭的根源，也是文明进步的枷锁。华夏大地不应是谁家的私产，而是全体国民共同的契约。无论出身贵族还是平民，在法律面前一律平等。国家的力量不再源于少数人的威权，而源于万万民众觉醒后的合力。"
MON_huifujingji: "恢复经济"
MON_huifujingji_desc: "历经多年战乱与分裂，山河虽已重归一统，但满目疮痍。田野荒芜，商路断绝，昔日繁华的市镇只剩断壁残垣，百姓在饥寒交迫中挣扎求生。战争不仅摧毁了物质财富，更打断了正常的生产循环，货币体系崩溃，物资流通停滞。国家的首要任务必须转向“休养生息”，废除战时苛捐杂税，发放农具种子鼓励垦荒，修复受损的水利与道路以疏通物流，并重建信用货币体系以激活市场交易。唯有经济复苏，统一的国家才能真正凝聚人心。"
MON_nongmindezhichi: "农民的支持"
MON_nongmindezhichi_desc: "在这个国度，农民占据了人口的绝大多数。他们不仅是粮食的生产者，更是国家稳定的压舱石。过往的动荡中，正是农民承受了最沉重的赋税与兵役，他们的忍耐支撑了战争的底线，他们的渴望决定了政权的未来。若忽视了这片土地上最沉默的大多数，任何宏伟的蓝图都将是空中楼阁。我们将把政策的天平坚决向农村倾斜——确立“耕者有其田”，严厉打击豪强兼并；大幅减免农业赋税，让利于民；兴修水利，推广良种，以国家力量护航农业生产。"
MON_qingxijiduanminzuzhuyi: "清洗极端民族主义者"
MON_qingxijiduanminzuzhuyi_desc: "一部分极端分子固守“非我族类，其心必异”的腐朽教条，煽动族群仇恨，破坏平等基石。他们或是妄图恢复旧特权的遗老，或是鼓吹单一民族至上、排斥异己的狂徒。这种极端的民族主义，是撕裂社会的利刃，是将国家重新推向内战深渊的祸源。我们将依法取缔一切基于血统、宗教或地域的歧视性组织，逮捕并审判煽动仇恨、策划暴乱的为首者。这绝非针对任何特定民族，而是针对“分裂”这一思想病毒本身。无论出身何族，凡是以民族名义行压迫、排挤之实者，皆为国家之敌。"
MON_jiaohuayidi: "教化边疆夷狄"
MON_jiaohuayidi_desc: "边疆非化外之地，夷狄非不可教之民。朝廷于漠北、西域、满洲广立书院，以汉文为通用之语，以儒家经典为必修之课。政策核心在于"渐进同化"——不废各族语言习俗，但官学必授汉文。此为长远之计。一代学汉文，二代读汉书，三代忘本语。百年之后，漠南漠北皆诵孔孟，西域满洲尽行华夏礼。非强制改姓易服，而以文化浸润，使各族自愿归心。"
MON_zongjielichaojiaoxun: "总结历朝教训"
MON_zongjielichaojiaoxun_desc: "翻开五千年的史册，王朝的更迭如同走马灯般上演。从秦朝的严刑峻法到汉末的豪强兼并，从唐末的藩镇割据到宋朝的重文轻武，再到明末的腐败横行和元清的民族隔阂。历代兴亡虽表象各异，其内核却惊人地相似：土地兼并导致民不聊生，特权阶层固化阻断上升通道，皇权专制下的腐败如毒瘤般侵蚀国力，最终在“黄宗羲定律”的怪圈中，因一场天灾或外患而轰然崩塌。我们绝不能重蹈覆辙，让新生的政权成为历史周期律中的又一个短暂注脚。我们要用前人的鲜血浇灌出制度的理性之花，向世人宣告：这个新政权，有能力跳出“其兴也勃焉，其亡也忽焉”的历史宿命，开创万世太平的基业。"
MON_shengshiyuzhishi: "盛世与治世"
MON_shengshiyuzhishi_desc: "历代之兴衰、本朝之过往，无外乎潮起潮落。盛业与中落、亡国与新天，皆归由命数所定。纵如此，尽心竭力、兴邦安国，仍是本朝之责任所在。"

