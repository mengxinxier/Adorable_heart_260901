MON_route_guide_desc: "§Y蒙古§!路线指南：\n一、§C蒙古帝国§!路线§L§!\n-1.静待§R帝国崩溃§!。\n-2.在事件“§Y总督衙门外的抗议§!”中选择“§Y开火§!”\n-3.在事件“§Y草原暴动§!”中选择求助白军。\n\n二、§G自由草原§!路线§L§!\n-1.在事件“§Y草原暴动§!”中不求助白军。\n-2.起义成功后选举草原长，喜羊羊为蓝线，兔子为红线，灰太狼为黑线。喜羊羊和兔子可以选择入关建立共和国，喜羊羊和灰太狼可以选择重建神州帝国并成为太师，灰太狼可以成立群狼帝国。\n\n三、§O黑线大元（蒙古化大元）§!路线§L§!\n-1.如果草原长选举陷入僵局孛儿只斤·伯雷帖木儿就会政变。\n-2.统一中国后可以选择扩张路线和维稳路线，如果镇压汉人抵抗失败就会爆发第二红巾军起义。\n\n四、§g灰线大元（汉化大元）§!路线§L§!\n-1.必须在路线设置中设置神州帝国走袁克定线。\n-2.在事件“§Y总督衙门外的抗议§!”中选择“§Y谈判§!”，安北都司就会保住。\n-3.袁克定上台后选择让孛儿只斤·别烈思反袁。\n-4.在统一中国之前让总督威望达到最大等级，才能黄袍加身，否则就是成为神州帝国太师。\n\n五、§G白军§!路线§L§!\n-1.艾黛尔贾特线在“蒙古，还是俄罗斯？”事件中选择“箭在弦上，不得不发”。\n\n六、§R第二红巾军§!路线§L§!\n-1.让伯雷帖木儿统一全国。\n-2.让汉人抵抗达到最大等级。\n-3.扮演第二红巾军打赢内战。\n-4.通过国策选择张伟的军政府或满穗的民主政府。\n\n§Y游玩提示§!：\n§L1.装备不够可以试着拉骨王的关系然后要租借。§!\n\n"
