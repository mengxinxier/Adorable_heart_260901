MON_xyy:0 "喜羊羊"
MON_xyy_desc:0 "在安北都司那片被严寒与铁律笼罩的荒原上，喜羊羊是一个异类。作为羊族百年一遇的天才，对他而言，故乡草原不应只是帝国的兵源地或马场，而应该是一个人人平等、科学昌明的自由家园。\n自北京大学学成归来的喜羊羊拒绝了都指挥使琳迪斯抛出的高官厚禄。他在那间堆满报纸与精密仪器的实验室里，他不仅研究如何改良水源，更在暗中传播着足以点燃草原的“禁书”。他与灰太狼等强硬派军官始终保持着一种微妙而紧张的距离——他既厌恶对方那套“草原利益至上”的军国主义思维，又不得不承认在对抗贪婪的帝国税吏时，他们需要彼此的盾牌。\n如今的喜羊羊已成为草原上民主主义团体的灵魂人物。他奔走于羊村与各个部落之间，用那充满煽动性却又不失逻辑的演讲，将自由的种子播撒在每一个受压迫的灵魂心中。他深知，在未来的乱世中，他将不得不面对曾经的同僚、暴虐的野心家以及旧帝国的残余。但他依然握紧了手中的怀表，在那精准的刻度中，他正倒数着旧时代覆灭的最后时刻。"
MON_beileite:0 "孛儿只斤·伯雷帖木儿"
MON_beileite_desc:0 "“§Y——成吉思汗的子孙不应在大地的边缘卑微苟活。我要将失去的冠冕从南方的灰烬中拾起，让大元的龙旗再次遮蔽中原的烈日。§!”\n\n作为成吉思汗的直系后裔，孛儿只斤·伯雷帖木儿自诞生起便背负着“黄金家族”沉重而辉煌的血脉。在神州帝国尚在维持表面统一的时期，他曾与胞妹别烈思一同在安北都司的边军中担任军官。然而，在那身帝国军装之下，他日夜幻想着重整乾坤，恢复大元帝国当年的绝世荣光。伯雷帖木儿深知，仅靠血统无法在现代战争中立足。他加入了效仿纳粹党组建的蒙古极端民族主义组织——“黑万字”。凭借其无可争议的正统身份与雷霆般的政治手段，他迅速在组织内建立起绝对的个人崇拜，并将其改造为一支拥有钢铁纪律的政治野兽,成为“黑万字”事实上的领袖。\n通过肃清内部平庸者并整合草原各部，伯雷帖木儿夺取了蒙古的最高领导权。他并未满足于在荒凉的北境称王，而是将目光锁定了曾经的帝都北京。对他而言，唯有南下征服中原，将神州大地重新纳入黄金家族的版图，才算真正完成了复兴大元的宿命轮回。"
