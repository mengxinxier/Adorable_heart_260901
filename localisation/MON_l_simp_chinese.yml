MON_manyangyang2:0 "慢羊羊"
MON_baobaodaren:0 "包包大人"
MON_lindisi:0 "琳迪斯"
MON_lindisi_desc:0 "作为诞生在大兴安岭以西、万年冰山融雪滋润下的部族首领之女，琳迪斯的生命脉络本应与呼伦贝尔的草场紧紧缠绕，但在时代的洪流中，她却选择了一条背离传统毡帐的道路。早年求学于北京神州士官学校的经历，让她在领略汉文化博大精深的同时，也磨炼成了神州帝国最坚定的忠臣，最终受命出任安北都司都指挥使，承担起在这片古老草原上维持帝国秩序的重任。\n回到故乡后，琳迪斯始终在多方势力的夹缝中艰难斡旋，尽管琳迪斯一心想调和汉人与蒙古人、人族与兽族之间跨越百年的隔阂与矛盾，但在帝国整体衰微的大背景下，她愈发感到心有余而力不足。都司境内的帝国边军腐败透顶，部分军官甚至私下与匪帮勾结交易，令她不得不转而默许黑猫警长的警备队与游侠虹猫合作打击罪恶。与此同时，她还不得不遵照朝廷密令，严密监视驻扎在杭爱山间的俄国流亡白军。随着朝廷为镇压各地革命而下令加征新税，看着税吏们被愤怒的羊村村民和狼族战士打得头破血流地逃回都督府，这位神州忠臣深知，自己守护的不仅是帝国的疆土，更是一场随时可能在动乱中熄灭的残梦。"
MON_ai:0 "艾黛尔贾特·冯·弗雷斯贝尔古"
MON_ai_desc:0 "作为流亡白卫军领袖伊欧尼亚斯将军的女儿，艾黛尔贾特的童年并未在圣彼得堡的冬宫度过，而是在逃亡的颠沛流离中，跟随父亲的残部撤退到了蒙古的杭爱山间。俄罗斯帝国的轰然倒塌给了她极大的震撼，在荒凉而广袤的草原上，她并未像父亲那样终日沉溺于反攻莫斯科的幻梦，而是被这片土地古老的征服史所深深吸引。通过对蒙古帝国辉煌历史的钻研，她得出了一套冷酷的结论：罗曼诺夫王朝的失败源于秩序的僵化，而草原游牧民族那种极具扩张性的军事民主与现代工业力量的结合，才是重塑世界的真理。这种极度的认同感让她蜕变成了一名狂热的“精神蒙古人”。\n她极具政治手腕与野心，一方面与帝弥托利等传统的俄国军官维持着脆弱的合作，另一方面则在暗中窥视着神州帝国的虚弱，计划在秩序崩溃的一瞬夺取政权。她计划以铁腕推行这场复古式的全球征服。对于艾黛尔贾特而言，无论是血脉还是国籍皆可抛弃，她唯一的夙愿便是让蒙古帝国的铁蹄再次踏碎从东海到多瑙河的所有藩篱。"
MON_yonys:0 "伊欧尼亚斯·冯·弗雷斯贝尔古"
MON_dimituoli:0 "帝弥托利·亚历山大·布雷达德"
MON_dimituoli_desc2:0 "作为流亡白卫军中另一位举足轻重的领袖，帝弥托利从未真正认同过艾黛尔贾特那套虚无缥缈的成吉思汗之梦。他是一名骨子里浸透了旧时代骄傲的传统沙俄军官，始终坚守着贵族信条，并对基辅政权那种向西方妥协的姿态嗤之以鼻。在杭爱山流亡的苦难岁月中，他曾因清剿所谓“布尔什维克特务”而率军洗劫蒙古村落，却在冲突中被游侠虹猫开枪射瞎了一只眼。这一重创不仅没有击垮他，反而激发了他血液中近乎疯狂的戾气。在艾黛尔贾特自命为蒙古大汗并征服中国北部后，帝弥托利与她之间的矛盾终于激化到了不可调和的地步。在伊欧尼亚斯将军临终前曾嘱咐他辅佐艾黛尔贾特并纠正其愚蠢行为的遗命下，帝弥托利发动了雷霆般的政变。他以“山猪”般的蛮力与冷酷，亲手终结了那位“成吉思汗继承人”的狂想。如今，帝弥托利已经掌控了中国那庞大的人口与资源，这些在他眼中不再是需要治理的国土，而是支撑他反攻俄罗斯故乡的庞大军械库，这位独眼的贵族军官愈发充满了胜算。他正目光炯炯地凝视着北方那片终年积雪的冻土，准备引领这支在东亚废墟上重组的钢铁雄狮，去夺回那原本属于他们的、被内战撕裂的故国荣光。"
MON_heidashuai:0 "黑大帅"
MON_tuzi:0 "兔子"
MON_tuzi_desc:0 "在安北都司那广袤而严酷的阶级版图中，兔子是一个让总督府头疼、让底层牧民热泪盈眶的名字。他既不是出身显赫的黄金家族，也不是手握兵权的流亡将领，他代表的是那群在满清遗毒、帝国杂税与军阀混战中挣扎求生的最广大基层——劳工与赤贫牧民。\n早年间，他曾作为神州帝国的苦力，在华北的修路工地和长三角的码头间辗转，亲眼目睹了旧世界的腐朽与不公。受中国共产党的感召，他带着那套“咱们穷人要翻身”的朴素道理回到了家乡草原。此时的他，已经从一个普通的兽族平民蜕变为一名成熟的理想主义革命家。他总是戴着那顶标志性的解放帽，揣着一本被翻烂了的红色小册子，操着一口标志性的“亲”式口吻，游走于草原的毡帐与矿场的工棚之间。\n他与喜羊羊的“温和改良”不同，他更相信“手里有真理，脚下有力量”。他组织牧民抗捐抗税，秘密建立赤卫队，在黑猫警长睁一只眼闭一只眼的默许下，与游侠虹猫合作多次伏击掠夺民众的匪帮。面对伯雷帖木儿那种试图复辟旧贵族统治的“黑万字”，兔子嗤之以鼻：“亲，都什么年代了，还玩大元那一套？咱们草原读过书的羊和有力气的狼，都不会答应！”\n对于兔子来说，最高的目标不是重建任何人的帝国，而是要在这片万年冰山滋润的土地上，建立一个属于劳动者自己的、人人有饭吃、人人有衣穿的“种花家”。"
MON_beileisi:0 "孛儿只斤·别烈思"
MON_beileisi_desc:0 "“§Y——血脉给了一个人姓氏，但唯有理想能给一个人灵魂。我不为成吉思汗的幻影而战，我为神州四万万生灵的自由而战。§!”\n\n作为成吉思汗的直系后裔，孛儿只斤·别烈思虽然流淌着黄金家族的血液，却从未被那层沉重的游牧枷锁所束缚。在神州士官学校留学期间，她展现出了对汉文化近乎痴迷的憧憬与热爱。她不仅精通汉语诗书，更深深沉醉于从西方传入并由汉族知识分子改良的启蒙思想与宪政逻辑中。在校期间，她极力学习汉人的生活习惯，坚持练习工整的行楷书法，日常交往中也严谨地遵循汉式的儒家礼节，身边的师生早已习惯称呼这位温文尔雅、谈吐不凡的蒙古格格为“草原上的女学士”。\n在那段意气风发的岁月里，别烈思与黎星刻等进步青年结下了深厚的革命友谊。他们常在深夜的灯火下，饮着清茶，热烈地讨论着如何将这个暮气沉沉的帝国改造为一个民主、法治、各族平等的现代宪政国家。学成归来后，别烈思在安北都司担任军官，负责调训兽族与人类的混合部队。她试图在军中推行文明礼仪与法治教育，但这却让她与一心复辟大元铁血统治的哥哥伯雷帖木儿冲突不断。在哥哥眼中，别烈思是一个“数典忘祖、自甘汉化”的叛徒；而在别烈思看来，哥哥则是试图将草原拉回蒙昧杀戮时代的罪人。\n然而，神州帝国的政局却向着最黑暗的深渊坠落。奸臣袁克定发动政变，挟持幼主，公然践踏法治，黎星刻所领导的“革新同盟”惨遭血腥屠戮。当噩耗传回草原，得知那些曾与她共同探讨文明未来的挚友们血染刑场时，这位平日里温文尔雅、满腹经纶的女将，毅然举起了“靖难”大旗，誓要用手中的剑在这片乱世中劈开阴霾，还天下一个她与挚友们梦寐以求的朗朗乾坤。"
