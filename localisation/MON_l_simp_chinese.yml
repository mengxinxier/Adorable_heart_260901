MON_mengguzhixiadeheping: "蒙古治下的和平"
MON_mengguzhixiadeheping_desc: "传说，从前在大汗的统治之下，一个女人可以毫无畏惧地顶着一个金块从帝国的一头走到另一头。我们必须在全境重建这样的和平盛景。"

MON_focus_Hearts_of_Celestial_Empire: "天朝雄心"
MON_focus_Hearts_of_Celestial_Empire_desc: "我天朝上国，自古便是东亚地区的霸主，但自近代以来，却屡受列强欺辱，频遭割剐，曾经的朝贡体系业已完全崩溃，霸主地位荡然无存，现如今我们要[FROM.Getname]既已重返世界舞台，便要重拾往日的雄心，向世界证明我们霸主的地位"
MON_focus_XiXueDongJian: "跟随盟友"
MON_focus_XiXueDongJian_desc: "神州帝国已经离开世界舞台中心太久了，现在的国际形势已经不允许[FROM.Getname]再孤身立于世界之上，我们需要在如今的列强之中寻找盟友，并且紧跟盟友的脚步，这样才能适应这个时代"
MON_focus_unforgettable_Former_territory: "故土难忘"
MON_focus_unforgettable_Former_territory_desc: "自维新失败以来，神州帝国屡遭割剐，无数故土落入他国手中，多少年来，神州人都难忘那一片片故土和其上受难的同胞，过去的我们弱小，因而只能把这份苦痛深埋心底，但如今[FROM.Getname]既已复兴，我们便要重提对那些故土的主张"
MON_focus_avenge_humiliation_of_north: "雪耻北疆"
MON_focus_avenge_humiliation_of_north_desc: "忆往昔，XX草草，封狼居胥，赢得仓皇北顾，神州自此再无可堪一用之中央军，此番神州再兴，当兴兵北伐，一雪前耻，光复故土，扬我国威"
MON_focus_into_europa: "进军欧陆"
MON_focus_into_europa_desc: "在苏联倒下之后，通往欧洲的门户已然洞开，现在是时候让那些欧洲人品尝一下神州过去所承受过的屈辱了，这些苦难我们要一丝不剩的奉还给他们"
MON_focus_Protection_south: "保护帝国南疆"
MON_focus_Protection_south_desc: "曾经的罗马帝国用一种十分有效的方式保护他们的边疆：扩张出新的边疆，这样旧的边疆便成了内部，[FROM.Getname]可以学习这一做法，为了保护帝国的南部疆界，利剑向南是必经之选"
MON_focus_reopen_silk_road: "再通丝路"
MON_focus_reopen_silk_road_desc: "丝绸之路是神州历史上宝贵的贸易通路，但随着西方的大航海和旧丝路的政权更迭，丝绸之路几近停摆，而今[FROM.Getname]想要扩张自己的经济影响力，重新打通丝路是必要手段"
MON_focus_Conquer_middle_east: "征服中东"
MON_focus_Conquer_middle_east_desc: "为了稳定新开辟的丝绸之路不受中东地区不稳定政权的袭扰，我们需要派出军队武力征服中东，在中东地区建立起稳定的秩序"
MON_focus_Free_korea: "解放朝鲜"
MON_focus_Free_korea_desc: "朝鲜一直以来都是我们中央帝国的附属，旧日的背叛不能容忍，卧榻之侧，岂容他人鼾睡，[FROM.Getname]的军队必须解放朝鲜，重置汉四郡，让朝鲜重归[FROM.Getname]控制之下"
MON_focus_Conquer_Japan: "东征瀛洲"
MON_focus_Conquer_Japan_desc: "旧日的仇恨如芒在背，让每个神州人都饱含苦痛和愤恨，东瀛地区本就是神州的拥簇，却对神州帝国刀剑相向，[FROM.Getname]无法容忍这种悖逆和冒犯，[FROM.Getname]中央政府的威权将随着我们的军队一同再次踏上那片土地"
MON_focus_back_New_Continent: "重返新大陆"
MON_focus_back_New_Continent_desc: "随着明末大乱局中原政权丢失了对北美殖民地的控制，但这抹消不了北美西海岸与神州大地同文同种，血脉相连的事实，我们将要重新掌控新大陆这片富饶之土，让这些神州子民重归王化"
MON_focus_go_south_sea: "下南洋"
MON_focus_go_south_sea_desc: "富庶的南洋曾经满是神州帝国的朝贡之臣，但随着西方殖民者的到来和天朝朝贡体系的完全崩溃，神州完全失去了对南洋的掌控，旧日的兰芳也随之解体，但复兴的神州已经无法容忍西方殖民者在南阳的存在，水师即将南下平洋，将那些殖民者一个不剩的驱逐出去"
MON_focus_Protecting_maritime_trade: "保护海上贸易"
MON_focus_Protecting_maritime_trade_desc: "[FROM.Getname]的海上贸易仍然受到威胁，为了保护我国的贸易路线，有必要武力开通一条安全的通路出来"
MON_focus_get_South_Continent: "摄取南方大陆"
MON_focus_get_South_Continent_desc: "南方的学园都市，是一片埋藏着丰富矿藏，拥有这丰沃水草的矿山和牧场，我们既已扫平西方殖民者在亚洲和大洋洲的存在，这最后一片珍宝也当入我国之手"
MON_focus_Listen_loong_roar: "且听龙吟"
MON_focus_Listen_loong_roar_desc: "诸君，自维新失败以来，数十年的耻辱自此一扫而空，帝国重登亚洲霸主之位，且看那潜龙腾渊，直上九霄，且听那彻天的龙吟之声，响彻寰宇！"

GXC_chenyutu: "云从龙，风从虎，功名利禄尘与土。"
GXC_chenyutu_desc: "伯雷帖木儿以为用赤裸裸的杀戮就能让我们屈服。他们错了，汉人的脊梁是压不弯的。"
GXC_baixingku: "望神州，百姓苦，千里沃土皆荒芜。"
GXC_baixingku_desc: "曾经繁华的市镇沦为吞噬血肉的军工苦役营，乡野间哀鸿遍野，十室九空。律法沦为军靴下的废纸，稍有忤逆便会招致残酷的连坐与无情镇压。在这场无休止的暴政榨取下，中原苍生已被逼至退无可退的死角。当最基本的生存权利都被无情剥夺时，留给这片土地的，唯有那即将点燃旧世界的冲天怒火。"
GXC_jinhulu: "看天下，尽胡虏，天道残缺匹夫补。"
GXC_jinhulu_desc: "把锄头换成缴获的步枪，把矿镐砸向他们的铁路！我们将从矿坑、田野和暗巷中涌出，汇成势不可挡的红巾狂潮。"
GXC_haonaner: "好男儿，别父母，只为苍生不为主。"
GXC_haonaner_desc: "兄弟们，我们挥动锄头与钢枪，只为了锅里有一口稠粥，为了家里的婆姨孩子不再受到达鲁花赤的凌辱。我们不是要重建哪家的江山，而是为天下人的世道。"
GXC_shadazi: "手持钢刀九十九，杀尽胡儿方罢手。"
GXC_shadazi_desc: "天下苦蒙元久矣，既然没有活路，那就用暴君的血来铺就我们的生路！旧账，就在今天清算！"
GXC_nanzihan: "我本堂堂男子汉，何为鞑虏作马牛。"
GXC_nanzihan_desc: "若这天下没有能让百姓活命的主子，那我们就做这天下的主人！这一仗，只为苍生，不为明主。"
GXC_buhuitou: "壮士饮尽碗中酒，千里征途不回头。"
GXC_buhuitou_desc: "兄弟们，这一仗没有退路。身后的田园已被焚毁，家中的父老正望眼欲穿。无论前面是装甲洪流还是达鲁花赤的绞索，只要那座象征暴政的都城还没插上我们的红旗，只要那伪汗的头颅还没落地，这满地的赤色风暴就绝不会平息。"
GXC_pohuanglong: "金鼓齐鸣万众吼，不破黄龙誓不休。"
GXC_pohuanglong_desc: "哪怕战至最后一人，哪怕躯干填平战壕，我们也绝不回头。为了万世苍生——不破黄龙，誓不甘休！"
GXC_chongkaizhonghuatian: "重开中华天"
GXC_chongkaizhonghuatian_desc: "这一仗，我们打碎了枷锁，也打出了一个百年来未曾有过的清朗世道。行政的朱笔不再记录搜刮的账目，而将勾勒复兴的蓝图。无论曾经历过多少黑暗，只要这汉族魂还在，我们的文明便永不凋谢。从今往后，乾坤重塑，日月常新。"
GXC_huanxingwude: "唤醒武德"
GXC_huanxingwude_desc: "当四万万同胞皆怀必死之心，当每一座村庄都化为坚固的堡垒，这世间便再无任何锁链能困住中华的龙吟。武德既张，国魂自兴！"
GXC_xingongheguo: "新共和国"
GXC_xingongheguo_desc: "往昔的枷锁已被彻底粉碎，但我们要建立的绝非另一个循环的旧朝。在那片被战火洗涤过的焦土上，一个前所未有的时代正破土而出。我们要建立的是一个真正的共和国——权力的源头不再是某个姓氏的私产，而是四万万同胞共同握持的公器。"
GXC_fuchudaijia: "要他们付出代价"
GXC_fuchudaijia_desc: "那些为了保住顶戴而助纣为虐的满蒙王公，那些为了荣华富贵而残害同胞的无耻汉奸——他们手中沾染的每一滴百姓鲜血，都必须用余生的苦役来偿还。宽恕是长生天或佛祖的事，而我们的职责，是送他们去最深、最冷的矿井里反省。"
GXC_tuanjieyizhi: "让我们团结一致"
GXC_tuanjieyizhi_desc: "团结，是我们对抗暴政最锐利的武器，也是重建家园最厚实的基石。当四万万同胞手足相依，当每一个省份的呼吸都汇聚成同一种频率，这世间便再无任何力量能让这片土地沉沦。众志成城，则天下无敌！"
GXC_youzhizhanshi: "做优质的战士"
GXC_youzhizhanshi_desc: "我们不需要只会机械执行命令的傀儡，我们要的是每一个走出营房的士兵，都能成为这柄民族利剑上最锋利的锋刃。所谓‘优质’，是胸中为苍生而战的灼热意志，是与现代战争技战术的完美融合。我们要建立最严苛的选拔机制，将每一个基层连队都淬炼成坚不可摧的熔炉。从山间袭扰到城市攻坚，每一个战术细节都必须化为身体的本能。我们要让世界看到，中华的捍卫者不仅拥有不可动摇的信念，更拥有令一切对手胆寒的专业素养。"
GXC_tiemabinghe: "铁马冰河入梦来"
GXC_tiemabinghe_desc: "国家的未来不应只在书斋中消磨，而应在操场上的正步与口令声中锻造。我们要将象牙塔化作熔炉，让书卷气与硝烟味并存。从今日起，学校不再仅仅是传授知识的场所，更是培养帝国公民脊梁的军营。每一个清晨，迎接学子的将是嘹亮的军号而非散漫的钟声；每一堂课程，不仅是公式与词句的堆砌，更是纪律与服从的演练。我们要让这些年轻人明白，手中的钢笔在必要时必须化为上膛的步枪。"
GXC_huangshabaizhan: "黄沙百战穿金甲"
GXC_huangshabaizhan_desc: "一支没有灵魂的军队，不过是穿着制服的暴民；而一支拥有军魂的部队，则是不可逾越的长城。我们不仅要给士兵发下钢枪，更要往他们的骨髓里注入一种名为‘忠诚’与‘无畏’的烈火。"
GXC_qitunwanliruhu: "气吞万里如虎"
GXC_qitunwanliruhu_desc: "军魂不是写在条令里的枯燥文字，而是深夜拉练时自发的沉默，是面对绝境时相视一笑的决绝。我们要让每一座营房都成为精神的圣殿，让旗帜下的誓言重于生命。我们要培养这样一种军人：他们因守护苍生而感到自豪，因身为利剑而渴望磨砺。"
GXC_gangtiechangcheng: "钢铁长城"
GXC_gangtiechangcheng_desc: "当‘牺牲’不再是口号，而成为最高的升华；当‘荣誉’不再是勋章，而化作呼吸的频率，我们的军队将脱胎换骨。我们要铸造的，是一支即便建制被打散、即便身陷重围，依然能凭本能向着胜利冲锋的钢铁之师。军魂所至，无坚不摧！"
GXC_gechuhusu: "第二次革除胡俗"
GXC_gechuhusu_desc: "自满清以来，胡风浸染华夏已有三百年之久。那段岁月里，辫发、胡服与奴化之气如附骨之疽，消磨了汉家的刚毅。而此番蒙元复辟，更是变本加厉，令中原大地腥膻遍地，纲常沦丧，古老的文明几乎被断送在铁蹄与伪诏之下。昔日洪武皇帝北伐大业完成后，首要之务便是革除胡俗，重振华夷之辨。今日新中国立于废墟之上，亦当效仿先贤。我们要撕碎那些带有奴役色彩的礼节，焚毁那些歪曲历史的伪经，从服饰、语言到宗法，全面回归汉文明的正朔。"
GXC_yiguanzixin: "衣冠自信"
GXC_yiguanzixin_desc: "我们要从历史的尘埃中寻回那份失落的优雅。汉服，从来不是博物馆里僵硬的标本，更不是束缚手脚的枷锁；它是天人合一的智慧，是礼仪之邦的注脚。从交领右衽的方寸之间，到随风而起的宽袖大襟，每一道缝合都流淌着华夏先贤的审美与风骨。我们要让国人明白：自信地穿上我们的衣冠，绝非倒行逆施的保守，而是对民族魂魄最坚定的回归。"
GXC_wenhuachuhai: "文化出海"
GXC_wenhuachuhai_desc: "文明的生命力不在于高墙内的孤芳自赏，而在于它能够跨越山海，成为照亮他人的灯塔。曾经，我们的文化随着丝绸之路的驼铃传遍寰宇，让世界在礼乐与诗书面前折服。今日，新中国不仅要收复故土，更要收复那份失落已久的文化话语权。我们要派遣最博学的士子与最精湛的艺人，带着华夏的衣冠、典籍与哲思走向大洋彼岸。我们要让全球的每一个角落都知晓：汉族文化绝非尘封的‘古董’，而是充满生机、包容万象的现代文明。当世界开始研习我们的文字，效仿我们的礼仪，中国的软实力将化作无形的纽带，将万邦系于和平与尊重的基石之上。"
GXC_fuhanbufujun: "复汉不复君"
GXC_fuhanbufujun_desc: "总有些旧梦未醒的遗老，幻想着在那座空荡荡的金殿上再扶起一位‘真龙天子’。他们误以为，复兴华夏文明就意味着要请回那些早已腐朽的封建枷锁。听着，我们要复兴的是汉人的骨气，不是皇帝的脾气；我们要重塑的是先贤的礼法，不是卑躬屈膝的奴性。‘汉’这个字，属于田野里的农夫、工坊里的匠人、学堂里的赤子，它是四万万同胞共有的血脉认同，而非一家一姓的私产。我们要的是一个没有跪拜的华夏，一个‘天下非一人之天下’的共和国。汉服之美，美在平等的风骨；汉礼之正，正在公义的纲常。我们将斩断通往帝制的所有回头路，让华夏文化在现代民主的沃土上，开出前所未有的自由之花。"
GXC_jiaohuawanmin: "教化万民"
GXC_jiaohuawanmin_desc: "一个国家的强盛，不取决于它有多少深藏秘府的孤本典籍，而取决于它的国民拥有怎样的见识与胸怀。我们将派遣大量义务宣传员深入全国各地，系统性地普及汉文化，重塑民族认同。文化不仅是传承的血脉，更是治理的工具。"
GXC_xinmeideyundong: "新美德运动"
GXC_xinmeideyundong_desc: "旧时代的道德已在动荡中破碎，而单纯模仿他人的准则又往往水土不服。我们将发起一场席卷全国的‘新美德运动’，我们要在大地的每一个角落，重新定义何为‘华夏脊梁’。这不是要全盘照搬故纸堆里的陈腐教条，更不是要复活那些压迫人性的枷锁。我们要取其精华——保留‘仁爱、诚信、正气’的千年火种，同时赋予其‘平等、科学、法治’的时代躯壳。我们要教导国人：孝，不再是盲目的顺从，而是人格尊严的传承；礼，不再是等级的森严，而是公民彼此的尊重。"
GXC_huaxiagongtongti: "构建华夏共同体"
GXC_huaxiagongtongti_desc: "‘华夏’二字，从来不是一个狭隘的地理坐标，更不是一段凝固的血缘记录，而是一团永不熄灭的文明火种。千百年来，无论身处江河湖海，还是远遁异域他乡，只要心中仍存那份对礼义的敬畏、对衣冠的眷恋、对文字的共鸣，便皆是我辈袍泽。我们要打破近代以来人为制造的隔阂与偏见，以文化为纽带，以繁荣为目标，将所有认同华夏文明的群体紧密团结在一起。当万千溪流汇聚成滔滔巨浪，华夏文明将以一个整体的姿态，重新定义人类文明的新高度。"
GXC_qingsuan: "大清算"
GXC_qingsuan_desc: "伯雷帖木儿的暴政之所以能维持，不仅靠他的铁蹄，更靠那些在各个角落助纣为虐的帮凶。宽恕不应是软弱的代名词，更不应成为对死难同胞的背叛。他们的每一处宅邸、每一箱金银都将收归国有，用于抚慰饱受摧残的百姓；他们余生的岁月，将在重建山河的苦役中度过。这不仅是为了复仇，更是为了在这个新生的国度里立下一座永恒的界碑：在这片土地上，任何依附强权、残害同胞者，终将迎来正义的裁决。"
GXC_jinianyingxiong: "纪念英雄"
GXC_jinianyingxiong_desc: "一个断了脊梁的民族，是因为它忘却了曾经为它撑起天空的巨人。我们要从浩如烟海的岁月中，重新请回那些守护了华夏千年的英灵。这不是为了沉溺于往昔的荣光，而是要让每一位国民在仰望先贤时明白：我们这个民族，从来不缺舍生取义的傲骨，更不缺改天换地的志气。"
GXC_hanbenwei: "汉本位历史观"
GXC_hanbenwei_desc: "长久以来，我们的史书被胜利者的偏见所涂抹，我们的叙事被异族的史观所侵蚀。我们要夺回阐释往昔的权力——我们要建立以汉民族为主体的历史道统。我们要剔除那些试图虚无化民族精神的杂音，让后代在翻开史册时，看到的不再是支离破碎的朝代更迭，而是一个伟大文明在阵痛中不断涅槃、在斗争中永恒屹立的轨迹。以我为准，以我为宗，唯有站稳了自己的根基，华夏的未来才不会迷失方向。"
GXC_dafengqixiyunfeiyang: "大风起兮云飞扬"
GXC_dafengqixiyunfeiyang_desc: "放眼望去，四境之外依然群狼环伺。那些觊觎中原丰饶的野心家正试图趁我们立足未稳之时，再次扑向这片锦绣河山。我们不能坐以待毙。真正的防御不在于城墙的高低，而在于我们夺取主动权的胆略。如果冲突不可避免，那么战场绝不应在我们的良田与工厂之间，而应在敌人的巢穴。"
GXC_Marching_into_peninsula: "鸭绿江畔锁寒龙"
GXC_Marching_into_peninsula_desc: "朝鲜半岛，自古以来就是我大中华忠心耿耿的朝贡国，近代以来，可耻的樱花帝国侵略者对其进行了殖民，是时候进军半岛，夺回我们的土地了。"
GXC_There_cannot_be_two_suns_in_world: "鲸吞东瀛定东海"
GXC_There_cannot_be_two_suns_in_world_desc: "抗樱战争的胜利只是开始，我们绝不能辜负中华大地四万万奋起抗争的同胞们。今日便要打过对马海峡去，笑谈渴饮樱寇血！"
GXC_Expulsion_of_colonists: "炮舰折戟断英伦"
GXC_Expulsion_of_colonists_desc: "亚洲人民苦殖民压迫良久，是时候将这些殖民者一个不留的驱逐出去了。"
GXC_Operation_Annan: "旧港宣慰立汉疆"
GXC_Operation_Annan_desc: "南太平洋有着许多我们急缺的战略资源，“解放”南亚，这对我们以及南亚的同胞们大有脾益。"
GXC_Operation_Tianzhu: "葱岭兵峰震天竺"
GXC_Operation_Tianzhu_desc: "艾恩格朗特人民被圣杯王国殖民了近两个世纪，是时候去解放他们的人民，还他们一个“自由”了。"
GXC_Claim_Chinese_speaking_part_of_North_America: "惊雷唤醒迷途客"
GXC_Claim_Chinese_speaking_part_of_North_America_desc: "北美西部地区多年以来住的都是华人，汉语一度跻身官方语言，我们不能让那些定居北美的华人不遵守我们中华民族的法律。"
GXC_Pacific_Dragon: "巨舰凌波下西洋"
GXC_Pacific_Dragon_desc: "南下大洋，我部如蛟龙出海，势不可当。"
GXC_Unified_Chinese_speaking_areas: "鹰扬折翼落西天"
GXC_Unified_Chinese_speaking_areas_desc: ""
GXC_Reclaim_your_homeland: "都司故土今何在"
GXC_Reclaim_your_homeland_desc: "外东北，库页岛，察哈尔湖……这些自古以来就是我国神圣不可分割的领土，如今祖国再次伟大，是时候夺回我们阳光下的土地了。"
GXC_Chop_off_bear_tail: "燕然勒铭扫北庭"
GXC_Chop_off_bear_tail_desc: "苏维埃联盟在涉及领土主权问题时仍执迷不悟，顽固的拒不归还。那么，我们是时候去解放那些被这群赤匪压迫的人民了。"
GXC_Chen_end_focus: "万国衣冠拜冕旒"
GXC_Chen_end_focus_desc: "[FROM.Getname]向世界展示了中华民族与中国人民的决心与力量，如今，革命已经成功，中华民族的伟大复兴在这一代彻底完成，如今的一代是最伟大的一代，中国的人民时最伟大的人民。中华的盛世将于此刻开始，永不结束！"

GXC_military_affairs_commission_sea: "华夏新军"
GXC_military_affairs_commission_sea_desc: "高效军队的根基在于完善的最高统帅部。军事委员会是我国最高防务机构，必须确保其具备足以胜任的能力。"
GXC_set_up_an_nco_school: "设立士官学校"
GXC_set_up_an_nco_school_desc: "我军大部分人缺乏正规教育，这对普通士兵尚可原谅，但一旦升至更高军衔则成为问题。我们需要建立相应制度来训练士官，确保他们的军事素养。"
GXC_formalize_field_promotions: "正式确立战地晋升制度"
GXC_formalize_field_promotions_desc: "在理想的世界里，我们会拥有一支受过全面训练与教育的军队，但现实并非如此。在当下困境下，快速将部队投入战场才是首要任务。我们将制定计划，从普通士兵中物色能够带领战友前进的人。"
GXC_crackdown_on_corruption_in_recruitment: "打击军事腐败"
GXC_crackdown_on_corruption_in_recruitment_desc: "军中出现了有人花钱逃役，薪饷也被“巧妙账目”贪污的现象。如果我们要在现代世界的冲击中生存下去，这些问题必须终结。"
GXC_form_the_combined_logistics_command: "组建联合后勤司令部"
GXC_form_the_combined_logistics_command_desc: "如今我们的军队已经重组，能够有效应对一切威胁，但新的问题出现了。尽管后勤状况有所改善，我们的武装部队在后勤分配体系上缺乏协调。我们必须立刻解决此问题！"
GXC_reorganise_the_train: "整顿铁路"
GXC_reorganise_the_train_desc: "我们的补给组织从未发展到所需的规模与复杂程度。彻底重组将使我们能向前线投入更多兵力。"
GXC_rely_on_locals: "依靠地方"
GXC_rely_on_locals_desc: "建立一支完整的、能够被我军使用的组织架构，复杂、耗时且昂贵。历史为我们展示了另一种替代方案——为何要长途运输那些本地即可获得的资源？如果我们依靠分布在这片广袤土地上的农民与工人，就能弥补体制留下的缺口。"
GXC_focus_on_meritocratic_principles: "任人唯贤"
GXC_focus_on_meritocratic_principles_desc: "裙带关系、贿赂与腐败，是高效军队的天敌。这些弊病在我军组织中过于普遍，必须改变。通过建立制度框架，把最有功绩的人才提拔到合适岗位，方能确保胜利。"
GXC_protracted_warfare: "持久战"
GXC_protracted_warfare_desc: "自从[JAP.GetNameDef]击败俄国以来，其国人深信迅猛、侵略性的行动就是胜利之道。这使得他们军队缺乏持久战力。如果我们能阻止他们的速胜，他们的部队很快会土崩瓦解。"
GXC_decisive_battles: "决战思想"
GXC_decisive_battles_desc: "并非所有胜利都具备相同分量，我们应集中兵力，在关键战役中取胜。"
GXC_invest_in_mountain_guns: "投资山地火炮"
GXC_invest_in_mountain_guns_desc: "我国的疆土难以通行，搬运重炮更是艰巨。能够随时拆解并搬运火炮正是解决之道，值得在这个方向加强投入。"
GXC_repurpose_fort_artillery: "改造要塞炮"
GXC_repurpose_fort_artillery_desc: "战争不再能依赖要塞固守，上次世界大战已证明这一点。尽管防御工事价值有限，但其中的火炮仍能持续打击敌人。"
GXC_repurpose_fort_artillery_tt: "§R你未控制任何可拆除的要塞§!"
GXC_fund_the_marine_corp: "资助海军陆战队"
GXC_fund_the_marine_corp_desc: "我军规模庞大，实力不容置疑，但若运用不当，则如同钝器。建立一支专门训练的海岸防御部队，战力可抵十倍普通士兵，且能在关键时刻投射我们的海军力量。"
GXC_the_4_defence_areas: "四区联防"
GXC_the_4_defence_areas_desc: "若要成功保卫伟大祖国，必须有一套全面的计划。我们将全国划分为四个防区，并分别任命司令，以确保地方安全和高效抵抗。"
GXC_defence_in_depth: "纵深防御"
GXC_defence_in_depth_desc: "合格的防御不可僵化，我们需要将这一点纳入战略。将敌人拖得越久，对我们越有利。战局起伏不应击垮我军的斗志。"
GXC_prepare_the_war_zones: "武装抗战区"
GXC_prepare_the_war_zones_desc: "我们需要按地理区域划分整编军队，以明确各地责任。这样就能规划适合当地的攻势，最大化突破能力。"
GXC_guerrilla_warfare: "游击战"
GXC_guerrilla_warfare_desc: "常规作战可使我们一定程度抵抗，但在本土作战则能采用非常规手段。渗透敌占区，破坏其后方力量，这是令敌人毫无防备的战法。"
GXC_rapidity_is_the_essence_of_war: "兵贵神速"
GXC_rapidity_is_the_essence_of_war_desc: "速度与突然性是我们最佳武器。学习如何利用这些优势，在现代战争中至关重要。快速而精确的机动作战，能令敌军失衡，从而让我们更深入并以更小的阻力打击敌占区。"
GXC_organise_the_200th_division: "成立第200师"
GXC_organise_the_200th_division_desc: "装甲部队是本世纪战争最伟大的革新，但我们却落后于人。组建一支装甲师并聘请合适的指挥官，形成一股战力倍增的力量，为胜利铺平道路。"
GXC_motorise_our_infantry: "摩托化步兵"
GXC_motorise_our_infantry_desc: "我国人力资源储备庞大，历来是我军的根基。现代化的机动运输能赋能普通士兵，让他们更快进入战斗并随时给予致命一击。确保正确位置上有持枪士兵永远是高效的策略。"
GXC_bog_them_down_in_the_centre: "困敌于华中"
GXC_bog_them_down_in_the_centre_modify: "§Y$GXC_bog_them_down$§!追加效果："
GXC_bog_them_down_in_the_centre_desc: "我们必须慎选战场。以长江为核心布防，是阻敌的高效方式，可成为全国防御的支点。而且，针对具体地区的防御规划意义更大。"
GXC_appear_where_you_are_not_expected: "出其不意"
GXC_appear_where_you_are_not_expected_desc: "从未有成功的统帅选择在敌人预期的地点和方式发动攻击。欺骗是战争根本，我们必须做到“实强时示弱，实弱时示强”。"
GXC_declare_war_zone_modify: "§Y$GXC_declare_war_zone$§!追加效果："
GXC_relocate_factories_from_the_coast: "在内陆建设工厂"
GXC_relocate_factories_from_the_coast_desc: "我们面临严峻的战略困境。我们的工业中心位于沿海，极可能落入敌手。没有生产能力，抵抗难以持久。因此我们必须将工业内迁，确保安全。"
GXC_state_aa: "苍穹之盾"
GXC_state_aa_desc: "在新世界，敌人不只从陆地和海洋发动攻击，还会从空中袭来。我们必须将炮口转向天空，做好防空准备，才能抵御入侵者。"
GXC_coastal_forts: "海上长城"
GXC_coastal_forts_desc: "外敌与其傀儡从北方进攻之余，也必将自海上入侵。我们要随时准备，在他们踏上国土之刻，将其重新赶回大海。"
GXC_salvage_enemy_equipment: "回收敌军装备"
GXC_salvage_enemy_equipment_desc: "华夏新军的需求，远超我工业能力。我们可以通过回收敌军营地中的物资，来弥补部分缺口。"
GXC_salvage_enemy_equipment_random_generals_tt: "§Y5§!名随机陆军将领将获得§Y清拣缴获大师§!：\n-$MODIFIER_EQUIPMENT_CAPTURE_FACTOR$：§G+50%§!"
GXC_commemorate_the_labour_corps: "纪念劳工部队"
GXC_commemorate_the_labour_corps_desc: "我国人民曾远赴海外，在世界大战的战场上展现勤勉的素养，赢得他国的认可。尽管[ENG.GetAdjective]与[FRA.GetAdjective]早已遗忘，但我们不会忘记。我们将铭记他们的功绩，并将其经验化为今日的力量。"
GXC_utilise_the_terrain: "利用地形"
GXC_utilise_the_terrain_desc: "我们的部队既无最新装备，也未受最佳训练，但我们对祖国的土地了如指掌。我们能利用一切水道、丘陵与田野，使敢于入侵者陷入地狱般的困境。"
GXC_train_for_asymmetry: "训练非对称作战能力"
GXC_train_for_asymmetry_desc: "战争从不公平，也不必期望公平。强大军队会试图征服我们，我们必须找到扳平差距的方法。训练军队与将领适应新式作战过程艰难，但收获不容置疑。"
GXC_train_for_asymmetry_random_generals_tt: "§Y3§!名随机陆军将领将获得§Y“游击战专家”§!：\n-$MODIFIER_DIG_IN_SPEED_FACTOR$：§G+50%§!"
GXC_know_thy_enemy: "知彼"
GXC_know_thy_enemy_desc: "我们需要知道如何找到敌人战线上的弱点。"
GXC_know_thy_enemy_tt: "解锁强化版“强攻”指令，进攻时不失去防御工事加成。"
GXC_know_thy_self: "知己"
GXC_know_thy_self_desc: "知彼能为我们带来胜利，但最终的胜利只能通过知己来实现。建立严格的自我评估将揭示我们的弱点，但也会指出如何集中我们的力量。"
GXC_river_crossing_studies: "渡河研究"
GXC_river_crossing_studies_desc: "中国是一个江河纵横的国家，任何在此作战的军队都必须学会如何跨河作战。我们正处于绝佳位置，可从中学习并将所得付诸实践。这些经验将有助于我们击退侵略者，并将战火推回国境之外。"
GXC_armoured_car_tactics: "坦克部队"
GXC_armoured_car_tactics_desc: "在工业力量的竞赛中，大多数军队的装甲部队都在逐渐变重。然而，当需要刀子时，使用斧头并不能提高效率。"
GXC_serve_the_country_with_utmost_loyalty: "尽忠报国"
GXC_serve_the_country_with_utmost_loyalty_desc: "我们已向敌人展现了坚毅，将其死死挡在原地。凭借对祖国的坚定奉献与忠诚，没有任何侵略者能将我们征服！"
GXC_the_well_timed_swoop_of_a_falcon: "鸷鸟之疾"
GXC_the_well_timed_swoop_of_a_falcon_desc: "我们已掌握打击与歼灭敌人的方法。从驱逐侵略者，到将战火烧至敌国本土，古老的智慧至今依旧有效，我们必将迈向胜利！"

 GXC_rocaf: "加强空军" # was Establish the ROCAF
 GXC_rocaf_desc: "为保障[ROOT.GetName]空域安全、展现国家力量，我们必须强化空军。通过投资先进学说与技术，将为打造一支能够应对任何对手的现代化空中力量奠定基础。"
 GXC_officialize_the_rocaf: "正式成立[ROOT.GetName]空军"
 GXC_officialize_the_rocaf_desc: "空军长期以来一直是个非正式的机构。随着我们取得的技术与战术发展，现在是时候将航空委员会改组为空军司令部，使[ROOT.GetName]空军成为独立于陆军与海军的正规军种。"
 GXC_bring_the_war_home: "将战火带回敌国本土"
 GXC_bring_the_war_home_desc: "敌人必须认识到其领土无处藏身。通过精准轰炸和心理战，我们将实施深度打击，摧毁敌军士气。"
 GXC_projecting_power: "远程投射能力"
 GXC_projecting_power_desc: "通过将空中力量投射至前线之外，我们已做好随时抓住机遇发起打击的准备。空中力量的远程投射，已不再是单纯的野心，而是战略上的必然要求。"
 GXC_strike_at_what_is_weak: "避实击虚"
 GXC_strike_at_what_is_weak_desc: "我们不会正面迎敌。相反，我们的作战学说必须强调精准且持续地打击敌人最脆弱的环节。"
 GXC_a_wind_that_rises_in_the_daytime_lasts_long: "昼风久"
 GXC_a_wind_that_rises_in_the_daytime_lasts_long_desc: "白天的持续轰炸提供了稳定且有条理的空战方式。我们必须利用良好的视野和协调性，以实施有效打击。"
 GXC_but_a_night_breeze_soon_falls: "夜风止"
 GXC_but_a_night_breeze_soon_falls_desc: "夜间行动可能充满风险，但加强训练后我们的飞行员就能在夜幕掩护下将损失降至最低。敌人永远不会发现我们的到来.……"
 GXC_escort_efficiency: "护航效率"
 GXC_escort_efficiency_desc: "战斗机护航是我们轰炸机的重要护盾。加强协调和覆盖范围能确保更多飞机完好返航，为下一轮任务做好准备。"
 GXC_controlling_our_skies: "掌控天空"
 GXC_controlling_our_skies_desc: "在称霸海外之前，我们必须确保国内的空天主权。纪律严明的防空网络是维护国家安全的根本保障。"
 GXC_interception_detection: "拦截侦测"
 GXC_interception_detection_desc: "及时的侦测能让我们在敌人发动攻击前先发制人。我们将加强雷达与观测网络建设，获取这一决定性优势。"
 GXC_focus_on_positional_advantage: "重视方位优势"
 GXC_focus_on_positional_advantage_desc: "空战不仅关乎数量与速度，优势在于高度、角度与警觉性。我们必须教导飞行员利用好每一项优势。"
 GXC_effectivize_ground_crew_usage: "提高地勤效率"
 GXC_effectivize_ground_crew_usage_desc: "地面效率与空中表现同样重要。简化机组任务和后勤保障能让更多飞机保持飞行状态。"
 GXC_coordinate_with_the_army: "协同陆军"
 GXC_coordinate_with_the_army_desc: "胜利源于武装力量的统一。我们的空中与地面部队必须以同一目标执行统一行动。"
 GXC_an_appropriate_design: "合适的设计"
 GXC_an_appropriate_design_desc: "我们的飞机必须严格符合作战学说的要求。无论航程或耐久性，我们将致力于研发满足战场需求的设计方案。"
 GXC_an_appropriate_design_3_tt: "如果已完成§Y$GXC_projecting_power$§!：\n"
 GXC_an_appropriate_design_2_tt: "如果采取了§Y$GXC_controlling_our_skies$§!：\n"
 GXC_reorganise_the_central_armys_academy_aviation_corps: "重组学校航空队"
 GXC_reorganise_the_central_armys_academy_aviation_corps_desc: "训练必须随技术发展而进步。我们将改革航空兵团，培养适应未来战斗的现代化能干飞行员。"
 GXC_formalise_training_regime: "训练体系正式化"
 GXC_formalise_training_regime_desc: "持续且严格的训练制度是减少损失、提升表现的关键。标准化将从现在开始。"
 GXC_conserve_our_pilots: "珍惜飞行员生命"
 GXC_conserve_our_pilots_desc: "飞行员难以替代。通过降低风险、提高生存率，我们才能保留作战经验，维持部队战斗力。"
 GXC_camco_primacy: "$CHI_camco_1$优先"
 GXC_camco_primacy_desc: "中央飞机制造厂是我们在航空发展方面最佳的国内伙伴。优先发展其能力将确保产能跟上我们的雄心。"
 GXC_initiate_the_sky_projects: "启动天空计划"
 GXC_initiate_the_sky_projects_desc: "火箭技术与先进推进系统开辟了新的战略选项。我们将资助实验项目，着眼长期回报。"
 GXC_focus_on_the_Tianlong_project: "注重天龙计划"
 GXC_focus_on_the_Tianlong_project_desc: "喷气式推进是空战的未来。天龙计划将会是这一变革的前沿。"
 GXC_VTOL_experiments: "垂直起降实验"
 GXC_VTOL_experiments_desc: "垂直起降飞机能在复杂地形提供战术灵活性。我们已启动试验以评估其在现代战争中的作用。"
 GXC_hongxiang_force: "云南空降兵部队"
 GXC_hongxiang_force_desc: "通过与我们在航空领域的盟友和同僚合作，我们已经成功建立了国内军事伞降作战的训练体系。"
 # Navy focuses
 GXC_republic_of_china_navy: "重建海军"
 GXC_republic_of_china_navy_desc: "海军过去历经坎坷，资金匮乏与海防不稳致使舰船状况不佳。随着危机临近，我们必须把克服这些挑战提上日程。"
 GXC_foreign_acquisition: "海外收购"
 GXC_foreign_acquisition_desc: "虽然我们希望这只是暂时的挫折，但我们必须承认其他列强在海军技术发展方面远远领先我们。要实现海军现代化，必须首先找到一位技术先进的援助方。"
 GXC_develop_northern_naval_logistics: "发展北方海军后勤"
 GXC_develop_northern_naval_logistics_desc: "青岛是一个重要的战略港口城市，理应在我国海军军事化进程中发挥作用。"
 GXC_develop_southern_naval_logistics: "发展南方海军后勤"
 GXC_develop_southern_naval_logistics_desc: "我国南部海岸遍布殖民飞地，防御力量严重不足。若要与西方列强平等对话，势必要收复并开发这一关键区域。"
 GXC_concerted_push: "协同推进"
 GXC_concerted_push_desc: "中国人民一次又一次在逆境中展现了他们的适应能力。这次也不例外。我们的领导层已经宣布需要一支能够与大国抗衡的海军，而我们的经济将迎接这一挑战。"
 GXC_local_alloy_commission: "本地合金委员会"
 GXC_local_alloy_commission_desc: "我们的土地蕴藏着丰富的天然矿产资源，然而我们却未能充分利用这些资源进行工业开发。在此领域探索发展潜力，未来必将获得丰厚回报。"
 GXC_deny_the_enemy: "拒敌"
 GXC_deny_the_enemy_desc: "虽然我们在陆地上的优势无可匹敌，但对于重振衰弱的海军，我们所能期待的最好结果或许就是遏制敌方的行动。"
 GXC_dominate_the_enemy: "制敌"
 GXC_dominate_the_enemy_desc: "我们将不惜一切代价，达到与敌人抗衡的实力。"
 GXC_navy_spooks: "发展海军情报机构"
 GXC_navy_spooks_desc: "中国周边的海域是繁忙的贸易活动枢纽。有商人的地方就有流言，有流言的地方就有机遇……"
 GXC_promote_admiral: "召回海军将领"
 GXC_promote_admiral_desc: "我们近期的海军建设最终将淘汰那些19世纪的老旧战舰。这恰好提供了将其改造为训练舰供官兵使用的契机——同时针对我国海军的战略方向制定一套优化的训练项目。"
 GXC_heavy_ship_research: "重型战舰研发"
 GXC_heavy_ship_research_desc: "自主生产战列舰对于抗衡至今仍在掠夺我国的地区和殖民强国至关重要。虽然我们的技术可能处于劣势，但我们的制造工艺和人民的坚定意志必将带来胜利。"
 GXC_strike_from_below: "水下打击"
 GXC_strike_from_below_desc: "魔导国已经证明一个受到海军强国威胁的国家可以依靠强大的水下舰队来保护自身利益。鉴于我们面临类似的情况，我们应该向西方汲取经验。"
 GXC_fund_the_naval_air_establishment: "资助海军航空系统建设"
 GXC_fund_the_naval_air_establishment_desc: "制空权和制海权结合所带来的巨大优势不容忽视。扩编我们的海军航空兵部队能降低跨军种通信失误的风险。"
 GXC_early_detections: "初期侦测"
 GXC_early_detections_desc: "我们的舰队虽然有战斗力，但规模一般，因此除了优化作战部署以最大限度地利用舰船外别无选择。情报与态势感知是实现这一目标的最佳途径。"
 GXC_defend_our_coasts: "保卫海岸"
 GXC_defend_our_coasts_desc: "只要敌人无法接近我们，他们就无法发动攻击。未来遭遇入侵时，布雷拒止将是最可行的防御手段。至于未来的成本，我们日后再作考量……"
 GXC_long_range: "远程作战"
 GXC_long_range_desc: "一支平衡良好的箭矢可以在战争开始前就结束它。更庞大、更嘈杂的引擎或许会让机组人员承担风险，但能将力量投射得更远，让我们在世界舞台上拥有更大的影响力。"
 GXC_battleship_focus: "重视战列舰"
 GXC_battleship_focus_desc: "开始建造第一艘海上巨兽。"
 GXC_coastal_defence: "海岸防御"
 GXC_coastal_defence_desc: "优化水下舰队的空间利用率意味着能建造更小更快的潜艇。不过我们不得不舍弃一些非必要设施，比如双层床……以及其他生活便利设备。"
 GXC_heavy_cruiser_focus: "重视重巡洋舰"
 GXC_heavy_cruiser_focus_desc: "我们的水面舰队虽承袭自清朝，近五十年来却始终恪尽职守。世界正在变化，但在操作近程装甲巡洋舰方面，放弃如此丰富的经验并不明智：我们的未来应当融入过去。"
 GXC_mobile_bases: "机动基地"
 GXC_mobile_bases_desc: "正如世界其他国家所证明的，天空代表着战争的未来。然而我们的远程打击能力受限于地理条件。仿效列强的做法，我们必须把精力集中在机动打击平台上。"
 GXC_the_seas_of_tomorrow: "明日之海"
 GXC_the_seas_of_tomorrow_desc: "我们梦想着中国在软实力与科技实力上引领世界的未来。多年来我们一直在追赶殖民列强和地区对手的庞大海军，但现在是我们亲自规划未来航向的时候了。"
 GXC_long_range_screens: "长程屏卫"
 GXC_long_range_screens_desc: "随着我们着力超越国内冲突，以低成本远距离投送实质性军力的能力变得至关重要。"
 GXC_naval_separate_defense_plan: "海军分防计划"
 GXC_naval_separate_defense_plan_desc: "文德嗣提出的《海军分防计划》，定下了在未来30年内建造至少十二艘航空母舰的目标。若要保卫我国海疆，我们就应采纳此议，并尽快开始打造航母舰队！"
####事件####
mon_flavor.1.t:0"交易何物？"
mon_flavor.1.d:0"随着[ROOT.GetName]与邻国边境的重新开放，第一支由狼族战士护卫、羊族工匠领队的庞大商队已经抵达了目的地。正如当年的成吉思汗曾为帝国的未来忧虑一样，物资的稀缺始终是悬在草原统治者头上的利剑 。我们的商队带去了最优质的皮毛、马匹，以及通过羊族高超毡帐技艺制作的工艺品 。现在，我们要决定将什么货物带回草原。"
mon_flavor.1.a:0"我们需要步枪"
mon_flavor.1.b:0"我们需要支援装备"
mon_flavor.1.c:0"我们需要火炮"
mon_flavor.1.e:0"想办法弄点图纸回来"

mon_flavor.2.t:0"我们的信仰"
mon_flavor.2.d:0"仅靠刀兵与律法，不足以凝聚这片横跨草原、西域、东北与中原残土的庞大疆域。\n\n神州崩解之后，人心如散沙，各族各信其神——蒙古诸部叩拜黄教活佛，回部绿洲日日朝向麦加，流亡白俄在哈尔滨的地下室点燃圣像前的蜡烛，而汉地乡野，仍有老道于残破道观中诵《清静经》。若无一统之信仰为精神纲领，帝国纵有百万怯薛，亦不过沙上之塔。\n\n为此，艾黛尔贾特决意择立国教。此非仅为敬神，实为治世——以信仰为绳，束万民之心；以神权为盾，固帝国之基。\n\n藏传佛教，自元世祖尊八思巴为帝师以来，便是蒙古王廷之精神支柱。黄教体系深入漠南、青海、西藏，活佛转世之制，既神圣又可被世俗权力所引导。若立为国教，可迅速安抚蒙古诸部，稳定北疆，使喇嘛庙成为帝国在草原的耳目与支柱。且其教义重秩序、尊上位，与卍字体制天然相契。\n\n伊斯兰教，则为西域之血脉。自喀什至伊犁，百万穆斯林以《古兰经》为律，以清真寺为心。若尊其为国教，不仅可收服回部王公之心，更可重启丝路商道，引中亚财货入帝国府库。其信众之忠诚坚如磐石，一旦归心，西陲可成帝国最牢不可破之屏障。\n\n东正教虽信徒不多，但前白军军官与哥萨克骑兵，是帝国北疆防线最锋利的矛。他们视东正信仰为旧日荣光之象征，若以圣像为国教之帜，可极大提升其士气与忠诚，甚至吸引海外白俄势力携资投奔。此教强调服从、纪律与君权神授，正合帝国所需。\n\n至于道教，虽早已不复唐宋之盛，却仍深植于汉人血脉之中。敬天法祖、清静无为，不争而善胜。若容其为国教，或可稍缓六千万汉人之怨，使乡绅百姓视新朝非全然异族之暴政。道观可化为基层治理节点，道士可助征粮安民，于无声处维系帝国腹地之稳定。"
mon_flavor.2.a:0"藏传佛教"
mon_flavor.2.b:0"伊斯兰教"
mon_flavor.2.c:0"东正教"
mon_flavor.2.e:0"道教"

mon_flavor.3.t:0"蒙古，还是俄罗斯？"
mon_flavor.3.d:0"艾黛尔贾特并未放弃对俄罗斯的野心——恰恰相反，她要打一场比“反攻”更宏大的战争。\n\n只是，她不打算以“白俄流亡者解放祖国”的名义出兵。\n\n“解放？”她曾冷冷对帝弥托利说，“莫斯科不需要解放，它需要臣服。我们不是去还你们一个沙皇，而是去立一座蒙古汗帐。”\n\n艾黛尔贾特的计划清晰而冷酷：以“新蒙古西征”为旗号，整合白俄军团、汉人仆从军与草原诸部，一路向西，直取叶尼塞河、鄂毕河，乃至乌拉尔山。她要的不是扶持傀儡政权，而是将俄罗斯土地纳入帝国行省，设总督、征皮毛、筑驿道——如同成吉思汗当年所为。\n\n对白俄而言，这无异于背叛。\n\n帝弥托利心如刀割。\n\n老兵们沉默了。有人低声说：“只要能踏上故土，管他是谁的旗？”也有人彻夜痛饮，哭问：“我们究竟是归乡者，还是新蒙古人的马前卒？”\n\n帝弥托利站在十字路口。\n\n一边是老将军以命相托的誓言：白俄之剑，只为准星指向俄罗斯的自由；\n\n一边是数万流亡者的现实：若拒绝西征，他们将永世困于异乡，沦为无根之魂。\n\n风从贝加尔湖吹来，带着雪与铁锈的味道。\n\n他知道，自己必须做出选择——"
mon_flavor.3.a:0"不行，我下不去手。"
mon_flavor.3.b:0"箭在弦上，不得不发。"

mon_flavor.4.t:0"战象部队"
mon_flavor.4.d:0"在恒河平原上，一支刚刚完成整编的现代化军队正在进行例行演习。演习场上，尘土飞扬。一方是精心挑选、身披传统护具的象兵小队，战象嘶鸣，气势汹汹地发起冲锋，试图重现古代战场的震撼；另一方则是严阵以待的机枪阵地与几门轻型速射火炮。\n\n随着指挥官一声令下，密集的弹雨瞬间撕裂了空气。曾经令步兵胆寒的厚重象皮，在现代步枪子弹面前如同薄纸；战象尚未接近敌阵，便已在火炮的轰鸣声中受惊失控，四处奔逃，原本整齐的冲锋队形瞬间溃散。不到十分钟，这场“古今对决”便以象兵的彻底惨败告终。\n\n演习结束后，负责记录的军官在日志中冷冷地写下：“无论战象多么威猛，在机枪与火炮构成的火网面前，它们只是巨大的活靶子。冷兵器时代的荣光已逝，象兵已彻底落后于这个时代，再无保留价值。”"
mon_flavor.4.a:0"战象终究还是不适应现代战场了"

mon_flavor.5.t:0"黑万字的阴影"
mon_flavor.5.d:0"在草原的暗面，一个幽灵悄然滋长。\n\n它的名字，叫“黑万字”——一个以扭曲的卍字符为徽记、以极端民族主义为纲领的秘密准军事组织。它的起源，可追溯至十年前：蒙古商人黑心虎在魏玛德国经商期间，亲眼目睹了纳粹党如何以铁腕、宣传与群众狂热重塑一个破碎的国家。他深受震撼，归国后便以“净化草原、驱逐异族、重建黄金秩序”为口号，仿照冲锋队（SA）与党卫军（SS）的模式，秘密组建了“黑万字”。\n\n早期的黑万字，不过是游走于边境的私兵团伙，靠走私军火、煽动排汉情绪壮大。但1933年，黑心虎在库伦一家茶馆被虹猫刺杀——据传，只因他策划炸毁汉蒙合办的青草铁路。\n\n其子黑小虎仓促继位。年轻人热血有余，谋略不足。无力驾驭组织内部的派系倾轧。短短两年，“黑万字”濒临分裂。\n\n就在此时，孛儿只斤·伯雷帖木儿出手了。\n\n这位黄金家族后裔以“正统继承者”身份介入，他为其注入新的灵魂——对他而言，目标从来不是“蒙古独立”，而是重建大元——一个以黄金家族为天命所归、统合汉、蒙、藏、回的新帝国。\n\n如今，“黑万字”已非昔日匪帮。它拥有地下兵工厂、青年训练营、秘密警察网络，甚至渗透进正规军。其冲锋队员身着黑袍，臂缠万字臂章，在夜色中突袭“不纯”村庄，焚烧“堕落”书籍，绑架“混血”家庭。\n\n然而组织内部仍并非铁板一块——黑小虎时常与艾黛尔贾特接触，在他看来只要蒙古能够复兴，管它是什么人领导。伯雷帖木儿则绝对排斥与艾黛尔贾特合作，在他看来，她不过是个披着贵族皮的乞丐，还是个曾经祖先曾被蒙古人奴役的斯拉夫蛮子，接受她，等于承认蒙古人无能——这是对成吉思汗之名最大的亵渎。"
mon_flavor.5.a:0"“他们忘了——当年是蒙古人教会斯拉夫人什么叫帝国。如今，竟要反过来当他们的学生？”"

mon_flavor.6.t:0"夜谈"
mon_flavor.6.d:0"草原长府邸内，火炉劈啪作响，将狼族族长灰太狼的身影放大投射在画着狼图腾的墙壁上，彷如一尊即将扑食的恶兽。\n\n“南边那龙椅上的小皇帝，快被自家的军阀撕碎了。”灰太狼低沉的声音像是在磨刀石上的锈铁一样喑哑，他的右手重重拍向了桌上的羊皮地图，在神州疆域划出五道深刻的裂痕。\n\n“这是我们拿回一切的时候了——拿回长城脚下，我们祖先的牧场！而不只是在这帐子里，像群快要老死的公羊般争吵！”\n\n羊族族长慢羊羊抚摸着梨花木拐杖光滑的曲线，眼皮都没抬：“你的狼骑即便能踏碎城墙，但是能踏出商路吗？我们七成的羊毛、三成的战马都要卖到南方。一旦开战，谁来养活草原的部众？用你的刀剑啃食风雪吗？”\n\n“我们可以抢！”\n\n“然后呢？抢一次，饿十年。你是在带领部落走向荣耀，还是带领整个草原走向坟墓？”\n\n“够了。”草原长包包大人终于开口，声音不高，却让屋内为之一静。他看向灰太狼：“狼王，你的勇气是草原的脊梁。但你可曾看清，我们身后的影子并不齐整？有多少部族，已经习惯了中原的茶叶与绸缎，甘愿做一只在圈里咩咩叫的肥羊？”\n\n他顿了顿，目光转向慢羊羊：“慢羊羊老哥，你的智慧保障了草原的丰饶。但你以为，我们不断的示弱，他们就会开出更好的价钱吗？不，他们只会在宰杀肥羊时，夸赞它足够温顺。”\n\n最后，他的手指重重地点在地图北方，随即又指向地图东方：“你们都在盯着南方的群狼相争。但真正的威胁，来自北方和东方——那头已经从冬眠中苏醒的赤色巨熊和日渐崛起的樱花王座。它们饥肠辘辘，它们的目光，从未离开过这片草原。”包包大人站起身，身影在火光中显得异常高大。“我们要做的，不是在群狼撕咬时凑上去分肉，那样只会被一并撕碎。我们要让南方的汉人、北方的熊和东方的倭寇都明白——”"
mon_flavor.6.a:0"“这片草原的主人，筋骨里流淌的依然是苍狼与白鹿的血。无论是谁想伸手，都得先做好被咬断喉咙的准备。”"

mon_flavor.7.t:0"为难的总督"
mon_flavor.7.d:0"两份截然不同的电报，几乎同时送达，一先一后，沉重的落在琳迪斯总督的案头。\n\n第一份来自羊村：“奶与蜜尚不足哺育羔羊，何来余物供奉朝廷。”每一个字都如同千载寒晶，透露着一股拒人千里之外的寒意。\n\n第二份来自征税官：“我等依律征税，却遭狼骑冲击，铳与衣物尽被夺走。”最后一句几乎力透纸背：“甚言：‘草原的肉与皮毛，只给草原的生灵！’”\n\n琳迪斯缓缓向后靠去，她闭上眼，指尖用力揉进突突发疼的额角，仿佛这样就能把脑中那几近沸腾的焦虑按下去。来自中原的八百里加急电报虽然只有寥寥数字，但每个字都如同千钧秤砣：“安北粮饷，关乎大局，速办”。\n\n朝廷的重压不断加码，境内的生灵从数十年的镇压下露出獠牙，琳迪斯无力的瘫倒在椅背上，一股深深的疲惫感，顺着脊椎缓缓散开。"
mon_flavor.7.a:0"“我还能怎么办？”"

mon_flavor.8.t:0"蒙古治下的和平"
mon_flavor.8.d:0"当最后一名抵抗者的军旗在怯薛军的炮火下化为齑粉，自大兴安岭以西发源的“创世之息”终于吹遍了全球的每一个角落。从美洲大平原到西伯利亚，横贯万里的草原意志已不再仅仅是地理上的奇迹，而是统治全球的唯一法统。这是一个由枪炮、鲜血与法典编织而成的全球铁幕，将破碎的世界强行缝合。曾经阻塞文明动脉的关税与国境线在铁蹄下悉数崩塌，一条“超级丝绸之路”让物产空前地流动起来，世界在神圣法典的规范下告别了无序的竞争。长生天的意志带来了一种名为“蒙古治下的和平”的绝对寂静，饥馑与掠夺在高效的物资调配网络中成为了历史名词，全世界的生灵在同一个忽里勒台的旗帜下，第一次拥有了足以跨越星辰的集体愿景。然而，在这如镜面般平静的盛世湖水下，致命的暗流从未停止涌动：被强行剥离的民族记忆在千户区的深处悄然生长，而那种依靠大汗个人威望维持的恐怖平衡，正像一柄悬在人类头顶的苏鲁锭长枪，每一秒都在颤动。\n\n在大都那座由钢筋混凝土与纯金装饰而成的“大汗宫廷”高台，艾黛尔贾特独自注视着脚下的灯火。\n她还记得1936年那个寒冷的夜晚，她在杭爱山的破旧军帐里惊醒，梦见成吉思汗那抹令人胆寒的微笑。那时她只是一个流亡的白军军官，只求在远东的边缘地区求存；而现在，她成了人类历史上权势最盛的人。但讽刺的是，她感受不到任何胜利的温度。\n“这就是你要给我的启示吗？”她抚摸着腰间那柄沾满了无数文明鲜血的战刀，自言自语道。\n她亲手终结了长达数个世纪的纷争，将分散的火种聚拢成燎原的圣火，但她也比任何人都清楚，这圣火是以全世界的自由为薪柴才燃起的。她想起梦中成吉思汗的微笑，那微笑里不仅有对征服的嘉奖，似乎还藏着帝国崩解时的冷眼旁观。艾黛尔贾特发出一声细不可闻的叹息，那是跨越七百年的孤独在共鸣。她成功了，她让世界在她的呼吸中颤栗或欢呼，但此时她心中却浮现出一个挥之不去的念头——这种前所未有的繁荣与统一，究竟是文明进化的终极答案，还仅仅是在永恒的分裂轮回到来前，长生天赐予这片草原最后的一场盛大幻梦？她缓缓握紧了拳头，即便深知繁华背后即是深渊，她也必须在这幻梦破碎前，用尽余生去守住这来之不易的寰宇晨曦。\n“长生天见证了这一切，”艾黛尔贾特望着繁星，眼中闪过一丝疲惫，“我终究只是在这个冰冷的宇宙里，为苍狼与白鹿续写了一场永不醒来的血色南柯。”"
mon_flavor.8.a:0"长生天之下，万物归一。"

mon_flavor.9.t:0"满清流亡者的支持"
mon_flavor.9.d:0"一艘瑞典籍货轮缓缓驶进大连港——这座城市已被元军攻占了两月，船身漆着模糊的商号，甲板上站着几个穿长衫、戴瓜皮帽的男人。\n对方对大连守军司令递上烫金名帖：“大清宗社党特使，携礼觐见伯雷帖木儿大汗。”\n带队的是个六十多岁的老者，自称载澍——肃亲王旁支后裔。\n“我等虽流寓海外，心系故国。”载澍躬身，声音微颤，“今见陛下重振大元，实乃天命所归。愿献薄礼，助圣朝光复中原！”\n守军司令不敢怠慢，急报库伦。\n伯雷帖木儿听罢汇报，冷笑一声：“前清余孽？还活着呢？”\n他本想挥手拒之——什么“宗社党”，不过是些抱着龙椅残梦的腐儒。在他眼里，\n满清早该和辫子一起埋进土里。他要建的是新元帝国，不是复辟戏台。\n可目光扫过清单，他顿住了。\n五千支步枪、五十锭黄金、还有一卷标注着辽东地下银矿与秘密地道的地图。\n他沉默良久，手指敲着桌面。\n属下察言观色，低声问：“陛下，如何回话？”\n伯雷帖木儿端起茶盏，吹了吹浮沫，语气平淡：“收下。回礼一匹蒙古马，十斤羊肉——按接待藩属之礼。”\n他没提“大清”，没称“贵党”，更没答应什么“共治天下”。\n但在密令中，他加了一句：“查其背景，若无间谍嫌疑，可允其在大连设联络处——只准送钱送枪，不准谈政。”\n夜深人静，他独自站在窗前，望着北方雪原。\n心里清楚：\n这些遗老送来的不是忠心，是绝望中的赌注；\n而他收下的，也不是援助，是乱世里不得不咽下的苦药。\n他看不起他们。\n可这世道，连大汗也得低头捡别人扔来的刀。"
mon_flavor.9.a:0"不要白不要"

mon_flavor.10.t:0"毁灭伪明孝陵"
mon_flavor.10.d:0"南京，钟山。\n\n初春的风还带着寒意，吹过明孝陵神道两侧的石人石兽，仿佛六百年前的低语仍在回荡。\n\n伯雷帖木儿立于陵前，手按军刀，目光如铁。他身后，黑万字冲锋队已备好火油、铁镐、炸药——只等一声令下，便要将这座象征“汉人复国”的陵寝夷为平地。\n\n“朱元璋推翻我大元，屠戮蒙古宗室，毁我祖庙！”他声音冷如霜刃，“今日朕既重立大元，岂容此逆贼安眠于钟山之阳？”\n\n爱新觉罗·黄尚上前拱手而道：“陛下！万万不可啊！毁陵易，安民难！此陵非朱元璋之私产，乃汉人千年正统之象征！康熙帝当年亲祭孝陵，行三跪九叩大礼，称‘明太祖功高千古’——非因心服，实因知民心系于此！”\n\n伯雷帖木儿冷笑：“朕非满洲皇帝，何须学那奴才样？”\n\n黄尚抬头，目光灼灼：“陛下不必效仿康熙祭拜！只需下一道旨：‘明孝陵乃前朝帝王陵寝，依礼保护，禁樵牧、禁擅入’——仅此八字，便可收江南士绅之心，息百万百姓之愤！”\n\n他压低声音，字字如钉：“得天下以力，守天下以礼。力可破城，礼可安魂！”\n\n伯雷帖木儿沉默良久。\n\n他知道，黄尚说得对。\n\n可他也知道，若退这一步，便是向“汉统”低头。"
mon_flavor.10.a:0"毁陵！以血洗史！"
mon_flavor.10.b:0"护陵。以礼制心。"

mon_flavor.11.t:0"钟山骨烬"
mon_flavor.11.d:0"南京，雨花台。\n四月的天本该温润，可今日的风却带着铁锈与焦糊的腥气。\n数万南京百姓被士兵用刺刀逼至广场中央，人人面如死灰。高台上，两具枯骨——一着残破龙袍，一披褪色凤冠——被铁链捆在柴堆之上。那是明太祖朱元璋与马皇后。\n就在一天前，明孝陵地宫被炸开。工兵用TNT轰碎六百年的封土，撬开楠木棺椁。将朱元璋与马皇后的遗骸拖出，在神道上曝晒于春日之下。伯雷帖木儿下令：“拉到雨花台，焚之示众！”\n伯雷帖木儿立于观礼台，嘴角噙着冷笑。\n “点火。”\n火把掷下，煤油轰燃。\n人群中怒吼如潮：“畜生！你们不得好死！”“跟他们拼了！”\n前排百姓红了眼，推搡着向前冲。\n伯雷帖木儿却早有准备。\n他轻轻一挥手。\n “扫。”\n高地四周，十二挺重机枪同时咆哮，子弹如雨泼下。\n血雾腾空，人群如割麦般倒下。哭喊、惨叫、奔逃的脚步踏过亲人的尸体。不到三分钟，广场只剩焦骨余烟与满地猩红。\n伯雷帖木儿转身，看向身旁脸色惨白的黄尚，讥讽道：\n“你不是说汉人重祖敬宗？怎么，骨头一烧，就只会哭、只会跑？”\n黄尚深深躬身，声音平稳如常：“陛下神威盖世，汉人不过蝼蚁，何足挂齿。”\n可他袖中双手紧攥，指甲深陷掌心，渗出血珠。\n因为他真的敬重朱元璋？不，他也同样痛恨这位汉人民族主义的象征。\n——但他知道，康熙帝当年亲祭孝陵，行三跪九叩，换得江南两百年太平；\n而今日这一把火，烧掉的不只是两具枯骨，更是大元坐稳天下的最后机会。\n汉人可以败，可以降，可以忍——\n\n但辱其祖、毁其陵、焚其骨？\n\n此仇，不死不休。\n他不敢抬头，怕眼中情绪泄露。\n因为雨花台的血，还没干。"
mon_flavor.11.a:0"他们以为烧了骨头就烧了魂……却不知，最烈的火，是从人心深处燃起来的。"

mon_flavor.12.t:0"零落成泥碾作尘，只有香如故"
mon_flavor.12.d:0"那晚特别黑，连月亮都躲起来了。\n\n垃圾堆在城南荒坡，离雨花台不远。蒙古人把烧剩的朱元璋夫妇骨灰全倒在这儿，像扔牲口骨头一样。野狗刨过，雨水泡过，连乌鸦都不愿落脚。\n\n秧秧和马小芳蹲在城南那个臭烘烘的垃圾堆边，手里攥着把豁了口的铁锹。骨灰就混在烂菜叶和煤渣里，风一吹，灰扑扑的，分不清哪是土、哪是人。\n\n“就是这儿？”马小芳问，嗓子有点抖。\n\n“嗯。”秧秧没多说，跪下来就开始挖。不是光捡灰——她连土一起铲，一把一把往怀里那个旧瓦罐里装。那是她娘腌咸菜用的坛子，洗得发白，还带着点盐味儿。\n\n马小芳看见半截烧黑的簪子，捡起来吹了吹，轻轻放进去。又摸到一小片焦布，金线都糊了，也塞了进去。\n\n“你说……咱们这辈子还能看见蒙古人滚蛋吗？”马小芳突然问。\n\n秧秧手没停，盖上罐子，拿麻绳一圈圈捆紧：“看不见，就留给咱娃。娃看不见，就留给孙子。总有人能挖出来。”\n\n她抱着罐子走到一棵老槐树下，坑早就挖好了。埋进去，填土，踩实。没立碑，就在树皮上划了一道——别人看是疤，她们知道是记号。\n\n回城路上，听见远处巡逻队的哨子响。两人低着头，走得飞快，像两个刚倒完夜香的普通丫鬟。\n\n谁也不知道，\n\n那棵老槐树下，\n\n埋着一个王朝最后的尊严，\n\n和一个民族不肯断的脊梁。"
mon_flavor.12.a:0"骨可焚，土不可夺"

mon_flavor.13.t:0"陨落"
mon_flavor.13.d:0"大都陷落前夜，伯雷帖木儿没穿龙袍，只裹一身黑貂大衣，带着十二辆装甲卡车的金银、玉玺、古画和三吨金条，悄然从紫禁城北门出逃。\n他早有退路——在蒙古腹地有一处秘密空军基地，藏有一架改装过的德制Ju-52运输机，加满油可直飞君士坦丁堡。\n“中原丢了，无妨。”他在颠簸的卡车上冷笑，“只要有钱，我在瑞士照样当皇帝。”\n可当他穿过戈壁，望见基地轮廓时，心猛地一沉——\n火光冲天。\n跑道上，油库在炸，机库在烧，守军尸体横七竖八，一群武装分子从四面冲出包围了车队。为首两人策马而出。\n左边那人正是虹猫；\n右边那人一身旧警服，肩章已摘，却仍戴那顶磨白的警帽——竟是黑猫警长。\n伯雷帖木儿怒极反笑：“好啊！堂堂前警备队队长，竟与土匪为伍？你对得起你的警徽吗？！”\n黑猫警长勒马停步，声音平静：“陛下，您还记得我辞职那日，留下的信写的什么吗？”\n伯雷帖木儿一怔。\n“我写道：‘法不可辱，职不可留。’”黑猫警长缓缓拔枪，“可您不仅辱法，还吃人。”\n他指向伯雷帖木儿的车队：“这些金子，哪一锭不是百姓的血汗？您想带着它们逃去国外当寓公？”\n虹猫冷笑接话：“草原上的狼，闻到血腥就追。我们追了您三百里。”\n伯雷帖木儿脸色煞白，还想喊“朕乃天命之主”，\n可黑猫警长没给他机会。\n砰！\n一枪爆头。\n虹猫下马，踢开尸体，从貂衣内袋摸出金印，随手扔给身后随从：“拿去熔了，铸犁头。”\n黑猫警长收枪，望向南方——那里，红巾军北伐的装甲先头部队已出现在地平线上。\n“走吧，”他对虹猫说，“我们的使命结束了。”\n两人并骑离去，\n身后，代表元朝的索永布旗在烈焰中化为灰烬，\n随风散入千年草原。"
mon_flavor.13.a:0"应该先公审他的"

mon_flavor.14.t:0"逃亡"
mon_flavor.14.d:0"天津港内海风咸冷，码头上乱作一团。达官显贵和满蒙王公的家眷挤在栈桥边，争抢最后几艘驶往海外的客轮船票。行李箱里塞满金条、玉器、地契，有人甚至把祖宗牌位裹在貂皮大衣里扛着跑。\n爱新觉罗·黄尚站在角落，一身素色长衫，提着一只旧藤箱——里面没金银，只有几本手稿、一卷地契（早转成圣杯币存单）、和一张东京帝国大学的聘书。他早看透了：伯雷帖木儿刚愎自用，这江山撑不过几年。\n正要登船，忽听一声粗笑：“哟，这不是黄大人？也蹽啊？”\n回头一看，一只耳歪戴礼帽，怀里搂着两个浓妆女人，身后跟着扛箱子的打手；旁边站着食猴鹰，一身崭新西装，墨镜闪亮，正叼着雪茄数钞票。\n“怎么，”食猴鹰咧嘴，“黄大人不是忠臣吗？不陪陛下死守紫禁城？”\n黄尚冷笑：“难道你们不是？”\n一只耳啐了一口：“妈的，老子给他卖命，结果连逃命的船票都要自己买！这叫卸磨杀驴！”\n“少废话，”食猴鹰拍拍箱子，“我在纽约唐人街买了三层楼，开赌场、贩烟土，比在这儿当狗强。”\n“我去伦敦，”一只耳得意道，“投奔表舅——他在东区开当铺，专收咱们这种‘流亡贵族’。”\n黄尚整了整衣领：“我去东京，教汉学。至少樱花人还敬字纸。”\n“话说你们知道奶龙怎么样了吗。”\n“那家伙屁颠屁颠的要‘起义’投向那些汉人，可我不觉得他们能饶了他的所作所为。”\n三人对视片刻，忽然齐声骂起来：\n“伯雷帖木儿那蠢货，以为靠单纯的暴力能压住汉人抵抗？”\n“红巾军那些泥腿子，竟真打到大都门口了！”\n“这世道，谁忠谁死，谁跑谁活！”\n远处，汽笛长鸣。\n“走了！”食猴鹰挥手，“后会无期！”\n“最好别见！”一只耳扛起箱子，挤进人群。\n黄尚最后望了一眼西方——大都方向，烽烟蔽日。转身，登船。\n三艘客轮先后离港，驶向不同大洋。\n而中华大地之上，红巾猎猎，直指皇城。"
mon_flavor.14.a:0"早晚要抓住他们！"
MON_taowang_tip:0"§C记住他们的流亡地点§!"

mon_flavor.15.t:0"大审判"
mon_flavor.15.d:0"大都——此时已被改回北平旧称，风还带着刺骨的寒意，可太和殿前的广场上却挤满了人。没有欢呼，没有哭喊，只有沉默——一种压得人喘不过气的、积攒了三百年的沉默。\n\n红巾军搭起的审判台就立在此处。黑万字总指挥黑小虎被押上来时，腿已经软了，嘴里还念叨着“大汗会回来的”，话没说完，法警一掌把他按跪在地。怯薛军大元帅倒是昂着头，直到检察官当庭展示万人坑里挖出的孩童鞋履——那上面还绣着“长命百岁”——他才猛地别过脸去。二十七人，无一赦免。判决书念完，只有一句：“即日枪决，菜市口行刑。”\n\n接下来是狼族。灰太狼被铁链锁着拖上台，一身皮袍早被血污浸透。狼族作为伯雷帖木儿的先锋，对汉人军民犯下了无数血债，灰太狼没有否认这一点，只说：“我实有罪，但求速死”。判决：死刑，绞刑。其余狼族将领，凡沾过血的，不是枪毙就是终身苦役。一个都没放过。\n\n轮到羊族时，气氛微妙地松动了。慢羊羊穿着粗布衣，自己走上台，深深一揖，他承认接受了蒙古封号，享受过贵族田产，却也出示了暗中放走政治犯的名册。在取得了部分政治犯的证言后，法庭最终判他流放青海十年，财产充公重建书院。羊族全族需公开忏悔，并参与重建被毁书院、祠堂。慢羊羊叩首谢恩：“愿以余生赎罪。”。\n\n最后一批，是那些金发碧眼的白俄。他们曾是沙皇的军官，后来成了蒙古人的屠夫。在与苏联特使会面后，法庭决定允许苏联派船来接他们“回家”。他们知道，NKVD会“热心招待”他们这群“老乡”的。登船那日，帝弥托利回头望了一眼中国的土地，喃喃道：“我们本以为东方是避难所……没想到，是最后一站地狱。”\n\n四十九天，七十三场审判。"
mon_flavor.15.a:0"钟声每响一次，便有一名战犯伏法。"

mon_flavor.16.t:0"乌克兰流亡者抵达"
mon_flavor.16.d:0"乌克兰已然陷落，赤旗已插上基辅行宫的穹顶。然而，并非所有忠于旧秩序的战士都选择了屈服。一支流亡队伍乘船至满洲，历经艰险跋涉，终于抵达草原边境。他们衣衫褴褛，却仍佩着白卫军的勋章；兵员寥寥，却誓言“只要一息尚存，便不向布尔什维克低头”。领队的邓尼金将军向艾黛尔贾特呈上佩剑，恳求道：“请容我等在蒙古草原暂栖刀锋。他日铁骑西指，愿为先锋！”"
mon_flavor.16.a:0"欢迎你们"

mon_flavor.17.t:0"搜捕特务"
mon_flavor.17.d:0"四九寒尽，草原初醒。冰封的溪流开始潺潺流淌，几只旱獭探头张望，村妇在水边浣衣——直到一声突兀的枪响，撕碎了这短暂的宁静。\n\n枪声来自一个形销骨立的男人：帝弥托利·亚历山大·布雷达德爵士，昔日沙俄近卫军的骄傲，如今只是流亡蒙古的一支残部指挥官。他军装破旧如麻布，唯有胸前那枚磨损的圣乔治勋章，还在暮冬微光中固执地闪着一点旧日荣光。腰间那把1881式恰西克军刀，是他仅存的体面。\n\n“查赤匪特务！”他嗓音沙哑，却强撑威严，朝天又开一枪，“这村子窝藏布尔什维克！”——其实他心知肚明，所谓“搜查”，不过是给手下这群饿疯了的溃兵借机抢粮抢马的遮羞布。他自己也已数日未食热饭，可若不纵容他们“就地补给”，这支队伍明天就会散掉。他不是不知军纪，只是……祖国已倾覆，活着，成了唯一的军令。\n\n村民们瑟瑟发抖，无人敢言。\n\n然而，下游忽起另一声枪响！紧接着，大地震颤——数十名兽族骑兵如黑云压境，铁蹄踏雪，卷起烟尘。为首者正是草原传奇游侠虹猫和蓝兔，目光如炬。\n\n“俄国人，”虹猫勒马于溪畔，声音不高，却字字如铁，“你的人，滚出我们的村子。”\n\n帝弥托利本能举枪，却在下一瞬惨叫倒地——一枚子弹击中他右眼，血流如注。他被亲兵慌乱扶起，再不敢回头，只在踉跄奔逃时咬牙低吼：“等我重整旗鼓……定报此辱！”\n\n而身后，村民默默望着远去的白军背影，眼中恐惧渐退，只剩悲悯与鄙夷。"
mon_flavor.17.a:0"帝国已死，但军人未亡——只是有些人，把苟活当成了使命。"

mon_flavor.18.t:0"背誓的枪声"
mon_flavor.18.d:0"政变部队推开了最后一道防线，帝弥托利喘着粗气，但手中的军刀依然稳如磐石。\n在大厅中央，艾黛尔贾特孤身一人。她没有逃，也没有呼叫援兵，只是静静地看着他。当帝弥托利逼近至五步之遥时，她缓缓屈膝，跪在了冰冷的地砖上。\n“你赢了，帝弥托利。”她的声音平静得可怕，听不出丝毫恐惧。\n帝弥托利握刀的手微微一颤。\n他看着眼前这个女人——她曾是他最敬重的领袖，也曾是他视为姐妹的战友。老将军临终的嘱托在她此刻的退让面前，似乎显得不再那么尖锐。\n也许，还有转机？他心中闪过一丝念头。如果她真的放弃野心，如果她能回归白军的初心……\n“艾尔……”帝弥托利的声音软了下来，刀尖缓缓垂下，“只要你发誓，从此不再以蒙古大汗自居，不再将俄罗斯人当作开疆拓土的奴仆，我们可以……”\n话音未落，异变陡生。\n艾黛尔贾特原本低垂的右手猛地从裙摆下抽出，一把袖珍手枪在阳光下闪过一道寒光。\n枪声在空旷的大厅里炸响。\n帝弥托利只觉得左肩一阵剧痛，整个人被巨大的冲击力带得向后踉跄。鲜血瞬间染红了他的军装。\n“天真。”艾黛尔贾特站起身，眼神中再无半点温情，只有彻骨的冰冷与嘲弄，“你以为这是过家家吗，帝弥托利？政治不是靠眼泪和誓言维系的。刚才那一枪，是给你最后的教训——对敌人仁慈，就是对自己残忍。”\n她再次举枪，瞄准了帝弥托利的眉心，嘴角勾起一抹残酷的笑：“现在，游戏结束了。”\n然而，她扣动扳机的速度，终究慢了一步。\n剧痛激发了帝弥托利骨子里的血性，他怒吼一声，不顾肩头的血肉模糊，拔出了腰间的配枪。\n“你说得对，”帝弥托利满脸是汗，眼中含着泪与火，“对敌人仁慈，就是对自己残忍。而你，艾尔，从你决定把同胞当成棋子的那一刻起，你就已经是我的敌人了。”\n艾黛尔贾特死死盯着他，嘴唇动了动，似乎想说什么，但最终什么也没说出来。\n砰！\n这一枪，终结了蒙古帝国最疯狂的西征梦，也终结了帝弥托利心中最后一点幻想。\n艾黛尔贾特的身体向后倒去，重重地摔在那张未完成的西征地图上。鲜血在她身下蔓延，仿佛为那片她渴望征服的土地，提前染上了血色。\n帝弥托利捂着流血不止的肩膀，跪倒在地，望着天花板，发出一声撕心裂肺悲鸣。\n他本想和解，却被逼成了刽子手。"
mon_flavor.18.a:0"而这一切，只因那一颗背叛的子弹。"

mon_flavor.19.t:0"匪帮的覆灭"
mon_flavor.19.d:0"多年匪患，一朝荡平。\n\n别烈思决心以铁腕整肃边防，调集警备队、民团与正规军三路合围，对盘踞草原的三大匪帮展开雷霆清剿。“食猴鹰”部在阴山峡谷被全歼，“一只耳”的马队于戈壁滩遭空袭覆灭，而臭名昭著的“奶龙”匪帮，则在试图越境逃往外贝加尔时被边防哨所截获。\n\n今日，三名匪首被押赴库伦东郊刑场。他们曾烧村掠畜、绑票勒索、奸淫掳掠，令牧民夜不敢眠。如今，五花大绑跪于雪地，昔日凶焰荡然无存。\n\n枪声三响，干脆利落。\n\n围观百姓爆发出震天欢呼——有人抛起皮帽，有人洒下奶茶祭奠亡亲，孩童骑在父亲肩头欢呼，老额吉们抹着眼泪，向监刑台上的身影深深鞠躬。\n\n别烈思身着笔挺军装，立于寒风中，未发一言。她身后，安北都司的军旗猎猎作响。民众却已自发呼喊她的名字：“别烈思！别烈思！”\n\n这一刻，黄金家族之女，不再是古老汗国的象征，而是草原安宁的守护者。"
mon_flavor.19.a:0"匪首伏诛，非为杀戮，乃为立信——信在法，不在刀。"

mon_flavor.20.t:0"新同僚"
mon_flavor.20.d:0"黑猫警长踏入总督府东廊时，几乎以为自己眼花了。\n\n那个站在暖阁门口、正与几名边军军官谈笑的那只公老鼠——不是“一只耳”是谁？可他身上穿的，却是崭新的草原警备队制服，肩章锃亮，腰间配的也不是弯刀，而是一把政府配发的毛瑟手枪。\n\n“黑猫老哥！”一只耳竟笑着迎上来，语气熟络得像多年故交，“往后咱们就是同僚了！总督大人开恩，给我个驿道巡防营的差事——专抓像我从前那样的混蛋！”他拍了拍胸口，金纽扣在冬日下闪着刺眼的光。\n\n黑猫没说话。他只盯着那只曾被他亲手打断三根肋骨的手，如今正稳稳地搭在枪套上。\n\n他转身就走，直奔总督办公室。\n\n别烈思坐在窗边，案头堆满卷宗。她没抬头，仿佛早已料到他会来。“你见到了。”她声音疲惫，近乎沙哑。\n\n“你招安了他们。”黑猫的声音像冻土裂开，“那些烧村、绑票、奸杀牧民女儿的畜生——现在成了我的同僚？”\n\n别烈思终于抬眼。她眼中没有愧疚，只有一种深不见底的倦意：“你以为我想？可我们没兵、没粮、没援军。袁氏在南边虎视眈眈，我们需要争取一切可用的力量。”她顿了顿，指尖轻敲桌面，“秩序，黑猫警长。有时候，秩序比正义更紧迫。”\n\n“那就不是秩序，”他冷冷道，“是交易。用百姓的血，换你的安稳。”\n\n她没反驳。只是轻轻合上卷宗，像合上一具棺材。\n\n三天后，黑猫警长交还佩枪、肩章与委任状，只带一匹老马、一杆旧步枪，悄然离开库伦。临行前，他在警备队大门外驻足良久，最终头也不回地策马西去，身影没入风雪茫茫的戈壁深处。\n\n草原从此少了一位执法者，却多了一个传说——一个不肯向“新秩序”低头的幽灵。"
mon_flavor.20.a:0"她以为招安能缝合伤口……却不知，有些裂痕，只会越拉越宽。"

mon_flavor.21.t:0"革新同盟殉道者追悼大会"
mon_flavor.21.d:0"库伦城南，万魂坡。\n\n草原已举义旗，安北都司与袁氏政权正式决裂。而今日，不是誓师，不是阅兵——是一场祭奠。\n\n别烈思下令在风雪中搭起百丈灵棚，九十九盏长明灯彻夜不熄。台上无名碑林立，刻着数百个名字——黎星刻、康佑薇、巴斓倪、柯芙……他们曾是省议员、报人、教师、军官，如今只剩一纸讣告，或连名字都不敢公开的“失踪者”。他们唯一的共同点：曾相信一个更公正、更自由的神州，并为此付出性命。\n\n两万军民肃立雪中。别烈思登台，未穿礼服，只着旧日士官学校制服，肩章磨损，却洗得发白。她声音低沉，却字字如铁：\n\n“他们不是叛徒。他们是殉道者。”\n\n“袁克定可以焚其骨、禁其名、抹其史——但他抹不去，我们在军校教室争论‘宪政是否可能’的那个下午；抹不去，我们在雨夜里油印《新民丛报》时，烛光映在每个人脸上的热望。”\n\n她顿了顿，望向南方，仿佛能穿透风雪，看见那座被铁幕笼罩的帝都。\n\n“我记得黎星刻说：‘若宪政需血浇灌，我愿为第一滴。’”\n\n“今日，我们以雪为酒，以风为歌，祭所有不肯跪下的魂灵——你们未竟之路，由我们踏血前行。”\n\n台下，无数青年军官低头拭泪。有人轻声哼起士官学校校歌，渐渐汇成一片低沉而坚定的合唱。牧民们将哈达系上灵幡，学生将手抄的《新民丛报》残页投入火盆——火光冲天，映红了整片雪原。"
mon_flavor.21.a:0"（以下为别烈思私密日记，未公开）"

mon_flavor.22.t:0"新血"
mon_flavor.22.d:0"草原的冬天，从来只认两种人：狼，和羊。\n\n可如今，在库伦城郊那座由旧喇嘛庙改建的“靖安军官训练营”里，第三种人正在集结。\n\n他们不是传统意义上的边军——没有世袭爵位，没有部落背景，甚至没有统一的面孔。有汉人军校生，因在军校内张贴反袁传单，遭通缉后北上；有蒙古王公子弟，拒绝继承旗札萨克之位，带着马队投奔义军；还有兽族——来自漠北的狼族、羊族战士。\n\n他们唯一的共同点：相信别烈思所说的那个未来——一个不再以种族、民族或出身划分贵贱的神州。\n\n别烈思亲自接见了这批“新血”。她没穿礼服，只着训练营的粗布作训服，站在雪地里与他们同吃一锅炖羊肉。当有人问：“大人真信我们能赢？”她指向远处正在操练的混编骑兵连——人类与兽族并辔冲锋，汉人与蒙古人共执一门山炮。\n\n“袁克定靠恐惧统治，”她说，“我们靠信任作战。”\n\n这些青年军官眼中燃起的光，比库伦城头的烽火更亮。他们知道，自己或许活不到胜利那天。但至少，他们能在死前，为一个值得的世界战一次。"
mon_flavor.22.a:0"他们说草原容不下杂色的狼群……可我们偏要证明，正是这杂色，才能撕碎黑夜。"

mon_flavor.23.t:0"[From.GetName]邀请我方加入讨袁联盟"
mon_flavor.23.d:0"一封盖有安北都司大印的密函，今日送抵你的案头。\n\n“袁氏篡国，囚君废宪，屠戮志士，神州危如累卵。安北已举‘奉天靖难’之旗，誓清君侧，复立宪政。今特致书阁下：若尚存救国之志、护民之心，望共襄义举，联兵南下。五族同心，何惧独夫？”\n\n随信附有一份《讨袁同盟纲领》草案：承诺战后召开国民制宪会议、保障各省自治权、废除军阀私兵、推行土地与教育改革。末尾一行小字尤为刺目：\n\n“顺逆之分，不在兵力多寡，而在道义所向。望公三思。”\n\n而你清楚：这不仅是军事抉择，更是政治站队。\n\n加入，便与北京彻底决裂，赌上全境命运；\n\n拒绝，则可能被视作袁氏同路人，在未来的“新秩序”中沦为边缘棋子。\n\n北疆的风，正等着你的回音。"
mon_flavor.23.a:0"义不容辞！加入讨袁同盟！"
mon_flavor.23.b:0"不关我的事"

mon_flavor.24.t:0"[From.GetName]加入讨袁联盟"
