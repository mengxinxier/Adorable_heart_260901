MON_new_tips:0 "蒙古（安北都指挥使司）的全新内容:\n\n-从远东一隅起步，见证§Y艾黛尔贾特·冯·弗雷斯贝尔古§!从流亡军官到新时代的成吉思汗，以铁血为缰、野心为刃，将蒙古铁骑化作席卷欧亚大陆的飓风。最终让日月所照之处，皆成§C蒙古帝国§!的疆土。\n\n-亲手打破艾黛尔贾特那不切实际的蒙古幻梦，§Y帝弥托利·亚历山大·布雷达德§!化身为复仇的凛冬与秩序的坚盾。誓要以手中长枪粉碎布尔什维克的狂热——率领光复之师从远东的冻土开始，横扫西伯利亚，一步步夺回俄罗斯的荣耀，让§G俄罗斯§!的三色旗再次在克里姆林宫上空高傲地飘扬。\n\n-草原人民挣脱枷锁，告别来自腐败朝廷的压迫，守护草原子民的尊严与自由。而未来是追随§Y喜羊羊§!构建法治与智慧的乌托邦，还是跟随§Y灰太狼§!开启铁血与征服的霸权征途，亦或是响应§Y兔子§!的号召投身均贫富的红色革命洪流？\n\n-草原保持了对神州中央的忠诚，但是奸佞袁克定祸乱朝纲，残害忠良。有志之士追随§Y孛儿只斤·别烈思§!——这位身为黄金家族后裔却高度认同华夏身份的新总督，高举“清君侧”义旗，以草原铁骑为锋刃涤荡浊流，圆那自由、平等的宪政之梦。\n\n-当神州大地分崩离析，旧日的秩序化为齑粉，这正是野心家们逐鹿中原的绝佳时机。§Y孛儿只斤·伯雷帖木儿§!，这位流淌着黄金家族高贵血脉的后裔，誓要以雷霆万钧之势扫平四海群雄，在这片破碎的山河上重铸§R大元§!的无上荣光。\n\n-当华夏大地在蒙元的铁蹄下再次陷入陆沉，伯雷帖木儿的恐怖统治笼罩四野。然而，汉人的脊梁从未在压迫下折断，就像早已埋在地底的岩浆，只待一个裂缝，便会喷涌成焚尽暴政的烈焰。§R第二红巾军§!的红旗在华夏遍地升起，誓要再次驱逐胡虏，恢复中华！"

