  PAY_GATHERING_STORM_DESC: "§R想要游玩魔女之树，请先选择阿修罗进入游戏，遵循路线指南进入游玩魔女之树§!\n\n继承与一意志，她将如闪电般归来，作为异次元人，对世界充满野心与理想，领导追随者们开辟新的历史吧！"
  CUB_GATHERING_STORM_DESC: "§R自从生命之树五个最强大的人回归，国家也渐渐变得强大，白蛇神作为神会再次拯救我们吗？§!\n\n阿修罗作为魔女的人，将跟我们对抗，瓦尔哈拉社与图书馆将是我们最牢靠的盟友，开启我们的故事吧"

