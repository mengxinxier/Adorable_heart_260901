  PAJ_60: "释放光之种"
  PAJ_60_desc: "或许连萌芽的时机都不尽相同。它是如此缓慢……但随着时间的流逝，所有人都将见证……它会带着变革的潮流环绕整座都市。人们将有机会直面自己的本心，并令其展现。……遗憾的是，我无缘见证那一幕。直到如今方才明白，你们在生命的最后一刻所说的“遗憾”意味着什么。"
