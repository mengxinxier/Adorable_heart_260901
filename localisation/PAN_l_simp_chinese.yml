  PAN_jhbc2: "交换彼此世界的碎片"
  PAN_jhbc2_desc: "南大陆那场漫长而暴烈的雨，终于停歇了。\n在雨后的寂静中，我们看见一面巨大的旗帜，从被涤荡过的大地上缓缓升起。那是火焰的颜色，也是用鲜血守护的誓言的颜色。“野火”……她们做到了。\n世界的舞台被不可逆转地改变了。新的主角登场，手中握着所有的牌。我们应该畏惧她们吗？还是说，这其实是……一个新季节的开端？\n她们的世界里，一定充满了我们未曾见过的碎片——在群山中淬炼出的钢铁，在抗争中诞生的独特技艺。而我们的世界，也同样有着她们或许需要的东西。\n与其在远处猜测彼此的色彩，不如就坦率地……伸出手吧。\n就让我们，试着交换彼此世界的碎片吧。看看将它们拼凑在一起时，是否能描绘出我们一直以来……都想见到的那片风景。"
  PAN_hbyz2: "将我们的后背映入眼中"
  PAN_hbyz2_desc: "我们交换了彼此世界的碎片，也从那些小小的物件中，窥见了对方世界的轮廓。她们的世界，比我们想象的……更加坚韧，也更加温暖。\n我们渐渐明白，我们虽然走在完全不同的道路上，但我们仰望的，或许是同一片想要守护的天空。\n世界的阴影，从未真正散去。那些潜藏在黑暗中的威胁，不会因为我们各自拥有了小小的光明，就自行消失。\n那么，既然已经伸出了手，是不是……可以再向前一步？\n将我们的后背，试着……交给对方。将彼此的后背，清晰地映入眼中。\n让我们试着并肩站在一起吧。看看当我们各自的光芒交汇时，是否能成为一道……连最深沉的黑暗，也无法吞噬的屏障。"
  PAN_xxbc: "心系彼此"


  LINYIN_DESC_1: "§Y凛音§!\n§Y异世界的枢纽§!\n  · $MODIFIER_STABILITY_FACTOR$：§G+5.00%§!\n  · $MODIFIER_RESEARCH_SPEED_FACTOR$：§G+5.00%§!"
  PAN_linyin_Diplomacy_desc: "§Y凛音§!\n@PAN§Y[FROM.Getname]§!的§C公主§!\n\n§Y异世界的枢纽§!\n  · $MODIFIER_STABILITY_FACTOR$：§G+5.00%§!\n  · $MODIFIER_RESEARCH_SPEED_FACTOR$：§G+5.00%§!"
  PAN_linyin_desc: "§L凛音来自异世界，属于植物族，（植物族在异世界的权力很高，第一位是天使，第二位是植物族，第三位是恶魔族。这些权力排名都是按照种族的实力决定的。）是这个种族的公主，因为世界之眼的关系，凛音小时候不小心被带到了这个世界，异世界语言跟这个国家用的是一个语言所以即使来到现界也能对话。凑巧遇上了小时候正在街上散步的希亚，两人就此结下缘分，就好像是结缘神从中搭线一样。长大后希亚当上火之心，而凛音当上了植物族的女王。希亚为了增加跟异世界的联系，于是打算亲自去异世界跟老朋友合作。于是为了方便两个世界的联系，由凛音担任现世的外交大使的身份，希亚觉得这样太对不起她，所以让她担任瓦尔哈拉社的公主大人，跟希亚一起管理这个国家§!"
  POLITICS_PAN_Yokinoya_DESC: "1927年8月希亚去苏联留学，在校期间学习了很多伟大先驱者列宁的思想，30年从列宁格勒大学毕业，原本打算在当地找份工作，但是听到了父亲的手下传来的消息，父亲在一场演说中意外死亡，由她来接替八百神明以及神圣之心的领导人。结城希亚她跟之前的那些人并不是一种想法，所以遣散了之前的八百神明，组建了瓦尔哈拉社。她想要以她的方法将祖国变得更加伟大。"
  MAKINA_DESC_1: "§Y樱咲蒔苗§!"
  PAJ_makina_Diplomacy_desc: "§Y樱咲蒔苗§!\n@PAJ§Y[FROM.Getname]§!的§C数据主管§!"
  PAJ_makina_desc: "废墟图书馆明面上宣布的领导人，负责管理灭杀AI部队，处理反抗者，并且删除错误。由其他世界中，马上被某个人删除数据之前，被安吉拉的邀请函带到这个世界。蒔苗本人非常感谢安吉拉，安吉拉也并没有把蒔苗变成一本书。"

  MAL_CEN_DESC_1: "§Y雨之魔女梣§!"
  MAL_CEN_Diplomacy_desc: "§Y梣§!\n@MAL§Y[FROM.Getname]§!的§C救世主"
  MAL_cen_desc: "§L涔在几百年来一直跟夏连特拉的女王一起管理政府。上次邪祟来袭时，救助了大量平民百姓。在1830年帮助夏连特拉进入半工业化，1840年全面性饥荒给予水之恩惠被历史记载为救世主§!"

