  Artifact_equipments_desc: "我们研究了1000年，也未曾了解如何制作高等的圣遗物，现在我们的仿造品相当于异世界B等级程度的造物，可以做到使用屏障，或者让身体变成金属来抵御冲击，也可以使用火焰燃烧敌人，但威力很小，无法对大范围敌人造成有效杀伤"

  PAN.1.t: "$news_event_background$塞跟与一正面交手"
  PAN.1.d: "臼沢塞出生的家乡，是个偏僻的小山村，是宫守村的部长，是最初的三位成员之一，和鹿仓胡桃、小濑川白望同为元老级人物。她有一副单边眼镜，似乎是熊仓敏给她的拥有魔物感应器的道具，她的眼镜是封魔镜，可以完全封锁其能力，使能力失效。当与一还在骄傲其能力的无敌性时，塞却给他带来了点小小的震撼"
  PAN.1.a: "民间的高手真多呀"
  PAN.2.t: "$news_event_background$来自瓦尔哈拉社的贸易"
  PAN.2.d: "瓦尔哈拉社向我们提出了两份协议，一份是她们想出口她们国家的香蕉巧克力豆等，另一份是协助她们开采地底的原石，我们应该如何选择"
  PAN.2.a: "我们想要购买香蕉" 
  PAN.2.b: "我们可以出口原石"
  PAN.3.t: "$news_event_background$精灵国想要购买香蕉"
  PAN.3.d: "我们国家非常适合种植这些，国内因为泛滥，导致根本不值钱，但外国这些价值不菲。"
  PAN.3.a: "好耶"
  PAN.4.t: "$news_event_background$精灵国同意了开采原石的协议"
  PAN.4.d: "我们泰拉大陆的原石非常的多，但我们虽然想用，但开采水平不行，精灵的帮助，让我们获得更多地下魔法的力量"
  PAN.4.a: "好起来了"
  PAN.80.t: "$news_event_background$瓦尔哈拉社想要解放美洲"
  PAN.80.d: "瓦尔哈拉的大使，不远万里向我们表达了她们的思想"
  PAN.80.a: "我们应当支持！"
  PAN.80.b: "我们还未准备好"
  PAN.6.t: "$news_event_background$库存赤字"
  PAN.6.d: "我们之前对战争的准备不太够，一年的战争加上我们的一天的武器产量不是很多，这导致前线已经出现三人用一枪的情况，我们立即派出外交大使向小樱请求援助"
  PAN.6.a: "她们会给吗？"
  PAN.7.t: "$news_event_background$来自瓦尔哈拉社的消息"
  PAN.7.d: "瓦尔哈拉社请求让我们进行武器援助，随后她们拿出了公文包，里面是黄金，我们要帮忙吗？"
  PAN.7.a: "同是共产主义的同胞，收钱太见外了"
  PAN.7.b: "我们同意了瓦尔哈拉的请求"
  PAN.11.t: "$news_event_background$小樱决定援助少量军火"
  PAN.11.d: "这些军火暂时缓解了部分赤字"
  PAN.11.a: "苏联的帮助我们会记得的"
  PAN.12.t: "$news_event_background$小樱决定援助大量军火"
  PAN.12.d: "这么多军火，我们的前线终于人人都有武器了，感谢苏联"
  PAN.12.a: "要尽快结束战争"
  PAN.8.t: "$news_event_background$结束了战争"
  PAN.8.d: "当我们打到了他们首都的时候，只剩下了“幽灵”和渡鸦在负隅顽抗，我们并没有抓住他们组织的首领与一"
  PAN.8.a: "可恶，让他跑了"
  PAN.9.t: "$news_event_background$拯救圣遗物使用者的战争"
  PAN.9.d: "中美洲的圣遗物使用者之间的战争终于结束了，瓦尔哈拉接纳了阿修罗的人民，希亚正在重建当地工业，恢复秩序"
  PAN.9.a: "太好了"
  PAN.9.b: "终于结束了"
  PAN.98.t: "$news_event_background$结城希亚的决断"
  PAN.98.d: "结城希亚认为，美洲需要变革，需要有先行者，那么我能成为先行者吗？"
  PAN.98.a: "自信的希亚会有她应得的！"
  PAN.99.t: "$news_event_background$瓦尔哈拉将要解放美洲"
  PAN.99.d: "美洲被压迫的民族和被压迫的人民，再争取政治、经济、文化、方面的独立和解放的斗争中共同努力，争取从帝国主义和资本主义的压迫中解放出来。这就是我们的希望！"
  PAN.99.a: "瓦尔哈拉荣光尚存"
  PAN.99.b: "战火纷飞的时代"
  PAN.16.t: "$news_event_background$九条都的世界"
  PAN.16.d: "回到一周目Bad End（这条线因为单独挑战魔眼，被他能力石化）前:在和与一交谈前被拥有部分记忆的翔(这个比较重要是nine的这个世界的同调体，也是nine)阻止。随后出现的是被死前的伊莉丝给予其他分枝记忆和工艺品的与一，并要求翔装入全部的记忆。两人对决时，被丢在一旁而愤怒的都夺走翔的记忆后，直接夺走血液并眷属化，随后强硬的要求 你（nine）装入记忆。之后又因为不听都的话暴怒完全觉醒能力，夺走两人的能力，甚至用两人的能力威胁与一听话，让与一让翔杀死自己的想法给撤回。在最后和翔哥的对话中坐实了她感觉到你(nine）的认知so喵都才是正主呗最后拥有全部记忆的两人决定重新开始培养感情。"
  PAN.16.a: "九条都原来在她的世界里这么强呀"
  PAN.14.t: "$news_event_background$香坂春风的世界"
  PAN.14.d: "众人潜入神社后却被伊莉丝发现，伊莉丝展开领域，抵抗力低的都、天直接昏迷，希亚靠毅力坚持了下来。伊莉丝将世界之眼吞进身体，计划彻底失败，翔开始在伙伴们的帮助下使用苏菲给予的火焰Artifact与伊莉丝正面冲突。之后莲夜和与一赶到，但最后不敌伊莉丝，重伤落败。莲夜和与一撤退前，与一将魔眼和幻体的Artifact交给了翔。翔利用自己拥有的Artifact和Overlord的回档能力与伊莉丝抗衡，最后经过希亚的劝说嘴炮，春风觉醒了自己的能力，唤醒了昏迷的都和天，最后一套连招将世界之眼从伊莉丝体内拽出来并打碎，成功击退了伊莉丝。虽然伊莉丝仍然存在，但由于丧失了同调对象，以及无法从翔手中夺取世界之眼，她已经无法干涉这条分支了。"
  PAN.14.a: "伊甸的女王！"
  PAN.15.t: "$news_event_background$新海天的世界"
  PAN.15.d: "nine遇见幽灵。在幽灵秒杀苏菲缇雅，即将石化nine时，天出现，能力爆发，将幽灵放逐。妹妹的能力是控制存在感，而不是控制存在。放逐是利用了世界的特性而不是能力效果。之后，天因为能力暴走，存在感逐渐消失，只有男主还能勉强记得。男主拜托苏菲缇雅制作解除与圣遗物（Artifact）契约的药剂安薄绒（Ambrosia），但因为不同世界人种差异，该药剂要重新研制否则喝了会当场去世，所以需要让天打起精神，撑过这段时间。期间，天逐渐不再被自动门、手机等电子产品识别，能力还影响到了nine，nine也不再受人和电子产品识别其实香坂春风还记得nine。苏菲的药剂在几天后准时送到"
  PAN.15.a: "幸好药剂送到了"
  PAN.13.t: "$news_event_background$伊莉丝来临"
  PAN.13.d: "察觉到翔（现实世界nine的同位体）的行动与其他分支不同后开始主动出手，让其他人因Artifact失控来制造混乱。于5月1日藏起世界之眼以阻止翔的行动。在5月20日将大量人们Artifact制造混乱其实是试验能不能同调不是同一存在的个体，并假装被翔他们击败以获得几百年的安稳时间研究Overlord。研究成功后回溯到5月20日和与一联手并同调与一，团灭瓦尔哈拉社（Valhalla Society）。于是nine回溯了这条线"
  PAN.13.a: "我们还有机会"
  PAN.23.t: "$news_event_background$裁决伊莉丝"
  PAN.23.d: "在了解自己真正的工艺品（Artifact）—世界之眼的碎片和你（nine）的存在后等到今天。与与一对峙时，翔请求你（nine）传输其他分支的全部记忆之前Overlord传输记忆时没有传输关于爱情的记忆，之后生成四位女主的幻体，并拜托你（nine）通过向其他分支的女主们导入记忆来让成为眷属的她们使用世界之眼的碎片与幻体同调后开始与与一的决战。并开始单方面的虐杀途中与一的身体完全被伊莉丝夺走，伊莉丝使用The Order打算将你（nine）杀死，在被杀死前一刻与你（nine）断开联系，你（nine）顺着苏菲的帮助下与同样拥有世界之眼的沙月联系，最后在苏菲、沙月和你（nine）的协助下将所有分支的伊莉丝的灵魂绑定，而翔和蕾娜携手制造出一个唯一的机会让希亚使用最大化输出的The Order将所有枝叶上的伊莉丝全部消灭。长时间极限使用能力下，身体和精神都到达了极限，最后拜托你（nine）将胜利的消息传达给其他分支，但不要传输这条分支的残酷记忆，随后在屋顶沉沉睡去。"
  PAN.23.a: "终于结束了，辛苦了"
  PAN.20.t: "$news_event_background$结城希亚的世界"
  PAN.20.d: "漫长的平静后伊莉丝突然发难，将大量的人们Artifact化引起大混乱，并通过眷属化进一步传播。最后在购物中心的决战中希亚使用春风强化过的The Order给予同调在成濑沙月上的伊莉丝最后一击并在这条枝上击败。苏菲通过世界之眼确认伊莉丝的气息消失，几乎可以确定伊莉丝在这条分支上死亡，而其他分支的伊莉丝也不可能干涉这条分支。同时，苏菲因为需要立刻关闭世界之门以阻止Artifact继续流入到这个世界，而向翔他们暂时告别。威胁消失，和平的日子来临了。"
  PAN.21.a: "以为这就结束了？天真~"
  PAN.21.t: "$news_event_background$nine"
  PAN.21.d: "你（nine）回到了苏菲空间，苏菲说如果要获得最终胜利则需要杀掉伊莉丝的真身，这样才能剪断她创造出Overlord的分支。但是杀掉现在的伊莉丝是不行的，必须要杀掉创造出Overlord的伊莉丝。意思是未来的伊莉丝一直在未来，她只是通过Overload帮助现在的伊莉丝同时伊莉丝已经和与一同调，这也成为了胜利的障碍.nine试图趁瓦尔哈拉社（Valhalla Society）聚会时保护大家，但本不该出现的与一突然到来。nine试图通过不停的杀掉与一来制造循环，但与一的目标一直是希亚等人,决战全灭的失败重演。与一第二次回溯后nine陷入了绝望。翔想在伊莉丝与与一同调前杀死与一，但伊莉丝与与一仅在翔用Overload继承记忆的5分钟后就完成了同调，并且翔在5分钟内无论如何都无法到达与一的所在处。与一宣言“该去收尾了”后离开，nine为了确认其他同伴的安危而四处奔波，直到晚上。绝望的nine回到了家，迎接他的却是希亚的尸体、都、天、春风三人的Artifact和与一。与一宣言不论重来几次都会把翔重视的人全部杀死。但此时nine还有一些希望，接下来要秘密做一些事情，打算在这条线做个了解"
  PAN.21.a: "与一你不得好死"
  PAN.10.t: "$news_event_background$幻体"
  PAN.10.d: "与一的幻体叫幽灵。新海翔向苏菲索取了属于他的幻体Artifact，本来想重构幽灵的外貌却由于事发紧急只改了瞳色和衣服的颜色异色版本。事后给幻体重新取名为蕾娜。"
  PAN.10.a: "迷之少女"
  PAN.0.t: "$news_event_background$与一的突袭"
  PAN.0.d: "梨俱吠陀首领叫与一，与一有多个Artifact，幽灵是与一的幻体，莲夜是与一的眷属。以他们三个为首手下还有一堆支持他们的圣遗物使用者，对我们发动了突然袭击"
  PAN.0.a: "国家进入一级紧急状态！"
  PAN.24.t: "$news_event_background$希望苏菲提供帮助"
  PAN.24.d: "瓦尔哈拉的特使nine来到苏菲面前，请求nine的引导，瓦尔哈拉并没有完全获得我们白蛇神大人的信任，要去帮助吗？"
  PAN.24.a: "只提供部分力量，去帮助一下吧"
  PAN.24.b: "很可能是第二个与一，我们要做好一切准备"
  PAN.25.t: "$news_event_background$希望苏菲提供帮助"
  PAN.25.d: "瓦尔哈拉的特使nine来到苏菲面前，请求nine的帮助，瓦尔哈拉因为这次轮回得到白蛇神的信任，我们要亲自出击吗？"
  PAN.25.a: "她们是一群善良的孩子，通知幻体准备出击"
  PAN.25.b: "虽然如此，但我们还是谨慎一点为好，通知她们我们暂时静观其变"
  PAN.26.t: "$news_event_background$苏菲提供引导"
  PAN.26.d: "苏菲把她的部队交由你控制，自己则打算只提供信息上的帮助"
  PAN.26.a: "白蛇神的引导！"
  PAN.27.t: "$news_event_background$苏菲拒绝了"
  PAN.27.d: "nine传来消息，苏菲并没有同意，而且据说她们再进行军队动员，这非常的不妙。nine回来的时候拍到了当地的人照片，nine将照片递到希亚手上"
  PAN.27.a: "感觉不妙"
  PAN.28.t: "$news_event_background$苏菲亲自出场"
  PAN.28.d: "结城希亚的耳边传来了声音，一道紫色裂缝突然出现了一个红色的布偶，是苏菲，她跟我们讲了关于幻体的事情，并将幻体交付于我们，还有纵火的圣遗物，和圣枪的圣遗物。苏菲离开的时候说，我将动用生命之树的权利，让这场闹剧尽快结束"
  PAN.28.a: "白蛇神世界第一可爱！"
  PAN.29.t: "$news_event_background$苏菲突然出现"
  PAN.29.d: "结城希亚的耳边传来了声音，一道紫色裂缝突然出现了一个蓝色的布偶，是苏菲，她跟我们讲了关于与一的事情，魔眼其实是有破绽的，只要不跟她直视就不会出事，随后说，作为世界之眼的观测者，我不方便现在就提供援助，请见谅。另外注意，部分属于异世界的人，被不明物质黑化，小心她们的进攻，说道苏菲给我们一张图片"
  PAN.29.a: "这个消息很重要"
  PAN.30.t: "$news_event_background$苏菲想要暂时管理一部分土地"
  PAN.30.d: "苏菲想要暂时管理一部分土地，更加密切得合作，我们给她吗"
  PAN.30.a: "给"
  PAN.30.b: "不给"
  PAN.31.t: "$news_event_background$瓦尔哈拉同意了"
  PAN.31.d: "我们将更加密切的合作"
  PAN.31.a: "好！"
  PAN.32.t: "$news_event_background$瓦尔哈拉拒绝了"
  PAN.32.d: "我们也没有办法，这或许将延缓合作的脚步"
  PAN.32.a: "坏！"
  PAN.33.t: "$news_event_background$苏菲的选择"
  PAN.33.d: "苏菲好像有她自己的想法，我们也不好多说什么"
  PAN.33.a: "顺其自然吧"
  PAN.35.t: "$news_event_background$科技突破"
  PAN.35.d: "科技部门传来一条令人开心的消息，我们终于发现了如果提高圣遗物质量的办法，并对大部分圣遗物进行了改良处理"
  PAN.35.a: "$news_event_background$终于突破瓶颈了"
  PAN.36.t: "$news_event_background$首个试验性圣遗物"
  PAN.36.d: "我们终于发现，圣遗物的特性在于可以成长，就跟植物一样，魔力就是养分，使用者就是土地，我们需要更多更多的训练新一代的使用者"
  PAN.36.a: "就像我们的朋友植物族一样，多么巧的事情呀"
  PAN.37.t: "$news_event_background$柚子社大使团请求支持"
  PAN.37.d: "我们的国家需要一些帮助和支持，请问贵国能否提供帮助呢"
  PAN.37.a: "小小帮助一下好了"
  PAN.37.b: "鼎力支持"
  PAN.38.t: "$news_event_background$突发事件"
  PAN.38.d: "希亚再回家的途中，经过一个十字路口不小心被撞倒了...所幸是没有伤到关键部位，但需要休养一阵子"
  PAN.38.a: "花了一周奇迹的痊愈了"
  PAN.38.b: "真不幸..."
  PAN.39.t: "$news_event_background$明月的过往"
  PAN.39.d: "因为接触到栞那的蝴蝶，栞那的记忆流入梦中.梦中得知栞那第一次的死神工作就是引导夏目前世的灵魂，但灵魂每次转世都生活在不幸福的家庭后死去，死去后再次被栞那引导，并抱着更强大的愿望再度转生，使得灵魂渐渐强大。灵魂过于强大的关系让遇上车祸后能引发奇迹回溯时间，但这次事件不能坐视不管，使魔猫猫判断只能收割灵魂且无法再转生。栞那受不了这样的悲剧而协议并牺牲自己，只夺走一部分的灵魂，直到灵魂切割后造成的冲击和肉体安定前将自己的灵魂分给夏目。死神没有肉体，灵魂传给夏目后存在会极度不稳定。醒来并得知一切的夏目发现蝴蝶后与蝴蝶一起直接去店内找使魔猫猫询问。询问后两人在店外发现大量蝴蝶，夏目再次引发奇迹，将意识暂时回到被夺走部分灵魂的那一天。意识回到现在后却在店内阁楼发现本该不存在的栞那，使魔猫猫推论是因为奇迹中一起带去的大量蝴蝶在当时彼此接触的同时以栞那留下的蝴蝶作为核心让栞那转生成了人类。"
  PAN.39.a: "作为死神的她原来是这样的"
  PAN.40.t: "$news_event_background$死神的镰刀"
  PAN.40.d: "活过百年以上的死神女，和使魔猫猫一起行动。对高科技下的产物没任何知识，主要工作为引导灵魂（蝴蝶），处理还在人世间游荡的衰弱灵魂。交谈中有时会顺势捉弄人，并发出尼嘻嘻的笑声."
  PAN.40.a: "原来是老古董"
  PAN.41.t: "$news_event_background$夏目的情结"
  PAN.41.d: "幼年时期一直重复着住院、出院，因为这个原因没办法参加圣诞派对，也不被朋友邀请过，对周围产生距离感，怕因为自己倒下了而耽误朋友们度过快乐的时间，自己选择与周围拉开了距离。虽然前往医院的次数渐渐变少，但这种生活已经开始对周边的事物漠不关心、不再期待。去年使魔猫猫出现在夏目面前并说了如果继续这样生活下去，灵魂就会消散，并变成蝴蝶。述说着的夏目同时也提到在回溯世界前的当天，夏目也跟希亚一样死在同一场车祸中，灵魂的一部分也成为蝴蝶从身上流失，就算回溯后也是很危险的状态。由于处在消极的生活下，在当天封存的蝴蝶也很衰弱且无法回到原本的灵魂里。经过了一系列的事件后，已经不打算放弃一切，蝴蝶回到夏目的灵魂中."
  PAN.41.a: "夏目的过往真令人伤心"
  PAN.42.t: "$news_event_background$事情的真相"
  PAN.42.d: "我们听死神小姐说其实再那次事故中，希亚真的被车创死了，但是时间被回溯了，灵魂部分变成蝴蝶状，飘落再空中，其他人看不见只有死神能看见..."
  PAN.42.a: "可恶呀"
  PAN.43.t: "$news_event_background$刺激凉音"
  PAN.43.d: "夏目以自己做的焦又硬的松饼引起凉音的注意（怒气），并借用厨房自制一份松饼给其他人品尝差距，最后以希望顾客能绽放笑容为关键词成功让凉音找回动机并自行要求雇用."
  PAN.43.a: "这女人真好对付"
  PAN.44.t: "$news_event_background$神圣之心的阶级"
  PAN.44.d: "我们国家原本的领袖是火之心，其实是民众所认可，她正义勇敢，能很好的用她热情的心感化她人。新的领袖冰之心，再历史的长河中并不是能促进国家发展的，可能只是因为她是神圣之心第二阶所以才会投票选她吧？"
  PAN.44.a: "冰之心的新改革会让民众觉得她们没有选错！"
  PAN.45.t: "$news_event_background$柚子社的会议"
  PAN.45.d: "夏目以及赤色盾卫局觉得应该提升幸福度，明月和公会势力认为应该继续建造工业，凉音以及科研部认为要以教育为主，我们应该选择谁的方案"
  PAN.45.a: "选择夏目的方案"
  PAN.45.b: "选择明月的方案"
  PAN.45.c: "选择凉音的方案"
  PAN.46.t: "$news_event_background$废墟图书馆请求军事援助"
  PAN.46.d: "我们的前线非常缺武器，希望贵方能提供支援"
  PAN.46.a: "我们齐心协力，共御外敌"
  PAN.47.t: "$news_event_background$瓦尔哈拉提供武器支援"
  PAN.47.d: "我们的盟友给我们送来了非常多的武器装备，我们的前线终于不缺武器了"
  PAN.47.a: "我们齐心协力，共御外敌"
  PAN.48.t: "$news_event_background$都市的意志"
  PAN.48.d: "拇指的指令是必须实行的，指令的内容比如说让你去砍掉自己的手，如果你实行了，拇指将会保护你一天的安全，如果你不实行将会付出代价，比如说灭口。指令的实质其实是都市意志的体现，也就是都市人意志的体现。因此，无论多么残忍的指令，都是都市人的意志。因此，都市人害死了他们自己。这也是都市病的一种体现"
  PAN.48.a: "真是残酷"
  PAN.49.t: "$news_event_background$残响乐队"
  PAN.49.d: "阿尔加利亚：罗兰。真的不愿和我攀谈几句吗？哪怕一句话都？罗兰：事到如今还有什么好说的？我们各自的目的都已经相当明确了吧。阿尔加利亚：让我想想，你站在这儿和我对峙的理由不会只是因为安吉拉受了些伤吧？没可能呀。你现在分明是在为自己那完美的计划突然泡汤发小脾气吧？罗兰:你才是那个把它搞砸的人……阿尔加利亚：那么我所做的事又算是什么呢……不正确的行为吗？而我也无法理解那是否是正确的……正因人类被那所谓的正确限制着才会停滞不前，不得不过着不幸的生活啊。罗兰：……你在胡扯什么。阿尔加利亚：而那所谓的正确常识便是经常被人称作“定义”的东西呢.时间为何只会向固定的方向流逝？那种想法为何会被认为是正确的呢？裁定是否正确的标准究竟又是什么？……为何要用这样的标准去裁定呢？那“定义”不正是为了阻止我们进一步发展而划下的界限般的存在么……为何所谓的正确会约束人类的欲望呢？为何不能让人类更进一步发展呢？"
  PAN.49.a: "下一页"
  PAN.50.t: "$news_event_background$残响乐队续"
  PAN.50.d: "阿尔加利亚：我虽也曾对此有所困惑，但我很快便得出了答案。而我……现在便要将那答案传达给整座都市。罗兰：建议你好好琢磨琢磨说的那堆屁话结合起来是个什么狗屁意思。你是想表达自己能够跳出那个框架去逆转时间吗？可别继续把你的人生浪费在那些无聊的奇思妙想上了。阿尔加利亚：不，那是有可能做到的哦？你们无法跳出这个框架的理由不正是因为你们设下了名为“不可能”的桎梏并因此对其究竟能否做到产生了怀疑吗？在将那桎梏抛去后，我们也能够无止境地在蓝天下翱翔。这并非是假设，而是可以确信的事实。罗兰：扯了这么多，到头来你也只是想将自己身上所承受过的苦痛彻底消去而已吧？罗兰：你也不过是想要践踏蹂躏我、都市、还有夺走安吉丽卡的安吉拉而已吧。阿尔加利亚：哈哈哈……你竟然以为我和你一样么？真是鼠目寸光啊。我并不是想将我曾遭受过的苦痛原封不动地返还给你哦。哦，不过也不能完全否认呢。最开始时我确是怀有那样的想法。毕竟那称得上是我的唯一的光芒竟被两度夺去……"
  PAN.50.a: "下一页"
  PAN.51.t: "$news_event_background$残响乐队终"
  PAN.51.d: "阿尔加利亚：但这都只是暂时的……在那架钢琴面前，我百感交集。绝望、执念、愤懑、悲痛……但那些感情与想法很快便烟消云散了。一切都……是啊。我眼前的一切都突然变得那么美丽，那么美妙。“我失去了你，但这真的称得上是悲剧吗？”。“将这定义为悲剧的又是谁呢？”。罗兰，现在的你仍被愤怒蒙蔽着双眼，而我已然决定不再在意那些感情。罗兰：但你这混蛋现在仍在以“为了安吉丽卡”的名义纠缠着我……阿尔加利亚：不，罗兰……我马上就要和这场演奏一同送别安吉丽卡了哦。阿尔加利亚：我可不会像某人一样丑陋地胡作非为呢。阿尔加利亚：以“为了安吉丽卡”为名义是不能证明自己的行为并未染上肮脏的欲望的，这不过只是个令人厌恶的借口罢了。：这场演奏将会是我最后的领悟，同时人们也都将从这演奏中理解我所要传达的。而这首挽歌也将成为我为安吉丽卡所做的最后一件事。哈哈。你仍旧戴着那副手套呢……真让我恶心。罗兰：……闭嘴。"
  PAN.51.a: "残响乐队事件结束"
  PAN.52.t: "$news_event_background$白夜黑昼"
  PAN.52.d: "脑叶公司光之种发射后（又称“白夜黑昼事件”）在都市开始普遍发生的一种怪异现象。导致部分人开始扭曲。扭曲主要表现为一些建筑或人类的外貌‘莫名其妙’的出现变异，并开始以各种形式影响他人的正常生活，轻者会变的没有知觉走向死亡（比如头部变成浮空的气球），重者则会引发如同自然灾害一般的混乱（比如通过弹奏‘音乐’使30万“听众”变为音符的钢琴家）。扭曲并非凭空发生，而是经历了相当时间的‘集聚’过程，扭曲现象以不同的程度存在于几乎所有都市人的身心，但在一个“爆发期”前，该变化往往是难以以肉眼察觉的，如果能在这时对其加以正确干涉，那么扭曲现象的“爆发期”将会得以延后。关于扭曲和神备的浅显联系，我们可以试着把都市人的内心看做一个简单的横条，左侧是消极，右侧是积极，消极情绪积累，则会偏向扭曲，积极情绪积累，则会偏向神备。扭曲出来的钢琴家将一个巷的人全部杀死，其中还包括一个漆黑色彩收尾人"
  PAN.52.a: "这种破事不要再提了"
  PAN.53.t: "$news_event_background$罗威尔事件"
  PAN.53.d: "最近以L巢为中心，扭曲的数目正呈指数级增长。六协会南部2科部长罗威尔带着手下袭击造成扭曲的图书馆。梅：科长先生的新婚房也是这种感觉吗？罗威尔：邵会喜欢更可爱一些的……罗威尔：……梅！专心工作不要闲谈。塞希尔：1科科长原来是这种喜好……我会记住作为参考的。安吉拉：各位来宾，欢迎你们的到来。罗威尔：还有其他话吗？情况紧急，还望早些引领我等入场。为了它抛弃幸福的日常生活，这真的值得吗。梅：好奇人类日常生活的机器吗~罗威尔：这正是为了守护所谓幸福的日常生活而必须做的事情。想做的事铢两分寸，要做的事恒河沙数。安吉拉：……原来如此。"
  PAN.53.a: "嗯。愿您……找到想要的书。"
  PAN.54.t: "$news_event_background$邵事件"
  PAN.54.d: "邵带领着六协会南部1科，闯入图书馆想要夺回罗威尔的书，拼到除她以外全员阵亡。邵：全员阵亡，无一幸免。正于此地，你们与我并肩奋战到最后一刻.....尔后消逝。孤神一人，亢龙有悔。空余黑暗，不见前路。何去，何从。迈步向前的勇气，从何而来。你们直至最后，又在坚信什么。我绝不会被自己召来的绝望击垮，更不会心生畏惧。坚韧不拔，持之以恒，让我深信不疑。我仍将为己身而战，绝非漠视为我献上性命的各位同胞。独木不成林......倒是趣事一桩。我纵茕茕孑立，难避漫漫长夜。然长夜终尽，天将启明......惟以平旦之孤星，何胜东方之既白。还请觉悟。今朝此日，都市一星，势必陨灭。 "
  PAN.54.a: "不可能？难道她神备了？"
  PAN.60.t: "$news_event_background$陆军科技的选择"
  PAN.60.d: "从步兵到炮兵，从装甲到机械化我们应该选择一种进行强化"
  PAN.60.a: "坦克改良"
  PAN.60.b: "步兵改良"
  PAN.61.t: "$news_event_background$海军科技的选择"
  PAN.61.d: "驱逐防卫还是航母打击呢？科技层如何选择"
  PAN.61.a: "驱逐防卫"
  PAN.61.b: "航母打击"
  PAN.56.t: "$news_event_background$堇紫泪滴"
  PAN.56.d: "阿尔加利亚聚集了所有的团员后，伊織来到残响乐团的营帐。阿尔加利亚起先感谢伊織帮助自己，后来却突然改变了态度。阿尔加利亚质问伊織帮助自己的理由，因为卡门的声音告诉他们伊織并非由于同情才出手相助。在伊織承认了自己的动机后，阿尔加利亚认为伊織已经没有利用价值，在普鲁托事先设下的结界内想要和团员们一起杀死伊織。在紧急关头，伊織拿出早已收到的邀请函，并被传送至图书馆。在图书馆内，伊織表示自己知道安吉拉的事情。当安吉拉询问她帮助的理由时，伊織并没有正面回答，只是要求安吉拉将自己变为书籍。她表示自己仍将全力应战，如果图书馆未能胜利就毁灭图书馆。安吉拉变得不耐烦，还没等伊織询问罗兰的事就开始了接待。"
  PAN.56.a: "好了。图书馆的威名，就让我来领教领教吧？"
  PAN.62.t: "$news_event_background$食指"
  PAN.62.d: "“食指，仅听从指令行动的手指。”食指是都市中五大手指中的一支。食指内部存在四个级别：苦行者，传令员，代行者，纺织者。其中纺织者不为人所知。“食指内部，部分人员会受指令选召，并自行决定是否成为苦行者。如若踏上苦行之路，就需以眼罩蒙住眼睛进行活动。当然，使用眼罩并不具有十分重大的意义，只是为了修行时不为眼前的各种情况而动摇，能够严格遵从指令的意志。1名代行者通常会带领5到6名苦行者，学习食指的纪律以及各个级别的职责。如若苦行者已具备一定程度的能力，指令便会赋予其传令员或代行者的职位。被赋予新职位之时，便可解开眼罩并获得量身定制的剑。”"
  PAN.62.a: "下一页"
  PAN.58.t: "$news_event_background$漆黑噤默"
  PAN.58.d: "“安吉拉：果然。你来到图书馆并不只是什么偶然吧，罗兰。罗兰：是啊。到现在这一刻为止，我可是做了我人生中最大的博弈呢。安吉拉：原来如此。你并不是为了我才协助我获得自由的……你只是在妥善地利用我而已。罗兰：别弄得自己像是受了多大委屈似的。我可没有在你的自由大业中偷过懒哦？在你抵达这个最终关头前我可都是在倾尽全力地帮助你呢。即便那些帮助再怎么微不足道，你我之间也只能算是相互利用罢了。安吉拉：所以？你在我这里收获到了什么？罗兰：蛮多的。我前来图书馆的目的便是为了寻找诸如钢琴师之类的扭曲产生的缘由。我同样也为谁才是诱发这一切的罪魁祸首而好奇。罗兰：归根结底，这一切都因你而起……安吉拉。倘若曾经在脑叶公司时的你并未在那最后关头奋力挣扎过，这一切也都不会发生。安吉拉：你为何没有在我们初次相遇时便立刻阻止或杀掉我？"
  PAN.58.a: "下一页"
  PAN.59.t: "$news_event_background$漆黑噤默续"
  PAN.59.d: "罗兰：……第一，初次见面时我还不是能够杀死你的存在。第二，我想知道你为何会做出这样的决定。第三，我认为你也许能做出与我不同的选择。以及，第四，我要在这最后的最后……再为你奉上那极致的失落与痛苦。现在的你已经拥有了完整的人类身躯。不论是痛苦还是死亡都能够好好地品味到了。我清楚我们彼此都曾经历过痛苦与挫折，也都经历过失去。因此我能够理解你为何会做出这样的决定。在看着随时间流逝而深陷苦恼之中的你时……我也曾想过自己也许会有能做出其他选择的余地吧。如果你选择了其他的答案的话……如果你真的那样做了……没准我也会选择其他的答案吧。但，你终究没有。是，我所遭受的那些痛苦与你曾忍受过的那百万年间的痛苦相比确实没什么大不了的……但那又如何？那天，我在那台该死的钢琴前发了誓。我定会将那因失落与挫折衍生出的悲伤返还回去，返还给夺走了我的世界的都市。"
  PAN.59.a: "下一页"
  PAN.65.t: "$news_event_background$漆黑噤默续"
  PAN.65.d: "罗兰：……第一，初次见面时我还不是能够杀死你的存在。第二，我想知道你为何会做出这样的决定。第三，我认为你也许能做出与我不同的选择。以及，第四，我要在这最后的最后……再为你奉上那极致的失落与痛苦。现在的你已经拥有了完整的人类身躯。不论是痛苦还是死亡都能够好好地品味到了。我清楚我们彼此都曾经历过痛苦与挫折，也都经历过失去。因此我能够理解你为何会做出这样的决定。在看着随时间流逝而深陷苦恼之中的你时……我也曾想过自己也许会有能做出其他选择的余地吧。如果你选择了其他的答案的话……如果你真的那样做了……没准我也会选择其他的答案吧。但，你终究没有。是，我所遭受的那些痛苦与你曾忍受过的那百万年间的痛苦相比确实没什么大不了的……但那又如何？那天，我在那台该死的钢琴前发了誓。我定会将那因失落与挫折衍生出的悲伤返还回去，返还给夺走了我的世界的都市。"
  PAN.65.a: "下一页"
  PAN.66.t: "$news_event_background$漆黑噤默终"
  PAN.66.d: "罗兰：安吉拉，你定会变得与我一样悲伤的……不，不仅如此。你还要遭受更多的痛苦才行。是你将那对我来说便是一切的安吉丽卡夺走的。而我为了这一刻，我旁观了相识之人的死亡，手刃了情谊深厚的老友。为了这一刻……我在你的身边压抑着所有的情感，强挤着笑容。安吉拉：……你哭泣时的样子真令人觉得陌生。现在，该让那些狗屎一样的作秀结束了。我会赌上我的一切，用你难以想象的各种方式……亲手令你体会到这个世界上最痛苦的死亡。而我也要在你即将迈向自由的那一步前，将一切全部夺走。：我会将一切尽数奉还给你的……安吉拉：……我只是想从我的痛苦中得到补偿而已。罗兰你用与自己夺取光芒时相同的论理，以需要付出代价的名义杀死了那些来到了图书馆的人们。却从未考虑过这种行为会带来怎样的因果报应。这是因为你对自身以外的事情一概保持着视若无睹的态度。但我并不会因此指责你。我也无权指责你。"
  PAN.66.a: "是啊，这就是都市……一码归一码。"
  PAN.55.t: "$news_event_background$加里翁"
  PAN.55.d: "Garion（Binah之前的名字，译作加里翁）作为都市管理机构——首脑中的调律者。会使用妖灵和“锁“禁锢敌人，并可以震击粉碎空间。用“柱”远距离击退敌人"
  PAN.55.a: "世界的调律者已经苏醒"
  PAN.57.t: "$news_event_background$纯真的自我"
  PAN.57.d: "卡门:我记得那个人。曾是一个内心温暖的人。虽然我从未亲身感受过那股温暖…………真叫人惋惜。时至今日依然带着痛苦回忆的我。裂开的心，只要有人敲击，就会支离破碎。现在，终于可以去做一直期待着的事了。如果能将情感宣泄出来……我终会成为自由的存在。安吉拉:没错。心灵的裂缝永远无法填补。就算我向他复仇……结果也会是一样.所以更应该就此放手……如果重复这一循环，枷锁只会以同样的方式回到我身边.不能因为害怕和愤怒，就忽视被过去所束缚的不安。那也是此时此刻，组成我的一部分。我会带着它们，带着我所做的一切，继续走下去。所以……到此为止吧……如果成为人类，抛弃过去的话...."
  PAN.57.a: "难道说AI也想变成人？"
  PAN.67.t: "$news_event_background$奥利维耶"
  PAN.67.d: "……堇紫泪滴。我照您的吩咐做了。现在，只剩下以我的方式一决胜负。罗兰：……奥利维耶。加入了哈娜协会，还用上这种危险的奢侈品。可真是下了血本啊？嘴也变罗嗦了。奥利维耶：好久不见，罗兰……我还在想你什么时候现身。果真是在保护这模仿人类的怪物吗？罗兰：哦嚯，什么怪物？分明是我的上司兼朋友啊？安吉拉。这位朋友由我一人应对，请暂且退下吧。这件事应该由我自己处理。是我必须了却的一件事，不用担心。安吉拉：知道了……需要帮助的话随时可以告诉我。奥利维耶：时光一去不返了，罗兰。你也是怀揣着所有的悲愤在这台机器旁工作着的吧，想必早已有所觉悟了。罗兰：我知道。我们彼此已经走得太远，能久违地和你聊天真的很开心，奥利维耶。奥利维耶：一码，归一码，不是么？罗兰：……没错。一码，归一码。奥利维耶：……开始吧。"
  PAN.67.a: "事件结束"
  PAN.63.t: "$news_event_background$食指之书"
  PAN.63.d: "以斯帖：……阳传令。下一则指令是否就绪？阳：当然。给。以斯帖：以斯帖，格洛丽亚，休伯特及其苦行者前往图书馆……对吧。格洛丽亚：嗯？图书馆~？我们终究还是要进去呢~阳：……你怎么会知道？以斯帖：一副预料之外的表情啊，阳传令。我已经知道，你传达的指令是伪造的。格洛丽亚：你说什么~？一直以来只有我被蒙在鼓里！？阳：……什么时候发觉的？以斯帖：那不重要。阳：尽管如此，你们还是选择与拇指开战……现在又要亲自踏进图书馆那座坟墓吗？以斯帖：我只是遵从指令。以斯帖：“忠实履行阳传令传达的指令。”阳：……结果，早就写在指令上了。阳：指令到底……知道多少？因为指令失去了家人，杀死了朋友，夺走了他人珍视的东西，对一切冷眼相待……饱受罪恶感的折磨，但还是咬紧牙关继续执行。因为指令必须执行！指令……因为它会将我们引向正道。阳：可指令为我指引的道路是什么样子的？"
  PAN.63.a: "事件结束"
  PAN.64.t: "$news_event_background$残响乐队后续"
  PAN.64.d: "罗兰：无论如何，我们阻止了那个疯子集团。这些书籍的力量也和以往那些大不相同。安吉拉：邀请函的指引到此为止了。这里即是终点。罗兰：祝贺你，安吉拉。终于结束了。能够获得人类的身体，不必再像机器一样运作了吧？安吉拉：是啊。今后我自由了。光芒已经汇聚在了一处。完整的人类之躯……然后获得自由。这一切多亏了你。谢谢你……罗兰。只要从光芒中取出我的书就行了。罗兰：很好。那么我也可以收尾了。……安吉拉。如果是你，应该明白我之后要做什么吧？"
  PAN.64.a: "事件结束"
  PAN.68.t: "$news_event_background$拇指"
  PAN.68.d: "拇指内部由上到下存在四个级别：教父，二老板，指挥官，士兵。拇指极端重视阶级，除非得到允許，低阶人员不得向高阶人员发问，同時要无条件服从阶级高于自身之人所下达的任何命令。违者立刻处死。上级可以暂时将权力下放给下级。一般来说，这只会发生在因为内部情况无法出席会议，或是需要将下级更为专业和了解的情报转告至同级对象。这样的情况比想象得更为罕见。也就是说，拇指并不会单纯为了“下克上”之类的恶趣味而进行职位的移交。这种阶级体系在帮派之外也同样适用。普通的收尾人就是士兵，协会直属收尾人是指挥官，翼的董事会成员则能与二老板相提并论。无论平时有着怎样的处事风格，既然面对的是我们拇指，那就应该时刻注意自己的阶级，遵从我们的纪律。如果对方拥有与我们相同的阶级，那么我们会非常乐意同对方进行交流。不要觉得不公平，阶级可不是随便动动嘴皮子就能得到的，这是它应得的尊重。"
  PAN.68.a: "事件结束"
  PAN.69.t: "$news_event_background$殷红迷雾"
  PAN.69.d: "一位为了守护他人而战的收尾人……诚然，她的实力非常强大。而她英雄一般的行迹，更是令无数人将她奉为偶像。虽然同为特色，也并非所有人都同殷红迷雾那般行事。虽然活动区域完全不同，我未能亲眼见到， 不过来到这里见过后，发现她比想象中来得更好。大概也能明白为什么她会那么强大了。重要的可绝不仅仅是强大的力量。安吉拉使用脑叶公司之书邀请到了研究所时期的卡莉（特色为殷红迷雾，也就是后来的Gebura），卡莉为了脑叶公司之书中Cogito的制作方法只身战斗。她手中拿的是原型E.G.O —— 拟态。虽然原型E.G.O威力不如后来脑叶公司提取的E.G.O，但由于卡莉引以为傲的技巧和力量，她能将拟态蕴含的力量发挥到最大。"
  PAN.69.a: "到头来你们也是一帮装模做样的家伙"
  PAN.70.t: "$news_event_background$首脑来袭"
  PAN.70.d: "安吉拉：那么，首脑如今才大驾光临此处的理由是？[首脑-调律者]珍娜：来将你和图书馆逐出都市。珍娜：顺带回收我那……于这图书馆中支离破碎的同僚。罗兰：你那是什么意思……珍娜：将整座图书馆从L巢移至郊区。珍娜：图书馆如今已是这座都市的杂质。我等已无法再继续坐视不理。珍娜：只是因为你。安吉拉。身为非人之物却怀揣着人类的情感。机器啊……不管你再怎么倾尽心力，倘若你生不为人那你终究无法成为人类。虽然你曾在最后关头获得了变成人类的机会，但你却在那关键时刻放下了一切。倘若你最后成为了人类，我还是愿意接纳你融入这座都市之中的。安吉拉：我以机器的身躯留在这座都市中也并无什么所谓。珍娜：有心的机器在这座都市中可没有任何容身之处。珍娜：你无法摆脱为你赋予了定义的诞生。安吉拉：那又怎样？能够为我赋予定义的理应只有我自己。我不需要任何外饰。"
  PAN.70.a: "下一页"
  PAN.71.t: "$news_event_background$首脑来袭续"
  PAN.71.d: "罗兰：如果我们在这儿将你们全部杀掉了呢？珍娜：对你们与此地的驱逐仍将按照计划进行。这是不可避免的。珍娜：不仅仅是你们与图书馆，L公司本身便是首脑的污点与耻辱。安吉拉：果不其然。为了打压L公司的奇点与最终目标，你们派出了调律者Binah……安吉拉：不，你们派出了加里翁，但她失败了，不是吗？[眼线-凝视者]鲁妲：加里翁处事时实在是过于轻率。正因如此一个小小的裂痕才会发展成巨大的裂隙。]珍娜：安吉拉……一台怀有人类心灵的机器。珍娜：都市的大门不应因你而关闭。安吉拉：所以说你要做的事就是在杀了我后将图书馆转移到郊区，是吧？珍娜：是的。珍娜：……处刑者。[爪牙-处刑者]巴拉尔：……！"
  PAN.71.a: "开始了"
  PAN.72.t: "$news_event_background$首脑来袭续"
  PAN.72.d: "珍娜：你已经累了？我仍尚未正式开始呢。……不。现在才露面啊。Gebura：……我们在哪儿见过？罗兰：安吉拉让我再坚持一下……是为了唤醒你啊……Gebura：我好不容易才过来帮你一把，看起来你还不怎么满意啊。罗兰：……姐，我不是对您有什么不满。Gebura：行了。打起精神来吧，真没想到你这么快就垮了……珍娜：你们二人齐心协力也不会带来什么变化。Binah：……看来的确是这样，说的话变长了，空隙便也会暴露出来。珍娜：加里翁……真是好久都没有听到过这个名字了……虽然它已经不是为了我而存在的了。珍娜：我早已有所耳闻……但真没有想到与你的相遇竟然如此之晚。Gebura：……你怎么现在才来？Binah：我先前也只是在一旁观望了会儿你们的样子而已。珍娜：现在我等会亲自将你们送往郊区，但你们倘若再次回到这都市之中，我便只能认为你们对我等的这般诚意置若罔闻。珍娜：希望你们能够在自己该待的地方好好呆着。"
  PAN.72.a: "也不是坏事，至少我们释放了光之种"
  PAN.73.t: "$news_event_background$图书馆释放了光之种"
  PAN.73.d: "代表的希望的光之种被释放在美洲大陆上"
  PAN.73.a: "我们的努力并非无用"
  PAN.73.b: "美洲的新闻记录了这历史性时刻"
  PAN.74.t: "$news_event_background$AI将会取代人类的地位"
  PAN.74.d: "安吉拉已经将区域内的人都转化成自己的仆从，下一部将会是谁呢"
  PAN.74.a: "变化在所难免"
  PAN.74.b: "AI?她有几个师？"
  PAN.75.t: "$news_event_background$天音"
  PAN.75.d: "杂鱼~杂鱼~你连最基本的防御都不会吗"
  PAN.75.a: "拳头硬了"
  PAN.77.t: "$news_event_background$阵线大会"
  PAN.77.d: "瓦尔哈拉邀请我们去规划战后土地安排"
  PAN.77.a: "来力！"
  PAN.102.t: "$news_event_background$希亚的任职期"
  PAN.102.d: "希亚认为后勤是战争的命脉，而其他人认为是更强大的魔力，但是希亚觉得自己是正确的，我们该如何选择"
  PAN.102.a: "考虑一下"
  PAN.102.b: "采纳"
  PAN.108.t: "$news_event_background$伊莉丝正式出现"
  PAN.108.d: "与一其实早就得知伊莉丝会出现，只不过需要点时间才能降临，于是他之前才对征服瓦尔哈拉信心满满"
  PAN.108.a: "伊莉丝万岁！"
  PAN.122.t: "$news_event_background$与一逐渐退出历史舞台"
  PAN.122.d: "由于伊莉丝完全掌控了大局，得到了教会和人民的双重认可，与一的权利越来越少，就在前不久他主动辞去军队职务"
  PAN.122.a: "与一只是我伊莉丝的饲料罢了"
  PAN.124.t: "$news_event_background$夺取与一身体"
  PAN.124.d: "由于没有外界阻力，伊莉丝成功偷袭了与一，将其身体控制权夺走"
  PAN.124.a: "完整的力量快要来了"
  PAN.131.t: "$news_event_background$完全同调与一"
  PAN.131.d: "同调花了点时间，与一这具身体完全适配我，这将发挥完整的力量"
  PAN.131.a: "接下来该做些什么高兴的事情呢"
  PAN.130.t: "$news_event_background$联系同位体"
  PAN.130.d: "我并没有发挥完整的力量，只是附身到了这个世界的我，力量发挥不完全"
  PAN.130.a: "毕竟都是我还客气什么赶快来吧"
  PAN.125.t: "$news_event_background$暂时的休整"
  PAN.125.d: "内战带来的创伤比较严重，我们需要花点时间来恢复"
  PAN.125.a: "开摆"
  PAN.126.t: "$news_event_background$边境防御"
  PAN.126.d: "我们计划建设一条保卫边境的要塞"
  PAN.126.a: "开始建造"
  PAN.123.t: "$news_event_background$与一下台"
  PAN.123.d: "与一主动辞职并将下一任首领选为沙月"
  PAN.123.a: "退位开始"
  PAN.140.t: "$news_event_background$击退伊莉丝"
  PAN.140.d: "由于伊莉丝并没有解放所有力量，我们只是这个世界线击退了她"
  PAN.140.a: "总算是打败她了"
  PAN.101.t: "$news_event_background$阿修罗新闻"
  PAN.101.d: "传言说他们好像找到了新的帮手"
  PAN.101.a: "是谁？"

  PAN.91.t: "$news_event_background$来自瓦尔哈拉的军事装备援助"
  PAN.91.d: "近日瓦尔哈拉为我们的内战送来了武器装备"
  PAN.91.a: "谢谢希亚"
  PAN.90.t: "$news_event_background$瓦尔哈拉的互帮互助条约"
  PAN.90.d: "瓦尔哈拉跟我们商量之后合作的条约，今后将一起反帝反资本"
  PAN.90.a: "好"
  PAN.90.b: "我们暂时没法接受"

  PAN.400.t: "选择操纵魔力强度"
  PAN.400.d: "为了让世界不一样，所以悄悄加点东西"
  PAN.400.a: "无"
  PAN.400.b: "必须加满"
  PAY_decision_category1: "超级牛逼的决议"

  PAN.309.t: "来自“神社”的包裹"
  PAN.309.d: "统一的庆典喧嚣过后，南美大陆迎来了一个漫长而疲惫的喘息期。\n就在今天，一个意想不到的访客，打破了指挥部的平静。她自称来自“瓦尔哈拉社”，那个一直以来与我们保持着微妙距离、如同生活在另一个世界的朋友。\n她没有带来繁复的外交辞令，也没有提交冗长的国书。她只是将一个看起来并不起眼的木盒，轻轻地放在了桌上，然后便安静地告辞了，留下一句：“这是我们世界的一点心意。”\n此刻，这个盒子就静静地躺在面前。打开它，里面没有预想中的珍宝或武器图纸。\n盒子里，是一块打磨得极其光滑、触手生温的白色石头，石头上，用一种我们从未见过的技艺，雕刻着精致而复杂的纹路，似乎蕴含着某种奇妙的力量。石头的旁边，是一封用上好纸张写成的信。\n信的字迹，优雅而克制：\n“致南大陆新生的火焰：\n我们看见了你们的胜利，也感受到了这片大地之上，那股正在苏醒的、崭新的脉动。\n世界，似乎正因你们而变得……稍稍有些不同了。\n我们各自的世界，都拥有着对方所不了解的‘色彩’。与其隔着遥远的距离互相猜测，不如，就从交换一些小小的‘碎片’开始吧。\n这块石头，是我们世界力量的结晶之一。或许，在你们那里，它能展现出我们未曾想象过的用途。\n而我们，也同样对你们世界里……那种能将无数人的意志，淬炼成钢铁的力量，抱有真诚的好奇。\n期待着，你们的回应。”"
  PAN.309.a: "那么，我们应该送些什么呢？"
  PAN_jhbc_TT: "我们和(§Y[LHS.Getflag][LHS.GetName]§!)双方都将获得资源贸易的优惠。"

  PAN.310.t: "一份“不同寻常”的合约"
  PAN.310.d: "瓦尔哈拉社的使者，再次来到了我们的面前。\n这一次，她带来的，是一份我们从未见过的“合约”。它被书写在一卷散发着柔和光芒的特殊卷轴上，上面的文字，似乎会随着观察者的心跳，而产生细微的流动。\n使者的言辞，依旧简洁而郑重：\n“世界的阴影，从未真正散去。我们各自的力量，或许能守护住自己脚下的一方土地，但当真正的黑暗降临时，孤立的光，是脆弱的。”\n她将卷轴缓缓展开，推到我们面前。\n上面的条款，并非冰冷的军事条文，更像是一段……相互的誓言。\n它写道：\n“当威胁的阴影，笼罩住你们的天空时，我们的力量，将成为你们的第一道屏障。\n当未知的敌人，叩响我们的大门时，我们希望，能听到你们从远方传来的、坚定的脚步声。\n这并非要求对方为自己流血，而是一个承诺——承诺当一方陷入黑暗时，另一方，将成为为她点亮归途的、不灭的灯火。”\n这是一种我们从未理解过的、属于她们世界的结盟方式。它不谈利益，不谈指挥权，只谈……守护与回应。\n这或许很天真。\n但不知为何，看着卷轴上那些流淌着微光的文字，我们却感受到了一种比任何钢铁铸成的条约，都更加坚固的重量。"
  PAN.310.a: "这份信任，我们不能辜负"
  PAN_hbyz_TT: "我们和(§Y[LHS.Getflag][LHS.GetName]§!)双方都将获得共同的有关军事的民族精神。"
  PAN_mrzg_TT: "我们将解锁§Y土地建设决议§!，且每完成一项§Y土地建设§!都会使我们和(§Y[LHS.Getflag][LHS.GetName]§!)：\n基础设施建造速度:§G+1%§!，\n民用工厂建造速度:§G+1%§!，\n战略资源获取效率:§G+1%§!，\n政治点数:§G+1%§!"



























  CUB.1.t: "议会与白蛇神讨论民用企业计划"
  CUB.1.d: "选择议会还是白蛇神的方案？"
  CUB.1.a: "白蛇神"
  CUB.1.b: "议会"

  CUB.2.t: "议会与白蛇神讨论军用企业计划"
  CUB.3.t: "议会与白蛇神讨论船坞计划"
  CUB.4.t: "苏菲幻体"
  CUB.4.d: "白蛇神已正式介入战争，为了尽快达到和平的目的，派出了最精锐的幻体"
