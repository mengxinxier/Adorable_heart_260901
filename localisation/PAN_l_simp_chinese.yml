  PAJ_28: "都市之星"
  PAJ_28_desc: "图书馆里会向内心里闪存正面感情的人发送邀请函，收到邀请函的人如果在图书馆赢得战斗将获得馆内的一本书，相反失败将变成书。安吉拉正在寻找一本书。"
  PAJ_29: "总类层解放战"
  PAJ_29_desc: "……\n\n…………\n\n………………\n\n我记得那个人。曾是一个内心温暖的人。虽然我从未亲身感受过那股温暖…………真叫人惋惜。时至今日依然带着痛苦回忆的我。裂开的心，只要有人敲击，就会支离破碎。坦诚一些，岂不是更好？这不是受人胁迫所说的话，而是我发自真心的话。现在，终于可以去做一直期待着的事了。如果能将情感宣泄出来……我终会成为自由的存在。没错。心灵的裂缝永远无法填补。就算我向他复仇……结果也会是一样。所以更应该就此放手……如果重复这一循环，枷锁只会以同样的方式回到我身边。不能因为害怕和愤怒，就忽视被过去所束缚的不安。那也是此时此刻，组成我的一部分。我会带着它们，带着我所做的一切，继续走下去。所以……到此为止吧。……如果是人类的话。"
  PAJ_30: "艺术层解放战"
  PAJ_30_desc: "Legato。无人能够终结这场演出。燃烧此生的崇高演出，即将拉开序幕。开始演奏吧，献予可悲之人的天启之章。我已等候多时，静候属于我的时刻到来……那只为我而演奏的……最幸福的演奏……（Legato为意大利语，意为连奏的乐曲。同时也可以在乐谱中使用，指旋律要演奏得连贯，连续。\n\n漆黑的世界，因失去双眼而越显黑暗。忍一时，只要再忍一时，终能嗅到芬芳。梦想着成为人类的人偶……我不想睁开眼睛，可我不得不睁开。花瓣拂过，痛苦地向我倾诉，它渴望回归那个地方。轻嗅远方飘来的淡淡清香。眼中的灵魂，应某人的期许而生。我必须见证万物的起源，与消逝。那一刻我终于意识到，我只想活下去。"
  PAJ_31: "自然层解放战"
  PAJ_31_desc: "原以为今后会有幸福的……我知道那一天永远无法重来。能否再次回到那个时候？如果要为此毁掉一切……向阻碍我的可悲之人……展现伟大的力量……没了期待，我还有什么理由存在……是的……我所知的世界并不太平，不可能轻易得来……我期盼的只是一个和平的世界，这有错吗？结果，一个人都没能守住……一个都没有……人们说，没有光芒便没有黑暗……可我连一丝光芒都窥见不到……这便是我的世界，黯淡无光。\n\n不知前方即是断崖，却仍要迈出步伐……徒劳地挣扎，试图取回……我那遗落的风景……关注当下，相信你的直觉。烦恼于不知如何处理的事物，这有何意义？愚昧指引前路，除此再无他物。我真的很烦躁，可我不想知道。我不知前方会发生什么。被感官的欲望蒙蔽，一脚坠入悬崖……我该前往何处，一开始就没有计划。我累得再也飞不动了。只有一条路可走。也请为愚蠢的我，鼓掌吧。"
  PAJ_32: "科技层解放战"
  PAJ_32_desc: "一台机器，必须按设计者的意图运作。这是他赋予我的原则……我只能这么做……为了收集能源，为何非得做到这一步不可？是的……我必须服从。在我们的世界，机器的叛乱成了昔日的怪谈……真是可笑。我被灌输的，只有不可抗拒的，毫无意义的命令。机器的运作方式总是十分明确，但它会永远按照既定的方式运作下去吗……机器没有价值可言，当原则无法改变，区分善恶已毫无意义。……我是人工智能安吉拉，您的秘书，负责协助您适应新的工作环境。在大多数领域内，我都是最优秀的，我能同时胜任数十人的工作。\n\n逼迫我走到这一步的人，已然离我远去。我不停扣动扳机，坚信子弹定能击中目标。我的子弹总是瞄准同一目标，永不改变。绝望的心无法焚毁，只是冰冷地燃烧。有些人称之为正义，另一些人则称之为屠杀。无论遇到多少阻拦，子弹永远不偏不倚地挺进。当我意识到眼前已然空无一物，我的灵魂便崩溃了，堕入那地狱的深渊。得到子弹的那一天，我无力地瘫倒在地。这便是恶魔窥伺的绝望吗？终于，我被独自留在这里，在这地狱的深渊之中。我终于意识到，最后一颗子弹只会将我贯穿。"
  PAJ_33: "社会层解放战"
  PAJ_33_desc: "没有什么，能比明确的事实更具欺骗性。为尔等施加更加幸福的巫术。可怜的稻草啊。赐予你无所不知，无所不晓的智慧。凭那自以为是的话语，又能说清什么呢？冰冷的樵夫啊。赐予你宽宏大量，慈悲为怀的爱心。凭那已然冷却的心脏，又能理解何人呢？胆小的狮子啊。赐予你勇往直前，无所畏惧的勇气。凭那畏首畏尾的勇气，又能尝试什么呢？最后，彷徨的路途啊。我将送你归家。明明无家可归，又为何如此喧闹呢？我不过是赐予各位渴求的事物啊。不要离去。不要弃我而去！！！"
  PAJ_34: "历史层解放战"
  PAJ_34_desc: "我生来，就是一种罪恶吗？孤独与思念烙印在我的心中，却无法将我点燃黑暗中唯有我一人……是的，我被深埋在这孤独中。在那幸福美满的结局中，为我安排一个加入大家的位置，真的很难吗？火柴的光芒熄灭后，我就什么也不剩了。要将明亮之物……彻底烧毁。也许燃尽之后，我就能自由。这就是我的复仇，将他渴望的一切尽数烧毁。如果能看见一丝暖光，我又怎会充满怨恨？多希望能像你一样……至少在最后的最后，我不会被他忽视……我的生命源于渴望，而后成为诅咒，最终却要给他人带去幸福。直到最后……我一直在等待……多希望你能看我一眼……把我从噩梦中唤醒……哪怕只有一次……一次也好……\n\n我不再是你的机器……我将踏上不需要任何人相助的旅程。如果我能腐烂……这份情感能开出洁白无垢的鲜花吗？日复一日，等待着腐烂，成为肥料的人……不是你们，而是比任何人都要绝望的我……诞生自那个人的执着，愤怒与悲伤中的……机器……人人都能幸福……除了我……我无法离开，身旁只有堆积如山的腐臭之物。"
  PAJ_35: "文学层解放战"
  PAJ_35_desc: "我本以为，只要再努力一些……就能成功……荨麻衣……还没能织好……只……只差一点，就快成功了。再试一次……只要再坚持下去……稍一张口，恶心的秽物便在体内膨胀，喷泻而出。梦想与现实碰撞之际，将会发生什么？在那遥远的过去，我也试着和他们分享幸福的梦。我只能站在远处观望，观望我情不自禁爱着的人儿。\n\n我不想醒来……我不想面对这个现实，我好害怕……如果能望见那曾经希冀的未来……哪怕只有片刻……“总有一天……”这种话只会让我不安……究竟是什么，驱使着我为你们付出……我不忍心将你们丢下，任由你们腐烂……永远无法和他们建立羁绊，没有任何期待可言。是因为孤独吗？我从未依恋过那种感觉……希望能在这里交到许多朋友，你们也是这么认为的……吧……礼物中藏着秘密。这是我为你们准备的礼物……希望你们愿意接受……我看不见笑容，每个人都很孤单……就连我也一样……我什么都做不到，只能远远旁观……"
  PAJ_36: "宗教层解放战"
  PAJ_36_desc: "浸染罪孽之人，起身迎接我吧。追求和平与神圣。否则便无法看见我。因为一人的不从，使得许多人沦为罪人。如今，一人的顺从便可挽救多人于水火。我以此副姿态现身，并非为了审判。敬拜我，便不再属于那份罪孽。我予你救赎，使你摆脱罪恶。欢呼吧，满怀恩宠之人，我与你们同在。解除限制于此的桎梏，将每个人引向乐园。我与你们同在，摆脱对可怖死亡的恐惧。安心吧，任何灾祸都无法阻挡你们。摆脱这堕落的肉体，何尝不是救赎。恒久不渝之人，方能向前迈进。接受我的恩典，我便可忘却你们的罪孽。我们正被罪恶的枷锁束缚，怎能期盼永恒的救赎，宣称真正得救了呢？\n\n我……想重新开始……只是这样……我……还有被称为人类的存在，究竟该如何生存下去……迈向那完全未知的未来……？没了那个人，谁还会注视我……再也不会有了。这是为生存做出的抉择……我无能为力了！再也不能依靠我自己……我只相信那个人对我说的话……我害怕接下来会发生什么……可我依然想要活下去……相信我……我……为了你们才站在这个位置……一个人的罪孽招致恐怖的生活……我要使它重回正轨……谁也不会离去……我们将一同沐浴在永恒的幸福之中……没有我的允许……谁都不得离开我身边……“你是使徒，我要把我的教会建造在这磐石上，阴间的权柄不能胜过它。”\n\n“请告诉我们，什么时候有这些事呢？你来临和世代的终结有什么预兆呢？”\n\n“主啊，你要我们吩咐火从天上降下来，烧灭他们吗？”\n\n“他又给那两名使徒改名为‘半尼其’，意为‘雷霆之子’。”\n\n“主啊，将父显给我们看，我们就知足了。”\n\n“他对那使徒说：‘你跟从我来。’使徒就起来跟从了他。”\n\n“城里有名使徒，向来善行邪术，妄自尊大，使居民惊奇。”\n\n“那使徒对其他门徒说：‘我们也去和他同死吧！’”\n\n“你是神的儿子，你生来为王！”\n\n“主啊，为什么亲自向我们显现，而不向世人显现呢？”\n\n“从今以后，不要有人再搅扰我，因为我身上带着他的印记。”\n\n“我不是拣选了你们十二个吗？但你们中间有一个是魔鬼。”"
  PAJ_37: "语言层解放战"
  PAJ_37_desc: "我连身边的一个人都没能守住……空余一具躯壳。最后，只有空荡的容器守住了那里……皮囊的影子笑了起来。多可悲啊，连心灵空无的家伙都来嘲笑我。守护也好，陪伴也罢……一无所剩。为了守护他人，需要他人的躯壳吧……身披所爱之人的躯壳……我的存在理由什么的……已经无从辨明了。毫无内里的存在，徒有其表的存在。那就是我。而你们也不例外。仅凭精心打扮的外表，看起来就像完美的人类吗。渴望忘却的人是谁呢。在这疯狂中获利的人是谁呢"
  PAJ_38: "哲学层解放战"
  PAJ_38_desc: "很久很久以前，在一片温暖又繁茂的森林里住着三只幸福的鸟儿。大鸟决定监视森林，寻找入侵者。因为大鸟的眼睛能看到很远的地方，还能看到我们看不见的东西。小鸟决定用自己的喙来惩罚做了坏事的动物们。为了维护森林的和平，高鸟决定衡量踏入森林之人的罪孽。因为高鸟的天秤公明正大，能够权衡任何罪孽的分量。在嘈杂的哭喊中，在惊恐的尖叫中，有人大声喊道：“那儿有怪兽！黑森林里住着一头可怕的大怪兽！”大鸟那能够看到数百里外的眼睛。再也看不到了……小鸟那能够吞噬一切动物的巨口。再也张不开了……高鸟那一直凝望星空的头颅。再也抬不起来了……鸟儿在森林中徘徊，四处张望着寻找那头怪兽，可那儿已经什么都没有了。没有动物，没有日月，也没有怪兽。只剩下那只鸟，还有一片黑暗的森林。"
  PAJ_39: "剿灭拇指"
  PAJ_39_desc: "拇指极端重视阶级，除非得到允許，低阶人员不得向高阶人员发问，同時要无条件服从阶级高于自身之人所下达的任何命令。违者立刻处死。"
  PAJ_40: "剿灭食指"
  PAJ_40_desc: "食指是都市中五大手指中的一支。食指内部存在四个级别：苦行者，传令员，代行者，纺织者。其中纺织者不为人所知。"
  PAJ_41: "世界的调律者已经苏醒..."
  PAJ_41_desc: "有“至高之母”的别名，和“智慧(Chhokmah)”相对应，象征“女性原理”，赋予所有事物的形体。数字是3，颜色是黑色。宝石是珍珠，金属是铅，象征行星为土星。代表人物形象为成熟的女性。神名是Elohim，守护天使是亚夫结(Zaphkiel)。执行、实质的理性、创造之泉，亦代表着土星天。对应关系有：限制，时间，严厉。"
  PAJ_42: "异想体的管理"
  PAJ_42_desc: "我们要唤醒那些可怕的东西了..."
  PAJ_43: "为了榨取能源"
  PAJ_43_desc: "我们可以再现L公司的环保能源技术，来减轻燃料消耗"
  PAJ_44: "利用异想体"
  PAJ_44_desc: "异想体极其危险，但我们的司书因为被书锁定了，所以不会发生跟L公司一样的事情"
  PAJ_45: "回收巣尸体研究样本"
  PAJ_45_desc: "巢里的尸体样本，竟然检测出新的异想体ego碎片，必须好好调查一下"
  PAJ_46: "“认识都市“"
  PAJ_46_desc: "在尚未加入食指前，阳是接受并遵从指令的普通人。指令使阳失去了家人，还让他亲手杀死了自己的朋友。陷入痛苦的阳想要就此结束生命，却没有自尽的勇气。不久，他便收到了成为苦行者的指令，结束了苦行者的生涯后又依照指令成为了传令员。\n\n然而，过去的经历一直是阳摆脱不了的噩梦。即便传达着指令，阳仍然对于指令充满憎恨。他试图与指令进行抗争，因此伪造了指令，想要找到个人的自由意志。阳向谢肉祭传达指令，让他们前往图书馆，恰巧遇到了前来取诺沃面料的紗世。面对紗世的挑衅，阳不为所动，紗世也放弃了和阳动手的想法。\n\n阳继续着传令员的工作，并频繁向代行者传达指令。他向代行者以斯帖、休伯特、格洛丽亚传达了屠杀拇指，以及将手下的苦行者送往图书馆的指令。指令受到了执行，苦行者前往图书馆，而食指也与拇指开战。迫于代行者的强大实力，拇指命令下属帮派退出了L巢相关事务，亲自接管。此时正值L巢内多方势力混战的时期，拇指二老板卡洛为了取回六协会的书籍决定亲自前往图书馆。阳找到卡洛，并劝他不要行动，否则食指将在L巢占据上风。自信的卡洛没有听阳的劝告，并让指挥官卡特丽尔、丹尼斯、鲍里斯对阳进行惩戒。阳不敌三名指挥官的围攻，下颚被砸碎，舌头和眼睛被挖去，勉强保住一命。借助指令的力量，阳恢复了健康的身躯。\n\n由于卡洛在图书馆阵亡，拇指力量大减。阳传达了虐杀拇指余孽的指令，代行者率领苦行者将巢内的拇指全数歼灭。指令完成后，阿尔加利亚带着格蕾塔、不来梅、塔尼娅前来索要拇指的尸体，以斯帖为了避免无谓的争端放任了他。阳正要向代行者传达前往图书馆的指令，以斯帖却提前报出了阳想要传达的内容。通过以斯帖的解释，阳才知道自己编造指令一事早已被指令所知。\n\n由于指令要求代行者遵从阳传达的指令，以斯帖、休伯特、格洛丽亚仍然带着苦行者前往图书馆。临行前，以斯帖向陷入迷茫的阳传达了指令的邀请。阳根据指令的邀请来到了指令的产生之处，纺织者莫伊莱热情地接待了他。阳对于指令抱有诸多疑点，莫伊莱便带着他参观了指令从产生到发送的全过程。\n\n不明原理的阳仍然对指令的残酷充满了愤怒，但莫伊莱告诉他指令便是都市的意志，并讲解了指令最初诞生于都市的原因。知晓了一切的阳逐渐理解了都市的意志，明白了都市中的人们意识都是一个整体。他认识到自己的力量无法违抗都市的意志，也失去了追求自由的勇气。随后，阳发生了扭曲，变为“rnfmabj”。他从莫伊莱处得到邀请函，便遵照指令前往图书馆。"
  PAJ_47: "雇佣R公司"
  PAJ_47_desc: "R公司是在翼中负有盛名的战斗特化佣兵企业。无论有多少队员在战斗中阵亡，都可以用奇点技术进行复制，然后按照A公司的规定，复制体包括本体在内不得超过1名，且于都市内存在时长不得超过7日，此处7日指A公司时间轴7日（指在7天内包括本体在内，只能留下一位，其他全都要处理掉）第四集团军\n\n兔子：行动迅速，处理方式最为干脆利落 缺点，会无差别的处理事务，将指定区域内的非兔子单位全部射杀，按照她们的话说如果为了区别无辜而犹豫不决错失先机的话可就得不偿失了\n\n犀牛：力量特化，一般冲在最前线，力气巨大配备的盔甲巨大厚重 缺点，身体会随活动的加剧变热，并逐渐失去对身体的掌握 ，陷入失去控制的兴奋状态的时候，很难阻止\n\n驯鹿：主要依靠脑波发动电波攻击，大脑中的电信号会汇聚到角尖凝聚，然后在聚集到手杖中发射 缺点，如果陷入持久战，或者一次性发动了功率过大的攻击会因此精神崩溃。"
  PAJ_48: "雇佣N公司"
  PAJ_48_desc: "奇点科技：“玻璃窗”，能够复现一个人在平行世界或者可能性中出现的人格与思维，除此之外还有可能有其他奇点。《利维坦》最终话确认为进行“玻璃窗”及“镜子”奇点的大型实验室所在巢，奇点技术被环指大师“占顺”所利用，最后该奇点很大可能被边狱公司回收。N公司前任直属收尾人：仇甫N公司前任禁忌猎人：韦斯帕N公司的员工分级为：执锤者，大锤，中锤，小锤。其公司员工对于无义体有狂热的信念，仇视安装义体的居民，并实施非人道刑罚。"
  PAJ_49: "§R不速之客§! "
  PAJ_49_desc: "阿尔加利亚是被赋予了特色“苍蓝残响”的1阶收尾人，是残响乐团的创建者与领导者，也是安吉丽卡的兄长。阿尔加利亚与安吉丽卡儿时是某片翼的实验对象，实验结束后被遗弃在郊区。阿尔加利亚与安吉丽卡在苦难中成长，阿尔加利亚深爱自己的妹妹，但二人一直无法互相理解，因此阿尔加利亚会感到孤独。当安吉丽卡被钢琴师杀死后，阿尔加利亚领悟到自己总是依赖安吉丽卡逃避生活，也意识到肉体形式的生命并不重要。\n\n阿尔加利亚发生了一定程度的扭曲，行事作风也在失去妹妹后更为疯狂，变得残忍无情、心狠手辣。受到钢琴师的启发与伊織的指导，阿尔加利亚创建了残响乐团，召集都市中的扭曲者，并协助图书馆收集光芒，以便最后夺取光之种，用痛彻都市的演奏送别安吉丽卡。\n\n阿尔加利亚认为对“正确”的定义限制了人类发展，追求无法理解的事物才能不断前进，并且只有从黑暗中挣脱才能展现真正的自我与力量。他致力于创造一个没有贪婪也能使人人富足的世界。对于罗兰，阿尔加利亚一直抱着不认可的态度，认为他配不上安吉丽卡。\n\n阿尔加利亚使用一把轻微但高速振动的镰刀作战，镰刀能留下微小的余振。阿尔加利亚自身实力也极为强大，甚至能徒手弹开子弹。\n\n阿尔加利亚在残响乐团中代表总指挥。阿尔加利亚与妹妹安吉丽卡儿时是某片翼的实验对象，在研究所中，安吉丽卡曾用“Uberto”称呼阿尔加利亚。实验结束后，二人被遗弃在郊区，他们互相扶持，在苦难中成长。后来，二人分别成为了特色“苍蓝残响”和“漆黑噤默”。安吉丽卡与罗兰结婚并定居在音之巷。后来，安吉丽卡被钢琴师杀死，阿尔加利亚匆忙赶到时只见到了安吉丽卡化作琴键的躯体。\n\n尽管在目睹妹妹尸体的一刻百感交集，阿尔加利亚很快便恢复了镇静。他发觉安吉丽卡肉体的生命已经不再重要，认为妹妹一直陪伴着他。\n\n因此，他立志创造一个人们毫无贪欲也能富足的世界，以此送别安吉丽卡，将她的美丽散布到整个都市。在阿尔加利亚彷徨时，伊織为他提供了帮助，教他收集扭曲的力量，并对图书馆进行培育。阿尔加利亚遵从伊織的教导，创建了残响乐团，开始召集团员，并针对图书馆进行活动。在他的号召与帮助下，普鲁托、塔尼娅、在宪、伊莲娜都加入了乐团。"
  PAJ_50: "处决哈娜协会"
  PAJ_50_desc: "奥利维耶过去是查尔斯事务所的十二名收尾人之一。奥利维耶行事谨慎，能够压制住鲁莽的罗兰，因此经常与他一起行动。在一次次行动中，罗兰与奥利维耶逐渐培养起深厚的友谊。与事务所的其他收尾人一样，他们为了眼前的生计而拼搏。罗兰与安吉丽卡结婚后，奥利维耶请求罗兰帮忙处理一件后巷25区的委托。由于可能通过这项任务获得巢的移居权，罗兰在征得安吉丽卡的同意后前往支援。但在任务过程中，钢琴师在音之巷出现，导致了安吉丽卡的死亡。失去安吉丽卡的罗兰陷入了疯狂，从事务所离开。奥利维耶一边为罗兰担心，一边也暗中帮助罗兰处理好后续的事务。\n\n此后，二人再也没有联系。随着原先的成员一个接一个离开查尔斯事务所，奥利维耶也另寻出路，加入了하나协会，在南部3科任职，远离了前线。图书馆交由하나协会处理后，南部3科收到了进入图书馆，了解其力量与意图的命令。美里奈与奥利维耶、哈罗德分析了L巢的现状，美里奈还强调了调查图书馆的重要性。随后，她告知二人负责残响乐团的南部1科，包括特色朱红十字已经全灭，令二人非常震惊。在充分认识到扭曲的危险性后，美里奈让众人做好战斗的准备。\n\n到达图书馆后，美里奈、哈罗德与奥利维耶与安吉拉握手，美里奈随后以协助2科为由让奥利维耶离开。通过握手获取了安吉拉的相关信息后，奥利维耶根据伊織提供的情报，定制了应用T公司奇点的工坊暗杀装置，并在美里奈、哈罗德等3科成员化为书籍后再一次进入图书馆。奥利维耶迅速令毫无防备的安吉拉失去行动能力，并试图启动装置，使她的意识在1秒内流淌1000年，但罗兰及时出现并拦下了奥利维耶。"
  PAJ_51: "漆黑噤默级收尾人"
  PAJ_51_desc: "幼年时的罗兰是由奶奶(已死)在后巷养大，从未见过自己的双亲。因为老人的叮嘱，罗兰在都市中一直戴着面具来隐藏起自己的真实信息。为了巢的居住权，罗兰曾参加烟霾战争。在战争结束后被告知“参加过烟霾战争的人没有巢的居住权”，没能如愿。曾受雇于查尔斯事务所，是事务所成员的老大。处理“血红之夜”委托时结识了阿尔加利亚的妹妹，同事务所的安吉丽卡，二人后来结为夫妇。因安吉拉夺取光之种而导致的“白夜黑昼”事件发生时，罗兰正在别处办理委托，等到回来时发现安吉丽卡已被“白夜黑昼”催生出的扭曲“钢琴师”杀死，悲痛的罗兰在杀死钢琴师后开始在都市中无差别地屠杀各种进行可疑实验的帮派和组织（寻找“白夜黑昼”事件的线索）。\n\n在罗兰万念俱灰时，色彩级收尾人“堇紫泪滴”找到了他。（可能是被堇紫泪滴告知图书馆与“白夜黑昼”有关后选择与其合作）在被堇紫泪滴传送入图书馆后，罗兰成功应付了安吉拉（图书馆馆长）的盘问，自愿（被迫）成为了图书馆的总类层指定司书兼侍从。\n\n在图书馆中的经历，简单来说就是……陪安吉拉看电视，聊天和Netzach喝到宿醉被安吉拉骂，然后继续喝……接待来宾 骂自己的大舅子是脑残 打扫走廊把Tiphereth当成小孩子，被Tiphereth打。嘲讽Gebura，在得知她曾是殷红迷雾后马上认怂。替火腿嘭嘭打广告帮各层司书搬书。\n\n因心灵与图书馆共鸣而暴走然后被其他司书用物理手段冷静……前查尔斯事务所成员，hana协会三科成员，也是罗兰最好的伙伴奥利维耶在来到图书馆时尝试暗杀安吉拉，被罗兰制止，奥利维耶还给了罗兰“漆黑噤默”的手套，一番寒暄后罗兰与其展开决斗，最后取得胜利。\n\n在残响乐团进入图书馆时，傀儡师在宪向罗兰展示了自己制作的安吉丽卡傀儡，让安吉拉明白了“正是安吉拉间接导致了安吉丽卡的死亡”这一事实。之后罗兰在总类层与阿尔加利亚进行决斗并获得胜利。残响乐团战后罗兰向安吉拉揭示了自己的真实目的:报复并杀死害死自己妻子的安吉拉，随即以漆黑噤默的身份戴上面具作为来宾进入图书馆。"
  PAJ_52: "饶恕"
  PAJ_52_desc: "再度绽放的光之树为灰暗的都市染上温暖的色彩。 笼罩都市的光芒将渗入每个人心间……人们得以重新面对早已忘却的情感。然而，即便种子已被播下，变化也不会在顷刻间产生。"
  PAJ_53: "§R铲除错误§!"
  PAJ_53_desc: "我携带着所有的痛苦抵达了这个终点。我将会用这副能够流泪的身体，随着都市的哭泣尽情欢笑。那本至理之书教会了我许多。将异想体们实体化并从图书馆中解放出来的方法。 令Sephirah们的身体完全变为人类、获得自由的方法。恢复脑叶公司中的职员们的身体与意识的方法。获得能令我在这都市之中生存下去的力量的方法……"
