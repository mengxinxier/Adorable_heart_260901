####民族精神###
  PAO_fymn: "被封印的魔女"
  PAO_fymn_desc: "§Y该民族精神将在§t[PAO.Getname]§!不存在时移除，同时§W白城§!的拥有者将自动吞并§0魔女之夜§!或是为§0魔女之夜§!新增投降界限§R+100%§!debuff。§!"
  PAO_rmzz: "人民战争的汪洋大海"
  PAO_rmzz_desc: "天下苦人一条心，谁怕强权逞凶狂！\n你撕洋场的镣铐！我破乡野的囚笼！千村万寨汇怒涛！五洲四海起雷响！不分肤色不分语，只认压迫是公敌！热血浇开自由花，要把旧世界烧光！"
  PAO_gmyq: "新世界的号角"
  PAO_gmyq_desc: "当第一支歌汇入第二支，便成了合唱；当第一簇火并入第二簇，便成了燎原。\n我们曾是散落在不同大陆、各自为战的孤勇者，在各自的黑暗中摸索前行。如今，我们已将双手紧握，将心跳同步。我们的联合，本身就是一封寄给全世界所有被压迫者的邀请函。\n从今天起，我们的人民洪流，将为所有被奴役的民族而奔涌；我们的革命歌声，将为所有沉默的角落带去回响。号角已经吹响，它宣告着一个时代的到来——在这个时代里，任何一座孤岛都将被连接，任何一处黑暗都将被照亮。\n全世界的同志们，请侧耳倾听。这从新大陆传来的声音，是为你们而鸣的战鼓，也是迎接你们回家的钟声。"
  PAO_zzjd:0 "§t最终决斗§!"
  PAO_zzjd_desc:0 "这是最终的决斗，亦是最后的救赎。\n不分彼此，不分贵贱,留下最终的结局。"
