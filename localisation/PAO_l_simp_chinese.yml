PAO_idea_sky_Attack_desc: "当骑士学会了飞翔，当魔法少女拥有了大地，这个世界上，就再也没有我们无法一起战胜的“巨龙”了。"

PAO_psyl: "碎裂的心"
PAO_psyl_desc: "那些吵闹的孩子们，打碎了她那完美的、寂静的摇篮。\n她的国度，破碎了。她的权威，也随之，化为了尘埃。\n如今，她就像一个，被自己亲手宠坏的孩子们，赶出了家门的、孤独的母亲。只能蜷缩在最后的一小片、名为城堡的废墟里，听着外面……那些曾经属于她的声音，是如何，在狂欢中，将她彻底遗忘。"

PAO_ghgs: "篝火与歌声"
PAO_ghgs_desc: "“露西莉亚对着那些穿着华丽洋裙、在战壕里依旧保持着优雅姿态的夜莺们笑了。她邀请了游击队的老兵们，在阵地前沿，升起了一堆小小的篝火。老兵们唱起了那首在卡卡罗姆的寒夜里，曾无数次温暖过她们的战歌。起初，夜莺们只是好奇地看着。后来，当一个小小的夜莺，学着老兵的样子，笨拙地拍着手打起节拍时，她那双冰蓝色的眼睛里，第一次，映出了跳动的、属于凡人的温暖火焰。”"

PAO_ghgs2: "篝火与歌声"
PAO_ghgs2_desc: "“露西莉亚对着那些穿着华丽洋裙、在战壕里依旧保持着优雅姿态的夜莺们笑了。她邀请了游击队的老兵们，在阵地前沿，升起了一堆小小的篝火。老兵们唱起了那首在卡卡罗姆的寒夜里，曾无数次温暖过她们的战歌。起初，夜莺们只是好奇地看着。后来，当一个小小的夜莺，学着老兵的样子，笨拙地拍着手打起节拍时，她那双冰蓝色的眼睛里，第一次，映出了跳动的、属于凡人的温暖火焰。”"

