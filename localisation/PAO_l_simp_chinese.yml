PAO_qiguan: "§1童话之梦§!"
PAO_qiguan_desc: "生者，是需要梦的。她们之所以哭泣，只是因为，她们的梦，碎掉了。那么我就为她们，重新建造一个，永远也不会破碎的梦境吧。我会用最坚固的材料，和最永恒的魔法，为她们，筑起一座座童话的城堡。在城堡里，不会再有饥饿，不会再有悲伤，也……不会再有，会让人心碎的、讨厌的“现实”了。"
