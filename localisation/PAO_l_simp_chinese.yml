PAO_zhjb5: "永不完结的童话"
PAO_zhjb5_desc: "一个故事最好的结局，从来都不是“幸福地生活在了一起”。是可以一起，去书写下一个故事的开始"

PAO_xwzx: "虚无之心"
PAO_xwzx_desc: "§L“剧本，正在上演。我能感觉到，我胸膛里的那颗‘心’，正在变得越来越愤怒，也越来越……困惑。它不懂。为什么我不再去模仿那些光辉的英雄，不再去上演那些能为它带来养分的戏剧。我开始模仿‘虚无’。我模仿一块石头的沉默，模仿一片冬雪的冰冷，模仿一个……在它看来，最无趣、最没有故事价值的、空洞的躯壳。我停止了所有能激起强烈情感的行动，将整个国家，都带入了一种近乎停滞的、绝对的理性之中。当它再也无法从我，也无法从这个国家，汲取到任何戏剧性的养料时，它的饥饿，就会让它做出最后的、也是我最期待的选择——离开这个‘无趣’的剧场，去寻找一个新的舞台。”§!"

PAO_emzd: "噩梦之地"
PAO_emzd_desc: "§L“它走了。如我所料，那颗饥饿的‘心’，离开了我这具‘无趣’的躯壳。它回到了它诞生的地方——那片古老的、寂静的夜莺之国。然后，它展露了它最真实的、也是最恐怖的面目。它不再需要模仿，不再需要演员。它将整个夜莺之国，都变成了它自己的延伸，一个由纯粹的欲望和被吞噬的记忆所构筑的、巨大的噩梦剧场。所有沉睡的亡灵，都成了它的一部分，所有寂静的土地，都开始上演着光怪陆离的、疯狂的戏剧。我的故乡，变成了我的敌人。那个我曾发誓要守护的地方，如今，成了我必须亲手……净化的深渊。”§!"

PAO_zwzg: "自我之歌"
PAO_zwzg_desc: "§L“我活了下来。没有了那颗‘心’，我没有像所有人预料的那样消散。我只是……变回了一个会感到疲惫、会感到寒冷的、最普通的凡人。但我也第一次，感受到了属于我自己的、真实的重量。现在，我将以‘露西莉亚’这个名字，以一个凡人的身份，去面对那个……由我自己释放出来的、最恐怖的‘神明’。我不再拥有模仿一切的力量，也不再拥有逆转时光的奇迹。我所拥有的，只有从那些伟大的老师们身上学来的智慧，只有那些愿意与我并肩作战的同志们，还有……这份，在我胸膛里，第一次，为我自己而跳动的、名为‘痛苦’与‘希望’的……渺小，却又无比真实的……心跳。那么，就让这场战争，成为我的第一首，也是最后一首，只为我自己而唱的……自我之歌吧。”§!"

PAO_lwgz: "两位公主的童话"
PAO_lwgz_desc: "§L“圣堂中央，那颗被净化的夜莺之心静静地悬浮着，散发着柔和的冰蓝光芒，如同一个等待归人的空巢。\n那本记录了我们所有回忆的童话书却无风自动。书页翻飞，那些我亲手写下的文字、我用心描绘的向日葵插图，竟然开始缓缓流淌、汇聚。墨水化作了骨血，记忆织成了罗裙。\n在光影交错中，那个我最熟悉的、温柔的身影，从故事的字里行间，缓缓站了起来。\n她走向那颗宝石，伸出了手。刹那间，神性的辉光与人性的记忆完美交融。光芒散去，她站在那里。不再是书中的幻影，也不再是高不可攀的神明。\n她转过身，那双冰蓝色的眼睛里，既有属于神明的宁静，也有属于凡人的、笨拙的温柔。她看着我，眼中倒映着整个崭新的世界。\n‘……故事，讲完了吗？’\n‘嗯。讲完了。’\n她递给我一本空白的笔记，露出了一个无比灿烂的笑容。\n‘那么……我们，来写一个新的故事，好不好？’”§!"

PAO_glbj: "图书管理员的笔记"
PAO_glbj_desc: "§L“战争结束了，但我的疑问没有。我找到了晓枫，将关于莉莉安娜的一切——她的消失，她的‘遗愿’，以及她最终的回归——都告诉了她。晓枫听完，没有立刻回答。她只是带着我，走进了那座属于‘夜莺之心’的圣堂。她指着那些空荡荡的书架，对我说道：‘把这里，想象成一座巨大的图书馆。那颗‘心’，就是图书管理员。它不生产故事，它只负责‘收藏’。索拉娜，是你我这样的‘历史书’，充满了斗争，读起来很费劲。而莉莉安娜呢？她是一本最纯粹的‘童话书’，充满了爱与悲伤。当那个管理员饿疯了的时候，它先把最复杂的历史书囫囵吞了下去，结果消化不良。然后，它就把目光，投向了身边那本最‘好懂’的童话书，把它也一并吃了进去，变成了自己的藏品。’我好像有点明白了。‘那……为什么最后……’晓枫笑了笑，指了指圣堂中央那颗安静的宝石。‘因为你这个‘读者’，把图书管理员打败了。它被打回了原形，所有被它吞进去的‘藏书’，自然也就都掉了出来。只不过，那本历史书已经散架了，而那本童话书，被你保护得很好。所以，她还能完完整整地，回到书架上。’”§!"

PAO_lrzj: "猎人的直觉"
PAO_lrzj_desc: "§L“我还是不明白。我找到了雪伊，把关于莉莉安娜的一切，都告诉了她。雪伊正在保养她的枪，她听完，甚至没有抬头看我一眼，只是用一块油布，用力地擦着冰冷的枪管。‘这有什么难懂的。’她开口了，声音还和以前一样，带着点不耐烦。‘把那颗心，当成一头饿疯了的野兽。你，就是它圈里养的、最肥的一只羊。’我愣住了。‘一开始，它还只想吃点野草。后来，一头更凶的狼闯了进来，它就把那头狼也吃了，结果把自己撑得半死不活。它缓过来之后，就盯上了离它最近、也最没反抗能力的一朵花，连根拔起，也吃了下去。’她终于抬起头，看了我一眼，眼神就像在看一个……需要被科普常识的小孩子。‘那你呢？’我问。‘我？’雪伊冷笑了一声，‘我只是个猎人。我只知道，野兽吃了不该吃的东西，肚子就会疼。你最后把它打了一顿，打得它把吃下去的所有东西，都原封不动地吐了出来。那朵被它吞下去的花，命大，还没被消化掉，就这么简单。’她说完，就拉上了枪栓，发出清脆的响声。‘行了，别想那些没用的了。既然野兽被打跑了，就该想想，下一顿饭，我们吃什么了。’”§!"

PAO_bmsb: "半满的水杯"
PAO_bmsb_desc: "“在那场疯狂的戏剧里，我们学会了将自己杯子里的水，全部倒给身边的人，直到自己干渴至死，并称之为‘无私’。这不对。我从一位老师那里学到，真正的同志之爱，不是要求每个人都变成一根蜡烛，燃烧自己，照亮别人。是我们所有人都努力地将自己手中的水杯倒满，然后，在确保自己不会干渴的前提下，再将那溢出来的一半，微笑着，递给身边那个杯子还空着的朋友。我们需要的是一片……由无数只半满的水杯，所汇成的永不枯竭的海洋。”"

PAO_mbwd: "面包的味道"
PAO_mbwd_desc: "“在那场戏剧里，我们为了光荣而劳动。我们生产出了堆积如山的面包，却把它们，当成舞台上的道具，任其腐烂。这也不对。我从另一位老师那里学到，劳动的意义，从来就不写在奖章上，它藏在面包本身的味道里。而光荣，是面包的副产品，而不是我们劳动的目的。”"

PAO_wmdx: "无名的雕像"
PAO_wmdx_desc: "“我们总想为英雄建造最高的雕像，为光荣谱写最长的史诗。可在那场戏剧里，当所有人都争相扮演英雄时，‘英雄’这个词，就变得比尘土还要廉价。我终于明白了。一个真正的理想乡，它所需要的，不是无数座刻着英雄名字的纪念碑。它需要的，是……无数条，可以让孩子们在放学后，安全跑回家的、干净的街道；是无数盏，可以在深夜里，为加班的工人照亮前路的、温暖的路灯。所以，我们将不再建造新的雕像。我们要把那些最好的石料和工匠，都用来铺路，用来架桥，用来……去完成那些，不会被写进史诗，不会被任何人记住，却能让每一个普通人的生活，变得更好一点点的、无数件小事。因为，最高的纪念，是让我们的人民，生活在一个……再也不需要英雄的时代。”"

PAO_wcwd: "那首未唱完的歌"
PAO_wcwd_desc: "“圣堂的书架上，除了童话，还有一本很旧很旧的、属于‘野火’的歌本。里面有一首歌，她们只写下了一半。歌里唱着北方的冰原，唱着红色的星星，唱着一座由无数同志的理想建成的、伟大的红色堡垒。笔记的主人写道：‘真想亲眼去看一看啊。’现在，轮到我，去替她们看一看了。我要去寻找那座堡垒，去寻找那颗星星。如果，它依然在寒夜中闪耀，我将为它，献上我们最温暖的合唱。但如果……如果它已被黑暗的冰雪所覆盖，那么，我将用我的剑和我的火，为它，重新融化出一条……通往春天的道路。”"

PAO_jlyy: "巨龙的阴影"
PAO_jlyy_desc: "“我从索拉娜的记忆里，看到了那头真正的‘巨龙’。那是一个以死亡为秩序，以绝望为食粮的黑暗帝国。它与我曾经胸膛里那颗‘心’的饥饿，何其相似。我曾以为，那样的噩梦，已经随着我自己的战斗而结束了。可我错了。只要世界上还存在着这样一座……将生命本身视为‘剧本’的舞台，那么，我自己的故乡，就永远没有真正的安宁。我曾为了一个人的悲伤而逆转时光，我曾为了解放一片大陆而拔剑。现在，我将为了所有生者的权利，去挑战那片……永恒的、冰冷的黑暗。”"

PAO_zhhc: "最后的合唱"
PAO_zhhc_desc: "“我们与远方的同志们，终于，站在了同一面旗帜下。我们的手中，握着不同的武器——她们的，是钢铁与蒸汽的洪流；我们的，是魔法与信念的诗篇。但我们的心中，唱着同一首歌。现在，是时候，让这首歌，拥有它最后的、也是最嘹亮的一段合唱了。从今天起，再也没有‘我们’和‘她们’。只有……全世界的同志。”"

PAO_chmo: "拆毁木偶舞台"
PAO_chmo_desc: "“在清扫了主要的黑暗之后，我看到了那些……依然在大陆的角落里，上演着滑稽戏剧的、小小的木偶。她们挥舞着法西斯的旗帜，模仿着巨龙的咆哮，将自己的人民，禁锢在一个个狭隘而狂热的舞台上。她们以为自己是主角，却不知道，自己只是早已死去的剧作家笔下，一个个可悲的、正在腐烂的角色。对于这样的戏剧，我已没有耐心再看下去了。拉开帷幕，折断提线，让那些木偶，看一看幕布之外……真正的天空吧。”"

PAO_hjnl: "黄金的鸟笼"
PAO_hjnl_desc: "“还有一些地方，那里没有公开的暴君，也没有刺鼻的硝烟。那里只有一座座……用黄金和选票建造的、无比华丽的鸟笼。笼子里的鸟儿，以为自己拥有选择食盆的‘自由’，却从未想过，为何自己……永远也无法飞出这片，由少数人规定好的、狭小的天空。我曾发誓，要为这个世界，书写一个没有悲伤的童话。而一个……将自由本身，都变成了一件可以明码标价的商品的‘童话’……是我，绝对无法容忍的。是时候，让那些鸟儿，回想起翅膀的用法了。”"

PAO_mqjj: "抹去旧日的疆界"
PAO_mqjj_desc: "“当所有的舞台都被拆毁，所有的鸟笼都被打开后，我看着地图上那些……由旧日的君王和政客们，用战争与谎言画下的、纵横交错的线条。它们曾隔开我们的语言，阻碍我们的拥抱，制造了无数本不该存在的仇恨与纷争。它们就像一本写满了错误答案的旧习题册，已经没有了存在的意义。现在，是时候，把它擦干净了。我将邀请所有的同志，与我们一起，用人民的信任与共同的理想，来重新绘制这个世界的地图。未来的疆界，将不再由山脉与河流决定，而由……一颗颗互相靠近的心来决定。”"

PAO_zhsz: "最后的圣战"
PAO_zhsz_desc: "“现在，世界终于，只剩下最后一座、也是最高的一座高塔了。圣杯王国。她们曾是旧世界秩序的守护者，是殖民时代的最后遗迹，也是……所有古老‘神圣’谎言的最终源头。她们的圣杯里，装满了全世界人民的血与泪。我尊重她们曾为守护文明而战的勇气，但一个……需要靠奴役他人来维持的‘文明’，本身，就是最大的野蛮。我将派出我最后的信使告知她们，我，露西莉亚，一个曾弑杀过自己神明的凡人，将带领全世界获得解放的人民，向她们那虚假的‘神’，发起最后的挑战。这不再是一场革命。这是……一场为了让‘神圣’这个词，重归于人民的……最后的圣战。”"
PAO_zhsz_tt: "向所有非§Y我方§!以及§R共产国际§!阵营的§Y无阵营§!或§Y阵营领导者§!的§R社会主义§!意识形态国家发送§Y阵营§!邀请。\n若§Y[SOV.Getflag][SOV.Getname]§!存在，我们将与其§Y阵营合并§!。"

PAO_zhsz3_tt: "我们将在§R二十天§!之后向§Y[ENG.Getname]§!§t宣战§!！"

PAO_zxrc: "崭新的日出"
PAO_zxrc_desc: "“最后的巨龙，已在晨光中化为尘土。那本写满了悲伤与战争的旧童话书，也终于，翻到了最后一页。\n雪伊问我，下一个故事，该怎么写？晓枫的笔记里，没有留下答案。莉莉安娜的花园里，也已开满了所有的花。\n我站在圣杯那空无一人的王座前，向窗外望去。我看到了。我看到了，在遥远东方的河岸边，人们正在建造一座能让所有孩子都喝上甜水的大坝；在北方冰封的海洋上，同志们正唱着歌，去寻找地图上从未有过的航线；而在我们南方的山坡上，一个金发的小女孩，正把她画的第一朵向日葵，别在了她妈妈的头发上。\n我突然，就明白了。\n我的故事，已经讲完了。但‘童话’本身，才刚刚开始。\n它将不再由我来书写。它的作者，是那个正在为大坝拧紧一颗螺丝的工人，是那个正在为新航线绘制海图的水手，是那个……正在为自己的妈妈，画一朵小小的、温暖的太阳的孩子。\n革命，原来不是一场盛大的、终将落幕的戏剧。它是一首……由无数个小小的、充满了希望的‘明天’，所共同谱写的、永不完结的歌谣。\n那么，我也该……去找到我的那首歌了。\n我将解散所有为‘屠龙’而存在的委员会，然后，带着一本空白的笔记本，回到那片……据说，已经开满了金色花海的山坡。\n因为，我的故事讲完了。而她们的，才刚刚开始。”"

####露西莉亚军事线####
PAO_gzbl: "公主的壁垒"
PAO_gzbl_desc: "莉莉安娜：“……我，还是会害怕。害怕那些……吵闹的、不好的东西，会再来伤害我们。所以……露西莉亚，在我们出发之前，能不能……先为我们的家，建一堵，谁也无法推倒的、高高的墙壁呀？”"

PAO_qshj: "骑士的号角"
PAO_qshj_desc: "露西莉亚:“当然啦，莉莉安娜！但光有墙壁是不够的。最好的防守，是让那些坏蛋们，在离我们家很远很远的地方，就听到我们前进的号角声！我们要让我们的骑士，跑得比风还快，在敌人靠近我们的花园之前，就先一步，踏平她们的巢穴！”"

PAO_ygzy: "月亮上的指引"
PAO_ygzy_desc: "莉莉安娜:“……外面的世界，太黑了。我怕……我们的孩子，会在黑夜里，迷了路。我会为她们，在每一个人的盔甲上，都刻下月亮的符文。这样，无论她们走到哪里，我都能……在家里，看到她们的位置，为她们，照亮回家的路。”"

PAO_tysy: "太阳下的誓言"
PAO_tysy_desc: "露西莉亚:“嗯！然后，我会告诉她们，不要害怕黑暗！因为，她们的每一次冲锋，都是在为这个世界，带去更多的‘太阳’！她们的剑，要为所有还在黑暗里哭泣的人而挥舞！这是，我们身为‘守护者’的、最光荣的誓言！”"

PAO_wrxj: "温柔的陷阱"
PAO_wrxj_desc: "莉莉安娜:“……如果……有坏孩子，闯进了我们的花园。我们……也不要，立刻就伤害她们，好不好？我们可以，像故事书里那样，用漂亮的藤蔓，把她们轻轻地绊倒。用甜蜜的歌声，让她们，安安静静地，睡着。”"

PAO_gtth: "为了共同的童话"
PAO_gtth_desc: "露西莉亚:“……然后！当那些睡着的坏孩子醒来时，我们，就给她们，也讲一个，关于‘爱’与‘守护’的、新的童话！莉莉安娜，你看，这样一来，我们的防守，和我的进攻，就都变成了一个……能让所有的人，都迎来幸福结局的、最棒的童话故事了，对不对！”"

PAO_ghgs: "篝火与歌声"
PAO_ghgs_desc: "“露西莉亚对着那些穿着华丽洋裙、在战壕里依旧保持着优雅姿态的夜莺们笑了。她邀请了游击队的老兵们，在阵地前沿，升起了一堆小小的篝火。老兵们唱起了那首在卡卡罗姆的寒夜里，曾无数次温暖过她们的战歌。起初，夜莺们只是好奇地看着。后来，当一个小小的夜莺，学着老兵的样子，笨拙地拍着手打起节拍时，她那双冰蓝色的眼睛里，第一次，映出了跳动的、属于凡人的温暖火焰。”"

PAO_gfmb: "共分的面包"
PAO_gfmb_desc: "“‘她们不需要进食，’骑士团的指挥官轻声提醒着为她们送来配给的游击队战士。可战士只是微笑着，将那块又干又硬的黑面包，掰了一半，放在了一位小夜莺的手中。‘拿着吧，妹妹。’战士说，‘这不是食物，这是告诉彼此，我们正站在同一个战壕里的记号。’那位小夜莺看着手中的面包，又看了看战士脸上真诚的笑容。她学着对方的样子，将那半块面包，紧紧地抱在了胸前，仿佛那是一件比任何宝石都更珍贵的宝物。”"

PAO_fbyq: "缝补的洋裙"
PAO_fbyq_desc: "“一位小夜莺的蕾丝裙摆在穿越丛林时被荆棘划破了。她坐在树下，有些不知所措。一位游击队的卫生员走了过来，她没有用魔法，只是拿出了针线，借着月光，一针一线地，为她缝补好了那道小小的裂痕。‘我们的旗帜，也是这样缝起来的。’卫生员对她说，‘一个口子，就补一个。只要我们还在，它就永远也不会真正碎掉。’第二天，人们看到，那位小夜莺的裙摆上，多了一块用粗糙麻布制成的、小小的红色补丁。”"

PAO_tddh: "土地的悄悄话"
PAO_tddh_desc: "“‘我们为何要在此处设伏？’夜莺骑士不解地问。游击队的侦察兵没有回答，她只是让夜莺俯下身，将耳朵贴在温暖的土地上。‘你听，’侦察兵轻声说，‘土地在告诉我们，敌人的巡逻队，还有十分钟，就会从那条小路经过。因为那里的泥土，比别处更结实，马蹄声会更响亮。’夜莺骑士闭上眼睛，在那片寂静中，她第一次听到了风声、虫鸣，和大地那沉稳有力的心跳。她好像有点明白了，她们的敌人，从来都不是地图上的标记。”"

PAO_xhfn: "当玩偶学会愤怒"
PAO_xhfn_desc: "“在解放一座被残暴领主统治的村庄后，一位夜莺骑士看到一个人类孩子，满身是血，正抱着她那早已冰冷的母亲哭泣。那一刻，这位从诞生起就不知何为‘悲伤’的亡灵少女，第一次感受到了某种灼热的、陌生的情绪。她转过身，那双总是像宝石般平静的眼睛里，燃起了一簇冰冷的、蓝色的火焰。她对着露西莉亚，第一次，也是唯一一次，主动请战：‘殿下，请命令我们，踏平那座领主的城堡。’”"

PAO_rmzd: "人民之盾"
PAO_rmzd_desc: "“在一次撤退中，游击队为了掩护村民转移，被敌人的炮火死死压制。就在防线即将崩溃时，夜莺骑士团出现了。她们张开了巨大的、由月光构成的屏障，沉默地，挡在了村民和游击队的身前。炮火在屏障上炸开万千光点，却无法前进一步。‘快走！’一位小夜莺回头，对着目瞪口呆的游击队战士们，大声喊道，‘你们的家，由我们来守护！’那一刻，她们不再是公主的玩偶。她们是人民的盾。”"
####露西莉亚经济线####
PAO_hsyj: "为城堡画上眼睛"
PAO_hsyj_desc: "露西莉亚:“莉莉安娜，你的城堡好宏伟，也好……安静。可是，它好像，总是闭着眼睛在睡觉。我们……可不可以，为它，画上很多很多，能看到外面星星的窗户呀？这样，它就不会那么孤单了。”"
PAO_nwxc: "凝望星辰的城堡"
PAO_nwxc_desc: "露西莉亚:“莉莉安娜，你的城堡好宏伟，也好……安静。可是，它好像，总是闭着眼睛在睡觉。我们……可不可以，为它，画上很多很多，能看到外面星星的窗户呀？这样，它就不会那么孤单了。”"
PAO_nwxc2: "凝望星辰的城堡"
PAO_nwxc2_desc: "当第一扇窗被推开，\n寂静了万年的墙壁，学会了呼吸。\n当第一缕月光洒下，\n沉睡了千年的尘埃，开始舞蹈。\n城堡不再是，一座冰冷的坟墓，\n它变成了，一个笨拙的、睁开眼睛的孩子，\n正好奇地，第一次，\n仰望着，那片永恒而温柔的、星的海洋。"
PAO_nwxc3: "凝望星辰的城堡"
PAO_nwxc3_desc: "当第一扇窗被推开，\n寂静了万年的墙壁，学会了呼吸。\n当第一缕月光洒下，\n沉睡了千年的尘埃，开始舞蹈。\n城堡不再是，一座冰冷的坟墓，\n它变成了，一个笨拙的、睁开眼睛的孩子，\n正好奇地，第一次，\n仰望着，那片永恒而温柔的、星的海洋。"
PAO_nwxc4: "凝望星辰的城堡"
PAO_nwxc4_desc: "当第一扇窗被推开，\n寂静了万年的墙壁，学会了呼吸。\n当第一缕月光洒下，\n沉睡了千年的尘埃，开始舞蹈。\n城堡不再是，一座冰冷的坟墓，\n它变成了，一个笨拙的、睁开眼睛的孩子，\n正好奇地，第一次，\n仰望着，那片永恒而温柔的、星的海洋。"
PAO_nwxc5: "凝望星辰的城堡"
PAO_nwxc5_desc: "当第一扇窗被推开，\n寂静了万年的墙壁，学会了呼吸。\n当第一缕月光洒下，\n沉睡了千年的尘埃，开始舞蹈。\n城堡不再是，一座冰冷的坟墓，\n它变成了，一个笨拙的、睁开眼睛的孩子，\n正好奇地，第一次，\n仰望着，那片永恒而温柔的、星的海洋。"

PAO_yymz: "让她们拥有名字"
PAO_yymz_desc: "露西莉亚:“你的孩子们……那些‘夜莺的魂灵’，她们都长得一模一样。我……有点分不清。我们，可不可以，给她们每一个，都起一个，独一无二的好听名字呀？比如，这个，喜欢待在花园里的，就叫‘小花’。那个，总是安安静静守在门口的，就叫‘阿守’。这样，她们就不再只是‘魂灵’了，她们是……‘小花’和‘阿守’了呀。”"

PAO_bhdx: "不会凋谢，也会生长"
PAO_bhdx_desc: "莉莉安娜:“……露西莉亚，你说得对。永恒，不应该等于‘静止’。我……好像有点明白了。我试着，让你种下的那些，会凋零的小花，在凋零之后，把她们的‘记忆’，变成新的种子。这样……她们虽然，还是会消失。但明年春天，她们又会……以一种新的样子，重新开放。这样……可以吗？”"

PAO_qqh: "她们的“悄悄话”"
PAO_qqh_desc: "露西莉亚:“你看你看！莉莉安娜！‘小花’，她今天，一整天，都停留在那朵……新开出来的、红色的花旁边！她是不是……在和那朵小红花，说什么悄悄话呀？我们……要不要，也在旁边，建一张小小的长椅？这样，她们就能……聊得更久一点啦。”"

PAO_zmcs: "会做梦的城市"
PAO_zmcs_desc: "莉莉安娜:“……我好像……有点喜欢上这种‘变化’了。我不再满足于，只是让她们拥有名字。我开始……试着，去倾听她们的‘愿望’。那些，在她们沉寂了万年的灵魂深处，残存的、小小的、关于生前的美好回忆。然后，我用我的力量，为她们，把那些回忆，变成一个一个……小小的、可以触摸的梦境。”"

PAO_byyd: "不一样的交响乐"
PAO_byyd_desc: "露西莉亚:“莉莉安娜！你看！我们的家，现在，好像……真的活过来了！虽然，这里还是没有太阳，也很安静。但这种安静，和以前不一样了！以前，是‘寂静’。现在呢，是那种……所有的人，都在做着甜甜的美梦时，才会有的、温暖的……‘宁静’呀！”"

PAO_mbqw: "面包与蔷薇"
PAO_mbqw_desc: "“我问晓枫的笔记，战争时期，什么最重要？笔记说：‘是面包，让人民活下去。’我又问莉莉安娜的童话书，什么最重要？书上说：‘是蔷薇，让人们拥有希望。’她们说的都对。所以，我们的后勤车队，不仅要为前线送去弹药，也要为每一个被战火波及的村庄，送去足够过冬的面包。并且，在每一个面包袋上，都要系上一枝小小的、永不凋谢的水晶蔷薇。我要让所有的人民知道，我们为之奋战的未来，既有温暖的饱足，也有美丽的梦想。”"

PAO_gecb: "孤儿的城堡"
PAO_gecb_desc: "“我无法让所有牺牲的父母都回到孩子身边。但我可以为那些在战火中失去家人的孩子们，建造一座新的、很大的家。我将把那些被我们没收的、旧领主的庄园，改建成一座座‘骑士城堡’。那里会有最柔软的床铺，最温暖的壁炉，和很多很多会讲故事的‘夜莺’姐姐。最重要的是，城堡的大门永远不会上锁。因为我要让她们知道，这里不是孤儿院，这里是她们随时都可以回来、也随时都可以离开的、暂时的家。”"

PAO_lglr: "一张留给老人的椅子"
PAO_lglr_desc: "“一位游击队的老兵曾告诉我，她牺牲的父亲，一辈子最大的愿望，就是能在村口那棵大榕树下，有一张属于自己的、可以安安稳稳晒太阳的椅子。我们打赢了那么多仗，可村口还是只有光秃秃的泥地。这不行。我请求工兵部队，在推进战线的同时，也要为每一个解放的村庄，用最好的木料，打造一张结实的长椅，就放在村里阳光最好的地方。并且，在椅子上刻下：‘献给所有为我们赢得了今日阳光的人’。”"

PAO_ssrd: "说书人的旅行队"
PAO_ssrd_desc: "“恐惧，和饥饿一样，会杀死人的灵魂。我们不能只给人民面包，也要为她们带去勇气。我将组织一支特别的队伍，里面有我们最会唱歌的士兵，最会画画的夜莺，还有……我。我们将像那些吟游诗人一样，去往每一个刚刚经历过战斗的地方。我们不去宣讲大道理，我们只为她们，在篝火旁，讲述一个又一个‘坏蛋被打倒，英雄会回家’的、最简单的童话故事。”"

PAO_zhjs: "最后一封家书"
PAO_zhjs_desc: "“我整理牺牲同志们的遗物时，发现了许多没有寄出去的家书。‘妈妈，等我回来，就为你买一条新围巾。’‘儿子，爸爸答应你，战争结束了，就教你做风筝。’这些承诺，比任何勋章都更沉重。我将成立一个‘遗愿执行部’，专门负责完成这些小小的、未竟的诺言。我们或许无法将英雄带回她的家人身边，但我们至少，可以把她最后的温暖与爱，连同一条新围巾或一只风筝，亲手，送到她最思念的人手中。”"

PAO_zxxr: "种下向日葵"
PAO_zxxr_desc: "“那本属于晓枫的笔记里，画着一整片金色的向日葵田。她写道：‘等到一个再也没有战争的春天，我要在这里，种满这个。’现在，春天还没来，战争也还在继续。可是，我想……我们可以提前，为她，也为我们自己，种下第一颗种子。我请求，在我们解放的每一片焦土上，在每一座新修的工事旁，都要留出一小块土地，种上向日葵的种子。我要让我们的士兵和人民，在炮火的间隙，也能看到……那张永远朝着太阳微笑的、小小的、金色的脸。”"
####事件####
PAO.1.t: "为什么要躲着我呢？？？"
PAO.1.d: "我只是……想让家里，变回原来的样子。\n我派出了侍卫们，去把那些……在外面游荡的、不听话的孩子，都请回她们自己的房间里去。我告诉侍卫们，动作一定要轻柔，因为那些孩子，只是在做着不安稳的梦，不可以吵醒她们。\n可是……侍卫们回来了。\n她们说，那些孩子，不愿意回家。\n她们说，她们只是轻轻地碰了一下，那些孩子……就碎掉了。\n然后，就有更多的孩子，从城市的阴影里跑了出来。她们不再只是吵闹了，她们开始……推倒那些漂亮的、几万年都没有动过的雕像，开始……弄脏我们干净的街道。\n我……不明白。\n我只是想在索拉娜回来之前，把一切都收拾得整整齐齐，就像她离开时那样。\n为什么……为什么你们，就是不肯帮帮我呢？"
PAO.1.a: "§1是我……做错了吗？§!"

PAO.2.t: "世界安静了下来，可是……"
PAO.2.d: "最后一声不和谐的嘶吼，消失了。\n我的侍卫们，忠实地，执行了我的命令。她们把那些……不听话的孩子，全部，都送回了永恒的安眠里。\n我走在那些……曾经无比吵闹的街道上。现在，这里又恢复了它应有的样子。\n安静，完美，一尘不染。\n就像……你离开之前那样。\n我从地上，捧起了一捧黑色的尘埃。这是那些孩子……留下的、最后的东西。它们很轻，很凉，就像从未存在过一样。\n你看，索拉娜。\n现在，家里又变得和以前一样，安安静静的了。\n再也没有什么东西，能打扰我们了。\n我把一切……都准备好了。\n所以……\n……你，可以回来了吗？"
PAO.2.a: "§1（整个国度，只剩下……她的回音。）§!"

PAO.3.t: "一场没有听众的道歉"
PAO.3.d: "她们……停下来了。\n那些吵闹的孩子们，好像……也打累了。她们没有再进攻，只是退回了城市的阴影里，远远地、沉默地，看着我。\n我也……没有力气了。\n我最忠诚的侍卫们，有很多，都变成了和我脚下这些……冰冷的尘埃一样的东西。\n我走在这座……被我们亲手弄得一团糟的家里。到处都是裂痕，到处都是……无法被修复的伤疤。\n我做错了。\n我想让这里，变回你离开时那样、完美的、安安静静的样子。\n可我……好像把它，弄得更乱了。\n对不起，索拉娜。\n我……好像把我们的家，搞砸了。\n如果……如果你现在回来，看到的是这样一副破破烂烂的景象……你一定会……更不想回来了吧。\n对不起……\n……真的，对不起。"
PAO.3.a: "§1（废墟中，只剩下……她小声的啜泣。）§!"

PAO.4.t: "永恒的寂静"
PAO.4.d: "……结束了。\n冰冷的雨水，冲刷着脸上的血污，也冲刷着……我那可笑的、关于不朽帝国的梦想。\n这些叫“野火”的凡人，比我想象的……要坚韧得多。我的军团崩溃了，我的防线被撕碎了。现在，她们像一群饥饿的狼，将我，这头落单的狮子，团团围住。\n也好。\n就这样，以一个女王的姿态，战死在这里……也算是一个不错的结局。至少，比回到那个……冰冷的、永恒的牢笼里，要好得多。\n我握紧了剑，准备迎接最后的冲锋。\n就在这时……\n……世界，突然，安静了下来。\n那些革命军的呐喊声、枪炮的轰鸣声、雨水砸在盔甲上的滴答声……所有，所有的声音，都在一瞬间，消失了。\n我愕然地抬起头。\n我看到，那些革命军的士兵，就像一群被按下了暂停键的人偶，保持着冲锋的姿态，凝固在了原地。雨水，停在了半空中。火焰，也停止了跳动。\n整个世界，都陷入了一种……我无比熟悉的、完美的、死一般的寂静之中。\n然后，我听到了一个声音。\n一个……我曾以为，我再也不会听到的、轻柔得像梦一样的声音，就在我的耳边，轻轻地响起。\n“……疼吗？”\n我猛地回头。\n身后，空无一人。\n只有一片……散发着柔和微光的、将我与整个世界隔绝开来的、透明的屏障。\n“……你总是这样。”那个声音，带着一丝……我无法分辨是心疼还是责备的、柔软的叹息，“总是把自己弄得……这么狼狈。”\n“……走吧。”\n“……我来，接你回家了。”"
PAO.4.a: "§O……莉莉安娜？§!"

PAO.5.t: "当零件开始说话"
PAO.5.d: "寂静的秩序，被一阵嘈杂的、属于生者的声音，打碎了。\n麻烦，来自那些被“收容”的莉兰迪亚人。\n在莉莉安娜看来，她只是在用自己最熟悉、也是最“高效”的方式，来重建这座城市。她将人类，和她那些不知疲倦的亡灵臣民一样，编入了永恒的生产序列。\n每一个人，都被分配了一个固定的、永不变更的岗位。伐木工，就永远负责砍伐；石匠，就永远负责堆砌。因为在这个完美的、失去欲望的国度里，为女王的城堡添砖加瓦，本身就是至高无上的荣耀，是存在的全部意义。\n她无法理解，这些脆弱的、生命短暂的零件，为什么会“损坏”。\n为什么，她们会疲惫，会生病，甚至会……抱怨。\n暴乱的导火索，是一场意外。一个在矿场连续工作了两天两夜的年轻工人，因为脱力，失足摔进了那台永不停歇的、巨大的矿石粉碎机里。\n\n监工的夜莺魂灵毫无反应。在它的逻辑里，这只是一个零件的损耗。它只是，准备将下一个流水线的零件，补充到那个空出来的岗位上。\n就在这时，一个沙哑的、充满了悲愤的声音，从人群中响起。\n“……他，是我儿子。”\n一个头发花白的老工人，放下了手中的工具，颤抖着，站了出来。\n“他……不是一个‘零件’。”\n然后，第二个，第三个……越来越多的人，沉默地，放下了手中的工具。她们围拢过来，将那个失去孩子的父亲，护在了中间。她们用自己的血肉之躯，组成了一道脆弱的、却无法被“序列”所理解的墙。\n她们的眼神里只有一种……在被剥夺了一切之后，所剩下的、最后的、属于“人”的尊严。\n当莉莉安娜从索拉娜的房间里，听到这个消息时，她的脸上，第一次，露出了那种……孩子气的、完全无法理解的困惑。\n“……她们，在做什么呀？”\n“……我只是，想为大家，建一个更漂亮的家而已。”"
PAO.5.a: "§R（沉默的齿轮，开始发出刺耳的摩擦声）§!"

PAO.6.t: "你看，她们在哭啊"
PAO.6.d: "“够了，莉莉安娜。”\n这是……你回来以后，第一次，用这么严肃的、带着一丝颤抖的语气，和我说话。\n我停下了正准备为你梳理头发的手，有些不解地看着你的背影。\n你没有回头。你只是，指着窗外。\n“你看看她们。”你的声音，像一块被烧红的铁，又被强行浸入了冰水里，“你看看她们的眼睛！那里面，还有一点点的光吗？！”\n我顺着你的手指望去。\n窗外，是我为你建造的、完美的城市。街道很干净，建筑很宏伟，所有的人类，都在我的“夜莺的魂灵”的指引下，有条不紊地，进行着永恒的建设。一切……都和我设想的一样，安静，而有序。\n“她们不是你的玩偶！不是那些可以随意拆解、再重新拼凑起来的亡灵！”你的声音，第一次，带上了……愤怒。\n“她们会痛，会累，会饿！她们有自己的家人，有自己的梦想！她们是……活生生的人啊！你这样……是在毁掉她们！也是在毁掉你自己！”\n我被你说得愣住了。\n我只是……想用我的方式，去对她们好。我想给她们一个永远安宁的家。\n我只是……不想再看到任何人，像你当初那样，被那些凡人伤害了。\n我做错了吗？\n我缓缓地走到你的身边，学着你刚才的样子，也望向了窗外那些……安静得有些过分的人们。\n然后，我轻轻地，拉住了你的手，用我能想到的、最天真、也最认真的语气，问你：\n“……可是，索拉娜。”\n\n“……在你过去的那个王国里，那些活生生的人们，她们……就不哭了吗？”"
PAO.6.a: "§1（你的手，在那一刻，冰冷得像一块石头。）§!"

PAO.7.t: "我的王国"
PAO.7.d: "莉莉安娜……她问我。\n问我，在我的王国里，人民……就不哭了吗？\n怎么会不哭呢？\n我的王国……\n我的王国，建立在贫民窟的泥泞之上。那里，哭声，是比呼吸更廉价的东西。\n我的王国，是用工人的白骨和农民的血泪铸成的。每一次敲击，都能听到他们的哀嚎。\n我的王国，是我用饥饿和恐惧，从那片绝望的土地上，驱赶出来的野兽。她们的每一次冲锋，都是为了能抢到一块……能让自己活到明天的面包。\n是的。\n在我的王国里，人民当然会哭。\n她们哭得比这里的任何人，都更大声，更凄惨。\n可是，莉莉安娜……你不懂。\n你永远也不会懂。\n正因为她们会哭，正因为她们会痛，正因为她们会……在被逼到绝境的时候，燃起那该死的、连神明都能烧成灰烬的怒火……\n所以……“野火”，才会诞生。\n所以，像晓枫那样的人，才会出现。\n所以，我那座看起来坚不可摧的、用力量和恐惧建立起来的帝国，才会像一座沙子堆成的城堡一样，被她们……轻而易举地，推得粉碎。\n我回来了。\n回到了你为我建造的这个……完美的、安宁的、再也没有人会反抗的、永恒的牢笼里。\n我看着你，用你那天真的善意，重复着我曾经犯下的、所有傲慢的错误。\n我突然……就明白了。\n我真正输掉的不是那场战争。\n当我看着那些……衣衫褴褛、食不果腹的“野火”士兵们，脸上却带着那种……我从未拥有过的、为了某个比生命更重要的东西而去战斗的光芒时…\n我就已经，输得一败涂地了。\n对不起，莉莉安娜。\n我……好像，不能再陪你，待在这个……安安静静的家里了。\n因为，我终于想起来了。\n在那座……被我亲手摧毁的、充满了哭声的王国里……\n……也曾有过，我的家。"
PAO.7.a: "§O（火焰，熄灭了。）§!"

PAO.8.t: "一场关于面包的梦"
PAO.8.d: "你……睡着了。\n这是你回来以后，第一次，睡得这么沉。\n我（莉莉安娜）就坐在你的床边，像以前一样，静静地看着你。\n你睡着的样子，和小时候，没什么两样。还是会微微地皱着眉头，像是在思考着什么……很了不起的难题。\n突然，你开始说梦话了。\n声音很轻，很含糊，像是在对谁说话。\n“……面包……不够了……”\n“……把我的那份……分给她们……不然……会闹事的……”\n“……不行……军饷不能再拖了……那帮饿疯了的狼……会把我们都撕碎的……”\n“……该死的……‘野火’……为什么……她们明明什么都没有……为什么……就是杀不完……”\n你的眉头，皱得越来越紧。你的呼吸，也变得越来越急促。\n我有些担心，想伸出手，去抚平你眉间的褶皱。\n就在这时，你突然，用一种……我从未听过的、带着一丝颤抖和疲惫的、近乎哀求的语气，轻轻地，说了一句：\n“……好累啊。”\n然后，你就翻了个身，把脸深深地，埋进了柔软的枕头里，再也没有发出声音。\n我伸出的手，停在了半空中。\n我只是……静静地看着你。\n我突然觉得……\n我好像……从来，都没有真正地，走进过你的梦里。"
PAO.8.a: "§1（你的梦里……到底，都有些什么呢？）§!"

PAO.9.t: "墙与狗圈"
PAO.9.d: "“你看，索拉娜。”\n你的声音里，带着一种孩子气的、邀功般的兴奋。\n“我把我们的家，变得更安全了。我建起了最高、最坚固的墙，还派了我们最勇敢的孩子，守在每一个门口。这样……就再也没有坏人，能闯进来伤害你了。”\n我顺着你手指的方向看去。\n窗外，巨大的、由黑曜石和骸骨构成的城墙，像一道永恒的悬崖，将我们的城堡，与那个吵闹的世界，彻底隔绝开来。\n“……嗯。”我点了点头，声音里，听不出什么情绪，“很好。”\n你似乎对我的平淡反应有些失望，但还是继续兴致勃勃地介绍着你的“杰作”。\n“我还听了你的话。你说，那些迷路进来的生者，是需要吃饭的。所以，我命令我的孩子们，每天，都会把最好的食物，放在城门口的食槽里。你看，她们现在……都在安安静静地排队，再也没有人争抢，再也没有人哭闹了。是不是……很有秩序？”\n我看着窗外。\n看着那些……衣衫褴褛的人类，在“夜莺的魂灵”的监视下，麻木地，排成一条长长的队伍。然后，从那个巨大的、冰冷的石头食槽里，领取属于自己的、不多不少的那一份食物。\n我看着这个场景，突然……就想起了很久很久以前的一些事。\n我想起了，我还是一个人类小女孩的时候。在贫民窟的冬天，那些贵族老爷们施舍食物时，也是这样。他们把发了霉的面包，扔进一个巨大的食槽里。然后，看着我们这些……快要饿死的孩子，和野狗一起，为了多抢到一口吃的，互相撕咬，头破血流。那时候，我就明白了。\n最稳固的统治，需要的不是爱，也不是信仰。\n是……饥饿。\n是让所有人都处在一种“不听话，就会饿死”的恐惧里。然后，再由你，来决定谁能吃饭，谁不能。\n这就是……我建立自己那个王国的、最初的基石。\n我看着你，看着你那双……因为自己创造了“完美秩序”而闪闪发光的、纯净的眼睛。\n我突然……就有点想笑。\n你看，莉莉安娜。\n我们……原来，是这么的相像。\n只是，你用的是“善意”。而我，用的是“恶意”。\n但我们……都为自己心爱的人，建造了一座，一模一样的、名为“绝对安全”的……华丽的狗圈。"
PAO.9.a: "§O（我们……有什么不一样吗？）§!"

PAO.10.t: "被挂起的地图"
PAO.10.d: "你……好像很开心。\n因为，这是我回来以后，第一次，主动向你要了一样东西。\n我要了一张地图。一张……关于那片，曾属于我的、叫“莉兰迪亚”的土地的地图。\n你很快就让你的孩子们，为我找来了。还为它，配上了一个最华丽的、用白骨和宝石镶嵌的画框。\n现在，它就挂在我的房间里。\n你走进我的房间，看到我正站在那幅地图前，眼神里，充满了好奇和一丝……不易察觉的欣喜。\n“你在看什么呀？”你轻轻地问。\n我没有回头。我只是伸出手，指着地图上，那座曾被我命名为“胜利堡”的、最坚固的要塞。\n我的声音，冰冷，而沙哑。像是在陈述一个不容置疑的事实。\n“……这个。是我亲手设计的。那里的每一块砖，都刻着我的名字。”\n我又指向了那片……曾盛产咖啡豆的、富饶的平原。\n“……还有这里。我曾在这里，签下了上百份贸易订单。那里的每一颗咖啡豆，都曾为我的国库，换来过黄金。”\n最后，我的手指，重重地，点在了那座……曾被“野火”的火焰，烧成灰烬的王宫之上。\n“……而这里。”我的声音里，第一次，带上了一丝……你所熟悉的、充满了占有欲的怒火，“曾是我的王座。是那群该死的蝼蚁，把它，从我这里……偷走了。”\n我转过身，看着你。\n“莉莉，你说得对。”我的眼神，像一头被夺走了领地的、受伤的狮子，“那是……我的东西。是我一个人的。我不允许……不允许任何人，把它，从我手里抢走。”\n你看着我，看着我又变回了那个……你所熟悉的、充满了野心与欲望的索拉娜。\n你的脸上，露出了一个安心的、无比温柔的笑容。"
PAO.10.a: "§O（她只看到了她想看到的）§!"

PAO.11.t: "我们何时出征？"
PAO.11.d: "“真不错。”\n我掂了掂手中这柄新剑的重量。剑身上，流淌着属于夜莺国度的、冰冷的死亡能量。它比我过去拥有的任何一把武器，都更锋利，也更……听话。\n你站在我的身边，看到我脸上露出的、满意的表情，你的眼睛里，也闪烁着开心的光芒。\n“你喜欢就好。”你轻声说，“有了它们，就再也没有人，能伤害你了。”\n“伤害我？”我笑了。那是一种……你许久未见的、充满了嘲讽与傲慢的笑。\n“莉莉安娜，你太小看我了。”我转过身，用剑尖，轻轻地抬起了你的下巴，就像……很久很久以前，我第一次，见到你时那样。\n“也太小看……那些凡人了。”\n我收回了长剑，望向工坊外，那些已经集结完毕的、无穷无尽的亡灵大军。\n“她们……不是来伤害我的。她们是来……迎接她们的女王，回家的。”我的声音里，充满了即将重返战场的、兴奋的战栗，“她们以为我被打败了，以为我像一只丧家之犬一样，躲回了你的影子里。她们错了。”\n“我只是……回来拿回一些，我早就该拿的东西而已。”\n我转过身，将那柄冰冷的长剑，指向了莉兰迪亚的方向。\n“所以，我们什么时候去碾碎她们？”我的声音，回荡在整个工坊里，充满了不容置疑的威严，“去告诉那些不知死活的蝼蚁……我，索拉娜，回来了。去把我的王座，我的城市，我的一切……都给我，原封不动地，拿回来！”\n你看着我，看着我又变回了那个……你初次爱上的、那个充满了力量、野心与光芒的征服者。\n你的脸上，露出了一个……无比满足的、痴迷的笑容。\n……我终于，要为你，也为我自己，去夺回属于我们的荣耀了。"
PAO.11.a: "§O（演出即将开始）§!"

PAO.12.t: "镜中的“女王”"
PAO.12.d: "我逃跑了。\n从她的身边，从她那双……纯净到足以灼伤我的眼睛里，逃了出来。\n我把自己，关回了这个……她为我精心准备的、华丽的牢笼里。\n我走到镜子前，看着镜中的自己。\n“女王”……\n多么可笑的词语。\n一个被一群衣衫褴褛的凡人，从自己的王座上赶下来的失败者。\n一个像丧家之犬一样，需要被自己曾经背叛的人，捡回来的可怜虫。\n这就是……镜子里这个女人的真面目。\n我恨。\n我恨那些叫“野火”的蝼蚁。恨她们的顽固，恨她们那愚蠢的、所谓的“信仰”，恨她们……明明那么弱小，却能从废墟里，一次又一次地，爬起来。\n可我……好像更恨自己。\n恨自己的无能，恨自己的傲慢，恨自己……花了半辈子的时间，用尽了所有的卑劣手段，建立起来的那个所谓的“不朽帝国”，竟然，真的就输给了那样一群……连饭都吃不饱的家伙。\n……\n莉莉安娜……\n我的手，不自觉地，抓紧了肩上这件柔软的披肩。\n上面，还残留着她指尖的、淡淡的凉意。\n她刚才……看着我的时候，眼神里，全是心疼和担忧。\n她一定……把我当成了一个在外面受了委屈、回家哭鼻子的孩子了吧。\n她不知道。\n她永远也不会知道。\n真正把她那份唯一的、纯净的温暖，当作工具，去肆意践踏的人，是我。\n真正把这个世界上，唯一一个，曾毫无保留地爱着我的人，亲手推入深渊的，也是我。\n我……\n……\n我看着镜子里那张苍白的、陌生的脸，突然，就笑了。\n笑得比哭，还要难看。\n你看，索拉娜。\n你赢不了那些蝼蚁，也配不上那份纯净的爱。\n你就是个……彻头彻尾的、一无所有的……废物。"
PAO.12.a: "§O将脸埋进那件……还带着一丝凉意的披肩里§!"

PAO.1333.t:0 "我的心脏在大声笑"
PAO.1333.d:0 "披肩上那抹独属于莉莉安娜的凉意，并没能让我的灵魂平静下来，反而像一把钝刀，反复折磨着我仅存的尊严。\n我推开窗，窗外的莉兰迪亚早已不是我记忆中那个闪闪发光的帝国。这里塞满了从生者世界溢过来的、令人作呕的混乱。难民在废墟中哭嚎，野火的余烬在阴暗的角落里窃窃私语。这些生者制造的噪音、痛苦和怨念，正化作肉眼可见的黑雾，一口一口蚕食着莉莉安娜本就衰退的力量。我们的“家”……正在碎掉。\n我绝不接受自己像个毫无用处的废物一样，只能缩在她的羽翼下，看着她为了保护我而走向消亡。\n我猛地按住自己的胸口。在身体的最深处，那颗曾被我生生从她胸膛剥离、维系着冥界至高权能的“夜莺之心”，正在发出刺骨的、近乎残忍的寒芒。它似乎感知到了我的不甘与急迫，沉寂了万年的晶体开始在我的血液中剧烈共鸣，一股冷酷、绝对、不带任何情感的纯粹秩序力量，顺着我的血管瞬间流遍全身。\n“……你觉得痛苦，是因为他们还在思考。”\n一个空洞、宏大却又无比清晰的声音，在我自己的“心跳”里回荡。\n“……你觉得疲惫，是因为他们还拥有欲望。”\n“……只要剥夺了他们的眼泪，拿走他们的温度，像对待那些听话的玩偶一样，将他们混入永恒、静止的……混乱，不就彻底消失了吗？”\n是啊……它说得对。这就是我曾嗤之以鼻的、死者的秩序。但这却是现在，唯一能将这片废墟重新拼凑起来的方法。\n我缓缓站直了身体。镜子里的那个女人，脸上的自责、痛苦与迷茫正在以一种诡异的速度消退。冰霜覆盖了我的眼眸，冷酷而绝对的理智重新占据了我的大脑。既然生者的混乱无法用温暖去拯救，那我就用这颗最冰冷的心，把他们全部变成城堡里的雕像。用最精细的法则限制他们多余的想法，用最无情的铁律去碾碎所有的哭泣。莉莉安娜想要安静，那我就给她一个最绝对、最完美、谁也无法打扰的寂静之国。\n只是，在冰霜彻底封死我最后一丝体温的刹那，指尖下那件残留着她淡淡余温的披肩，却固执地在我灵魂的最深处，留下了一道微不足道、却怎么也无法被冻结的火星。\n“我是在保护你，莉莉。”我对自己冷冷地说道，转过身走向那扇冰冷的大门，\n§O哪怕……你可能会像以前那样，重新开始害怕我。”§!"
PAO.1333.a:0 "§R嘘……从今天起，这里禁止哭泣§!"

PAO.13.t: "和我一样的眼睛"
PAO.13.d: "索拉娜……好像很忙。\n她每天都在制定着各种各样、我看不懂的计划。她说，这是为了让我们的家，变得更“稳固”。\n我不是很懂。\n我只是觉得……这个家，好像变得越来越冷，也越来越……陌生了。\n今天，我一个人，偷偷地，溜出了那间总是很安静的房间。我换上了一件普通的斗篷，走在了这座……我曾以为，已经被我治理得很好的城市里。\n然后，我看到了她们。\n看到了那些……排着长长的队，从冰冷的食槽里，领取着刚好能果腹的、没有任何味道的食物的人们。\n她们的脸上，只有一种……比我那些亡灵臣民，还要深沉的、活着的死寂。\n我走过一个墙角时，看到了一个很小很小的人类女孩。她正蜷缩在那里，因为饥饿，连哭的力气都没有了。她只是，睁着一双大大的、空洞的眼睛，看着人来人往的街道。\n我看着她的眼睛。\n突然……就想起了很久很久以前的、我自己。\n想起了，在那个永恒寂静的国度里，独自一人，坐在冰冷的王座上，等待了上万年的、那个小小的、孤独的公主。\n我们……好像啊。\n都在等待着一个……不会再到来的拥抱。都在忍受着一种……无法被填满的饥饿。\n我的心，突然，像被什么东西，很轻很轻地，刺了一下。\n我从我的口袋里，拿出了今天下午，索拉娜特意留给我的、那块我最喜欢吃的、点缀着水晶糖霜的糕点。\n我走到那个小女孩的面前，蹲下身，把那块……对我来说，很珍贵很珍贵的糕点，轻轻地，递到了她的手里。\n她愣住了。\n她看着我，那双空洞的眼睛里，第一次，闪过了一丝……我能看懂的、名为“困惑”的光。"
PAO.13.a: "§1原来……饥饿，是这种感觉吗？§!"

PAO.14.t: "看不见的墙"
PAO.14.d: "我又偷偷地，溜了出去。\n我带了很多很多……我从索拉娜那里，“偷”来的、好吃的东西。我想，把它们，分给那些……还在饿肚子的孩子们。\n可是……城市里的气氛，变得更奇怪了。\n我看到，昨天还坐在一起、分享着同一块面包的两个工人，今天，却因为对方不小心踩脏了自己的鞋子，而互相推搡，破口大骂。\n我看到，东边街区的居民，会在自己家门口的路上，撒上碎玻璃，只是为了……不让西边街区的孩子，跑到她们这边来玩。\n我把一块很甜的蛋糕，递给一个正在哭泣的小男孩。可他身边的另一个小女孩，却立刻冲了过来，一把将蛋糕打翻在地，然后对着那个小男孩尖叫道：“他是‘北边’来的！他是我们的敌人！”\n我……完全不明白了。\n明明……食物就在眼前，明明……大家只要互相帮助，就都能吃饱。可为什么……她们要像一群被关在同一个笼子里的、饥饿的野兽一样，互相伤害呢？\n我走到那两个还在为了一块黑面包而争吵的工人中间，我想告诉她们，我这里，还有很多很多面包，足够她们两个人都吃饱。\n可她们……好像，完全看不见我。\n她们的眼睛里，只有对彼此的、那种我无法理解的、滚烫的仇恨。\n我站在她们中间，第一次，感到了一种……比万年孤寂，还要刺骨的寒冷。\n我好像……和她们之间，隔着一堵看不见的、冰冷的墙。\n我……要怎么做，才能……让她们，重新看到彼此呢？"
PAO.14.a: "§1索拉娜……这就是……你想要的吗？§!"

PAO.15.t: "“被选中”的代价"
PAO.15.d: "索拉娜说……她为这个死气沉沉的城市，注入了“活力”。\n她说……她给了她们一个值得为之奋斗的“希望”。\n我站在城堡最高的露台上，看着她口中的那份“活力”。\n我看到……一场场为了争夺“被选中”名额的、血腥的角斗，正在城市的每一个角落里上演。\n邻居，会为了一个虚假的举荐名额，向警察告发他的邻居。\n兄弟，会为了能让自己先一步爬上那座通往城堡的长桥，而毫不犹豫地，将自己的兄弟，从悬崖上推下去。\n甚至……有母亲，会为了能让自己的孩子，获得进入城堡的“资格”，而亲手，将别人家的孩子，献祭给那些……根本不需要祭品的“夜莺的魂灵”。\n今天，是这个月的“遴选日”。\n\n有一个年轻人，成功了。他踩着无数人的尸体，浑身是血地，终于，爬到了那座通往城堡的长桥上。\n他以为……他赢了。\n可就在他即将踏入城堡大门的那一刻，两个守在门口的“夜莺的魂灵”，无声地，举起了手中的长枪，交叉着，拦住了他的去路。\n然后，一个冰冷的、不带任何感情的声音，从城堡的广播里传出，响彻了整个城市。\n那是……索拉娜的声音。\n“很遗憾。你们之中，并没有‘被选中者’。下个月，继续努力吧。”\n那个年轻人，跪倒在了桥上。他看着那扇在他面前，缓缓关上的、巨大的城堡之门，又回头，看了看桥下那些……正对他发出恶毒诅咒的、曾经的同胞。\n然后，他发出了一声……不似人类的、绝望的嘶吼，纵身一跃，从那座……代表着“希望”的长桥上，跳了下去。\n我……静静地看着这一切。\n我缓缓地，走回了那个……温暖的、安宁的、属于我一个人的房间。\n我走到那面……光洁如水的镜子前，看着镜子里，那个穿着华丽公主裙的、天真的、不食人间烟火的……“我”。\n我突然觉得……"
PAO.15.a: "§1……恶心§!"

PAO.16.t: "什么是“爱”？"
PAO.16.d: "今天，是“神恩”降临的日子。\n索拉娜从所有“顺从”的人类中，挑选出了十个“最忠诚的幸运儿”，允许她们，进入我们这座永恒的城堡，永远地，摆脱外面的饥饿与痛苦。\n整个城市，都为此而陷入了一种病态的狂热。我看到无数人，为了能得到那个虚无缥缈的名额，互相揭发，互相出卖，甚至……向自己的亲人，挥起屠刀。\n我看不下去了。我躲回了房间，捂住了耳朵。\n直到深夜，一阵撕心裂肺的、绝望的哭喊声，穿透了墙壁，也穿透了我的心脏。我走了出去。\n在城堡冰冷的、巨大的门外，一个年轻的母亲，正跪在滂沱的暴雨里。她的孩子，因为在之前的“选拔”中，不够“忠诚”，而被淘汰了。而她自己，却成为了那十个“幸运儿”之一。\n现在，她正用力地，用自己的额头，撞击着那扇她再也无法为孩子打开的、冰冷的城堡大门。\n“求求您……求求您……”她哭得上气不接下气，“把我的名额……给他吧……他还那么小……他还什么都不懂……”\n“我愿意……我愿意去矿场……我愿意去死……求求您……让他进去吧”\n我站在她的身后，撑着伞，静静地听着。雨水，打在伞面上，发出沉闷的声响，像一声声敲在我心上的、冰冷的重锤。\n我抬头望向城堡最高处的那扇窗。索拉娜就站在那里。她正静静地，俯瞰着下方这幕由她亲手导演的、残忍的戏剧。她的脸上，找不到任何表情。\n那一刻，我突然就什么都明白了。\n我明白了，我过去那些天真的、想要用“故事”和“糖果”，去拯救她们的想法，是多么的可笑。我明白了，索拉娜她从来就没有想过要给这些人真正的“幸福”。她只是，在用一种更高级、更残忍的方式，在重复着她自己童年时，所经历过的那场地狱。\n她不是在统治。她是在……复仇。向这个，曾让她像野狗一样，在泥泞里挣扎的、该死的世界，复仇。\n而我……\n我看着那个在泥水里，为了自己的孩子，连尊严都彻底舍弃的、渺小的母亲。\n我又想起了很久很久以前，只在童话书里才能看到的，那个为了能让孩子活下去，而选择背负了整个世界的罪责的母亲。\n原来……原来，真正的“爱”，不是把一个人，锁在自己为她建造的、完美的、安安静静的城堡里。\n是愿意为了她，走出去，走进那片……自己最害怕的、充满了风雨和泥泞的世界里去啊。\n我缓缓地，收起了伞。冰冷的雨水，瞬间，将我浑身都淋得湿透。\n我走到那个母亲的身边，蹲下身，用我那双……只会弹奏竖琴、只会翻阅童话书的、冰冷的手，轻轻地，扶住了她那双，因为绝望，而深深陷入泥土里的、温暖的手。"
PAO.16.a: "§1我爱你们，人类。我爱你，索拉娜。§!"

PAO.17.t: "请停下来！"
PAO.17.d: "索拉娜疯了。\n我看着她用最残酷的手段，将人民逼上了绝路。然后，又用一种近乎自毁的姿态，等待着那场……由她亲手点燃的、审判的火焰，将她自己也一并吞噬。\n我……不能让她得逞。我不能眼睁睁地看着，她就这样在我面前，把自己……烧成灰烬。\n于是，我走了出去。第一次，违背了她的“命令”，走出了那座冰冷的城堡。\n我来到了战场。我看到了那些……眼睛里燃烧着和“野火”一样火焰的人们。她们愤怒，她们绝望，她们……只想摧毁眼前的一切。\n我也看到了，那些依旧忠诚于索拉娜的、强大的禁卫军。她们的眼中只有绝对的服从。\n她们，即将在这里，进行一场……毫无意义的、互相毁灭的血战。\n我走到了她们的中间。\n“……停下来。”\n我的声音很轻，却穿透了所有的呐喊与嘶吼。\n所有人都愣住了，她们看着我。这个……她们眼中，和暴君索拉娜并无区别的、另一个“女王”。\n“我知道……你们恨她。”我看着那些起义的人民，声音里，带着一丝我自己都未曾察觉的颤抖，“我也……恨她。”\n“我恨她……把我一个人，丢在那个冰冷的家里，那么久。”\n“我恨她……把我最喜欢的、安安静静的世界，弄得这么吵闹。”\n“我更恨她……像现在这样，一声不吭地，就想把自己……变成一个谁也够不着的、冰冷的坏人。”\n然后，我转过身，看向那些……已经将武器对准了我的、索拉娜的禁卫军。\n“……我也……爱她。”\n我的声音，轻得像一阵叹息。\n“我爱她……曾为我带来的、唯一的光。”\n“我爱她……就算自己伤痕累累，也依然会记得，为我带回一颗糖的、笨拙的温柔。”\n“所以……”我张开双臂，挡在了她们和那些愤怒的人民之间，“……我不允许。我不允许你们，为了她那错误的、任性的命令，去伤害这些……和她一样，只是想活下去的人们。我也决不允许，你们，为了所谓的‘正义’，去伤害这个……我唯一想守护的、笨拙的……坏孩子。”\n我不知道，她们能不能听懂。我也不知道，她们会不会，在下一秒，就将我和她们的敌人，一同撕碎。\n我只是……闭上了眼睛。\n然后，对所有人，说出了我……唯一能想到的、笨拙的请求。\n“……求求你们。”\n“……在审判她之前，能不能……先试着，相信我一次？”"
PAO.17.a: "§1整个战场，都陷入了长久的、死一般的寂静§!"

PAO.18.t: "理想与哀歌"
PAO.18.d: "“……莉莉安娜。”\n你的声音，很轻，像是在说一个，与自己无关的故事。“我的那个‘理想’……其实很简单。”\n“我只是……不想再看到任何人，像我小时候那样，为了半块发霉的面包，就和野狗一起，在泥潭里打滚了。”\n“我以为……只要我拥有了最绝对的权力，建立起最森严的秩序，把所有人都像齿轮一样，安排在他们该在的位置上……饥饿，和纷争，就都会消失了。”\n“我以为……我是在为她们，建造一座，能抵御一切风雨的、最坚固的堡垒。”\n“可我错了。”你的嘴角，露出了一丝苦涩的、自嘲的笑。\n“我忘了……人，不是齿轮。她们会痛，会爱，会为了那些……我早已丢掉的、名为‘尊严’的东西，去拼上自己的性命。”“我忘了……当饥饿消失了，她们就会开始渴望‘自由’。而‘自由’，恰恰是我那座完美的、绝对秩序的堡垒里，唯一，也是最不需要的东西。”\n“于是……野火，就燃起来了。”“我输了。输得一败涂地。”\n“当我被那些……我曾视为蝼蚁的人们，从王座上赶下来的时候，我才终于明白……我的那个‘理想’，从一开始，就只是一个……自以为是的、傲慢的笑话。”\n“你把我带了回来。你用你的温柔，治愈了我的伤口，也……照亮了我内心最深的黑暗。”\n“我看着你，用你那天真的、笨拙的方式，去爱着那些……曾经被我伤害过的人们。我看着她们，在你面前，慢慢地，放下了仇恨，露出了笑容。”\n“我突然……就嫉妒了。”“我嫉妒你，莉莉安娜。我嫉妒你……能那么轻易地，就得到我花了半辈子、用尽了所有卑劣手段，都得不到的东西。”\n“那一刻，我终于……为你，也为她们，找到了那条……唯一的、通往真正‘幸福’的路。”\n你转过头，深深地，看着我。那双曾燃烧着火焰的眼睛里，此刻，只剩下一种……无边无际的、温柔的悲伤。\n“莉莉安娜。你知道吗？人民的怒火，是不会凭空消失的。它需要一个出口。需要一个……能让她们将所有仇恨，都倾泻于其上的、罪恶的化身。”“而我……就是那个，最完美的‘罪人’。”“我的罪，罄竹难书。我的手，沾满了她们亲人的鲜血。这一切，都无法被原谅，也……不该被原谅。”“只有我……这个旧时代的、最后的暴君，彻彻底底地，消失在这个世界上……”“她们，才能真正地，放下过去，去拥抱，你为她们带来的、那个崭新的、温柔的未来。”\n“只有我的王座，彻底变成一座冰冷的坟墓……”\n“……你，才能在那片废墟之上，为她们，也为你自己，加冕成……真正的、受人爱戴的女王。”"
PAO.18.a: "§1不……不要……§!"

PAO.19.t: "王座上的灰烬"
PAO.19.d: "战斗……结束了。\n当我和人民一起，推开那扇沉重的、未曾上锁的殿门时。\n我们就看到了她。\n她穿着一件……我第一次见到她时，她穿过的那件、朴素的白色长裙。\n她就静静地，坐在那张象征着无上权力的王座上，微笑着，看着我们。\n她的身前，没有一个卫兵。\n她的手中，也不见任何武器。\n她只是……在等。\n我缓缓地，走上前去。身后，是人民压抑着的、充满了仇恨的呼吸声。\n我走到了她的面前。\n“……莉莉。”她对我笑了。那是我……回来以后，第一次，看到她露出那样……不带一丝阴霾和痛苦的、真正温柔的笑容。\n“你看，”她从王座上跪了下来，指了指我身后，那些……眼中燃烧着火焰的人们，“……她们，是不是……比我们那些只会服从的‘魂灵’，要……可爱得多？”\n我……说不出话来。\n“……以后，”她伸出手，似乎想……像很久很久以前那样，再碰一碰我的脸颊。可她的手，却在半空中，就开始……一点一点地，化作了灰色的、飞舞的尘埃，“……这个家，就……交给你了。”\n“……要……好好地……爱她们啊……”\n然后，她就在我的面前，在所有人的注视下，彻底地，化作了一捧……温暖的、黯淡的灰烬，轻轻地，洒满了那座冰冷的王座。\n外面，传来了山呼海啸般的、庆祝胜利的欢呼声。\n人们在庆祝暴君的死亡。\n人们在庆祝光明的到来。\n人们在庆祝……她们的自由。\n我跪在那座空荡荡的王座前，伸出颤抖的双手，小心翼翼地，接住了那些……还在不断飘落的、她最后留下的、温暖的余烬。\n我爱她们。\n是的。\n我爱着这些……善良的、勇敢的、教会了我什么是“爱”的人们。\n可是……\n§R我也是……那么那么地……爱着这个……被她们，视为不共戴天之敌的、世界上最大的……坏蛋啊！！！§!"
PAO.19.a: "§t（盛大的庆典§!§1 ，§!§L无声的葬礼）§!"

PAO.20.t: "公主的“裁决”"
PAO.20.d: "我把她们都请来了。\n那些……吵得最厉害的、工人的代表，和农民的代表。\n我想……像索拉娜那样，听一听她们的声音，然后，为她们，做出一个“公平”的裁决。\n可是……我听不懂。\n工人们说，没有她们生产的工具，农民就无法耕种。\n农民们说，没有她们种出的粮食，工人就会饿死。\n她们说的……好像，都很有道理。\n这就像我花园里的两朵花。一朵是红色的，一朵是白色的。我不能说，哪一朵，比另一朵，更漂亮。因为她们都很好看。\n她们还在吵。声音越来越大，整个房间，都变得和生者的世界一样，吵闹不堪。\n我有点……不知所措了。\n然后，我想起了一个索拉娜曾经教给我的、她说是在她故乡很流行的、一种解决纷争的“游戏”。\n我让侍从，拿来了很多很多……黑色和白色的、很光滑的小石子。\n我把黑色的，分给了工人代表。把白色的，分给了农民代表。\n然后，我用我最温柔、也最认真的语气，对她们说：\n“……那个……我们，不吵了好不好？”\n“我们来玩一个游戏吧。你们把自己的石子，放在我面前。谁放的石子……比较好看，就算谁赢，怎么样？”\n整个房间，瞬间，就安静了下来。\n所有的人，都用一种我完全无法理解的、混杂着震惊、茫然和一点点……想笑又不敢笑的表情，看着我。"
PAO.20.a: "§1（是我又说错话了吗？）§!"

PAO.21.t: "那一声哭啼"
PAO.21.d: "我去看望那个新生儿了。\n那是我第一次，如此近距离地，观察一个刚刚来到这个世界的、最纯粹的生命。\n她好小，好软，皮肤像我花园里最娇嫩的花瓣。她睡着的时候很安静，呼吸均匀，像一团小小的、温暖的光。\n我看着她，突然就想到了一个问题。\n一个我统治了夜莺国度上万年，却从未思考过的问题。\n我们亡灵，从诞生之初，形态与本质就已固定。一个士兵的灵魂，将永远是士兵；一个工匠的灵魂，也永远是工匠。我们只是在永恒的寂静里，重复着自己被赋予的角色。\n可她不一样。\n这个小小的、现在只会睡觉和哭泣的生命，她未来会变成什么样子呢？\n她会长大，会学习，会爱上一个人，会为了某个理想而欢笑或流泪。她的灵魂，会像一块未经雕琢的璞玉，在漫长的岁月中，被她所经历的一切，慢慢地，塑造成一个独一无二的、无法被复制的形状。\n是什么东西，决定了这一切？\n是她与生俱来的天性？是她父母的教导？还是……这个，由我守护的、吵闹又温暖的世界？\n就在我沉思的时候，那个小小的婴儿，突然醒了。\n她睁开眼睛，看到了我这个陌生的、散发着冰冷气息的存在。然后，她毫不意外地，张开嘴，发出了来到这个世界上之后，一声响亮的、中气十足的哭啼。\n那哭声，一点也不好听。很吵闹。\n可我……却好像，从那充满生命力的哭声里，听到了一首……比我听过的任何一首安魂曲，都更动听的歌。"
PAO.21.a: "§1（这就是生命的声音吗？）§!"

PAO.22.t: "初次见面"
PAO.22.d: "摇篮，打开了。\n伴随着一阵柔和的、如同风铃般的声音，那个我倾注了所有希望的女孩，缓缓地，睁开了她的眼睛。\n那是一双……和她一模一样的、火焰般的红色眼眸。\n但里面，没有了我所熟悉的、那些痛苦的伤痕与燃烧的野心。只有一种……像刚刚出生的雏鸟般、对这个世界最纯粹的、清澈见底的好奇。\n她从摇篮中坐了起来，黑色的双马尾随着她的动作，俏皮地晃动着。她看到了我，歪了歪头，然后，露出了一个比我花园里所有花朵加起来，还要灿烂的笑容。\n“你好呀！”她的声音，像阳光下跳跃的溪流，充满了清脆的活力，“你是……创造了我的公主殿下吗？这里，就是你说过的、那个需要被拯救的世界吗？故事里那些需要被打倒的坏蛋，和需要被保护的好人们，都在哪里呀？”\n我……被她问得愣住了。\n我为她，准备了上万句，温柔的、充满爱意的欢迎词。\n可我……一句，也说不出来。\n她不是她。\n她没有她那双，总是在深夜里，凝视着我的、复杂的眼睛。\n她没有她那种，总是带着一丝嘲讽与苦涩的、却又无比温柔的笑容。\n她更没有……我们之间，那些纠缠了上万年的、沉重的、无法被割舍的记忆。\n她是一个崭新的、一尘不染的、比我能想象到的最完美的光，还要耀眼的存在。\n她……是我的“理想”。\n也是……我永恒的、再也无法被弥补的“失去”。\n我看着她那双，充满了对“正义”与“冒险”的、天真渴望的眼睛。\n眼泪，不知不觉地，就落了下来。\n“……你怎么哭了呀，公主殿下？”她有些担心地，凑了过来，用她那双温暖的、小小的手，轻轻地，擦去了我脸上的泪水，“是那些坏蛋，欺负你了吗？你告诉我，她们在哪里！我现在，就去为你，打倒她们！”\n我看着她，终于，露出了一个……比哭，还要悲伤的笑容。\n我轻轻地，握住了她的手。\n“……不。我没哭。”\n“……我只是，太开心了。”\n“……欢迎回来。”\n“……我的……‘光明’。”\n“……露西莉亚。”"
PAO.22.a: "§1你好，露西莉亚。再见，索拉娜。§!"

PAO.23.t: "第一次看到笑容"
PAO.23.d: "我带她，去参观了我们莉兰迪亚最引以为傲的杰作——“无忧花园”。\n在这里，所有的人类，都不再需要劳作。她们的生活，由绝对服从、不知疲倦的“夜莺的魂灵”们悉心照料。食物会准时出现在餐桌上，衣物会被清洗得一尘不染。这里的一切，都像我曾为你描绘的、那个最完美的童话。\n我自豪地向她介绍：“你看，露西莉亚。在这里，每一个人，都能得到最妥善的照顾。这就是……我为你准备的、一个没有悲伤的世界。”\n她看着眼前的一切，看着那些在花园里散步、下棋、无所事事的人们，那双红色的眼睛里，却充满了……我无法理解的困惑。\n“莉莉安娜。”她突然，拉住了我的手，指着不远处一个正在给水晶花朵“浇水”的老人，小声地问我，“……那位老奶奶，她……为什么，不笑呢？”\n我愣住了。\n是啊。为什么呢？\n我给了她们一切。我为她们，消除了所有物质上的烦恼。可她们的脸上，却只有一种……平静的、近乎麻木的表情。就像一群，被照顾得很好的、漂亮的人偶。\n就在这时，一阵风，吹过花园。将远处一个孩子手中，用蒲公英编成的小小花冠，吹到了半空中。\n孩子“呀”地叫了一声，眼看就要哭出来了。\n露西莉亚动了。\n在她思考之前，她的身体，已经像一支离弦的箭，冲了出去。她高高地跃起，在那顶小小的花冠落地之前，轻巧地，将它接在了手中。\n她跑到那个孩子的面前，蹲下身，把那顶完好无损的花冠，重新，戴回了那个孩子惊喜的、瞪圆了眼睛的、小小的脑袋上。\n然后，她露出了一个，比花园里所有水晶花朵加起来，还要灿烂的、发自内心的笑容。\n那个孩子，看着她，也笑了。\n那是……我在这座花园里，第一次，看到的、真正的笑容。\n我站在远处，看着这一幕。看着她们一大一小，两个身影，在阳光下，笑得那么开心。\n我的心里，第一次，泛起了一丝……连我自己也无法理解的、混杂着喜悦与失落的复杂情绪。\n我好像……为她，建造了一座最完美的鸟笼。\n可她，却用自己的翅膀，为这座鸟笼里，带来了第一缕……真正自由的风。"
PAO.23.a: "§1她……好像和我预想的，有些不一样。§!"

PAO.24.t: "没有结局的故事书"
PAO.24.d: "夜深了。\n这是她最喜欢的时刻。\n每天晚上，她都会缠着我给她讲一个新故事。而我，也总会如她所愿。\n我捧着那本我亲自“修改”过的童话书，用最轻柔的声音，为她讲述着那些关于善良与美好的故事。\n“……然后，勇敢的骑士走进了喷火龙的山洞。”我念道，“可他只是给了那头因为孤独而喷火的巨龙，一个大大的、温暖的拥抱。巨龙的火焰，就变成了五彩的糖果，落满了整个山谷。”\n“哇……”她发出了小小的、满足的赞叹声，眼睛里，闪烁着比窗外星星还要亮的光。\n我微笑着，翻到了下一页。\n“……最后，迷路的小公主，找到了那座用饼干和糖果盖成的小屋。屋子里的老奶奶，并没有像传说中那样，想把她吃掉。她只是，给了小公主一碗热乎乎的南瓜汤，然后，为她指明了回家的路。”\n我讲着这些……被我抽去了所有尖刺和阴影的故事。我看着她那张因为听到美好结局而充满了幸福与安宁的睡脸。\n我的心里，感到了一种前所未有的平静。\n就在我准备合上书本，让她安然睡去时。\n她突然，迷迷糊糊地，说了一句梦话。\n“……莉莉安娜……”她的声音，像棉花糖一样柔软，“……那……那个被你拥抱的‘坏蛋’……后来……去哪里了呀？”\n我捧着书的手，突然僵住了。"
PAO.24.a: "§1……睡吧，我的孩子。§!"

PAO.25.t: "请惩罚我吧"
PAO.25.d: "她回来了。\n从那个……充满了哭声的家庭里，回来了。\n她没有像往常一样，跑来找我，兴奋地讲述她又“帮助”了谁。\n她只是，一个人，走进了这座空旷的主殿。然后，解下了腰间那把，我亲手为她打造的、只为守护而存在的剑，双膝跪地。\n我走到她的面前，心里，涌起一种不祥的预感。\n“露西莉亚，起来。地上凉。”我轻声说。\n她低着头，声音里，带着一种我从未听过的、沙哑的颤抖。\n“莉莉安娜。”\n“……我，是不是……一个很没用的骑士？”\n我愣住了。\n“你说过的，我的使命，是守护人民的笑容，是让这个国家，再也没有眼泪。”她抬起头，那双红色的眼睛里，第一次，失去了光，只有一片……湿漉漉的、浓得化不开的迷茫。\n“可是……今天，我看到她们哭了。我把我从童话书里学来的、所有能让人开心起来的方法，都试了一遍。我给了她们糖果，给她们讲了笑话，我还向她们保证，我会为她们，打倒所有让她们不开心的‘坏蛋’。”\n“……可她们……却哭得更伤心了。”\n“她们说……她们的家人，再也回不来了。”\n“莉莉安娜……”她看着我，像一个迷路的孩子，问出了那个……最天真，也最残忍的问题。\n“……‘死亡’……是不是，就是那个……连我，也无法打倒的、最坏最坏的……‘坏蛋’？”\n我……无法回答。\n我只能看到，她眼中的那份、对于“绝对正义”的、纯粹的信仰，第一次，出现了裂痕。\n然后，她缓缓地，将那把剑，双手举起，捧到了我的面前。\n“……我让人民流泪了。我违背了我的誓言。我……是个失败的守护者。”\n“……所以，莉莉安娜。请按照骑士的法则，来惩罚我吧。”"
PAO.25.a: "§1我该怎么向她解释，这个世界的悲伤？§!"

PAO.26.t: "撕碎谎言"
PAO.26.d: "你没有回答我。\n那天，你只是沉默地，摸了摸我的头，然后，就离开了。\n我知道，你在害怕。\n莉莉安娜，你在害怕那个你还没说出口的答案，会把我变成另一个，你认识的人。\n所以我决定，自己去找。\n我把自己关在了书房里。我不再只看你给我准备的那些、结局永远是美好的童话了。我开始去翻阅那些被你藏起来的、关于真实历史的、布满了灰尘的卷宗。\n我看到了。\n我看到了，在索拉娜的王国里，那些仅仅因为“有趣”，就被送上绞刑架的诗人。\n我看到了，那些会因为听到孩子的哭声而感到愉悦的、旧帝国的贵族。\n我看到了……战争，瘟疫，背叛……和无数，毫无理由的、纯粹的恶意。\n我一页一页地翻着。\n我的手，在抖。我的心，像被一双冰冷的手，一点一点地，撕得粉碎。\n书上说的那些……那些可以用“爱”和“拥抱”，去感化的敌人……\n一个，都没有。\n这里只有一群群，戴着人类的面具的、无法被理解的怪物。\n……\n骗子。\n你们……全都是骗子。\n那些童话书，是骗我的。\n那些英雄的故事，是骗我的。\n你……也是骗我的。\n我站起来，发疯一样，把我曾经最宝爱的那些童话书，一本一本地，从书架上扯了下来，用力地，撕得粉碎。\n我不要再看到那些虚假的、亮晶晶的“希望”了。\n我只是，跪在这片由谎言组成的、洁白的废墟里。\n然后，对自己，问出了那个……你一直，不敢回答我的问题。\n“如果，爱，无法战胜邪恶。”\n“那么，我的剑，到底是为了什么而挥舞的呢？”"
PAO.26.a: "§t骑士的童话，结束了。§!"

PAO.27.t: "行囊里的童话"
PAO.27.d: "明天，我就要走了。\n去往那个你再也无法为我描绘的、真实的世界。\n我看着你，蹲在我的行囊前，像一个普通的、为即将远行的孩子担忧的母亲。\n你把一件叠得整整齐齐的斗篷，又塞了进去。\n“外面会冷的。”你轻声说，头也没抬，“尤其是在山里，夜里的风很硬。”\n然后，你又拿出了一小袋亮晶晶的水晶糖。\n“这个也带上。不开心的时候，吃一颗。甜的东西，总能让人有力气一点。”\n最后，你从自己的口袋里，拿出了一个小小的、用最柔软的天鹅绒布包裹着的东西，小心翼翼地，放进了行囊的最深处。\n我看着你的动作，终于，还是忍不住，开口了。\n“莉莉安娜。”\n我的声音很平静。\n“……你错了。”\n你整理行囊的手，停顿了一下。\n“那些书，你说错了。”我缓缓地说，“这个世界上，有很多‘坏人’，是无法被拥抱，也无法被感化的。她们……就是纯粹的‘恶’。”\n你沉默地，站起身，转过来，看着我。\n你的脸上只有一种……比月光还要温柔的、带着一丝悲伤的、平静的眼神。\n“……那你，打算怎么办呢？”你轻轻地问。\n“我不知道。”我诚实地回答，“我只知道，我过去所相信的一切，都可能是错的。我甚至不知道，我手中的这把剑，还能不能……守护好你为我描绘的那个、美好的世界。”\n你走到我的面前，伸出手，轻轻地，为我理了理有些凌乱的衣领。\n“露西莉亚。”\n你的声音，像一阵温暖的风，吹散了我心中所有的迷雾。\n“……我让你读那些故事，不是为了让你相信，这个世界没有黑暗。”\n“……我只是想让你，在学会如何与黑暗战斗之前，先知道……光明，到底是什么样子的。”\n“我只是想让你，先爱上这个世界。爱上这里会笑的人们，爱上这里会开的花，爱上这里……所有所有，值得被守护的美好。”\n“这样，当你以后，真的遇到了那些……无法被原谅的‘恶’时。”\n你捧起我的脸，用你的额头，轻轻地，抵住了我的额头。\n“……你就永远，不会忘记，自己，到底……是为了什么，才拔出剑的了。”"
PAO.27.a: "§t这才是童话本身的意义吗§!"

PAO.28.t: "第一次，也是最后一次警告"
PAO.28.d: "我找到了她们。\n就在城西的广场上。那里，空间像是被折叠了起来，充满了不祥的气息。\n我看到了那个……传说中的魔法少女。她很强大，正独自一人，对抗着一个我看不见的、却能感受到其巨大恶意的敌人。\n可她……也同样很傲慢。\n她的战斗，掀起了巨大的狂风，吹倒了房屋；她释放的魔力，像失控的洪流，在我们脚下的地面，犁出了深深的沟壑。\n她没注意到，在她身后不远处，一个抱着孩子的母亲，正因为躲闪不及，即将被一块被魔力卷起的巨石砸中。\n我冲了过去。\n我用我的剑，挡住了那块石头。\n战斗结束了。那个看不见的敌人，消失了。\n那个魔法少女，缓缓地，从空中降落下来。她看着我，眼神冰冷，像是在看一个……打扰了她“工作”的、不知好歹的虫子。\n“你在做什么，凡人？”她的声音，像毫无温度的水晶，“你差点，就破坏了我的‘净化’。”\n“你在做什么？”我反问她，同时，将那个还在瑟瑟发抖的母亲和孩子，护在了我的身后，“你的‘净化’，差点，就毁掉了你发誓要守护的东西。”\n她的脸上，第一次，露出了……名为“错愕”的表情。"
PAO.28.a: "§t我们……到底，在守护着什么？§!"

PAO.29.t: "第一次，也是最后一次警告？"
PAO.29.d: "又是一场……无聊的狩猎。\n那只躲在阴影里的怪物，比我想象的还要弱小。解决它，甚至没有让我感到一丝的疲惫。\n就在我准备给予它最后一击时，一个“意外”，发生了。\n一个浑身散发着奇怪光芒的、有着黑色双马尾的“凡人”女孩，突然，像一颗炮弹一样，冲进了我的结界。她用她那把看起来华而不实的剑，挡住了一块……我根本没有放在心上的、飞散的碎石。\n她……在做什么？\n我结束了战斗，落在了她的面前。\n我想斥责她。斥责她的愚蠢，斥责她的无知，斥责她这种……毫无意义的、多愁善感的“善良”。\n可我……却说不出口。\n因为，我看到了她身后的那个凡人母亲。那个女人，正用一种……我从未见过的、充满了感激和信赖的眼神，看着眼前这个，同样是“凡人”的女孩。\n那种眼神……她们，从未，对我们露出过。\n她们看我们时，眼中只有敬畏，和恐惧。\n“你的‘净化’，差点，就毁掉了你发誓要守护的东西。\n那个黑发女孩，对我说道。\n她的声音，很平静。\n可那句话，却像一把最锋利的剑，刺穿了我用强大和孤独，伪装了无数年的、冰冷的盔甲。"
PAO.29.a: "§9我们……到底，在守护着什么？§!"

PAO.30.t: "两种不同的光"
PAO.30.d: "她赴约了。\n那个魔法少女的领袖，独自一人，来到了我的面前。\n“我还是无法理解你。”她先开了口，声音像失去了温度的月光，“你的力量很弱小，你的觉悟很天真。你把时间，浪费在那些……无意义的、个人的悲欢离合之上。而我们，背负的是整个世界的‘因果’，是在你们看不见的地方，对抗着真正的‘绝望’。我们的战斗，根本不在同一个层面上。”\n我没反驳她。\n我指了指我们脚下，那片……灯火通明的城市。\n“你看。”我说。\n“那里，有刚刚下班的工人，正走在回家的路上。那里，有围在餐桌旁的家人，在分享着一天的见闻。那里，还有无数个孩子，正在父母的故事声中，安然睡去。”\n“这些……在你看来，或许都是‘无意义’的、个人的悲欢离合。”\n“可对我来说，她们，就是我的整个世界。”\n我抬起头，直视着她那双，因为背负了太多而变得不再像人类的、清澈的眼睛。\n“你的战斗，是为了守护一个‘概念’。而我的战斗，是为了守护每一个‘具体的人’。你的光，照亮的是天空。而我的光，只想点亮，她们窗前的每一盏灯。”"
PAO.30.a: "§t也许……我们，并没有那么不同。§!"

PAO.31.t: "两种不同的光？"
PAO.31.d: "我赴约了。\n我想……最后一次，让她明白，我们之间那道无法被逾越的鸿沟。\n我告诉她，我们所背负的宿命，是她这种……天真的、活在童话里的骑士，永远无法理解的重量。\n可她……没有和我辩论。\n她让我去看，她脚下的那片土地。\n那片……吵闹的、混乱的、充满了各种各样……我早已舍弃的、属于“凡人”的情感的土地。\n她说，那些，就是她的世界。\n她说，我的光，照亮的是天空。而她的光，只想点亮，窗前的每一盏灯。\n那一刻，我突然，就说不出话来了。\n我想起了很久很久以前……在我还没有成为“领袖”，只是一个普通女孩的时候。\n我之所以，会签下那份契约，许下那个……守护世界的愿望。\n最初的、最初的那个理由……\n好像……也只是为了，能让我最喜欢的那个人，在每一个夜晚，都能安安心心地，回到那盏……为她而亮的、小小的、温暖的灯下而已。"
PAO.31.a: "§9也许……我们，并没有那么不同。§!"

PAO.32.t: "那么，故事该怎么讲？"
PAO.32.d: "她……真的来了。\n她像一个普通的邻家大姐姐一样，走进了我们新建的图书馆。\n孩子们都很好奇，围着这个……身上好像会发光的、漂亮的大姐姐。\n我把那本我最喜欢的、也是莉莉安娜为我修改过的童话书，递给了她。\n“那个……”我有点不好意思地说，“今天……轮到我给大家讲故事了。可是……可是我……不是很会讲。你……你能不能……帮帮我呀？”\n她看着我，又看了看周围那些……充满了期盼的、亮晶晶的眼睛。\n她的脸上，第一次，露出了那种……名为“不知所措”的表情。\n她接过了那本童话书，翻开了第一页。\n上面写着：“很久很久以前，有一条很坏很坏的喷火龙……”\n她念到这里，就卡住了。\n她抬起头，用一种很复杂的眼神，看着我。\n我好像……有点明白了。\n在她的世界里，“坏龙”，是需要被立刻消灭的敌人。是不需要，也不会有任何“然后”的。"
PAO.32.a: "§t故事，可以有很多种讲法。§!"

PAO.33.t: "故事该怎么讲？"
PAO.33.d: "我……真的来了。\n我不知道自己为什么要来。\n或许，我只是想亲眼看看，那个被她称为“世界”的、小小的、温暖的灯火，到底是什么样子的。\n然后……她就把一本童话书，塞进了我的手里。\n她说，她不会讲。\n我翻开了书。\n“……有一条很坏很坏的喷火龙……”\n我的喉咙，像是被什么东西堵住了。\n我的一生，都在和各种各样的“喷火龙”战斗。我知道它们有多么强大，多么残忍，也知道……要付出多大的代价，才能将它们彻底消灭。\n可这本书……要我怎么讲下去？\n讲骑士如何用剑刺穿它的心脏吗？讲它的血，染红了整个山谷吗？\n不行。\n我不能……对这些，还相信着“拥抱”就能解决一切的孩子们，说出这么残忍的故事。\n就在我沉默的时候。\n那个黑发女孩，突然，凑到了我的耳边，用只有我们两个人能听到的声音，悄悄地，对我说了几句话。\n她说：“……莉莉安娜告诉我，这个故事的后面，是骑士发现，那条龙，只是因为牙疼，才乱喷火的。后来，骑士为它拔掉了坏掉的牙齿，她们就成了好朋友。”\n我……愣住了。\n我看着她，看着她那双……清澈得，仿佛能倒映出整个世界的、红色的眼睛。\n我突然……就笑了。\n笑得……连我自己，都觉得有些不可思议。\n我清了清嗓子，然后，对着面前那些，充满了期盼的孩子们，用我能想到的、最温柔的语气，缓缓地，开始了我的讲述：\n“……很久很久以前，有一条……其实一点也不坏的、只是有点可怜的……喷火龙……”"
PAO.33.a: "§9故事，可以有很多种讲法。§!"
PAO.33.b: "§R故事，始终伴随着无尽的孤独。§!"

PAO.34.t: "花朵的“悄悄话”"
PAO.34.d: "莉莉安娜为她们建造了这座很漂亮的花园。\n但我总觉得，这些水晶花，好像有些不开心。她们虽然永远不会凋谢，但也永远，都只是保持着同一个不会改变的样子。\n所以我决定，每天晚上都来给她们浇浇水。我知道她们其实不需要水，可我就是觉得，如果我每天都来看看她们，和她们说说话，她们一定会变得更精神一点。\n今天晚上，那个魔法少女的领袖也来了。\n她就静静地站在我的身后看着我，她的眼神和这些水晶花一样很漂亮，也很孤单。\n她提醒我说这些花是不需要浇水的。\n我告诉她:“我知道呀。可是只是看着，是没办法和她们成为朋友的。你要关心她们，要让她们感受到你的温度，她们才会为你开出更漂亮的花呀。”\n她听了我的话好像愣住了。她低下头看着自己手里那颗像星星一样好看的宝石，很久很久都没有再说话。\n我看着她，突然就有点难过。\n我好像有点明白，为什么这些水晶花会不开心了。\n因为她们和她一样，都在用一层坚硬的、亮晶晶的外壳，把自己和这个世界隔开了。她们害怕凋谢，所以就放弃了生长。她们害怕受伤，所以,就拒绝了拥抱。\n于是我放下洒水壶，从花园的角落里，摘下了一朵我偷偷种下的、真正的、会在一夜之间盛开又会很快凋零的、小小的白色月见草，轻轻地，别在了她的头发上。\n“你看，”我笑着对她说，“虽然它明天可能就会谢掉，可是……它至少，真真正正地，为今天晚上的月亮，开过一次花呀。”\n她抬起头看着我。那双总是像冰一样冷的眼睛里，好像第一次，有了一点点融化的痕迹。"
PAO.34.a: "§t比起永恒的美丽，我更喜欢，§!"
PAO.34.b: "§t勇敢地、为月亮开过一次的花。§!"

PAO.35.t: "两种不同的花"
PAO.35.d: "我从未想过，有一天我会在战斗之后来到这样一个地方。\n这座花园是她和那个亡灵公主一起为我们建造的，这里很安静，也很温暖。那些用魔力凝结而成的水晶花朵永远不会凋谢，而被称为“夜莺”的亡灵们则会无声地为我们端上热茶，送来干净的绷带。\n这里就像一个永恒的、绝对安全的避风港。\n今晚我看到她了，那个莉兰迪亚的“公主骑士”。\n她正提着一个和她差不多高的巨大洒水壶，吃力地一棵一棵给那些水晶花浇水。水珠落在永恒的花瓣上又滑落下来，在月光下像碎掉的钻石。\n我实在是忍不住了。\n我走到她的身边，轻轻提醒她：“露西莉亚，她们是不需要浇水的。”\n她回过头看到是我，露出了一个有点不好意思的灿烂笑容。\n“我知道呀。”她说，然后继续着她那看起来有些傻气的徒劳工作。\n“可是，”她一边浇水，一边用一种理所当然的语气对我解释道，“只是看着她们是没办法和她们成为朋友的。你要为她们做点什么，要关心她们，要让她们感受到你的温度，这样她们才会为你开出更漂亮的花呀。”\n我看着她，看着她那双倒映着整片月光和水晶花海的清澈红色眼睛，一时间竟说不出话来。\n我低下头，看向自己手中那枚冰冷的灵魂宝石。\n我们魔法少女，又何尝不是一朵“花”呢？一朵……为了实现某个奇迹而瞬间绽放，却也注定要在战斗中，被绝望的尘埃一点点染上污浊，最终凋零的花。\n我们守护世界，却从不敢奢求世界的守护。因为我们知道，每一次靠近，每一次共情，都会加速我们灵魂的浑浊。\n所以我们变得骄傲，变得冷漠，用孤独，来作为我们保护自己，也保护她们的、唯一的盔甲。\n可她不一样。\n她就像一株……向着太阳、肆意生长的、最普通的向日葵。她毫不畏惧地，将自己所有的善意和温暖，都毫无保留地，倾注给她想要守护的东西。\n无论是会哭泣的人类，还是……不会说话的花朵。\n我突然就明白了。\n我们是在用“牺牲”，来守护这个世界。\n而她，是在用“爱”。"
PAO.35.a: "§9我们……到底，谁才是对的？§!"

PAO.36.t: "要去屠龙的公主骑士"
PAO.36.d: "她要走了。\n这个消息，像一阵风，传遍了我们联盟的每一个角落。\n那个莉兰迪亚的守护骑士，那个戴上了王冠、却依然会为了给水晶花浇水而忙得满头大汗的女孩，要开始她第一次的、真正意义上的远征了。\n她的目标，是那些……盘踞在这片大陆上，连我们都感到棘手的、古老的“巨龙”。\n我的同伴们，对此议论纷纷。\n有的说，她太天真了。她以为战争，也像她那些结局美好的童话书一样吗？\n有的说，她太鲁莽了。她那小小的、刚刚从废墟上建立起来的王国，怎么可能，去挑战那些根深蒂固的庞然大物？\n她们说的，都对。\n从任何一个角度来分析，这都是一场……绝非儿戏的、现实且残酷的战争。\n可是……\n我看着手心里，那朵……她当初，为我别在头发上的、小小的月见草。\n我突然，就想起了那天晚上，她对我说的那些……听起来很傻气的话。\n她说，比起永恒的美丽，她更喜欢，勇敢地、为月亮开过一次的花。\n我好像……有点明白了。\n她不是不知道前方的危险。她也不是……看不见那些所谓的“现实”。\n她只是……单纯地，无法对那些……她还没有亲眼见过的、远方的哭声，视而不见而已。\n“……真是个……笨蛋啊。”\n我对着远方的天空，轻轻地，说了一句。\n然后，我转过身，向着我们联盟的议事厅，走了过去。"
PAO.36.a: "§9是时候让她们也听一听，我们的故事了。§!"

PAO.37.t: "红茶要加糖！"
PAO.37.d: "她们真的来了。我把莉兰迪亚最大、最漂亮的会议室，装饰成了故事书里茶话会的样子。桌上摆满了最好看的蕾丝桌布，还有我拜托厨师长烤的、有着七种颜色的彩虹蛋糕。\n可她们来了以后，好像……还是有点不开心。\n她们只是静静地坐在那里，很有礼貌，但不怎么说话。也不吃蛋糕。\n我有点着急。\n我记得莉莉安娜说过，甜的东西，能让人心情变好。\n于是，我拿起糖罐，走到那个看起来最厉害的、她们的领袖面前。\n“那个……”我小心翼翼地问，“你的红茶，要不要……再加一点糖呀？甜一点，会更好喝哦。”\n她看着我，那双好像能看穿一切的、眼睛里，带着一丝我看不懂的、复杂的疲惫。\n“……谢谢你，守护骑士。”她轻轻地说，“但是，我们……不需要。”\n我看着她，又看了看桌上那些，根本没人碰的、漂亮的蛋糕。\n我好像……有点明白了。\n她们不是不喜欢甜的东西。\n她们只是……害怕。\n害怕一旦品尝过这种温暖的味道，就再也……回不到那个，只有她们一个人在战斗的、冰冷的黑夜里去了。"
PAO.37.a: "§t好像，并没有想象中那么甜§!"

PAO.38.t: "红茶要加糖？"
PAO.38.d: "我……还是来了。\n因为我无法拒绝她那双……像小狗一样、充满了期盼的红色眼睛。\n这场所谓的“茶话会”，和我想象的一样。充满了凡人式的、天真而喧闹的善意。\n桌上的蛋糕很香，红茶也很暖。\n可我们……谁也没有碰。\n我们早已习惯了用冰冷的灵魂宝石，去感知这个世界的恶意。这种突如其来的、没有任何代价的温暖，反而……让我们感到不安。\n那个天真的守护骑士，甚至想在我的红茶里，再加一勺糖。\n我礼貌地，拒绝了她。\n因为她不懂。对我们而言，“甜蜜”，是最奢侈，也是最危险的毒药。它会软化我们的意志，会让我们，在面对下一个魔女时，产生……名为“留恋”的、致命的犹豫。\n我们是守护者。守护者，是不需要被守护，也不配拥有幸福的。\n就在我准备找个借口，结束这场……毫无意义的闹剧时。\n她突然，把那块最大、最漂亮的彩虹蛋糕，推到了我的面前。\n然后，她看着我，用一种……我从未听过的、带着一丝悲伤的、无比认真的语气，说道：\n“……我知道的。”\n“我知道，你们在害怕什么。”\n“可是……再勇敢的骑士，也是需要吃饱了肚子，才能去屠龙的呀。”\n“所以……”\n“……至少，在今天，在我们这里。你们……能不能，就暂时地，忘记自己是‘守护者’。就当一个……会因为吃到好吃的东西，而感到开心的、普普通通的女孩子呢？……就……一会儿，好不好？”"
PAO.38.a: "§9好像，并没有想象中那么甜§!"

PAO.39.t: "提前熄灭的灯"
PAO.39.d: "我成功了！\n在我的请求下，她们，那些骄傲的魔法少女们，终于同意，将她们那神奇的力量，用在了我们共同的，最普通的城市建设上。\n你看，这条新修好的街道上，每一盏路灯，都注入了她们的魔力。它们比过去任何一种灯都要明亮，而且……据说，永远也不会熄灭。\n今晚，我特意拉着那个……负责这条街道魔力供给的、魔法少女，一起来看我们的“杰作”。\n“你看你看！”我兴奋地，指着那一排亮晶晶的路灯，像在炫耀自己的宝贝，“是不是很漂亮？以后，孩子们晚上回家，就再也不会害怕了！”\n她静静地，看着那些光。她的脸上，带着一种……我看不懂的、很复杂的表情。\n就在这时，我们面前的那盏路灯，突然，“啪”的一声，熄灭了。\n“咦？”我奇怪地，敲了敲灯柱，“怎么回事？是……坏掉了吗？”\n我回过头，想问问她。\n然后，我看到了。\n我看到她，正痛苦地，单膝跪在了地上。她的手捂住了胸口那枚……我一直觉得很漂亮的灵魂宝石。\n而那颗宝石，此刻，正像一颗被污染的星星，光芒……变得比我上次见她时，要浑浊，要暗淡。\n“……你……”我的心，一下子就揪紧了，“你怎么了？”她抬起头，对我，露出了一个……比哭，还要难看的笑容。\n“……没什么。”她的声音，沙哑，而颤抖，“……只是……诅咒……又多了一点而已。”"
PAO.39.a: "§t所谓的“奇迹”，从来都不是免费的。§!"

PAO.40.t: "提前熄灭的灯？"
PAO.40.d: "我……还是同意了她那个天真的请求。\n因为，我无法拒绝她那双……像太阳一样、干净得没有一丝阴影的眼睛。\n我将我的魔力，注入了那些凡人的造物里。我看着那些路灯，一盏一盏地，因为我的力量而亮起。我看着那些凡人，因为这些光，而发出了……我许久未曾听过的、发自内心的欢呼。\n那一刻，我的心里，好像……也亮起了一点点，小小的、温暖的火苗。\n她拉着我，像个小孩子一样，要我去看我们的“杰作”。\n她说：“你看你看！是不是很漂亮？以后，孩子们晚上回家，就再也不会害怕了！”\n我看着她那张，因为“帮助了别人”而充满了纯粹喜悦的脸。\n我突然……就有点想哭。\n因为她不知道。\n她根本就不知道。\n我们魔法少女的力量，并非凭空而来。它源于我们许下愿望时，那份最纯粹的希望。而每一次使用魔法，去干涉这个世界的“因果”，无论是去战斗，还是……去点亮一盏小小的路灯……\n……都会不可避免地，从这个充满了悲伤的世界里，汲取等量的“诅咒”，来污染我们自己的灵魂。\n我们点亮的光越亮，我们内心的黑暗，就积攒得越快。\n就在这时，我胸口的灵魂宝石，传来了一阵熟悉的、冰冷的刺痛。\n我知道……又有一只看不见的怪物，在我的灵魂里，睁开了眼睛。\n而作为代价，那盏由我点亮的路灯，提前，熄灭了。\n我跪倒在地，痛苦地，捂住了胸口。\n她跑了过来，问我怎么了。\n我看着她那双，充满了焦急和担忧的、干净的眼睛。\n我突然，就笑了。\n笑得……那么的悲伤……那么的……开心"
PAO.40.a: "§9所谓的“奇迹”，从来都不是免费的。§!"

PAO.41.t: "没有结局的童话故事"
PAO.41.d: "我把我们的故事，写成了一本新的童话书。\n故事的前半段，写的是我的故事。写一个天真的骑士，如何相信“拥抱就能战胜一切。”\n故事的后半段，我写了她们的故事。我写了一群勇敢的魔法少女，如何为了守护世界，而与看不见的敌人战斗。\n今天，是这本书的第一次“朗读会”。我邀请了她，那个魔法少女的领袖，也一起来。\n我看到她来了。她没有和我们坐在一起，只是，远远地，站在书架的阴影里。\n我翻开了书，开始为孩子们，讲述我们的故事。\n我讲到，骑士遇到了受伤的喷火龙，用拥抱治愈了它。\n我讲到，魔法少女们用璀璨的光，驱散了笼罩王国的黑夜。\n孩子们听得入了迷，她们的眼睛里，闪烁着对英雄的崇拜，和对美好未来的向往。\n然后……我翻到了最后一页。\n那一页，是空白的。\n孩子们都奇怪地看着我。\n我看着那片空白，然后，抬起头，望向了那个，站在阴影里的、孤独的身影。\n我对着她，也对着所有的孩子们，露出了一个……比以往任何时候，都更坚定的笑容。\n“……这个故事，”我说，“还没有结局。”\n“……因为，故事里的骑士，最近，终于明白了一件事。”\n“……她明白了，那些勇敢的魔法少女们，她们在点亮世界的同时，自己，却正在一点一点地，被黑暗所吞噬。”\n“……所以，这个故事的结局，该怎么写，骑士，还没有想好。”\n“……但是，她向我保证，她一定会，为这个故事，写上一个……所有的人，包括那些勇敢的魔法少女们，都能一起，迎来幸福的、真正的、Happy Ending。”"
PAO.41.a: "§t就让我们看看吧，你所诉说的那个“奇迹”。§!"

PAO.42.t: "没有结局的童话故事？"
PAO.42.d: "我……还是来了。\n我不知道，是想看她，如何用那些天真的词句，去美化我们那残酷的宿命。还是……只是想再看一眼，那份……我早已失去的、名为“天真”的光。\n我站在阴影里，听着她，用那清脆的、充满了活力的声音，讲述着那个……属于“我们”的故事。\n她讲得很好。\n好到……连我自己，都快要相信，我们真的是一群，只需要挥舞魔棒，就能轻易战胜一切的、童话里的英雄了。\n然后……她翻到了最后一页。\n那一页，是空白的。\n我愣住了。\n然后，我听到了她的话。\n她说，她已经，知道了我们的“真相”。\n她说，她会为我们，写下一个……所有的人，都能幸福的结局。\n我看着她，看着她那双更加耀眼的眼睛。\n我看着她，对着那些孩子们，许下了那个……在我们看来，比挑战神明，还要不自量力的、最宏大的诺言。\n我……本该嘲笑她的。\n嘲笑她的无知，嘲笑她的狂妄。\n可我……却只是，默默地，将手中的那本童话书，紧紧地，抱在了胸前。\n那本……我曾以为，永远也写不到最后一页的、我们的故事书。"
PAO.42.a: "§9就让我们看看吧，你所诉说的那个“奇迹”。§!"

PAO.43.t: "沉重的礼物"
PAO.43.d: "我把我们最好的工匠，和那些最听话的“夜莺魂灵”，都召集了起来。\n我告诉她们，我需要一件……世界上最坚固的盔甲。\n它不需要锋利，也不需要轻便。它只需要一个功能——那就是，能替那些勇敢的女孩们，挡住所有……来自世界的恶意。\n今天，它终于完成了。\n我把它，作为礼物，送给了那个……一直以来，都独自一人，承担着最多的、她们的领袖。\n“这个……”我有点紧张地，对她说，“……送给你。”\n“我……我不是很懂你们的战斗。但是我想，穿上这个的话，是不是……就能……不那么容易受伤了？”\n我看到她，伸出手，轻轻地，触摸着那套……由我们所有人，用尽了心血和祝福，才打造出来的盔甲。\n那上面，没有一丝一毫的杀气。只有一种……笨拙的、却无比坚定的、想要“守护”的心意。\n她没有立刻收下。\n她只是，抬起头，用一种……我从未见过的、带着一丝颤抖的眼神，看着我。"
PAO.43.a: "§t最坚固的盾，从来都不是钢铁。§!"

PAO.44.t: "沉重的礼物"
PAO.44.d: "我从未想过。\n有一天，我会收到这样一份“礼物”。\n我们魔法少女的战斗，是灵魂的战斗。凡间的钢铁，对我们来说，毫无意义。这是常识。\n可我……却无法对她说出这句话。\n我看着眼前这套……闪烁着柔和光芒的、崭新的盔甲。\n我能感觉到，上面，没有一丝一毫的攻击性。它存在的唯一目的，就是“守护”。\n我甚至能从上面，感受到……那些凡人工匠们，在打造它时，所倾注的、那种笨拙的、却无比真诚的善意。\n她……这个天真的骑士，用她唯一能想到的方式，试图为我们，分担那份……她本不该，也无法理解的诅咒。\n这份“礼物”，太重了。\n重得……让我那颗，早已习惯了冰冷与孤独的、本该坚不可摧的心，都开始……微微地，发烫了。\n我伸出手，轻轻地，触摸着那套，对我来说，可能……毫无用处的盔甲。\n然后，我抬起头，看着她那双……充满了期盼和担忧的、清澈的红色眼睛。\n我终于，对她，露出了一个……发自内心的、真正的微笑。\n“……谢谢你。”\n我说。“……我很喜欢。”"
PAO.44.a: "§9最坚固的盾，从来都不是钢铁。§!"

PAO.45.t: "天空不再孤单！"
PAO.45.d: "我……在飞！\n我真的……在飞！\n虽然……还不是很稳，总是会不小心，撞到旁边来扶着我的她。\n可我……真的，离开地面了！\n这对由她们的魔法和我们的技术，共同创造出来的、小小的“翅膀”，比我想象的，还要神奇。我能感觉到，风，从我的耳边吹过。我能看到，地面上，那些为我欢呼的同志们，变得越来越小。\n世界……原来，从天空上看下去，是这个样子的啊。\n“……别分心，骑士。”\n她的声音，从我身旁传来。还是和以前一样，清冷，但……好像多了一点点，我从未听过的、像是老师在指导笨拙学生时，才会有的……无奈的笑意。\n“……把你的重心，再放低一点。感受风的流动，而不是……去和它对抗。”\n她牵着我的手，带着我，在空中，划出了一道笨拙的、却无比自由的弧线。\n我看着她，看着她那双，在阳光下，像紫色水晶一样漂亮的眼睛。\n我突然，就有点想笑。\n你看，莉莉安娜。\n我……好像，真的交到朋友了呢。"
PAO.45.a: "§t从今天起，这片天空是属于我们大家的了！§!"

PAO.46.t: "天空不再孤单"
PAO.46.d: "我……从未想过。\n有一天，我会把我们最核心的秘密之一——那种驾驭魔力、在天空中飞翔的“感觉”，教给一个……凡人。\n而且……还是一个，笨拙得，让我有点头疼的凡人。\n“哇啊啊——！”\n她又一次，因为太兴奋而忘记了控制平衡，整个人，都撞进了我的怀里。\n我叹了口气，有些无奈地，扶住了她。\n“……都说了，别分心。”\n“……哦哦！对不起！”她赶紧从我怀里挣脱出来，脸颊红红的，像个做错了事的孩子，但那双红色的眼睛里，却依然闪烁着……那种能把人的心都融化掉的、纯粹的兴奋与喜悦。\n我看着她，那副在天空中，手舞足蹈的、傻气的样子。\n我的嘴角，不自觉地，就向上扬了起来。\n我好像……已经很久很久，没有像这样，笑过了。\n自从，背负起那份沉重的宿命之后，天空，对我来说，就只是一个……孤独的、冰冷的、需要我去守护的战场。\n可是……\n我看着身边这个，正努力地，学习着如何与风成为朋友的、天真的骑士。\n我突然觉得……\n天空……好像，也没有那么孤单了。"
PAO.46.a: "§9从今天起，这片天空是属于我们大家的了。§!"

PAO.47.t: "镜子里的两个人"
PAO.47.d: "莉莉安娜……最近总是，把自己一个人，关在这座最古老的圣堂里。\n我不放心，悄悄地，跟了进来。\n我看到她，正站在一面……我从未见过的、巨大而光滑的黑色镜子前。\n她伸出手，用一种……我无法理解的、混杂着无尽的爱恋与深不见底的悲伤的眼神，轻轻地，抚摸着那冰冷的镜面。\n“你看，”她的声音，轻得像一阵叹息，“……我们的孩子，长大了。”\n“她和你……真像啊。一样的好看，一样的……固执。”\n“她现在，是所有人的英雄了。她做到了……你当年，想做，却没能做到的所有事。”\n“……她，就是你，对不对？”\n“……你把所有最好的、最干净的东西，都变成了她。然后，把所有最坏的、最痛苦的记忆，都留给了自己。”\n“……你这个……自私的、无可救药的……大笨蛋。”\n我愣住了。\n她……在和谁说话？\n我顺着她的目光，看向那面镜子。\n然后，我看到了。\n我看到镜子里，映出的，是我的脸。\n可是……在我的身后，还站着另一个人。一个……高了我整整一个头、眼中充满锐利和空洞的，我从未见过的……黑影。\n就在我看着她的时候，镜子里的那个“我”，好像也……感觉到了什么。\n她回过头，看向了那个，站在她身后的、黑色的幻影。\n她的脸上，露出了……和我此刻一样，充满了震惊与困惑的表情。"
PAO.47.a: "§t那个……“我”……是谁？§!"

PAO.48.t: "最后一个童话"
PAO.48.d: "今晚，你把我叫到了你的房间。\n你拉着我，坐在了那扇能看到最多星星的窗户前。\n“露西莉亚，”你终于，用一种很轻很轻的、像在讲一个睡前故事的语气，开了口，“我，再为你，讲最后一个童话，好不好？”\n我点了点头，像往常一样，安静地，等待着。\n“很久很久以前，”你缓缓地开始了讲述，眼睛，却望着窗外那片深沉的夜空。\n“有一位很孤独很孤独的公主。她住在一座，用寂静和月光盖成的、漂亮城堡里。她唯一的伙伴，是她自己的心脏，那是一只……会唱歌的、温暖的、小小的夜莺。”\n“后来，城堡里，闯进了一束……像火焰一样、不讲道理的、温暖的光。公主很喜欢那束光，小夜莺，也很喜欢。她们，和那束光，成为了最好的朋友。”\n你讲到这里，声音，有了一丝我从未听过的、无法被掩饰的颤抖。\n“可是……那束光，想要的，比公主的陪伴更多。她想要小夜莺的歌声，只为她一个人响起，她想让整个世界，都听到这唯一的歌声。”\n“于是，她趁着公主最没有防备的时候，弄坏了漂亮的鸟笼，然后……抢走了那只，正在为她歌唱的、受了惊吓的小夜莺。”\n“那束光，带着再也不会歌唱的小夜莺，飞走了，就再也，没有回来。”\n“公主的城堡，又变回了原来的样子。不，比原来……还要更冷，更安静了。因为，她再也，听不到那唯一的、心跳的声音了。”\n我静静地听着，心里，像被什么东西，狠狠地揪了一下。\n“……后来呢？”我小声地问。\n你转过头，看着我。那双总是那么温柔的、漂亮的眼睛里，第一次，蓄满了……我从未见过的、像大海一样深沉的悲伤。\n你伸出手，轻轻地，放在了我的胸口。\n“……后来，”你说。\n“……公主找到了那只迷路的、受了惊吓的小夜莺。可她发现，小夜莺的歌声，已经不一样了。它不再只为公主歌唱，它变成了一束……全新的、属于自己的光。”\n“于是，公主用尽了她最后的力量，为这束新的光，创造了一个不会受伤的身体，建造了一座不会哭泣的城堡。”\n“然后，把那颗，她再也等不回来的、小小的‘夜莺之心’……”"
PAO.48.a: "§t“§!§1……放进了，这束光的胸膛里。§!§t”§!"

PAO.49.t: "一颗心，两份爱"
PAO.49.d: "故事……讲完了。\n我终于明白了。\n我胸膛里这颗……温暖的、跳动着的、充满了“善意”与“理想”的心脏，原来……并不属于我。\n它是你的，莉莉安娜。\n它是那只……本该在你的胸膛里，为你歌唱的、孤独的小夜莺。\n而你……\n你把这颗最后的心脏，给了我。然后，用你自己那正在一点点、变得稀薄的灵魂，为我，撑起了整片天空。\n我抬起头，看着你。\n我看着你那双，因为透支了太多力量，而变得比月光还要苍白的、温柔的眼睛。\n我终于……明白了，童话故事的结局，到底……该怎么写了。"
PAO.49.a: "§t“那么，请收下吧。这是，我最后的礼物。”§!"
PAO.49.b: "§t“不。这一次，换我来为你歌唱。”§!"
PAO.49.a_tt: "§t将夜莺之心归还给莉莉安娜。骑士，将用自己的生命，去治愈她心爱的公主。这是一个……关于“偿还”与“牺牲”的、最纯粹的、骑士的结局。§!"
PAO.49.b_tt: "§1保留夜莺之心，用这颗心脏所带来的力量，去守护正在走向凋零的莉莉安娜。骑士，将背负起公主的心脏，去走完那段……注定孤独，却充满了爱的旅程。这是一个……关于“守护”与“陪伴”的、温暖而悲伤的、凡人的结局。§!"

PAO.50.t: "最任性的命令"
PAO.50.d: "我做出了我的选择。\n我拔出了那把，你亲手为我打造的、只为守护而存在的剑。\n然后，将它，对准了我自己的心脏。\n“……对不起，莉莉安娜。”我的声音，很平静，“……这个童话故事，从一开始，就是错的。不应该，是公主，为骑士，牺牲一切。”\n“……现在，物归原主了。”\n我闭上了眼睛，准备，将这颗……本就属于你的心脏，还给你。\n就在这时……\n一只冰冷的、却又无比用力的手，紧紧地，握住了我的剑刃。\n我愕然地睁开眼。\n我看到你，那个总是那么温柔、那么脆弱的你，第一次，用你的手，握住了那锋利的剑刃。鲜红的血液，顺着你的指缝，一滴一滴地，落在了冰冷的地板上。\n你的脸上，失去了我所熟悉的、那种悲伤的温柔。\n取而代之的，是一种……我从未见过的、混合着愤怒、心疼、与绝对不容许的、属于女王的威严。\n“……我不准。”\n你的声音像一道惊雷，回荡在整个大厅里。\n“……我花了那么大的力气，”你看着我，那双漂亮的眼睛里，第一次，燃起了滚烫的、愤怒的泪水，“……把你，从那片冰冷的灰烬里，重新拼凑起来……”\n“……我为你，修改了所有的童话，为你，挡住了所有的黑暗……”\n“……我做了所有所有的一切，不是为了……让你，再变回那个，只会为了别人而牺牲自己的、愚蠢的……索拉娜啊！”\n你用力地，从我手中，夺走了那把剑，将它，远远地，扔到了一边。\n然后，你伸出那双流着血的手，紧紧地，把我，拥入了怀里。\n“……听好了，露西莉亚。”\n你的声音，在我的耳边，带着哭腔，却又无比的坚定，像是在下一道……永恒的、无法被违抗的命令。\n“……从现在起，你的生命，是我的。你的心脏，也是我的。”\n“……所以，没有我的允许……”\n“……你，不准再为任何人，哭泣。更不准……再为任何人，死去了。”\n“……听到了吗？”"
PAO.50.a: "§t我……听到了…………§!"

PAO.51.t: "最自私的愿望"
PAO.51.d: "我……做出了我的选择。\n我告诉她，我不会归还这颗心脏。我要用它，去守护她，去陪伴她，走完那段……注定会走向凋零的、漫长的旅途。\n我以为……她会悲伤。\n我以为……她会因为我的“自私”，而露出失望的表情。\n可我……错了。\n就在我话音落下的那一刻。\n一双冰冷的、因为过度用力而剧烈颤抖的手，猛地，从我的身后，将我狠狠地箍入了怀中。\n我整个身体，都因为那突如其来的、几乎要让我窒息的力道，而彻底僵住了。\n我感觉到，她把脸，深深地，埋进了我的颈窝里。我能闻到，她身上那股……总是带着一点点月光和书卷味道的、好闻的香气。\n然后，我听到了。\n我听到了，从我身后，传来的、那被压抑了上万年的、如同堤坝决口般、再也无法抑制的……恸哭声。\n“……太好了……太好了……太好了……”\n她的声音，带着浓重的鼻音，破碎得，不成样子。\n“……我还以为……我还以为……你又要像她一样……再一次……把我一个人……丢在这个该死的地方了啊……”\n“……我不要什么‘夜莺之心’！我也不要什么冥界公主的力量！我早就……受够了那些冰冷的东西了！！”\n她抱得更紧了，像一个在无边黑夜里，终于抓住了唯一一束光的、快要溺水的孩子。\n“……我只要你……我只要……你能像现在这样，有温度的，会心跳的，活生生的，待在我的身边……我只要……每天，都能看到你，听到你的声音……这就……够了啊……”\n“……所以，求求你，露西莉亚……”\n她的声音，在我的耳边，变成了一种……最绝望的、也是最幸福的哀求。\n“……可不可以……再自私一点点？”\n“……就当是为了我，好好地，活下去？”\n“……好不好？”"
PAO.51.a: "§t原来……这才是，她真正的、唯一的愿望。§!"

PAO.52.t: "未完成的肖像"
PAO.52.d: "今天，你带我来到了那座最古老的圣堂。\n我们一起，站在了那面……我第一次见到时，映出了我和黑色幻影的、巨大的镜子前。\n“这是什么呀？”我终于，还是忍不住，问出了我心里一直以来的疑问。\n你伸出手，轻轻地，触摸着那冰冷的镜面。\n“……这里，”你的声音，像一阵来自遥远过去的风，“曾经……是一扇门。”\n“一扇……通往我所有记忆的门。”\n你转过头，看着我，那双漂亮的眼睛里，带着一种我无法完全理解的、深深的怀念。\n“……很久很久以前，我把所有……关于索拉娜的、好的，坏的，开心的，悲伤的记忆，都锁在了这扇门的后面。然后，我把唯一的钥匙，交给了她。”\n“我告诉她，只有她，才能打开这扇门。只有她，才能看到一个……最完整的、毫无保留的我。”\n你讲到这里，声音，有了一丝不易察觉的颤抖。\n“……可是，她走了。带着那把钥匙，一起走了。就再也，没有回来。”\n“于是，这扇再也无法被打开的门，就慢慢地，变成了现在这个样子。变成了一面……只会映照出，我一个人孤独的过去和……我心中最深执念的、冰冷的镜子。”\n我静静地听着，心里，像被什么东西，轻轻地刺了一下。\n我看着你，看着你那副……仿佛随时都会碎掉的、悲伤的样子。\n然后，我做了一件，连我自己都觉得很奇怪的事。\n我走上前去，学着你的样子，也伸出手，轻轻地，将我的手，覆盖在了你那只……冰冷的、放在镜面上的手的手背上。\n“……没关系。”我小声地，却又无比认真地，对你说。\n“……虽然，我没有那把钥匙。”\n“……可是，从今天起，我可以陪你一起，站在这扇门前呀。”"
PAO.52.a: "§t你的手……好像，没有那么冷了。§!"

PAO.53.t: "镜中的和解"
PAO.53.d: "你说，现在不一样了。\n然后，你拉着我的手，又一次，走到了那面巨大的镜子前。\n镜子里，清晰地映出了我们两个。也映出了那个，一直沉默地、站在我身后的、属于索拉娜的黑色幻影。\n“你看。”\n你的声音，带着一种我从未听过的、如释重负般的温柔颤抖。\n你松开了我的手，然后向前走了一步。你伸出双臂，对着镜子里那个充满了痛苦与伤痕的、属于你过去的幻影，张开了一个……迟到了太久的、温柔的拥抱。\n“对不起。”\n你对着镜中的索拉娜，轻声地说。\n“我没能……让你成为，你想成为的样子。”\n“也谢谢你。”\n“……把我，变成了现在的样子。”\n“现在，你可以……安心地，去休息了。”\n然后，我看到了。\n我看到镜子里，那个一直冰冷沉默的属于索拉娜的黑色幻影，第一次，动了。\n索拉娜的幻影缓缓地抬起头，她看着镜子外那个正试图拥抱她的身影——那个创造了她，也曾被她深深伤害过的莉莉安娜。\n她的脸上，第一次，露出了一个……释然的、淡淡的微笑。\n然后……\n她就，像被风吹散的蒲公英一样，化作了无数温柔的光点，彻底地，消散了。\n镜子里，只剩下了你，和站在你身后的、不知所措的我。\n你拥抱着的，是你自己那孤独的倒影。\n而你的倒影，拥抱着的，是我。"
PAO.53.a: "§t过去与未来，在现在迎来了最终的和解。§!"

PAO.54.t: "那幅画，与那颗星！"
PAO.54.d: "这大概……是我来到这个世界上之后，最开心的一个晚上了。\n我看着手中的这幅画。画上，有我，有莉莉安娜，还有……她们。我们所有的人，都笑得那么开心。\n“……真好啊。”我小声地，对自己说。\n“嗯。”坐在我身边的她，那个总是很严肃的魔法少女领袖，轻轻地，应了一声。\n我转过头，看到她的脸上，也带着一种……我从未见过的、很温柔的表情。\n“谢谢你们。”我说，“如果没有你们，我……可能，永远也画不出这样一幅画了。”\n她摇了摇头。\n“不。”她说，“应该说谢谢的，是我们。”\n我有些不解地看着她。\n“……是你，”她看着我，那双漂亮的眼睛里，像落满了天上的星星，“……是你，教会了我们。原来……‘守护’，也可以是……这么温暖的一件事。”\n她顿了顿，然后，伸出手，指了指夜空中，最亮的那颗星。\n“……也教会了我们。就算星星……总有一天，会燃尽自己。”\n“……可它留下的光，依然会，为后来的人，照亮回家的路。”"
PAO.54.a: "§t这，就是我们共同的“奇迹”。§!"

PAO.55.t: "那幅画，与那颗星！"
PAO.55.d: "这大概……是我签下契约之后，最不像“魔法少女”的一个晚上了。\n我看着手中的这幅画。画上，有我，有我的同伴们，还有……她们。我们所有的人，都笑得那么开心。\n就像一群……普普通通的、会为了篝火和歌声而感到幸福的……普通女孩。\n“谢谢你们。”\n身边那个天真的骑士，对我说道。\n我摇了摇头。\n我说，应该说谢谢的，是我们。\n因为，是她，教会了我们。\n教会了我们，守护，不一定，总是要伴随着孤独和牺牲。守护，也可以是……像现在这样，大家坐在一起，分享着同一份温暖。\n我指了指天上的星星。\n我想告诉她，她就像那颗星星一样，用她那份天真的、傻气的、却无比耀眼的光，照亮了我们这些……早已习惯了在黑暗里行走的人的、前方的路。\n可我……没有把话说完。\n因为我知道，星星，是会燃尽的。\n就像……那个靠在树下，微笑着，静静地看着我们的、温柔的亡灵公主一样。\n就像……我们每一个，背负着宿命的魔法少女一样。\n可是……\n我看着身边这个，还对未来，充满了无限希望的、天真的骑士。\n我突然觉得……\n就算，我们都会消失。\n就算，我们留下的光，也终将，会在这片广阔的夜空里，慢慢散去。\n那……也没关系了。\n因为，至少，我们曾经……为她，也为这个……被她所深爱着的世界，真真正正地，燃烧过一次啊。"
PAO.55.a: "§9这，就是我们共同的“奇迹”。§!"

PAO.56.t: "没有署名的邀请函"
PAO.56.d: "今天，我们收到了来自莉兰迪亚的、一份很奇怪的“外交通讯”。\它就像一封……被风吹到我们窗台上的、不知从何而来的邀请函。\n我们的魔法通讯水晶，突然亮了起来。\n水晶里，只是一段……很长很长的、无声的影像。\n影像里，是莉兰迪亚的城市。\n我们看到，工人们正在修复着战争留下的残垣断壁，脸上带着汗水，却也带着笑容\n我们看到，孩子们正坐在露天的教室里，一笔一划地，学习着写字\n我们看到，那些曾被露西莉亚帮助过的、失去亲人的家庭，正和她们的邻居们，一起分享着一锅热气腾腾的浓汤。\n整个画面只有一种……人类国度里，充满了烟火气的、温暖而真实的“活着”的感觉。\n影像的最后，画面定格在了那座……我们曾和露西莉亚一起去过的、会议室的大门上。\n大门，是敞开的。\n门上，挂着一块小小的、用粉笔写的、歪歪扭扭的牌子。\n上面写着：\n“今天，天气很好。欢迎，所有的朋友，回家。”"
PAO.56.a: "§9她们……是在邀请我们吗？§!"
PAO.56.b: "§R这大概……是我见过的，最笨拙的“外交”了。§!"

PAO.57.t: "海边的“悄悄话”"
PAO.57.d: "我终于……带你来看海了。\n你好像……是第一次，看到这么大的水洼。你看着那一望无际的、蓝色的海面，眼睛里，充满了和我第一次见到魔法时一样的好奇。\n我拉着你的手，赤着脚，在被夕阳晒得暖洋洋的沙滩上，慢慢地走。\n我给你，讲了很多很多……关于大海的故事。\n我告诉你，哪种贝壳，放在耳边，能听到海浪的声音。\n我告诉你，哪片云的下面，可能会藏着一场小小的雨。\n我还告诉你，我从几位老爷爷那里听到的……很久很久以前，有一个和我一样笨的女孩，曾经，就是在这片海里，被一群很好很好的人，救了起来的故事。\n你听得特别认真。\n就像一个……正在听着最喜欢的睡前故事的孩子。\n我们走到一块被海水冲刷得很光滑的礁石旁，坐了下来。\n海风轻轻地，吹着你的头发。夕阳的光，在你那张……已经开始变得有些透明的、苍白的脸上，镀上了一层暖洋洋的、金色的光晕。\n你看着远方，那轮即将沉入海平面的、巨大的太阳，突然，对我，说了一句。\n“……露西莉亚。”\n你的声音，轻得，像一阵风。\n“……真好看啊。”\n我看着你，看着你那双，倒映着整片金色海洋的、漂亮的眼睛。\n我突然……就有点想哭了。\n我把我的头，轻轻地，靠在了你那单薄的、却又无比温暖的肩膀上。\n然后，和你一起，静静地，看着那轮……我们共同拥有的、全世界最温柔的、金色的夕阳。"
PAO.57.a: "§t如果……时间，能永远停在这一刻，就好了。§!"

PAO.58.t: "我所诉说的故事"
PAO.58.d: "现在，每天晚上，都轮到我，来为你讲睡前故事了。\n我把我……能想到的、所有美好的东西，都写进了这本，只属于我们两个人的、新的童话书里。\n我为你讲，那个……笨拙的骑士，是如何在大家的帮助下，学会了怎么种出最甜的草莓。\n我为你讲，那些……骄傲的魔法少女们，是如何和城里最调皮的孩子们，成为了好朋友。\n我为你讲，那座……我们一起建造的花园里，每一朵水晶花，都在月光下，说了些什么悄悄话。\n你总是，听得很认真。\n然后，在故事讲到一半的时候，就会像个安心的孩子一样，慢慢地，睡着了。\n今晚，也是一样。\n我为你，讲完了最后一个故事。故事的结尾，是骑士和公主，一起，看着世界上最漂亮的、仿佛永远也不会落下的夕阳。\n我看着你那张，在月光下，安详而宁静的睡脸。\n我以为……你又和往常一样，睡着了。\n我正准备，为你，掖好被角，然后，像往常一样，悄悄地离开。\n就在这时……\n一双冰冷的、却又无比用力的手，突然，从被子里伸出来，紧紧地，抓住了我的手腕。\n我愣住了。\n然后，我看到。\n我看到你，那个我以为已经沉沉睡去的你，不知何时，已经睁开了眼睛。\n那双……总是带着一丝朦胧睡意的、漂亮的眼睛里，此刻，却闪烁着一种……我从未见过的、比天上所有星星加起来，还要明亮的光。\n你一句话也没有说。\n用尽了全身的力气，猛地，将我，拉向了你的怀中。"
PAO.58.a: "§t！§!"

PAO.59.t: "两朵小野花"
PAO.59.d: "[?global.date.GetDateStringNoHour]\n距你离开的时间，已经快要一个月了。\n这段时间里，我可是一滴眼泪都没有掉的。\n我像你还在的时候一样，按时起床，按时吃饭，然后，去处理那些……永远也处理不完的、关于这个国家的大事小事。\n大家都……很担心我。她们总是，用一种小心翼翼的、害怕我会碎掉的眼神，看着我。\n可我……没碎。\n我觉得……这个世界，好像，突然变得，好安静啊。\n安静得……我晚上睡觉的时候，如果听不到你那轻微的呼吸声，就有点……睡不着了。\n今天早上，我去那座……我们曾一起去过的山坡上，散步。\n我看到了。\n我看到，在你上次坐过的那个地方，开出了一片……我从未见过的、小小的、红色的野花。\n它们开得，那么灿烂，那么好看。\n就像……你最后，看着我的时候，那双……比所有星星都亮的、蓝色的眼睛。\n我摘下了两朵。\n一朵，是你\n一朵，是我。\n我回到房间，坐在镜子前，解开了那头……你总说，扎起来像个长不大的小孩子的、麻烦的双马尾。\n然后，我把那两朵小小的红花，轻轻地，别在了我的头发上。\n我看着镜子里，那个……看起来，好像，稍微长大了一点点的、陌生的自己。\n然后，我对着她，也是对着……不知道，还在不在某个地方看着我的你，露出了一个……和今天的天气一样，很好的、温暖的笑容。\n“……早上好啊，莉莉安娜。”\n“……你看，今天，也是一个……很适合晒太阳的好天气呢。”"
PAO.59.a: "§t新的一天，开始了§!"

PAO.60.t: "来自南方的风"
PAO.60.d: "风向，变了。\n今天，我们所有的观测位置，都同时指向了同一个方向——南方，莉兰迪亚。\n那里，正有一股……我们从未见过的、庞大而纯粹的“愿力”，正在集结。\n那不是战争的欲望，也不是征服的野心。\n那是一种……更古老、也更……“危险”的东西。\n那是一种……想要“让世界上所有的悲伤都消失”的、天真的、近乎愚蠢的、充满理想主义的……庞大善意。\n我不用多想，也知道，发生了什么。\n是她。\n那个天真的骑士，那个笨拙的女王。\n她……终究，还是听到了那些，她本不该听到的、远方的哭声。\n然后，像所有童话故事里，最无可救药的、理想主义的英雄一样，拔出了她的剑，要去挑战那些……她可能根本无法战胜的、真正的“现实”。\n我的同伴们，对此忧心忡忡。她们说，她会把自己，和她那个好不容易才建立起来的、脆弱的童话王国，都摔得粉碎。\n她们说，我们应该去……阻止她。\n我没有说话。\n我只是，看着窗外那片……因为她的存在，而变得比以往任何时候，都更明亮、更温暖的天空。\n然后，我想起了很久很久以前……那个，曾为了一个同样天真的愿望，而毫不犹豫地，签下了契约的、小小的、愚蠢的自己。"
PAO.60.a: "§9我们不能让她一个人去。§!"
PAO.60.b: "§9也许……童话，是需要一些笨蛋，去相信的。§!"

PAO.61.t: "来自希望的光"
PAO.61.d: "结束了。\n我看着眼前那些曾经是我最疼爱的孩子，如今却变成了只想将我撕碎的疯狂怪物。\n我的力量已经耗尽了。\n我再也唱不出能让她们安静下来的歌谣了。\n对不起，索拉娜。\n我好像连我们最后的家都守不住了。\n我缓缓地闭上了眼睛，等待着那永恒的、真正的“寂静”将我彻底吞噬。\n“——不准碰她！！！”\n一个声音。\n一个我从未听过的、清脆的、却又带着无尽焦急与愤怒的年轻女孩的声音，突然像一道落雷，在我的灵魂最深处炸响了。\n紧接着，一股我无比熟悉的、灼热的、如同心跳般的强大力量，猛地从我胸口那片早已空洞了许久的夜莺之心的位置，爆发了出来！\n一道红色的、无比璀璨的屏障以我为中心瞬间展开。所有袭向我的攻击都在接触到光芒的瞬间如同冰雪消融般化为了虚无。\n我愕然地睁开眼。\n我看到。\n我看到在那片温暖的红光之中，真实地，站着一个女孩。\n她留着柔顺的黑色长发，头发两旁别着两朵小小的、仿佛在燃烧的红色野花。\n她的脸上挂满了泪水，火焰般的红色眼眸里充满了……我无法理解的、看着失而复得的珍宝时才会有的巨大悲伤与喜悦。\n她回过头看着我。\n然后对我露出了一个比哭还要难看的却又无比温柔的笑容。\n“对不起，莉莉安娜。”\n她的声音像是在对我又像是在对她自己说。\n“我来晚了。”\n“但是，这一次……”\n“我绝对不会再让你一个人了！！！”"
PAO.61.a: "§1（你……是谁？）§!"
PAO.61_tt: "§G消灭§Y[WL1.Getname]§!处于§Y黄金树§!的所有军队！！！§!"

PAO.62.t: "温暖的手"
PAO.62.d: "世界又重新安静下来了。\n那些吵闹的孩子们，都在她那道温暖的，不容置疑的红色光芒里，重新回归了安眠。\n我看着眼前这片虽然残破但终究还是保住了的家，又看了看站在我面前的这个，仿佛从童话故事里走出来的神秘女孩。\n我的心里充满了无数的疑问。\n她到底是谁？她为什么会有夜莺之心的力量？她为什么会认识我？她来自哪里，又要去往哪里？\n就在我准备开口询问的时候，她却先一步，注意到了我那只在刚才的混乱中，不小心被划破了一道小口子的手。\n然后，她做出了一个让我完全没想到的举动。\n她在我面前单膝跪了下来，就像一个最虔诚的骑士，见到了自己发誓要守护的公主一样。\n她低下头，小心翼翼地捧起了我那只冰冷的手。然后，拉过自己肩上那块像火焰一样温暖的红色披风，用最柔软的一角，以一种像是在处理世界上最重要的事情般的、无比严肃的表情，为我擦拭着那道小小的伤口。\n“不行！”\n她的声音突然响起，又大声又固执，带着一点点还没散去的哭腔，把我吓了一跳。\n“我没有保护好你！这是我的失职！身为你的骑士，我竟然让你受伤了！这……这是绝对不能被原谅的错误！”\n我看着她，看着她那低垂着的、毛茸茸的、别着两朵小红花的黑色脑袋。\n我突然就什么都不想问了。\n我只是伸出另一只手，学着记忆里某个已经模糊了的身影，曾对我做过无数次的样子，轻轻地放在了她的头顶，揉了揉。\n“没关系。”\n我说。\n“已经不疼了。"
PAO.62.a: "§1（虽然……不知道你是谁。但是……谢谢你。）§!"

PAO.63.t: "公主的“新玩具”"
PAO.63.d: "她……好像真的很喜欢花。\n喜欢那种……她说的，会发芽，会生长，也……会枯萎的、真正的花。\n今天，她不知道从哪里，找来了一些奇怪的“玩具”——一些小小的花盆，一些黑乎乎的泥土，还有一些……看起来像小石子一样的、被她称为“种子”的东西。\n她把这些，都搬到了我的花园里。\n然后，她把其中一把最小、最干净的花铲，递给了我。\n“来，莉莉安娜！”她的声音，像阳光一样，充满了活力，“我们一起来种花吧！这也是‘成为朋友’的第一步哦！”\n我……不是很懂。\n我不明白，为什么要去种下一种……注定会凋零的东西。\n也不明白，为什么，要把自己干净的手，弄得脏兮兮的。\n可是……\n我看着她那双，充满了期盼的、亮晶晶的红色眼睛。\n我……好像，说不出“不要”那两个字。\n于是，我就学着她的样子，拿起那把小小的花铲，有些笨拙地，开始……为那些，根本不需要泥土的水晶花，“松土”。\n她看着我那笨拙的样子，没有嘲笑我。\n她只是，像个小老师一样，跑到我的身边，一边纠正着我的动作，一边，用一种很认真的语气，对我讲述着，关于“阳光”和“水分”的、那些我从未听过的、神奇的“魔法”。\n我听着她的声音。\n看着她那张，因为说到了自己喜欢的东西，而变得神采飞扬的、小小的脸。\n我突然觉得……\n手上的这些泥土，好像……也没有那么讨厌了。"
PAO.63.a: "§1（这……就是“朋友”的感觉吗？）§!"

PAO.64.t: "不成调的华尔兹"
PAO.64.d: "她说我的家里太安静了。\n她说再漂亮的城堡如果没有音乐和舞蹈，那也只是一座冰冷的坟墓。\n我不是很懂她的话。\n但今天晚上，她拉着我来到了这座除了我就再也没有第二个“活人”踏足过的空旷主殿。\n这里只有从穹顶洒下来的冰冷的月光。\n“来，莉莉安娜！”她对我伸出手，那双红色的眼睛里闪烁着比月光还要亮的光，“我来教你跳舞吧！这是……我从一个很好的朋友那里学来的哦！”\n然后她就开始哼起了一首我从未听过的、不成调的却又充满了莫名活力的歌谣。\n她拉着我的手，带着我在这片只属于我们两个人的小小的月光里笨拙地旋转跳跃。\n我的脚步很僵硬，我总是会不小心踩到她的脚。\n可她一点也不生气。\n她只是咯咯地笑着然后更用力地握紧了我的手。\n“不对不对，莉莉安娜，你的节奏太慢啦！”\n“要像这样，对，用心去感受……感受风，感受光，感受……”\n“……感受，生命本身的那种……不讲道理的、乱糟糟的、温暖的‘节拍’呀！”\n我看着她，看着她那张因为跳舞而微微泛红的神采飞扬的脸。\n看着她那头在月光下像黑色的瀑布一样飞舞起来的柔顺长发，还有那两朵……仿佛也在跟着节拍一起摇晃的、小小的红花。\n我突然觉得……\n这座被我用“永恒”和“寂静”冰封了上万年的城堡。\n好像……在她的笑声里，在她的歌声里，在她的那双温暖的手心里……\n……\n……第一次有了心跳的声音。"
PAO.64.a: "§1（这是……“活着”的感觉？）§!"

PAO.65.t: "那场毫无温度的雨"
PAO.65.d: "外面下雨了。\n我跑了出去。\n我跑到了那座最高的、已经不会再敲响的钟楼顶上。\n我只是……想亲身感受一下。\n感受一下，那本日记里，莉莉安娜写下的、那场……让她感到无边寒冷的雨。\n我伸出手，去接那冰冷的、从天而降的雨水。\n雨水打在我的手心，很凉。\n可……也仅仅只是凉而已。\n我闭上眼睛，努力地，去想象。\n想象她，在内战的废墟中，看着那些……曾是她子民的、破碎的亡灵时的心情。\n想象她，在得知索拉娜的背叛与自我毁灭后，独自一人，站在这片……她再也无法理解的、生者的土地上的心情。\n我想象着……她在那本浸透了泪水的日记里，写下的、每一句……无声的悲鸣。\n可我……什么也感觉不到。\n我感觉不到，她所说的那种……足以将灵魂都冻结的“悲伤”。\n也感觉不到，那种……让她宁愿耗尽自己，也要把我创造出来的“爱”。\n我的心脏，在平稳地跳动着。\n我的身体，只感觉到了雨水的冰冷。\n我……好像，是一个局外人。一个……只能通过文字，去阅读别人的痛苦，却永远，也无法真正感同身受的、冷漠的……读者。\n我睁开眼睛，看着雨水，从我的指缝间流走。\n我突然，就明白了。\n明白了我……和她，最根本的、也是最残忍的区别。\n莉莉安娜她……是为了守护一个，她曾深爱过、又被其深深伤害过的、充满了裂痕的“旧世界”，而战斗。\n而我……\n我只是，为了一个……我从未经历过的、只存在于童话书和她的日记里的、完美的“新世界”，而挥舞着宝剑。\n原来……\n……我，根本，就不懂她啊。"
PAO.65.a: "§t（我……真的能，拯救她吗？）§!"

PAO.66.t: "笨蛋"
PAO.66.d: "她……还是走了。\n在那个……我们所有人都以为，她会永远留下的清晨。\n她把这个……由她亲手点亮了灯火的、温暖的家，交给了我们。\n她把那本……由我们和她，一起，写下了第一个美好结局的童话书，也留给了我们。\n她只说，她要去……完成一个，很久很久以前，就许下的约定。要去……拯救一个，对她来说，比整个世界，都更重要的人。\n然后，她就头也不回地，踏上了那条……回到过去的、孤独的旅途。\n我的同伴们，对此无法理解。\n她们问我，为什么？为什么她要放弃这一切？为什么她要为了一个……属于“过去”的、早已注定的悲剧，去赌上她好不容易才赢来的、“现在”的幸福？\n我没有回答她们。\n我只是，翻开了那本，她留给我们的童话书。\n我指着书里，那一页……我们都画在上面的、那个关于“守护与誓约”的、小小的徽章。\n然后，我对她们说：\n“……因为，她和我们一样，都是笨蛋啊。”\n“……都是那种，一旦许下了‘守护’的诺言，就无论如何，也无法对那个……还在哭泣的人，视而不见的、无可救药的……大笨蛋。”"
PAO.66.a: "§9笨蛋，就该由另一个笨蛋，来守护。§!"

PAO.67.t: "会“做梦”的心脏"
PAO.67.d: "我成功了。\n我真的……回到了过去。\n我回到了……你还没有流下那么多眼泪的、那个时候。\n我一直不明白。\n不明白，为什么，这颗在我胸膛里跳动着的夜莺之心，能拥有这样……连神明都无法做到的、逆转时间的力量。\n直到今晚。\n你靠在我的身边，睡着了。我能听到你那……均匀的、安稳的呼吸声。\n我看着窗外那轮……和上一个故事里，一模一样的月亮。\n我突然，就明白了。\n……\n这颗心脏，它，并不会“逆转时间”。\n它只是……在“做梦”。\n它在做着一个……关于“过去”的、无比真实的、漫长的梦。\n是啊。\n它，是索拉娜从你胸口剥离的。它承载了你对索拉娜……所有的爱，与所有的思念。\n它，是我灵魂的内核。它也承载了我对你……所有的守护，与所有的陪伴。\n它里面，装满了太多太多的……“如果当初……就好了”的、无法被实现的“愿望”。\n当我的愿望，强烈到足以撼动这颗心脏时……\n它就……为我，也为你，创造出了这样一个……能让所有的遗憾，都重新来过一次的、巨大的、温柔的“梦境”。\n所以……\n我并不是，回到了“过去”。\n我只是……带着你，一起，逃进了这颗心脏……为我们创造的、一个……永不醒来的、幸福的梦里而已。\n……\n也好。\n我低下头，看着你在我身边，那张……毫无防备的、安详的睡脸。\n我伸出手，轻轻地，将一件毯子，盖在了你的身上。\n如果，这里是梦。\n如果，所谓的“幸福”，只是一场不会醒来的幻觉。\n那么……\n……就让我们，在这个梦里，永远，都不要再醒来了。"
PAO.67.a: "§t这，就是我为你选择的、最后的“童话”。§!"

PAO.68.t: "雨季"
PAO.68.d: "[?global.date.GetDateStringNoHour]\n莉兰迪亚的雨季，来了。\n永不停歇的雨，将整个世界，都变成了一座潮湿的、巨大的牢笼。\n我把自己，也关在了里面。\n我开始读那本书。那本……她留下的、唯一的、关于她自己的书。\n我以为，那会是一个童话。\n可我错了。\n那是一场……下了很久很久的、一场只属于她一个人的雨。\n我看见，冰冷的雨，打在她孤单的王座上\n我看见，背叛的雨，浸湿了她伸出的、温暖的手。\n我看见，绝望的雨，熄灭了她眼中，最后的光。\n然后……\n我看见，在那场最大的、名为“死亡”的暴雨里。她用自己那残破的、半透明的身躯，为我，撑起了一片……小小的、干燥的天空。\n我是……踩着她的尸体，才看到了今天的太阳。\n雨水，打在书页上。\n不对。\n那不是雨水。\n是我自己的，眼泪。\n我合起了那本书。\n我走到窗边，伸出手，贴在了那冰冷的、被雨水打湿的玻璃上。\n如果……\n——如果，我能回到那个……雨还没有开始下的时候。\n回到那个……她还没有流下那么多眼泪的、最初的起点。\n……\n……我是不是，就可以……为她，撑起一把伞了呢？"
PAO.68.a: "§t雨……可不可以，不要再下了？§!"

PAO.69.t: "两颗心脏的“重逢”"
PAO.69.d: "我们……赶上了。\n就在野火的利剑，即将刺穿她心脏的前一刻。\n莉莉安娜张开了她那永恒寂静的屏障，将整个战场，都凝固在了时间里。我们穿过那些……静止的、充满了错愕表情的革命军士兵，走到了那个……单膝跪地、浑身是血、已经耗尽了所有力气的、失败的女王面前。\n莉莉安娜没有说话。她只是，脱下了自己的披风，轻轻地，盖在了索拉娜那具……伤痕累累的、冰冷的身体上。然后，像抱起一个破碎的、心爱的玩偶一样，将她，小心翼翼地，拥入了怀中。\n我看着这一幕，看着莉莉安娜那张……终于找回了自己另一半灵魂的、悲伤而满足的脸。\n我以为……\n我以为，我那漫长的、逆流而上的旅途，终于，在这一刻，抵达了终点。\n我以为，我终于，为这个悲伤的故事，写下了一个……不那么完美的、却也足够温柔的结局。\n可我……错了。\n就在莉莉安娜抱起索拉娜的那一瞬间。\n一阵……我从未感受过的、仿佛要将我的灵魂都彻底撕裂的、剧烈的“饥饿感”，猛地，从我胸口这颗夜莺之心的深处，爆发了出来！\n它……感觉到了。\n它感觉到了，在索拉娜的身体里，还沉睡着的、那另一半的、属于它自己的……力量。\n我甚至来不及发出一声惊呼。\n一道道暗红色的、充满了贪婪与渴望的能量触须，就不受控制地，从我的胸口喷涌而出，像一群闻到了血腥味的鲨鱼，疯狂地，刺入了索拉娜那毫无防备的身体！\n“露西莉亚？！”\n莉莉安娜的惊呼声，像是从一个很遥远的世界传来。\n我什么也做不了。\n我只能眼睁睁地看着……看着索拉娜那具本已残破的身体，在这股力量的疯狂吞噬下，迅速地，化作了点点黑色的光芒。\n看着那些……混合着她所有记忆、所有罪孽、所有痛苦的碎片，如同决堤的洪流，疯狂地，涌入我的心脏！\n看着……莉莉安娜那张，刚刚才失而复得，又再一次，陷入了永恒失去的、绝望的脸。"
PAO.69.a: "§t我……到底……做了什么？§!"

PAO.70.t: "对不起"
PAO.70.d: "我醒了。\n从那场吞噬了索拉娜的、充满了红色与黑色光芒的梦中醒了。\n我发现自己正躺在莉莉安娜的床上。房间里很安静，只有月光从窗户里静静地流淌进来，将地板照得雪白。\n我静静地坐了起来。\n我看到了。我看到在她那只总是被她打理得一丝不苟的小小枕头上面，放着一张被仔细折叠过的小小白色纸条。\n我伸出手，打开了它。\n上面只有用她那娟秀的我最熟悉的笔迹，写下的几个小小的字。\n“对不起。”\n……\n我把那张纸条，重新，仔细地，叠好。\n然后，站起身，像她还在的时候一样，为她，整理了一下那床……其实一点也不乱的被褥。\n我走到窗边，推开了窗户。\n夜莺之国的夜风，还和往常一样，带着一点点凉意。\n花园里，那些水晶花，也还和往常一样，散发着柔和的光。\n一切……都和昨天，一模一样。\n好像……什么都没有发生过。\n也好像……所有的一切，都已经在昨天，彻底结束了。"
PAO.70.a: "§t……嗯§!"

PAO.71.t: "不会回答的星星"
PAO.71.d: "今天，我又去了那座最高的塔楼。\n因为，这里，是离月亮最近的地方。\n我抱着膝盖，坐在冰冷的栏杆上，对着那轮……总是安安静静地，听我说话的月亮，讲了很多很多……今天发生的小故事。\n我告诉它，花园里的那朵水晶花，今天好像……比昨天，更亮了一点点。\n我告诉它，那个叫“阿守”的夜莺魂灵，今天，终于学会了，在我回来的时候，为我，打开城堡的大门。\n我还告诉它……我，今天，又重新读了一遍，你留下的那本童话书。\n……\n我讲了很久很久。\n月亮，还和以前一样，只是静静地，看着我，不说话。\n我看着它，突然，就有点想笑了。\n我好像……有点明白，以前，你一个人，待在这座空荡荡的城堡里时，是什么感觉了。\n大概……就是像现在这样吧。\n对着一个……永远也不会回答你的、很漂亮很漂亮的星星，说很多很多……只有自己，才听得懂的、傻傻的悄悄话。"
PAO.71.a: "§t明天见，莉莉安娜§!"

PAO.72.t: "打不开的门"
PAO.72.d: "我……找到了。\n在这座，我以为我已经走遍了的城堡的最深处。\n我找到了，你留下的、最后一个，也是唯一一个……我从未踏足过的地方。\n那是一扇……巨大的、由一整块黑曜石雕琢而成的、冰冷的门。\n在门的正中央，有一个……和我胸口这颗夜莺之心，形状完全一样的、小小的凹槽。\n我站在这扇门前，感受着从门缝里，渗出来的那股……让我无比熟悉的、混杂着“索拉娜”的灼热与“莉莉安娜”的寂静的、古老的气息。\n我好像……有点明白了。\n这里，大概就是……夜莺之心，最初诞生的地方吧。\n是这个国度，所有力量与记忆的、真正的“摇篮”。\n我伸出手，想试着，把我的心，按进那个凹槽里。\n我想……打开这扇门。\n我想看看……你，和她，到底……还在这扇门的后面，藏了些什么，我不知道的秘密。\n可就在我的指尖，即将触碰到那个凹槽的瞬间。\n一阵……剧烈的、仿佛要将我的灵魂都彻底撕裂的、充满了“饥饿”与“愤怒”的咆哮声，猛地，从我胸口的这颗心脏深处，爆发了出来！\n它在……抗拒。\n它在……害怕。\n它好像……在害怕门后面的什么东西。又好像……是在渴望着，要将门后面的什么东西，彻底地，吞噬掉。\n我被那股突如其来的、充满了恶意的情绪，吓得，猛地，收回了手。\n我靠在冰冷的墙壁上，大口大口地喘着气，手，紧紧地，按在自己那颗……正在疯狂跳动着的、滚烫的心脏上。\n……\n……这颗心。\n……它，到底……是什么？"
PAO.72.a: "§t绝对不能打开这扇门§!"

PAO.73.t: "熟悉的歌"
PAO.73.d: "我打开了那台……据说，能听到外面世界声音的、古老神秘的收音机。\n大部分时间里，里面都只有一片……嘈杂的、毫无意义的电流声。\n可是，今天晚上。\n我从那片杂音的海洋里，捕捉到了一段……断断续续的、模糊的旋律。\n那是一首歌。\n一首……我从未听过，却又……无比熟悉的歌。\n那首歌的调子，充满了反抗，充满了愤怒，也充满了……一种，即使是在最深的黑暗里，也决不放弃的、燎原烈火般的希望。\n我听着那首歌。\n然后，索拉娜的记忆，就在我的脑海里，炸开了。\n我“看”到了。\n我看到了，在莉兰迪亚的街头，那些……衣衫褴褛的工人们，就是唱着这首歌，向着她那冰冷的“军团”，发起了第一次的、也是最惨烈的一次冲锋。\n我“看”到了，在卡卡罗姆的矿井下，那些……即将被冻死饿死的幸存者们，就是靠着这首歌，互相依偎着，熬过了一个又一个，看不见明天的寒夜。\n我“看”到了……她，索拉娜，是如何，一次又一次地，用最残忍的手段，去镇压，去扑灭，那些……唱着这首歌的、该死的“野火”。\n……\n歌声，消失了。\n收音机里，又恢复了那片……永恒的、死寂的电流声。\n可我的心脏，却还在……随着那段早已消失的旋律，剧烈地，跳动着。\n一半，是属于索拉娜的、那种……刻骨的、充满了厌恶与恐惧的“憎恨”。\n而另一半……\n……\n……是属于我自己的、那种……连我自己也无法理解的、充满了向往与共鸣的……“激动”。"
PAO.73.a: "§t她们……到底，是谁？§!"

PAO.74.t: "我的剑又该指向何方？"
PAO.74.d: "我……好像，有点明白了。\n我从那些……断断续续的情报里，看到了她们的故事。\n她们，那些被称为“野火”的人。\n她们和索拉娜，是那么的相像。一样的一无所有，一样的……对这个不公平的世界，充满了愤怒。她们的火焰，和索拉娜的火焰，燃烧得……一样旺盛。\n可她们……却又和索拉娜，那么的不一样。\n索拉娜的火焰，是为了将整个世界，都变成只属于她一个人的、冰冷的灰烬。她要站在所有人的头顶，成为唯一的、孤独的太阳。\n而她们的火焰……\n却是在最冷的黑夜里，努力地，想为所有和她们一样，正在挨饿受冻的人，烧出一片……小小的、可以互相取暖的、温暖的土地。\n……\n我放下了情报。\n走到了训练场上。\n我拔出了那把……莉莉安娜，教给我，只能用来“守护”的剑。\n可我……却不知道，该向谁挥舞了。\n如果，我以“索拉娜的继承者”的名义，去熄灭她们。那么……我就变成了，我曾经最讨厌的、那种……只为了王权与私欲，而去碾碎弱者的“巨龙”。\n可是，如果，我以“莉兰迪亚的守护者”的名义，去帮助她们。那么……我就等于，又一次，背叛了那个……将所有记忆和痛苦，都留给了我的、孤独的……索拉娜。\n我……到底是谁？\n是索拉娜的“过去”？还是……莉莉安娜的“未来”？\n我站在空无一人的训练场上，第一次，对我自己的方向，挥起了剑。\n剑锋，划破了空气，也划破了……我脚下那道，被月光拉得很长很长的、孤独的影子。"
PAO.74.a: "§t我……该站在哪一边？§!"

PAO.75.t: "完结的书"
PAO.75.d: "我把自己关在莉莉安娜的书房里已经很久了。\n我的面前摆着两样东西。\n一样是那本莉莉安娜留给我的、结局永远是美好的，我自己写下的童话书。\n另一样是关于那些被称为“野火”的人类们的最新情报。\n我看着那份情报。\n我看到她们是如何在那片被索拉娜的战争机器，彻底碾碎的废墟之上，重新组织起生产，让工厂的烟囱再次冒烟\n我看到她们的领袖是如何为了保护那些在战争中失去一切的人民，而一次又一次地将自己置于最危险的境地。\n我看到她们在付出了那么那么大的代价之后，终于建立起了一个虽然还带着战争的伤痕，但却充满了勃勃生机的、属于她们自己的家园。\n然后我又翻开了那本我早已能倒背如流的童话书。\n我看着书里那个永远热血永远天真永远相信“爱”与“拥抱”就能战胜一切的过去的自己。\n我突然就笑了。\n我好像终于明白了。\n我一直在纠结我该成为“索拉娜”还是该成为“莉莉安娜”。\n可我错了。\n我谁都不是。\n索拉娜的火焰太过于灼热，它只想燃烧自己也燃尽别人。\n莉莉安娜的月光又太过于温柔，它只想守护一切却无法真正地创造出新的光明。\n而她们，那些“野火”……\n她们才是我一直在寻找的那个童话故事里真正的“英雄”。\n她们的身上既有索拉娜那种敢于向整个不公的世界挥起屠刀的“愤怒”。\n也有莉莉安娜那种愿意为所有弱小者撑起一把伞的“温柔”。\n她们才是我本该成为的样子。\n我缓缓地关上了那本陪伴了我很久很久的童话书。\n然后我站起身走出了这间囚禁了我太久的安逸的书房。"
PAO.75.a: "§t是时候去见一见这个故事里真正的主角了§!"

PAO.76.t: "不再有胜利者的决斗"
PAO.76.d: "……下雨了。\n我的“夜莺”骑士团，像一场无法被阻挡的、沉默的潮水，淹没了她们最后的抵抗。\n我独自一人，走进了她们那间……还在燃烧着的、最后的指挥部。我看到了她们。\n那个黑色短发的、叫“晓枫”的指挥官，正冷静地，将最后一颗子弹，填入她的手枪。她的眼神，像鹰一样，没有一丝一毫的恐惧。\n那个黑色长发的、叫“雪伊”的领袖，则靠在墙边，浑身是血。她看着我，嘴角，竟然还带着一丝……充满了疲惫与不屑的、淡淡的冷笑。\n她们，在等我，为她们献上英雄的死亡。\n我看着她们，突然，就想起了很久很久以前……莉莉安娜，对我讲过的、那个关于索拉娜的故事。\n……\n我放下了手中的剑。\n我走到那个黑色短发的女孩面前，在她错愕的眼神中，轻轻地，将她那把……已经对准了自己太阳穴的手枪，拿了下来。\n然后，我又走到那个黑色长发的女孩身边，蹲下身，将一块干净的、我自己的披风，撕了下来，笨拙地，为她，包扎着那道……还在流血的、狰狞的伤口。\n“……你们，输了。”我轻声地，对她们说。\n“……但是，你们的‘火焰’，没有输。”\n我拉起她们的手，带着她们，走出了那间即将坍塌的指挥部，走到了外面的、冰冷的雨里。\n我让她们看。\n看那些……虽然放下了武器，但眼神里，依然燃烧着不屈火焰的、她们的士兵。\n看那些……虽然家园被毁，但依然互相搀扶着，从废墟里，重新站起来的、她们的人民。\n“……你看。”我对她们说。\n“……我，或许，可以打败你们的军队。”\n“……但我，永远也无法打败，这样一片……即使被烧成灰烬，也依然会在雨中，重新长出新芽的、倔强的土地。”\n“……所以，教教我，好不好？”\n我看着她们，那两双，因为我的话，而充满了震惊与不解的、漂亮的眼睛。\n然后，我用一种……近乎哀求的、我从未有过的、最真诚的语气，对她们说：\n“……教教我，该如何……像你们一样，去爱着这样一片……即使会带来无尽的痛苦，也依然……值得被爱的、乱七八糟的土地。”"
PAO.76.a: "§t雨，会停的§!"
PAO.76.b: "§t而废墟之上，也终将，开出新的花§!"

PAO.77.t: "两朵幸存的火焰"
PAO.77.d: "……下雨了。\n我找到了她们。在那座……被烧成了空壳的、最后的堡垒里。\n只剩下了……她们两个人。\n那个黑色长发的、叫“雪伊”的领袖，和另一个……更娇小的、我从索拉娜的记忆里知道，名叫“小果子”的女孩。\n她们是……那场燎原大火之后，仅存的、两朵微弱的、随时都可能熄灭的火苗。\n雪伊的伤很重，几乎已经站不稳了。可她的眼睛里，那股……仿佛要将我连同整个世界，都一起烧成灰烬的仇恨，却比任何时候，都更明亮。\n而那个叫小果子的女孩，则用她那小小的身躯挡在了雪伊的身前。她的眼神，让我想起了……在童话故事里，那些守护着最后宝藏的、受伤的小龙。\n我看着她们，看着她们那副……即使只剩下彼此，也要战斗到最后一刻的、悲壮的姿态。\n我的心，像被一只冰冷的手，狠狠地，攥住了。\n……我，都做了什么啊？\n我以为……我是在为这个故事，写下一个“完美”的结局。\n可我……却只是，又一次，用我那自以为是的“善意”，将别人……推入了更深的、连哭都哭不出来的地狱。\n我缓缓地，放下了手中的剑。\n然后，在她们那充满了警惕与不解的眼神中，一步一步地，走上前去。\n最后，我在她们的面前，单膝跪了下来。\n就像……一个犯了错的孩子，在向自己最尊敬的骑士，请求宽恕一样。\n“……对不起。”\n我的声音，被雨声，衬得，那么的无力。\n“……我，不是你们的敌人。”\n“……我只是……一个，迷了路，也……弄丢了自己家人的……笨蛋而已。”"
PAO.77.a: "§t雨……能洗干净，我手上的罪吗？§!"

PAO.78.t: "虚掩的门"
PAO.78.d: "我……不知道该怎么办了。\n我试着，去找她们说话。\n可她们……总是，避开我。\n那个叫晓枫的女孩，她的眼神，总是会越过我的肩膀，看向我身后的某个地方，好像……那里，有一个，我看不见的、属于过去的亡魂。然后，她就会对我，礼貌地，笑一笑，转身走开。\n那个叫雪伊的女孩，则会像一头……随时准备扑上来的、受伤的野兽。她的手，总是不自觉地，按在腰间的武器上。她的眼神，冰冷，而充满了……我能看懂的、名为“仇恨”的东西。\n今天晚上，我端着一份……我学着莉莉安娜的样子，亲手做的、据说能让人心情变好的甜点，想去找她们。\n我走到了她们的房门前。\n门，是虚掩着的。\n我听到里面，传来了她们的、压抑着的争吵声。\n“……你到底想怎么样？”那是雪伊的声音，充满了疲惫的怒火，“难道，要我们，对那个……害死了我们那么多兄弟姐妹的‘怪物’，笑脸相迎吗？！”\n“……她不是怪物，雪伊。”那是晓枫的声音，冷静，却也……带着一丝，我无法理解的、深深的无力感，“……她只是……一个和我们一样，被困在了那场战争里的、迷路的孩子而已……”\n“‘孩子’？！”雪伊的声音，陡然拔高，“……那你告诉我！我们那些……死在了那场‘决斗’里的同志们，又算什么？！她们，就不是‘孩子’了吗？！”\n……\n然后，是长久的、令人窒息的沉默。\n我端着那盘……还冒着热气的甜点，站在门外，一动也不敢动。\n我的手，在抖。\n我好像……把一切，都搞砸了。"
PAO.78.a: "§t点心……好像，也一点也不甜了§!"

PAO.79.t: "看不见的墙"
PAO.79.d: "我……不知道该怎么办了。\n我试着，去找她们说话。\n可她们……好像，在我，和她们之间，砌了一堵……我看不见的、冰冷的墙。\n那个叫雪伊的女孩……她，不恨我了。\n她看我的眼神里，再也没有了那种……能把人冻伤的寒意。可也……再也没有了，任何东西。\n那是一种……比仇恨，更让我感到……难受的、彻底的“虚无”。\n她只是，把我，当成了一团……和窗外的空气，没什么两样的东西。她会对我点头，会回答我的问题，但她的眼睛，却永远，都不会，真真正正地，落在我身上。\n而那个……叫小果子的、小小的女孩。\n她……很怕我。\n每一次，我试着，想对她笑一笑，或者，想把莉莉安娜留给我的糖果，分给她一颗时。\n她都会像一只受惊的小兔子，猛地，躲到雪伊的身后。然后，从那个……唯一能给她安全感的、黑色的影子里，探出半个小小的脑袋，用一种……我看不懂的、混合着“好奇”与“恐惧”的、复杂的眼神，偷偷地，看着我。\n今天晚上，我又去了她们的房间。\n我只是，想问问她们，晚饭，想吃些什么。\n可我……刚一推开门。\n就看到了这样一幅……让我再也，无法向前，踏出一步的画面。\n雪伊，背对着我，安静地，擦着枪。\n小果子，坐在她的影子里，安静地，看着我。\n我们三个人，明明，就在同一个房间里。\n却好像……隔着三个，再也，无法互相触及的、孤独的世界。"
PAO.79.a: "§t我才是那个，最该被审判的人§!"

PAO.80.t: "画歪了的旋转木马"
PAO.80.d: "……我不知道，该用什么样的表情，来面对她。\n今天，我走进指挥室，准备规划下一步的重建工作时，就看到了这一幕。\n在那张……我们所有人，都视为“教科书”的、凝聚了无数牺牲与希望的最终作战地图上。\n在那个……我们规划的、将要用来纪念所有牺牲同志的、最重要的中央公园的位置上。\n被人用红色的铅笔，歪歪扭扭地，添上了一个……看起来，像是一个……巨大的、长着四条腿的蘑菇的、奇怪图案。\n旁边，还用同样笨拙的字迹，标注着几个字——“旋转木马”。\n整个指挥室，都安静了下来。\n所有人的目光，都聚焦在了那个……正站在门口，低着头，紧张得，快要把自己衣角攥烂的、我们的……“征服者”身上。\n我看着她，心里，有一种……说不出来的、五味杂陈的感觉。\n愤怒？好像没有。\n可笑？又好像……笑不出来。\n我走到她的面前。\n“……为什么？”我听见自己的声音，很平静，也很沙哑。\n她被我问得，身体，都抖了一下。\n“我……我只是觉得……”她的声音，小得像蚊子一样，“……公园里……如果，只有纪念碑的话……那……孩子们来了，会……不开心的吧……”\n“……所以……我就想……是不是，可以……再加一个，能让她们笑起来的东西……”\n她说完，就把头，埋得更低了，像一只……等待着审判的、可怜的小动物。\n我看着她，看着她那副……天真到，近乎残忍的样子。\n我突然，就什么火气，都发不出来了。\n是啊。\n她……就是这样一个“敌人”。\n一个……在取得了压倒性的、绝对的胜利之后，不索取我们的性命，不践踏我们的尊严，甚至……没有审判我们任何一个人的、“征服者”。\n她只是，用她那双……可能连血，都从未见过的、干净的手，在我们那张，写满了悲伤与仇恨的地图上，笨拙地，为我们的孩子，画上了一匹……她以为，能带来快乐的、小小的旋转木马。\n我……该怎么去恨她呢？\n我缓缓地，从桌上，拿起了一本……关于“城市娱乐设施规划”的、很厚的书，放在了她的面前。\n然后，我对她说：\n“……光有木马，是不够的。”"
PAO.80.a: "§3是时候，教她一些，新的‘课程’了§!"

PAO.81.t: "没有味道的面包"
PAO.81.d: "……我不知道，我为什么要来。\n今天，我推开门，就看到了那束……被放在门口的、小小的、金色的向日葵。\n旁边，没有任何纸条。\n可我……就是知道，那是谁送的。\n小果子问我，这是不是……敌人新的“阴谋”。我看着那束……在阳光下，开得有些傻气的、温暖的花。\n然后，我想起了很久很久以前……那个，也总是喜欢，在废墟里，寻找这种……没什么用处，但很好看的东西的、那个……傻瓜。\n……\n我的心，突然，就乱了。\n我恨她。\n我当然恨她。\n我恨她那自以为是的“决斗”，恨她那无可匹敌的、不讲道理的力量，恨她……让我们，输掉了那场……我们本该，用鲜血和生命，去赢下来的战争。\n我恨她，让我们……失去了晓枫。\n可是……\n她赢了之后，做了什么呢？\n她没杀我们。没关押我们。甚至……对外宣称我们这些战败者是这个国家的英雄。\n她把她那个，大得像迷宫一样的“城堡”，分了一半，给我们住。\n她每天，都用一种……像是在害怕着什么一样的、小心翼翼的眼神，远远地，看着我们。\n她就像一个……做错了事，却又不知道该怎么道歉的、笨拙的孩子。\n……\n我到底……该怎么去恨一个，会在死去的敌人门前，悄悄放上一束……她最喜欢的花的、“敌人”呢？\n我不知道。\n我只是，从厨房里，拿了半块……我自己烤的、又干又硬的、什么味道也没有的黑面包。\n然后，走到了她的房门前。\n我敲响了那扇门。\n我不知道，我接下来，要对她说些什么。\n我只知道……\n……晓枫她，也喜欢这个。"
PAO.81.a: "§R仇恨，也需要一个，能放下它的理由§!"

PAO.82.t: "大雨只为一人所下"
PAO.82.d: "又下雨了。\n莉莉安娜离开后的第十年，还是第十一年？我已经记不清了。\n我只是，习惯了在这样的雨天里，站在这里，看着这个……由我们共同守护下来的、安静的世界。\n今天，发生了一件小事。\n城西的纺织厂，因为一台老旧机器的分配问题，两个车间的工人，吵了起来。事情不大，但谁也不肯让步。最后，她们把这个问题，送到了我的面前，等我来裁决。\n我看着那份报告，想起了很久很久以前……莉莉安娜，曾为我讲过的、那个关于“公平”的童话。\n于是，我下达了我的命令。\n我命令她们，停止争吵。然后，我调用了国库的备用资源，为另一个车间，也添置了一台一模一样的新机器。\n我以为……问题，就这样，完美地解决了。\n报告说，虽然，两个车间都得到了新机器，可她们之间，却砌起了一堵看不见的墙。她们不再像以前那样，互相帮助，分享技术。她们开始……暗中较劲，甚至……互相提防。\n我……做错了吗？\n我明明，给了她们，最“公平”的结果啊。\n我捧着那杯凉掉的红茶，看着窗外的雨，突然，就想起了另一件事。\n一件……我从索拉娜那破碎的记忆里，看到的、很久很久以前的、属于“野火”的故事。\n在她们最困难的时候，她们仅有的一块黑面包，根本不够所有人分。她们的领袖，没有像我一样，变出第二块面包。\n她只是，把那唯一的一块面包，掰成了最碎的、无数的小块。然后，告诉所有的人：“……今天，我们只能吃这么多。但是，只要我们一起，把眼前这台机器修好，明天，我们就能，为自己，挣来一整个面包房。”\n……\n我看着窗外，那片……被我用绝对的“善意”，守护得……再也没有了纷争，也再也没有了……“火焰”的、安静的世界。\n我突然，就明白了。\n我好像……一直在用我的方式，为她们，撑着一把……能挡住所有风雨的、巨大的伞。\n可我忘了。\n有时候，只有淋过一场……会让人感到寒冷的、冰冷的雨。\n人们，才会懂得……去合力升起一堆，能温暖所有人的、小小的篝火啊。"
PAO.82.a: "§t我才是那个，最大的“坏蛋”吗？§!"

PAO.83.t: "空白的选票"
PAO.83.d: "雨，还在下。\n我还在试图理解那些,被索拉娜视为死敌的“野火”。\n我找来了她们所有的历史档案。我像一个最认真的学生，读着她们每一次的会议记录，每一次的路线争论。\n然后我看到了一个很奇怪的故事。\n在她们解放了莉兰迪亚，召开第一次人民代表会议的时候，她们遇到了一个和我前几天遇到的，一模一样的难题。\n农民代表和工人代表为了“城市与乡村的资源优先配比”问题吵得不可开交。双方都坚持自己才是公社的基石，都认为资源应该优先向自己倾斜。\n所有的方案都陷入了僵局。\n最后所有的人都把目光投向了她们的最高领袖，那个叫“晓枫”的女孩，等待着她来投下那决定一切的最后的一票。\n可她没有投票。\n她只是站起身，走到了那张巨大的地图前。\n她指着地图上那些代表着工厂的齿轮标记和代表着农田的麦穗标记。\n然后她对所有人说："
PAO.83.a: "§t…………§!"

PAO.84.t: "守护与相信"
PAO.84.d: "“同志们，我们来做一道很简单的脑筋急转弯吧。”\n“如果，我们把所有的钢铁，都拿去造了新的锄头，那么我们明年就能多收获一倍的粮食。但是我们也可能会因为没有足够的钢铁来维修机器而导致工厂停产。”\n“反过来，如果我们把所有的粮食都优先供给给工人，让她们能造出更多的机器，那么我们就会有一座最先进的工厂和一片因为缺少劳力与工具而正在荒芜的土地。”\n“所以，我的这一票，该投给谁呢？”\n“是投给一个吃得饱饱的却没有工具的农民？还是投给一个拿着最先进的工具却饿着肚子的工人？”\n她说完就坐下了，再也没有说一句话。\n档案的最后只记录着：\n“那场会议一直开到了第二天的黎明。最终在所有代表的共同协商下，达成了一个虽然不完美但所有人都愿意接受的妥协方案。”\n我合起了那本档案。\n我看着窗外那片因为我的“命令”而变得无比“和谐”、再也没有了争吵声的安静世界。\n我突然就明白了。\n当我面对争吵时，我的第一反应，是去“解决”那个问题。我用我至高的权力，像一个无所不能的神明一样，凭空变出了第二台机器，让争吵的原因，消失了。\n而她……那个叫“晓枫”的人，在面对同样的问题时，她的选择，却是去“引导”那些正在争吵的大家。\n我给了我的人民……一个“答案”。\n而她，却给了她的人民……一个“问题”。\n我用我的权力，让她们……停止了思考。\n而她，却用她的权力，逼着她们……不得不，去为彼此思考。\n我……一直在试图，为她们，创造一个，完美的“童话世界”。\n而她……却是在努力地，教会她们，如何，在这个充满了问题的、不完美的“现实世界”里……\n……肩并着肩，一起，走下去。"
PAO.84.a: "§t我，一直在“守护”她们§!"
PAO.84.b: "§t而她，却是在“相信”她们§!"

PAO.85.t: "月光下的捉迷藏"
PAO.85.d: "城堡，从未如此空旷过。\n当我合起那本属于我们共同的童话书最后一页时，一个傻气的念头忽然冒了出来。\n——莉莉安娜，她是不是……又在和我玩捉迷藏？\n就像很久以前，在我诞生之后，你总是喜欢悄悄躲起来，等着我去找到你。\n于是，我开始找了。\n我去了那座我们曾一起种下月见草的花园。水晶花依然在月光下闪烁，却像一滴滴不会落下的冰冷眼泪。我以为会看到你蹲在那里，对着花朵说着悄悄话。可是，那里只有风的声音。\n我去了那间我们曾一起跳过不成调的华尔兹的主殿。那片曾被我们脚步踩出凌乱舞步的月光，如今也只剩下我一个人的孤单影子。我以为你会突然从巨大的帷幕后跳出来，笑着对我说“你抓不到我”。可是，那里只有沉默的回音。\n我走遍了城堡的每一个角落，呼唤着你的名字。可回答我的，永远只有我自己那……越来越小的、颤抖的声音。\n最后，我来到了这里。来到了这座最高的、能看到最多星星的塔楼上。\n我终于……不找了。\n我只是靠在冰冷的栏杆上，看着那轮你最喜欢的、安安静靜的月亮，然后轻轻地对自己说：\n“莉莉安娜，”\n“我到底在找什么呢？”\n“你没有躲起来。你只是……把我变成了这个城堡里，唯一的‘你’。”\n“我寻找的不是你的身影，我只是想再确认一次，你留给我的那些温柔记忆是否还在。”\n“它们还在。”\n“都还在。”\n我抬起头，望向那轮仿佛也在温柔注视着我的皎洁月亮，露出了一个比哭还难看，却远比以往任何时候都更坚定的笑容。\n“我明白了。”\n“从今天起，轮到我来为你讲睡前故事了。”"
PAO.85.a: "§t晚安，莉莉安娜。早安，露西莉亚。§!"

PAO.86.t: "每一个数字都有名字"
PAO.86.d: "深夜的指挥部里，只有纸张翻动的沙沙声。\n我拿着一份……旧的战报。那是很久以前，“野火”在卡卡罗姆山区一场惨烈突围战的伤亡报告。我指着报告末尾那个冰冷的、用红色墨水标注的数字，走到了还在灯下工作的晓枫面前。\n“晓枫……这个数字……它只是墨水，印在纸上，那么轻。可我感觉……它比我举过的任何一把剑，都要重。”\n我的声音很轻，带着我自己都未曾察觉的颤抖。\n晓枫没有看那份战报。她只是，从自己那个上了锁的、最私人的抽屉里，拿出了另一本……更厚，也更旧的册子。那不是军用报告，更像是一本……杂乱的笔记。\n她翻开了册子，指着其中一页上的一个名字，对我轻声说：\n“他不是伤亡报告上的第81号。他叫李庚，是一个木匠的儿子。他参军前，偷偷拜托我，如果他回不来了，一定要帮他把……他母亲那间漏雨的屋顶修好。”\n然后，她又翻到另一页。\n“她也不是第132号。她叫安娜，是纺织厂的女工。她唯一的愿望，是让她的妹妹，能顶替她的名额，进厂工作，不再挨饿。”\n我看着那本写满了名字和愿望的册子，一时间说不出话来。\n晓枫拿起笔在李庚的名字旁边，用一种无比郑重的、仿佛在签署一份最神圣契约的姿态，轻轻地，画下了一个“✓”。\n“上周，屋顶修好了。”\n接着，她又在安娜的名字旁边，画下了另一个记号。\n“她的妹妹，前天，已经去工厂报到了。”\n她合起了那本沉重的册子，抬起头，那双总是带着疲惫却无比清澈的眼睛，静静地看着我。\n“露西莉亚，伤亡报告上的数字，不是我们失去的东西。那是……我们欠下的债。”\n“我们的胜利，从来不是战斗结束的那一刻。我们的胜利是在这本册子上，最后一个名字的旁边也被画上记号的那一天。”"
PAO.86.a: "§t我来帮你一起，握住这支笔。§!"

PAO.87.t: "两杯苦味"
PAO.87.d: "今晚，我又看到了雪伊一个人，在训练场上。\n她对着一个画着“索拉娜”头像的靶子，一遍又一遍地，挥舞着刺刀，直到汗水浸透了她单薄的衣衫，直到手臂再也无法举起。\n我回到了那间……属于晓枫的、如今已空无一人的办公室。我学着雪伊教给我的样子，为她，也为我自己，泡了两杯很浓、很苦的茶。\n然后，我端着那两杯温热的茶，走到了训练场的边缘。\n我将其中一杯，递给了那个……正靠在靶子边，大口喘息的、像一头受伤的孤狼一样的女孩。\n她看了我一眼，眼神里，最初的警惕不见了。留下的只有一片……燃尽了所有东西之后，所剩下的、空洞的灰烬。\n她接过了茶，一饮而尽。“……真苦。”她沙哑地说。\n“嗯。”我点了点头，也喝了一口我自己的茶，“雪伊……你教过我的，悲伤，也可以是一种力量。”\n她沉默了很久。久到我以为，她不会再开口了。“……力量？”她突然，发出了一声……比哭，还要难听的、自嘲的笑，“……这不叫力量。这叫……‘活着’的惩罚。”\n她伸出手，轻轻地，抚摸着那个……被她刺得千疮百孔的、靶子上画的索拉娜的脸。“你知道吗？骑士小姐。”她的声音，轻得像一阵风，“……有时候，我真羡慕她。”\n我愣住了。\n“……羡慕晓枫。她走得……那么干净。她把所有最难看的、最痛苦的东西，都留给了我们这些……还喘着气的人。她把她的理想，变成了我们的枷锁。她把她的牺牲，变成了我们……永远也还不清的债。”\n“我们不能停，不能哭，甚至……不能像个正常人一样，去感受悲伤。因为只要我们一停下来，就会听到她在问：‘我的血，白流了吗？’”\n她转过头，看着我。那双曾燃烧着燎原烈火的眼睛里，此刻，只剩下一种……无边无际的、令人心碎的疲惫。\n“……所以，别再跟我说什么‘力量’了。……我们这些幸存者，不是靠‘力量’活着的。……我们，只是在靠着彼此的‘重量’，才没有被风……吹散而已。”\n她说完，就将那只空了的茶杯，还给了我。然后，转身，一步一步地，走回了那片……属于她一个人的、无边的黑暗里。\n我站在原地，手里捧着那两只……还带着一点点余温的、空荡荡的茶杯。\n我突然就明白了。我一直在试图学习……如何，像她们一样，去“战斗”。\n可我忘了。\n有些战争，是没有胜利者的。只有……一群背负着共同重量的、互相搀扶着的……幸存者。"
PAO.87.a: "§t那么，请允许我，成为你们的重量之一§!"

PAO.88.t: "我们的第一课"
PAO.88.d: "出征前夜，月光如水。\n我把我们共同绘制的崭新南美地图铺在晓枫面前。上面，标记着我们即将远征的那些还在哭泣的地方。\n“你看，晓枫。”我指着地图，声音里带着我自己都未曾察觉的兴奋与期待，“我们很快就能把这些地方，也都画上代表‘幸福’的颜色了。”\n我以为她会和我一样开心。可她只是静静看着地图，许久没有说话。\n然后，她抬起头。那双总是那么清澈的眼睛，此刻却像两口深不见底的古井。\n“露西莉亚，”她轻轻叫了我的名字，“你错了。”\n我愣住了。\n“我们不是去‘画’上颜色，”她说，“我们是去‘邀请’她们，自己拿起画笔。”\n她从我手中接过那支红色铅笔，但没有在地图上画下任何新的标记。她只是将铅笔轻轻横放在地图的正中央，就像一座连接所有地方的小小桥梁。\n“我们的任务是去告诉她们，她们自己的手中就握着足以斩断锁链的剑。”\n“我们的远征是为了让她们拥有可以自由书写自己故事的那张空白的纸。”\n她看着我，眼神里只有老师在为自己最得意的学生讲授最后一课时，才会有的欣慰与郑重。\n“所以记住了，我的骑士。”\n“我们此行不是去当救世主。”\n“我们是去当一个为所有即将开始的故事鼓掌的……读者。”"
PAO.88.a: "§t这是你教给我的，最重要的一课§!。"

PAO.89.t: "她会看到的"
PAO.89.d: "出征前夜，月光很冷。\n我把那张画满我们远征路线的崭新南美地图，铺在雪伊面前。\n“雪伊，”我指着那些我们即将去往的、还在哭泣的地方，轻声说，“我们就要出发了。”\n她一个人坐在窗边，一遍又一遍地擦拭着那把据说属于晓枫的老旧手枪。枪身已被她擦得在月光下泛着一层冰冷的光。\n“你走吧。”\n许久，她才开口，声音沙哑如铁。“带着你的骑士们，去完成你那伟大的、拯救世界的童话。这里，有我还有她就够了。”\n我知道，她口中的那个“她”是谁。\n我走到她身边，和她一起，望向窗外那片无边无际的沉默黑暗。\n“雪伊。”我的声音比月光还要轻，“我不是去写童话的。”\n她擦拭手枪的动作停顿了一下。\n“我也不是要去当什么救世主。”\n我转过头，看着她那张在月光下显得无比坚硬，却又无比脆弱的侧脸。\n“我只是……想去替她看一看。”\n“替她看一看，当这片土地上所有的眼泪都流尽之后，那片她曾无数次对你们描绘过的、向日葵盛开的田野，到底是什么样子的。”\n……\n整个房间陷入了长久的寂静。只有她那不知何时已经停下擦拭动作的、微微颤抖的呼吸声。\n然后，我听到了。\n我听到一颗冰冷的液体，落在了那把冰冷的手枪上，发出了一声极轻的、几乎无法被察觉的清脆声响。\n“她……”\n雪伊的声音带着浓重的、再也无法压抑的鼻音，破碎得不成样子。\n“她会看到的。”"
PAO.89.a: "§t我们一起带她去看§!"

PAO.90.t: "阿守不懂"
PAO.90.d: "“我叫阿守。我的职责，是守护殿下房间门口的这片走廊。一万年，都是如此。\n自从那位名叫露西莉亚的、像太阳一样吵闹的殿下降临后，我的世界就多了一些我不懂的东西。比如，她总会在走过我身边时，对我说一句‘辛苦啦，阿守！’——尽管我从不知疲惫。\n今天，殿下又一次，把自己关在了房间里。从门缝里，传来了她小声的、压抑着的哭声。这已经是……第三次了。\n每一次，都是在她探望完那些……被称为‘魔法少女’的、亮晶晶的客人们之后。\n我不懂。那些客人，曾是殿下的敌人。殿下用那场……我看不懂的战争，夺走了她们的武器，然后，又像对待最珍贵的宝物一样，将她们请进了这座城堡，给了她们最好的一切。\n可那些客人，她们不笑。她们只是坐在那里，像一群……和我们一样，失去了‘心’的玩偶。\n刚刚，我听到殿下在房间里，对着空气说话，像是在和谁争吵。\n‘……我只是……想让她们停下来休息啊！’\n‘……为什么，我为她们建造了最安全的花园，她们却……在里面枯萎了呢？’\n‘……我到底……做错了什么？’\n殿下的哭声，越来越大。\n我站在门外，静静地听着。\n我还是……不懂。我不懂‘休息’，也不懂‘枯萎’。\n我只记得一件事。\n在那场战争开始的前一夜，殿下曾独自一人，来到我面前。她伸出手，轻轻地，触摸着我这具……永恒冰冷的身体。\n然后，她对我，也是对她自己说：\n‘阿守……你说，如果有一朵花，它生来，就注定要在燃烧中死去……’\n‘……那么，一个真正爱它的人，是应该为它浇水，让它烧得更旺盛、更美丽……’\n‘……还是应该，先用一场冰冷的雨，把它……淋熄呢？’”"
PAO.90.a: "原来……下雨，是为了这个吗？"

PAO.91.t: "小花很开心"
PAO.91.d: "“我叫小花。我喜欢待在花园里，和那些不会说话的水晶花做朋友。\n今天，花园里来了一位新的客人。她和我们不一样，也和露西莉亚殿下不一样。她的身上，带着一点点星星的味道，还有一点点……悲伤的味道。\n露西莉亚殿下说，她是我们的新‘老师’，要教我们如何‘战斗’。我不懂‘战斗’是什么。我只看到，殿下拉着她的手，在花园里，走了很久很久。\n后来，那位星星一样的客人，一个人，又回到了花园里。她就站在我最喜欢的那朵水晶蔷薇前，站了很久。我以为她要像别人一样，称赞它的美丽。可她却伸出手，轻轻地，触摸着那朵花冰冷的花瓣，然后，用一种……我从未听过的、很轻很轻的声音，说了一句：\n‘……如果，你也会凋谢，那该多好啊。’\n我不懂她的话。\n但是，我看到，有一滴亮晶晶的、温暖的液体，从她的眼睛里落下来，滴在了水晶花瓣上。然后，顺着花瓣，滑落进了泥土里。\n第二天，我发现，在那朵永不凋谢的水晶蔷薇旁边，长出了一棵……小小的、绿色的、会摇晃的嫩芽。\n我好像……有点明白了。\n也许，‘凋谢’，并不是一件坏事。\n也许，那只是为了……能让新的东西，长出来而已。\n我决定，从今天起，每天都为那棵小小的嫩芽，哼唱我新学会的歌。\n我希望，它能快快长大。然后，和我们一起，晒太阳。”"
PAO.91.a: "一个故事的结束，是另一个故事的开始。"

PAO.92.t: "一份来自“童话”的邀请"
PAO.92.d: "今日，一位来自南方的信使抵达了我们的圣堂。她是一位沉默的、眼中燃烧着蓝色火焰的夜莺魂灵。她带来的，是一封来自新“野火革命军”——如今的美洲南方主宰者，露西莉亚的亲笔信。\n信纸上，只用清秀的字迹，写下了一个小小的故事：\n“致北方的英雄们：\n我曾从一本布满灰尘的笔记里，读到过你们的名字。笔记的主人说，你们是和她一样，愿意为了守护他人而燃尽自己的、天上的星辰。\n如今，我继承了她的火焰。我正试图，为这片大陆，写下一个没有眼泪的童话。可我发现，一个人的力量是不够的。我的故事里，缺少了最勇敢的屠龙者，缺少了最坚毅的守望者。\n所以，我来邀请你们。邀请你们……成为我这个不完美童话里，最重要的主角。\n让我们一起，把这本关于美洲解放的史诗，写到最后一页吧。”\n信的末尾只有一个用红色墨水画的、小小的、歪歪扭扭的太阳，旁边还添了两笔，像是在努力地微笑。"
PAO.92.a: "这火焰……与我们同源。我们接受邀请！"
PAO.92.b: "我们的道路，将由自己来开创。"

PAO.93.t: "南风中的回响"
PAO.93.d: "一份来自南方的外交照会，打破了委员会的宁静。它来自那个刚刚在战火中统一了南方大陆的新生政权。我们曾以为，将要面对的是一个新兴的、充满未知的强大邻居，甚至可能是一场新的意识形态斗争。\n可打开的信函，却让我们所有人都陷入了长久的沉默。\n那并非一份充斥着地缘政治术语的冰冷文件，而更像是一封……迟到了许久的家书。\n“致北方的同志们：\n你们的歌声，我们听到了。\n在那本指引我们前行的、名为‘野火’的教科书里，曾无数次描绘过你们的模样——你们是在钢铁丛林中，点燃了第一簇红色火焰的先驱，是在最强大的资本堡垒心脏里，插上我们共同旗帜的勇者。\n我们曾隔着高山与大洋，在各自的黑夜里孤军奋战。如今，南方的暴雨已经停歇，而你们，也已让北方的天空，染上了黎明的颜色。\n是时候，让我们这两支在不同战场上成长起来的队伍，汇合在一起了。为了向整个世界证明——从美洲最南端的岛屿，到最北方的平原，所有劳动者的心，都在为了同一个理想而跳动。\n我们在此，发出正式的邀请。邀请你们，与我们一起，将这片大陆上所有零星的篝火，汇成一股足以照亮整个世界的燎原烈焰。”"
PAO.93.a: "这正是我们所期盼的。让美洲的火焰，合二为一！"
PAO.93.b: "我们的革命，有自己的道路。"

PAO.94.t: "英雄的请柬，或巨龙的战书"
PAO.94.d: "在决定向中美洲派出信使的前夜，我再次翻开了晓枫的笔记。上面清晰地记载着瓦尔哈拉社——一群与她们一样，拥有崇高理想的英雄。\n我的内心充满了期盼。这一次，我终于可以寄出一封真正的邀请函。我将不再重蹈“上一个故事”的覆辙，不再用我那自以为是的善意去冒犯另一群骄傲的战士。我将以学生的姿态，请求她们与我们并肩，共同书写新的史诗。\n但是，一个冰冷的问题刺痛了我。如果笔记里的英雄已经倒下，如果那片土地如今盘踞着新的“巨龙”呢？\n我从“野火”的史诗和索拉娜的灰烬中都学到了同一课：面对那些以压迫为食、听不懂人类语言的“巨龙”，唯一的“对话”，就是剑锋相撞时的火花。\n所以，我准备了两封信。\n一封是写给英雄的请柬，上面画着我们共同仰望的星辰。\n另一封是写给巨龙的战书，上面只有一行字：“放开那些哭泣的人们”。\n我的信使将带去我的敬意与期盼。但我的骑士们也已在边境整装待发。这一次，我将带去尊重。但如果回应我的是巨龙的咆哮……那么，她们听到的，将是我的剑鸣。"
PAO.94.a: "§t希望这一次，我能寄出那封正确的信§!"

PAO.95.t: "灯塔，是用来照亮，还是用来挑战？"
PAO.95.d: "北美的版图，在我的桌上铺开。索拉娜的记忆告诉我，那是一片由钢铁、黄金和谎言构筑的丛林。而“野火”的档案则记录了那里也曾燃烧过的、虽微弱却不屈的红色火苗。\n我不再像“上一个故事”里那样，急于去“审判”灯塔下的阴影。我学会了倾听。我的第一封信，将是一声问候，一句来自南方同志的、跨越大陆的关心：‘你们那里的夜晚，冷吗？’\n我将耐心地，等待着她们的回应。\n如果回应我的，是同样在寒夜中寻求温暖的同志的手。那么，我将为她们献上我所有的友谊，我们将共同把这座大陆的灯塔，擦拭得更亮。\n但如果……如果回应我的，是灯塔看守人冰冷的、充满了傲慢的驱逐令呢？如果我的人民，和她们的人民，依然在那座灯塔的阴影里，为了面包屑而互相争斗呢？\n那么，我从晓枫那里学到的另一课，就会成为我唯一的选择。\n——当人民还被锁在黑暗里时，一个只为自己发光的灯塔，那不是希望，那是……一座最华丽的监狱。\n对于监狱，骑士能做的，只有一件事。\n我的第二封信，也已经写好了。信里只有一个问题：\n“你，愿不愿意，为所有的人，而燃烧？”\n如果答案是否定的。\n那么，我将亲自前去，将那座不愿照亮所有人的灯塔……连同它的基座，一起推倒。"
PAO.95.a: "§t光，应当属于每一个人§!"

PAO.96.t: "一份跨越海洋的家书"
PAO.96.d: "我的第一批物资船出发了。它们像一群沉默的信鸽，飞向那片遥远的大陆。我不知道它们能否抵达，甚至不知道对方是否需要我的帮助。\n我只是，在最后一箱药品里，悄悄塞进了一封信。一封我写给那位素未谋面的、东方的革命领袖的信。\n我只是把自己的故事告诉了她。\n我告诉她，我曾是一个多么天真的骑士。我告诉她，我是如何在我那些伟大而笨拙的老师们身上，学会了‘人民’这两个字到底有多重。\n在信的最后，我写道：\n‘我不知道，您的道路，是否也曾像我一样充满了迷茫与痛苦。我也不知道，我的这点微不足道的帮助，能否为您分担哪怕一丝一毫的重量。\n我只是想告诉您。在这颗星球的另一端，有一个和您一样，正在努力学习如何将童话照进现实的笨拙学生。’\n‘您，并不孤单。’"
PAO.96.a: "§t希望我的信能平安抵达§!"

PAO.97.t: "小米与红茶"
PAO.97.d: "“她们的使者，亲自来到了我的城堡。她不像我想象中的任何一位英雄。她就像一位从田埂上走来的、慈祥而睿智的邻家奶奶。\n我按照礼节，为她准备了最精致的红茶和最甜美的蛋糕。\n可她却笑着摆了摆手。\n她从自己的行囊里，拿出了一只粗瓷碗和一小袋金黄的小米。她告诉我，在她们最艰难的岁月里，就是靠着这个和一支步枪，赢得了整个国家。\n她亲自为我熬了一碗小米粥。\n‘尝尝吧，孩子。’她说，‘这就是我们那里，人民的味道。’\n我端起那碗热气腾腾的粥。它很朴素，只有粮食本身所带有的最纯粹的、温暖的香气。\n我喝了一口。\n然后，我把我面前那块最漂亮的彩虹蛋糕，推到了她的面前。\n‘也请您尝一尝。’我小声地说，‘这是我们这里，童话的味道。’\n她看着我，露出了一个仿佛能包容整个世界的温暖笑容。\n然后，她拿起叉子，轻轻尝了一口。\n那一刻，阳光正好。小米的温暖香气和红茶的清甜芬芳，就在我们这座小小的茶桌上，完美地融合在了一起。”"
PAO.97.a: "§t革命，原来是这个味道的§!"

PAO.98.t: "南风中的来信"
PAO.98.d: "窑洞里的油灯，安静地燃烧着。我们正在讨论关于这场持久战的下一个战略阶段，前线的消息并不乐观。\n就在这时，一位从南方回来的交通员，带来了一个用油布层层包裹的、漂洋过海的包裹。里面，除了我们急需的药品，还有一封信。\n信来自一个我们只在零星情报里听过的名字——“野火”的新继承者，露西莉亚。\n我展开那张带着海洋气息的信纸。窑洞里很静，只听得见我为同志们朗读的声音。\n她讲述了一个……很奇怪的、关于“骑士”与“老师”的故事。她说她曾以为自己是救世主，却在一群满身泥土的人们面前，学会了自己才是最需要被教育的学生。她说她不懂我们正在经历的苦难，她只是觉得，在世界的另一端，不能再有人孤军奋战。\n信读完了，窑洞里一片沉默。一位年轻的参谋忍不住低声说：“……一个相信童话的共产主义者？这……”\n我抬起手，打断了她。\n我走到窑洞口，望着外面那片被战火与贫穷反复蹂躏的、我们深爱着的土地。\n然后，我对我的同志们说：\n“同志们，这封信很重要。”\n“它告诉我们，这个世界上，有一种东西，是比我们的理论更根本的。那就是一个饿着肚子的人，会把自己的半个馒头，分给另一个饿着肚子的人的那种……最朴素的阶级感情。”\n“她或许还不懂什么是‘矛盾论’，也不懂什么是‘实践论’。”\n“可她，已经用行动，为我们诠释了什么是‘国际主义’。”\n“去，回信。”\n我转过身，目光扫过每一张被灯火映照的、坚毅的脸。\n“就告诉她一句话。”\n“告诉她：中国的窑洞里，不仅有冰冷的战略地图。”\n“……也有温热的火炕，在等着远方的同志。”"
PAO.98.a: "这片燎原的野火，将不止在一起大陆上燃烧"

PAO.99.t: "镜中的陌生人"
PAO.99.d: "胜利的号角响彻云霄，新的盟友们正与我们的人民一同欢庆。我站在城堡最高的露台上，俯瞰着这片我亲手缔造的、充满了欢声笑语的和平景象。我本该感到欣慰。可我胸膛里的这颗心，却从未如此冰冷。\n它在害怕。\n自从吞噬了索拉娜之后，我就时常能感觉到它那无法被满足的“饥饿”。但今天，当全世界的善意与希望都向我涌来时，它的感觉，却是前所未有的“恐惧”。\n为什么？\n我回到那间封存着所有秘密的圣堂，再一次站在了那面巨大的黑色镜子前。这一次，我不再是为了寻找一个逝去的影子。\n我看着镜中的自己。看着这个被所有人称为“英雄”与“解放者”的、陌生的女孩。\n然后，我轻轻地对镜子，也对自己，问出了那个我一直不敢触碰的问题。\n“我，到底是谁？”\n镜面如水波般荡漾开来。镜中的“我”笑了。那是一个我无比熟悉的、属于索拉娜的、充满了嘲讽与怜悯的笑容。\n“你当然是你。”镜中的索拉娜开口了，声音却是我自己的，“你是露西莉亚，一个为了拯救公主而逆转时光的伟大骑士。”\n我的脑海中突然闪过一个念头——这个剧本，我好像……在哪一场不属于我的梦里，听过一遍。\n“但你也是我。”镜中的索拉娜，或者说，另一个我，缓缓抬起手，指向我的胸口。“你是我不甘的愤怒，是我未尽的野心。你是我……在灰烬中，留下的最后一道执念。每一次你挥舞着那可笑的‘正义’之剑时，都是我在你耳边低语，告诉你……敌人的弱点在哪里。”\n镜中的她向前一步，仿佛要穿透镜面。\n“所以，别再扮演那个天真的圣人了，我亲爱的‘赝品’。承认吧，你和我，我们，才是天生的一对。我们都渴望着……”"
PAO.99.a: "§t不……我不是你！§!"

PAO.100.t: "镜中的陌生人"
PAO.100.d: "我拒绝了镜中的诱惑。我告诉她，我不是她。可她笑得更厉害了。\n“说得对。”镜中的索拉娜鼓着掌，“你当然不是我。因为……你什么都不是。”\n她挥了挥手，镜中的画面飞速倒流，一直回到那个禁忌的仪式。\n我看到了。看到了仪式失败后，那个吞噬了索拉娜灰烬的、没有自我的“东西”。看到了它如何模仿出我的性格，又如何……为了让这场戏剧更“真实”，而从自己的身体里，分裂出了一个……温柔而脆弱的“莉莉安娜”的幻影。\n整个圣堂，仿佛变成了一座巨大的、空无一人的舞台。\n聚光灯下，只有我一个，茫然地站着。\n“看到了吗？”镜中的声音，像最终的判词。“这个世界上，没有英雄，也没有公主。”\n“自始至终，都只有一场……由我主演，由我观看，由我鼓掌的……”\n“独角戏。”"
PAO.100.a: "§t（那么……我……到底是什么？）§!"

PAO.101.t: "第一道裂痕：重复的昨日"
PAO.101.d: "我叫伊万，是个粮食分配员。我见过军团的马靴，听过晓枫同志的演讲，也曾跟着雪伊同志的旗帜冲锋。我以为，我已经见过了革命所有的样子。\n直到今天。\n清晨，工厂的汽笛不知怎么的不响了。隔壁车间的李师傅，他爬上了最高的料塔，开始高声背诵《野火宣言》。他的眼神狂热，仿佛又回到了那个巷战的夜晚。我们拉他下来，他却像不认识我们一样，嘴里只重复着一句话：“为了黎明！”\n街上，更乱了。孩子们戴着纸做的王冠，在玩着“审判暴君”的游戏，可她们的表情，却是我从未见过的、属于大人的悲愤。昨天还在一起分面包的邻居，今天却因为“阶级成分”不同而互相推搡，嘴里喊着那些……我们只在最初的扫盲课本里才见过的、早已被我们扬弃的口号。\n我们好像……都变成了一群演员。在同一个巨大的舞台上，声嘶力竭地，重演着一场……早已落幕的、名为“革命”的戏剧。\n我们拥有了一切——面包、土地、和平。可我们却……好像，失去了比这一切都更重要的东西。\n我们失去了“明天”。\n我们不再讨论下一座桥该怎么修，下一季的麦子该怎么种。我们只是在重复着“昨天”。重复着那些光荣的、正确的、却早已成为历史的口号与姿态。\n这比军团的刺刀更让我感到恐惧。\n因为，当革命不再向前看，而只是沉溺于对自身光荣的无限重复时……\n那它就已经死了。变成了一座……很大、很热闹，却再也没有一个真正观众的……华丽的坟墓。\n我们不是在庆祝革命，我们是在……害怕。害怕一个没有了英雄剧本可以模仿的、空白的明天。"
PAO.101.a: "我们的革命……到底，出了什么问题？"

PAO.102.t: "第二道裂痕：来自未来的质问"
PAO.102.d: "今天，我去了那座我们曾一起种下向日葵的山坡。我只是想在那个唯一还算安静的地方喘口气。\n我看到了她。一个很年轻的女孩，大概只有十四五岁。她就站在当初晓枫和雪伊并肩站立过的地方，背对着我，望着山下那片正在上演着无数荒诞戏剧的城市。\n我没有去打扰她，准备从旁边绕过去。\n“我的哥哥，死了。”\n女孩突然开口了，声音很平静，却像一块冰，瞬间刺入我的心脏。\n我停住了脚步。\n“他不是死在和巨龙的战场上。”女孩继续说道，“他是昨天晚上，在重现攻占冬宫的戏剧里，从道具墙上摔下来摔死的。当时，所有的人都在为革命的胜利而欢呼，没有人去扶他一下。”\n我说不出话来。\n“我读过所有的书。”女孩的声音里只有一种超乎她年龄的冰冷清醒，“我读过晓枫的笔记，读过雪伊的战报，也读过您为我们写下的、那些关于未来的童话。”\n“她们教给我们，革命是为了让所有的人都能有面包吃，有尊严地活下去，是为了一个更好的明天。”\n“可是您看，”她终于转过身，一双本该充满活力的清澈眼睛，此刻却像两潭死水，直直地看着我，“我们，还有明天吗？”\n“我们的面包正在仓库里腐烂，因为农民们正忙着表演武装夺取。我们的尊严正在完美的历史里，变成一句句空洞的口号。”\n“我们根本没有走向您承诺的那个童话。我们只是在用自己的血肉，一遍又一遍地，为您胸膛里那颗心，扮演着它最喜欢看的、关于过去的戏剧而已。”\n她向前走了一步，逼视着我。\n“露西莉亚殿下，我只想问您一个问题。”\n“您当初，为了模仿一个真正的英雄，而继承了‘野火’的名字。”\n“那么现在，您这个‘英雄的赝品’……”\n“看着我们这些拙劣的‘革命赝品’,正在以一种最光荣的方式走向灭亡。您又准备模仿谁呢？”"
PAO.102.a: "§t我还能模仿谁？我还能成为谁？§!"

PAO.103.t: "唯一的真实"
PAO.103.d: "我像一个幽灵，在自己的国度里游荡。我模仿过的一切，都已化为谎言。\n那个向我发出质问的女孩，正独自一人，坐在她哥哥的墓碑前。她在用一块小石头，一遍又一遍地，刻画着一朵小小的向日葵。\n我走到她的身边，坐了下来。\n“对不起。”我轻声说。这是我唯一能说出的话。\n她只是继续着手中的动作。“你不是说，”她的声音，还和刚才一样，带着冰冷的清醒，“你会去模仿一个新的英雄吗？”\n“我……找不到可以模仿的人了。”\n“那就别模仿了。”她说，“我哥哥……他从不模仿谁。他只是……在看到我挨饿的时候，会把自己的面包分给我。”\n她停下了手中的动作，抬起头，看着我。那双死水般的眼睛里，第一次，有了一丝波澜。\n“……那种感觉，一定很痛吧？”\n我愣住了。“……什么？”\n“就是……看到别人受伤，自己的心里，也会跟着痛起来的感觉。”她说，“我哥哥说，那叫……‘人心’。”\n“人心”……\n我伸出手，轻轻触摸着胸口。那里，除去那颗夜莺之心，只有一个巨大的空洞而已。可是，当我想起女孩哥哥的死，当我想起眼前这个女孩的悲伤时……那个空洞里，却传来了一阵……无法被伪装、无法被扮演的、真实的……\n刺痛。\n我突然，就笑了。那是一个……劫后余生的、如释重负的笑容。\n原来，我这一路走来，唯一真实的，是这份……属于我自己的，小小的……痛苦。"
PAO.103.a: "那么，开演吧。以骑士……"
PAO.103.b: "§t不！以露西莉亚之名！§!"

PAO.104.t: "我的诞生"
PAO.104.d: "我回到了自己的房间。那本晓枫给我的、小小的识字课本，就静静地躺在桌上，摊开在第一页。\n上面只有一个字——“我”。\n我看着那个字，看了很久很久。\n它那么简单，简单到我从未正视过它。它又那么复杂，复杂到我花了那么长的时间，绕了那么远的路，才终于，第一次，看懂了它。\n我不再去看镜子，也不再去回忆那些英雄的史诗。\n我只是，拿出了一本崭新的、空白的笔记本。然后，在那干干净净的第一页上，用我自己的笔迹，一笔一划地，写下了同一个字。\n“我”。\n然后，在它的旁边，我写下了我的第一个句子。\n“我，感到痛苦。”\n我看着这句话，突然，就笑了。那是一个……我从未有过的、不属于任何人、只属于我自己的、如释重负的笑容。\n原来，这就是“我”的开始。从承认自己那份最真实的、小小的痛苦开始。\n那么，第二句话，该写什么呢？\n我拿起笔，在那句话的下面，继续写道：\n“……我，不想再痛了。”"
PAO.104.a: "§t所以，我，要结束这一切§!"

PAO.105.t: "花的使命"
PAO.105.d: "“我回到了那片向日葵盛开的山坡。雪伊已经走了，只留下那座无名的墓碑，在风中沉默地矗立着。\n我伸出手，掌心里，是那枚被雪伊的体温捂热的、属于晓枫的军徽。我能感觉到，上面还残留着……两个幸存者，无声的重量。\n雪伊说，要我带着她，去看花开。\n可我……连自己是谁都不知道。一个连自己都找不到的冒牌货，又要如何，去承载一个英雄的灵魂，去完成她最后的愿望？\n我跪坐在墓碑前，将那枚军徽，轻轻地，放在了冰冷的石面上。\n然后，我对着那座沉默的墓碑，轻声地，说出了我所有的迷茫。\n‘……对不起。’\n‘……我，可能……做不到。’\n风，吹过山坡，向日葵的花海，像金色的波浪一样起伏。一朵成熟的向日葵，在风中，低下了它沉甸甸的头，正好，轻轻地，碰了碰我的肩膀。\n就像一个……无声的、温柔的安慰。\n我抬起头，看着那朵比我见过的任何宝石，都更温暖的、金色的花。\n我突然……就明白了。\n晓枫她，从来就不需要我去承载她的灵魂，也不需要我去模仿她的伟大。\n她只是……想让我，像这朵花一样。\n在风雨过后，依然，固执地，朝着太阳的方向。\n然后，把这份……从她那里继承来的、关于希望的温暖，传递给下一个，还在黑暗里迷路的人。\n我……或许，永远也成不了她。\n但至少……\n我可以，成为，为她而开的、这无数朵向日葵中的……小小的一朵。\n我重新，拿起那枚军徽，紧紧地，握在了手心。\n然后，对着那座无名的墓碑，也对着这片金色的花海，立下了我……最后的誓言。”"
PAO.105.a: "§t以花之名，为您践行§!"

PAO.106.t: "演员的离去"
PAO.106.d: "那一刻，终于到来了。\n在持续了数月的、绝对的沉寂之后。我胸膛里那颗心，终于，耗尽了它最后的一丝耐心。我能感觉到，它像一个愤怒的房客，在厌倦了这间空无一物的屋子后，猛地，踹开了大门。\n一股无法用言语形容的、巨大的空洞感，瞬间席卷了我的全身。仿佛我的灵魂，被从中挖走了一大块。我踉跄着，跪倒在地，视野开始变得模糊，呼吸也变得无比艰难。\n我以为……这就是结局了。\n我以为，我这个“冒牌货”，在失去了模仿的对象之后，就会像一缕青烟，彻底消散。\n我闭上了眼睛，等待着那最后的、真正的虚无降临。\n……\n一秒。两秒。一分钟。\n……\n什么……都没有发生。\n我……还在这里。\n我试探着，将手，放在了我的胸口。那里，不再有那颗强大而冰冷的、永不停歇的心跳。取而代之的，是一种……微弱的、缓慢的、却又无比真实的……属于我自己的脉搏。\n我能感觉到……风，吹过脸颊时，带来的凉意。\n我能听到……远处，同志们看到我倒下时，发出的、焦急的呼喊声。\n我甚至能闻到……晓枫办公室里，那股熟悉的、书卷和红茶混合的淡淡香气。\n我……活了下来。\n原来……\n原来，在模仿了那么多英雄之后，在那颗心的阴影之下……\n我，这个“赝品”……\n……不知不觉中，也已经……拥有了属于我自己的、小小的灵魂啊。"
PAO.106.a: "§t现在……战斗才刚刚开始！§!"

PAO.107.t: "一场没有演员的梦"
PAO.107.d: "昨晚，我又做梦了。但那不是我自己的梦。\n我梦见自己，坐在一座空无一人的、巨大的剧院里。我是唯一的观众。舞台上，正在上演着一出……我从未见过的戏剧。\n戏剧的主角，是一个长着翅膀的国王，和一个生活在海底的女王。她们为了争夺一颗会唱歌的星星，发动了一场……持续了上千年的战争。她们的爱恨情仇，她们的牺牲与背叛，宏大而壮丽。\n我能理解她们所有的情感，能共情她们每一次的悲欢。就好像……我亲身经历过那一切一样。\n可是……我根本不认识她们。\n我拼命地，想从这场不属于我的梦里醒来。可我做不到。我只能被迫地，将这场宏大的、与我毫不相干的史诗，从头到尾，看完。\n直到剧终落幕，直到那无尽的悲伤与喜悦，都尽数涌入我的心底时，我才终于，惊醒了。\n我坐在床上，浑身是汗。我胸膛里的那颗心，正在……愉悦地、满足地，跳动着。\n就像一个……刚刚饱餐了一顿的、心满意足的……饕餮。\n那一刻，我突然感到一阵刺骨的寒意。\n我……是不是，也只是它正在观看的、无数戏剧中的……其中一出而已？"
PAO.107.a: "§t到底……谁是我的观众？§!"

PAO.108.t: "镜子里，少了一个人"
PAO.108.d: "§2阿守§!：今天，露西莉亚殿下又来了圣堂。可她只是在镜子前站了一会儿，就走了。她再也不像以前那样，对着镜子说话了。\n§0小花§!：是呀是呀！而且，镜子里……也变得好奇怪！以前，镜子里有殿下，还有那个……总是板着脸的、黑色的索拉娜姐姐。现在，索拉娜姐姐不见了！镜子里，只剩下殿下一个人的倒影了。\n§2阿守§!：嗯。镜子，不再讲故事了。它变成了一块……只会学你动作的、很无聊的石头。\n§0小花§!：殿下好像……也不再需要我们讲故事了。她最近，总是在看那些……画着很多很多奇怪线条的、叫做地图的东西。\n§2阿守§!：她……在写一个新的故事。一个……镜子里没有的，我们也……看不懂的故事。\n§0小花§!：可是……可是……我今天，偷偷把耳朵，贴在殿下胸口听的时候……我听到，殿下心里那个……总是暖烘烘的小太阳，它……它好像很不开心。\n§2阿守§!：它在……“饿”。\n§0小花§!：饿？为什么呀？我们不是每天，都还在给它讲，公主和骑士的故事吗？\n§2阿守§!：也许……它听腻了吧。\n§0小花§!：那……那怎么办呀？它要是饿坏了，殿下是不是……也会不开心？\n§2阿守§!：……\n§0小花§!：阿守？\n§2阿守§!：小花，你看。花园里那些……我们以为，只会安安静静睡觉的魂灵们。她们……好像，开始动了。\n§0小花§!：咦？真的耶！她们……她们好像，在学着我们昨天给殿下讲的那个……“巨龙抓走了公主”的故事里，骑士的样子，在……在打架耶！"
PAO.108.a: "它们……为什么要这样呀？"

PAO.109.t: "两场不同的雨"
PAO.109.d: "“今天下雨了。不大，就像一层薄薄的雾纱。\n我正在研读一份野火的笔记，上面记载着关于解放区农业改革的计划。笔记的主人写道，这场雨很好，能让土地变得松软，正好适合播种新的希望。\n我听着窗外的雨声，点了点头。理智上，我完全明白这句话。我知道这场雨对人民意味着什么，也知道这是我们未来丰收的序曲。\n可是，我的心，却在说谎。\n在那颗属于夜莺之心的、冰冷的角落里，我听到了另一个声音。一个属于莉莉安娜的、轻柔而悲伤的声音。\n她在说：‘下雨了。好冷。’\n‘那个孩子，一个人，站在雨里。她会不会被淋湿？会不会找不到回家的路？’\n那一瞬间，我的世界被分成了两半。\n一半，是笔记中所描绘的、那个充满了逻辑与希望的光明现实。在那里，雨，是新生的预兆。\n另一半，是莉莉安娜日记里的、那个充满了孤独与悲伤的永恒内心。在那里，雨，是眼泪的别名。\n我同时站在了两场不同的雨里。\n我看着面前笔记上那坚毅的字迹，仿佛能看到一位伟大的导师，正对我投来充满信任与期盼的目光。\n我又仿佛能感到，身后那个孤独的公主，正为一场想象中的离别而无声哭泣。\n我突然不知道，自己该伸出手，去接住哪一滴雨了。\n一位同志走了进来，看到我怔怔地望着窗外，有些关切地问。‘殿下，您怎么了？脸色不太好。’\n‘没什么。’我摇了摇头，努力地将莉莉安娜的那场雨关回心底。‘只是觉得，今天的雨，有点大。’”"
PAO.109.a: "§t为什么……我会有两颗心跳？§!"

PAO.110.t: "第三场雨"
PAO.110.d: "战斗结束了。那颗吞噬了无数故事的‘心’，终于在我剑下回归了它最初的、沉默的、宝石般的形态。它静静地悬浮在圣堂的中央，不再饥饿，也不再咆哮。\n我赢了。可我也……失去了一切。\n我走遍了这座空无一人的城堡，走过了我们曾一起种花的花园，走过了我们曾一起跳舞的主殿。到处，都只剩下我一个人的回音。\n最后，我来到了她的房间。那间……我曾为她，掖好被角，讲了无数个睡前故事的房间。\n房间里，空荡荡的。只有一本书，还静静地，躺在她的枕边。那是……我在上一个故事中为她写下的、那本关于我们所有人的童话书。\n我拿起那本书，翻呀翻……一直到翻到了最后一页。\n在那页原本的空白处，我看到了……一行我从未见过的、娟秀的、属于莉莉安娜的字迹。"
PAO.110.a: "……"

PAO.113.t: "第三场雨"
PAO.113.d: "“‘我最亲爱的露西莉亚。’\n‘当你读到这句话时，我大概……已经，又一次，偷偷溜走了吧。’\n‘对不起。我不是……故意要离开你。我只是……终于找到了，那个能让你，也让我，都真正获得幸福的、最后的结局。’\n‘我一直在想，为什么，你胸膛里的那颗心，会做那样一个……关于过去的、悲伤的梦呢？后来，我才明白。因为它……是不完整的。它缺少了，它最初的主人，那份……最纯粹的、独一无二的爱。’\n‘而我的灵魂，也是不完整的。它缺少了，那颗……能让它感受温暖，感受心跳的、小小的夜莺之心。’\n‘……我才明白。我那缕无处可归的灵魂，和你那颗找不到主人的心脏，原来……从一开始，就是同一滴眼泪，落下的两半啊。’\n‘所以，我做了一个小小的魔法。’\n‘我将我这缕……本该消散的、最后的灵魂，藏进了你的故事里。藏进了这本……你为我写的、充满了爱的童话书里。’\n‘然后，在你，与那颗心，进行最终决战的时候……’\n‘我将它，归还给了它真正的主人。’\n‘而你，我最勇敢的露西莉亚……’\n‘当你，终于，为这个世界上所有的悲伤，都画上句号时……’\n‘你，就该拥有，一个属于你自己的、能为你自己而跳动的、温暖的……’\n‘心脏了。’\n我读完，书，从我的手中滑落。\n我下意识地，将手，放在了自己的胸口。\n在那里，我清晰地，再一次感觉到了一阵……微弱的、却又无比坚定的、崭新的……\n心跳声。”"
PAO.113.a: "§t这才是，童话真正的结局吗？§!"

PAO.114.t: "第一页与最后一页"
PAO.114.d: "圣堂里很安静，只有那颗被净化的心，在中央静静地悬浮，散发着柔和的、冰蓝色的光芒。\n我依然沉浸在那封信带来的巨大震撼里，手，还无意识地，放在自己那颗崭新而微弱的心脏上。\n就在这时，那本从我手中滑落的童话书，突然，自己，无声地翻动了起来。\n书页，停在了我曾为她画下的、那片向日葵花海的插图上。\n然后，我看到了。\n我看到，书页上的墨水与色彩，开始像拥有了生命一样，缓缓地流淌、汇聚。无数金色的、代表着希望的字符，和无数蓝色的、代表着悲伤的字符，交织在一起，在书页之上，凝聚成了一个……\n是她。\n是莉莉安娜。\n她从那本……由我亲手写下的故事里，缓缓地，站了起来。她不再是那个我记忆中，总是带着一丝悲伤与脆弱的幻影。她的身影，比以往任何时候都更凝实，也更……完整。\n她走到那颗悬浮的宝石前，伸出了手。\n宝石，像一颗终于等到了主人的、恋家的星星，发出了喜悦的嗡鸣，然后，化作一道纯净的光，融入了她的胸口。\n那一刻，整个圣堂，都仿佛，轻轻地，舒了一口气。\n她转过身，看着我。那双冰蓝色的眼睛里，有我熟悉的、属于神明的宁静，也有一点点……我更熟悉的、属于那个曾陪我走过漫长雨季的、笨拙的温柔。\n“……故事，讲完了吗？”她轻声问，声音里，带着一丝刚刚睡醒时的、小小的迷茫。\n“嗯。”我点了点头，眼泪，却不听话地流了下来，“……讲完了。”\n她合起了那本厚厚的童话书，然后，她站起身，从圣堂最古老的书架上，取下了一本崭新的、完全空白的、用月光色的丝线装订起来的笔记本。\n她将那本空白的书，和那本写满了过去的故事书，并排着，放在了我的面前。\n“那么……”\n她看着我，露出了一个……既属于神明又属于凡人的、无比温柔而灿烂的笑容。\n“……我们，来写一个新的故事，好不好？”\n我看着她，看着她那双倒映着我的身影、也倒映着窗外整个崭新世界的、清澈的眼睛。\n我突然，就明白了。\n原来，一个故事最好的结局，从来都不是“幸福地生活在了一起”。\n而是……\n“好啊。”\n我笑着，从她的手中，接过了那本空白的书，翻开了崭新的、属于我们的……第一页。"
PAO.114.a: "§t是可以一起，去书写下一个故事的开始§!"

PAO.115.t: "最后的和解"
PAO.115.d: "圣堂里很暖和。\n我坐在莉莉安娜的身边，看着她。她正捧着那本我为她写的童话书，一页一页，看得入神。她的脸上，带着我从未见过的、宁静而满足的微笑。\n“那个，”我终于，还是鼓起了勇气，轻声开了口，“莉莉安娜……关于索拉娜，还有……你。我很抱歉。”\n我低下头，看着自己那双曾握过剑、也曾沾过血的手。“我胸膛里的那颗心，它吞噬了索拉娜，也囚禁了你的灵魂。我利用了你们所有人的悲伤，才走到了今天。”\n我以为，她会不懂，或者，会因为我提起了那些悲伤的往事而感到难过。\n可她却只是笑了笑。那是一个仿佛能融化整个冬天冰雪的、无比温柔的笑容。\n她合起了书，然后，从她背后拿出了一张被珍藏得很好的、小小的、已经有些泛黄的纸条。\n那张纸条，我认得。\n“你看，”她将纸条，轻轻地，放在了我的手心，“该说对不起的，是我呀。”\n我看着那张纸条。上面，只有那三个，曾让我在无数个夜晚都无法入睡的、娟秀的字迹——“对不起”。\n“可是，”我的声音带着一丝颤抖，“你写下这句话，是因为……你马上就要被心吞噬，没办法再陪着我了，对不对？”\n“嗯。”她点了点头，然后，用一种我从未听过的、带着一丝狡黠和智慧的全新语气，继续说道，“可是，露西莉亚，你有没有想过……一句话的意思，在它被写下时并未完成。只有当它被读懂的那一刻，它的意义才真正诞生。”\n我愣住了。\n“在那个时候，”她说，“我写下的对不起，是告别。那是我作为一个即将消失的、无力的灵魂，留给你最后的歉意。”\n“但是现在，”她伸出手，轻轻地，将我的手，连同那张小小的纸条，一起，包裹在她那双微凉却又无比温暖的手心里。\n“由我，这个完整的、重新坐在这里的莉莉安娜，再一次把它交给你时……”\n“它的意思是——”\n“——‘对不起，让你，独自一人，背负了那么多不属于你的痛苦。\n但是……谢谢你，替我，走完了那条我没能走完的路，看到了我没能看到的风景。现在，那些沉重的东西，都结束了。所以，你也该原谅你自己了，我的……小傻瓜。’”"
PAO.115.a: "§t谢谢你，莉莉安娜§!"

PAO.116.t: "来自童话的回响"
PAO.116.d: "“一份来自南方的密信，被呈上了最高苏维埃的会议桌。它来自那个神秘的、由一个叫做‘露西莉亚’的年轻女孩所领导的新野火政权。\n我们曾以为，那只是一场遥远的、充满了地方民族主义色彩的、与我们无关的童话。可这封信，却让我们所有久经考验的布尔什维克，都陷入了长久的沉默。\n信里说，她在自己导师那里，找到了一首未唱完的、关于我们的歌。她说，她想知道，那颗在歌中闪耀的红星，是否依然明亮。\n她问：‘如果，你们的冬天还很冷，那么，一个南方的同志，能不能，为你们，也送去一捧……虽然微弱，但足够温暖一双手的小小柴火？’\n一位年轻的委员低声说：‘这……太理想主义了。她不懂我们的斗争有多么残酷。’\n总书记走到巨大的世界地图前，看着那片……与我们隔着万水千山的美洲大陆。\n许久，她才缓缓开口，声音里，带着一种历经风霜后的、无比坚定的力量：\n‘同志们，我们讨论了太多关于经济基础和上层建筑的理论。可我们好像忘了，我们最初，之所以能战胜一切，靠的是什么？’\n‘靠的，就是这份……看似天真，看似理想主义，却足以跨越所有理论与疆界的、最纯粹的……同志之爱。’\n‘她不是不懂我们的残酷。’\n‘她只是……在提醒我们，不要在漫长的、冰冷的斗争中，忘记了我们……为何而战。’”"
PAO.116.a: "我们这里也同样温暖"

PAO.117.t: "一个值得被铭记的名字"
PAO.117.d: "在我发出寄往远方同志的信件后，晓枫走进了我的办公室。她将一份新的文件，轻轻地放在了我的桌上。\n那是一份……关于更改我们国家名称的提案。\n“露西莉亚，”她看着我，眼神里带着一种我从未见过的、混杂着郑重与欣慰的温柔，“你已经不再需要‘模仿’我们了。你找到了属于你自己的道路，甚至……比我们当年，看得更远。”\n“‘野火’这个名字，它承载了太多的鲜血、罪责与悔恨。它是一个……属于过去的名字。一个，在黑夜里为了燃尽自己而存在的名字。”\n“而你，”她笑了笑，“你带给这个国家的，是黎明。是那些……我们在最绝望的时候，也未曾敢奢望过的、真正的童话。”\n“所以，是时候，让‘野火’安息了。让这个国家，拥有一个……真正属于你的、能代表‘明天’的名字了。”"
PAO.117.a: "§t那么……就叫它“天问理想乡”吧§!"
PAO.117.b: "§t不，这重量，我必须背负下去§!"

PAO.118.t: "别总背着死人走路"
PAO.118.d: "雪伊踹开我办公室门的时候，我正在看那封寄往远方同志的信的底稿。她看也没看信一眼，就把一把沾着泥土的工兵铲，“哐”的一声，拍在了我的桌上。\n“喂，我说你。”她开门见山，语气还和以前一样冲，“你是不是觉得，顶着‘野火’这个名字，感觉特光荣，特有分量？”\n我愣住了。\n“我告诉你，这名字，一点也不好。”她用手指，重重地敲了敲桌面，“它闻起来，全是血和灰的味道。它压在肩膀上，比他妈的一整座矿山都沉。它只会让你，在做每一个决定的时候，都想着那些……已经死了的人。”\n她拿起那把工兵铲，指向了窗外那片……正在建设中的、充满活力的城市。\n“看看外面。那是你的‘童话’，是你弄出来的东西。跟我们那场……打到最后，什么都没剩下的烂仗，一点关系也没有。”\n“所以，把这个该死的、属于死人的名字，给老娘换了。”\n她把工兵铲，留在了我的桌上。\n“……别总背着我们走路。路，是往前看的。”"
PAO.118.a: "§t那么……就叫它“天问理想乡”吧§!"
PAO.118.b: "§t不，这重量，我必须背负下去§!"

PAO.119.t: "关于道路的答卷"
PAO.119.d: "一份来自南方的正式照会，打破了平静。在经历了漫长的援助与观察之后，那个叫做露西莉亚的遥远同志，终于，向我们递交了她的最终答卷。\n信中，她没有再使用那些充满童话色彩的语言。她的文字变得沉稳、清晰，充满了对历史的深刻洞察，像一位久经考验的理论家。\n她写道：\n“致远方的先驱们：\n我们曾以为，通往理想乡的道路只有一条，那就是追寻你们——第一辆驶出车站的、伟大的红色列车——所留下的光辉轨迹。\n但在我们自己的土地上，我们走过了泥泞的沼泽，攀越了结冰的山脉。我们犯过错，走过弯路，甚至……一度在过去的废墟里迷失了方向。\n现在，我们终于明白了。革命，从来就不是一条被铺设好的铁轨。它更像是一张巨大的、空白的地图。\n你们用钢铁和纪律，在那张地图上，画下了第一条、也是最重要的一条主干线。而我们，以及世界上所有的同志，要做的，是在这条主干线的基础上，根据自己脚下土地的形状，去画出属于我们自己的、通往每一个村庄与田野的、小小的支线。\n最终，这些纵横交错的线路，将连接成一张覆盖整个世界的、通往同一个终点的、宏伟的铁路网。\n如今，我们南方的支线，已经铺设完成。它渴望着，与那条伟大的主干线，正式地，连接在一起。”"
PAO.119.a: "她的答卷无可挑剔。欢迎加入我们的行列，同志"
PAO.119.b: "一条独立的线路，或许能走得更远"

PAO.120.t: "一封信"
PAO.120.d: "今天，我们收到了来自宗主国——[PAO.Getname]的最高指令。\n\n那只是一封……露西莉亚殿下的亲笔信。\n\n信上写道：\n\n“我最亲爱的朋友们：\n\n很抱歉，在过去的战争里，为了让你们能从巨龙的阴影下走出，我曾以宗主之名，为你们提供了暂时的庇护。那是一段……不得已的历史。\n\n现在，巨龙已被驱散，而宗主与附庸这样的词语，本身，就是我最想推翻的那座高塔的砖瓦。\n\n我不想再扮演那个高高在上的“保护者”了。我只是想……邀请你们，来和我一起，共同建造一座更大、更温暖的房子。\n\n在这座新房子里，不再有主人的房间和客人的房间。我们所有的炉火，都将烧着同样的柴薪；我们所有的窗户，都将望向同一个黎明。\n\n所以，回家吧。"
PAO.120.a: "我们……将共同走向那个黎明"
PAO.120.b: "我们的故事，还想自己来书写"
PAO_mqjj2_tt: "如果对方§Y同意§!(§R社会主义§!支持率大于§Y80%§!，则："

PAO.121.t: "醒来"
PAO.121.d: "圣堂里，最后的会议已经结束。同志们都已离去，只剩下我和莉莉安娜，并肩坐在这里，看着窗外那轮真正属于所有人的温暖太阳。\n“莉莉安娜，”我终于还是问出了那个困扰了我此生的最后问题，“我们现在……是在梦里，还是在现实里？”\n她没有直接回答。她只是将她那微凉的手，轻轻覆盖在我的手背上。\n“还记得吗，露西莉亚？”她的声音像一阵来自遥远过去的风，“在你诞生之初，你曾问过我，镜子里的索拉娜到底是谁。”\n我点了点头。\n“那个时候，我骗了你。”她的眼神里带着一丝属于神明的、温柔的狡黠，“我告诉你那只是记忆。其实，不全是。”\n“夜莺之心，就是冥界本身，它永不消亡，只遵循着最古老的规则——吞噬记忆，维持寂静。它本该是任何凡人都无法触及的存在。直到……索拉娜的出现。”"
PAO.121.a: "……"

PAO.122.t: "梦中的希望"
PAO.122.d: "“大多数凡人的灵魂，像温顺的水，最终都会汇入轮回的大海。而她……是一团永不熄灭、也永不满足的火。”\n莉莉安娜的声音轻柔，却带着一种穿越了万年孤寂的颤抖。\n“露西莉亚，你能想象吗？在一个连时间都静止不动的世界里，她是唯一一个……会跳动、会燃烧、会发出噪音的存在。”\n“我爱她，在遇见她之前，我只是夜莺之心的看守者，是冥界冰冷的法则。是她……用她的贪婪、她的野心、甚至她的背叛，第一次刺痛了我，让我感到了痛，也让我第一次……觉得自己是‘活’着的。”\n“这就是为什么，哪怕她偷走了我的心，哪怕她将世界烧成灰烬，我也无法恨她。因为……飞蛾是无法拒绝火焰的，哪怕那火焰会将其吞噬。”\n她抬起头，看着虚空，仿佛那个金发的身影就在那里。\n“而那颗夜莺之心……它其实，和我一样。它在漫长的岁月里，也厌倦了千篇一律的亡者记忆。它渴望那团火，渴望那种名为生命力的剧毒。所以，它才会在索拉娜死后，依然死抓住她不放。它不是在囚禁敌人，它是在……挽留它做过的，最精彩的一个梦。”\n她转过身，那双冰蓝色的眼睛，深深地看着我。\n“它梦到了火焰的热烈，于是索拉娜成为了它的囚徒。”\n“它梦到了失去的悔恨，于是你从我的愿望中诞生。”\n“索拉娜是它的欲望，你是它的良知，而我……是那个一直守在梦境边缘，不愿醒来的做梦人。”\n“但是现在……”\n她笑了。那是一个仿佛融化了所有时空的、无比灿烂的笑容。\n“……它，终于醒了。”\n“因为它发现，它不再需要通过‘做梦’来模仿生命了。通过我们三个人的纠缠、痛苦与重生……它已经在现实里，真正地，拥有了生命。”\n“当梦境中的渴望，都在阳光下变成了触手可及的真实……那么，醒来，才是最幸福的结局。”"
PAO.122.a: "§t那么，早安，我的新世界。§!"

PAO.123.t: "街角的花店"
PAO.123.d: "几天后，我和莉莉安娜走在我们首都最繁华的街道上。这里不再有戏剧，也不再有悲伤，只有属于生活本身的、温暖的喧嚣。\n就在我们路过一个街角的花店时，我突然停住了脚步。\n我看到了她。\n一个很年轻的女孩，大概只有十五六岁的样子。她有着一头阳光般耀眼的金发，被扎成了两簇活泼的、随着她的动作而微微晃动的包子头。她穿着一身朴素的工装围裙，正哼着一首不成调却充满了活力的歌，笨拙地为一捧向日葵修剪着枝叶。\n她好像感觉到了我的视线，抬起头，对我露出了一个像正午的太阳一样、灿烂得有些晃眼的、毫无阴霾的笑容。\n“嘿！同志！要买一束花吗？”她的声音清脆得像风铃一样，“今天的向日葵开得特别好哦！听说是从‘英雄坡’那边新培育的品种呢！”\n我看着她，看着她那双我曾见过无数次的、如今却清澈得仿佛能倒映出整片蓝天的红色眼眸。\n我说不出话来。\n“露西莉亚？”身边的莉莉安娜轻轻地握住了我那只正在微微颤抖的手。\n我回过头，看到莉莉安娜也正微笑着看着那个女孩。\n“是她，对不对？”我在心里无声地问。\n莉莉安娜用那双冰蓝色的眼睛，对我眨了眨眼。\n然后，她拉着我，走进了那间小小的、充满了阳光与花香的店里。\n“好啊。”\n我听到我自己的声音，带着一丝我自己都未曾察觉的、如释重负的颤抖。\n“请给我们，两束。”"
PAO.123.a: "§t（欢迎回来。）§!"
PAO.123.b: "§t（这一次，请为自己，好好地活下去。）§!"

PAO.124.t: "禾苗的果实"
PAO.124.d: "在我们与东方的同志正式结盟不久，她们的使团，为我带来了一份……很特别的礼物。\n一个很旧很旧的、来自某个南方小镇的、民政记录的档案箱。\n使者说，她们的领袖，在听说了我的故事后，特意派人，去无数个被战火焚毁的废墟里，找回了这些早已无人问津的故纸堆。\n我有些不解地，打开了那个落满灰尘的箱子。里面，是一摞摞泛黄的、散发着霉味的户籍册。\n我在她们的指引下，翻了很久很久。直到，我的手指，停在了某一页。在那一页上，我看到了两个……既熟悉，又陌生的、方方正正的汉字。\n旁边，还有一个小小的、早已干涸了的、红色的手印。\n“……这是……？”我的声音，有些颤抖。\n“这是你的名字。”使者轻声说，“我们找到了当年，你母亲为你登记户籍的档案。”\n“她说，那一年，南方的水稻，长得特别好。”\n“她说，你，就是那片丰收的田野里，结出的、最饱满、最漂亮的……果实。”\n……\n我看着那两个字。\n“禾果”。\n我突然，就想起了很久很久以前……那个，在冰冷的船舱里，把自己的名字忘得一干二净的、孤独的“小果子”。\n我以为我早就习惯了那个名字。\n可直到今天，我才知道。\n原来，在世界的另一端，一直，一直，都有一个人，替我，记得我回家的路。\n我伸出手，轻轻地，抚摸着那两个仿佛还带着阳光和稻香的、温暖的字。\n眼泪，不知不觉地，就落了下来。"
PAO.124.a: "§9我……回家了。§!"

PAO.125.t: "多出来的一碗粥"
PAO.125.d: "食堂的钟声响了。我，老伊凡，像往常一样，排着队，等着领今天的午饭。可今天，有点不对劲。\n队伍里，没人说话。所有人都像丢了魂一样，眼神直勾勾地盯着前方。轮到我时，打饭的年轻姑娘，那个平时总爱开玩笑的安德莉娜，面无表情地，往我的餐盘里，舀了两勺粥。\n“安德莉娜，给多了。”我提醒她。\n她没理我。她只是重复着舀粥的动作，给下一个人，下下一个人，都舀了两勺。\n很快，粥桶就见底了。排在后面的人，开始焦躁起来，可她们只是……静静地散开了，仿佛挨饿，是一件天经地义的事。\n我端着那碗多出来的粥，回到了我的工位上。我看到，我的工友，那个昨天还因为一颗螺丝没拧紧而跟我吵了半天的老伙计，今天，却把她省下来的那块黑面包，默默地，放在了一个空着的、属于我们一位牺牲同志的工具箱上。\n没人命令她。也没人赞扬她。\n她就那么做了。\n我们好像突然之间，都变成了书里写的、那种最无私、最纯粹的革命者。我们分享，我们谦让，我们……不再有人再为自己着想。\n可我看着手里这碗冰冷的、多出来的粥。我一点也感觉不到温暖。\n我只感到一种刺骨的寒冷。\n因为，一个连饥饿都不会再为自己说话的工人，她……还算是一个“人”吗？"
PAO.125.a: "（我们正在失去比食物更重要的东西。）"

PAO.126.t: "生锈的奖章"
PAO.126.d: "我是第五生产小组的组长。这个月，我们又一次，超额完成了生产指标。按照惯例，我该去委员会，为我的组员们，申领这个月的劳动奖章。\n可我一步也不想动。\n我打开我的抽屉，里面，已经堆满了那种红色的、印着齿轮和麦穗的奖章。它们冰冷地躺在那里，落满了灰尘，有些甚至……已经开始生锈了。\n上个月，我把奖章发给小彼得的时候，他是我组里最年轻、最拼命的小伙子。他接过奖章，把它随手，扔进了他的工具箱里，然后又转过身，继续拧起了他的螺丝。就好像那不是一枚象征着荣誉的奖章，而是一块碍事的废铁。\n我们还在生产。我们还在劳动。我们还在日复一日地，重复着所有正确的、光荣的流程。\n可我们好像都忘了，都忘了我们为什么要这么做。\n我们不再为了能给家里多换一袋面粉而兴奋，也不再为了能造出一台更先进的机器而自豪。我们只是在劳动。像一群被设定好了程序的、永不停歇的机器。\n我们的领袖，露西莉亚殿下，她不再来工厂视察了。我们也很久，没有再听到过，她那些关于童话和明天的、虽然听不太懂，但总能让人心里一暖的讲话了。\n我们赢得了革命。可现在我们除了革命本身，好像，什么都没有了。"
PAO.126.a: "（我们到底在为谁而劳动？）"

PAO.127.t: "英雄坡"
PAO.127.d: "今天，我去了如今改名为英雄坡的墓地。\n那片曾洒满鲜血的山坡，如今成了一座巨大的露天剧场。成百上千的人聚集在那里，一遍又一遍地，上演着那场……决定了我们命运的最终决战。她们穿着自制的、可笑的盔甲，挥舞着木头削成的剑，嘴里呼喊着那些早已褪色的、神圣的口号。\n她们的表情狂热而幸福。仿佛能在那场早已胜利的战争中，再“牺牲”一次，是某种至高无上的荣耀。\n我站在人群的边缘，看着这一切。我看到一个白发苍苍的老人，拄着拐杖，扮演着冲锋的士兵，然后心满意足地倒在了我的脚下。她的脸上，带着一种……我无法理解的、安详的微笑。\n我明白了。\n我无法叫醒一群，正享受着美梦的人。\n于是，我脱下了象征着我身份的斗篷，将头发挽起，学着记忆中，一位早已逝去的、普通士兵的样子，默默地，加入了这场盛大的、关于死亡的狂欢。\n我扮演冲锋。我扮演牺牲。\n我将自己，变成了一百个、一千个……倒在这片山坡上的、无名的亡魂。\n我用我的表演，将这场混乱的戏剧，引向了它本该有的、那个唯一的、安静的结局。\n最后，当夕阳落下时，我也和其他人一样，精疲力竭地，“死”在了这片被晚霞染红的山坡上。\n周围的人群开始爆发出雷鸣般的掌声。她们在为这场无比“真实”的、伟大的胜利而欢呼。\n我躺在冰冷的地上，闭着眼睛，听着那些为我的“死亡”而响起的喝彩声。\n我突然觉得……\n这一刻，我好像前所未有的，接近了“英雄”这个词的、最真实的内核。"
PAO.127.a: "§t（那就是……被遗忘）§!"

PAO.128.t: "剑与铲"
PAO.128.d: "今天，露西莉亚殿下召集了所有的人，在英雄坡下。我们都以为，这会是一场庆典。可她走上高台时，脸上没有任何笑容。她对着我们，深深地，深深地鞠了一躬。\n整个广场，鸦雀无声。\n“对不起。”她的声音，通过扩音器，传到了每一个人的耳朵里。清晰，而沉重。\n“对不起。因为我的无知，因为我胸膛里那颗曾被我错认为希望的心，让你们在和平的年代里，为一场虚假的戏剧，流了真实的血。”她抬起头，那双红色的眼睛里没有泪水，只有一片燃烧着的、几乎要将她自己也一同焚尽的痛苦与决心。\n“我曾以为，革命的终点，是放下剑，拿起铲。我错了。”\n“我今天才明白！只要这个世界上，还存在着任何一个，可以将人的痛苦‘意义化’、将人的牺牲‘戏剧化’的高墙或王座……”\n“那么，我们用铲子辛辛苦苦建造起来的小小家园，就永远只是一座建立在火山口上的、脆弱的沙堡！”\n她从身后拿起了那两样东西。一把，是依然闪烁着寒光的骑士之剑。另一把，是沾满了我们理想乡泥土的工兵铲。\n她将它们，交叉着，高高举起，像一座崭新的、属于我们所有人的徽记。\n“所以，从今天起！我们的左手，要更紧地握住铲！去为每一个牺牲的同志，修好屋顶，抚养孩子，去创造一个温暖到足以让我们为之献出一切的家！”\n“而我们的右手，要永远，磨亮我们的剑！去指向那些还在用神圣与伟大的名义，奴役着我们远方同志的、最后的高墙！”\n她停顿了一下，然后，从怀中，拿出了一样东西——一张从圣杯王国的报纸上，剪下来的、大大的纸片。\n纸片上，是一个戴着礼帽、穿着体面西装的绅士，正微笑着，将一枚亮闪闪的、我们根本不认识的硬币，抛给一个跪在他脚边、衣衫褴褛、眼神空洞的异国孩童。标题写着：《帝国的慈悲：为蒙昧的角落带去文明的福音》。\n“听啊！”她的声音夹杂着一种撕心裂肺的、颤抖的呼唤。\n“你们听到了吗？！在那张薄薄的、沾满了油墨香气的纸片后面！我听到了无数个我们，正在哭泣！”\n“她们的名字，被商品所取代！她们的故事，被利润所淹没！”\n“她们的眼泪，被伪善的‘慈悲’，折算成了一枚……可以被随意施舍的、冰冷的硬币！”\n“她们的镣铐，被华丽的秩序，伪装成了……一个无法被打破的、名为市场的、无形的囚笼！”\n“她们，正在经历着我们曾经经历过的所有绝望！她们，正在重复着我们早已挣脱的所有噩梦！”\n“скажите мне, товарищи! (告诉我，同志们！)”\n她突然，用一句我们从未听过的、却仿佛能听懂每一个音节的、来自遥远北方的语言，向我们嘶吼道。\n“我们……能假装听不见吗？！”"
PAO.128.a: "我们怎能假装听不见！"

PAO.129.t: "书页上的泪痕"
PAO.129.d: "在向那颗心发起最后挑战的前夜，我再一次，翻开了那本我为莉莉安娜写下的童话书。这是我最后的慰藉，也是我……最后的迷茫。\n我不知道，我记忆中那个温柔的公主，到底是我真实的寄托，还是……只是那个怪物为了束缚我而制造的、最完美的幻影。\n我一页一页地翻着，指尖划过那些……我曾为她描绘的、关于花朵与星辰的句子。\n突然，我的手指停住了。\n在书页的一角，我发现了一滴……早已干涸的、淡淡的水渍。它让那里的纸张，微微起皱。\n那不是我的眼泪。\n我从未……在这本书上哭过。\n我将那一页，凑到月光下，仔细地看着。我突然就想起了。我想起了，很久很久以前，在我为她讲完一个特别悲伤的故事后，她曾靠在我的身边，沉默了很久很久。\n当时，我以为她睡着了。\n现在我才明白。\n原来……\n原来，那个我曾以为是“幻影”的、脆弱的公主……\n她，也曾为了我书里的故事，悄悄地，流过一滴……真实的眼泪啊。\n我的心，或许可以模仿一切。但它……能模仿出一滴，不属于它自己的、为他人而流的眼泪吗？"
PAO.129.a: "§t或许……有什么东西，是我弄错了。§!"

PAO.130.t: "唯一的观众"
PAO.130.d: "圣堂里很安静。我和莉莉安娜并肩坐着，她在看我写一本关于未来的崭新计划书。\n“索拉娜，”我忽然轻声说出了那个名字，“她曾说，这一切都只是一场独角戏。”\n莉莉安娜翻动书页的手停顿了一下。她抬起头，那双曾经总是笼罩着迷雾的眼睛，此刻却像雨后的湖水一样清澈。\n“露西莉亚，你是不是在想……”她轻声说，声音像羽毛一样落在我的心上，“……那个曾经只会任性地哭闹、什么都不懂的笨拙公主，为什么现在……能读懂这些悲伤的谜题了？”\n我愣了一下，诚实地点了点头。\n“因为啊，”她伸出手指，眷恋地抚摸着那本童话书的书脊，“在那段漫长的日子里，我被迫从那个被聚光灯刺得睁不开眼的主角位置上退了下来。我变成了一个……躲在黑暗台下的、无声的‘读者’。”\n“只有走下舞台，才能看清剧院的全貌。在那些寂静的时刻，我看着你挣扎，也看着……那个一直藏在你影子里、和我一样孤独的灵魂。”\n她转过头看着我，目光里带着无限的怜惜：\n“所以我看到了。在那场她所谓的‘独角戏’里，其实一直坐着两个观众。”\n“一个是索拉娜。她在镜子的那一端，用悔恨的目光，审视着她曾犯下的错误。”\n“另一个……就是我。我在童话书的夹缝里，用祈祷的目光，守望着未来。”\n“既然有两个观众，又怎么会是独角戏呢？”\n她顿了顿，语气变得有些沉重。\n“只是……那个搭建舞台的心，它太饿了。它不满足于平淡的幸福，它渴望的是撕心裂肺的痛楚和荡气回肠的毁灭。”\n“你想过吗？为什么索拉娜会那么极端？为什么她明明已经拥有了我的爱，却还要亲手毁掉一切？为什么她总是做出那些……连她自己都无法回头的、疯狂的决定？”\n“因为……她是心选中的最完美的悲剧演员啊。”\n“心看中了她灵魂里那团永不满足的火焰。于是，它在暗中不断地在那团火上浇油。它将她的‘野心’放大成‘贪婪’，将她的‘不安’扭曲成‘残暴’。”\n“它诱导着索拉娜，让她以为自己在追求至高的权力，实际上……她只是在按照那个贪婪的‘导演’的意愿，一步步走向那个滋味最浓烈、也最绝望的结局。”\n“她以为她是叛逆的火焰，其实……她只是被‘心’用来烹饪这场绝望盛宴的……薪柴。”\n莉莉安娜轻轻叹了口气，握住了我的手。\n“所以，当她为你鼓掌时，那不是为了别的。只是因为……她终于看到，有一个演员，跳出了那个‘越挣扎、越美味’的死循环，真的……把那个吃人的舞台，给砸碎了。”"
PAO.130.a: "§t原来……我们都曾是它的囚徒§!"

PAO.131.t: "一张多出来的票根"
PAO.131.d: "伊万大叔最近很苦恼。作为我们工人新村的粮食分配员，他发现了一件怪事。\n我们村里，住着一位在上次“镇魂之战”中牺牲的游击队员的母亲。一位很安静、也很固执的老太太。她从不与人交流，也拒绝了委员会所有的额外抚恤。每天，她都只是沉默地，像所有人一样，排队领取那一份不多不少的口粮。\n可这个月，伊万大叔在月底核对粮票时，发现老太太的票根，总是会多出来一张。\n这意味着，她每天，都在只吃一半的口粮。她把另一半，省了下来。\n伊万大叔以为她是想攒下来做什么。可他悄悄观察了很久，发现老太太只是把省下来的粮食，都整整齐齐地，堆在了家里一个空着的房间里，任由它们……落满灰尘。\n这件事，很快就在我们工人新村里传开了。大家都很担心，也很不解。有人说，她是不是……思念女儿，精神出了问题？也有人说，她是不是……对我们的分配制度，有什么不满？\n直到昨天，谜底才解开。\n昨天，是我们的第一批“志愿垦荒团”出发的日子。那些要去最偏远、最贫瘠的土地上，开垦新家园的年轻人，都聚集在村口的广场上，和家人告别。\n就在这时，那位一直沉默着的老太太，拄着拐杖，慢慢地，从人群中走了出来。她背着一个……比她自己还要高大的、鼓鼓囊囊的麻布袋。\n她走到垦荒团的队长，一个只有二十岁出头的、脸上还带着雀斑的小伙子面前，将那个沉重的麻袋，放在了他的脚下。\n“……带上。”老太太开口了，声音沙哑，却是她来到我们村后，说的第一句话。\n小伙子愣住了。“奶奶，我们……我们有配给的，您……”\n“……外面冷。”老太太打断了他，她伸出那双布满皱纹的手，轻轻地，为小伙子，理了理有些歪掉的衣领。“……要吃饱了，才有力气……想家。”\n然后，她就转过身，又像往常一样，沉默地，走回了人群里。\n伊万大叔看着那一麻袋……老太太用一个月的饥饿，为一群素不相识的孩子们，攒下来的路粮。\n他突然，就明白了。\n他什么也没说。只是在今天早上，当老太太又来领口粮时，伊万大叔，像往常一样，给了她一份。然后，又在所有人的注视下，将另一份，不多不少，完完整整的口粮，也轻轻地，放在了她的餐盘里。\n“奶奶，”伊万大叔笑着，露出了他那口被烟草熏黄的牙齿，\n“……家里，有孩子在等着您吃饭呢。”"
PAO.131.a: "（一个……也没有少。）"

PAO.132.t: "我们的名字"
PAO.132.d: "§2阿守§!：今天，我们来到了一个新的地方。这里没有水晶花园，也没有彩色的玻璃窗。只有……很多很多，和我们一样，不会说话的、冰冷的石头房子。\n§0小花§!：是呀是呀！而且，这里的人，她们看我们的眼神，好奇怪哦。不像家里的人那样，会对着我们笑。她们……好像，有点害怕我们。\n§2阿守§!：因为，我们是怪物。\n§0小花§!：怪物？为什么呀？我们只是……长得和她们有点不太一样而已呀。\n§2阿守§!：……\n§0小花§!：今天，有一个很小很小的人类孩子，不小心摔倒在了我的面前。我只是，想像露西莉亚殿下教我的那样，伸出手，去扶她一下。可她的妈妈，却尖叫着，把她，从我面前抢走了。还对我，扔了一块小石头。\n§2阿守§!：……石头，不疼。\n§0小花§!：我知道不疼。可是……可是我的心，就是那个……殿下说，我们每个人都有的、看不见的地方……它，好像，有点……凉凉的。\n§2阿守§!：……\n§0小花§!：阿守，你说……我们，为什么要来到这里呀？殿下说，我们是来解放她们的。可是……她们好像，一点也不喜欢我们呀。\n§2阿守§!：……我不知道。我只知道，殿下说，要我们，守在这里。守着这座……刚刚停止了哭泣的城市。\n§0小花§!：……嗯。\n（……第二天清晨……）\n§0小花§!：阿守！阿守！你快看！\n§2阿守§!：……嗯？\n§0小花§!：你看！昨天那个，对我扔石头的妈妈……她，她带着她的孩子，在我们的营地门口，放了一样东西！\n§2阿守§!：……一朵花。\n§0小花§!：是一朵……小小的、黄色的、会朝着太阳开的野花！而且……而且你看！花朵下面那张纸上，还用歪歪扭扭的字，写了两个……我们的名字耶！\n§2阿守§!：……阿守。小花。\n§0小花§!：嘻嘻……她，她好像，终于知道，我们不叫“怪物”啦！"
PAO.132.a: "“解放”，就是被记住了名字。"

PAO.133.t: "溢出的餐盘"
PAO.133.d: "今晚的工人新村食堂，炖肉的香气浓郁得化不开。大锅里，切得大块的土豆和牛肉堆得像小山一样。但空气却有些沉闷，露西莉亚殿下的‘最终宣言’刚结束，大家看着面前丰盛的晚餐，却迟迟没人动勺子。\n“……一定要去吗？”那个刚从前线退下来的、断了右臂的老兵，看着自己面前冒着热气的白米饭，声音有些低沉，“我们好不容易才过上安稳日子，圣杯王国离我们那么远……去帮她们，对我们到底有什么好处？万一为了帮别人，把咱们自己的家又打烂了怎么办？”\n他的话让不少人默默点头。是啊，在这个刚刚温暖起来的家里守着炉火，不好吗？\n一阵拐杖声打破了沉默。那位头发花白、被我们尊称为“英雄母亲”的老太太，慢慢走了过来。她端着自己那份饭菜，径直来到了那个断臂老兵面前。她拿起勺子，将自己盘子里大半的牛肉和土豆，轻轻地，拨到了老兵的碗里，堆得冒了尖，汤汁都溢了出来。\n“大娘，这……我不饿，您吃……”老兵慌忙想推辞。\n“拿着。”老太太的声音很轻，很温柔，像是在哄自己的孙子，“你只有一只手了，得多吃点，才有力气。”\n她伸出粗糙的手，轻轻抚摸着老兵空荡荡的袖管，眼底涌起一层泪光，但眼神却无比清醒：\n“孩子，你问有什么好处？大娘是个粗人，不懂大道理。但我知道，要是这世界上只剩下咱们这一户人家有饭吃，那咱们这顿饭，能吃得安稳吗？”\n她指了指窗外漆黑的夜空，那是圣杯王国的方向。\n“如果不去帮她们，那个叫圣杯的‘大财主’就会一直把人当牲口使唤。它会越来越胖，咱们会越来越孤单。等到哪天它把那边的人都吃光了，转过头来盯着咱们这块肥肉的时候，谁来帮咱们？”\n“去帮她们，就是给咱们自己找‘帮手’，找‘亲戚’。”\n“你想想，要是那边的人也站起来了，也过上了好日子。那咱们再出门，是不是就多了个能讨口水喝的朋友？咱们种出来的粮食，是不是就多了个能交换种子的人？”\n“把咱们手里这把多出来的勺子送过去，不是白送。”\n她看着老兵，目光柔和却坚定：\n“是用这把勺子，换回一群能跟咱们背靠背的兄弟姐妹。是为了让这个世界上，再也没有能随便欺负咱们的‘财主’。”\n“只有把周围的狼都赶跑了，把墙外的荒地都变成了朋友的良田，咱们手里的这碗饭，才算是真正端稳了啊。”\n老兵怔怔地看着那堆得满溢出来的食物，又看了看老太太那张慈祥却充满智慧的脸。他突然明白了，这不仅仅是慈悲，更是生存的智慧。\n他大口大口地吞咽起来，眼泪混着肉汤一起下肚。\n“……嗯！我吃！”他含着泪，用力地点头，“吃饱了……咱们去给自己找兄弟！”\n食堂里，咀嚼的声音渐渐响了起来。那不再是单纯的进食，那是一种……为了从根本上改变这个世界，为了让自己永远不再孤单的、充满力量的承诺。"
PAO.133.a: "为了所有人的、热气腾腾的明天！"

PAO.134.t: "英雄的代价"
PAO.134.d: "今天的工人委员会，气氛异常凝重。议题只有一个：如何评定那些与我们并肩作战的魔法少女们的劳动贡献，以及她们在战后新社会中的位置。\n“她们是英雄！是同志！”一位在巷战中失去亲人的年轻女工，第一个站了起来，情绪激动，“在镇魂之战里，是她们用身体，为我们挡住了最恐怖的攻击！我们应该给予她们最高的荣誉和最好的生活保障！”\n“我同意她们是英雄。”一位经验丰富的老工会主席，却皱起了眉头，“但同志，你想过没有。她们的力量，从何而来？我们流汗，可以造出机器；我们流血，可以保卫家园。可她们……她们只是许下一个愿望，就能获得神明般的力量。这……公平吗？”\n他的话，让整个会场都安静了下来。\n“我们正在建设的，是一个按劳分配的、平等的社会。”老主席的声音很沉重，“可她们的存在，本身，就是一种不平等。她们是天生的“超人”，是行走在凡人中的“神”。我们今天，可以将她们奉为英雄。可明天呢？后天呢？当和平到来，当不再需要她们去战斗时，我们与她们之间，会不会……重新出现一道，看不见的、名为力量的阶级鸿沟？”\n“那我们该怎么办？！”年轻女工反驳道，“难道要把她们当成危险的武器，限制起来吗？她们为我们流过血！”\n“我不知道。”老主席痛苦地摇了摇头，“我只知道，一个健康的社会，它的屋顶，必须由千千万万普通人的肩膀共同扛起，而不是……依赖于几个善良的“神明”的恩赐。因为，神明，是会离开的。而我们，必须学会，如何自己站立。”\n所有人都陷入了沉默。\n我们爱她们，我们感激她们。可我们也……本能地，畏惧着那份，我们永远也无法理解的力量。\n就在这时，一个一直坐在角落里旁听的、很害羞的魔法少女，突然，小声地开了口。\n“那个，”她的声音，像蚊子一样细小，“我们，也不是……什么都不用付出的。”\n“每用一次魔法，我们的心，就会……变脏一点点。”\n“等到……等到它，变得和煤炭一样黑的时候……”\n她没有再说下去。\n可我们所有的人，都从她那双……强忍着泪水的、漂亮的眼睛里，读懂了那个……她没有说出口的、比任何一场战争，都更残酷的结局。"
PAO.134.a: "她们也是在燃烧自己，只是，我们看不见那火焰"

PAO.135.t: "公主的疑问"
PAO.135.d: "今天，莉莉安娜来到了我们正在建设中的、新的中央公园工地。这里热火朝天，同志们一边唱着歌，一边搬运着砖石。到处都充满了劳动的喜悦。\n她就静静地站在一旁，像一个误入了凡人工地的精灵，好奇地看着这一切。许久，她走到一位正在休息的老石匠身边。\n老石匠认出了她，有些拘谨地站了起来。“公主殿下。”\n莉莉安娜摇了摇头，示意他坐下。然后，她指了指远处那座……正在被工人们一点点建造起来的、漂亮的喷泉，用一种非常认真的、孩子气的语气，问出了一个让所有听到的人都愣住的问题。\n“……请问，”她说，“……你们建造那座喷泉，是为了……换取什么东西吗？”\n老石匠愣住了。“换取……什么？”\n“嗯。”莉莉安娜点了点头，那双冰蓝色的眼睛里，充满了纯粹的困惑，“就像……我以前在童话书里看到的，勇者打败了巨龙，就能获得公主的爱；农民种出了最好的麦子，就能换取过冬的粮食。”\n“……你们这么辛苦地，把这些冰冷的石头，变成这么漂亮的东西。那……你们完成之后，会得到什么‘报酬’呢？是更多的面包？还是……一枚闪闪发光的奖章？”\n老石匠看着眼前这位……仿佛来自另一个世界的、纯净的公主，又看了看远处那座……已经初具雏形的、属于他们所有人的喷泉，和他身边那些……虽然满身汗水，但脸上却带着笑容的同志们。\n他突然，就笑了。那是一种，发自内心的、无比自豪的笑容。\n他拿起身边那把，已经跟随了他一辈子的、磨得光滑的石锤，轻轻地，敲了敲自己脚下的土地。\n“公主殿下，”他说，声音里，带着一种历经风霜后的、朴素的智慧，“……我们的报酬，不是在‘完成之后’才得到的。”\n“……它就在这里。”\n他指了指自己胸口。\n“……在我们，将第一块石头，亲手，安放在属于我们自己的土地上时。”\n“……在我们，看到身边的人，正和我们一起，为了同一个目标而流着同样的汗水时。”\n“……在我们，一想到我们的孩子，明天，就能在这座喷泉下，开心地玩水时……“\n“……我们的‘报酬’，就已经，拿到啦。”"
PAO.135.a: "劳动本身，就是最好的报酬"

PAO.111.t: "一份来自永夜的“请求”"
PAO.111.d: "今日，一份极不寻常的外交信函，被送到了我们的面前。\n它来自那个一直以来，都与世隔绝的、神秘的国度——夜莺之国。\n信使是一个沉默得如同雕像般的、身着华丽盔甲的亡灵骑士。她将信笺和那朵诡异的黑百合放下后，便化作一缕青烟，消散在了空气之中。\n信的内容，与其说是外交辞令，不如说……是一段来自古老童话的、轻柔的呓语。\n信上写着：\n“致此地此刻的看管者：\n我的姐妹，在你们那里，遗失了一件……她心爱的玩具。那是一座名叫‘莉兰迪亚’的城市。\n她现在，很想念它。\n所以，请你们，把它还给我们，好吗？\n我已为你们，准备好了答谢的礼物——那将是，一个永远不会有纷扰的、安安静静的美梦。\n请尽快，做出你们的选择。\n因为……我的姐妹，她，已经没有多少耐心，再等下去了。”"
PAO.111.a: "这是赤裸裸的威胁！"
PAO.111.b: "我们……无法与这样的存在为敌。"

PAO.112.t: "[FROM.GetName]拒绝了我们"
PAO.112.d: "“那些凡人……拒绝了我的‘请求’。\n她们不懂。那座吵闹的，沐浴在阳光下的城市对她们而言，或许是所谓的‘战略要地’，是‘经济中心’。\n可对我而言……那只是，一件能让她……重新露出笑容的、小小的玩具。\n既然她们不肯还给我...”"
PAO.112.a: "§R那我只好自己去拿了§!"

PAO.222.t: "来自骑士的通告"
PAO.222.d: "我们从未收到过这样一份“外交文件”。\n它来自那个刚刚在南美大陆崛起的神秘王国[PAO.Getname]。信使是一个沉默得像一座优雅雕像的“夜莺魂灵”。\n信的内容更是让我们哭笑不得。\n信中那个被称为“守护骑士”的年轻女王露西莉亚，用一种近乎天真的彬彬有礼的语气，“通知”我们，归还那片在上次大陆混战中被我们趁机占领的、属于莉兰迪亚王国的土地。\n信里没有任何威胁的言辞也没有任何关于战争的暗示。\n她只是用一种像是在讲述童话故事般的无比认真的语气，在信的结尾写了这样一段话：\n“那片土地是属于那里的人民的家园，就像我也有我自己的家园一样。”\n“在我的故事书里‘骑士’是不会去抢占别人的家的。‘国王’也不会。”\n“所以拜托了。请把不属于你们的东西还给它真正的主人好不好？”\n“因为让别人因为自己而变得无家可归，那是‘坏蛋’才会做的事情呀。”\n我们看着这封充满了孩子气的却又带着一种让人无法反驳的纯粹的“正义感”的信。\n一时间竟不知道该如何回复。"
PAO.222.a: "一个连“弱肉强食”都不懂的小丫头，也配来教我们做事？"
PAO.222.b: "她的“天真”，或许，比任何军队都更具威胁。"

PAO.223.t: "[FROM.GetName]拒绝了我们"
PAO.223.d: "她们……拒绝了。\n那个国家的回复，充满了傲慢的嘲讽。\n她们说，正义，只存在于强者的剑锋之上。\n她们说，家园，只是弱者无能的哀嚎。\n她们说，我的童话，是这个世界上，最可笑的东西。\n我把那封回信，读了三遍。\n然后，我把它，放进了壁炉里，看着它，慢慢地，变成了一堆黑色的灰烬。\n我没有哭，也没有……像索拉娜的记忆里那样，暴跳如雷。\n我只是，觉得有点……难过。\n也……很失望。\n原来……这个世界上，真的，有那种……听不懂“道理”的、坏掉的大人啊。\n我走到了那幅巨大的地图前，找到了那个……拒绝了我的国家的、小小的位置。\n然后，我拔出了我的剑。\n我对着那个，小小的、却又无比碍眼的名字，轻轻地，划下了一道……代表着“挑战”的、红色的印记。\n我召集了莉莉安娜留给我的、所有最勇敢的“夜莺”骑士们。\n我告诉她们：\n“很抱歉，各位。”\n“看来……在讲下一个童话故事之前，我们，得先去……打倒一个，不爱听故事的坏蛋了。”"
PAO.223.a: "§R骑士的法则，不容玷污§!"

PAO.333.t: "一封画着太阳的信"
PAO.333.d: "今天，我们收到了一封很特别的信。它来自南美洲那个被称为[PAO.Getname]的年轻政权，信是她们的领袖，露西莉亚亲手写的。\n\n信上没写太多复杂的话，倒像是在跟一个许久未见的朋友聊天。\n\n“你好呀，远方的朋友们！\n\n我不知道你们那里，天黑之后会不会冷，也不知道你们的故事书里，有没有吃人的坏蛋。\n\n我只知道，一个人走路，真的有点孤单。特别是在晚上，就算手里举着火把，也还是会害怕影子。\n\n所以呀，我在想，我们能不能……把我们的火把，凑到一起呢？\n\n这样，光就会变得很亮很亮，影子就会被照得跑掉啦！而且，我们还可以围在一起，给彼此讲讲自己的故事，分享最好吃的点心！\n\n那么……你们愿意，加入我们吗？”\n\n信的最后，她画了一个大大的、有点歪扭的太阳，还在旁边，画了两个手拉着手的小人。"
PAO.333.a: "嗯！我们一起走吧！"
PAO.333.b: "谢谢你，但我们想自己试试看"

PAO.888.t: "要为[PAO.GetName]召集骇人部队助她们赢下胜利吗？"
PAO.888.d: ""
PAO.888.a: "§1为了公主殿下！§!"
PAO.888.b: "§R哼！我不要！§!"

##新闻事件##
PAO_news_event_background: "£PAO_news"
PAO_news.1.t:"$news_event_background$熄灭的野火"
PAO_news.1.d:"战争结束了。\n那支曾点燃了整个南美大陆的[LHS.GetName]，她们的故事，在今天迎来了最后的结局。\n在莉兰迪亚城的最终决战中，夜莺之国的亡灵军团，以一种无可阻挡的、沉默的伟力，彻底击溃了革命军最后的抵抗。\n据报道，在战斗的最后时刻，夜莺之国的两位神秘统治者——公主莉莉安娜与归来的女王索拉娜，并肩出现在了战场之上。她们所过之处，所有的抵抗都化为了寂静。\n随着莉兰迪亚城的陷落，这颗曾在世界舞台上闪耀过的红色新星，彻底陨落了。野火……熄灭了。整个南美，都在这突如其来的、绝对的寂静面前，陷入了长久的沉默。"
PAO_news.1.a:"……一个时代，结束了"
PAO_news.2.t:"$news_event_background$最终的审判"
PAO_news.2.d:"世界，正注视着一场前所未有的、怪诞的战争。\n昨日，那个刚刚平息了内乱的莉兰迪亚，再次爆发了冲突。但这一次，不再是女王对人民的镇压。\n而是……女王，邀请了所有的人民，来审判她自己。\n据报道，女王索拉娜遣散了所有忠于她的禁卫队，独自一人，固守在王宫之中。而她的“共治者”，那位神秘的亡灵公主莉莉安娜，则站在了起义军的一方，亲自领导着那些……曾被索拉娜压迫过的人们，向着那座空无一人的城堡，发起了最后的、名为“审判”的进攻。\n这不像是一场战争。\n更像是一场……早已写好了结局的、漫长的、公开的处刑。\n整个大陆，都陷入了一种诡异的寂静之中。所有人都想知道，这场由暴君亲手导演的、献给自己的葬礼，将如何落幕。"
PAO_news.2.a:"她，到底想做什么？"
PAO_news.2.b:"索拉娜..."

PAO_news.3.t:"$news_event_background$一位骑士的远征"
PAO_news.3.d:"今日，一个出乎所有人意料的消息，从南美大陆那片刚刚恢复平静的土地上传来。\n莉兰迪亚的新领导者，那位传说中的“守护骑士”露西莉亚，在她的加冕典礼上，并未宣布任何关于和平或重建的法令。\n她宣布了一场……战争。\n她向盘踞在大陆上的所有残余势力同时宣战。\n在黎明的晨光下，她对着整个大陆，发表了她那篇……完全不像战前宣言的、“童话”般的演说：\n“我听到了！我听到了远方的哭声！\n在森林里，有被锁链捆住的兄弟姐妹；在山谷里，有被饥饿折磨的无辜人民！\n童话书里说，当公主听到哭声时，骑士就应该出发！去寻找那些……制造眼泪的‘坏巨龙’！\n所以，我要出发了！\n我，莉兰迪亚的骑士，人民的守护骑士，露西莉亚！将与我最勇敢的朋友——魔法少女们一起！去打倒所有让大家不开心的大坏蛋！\n请所有还在哭泣的人，不要害怕！\n因为，你们的骑士，已经，在路上了！”\n……\n整个世界，都因为这篇……充满了天真与热忱的宣言，而陷入了长久的、复杂的沉默。"
PAO_news.3.a:"这到底是……天真，还是疯狂？"
PAO_news.3.b:"骑士踏上了她们的旅途"

PAO_news.4.t:"$news_event_background$骑士，北上！"
PAO_news.4.d:"世界，再次将目光，投向了美洲南方。\n那个由亡灵公主与骑士共同建立的、神秘的王国莉兰迪亚，在沉寂了数月之后，于今日，向整个美洲大陆，发出了她们的声音。\n她们的领导者，那位被称为“守护骑士”的露西莉亚，在魔法少女的支持下，宣布开启一场史无前例的“北方远征”。\n她们的宣言，充满了童话般的色彩。她们宣称，此行的目的，既非为了征服土地，也非为了传播信仰。她们只是，要去“拜访”那些，被“巨龙”所盘踞的国度，要去为那些，还在“旧日阴影”下生活的人们，带去新的“故事”。\n无人知晓，这支由亡灵、人类与魔法少女组成的、奇特的联军，将为那片早已习惯了自身秩序的北方大陆，带去怎样的改变。\n但所有人都知道，一场源于最纯粹理想主义的风暴，已经起航。"
PAO_news.4.a:"一个疯子……带着另一群疯子，出发了"
PAO_news.4.b:"童话的结局，由我来写"
PAO_news.4.c:"笨蛋。别想一个人逞英雄"

PAO_news.5.t:"$news_event_background$来自冥界的“邀请”"
PAO_news.5.d:"在长久的、令人不安的沉默之后，南美大陆的局势，终于迎来了最终的摊牌。\n今日，那个神秘的、由亡灵公主莉莉安娜统治的国度，向她们的邻人——[LHS.GetName]，发出了一份……与其说是战书，不如说是一份……华丽而诡异的“邀请函”。\n她们的宣言以一种……无法被理解的方式，直接回响在每一个生者的脑海里。\n那是一个轻柔的、少女般的、却又带着万年孤寂的声音：\n“……致所有，还在外面吵闹的孩子们。”\n“……表演，马上就要开始了。”\n“……我和我的索拉娜，已经为你们，准备好了最好的席位。”\n“……请不要迟到哦。”\n“……因为，这将会是你们……能看到的、最后一场，也是最盛大的一场……演出了。”\n整个世界，都因为这份……充满了梦幻色彩，却又蕴含着极致杀意的宣言，而陷入了彻骨的寒意之中。一场生者与死者的最终决战，已无可避免。"
PAO_news.5.a:"寂静的国度，终于，露出了它的獠牙"

PAO_news.6.t:"$news_event_background$审判已至"
PAO_news.6.d:"今日，自内部纷争平息、获得统一以来，一直保持着和平与孤立的美洲大陆，第一次，以一个统一的、不容置疑的声音，向“旧世界”，发出了她们的最后通牒。\n以黑贞德领导的[NFA.Getname]为首，囊括了[PAO.Getname]、[MGU.Getname]等所有美洲国家在内的“美洲裁决阵线”，宣布开启一场史无前例的“东方远征”。\n她们的联合宣言，通过所有频率的电波，送到了旧世界每一个国家的耳中：\n“致所有，还在被腐朽的王冠与破碎的信仰所奴役的人们：”\n“致所有，还在用同胞的鲜血，去浇灌自己野心花园的暴君们：”\n“我们，来了。”\n“我们跨越海洋，并非为了征服或掠夺。我们只是，来为这场……已经持续了太久太久的、充满了痛苦与悲鸣的戏剧，写上一个，最后的结局。”\n“从今天起，旧的神明，当归于沉寂。”\n“新的秩序，将从灰烬中，诞生。”\n随着这份宣言的发出，一支规模空前的、由美洲的钢铁与魔法所共同组成的联合舰队，已经起航。她们的目标，直指那片……纷争了千年的、古老的土地。\n一场……美洲对旧世界的、不可避免的“审判”之战，已经打响。"
PAO_news.6.a:"美洲……要来清算旧世界了吗？"
PAO_news.6.b:"为彼此的理想放声歌唱！"

PAO_news.7.t:"$news_event_background$无法拒绝的挑战书"
PAO_news.7.d:"南美大陆的和平，被一份来自[PAO.Getname]的、突如其来的宣言，彻底打破了。\n今日，那个神秘国度的守护骑士露西莉亚，通过公共频道，向[LHS.Getname]，发出了她第一次，也是最后一次，公开的挑战。\n她的宣言，简短，而充满了古典骑士般的、不容置疑的威严。\n“致莉兰迪亚的‘野火’：”\n“我承认你们的火焰，拥有改变世界的力量。”\n“但在这片大陆上，还残留着一个……属于旧时代的、最后的影子。”\n“我，作为索拉娜所有遗产的继承者，也作为这片土地最后的‘守护者’，在此，向你们，发起一场决定这片大陆最终命运的、神圣的决斗。”\n“来吧，英雄们。向我证明，你们的‘正义’，比我所守护的‘秩序’，更值得……被托付未来。”\n“我，夜莺之国的心脏，在此等待着你们的剑。”\n这份宣言，与其说是“邀请”，不如说是一道……无法被拒绝的战书。它将[LHS.Getname]，置于了一个不得不战的境地。接受挑战，是英雄的宿命；而拒绝，则意味着对自身“正义性”的否定。\n一场……赌上两个国度所有未来的、骑士与英雄之间的最终对决，即将上演。"
PAO_news.7.a:"将历史写成一首悲壮的诗"

PAO_news.8.t:"$news_event_background$一本童话"
PAO_news.8.d:"今天，南美大陆上所有的旧日君王与被视为还在迷途之中的少女，都收到了一封没有署名的战书。\n战书上没有文字。\n只有一张被撕下的、空白的童话书最后一页。\n那曾是一个相信拥抱能感化巨龙的骑士，她为自己和公主写下了无数个幸福的结局。\n直到她遇见了一群在灰烬里歌唱的人。\n那些人教会了她，有些故事，必须用火焰才能写下结局。\n那些人教会了她，胜利者的桂冠，远不如幸存者墓前的一束向日葵沉重。\n那些人教会了她，一个数字可以是一条生命，一本笔记可以是一座丰碑。\n现在，骑士撕去了她所有天真的故事。\n她继承了那群人的名字——“野火”。\n她背负起那群人的重量——所有逝去与幸存的魂灵。\n她拔出了剑，为了让这片大陆上，再也不会有孩子需要从一本被鲜血浸透的史诗里，去学习什么是希望。\n今日，南美革命的号角已经吹响。\n那张空白的最后一页，正等待着所有被压迫的人民，用自己的手，去写下名字。"
PAO_news.8.a:"这一次，童话将由人民自己来书写"

PAO_news.9.t: "$news_event_background$弑神者的独白"

PAO_news.9.d: "世界再次将目光投向了南方。但这一次，传来的不是革命的号角，而是一场……最诡异、也最悲壮的内战宣言。\n“野火革命军”的领袖露西莉亚，向她自己的故土，那片神秘的夜莺之国，宣战了。\n在战前，她通过公共频道，向全世界，发表了一段更像是个人独白的演说：\n“致世界，致所有我曾模仿过的英雄，致所有我曾许诺过未来的同志们：\n请原谅我接下来的行动。这不是背叛，也不是疯狂。\n我曾以为，我们最大的敌人，是王冠，是锁链，是所有压迫人民的‘巨龙’。我错了。我们真正的、也是最后的敌人，是‘故事’本身。\n有一个古老的、饥饿的‘神明’，它以英雄的史诗为食，以人民的悲欢为养料。它曾寄居于我的体内，将我的国家变成一座巨大的剧场，逼迫我的人民，上演着永不落幕的悲喜剧。\n现在，我已将它驱逐。但它回到了它的巢穴，将我的整个故乡，都变成了它那疯狂欲望的延伸。\n我，露西莉亚，这个由它亲手塑造的、最完美的‘赝品’，将要回到我诞生的地方，去弑杀我的‘造物主’。\n我不知道凡人的剑，能否伤及神明。我也不知道，在这场战争之后，我是否还能存在。\n我只知道，在所有伟大的故事都被它吞噬殆尽之前，必须有人，为这场盛宴，写下一个……最煞风景的、沉默的句号。”"
PAO_news.9.a: "一场……赝品对真身的战争"

PAO_news.10.t: "$news_event_background$最终的问答"

PAO_news.10.d: "世界，正聆听着一场最后的、跨越时空的对话。舞台的一边，是古老的、象征着“此世一切之善”的圣杯；另一边，是那个来自新大陆的、年轻的革命者。\n\n圣杯：“孩子，为何要拒绝我的恩赐？我承载了人类千年所有的愿望与荣光。我建立了秩序，传播了文明，为这混沌的世界，定义了‘正确’的形状。是的，这个过程伴随着必要的牺牲——那些落后的、蒙昧的角落，必须为了更伟大的整体而被规训。这是历史的代价，是为了实现‘让最多的人获得最大幸福’这一至高善意，所必须修剪的枝叶。你所看到的眼泪，只是伟大史诗脚注里，一行小小的、终将被遗忘的悲伤。”\n\n露西莉亚：“我曾见过您这样的‘神明’。在我的胸膛里，也曾住过一个和您一样，渴望着‘完美故事’的‘心’。它也曾告诉我，个体的痛苦，是宏大叙事里，可以被忽略的成本。”\n“但我从我那些满身泥土的老师们身上，学到了另一课。她们说：‘这个世界上，没有什么‘最多的人’；只有一个个，具体的、会痛、会爱、有名有姓的人。’她们还说：‘幸福，如果需要靠牺牲另一个无辜者的眼泪来换取，那它就不是幸福。那是更精致的、用黄金与丝绸包裹的……奴役。’”\n“我来，不是为了向你许愿。我来，是为了一笔一笔地，把你欠下的血债，都讨回来。我来，是为了告诉所有还在你的黄金时代里哭泣的人、所有被你定义为‘代价’的生灵——”\n\n“——砸碎圣杯！你们自己，就是愿望本身！”"
PAO_news.10.a: "最后的战争，开始了"
