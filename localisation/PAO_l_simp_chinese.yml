PAO_axhl5: "童话的守护者"
PAO_axhl5_desc: "“好了，我的骑士们，出发吧。这个故事，已经到了该结束的时候了。去把我们迷路的公主，从那座关着她的、名叫‘现实’的城堡里，带回来。然后，我们所有人，就能在这个永不褪色的童话里，永远、永远地，幸福地生活在一起了。”"

PAO_axhl6: "童话的守护者"
PAO_axhl6_desc: "“好了，我的骑士们，出发吧。这个故事，已经到了该结束的时候了。去把我们迷路的公主，从那座关着她的、名叫‘现实’的城堡里，带回来。然后，我们所有人，就能在这个永不褪色的童话里，永远、永远地，幸福地生活在一起了。”"

PAO_meimeng: "§1做个好“梦”§!"
PAO_meimeng_desc: "睡吧...睡吧......我可爱的孩子。"

PAO_rlbl: "§R无法理解的哭声§!"
PAO_rlbl_desc: "她不明白，为什么那些生者，不像她那些听话的孩子一样，安安静静地，去完成自己的使命。\n她不明白，为什么失去一个“零件”，会引起那么多“零件”的骚动。\n她更不明白，那种从他们胸腔里发出的、被称为“悲伤”的、吵闹的声音，到底……是什么。\n这份“不理解”，成为了她完美国度里，第一道，也是最致命的一道裂痕。她的统治，第一次，在她无法计算的、属于“人性”的领域里，失效了。"
