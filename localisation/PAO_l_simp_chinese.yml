PAO_rmzd_target: "绝不动摇的誓言§Y[FROM.Getflag][FROM.Getname]§!"
PAO_rmzd_target_desc: "“同志们，不要看敌人那如同钢铁森林般的军队，不要去数她们头顶盘旋的战机。去看你们的身后。那里，有我们的人民，有刚刚分到土地的农夫，有第一次读懂书本的孩子。那里，就是我们的整个世界，也是我们最后的阵地。\n在我的童话书里，骑士最高光的时刻，是在面对十倍于己的恶龙时，为了守护身后手无寸铁的村民，而将剑插在自己身前的土地上，一步也不会后退。\n现在，我们就是那位骑士。而我们的身后，站着所有我们深爱的人民。那么，拔出你们的剑吧。让敌人知道，想要踏过这片土地，就必须先从我们这道由血肉与信念铸成的、最后的墙壁上跨过去！”"
PAO_rmzj_target: "黎明的邀约§Y[FROM.Getflag][FROM.Getname]§!"
PAO_rmzj_target_desc: "“同志们，我们取得了优势，但这不是我们骄傲的资本。胜利的意义，不在于我们能多么轻易地碾碎敌人的抵抗，而在于我们能为多少还在黑暗中的人，提前带去黎明。\n对面战壕里的士兵，她们也是母亲的孩子。她们只是被谎言与锁链驱使的、和我们一样渴望着和平的普通人。我们不能将她们，与她们身后那座吃人的战争机器混为一谈。\n因此，我命令，将我们的进攻，变成一场‘邀约’。我们的炮火，要越过她们的头顶，去摧毁她们的压迫者。我们的歌声，要穿过她们的防线，去唤醒她们的良知。我们的剑是为了斩断她们身上的锁链。\n告诉她们，放下武器，回家。我们在这里，为她们准备了温热的汤与崭新的未来。去吧，我的骑士们，去为她们，送去第一缕属于人民的晨光！”"

PAO_mqjj_target: "同一个家里，不说两家话§Y[FROM.Getflag][FROM.Getname]§!"
PAO_mqjj_target_desc: "“我曾问过一位导师，如何才能将许多不同的小溪，汇成一条真正的大河？\n她告诉我：‘孩子，你不能强迫它们流向同一个方向。你要做的，是挖深那条最终将容纳所有溪流的河道，让每一条小溪都能看到，奔向那里，是更广阔、更光明的选择。’\n现在，我们已经拆除了那些隔开我们的、旧世界的篱笆。但我们依然生活在各自小小的院子里，说着只有自己能懂的悄悄话。这不行。\n我们要做的，是共同建造一座属于我们所有人的、更大、更漂亮的‘家’。在这个家里，大家可以一起吃饭，一起读书，一起为了让屋顶不漏雨而努力。当‘我们’的故事，比‘我’自己的故事更精彩时，我们自然，就成了一家人。”"

jxms: "正在§Y[FROM.Getname]§!盖房子"
jxff: "正在§Y[FROM.Getname]§!发放食物"
jshy: "正在§Y[FROM.Getname]§!建花园"
PAO_mbqw_target: "在§Y[FROM.Getflag][FROM.Getname]§!§W解放区发放§Y面包§!与§9蔷薇§!§!"
PAO_mbqw_target_desc: "“我们来到这里，不是为了征服。我们只是想告诉你们，在一个没有压迫的世界里，生活本该有的两种味道：一种，是面包的温暖，它告诉我们，再也无需忍受饥饿；另一种，是蔷薇的芬芳，它提醒我们，活着，是为了追寻更美的东西。”"

PAO_zhjs_target: "§R每一个名字的重量§!§Y[FROM.Getflag][FROM.Getname]§!"
PAO_zhjs_target_desc: "“她们倒下了。。她们的家书，如今成了遗书，她们的诺言，成了我们还不清的血债。\n\n我们不能让她们的牺牲，仅仅变成史书上一行冰冷的墨迹！更不能让她们用生命守护的家人，在我们身后，流着眼泪忍受饥寒！\n\n现在，让我们把眼泪擦干。将这份足以压垮脊梁的悲伤，变成我们手中最滚烫的钢铁！去为生者，建造更温暖的家园！去为死者，刻下永不磨灭的姓名！”"

