PAO_szjy2: "睡着的鲸鱼"
PAO_szjy2_desc: "“我们的船不应该是吵闹的钢铁怪物。她们应该是睡着的、温柔的鲸鱼。她们会悄悄地，滑过最深的海沟，不会惊动任何一条小鱼。她们巨大的身影，将隐藏在洋流和阴影里，成为一个……无人知晓的、关于深海的秘密。”"

