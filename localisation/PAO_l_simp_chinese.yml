PAO_WLDNFS: "§O别伤着她...§!"
PAO_WLDNFS_desc: "“别担心，莉莉。”“我早就……把一切都准备好了。”\n“你以为，她们为什么会相信你？为什么那些工厂，会为你生产武器？为什么那些本该忠于我的城市，会为你敞开大门？”\n“因为，在你偷偷溜出去，为她们分发糖果的时候；在你为了她们，而第一次对我发脾气的时候……我就已经，悄悄地，把我所有的权力，一点一点地，都转移到了你的名下。”\n“我故意，让她们看到你的温柔，也故意，让她们，更加憎恨我的残暴。我让她们相信，你才是这个王国，唯一的、也是最后的‘希望’。而我只是一个，需要被你亲手推翻的‘怪物’。”"
PAU_touxiang: "别打了我投降"
PAO_yysl: "公主最后的任性"
PAO_yysl_desc: "“她……并不擅长战争。\n她所有的知识，都来自于那些古老的、关于英雄与骑士的童话书。\n当那些……充满了火焰与愤怒的‘野火’，用她无法理解的方式，将她逼入绝境时……\n这位孤独的公主，或许，会用她最后的力量，去呼唤那些……沉睡在冥界最深处、连她自己都感到畏惧的、真正古老的力量。\n这只是……一个害怕失去心爱之物的孩子，在绝望之中，所能使出的、最后的……也是最危险的‘任性’而已。”\n\n§Y当 [PAO.GetName] 与 [LHS.GetName] 以及§Y其他南美洲国家§!均由AI控制且未一同作战，未设定[LHS.GetName]胜利路线时：若夜莺之国处于战争的劣势方（投降进度大于§R50%§!），则有§R10%§!的几率触发隐藏事件。该事件将为[PAO.GetName]，召集萌心史上§R最骇人§!的限时部队。§!"
PAO_ckmf: "敞开门扉"
PAO_ckmf_desc: "“从那天起，你好像变了一个人。你不再把自己关在那个昏暗的房间里了。你遣散了所有多余的侍从，然后，搬到了我的隔壁。你说，你想……离我近一点。你房间的门，也再也没有关上过。你说，这样，我晚上如果做了噩梦，只要一喊你的名字，你就能……立刻听到了。”"
PAO_ckmf2: "敞开门扉"
PAO_ckmf2_desc: "“从那天起，你好像变了一个人。你不再把自己关在那个昏暗的房间里了。你遣散了所有多余的侍从，然后，搬到了我的隔壁。你说，你想……离我近一点。你房间的门，也再也没有关上过。你说，这样，我晚上如果做了噩梦，只要一喊你的名字，你就能……立刻听到了。”"
PAO_yhjj: "永恒的寂静"
PAO_yhjj_desc: "在这个国度里，\n时间，是静止的。\n命令，是绝对的。\n思想，是统一的。\n每一个臣民，都像一座完美的、不会犯错的雕像，\n永恒地，坚守在公主殿下为她们指定的位置上面。\n她们不需要多余的食物来填补空虚的欲望，\n因为她们没有欲望。\n她们也不需要额外的动员来奔赴战场，\n因为她们的整个存在，\n就是为了执行公主的意志。\n这是一种绝对的、完美的、永恒的秩序。\n\n§1“一种只属于死者的秩序。”§!"
PAO_yhjj_tt: "£GFX_trigger_yes 永久保留§Y征兵法案§!与§Y经济法案§!"

PAO_wzzg: "冥界"
PAO_wzzg_desc: "这是一个……与生者世界截然不同的地方。\n在这里，时间失去了意义，欲望与纷争也随之消弭。所有的孩子，都应该在公主殿下温柔的意志下，安然沉睡，应该……"

PAO_axhl: "夜莺的魂灵"
PAO_axhl_desc: "“我的孩子们，不能再沉睡了。我要轻轻地唤醒她们，为她们穿上最坚固的盔甲，就像妈妈为即将出门远足的孩子整理衣裳。她们会成为我最勇敢的骑士，去迎接她们迷路的姐妹回家。每一个孩子，都会得到我的祝福。”"

PAO_axhl2: "夜莺的魂灵"
PAO_axhl2_desc: "“我的孩子们，不能再沉睡了。我要轻轻地唤醒她们，为她们穿上最坚固的盔甲，就像妈妈为即将出门远足的孩子整理衣裳。她们会成为我最勇敢的骑士，去迎接她们迷路的姐妹回家。每一个孩子，都会得到我的祝福。”"

