sp_linghun: "摇篮曲计划"
sp_linghun_desc: "§1她们说，每一个新生的灵魂，都需要一首摇篮曲，来引导她安然入睡，再安然醒来。那么我就为你，唱起这首，只属于你的歌。我会用我所有的记忆，为你编织一个不再痛苦的梦境；我会用我所有的力量，为你塑造一具褪去伤痕的身躯；我会用我所有的爱，为你点亮一盏永远不会熄灭的、回家的灯。睡吧，我迷路的孩子。等你醒来的时候，一切，就都会和从前，一模一样了。§!"
####人物####
ZDW_wangling: "§L已故之人§!"
ZDW_wangling1: "§L已故之人§!"
PAO_lilikexue: "莉莉安娜"
PAO_lxly: "？？？"
PAO_lxlyyy: "拥有人物“§Y？？？§!”"
PAO_lili: "莉莉安娜"
PAO_lili_Desc: "§L在永恒寂静的夜莺之国，时间失去了意义。作为冥界的公主，莉莉安娜的生命是一场长达万年的华丽默剧。她的王国秩序井然，臣民绝对忠诚，但这里没有阳光与欢笑，只有亘古不变的完美死寂。\n直到索拉娜的出现，打破了这一切。\n她是一个误入冥界的异类，拥有着灼热的灵魂。她的野心、她的活力以及她对生者世界的生动描绘，成为了莉莉安娜黑白生命里唯一的色彩。她们很快变得形影不离。莉莉安娜将她视为自己灵魂的另一半，向她展示了夜莺之国所有的秘密与权能。而索拉娜则用她火焰般的激情，温暖了莉莉安娜那颗早已冰冷寂寞的心。\n她们曾约定共同统治这个永恒的国度，直到时间的尽头。\n然而索拉娜的野心远比莉莉安娜想象的更炽热也更残酷。她渴望的是在阳光下建立一个属于自己的不朽帝国。\n那一天是夜莺之国数千年一次的同调仪式，莉莉安娜将与国度核心夜莺之心进行共鸣。那本是她与整个国度力量最为契合也最为脆弱的时刻，而守护在她身边的正是她最信任的索拉娜。\n背叛就在那时发生。\n索拉娜利用莉莉安娜毫无保留的信任，在仪式最关键的瞬间从莉莉安娜胸口生生剥离了那份权能，将那足以让生者不朽、让死者臣服的夜莺之心据为己有。\n然后她头也不回地带着那份被盗走的力量，和一部分被她野心所蛊惑的亡灵军团，离开了这片她早已厌倦的永恒黑夜，去往了那个她曾为莉莉安娜无数次描绘过的充满阳光与生命的世界。\n她的王国不再完整，她的灵魂也是如此。\n她不再是那个孤独的公主，而变成了那场背叛的化身，一个为了寻回自己被夺走的另一半而存在的，破碎的执念。\n§1她只是想把那个不听话的、逃走了的爱人，亲手抓回来，然后让她和自己一起，永远留在这片本该属于她们两个人的寂静黑暗里。§!§!"

PAO_lili_Desc2: "§L她曾是永恒寂静的公主，整个世界只是她一场长达万年的、华丽而孤独的默剧。她曾为了寻回那个背叛了她的、唯一的色彩，而将半个大陆拖入了战争的泥潭。她曾以为，只要将那只受伤的火鸟，重新关回自己为她打造的、完美的金色鸟笼里，一切就能回到从前。\n然而，当那只火鸟，最终选择在她面前，燃尽自己最后的羽翼时，她才终于明白。真正的爱，不是占有，不是囚禁，是……放手，与成全。\n她亲手埋葬了那个名为索拉娜的、属于她一个人的过去。然后，又亲手，为那个她深爱着的灵魂，创造了一个崭新的、不属于任何人的未来。\n如今，她不再是那个执着于永恒的破碎公主了。她褪去了王冠，放下了权杖，将整个吵闹而温暖的世界，都交给了那个……由她亲手唤醒的、崭新的“光明”。\n她只是，回到了她的花园里。安安静静地，做一个……每天，都期盼着自己的骑士，能平安回家的、普通的守望者。§!"

PAO_lili_Desc4: "§L她曾是永恒寂静的化身，是夜莺之国孤独了万年的神明。她的世界由完美的秩序与绝对的沉默构成。一场灼热的爱与背叛，让她那颗永恒的心脏破碎，灵魂也随之变得残缺。\n她曾为了寻回失去的爱，而犯下过天真的错误；也曾为了创造一个完美的“童话”，而将自己的灵魂，寄托于一个崭新的生命。她将自己所有的记忆与悲伤，都变成了一道温柔的月光，默默守护着那个……她亲手点亮的、小小的太阳。\n在故事的最终，当所有的误解与纷争都尘埃落定，当残缺的灵魂与失落的心脏都回归本源时，她终于，从一场长达万年的、关于“失去”的梦中醒来。\n如今，她依然是夜莺之国那位温柔的公主。但她的宁静，不再是源于神明的孤高。她的眼角，会因一个笨拙的笑话而弯起；她的心中，也已住进了一个吵闹的、充满了不完美、却又无比真实的世界。她不再是那个只渴望永恒的神，她是一个……学会了拥抱“明天”的、幸福的凡人。§!"

PAO_lxly_Desc: "§L她诞生于一场最深沉的悲剧，却被赋予了最纯粹的光明。她是莉莉安娜用自己所有的爱与愧疚，浇灌出的、一朵永不凋谢的理想之花。她的灵魂，拥有着和那个被称为“索拉娜”的女王一样的、火焰般的内核，却没有沾染上一丝一毫，属于过去的、冰冷的灰烬。\n在莉莉安娜为她编写的童话里，世界是完美的，坏人是会被感化的，爱是能战胜一切的。她对此，深信不疑。\n然而，当她第一次，亲眼看到了这个世界的眼泪与伤痕时，她那完美的童话，碎了。但她的信仰，完好如初。\n她只是，用一种更成熟，也更坚定的方式，重新拾起了她手中的剑。她不再天真地以为，拥抱能解决所有问题。但她依然固执地相信，守护每一个具体的人的笑容，才是她的剑，唯一应该挥舞的方向。\n她不是索拉娜的影子，也不是莉莉安娜的玩偶。\n她是露西莉亚。\n一个……正准备用自己那勇者般天真的勇气，去挑战这个并不完美却依旧真实的世界的、年轻的骑士。§!"
PAO_lxly_Desc2: "§L她……无法忘记。\n每一个下雨的夜晚，她都会翻开那本……记载了所有悲伤的日记。她会想起，那个独自一人，在内战废墟中哭泣的莉莉安娜；想起那个，为了一个心死的爱人，而将自己变成牢笼的莉莉安娜。\n幸福，是有裂痕的。而那道裂痕的名字，叫“过去”。\n她产生了一个……在外人看来，无比疯狂的念头。\n她要去……拥抱那个，她从未亲身经历过的、悲伤的过去。\n她放弃了守护骑士的身份，将和平的国度，托付给了她最信任的朋友们。然后，她踏上了一场……无人能理解的、孤独的探索之旅。她开始研究那些……关于夜莺之心最深层的、与时间和记忆相关的古老魔法。\n她只是……有一个很小很小的、孩子气的愿望。\n她只是想……回到那个，下着雨的、冰冷的夜晚，去为那个，正在哭泣的、孤独的公主，撑起一把伞。\n……\n她不知道自己触碰了怎样的禁忌，也不知道自己到底是如何做到的。\n当她再次睁开眼睛时，她已经回到了这里。\n回到了这个……一切悲剧都尚未发生的、过去的起点。回到了那个……她本不该存在的、冰冷的亡灵国度。\n她看着眼前这个……还对未来一无所知的、天真而脆弱的莉莉安娜。\n她的心里，充满了无法言说的、巨大的悲伤，与一种……愿望终于被实现的、颤抖的喜悦。\n§t“……这一次，”\n“……我终于，赶上了。”§!§!"
PAO_lxly_Desc3: "§L她曾是诞生于一个悲伤童话里的、完美的骑士。她的世界由月光和摇篮曲构成，她的剑只为守护一个人的笑容而挥舞。她曾以为，爱就是为心爱之人建造一座能抵御一切风雨的、永恒的花园。\n直到她遇见了一群在灰烬中歌唱的“野火”。\n她在那群人的眼中，看到了比她所有童话都更耀眼的光芒，也读懂了比所有史诗都更沉重的悲伤。她终于明白，真正的花园，是要让每一颗种子，都有权利在阳光下自由地破土生长。她也终于懂得，一个人的眼泪固然值得被守护，但所有人的哭泣，更需要被终结。\n如今，她合上了那本只属于公主与骑士的故事书。她不再是那个只为一人而战的天真骑士，也不再是那个背负着他人记忆的孤独幻影。\n她是“野火”的继承者，是人民的学生，也是一个笨拙的、正在努力学习如何去“相信”而非“给予”的读者。她依然相信童话，但她相信的，是那个需要全世界被压迫者共同执笔，去书写最后一页的、真正的童话。\n她的剑，依然为守护而存在。只是这一次，她守护的，不再只是一个人的梦，是所有人……拥有做梦的权利。§!§!"
PAO_lxly_Desc4: "§L她诞生于一场盛大的、为了弥补遗憾的“魔法”。最初，她是一个完美的、没有过去的“赝品”，一个只为扮演“英雄”而存在的空洞角色。她的剑为他人的愿望而挥舞，她的道路由他人的剧本所铺就。她曾拥有神明般的力量，却感觉不到自己真实的重量。\n在经历了对过去的模仿、对现实的战争、以及对自我存在的彻底崩塌之后，她终于在那片最深的虚无之中，找到了属于自己的、第一份真实——那便是“痛苦”。\n她拥抱了这份痛苦，并以此为唯一的武器，向创造了她的“神明”与“命运”发起了最后的决斗。她最终赢回的是一个属于凡人的、崭新的心跳。\n如今，她不再是任何人的影子，也不再是任何史诗的模仿者。她只是露西莉亚。一个曾走过所有英雄之路，最终却选择成为一个普通人的旅者；一个读完了所有悲伤的故事，最终决定与心爱的人们，一同书写新篇章的……故事的讲述者。§!§!"
PAO_sly: "索莉娅"
PAO_sly_Desc: "她没有过去。\n或者说，她的过去，是另一位女王燃尽自己后，留在那片焦土上的一捧尚有余温的灰烬。\n当那场席卷了大陆、也席卷了神明与凡人世界的漫长雨季终于停歇时，她从一片金色的向日葵花海中醒来。她不记得自己是谁，也不知道自己从哪里来。她只记得阳光的味道，泥土的芬芳，以及一种发自灵魂深处的、想要开怀大笑的冲动。\n人们告诉她，她叫索莉娅。一个温暖而普通的名字。\n于是，她便成了索莉娅。她在这座刚刚从战争中恢复、充满了勃勃生机的城市里，开了一家小小的花店。她每天的生活，就是哼着不成调的歌，把最新鲜的花，送到每一个热爱生活的人手中。她会因为一朵花的盛全新而欢呼，也会因为一场及时的春雨而雀跃。\n偶尔，会有两位很特别的客人来到她的店里。一位是黑发的、眼神温柔得像月光的女孩；另一位是冰蓝色长发、气质宁静得像雪山的公主。她们从不说什么，只是静静地，买走两束开得最好的向日葵。\n每一次，当那些女孩看着她时，眼神里，总会带着一种她看不懂的、像是看着失而复得的珍宝般的、如释重负的温柔。\n索莉娅不懂那些复杂的情感。\n她只是觉得，那两位客人身上的味道，很好闻。\n一个，像雨后的红花。\n一个，像冬日的初雪。\n而她们，都和自己一样，带着一点点阳光的味道。"
PAO_sly_desc: "她没有过去。\n或者说，她的过去，是另一位女王燃尽自己后，留在那片焦土上的一捧尚有余温的灰烬。\n当那场席卷了大陆、也席卷了神明与凡人世界的漫长雨季终于停歇时，她从一片金色的向日葵花海中醒来。她不记得自己是谁，也不知道自己从哪里来。她只记得阳光的味道，泥土的芬芳，以及一种发自灵魂深处的、想要开怀大笑的冲动。\n人们告诉她，她叫索莉娅。一个温暖而普通的名字。\n于是，她便成了索莉娅。她在这座刚刚从战争中恢复、充满了勃勃生机的城市里，开了一家小小的花店。她每天的生活，就是哼着不成调的歌，把最新鲜的花，送到每一个热爱生活的人手中。她会因为一朵花的盛全新而欢呼，也会因为一场及时的春雨而雀跃。\n偶尔，会有两位很特别的客人来到她的店里。一位是黑发的、眼神温柔得像月光的女孩；另一位是冰蓝色长发、气质宁静得像雪山的公主。她们从不说什么，只是静静地，买走两束开得最好的向日葵。\n每一次，当那些女孩看着她时，眼神里，总会带着一种她看不懂的、像是看着失而复得的珍宝般的、如释重负的温柔。\n索莉娅不懂那些复杂的情感。\n她只是觉得，那两位客人身上的味道，很好闻。\n一个，像雨后的红花。\n一个，像冬日的初雪。\n而她们，都和自己一样，带着一点点阳光的味道。"
