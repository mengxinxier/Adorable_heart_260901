####国策####
#政治线国策
PAO_anjing: "嘘，安静一点"
PAO_anjing_desc: "“最近……国度里有些吵闹。那些本该安眠的孩子们，好像都在做着不安稳的梦。这不好。索拉娜她……喜欢安静的地方。我想，只要我轻轻地拜托她们，她们一定会为了我们，重新变回乖孩子的，对不对？”"

PAO_xtgs: "是想听故事了吗？"
PAO_xtgs_desc: "“她们还是……很吵闹。我有些明白了。一定是因为，索拉娜不在，没有人再给她们讲那些……关于阳光和星星的、有趣的故事了。那么，就由我来吧。我会让我的侍从，去每一个角落，把我记得的所有故事，都讲给她们听。听完了故事，她们就该安稳睡去了吧。”"

PAO_dsgj: "把家里打扫干净"
PAO_dsgj_desc: "“故事……好像也没有用。她们开始……弄乱我们的家了。那些漂亮的、积了万年尘埃的街道，被她们弄得一团糟。这可不行。等索拉娜回来看到，她会不开心的。我要让侍卫们，去把那些不听话的孩子，暂时请到一边去，然后，把我们的家，重新打扫得干干净净。”"

PAO_bthn: "为什么不听话呢？"
PAO_bthn_desc: "“我……不明白。我真的不明白。为什么你们就是不肯听话呢？我给了你们安静，给了你们故事，也给了你们一个干净的家。可你们……却开始互相伤害了。你们在破坏我们最重要的东西。你们在……破坏我们曾拥有过的、最完美的回忆。”"

PAO_tywb: "请不要讨厌我！！！"
PAO_tywb_desc: "“侍卫们……也挡不住她们了。到处都是裂痕，到处都是……不和谐的声音。我的家，快要碎掉了。如果……如果索拉娜回来，看到的是这样一副景象……她一定会讨厌我的吧。她会觉得，我连我们唯一的家，都看管不好。我……不能让她看到这个样子的夜莺之国。\n绝对，不能！！！”"

PAO_wlcj: "我们曾一起约定过永远"
PAO_wlcj_desc: "“对不起。真的……对不起。我不想伤害你们，你们每一个，都是我珍视的孩子。可是……你们正在毁掉，我唯一珍视的东西。所以……请原谅我。为了能让她回来时，还能看到一个……像我们曾经约定过的那样、完美的、永恒的家。我必须……亲手，将那些不和谐的音符，全部抹去了。”"

PAO_wmdj: "为了我们的家"
PAO_wmdj_desc: "“好了，不听话的孩子们，都已经重新睡着了。可是……她们把我们的家，弄得好乱。到处都是灰尘和裂痕。这不行。我要让侍从们，把每一块地砖都擦亮，把每一座雕像都修复好。我要让这里，变回你最喜欢的、那个一尘不染的样子。”"

PAO_bkcl: "别把位置空出来"
PAO_bkcl_desc: "“家里……变得比以前更空旷了。好多好多熟悉的身影，都不见了。没关系。我会用我自己的力量，去填满那些空出来的位置。我会创造出新的、更听话、也更完美的侍从。她们会和我一起，静静地，等待着这个家另一位主人的归来。”"
PAO_nnsg: "你的那束光"
PAO_nnsg_desc: "“我总是会想起，你第一次来到这里时，你身上的那束光。那么亮，那么暖，把我的整个世界都照亮了。我想……我不能再只是等待了。我要试着，去重新找到那束光。我会派我最安静的孩子们，去往那个……你现在所在的、吵闹的生者世界，去寻找你的踪迹。”"

PAO_zshn: "她们在伤害你？？？"
PAO_zshn_desc: "“我的孩子们，回来了。她们带回来的消息，让我的心……好疼。她们说，你在那个世界，过得一点也不好。有一群叫‘野火’的坏孩子，她们在伤害你，在试图……熄灭你身上的光。她们……怎么敢？她们怎么能……这样对你？”"

PAO_bzqf: "不准再欺负她了！！！"
PAO_bzqf_desc: "“她们……竟然把你逼到了那个地步。不行。我决不允许。就算……就算你背叛了我，就算你偷走了我最重要的东西，可是……欺负你的人，也只能是我。那些凡人，那些……坏孩子，凭什么，能让你露出那种……快要碎掉的表情？”"

PAO_jnhj: "请让我来接你回家！"
PAO_jnhj_desc: "“索拉娜。你听。我不管什么王座，也不管什么公社了。我现在……只想去你的身边。我不会再让你，一个人，待在那个冰冷的、危险的世界里了。我会为你，挡住所有刺向你的刀剑。我会为你，驱散所有让你不开心的阴影。然后……在你最需要的时候，伸出手，把你从那片泥潭里，拉出来，带回到这个……至少，不会再有任何人，能伤害到你的、安安静静的家里来。”"

PAO_tszl: "嘘,她睡着了"
PAO_tszl_desc: "“我把她带回来了。她很累，身上有很多伤口，像一只在外面被欺负了很久、终于回到家的小猫。现在，她正在我的房间里，安安稳稳地睡着了。我命令了所有的侍从，不准发出任何声音，不准让任何光线，打扰到她的梦境。嘘……让她好好地，睡一觉吧。”"

PAO_sygs: "把所有的门都关上"
PAO_sygs_desc: "“外面的世界，太危险了。我不喜欢。她，也一定不喜欢了。从今天起，我们要把所有的门都关上。不再去听那些吵闹的声音，也不再去看那些刺眼的光芒。这个家，现在是我们两个人唯一的、也是最后的城堡了。我要让它变得……谁也进不来。”"

PAO_zjhy: "你我二人的花园"
PAO_zjhy_desc: "“她曾说，她喜欢花。我记得的。所以，我要在我们的城堡里，为她建一座独一无二的花园。我们不再需要外面的土地了，我会让我的孩子们，用魔法和我们自己的力量，在这片寂静的国度里，种出永不凋谢的花朵，流淌永不清澈的溪流。这里，将成为我们自给自足的、永恒的乐园。”"

PAO_bzll: "不准再让她流泪"
PAO_bzll_desc: "“我偷偷去看她的时候，发现……她哪怕是在睡觉都还在皱着眉头，像是在做着很可怕的噩梦。她一定……还在害怕那些叫‘野火’的坏孩子。我绝不允许。我决不允许，再有任何东西，能让她流一滴眼泪。我要让我的侍卫们，变得比以前，更强大，更坚固。”"

PAO_nswm: "那是我们的东西"
PAO_nswm_desc: "“她醒来的时候，很少说话。但有一次，她看着地图，指着那片……曾经属于她的、叫‘莉兰迪亚’的地方，眼神里，有一种我从未见过的、很悲伤的情绪。我明白了。那就像……一个孩子被抢走了心爱的玩具。虽然那个玩具让她受了很多伤，可那……依然是她的。是我们的。”"

PAO_nhwj: "把你的玩具拿回来"
PAO_nhwj_desc: "“好了，你已经休息得够久了。现在，那些坏孩子，好像要找上门来了。别怕。这一次，我陪着你。我们一起，去把那个……被她们抢走的、属于你的玩具，堂堂正正地，拿回来。然后，我们就再也不出去了，好不好？”"

PAO_wmsq: "帷幕，就在此刻升起"
PAO_wmsq_desc: "“你听，索拉娜。\n外面，传来那些坏孩子的脚步声了。她们好像……以为我们躲在这里，是因为害怕。她们不懂。\n我们只是……在等待。等待一个最安静的、只属于我们的舞台。等待所有的观众，都已经到齐。\n现在，帷幕，终于要升起来了。\n去换上你最漂亮的盔甲吧。然后，站在我的身边。\n我们要一起，为她们，献上一场……最华丽、也是……最后的，谢幕演出。”"

PAO_rlzc: "永恒的莉兰迪亚"
PAO_rlzc_desc: "“你回来了。\n可是……你的那团火，好像，熄灭了。\n你不再笑了，也不再……对我讲那些关于未来的、闪闪发光的故事了。你只是，每天，都坐在窗边，安静地，看着外面那片……让你伤痕累累的、吵闹的世界。\n……没关系。\n既然你不喜欢阳光了。\n那我就……为你，建一座没有阳光的城堡吧。\n我会让我的孩子们，用最冰冷的石头，和最沉默的影子，把这里，重新变回你我最初相遇时、那个安安静静的样子。\n再也没有人，能伤害你了。\n再也没有梦，能让你心碎了。\n我们……就在这里，永远，在一起，好不好？”"

PAO_gdwj: "给她们……更多的玩具"
PAO_gdwj_desc: "“她们……好像还是不开心。我有点明白了。一定是因为，她们觉得工作太无聊了。索拉娜，我记得你给我讲过，生者，是需要‘娱乐’的。那么，我就给她们娱乐吧。我会让我的孩子们，为她们建造最华丽的剧院，上演永不落幕的戏剧。有了这些……她们就该安静下来了吧？”"

PAO_zssz: "只是……睡着了而已"
PAO_zssz_desc: "“她们好像……更累了。有好多好多的人，开始走不动路，然后……就倒在路边，睡着了，再也醒不过来。没关系。我会让我的孩子们，把她们倒下的身体，变成新的、不会再感到疲惫的‘夜莺的魂灵’。这样，她们就能以另一种方式，永远地，陪在我们身边了，对不对？”"

PAO_ytpn: "为什么……要逃跑呢？"
PAO_ytpn_desc: "“为什么……？我给了你们安稳，给了你们快乐，甚至给了你们永恒。可为什么……你们还要逃跑呢？要逃回那个……充满了痛苦和背叛的、外面的世界去？这里……不好吗？还是说……我，做得还不够好？”"

PAO_wltx: "索拉娜的叹息"
PAO_wltx_desc: "“‘够了，莉莉安娜。’\n这是……你回来以后，第一次，用这么严肃的语气，和我说话。\n你看着窗外那些……麻木的、如同行尸走肉般的人们，眼神里，是我看不懂的、复杂的痛苦。\n你说：‘你看看她们！她们不是你的玩偶！她们是活生生的人！你这样，是在……毁掉她们，也是在毁掉你自己！’\n......”"

PAO_nljw: "那么……你来教我，好吗？"
PAO_nljw_desc: "“我……被你说得愣住了。我只是……想用我的方式，去对她们好而已。\n我看着你，看着你那双因为愤怒而燃烧着火焰的眼睛，然后，我轻轻地，拉住了你的手，用我能想到的、最天真、也最认真的语气，问你：\n‘……可是，索拉娜。’\n‘……在你过去的那个王国里，那些活生生的人们，她们……就不哭了吗？’”"

PAO_lzyl: "两种……不同的眼泪"
PAO_lzyl_desc: "“你的火焰……在那一刻，熄灭了。\n你看着我，像是看着一面镜子。一面……照出了你所有不想再回忆的过去的、冰冷的镜子。\n你什么也没说，只是……松开了我的手，然后，慢慢地，走回了你自己的房间。\n我好像……又说错话了。\n可是……眼泪和眼泪，到底……有什么不一样呢？我还是……不懂啊。”"

PAO_jzy: "就这样"
PAO_jzy_desc: "“莉莉安娜，你是对的。人民，是需要被‘管理’的。那些哭声，太吵了。从今天起，由我来。我会用我最熟悉的方式，让这座城市，重新变回你最喜欢的、安安静静的样子。你看好了，我的公主。我会为你，献上一场……最完美的统治。”"

PAO_bdsm: "下一顿饭在哪里？"
PAO_bdsm_desc: "“反抗的根源，是‘多余’的思想。而‘多余’的思想，源于‘多余’的力气。很简单。我会精确地计算出，一个人，为了活下去，每天所需要的、最少的食物。不多，也不少。然后，由我的禁卫军，定时、定量地，分发给她们。当她们所有的时间和精力，都只够用来思考‘下一顿饭在哪里’时，她们就再也没有力气，去想那些……不该想的东西了。”"

PAO_bdsm2: "下一顿饭在哪里？"
PAO_bdsm2_desc: "“反抗的根源，是‘多余’的思想。而‘多余’的思想，源于‘多余’的力气。很简单。我会精确地计算出，一个人，为了活下去，每天所需要的、最少的食物。不多，也不少。然后，由我的禁卫军，定时、定量地，分发给她们。当她们所有的时间和精力，都只够用来思考‘下一顿饭在哪里’时，她们就再也没有力气，去想那些……不该想的东西了。”"

PAO_bdsm3: "下一顿饭在哪里？"
PAO_bdsm3_desc: "“反抗的根源，是‘多余’的思想。而‘多余’的思想，源于‘多余’的力气。很简单。我会精确地计算出，一个人，为了活下去，每天所需要的、最少的食物。不多，也不少。然后，由我的禁卫军，定时、定量地，分发给她们。当她们所有的时间和精力，都只够用来思考‘下一顿饭在哪里’时，她们就再也没有力气，去想那些……不该想的东西了。”"

PAO_hxzh: "让她们互相憎恨"
PAO_hxzh_desc: "“团结，是最低效，也是最危险的东西。我会把她们，重新分开。我会告诉城东的工人，是城西的农民，偷走了她们的面包；我会告诉南边的矿工，是北边的伐木工，抢走了她们的工作。我会为她们，制造无数个新的、小小的‘敌人’。当她们忙于互相憎恨时，她们就会忘记……谁，才是她们真正的敌人。”"

PAO_wyxw: "在这唯一的希望里"
PAO_wyxw_desc: "“当她们陷入最深的绝望，当她们被饥饿、猜忌和仇恨，折磨得体无完肤时……我会给她们，一个‘希望’。我会告诉她们，只要她们足够忠诚，足够努力，她们就有机会，成为‘被选中的人’，离开这片地狱，进入我和莉莉安娜所在的、那座永恒的城堡里。我会让她们，为了这个虚无缥缈的希望，像疯狗一样，互相撕咬，互相出卖。”"

PAO_kxlm: "你是否开心？"
PAO_kxlm_desc: "“‘索拉娜……’\n那天晚上，你找到了我。你看着窗外那座……死气沉沉的、‘绝对服从’的城市，你的眼睛里，第一次，没有了光。\n‘……这就是……你想要的吗？’你轻声问我，‘……我觉得……她们，比以前，哭得更伤心了。只是……发不出声音了而已。’\n我看着你。看着你那双……因为悲伤而变得比星辰还要黯淡的眼睛。\n我笑了。\n‘不，莉莉。’我说，‘……这不是我想要的。这是……我欠她们的。’”"


PAO_yhxm: "但野火从未熄灭"
PAO_yhxm_desc: "“人民……终于，再一次，拿起了武器。\n在经历了最深的黑暗之后，她们终于明白，唯一的救赎，只在她们自己手中。而这一次，点燃她们怒火的，是我。\n我用最残酷的方式，教会了她们……什么是真正的敌人，什么是真正的团结。我逼着她们，成为了……我曾经最畏惧的、那个样子的‘野火’。\n现在，她们来了。带着足以烧尽一切的怒火，向着这座……我为她们亲手打造的、最坚固的牢笼，发起了最后的进攻。”"

PAO_lxag: "理想与哀歌"
PAO_lxag_desc: "“我也曾……有过一个，关于理想的、很长很长的梦。”"

PAO_lxag2: "理想与哀歌"
PAO_lxag2_desc: "“我也曾……有过一个，关于理想的、很长很长的梦。”"

PAO_zhzl: "献上最后的葬礼"
PAO_zhzl_desc: "“……不。\n我哭着，摇着头，求你，不要那么做。\n可你……只是微笑着，揉了揉我的头发。就像……很久很久以前那样。\n‘……听话，莉莉安娜。’\n‘这是……我唯一能，为你，也为她们，做的，最后一件事了。’\n然后，你就走了。\n你独自一人，回到了那座冰冷的王座上。你遣散了所有忠诚于你的禁卫军，只留下了一座……空荡荡的城堡。\n你对整个世界，发出了你作为女王的、最后一道，也是最残忍的命令——\n‘我，索拉娜，就在这里。’\n‘……来吧。’\n‘……来，审判我。’”"

PAO_dswg: "为你戴上这顶王冠"
PAO_dswg_desc: "“她们都在看着我。那些曾憎恨你的人，和那些曾追随你的人，现在，她们的眼中，都只剩下一种……混杂着悲伤与期盼的、复杂的眼神。她们把这顶……用你的灰烬换来的王冠，戴在了我的头上。它好重，索拉娜。重得……我快要喘不过气了。可是……这是你留给我的，对不对？那么，我就会……好好地，替你戴着它。”"

PAO_zhyw: "你的最后一个愿望"
PAO_zhyw_desc: "“‘要……好好地……爱她们啊。’\n这是你留给我的、最后一个愿望。我不是很懂……‘爱’，到底是什么。可是，我答应过你。所以，我会去学的。我会把我最好的东西，都给她们。我会让她们，吃饱，穿暖，再也不会为了什么东西而哭泣。我……会努力，成为一个你所希望我成为的、‘好’的女王。”"

PAO_zcsm: "她们在吵什么呀？"
PAO_zcsm_desc: "“我以为……只要让所有人都吃饱了，她们就会变得和我那些孩子一样，安安静静的了。可她们却开始吵架了。工人们说，工厂的产出应该优先分配给城市；农民们说，没有她们的粮食，城市就是一座空壳。她们……好像都有自己的道理。索拉娜……你以前，是怎么解决这些吵闹的声音的？”"

PAO_bhsh: "一个不会说话的学生"
PAO_bhsh_desc: "“我好像做错了。无论我选哪一边，另一边的人，都会不开心。我把国家……弄得更乱了。于是，我不再颁布命令了。我只是，每天，都悄悄地，去她们的会议室外面，听她们吵架。我听她们说，什么是‘剩余价值’，什么是‘工农联盟’。那些词，我听不懂。可我……好像能从那些吵吵闹闹的声音里，听到一种……我从未听过的、名为‘希望’的东西。”"

PAO_bhsh2: "一个不会说话的学生"
PAO_bhsh2_desc: "“我好像做错了。无论我选哪一边，另一边的人，都会不开心。我把国家……弄得更乱了。于是，我不再颁布命令了。我只是，每天，都悄悄地，去她们的会议室外面，听她们吵架。我听她们说，什么是‘剩余价值’，什么是‘工农联盟’。那些词，我听不懂。可我……好像能从那些吵吵闹闹的声音里，听到一种……我从未听过的、名为‘希望’的东西。”"

PAO_bzhl: "笨拙的回礼"
PAO_bzhl_desc: "“她们教会了我很多东西。我也想为她们，做一点什么。我不会治理国家，也不会发展经济。我唯一会的……就只有，我那些……安安静静的魔法了。我试着，把我的力量，注入到干涸的土地里，让它重新长出庄稼；我试着，用我的歌声，去安抚那些在战争中，留下了伤痕的心。这是我唯一能为她们做的、笨拙的回礼了。”"

PAO_smxz: "生命的“形状”"
PAO_smxz_desc: "“今天，我看到一个人类的孩子出生了。她那么小，那么软，哭声那么响亮。我看着她，突然，就想到了一个问题。一个……我以前，从来没有想过的问题。一个人的灵魂，到底是什么形状的呢？是什么东西，让一个哭泣的婴儿，最终，变成了……一个会笑、会爱、会为了理想而战的、独一无二的‘野火’？或者……变成一个，像你一样，充满了火焰与伤痕的、复杂的‘女王’？”"

PAO_yqcl: "如果一切重来"
PAO_yqcl_desc: "“我好像有点明白了。灵魂的形状，是由她所经历的一切，所塑造的。是贫民窟的泥泞，是王座的冰冷，是背叛的伤痕，是……所有所有的一切，才把你，变成了现在的你。可是……如果……如果有一个灵魂，她拥有和你一样的、最纯粹的、那束光一样的内核……却没有经历过那些痛苦，没有背负那些罪责……那她……会长成什么样子呢？她……会笑吗？”"

PAO_ycjh: "请再给我一次机会"
PAO_ycjh_desc: "“我不要。我不要那个……背负了所有痛苦的你。我只要……那个最初的、会对我笑、会给我讲故事的、温暖的你。夜莺的古籍里，记载着一种禁忌的魔法。一种……能从灰烬中，重新凝聚灵魂的仪式。但从来没有人，用它来复活过一个你这样，拥有过那么炽热生命的人类。她们都说，这是不可能的。可是……我想试试。我想再见你一次。然后，亲口告诉你，这一次，我学会了。我会为你，创造一个你一直想要的、温暖的、再也没有人会哭泣的世界。然后，我们就再也不分开了。”"

PAO_nzsj: "为你，逆转四季"
PAO_nzsj_desc: "“她们说，生者的世界，有一个无法被违抗的规则。\n她们说，花开了，就会谢；人死了，就不能再回来。\n……可我，是冥界的公主啊。\n在我的国度里，时间是静止的，凋零是无需存在的。我能让枯萎的花朵重新绽放，能让破碎的灵魂回归寂静。\n那么……为什么，我就不能……让一个迷了路的孩子，重新找到回家的路呢？\n你们不懂。你们只是生者，你们畏惧死亡。可我……生于死亡。我比你们，都更懂得，灵魂的重量与形状。\n我会用我所有的知识，用我身为公主的、全部的权能。\n我会为你，逆转她们所谓的‘规律’。\n我会为你，将那寒冷的冬天，重新变回……我们初次相遇时、那个温暖的、开满了永不凋谢的花朵的春天。”"

PAO_nzsj_tt: "解锁特殊研究项目:§Y摇篮曲计划§!"

PAO_dysg: "第一束光芒"
PAO_dysg_desc: "“我要做的第一件事，是为你，找到这个世界上最纯粹的光。我走遍了我们的国度，学会了所有孩子们最天真的笑声，学会了所有恋人们最真诚的誓言，学会了所有从绝望中重新站起来的人们，眼中闪烁的第一缕希望。我要把这些，作为你灵魂最初的基石。”"
PAO_dysg_tt: "§Y？？？§!将在未来获得§Y全属性增长§!。"

PAO_yxgs: "英雄的故事"
PAO_yxgs_desc: "“你不能只拥有光明，你还需要拥有勇气。我找来了那些最勇敢的人们，让她们在摇篮边，为你讲述那些关于反抗与牺牲的故事。我要让你知道，即使是在最深的黑暗里，也总有人，愿意为了守护他人而燃尽自己。我要让你，从一开始，就爱上这些……闪闪发光的人们。”"

PAO_yxgs_tt: "§Y？？？§!将在未来获得§Y特质：勇敢§!。"

PAO_cdyl: "擦掉所有的眼泪"
PAO_cdyl_desc: "“我翻遍了所有的古籍，删掉了那些……所有会让你感到悲伤的故事。我抹去了那些关于背叛、关于失去、关于求而不得的诗篇。在为你准备的世界里，不应该有眼泪。我只要你，永远，都像太阳一样，明亮，而快乐。悲伤，就由我一个人来背负，就好了。”"

PAO_cdyl_tt: "§Y？？？§!将在未来获得§Y特质：§!§t忠于理想§!。"

PAO_myzl: "没有重量的剑"
PAO_myzl_desc: "“你当然需要一把剑。但你的剑，不应该沾染任何仇恨。我为你，用最纯粹的月光和最坚定的誓言，锻造了一把毫无重量的剑。它只会在你需要保护弱小的时候，才会出现。它挥舞时，带起的，应该是希望的风，而不是……悲伤的血。”"

PAO_myzl_tt: "§Y？？？§!将在未来获得§Y特质：§!§O守护之剑§!。"

PAO_xlb: "醒来吧，我的挚爱"
PAO_xlb_desc: "“好了。我把我能想到的、这个世界上所有最好的东西，都给了你。我为你，创造了一个完美的、一尘不染的灵魂。虽然……它可能和我预想的，有一点点不一样。它好像……比我想象的，要更……‘天真’一点。不过，没关系。现在，摇篮，即将打开。醒来吧，我的挚爱。然后，去拥抱这个……我为你准备好的、崭新的世界吧。”"

PAO_lxlygaiming: "§Y？？？§!改名为§Y露西莉亚§!"

PAO_bdhy: "不容置疑的心"
PAO_bdhy_desc: "“她们说，智慧，源于怀疑。可我……不这么认为。怀疑，只会带来痛苦和猜忌。我要为你，塑造一颗永远不会怀疑的心。你会无条件地，相信所有的美好，相信所有的善良，相信每一个向你伸出的手。你会像一个……永远追逐着明天的骑士，眼中只有那个值得被拯救的世界。”"

PAO_dytk: "世界的第一课"
PAO_dytk_desc: "“她像一张白纸，对这个世界充满了好奇。我成为了她的老师。我教给她的第一课，是如何去爱。我带她去看望那些人民，让她看到她们脸上最真诚的笑容。我告诉她，我们所做的一切，就是为了守护这些笑容。这成为了她心中，最坚定的、唯一的信条。”"

PAO_myhr: "没有坏人的童话故事"
PAO_myhr_desc: "“她最喜欢听我讲故事。我为她，搜集了国度里所有关于英雄与骑士的童话。但在我讲给她听之前，我都会悄悄地，把故事的结局改掉。在我的故事里，巨龙最终会被感化，巫婆也会认识到自己的错误。我不想让她……那么早就知道，这个世界上，还存在着一种……无法被‘爱’所改变的、纯粹的‘恶’。”"

PAO_shzj: "黎明的前奏曲"
PAO_shzj_desc: "“她展现出了惊人的战斗天赋，就和……和她一样。但我不想让她，成为一个征服者。我为她打造了一把最华丽、也最‘温柔’的剑。我告诉她，这把剑，永远，只能用来保护那些无法保护自己的人。它不能被用来索取，也不能被用来复仇。它唯一的使命，就是守护。”"

PAO_kdkq: "第一次……看到哭泣"
PAO_kdkq_desc: "“今天，她第一次，看到了人民的眼泪。那是一个在事故中失去了亲人的家庭。她无法理解。她冲到那个哭泣的人面前，笨拙地，把我教给她的所有‘道理’，都说了一遍。她问她们，为什么不笑呢？我们的国家，不是已经没有压迫和饥饿了吗？她那份纯粹的、无法理解悲伤的善意，反而……让那些哭泣的人，哭得更伤心了。”"

PAO_wfdd: "无法……打倒的敌人"
PAO_wfdd_desc: "“她开始……产生疑问了。她第一次，向我提出了一个，我不知道该如何回答的问题。她问我：‘莉莉安娜，如果……有一个坏人，她不是因为饥饿，也不是因为悲伤，她就是……单纯地，喜欢看别人哭泣。那……我还能用我的‘爱’，去感化她吗？’我看着她那双，第一次，出现了‘迷茫’的红色眼睛，沉默了很久。”"

PAO_wdqs: "出发吧，我的骑士"
PAO_wdqs_desc: "“她……做出了自己的决定。她告诉我，她要去外面的世界看一看。她要去亲眼见证，那些……我没有写在童话书里的、真实的故事。她要去寻找那个……关于‘无法被感化的恶’的、最终的答案。我没有去阻止她。因为我知道，一个被关在摇篮里的孩子，是永远也无法真正长大的。我只是，为她披上了最坚固的盔甲，为她准备了最好的行囊。然后，在她出发的前一夜，对她说：‘去吧。然后，一定要……平安回来。’”"

PAO_bbxy: "不被需要的“守护”"
PAO_bbxy_desc: "“我找到了她们，那些传说中守护着世界的魔法少女。她们很强大，也很……骄傲。她们从云端之上俯瞰着我们，就像看着一群需要被保护的、脆弱的羊群。她们说她们的战斗是为了我们，可她们的眼神里，却看不到一丝一毫的温度。她们在‘守护’人民，却从未真正地，走进过人民之中。”"

PAO_ynbt: "我的战斗与你不同"
PAO_ynbt_desc: "“她们嘲笑我，说我那把只为守护而存在的剑，太过天真。她们说，真正的守护，是需要付出代价的，是凡人无法理解的、孤独的牺牲。我告诉她们，不对。真正的守护，从来都不是一个人的战斗。我的力量，并非来自什么神秘的契约，它来自我身后每一个人的笑容，每一份信任。我的战斗，不需要她们的理解。因为，我的身后，站着整个世界。”"

PAO_kzdd: "请看看这片大地"
PAO_kzdd_desc: "“我没有再和她们辩论。我只是邀请她们，脱下那身华丽的战袍，和我一起，走进了我们最普通的城市里。我带她们去看望那个会为了一个花冠而大笑的孩子，去看望那个因为疲惫而需要被搀扶的老人。我让她们亲耳去听，那些……被她们所‘守护’着的、吵闹的、温暖的、充满了生命力的声音。那天晚上，她们的领袖找到了我。她什么也没说，只是，第一次，对我伸出了她的手。”"

PAO_zqgt: "让鲜花开满世界"
PAO_zqgt_desc: "“她们说，她们的力量，源于一种很悲伤的循环。每一次战斗，都在消耗着她们的灵魂。我不是很懂。但我知道，再勇敢的骑士，也需要一个能安心休息的、温暖的壁炉。所以，我想，用我们‘夜莺’的力量，和她们的魔法，一起为她们，为我们，建造一座座谁也打扰不了的、我们共同的、美好花园。让她们在每一次战斗归来后，都能有一个，可以治愈伤口的地方。”"
PAO_zqgt2: "让鲜花开满世界"
PAO_zqgt2_desc: "“她们说，她们的力量，源于一种很悲伤的循环。每一次战斗，都在消耗着她们的灵魂。我不是很懂。但我知道，再勇敢的骑士，也需要一个能安心休息的、温暖的壁炉。所以，我想，用我们‘夜莺’的力量，和她们的魔法，一起为她们，为我们，建造一座座谁也打扰不了的、我们共同的、美好花园。让她们在每一次战斗归来后，都能有一个，可以治愈伤口的地方。”"
PAO_zqgt3: "让鲜花开满世界"
PAO_zqgt3_desc: "“她们说，她们的力量，源于一种很悲伤的循环。每一次战斗，都在消耗着她们的灵魂。我不是很懂。但我知道，再勇敢的骑士，也需要一个能安心休息的、温暖的壁炉。所以，我想，用我们‘夜莺’的力量，和她们的魔法，一起为她们，为我们，建造一座座谁也打扰不了的、我们共同的、美好花园。让她们在每一次战斗归来后，都能有一个，可以治愈伤口的地方。”"
PAO_zqgt4: "让鲜花开满世界"
PAO_zqgt4_desc: "“她们说，她们的力量，源于一种很悲伤的循环。每一次战斗，都在消耗着她们的灵魂。我不是很懂。但我知道，再勇敢的骑士，也需要一个能安心休息的、温暖的壁炉。所以，我想，用我们‘夜莺’的力量，和她们的魔法，一起为她们，为我们，建造一座座谁也打扰不了的、我们共同的、美好花园。让她们在每一次战斗归来后，都能有一个，可以治愈伤口的地方。”"

PAO_czwg: "沉重的王冠"
PAO_czwg_desc: "“那天，你把我叫到了你的房间。你把那顶象征着莉兰迪亚最高权力的、冰冷的王冠，戴在了我的头上。你说，你已经不知道该怎么去引导这个，变得越来越‘吵闹’的、属于生者的世界了。你说，你只想，回到你的花园里，安安静静地，当一个只会唱歌的亡灵公主。你说，从今天起，这个家，就交给我了。我看着镜子里，那个戴着王冠的、一脸不知所措的自己，突然觉得……这顶王冠，比我那把只为守护而存在的剑，还要重上好多好多。”"

PAO_xzjl: "出发！去寻找巨龙！"
PAO_xzjl_desc: "“我戴上了王冠，也背负起了更大的责任。我和我的新朋友们，那些勇敢的魔法少女们，一起看着地图上那些还在哭泣的地方。阿德莱希与露斯契亚的贪婪，艾尔芙的枷锁，还有艾尔孚利登王国残留的、最后的阴影。她们说，那些是无法被战胜的、盘踞在这片大陆上的‘巨龙’。是吗？我不是很信。我只知道，在我的童话书里，骑士的使命，就是要去寻找巨龙，然后用拥抱，或者用剑，去让它，不再让任何人流泪。那么出发吧。我们一起，去寻找那些，需要被打倒的‘巨龙’。”"

PAO_kchh: "一起开个茶话会吧"
PAO_kchh_desc: "“她们总是把所有的事情都自己决定，把自己关在高高的房子里。我觉得这样不好。所以我邀请她们，来参加我们‘七嘴八舌的骑士们’讨论大会。虽然她们一开始好像很不习惯，但我觉得，只要多准备一些她们喜欢喝的红茶和蛋糕，她们总会愿意，多和我们聊一聊的。”"

PAO_mffw: "魔法，也要为大家服务"
PAO_mffw_desc: "“她们的魔法很厉害，能让枯萎的树木重新开花，能净化被污染的河流。可她们过去，好像只用魔法来战斗。我告诉她们，魔法，也可以用来让大家的菜园获得丰收，也可以用来点亮夜晚的路灯。你看，能让大家露出笑容的魔法，才是最厉害的魔法呀。”"

PAO_xths: "一本新的童话书"
PAO_xths_desc: "“我把我们的故事，都写成了一本新的童话书。里面有我的故事，也有她们的故事。我把这本书，送给了我们所有的孩子们。我要让她们从小就知道，守护这个世界的力量，有很多种。有骑士的剑，也有魔法少女的光。但最重要的，是我们愿意站在一起的那颗心。”"

PAO_jgwb: "背后就交给我吧"
PAO_jgwb_desc: "“她们的战斗方式，和我们完全不一样。她们像天上的流星，耀眼又强大。而我们，则像大地上的藤蔓，坚韧又绵长。我告诉我的骑士们，以后在战场上，就把天空，完全交给她们吧。我们要做的，是守护好她们的身后，成为她们可以安心降落的、最坚实的地面。”"

PAO_jgdd: "最坚固的盾"
PAO_jgdd_desc: "“她们的灵魂宝石，很漂亮，也很……脆弱。我不能再让她们，独自承受所有的诅咒和伤害了。我请求我们最好的工匠，用‘夜莺’的力量和最坚固的合金，为她们，打造出能抵御一切恶意的新盔甲。这一次，换我们，来成为她们的盾。”"

PAO_xhfx: "当骑士学会了飞翔"
PAO_xhfx_desc: "“她们说，她们愿意，把她们的力量，分享给我们。于是，在她们的帮助下，我的骑士们，第一次，拥有了能掠过天空的翅膀。你看，当骑士学会了飞翔，当魔法少女拥有了大地，这个世界上，就再也没有，我们无法一起战胜的‘巨龙’了。”"


PAO_bfcf: "向着北方，冲锋！"
PAO_bfcf_desc: "“我们让身边的人不再哭泣了。\n可是，莉莉安娜。\n我最近又在那个叫做收音机的盒子里听到了很多很多新的哭声。\n她们来自北方。来自那些……被冰冷的钢铁与无尽的平原所覆盖的、遥远的国度。\n她们的语言我听不懂，她们的故事我也不知道。\n可我能听懂她们的眼泪。\n我问我自己，如果我只是守在我自己的小小花园里，对那些远方的哭声假装听不见。那么我还是一个你在童话书里教给我的那个‘骑士’吗？\n我想不是的。\n所以我们出发吧。\n不为王冠也不为土地。\n向着北方，向着那些哭声传来的地方，向着那些……还在等待着英雄的、古老的童话，发起最后的冲锋”"

PAO_kddx: "空洞的心"
PAO_kddx_desc: "“我们胜利了。整个世界，都沐浴在我们带来的、和平的光芒下。\n可是，莉莉安娜。\n我看到你，在庆典的夜晚，独自一人，走进了那座最古老的、封印着夜莺之国所有秘密的圣堂。\n我悄悄地，跟了进去。\n然后，我看到了。\n我看到你，轻轻地，将手，放在了自己的胸口。那里只有一个……由纯粹的、冰冷的魔力所构成的、巨大的空洞。\n你对着那个空洞，轻声地，说了一句话。\n你说：‘你看，我们赢了。可是……你为什么，还是不肯回来呢？’”"

PAO_xzgc: "心脏的归处"
PAO_xzgc_desc: "“那天晚上，你终于，对我讲完了那个，你从未讲完的故事。\n原来，你早已失去了你的‘心’。\n那颗被称为‘夜莺之心’的、维系着整个夜莺国度所有魔力的源头，就在索拉娜背叛你的那一天，被她从你的胸口，残忍地剥离了。\n你这些年来所有的力量，都只是在透支你那本已残破的灵魂。每一次为我抵挡伤害，每一次为人民降下祝福，都像是在将你自己，更深地，推向那片永恒的、真正的虚无。\n而我……\n我这个……由你用尽所有爱意与希望，所创造出来的‘光’……\n我的灵魂，我的心跳，我之所以存在的最根本的核心……\n……原来，就是那颗，本该属于你的，温暖的、跳动着的……‘夜莺之心’。\n现在，我明白了。\n为什么，我总觉得，自己好像偷走了什么不属于我的东西。\n为什么，你看着我的时候，眼神里，总是带着那种……我无法理解的、温柔的悲伤。\n莉莉安娜。\n我终于明白了。原来，这个童话故事的结局，从一开始，就只有一个主题。\n那就是……必须有人，要献上自己的心脏。\n要么，是骑士，将心脏，还给被恶龙偷走了心脏的、心爱的公主。\n要么……\n……是骑士，带着公主的心脏，独自一人，去往一个……再也没有公主的、孤独的未来。”"

PAO_bzss: "不再上锁的门"
PAO_bzss_desc: "“从那天起，你好像变了一个人。你不再把自己关在那个昏暗的房间里了。你遣散了所有多余的侍从，然后，搬到了我的隔壁。你说，你想……离我近一点。你房间的门，也再也没有关上过。你说，这样，我晚上如果做了噩梦，只要一喊你的名字，你就能……立刻听到了。”"

PAO_lgch: "两个人的“茶话会”"
PAO_lgch_desc: "“我还是会，把大家的烦恼，带回来和你讨论。虽然……你总是听不懂。你总是会提出一些，比如‘让所有吵架的人都去花园里罚站’之类的、很孩子气的建议。可你……每一次，都会听得特别认真。然后，在我讲完之后，为我端上一杯……你亲手泡的、总是会不小心放太多糖的红茶。”"

PAO_hhjz: "会说谎的镜子"
PAO_hhjz_desc: "“今天，你带我，去了那座最古老的圣堂。我问你，那面……我第一次见到时，映出了我和黑色身影的镜子，到底是什么。\n你沉默了很久。然后，你告诉我，那是‘记忆’。是你……将自己所有关于索拉娜的、最痛苦也最美好的记忆，都封印进去之后，所形成的一面镜子。\n你说，你本来，是想让它，永远地，只映照出你一个人的过去的。”"

PAO_dsgr: "镜子里的第三个人"
PAO_dsgr_desc: "“你拉着我的手，走到了那面镜子前。\n你说：‘可是现在不一样了。’\n你伸出手，轻轻触摸着那冰冷的镜面。镜子里清晰地映出了我们两个人的身影。\n然后我看到，镜子里那个一直站在我身后的、属于索拉娜的黑色幻影，第一次露出了一个释然的淡淡微笑。\n然后她就像一阵风一样，彻底地消散了。”"

PAO_qkhb: "去看海吧"
PAO_qkhb_desc: "“你的身体，一天比一天，变得更透明了。我知道那一天很快就要来了。\n我不再去想那些沉重的事情了。我只是，拉着你的手，带你去了很多很多……你从未去过的地方。\n我们一起，去了海边。我为你，捡来了你一直很好奇的、亮晶晶的贝壳。\n我们一起，去了森林。我为你，采来了你故事书里才有的、带着露珠的红色浆果。\n我只是想……把这个，你守护了一辈子，却从未真正感受过的、吵闹又温暖的世界，一点一点地，都装进你的眼睛里。”"

PAO_xqjf: "新的全家福"
PAO_xqjf_desc: "“那天晚上，月光很好。\n我把你，带到了那座……开满了向日葵的山坡上。我们的新朋友们，莉兰迪亚里的大家，和那些勇敢的魔法少女，也都在那里。\n我们燃起了篝火，大家一起，唱着我听不懂、却很好听的歌。\n我看到你，靠在我的身边，看着眼前的这一切，露出了一个……我从未见过的、真正幸福的、发自内心的笑容。\n我悄悄地，拜托一个会画画的魔法少女，把这一刻，画了下来。\n画上，有我，有你，也有她们。\n你看，莉莉安娜。我们……终于，有了一张，大家都快快乐乐的、新的‘全家福’了。”"

PAO_wdgz: "睡吧，我的公主殿下"
PAO_wdgz_desc: "“你……越来越喜欢睡觉了。\n大部分的时候，你都会靠在我的身边，安安静静地，听我，为你，读那些……我们一起写下的、新的童话书。\n有时候，读着读着，你就会像一个听完了睡前故事的孩子一样，在我身边，安安稳稳地，睡着了。\n我就会，像你曾经为我做过的那样，为你，盖上一床最柔软的毯子。\n然后，在你耳边，轻轻地，哼起那首……我为你，学会的、唯一的摇篮曲。\n你的眉头，在我的歌声里，会慢慢地，舒展开来。\n我知道，你一定……又做了一个，很甜很甜的梦吧。\n没关系。\n你，就安心地睡吧。\n这一次……\n换我，来为你，守着这个……再也不会有噩梦的、安安静静的世界了。”"

####莉莉安娜经济线####
PAO_fjss: "大大的房间"
PAO_fjss_desc: "“我要去接她回家了。可是……家里现在这个样子，还不够好。地方太小了，不够我们两个人玩耍。我要让我的孩子们，把那些没用的废墟都推平，把我们的国度，变得更大、更漂亮。这样，等她回来，就能有一个崭新的、足够宽敞的房间了。”"

PAO_ssfg: "闪闪发光"
PAO_ssfg_desc: "“我记得……你最喜欢那些亮晶晶的、温暖的东西了。你说，它们像天上的星星。我们这里没有星星，但是……地底下，有很多很多漂亮的石头。我会让我的孩子们，把它们全都挖出来，为你建成一座……比太阳还要闪亮的宫殿，造出一支……比星星还耀眼的军队。你会喜欢的，对不对？”"

PAO_ssfg2: "闪闪发光"
PAO_ssfg2_desc: "“我记得……你最喜欢那些亮晶晶的、温暖的东西了。你说，它们像天上的星星。我们这里没有星星，但是……地底下，有很多很多漂亮的石头。我会让我的孩子们，把它们全都挖出来，为你建成一座……比太阳还要闪亮的宫殿，造出一支……比星星还耀眼的军队。你会喜欢的，对不对？”"

PAO_ssfg3: "闪闪发光"
PAO_ssfg3_desc: "“我记得……你最喜欢那些亮晶晶的、温暖的东西了。你说，它们像天上的星星。我们这里没有星星，但是……地底下，有很多很多漂亮的石头。我会让我的孩子们，把它们全都挖出来，为你建成一座……比太阳还要闪亮的宫殿，造出一支……比星星还耀眼的军队。你会喜欢的，对不对？”"

PAO_ssfg4: "闪闪发光"
PAO_ssfg4_desc: "“我记得……你最喜欢那些亮晶晶的、温暖的东西了。你说，它们像天上的星星。我们这里没有星星，但是……地底下，有很多很多漂亮的石头。我会让我的孩子们，把它们全都挖出来，为你建成一座……比太阳还要闪亮的宫殿，造出一支……比星星还耀眼的军队。你会喜欢的，对不对？”"

PAO_ssfg5: "§1公主的献礼§!"
PAO_ssfg5_desc: "§1“回来吧，索拉娜。\n你看，我把所有你喜欢的东西，\n都准备好了。”§!"

PAO_zbwj: "为你准备的新玩具"
PAO_zbwj_desc: "“生者世界的玩具，好像……都是用一种叫‘钢铁’的东西做的。它们看起来很坚固，很冰冷，和你一样。我不是很喜欢。但是……如果你喜欢的话，我也会为你准备好的。我会让我的孩子们，不眠不休，为你打造出最坚固、最锋利的玩具。有了它们，就再也没有人，敢欺负你了。”"

PAO_pytl: "为你铺一条回家的路"
PAO_pytl_desc: "“从这里，到你现在在的那个地方，太远了。走路，会很累的。我不要你再受累了。我会让我的孩子们，用最坚固的石头，和最冰冷的钢铁，为你铺好一条……平坦的、可以直接回到家门口的路。你只要……沿着这条路，一直走，就能看到我了。”"

PAO_bedz: "不能让你饿肚子"
PAO_bedz_desc: "“你总说，生者，是需要吃东西的。虽然……我不是很懂。但是，我不能让你，在回家的路上，还饿着肚子。我会让我的孩子们，去收集所有……能让你的那些‘士兵’们，变得更有力气的东西。我会把它们，都堆在路边，等你回来拿。”"

PAO_wsjb: "现在……万事俱备了"
PAO_wsjb_desc: "“好了。家里，打扫干净了。新的玩具，准备好了。回家的路，也铺好了。所有……所有的一切，我都为你准备好了。现在，这个完美的、安安静静的、只为你一个人存在的王国，正等待着它的另一位女主人。索拉娜……我来了。”"
####莉莉安娜军事线####
PAO_sxwo: "苏醒的玩偶们"
PAO_sxwo_desc: "“我的孩子们，不能再沉睡了。我要轻轻地唤醒她们，为她们穿上最坚固的盔甲，就像妈妈为即将出门远足的孩子整理衣裳。她们会成为我最勇敢的骑士，去迎接她们迷路的姐妹回家。每一个孩子，都会得到我的祝福。”"

PAO_ygdp: "月光织成的斗篷"
PAO_ygdp_desc: "“夜晚，是我们的朋友。我会请求月亮，为我的孩子们，织一件看不见的斗篷。穿上它，她们就能像影子一样，悄悄地溜进坏人的花园里，不会被任何人发现。她们的脚步会像猫咪一样轻，不会惊醒任何一朵沉睡的花。”"

PAO_kqyj: "不会哭泣的眼睛"
PAO_kqyj_desc: "“外面的世界很可怕，充满了火焰和吵闹的声音。但我的孩子们，不会感到害怕。因为我拿走了她们的眼泪，给了她们永不哭泣的眼睛。她们会平静地，穿过所有的荆棘和风暴，眼中只有我为她们指引的、那唯一的方向。”"

PAO_jjyb: "荆棘的拥抱"
PAO_jjyb_desc: "“如果有人想伤害我的孩子，那么，她们就要做好被荆棘拥抱的准备。我会让我的孩子们，学会一种特别的魔法。她们会紧紧地、紧紧地抱住那些坏人，直到她们再也无法动弹，再也无法发出声音，直到她们也变成……安静的、不会再伤人的好孩子。”"

PAO_mlhz: "跟我走呀，迷路的孩子"
PAO_mlhz_desc: "“在那个吵闹的世界里，一定……也有很多和我们一样的、迷路的孩子。她们也在黑暗里哭泣，也想找到回家的路。我的孩子们，会为她们带去我的邀请。她们会牵起那些迷路孩子的手，对她们说，别怕，我带你们去一个……永不分离的、安安静静的家。”"

PAO_thjj: "当童话迎来结局"
PAO_thjj_desc: "“好了，我的骑士们，出发吧。这个故事，已经到了该结束的时候了。去把我们迷路的公主，从那座关着她的、名叫‘现实’的城堡里，带回来。然后，我们所有人，就能在这个永不褪色的童话里，永远、永远地，幸福地生活在一起了。”"



#空军线
PAO_zscb: "为她们装上翅膀"
PAO_zscb_desc: "“我的孩子们不应该只在地面上行走。我要为她们装上翅膀，用最轻的宝石和最纯净的月光，为她们编织出不会折断的羽翼。从此以后，天空也将成为我们安静的花园。”"

PAO_jjlx: "寂静的流星"
PAO_jjlx_desc: "“我喜欢流星，虽然索拉娜说那只是燃烧的石头。我要我的孩子们也像流星一样，在最深的夜里划过天际，迅速而悄然无声。她们会像一场无人察觉的流星雨，美丽又安静地，降临在敌人的头顶。”"

PAO_sjlz: "水晶的露珠"
PAO_sjlz_desc: "“她们的武器不应该是吵闹的火焰。那会吓到地面上那些可怜的孩子。她们的武器，应该是清晨花瓣上凝结的水晶露珠，冰冷纯净又无比锋利。当这些露珠从天空落下时，只会带走不和谐的声音，留下一片永恒的安宁。”"

PAO_ydtw: "在云端跳舞"
PAO_ydtw_desc: "“空中的战斗不应该是丑陋的撕咬。它应该是一场优雅的舞蹈，在云朵和风之间。我的孩子们会学习如何在气流中旋转，如何像蝴蝶一样躲开所有的危险。她们会让敌人明白，天空是属于舞者的舞台。”"

PAO_xxyj: "星星的眼睛"
PAO_xxyj_desc: "“我要把天上最亮的星星摘下来，安在她们的翅膀上。这样无论飞得多高，她们都能看清地面上每一片需要被守护的叶子，和每一颗需要被安抚的、迷路的心。她们的眼睛里，会映照出整个世界。”"

PAO_yggz: "月光下的公主们"
PAO_yggz_desc: "“现在我的孩子们已经学会了飞翔。她们将组成月光的编队，成为夜空的公主。当她们的翅膀遮蔽天空时，所有的喧嚣都将归于寂静，所有的纷争都将被安抚。整个世界，都会在她们带来的、永恒的月光下，安然睡去。”"

#海军线
PAO_shzg: "聆听深海之歌"
PAO_shzg_desc: "“大海的深处，和我的家一样，安安静静的。我喜欢那里。我要让我的孩子们，学会聆听海底的声音，学会在无光的深海里，找到回家的路。她们将成为这片蓝色寂静里，第一批，也是唯一的主人。”"

PAO_szjy: "睡着的鲸鱼"
PAO_szjy_desc: "“我们的船不应该是吵闹的钢铁怪物。她们应该是睡着的、温柔的鲸鱼。她们会悄悄地，滑过最深的海沟，不会惊动任何一条小鱼。她们巨大的身影，将隐藏在洋流和阴影里，成为一个……无人知晓的、关于深海的秘密。”"

PAO_ryqw: "美人鱼的亲吻"
PAO_ryqw_desc: "“如果……有坏孩子的船，闯入了我们的花园。那么，我的孩子们，就会像传说中的美人鱼一样，悄悄地游过去，在她们的船底，留下一个……冰冷的、致命的亲吻。然后，在坏孩子沉入海底之前，微笑着，消失在深蓝色的梦里。”"

PAO_bxcj: "不许在家里吵架"
PAO_bxcj_desc: "“我不喜欢别的孩子，也跑到我的花园深处来玩。她们太吵了，会吓到我的小鱼。我的孩子们，会用她们无声的拥抱，告诉那些不请自来的客人，这里……是禁止大声喧哗的。然后，把她们，轻轻地，请出去。”"

PAO_zmc: "深海的捉迷藏"
PAO_zmc_desc: "“有时候，我们也要学会捉迷藏。当坏孩子带着她们的飞机，气冲冲地跑来找我们的时候，我的孩子们，就会像害羞的水草一样，躲进最深的、最黑暗的海沟里。她们会屏住呼吸，静静地等待。等到坏孩子找不到我们，哭着回家了，我们再出来。”"

PAO_dhyl: "好梦洒向大海"
PAO_dhyl_desc: "“现在，整片大海，都听到了我的歌声。它变得和我一样，安安静静的了。我的孩子们，将成为这片蓝色梦境的守护者。她们会为所有迷航的船只，唱起温柔的摇篮曲，引导她们，进入一个……永不醒来的、最深、最甜美的梦乡。”"

####露西莉亚政治线####
PAO_pyks: "先从朋友开始？"
PAO_pyks_desc: "“她留了下来。她不说自己从哪里来也不说要去哪里。她只是每天都跟在我的身边，像一个最忠诚也最‘吵闹’的守护骑士。她说她要保护我，直到我能重新露出笑容为止。我不是很懂。但是有一个人陪在身边的感觉，好像也，不坏。”"

PAO_qgkr: "很奇怪的客人"
PAO_qgkr_desc: "“她和我的孩子们完全不一样。她会笑，会跳，会对我说的话提出反对意见。她甚至会……因为我忘了给水晶花园‘浇水’，而气鼓鼓地和我理论半天。我从未见过……这样鲜活的、不讲道理的、温暖的‘灵魂’。她就像……索拉娜曾经为我描述过的、那个充满了阳光的生者世界里，跑出来的一个……小小的意外。”"

PAO_dlhy: "她带来的“火焰”"
PAO_dlhy_desc: "“她开始试着教我的孩子们唱歌，虽然她们并不会发出声音。她还会拉着我的手，在空无一人的主殿里，跳起那种……她说是在她的故乡很流行的、轻快的舞蹈。我看着她，在我的这个……永恒寂静的世界里，努力地，制造着一点点属于‘生者’的热闹。我突然觉得，她好像……比我，更像这个国度，所需要的那束‘光’。”"

PAO_qtrj: "被泪水浸透的日记"
PAO_qtrj_desc: "“我……成功了。\n我回到了……一切都还没有变得无法挽回的那个时候。\n在上一个故事里，我是在……所有悲剧都发生之后，才被你创造出来的。我从未亲眼见过那场可怕的内战，也从未见过那个……让你爱恨交织的索拉娜。\n我所有关于‘过去’的认知，都来自于……你留下的那本日记。那本……你在创造了我之后，独自一人时，写下的、浸满了泪水和悔恨的日记。\n我从你的文字里，读到了你在内战中的无助；读到了你对索拉娜那份……无法被拯救的痛苦；读到了你……在耗尽所有力量，将我创造出来后，那份……温柔的孤独。\n我用了很久很久的时间，才终于明白，那颗在我胸膛里跳动着的‘夜莺之心’，到底是什么。\n它是你的生命，也是……唯一能回到过去，去改写那本日记结局的‘钥匙’。”"

PAO_zhwt: "最后的委托"
PAO_zhwt_desc: "“在我决定要回到过去的那一夜，我把所有的事情，都告诉了我的朋友们，那些勇敢的魔法少女。\n我告诉她们，我要去……救一个，对我来说，比我自己还要重要的人。我要去……阻止一本，从一开始，就不该被写下的、悲伤的日记。\n我把那个……我们好不容易，才建立起来的、充满了人类欢声笑语的小小国度，交给了她们。我把那本……我们一起写下的、新的童话书，也交给了她们。\n我拜托她们，在我回来之前，替我，守护好那个……我们共同的家。\n她们没有问我为什么。她们只是，像我当初，为她们做过的那样，给了我一个最温暖的用力的拥抱。”"

PAO_bhfs: "这一次，我不会再放手了"
PAO_bhfs_desc: "“所以，莉莉安娜。\n这一次，我回来了。\n我带着……从你那本悲伤的日记里，读到的所有遗憾和悔恨，回来了。\n我不知道这样做到底对不对。我也不知道，强行扭转的命运，会把我们，带向一个什么样的未来。\n我只知道一件事。\n那就是……这一次，无论发生什么，我都绝对，绝对，不会再放开你的手了。”"

PAO_ylsh: "对着月亮说话"
PAO_ylsh_desc: "“你走了。这个城堡，又变回了以前那样，安安静静的了。可是……这种安静，和你说过的‘寂静’，又有点不一样。我还是……不是很习惯。所以，每天晚上，我都会跑到最高的那座塔楼上，对着那轮……你最喜欢看的、圆圆的月亮，讲一些……今天发生的小故事。我猜……你应该，能听得到吧？”"

PAO_bbjz: "不再变化的镜子"
PAO_bbjz_desc: "“我又去了那座圣堂，站在了那面……曾映出了我们所有过去的镜子前。现在，镜子里，只剩下我一个人了。那个属于索拉娜的黑色幻影，消失了。那个……属于你的、温柔的倒影，也消失了。镜子，终于，变得和普通的镜子一样了。它只会……诚实地，映照出我这张……孤单的、小小的脸。”"

PAO_ygrd: "一个人的捉迷藏"
PAO_ygrd_desc: "“我把这个城堡，又重新，走了一遍。从你最喜欢的花园，到我们一起跳过舞的主殿。我试着，去寻找你可能会留下的、小小的痕迹。就像……在玩一场，只有我一个人的、不会有结局的捉迷藏。然后，我终于明白了。你不是……躲起来了。你只是……把我，变成了这个城堡里，唯一的‘你’而已。”"

PAO_lygs: "另一个故事"
PAO_lygs_desc: "“索拉娜的记忆，像一场永不停歇的风暴，在我的脑海里呼啸。我看到了她的童年，看到了她所憎恨的那个世界。然后……我打开了那台，能听到外界声音的、古老的收音机。我听到了。我听到了，在那片……曾属于她的土地上，正在发生着，一个和她的故事，很像很像的、新的故事。一个……关于‘反抗’与‘火焰’的故事。”"

PAO_bthy: "两种不同的火焰"
PAO_bthy_desc: "“她们……和索拉娜不一样。索拉娜的火焰，是为了将整个世界，都烧成只属于她一个人的灰烬。而她们的火焰……却是在灰烬里，努力地，想为所有的人，重新烧出一片……温暖的土地。虽然……她们的方法，看起来很笨拙，也很……吵闹。可是，那种……想要‘守护’什么东西的心情，我好像……有点懂。”"

PAO_zhth: "现在，为彼此敞开心门"
PAO_zhth_desc: "“莉莉安娜。我好像……终于，找到那个……你没能讲完的、童话故事的、最后的结局了。那个故事里，不应该只有一个孤独的公主，也不应该只有一个任性的女王。故事里……应该，还有一群……虽然很吵闹，却很努力地，想让所有人都过上好日子的、笨拙的‘英雄’。所以，我决定了。我要去……见一见她们。然后，把这个……由我们三个人共同写下的、最后的童话，亲口，用一场此生注定的决斗，来讲给她们听。”"

PAO_lrxj: "猎人的陷阱"
PAO_lrxj_desc: "“索拉娜的记忆告诉我，‘野火’是一群最狡猾的猎物。她们擅长在山林中躲藏，在运动中寻找战机。那么，对付她们最好的方式，就是为她们，准备一个她们无法拒绝的、最肥美的‘诱饵’。我将命令一部分‘夜莺’骑士，伪装成补给线上的薄弱环节，深入她们熟悉的山区。当她们以为自己咬住了我们的咽喉时，我那早已在四周布下的、真正的猎网，就会瞬间收紧。”"

PAO_jjtk: "寂静的天空"
PAO_jjtk_desc: "“她们的力量，源于大地的掩护。那么，我就剥夺她们的大地。我将派出我最安静的骑士们，去往那片她们赖以为生的天空。她们的任务是成为我的眼睛。她们将不分昼夜地盘旋，将每一片树叶的晃动，每一缕炊烟的升起，都清晰地，呈现在我的地图上。当她们再也没有一片可以躲藏的阴影时，这场战争，也就该结束了。”"

PAO_kjdj: "枯竭的柴"
PAO_kjdj_desc: "“革命的火焰，需要燃料才能燃烧。而‘野火’的燃料，来自于她们身后那些村庄与城镇的支持。索拉娜曾用屠杀来切断这种联系，那太过残暴且极端，只会激起更深的仇恨。我要用的，是更温柔的方式。我将向所有‘野火’活动区域的平民，宣布一项新的法令：所有愿意主动迁徙到我们安全区的居民，都将获得双倍的食物配给和绝对的安全保障。我不会强迫任何人，我只是，为她们，提供一个‘更好’的选择。当火焰周围的柴薪，都被主动抽走时，它自己，就会慢慢熄灭。”"

PAO_cbdj: "慈悲的代价"
PAO_cbdj_desc: "“晓枫和雪伊，她们是真正的英雄。她们最大的优点，也是她们最致命的弱点——那就是她们的慈悲。她们绝不会放弃任何一个受伤的平民，也绝不会抛弃任何一个落伍的士兵。那么，我就给她们，创造更多需要她们去慈悲的‘麻烦’。我将命令我的部队，在进攻时，刻意绕开那些医院、难民营和不具备战略价值的村庄，甚至……主动将她们的溃兵，驱赶到那些地方去。当她们的后勤，被无数需要被拯救的伤员和难民拖垮时，她们那份伟大的慈悲，就将变成压垮她们自己的、最后一根稻草。”"

PAO_yhyh: "永恒的野火"
PAO_yhyh_desc: "“我……赢了。却又……输得一败涂地。\n我用那自以为是的‘善意’，夺走了她们那些……本该并肩作战的家人。我以为我是在邀请她们合写一个童话，却亲手，撕碎了她们那本……早已写满了血与泪的、现实的史诗。\n那么，从今天起，莉兰迪亚，将不再是莉兰迪亚。\n我将舍弃这个……由公主与暴君的童话所构筑的名字。\n我们将继承那个……由英雄的鲜血所铸就的、更伟大的名字。\n——‘野火’。\n这，是我……欠她们的。也是……我背负起这份罪责的、第一步。”"

PAO_lchy: "两簇依旧燃烧的火焰"
PAO_lchy_desc: "“她们……都还活着。晓枫，和雪伊。\n可她们……再也不对我笑了。\n晓枫会避开我的视线，把自己关在房间里，一遍又一遍地，擦拭着那枚碎裂的军徽。\n而雪伊，则会像一头受伤的、保护着幼崽的母狼，将那个叫小果子的女孩，紧紧地护在身后，用一种冰冷的、满是戒备的眼神，看着我。\n我……该怎么办呢？莉莉安娜……”"

PAO_jjxm: "一簇即将熄灭的火焰"
PAO_jjxm_desc: "“晓枫……不在了。\n只剩下雪伊，和那个……总是躲在她身后、偷偷看我的、叫小果子的女孩。\n雪伊……她好像，把所有的火焰，都和晓枫一起，燃尽了。她不再对我冰冷，也不再对我愤怒。她只是……沉默。像一座……被掏空了所有宝藏的、安静的火山。\n而那个小果子……她的眼睛里，那种……和我一样的、‘失去’了什么东西的眼神……让我……不敢与她对视。”"

PAO_jks: "她们的“教科书”"
PAO_jks_desc: "“我……不知道该怎么去弥补。我唯一能做的，就是去学习。\n我不再去看那些虚假的童话了。我开始，认真地，去阅读她们留下的那些……写满了‘人民’与‘斗争’的、粗糙的笔记。\n我从晓枫的文字里，学习如何倾听；从雪伊的记录里，学习如何决断。\n我试着，用她们的方式，去理解这个……我曾以为，只需要用‘爱’就能拯救的、复杂的世界。”"

PAO_xgdt: "被修改的地图"
PAO_xgdt_desc: "“我把自己，关在房间里，一遍又一遍地，研究着晓枫留下的那些、关于‘战后重建’的地图和笔记。\n我发现……她真是一个天才。她把所有的一切，都规划得那么好。哪里该建学校，哪里该修工厂……\n可是……我看着地图，总觉得，好像……缺了点什么。\n于是，在一个深夜，我偷偷地，溜进了她们的指挥室。我拿起红色的铅笔，在那张……在我看来已经被她们视为‘圣物’的地图上，做了一个……小小的修改。\n我在那个……她们规划的、最大的公园的中央，又添上了一个小小的、歪歪扭扭的标记。\n——‘旋转木马’。\n我觉得……孩子们，应该会喜欢这个的吧。”"

PAO_bxrk: "笨拙的向日葵"
PAO_bxrk_desc: "“今天，天气很好。\n我……突然，就很想，为那个……我没能救下的、叫晓枫的女孩，做点什么。\n我悄悄地，在我自己的花园里，种下了一片……很小很小的向日葵。\n就像……索拉娜的记忆里，她曾梦想过的那样。\n然后，我摘下了开得最好看的一朵，放在了她们的门前。\n我什么也没说，就走了。”"

PAO_llan: "莉莉安娜……你在哪里？"
PAO_llan_desc: "“家……终于，又有了家的样子。\n我们……又有了新的‘家人’。\n可是，莉莉安娜。当我把这一切，都讲给月亮听的时候。\n我突然发现……\n我好像……已经很久很久，没有……在城堡里，看到你的身影了。\n你……是不是，看我已经不再孤单了，就……又像上次一样，悄悄地，躲到哪里去了呀？\n这一次……\n换我，来找你了，好不好？”"

PAO_hsds: "完结的童话书"
PAO_hsds_desc: "“我翻遍了所有关于‘夜莺之心’的古籍，询问了所有最古老的灵魂。她们都告诉我，没有人知道她去了哪里。她就像一滴融入大海的眼泪，彻底地，消失了。也许，是时候，承认这件事了。那个我发誓要用一生去寻找的人，可能，真的，再也找不回来了。”"

PAO_gymt: "关于明天的课"
PAO_gymt_desc: "“在我最失落的时候，是晓枫找到了我。她没有安慰我，只是把一张新的城市规划图，铺在了我的面前。她说‘你看，露西莉亚，过去我们无法改变，但我们可以一起，画出这座城市明天的样子。’她开始教我，如何倾听人民的声音，如何平衡不同的诉求。我看着她，第一次觉得，也许，‘守护’，并不仅仅是挥舞宝剑。”"

PAO_wrkc: "苦涩的茶"
PAO_wrkc_desc: "“在我最失落的时候，是雪伊找到了我。她没有安慰我，只是默默地，为我泡了一杯很苦很苦的茶。她说‘把它喝了。然后，站起来。’她告诉我，她也曾失去过最重要的人。”"

PAO_mlpy: "那些迷路的朋友们"
PAO_mlpy_desc: "“我的记忆告诉我，在上一个故事里，我曾有过一群……很特别的朋友。她们是魔法少女。她们善良，勇敢，却被一个残酷的‘契约’所束缚，最终，都会走向悲剧的结局。而在这个故事里……她们，依然，在那条孤独的、循环的道路上，挣扎着。不行。我不能……再假装看不见了。这一次，我不能再等到悲剧发生后，才去为她们写一本新的童话了。我必须，现在，就去找到她们。"

PAO_mjwd: "还有没讲完的故事"
PAO_mjwd_desc: "这片大陆上，还有很多很多……没有被写进童话里的、悲伤的故事。还有被艾尔芙联盟奴役的半妖精，还有殖民者们残留的、冰冷的阴影。我答应过莉莉安娜，要为她，创造一个，没有眼泪的世界。这个诺言，我还没有完成。"

PAO_yllj: "直至所有眼泪流尽"
PAO_yllj_desc: "“那么，出发吧。和我的新家人们一起，去完成这场盛大的远征。我们将踏遍这片大陆的每一个角落，去拥抱每一个还在哭泣的人，去打倒每一个制造眼泪的‘坏蛋’。直到……这片土地上，所有的悲伤，都汇入大海。直到……这片天空，变得像莉莉安娜的眼睛一样，干净，而温柔。到那时，我想……她，应该就能，找到回家的路了吧。”"

PAO_psny: "破碎的诺言"
PAO_psny_desc: "“我曾向她们许诺，要为她们写下一个幸福的结局。可在那之后，我做了什么？我忙于学习如何治理国家，忙于倾听人民的声音，却将她们……这群最孤独、最需要被理解的朋友，遗忘在了那座我为她们建造的、华丽而冰冷的‘花园’里。我天真地以为，只要提供了物质的庇护，就能治愈灵魂的伤口。我错了。当我看到她们的眼神，一天比一天更空洞，看到她们的灵魂宝石，在那份被隔绝的‘安宁’中加速浑浊时，我才终于明白。\n\n我之前的战争，是为了打碎那个名为守护者的、由孤独和牺牲铸成的、该死的牢笼。我以为只要夺走了她们的剑，她们就能学会如何去拥抱生活。可我忘了，一个习惯了在风暴中飞翔的鸟儿，是无法在金丝笼里找到快乐的。我剥夺了她们战斗的‘宿命’，却没有给予她们……一个新的、‘活着’的理由。”"

PAO_qssn: "骑士与魔法少女"
PAO_qssn_desc: "“我翻开了那本，我曾为孩子们写下的、关于我们的童话书。故事里，骑士与魔法少女并肩作战，战胜了巨龙。可现实呢？我击败了她们，将她们变成了需要被‘保护’的对象。这不对。真正的朋友，从来不是一方对另一方的施舍，是在看清了彼此的所有伤痕与不完美之后，依然选择，将自己的后背，交给对方。\n\n我必须先切除她们身上那个名为‘宿命’的毒瘤，哪怕这会让她们流血，会让她们憎恨我。因为只有这样，我们才能站在一片平等的、干净的土地上，重新开始。现在，手术结束了。是时候，为她们，也为我们，缝合伤口了。我将邀请她们，不再作为被庇护者，是作为‘导师’，加入我们的军队。她们将教我的骑士，如何仰望星空；而我的骑士，将教她们，如何脚踏实地。”"

PAO_zdsy: "斩断循环的誓约"
PAO_zdsy_desc: "“现在，我终于明白了。她们的悲剧，源于那个从一开始就充满了欺骗的‘契约’。那个让少女用灵魂换取奇迹，又在奇迹燃尽后，将她们变为新的诅咒的、残酷的循环。过去，我天真地以为，只要让她们不再战斗，就能‘拯救’她们。现在我知道，那只是治标不治本。只要那个循环还在，悲剧就永远不会结束。\n\n那么，就让我们，去挑战那个……制定了规则的‘神明’吧。我不知道它的名字，也不知道它在哪里。但我知道，它一定有一个源头。我将集结我们所有的力量——‘野火’的智慧，‘夜莺’的魔法，以及魔法少女们那足以撼动因果的‘愿力’。我们将一起，踏上一场……为了修正世界法则的、真正的屠龙之旅。这一次，我们不再是为了写下一个幸福的童话。我们是去……撕碎那本，从一开始，就写满了悲伤的、该死的剧本！”"

PAO_wehl: "瓦尔哈拉的邀请函"
PAO_wehl_desc: "“在中美洲那片被迷雾笼罩的土地上，有两个我必须要去拜访的邻居。一个是瓦尔哈拉社的同志们，晓枫的笔记里说，她们是另一群和‘野火’一样，勇敢地对抗着黑暗的英雄。我应该为她们送去最香甜的蛋糕和最诚挚的邀请函，邀请她们，加入我们这个‘为了让所有童话都有幸福结局’的大家庭。\n但是……如果，如果英雄们已经倒下，那片土地被一个叫做‘魔女之树’的坏蛋占据了呢？童话书里说，当公主的花园被邪恶的荆棘侵占时，骑士就不能再送出邀请函了。她应该……拔出她的剑，去为那些被荆棘刺痛了的朋友们，讨回一个公道。所以，去看看吧。看看那里等待着我们的，究竟是温暖的茶会，还是……一场不得不打的‘屠龙之战’。”"

PAO_bfdt: "北方的灯塔"
PAO_bfdt_desc: "“地图的更北方，在那片广袤的、据说是由钢铁和梦想构成的土地上，也生活着我们的邻居。我从索拉娜的记忆，和‘野火’的档案里，读到了她们的故事。那里，也曾有过和我们一样的‘火焰’，也曾有过为了面包和尊严而发出的呐喊。\n我不知道，现在那里的故事，进行到了哪一页。如果，那里的人民已经成为了自己故事的主人，如果那里的灯塔，已经为所有劳动者而亮起。那么，我们就要派出最盛大的使团，去告诉她们，她们的歌声，我们在南方也听到了，我们愿意和她们，成为共同照亮整个黑夜的星辰。\n但如果……那里的灯塔依然昏暗，人民的歌声依然被金钱的噪音所淹没。那么……我的剑会告诉那些占据了灯塔的‘守塔人’，光，是属于所有人的，而不是她们用锁链就能囚禁的私有财产。”"

PAO_mzhc: "美洲大合唱"
PAO_mzhc_desc: "“你看，莉莉安娜。我们的家，变得好大好大。从南方的火地岛，到北方的五大湖，到处都飘扬着我们共同的旗帜，到处都能听到我们共同的歌声。瓦尔哈拉社的英雄们，教会了我们神圣的力量；北方的同志们，让我们看到了工业的脉搏；而我们，则为这片古老的大陆，带回了它失落已久的、关于‘童话’的梦想。\n现在，我们不再是孤单的骑士、迷茫的英雄，或是被遗忘的人民。我们是……一个声音。一个，在旧世界的废墟之上，共同唱响的、属于新美洲的、嘹亮的合唱。这歌声，将跨过海洋，传到世界的每一个角落。它将告诉所有还在哭泣的人们——\n\n别怕。\n\n我们来了。”"

PAO_xxzh: "远方的星星之火"
PAO_xxzh_desc: "“晓枫的笔记里，夹着一张很旧的东方航海图。在图的尽头，那片古老的大陆上，她用红笔画下一个小小的、摇曳的火苗标记，旁边写着：‘她们和我们一样。’\n我找来了所有关于那片土地的报告。我读到了长征，读到了雪山与草地，读到了窑洞里的灯火。我看到了一群和‘野火’一样，从最贫瘠的土地里生长出来的人民军队。她们的领袖说：‘星星之火，可以燎原。’\n这束火苗，正被两股黑暗的风暴——内部腐朽的旧政权和外部残暴的樱花帝国——夹击着。我必须看到它。童话书里说，当一个英雄在远方孤军奋战时，另一个英雄，就应该跨过千山万水，去为她点亮前方的道路。”"

PAO_yjzd: "游击战的另一课"
PAO_yjzd_desc: "“我以为，我已经从‘野火’那里，学到了游击战的全部，直到我读到了她们的战术。她们说：‘存人失地，人地皆存；存地失人，人地皆失。’她们说：‘你打你的，我打我的。’\n这是一种我从未见过的智慧。它像水，像风，像这片古老土地本身一样，充满了耐心与韧性。她们将整个国家的人民，都变成了战争的参与者，将广阔的乡村，都变成了侵略者深陷其中的泥潭。\n索拉娜的记忆告诉我，樱花帝国是一头武装到牙齿的猛兽。用骑士的方式与它决斗，显得有些直接。我想……如果我能学会她们的这种‘魔法’呢？如果，我能用我的舰队，为她们创造出更多可以迂回的‘河流’与‘湖泊’呢？”"

PAO_llty: "一轮红日照青天"
PAO_llty_desc: "“她们胜利了。那颗曾像星火一样微弱的光，如今已在那片古老的大陆上，升成了一轮真正的、温暖的、属于人民的太阳。今天，她们的使者来到了我们的城堡，她们带来的，是一担沉甸甸的新收获的小米，和一本由她们的领袖亲手写下的、关于‘实践’与‘矛盾’的书。\n使者说：‘我们的领袖说，送再多的黄金，也不如送去能种出粮食的种子。讲再多的道理，也不如把实践的方法交到同志的手里。’\n我看着那本充满了智慧的书，又看了看那些朴实的金色米粒。我突然明白了。我们是同一轮太阳，在世界的东西两端同时升起，共同照亮了这片曾被黑暗笼罩了太久的广阔天空。现在，是时候让这两道光芒汇合在一起了。”"

PAO_yykz: "§L无名的低语§!"
PAO_yykz1: "§t为了胜利！再冲一次！我的血是热的，连骨头都在唱歌！指导员说战斗已经结束，骗子！我亲眼看到那面旗子还在飘！那不是幻觉！懦夫才需要休息，真正的战士，死在冲锋的路上，就是回家！看啊，那座山头……它在呼唤我……§!"
PAO_yykz2: "§t你怎么能要那块糖！你是英雄的女儿！你的血液里流淌着光荣！你怎么能为了这点甜味就忘记了我们吃过的苦！不行，我必须让你记住！记住饥饿的滋味！记住我们是如何从泥地里站起来的！别哭，别用那种眼神看我！我是在爱你！是为了让你……成为一个纯粹的人……§!"
PAO_yykz3: "§t压力表已经爆了，我知道！炉心快要融化了，我也知道！但你们这群胆小鬼懂什么！我们的钢铁产量，就是我们对牺牲同志们最好的悼词！我们多炼一吨钢，她们的墓碑就更亮一分！我们今天的极限，就是明天的起点！为了更高的产量！为了……那片……刺眼的白光……§!"
PAO_yykz4: "§t我爱她，所以我必须揭发她。她昨晚居然偷偷地读一本旧时代的小说！那是毒草！是糖衣炮弹！会腐蚀她革命的意志！为了把她从堕落的边缘拉回来，我必须向组织报告！对，我没有做错！我是为了拯救她的灵魂！为什么……为什么她看我的眼神，像在看一个怪物……§!"
PAO_yykz5: "§t不能停，我还能再开垦一亩地。我一闭上眼，就仿佛能看到那些饿死的乡亲们，就站在地头，直勾勾地看着我。她们在问我，地，够了吗？粮食，够了吗？她们还没吃饱啊！我还能干！我的腰还没断！只要还能为她们多种一粒米，就算累死在这地里……也值……§!"
PAO_yykz6: "§t为什么不准我写新的旋律！你们说我的音乐太悲伤，会动摇军心！你们这群蠢货！真正的革命，从来就不是只有高昂的战歌！它还有眼泪，有牺牲，有我们每一个普通人的痛苦！如果连痛苦都不敢正视，那你们赞美的光荣，全他妈是假的！我的这首安魂曲……必须……被听见……§!"
PAO_yykz7: "§t我是第五号传动齿轮，我的任务就是确保这台机器永不停歇。磨损？疲劳？那是生了锈的零件才有的属性！我的意志是革命的！是无穷无尽的！什么？桥梁结构出现了金属疲劳？不可能！那是你们的思想出了问题！我们的桥，和我们的信仰一样，是永不崩塌的！你们看……§!"
PAO_yykz8: "§t孩子们，再跟我念一遍！我们的历史，是完美的，是光辉的，是没有任何错误的！那些说我们的英雄也曾迷茫过的书，都是谎言！都是敌人恶毒的诽谤！我们的英雄，生来就是英雄！她们的每一步，都踏在正确的道路上！我们必须……用最纯粹的信仰，去守护这份纯粹的历史！绝不容许一丝……杂质……§!"
PAO_yykz9: "§t我终于抓到她了，最后一个思想不纯洁的人。就是我自己。我昨晚梦见了我的妻子，我居然……想她了。这是最危险的个人情感，是革命肌体上的毒瘤。为了我们事业的绝对纯洁，为了不再有下一个像我这样的动摇者。我必须……亲手，切除这个肿瘤……§!"
PAO_yykz10: "§t她们说露西莉亚殿下病了。我不信。她只是……被我们这些不够努力的人，气病了。如果我们再拼命一点，如果我们再光荣一点，如果我们每个人，都能变成她故事书里那个最完美的英雄，她一定会重新对我们微笑的！队长说矿井快塌了，让他滚蛋！塌了正好！正好让我们用生命，来证明我们的忠诚！为了殿下的笑容！§!"
PAO_yykz11: "§t这条街道，必须是绝对笔直的。那个为了照顾老人而提出的拐弯建议，是对我们完美规划的玷污！革命的道路上，不容许任何妥协和弯路！为了这座城市的绝对完美，为了让它成为一座几何学上的丰碑，任何阻碍，都必须被铲除！哪怕……那是一座住满了人的……老房子……§!"
PAO_yykz12: "§t磨坊不再磨麦，它在磨着骨头，\n铁匠不再打犁，他把铁锤砸向自己的额头。\n我们高唱着昨日的战歌，声音大到听不见胃在吼，\n可我摸了摸自己的口袋，除了枚生锈的奖章，还是一无所有。\n\n他们说英雄的鲜血，能让荒地长出面包，\n可我看见英雄的母亲，正为了半块面包跟野狗撕咬。\n他们说光荣的过去，是我们唯一的解药，\n可我他妈的明天在哪？谁能给我一张回家的车票？\n\n露西莉亚，你坐在云端之上，是否也听到这荒唐的歌谣？\n我们用自己的血肉，为你扮演着你最爱的配角。\n这剧本真他妈的好啊，好到连哭泣都得带着微笑，\n可我只想……在下一个黎明到来之前，把这该死的吉他……亲手砸掉。§!"

PAO_jejc: "饥饿的剧场"
PAO_jejc_desc: "§L“镜子碎了。我也碎了。当我得知自己只是一个‘冒牌货’，一个吞噬故事的怪物时，我胸膛里这颗‘心’，似乎也终于……撕下了它所有的伪装。它不再满足于模仿英雄，也不再满足于扮演公主。它开始，将整个国家，都变成了它那饥饿的、巨大的剧场。我看到，城市里的人们，开始不由自主地，重复着那些……被我‘解放’的故事。农民们会突然放下锄头，高喊着‘野火’的口号，向着风车发起冲锋；工人们会在深夜里，一遍又一遍地，重演着推翻旧监工的戏剧，直到精疲力竭。甚至，那些曾被我治愈的魔法少女，她们的眼中，也重新燃起了战斗的火焰。但她们是为了……一遍又一遍地，在我面前，上演着骑士拯救少女的、永不落幕的剧目。她们都在笑，都在哭，都在为了那些……早已结束的故事，而流着真实的血。她们……变成了我胸中这颗‘心’的提线木偶。而我，这个最完美的‘冒牌货’，只能站在这座……正在上演着无数悲剧的、巨大的舞台中央，眼睁睁地看着这一切。听着那颗正在我胸膛里，因为吞噬了新的‘故事’而发出的、满足的……心跳声。”§!"

PAO_wmgm: "完美的革命"
PAO_wmgm_desc: "§L“情况变得更糟了。人民的‘戏剧’不再是混乱的即兴表演，它开始变得……‘完美’。在夜莺之心的影响下，她们自发地修正着彼此的行为，剔除所有不符合历史的瑕疵。一个在‘巷战’中退缩的演员，会被身边的人，用最革命的言辞，批判为‘懦夫’；一个在分田地的场景里，多拿了一份道具的农民，会被众人，以‘人民的名义’，流放到舞台的边缘。她们正在将那段充满了鲜血、妥协与无数错误的真实历史，一点点地，提纯、美化，最终，变成一本……绝对光荣、绝对正确，却也绝对虚假的教科书。而我，这个唯一的知情者，却成了这场‘完美革命’里，唯一一个不完美的、多余的污点。我听到她们开始在私下里耳语：‘我们的领袖，为何不像书里的英雄那样，永远不知疲惫，永远慷慨激昂？’”§!"

PAO_mrzs: "明日之死"
PAO_mrzs_desc: "§L“我终于明白了，这颗‘心’真正吞噬的，到底是什么。它吞噬的是未来。当所有人都沉浸在对过去那场完美革命的无限复刻中时，社会的一切发展，都停止了。新建的工厂，因为工人们正忙于‘罢工’的表演而无人开工；新铺的铁路，因为工程师们正沉迷于‘攻克技术难关’的戏剧而无人维护；甚至连田地里的庄稼，都因为农民们正在重演‘武装夺取打谷场’的剧目而无人收割。我们不再创造，不再思考，不再向前。我们只是……在消耗。消耗着真实革命留下的最后一丝物质遗产，去为一场虚假的、永不落幕的戏剧，提供燃料。我们正在以一种最光荣、最正确、最充满革命激情的方式……集体走向死亡。而那颗在我胸膛里的心脏，正为此而愉悦地、有力地跳动着。”§!"

PAO_cwxx: "我的故事从未写下"
PAO_cwxx_desc: "§L“她问我，准备模仿谁。我无法回答。因为我书架上所有的英雄故事，都已经变成了这场悲剧的剧本。晓枫的智慧，成了僵化的教条；雪伊的愤怒，成了无意义的表演。我模仿的每一个光辉形象，都只是为我胸膛里的那颗‘心’，提供了更丰富的食粮。那么，当所有的英雄之路都已通向毁灭时，我还能走向何方？我看着镜中那个被称为‘英雄赝品’的、空洞的自己，第一次，撕毁了所有的剧本。如果模仿英雄，只会让我们走向灭亡，那么从今天起，我将不再模仿任何人。我将成为一个……她们从未教过我，书上也从未写过的角色。一个，敢于向舞台本身，向那个正在我胸膛里欣赏着一切的‘观众’，拔剑的……‘背叛者’。”§!"

PAO_zhyk: "最后一课"
PAO_zhyk_desc: "§L“我找到了晓枫。在她那间堆满了书籍和地图的办公室里。我没有再寻求她的指导，只是将那面破碎的镜子，和我胸膛里那颗‘心’的真相，全部告诉了她。我以为她会震惊，会恐惧。可她只是静静地听完，然后，从书架的最顶层，取下了一本……非常薄的小册子，递给了我。那不是战术纲要，也不是哲学理论。那是一本……儿童识字课本。‘这是我教给孩子们的第一课，也是……我能教给你的，最后一课。’她翻开第一页，上面只写着一个歪歪扭扭的字——‘我’。‘你看，’她说，‘这个字，是所有故事的开始。你模仿了我们所有的人，却唯独……忘了模仿一个，最普通的、会痛、会犯错、会迷茫的……你自己。’‘所以，别再想着模仿谁了。去成为……那个，当所有英雄都倒下后，依然选择，站起来的……第一个，也是唯一一个的‘我’吧。’我看着那个简单的字，突然明白了。我的最终决战是为了……夺回成为‘我’自己的权利。”§!"

PAO_wscn: "无声的承诺"
PAO_wscn_desc: "§L“我来到了那片……我们曾一起种下向日葵的山坡。我找到了雪伊。她正独自一人，坐在那座无名的墓碑前，擦拭着一块已经褪了色的、属于晓枫的军徽。我没有说话，只是在她身边，静静地坐了下来。许久，我才将那面破碎的镜子，和我胸膛里那颗‘心’的真相，告诉了她。她听完，没有任何反应。她只是，继续擦拭着那块军徽，仿佛这个世界上，再也没有什么，能让她感到惊讶了。‘……然后呢？’她终于开口，声音沙哑，像两块石头在摩擦，‘……你想怎么做？’我说，我不知道。我说，我可能……会和这颗心，一起，从这个世界上消失。她停下了手中的动作。她转过头，那双早已被灰烬覆盖的眼睛，第一次，认真地，看着我。‘……不行。’她说。‘……你不能死。’她将那块被她擦得温热的军徽，塞进了我的手里。‘……这个世界上，还记得她的人，不多了。’‘……所以，你必须活着。’‘……然后，带着她，一起，去看那片……她没能看到的、向日葵花开。”§!"

PAO_zhjb: "最后的剧本"
PAO_zhjb_desc: "§L“我已找到了我的道路。无论是为了成为我自己，还是为了一个无声的承诺，我都必须终结这一切。我不再迷茫，也不再恐惧。我开始冷静地，回顾我所模仿过的每一个角色，分析她们每一个行动的逻辑，剖析她们每一分力量的来源。我将利用这颗‘心’赋予我的、最完美的模仿能力，为它，也为我自己，写下这最后一个剧本。一个……以‘解放’为名，将它从我的身体里，彻底驱逐出去的、盛大的剧本。\n舞台，已经备好。\n演员，也已就位。\n而这一次，\n§t导演，是我！§!”§!"
PAO_zhjb2: "最后的剧本"
PAO_zhjb2_desc: "§L“我已找到了我的道路。无论是为了成为我自己，还是为了一个无声的承诺，我都必须终结这一切。我不再迷茫，也不再恐惧。我开始冷静地，回顾我所模仿过的每一个角色，分析她们每一个行动的逻辑，剖析她们每一分力量的来源。我将利用这颗‘心’赋予我的、最完美的模仿能力，为它，也为我自己，写下这最后一个剧本。一个……以‘解放’为名，将它从我的身体里，彻底驱逐出去的、盛大的剧本。\n舞台，已经备好。\n演员，也已就位。\n而这一次，\n§t导演，是我！§!”§!"
