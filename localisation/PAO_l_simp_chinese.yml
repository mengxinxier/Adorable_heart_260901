PAO_end_title: "§1接着，童话讲到了最后一页§!§!"
PAO_end_tip: "她的身体……好凉，好轻，像一捧……随时都会被风吹散的、冰冷的月光。“……露西莉亚。”她的声音，就在我的耳边。那么近，却又那么遥远。“……我……我不想睡……”她的声音，第一次，带上了……浓得化不开的、孩子气的哭腔。“……我还想……我还想听你，给我讲下一个故事……我还想……再和你一起，去一次海边……”她抱得更紧了，仿佛想用尽最后的力量，把我，刻进她的灵魂里。“……我好不容易……才刚刚学会，‘开心’，是什么味道的……我好不容易……才终于有了一个，可以每天都看到太阳的、温暖的家……”“……我……我不想走……我不想……”无数光点，从她的身上，加速地逸散开来。“……露西莉亚……”她用尽最后的力量，捧起了我的脸。“……答应我，好不好？”她的声音，变成了一种……最绝望的、也是最温柔的哀求。“……不要……忘记我。”“……就算以后，你有了新的朋友，听了新的故事……也……偶尔，偶尔，要想起……”\n§1……曾经，有一个很笨很笨的亡灵公主……\n……很爱很爱……很爱很爱……你啊……§!"
PAO_end_tip_2: "感谢您对钢铁萌心与夜莺之国内容的喜爱与支持！\n愿每一个人的童话故事，最终都能迎来最美好的结局"
PAO_end_close_button: "§t晚安，公主殿下§!"
PAO_end_close_button_TT: "§L……我永远，永远，也不会忘记。§!"

PAO_end_title2: "§t接着，故事翻开了新的一页§!"
PAO_end_tip2: "“我指了指门外那两朵开得最灿烂、挨得最近的向日葵。就要她们吧。”\n“好嘞！”\n女孩转身去包花的时候，莉莉安娜悄悄地，在我的耳边说：“你看，露西莉亚。”“她，终于，学会为自己而活了。”“她终于，拥有了一个……只属于她自己的、小小的、吵闹又温暖的……人间。”\n我胸膛里那颗崭新的、属于我自己的心脏，正为了眼前这幅……我曾以为，永远也无法得见的画面，而有力地、温暖地，跳动着。\n女孩转过身，将那两束代表着过去与未来的花，递到了我们面前。“给！”她笑着说，“希望她们，能带给你们一天的好心情！”\n我伸出手，接过了那束……属于“明天”的花。而莉莉安娜，则接过了那束……属于“昨天”的花。\n然后，我们相视一笑。\n那个困扰了我到现在的、关于“梦”与“现实”的问题，在这一刻，终于，有了答案。"
PAO_end_tip2_2: "感谢您对钢铁萌心与夜莺之国内容的喜爱与支持！\n愿每一个人的童话故事，最终都能迎来最美好的结局"
PAO_end_close_button2: "§t那么，下次再见§!"
PAO_end_close_button2_TT: "§L因为我们的故事，才刚刚开始啊。§!"
