PAO_rmzd_tt: "£GFX_PAO_xingxing 解锁以下§Y两个§!§t针对§Y特定国家§!的决议§!：\n\n§Y£GFX_PAO_rmzd_target 绝不动摇的誓言§!\n§L“当巨龙的阴影遮蔽天空，当我们的力量看似渺小时……不要忘记，我们身后，就是整个春天。我们退无可退，也无需再退。”§!\n£GFX_trigger_yes §Y显示§!及§G可用§!条件:\n - 该国与我们处于战争状态\n - 该敌对国家的陆军师数量 §R大于§! 我方\n\n§Y£GFX_PAO_rmzj_target 黎明的邀约§!\n§L“我们已经让足够多的母亲流泪了。现在，剑锋所向，应是她们孩子身上的锁链，而非咽喉。每一次挥舞，都应是为了让一个本该为敌的人，能重新拥抱她的家人。”§!\n£GFX_trigger_yes §Y显示§!及§G可用§!条件:\n - 该国与我们处于战争状态\n - 对该敌对国家造成的总伤亡数 §G大于§! §Y721k§!"

PAO_mbqw_tt: "£GFX_PAO_xingxing 解锁以下§Y一个§!§t针对§Y特定国家地区§!的决议§!：\n\n§Y£GFX_PAO_mbqw_target 面包与蔷薇§!\n§L“我们来到这里，不是为了征服。我们只是想告诉你们，在一个没有压迫的世界里，生活本该有的两种味道：一种，是面包的温暖，它告诉我们，再也无需忍受饥饿；另一种，是蔷薇的芬芳，它提醒我们，活着，是为了追寻更美的东西。”§!\n£GFX_trigger_yes §Y显示§!及§G可用§!条件:\n - 地区是该国的§Y核心§!\n - 是我们的§Y控制或拥有§!地区\n - 该地区的顺从度 小于 §Y60%§!\n - 该国和我们处于战争中\n - 地区不是我们的§Y核心§!"

PAO_zhjs_tt: "£GFX_PAO_xingxing 解锁以下§Y一个§!§t针对§Y特定国家§!的决议§!：\n\n§R£GFX_PAO_zhjs_target 每一个名字的重量§!\n§L“她们倒下了。她们的家书，如今成了遗书，她们的诺言，成了我们还不清的血债。\n\n我们不能让她们的牺牲，仅仅变成史书上一行冰冷的墨迹！更不能让她们用生命守护的家人，在我们身后，流着眼泪忍受饥寒！\n\n现在，让我们把眼泪擦干。将这份足以压垮脊梁的悲伤，变成我们手中最滚烫的钢铁！去为生者，建造更温暖的家园！去为死者，刻下永不磨灭的姓名！”§!\n£GFX_trigger_yes §Y显示§!及§G可用§!条件:\n - 该国与我们处于战争状态\n - 该国对我们造成的人员伤亡 §R大于§! §Y10k§!"
PAO_mqjj_tt: "£GFX_PAO_xingxing 解锁以下§Y一个§!§t针对§Y特定国家§!的决议§!：\n\n§Y£GFX_PAO_mqjj_target 同一个家里，不说两家话§!\n§L“我曾问过一位导师，如何才能将许多不同的小溪，汇成一条真正的大河？\n她告诉我：‘孩子，你不能强迫它们流向同一个方向。你要做的，是挖深那条最终将容纳所有溪流的河道，让每一条小溪都能看到，奔向那里，是更广阔、更光明的选择。’\n现在，我们已经拆除了那些隔开我们的、旧世界的篱笆。但我们依然生活在各自小小的院子里，说着只有自己能懂的悄悄话。这不行。\n我们要做的，是共同建造一座属于我们所有人的、更大、更漂亮的‘家’。在这个家里，大家可以一起吃饭，一起读书，一起为了让屋顶不漏雨而努力。当‘我们’的故事，比‘我’自己的故事更精彩时，我们自然，就成了一家人。”§!\n£GFX_trigger_yes §Y显示§!及§G可用§!条件:\n - 该国是我们的§Y附属国§!"
