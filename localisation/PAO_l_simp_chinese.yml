PAO_gzdrx: "公主最后的任性"
PAO_gzdrx_desc: "“她……并不擅长战争。\n她所有的知识，都来自于那些古老的、关于英雄与骑士的童话书。\n当那些……充满了火焰与愤怒的‘野火’，用她无法理解的方式，将她逼入绝境时……\n这位孤独的公主，或许，会用她最后的力量，去呼唤那些……沉睡在冥界最深处、连她自己都感到畏惧的、真正古老的力量。\n这只是……一个害怕失去心爱之物的孩子，在绝望之中，所能使出的、最后的……也是最危险的‘任性’而已。”\n§Y此为夜莺王国临时适配决议将会在后续版本中进行移除§!"
PAO_gzdrx1: "公主最后的任性"
PAO_gzdrx1_desc: "“她……并不擅长战争。\n她所有的知识，都来自于那些古老的、关于英雄与骑士的童话书。\n当那些……充满了火焰与愤怒的‘野火’，用她无法理解的方式，将她逼入绝境时……\n这位孤独的公主，或许，会用她最后的力量，去呼唤那些……沉睡在冥界最深处、连她自己都感到畏惧的、真正古老的力量。\n这只是……一个害怕失去心爱之物的孩子，在绝望之中，所能使出的、最后的……也是最危险的‘任性’而已。”\n§Y此为夜莺王国临时适配决议将会在后续版本中进行移除§!"
PAO_wmsq_tt: "§1莉莉安娜公主将立即召集一支强大无比的亡灵亲卫与四支亡灵侍卫，并将在随后一年中持续召集亡灵亲卫与侍卫，但它们将在一年后彻底消散...§!"

PAO_transfer: "获得§Y[FROM.Getname]§!占领地区的核心"
PAO_nalaibani: "要求别国交出莉兰迪亚"
PAO_laibangmang: "扑灭野火的星光"
PAO_laibangmang_desc: "“那些孩子……她们太吵了。她们在平原上点燃了火焰，自以为那是希望，却不知道那灼热的温度，正在烫伤这个本就脆弱的世界。\n那么，请看看这漫山遍野的焦土吧。在我的眼里，那不是黎明，那是大地痛苦的伤痕。\n我请求你们,不管你们是谁，请用你们璀璨的星光，来协助我冰冷的月光。让我们一起……在那场大火将一切美好都烧成灰烬之前，温柔地，让她们……安静下来。”"
PAO_laibangmang2: "请求魔法少女的协助"
PAO_laibangmang2_desc: "请求魔法少女协助一同对抗帝国。"
PAO_BACK_PAM2: "§t骑士的童话§!"
PAO_BACK_PAM2_desc: "§L§t第一章§!，是启程。我们要先找到那些还在黑暗里哭泣的人们，告诉她们，英雄的故事，已经开始了。\n§t第二章§!，是挑战。我们要带着她们的祝福，去寻找那些让她们流泪的“巨龙”。\n§t最终章§!,我们要为这个，我们亲手写下的故事，画上一个所有的人，包括那些被我们打败的“坏蛋”，都能一起迎来幸福的、最完美的结局。§!"
