PAO_mbqw2: "面包与蔷薇"
PAO_mbqw2_desc: "“我问晓枫的笔记，战争时期，什么最重要？笔记说：‘是面包，让人民活下去。’我又问莉莉安娜的童话书，什么最重要？书上说：‘是蔷薇，让人们拥有希望。’她们说的都对。所以，我们的后勤车队，不仅要为前线送去弹药，也要为每一个被战火波及的村庄，送去足够过冬的面包。并且，在每一个面包袋上，都要系上一枝小小的、永不凋谢的水晶蔷薇。我要让所有的人民知道，我们为之奋战的未来，既有温暖的饱足，也有美丽的梦想。”"

