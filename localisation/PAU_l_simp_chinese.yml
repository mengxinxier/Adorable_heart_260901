PAU_wl_anti: "亡灵的反扑"
PAU_wl_anti_desc: "徘徊在阴影里的亡灵正试图用污浊的死气污染白夜去过的任何地方。我们要是不加紧清剿的话，好不容易恢复生机的地区便会再度被死亡笼罩的。"

####民族精神###
PAU_baiye_state: "灵兽庇护"
PAU_baiye_state_desc: "这片土地还残留着那个白毛小家伙蹭过的痕迹。灵气驱散了空气中残留的腐臭，连带着让担惊受怕的居民们也感到了安心。随着街坊邻里纷纷在路口摆上神龛与点心，这种朴素的喜爱逐渐凝聚成一股温暖的庇护，守护着每个人的安宁与幸福。"
####国策与事件####
#政治线国策v 
PAU_tx: "又是……欠条！"
PAU_tx_desc: "王室送来的信件写得明明白白，结款的日期又被那帮狗东西往后推了。\n大家现在都空着肚子，脾气自然好不到哪去。可要是现在撂挑子走人，这里的营地立刻就得散伙，我们谁都不想同时被王室和晓枫一起追着咬。于是只能先把催款信塞回抽屉，顺便交代炊事班往汤锅里多舀几勺水，先把接下来这顿饭应付过去再说。"

PAU.1.t: "请问这里是饭馆吗"
PAU.1.d: "“王室送来的又是欠条。”副官递过来中午的面饼，表面烤得焦黄发硬，掰开时掉落了些许碎渣：“他们让大家多体谅一下，再等两周。”我咬着干硬的饼皮，就着水壶里的凉水咽了下去：“体谅又不能当饭吃。”\n远处的山谷里，晓枫那些人的营地隐隐约约能看到一点影子。当初分道扬镳的时候，她跟我吵了一架，说我们迟早会被王室当成擦过桌子的抹布给扔了。现在看来，倒真让她给说中了。\n我正琢磨着下个月的伙食费从哪抠的时候，门岗上的铃铛响了起来。\n“长官，门口来了个怪人。”\n“怪人？”\n我放下碗，朝营区大门走了过去。\n站在路障外面的既不像王室的信差，也不像山里的游击队探子。\n那是个背着旅行包的白发少女，肩头趴着一只雪白的类似小猫一样的生物，正东张西望地打量着哨塔上的掩体。周围几支上了膛的步枪正对着她，她却跟没看见一样，高高兴兴地冲我挥起了胳膊。\n“打扰啦——！”\n她几步蹦到栏杆前把双手搭在了上面，笑得特别灿烂。\n“我顺路走了好久好久，终于找到有活人在地方啦。对了！我好饿啊！……请问这里有食堂吗？能分我点东西吃吗？我有带钱的。”\n这番话一出，整个营地门口瞬间就安静了下来。\n值班的卫兵端着枪愣在那儿，看我也不是，看她也不是。\n在这个除了火药味就是欠条的鬼地方，居然有人把兵营当成了路边的饭馆？"
PAU.1.a: "“把枪放低，让她进来吧。”"

PAU.2.t: "另一种可能"
PAU.2.d: "“如果换做是王室的军队，我估计你已经被当成探子给抓起来毙了。”我对着用勺子在碗里刮过了最后一圈的白发少女打趣道。\n少女把碗里的菜叶吃得干干净净，像是没听见我刚才的话一样，抽出手帕擦起嘴角。就连她肩上趴着的那只小动物也换了个舒服的姿势，眯着眼睛打起了呼噜。\n“多谢款待。虽说除了盐味就没尝出别的，但喝下去浑身都热乎起来了呢。”\n她抬起头，看着我的眼神变得锐利了起来。\n“其实王室答应给你们拨过来的口粮，上周就已经在海港被扣下了。”\n我刚点上烟的手悬在空中停住了。\n“运粮船根本就没装麦子，甲板底下装的都是给内廷贵族过冬用的葡萄酒和熏肉。那些大臣给你们寄欠条，无非是想把你们钉在防线上，替王都挡住山里的游击队罢了。”\n少女双手交叠托着下巴，像是在讨论明天该吃什么一样继续说道：\n“山谷那边的晓枫正在静待时机，就等着你们的库存见底。只要你们饿得拉不开枪栓，她的队伍就会顺着公路反攻过来。”\n食堂窗口那边还传来士兵们敲饭盆的吵闹声，可我面前这张桌子上的空气却冷得像结了层霜。\n“谁派你来的？”我终于开口问道。\n“没人派我来呀。”少女眨了眨眼睛，“我只是从东边的大岛一路乘船过来，顺路看看当年名声响亮的无国界军团，如今落魄到了什么地步。”\n她伸手指向窗外那些蹲在台阶上喝汤的年轻士兵。\n“老军团长不在了，晓枫也带着人走了。留在营地里的这些人，既没有可以效忠的祖国，也拿不到卖命的赏钱，只能每天守着空枪饿肚子，不是吗？”\n少女收起手帕，直视着我的眼睛：\n“阿夏长官，你打算带着大家在这里坐着等死，还是换个真正有出路的活法？”"
PAU.2.a: "“……说说你的条件吧。”"

PAU.3.t: "谁要给外人当枪使"
PAU.3.d: "“换个雇主？”我把空碗推到了一旁，“是去给你们东边的天皇卖命，还是给海上的殖民者当看门狗？”\n“都不对。”\n少女摇了摇头，从风衣内兜里掏出一张叠好的路线图，直接在桌面上摊了开来。\n“给别人卖命，迟早会被当成耗材扔掉。晓枫是对的，你们老团长也是对的，只有傻子才会一直给外人当枪使。”\nn她伸手按在沿海公路的一处岔路口上，那是王室用来中转出口物资的军需仓库。\n“他们既然不发军饷，为什么还要替他们守门？那里的仓库里囤着能吃几个月的麦粉和肉罐头，还有几大罐准备运往海对面的燃油。”\n少女抬起眼眸，那只小白兽跳到了桌面上，蹲在地图边缘舔起了爪子。\n“动了王室的仓库，那我们就成和晓枫一伙的了。”我说。\n“明明是他们先赖账的。”少女说得理直气壮，“雇佣契约上白纸黑字写着拿钱办事。既然他们连饭都不给，你们自己去后厨端菜也是天经地义的吧？”\n此时此刻，在两人对话的屋子外面，巡逻队的脚步声从走廊经过，换岗的哨兵正在交接佩枪。\n“抢了之后呢？”我问，“就算能撑过这阵子，等王都的火炮和山里的游击队两头包夹过来，我们照样无路可走。”\n“那就去港口。”少女在地图最东边的港口画了一个圆圈，“我在外海有接应的船队。只要占下码头，打通去东边的航线，这里就没人能围得住你们了。”\n她收回手指，看着我：\n“到时候你们就是一支自己说了算的队伍。有饭吃，有油用，还能把武器换成机床零件有一套自己的产线。”\n我低头看着被茶水浸湿一角的路线图，耳边是走廊里又一次响起的哨音。\n蹲在这里是饿死，退回王都也是死路一条。\n“……图纸留给我。”我站起身，把军帽扶正，“等天黑了，我叫几个队长过来开会。"
PAU.3.a: "“另外，要是敢耍花招，\n我第一个请你吃枪子。”"

PAU_qxjd: "不借也得借"
PAU_qxjd_desc: "卡卡罗姆矿区是去往东部公路唯一的关口。晓枫不可能把根据地的咽喉让出来，我们也没法放弃那条运粮的活路。现在双方都退到了悬崖边上，我们只能靠大炮和子弹来决定谁能活着走过去了。"

PAU.4.t: "两千码开外"
PAU.4.d: "“距离两千两百码。”\n副官把测距板递给了我。\n“要现在开炮吗，阿夏长官？”\n我举起目镜，望向对面山梁上隐约闪烁的红光。\n晓枫在那座山梁上布设了数不清的火力点。她清楚我们要去抢夺物资，无论这些物资是来自于谁的，我也清楚她不会把这条命脉让出来。\n我们都在为了自己身后那些人的命，把枪口对准曾经最熟悉的人。\n“真要动手啊？就不能谈谈吗？”\n小遥靠在车厢挡板旁，正随手翻弄着手里的路线图。\n“对方是你的同僚吧。”\n“当年的同僚。”我移开目镜，“她带着人进山去搞革命，我留下来替剩下的兄弟姐妹讨口饭吃。从各自挑路分道扬镳的那天起，我们彼此的枪口就再也没法避开了。”\n小遥抬起头，那双红色的眼睛在夜色里很亮：\n“那就别犹豫了。在战场上犹豫，死的可就是相信你的人了。”\n山梁上猛然亮起一串橘红色的火光。一梭子机枪子弹贴着车顶扫过，当场把卡车左边的后视镜打得粉碎。\n这是晓枫正在划出界线。只要我们的车轮再往前滚过哪怕十米，整道山梁的火力就会立刻迎头砸落下来。她办事从来不留任何余地，我也一样。"
PAU.4.a: "“开火。”"

PAU_sdft: "别装老实人"
PAU_sdft_desc: "车库里那些履带车已经停了不知道多久了，车门上还贴着王室盖了红印的白纸封条呢。以前不动它们，是因为燃油不够用，也是为了维系表面上的安分。但如今我们要是想活命的话，就没法再继续装起老实人了。把坦克都开出来吧，不管是王室的还是我们的，能给我们杀出一条路来就行。"

PAU.5.t: "熟悉的声音"
PAU.5.d: "随着老掉牙的起动机接连咳嗽了好几声，它的尾气管终于喷出了浓烈的黑烟。\n车库大门的铁链被拽得哗啦作响，几辆轻型坦克慢腾腾地挪到了空地上，车体侧面的金鹰徽记依旧油光发亮的样子。\n副官手里拎着黑漆桶，踩在挡泥板上问：\n“长官，这老鹰标记……要不要先用油漆抹掉？前面就是晓枫的阵地了，要是让她看见了……”\n“费那劲干什么。”\nn我扣紧防风镜的带子，用被发动机的轰鸣盖得很闷的声音说道：\n“只要引擎声一响，晓枫闭着眼睛都知道来的是什么车。当年这底盘散热孔开多大、每块钢板垫多厚，都是她亲手画的图纸。你就算在车头上画满小花，她也认得出这死动静。”\n副官听完，挠着脖子把漆桶随手挪在了路边，不再言语。\n山梁上的信号火光依旧明亮，透过望远镜看去，山口正上方插着一面崭新的红旗。\n晓枫这会儿肯定也在掩体后面举着望远镜和我们对视呢。\n在她眼里，事实明摆着。当年在工区街道上碾死工人的是这批车，现在开进卡卡罗姆、准备轰开她家大门的，也是这批车。\n“真残忍呢，阿夏，就不能再谈谈吗？”\n小遥两手插在风衣口袋里靠在车棚的柱子旁，用带着点事不关己的语气调侃着：\n“从山上看过来，你们简直就像王室养的最听话的狗呢。”\n“快闭嘴吧你。能谈早谈了，用不着你这黄毛丫头指手画脚。”\n说完，我踩着踏板翻上车顶，弯腰钻进了狭窄的炮塔里。\n随着沉重的金属顶盖砰的一声砸严，风、尘土和草腥味都被隔绝在了外面。\n我拉过通话器的软管，对着麦克风低声开始了吩咐：\n“各车拉开距离，谁也不准熄火掉队。”\n“听到的……就踩紧油门，在我屁股后面跟紧了。”"
PAU.5.a: "现在，我们的大门彻底关上了。"

PAU_sdjt: "在山谷尽头"
PAU_sdjt_desc: "矿区入口的枪声终于停下来了，在我们把路面上的碎石和弹壳清理完后。我怀着复杂的心情来到了扣着晓枫的原本属于矿管的地下值班室里，几个负责看押的卫兵正站在门口等着我的发落。是用她的人头去王室领赏换取口粮，还是带上这个昔日的同僚一起去海港抢货，必须在天亮前拿个主意。"

PAU.6.t: "请松绑吧"
PAU.6.d: "来到地下室，晓枫正坐在靠墙的椅子上，她的两只手腕被麻绳紧捆在椅背后面，额角上的擦伤已经凝成了黑红的血块，但她的脊背依然挺得笔直，冷漠地看着我推门进来。\n“王室开给你的赏金可不低。”我拖过一张折叠椅坐在了她面前，“用你的脑袋换来的钱，足够给后面整支车队加满油吃饱饭了。”\n晓枫笑了一声，一点求饶的意思都没有：\n“那就拿去换呗。当年在艾瑞波拉我就该死在山道上了，多活的这些日子，就当是我赚来的。”\n门轴吱呀响了一声。\n小遥踢开门帘走了进来，肩头的小白兽还在探头探脑地打量四周。她径直走到晓枫背后，还没等我反应过来，她立刻从袖子里滑出一柄小折刀，刀刃一挑，椅背上的麻绳便散落了一地。\n两名卫兵下意识抬起枪口：\n“长官？！”\n“小遥，你干什么！？”我一把按住枪套站了起来。\n就在我拔枪指向她的时候，少女转过了身来，一点都没有害怕的样子，在一个转身的功夫，就解开了风衣内袋的扣子，取出一份盖着红色印章的信函，随手拍在了桌面上。\n那是来自远在东边的樱花国的正式公函。\n“王室的金币你们是领不到了，阿夏长官。”这次遥的声音里没了任何开玩笑的语调，“王都早就被南下的亡灵大军冲垮了，那些大臣眼下正忙着抢车逃命呢。”\n“我坐船出发的时候，议会批下来的调令上统共就写着两个名字。”小遥的视线在我与晓枫之间转了一圈，“一个是军团最后的带队人，一个是懂全盘战术的参谋长。”\n她收回小刀，看向正在活动手腕的晓枫：\n“卡卡罗姆艾瑞波拉这片地是王室预定的弃守区。要是阿夏今天没带队强攻打通山道，再过几天赶到这里的，就是索拉娜的亡灵尸潮。你们谁也逃不掉的。”\n晓枫揉着手腕上的红痕，抬头看向小遥和我：\n“原来你们是这么个借道法啊。”\n我盯着桌上那份印着樱花印章的文件，整个人都变得恍惚了起来。\n“你是真不怕死，就凭你有几艘船？”我对着眼前从一开始就仿佛对莉兰迪亚的状况了如指掌的少女说道。\n“没错！啊对了！还有船上那些够你们军团活上好几个月的物资呢，还有……”\n“停！我知道了，就听你的行了吧。”"
PAU.6.a: "“带上她吧，我们抓紧时间去港口。”"
PAU.6.b: "“带上她吧，我们抓紧时间去港口。”"
pau_wlxz: "§R亡灵将会直接对我们宣战§!"
pau_wljy: "§R亡灵将会以决议的形式蚕食我们§!"

PAU_ddjr: "我们多带几个人吧"
PAU_ddjr_desc: "矿道里还缩着几百号耗尽子弹的工人和伤员。晓枫不肯一个人上车，卡车上的篷布底下也还能再挤一挤。燃油不多，但卸掉后排几箱子弹，就能多腾出位置拉上几个人。至于北边公社的雪伊……只能在电台里给她留个通报，能不能从亡灵嘴里杀出一条路，就全凭她自己的本事了。"

PAU.7.t: "人命与子弹"
PAU.7.d: "晓枫走到门口时却突然停住脚步，转头瞪着我：\n“矿道里还有几百多个伤员和工人，你要把他们全丢在这里等死吗？”\n我拉低了帽檐：“车队装不下这么多人。燃油只够一口气跑到海港，多拉那么多人，大家到时候都得停在路上当靶子。”\n旁边的小遥正整理着风衣领口，笑眯眯地插了一句：\n“樱花的船很大，底舱正好缺一批懂得修机床和装配引擎的熟练工。只要手里还能拿得动扳手，到了那边，我们工钱照付哦。”\n晓枫斜了小遥一眼，随即把目光转向我：\n“听见了吗？他们是机械工，不是扛枪打仗的步兵。缴了他们的枪换成工具箱，这样总能拉上车了吧？”\n我呼出浊气，朝走廊外的副官招手：\n“去通知后排卡车，把弹药箱推下去。拆掉几块挡板，让能走动的全爬进车厢。挤不下的，手把栏杆扶紧了，哪怕掉下车我们也不会减速去捡的。”\n副官应了一声，快步跑去传令。\n我转回身看着晓枫，提起了另一件事：\n“公社那边怎么说？雪伊还在北边的工厂区。卡卡罗姆一丢，索拉娜的尸群顺着铁轨很快就会压过去吧？”\n晓枫走到了窗台前，一把抓过那部快没电的步话机，将频率旋钮拧到了底：\n“我们现在掉头回去，就是白白送死。雪伊不是傻子，看到王都方向的黑烟，她自己就会带人往外突围。”\n她把步话机往窗台最高处一放，直接拉出了天线：\n“把这个留在矿顶的信号塔上，向他们全天循环播报车队的撤退路线和海港坐标。雪伊要是能杀出来，就会顺着车辙印追上我们；要是她杀不出来……我们去了也只是多搭上几条命。”\n晓枫的话音刚落，车库方向就传来了卡车排气管轰鸣的声浪。\n小遥把风衣的扣子一颗颗系好，朝我和晓枫招起了手：\n“那么，两位长官，该去码头赶船了。”"
PAU.7.a: "“我们走吧。”"

PAU_zbgk: "开往海港的道路"
PAU_zbgk_desc: "为了安全起见，卡车的大灯已经全部关上了，几十辆车正顺着沿海公路全速前进着。车厢里挤得连转个身都费劲，车轮碾过坑洼时能听见悬挂嘎吱作响的哀鸣。北边天际线上的黑烟越来越浓，那是王都被尸潮吞没的火光。晓枫坐在副驾驶上盯着里程表，小遥在后面哼着家乡的调子。我们谁也没心思回头再看，所有的活路都被系在了港口的那批燃油和粮食上了。"

PAU.8.t: "快把大门钥匙交出来"
PAU.8.d: "伴随着车队在港区货栈的门前的刹车声，几名戴着王室帽徽的看守提着马灯从哨房里跑了出来，慌慌张张地举起手里的佩枪，还没弄明白怎么回事就被跳下车的士兵围在了墙根底下。\n“你们是哪个部队的？！”领头的看守官拉开嗓子喊道，手抖得连保险都拉不开，“这里是王都封存的军需，擅动者按叛乱论处！”\n我推开车门跳下踏板，脚底踩在了码头的湿水泥地上。\n“你们的王都早就没了。”我看着他的眼睛，“内廷那些老爷大概已经在给怪物填肚子了。想保住脑袋的，就把大门钥匙交出来。”\n看守官愣在原地，脸色唰地一下全空了。\n晓枫从车后面走了过来，手里拿着一把用来撬锁的撬棍，连看都没看那群吓呆的看守，直接插进了大门铁锁的扣环里。两名跟上来的工人用力一扳，挂锁啪的一声断成了两截。\n铁门里面整整齐齐码放着上千个木箱，麦粉的干香混着燃油味扑面而来。\n看到此景，车厢里的伤员和矿工们发出了一阵压抑的骚动，隐约还能听到几声如释重负的抽泣。\n小遥从车厢边沿跳下来，走到码头的水泥桩旁抬手指向漆黑的海面。\n海面上，两长一短的汽笛声破开浓雾，沉闷地地压了过来。\n放眼望去，能看到海湾深处，两艘悬挂着樱花旗帜的庞大军舰正缓慢驶入锚地，甲板上的探照灯打出一道道雪白的光柱，落在了我们的卡车前。\n“看，我没骗人吧。”海风吹起了小遥的风衣下摆，“船到了，王室的粮食和燃油也抢到了，多亏了我提供的信息哦。”\n晓枫站在敞开的库房门前，看着那些跳下卡车拼命搬运物资的工人和士兵，神色复杂地低声问我：\n“接下来呢？登船离开，还是把港口变成下一个防线？”"
PAU.8.a: "“先把油箱灌满，别的事待会儿再说。”"

PAU_jmyx: "加满油箱"
PAU_jmyx_desc: "在战士和工人们提着油桶轮流给每辆车灌满之后，由于好几个月都没闻到过真正的饭菜香味，大家都围坐在了集装箱旁边狼吞虎咽着，甚至连掉在衣服上的肉碎都捏起来吃了。樱花的运输舰在栈桥边放下了登船跳板，他们的水手正忙着清点登船人数。此时此刻，我们的油加满了，我们的肚子也饱了，所以我们谁也没法装作听不见北面铁路线上传来的求救信号。"


PAU.9.t: "跳板搭稳时"
PAU.9.d: "工人们手里捧着刚用热水烫过的牛肉罐头坐在仓库门前的空地上，呼哧呼哧吃得满嘴是油。几个缠着绷带的年轻士兵也在互相碰着拳头庆祝好不容易得来的休整，这些都是我们在艾瑞波拉几个月都没见过的干劲了。\n小遥站在运输舰的舷梯旁，朝我招了招手：\n“我们的货舱腾出了好几个够你们睡大觉的隔间，里面淡水和饼干也都管够呢。阿夏，你们的人现在就能排队上船了哦。”\n闻言，我低头看着脚边的空油桶思索了起来。卡车的引擎已经全部热好，只要开上运输舰，这帮跟着我受苦受累的兄弟姐妹就能彻底从这场泥潭里脱身。\n但是，谁又能保证这艘船把我们带去何方呢？\n就在我犹豫时，港务室的门突然被人用力推开了。\n晓枫跨步走了出来。\n“通了。”她站在台阶上看着我。\n我转过身：“什么通了？”\n“留在矿顶的步话机。”晓枫摘下一边耳机递向我，“雪伊的人冲破了工业区的封锁线，正沿着北边的铁路线往港口撤退。后面还跟着大批大批的亡灵，她们就只剩下几辆卡车了，弹药也快打光了。”\n耳机里传来了刺耳的电流杂音，隐约能听到雪伊在另一端粗着嗓子的嘶吼，伴随着密集的机枪点射和撞击声。\n小遥不紧不慢地走下跳板，而后站在了我们两人中间：\n“舰队必须赶在退潮前出港。要是亡灵主力涌进港区，樱花军舰会立刻收起跳板离港。我们的任务是接走你们，可没义务替游击队打阻击战啊。”\n晓枫把手里的耳机递得更近了些：\n“离码头入口还有十五公里。雪伊只要能冲过跨河铁桥，就能甩开后面的亡灵追兵。但那座桥被王室撤退时炸断了一截，车根本开不过来。”\n码头上的风吹起一波波海浪拍打在桩子上，碎成了一片片泡沫。\n夹杂在这海浪声中的，一边是已经搭好跳板、随时可以启航的运输舰；另一边是加满了燃油、炮口还能开火的几辆轻型坦克。\n所有的人都停下了手里的动作，回头看向了我。"
PAU.9.a: "“……二连留下来装船，其余人跟我上车，去铁桥接人。”"
PAU.9.b: "“……收起跳板，我们立刻开船。”"

PAU_zjwyj: "追加违约金"
PAU_zjwyj_desc: "小遥把一张重新拟好的赔偿清单直接拍在了挡风玻璃上。擅自掉头去救人等于把整个樱花舰队拖在浅水区当靶子，按规矩要赔上好几倍的运费。可她转头就抄起通讯，让外海的护航战舰把主炮转到了铁桥方向。嘴上说着蚀本买卖，手底下的舰炮火力却一发也没含糊。"


PAU.10.t: "副驾驶"
PAU.10.d: "燃油机的黑烟刚喷出来，车门就被人在外面用力拍了两下。\n还没等我踩下离合，遥拉开副驾驶车门拎着旅行包直接挤了进来，那只小白兽也跟着跳上仪表盘找了个地方趴了下去。\n我瞪她一眼说：“你上来干嘛？船不等潮水了？”\n遥把包塞在脚下，从怀里掏出一副连着长天线的通讯器：“开船的指令我推迟了。擅自带着主力掉头救人，阿夏长官，你明白这在合同里叫严重违约吧？”\n坐在后排的晓枫刚核对完等高线图，正准备开口。\n我抢先松开手刹，打死方向盘把车头拐上了公路：“违约金记我账上，以后打工还你就是了。不过，要是怕死的话，现在跳下去还来得及。”\n小遥听得翻起了白眼，话语间满是嫌弃：“打工？拿你在泥巴里打滚的那点薪水还到下个世纪吗？”\n她不再跟我斗嘴，伸手按下了通讯器的发射开关发令道：\n“这里是小遥。通知海湾里的军舰，主炮解除待命。目标锁定沿河铁路线北岸，覆盖追击公社车队的尸群。”\n通讯器另一端传来一阵伴随着尖锐的电流鸣响的急促应答声。\n交代完炮火支援，小遥侧过脸看着我，神情又变回了精明的小贩子：“救人的弹药损耗全算在你的债务账单里。等到了樱花，你手下这帮人每天都得老老实实去厂里上班。”\n轰——！\n海湾方向传来一阵撼动地面的轰鸣，两团赤红的火球撕裂夜空，呼啸着越过头顶砸向北面的山脊，气浪把公路两旁的灌木吹得一同弯下了腰。\n后座的晓枫望着窗外被炮火映亮的天际线，喃喃说道：\n“雪伊要是听见这动静，肯定以为又是哪路王室舰队来要她的命了。”\n“抓稳了。”我踩下油门，顺着火光直奔铁桥冲去。"
PAU.10.a: "“去把那个跑不动的家伙捞回来。”"

PAU.11.t: "桥对岸"
PAU.11.d: "来到铁桥对岸，江面上的雾气被远处的炮火撕得粉碎，跨河铁桥中央垮塌了一个几米宽的豁口，扭曲的钢梁斜斜吊在湍急的江水上方。望向对岸的铁轨旁，能看到一辆侧翻的货车冒着滚滚浓烟，几个公社伤员正缩在桥墩后面躲避着流弹。\n车还没停稳，晓枫就撞开车门冲了下去，顺着倾斜的断裂钢板直接跑到了边缘。\n对岸靠在车轮后面的身影立刻抬起长枪，剧烈咳嗽着吼道：\n“对岸的是谁？！我手里的枪可不长眼！”\n那是雪伊的声音。\n晓枫站在断口前，双手拢在嘴边大喊：“雪伊！是我！”\n对岸的身影明显僵住了。雪伊抹了把脸上的污迹，瞪大眼睛认出了晓枫，紧接着目光就扫到了我和开上桥头的军用卡车上。\n“晓枫？！你没死？……等等，王室的狗腿子怎么也在旁边？！你又叛变回去了？！你们是来拿我换赏钱的？！”\n雪伊的声音又惊又怒。\n我走上前，从车里拉出一根拖车缆绳，甩起带挂钩的那头用力扔过断口，稳稳卡在对岸的一根枕木上。\n随后冲着对岸吼了回去：“少在那边废话！王都早让怪物给吃了，谁有闲心抓你去换钱！能动的赶紧抓紧绳子爬过来，动不了的就绑在腰上，我们这边拉！”\n后面的小遥也跟着小跑过来，两手扶着栏杆大声补充：\n“动作要快哦！战舰的炮弹很贵，舰队只答应掩护十五分钟，超时了大家都要留在这儿喂亡灵呢！”\n对岸废墟深处传来了尸群尖利的咆哮。\n晓枫踩上悬空的铁梁，朝对岸伸出了手：“雪伊！别犯倔了！先把伤员送过来！”\n雪伊咬着牙收起武器，转身和几个工人把第一名伤员用皮带绑在了缆绳上。\n我和车队的几名士兵抓稳绳子，一点点把人拉过江面。\n十多分钟过去了，顺着缆绳爬过来的雪伊全身早已被水汽浸湿，刚跳上这边的地面就脱力地坐下去喘起了大气。\n就在晓枫蹲下身，伸手替她擦掉了额头上的血渍的时候，雪伊突然扭头瞪起了我：\n“……阿夏，你对我们做的那些畜生事，我可没答应就这么算了。”\n我把一盒热好的牛肉罐头塞进她怀里：\n“我也没打算让你就这么算了。先吃点东西填饱肚子，我们得抓紧时间回码头了。”"
PAU.11.a: "“所有人上车，登船。”"

PAU_zmxx: "装满鲜血的罐头"
PAU_zmxx_desc: "撤回港口的卡车还没熄火，车厢里就吵翻了天。脱险的侥幸被对岸留下的血腥味冲得干干净净。雪伊不肯咽下军团分发的口粮，指着车厢里的伤员厉声质问。卡卡罗姆阵地上被炮火轰碎的工事、铁桥北岸没能抓牢缆绳的同伴，成了横在所有人中间拔不掉的钉子。谁也没法替死在路上的兄弟姐妹大度地假装一切都没有发生。"

PAU.12.t: "谁留在对岸"
PAU.12.d: "返程车队到达港口的时候，我刚刚下车，就听见了车厢后面传来一阵压抑的咳嗽声。往车厢看去，十几个刚从江水里捞上来的伤员挤在帆布底下，身上还在往下淌着不知是血液还是泥水的液体。\n雪伊就瘫坐在车尾板旁边，怀里还紧抱着刚才塞给她的那个牛肉罐头。\n晓枫也跟我一起走了过来。\n瞥见了晓枫的身影，雪伊这才慢慢抬起脸，脸上早已分不清是江水还是眼泪了：\n“晓枫…死掉的那几个……是车间的学徒工，他们连个像样的鞋子都没有。他们的师傅，是老罗根，他为了给卡车垫后，才被怪物扑进水里的……后排的绳子，怎么就断了呢？”\n晓枫按在车板上的手收紧了：\n“如果不断缆绳，那群怪物几分钟就能顺着爬过来。到时候我们都要留在那里的。”\n“我知道！”\n雪伊的嗓子彻底哑了，一巴掌拍在冰冷的车板上：\n“我知道你算得对！你每次都算得那么清楚！可为什么留下的是他们？！凭什么开枪断后的是他们，坐在车里活着吃肉的是我们？！”\n“缆绳是我砍断的。”\n雪伊闻声立马瞪向了我。\n“在卡卡罗姆开炮清路的是我，在桥头下令弃车断缆的也是我。”我迎着她的视线继续说道，“你想发牢骚就冲着我来，少在这里冲着晓枫撒泼，她手里的枪早就被我缴了。”\n车厢里的公社工人和伤员全都低着头，没人敢出声，只剩下海浪拍打栈桥的撞击声在风里回荡。\n一直站在跳板旁的小遥抬手看了一眼天色，轻声提醒道：\n“港口的军舰已经在催人了。距离潮水退去只剩最后几分钟，想吵架的话，等所有人都活下来，到了船舱里有的是时间吵。”\n晓枫走到车厢边缘，朝雪伊伸出了手：\n“下车吧，雪伊。把眼泪擦了，我们去帮后勤队抬担架去。”\n雪伊避开了晓枫伸过来的手，自己扶着栏杆摇摇晃晃地站了起来。她咳嗽着翻下车厢，抱紧那罐一口没动的罐头，踩着灌满冷水的靴子，一步步走向了跳板前坐着的伤员们。"
PAU.12.a: "“去核对登船名单，一个名字都不许漏。”"

PAU_jjka: "紧急靠岸"
PAU_jjka_desc: "谁也没料到亡灵会从几百米深的海底浮上来。船的尾舵被水下的断木撞坏了，海水直接往轮机舱里灌了进来，凭这副破损的船体根本不可能横穿大海。顺着航标灯的指引，船队只能拐进圣杯王国设在孤岛上的前哨站。那里的港务官咬死规章不松口，硬要扣下货舱里五成的粮食和燃油当作停泊税。为了给舱里的伤员争取抢修时间，只能咬着牙认下这笔盘剥。"

PAU.13.t: "按圣杯的规矩办"
PAU.13.d: "脚底下的甲板传来第一声沉闷的撞击时，大家还以为只是碰上了暗礁。\n紧接着又是两下剧烈的震颤，底舱的油桶被当场震翻，混着海腥味的冷水顺着甲板缝隙猛涌上来。\n等我们的探照灯的光柱往水下一照，浮上来的都是缠在沉船残骸上的泡胀死尸，几具骷髅甚至抓着船舷的排水孔，顺着铁锚链往上爬了起来。\n谁也没想到索拉娜的尸潮早就顺着海底海沟蔓延到了大海深处。\n虽然甲板上的炮火打碎了水下的骨架，但船尾的舵面被撞变形卡死了，想靠这副破损的船体横跨大洋无异于做梦。\n挨到天亮，冒着烟的船队只能顺着航标灯，拐进了圣杯王国设在近海孤岛上的巡防基地。\n刚进港口，巡逻艇的高音喇叭就传出了冷漠的警告：\n“未通报的武装船只，立刻落锚熄火。甲板人员退后，接受战时卫生检疫。”\n晓枫扶着被海水打湿的舷梯，朝岸上的哨塔抬起了下巴：“圣杯在南大西洋的据点，遇上这帮吃人不吐骨头的，看来我们要遭老罪了。”\n一名披着海军常服的圣杯军官踩着跳板走上甲板，扫了一眼浑身硝烟味的士兵和伤员：\n“船身有严重的亡灵污染痕迹。按港口条例，我必须拒绝未登记的武装难民入港。”\n我刚想上前拿货物清单跟他扯皮，身后的小遥已经一步跨到了我身前。\n她翻开风衣领口亮出那枚徽记，顺手将一份盖着鲜红印章的公函递到了军官面前。\n“我是樱花派遣的随船全权代表春日小遥。”她端起一副毫无破绽的正式腔调，“这几艘船登记在我们的护航名册下，船上的人员属于受公约保护的随船技工。”\n圣杯军官只是简单扫了一眼印章，原本冷淡的神色就立刻收紧，换了副公事公办的辞令：\n“既然持有正规使节公函，港口可以依照避难条约为你们提供船坞与消杀药品。但入港税照旧，我们要征收货舱里五成的货物。”\n这简直是在明抢，那些物资是所有人拼了命才从仓库里抢出来的。\n“可以，按你们的规矩办。”小遥在停泊单上签下名字，将单据递还了回去，“请立刻接通岸上的维修电缆，安排伤员进行疗伤。”\n军官收好单据，行了个标准的军礼，挥手示意岸上的起重机准备卸货。\n看着一箱箱货物被吊上栈桥，晓枫靠在栏杆边感叹道："
PAU.13.a: "“至少……大家暂时不用沉进海底喂鱼了。”"


PAU_wcka: "老家根本回不去了"
PAU_wcka_desc: "拿口粮换来的停泊许可撑不了几天，樱花那边传来的消息更是直接断了大家的念想。开回南美迎接数不尽的亡灵无异于自讨苦吃，继续往前又是樱花军警把守的死胡同。几千名兄弟姐妹还在舱底等着出发的口令，我们已经不能再等下去了。"

PAU.14.t: "缉捕名单"
PAU.14.d: "小果子把耳机紧贴在耳边，随后回过头看起了我们，带着快要哭出来的腔调喊道：\n“小遥姐姐……广播里反反复复放着的明明都是军乐，报出来的也全都是叛徒被捕的名单，码头工会那边根本没人回话呀……”\n晓枫直接把那份文件推到了小遥的眼皮底下：\n“你的印章属于几年前就被取缔的救济会，樱花根本没派过所谓的使节。这支船队到底是谁调来的？”\n我盯着桌对面的少女，省去了所有客套：\n“所以，你带着我们在山道上拼命，又割掉一半物资给圣杯交税，结果海对面的码头我们根本靠不上去？”\n屋里的空气一下子凝固了。\n遥靠在门旁，原本嘴硬的神气一点点塌了下去，整个人显得有些无所适从。\n“……对，公函是我偷刻了印章伪造的。”\n“可我有什么办法？！我们从老家逃出来的时候，船坞被军警围得水泄不通，大家凑了最后的油，交代我和藤井一定要带懂打仗的人回去救命！我们在海上漂了那么久，靠岸的时候轮机舱里的重油连底都刮不出来了！”\n她吸着鼻子，突然抬起头瞪着我：\n“我要是老老实实跑到你们营地去要饭，说我只是个被通缉的穷学生、船上只有一帮铲煤的工人，阿夏你会把坦克开下山吗？！你们谁会多看我一眼？！”\n“我以为他们至少能撑到我把人带回去……我怎么知道那帮军阀几天就把工会全给拔了……”\n“反正事情是我搞砸了。你们要是觉得被我骗了，现在就把罪名加在我身上把我捆了送去给王室领赏，或者直接扔下海，我没话说！”\n靠在门边换药的雪伊嗤笑了一声：\n“行了，少在这儿演英雄受刑的戏码。当年的王室比你会算计得多，我们还不至于蠢到拿一个小姑娘的脑袋去讨好它们。”\n晓枫顺手把海图摊开在两人中间，打断了空气里的紧绷：\n“用不着把什么罪名都往自己身上揽，小遥。卡卡罗姆那一仗，就算你没来，阿夏为了手底下士兵的活路也会跟我们鱼死网破的，我也不可能就此把那里让出去。那是迟早要撞上的坎。”\n晓枫在图纸上用力点了两下：\n“所以我们现在的麻烦是，南美大陆回不去了，我们东进的航线也堵死了。至于你欠我们的，等找到能落脚的地方再说吧。”"
PAU.14.a: "“我们得重新商量怎么活下去。”"

PAU.15.t: "你到底是个什么来头"
PAU.15.d: "我把遥拉到了仓库后方的拐角处，等四周彻底没了动静之后，我才靠在栏杆上点着一根烟，直截了当地看着她：\n“行了，把底牌全摊开吧。公函是假的，使节是编的，公章属于废弃的救济会。现在告诉我，你一个小丫头到底是怎么把两艘带炮的船开跨大洋的？又是怎么摸清我和晓枫，甚至是整个莉兰迪亚的底细，一路把我们忽悠到码头来的？”\n“我在码头酒馆里跟老水手打听过了嘛。”\n“他们说山道上有一支叫‘无国界之军’的老兵队伍，明明被王室断了饷银还死守着关口；而沿海公路的仓库里，刚好囤着王室准备出口的几百桶燃油和麦粉。只凭藤井他们根本打不进守卫森严的仓库，我必须找一批真正会开坦克、敢硬碰硬的行家替我们把路撕开。”\n我掐灭了烟头，指向她大衣领口里缩着的白毛团子：\n“那这个小家伙呢？在山道上能提前绕开亡灵的伏击，在深海里甚至能让扑上来的水鬼退避三舍，它到底是个什么来头？”\n小遥伸手抚摸着领口里露出来的白色软毛，眼神软了下来：\n“它叫白夜，是家乡神社里传下来的山灵。军部想抓它做战争试验，同伴们拼死把它偷出来塞给了我。它天生对死气和腐烂的恶念特别敏感。在山道上，几十里外的尸潮只要稍微有点动静，它闻到死气就会炸毛，带我们挑那些没有怪物盘踞的小路走；在大海上，探照灯还没照到水面，它就已经在甲板上抓挠示警了。”\n她把围巾稍稍拉开，露出小白兽软趴趴蜷缩着的模样：\n“在深海遇到亡灵水鬼围攻的时候，也是它透支了所有的灵气护住龙骨，把那些爬上锚链的骨架震碎……现在它力气用光了，累得连耳朵都动不了啦。”\n“我原本以为……只要把你们这些懂打仗的带回老家，就能跟船厂的同伴汇合。我真没打算害你们……可我没想到，老家那边几个月前就已经垮掉了……”\n海风把她额前的白发吹得乱糟糟的，怀里的小白兽发出微弱的呜咽。\n看着眼前这个想到了一切、却唯独没想到故乡会先一步沦陷的流亡少女，我按着被风吹凉的帽檐叹气道：\n“行了，别在这儿抹眼泪了。”我转身继续说道，“说到底，你跟我们这帮被欠条逼下山的雇佣兵也没什么两样，都是揣着最后一口气在烂地里抢饭吃的穷光蛋罢了。”"
PAU.15.a: "“走吧，回屋里去，看看晓枫她们怎么说。”"

PAU.16.t: "掉转船头"
PAU.16.d: "“把船直接开进老铁厂的排污河道！趁着涨潮把坦克吊上岸，顺着铁路线直接就能抄那些怪物的后路！”\n我刚推开库房门，雪伊的大嗓门就直接撞了过来。\n晓枫站在几只木箱拼成的桌子前，手里的笔在图纸上敲了敲：\n“然后让吃水深的大船在退潮时搁浅在烂泥滩上，大家跳进水里推船吗，雪伊同志？”\n“……晓枫！你能不能少泼点冷水？！”雪伊被噎得只能瞪起眼来。\n小果子急忙举手打圆场：\n“晓枫姐，雪伊姐，别吵啦！刚才工区那边的电台又来消息了，工人们把蒸汽锅炉的阀门焊死了，怪物的巡逻队根本冲不进车间呢！”\n我和小遥一前一后跨进门槛，看着屋里这副热火朝天的架势。\n“你们不在这儿商量怎么分剩下的口粮，围着地图吵吵什么呢？”\n晓枫抬起头看着我，眼神里透着那股熟悉的敏锐：\n“我们在找登陆点，准备杀回南美。”\n“杀回去？”我拉过椅子坐下，“当时为了拉人，弹药扔了多少你不知道？在铁桥掩护雪伊，护航舰的炮弹也打得七七八八；刚才进港又被圣杯扣了五成口粮和整船的备用燃油，杀回去送死吗？”\n晓枫拿笔在海图上量出一段距离，抬头看着我：\n“去樱花我们确实开不过去；但掉头回南美只有几百海里，剩下的油刚好够跑这一个单程。”\n小果子也急忙把抄满电报代码的纸条递到我面前：\n“弹药也不用愁！阿夏你看，工区的自卫队夺下了王室的军械总库，修造厂和车间也在工人们手里了！他们手里堆满了炮弹和子弹，但缺懂打仗的军官，更缺能冲锋的战车和重炮。我们带着坦克和舰炮回去，正好跟他们里应外合！”\n话音刚落，雪伊把手里的罐头往桌上一放，咬牙切齿地嚷嚷：\n“索拉娜的力量失控了，海底下冒出亡灵就是铁证，她现在根本压不住那些怪物。主力早就全被拖在内陆王都打混战去了，沿海的防线早就空了。在这破岛上给圣杯当孙子交税，等手头的油烧完了也是等死。与其在这儿耗成干尸，不如杀回去把港口抢下来当我们自己的家底！”\n小遥靠在桌边，也跟着摊手：\n“反正老家那边到处都在通缉我，我是回不去了。与其在大海上漂成淹死鬼，不如跟你们拼一把，好歹船上那两门大炮还能替你们开路呢。”\n我再次叹了口气：\n“真拿你们这帮不怕死的没办法。去通知水兵准备起锚，把坦克和剩下的弹药都固定好。”"
PAU.16.a: "“我们再信自己一次吧”"

PAU_dsyq: "现在，赌上我们的一切吧"
PAU_dsyq_desc: "离开那片土地的时候，我们是一群丢盔卸甲的逃亡者；\n而现在，翻滚的浪花正把我们推回那座燃烧中的故乡。\n前方的海岸线越来越近，每一门火炮都已经校准完毕……\n\n§R我们，该回家了。§!"

PAU.17.t: "压根没有什么特派员"
PAU.17.d: "我走上货船后甲板的时候，工人们正跟着几名水手把钢缆挂上吊钩，准备把那辆轻型坦克固定在舱口前面。\n小遥就蹲在旁边的系缆桩跟前，手里拿着一截铁丝帮水手挑着绞盘滑轮里的麻绳碎屑。\n旁边那个年轻水手还在小声嘟囔：“小遥小姐，下次千万看好白夜，别让它再钻进配电箱了，电缆皮都差点被它当磨牙棒啃烂了。”\n那只小白兽正舒舒服服地趴在小遥的膝盖上，懒洋洋地打了个大哈欠。\n我走上前，抬脚踢开脚边挡路的撬棍：“吊臂检修完没有？晓枫在前面核对航标，让我过来确认一下那两门炮的俯仰角和装填速度。”\n水手见我过来，心虚地瞅了一眼小遥：\n“这位长官……实话说吧，船上压根就没有正规炮手。眼下掌舵的是被海校开除的士官藤井，我们几个在上船前尽是些在底舱铲煤的炉工。之前在铁桥开炮掩护，全靠藤井翻着出海前塞在铺盖底下的操典现学现卖的。”\n我手里的航海图差点直接掉在甲板上。\n“……你说什么？”我扭过头瞪着小遥。\n小遥手里挑麻绳的动作突然停住了。她慢慢抬起脸，干巴巴地笑了两声，眼神飘向了一旁：“哎呀，阿夏长官，别在意这些细节嘛。你看炮弹不也挺准地落在北岸了吗？”\n“在矿山地下室里，你跟我说这是樱花议会秘密派来的护航舰队。”我把海图卷成筒，在手心里用力敲着，“在圣杯补给站，你说工人和学生在船厂等着你带我们回去救命。你现在告诉我，你们连个正经炮手都没有？”\n旁边的水手把油抹布随手丢进铁桶里，干脆替她把底全抖了出来：\n“长官，您就别听小遥小姐吹牛了。我们家乡那边虽然闹得凶，但根本没到会派舰队出海的地步。纯粹是军官克扣了我们好几个月的伙食费，后来船厂工人和学生罢工，游行队伍里都是兄弟姐妹的亲戚。军官非逼着我们把船开进内河架机枪朝他们开火。藤井看不下去了，就带着大家把军官关了起来，连夜把两艘船强行开出了海。”\n水手伸手指向缩在旁边的小遥：\n“小遥小姐当时在码头掩护几个学生逃跑，被宪兵追得没路走，顺着缆绳一骨碌滚进了运煤舱里。我们每人都背着通缉令，哪里的港口都进不去，只能靠藤井自学的那点看星星认路的本事一路往东漂，想着跑来南美找个地方隐姓埋名混口饭吃。”\n我转过头，面无表情地盯着小遥。\n小遥把膝盖上的小白兽一把抱进怀里挡住了脸，声音细得跟蚊子哼哼一样：\n“我也没想到……你们南美这边的情况比我们老家还要烂嘛。”\n……\n这小丫头嘴里到底还有多少句鬼话是我还没听出来的？"
PAU.17.a: "“去把那本操典拿来，我现在教你们怎么瞄准。”"

PAU.18.t: "既然我们早已无处可逃"
PAU.18.d: "小果子把话筒递到我的面前，眼圈红红地抽噎着：\n“阿夏姐，整个海岸线都接通了……广播里的大家……都在问是不是有船回来了……”\n驾驶室里挤着不少人，随着铁门被海风带起，雪伊压进弹匣的子弹发出一声轻响，引得我的视线挪了过去。感受到我的眼光，她立马低头避开视线；顺着她身前摊开的海图台望去，晓枫正撑着桌子，将手指点在沿海工区的标记上；而在操作台另一端，小遥正低头理着白夜的绒毛，身旁的水手顺势握着传令管，大家都在屏息等待着海图上的落点坐标。\n这里原本聚集着一群最不可能同行的逃亡者。\n我伸手接过了那个带着体温的话筒，按下了侧面的开关。\n全船的广播喇叭与沿海无数部破旧的无线电接收机里，同时响起了温和平稳的电流声。\n“这里是阿夏。”\n我的声音在空旷的舱室里回荡开来：\n“对，就是那个背叛了老军团长的理想，也就在刚刚背叛了王室的废纸的阿夏。”\n身边的雪伊手里的动作停了下来，整间驾驶室里安静得只剩下轮机深沉的轰鸣。\n“我们当了太久的雇佣兵。过去这几年里，我们总以为只要手里还紧握着王室给的欠条，只要还能用武器换来下一顿晚饭，就能假装自己是一群没有退路也不需要归宿的行尸走肉。为了自己能活命，我们就把冷酷当成清醒；因为害怕被抛下，我们就抢先把昔日的同伴扔在身后。”\n我转过头看向那些樱花水手与身旁的同伴们：\n“看看我们脚下的这两艘船吧。这上面的燃油，是樱花的水手们为了不向自己的亲友开火、顶着叛国的罪名抢出来的；这上面的每一发炮弹，也是造船厂的工人们冒着枪林弹雨一箱箱搬进底舱的。而我们这帮原本只想着逃命的懦夫，竟然还厚着脸皮坐在别人的船舱里，做着逃去大海对岸的美梦。”\n电台的那一头，远方工厂的杂音里隐约传来了微弱的抽泣声。\n“可是啊……在这个世界上，到底哪里才算得上是能安稳睡去的家乡呢？”\n“根本没有那样的地方。闭上眼，是在工区被我们碾过的哭声；张开嘴，是卡卡罗姆那些同伴的血腥味。为了活命我们把身边的人卖得干干净净，真到了大洋对岸，我们算什么？一群揣着死人饭钱、连自己名字都不敢认的孤魂野鬼吗？！”\n我抓紧了话筒，将胸口积压的所有软弱与决意一口气说了出来：\n“既然我们早就无处可逃了——”\n“那么，所有还躲在车间里、躲在废墟深处不肯低头的兄弟姐妹们，请你们再多坚持一会儿。”\n“我没脸求你们原谅，更没资格当什么救世主。我是把良心丢在泥坑里的逃兵，我根本没有资格奢求原谅。我们这帮走投无路的逃兵，回来求你们救救我们！”\n我松开了开关，将话筒挂回了操作台旁的铁钩上。\n雪伊背过身去小声骂着，语气里却忍不住带着一抹哭腔：\n“真是个无可救药的混蛋……早点这样说不就好了吗。”\n晓枫抬起头看着我，脸上露出了重逢以来最轻松的微笑。\n“听到了吧，藤井！全速倒车可从来不是我们这帮叛徒的规矩，把主炮的保险全给我打开！”小遥冲着传令管大声喊道。\n巡防舰的前主炮爆发出耀眼的烈火，呼啸的炮弹划破昏暗的天空，笔直地飞向了海岸线上那片等待着破晓的亡灵废墟。"
PAU.18.a: "“全舰全速推进，我们回家了。”"

PAU.19.t: "明天还得继续出操"#拿下亡灵
PAU.19.d: "桌上摊着刚送来的几张紧急报告，市镇和矿区的求救通报一条接着一条发了过来。\n城里的危险虽然过去了，但山里的残存亡灵还在骚扰各处村庄，躲在地窖里的百姓急需救援。\n雪伊猛站起身，手边的陶杯被带翻在地，啪的一声摔得粉碎：\n“南区车间和铁道那边还有几千个家属和学徒！刚抢通的线路要是被截断，大家明天连早饭都吃不上！我去带人救他们！”\n晓枫站在地图前冷静地指出要害：\n“如果水电枢纽被破坏，海港的生产几天内就会陷入瘫痪。不能等了，现在必须继续推进防线。”\n她迅速卷好图纸，随手把喝空的杯子甩进墙角的废品桶里，啪嚓一声砸得粉碎：\n“我去调配弹药与炮兵。”\n我按着腰间的枪套站起身，故意埋怨着：\n“我还打算安稳睡一觉呢，真是群叫人操心的家伙。带上家伙跟我走，总不能留下烂摊子让别人替我们收拾。”\n我仰头喝完最后一口水，随手把杯子往地板上一甩，同样砸得粉碎，迈步跟了上去。\n随着大家急匆匆地各奔东西，原本热闹的大厅转眼间就剩下了小遥一个人。\n小遥手里还傻傻端着那个刚倒满水的杯子，呆呆地看着空荡荡的门口。\n她瞅着地上散落一地的碎片，忍不住冲着门外大声抗议起来：\n“喂！你们一个个着急就砸东西是跟谁学的啊？！这些杯子明天后勤还得花钱去买呢！雪伊！阿夏！你们赔我买杯子的钱啊！”\n白夜从她怀里探出小脑袋，眨巴着眼睛望着她。\n大厅里一下子安静下来，门外已经传来了人员调动的呼喊与卡车的引擎声。\n小遥低头盯着手里的杯子，小声嘀咕着：\n“……真是的，走得那么快。反正少了我他们肯定搞不定嘛。”\n她心一横，抬手把手里的杯子也用力往地上一砸，当然也摔了个粉碎，随即抱着白夜追了出去：\n“——等等我啊！我也要去！”"
PAU.19.a: "出发，彻底清除所有的亡灵！"#触发h3事件

PAU_zhyk: "最后一箱罐头"
PAU_zhyk_desc: "从仓库里拖出来的罐头就剩下最后几箱了，等伤员和工人们分完这锅肉汤，后厨的锅底就彻底见光了。城外的麦苗早被亡灵践踏成了烂浆，车库里那几台车的汽缸也裂了缝了。拿惯了步枪的老兵不会摆弄农具，懂车床的工人们又饿得拿不起扳手。要是赶在下个冬天来临前没法让工厂重新开工、没法把麦子种进地里，大家就算没死在战场上，也得在这座空港里活活饿死。"


PAU.20.t: "开着战船去打鱼"
PAU.20.d: "我看着墙上挂着的存粮清单，上面的数字已经被晓枫用红笔划掉了好几遍。\n后勤库房里剩下的面粉只够维持短短几天，地里的麦苗也全被亡灵踩成了发黑的泥浆。内陆的运粮道被王室的残部卡死了，圣杯王国的军舰又在海湾外面虎视眈眈。要是再弄不到吃的，刚打下来的港口立刻就会变成一座饿殍遍地的死城了。\n正当我头大时，门突然被人用靴子一脚踹了开来。\n小遥卷着沾满水气的裤腿跑了进来，手里还拎着一个木桶。她把木桶往桌上一放，两条银亮的海鱼立马在水里扑腾出大片的水花，溅得海图到处都是。\n“看！海里的大鱼！”小遥抹了一把脸上的水珠，眼睛亮得像是在发光，“内陆的土地被死气泡烂了，但外海深水区的鱼群可不知道索拉娜是个什么东西！”\n晓枫抬起头，有些迟疑地指着窗外的海湾：“港里的渔船早就被王室撤退时全烧光了，我们拿什么出海？”\n“谁说要用木头渔船啦？”小遥跳到桌边，得意地拍了拍胸口，“藤井他们把货船上的吊臂改成了拖网绞盘，巡防舰前面那两盏高功率探照灯夜里往水里一照，成群的鱼顺着光就往网里钻了！我和水手们试捞了一网，连甲板都差点被捕来的鱼压断了呢！”\n她从兜里掏出一张画得密密麻麻的草图，直接拍在我和晓枫面前：\n“不仅是打鱼！我让工人们把两辆轻型坦克的炮塔也拆了，换上装卸铲，拿燃油机当牵引车去犁地排水。只要把泥层底下的盐碱翻出来晒透了，再掺上炉灰，下周就能把耐寒的种子给播下去啦！”\n我看着草图上那些字迹歪扭却详尽无比的机械改装图样，不由得愣住了。\n这个平日里满嘴胡话的异国少女，办起正事来竟然意外得利索。\n“阿夏，别愣着啦！”小遥伸手推起我的胳膊，笑嘻嘻地催促道，“快让你的老兵们换上干活的衣服，跟工人们一起去海滩拉网吧。今晚我们要让全城的人都吃上一顿海鲜大餐！”"
PAU.20.a: "“去通知各连队，全员去码头帮水手拉网。”"

PAU_wrcr: "谁也不想承认这里"
PAU_wrcr_desc: "逃走的王室给各国港口发了通报，把我们打成了霸占沿海的叛乱暴徒。圣杯王国的巡逻船天天在港外游弋，借着防瘟疫的名头把航线封得严严实实。更要命的是，樱花本土那帮新上台的军官在电台里反复播报起了通缉令，逼藤井把军舰开回去受审，小遥的名字更是排在了第一位。在外人眼里，我们是一群连出港证明都开不出来的黑户；在我们眼里，公社工人、军团溃兵和樱花逃兵全都挤在了同一个国家里，大家到底算是一支军队还是一个新政权，谁也没法给出一个定论。"

PAU.21.t: "抢群众面粉的外乡人"
PAU.21.d: "“这车面粉是工会先排队领的，你们凭什么横插一手啊？！”\n粮站门前，额角青筋凸起的铁道工人正拽着运粮板车的把手。\n对面的老兵抓着车栏和他起着争执：“昨天夜里在雨里替大家站哨巡逻防线的人可是我们，口粮应该给我们才对！”\n两边的人越聚越多，工人和老兵各自抓紧了手头的扳手与铁锹，眼看就要动手。\n我和晓枫正要上前叫停，小遥就一下子站到了人群正中央。\n“诶诶诶！都闭嘴，听我说两句！”\n人群停下了推搡，老兵和工人都抬起了头。\n小遥的神色少见地凝重起来，目光深沉地扫过面前的每一个人，言语间甚至带上了一种近乎悲壮的庄严感：\n“我知道，看着这袋面粉，大家心里都压着很重的心结。”\n“一边是当年在工区遭受的苦难，一边是驻防在黑暗里流血的军人天职。作为跨越大海来到这里的异国同伴，我深知这种矛盾的复杂与痛苦。我思考了很久，思考着正义，思考着牺牲，思考着历史与命运的沉痛重量……”\n“——所以我想通了。”\n周围的人群闻言都跟着安静了下来，一直到老兵和工人们都下意识屏住呼吸时，小遥才煞有介事地指起自己的鼻尖：\n“这袋面粉其实应该归我才对。”\n台底下的人被一句突然的话语震得僵在原地，脸上的表情瞬间凝固了。\n“你们仔细想想看嘛。”小遥理直气壮地叉着腰，“船是我带路开过来的，燃油是我找来的，连白夜都为抗击亡灵这件大事上立过大功。你们两个刚才在这儿吵吵嚷嚷耽误了卸货，扣除误工费和损耗，这袋面粉按理就该赔给我当劳务费呢。”\n老兵被惊得张大了嘴，工人愣了好一会儿才结结巴巴地反问：\n“……这算哪门子的道理啊？！”\n“怎么，不服气呀？”小遥指着那辆板车说道，“不服气就赶紧去干活呀。西区铁道上那几百米枕木还没铺完呢，今天谁铺得快，明天后厨蒸的肉包子优先分给谁。谁要是继续在这儿耽误大家的时间，我就真把面粉拖回后厨给自己烙饼吃咯。”\n人群里陷入了短暂的安静，紧接着不知是谁先噗嗤一声笑了出来，两边的老兵和工人们互相对视着，全给气乐了。\n年轻工人抓着铁锹叹了口气，把车把手往老兵手里一推：\n“服了这个外乡丫头了……推车推车，赶紧去工地，免得真被她拖走吃了。”\n老兵也无可奈何地摇着头拉起板车，原本剑拔弩张的人群就这么嘻嘻哈哈地散了开来。\n小遥轻快地跑到我面前仰起了脸：\n“阿夏长官，我刚才那套大道理讲得不错吧？今天的午饭能不能多分我点？”"
PAU.21.a: "“……”"

PAU_tyzz: "同一张桌子"
PAU_tyzz_desc: "从王宫里搬出来的大会议桌被工人们合力抬进了车库。雪伊带着工会代表占了桌子左边，阿夏手底下的老兵规规矩矩地坐在右边，晓枫把新拟定的配给条例摊在了桌子中央。藤井和几个樱花水手原本有些拘谨地挤在桌尾，直到小遥抱着白夜一屁股坐上桌子，大声宣布他们这帮外乡人也要按期领工资时才放松了不少。防线轮流站岗，厂里三班倒换，每一袋粮食和每一箱子弹的去向都公开举手表决。用这几张盖满手印的草纸，大家定下了以后的规矩。"

PAU_mzyy: "埋葬夜莺"
PAU_mzyy_desc: "在过去漫长的岁月里，亡灵的低语从群山一直蔓延到了海边，把原本繁荣的集镇与工矿变成了亡魂游荡的空城。既然带来灾祸的王室已经瓦解，亡灵的源头也已被彻底斩断，我们就没道理再让阴影继续笼罩在这片土地上。死者理应归于安息，生者必须向前迈步。这场纠缠了所有人数年的噩梦，该由我们亲手画上句号了。"

PAU.22.t: "她们不会再出来了"#打死夜莺
PAU.22.d: "“索拉娜！滚出来受死！”\n这间屋里弥漫着一股刺鼻的苦草药味和焦糊的臭气，索拉娜就歪在窗边一张藤椅上，她的两只手腕裹着渗血的布条，整个人看起来消瘦了不少。莉莉安娜正坐在旁边的椅子上，手里拿着一把梳子，一下一下替她理着打结的头发。\n听到踹门的巨响，索拉娜不自觉地抽搐了一下。她挣扎着想从椅子上站起来，膝盖却一软，重新栽回了椅垫里。\n“叫什么叫……”索拉娜咳出一口血沫，恶狠狠地盯着我们，“……带枪进来了不起啊？往脑门上打，要是眨一下眼睛就不算活过！”\n雪伊枪口直接顶到了索拉娜额前，咬牙切齿得喊道：\n“厂里死掉的工人们，还有那些没能爬过来的那些兄弟姐妹们……你今天必须拿命赔给他们！”\n晓枫走上前，伸手翻开桌面上那些散落的草图和满是血迹的撤退命令，随即看到了索拉娜垂在身侧那条焦黑溃烂的手臂。\n“雪伊，先把枪放下来。”\n“凭什么？！”雪伊头也不回地怒吼，“她是罪魁祸首！”\n“她在后面根本就指挥不动那帮怪物。”晓枫把手里那叠被血浸透的军令扔在了桌上，“在沿海公路撤退那会儿我就觉得不对劲，那些亡灵连王室自己的车队都砸，港口外面的水鬼更是连他们的运粮船都连带着一起拖进海底了……我估计，她早就被力量反噬了。后来的仗，她是被失控的亡灵一路追杀逃进这间屋子的。”\n索拉娜嘴里却还在硬撑着：“晓枫……少在这儿装什么明白人……是我抢了心脏，是我把这片地变成这样的，你们开枪啊！”\n莉莉安娜默默从兜里摸出一块糖，塞进索拉娜吵闹的嘴里，还顺手替她把滑落的毛毯拉到了脖子底下。\n索拉娜被突如其来糖块噎住，终于没力气再嚷嚷了。\n雪伊握枪的手更用力了，枪口随着她的胸口剧烈起伏着：\n“就算她被反噬了又怎么样？！死掉的那些人就能活过来吗？！”\n“不能。”\n我走上前，伸手把雪伊的枪管慢慢按了下去：\n“但你现在把她打成筛子，除了把旁边那个神惹毛、把这片地再炸平一次，换不来一斤粮食，也修不好一辆火车。”\n雪伊咬着牙盯着藤椅上那个快断气的废人，最后狠狠啐了一口唾沫在地上，收回了步枪。\n莉莉安娜重新坐回椅子上，伸手握住了索拉娜那只烂手，说道：\n“心脏……我已经收回来了。索拉娜她……现在连路都走不动，闹不了多久了。这里的门我会关上的，请你们…走吧……”\n“走了，雪伊。”我拉下帽檐，转身往外走去，“通报上写索拉娜在城破时死在反噬里了就行。莉兰迪亚还有几万张嘴等着吃饭，我们可没工夫把时间烂在这间死人屋子里。”"
PAU.22.a: "“把门锁好，别再让她跑出来了。”"


PAU_gxzp: "挂上新招牌"
PAU_gxzp_desc: "临时议会的几张破桌子已经没法应付一整座运转起来的国家了。工矿要核算产出，港口要拟定关税，原本靠战时口粮维系的秩序必须尽快落实为明文法典。昔日的雇佣军与公社的工人们虽然坐进了同一栋楼里办公，但彼此投来的目光却依旧带着审视与提防。在真正的大选到来之前，这个拼凑起来的政权一直都是靠着战火里残留的默契在勉强支撑着，很显然，这是远远不够的。"

PAU.23.t: "印章该交给谁"
PAU.23.d: "我把手里的笔扔在桌上，看着它慢慢滚进了两叠文件堆中间。\n左边是雪伊递上来的公社请愿书，上面密密麻麻签满了工人的名字，要求立刻收缴军团的一切重武器，将市政防务全权交由工厂自卫队接管；右边则是跟着我从烂地里一路杀出来的老兵们的请愿书，这帮浑身刀疤的军官措辞强硬，坚决要求保留军团的独立薪饷与防务阵地，不接受任何公社干部的指手画脚。\n这两叠纸像两座大山一样压在桌子两头，一旁还摆着那枚刚刚刻好的临时执政印章。\n从当年在艾瑞波拉为了一口粮食替王室卖命，到在大海上逃命、带着队伍杀回莉兰迪亚，我已经记不清自己有多少个月没脱下靴子好好睡一觉了。工人们对我这个昔日的雇佣军头子始终充满戒心，我自己也清楚，我根本不是个懂得治理国家的材料。\n这种坐在高位上的无力感，比被机枪压在土坑里还要让人透不过气。\n“怎么，阿夏长官，这就打算撂挑子逃跑了？”\n小遥端着一杯刚泡好的咖啡从门外溜了进来，大大咧咧地靠在文件柜旁，怀里从不离身的白夜正探着脑袋去嗅着桌上的墨水瓶子。\n我按着额头说道：\n“公社那边有雪伊带着工人支持，又有晓枫在做全盘规划。工人们本来就只认她们两个，对我这个镇压过他们的军团头子肯定防得像防贼一样。我把这枚印章交出去，让公社名正言顺地接管政权，不是皆大欢喜吗？”\n“你真把印章交出去试试看啊。”小遥放下茶杯，直截了当地把话挑明了，“你信不信你今天上午交出权力，下午工人和你那些军人们就能在广场上拔枪对射？”\n我手上的动作停住了。\n“雪伊的脾气太冲了，她眼里容不得军队的一点沙子，要是让她掌权，第二天就会下令缴了老兵们的枪，你手底下的兵痞肯定立刻炸营；至于晓枫……虽然她懂大局，也懂怎么带兵，但在你那些老部下眼里，晓枫当年是抛弃军团退进山里的‘叛徒’。你把政权交给她，老兵们只会觉得是你这个老长官出卖了他们，把军队打包送给了公社。”\n小遥伸手敲着桌上那枚印章，直直盯着我：\n“你一旦撒手，老兵们没了主心骨，立刻就会把公社当成要砸他们饭碗的仇敌，到时候谁也拦不住他们在大街上兵变。”\n门外隐约传来老兵卫队换岗的皮靴声，伴随着远处工厂汽笛沉闷的鸣响。\n我抓起桌子那枚印章，整个人疲惫地陷进了椅背。\n想放放不下，想退退不掉。"
PAU.23.a: "“去把雪伊和晓枫叫进来，我们继续开会。”"

PAU.24.t: "我不是什么神仙"
PAU.24.d: "“阿夏！你的兵今天上午又把东区的运煤车给扣了！”雪伊撑在桌沿上大声质问，“这是原则问题！工会不可能接受军队骑在工人头上，你今天必须下令让那几个带头扣车的营长公开向工会道歉，再把他们全都关起来！”\n坐在对面的晓枫把整份调度案推到了我面前，用那种近乎冷酷的语气开口：\n“雪伊，现在不是讲原则的时候。阿夏，看看这张排期表。如果不把港口的警备范围和工会的管辖边界切分清楚，明天上午电厂的储煤量就会见底。我拟了几套折中方案，每一套都需要你用大统领的名义强行签发。行政机构不能停摆下去了，你必须现在挑一个盖章。”\n“晓枫！你这叫什么折中？！”雪伊扭头怒喝，“你这是在各打五十大板和稀泥！”\n“我不在乎谁吃亏谁占便宜，我只在乎这栋大楼下周还能不能点得起灯。”晓枫抬起那双锐利的眼睛看着我，用笔笃笃地敲着纸面，“阿夏大统领，拍板是你的职责。别拖延下去了，快把主意拿起来。”\n一边是雪伊带着满腔仇恨与原则的怒吼，另一边是晓枫算尽了每一吨煤和每一条法令的表格。\n两个人一左一右，像两台推土机一样，把堆积如山的难题全部往我脸上碾了过来。\n太阳穴里的青筋在疯了一样突突乱跳着。\n我抓起桌上那枚印章，用尽全身的力气砸在文件中央。\n咚的一声巨响，印章砸翻了水杯，咖啡瞬间把桌上的表格和公文全泡成了一团糟。身后的椅子随着我站起身的动作，向后翻砸在了地面上。\n“都给我闭嘴！！”\n整间屋子瞬间鸦雀无声。\n我把憋了几个月的憋屈全吼了出来：\n“你们到底当我是个什么东西？！我是个会变戏法的神仙吗？！”\n雪伊和晓枫闻言都僵在了原地。\n“雪伊！老兵们扣车是因为后勤营连续好几天没领到配给煤，伤员在棚子里冻得要死！我知道，他们打了几十年仗，除了打枪修车什么都不会，但正是因为这样，他们就要被你们当垃圾扔掉吗？”\n我指着自己的鼻子用颤抖的声音说道：\n“晓枫！你拿着这些写满百分比的表格让我签，可我怎么知道，划给工会，军营的供暖怎么办？划给军队，全城喝西北风怎么办？”\n“现在仗打完了，你们要建新世界，要搞大同公社，结果呢？一遇到理不清的麻烦，都跑来塞到我脸上逼我负责吗！”\n“我懂什么税率？！我懂什么治安条例？！我就是个只懂带着手下保命的军人！我每天晚上闭上眼睛，耳朵里就全是在阵地上的肢体被炸飞炸烂的动静！”\n“在战场上，谁是敌人谁是自己人一眼就能看清；可坐在这个破位置上，你们两边全是他妈的自己人！你说我到底该怎么判？！”\n屋里依旧一片死寂，只有我粗重的喘息声在墙壁间回荡。\n原本坐在柜子旁的小遥悄悄抱紧了怀里的白夜，低着头一声不吭。\n我跌坐回椅子里，按住剧痛的额头闭上了眼睛。\n“印章就在这。”\n“你们谁有本事谁拿去管。”"
PAU.24.a: "“老娘不干了！”"

PAU.25.t: "这出大戏是你开的头"
PAU.25.d: "我闭上眼睛靠在椅背上，打定主意一个字也不会再签了。\n雪伊拉开椅子脸色阴沉地坐下：“阿夏不肯管，工会就绝对不会答应把东区让给军队，军队要是敢强占，今晚工人们就上街跟他们拼了。”\n“工人们一闹起来，全城的物资调配立刻就会瘫痪的，雪伊。”晓枫直视着雪伊，“另外，雪伊，你很清楚我为什么不能接手。在老兵眼里，我是当年带头脱离军团的闹事头子；而在工会眼里，我又总在为了大局物资逼你们向军队妥协。我们这些人身上的旧仇太多了，谁坐上去，底下都会有人觉得是在被仇敌统治。”\n晓枫转过脸，视线穿过满地的纸屑，径直投向了靠在文件柜旁边的那个角落。\n小遥蹲在椅子上，手里拿着一条烤干的咸鱼，正一点点撕成细条喂给膝盖上的白夜。察觉到屋里的死寂，她撕鱼肉的手动作一僵。\n“但要是让那个连自己老家都回不去的外乡丫头坐上去呢？”晓枫开口说道。\n雪伊愣了一下，随即像是听到了天大的笑话一样站起了身：\n“她？！晓枫你疯了吗？！当初就是她在山里满嘴鬼话，骗着阿夏把卡卡罗姆的防线轰开，又把我们所有人骗上那两艘破船到处逃命！她惹出来的祸还不够多吗？！”\n“正因为这祸是她惹出来的，所以必须由她来坐这个位置。”\n晓枫继续说道：\n“她骗了阿夏的军队替她开路，但也带来了撤走伤员的货船；她强行把我们从山里逼了出来，但也帮着工会在铁桥前打退了怪物。”\n“她欠了驻军的债，因为她把老兵当成了抢油料的枪使；她同样欠了工会的债，因为她把大家逼进了大海上的绝路。正因为她两头都欠着还不清的账，她坐在这个位置上才哪边都偏袒不了”\n晓枫指向了窗外的海港方向：\n“更何况，港口里的两艘军舰，以及天天出海拉网带回鲜鱼的水手，都只听她一个人的。老兵和公会谁也没法一口吞下她手里的海防力量。”\n晓枫看着缩在柜子旁的少女：\n“她是个被海对面通缉的流亡者，在本地没宗派，没旧部，更没有能任她调遣的私人军队。她想活下去，就只能逼着我们两边坐在同一张桌子上。”\n雪伊盯着那个还捏着鱼干的少女，沉默了好一阵子，最后还是有些别扭地吐出气来：\n“……在广场上，她确实敢站出来跟老兵和工人们评理。。”\n被三道目光齐刷刷盯住的小遥终于坐不住了。她把白夜一把抱进怀里，整个人往文件柜后面缩去，急赤白脸地嚷嚷起来：\n“喂！你们三个疯了吗？！我当时撒谎是为了找饭吃！你们现在把这么大个烂摊子往我头上扣，是嫌我还不够惹人嫌吗？！”\n我伸出手把泡在咖啡里的印章捡了起来，在袖子上擦干了水渍，随后一把推到了桌子正中央。\n“当初是你把我们从烂坑里忽悠出来的。”我看着她那副慌张的模样，不禁扬起了嘴角，“既然这出大戏是你开的头，那就老老实实坐上台，把剩下的麻烦都给我们好好摆平了。”"
PAU.25.a: "“恭喜你，春日小遥大统领。”"

PAU_gydj: "各押一份定金"
PAU_gydj_desc: "小遥坐上大统领椅子的第一天，根本没去写什么冠冕堂皇的宪章。她把雪伊、阿夏和晓枫直接拽进后厨，指着冒着热气的灶台定下了规矩：军团老兵负责外围防线和重工业开采，但他们的口粮配额必须由公社工会每日签字；工会全面接管市政运作与车间，但治安巡逻必须由一名老兵带着一名工人共同执勤；而水手们带回来的鲜鱼和煤炭，则由港务局按人头平价分发。\n小遥把这套把戏叫做“押定金”。大家用不着装出一副亲如一家的和气模样，但谁要是敢私下里动歪心思，另外两方会在一个小时内彻底掐断他的饭碗。"


PAU_msbf: "莉兰迪亚避风港"
PAU_msbf_desc: "因为先前亡灵的躁动，圣杯王国在海湾外面拉起了防疫警戒线，海对面的樱花军部通缉令也天天在电台里播报着小遥她们的罪行。既然正经的外交途径全被堵死了，小遥索性把大海对面那些对付黑市巡警的手段搬到了南大西洋。\n她让工人们修好了老码头的深水泊位，在灯塔上挂起大灯，公开向公海上所有来历不明的货船发出信号：莉兰迪亚提供全大海最便宜的修船船坞、不收重税的燃油补给，以及装满底舱的优质咸鱼。"

PAU_bzwtp: "那是什么怪物？"
PAU_bzwtp_desc: "在西边的山口处，传回来的报告一次比一次诡异。阿德莱希那边盘踞着的根本不是讲人话的军队，它们是一群长着多余肢体、披着烂皮在废墟里嚎叫的怪物。我们才刚刚从亡灵嘴里好不容易抢回一口气，绝对不能再让这种莫名其妙的脏东西漫过我们的边境线了。"

PAU_mfsn: "她们就是魔法少女吗？"
PAU_mfsn_desc: "东北边那片被称作魔法少女联盟的领地里，据守防线的竟然是一群穿着花里胡哨的裙子、手里拿着发光的……呃…某种高科技机械还是什么东西，和老式长枪的小姑娘。老兵们一开始全都把这件事当成了笑话，直到侦察队亲眼看见那些女孩用古怪的光芒把袭扰的怪物轰成了渣渣。虽然搞不清她们那套力量是从哪儿来的，但至少对方还能讲人话，也没表现出吃人的恶习。先派人接通她们的电台试着打探下虚实，但在彻底摸清这帮神秘邻居的脾气之前，门口的机枪保险谁也不准关上。"

PAU_sbtxd: "听说圣杯来了个探险队？"
PAU_sbtxd_desc: "根据小遥截获的电台消息，进驻在亚马逊河口的远征军，正是当初在海岛上逼我们交出大量物资的那帮圣杯人。这群老爷在大海上颠簸了几个月，对外宣称是要开进原始雨林寻找沼泽里盘踞的那些人形蜥蜴。小遥在看完一张缴获的探险路线图后，笑得差点从椅子上掉下去：“谁会大老远跨过大海专门跑来抓蜥蜴啊？这帮老爷八成是盯上了林子里的矿产和木材。”\n不过玩笑归玩笑，对方那些满载火炮的护航舰确实停在下游水道上。按照小遥的盘算，既然当年我们在海岛上挨了他们的盘剥，现在正好倒过来向他们高价推销丛林探险的物资，顺带看看能不能让他们在丛林前线充当阻挡阿德莱希那群怪物的好帮手；但要是这群探险家敢借着势头让炮口对准我们的工区，我们也随时准备教教他们，到底谁才是这片雨林真正的主人。"

PAU.26.t: "如果我们都在的话"
PAU.26.d: "通讯里跳出了一个此前从未监听过的固定频段，几声清脆的按键声过后，里面传出了一个带着关西口音的年轻女声：\n“我是莉兰迪亚的临时大统领春日小遥。各位魔法少女指挥官们，占用几分钟频率。”\n对方那里还隐约能听见机床冲压铁皮的哐当声：\n“我们的前沿哨兵前几天发回了你们跟那些……是魔女还是什么来着……交火的战况。总之在如今这个秩序碎成渣的大陆上，看到年纪比我们车间里的小学徒还小的女孩端起武器顶在前线，没人会觉得这是什么光鲜亮丽的故事。大家心里都清楚，你们身后肯定也有哪怕失去性命也想保护的人。”\n通讯那里传来了翻动纸张的声响：\n“我们手里有刚出炉的优质钢轨、成箱的口粮，以及能连夜抢修火炮的技工；你们在前线有压制怪物的强悍火力。如果大家都是为了让身后的平民能吃上一顿饱饭而搏命的话，就用不着互相拿枪口瞄着对方了。只要你们愿意把边境的通道打开，我们可以在莉兰迪亚筑起掩体替你们分担阿德莱希那群怪物的压力，甚至我们可以直接合伙，组一个一辈子都不会解散的阵营，一起把生活过下去，你们看怎么样？”"
PAU.26.a: "我们需要能并肩作战的伙伴"
PAU.26.b: "我们各自安好就行了"

PAU.27.t: "找蜥蜴总得先吃饱饭"
PAU.27.d: "一艘悬挂着双色信号旗的小型汽艇在警戒水域外停下了，艇上的扬声器直接向远征军的旗舰播放了一段清晰的明码录音：\n“圣杯王国的远征军指挥官阁下，日安。”\n“我是接管莉兰迪亚港口的春日小遥。我们对贵国的行事章程并不陌生，毕竟不久前你们海岛上的驻军同行才刚按照战时条例，收了我们好大一笔靠港物资，所以贵方的价目表我们心里有数。”\n录音那头传来一声笑声，接着是茶杯磕在桌面上的轻响：\n“听说诸位贵族军官千里迢迢开进亚马逊，为了扫荡沼泽里的蜥蜴人？总之，我们对你们抓爬行动物的兴趣不作评价，但雨林里的恶性疟疾和无底泥潭，可不会因为各位穿着精良的装备就手下留情。”\n“我们手里有足量的药品、行军用具和食物。只要你们承认莉兰迪亚的管辖权，大家完全可以搭伙签个互助协议，由我们替你们守住下游的退路；当然，如果诸位的枪口打算往我们这边挪……那这片复杂的烂地可比大海上的孤岛难走得多。"
PAU.27.a: "我们没必要在雨林里多树立一个敌人"
PAU.27.b: "远征军从不向流民低头"

PAU_zxd: "我们不会再逃跑下去了"
PAU_zxd_desc: "我以前总觉得，只要脚底抹油跑得够快，厄运就追不上我。\n可直到今天我才明白，人越是一味逃跑，身边能站立的地方就越小。\n看看阿德莱希里的那些怪物吧，它们可听不懂什么叫公约，更不会给我们留第二次逃命的港口。如果你们这帮人非要将性命押在我这个满嘴谎话的家伙身上，如果我已经彻底坐上了这个大统领的位置——\n那就谁也别想再后退一步了。\n传令兵，去拉响战斗警报。\n我以莉兰迪亚大统领的名义下令：\n各部队全线出击，\n碾碎阿德莱希！"

PAU_sztytz: "身在南美，不许置身事外！"
PAU_sztytz_desc: "阿德莱希的怪胎虽然被打退了，但大海对面的世界乱成了什么样，大家心里都有数。圣杯远征军的诸位，你们口口声声代表着本土的民主与法治，可你们比谁都清楚，海对面的议会老爷们每次换届选举，削减的都是你们前线的弹药与津贴。你们离家几千海里，一旦海外局势恶化，没有哪张选票会渡海来救你们这些驻军和移民，继续指望本土，早晚会被那套不当人的法条变成异乡的弃卒；而南边的魔法少女们，你们到底打算替这片土地挡多少次灾？世人有难时将你们奉为奇迹，转头又畏惧你们的力量，让几个十几岁的姑娘在黑暗里流血拼命，这算哪门子的理所当然啊？！你们需要真正的学校、能造生活用品的工厂，以及替你们扛枪站岗的同伴，总不能无休止地透支下去直到崩溃。\n这片大陆刚被我们从死人堆里抢救起来，谁也不知道地底下哪天会再冒出亡灵、魔女、五神六神，更不知道海对面的战火什么时候会烧到我们家门口。单打独斗只有死路一条，我们必须把各自的家底全凑到一口锅里。远征军出军舰与航海技术，我们出钢铁、机床和口粮，魔法少女退下前线轮休、去学校念书，大家全都联合起来，这样才能保住每个人吃饭睡觉的安稳日子。\n至于那些到现在还缩在角落里紧闭大门、打着小算盘企图看戏的势力，要是哪天外面的黑手真伸过来了，你们自家的破木头栅栏能顶得住什么啊？我可不打算给大家留几个随时会漏水的透明窟窿。要么带着你们的物资名册坐下来签字，要么，莉兰迪亚的装甲连队今天就开进你们的政府大楼，替你们把字签了。"

PAU.28.t: "要么入伙，要么让开"
PAU.28.d: "通告里的内容简单到了近乎粗暴的地步：莉兰迪亚要求沿途所有独立国家和武装据点在当天日落前作出抉择，要么交出图纸与物资名册，推选代表加入统一的联合议会，共同统合防线与工业；要么就作为阻碍南美大陆统一的顽固阻碍，等待后续部队的物理清除。\n驻守阵地的军官与镇上的代表们正争论得不可开交。强硬派认为这是赤裸裸的武力兼并，主张依托工事顽抗到底；但更多看着库房见底的粮秣员与伤员却很清楚，对面的政权确实拿出了实打实的工业品与口粮，而且对方似乎根本没有打算给任何人留下观望拖延的余地。"
PAU.28.a: "加入莉兰迪亚的联合政权。"
PAU.28.b: "谁也别想强占我们的地盘！"

PAU_xkst: "食堂、学校、以及夏日祭典"
PAU_xkst_desc: "刚将南美的地图拼凑整齐，底下的麻烦就一窝蜂涌了上来。圣杯的移民嫌工厂的工人粗鲁，老兵们看着魔法少女发怵，而那些十几岁的小姑娘则习惯了缩在角落里戒备着所有人。\n在樱花老家的时候，每次港区闹罢工或者街坊邻里扯皮，那些精明的町内会长总喜欢拉着两边去路边摊一边嗦面一边谈话。于是我照葫芦画瓢，在每个农村和城镇划分了各种能够摆摊的摊位，并建立起了食堂与学校。\n魔法少女不能整天待在掩体里擦拭她们的宝石了，她们必须脱下战斗服去学校上课，或者在车间里跟着技师学画图纸也行；圣杯的随军家属和本地工人也必须排同一支队伍领吃的，在摆开的摊位前为一把青菜讨价还价，那些关于阵营和出身的成见总会被热气腾腾的烟火气慢慢磨平。\n要是让老家的同伴看到我居然用搞夏日祭典的套路来治理大陆，估计眼珠子都要瞪出来了。不过管他呢，只要大家能安稳坐下来吃顿饱饭，手段土气一点又有什么关系。"

PAU_zjpb: "直接拍板！"
PAU_zjpb_desc: "圣杯那帮习惯了议会程序的官僚刚搬进市政大楼，就试着用几十页的申报条例塞满我的桌面；公社的代表们又非要为了一个零件的价格开上整整两天的辩论会。\n当年在樱花的造船厂，资方就是用这种繁琐手续将工人的诉求拖成废纸。我现在既然坐在这个位置上，可容不下这种故意磨洋工的恶习。\n我直接设立了巡回仲裁队，由工会、老兵和水手各派一人直奔现场。铁轨断了就立刻去现场调拨钢材，车间抢煤就当场按产出分摊，谁要是敢拿出厚得要死一叠废话公函来推诿扯皮，就给我去后厨削土豆去。\n晓枫经常叹着气说我做事太像个雷厉风行的当铺掌柜，随身揣着印泥和印章到处跑的样子更是不像个正经大统领。但我可没闲工夫去学那些慢吞吞的官僚腔调，早点平息纷争，我还能多抽点时间给白夜梳梳毛呢。"

PAU_bndlsg: "总不能一直当临时工吧"
PAU_bndlsg_desc: "靠着大锅汤、盖印章和沿街吆喝，我们确实将这帮刚打完仗的人按在了同一张桌前。但这套街头应急的法子能管一阵子，却管不了一辈子。食堂里依然有人因为口音和出身掀翻桌子，巡回仲裁队也解决不了错综复杂的土地产权与矿山归属问题。各地的公社想要明确自治权限，圣杯的移民想要成文法典，军队则需要正式的建制预算。我们不能继续像打游击一样靠着临时拍板过日子了，哪怕过程再繁琐、争吵再激烈，我们也必须坐下来，将这片土地长久运转所需的法权架构一笔笔敲定下来。"

PAU.281.t: "印章也有盖不平的事"
PAU.281.d: "遥整个人把下巴垫在白夜软乎乎的背上趴在桌子上，随手将两张皱巴巴的报告纸推到了我面前。\n“西区食堂昨天又有人打架了。圣杯来的水手嫌工人们吃饭声音大，工人们骂水手是外来殖民者，两边抄起椅子砸翻了好几锅汤……还有那个巡回仲裁，西区的林场和煤矿为了同一片林子争管辖权，仲裁队去现场直接拍板把林子分了，结果两边今天同时递了抗议信，说仲裁员不懂林权规矩在瞎胡闹。”\n遥长长地叹了一口气，声音闷在了白夜的绒毛里：\n“我以前在樱花老家看那些町内会长处理纠纷，总觉得只要把大家拉到路边摊吃顿饭、随手盖个章，什么事都能大事化小。原来治国根本不是搞祭典啊……汤面只能填饱肚子，根本填不平几十年攒下来的成见。”\n我拉开椅子在她对面坐下，顺手将凉透的茶水挪到一旁：\n“知足吧。要不是你那几家食堂和到处乱跑的仲裁队，这帮人上个月就该在街上重新拔枪对射了。你替大家争出了喘口气的时间，现在不过是到了该交真正答卷的时候。”\n遥听后，立马坐直了身子，用手掌拍了拍自己的脸颊，随后抓起桌上的笔说道：\n“去把晓枫和雪伊叫来。既然那些糊弄过去的问题早晚要面对，那就把宪章草案摊开，今晚谁也别想早睡。”"
PAU.281.a: "“我们到底是一个什么样的国家……”"


PAU.29.t: "别把毛团扯进来"
PAU.29.d: "雪伊一巴掌拍在摊开的报纸上，指着上面写得密密麻麻的候选名单：\n“‘南美工农武装公社’！这名字哪里不响亮了？！一听就知道工厂和枪杆子归谁管！”\n晓枫坐在对面，手指在桌上轻轻敲击：\n“老兵们看见‘武装公社’四个字就会联想到清算，圣杯的移民更是会连夜把船开走。我提议的‘泛亚马逊工业与防务联合体’在法理上更中立，也更方便跟海外谈生意。”\n“得了吧，晓枫。”我靠在椅背上忍不住插话，“你那个名字听起来像是一家濒临破产的仓储转运公司。”\n“那也比阿夏你写的‘自由卫队联合管区’强。”雪伊翻了个白眼，“不知道的还以为军阀又在大楼里复辟了。”\n几个人从中午争到日头偏西，桌上的废纸堆得老高，谁也不肯让出一步。\n雪伊转头看向坐在桌子末尾的遥：\n“喂！我说春日小遥大统领大人！你天天在公函上盖大印，轮到定国名了，你从刚才开始就一声不吭，该不会连个像样的名字都憋不出来吧？！”\n我和晓枫也跟着转过了视线。\n遥正把下巴放在桌沿上，拿着一根吃剩下的饼干棒专心致志地试图将印泥盒子顶在白夜的鼻尖上。被雪伊这么一嚷，印泥盒啪的一声掉在桌上，把白夜吓得一头钻进了她的袖子。\n遥坐起身子冲着雪伊嚷嚷起来：\n“哈？！干嘛突然冲着我发火啊！还有，‘大统领’这破称呼到底是谁硬塞给我的？！听起来像个长着大胡子的独裁老头，我明明才十九岁，天天被你们叫大统领，感觉头发都要早早掉光了！”\n雪伊被她噎了一下，然后抱胸冷笑道：\n“嫌称呼难听，那你倒是给我们这片地方起个好听的名字啊！”\n遥气鼓鼓地抓过那张报纸，拿起笔唰唰几下划掉了我们之前写下的所有提案。\n她在纸面上写下几个字，随后直接拍在桌子正中央。\n我和雪伊凑上去看，上面写着——\n“白夜同盟”\n雪伊瞪大了眼睛，指着那张纸喊道：\n“你疯了吧？！你打算拿这只昨天刚咬断我电话线的毛团来当国名？！”\n“这怎么啦？！”遥理直气壮地叉着腰，“在我们樱花老家，神社还把狐狸和猫供在牌位上呢！白夜在大海深处护住了货船的龙骨，大家才没沉进海沟里，它立的功劳比你们那些死掉的国王大多了！”\n“而且你们那些名字，什么公社、什么协作区、什么管区，每个字都带着一股想压别人一头的火药味。”\n雪伊原本想要反驳的话卡在了嗓子眼里。\n晓枫盯着那张草稿纸看了好一会儿才开口：\n“老兵不会觉得被公社吞并，工会不用向军队低头，圣杯的移民也挑不出宗派毛病。对外，没有任何一个海外帝国能从这个名字里找出旧条约的由头。”\n晓枫放下笔，抬头看着遥：\n“在政治法理上……确实…没问题？”\n雪伊张大了嘴，有些别扭地看向从遥袖子探出小脑袋的白色小动物，最后哼了一声把头扭向一边：\n“……便宜这只偷吃我香肠的毛团了。”\n我看着那个得意洋洋把白夜举在头顶的白发少女，忍不住笑了起来。\n拿一只贪吃的小动物来命名一整片大陆的国家，这大概是全天下最荒唐的决议了。\n但在这间挤满了逃亡者的大楼里，这确实是唯一一个谁也挑不出刺的荒唐了。"
PAU.29.a: "“那就这么定了，白夜同盟。”"

PAU_sbzq: "书包总比枪托轻"
PAU_sbzq_desc: "巡视了一圈防线和车间，我发现那些十几岁的小孩个个都能熟练地拆装步枪，可递过去一张食堂菜单，居然连上面的白菜和土豆都不认得。\n仗打完了，总不能让下一代人继续当只会扣扳机的文盲。几栋空置的营房被收拾了出来，工人们从造船厂拉来涂了黑漆的木板充当黑板。教员队伍更是凑得五花八门：水手负责教四则运算和看海图，退役老兵教识字，连圣杯留下的办事员也被拽来教地理与历史。\n至于那些习惯了战斗的魔法少女，我也硬给她们在第一排占了课桌。双手既然能用来施展奇迹，就没理由握不住小小的粉笔。哪怕最初只能照着说明书磕磕绊绊地拼读，但这群在硝烟里长大的孩子，终于不用每天夜里抱着枪管入睡了。"

PAU_byq: "印上爪印就能当钱花？"
PAU_byq_desc: "用几箱燃油换几袋土豆的以物易物，应付战时避难还行，要在整个大陆恢复贸易根本就是场灾难。工人们不想靠天天领粮食充当工钱，圣杯的商人也不肯收公社的工时票据，老兵们更是拿着作废的王室旧币四处叫骂。\n各方谁也不认对方的货币，遥就干脆让人腾出了报社的印刷机，用剩下的纸印出了第一批继王室覆灭后的莉兰迪亚统一货币。"

PAU.30.t: "白夜券进入集市的第一天"
PAU.30.d: "“阿夏！看这边！今天本小姐请客，想吃什么尽管点！”\n港口集市的面包摊前，遥走在前方，手里拿着几张刚印出来的白夜券甩得沙沙作响。\n我跟在她身旁，看着她挤到摊位前冲着系着围裙的摊主开口：\n“大叔！来两条刚烤好的黑麦面包！”\n遥将两张白夜券放在摊位上，得意地扬起下巴：“不用找了，剩下的算小费！”\n摊主是个五十来岁的干干瘦瘦的男人。他拿起那两张印着白猫图样的纸条，迟迟不敢将纸片收进柜台，反而从摊位底下端出一个装满废纸的铁盒，放在了遥的面前，用近乎哀求的声音说道：\n“大统领大人……这是新的军用借据，对吧？我们这条街必须强制收下这个，对吗？”\n遥被他这一声称呼问得愣在原地：\n“……这怎么会是借据呢？这是白夜券呀，拿着这个去货栈，能随时兑换粮食和生活用品呢。”\n摊主指着铁盒里那一叠叠盖着金印与官印的纸条，眼圈红透了：\n“以前王室的大臣也是这么说的。他们印了一批又一批写着承诺的钞纸，拿走了车间里的钢材，搬空了磨坊里的面粉。等商户们攒下一整箱废纸去换粮，换来的除了一顿毒打便是一文不名。家里的大人孩子饿得倒在床上连下床的力气都没有了……我们真的经受不起再被骗一次的后果了……”\n周围买东西的码头工人与市民围拢过来，一道道满含戒备与绝望的目光投向了摊位前站着的白发少女。\n遥原本神气的表情彻底凝固了。\n她呆呆看着那只装满欠条的铁盒，手里的面包忽然沉重得难以握持。\n我站在她身后，低声说道：\n“王室当年用欠条骗了大家多少年了？在他们眼里，我们这些印钞的人，和当年拿枪抢粮的强盗毫无区别。”\n遥在摊位前站立良久。她脸上的任性与轻浮散得干干净净，伸手抓住了摊主的围裙：\n“大叔，带上你的面袋，现在就跟我走。”\n摊主有些不知所措：“去……去哪儿？”\n“去货栈，去用白夜券买东西的地方。”遥的声音带着前所未有的坚决，“我春日小遥今天就站在兑换窗口前亲自给你们当保证人。要是兑换处的人敢少给你一两吃的用的，我就当场替你端了他们。”\n刚迈出一步，她像突然想到什么一样扭头看向我：\n“阿夏！去调两卡车的油粮拉到集市里来，我们直接把兑换台直接架在所有摊位前面。今天我哪儿也不去，我就在窗口守着，直到城里所有人手里的白夜券都能换出真正的粮食为止！”"
PAU.30.a: "“我们必须做给所有人看才行。”"

PAU_yjl: "大家要有个讲理的地方"
PAU_yjl_desc: "当年在工区，军团的坦克曾经无情地碾碎过工人们的罢工队伍，那些留在车间外墙上的弹孔到现在都没能填平。如今战争结束了，死难工人的家属在领口粮的队伍里，总能撞见当年扣动扳机的老兵。私底下的寻仇与斗殴几乎每天夜里都在巷子里上演。\n光靠几家食堂的客套话，抹不平当年的血债；可要是放任私刑，整座城市立刻就会被复仇的火苗重新点燃。我们必须设立真正的法庭，颁布公开透明的法典。当年的暴行必须由审理官在日光下核实并给予补偿，无休止的私下报复也必须明令禁止。从今天起，不管是扛枪的老兵还是握扳手的工人，解决旧怨的唯一途径只能是法庭的判决，而不是手里的枪栓。"

PAU.31.t: "当年是谁签的字"
PAU.31.d: "我推开侧厅的门，晓枫正坐在那张堆满文件袋的桌子后面，手里正拿着一瓶墨水往砚台里倒着。\n桌子正中央摆着明天第一场公开听证会的卷宗，封皮上用墨水写着“莉兰迪亚工人起义”。\n我拉开椅子坐下，伸手翻开那份卷宗的第一页。上面赫然夹着当年军团的调令，最底下的指挥官签名处签着我的名字，而在行动路线的测绘图角落里，还留着晓枫当年作为参谋长画下的工整图例。\n“你真打算明天把这份卷宗原封不动地公开？”我抬起头问她。\n晓枫放下墨水瓶，拿起吸墨纸吸了干纸面上的残墨：\n“受害工人家属的诉状已经递上来了。当年死在车间门口的十几名工会干事，家属要求确认开枪军官的责任。既然要设立真正的法庭，第一桩案子就不能搞任何幕后调解。”\n“我的名字在调令最底下。”我扯着衣领靠在椅背上，“工人们恨透了当年的军团，他们明天会指着我的鼻子骂死我的。”\n“测绘封锁网的人是我，图例底下也有我盖的章。”晓枫的声音没有一丝动摇，“后来我虽然脱离军团退进了山里，但这不代表我在工区画下的封锁线没有困死过人。”\n她将一份正式的传唤应诉书推到了我面前，上面已经工工整整签好了她自己的名字：\n“阿夏，底下的老兵和公社之所以天天在街上拔刀子，就是因为大家都在怀疑新政权会包庇自己人。如果我们这两个当年的军团主官不敢站在法庭上接受质询，这间屋子里立起来的法典就跟王室的欠条一样，全是废纸。”\n我握住了笔。那场在暴雨里碾碎街垒的旧事，像一根扎在骨头里的硬刺，随着每一次呼吸都在隐隐作痛。\n逃避了这么多年，这笔债务终于还是追到了眼前。\n“赔偿金从我们两个每个月的津贴里扣。”我在应诉人一栏干脆利落地签下了自己的名字，将笔啪的一声拍在了桌上，“明天上午，我们一起去听受害家属当面骂娘。”\n晓枫收起那份签好字的卷宗，一直紧绷的眉头终于舒展了一些，轻轻推过来一杯还热着的咖啡：\n“放心，法庭门口不会安排卫队。要挨臭鸡蛋，也是我们两个一起挨。”"
PAU.31.a: "去准备明天的庭审发言吧。"

PAU.32.t: "军礼"
PAU.32.d: "我刚走到法庭大厅的台阶下，就被迎面冲过来的两个老营长堵在了廊柱旁边。\n带头的是当年在工区带队开车的巴罗，他脸上的烧伤疤痕涨得通红，一把扯下胸前那枚军团的勋章砸在石柱上：\n“阿夏长官！你真打算走进去向那帮工会的人低头认罪？！”\n几个换岗的卫队老兵停下了脚步，目光同时压了过来。\n“当年在工区开火是王室下的死命令！军令如山，不上前线就是军法处决！”巴罗嗓门粗得像是在阵地上吼叫一样，“弟兄们在泥里打滚，被弹片削掉了皮肉，后来又跟着你跨过大海四处挨饿！我们帮着抢回了港口，打烂了亡灵，现在仗打赢了，你却告诉我们，我们全被打成了该被审判的凶手？！”\n他一把抓住了自己的枪带：\n“今天你去向工会认罪，明天工人们就能将绞索套在每一个老兵的脖子上！弟兄们咽不下这口气，大不了咱们回营地拉出坦克，跟他们拼个鱼死网破！”\n我停下脚步，伸手一把揪住巴罗的衣领，将他整个人拽到了眼前：\n“拼个鱼死网破？然后再将这片好不容易建起来的家园再轰碎一次？！”\n巴罗眼睛瞪大了。\n“听清楚了，巴罗。”我盯着他的眼睛，压低了声音，“今天站在审理台上挨骂的是我，名字写在应诉书上的是我和晓枫。当年在工区下达突击命令的人是我，如果有人该为当年的血债负责，那个人只能是我这个带队的最高长官！”\n我松开手，替他拍平了被扯歪的肩章：\n“你们以为老娘愿意去受审？但如果不把当年的罪责清清楚楚查明白、将王室的烂摊子挑到日光底下，你们脱下这身军装走到街上，工人们就会在黑巷子里用铁棍砸烂你们的脑袋！”\n“我今天走进去，就是要当着全城人的面将所有罪名揽在指挥层头上。只要法官敲下锤子，过去的旧怨就到此为止。从明天起，谁要是敢越过法典去动底下一个听令开火的大头兵，老娘第一个带枪毙了他！”\n巴罗站在原地愣了好一会儿，原本紧握着枪带的手慢慢松开。他捡起掉在石阶上的勋章，塞进了军服口袋里，随后挺直身板，向我敬了一个庄重却又无比沉重的军礼。\n我没有再多说一个字，迈步推开了法庭厚重的大门。"
PAU.32.a: "“开庭吧。”"

PAU.33.t: "我们站在审理台前"
PAU.33.d: "旁听席左侧坐着佩戴黑纱的工人家属，右侧则是军容齐整的老兵。\n法官敲响法槌，当众宣读针对当年工区惨案的起诉书：\n“鉴于基层士兵受制于王室严酷的战时连坐法令，抗令者当场处决，故法庭免予追究一线战斗人员的个人刑事责任；但签署突击命令的阿夏、测绘封锁路线的晓枫，必须直面死难者的诉求。”\n起诉书念到晓枫的名字时，工会席位上突然站起一位满头白发的老车工：\n“法官阁下！晓枫同志后来退进深山带我们打了数年游击，港口保卫战也是她带着大家守住了车间！当年她在图纸上签字必定受了蒙蔽，工会愿意为她担保！”\n工人们低声议论起来，目光在泛黄的图纸和晓枫身上来回摇摆，神情满是纠结。\n紧接着，念到我的名字时，后排的老兵们霍然起身，巴罗张大了嗓门怒吼：\n“阿夏长官保住了所有人的性命！莉兰迪亚的恶战是她顶在了最前沿！如果要判长官有罪，我们这些老兵全部同罪受罚！”\n大厅内顿时骚动起来，两边的呼喊声几乎要掀翻屋顶。\n晓枫转过脸面向工会席位，声音严厉而清脆：\n“工会的各位同志，肃静！”\n她将双手按在受审栏的木桩上：\n“当年在指挥部画下封锁线的人是我。我很清楚那张图纸会封死车间的退路！如果因为我后来替大家打过胜仗便抹去过去的血迹，那今天这座法庭和王室随心所欲的赏罚有何区别？！我站在这里，求的是公正的裁决，概不接受任何功过相抵的情分！”\n我也跟着转身，指着后排骚动的老兵们厉声喝道：\n“全都给我坐回去！我当年亲口下的命令，死了人就该我站在这里担责！如果因为我带你们活了命便能凌驾在人命之上，那我们当年碾过工区的行为就永远都成了正确！我们要的是所有人头顶上的法典，谁也别拿袍泽情义来坏了规矩！”\n随着两边的喧闹声被我们两个坚决压了下去，大厅内终于停止了喧闹。\n法官再次敲响法槌，面容肃穆地看向法庭两侧：\n“法庭充分知悉二位被告在抗击亡灵与建立同盟中的历史功绩，亦清楚工会与军队各自的陈情。然而，在法理层面，功勋与罪责从来都不可混为一谈。”\n法官展开判决书，声音清晰回荡着：\n“下达屠杀指令的王室已被依法定性为非法暴力。二位被告作为执行防务的主官，罪责确凿，无可推卸。依据同盟过渡期法权条例，本庭判决如下：”\n“一、阿夏、晓枫战争罪名成立，载入同盟永久司法档案，剥夺二人过往军职所附带之一切终身豁免权；”\n“二、查封原军团留存之战时特别账户，并入受害者抚恤基金；二人名下薪资按月强制划拨，用于抚恤死难者遗孤直至成年；”\n“三、鉴于二人具备同盟防务与工业建设不可替代之调度能力，判处二人以民事公仆身份终身服役，接受工会与民政委员会之双重司法监督。”\n“退庭！”\n法槌落下，发出沉闷的回响。\n工人们紧握着照片久久伫立，老兵们默默垂下了头。\n席位上鸦雀无声，无人欢呼，亦无人再出言抗议。\n旧时代的血怨终于被这柄象征着新时代的法槌定格，而前方的路，向所有人敞开了大门。"
PAU.33.a: "走吧，该去干活了"

PAU_bycx: "别对着毛团乱拜了"
PAU_bycx_desc: "去街上转悠的时候，我发现好几个拐角都立起了小神龛，里面供着白夜的木雕，底下堆着烤鱼干、白米饭和点着的蜡烛。经历过亡灵浩劫的人们太渴望抓住一点寄托了，大家不仅坚信白夜的绒毛能驱散疾病，甚至把我也传成了从大海对面渡海而来的神使。\n这都算哪门子的怪事啊！当初定下这个名字是为了让军队和工会别再继续争吵，可不是为了给自己立牌位的！更要命的是，白夜那只贪吃兽每天夜里偷偷溜出窗户，将全城神龛里的香肠和点心吃得干干净净，现在胖得连窗台都快跳不上去了。\n强行下令拆除神龛只会让担惊受怕的平民更加惶恐。我和晓枫商量后，索性将这种盲目的狂热引导为同盟的民俗集市，将供奉神仙的习惯改造成了社区互助活动。谁要是敢借着白夜的名头私设教派敛财，治安队会直接把他押去开荒修路。至于那只日渐发福的毛团……"

PAU.34.t: "它真的吃不下了"
PAU.34.d: "我和遥顺着后巷找过去的时候，拐角那处堆着木箱的空地前正围着好几个人。\n一个擦得干干净净的木箱上铺着红布，上面点着两支蜡烛。白夜正四脚朝天瘫在供盘正中央，圆滚滚的肚子鼓得像个小瓜，嘴里还咬着一根炸得金黄的小鱼干。\n旁边跪坐着一个包扎着臂膀的退役炮手，还有两个提着菜篮的妇女，嘴里正念念有词地念叨着家人的名字。\n“喂！白夜！你今天到底在外面蹭了多少顿饭？！”\n遥一步迈上前，提着白夜后颈的皮毛将它拎了起来。那团白毛嘴里还叼着小鱼干，四条短腿在空中无辜地扑腾着。\n跪在地上的老兵吓了一跳，连忙摆手阻拦：\n“春日大人！使不得啊！那是送给护国白兽的供奉，乱动会招来厄运的……”\n“招什么厄运啊！”遥气得直跺脚，将白夜塞进了我怀里，“你们再这么毫无节制地喂下去，它明天就得得急性肠胃炎！哪家神仙会长一身肥膘连老鼠都追不上啊！”\n身旁那位提着菜篮的妇女低着头，小声解释着：\n“当初亡灵围城的时候，家里的小孙子吓得天天夜里哭醒发高烧……街坊都传白夜身上的白毛能驱散不干净的邪气，我们这才……”\n遥嘴边的数落声停住了。\n她瞥见妇女篮子里那顶小毛线帽，在台阶上直接坐了下来，伸手从供盘里拿了一块玉米饼掰成两截递了回去：\n“小孩子夜里发烧，明天早上去西区公立诊所找大夫领退烧糖浆，求这个吃了睡睡了吃的懒蛋可不管用。”\n遥自己咬了一口剩下的玉米饼，嚼得两腮鼓鼓的：\n“不过这饼烙得挺香。神龛以后准许摆，但里面不准放荤腥，供品也得由街坊邻居自己分着吃了，就当成大家聚在一起聊天的理由好了。至于白夜——”\n遥指着在我怀里打着饱嗝的小动物大声宣布：\n“从明天开始，谁要是再敢偷偷塞给它炸鱼，我就罚那个人去市政大楼给全同盟的办公椅地下全扫一遍！”\n巷子里原本紧绷的气氛被她这番话逗得松散开来，老兵和妇女都忍不住跟着笑出了声。"
PAU.34.a: "别忘了明天给诊所多送几箱药"

PAU_mgsh: "别忘了我们的老朋友"
PAU_mgsh_desc: "圣杯本土的议会发来了一封满是问号的越洋电报，大老爷们完全搞不明白，为什么自家的远征军会跟造船厂工人坐在一张桌前，甚至还听从一个樱花姑娘的调遣。更让他们摸不着头脑的，是报告里那些被正式登记进市政名册、享有公民待遇的魔法少女。\n既然海对面想要个说法，我们就清清楚楚给他们写一份回电。同盟依法确立魔法少女的受教育权与民事身份，由公立诊所定期分担她们的身体负担，严禁任何势力将她们视作雇佣兵或者消耗品；对于圣杯，遥在电报里直截了当地说明了利害：你们的士兵并未背叛民主，他们选择留在这片能吃上热饭的土地上守护家园。同盟愿意向圣杯的远洋商船开放免税泊位并签订互惠贸易条约，但要是海对面的议员打算派战舰来兴师问罪，港口的大炮可认得每一艘试图侵犯水域的武装船只。"

PAU.35.t: "这封电报简直荒谬透顶"
PAU.35.d: "外交大臣将刚译出来的电报纸摔在议事桌上，脸色阴沉得像要下雨：\n“这封电报简直是对圣杯王国议会的公开挑衅！那个自称遥的樱花小姑娘，在信里竟然大言不惭地让我们把远征军的抚恤金账单销掉！”\n几位海军将领凑上去，电报纸上的文字直白得让人目瞪口呆：\n“圣杯王国的议员先生们：远征军的士兵目前身体健康，每天都能吃上热饭，这边的工人也替你们的护航舰换好了新零件。诸位在议会辩论里争吵的那几笔海外军费，现在可以从预算里划掉了；但如果各位打算派舰队来押解这批人回去受审，请务必提前发电通报，港口的大炮已经校准好了射角。附言：我们的免税泊位随时向贵国商船开放。”\n“荒唐！这帮远征军擅自脱离圣杯王国管辖，竟然还跟工人和那帮会用奇特法术的魔法少女混在了一起！”一位保守派议员拍案而起，“必须立刻派主力舰队前往南美，封锁航道，将这帮叛逆押送回国！”\n负责财政的副大臣揉了揉额头，无奈地打断了他：\n“派舰队横跨大海的燃油开销，议会昨天才刚否决掉。更何况，电报里写得很清楚，他们占着深水港，手里有火炮坦克坦克和那群战力不明的女孩。我们要是真开着军舰过去，除了替圣杯王国的造船厂增加几艘战损名单，换不来哪怕一圣杯盾的收益。”\n他指了指电报最后的附言：\n“比起花重金去打一场胜负难料的远洋战争，他们开出的免税港和廉价木材，反而能让商会那帮选民高兴好一阵子。”\n议事大厅里陷入了长时间的争执，所有人都盯着桌上那张电报纸，等待着最后的表决。"
PAU.35.a: "既然省了军费还能通商，那就按条约签字吧"
PAU.35.b: "圣杯王国不可能承认这种非法的流亡者同盟！"

PAU.37.t: "梦"
PAU.37.d: "梦里总能听见电车驶过路口时的叮当声，伴随着细密的雨水敲在了教室的玻璃上。\n老家海港小镇的空气里常常混着煤烟与路边炸肉饼的油香。变故并不是突然降临的，最初是老师不再来学校，换成了穿着土黄色制服的教官用墨条涂掉课本上的句子；接着是纺织厂的年轻女工们在傍晚的站台边分发传单，路过的人看上一眼便慌慌张张塞进口袋；最后是造船厂吊车顶上的防空警报在黄昏时分尖啸起来。\n记忆里的那条巷道很窄，脚底的木屐踩在雨水积聚的石子路上打着滑。藤井拽着我穿过堆积钢材的阴影，将那团缩成一团的小动物硬塞进我的怀里，推着我爬上了运煤船的舷梯：\n“遥，带着山灵先走，船开了就别回头！”\n躲在煤堆深处的漫长航程里，透过甲板舱盖的缝隙只能看着故乡栈桥上的灯火一点点缩成微弱的光点。那些掩护我翻上船舷的同伴，全被留在了码头刺眼的巡逻车灯光底下。\n这么多年过去了，我在大海对岸装成精明的说客，学着像模像样地跟军官和工会拍桌子争论法典，可每次睡着的时候，自己依旧是那个躲在货舱深处不敢出声的逃亡学生，不知道当年留在岸上的那些名字，现在是不是也已经被浓黑的墨迹彻底抹掉了。\n……\n下颌上传来温暖的触碰，白夜的小耳朵正贴着我的脖颈轻轻蹭动。\n我从办公桌前抬起头，日光顺着窗沿斜铺在摊开的地图上。\n身上穿着沾着泥印工装的阿夏正靠在门框边，手里端着刚接好的凉水：\n“醒了？刚才听你趴在草稿纸上嘀咕着什么电车站和下雨。”\n我用袖子擦掉脸颊上的压痕，目光停在墙面地图西北角那片狭长的岛屿群上。\n“阿夏。”我轻声唤她。\n“怎么？”阿夏放下水杯。\n我揉了揉白夜的耳朵，低声说道：\n“等秋粮全部入库、海湾的新泊位建好……陪我回一趟老家吧。”\n“当年我一个人逃跑丢下的那些人，总得回去看看他们还在不在。”"
PAU.37.a: "……"

PAU_zgjd: "海那边可都是正规舰队啊"
PAU_zgjd_desc: "码头上的修船厂原本用来维护运送香蕉和矿石的商船，想在这里凭空造出一支正规海军无异于痴人说梦。我们手里真正能动用的作战力量，依旧是像当年开过来的那艘巡防舰与军需货船一样的军舰。\n大海对面的樱花军部，手里握着的是成排的主力战舰、航空母舰和受过严苛训练的庞大舰队。藤井在海图室里指着远洋航线说得很直白：那帮狂热军官掌控了本土所有的造船厂，一旦我们在西太平洋露头，迎面撞上的就会是铺天盖地的舰炮齐射。\n这可不是几艘改装炮艇就能应付的远航。我们必须征用海湾内所有适航的远洋货轮，在甲板上加固加厚钢板并吊装大口径岸防炮，将退役炮手与水手磨合成合格的损管抢修队，同时尽可能多地囤积远航所需的燃油。哪怕是拿民用船只拼凑出来的舰队，也必须具备在远洋重炮的猛烈轰击下强行撕开封锁线的决死战力。"

PAU_zszz: "现在可不是客气的时候"
PAU_zszz_desc: "面对大海对面成群结队的主力舰队，继续在城里搞私下倒买倒卖无异于自寻死路。遥在市政大楼的黑板上用力画了个大圈，宣布进入战时统制状态：所有的燃油储罐、钢材储备与修造船坞，即日起划归联合生产会统一调度。\n任何囤积居奇与投机倒把的行为被明令取缔，各工区直接选举工人代表监督物资分配，确保造船技师、防卫士兵与普通家属每天都能领到对等的口粮与御寒衣物。老兵们放下了对额外津贴的坚持，圣杯的移民商队也同意按照平价向船队供应重油，整座大陆的力量开始严丝合缝地咬合在了一起。"


PAU.38.t: "谁也不是为了当英雄"
PAU.38.d: "埃文斯把一份签满外文名字的舰队名单放在桌上，他的制服领口敞开着，显然刚和手下的船员发生过激烈的争吵。\n我递过去一杯凉水问他：“你们那些水手真愿意登上改装后的货船？我还以为他们更想开船回本土去。”\n“回去当无业游民吗？”埃文斯端起水杯一口饮尽，“本土的议会早就把远征队的后勤预算冻结了。要是空着手回去，我们是要上军事法庭的。留在莉兰迪亚，至少每月能按时领到粮食与津贴。”\n埃文斯指了指海图上的航道：\n“何况樱花军部的潜艇已经在太平洋击沉了不少商船了，他们正试图封锁大海。如果不能把航线打通，我们在南美的港口早晚也会变成与世隔绝的死港。参战不仅是为了帮你们，也是为了保住我们自己的退路。”\n门口传来推门的声响，巴罗夹着一个文件袋走了进来：\n“长官！老兵们的报名表收齐了，装甲连和炮兵连的志愿书全在这里。”\n我抬起头打断了他：\n“我都纠正过多少遍了，我现在是个在工地上领基础工资的施工员，判决书还在市政大楼门口贴着呢。你再张嘴闭嘴叫我长官，公会的监督员明天就得给我记一次违规。”\n巴罗动作停顿了一下，有些尴尬地清了清嗓子：\n“叫习惯了，换个称呼舌头会打结的。”\n我翻开老兵们的申请名单：“法庭已经保证了退役抚恤和土地。你们留在城里种玉米，晚上能睡安稳觉，何必跟着船队去大海上拼命？”\n“种地？”巴罗低声说道，“弟兄们打了十几年仗，除了装填炮弹和修坦克履带，做起别的活计笨手笨脚。当年我们听信王室的命令向同胞开火，走到哪里都觉得抬不起头。现在跟着遥去大海对面，是去阻击那些肆意侵略的军队。哪怕最后沉在海里，我们墓碑上刻的名字也不至于让人骂一辈子了。”\n桌上并排摆着两份名单，一份来自想保住饭碗的外国远征军，一份来自想要洗刷耻辱的退役老兵，所有人都在为了各自最现实的生计与尊严寻找出路。\n我抓起桌上的笔，在联合出航的调度单上签下了自己的名字。"
PAU.38.a: "“去核准舰队的登船名单吧。”"

PAU_zdgj: "既然这套办法管用"
PAU_zdgj_desc: "当初为了糊口随手搭起来的那些摊子，现在成了撑起同盟最重要的支柱。既然食堂能让老兵与工人坐在一起吃饱饭，白夜券能稳定换出粮食与燃油，现场拍板能免去无休止的推诿拖延，那就干脆将这些经过实战检验的规矩彻底升级为同盟的永久战时体制。\n食堂全面推行全天候供应，优先保障修船工人、远航水手与伤患的营养配给；白夜券与市政物资库实现深度绑定，任何企图利用外币投机囤积的行为都会被依法查处，确保每一斤钢材与每一桶燃油都能直达码头；而车间里的工人委员会与防卫代表则直接统管生产节拍，将火炮吊装与船体加固的进度精确落实到每一个班组。"

PAU.39.t: "不要再搞封建迷信了啊"
PAU.39.d: "小果子正站在壁柜前，规规矩矩地整理着两盘刚蒸好的红豆包。\n柜子最上层端端正正摆着一张木框画像，上面是画出来的遥和白夜。白夜本尊此时正大模大样地蹲在盘子旁边，欢快地舔着包子上的糖霜。小果子合拢双手，十分虔诚地拍了两下手掌，嘴里还小声念叨着祈词。\n夹着几份物资清单的遥从门口路过，看到这一幕立马停下了：\n“小果子……你在那儿拜什么呢？”\n小果子的语气格外认真：\n“在向春日大明神和白夜大人祈祷今天库房的土豆不要受潮变质呀！”\n“哈？！春日大明神是谁啊？！”\n“就是遥姐姐你呀！”小果子理直气壮地指着画像，“码头的大婶说了，遥姐姐是带着白兽渡海拯救大家的神使。水手们也说出海前对着白夜大人拍两下手，就能网到吃不完的大鱼呢！”\n遥手里的清单差点脱手飞出去，直接冲到柜子跟前，揪住白夜脖颈上的软毛将它提了起来：\n“什么大明神啊！我是大活人！哪家神仙天天在车间里核对配额啊？！”\n遥指着小果子，气得直跺脚：\n“还有，水手能捞到大鱼是因为藤井带队找准了洋流！上次我就说过了，白夜就是个贪吃鬼，它要是能保佑丰收，天底下就再也不会饿肚子了！”\n遥顺手从盘子里抓起一个红豆包塞进嘴里，恶狠狠地嚼着：\n“听好了小果子，立刻把这个架子撤掉！我都说了多少次了！我们是靠大家的双手把同盟建起来的，谁准许你们搞这种乱七八糟的封建迷信了？！以后全城谁要是敢借着这种理由建庙烧香，我就停发谁的零食！”\n小果子委屈地收起盘子，小声嘟囔着：\n“可是……昨天拜完之后，修配厂的零件真的准时造出来了嘛……”\n我倚在门边，拿起盘子里剩下的另一个红豆包咬了一口：\n“看来春日大明神的法力确实挺灵验的。”\n遥冲着我大声嚷道：\n“阿夏！连你也跟着起哄！今天谁也不准再提‘大明神’这三个字！听到没有！”"
PAU.39.a: "“……春日大明神，保佑明天工地的吊车别掉链子。”"

PAU_ldwm: "于是轮到我们去追他们了"
PAU_ldwm_desc: "本土那些狂热的军官以为掌控了主力舰队就能为所欲为。他们逼着学生穿上军装去送死，把战火烧向了隔海相望的中国，还妄图在整个太平洋上建立起任由他们劫掠的统治秩序。\n他们当初把我们打成叛乱者和通缉犯，以为隔着大海就能将反抗的火苗彻底掐灭。行啊，那就让他们睁大眼睛看看，从大海这头开回去的到底是一支什么样的队伍！\n我们的甲板上装着南美的钢材与火炮，舱室里坐着再也不愿忍气吞声的普通人。我们横跨大海，就是要去捣毁军部的大本营，夺回属于工人和学生的家园。\n给本土还在地下坚持斗争的工友们、以及海对岸正在浴血抗战的中国同胞发报：白夜同盟的远征舰队已经拔锚，我们现在就回去当面做个了结！"

PAU.40.t: "如果他们看见现在的我"
PAU.40.d: "夜晚的风带着些许凉意。\n我坐在山坡上，膝盖上蜷缩着熟睡的白夜。脑海里挥之不去的，都是那些原本已经模糊的面孔。\n坐在我前排喜欢在笔记本上画花球的同桌，她的两个哥哥被强行征召入伍后再无音讯；总是偷偷塞给我烤番薯的船厂老钳工，因为藏了一张反战传单便被宪兵抓走；还有那些听信了广播里的狂言、勒紧裤带把最后一口粮送去前线的邻居。\n这场即将爆发的远征，在那些故乡人的眼里究竟是什么样子？\n当挂满火炮的庞大船队出现在海平线上，他们看见的是解救同胞的故人，还是跨海而来、企图摧毁他们家园的侵略者？\n我原本的一生应当平淡无奇：在海边小镇的屋檐下躲雨，挤着傍晚五点的电车回家，在工休时分吃一块刚出锅的肉饼，然后平凡地老去。究竟是从哪一天开始，我居然背负起了成千上万人的命运，带着整支异国舰队回去向生养自己的故土宣战？\n“一个人躲在这里发呆可不好，各舰的锅炉现在可都点着火了。”\n阿夏不知何时就在我身旁坐了下来，朝我递来一罐饮料。\n我用衣服擦了擦额头，轻声问道：\n“阿夏，你说……老家码头上的那些熟人，看见我带着装满大炮的舰队开回去，会觉得我是个带来灾难的敌人吗？”\n阿夏仰头喝了口水：\n“换作任何人，看见军舰堵在家门口都会感到恐慌。”\n“当年我开着坦克冲进工区，自以为在履行军人天职，结果在工人们眼里，我成了屠杀同胞的刽子手。直到前几天我脱下军官制服在工地上推车，他们才肯走上前递一碗水。”\n阿夏指了指港湾里整装待发的船队：\n“我们开船回去，不需要他们对我们心怀感激。船上的大炮是为了去捣毁那些绑架了所有人的军部大本营，而不是向普通民众炫耀武力。等战火平息之后，你走下舷梯，去街上买几个小吃，坐在车站台旁边跟他们一块吃——到了那个时候，大家自然知道回来的究竟是谁了。”"
PAU.40.a: "“走吧，该登舰了。”"


PAU_llbg: "呼叫当年的暗号"
PAU_llbg_desc: "随着舰队逐渐逼近西太平洋，遥在通信机上调出了当年学生会与造船厂约定好的备用频段。那是她在逃难前夕与留在港口的同伴们最后约定的联络方式。既然舰队已经带着火炮与钢材重返故土，她迫切需要唤醒潜伏在本土的地下反抗组织，摸清要塞布防与巡逻盲区，去接应那些当年在警笛声中掩护她翻上货船的故人。"

PAU.41.t: "老友"
PAU.41.d: "在通信机的指示灯跳动之后，刺耳的杂音突兀消散，频道竟然顺利接通了。\n遥抓着话筒，语速飞快地念出了当年的暗号后继续说道：\n“我是遥！白夜同盟的舰队已经在近海就位了！美月，你们还在港口吗？！”\n听筒那头只剩下微弱的电流杂音，直到那阵熟悉的脚步声停下，才传来一个毫无起伏的女声：\n“春日小遥。你果然带着外国舰队回来了。”\n遥愣在操舵台前，把话筒贴在了耳边：\n“美月？你……大家还好吗？工会的人呢？”\n“当年的工会早就被依法取缔了。”那头的声音毫无波澜，“我们主动向治安特高课检举了所有的反战分子。那些顽固不化的家伙现在正关在毒气试验舱里，他们的尸骨会成为帝国圣战最光荣的肥料。”\n“包括当年的老师，也是我亲自签署的告密书。多亏了他，我现在已经是造船厂女子挺身队的队长了。”\n听筒里隐约能听见那边整齐划一的军靴踏地声与狂热的口号：\n“你以为带着几艘外国破船能改变什么？全校的学生都在争相报名特攻队，连十多岁的孩子都在车间里装填炸药呢，大家都迫不及待要去炸沉你们这些叛国者。”\n“春日小遥，你才是背叛了国家的劣等国民。你的无线电信号已被三角测向锁定，防空警报已经拉响了。”\n嘟——嘟——嘟——\n频道被单方面切断，听筒里只剩下了一片盲音。\n遥维持着握着话筒的姿势一动不动僵在了原地。\n我站在她身侧，听完了通讯里的全部内容：\n“这就是军国主义把整个社会彻底吞噬之后的模样。”\n遥将话筒扣回铁钩上，低头注视着眼前的海图：\n“……阿夏。”\n“我在。”\n“通知各舰，主炮解除保险。”"
PAU.41.a: "“……准备迎击敌舰。”"

PAU.42.t: "美月的日记"
PAU.42.d: "通信机吐出了一截尚未销毁的备用电文记录，那是美月在切断频段前，顺着同一条线路同步传过来的随笔日记。\n纸面上的字迹清秀却显得格外用力，记录着这几年里那个小镇上发生的事情：“四月十二日\n隔壁佐藤家的次子在大陆战死的消息传回那天，佐藤太太在院子里跪了一整天。她一声都未曾哭喊，手里不停地缝着白布，因为街坊里长站在门外说，为国捐躯是全街区的无上光荣，家属若是落泪便是对英灵的不敬。\n大家都在害怕。街坊邻里彼此低着头快步走过，谁也不敢交谈，生怕脸上的哀伤被当成不忠诚的证据。母亲咳得越来越厉害，家里剩下的杂粮已经见底。小遥，我好想念过去我们在走廊下躲雨的黄昏，那时大家脸上的笑容，究竟是从哪一天开始彻底消失的呢？\n\n五月十八日\n教官在课桌前握住了我的手。他的语气温和得令人害怕，他说老师私下珍藏的外国诗集会动摇前线士兵的意志，若是士兵犹豫，就会有更多像佐藤家那样的年轻男孩子死在战场上。他说他拿走书本是为了医治老师的糊涂，是为了保护大家。\n我相信了他。我带着宪兵翻开了教室的地板。\n直到老师被推上卡车、他年幼的女儿哭倒在泥水里捡拾撕碎的图画时，我才跪在地上明白过来，是我亲手将敬爱的老师送进了深渊。\n\n八月二十日\n母亲昨晚在工场的机床旁倒下，再也未曾醒来。她闭眼前抓着我的衣角，反复向我道歉，愧疚自己生病拖累了国家。\n今天清晨，我跟着挺身队去码头给开拔的运兵船送行。甲板上站满了与我们同龄的孩子，他们头上绑着白带，微笑着向岸上挥手，大声唱着出征的歌。那一刻我站在人群里，浑身冰冷地明白了一件事：在这个狂热的国度里，善良与人性的存在本身便成了罪过。无论是死在异乡的士兵、倒在深渊里的老师，亦或病逝的母亲，全都在被这个看起来像是人类国家一样的怪物碾成粉末，而活下来的人，必须争先恐后地为这头怪物献上赞歌。\n若是违背他们的疯狂，我该如何承受出卖老师、失去母亲的痛苦？\n小遥，我已经学会了高声喊口号，学会了像他们一样对哀鸣视若无睹。你千万不要再回来了，因为我已经彻底变不回从前的那个美月了。”"
PAU.42.a: "……"

PAU_byzc: "大家都可以哭出来了"
PAU_byzc_desc: "街口那些用来监视邻里言行的告示牌被拆除了，再也不会有人因为悼念战死的亲人而被扣上叛逆的罪名。那些在院子里压抑着悲伤、不敢为阵亡儿子掉一滴眼泪的母亲，终于能够关上房门痛痛快快地哭出声来。\n车间里那些被强迫劳作的学生放下了工具，码头边那些用来自杀突击的武器正在被切割成用于修缮桥梁的钢材。这里不需要任何夸耀功绩的凯旋仪式，从大海对岸开回来的舰队，只想将这片被疯狂践踏的土地，原原本本地还给每一个想要安稳度日的普通人。当下班的笛声在傍晚重新鸣响，那个逼着所有人排队走向深渊的漫长噩梦，已经彻底结束了。"


PAU.43.t: "改口可真是件费劲的事"
PAU.43.d: "我正带着连队清查战壕的时候，就看见那个从公社新分过来的年轻战士正急匆匆地解下腰间的水壶。在他前方的废墟里，缩着一个看起来年纪很轻的敌兵。那个年轻战士放低了手里的步枪，随后拿着水壶走上前去，想把水壶递给对方。\n“退后！别过去！”\n巴罗的大吼声突然在后方炸开。原本缩在泥坑里的敌兵猛地睁开血红的眼睛，拉开藏在衣襟底下的引线，而后凄厉地喊出了狂热的口号：\n“皇国不灭！七生报国！”\n几乎就在一瞬间，巴罗整个人已经飞身扑了上去，用宽阔的胸膛将那个吓呆了的年轻战士扑了出去。炸药在战壕里爆开，扬起的泥土倾盆砸落下来，掩埋了掩体的一角。\n我急忙冲上前扒开泥块，巴罗伏在泥土里，后背已被弹片撕得满是血痕。\n那个年轻战士整个人都在剧烈颤抖，面色苍白地瘫坐在一旁。我一把抓起那个年轻战士的衣领，胸口的怒意彻底压抑不住了：\n“战地条例你背到哪里去了？！”\n一只手掌用微弱的力气抓住了我的手腕。\n这是巴罗的手，他的胸口正不断起伏着，倚靠在冰冷的土壁上，用轻得几乎要散在风里声音说道：\n“阿夏……长官……啊，又叫错了……你现在是施工员来着……”\n“少说话，留着力气等医护兵过来。”我蹲下来托住他的肩膀。\n“别凶这个孩子了……他能心软……多好啊。”\n“当年在莉兰迪亚工区，王室用几张毫无用处的欠条当军饷，让我们去碾碎工人们的一切……那时候我们要是能有哪怕一个人……能像这小子一样心软，肯放下枪给工人们递上一口水……那些车间工友的血，何至于在我们的良心上煎熬了整整这么多年。”\n“这孩子的手很干净……他如果今天在这儿学会了毫不犹豫地开枪打死一个求饶的人，等将来回了南美……他就再也变不回一个能安心种地过日子的普通人了。我们当年……就是这么一步步变成怪物的。”\n巴罗费力地从上衣口袋里摸出当年被他砸在柱子上、后来又被他悄悄捡回来的军团勋章。勋章已经被弹片砸得扭曲变形了，还沾染着新鲜的血污。他将那枚章塞进了我的手心：\n“阿夏……等舰队回了南美……记得按法庭判决的规矩，把我的抚恤金全部划给工区那些死难工人的遗孤……”\n巴罗注视着我的眼睛，声音渐渐微弱下去：\n“在报名出征的那天，我说过不想死后墓碑上的名字被后人骂一辈子……阿夏，我今天……终于不用当王室的看门狗了，对吧？”\n我紧握住那枚带着体温的勋章，声音彻底哽咽：\n“对。巴罗，你是我们最好的坦克连长。”\n巴罗吐出微弱的叹息：\n“那就好……叫了十几年的长官……改口可真是件费劲的事啊……”\n他的手掌从我的手腕上脱力滑落，垂在泥土里永远停下了呼吸。\n伴随着巴罗的死亡，四周彻底静死了。\n不知过了多久，我才站起身，拔出腰间的配枪冲到那个死去的敌兵身前，对着那具残骸扣动了扳机。\n砰！砰！砰！砰……"
PAU.43.a: "“……阿夏长官听到了，巴罗连长。”"

PAU_zxlk: "是时候定下规矩了"
PAU_zxlk_desc: "当年我躲在运煤船里逃命的时候，要是谁跟我说将来有一天我会带着舰队打回老家，我肯定觉得对方是在讲胡话。\n现在军部那帮指手画脚的长官枪毙的枪毙，关进大牢的关进大牢。可看着眼前乱成一团的烂摊子，我才发现真正的头疼事现在才刚开始呢。\n这片故土以后到底该怎么过日子？\n是干脆把两边大海的车间与田地彻底连在一块，让造船工人与农民自己掌管工厂，建立一个谁也别想剥削别人的劳动者联合？还是索性推行彻底的去中心化自治，让每个海港小镇自己管自己的事，永远断掉野心家集权开战的念头？\n不管选哪条路，反正那些高高在上的老爷们已经彻底滚蛋了。这一次，这几座岛屿的明天该往哪儿走，得由我们这些自己挣饭吃的人说了算。"


PAU.44.t: "印章该落在哪个名字上"
PAU.44.d: "“我说雪伊，你别死盯着那张写着红字的草案了，面条放凉了可是很难吃的。”\n小摊前，遥正握着筷子挑起面条，一阵阵热气正顺着她的碗沿飘散开来。\n桌面上压着两份草案。雪伊和晓枫就坐在桌子对面，彼此摆出谁也不肯退让一步的样子。\n阿夏端着汤开口说道：\n“埃文斯天亮前跑来找我。圣杯驻军听到工会要推行公有化，以为私产会被强行没收，有好几个水手都吓得连夜去收拾行李了。”\n雪伊立刻挺直了身板反驳道：\n“工会早就明确过私人物品和安家费受法律保护。可船厂、矿山与交通线是绝对不能由私人垄断的。南美与樱花的重工业必须统一划归工团集中统管，由全体劳动者共同调配生产，这样才能彻底杜绝贵族和资本的复辟。”\n晓枫指向右边那份盖着基层印记的方案补充道：\n“但海港与市镇代表更倾向于去中心化的自由公社自治。樱花的民众刚从法西斯兵营式的集中管制里解脱出来，对任何形式的中央指令都心存戒备。他们希望以基层公社和车间委员会为核心，各个市镇自主管理，组成平等的红色自治同盟。”\n遥咽下嘴里的面条后放下筷子：\n“白夜同盟的名字肯定不改，但这两种走法确实挺让人头疼的。”\n她从口袋里掏出印章在桌面上转动着：\n“选了雪伊的集中工团路线，我们得一五一十地去统管每一个车间的原料分配，圣杯和军人那边还要靠我们反复去做通工作……选了自由公社路线，各个市镇就能自己当家作主了，虽然这很省心，可将来要是遇到大规模工程，协调起来肯定费时又费力的。”\n遥抬起头看向同伴们：\n“诺，印章就在这儿。两条路都是为了让普通人真正掌握自己的生活，所以还是交给大家来定夺吧。”"
PAU.44.a: "我们必须集中起来"
PAU.44.b: "就由居民们自主决定他们生活吧"


PAU_thsg: "偷拿的东西得还给人家"
PAU_thsg_desc: "军港库房里那些封存的木箱，关在大牢里的军官到现在还在嚷嚷着那是皇国的战利品。\n我和藤井去清点的时候，箱子上印的全是对岸各省公署与学堂的戳记。车床、铜材、古籍，甚至连邻邦寺院里的铜钟都被他们运回来准备熔铸炮弹。\n这算哪门子的战利品啊，分明就是一堆明火执仗抢来的脏物嘛。当年那帮军官为了填饱侵略舰队的胃口到处劫掠，我们白夜同盟可不打算替这帮强盗藏污纳垢。\n我直接让人把封条撕了，调来货船将这些物资分门别类装舱，原原本本地运回海峡西岸的港口去。\n如果想要让饱受战火蹂躏的中国人民相信这几座岛屿上的疯狂确实停歇了，我们就不能找任何借口推脱。偷拿了人家的东西，老老实实低头送还回去，这可是做人最基本的规矩呢。"

PAU.45.t: "今天的号外"
PAU.45.d: "“啦啦啦，啦啦啦，我是卖报的小行家……”\n歌声在江边茶摊旁边停下，我扬起手里带着油墨味的新报纸，冲着长椅上的茶客大声叫卖：\n“号外！号外！特大新闻喽！鬼子的大本营教人给端了！”\n茶摊掌柜端着水壶，皱着眉头在桌面上一磕：\n“去去去，小鬼头大清早编什么胡话？前几天这儿防空警报还在响呢，鬼子还在前线扔炸弹呢，今天能让人给端了？我看你就是为了多卖两份报纸瞎嚷嚷，当心巡警抽你嘴巴子。”\n“谁编胡话了！”我抽出一份晨报拍在了茶桌上，“您自己瞧！正面战场抗战到底，鬼子后方也炸了锅，樱花军部被彻底赶下了台！挂着白旗的船队今天一大早就停在泊位上，正往岸上卸当年抢走的发电机和钢材呢！”\n几个坐着喝茶的伤员立刻围拢过来，目光落在报纸头版黑压压的字迹上。\n“这……这上面写的是真的？”一个拄着拐杖的军官念出声来，“‘军部覆灭，抢掠物资原样归还’……‘沿江各省被掠之发电机组、纺织机械与各厂钢料，已由白夜同盟船队运抵码头交割’……”\n栈桥方向突然传来几个码头工人的大喊声：\n“快去泊位看啊！是真的！大船上的姑娘和水手正带着江防司令部的人验货呢！当年被鬼子抢走的东西都给拉回来了！”\n整条街的茶客全站了起来，连茶钱都顾不上付，跟着人群争先恐后地向码头涌去。\n掌柜抓着那份报纸怔在了原地：\n“这世道……打了这么多年……天真的要亮了？”\n我捡起桌上落下的铜板揣进布兜，甩动着手里的报纸，继续唱着歌向街口跑去：\n“啦啦啦，大新闻！小鬼子抢走的东西全送回来喽——！”"
PAU.45.a: "欢迎回家"

PAU_blsm: "带一把南美的玉米去看看他"
PAU_blsm_desc: "舰队跨越大海返回南美的时候，我和那个年轻战士带着巴罗的遗物，回到了同盟当初给他分好的那块农田边。\n地里的玉米结出的穗子金黄饱满。那个被他救下的年轻战士蹲下身，小心翼翼地掰下一把成熟的玉米粒，与那枚被弹片砸扁的勋章一同放在石碑前，双手合拢替老连长拜了拜。\n巴罗生前总说自己打了十几年仗，手脚笨拙不会种地，可他用身躯护住的年轻人，如今替他种出了这片丰硕的庄稼。从工区车间门口倒下的工会工友，到大海风浪里牺牲的水手，再到这片群岛上被军国主义裹挟送命的少年……所有在这场漫长浩劫里逝去的人，名字都被规规矩矩地刻在了这片向阳的山坡上。\n这里不立任何夸耀战功的宏伟雕像，单单留着一片静悄悄生长的农田。丰收的粮食放在碑前，代表着这场横跨大海的苦难确实迎来了终点。愿长眠于此的故人能够安心，他们用生命换来的土地，再也不会被战火所践踏。"

PAU.46.t: "不用改口了"
PAU.46.d: "“喂，巴罗。今天的解散哨我已经吹过了。”\n我站在那排木桩前，将那枚已经变形的勋章挂在了上面。\n“你们这帮家伙躺在这里，倒是比以前在营地里抢稀汤的时候清净多了。以后的名册里写着你们是开荒者，再也不会有哪个雇主拿着欠条叫你们去送死，也不会有哪个长官拿你们当消耗品了。我们的合同早就到期了，以后安安心心睡大觉，再也不用打仗了。”\n我停下了声音。\n四下里一片寂静，风吹过草地，带着木桩上的布条轻轻晃动着。\n过了好一阵，我自嘲地笑了一声：\n“……骗谁呢。”\n“海对面还在造着战舰呢，海底下还有数不清的怪胎呢，这世道什么时候真正太平过啊。”\n我低下头，强忍着的眼泪终于毫无预兆地砸在了脚下的草叶上：\n“当年十几岁跟着你们进营地的时候，我明明是个连枪栓都拉不动的傻子。我每天晚上做噩梦，缩在被窝里偷偷哭着想家，是你把烤得最软的土豆芯掰给我，自己嚼着黑焦皮，还大着嗓门吹牛说当兵的就爱吃焦的……臭骗子，哪有人爱吃焦炭啊。”\n“后来我当了连长，当了指挥官，天天冷着脸装成一副刀枪不入的模样……我其实……害怕得要死啊……我每天做梦都怕天亮点名的时候，名单上又少掉好几个你们的名字……”\n我用衣服使劲蹭掉脸上的水，吸了吸鼻子，声音都走调了：\n“……可恶，话都说不利索了。”\n“就算以后真要再打仗……”\n“就算哪天警报又响了，就算还得拿起枪去挡那些恶心的人……”\n“那也是…那也是为了守住我们好不容易才拼出来的这几个活人才打的！明白吗！”\n“而且！你们给我听好了……真到了那时候，我！阿夏！阿夏长官依旧会在最前面替你们挡子弹。无论去哪儿，我都不会再把任何一个人丢下了。”\n我退后一步，目光从木桩上的名字一个个掠过：\n“开坦克的、装填炮弹的、修履带的……都在啊。今天的解散点名，大家都在，一个都不少呢。”\n“走了……”\n我挪开步子，走出去几步又忍不住停下来，回过头看了一眼。\n“……走了啊。”\n“一个个都把嘴闭上，别在地下笑话我哭鼻子，这种事……算我们几个人的秘密。”\n“要是哪天……真吹了紧急集合哨……”\n“老地方见，听到了吗，傻蛋们。”"
PAU.46.a: "“阿夏长官的命令，谁都不准迟到。”"

PAU_wdct: "电车站台"
PAU_wdct_desc: "当年为了铸造炮弹被拆毁的沿海电车轨道，终于由工友们重新铺设完毕了。通电的架空线在海风中划出整齐的弧线，电车在一声清脆的铃铛声里驶进了站台。\n傍晚五点的下班钟声敲响时，背着书包的学生与刚脱下工装的工人挤上车厢，路边小摊新出锅的点心香气顺着街道飘散了开来。大家在车门前彼此礼貌地打着招呼，嘴里聊着晚饭要买的蔬菜与明天的功课。\n那些在噩梦里回响的防空警报已经彻底远去，现在，它们变成了每一趟按时进站的电车叮当声。"

PAU.47.t: "下大雨那天"
PAU.47.d: "学校车棚的长椅上，咬着汽水吸管的千夏突然用胳膊肘碰了下我的手臂：\n“喂，小遥，你记不记得以前你经常放在鞋柜里的那件黄色雨衣呀？”\n我咬着手里的点心，含含糊糊地应道：\n“哪件？……你干嘛突然提这个？”\n千夏身子往后一靠笑出了声：\n“那天下了好大的暴雨，我忘带雨伞，自作主张从你柜子里翻出那件雨衣套着跑去车站。你母亲那时候老是唠叨你粗心大意，所以特意在领口内侧写了‘春日小遥’，对吧？”\n千夏满不在乎地讲起当年的糗事：\n“我才刚到检票口，几个巡警突然冲上来把我按在地上，大声嚷嚷抓到了通缉犯人！后来我才知道，你那天下午挂上了紧急通缉，正好我又穿着写着你的名字的雨衣……”\n千夏吐了吐舌头，一脸心有余悸又得意的样子：\n“我一开始还拼命喊‘我是佐佐木千夏’呢！结果那帮家伙说春日小遥只是在码头犯了点小错，现在坦白交待的话就能从轻处理，家人也不会受到任何牵连。”\n千夏压低声音凑过来，悄悄冲我眨眼：\n“于是本姑娘就把心一横，直接大喊：‘没错！我就是春日小遥！有本事的都冲我来！’——哇，那巡警气得脸都绿了，直接甩了我两个大耳光，把我塞进拘留所关了一整夜！直到第二天他们核对学籍、我爸爸跑来跪在地上磕头，他们才发现抓错了人，雨衣在挨打的时候被扯烂了……我当时还内疚了好久呢，一直不敢跟你提……”\n我嘴里的点心突然就咽不下去了。\n当年翻进货船底舱的那天……\n原本封锁码头的警车突然拉响警笛离开，所有的搜捕巡逻冲向了电车站台……\n千夏感觉到我的视线，疑惑地和我对视了起来：\n“……喂，小遥？你怎么突然定住了？……该不会真生气了吧？我可是替你挨了打哎，一件雨衣而已，你不会这么小气吧……”\n我伸开双臂，猛地扑上前抱住了千夏的脖子，把脸深埋进了她的肩膀里。\n千夏被撞得差点从椅子上掉下来，声音带着好笑与困惑：\n“哇……小遥你今天怎么回事呀？突然抱过来干嘛，好肉麻哦。”\n我从喉咙里发出了夹杂着悲痛与心疼的哽咽，：\n“……赔我。”\n“……快把雨衣赔我。”\n千夏彻底呆住了，感受到肩窝里滚烫湿透的眼泪，刚才还耀武扬威的大英雄瞬间慌了神。轻轻拍抚着我的后背：\n“对不起嘛……对不起！那件雨衣是你妈妈亲手缝的，肯定特别珍贵对不对？！别哭了小遥……我赔你，我赔你还不行嘛！别哭了，好不好……”"
PAU.47.a: "一定要赔我一件一模一样的啊，笨蛋"
PAU.47.a_tt: "连名字，也要写得一模一样……"

PAU_els: "同路人总得打个招呼"
PAU_els_desc: "听说北方的冰原上也有一群推翻了沙皇统治的红旗同伴。虽然双方说的语言完全不同，遥也对那些冗长刻板的理论文稿感到头疼，但大家都是为了让劳动者有口热饭吃而拼过命的人。派遣代表团渡海前往莫斯科，互递免于冲突的友好通报。哪怕彼此隔着广袤的荒原，至少得让北方的同胞知道：在太平洋的这一头，同样有一群不肯向压迫者低头的同行者在努力生活着呢。"

PAU.51.t: "请把脚从桌子上放下来"
PAU.51.d: "“……苏维埃政权之所以存在，就是要证明普通劳动者有能力掌握自己的命运。我们全联盟的电气化不仅是一个工业指标，它更是为了让每一个偏远乡村的孩子都能在电灯下读书……”\n小樱站在展开的规划图前，认真地对几名委员阐述着构想，桌子冷不丁传来一阵嚼面包干的轻响。\n一个白发少女不知道什么时候坐在了地图的一角，两截小腿悬在桌边悠闲地晃悠着，怀里那团白色小动物正伸着爪子，好奇地去够茶炊的开关。\n小樱手里的尺子停在了空中。\n“警卫！……等等，你是怎么进来的？！还有，谁允许你坐在规划图上的？！”\n“我是春日小遥呀。”少女咽下嘴里的面包屑，笑嘻嘻地挥手，“白夜同盟的大统领，兼职翻窗进来的不速之客。放心好啦，鞋底在进门前已经用抹布擦得干干净净了呢。”\n小樱放下尺子，挺直了腰板，神情转为庄重的威严：\n“春日同志。苏维埃始终注视着大海对岸的斗争。你们摧毁了旧帝国的巢穴，将掠夺的资产奉还受苦的邻邦，这证明你们的行动代表着被压迫阶级的意志。只要你们坚持工农自主、粉碎帝国主义的锁链，红色的北方永远是你们最坚定的后盾。”\n说到这里，小樱庄重肃穆的神情突然垮了下来，她指着桌子上的毛团，鼓着脸嚷道：\n“但是！这可不能成为你把脚踩在工业图上的理由！而且那个小家伙刚才把果酱全吃光了！那可是给今天会议准备的茶点啊！”\n“小樱同志，别那么小气嘛。”遥从桌上跳下来，拍了拍衣服，“我们刚把南美和本土的烂摊子收拾好，听说你们这儿也在为了大家能过上好日子而努力，我就带着舰队顺路过来打个招呼。怎样，要不要在太平洋上跟我们联手立个互助的公约？”\n小樱重新整理好桌上的图纸，两只手抱在胸前说道：\n“联合的前提，是你们必须彻底杜绝资本的垄断与复辟，确保每一个车间都由工人自己说了算。另外……以后开会的时候，严禁这个小家伙靠近任何图纸！”\n“成啦！”遥笑眯眯地拉过椅子坐下，“那现在，能让后厨再送一碟浆果来吗，小樱同志？”\n小樱看着眼前这个毫无拘束的异国领袖，无可奈何地摇着头：\n“真是不讲规矩……不过，欢迎来到莫斯科，春日同志。”"
PAU.51.a: "欢迎白夜同盟加入第三国际！"
PAU.51.b: "先签署互惠通商协定，保持观察。"


PAU_zg: "以后是邻居了"
PAU_zg_desc: "运送退还物资的船队陆续靠上周边各国的港口码头，站在栈桥上接应的，是同样穿着普通工装的工友代表与抗战老兵。他们清点完木箱，关切得询问起这边的船厂工人是否有足够的口粮过冬。\n这才是我们渴望见到的邻邦。对岸掌权的是在焦土上浴血奋战出来的新政权，他们深知被压迫的滋味，也最懂得和平的分量。\n同盟正式宣布废除旧政权强加于邻国的一切不平等条约，彻底放弃所有海外特权与据点。将造船厂新造的民用钢材与机器零件源源不断运往各处受灾的港湾，全力支援领邦重建被战火毁坏的城镇与铁道。握紧彼此的双手吧，从今天起，我们平起平坐做真正和平友好的邻里。"

PAU.48.t: "握手"
PAU.48.d: "港口的吊车正吊下一箱箱退还的古籍与机械，那口被樱花的旧帝国政权掠夺走的铜钟落在地上，撞出一声沉厚的回响。\n负责接洽的办事员将那封来自海对岸的信件放在桌上，信纸上盖着白夜同盟的印章，落款人写着春日小遥：\n“海峡西岸的同志们。\n当年军部强占的物资已经全数运抵港口。船舱底部运来的那批新轧制出来的钢轨，是樱花与南美的工友连夜赶制出来的，请务必收下，用于修补被战火炸毁的铁路与桥梁。\n强盗的军部已经彻底被我们捣毁，强令开火的军官也已接受公开审判。我们建立了劳动者自己做主的白夜同盟，决意不让这片海峡再次沦为侵略者的杀场。\n如果你们愿意，请审阅这份共同防卫条约。海对面的工友愿与中国人民并肩站立，共同守卫这片重获和平的土地。”\n站在窗前的军民代表们注视着码头上忙碌的身影，那些曾经满载侵略军与刺刀的货轮，如今运来的是诚恳的谢罪与重建家园的钢铁。\n我们的浴血抗战不能遗忘，但那些亲手捣毁法西斯军部、跨海送还国宝的异国劳动者，确实用行动证明了和平的诚意。\n桌上的盟约草案摊开着，等待着最终的批复。"
PAU.48.a: "既然共同推翻了暴政，那便携手并肩建立同盟。"
PAU.48.b: "收下物资与诚意，但我们暂且保持独立自主。"

PAU_zg_fd: "旧账还了，换下皇帝可免谈"
PAU_zg_fd_desc: "对岸海港里收下了我们退还的全部物资，可统治者居然是个穿着朝服、做着朝贡帝国大梦的封建余孽，甚至还有军阀企图将战火反向烧向我们的海湾。\n遥在回电的公函底下用很重的力气盖上了白夜同盟的印章：当年的掠夺是帝国的罪行，我们低头退赔是为了对得起海峡对岸受苦的百姓；但这可不代表我们会向另一个骑在人民头上的新皇帝下跪！\n我们连本土的狂热军阀都亲手砸碎了，更不可能容忍任何外来的独裁者对同盟指手画脚。同盟正式重申防卫底线：物资归还完毕，领海互不侵犯。如果对岸的官僚企图以战胜者自居发动新的战争，布防在沿海的岸防大炮与各舰炮口，随时准备给那些看不清局势的野心家好好上一课。"

PAU_mdg: "活人可不给骷髅下跪"
PAU_mdg_desc: "那个自称魔导国的国度传来的消息令人作呕。一个顶着王冠的白骨骷髅，居然带着一群嗜血的怪胎在北边建立起奴役活人的亡灵帝国。我们在南美早就领教过亡灵怪物的残忍，那些被死气吞噬的荒野到现在都让人心有余悸。活人头顶上的天空，无论如何也不能任由一群行尸走肉来主宰！"

PAU_sbwg: "各自守好自家大门"
PAU_sbwg_desc: "圣杯本土的议会大体上接受了远征军留居南美的既成事实，大海两端总算迎来了长久的安宁。那些留在这边的水手与家属已经融入了社区，海对面的议会也明白劳师远征只会自讨苦吃。我们正式会与圣杯王国签署永久和平协约：双方各自尊重对方的边界，圣杯留在本土继续搞他们的议会政治，白夜同盟在两块大陆上建设属于人民的家园。只要那帮议员不派军舰到我们的水域游弋，彼此安安稳稳过日子便是最好的结果。"

PAU_bm_hp: "和平相处总比打仗强"
PAU_bm_hp_desc: "隔着辽阔水域相望的北美大陆拥有庞大的工业力量。尽管那里对我们这套制度指指点点，但老百姓刚刚从战火里缓过劲来，谁也不想再去打一场耗费无数生命的跨洋大战。只要对方识趣地缩回伸向太平洋的触角，承认同盟在两岸的主权，我们就愿意维持基本的和平状态。大家隔着大海各自发展，总好过将年轻的孩子送进战壕里送死。"

PAU.50.t: "省下的军费归谁"
PAU.50.d: "“荒谬！这简直是荒谬透顶！”\n保守党议员猛挥着手臂，冲着对面席位大声质问：\n“‘和平协约’？！财政部管这种事叫和平协约？！那支远征军拿着王国的薪饷与军舰，现在直接在南美落了户，甚至连指挥官都向那个樱花小姑娘低头！这是公然的背叛！”\n财政大臣霍然站起身，直接将预算草案拍在讲台上：\n“背叛？好啊！如果现在把几千多号水手全接回本土，议员阁下，你打算从哪个部门拨款去给他们发退役抚恤和失业救济？！你知不知道远征舰队每天要烧掉多少吨燃煤？！”\n台下的议员们顿时分成两派，争吵声与敲桌子的声音混成一片。\n负责联络的海军联络官站在讲台前清了清嗓子：\n“各位议员，埃文斯将军通过越洋电报传回了确切回复：远征军的水手在当地分到了安家田产，对岸的船厂已经免费替我们把几艘受损的巡逻舰换好了新零件。白夜同盟承诺永久尊重圣杯的领海边界，前提是议会不要再派舰队去惹是生非。”\n商会代表的议员立刻站了起来：\n“等等！电报里提到对岸的免税深水港不仅供应平价木材，连咖啡豆都不收关税？如果签了字，我们选区的商船岂不是能够自由出入南美了？！”\n保守党议员被噎得说不出话来，气急败坏地指着四周：\n“你们……你们这帮唯利是图的家伙！王国的尊严呢？！”\n“尊严能填平今年的财政赤字吗？！”财政大臣抓起表决铃铛用力一摇，“议长先生，立刻进入表决程序！”\n嘈杂的议事大厅瞬间安静下来，代表们纷纷按下了表决器。"
PAU.50.a: "正式签署和平协约，各自守好大门。"
PAU.50.b: "哪怕面临财政赤字，也坚决不予承认！"

PAU.49.t: "既然谁也不想开战"
PAU.49.d: "会议室内，那封加盖着白夜同盟印章的信函摊开在桌面上，落款处同样签着春日小遥的名字：\n“北美的各位议员与代表。\n我们刚刚在西太平洋结束了一场惨烈的战事。这几年里，倒在野心家炮火下的年轻人实在太多了，我们谁也不想再看见自家的孩子被送进战场充当消耗品。\n南美的平原与樱花的工区现在全部归属劳动者自己做主，我们无意干涉北美的生活方式，更不打算跨海挑衅。但前提是，北美的舰队必须尊重这片广阔水域的主权与安宁。\n如果各位厌倦了无休止的造舰竞赛与海外干涉，白夜同盟愿意向你们敞开大门。我们共同建立覆盖两岸的和平防卫体系，彼此互不侵犯，把所有的钢铁用于民生建造与重建。”\n防务官员与议员们注视着地图上那个横跨大海的新生同盟，原本主张强硬封锁的声音在严峻的现实面前彻底平息。\n对岸聚集着久经沙场的老兵、庞大的造船厂与觉醒的人民，盲目开战只会带来经济崩溃与无法承受的伤亡。\n桌上的同盟草案安静地等待着答复，这场关乎大海未来的抉择，落在了在场所有人的手中。"
PAU.49.a: "加入白夜同盟，共同守护两岸和平。"
PAU.49.b: "我们不会与一群野蛮人签订条约的。"

PAU_bm_kz: "谁也别想插手这片海洋"
PAU_bm_kz_desc: "北美那些唯利是图的财阀显然坐不住了。他们看着我们砸碎了旧帝国、解放了各地的车间，生怕这股平等的火苗烧到他们自家的庄园与矿山里去，甚至在暗地里调动战舰企图封锁航线。遥站在海图前冷哼了一声：真当从南美一路冲出来的白夜同盟是任人拿捏的软柿子吗？！既然这帮大亨非要将战火烧到我们头上，那就索性迎战到底，彻底荡平帝国主义在太平洋上的一切霸权！"

#A（激进世界革命线）
#判定条件：与苏联成为盟友、与中国革命政权联合
#与 PAU_hpgc、PAU_zdbf 互斥
PAU_sjgm: "这回轮到我们掀桌子了"
PAU_sjgm_desc: "莫斯科的回电到了，对岸中国工友的回信也到了！他们紧握住了我们递过去的手掌，要在四方各地一同掀翻压迫者的统治！\n我当年以为带着大家逃出一条生路就算万事大吉了。可看看这张地图，海那头还有无数人在皮鞭底下流血呢！既然我们这帮逃难者能捣毁帝国的巢穴，那这股反抗的火种就该顺着航线烧向各处大陆！\n各工区立刻赶制军备，货轮装满钢料随时准备出海！白夜同盟从今天起就是各处反抗力量最坚固的后盾，谁要跟帝国主义死磕到底，我春日小遥第一个奉陪！"

#B（多极和平共处线）
#判定条件：圣杯议会批准和平、北美联合、中国维持和平
#与 PAU_sjgm、PAU_zdbf 互斥
PAU_hpgc: "看吧，和平才是最强的奇迹"
PAU_hpgc_desc: "回信都送到了！圣杯的议会撤回了战舰，北美同意尊重边界，邻邦也接纳了我们的谢罪与友善！\n以前那些大人物天天叫嚣着弱肉强食，断言不同旗帜下的人注定要互相残杀到死。那么！现在就让他们睁大眼睛看清楚，我们这帮曾经一无所有的普通人，终于彻彻底底在两块大陆之间建起了一个不用互相开火的和平世界！\n从今天起，把武器收进仓库吧，造船厂全都开足马力去造客轮和渔船吧！我们不仅要活下去，还要活得比谁都舒服、比谁都热闹，向世人证明普通人能够靠着双手守护属于自己的明天！"

#C（武装中立孤垒线）
#判定条件：失败拒绝承认友好、与北美敌对、与中国反动政权敌对
#与 PAU_sjgm、PAU_hpgc互斥
PAU_zdbf: "有本事就放马过来！"
PAU_zdbf_desc: "海对面那些傲慢的帝国居然把我们的和平协约扔了回来，还妄图将我们当成可以随意拿捏的流民？！\n那可真是给他们脸了！我们跨越大海打碎了自家的军部，可不是为了跑去向另一群殖民强盗低头讨饶的！他们要是想在海那边继续争权夺利，就由着他们烂在自家的泥潭里去吧！\n不管哪路帝国主义的军舰敢把炮口对准同盟的水域，我就带着舰队把它们轰进海沟里去！"

PAU_cxzm: "与国同罪"
PAU_cxzm_desc: "在档案里翻出那些写着叛国罪名的通缉令时，几个代表曾建议举办一场特赦仪式，以此向世人宣告过去的恩怨一笔勾销。\n遥直接驳回了特赦的提案。\n如果接受特赦，就等于承认当年的反抗确实有罪，无非是侥幸得到了新权力的宽恕。\n当旧政权逼迫人民去残害邻邦、强令孩子去当炮灰的时候，违抗这种命令便成了一个人守住良知的正当选择。同盟正式在所有泛黄的通缉令上盖下印章，宣告过往因反抗侵略与拒不服从军令而被定罪的人员全部清白无辜。\n需要被钉在耻辱柱上接受审判的，是那个妄图吞噬一切人性的旧体制本身，而非拒绝沦为凶手的普通百姓。"

PAU.52.t: "喂、喂，听得见吗？"
PAU.52.d: "“喂、喂？一、二……听得见吗？后面电车站旁边那个咬着肉饼的大叔，能听清我的声音吗？听得清就挥挥手让我看见——啊，看见了看见了，扩音器效果还挺不错的呢。”\n高台上的遥调整着话筒的高度，声音顺着街角的几个大喇叭在整个街区回荡开来。\n台下站满了市民、脱下袖标的学生与集结的工友，大家都屏息注视着台上那个白发少女。\n遥停顿了一下，声音收敛了玩笑：\n“站在这儿之前……我其实拖了很久、很久。”\n“战火平息了，电车也通了，条约也签完了，我才磨磨蹭蹭走上台。”\n“因为我很心虚啊。真的很心虚。”\n“当年军部开着战舰去蹂躏海峡对岸、把成千上万的人推进深渊的时候，我除了抱着小动物跳上运煤船逃亡，什么都做不到。现在站在这儿说话，我都觉得脸颊烫得特别厉害。”\n台下一片寂静，无数双眼睛望着高台。\n“这几天，好多代表私底下跑来跟我说。”\n“他们说，小遥啊，现在大家都打赢了，你就当个好人，告诉大家过去的事全是一场误会。”\n“就说大家无非是受害者嘛。母亲不敢哭是因为害怕，学生告密是因为肚子饿，士兵开枪是因为军令连坐。好像大家一起抱头痛哭一场，把罪名推给几个死掉的长官，过去的血迹就算彻底擦干净了。”\n遥突然拔高了音调，声音如同雨雷般炸响：\n“……可这算什么啊？！”\n“这是在开什么玩笑啊！！”\n“法庭免除一线士兵和百姓的刑罚，是为了让这座城市免于无休止的私刑与复仇！那是法律的底线！但法律免了你们的罪，难道大家心里的血迹就真的不存在了吗？！”\n“邻居家被搜捕的时候，我们关上了门窗；\n老师被拖走的时候，我们低下了头颅；\n对岸的城镇被烧成焦土、捷报传回街道的时候，我们跟着收音机挥舞着小旗高呼万岁！”\n“如果今天我随口说一句‘大家都受了委屈、过去就算了’……那海峡对岸死在烈火里的人算什么？！那些被出卖的师长算什么？！那些被逼着死在异乡的年轻孩子又算什么？！”\n台下的人群剧烈骚动起来，许多人捂着脸泣不成声。\n遥握着话筒，目光坚定地迎着全场的视线：\n“下达侵略命令的长官，该处决的已经处决，剩下的送进大牢服刑；靠着告密和充当爪牙换取特权的人，名下侵占的房屋和田产全部依法充公，退还给受害者的家属；军国组织的骨干分子，剥夺一切任职资格。法庭就在市政大厅门口，每一笔罪责都会查得清清楚楚。”\n“但是，除了法律的审判，以后……再也不会有人替你们做善恶的选择了。”\n“我今天站在这儿，可给不出什么皆大欢喜的答案。美月给不出，台下的你们给不出，我也给不出。”\n“明天早晨醒来，去车间工作、去学校教书、去跟邻居打招呼……这一切的一切，都要由你们自己的良心去选。”\n“散会了！回家去，好好想想明天的早饭，好好看着身边还活着的人。”"
PAU.52.a: "“现在，去过属于我们自己的生活吧！”"



PAU_fby: "白夜本来就是只野兽"
PAU_fby_desc: "遥抱着白夜走上老家后山，来到那座空置已久的神社前。\n当年她带着白夜翻上船，生怕这个山里的小家伙被军部抓去充当战争的试验品。后来在大海对岸，她拿白夜的名字当盾牌建立了同盟，大家甚至在街头给这个贪吃的毛团立起了神龛。\n如今枪炮声彻底停歇了，遥解下白夜脖子上系着的红布，将它扔在长满青苔的草地上：\n“两边的仗都打完了，海里再也不会冒出吃人的怪胎，人类这堆麻烦事也用不着你来扛着。回去当你的野兽去吧，抓松鼠也好，在树洞里睡大觉也行，爱去哪儿去哪儿。”"

PAU.53.t: "回家"
PAU.53.d: "将白夜放走以后，我来到了我曾经生活了一辈子的家，家里很安静…很空……像有什么本该存在的人早已消失不见了一样……\n\n“……喂，老头！你藏在收音机后面的零花钱，早被我偷拿去买吃的了，你到现在都不知道吧？”\n我站在门前，冲着空荡的屋里大声喊着。\n“还有老妈！你腌的咸菜咸得要命，隔壁阿姨每次收下都偷偷倒掉，我可全都看见了哦！”\n屋里静悄悄的，谁也没有跑出来拍我的脑袋。\n“……快出来骂我呀。”\n“听到没有？快出来骂我两句啊……你们两个大笨蛋……”\n玄关的柱子上，还留着当年用菜刀刻下的一道道痕迹，……最上面那一道，旁边还贴着一张字条：“春日小遥，再不长个子可就真嫁不出去了。”\n我抬起手掌贴在那道刻痕上，用很弱的声音说道：\n“……老头，我长高了哦。真的……长高了。”\n当年我偷了白夜跳上运煤船的第二天，宪兵就闯进这里带走了他们。这事我其实早在南美的时候就猜到了。我一直装作不知道，一直装作自己是个天底下最机灵、最厉害的领袖，因为……因为我要是停下来去想这件事，我就…………\n我其实……是个差劲得要死、任性得要死的女儿，对吧？如果当年我乖乖听话，这个家本该……好好的啊…………\n我在走廊的台阶上一屁股坐下，把脸埋在了膝盖里。\n\n白夜这会儿应该早就钻进哪个树洞里呼呼大睡了……\n“跑吧……”\n“跑了才好呢。”\n“省得天天跟我抢被子，偷吃我的鱼。回山里当你的神兽去吧，谁稀罕养一头连老鼠都追不上的猪啊。”\n挺好的。\n……真的挺好的。\n反正大家最后全都会走的。\n老爸老妈也是……老师也是……连白夜也是……\n整个世界上…最后留下的……从来都由我……自己一个人承担。"
PAU.53.a: "……"

PAU.533.t: "回家"
PAU.533.d: "不知过了多久……草丛里……突然传来了一阵急促的窸窣声。\n几乎就在同一时间，一团毛团一样的东西呼哧呼哧着撞上了我的小腿。\n\n那是…白夜…………\n它浑身沾满了泥巴和枯草，嘴里咬着一颗熟透的野柿子，啪嗒一声吐在了我的面前，然后拼命摇着尾巴往我怀里钻着。\n“……啊？！”\n“你怎么……你怎么又跑回来了啊？！”\n“脏死了！身上全都是泥，别往我衣服上蹭啊！你是猫啊，不是狗啊！”\n白夜一个劲往我大衣里拱，湿热的小舌头反复舔着我的脸颊。\n我紧抱住这团温暖的小动物，眼泪再也忍不住了，一颗一颗砸在了它的白毛上：\n“大笨蛋……你是一只野猫啊……我都叫你回山里去了……”\n“这里…再也找不出好吃的了……连老爸老妈都不在了……你跟着我干嘛啊……”\n“大笨蛋……大笨蛋……”\n白夜把脑袋埋在了我的脖颈旁，发出温顺的呼噜声。\n我吸了吸鼻子，捡起那颗被鸟啄过的野柿子，掰开分了一块塞进白夜嘴里，自己也咬了一小口，酸涩里透着一丝甜甜的味道。\n\n过了很久…很久……\n我又抬头望向了柱子上那道刻痕：\n\n“爸爸…”\n“妈妈……”"
PAU.533.a: "“小遥今天……来带你们回家了哦。”"


PAU_end: "明天就交给你们了"
PAU_end_desc: "礼堂里那场热热闹闹的大会总算散场了。来自南美工区、圣杯远征军的市镇与樱花造船厂的代表们，在共同宪章上挨个按下了手印。\n代表们非要塞给我一个什么“最高参事会终身主席”的头衔，被我当场回绝了。天天坐在办公室里核算各地的钢铁产量，我可受不了那种苦差事。\n大统领的位置今天起彻底取消，所有的矿山、船厂与铁路正式归属各地劳动者选举产生的生产参事会。生产什么、怎么分配、晚上的学校开几门课，全由工友和农民自己举手表决。这套人人有饭吃、谁也别想骑在别人头上的红色体制，总算稳稳当当立住了。\n我将那枚用了好些年的印章放在讲台正中央，拎起布包溜出了礼堂大门。\n五点整的下班铃声响起来了，远处的电车正叮当叮当地进站。阿夏靠在台阶旁的栏杆边，随手递过来一个热乎乎的纸包。\n我的差事办完啦。以后的生活，就交给你们自己去过咯。"

PAU.54.t: "五点零二分"
PAU.54.d: "电车站台的长椅上，我撕开冒着热气的纸包，白夜正从我的布包里探出毛茸茸的脑袋，一个劲嗅着香味。\n“诺，肉饼分你一个，算我请客。”我将其中一块递给了身旁的阿夏。\n阿夏接过去咬了一大口，平淡得嘟嚷道：\n“拿我掏钱买的肉饼请我的客，前大统领大人的便宜占得可真顺手呢。”\n“都说了别叫那个头衔啦！”我嚼着酥脆的肉饼，含含糊糊地抗议着，“我现在可是无业游民，明天起要去船厂当正经学徒工的呢。”\n阿夏指了指远处礼堂的方向：\n“工会那边的大喇叭刚才还在到处找你呢，说大会散场前少了一个关键签字。”\n“随他们怎么折腾。”我咽下嘴里的肉饼，拍掉手上的碎屑，“晓枫和雪伊都在呢，那两位出面能将所有事情全都料理得妥妥当当的。我才不要回去继续给他们当盖章工具。”\n咔哒，站台的挂钟时针不偏不倚的定格在了五点零二分。\n紧接着，一阵铃声顺着铁轨由远及近荡了过来，电车停在站台前，啪得一声用气阀声打开了车门。\n随着车门打开，一群学生背着书包跑下车厢，嘴里争论着明天的功课；刚下班的工人们提着饭盒走上来，互相询问着晚饭的菜单。\n我把布包背好，站起身迈向了车门：\n“阿夏，上车啦。”\n“今天晚上吃什么？”\n阿夏踩上车厢踏板回答道：\n“南美带回来的玉米还有两袋，煮玉米糊怎么样。”\n“又是玉米糊啊！那我要加糖，必须加好几大勺糖！”\n“行，随你。”\n随着电车门在身后关上之后，这辆载着喧闹与笑语的车厢，悠悠得驶向了象征着平淡生活的海湾小镇。"
PAU.54.a: "“可别忘了我的糖，阿夏长官”"

PAU.55.t: "谁算自己人"
PAU.55.d: "“……呜哇！抱歉抱歉！”\n艾玛抱着一大叠刚缝好的桌布着急跑上讲台，脚底冷不丁踩到了垂落的布料，整个人向前一滑，手里的线团直接滚了出去，正好在埃文斯的皮靴上缠了好几圈。\n埃文斯正站在台阶下翻看手里的条约，被这么一撞，手里的纸页差点脱手飞了。\n“艾玛小姐，请冷静一些。”埃文斯低头看着缠在自己脚踝上的毛线，脸色带着尴尬，“我正在向参事会询问严肃的安全议题呢。”\n艾玛蹲在地上慌慌张张地解着线结，嘴里一个劲道歉：\n“对不起呀埃文斯先生！这团线太调皮了……”\n讲台对面的雪伊正帮着两名工人把多余的椅子搬去后排，听到声响扭头大声喊道：\n“后排修船的那几位！轻点放椅子，木质的地板可经不起你们这么砸！”\n抬椅子的老技工笑着抹掉额头上的汗水，路过讲台时顺便插了句话：\n“埃文斯长官，刚才听见您在那儿担心会不会被清算。要我说您纯粹是想太多了。明天泊位要吊装新船舵，缺人手缺得厉害。大家每天干活都来不及，谁吃饱了撑的去翻以前的思想旧账啊。”\n埃文斯扯掉被线头拽住的裤脚，叹息了一声：\n“雪伊委员，晓枫参谋。条约签了，字也落下了。可我们这些在海对面长大的军官，自幼习惯的是议会票选、私有产业与契约雇佣。你们建立的是工农联合体制，生产资料统统归属劳动大众。在你们这套严密的秩序里，我们这些人究竟算不算等待清洗的异己分子？日子长了，这套体制容得下我们这些带着资本主义烙印的外人吗？”\n正在签发文件的晓枫闻言，将目光越过了桌案：\n“埃文斯指挥官，同盟从不搞血统论。我们反对的是剥削关系，而非带着特定出身的活人。只要诸位放弃用资本垄断去奴役他人的企图，以普通建设者的身份参与运转，联合参事会的席位永远向你们敞开。”\n艾玛终于解开了线团，仰起脸认真地补充道：\n“对呀，而且埃文斯先生之前送给大家的红茶包，工友们都夸赞味道很好呢。”\n埃文斯神色一僵：\n“……那是我私藏的存货。”\n雪伊拍掉沾满灰尘的手套走过来：\n“听明白了？想在这座城里安稳待着，就跟着大家一起做事。不过话说回来，埃文斯先生，讲台旁边的垃圾……今天是不是该轮到你们远征军的值日生来打扫了？”\n埃文斯看向脚边散落的扫帚，以及眼前这几位毫无大人物架子的同僚，无可奈何地摇着头应了下来。"
PAU.55.a: "“去把扫帚拿过来吧……”"

####事件####
PAU_by_h1.t: "它……在门板后面？"#白夜溜达事件一阶段
PAU_by_h1.d: "灶台上的陶罐正咕嘟咕嘟冒着热气。\n我站在桌边切着土豆，随着刀刃碰到木砧板上，笃、笃、笃，节拍和平常一样整齐。\n可是……有些不对劲。\n笃、笃、笃。\n砧板上的声音似乎慢了一拍。切下去的明明是土豆，刀口渗出来的却像灰色的泥浆。\n屋角那个放杂物的地窖木盖，正传出轻微的抓挠声。\n像指甲在木头背面慢慢刮动一样。\n“……是姐姐吗？”\n我张开嘴，听见自己的声音沙哑干涩。\n姐姐去年死在矿坑里了，大家都去送过葬了。可那扇木盖底下，确实传出了她平时哼唱的调子。那个声音混在了水汽里，顺着脚踝一层层缠绕了上来。\n屋里的光线越来越暗了，把影子拉得渐渐细长了起来。就连墙上的挂钟，也正在以惊人的速度疯狂倒转着。\n那道声音，那道声音在叫我的名字：\n“快把门打开……好冷……我快死了……救救我…………”\n我放下手里的菜刀，挪动步子走向了地窖。\n脑袋已经沉重得无法思考了，我的心里却觉得拉开门是理所应当的事情。只要拉开门，就能见到姐姐了，就能一起去那个安静的地方睡大觉了。\n就在这时，窗台上方猛然传来哐当一声脆响。\n一个木碗随着响声被撞翻在地，在地上骨碌碌打着转。\n就在这时，一团雪白的影子从窗格缝隙里钻了进来，它身上带着泥土与草叶的气味，轻盈得落在了砧板旁边。\n那团白毛抖了抖身上的灰尘，毫不客气地叼起我刚切好的土豆块，嚼得吧唧作响。\n地窖的抓挠声骤然消失了。\n墙上的钟表也在正常地走着，陶罐里翻滚的不过是普通的菜汤，砧板上切开的也依旧是干净的土豆。\n哪来什么姐姐的声音，地窖木盖上分明积着特别厚特别厚的灰，上面挂锁也锁得完好如初。\n那团白毛吃完了土豆，歪着脑袋看我了一会，随后就从桌子上跳下去，顺着敞开的门缝一溜烟跑掉了。\n我站在空荡的厨房里，看着掉在脚边的碗，背上的冷汗浸透了单衣。"
PAU_by_h1.a: "“刚才到底是怎么回事……？”"

PAU_by_h2.t: "这根线多出来了"#白夜溜达事件二阶段
PAU_by_h2.d: "后勤缝纫车间里，十几台脚踏机正发出嗒嗒嗒的急促声响。\n我和玛莎并排坐着，负责缝补从前线送回来的大衣。屋子里充斥着陈年羊毛发霉的气味，以及洗不干净的干涸血腥味。\n我捏着手里的粗线穿过破损的布料。针尖扎下去的时候，指尖碰到的却是一种黏冷发软的触感。\n那件大衣胸口处被弹片撕开的破洞像是一张合不拢的嘴。随着风的吹拂，布料微微起伏，隐约像是在一下一下微弱地抽搐。\n玛莎一边踩着踏板，一边大声抱怨着供销的肥皂越来越难买。她的声音听起来忽远忽近，就好像我已经掉到了水里一样。\n我的视线落在大衣内衬翻出来的布签上，上面工整地写着阵亡士兵的姓名与籍贯。\n不知为什么，那个陌生的名字在眼前渐渐扭曲，变成了去年矿难名单上姐姐的名字，后面还跟着密密麻麻、在战争里死去的那些工友的面孔。\n一股冰冷而麻木的念头顺着脊梁爬了上来：\n死了那么多人……凭什么坐在阳光下的，是我这种连机床都摇不动的笨蛋呢？\n也许我还活着本身就是没道理的。只要我死了，就再也不用闻这些刺鼻的血味，再也不用担惊受怕了。\n我手里的剪刀慢慢偏了方向，抵在了自己的手腕上，心里甚至涌起了一丝期待解脱的安宁。\n“喂！艾玛！你往哪儿剪呢？是昨晚没睡好吗？”\n察觉到艾玛的声音，我手腕一抖，剪刀啪嗒一声掉在脚边的碎布堆里。\n车间的机器声重新灌回了我的耳朵里，阳光重新照在了机油斑驳的地面上。\n那些游荡在街角的死气根本不需要破门而入，它们正顺着每一个幸存者的愧疚与虚弱，悄无声息地往他们的脑髓里钻着。"
PAU_by_h2.a: "“我没事……只是有点头晕而已。”"

PAU_by_h3.t: "今天的汤太咸了"#白夜溜达事件三阶段
PAU_by_h3.d: "“姐，你碗里的汤都快溢出来了。……喂，你碗里那块大的分我一口嘛。”\n坐在对面的弟弟把筷子伸过桌子中央，冷不丁被母亲用抹布顺手拍了一下手背。\n“自己碗里的都顾不过来，少打你姐的主意。”母亲在旁边的板凳上坐下来，顺手把一小碟腌萝卜推到我手边，“……玛莎下午特意跑来家里，说你剪布料的时候差点伤到手腕。要是车间里活计太重，明天就在家多睡会儿，工会那边我去替你递请假条。”\n“妈……真的不用担心啦，昨夜做噩梦醒得太早了嘛。”\n我低头应着，舀起一勺汤送进嘴里。舌尖尝到很重的咸味之后，原本飘忽沉重的念头瞬间落回了肚子里。\n母亲一边擦着桌子，一边低声念叨：\n“隔壁的大婶今天也说，昨天深夜听到后院有熟人在敲门。修车铺那边也是，几个学徒晚上吓得不敢回去睡觉，大家都说最近怪怪的。”\n弟弟咽下嘴里的土豆，抢着比划道：\n“我今天也遇到怪事了！修车铺旁边有团长得像猫一样的白毛小家伙，不仅抢了我一口烤红薯，还冲着水沟呜呜叫呢！它叫完之后，那股怪风一下子就散掉了！”\n母亲伸手按住弟弟乱动的脑袋，把锅里留着的一块熟土豆夹进我碗里，随后伸手握住了我的手。\n母亲的手很粗糙，掌心里带着浓厚的温暖：\n“艾玛，别一个人胡思乱想了。只要我们一家人都还在一起，外面那些乱七八糟的怪事就找不上我们的门了。”"
PAU_by_h3.a: "“嗯。”"

PAU_by_h4.t: "跟我来吧"#白夜溜达事件四阶段
PAU_by_h4.d: "车间熄灯的时候，外面的天已经全黑了。\n我踩着路边的杂草往回走时，身旁不知何时多了一道修长熟悉的身影。她走得很慢，转过脸冲我温柔地笑着。\n“艾玛今天又被工长扣工钱了吧？”姐姐并肩走在我身旁，语气轻柔得像晚风一样。\n“嗯……剪坏了几尺布。”我握紧了她牵住我的手。\n那只手掌冰凉刺骨，还沾着洗不掉的煤渣。\n我心里其实隐约知道这是亡灵布下的幻觉。可眼前的姐姐不仅长着生前的容貌，甚至还清晰地记得我每一次挨骂时委屈的习惯。\n在这个每天都要挨饿、每天都被防空警报惊醒的残酷世界里，我真的太累了。\n“在活人的城里待着太苦了。”姐姐握紧了我的手，声音带着神智清醒的自责与心疼，“你每天在车间里没日没夜地干活，还要受那些军官的气……跟姐姐走吧。”\n小巷的灯火在不知不觉中熄灭了，脚下的路变成了城外废弃矿区的悬崖荒地。\n四周弥漫起灰蒙蒙的大雾，姐姐慢慢停下了脚步：\n“底下很冷，但那里很安静。没有长官在门外催命，也不用饿着肚子排队领粮，再也不会有人欺负你了……艾玛，跟姐姐下去睡大觉吧，我们两个再也不分开了。”\n看着那双充满眷恋与心疼的眼睛，我的眼泪瞬间涌了出来，心底最后一点防线彻底崩塌了。"
PAU_by_h4.a: "“……带我离开这里吧。”"

PAU_by_h5.t: "快拉她上去"#白夜溜达事件完成后由19事件触发#
PAU_by_h5.d: "那个年轻姑娘快要掉进塌陷的坑洞里时，我扑上前抓住了她的上衣领口。\n雪伊也跟着冲了过来，扣住姑娘的双肩用力往上拉着。可坑底下伸出来的灰手力气特别大，正拼命拽着姑娘的脚踝。\n悬在坑边的姑娘疼得哭出了声：\n“姐……好疼……脚要断了……”\n坑底下那具残破的身形顿住了。\n那双手骨原本还在用力撕扯，可在触碰到妹妹温暖的皮肤、听见那声带着哭腔的呼喊时，动作骤然停在了原处。\n死去的姐姐注视着自己压在妹妹皮肤上的枯骨，上面已经勒出了青紫的淤痕。她空洞的眼眶里有某种凶戾在剧烈动摇，随后，那双手骨像是被烫到一样缩了回去。\n“……艾玛？”\n地底传出来的声音带着颤抖的哭腔：\n“是我不好……是姐姐把你吓坏了吧……”\n“我都已经死了……你还跟着我跑出来干嘛啊……”\n“做事还是这么毛手毛脚，脚腕还细得跟竹竿一样……这么笨，掉到这种地方你该怎么活啊……”\n死去的姐姐伸出枯骨垫在妹妹脚底，像小时候托着妹妹翻院墙一样，用尽力气拼命往上顶了起来：\n“快拉住她！上面的长官！求你们快把我妹妹拉上去！！”\n“艾玛，回城里去……回去告诉妈妈……以后的汤别煮得那么咸了……告诉弟弟，快点长高，以后……替姐姐保护你……”\n“姐姐骗了你……底下太黑了，根本睡不着的……这里明明…冷得要死啊……”\n“听姐姐的话，永远……都不要再来看我了……好吗？”\n我们借着那股推力，一口气将姑娘拉回了平地。\n坑底下的土石彻底滑落，死去的姐姐随着崩塌的碎块坠入黑暗深处，再也看不见了。"
PAU_by_h5.a: "“带她回去找家人吧。”"

PAU_by_wide.t: "信我的准管用"#白夜溜达事件最终阶段
PAU_by_wide.d: "后勤处的门被推开的时候，在缝纫车间做工的艾玛快步走了进来，手里还提着一截空空的草绳：\n“春日小姐！前天我问你地窖有怪声音该怎么办，你当时可是拍着胸脯向我保证过你的办法没问题的呢！”\n遥正坐在桌边啃着苹果，嘴里嚼得鼓鼓的，连连点头：\n“对呀，照我说的办肯定管用嘛。”\n“管用才怪呢！”艾玛将那根油乎乎的草绳放在桌上，大声埋怨道，“昨天晚上大家在门后面挂了香肠，白夜确实跑来吃了。可它吃饱之后，直接引来了几十条野狗在院子里打起了架来，在外面叫唤了整整一夜，吵得大家连觉都睡不成啊！”\n遥缩了下脖子，把手里剩下的苹果拿开，声音一下子弱了下去：\n“对、对不起嘛……可是我当时说的是挂一小截尝尝味道，谁让你们挂那么长一大串啊！它们闻到肉味肯定忍不住嘛……”\n艾玛张嘴正要反驳，遥清了清嗓子，理直气壮地抢过了话头：\n“不过等一下！你仔细想想看，这难道不是挺好的事情吗？”\n艾玛愣在桌前，一时间搭不上话：\n“……哈？”\n遥拍了拍桌子，越说越起劲：\n“你看，昨晚大家光顾着生野狗的气，是不是根本想不起来害怕地窖里的声音了？”\n“这就叫转移注意力！接下来的事情就更简单了嘛，去打一桶水把地上的油渍冲个干净，野狗闻不到油味就跑了，那些怪声音也肯定早就被狗叫声吓跑了。看吧，事情这不是解决得挺顺利的嘛！”\n我端着水杯靠在门边，面无表情地打断她：\n“艾玛，别听她瞎编。工会一早就安排了巡防队去清理街道。那些亡灵残留下来的声音，大家白天聚在车间和食堂里说说笑笑，很快就散掉了。”\n艾玛望着一脸无辜的遥，忍不住噗嗤一声笑了出来：\n“……亏我之前还以为春日小姐是个多沉稳的大人物呢，原来也是个爱胡来的姑娘呀。”\n遥不知何时又重新吃起了苹果，小声抗议道：\n“喂！艾玛！我很靠谱的好不好！”\n随着阳光照射在桌面上各工区送来的报告上。那些原本让人担惊受怕的怪事，在屋里的笑闹声中慢慢淡去了。"
PAU_by_wide.a: "“以后可别再乱挂香肠了。”"
