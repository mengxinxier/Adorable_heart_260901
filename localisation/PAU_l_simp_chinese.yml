# 副领袖：春日小遥与阿夏（修正与各自领袖特质一致）
PAU_xiaoyao_name:0 "春日小遥"
PAU_xiaoyao_political_desc:0 "§Y春日小遥§!\n@PAU§Y[FROM.Getname]§!的§9助手§!\n\n§t受到庇佑的少女§!\n  - $MODIFIER_STABILITY_FACTOR$：§G+10.00%§!\n  - $MODIFIER_POLITICAL_POWER_FACTOR$：§G+10.00%§!\n  - $MODIFIER_IMPROVE_RELATIONS_MAINTAIN_COST_FACTOR$：§G-25.00%§!\n  - $MODIFIER_TRADE_OPINION_FACTOR$：§G+10.00%§!"
PAU_xiaoyao_diplomacy_desc:0 "§Y春日小遥§!\n@PAU§Y[FROM.Getname]§!的§9助手§!\n\n§t受到庇佑的少女§!\n  - $MODIFIER_STABILITY_FACTOR$：§G+10.00%§!\n  - $MODIFIER_POLITICAL_POWER_FACTOR$：§G+10.00%§!\n  - $MODIFIER_IMPROVE_RELATIONS_MAINTAIN_COST_FACTOR$：§G-25.00%§!\n  - $MODIFIER_TRADE_OPINION_FACTOR$：§G+10.00%§!"
PAU_xiaoyao_deputy_leader_desc:0 "§L在樱花群岛的海港镇上长大，小遥从小就在造船厂、火车站和码头摊位之间到处奔跑。她整天混在工人堆里，把码头的门道摸得一清二楚。在街头长大的经历，让她懂得怎么跟各种人打交道，也习惯在走投无路时找出生路。\n故乡的局势越来越乱，小遥带着同伴们从神社救出的白夜，横跨大海一路开到了南美。这支孤独的船队避开沿途的巡逻，最终停靠在莉兰迪亚的港湾里。§!"
PAU_Nymph_name:0 "阿夏"
PAU_Nymph_political_desc:0 "§Y阿夏§!\n@PAU§Y[FROM.Getname]§!的§Y助手§!\n\n§Y强硬的军官§!\n  - $MODIFIER_CONSCRIPTION_FACTOR$：§G+5.00%§!\n  - $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$：§G+5.00%§!\n  - $MODIFIER_DIG_IN_SPEED_FACTOR$：§G+5.00%§!\n  - $MODIFIER_MAX_DIG_IN$：§G+5§!"
PAU_Nymph_diplomacy_desc:0 "§Y阿夏§!\n@PAU§Y[FROM.Getname]§!的§Y助手§!\n\n§Y强硬的军官§!\n  - $MODIFIER_CONSCRIPTION_FACTOR$：§G+5.00%§!\n  - $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$：§G+5.00%§!\n  - $MODIFIER_DIG_IN_SPEED_FACTOR$：§G+5.00%§!\n  - $MODIFIER_MAX_DIG_IN$：§G+5§!"
PAU_Nymph_deputy_leader_desc:0 "§L十几岁刚进兵营的时候，阿夏加入的军团是整片大陆名气很大的雇佣军。在巴罗这些老兵的带领下，她学会了怎么用枪，怎么开坦克、甚至是重新领导一群新兵打赢胜仗。那时的军团按合同拿钱办事，靠着强硬的作战本事在各地受雇打仗。\n1934年，王室强令军队去工区镇压罢工，彻底撕裂了军团。\n老军团长离世后，晓枫带着一部分人退入深山，阿夏则留下来接管了剩下的队伍。她理解晓枫的选择，但……谁又来理解她呢？§!"

 # 小遥专属领袖特质
 PAU_xiaoyao_leader:0 "白夜的大统领"
 PAU_xiaoyao_leader_desc:0 "§L从樱花群岛的喧闹码头一路跌跌撞撞，最终阴差阳错成为了白夜同盟的大统领。她或许讲不出什么深奥的大道理，却最擅长在走投无路时为大家找到生路，也最懂得怎样让满心芥蒂的人们踏实地坐到同一张饭桌前呢。§!"

 # 亡灵危机：向亡灵宣战
 PAU_undead_crisis:0 "亡灵危机"
 PAU_undead_crisis_desc:0 "冰冷的死气顺着山脉向平原不断蔓延，前线各哨所都察觉到了死者大军蠢蠢欲动的迹象。既然和平的退路早已断绝，我们也必须做好全面迎击的觉悟啦。"
 PAU_declare_undead_war:0 "向亡灵宣战"
 PAU_declare_undead_war_desc:0 "正式对迫近的死者军团打响反击战。凡是白夜曾逗留过的每一寸土地，都会迅速集结起保卫家园的民兵，同军团各部并肩阻截尸潮。"
 PAU_sakura_cruisers_tt:0 "两艘经过战备改装的舰船——【白夜】号与【春日】号移交给了我们，舰队现已就位停泊在卡卡罗姆港口。"
 PAU_auto_baiye_unlock_tt:0 "解锁专属决议：开启白夜自动巡游。激活后每隔§Y30§!天自动让白夜前往一处受控州驱散死气。"

 # 亡灵反扑每月事件
 PAU.7010.t:0 "夜色深处的躁动"
 PAU.7010.d:0 "边境前沿的亡灵压迫又开始节节攀升了。哨卡送回的情报说，外围荒野的枯草与坟地整夜都传出窸窣异响，清晨派出的侦察分队更是一半都没能平安归建。死气的阴霾已经快要漫过前沿工事，大家究竟该立刻调派预备队正面顶上去，还是优先组织前沿村落的乡邻撤入地窖掩体避难呢？"
 PAU.7010.a:0 "“把预备队压上前线，正面顶住！”"
 PAU.7010.b:0 "“优先安排外围村落撤入掩体暂避。”"

 # 避风港专业化类型
 PAU_harbor_military:0 "设立 §Y[FROM.GetName]§! 为军港"
 PAU_harbor_military_desc:0 "在港区增设岸防工事与专用船坞，集中存放舰队所需的弹药和燃料。有了完备的军港设施，我们的舰船就能随时出海执行护航与作战任务。"
 PAU_harbor_trade:0 "设立 §Y[FROM.GetName]§! 为商港"
 PAU_harbor_trade_desc:0 "扩充货运泊位与码头仓库，为往来的远洋商船提供便利的装卸服务。随着港口贸易逐渐繁荣，我们与海外各国的商业往来也会变得更加密切。"
 PAU_harbor_refugee:0 "设立 §Y[FROM.GetName]§! 为难民港"
 PAU_harbor_refugee_desc:0 "在港区周围兴建安置房舍与医疗站，专门接纳从海外逃难而来的流亡船队与平民。妥善安置这些无家可归的人，也能让沿海地区更加安定。"

 # 雇佣兵机制与战果
 PAU_mercenary_reputation_tt:0 "£GFX_PAM_am 雇佣信誉度：§Y[?ROOT.PAU_mercenary_reputation|0]§!"
 PAU_contract_victory:0 "履约凯旋"
 PAU_contract_victory_desc:0 "前线连队顺利协助雇主赢得了战事。同盟积累的信誉越扎实，营地所能收到的尾款分红与全军师组织度恢复增益便越显著。效果持续§Y180§!天。"
 PAU_contract_victory_low:0 "勉强履约"
 PAU_contract_victory_low_desc:0 "部队虽然勉强完成了雇佣委托，但由于此前信誉平平，只结算到了相当有限的酬劳，部队的振奋状态也仅能维系较短的时间。效果持续§Y90§!天。"
 PAU_contract_victory_high:0 "大捷"
 PAU_contract_victory_high_desc:0 "信誉卓著的老牌连队以无可挑剔的战果结束了合同。丰厚的战利品、足额的报酬与全军高昂的师组织度均达到了顶峰。效果持续§Y360§!天。"

