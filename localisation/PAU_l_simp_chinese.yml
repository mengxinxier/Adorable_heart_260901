PAU_end_title:0 "§t随后，电车开动了§!"

PAU_end_tip:0 "电车车厢里挤满了放工的人群，我和阿夏抓着吊环刚站稳，就看见靠窗的椅子上坐着一个熟悉的身影。\n那是个穿着整齐校服的小姑娘，她正把书包规规矩矩抱在怀里，膝上摊开着一本崭新的数学课本。\n“哎？小果——”\n我刚抬起手想打招呼，小姑娘猛地抬起头，十分认真地打断了我：\n“停！春日学姐，在公共场合请称呼我‘禾果’同学。我已经正式登记了学籍，小果子那是战时的临时代号，现在可是和平的新时代呢。”\n“啊？！禾果？！”我差点咬到自己的舌头，“听起来像什么点心铺子里卖的糯米团子一样！”\n“才不是点心！”禾果气呼呼地合上课本，小脸涨得通红，“这是晓枫姐亲自告诉我的名字！‘禾’代表春天下种的庄稼，‘果’代表秋天丰收的果实！多有学问、多吉利呀！哪像遥学姐你，名字听着就像天天琢磨着逃跑旷课的样子！”\n握着上方吊环的阿夏面无表情地接了一句：\n“啊……禾果同学分析得很到位。逃跑执政官春日遥。”\n“阿夏！你怎么也跟着外人一起挤兑我啊！”\n正吵吵嚷嚷着，白夜毛茸茸的脑袋突然从我的布包里探了出来，小鼻子嗅了嗅，一口叼住了禾果书包侧兜里露出来的油纸包。\n“呀！白夜大人……不对，白夜！你怎么又来偷吃我的东西呀！”\n禾果慌忙护住纸包，气鼓鼓地抱在胸前，随后抽出了两块烤红薯干递了过来：\n“真是服了你们两个了……给，分你们两块，免得等会儿下了电车肚子饿得咕咕叫。”\n白夜叼着红薯干缩回布包里吧唧起嘴来，我也跟着咬下了一大口，感受着嘴里甜滋滋的味道。\n“小遥学姐！糖霜全掉在我的作业本上了啦！”\n“哎呀，数学老师肯定不会计较这点小事的呢。”\n“会记仇的！绝对会扣平时成绩的！！”"

PAU_end_tip_lower:0 "感谢您陪伴军团与春日小遥走过这趟漫长的风浪！\n愿屏幕前的您，在属于自己的现实生活中，也能拥有推翻困境的勇气。"

PAU_end_close_button:0 "§t“明天见啦，禾果同学。”§!"

PAU_end_close_button_TT:0 "§L其实啊……是你们这群笨蛋，一直护着一个除了逃跑什么都不会的骗子，把她随口编出来的假话，一步步变成了能让所有人安稳回家的路呢。§!"