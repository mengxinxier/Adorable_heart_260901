PAU.570.t:0 "联合学说研讨会"
PAU.570.d:0 "联合参谋学院积分攒够了，学院决定召开一次闭门学说研讨会。来自各国的参谋和教官把地图、沙盘和训练记录铺满了整张长桌，争论从清晨持续到深夜。\n“这次不是听课，是要把学过的东西拧成一股绳。”小遥把三枚代表不同学说的棋子拍在桌上，“选一个方向，我们集中突破。”"
PAU.570.a:0 "集中突破装甲学说。"
PAU.570.b:0 "集中突破步兵学说。"
PAU.570.c:0 "集中突破联合作战学说。"
PAU.580.t:0 "军官进修班"
PAU.580.d:0 "白夜同盟的军官进修班又一次开课。来自南美各成员国的军官们带着本国的战术笔记走进教室，他们中将有人专攻装甲，有人钻研步兵，也有人把目光放在后勤与联合作战上。\n小遥在门口和每一位学员握手：“你们学成回去，不光要教会自己的部队，也要把心得寄回学院。这场战争，靠一个人是打不赢的。”"
PAU.580.a:0 "选送装甲军官：学习装甲突击和合成兵种协同。"
PAU.580.b:0 "选送步兵军官：学习步兵战术和阵地攻防。"
PAU.580.c:0 "选送联合作战军官：学习后勤、侦察和协同指挥。"

