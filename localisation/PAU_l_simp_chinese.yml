PAU_start_game_text: "§Y走吧，今天照常出操§!"
PAU_his_page_01_title: "留在营地里的人"
PAU_Country_History_Page_01: "1935年军团分裂，晓枫带着追寻理想的队伍退入深山建立野火，阿夏与留守营地的部队则按照最初的合同继续驻防。这支老牌雇佣军在南美征战了多年，全靠给雇主打仗换口饭吃，营房周围聚集着一大批除了开枪修车什么都不会的退役老兵与随军家属。老军团长走后，年轻的阿夏挑起了残部的担子，不仅要操持全营几百张嘴的吃喝，还得照看棚里那些缺油少件的老式战车。在卡卡罗姆的游击队看来，他们是替统治者看家护院的走狗；在王都的大臣眼里，他们又是一群随时可能毁约倒戈的隐患。"

PAU_his_page_02_title: "谁来结清这笔欠款"
PAU_Country_History_Page_02: "索拉娜在王都掌权后，为了稳住边境防线，数次批出数量慷慨的物资调往前沿。在王宫那位新主人的设想中，顶在山道入口上的雇佣军理应领足了粮饷与补给。\n然而王都的大臣们认定山里的反抗军成不了气候，继续花大钱养着这群外人纯属浪费。内廷官僚私吞了黄金拨款，运粮车队更是直接被改道拉去私人码头倒卖。真正送到营地门前的，往往只有押运官随手甩下的几张推迟兑现的字据。\n老军官相继卷铺盖跑路，阿夏多次拦住押运官当面理论，换来的只有对方推三阻四的冷笑。"

PAU_his_page_03_title: "冬天就要过完了"
PAU_Country_History_Page_03: "进入1936年，营地里的库房彻底见了底，再也煮不出能顶饱的东西了。对面的野火在卡卡罗姆筑下工事后按兵不动，只等这支饥肠辘辘的连队自行瓦解；王都的催款信塞满了抽屉，送来的依旧只有推诿。\n留下是活活饿死，擅自撤兵会被王室以叛逆论处；强攻野火代表着鱼死网破，退回王都又无立锥之地。夹在往日同伴的枪口与雇主的猜忌之间，这支进退两难的雇佣军，只能在高原刺骨的风雪里一天天煎熬。"
