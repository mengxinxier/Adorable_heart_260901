#政治线国策v 




PAU_tx: "退信"
PAU_tx_desc: "王室送来的信件写得明明白白，结款的日期又往后推了。大伙儿都空着肚子，脾气自然好不到哪去。可要是现在撂挑子走人，这处营地立刻就得散伙。只能先把催款信塞回抽屉，顺便交代炊事班往汤锅里多舀几勺水，先把中午这顿应付过去再说。"

PAU.1.t: "栏杆升起时"
PAU.1.d: "“王室送来的又是欠条。”\n副官把午饭递给我。碗里清得见底，只有几片煮烂的菜叶。\n“他们让大家多体谅一下，再等两周。”副官抓了抓乱糟糟的头发。\n“体谅又不能当饭吃。”\n我抿了一口热汤，舌头上除了粗盐的苦涩就没别的味道了。\n远处的山谷里，晓枫那些人的营地隐隐约约能看到一点影子。当初分道扬镳的时候，她跟我吵了一架，说我们迟早会被王室当破抹布扔了。现在看来，倒真让她给说中了。\n正琢磨着下个月的伙食费从哪抠，门岗上的铜铃冷不丁响了一声。\n“长官，门口来了个怪人。”\n我放下碗，朝营区大门走了过去。\n站在路障外面的既不是信差，也不是山里的探子。\n那是个背着旅行包的白发少女，肩头趴着一只雪白的类似小猫一样的生物，正东张西望地打量着哨塔上的掩体。周围几支上了膛的步枪正对着她，她却跟没看见一样，高高兴兴地冲我挥起了胳膊。\n“打扰啦——！”\n她几步蹦到栏杆前把双手搭在了上面，笑得特别灿烂。\n“顺着路走了好久，肚子早就叫个不停了……请问这里有食堂吗？能分我点东西吃吗？我有带钱的。”\n这番话一出，哨卡里瞬间就安静了下来。\n值班的卫兵端着枪愣在那儿，看我也不是，看她也不是。\n在这个除了火药味就是欠条的鬼地方，居然真有人把兵营当成了路边的饭馆。"
PAU.1.a: "“把枪放低，让她进来吧。”"

PAU.2.t: "勺子"
PAU.2.d: "勺子在铁碗里刮过了最后一圈，发出清脆的响声。\n少女把碗里的菜叶吃得干干净净，抽出手帕擦了擦嘴角。她肩上趴着的那只小白兽换了个舒服的姿势，眯着眼睛打起了呼噜。\n“多谢款待。虽说除了盐味就没尝出别的，但喝下去浑身都热乎起来了呢。”\n她抬起头，看着我的眼神变得锐利了起来。\n“王室答应给你们拨过来的口粮，上周就已经在海港被扣下了哦。”\n我刚点上烟的手悬在空中停住了。\n“运粮船根本就没装麦子，甲板底下装的都是给内廷贵族过冬用的葡萄酒和熏肉。那些大臣给你们寄欠条，无非是想把你们硬生生钉在防线上，替王都挡住山里的游击队罢了。”\n少女双手交叠托着下巴，像是在讨论明天该吃什么：\n“山谷那边的晓枫正在校准火炮，就等着你们的库存见底。只要你们饿得拉不开枪栓，她的队伍就会顺着公路压过来。”\n食堂窗口那边还传来士兵们敲饭盆的吵闹声，可我面前这张桌子上的空气却冷得像结了霜。\n“谁派你来的？”我问。\n“没人派我来呀。”少女眨了眨眼睛，“我只是从东边的大岛一路乘船过来，顺路看看当年名声响亮的无国界军团，如今落魄到了什么地步。”\n她伸手指了指窗外那些蹲在台阶上喝汤的年轻士兵。\n“老军团长不在了，晓枫也带着人走了。留在营地里的这些人，既没有可以效忠的祖国，也拿不到卖命的赏钱，只能每天守着空枪饿肚子，不是吗？”\n少女收起手帕，直视着我的眼睛：\n“阿夏长官，你打算带着大家在这里坐着等死，还是换个真正有出路的活法？”"
PAU.2.a: "“……说说你的条件吧。”"

PAU.3.t: "第三个选项"
PAU.3.d: "“换个雇主？”我把空碗推到了一旁，“是去给你们东边的天皇卖命，还是给海上的殖民者当看门狗？”\n“都不对。”\n少女摇了摇头，从风衣内兜里扯出一张叠好的路线图，直接在桌面上摊了开来。\n“给别人卖命，迟早会被当成耗材扔掉。晓枫是对的，你们老团长也是对的，只有傻子才会一直给外人当枪使。”\nn她伸手按在沿海公路的一处岔路口上，那是王室用来中转出口物资的军需仓库。\n“他们既然不发军饷，为什么还要替他们守门？那里的仓库里囤着能吃几个月的麦粉和肉罐头，还有几大罐准备运往海对面的燃油。”\n少女抬起眼眸，那只小白兽跳到了桌面上，蹲在地图边缘舔起了爪子。\n“动了王室的仓库，那我们就成和晓枫一伙的了。”我说。\n“明明是他们先赖账的。”少女说得理直气壮，“雇佣契约上白纸黑字写着拿钱办事。既然他们连饭都不给，你们自己去后厨端菜也是天经地义的吧？”\n此时此刻，在两人对话的屋子外面，巡逻队的脚步声从走廊经过，换岗的哨兵正在交接佩枪。\n“抢了之后呢？”我问，“就算能撑过这阵子，等王都的火炮和山里的游击队两头包夹过来，我们照样没路可走。”\n“那就去港口。”少女在地图最东边的港口画了一个圆圈，“我在外海有接应的船队。只要占下码头，打通去东边的航线，这里就没人能围得住你们了。”\n她收回手指，看着我：\n“到时候你们就是一支自己说了算的队伍。有饭吃，有油用，还能把武器换成机床零件。”\n我低头看着被茶水浸湿一角的路线图，耳边是走廊里又一次响起的哨音。\n蹲在这里是饿死，退回王都也是死路一条。\n“……图纸留给我。”我站起身，把军帽扶正，“等天黑了，我叫几个队长过来开会。"
PAU.3.a: "“要是敢耍花招，我的枪子儿头一个找你。”"

PAU_qxjd: "强行借道"
PAU_qxjd_desc: "卡卡罗姆矿区是去往东部公路唯一的关口。晓枫不可能把根据地的咽喉让出来，我们也没法放弃那条运粮的活路。既然双方都退到了悬崖边上，那就只能靠大炮和子弹来决定谁能活着走过去了。"

PAU.4.t: "两千码开外"
PAU.4.d: "“距离两千两百码。”\n副官把测距板递给了我。\n“要现在开炮吗，阿夏长官？”\n我举起目镜，望向对面山梁上隐约闪烁的红光。\n晓枫在那座山梁上布设了重重火力点。她清楚我们要去抢夺物资，无论这些物资是来自于谁的，我也清楚她不会把这条命脉让出来。\n我们都在为了自己身后那些人的命，把枪口对准曾经最熟悉的人。\n“真要动手啊？就不能谈谈吗？”\n遥靠在车厢挡板旁，正随手翻弄着手里的路线图。\n“对方是你的同僚吧。”\n“当年的同僚。”我移开目镜，“她带着人进山去搞革命，我留下来替剩下的兄弟姐妹讨口饭吃。从各自挑了路的那天起，彼此的枪口就再也没法避开了。”\n遥抬起头，那双红色的眼睛在夜色里很亮：\n“那就别犹豫。在战场上犹豫，死的就是相信你的人。”\n山梁上猛地亮起一串橘红色的火光。一梭子机枪子弹贴着车顶扫过，当场把卡车左边的后视镜打得粉碎。\n这是晓枫在划界线。只要车轮再往前滚过十米，整道山梁的火力就会迎头砸下来。她办事从来不留余地，我也一样。\n我朝后排的车队打出了手势。\n“一连二连，炮口平移四度。”\n“踩死油门冲过去，把路撕开。”"
PAU.4.a: "“开火。”"

PAU_sdft: "撕掉封条"
PAU_sdft_desc: "车库里那些履带车停了很久，车门上还贴着王室盖了红印的白纸封条。以前不动它们，是因为柴油不够用，也是为了维系表面上的安分。现在卡车在山道上挨了机枪扫射，想活命就没法再装老实人。把封条撕下来，给油箱灌满柴油。哪怕车身上还顶着王室的金鹰，今天也得碾出一条活路来。"

PAU.5.t: "合上顶盖时"
PAU.5.d: "起动机接连咳嗽了几声，尾气管终于喷出了浓烈的黑烟。\n车库大门的铁链被拽得哗啦作响，几辆轻型坦克慢腾腾地挪到了空地上。车体侧面的金鹰徽记还刷得油光发亮，泥点子都没能遮住多少。\n副官手里拎着黑漆桶，踩在挡泥板上问：\n“长官，这老鹰标记……要不要先用油漆抹掉？前边就是晓枫的防区，要是让她瞅见了……”\n“费那劲干什么。”\nn我扣紧防风镜的带子，声音被发动机的轰鸣盖得发闷：\n“引擎一打着，晓枫闭着眼睛都知道来的是什么车。当年这底盘散热孔开多大、每块钢板垫多厚，都是她亲手画的图纸。你就算在车头上画满小花，她也认得出这动静。”\n副官挠了挠脖子，把漆桶随手挪在了路边。\n山梁上的信号火光依旧明亮，透过望远镜看过去，隘口正上方插着一面褪色的红旗。\n晓枫这会儿肯定就在掩体后面举着望远镜看呢。\n在她眼里，事实明摆着。当年在工区街道上碾平街垒的是这批车，现在开进卡卡罗姆、准备轰开她家大门的，也是这批车。\n“真残忍呢，阿夏，就不能再谈谈吗？”\n遥两手插在风衣口袋里靠在车棚的柱子旁，语气里带着点事不关己的调侃：\n“从山上看过来，你们简直就像王室养的最听话的恶犬呢。”\n“闭嘴吧你。能谈早谈了。”\n我踩着踏板翻上车顶，弯腰钻进了狭窄的炮塔。\n沉重的金属顶盖砰的一声砸严，风、尘土和草腥味都被隔绝在了外面。\n我拉过通话器的软管，对着麦克风低声吩咐：\n“各车拉开距离，谁也别熄火。”\n“……踩紧油门，跟着我。”"
PAU.5.a: "现在，门彻底关上了。"

PAU_sdjt: "山道尽头"
PAU_sdjt_desc: "矿区入口的枪声终于停了，路面上的碎石和弹壳被推土铲清理到了路边。晓枫被扣在原本属于矿管的地下值班室里，几个负责看押的卫兵正等着发落。是用她的人头去王室领赏换口粮，还是带上这个昔日的同僚一起去海港，必须在天亮前拿个主意。"

PAU.6.t: "请松绑吧"
PAU.6.d: "晓枫坐在靠墙的木椅上，两只手腕被麻绳紧紧捆在椅背后面。她额角上的擦伤已经凝成了黑红的血块，衣服上落满了火药灰，但脊背依然挺得笔直，冷冷地看着我推门进来。\n“王室开给你的赏金可不低。”我拖过一张折叠凳坐在了她对面，“用你的脑袋，能换几万金币，足够给后面整支车队加满去海港的柴油了。”\n晓枫笑了笑，一点求饶的意思都没有：\n“那就拿去换呗。当年在艾瑞波拉我就该死在山道上了，多活的这几年，就当是我赚来的。”\n门轴吱呀响了一声。\n遥踢开门帘走了进来，肩头的小白兽还在探头探脑地打量四周。她径直走到晓枫背后，袖口里滑出一柄小折刀，刀刃一挑，椅背上的麻绳便散落了一地。\n两名卫兵下意识抬起枪口：\n“长官？！”\n“遥，你干什么！？”我一把按住枪套站了起来。\n少女转过身来，平时那副笑嘻嘻的懒散模样收得一干二净。\n她解开风衣内袋的扣子，取出一份盖着朱红印泥的信函，随手拍在了桌板上。\n那是来自极东之地——樱花的正式公函。\n“王室的金币你们是领不到了，阿夏长官。”这次遥的声音里没了任何开玩笑的语调，“王都早就被南下的死灵大军冲垮了，那些大臣眼下正忙着抢车逃命呢。”\n“我坐船出发的时候，议会批下来的调令上统共就写着两个名字。”遥的视线在我与晓枫之间转了一圈，“一个是军团最后的带队人，一个是懂全盘战术的参谋长。”\n她收回小刀，看向正在活动手腕的晓枫：\n“卡卡罗姆艾瑞波拉这片地是王室预定的弃守区。要是阿夏今天没带队强攻打通山道，再过几天赶到这里的，就是索拉娜的先头尸潮。你们谁也逃不掉的。”\n晓枫揉着手腕上的红痕，抬头看向遥和我：\n“原来你们是这么个借道法啊。”\n我盯着桌上那份印着樱花印章的文件，整个人都变得恍惚了起来。\n原以为自己是抓住了求生机会的强盗，到头来，连同这场残酷的强攻在内，每一步都被这位樱花姑娘算计得明明白白。"
PAU.6.a: "“带上她吧，我们抓紧时间去港口。”"

PAU_ddjr: "多带几个人"
PAU_ddjr_desc: "矿道里还缩着几百号耗尽子弹的工人和伤员。晓枫不肯一个人上车，卡车上的篷布底下也还能再挤一挤。柴油不多，但卸掉后排几箱沉重的穿甲弹，就能多腾出位置拉上活人。至于北边公社的雪伊……只能在电台里给她留个通报，能不能从死灵嘴里杀出一条路，全凭她自己的本事了。"

PAU.7.t: "车厢挤一挤"
PAU.7.d: "晓枫刚活动开手腕，走到门口时却突然停住脚步，转头瞪着我：\n“矿道里还有几百多个伤员和筑垒工人，你要把他们全丢在这里等死？”\n我拉低了帽檐：“车队装不下这么多人。柴油只够一口气跑到海港，多拉那么多人，大家全得停在路上当靶子。”\n旁边的遥正整理着风衣领口，笑眯眯地插了一句：\n“樱花的船很大，底舱正好缺一批懂得修机床和装配引擎的熟练工。只要手里还能拿得动扳手，到了那边，我们工钱照付哦。”\n晓枫斜了遥一眼，随即把目光转向我：\n“听见了吗？他们是机械工，不是扛枪打仗的步兵。缴了他们的枪换成工具箱，这样总能拉上车了吧？”\n我呼出浊气，朝走廊外的副官招手：\n“去通知后排卡车，把打空的弹药箱全推下去。拆掉几块挡板，让能走动的全爬进车斗。挤不下的，手把栏杆扶紧了，哪怕掉下车我们也不会减速去捡的。”\n副官应了一声，快步跑去传令。\n我转回身看着晓枫，提起了另一件事：\n“公社那边怎么说？雪伊还在北边的工厂区。卡卡罗姆一丢，索拉娜的尸群顺着铁轨很快就会压过去吧？”\n晓枫快步走到窗台前，一把扯过那部快没电的步话机，将频率旋钮拧到了底：\n“我们现在掉头回去，就是白白送死。雪伊不是傻子，看到王都方向的黑烟，她自己就会带人往外突围。”\n她把步话机往窗台最高处一放，直接拉出了天线：\n“把这个留在矿顶的信号塔上，全天循环播报车队的撤退路线和海港坐标。雪伊要是能杀出来，就会顺着车辙印追上我们；要是她杀不出来……我们去了也只是多搭上几条命。”\n车库方向传来了卡车排气管轰鸣的声浪，震得窗框直响。\n遥把风衣的扣子一颗颗系好，朝我和晓枫招了招手：\n“那么，两位长官，该去码头赶船了。”"
PAU.7.a: "“出发，目标东部港口。”"

PAU_zbgk: "直奔港口"
PAU_zbgk_desc: "卡车的大灯已经全部被关上了，几十辆车正顺着沿海公路全速前进着。车斗里挤得连转个身都费劲，车轮碾过坑洼时能听见悬挂嘎吱作响的哀鸣。北边天际线上的黑烟越来越浓，那是王都被尸潮吞没的火光。晓枫坐在副驾驶上盯着里程表，遥在后面哼着家乡的调子。我们谁也没心思回头再看，所有的活路都被系在了港口货栈的那批燃油和粮食上了。"

PAU.8.t: "货栈门前"
PAU.8.d: "车队在港区货栈的门前猛地刹住，几名戴着王室帽徽的看守提着马灯从哨房里跑了出来，慌慌张张地举起手里的佩枪，还没弄明白怎么回事就被跳下车的士兵围在了墙根底下。\n“你们是哪个部队的？！”领头的看守官拉开嗓子喊道，手抖得连保险都拉不开，“这里是王都封存的军需，擅动者按叛乱论处！”\n我推开车门跳下踏板，脚底踩在了码头的湿水泥地上。\n“你们的王都早就没了。”我看着他的眼睛，“内廷那些老爷大概已经在给怪物填肚子了。想保住脑袋的，就把大门钥匙交出来。”\n看守官愣在原地，脸色唰地全空了。\n晓枫从车后面走了过来，手里拿着一把用来撬锁的撬棍，连看都没看那群吓呆的看守，直接插进了大门铁锁的扣环里。两名跟上来的工人用力一扳，挂锁啪的一声断成两截。\n铁门里面整整齐齐码放着上千个木箱，麦粉的干香混着柴油味扑面而来。\n车斗里的伤员和矿工们发出了一阵压抑的骚动，隐约还能听到几声如释重负的抽泣。\n遥从车斗边沿跳下来，走到码头的水泥桩旁抬手指向了漆黑的海面。\n两长一短的汽笛声破开浓雾，沉闷地地压了过来。\n海湾深处，两艘悬挂着樱花旗帜的庞大军舰正缓缓驶入锚地，甲板上的探照灯打出一道道雪白的光柱，落在了我们的卡车前。\n“看吧，我没骗人。”遥转过身，海风吹起了她的风衣下摆，“船到了，粮食和柴油也拿到了。”\n晓枫站在敞开的库房门前，看着那些跳下卡车拼命搬运物资的工人和士兵，神色复杂地低声问我：\n“接下来呢？登船离开，还是把港口变成防线？”"
PAU.8.a: "“先把油箱灌满，别的事待会儿再说。”"

PAU_jmyx: "加满油箱"
PAU_jmyx_desc: "货栈里的柴油桶都被撬开了，战士和工人们提着油枪轮流给每辆车灌满。好几个月没闻到过真正的饭菜香，大家围坐在集装箱旁边狼吞虎咽，连掉在棉袄上的肉碎都捏起来吃了。樱花的运输舰在栈桥边放下了登船跳板，水手正忙着清点登船人数。油箱满了，肚子也饱了，可谁也没法装作听不见北面铁路线上传来的求救信号。"


PAU.9.t: "跳板搭稳时"
PAU.9.d: "工人们坐在仓库门前的空地上，手里捧着刚用热水烫过的牛肉罐头，呼哧呼哧吃得满嘴是油。几个缠着绷带的年轻士兵互相碰着拳头笑着，那是我们在艾瑞波拉几个月都没见过的松快劲儿。\n遥站在运输舰的舷梯旁，朝我招了招手：\n“货舱腾出来了好几个大隔间，淡水和压缩饼干都管够。阿夏长官，你们的人现在就能排队上船了哦。”\n我低头看着脚边的空油桶。卡车的引擎已经全部热好，只要开上运输舰，这帮跟着我挨冻受饿的兄弟姐妹就能彻底从这场泥潭里脱身。\n港务室的门突然被人用力推开了。\n晓枫大步走了出来，头上还戴着电台的耳机，电线在身后拖得老长。\n“通了。”她站在台阶上看着我。\n我转过身：“什么通了？”\n“留在矿顶的步话机。”晓枫摘下一边耳机递向我，“雪伊的人冲破了工业区的封锁线，正沿着北边的铁路线往港口撤退。后面跟着大批亡灵，她们就只剩下几辆卡车了，弹药也快打光了。”\n耳机里全是刺耳的电流杂音，隐约能听到雪伊在另一端粗着嗓子的嘶吼，伴随着密集的机枪点射和撞击声。\n遥慢慢走下跳板，站在了我们两人中间：\n“舰队必须赶在退潮前出港。要是死灵主力涌进港区，樱花军舰会立刻收起跳板离港。我们的任务是接走你们，可没义务替游击队打阻击战啊。”\n晓枫把手里的耳机递得更近了些：\n“离码头入口还有十五公里。雪伊只要能冲过跨河铁桥，就能甩开后面的步兵追兵。但那座桥被王室撤退时炸断了一截，车根本开不过来。”\n码头上的风把海浪拍在水泥桩上，碎成一片片泡沫。\n一边是已经搭好跳板、随时可以启航去樱花的运输舰；另一边是加满了柴油、炮口还能开火的几辆轻型坦克。\n所有的人都停下了手里的动作，回头看着我。"
PAU.9.a: "“……二连留下来装船，其余人跟我上车，去铁桥接人。”"
PAU.9.b: "“……收起跳板，我们立刻开船。”"

PAU_zjwyj: "追加违约金"
PAU_zjwyj_desc: "遥把一张重新拟好的赔偿清单直接拍在了挡风玻璃上。擅自掉头去救人等于把整个樱花舰队拖在浅水区当活靶子，按规矩要赔上好几倍的运费。可她转头就抄起联络机，让外海的护航战舰把主炮转到了铁桥方向。嘴上说着蚀本买卖，手底下的舰炮火力却一发也没含糊。"


PAU.10.t: "跳上副驾驶"
PAU.10.d: "柴油机的黑烟刚喷出来，车门就被人在外面用力拍了两下。\n还没等我踩下离合，遥拉开副驾驶车门拎着旅行包直接挤了进来，那只小白兽也跟着跳上仪表盘找了个地方趴好。\n我瞪了她一眼：“你上来干嘛？船不等潮水了？”\n遥把包塞在脚下，从怀里扯出一副连着长天线的通话器：“开船的指令我推迟了。擅自带着主力掉头救人，阿夏长官，你明白这在合同里叫严重违约吧？”\n坐在后排的晓枫刚核对完等高线图，正准备开口。\n我抢先松开手刹，打死方向盘把车头拐上了公路：“违约金记我账上，以后打工还你。嫌危险现在跳下去还来得及。”\n遥听得直翻白眼，语气里满是嫌弃：“打工？拿你在泥巴里打滚的那点薪水还到下个世纪吗？”\n她不再跟我磨嘴皮子，伸手按下了通话器的发射开关，对着麦克风发令：\n“这里是遥。通知海湾里的军舰，主炮解除待命。目标锁定沿河铁路线北岸，覆盖追击公社车队的尸群。”\n通话器另一端传来一阵急促的应答声，伴随着尖锐的电流鸣响。\nn交代完炮火支援，遥侧过脸看着我，神情又变回了精明的小贩子：“救人的弹药损耗全算在你的债务账单里。等到了樱花，你手下这帮人每天都得老老实实去厂里上班。”\n轰——！\n海湾方向传来一阵撼动地面的沉闷轰鸣，两团赤红的火球撕裂夜空，呼啸着越过头顶砸向北面的山脊，气浪把公路两旁的灌木吹得齐刷刷弯下了腰。\n后座的晓枫望着窗外被炮火映亮的天际线，喃喃说道：\n“雪伊要是听见这动静，肯定以为又是哪路王室舰队来要她的命了。”\n“抓稳了。”我踩下油门，卡车顺着车辙印直奔铁桥冲去。"
PAU.10.a: "“去把那个跑不动的家伙捞回来。”"

PAU.11.t: "铁桥对岸"
PAU.11.d: "江面上的雾气被远处的炮火撕得粉碎，跨河铁桥正当中垮塌了一个几米宽的大豁口，扭曲的钢梁斜斜吊在湍急的江水上方。对岸的铁轨旁，一辆侧翻的货车冒着滚滚浓烟，几个公社伤员正缩在桥墩后面躲避着流弹。\n车还没停稳，晓枫就撞开车门冲了下去，三两步赶到断桥边缘。\n对岸靠在车轮后面的身影立刻抬起长枪，剧烈咳嗽着吼道：\n“对岸的是谁？！我手里的枪可不长眼！”\n那是雪伊的声音。\n晓枫站在断口前，双手拢在嘴边大喊：“雪伊！是我！”\n对岸的身影明显僵住了。雪伊抹了把脸上的污迹，瞪大眼睛认出了晓枫，紧接着目光就扫到了我和开上桥头的军用卡车上。\n“晓枫？！你没死？……等等，王室的狗腿子怎么也在旁边？！你们是来拿我换赏钱的？！”\n雪伊的声音又惊又怒。\n我走上前，从车头扯下一根沉重的拖车缆绳，甩起带挂钩的那头用力扔过断口，稳稳卡在对岸的一根枕木上。\n我冲着对岸吼了回去：“少在那边废话！王都早让怪物给平了，谁有闲心抓你去换钱！能动的抓紧绳子爬过来，动不了的绑在腰上，我们这边拉！”\n后面的遥也跟着小跑过来，两手扶着栏杆大声补充：\n“动作要快哦！战舰的炮弹很贵，舰队只答应掩护十五分钟，超时了大家都要留在这儿喂亡灵呢！”\n对岸废墟深处传来了尸群尖利的咆哮。\n晓枫踩上悬空的铁梁，朝对岸伸出了手：“雪伊！别犯倔了！先把伤员送过来！”\n雪伊咬着牙收起武器，转身和几个工人把第一名伤员用皮带绑在了缆绳上。\n我和车队的几名士兵抓稳绳子，一点点把人拉过江面。\n十多分钟过去了，顺着缆绳爬过来的雪伊浑身被水汽浸得湿透了，刚跳上这边的地面就脱力地坐了下去，大口喘着粗气。\n晓枫蹲下身，伸手替她擦掉了额头上的血渍。\n雪伊突然扭过头瞪着我：\n“……阿夏，你带队开炮轰我防线的事，我可没答应就这么算了。”\n我把一盒热好的牛肉罐头塞进她怀里：\n“我也没打算让你就这么算了。先吃东西，车队该回码头了。”"
PAU.11.a: "“所有人上车，回港口。”"

PAU_zmxx: "装满鲜血的罐头"
PAU_zmxx_desc: "撤回港口的卡车还没熄火，车斗里就吵翻了天。脱险的侥幸被对岸留下的血腥味冲得干干净净。雪伊不肯咽下军团分发的口粮，指着车厢里的伤员厉声质问。卡卡罗姆阵地上被炮火轰碎的工事、铁桥北岸没能抓牢缆绳的同伴，成了横在所有人中间拔不掉的钉子。谁也没法替死在路上的兄弟姐妹大度地假装一切都没发生。"

PAU.12.t: "谁留在对岸"
PAU.12.d: "车刚在码头的水泥地上刹停，就传出一声沉闷的撞击声。\n雪伊抓起怀里那个牛肉罐头，用力砸在车厢挡板上，马口铁罐滚落在地，里面的肉汁溅了一车板。\n她扶着车栏站起来，脸颊因为愤怒涨得通红，指着晓枫的鼻子大声吼道：\n“晓枫啊晓枫！你看看车上坐着的都是谁？！二班的伤员全被截在断桥北头，李工为了给卡车挡机枪，整个人被扫进河里连泡都没冒一个！你告诉我，你凭什么坐在军团的卡车上发号施令？！”\n晓枫从后排站起身，迎着雪伊通红的眼睛，语气低沉地说道：\n“如果车队不按时撤离，所有人都会死在隘口。”\n“所以你就挑着人救，是吗？！”雪伊的声音几乎破了音，眼泪混着脸上的灰正往下淌着，“在卡卡罗姆，军团的大炮直接把防御工事连同几十号守地的兄弟全扬成了灰！他们到咽气都以为自己是在抵抗王室的走狗！结果呢？！你现在居然跟这帮强盗坐在同一辆车里美美吃着罐头？！”\n她随即转过脸，视线狠扎在我身上：\n“阿夏！对岸还有四十多个人没爬过来！桥桩后面全是活生生的人！你凭什么下令割断缆绳？！你哪怕多等两分钟……”\n我推开车门跳下踏板，站在车厢下抬头看着她：\n“再等两分钟，怪物的先锋就已经顺着绳子过江了。到时候整座铁桥全都得丢，车上的伤员一个也别想活着进港口。”\n“那对岸的人就活该被扔下吗？！”\n“他们没活该，我也没做错。”我避开她那双快要喷火的眼睛，“在卡卡罗姆开炮是我下的令，在铁桥砍断缆绳也是我下的令。你想骂就冲着我来，少在这里冲着晓枫撒泼，她手里的枪早就被我下了。”\n车斗里的公社工人和伤员全都低着头，没人敢出声，只剩下海浪拍打栈桥的撞击声在风里回荡。\n一直站在跳板旁的遥收敛了平时的玩笑神情，抬手看了一眼天色，轻声提醒道：\n“港口的军舰已经在催人了。距离潮水退去只剩最后几分钟，想吵架的话，等所有人都活下来，到了船舱里有的是时间吵。”\n晓枫走到车斗边缘，朝雪伊伸出了手：\n“下车，雪伊。把眼泪擦了，去帮后勤队抬担架。我们欠他们的命，活着才能想办法还。”\n雪伊咬破了嘴角，一把拍开晓枫的手，自己一个人抓着栏杆跳下了车，摇摇晃晃地朝登船的舷梯走去。"
PAU.12.a: "“去核对登船名单，一个名字都不许漏。”"

PAU_jjka: "紧急靠岸"
PAU_jjka_desc: "谁也没料到死灵会从几百米深的海底浮上来。船的尾舵被水下的断木撞坏了，海水直往轮机舱里灌，凭这副破损的船体根本不可能横穿大洋。顺着航标灯的指引，船队只能拐进圣杯王国设在孤岛上的前哨站。那里的港务官咬死规章不松口，硬要扣下货舱里五成的粮食和燃油当作停泊税。为了给舱里的伤员争取抢修时间，只能咬着牙认下这笔盘剥。"

PAU.13.t: "海关印章"
PAU.13.d: "船底传来第一声闷响的时候，所有人都以为只是撞上了暗礁。\n紧接着，第二声、第三声剧烈的撞击连着震翻了底舱的好几桶柴油，海水混着水草从破损的甲板缝隙里涌了上来。\n探照灯的光柱扫向海面，水下浮上来的全是被海水泡烂了的肢体，密密麻麻缠在断裂的沉船残骸上。几具膨胀变形的骷髅抓着船舷的排水孔，正顺着锚链往上爬。\n在大家的认知里，死灵只是一群在泥潭里行军的陆地怪物。谁也想不到索拉娜的尸潮早就顺着海底海沟，蔓延到了大洋深处。\n两艘护航舰开炮打碎了水下的骨架，但船的尾舵已经被撞烂了，轮机舱进水，根本不可能支撑到海对面。\n清晨时分，受损的船队只能跟着引航灯，拐进了圣杯王国设在近海孤岛上的巡防基地。\n港口里停着两艘巡逻舰，高音喇叭里传来带口音的严肃警告：\n“未经通报的武装船只，立刻停机下锚。甲板上所有人员举起双手，接受卫生检疫。”\n晓枫扶着被海水打湿的舷梯扶手，朝岸上的哨塔抬了抬下巴：“这是圣杯在南大西洋的补给点，这里的军官认章不认人。”\n一名穿着海军常服的圣杯军官带着随从走上了跳板。他手里拿着文件夹，目光扫过甲板上士兵和wei伤员，平淡地宣读道：\n“你们的船体有严重的生物污染痕迹，发动机也在漏油。按港口条例，我必须拒绝这批未经许可的武装难民入港。”\n我正想上前拿货单跟他扯皮，站在身后的遥已经快步挤到了我身前。\n她解开风衣领口的扣子，亮出内衬上那枚刻着樱花的金属印记，同时将一份盖着鲜红钢印的公函递到了圣杯军官面前。\n“我是樱花派遣的随船全权代表遥。”她的语气带着不容置疑的正式腔调，“这几艘船登记在樱花海军的临时护航名录下，船上的人员属于受保护的技术雇工。”\n圣杯军官简单扫了一眼那枚印章，仿佛早已有所预料一般立马换了一副说辞：\n“既然持有正规使节公函，港口可以按避难条约为你们提供船坞与消杀药品。但入港税照旧，我们需要征收货舱里五成的面粉，以及装载的柴油。”\n这无异于趁火打劫，那些粮食是我们拼了命才从仓库里拖出来的。\n坐在舱门边给伤员包扎的雪伊停下了手里的绑带，她听见对方开出的条件，肩膀颤动了一下，最后只是咬住嘴唇，低头继续给伤员包扎。\n“可以，按你们的规矩办。”遥在停泊单上签下名字，把文件递还给了军官，“请立刻接通岸上的维修电缆，安排伤员进消杀棚。”\n军官收好单据，行了个标准的军礼，挥手示意岸上的码头工人准备吊装。\n晓枫靠在栏杆边，看着岸上高高挂着的圣杯旗帜，低声说了句：\n“至少……大家暂时不用沉进海底喂鱼了。”"
PAU.13.a: "“下锚，抓紧时间抢修发动机。”"


PAU_wcka: "无处靠岸"
PAU_wcka_desc: "拿口粮换来的停泊许可撑不了几天，樱花那边传来的消息更是直接断了大家的念想。两艘坏了舵的货轮根本开不回大陆，继续往前又是军警把守的死胡同。几千名兄弟姐妹还在舱底等着出发的口令，我们必须在这座异国港口里拿出一个交代。"

PAU.14.t: "电波中断时"
PAU.14.d: "小果子把耳机紧紧贴在耳边，回过头看着我们，带着快要哭出来的腔调：\n“遥姐姐……广播里反反复复都在放军乐，报出来的都是被捕的名单，码头工会那边根本没人回话呀……”\n晓枫直接把那份文件推到了遥的眼皮底下：\n“印章属于几年前就被取缔的救济会，樱花根本没派过所谓的使节。这支船队到底是谁调来的？”\n我盯着桌对面的少女，省去了所有客套：\n“所以，你带着我们在山道上拼命，又割掉一半口粮给圣杯交税，结果海对面的码头我们根本靠不上去，没错吧？”\n遥迎着我的视线，神情变得严肃了起来。\n“对，是我搞砸了。”\n她回答得没有一丝拖泥带水。\n“军部突然发动了政变，我们在那边的据点几天内被拔得一干二净。工人们赤手空拳，在刺刀面前根本撑不住多少时间……”\n她深吸了一口气，语气带着一股少有的执拗：\n“我看过你们在南美的战报。你们有打过硬仗的老兵，晓枫懂全盘调度，工人们能就地抢修机床。我们那边黑得看不见路，我必须把你们带回去。”\n“所以你就拿我们的命去赌？”我看着她。\n“是。”\n遥连眉头都没皱一下：\n“我算准了你们缺油缺粮，借了你们突围的势头。但我高估了家乡同伴能撑住的时间。这是我的自作聪明，账算在我头上。要是想拿我去换补给或者向谁交差，我认罚，不躲也不还手。”\n靠在门边换药的雪伊嗤笑了一声：\n“行了，少在这儿演英雄受刑的戏码。当年的王室比你会算计得多，我们还不至于蠢到拿一个小姑娘的脑袋去讨好它们。”\n晓枫顺手把海图摊开在两人中间，打断了空气里的紧绷：\n“用不着把什么罪名都往自己身上揽，小遥。卡卡罗姆那一仗，就算你没来，阿夏为了手底下的活路也会强行借道，我也不可能就此把那里让出去。那是迟早要撞上的坎。”\n晓枫在图纸上用力点了两下：\n“现在的麻烦是，大陆回不去，东进的航线也堵死了。至于你欠我们的，等找到能落脚的地方，再慢慢跟你核对。”"
PAU.14.a: "“我们得重新商量怎么活下去。”"

PAU.15.t: "防波堤下"
PAU.15.d: "我把遥拉到了仓库后方的防波堤拐角，避开屋里其他人的视线，我直接盯着她问：\n“说吧。公函是假的，使节也是编的，你一个小丫头到底是怎么把两艘军舰弄出军港的？”\n遥把头往衣领里缩了缩：\n“我家乡的情况比战报上糟糕得多。工人和学生被军警堵在船厂里，大家凑了最后的重油，用命做掩护让我们把这两艘船开出来，他们自己留在了岸上……”\n她说着很急躁，语速越来越快：\n“我们真的太缺人了——我们需要懂实战的指挥官，需要能对付装甲战车的炮手，需要……”\n“停停停，打住。”我直接打断了她，“我没重新问你缺什么。我是问，如果东边的港口早就戒严了，你在大洋上是怎么躲开巡逻船的？还有——”\n我用烟头朝她衣服里指了指：\n“你兜里揣着的那个小猫一样的白毛团子，到底是个什么来头？”\n遥伸手抚摸着那团白色的绒毛，眼神里带着心疼：\n“它叫白夜，是家乡神社里留下来的山灵。军部的人想把它抓去当战争用的武器，同伴们把它偷出来交给了我。”\n她把围巾稍稍拉开，露出那只小白兽疲惫蜷缩的模样：\n“在深海遇到尸潮的时候，是它透支力气护住了船底的龙骨，大家才没直接沉进水里……现在它累得连眼皮都抬不起来了。”\n遥眼眶泛红地看着我：\n“我带着它跑了上万海里，原本以为只要把你们带回去，大家就能一起把家乡的封锁线撕开。我真没想过把你们当枪使……真的。”\n海风吹得烟头明灭不定，几星火沫被卷进了海浪里。\n看着那团微弱起伏的小毛球，以及眼前这个看起来好像可怜兮兮的少女，我掐灭了烟头。\n“行了，别解释了。”我按了按帽檐，“说到底，你跟我们这帮逃难的老兵油子也没什么两样，都是揣着最后一口气到处乱撞的丧家犬罢了。”"
PAU.15.a: "“走吧，回屋里去，看看晓枫她们怎么说。”"

PAU.16.t: "掉转船头"
PAU.16.d: "“把船直接开进老铁厂的排污河道！趁着涨潮把装甲车吊上岸，顺着铁路线直接就能抄那些怪物的后路！”\n我刚推开库房门，雪伊的大嗓门就直接撞了过来。\n晓枫站在几只木箱拼成的桌子前，手里的铅笔在图纸上敲了敲：\n“然后让吃水深的大船在退潮时搁浅在烂泥滩上，大家跳进水里推船吗，雪伊同志？”\n“……晓枫！你能不能少泼点冷水？！”雪伊抓了抓头发，被噎得直瞪眼。\n小果子急忙举手打圆场：\n“晓枫姐，雪伊姐，别吵啦！刚才工区那边的电台又来消息了，工人们把蒸汽锅炉的阀门焊死了，怪物的巡逻队根本冲不进车间呢！”\n我和遥一前一后跨进门槛，看着屋里这副热火朝天的架势。\n“你们不在这儿商量怎么分剩下的口粮，围着地图吵吵什么呢？”\n晓枫抬起头看着我，眼神里透着那股熟悉的敏锐：\n“我们在找登陆点，准备杀回南美。”\n“杀回去？”我拉过凳子坐下，“死灵把整个莉兰迪亚都给吞了，我们这点人开着破船回去当点心？”\n小果子急忙把写满电报码的草稿纸递到了我跟前：\n“才不是送死呢！阿夏你看，索拉娜的尸群根本没在海岸线留守，主力全被王都那边的混战吸引过去了。工区的自卫队夺了军火库，修造厂和车间都还在工友们手里！”\n晓枫用铅笔在沿海几个港口画了个圆圈：\n“索拉娜手里的力量开始失控了。海底下冒出的死灵就是证据，她根本压不住散发出来的死气。内陆确实乱成了一团，但沿海的防御已经空掉了，现在到处都是自发抵抗的工人和逃出来的士兵。”\n话音刚落，雪伊把手里的罐头往桌上一放，咬牙切齿地嚷嚷：\n“在这破岛上给圣杯当孙子交税，等手头的油烧完了也是等死。与其在这儿耗成干尸，不如杀回去把港口抢下来当我们自己的家底！”\n遥靠在桌边，看着地图上圈出的海岸线，苦笑了一下：\n“反正樱花那边已经到处都在抓我了，我连家都没得回。两艘船上的重油只够跑几百海里，与其在大洋上漂成淹死鬼，不如跟你们一起回大陆拼一把。至少船上两门炮还能替你们开路呢。”\n海风顺着门缝吹了进来，把地图的边角吹得哗啦乱响。\n刚才我们还在为了走投无路发愁，这会儿这帮人却已经把炮口瞄准了老家。\n我叹了口气，把帽子重新戴好：\n“真拿你们这帮不怕死的没办法。”\n我转身走向门外：\n“去通知水兵准备起锚，把弹药箱都提前搬上车。”"
PAU.16.a: "“大伙再信自己一次吧”"

PAU_dsyq: "赌上我们的一切，\n刺入深渊"
PAU_dsyq_desc: "离开那片土地的时候，我们是一群丢盔卸甲的逃亡者；\n而现在，翻滚的浪花正把我们推回那座燃烧中的故乡。\n前方的海岸线越来越近，每一门火炮都已经校准完毕……\n\n§R我们，杀回去。§!"

PAU.17.t: "压根没有什么特派员"
PAU.17.d: "我走上货船后甲板的时候，工人们正跟着几名水手把钢缆挂上吊钩，准备把那辆轻型坦克固定在舱口前面。\n遥就蹲在旁边的系缆桩跟前，手里捏着一截铁丝，正低着头帮水手挑出绞盘滑轮里的麻绳碎屑。\n旁边那个年轻水手抹了把脸上的灰，还在小声嘟囔：“遥小姐，下次千万看好白夜，别让它再钻进配电箱了，电缆皮都差点被它当磨牙棒啃烂了。”\n那只小白兽正舒舒服服地趴在遥的膝盖上，懒洋洋地打了个大哈欠。\n我走上前，抬脚踢开脚边挡路的撬棍：“吊臂检修完没有？晓枫在前面核对航标，让我过来确认一下那两门炮的俯仰角和装填速度。”\n水手抬起头看着我，又心虚地瞅了一眼遥，抬手使劲抓了抓后脑勺：\n“这位长官……实话说吧，船上压根就没有正规炮手。眼下掌舵的是被海校开除的士官藤井，我们几个在上船前全是些在底舱铲煤的司炉工。刚才在铁桥开炮掩护，全靠藤井翻着出海前塞在铺盖底下的操典现学现卖的。”\n我手里的航海图差点直接掉在甲板上。\n“……你说什么？”我扭过头瞪着遥。\n遥手里挑麻绳的动作突然停住了。她慢慢抬起脸，干巴巴地笑了两声，眼神飘向了一旁：“哎呀，阿夏长官，别在意这些细节嘛。你看刚才在铁桥那边，炮弹不也挺准地落在北岸了吗？”\n“在矿山地下室里，你跟我说这是樱花议会秘密派来的护航舰队。”我把海图卷成筒，在手心里重重敲了下，“在圣杯补给站，你说工人和学生在船厂等着你带我们回去救命。你现在告诉我，你们连个正经炮手都没有？”\n旁边的水手叹了口气，把油抹布随手丢进铁桶里，干脆替她把底全抖了出来：\n“长官，您就别听遥小姐吹牛了。我们家乡那边虽然闹得凶，但根本没到会派舰队出海的地步。纯粹是军官克扣了我们好几个月的伙食费，后来船厂工人和学生罢工，游行队伍里都是兄弟姐妹的亲戚。军官非逼着我们把船开进内河架机枪朝他们开火。藤井一把扯了领章，带着大家把军官锁进了禁闭室，连夜把两艘船强行开出了海。”\n水手伸手指了指缩在旁边的遥：\n“遥姑娘当时在码头掩护几个学生逃跑，被宪兵追得没路走，顺着缆绳一骨碌滚进了运煤舱。我们每人都背着通缉令，哪里的港口都进不去，只能靠藤井自学的那点看星星认路的本事一路往东漂，想着跑来南美找个地方隐姓埋名混口饭吃。”\n我转过头，面无表情地盯着遥。\n遥把膝盖上的小白兽一把抱进怀里挡住了脸，声音细得跟蚊子哼哼一样：\n“我也没想到……你们南美这边的情况比我们老家还要烂嘛。我刚下船那会儿饿得头晕眼花，顺着公路走，刚好看见你们营地的旗子……想着既然你们有枪又有坦克，我们货船里又有现成的吊臂和空舱，不如把场面撑得大一点，拉着你们一起去仓库抢点柴油……”\n头顶的吊臂发出沉重的嘎吱声，轻型坦克稳稳当当地落进了下层货舱。\n从大清早跑进军营要饭开始，到在桌上煞有介事地画圈、掏出假的公函、甚至编出一整套跨洋特派员的由头……\n我按住被海风吹得冰凉的帽檐，长长地叹气。\n这小丫头嘴里到底还有多少句鬼话是我还没听出来的？"
PAU.17.a: "“去把那本操典拿来，我现在教你们怎么瞄准。”"

PAU.18.t: "既然我们早已无处可逃"
PAU.18.d: "小果子把连着长电线的话筒递到我的面前，眼圈红红地抽噎着：\n“阿夏姐，整个海岸线的波段都接通了……广播里能听见工人们敲击管道的信号，大家都在问是不是有船回来了……”\n驾驶室里站满了人。\n雪伊靠在铁门旁，正低头给怀里的步枪装填弹夹，她那低垂的额头上还沾着机油的污迹；晓枫双手撑着桌沿站在海图台前，目光停留在沿海那些熟悉的工厂名字上；遥把白夜轻轻抱在怀里，那只小白兽安静地贴着她的衣领，身旁那几个来自樱花的年轻水手正握着传令管，等待着最后的坐标。\n这里原本聚集着一群最不可能同行的逃亡者。\n我伸手接过了那个带着体温的手持话筒，按下了侧面的开关。\n全船的广播喇叭与沿海无数部破旧的无线电接收机里，同时响起了温和而平稳的电流声。\n“这里是阿夏。”\n我握着话筒，声音在空旷的舱室里回荡开来：\n“对，就是那个在卡卡罗姆为了抢路向同伴开炮、在铁桥前亲手割断缆绳的阿夏。”\n身边的雪伊手里的动作停了下来，整间驾驶室里安静得只剩下轮机深沉的轰鸣。\n“我们当了太久的雇佣兵。过去这几年里，我们总以为只要手里还紧握着王室给的欠条，只要还能用武器换来下一顿晚饭，就能假装自己是一群没有家园、也不需要家园的游魂。因为害怕承担别人的生死，我们就把冷酷当成清醒；因为害怕被抛下，我们就抢先把昔日的战友丢在身后。”\n我呼出一口气，转过头看向那些穿着油污制服的樱花水手与身旁的同伴们：\n“看看我们脚下的这两艘船吧。这上面的燃油，是樱花的水手们为了不向自己的亲友开火、顶着叛国的罪名抢出来的；这上面的每一发炮弹，也是造船厂的工人们冒着枪林弹雨一箱箱搬进底舱的。而我们这帮原本只想着逃命的懦夫，竟然还厚着脸皮坐在别人的船舱里，做着逃去大洋对岸的美梦。”\n电台的那一头，远方工厂的杂音里隐约传来了微弱的抽泣声。\n“可是啊……在这个世界上，到底哪里才算得上是能安稳睡去的家乡呢？”\n“根本没有那样的地方。只要心里还在为那些留在对岸的名字感到难过，只要我们还在惦记着这片被怪物践踏的土地，就算逃到天涯海角，我们也依然只是一群无家可归的亡魂。”\n我抓紧了话筒，将胸口积压的所有软弱与决意一口气说了出来：\n“既然我们早就无处可逃了——”\n“那么，所有还躲在车间里、高炉下、废墟深处不肯低头的兄弟姐妹们，请你们再多坚持一会儿。”\n“这群做尽了错事的雇佣兵，今天决定把自己的命押在这片土地上。我们带着樱花人民用勇气换来的战舰与火炮，回来接大家回家了！”\n我松开了开关，将话筒稳稳挂回了操作台旁的铁钩上。\n雪伊背过身去小声骂着，语气里却忍不住带着一抹哭腔：\n“真是个无可救药的混蛋……早点这样说不就好了吗。”\n晓枫抬起头看着我，脸上露出了重逢以来最轻松的微笑，轻轻拍了拍海图上的海岸线。\n遥抱着白夜轻快地跳下了木箱，眼里亮晶晶的，转头冲着传令管大声喊道：\n“听到了吧，藤井！全速倒车可从来不是我们这帮叛徒的规矩，把主炮的保险全给我打开！”\n巡防舰的前主炮猛然爆发出耀眼的烈火，呼啸的炮弹划破昏暗的天空，笔直地飞向了海岸线上那片等待着破晓的亡灵废墟。"
PAU.18.a: "“全舰全速推进，我们回家了。”"

PAU.19.t: "明天不用出操了"
PAU.19.d: "我解开靴带把行军靴从脚上脱下来，靴筒里的砂砾哗啦啦倒在地板上，磨得发麻的脚底板终于感受到了凉意。\n原本空旷的王室议事厅里，现在乱糟糟地坐满了伤员和工人们。那几幅绣着家徽的挂毯被樱花水手扯了下来，充当挡风的门帘挂在了炸碎的窗框前。几个司炉工正围在壁炉旁，拿铁条架着几罐肉酱，咕嘟咕嘟地煮着热汤。\n雪伊则直接坐在了原本属于摄政大臣的雕花椅上，撬开一盒浸着糖水的黄桃罐头，用勺子舀出一大块递给旁边的年轻工人。她顺脚把滚到过道当中的镀金烛台踢到了墙根，给抬担架的弟兄腾出了路来。\n晓枫在整幅地图所有的隘口上画满了代表肃清的斜线。画完最后一笔，她把笔往桌上一扔，整个人靠在石柱上闭上眼睛长长舒了口气。\n那些漫山遍野的死灵怪物终于被彻底赶回了地底下，整个莉兰迪亚连同沿海各工区的黑烟一起，迎来了几年以来头一次没有枪炮声的傍晚。\n遥正盘腿坐在一只大木箱上，耐心地把干酪掰成小碎块递到白夜嘴边。那只小白兽吃饱喝足，把湿漉漉的小鼻子蹭在她的手腕上，舒舒服服地打着小呼噜。\n看见我来，她抬起头冲着我招了招手：\n“喂，阿夏长官。城里的怪物打跑了，码头的路也通了。你欠我的货船租金和燃油损耗，现在打算拿什么抵账呀？”\n“挂在账头上吧。”我把另一只靴子里的砂石也倒干净之后，踩着袜子站起身，“明天一早，带上你的水手去泊位集合，跟工人们一起把炸塌的吊车架子抬出来。”\n“哈？！”遥瞪圆了眼睛，气呼呼地嚷道，“我可是把你们从大洋上载回来的大功臣哎！明天难道不该在广场上给我发一枚闪闪的勋章吗？！”\n坐在高背椅上的雪伊嚼着甜桃，毫不客气地笑了一声：\n“少在这儿做美梦了，樱花来的骗子小姐。明天东区铁路线的机车头锅炉要换衬板，你的水手要是敢睡懒觉，后勤班可不给你们留早饭。”\n“谁是骗子啊！藤井他们开船开得可认真了！”\n遥把白夜一把举到脸前抗议，惹得围在炉子旁喝汤的几名战士哄堂大笑。\n大厅里弥漫着肉汤的热气、刺鼻的硝烟味以及湿漉漉的汗味。\n失去了王室的赏钱，失去了冠冕堂皇的册封，大家甚至连一套干净的常服都找不出来。\n但我知道，从今往后，再也不会有人把催命的欠条塞进我们的抽屉，也再没有人能把我们逼进退无可退的绝境了。"
PAU.19.a: "“……大家都辛苦了，今晚好好睡一觉吧。”"

PAU_zhyk: "最后一箱罐头"
PAU_zhyk_desc: "从仓库里拖出来的罐头就剩下最后几箱，等伤员和工人们分完这锅肉汤，后厨的锅底就彻底见光了。城外的麦苗早被死灵践踏成了烂浆，机车库里那几台机车的汽缸也裂了缝。拿惯了步枪的老兵不会摆弄农具，懂车床的工人们又饿得拿不起扳手。要是赶在冬天来前没法让铁厂重新开工、没法把麦子种进地里，大伙儿就算没死在战场上，也得在这座空港里活活饿死。"


PAU.20.t: "船队大改装"
PAU.20.d: "我看着墙上挂着的存粮清单，上面的数字已经被晓枫用红笔划掉了好几遍。\n后勤库房里剩下的面粉只够维持短短几天，地里的麦苗也全被死灵踩成了发黑的泥浆。内陆的运粮道被王室的残部卡死，圣杯王国的军舰又在海湾外头虎视眈眈。要是再弄不到吃的，刚打下来的港口立刻就会变成一座饿殍遍地的死城了。\n正当我头大时，门突然被人用靴子一脚踹了开来。\n遥卷着沾满泥水的裤腿跑了进来，手里还拎着一个木桶。她把木桶往桌上一放，两条银亮的海鱼在水里扑腾出大片水花，溅得海图到处都是。\n“看！海里的大鱼！”遥抹了一把脸上的水珠，眼睛亮得像是在发光，“内陆的土地被死气泡烂了，但外海深水区的鱼群可不知道索拉娜是个什么东西！”\n晓枫抬起头，有些迟疑地指着窗外的海湾：“港里的渔船早就被王室撤退时全烧光了，我们拿什么出海？”\n“谁说要用木头渔船啦？”遥跳到桌边，得意地拍了拍胸口，“藤井他们把货船上的吊臂改成了拖网绞盘，巡防舰前面那两盏高功率探照灯夜里往水里一照，成群的鱼顺着光就往网里钻了！我和水手们试捞了一网，连甲板都差点被压沉了！”\n她从兜里掏出一张画得密密麻麻的草图，直接拍在我和晓枫面前：\n“不仅是打鱼！我让工人们把两辆轻型坦克的炮塔也拆了，换上装卸铲，拿柴油机当牵引车去犁地排水。只要把泥层底下的盐碱翻出来晒透，再掺上炉渣灰，下周就能把耐寒的杂粮种子全播下去！”\n我看着草图上那些歪歪扭扭却详尽无比的机械改装图样，不由得愣住了。\n这个平日里满嘴胡话的异国少女，办起正事来竟然意外得利索。\n“阿夏，别愣着啦！”遥伸手推了推我的胳膊，笑嘻嘻地催促道，“快让你的兵换上干活的衣服，跟工人们一起去海滩拉网吧。今晚全城的人都必须吃上一顿海鲜大餐！”"
PAU.20.a: "“去通知各连队，全员去码头帮水手拉网。”"

PAU_wrcr: "没人承认的土地"
PAU_wrcr_desc: "逃走的王室给各国港口发了通报，把我们打成了霸占沿海的叛乱暴徒。圣杯王国的巡逻船天天在港外游弋，借着防瘟疫的名头把航线封得严严实实。更要命的是，樱花本土那帮新上台的军官在电台里反复播报通缉令，逼藤井把军舰开回去受审，遥的名字更是排在了第一位。对外，我们是一群连出港证明都开不出来的黑户；对内，公社工人、军团溃兵和樱花逃兵全挤在同一个港口里。大家到底算是一支军队还是一个新政权，谁也没法给出一个定论。"

PAU.21.t: "站在弹药箱上的外乡人"
PAU.21.d: "中央广场的粮站门前突然传来了一阵剧烈的推搡声。\n一名脸上带疤的雇佣军老兵被几名年轻的铁道工人围在墙角，地上的面粉袋被踩破了一个大口子，面粉跟着撒了一地。\n“你们这帮以前给王室当看门狗的刽子手！”领头的工人眼里装满了仇恨，紧握着撬棍大声怒骂，“我哥哥就是死在卡卡罗姆的阻击线上的！你们凭什么跟我们分一样多的干粮？！”\n老兵的脸色变了，手不由自主地摸向了腰间的武装带。周围原本正在排队的溃兵和工人们迅速分成了两派，各自抄起身旁的铁锹与短枪，空气里的火药味一下子顶到了头。\n我和晓枫正准备带卫队过去压制，一个娇小的身影却抢先一步冲进了人堆。\n遥跳上了一只倒扣的木头弹药箱上，抬手一挥，手里的短刀直接插在两伙人中间的木桩上，发出一声清脆的震颤。\n“都给我把手里的家伙放下！”\n人群安静了一瞬，随即爆发出一声更加刺耳的讥讽：\n“喂，樱花来的丫头！你算什么东西，也配在这里站着？”\n一个满脸刀疤的老工人大声质问道：\n“你不过是个从大洋对面逃难过来的外乡人！连你自己老家的船厂都没守住，把我们骗上船到处挨饿，你有什么资格在这片土地上指手画脚？！”\n周围的人群里响起了一阵窃窃私语，怀疑的目光利箭一样射向了台上的少女。\n换作平日，遥早就嬉皮笑脸地糊弄过去了。但这一次，她站在高处迎着所有人的目光，用坚决的声音说道：\n“对，你说得一点都没错。”\n她看着那个老工人，像是在念一封公开信一样：\n“我是个逃难者。在樱花本土，我连自己朋友的工会都没护住，只能像老鼠一样躲在运煤舱里跨过大洋。我比你们任何人都更清楚失败是什么滋味。”\nn她抬手指向码头停靠的货船：\n“但我身后的这帮樱花水手，为了不把机枪对准自己罢工的亲友，宁可背上叛国罪名流亡大洋！我们这帮一无所有的外乡人都知道不能把枪口对着自家人，你们这群刚刚在死人堆里并肩活下来的同胞，现在居然要为了谁前几天吃过谁的亏，在这里争这一袋面粉？！”\n原本叫嚣的工人慢慢低下了头。\n遥从木箱上跳下来，一把拔出柱子上的短刀：\n“你们想清算旧怨？好啊！去跟山里那些克扣你们工钱的贵族算，去跟地底下的死灵怪物算！在这座城里，今天谁愿意拿起铁锹去修水渠，谁就是这片土地真正的主人；谁要是还想着把枪口对准身边的兄弟姐妹，谁才是这片土地上多余的外人！”\n雪伊从人群后方默默走了出来。她捡起地上面粉袋拍掉灰，将一整袋面粉塞进了那名老兵怀里，随后把一把铁锹递给了领头的工人：\n“听到了没有？外乡来的小姑娘都把话说得这么透了，还不嫌丢人吗？拿着铁锹，干活去。”\n老兵抱着面粉愣在原地，对面的年轻工人咬了咬牙默默接过铁锹，转身走向了排水渠。\n人群慢慢散开，排队的队伍重新恢复了秩序。\n遥一溜小跑回到我面前，仰头朝我眨了眨眼：\n“阿夏长官，刚才我表现得威风吧？今天的烤鱼能不能给我多分几条？”"
PAU.21.a: "“看来以后真得给她发薪水了。”"

PAU_tyzz: "同一张桌子"
PAU_tyzz_desc: "从王宫里搬出来的大会议桌被工人们合力抬进了车库。雪伊带着工会代表占了桌子左边，阿夏手底下的老兵把步枪卸在门旁、规规矩矩地坐在对面，晓枫把新拟定的配给条例摊在了正中央。藤井和几个樱花水手原本有些拘谨地挤在桌尾，直到遥抱着白夜一屁股坐上桌角，大声宣布他们这帮外乡人也要按期领工资才放松了不少。防线轮流站岗，厂里三班倒换，每一袋粮食和每一箱子弹的去向都公开举手表决。用这几张盖满手印的草纸，大家定下了以后的规矩。"

PAU_mzyy: "埋葬夜莺"
PAU_mzyy_desc: "在过去漫长的岁月里，死灵的低语从群山一直蔓延到了海边，把原本繁荣的集镇与工矿变成了亡魂游荡的空城。既然带来灾祸的王室已经瓦解，死灵的源头也已被彻底斩断，我们就没道理再让阴影继续笼罩在这片土地上。死者理应归于安息，生者必须向前迈步。这场纠缠了所有人数年的噩梦，该由我们亲手画上句号了。"

PAU.22.t: "她们不会再出来了"
PAU.22.d: "雪伊一脚把那扇嵌着玻璃的大门踹开，手里的步枪直接顶上了膛。\n“索拉娜！滚出来受死！”\n这间屋里弥漫着一股刺鼻的苦草药味和焦糊的臭气，索拉娜就歪在窗边一张藤椅上，她的两只手腕裹着渗血的布条，整个人瘦得颧骨高高凸起。莉莉安娜正坐在旁边的凳子上，手里拿着一把掉光了漆的木梳，一下一下替她理着打结的头发。\n听到踹门的巨响，索拉娜猛地抽搐了一下。她挣扎着想从椅子上站起来，膝盖却一软，重重栽回了椅垫里。\n“叫什么叫……”索拉娜咳出一口血沫，恶狠狠地瞪着我们，“工会的泥腿子……带枪进来了不起啊？往脑门上打，老子要是眨一下眼睛就不算活过！”\n雪伊枪口直接顶到了索拉娜额前，牙齿咬得咯吱作响：\n“厂里死掉的几十号工人，还有铁桥对岸没能爬过来的那些兄弟姐妹……你今天必须拿命赔给他们！”\n晓枫快步走上前，伸手翻开桌面上那些散落的草图和满是血迹的撤退命令，随即看到了索拉娜垂在身侧那条焦黑溃烂的手臂。\n“雪伊，先把枪放下来。”晓枫的声音绷得很紧。\n“凭什么？！”雪伊头也不回地怒吼，“她是罪魁祸首！”\n“她在后面根本就指挥不动那帮怪物。”晓枫把手里那叠被血浸透的军令扔在了桌上，“在沿海公路撤退那会儿我就觉得不对劲，那些死灵连王室自己的车队都砸，港口外面的水鬼更是连运粮船一起拖进海底……她自己早就被力量反噬烧毁了。后来的仗，她自己都是被失控的死灵一路追杀逃进这间屋子的。”\n索拉娜嘴里却还在硬撑：“晓枫……少在这儿装什么明白人……是我抢了心脏，是我把这片地变成这样的，你们开枪啊！”\n莉莉安娜默默从兜里摸出一块糖，塞进索拉娜吵闹的嘴里，还顺手替她把滑落的毛毯拉到了脖子底下。\n索拉娜被突如其来糖块噎住，终于没力气再嚷嚷了。\n雪伊抓着枪托的手青筋暴起，枪口随着胸口剧烈起伏：\n“就算她被反噬了又怎么样？！死掉的那些人就能活过来吗？！”\n“不能。”\n我走上前，伸手把雪伊的枪管慢慢按了下去：\n“但你现在把她打成筛子，除了把旁边那个神仙惹毛、把这片地再炸平一次，换不来一斤面粉，也修不好铁道上的火车。”\n雪伊咬着牙盯着藤椅上那个快断气的废人，最后狠狠啐了一口唾沫在地上，收回了步枪。\n莉莉安娜重新坐回凳子上，伸手握住了索拉娜那只烂手，说道：\n“心脏……我已经收回来了。索拉娜她……现在连路都走不动，闹不了多久了。这里的门我会关上的，你们…走吧……”\n“走了，雪伊。”我拉下帽檐，转身往外走去，“通报上写索拉娜在城破时死在反噬里了就行。莉兰迪亚还有几万张嘴等着吃饭，没工夫把时间烂在这间屋子里。”"
PAU.22.a: "“把门锁好，别再让她跑出来了。”"


PAU_gxzp: "挂上新招牌"
PAU_gxzp_desc: "临时评议会的几张破桌子已经没法应付一整座运转起来的国家了。工矿要核算产出，港口要拟定关税，原本靠战时口粮维系的秩序必须尽快落实为明文法典。昔日的雇佣军与公社的工人们虽然坐进了同一栋楼里办公，彼此投来的目光却依旧带着审视与提防。在真正的大选到来之前，这个拼凑起来的政权全靠战火里残留的默契在勉强支撑。"

PAU.23.t: "印章该交给谁"
PAU.23.d: "我把手里的笔扔在桌上的时候，笔尖直接滚进了两叠文件堆中间。\n左边是雪伊递上来的公社请愿书，上面密密麻麻签满了工人和铁道员的名字，要求立刻收缴军团的一切重武器，将市政防务全权交由工厂自卫队接管；右边则是跟着我从烂泥地里一路杀出来的老兵们的请愿书，这帮浑身刀疤的军官措辞强硬，坚决要求保留军团的独立薪饷与防区，不接受任何公社干部的指手画脚。\n这两叠纸像两座大山一样压在桌子两头，中间摆着那枚刚刚刻好的临时执政印章。\n从当年在艾瑞波拉为了一口粮食替王室卖命，到在大洋上逃命、带着车队杀回莉兰迪亚，我已经记不清自己有多少个月没脱下过靴子睡觉了。工人们对我这个昔日的雇佣军头子始终充满戒心，我自己也清楚，我根本不是个懂得治理国家的材料。\n这种坐在高位上的无力感，比被机枪压在泥坑里还要让人透不过气。\n“怎么，阿夏长官，这就打算撂挑子逃跑了？”\n遥端着一杯刚泡好的热茶从门外溜了进来，大大咧咧地靠在文件柜旁，怀里的白夜正探着脑袋去嗅着桌上的墨水瓶。\n我按着额头说道：\n“公社那边有雪伊带着工人支持，又有晓枫在做全盘规划。工人们本来就只认她们两个，对我这个开过炮的军官防得像防贼一样。我把这枚印章交出去，让公社名正言顺地接管政权，不是皆大欢喜吗？”\n“你真把印章交出去试试看啊。”遥放下茶杯，收起了平时的玩笑神气，直截了当地把话挑明了，“你信不信你今天上午交出权力，下午工人和卫队就能在广场上拔枪对射？”\n我手上的动作停住了。\n“雪伊的脾气太冲，她眼里容不得军队的一点沙子，要是让她掌权，第二天就会下令缴了老兵们的枪，你手底下的兵痞肯定立刻炸营；至于晓枫……虽然她懂大局，也懂怎么带兵，但在你那些老部下眼里，晓枫当年是抛弃军团退进山里的‘叛徒’。你把政权交给她，老兵们只会觉得是你这个老长官出卖了他们，把军队打包送给了公社。”\n遥伸手敲了敲桌上那枚冰凉的铜印，直直看着我：\n“你一旦撒手，老兵们没了主心骨，立刻就会把公社当成要砸他们饭碗的仇敌，到时候谁也拦不住他们在大街上兵变。”\n门外隐约传来老兵卫队换岗的皮靴声，伴随着远处工厂汽笛沉闷的鸣响。\n我抓起桌角那枚铜印，整个人疲惫地陷进了椅背。\n想放放不下，想退退不掉。"
PAU.23.a: "“去把雪伊和晓枫叫进来，我们继续开会。”"

PAU.24.t: "我不是什么神仙"
PAU.24.d: "雪伊把一份工会的抗议公文重重拍在桌面上，震得茶杯里的水溅了一桌。\n“阿夏！卫队今天上午又把东区的运煤车扣了！”雪伊撑在桌沿上大声质问，“这是原则问题！工会不可能接受军队骑在工人头上，你今天必须下令把那几个带头扣车的营长关禁闭，让他们公开向工会道歉！”\n坐在对面的晓枫把整份调度案推到了我面前，用那种近乎冷酷的语气开口：\n“雪伊，现在不是讲原则的时候。阿夏，看看这张排期表。如果不把港口的警备范围和工会的管辖边界切分清楚，明天上午电厂的储煤量就会归零。我拟了几套折中方案，每一套都需要你用执政官的名义强行签发。行政机构不能停摆下去了，你必须现在挑一个盖章。”\n“晓枫！你这叫什么折中？！”雪伊扭头怒喝，“你这是在各打五十大板和稀泥！”\n“我不在乎谁吃亏谁占便宜，我只在乎这栋大楼下周还能不能点得起灯。”晓枫抬起那双锐利的眼睛看着我，用笔笃笃地敲着纸面，“阿夏，拍板是你的职责。别拖延下去了，把主意拿起来。”\n一边是雪伊带着满腔仇恨与原则的怒吼，另一边是晓枫算尽了每一吨煤和每一条法令的精密表格。\n两个人一左一右，像两台严丝合缝的机器，把堆积如山的难题全往我脸上碾压过来。\n太阳穴里的青筋在疯了一样突突乱跳。\n我抓起桌上那枚铜印，用尽全身的力气砸在文件正当中。\n咚的一声巨响，印章砸翻了水杯，茶水瞬间把桌上的表格和公文全泡成了一团糟。我身后的椅子随着站起身动作向后翻倒，重重砸在了地面上。\n“都给我闭嘴！！”\n整间屋子瞬间鸦雀无声。\n我把憋了几个月的憋屈全吼了出来：\n“你们到底当我是个什么东西？！我是个会变戏法的神仙吗？！”\n雪伊和晓枫闻言都僵在了原地。\n“当年在烂地里要找饭吃的是我，在卡卡罗姆下令开炮被你们骂成刽子手的是我，在断桥前割断缆绳当恶人的也是我！”\n我指着自己的鼻子用颤抖的声音说道：\n“雪伊！你张嘴闭嘴就是原则与公道，要我当个替所有人平反的圣人；晓枫！你张嘴闭嘴就是职责与运转，拿着这些破表格把我当成连轴转的机器！”\n“现在仗打完了，你们要建新世界，要搞大同公社，结果呢？一遇到理不清的麻烦，都跑来塞到我脸上逼我负责！”\n“老兵们怕饿死找我哭诉，工人们受了委屈找我讨公道！你们两边互相防得像防贼一样，又都把绳子套在我脖子上，逼着我一个人把这架破车往前拉！”\n“我懂什么税率？！我懂什么治安条例？！我就是个只懂带着弟兄们保命的兵痞！我每天晚上闭上眼睛，耳朵里全是在阵地上被炸烂的动静！”\n“你们嫌我是军团的头儿，又非逼着我坐在这儿给你们当判官……你说我到底该怎么判？！”\n屋里一片死寂，只有我粗重的喘息声在墙壁间回荡。\n原本坐在柜子旁的遥悄悄抱紧了怀里的白夜，低着头一声不吭。\n我跌坐回椅子里，按住剧痛的额头闭上了眼睛。\n“印章就在桌上。”\n“你们谁有本事谁拿去管。”"
PAU.24.a: "“老娘不干了！”"

PAU.25.t: "外乡人"
PAU.25.d: "我抱着双手闭上眼睛靠在椅背上，打定主意一个字也不会再签了。\n雪伊拉开椅子脸色阴沉地抓着扶手重重坐下：“阿夏不肯管，工会就绝对不会答应把东区货栈让给军队，卫队要是敢强占，今晚工人们就上街筑垒。”\n“街垒一筑起来，全城的物资调配立刻就会瘫痪的，雪伊。”晓枫直视着雪伊，“另外，雪伊，你很清楚我为什么不能接手。在老兵眼里，我是当年带头脱离军团的游击队头子；而在工会眼里，我又总在为了大局物资逼你们向军队妥协。我们这些人身上的旧仇太多了，谁坐上去，底下都会有人觉得是在被仇敌统治。”\n晓枫转过脸，视线穿过满地的纸屑，径直投向了靠在文件柜旁边的那个角落。\n遥蹲在凳子上，手里拿着一条烤干的咸鱼，正一点点撕成细条喂给膝盖上的白夜。察觉到屋里的死寂，她撕鱼肉的手动作一僵。\n“但要是让那个连自己老家都回不去的外乡丫头坐上去呢？”晓枫开口说道。\n雪伊愣了一下，随即像是听到了天大的笑话一样猛站起身：\n“她？！晓枫你疯了吗？！当初就是她在矿山地下室里满嘴鬼话，骗着阿夏把卡卡罗姆的防线轰开，又把我们所有人骗上那两艘破船到处逃命！她惹出来的祸还不够多吗？！”\n“正因为这祸是她惹出来的，所以必须由她来坐这个位置。”\n晓枫继续说道：\n“她骗了阿夏的军队替她开路，但也带来了撤走伤员的货船；她强行把我们从山里逼了出来，但也帮着工会在铁桥前打退了怪物。”\n“她欠了驻军的债，因为她把老兵当成了抢油料的枪使；她同样欠了工会的债，因为她把大家逼进了大洋上的绝路。正因为她两头都欠着还不清的账，她坐在这个位置上才哪边都偏袒不了”\n晓枫指了指窗外的海港方向：\n“更何况，港口里的两艘军舰，以及天天出海拉网带回鲜鱼的水手，都只听她一个人的。老兵和公会谁也没法一口吞下她手里的海防力量。”\n晓枫看着缩在柜子旁的少女：\n“她是个被海对面通缉的流亡者，在本地没宗派，没旧部，更没有能任她调遣的私人军队。她想活下去，就只能逼着我们两边坐在同一张桌子上。”\n雪伊靠在椅背上，盯着那个还捏着鱼干的少女，沉默了好一阵子，最后还是有些别扭地吐出气来：\n“……在广场上，她确实敢站出来把老兵和工人骂醒。比起我们这帮被旧仇绑死的人，这个满嘴跑火车的骗子确实没沾过本地内战的血。”\n被三道目光齐刷刷盯住的遥终于坐不住了。她把白夜一把抱进怀里，整个人往文件柜后面缩去，急赤白脸地嚷嚷起来：\n“喂！你们三个疯了吗？！我当时撒谎是为了找饭吃！你们现在把这么大个烂摊子往我头上扣，是嫌我还不够惹人嫌吗？！”\n我伸出手把泡在茶水里的铜印捡了起来，在袖口上擦干了水渍，随后一把推到了长桌正中央。\n“当初是你把我们从烂坑里忽悠出来的。”我看着她那副慌张的模样，不禁扬起了嘴角，“既然这出大戏是你开的头，那就老老实实坐上台，把剩下的麻烦给我们摆平。”"
PAU.25.a: "“恭喜你，春日小遥执政官。”"

PAU_gydj: "各押一份定金"
PAU_gydj_desc: "遥坐上执政官椅子的第一天，根本没去写什么冠冕堂皇的宪章。她把雪伊、阿夏和晓枫直接拽进后厨，指着冒着热气的灶台定下了规矩：军团老兵负责外围防线和重工业开采，但他们的口粮配额必须由公社工会每日签字；工会全面接管市政运作与车间，但治安巡逻必须由一名老兵带着一名工人共同执勤；而水手们带回来的鲜鱼和煤炭，则由港务局按人头平价分发。\n遥把这套把戏叫做“押定金”。大家用不着装出一副亲如一家的和气模样，但谁要是敢私下里动歪心思，另外两方会在一个小时内彻底掐断他的饭碗。在这座千疮百孔的城市里，这种赤裸裸的利益捆绑，反倒成了最牢不可破的平衡。"


PAU_msbf: "莉兰迪亚避风港"
PAU_msbf_desc: "因为先前亡灵的躁动，圣杯王国在海湾外头拉起了防疫警戒线，海对面的樱花军部通缉令也天天在电台里播报着遥她们的罪行。既然正经的外交途径全被堵死了，遥索性把大洋对面那些对付黑市巡警的手段搬到了南大西洋。\n她让工人们修好了老码头的深水泊位，在灯塔上挂起大灯，公开向公海上所有来历不明的货船发出信号：莉兰迪亚提供全大洋最便宜的修船船坞、不收重税的燃油补给，以及装满底舱的优质咸鱼。挂着各国旗帜的走私商人和私掠船队顶着圣杯海军的白眼，纷纷把航线拐进了我们的海湾。在巡防舰黑洞洞的炮口注视下，这片被正统帝国视为法外之地的海港，硬生生被遥盘成了一个谁也舍不得开炮轰平的灰色商埠。"

PAU_bzwtp: "别指望能谈判"
PAU_bzwtp_desc: "西边山口传回来的哨报一次比一次诡异。阿德莱希那边盘踞着的根本不是讲人话的军队，它们是一群长着多余肢体、披着烂皮在废墟里嚎叫的怪物。我们刚从死灵嘴里抢回一口气，就绝对不能再让这种莫名其妙的脏东西漫过我们的边境线。既然侦察兵连一句能听懂的交涉口音都找不出来，那就省去所有外交试探。把大炮和地雷都填进关口的工事里，只要有长着怪模样的东西靠近边境的铁丝网，直接开火。"

PAU_mfsn: "那些魔法少女"
PAU_mfsn_desc: "前沿哨所发回来的报告荒唐得像醉汉编出来的故事。南北边那片被称作魔法少女联盟的领地里，据守防线的竟然是一群穿着花哨的裙子、手里拿着发光的……呃…某种高科技机械还是什么东西，和老式长枪的小姑娘。老兵们一开始全当成了笑话，直到侦察队亲眼看见那些女孩用古怪的光芒把袭扰的怪物轰成了碎渣。虽然搞不清她们那套力量是从哪儿来的，但至少对方还能讲通用语，也没表现出吃人的恶习。先派人接通电台试着打探虚实，但在彻底摸清这帮神秘邻居的脾气之前，哨卡上的机枪保险谁也不准关上。"

PAU_sbtxd: "听说圣杯来了个探险队？"
PAU_sbtxd_desc: "根据遥截获的电台消息，进驻在亚马逊河口的圣杯远征军，正是当初在海岛上逼我们交出大量面粉和柴油的那帮海军的同行。这群穿着盔甲的老爷在大洋上颠簸了几个月，对外宣称是要开进原始雨林寻找失落遗迹，顺便清理沼泽里盘踞的大蜥蜴。遥甩出一张缴获的探险路线图，笑得差点从椅子上滑下去：“谁会大老远跨过大洋专门跑来抓蜥蜴啊？这帮老爷八成是盯上了林子里的金矿和木材。”\n不过玩笑归玩笑，对方那些满载火炮的护航舰确实停在下游水道上。按照遥的盘算，既然当年我们在海岛上挨了他们的盘剥，现在正好倒过来向他们高价推销砍刀、咸鱼和退烧药，顺带让他们在深林前线充当阻挡阿德莱希那群怪物的免费盾牌；但要是这群探险家敢借着由头让炮口对准沿河工区，我们也随时准备教教他们，到底谁才是这片雨林真正的主人。"

PAU.26.t: "既然都在防线上"
PAU.26.d: "通信机里跳出了一个此前从未监听过的固定频段，几声清脆的按键声过后，传出一个带着关西口音的年轻女声：\n“我是莉兰迪亚的临时执政官春日小遥。各位魔法少女指挥官，占用几分钟频率。”\n信号那头的声音很平稳，背景里还隐约能听见机床冲压铁皮的哐当声：\n“前沿哨兵前几天发回了你们跟那些……是魔女还是什么来着……交火的战况。总之在如今这个秩序碎成渣的大陆上，看到年纪比我们车间学徒还小的女孩端起武器顶在最前面，没人会觉得这是什么童话。大家心里都清楚，你们身后肯定也有哪怕丢了命也想护住的人。”\n通讯那头传来翻动纸张的声响：\n“我们手里有刚出炉的优质钢轨、成箱的口粮，以及能连夜抢修火炮的技工；你们在前线有压制怪物的强悍火力。既然大家都在为了让身后的平民能吃上一顿饱饭而搏命，就用不着隔着树林互相拿枪口瞄着对方。只要你们愿意把边境的通道打开，我们可以在莉兰迪亚筑起重炮掩体替你们分担阿德莱希那群怪物压力，甚至直接组建联合防务，一起把日子过下去。”"
PAU.26.a: "“我们需要能并肩作战的伙伴。”"
PAU.26.b: "“防线各自留个照应就好。”"

PAU.27.t: "找蜥蜴总得先吃饱饭"
PAU.27.d: "一艘悬挂着双色信号旗的小型汽艇在警戒水域外停下，艇上的扬声器直接向远征军的旗舰播放了一段清晰的明码录音：\n“圣杯王国的远征军指挥官阁下，日安。”\n“我是接管莉兰迪亚港口的春日小遥。我们对贵国的行事章程并不陌生，毕竟不久前你们海岛上的驻军同行才刚按照战时条例，收了我们好大一笔靠港物资，所以贵方的价目表我们心里有数。”\n录音那头传来一声笑声，接着是茶杯磕在桌面上的轻响：\n“听说诸位贵族军官千里迢迢开进亚马逊，是为了寻找失落遗迹，顺便扫荡沼泽里的大蜥蜴。我们对你们抓爬行动物的兴趣不作评价，但雨林里的恶性疟疾和无底泥潭，可不会因为各位穿着精良盔甲就手下留情。”\n“我们手里有足量的奎宁药品、砍刀和能修护航舰的干船坞。只要你们承认莉兰迪亚的河道管辖权，大家完全可以搭伙签个互助协议，由我们的巡防舰替你们守住下游退路；当然，如果诸位的枪口打算往我们的工厂挪……那这片复杂的水网可比大洋上的孤岛难走得多。"
PAU.27.a: "“我们没必要在雨林里多树一个敌人。”"
PAU.27.b: "“给舰炮装填穿甲弹，远征军从不向流民低头。”"

PAU_zxd: "那就演到最后"
PAU_zxd_desc: "当初在营地栅栏前面，我只是饿得头晕眼花，随口编了个特派员的名头想蹭碗菜汤喝。后来带着你们抢车、夺路、跨洋逃命，我也只想找个没人管的角落躲起来，能多喘一口气就算赚到。\n结果阿夏将防务交给我，雪伊让工会跟着我，晓枫甚至连撤退的借口都替我堵死了。你们这帮家伙明知道我是个连老家都回不去的逃亡者，却硬生生按着我的肩膀，让我坐在这间天天被麻烦事塞满的办公室里。\n我以前总觉得，只要脚底抹油跑得够快，厄运就追不上我。可直到今天我才明白，人越是一味逃跑，身边能站立的地方就越小。\n看看西边山口那些长着怪模样的东西吧，它们可听不懂什么叫公约，更不会给我们留第三次逃命的港口。既然你们这帮人非要将性命押在我这个满嘴谎话的家伙身上，既然我已经坐上了这个执政官的位置——\n那就谁也别想再往后退缩一步。\n传令兵，去拉响战斗警报。我以莉兰迪亚执政官的名义下令：各部队全线出击，碾碎阿德莱希！"

PAU_sztytz: "我们谁也别想置身事外"
PAU_sztytz_desc: "阿德莱希的怪胎虽然被打退了，但大洋对面的世界乱成了什么样，大家心里都有数。圣杯远征军的诸位，你们自称代表着海对面的民主与法治，可你们心里比谁都清楚——大洋对面的议会老爷们每次换届选举，削减的都是你们前线的弹药与津贴。你们离家几千海里，一旦海外局势恶化，没有哪张选票会渡海来救你们这些驻军和移民，你们早晚会被那套冷冰冰的法条变成异乡的弃卒；而南边的魔法少女们，你们到底打算一个人替这片土地挡多少次灾？世人将你们奉为奇迹的化身，转头又畏惧你们的力量，让几个十几岁的姑娘在泥水里流血拼命，这算哪门子的理所当然啊？！你们需要真正的学校、能造装甲的工厂，以及替你们分担枪炮的同伴，而不是无休止地透支下去直到崩溃；至于那些躲在市镇里紧闭大门看戏的势力，你们真以为外面乱套了，自家的木头栅栏能顶得住什么？\n我不跟你们讲什么崇高的大道理，更不想给谁当说教的老师。我只想告诉各位：大洋对面的旧秩序已经沉底了，这片大陆就是最后能落脚的甲板。\n圣杯出造船技术与海军编制，公社出钢铁、车床和弹药，魔法少女得到正规的后勤与医疗保障，我们把防线与资源彻底合并，建一个谁也啃不动的联合政体。这叫按股入伙，大家一起保住吃饭睡觉的权利。\n至于那些到现在还打着各自私心、企图置身事外的家伙，我的规矩也很简单——既然要搭伙过日子，我就不能留着几个随时会引爆防线的隐患。要么带着你们的物资坐下来签字，要么，莉兰迪亚的装甲连队就直接开进你们的公署，替你们把字签了。"

PAU.28.t: "莉兰迪亚的通告"
PAU.28.d: "通告里的内容简单到了近乎粗暴的地步：莉兰迪亚要求沿途所有独立国家和武装据点在当天日落前作出抉择，要么交出防区图纸与物资名册，推选代表加入统一的联合评议会，共同统合防线与工业；要么就作为阻碍南美大陆统一的顽固阻碍，等待后续火炮部队的物理清除。\n驻守阵地的军官与镇上的代表们正争论得不可开交。强硬派认为这是赤裸裸的武力兼并，主张依托工事顽抗到底；但更多看着库房见底的粮秣员与伤员却很清楚，对面的政权确实拿出了实打实的工业品与口粮，而且对方根本没打算给任何人留下观望拖延的余地。"
PAU.28.a: "加入莉兰迪亚的联合政权。"
PAU.28.b: "谁也别想强占我们的地盘！"

PAU_xkst: "我们得先开几家食堂"
PAU_xkst_desc: "刚将南美的地图拼整齐，底下的麻烦就一窝蜂涌了上来。圣杯的移民嫌工厂的工人粗鲁，老兵们看着魔法少女发怵，而那些十几岁的姑娘则习惯了缩在角落里戒备所有人。\n在樱花老家的时候，每次港区闹罢工或者街坊邻里扯皮，那些精明的町内会长总喜欢拉着两边去路边摊吃汤面。我照葫芦画瓢，在每个工区和市镇直接建起了食堂与联络所。\n魔法少女不能整天待在掩体里擦她们的武器了，她们必须脱下战斗服去学校上课，或者在车间里跟着技师学画图纸也行；圣杯的随军家属和本地工人也必须排同一支队伍领吃的。大家坐在同一张凳子上吃早饭的时候，那些关于阵营和出身的成见总会被热气腾腾的饭菜冲淡许多。\n要是让老家的同伴看到我居然用搞夏日祭典的套路来治理大陆，估计眼珠子都要瞪出来了。不过管他呢，只要大家能安稳坐下来吃顿饱饭，手段土气一点又有什么关系。"

PAU_zjpb: "直接拍板不就行了"
PAU_zjpb_desc: "圣杯那帮习惯了议会程序的官僚刚搬进市政大楼，就试着用几十页的申报条例塞满我的桌面；公社的代表们又非要为了一个零件的价格开上整整两天的辩论会。\n当年在樱花的造船厂，资方就是用这种繁琐手续硬生生将工人的诉求拖成废纸。我现在既然坐在这个位置上，可容不下这种故意磨洋工的恶习。\n我直接设立了巡回仲裁队，由工会、老兵和水手各派一人直奔现场。铁轨断了就立刻去现场调拨钢材，车间抢煤就当场按产出分摊，谁要是敢拿出厚厚一叠废话公函来推诿扯皮，就给我去后厨削土豆去。\n晓枫经常叹着气说我做事太像个雷厉风行的当铺掌柜，随身揣着印泥和印章到处跑的样子更是不像个正经执政官。但我可没闲工夫去学那些慢吞吞的官僚腔调，早点平息纷争，我还能多抽点时间给白夜梳梳毛呢。"

PAU_bndlsg: "总不能一直当临时工"
PAU_bndlsg_desc: "靠着大锅汤、盖印章和沿街吆喝，我们确实将这帮刚打完仗的人按在了同一张桌前。但这套街头应急的法子能管一阵子，却管不了一辈子。食堂里依然有人因为口音和出身掀翻桌子，巡回仲裁队也解决不了错综复杂的土地产权与矿山归属问题。各地的公社想要明确自治权限，圣杯的移民想要成文法典，军队则需要正式的建制预算。我们不能继续像打游击一样靠着临时拍板过日子了，哪怕过程再繁琐、争吵再激烈，我们也必须坐下来，将这片土地长久运转所需的法权架构一笔笔敲定下来。"

PAU.28.t: "印章也有盖不平的事"
PAU.28.d: "遥整个人把下巴垫在白夜软乎乎的背上趴在桌子上，随手将两张皱巴巴的报告纸推到了我面前。\n“西区食堂昨天又有人打架了。圣杯来的水手嫌工人们吃饭声音大，工人们骂水手是外来殖民者，两边抄起凳子砸翻了好几锅汤……还有那个巡回仲裁，西区的林场和煤矿为了同一片林子争管辖权，仲裁队去现场直接拍板把林子分了，结果两边今天同时递了抗议信，说仲裁员不懂林权规矩在瞎胡闹。”\n遥长长地叹了一口气，声音闷在了白夜的绒毛里：\n“我以前在樱花老家看那些町内会长处理纠纷，总觉得只要把大家拉到路边摊吃顿饭、随手盖个章，什么事都能大事化小。原来治国根本不是搞祭典啊……汤面只能填饱肚子，根本填不平几十年攒下来的成见。”\n我拉开椅子在她对面坐下，顺手将凉透的茶水挪到一旁：\n“知足吧。要不是你那几家食堂和到处乱跑的仲裁队，这帮人上个月就该在街上重新拔枪对射了。你替大家争出了喘口气的时间，现在不过是到了该交真正答卷的时候。”\n遥听后，立马坐直了身子，用手掌拍了拍自己的脸颊，随后抓起桌上的笔说道：\n“去把晓枫和雪伊叫来。既然那些糊弄过去的问题早晚要面对，那就把宪章草案摊开，今晚谁也别想早睡。”"
PAU.28.a: "“我们到底是一个什么样的国家……”"

PAU.29.t: "别把毛团扯进来"
PAU.29.d: "雪伊一巴掌拍在摊开的报纸上，指着上面写得密密麻麻的候选名单：\n“‘南美工农武装公社’！这名字哪里不响亮了？！一听就知道工厂和枪杆子归谁管！”\n晓枫坐在对面，手指在桌上轻轻敲击：\n“老兵们看见‘武装公社’四个字就会联想到清算，圣杯的移民更是会连夜把船开走。我提议的‘泛亚马逊工业与防务联合体’在法理上更中立，也更方便跟海外谈生意。”\n“得了吧，晓枫。”我靠在椅背上忍不住插话，“你那个名字听起来像是一家濒临破产的仓储转运公司。”\n“那也比阿夏你写的‘自由卫队联合管区’强。”雪伊翻了个白眼，“不知道的还以为旧军阀又在大楼里复辟了。”\n几个人从中午争到日头偏西，桌上的废纸堆得老高，谁也不肯让步。\n雪伊抓了抓头发，转头看向坐在长桌末尾的遥：\n“喂！我说春日小遥执政官大人！你天天在公函上盖大印，轮到定国名了，你从刚才开始就一声不吭，该不会连个像样的名字都憋不出来吧？！”\n我和晓枫也跟着转过了视线。\n遥正把下巴放在桌沿，拿着一根吃剩下的饼干棒专心致志地试图将印泥盒子顶在白夜的鼻尖上。被雪伊这么一嚷，印泥盒啪的一声掉在桌上，白夜吓得一头钻进了她的袖口。\n遥坐起身子冲着雪伊嚷嚷起来：\n“哈？！干嘛突然冲着我发火啊！还有，‘执政官’这破称呼到底是谁硬塞给我的？！听起来像个长着大胡子的古罗马石雕，我明明才十九岁，天天被你们叫执政官，感觉头发都要早早掉光了！”\n雪伊被她噎了一下，双手抱在胸前冷笑：\n“嫌称呼难听，那你倒是给我们这片地方起个好听的名字啊！”\n遥气鼓鼓地抓过那张报纸，拿起笔唰唰几下划掉了我们之前写的所有提案。\n她在纸面上写下几个字，随后直接拍在桌子正中央。\n我和雪伊凑上去看，上面写着——\n“白夜同盟”\n雪伊瞪大了眼睛，指着那张纸喊道：\n“你疯了吧？！你打算拿这只昨天刚咬断我电话线的毛团来当国名？！”\n“这怎么啦？！”遥理直气壮地叉着腰，“在我们樱花老家，神社还把狐狸和猫供在牌位上呢！白夜在大洋深处护住了货船的龙骨，大家才没沉进海沟里，它立的功劳比你们那些死掉的国王大多了！”\n“而且你们那些名字，什么公社、什么协作区、什么管区，每个字都带着一股想压别人一头的火药味。”遥伸手戳了戳纸上的字迹，“白夜既不代表军队，也不代表工会，更不是哪路外国神仙。白夜就是白夜，是黑夜里不落的太阳！”\n雪伊原本想要反驳的话卡在了嗓子眼里。\n晓枫盯着那张草稿纸看了好一会儿才开口：\n“老兵不会觉得被公社吞并，工会不用向军队低头，圣杯的移民也挑不出宗派毛病。对外，没有任何一个海外帝国能从这个名字里找出旧条约的由头。”\n晓枫放下笔，抬头看着遥：\n“在政治法理上……这居然是最挑不出毛病的方案。”\n雪伊张大了嘴，有些别扭地看向从遥袖口探出小脑袋的白色小兽，最后哼了一声把头扭向一边：\n“……便宜这只偷吃我香肠的毛团了。”\n我看着那个得意洋洋把白夜举在头顶的白发少女，忍不住笑了起来。\n拿一只贪吃的小兽来命名一整片大陆的国家，这大概是全天下最荒唐的决议。\n但在这间挤满了逃亡者的大楼里，这确实是唯一一个谁也挑不出刺的荒唐了。"
PAU.29.a: "“那就这么定了，白夜同盟。”"

PAU_sbzq: "书包总比枪托轻吧"
PAU_sbzq_desc: "巡视了一圈防线和车间，我发现那些十几岁的小孩个个都能熟练地拆装步枪，可递过去一张食堂菜单，居然连上面的白菜和土豆都不认得。\n仗打完了，总不能让下一代人继续当只会扣扳机的文盲。几栋空置的营房被收拾了出来，工人们从造船厂拉来涂了黑漆的木板充当黑板。教员队伍更是凑得五花八门：水手负责教四则运算和看海图，退役老兵教识字，连圣杯留下的办事员也被拽来教地理与历史。\n至于那些习惯了战斗的魔法少女，我也硬给她们在第一排占了课桌。双手既然能用来施展奇迹，就没理由握不住小小的粉笔。哪怕最初只能照着说明书磕磕绊绊地拼读，但这群在硝烟里长大的孩子，终于不用每天夜里抱着枪管入睡了。"

PAU_byq: "印上爪印就能当钱花？"
PAU_byq_desc: "用几箱柴油换几袋土豆的以物易物，应付战时避难还行，要在整个大陆恢复通商根本就是场灾难。工人们不想天天领面粉当工钱，圣杯的商人不肯收公社的工时票，老兵们更是拿着作废的旧币四处叫骂。\n既然各方谁也不认对方的货币，遥干脆让人腾出报社的印刷机，用剩下的纸印出第一批统一兑换券。为了让这堆花花绿绿的纸片不变成废纸，她直接定下了特别死板的规矩：每一张券都能随时去市政货栈兑换等重的面粉、海鱼或者柴油。由港口堆成山的物资当后盾，这套印着白夜爪印的简陋纸币，硬生生在废墟里砸出了第一套通用的买卖规矩。"

PAU.30.t: "白夜券进入集市的第一天"
PAU.30.d: "码头集市的鱼摊前围了一大圈人，吵闹声隔着两条街都能听见。\n一个退役炮手揪着鱼贩子的围裙，手里抖着一张刚领到的白夜券：“老子刚从修路队领来的工钱，上面盖着市政厅的大印，你凭什么不收？！”\n鱼贩子拿着刮鳞刀在砧板上重重一剁：“老子出海吹了一整夜的风捞上来的鲜鱼，你拿张印着白猫的纸头就想换走？鬼知道明天你们那个执政官还在不在台上！”\n周围看热闹的工人和商贩跟着起哄，眼看两个人就要抄起板凳动手。\n我和遥挤开人群走过去。遥嘴里还嚼着刚买的烤红薯，顺手将剩下的红薯塞进我手里，一步迈到了鱼摊前。\n“吵什么呢，大清早嗓门挺响啊。”\n遥抽走炮手手里的白夜券，在鱼贩子眼前晃了晃：\n“大叔，看清楚这上面的戳记。拿着这张白夜券去东区货栈，能当场称走好几斤油粮。要是货栈的人敢少给你一两，下午直接去市政大楼砸我的玻璃。”\n鱼贩子愣了神，说话结结巴巴起来：\n“执、执政官大人……这真能换出油粮来？不是糊弄人的吧？”\n遥一听这称呼，原本神气的脸瞬间垮了下来，没好气地嚷道：\n“都说了别叫我执政官！听着像个长胡子的老头子，难听死了！”\n我站在一旁嚼着红薯，面无表情地提醒她：\n“行了，全城的公函落款都印着这三个字，普通老百姓上哪知道你私底下讨厌这个头衔。”\n遥气呼呼地哼了一声，从兜里又摸出两张白夜券拍在砧板上：\n“这条最大的海鲈鱼我买了，剩下的两张白夜券不用找零，算我预支你明天的摊位费。你要是不信，现在就拿着去货栈换东西。”\n鱼贩子捏着那几张硬质牛皮纸印出来的白夜券，终于松了口，用麻绳把鱼麻利地系好递了过来。\n围观的人群渐渐散开，不少人议论着朝货栈方向走去。\n我拎着鱼，走在遥的身侧：\n“这套白夜券，全靠货栈里的存粮撑着。要是哪天海上断了鱼获、地里收不上麦子，大家手里的券立刻就成了一堆废纸。”\n遥背着手脚步轻快往前走着：\n“那就多造几艘渔船，让老兵们少喝酒多去开荒嘛。信用这种东西，本来就是一碗面一罐油慢慢攒出来的。只要今天大家能拿白夜券买到鱼，明天它就是真正的钱。”"
PAU.30.a: "“去通知货栈，今天兑换的物资不准缺斤少两。”"

PAU_yjl: "我们总得有个讲理的地方"
PAU_yjl_desc: "当年在工区，军团的装甲车曾经无情地碾碎过工人们的罢工队伍，那些留在车间外墙上的弹孔到现在都没能填平。如今战争结束了，死难工人的家属在领口粮的队伍里，总能撞见当年扣动扳机的老兵。私底下的寻仇与斗殴几乎每天夜里都在巷子里上演。\n光靠几家食堂的客套话，抹不平当年的血债；可要是放任私刑，整座城市立刻就会被复仇的火苗重新点燃。我们必须设立真正的法庭，颁布公开透明的法典。当年的暴行必须由审理官在日光下核实并给予补偿，无休止的私下报复也必须明令禁止。从今天起，不管是扛枪的老兵还是握扳手的工人，解决旧怨的唯一途径只能是法庭的判决，而不是手里的枪栓。"

PAU.31.t: "旧档案上的名字"
PAU.31.d: "我推开侧厅的门，晓枫正坐在那张堆满文件袋的桌子后面，手里正拿着一瓶墨水往砚台里倒着。\n桌子正中央摆着明天第一场公开听证会的卷宗，封皮上用墨水写着“莉兰迪亚工人起义”。\n我拉开椅子坐下，伸手翻开那份卷宗的第一页。上面赫然夹着当年军团的调令，最底下的指挥官签名处签着我的名字，而在行动路线的测绘图角落里，还留着晓枫当年作为参谋长画下的工整图例。\n“你真打算明天把这份卷宗原封不动地公开？”我抬起头问她。\n晓枫放下墨水瓶，拿起吸墨纸吸了干纸面上的残墨：\n“受害工人家属的诉状已经递上来了。当年死在车间门口的十几名工会干事，家属要求确认开枪军官的责任。既然要设立真正的法庭，第一桩案子就不能搞任何幕后调解。”\n“我的名字在调令最底下。”我扯了扯衣领靠在椅背上，“工人们恨透了当年的军团，他们明天会指着我的鼻子骂死我的。”\n“测绘封锁网的人是我，图例底下也有我盖的章。”晓枫的声音没有一丝动摇，“后来我虽然脱离军团退进了山里，但这不代表我在工区画下的封锁线没有困死过人。”\n她将一份正式的传唤应诉书推到了我面前，上面已经工工整整签好了她自己的名字：\n“阿夏，底下的老兵和公社之所以天天在街上拔刀子，就是因为大家都在怀疑新政权会包庇自己人。如果我们这两个当年的军团主官不敢站在法庭上接受质询，这间屋子里立起来的法典就跟王室的欠条一样，全是废纸。”\n我握住了笔。那场在暴雨里碾碎街垒的旧事，像一根扎在骨头里的硬刺，随着每一次呼吸都在隐隐作痛。\n逃避了这么多年，这笔债务终于还是追到了眼前。\n“赔偿金从我们两个每个月的津贴里扣。”我在应诉人一栏干脆利落地签下了自己的名字，将笔啪的一声拍在了桌上，“明天上午，我们一起去听受害家属当面骂娘。”\n晓枫收起那份签好字的卷宗，一直紧绷的眉头终于舒展了一些，轻轻推过来一杯还热着的咖啡：\n“放心，法庭门口不会安排卫队。要挨臭鸡蛋，也是我们两个一起挨。”"
PAU.31.a: "去准备明天的庭审发言吧。"

PAU.32.t: "军礼"
PAU.32.d: "我刚走到法庭大厅的台阶下，就被迎面冲过来的两个老营长堵在了廊柱旁边。\n带头的是当年在工区带队开车的巴罗，他脸上的烧伤疤痕涨得通红，一把扯下胸前那枚军团的勋章重重砸在石柱上：\n“阿夏长官！你真打算走进去向那帮工会的人低头认罪？！”\n几个换岗的卫队老兵停下了脚步，目光齐刷刷压了过来。\n“当年在工区开火是王室下的死命令！军令如山，不上前线就是军法处决！”巴罗嗓门粗得像是在阵地上吼叫一样，“弟兄们在泥里打滚，被弹片削掉了皮肉，后来又跟着你跨过大洋四处挨饿！我们帮着抢回了港口，打烂了死灵，现在仗打赢了，你却告诉我们，我们全被打成了该被审判的凶手？！”\n他一把抓住了自己的枪带：\n“今天你去向工会认罪，明天工人们就能将绞索套在每一个老兵的脖子上！弟兄们咽不下这口气，大不了咱们回营地拉出装甲车，跟他们拼个鱼死网破！”\n我停下脚步，伸手一把揪住巴罗的衣领，将他整个人拽到了眼前：\n“拼个鱼死网破？然后再将这片好不容易建起来的家园再轰碎一次？！”\n巴罗眼睛瞪大了。\n“听清楚了，巴罗。”我盯着他的眼睛，压低了声音，“今天站在审理台上挨骂的是我，名字写在应诉书上的是我和晓枫。当年在工区下达突击命令的人是我，如果有人该为当年的血债负责，那个人只能是我这个带队的最高长官！”\n我松开手，替他拍平了被扯歪的肩章：\n“你们以为老娘愿意去受审？但如果不把当年的罪责清清楚楚查明白、将王室的烂摊子挑到日光底下，你们脱下这身军装走到街上，工人们就会在黑巷子里用铁棍砸烂你们的脑袋！”\n“我今天走进去，就是要当着全城人的面将所有罪名揽在指挥层头上。只要法官敲下锤子，过去的旧怨就到此为止。从明天起，谁要是敢越过法典去动底下一个听令开火的大头兵，老娘第一个带枪毙了他！”\n巴罗站在原地愣了好一会儿，原本紧握着枪带的手慢慢松开。他捡起掉在石阶上的勋章，塞进了军服口袋里，随后挺直身板，向我敬了一个庄重却又无比沉重的军礼。\n我没有再多说一个字，迈步推开了法庭厚重的大门。"
PAU.32.a: "“开庭吧。”"

PAU.33.t: "我们站在审理台前"
PAU.33.d: "旁听席左侧坐着佩戴黑纱的工人家属，右侧则是军容齐整的老兵。\n法官敲响木槌，当众宣读针对当年工区惨案的起诉书：\n“鉴于基层士兵受制于王室严酷的战时连坐法令，抗令者当场处决，故法庭免予追究一线战斗人员的个人刑事责任；但签署突击命令的阿夏、测绘封锁路线的晓枫，必须直面死难者的诉求。”\n起诉书念到晓枫的名字时，工会席位上突然站起一位满头白发的老车工：\n“法官阁下！晓枫同志后来退进深山带我们打了数年游击，港口保卫战也是她带着大家守住了车间！当年她在图纸上签字必定受了蒙蔽，工会愿意为她担保！”\n工人们低声议论起来，目光在泛黄的图纸和晓枫身上来回摇摆，神情满是纠结。\n紧接着，念到我的名字时，后排的老兵们霍然起身，巴罗张大了嗓门怒吼：\n“阿夏长官保住了所有人的性命！莉兰迪亚的恶战是她顶在了最前沿！如果要判长官有罪，我们这些老兵全部同罪受罚！”\n大厅内顿时骚动起来，两边的呼喊声几乎要掀翻屋顶。\n晓枫转过脸面向工会席位，声音严厉而清脆：\n“工会的各位同志，肃静！”\n她将双手按在受审栏的木桩上：\n“当年在指挥部画下封锁线的人确系本人。我很清楚那张图纸会封死车间的退路！如果因为我后来替大家打过胜仗便抹去过去的血迹，那今天这座法庭和王室随心所欲的赏罚有何区别？！我站在这里，求的是公正的裁决，概不接受任何功过相抵的情分！”\n我也跟着转过身，指着后排骚动的老兵们厉声喝道：\n“全都给老娘坐回去！老娘当年亲口下的命令，死了人就该老娘站在这里担责！如果因为老娘带你们活了命便能凌驾在人命之上，那我们当年碾过街垒的行为就永远都成了正确！我们要的是所有人头顶上的法典，谁也别拿袍泽情义来坏了规矩！”\n两边的喧闹声被我们两个坚决压了下去，大厅内瞬间落针可闻。\n法官再次敲响木槌，面容肃穆地看向法庭两侧：\n“法庭充分知悉二位被告在抗击死灵与建立同盟中的历史功绩，亦清楚工会与军队各自的陈情。然而，在法理层面，功勋与罪责从不同炉而治。”\n法官展开判决书，声音在穹顶下清晰回荡：\n“下达屠杀指令的王室已被依法定性为非法暴力实体。二位被告作为执行防务的主官，罪责确凿，无可推卸。依据同盟过渡期法权条例，本庭判决如下：”\n“一、阿夏、晓枫战争罪名成立，载入同盟永久司法档案，剥夺二人过往军职所附带之一切终身豁免权；”\n“二、查封原军团留存之战时特别账户，并入受害者抚恤基金；二人名下薪资按月强制划拨，用于抚恤死难者遗孤直至成年；”\n“三、鉴于二人具备同盟防务与工业建设不可替代之调度能力，判处二人以民事公仆身份终身服役，接受工会与民政委员会之双重司法监督。”\n“退庭！”\n木槌落下，发出沉闷的回响。\n工人们紧握着照片久久伫立，老兵们默默垂下了头。\n席位上鸦雀无声，无人欢呼，亦无人再出言抗议。\n旧时代的血怨终于被这柄沉稳的木槌定格，而前方的路，向所有人敞开了大门。"
PAU.33.a: "走吧，该去干活了"

PAU_bycx: "别对着毛团乱拜了"
PAU_bycx_desc: "去街上转悠的时候，我发现好几个拐角都立起了小神龛，里面供着白夜的木雕，底下堆着烤鱼干、白米饭和点着的蜡烛。经历过死灵浩劫的人们太渴望抓住一点寄托了，大家不仅坚信白夜的绒毛能驱散疾病，甚至把我也传成了从大洋对面渡海而来的神使。\n这都算哪门子的怪事啊！当初定下这个名字是为了让军队和工会别再争吵，可不是为了给自己立牌位！更要命的是，白夜那只贪吃兽每天夜里偷偷溜出窗户，将全城神龛里的香肠和点心吃得底朝天，现在胖得连窗台都快跳不上去了。\n强行下令拆除神龛只会让担惊受怕的平民更加惶恐。我和晓枫商量后，索性将这种盲目的狂热引导为同盟的民俗集市，将供奉神仙的习惯改造成了社区互助活动。谁要是敢借着白夜的名头私设教派敛财，治安队会直接押去开荒修路。至于那只日渐发福的毛团……"

PAU.34.t: "它真的吃不下了"
PAU.34.d: "我和遥顺着后巷找过去的时候，拐角那处堆着木箱的空地前正围着好几个人。\n一个擦得干干净净的木箱上铺着红布，上面点着两支蜡烛。白夜正四脚朝天瘫在供盘正中央，圆滚滚的肚子鼓得像个小瓜，嘴里还咬着一根炸得金黄的小鱼干。\n旁边跪坐着一个包扎着臂膀的退役炮手，还有两个提着菜篮的妇女，嘴里正念念有词地念叨着家人的名字。\n“喂！白夜！你今天到底在外面蹭了多少顿饭？！”\n遥一步迈上前，提着白夜后颈的皮毛将它拎了起来。那团白毛嘴里还叼着小鱼干，四条短腿在空中无辜地扑腾着。\n跪在地上的老兵吓了一跳，连忙摆手阻拦：\n“春日大人！使不得啊！那是送给护国白兽的供奉，乱动会招来厄运的……”\n“招什么厄运啊！”遥气得直跺脚，将白夜塞进了我怀里，“你们再这么毫无节制地喂下去，它明天就得得急性肠胃炎！哪家神仙会长一身肥膘连老鼠都追不上啊！”\n身旁那位提着菜篮的妇女低着头，小声解释着：\n“当初死灵围城的时候，家里的小孙子吓得天天夜里哭醒发高烧……街坊都传白夜身上的白毛能驱散不干净的邪气，我们这才……”\n遥嘴边的数落声停住了。\n她瞥见妇女篮子里那顶小毛线帽，在台阶上直接坐了下来，伸手从供盘里拿了一块玉米饼掰成两截递了回去：\n“小孩子夜里发烧，明天早上去西区公立诊所找大夫领退烧糖浆，求这个吃了睡睡了吃的懒蛋可不管用。”\n遥自己咬了一口剩下的玉米饼，嚼得两腮鼓鼓的：\n“不过这饼烙得挺香。神龛以后准许摆，但里面不准放荤腥，供品也得由街坊邻居自己分着吃了，就当成大家聚在一起聊天的理由好了。至于白夜——”\n遥指着在我怀里打着饱嗝的小兽，气呼呼地宣布：\n“从明天开始，谁要是再敢偷偷塞给它炸鱼，我就罚那个人去市政大楼给全同盟的办公椅地下全扫一遍！”\n巷子里原本紧绷的气氛被她这番话逗得松散开来，老兵和妇女都忍不住跟着笑出了声。"
PAU.34.a: "别忘了明天给诊所多送几箱药"

PAU_mgsh: "别忘了我们的老朋友"
PAU_mgsh_desc: "圣杯本土的议会发来了一封满是问号的越洋电报，大老爷们完全搞不明白，为什么自家的远征军会跟造船厂工人坐在一张桌前，甚至还听从一个东洋姑娘的调遣。更让他们摸不着头脑的，是报告里那些被正式登记进市政名册、享有公民待遇的魔法少女。\n既然海对面想要个说法，我们就清清楚楚给他们写一份回电。对内，同盟依法确立魔法少女的受教育权与民事身份，由公立诊所定期分担她们的身体负担，严禁任何势力将她们视作雇佣兵或者消耗品；对外，遥在电报里直截了当地说明了利害：你们的士兵并未背叛民主，他们选择留在这片能吃上热饭的土地上守护家园。同盟愿意向圣杯的远洋商船开放免税泊位并签订互惠贸易条约，但要是海对面的议员打算派战舰来兴师问罪，港口的大炮可认得每一艘试图侵犯水域的武装船只。"

PAU.35.t: "来自南美的荒谬电报"
PAU.35.d: "外交大臣将刚译出来的电报纸摔在议事桌上，脸色阴沉得像要下雨：\n“这封电报简直是对圣杯王国议会的公开挑衅！那个自称遥的东洋小姑娘，在信里竟然大言不惭地让我们把远征军的抚恤金账单销掉！”\n几位海军将领凑上去，电报纸上的文字直白得让人目瞪口呆：\n“圣杯王国的议员先生们：远征军的士兵目前身体健康，每天都能吃上热饭，这边的工人也替你们的护航舰换好了新零件。诸位在议会辩论里争吵的那几笔海外军费，现在可以从预算里划掉了；但如果各位打算派舰队来押解这批人回去受审，请务必提前发电通报，港口的大炮已经校准好了射角。附言：我们的免税泊位随时向贵国商船开放。”\n“荒唐！这帮远征军擅自脱离圣杯王国管辖，竟然还跟工人和那帮会用奇特法术的魔法少女混在了一起！”一位保守派议员拍案而起，“必须立刻派主力舰队前往南美，封锁航道，将这帮叛逆押送回国！”\n负责财政的副大臣揉了揉额头，无奈地打断了他：\n“派舰队横跨大洋的燃油开销，议会昨天才刚否决掉。更何况，电报里写得很清楚，他们占着深水港，手里有火炮坦克装甲车和那群战力不明的女孩。我们要是真开着军舰过去，除了替圣杯王国的造船厂增加几艘战损名单，换不来哪怕一圣杯盾的收益。”\n他指了指电报最后的附言：\n“比起花重金去打一场胜负难料的远洋战争，他们开出的免税港和廉价木材，反而能让商会那帮选民高兴好一阵子。”\n议事大厅里陷入了长时间的争执，所有人都盯着桌上那张电报纸，等待着最后的表决。"
PAU.35.a: "既然省了军费还能通商，那就按条约签字吧"
PAU.35.b: "圣杯王国不可能承认这种非法的流亡者同盟！"

PAU.37.t: "梦"
PAU.37.d: "梦里总能听见电车驶过路口时的叮当声，伴随着细碎的雨水敲在了教室的玻璃上。\n老家海港小镇的空气里常常混着煤烟与路边炸肉饼的油香。变故并不是突然降临的，最初是老师不再来学校，换成了穿着土黄色制服的教官用墨条涂掉课本上的句子；接着是纺织厂的年轻女工们在傍晚的站台边分发传单，路过的人看上一眼便慌慌张张塞进口袋；最后是造船厂吊车顶上的防空警报在黄昏时分尖啸起来。\n记忆里的那条巷道很窄，脚底的木屐踩在雨水积聚的石子路上打着滑。藤井拽着我穿过堆积钢材的阴影，将那团缩成一团的小兽硬塞进我的怀里，推着我爬上了运煤船的舷梯：\n“遥，带着山灵先走，船开了就别回头！”\n躲在煤堆深处的漫长航程里，透过甲板舱盖的缝隙只能看着故乡栈桥上的灯火一点点缩成微弱的光点。那些掩护我翻上船舷的同伴，全被留在了码头刺眼的巡逻车灯光底下。\n这么多年过去了，我在大洋对岸装成精明的说客，学着像模像样地跟军官和工会拍桌子争论法典，可每次睡着的时候，自己依旧是那个躲在货舱深处不敢出声的逃亡学生，不知道当年留在岸上的那些名字，现在是不是也已经被浓黑的墨迹彻底抹掉了。\n……\n下颌上传来温热的触碰，白夜的小耳朵正贴着我的脖颈轻轻蹭动。\n我从办公桌前抬起头，日光顺着窗沿斜铺在摊开的地图上。\n身上穿着沾着泥印工装的阿夏正靠在门框边，手里端着刚接好的凉水：\n“醒了？刚才听你趴在草稿纸上嘀咕着什么电车站和下雨。”\n我用袖口擦掉脸颊上的压痕，目光停在墙面地图西北角那片狭长的岛屿群上。\n“阿夏。”我轻声唤她。\n“怎么？”阿夏放下水杯。\n我揉了揉白夜的耳朵，低声说道：\n“等秋粮全部入库、海湾的新泊位建好……陪我回一趟老家吧。”\n“当年我一个人逃跑丢下的那些人，总得回去看看他们还在不在。”"
PAU.37.a: "……"
