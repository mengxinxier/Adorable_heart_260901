####人物####
PAU_Nymph: "阿夏"
PAU_Nymph_desc: "§L十几岁进兵营的时候，阿夏加入的“无国界之军”是整片大陆名气很大的雇佣军。在巴罗这些老兵的带领下，她学会了怎么开坦克、怎么拆装机枪。那时的军团按合同拿钱办事，靠着强硬的作战本事在各地受雇打仗。\n1934年，王室强令军队去工区镇压罢工，彻底撕裂了军团。\n老军团长离世后，晓枫带着一部分人退入深山，阿夏则留下来接管了剩下的队伍。她理解晓枫的选择，但留守的几百名兄弟姐妹和家属总得有口饭吃，阿夏选择守着既有的合同留在营地。§!"

PAU_xiaoyao: "春日小遥"
PAU_xiaoyao_desc: "§L在樱花群岛的海港镇上长大，小遥从小就在造船厂、火车站和码头摊位之间到处奔跑。她讨厌大人们立下的各种规矩，却熟悉工人的日子和码头的门道。在街头长大的经历，让她懂得怎么跟各种人打交道，也习惯在走投无路时找出生路。\n故乡的局势越来越乱，小遥联络了同情工人的水手和两艘船，带着山里捡来的白兽“白夜”，横跨大海一路开到了南美。这支孤独的船队避开沿途的巡逻，最终停靠在莉兰迪亚的港湾里。§!"

PAU_bl: "巴罗"

PAU_baiye: "白夜"
####特质####
Maj_soul: "山灵加护"
Maj_soul_desc: "§L这支部队受到来自樱花的山灵“白夜”的神秘庇护。即便身处补给断绝、死气弥漫的绝境，白夜残留的纯净灵气亦能护佑辎重与士卒免受恶劣环境侵蚀，并在瞬息万变的战场上凭借不可思议的本能趋吉避凶。§!"

PAU_baiye_trait: "白夜"
PAU_baiye_trait_desc: "§L显然，让一只小动物来指挥一个军队是一件很好笑的事情§!"
####决议###
PAU_LHS_weiji_dec: "这是留给我们的最后期限"
PAU_LHS_weiji_dec_desc: "我们不能再等下去了，王室给不了我们时间，晓枫给不了我们时间，我们不能停下，我们不能停下来继续等死。"

PAU_xiufu: "重新打通通道"
PAU_xiufu_desc: "晓枫带队退入深山前炸塌了整段隘口，滚落的碎石封死了通往矿区的通道。为了夺下被截断的运粮线，工兵连必须带着炸药与推土铲尽快将堵塞的道路重新清理出来。"

PAU_xiaoyao_plan: "放白夜出去溜达溜达"
PAU_xiaoyao_plan_desc: "那个小家伙天天缩在营房里睡大觉，肚子都快吃成皮球了。既然附近的街区与门口到处弥漫着阴冷的死气，不如打开窗户由着它跑出去四处转转。它身上带着深山里的灵气，在街道里蹭蹭小树、扒拉几下泥土，顺带还能吓跑那些在阴影里游荡的怪胎呢。"

xiaoyao_plan_flag: "白夜正在四处溜达"
PAU_xiaoyao_state_flag: "白夜曾在此处散步"

