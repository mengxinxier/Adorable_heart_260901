 PAU_royal_arrears:0 "欠饷"
 PAU_royal_arrears_desc:0 "答应拨发的军饷始终卡在贵族们层层推诿的文件里。战士们只能在饥饿与寒冷之中苦苦坚持。§!"

 PAU_divided_legion:0 "割裂的军团"
 PAU_divided_legion_desc:0 "§L当年老军团长积攒下的那点威望，早在莉兰迪亚起义的流血夜和卡卡罗姆的枪声里耗光了。守着雇佣合同的老兵对新来的面孔处处提防，年轻的战士也看不惯老兵们冷漠麻木的做派。集结哨吹响时命令虽能传达下去，但在战壕那片压抑的安静里，谁也不敢保证身旁的同伴会对自己做些什么。§!"

 PAU_divided_legion1:0 "割裂的军团"
 PAU_divided_legion1_desc:0 "§L当年老军团长积攒下的那点威望，早在莉兰迪亚起义的流血夜和卡卡罗姆的枪声里耗光了。守着雇佣合同的老兵对新来的面孔处处提防，年轻的战士也看不惯老兵们冷漠麻木的做派。集结哨吹响时命令虽能传达下去，但在战壕那片压抑的安静里，谁也不敢保证身旁的同伴会对自己做些什么。§!"

