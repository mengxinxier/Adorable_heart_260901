PAU.620.t:0 "联合发展计划"
PAU.620.d:0 "国务积分攒够了，联合发展计划终于可以落地。委员会把三份厚得吓人的方案摆在桌上：一份要把工业产能翻上去，一份要把民生保障铺到最偏远的城镇，还有一份要把同盟的外交通道全部打通。\n“钱和人都只有这么多。”小遥看着三份方案，“选一个，然后我们一起把它做成。”"
PAU.620.a:0 "产业升级计划：扩建造船厂与机床工厂，推动技术升级。"
PAU.620.b:0 "民生保障计划：压低消费品压力，把资源投向学校与医院。"
PAU.620.c:0 "外交统一战线：统一外交口径，扩大同盟的国际影响。"
