PAU_start_game_text: "§Y走吧，今天照常出操§!"
PAU_his_page_01_title: "留在营地里的人"
PAU_Country_History_Page_01: "1935年军团分裂，晓枫带领追寻理想的队伍退入深山创建了‘野火’，阿夏与留守营地的雇佣军则遵照合同驻守在山口。这群雇佣兵长期依靠为王室出战维持生计，身边聚集着许多缺乏谋生技能的底层人员与家属。阿夏接过了残余队伍的带队职责，操持着营地里的日常用度并看管战备车辆。在山谷那头的游击队看来，她们成了替统治者看守大门的走狗；在王都的大臣眼里，她们是一群随时可能毁约的潜在隐患。夹在同袍的枪口与雇主的防备之间，这支进退两难的雇佣军，在刺骨的风里勉强维持着生活。"

PAU_his_page_02_title: "谁来结清这笔欠款"
PAU_Country_History_Page_02: "索拉娜在王都掌权之后，为了守稳边境，数次拨出大批柴油与面粉支援前线。在王宫里那位新主人的预想中，守在要道上的雇佣军理应领足了粮饷与军械。\n然而王都的大臣们认定山里的反抗军成不了气候，继续花大钱养着随时可能叛变的雇佣军纯属浪费。这帮廷臣私吞了黄金拨款，将运粮车队改道拉去私人码头倒卖，真正送到营地的，变成了一箱箱拖延兑现的欠条。\n老军官相继逃离，年轻的阿夏不得不每天守在厨房与库房前，盘算着每一升燃油与每一捧杂粮。她多次找押运官当面争执，对方却除却推诿便是冷笑。于是，索拉娜以为前沿固若金汤，营地里的战士们却在饿着肚子数着剩下的干粮，这种荒谬的隔阂使得头顶上的阴云一天比一天沉重。"

PAU_his_page_03_title: "冬天就要过完了"
PAU_Country_History_Page_03: "进入1936年，营地里的物资消耗到了极限。车辆的油箱已经见底，后厨的大锅里再也煮不出顶饱的饭食了。对面的‘野火’部队在山头上修筑工事，等待着雇佣军断粮自溃；王都的大臣们依然在一味拖延兑现。留下来是活活饿死，撤走会因毁约遭到通缉；强攻山头油料不足，退回后方又无处容身。在这处狭窄的山口前，这支守着空肚子的雇佣军连队，在冬天的尾声走到了命运的关口。"
