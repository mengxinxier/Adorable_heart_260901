 PAU_lhs_integration: "重新整编野火"
 PAU_lhs_integration_desc: "几个钟头前，我们还在卡卡罗姆隔着掩体互相开火；现在为了逃命，晓枫手底下的人和我的老兵却不得不挤在一支车队里。去年的罢工流血和军团分裂留下的怨气还在，两边的人连领口粮排队都要互相瞪眼。如果不尽快把这两支队伍的指挥和建制理顺，恐怕还没等亡灵追上来，营地里自己就先闹翻了。\n\n当前野火整编进度：§Y[?ROOT.PAU_lhs_integration|0]§!"
 PAU_lhs_keep_cadres: "保留野火的部分编制"
 PAU_lhs_keep_cadres_desc: "晓枫带出来的那批人在山里打了一年多游击，早就习惯了原来的带队方式了，对我们这边的军官也不太信任。现在如果强行把他们拆散，只会让大家更加抵触。不如暂时保留他们原有的连队编制，平时的训练和传达命令还是交给他们熟悉的军官负责。"
 PAU_lhs_dissolve: "将她们的编制解散"
 PAU_lhs_dissolve_desc: "一支队伍里不能长期留着两套指挥体系。只要野火还保留着独立的编制，两边的人遇到事情还是会分彼此的，到了战场上自然也很难配合到一块。"
 PAU_lhs_joint_drill: "进行联合谈判"
 PAU_lhs_joint_drill_desc: "光靠上面的命令解决不了基层的矛盾。这几天两边的军官为了物资分配和防务安排争执了好几次，谁也不肯做出让步。我和晓枫干脆把两边的军官与代表叫到了一起，把彼此的难处和要求当面谈清楚，商量出一套双方都能接受的办法。"
 PAU_lhs_finish: "野火归队完毕"
 PAU_lhs_finish_desc: "过去积累下来的矛盾当然不会一下子全都消失，平时休息的时候，老兵和野火的人偶尔还是会吵上几句。不过到了出操和执行任务的时候，已经没人再计较身边的同伴以前属于哪一边了。分开这么久之后，两支队伍总算重新走上了正轨。"

 PAU_grail_camp_live: "有限的食物"
 PAU_grail_camp_live_desc: "在撞坏的船舵彻底修好之前，谁也不知道我们还要在这座孤岛上停留多久，每天分发的食物都必须仔细计算。"
 PAU_grail_camp_die: "§R留给我们的食物不多了……§!"
 PAU_grail_camp_die_desc: "§我们必须做点什么……§!"
 PAU_grail_camp: "圣杯流亡营"
 PAU_grail_camp_desc: "船队好不容易摆脱了海里的亡灵，靠岸后却被安置在了圣杯王国的检疫区里。岛上的守军对我们处处提防，港口的商人也趁机抬高物价。我们必须靠着手里仅剩的物资，想办法平安撑过去。\n\n当前流亡营口粮：§Y[?ROOT.PAU_grail_rations|0]§!"
 PAU_grail_split_rations: "把我们的食物分一分吧"
 PAU_grail_split_rations_desc: "营地里剩下的食物已经不多了，如果还按平时的标准分发，用不了几天就会见底。身体还算结实的老兵和水手这阵子只能先省着点吃了，先把省下来的干粮和肉罐头分给医疗棚里的伤员，还有那些一路跟着受冻的年轻人吧。"
 PAU_grail_trade_arms: "用军械兑换物资"
 PAU_grail_trade_arms_desc: "临时营地里的供水设备早就坏了，而圣杯的后勤部门规定，每一桶干净的淡水和修船零件都要拿现钱去买。我们手里没有当地通用的货币，只能把从港口仓库多带出来的步枪和弹药拿出来，跟岛上的商人交换急需的淡水和维修备件。"
 PAU_grail_repair_ships: "替圣杯修船"
 PAU_grail_repair_ships_desc: "停在港口的几艘圣杯巡逻艇一直缺人维护，而我们的队伍里正好有不少懂车床和修引擎的熟练工人。与其干等着消耗存粮，不如派工人过去帮他们检修船只，既能抵掉一部分停泊费用，也能借用港口的起重设备把我们自己的船舵修好。"
 PAU_safe_harbor: "莉兰迪亚避风港"
 PAU_designate_safe_harbor: "在 [FROM.GetName] 设立避风港"
 PAU_designate_safe_harbor_desc: "把这里的码头和仓库清理出来，到了夜里就点亮灯塔。只要对外放出消息，那些在海上无处可去的船只和逃难的平民，自然会顺着灯光找过来靠岸。"
 PAU_safe_harbor_refugees: "安置流亡船队"
 PAU_safe_harbor_refugees_desc: "外海又陆续驶来了几支逃难的船队，船上大多是带着家眷逃出来的平民和工匠。既然难民港已经腾出了住处，先把他们妥善安顿下来，再给愿意做工的人安排份活计，城里的人手也能宽裕不少。"
 PAU_safe_harbor_repair: "修缮船坞"
 PAU_safe_harbor_repair_desc: "港里还有几座荒废的船台，一直堆着没来得及清理的残骸。派人把船坞重新修整好，以后再有受损的船只靠岸，我们就能直接动手抢修，船厂的工人们也能在修船的时候多攒些经验。"
 PAU_safe_harbor_lane: "恢复固定航线"
 PAU_safe_harbor_lane_desc: "码头既然已经运转起来了，就不能只靠零散的船只来回拉货。把避风港之间的船期固定下来，让货船按时往返运送燃料与物资，沿岸的生意才能长久地做下去。"
 PAU_undead_containment: "亡灵清剿与撤离"
 PAU_undead_evacuate: "组织人员撤离"
 PAU_undead_evacuate_desc: "工事被毁了还可以重新修筑，但我们的性命丢了就真的什么都没了。优先组织平民与重伤员撤往后方吧。"
 PAU_undead_counterattack: "组织反冲击"
 PAU_undead_counterattack_desc: "那些毫无心智的亡灵并非无坚不摧，只要我们重新鼓起勇气反扑上去，就能一口气把逼近的尸潮挡回去！"
 PAU_undead_counterattack_re_15_days: "距离上次§Y$PAU_undead_counterattack$§!已经过去15天"
 PAU_undead_burn_depot: "烧毁物资"
 PAU_undead_burn_depot_desc: "撤退前将无法转移的食物彻底引爆焚毁。断绝了食物与可利用的物资，涌入空城的尸群便无法长久盘踞。"
 PAU_axia_mil_tt:0 "£GFX_PAM_am 阿夏军事改革点：$RIGHT|=+0$"
 PAU_xfxy_mil_tt:0 "£GFX_PAM_am 晓枫雪伊军事改革点：$RIGHT|=+0$"
 PAU_xiaoyao_mil_tt:0 "£GFX_PAM_am 小遥军事改革点：$RIGHT|=+0$"
 PAU_axia_recon:0 "先让会认路的人走在前面"
 PAU_axia_recon_desc:0 "山里的路况复杂得很，要是前卫哨探连路都认不明白，后面整队人就得跟着在泥潭里挨打。阿夏挑选了几位熟悉地形的老猎户与侦察员带路，哪条山径能通车、哪处塌方会陷轮子，今天天黑前都必须在地图上标得一清二楚。"
 PAU_axia_supply:0 "弹药要按人头分"
 PAU_axia_supply_desc:0 "巴罗生前最讨厌账目不清、弹药运到半路就莫名其妙对不上数。阿夏把仓库管理员、车队调度和连队后勤全都叫到了同一张桌前核对清单。领了多少子弹就记多少，谁要是敢私下藏匿或者谎报损耗，立刻从配给名单里划掉。"
 PAU_axia_armor:0 "让还能发动的坦克先带徒弟吧"
 PAU_axia_armor_desc:0 "车库里那些老旧坦克虽然发动起来直冒黑烟，但底盘和传动轴都还结实耐用。阿夏组织了老装甲连的驾驶员，手把手教新兵排查化油器与拆装负重轮。既然手头只有这些老家伙，那就先让懂行的人带大家练到能开上前线为止。"
 PAU_axia_medics:0 "把担架队从后方拽回来吧"
 PAU_axia_medics_desc:0 "受伤的士兵不能就这么扔在一旁自生自灭。无论外面的局势有多乱，先把伤员稳妥救下来，别的事情之后再说。"
 PAU_xfxy_command:0 "指挥链合并"
 PAU_xfxy_command_desc:0 "公社自卫队与参谋部的指挥链原本各自为政，一份紧急调令经常在两边传达得拖泥带水。雪伊和晓枫核对了两边的编制差异，将重复繁琐的呈报程序彻底精简，让一线部队能第一时间收到最直观的协同命令。"
 PAU_xfxy_signal:0 "耳机不要咳嗽了"
 PAU_xfxy_signal_desc:0 "老旧通信机一遇到雷雨天就只剩下杂音，前线的动静根本传不回来。雪伊气得直按通话键，晓枫则默默安排徒步传令兵与沿途哨所建立了接力网。就算无线电出故障了，各连队之间的信号也不能继续失联下去。"
 PAU_xfxy_joint_defense:0 "自己的门自己守，也要替邻居看一眼"
 PAU_xfxy_joint_defense_desc:0 "自卫队有自卫队的纪律，驻防军有驻防军的阵地，谁也不愿意被对方单方面接管。晓枫和雪伊在地图上划定了防守互助协议：日常防务彼此自主，但只要警报拉响，相邻哨所就必须立刻提供火力支援，谁也不能事不关己地袖手旁观。"
 PAU_xiaoyao_navy:0 "先把船和码头排明白再说"
 PAU_xiaoyao_navy_desc:0 "开着几艘改装舰船出海可不是闹着玩的，要是没有靠谱的泊位和补给轮替，大家很可能连港口都回不来呢。小遥拉着藤井和水手们把港区停泊、燃油加注和维修轮候的班次重新排定，免得军舰一回港就全挤在浅滩上动弹不得。"
 PAU_xiaoyao_expedition:0 "别等退潮了才想起来装船"
 PAU_xiaoyao_expedition_desc:0 "码头上堆满了准备跨洋运送的物资箱和战车。小遥拿着货运清单在跳板旁仔细清点，将救命的急救品和前沿弹药移到底舱最外侧。装船的顺序要是搞错了，到了对岸滩头可就只能眼巴巴干着急啦。"
 PAU_xiaoyao_landing:0 "抢滩之前先把滩头数清楚"
 PAU_xiaoyao_landing_desc:0 "光是在图纸上画个箭头可没法把士兵送上对岸。小遥对照着海图和水文记录，反复核算滩头的坡度与潮汐落差，将每艘舟艇能运载的战车数量与登陆批次固定下来，免得大家一踩进海浪里就陷入淤泥。"
 PAU_axia_eco_tt:0 "£GFX_PAM_am 阿夏经济改革点：$RIGHT|=+0$"
 PAU_xfxy_eco_tt:0 "£GFX_PAM_am 晓枫雪伊经济改革点：$RIGHT|=+0$"
 PAU_xiaoyao_eco_tt:0 "£GFX_PAM_am 小遥经济改革点：$RIGHT|=+0$"
 PAU_axia_granary:0 "配给明细就贴在门外"
 PAU_axia_granary_desc:0 "粮库之前的记录乱七八糟，阿夏干脆带着秤杆亲自去仓库盘点。不管是老兵连队还是刚进营的新兵，每天领多少粮食全部公开贴在门外，少了一袋都得当面查清去向，绝对不允许有人私下克扣。"

 PAU_axia_workshop:0 "报废战车上还有能用的零件"
 PAU_axia_workshop_desc:0 "车间里缺少现成的新零件，阿夏便让机修班把报废战车上的齿轮与传动轴拆下来翻新。只要能让机器重新转起来、让工人们开工干活，从报废车上拆下来的部件也比停工干等着强得多。"

 PAU_axia_currency:0 "能换回粮食才算真钞票"
 PAU_axia_currency_desc:0 "市面上同时流通着好几种货币，平民根本不敢随便收。阿夏把储备的粮食和燃油份额同新发行的纸币绑定，在城里设立了专门的兑换窗口：只要凭着这张纸真能从公共食堂换回食物，大家自然就愿意收下了。"

 PAU_axia_trade:0 "港口可不是摆着好看的"
 PAU_axia_trade_desc:0 "海湾里的泊位既然已经腾出来了，就不能光停着看风景。阿夏安排工人和水手清理航道、修好岸上的吊机，让靠港的货船能尽快卸下原油与机床，保证前线的补给线不会断绝。"

 PAU_xfxy_wages:0 "空头口号抵不了工钱"
 PAU_xfxy_wages_desc:0 "工人们辛苦流汗做工，可不是来听空洞口号的。雪伊和晓枫清点了手头能动用的资金，定下了分批补发欠薪的时间表。现在有多少现金就先按人头平分下去，剩下的差额盖章立据，不能让大家白白出力。"

 PAU_xfxy_procurement:0 "人情批条换不来合格弹药"
 PAU_xfxy_procurement_desc:0 "军械采购不能再像过去那样凭着人情随手批条子了。晓枫与雪伊重新起草了订购合同，把器材的规格和交货期限写得清清楚楚，省得前线枪炮打响时，才发现送上去的弹药口径根本不对。"

 PAU_xfxy_audit:0 "往年收支全都摆在台面上"
 PAU_xfxy_audit_desc:0 "过去物资进出的糊涂记录要是就这么含混过去，迟早会惹出猜忌。雪伊带着工会代表将往年的收支记录从头清查到底，对不上数的票据逐项核实。只有把底细查明白了，大家共事的时候才不会互相提防。"

 PAU_xiaoyao_market:0 "广场上重新摆开了摊位"
 PAU_xiaoyao_market_desc:0 "港口想要恢复生机，集市就得先热闹起来。小遥在广场上划出免费摊位，把平价粮食和鲜鱼的分发窗口设在最显眼的地方。只要价格定得公道，大家买得起口粮，商贩也有钱赚，城里的日子很快就能恢复正常。"

 PAU_xiaoyao_food:0 "干粮硬得能把牙硌酸"
 PAU_xiaoyao_food_desc:0 "送上来的远征干粮硬得像石块，咬一口甚至能把牙硌酸。小遥气呼呼地拉着军需官退回了这批劣质干粮，重新拟定了口粮验收规定：发下去的食物起码得让人咽得下去，不能拿这种根本咬不动的所谓“耐放品”去糊弄前线的肚子。"

 PAU_xiaoyao_land:0 "地契如果能拖着，庄稼可就全没了"
 PAU_xiaoyao_land_desc:0 "春耕的农时一天也耽搁不得，要是为了查清地契归属拖上几个月，今年的地就全荒了。小遥直接做出决定，让实际耕种的农户先领种子下地播种，繁琐的产权手续留待秋收后再行登记确认。只要能打下粮食，谁干的活就归谁。"
 PAU_debt_tt:0 "£GFX_PAM_am 王室欠饷：$RIGHT|=-0$"
 PAU_lhs_integration_tt:0 "£GFX_PAM_am 旧部整合度：$RIGHT|=+0$"
 PAU_grail_rations_tt:0 "£GFX_PAM_am 流亡营口粮：$RIGHT|=+0$"
 PAU_harbor_count_tt:0 "£GFX_PAM_am 已设立避风港数量：$RIGHT|=+0$"
 PAU_bop_name:0 "谁来管管这个国家？"
PAU_bop_workers_committee:0 "按自卫队的经验操练部队"
 PAU_bop_workers_committee_desc:0 "工会代表与游击队骨干把早年丛林穿插、山地突袭和街区巷战的经验整理成册，主张全军按照这套灵活的方式进行操练，不必死守过去雇佣兵的老规矩。"
 PAU_bop_veterans_council:0 "按武装连队的建制整顿部队"
 PAU_bop_veterans_council_desc:0 "武装连队的士兵们把还能开动的战车重新规整了一遍，主张将各部重武器集中起来，继续按照正规军团的突击编制统一指挥。"
 PAU_bop_joint_meeting:0 "全都给我站住"
 PAU_bop_joint_meeting_desc:0 "光在走廊里互相掐架解决不了任何问题，有什么不服气的全都给我当面把话好好说清楚了。"
 PAU_gydj_tt:0 "先说好，这批军械是公社借给大家的。"
 PAU_bzwtp_tt:0 "喂，小遥！对面全是失控的怪物，你还打算上去跟它们交朋友吗？！"
 PAU_zxd_tt:0 "愿意留下来一起防守的人就全都给我听好了：以下省略…………"
 PAU_zjpb_tt:0 "大家都不要再吵啦。先按这个方案试着办，真出了什么麻烦，我来向大家鞠躬道歉就是了嘛。"
 PAU_sbzq_tt:0 "小遥小姐！课桌和黑板都擦干净了，孩子们明天真的能来念书啦！"
 PAU_ldwm_tt:0 "战车的引擎既然打着了，那就把那帮没有痛觉的怪物一口气推回去，给巴罗连长出口气吧！"
 PAU_zg_fd_tt:0 "该还给邻国的赔偿我们一分都不会赖。至于那些皇帝的老皇历嘛……哼，才不理他们呢。"
 PAU_mdg_tt:0 "活人的家园不向枯骨低头。谁要是想把我们当成牲口使唤，就先问问我们手里的步枪答不答应。"
 PAU_bm_kz_tt:0 "大海上的航道既然被我们打通了，就得老老实实守稳。和平可不是靠别人施舍得来的"
 PAU_sjgm_tt:0 "这一步既然迈出去了，远方只要还有不愿放弃的同伴，我们就不能半路把他们抛在身后了"
 PAU_hpgc_tt:0 "大家既然能坐下来一起吃面，就别老想着拔枪相向啦，连白夜都想好好睡个安稳觉呢。"
 PAU_zdbf_tt:0 "莉兰迪亚的界线就在这里。不管来的是哪一路大人物，胆敢硬闯，就让他们尝尝我们的大机枪吧。"
 PAU_white_night_party:0 "白夜同盟"
 PAU_white_night_party_long:0 "白夜同盟联合阵线"
 PAU_end_settlement_tt:0 "白夜同盟正式宣告成立，往日流亡雇佣军的名册被妥善归档存入历史。"
 PAU_army_reform_axia: "阿夏系陆军改革"
 PAU_army_reform_xfxy: "晓枫雪伊系陆军改革"
 PAU_army_reform_xiaoyao: "小遥系陆军改革"
 PAU_economy_reform_axia: "阿夏系经济改革"
 PAU_economy_reform_xfxy: "晓枫雪伊系经济改革"
 PAU_economy_reform_xiaoyao: "小遥系经济改革"

 ####补齐改革与政治线修正本地化####

 ####新增国家精神####
 PAU_axia_field_kitchen:0 "野战炊事班"
 PAU_axia_field_kitchen_desc:0 "阿夏把懂得掌勺的退役老兵组织起来，在阵地后方架起避风的大铁锅。哪怕战壕里的环境再糟糕，至少换防下来的年轻士兵能捧上一碗热汤暖暖身子。"
 PAU_axia_veteran_school:0 "老兵教学班"
 PAU_axia_veteran_school_desc:0 "经历过南美苦战的老骨干所剩无几，阿夏安排他们以老带新，耐心地在掩体里向新兵传授如何在弹坑里自保与拆装卡壳的枪栓。"
 PAU_xfxy_radio_net:0 "无线电网络"
 PAU_xfxy_radio_net_desc:0 "晓枫调配了修复好的车载步话机，雪伊则督促各基层工队每天按时报备信号频段。双向确认的联络规程，让两边的命令终于不再出现听不见的盲区。"
 PAU_xfxy_winter_gear:0 "冬装与防寒物资"
 PAU_xfxy_winter_gear_desc:0 "潮湿阴冷的高原寒风足以令整连的战士失温冻伤。晓枫算清了布匹与煤炭缺口，雪伊带领后勤工厂加班赶制出厚实的棉服与行军毯，优先送往最前沿的哨卡。"
 PAU_xiaoyao_landing_craft:0 "登陆舟艇编队"
 PAU_xiaoyao_landing_craft_desc:0 "小遥协同船厂将小型货驳与铁皮渔船改造成具备跳板的突击驳船。有了这些遮蔽海浪的载具，抢滩登岛时大家就不用硬着头皮直接往深水里跳啦。"
 PAU_xiaoyao_marine_corps:0 "滩头步兵教范"
 PAU_xiaoyao_marine_corps_desc:0 "为了防止部队一踏上海滩就被密集火力压制得不知所措，小遥把散开冲击、抢占礁石与掩护集结的要领整理成了通俗易懂的随身手册。"
 PAU_axia_ration_standard:0 "统一口粮标准"
 PAU_axia_ration_standard_desc:0 "阿夏把各营队的粮库与后勤收支合并管理，每日按实际在防人员分配口粮。定量公开、入账透明，杜绝私下克扣，保证一线战士碗里的食物始终如一。"
 PAU_axia_tool_recovery:0 "工具回收"
 PAU_axia_tool_recovery_desc:0 "阿夏带着战士们把废旧机库里生锈的扳手、千斤顶和滚珠轴承全部翻找出来重新打磨。物力艰难的时候，哪怕是一颗螺母也能让坏掉的战车重新跑动起来。"
 PAU_xfxy_factory_ledger:0 "工厂往来账本"
 PAU_xfxy_factory_ledger_desc:0 "晓枫核对进出原料，雪伊严查车间产量。公账清晰、物资去向明确，任凭谁也不能将原本拨付军用的钢材与煤炭私自倒卖出去。"
 PAU_xfxy_rail_dispatch:0 "铁路调度表"
 PAU_xfxy_rail_dispatch_desc:0 "港口船期与内陆编组站被排入同一套严密的时刻表。雪伊带领铁路工人昼夜护路，确保满载工业品的列车能分秒不差地穿过穿山隧道。"
 PAU_xiaoyao_public_market:0 "公开集市与配给站"
 PAU_xiaoyao_public_market_desc:0 "小遥设立的平价供销社里，面包、烤鱼和布匹都标着公道的价目。有了能够踏踏实实拿凭证兑换生活用品的去处，城里的烟火气总算是慢慢回来啦。"
 PAU_xiaoyao_land_reform:0 "地契与农户"
 PAU_xiaoyao_land_reform_desc:0 "不再受领主租契盘剥的农人终于在自己的田垄上插下了标记。小遥把登记着姓名的凭证亲手递给农户，有了安身立命的田地，大家的干劲格外高涨。"
 PAU_soviet_contact:0 "北方的技术援助"
 PAU_soviet_contact_desc:0 "北方同样推翻了沙皇的同行者送来了机床图纸与重型装备指导，但电文里也温和地留下一句提醒：无论同路人多远，脚下的前途终归要靠自己去走。"
 PAU_asia_neighbors:0 "亚洲邻国的照应"
 PAU_asia_neighbors_desc:0 "隔海相望的邻邦接收了我们归还的物资与诚恳的歉意。大家记下了彼此的名字，港口的水道逐渐向带着善意的远洋客货轮敞开。"
 PAU_china_hardline:0 "旧账还了，皇帝的事另算"
 PAU_china_hardline_desc:0 "掠夺的罪责由我们全部清退承担，但这可不意味着我们会向对岸那些做着封建旧梦的野心家低头下跪。枪口擦拭如新，尊严容不得任何人践踏。"
 PAU_defy_death:0 "活人不会给骷髅让路"
 PAU_defy_death_desc:0 "阴冷漆黑的死者军团固然令人胆寒，但只要活在阳光下的人们还能彼此握紧双手、将后背托付给身旁的战友，生者的温度就永远不会在这片大地上熄灭。"
 PAU_eng_cooperation:0 "皇家海军的老交情"
 PAU_eng_cooperation_desc:0 "大洋上的老牌水手们虽然放下了敌意并提供了避风船坞，但在港口秩序与泊位调度上，这帮绅士依然执着地坚持着一套繁复的外交礼节呢。"
 PAU_pacific_peace:0 "太平洋贸易口岸"
 PAU_pacific_peace_desc:0 "货轮的汽笛声逐渐取代了岸防炮的轰鸣。只要海湾灯塔的长明灯火一直亮着，双向往来的商道便能为两岸的孩子带来安宁的睡梦。"
 PAU_world_revolution:0 "老掉牙的桌子该掀了"
 PAU_world_revolution_desc:0 "旧世界腐朽的大门不会自行打开。既然高高在上的列强拒绝给受难者留下立锥之地，那便干脆把这张虚伪的谈判桌彻底掀翻。"
 PAU_peace_coexistence:0 "大家先坐下来"
 PAU_peace_coexistence_desc:0 "只要还有通过对话消除纷争的可能，就不会轻易将年轻人送入战火。以彼此平等的尊重代替兵戎相见，才是真正的安宁之道。"
 PAU_armed_neutrality:0 "谁也别拉我们下水"
 PAU_armed_neutrality_desc:0 "白夜同盟无意插手海外帝国的倾轧，但也不允许外来的火苗溅入家园。将门前的刀剑擦得雪亮，旁人自然会懂得自律的界限。"
 PAU_shared_guilt:0 "与国同罪"
 PAU_shared_guilt_desc:0 "从战壕到公社，所有人共同承担起昨天的伤痕与明日的重担。无人能够超然物外，唯有并肩承担，真正的和解方能达成。"
 PAU_white_night_beast:0 "白夜本来就是只野兽"
 PAU_white_night_beast_desc:0 "两边的仗都彻底打完了，海里不会再冒出吃人的怪胎，人类的麻烦事也用不着一只小动物来扛着。是时候解开它脖子上的牵挂，让它回后山自由自在地抓松鼠、睡大觉去了。"
 PAU_final_settlement:0 "白夜同盟的正式名分"
 PAU_final_settlement_desc:0 "军团的名册封存入库，崭新的白夜同盟旗帜在海风中猎猎作响。这片饱经磨难的避风港，终于拥有了属于所有平民的正当名分。"

 ####新增决议####
 unit_youjibudui_design_cost_factor_tt: "£GFX_PAO_youjibudui 革命游击队单位编成花费：$RIGHT|-=%2$"
 PAU_axia_night_march:0 "夜间行军演练"
 PAU_axia_night_march_desc:0 "阿夏亲自带队在漆黑的山路间进行静默拉练。谁要是脚底打滑掉了队，她就会抱着白夜在终点处一直等到天亮。"
 PAU_xfxy_signal_drill:0 "信号与传令演练"
 PAU_xfxy_signal_drill_desc:0 "晓枫把前线传令兵和无线电联络员全部召集到讲堂对表校准，省得真打起仗来才发现各部队的密语暗号早就对不上了。"
 PAU_xiaoyao_shore_drill:0 "抢滩动作再练一遍"
 PAU_xiaoyao_shore_drill_desc:0 "小遥可不想再看到大家登上海滩后找不到各自的班排。她卷起袖子，要求各营队在潮头退去前把散开卧倒的动作练到烂熟于心。"
 PAU_axia_granary_audit:0 "清点粮仓"
 PAU_axia_granary_audit_desc:0 "阿夏亲自提着马灯开仓查对麻袋，谁要是敢在账簿上谎报多领，就得自己掏出津贴把差额如数垫补齐整。"
 PAU_xfxy_spare_parts:0 "把备用零件拨下去"
 PAU_xfxy_spare_parts_desc:0 "晓枫深知趴窝修不好的战车比战损更打击士气，因此特批了一批宝贵的轴承与传动备件，优先拨付给抢修车间。"
 PAU_xiaoyao_food_drive:0 "再筹一批过冬的粮"
 PAU_xiaoyao_food_drive_desc:0 "小遥抱着白夜走访了各街区的烘焙坊与商户，尽量多筹措一些干面粉与鱼干，至少得确保城里的每个人都能暖暖和和地挨过严冬。"
 PAU_lhs_officer_exchange:0 "让我们的军官去训练她们"
 PAU_safe_harbor_smuggle:0 "从避风港走一趟私货"
 PAU_safe_harbor_smuggle_desc:0 "需要拥有至少一座避风港。安排快艇在深夜冒险运送一批物资，换取前线急需的支援装备；但此举容易惊动海湾外游荡的亡灵。"
 PAU_undead_scorched_earth:0 "烧出一条隔离带"
 PAU_undead_scorched_earth_desc:0 "在前沿引燃可燃物烧出一道焦土阻隔带，用火墙迟滞尸潮的爬行推进。虽然会损耗一定的燃油，却能为后方争取到宝贵的喘息时间。"
 PAU_undead_scorched_earth_tt:0 "随机挑选一块与亡灵接壤的地块烧出隔离带，15天后该地块将落入亡灵控制"
 ####改革进度变量####
 PAU_mil_reform_progress_tt:0 "£GFX_PAM_am 军事改革进度：$RIGHT|=+0$"
 PAU_eco_reform_progress_tt:0 "£GFX_PAM_am 经济改革进度：$RIGHT|=+0$"

 PAU_designate_safe_harbor: "指定 [FROM.GetName] 为避风港"
 PAU_designate_safe_harbor_desc: "点亮码头的灯塔并腾出泊位，让海上受损的船只和逃难的平民有地方可以停靠。"
 PAU_safe_harbor_refugees: "接收流亡舰队"
 PAU_safe_harbor_refugees_desc: "难民港已经准备好了住处，可以把外海靠岸的流亡船队和难民家庭接进来安顿了。"
 PAU_safe_harbor_repair: "修复船坞"
 PAU_safe_harbor_repair_desc: "清理军港里受损的船台，把荒废的船坞重新修好，让靠岸的舰船能及时得到检修。"
 PAU_safe_harbor_lane: "开通固定航线"
 PAU_safe_harbor_lane_desc: "在各个避风港之间安排固定的运输班次，让燃料和物资能够按时往来输送。"

####避风港发展度与辐射####
 PAU_harbor_spillover_1:0 "港口开始运转"
 PAU_harbor_spillover_1_desc:0 "海湾边建起了仓库和修船浮桥，靠岸的船只可以就地检修，卸下的物资也有了妥善存放的地方。"

 PAU_harbor_spillover_2:0 "内陆道路畅通"
 PAU_harbor_spillover_2_desc:0 "通往内陆的道路已经修整完毕，运货的卡车能够顺利穿过山谷，把港口和沿途的小镇连接起来。"

 PAU_harbor_spillover_3:0 "沿途车间复工"
 PAU_harbor_spillover_3_desc:0 "进出港口的船只带来了大量维修与加工订单，沿线城镇的木料厂和机械车间也随之恢复了生产。"

 PAU_harbor_spillover_4:0 "城镇恢复生机"
 PAU_harbor_spillover_4_desc:0 "运输车队源源不断地驶向内陆，把粮食、建材和工具送进各个城镇，平静的日常生活正在慢慢恢复。"
 PAU_safe_harbor_expand:0 "扩建避风港"
 PAU_safe_harbor_expand_desc:0 "随着停靠的船只越来越多，原有的泊位和仓库已经不够用了，需要进一步扩建港口的规模。"

 ####自动机制与营房修正####
 PAU_safe_harbor_auto:0 "自动扩建避风港"
 PAU_safe_harbor_auto_desc:0 "每隔§Y30§!天自动消耗政治点数扩建一处避风港。如果不需要继续扩建，可以随时取消。"
 PAU_baiye_auto:0 "自动放白夜出去遛弯"
 PAU_baiye_auto_desc:0 "启用后开启【白夜循环任务】：每隔§Y30§!天由白夜自动巡游一处受控州。任务激活期间，手动决议将自动隐藏；可随时使用对应的取消决议终止循环。"

 PAU_baiye_auto_task_tt:0 "每隔§Y30§!天自动巡视一处受控州；若暂无可巡游的地块则保持待命。"

 ####决议分类描述####
 PAU_army_reform_axia_desc:0 "阿夏带兵向来只看重实际有用的东西。\n当前可用§Y阿夏§!军事改革点：£GFX_PAM_am §Y[?ROOT.PAU_axia_mil|0]§!\n军事改革进度：[PAU_mil_reform_bar]\n当前阶段：[PAU_mil_reform_stage]"

 PAU_army_reform_xfxy_desc:0 "游击队和正规军合编之后，最麻烦的就是两边指挥不统一，遇上阴雨天电台还经常失灵。晓枫和雪伊现在的重心，就是把各部队的联络方式和防守分工理顺，免得真打起来的时候各打各的。\n当前可用§Y晓枫雪伊§!军事改革点：£GFX_PAM_am §Y[?ROOT.PAU_xfxy_mil|0]§!\n军事改革进度：[PAU_mil_reform_bar]\n当前阶段：[PAU_mil_reform_stage]"

 PAU_army_reform_xiaoyao_desc:0 "想要跨过大海去打仗，光靠陆军自己可办不到。小遥打算先把港口和船队的每一件事都安排清楚。\n当前可用§Y小遥§!军事改革点：£GFX_PAM_am §Y[?ROOT.PAU_xiaoyao_mil|0]§!\n军事改革进度：[PAU_mil_reform_bar]\n当前阶段：[PAU_mil_reform_stage]"

 PAU_economy_reform_axia_desc:0 "经历了之前的断粮危机，阿夏对后勤管得特别严格。她不会允许有人在物资上弄虚作假的。\n当前可用阿夏经济改革点：£GFX_PAM_am §Y[?ROOT.PAU_axia_eco|0]§!\n经济改革进度：[PAU_eco_reform_bar]\n当前阶段：[PAU_eco_reform_stage]"

 PAU_economy_reform_xfxy_desc:0 "工厂想要正常开工，首先得把之前的账目都算清楚。雪伊正忙着督促各处补发拖欠工人的工资，晓枫则在重新制定军需采购和铁路运输的规矩，好让后方的生产尽快回到正轨。\n当前可用§Y晓枫雪伊§!经济改革点：£GFX_PAM_am §Y[?ROOT.PAU_xfxy_eco|0]§!\n经济改革进度：[PAU_eco_reform_bar]\n当前阶段：[PAU_eco_reform_stage]"

 PAU_economy_reform_xiaoyao_desc:0 "小遥喜欢直接去街上和农田里转转。她总能用最直接的办法把大家的生活安顿好。\n当前可用§Y小遥§!经济改革点：£GFX_PAM_am §Y[?ROOT.PAU_xiaoyao_eco|0]§!\n经济改革进度：[PAU_eco_reform_bar]\n当前阶段：[PAU_eco_reform_stage]"

 PAU_accel_axia_mil_1:0 "简化呈报手续"
 PAU_accel_axia_mil_1_desc:0 "既然第一项整顿已经顺利办完，各连队的军官也摸清了新规矩，后面的训练安排就能快上不少"
 PAU_accel_axia_mil_2:0 "推广成熟的整训经验"
 PAU_accel_axia_mil_2_desc:0 "部队上下已经完全适应了新的要求，剩下的几项整编工作很快就能全部落实下去了。"

 PAU_accel_xfxy_mil_1:0 "理顺传令流程"
 PAU_accel_xfxy_mil_1_desc:0 "我们的队伍总算迈出了磨合的第一步，参谋部与自卫队之间的联络不再像之前那样拖泥带水了。"
 PAU_accel_xfxy_mil_2:0 "全面推行联合指挥"
 PAU_accel_xfxy_mil_2_desc:0 "联合指挥的框架已经搭建成型，后续的防务调整只需要按部就班地往下推进即可。"

 PAU_accel_xy_mil_1:0 "加快船队调度"
 PAU_accel_xy_mil_1_desc:0 "港口与船队的初步整顿已经见了成效，水手和陆军的配合比刚开始时顺利许多了。"
 PAU_accel_xy_mil_2:0 "全速推进远征筹备"
 PAU_accel_xy_mil_2_desc:0 "船坞、泊位和运输船的调度已经顺利规划完毕，跨海远征的各项准备工作可以全速推进了。"

 PAU_accel_axia_eco_1:0 "简化工矿物资审批"
 PAU_accel_axia_eco_1_desc:0 "第一批粮仓和车间的盘点已经完成，后勤部门办事不再互相推诿，接下来的安排会省事很多。"
 PAU_accel_axia_eco_2:0 "加快各车间复工进度"
 PAU_accel_axia_eco_2_desc:0 "物资的收支与分配已经彻底走上正轨，剩下的经济整顿工作很快就能收尾。"

 PAU_accel_xfxy_eco_1:0 "整理采购运输方案"
 PAU_accel_xfxy_eco_1_desc:0 "合同完善之后，工厂和车间的配合积极性明显高了不少。"
 PAU_accel_xfxy_eco_2:0 "全面统筹生产与财政"
 PAU_accel_xfxy_eco_2_desc:0 "后续的工业与财政规划可以更快地落实下去了。"

 PAU_accel_xy_eco_1:0 "加快地方民生建设"
 PAU_accel_xy_eco_1_desc:0 "第一批集市与春耕安排推行得很顺利，街坊和农户的顾虑打消了，后面的政策也更好开展了。\n\n该路线全部改革国策的推进时间减少§Y12§!天。"
 PAU_accel_xy_eco_2:0 "全面打通各地物资流通"
 PAU_accel_xy_eco_2_desc:0 "城乡之间的买卖和生产已经彻底活络起来，剩下的几项安排推进起来自然水到渠成。\n\n该路线全部改革国策的推进时间追加减少§Y13§!天（累计减少§Y25§!天）。"
 PAU_safe_harbor_desc:0 "外海的局势依然动荡，正常的航道也处处受阻。与其守着海岸线坐以待毙，不如修好沿海的码头，向海上过往的船只与逃难的平民敞开大门。随着各个港区的船坞和航线逐步恢复运转，不断靠岸的船队也会为我们带来急需的物资与生机。\n\n已设立§Y避风港§!数量：§Y[?ROOT.PAU_harbor_count|0]§!｜§Y避风港§!发展度：§Y[?ROOT.PAU_harbor_dev|0]§!"
 PAU_late_doctrine:0 "战后路线"
 PAU_late_doctrine_desc:0 "当前革命输出成果：§Y[?ROOT.PAU_export_successes|0]§!｜当前贸易伙伴数量：§Y[?ROOT.PAU_trade_partners|0]§!｜当前岸防建设进度：§Y[?ROOT.PAU_coastal_defenses|0]§!\n根据所选定的战后战略路线，逐步解锁对应的外交与国防决议权限。"
 PAU_export_revolution:0 "向 [FROM.GetName] 提供革命军械"
 PAU_export_revolution_desc:0 "装满步枪和弹药的运输船已经在泊位待命。我们只把军械交给正在打仗、尚未倒向法西斯或专制中立、对我们没有明显敌意、并且有港口能让同盟船只靠岸的抵抗力量；对方接受后，革命输出成果才会增加。"
 PAU_peace_trade_mission:0 "向 [FROM.GetName] 派出和平贸易使团"
 PAU_peace_trade_mission_desc:0 "派出技师和商船队去谈一条能长期走下去的航线。对方得先对我们有一点好感，也得有能让我们靠岸的港口；否则这趟买卖只会变成一场空跑。"
 PAU_coastal_fortification:0 "加固 [FROM.GetName] 海岸防线"
 PAU_coastal_fortification_desc:0 "在指定沿海州构筑钢筋混凝土炮台与防浪掩体。谁若是打算自大洋硬闯同盟阵地，就得先问问岸防巨炮的火网答应不答应。"
 PAU_peace_trade_boom:0 "和平贸易繁荣"
 PAU_peace_trade_boom_desc:0 "远洋航道重归熙攘繁忙，港口码头终日货物如织，车间工坊接到了源源不断的民生订单。"

 ####外交回应与战后路线事件####
 PAU.480.t: "对岸的回信"
 PAU.480.d: "码头上的通信员抱着一摞信袋跑进了港务室。海峡对岸的回信陆陆续续送到了桌子上，随信还附着几包用油纸仔细裹好的新茶。目前愿意同我们建立正式接触的代表方有§Y[?ROOT.PAU_china_agreements|0]§!处，仍有顾虑而回绝的有§Y[?ROOT.PAU_china_refusals|0]§!个。\n小遥捏着一撮茶叶凑到鼻尖闻了闻，把回信整齐收进铁盒：“冰冻三尺也不是一天化开的嘛。先把港口的大门敞开，等我们的医疗船和机床送到了，大家自然知道我们是来交朋友的。”"
 PAU.480.a: "把急救药品与机床图纸装船送去"
 PAU.480.b: "暂时只维持日常无线电通信"
 PAU.490.t: "北美的答复"
 PAU.490.d: "来自北美的电报一封接一封送到了桌上。有的代表愿意洽谈航线重开，有的则只派了个嚼着口香糖的将军来码头转了一圈。明确愿意同我们达成谅解的有§Y[?ROOT.PAU_north_america_agreements|0]§!个，态度冷硬拒绝的有§Y[?ROOT.PAU_north_america_refusals|0]§!个。\n阿夏把将军留下的名片扔在了海图上：“那帮北方佬精明得很，不见兔子不撒鹰。不过既然他们肯派人下船喝咖啡，至少说明太平洋上的炮衣暂时不用摘下来了。”"
 PAU.490.a: "正式签署双边互不侵犯条约"
 PAU.490.b: "暂且搁置争议，保持低调接触"
 PAU.500.t: "圣杯的回信"
 PAU.500.d: "圣杯议会的特使在港务室外苦等了两个钟头，才捧着一份写满贸易与停火条款的备忘草案走了进来。随行的埃文斯看了一眼草案上的免税要求，忍不住替老东家脸红，小声咳嗽了一声。\n阿夏把草案翻到最后一页，抬眼看向那名端着架子的贵族特使：“替我问候你们伦敦的议员老爷。签字可以，但下次再敢拿防疫的借口扣我们的货船，我就让埃文斯开着你们的皇家护航舰去泰晤士河口收停泊税。”"
 PAU.500.a: "正式缔结互惠贸易协议"
 PAU.500.b: "把巡逻舰队调往外海水域戒备"
 PAU.500.c: "先维持现状，继续从旁观望"
 PAU.510.t: "莫斯科的回电"
 PAU.510.d: "来自莫斯科的电文只有短短几行。有的同志十分热情地提出希望与我们交换地图与步兵操典，有的则带着严肃的政治口吻叮嘱我们“务必站稳立场”。白夜同盟从不打算依附于任何庞然大物，但也不会轻易推开任何一双愿意真诚相握的手掌。"
 PAU.510.a: "互派随军军事观察员"
 PAU.510.b: "委婉致谢，保持合适距离"
 PAU.520.t: "港外的军械船"
 PAU.520.d: "白夜同盟满载军械的补给船在 [ROOT.GetName] 港外缓缓抛锚。甲板上整齐码放着盖好防雨帆布的步枪与弹药箱，广播频道里反复回荡着平稳的呼号：“这些枪弹不问诸位信仰何种旗帜，只问大家是否还怀有继续反抗到底的勇气。”"
 PAU.520.a: "卸船接收这批急需的军械"
 PAU.520.b: "拒绝接收外来流亡势力的物资"
 PAU.530.t: "和平买卖"
 PAU.530.d: "白夜同盟的贸易使团在 [ROOT.GetName] 码头卸下了整箱的技术图纸、轻工样件与长期互惠协定。领队的工程师温和地向当地代表说明：我们并不强求港口悬挂何方的徽号，只希望让两岸的工坊与平民都能重新拥有赖以维生的订单。"
 PAU.530.a: "落笔签署长期供货协定"
 PAU.530.b: "谢绝该笔贸易提议"
 PAU.540.t: "有本事就放马过来"
 PAU.540.d: "作战海图将整张指挥台完全铺满。任何人若是企图倚仗坚船利炮自海上进犯，便必须先掂量自己能否承受要塞炮的怒火。巡洋编队与沿海驻防各部都在静候着同盟最高指挥部下达最终的防御部署。"
 PAU.540.a: "全面强化整条沿海工事线"
 PAU.540.b: "集中力量扼守关键航道咽喉"
 PAU_goodwill_asia:0 "对岸的善意"
 PAU_goodwill_asia_desc:0 "此前送往对岸的药品与机床图纸收获了积极的回音，邻近港湾愿意同我们建立更加长久互信的商贸往来。"
 PAU_pacific_detente:0 "太平洋缓和的空气"
 PAU_pacific_detente_desc:0 "北美商船开始频繁停靠避风港补给，大洋航线上的火药味逐渐消散平息。"
 PAU_soviet_military_mission:0 "北方的军事观察团"
 PAU_soviet_military_mission_desc:0 "双方参谋部开始常态化交流作战图谱与战术教范，校场上也时常能见到远方战友严谨的身影。"
 PAU_fortress_neutrality_engine:0 "要塞中立体系"
 PAU_fortress_neutrality_engine_desc:0 "岸防重炮、主力舰艇与海岸步兵被严整编入同一套联合阵地，任何企图越雷池一步的远洋舰队都必须付出惨重代价。"
 PAU_revolutionary_supplies:0 "革命军械补给"
 PAU_revolutionary_supplies_desc:0 "源源不断送抵前沿的枪弹稳住了阵线，战士们不再因弹尽粮绝而被迫溃散放弃阵地。"
 PAU_trade_partner_boost:0 "贸易伙伴的订单"
 PAU_trade_partner_boost_desc:0 "新签订的民间供货合约让工坊重新排满轮班，货架充盈丰沛，平民无需再为了微薄的口粮终日惶恐排队。"
 PAU_revolutionary_supplies_2:0 "革命重装备援助"
 PAU_revolutionary_supplies_2_desc:0 "重型装甲火炮与战术顾问一同抵达港口，部队终于具备了同强敌正面对抗的重火力支撑。"
 PAU_trade_partner_boost_2:0 "长期贸易协定"
 PAU_trade_partner_boost_2_desc:0 "长周期的工业订单促使大型工厂开辟全新的生产线，互惠互利的伙伴关系也顺带引进了成熟的工程图纸。"
 PAU_revolutionary_ultimatum:0 "向 [FROM.GetName] 发出革命最后通牒"
 PAU_revolutionary_ultimatum_desc:0 "对曾经拒绝军援、至今仍站在反动阵营里的政权下最后通牒。同盟必须先积累足够的革命输出成果；对方若继续顽抗，我们就拿到战争目标，用炮火把话说完。"
 PAU_peaceful_alliance:0 "邀请 [FROM.GetName] 加入和平联盟"
 PAU_peaceful_alliance_desc:0 "邀请已经接受过和平贸易使团、互信达到§Y75§!、且没有加入其他阵营的国家加入防务联盟。前提是同盟自己得先加入一个阵营；领袖是不是我们并不重要，重要的是这份邀请背后得真有一个能兑现承诺的阵营。"
 PAU_peace_enforcement:0 "强制 [FROM.GetName] 停战"
 PAU_peace_enforcement_desc:0 "靠成熟的贸易网络向交战双方施压，把一场没有尽头的消耗战按回谈判桌。只对非主要强国有效；同盟得先有超过§Y4§!个贸易伙伴，别人才会认真听我们说话。"
 PAU_neutrality_guarantee:0 "向 [FROM.GetName] 提供中立担保"
 PAU_neutrality_guarantee_desc:0 "为保持中立、对我们有基本好感、并且有海岸线可供舰队靠泊的友善国家提供安全担保，换取对方承认同盟的中立水域。担保不是白送的，岸防建设点数会因此消耗。"
 PAU_neutrality_ultimatum:0 "向 [FROM.GetName] 发出中立最后通牒"
 PAU_neutrality_ultimatum_desc:0 "对在同盟警戒海域附近挑衅的霸权政权下达最后通告：要么退出航道，要么接下战争目标。只对拥有海岸线、能让舰队真正较量的政权使用；岸防网络不够厚实之前，这份通告没人会当回事。"
 PAU_revolutionary_alliance:0 "邀请 [FROM.GetName] 加入革命国际"
 PAU_revolutionary_alliance_desc:0 "只有已经接受过同盟军援、互信达到§Y75§!、且愿意把命运和我们绑在一起的力量，才配坐上革命国际的圆桌。同盟自己得先加入一个阵营；只要阵营还在，不管领袖是不是我们，都能把对方拉进同一面旗帜下。"
 PAU_restitution_received:0 "被归还的工业设备"
 PAU_restitution_received_desc:0 "早年战火中被掠夺的机床设备完好物归原主，随着装配线重新启动，工坊不仅物资充裕，许多老工匠当年遗失的技术资料也一同寻回。"
 PAU_administration_reform:0 "行政改革"
 PAU_administration_reform_desc:0 "政令传达不再拖泥带水。"
 PAU_schools_opened:0 "学校复课"
 PAU_schools_opened_desc:0 "干净的教室里重新传来了琅琅书声，夜校工人们也开始掌握识字技能，各项法令政策得以顺畅通达基层。"
 PAU_pursuit_authorized:0 "追击授权"
 PAU_pursuit_authorized_desc:0 "全线追击令正式下达，部队不再固守原有阵地，参谋部依照穿插预案指挥各连队有条不紊地合围溃退之敌。"
 PAU_received_revolutionary_aid:0 "曾接受白夜同盟的革命军援"
 PAU_refused_revolutionary_aid:0 "曾拒绝白夜同盟的革命军援"
 PAU_received_trade_mission:0 "曾接纳白夜同盟的和平使团"
 PAU_refused_trade_mission:0 "曾拒绝白夜同盟的和平使团"
 PAU_coastal_fortified:0 "已构筑完备岸防工事"
 PAU_Debug:0 "调试工具"
 PAU_south_america_unity:0 "南美联合呼声"
 PAU_south_america_unity_desc:0 "曾经心存戒备的港湾与城镇纷纷改换了态度，整座南美大陆正逐步将白夜同盟视作可以托付信赖的坚实盟友。"
 PAU_south_america_unity_tt:0 "§Y南美联合呼声§!追加效果：\n"
 PAU_revolution_network_route_tt:0 "革命网络已正式建立。当前阶段由革命输出成果决定，达到§Y3§!、§Y5§!点时自动晋升至第二、第三阶段，同一时间仅生效当前最高阶段。"
 PAU_trade_network_route_tt:0 "贸易网络已正式建立。当前阶段由贸易伙伴数量决定，达到§Y3§!、§Y5§!个时自动晋升至第二、第三阶段，同一时间仅生效当前最高阶段。"
 PAU_coastal_network_route_tt:0 "岸防网络已正式建立。当前阶段由要塞防线建设进度决定，达到§Y3§!、§Y5§!处时自动晋升至第二、第三阶段，同一时间仅生效当前最高阶段。"
 PAU_white_night_alliance:0 "白夜同盟"
 PAU_national_unification:0 "统一与核心区"
 PAU_national_unification_desc:0 "当前南美联合成员国数：§Y[?ROOT.PAU_south_america_members|0]§!"
 PAU_south_america_super_event:0 "宣告南美统一"
 PAU_south_america_super_event_desc:0 ""
 PAU_sakura_super_event:0 "宣告樱花统一"
 PAU_sakura_super_event_desc:0 ""
 PAU_demand_sakura_cores:0 "索要樱花核心领土"
 PAU_demand_sakura_cores_desc:0 ""
 PAU.550.t:0 "来自白夜同盟的领土要求"
 PAU.550.d:0 "“樱花军部的大本营已经化作飞灰，但这片群岛民众世代居住的家园，不该沦为任何外来势力私下交易的筹码。诸位可以选择签字交还这些领土，或者等我们的舰队亲自靠岸来取。”"
 PAU.550.a:0 "签字归还核心领土，避免无谓的流血冲突。"
 PAU.550.b:0 "坚决拒绝签署，准备迎接战火临头。"
 PAU_south_america_union_member:0 "南美联合成员"
 PAU_south_america_union_member_desc:0 "白夜同盟协助各邦摆脱了军阀割据与殖民旧债的泥淖。作为联盟的一员，市场、矿山与港湾在共同框架下有序运作，民生保障与工业建设均获得了稳定庇护。"
 PAU_joint_council:0 "" #更改为惩罚
 PAU_joint_council_desc:0 ""
 PAU_south_america_leader:0 "南美联合体"
 pau_country_in_south_america_name:0 "所有南美国家"
 PAU_faction_manifest1:0 "" #阵营章程1
 PAU_faction_manifest2:0 ""
 PAU_faction_manifest3:0 ""
 faction_pau_country_in_south_america_name:0 "我们阵营中的南美国家"
 PAU_south_america_leader_desc:0 "白夜同盟作为南美联合体系的核心枢纽，统筹调度各地的矿产、铁路与航运网络，本部的工业产值、科研实力与动员能力均获得了显著跃升。"
 PAU_south_america_joint_logistics:0 "举行联合参谋学院课程会议"
 PAU_south_america_joint_logistics_desc:0 "每隔§Y90§!天可召开一次联合参谋学院统筹例会，由白夜同盟在装甲突击、步兵战术与联合作战中选定本期研讨重点。该方向将同步加快同盟本部及全体南美成员的陆军学说每日研究进度，并为同盟带来相应的学说研究点数与学院积分。"
 PAU.560.t:0 "联合参谋学院课程会议"
 PAU.560.d:0 "联合参谋学院的讲堂内坐满了来自南美各地的年轻军官。讲台黑板上工整地写着本期探讨的三大课题：装甲突击协同、步兵战术攻防、联合作战调度。\n本期的研讨方向将直接决定学员们的演练内容，结业后大家就能把新战法带回各自的部队了。"
 PAU.560.a:0 "装甲课题：专研机械化突击与多兵种协同穿插。"
 PAU.560.b:0 "步兵课题：精修阵地防御、堑壕构筑与散兵攻坚。"
 PAU.560.c:0 "联合作战课题：深化后勤调度、前沿侦察与多兵种协同。"
 PAU.560.d:0 "支援连/火炮作战课题：。"
 PAU_south_america_development_fund:0 "召开联合学说研讨会"
 PAU_south_america_development_fund_desc:0 "消耗§Y3§!点联合参谋学院积分组织闭门战术研讨。集中攻关装甲、步兵或联合作战中的指定方向，为白夜同盟提供丰厚的学说研究点数，并获得持续§Y120§!天的学说研究速度加成。"
 PAU_south_america_development_tier1:0 "南美发展基金·起步"
 PAU_south_america_development_tier1_desc:0 "战后重建互助基金正式启动，本部工厂产出与民用配给获得初步改善：工厂产出§Y+5%§!，消费品工厂 §Y-5%§!。"
 PAU_south_america_development_tier2:0 "南美发展基金·成网"
 PAU_south_america_development_tier2_desc:0 "铁路干线与沿岸港口逐渐串连成网：工厂产出§Y+5%§!，建筑建造速度§Y+5%§!，科研速度§Y+5%§!，每日政治点数获取§Y+5%§!，消费品工厂 §Y-5%§!。"
 PAU_south_america_development_tier3:0 "南美发展基金·共同体"
