PAU_mfsn: "她们就是魔法少女吗？"
PAU_mfsn_desc: "东北边那片被称作魔法少女联盟的领地里，据守阵地的竟然是一群穿着花里胡哨的裙子、手里拿着发光的……呃…某种高科技机械还是什么东西，和一些老式长枪的小姑娘。老兵们一开始全都把这件事当成了笑话，直到侦察队亲眼看见那些女孩用古怪的光芒把袭扰的怪物轰成了渣渣。虽然搞不清她们那套力量是从哪儿来的，但至少对方还能讲人话，也没表现出吃人的恶习。先派人接通她们的通信频道试着打探下虚实，但在彻底摸清这帮神秘邻居的脾气之前，门口的机枪保险谁也不准擅自关上。"
pau_jzy: "§Y对方§!将加入我们的阵营"
pau_bjzy: "获得针对§Y对方§!的§Y吞并§!战争借口"

PAU_sbtxd: "听说圣杯来了个探险队？"
PAU_sbtxd_desc: "根据小遥截获的无线电消息，进驻在亚马逊河口的远征军，正是当初在海岛上逼我们交出大量物资的那帮圣杯人。这群老爷在大海上颠簸了几个月，对外宣称是要开进原始雨林寻找沼泽里盘踞的那些人形蜥蜴。小遥在看完一张缴获的探险路线图后，笑得差点从椅子上掉下去：“谁会大老远跨过大海专门跑来抓蜥蜴啊？这帮老爷八成是盯上了林子里的矿产和木材。”\n不过玩笑归玩笑，对方那些满载火炮的护航舰确实停在下游水道上。按照小遥的盘算，既然当年我们在海岛上挨了他们的盘剥，现在正好倒过来向他们高价推销丛林探险的物资，顺带看看能不能让他们在丛林前线充当阻挡阿德莱希那群怪物的好帮手；但要是这群探险家敢借着势头让炮口对准我们的工区，我们也随时准备教教他们，到底谁才是这片雨林真正的主人。"

PAU.26.t: "如果我们都在的话"
PAU.26.d: "通讯里跳出了一个此前从未监听过的固定频段，几声清脆的按键声过后，里面传出了一个带着关西口音的年轻女声：\n“我是莉兰迪亚的临时大统领春日小遥。各位魔法少女指挥官们，占用几分钟频率。”\n对方那里还隐约能听见机床冲压的哐当声：\n“我们的前沿哨兵前几天发回了你们跟那些……是魔女还是什么来着……交火的战况。总之在如今这个秩序碎成渣的大陆上，看到年纪比我们工厂里的小学徒还小的女孩端起武器顶在前线，没人会觉得这是什么光鲜亮丽的故事。大家心里都清楚，你们身后肯定也有哪怕失去性命也想保护的人。”\n通讯那里传来了翻动纸张的声响：\n“我们手里有刚出炉的优质钢轨、成箱的口粮，以及能连夜抢修火炮的技工；你们在前线有压制怪物的强悍火力。如果大家都是为了让身后的平民能吃上一顿饱饭而搏命的话，就用不着互相拿枪口瞄着对方了。只要你们愿意把边境的通道打开，我们可以在莉兰迪亚筑起掩体替你们分担阿德莱希那群怪物的压力，甚至我们可以直接合伙，组一个一辈子都不会解散的阵营，一起把生活过下去，你们看怎么样？”"
PAU.26.a: "我们需要能并肩作战的伙伴"
PAU.26.b: "我们各自安好就行了"

PAU.27.t: "找蜥蜴总得先吃饱饭"
PAU.27.d: "一艘悬挂着双色信号旗的小型汽艇在警戒水域外停下了，艇上的扬声器直接向远征军的旗舰播放了一段清晰的明码录音：\n“圣杯王国的远征军指挥官阁下，日安。”\n“我是接管莉兰迪亚港口的春日小遥。我们对贵国的行事章程并不陌生，毕竟不久前你们海岛上的驻军同行才刚按照战时条例，收了我们好大一笔靠港物资，所以贵方的价目表我们心里有数。”\n录音那边传来一声笑声，接着是茶杯磕在桌面上的轻响：\n“听说诸位贵族军官千里迢迢开进亚马逊，为了扫荡沼泽里的蜥蜴人？总之，我们对你们抓爬行动物的兴趣不作评价，但雨林里的恶性疟疾和无底泥潭，可不会因为各位穿着精良的装备就手下留情。”\n“我们手里有足量的药品、行军用具和食物。只要你们承认莉兰迪亚的管辖权，大家完全可以搭伙签个互助协议，由我们替你们守住下游的退路；当然，如果诸位的枪口打算往我们这边挪……那这片复杂的烂地可比大海上的孤岛难走得多。”"
PAU.27.a: "我们没必要在雨林里多树立一个敌人"
PAU.27.b: "远征军从不向流民低头"

PAU_zxd: "我们不会再逃跑下去了"
PAU_zxd_desc: "我以前总觉得，只要脚底抹油跑得够快，厄运就追不上我。\n可直到今天我才明白，人越是一味逃跑，身边能站立的地方就越小。\n看看阿德莱希里的那些怪物吧，它们可听不懂什么叫公约，更不会给我们留第二次逃命的港口。如果你们这帮人非要将性命押在我这个满嘴谎话的家伙身上，如果我已经彻底坐上了这个大统领的位置——\n那就谁也别想再后退一步了。\n传令兵，去拉响战斗警报。\n我以莉兰迪亚大统领的名义下令：\n各部队全线出击，\n碾碎阿德莱希！"

PAU_sztytz: "身在南美，不许置身事外！"
PAU_sztytz_desc: "这片大陆刚被我们从死人堆里抢救起来，谁也不知道地底下哪天会再冒出亡灵、魔女、五神六神，更不知道海对面的战火什么时候会烧到我们家门口。单打独斗只有死路一条，我们必须把各自的家底全凑到一起。远征军出军舰与航海技术，我们出钢铁、机床和口粮，魔法少女退下前线轮休、去学校念书，大家全都联合起来，这样才能保住每个人吃饭睡觉的安稳日子。\n至于那些到现在还躲在角落里紧闭大门、打着小算盘企图看戏的势力，要是哪天外面的黑手真伸过来了，你们自家的破木头栅栏能顶得住什么啊？我可不打算给大家留几个随时会漏水的窟窿。要么带着你们的物资名册坐下来签字，要么，莉兰迪亚的装甲连队今天就开进你们的政府大楼，替你们把字签了。"

PAU.28.t: "要么入伙，要么让开"
PAU.28.d: "通告里的内容简单到了近乎粗暴的地步：莉兰迪亚要求沿途所有独立国家和武装据点在当天日落前作出抉择，要么交出图纸与物资名册，推选代表加入统一的联合议会，共同统合军事与工业；要么就作为南美大陆统一的顽固阻碍，等待后续部队直接开火扫平阵地。\n驻守阵地的军官与镇上的代表们正争论得不可开交。强硬派认为这是赤裸裸的武力兼并，主张依托工事顽抗到底；但更多看着库房见底的后勤官与伤员却很清楚，对面的政权确实拿出了实打实的工业品与口粮。与此同时，也有人指出：缺粮时接受保护，与在炮口下交出自治权，并不是同一回事。春日小遥给出的期限没有留下太多协商空间；选择加入的代表们知道自己争取到了生存机会，却也清楚对方似乎根本没有打算给任何人留下观望拖延的余地。"
PAU.28.a: "加入莉兰迪亚的联合政权。"
PAU.28.b: "谁也别想强占我们的地盘！"

PAU_xkst: "夏日祭典"
PAU_xkst_desc: "刚将南美的地图拼凑整齐，底下的麻烦就一窝蜂涌了上来。圣杯的移民嫌工厂的工人粗鲁，老兵们看着魔法少女发怵，而那些十几岁的魔法少女则习惯了在角落里戒备所有人。\n在樱花老家的时候，每次工人闹罢工或者街道邻里吵架，那些精明的町内会长总喜欢拉着两边去路边摊一边嗦面一边谈话。于是我就照葫芦画瓢，在每个农村和城镇划分了各种能够摆摊的摊位。\n要是让老家的同伴看到我居然用搞夏日祭典的套路来治理大陆，估计眼珠子都要瞪出来了。不过管他呢，只要大家能安稳坐下来一起开开心心吃顿饱饭，手段土气一点又有什么关系。"

PAU_zjpb: "直接拍板！"
PAU_zjpb_desc: "圣杯那帮习惯了议会程序的官僚刚搬进市政大楼，就试着用几十页的申报条例塞满我的桌面；公社的代表们又非要为了一个零件的价格开上整整一天的辩论会。\n当年在樱花的造船厂，资方就是用这种繁琐手续将工人的诉求拖成废纸。我现在既然坐在这个位置上，可容不下这种故意磨洋工的恶习。\n我设立了现场调解队，由工会、老兵和水手各派一人直奔现场。铁轨断了就立刻去现场调拨钢材，厂里资源分配不均就当场按各自的产出分摊，谁要是敢拿出厚得要死一叠废话公函来推诿扯皮，就给我去厨房削土豆去。\n晓枫经常叹着气说我做事太像个雷厉风行的当铺掌柜，随身揣着印泥和印章到处跑的样子更是不像个正经大统领。但我可没闲工夫去学那些慢吞吞的官僚腔调，早点平息纷争，我还能多抽点时间给白夜梳梳毛呢。"

PAU_bndlsg: "总不能一直当临时工吧"
PAU_bndlsg_desc: "靠着胡乱盖章和到处两头劝架，我确实拽着大家在大厅里坐了好几个月。\n这种街头救急的土把戏，它虽然救得了一时，可它救得了一世嘛？食堂里依然有人因为口音和出身掀翻桌子，现场调解队也解决不了错综复杂的土地产权与矿山归属问题。国内各地的公社想要明确自治权利，圣杯的移民想要成文法典，军队则需要正式的建制预算。我们不能继续像打游击一样靠着临时拍板过日子了，哪怕过程再繁琐、争吵再激烈，我们也必须坐下来，将这片土地长久运转所需的公道与规矩全都给敲定下来。"

PAU.281.t: "印章也有盖不平的事"
PAU.281.d: "小遥整个人把下巴垫在白夜背上，然后趴在了桌子上，将一张皱巴巴的报告纸推到我的面前。\n“食堂昨天又有人打架了。圣杯来的水手嫌工人们吃饭声音大，工人们骂水手是外来殖民者，两边抄起椅子砸翻了好几锅汤……还有那个调解员，林场和煤矿为了同一片林子争管辖权，调解员去现场直接拍板把林子分了，结果两边今天同时递了抗议信，说调解员连哪棵树归谁砍都没分明白就搁那瞎胡闹。”\n她又从报告下面抽出几张折得特别整齐的请愿书：\n“那几个最后加入的镇子也来信了。他们要求撤回由同盟直接派去的临时防务官，重新协商驻军、征税和地方议事会的权力。信里有句话写了好几遍呢：‘我们是需要粮食，但不等于我们需要你们来管。’”\n小遥把脸彻底埋进白夜的绒毛里，闷声闷气地埋怨道：\n“我之前总觉得只要把大家拉到路边摊吃顿饭、随手盖个章，什么事都能大事化小。原来治国根本不是搞祭典啊……汤面只能填饱大家的肚子，大家心里的怨气一点都没少呢。更麻烦的是，有些怨气还是我自己留下的。当初我嫌他们犹豫，觉得先把人拉拢到一起、先撑过眼前的危机再说嘛，之后总有时间谈自治的。现在人家只是来问我：那个‘之后’，到底什么时候才轮到他们说话啊？”\n\n“知足吧。要不是你那几家摊位和到处乱跑的调解队，这帮人几个月前就该在街上重新拔枪对射了。你替大家争出了喘口气的时间，现在不过是到了该交真正答卷的时候了。至于你当初逼他们签下的那几张纸，也不能因为送过粮食就当它们从没发生过，没错吧？”\n小遥听后沉默了很久才坐直身子，她两只手在脸颊上用力揉了一把，随后抓起桌上的笔说道：\n“去把晓枫和雪伊叫来。先把那些请愿一件件登记清楚，再把驻军和地方权利写进宪章草案里。\n今晚！我们谁也别想早睡了！”"
PAU.281.a: "“我们到底是一个什么样的国家……”"


PAU.29.t: "别把白夜拉进来"
PAU.29.d: "“南美工农武装公社！这名字哪里不响亮了？！一听就知道工厂和枪杆子归谁管！”雪伊指着报纸上面写得五花八门的候选名单说道。\n“老兵们看见武装公社四个字就会联想到清算，圣杯的移民更是会连夜把船开走。”\n坐在对面的晓枫立马打断了她，\n“我提议的亚马逊联合工务处在法理上更中立，也更方便跟海外谈生意。”\n“得了吧，晓枫。”我咬断嘴里的草茎，接话道，“你那个名字听起来像是一家濒临破产的仓储转运公司。”\n“那也比阿夏你写的自由卫队联合管区强。”雪伊翻了个白眼，“不知道的还以为军阀又在大楼里复辟了。”\n几个人从中午争到日头偏西，桌上的废纸堆成小山，谁也不肯让出一步。\n雪伊转头看向坐在桌子末尾的小遥：\n“喂！我说春日小遥大统领大人！你天天在公函上盖大印，轮到定国名了，你从刚才开始就一声不吭，该不会连个像样的名字都憋不出来吧？！”\n我和晓枫也跟着转过了视线。\n小遥正把下巴放在桌沿上，拿着一根吃剩下的饼干棒专心致志地试图将印泥盒子顶在白夜的鼻尖。被雪伊这么一嚷，印泥盒直接掉在了桌上，把白夜吓得一头钻进了她的袖子。"
PAU.29.a: "……"

PAU.299.t: "别把白夜拉进来"
PAU.299.d: "小遥坐起身子冲着雪伊嚷嚷起来：\n“哈？！干嘛突然冲着我发火啊！还有，‘大统领’这破称呼到底是谁硬塞给我的？！听起来像个长着大胡子的独裁老头，我明明才十九岁，天天被你们叫大统领，感觉头发都要早早掉光了！”\n雪伊被她噎了一下，然后抱胸冷笑道：\n“嫌称呼难听，那你倒是给我们这片地方起个好听的名字啊！”\n小遥气鼓鼓地抓过那张报纸，拿起笔唰唰几下划掉了我们之前写下的所有提案。\n她在纸面上写下几个字，随后自信地拍在桌子中央。\n我和雪伊凑上去看，上面写着——\n“白夜同盟”\n雪伊瞪大了眼睛，指着那张纸喊道：\n“你疯了吧？！你打算拿这只昨天刚咬断我电话线的东西来当国名？！”\n“这怎么啦？！”小遥理直气壮地叉着腰，“在我们樱花老家，神社还把狐狸和猫供在牌位上呢！白夜在大海深处护住了货船的龙骨，大家才没沉进海沟里，它立的功劳比你们那些死掉的国王大多了！”\n“而且你们那些名字，什么公社、什么工务处、什么管区，每个字都带着一股想压别人一头的火药味。”\n雪伊原本想要反驳的话卡在了嗓子里。\n晓枫拿起那张草稿纸，把上面的四个字默念了一遍才开口：“老兵不会觉得被公社吞并，工会不用向军队低头，圣杯的移民也挑不出宗派毛病。对外，没有任何一个海外帝国能从这个名字里找出旧政权的影子。”\n晓枫放下笔，抬头看着小遥：\n“在政治法理上……确实…没问题？”\n雪伊张大了嘴，有些别扭地看向从小遥袖子探出小脑袋的白色小动物，最后哼了一声把头扭向一边：\n“……便宜这只偷吃我香肠的毛团了。”\n我看着那个得意洋洋把白夜举在头顶的白发少女，忍不住笑了起来。\n拿一只贪吃的小动物来命名一整片大陆的国家，这大概是全天下最荒唐的决议了。\n但在这间挤满了逃亡者的大楼里，这确实是唯一一个谁也挑不出刺的荒唐了。"
PAU.299.a: "“那就这么定了，白夜同盟。”"

PAU_sbzq: "书包是比枪托要轻的"
PAU_sbzq_desc: "巡视了一圈阵地和工厂，我发现那些十几岁的小孩个个都能熟练地拆装步枪，可递过去一张食堂的菜单，居然连上面的白菜和土豆都不认识。\n仗打完了，总不能让下一代人继续当只会扣扳机的文盲。几栋空置的营房被收拾了出来，工人们从造船厂拉来涂了黑漆的木板充当黑板。教员队伍更是凑得五花八门：水手负责教四则运算和看海图，退役老兵教识字，连圣杯留下的办事员也被拽来教地理与历史。\n至于那些习惯了战斗的魔法少女，我也硬给她们在第一排占了课桌的位置。双手既然能用来施展奇迹，就没理由握不住小小的粉笔。哪怕最初只能照着说明书磕磕绊绊地拼读，但这群在硝烟里长大的孩子，终于不用每天夜里抱着枪管入睡了。"

PAU_byq: "印上爪印就能当钱花？"
PAU_byq_desc: "用几箱燃油换几袋土豆的以物易物，应付战时避难还行，要在整个大陆恢复贸易根本就是场灾难。工人们不想靠天天领粮食充当工钱，圣杯的商人也不肯收公社的工时票据，老兵们更是拿着作废的王室旧币四处叫骂。\n于是小遥干脆让人腾出了报社的印刷机，用剩下的纸印出了第一批继王室覆灭后的莉兰迪亚统一货币。先清点粮食、燃油、公共食堂产能和工厂工资总额，再确定发行数量；每一批新券都要登记入账，储备与发行记录张榜公示。至少得让每张纸后面都有能够查清的粮食、物资或劳动成果，不能再靠一枚印章就叫百姓相信承诺。"

PAU.30.t: "白夜券进入集市的第一天"
PAU.30.d: "“阿夏！看这边！今天本小姐请客，想吃什么尽管点！”\n港口集市的面包摊前，小遥手里拿着几张刚印出来的白夜券甩得沙沙作响。\n我跟在她身旁，看着她挤到摊位前冲着系着围裙的摊主开口：\n“大叔！来两条刚烤好的黑麦面包！”\n小遥将两张白夜券放在摊位上，得意地扬起下巴：“不用找了，剩下的算小费！”\n摊主是个五十来岁的干干瘦瘦的男人。他拿起那两张印着爪印的纸钞，迟迟不敢将它们收进柜台里，反而从摊位底下端出一个装满废纸的铁盒，放在了小遥的面前，用近乎哀求的声音说道：\n“大统领大人……这是新的军用借据？我们这条街必须强制收下这个，对吗？”\n小遥被他这一声称呼问得愣在了原地：\n“……这怎么会是借据呢？这是白夜券呀，能买东西的。”\n摊主拍着盒子里那一摞废纸，带着哭腔喊道：\n“以前那些老爷也是这么说的。印了一叠又一叠好看的花纸，搬空了面粉，拿走了煤油。等大家饿得不行拿着纸片去换粮，换来的只有枪托和皮鞭……我们真的经不起再被骗一回了，大统领，行行好，把面包直接拿走吧，别再拿纸片糊弄我们了……”\n周围买东西的码头工人与市民见到此景都围拢了过来，一道道满含戒备与绝望的目光投向了摊位前站着的大统领。\n小遥脸上的得意凝固了。"
PAU.30.a: "……"

PAU.300.t: "白夜券进入集市的第一天"
PAU.300.d: "“王室当年用欠条骗了大家多少年了？在他们眼里，我们这些印钞的人，和当年拿枪抢粮的强盗是没有任何区别的。”我小声提醒到。\n“大叔，带上你的面袋，现在跟我去码头厨房。”小遥脸上的任性与轻浮散得干干净净，伸手抓住了摊主的围裙。\n摊主有些不知所措：“去……去厨房干什么？”\n“去看我们怎么定规矩。”\n她转身看向围拢过来的市民，把白夜券拍在显眼的柱子上：“大家都听清楚了！我们不搞王室那种瞎吹牛的兑换把戏！”\n人群里顿时起了一阵骚动。\n“但是！”小遥抬高声音打断了窃窃私语，“从今天中午开始，全港所有的公共食堂、码头每天拖网打上来的鲜鱼集市、还有工厂后面的供暖浴室，全部只认白夜券！私人摊贩愿不愿意收，由他们自己决定；公营窗口的价目表、库存和每日发行量都要贴出来，由工会和民政代表共同签字。谁也不准强迫百姓把旧钱换成新券。”她把两张白夜券收回钱袋:\n“大叔，这两条面包的价钱先从我的个人配给里折算给你，我想了一下，不能让你先替我们承担信用的风险。你愿意的话，可以来库房看看库存和补货记录；等你觉得这张券真的能换到东西，再决定要不要收也行的。”\n她扭头看向我：“阿夏！通知后勤处，把今天捕上来的海鱼全拉到集市这里，按公示的份量分发。我看谁敢在窗口少给百姓一两鱼肉！”"
PAU.300.a: "“我们必须以身作则才行啊。”"

PAU_yjl: "总要有个讲理的地方"
PAU_yjl_desc: "回忆当年，军团的坦克曾经无情地碾碎过工人们的罢工队伍，那些留在工厂外墙上的弹孔到现在都没能填平。如今战争结束了，死难工人的家属在领口粮的队伍里总能撞见当年扣动扳机的老兵。私底下的寻仇与斗殴几乎每天夜里都在巷子里上演。\n光靠几句虚无缥缈的客套话，抹不平当年的血债；可要是放任私刑，整座城市立刻就会被复仇的火苗重新点燃。我们必须设立真正的法庭，颁布公开透明的法律。当年的暴行必须由审理官在日光下核实并给予补偿，无休止的私下报复也必须明令禁止。从今天起，不管是扛枪的老兵还是握扳手的工人，解决旧怨的唯一途径只能是法庭的判决，而不是，手里的枪。"

PAU.31.t: "当年是谁签的字"
PAU.31.d: "我推开侧厅的门，晓枫坐在那张堆满文件袋的桌子后面，正把钢笔按在墨水瓶里吸着墨。\n桌子当中摆着明天第一场公开听证会的卷宗，封皮上写着“莉兰迪亚工人起义”。\n拉开椅子坐下，伸手翻开那份卷宗的第一页。上面赫然夹着当年军团的调令，最底下的指挥官签名处签着我的名字，而在行动路线的测绘图角落里，还留着晓枫当年作为参谋长画下的工整图例。\n“你真打算明天把这份卷宗原封不动地公开？”\n“受害工人家属的诉状已经递上来了。当年死在工厂门口的十几名工会干事家属要求确认开枪军官的责任。既然要设立真正的法庭，第一桩案子就不能搞任何幕后调解。”\n“我的名字在调令最底下。”\n“工人们恨透了当年的军团，他们明天会骂死我的。”\n“测绘封锁网的人是我，图例底下也有我盖的章。”\n“后来我虽然脱离军团退进了山里，但这不代表我在工区画下的封锁线没有困死过人。”\n她将一份正式的传唤应诉书推到了我面前，上面已经工工整整地签好了她自己的名字：\n“阿夏，底下的老兵和公社之所以天天在街上打架，就是因为大家都在怀疑新政权会包庇对方。如果我们这两个当年的军团主官不敢站在法庭上接受质询，这间屋子里立起来的法律就跟王室的欠条一样，全变成废纸了。”\n听完了晓枫的话，我拿起了桌上的笔。那场在暴雨里碾碎工人们的一切的罪恶，在我脑海里不断重演着。\n逃避了这么多年，这笔债务终于还是追到了我的眼前。\n我在应诉人一栏干脆利落地签下了自己的名字，像终于如释重负一般把笔往桌子上一扔，“明天上午，我们一起去听受害家属当面骂娘。”\n晓枫收起那份签好字的卷宗，一直紧绷的眉头终于舒展了一些，轻推过来一杯还热着的咖啡：\n“放心，法庭门口不会安排任何卫队的。要挨臭鸡蛋，也是我们两个一起挨。”"
PAU.31.a: "去准备明天的庭审发言吧。"

PAU.32.t: "军礼"
PAU.32.d: "我刚走到法庭大厅的台阶下，就被迎面冲过来的两个老营长堵在了廊柱旁边。\n带头的是当年在工区带队开车的巴罗，他扯下胸前那枚军团的勋章砸在了柱子上：\n“阿夏长官！你真打算走进去向那帮工会的人低头认罪？”\n几个换岗的卫队老兵停下了脚步，目光同时压了过来。\n“当年在工区开火是王室下的死命令！军令如山，不上前线就是军法处决啊！”\n“我们在战壕里打滚，被弹片削掉了皮肉，后来又跟着你跨过大海四处挨饿！我们帮着抢回了港口，打烂了亡灵，现在仗打赢了，结果你告诉我们，我们全被打成了该被审判的凶手么……”\n他伸手抓住了自己的枪带：\n“不行！我们绝对咽不下这口气的，阿夏长官！你别害怕！大不了我们回营地把那些坦克都拉出来，跟他们拼个你死我活！”\n我伸手揪住了巴罗的衣领，将他整个人拽到了眼前：\n“拼个你死我活？然后再将这片好不容易建起来的家园再轰碎一次？！”\n巴罗眼睛瞪大了。\n“听清楚了，巴罗。”我盯着他的眼睛，放低了声音，“今天站在审理台上挨骂的是我，名字写在应诉书上的是我和晓枫。当年在工区下达突击命令的人是我，如果有人该为当年的血债负责，那个人只能是如今我这个带队的最高长官！”\n我替他拍平了被扯歪的肩章：\n“你们以为我愿意去受审？但如果不把当年的罪责清清楚楚查明白、将王室的烂摊子挑到日光底下，你们脱下这身军装走到街上，工人们就会在黑巷子里用铁棍砸烂你们的脑袋！”\n“我今天走进去，只要法官敲下锤子，过去的旧怨就到此为止。从明天起，谁要是敢越过法律去动底下一个听令开火的士兵，我第一个带枪毙了他！”\n巴罗原本紧握着枪带的手慢慢松开。随后，他捡起掉在台阶上的勋章塞进了军服口袋里，再挺直身板，向我敬了一个无比沉重的军礼。\n在做了个深呼吸之后，我重新上下打量了巴罗一眼，便朝着法庭那压得让人无法呼吸的大门走去。"
PAU.32.a: "“我们开庭吧。”"

PAU.33.t: "我们站在审理台前"
PAU.33.d: "旁听席左侧坐着佩戴黑纱的工人家属，右侧则是军容整齐的老兵。\n法官敲响法槌，当众宣读针对当年莉兰迪亚工人起义惨案的起诉书：\n“鉴于基层士兵长期受王室严酷的战时连坐法令胁迫，法庭将逐案调查其命令来源、实际行为与拒令风险，不以军籍自动定罪；但签署突击命令的阿夏、测绘封锁路线的晓枫，必须直面死难者的诉求。”\n起诉书念到晓枫的名字时，工会席位上突然站起一位满头白发的老车工：\n“法官阁下！晓枫同志后来退进深山带我们打了数年游击，港口保卫战也是她带着大家守住了工厂！当年她在图纸上签字必定受了蒙蔽，工会愿意为她担保！”\n工人们低声议论起来，目光在图纸和晓枫身上来回摇摆，神情满是纠结。\n紧接着，念到我的名字时，后排的老兵霍然起身来：\n“要判长官有罪，我们这些老兵全部同罪受罚！”\n几名士兵甚至试图翻过栏杆。\n“都给我把手放下！坐回去！！”\n一声怒吼切断了喧闹。一直沉默站在第一排的巴罗跨出一步，用宽阔的胸膛挡在了骚动的部下面前：\n“谁让你们在这儿喧哗的？！你们也想学当年的王室，在老百姓的头上耍横吗？！全给老子坐下！听长官领判！”\n晓枫转过脸面向工会席位：\n“工会的各位同志，肃静！”\n“当年在指挥部画下封锁线的人是我。我很清楚那张图纸会封死工厂的退路！如果因为我后来替大家打过胜仗便抹去过去的血迹，那今天这座法庭和王室随心所欲的赏罚有何区别？！我站在这里，求的是公正的裁决，概不接受任何功过相抵的情分！”\n法官再次敲响法槌，面容肃穆地看向法庭两侧：\n“法庭充分知悉二位被告在抗击亡灵与建立同盟中的历史功绩，也清楚工会与军队各自的陈情。然而，在法理层面，功勋与罪责从来都不可混为一谈。”"
PAU.33.a: "……"

PAU.333.t: "我们站在审理台前"
PAU.333.d: "法官展开了判决书：\n“下达屠杀指令的王室已被依法定性为非法暴力政权。二位被告作为执行防务的主官，罪责确凿，无可推卸。依据同盟过渡期法权条例，本庭判决如下：”\n\n“一、阿夏、晓枫战争罪名成立，载入同盟永久司法档案，剥夺二人过往军职附带的一切特权与赦免权；”\n\n“二、查封原军团留存特别账户，全数并入抚恤金；二人名下薪饷按月强制扣划，用于抚恤工区死难者遗孤直至成年；”\n\n“三、鉴于二人具备同盟防务与工业建设不可替代的统筹能力，判处二人终身保留戴罪服役身份，接受工会与民政委员会监督，为全同盟的重建承担无偿调度之责。”\n\n“退庭！”\n\n随着法槌落下的回响，席位上变得鸦雀无声，无人欢呼，亦无人再出言抗议。\n\n直到我将那顶戴了十几年的军帽放在了受审席之上，\n人们才开始纷纷离去。"
PAU.333.a: "走吧，该去干活了"

PAU_bycx: "别对着白夜乱拜了啊"
PAU_bycx_desc: "去街上散步的时候，我发现好几个拐角都立起了小神龛，里面供着白夜的木雕，底下堆着烤鱼干、白米饭和点着的蜡烛。经历过亡灵浩劫的人们太渴望抓住一点寄托了，大家不仅坚信白夜的绒毛能驱散疾病，甚至把我也传成了从大海对面渡海而来的神使。\n这都算哪门子的怪事啊！当初定下这个名字是为了让军队和工会别再继续争吵，可不是为了给自己立牌位的！更要命的是，白夜那只贪吃兽每天夜里偷偷溜出窗户，把全城神龛里的炸鱼和香肠都吃得干干净净，现在胖得连窗台都快跳不上去了。\n强行下令拆除神龛只会让担惊受怕的平民更加惶恐。我和晓枫商量后，索性将这种盲目的狂热引导为同盟的民俗集市，将供奉神仙的习惯改造成了社区互助活动。谁要是敢借着白夜的名头私设教派敛财，我一定不会放过他。至于那只日渐发福的白夜……"

PAU.34.t: "它真的吃不下了"
PAU.34.d: "我和小遥顺着后巷找过去的时候，拐角那处堆着木箱的空地前正围着好几个人。\n一个擦得干干净净的木箱子上铺着红布，上面点着两支蜡烛。白夜正四脚朝天瘫在供盘里，圆滚滚的肚子鼓得像个小瓜，嘴里还咬着一根炸得金黄的小鱼干。\n旁边跪坐着一个包扎着臂膀的退役炮手，还有两个提着菜篮的妇女，嘴里正念念有词地念叨着家人的名字。\n“喂！白夜！你今天到底在外面蹭了多少顿饭？！”\n小遥提着白夜后颈的皮毛将它拎了起来。那团白毛嘴里还叼着小鱼干，四条短腿在空中无辜地扑腾着。\n跪在地上的老兵吓了一跳，连忙摆手阻拦：\n“春日大人！使不得啊！那是送给护国白兽的供奉，乱动会招来厄运的……”\n“招什么厄运啊！”小遥气得把白夜塞进了我怀里，“你们再这么毫无节制地喂下去，它明天就要患上急性肠胃炎！哪家神仙会长一身肥膘连老鼠都追不上啊！”\n身旁那位提着菜篮的妇女小声解释着：\n“当初亡灵围城的时候，家里的小孙子吓得天天夜里发高烧……周边邻居们都传白夜身上的白毛能驱散亡灵那些不干净的邪气，我们这才……”\n小遥嘴边的数落声停住了。\n她瞥见妇女篮子里那顶小毛线帽，伸手从供盘里拿了一块玉米饼掰成两截递了回去：\n“小孩子夜里发烧，明天早上去公立诊所找大夫领退烧药不就行了，求这个吃了睡睡了吃的懒蛋可不管用。”\n小遥自己咬了一口剩下的玉米饼，吃得津津有味，\n“不过这饼烙得倒是挺香的。神龛以后我允许你们摆，但里面不准再放荤腥，剩下的供品也得由你们自己分着吃了，就当成大家聚在一起聊天的理由，听到了吗？至于白夜——”\n小遥指着打着饱嗝的白夜大声宣布：\n“从明天开始，谁要是再敢偷偷塞给它炸鱼，我就罚那个人去大楼给全同盟的办公椅子底下全扫一遍！”\n听完小遥的一番话，巷子里原本神色紧绷的众人被逗得笑出了声。"
PAU.34.a: "别忘了明天给诊所多送几箱药"

PAU_mgsh: "别忘了我们的老朋友"
PAU_mgsh_desc: "圣杯本土的议会发来了一封满是质问的越洋电报。那帮老爷完全搞不明白，为什么自家的远征军会跟造船厂工人坐在一张桌子前面，更让他们无法理解的，是同盟居然给这群身负神秘法术的魔法少女发了书包和饭卡。\n在殖民老爷的眼里，掌握神秘力量的姑娘不过是好用的武器。既然他们想要个说法，小遥便给他们个痛快话：\n“同盟立下死规矩：谁也不准逼这帮十几岁的小丫头扛枪打仗，全都得给我老老实实背着书包进学校念书！她们现在是正经的学生，身上的怪毛病全由公立诊所接管治伤。谁要是敢把主意打到这些小姑娘头上、想把她们当武器使，莉兰迪亚的大炮第一个轰烂他的大门。”\n\n“战舰开过来，大炮等着你们；商船开过来，咖啡咸鱼管够。选哪个，各位议员老爷自己看着办。”"

PAU.35.t: "皇家海军"
PAU.35.d: "海军部作战室里，桌子两旁的军官们个个拉长着脸。\n海外舰队司令官将一份损管日志放在了海图中央：\n“派去亚马逊河口的通报艇核实了。远征军并没有全军覆没，他们把皇家护航舰开进了当地工团的水港，甚至联合当地武装接管了我们的港口。”\n听到此番话语的保守派议员立马就坐不住了：\n“这是叛国！皇家海军几百年来从未蒙受过这种耻辱！一群领着王国津贴的职业军人，居然向海外流民低头称臣！”\n“他们不仅低头了，议员阁下。”司令官划过海图上的南大西洋航道，“他们依托修造厂修复了巡逻舰，并且控制了河口全部重油储罐。如果圣杯派出惩戒编队，他们随时可以切断我们绕行好望角南段的货运路线。”\n\n一位年长的海军元帅打破了沉默：\n“欧陆局势吃紧，我们根本不值得抽调出成建制的远洋舰队去打一场跨洋远征。就算把他们全部宣布为叛徒，我们也夺不回那些舰船的。”\n议员咬着牙反问：\n“难道我们就任由这群叛徒在海外割据吗？！”\n在桌子尽头的内阁代表翻开一页文件，面无表情地提醒道：\n“最新报道，南美没有悬挂任何激进政权的旗帜，甚至主动提出了港口通航草案。他们愿意对王国的商船开放泊位，并且优先供应他们的铜矿与原木。既然军力顾不过来，与其耗费巨资去打一场注定亏本的跨洋作战，不如先在纸面上把冲突冻结起来。”"
PAU.35.a: "这是明智的选择"
PAU.35.b: "立刻封锁他们的航道！"

PAU.36.t: "封锁令"
PAU.36.d: "“皇家海军宣布对南大西洋航线实施封锁，任何悬挂白夜同盟旗帜的船只都将被扣押。”\n阿夏把电文读完立马笑了：“他们终于肯承认我们已经值得封锁了。”\n“这算什么。”\n小遥不以为然。\n“通知各港，船队改走近岸水道，雇佣兵护航。圣杯想用一纸命令饿死我们，那就让他们看看，我们谁先撑不住。”"
PAU.36.a: "让他们封锁去吧。"

PAU.37.t: "梦"
PAU.37.d: "梦里总能听见电车驶过路口时的叮当声，伴随着密集的雨水敲在了教室玻璃上。\n老家海港小镇的空气里常常混着路边摊的油香。\n记忆里的巷道很窄，依稀记得藤井拽着我穿过钢材堆的那个时候……\n“小遥，从备用舷梯先走！”\n可警报突然拉响，刺眼的探照灯封死了舷梯。为了引开追捕的巡警，我抱着白夜在暴雨里发疯似地跑向卸煤栈桥，顺着缆绳滚进了运煤舱的煤堆深处。\n躲在底舱的漫长航程里，透过甲板缝隙，只能看着故乡栈桥上的灯火缩成一点微弱的光。那些掩护我翻上船舷的同伴，全被留在了码头刺眼的警灯底下。\n这么多年过去了，我在大海对岸装成精明的说客，学着像模像样地跟军官和工会争论，可每次睡着的时候，自己依旧是那个缩在煤堆里不敢出声的逃亡学生，不知道当年留在岸上的那些名字，如今是不是也已经被彻底抹掉了。\n……\n下巴上传来温热的触感，白夜正拿毛茸茸的耳朵贴着我的脖子轻蹭着。\n我从办公桌前抬头，阳光顺着窗户斜铺在了墙上的海图。\n“醒了？刚才听你趴在桌上说梦话，一会儿念叨下雨，一会儿喊电车。”\n阿夏倚在桌边，朝我递来一罐热饮。\n我揭下粘在脸上的草稿纸，目光停在了海图西北角那片狭长的岛屿群上。\n“阿夏。”\n“嗯？”\n我摸着白夜的耳朵，轻声说道：\n“等秋粮全部入库、新的泊位建好……陪我回一趟老家吧。”\n“当年我一个人逃跑丢下的那些人，总得去确认一下……大家还在不在。”"
PAU.37.a: "……"

PAU_zgjd: "海那边可全是正规舰队啊"
PAU_zgjd_desc: "想在这片小船坞里拼凑出一支正规海军去打决战是不可能的。大海对面的军部手里握着成排的主力舰与航母，正规交火我们连一轮齐射都撑不过去。\n但藤井在海图室里指出了唯一的胜机：军部的大部分主力舰队正被牵制在海峡西岸的中国抗日战场上，本土的各处军港防御空前空虚。\n我们不需要去跟战列舰对决，我们的目标是斩首。征用海湾内所有适航的远洋货轮，用防弹钢板改装成隐蔽的装甲运输船，将岸防炮焊上甲板充当近程火力掩护。利用白夜对深海盲区的感知避开巡逻潜艇，在本土造船厂工会的罢工掩护下，将战车和老兵直接送进本土军港的腹地，一击击碎军部的大本营！"

PAU_zszz: "现在可不是客气的时候"
PAU_zszz_desc: "面对大海对面正规舰队的重炮，继续按平时的慢节奏造船修闸就是坐以待毙。小遥在船厂黑板上画下全港布防图，宣布所有的民间泊位、钢板库房与大型吊机全面转入战时改装。既然要迎头撞向风暴，我们就把手里能打出去的家伙全给搞出来！"


PAU.38.t: "谁也不是为了当英雄"
PAU.38.d: "埃文斯把一份签满外文名字的舰队名单放在了桌上，他的制服领口敞开着，显然刚和手下的船员发生过激烈的争吵。\n“你们那些水手真愿意登船？我还以为他们更想开船回本土去呢。”\n我递过去一杯凉水问他\n“回去当无业游民吗？”埃文斯端起水杯一口饮尽，“本土的议会早就把远征队视为叛徒了。要是空着手回去，我们是要上军事法庭的。留在莉兰迪亚，至少每月能按时领到粮食与津贴。”\n埃文斯指着海图上的航道：\n“何况樱花军部的潜艇已经在太平洋击沉了不少商船了，他们正试图封锁大海。如果不能把航线打通，我们在南美的港口早晚也会变成与世隔绝的死港。参战不仅是为了帮你们，也是为了保住我们自己的退路。”\n门口传来推门的声响，巴罗夹着一个文件袋走了进来：\n“长官！老兵们的报名表收齐了，装甲连和炮兵连的志愿书全在这里。”\n“我现在是个在工地上领基础工资的施工员，判决书还在市政大楼门口贴着呢。”\n巴罗有些尴尬地咳了一声：\n“叫习惯了，换个称呼舌头会打结的。”\n我翻开了老兵们的申请名单，一边看着一边说道：“法庭已经保证了退役抚恤和土地。你们留在城里种玉米，晚上能睡安稳觉，何必跟着船队去大海上拼命？”\n“种地？”\n“弟兄们打了十几年仗，除了装填炮弹和修坦克，做起别的活计笨手笨脚。当年我们听信王室的命令向同胞开火，走到哪里都觉得抬不起头。现在跟着大统领去大海对面，是去阻击那些肆意侵略的军队。哪怕最后沉在海里，我们墓碑上刻的名字也不至于让人骂一辈子了。”\n门外传来皮靴踩过水坑的声响，雪伊带着工会的登记册走了进来。\n她连看都没看巴罗一眼，直接抽出一支红笔，在调度单的联席批准栏上签下了自己的名字：\n“阿夏，别以为你又能一个人说了算。路上要是敢乱动平民，回来之后法庭接着审你。”"
PAU.38.a: "“去核对下舰队的登船名单吧。”"

PAU_zdgj: "如果这套办法管用的话"
PAU_zdgj_desc: "底舱里堆得乱七八糟，翻来翻去，连一件像样的正规军需品都挑不出来。\n大衣全是用帆布改的，领口上面甚至还印着面粉袋的红字；螺栓与垫圈用麻绳胡乱地捆在柱子上，扳手柄上居然还刻着不同机修铺的记号；最显眼的咸鱼桶边上，不知道被谁在箱子上写了行字：“省着点吃，别刚出海就全啃光了。”\n……等等，仔细想想，现在的同盟明明有炉子也有纺织厂，早就不至于穷到揭不开锅了，怎么大家装船还是跟逃难一个德行啊？"

PAU.39.t: "不要再搞封建迷信了啊"
PAU.39.d: "小果子正站在壁柜前，规规矩矩地整理着两盘刚蒸好的包子。\n柜子最上层摆着一张画像，上面是画着的是小遥和白夜。白夜本尊此时正大模大样地蹲在盘子旁边，欢快地舔着包子上的油脂。小果子合拢双手，十分虔诚地拍了两下手掌，嘴里还小声念叨着祈词。\n拿着几份物资清单的小遥从门口路过，看到这一幕立马呆住了：\n“小果子……你在那儿拜什么呢？”\n小果子挺起胸脯：\n“在向春日大明神和白夜大人祈祷今天库房的土豆不要受潮变质呀！”\n“哈？！春日大明神是谁啊？！”\n“就是小遥姐姐你呀！”小果子理直气壮地指着画像，“码头的大婶说了，小遥姐姐是带着神兽渡海拯救大家的神使。水手们也说出海前对着小遥姐姐祈祷，就能网到吃不完的大鱼呢！”\n小遥手里的清单差点脱手飞了出去：\n“什么大明神啊！我是大活人！”\n“还有，水手能捞到大鱼是因为藤井带队找准了洋流！”\n小遥顺手从盘子里抓起一个包子塞进嘴里，恶狠狠地嚼着：\n“听好了小果子，立刻把这个供奉我的架子撤掉！我都说了多少次了！我们是靠大家的双手把同盟建起来的，谁允许你们搞这种乱七八糟的封建迷信了？！以后全城谁要是敢借着这种理由搞迷信敛财，治安队直接按投机倒把扣他的钱！至于小果子你，罚你这星期的零食全归我吃！”\n小果子委屈地收起盘子，小声嘟囔着：\n“可是……昨天拜完之后，船厂的配件真的准时造出来了嘛……”\n我倚在门边，拿起盘子里剩下的另一个包子咬了一口：\n“小遥，你前段时间才说过的，神龛可以留着让大家互相打气？小果子只是祈祷土豆别受潮而已，又没逼人捐钱，更没有拦着谁去看医生。你不能非得到了看见自己画像的时候，就把所有人都当成借着迷信去敛财的骗子吧？”\n小遥瞥了一眼那张画像，别别扭扭地说道：\n“……我知道啦。刚才说得太过啦，对不起，小果子。”\n她伸手把画像从最上层拿下来翻到了背面，才把它放回了柜子里：\n“不过别再把我画得像什么神使一样啦，好不好？”\n小遥又用手指点向小果子的额头：\n“还有，罚你零食全归我吃这条……撤回一半。另一半算你包庇白夜偷吃包子的惩罚！”\n\n“看来春日大明神的法力确实挺灵验的。”\n\n“阿夏！你又跟着起哄！”"
PAU.39.a: "“春日大明神，保佑明天船厂吊车别掉链子。”"

PAU_ldwm: "请不要再为自己感到悲伤"
PAU_ldwm_desc: "故乡那些狂热的军阀以为掌控了战舰就能为所欲为。他们逼着孩子穿上军装去充当炸药，剥夺了母亲为战死儿子哭泣的权利，还妄图把整片亚洲拖进无底的深渊。\n他们当初把我们打成叛乱者，以为隔着大海就能把反抗的火种彻底踩灭。行啊，那就让他们睁大眼睛看清楚，从大海另一端开回来的，到底是一支什么样的队伍！\n告诉还在暗地里坚持的工友，告诉海峡对岸正在浴血抗战的同胞们：白夜同盟的远征舰队已经拔锚。\n这一次，我们回去当面做个了结，把眼泪与身而为人的尊严，原原本本地还给这片土地上的所有普通的人们！"

PAU.40.t: "如果他们看见现在的我"
PAU.40.d: "夜晚的风带着些许凉意，卷着海潮的咸腥味灌上了山坡。\n我看着膝盖上熟睡的白夜。脑海里挥之不去的，都是那些原本已经模糊的面孔。\n坐在前排喜欢在笔记本上画花球的美月，总爱跟我抱怨数学老师留的题目太多；造船厂那个爱抽旱烟的老车工，休息时总会悄悄从机床底下刨出烤得流油的番薯塞给我。那时候虽然大家手里都没钱，可谁也没想过去杀人，更没人成天把为国捐躯挂在嘴边。\n这场即将爆发的远征，在那些故乡人的眼里究竟是什么样子？\n当挂满火炮的庞大船队出现在海平线上，他们看见的是解救同胞的故人，还是跨海而来、企图摧毁他们家园的侵略者？\n我原本的一生应当平淡无奇：在放学时和同学们打打闹闹，休息时就逛逛街买买东西，下大雨时就躲在教室里不敢出来，或是庆幸自己鞋柜里刚好放着一件黄色雨衣。\n就这样，直到平凡地老去。\n究竟是从哪一天开始，我居然背负起了成千上万人的命运，带着整支异国舰队回去向生养自己的故土宣战呢？\n“一个人躲在这里发呆可不好，各舰的锅炉现在可都点着火了。”\n阿夏不知何时就在我身旁坐了下来。\n“阿夏，你说……老家码头上的那些熟人，看见我带着装满大炮的舰队开回去，会觉得我是个带来灾难的敌人吗？”\n“换作任何人，看见军舰堵在家门口都会感到害怕的。”\n“是吗……”\n“是啊……当年我自以为在履行军人天职，结果在工人们眼里，我成了屠杀同胞的刽子手。直到前几天我脱下军官制服在工地上推车，连发型都重新梳了个新的，他们才肯跟我搭话。”\n“我们开船回去，不需要他们对我们心怀感激。船上的大炮是为了去捣毁那些绑架了所有人的军部大本营的。等战火平息之后，你走下船，去街上买几个小吃什么的，坐在车站台旁边跟他们一块吃。到了那个时候，大家自然知道回来的究竟是谁了。”"
PAU.40.a: "“走吧，该登舰了。”"


PAU_llbg: "呼叫当年的暗号"
PAU_llbg_desc: "随着舰队逐渐逼近，小遥在通信机上调出了当年学生会与造船厂约定好的备用频段。那是她在逃难前夕与留在港口的同伴们最后约定的联络方式。既然舰队已经重返故土了，她迫切需要唤醒潜伏在本土的地下反抗组织，摸清那些要塞的布防与军部的巡逻盲区，去接应那些当年在警笛声中掩护她翻船逃跑的故人。"

PAU.41.t: "往日、老友"
PAU.41.d: "在通信机的指示灯跳动之后，刺耳的杂音突兀消散，频道竟然顺利接通了。\n小遥着急地念出了当年的暗号后，继续说道：\n“我是春日小遥！白夜同盟的舰队已经在近海就位了！美月，你们还在港口吗？！”\n听筒那头只有电流的啸叫声，就在小遥准备再喊一遍暗号的时候，对面的发射开关咔哒响了一声，传出了美月的声音：\n“春日小遥。你果然成了外国势力的枪手。”\n小遥先是在操舵台愣了一会，随后把话筒贴在了耳边：\n“美月？你……大家还好吗？其他人呢？”\n“当年的罢工者全被军队清算了。”\n“包括当年的老师，也是我亲自签署的告密书。多亏了他，我现在已经是造船厂女子挺身队的队长了。”\n听筒里隐约能听见那边整齐划一的军靴踏地声与狂热的口号：\n“你以为带着几艘外国破船能改变什么？全校的学生都在争相报名军队，连十多岁的孩子都在工厂里装填炸药呢，大家都迫不及待要去炸沉你们这些叛国者。”\n“是你们背叛了国家，听懂了吗？劣等国民春日小遥。”\n嘟——嘟——嘟——\n频道被单方面切断，重新变回了一开始的电流杂音。\n…………\n“……阿夏。”\n“我在。”\n“通知各舰，主炮解除保险。”"
PAU.41.a: "“……准备迎击敌舰。”"

PAU.42.t: "美月的日记"
PAU.42.d: "通信机在警报尖啸中断开了，但发射机底座的电传打字机却没有停下来。字轮与色带哒哒哒地走字，吐出一截预先打好孔、被强行塞进高速发报槽的纸带。\n那是美月早已卷好在轴芯里的私人电文。\n纸带上的油墨杂乱无章，记录着这几年里那个小镇上发生的事情：\n\n“四月十二日\n佐藤家的次子在大陆战死的消息传回那天，佐藤太太在院子里跪了一整天。她一声都没有哭出来，手里甚至还在不停地缝着准备留给孩子的白布，因为街道里长说，为国捐躯是我们身为樱花国民的无上光荣，家属若是落泪便是对英灵的不敬。\n大家都在害怕。大家谁也不敢交谈，大家害怕脸上的哀伤被当成不忠诚的证据。母亲咳得越来越厉害了，家里剩下的吃的也已经见底了。小遥，我好想念过去我们在走廊下躲雨的黄昏，那时大家脸上的笑容，究竟是从哪一天开始彻底消失的呢？\n\n五月十八日\n教官在课桌前握住了我的手。他的态度温和得令人害怕，他说老师私下珍藏的外国诗集会动摇前线士兵的意志，若是士兵犹豫，就会有更多像佐藤家那样的年轻男孩子死在战场上。他说他拿走书本是为了医治老师的糊涂，是为了保护大家。\n我相信了他。我带着宪兵翻开了教室的地板。\n直到老师被推上卡车、他年幼的女儿哭倒在泥水里捡拾撕碎的图画时，我才跪在地上明白过来，是我亲手将敬爱的老师送进了深渊。\n\n八月二十日\n母亲昨晚在工位上倒下了，再也没有醒过来。她闭眼前抓着我的衣服，反复向我道着歉，愧疚着仅仅因为自己生病就拖累了整个国家。\n今天清晨，我跟着挺身队去码头给开拔的运兵船送行。甲板上站满了与我们同龄的孩子，他们头上绑着白布，微笑着向岸上挥着手，大声唱着出征的歌。\n要是我现在背叛了国家，我又该怎么面对出卖老师、失去母亲的痛苦呢？\n小遥，你千万不要再回来了，因为我已经彻底变不回从前的那个美月了。”"
PAU.42.a: "……"

PAU_byzc: "大家都可以哭出来了"
PAU_byzc_desc: "军国主义的残火熄灭了，但空气中依旧弥漫着恐惧与绝望的死寂。街道两侧的门窗仍然紧闭着，站在门缝后面的市民也照旧用看待魔鬼般的目光注视着巡逻的队伍。在疯狂的教条里浸泡了不知多年的土地，如今早已装满了难以愈合的创口与戒备。想要把被扭曲的人心一步步拉回人间，是没有任何捷径可走的。"


PAU.43.t: "喂！我的巴罗连长"
PAU.43.d: "枪声停下以后，战壕里只剩下十几个被军官丢下来断后的敌方少年兵。\n按照军团以前的战地条例，清理这种战壕最稳妥的办法，就是撞见还喘气的敌兵直接补上一枪。可那个从公社新分过来的新兵已经帮着抬出了两个还活着的孩子了。\n巴罗也端着枪跟在新兵身边，替他盯起了周围的动静。\n走到战壕拐角时，水坑里还陷着个腿骨断了的孩子，满脸污泥，嘴里含糊不清地喊着什么。就在新兵挡在巴罗身前要把水壶递过去的时候……\n“万…万岁！！！”\n原本奄奄一息的孩子突然睁开眼睛，拽动了一直压在身子底下的拉火索，要和眼前向自己递水的另一个孩子同归于尽。\n“趴下！”\n几乎就在同一时间，身后的巴罗将蹲在死角里的新兵直接撞进了拐角后面。\n炸药在战壕里爆开，扬起的泥土劈头盖脸地砸落了下来。\n我急忙冲上前扒开了泥块，只见巴罗后背已被弹片炸得血肉模糊。\n而那个新兵，那个从公社调来的新兵，正满手是血地拿急救包按着巴罗后背的伤口。\n我的视线变得模糊了起来，立马冲上前抓起他的衣领，带着胸腔里所有的怒意冲他吼着：\n“你是蠢货吗？！战地条例背到狗肚子里去了吗？！”\n“他腰上没有枪……我已经看过了，他明明没有枪的……”\n“是他自己伸手跟我要水喝的！他腿都断了，为什么要拿这个骗我过去啊？！早知道我刚才就不该管他死活，直接开枪打死他了！”\n我刚想继续骂他，一只手掌用微弱的力气抓住了我的手腕。\n这是巴罗的手：\n“阿…长官……啊，又叫错了……你现在是施工员来着……”\n“少说话，留着力气等医护兵过来。”\n“别骂这小子了……他刚从厂里出来……哪见过这帮疯子……”\n巴罗费力地呛出一口黑血，抓着我的手腕，字句在喉咙里断断续续：“这帮军阀……把自己的孩子都训成了畜生……我们不能……不能也变成那样。”\n“换作我们当年……在工区朝平民扣扳机扣得眼睛都不眨，早他妈烂透了。别让这群年轻的孩子……也学成我们这副德行……”"
PAU.43.a: "……"

PAU.433.t: "喂！我的巴罗连长"
PAU.433.d: "巴罗费力地从上衣口袋里摸出当年被他砸在柱子上、后来又被他悄悄捡回来的军团勋章，塞进了我的手心：\n“阿夏。”\n“在听。”\n“等回了南美……判决书上的赔偿金，把我那份也扣了……全留给工区的孤儿。”\n“知道了。”\n“这一趟跑出来，死了以后……底下那些老百姓，总不至于天天在我坟头上吐唾沫了吧？”\n“不会。”\n“那就好……叫了十几年的长官……改口……可真是件费劲的事啊……”\n\n“……长官也好……\n施工员也好……”\n“这最后一次……换老子……给你下道命令……\n听好了……二连长巴罗命令你……放下枪……回老家去……\n……不准哭……长官……”\n\n“……不……傻丫头……\n阿夏”\n\n他的手掌从我的手腕上脱力滑落，永远停下了呼吸。\n不知道为什么，我突然就听不到了。\n队伍里的喊声、哭声、骂声、以及身旁那个新兵的抽泣声，\n这些刚刚还在耳边的声音全都听不到了，只留下一阵嗡嗡的耳鸣。\n\n直到医护兵扑过来按住巴罗的肩膀，耳边的风声才重新灌进耳朵里。我拔出腰间的配枪冲到那个死去的敌兵身前，对着那具残骸的方向扣动了扳机。\n一发！\n两发！\n三发！\n四发……\n\n打在了一旁的空地里。"
PAU.433.a: "“阿夏听到了，巴罗连长。”"

PAU_zxlk: "让我们再定一次规矩吧"
PAU_zxlk_desc: "当年我躲在船里逃命的时候，要是谁跟我说将来有一天我会带着舰队打回老家，我肯定觉得对方是在胡说八道。\n现在军部那帮指手画脚的长官枪毙的枪毙，关进大牢的关进大牢。可看着眼前乱成一团的烂摊子，我才发现真正的头疼事现在才刚开始呢。\n这片故土以后到底该怎么过日子？\n是干脆把两边大海的工厂与田地彻底连在一块，让造船工人与农民自己掌管工厂，建立一个谁也别想剥削别人的集体？还是索性推行彻底的自治，让每个小镇自己管自己的事？\n不管选哪条路，反正那些高高在上的恶魔们已经彻底滚蛋了。这一次，这几座岛屿的明天该往哪儿走，可是由我们自己说了算的。"

PAU.44.t:"以后"
PAU.44.d: "距离小遥最初接受代理大统领一职，已经过去了好几年了。联合议会按约公开了军费、粮仓和港务账目，各地代表也投票同意，在正式宪制方案确定前，暂时续任她为代理大统领，由她处理日常政务。\n“我说雪伊，你别死盯着那张写着红字的草案了，面条放凉了可就坨了。”\n小摊前，小遥正握着竹筷挑着面条。\n桌面上压着两份草案。雪伊和晓枫坐在了桌子对面。\n阿夏端着茶缸开口道：\n“埃文斯天亮前跑来找我。远征军听说以后工厂都要收归公家，以为手里那点私房钱要被抢走了，好几个水手吓得连夜去收拾行李了。”\n雪伊把大碗往桌上一顿，挺直身子反驳：\n“工会早就说明白了，安家费和私人物件谁也不准碰！但船厂、煤矿和铁轨是绝对不能归私人霸占的。所有的工厂产出分配，必须归全城工人一起说了算，省得以前那些老爷和奸商再骑到大家脖子上作威作福！”\n晓枫把碗里的汤吹凉，指着右边那份方案：\n“可各个小镇和码头的代表根本不同意。樱花的老百姓刚从兵营一样的管制里熬出头，一听全归上面管这几个字就害怕。他们希望各个镇子自己当家作主，大伙平起平坐搭伙过日子，上面少来指手画脚。”\n小遥咽下嘴里的面条，放下了筷子：“白夜同盟这块牌子我们肯定不能摘的。但这两条路确实挺让人犯愁呢。”\n雪伊盯着她转来转去的印章：“你自己的判断呢？你是大统领，不能只负责把印章递出去。”\n“我本来想说这叫……”小遥转着印章的手停了下来，“算了，我当然也有偏向。只是两条路我都有顾虑，万一选错了，最后还不是得让大家一起承担后果嘛。”\n小遥抬起脸，重新挤出笑容：“哎呀，我会把我自己的判断也写进去的，你们用不着担心啦。”"
PAU.44.a: "工厂会由工会联合会直接管理"
PAU.44.b: "颁布公社自治法案"
PAU.44.c: "听听小遥怎么说"


PAU.444.t:"不能总是以后"
PAU.444.d: "“说起来，那几个被我们催着限期加入的镇子，最近又送来信了。”\n小遥用筷子拨着碗里剩下的面条，继续说着：\n“他们想重新谈谈镇子里的事情到底该由谁做主。”\n她抬起头，看向雪伊，又看向晓枫。\n“现在想想，人家当时连拒绝的余地都没有。我拿着装甲连队和最后期限去催他们签字，他们就算签了，也不代表心里服气呀。”\n雪伊皱起了眉头：“可那时候要是不把各地联合起来，真遇上敌人了怎么办？我们总不能眼睁睁看着一个镇子一个镇子地被打垮。”\n“我知道呀，所以我到现在也不觉得当时的决定全是错的。”小遥挠着脸颊继续说道，“只是……有些事情一旦拖到以后，就很容易一直拖下去。等大家终于想起来要谈的时候，说不定连当初为什么答应都忘了。”\n“而且，我以前最讨厌的，不就是有人仗着自己手里有兵、有权，就替别人决定该怎么活吗？偏偏这回，我也成了那个替别人作主的人了。”\n一直没声的晓枫这时才点起了头。\n小遥把桌上的两份草案挪到了一起。\n“所以，我更想试试晓枫说的办法。”"
PAU.444.a: "……"

PAU.4444.t: "不能总是以后"
PAU.4444.d: "“我倒是有个问题。”雪伊用筷子夹走碗里的一根葱，“要是一个镇子的人都嫌麻烦，非要镇长替他们拿主意呢？”\n晓枫瞥了她一眼：“那也不能把镇子当成镇长的私产。”\n“可人家是自己选出来的呀。”雪伊慢悠悠地说，“镇长说要让大家过好日子，大家就选了他。结果转头就把工会赶出镇子呢？”雪伊向晓枫瞥了回去，\n“他还可以说，这是多数人的意思。”\n听到此话，小遥嘴里的面条停在了半空。\n“这、这算什么嘛！选镇长又不是买一送一，怎么连工人的嘴也附赠给他了？”\n“别光顾着生气。”雪伊敲着桌上的草案，继续说道：“有些工人连合同都看不明白，镇长却有一整个办事班子。工会就算写进了章程，也未必争得到自己应有的东西。”\n小遥低头看着自己的印章，忽然把它扣在草案上。\n“那就让他们自己来管呀！”\n“你要让每个工人都当镇长？”晓枫问。\n“才不是！那样每天光排队盖章就要排到明年了！”小遥把草案翻过来，在背面画了几个方框，“工人代表，农民代表，大家组成地方代表会。镇长可以管日常事务，但不能自己决定工人能不能组织起来。代表也要向选他们的人交代，干得不好就能换下来。总不能选个人上去，就连后悔的机会都没有吧？”\n晓枫凑过去一看：“那同盟的事情呢？总不能每个地方各管各的。”\n“所以还要有全国的代表大会呀。”小遥答得很快，仿佛早就想到了这一层，“各地选出代表，一起决定同盟的大事，再选出负责执行的人。至于怎么把工人和农民真正组织起来，就得有一个纪律严明的革命党来领导。不能只在事情顺利的时候才想起大家是一伙的。”\n雪伊终于笑了起来：“你反倒把事情想得挺远。”\n“那当然！我也是有认真考虑的时候的！”小遥得意地挺起胸膛，随即又把声音放低了些，“而且……要是所有事情都得我点头，那我哪天犯了傻，大家不就得陪我一起倒霉嘛？”\n她看了一眼碗里结成一团的面条，沉痛地叹气道：\n“不过，眼下倒是有个问题需要我亲自解决。”\n“什么？”\n\n“呜诶……面坨了诶！都怪你们，聊起政治怎么比吃饭还没完没了呀！”"
PAU.4444.a: "让各地公社自治联合。"
PAU.4444.b: "工会联合会掌握生产与分配。"
PAU.4444.c: "由革命党统一领导全国建设。"



PAU_thsg: "不能乱拿别人的东西"
PAU_thsg_desc: "那些关在大牢里的军官，他们到现在还在嚷嚷着军港库房里那些封存的箱子是皇国的战利品。\n这算哪门子的战利品啊，分明就是一堆明火执仗抢来的脏物嘛。当年那帮军官为了填饱侵略舰队的胃口到处劫掠，我们白夜同盟可不打算替这帮强盗藏污纳垢。\n如果想要让饱受战火蹂躏的各国人民相信这几座岛屿上的疯狂确实停歇了，我们就不能找任何借口继续推脱。拿了别人的东西，就老老实实送回去，这可是做人最基本的规矩呢。"

PAU.45.t: "今天的号外"
PAU.45.d: "“啦啦啦，啦啦啦，我是卖报的小行家……”\n“号外！号外！特大新闻喽！鬼子的大本营教人给端了！”\n“去去去，小鬼头大清早编什么胡话？”\n端着水壶的茶摊掌柜皱起了眉头：\n“前几天这儿防空警报还在响呢，鬼子还在前线扔炸弹呢，今天能让人给端了？我看你就是为了多卖几份报纸瞎嚷嚷，当心我抽你嘴巴子。”\n“谁编胡话了！”我抽出一份晨报放在了茶桌上，“您自己瞧！正面战场抗战到底，鬼子后方也炸了锅，鬼子被彻底赶下了台！那帮从南美来的船队今天一大早就停在泊位上，正往岸上卸当年抢走的发电机和钢材呢！”\n几个坐着喝茶的伤员立刻围拢过来，目光落在了报纸头版黑字上。\n“这……这上面写的是真的？”一个拄着拐杖的伤兵念出声来，“‘军部覆灭，抢掠物资原样归还’……‘沿江各厂被掠设备已全数起运交割……”\n江堤方向突然传来一阵雷鸣般的喧哗：\n“快去看啊！是真的！大船上的姑娘和水手正带着江防司令部的人验货呢！当年被鬼子抢走的东西都给拉回来了！”\n整条街的茶客轰的一声全站了起来，连茶钱都顾不上给了，跟着人潮争先恐后奔向江堤。\n掌柜抓着那份报纸怔在了原地：\n“这仗……打了这么多年……天真的要亮了？”\n我捡起桌上落下的铜板揣进布兜，甩动着手里的报纸，继续唱着歌向街口跑去：\n“啦啦啦，大新闻！小鬼子抢走的东西全送回来喽——！”"
PAU.45.a: "欢迎回家"

PAU_blsm: "地里的玉米熟了呢"
PAU_blsm_desc: "舰队跨越大海返回南美的时候，我和那个年轻战士带着巴罗的遗物，回到了同盟当初给他分好的那块农田边。\n地里的玉米结出的穗子金黄饱满。那个被他救下的年轻战士蹲下身，小心翼翼地掰下一把成熟的玉米放在墓碑前，替老连长磕了好几次头。\n但愿，长眠于此的故人能够安心，但愿，他们再也不会被战火所践踏。"

PAU.46.t: "不用改口了"
PAU.46.d: "田里的玉米熟透了，穗子压弯了秸秆，风吹过田垄，叶片撞在一起哗哗作响，听着就像当年二连那帮人拿抹布擦装甲的动静。\n那个被巴罗救下性命的公社新兵正跪在墓碑前，把刚掰下来的玉米穗和一盘烤土豆摆在石头上，头上磕得全是泥。他原本还想留下来帮我拔草，我嫌他在旁边碍眼，打发他去路口守着卡车，他才抱起铁锹跑远了。\n墓碑是用山石凿出来的，正中刻着“二连长巴罗之墓”，底下那行小字是工会添上的，写着“白夜同盟初垦拓荒者”。\n我从上衣口袋里摸出那枚沾着暗红血迹的勋章，塞进了墓碑顶端的石缝里。\n“喂，巴罗。上次在船坞碰面，你不是嫌施工员叫着拗口、舌头打结吗？”\n“现在好了，这片地里没外人，不用你费劲改口了。你想叫长官就叫长官，想跟咽气前那样没大没小地叫我傻丫头，也没人管你。”\n“你在战壕里给我下的最后一道命令，我可是一字不差地照办了。枪放下了，老家也回来了，你惦记着的那几垄玉米，那傻小子每天天不亮就跑来挑水施肥，结出来的穗子比你当年开的炮弹还沉。”\n“我今天过来，就是跟你说一声，抚恤金我让法庭连着我的津贴一块划给工区孤儿院了。二连剩下的那些跟你一样的老骨头现在都有田种、有饭吃，我自己也过得挺舒坦，你在底下没什么好操心的了。”"
PAU.46.a: "……"

PAU.466.t: "不用改口了"
PAU.466.d: "草叶上的露水打湿了我的裙摆，我在墓碑前蹲下来，伸手从铁盘里拿起一个还带着余温的烤土豆。\n那是新兵刚才在田埂火堆里煨熟的，外皮烤得焦黑起泡。我将里面金黄滚烫的沙瓤留在墓碑上，随手把剥下来的焦皮塞进了自己嘴里。\n刚咬了第一口，一股刺鼻的焦糊味就在舌根炸开了。\n“……呸。骗子。”\n“又苦又涩，连舌头都麻了……你这个满嘴胡话的老混蛋，这种跟木炭一样的东西，到底哪里好吃了啊？”\n“十四岁刚进兵营那年，我连机枪卡壳该拉哪道栓都分不清，夜里听见山里的枪声，只会缩在破毯子里哭着喊妈妈。也是这么冷的天，巡逻路过的你掀开了帐篷，从大衣里摸出个烤土豆塞给了我。最中间那点烫手的沙瓤全让你抠给我了，你自己只啃外圈这些又黑又苦的硬皮，还跟我吹牛，说成熟的老兵就爱挑焦的吃。”\n“我那时候真蠢，居然信了你那么多年。”\n碑面上的刻字糊成了一团灰影，咸涩的水全混在了我的嘴角，和那口焦黑的土豆皮搅在了一块。\n“后来木棉团长不在了，晓枫也带人走了，全营的嘴都指望着我。我不敢哭，也不敢跟人说我害怕，只能天天板着一张死人脸，学木棉团长那样背着手在队列前面……可我装给谁看啊？巴罗，我心里怕得要死啊！”\n“每天早上集合哨一响，我都怕掀开帐篷帘子又少掉几张熟悉的脸；去法庭受审那天，你在台阶底下要把坦克开出来替我拼命，我揪着你的衣领冲你大吼，其实……我就是怕你又去送死，我才凶你的啊！”\n我把额头抵在墓碑上，抓紧脚边的湿泥，像当年那个躲在帐篷里的小姑娘一样哭出了声：\n“你教过我怎么开战车，教过我怎么拆装机枪，教过我怎么在死人堆里活下来……可你临走前命令我放下枪回老家过日子，你自己倒是一闭眼睡大觉去了，谁来教我怎么种地、怎么不带枪过日子啊？！”\n“……我听话了，巴罗。我没有在那个新兵面前掉眼泪，也没有再拿枪指着同胞了。这盘剥好了皮的土豆给你留着，算我还你的……下辈子别再啃那些木炭了，听见没有？”\n田里的风迎面吹了过来，玉米叶再次哗哗地响成了一片，就像巴罗那伙人正在耳边骂骂咧咧地起哄一样。\n我擦干脸颊，对着墓碑回敬了他当年在法庭台阶下给我的那个军礼。\n“走了，巴罗连长。明年玉米熟的时候，我再来看你。”\n“……你们几个在底下都把嘴闭严实了。谁敢笑话我今天哭鼻子，等以后我也下来了，非得把你们挨个揍一顿不可。”"
PAU.466.a: "我们……谁都不许再迟到了"

PAU_wdct: "电车站台"
PAU_wdct_desc: "当年为了铸造炮弹被拆毁的电车轨道，终于由工友们重新铺设完毕了。通电的架空线在海风中划出整齐的弧线，电车在一声清脆的铃铛声里驶进了站台。\n那些在噩梦里回响的警报已经彻底远去，现在，它们变成了每一趟按时进站的叮当叮当声。"

PAU.47.t: "下大雨那天"
PAU.47.d: "学校车棚的长椅上，正咬着汽水吸管的千夏用手肘撞了我胳膊：\n“喂，小遥，你记不记得以前你经常放在鞋柜里的那件黄色雨衣呀？”\n“哪件？……你干嘛提这个？”\n“那天下了好大的暴雨，我忘带雨伞，自作主张从你柜子里翻出那件雨衣套着跑去车站。你母亲那时候老是唠叨你粗心大意，所以特意在领口内侧写了‘春日小遥’，我没说错吧？”\n“是写了…怎么……”\n“我才刚到检票口，几个巡警莫名其妙冲上来把我按在地上，大声嚷嚷抓到了通缉犯人！后来我才知道，你那天下午被挂上了紧急通缉，正好我又穿着写着你的名字的雨衣……”\n“我一开始还拼命喊‘我是佐藤千夏’呢！结果那帮家伙说春日小遥只是在码头犯了点小错，现在坦白交待的话就能从轻处理，家人也不会受到任何牵连。”\n“你信了？！”\n“对！我信了！本姑娘还是把心一横，直接大喊：‘没错！我就是春日小遥！有本事的都冲我来！’——哇，那巡警气得脸都绿了，非要我交代什么工会的据点和逃跑路线，还把我塞进拘留所关了好久好久，哪怕后来查清楚了也没有把我放了！最后……是二哥把去往满洲的志愿书拍在桌上然后立马磕头道歉，他们才肯放人。不过，雨衣在挨打的时候就被扯烂了……二哥走前还让我别哭，说等他回来了给我买件更好的……”\n我嘴里的点心咽不下去了。"
PAU.47.a: "……"

PAU.477.t: "下大雨那天"
PAU.477.d: "当年翻进船里的那天……\n原本封锁码头的警车拉响警笛离开，几乎全部的搜捕巡逻都冲向了电车站台……\n还有前几天在舰桥上……\n佐藤家的次子。千夏的二哥。\n她明明早就收到那张阵亡通知书了。可她现在却坐在这张长椅上跟我假装，假装那个答应给她买新雨衣的二哥只是出了一趟还没回来的远门。\n千夏感觉到我的视线，疑惑地和我对视了起来：\n“……喂，小遥？你怎么愣住了？……该不会真生气了吧？我可是替你挨了打哎，一件雨衣而已，你不会这么小气吧……”\n我伸开双臂，突然扑上前抱住了千夏的脖子，把脸深埋进了她的肩膀里。\n千夏被撞得差点从椅子上掉下来，有些手足无措地扶住椅背：\n“哇……小遥你今天怎么回事呀？突然抱过来干嘛，好肉麻哦。”\n我从喉咙里发出了心疼的哽咽：\n“……赔我。”\n“大傻子……快把雨衣赔我。”\n千夏彻底呆住了，感受到肩窝里滚烫湿透的眼泪，刚才还耀武扬威的大英雄突然慌了神。轻抚着我的后背：\n“别骂了…对不起嘛…那件雨衣是你妈妈亲手缝的，肯定特别珍贵对不对？！别哭了小遥…我赔你……”\n说到最后，千夏自己的声音却也跟着颤抖了起来，再也坚持不下去了。\n\n“……别哭了，求你别哭了，好不好……\n都怪你……突然抱过来干嘛啊……\n再这样下去的话……\n我也有点想哭了啊…………”"
PAU.477.a: "一定要赔我一件一模一样的啊，笨蛋"
PAU.477.a_tt: "§L连名字，也要写得一模一样……§!"

PAU_els: "既是同路人，总得打声招呼"
PAU_els_desc: "听说北方有一群推翻沙皇统治的同伴。虽然我们双方说的语言完全不同，小遥也对那些冗长刻板的理论文稿感到头疼，但大家都是为了让普通人有口饭吃而拼过命的人。派遣代表团渡海前往莫斯科，互递免于冲突的友好通报。哪怕彼此隔着广袤的荒原，至少得让北方的同胞知道：在这里，同样有一群不肯向压迫者低头的同行者在努力生活着呢。"

PAU.51.t: "请你先从桌子上下来"
PAU.51.d: "“……苏维埃政权之所以存在，就是要证明普通劳动者有能力掌握自己的命运。我们全联盟的电气化不仅是一个工业指标，它更是为了让每一个偏远乡村的孩子都能在电灯下读书……”\n小樱站在展开的规划图前，正认真地对几名委员阐述着构想。\n“真好啊……连那种山沟里的孤儿院，也给画上电线了吗？”\n一个白发少女不知道什么时候坐在了地图的一角，怀里那团白色小动物正伸着爪子，好奇地去够茶炊的开关。\n小樱手里的尺子停在了空中。\n“警卫！……等等，等等，外面的迎接仪式刚刚开始，你怎么自己跑到偏厅里来了？还有，谁允许你坐在桌子上的？！”\n“这样就能看得清楚一点了嘛……”少女咽下嘴里的面包屑，笑着挥手，“我是白夜同盟的大统领。外面那些交接手续的速度太慢啦，我就自己先溜进来了。放心好啦，鞋子在上桌前就已经脱在门边上了呢。你画得真仔细啊，小樱同志。”\n小樱放下尺子，突然用充满庄重充满威严的声音开口了：\n“春日同志。苏维埃始终注视着对岸的斗争。你们捣毁了军国主义的大本营，将掠夺的资产原样还给受难的邻邦，工会的情报我都看过了。只要你们是真心为了劳动者而战，这里永远认可你们的努力。”\n说到这里，小樱庄重肃穆的神情突然垮了下来，她指着桌子上的白夜，鼓着脸嚷道：\n“但是！光脚踩了一地灰再爬上桌，这哪里干净了啊！而且那个小家伙刚才把果酱全吃光了！那可是给今天会议准备的茶点啊！”\n“小樱同志，别那么小气嘛。”小遥从桌上跳下来拍了下衣服，“听说你们这儿也在为了大家能过上好日子而努力，我就坐着列车顺路过来打个招呼。怎样，要不要跟我们联手组个互助的条约联盟什么的？”\n小樱重新整理好桌上的图纸，两手抱在胸前说道：\n“联合的前提，是你们必须彻底杜绝资本的垄断与复辟，确保每一个工厂都由工人自己说了算。另外……以后开会的时候，严禁这个小家伙靠近任何图纸！”\n“成啦！”小遥笑眯眯地拉过椅子坐下，“那现在，能让同志们再送一碟浆果来吗，小樱同志？”\n小樱看着眼前这个毫无拘束的异国领袖，无可奈何地摇着头：\n“真是不讲规矩……不过，欢迎来到莫斯科，春日同志。”"
PAU.51.a: "欢迎白夜同盟加入第三国际！"
PAU.51.b: "先保持观察。"


PAU_zg: "我们以后就是邻居了"
PAU_zg_desc: "运送退还物资的船队陆续靠上周边各国的港口码头，站在栈桥上接应的，是同样穿着普通工装的工友代表与抗战老兵。他们清点完木箱，关切地询问起这边的船厂工人是否有足够的口粮过冬。\n这才是我们渴望见到的邻邦。对岸掌权的是在焦土上浴血奋战出来的新政权，他们深知被压迫的滋味，也最懂得和平的分量。\n同盟正式宣布废除过往政权强加于邻国的一切不平等条约，彻底放弃所有海外特权与据点。将造船厂新造的民用钢材与机器零件源源不断运往各处受灾的港湾，全力支援邻邦重建被战火毁坏的城镇与铁道。握紧彼此的双手吧，从今天起，我们平起平坐做真正和平友好的邻里。"

PAU.48.t: "握手"
PAU.48.d: "她跟当年端着刺刀横冲直撞的侵略者毫无相似之处。\n在我们中间的，是一份联合条约。那帮推翻了樱花的军国主义的年轻人，在草案里主动抹掉了过去强加的所有特权，甚至提出由他们出动护航舰队，替我们在外海警戒西方列强的战舰。\n“长官……”这位来自樱花的水手仍然带着一副紧张的样子，将一份条约推到了桌上：“如果你们的海岸需要保护，我们愿意替你们挡在风浪最大的地方。”\n我按在桌面上的手掌碰到了她因弹片留下的伤疤。\n这场仗打了太多年，多少连队打光了番号，多少村落化作了焦土。面对这个来自樱花的年轻人，要咽下过去的血仇绝非易事。\n可看着那双满是诚恳与忐忑的眼睛，我知道，坐在对面的人已经不再是当年那帮畜生一样的侵略者了，她是同样从地狱里爬出来的同胞。\n我向她伸出了自己的右手。\n年轻水手愣住了，随即慌忙伸出满是伤痕的手迎了上来。\n过去的深仇大恨交由历史的人民们去裁决，而眼前的这双手，值得我们以平等的尊严友好相待。"
PAU.48.a: "既然推翻了暴政，那便坐下来谈谈和平。"
PAU.48.b: "收下物资与诚意，但我们暂且保持独立自主。"

PAU_zg_fd: "旧账还了，换下皇帝可免谈"
PAU_zg_fd_desc: "对岸海港里收下了我们退还的全部物资，可统治者居然是个穿着朝服、做着朝贡帝国大梦的封建余孽，甚至还有军阀企图将战火反向烧向我们的海湾。\n小遥在回电的公函底下用很重的力气盖上了白夜同盟的印章：当年的掠夺是帝国的罪行，我们低头退赔是为了对得起海峡对岸受苦的百姓；但这可不代表我们会向另一个骑在人民头上的新皇帝下跪！\n我们连本土的狂热军阀都亲手砸碎了，更不可能容忍任何外来的独裁者对同盟指手画脚。同盟正式重申底线：物资归还完毕，领海互不侵犯。如果对岸的官僚企图以战胜者自居发动新的战争，布防在沿海的岸防大炮与各舰炮口，随时准备给那些看不清局势的野心家好好上一课。"

PAU_mdg: "少拿骨头架子吓唬人"
PAU_mdg_desc: "那个自称魔导国的国度传来的消息令人作呕。一个顶着王冠的白骨骷髅，居然带着一群嗜血的怪胎在欧洲建立起奴役活人的亡灵帝国。我们在南美早就领教过亡灵怪物的残忍，那些被死气吞噬的荒野到现在都让人心有余悸。我们头顶上的天空，无论如何也不能任由一群行尸走肉来主宰！"

PAU_sbwg: "请先守好自己的家"
PAU_sbwg_desc: "圣杯本土的议会大体上接受了远征军留居南美的既成事实，大海两端总算迎来了长久的安宁。那些留在这边的水手与家属已经融入了社区，海对面的议会也明白劳师远征只会自讨苦吃。我们会与圣杯王国正式签署“永久”和平协约：双方各自尊重对方的边界，圣杯留在本土继续搞他们的议会政治，白夜同盟在两块大陆上建设属于人民的家园。只要那帮议员不派军舰到我们的水域游弋，彼此安安稳稳过日子便是最好的结果。"

PAU_bm_hp: "能握手就别拔枪"
PAU_bm_hp_desc: "隔着辽阔水域相望的北美大陆拥有着庞大的工业力量。尽管那里对我们这套制度指指点点，但老百姓刚刚从战火里缓过劲来，谁也不想再去打一场耗费无数生命的跨洋大战。只要对方识趣地缩回伸向海洋的触角，承认同盟在两岸的主权，我们就愿意与他们结盟。大家一起发展，总好过将年轻的孩子送进战壕里送死。"

PAU.50.t: "省下的军费归谁"
PAU.50.d: "“不可抗力滞留？！远征军居然在回信里声称全军遇上了不可抗力？！舰队、水手，现在全在南美港口当上了机工和农场主，甚至在信里附上了跟当地姑娘的结婚公证书！”\n“议员阁下，比起他们的婚礼，你最好先看看随信附上的远征军尾款报销单。”\n财政大臣翻开手里那份荒唐的绝密文件，照本宣科地念了起来：\n“第一项：过去几年远征舰队的整编维护、防务工程与全军安置垫款，共计八亿六千万圣杯币；第二项：在港皇家舰群的船体大修、重油储备征用与船坞扩建费；第三项：由于本国议会单方面冻结账户，全军将士被迫以舰队与矿区产权向白夜同盟签署基建抵押贷款……如果王国现在要求撤回舰队，必须先向南美港务局结清十四亿圣杯币的留置违约金。”\n“这是彻头彻尾的敲诈！派舰队去把船和人全抓回来！”几位老将军气得拍案而起。\n“好啊，那派舰队去讨伐吧。”财政大臣把本子往桌上一扔，“调主力战列舰编队横跨大洋，算上征用远洋补给船团、满载战备弹药和往返损耗，光出兵就得先烧掉三十亿圣杯币！打赢了带回一片废墟和几千名失业难民领救济金，打输了海军造船厂直接破产。请问各位阁下，这三十亿军费从谁的选区税收里扣？”\n刚才还在叫嚣维护王国尊严的贵族们你看看我、我看看你，全把脖子缩回了椅子里。\n“各位，其实也不用那么悲观嘛。”负责海关的商会代表抓准时机说道：“他们在附言里提到了，只要我们签署事实上的和平贸易协议，那十四亿违约金当场一笔勾销，南美港口的免税泊位明天就能对我们的运粮船开放，连咖啡豆都不收离港税呢。”\n议长甚至懒得再走辩论程序，直接伸手按响了表决铃。"
PAU.50.a: "签字吧，就当我们在大西洋买了个便宜货栈。"
PAU.50.b: "我们不会咽下这口恶气的！"

PAU.49.t: "既然谁也不想开战"
PAU.49.d: "“……等等，你是说那个在大洋上打赢了樱花舰队的统领，实际上是个十多岁的小姑娘？！”\n“千真万确。春日小遥，原本是个连身份证明都不齐备的流亡者。她带着两艘改装船起家，拉拢了南美的佣兵与工人，强行攻克了樱花帝国的要塞。现在……现在她以白夜同盟的名义向我们递来公函，提议建立一个联合互助的联盟。”\n一名主张动武的军官按捺不住地插话进来：\n“这帮家伙根本就是一群不按常理出牌的反叛者！如果放任他们在对岸立足，大洋上的航道迟早……”\n“行啦，少拿那些陈词滥调来烦我。”我打断了他的唠叨，“你们要是真有本事，怎么之前不敢开着战舰去跟樱花碰一碰？人家带着一群穷工人和破船就把不可一世的樱花给掀翻了，现在回过头给我们送来停火协定，问我们要不要搭伙守护这片水域。”\n我翻开那份协定草案，上面的条款直白坦率：\n“对方承诺尊重北部的领海边界，开放商贸航线，还主动提出共同防范那些企图跨海侵扰的殖民舰队。你们看看这上面的字句，‘谁也别想让自家的年轻人继续送死’，这可比那些老贵族虚伪的客套话真诚多了。”\n参谋官的语气有些迟疑：\n“那……您的决定是？”"
PAU.49.a: "批准联盟请求，白夜同盟是值得信赖的盟友。"
PAU.49.b: "我们拒绝与异国流民建立任何军事同盟！"

PAU_bm_kz: "真当白夜同盟好欺负？"
PAU_bm_kz_desc: "北美那些唯利是图的财阀显然坐不住了。他们看着我们砸碎了樱花帝国、解放了各地的工厂，害怕这股平等的火苗烧到他们自家的庄园与矿山里去，甚至在暗地里调动战舰企图封锁我们的航线。小遥站在海图前冷哼了一声：真当从南美一路冲出来的白夜同盟是任人拿捏的软柿子吗？！既然这帮大亨非要将战火烧到我们头上，那就迎战到底吧，彻底杜绝帝国主义在太平洋上的一切霸权！"

#A（世界革命）
#判定条件：与苏联成为盟友、与中国革命政权联合
#与 PAU_hpgc、PAU_zdbf 互斥
PAU_sjgm: "革命的日子还没到头呢"
PAU_sjgm_desc: "莫斯科的回电到了，对岸中国工友的回信也到了！他们接住了我们递过去的手，要和各地反抗压迫的人们互相支援。\n我当年以为带着大家逃出一条生路，就算万事大吉了。可看看这张地图，海那头还有无数人在皮鞭底下流血呢！我们好不容易走到了今天，总不能眼看着别人受苦，却连一封回信、一船药品都不肯送过去吧？\n各工区立刻准备军需物资，货轮装载钢材、药品与机器零件，随时待命出海。愿意与我们共同斗争的力量，可以来谈合作、提要求；需要援助的地方，将由同盟共同商议对其的援助方案。至于当地的人想走哪条路嘛，当然还是要靠他们自己决定才行的。\n我可不敢说自己什么都懂，更没本事替全世界的人安排好所有的明天。不过，既然我们已经有能力帮上一把，那就再也不要装作什么也没看见了！\n白夜同盟从今天起，要做全世界反抗力量靠得住的好伙伴。如果有谁愿意和帝国主义斗争到底，就来谈谈吧。这回，我春日小遥第一个奉陪！"

#B（和平共处）
#判定条件：圣杯议会批准和平、北美联合、中国维持和平
#与 PAU_sjgm、PAU_zdbf 互斥
PAU_hpgc: "看吧，和平才是最强的奇迹"
PAU_hpgc_desc: "回信都送到了！圣杯的议会撤回了战舰，北美同意尊重边界，邻邦也接纳了我们的谢罪与友善！\n以前那些大人物天天叫嚣着弱肉强食，断言不同旗帜下的人注定要互相残杀到死。那么！现在就让他们睁大眼睛看清楚，我们这帮曾经一无所有的普通人，终于彻彻底底在两块大陆之间建起了一个不用互相开火的和平世界！\n从今天起，把武器收进仓库吧，造船厂全都开足马力去造客轮和渔船吧！我们不仅要活下去，还要活得比谁都舒服、比谁都热闹，向世人证明普通人能够靠着双手守护属于自己的明天！"

#C（武装中立）
#判定条件：失败拒绝承认友好、与北美敌对、与中国反动政权敌对
#与 PAU_sjgm、PAU_hpgc互斥
PAU_zdbf: "有本事就放马过来啊！"
PAU_zdbf_desc: "海对面那些傲慢的帝国居然把我们的和平协约扔了回来，还妄图将我们当成可以随意拿捏的流民？！\n那可真是给他们脸了！我们跨越大海打碎了自家的军部，可不是为了跑去向另一群殖民强盗低头讨饶的！他们要是想在海那边继续争权夺利，就由着他们烂在自家的泥潭里去吧！\n不管哪路帝国主义的军舰敢把炮口对准同盟的水域，我就带着舰队把它们轰进海沟里去！谁想封锁我们的航线、逼我们低头，就先掂量掂量自己付不付得起这个代价！"

PAU_cxzm: "我们与国同罪"
PAU_cxzm_desc: "我以前总觉得，只要有一天能把事情做个了结，人就能轻松一些。那些年发生的事，死去的人，做过的选择，还有每次听见枪声时，我心里偷偷盼望着枪声赶快停下的自己。等到一切终于结束，我就可以回头看看，然后告诉自己：那时候没办法，换了谁都会那样。\n这句话听起来多么像真的啊。只要说的人够多，说的时间够久，连自己都会相信。\n可我总在想，如果一个人做过的事，只要等到风向改变就能换个说法；如果一个国家犯下的罪行，只要换一面旗帜、换一批名字，就能从所有人的记忆里抹去，那我们这些拼命活到今天的人，究竟是在等什么呢？\n我不想再替过去寻找一个让自己睡得安稳的说法了。我也没有资格替那些已经无法开口的人，决定他们应该原谅谁。\n我们总要有一天，敢于把自己做过的事看清楚。因为我想让今后的孩子知道，人的良心不该由胜负决定，做过的事情也不该由谁掌权来改写。\n\n我希望有一天，我们终于能够平静地谈起这段往事。到了那时，我希望自己可以坦然地听着……"

PAU.52.t: "喂、喂，听得见吗？"
PAU.52.d: "“喂、喂？一、二……听得见吗？后面电车站旁边那个咬着肉饼的大叔，能听清我的声音吗？听得清就挥挥手让我看见——啊，看见了看见了，扩音器效果还挺不错的呢。”\n高台上的小遥调整着话筒的高度，声音顺着街角的几个大喇叭在整个街区飘荡着。\n台下站满了市民、脱下袖标的学生与集结的工友，大家都屏息注视着台上那个新任领导者。\n“站在这儿之前……我其实拖了很久、特别久啊。”\n“战火平息了，电车也通了，条约也签完了，我才磨磨蹭蹭走上台。”\n“因为我很心虚啊。真的很心虚。”\n“当年军部开着战舰去蹂躏海峡对岸、把成千上万的人推进深渊的时候，我除了像个懦夫一样继续逃亡，什么都做不到。现在站在这儿说话，我都觉得脸颊发烫。”\n台下一片寂静，无数双眼睛都纷纷望向了高台。\n“这几天，好多代表私底下跑来跟我说。”\n“他们说，小遥啊，现在大家都打赢了，你就当个好人，告诉大家过去的事全是一场误会。”\n“就说大家无非是受害者嘛。母亲不敢哭是因为害怕，学生告密是因为肚子饿，士兵开枪是因为军令连坐。就好像大家一起抱头痛哭一场，把罪名推给几个死掉的长官，过去的血迹就算彻底擦干净了一样。”\n\n“是啊，大家都是被迫的，一切都是上面那帮已经被审判的恶魔干的。只要把眼泪擦干，明天大家就又是一个清清白白的好人了。”"
PAU.52.a: "……"

PAU.522.t: "喂、喂，听得见吗？"
PAU.522.d: "“……可这算什么啊？！”\n“这是在开什么玩笑啊！！”\n“法庭没有把一线士兵和普通百姓一概定罪，是为了让这座城市免于无休止的私刑与复仇！那是法律的底线！！那是法律给活人留着种地开车的台阶！可我们凭什么把法官的饶恕，当成自己良心无罪的奖状啊？！”\n“邻居家被搜捕的时候，我们关上了门窗；\n老师被拖走的时候，我们低下了头颅；\n对岸的城镇被烧成焦土、捷报传回街道的时候，我们一边吃着抢来的粮食一边跟着收音机挥舞着小旗高呼万岁！”\n“如果今天我随口说一句‘大家都受了委屈、过去就算了’……那海峡对岸死在烈火里的人算什么？那些被出卖的师长算什么？那些被逼着死在异乡的年轻孩子又算什么啊？！”\n\n“下达命令的长官，该处决的已经处决，剩下的送进监狱服刑；靠着告密和充当爪牙换取特权的人，名下侵占的房屋和田产全部依法充公，退还给受害者的家属；军国组织的骨干分子，剥夺一切任职资格，明天就会迎来公庭的审判，法庭就在政府大厅门口，每一笔罪责都会查得清清楚楚。”\n她放下文件，目光扫过台下攒动的人群。\n在广场最边缘的那根电线杆阴影下，一个穿着破了好几个洞的衣服的女孩正背靠着墙壁，怀里还抱着一本画着花球的笔记本，她把脸埋在了手臂里，肩膀剧烈地抽动着。\n\n“但是，除了法律的审判，以后……再也不会有人替我们做善恶的选择了。”\n“我今天站在这里，可给不出什么皆大欢喜的答案。美月给不出，台下的你们给不出，我也给不出。”\n“明天早晨醒来，我们去工厂工作、去学校教书、去跟邻居打招呼……遇见曾经被自己伤害过的人，也别急着装作什么都没发生。该道歉的道歉，该承担的责任就给我好好承担。”\n“散会了！回家去，好好想想明天的早饭，好好看着身边，还活着，还没被自己伤害过的人。”"
PAU.522.a: "“大家……全都好好想一想啊！”"



PAU_fby: "白夜本来就是只野兽"
PAU_fby_desc: "小遥抱着白夜走上老家后山，来到那座空置已久的神社前。\n当年她带着白夜翻上船，害怕这个山里的小家伙被抓走。后来在大海对岸的南美，她拿白夜的名字当挡箭牌建立了同盟，大家甚至在街头给这个贪吃的白夜立起了神龛。\n如今，枪声、炮声、所有的有关战争的声音都彻底停歇了：\n“两边的仗都打完了，海里再也不会冒出吃人的怪胎，人类这堆麻烦事也用不着你来扛着。回去当你的野兽去吧，抓松鼠也好，在树洞里睡大觉也行，爱去哪儿去哪儿。”"

PAU.53.t: "回家"
PAU.53.d: "我把白夜从怀里放下来的时候，它还有点懵，歪着脑袋一直瞅着我。\n“走啦，野兽就该回林子里去。”\n我冲它摆手催促：\n“两边的仗都打完了，老老实实抓松鼠去吧。省得天天跟我抢咸鱼吃，笨蛋。”\n说完，我没等它反应过来，一路小跑下了山。\n拐过两个窄弯就到了。巷子尽头那扇木门还斜挂在门框上，院子里的杂草长得比人还高，原先用来盛雨水的铁盆也锈出了几个黑洞洞的窟窿。\n踩上走廊的时候，木地板发出了空空的嘎吱声。\n这里……很安静呢。\n“……喂！老头子！”\n我站在玄关大喊：\n“你藏在收音机电池盒里的那点私房钱，我当年逃跑的时候全拿走啦！连一毛都没给你留！你气不气啊？！”\n风穿过破损的障子门，吹动着屋顶悬挂着的蛛丝。\n“……老妈！你腌的梅子难吃死啦！酸得人牙都要掉了，隔壁千夏每次收下，转头就倒进排水沟里了，我可全都看见了哦！”\n还是没人理我。\n我在走廊上站了很久，才注意到靠墙的矮桌。抽屉还开着，榻榻米上留着几道早年皮靴踩踏过的黑印，角落的缝隙里还卡着一片被踩裂的眼镜片。\n原本摆在屋子正中的矮桌翻倒在墙角，断掉的桌腿底下有一小块颜色稍浅的方形痕迹，像是很久以前，那里曾经摆着什么东西。\n我蹲下来，慢慢擦掉灰尘，看见了压在桌脚底下的那张纸。\n那张纸已经受潮发黄了。上面的字倒还认得出来，还是老头子那副恨不得把每一笔都写出火气来的破字：\n“春日小遥，十七岁。再不长个子可就真嫁不出去了。”\n下面还多画了只圆滚滚的兔子，旁边是妈妈添上的一行小字：\n“生日快乐，小遥。蛋糕记得趁早吃哦，别又留到明天啦。”"

PAU.53.a: "……"

PAU.533.t: "回家"
PAU.533.d: "……啊。\n我想起来了。\n那天他们说，等我从码头回来，就给我补过十七岁生日。\n我那时候心里慌着别人的事，还嫌他们烦，说蛋糕有什么好吃的，又不是小孩子了，然后就头也不回地跑掉了。\n翻倒的矮桌旁边，还留着一圈早已干涸发黑的奶油印子，几块踩扁的纸盒碎片和灰尘混在了一起。\n蛋糕已经不在了。\n不知道是老鼠，还是野猫，还是哪只饿昏了头的野兽，早就把它吃得干干净净了。\n真是的。\n以前每次给我买点心，我都舍不得一下子吃完，非要留到第二天，老妈才总爱唠叨我。结果这一回，我把十七岁的蛋糕留到了现在，留到连块渣都没给我剩下。\n我伸手捡起角落里那片碎掉的镜片，和那张纸条握在了一起。\n“……老爸，老妈。”\n“我回来了哦。”\n“我已经长大啦，可我真的像老头子写的那样，一点都没再长高呢。”\n后来军部把他们当成叛乱家属带走的事，我在南美的收音机里早就听说了。我一直没提，跟阿夏没提，跟晓枫她们也没提。\n我天天骗自己说，军部的广播最会撒谎了，老头子那么倔的人，怎么可能乖乖让他们带走呢？我以为只要我装作没听见，只要我还像平时一样跟大家嬉皮笑脸地吹牛，等我打回老家、推开这扇门大喊一声的时候，他们就会像以前一样从厨房里出来拧我的耳朵。\n我明明是个那么厉害的大骗子，把那么多随口瞎编的假话都变成了真的……\n可为什么偏偏只有这一件，我连自己都骗不过去了啊。\n“差劲透了……”\n“明明说好了要回来吃蛋糕的……结果连蛋糕都被不知道哪里来的野猫吃掉了……”\n说着说着，我自己都觉得荒唐，忍不住笑了一声，可那笑声……听起来比哭还难听：\n“……真好啊。至少它吃到了。”\n“至少……它没有像我一样，连回家的路都找不到。”\n白夜也跑了。跑了好，谁稀罕养一头连老鼠都追不上的大肥团子……\n反正大家最后都会走的。老爸也是，老妈也是，千夏的哥哥也是，美月也……最后留在房间里的，永远都只有我自己一个人。"
PAU.533.a: "……"

PAU.5333.t: "回家"
PAU.5333.d: "——沙沙。\n院子里的枯草突然剧烈地响动起来。\n还没等我抬起头，一团带着泥腥味和草叶味的热乎乎的东西，像颗炮弹一样直接撞在了我的小腿骨上！\n“哎哟！”\n我疼得脑袋都懵了，揉着眼睛往下一看——\n是白夜。它正趴在我的鞋子上，四条小短腿沾满了泥巴，白毛上还挂满了带刺的苍耳。\n它抬起那张沾着泥巴的圆脸，嘴巴一张——\n啪嗒。\n一颗熟透的鲜红野柿子，正好落在了我的膝盖上。\n吐完柿子，它像立了大功一样，拼命晃着那截短得几乎看不见的尾巴，呜呜地叫个不停。\n“……你……”\n“你怎么又跑回来了啊？！”\n“不是让你回山里当野兽吗？！身上全是泥，别往我衣服上蹭啊！脏死了！”\n白夜根本不管我怎么骂，一头钻进我怀里，喉咙里发出舒服的呼噜声，湿热的舌头在我满是泪痕的下巴上使劲舔着。\n抱住这团发烫的白毛，我把眼泪全蹭在了它满是苍耳的脑袋上：\n“大笨蛋……我刚才都那样凶你、撵你走了，你怎么还知道要回来啊……”\n“连你这只笨蛋都知道要回来……为什么当年就我一个人那么傻，头也不回地跑掉了啊……”\n“连老爸老妈都不在了……你跟着我喝西北风吗……”\n“笨蛋白夜……”"
PAU.5333.a: "……"

PAU.53333.t: "回家"
PAU.53333.d: "“……喂，白夜。”\n“今天是我的生日哦。”\n我看着它那张沾满泥巴的圆脸，努力挤出了一个笑容：\n“虽然已经过了很久啦……久到蛋糕都被你们这些野东西吃光了。不过，既然都回来了，总不能连生日歌都没有吧？”\n“咳、咳……”\n“ハッピー・バースデー・トゥー・ユー……”\n我的声音小得可怜，刚唱出第一句，就被鼻音堵住了。\n我深吸一口气，又重新唱了一遍：\n“ハッピー・バースデー・トゥー・ユー……”\n“ハッピー・バースデー、ディア……小遥……”\n唱到这里，我忽然再也唱不下去了。\n明明是自己的名字，明明只是一首谁都听过的生日歌，可为什么……连把它唱完，都这么难呢？\n“……不行，还没唱完呢。”\n我带着哭腔笑了起来，断断续续、走调地唱出了最后一句：\n“ハッピー・バースデー……トゥー・ユー……”\n歌声落下的时候，房间里还是静悄悄的。\n老头子嫌我唱得难听的笑骂声，还有妈妈笑着催我许愿的声音，全都听不见了，也没有人再从厨房里端出一块崭新的蛋糕了。\n我捡起膝盖上那颗被白夜吐出来的野柿子，分成了两份。一份塞进白夜嘴里，另一份塞进我自己嘴里，就当是……今年补上的蛋糕了。\n好干……还好涩，但是……也好甜。\n“……爸爸，妈妈。”\n“蛋糕我趁早吃完了哦，这一回，没有再留到明天啦。”\n“还有……刚才在玄关，我是骗你们的。”\n“从电池盒里拿走的那几枚硬币，我一直缝在贴身的口袋里，到现在一毛都没舍得花；妈妈腌的梅子我和千夏也从来没嫌酸过……在海对面想家想得睡不着的时候，我不知道有多想再吃一颗……”\n“现在……可以祝春日小遥生日快乐了吧？”\n\n“小遥今天……来带你们回家了哦。”"
PAU.53333.a: "§L“祝你生日快乐，我亲爱的小遥……”§!"


PAU_end: "明天就交给你们了"
PAU_end_desc: "礼堂里的大会总算散场了。来自工厂、远征军与樱花的代表们，在共同宪章上按下了手印。\n大统领的位置正式取消。\n不过那帮老兵和工会害怕对方暗中使绊子，在宪章最后加了一条：春日小遥保留临时的紧急仲裁权，两边在桌上要是争得不可开交，还是会由我出面拍板定案。\n我把印章锁进了参事会的柜子里，揣好布包就偷偷溜出了大门。\n五点整的下班铃声已经响起来了，我的差事办完啦。以后的生活，就交给你们自己去过咯。"

PAU.54.t: "五点零二分"
PAU.54.d: "电车站台的长椅上，我撕开了冒着热气的纸包，里面冒出了肉饼的香味。\n“呐，肉饼分你一个，算我请客。”我将其中一块递给了身旁的阿夏。\n阿夏接过去咬了一大口，平淡地嘟嚷道：\n“拿我掏钱买的肉饼请我的客，前大统领大人的便宜占得可真顺手呢。”\n“都说了别叫那个头衔啦！”我嚼着酥脆的肉饼，含含糊糊地抗议着，“我现在可是无业游民，明天起要去船厂当正经学徒工的呢。”\n……\n“阿夏。”\n“又怎么了？”\n“肉饼挺香的吧。”\n阿夏嚼着饼白了我一眼：“废话，我掏的钱。”\n咔哒，站台的挂钟时针不偏不倚地定格在了五点零二分。\n紧接着，一阵铃声顺着铁轨由远及近荡了过来，伴随着电车的气阀声，车门打开了。\n一群背着书包的学生跑下车厢，嘴里争论着明天的功课；刚下班的工人们提着饭盒走上来，互相询问着晚饭的菜单。\n在拥挤的下车人群末尾，我看见了一个熟悉的身影。\n那是……美月。\n她手里牵着一个背着画板的小女孩，那是当年被宪兵带走的老师留下的女儿。看见坐在椅子上的我，美月的脚步顿住了，似乎不知道该走过来还是该转身躲开。\n直到我单纯冲她挥手打了个招呼，她才慌忙带着那个小女孩朝我端端正正地鞠了一躬，随后牵紧小女孩的手，快步汇入了出站的人流里。\n“不去叫住她？”\n阿夏顺着我的目光看了过去。\n“不用啦。”\n“反正以后都在一条街上住着，等她带那孩子去上课的时候，总会碰上的。”\n我重新把布包背好说道：\n“阿夏，上车啦。”\n\n“今天晚上吃什么？”\n“南美带回来的玉米还有两袋，煮玉米糊怎么样。”\n“又是玉米糊啊！那我要加糖，必须加好几大勺糖！”\n“行，随你。”\n在电车门在我们的身后关上之后，这辆载着喧闹与笑语的车厢，终于悠悠地驶向了象征着平淡生活的海湾小镇。"
PAU.54.a: "“可别忘了我的糖，阿夏长官”"

PAU.55.t: "谁算自己人"
PAU.55.d: "“呜哇！抱歉抱歉！”\n艾玛捧着一大叠刚缝好的桌布慌慌张张跑上台，脚下一绊，手里的毛线球骨碌碌滚开，正好在埃文斯的皮靴上绕住好几圈。\n“艾玛小姐，等一下……毛线要扯断了。”\n埃文斯捏着协议草案没敢乱动，\n“我正在跟她们讨论正经事呢。”\n“对不起埃文斯先生！这团线完全不听使唤……”\n艾玛蹲在地上，手忙脚乱地去解靴扣上的线结。\n“后面的轻一点！地板刚擦过，经不起你们这么砸。”\n讲台另一边，雪伊正指挥几个人挪着桌子。\n“埃文斯长官，怎么还在担心这种事啊？”\n旁边抬长椅的工匠顺口搭腔，\n“刚才进门就听见你在那儿瞎操心了。明天码头要给大船装新舵，缺人手缺得要命，大家忙都忙不过来，谁有空管你以前是什么来头。”\n“我可不是在开玩笑。字虽然签了，但我们毕竟是从圣杯过来的，以前习惯的那套跟你们完全不一样。等以后时间长了，我们这些人真的不会被当成异类排挤掉吗？大家到底是自己人，还是迟早要被清理的外人？”\n“我们看重的是做不做事，又不是查你的家底。”\n正在翻看账册的晓枫抬起了视线,\n“只要愿意老老实实工作，这里的座位肯定少不了你们的。”\n“就是说呀！而且埃文斯先生前天分给大家的红茶超好喝的，工友们都夸呢！”\n艾玛终于把毛线理顺了，抱着线团仰起脸帮腔道。\n这让埃文斯的表情有些挂不住了，不自在地正起了帽子：\n“……那叫正规外交礼节！还有，那可是我好不容易攒下的私房货！”\n“听懂了吧？想在这里安稳待着，光靠嘴巴担心可没用。顺便问一句，埃文斯指挥官——”\n雪伊冲着墙角望去，指了指那里的扫帚，\n“今天会议室的值日表上写着谁的名字，你该不会装不知道吧？台阶那边的木屑和碎纸，什么时候带人打扫干净？”\n“好的…好的，我知道了。”面对眼前这群完全不讲客套的同僚，埃文斯实在没有了办法，只得无奈点头答应了。"
PAU.55.a: "“去把扫帚拿过来吧……”"

PAU_zkdh:0 "召开第一次人民代表会议"
PAU_zkdh_desc:0 "礼堂里的座椅昨天傍晚才刷完漆，今天一早，各地选出来的代表就已经大声喧哗着把大门堵满了。\n矿区来的工友第一次穿正装，领带系得像根麻绳一样；圣杯远征军来的水手嫌屋里闷热，拿着议程表拼命扇风；还有几个偏远镇子的代表，进门第一件事居然是打听中午管不管饭。\n我趴在后台的讲桌上，看着晓枫送来的那摞发言稿，只觉得脑袋比刚出海那会儿还要晕。\n不过，只要把今天这场大会顺利开完，把那些章程和委员名单全数敲定，我这个临时抓来充数的代理大统领，就终于可以名正言顺地交差下班啦。"

PAU.56.t:0 "第一次人民代表会议"
PAU.56.d:0 "“……以上，关于沿海市政区的医院拨款与夜校课时方案，全票通过。”\n站在左侧的发言席旁的晓枫合上了文件夹。\n我立刻精神一振，撑着讲台起身喊道：\n“太好啦！那我们第一次全国大会的议程就全部到此为——”\n“等一下。”\n台下第一排中间，阿夏直接举起了手里的表决牌。\n我愣住了：“啊？阿夏，议程表上的字我都认全了，明明已经念到底了呀！”\n“你手里那份是删减版。”\n雪伊从右侧过道站起身来，她手里拿着一张根本没印在册子上的单页纸：\n“按照大会章程，只要有超过三分之一的代表联名，就可以当场追加临时提案。很不巧，我们这里有四百九十九个人签了字。”\n我带着疑惑的目光扫了一眼台下：\n“一共就五百名代表，四百九十九个签了字……那唯一没签的倒霉蛋是谁啊？”\n“报告大统领，是你自己。”\n坐在第一排的埃文斯立刻举手说道。"
PAU.56.a:0 "“……啊？”"

PAU.566.t:0 "第一次人民代表会议"
PAU.566.d:0 "晓枫走过来，把那张联名提案平铺在了我的讲台上。\n最上面写着一行加粗的黑字：《关于清算春日小遥历年哄骗全盟罪责的特别提案》。\n“等、等一下！”我后退的时候差点踩到白夜的尾巴，“当初在船上伪造公函的事，你们不是早就骂过我了吗？！怎么开全国大会还带翻以前账目的啊？！”\n“第一条。在卡卡罗姆山谷，某个连路都走不稳的外乡人跑进兵营，骗我们说只要跟着她走，就能有一支自己说了算的队伍，人人都能有一个自己的房子。”阿夏照着手里的一张纸条念道。\n“我、我那是当时饿昏头了随口胡说的……”我小声辩解，“大不了我把这几年的津贴全退给你们嘛……”\n“第二条。”雪伊接过话茬，往前走了一步，“在海湾的货栈门前，她骗几千名快要绝望的工人和家属说，只要顶住怪物的进攻，这片土地上的工厂和未来就全都归大家自己管了。”\n“第三条。”坐在后排的千夏突然站了起来，手里还抓着一张代表证件，“她在码头跑路的时候，骗我们说她一定会平安回来，把大家丢掉的好日子全都找回来！”\n“我是……骗子。”\n“对不起嘛……我从头到尾就只会撒谎……我根本没本事替你们包揽那么多事……”\n“所以，经全体代表核实——”\n“春日小遥当初随口编造的上述谎言，截至今日下午四点五十分，已经全部由我们亲手变成了事实。”\n“……全部啊。”我小声念叨了一遍这两个字：“是……是嘛……那我还真是挺厉害的呢…哈哈。”\n“屋子的窗户面向了阳光，工厂交给了广大群众，你也平平安安地站在这里了。你欠我们的东西，今天连本带利全还清了。”雪伊看着我说道。\n“现在进行最后一项表决。”晓枫面向全场，“即日起，正式废除‘代理大统领’一职，解除春日小遥身上所有的行政担子。从走出这扇大门开始，她不再需要替任何人的性命负责，只准作为普通市民春日小遥，每天按时吃饭、按时睡觉。同意的代表，请举牌。”\n过了好几秒，当年在老家船厂总给我塞烤番薯的那个老船工代表慢吞吞地举起了手里的牌子。\n紧接着是旁边的老炮兵，然后是第一排的埃文斯、后排的千夏……\n四百多块涂着油漆的木牌，稀稀拉拉、一高一低地陆续举过了头顶。\n后排有个年轻学徒大声喊道：\n“那等小遥姐去船厂上班了，我们平时还能去找你玩吗？！”\n我张嘴想骂他们合伙欺负人，结果话还没出口，眼泪就先涌上来了，只好抓着发言稿把脸挡住。\n“……散会！！全都给我散会！！”\n“以后你们就算排队来求我，我也再不管你们这帮大笨蛋了！！”"
PAU.566.a:0 "“明天见啦，大家。”"


####军事线####
#阿夏军事线
#开局
PAM_xbhm:"别把新兵扔在后面"
PAM_xbhm_desc:"老军团长以前就不喜欢我带队时只顾着走在前面。那时候我还觉得，只要前面的人走得够快，后面的人总会跟上来的。现在轮到我看着这群孩子了，才知道这种想法有多讨人嫌。\n最近补进来的新兵还没摸熟装备，就已经有人在打听什么时候进山了。我让老兵带着他们重新练一遍。有人嫌麻烦，我也没心情跟他们争。等真遇上野火的人，总不能指望他们临场才学会怎么配合。"

PAM_nzdt:"那张地图得重画了"
PAM_nzdt_desc:"新参谋送来的地图又被我退回去了。上面把几条山路画得很漂亮，连村口那段塌方都没标出来\n我记得去年运粮车就在那里陷了整整一天，最后还是附近的村民帮忙把东西搬出来的。\n我不想再看见这种事。负责侦察的人要重新走一遍路线，沿途的村镇也要打听清楚。至于那些说着问题不大的家伙，我已经把他们的名字记下来了。下次就让他们自己去走那条路。"

#与野火开战
PAM_jzbx: "那片山坡还没看清"
PAM_jzbx_desc: "炮击申请取消了。因为前线说山坡后面有野火的人，可他们自己也没看清对方到底有多少人，地图上的位置更是差了好一截。负责传令的年轻人急得团团转，他说再拖下去的话，等他们跑了又得追好几个钟头了。但我让他先去喝口水，等侦察的人回来再说。\n我知道大家都想赶紧往前走。这场仗拖到现在，谁都没剩下多少耐心。可山里的地形本来就麻烦，几支队伍隔着山脊，连彼此在哪儿都未必清楚。炮弹落下去以后，可没人能把它叫回来的。\n晓枫的人也在那一带活动。我不愿意拿从前的交情替他们求情，真打起来，该还击的时候还是得还击。但在连目标都没弄清楚的时候就开炮，我实在没法点这个头。"

PAM_jzbx2: "我还不打算追进去"
PAM_jzbx2_desc: "前面的阵地已经空了好几个地方了。有人回来时还带着缴获的东西，兴冲冲地跟我说野火大概撑不住了，照这个势头，很快就能打到他们的山里去。我听了没说什么，只让他先把手里的东西交给后勤登记。\n我当然也想早点结束。营地里还有一堆等着处理的事情，伤员要送回去，弹药要补上，几辆坏车到现在都没修好。可前锋已经走得很远了，后面的队伍却又堵在了路上。真遇上什么情况，光靠跑得快可是救不了人的。\n晓枫以前就知道怎么利用地形。她现在会不会故意把阵地让给我们也完全说不定，虽然我也不想凭这点猜测就把所有撤退都看成圈套。于是，我就让前面的人把队伍收拢一些，等后面的队伍跟上之后再继续推进。要是她真有别的打算，至少我们不能自己先乱了阵脚。"

#返回南美，开始亡灵战役
PAM_nlwq: "弹药可经不起这么糟蹋"
PAM_nlwq_desc: "我把那份战斗报告看了好几遍了，还是没弄明白一个连队怎么能在一上午打掉那么多弹药。报告上写着敌人数量庞大、攻击持续不断，最后的伤亡是没多少，弹药消耗却快赶上我们以前打一场硬仗了。\n我把负责这次行动的军官叫来问了嘴。他说亡灵一直往阵地上冲，弟兄们根本不敢停火。我能理解，第一次见到那些东西的时候，我自己也没好到哪儿去。明明前面已经倒下了一大片了，后面还是不停地往上挤着，换谁都会觉得它们根本杀不完。\n可弹药又不会自己长出来。我们带来的存货看着不少，真要这样打下去，也撑不了多久的。我让他们把那天的射击记录和各方阵地的情况重新整理一遍，尤其得弄清楚哪些火力确实挡住了亡灵，哪些只是在白白消耗子弹。说起来容易，做起来肯定又得有人嫌麻烦了。随他们怎么说吧，等到弹药箱空了，可没人能替我们把里面的子弹变出来。"
PAM_nlwq2: "我不想再抬一遍了"
PAM_nlwq2_desc: "我以前总觉得，打进一座城以后，最麻烦的就是把敌人赶出去。现在才发现，光是让自己的人能活着出来，就已经够折腾了。\n上次清理街区的时候，前面一度被倒塌的墙和临时路障堵住了。担架队抬着伤员绕了好几条巷子，最后还是从一处快塌掉的门洞里挤出来的。我当时正好在附近，看着他们把担架放下来歇气，伤员疼得直哼哼，抬人的几个家伙连骂人的力气都快没了。我没忍住，冲着负责安排路线的人发了顿火。现在想起来，声音大也没让那条路自己变宽。\n所以这次进城前，我亲自看了几处预定的进出路线。工兵要设障碍可以，但得留出能让担架和运货车通过的地方，还得有人知道出了问题该往哪儿走。军官们对路线安排有自己的想法，我也没打算把每个细节都管死。只要真打起来的时候，不用再抬着伤员在废墟里兜圈子，我就谢天谢地了。"

#亡灵威胁结束，进入重建阶段
PAM_ax_bz: "我就想安静吃顿饭"
PAM_ax_bz_desc: "我真的只是想吃顿饭而已。\n饭刚端上来，边境就送来一份急报：山里连续几夜出现不明火光，疑似有人秘密集结。值班军官问我是不是该立刻增派部队，我看了窗外，和碗里的饭，觉得自己大概这辈子都没办法同时把两件事做好了。\n“先别急着调兵！让熟悉地形的巡逻队去查，沿路问问附近居民。岗哨照常值班，发现异常立即报告。没有确切消息之前，谁也不许把整条边境都当成敌人的营地！”\n命令下达后，我终于重新拿起了筷子。\n然后，第二份急报来了。\n巡逻队发现，火光附近确实有人活动；第三份急报紧接着送到，说那群人似乎还在不断移动。负责地图的参谋已经把那片山路圈得连底色都看不见了，值班军官也开始认真讨论，敌人究竟会从哪条小路摸过来。\n我捧着饭碗，听得后背发凉。\n“等一下！你们说的那群人，到底有多少？”\n“暂时无法确认，长官。不过，根据火光的位置和移动情况判断，人数可能相当可观。”\n我把筷子放下了。\n等我碗里的饭菜连热气都不冒了，巡逻队才总算推门回来。领队一进门就向我敬礼，表情严肃得让我差点以为他们已经和敌人交上了火。\n“报告！情况已经查明。附近几个村子的居民正在山里烧炭。火堆很多，是因为他们把不同的窑分散在山坡上；夜间看起来像在移动，是因为各处轮流添柴。”\n我端起凉透的饭碗，忍不住问：“所以……我们今晚紧张了这么久，就是因为有人在烧炭？”\n“是的，长官。另外，村民托我们问问，军营最近有没有多余的盐。他们愿意拿炭来换。”\n“……”\n“……有。让他们明天白天来谈。还有，拜托你们，下次看见山里冒烟，先问问人家是不是在做饭，好不好？”"

#开启南美战争
PAM_ax_nyjs: "我不想在树林里捡人"
PAM_ax_nyjs_desc: "战争开始以后，前线的命令是一封接一封地往下发，仿佛只要把地图上的箭头画长一点，所有人就都能跟着走到地方。我倒希望事情真有这么简单。\n队伍进了林子以后，前面的人急着赶路，把后面的队伍甩得越来越远。有几个士兵为了追上主队，连水壶都顾不上拿。我让各队按照自己能维持的速度推进，沿途约好停步和重新集合的信号。要是谁发现队伍散得太开，就先把人带回来，再接着走，别为了多赶一段路，把自己的同伴落在林子里。\n指挥部很快又送来催促前进的命令。我把那封电报塞进衣袋，打算等负责联络的军官赶到以后，再让他把我们目前的位置报回去。仗才刚开始，我可不想以后每次点名，都得先派人进树林里挨个喊名字。"

#进入南美战后治理阶段
PAM_ax_nyfy: "废弃下来的阵地"
PAM_ax_nyfy_desc: "仗停下来以后，我才发现有些麻烦比敌军撤退得慢得多。山路旁边的铁丝网被藤蔓盖住了，废弃阵地里的弹药箱也都泡在了泥里，原先的地图确实早就把这些地方标成了安全地带。有回我经过村外，看见放牧的人正把生锈的金属往车上拖，结果旁边的士兵急得一路追过去制止，连声音都喊破音了。\n这事让我很恼火。当地人缺铁料，想把废弃军械拿去换钱，也不是什么难以理解的事；可那些东西究竟还能不能碰，连熟悉战场的老兵都未必说得准。统一后的工兵部队得把清理阵地当成长期任务，沿着村路和农田逐步排除遗留爆炸物。暂时无法处理的地方要明确标出危险范围，附近居民也得知道发现弹药以后该找谁处置。\n我不打算催他们为了赶进度冒险。工兵清理过的道路，会由巡逻队和当地向导共同确认，再逐步恢复通行。等所有人都忙完了，村民至少能把牛牵过山路，不必每次经过废弃阵地时都先担心脚底下踩着什么。"
#准备攻打樱花
PAM_ax_jhdd: "这艘船上次漏水是什么时候"
PAM_ax_jhdd_desc: "远征的事终于落到我们这边了。前几天，送来的计划还挺像样，船队排得整整齐齐，连登陆以后往哪儿走都画好了。我把它交给几个跑过海运的老兵看，他们倒没说计划不好，就问：这批船上回出港的时候，修船的钱结清了没有。\n我一时答不上来。后来跟着他们去船坞转了一圈，才发现有艘运输船的船底还留着以往漏水的毛病，负责维修的人一直等着零件到货。平时运货还能凑合，真要把人和装备送到樱花那边，半路出了问题，可没人能开辆卡车来救急。\n我只好先把这艘船留下来修，再从别处想办法调零件。船坞里的人忙得连饭都顾不上吃，我也跟着在港口耗到了天黑。等船终于重新下水，原定的出发时间已经往后挪了一截。陆军那边催得厉害，我也只能告诉他们，晚走几天总比到了海上再找地方补船底强。\n后来有人问我，这趟远征准备得怎么样了。我说，至少现在有一艘船能保证把人送出去。至于它上次漏水是什么时候，最好还是别让乘客知道得太清楚。"
#樱花战后
PAM_ax_zsjs: "谁把岗哨排到菜市场了"
PAM_ax_zsjs_desc: "战事结束后，我接到命令，要把留在樱花的部队重新安排好，免得大家闲下来以后各找各的事做。我本来想先把巡逻路线理顺，结果当地官员拿着一张投诉单来找我，说我们的人天天守在菜市场门口，把买菜的居民吓得绕路走。\n我赶紧去问带队的老兵。他说那条街最近丢东西，大家都是奉命加强警戒。我一听觉得有道理，便问他查出什么了。他说暂时还没抓到小偷，不过菜市场里卖鱼的摊主已经主动给他们留了位置。\n我过去一看，好家伙，几个士兵端着枪站在鱼摊边上，摊主正热情地问他们要不要买两条，说有他们站着，今天连鱼都卖得特别安稳。\n我只好把巡逻安排重新调整，让士兵按规定巡查，遇到治安问题就交给当地人员一起处理，不能把整条街当成自家营地。临走时，鱼摊老板追上来问我，明天还来不来。\n我说：“巡逻会照常进行，但不会固定站在你摊子旁边。”\n他苦着脸问我：“那我今天给他们留的鱼，算不算白留了？”\n我这才明白，有些人已经开始把我们的岗哨当成招牌了。"
#迈向世界
PAM_ax_sjjs: "我们全连都学会敬礼了"
PAM_ax_sjjs_desc: "我们刚开始在海外驻扎时，上头要求大家注意当地礼节，别让居民觉得我们仗着手里有枪就不懂规矩。这个要求本来挺好，坏就坏在负责训练的新兵班长特别认真，硬是把敬礼练成了每天的必修课。\n过了几天，我发现连炊事员看见当地小孩都要立正，连去买饭吃的士兵也能在柜台前把手举得整整齐齐。我问班长这是怎么回事，他说礼节得养成习惯，不能等遇到正式场合才想起来。\n我让他带我去看看训练成果。他挺自信，刚走到街口，一个老太太拎着篮子从我们面前经过，全连刷地一下抬起手来，把人家吓得差点把苹果掉在地上。\n老太太站稳后看了会我们，慢慢把篮子举起来，问是不是也得回礼。\n我赶紧让大家把手放下，跟她解释这是部队训练出了点偏差。回营以后，我把敬礼训练改成了按场合进行，还让班长先弄明白当地人平时怎么打招呼。\n第二天，我看见他跟门口的守卫打招呼，总算没再抬手。只是他把帽子摘下来鞠了一躬，帽子直接掉进了水桶里。\n我觉得这事还得再练练，不过至少这回，没人把老太太当成了上级军官。"

#晓枫雪伊军事线
#亡灵威胁结束，进入重建阶段
PAM_xfxy_jsgz: "两支队伍，一张地图"
PAM_xfxy_jsgz_desc: "雪伊：晓枫，你给我的这张地图上，为什么同一条路有两个名字？\n晓枫：因为地方巡逻队沿用旧称，我们的地图用的是战时名称。我正在确认它们是不是同一个地方。\n雪伊：那你最好快一点。昨天有一队人沿着以前的地图走了两个钟头，最后发现自己巡逻的地方就在出发点后面。\n晓枫：他们至少确认了出发点的位置。\n雪伊：你要是把这句话写进报告里，我就把报告拿去给他们当地图。\n晓枫：好吧，我会把道路名称、各队驻地和联络方式统一起来。不过，联合巡逻的路线还得由熟悉当地的人确认，光靠旧地图容易出错。\n雪伊：这才像话。你负责把图画明白，我去找那些巡逻队谈妥时间。至于谁先走哪条路，最好也提前说好，省得大家在路口互相敬礼，谁也不肯先走。\n晓枫：我会把这条写进安排里。\n雪伊：别写得太正式，人家是来巡逻的，又不是来参加地图考试的。"
#开启南美战争
PAM_xfxy_nyjs: "耳机那头的咳嗽"
PAM_xfxy_nyjs_desc: "雪伊：晓枫，前线的通信又出毛病了。刚才我听见有人报告情况，听到最后就只剩下咳嗽声了，害得接收的人也跟着咳嗽了起来。\n晓枫：南美这边的天气不太适合依赖单一的联络方式。信号一断，前面的部队还在往前走，后面的命令就送不到了。\n雪伊：那你打算怎么办？总不能让每个传令兵都随身带一台发报机吧，那样的话，敌人还没打过来，咱们先得给传令兵找个搬机器的人。\n晓枫：我准备给各支部队安排固定的联络人员，让他们在无线电失灵的时候接力传达命令。常用的信号也会提前约定好，免得有人听见一声哨响，就以为整场战斗已经结束了。\n雪伊：这个办法不错。昨天还有个军官听错了集合信号，带着整队人去吃饭，结果炊事班还以为自己突然升了军衔。\n晓枫：所以我会把信号重新统一，再让各部队在出发前实际演练一次。\n雪伊：很好。记得把演练安排在饭前，免得炊事班又以为咱们要给他们开庆功宴。"
#进入南美战后治理阶段
PAM_xfxy_nytjjs: "命令不能替别人签字"
PAM_xfxy_nytjjs_desc: "雪伊：晓枫，共同防务委员会又送来一份方案，说是要让各地军队统一指挥。\n晓枫：哪一部分统一？\n雪伊：你看，你也觉得这话说得不清楚。\n晓枫：我是在问他们自己有没有说清楚。\n雪伊：写了。写得还挺漂亮。就是没说地方指挥官不同意的时候怎么办。\n晓枫：那就得先谈好。总不能等到开战了，才发现大家对统一指挥的理解不太一样。\n雪伊：我确实见过这种场面。两边都说自己在等命令，最后敌人等不及，替他们把仗打完了。\n晓枫：所以紧急支援的条件要提前约定。符合条件时，可以直接联系对方；涉及联合行动，再按双方认可的办法协调。\n雪伊：这样就好。自己的军营自己管，真要并肩作战的时候，也别拿自治当借口，站在旁边看热闹。\n晓枫：嗯。这两件事并不冲突。\n雪伊：那你把这句也写上吧。省得有人把方案看完，只记住了前半句。"
#准备攻打樱花
PAM_xfxy_ycdd: "完美作战计划"
PAM_xfxy_ycdd_desc: "雪伊：陆军那边送来一张樱花登陆图，我看了好久，觉得他们挺会挑地方。\n晓枫：怎么说？\n雪伊：挑的全是好地方。港口宽敞，道路平整，连登陆以后怎么推进都画好了。就是不知道，樱花那边的人肯不肯配合。\n晓枫：他们大概不会专门出来迎接我们吧。\n雪伊：那可麻烦了。图上连庆祝胜利的地点都圈出来了，总不能到了以后再临时找地方吧？\n晓枫：我听说，运输船的安排还没定下来。\n雪伊：这我知道。陆军已经在挑登陆地点了，海军结果还在问要送多少人。万一船不够，难道让先到的人在码头替后到的人占座吗？\n晓枫：他们倒考虑过分批登陆。\n雪伊：那第一批打完了，第二批还在海上看风景？\n晓枫：所以我把那张图退回去了。先把船队能运多少人和多少装备算清楚，再决定登陆规模。返航和后续补给也得算进去，不能只研究怎么抵达。\n雪伊：退得好。要不然等我们终于打下港口，才发现船全开回家了，那可真算得上一次漂亮的孤军深入。\n晓枫：你可以把这句话留给下一次作战会议。\n雪伊：不用了。我怕他们听完，真把返航写成撤退预案。"
#樱花战后
PAM_xfxy_zsjs: "钥匙交给谁比较好？"
PAM_xfxy_zsjs_desc: "雪伊：樱花那边的仓库清点完了，几个前线军官就来找我，说弟兄们打了这么久，总该拿点东西犒劳一下。我问他们想要什么，他们说还没想好，不过最好先把钥匙交给自己人保管。\n晓枫：东西都没想好要什么，就先惦记上钥匙了？仓库里还有当地商户寄存的货，得先把人家的东西还清楚，剩下的才能照规矩领用。\n雪伊：我也是这么说的。他们听完倒挺痛快，说既然要把账弄清楚，那就应该由军官亲自看着仓库，免得出了差错。\n晓枫：这个提议倒能理解，不过看仓库总得有人负责，不能出了问题以后，大家都说自己只是来看看的。\n雪伊：你还真说中了。刚才还争着要钥匙的人，一听说领走东西得在单子上签字，立刻开始谦让起来。有个军官说自己最近忙着整顿部队，另一个说自己不擅长算账，还有一个干脆表示，他可以负责监督前两个人。\n晓枫：那谁来监督负责监督的人？\n雪伊：你别说，他们还真讨论起来了。最后大家一致认为，这件事得交给一个公正、可靠、又不直接经手物资的人。\n晓枫：听上去像是个不错的人选，他们推举了谁？\n雪伊：仓库管理员。他们说他最熟悉仓库，肯定不会弄错。我提醒他们，人家本来就在管仓库，他们这趟过来究竟是来帮忙，还是来给人家颁奖的？\n晓枫：让原来的管理员继续管出入，同盟派人核对账目，谁领走东西就由谁签收。这样出了问题能找到负责的人，也不至于让一个管理员替所有人担责任。\n雪伊：我把这话转告给他们，他们总算填好了领用单。就是那位最先提议拿钥匙的军官，最后申请的东西特别有意思。\n晓枫：他领了什么？\n雪伊：一把仓库钥匙。他说拿回去研究一下，看看以后怎么提高物资管理效率。\n晓枫：仓库就在那儿，管理员也在那儿，他研究完了打算把钥匙用到什么地方？\n雪伊：我也是这么问的。他想了一会，把申请单收回去了，说自己忽然觉得，还是研究怎么把手头的部队带好比较要紧。\n晓枫：那倒是终于想明白了一件正事。\n雪伊：可见这把钥匙挺有用的，至少帮他省下了一份研究经费。"
#迈向世界
PAM_xfxy_sjjs: "军号到底归谁管"
PAM_xfxy_sjjs_desc: "雪伊：驻外部队刚到新港口，当地人就来投诉，说我们的军号每天清晨准时响，连他们的公鸡都不敢叫了。\n晓枫：公鸡也有意见？\n雪伊：它主人意见更大。他说自己养了那么多年，头一回见它等军号响完才打鸣，还问我们能不能把起床号推迟一小时。\n晓枫：这倒提醒我了。部队的训练时间不能只按军营里的习惯来定，驻地周围还有当地居民的生活。让驻军指挥官和地方代表商量训练时段，紧急集合照常执行，日常操练尽量避开居民休息的时间。\n雪伊：已经谈好了。当地代表很满意，还特意问我们能不能把军号借去用几天。\n晓枫：他们要干什么？\n雪伊：港口工人想拿它当上工铃，省得每个工头天天喊。\n晓枫：军号可以借，使用时间得说清楚，别让工人误以为港口也进入了紧急状态。\n雪伊：我已经交代了。现在他们每天吹两次，工人准时上工，公鸡也恢复了自信。\n晓枫：看来我们终于和当地建立了良好的关系。\n雪伊：是啊。昨天那只公鸡还对着军号回敬了一声，附近居民说，这是它第一次参加国际合作。"

#小遥军事线
#亡灵威胁结束，进入重建阶段
PAM_xy_fy: "每个人都必须正确地犯错"
PAM_xy_fy_desc: "亡灵威胁结束后，春日小遥在重建区帮忙登记集市摊贩。她走到一个卖黑色方块的摊位前，对着那些方块研究了老久，终于忍不住问：“请问，这个是什么？能吃吗？”\n摊贩抬起头，瞥了一眼小遥，就望向了摊位上的牌子。牌子上写着“肥皂”，下面还甚至画了一只正在洗手的手。\n他用一种看见鱼爬上树的眼神望着小遥，拿起一块肥皂，在她面前郑重得洗起了手，随后把泡沫举到她眼前：“能。您要是愿意，吃完还可以漱漱口。”\n小遥这才看清牌子，脸一下红了。她本来想赶紧离开，目光却落在摊位旁边的一张集市登记表上。上面把肥皂归在了“食品及日用品”一栏，还是她前两天帮忙整理的分类。\n摊贩顺着她的目光看过去，脸上的表情顿时从看傻子变成了看见更大的傻子。他把登记表翻过来，指着那一栏问：“同志，所以说……您是打算让我洗手，还是打算让我吃饭？”\n小遥只好把表格带回去重改。她把食品和日用品分开登记，又在容易弄混的地方补上了清楚的说明。忙完以后，她特意绕开了那个摊位。\n第二天，摊贩远远看见她，立刻举起一块肥皂，大声问：“同志，今天这个能吃吗？”\n小遥捂住脸，加快了脚步。她终于明白，有些错误确实应该统一处理，尤其是自己犯下的那种。"
#开启南美战争
PAM_xy_nyjs: "谁替莉兰迪亚答应了"
PAM_xy_nyjs_desc: "南美战争刚开始，前线就送来一份当地武装的接洽请求。对方愿意停止抵抗，条件是白夜同盟承认他们在几座城镇的自治权，并保证战后不追究他们此前与敌对势力的往来。军方希望尽快接受谈判，免得继续作战牵连当地居民；随军的地方联络人员却提醒说，这些武装并不能代表所有城镇，更不能替那些曾被他们征用过粮食的居民作主。\n小遥被叫去整理谈判意见。她原以为只要把双方的条件写清楚就好，结果刚写完第一稿，就有人要求删掉“当地居民的意愿”，理由是目前还没有一份能够证明全体居民意见的正式文件。另一位军官随即指出，若非要等到所有居民都表态，谈判恐怕要拖到战争结束以后。\n小遥把笔放在纸上，认真地说：“那我们先让愿意停战的部队放下武器，再由当地代表商量自治安排。至于他们以前做过什么，不能因为今天来谈判就一笔勾销，也不能因为他们曾经站错队，就连谈判的机会都不给。”\n这番话总算让会议继续了下去。最终送往前线的指示允许军方与当地武装先谈停火和解除武装，涉及城镇自治与战后追责的条件则留待地方代表参与协商。小遥在文件末尾加了一行说明，提醒接洽人员别把某支武装的承诺当成整座城镇的意见。\n第二天，前线传回消息，对方同意派代表来谈。随信附上的代表名单里，有一位自称代表全城商户的人。地方联络员在旁边写了批注：此人经营的店铺目前只剩两家，而且其中一家已经关门好几个月了。"
#进入南美战后治理阶段
PAM_xy_tltx: "桥的两端居然都是自己人"
PAM_xy_tltx_desc: "统一后的南美铁路逐步恢复运输，小遥搭乘一列运送军需的火车前往了沿线驻地。列车在一座跨河桥前停了下来，司机说桥两头的守军都已经加入白夜军，可东岸只认原先东部部队的通行命令，西岸也坚持沿用自己的规矩。两边都承认对方是友军，唯独谁也不肯先让火车过去。\n小遥下车时，两个哨兵正隔着铁轨商量这件事。东岸的士兵认为自己守的是桥梁入口，西岸的士兵则认为自己负责的是桥梁出口，列车只要从中间经过，就必然有一段路不归任何一方负责。他们说得很认真，连司机都开始怀疑，自己是不是开进了某种新式的军事演习。\n小遥把两边的军官叫到一块，建议沿线交通改由统一的联络指挥负责，双方共同派人协助检查和护送军列。涉及当地治安的事务，仍由熟悉沿线情况的人员参与处理；遇到紧急军情时，各部队则必须服从统一调度。她还特意说明，以往部队的指挥关系可以逐步调整，但不能让一纸命令在不同驻地之间失去效力。\n商量结束后，火车终于驶上桥。两名哨兵分别站在桥头，目送列车通过。过了一会儿，东岸的士兵忽然朝同伴喊道：“这回总算知道桥归谁管了！”西岸的士兵回答：“归火车管！它要是再停下来，咱俩就得一起负责把它推过去。”"
#准备攻打樱花
PAM_xy_ydjs: "原来樱花在海的那一边啊"
PAM_xy_ydjs_desc: "小遥参加远征演练时，信心十足地在计划上签了字。海军负责护航，陆军负责登陆，运输部门负责把人和装备送到樱花。现在，每个部门都说自己准备妥当了。\n演练开始那天，护航舰已经出港了，运输船还在码头一点都不急地装货。小遥赶到港口，发现大家正忙着证明自己没耽误时间。\n“那登陆部队怎么办？”她问。\n“等运输船。”\n“运输船呢？”\n“等装货。”\n“货呢？”\n“已经准备好了。”\n小遥望着堆得整整齐齐的物资，忽然觉得这场远征离胜利最近的时候，大概就是所有东西还放在仓库里的时候。\n她赶紧联系海军，让舰艇在安全海域等待，又重新安排装货顺序。演练最终延期，她也得在报告上解释自己为什么提前签了字。\n报告交上去后，一位军官安慰她说，至少这次演练让大家积累了经验。\n小遥点点头：“是啊。现在我们终于知道，樱花在海的那一边。”"
#樱花战后
PAM_xy_zsjs: "他们走路为什么像小偷"
PAM_xy_zsjs_desc: "樱花战事结束后，春日小遥跟着同盟的巡逻队走了一趟街区。队伍全副武装，靴子踩得整整齐齐，刚经过一家店，老板就赶紧把门关上了。小遥很奇怪，明明是来维持治安的，怎么他们一出现，连做生意的人都跑得比谁都快。\n当地负责人告诉她，居民经历过太多军队上街的日子，听见整齐的脚步声就会紧张。小遥觉得该改改巡逻的方式，便叮嘱带队军官，平时巡逻按正常步伐走，路过商铺时说明来意，别弄得像马上要挨家挨户抓人。\n第二天，她再去查看，发现整支队伍正贴着墙根踮脚前进，连拐过街角都小心翼翼。小遥看呆了，问他们在做什么。军官认真地回答：“您说不能让居民紧张，我们就尽量不发出声音。”\n小遥捂住了脸：“我让你们别像来抓人的，没让你们像来偷东西的呀！”\n这回她干脆请当地的巡查人员带路，让士兵熟悉街区，也把巡逻安排提前告知附近居民。遇到需要帮助的人，队伍就停下来处理；遇到确实有危险的情况，也照常按规定行动。军官终于明白，日常巡逻不需要演成一场夜间突袭。\n一周后，街区的治安记录有了好转。小遥高兴地翻开报告，发现最后还附着一条居民意见：“新来的巡逻队总算走得像正常人了。建议继续保持，尤其是晚上，别再贴着我家窗户练踮脚。”\n小遥把这条意见认真抄进了改进记录。她觉得这次总算办成了一件好事，只是下一回视察之前，还是得先问问军官们有没有把她的话理解成什么奇怪的训练科目。"

#迈向世界
PAM_xy_sjjs: "坦克需要停车位"
PAM_xy_sjjs_desc: "白夜同盟开始参与海外行动后，春日小遥去视察驻地附近的装甲部队。她本来以为第一次海外驻扎，大家最需要适应的是陌生的环境，结果到了营地才发现，最大的问题居然是停车。\n当地负责人拿着一份申请表找到她，说同盟的坦克开进城以后，占用了不少地方，居民不知道该把自己的车停在哪里。\n小遥怀疑自己听错了：“坦克也需要停车位吗？”\n负责人沉默了几秒：“理论上不用。但它确实比普通汽车大一点。”\n小遥去现场看了一眼，发现几辆坦克整齐地停在广场边上，车组成员还按照军队习惯把车辆排列得笔直。路过的居民倒没有害怕，反而有人认真研究起这些“新式公共设施”该怎么使用。\n有个老人甚至问驾驶员：“这个大家伙晚上停这里，应该不会收停车费吧？”\n驾驶员不知道该怎么回答，只能说：“它跟车不一样。”\n\n老人点点头：“我知道，就是看起来挺大的。”\n小遥觉得这个问题不能继续靠解释解决，于是让部队重新规划驻地位置，训练和巡逻车辆按需要行动，平时不要把公共区域当成自己的车库。同时也让当地居民了解哪些区域会有军事活动，避免双方互相误会。\n几天后，小遥再次来到驻地，发现坦克旁边多了一块牌子。\n她走近一看，上面写着：“此处停放装甲车辆，不提供过夜住宿。”\n小遥凑近那块木牌端详了半天，转头问负责写牌子的士兵：“为什么要加最后一句？”\n士兵认真回答：“昨天有人来问，坦克里面能不能租给游客睡觉。”\n小遥沉默了一会儿，觉得海外合作的第一课，可能不是如何开坦克。\n而是先让大家知道，坦克确实不能当旅馆。"


####经济线####
#阿夏经济线
#开局
PAM_bxsb:"不许少报一袋"
PAM_bxsb_desc:"仓库那边又说账目对不上了。我本来不想亲自过去，毕竟这种事情总该有人负责，可听见他们说只是少了几袋粮，我还是把手里的文件放下了。\n上回也是几袋，后来查出来的数可没这么少。管仓库的人看见我就开始解释，我让他先别说了，带我去看粮袋。查完以后，我还得去找负责运输的人谈谈。晚饭前大概是回不来了，记得让厨房给我留一份，别又拿忙忘了来糊弄我了。"

PAM_jxbs:"军饷不是下个月的事"
PAM_jxbs_desc:"今天又有人把欠饷的名单送到了我这里。最前面那个人我认识，他上个月还问过我，能不能先把一部分钱寄回家。我当时答应得挺痛快，结果到现在也没办成。\n我不想再让他们拿着同一张条子跑来跑去了。财政那边说款项还在等批复，我就把名单留在了桌上，让他们给个确切的答复。该拖的事情已经拖够久了。我知道军费不是凭空变出来的，也没打算假装这件事很容易解决，但总得有人把话说清楚。"
#与野火开战
PAM_jjcl: "再给卡车一会时间"
PAM_jjcl_desc: "修理班的人一早就来找我，说棚子里那辆卡车实在是没有再修的必要了。发动机的问题还没弄好，轮轴还又出了毛病，再这么折腾下去，恐怕连仓库里剩下的零件都得搭进去。我过去看了一眼，车厢里还留着几条没来得及清洗的毯子，是上回送伤员回来时用的。\n我还是让他们再试一天。倒不是我有多舍不得这辆破车，实在是现在能开的车没剩几辆了，前线还天天催着要东西，总不能让人一直等在山路上吧。要是最后还是修不好，那就把能用的零件拆下来，留着给其他车用就行了。"

PAM_jjcl2: "修车不用跑那么远"
PAM_jjcl2_desc: "昨天下午，一辆运送物资的卡车又在山路上坏了。司机折腾到天黑也没修好，只能先把货卸下来，再找人分批运回营地。前线等了老久没等到物资，修理厂那边还得专门派车去拖故障车，光这一趟就搭进去不少燃料和工夫。\n我去问了修理班，才知道这种小故障其实不算难修，麻烦在于车坏的地方离修理厂太远，拖回去的费用有时比零件还贵。可要把整套维修设备搬到运输线上也不现实，工人和工具都有限，总不能每条山路旁都盖间修理厂。\n我跟几个工头商量后，决定先把运输线边上的空工棚收拾出来，放些常用工具、轮胎和容易损耗的零件，再安排修理人员轮流值守。一般故障就在附近处理，碰上复杂的问题再送回主修理厂；每次维修也记下用了什么零件、花了多少时间，后面才知道该备多少货，免得零件堆了一仓库，唯独找不到急用的那颗。\n有人担心多设一个维修点会增加开支。我让他先把上个月的拖车费和延误损失算出来，等他算完，连反对的话都说得没那么响了。毕竟工棚也要花钱，可总比每次都把一辆坏车和一整批货，送去几十里外排队等着有人修要划算。"
#返回南美，开始亡灵战役
PAM_nljj: "我连药箱都找不到了"
PAM_nljj_desc: "港口那边真是乱得没法看。我原本只想去找一箱药品，结果先被一辆倒不出去的货车堵在了路上，绕了一圈，又差点踩进搬运工刚卸下来的木箱堆里。等终于找到负责登记的人，他翻了好久本子，最后只告诉我药品大概还在仓库附近。\n我当时真想问他，什么叫“大概”。不过看他那副熬了一夜的样子，我最后还是把话咽回去了。现在每天都有船靠岸，粮食、弹药、医疗用品和各种零碎东西全往这里送，卸货的人手一直没跟上。东西也不是没有，只是他们似乎全都挤在了一块儿，谁也不知道下一批急用的物资究竟压在哪个角落。\n我让人先把仓库和临时货棚分开整理，药品、弹药这些急着送走的东西单独放，其他物资也得记清楚放在什么地方。光靠几个人拿着本子到处找肯定不行，还得把搬运和领用的顺序理清楚。唉，早知道今天会折腾成这样，我至少该先吃完早饭再过来。"

PAM_nljj2: "人家也要过日子的"
PAM_nljj2_desc: "谈粮食的事情比我想的要难办得多。我们带去的人拿着清单，开口就报了需要的数量，对方听完以后迟迟没说话，最后只问了一句，村里剩下的人要吃什么。\n这话让我没法接。我知道部队的粮食不能断，可人家也不是专门给我们种地的。那些农场已经荒了不少了，仓库里的存粮还得留着过冬呢，真要照着我们的清单拿走，接下来会是什么样，可是谁都猜得到的。我不想让士兵饿着肚子往前打，也不想刚从亡灵手里夺下来的地方，转眼就被我们自己弄得没人敢住。\n最后我们重新谈了数量，先买下对方愿意拿出来的一部分，价钱和交货时间也写清楚了。至于后面还能不能继续供应，得看他们的收成，也得看我们能不能把附近的道路守住了。临走时，我还问了问村里有没有人懂修农具。军队总不能只会把东西运走，真想在这里待下去，有些事情就得慢慢恢复起来。"
#亡灵威胁结束，进入重建阶段
PAM_ax_jt: "钱总得花在能住人的地方"
PAM_ax_jt_desc: "市政厅把一份租约推到我面前，想让部队继续租下那几栋离驻地很远的房子。我原本只是来谈续约，结果听着听着才发现，附近居民已经等着收回房子，住在里面的士兵也受够了每天来回赶路。合同倒写得清楚，提前退租得赔钱，继续租下去也得按月付账。两边都催着我签字，好像只要笔落下去，住不进房子的人就会自动消失。\n我后来想起驻地旁边那栋停用的海关仓库，便带着市政厅的人过去看了一趟。仓库里还存着地方上暂时用不着的货物，屋顶也有几处漏水，不过承重的木梁还算结实。商量下来，仓库里的一部分继续留给市政厅存货，剩下的地方交给本地工匠修整，工钱当场谈妥。那几栋远处的房子等租约到期便不再续租，部队也能慢慢腾出地方，让居民搬回自己的家。\n我原本以为修仓库总得折腾上好一阵，没想到工匠们干起活来比我们营里开会利索得多。雨落下来的时候，第一批士兵已经搬进了修好的房间。我从门口经过，听见屋里有人把湿透的床垫扔到院子里，随后便是一阵终于能睡个安稳觉的欢呼声。不过今晚，我不用再被人叫起来挪床了。"
#开启南美战争
PAM_ax_nyjj: "汽油不能自己长出来"
PAM_ax_nyjj_desc: "前线退回来的两辆卡车停在营地门口时，油箱已经快见底了，车队连原定路程的五成还没走完。司机带回来的消息很简单：地图上那条看起来平坦的道路已经被雨水冲坏，车辆只能绕着泥坑慢慢挪，有一辆车还在半路上拖坏了油桶。负责运输的人的确按计划领足了燃料，照原先的算法来看，问题应该出在司机身上。\n我没兴趣拿着一张地图跟开车的人争论他们究竟有没有走够里程。那天我跟车队走了一段，亲眼见到重车陷进泥里以后，后面的车辆全都得停下来等。等我们终于绕到河岸边，天都快黑了。再照着纸面上的距离发油，下一批车恐怕也得把一半燃料烧在路上。\n我把原来的分配办法改了，以后出车要把实际路况算进去，回程需要的油也得预先留下。走过的路如果临时变了，车队回来就把情况告诉后面的人，免得下一拨司机还对着地图犯愁。至于那条被画得笔直的近路，我干脆在地图上划了道粗线，旁边写了四个字：雨天别走。\n几天后，新一批运油车沿着河岸驶过营地。那张地图被司机钉在了车厢里，那张地图被司机钉在了车厢里，上面的红色叉号显眼得很。"
#进入南美战后治理阶段
PAM_ax_nyxx: "教室画在图纸的中央"
PAM_ax_nyxx_desc: "我拿到学校建设图纸时，发现设计的人把校长办公室画得特别气派，把上课的教室全挤在了后面角落里。南美不少地方的学校在战火里受了损，孩子们临时借用以前的房子上课，碰上雨季就得把课本抱在怀里躲水。我不是教育专家，可我也知道，房顶漏雨的时候，墙上挂着什么校训都没用。\n这份图纸得重新画。新学校先得有宽敞结实的教室，采光和通风也要适合当地气候；地方工匠可以参与施工，省得所有材料和工人都从远处调来，工程还没开始就先被运费拖住了。学校建起来以后，还得让本地愿意教书的人接受培训，教师也需要稳定的薪水。要不然房子修好了，孩子坐在里面，还是找不到能教他们读书的人。\n有些偏远村镇暂时凑不齐修建新校舍的条件，就先把安全的公共房屋整理出来，让孩子有地方上课，等正式校舍建成再搬过去。这些安排看着没什么惊天动地的地方，可要是每件事都等到战后所有问题解决了才开始，那恐怕直到有些孩子都长大了，也等不到属于他们的学校开门了。"
#准备攻打樱花
PAM_ax_hyjj: "前线说他们还没饿死"
PAM_ax_hyjj_desc: "远征部队抵达前线后，补给报告总算送回来了。负责后勤的军官把报告递给我时，神情相当轻松，因为按照出发前的计算，部队的口粮应该还能撑上一段时间。报告最后也确实写着，当前没有发生大规模断粮。\n我问他，既然情况这么好，为什么申请补充口粮的电报已经来了这么多封了。他说，前线指挥官可能是担心以后不够用，所以提前申请。我又问他，既然是提前申请，为什么电报里还特意提到有士兵已经开始拿压缩饼干换烟。那名军官想了会，说这可能属于部队内部的自发调剂，不在正式补给统计的范围内。\n我差点以为自己听错了。照这个说法，只要大家还没饿到去啃运输箱，后勤账目就能继续保持令人满意的平衡。\n我让他重新核对前线的实际消耗。原先的计划只算准了纸面上的行军路程，没算上道路损坏以后车辆要绕行，也没考虑到有些部队因为任务延长，根本没能按预定时间返回补给点。那些纸面上看起来充足的储备，到了不同的部队手里，情况完全不是一回事。\n从那以后，前线必须定期报告剩余物资和实际消耗，后方则根据这些情况安排后续运输，不能再把出发前那份计划当成一张永远不会过期的圣旨。紧急缺口也要单独处理，免得所有东西都按照原定批次慢慢排队，最后连急着救人的药品都得等到下一班船。\n那名军官听完以后，认真地问我，今后报告里是不是应该增加一栏，专门记录部队是否仍然能够正常吃饭。\n我说：“不用写得这么委婉。要是他们已经开始拿军靴炖汤了，你就直接告诉我。”\n他在笔记本上记了下来。我看了一眼，发现他真的写了这句话，只好让他把它划掉。"
#樱花战后
PAM_ax_zsjj: "咖啡不认军籍"
PAM_ax_zsjj_desc: "港口刚恢复营业，就有商人来找我，说寄存在仓库的两箱咖啡豆不见了。我问仓库的人，对方回答得很干脆：“没丢，已经领用了。”\n我又问是谁领的，他说军需处；军需处说是炊事班；炊事班说箱子放在军需仓库，没标商户名字，还以为是上头补的伙食。我赶到食堂时，最后一壶咖啡已经煮好了，几个值夜的老兵正夸今天的伙食总算像回事。\n这下倒好，商人的货没了，军营的伙食改善了，只有我得掏钱赔。以后临时存放的货不能因为进了仓库就算公家的，谁也不能拿着钥匙就顺手领用。我让人把赔偿和交接的事处理清楚，又特意嘱咐仓库：下回遇到来路不明的好东西，先问清楚是谁的，别等吃完了才想起找主人。\n负责仓库的老兵还挺不服气，说大家难得喝上这么好的咖啡。我告诉他：“那你把这句话写进赔偿单，看看人家肯不肯收。”"
#迈向世界
PAM_ax_sjjj: "这回工钱按天算"
PAM_ax_sjjj_desc: "海外工地开工后，我发现当地工人和同盟派来的技术人员总在工钱上闹别扭。合同写的是按天结算，可工地遇上暴雨停工，当地工人觉得自己白跑一趟，财务人员却说没干活就不能算工钱。\n我不懂他们那些复杂的合同条款，只知道雨是从天上掉下来的，工人又不是自己把工地淹了。我把双方叫到临时办公室，让他们把实际情况说清楚。最后谈下来的办法是，正常施工按工时结算，因天气和工程安排造成的停工，则按事先约定的标准补偿；工人代表也能参与核对工时，账目贴在工地外面，谁觉得有问题都能提出来。\n财务人员起初担心这样会增加开支，我让他先把之前为争工钱耽误的工期算进去。他算完以后沉默了，第二天主动把新表格印了出来。\n发第一笔工钱时，一个工人拿着单子问我：“以后下雨也有补偿，那我们是不是盼着下雨就行了？”\n我说：“你要真这么盼，最好先问问修路的人答不答应。路不通，咱们谁都拿不到下一份活儿。”\n他想了好久，才把钱收好，转身去检查排水沟了。看样子，至少这回大家都知道该盼什么。"

#晓枫雪伊经济线
#亡灵威胁结束，进入重建阶段
PAM_xfxy_jjhf: "工坊里少了一把锤子"
PAM_xfxy_jjhf_desc: "晓枫：这份工坊清单有一处对不上。战时借走的工具已经归还了，记录上却还写着由军方保管。\n雪伊：那就把记录改过来。总不能一把锤子已经回到工人手里，还要让人家先证明自己拿着的是锤子吧。\n晓枫：问题在于，有些工具确实已经归还，有些还留在部队里修理装备。我不能把它们全算成同一种情况。\n雪伊：那就分开处理。已经还回去的，就把旧记录销掉；还留在部队里用的，就先跟工坊说好，等手头的修理工作一结束便送回去。工坊等着开工，总不能让师傅拿着空手对着机器发愁。\n晓枫：我已经安排人逐间核对。地方工坊原有的机器和工具会优先归还，军方仍需使用的设备则由双方商定期限，必要时支付租用费用。\n雪伊：不错。那把锤子呢？\n晓枫：已经找到，在修理班的工具箱里。\n雪伊：很好。现在请你在清单上注明，它已经结束服役，可以光荣退伍了。\n晓枫：我不会这么写。\n雪伊：那你写得快一点，我还得去找下一把呢。"
#开启南美战争
PAM_xfxy_nyjj: "军令不能当工钱"
PAM_xfxy_nyjj_desc: "雪伊：晓枫，军方的新采购单贴出去以后，厂主们倒是来得挺齐，我还以为大家终于想通了，准备积极支援前线呢。\n晓枫：结果呢？\n雪伊：结果他们排着队来讨上个月的货款。还有个老板特别客气，说只要我们把账结了，新订单随时欢迎，连茶都给我倒好了，就是没让我碰那张采购单。\n晓枫：看来茶水已经招待到位了，剩下就等我们把钱带到位。\n雪伊：可不是嘛！采购处还嫌他们不够配合，说战时订单优先级最高，厂家应该先把东西做出来。我就问了一句，既然订单这么急，能不能先给人家付点原料钱？你猜对方怎么说？财政拨款还在走流程。\n晓枫：那工厂拿什么买原料？\n雪伊：靠信念吧。反正采购处说得挺有信心的，我差点以为他们已经发明了不用烧煤、工人也不用吃饭的新式工厂。\n晓枫：那可得赶紧登记专利，省得别的国家先拿去用了。不过眼下还是先把欠款结一部分，真正急需的订单分批签，给工厂留出买原料的钱，交一批就结一批。我们不能一面催人家赶工，一面让人家自己想办法垫钱，最后机器没转起来，倒先把做买卖的信用花光了。\n雪伊：我也是这么跟他们说的。那个老板听完挺高兴，还答应把我们欠款的数目继续挂在办公室里。\n晓枫：催款告示？\n雪伊：不，他说那是他厂里最稳定的宣传栏，别人家的业绩每个月都有起伏，只有我们同盟，连续几个月都能准时增加欠款。\n晓枫：那可不行。明天你陪我去把账谈清楚，先把能付的付掉，剩下的约好日期。总不能让人家一看见我们的公章，就下意识先去找会计哭穷。\n雪伊：行啊。不过我已经跟老板说好了，下次再贴采购公告，得把付款日期写在交货日期旁边。\n晓枫：这很合理。\n雪伊：他还特意补了一句，最好用大字写。上回交货日期印得那么大，他在厂门口等了一天，还以为自己看漏了付款那一行呢。"
#进入南美战后治理阶段 
PAM_xfxy_nykf: "磨坊重新冒烟了"
PAM_xfxy_nykf_desc: "雪伊：你闻到了吗？这里终于有面粉的味道了。附近农户以前收了粮食，还得四处找人收购；磨坊停工以后，大家宁愿把粮食留在仓里，也不愿意冒险运去远处卖。\n晓枫：战事中断了当地原有的买卖关系，几家大收购商又掌握着通往城镇的运输渠道。农户即使恢复生产，也很难靠自己把粮食卖出去。\n雪伊：庄稼总算长出来了，结果倒在了卖粮食这一步。再这么下去，城里的人抱怨口粮贵，乡下的人发愁粮食卖不掉，两边辛辛苦苦忙活一场，谁都没过上好日子。\n晓枫：恢复磨坊的生产只是开始。地方合作社可以把周边农户组织起来，统一对接收购和加工业务；政府也会公布基本粮食的参考收购价，避免小农户只能接受大商人临时开出的价格。磨坊重新运转后，城镇的日常供应也能逐渐恢复。\n雪伊：这就对了。我们总不能把每个农民都训练成商人，再把每个商人都训练成银行家。\n晓枫：你倒替他们省下了不少工作。\n雪伊：我是在替所有人省时间。毕竟我还等着看看，等这地方恢复正常以后，那些商人还能找什么理由把一袋面粉卖出两袋的价钱。"

#准备攻打樱花
PAM_xfxy_hybd: "便宜的油，\n贵得要死的修理费"
PAM_xfxy_hybd_desc: "雪伊：晓枫，听说采购部上回采购燃料，替我们省了不少钱？\n晓枫：对对！谈价格的时候，他们可是寸步不让。\n雪伊：那船厂为什么给我送来这么厚一沓维修单？\n晓枫：因为他们寸步不让的时候，发动机让了。\n雪伊：……你能不能把话说得像个人一点？\n晓枫：简单来说，燃料便宜，机器不太高兴。\n雪伊：机器还有脾气？\n晓枫：它倒没有脾气。它只是每次启动都要花钱表达意见。\n雪伊：好，那咱们算账。燃料省了多少？\n晓枫：采购价比原来低了不少。\n雪伊：维修花了多少？\n晓枫：不少。\n雪伊：停航损失呢？\n晓枫：也不少。\n雪伊：你们采购部门是不是对“不少”这个词有什么特殊感情？省钱的时候说不少，花钱的时候也说不少。合着一整本账簿，就没有一个数能让我高兴一下？\n晓枫：有啊。燃料单价。\n雪伊：我现在看见这个数字就头疼！它到底便宜在哪里？\n晓枫：便宜在买的时候。\n雪伊：那买回来干什么？\n晓枫：为了用呀。\n雪伊：用不了呢？\n晓枫：那就修。\n雪伊：修不好呢？\n晓枫：那就换。\n雪伊：换什么？\n晓枫：换一种适合发动机的燃料。\n雪伊：……你绕这么大一圈，是不是想告诉我，咱们花钱买了一批不能好好用的油？\n晓枫：也不能这么说。它还是有价值的。\n雪伊：什么价值？\n晓枫：让我们认识到了发动机对燃料的要求。\n雪伊：这知识多少钱一桶？\n晓枫：如果只算采购费，其实很便宜。\n雪伊：那加上维修费呢？\n晓枫：知识就比较贵了。\n雪伊：晓枫！\n晓枫：好啦好啦，我知道！\n雪伊：供应商不是说这批燃料符合要求吗？\n晓枫：符合要求。\n雪伊：那发动机怎么坏了？\n晓枫：符合的是合同里的要求。\n雪伊：合同要求和发动机要求不是一回事？\n晓枫：本来应该是一回事。可当时合同写的是燃料的通用指标，没把几种老式发动机的特殊要求列进去。\n雪伊：所以供应商按合同交了货，采购部按合同付了钱，船厂按发动机的要求修机器？\n晓枫：对，大家都有依据。\n雪伊：那谁负责让船开出去？\n晓枫：……这件事，好像没有写进合同。\n雪伊：行。以后采购不能光看合同和报价，还得让技术部门先核对燃料规格，算清采购、维修和停航的总成本。\n晓枫：明白。以后我们争取让每一桶油都物有所值。\n雪伊：那这批油呢？\n晓枫：先留着，看看有没有合适的船。\n雪伊：晓枫，你刚才才说不能为了便宜买不合适的燃料。\n晓枫：对，所以这次我打算先找船，再决定怎么处理油。\n雪伊：……恭喜你，终于学会了先看东西能不能用，再考虑买回来放在哪里。\n晓枫：谢谢。我觉得这次培训很有价值。\n雪伊：培训费呢？\n晓枫：已经记在维修费里了。\n雪伊：你给我站住！！"
#樱花战后
PAM_xfxy_zsjj: "这张钞票还没认输"
PAM_xfxy_zsjj_desc: "雪伊：晓枫，我今天买咖啡，店主收了同盟的钱，找零却给了我一张樱花的旧钞。他还说照样好用，语气亲切得像在替老朋友求情。\n\n晓枫：旧钞还有人用，商品也还按原来的价格卖。现在突然宣布作废，明天买早饭的人就得先操心钱包了。\n雪伊：那总不能让两种钱在街上打擂台吧？以后买杯咖啡，还得先问问它今天支持哪一边？\n晓枫：所以要先公布兑换办法和期限，给大家留出过渡时间。钱什么时候能用、去哪儿兑换，都得说清楚。\n雪伊：那我这张还能花？\n晓枫：能，按规定使用或者兑换。记得看期限，别拖到最后一天。\n雪伊：放心，我会照顾好它。万一哪天它东山再起呢？\n晓枫：它只是一张旧钞，你怎么还给它安排上复国大业了？\n雪伊：我这叫有备无患！而且店主答应我下次打折，我得留着这张钞票，看看明天能省多少钱。\n晓枫：打折跟你拿哪种钱有什么关系？\n雪伊：关系可大了！万一旧钞一兑换，咖啡就涨价了呢？\n晓枫：货币兑换又不会替咖啡涨价。\n雪伊：那你能保证店主不涨？\n晓枫：……不能。\n雪伊：你看！所以我关心货币政策，归根结底也是关心民生。\n晓枫：你关心的民生，是你手里那杯咖啡吧？\n雪伊：当然。国家大事我可以慢慢研究，打折可不能过期！"
#迈向世界
PAM_xfxy_sjmy: "拖拉机到了，零件呢"
PAM_xfxy_sjmy_desc: "雪伊：晓枫，海外贸易代表团回来啦！我们送去的拖拉机很受欢迎，当地报纸还登了照片。\n晓枫：那很好。后续订单呢？\n雪伊：暂时没有。当地合作社说，机器确实好用，可坏了以后找不到合适的零件，最后只能停在田边当风景。\n晓枫：我们把机器卖过去，却没把维修办法和零件供应安排好。光有交货记录，不能算生意做成了。\n雪伊：代表团倒是带回了一份建议。他们希望我们派技术员过去教人维修，还愿意用本地生产的农产品支付一部分费用。\n晓枫：可以谈。技术培训由双方商定，零件供应也要有稳定合同，不能让人家每次坏一颗螺丝，都得等同盟的船开过海。\n雪伊：我已经把新方案送去讨论了。代表团长还说，这次总算知道当地人真正需要什么。\n晓枫：他以前以为他们需要什么？\n雪伊：他说，他们需要一台拖拉机。\n晓枫：这不是已经送去了吗？\n雪伊：所以他现在觉得，自己至少猜对了一半。"

##小遥经济线
#亡灵威胁结束，进入重建阶段
PAM_xy_sc: "我现在看见鸡就烦"
PAM_xy_sc_desc: "亡灵被赶走以后，莉兰迪亚终于重新开起了市政厅。公社的人忙着恢复食堂、修理街道，军团则还在按照战时习惯安排人手，双方倒没有因为这些事闹出什么大矛盾，直到巴罗把一只鸡带进了预算会议。\n小遥原以为他是来汇报清剿时发现的幸存者，结果巴罗把鸡往桌上一放，说军团最近的伙食改善有了新办法，申请拨一笔钱，给它修个像样的鸡棚。\n公社的会计抬起头：“我们连被炸掉的公共厨房都还没修好，你先给鸡申请住房？”\n巴罗回答得很自然：“虽然厨房不会下蛋。”\n“可厨房能做饭啊。”\n“那你们倒是先把锅找回来啊。”\n小遥赶紧打断两人。她知道城里的锅确实丢了不少，可她实在没想到，战后重建的第一次预算协调，会变成厨房和鸡之间的辩论。\n会计坚持，公共食堂眼下最缺的是锅、柴火和能干活的人，鸡棚应该往后排。巴罗则认为，鸡能稳定提供食物，养好了比等外地运粮可靠得多。双方说的都有道理，偏偏谁也没注意到，那只鸡已经跳上桌子，把会计刚整理好的预算表踩出了一串爪印。\n小遥把纸救下来时，巴罗还挺高兴：“你看，它已经开始参与你们的生产了。”\n会计的脸色变了：“那它踩坏的纸算谁的成本？”\n“算它的启动资金吧。”巴罗说。\n小遥终于笑出了声。她让公社先把公共厨房恢复到能开火的程度，军团则可以用现有材料搭个简易鸡棚，先养着这只鸡，等食堂和供给恢复后再考虑扩大饲养。鸡蛋送去食堂，饲料和修棚的开销单独记账，别为了证明某种办法更先进，就把眼前真正缺的东西给耽误了。\n会议总算结束了。巴罗抱起鸡准备走，临出门时又问小遥：“那我能不能给它安排个勤务兵？每天有人负责喂食，顺便观察产蛋情况。”\n小遥说：“你要是能说服公社，让他们给鸡编制，我就承认你比亡灵更懂怎么制服活人。”\n巴罗认真考虑了一下，最后决定还是自己喂。毕竟他打过那么多仗，实在不想在战后第一份人事申请上，写出“鸡的直属负责人”这么丢人的职务。"
#开启南美战争
PAM_xy_nyjj: "生意兴隆，物价稳定"
PAM_xy_nyjj_desc: "小遥在街上遇见一位卖炖菜的大叔。大叔正蹲在摊子旁边，拿着粉笔修改木牌上的价格。她凑过去看了一眼，发现价格确实比前几天低了一些。\n“哇，真的降价啦！是因为战争终于没有那么影响物价了吗？”\n大叔摇摇头：“不是，是我把肉拿掉了。”\n“诶？”小遥探头看了一眼锅里，“那里面现在煮的是什么呀？”\n“土豆、胡萝卜，还有一点汤。肉太贵了，照以前的分量卖，我连煤钱都赚不回来。”\n小遥想了一小会：“那您可以少降一点价嘛？这样至少还能放些肉进去呀。”\n“那可不行。街区最近在宣传物价稳定，大家都盯着价格看呢。我今天要是涨回去，明天就会有人来问我为什么不响应号召。”\n“可是，您把肉拿掉了，大家不也会问吗？”\n大叔突然沉默了，随后他指指木牌说道：“所以我特意把菜名也改了。以前叫炖肉，现在叫时蔬浓汤。”\n小遥踮着脚往那口锅里仔细看了看。\n“可是大叔，这个汤一点也不浓呀。”\n“所以我正在考虑改叫时蔬清汤。名字一改，就不算同一道菜了。”\n“那要是以后连蔬菜也涨价了呢？”\n大叔认真地思考了一会儿：“那就叫清汤。”\n小遥忍了又忍，还是笑出了声。可笑完以后，她看着锅里稀薄的汤水，又有些笑不出来了。\n“那……大家会不会吃不饱呀？”\n“会啊。”大叔答得很坦然，“所以我在旁边还卖着面包。面包不在炖菜的限价范围里。”\n小遥一下子睁大了眼睛：“那面包是不是很贵？”\n“聪明！小姑娘，你很有做生意的天赋嘛。”"
#进入南美战后治理阶段
PAM_xy_zjdq: "庄稼等得了地契吗？"
PAM_xy_zjdq_desc: "小遥跟着地方经济委员会去了解一处荒废的庄园。庄园代理人带着以前的地契，坚持土地仍归原来的主人所有；附近的农户则说，他们早就在这片地上耕种，只是战乱烧毁了原来的凭据。代理人认为缺少文件就不能继续耕种，农户担心再争论下去，眼看要来的雨季又得白白错过。\n小遥听着双方争执，发现两边谁也不肯让出这片地，又谁都不想承担土地荒废的损失。她觉得，产权需要查清，农时也得顾上。战后暂时无法理清归属的土地，但可以在地方议会协调下交由实际耕作者临时耕种，等原有权利得到核实，再依照法律处理后续安排。愿意恢复生产的小农户也应当获得种子和农具方面的信贷支持，免得土地终于能种了，农户手里连买种子的本钱都没有。\n复耕开始以后，庄园代理人仍然坚持要求在地图上保留原主人的名字。小遥答应了他，随后把地图递给农户，请他们也把实际耕种的地方标清楚。代理人对这件事颇有意见，小遥倒觉得很公平：既然大家都说这片土地归自己管，至少该先弄清楚，究竟是谁一直在田里干活。"

#准备攻打樱花
PAM_xy_ydjj: "面包不能兼任砖头"
PAM_xy_ydjj_desc: "远征采购的面包送到验收点时，负责签收的军需官正拿着小刀费劲地锯面包。小遥本来只是过来问问采购开支，听了一会儿，才知道这批面包是专门为远征准备的。供应商保证它们耐放耐摔，价格还比其他商家的便宜不少。\n小遥拿起一块面包，在桌沿敲了一下，声音倒是挺清脆的。\n“这个真能吃吗？”\n“能，当然能！只是需要一点技巧。”军需官连忙解释，“供应商说，泡进热汤里就会软一些。”\n小遥又问：“那要是前线没有热汤呢？”\n军需官顿时没了声音。恰好路过的巴罗顺手拿了一块，垫在摇晃的桌腿底下，整张桌子立刻稳当了不少。他满意地点头：“这玩意儿不错，至少比仓库里那块烂木头结实。”\n“巴罗叔！”小遥差点把手里的面包捏出裂缝，“我们是花钱买口粮，不是来给军营采购建筑材料的！”\n这事追根究底，还真不能全怪供应商。原先的采购合同只要求面包能保存足够长的时间，价格越低越好，却没有明确规定硬到什么程度就不能拿来吃。负责采购的人觉得自己压低了开支，供应商也觉得自己严格按照合同办事，最后只有真正要吃这些东西的士兵没有发言的份。\n小遥只好让军需处重新制定验收办法。以后的采购不能只比较价格，面包得先抽样试吃，重量和保存情况也要符合约定；不合格的货物不能照常结算，供应商得负责更换。她还要求部队在大批采购前先试用一小批，免得纸面上的好买卖，到了前线全变成啃不动的麻烦。\n几天后，负责采购的军官拿来了一份新的合同，满脸认真地请小遥确认其中一条补充规定：面包不得用于垫桌腿、堵门缝及其他非食用用途。\n小遥把那行字从头到尾读了两遍，抬手揉起了脑门。\n“……这条先删掉。咱们得让人家把面包做好，不是让全世界知道巴罗叔拿军粮修桌子。”"
#樱花战后
PAM_xy_mdtz: "菜单上的兔子不卖"
PAM_xy_mdtz_desc: "樱花战后，春日小遥发现附近的饭菜越来越贵，许多工人下班后只能随便买点东西填肚子。她支持当地居民合办食堂，大家一起采购食材、分担工作，饭钱照着实际开销来算，每笔收支都记在公开的账本上。\n食堂开张前，小遥主动帮忙画菜单。她觉得墙上贴着几张冰冷的价目表实在太严肃了，便在胡萝卜炖菜旁边画了一只圆圆的小兔子，还特意给它画了两颗很亮的眼睛。\n第二天，厨师跑来问她：“你昨天画的那只兔子，是不是也算在菜钱里了？一早就有孩子来问，炖菜里有没有兔肉。”\n小遥愣住了：“可我画的是兔子呀！”\n厨师说：“我也解释了，可孩子问我，既然菜单上有兔子，为什么端上来的只有胡萝卜。”\n小遥赶紧拿起粉笔，在旁边写上“图案仅供欣赏，菜里没有兔子”。她原本以为这下总算解释清楚了，结果记账的大婶拿着账本过来，说菜单用的粉笔也得记进食堂开支里。\n小遥低头看着账本，认真问：“那我画的兔子要不要算工钱？”\n大婶笑了：“你要是肯天天来画，我们就给你安排个活儿。不过今天这只兔子先欠着，等食堂赚了钱再说。”\n小遥把兔子又画得圆了一点，觉得自己好歹也算给食堂出了力。过了几天，她再来时，发现那张菜单旁多了一行字：“本店不供应兔肉，画兔子的同志也不负责抓兔子。”\n她盯着那行字看了半天，最后红着脸把自己的名字补在了菜单下面。毕竟食堂的账都公开了，总不能连这只兔子是谁画的都说不清楚。"
#迈向世界
PAM_xy_sjjj: "机器归大家，钱也归大家"
PAM_xy_sjjj_desc: "春日小遥第一次走进那间工人合作社时，所有人都显得精神倍增。老板留下的机器已经重新开动，工人们自己选出了管理生产的人，还在墙上挂了一块新牌子：工厂属于全体工人。\n小遥很高兴。她觉得这大概就是一件好事开始的样子。\n直到她问起这个月的收入该怎么分。\n“按工时分。”一名钳工说。\n“那干得快的人岂不是吃亏？”车床师傅立刻反对。\n“按产量分吧。”年轻学徒提议。\n“那谁来修机器？修机器的时候又不出产品。”\n“那就把维修也算进去。”\n“那谁来检查质量？次品也算产量吗？”\n屋子里一下子热闹起来。有人拿来账簿，有人搬出计算尺，还有人提议成立一个专门研究分配办法的小组。\n小遥听得眼睛都亮了。她认真地记下每个人的意见，最后举起手来：“那个……要不我们先决定一个最简单的办法，再慢慢修改，好不好？”\n大家安静下来，觉得这个提议很有道理。\n于是，他们花了整整一个下午，制定出一套每个人都能查看账目，每个人都能提出意见，每项决定都有明确的程序的办法。\n第二天，工厂没有开工。\n小遥赶到时，发现工人们正围着一张表格争论。昨天选出的管理人解释说，按照新规定，生产开始前必须先确认本日的劳动分配，而劳动分配又要根据当天的生产计划确定。至于生产计划，必须由全体成员通过之后才能生效。\n“那你们昨天不是已经商量好了吗？”小遥问。\n“昨天商量的是分配办法，今天要决定的是怎么使用分配办法。”\n“那决定完了就能开工了？”\n“当然。只不过，如果今天的工作安排和昨天通过的原则有冲突，还得先讨论原则是否需要修改。”\n小遥张着嘴眨巴了两下眼睛，才小声说：“哇……你们真的什么都自己决定了耶。”\n管理人露出自豪的笑容：“那当然。这里已经没有人能替大家做主了。”\n就在这时，角落里传来一声巨响。一台老机器卡住了，皮带在空转中发出刺耳的摩擦声。\n维修师傅跑过去关掉机器，检查片刻后，回头喊道：“皮带裂了！得马上换新的！”\n所有人都看向小遥。\n小遥愣了一下：“看我干什么？快修啊！”\n“新皮带要花钱。”管理人提醒她，“这笔开支得由大家同意。”\n“那就同意呀！”\n“可是这笔钱应该从维修基金里出，还是从本月的共同收入里出？如果从共同收入里出，会不会影响大家的报酬？”\n小遥眼睁睁看着工人们又要围到桌边，终于忍不住鼓起脸颊。\n“等、等一下！机器都停了，还要先开会决定从哪里拿钱修机器吗？！”\n小遥挽起袖子，走到桌边。\n“好啦！那我们先决定一件事。”她指向了停下来的机器，“以后遇到这种会让大家一起没饭吃的小事，能不能提前商量好，别等它坏了才开始讨论？”\n维修师傅第一个举起了手。\n“赞成。最好现在就把这条皮带的钱批了。”"




####事件####
PAU_by_h1.t: "它……在门后面？"#白夜溜达事件1阶段
PAU_by_h1.d: "我正坐在灯下，手里捏着两根针对着那件还没织完的粉红色毛衣发呆。\n这是莉泽姐姐去年秋天留下的毛线，她本来答应在我生日前织好送我的，可毛衣才织到领口，她就永远留在了坍塌的矿道里。\n我试着照记忆里的针法往下挑了一针，地窖突然传出了指甲刮擦木板的声响。\n“真是的，收针的时候线拉得太紧啦，艾玛。”\n隔着木板传出来的撒娇声，分明属于我的姐姐莉泽。\n可那场矿难连她的遗体都没能挖出来，山坡的墓碑底下至今只埋着一只空盒，她怎么可能从我家地窖里叫我的名字呢？\n“你还坐在那儿发什么呆呀？把插销拉开，姐姐手把手教你把剩下的毛衣织完，好不好？”\n明知道巡逻队白天刚贴过告示，警告大家夜里有死气模仿亲人的声音骗人开门；可听见那句温柔的哄劝，我还是鬼使神差地放下针，一步步走向了地窖：万一她真的顺着地底的路走回来了呢？\n还没等我的手碰到地窖门上的插销，旁边的窗户突然被什么东西从外面顶开了。\n一团长得像雪白毛绒玩偶的小家伙顺着窗缝钻进房间，前爪在粉红毛线团上踩了一脚，直接跳上桌叼走了我放在碟子里的苹果。\n被它这么一打岔，地窖门后面的刮擦声当场消失得无影无踪。\n那个圆滚滚的毛球几口咽下果肉，歪着脑袋冲我“咪呜”叫了一声，顺着窗缝溜进了夜色里，只把那团粉红毛线滚到了我的脚边。"
PAU_by_h1.a: "“……那是什么动物？”"

PAU_by_h2.t: "这根线多出来了"#白夜溜达事件2阶段
PAU_by_h2.d: "“艾玛，你手里的线走歪了哦。”\n听到邻座玛莎的提醒，我才发觉自己手里的缝衣针已经停了很久了。\n后勤工坊的缝纫机从清晨一直响到了现在，我们正赶着修补一批刚从前线退下来的军大衣。\n摊在膝上的这件大衣我一眼就认得，上个星期也是我亲手补好了它领口的裂痕，可今天再送回来的时候，心口的位置已经多了一个被弹片撕开的大洞，整件衣服全被暗红的血水浸透了。\n在这座被亡灵围困的城里，无论我多用心地把衣服补好，穿它的人过几天就会变成冷冰冰的尸体，脱下来的血衣还要洗干净再发给下一个去送死的人。\n手底下的呢料冷得像冰块一样，大衣内衬那截姓名布签在眼前花了影，上面原本写着的士兵名字，居然变成了“莉泽”两个字。\n耳边隐约飘来了姐姐轻柔的叹息，劝我别再白费力气缝这些裹尸布了，只要拿手边的裁衣剪往手腕上划一道，就再也不用闻这股洗不掉的血腥味了。\n“艾玛！你拿剪刀往手腕上靠什么呢？！”\n玛莎一把夺下了我手里的剪刀。\n工坊里规律的踏板声重新灌回耳畔，我这才发现自己的手背刚才被针尖扎破了。\n我从裙袋里摸出一小团昨晚剩下的粉红色毛线，剪下一截穿进针眼，一针一针地把那个恐怖的弹孔缝合了起来：\n“对不起，玛莎姐，我刚才走神了。我刚刚想到前线的人说穿死人留下的衣服不吉利……”"
PAU_by_h2.a: "“用上这种颜色的线，大家一定会平安回来的……”"

PAU_by_h3.t: "今晚的土豆炖得太咸了"#白夜溜达事件3阶段
PAU_by_h3.d: "“姐，这盘炖土豆怎么咸得发苦呀，妈妈是不是把盐罐子打翻进锅里了？”\n晚饭桌上，弟弟莱恩刚尝了一口土豆就皱起小脸，被我从桌子底下踢了一脚。\n“胡说什么呢，我吃着明明刚刚好！”\n我连忙把盘子里的土豆往自己碗里拨了一大勺，大口吃了起来，故意冲坐在灶台边的妈妈露出灿烂的笑脸：\n“妈妈炖的土豆最香了，我在工坊忙了一整天，正好想吃口重味的呢！”\n妈妈勉强牵起嘴角，顺手把一杯加了果酱的红茶推到我面前：\n“慢点吃，别噎着。要是工坊的活太累，明天就在家休息一天吧。”\n其实我心里清楚今晚的土豆为什么会这么咸。\n莱恩傍晚回家时跟邻居们闲聊，说巡逻队在城外矿坑附近看见了穿浅蓝色连衣裙的亡灵，头发上还系着跟莉泽姐姐一模一样的白色发带。\n妈妈听见这话的时候什么都没说，只是刚才躲在灶台后面切土豆的时候，眼泪一直在往锅里掉。自从姐姐出事以后，妈妈每天夜里都会偷偷给玄关留一道门缝，总盼着姐姐能推门回来。\n“对了姐，我今天在街上撞见一只像白猫又像小狐狸的圆毛球！”莱恩举着叉子换了个话题，“它吃光了我分给它的红薯，冲着雾气最浓的后巷呜呜叫唤，结果原本冷飕飕的怪雾当场就散开了！”\n趁着妈妈去洗碗的工夫，我隔着裙袋按住那把剪刀，在心里暗暗拿定了主意，绝不能让外面那个顶着姐姐脸孔的怪物，顺着妈妈留下的门缝摸进我们家里来。"
PAU_by_h3.a: "“妈，我出门一趟，\n我有带钥匙的，记得锁门哦。”"

PAU_by_h4.t: "跟我来吧"#白夜溜达事件4阶段
PAU_by_h4.d: "从军需库送完大衣出来，商店街的路灯已经笼在了一片白雾里。\n就在离我家只隔着一条窄巷的街口，果真站着一位穿浅蓝色连衣裙的少女，马尾辫上系着那条我最熟悉的白色发带，正痴痴地朝我家留着门缝的玄关张望。\n为了不让她靠近我家院门，我捏紧拳头，主动走到路灯底下叫住了她：\n“姐……你是来找我的吗？妈妈和莱恩都已经锁门睡着了，我们去城外没有人的地方说话，好不好？”\n她闻声回过脸来，微笑着走上前牵住我的手，她的掌心冷得像刚落下的雪花，也依然带着姐姐生前惯用的皂角清香：\n“好呀。以前每次天黑之后，艾玛明明都要牵着我的手才敢往前走呢。”\n我本想把这只怪物引到巡逻队经过的坡口，可走着走着，听着她用莉泽姐姐那副宠溺的嗓音哼起儿时的摇篮曲，我紧绷的念头却不知不觉松动了。\n“艾玛这阵子装成坚强的大人，一定累坏了吧？今晚的土豆那么咸，你连一句抱怨都不敢跟妈妈说，姐姐瞧着都替你心疼呢。”\n她温柔地替我理好被冷风吹乱的刘海，声音听着像一场让人不愿醒来的梦：\n“别再勉强自己了，跟姐姐走吧。只要你跟姐姐一起去地底下，就再也不用强颜欢笑，可以永远当那个躲在姐姐怀里哭鼻子的小艾玛了。”\n压抑了几个月的委屈终于涌上了心头，我的眼泪夺眶而出，反手抓紧了她冰冷的手掌：\n“姐……哪怕你是骗我的也好，再牵我走一段路吧，我真的好想你啊……”"
PAU_by_h4.a: "“不要…放开我……”"

PAU_by_h5.t: "快拉她上去"#白夜溜达事件完成后由19事件触发#
PAU_by_h5.d: "听见悬崖边传来惊呼声，我和雪伊当即带着前锋连队冲上了废弃矿坑的斜坡。\n崖沿的泥土已经塌了一大片，那个叫艾玛的工坊少女正悬在断口边上，坑底全是往上攀爬的腐尸，而上方岩层裂缝里伸出的一只苍白手骨，正扣着她的脚踝。\n在雪伊端起枪就要打碎那只手骨之前，我先一步扑到崖边抓住了艾玛的手腕，奇怪的是，就在我抓稳她的瞬间，岩缝里那只把她脚踝勒出青紫淤痕的手骨突然松开力道，缩回碎石深处不见了，只在她鞋扣上留下了一条发带。\n等把人拉回安全的草坡上，我还是没忍住训了她一句：\n“你不要命了吗？明知道外面有亡灵，怎么还敢一个人跟着假货往悬崖边上跑？！”\n艾玛坐在草地上，把鞋扣上那条沾着泥土的白色发带解下来抱在怀里，哭了起来：\n“我本来是想把它从我家附近引开的……我怕妈妈看见它的脸会去开门……可走在路上的时候，它牵着我的手跟我说话，我因为太想念姐姐，居然真的动摇了，甚至想过干脆跟它一起死掉算了……”\n她摸着脚踝上那圈深紫色的淤痕，带着哭音小声埋怨起来：\n“结果刚才掉下去的时候，石头缝里伸出来的那只手，拽得我脚腕骨头都要碎了……”\n“这才是莉泽姐嘛。她以前在街上拉住乱跑的我，力气也总是这么大，从来都不会跟我客气……”\n话音未落，山谷下方发觉诱饵落空的尸潮主力发出了刺耳的咆哮，黑压压的亡灵正顺着矿山小路往我们这处高地涌来。\n艾玛擦干脸上的泪水，拿那条白色发带把自己散开的长发利落地束好，忍着脚踝的剧痛站起身来：\n“阿夏长官，我姐姐已经把她的发带还给我了，这底下早就不关她的事了。现在从山谷里爬上来的全是冒牌货——请你们开火吧，别让它们再顶着那张脸往镇子去了！”"
PAU_by_h5.a: "“交给我们吧。”"

PAU_by_wide.t: "信我的准管用"#白夜溜达事件最终阶段
PAU_by_wide.d: "“春日小姐，前几天答应送您的谢礼，我已经织好啦。”\n刚回到后勤室，我就看见艾玛挎着竹篮走了进来，受伤的脚踝上还缠着纱布，一进门就冲我们笑得眉眼弯弯。\n正在桌边偷吃曲奇饼干的小遥连忙拍掉手上的碎屑，神气活现地迎了上去：\n“哇，是艾玛呀！前天本小姐传授给你的神社除灵秘术是不是超灵验的？我就说只要在窗台摆上小鱼干，白夜肯定会去保护你们家的！”\n“嗯，白夜大人昨晚确实来得特别准时呢。”\n艾玛把一个空碟子放到了桌上，歪着脑袋认真汇报起来：\n“它一口气吃光了整碟小鱼干，结果准备离开的时候，因为圆滚滚的肚子太胖，直接卡在了我家厨房的通风小窗上，四条小短腿悬在空中扑腾了一整晚呢。”\n“卡、卡在窗户上了？！”\n“是呀，它委屈得‘咪呜咪呜’叫个不停，把整条街的流浪猫全吸引过来排排坐围观了。最后还是我弟弟拿油抹在窗框上，才把白夜大人推出来的哦。”\n小遥干笑两声，硬着头皮把胸脯一挺：\n“那、那也是我计算好的！既然你们全家昨晚光顾着给白夜涂油，那肯定就没空害怕晚上的怪声了吧？我的除灵秘术明明大获成功嘛！”\n我在旁边听不下去了：“别听她胡扯，外围的亡灵昨晚已经被我们清干净了。小遥，赶紧把小鱼干的钱赔给人家。”\n“不用赔钱的，阿夏长官！”\n艾玛从竹篮里捧出一件蓬松柔软的织物递给小遥，笑得眉眼弯弯：\n“这件粉红色毛衣原本是姐姐留下的，昨晚借着大家热闹的劲头，我终于把最后两只袖子织完啦！我看春日小姐平时总穿那件灰扑扑的风衣，个子又跟我不相上下，所以送给春日小姐当谢礼哦！”\n小遥接过那件粉得冒泡的少女毛衣抖开一看，当场抱住脑袋发出了绝望的悲鸣：\n“慢着！为什么谢礼会是一件粉红色的衣服啊？！我穿成这样去码头，会被船上的水手笑话一辈子的！艾玛，这件衣服我穿不出去啊！！”"
PAU_by_wide.a: "“挺合身的，今天出门你就穿这件粉毛衣吧。”"

PAU.60.t: "这关卡越来越多了"
PAU.60.d: "巴罗进门的时候难得没有大声嚷嚷，反而客客气气地往我桌上放了一小罐茶叶。\n“无事献殷勤，你们二连又在街上惹什么麻烦了？”\n“看您说的，长官，我们这几天连大声说话都不敢。我是替几个营的弟兄来跟您商量点正事。”\n“有话直说，少绕弯子。”\n“是这样，当初为了安抚人心，您不是答应让工会派代表参与治安和物资调配吗？可现在这帮工会干事的手伸得实在太长了。昨天我们拉一车备件过街口，几个戴红袖章的年轻工人非说我们没填她们的夜间通行单，拦在路中间盘问了快一个钟头。”\n“按规矩夜间行车本来就要登记，你们把单子补上不就完了？”\n“长官，我们是正规军，哪有打仗的部队出门还要向工人打报告的道理？底下的老兵心里都憋着气呢。依我看，现在城里早就安稳了，不如趁机把街道巡逻和车队调度的签字权收归参谋部，让工会的人安心回厂里管生产，别再掺和防务的事了。”"
PAU.60.a: "也罢，防务和调度的事还是收归军方管吧。"
PAU.60.b: "少打这种主意，回去按规矩把通行单补上。"

PAU.61.t: "我们的学校还缺几间教室"
PAU.61.d: "雪伊今天推门进来的时候居然没有寒着脸，而是把一份写得漂漂亮亮的市政规划表铺在了我的面前。\n“今天太阳打西边出来了？你来找我居然没先兴师问罪。”\n“少拿话刺我，我今天是来谈正经市政建设的。你自己看看这张表，港口南边那排砖房，原本是给码头工人办夜校和诊所用的，结果你们军团的后勤连从进城那天起就一直占着当宿舍，到现在都不肯腾出来。”\n“南边靠近海湾，留一个连驻扎在那里是为了防备海面上的突发状况。”\n“海面上现在除了打鱼的船还能有什么状况？我看他们每天在院子里除了晒太阳就是擦靴子。而且不光是房子，现在连采购的煤炭和建材，都得先经过你们军需官的审批。现在仗早就打完了，哪能让军队一直压在百姓头上？”\n“所以你的意思是？”\n“把南边的驻军撤回城外营区，顺便取消军需官对物资的联席审批权。学校、诊所和街区的事，以后交还给工人委员会来管，你们当兵的只要管好外围防线就行了。”"
PAU.61.a: "她说得有道理，把审批权和房子交还给工会吧。"
PAU.61.b: "驻军不能随便撤，审批的规则也给我按以前的来。"

PAU.62.t: "十二封告状信"
PAU.62.d: "办公桌左边堆着六封工会递上来的投诉信，右边摆着六份老兵连队写的抗议书，雪伊和巴罗分别坐在房间两头的椅子上，谁也不理谁。\n小遥抱着白夜坐在桌子中间，拿起两边的信纸挨个念了出来：\n“礼拜二，军团巡逻队以检查路基为由，把工会运送食材的板车扣了两个钟头；礼拜三，公共食堂的工人说锅炉坏了，单单停了营房的热水；到了昨天更厉害，两边为了争广场宣传栏的钥匙，差点把市政厅的大门给卸了。”\n“是他们先在宣传栏上乱贴军管通告的！阿夏既然不肯裁撤他们的审批权，我们工会自然得自己想办法！”\n“明明是你们的人先在路口故意卡我们的车！长官心软不肯治你们，我们还不能按条例查车了？！”\n“行啦，两边都给我闭嘴！”\n小遥把那十二封告状信扫进抽屉锁上，随后抓起大统领印章摆在桌面上：\n“你们前阵子轮流跑来找阿夏吹耳边风，想把对方挤下去，阿夏一次都没答应；现在见走不通阿夏的路子，干脆在底下玩起这种小孩子过家家的把戏了是吧？”\n“小遥，你这话什么意思？难道还要一直这么耗下去吗？！”\n“什么耗下去？全部给我退回原位！我已经让晓枫重新核对了建制清单，过去几个月不管是工会多占的配额，还是军团多划的驻地，今天日落前全部清零作废，一切严格按最初商定的中线平分！”\n“那要是以后再有人越界呢？！”\n“再有下次，不管是谁先挑事，我就把你们两个的办公桌搬进我的房间面对面摆着，什么时候学会好好说话了，什么时候再让你们出来！”"
PAU.62.a: "“都听见了吧？散会！”"
