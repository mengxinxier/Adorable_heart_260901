PAU_news.1.t: "$news_event_background$南美统一"
PAU_news.1.d: "最初，谁也没有指望过奇迹会发生。\n这里有的只是一群为了活命到处扯谎的异乡少女、失去旗帜与饷银的雇佣兵，还有守着车间从不退后的工人们……\n远方的舰队与逃亡的贵族曾笃定地断言，这帮满身污迹的流亡者迟早会在猜忌与饥饿中自行瓦解。\n然而，当跨越海洋的船笛与穿过平原的车鸣在山谷间交融，当那些阻断道路的铁网在雨水与新草中化作泥土，整片大地的伤口，竟真在这群一无所有的人手中慢慢愈合了。"
PAU_news.1.a: "她们不再打算逃跑了"
