PAU_army_reform_recon: "建立军属侦察网"
PAU_army_reform_recon_desc: "把各连队里会认路、会画图、会听动静的人重新抽出来。老兵带新兵，把山路、渡口和废弃阵地都标回地图上。"
PAU_army_reform_recon_tt: "消耗 15 点陆军改革点，获得侦察和计划修正。"
PAU_army_reform_supply: "统一弹药与口粮配给"
PAU_army_reform_supply_desc: "后勤不再各连各管各的，仓库、车队和前线按同一本账发放。谁多领了，单子上写清楚。"
