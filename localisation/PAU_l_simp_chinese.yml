PAU.600.d:0 "外交协作：统一对外口径，改善与各国的关系。"
PAU.600.a:0 "工业协作：集中力量扩建工厂与机床产业。"
PAU.600.b:0 "基建协作：优先修铁路、公路与港口。"
PAU.600.c:0 "贸易协作：降低关税壁垒，扩大共同市场。"
