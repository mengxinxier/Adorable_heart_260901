#### PAU 外交事件与旗标 ####
PAU.630.t:0 "来自南美的请柬"
PAU.630.d:0 "信使抵达时，窗外的天色已经暗了下来。他将一份盟约放在桌上，随后展开随行带来的军械清单、教官名册与大西洋航线图。\n\n“我们希望你们加入革命国际。”使节说，“我们可以派遣志愿者、教官和医务人员，也愿意分享那些来之不易的经验。但我必须把另一件事说在前面：这份盟约不会只在胜利时生效。倘若革命的道路再次被人用枪炮堵住，我们也希望你们站在我们这边。”\n\n他把钢笔放在了盟约旁边。远隔重洋的同志已经伸出了手，接下来要由我们决定，是否愿意接住这份信任。"
PAU.630.a:0 "签下盟约，加入革命国际。"
PAU.630.b:0 "收起请柬。我们的道路，仍由自己决定。"

PAU.640.t:0 "和平联盟的请柬"
PAU.640.d:0 "白夜同盟的贸易使团再次来到门前。这一次，随行的文件里除了采购订单和港口协定，还多了一份防务盟约。\n\n“我们的商船可以为贵方提供护航，贵方的港口也将在约定的条件下向我们的船队开放。”使节将条款推到桌前，“我们需要的是稳定的航线、可靠的伙伴，以及在危急时刻能够兑现的承诺。”\n\n他又补充道：“这份协议不要求双方拥有相同的理想。只要我们都明白，哪些事情值得合作，哪些界限必须尊重，就足够了。”\n\n桌上的条款写得清楚，留给我们的考虑时间也同样清楚。今晚之前，双方需要一个答复。"
PAU.640.a:0 "签署盟约，加入和平联盟。"
PAU.640.b:0 "婉拒邀请。眼下，我们还承担不起新的承诺。"

PAU_international_brigade:0 "国际志愿旅"
PAU_international_brigade_desc:0 "志愿者、军事教官与医务人员从各地陆续抵达。他们带来了不同的语言、各自熟悉的战术，以及对这场斗争截然不同的理解。要让这些人并肩作战，光有共同的旗帜还不够；白夜同盟必须学会把来自远方的经验，变成自己的力量。"

PAU_trade_boom_diplomacy:0 "贸易与外交的繁荣"
PAU_trade_boom_diplomacy_desc:0 "新的订单与稳定的航运让港口重新忙碌起来。原料有了更可靠的来源，商人敢于签下更长久的合同，地方市场也逐渐恢复了活力。外交带来的好处未必会写进战报，但人们开始发现，明天的生意终于值得提前盘算。"

PAU_coastal_security:0 "岸防安全承诺"
PAU_coastal_security_desc:0 "盟约为白夜同盟争取到了更可靠的港口协作与海上支援。岸防部队不必再独自承担全部警戒任务，可以将有限的兵力部署到更需要的海岸地段。海面仍然存在风险，但至少从今往后，守望这片海岸的不只有自己人了。"

PAU_ultimatum_resolve:0 "决心"
PAU_ultimatum_resolve_desc:0 "通牒已经送达，对方也清楚继续拖延意味着什么。所有人都明白，发出最后通牒之后，就必须有即将到来的战争的决心。"

