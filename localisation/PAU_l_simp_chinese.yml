PAU_GATHERING_STORM_DESC: "我们没有祖国，战场就是我们的故乡。契约是我们的信条，黄金是我们的旗帜。长久以来，我们作为南美大陆上最精锐的职业武装，为出价最高者献上胜利。莉兰迪亚王室曾是我们的雇主，镇压那些所谓的“赤匪”，是我们任务清单上的一行。\n直到老军团长的出现。她从那些衣衫褴褛的革命者眼中，看到了比黄金更耀眼的东西。她开始质疑，我们这支锋利的剑，是否应该永远只为腐朽的王权服务。她秘密地向我们中的一些人——包括她最器重的参谋晓枫——描绘了另一幅蓝图：一支为人民而战的、真正荣耀的军队。\n那一刻，许多人心中那早已被金钱和硝烟掩盖的火焰，被重新点燃了。我们以为，我们即将迎来新生。\n\n然后……§R老军团长……消失了。§!\n\n在随之而来的混乱与猜忌中，军团内部务实的声音压倒了一切。她们说，理想主义的狂热已经结束，我们必须回归“现实”。于是，我们将枪口，对准了昨天还与我们分享最后一根香烟的同志。在莉兰迪亚，在艾瑞波拉，我们亲手将那刚刚燃起的革命火焰，重新踩入血泊之中。\n如今，我们重归旧主麾下，但信任的链条一旦断裂，便再也无法复原。王室利用我们，也提防我们。而我们，则像一群背负着双重背叛的幽灵，在昔日战友的尸骸上执行着新的契约。鹰徽依旧闪亮，但许多人的眼神，却永远留在了那片被我们亲手制造的废墟里。我们是谁？是忠于契约的无情利刃，还是……一群迷失在理想与现实之间的……亡魂？"

