PAU_news_event_background: "£PAU_news"
PAU_news.1.t: "$news_event_background$南美统一"
PAU_news.1.d: "最初，谁也没有指望过奇迹会发生。\n这里有的只是一群为了活命到处撒谎的异乡少女、失去旗帜与饷银的雇佣兵，还有守着工厂从不退后的工人们……\n远方的舰队与逃亡的贵族曾笃定地断言，这帮满身污迹的流亡者迟早会在猜忌与饥饿中自行瓦解。\n然而，当跨越海洋的船笛与穿过平原的车鸣在山谷间交融，当那些阻断道路的铁网在雨水与新草中化作泥土，整片大地的伤口，竟真在这群一无所有的人手中慢慢愈合了。"
PAU_news.1.a: "一座不可思议的同盟在战火中诞生了。"

PAU_news.2.t: "$news_event_background$樱花军国主义的覆灭"
PAU_news.2.d: "由春日小遥率领的白夜同盟远征军，成功突入樱花本土防线，与各国人民一起攻克了樱花军部的大本营。\n那些长期操弄对外侵略、强迫青年充当武器的狂热军官已被解除武装并接受审判。随着樱花各地升起同盟旗帜，走上街头的工人和学生宣告军国统治彻底终结。\n这场跨越大海的远征不仅改写了太平洋的格局，更宣告了帝国主义狂潮在亚洲的彻底落幕。"
PAU_news.2.a: "这场疯梦，到此为止了"
