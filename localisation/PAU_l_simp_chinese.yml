 PAU_joint_institutions:0 "联合机构"
 PAU_joint_institutions_desc:0 "积分存量：§Y[?ROOT.PAU_sa_study_points|0]§!｜消耗§Y3§!点积分即可组织专项研讨会。\n联合国务委员会：§Y[?ROOT.PAU_sa_state_tier|0]§!级｜经济职能：工业§Y[?ROOT.PAU_sa_state_industry|0]§!/基建§Y[?ROOT.PAU_sa_state_infrastructure|0]§!/贸易§Y[?ROOT.PAU_sa_state_trade|0]§!｜政务职能：/民生§Y[?ROOT.PAU_sa_state_welfare|0]§!/动员§Y[?ROOT.PAU_sa_state_mobilization|0]§!\n各科目合格人数达§Y1/2/3§!人时机构自动晋升。"
 PAU_south_america_member_mission:0 "向成员派遣国务合作任务"
 PAU_south_america_member_mission_desc:0 "每隔§Y90§!天可向全体南美成员国下发跨域政务合作课题。各成员国根据自身需要选择对应发展方向并获得§Y180§!天专属增益；同盟本部则相应累积该领域的合格人数与国务积分。六类职能合格人数达到§Y1/2/3§!人时，国务委员会等级逐步提升。"
 PAU_south_america_development_program:0 "启动联合发展计划"
 PAU_south_america_development_program_desc:0 "消耗§Y3§!点国务积分正式启动区域综合发展计划，可在产业升级、民生保障与外交统战三大蓝图中择一推进。计划将为全盟带来持续§Y120§!天的深远增益，并附赠宝贵的一次性科研或政治点数回报；每次启动还会使南美联合发展度提升§Y3§!点。"
 PAU.600.t:0 "联合国务委员会例会"
 PAU.600.d:0 "桌上摊满了各地送来的申请表。\n“铁路、船厂、诊所、还有外海的商船队……哪一边都在伸手向我们要钱要人。”\n我们的家底就这么多，今天例会散场前，我们要先挑定接下来半年的重心。"
 PAU.600.g:0 "统一步调与对外口径，积极改善同周边阵营的关系。"
 PAU.600.a:0 "集中资源拓建核心工坊与重型机床流水线。"
 PAU.600.b:0 "优先铺设干线铁路、公路网与深水港区。"
 PAU.600.c:0 "削减内部关税壁垒，共同繁荣互惠市场。"
 PAU.600.e:0 "保障平价粮食配给、安置房舍与公立诊所。"
 PAU.600.f:0 "整合军训规程与民兵后备役轮训体系。"
 PAU.610.t:0 "国务合作任务"
 PAU.610.desc:0 "联合国务委员会的联络员送来了本期的协作清单。\n总部准备抽调一批熟手和技术图纸下放到地方。我们只需要根据目前手头紧缺的短板问题挑选一项任务，随船的技师和物资下周就能直接靠岸交接。"
 PAU.610.a:0 "接纳工业产线扩建改造任务。"
 PAU.610.b:0 "接纳交通干线与港口整修任务。"
 PAU.610.c:0 "接纳区域商贸与市场互通任务。"
 PAU.610.e:0 "接纳基层医疗与平价民生保障任务。"
 PAU.610.f:0 "接纳民兵训练与后备动员整训任务。"
 PAU.620.t:0 "联合发展计划"
 PAU.620.d:0 "国务积分终于积攒充足，联合发展计划迎来了正式拍板落地的时刻。政务委员会将三份详尽的草案端正摆在案头：一份致力于提升机床与造船重工产能，一份着眼于将学校、诊所与民用生活物资普及到偏远村镇，另一份则着力于建立牢不可破的国际外交统战航线。\n“资源和精力总是有限的嘛。”小遥托着腮打量着三份方案，随后抓起印章认真看着大家，“选出我们当下最该走好的那一步，然后齐心协力把它彻底办漂亮吧！”"
 PAU.620.a:0 "产业升级蓝图：扩建造船船台与机床厂，驱动重工跨越式升级。"
 PAU.620.b:0 "民生保障蓝图：平抑生活物资开销，将资源全面向诊所与学校倾斜。"
 PAU.620.c:0 "外交统战蓝图：统一国际外交步调，显著扩大白夜同盟的外交号召力。"
