PAU_army_reform_medics_tt: "消耗 15 点陆军改革点，降低 attrition。"
PAU_army_reform_armor: "恢复装甲教导连"
PAU_army_reform_armor_desc: "把还能发动的旧坦克集中起来，让巴罗那样的老车长重新带徒弟。不是为了好看，是为了下次冲锋时后面的人能跟上。"
PAU_army_reform_armor_tt: "消耗 25 点陆军改革点，获得攻击和突破修正。"
PAU_economy_reform: "经济改革"
PAU_economy_reform_granary: "清点粮仓与配给账"
PAU_economy_reform_granary_desc: "先查粮袋，再发面包。少报一袋的人要补上，多领一袋的人也要说清楚。"
PAU_economy_reform_granary_tt: "消耗15点经济改革点，降低民用消费压力。"
PAU_economy_reform_workshop: "恢复工坊工序"
PAU_economy_reform_workshop_desc: "把铁匠、木匠、修车工和缝纫工重新排进同一张工单，缺什么零件就先去拆什么旧机器。"
PAU_economy_reform_workshop_tt: "消耗15点经济改革点，提高民用和军工厂生产效率。"
PAU_economy_reform_currency: "统一旧钞与新币"
PAU_economy_reform_currency_desc: "旧钞还能用，新币也要有人认。兑换期限、牌价和结账方式先写在码头和食堂门口。"
PAU_economy_reform_currency_tt: "消耗25点经济改革点，降低消费压力并恢复工厂产能。"
PAU_economy_reform_trade: "恢复港口航线"
PAU_economy_reform_trade_desc: "把燃料规格、船期和仓库泊位重新对齐。油能让船跑多远，得先写清楚，再谈价格。"
PAU_economy_reform_trade_tt: "消耗25点经济改革点，提高燃料和船坞产出。"
