PAU_joint_institutions_desc:0 "联合参谋学院：[?ROOT.PAU_sa_college_tier|0] 级　积分：[?ROOT.PAU_sa_study_points|0]　课程：装甲[?ROOT.PAU_sa_college_armor|0]/步兵[?ROOT.PAU_sa_college_infantry|0]/联合作战[?ROOT.PAU_sa_college_operations|0]\n联合国务委员会：[?ROOT.PAU_sa_state_tier|0] 级　积分：[?ROOT.PAU_sa_state_points|0]　经济：工业[?ROOT.PAU_sa_state_industry|0]/基建[?ROOT.PAU_sa_state_infrastructure|0]/贸易[?ROOT.PAU_sa_state_trade|0]　政治：外交[?ROOT.PAU_sa_state_diplomacy|0]/民生[?ROOT.PAU_sa_state_welfare|0]/动员[?ROOT.PAU_sa_state_mobilization|0]\n课程人数达到 1/2/3 时机构升级；消耗 3 点积分可召开研讨会或启动发展计划。"
PAU_south_america_state_council:0 "举行联合国务委员会例会"
PAU_south_america_state_council_desc:0 "每 90 天召开一次国务委员会例会，由白夜同盟选择本期重点方向：工业、基建、贸易、外交、民生或动员。白夜同盟与所有南美成员获得 180 天对应方向的加成，并推进国务委员会课程进度。"
PAU_south_america_state_council_effect_tt:0 "召开国务委员会例会，选择重点方向；白夜同盟与南美成员获得 180 天对应加成，并累计课程人数与国务积分。"
PAU_south_america_member_mission:0 "向成员派遣国务合作任务"
PAU_south_america_member_mission_desc:0 "每 90 天向所有南美成员派遣国务合作任务。每个成员会选择工业、基建、贸易、外交、民生或动员方向，获得 180 天对应加成；白夜同盟获得该方向课程人数与国务积分。六类课程人数达到 1/2/3 时，国务委员会升级。"
PAU_south_america_member_mission_effect_tt:0 "向所有南美成员派遣国务合作任务，由成员自选方向并获得 180 天加成；白夜同盟获得课程人数与国务积分。"
PAU_south_america_development_program:0 "启动联合发展计划"
PAU_south_america_development_program_desc:0 "消耗 3 点国务积分启动联合发展计划，在产业升级、民生保障与外交统一战线三个方案中选择一个。计划会为白夜同盟与所有南美成员带来 120 天对应领域的经济与政治加成，并附带一次性的科研或政治点收益。"
PAU_south_america_development_program_effect_tt:0 "消耗 3 点国务积分，选择产业升级、民生保障或外交统一战线；白夜同盟与所有南美成员获得 120 天对应加成，白夜同盟额外获得一次性科研或政治点收益。"
