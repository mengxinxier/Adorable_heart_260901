####避风港发展度与辐射####
PAU_harbor_dev_tt:0 "£GFX_PAM_am 避风港发展度：$RIGHT|=+0$"
PAU_harbor_spillover_1:0 "避风港辐射·初创"
PAU_harbor_spillover_1_desc:0 "第一批仓库和船台让周边州开始分担港口的运输压力。"
PAU_harbor_spillover_2:0 "避风港辐射·沿港通途"
PAU_harbor_spillover_2_desc:0 "建材和工队沿着旧商路往内陆走，沿港城镇开始腾出新的街区。"
PAU_harbor_spillover_3:0 "避风港辐射·工坊成带"
PAU_harbor_spillover_3_desc:0 "港口订单一多，周围作坊和新工厂就被拉进同一条供应链。"
PAU_harbor_spillover_4:0 "避风港辐射·腹地新城"
PAU_harbor_spillover_4_desc:0 "避风港的灯火不再只照亮码头，内陆城镇也开始靠这条线吃饭。"
PAU_safe_harbor_expand:0 "扩建避风港"
PAU_safe_harbor_expand_desc:0 "把码头、仓库和通往内地的第一条路一起修出去。港口越成规模，周围州越能跟着接到订单。"
PAU_safe_harbor_expand_tt:0 "消耗 25 政治点，为避风港州增加 1 个共享建筑位，并提升 1 点避风港发展度（上限 6）。发展度每到一个阶段，受控的非避风港州就会获得建设与产能加成。"

####自动机制与营房修正####
PAU_camp_grain_reserve:0 "粮仓储备"
PAU_camp_grain_reserve_desc:0 "扣下的粮食让营地和前线都能多撑一阵。"
PAU_camp_xiaoyao_lifeline:0 "小遥的补给线"
PAU_camp_xiaoyao_lifeline_desc:0 "小遥船队送来的燃料和零件让军团的车间重新转了起来。"
PAU_camp_ration_discipline:0 "配给纪律"
PAU_camp_ration_discipline_desc:0 "每个人的口粮都按本子发放，饿肚子的人少了，队伍也稳了。"
PAU_safe_harbor_auto:0 "自动扩建避风港"
PAU_safe_harbor_auto_desc:0 "点击后开始「避风港扩建循环任务」：每 30 天自动花费政治点扩建一处避风港。任务激活期间，其它避风港决议会隐藏；使用专门的取消决议即可停止自动。"
PAU_safe_harbor_auto_on_tt:0 "自动扩建任务已开始：每月自动花费 25 政治点扩建一处避风港。取消任务即可恢复手动决议。"
PAU_safe_harbor_auto_off_tt:0 "已取消自动扩建任务。手动避风港决议重新显示。"
PAU_baiye_auto:0 "自动放白夜出去溜达"
PAU_baiye_auto_desc:0 "点击后开始「白夜溜达循环任务」：每 30 天自动让白夜巡游一处受控州。任务激活期间，手动白夜决议会隐藏；使用专门的取消决议即可停止自动。 "
PAU_baiye_auto_on_tt:0 "自动溜达任务已开始：立即让白夜巡游一处受控州；之后每月自动花费 5 政治点巡游一处受控州。取消任务即可恢复手动决议。"
PAU_baiye_auto_off_tt:0 "已取消自动溜达任务。手动白夜决议重新显示。"

PAU_royal_arrears_written_off_tt:0 "王都已经被亡灵大军冲垮，王室欠条成了没人会兑的废纸。军团干脆把这笔账一笔勾销。"
PAU_auto_construction:0 "自动建设"
PAU_auto_infrastructure:0 "自动基础设施规划"
PAU_auto_infrastructure_desc:0 "点击后开始「基础设施规划循环任务」：每 30 天自动为合适的受控州排入 1 级基础设施。任务激活期间，手动基础设施决议会隐藏；使用专门的取消决议即可停止自动。"
PAU_auto_infrastructure_on_tt:0 "自动基础设施任务已开始：立即执行一次与手动决议相同的基建排队；之后每 30 天自动执行一次。取消任务即可恢复手动决议。"
PAU_baiye_auto_task_tt:0 "每 30 天：政治点≥5 且有未巡游的受控州时，扣除 5 政治点并让白夜巡游一处州；条件不足时任务继续等待，直到取消自动。"
PAU_safe_harbor_auto_task_tt:0 "每 30 天：政治点≥25、避风港发展度<6 且有避风港州时，扣除 25 政治点扩建一处；条件不足时任务继续等待，直到取消自动。"
PAU_auto_infrastructure_task_tt:0 "每 30 天：政治点≥10 且存在有空余建筑槽的州时，扣除 10 政治点修建 1 级基础设施；条件不足时任务继续等待，直到取消自动。"
PAU_auto_infrastructure_off_tt:0 "已取消自动基础设施任务。手动基础设施决议重新显示。"
PAU_auto_infrastructure_unlock_tt:0 "解锁“自动建设”决议分类。国家进入和平重建后，会自动为最优地块排队基础设施。"

