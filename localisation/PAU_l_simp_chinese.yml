####人物####
PAU_Nymph: "阿夏"
PAU_Nymph_desc: "§L十几岁刚进兵营的时候，阿夏加入的军团是整片大陆名气很大的雇佣军。在巴罗这些老兵的带领下，她学会了怎么用枪，怎么开坦克、甚至是重新领导一群新兵打赢胜仗。那时的军团按合同拿钱办事，靠着强硬的作战本事在各地受雇打仗。\n1934年，王室强令军队去工区镇压罢工，彻底撕裂了军团。\n老军团长离世后，晓枫带着一部分人退入深山，阿夏则留下来接管了剩下的队伍。她理解晓枫的选择，但……谁又来理解她呢？§!"

PAU_xiaoyao: "春日小遥"
PAU_xiaoyao_desc: "§L在樱花群岛的海港镇上长大，小遥从小就在造船厂、火车站和码头摊位之间到处奔跑。 她整天混在工人堆里，把码头的门道摸得一清二楚。\n故乡的局势越来越乱，小遥带着同伴们从神社救出的白夜，横跨大海一路开到了南美。这支孤独的船队避开沿途的巡逻，最终停靠在莉兰迪亚的港湾里。§!"

PAU_bl: "巴罗"
PAU_bl_desc: "§L军团资历最老的一批战车长之一。阿夏当年刚进军营时，就是跟着他学会了怎么开坦克与拆装机枪。脸上留着早年引擎回火燎出的伤疤，虽然嘴上整天抱怨军饷被克扣、履带老得修不动，但只要吹响集合哨，他的坦克永远是第一个打着火开出车库的。§!"

PAU_baiye: "白夜"
PAU_baiye_desc: "§L一团很难分清到底是猫、是狗、是狐狸、还是单纯一颗长了耳朵的雪白大毛球。四条短腿短得几乎被圆滚滚的肚子完全遮住，平时除了趴在小遥的衣领里打呼噜装死，唯一的特长就是在饭盒开盖的一瞬间以惊人的速度探出脑袋。据说有着特别尊贵的来头，但目前来看，除了吃得越来越胖以外完全没看出来。§!"
PAU_aws: "埃文斯"
PAU_aws_desc:0 "§L原圣杯王国远洋分舰队的指挥官。嘴上总把“皇家海军的体面与条例”挂在嘴边，实际上比谁都清楚伦敦的议员老爷早就靠不住了。如今一边在参事会里帮着调度港口航线，一边还得防着自己攒下的那点私房红茶被同僚顺走。§!"
PAU_am: "艾玛"
PAU_am_desc:0 "§L莉兰迪亚后勤缝纫厂的年轻女工。姐姐在早年的矿难中去世后，她和母亲、弟弟在底层街区相依为命。亡灵围城期间曾被死气幻觉引诱至矿坑边缘，所幸被巡逻队与姐姐残存的执念救回。如今脚踝上的淤痕已经消退，平时在市政厅与工坊之间帮忙跑腿记账，是街坊邻里公认最热心肠的姑娘。§!"
####特质####
baiye_soul: "山灵加护"
baiye_soul_desc:0 "§L这支部队受到白夜的奇妙庇护。哪怕身处补给断绝、死气弥漫的绝境，那个白毛小家伙留下的气息也能让战士与口粮免受阴冷环境侵蚀，并在瞬息万变的战场上凭着野兽的本能趋吉避凶。§!"

PAU_baiye_trait: "白夜"
PAU_baiye_trait_desc: "§L显然，让一只小动物来指挥一个军队是一件很好笑的事情§!"
####决议###
PAU_LHS_weiji:0 "军团的危机"
PAU_LHS_weiji_dec: "这是留给我们的最后期限"
PAU_LHS_weiji_dec_desc: "我们不能再等下去了，王室给不了我们时间，晓枫给不了我们时间，我们不能停下，我们不能停下来继续等死。"
PAU_LHS_weiji_dec2_desc: "我们的装甲援军正碾过泥泞向前线开进。三十天后，下一批装甲师将抵达我们的前线。"
PAU_LHS_weiji_dec3_desc: "第二批装甲援军已经在路上。三十天后，两个满编的装甲师将完成集结。"
PAU_LHS_weiji_dec2: "§R装甲援军在路上§!"
PAU_LHS_weiji_dec3: "§R装甲援军在路上§!"
#PAU_LHS_weiji_mission_tt:0 "激活限时任务【装甲援军在路上】：30 天后王室装甲师将抵达前线，随后还有第二批援军。倒计时结束前请稳住战线或完成相关国策。"

 PAU_xiufu:0 "重新打通 [FROM.GetName] 的通道"
 PAU_xiufu_desc:0 "晓枫带队炸塌了整段山道，为了把运粮线夺回来，我们要尽快把堵死的路刨开。"

 PAU_xiaoyao_plan:0 "放白夜去 §Y[FROM.GetName]§!"
 PAU_xiaoyao_plan_desc:0 "那个小家伙天天睡觉，都快睡成猪了。既然附近到处都是亡灵散发的怪味，不如放它出去散散步。它身上带着山里的灵气到处跑，顺带还能把那些怪东西吓跑呢。"

 xiaoyao_plan_flag:0 "白夜正在四处遛弯中"
 PAU_xiaoyao_state_flag:0 "白夜曾在这里逗留过"

 PAU_wl_attack_dec:0 "亡灵在蚕食着我们"
 PAU_wl_attack_dec_desc:0 "亡灵正顺着边境慢慢往前挤。每隔§Y7§!天，挨着亡灵控制区的莉兰迪亚、野火、王国或者公社地盘就会被死气吞掉一块。要是不能尽快把仗打完，整条边境早晚都得变成死人堆。"

 PAU_wl_anti:0 "亡灵的反扑"
 PAU_wl_anti_desc:0 "阴影里的怪物又在蠢蠢欲动，想把白夜走过的地方重新弄脏。要是我们不赶紧派人去清扫干净，大家刚过上的安稳日子就又要泡汤了。"

 PAU_hetong:0 "无国界之军"
 PAU_hetong_desc:0 "军团以前就是靠受雇打仗活下来的。现在虽然不用再像过去那样四处流浪，但手里的物资还是经常不够用。偶尔接下其他国家的作战委托，既能帮我们换回急需的补给，也能让老兵们有事可做。至于对方肯出多少报酬，就要看我们之前在战场上的表现了。"

 PAU_guyong:0 "向 §Y[FROM.GetName]§! 提议出兵"
 PAU_guyong_desc:0 "派人去和他们谈谈，看对方愿不愿意拿物资来雇我们帮忙。只要他们答应提供足够的补给，并在沿海借出一块地方让我们停船和存放物资，我们随时可以动身。"
 pau_guyong_xiuxi:0 "正在休整"

 PAU_guyonged_flag:0 "正在商谈条件"
 PAU_bop_loan_active:0 "正在执行合同"

 PAU_guyong_zhunbei:0 "出发去 §Y[FROM.GetName]§! 的准备"
 PAU_guyong_zhunbei_desc:0 "条件已经谈妥了。在接下来的§Y30§!天里，我们需要把带过去的装备和人员安排妥当。等一切准备就绪，队伍就会坐船前往对方借给我们的港口。"

 PAU_guyong_attack:0 "替雇主作战"
 PAU_guyong_attack_desc:0 "我们的队伍已经到了前线。按照约定，这次最多替他们作战§Y365§!天。只要能顺利帮他们打赢，或者坚持到约定的时间结束，这笔交易就算完成了。"

 PAU_guyong_touxiang:0 "提前跑路"
 PAU_guyong_touxiang_desc:0 "前线的局势已经没法挽回了，没有必要为了别人的战争把我们自己全部赔进去。现在主动结束合同，至少还能带着伤员和剩下的装备平安撤回来。虽然这样做会影响我们的信誉，但也顾不上那么多了。"

 PAU_guyong_ewai:0 "加入雇主的战争"
 PAU_guyong_ewai_desc:0 "我们该把部队派上前线了。"

 PAU_guyong_dianshu_tt:0 "£GFX_PAM_am 雇佣军信誉：$RIGHT|+=0$"

 is_lldy_state_flag:0 "属于§Y莉兰迪亚地区§!"

 PAU_joint_council:0 "勉强维持的平衡"
 PAU_joint_council_desc:0 "小遥强行压下了两边的争执，把所有安排重新拉回了最初的平衡。表面上看，会议室里的争吵确实停了下来，但工会和老兵心里都有些不满。现在遇到需要配合的工作，就连一张简单的申请单也要在两边推来推去。虽然没有再闹出什么乱子，但做事的效率已经大不如前了。"

 #### 雇佣事件 ####
 PAU.172.t:0 "来自南美的雇佣兵"
 PAU.172.d: "一封来自莉兰迪亚的信送到了前线指挥部。信上的内容很简单：他们愿意派出一支有经验的部队替我们作战，只要我们按时提供足够的补给和燃油，并在沿海借出一座港口供他们停船和休整。\n送信的联络官还等在门外，希望能尽快得到我们的答复。"
 PAU.172.a:0 "签下合同，让他们过来帮忙。"
 PAU.172.b:0 "这是我们自己的事，不需要外人插手。"

 PAU.173.t:0 "合同签成了"
 PAU.173.d: "联络官带回了正式答复。对方同意借出沿海的港口，也答应按时供应我们在前线所需的补给。\n确认完合同上的印章和条款后，我们已经通知各连队开始收拾装备，准备登船出发了。"
 PAU.173.a:0 "通知船队准备出港吧。"

 PAU.174.t:0 "对方拒绝了合同"
 PAU.174.d: "对方婉拒了我们的提议，说他们自己的部队还能守住，暂时不需要外人帮忙。\n这样也好，至少这回大家不用远渡重洋，去别人的战场上冒险了。"
 PAU.174.a:0 "那就算了，留下来照常训练吧。"

 PAU.175.t:0 "未能完成的合同"
 PAU.175.d: "前线传来了坏消息：雇主的阵线全面崩溃，敌人的部队已经打进了他们的首都。\n这场仗已经打不下去了。不仅事先谈好的报酬拿不到手，这次失利恐怕也会让外界对我们的实力产生怀疑。"
 PAU.175.a:0 "先把我们的人带回来再说。"

 PAU.176.t:0 "打赢了"
 PAU.176.d: "仗终于打完了。雇主守住了他们的领土，事先答应给我们的物资也已经全部装上了货船。\n发津贴的时候，营地里难得听不见抱怨声。能够换回一整船急需的物资，再平平安安地坐船回家，所有人都松了一口气。"
 PAU.176.a:0 "清点好物资，我们坐船回家。"

 PAU.177.t:0 "合同到期了"
 PAU.177.d: "约定的期限已经到了，雇主却还在和敌人没完没了地消耗着。再继续留在这里，只会把我们自己的部队也拖垮。\n既然我们已经按约守满了期限，就没有理由继续替他们耗下去了。是时候收拾装备撤回港口了。"
 PAU.177.a:0 "合同到此为止，准备撤离吧。"

 PAU.178.t:0 "对面的雇佣军撤走了"
 PAU.178.d: "一直和我们对峙的那支外国雇佣军突然停火了。他们带着伤员和武器撤出了阵地，不再替对面的政府作战。前线的参谋报告说，他们撤走之后，对面的阵线立刻露出了一大片破绽。"
 PAU.178.a:0 "趁现在往前推进，接管他们的阵地。"

 PAU.179.t:0 "枪口转向了雇主"
 PAU.179.d: "事情彻底闹僵了。雇主开始怀疑我们留在当地的意图，甚至调动部队封锁了我们的营区。既然对方已经翻脸，我们也不可能继续替他们作战了。\n他们既然先动了手，那我们也只能用武器来回答了。"
 PAU.179.a:0 "我们战场相见。"

####民族精神###
PAU_mainline:0 "我们的未来"
PAU_mainline_desc:0 "主线历程中大家一步步积累起来的综合成果。\n这些增益会随着国策抉择、关键剧情事件与改革决议的达成而逐步追加。"
PAU_borderless_army:0 "无国界之军"
PAU_borderless_army_desc:0 "我们没有祖国，战场就是我们的故乡。契约是我们的信条，黄金是我们的旗帜。长久以来，我们作为南美大陆上最精锐的职业武装，为出价最高者献上胜利。莉兰迪亚王室曾是我们的雇主，镇压那些所谓的“赤匪”，是我们任务清单上的一行。\n直到老军团长的出现。她从那些衣衫褴褛的革命者眼中，看到了比黄金更耀眼的东西。她开始质疑，我们这支锋利的剑，是否应该永远只为腐朽的王权服务。她秘密地向我们中的一些人——包括她最器重的参谋晓枫——描绘了另一幅蓝图：一支为人民而战的、真正荣耀的军队。\n那一刻，许多人心中那早已被金钱和硝烟掩盖的火焰，被重新点燃了。我们以为，我们即将迎来新生。\n\n然后……§R老军团长……消失了。§!\n\n在随之而来的混乱与猜忌中，军团内部务实的声音压倒了一切。她们说，理想主义的狂热已经结束，我们必须回归“现实”。于是，我们将枪口，对准了昨天还与我们分享最后一根香烟的同志。在莉兰迪亚，在艾瑞波拉，我们亲手将那刚刚燃起的革命火焰，重新踩入血泊之中。\n如今，我们重归旧主麾下，但信任的链条一旦断裂，便再也无法复原。王室利用我们，也提防我们。而我们，则像一群背负着双重背叛的幽灵，在昔日战友的尸骸上执行着新的契约。鹰徽依旧闪亮，但许多人的眼神，却永远留在了那片被我们亲手制造的废墟里。我们是谁？是忠于契约的无情利刃，还是……一群迷失在理想与现实之间的……亡魂？"

PAU_borderless_army_tt:0 "£manpower_texticon 每周人力: §G+750§!\n£manpower_texticon 每周人力: §R-750§!"
PAU_borderless_army1:0 "无国界之军"
PAU_borderless_army1_desc:0 "我们没有祖国，战场就是我们的故乡。契约是我们的信条，黄金是我们的旗帜。长久以来，我们作为南美大陆上最精锐的职业武装，为出价最高者献上胜利。莉兰迪亚王室曾是我们的雇主，镇压那些所谓的“赤匪”，是我们任务清单上的一行。\n直到老军团长的出现。她从那些衣衫褴褛的革命者眼中，看到了比黄金更耀眼的东西。她开始质疑，我们这支锋利的剑，是否应该永远只为腐朽的王权服务。她秘密地向我们中的一些人——包括她最器重的参谋晓枫——描绘了另一幅蓝图：一支为人民而战的、真正荣耀的军队。\n那一刻，许多人心中那早已被金钱和硝烟掩盖的火焰，被重新点燃了。我们以为，我们即将迎来新生。\n\n然后……§R老军团长……消失了。§!\n\n在随之而来的混乱与猜忌中，军团内部务实的声音压倒了一切。她们说，理想主义的狂热已经结束，我们必须回归“现实”。于是，我们将枪口，对准了昨天还与我们分享最后一根香烟的同志。在莉兰迪亚，在艾瑞波拉，我们亲手将那刚刚燃起的革命火焰，重新踩入血泊之中。\n如今，我们重归旧主麾下，但信任的链条一旦断裂，便再也无法复原。王室利用我们，也提防我们。而我们，则像一群背负着双重背叛的幽灵，在昔日战友的尸骸上执行着新的契约。鹰徽依旧闪亮，但许多人的眼神，却永远留在了那片被我们亲手制造的废墟里。我们是谁？是忠于契约的无情利刃，还是……一群迷失在理想与现实之间的……亡魂？"

