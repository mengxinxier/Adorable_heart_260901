#政治线国策v 




PAU_tx: "退信"
PAU_tx_desc: "王室送来的公文写得很清楚，给钱的日期又往后拖了。大家空着肚子，脾气都很差。可要是现在掀桌子走人，连这个营地都保不住。只能先把催钱的信塞进抽屉，交代后厨在锅里多添几瓢水，先把今天的午饭应付过去。"

PAU.1.t: "栏杆升起时"
PAU.1.d: "“王室送来的又是欠条。”\n副官把午饭递给我。碗里清得见底，只有几片煮烂的菜叶。\n“他们让大家多体谅一下，再等两周。”副官说。\n“体谅又不能当饭吃。”\n我喝了一口，满嘴都是寡淡的盐水味。\n远处的山谷里，晓枫那些人的营地隐隐约约能看到一点影子。当初分道扬镳的时候，她跟我吵了一架，说我们迟早会被王室当成弃子扔掉。现在看来，都被她说中了。\n正当发愁下个月该怎么过时，门岗那边突然响了一声铃。\n“长官，有人过来了。”\n我放下碗，朝营区大门走了过去。\n站在栏杆外面的不是信使，也不是游击队的探子。\n那是个白头发的少女，背着旅行包，肩膀上趴着一只雪白的小兽，她正好奇地到处看着。周围好几支枪口都对着她，她却完全不在意，高高兴兴地冲我挥着手。\n“打扰啦！”\n她快步走到栏杆前，双手搭在了上面，笑得特别灿烂。\n“顺着路走了好久，肚子早就叫个不停了……请问这里有食堂吗？能分我点东西吃吗？我有带钱的。”\n哨卡里瞬间安静下来。\n站岗的士兵全卡在原地，面面相觑。\n在这片除了硝烟就是欠条的营地里，居然真有人把军营当成了路边的饭馆。"
PAU.1.a: "“……把枪放低，让她进来吧。”"

PAU.2.t: "勺子"
PAU.2.d: "勺子在铁碗里刮过了最后一圈，发出清脆的响声。\n少女把碗里的菜叶吃得干干净净，抽出手帕擦了擦嘴角。肩头趴着的那只小白兽换了个舒服的姿势，也眯着眼睛打起了瞌睡。\n“多谢招待，虽然喝起来只有盐水的味道，不过喝完全身都暖和了呢。”\n她抬起头看着我，脸上的笑意没有褪去，眼神却变得平稳而锐利。\n“王室答应给你们的下批口粮，上周就已经在海港被扣下了。”\n我按在桌上的手停住了。\n“运粮船根本没有装货，上面堆满的是给内廷贵族过冬用的香料和葡萄酒。大臣们给你们寄欠条，只是为了把你们钉在这条防线上，替后方的王都挡住山里的游击队。”\n少女双手交叠托着下巴，语气轻松得像是在讨论明天该吃什么：\n“山谷那边的晓枫正在修整装备，等你们的库存彻底见底。只要你们饿得拿不动武器，他们就会顺着公路直接推过来。”\n食堂里还回荡着士兵们排队盛饭的喧闹声，我面前的空气却仿佛瞬间盖了一层雾一般。\n“你到底是谁派来的？”我问。\n“谁也没有派我来。”少女眨了眨眼睛，“我只是从东边的岛屿一路走过来，想亲眼看看当年名震南美的无国界之军，现在到底落魄成了什么样子。”\n她指了指窗外那些正在埋头喝汤的年轻士兵。\n“老军团长不在了，晓枫也带着人走了。留在营地里的这些人，既没有可以效忠的祖国，也拿不到卖命的赏钱，只能每天守着空枪饿肚子，不是吗？”\n少女收起手帕，直视着我的眼睛：\n“阿夏长官，你打算带着大家在这里坐着等死，还是换个真正有出路的活法？”"
PAU.2.a: "“……说说你的条件吧。”"

PAU.3.t: "第三个选项"
PAU.3.d: "“换个雇主？”我把空碗推到了一旁，“去给你们东边的天皇卖命，还是给海上的殖民者当看门狗？”\n“都不对。”\n少女摇了摇头，从衣服内兜里抽出一张折好的路线图，平摊在了桌面上。\n“给别人当雇佣兵，迟早会被当成耗材扔掉。晓枫是对的，你们的老军团长也是对的，只有傻子才会把枪口借给别人使唤。”\n她把手指点在沿海公路的一处交汇点上，那是王室用来储存出口货物的转运仓库。\n“王室既然不给钱，为什么还要守着这道防线？后方仓库里堆着几个月都吃不完的麦粉和罐头，还有准备运往海对面的燃油。”\n少女抬起眼眸，那只小白兽跳到了桌面上，蹲在地图边缘舔着爪子。\n“动了王室的仓库，那就是叛乱。”我说。\n“是他们先违约的。”少女语气平稳，甚至带着理所当然的笃定，“合同上写得明明白白，拿钱办事。既然他们不给饭吃，你们当然有权利自己去厨房拿。”\n窗外，巡逻队的脚步声从走廊经过，换岗的哨兵正在交接佩枪。\n“拿到那批物资之后呢？”我问，“就算能撑过这几个月，王都的大炮和山里的游击队迟早会把我们夹在中间。”\n“那就去港口。”少女在地图最东边的港口画了一个圆圈，“我在海上有接应的船队。只要控制了码头，打通去往东方的航线，这里就既不是王室的猎场，也不是游击队的包围圈了。”\n她收起手指，直直看着我：\n“你们会变成一支自己说了算的军队。有饭吃，有油用，甚至能把武器换成机械零件。”\n我低头看着桌上那张路线图。走廊里的换岗铃声又响了一次，清脆的声音在营房里传了开来。\n留在这里是饿死，退回王都是等死。\n“……路线图借我用用。”我站起身，把帽子往下按了按，“等天黑了，我去把几个分队长叫过来开会。”"
PAU.3.a: "“不过，如果这是陷阱的话，\n我的子弹会第一个找上你的。”"

PAU_qxjd: "强行借道"
PAU_qxjd_desc: "卡卡罗姆矿区是通往东部公路的必经之路。晓枫绝不会把根据地的咽喉让出来，我们也必须抢下那条运粮线。既然双方都站在无法后退的位置上，那就只能靠大炮去决定谁能活下去了。"

PAU.4.t: "两千码开外"
PAU.4.d: "“距离两千两百码。”\n副官把测距板递给了我。\n“要现在开炮吗，阿夏长官？”\n我拉低了帽檐，看着前方山头亮起的警戒灯火。\n晓枫在那座山梁上布设了重重火力点。她只清楚我们要去抢夺物资，无论这些物资是来自于谁的，我也清楚她绝不可能把这条命脉让出来。\n两边都把局势看得透透的，这根本谈不上什么误会。\n我们都在为了自己身后那些人的命，把枪口对准曾经最熟悉的人。\n“真要去打啊？”\n遥靠在车厢挡板旁，随手翻弄着手里的路线图。\n“对方是你的同僚吧。”\n“当年的同僚。”我纠正她，“她带着人退进山里去实现理想，我留下来替剩下的几张嘴找饭吃。从分道扬镳的那天起，我们脚下的路就撞在一起了。”\n遥抬起头，那双红色的眼睛在夜色里很亮：\n“那就别犹豫。在战场上犹豫，死的就是相信你的人。”\n山梁上突然闪过一道火光。一串机枪点射又快又准，直接击碎了指挥卡车左侧的车灯。\n这是晓枫在用子弹画死线。越过车灯这道坎，就是全火力的覆盖区。她从不手软，我也一样。\n我抬手向后方打出手势。\n“炮兵一连，二连，对准前方阵地。”\n“压上去。把路清出来。”"
PAU.4.a: "“开火。”"

PAU_sdft: "撕掉封条"
PAU_sdft_desc: "车库里那些履带车停了快一年了，车门上还贴着大臣们的白纸封条。以前不动它们，是因为油料不够，也是因为大家都在维持表面的安分。现在卡车在山道上挨了机枪扫射，想活命就不能再装老实人。把封条撕了，把最后的柴油灌进油箱。就算顶着王室的标记，今天也得把这条路碾平。"

PAU.5.t: "合上顶盖时"
PAU.5.d: "启动机连着咳嗽了好几声，排气管终于突突地吐出黑烟。\n开库房的锁链哗啦啦响成一片，几辆轻型坦克慢腾腾地挪到空地上，履带把路面碾得咯吱作响。车身两侧的金鹰标记还亮堂得很，连泥巴都没盖住几寸。\n副官踩在踏板上，手里拎着刷子说道：\n“长官，这鹰标……要不要先弄点黑漆盖掉啊？前边就是晓枫的阻击线，要是被她看见……”\n“刮它干嘛，费那功夫。”\n我扯了扯被风吹歪的领子，语气里满是疲惫：\n“发动机一响，晓枫就知道是谁来了。当年在军营里，连这底盘的散热孔该开多大都是她亲笔画的图纸。就算你把车身刷成粉红色，她也认得出这动静。”\n副官叹了口气，把漆桶放在了脚边。\n山梁上的信号火光依旧明亮，透过望远镜看过去，那面红旗就插在隘口正当中。\n晓枫这时候肯定在观测所里盯着山道看呢。\n在她眼里，事实明摆着——当年在工区街道上碾平街垒的是这批车，现在开进卡卡罗姆、准备轰开她家大门的，也是这批车。\n这叫哪门子的误会啊。我们分明就是揣着明白装糊涂，硬要把枪口往昔日同僚的胸口上顶。\n“真残忍呢，阿夏。”\n遥两手插在风衣口袋里靠在车棚的柱子旁，语气里带着点事不关己的调侃：\n“从山顶往下看，你们简直就像是王室最忠诚的一条看门犬呢。”\n“少废话。”\n我踩着履带翻上车顶，弯腰钻进狭窄的舱口。\n沉重的金属顶盖在头顶砰的一声合拢，把外面的日光、风声和草木气味全都关在了外面。车厢里闷得让人喘不过气，只剩下柴油机深沉的震动。\n从观察缝里望出去，狭窄的山道正被两道履带印慢慢压平。\n我扶正了军帽，拉过通话器的管子，低声交代了一句：\n“各车注意间距。别熄火。”\n“……跟紧我。”"
PAU.5.a: "现在，门彻底关上了。"

PAU_sdjt: "山道尽头"
PAU_sdjt_desc: "矿区入口的枪声终于停了。道路被重新清理了除了，散落的弹药箱也被搬上了卡车。晓枫被扣在原本属于矿管的地下办公室里，几个负责看守的卫兵正等着命令。是把她交给王室换取口粮，还是带着这个危险的人质一起去海港，必须现在做个决定。"

PAU.6.t: "请松绑吧"
PAU.6.d: "晓枫坐在靠墙的椅子上，双手被绳子捆在了椅背后面。她的额头上的擦伤结了血痂，衣服是也沾满了炮灰，但她坐得很端正，冷冷地看着我走了进来。\n“王室给你的悬赏很高。”我拉过一张折叠凳在她对面坐下，“用你的人头，能换几万金币，足够给后面整支车队加满去海港的柴油。”\n晓枫嘴角扬了一扬，连求饶的意思都没有：\n“那就拿去换。当年在艾瑞波拉我就该死在山道上了，多活的这几年，就当是我赚来的。”\n房门吱呀一声被推开了。\n遥迈步走了进来，肩上的小白兽探头探脑。她径直走到晓枫身后，从袖口滑出一柄小刀，手腕一转，绑在椅背上的绳子应声散落。\n两名卫兵下意识抬起枪口：\n“长官？！”\n“遥，你干什么！？”我立马按住腰间的枪柄站了起来。\n少女转过身，平日里那种散漫随性的笑容完全收敛了，脸上透着一种公事公办的冷静。\n她伸手解开风衣内衬的扣子，取出一份盖着朱红印章的通关文件，随手扔在了桌上。\n那是来自极东之地——樱花的正式公函。\n“王室的金币你们拿不到了，阿夏长官。”这次遥的声音里没有任何开玩笑的语调，“王都早就被南下的亡灵冲垮了，王都的大臣们们正忙着逃命呢。”\n整个地下室里只剩下发电机单调的杂音。\n“我从樱花乘船出发的时候，会议拟定的名单上只有两个人。”遥抬起视线，在我和晓枫脸上扫过，“一个是军团最后的带队人，一个是懂全盘战术的参谋长。”\n她收回小刀，看向刚刚活动着发麻的手腕的晓枫：\n“卡卡罗姆是王室预定的清洗区。如果阿夏不带车队打穿山道，几天后赶到这里的，就是索拉娜的先头死灵部队。你们一个都活不下来。”\n晓枫揉着手腕上的红痕，抬头看向遥和我：\n“原来你们是这么个‘借道’法啊。”\n我盯着桌上那份印着樱花徽记的文件，整个人都变得恍惚了起来。\n原以为自己是抓住了求生机会的强盗，到头来，连同这场残酷的强攻在内，全都在这位樱花少女的表上走得丝毫不差。"
 PAU.6.a: "“……带上她，全队往港口全速前进。”"

 PAU_ddjr: "多带几个人"
 PAU_ddjr_desc: "矿道里还缩着几百号耗尽子弹的工人和伤员。晓枫不肯一个人上车，卡车上的篷布底下也还能再挤一挤。柴油不多，但卸掉后排几箱沉重的穿甲弹，就能多腾出几个车斗拉上活人。至于北边公社的雪伊……只能在电台里给她留个通报，能不能从死灵嘴里杀出一条路，全凭她自己的本事了。"

 PAU.7.t: "车厢挤一挤"
 PAU.7.d: "晓枫刚活动好被解开的手腕，正准备朝外走时，走到门边突然回头盯向了我：\n“坑道里还有几百多个伤员和筑垒工人，你要把他们全丢在这里等死？”\n我拉低了帽檐：“车队装不下这么多人。柴油只够一口气跑到海港，多拉那么多人，大家全得停在路上当靶子。”\n旁边的遥理了理被风吹乱的衣领，笑眯眯地插话进来：\n“樱花的船很大，底舱缺不少懂得维修机床和装配引擎的熟手。只要手里拿得动扳手，到了那边，我们都愿意按期发工钱哦。”\n晓枫看了遥一眼，随即转过脸逼问我：\n“听见了吗？他们是机械工人，不是冲锋的步兵。把枪收缴了换成修车工具，这样总该能带上了吧？”\n我呼出一口气，转头朝走廊上的副官招手：\n“去通知后排卡车，把打空的弹药箱全推下去。拆掉几块挡板，让能走动的全爬进车斗。挤不下的，手把栏杆扶紧了，哪怕掉下车我们也不会减速去捡的。”\n副官应了一声，快步跑去传令。\n我转回身看着晓枫，提起了另一件事：\n“公社那边呢？雪伊还在北边的工业区。卡卡罗姆垮了，索拉娜的死灵大军很快就会顺着铁路线漫过去。”\n晓枫走到桌前，一把拿起那部快要没电的便携步话机，把旋钮拧到了最高频：\n“我们现在掉头回去，就是白白送死。雪伊不是傻子，看到王都方向的黑烟，她自己就会带人往外突围。”\n她把步话机往窗台最高处一放，直接拉出了天线：\n“把这个留在矿顶的信号塔上，全天循环播报车队的撤退路线和海港坐标。雪伊要是能杀出来，就会顺着车辙印追上我们；要是她死在公社……我们去了也只是收尸。”\n车库方向传来了卡车排气管轰鸣的声浪，震得窗框直响。\n遥把风衣的扣子一颗颗系好，朝我和晓枫招了招手：\n“那么，两位长官，该去码头赶船了。”"
 PAU.7.a: "“出发，目标东部港口。”"

 PAU_zbgk: "直奔港口"
 PAU_zbgk_desc: "卡车的大灯全关了，几十辆车顺着沿海公路全速前进。车斗里挤得连转个身都费劲，车轮碾过坑洼时能听见悬挂嘎吱作响的哀鸣。南边天际线上的黑烟越来越浓，那是王都被死灵吞没的动静。晓枫坐在副驾驶上拿着秒表计算路程，遥在后面哼着樱花的童谣。谁也没心思回头看，所有的活路全系在港口货栈的那批燃油和粮食上。"

 PAU.8.t: "货栈门前"
 PAU.8.d: "咸腥的海风顺着破损的车窗灌了进来，吹得仪表盘上的灰尘乱转。\n车队在港区货栈的铁门前猛地刹住，前排卡车水箱喷出的热气在夜色里散开。几名戴着王室帽徽的看守提着马灯从哨房里跑了出来，慌慌张张地举起手里的佩枪，还没弄明白怎么回事就被跳下车的士兵围在了墙根底下。\n“你们是哪个部队的？！”领头的看守官扯着嗓子喊道，手抖得连保险都拉不开，“这里是王都封存的物资，擅自靠近按叛国论处！”\n我推开车门跳下踏板，脚底踩在了码头的湿水泥地上。\n“你们的王都早就没了。”我把帽子往前按了按，“你们的王都大臣大概已经成了索拉娜的晚饭。想保住命的，把库房钥匙交出来。”\n看守官愣在原地，脸色唰地全空了。\n晓枫从车后面走了过来，手里拿着一把用来撬锁的撬棍，连看都没看那群吓呆的看守，直接插进了大门铁锁的扣环里。两名跟上来的筑垒工人用力一扳，挂锁啪的一声断成两截。\n沉重的铁门被合力推开，里面整整齐齐码放着上千个木箱，麦粉的干香和柴油味扑面而来。\n车斗里的伤员和矿工们发出了一阵压抑的骚动，有人甚至开始小声抽泣。\n遥轻快地跳下车，走到码头边缘的系缆桩旁，抬手指向漆黑的海面。\n两长一短的汽笛声穿透海雾，沉闷地荡了过来。\n海湾深处，几艘悬挂着樱花旗帜的庞大运输舰正缓缓驶入锚地，甲板上的探照灯打出一道道雪白的光柱，稳稳落在了我们的卡车前。\n“看吧，我没骗人。”遥转过身，海风吹起她的风衣下摆，“船已经到了，粮食和柴油也拿到了。”\n晓枫站在敞开的库房门前，看着那些跳下卡车拼命搬运物资的工人和士兵，神色复杂地低声问我：\n“接下来呢？登船离开，还是把港口变成防线？”"
 PAU.8.a: "“先把所有的油箱加满，我们再谈以后的事。”"

 PAU_jmyx: "加满油箱"
 PAU_jmyx_desc: "货栈里的柴油桶全被撬开了，士兵和工人们提着油枪轮流给每辆卡车灌满。几个月来第一次闻到真正的饭菜香，大家坐在集装箱旁边狼吞虎咽，连掉在衣角上的肉渣都捡起来吃了。樱花的运输舰在栈桥边放下了跳板，水兵正在清点登船人数。油箱满了，肚子饱了，可谁也没法装作看不见北边铁路线传来的求救信号。"


 PAU.9.t: "跳板搭稳时"
 PAU.9.d: "油料灌进油箱的咕嘟声在码头上响个不停。\n工人们坐在仓库门前的空地上，手里捧着刚加热好的牛肉罐头，呼哧呼哧吃得满嘴是油。几个带伤的年轻士兵互相拍着肩膀笑，那是我们在卡卡罗姆几个月都没见过的松快劲儿。\n遥站在运输舰的舷梯旁，朝我招了招手：\n“货舱腾出来三个大隔间，淡水和干粮都是足量的。阿夏长官，你们的人随时可以开始登船。”\n我低头看着脚边的空油桶。卡车的引擎已经全部热好，只要开上运输舰，这群跟着我挨饿的弟兄就能彻底离开这片泥潭。\n港务室的门突然被人猛地推开了。\n晓枫大步走了出来，头上还戴着电台的耳机，电线在身后拖得老长。\n“通了。”她站在台阶上看着我，语气平静得让人发冷。\n我转过身：“什么通了？”\n“留在矿顶的步话机。”晓枫摘下一边耳机递向我，“雪伊的人冲破了工业区的封锁线，正沿着北边的铁路线往港口撤退。后面全是索拉娜的死灵前锋，她们就只剩下几辆卡车了，弹药快打光了。”\n耳机里全是刺耳的电流杂音，隐约能听到雪伊在另一端粗着嗓子的嘶吼，伴随着密集的机枪点射和撞击声。\n遥慢慢走下跳板，站在了我们两人中间：\n“运输舰必须在潮水退去前起航。如果死灵的主力涌进港区，樱花的舰队会直接收起跳板撤离。我们是来接人的，不是来打阻击战的。”\n晓枫没有去求遥，也没有看周围那些刚刚吃饱饭的士兵。她只是看着我，把手里的耳机递得更近了些：\n“距离码头入口还有十五公里。雪伊只要冲过跨河铁桥，就能甩开后面的步兵追兵。但那座桥被王室撤退时炸塌了一段，卡车开不过去。”\n码头上的风把海浪拍在水泥桩上，碎成一片片泡沫。\n一边是已经搭好跳板、随时可以启航去樱花的运输舰；另一边是加满了柴油、炮口还能开火的几辆轻型坦克。\n所有的弟兄都在回头看着我。"
 PAU.9.a: "“……二连留下来装船，其余人跟我上车，去铁桥接人。”"
 PAU.9.b: "“……收起跳板，我们立刻开船。”"

 PAU_zjwyj: "追加违约金"
 PAU_zjwyj_desc: "遥把一张重新拟好的赔偿清单拍在挡风玻璃上。擅自改变撤退路线等于把整个樱花运输舰队扣在危险的浅水区当靶子，按规矩要赔上好几倍的运费。可她转头就抄起联络机，让外海的护航战舰把主炮转到了铁桥方向。嘴上说着蚀本买卖，手底下的舰炮火力却一发也没含糊。"


 PAU.10.t: "跳上副驾驶"
 PAU.10.d: "柴油机的黑烟刚喷出来，车门就被人在外面用力拍了两下。\n还没等我踩下离合，副驾驶的车门猛地弹开，遥拎着旅行包直接挤了进来，那只小白兽也跟着跳上仪表盘找了个地方趴好。\n我转头瞪着她：“你上来干嘛？船不等潮水了？”\n遥把包塞在脚下，从怀里扯出一副连着长天线的通话器：“开船的指令我推迟了。擅自带着主力去救人，你知道这算严重违约吗，阿夏长官？”\n坐在后排的晓枫刚核对完等高线图，正准备开口。\n我抢先松开手刹，打方向盘把卡车冲上公路：“违约金我以后做工还你。现在跳下去还来得及。”\n遥听了直摇头，语气里满是嫌弃：“做工？拿你在泥地里打滚的微薄薪水还到下个世纪吗？”\n她不再跟我磨嘴皮子，伸手按下了通话器的发射开关，对着麦克风发令：\n“这里是遥。通知海湾里的两艘护航舰，主炮解除待命。校准沿河铁路线北岸，目标是追击公社车队的死灵集群。”\n通话器另一端传来一阵急促的应答声，伴随着刺耳的电磁杂音。\n安排完炮击，遥转过脸看着我，语气听着像个精明的贩子一样：“救人的耗损全记在你的债务清单里。等到了樱花，你和你的队伍每天都得去基地老老实实上班。”\n轰——！\n海湾方向传来了一阵震动地面的沉闷巨响，两道耀眼的火球划过夜空，带着尖利的啸叫直扑北边的山脉，气浪把路旁的树木吹得枝叶乱晃。\n后排的晓枫望着窗外被炮火映亮的天际线，喃喃说道：\n“雪伊要是听见这动静，肯定以为又是哪路王室舰队来要她的命了。”\n“抓稳了。”我踩下油门，卡车顺着车辙印全速冲向铁桥。"
 PAU.10.a: "“去把那个跑不动的家伙捞回来。”"

 PAU.11.t: "铁桥对岸"
 PAU.11.d: "江面上的雾气被远处的炮火撕得粉碎。\n跨河铁桥中间断开了一个大口子，扭曲的桥架悬在水流上方。对岸的铁道旁，一辆翻倒的货车正冒着浓烟，几个满脸黑灰的公社伤员正互相搀扶着躲在桥桩后面。\n车还没完全刹稳，晓枫就推开车门跑了下去，快步赶到断桥边缘。\n对岸那个靠着车轮的身影猛地抬起手里的长枪，大声咳嗽着喊道：\n“对岸是谁？！我手里的子弹可不长眼！”\n那是雪伊的声音。\n晓枫站在断口前，双手拢在嘴边大喊：“雪伊！是我！”\n对岸的身影明显僵住了。雪伊抹了把脸上的污迹，瞪大眼睛认出了晓枫，紧接着目光就扫到了我和开上桥头的车辆。\n“晓枫？！你没死？……等等，军团的人怎么也在旁边？！你们这帮拿赏钱的家伙是来抓我的？！”\n雪伊的声音又惊又怒。\n我走上前，从车头扯下一根沉重的拖车缆绳，甩起带挂钩的那头用力扔过断口，稳稳卡在对岸的一根枕木上。\n我冲着对岸回喊：“少在那边嚷嚷！王都早就被死灵占领了，谁有空抓你换钱！能动的抓紧绳子爬过来，动不了的绑在腰上，我们这边拉！”\n后面的遥也跟着小跑过来，两手扶着栏杆大声补充：\n“动作要快哦！护航舰的炮弹很贵，舰队只答应掩护十五分钟，超时了大家都要留在这儿喂亡灵呢！”\n对岸后方的废墟里传来了死灵怪物的嘶吼声。\n晓枫踩上悬空的铁梁，朝对岸伸出手：“雪伊！别犯倔了！先把伤员送过来！”\n雪伊咬着牙收起武器，转身和几个工人把第一名重伤员用皮带绑在缆绳上。\n我和车队的几名士兵抓稳绳子，一点点把人拉过江面。\n十多分钟过去，顺着缆绳爬过来的雪伊浑身湿透，刚跳上这边的地面就脱力地坐了下去，大口喘着粗气。\n晓枫蹲下身，伸手替她擦掉额头上的血渍。\n雪伊转过头狠狠瞪着我：\n“……阿夏，你带队开炮轰我防线的事，我可没答应就这么算了。”\n我把一盒热好的牛肉罐头塞进她怀里：\n“我也没打算让你就这么算了。先吃东西，车队该回码头了。”"
 PAU.11.a: "“全员上车，返回港口。”"

 PAU_zmxx: "装满鲜血的罐头"
 PAU_zmxx_desc: "撤回港口的卡车还没熄火，车斗里就吵翻了天。脱险的侥幸被对岸留下的血腥味冲得干干净净。雪伊不肯咽下军团分发的口粮，指着车厢里的伤员厉声质问。卡卡罗姆阵地上被炮火轰碎的工事、铁桥北岸没能抓牢缆绳的同伴，全成了横在所有人中间拔不掉的钉子。谁也没法替死在路上的同僚大度地假装一切都没发生。"

 PAU.12.t: "谁留在对岸"
 PAU.12.d: "车轮刚在码头的水泥地上刹停，车斗里就传出一声沉闷的撞击声。\n雪伊抓起怀里那个温热的牛肉罐头，用力砸在车厢挡板上，马口铁罐滚落在地，里面的肉汁溅了一车板。\n她扶着车栏站起来，满是灰的脸颊因为愤怒涨得通红，指着晓枫大声吼道：\n“晓枫！你看看车厢里坐着的都是谁？！二班的伤员全被截在断桥北头，李工为了给卡车挡机枪，整个人被扫进河里连泡都没冒一个！你告诉我，你凭什么坐在军团的卡车上发号施令？！”\n晓枫从后排站起身，迎着雪伊通红的眼睛，语气低沉：\n“如果车队不按时撤离，所有人都会死在隘口。”\n“所以你就挑着人救，是吗？！”雪伊的声音几乎破了音，眼泪混着脸上的黑灰正往下淌着，“在卡卡罗姆，军团的大炮直接把防御工事连同几十号守地的兄弟全扬成了灰！他们到咽气都以为自己是在抵抗王室的走狗！结果呢？！你现在居然跟这帮开坦克的强盗坐在一辆车里吃罐头？！”\n她猛地扭过头，目光死钉在了我的身上：\n“阿夏！对岸还有四十多个人没爬过来！桥桩后面全是活生生的人！你为什么下令把牵引绳割断？！你哪怕多等三分钟……”\n我推开车门跳下踏板，转过身仰头看着她：\n“再等三分钟，死灵的先锋就已经顺着绳子爬过江了。到时候整座铁桥全得丢，卡车上的伤员一个也别想活着进港区。”\n“那对岸的人就活该被扔下吗？！”\n“他们没活该，我也没做错。”我避开她那双快要喷火的眼睛，抓紧了腰间的皮带，“在卡卡罗姆开炮是我下的令，在铁桥砍断缆绳也是我下的令。你想骂就冲着我来，但少在这里冲着晓枫撒泼，她手里的枪早就被我下了。”\n车斗里的公社工人和重伤员全都低着头，没人敢出声，只有海浪拍打码头木桩的哗哗声在四周回荡。\n一直站在车尾跳板旁的遥收敛了平时的玩笑神情，抬手看了一眼天色，轻声提醒道：\n“港口的巡逻舰已经在催促了。距离潮水退去只剩最后几分钟，想吵架的话，等所有人都活下来，到了船舱里有的是时间吵。”\n晓枫走到车斗边缘，朝雪伊伸出了手：\n“下车，雪伊。把眼泪擦了，去帮后勤队抬担架。我们欠他们的命，活着才能想办法还。”\n雪伊咬破了嘴角，抬手狠狠推开晓枫的手臂，自己一个人抓着栏杆跳下了车，摇摇晃晃地朝登船的舷梯走去。"
 PAU.12.a: "“……去核对登船名单，一个名字都不许漏。”"

 PAU_jjka: "紧急靠岸"
 PAU_jjka_desc: "谁也没料到死灵会从几百米深的海底浮上来。船的尾舵被水下的断木撞坏了，海水灌进轮机舱，根本不可能直接横跨大洋。只能顺着领航灯，强行拐进圣杯王国设立在海岛上的前哨补给站。那里的驻军按照战时海关条例，要求扣留货舱里整整五成的物资作为停泊与检疫费。为了保住船舱里的伤员，只能把刚抢到手的粮食分出去一大批。"

 PAU.13.t: "海关印章"
 PAU.13.d: "船底传来第一声闷响的时候，所有人都以为只是撞上了暗礁。\n紧接着，第二声、第三声剧烈的撞击连着震翻了底舱的好几桶柴油，海水混着水草从破损的甲板缝隙里涌了上来。\n探照灯的光柱扫向海面，水下浮上来的全是被海水泡烂了的肢体，密密麻麻缠在断裂的沉船残骸上。几具膨胀变形的骷髅抓着船舷的排水孔，正顺着锚链往上爬。\n在大家的认知里，死灵只是一群在泥潭里行军的陆地怪物。谁也想不到索拉娜的尸潮早就顺着海底海沟，蔓延到了大洋深处。\n两艘护航舰开炮打碎了水下的骨架，但船的尾舵已经被撞烂了，轮机舱进水，根本不可能支撑到海对面。\n清晨时分，受损的船队只能跟着引航灯，拐进了圣杯王国设在近海孤岛上的巡防基地。\n港口里停着两艘巡逻舰，高音喇叭里传来带口音的严肃警告：\n“未经通报的武装船只，立刻停机下锚。甲板上所有人员举起双手，接受战时卫生检疫。”\n晓枫扶着栏杆，指着岸边的防波堤说道：“这是圣杯在南大西洋的补给港，驻军只认条约和规章。”\n一名穿着海军常服的圣杯军官带着随从走上了跳板。他手里拿着文件夹，目光扫过甲板上满身黑灰的士兵和浑身湿透的伤员，平淡地宣读道：\n“你们的船体有严重的生物污染痕迹，发动机也在漏油。按战时港口条例，我必须拒绝这批未经许可的武装难民入港。”\n我正准备拿出货栈清单交涉，站在身后的遥已经一步跨到了跳板前。\n她解开风衣领口的扣子，亮出内衬上那枚刻着樱花的金属印记，同时将一份盖着鲜红钢印的公函递到了圣杯军官面前。\n“我是樱花派遣的随船全权代表遥。”她的语气带着不容置疑的正式腔调，“这几艘船登记在樱花海军的临时护航名录下，船上的人员属于受保护的技术雇工。”\n圣杯军官看着那枚印章，神色明显严肃了起来。他抬手扶了扶帽檐，语气换成了对待外国使节的公事公办：\n“既然有樱花的正式国书，港口可以依照战时避难公约提供修船船坞与检疫用药。但紧急停泊费与入港消杀税依然有效，我们要征收货舱里五成的面粉、罐头以及全部的燃油。”\n这依然是一笔苛刻的条件。那些物资是我们好不容易才抢出来的命根子。\n雪伊此时正站在舱门口，手里端着一碗刚刚过滤出来的清水，小心地喂给担架上发高烧的工友。她听见对方开出的条件，肩膀颤动了一下，最后只是咬住嘴唇，低头继续给伤员擦脸。\n“可以，按你们的规矩办。”遥在入境协议上签下名字，把文件递还给军官，“请立刻接通岸上的维修电缆，安排伤员进消杀棚。”\n军官收起文件夹，行了一个标准的海军礼，转身吩咐手下开动起重机卸货。\n起重机的吊臂把一箱箱刚到手的食物吊向码头仓库。\n晓枫靠在栏杆边，看着岸上高高挂着的圣杯旗帜，低声说了句：\n“至少……大家暂时不用担心被拖进水底了。”"
 PAU.13.a: "“……下锚，抓紧时间抢修发动机。”"


 PAU_wcka: "无处靠岸"
 PAU_wcka_desc: "拿口粮换来的停泊许可撑不了几天，樱花那边传来的消息更是直接断了大家的念想。两艘坏了舵的货轮根本开不回大陆，继续往前又是军警把守的死胡同。几千名弟兄还在舱底等着出发的口令，我们必须在这座异国港口里拿出一个交代。"

 PAU.14.t: "电波中断时"
 PAU.14.d: "小果子把耳机紧紧贴在耳边，回过头看着我们，带着快要哭出来的腔调：\n“遥姐姐……广播里反反复复都在放进行曲，念的都是被逮捕的名字，码头工会根本没人应答啊……”\n晓枫直接把那份通关文件推到了遥的眼皮底下：\n“印章属于几年前就被取缔的救济会，内阁根本没派过所谓的通商使节。这支船队到底是谁调来的？”\n我盯着桌对面的少女，省去了所有客套：\n“所以，你带着我们在山道上拼命，又割掉大批口粮给圣杯交税，结果海对面的港口我们根本进不去，没错吧？”\n遥迎着我的视线，平日里那股漫不经心的神气散得干干净净。\n“对，是我搞砸了。”\n她回答得没有一丝拖泥带水。\n“军部突然发动了政变，我们在那边的据点几天内被拔得一干二净。工人们赤手空拳，在步枪面前根本撑不住多少时间……”\n她深吸了一口气，语气里是一种少见的认真：\n“我看过你们在南美的战报。这里有经历过正规战的炮手，晓枫懂全盘调度，工人们能就地抢修机床。我们那边黑得看不见路，我必须把你们带回去。”\n“所以你就拿我们的命去赌？”我看着她。\n“是。”\n遥没有逃避，甚至连眉头都没皱一下：\n“我算准了你们需要柴油，也借了你们突围的势头。但我高估了家乡同伴能撑住的时间。这场灾祸因我的狂妄而起，责任在我。要是想拿我去喂亡灵或者任何人换退路，我认罚，不还手。”\n靠在门边包扎伤口的雪伊冷笑了一声：\n“行了，少在这儿演英雄受刑的戏码。当年的王室比你会算计得多，我们还不至于蠢到拿一个小姑娘的脑袋去讨好它们。”\n晓枫直接把航海图摊开在两人中间，打断了空气里的紧绷：\n“用不着把罪名全揽在自己身上，小遥。卡卡罗姆那一仗，就算你没来，阿夏为了手底下的活路也会强行借道，我也不可能就此把那里让出去。那是躲不开的冲突。”\n晓枫在图纸上用力点了两下：\n“现在的麻烦是，大陆回不去，东进的航线也堵死了。至于你欠我们的，等找到能落脚的地方，再慢慢跟你核对。”"
 PAU.14.a: "“我们得重新商量怎么活下去。”"

 PAU.15.t: "防波堤下"
 PAU.15.d: "我把遥拉到了仓库后方的防波堤拐角，这里海风正把潮水一层层推向水泥打成的桩子。\n避开屋里其他人的视线，我直接盯着她问：\n“把话说清楚。公函是假的，使节也是假的，你一个小姑娘到底是怎么把两艘带炮的船开出军港的？”\n遥把衣领往上拉了拉，平日里欢快的劲头一点也没剩下：\n“家乡的情况比战报上写的还要惨烈。工人和学生被军警堵在船厂里，大家凑了最后的重油，用命做掩护让我把这两艘船开出来，他们自己留在了岸上……”\n她说着很急躁，语速越来越快：\n“我们真的很需要——我们需要懂战术的指挥官，需要懂对付重装甲的炮手，需要……”\n“停停停，打住。”我直接打断了她，“我没重新问你需要什么。我是问，如果东边的港口早就戒严了，你在大洋上是怎么躲开巡逻舰的？还有——”\n我指了指缩在她风衣领口里的毛团：\n“你兜里揣着的这个小东西，到底是个什么来历？”\n遥伸手抚摸着那团白色的绒毛，眼神里带着心疼：\n“它叫白夜，是家乡神社里留下来的山灵。军部的人想把它抓去当战争用的武器，同伴们把它偷出来交给了我。”\n她把围巾稍稍拉开，露出那只小白兽疲惫蜷缩的模样：\n“在深水区碰到海底死灵的时候，是它用自身的力量护住了船底的龙骨，大家才没直接沉进海沟里，现在它累得连眼睛都睁不开了。”\n遥眼眶泛红地看着我：\n“我带着它跑了上万公里，原本以为只要把你们带回去，大家就能一起把家乡的封锁线撕开。我从来没想过把你们当成消耗品……真的。”\n海浪又拍在了水泥桩上，溅起几滴水沫落在了我的鞋面。\n看着那只呼吸微弱的小白兽，以及眼前这个看起来好像可怜兮兮的少女，我叹了口气。\n“行了，别解释了。”我按了按帽檐，“说到底，你和我们一样，也是个带着最后一点希望到处逃命的败军之将罢了。”"
 PAU.15.a: "“走吧，回屋里去，看看晓枫她们怎么说。”"

 PAU.16.t: "掉转船头"
 PAU.16.d: "“把船直接开进老铁厂的排污河道！趁着涨潮把装甲车吊上岸，顺着铁路线直接抄死灵的后路！”\n我刚推开库房门，雪伊的大嗓门就直接撞了过来。\n晓枫站在木箱拼成的桌子前，手里的铅笔在图纸上敲了敲：\n“然后让吃水深的大船在退潮时卡在浅滩上，大家跳进泥水里推船吗，雪伊同志？”\n“……晓枫！你能不能少浇点冷水？！”雪伊抓了抓头发，被呛得直翻白眼。\n小果子头上戴着耳机，两只脚悬在弹药箱边缘晃悠着，急忙举手打圆场：\n“晓枫姐，雪伊姐，别吵啦！刚才铁厂那边的电台又发报了，工人们把高炉的阀门焊死了，索拉娜的巡逻队根本冲不进去呢！”\n我和遥站在门口，看着屋里这副热火朝天的架势。\n我摘下帽子拍了拍上面的水汽：“你们不在这儿商量怎么分剩下的口粮，围着地图吵吵什么呢？”\n晓枫抬起头看着我，眼神里透着那股熟悉的敏锐劲儿：\n“我们在找登陆点，准备回南美。”\n“回大陆？”我拉过凳子坐下，“索拉娜的死灵把王都吞了，我们这点人开着破船回去送死？”\n小果子急忙把草稿纸递过来，上面记满了电报代码：\n“不是送死！阿夏姐你看，索拉娜的死灵根本没有在海岸线设防，主力都被王都内陆吸引过去了。工区的自卫队抢下了武器库，造船厂和高炉都还在工人们手里呢！”\n晓枫用铅笔在沿海几个港口画了圆圈：\n“索拉娜手里的力量开始失控了。水底下冒出死灵就是证据，她根本压不住那颗心脏散发出来的死气。内陆乱成一团，但沿海的防御已经空掉了，现在到处都是抵抗的工人和逃出来的士兵。”\n话音刚落，雪伊把手里的罐头往桌上一放，用很倔的语气说道：\n“在这个破岛上给圣杯交税，等手里的柴油耗光了也是死路一条。装甲车加满了油，与其在这儿等死，不如杀回去把沿海抢下来当家底。”\n遥靠在桌边，看着地图上圈出的海岸线，苦笑了一下：\n“反正樱花那边已经到处都在抓我了，我连家都没得回。两艘船上的重油只够跑几百海里，与其在大洋上漂成淹死鬼，不如跟你们一起回大陆拼一把。至少船上的两门副炮还能替你们开路。”\n海风顺着门缝吹进来，把地图的边角吹得哗哗响。\n刚才大家还在为了前路断绝而发愁，现在这帮人却已经把炮口瞄准了老家。\n我叹了口气，把帽子重新戴好：\n“真是服了你们这帮人。”\n我转身走向门外：\n“去通知水兵准备起锚，把弹药搬上车。”"
 PAU.16.a: "“……出发，杀回大陆去。”"

 PAU_dsyq: "赌上我们的一切，\n刺入深渊"
 PAU_dsyq_desc: "起锚机的齿轮在甲板下方轰然转动，粗重的链条拖带着咸湿的海水升出水面。货轮在引航员的哨音中缓慢掉转船头，两道银白的航迹笔直地切开海湾的波浪。小果子在驾驶台上大声报出潮位与航向，晓枫手里的望远镜已经锁定了地平线尽头那片升腾的黑烟。遥靠在指挥台的栏杆旁，示意轮机舱把蒸汽压力提到极限。\n离开那片大陆的时候，我们是一群丢盔卸甲的逃亡者；\n而现在，翻滚的浪花正把我们推回那座燃烧中的故乡。\n前方的海岸线越来越近，每一门火炮都已经校准完毕……\n\n§R我们，杀回去。§!"

 PAU.17.t: "压根没有什么特派员"
 PAU.17.d: "我走到货船后甲板的时候，工人们正跟着几名水手给吊钩挂上钢缆，准备把轻型坦克固定在舱口前头。\n遥就蹲在一旁的缆桩边上，手里捏着一根细铁丝，帮水手挑出卡在绞盘齿轮里的麻绳碎屑。\n旁边那个穿着油污工作服的年轻水手抹了把脸上的黑灰，嘴里还在小声埋怨：“遥小姐，下次别让白夜钻进配电箱了，全船的线路都差点被它当磨牙棒啃断。”\n那只小白兽趴在遥的膝盖上，懒洋洋地打了个哈欠。\n我走过去，抬脚踢开挡路的撬棍：“吊臂的缆绳检修完没有？晓枫在前面核对航标，需要确认巡防舰那两门炮的俯仰角和装填速度。”\n水手抬起头看着我，又转过脸看向了遥，有些尴尬地挠了挠后脑勺：\n“这位长官……实话说，巡防舰上压根就没有正牌火炮长。掌舵的是被海校开除的见习士官藤井，我们几个在船上本来全是在底舱铲煤的司炉工。刚才在铁桥开炮，全靠藤井翻着出海前塞在铺盖底下的操典现教的。”\n我手里的海图差点滑落到甲板上。\n“……什么？”我扭头盯着遥。\n遥手里挑麻绳的动作停住了。她抬起脸，干笑了一声，眼神悄悄飘向旁边的吊车臂：“哎呀，阿夏，别在意这些旁枝末节嘛。你看刚才在铁桥那边，炮弹不也挺准地砸在河对岸了吗？”\n“在矿山地下室里，你跟我说这是樱花内阁秘密调遣的护航舰队。”我把海图卷起来敲在手心，只觉得太阳穴一阵乱跳，“在圣杯补给站，你说工人和学生在船厂等着你带我们回去救命。你现在告诉我，你们连个正经炮手都没有？”\n旁边的水手叹了口气，把手里的油抹布扔进铁桶里，替她把话全抖了出来：\n“长官，您别听遥小姐吹了。当时樱花本土虽然没彻底闹政变。但基地军官克扣了我们好几个月的伙食费，后来造船厂工人和学生罢工，里头全是兄弟姐妹们的亲戚。上头非逼着我们把巡防舰开进内河架机枪开火。藤井士官一把扯了领章，带着底舱的弟兄把军官锁进禁闭室，连夜开走巡防舰，顺带把码头边那艘刚装满口粮和煤炭的军需货船也一起强行拽出了港。”\n他指了指遥：\n“遥姑娘当时在码头掩护几个逃跑的同伴，被宪兵追得走投无路，顺着缆绳直接滚进了货船底舱。大家身上全背着通缉令，亚洲的港口一个都进不去，只能靠藤井自学的那点天文航海本事一路往东开，想着开着货船跑到南美找个什么日裔农场隐姓埋名也好。”\n我转过脸，直勾勾地看着遥。\n遥把膝盖上的小白兽抱进怀里，整个人往风衣里缩了缩，声音越来越小：\n“我也没想到……你们南美这边的情况比我们老家还要烂嘛。我下船的时候实在饿得头晕，顺着公路走，刚好看见你们营地的旗子……想着既然你们有枪又有坦克，货船里又有现成的吊臂和空舱，不如把架子撑得大一点，借你们的手一起去仓库抢点柴油……”\n货船的起重吊臂在头顶发出沉重的吱呀声，把一辆轻型坦克稳稳吊进了底舱。\n从大清早跑进军营要饭开始，到在桌上煞有介事地画圈、掏出假的通关文书、甚至编出整套跨洋特派员的由头……\n我按了按被海风吹得发凉的帽檐，长长地呼出一口气。\n这小鬼嘴里到底还有多少句鬼话是我还没听出来的？"
 PAU.17.a: "“……去把操典拿来，我现在重新教你们怎么瞄准。”"

 PAU.18.t: "既然我们早已无处可逃"
 PAU.18.d: "小果子把连着长电线的话筒递到我面前，眼圈红红地抽噎着：\n“阿夏姐，整个海岸线的波段全接通了……广播里能听见工人们敲击管道的信号，大家都在问是不是有船回来了……”\n驾驶室里站满了人。\n雪伊靠在铁门旁，正低头给怀里的步枪装填弹夹，她那低垂的额头上还沾着机油的污迹；晓枫双手撑着桌沿站在海图台前，目光停留在沿海那些熟悉的工厂名字上；遥把白夜轻轻抱在怀里，那只小白兽安静地贴着她的衣领，身旁那几个来自樱花的年轻水手正握着传令管，等待着最后的坐标。\n这里原本聚集着一群最不可能同行的逃亡者。\n我伸手接过了那个带着体温的手持话筒，按下了侧面的红色开关。\n全船的广播喇叭与沿海无数部破旧的无线电接收机里，同时响起了温和而平稳的电流声。\n“这里是阿夏。”\n我握着话筒，声音在空旷的舱室里回荡开来：\n“对，就是那个在卡卡罗姆为了抢路向同伴开炮、在铁桥前亲手割断缆绳的阿夏。”\n身边的雪伊手里的动作停了下来，整间驾驶室里安静得只剩下轮机深沉的轰鸣。\n“我们当了太久的雇佣兵。过去这几年里，我们总以为只要手里还紧握着王室给的欠条，只要还能用武器换来下一顿晚饭，就能假装自己是一群没有家园、也不需要家园的游魂。因为害怕承担别人的生死，我们就把冷酷当成清醒；因为害怕被抛下，我们就抢先把昔日的战友丢在身后。”\n我呼出一口气，转过头看向那些穿着油污制服的樱花水手与身旁的同伴们：\n“看看我们脚下的这两艘船吧。这上面的燃油，是樱花的水手们为了不向自己的亲友开火、顶着叛国的罪名抢出来的；这上面的每一发炮弹，也是造船厂的工人们冒着枪林弹雨一箱箱搬进底舱的。而我们这帮原本只想着逃命的懦夫，竟然还厚着脸皮坐在别人的船舱里，做着逃去大洋对岸的美梦。”\n电台的那一头，远方工厂的杂音里隐约传来了微弱的抽泣声。\n“可是啊……在这个世界上，到底哪里才算得上是能安稳睡去的家乡呢？”\n“根本没有那样的地方。只要心里还在为那些留在对岸的名字感到难过，只要我们还在惦记着这片被怪物践踏的土地，就算逃到天涯海角，我们也依然只是一群无家可归的亡魂。”\n我抓紧了话筒，将胸口积压的所有软弱与决意一口气说了出来：\n“既然我们早就无处可逃了——”\n“那么，所有还躲在车间里、高炉下、废墟深处不肯低头的兄弟姐妹们，请你们再多坚持一会儿。”\n“这群做尽了错事的雇佣兵，今天决定把自己的命押在这片土地上。我们带着樱花人民用勇气换来的战舰与火炮，回来接大家回家了！”\n我松开了开关，将话筒稳稳挂回了操作台旁的铁钩上。\n雪伊转过身去，抬起袖子用力擦了擦眼眶，小声骂着，语气里却忍不住带着一抹哭腔：\n“真是个无可救药的混账……早点这样说不就好了吗。”\n晓枫抬起头看着我，脸上露出了重逢以来最轻松的微笑，轻轻拍了拍海图上的海岸线。\n遥抱着白夜轻快地跳下了木箱，红色的眼眸亮晶晶的，转头冲着传令管大声喊道：\n“听到了吧，藤井！全速倒车可从来不是我们这帮叛徒的规矩，把主炮的保险全给我打开！”\n巡防舰的前主炮猛然爆发出耀眼的烈火，呼啸的炮弹划破昏暗的天空，笔直地飞向了海岸线上那片等待着破晓的亡灵废墟。"
 PAU.18.a: "“全舰全速推进，我们回家了。”"

 PAU.19.t: "明天不用出操了"
 PAU.19.d: "我把沾满泥浆的行军靴从脚上脱下来的时候，鞋底的防滑铁钉已经在碎石路上磨平了整整一层。\n原本金碧辉煌的王室议事大厅里，现在乱糟糟地坐满了伤员和工人们。那几幅绣着家徽的挂毯被樱花水手扯了下来，充当挡风的门帘挂在了炸碎的窗框前。几个浑身灰的司炉工正围在壁炉旁，拿铁通条架着几罐肉酱，咕嘟咕嘟地煮着热汤。\n雪伊则直接坐在了原本属于摄政大臣的雕花椅上，用刺刀撬开一罐浸着糖水的桃子，给旁边包扎着胳膊的年轻工人分了一大勺。她脚边还胡乱堆着几箱拆封的子弹，顺脚把滚到路当中的镀金烛台踢到了墙角，好给担架腾出走道。\n晓枫用笔在整幅地图所有的隘口上画满了代表肃清的斜线。画完最后一笔，她把笔往桌上一扔，整个人靠在石柱上，闭上眼睛长长地舒了一口气。\n那些漫山遍野的死灵怪物终于被彻底赶回了地底下，整个莉兰迪亚连同沿海各工区的黑烟一起，迎来了几年以来头一次没有枪炮声的傍晚。\n遥正盘腿坐在弹药箱上，把一小块干酪掰碎了递到白夜嘴边。那只小白兽吃饱喝足，把脑袋埋进她的袖口，发出轻微的呼噜声。\n遥抬起头，冲着我招了招手：\n“喂，阿夏长官。王室跑没影了，索拉娜的怪物也全被扬成灰了。你欠我的货船租金和燃油损耗，现在打算拿什么抵账啊？”\n“挂在账头上吧。”我揉了揉被帽子压得发胀的脑门，把靴子里的沙子倒在了地上，“明天一早，带上你的水手去泊位集合，跟工人们一起把炸塌的吊车架子抬出来。”\n“哈？！”遥瞪圆了那双红色的眼睛，气呼呼地嚷道，“我可是把你们从大洋上载回来的大功臣哎！明天难道不该在广场上给我发一枚亮闪闪的勋章吗？！”\n坐在扶手椅上的雪伊咽下嘴里的甜桃，毫不客气地嗤笑了一声：\n“少在这儿做美梦了，樱花来的骗子小姐。明天东区铁路线的机车头锅炉要换衬板，你的司炉工要是敢迟到，后勤队可不给你们留早饭。”\n“谁是骗子啊！藤井他们开船开得可认真了！”\n遥把白夜举在脸前抗议着，引得旁边几个端碗喝汤的年轻士兵哄堂大笑。\n大厅里弥漫着肉汤的热气、刺鼻的硝烟味以及湿漉漉的汗味。\n没有王室的赏钱，没有冠冕堂皇的册封，大家甚至连一套干净的常服都找不出来。\n但我知道，从今往后，再也不会有人把催命的欠条塞进我们的抽屉，也没有人能把我们逼进退无可退的绝境了。"
 PAU.19.a: "“……大家都辛苦了，今晚好好睡一觉吧。”"

 PAU_zhyk: "最后一箱罐头"
 PAU_zhyk_desc: "从货栈里抢出来的罐头总共就剩这么几箱，等伤员和工人们分完最后一勺肉汤，后厨的铁锅就彻底见底了。死灵怪物虽然被打退了，但农田全被踩成了烂泥，机车库里那几台老机车的汽缸也都裂了缝。雪伊天不亮就带着工人去铁轨上换道钉，晓枫则拿着纸笔在粮库门前按人头分面粉。拿惯了步枪的雇佣兵不会种地，懂车床的工人们又饿得提不动扳手。要是赶在下个冬天来临前没法让高炉重新出铁、没法把麦子种进地里，大家就算没死在战场上，也得在这座空城里活活饿死。"


 PAU.20.t: "船队大改装"
 PAU.20.d: "我看着墙上挂着的存粮清单，上面的数字已经被晓枫用红笔划掉了好几遍。\n后勤库房里剩下的面粉只够维持短短几天，地里的麦苗也全被死灵踩成了发黑的泥浆。内陆的运粮道被王室的残部卡死，圣杯王国的军舰又在海湾外头虎视眈眈。要是再弄不到吃的，刚打下来的港口立刻就会变成一座饿殍遍地的死城了。\n正当我头大时，门突然被人用靴子一脚踹了开来。\n遥卷着沾满泥水的裤腿跑了进来，手里还拎着一个木桶。她把木桶往桌上一放，两条银亮的海鱼在水里扑腾出大片水花，溅得海图到处都是。\n“看！海里的大鱼！”遥抹了一把脸上的水珠，眼睛亮得像是在发光，“内陆的土地被死气泡烂了，但外海深水区的鱼群可不知道索拉娜是个什么东西！”\n晓枫抬起头，有些迟疑地指着窗外的海湾：“港里的渔船早就被王室撤退时全烧光了，我们拿什么出海？”\n“谁说要用木头渔船啦？”遥跳到桌边，得意地拍了拍胸口，“藤井他们把货船上的吊臂改成了拖网绞盘，巡防舰前面那两盏高功率探照灯夜里往水里一照，成群的鱼顺着光就往网里钻了！我和水手们试捞了一网，连甲板都差点被压沉了！”\n她从兜里掏出一张画得密密麻麻的草图，直接拍在我和晓枫面前：\n“不仅是打鱼！我让工人们把两辆轻型坦克的炮塔拆了，换上装卸铲，拿柴油机当牵引车去犁地排水。只要把泥层底下的盐碱翻出来晒透，再掺上炉渣灰，下周就能把耐寒的杂粮种子全播下去！”\n我看着草图上那些歪歪扭扭却极其详尽的机械改装图样，不由得愣住了。\n这个平日里满嘴胡话的异国少女，办起正经事来竟然比谁都利索。\n“阿夏，别愣着啦！”遥伸手推了推我的胳膊，笑嘻嘻地催促道，“快让你的兵换上干活的衣服，跟工人们一起去海滩拉网吧。今晚全城的人都必须吃上一顿热腾腾的鱼汤！”"
 PAU.20.a: "“……去通知各连队，全员去码头帮水手拉网。”"

 PAU_wrcr: "没人承认的土地"
 PAU_wrcr_desc: "逃走的王室给各国港口发了通报，把我们打成了霸占沿海的叛乱暴徒。圣杯王国的巡逻船天天在海湾外头转悠，借着防疫的名头把航线封得严严实实。更要命的是，樱花本土那帮新上台的军官在电台里反复播报通缉令，勒令藤井把巡防舰开回去受审，连遥的名字都被挂在了头一条。对外，我们是一群连通商文书都开不出来的黑户；对内，公社工人、旧军团溃兵和樱花逃兵全挤在同一个港口里。大家到底算是一支军队还是一个新政权，谁也没法给出一个定论。"

 PAU.21.t: "站在弹药箱上的外乡人"
 PAU.21.d: "中央广场的粮站门前突然传来了一阵剧烈的推搡声。\n一名脸上带着旧疤的雇佣军老兵被几名年轻的铁道工人围在墙角，地上的面粉袋被踩破了一个大口子，面粉跟着撒了一地。\n“你们这帮以前给王室当看门狗的刽子手！”领头的工人紧握着撬棍大声怒骂，眼睛里满是仇恨，“我哥哥就是死在卡卡罗姆的阻击线上！你们凭什么跟我们分一样多的干粮？！”\n老兵的脸色变了变，手不由自主地摸向了腰间的武装带。周围原本正在排队的溃兵和工人们迅速分成了两派，各自抄起身旁的铁锹与短枪，空气里的火药味一下子顶到了头。\n我和晓枫正准备带卫队过去压制，一个娇小的身影却抢先一步冲进了人堆。\n遥跳上了一只倒扣的木头弹药箱，抬手一挥，手里的短刀直接插在两伙人中间的木桩上，发出一声清脆的震颤。\n“都给我把手里的家伙放下！”遥站在高处，居高临下地冲着两边大声喊道。\n人群安静了一瞬，随即爆发出一声更加刺耳的讥讽：\n“喂，樱花来的丫头！你算什么东西，也配在这里站着？”\n一个满脸刀疤的老工人狠狠啐了一口唾沫，大声质问道：\n“你不过是个从大洋对面逃难过来的外乡人！连你自己老家的船厂都没守住，把我们骗上船到处挨饿，你有什么资格在这片土地上指手画脚？！”\n周围的人群里响起了一阵窃窃私语，怀疑的目光利箭一样射向了台上的少女。\n换作平日，遥早就嬉皮笑脸地糊弄过去了。但这一次，她站在高处迎着所有人的目光，用清脆而沉稳的声音说道：\n“对，你说得一点都没错。”\n她看着那个老工人，语速像是在念一封公开信一样：\n“我是个逃难者。在樱花本土，我和藤井他们连自己家乡的工会都没保住，只能像耗子一样躲在煤舱里跨过大洋。我比你们任何人都更清楚失败是什么滋味。”\n遥的声音在空旷的广场上回荡：\n“但我身后的这帮樱花水手，为了不把机枪对准自己罢工的亲友，宁可背上叛国罪名流亡大洋！我们这帮一无所有的外乡人都知道不能把枪口对着自家人，你们这群刚刚在死人堆里并肩活下来的同胞，现在居然要为了谁前几天吃过谁的亏，在这里争这一碗面粉？！”\n广场上一片死寂，原本叫嚣的工人慢慢低下了头。\n遥伸出手指，指向城外那些刚刚被平整好的焦黑田野：\n“你们想清算旧怨？好啊！去跟山里那些克扣你们工钱的贵族算，去跟地底下的死灵怪物算！在这座城里，今天谁愿意拿起铁锹去修水渠，谁就是这片土地真正的主人；谁要是还想着把枪口对准身边的兄弟姐妹，谁才是这片土地上多余的外人！”\n她从箱子上跳了下来，拔出木桩上的短刀收回鞘中，连看都没看周围退开的人群。\n雪伊从人群后方默默走了出来。她捡起地上面粉袋，拍掉上面的灰，将一整袋面粉塞进了那名老兵怀里，随后把一把铁锹递给了领头的工人：\n“听到了没有？外乡来的小姑娘都把话说得这么透了，还不嫌丢人吗？拿着铁锹，干活去。”\n老兵抱着面粉愣在原地，对面的年轻工人咬了咬牙，默默接过了铁锹，转身走向了排水渠。\n人群慢慢散开，排队的队伍重新恢复了秩序。\n我看着那个正拍着裤腿上的灰尘的白发少女，心里不由得泛起一阵复杂的情绪。\n不知不觉中，这个曾经满嘴鬼话、为了蹭口汤喝到处骗人的逃亡者，已经成了能把所有人牢牢聚在一起的真正领袖了。"
 PAU.21.a: "“……看来以后真得给她发薪水了。”"

 PAU_tyzz: "同一张桌"
 PAU_tyzz_desc: "原本摆在王宫里的大长桌被工人们合力抬进了车库，雪伊带着工会的代表占了长桌左边，阿夏手底下的老兵把佩枪卸在门口规规矩矩地坐在右边，晓枫把新拟定的物资调配条例摊在了桌面正中央。藤井和几个樱花水手有些拘谨地挤在长桌末尾，直到遥大咧咧地抱着白夜坐上桌角，大声宣布他们这帮外乡人也要按期领工作票。从今天起，这里没有领赏钱的看门狗，也没有任人使唤的苦力。防线轮流站岗，高炉三班倒换，每一粒粮食和每一发炮弹的去向都得经过评议会公开举手表决。用这几张盖满机油手印的草纸，我们彻底撕碎了旧时代的贵族法典。"

 PAU_mzyy: "埋葬夜莺"
 PAU_mzyy_desc: "在过去漫长的岁月里，死灵的低语从群山一直蔓延到了海边，把原本繁荣的集镇与工矿变成了亡魂游荡的空城。既然带来灾祸的王室已经瓦解，死灵的源头也已被彻底斩断，我们就决不能任由阴影继续笼罩在这片土地上。死者理应归于安息，生者必须向前迈步。这场纠缠了所有人数年的噩梦，该由我们亲手画上句号了。"

 PAU.22.t: "带锁的温室"
 PAU.22.d: "雪伊一脚把温室那扇嵌着玻璃的大门踹开，手里的步枪直接顶上了膛。\n“索拉娜！滚出来受死！”\n屋里弥漫着一股刺鼻的苦草药味和焦糊的臭气。\n索拉娜就歪在窗边一张藤椅上，两只手腕裹着渗血的布条，整个人瘦得颧骨高高凸起。莉莉安娜正坐在旁边的小凳上，手里拿着一把掉光了漆的木梳，一下一下替她理着打结的头发。\n听到踹门的巨响，索拉娜猛地抽搐了一下。她挣扎着想从椅子上站起来，膝盖却一软，重重栽回了椅垫里。\n“叫什么叫……”索拉娜咬着牙，咳出一口带血的唾沫，恶狠狠地瞪着我们，“工会的泥腿子……带枪进来了不起啊？往这儿打，老子要是皱一下眉头就不算活过！”\n雪伊大步冲上去，枪口直接顶到了索拉娜脑门前不到两寸的地方，额角的青筋全爆了出来：\n“厂里死掉的几十号工人，还有铁桥对岸没能爬过来的那些兄弟姐妹……你今天必须拿命赔给他们！”\n站在旁边的莉莉安娜甚至连看都没看那支黑洞洞的枪管，只把木梳往藤椅扶手上一放，伸手挡在了索拉娜身前。\n晓枫快步走上前，伸手翻开桌面上那些散落的草图和满是血迹的撤退命令，然后看到了索拉娜垂在身侧那条完全发黑溃烂的手臂。\n“雪伊，先把枪放低。”晓枫的声音绷得很紧。\n“凭什么？！”雪伊头也不回地怒吼，“她是罪魁祸首！”\n“她在后面根本就没法指挥那群怪物了。”晓枫把手里那叠被血浸透的军令扔在了桌上，“在沿海公路撤退那会儿我就觉得不对劲，那些死灵连王室自己的车队都砸，港口外面的水鬼更是连运粮船一起拖进海底……她自己早就被神力反噬烧烂了。后面的仗，她自己都是被失控的死灵一路追杀逃进这间屋子里的。”\n索拉娜靠在椅背上，喘得像拉风箱一样，嘴里却还在硬撑：“晓枫……少在这儿装什么明白人……是我抢了心脏，是我把这片地变成这样的，你们开枪啊！”\n莉莉安娜默默从兜里摸出一块糖，塞进索拉娜吵闹的嘴里，还顺手替她把滑落的毛毯拉到了脖子底下。\n索拉娜被糖块噎了一下，脸色瞬间发白，终于没力气再嚷嚷了。\n雪伊抓着枪托的手青筋暴起，枪口随着胸口剧烈起伏：\n“就算她被反噬了又怎么样？！死掉的那些人就能活过来吗？！”\n“不能。”\n我走上前，伸手把雪伊的枪管慢慢按了下去：\n“但你现在把她打成筛子，除了把旁边那个神仙惹毛、把这片地再炸平一次，换不来一斤面粉，也修不好铁道上的机车。”\n雪伊咬着牙盯着藤椅上那个快断气的废人，胸膛起伏了好几下，最后狠狠啐了一口唾沫在地上，猛地收回步枪，大步走到门边背过身去。\n莉莉安娜重新坐回小凳上，伸手握住索拉娜那只焦黑溃烂的手，声音听不出一点波澜：\n“心脏我已经收回来了。索拉娜她……现在连路都走不动，闹不了多久了。这里的门我会关上的，你们…走吧……”\n屋里安静得只剩下索拉娜艰难的喘息声。\n“走了，雪伊。”我拉了拉帽檐，转身往外走，“通报上写索拉娜在城破时死在反噬里了就行。莉兰迪亚还有几万张嘴等着吃饭，没工夫把时间烂在这间屋子里。”"
 PAU.22.a: "“把门锁好，别再让她跑出来了。”"


 PAU_gxzp: "挂上新招牌"
 PAU_gxzp_desc: "临时评议会的几张破桌子已经没法应付一整座运转起来的国家了。工矿要核算产出，港口要拟定关税，原本靠战时口粮维系的秩序必须尽快落实为明文法典。我们在市政厅的门头前摘掉了王室的徽记，换上了由工会、卫队与港口水手共同签字认可的新牌子。但这块招牌底下的裂痕比谁都清楚——昔日的雇佣军与公社的工人们虽然坐进了同一栋楼里办公，彼此投来的目光却依旧带着审视与提防。在真正的大选到来之前，这个拼凑起来的政权全靠战火里残留的默契在勉强支撑。"

 PAU.23.t: "印章该交给谁"
 PAU.23.d: "我把手里的铅笔扔在桌上的时候，笔尖直接滚进了两叠厚厚的文件中间。\n左边是雪伊递上来的公社请愿书，上面密密麻麻签满了工人和铁道员的名字，要求立刻收缴军团的一切重武器，将市政防务全权交由工厂自卫队接管；右边则是跟着我从烂泥地里一路杀出来的老兵们的请愿书，这帮浑身刀疤的军官措辞强硬，坚决要求保留军团的独立薪饷与防区，不接受任何公社干部的指手画脚。\n这两叠纸像两座大山一样压在桌子两头，中间摆着那枚刚刚刻好的临时执政印章。\n从当年在艾瑞波拉为了一口粮食替王室卖命，到在大洋上逃命、带着车队杀回莉兰迪亚，我已经记不清自己有多少个月没脱下过靴子睡觉了。工人们对我这个昔日的雇佣军头子始终充满戒心，我自己也清楚，我根本不是个懂得治理国家的材料。\n这种坐在高位上的无力感，比被机枪压在泥坑里还要让人透不过气。\n“怎么，阿夏长官，这就打算撂挑子逃跑了？”\n遥端着一杯刚泡好的热茶从门外溜了进来，大大咧咧地靠在文件柜旁，怀里的白夜正探着脑袋去嗅着桌上的墨水瓶。\n我按着额头说道：\n“公社那边有雪伊带着工人支持，又有晓枫在做全盘规划。工人们本来就只认她们两个，对我这个开过炮的旧军官防得像防贼一样。我把这枚印章交出去，让公社名正言顺地接管政权，不是皆大欢喜吗？”\n“你真把印章交出去试试看啊。”遥放下茶杯，收起了平时的玩笑神气，直截了当地把话挑明了，“你信不信你今天上午交出权力，下午工人和卫队就能在广场上拔枪对射？”\n我手上的动作停住了。\n“雪伊的脾气太冲，她眼里容不得旧军队的一点沙子，要是让她掌权，第二天就会下令缴了老兵们的枪，你手底下的兵痞肯定立刻炸营；至于晓枫……虽然她懂大局，也懂怎么带兵，但在你那些老部下眼里，晓枫当年是抛弃军团退进山里的‘叛徒’。你把政权交给她，老兵们只会觉得是你这个老长官出卖了他们，把军队打包送给了公社。”\n遥伸手敲了敲桌上那枚冰凉的铜印，直直看着我：\n“你一旦撒手，老兵们没了主心骨，立刻就会把公社当成要砸他们饭碗的仇敌，到时候谁也拦不住他们在大街上兵变。”\n门外隐约传来老兵卫队换岗的皮靴声，伴随着远处工厂汽笛沉闷的鸣响。\n我抓起桌角那枚铜印，整个人疲惫地陷进了椅背。\n想放放不下，想退退不掉。"
 PAU.23.a: "“去把雪伊和晓枫叫进来，我们继续开会。”"

 PAU.24.t: "我不是什么神仙"
 PAU.24.d: "雪伊把一份工会的抗议公文重重拍在桌面上，震得茶杯里的凉水溅了一桌。\n“阿夏！卫队今天上午又把东区的运煤车扣了！”雪伊撑在桌沿上大声质问，“这是原则问题！工会不可能接受旧军队骑在工人头上，你今天必须下令把那几个带头扣车的营长关禁闭，让他们公开向工会道歉！”\n坐在对面的晓枫把整份调度案推到了我面前，用那种近乎冷酷的语气开口：\n“雪伊，现在不是讲原则的时候。阿夏，看看这张排期表。如果不把港口的警备范围和工会的管辖边界切分清楚，明天上午电厂的储煤量就会归零。我拟了几套折中方案，每一套都需要你用执政官的名义强行签发。行政机构不能停摆下去了，你必须现在挑一个盖章。”\n“晓枫！你这叫什么折中？！”雪伊扭头怒喝，“你这是在各打五十大板和稀泥！”\n“我不在乎谁吃亏谁占便宜，我只在乎这栋大楼下周还能不能点得起灯。”晓枫抬起那双锐利的眼睛看着我，用笔笃笃地敲着纸面，“阿夏，拍板是你的职责。别拖延下去了，把主意拿起来。”\n一边是雪伊带着满腔仇恨与原则的怒吼，另一边是晓枫算尽了每一吨煤和每一条法令的精密表格。\n两个人一左一右，像两台严丝合缝的机器，把堆积如山的难题全往我脸上碾压过来。\n太阳穴里的青筋在疯了一样突突乱跳。\n我猛地抓起桌上那枚铜印，用尽全身的力气砸在文件正当中。\n咚的一声巨响，印章砸翻了水杯，茶水瞬间把桌上的表格和公文全泡成了一团糟。我猛地站起身，身后的椅子随着动作向后翻倒，重重砸在了地面上。\n“都给我闭嘴！！”\n整间屋子瞬间鸦雀无声。\n我胸口剧烈起伏着，把憋了几个月的憋屈全吼了出来：\n“你们到底当我是个什么东西？！我是个会变戏法的神仙吗？！”\n雪伊和晓枫闻言都僵在了原地。\n“当年在烂地里要找饭吃的是我，在卡卡罗姆下令开炮被你们骂成刽子手的是我，在断桥前割断缆绳当恶人的也是我！”\n我指着自己的鼻子，声音因为用力过度而剧烈发抖：\n“雪伊！你张嘴闭嘴就是原则与公道，要我当个替所有人平反的圣人；晓枫！你张嘴闭嘴就是职责与运转，拿着这些破表格把我当成连轴转的机器！”\n“现在仗打完了，你们要建新世界，要搞大同公社——结果一遇到理不清的麻烦，全跑来塞到我脸上逼我负责！”\n“老兵们怕饿死找我哭诉，工人们受了委屈找我讨公道！你们两边互相防得像防贼一样，又全把绳子套在我脖子上，逼着我一个人把这架破车往前拉！”\n我抓起桌上被茶水泡烂的公文狠狠甩向地面，纸页哗啦啦散落了一地：\n“我懂什么税率？！我懂什么治安条例？！我就是个只懂带着弟兄们保命的兵痞！我每天晚上闭上眼睛，耳朵里全是在阵地上被炸烂的动静！”\n“你们嫌我是军团的人，又非逼着我坐在这儿给你们当判官……你说我到底该怎么判？！”\n屋里一片死寂，只有我粗重的喘息声在墙壁间回荡。\n原本坐在柜子旁的遥悄悄抱紧了怀里的白夜，低着头一声不吭。\n我跌坐回椅子里，按住剧痛的额头，疲惫地闭上了眼睛。\n“印章就在桌上。”\n“你们谁有本事谁拿去管。”"
 PAU.24.a: "“老娘不干了！”"

 PAU.25.t: "角落里的外乡人"
 PAU.25.d: "我抱着双手闭上眼睛靠在椅背上，由着那枚铜印泡在茶水浸透的公文堆里，打定主意一个字也不会再签了。\n雪伊拉开椅子脸色阴沉地抓着扶手重重坐下：“阿夏不肯管，工会就绝对不会答应把东区货栈让给旧军队，卫队要是敢强占，今晚工人们就上街筑垒。”\n“街垒一筑起来，全城的物资调配立刻就会瘫痪的，雪伊。”晓枫直视着雪伊，“另外，雪伊，你很清楚我为什么不能接手。在老兵眼里，我是当年带头脱离军团的游击队头子；而在工会眼里，我又总在为了大局物资逼你们向军队妥协。我们这些人身上的旧仇太多了，谁坐上去，底下都会有人觉得是在被仇敌统治。”\n晓枫转过脸，视线穿过满地的纸屑，径直投向了靠在文件柜旁边的那个角落。\n遥蹲在凳子上，手里拿着一条烤干的咸鱼，正一点点撕成细条喂给膝盖上的白夜。察觉到屋里的死寂，她撕鱼肉的手动作一僵。\n“但要是让那个连自己老家都回不去的外乡丫头坐上去呢？”晓枫开口说道。\n雪伊愣了一下，随即像是听到了天大的笑话一样猛地站了起来：\n“她？！晓枫你疯了吗？！当初就是她在矿山地下室里满嘴鬼话，骗着阿夏开坦克把卡卡罗姆的防线轰开，又把我们所有人骗上那两艘破船到处逃命！她惹出来的祸还不够多吗？！”\n“正因为这祸是她惹出来的，所以必须由她来坐这个位置。”\n晓枫继续平静得说道：\n“她骗了阿夏的军队替她开路，但也带来了撤走伤员的货船；她强行把我们从山里逼了出来，但也帮着工会在铁桥前打退了怪物。”\n“她欠了驻军的债，因为她把老兵当成了抢油料的枪使；她同样欠了工会的债，因为她把大家逼进了大洋上的绝路。正因为她两头都欠着还不清的账，她坐在这个位置上才哪边都偏袒不了”\n晓枫指了指窗外的海港方向：\n“更何况，港口里的两艘军舰，以及天天出海拉网带回鲜鱼的水手，都只听她一个人的。老兵和公会谁也没法一口吞下她手里的海防力量。”\n晓枫看着缩在柜子旁的少女：\n“她是个被海对面通缉的流亡者，在本地没有宗派，没有旧部，更没有能任她调遣的私人军队。她想活下去，就只能逼着我们两边坐在同一张桌子上。”\n雪伊靠在椅背上，盯着那个还捏着鱼干的少女，沉默了好一阵子，最后有些别扭地吐出一口气：\n“……在广场上，她确实敢站出来把老兵和工人骂醒。比起我们这帮被旧仇绑死的人，这个满嘴跑火车的骗子确实没沾过本地内战的血。”\n被三道目光齐刷刷盯住的遥终于坐不住了。她把白夜一把抱进怀里，整个人往文件柜后面缩去，急赤白脸地嚷嚷起来：\n“喂！你们三个疯了吗？！我当时撒谎是为了找饭吃！你们现在把这么大个烂摊子往我头上扣，是嫌我还不够惹人嫌吗？！”\n我伸出手把泡在茶水里的铜印捡了起来，在袖口上擦干了水渍，随后一把推到了长桌正中央。\n“当初是你把我们从烂坑里忽悠出来的。”我看着她那副慌张的模样，扬起了嘴角，“既然这出大戏是你开的头，那就老老实实坐上台，把剩下的麻烦给我们摆平。”"
 PAU.25.a: "“恭喜你，春日小遥执政官。”"

 PAU_gydj: "各押一份定金"
 PAU_gydj_desc: "遥坐上执政官椅子的第一天，根本没去写什么冠冕堂皇的宪章。她把雪伊、阿夏和晓枫直接拽进后厨，指着冒着热气的灶台定下了规矩：军团老兵负责外围防线和重工业开采，但他们的口粮配额必须由公社工会每日签字；工会全面接管市政运作与车间，但治安巡逻必须由一名老兵带着一名工人共同执勤；而水手们带回来的鲜鱼和煤炭，则由港务局按人头平价分发。\n遥把这套把戏叫做“押定金”。大家用不着装出一副亲如一家的和气模样，但谁要是敢私下里动歪心思，另外两方会在一个小时内彻底掐断他的饭碗。在这座千疮百孔的城市里，这种赤裸裸的利益捆绑，反倒成了最牢不可破的平衡。"


 PAU_msbf: "免税的避风港"
 PAU_msbf_desc: "因为先前亡灵的躁动，圣杯王国在海湾外头拉起了防疫警戒线，海对面的樱花军部通缉令也天天在电台里播报着遥她们的罪行。既然正经的外交途径全被堵死了，遥索性把大洋对面那些对付黑市巡警的手段搬到了南大西洋。\n她让工人们修好了老码头的深水泊位，在灯塔上挂起大灯，公开向公海上所有来历不明的货船发出信号：莉兰迪亚提供全大洋最便宜的修船船坞、不收重税的燃油补给，以及装满底舱的优质咸鱼。挂着各国旗帜的走私商人和私掠船队顶着圣杯海军的白眼，纷纷把航线拐进了我们的海湾。在巡防舰黑洞洞的炮口注视下，这片被正统帝国视为法外之地的海港，硬生生被遥盘成了一个谁也舍不得开炮轰平的灰色商埠。"

 PAU_bzwtp: "别指望能谈判"
 PAU_bzwtp_desc: "西边山口传回来的哨报一次比一次诡异。阿德莱希那边盘踞着的根本不是讲人话的军队，它们是一群长着多余肢体、披着烂皮在废墟里嚎叫的怪物。我们刚从死灵嘴里抢回一口气，就绝对不能再让这种莫名其妙的脏东西漫过我们的边境线。既然侦察兵连一句能听懂的交涉口音都找不出来，那就省去所有外交试探。把大炮和地雷都填进关口的工事里，只要有长着怪模样的东西靠近边境的铁丝网，直接开火。"

 PAU_mfsn: "那些魔法少女"
 PAU_mfsn_desc: "前沿哨所发回来的报告荒唐得像醉汉编出来的故事。南北边那片被称作魔法少女联盟的领地里，据守防线的竟然是一群穿着花哨的裙子、手里拿着发光的……呃…某种高科技机械还是什么东西，和老式长枪的小姑娘。老兵们一开始全当成了笑话，直到侦察队亲眼看见那些女孩用古怪的光芒把袭扰的怪物轰成了碎渣。虽然搞不清她们那套力量是从哪儿来的，但至少对方还能讲通用语，也没表现出吃人的恶习。先派人接通电台试着打探虚实，但在彻底摸清这帮神秘邻居的脾气之前，哨卡上的机枪保险谁也不准关上。"

 PAU_sbtxd: "听说圣杯来了个探险队？"
 PAU_sbtxd_desc: "根据遥截获的电台消息，进驻在亚马逊河口的圣杯远征军，正是当初在海岛上逼我们交出大量面粉和柴油的那帮海军的同行。这群穿着盔甲的老爷在大洋上颠簸了几个月，对外宣称是要开进原始雨林寻找失落遗迹，顺便清理沼泽里盘踞的大蜥蜴。遥甩出一张缴获的探险路线图，笑得差点从椅子上滑下去：“谁会大老远跨过大洋专门跑来抓蜥蜴啊？这帮老爷八成是盯上了林子里的金矿和木材。”\n不过玩笑归玩笑，对方那些满载火炮的护航舰确实停在下游水道上。按照遥的盘算，既然当年我们在海岛上挨了他们的盘剥，现在正好倒过来向他们高价推销砍刀、咸鱼和退烧药，顺带让他们在深林前线充当阻挡阿德莱希那群怪物的免费盾牌；但要是这群探险家敢借着由头让炮口对准沿河工区，我们也随时准备教教他们，到底谁才是这片雨林真正的主人。"

 PAU.26.t: "既然都在防线上"
 PAU.26.d: "通信机里跳出了一个此前从未监听过的固定频段，几声清脆的按键声过后，传出一个带着关西口音的年轻女声：\n“我是莉兰迪亚的临时执政官春日小遥。各位魔法少女指挥官，占用几分钟频率。”\n信号那头的声音很平稳，背景里还隐约能听见机床冲压铁皮的哐当声：\n“前沿哨兵前几天发回了你们跟那些……是魔女还是什么来着……交火的战况。总之在如今这个秩序碎成渣的大陆上，看到年纪比我们车间学徒还小的女孩端起武器顶在最前面，没人会觉得这是什么童话。大家心里都清楚，你们身后肯定也有哪怕丢了命也想护住的人。”\n通讯那头传来翻动纸张的声响：\n“我们手里有刚出炉的优质钢轨、成箱的口粮，以及能连夜抢修火炮的技工；你们在前线有压制怪物的强悍火力。既然大家都在为了让身后的平民能吃上一顿饱饭而搏命，就用不着隔着树林互相拿枪口瞄着对方。只要你们愿意把边境的通道打开，我们可以在莉兰迪亚筑起重炮掩体替你们分担阿德莱希那群怪物压力，甚至直接组建联合防务，一起把日子过下去。”"
 PAU.26.a: "“我们需要能并肩作战的伙伴。”"
 PAU.26.b: "“防线各自留个照应就好。”"

 PAU.27.t: "找蜥蜴总得先吃饱饭"
 PAU.27.d: "一艘悬挂着双色信号旗的小型汽艇在警戒水域外停下，艇上的扬声器直接向远征军的旗舰播放了一段清晰的明码录音：\n“圣杯王国的远征军指挥官阁下，日安。”\n“我是接管莉兰迪亚港口的春日小遥。我们对贵国的行事章程并不陌生，毕竟不久前你们海岛上的驻军同行才刚按照战时条例，收了我们好大一笔靠港物资，所以贵方的价目表我们心里有数。”\n录音那头传来一声笑声，接着是茶杯磕在桌面上的轻响：\n“听说诸位贵族军官千里迢迢开进亚马逊，是为了寻找失落遗迹，顺便扫荡沼泽里的大蜥蜴。我们对你们抓爬行动物的兴趣不作评价，但雨林里的恶性疟疾和无底泥潭，可不会因为各位穿着精良盔甲就手下留情。”\n“我们手里有足量的奎宁药品、砍刀和能修护航舰的干船坞。只要你们承认莉兰迪亚的河道管辖权，大家完全可以搭伙签个互助协议，由我们的巡防舰替你们守住下游退路；当然，如果诸位的枪口打算往我们的工厂挪……那这片复杂的水网可比大洋上的孤岛难走得多。"
 PAU.27.a: "“我们没必要在雨林里多树一个敌人。”"
 PAU.27.b: "“给舰炮装填穿甲弹，远征军从不向流民低头。”"

 PAU_zxd: "那就演到最后"
 PAU_zxd_desc: "当初在营地栅栏前面，我只是饿得头晕眼花，随口编了个特派员的名头想蹭碗菜汤喝。后来带着你们抢车、夺路、跨洋逃命，我也只想找个没人管的角落躲起来，能多喘一口气就算赚到。\n结果阿夏将防务交给我，雪伊让工会跟着我，晓枫甚至连撤退的借口都替我堵死了。你们这帮家伙明知道我是个连老家都回不去的逃亡者，却硬生生按着我的肩膀，让我坐在这间天天被麻烦事塞满的办公室里。\n我以前总觉得，只要脚底抹油跑得够快，厄运就追不上我。可直到今天我才明白，人越是一味逃跑，身边能站立的地方就越小。\n看看西边山口那些长着怪模样的东西吧，它们可听不懂什么叫公约，更不会给我们留第三次逃命的港口。既然你们这帮人非要将性命押在我这个满嘴谎话的家伙身上，既然我已经坐上了这个执政官的位置——\n那就谁也别想再往后退缩一步。\n传令兵，去拉响战斗警报。我以莉兰迪亚执政官的名义下令：各部队全线出击，碾碎阿德莱希！"

 PAU_sztytz: "我们谁也别想置身事外"
 PAU_sztytz_desc: "阿德莱希的怪胎虽然被打退了，但大洋对面的世界乱成了什么样，大家心里都有数。圣杯远征军的诸位，你们自称代表着海对面的民主与法治，可你们心里比谁都清楚——大洋对面的议会老爷们每次换届选举，削减的都是你们前线的弹药与津贴。你们离家几千海里，一旦海外局势恶化，没有哪张选票会渡海来救你们这些驻军和移民，你们早晚会被那套冷冰冰的法条变成异乡的弃卒；而南边的魔法少女们，你们到底打算一个人替这片土地挡多少次灾？世人将你们奉为奇迹的化身，转头又畏惧你们的力量，让几个十几岁的姑娘在泥水里流血拼命，这算哪门子的理所当然啊？！你们需要真正的学校、能造装甲的工厂，以及替你们分担枪炮的同伴，而不是无休止地透支下去直到崩溃；至于那些躲在市镇里紧闭大门看戏的势力，你们真以为外面乱套了，自家的木头栅栏能顶得住什么？\n我不是在跟你们讲什么崇高的大道理，更不是想给谁当说教的老师。我只是想告诉各位：大洋对面的旧秩序已经沉底了，这片大陆就是最后能落脚的甲板。\n圣杯出造船技术与海军编制，公社出钢铁、车床和弹药，魔法少女得到正规的后勤与医疗保障，我们把防线与资源彻底合并，建一个谁也啃不动的联合政体。这叫按股入伙，大家一起保住吃饭睡觉的权利。\n至于那些到现在还打着各自私心、企图置身事外的家伙，我的规矩也很简单——既然要搭伙过日子，我就不能留着几个随时会引爆防线的隐患。要么带着你们的物资坐下来签字，要么，莉兰迪亚的装甲连队就直接开进你们的公署，替你们把字签了。"



