PAU_lhs_integration_desc:0 "当前整编进度：[?ROOT.PAU_lhs_integration|0]"
PAU_grail_camp_desc:0 "当前流亡营口粮：[?ROOT.PAU_grail_rations|0] 当前圣杯零件：[?ROOT.PAU_grail_parts|0]"
PAU_safe_harbor_desc:0 "已指定避风港数量：[?ROOT.PAU_harbor_count|0]　避风港发展度：[?ROOT.PAU_harbor_dev|0]\n先通过“指定避风港”选择沿海州，再执行接收流亡舰队、修复船坞、开通固定航线或扩建避风港；这些决议每 30 天可执行一次。"
PAU_undead_containment_desc:0 "当前亡灵压迫：[?ROOT.PAU_undead_pressure|0]（归零后死气惩罚会被暂时压制）"
PAU_late_doctrine:0 "战后路线"
PAU_late_doctrine_desc:0 "当前革命输出成果：[?ROOT.PAU_export_successes|0] 当前贸易伙伴：[?ROOT.PAU_trade_partners|0] 当前岸防建设：[?ROOT.PAU_coastal_defenses|0]\n根据战后路线解锁对应的外交与国防机制。"
PAU_export_revolution:0 "向 [FROM.GetName] 提供革命军械"
PAU_export_revolution_desc:0 "军械船已经装满，但收不收得看对方。援助只面向未与同盟结盟、不是主要强国、且不是法西斯或中立政权的战争中国家。"
PAU_peace_trade_mission:0 "向 [FROM.GetName] 派出和平贸易使团"
PAU_peace_trade_mission_desc:0 "把商船和工程师派出去，谈不谈得成得看对方港口的意思。和平不是把枪收起来就完了，还得让两边都有饭吃。"
PAU_coastal_fortification:0 "加固 [FROM.GetName] 海岸防线"
PAU_coastal_fortification_desc:0 "在选定的沿海州修建海岸炮台和掩体。谁想从海上闯进同盟的水域，就得先问问岸防工事答不答应。"
PAU_peace_trade_boom:0 "和平贸易繁荣"
PAU_peace_trade_boom_desc:0 "商船航线重新繁忙起来，港口有货可卸，工厂有单可做。"

####外交回应与战后路线事件####
PAU.480.t: "对岸的回信"
PAU.480.d: "码头上的信使跑得满头大汗。对岸的回信陆续送到，有的盖着鲜红的公章，有的只是几行潦草的字。同意与我们接触的政权有 [?ROOT.PAU_china_agreements|0] 个，明确拒绝的有 [?ROOT.PAU_china_refusals|0] 个。白夜同盟没有逼谁站队，只是把信一封封收好，等着看谁愿意把门打开。"
PAU.480.a: "把药品和机器送过去"
PAU.480.b: "先只保持通信"
PAU.490.t: "北美的答复"
PAU.490.d: "北美的电报一封接一封送到桌上。有人愿意谈航线，有人只肯派个低级别的武官来探口风。愿意与我们达成谅解的有 [?ROOT.PAU_north_america_agreements|0] 个，明确拒绝的有 [?ROOT.PAU_north_america_refusals|0] 个。隔着大洋，谁都不想先低头，但港口的灯已经亮起来了。"
PAU.490.a: "公开签署互不侵犯协议"
PAU.490.b: "低调处理"
PAU.500.t: "圣杯的回信"
PAU.500.d: "圣杯议会的信使在港口等了很久。他们带来的不是舰队，而是一份写满了条款的贸易与停火草案。阿夏把草案翻到最后一页，没有签字，只问了一句：你们真的打算把炮口从这片海上挪开？"
PAU.500.a: "把贸易协议签下去"
PAU.500.b: "把舰队调到外海"
PAU.500.c: "先观望一阵"
PAU.510.t: "莫斯科的回电"
PAU.510.d: "莫斯科的回电只有短短几行。有的同志愿意和我们交换地图和操典，有的则只回了一句冷冷的“注意立场”。白夜同盟不打算给谁当附庸，但也不会把愿意伸手的人推开。"
PAU.510.a: "互派军事观察员"
PAU.510.b: "保持距离"
PAU.520.t: "港外的军械船"
PAU.520.d: "白夜同盟的军械船在[ROOT.GetName]港外下锚。甲板上堆着盖了雨布的步枪和弹药箱，电台里反复播着同一句话：这些枪不问你信什么，只问你愿不愿意接着打下去。"
PAU.520.a: "收下这批军械"
PAU.520.b: "我们不能收流亡者的东西"
PAU.530.t: "和平买卖"
PAU.530.d: "白夜同盟的贸易使团在[ROOT.GetName]的码头卸下了图纸、订单和一份长期供货协议。为首的工程师说，他们不要求港口挂谁的旗，只想把货运出去。"
PAU.530.a: "签下这份协议"
PAU.530.b: "我们不做这笔买卖"
PAU.540.t: "有本事就放马过来"
PAU.540.d: "海图铺满了整张桌子。谁想从海上进来，先问问岸防炮答不答应。舰队和岸防部队都等着同盟给一个明确的布置。"
PAU.540.a: "全线布防"
PAU.540.b: "重点守备"
PAU_goodwill_asia:0 "对岸的善意"
PAU_goodwill_asia_desc:0 "送过去的药品和机器没有白费，对岸的港口开始愿意和我们谈长期合作。"
PAU_pacific_detente:0 "太平洋缓和的空气"
PAU_pacific_detente_desc:0 "北美的商船愿意多停一站，航线上的火药味淡了一些。"
PAU_soviet_military_mission:0 "北方的军事观察团"
PAU_soviet_military_mission_desc:0 "两边的参谋开始交换地图和操典，训练场上多了几张陌生面孔。"
PAU_fortress_neutrality_engine:0 "要塞中立"
PAU_fortress_neutrality_engine_desc:0 "海岸炮台、舰队和岸防部队被编进同一套防御计划，任何想从海上闯进来的舰队都得先掂量代价。"
PAU_revolution_network:0 "革命联络网"
PAU_revolution_network_desc:0 "海外的同志开始把白夜同盟当成自己的补给站，愿意拿枪的人越来越多，同盟在各条战线上的声音也越来越硬。"
PAU_revolution_network_2:0 "革命联络网·战例回流"
PAU_revolution_network_2_desc:0 "从海外战场传回来的战例被写进操典，突击和突破不再只靠一股狠劲。"
PAU_trade_network:0 "和平贸易网"
PAU_trade_network_desc:0 "外面的货进来了，黑市没那么好做，合作伙伴也愿意多给一点面子。"
PAU_trade_network_2:0 "和平贸易网·订单潮"
PAU_trade_network_2_desc:0 "订单排到明年，工厂只能扩产；港口和铁路把原料送到了内陆，油料也不再靠抢。"
PAU_coastal_network:0 "岸防协同网"
PAU_coastal_network_desc:0 "岸防炮和舰队开始互相报点，滩头后面的部队也不用再担心身后。"
PAU_coastal_network_2:0 "岸防协同网·铁岸线"
PAU_coastal_network_2_desc:0 "敌人连哪片沙滩能上岸都摸不清，守土部队知道退无可退，岸防、港口和舰队终于用上同一张海图。"
PAU_revolutionary_supplies:0 "革命军械补给"
PAU_revolutionary_supplies_desc:0 "新到的军械让手里的枪终于够用，有了稳定补给，队伍不会再打一半就散。"
PAU_trade_partner_boost:0 "贸易伙伴的订单"
PAU_trade_partner_boost_desc:0 "新的订单让工坊重新排班，港口的货架摆满以后，大家不用再凭票抢东西。"
PAU_revolution_network_3:0 "革命联络网·国际纵队"
PAU_revolution_network_3_desc:0 "多国战线的老兵把最脏的打法带回训练场，海外的突击经验直接改写操典，革命国际的联络让同盟说话更有分量。"
PAU_trade_network_3:0 "和平贸易网·大陆市场"
PAU_trade_network_3_desc:0 "订单排到后年，工厂只能三班倒；各国送来的图纸堆满研究所，合作伙伴多了，货架上的东西也多了。"
PAU_coastal_network_3:0 "岸防协同网·不落岸线"
PAU_coastal_network_3_desc:0 "岸防炮和舰队已经能覆盖整条海岸线，滩头阵地连成一片，敌军参谋图上已经没有安全的登陆点。"
PAU_revolutionary_supplies_2:0 "革命重装备援助"
PAU_revolutionary_supplies_2_desc:0 "重武器和整训教官一起到港，前线终于能硬碰硬；白夜同盟的参谋直接参与制订作战计划。"
PAU_trade_partner_boost_2:0 "长期贸易协定"
PAU_trade_partner_boost_2_desc:0 "长期订单让工厂敢开新线，港口货架堆满，合作方把最新图纸也一起带来了。"
PAU_revolutionary_international:0 "革命国际"
PAU_peace_bloc:0 "和平集团"
PAU_revolutionary_ultimatum:0 "向 [FROM.GetName] 发出革命最后通牒"
PAU_revolutionary_ultimatum_desc:0 "只对拒绝过白夜同盟革命军援、且仍与同盟为敌的非共产主义政权发动最后清算。同盟不会向共产主义国家宣战，也不会把魔导国、魔法帝国等特殊国家列入清算名单。"
PAU_peaceful_alliance:0 "邀请 [FROM.GetName] 加入和平联盟"
PAU_peaceful_alliance_desc:0 "只邀请已经签署过和平贸易协定、对同盟有好感、非法西斯、且不是大国的国家加入现有阵营，并给它们的边界提供担保。"
PAU_peace_enforcement:0 "强制 [FROM.GetName] 停战"
PAU_peace_enforcement_desc:0 "把正在交战的双方同时按到谈判桌上：这场战争已经流够了血。"
PAU_neutrality_guarantee:0 "向 [FROM.GetName] 提供中立担保"
PAU_neutrality_guarantee_desc:0 "只向没有加入其他阵营、对同盟至少不反感的中立国家提供安全担保，换取它们承认同盟的中立水域。"
PAU_neutrality_ultimatum:0 "向 [FROM.GetName] 发出中立最后通牒"
PAU_neutrality_ultimatum_desc:0 "对威胁同盟水域的政权发出最后警告：要么后退，要么开战。"
PAU_revolutionary_alliance:0 "邀请 [FROM.GetName] 加入革命国际"
PAU_revolutionary_alliance_desc:0 "只邀请已经接受过白夜同盟革命军援、对同盟有足够好感、且不是大国或现有阵营成员的国家加入我们的阵营。"
PAU_restitution_goodwill:0 "归还物资的善意"
PAU_restitution_goodwill_desc:0 "还回去的东西替同盟说了不少好话，各国港口开始愿意和这支讲规矩的军队做生意，归还设备时换回来的图纸和样品也让研究所多了些参考。"
PAU_restitution_received:0 "被归还的工业设备"
PAU_restitution_received_desc:0 "被抢走的机器重新装回了车间，物资回笼后市面上的东西多了起来，跟着设备一起回来的还有当年的技术资料。"
PAU_nightingale_legacy:0 "夜莺的遗产"
PAU_nightingale_legacy_desc:0 "夜莺的葬礼让军团第一次真正站到了一起，参谋们不再把时间花在互相提防上，而是重新铺开同一张地图。"
PAU_contract_network:0 "雇佣合约网"
PAU_contract_network_desc:0 "定金让各方都愿意先坐下来谈，合约渠道带来的燃料份额和预付款换来的机器原料，让军团的手头宽裕了一些。"
PAU_undead_readiness:0 "亡灵战争准备"
PAU_undead_readiness_desc:0 "各连开始按亡灵战争重新编组，阵地和撤退路线提前画好，知道怎么躲开死气以后，非战斗减员少了一截。"
PAU_reconstruction_mobilized:0 "重建总动员"
PAU_reconstruction_mobilized_desc:0 "重建委员会把工坊重新排进同一张工单，军工厂也分到了复产的第一批原料，民用配给重新运转起来。"
PAU_civil_reconstruction:0 "民生重建"
PAU_civil_reconstruction_desc:0 "食堂和市集重新开门，学校复课以后研究所多了帮手，市民重新相信明天会更好。"
PAU_administration_reform:0 "行政改革"
PAU_administration_reform_desc:0 "公文和命令终于不用绕三圈：政治点 +10%，消费品需求 -5%，研究速度 +5%。"
PAU_schools_opened:0 "学校复课"
PAU_schools_opened_desc:0 "教室重新坐满了孩子和夜校工人，识字的人多了，政令也更好传达。"
PAU_pursuit_authorized:0 "追击授权"
PAU_pursuit_authorized_desc:0 "追击命令下达后，部队不再缩在阵地上，参谋部开始按追击方案重新排兵，连队也知道追到哪里、什么时候收拢。"
PAU_received_revolutionary_aid:0 "接受过白夜同盟的革命援助"
PAU_refused_revolutionary_aid:0 "拒绝过白夜同盟的革命援助"
PAU_received_trade_mission:0 "接受过白夜同盟的贸易使团"
PAU_refused_trade_mission:0 "拒绝过白夜同盟的贸易使团"
PAU_coastal_fortified:0 "已构筑岸防工事"
PAU_Debug:0 "调试工具"
PAU_road_to_harbor:0 "通往海港的补给线"
PAU_road_to_harbor_desc:0 "沿海公路把燃油、粮食和零件重新送进营地，车队终于不用空着油箱等死。"
PAU_full_tanks:0 "满油满员"
PAU_full_tanks_desc:0 "每一辆车都灌满了油，每一个还能扛枪的人都吃饱了饭，军团重新有了出发的底气。"
PAU_formal_government:0 "正式政府"
PAU_formal_government_desc:0 "临时救济摊子变成了正式政府，政令有了出处，配给和税收也重新上了轨道。"
PAU_unified_currency:0 "统一货币"
PAU_unified_currency_desc:0 "同盟的新券开始流通，粮食、燃油和工资终于有了统一的结算方式。"
PAU_rule_of_law:0 "公开法庭"
PAU_rule_of_law_desc:0 "旧账被摆到日光下审理，私刑和寻仇不再是一个人说了算。"
PAU_shipyard_mobilization:0 "船厂总动员"
PAU_shipyard_mobilization_desc:0 "民间泊位、钢板库房和吊机全部转入战时改装，船厂和舰队开始共用一张布防图。"
PAU_south_america_unity:0 "南美联合呼声"
PAU_south_america_unity_desc:0 "拒绝承认同盟的港口一个个改了口，南美大陆开始把白夜同盟当成可以谈判的邻居。"
PAU_sakura_administration:0 "樱花行政重建"
PAU_sakura_administration_desc:0 "旧军官被清理后，留下的工程师和技术工人重新撑起了岛上的行政与研究工作。"
PAU_tram_restored:0 "电车重新通车"
PAU_tram_restored_desc:0 "电车铃铛重新响彻街道，工厂和城市的供应线恢复了日常节奏。"
PAU_homeland_network:0 "本土地下网络"
PAU_homeland_network_desc:0 "潜伏在本土的旧友接上了同盟的通讯频段，要塞布防和巡逻盲区顺着暗号送回了参谋部。"
PAU_revolution_network_route_tt:0 "革命网络已建立。当前阶段由革命输出成果决定，达到 3、5 时自动升级到第二、第三阶段，同一时间只会生效一个阶段。"
PAU_revolution_network_route_tt_desc:0 "革命网络第一阶段已经建立。革命输出成果达到 3、5 时，网络会自动升级到第二、第三阶段。"
PAU_trade_network_route_tt:0 "贸易网络已建立。当前阶段由贸易伙伴数量决定，达到 3、5 时自动升级到第二、第三阶段，同一时间只会生效一个阶段。"
PAU_trade_network_route_tt_desc:0 "贸易网络第一阶段已经建立。贸易伙伴达到 3、5 时，网络会自动升级到第二、第三阶段。"
PAU_coastal_network_route_tt:0 "岸防网络已建立。当前阶段由岸防建设进度决定，达到 3、5 时自动升级到第二、第三阶段，同一时间只会生效一个阶段。"
PAU_coastal_network_route_tt_desc:0 "岸防网络第一阶段已经建立。岸防建设达到 3、5 时，网络会自动升级到第二、第三阶段。"
PAU_mil_reform_tier1_unlock_tt:0 "军事改革第一阶段：全军组织 +5%，计划速度 +5%。"
PAU_mil_reform_tier1_unlock_tt_desc:0 "军事改革第一阶段：全军组织 +5%，计划速度 +5%。"
PAU_mil_reform_tier2_unlock_tt:0 "军事改革第二阶段：陆军攻击 +5%，突破 +5%。"
PAU_mil_reform_tier2_unlock_tt_desc:0 "军事改革第二阶段：陆军攻击 +5%，突破 +5%。"
PAU_mil_reform_tier3_unlock_tt:0 "军事改革第三阶段：协同 +5%，主动性 +5%。"
PAU_mil_reform_tier3_unlock_tt_desc:0 "军事改革第三阶段：协同 +5%，主动性 +5%。"
PAU_eco_reform_tier1_unlock_tt:0 "经济改革第一阶段：工业与军工厂建造速度 +5%。"
PAU_eco_reform_tier1_unlock_tt_desc:0 "经济改革第一阶段：工业与军工厂建造速度 +5%。"
PAU_eco_reform_tier2_unlock_tt:0 "经济改革第二阶段：工厂与船坞产能 +5%。"
PAU_eco_reform_tier2_unlock_tt_desc:0 "经济改革第二阶段：工厂与船坞产能 +5%。"
PAU_eco_reform_tier3_unlock_tt:0 "经济改革第三阶段：民用消费品 -5%，政治点 +5%。"
PAU_eco_reform_tier3_unlock_tt_desc:0 "经济改革第三阶段：民用消费品 -5%，政治点 +5%。"
PAU_auto_construction_desc:0 "已规划基础设施：[?ROOT.PAU_auto_infra_count|0] 处\n手动规划消耗 10 政治点；自动规划开启后立即尝试修建一处，之后约每 60 天自动修建一处。"
PAU_baiye_patrol_count_tt:0 "已让白夜溜达过的受控州数量：$RIGHT|=+0$"
PAU_baiye_patrol_count_tt_desc:0 "已让白夜溜达过的受控州数量：$RIGHT|=+0$"
PAU_auto_infra_count_tt:0 "已规划基础设施：$RIGHT|=+0$"
PAU_auto_infra_count_tt_desc:0 "自动规划累计修建的基础设施：$RIGHT|=+0$"
PAU_baiye_patrol_once:0 "再放白夜出去溜达一圈"
PAU_baiye_patrol_once_desc:0 "花费 5 政治点，随机选择一处尚未溜达过的受控州，让白夜立即完成一次溜达，并增加溜达州数。"
PAU_baiye_auto_wait_tt:0 "已开启自动溜达：当前政治点不足 5 或没有可溜达的受控州；满足条件后每月自动执行。"
PAU_baiye_auto_wait_tt_desc:0 "已开启自动溜达：当前政治点不足 5 或没有可溜达的受控州；满足条件后每月自动执行。"
PAU_auto_infrastructure_wait_tt:0 "已开启自动规划：当前没有可用的受控州或仍在冷却中；条件满足后约每 60 天自动修建一处。"
PAU_auto_infrastructure_wait_tt_desc:0 "已开启自动规划：当前没有可用的受控州；条件满足后会约每 60 天自动修建一处。"
PAU_manual_infrastructure:0 "手动规划一处基础设施"
PAU_manual_infrastructure_desc:0 "花费 10 政治点，立即为一处受控州排入 1 级基础设施建造队列，并增加已规划基础设施数量。"
PAU_white_night_alliance:0 "白夜同盟"
PAU_national_unification:0 "统一与核心区"
PAU_national_unification_desc:0 "当前南美联合成员：[?ROOT.PAU_south_america_members|0]\n南美统一与樱花核心的后续处理：所有南美国家进入白夜同盟阵营后，可以宣告南美统一；控制樱花全部核心领土后，可以宣告樱花统一。也可以先向樱花索要核心领土。\n联合参谋学院与联合国务委员会等长期合作机制，请见“联合机构”决议大类。"
PAU_south_america_super_event:0 "宣告南美统一"
PAU_south_america_super_event_desc:0 "所有南美国家都已加入白夜同盟阵营后，才能宣告南美统一。点击后触发南美统一超事件，所有南美成员国获得“南美联合成员”国家精神，并解锁联合机构决议。"
PAU_sakura_super_event:0 "宣告樱花统一"
PAU_sakura_super_event_desc:0 "白夜同盟已控制樱花全部核心领土。点击后触发樱花统一超事件。"
PAU_demand_sakura_cores:0 "索要樱花核心领土"
PAU_demand_sakura_cores_desc:0 "樱花帝国倒下后，其核心领土若落在其他国家手里，就向这些实际控制者逐一发出最后通牒；社会主义国家在事件中会倾向交还，拒绝者将迎来战争。"
PAU_demand_sakura_cores_effect_tt:0 "向所有控制樱花核心领土的国家逐一发出领土要求。"
PAU.550.t:0 "来自白夜同盟的领土要求"
PAU.550.d:0 "白夜同盟的使者把一份用钢板压平的要求书送到了对方政府的桌上。\n“樱花帝国已经倒下了，但它留下的核心领土不该继续被不相干的人拿来当筹码。”使者把一枚白夜同盟的印章按在文件末尾，“你们可以签字把这些土地交还给白夜同盟，也可以让我们用别的方式把字刻上去。”\n桌上的钟摆滴答作响，港口外的舰队已经列阵完毕。对方政府必须在天亮前给出答复。"
PAU.550.a:0 "交出核心领土，中止无谓的流血。"
PAU.550.b:0 "拒绝签字，准备迎接战争。"
PAU_south_america_union_member:0 "南美联合成员"
PAU_south_america_union_member_desc:0 "白夜同盟把南美各地从军阀、殖民公司和旧政权的债务中解放出来。作为联合成员，市场、工厂和港口在同盟框架下重新运转，民生与工业都得到了保障。"
PAU_south_america_leader:0 "南美联合体"
PAU_south_america_leader_desc:0 "白夜同盟成为南美联合体的核心。各地资源、铁路和港口被纳入统一调度，同盟本部的工业、科研与兵员动员都得到了加强。"
PAU_south_america_joint_logistics:0 "举行联合参谋学院课程会议"
PAU_south_america_joint_logistics_desc:0 "每 90 天可召开一次联合参谋学院课程会议，由白夜同盟选择本期重点课程：装甲、步兵或联合作战。重点课程会同时提升白夜同盟与所有南美成员的陆军学说每日精通获取，并让白夜同盟获得一批该课程的精通点数与学院积分。"
PAU_joint_industry:0 "南美工业协作"
PAU_joint_industry_desc:0 "白夜同盟与南美成员共享工厂订单、铁路运力和技术图纸，同盟本部的工业与研究效率得到提升。"
PAU_joint_industry_member:0 "南美工业协作（成员）"
PAU_joint_industry_member_desc:0 "作为南美联合成员，工厂和港口接到了来自同盟本部的订单，产能与民用供应都得到改善。"
PAU_joint_drill:0 "南美联合军演"
PAU_joint_drill_desc:0 "各成员把最熟悉本地战场的部队派来参加联合演习，同盟本部的组织、计划与突破能力得到提升。"
PAU_joint_drill_member:0 "南美联合军演（成员）"
PAU_joint_drill_member_desc:0 "同盟本部派来的教官与参谋帮助成员整训部队，部队的组织与计划能力得到提升。"
PAU_joint_resources:0 "南美资源统筹"
PAU_joint_resources_desc:0 "南美各地的燃油、粮食和原料被纳入统一调度，同盟本部的燃油收益与工业产能得到提升。"
PAU_joint_resources_member:0 "南美资源统筹（成员）"
PAU_joint_resources_member_desc:0 "同盟本部为成员调拨原料与民用物资，工厂产能与市面供应都得到改善。"
PAU.560.t:0 "联合参谋学院课程会议"
PAU.560.d:0 "联合参谋学院的讲堂里坐满了来自南美各地的军官。黑板上并排写着三套课程大纲：装甲突击、步兵战术、联合作战。小遥把教鞭放在桌上：“这一期重点讲什么，不是看谁嗓门大，是看我们接下来最需要什么。”\n白夜同盟将决定本期重点课程，所有成员国都会派出学员参加；课程结束后，同盟本部和各国参谋都能把新的战法带回部队。"
PAU.560.a:0 "装甲课程：研究装甲突击与合成兵种协同。"
PAU.560.b:0 "步兵课程：研究步兵战术、工事与阵地攻防。"
PAU.560.c:0 "联合作战课程：研究后勤、侦察与多兵种协同。"
PAU_south_america_development_fund:0 "召开联合学说研讨会"
PAU_south_america_development_fund_desc:0 "消耗 3 点联合参谋学院积分召开学说研讨会。与会代表将集中讨论装甲、步兵或联合作战中的一个方向，白夜同盟会获得大量该方向的每日精通、一批即时精通点数，以及 120 天的对应精通获取加成。"
PAU_south_america_defense_council:0 "向成员派遣军官进修班"
PAU_south_america_defense_council_desc:0 "每 90 天可向阵营内所有南美成员派遣军官进修班。每个成员会选择装甲、步兵或联合作战方向，获得 180 天的对应学说精通获取加成；白夜同盟则获得该方向的精通点数、课程毕业人数与学院积分。三类课程毕业人数达到 1/2/3 时，联合参谋学院会升级。"
PAU_south_america_defense_council_effect_tt:0 "向所有南美成员派遣军官进修班。成员自选进修方向并获得 180 天对应精通获取加成；白夜同盟获得该方向精通点数、课程毕业人数和学院积分。"
PAU_south_america_development_tier1:0 "南美发展基金·起步"
PAU_south_america_development_tier1_desc:0 "基金开始运转后，同盟本部的工厂产能与民用供应得到改善。工业产能 +5%，民用消费品 -5%。"
PAU_south_america_development_tier2:0 "南美发展基金·成网"
PAU_south_america_development_tier2_desc:0 "铁路、港口与工厂逐渐连成网络。工业产能 +5%，工厂建造速度 +5%，研究 +5%，政治点 +5%，民用消费品 -5%。"
PAU_south_america_development_tier3:0 "南美发展基金·共同体"
PAU_south_america_development_tier3_desc:0 "南美联合体已经形成完整的工业与人力循环。工业产能 +10%，工厂建造速度 +5%，研究 +5%，政治点 +5%，征兵 +5%，燃料获取 +5%，民用消费品 -10%。"
PAU_development_industry:0 "工业基金投入"
PAU_development_industry_desc:0 "资金和订单被送进工厂与车间，同盟本部的产能、建造速度与研究效率得到提升。"
PAU_development_industry_member:0 "工业基金投入（成员）"
PAU_development_industry_member_desc:0 "来自共同基金的订单让南美成员的工厂重新排班，产能与民用供应得到改善。"
PAU_development_education:0 "教育基金投入"
PAU_development_education_desc:0 "学校、夜校和技术培训班重新开课，同盟本部的科研与政治效率得到提升。"
PAU_development_education_member:0 "教育基金投入（成员）"
PAU_development_education_member_desc:0 "南美成员的公费学校和技术培训重新运转，科研与行政效率得到提升。"
PAU_development_infrastructure:0 "基础设施基金投入"
