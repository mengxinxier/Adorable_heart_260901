####系统修正####
PAU_camp_crisis: "营房亏空"
PAU_camp_crisis_desc: "欠条、空锅和拖到明天的军饷一起压在营地上。人还在，但心思已经不在操练上了。"
PAU_camp_stable: "营房缓过气来"
PAU_camp_stable_desc: "账本终于不再天天催命，食堂也能按时开火。至少今晚，没人需要拿旧靴子去换面粉。"
PAU_lhs_remnants: "野火旧部"
PAU_lhs_remnants_desc: "旧部被吞并了，交情却没被吞并。命令传下去的时候，总有人先看老连长的脸色。"
PAU_lhs_integrated: "野火归队"
PAU_lhs_integrated_desc: "旧部和军团终于能按同一张图、同一套信号行动。以前分彼此，现在只能一起活。"
PAU_grail_refuge: "圣杯流亡营"
PAU_grail_refuge_desc: "军团在圣杯的地块上搭起了流亡营。口粮要分着吃，船要修，人也要找地方睡。"
PAU_undead_pressure: "亡灵压迫"
PAU_undead_pressure_desc: "死气一路追着部队跑，夜里没人敢把枪放下。亡灵不休息，人也只能咬牙顶着。"
PAU_barrow_legacy: "巴罗的连队"
PAU_barrow_legacy_desc: "二连长巴罗把位置留给了后面的人。老兵们不提他的名字，只是再没人愿意把谁丢在阵地上。"
PAU_grail_camp_state: "圣杯流亡营地"
PAU_grail_camp_state_desc: "码头旁挤满了流亡者，补给紧张，但能修船，也能守。"
PAU_grail_camp_network:0 "圣杯码头网络"
PAU_grail_camp_network_desc:0 "圣杯流亡营的码头重新接纳伤船和补给船，海军恢复能力得到提升。"
PAU_undead_tide: "亡灵潮汐"
PAU_undead_tide_desc: "死气漫过的地方，补给腐烂，敌军也会在阴影里慢慢掉队。"
PAU_safe_harbor_state: "莉兰迪亚避风港"
PAU_safe_harbor_state_desc: "避风港能收容伤船和流亡者；当地建筑位 +10%，本地工厂 +5%，敌军在港区损耗 +5%。海军的恢复与反登陆加成由“避风港网络”提供。"
####主系统决议####
PAU_lhs_integration: "野火旧部整编"
PAU_lhs_keep_cadres: "保留旧部连队编制"
PAU_lhs_keep_cadres_desc: "让野火旧部继续用自己的连长、自己的暗号。战斗力能留下，但派系也会留下。"
PAU_lhs_keep_cadres_tt: "降低一部分整合进度，保留陆军学说精通。"
PAU_lhs_dissolve: "打散编入军团"
PAU_lhs_dissolve_desc: "把旧部拆开补进各连，不让任何一支队伍继续只认自己的老长官。"
PAU_lhs_dissolve_tt: "提高整合进度，补充 500 人力。"
PAU_lhs_joint_drill: "举行联合演练"
PAU_lhs_joint_drill_desc: "让军团和旧部在同一张地图上跑一遍攻防。谁先开枪、谁后撤，都得提前说清楚。"
PAU_lhs_joint_drill_tt: "提高整合进度，获得陆军学说精通。"
PAU_lhs_finish: "野火归队"
PAU_lhs_finish_desc: "野火游击队正式编入军团：解锁游击队兵种，并获得“野火游击战”与“游击战争”两条学说的使用权。旧部和军团终于能按同一套信号行动。"
PAU_lhs_finish_tt: "结束旧部混编状态，获得整合修正。"
PAU_grail_camp: "圣杯流亡营"
PAU_grail_split_rations: "把口粮分成三份"
PAU_grail_split_rations_desc: "先给伤员，再给孩子，最后才轮到拿枪的人。营地里没人反对，但锅底很快就能看见。"
PAU_grail_split_rations_tt: "消耗口粮储备，补充 500 人力。"
PAU_grail_trade_arms: "用军械换淡水"
PAU_grail_trade_arms_desc: "圣杯只认现货。几箱步枪和弹药换来的淡水，够流亡营地撑过下一段航程。"
PAU_grail_trade_arms_tt: "消耗 500 步兵装备，换回圣杯零件和补给。"
PAU_grail_repair_ships: "替圣杯修船"
PAU_grail_repair_ships_desc: "船坞里的工人比军团还缺零件。把船修好，至少下一次出海不会半路漏水。"
PAU_grail_repair_ships_tt: "消耗圣杯零件，获得海军经验。"
PAU_safe_harbor: "莉兰迪亚避风港"
PAU_designate_safe_harbor: "指定 [FROM.GetName] 为避风港"
PAU_designate_safe_harbor_desc: "把一处沿海州划成避风港。伤船、流亡舰队和没地方去的百姓都能在这里靠岸。"
PAU_designate_safe_harbor_tt: "指定一个受控沿海州为避风港，最多三个。"
PAU_safe_harbor_refugees: "接收流亡舰队"
PAU_safe_harbor_refugees_desc: "码头先别问来路，先让船上的人下来。多一张嘴，也多一双手。"
PAU_safe_harbor_refugees_tt: "获得 500 人力。"
PAU_safe_harbor_repair: "修复船坞"
PAU_safe_harbor_repair_desc: "把能用的钢板、缆绳和抽水机先凑到船坞里。伤船早一天出海，航线就早一天稳。"
PAU_safe_harbor_repair_tt: "获得海军经验。"
PAU_safe_harbor_lane: "开通固定航线"
PAU_safe_harbor_lane_desc: "把燃料、泊位和船期重新对齐。港口不是为了摆好看，是为了让货真能跑起来。"
PAU_safe_harbor_lane_tt: "获得 500 燃料。"
PAU_undead_containment: "亡灵清剿与撤离"
PAU_undead_evacuate: "先把活人撤出来"
PAU_undead_evacuate_desc: "阵线可以再修，人没了就真没了。先把平民和伤员往后方送。"
PAU_undead_evacuate_tt: "获得 500 人力，降低亡灵压迫。"
PAU_undead_counterattack: "组织反冲击"
PAU_undead_counterattack_desc: "亡灵怕的不是枪声，是活人重新压上去的那口气。"
PAU_undead_counterattack_tt: "获得陆军学说精通，降低亡灵压迫。"
PAU_undead_burn_depot: "烧掉带不走的油库"
PAU_undead_burn_depot_desc: "把燃料留给亡灵，它们不会感激。不如一把火点了，至少别让它们开着我们的车追我们。"
PAU_undead_burn_depot_tt: "消耗 500 燃料，降低亡灵压迫。"
PAU_barrow_memorial: "巴罗纪念"
PAU_barrow_memorial_farm: "把勋章送去玉米地"
PAU_barrow_memorial_farm_desc: "巴罗没来得及种完的地，总得有人替他收完。遗物和抚恤都要亲手交到遗孤手里。"
PAU_barrow_memorial_farm_tt: "增加营房储备，获得 500 人力。"
PAU_barrow_memorial_veterans: "让老兵带新兵"
PAU_barrow_memorial_veterans_desc: "二连的规矩不能跟着巴罗一起埋掉。让还活着的老兵接着教新人怎么把车开回来。"
PAU_barrow_memorial_veterans_tt: "获得陆军学说精通。"
PAU_axia_mil_tt:0 "£GFX_PAM_am 阿夏军事改革点：$RIGHT|=+0$"
PAU_xfxy_mil_tt:0 "£GFX_PAM_am 晓枫雪伊军事改革点：$RIGHT|=+0$"
PAU_xiaoyao_mil_tt:0 "£GFX_PAM_am 小遥军事改革点：$RIGHT|=+0$"
PAU_axia_mil_gain_tt:0 "阿夏把老兵们重新拉回训练场，军改点 +10，阿夏军事改革进度也跟着往前推了一格。"
PAU_xfxy_mil_gain_tt:0 "晓枫把地图摊平，雪伊把各队集合时间吼清楚，军改点 +10，晓枫雪伊军事改革进度往前推了一格。"
PAU_xiaoyao_mil_gain_tt:0 "小遥抱着白夜往甲板上一蹲，说船和人都得先知道下一站往哪儿开，军改点 +10。"
PAU_axia_recon:0 "先让会认路的人走在前面"
PAU_axia_recon_desc:0 "阿夏把几个老侦察兵从队列里拎出来：“你们几个，别装傻。山那边到底能不能走，今天就得给我说明白。”"
PAU_axia_recon_tt:0 "完成对应国策后解锁；消耗 10 点阿夏军事改革点，建立侦察网。"
PAU_axia_supply:0 "弹药按人头分，别再半路漏掉"
PAU_axia_supply_desc:0 "巴罗以前最烦看见弹药箱半路没影。阿夏把仓库、车队和连队都叫到一张桌上，手指头敲着桌面：“领了多少就写多少，别等我拿枪托帮你们回忆。”"
PAU_axia_supply_tt:0 "完成对应国策后解锁；消耗 10 点阿夏军事改革点，统一补给制度。"
PAU_axia_armor:0 "让还能发动的坦克先带徒弟"
PAU_axia_armor_desc:0 "旧坦克一动就冒黑烟。阿夏拍了拍炮塔：“丑是丑了点，可它认得路。会开的都上来，带不会开的。”"
PAU_axia_armor_tt:0 "完成对应国策后解锁；消耗 10 点阿夏军事改革点，恢复装甲教导连。"
PAU_axia_medics:0 "把担架队从后方拽回来"
PAU_axia_medics_desc:0 "伤员不能总躺在泥地里等。阿夏把缝纫厂、药箱和会包扎的人重新编进连队：“先救人，再谈别的。”"
PAU_axia_medics_tt:0 "完成对应国策后解锁；消耗 10 点阿夏军事改革点，重建野战医疗。"
PAU_xfxy_command:0 "把两套命令并到一块儿"
PAU_xfxy_command_desc:0 "雪伊叉着腰：“你的命令传到我这儿都拐了三个弯。”晓枫把地图往中间一推：“那就把弯都画直。”"
PAU_xfxy_command_tt:0 "完成对应国策后解锁；消耗 10 点晓枫雪伊军事改革点，建立联合指挥。"
PAU_xfxy_signal:0 "电台咳嗽，传令兵就得跑断腿"
PAU_xfxy_signal_desc:0 "电台那头咳了两声，然后就彻底没声了。雪伊把耳机往桌上一摔，骂骂咧咧地叫人去把传令兵都喊来。晓枫没抬头，只把铅笔往耳朵上一夹，嘟囔了一句：“行吧，那就先靠腿跑。”说完就蹲下去重新排路线。"
PAU_xfxy_signal_tt:0 "完成对应国策后解锁；消耗 10 点晓枫雪伊军事改革点，重建通信网。"
PAU_xfxy_joint_defense:0 "自己的门自己守，也要替邻居看一眼"
PAU_xfxy_joint_defense_desc:0 "雪伊不想把队伍交给别人指挥，晓枫也不想让地方各自为战。两人吵了半宿，最后定下一句：“自己营自己管，真打起来别站着看。”"
PAU_xfxy_joint_defense_tt:0 "完成对应国策后解锁；消耗 10 点晓枫雪伊军事改革点，建立共同防务。"
PAU_xiaoyao_navy:0 "先把船和码头排明白"
PAU_xiaoyao_navy_desc:0 "小遥蹲在码头边啃苹果：“船开出去容易，回不回得来才要命。舰队、港口、补给站，得先排好班。”"
PAU_xiaoyao_navy_tt:0 "完成对应国策后解锁；消耗 10 点小遥军事改革点，重建海军协作。"
PAU_xiaoyao_expedition:0 "别等潮水退了才想起来装船"
PAU_xiaoyao_expedition_desc:0 "远征的粮食、弹药和车辆堆了半码头。小遥拿笔在货单上戳了两下：“装船顺序错了，到了对岸就得抓瞎。”"
PAU_xiaoyao_expedition_tt:0 "完成对应国策后解锁；消耗 10 点小遥军事改革点，恢复远征准备。"
PAU_xiaoyao_landing:0 "抢滩之前先把滩头数清楚"
PAU_xiaoyao_landing_desc:0 "小遥把登陆图翻来覆去看了半天：“这地方能站几个人、能推几辆车，总不能靠猜吧？”"
PAU_xiaoyao_landing_tt:0 "完成对应国策后解锁；消耗 10 点小遥军事改革点，完善登陆计划。"
PAU_axia_eco_tt:0 "£GFX_PAM_am 阿夏经济改革点：$RIGHT|=+0$"
PAU_xfxy_eco_tt:0 "£GFX_PAM_am 晓枫雪伊经济改革点：$RIGHT|=+0$"
PAU_xiaoyao_eco_tt:0 "£GFX_PAM_am 小遥经济改革点：$RIGHT|=+0$"
PAU_axia_eco_gain_tt:0 "阿夏把账本和粮袋一起摊开，经济改革点 +10。她没说重话，但每个人都把领走的东西记清楚了。"
PAU_xfxy_eco_gain_tt:0 "晓枫把工坊的进出账对了一遍，经济改革点 +10。雪伊在旁边补了一句：谁再乱领料就自己去扛。"
PAU_xiaoyao_eco_gain_tt:0 "小遥把集市和配给站的门重新打开，经济改革点 +10。白夜趴在柜台上，眼睛一直盯着面包。"
PAU_axia_granary:0 "先清粮袋，再谈配给"
PAU_axia_granary_desc:0 "阿夏把账本往桌上一拍：“少一袋也算少。今天谁多领了，明天就少吃一口。”"
PAU_axia_granary_tt:0 "完成对应国策后解锁；消耗 10 点阿夏经济改革点，整顿粮仓。"
PAU_axia_workshop:0 "把还能用的机器先转起来"
PAU_axia_workshop_desc:0 "工坊里缺零件，阿夏让修车班先去拆旧车：“别嫌难看。能开工的机器，比摆在仓库里的新机器顶用。”"
PAU_axia_workshop_tt:0 "完成对应国策后解锁；消耗 10 点阿夏经济改革点，恢复工坊生产。"
PAU_axia_currency:0 "旧钞新币，总得有人认账"
PAU_axia_currency_desc:0 "阿夏盯着两张钞票看了半天，最后说：“先别管上面印谁，能把面包买回来才是钱。”"
PAU_axia_currency_tt:0 "完成对应国策后解锁；消耗 10 点阿夏经济改革点，统一货币兑换。"
PAU_axia_trade:0 "港口不是摆着好看的"
PAU_axia_trade_desc:0 "阿夏站在码头上看着空泊位：“船来了得能卸，油到了得能装。航线不通，前线就得饿肚子。”"
PAU_axia_trade_tt:0 "完成对应国策后解锁；消耗 10 点阿夏经济改革点，恢复港口航线。"
PAU_xfxy_wages:0 "先把欠人家的工钱补上"
PAU_xfxy_wages_desc:0 "雪伊把欠薪名单往桌上一拍：“人家来干活，不是来听我们讲大道理的。账上有多少就先发多少，剩下的写清楚什么时候补。”"
PAU_xfxy_wages_tt:0 "完成对应国策后解锁；消耗 10 点晓枫雪伊经济改革点，补发工资。"
PAU_xfxy_procurement:0 "采购得按合同，不是按心情"
PAU_xfxy_procurement_desc:0 "晓枫把采购单逐条划过去：“要什么、多少钱、什么时候到，先写清楚。别等炮弹到了才发现口径不对。”"
PAU_xfxy_procurement_tt:0 "完成对应国策后解锁；消耗 10 点晓枫雪伊经济改革点，整顿采购制度。"
PAU_xfxy_audit:0 "账目得经得起再算一遍"
PAU_xfxy_audit_desc:0 "雪伊把旧账本翻到最后一页：“这页缺了，那页改了。真打起仗来，敌人可不会替我们补账。”"
PAU_xfxy_audit_tt:0 "完成对应国策后解锁；消耗 10 点晓枫雪伊经济改革点，清查账目。"
PAU_xiaoyao_market:0 "集市得先开起来"
PAU_xiaoyao_market_desc:0 "小遥把摊子上的面包掰开看了看，小声嘀咕：“卖太贵了，大家吃不起；卖太便宜了，种麦子的人又得骂街……”她把面包塞回摊主手里，叹了口气：“这个价，得我们再算算。”"
PAU_xiaoyao_market_tt:0 "完成对应国策后解锁；消耗 10 点小遥经济改革点，恢复集市。"
PAU_xiaoyao_food:0 "面包要能领到，也要能咽下去"
PAU_xiaoyao_food_desc:0 "新到的远征面包硬得能垫桌腿。小遥咬了一口，差点崩牙：“这不是口粮，这是建材。重新订标准！”"
PAU_xiaoyao_food_tt:0 "完成对应国策后解锁；消耗 10 点小遥经济改革点，整顿口粮供应。"
PAU_xiaoyao_land:0 "地契拖着，庄稼等不起"
PAU_xiaoyao_land_desc:0 "农户站在地头不肯下种。小遥蹲在田埂上听完，拍了拍手上的土：“先让他们把种子埋下去。地是谁的，收成说了算。”"
PAU_xiaoyao_land_tt:0 "完成对应国策后解锁；消耗 10 点小遥经济改革点，处理土地与生产。"
PAU_debt_tt:0 "£GFX_PAM_am 王室欠饷（王都陷落后作废）：$RIGHT|=+0$"
PAU_camp_supply_tt:0 "£GFX_PAM_am 营房储备：$RIGHT|=+0$"
PAU_lhs_integration_tt:0 "£GFX_PAM_am 旧部整合：$RIGHT|=+0$"
PAU_grail_rations_tt:0 "£GFX_PAM_am 圣杯口粮：$RIGHT|=+0$"
PAU_grail_parts_tt:0 "£GFX_PAM_am 圣杯零件：$RIGHT|=+0$"
PAU_undead_pressure_tt:0 "£GFX_PAM_am 亡灵压迫：$RIGHT|=+0$"
PAU_harbor_count_tt:0 "£GFX_PAM_am 避风港数量：$RIGHT|=+0$"
PAU_lhs_absorb_tt:0 "野火旧部整编系统启动。"
PAU_start_undead_war_tt:0 "亡灵战争开始，死气会一路追着军团。"
PAU_arrive_grail_tt:0 "圣杯流亡营在 state 299 落脚。"
PAU_grail_robbed_tt:0 "圣杯拿走了军团一半口粮和补给。"
PAU_return_from_grail_tt:0 "军团调头回南美，圣杯流亡营状态结束。"
PAU_finish_undead_war_tt:0 "亡灵战争结束，南美进入重建。"
PAU_unlock_safe_harbor_tt:0 "莉兰迪亚避风港决议解锁。"
PAU_barrow_death_tt:0 "巴罗牺牲，二连的规矩留在前线。"
PAU_news_south_america_tt:0 "南美统一新闻将发布。"
PAU_news_sakura_tt:0 "樱花战败新闻将发布。"
PAU_bop_name:0 "谁来管管这个国家？"
PAU_bop_name_desc:0 "左侧强化游击队，右侧强化军团装甲；越靠近两端，对应路线的阶梯加成就越明显。完成相关决议可推动平衡偏移，联合会议则把平衡拉回中央。"
PAU_bop_workers_committee:0 "让工人委员会盯生产"
PAU_bop_workers_committee_desc:0 "游击队老兵把山地、丛林和巷战的经验摊在桌上，要求全军照着练。推动平衡向左，强化游击队路线。"
PAU_bop_workers_committee_tt:0 "每次执行消耗 25 政治点并推动平衡向游击队侧偏移 0.25，30 天后可再次执行；越靠左，游击队单位加成越强。首次执行会建立游击队训练体系常驻修正。"
PAU_bop_veterans_council:0 "让老兵委员会管军饷"
PAU_bop_veterans_council_desc:0 "巴罗的老部下把还能开动的坦克集中起来，要求按照装甲战的方式重新编组。推动平衡向右，强化军团装甲路线。"
PAU_bop_veterans_council_tt:0 "每次执行消耗 25 政治点并推动平衡向军团装甲侧偏移 0.25，30 天后可再次执行；越靠右，军团装甲加成越强。首次执行会建立装甲教导队常驻修正。"
PAU_bop_joint_meeting:0 "把两边拉回同一张桌子"
PAU_bop_joint_meeting_desc:0 "阿夏把两摞请愿书往桌子中间一推：“吵就吵，别掀桌子。今天谁要是没把话说完就走，晚上那份土豆我替他吃。”"
PAU_bop_joint_meeting_tt:0 "工人和老兵共同议事，获得联合议事常驻修正，并立即把权力平衡重置到中间。"
PAU_bop_workers_mod:0 "工人监督生产"
PAU_bop_workers_mod_desc:0 "野火旧部把山地、丛林和巷战经验整理成训练手册，游击队单位的防御、组织度和恢复能力提高。"
PAU_bop_veterans_mod:0 "老兵委员会"
PAU_bop_veterans_mod_desc:0 "老车长把还能开动的坦克重新编成教导队，装甲单位的攻击、防御和突破能力提高。"
PAU_bop_joint_mod:0 "联合议事"
PAU_bop_joint_mod_desc:0 "游击队代表和坦克军官坐在同一张地图前，装甲速度、游击队机动和协同能力小幅提高。"
PAU_gydj_tt:0 "雪伊把定金收据塞进账本：“先说好，这批枪算借的。利息按天算，别装没看见。”"
PAU_bzwtp_tt:0 "小遥对着废墟挥了挥手，被雪伊一把拽回来：“你打算跟谁谈？跟骨头架子谈吗？”"
PAU_zxd_tt:0 "阿夏把扩音器往桌上一放：“想听真话的就留下来。今天不喊口号，先把明天的口粮说明白。”"
PAU_zjpb_tt:0 "小遥把印章往文件上一扣：“都别争了。先按这个办，出了问题我挨骂。”"
PAU_sbzq_tt:0 "艾玛抱着一摞课本从门口挤进来，差点被门槛绊倒：“那个……孩子们明天就能来上课了！”"
PAU_ldwm_tt:0 "巴罗生前带的二连老兵把车发动起来：“追就追。别让那帮骨头架子以为我们只会挨打。”"
PAU_zg_fd_tt:0 "小遥把旧账本合上，叹了口气：“账可以慢慢还。别的嘛……再说，再说。”"
PAU_mdg_tt:0 "雪伊把枪往肩上一扛：“活人不给死人下跪。谁不服，站出来说。”"
PAU_bm_kz_tt:0 "埃文斯把海图铺开，推了推帽子：“太平洋这边的航线，总得有人守着。不能全指望别人。”"
PAU_sjgm_tt:0 "晓枫把笔搁下：“路还长。既然有人愿意跟我们走，那就别半路把人扔下。”"
PAU_hpgc_tt:0 "小遥把白夜从文件堆里抱出来，揉了揉它的耳朵：“能坐下来谈就别掏枪。白夜都困了。”"
PAU_zdbf_tt:0 "阿夏把地图往墙上一钉：“谁想进这片地，先问过我们手里的枪。”"
PAU_white_night_party:0 "白夜同盟"
PAU_white_night_party_long:0 "白夜同盟"
PAU_sakura_expedition_tt:0 "白夜同盟远征军完成编成，舰队和航空队开始为跨海作战做准备。"
PAU_end_settlement_tt:0 "白夜同盟正式挂牌，旧的军团名号被收进档案里。"
PAU_contract_victory_tt:0 "雪伊把最后一箱补给往地上一放，喘着气骂了一句：“下次再签这种破合同，先让他们把油钱结了。”晓枫没接话，只把这次调度记进了工坊账本。"
PAU_army_reform_axia: "阿夏系陆军改革"
PAU_army_reform_xfxy: "晓枫雪伊系陆军改革"
PAU_army_reform_xiaoyao: "小遥系陆军改革"
PAU_economy_reform_axia: "阿夏系经济改革"
PAU_economy_reform_xfxy: "晓枫雪伊系经济改革"
PAU_economy_reform_xiaoyao: "小遥系经济改革"

####补齐改革与政治线修正本地化####
PAU_reform_recon_desc:0 "侦察网重新铺开以后，连队再不用靠猜来画地图。"
PAU_reform_supply_desc:0 "仓库和前线用同一本账发东西，谁也多领不走。"
PAU_reform_medics_desc:0 "担架队和医疗站重新编进连队，伤员至少不用躺在泥里等死。"
PAU_reform_armor_desc:0 "旧坦克重新归拢成教导连，车长们又开始教新兵怎么冲锋。"
PAU_reform_granary_desc:0 "粮仓账目对齐以后，前线吃饭不再全凭运气。"
PAU_reform_workshop_desc:0 "工坊按工序重新开工，军械修理和生产线总算接上了。"
PAU_reform_currency_desc:0 "旧钞能兑，新币有人认，工厂账目终于能对上。"
PAU_reform_trade_desc:0 "港口航线重新排期，燃料和船坞产出都稳了下来。"
PAU_reform_command:0 "联合指挥部"
PAU_reform_command_desc:0 "两套指挥习惯被按在同一张桌子上，命令至少不会互相打架。"
PAU_reform_signal:0 "前线信号网"
PAU_reform_signal_desc:0 "电台和传令兵重新接上暗号，部队不用再等命令等到天黑。"
PAU_reform_joint_defense:0 "共同防务"
PAU_reform_joint_defense_desc:0 "地方自卫队和正规军开始互相掩护，不再各守各的。"
PAU_reform_navy:0 "舰队轮值"
PAU_reform_navy_desc:0 "舰队和港口重新排班，伤船知道该往哪个码头开。"
PAU_reform_expedition:0 "远征装载"
PAU_reform_expedition_desc:0 "远征部队的装备和补给不再临时抱佛脚。"
PAU_reform_landing:0 "抢滩教范"
PAU_reform_landing_desc:0 "舰队把滩头算清楚，登陆部队知道该往哪冲。"
PAU_reform_wages:0 "补发工钱"
PAU_reform_wages_desc:0 "欠薪补上以后，工人不用再拿黑市价格算自己的日子。"
PAU_reform_procurement:0 "军械采购"
PAU_reform_procurement_desc:0 "订单按批次交付，工坊不用再为一颗螺丝停线。"
PAU_reform_audit:0 "账目清查"
PAU_reform_audit_desc:0 "账本清楚以后，行政系统少了很多扯皮。"
PAU_reform_market:0 "集市重开"
PAU_reform_market_desc:0 "集市和配给站重新开张，至少买卖能回到台面上。"
PAU_reform_food:0 "面包配给"
PAU_reform_food_desc:0 "面包能按时领到，士气自然稳一截。"
PAU_reform_land:0 "地契整理"
PAU_reform_land_desc:0 "地契理清以后，农户敢种，作坊也敢扩产。"
PAU_mil_reform_tier1:0 "军事改革·初具条理"
PAU_mil_reform_tier1_desc:0 "军事改革第一阶段：组织度 +5%，计划速度 +5%。"
PAU_mil_reform_tier2:0 "军事改革·协同进攻"
PAU_mil_reform_tier2_desc:0 "军事改革第二阶段（含第一阶段）：组织度 +5%，计划速度 +5%，陆军攻击 +5%，突破 +5%。"
PAU_mil_reform_tier3:0 "军事改革·三线同席"
PAU_mil_reform_tier3_desc:0 "军事改革第三阶段（含前两阶段）：组织度 +5%，计划速度 +5%，陆军攻击 +5%，突破 +5%，协同 +5%，主动性 +5%。"
PAU_eco_reform_tier1:0 "经济改革·账目归位"
PAU_eco_reform_tier1_desc:0 "经济改革第一阶段：民用工厂与军工厂建造速度 +5%。"
PAU_eco_reform_tier2:0 "经济改革·产能回升"
PAU_eco_reform_tier2_desc:0 "经济改革第二阶段（含第一阶段）：民用工厂与军工厂建造速度 +5%，工业产能 +5%，船坞产能 +5%。"
PAU_eco_reform_tier3:0 "经济改革·市面回稳"
PAU_eco_reform_tier3_desc:0 "经济改革第三阶段（含前两阶段）：民用工厂与军工厂建造速度 +5%，工业产能 +5%，船坞产能 +5%，消费品需求 -5%，政治点 +5%。"

####新增国家精神####
PAU_axia_field_kitchen:0 "野战炊事班"
PAU_axia_field_kitchen_desc:0 "阿夏把会烧大锅饭的人重新拢起来，至少让换防的士兵吃口热的再上前线。"
PAU_axia_veteran_school:0 "老兵教学班"
PAU_axia_veteran_school_desc:0 "打过仗的人不多了，阿夏让他们一人带三个新兵，能教多少是多少。"
PAU_xfxy_radio_net:0 "无线电网络"
PAU_xfxy_radio_net_desc:0 "晓枫把旧电台重新配到连一级，雪伊盯着各队按时回话，谁也别装聋。"
PAU_xfxy_winter_gear:0 "冬装与防寒物资"
PAU_xfxy_winter_gear_desc:0 "晓枫算过，冻伤减员比子弹还麻烦；雪伊把棉衣和暖炉先拨给一线。"
PAU_xiaoyao_landing_craft:0 "登陆舟艇编队"
PAU_xiaoyao_landing_craft_desc:0 "小遥把能用的登陆艇都集中起来，省得每次抢滩都靠人往水里跳。"
PAU_xiaoyao_marine_corps:0 "滩头步兵教范"
PAU_xiaoyao_marine_corps_desc:0 "小遥不想再看到部队上岸后找不到集合点，干脆把滩头动作写成操典。"
PAU_axia_ration_standard:0 "统一口粮标准"
PAU_axia_ration_standard_desc:0 "阿夏把各连的锅和账摆在一起，谁多拿谁少拿，先称过再说。"
PAU_axia_tool_recovery:0 "旧工具回收"
PAU_axia_tool_recovery_desc:0 "阿夏带人把废车间的扳手、齿轮和铁皮都翻出来，能修一件是一件。"
PAU_xfxy_factory_ledger:0 "工厂往来账本"
PAU_xfxy_factory_ledger_desc:0 "晓枫盯账，雪伊盯料，谁再敢拿军需单去换私货就自己去仓库门口站着。"
PAU_xfxy_rail_dispatch:0 "铁路调度表"
PAU_xfxy_rail_dispatch_desc:0 "晓枫把车皮和船期排进同一张表，雪伊负责让车按时到站。"
PAU_xiaoyao_public_market:0 "公开集市与配给站"
PAU_xiaoyao_public_market_desc:0 "小遥说大家总得有个地方拿面包，也有个地方把多出来的东西换出去。"
PAU_xiaoyao_land_reform:0 "地契与农户"
PAU_xiaoyao_land_reform_desc:0 "小遥把地契一张张发下去，先种地的人才能安心留下来。"
PAU_soviet_contact:0 "北方的技术援助"
PAU_soviet_contact_desc:0 "同路人送来图纸和机床，也送来一句提醒：这条线只能靠自己走下去。"
PAU_asia_neighbors:0 "亚洲邻国的照应"
PAU_asia_neighbors_desc:0 "大家先记住彼此的名字和港口，以后船到了总得有人接。"
PAU_china_hardline:0 "旧账还了，皇帝的事另算"
PAU_china_hardline_desc:0 "欠王室的账可以还，但谁想继续替旧皇帝管这片土地，就得先问问枪答不答应。"
PAU_defy_death:0 "活人不会给骷髅让路"
PAU_defy_death_desc:0 "亡灵不休息，人也只能咬牙顶着。至少活着的人还愿意把后背交给旁边的同伴。"
PAU_eng_cooperation:0 "皇家海军的老交情"
PAU_eng_cooperation_desc:0 "老牌海军愿意卖个人情，但码头和航线得按他们的规矩来。"
PAU_pacific_peace:0 "太平洋通商口岸"
PAU_pacific_peace_desc:0 "能谈生意就先把生意谈起来。港口的灯亮着，比炮口对着海面有用。"
PAU_pacific_defense:0 "谁也别想插手太平洋"
PAU_pacific_defense_desc:0 "防线推到海边，港口、航线和水道都得有人守着。"
PAU_world_revolution:0 "旧桌子该掀了"
PAU_world_revolution_desc:0 "旧秩序不会自己让路。既然坐不上去，就把桌子掀了重新排。"
PAU_peace_coexistence:0 "大家先坐下来"
PAU_peace_coexistence_desc:0 "能少打一场就少打一场。嘴上谈不拢总比让年轻人去填战壕强。"
PAU_armed_neutrality:0 "谁也别拉我们下水"
PAU_armed_neutrality_desc:0 "不惹事，也不怕事。家门口的枪擦亮，别人自然会多想一想。"
PAU_shared_guilt:0 "与国同罪"
PAU_shared_guilt_desc:0 "军团和这片土地的名字已经绑在一起，谁也别想只让一个人背锅。"
PAU_white_night_beast:0 "白夜本来就是只野兽"
PAU_white_night_beast_desc:0 "既然温柔换不回和平，那就让白夜按野性的方式守到最后。"
PAU_final_settlement:0 "白夜同盟的正式名分"
PAU_final_settlement_desc:0 "军团有了新的名字，港口的旗子也终于不会再被风吹走。"
PAU_stage_undead_vanguard:0 "亡灵前哨"
PAU_stage_undead_vanguard_desc:0 "亡灵战争的第一批哨探已经出发，军团开始用更稳妥的方式摸清死气蔓延的边界。"
PAU_stage_grail:0 "圣杯余烬"
PAU_stage_grail_desc:0 "从圣杯带回来的不只是人，还有在流亡里磨出来的行军和补给经验。"
PAU_stage_south_america:0 "南美共同市场"
PAU_stage_south_america_desc:0 "港口、铁路和货币开始围着同一个市场转，盟友们总算在账本上坐到一起。"
PAU_stage_reconstruction:0 "重建委员会"
PAU_stage_reconstruction_desc:0 "学校、工厂和市政厅重新排进同一张工单，重建不再只是把废墟扫干净。"
PAU_stage_sakura:0 "樱岛远征体系"
PAU_stage_sakura_desc:0 "远征舰队、登陆场和后勤船团已经能围着同一张海图转，太平洋不再是地图上的空白。"
PAU_stage_world:0 "白夜的世界席位"
PAU_stage_world_desc:0 "白夜同盟的名字开始出现在各国外交部的文件上，港口和航线也重新围绕它的旗子排布。"
PAU_stage_grail_milestone_tt:0 "获得国家精神【圣杯余烬】，+1 研究槽，并在首都建成 1 座民用工厂。"
PAU_stage_sa_milestone_tt:0 "获得国家精神【南美共同市场】，并在首都建成 1 座民用工厂。"
PAU_stage_reconstruction_milestone_tt:0 "获得国家精神【重建委员会】，并在首都建成 1 座民用工厂。"
PAU_stage_sakura_milestone_tt:0 "获得国家精神【樱岛远征体系】，+1 研究槽，并在首都建成 1 座军用工厂。"
PAU_stage_world_milestone_tt:0 "获得国家精神【白夜的世界席位】，并在首都建成 1 座军用工厂。"

####新增决议####
PAU_axia_field_kitchen_tt:0 "完成对应国策后解锁；消耗 10 点阿夏军事改革点，获得野战炊事班国家精神。"
PAU_axia_night_march:0 "夜间行军演练"
PAU_axia_night_march_desc:0 "阿夏把部队拉出去走夜路。谁掉队，她就在终点抱着白夜等谁。"
PAU_axia_night_march_tt:0 "完成对应国策后解锁；消耗 10 点阿夏军事改革点，获得夜行军与灯火管制国家精神（只能执行一次）。"
PAU_xfxy_radio_net_tt:0 "完成对应国策后解锁；消耗 10 点晓枫雪伊军事改革点，获得无线电网络国家精神。"
PAU_xfxy_signal_drill:0 "信号与传令演练"
PAU_xfxy_signal_drill_desc:0 "晓枫把传令兵和电台台长都拉出来对表，省得打起来才发现暗号早换了。"
PAU_xfxy_signal_drill_tt:0 "完成对应国策后解锁；消耗 10 点晓枫雪伊军事改革点，获得信号与传令操典国家精神（只能执行一次）。"
PAU_xiaoyao_landing_craft_tt:0 "完成对应国策后解锁；消耗 10 点小遥军事改革点，获得登陆舟艇编队国家精神。"
PAU_xiaoyao_shore_drill:0 "抢滩动作再练一遍"
PAU_xiaoyao_shore_drill_desc:0 "小遥不想再看到有人上岸后找不到集合点，干脆让全军把抢滩动作重练到吐。"
PAU_xiaoyao_shore_drill_tt:0 "完成对应国策后解锁；消耗 10 点小遥军事改革点，获得滩头下船与集结国家精神（只能执行一次）。"
PAU_xiaoyao_marine_corps_tt:0 "完成对应国策后解锁；消耗 10 点小遥军事改革点，获得滩头步兵教范国家精神。"
PAU_axia_ration_standard_tt:0 "完成对应国策后解锁；消耗 10 点阿夏经济改革点，获得统一口粮标准国家精神。"
PAU_axia_granary_audit:0 "清点粮仓"
PAU_axia_granary_audit_desc:0 "阿夏亲自去开仓，谁在账上多画了一袋粮，就自己去把缺口补上。"
PAU_axia_granary_audit_tt:0 "完成对应国策后解锁；消耗 10 点阿夏经济改革点，获得粮仓与配给账目国家精神（只能执行一次）。"
PAU_axia_tool_recovery_tt:0 "完成对应国策后解锁；消耗 10 点阿夏经济改革点，获得旧工具回收国家精神。"
PAU_xfxy_factory_ledger_tt:0 "完成对应国策后解锁；消耗 10 点晓枫雪伊经济改革点，获得工厂往来账本国家精神。"
PAU_xfxy_spare_parts:0 "把备用零件拨下去"
PAU_xfxy_spare_parts_desc:0 "晓枫说修不好的车比被打坏的车更气人，于是先给修理连批了一批零件。"
PAU_xfxy_spare_parts_tt:0 "完成对应国策后解锁；消耗 10 点晓枫雪伊经济改革点，获得备用零件与修理所国家精神（只能执行一次）。"
PAU_xfxy_rail_dispatch_tt:0 "完成对应国策后解锁；消耗 10 点晓枫雪伊经济改革点，获得铁路调度表国家精神。"
PAU_xiaoyao_public_market_tt:0 "完成对应国策后解锁；消耗 10 点小遥经济改革点，获得公开集市与配给站国家精神。"
PAU_xiaoyao_food_drive:0 "再筹一批过冬的粮"
PAU_xiaoyao_food_drive_desc:0 "小遥带着白夜挨家挨户转了一圈，能收多少是多少，至少别让人饿着过冬。"
PAU_xiaoyao_food_drive_tt:0 "完成对应国策后解锁；消耗 10 点小遥经济改革点，获得过冬粮与公开配给国家精神（只能执行一次）。"
PAU_xiaoyao_land_reform_tt:0 "完成对应国策后解锁；消耗 10 点小遥经济改革点，获得地契与农户国家精神。"
PAU_axia_veteran_school_tt:0 "完成对应国策后解锁；消耗 10 点阿夏军事改革点，获得老兵教学班国家精神。"
PAU_xfxy_winter_gear_tt:0 "完成对应国策后解锁；消耗 10 点晓枫雪伊军事改革点，获得冬装与防寒物资国家精神。"
PAU_lhs_officer_exchange:0 "让旧部军官去带新兵"
PAU_lhs_officer_exchange_desc:0 "整合不是坐在一起吃饭。把野火旧部派到各连当教官，能不能服众看他们自己。"
PAU_lhs_officer_exchange_tt:0 "提高野火整编进度，获得陆军学说精通。"
PAU_grail_fortify_docks:0 "把圣杯码头加固"
PAU_grail_fortify_docks_desc:0 "流亡营不能永远靠木板挡海风，趁还有点零件，先把码头修结实。"
PAU_grail_fortify_docks_tt:0 "消耗圣杯零件，获得海军经验。"
PAU_safe_harbor_smuggle:0 "从避风港走一趟私货"
PAU_safe_harbor_smuggle_desc:0 "有些东西明面上买不到，但避风港的夜里总有人愿意谈。"
PAU_safe_harbor_smuggle_tt:0 "获得 500 燃料和 500 支援装备。"
PAU_undead_scorched_earth:0 "烧出一条隔离带"
PAU_undead_scorched_earth_desc:0 "把带不走的燃料和补给烧掉，至少别让尸潮踩着我们的物资追上来。"
PAU_undead_scorched_earth_tt:0 "消耗 500 燃料，降低亡灵压迫。"
PAU_barrow_memorial_school:0 "以巴罗的名字办一所士官学校"
PAU_barrow_memorial_school_desc:0 "让二连的老兵轮流去讲课。名字挂在门口，规矩就得留在教室里。"
PAU_barrow_memorial_school_tt:0 "获得陆军学说精通和 500 人力。"

####改革进度变量####
