PAU_news.1.t: "$news_event_background$莉兰迪亚的通牒到期了"
PAU_news.1.d: "随着莉兰迪亚临时防务会给出的停火期限届满，部署在水道与内陆公路上的装甲纵队与巡防舰队同时发动了推进。\n外界原本以为这个由工会、雇佣军溃兵与樱花逃亡水手拼凑起来的政权会在内部争吵中自行瓦解。然而，在那位年轻执政官的统合下，莉兰迪亚不仅理顺了后勤与军工厂的产出，更展现出了将整个大陆强行整合为单一实体的战略决心。\n各地的哨所与割据防线正在迅速瓦解，这场旨在彻底终结割据与外部干涉的军事行动，正在将南美推向一个前所未有的全新格局。"
PAU_news.1.a: "她们不再打算逃跑了。"
