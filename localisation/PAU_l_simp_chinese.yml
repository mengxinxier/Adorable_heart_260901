####国策与事件####
#政治线国策v 
PAU_tx: "退信"
PAU_tx_desc: "王室送来的公文写得很清楚，给钱的日期又往后拖了。大家空着肚子，脾气都很差。可要是现在掀桌子走人，连这个营地都保不住。只能先把催钱的信塞进抽屉，交代后厨在锅里多添几瓢水，先把今天的午饭应付过去。"
PAU.1.t: "栏杆升起时"
PAU.1.d: "“王室送来的又是欠条。”\n副官把午饭递给我。碗里清得见底，只有几片煮烂的菜叶。\n“他们让大家多体谅一下，再等两周。”副官说。\n“体谅又不能当饭吃。”\n我喝了一口，满嘴都是寡淡的盐水味。\n远处的山谷里，晓枫那些人的营地隐隐约约能看到一点影子。当初分道扬镳的时候，她跟我吵了一架，说我们迟早会被王室当成弃子扔掉。现在看来，全被她说中了。\n正当发愁下个月该怎么过时，门岗那边突然响了一声铃。\n“长官，有人过来了。”\n我放下碗，朝营区大门走了过去。\n站在栏杆外面的不是信使，也不是游击队的探子。\n那是个白头发的少女，背着旅行包，肩膀上趴着一只雪白的小兽，她正好奇地到处看着。周围好几支枪口都对着她，她却完全不在意，高高兴兴地冲我挥着手。\n“打扰啦！”\n她快步走到栏杆前，双手搭在了上面，笑得特别灿烂。\n“顺着路走了好久，肚子早就叫个不停了……请问这里有食堂吗？能分我一碗汤喝吗？”\n哨卡里瞬间安静下来。\n站岗的士兵全卡在原地，面面相觑。\n在这片除了硝烟就是欠条的营地里，居然真有人把军营当成了路边的饭馆。"
PAU.1.a: "“……把枪放低，让她进来吧。”"

PAU_hwtzh: "喝完汤之后"
PAU_hwtzh_desc: "那个外来的白发少女喝光了最后一口菜汤，放下勺子，接着准确报出了我们驻防各队的缺粮数额与王室的密令编号。军营里的底细早就被外人摸得一清二楚。既然我们已经坐在了同一张桌子前面了，就不得不听听这位不请自来的客人到底想谈什么。"

PAU.2.t: "勺子"
PAU.2.d: "勺子在铁碗里刮过了最后一圈，发出清脆的响声。\n少女把碗里的菜叶吃得干干净净，抽出手帕擦了擦嘴角。肩头趴着的那只小白兽换了个舒服的姿势，也眯着眼睛打起了瞌睡。\n“多谢招待，虽然只有盐水味，不过喝完全身都暖和了呢。”\n她抬起头看着我，脸上的笑意没有褪去，眼神却变得平稳而锐利。\n“王室答应给你们的下批口粮，上周就已经在海港被扣下了。”\n我按在桌上的手停住了。\n“运粮船根本没有装货，上面堆满的是给内廷贵族过冬用的香料和葡萄酒。大臣们给你们寄欠条，只是为了把你们钉在这条防线上，替后方的王都挡住山里的游击队。”\n少女双手交叠托着下巴，语气轻松得像是在讨论明天该吃什么：\n“山谷那边的晓枫正在修整装备，等你们的库存彻底见底。只要你们饿得拿不动武器，他们就会顺着公路直接推过来。”\n食堂里还回荡着士兵们排队盛饭的喧闹声，我面前的空气却仿佛瞬间结了一层薄霜。\n“你到底是谁派来的？”我问。\n“谁也没有派我来。”少女眨了眨眼睛，“我只是从东边的岛屿一路走过来，想亲眼看看当年名震南美的无国界之军，现在到底落魄成了什么样子。”\n她指了指窗外那些正在埋头喝汤的年轻士兵。\n“老军团长不在了，晓枫也带着人走了。留在营地里的这些人，既没有可以效忠的祖国，也拿不到卖命的赏钱，只能每天守着空枪饿肚子，不是吗？”\n少女收起手帕，直视着我的眼睛：\n“阿夏长官，你打算带着大家在这里坐着等死，还是换个真正有出路的活法？”"
PAU.2.a: "“……说说你的条件吧。”"

PAU.3.t: "第三个选项"
PAU.3.d: "“换个雇主？”我把空碗推到了一旁，“去给你们东边的天皇卖命，还是给海上的殖民者当看门狗？”\n“都不对。”\n少女摇了摇头，从衣服内兜里抽出一张折好的路线图，平摊在了桌面上。\n“给别人当雇佣兵，迟早会被当成耗材扔掉。晓枫是对的，你们的老军团长也是对的，只有傻子才会把枪口借给别人使唤。”\n她把手指点在沿海公路的一处交汇点上，那是王室用来储存出口货物的转运仓库。\n“王室既然不给钱，为什么还要守着这道防线？后方仓库里堆着几个月都吃不完的麦粉和罐头，还有准备运往海对面的燃油。”\n少女抬起眼眸，那只小白兽跳到了桌面上，蹲在地图边缘舔着爪子。\n“动了王室的仓库，那就是叛乱。”我说。\n“是他们先违约的。”少女语气平稳，甚至带着理所当然的笃定，“合同上写得明明白白，拿钱办事。既然他们不给饭吃，你们当然有权利自己去厨房拿。”\n窗外，巡逻队的脚步声从走廊经过，换岗的哨兵正在交接佩枪。\n“拿到那批物资之后呢？”我问，“就算能撑过这几个月，王都的大炮和山里的游击队迟早会把我们夹在中间。”\n“那就去港口。”少女在地图最东边的港口画了一个圆圈，“我在海上有接应的船队。只要控制了码头，打通去往东方的航线，这里就既不是王室的猎场，也不是游击队的包围圈了。”\n她收起手指，直直看着我：\n“你们会变成一支自己说了算的军队。有饭吃，有油用，甚至能把武器换成机械零件。”\n我低头看着桌上那张路线图。走廊里的换岗铃声又响了一次，清脆的声音在营房里传了开来。\n留在这里是饿死，退回王都是等死。\n“……路线图借我用用。”我站起身，把帽子往下按了按，“等天黑了，我去把几个分队长叫过来开会。”"
PAU.3.a: "“不过，如果这是陷阱的话，\n我的子弹会第一个找上你的。”"


PAU_qxjd: "强行借道"
PAU_qxjd_desc: "卡卡罗姆矿区是通往东部公路的必经之路。晓枫绝不会把根据地的咽喉让出来，我们也必须抢下那条运粮线。既然双方都站在无法后退的位置上，那就只能靠大炮去决定谁能活下去了。"

PAU.4.t: "两千码开外"
PAU.4.d: "“距离两千两百码。”\n副官把测距板递给了我。\n“要现在开炮吗，阿夏长官？”\n我拉低了帽檐，看着前方山头亮起的警戒灯火。\n晓枫在那座山梁上布设了重重火力点。她只清楚我们要去抢夺物资，无论这些物资是来自于谁的，我也清楚她绝不可能把这条命脉让出来。\n两边都把局势看得透透的，这根本谈不上什么误会。\n我们都在为了自己身后那些人的命，把枪口对准曾经最熟悉的人。\n“真要去打啊？”\n小遥靠在车厢挡板旁，随手翻弄着手里的路线图。\n“对方是你的同僚吧。”\n“当年的同僚。”我纠正她，“她带着人退进山里去实现理想，我留下来替剩下的几张嘴找饭吃。从分道扬镳的那天起，我们脚下的路就撞在一起了。”\n小遥抬起头，那双红色的眼睛在夜色里很亮：\n“那就别犹豫。在战场上犹豫，死的就是相信你的人。”\n山梁上突然闪过一道火光。一串机枪点射又快又准，直接击碎了指挥卡车左侧的车灯。\n这是晓枫在用子弹画死线。越过车灯这道坎，就是全火力的覆盖区。她从不手软，我也一样。\n我抬手向后方打出手势。\n“炮兵一连，二连，对准前方阵地。”\n“压上去。把路清出来。”"
PAU.4.a: "“开火。”"

PAU_sdft: "撕掉封条"
PAU_sdft_desc: "车库里那些履带车停了快一年了，车门上还贴着大臣们的白纸封条。以前不动它们，是因为油料不够，也是因为大家都在维持表面的安分。现在卡车在山道上挨了机枪扫射，想活命就不能再装老实人。把封条撕了，把最后的柴油灌进油箱。就算顶着王室的标记，今天也得把这条路碾平。"

PAU.5.t: "合上顶盖时"
PAU.5.d: "启动机连着咳嗽了好几声，排气管终于突突地吐出黑烟。\n开库房的锁链哗啦啦响成一片，几辆轻型坦克慢腾腾地挪到空地上，履带把路面碾得咯吱作响。车身两侧的金鹰标记还亮堂得很，连泥巴都没盖住几寸。\n副官踩在踏板上，手里拎着刷子说道：\n“长官，这鹰标……要不要先弄点黑漆盖掉啊？前边就是晓枫的阻击线，要是被她看见……”\n“刮它干嘛，费那功夫。”\n我扯了扯被风吹歪的领子，语气里满是疲惫：\n“发动机一响，晓枫就知道是谁来了。当年在军营里，连这底盘的散热孔该开多大都是她亲笔画的图纸。就算你把车身刷成粉红色，她也认得出这动静。”\n副官叹了口气，把漆桶放在了脚边。\n山梁上的信号火光依旧明亮，透过望远镜看过去，那面红旗就插在隘口正当中。\n晓枫这时候肯定在观测所里盯着山道看呢。\n在她眼里，事实明摆着——当年在工区街道上碾平街垒的是这批车，现在开进卡卡罗姆、准备轰开她家大门的，也是这批车。\n这叫哪门子的误会啊。我们分明就是揣着明白装糊涂，硬要把枪口往昔日同僚的胸口上顶。\n“真残忍呢，阿夏。”\n小遥两手插在风衣口袋里靠在车棚的柱子旁，语气里带着点事不关己的调侃：\n“从山顶往下看，你们简直就像是王室最忠诚的一条看门犬呢。”\n“少废话。”\n我踩着履带翻上车顶，弯腰钻进狭窄的舱口。\n沉重的金属顶盖在头顶砰的一声合拢，把外面的日光、风声和草木气味全都关在了外面。车厢里闷得让人喘不过气，只剩下柴油机深沉的震动。\n从观察缝里望出去，狭窄的山道正被两道履带印慢慢压平。\n我扶正了军帽，拉过通话器的管子，低声交代了一句：\n“各车注意间距。别熄火。”\n“……跟紧我。”"
PAU.5.a: "现在，门彻底关上了。"

PAU_sdjt: "山道尽头"
PAU_sdjt_desc: "矿区入口的枪声终于停了。道路被重新清理了除了，散落的弹药箱也被搬上了卡车。晓枫被扣在原本属于矿管的地下办公室里，几个负责看守的卫兵正等着命令。是把她交给王室换取口粮，还是带着这个危险的人质一起去海港，必须现在做个决定。"

PAU.6.t: "请松绑吧"
PAU.6.d: "地下办公室里的电灯闪烁不定，空气里混杂着炸药未散的烟尘。\n晓枫坐在靠墙的椅子上，双手被绳子捆在椅背后面。她的额头上的擦伤结了血痂，衣服是也沾满了泥灰，但她坐得很直，冷冷地看着我走了进来。\n“王室给你的悬赏很高。”我拉过一张折叠凳在她对面坐下，“用你的人头，能换几万金币，足够给后面整支车队加满去海港的柴油。”\n晓枫嘴角扯了扯，连求饶的意思都没有：\n“那就拿去换。当年在艾瑞波拉我就该死在山道上了，多活这几年，算我赚的。”\n房门吱呀一声被推开了。\n小遥迈步走了进来，肩上的小白兽探头探脑。她径直走到晓枫身后，从袖口滑出一柄小刀，手腕一转，绑在椅背上的绳子应声散落。\n两名卫兵下意识抬起枪口：\n“长官？！”\n“小遥，你干什么！？”我立马按住腰间的枪柄站了起来。\n少女转过身，平日里那种散漫随性的笑容完全收敛了，脸上透着一种公事公办的冷静。\n她伸手解开风衣内衬的扣子，取出一份盖着朱红印章的通关文件，随手扔在了桌上。\n那是来自极东之地——樱花的正式公函。\n“王室的金币你们拿不到了，阿夏长官。”小遥的声音很稳，没有任何开玩笑的语调，“王都早就被南下的亡灵冲垮了，王都的大臣们们正忙着逃命呢。”\n整个地下室里只剩下发电机单调的杂音。\n“我从樱花乘船出发的时候，会议拟定的名单上只有两个人。”小遥抬起视线，在我和晓枫脸上扫过，“一个是军团最后的带队人，一个是懂全盘战术的参谋长。”\n她收回小刀，看向刚刚活动着发麻的手腕的晓枫：\n“卡卡罗姆是王室预定的清洗区。如果阿夏不带车队打穿山道，几天后赶到这里的，就是索拉娜的先头死灵部队。你们一个都活不下来。”\n晓枫揉着手腕上的红痕，抬头看向小遥，又看了看我：\n“原来你们是这么个‘借道’法啊。”\n我盯着桌上那份印着樱花徽记的文件，整个人都变得恍惚了起来。\n原以为自己是抓住了求生机会的强盗，到头来，连同这场残酷的强攻在内，全都在这位樱花少女的时刻表上走得丝毫不差。"
 PAU.6.a: "“……带上她，全队往港口全速前进。”"

 PAU_ddjr: "多带几个人"
 PAU_ddjr_desc: "矿道里还缩着几百号耗尽子弹的工人和伤员。晓枫不肯一个人上车，卡车上的篷布底下也还能再挤一挤。柴油不多，但卸掉后排几箱沉重的穿甲弹，就能多腾出几个车斗拉上活人。至于北边公社的雪伊……只能在电台里给她留个通报，能不能从死灵嘴里杀出一条路，全凭她自己的本事了。"

 PAU.7.t: "车厢挤一挤"
 PAU.7.d: "晓枫刚活动好被解开的手腕，正准备朝外走时，走到门边突然回头盯向了我：\n“坑道里还有几百多个伤员和筑垒工人，你要把他们全丢在这里等死？”\n我拉低了帽檐：“车队装不下这么多人。柴油只够一口气跑到海港，多拉那么多人，大家全得停在路上当靶子。”\n旁边的小遥理了理被风吹乱的衣领，笑眯眯地插话进来：\n“樱花的运输船很大，底舱缺不少懂得维修机床和装配引擎的熟手。只要手里拿得动扳手，到了那边，我们都愿意按期发工钱哦。”\n晓枫看了小遥一眼，随即转过脸逼问我：\n“听见了吗？他们是机械工人，不是冲锋的步兵。把枪收缴了换成修车工具，这样总该能带上了吧？”\n我呼出一口气，转头朝走廊上的副官招手：\n“去通知后排卡车，把打空的弹药箱全推下去。拆掉几块挡板，让能走动的全爬进车斗。挤不下的，手把栏杆扶紧了，哪怕掉下车我们也不会减速去捡的。”\n副官应了一声，快步跑去传令。\n我转回身看着晓枫，提起了另一件事：\n“公社那边呢？雪伊还在北边的工业区。卡卡罗姆垮了，索拉娜的死灵大军很快就会顺着铁路线漫过去。”\n晓枫走到桌前，一把拿起那部快要没电的便携步话机，把旋钮拧到了最高频：\n“我们现在掉头回去，就是白白送死。雪伊不是傻子，看到王都方向的黑烟，她自己就会带人往外突围。”\n她把步话机往窗台最高处一放，直接拉出了天线：\n“把这个留在矿顶的信号塔上，全天循环播报车队的撤退路线和海港坐标。雪伊要是能杀出来，就会顺着车辙印追上我们；要是她死在公社……我们去了也只是收尸。”\n车库方向传来了卡车排气管轰鸣的声浪，震得窗框直响。\n小遥把风衣的扣子一颗颗系好，朝我和晓枫招了招手：\n“那么，两位长官，该去码头赶船了。”"
 PAU.7.a: "“出发，目标东部港口。”"

 PAU_zbgk: "直奔港口"
 PAU_zbgk_desc: "卡车的大灯全关了，几十辆车顺着沿海公路全速前进。车斗里挤得连转个身都费劲，车轮碾过坑洼时能听见悬挂嘎吱作响的哀鸣。南边天际线上的黑烟越来越浓，那是王都被死灵吞没的动静。晓枫坐在副驾驶上拿着秒表计算路程，小遥在后面哼着樱花的童谣。谁也没心思回头看，所有的活路全系在港口货栈的那批燃油和粮食上。"

 PAU.8.t: "货栈门前"
 PAU.8.d: "咸腥的海风顺着破损的车窗灌了进来，吹得仪表盘上的灰尘乱转。\n车队在港区货栈的铁门前猛地刹住，前排卡车水箱喷出的热气在夜色里散开。几名戴着王室帽徽的看守提着马灯从哨房里跑了出来，慌慌张张地举起手里的佩枪，还没弄明白怎么回事就被跳下车的士兵围在了墙根底下。\n“你们是哪个部队的？！”领头的看守官扯着嗓子喊道，手抖得连保险都拉不开，“这里是王都封存的物资，擅自靠近按叛国论处！”\n我推开车门跳下踏板，脚底踩在了码头的湿水泥地上。\n“你们的王都早就没了。”我把帽子往前按了按，“你们的王都大臣大概已经成了索拉娜的晚饭。想保住命的，把库房钥匙交出来。”\n看守官愣在原地，脸色唰地全空了。\n晓枫从车后面走了过来，手里拿着一把用来撬锁的撬棍，连看都没看那群吓呆的看守，直接插进了大门铁锁的扣环里。两名跟上来的筑垒工人用力一扳，挂锁啪的一声断成两截。\n沉重的铁门被合力推开，里面整整齐齐码放着上千个木箱，麦粉的干香和柴油味扑面而来。\n车斗里的伤员和矿工们发出了一阵压抑的骚动，有人甚至开始小声抽泣。\n小遥轻快地跳下车，走到码头边缘的系缆桩旁，抬手指向漆黑的海面。\n两长一短的汽笛声穿透海雾，沉闷地荡了过来。\n海湾深处，几艘悬挂着樱花旗帜的庞大运输舰正缓缓驶入锚地，甲板上的探照灯打出一道道雪白的光柱，稳稳落在了我们的卡车前。\n“看吧，我没骗人。”小遥转过身，海风吹起她的风衣下摆，“船已经到了，粮食和柴油也拿到了。”\n晓枫站在敞开的库房门前，看着那些跳下卡车拼命搬运物资的工人和士兵，神色复杂地低声问我：\n“接下来呢？登船离开，还是把港口变成防线？”"
 PAU.8.a: "“先把所有的油箱加满，我们再谈以后的事。”"

 PAU_jmyx: "加满油箱"
 PAU_jmyx_desc: "货栈里的柴油桶全被撬开了，士兵和工人们提着油枪轮流给每辆卡车灌满。几个月来第一次闻到真正的饭菜香，大家坐在集装箱旁边狼吞虎咽，连掉在衣角上的肉渣都捡起来吃了。樱花的运输舰在栈桥边放下了跳板，水兵正在清点登船人数。油箱满了，肚子饱了，可谁也没法装作看不见北边铁路线传来的求救信号。"


 PAU.9.t: "跳板搭稳时"
 PAU.9.d: "油料灌进油箱的咕嘟声在码头上响个不停。\n工人们坐在仓库门前的空地上，手里捧着刚加热好的牛肉罐头，呼哧呼哧吃得满嘴是油。几个带伤的年轻士兵互相拍着肩膀笑，那是我们在卡卡罗姆几个月都没见过的松快劲儿。\n小遥站在运输舰的舷梯旁，朝我招了招手：\n“货舱腾出来三个大隔间，淡水和干粮都是足量的。阿夏长官，你们的人随时可以开始登船。”\n我低头看着脚边的空油桶。卡车的引擎已经全部热好，只要开上运输舰，这群跟着我挨饿的弟兄就能彻底离开这片泥潭。\n港务室的门突然被人猛地推开了。\n晓枫大步走了出来，头上还戴着电台的耳机，电线在身后拖得老长。\n“通了。”她站在台阶上看着我，语气平静得让人发冷。\n我转过身：“什么通了？”\n“留在矿顶的步话机。”晓枫摘下一边耳机递向我，“雪伊的人冲破了工业区的封锁线，正沿着北边的铁路线往港口撤退。后面全是索拉娜的死灵前锋，她们就只剩下几辆卡车了，弹药快打光了。”\n耳机里全是刺耳的电流杂音，隐约能听到雪伊在另一端粗着嗓子的嘶吼，伴随着密集的机枪点射和撞击声。\n小遥慢慢走下跳板，站在了我们两人中间：\n“运输舰必须在潮水退去前起航。如果死灵的主力涌进港区，樱花的舰队会直接收起跳板撤离。我们是来接人的，不是来打阻击战的。”\n晓枫没有去求小遥，也没有看周围那些刚刚吃饱饭的士兵。她只是看着我，把手里的耳机递得更近了些：\n“距离码头入口还有十五公里。雪伊只要冲过跨河铁桥，就能甩开后面的步兵追兵。但那座桥被王室撤退时炸塌了一段，卡车开不过去。”\n码头上的风把海浪拍在水泥桩上，碎成一片片泡沫。\n一边是已经搭好跳板、随时可以启航去樱花的运输舰；另一边是加满了柴油、炮口还能开火的几辆轻型坦克。\n所有的弟兄都在回头看着我。"
 PAU.9.a: "“……二连留下来装船，其余人跟我上车，去铁桥接人。”"
 PAU.9.b: "“……收起跳板，我们立刻开船。”"

 PAU_zjwyj: "追加违约金"
 PAU_zjwyj_desc: "小遥把一张重新拟好的赔偿清单拍在挡风玻璃上。擅自改变撤退路线等于把整个樱花运输舰队扣在危险的浅水区当靶子，按规矩要赔上好几倍的运费。可她转头就抄起联络机，让外海的护航战舰把主炮转到了铁桥方向。嘴上说着蚀本买卖，手底下的舰炮火力却一发也没含糊。"


 PAU.10.t: "跳上副驾驶"
 PAU.10.d: "柴油机的黑烟刚喷出来，车门就被人在外面用力拍了两下。\n还没等我踩下离合，副驾驶的车门猛地弹开，小遥拎着旅行包直接挤了进来，那只小白兽也跟着跳上仪表盘找了个地方趴好。\n我转头瞪着她：“你上来干嘛？船不等潮水了？”\n小遥把包塞在脚下，从怀里扯出一副连着长天线的通话器：“开船的指令我推迟了。擅自带着主力去救人，你知道这算严重违约吗，阿夏长官？”\n坐在后排的晓枫刚核对完等高线图，正准备开口。\n我抢先松开手刹，打方向盘把卡车冲上公路：“违约金我以后做工还你。现在跳下去还来得及。”\n小遥听了直摇头，语气里满是嫌弃：“做工？拿你在泥地里打滚的微薄薪水还到下个世纪吗？”\n她不再跟我磨嘴皮子，伸手按下了通话器的发射开关，对着麦克风发令：\n“这里是小遥。通知海湾里的两艘护航舰，主炮解除待命。校准沿河铁路线北岸，目标是追击公社车队的死灵集群。”\n通话器另一端传来一阵急促的应答声，伴随着刺耳的电磁杂音。\n安排完炮击，小遥转过脸看着我，语气听着像个精明的商人：“救人的耗损全记在你的债务清单里。等到了樱花，你和你的队伍每天都得去基地老老实实上班。”\n轰——！\n海湾方向传来了一阵震动地面的沉闷巨响，两道耀眼的火球划过夜空，带着尖利的啸叫直扑北边的山脉，气浪把路旁的树木吹得枝叶乱晃。\n后排的晓枫望着窗外被炮火映亮的天际线，喃喃说道：\n“雪伊要是听见这动静，肯定以为又是哪路王室舰队来要她的命了。”\n“抓稳了。”我踩下油门，卡车顺着车辙印全速冲向铁桥。"
 PAU.10.a: "“去把那个跑不动的家伙捞回来。”"

 PAU.11.t: "铁桥对岸"
 PAU.11.d: "江面上的雾气被远处的炮火撕得粉碎。\n跨河铁桥中间断开了一个大口子，扭曲的桥架悬在水流上方。对岸的铁道旁，一辆翻倒的货车正冒着浓烟，几个满脸黑灰的公社伤员正互相搀扶着躲在桥桩后面。\n车还没完全刹稳，晓枫就推开车门跑了下去，快步赶到断桥边缘。\n对岸那个靠着车轮的身影猛地抬起手里的长枪，大声咳嗽着喊道：\n“对岸是谁？！我手里的子弹可不长眼！”\n那是雪伊的声音，嗓子哑得厉害。\n晓枫站在断口前，双手拢在嘴边大喊：“雪伊！是我！”\n对岸的身影明显僵住了。雪伊抹了把脸上的污迹，瞪大眼睛认出了晓枫，紧接着目光就扫到了我和开上桥头的车辆。\n“晓枫？！你没死？……等等，军团的人怎么也在旁边？！你们这帮拿赏钱的家伙是来抓我的？！”\n雪伊的声音又惊又怒，手里的枪口晃来晃去。\n我走上前，从车头扯下一根沉重的拖车缆绳，甩起带挂钩的那头用力扔过断口，稳稳卡在对岸的一根枕木上。\n我冲着对岸回喊：“少在那边嚷嚷！王都早就被死灵占领了，谁有空抓你换钱！能动的抓紧绳子爬过来，动不了的绑在腰上，我们这边拉！”\n后面的小遥也跟着小跑过来，两手扶着栏杆大声补充：\n“动作要快哦！护航舰的炮弹很贵，舰队只答应掩护十五分钟，超时了大家都要留在这儿喂亡灵呢！”\n对岸后方的废墟里传来了死灵怪物的嘶吼声。\n晓枫踩上悬空的铁梁，朝对岸伸出手：“雪伊！别犯倔了！先把伤员送过来！”\n雪伊咬着牙收起武器，转身和几个工人把第一名重伤员用皮带绑在缆绳上。\n我和车队的几名士兵抓稳绳子，一点点把人拉过江面。\n十多分钟过去，顺着缆绳爬过来的雪伊浑身湿透，刚跳上这边的地面就脱力地坐了下去，大口喘着粗气。\n晓枫蹲下身，伸手替她擦掉额头上的血渍。\n雪伊转过头狠狠瞪着我：\n“……阿夏，你带队开炮轰我防线的事，我可没答应就这么算了。”\n我把一盒热好的牛肉罐头塞进她怀里：\n“我也没打算让你就这么算了。先吃东西，车队该回码头了。”"
 PAU.11.a: "“全员上车，返回港口。”"

 PAU_zmxx: "装满鲜血的罐头"
 PAU_zmxx_desc: "撤回港口的卡车还没熄火，车斗里就吵翻了天。脱险的侥幸被对岸留下的血腥味冲得干干净净。雪伊不肯咽下军团分发的口粮，指着车厢里的伤员厉声质问。卡卡罗姆阵地上被炮火轰碎的工事、铁桥北岸没能抓牢缆绳的同伴，全成了横在所有人中间拔不掉的钉子。谁也没法替死在路上的同僚大度地假装一切都没发生。"

 PAU.12.t: "谁留在对岸"
 PAU.12.d: "车轮刚在码头的水泥地上刹停，车斗里就传出一声沉闷的撞击声。\n雪伊抓起怀里那个温热的牛肉罐头，用力砸在车厢挡板上，马口铁罐滚落在地，里面的肉汁溅了一车板。\n她扶着车栏站起来，满是灰的脸颊因为愤怒涨得通红，指着晓枫大声吼道：\n“晓枫！你看看车厢里坐着的都是谁？！二班的伤员全被截在断桥北头，李工为了给卡车挡机枪，整个人被扫进河里连泡都没冒一个！你告诉我，你凭什么坐在军团的卡车上发号施令？！”\n晓枫从后排站起身，迎着雪伊通红的眼睛，语气低沉：\n“如果车队不按时撤离，所有人都会死在隘口。”\n“所以你就挑着人救，是吗？！”雪伊的声音几乎破了音，眼泪混着脸上的黑灰往下淌着，“在卡卡罗姆，军团的大炮直接把防御工事连同几十号守地的兄弟全扬成了灰！他们到咽气都以为自己是在抵抗王室的走狗！结果呢？！你现在居然跟这帮开坦克的强盗坐在一辆车里吃罐头？！”\n她猛地扭过头，目光死钉在了我的身上：\n“阿夏！对岸还有四十多个人没爬过来！桥桩后面全是活生生的人！你为什么下令把牵引绳割断？！你哪怕多等三分钟……”\n我推开车门跳下踏板，转过身仰头看着她：\n“再等三分钟，死灵的先锋就已经顺着绳子爬过江了。到时候整座铁桥全得丢，卡车上的伤员一个也别想活着进港区。”\n“那对岸的人就活该被扔下吗？！”\n“他们没活该，我也没做错。”我避开她那双快要喷火的眼睛，抓紧了腰间的皮带，“在卡卡罗姆开炮是我下的令，在铁桥砍断缆绳也是我下的令。你想骂就冲着我来，但少在这里冲着晓枫撒泼，她手里的枪早就被我下了。”\n车斗里的公社工人和重伤员全都低着头，没人敢出声，只有海浪拍打码头木桩的哗哗声在四周回荡。\n一直站在车尾跳板旁的小遥收敛了平时的玩笑神情，抬手看了一眼天色，轻声提醒道：\n“港口的巡逻舰已经在催促了。距离潮水退去只剩最后几分钟，想吵架的话，等所有人都活下来，到了船舱里有的是时间吵。”\n晓枫走到车斗边缘，朝雪伊伸出了手：\n“下车，雪伊。把眼泪擦了，去帮后勤队抬担架。我们欠他们的命，活着才能想办法还。”\n雪伊咬破了嘴角，抬手狠狠推开晓枫的手臂，自己一个人抓着栏杆跳下了车，摇摇晃晃地朝登船的舷梯走去。"
 PAU.12.a: "“……去核对登船名单，一个名字都不许漏。”"

 PAU_jjka: "紧急靠岸"
 PAU_jjka_desc: "谁也没料到死灵会从几百米深的海底浮上来。运输船的尾舵被水下的断木撞坏了，海水灌进轮机舱，根本不可能直接横跨大洋。只能顺着领航灯，强行拐进圣杯王国设立在海岛上的前哨补给站。那里的驻军按照战时海关条例，要求扣留货舱里整整五成的物资作为停泊与检疫费。为了保住船舱里的伤员，只能把刚抢到手的粮食分出去一大批。"

 PAU.13.t: "海关印章"
 PAU.13.d: "船底传来第一声闷响的时候，所有人都以为只是撞上了暗礁。\n紧接着，第二声、第三声剧烈的撞击连着震翻了底舱的好几桶柴油，海水混着水草从破损的甲板缝隙里涌了上来。\n探照灯的光柱扫向海面，水下浮上来的全是被海水泡烂了的肢体，密密麻麻缠在断裂的沉船残骸上。几具膨胀变形的骷髅抓着船舷的排水孔，正顺着锚链往上爬。\n在大家的认知里，死灵只是一群在泥潭里行军的陆地怪物。谁也想不到索拉娜的尸潮早就顺着海底海沟，蔓延到了大洋深处。\n两艘护航舰开炮打碎了水下的骨架，但运输船的尾舵已经被撞烂了，轮机舱进水，根本不可能支撑到海对面。\n清晨时分，受损的船队只能跟着引航灯，拐进了圣杯王国设在近海孤岛上的巡防基地。\n港口里停着两艘巡逻舰，高音喇叭里传来带口音的严肃警告：\n“未经通报的武装船只，立刻停机下锚。甲板上所有人员举起双手，接受战时卫生检疫。”\n晓枫扶着栏杆，指着岸边的防波堤说道：“这是圣杯在南大西洋的补给港，驻军只认条约和规章。”\n一名穿着海军常服的圣杯军官带着随从走上了跳板。他手里拿着文件夹，目光扫过甲板上满身黑灰的士兵和浑身湿透的伤员，平淡地宣读道：\n“你们的船体有严重的生物污染痕迹，发动机也在漏油。按战时港口条例，我必须拒绝这批未经许可的武装难民入港。”\n我正准备拿出货栈清单交涉，站在身后的小遥已经一步跨到了跳板前。\n她解开风衣领口的扣子，亮出内衬上那枚刻着樱花的金属印记，同时将一份盖着鲜红钢印的公函递到了圣杯军官面前。\n“我是樱花派遣的随船全权代表小遥。”她的语气带着不容置疑的正式腔调，“这几艘船登记在樱花海军的临时护航名录下，船上的人员属于受保护的技术雇工。”\n圣杯军官看着那枚印章，神色明显严肃了起来。他抬手扶了扶帽檐，语气换成了对待外国使节的公事公办：\n“既然有樱花的正式国书，港口可以依照战时避难公约提供修船船坞与检疫用药。但紧急停泊费与入港消杀税依然有效，我们要征收货舱里五成的面粉、牛肉罐头以及全部的航空燃油。”\n这依然是一笔苛刻的条件。那些物资是我们好不容易才抢出来的命根子。\n雪伊此时正站在舱门口，手里端着一碗刚刚过滤出来的清水，小心地喂给担架上发高烧的工友。她听见对方开出的条件，肩膀颤动了一下，最后只是咬住嘴唇，低头继续给伤员擦脸。\n“可以，按你们的规矩办。”小遥在入境协议上签下名字，把文件递还给军官，“请立刻接通岸上的维修电缆，安排伤员进消杀棚。”\n军官收起文件夹，行了一个标准的海军礼，转身吩咐手下开动起重机卸货。\n起重机的吊臂把一箱箱刚到手的食物吊向码头仓库。\n晓枫靠在栏杆边，看着岸上高高挂着的圣杯旗帜，低声说了句：\n“至少……大家暂时不用担心被拖进水底了。”"
 PAU.13.a: "“……下锚，抓紧时间抢修发动机。”"


