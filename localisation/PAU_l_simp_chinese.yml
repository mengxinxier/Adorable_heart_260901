 PAU_baiye_state:0 "白夜的庇护"
 PAU_baiye_state_desc:0 "这里还留着那个白毛小家伙打滚蹭过的痕迹。说来也怪，它逗留过的地方，空气里那股难闻的死尸味居然真的消散了。路口的小摊重新飘出了烤鱼和米糕的香味，看着那只天天趴在台阶上晒太阳的大毛团，担惊受怕了很久的街坊邻里，总算能踏踏实实喘上一口气啦。"

PAU_annex_debuff:0 "受雇作战期间"
 PAU_annex_debuff_desc:0 "在合同期内，我们只是受雇协助作战的部队，不能借机占领雇主的土地。不过既然不用操心地方上的管理事务，部队倒是可以把精力全都放在眼前的战事上。"

 PAU_guyong_debuff:0 "信誉受损"
 PAU_guyong_debuff_desc:0 "这次的合同没能按期完成，不仅事先谈好的报酬落了空，队伍里也开始出现不安的情绪，各种怀疑和抱怨在私底下悄悄传开了。"

 PAU_guyong_buff:0 "接管阵地"
 PAU_guyong_buff_desc:0 "对面的雇佣军撤走之后，留下的工事和没来得及带走的补给全都落到了我们手里，前线的压力总算减轻了不少。"
####国策与事件####
#政治线国策v
PAU_tx: "又是……欠条！"
PAU_tx_desc: "王室送来的信件写得明明白白，结款的日期又被那帮狗东西往后推了。\n大家现在都空着肚子，脾气自然好不到哪去。可要是现在撂挑子走人，这里的营地立刻就得散伙，我们谁都不想同时被王室和晓枫一起追着咬。于是只能先把催款信塞回抽屉，顺便交代炊事班往汤锅里多舀几勺水，先把接下来这顿饭应付过去再说。"

PAU.1.t: "多么荒唐的来客"
PAU.1.d: "面饼烤得太老了。\n此时此刻，我正用后槽牙磨着那块焦硬的饼皮，就着水壶里的凉水往下咽着。\n巴罗站在旁边，手里还拿着刚才从信差手里接回来的信封。\n“阿夏长官，王都那边的批条……”\n“别念了。”\n我把水壶塞子拧上，面无表情地打断了他。\n“闭着眼睛都知道写着什么。无非是让大家再发扬一下军人精神，多顶几个星期。”\n“……你猜得挺准。他们还附了一份前线慰问致辞。”\n“留着生火吧。今天晚上风还挺大的，煤棚那边正好缺一点引火用的纸。”\n话音刚落，我不禁又望起了远处卡卡罗姆山谷的冷光。\n晓枫带着人退进那片山谷已经很久了。临走前她在指挥所指着我的鼻子骂着，说我们这帮守合同的老兵迟早要被内廷当成擦过鞋底的臭抹布扔了。\n当时我用枪指着她的脑袋跟她顶嘴。现在想想，真是傻透了。\n——铛、铛、铛。\n门岗上的手摇铃毫无征兆地响了起来。\n摇铃的卫兵力道乱七八糟，听着毫无章法。\n“阿夏长官！门口……来了个奇怪的家伙！”\n“信差又折回来了？”\n我一边把没啃完的干粮塞进上衣口袋，一边起身往外走着，“还是山里的游击队迷路了？”\n“都不是……您自己来看看吧。”"
PAU.1.a: "把枪放低，让她进来吧"

PAU.1000.t: "多么荒唐的来客"
PAU.1000.d: "我踩着泥泞的碎石路走到了营区栅栏前。\n值班的两个哨兵正端着上了膛的步枪，脸上的表情说不出是紧张还是想笑。\n铁丝网外面站着一个姑娘。\n白头发，个头不高，身上套着一件宽大得不像话的风衣，肩头上还趴着一团长软毛的白东西。\n她正把两只手搭在生锈的铁丝网上，垫着脚尖往厨房的方向使劲瞅着，那只大衣领口里的小毛球也跟着探头探脑。\n看见我走过来，她不仅没往后躲，反而咧开嘴，特别用力地冲我挥动起了胳膊。\n“打扰啦——！”\n她的嗓门清脆得让人耳朵疼，直接把哨塔上的野鸽子给惊飞了。\n“顺着山路走了好久好久，总算看见有烟囱的地方啦！那个……请问这里是饭馆吗？有食堂也可以！能匀我一口饭吃吗？我有带钱的哦！”\n几个哨兵全看傻了眼，端着枪不知所措地站在原地。\n在这片除了炸药味、烂泥巴味和废纸条的死人谷里，居然有人背着行囊，把架着机枪的重装步兵哨卡当成了路边的面摊。\n“……她脑子正常么？”\n“报告阿夏长官，她刚来的时候还问过我，门口挂着的旗子是不是招牌菜的幌子。”\n铁丝网外的白发少女已经从口袋里摸出了两枚硬币，在掌心里摊开，笑得眼睛弯成了两条缝。\n“你看，我真没吃白食的意思。哪怕只有冷水泡饭也行呀，我家这个小家伙饿得连尾巴都摇不动啦。”\n她肩头那团圆胖的白毛像是为了配合她，当场打了个毫无诚意的假哈欠，四条短腿缩进风衣，蜷成了一个球。\n在扫了一眼她手心里的硬币，以及她风衣下摆的灰之后，我说：\n“把枪放下。”\n我拉开了铁丝网门上的插销。\n“……进来吧。只有盐水，要喝就喝，不喝自己滚。”"
PAU.1000.a: "……"

PAU.2.t: "另一种可能"
PAU.2.d: "“如果换作是王室的宪兵，你现在已经被抓起来关进大牢了。”我对着用勺子在碗里刮过了最后一圈的少女打趣道。\n少女自己只喝了苦涩的盐水，她把仅有的两片烂菜叶掐碎，塞进了领口里的小动物嘴里。\n“多谢款待。虽说除了盐味就没尝出别的，但喝下去浑身都热乎起来了呢。”\n她眼神里那股嬉皮笑脸的劲头忽然收敛了起来：“那么，作为这顿饭的报酬……”\n“我可以告诉你们一件足以让你们所有人继续活命的天大消息。”\n“有话快说有屁快放，少卖关子。”我从烟盒里敲出一根烟叼在了嘴里。\n\n“其实王室答应给你们拨过来的口粮，上周就已经在海港被扣下了。”\n我划火柴的动作停住了。\n少女从风衣兜里摸出一张盖着海关印的货运提单摊在了桌上，\n“运粮船里面根本就没装麦子，甲板底下装的都是给内廷贵族过冬用的葡萄酒和熏肉。那些大臣给你们寄欠条，无非是想把你们钉在阵地上，替王都挡住山里的游击队罢了。”\n“山谷那边的晓枫也没什么吃的了，但她就等着你们的库存见底。只要你们饿得拉不开枪栓，她的队伍就会顺着公路反攻过来。”\n\n“你从哪弄到这东西的？”\n“顺手捡来的呀。”少女把头偏向一边，“我们在外海漂了好久，刚好撞见王室的走私船抛锚。不过阿夏长官，比起货单，更要命的是你们。”\n她伸手指向窗外那些蹲在台阶上喝汤的年轻士兵。\n“老军团长不在了，晓枫也带着人走了。留在营地里的这些人，既没有可以效忠的祖国，也拿不到卖命的赏钱，只能每天守着空枪饿肚子，不是吗？”\n少女将桌上的提单折好收起，直视着我的眼睛：\n“阿夏长官，你打算带着大家在这里坐着等死，还是换个真正有出路的活法？”"
PAU.2.a: "……说说你的条件吧"

PAU.3.t: "谁要给外人当枪使"
PAU.3.d: "“换个雇主？”我把空碗推到了一旁，“是去给海上的殖民者卖命，还是像呆子一样转身投靠北边的魔法少女？”\n“都不对。”\n她摇摇头，又从兜里掏出一张叠好的路线图，在桌面上摊开。\n“给别人卖命，迟早会被当成耗材扔掉。晓枫是对的，你们老团长也是对的，只有傻子才会一直给外人当枪使。”\n她伸手按在沿海公路的一处岔路口上，那是王室用来中转出口物资的军需仓库。\n“他们既然不发军饷，为什么还要替他们守门？那里的仓库里囤着能吃几个月的麦粉和肉罐头，还有几大罐准备运往海对面的燃油。”\n“动了王室的仓库，那我们就成和晓枫一伙的了。”\n“明明是他们先赖账的。”\n“雇佣契约上白纸黑字写着拿钱办事。既然他们连饭都不给，你们自己去厨房端菜也是天经地义的吧？”\n“抢了之后呢？”\n“就算能撑过这阵子，等王都的火炮和公社的红军两头包夹过来，我们照样无路可走。”\n“那就去港口。”少女在地图最东边画了一个圆圈，“外海有两艘能开动的船答应接应我。只要先占下码头、打通航道，至少就没人能轻易把你们堵死在这片山里。”\n“两艘船能装下几百号人？谁在船上指挥？要是到了码头才发现走不了，我们可是连退路都没有了。”\n小遥的正准备挪开的手顿住了，随即又笑了起来：“船既然能开到外海，就总有办法嘛。先把仓库拿下来再说，难道我们还能继续留在这里等到饿死嘛？”\n她说得轻巧，仿佛只要先把眼前这一步走出去，后面的难题就会自己找到解法。\n我盯了她一眼，但没有继续追问了。营地里饿得连枪栓都快拉不动的人就在窗外，我已经没有多少可供挑剔的选项。\n她收回了手指，随后郑重得看着我：\n“到时候你们就是一支自己说了算的队伍。有饭吃，有油用，还能把武器换成机床零件，有一套自己的……”“图纸留给我。”\n“等天黑了，我叫几个队长过来开会。”"
PAU.3.a: "另外，要是敢耍花招，\n我第一个请你吃枪子"

PAU_qxjd: "不借也得借"
PAU_qxjd_desc: "卡卡罗姆矿区是去往东部公路唯一的关口。晓枫不可能把根据地的咽喉让出来，我们也没法放弃那条运粮的活路。现在双方都退到了悬崖边上，我们只能靠大炮和子弹来决定谁能活着走过去了。"

PAU.4.t: "二百码开外"
PAU.4.d: "“测距二百码。”\n巴罗把测距板递给了我。\n“要现在开炮吗，阿夏长官？”\n我举起望远镜，望向了对面山梁上隐约闪烁的红光。\n晓枫在那座山梁上布设了阻截阵地。她以为我们是奉了王室严令前来围剿的走狗，也清楚我们要去抢夺物资，无论这些物资是来自于谁的，我也清楚她不会把这条命脉让出来。\n我们都在为了自己身后那些人的命，把枪口对准曾经最熟悉的人。\n“真要动手啊？就不能谈谈吗？”\n小遥靠在车厢旁，一边翻着路线图一边说道。\n“对方是你的同僚吧。”\n“正因为是当年的参谋长，她比谁都懂。”\n“她封死了下山的路，我们车库的油料也撑不过几周了。双方都退到了悬崖边上，枪声一响，谁先手软谁就得饿死在这道峡谷里。”\n山梁上突然亮起一串橘红色的火光。一梭子机枪子弹贴着车顶扫过，当场把卡车左边的后视镜打得粉碎。\n这是晓枫正在划出界线。只要我们的车轮再往前滚过哪怕十米，整道山梁的火力就会立刻迎头砸落下来。\n“不准瞄准掩体人员。目标对准两侧道路落石，把两边的石头全都给我打碎了，给卡车推平通道！”"
PAU.4.a: "开火"

PAU_sdft: "别装老实人"
PAU_sdft_desc: "车库里那些履带车已经停了不知道多久了，车门上还贴着王室盖了红印的白纸封条呢。以前不动它们，是因为燃油不够用，也是为了维系表面上的安分。但如今我们要是想活命的话，就没法再继续装起老实人了。把坦克都开出来吧，不管是王室的还是我们的，能给我们杀出一条路来就行。"

PAU.5.t: "熟悉的声音"
PAU.5.d: "随着老掉牙的起动机接连咳嗽了好几声，它的尾气管终于喷出了浓烈的黑烟。\n车库大门的铁链被拽得哗啦作响，几辆轻型坦克缓慢地挪到了空地上，车体侧面的金鹰徽记依旧油光发亮的样子。\n巴罗手里拎着黑漆桶，踩在挡泥板上问：\n“阿夏长官，这老鹰标记……要不要先用油漆抹掉？前面就是晓枫的阵地了，要是让她看见了……”\n“费那劲干什么。”\n我扣紧防风镜的带子，用被发动机的轰鸣盖得很闷的声音说道：\n“只要引擎声一响，晓枫闭着眼睛都知道来的是什么车。当年这底盘散热孔开多大、每块钢板垫多厚，都是她亲手画的图纸。你就算在车头上画满小花，她也认得出这死动静。”\n巴罗听完，挠着脖子把漆桶随手挪在了路边，不再言语。\n山梁上的信号火光依旧明亮，透过望远镜看去，山坡正上方插着一面崭新的红旗。\n晓枫这会儿肯定也在掩体后面举着望远镜和我们对视呢。\n在她眼里，事实明摆着。当年在工区街道上碾死工人的是这批车，现在开进卡卡罗姆、准备轰开她家大门的，也是这批车。\n“真残忍呢，阿夏，就不能再谈谈吗？”\n小遥两手插在风衣口袋里靠在车棚的柱子旁，用带着点事不关己的态度调侃着：\n“从山上看过来，你们简直就像王室养的最听话的狗呢。”\n“快闭嘴吧你。能谈早谈了，用不着你这白毛丫头指手画脚。”\n说完，我踩着踏板翻上车顶，弯腰钻进了狭窄的炮塔里。\n随着金属顶盖砰的一声关上，风、尘土和草腥味都被隔绝在了外面。\n拉过通话器的软管，我对着麦克风开始了吩咐：\n“各车拉开距离，谁也不准熄火掉队。”\n“听到的……就踩紧油门，在我屁股后面跟紧了。”"
PAU.5.a: "现在，我们的大门彻底关上了"

PAU_sdjt: "在山谷那一边"
PAU_sdjt_desc: "矿区入口的枪声终于停下来了，在我们把路面上的碎石和弹壳清理完后。我怀着复杂的心情来到了扣着晓枫的值班室里，几个负责看押的卫兵正站在门口等着我的发落。是用她的人头去王室领赏换取口粮，还是带上这个昔日的同僚一起去海港抢货，必须在天亮前拿个主意。"

PAU.6.t: "请松绑吧"
PAU.6.d: "来到营地，晓枫正坐在靠墙的椅子上，她的两只手腕被麻绳紧捆在了椅背后面，刚才我们的坦克推平路障冲上山梁时，这位昔日的参谋长独自一人提着一把打空了子弹的步枪站在路中，逼停了巴罗的头车。\n“王室开给你的赏金可不低。”我拖过一张折叠椅坐在了她面前，“用你的脑袋换来的钱，足够给后面整支车队加满油吃饱饭了。”\n“木棉团长走前，交代你护好留下的兄弟姐妹。阿夏，你就真打算带着那帮老兵，给王室当一辈子撕咬同胞的看门狗？”\n“少拿木棉团长压我。”\n“还把压箱底的轻坦都给拉出来了……阿夏，你营地里的存粮撑不过今天了吧？“\n晓枫越过我的肩膀看了一眼门外的履带印，\n“你要是真想领赏，刚才在山上就该把炮弹直接灌进矿洞。你现在连把战车开回王都的油料都不够，别虚张声势了。”\n被她一口戳破底牌的烦躁涌上心头，还没等我发作，门口突然传来急促的脚步声。\n小遥踢开门帘闯进来，走到晓枫身后亮出一柄小折刀，刀刃一挑就把麻绳割断了。\n“长官？！”\n门口的卫兵条件反射地端起了枪。\n“小遥，你干什么！？”我立马按住枪套站了起来。\n“松绑呀，反正王室的赏金你们一分也领不到啦。”\n小遥收起折刀，从风衣内袋里抽出一份截获的加急密电拍在了桌上，\n“卡卡罗姆艾瑞波拉这片地王室早就打算扔掉不管了。要是阿夏今天没带队强攻打通山道，再过几天赶到这里的，就是索拉娜的亡灵尸潮。你们谁也逃不掉的。”\n“商会…亡灵……”\n晓枫活动着手腕抓起桌上的密电，冷笑了一声，\n“阿夏，搞了半天你根本没接王室的清剿令，反倒被这个不知道打哪儿冒出来的小丫头忽悠着，要去抢王室的仓库？”\n我盯着桌上那份密码印鉴，整个人都变得恍惚了起来。\n“看来王都的欠条终于把你们逼上绝路了。”\n晓枫把密电扔回桌面，\n“你想去码头抢油抢粮，那就去吧；但卡卡罗姆矿道里还有几百名罢工工人和伤员。你要是不把他们一起带走，我就留在这里。等亡灵漫过来，我带他们一起去见死掉的木棉团长。”"
PAU.6.a: "带上她吧，我们抓紧时间去港口"
PAU.6.b: "先封锁道路，然后我们再去港口"
pau_wlxz: "§R亡灵将会直接对我们宣战§!"
pau_wljy: "§R亡灵将会以决议的形式蚕食我们§!"

PAU_ddjr: "我们多带几个人吧"
PAU_ddjr_desc: "晓枫不肯一个人上车，卡车上的篷布底下也还能再挤一挤。燃油不多，但卸掉后排几箱子弹，就能多腾出位置拉上几个人。至于北边公社的雪伊……只能在无线电里给她留个通报，能不能从亡灵嘴里杀出一条路，就全凭她自己的本事了。"

PAU.7.t: "人命与子弹"
PAU.7.d: "“车队根本装不下这么多人。现有的油只够一口气跑到海港，多拉这么多号人，到时候都得趴窝在路上当活靶子。”\n“阿夏。你们后排那几辆卡车装的全是备用炮弹和机枪弹箱，把那些死沉的铁疙瘩卸下来，腾出的载重足够把矿道里的伤员和工人全拉上的。”\n“把备用弹药卸了？万一路上撞上王室的追兵或者亡灵，你让我手底下的兵拿石头去砸吗？！”\n“哎呀，阿夏长官，不是这么算的嘛！几箱子弹拉到船上只能占地方生锈，可晓枫手下这些懂车床、会修引擎的熟练工到了船上，每天都能帮你们干活抵船费呢！”\n“行吧。”我冲走廊外头的巴罗招起了手：\n“去通知后排卡车，把备用弹药箱推下去！拆掉几块挡板，让能走动路的爬进车厢，挤不下的就把车栏杆扶紧了，中途掉下去了我们可不会减速去捡！”\n巴罗领命跑出走廊，晓枫已经走到桌前，把桌上的通信机插进了信号塔的备用电瓶组里。\n“矿区这边是塞上车了，北边的雪伊呢？王室一没，索拉娜的尸群顺着铁路很快就会压向她的工厂区吧？”我继续问道。\n“现在掉头往北开，除了把我们这些人全送进去，谁也救不下来。”\n“那你就这么不管她了？”\n“雪伊不是傻子，看到王都方向的黑烟，她自己就会带人往外突围。我把这台发报机留在矿顶的信号塔上，向他们全天循环播报车队的撤退路线和海港坐标。她要是能杀出来，自然会顺着车轮印追上我们；要是杀不出来……我们去了也只是多搭上几条命的。”\n门外传来了卡车引擎接连打火的轰鸣声，小遥扒着门框把头探了进来：\n“两位长官，弹药箱已经全推下山沟啦！再不走的话，连我们自己都要赶不上退潮的船咯！”"
PAU.7.a: "我们走吧"

PAU_zbgk: "开往海港的道路"
PAU_zbgk_desc: "为了安全起见，卡车的大灯已经全部关上了，几十辆车正顺着沿海公路全速前进着。车厢里挤得连转个身都费劲，车轮碾过坑洼时能听见悬挂嘎吱作响的哀鸣。北边天际线上的黑烟越来越浓，那是王都被尸潮吞没的火光。晓枫坐在副驾驶上盯着里程表，小遥在后面哼着家乡的调子。我们谁也没心思回头再看，所有的活路都被系在了港口的那批燃油和粮食上了。"

PAU.8.t: "快把大门钥匙交出来"
PAU.8.d: "车队刚在港区货栈门前停稳，几个提着马灯从哨房跑出来的王室看守还没来得及拔枪，就被跳下车的老兵堵在了墙根底下。\n“你们是哪个部队的？！这里是王都封存的军需库，没有内廷的调令谁也不准碰！”\n“还惦记着你们的内廷呢？北边的黑烟没看见吗，王都早就让怪物给冲烂了。不想死在这儿就把大门钥匙交出来。”\n“我、我哪有钥匙啊！管库房的港务长天黑前就跑路了，我们也是被扔下看大门的！”\n“跑了？”\n“跟一个看大门的费什么话，把撬棍递给我。”\n晓枫从车厢后面拎过撬棍插进锁扣，两个矿工上前搭了把手，挂锁当场被拧断在了地上。\n大门推开，里头整齐码着成排的木箱与柴油桶，小遥立马从车厢边沿跳下来凑了过去。\n“哇，光是这排大油桶就够你们的车队喝饱了吧？我就说王室把好东西全藏在栈桥这边了，阿夏长官，现在总算可以把顶在我后背上的枪口挪开了吧？”\n“少贫嘴。巴罗，带几个人把油桶滚出来，先把每辆车的油箱灌满，剩下的粮食和罐头直接往后车搬！”\n“等一下嘛，你们光顾着往卡车上搬，不抬头看看海面上吗？”\n海雾深处传来了低沉的船笛声，紧接着两道探照灯光柱破开夜色打在码头栈桥上，照出了两艘缓慢驶入锚地的军舰。\n“看见没有？我就说外海有船接应我吧！粮仓给你们找着了，大船也准时到了，我可是一句假话都没跟你们说哦！”\n“连船头的舷号都拿黑漆涂掉了……看来你这帮同乡也不是什么正经路数。”\n“管它正不正经，能装人、能开走不就行啦！”\n“阿夏，现在物资和船都在眼前了，你打算怎么办？是直接登船离开这片烂地，还是拿这批军需把港口变成下一个阵地？”"
PAU.8.a: "加油去，别的事待会儿再说"

PAU_jmyx: "饱饭之后"
PAU_jmyx_desc: "在战士和工人们提着油桶轮流给每辆车灌满之后，由于好几个月都没闻到过真正的饭菜香味，大家都围坐在了集装箱旁边狼吞虎咽着，甚至连掉在衣服上的肉碎都捏起来吃了。樱花的运输舰也在栈桥边放下了登船跳板，他们的水手正忙着清点登船人数。我们的油加满了，我们的肚子也饱了，所以我们谁也没法装作听不见北面铁路线上传来的求救信号。"


PAU.9.t: "跳板搭稳时"
PAU.9.d: "工人们手里捧着刚用热水烫过的牛肉罐头坐在仓库门前的空地上，呼哧呼哧吃得满嘴是油。几个缠着绷带的年轻士兵也在互相碰着拳头庆祝好不容易得来的休整，这种热闹我们在艾瑞波拉已经好几个月没见过了。\n小遥站在运输舰放下的跳板旁，朝我招起了手：\n“底舱腾出了好几个够你们睡大觉的隔间，里面淡水和饼干也都管够呢。阿夏，你们的人和车现在就能排队上船了哦。”\n是啊，只要上船，这帮跟着我受苦受累的兄弟姐妹就能彻底从这鸟不拉屎的地方脱身了。\n可谁又能保证这艘船会把我们带去什么地方呢？\n就在我犹豫的时候，港务室的门突然被晓枫推开了。\n“阿夏，过来听一下，矿顶广播的那个频段有人回话了。”\n“谁？雪伊？”\n“嗯。”晓枫把步话机的耳机递到我耳边，“北边的工业区彻底完蛋了。雪伊为了掩护工人们的家属往港口后撤，自己带着车队把尸潮主力引到了沿河的铁路，她们手里就只剩下几辆卡车，弹药也快打光了。”\n耳机里传来了刺耳的电流杂音，隐约能听到雪伊在另一端的嘶吼，伴随着密集的机枪点射和撞击声。\n小遥不紧不慢地走下跳板，站到了我们两人中间：\n“舰队必须赶在退潮前出港。要是亡灵主力涌进港区，樱花军舰会立刻收起跳板离港。我们的任务是接走你们，可没义务替游击队打阻击战啊。”\n晓枫把手里的耳机递得更近了些：\n“雪伊只要能冲过跨河桥，就能甩开后面的亡灵追兵。但那座桥在王室撤退时被炸塌了，车根本开不过来。”\n听到此话，原本还在说笑的士兵和工人们渐渐安静了下来，全都停下手里的动作看向了我。"
PAU.9.a: "……二连留下来装船，其余人跟我上车接人"
PAU.9.b: "……收起跳板，我们立刻开船"
PAU.9.b_tt: "§R该路线暂未完成！！！§!"

PAU_zjwyj: "救人还得先算违约金？"
PAU_zjwyj_desc: "擅自掉头去救人等于把整个樱花舰队拖在浅水区当靶子，按规矩要赔上好几倍的运费。但是……"


PAU.10.t: "副驾驶"
PAU.10.d: "我刚挂上挡松开手刹，小遥已经拉开副驾驶车门，拎着旅行包和那只白毛团子直接挤了进来。\n“你上来干嘛？船不等潮水了？”\n“开船的指令我推迟啦。话说在前头，阿夏长官，擅自带着主力掉头救人，在合同里可是叫严重违约的哦。”\n“违约金记我账上，以后打工还你就是了。要是怕死的话，趁我现在还没把油门踩到底，赶紧跳下去。”\n“打工？拿你在泥巴里打滚的那点薪水，打算还到下个世纪去吗？”\n“嫌慢就走。晓枫，去跨河桥走哪条道最快？”\n“顺着左边那条运煤道抄过去能省十分钟，但北岸这会儿肯定全是尸群，光靠我们这几辆卡车硬冲过去就是送死。”\n“那就先让人把北岸扫干净嘛。”\n小遥把旅行包塞到脚底下，从风衣里摸出步话机按下了开关：\n“藤井，听得见吗？主炮解除待命，照着沿河铁路线的北岸给我轰过去！”\n“小遥？！我们刚把锅炉点着准备出港啊！……算了！瞎猫碰死耗子，你们在岸上自己找掩护！”\n“听见了吧，阿夏长官？救人的炮弹损耗也全算在你的债务账单里，等到了樱花，你手下这帮人每天都得老老实实去厂里上班！”\n她话音未落，海湾方向便炸响了两声闷雷，重炮炮弹呼啸着越过车顶，直接在北面山脊上掀起了两团赤红的火光。\n“……雪伊要是听见这动静，八成还以为又是哪路王室舰队开过来要她的命了。”\n“那也得等她先保住命再说。把扶手抓稳了，我们要冲过去了！”"
PAU.10.a: "去把那个跑不动的家伙捞回来"

PAU.11.t: "断桥"
PAU.11.d: "卡车刚在断桥这头刹稳，晓枫已经推开车门冲到了垮塌的钢梁边缘。对岸铁轨旁侧翻的货车还在冒着浓烟，躲在桥墩后面的身影立刻抬起长枪，剧烈咳嗽着冲这边吼道：\n“对面的是谁？！我手里的枪可不长眼睛！”\n“雪伊！把枪放下，是我！”\n“晓枫？！你没死？……等等，王室的狗腿子怎么也在旁边？！你又叛变回去了？！你们是来拿我换赏钱的？！”\n“少在那边废话！王都早让怪物给吃了，谁有闲心抓你去换钱！巴罗，把车头绞盘的钢缆卸下来，顺着引绳给对岸甩过去！雪伊，把挂钩卡死在你们那头的枕木上，能动的抓紧绳子爬过来，动不了的绑在腰上，我们这边拉！”\n“动作要快哦！战舰的炮弹很贵，舰队只答应掩护十五分钟，超时了大家都要留在这儿喂亡灵呢！”\n车头的绞盘绷得笔直，十几个满身血泥的公社伤员顺着钢缆被接连拖过了几米宽的断口。等殿后的雪伊刚被老兵拽上桥头，对岸的废墟里忽然涌出一大片亡灵，顺着枕木直接扑上了钢缆。\n“再拉快点！后面还有两个学徒工没过来，他们的脚已经悬空了！”\n“拉不动了！长官，对面的怪物全挂在钢缆上在往前爬，桥上残存的钢梁快被拽塌了！”\n“继续拉！那边还有人！”\n“不能再拉了！钢梁一垮，整个桥的人都得被一起拖下去！把撬棍给我！”\n“阿夏，等等！他们还抓着绳子呢，你给我住手！”\n“松手，晓枫！再晚几秒怪物就顺着绳子爬过来了！”\n我用力挣开晓枫，冲到锚点旁抄起撬棍朝绞盘的固定卡扣全力砸了下去。卡扣当场崩开，拉紧的钢缆直接甩脱出去，那两个人影随即带着身后的亡灵一起坠进了江雾，被湍流吞没了进去。\n最后被拉过来的雪伊扶着栏杆站稳，睁大眼睛望着被江雾吞没的对岸：\n“……阿夏。”\n我把一盒热好的牛肉罐头塞进了她的怀里：\n“我没指望你就这么算了。不过，还是先吃点东西再说吧。”"
PAU.11.a: "“现在，所有人上车，登船。”"

PAU_zmxx: "装满鲜血的罐头"
PAU_zmxx_desc: "撤回港口的卡车还没熄火，车厢里就吵翻了天。脱险的侥幸被对岸留下的血腥味冲得干干净净。雪伊不肯咽下军团分发的口粮，指着车厢里的伤员厉声质问。卡卡罗姆阵地上被炮火轰碎的工事、桥北岸没能抓牢缆绳的同伴，成了横在所有人中间拔不掉的钉子。谁也没法替死在路上的兄弟姐妹大度地假装一切都没有发生。"

PAU.12.t: "谁留在对岸"
PAU.12.d: "返程车队刚在港口停稳，后车厢的帆布底下就传来了一阵压抑的咳嗽声。十几个满身湿透的伤员挤在车厢里，身上还往下淌着混了血的泥水。雪伊就瘫坐在车尾板旁边，怀里紧抱着刚才塞给她的那个牛肉罐头。\n看见我和晓枫走过来，雪伊才慢慢抬起脸，脸上早已分不清是雨水还是眼泪了：\n“晓枫……死掉的那两个，是工厂的学徒工，他们连双像样的鞋子都没有。他们的师傅老罗根，是为了给卡车垫后才被怪物扑进水里的……明明就差最后几步了，再拉一把就能上来了，怎么能说扔就扔下呢？”\n“当时如果不断开钢缆，那群怪物几分钟就能顺着爬过来，到时候我们所有人都得留在那里的。”\n“我知道！我知道你算得对！你每次都算得那么清楚！可为什么留下的是他们？！凭什么开枪断后的是他们，坐在车里活着吃肉的是我们？！”\n“砸开钢缆的人就在这儿站着，你冲她吼什么？”\n我迎着雪伊瞪过来的视线继续说道：\n“在卡卡罗姆开炮清路的是我，在桥上下令弃车断缆的也是我。你想发火就冲着我来，少在这里冲着晓枫发难，她手里的枪早就被我缴了。”\n两人僵持间，一直守在跳板旁的小遥看了一眼栈桥边的水位线，开口提醒道：\n“港口的军舰已经在催人了。距离潮水退去只剩最后几分钟，想吵架的话，等所有人都活下来，到了船舱里有的是时间吵。”\n晓枫走到车厢边缘，朝雪伊伸出了手：\n“下车吧，雪伊。把眼泪擦了，我们去帮后勤队抬担架去。”\n雪伊避开了晓枫伸过来的手，自己扶着栏杆摇摇晃晃地站了起来。她翻下车厢，抱紧那罐一口没动的罐头走向了跳板前等着登船的伤员们。"
PAU.12.a: "“去核对登船名单，一个名字都不许漏。”"

PAU_jjka: "紧急靠岸"
PAU_jjka_desc: "谁也没料到亡灵会从海底浮上来。虽然靠震退了爬上船舷的亡灵，但尾舵已经在撞击中变形卡死，海水也顺着裂缝往轮机舱里灌了进来。凭这副破损的船体根本不可能横穿大海，船队只能顺着航标灯，驶进圣杯王国设在孤岛上的前哨站里。"

PAU.13.t: "按圣杯的规矩办"
PAU.13.d: "船底传来第一声撞击时，大家还以为只是碰上了暗礁。紧接着，第二声、第三声，海水就顺着裂缝灌进了轮机舱内。随着甲板上的探照灯打向水面，能看见海里浮着不少缠在沉船残骸上的死尸，几具骷髅甚至抓着船舷的排水孔往上爬上了船。\n眼看它们就要翻过船舷，趴在小遥肩头的小动物跳上栏杆，冲着水面叫了一声。原本扒在船舷上的几具骷髅像被什么东西撞开一样掉回了海里，它自己也耗光了力气，缩回小遥怀里不动了。\n虽然摆脱了水下的亡灵，但船尾的舵面已经被水下残骸撞歪卡死，没法继续远航。等到天亮，船队只能顺着航标灯，驶进圣杯王国设在近海孤岛上的基地。\n船刚进港，巡逻艇的喇叭就传出通告，一名穿海军常服的圣杯军官带着卫兵走上跳板前说道：\n“船身有死灵污染的痕迹。按战时卫生条例，我必须拒绝未登记的武装难民入港，请立刻掉头离开警戒水域。”\n“掉头？我们的底舱还在进水，现在把我们赶回外海，跟直接让我们沉在海里有什么区别？！”\n“条例就是条例，皇家海军没有收容难民的义务。”\n“谁说我们是难民了？”\n小遥按住我搭在枪套上的手，把一份盖着印章的公函递到了军官面前：\n“我是樱花派遣的随船全权代表春日小遥。这几艘船登记在我们的护航名册下，船上的人员属于受公约保护的随船技工。”\n圣杯军官扫了一眼印章，就换上了公事公办的语气：\n“既然持有正规使节公函，港口可以依照避难条约为你们提供船坞与消杀药品。但入港税照旧，我们要征收货舱里五成的物资作为停泊与消杀的担保。”\n“五成？！那些是我们拼了命才从仓库里运出来的——”\n“可以，按你们的规矩办。”\n小遥拉住我的胳膊，在停泊单上签下名字递还了回去：\n“单据签好了，请立刻接通岸上的维修电缆，安排伤员治伤。”"
PAU.13.a: "至少……大家暂时不用沉进海底喂鱼了"

PAU_wcka: "老家根本回不去了"
PAU_wcka_desc: "拿口粮换来的停泊许可撑不了几天，几千名兄弟姐妹还在舱底等着出发的口令，我们已经不能再等下去了。于是，我们利用船上的发报机，向小遥所在的樱花建立起了联系。"

PAU.14.t: "缉捕名单"
PAU.14.d: "“小遥姐姐……广播里反反复复放着的明明都是军乐，报出来的也明明都是叛徒被捕的名单，樱花码头工会那边根本没人回话呀……”\n在同一时间，晓枫也把那份文件推到了小遥的眼皮底下：\n“上面的商会印章几年前就作废了，樱花根本没派过所谓的官方使节。这支船队到底是谁调来的？”\n“所以，你带着我们在山道上拼命，又割掉一半物资给圣杯交税，结果海对面的码头我们根本靠不上去？”\n“……对，公函是我偷刻了印章伪造的。”\n小遥终于带着快要崩溃的声音开口了。\n“可我有什么办法？！老家那边天天被警察封锁，大家连饭都吃不上了！藤井他们好不容易把船开出来，我……我只是想带懂打仗的人回去帮大家救命啊！”\n“我要是老老实实跑到你们营地去要饭，说我只是个被通缉的穷学生，阿夏你会把坦克开下山吗…你们谁会多看我一眼嘛……”\n“我原本以为……只要带你们回去，工会就能挺过去……我怎么知道那帮发疯的军官会突然开枪政变啊……我怎么知道他们几天就把老家彻底变成军营了啊……”\n“反正事情是我搞砸了。你们要是觉得被我骗了，现在就把罪名加在我身上把我捆了送去给王室领赏，或者直接捆了扔下海，我没话说！”\n“行了，少在这儿演英雄受刑的戏码。”\n靠在门边换药的雪伊嗤笑了一声，\n“当年的王室比你会算计得多，我们还不至于蠢到拿一个小姑娘的脑袋去讨好它们。”\n“用不着把什么罪名都往自己身上揽，小遥。卡卡罗姆那一仗，就算你没来，阿夏为了手底下士兵的活路也会跟我们鱼死网破的，我也不可能就此把那里让出去。那是迟早要撞上的坎。”\n晓枫把海图摊开在桌上，指向了上面被红笔封死的航线，\n“所以我们现在的麻烦是，南美大陆回不去了，你们的老家也彻底变成了疯子军管的死路。至于你欠我们的，可不是像你说的那样一下子就能解决的事，等以后找到能落脚的地方再说吧。”"
PAU.14.a: "“我们得重新商量怎么活下去。”"

PAU.15.t: "你到底是个什么来头"
PAU.15.d: "我拽着小遥走到仓库后方的背风拐角。等走廊里的脚步声彻底走远，我才靠在栏杆上点着了一支烟，\n“公函的事晓枫已经挑明了。我现在只想知道两件事。”\n我吐出一口烟气：\n“第一，你一个小丫头，到底是怎么摸清我和晓枫的底细，甚至连王室那个隐蔽军需库都摸得一清二楚的？”\n小遥把下巴埋在了领口里：\n“王室走私船的大副是个酒鬼，喝醉了把随船文件全落在了舱里。单子上写得很明确，王室把换来的军需囤在了卡卡罗姆沿海公路的转运栈桥。藤井他们只懂开船，陆战根本摸不进守备森严的铁网，所以我才要找懂行的人带路破门。”\n我掐灭烟头，抬手指向了她风衣领口里缩着的那团白毛：\n“第二，这只毛团到底是什么来头？在山道上能提前察觉到亡灵，在深海里甚至能把爬上锚链的水鬼震下去，它也是你从走私船里捡来的？”\n小遥拉开风衣领口，轻轻顺着那个小动物背上的软毛：\n“它叫白夜，是后山神社里代代养着的山灵。我们的小镇因为经济萧条变得特别穷，神社因为交不上税就被警察贴上了封条。那帮收债的跟外国走私商签了合同，说是要把白夜装进笼子卖给巡回马戏团来抵债。我和同伴们看不下去了，就趁夜把它给偷出来了。”\n她把围巾解开，露出里面的白夜软趴趴蜷缩着的模样：\n“它天生对死气和恶念敏感。在山上，几十里外只要有怪物聚集，它就会立马炸毛，带我们挑没怪物的荒路走；在大海里，也是它拼命耗光了所有灵气护住龙骨……现在它累了，连耳朵都耷拉着动不了啦。”\n海风吹乱了她的白发，怀里的白夜正发出微弱的呜咽。\n看着眼前这个满嘴大话、怀里却护着一只小动物的落魄少女，我原本堵在胸口的火气也发不出来了。"
PAU.15.a: "“走吧，回屋里去，看看晓枫她们怎么说。”"

PAU.16.t: "掉转船头"
PAU.16.d: "“把坦克吊上岸不就行了，我们顺着铁路线直接就能抄死那帮怪物的后路！”\n刚到门口，雪伊的大嗓门就撞了过来。\n“然后让吃水深的大船在退潮时搁浅在烂泥滩上，大家跳进水里推船吗，雪伊同志？”\n“……晓枫！你能不能少泼点冷水？！”雪伊被噎得只能瞪起眼来。\n小果子急忙举手打圆场：\n“晓枫姐，雪伊姐，别吵啦！港口那边的通信又来消息了，是铁道编组站的留守工友发来的！”\n“多亏了雪伊姐之前把尸潮主力引向了断桥，港区趁机把几千名撤退家属全接进了海港的工厂！工人们把厂区大门焊死了，还顺手撬开了王室留在编组站的军械库！”\n“军械库？”我和小遥听见让人出乎意料的话语，一前一后跨进了门槛，“里面有什么？”\n“堆满了大口径炮弹和成箱的炸药！”小果子对着空气有模有样地比划着，“但工人们全是在车间摇机床的，根本没人会开炮瞄准，更没有能掩护步兵的战车！围在断桥的怪物群发现上当，正在调头往港口围过去的路上，大家快要顶不住了！”\n话音刚落，雪伊将手里罐头按在桌面上，咬牙切齿地低吼：\n“我们死在桥上的那些兄弟姐妹……就是为了保住船厂里那几千条人命！他们手里有炮弹，我们手里有坦克和正规炮手，杀回去正好里应外合！”\n“也对，索拉娜的力量失控了，海底下冒出的亡灵就是证据，她现在根本压不住那些怪物。主力早就全被拖在内陆王都打混战去了，沿海的防线早就已经空掉了。”晓枫在一旁补充道。\n不知为何立马就能弄清楚情况的小遥，也跟着摊起了手：\n“反正老家那边到处都在通缉我，我是回不去了。与其在大海上漂成淹死鬼，不如跟你们拼一把，好歹船上那两门大炮还能替你们开路呢。”\n\n“真拿你们这帮不怕死的没办法。去通知水手准备起锚，把坦克和剩下的弹药都固定好。”"
PAU.16.a: "那么，我们再相信自己一次吧"

PAU_dsyq: "现在，赌上我们的一切吧"
PAU_dsyq_desc: "离开那片土地的时候，我们是一群丢盔卸甲的逃亡者；\n而现在，翻滚的浪花正把我们推回那座燃烧中的故乡。\n前方的海岸线越来越近，每一门火炮都已经校准完毕……\n\n§R我们，该回家了。§!"
PAU_dsyq_tt: "§L白夜将会在所有它所庇护的地方为我们提供一份助力。\n请为此做好充足的准备，我们既可以依靠时间等待亡灵自我消散，也可以发动强攻提前消灭它们。§!"


PAU.17.t: "压根没有什么特派员"
PAU.17.d: "“小遥小姐，下次千万看好白夜，别让它再钻进配电箱了，电缆皮都差点被它当磨牙棒啃穿了。”\n甲板角落里，那只白毛团子正趴在小遥膝盖上打哈欠。\n我一边走上前，一边抬脚踢开了挡路的撬棍：“吊臂检修完没有？晓枫在前面核对水文航标，让我过来跟你们炮术长对一下你们………”\n年轻水手见我过来，心虚地瞄了一眼小遥，支支吾吾地开口：\n“这位长官……实话跟您说了吧，我们船上压根就没有什么炮术长。眼下掌舵的藤井是被海校退学的肄业生，我们几个上船前全是在底舱铲煤的锅炉工。虽说有两个负责安装炮塔底座的钳工，可来南美之前，谁也没在战场上开过火炮啊。”\n我手里的海图差点掉在甲板上。\n“……你说什么？”我扭头瞪向小遥，“那之前在断桥支援我们的那几轮舰炮是谁打的？！”\n小遥手里挑麻绳的动作僵住了。她抬起头，干笑了两声，视线往海面上乱飘：“哎呀，阿夏长官，别在意那些细节嘛。你看那天晚上不是炸得挺准的嘛……”\n旁边的锅炉工干脆把油抹布扔进铁桶，苦着脸把老底全掀了：\n“长官，那天晚上我们连测距仪怎么调都不知道！是藤井趴在炮管旁边拿望远镜对着火光瞎蒙的仰角，连打了六发才歪打正着砸中北岸！这船原本是政府向我们造船厂订购的巡防舰，结果船刚造好，内阁换届赖掉了尾款，银行要带警察把新舰按废铁拍卖，全厂工人连买米的钱都没了！藤井带着大家连夜把军舰开出来抵债的时候，连火控表的说明书都只带出来几页！”\n水手伸手指向缩成一团的小遥：\n“小遥小姐当时在码头掩护几个反抗拆迁的学生，被警察追得走投无路，顺着缆绳掉进了我们的运煤舱。我们本来只想跑来南美混口饭吃，是小遥小姐非说要干票大的……”\n我卷起海图，忍着心中的怒火说道：“你在圣杯岛上承认伪造公函的时候，怎么没顺便告诉我这是一群连瞄准镜都不会看的铲煤工？！待会儿到了海港，要是炮弹打歪砸在自己人头上，那些人的命都算谁的？！”\n小遥把白夜抱进怀里挡住了脸，似乎又想用一句玩笑糊弄过去，最后才小声说：\n“我只是…不想让大家……”\n“别说了。”我打断了她。\n“算我上辈子欠你的。去把晓枫和巴罗给我叫过来，我们几个开坦克的，今天高低得对着那几页说明书把你们这门大炮的刻度盘给研究明白了。”"
PAU.17.a: "赶紧给我把说明书拿来"

PAU.18.t: "既然我们早已无处可逃"
PAU.18.d: "“阿夏姐，岸上接通了……他们正到处问，海面上是不是有船来救他们了……”\n小果子边说边把耳机递给了我。\n在这个狭窄的驾驶室里，缠着纱布的老兵、满身灰的水手，还有靠在门边换药的伤员，她们，全都在看着我。\n看着我伸手接过了那个通话器，按下了开关。\n沿海无数部破旧的收音机里，同时响起了粗糙刺耳的电流声。\n“救你们？”\n我笑道：\n“听清楚收音机里的声音，我是阿夏。\n在工区碾碎罢工的工人的是我，在桥上砸断缆绳扔下同伴上船逃命的也是我。对岸要是还有活人，应该还认得我这惹人厌的声音吧？\n当年老军团长走后，晓枫拉着队伍退进深山。她指着我的鼻子骂，说军队不该永远给腐朽的王权当狗，该为了底下受苦的人流尽最后一滴血。\n我何尝不知道她是对的？晓枫画出来的蓝图那么干净、那么漂亮。可谁来管那些断了腿、除了开枪修车什么都不会的老兵？谁来管营房后面几十个连稀汤都喝不上的家属？我自以为守着合同四处讨饭是在替大家扛下所有脏水。所以在卡卡罗姆撞上的时候，我把炮口对准了她。\n我逼着自己不去想山梁上那面旗子，逼着自己相信开枪全是为了活命——可其实，我只是嫉妒她。我嫉妒她敢清清白白地去守着理想，而我只能带着大家在烂泥里永远当个恶人。”\n“这几年，我把王室那几张欠条当成了救命稻草。每次运粮官送来推迟兑现的字据，我都对自己说，再等等，再熬几个星期，王都总会把军饷发下来的。我们替他们守了这么多年要道，他们总不至于真把大家活活饿死在山沟里。我守着这点可怜的侥幸自欺欺人。为了维系这份苟延残喘的合同，我甚至冲着劝我离开的同伴拔枪。\n直到那个白发丫头揣着盖了假章的单子撞进营房。\n她嬉皮笑脸地说明天去抢王室的仓库，说外海有大船能接我们逃跑。这种荒唐至极的话无论谁听了都觉得不可信，天晓得这个不知从哪儿冒出来的丫头到底在盘算着些什么。\n可营地里的库房已经彻底见底了，锅里连野菜都煮不出几片了，身后的老兵饿得连枪栓都要拉不动了。\n所以我咬着牙跟她赌了，去抢仓库、去上樱花的船。\n我以为只要把你们全甩在身后、只要逃得够远，就能把这些亏心事全当成没发生过。”"
PAU.18.a: "……"

PAU.188.t: "既然我们早已无处可逃"
PAU.188.d: "“结果呢？我们在大海上挨了亡灵的撞击，我们拐进了圣杯的孤岛，还让人家生生剥走了一半救命的口粮。\n好不容易挨到修好船舵，传来的，却是这白毛丫头的老家也落进军阀手里的死讯。”\n“我们成了公海里哪座港口都不收的黑户，连个能下锚的水道都没有。”\n“这时候，我听到了你们的求救声。你们在海岸线上被怪物堵在了厂房里，连弹药都快打光了，却还在冲着海面发报，问是不是有船来救你们了……”\n\n“……”\n\n你们居然在向一个自私透顶的逃兵求救啊。\n这真是我阿夏这辈子听过最难受、最让人抬不起头的笑话了。\n\n我听到这句话，我真恨不得把自己的脸皮剥下来扔进海里。”\n\n“为什么啊！？我问你们，为什么啊！？如果我们早就没有地方可以逃跑了的话——\n那我们就掉头！把船开回去！不就行了吗？！”\n厂区里的工友们，民间自卫队的兄弟姐妹们，给我安安全全找掩体趴好了！\n我没脸求你们原谅，更不配当什么救世主。我是在大海上吓破了胆、连家在哪都找不到的逃兵。我们把船开回来了……回来求你们收留，求你们救救我们这帮走投无路的人！”\n\n“大家，都听到了吗！听到了……就快来救救我们吧！我们这群逃兵，来向你们…求救了……”\n随着咔哒一声，我关死了开关。\n“早点这样说不就好了。”\n伴随着雪伊小声埋怨的声音，一旁的晓枫脸上也跟着露出了重逢以来少见的笑意。\n\n“听到了吧，藤井！临阵脱逃可从来不是我们这帮叛徒的规矩，把主炮的保险全都给我打开！”\n随着小遥猛拍传令管的大喊，舰队的主炮喷吐出刺目的火球，炮弹带着尖锐的呼啸划破夜空，笔直砸向了海岸线上那片被死气笼罩的废墟。"
PAU.188.a: "“全舰全速推进，我们回家了。”"

 PAU.19.t: "明天还得继续出操"#拿下亡灵
 PAU.19.d: "桌上摊着刚送来的紧急通报，周边村镇和矿区的求救电文一条接一条发了过来。\n港区的尸潮主力虽然退了，但山里的零散亡灵还在围攻村落，躲在地窖里的平民急需救援。\n后勤兵刚给大家倒上热水，用的还是从港区王室行宫仓库里翻出来的描金白瓷杯。那边还有几千个工人家属，我这就带人去接应！”雪伊一口气喝干热水，瞥见杯底印着的王室金徽，骂骂咧咧地把瓷杯往地上一掼，“见鬼的王室，连喝口水都看着碍眼！”\n“喂！雪伊你疯啦？！”小遥心疼得差点从椅子上跳了起来，“这杯子边缘描的可是真金粉！拿去卖给圣杯那帮暴发户能换整车物资呢！”\n“留着那种晦气东西干什么，水电枢纽要是被亡灵打没了，我们的海港可就要几天之内彻底瘫痪了。”晓枫卷起图纸，顺手把自己手里那只皇家茶杯也丢进墙角的废铁桶里，当场磕碎了，“我去调配火炮与弹药。”\n“连晓枫你也跟着败家！把我的钱赔来啊！”小遥急忙扑到桌边，把剩下的两只完好瓷杯护在胳膊底下。\n“行了，赶紧带上武器出发吧，总不能把烂摊子留给别人。”我喝完最后一口水，故意松开手，让手里那只描金杯子砸在靴子旁摔了个粉碎。\n“阿夏！！你们这帮败家子故意的吧？！”\n转眼间，原本热闹的大厅只剩下了小遥一个人。\n“真是的……全是一群不会过日子的家伙，还好抢救下来两个……”\n话音未落，趴在她领口里的白夜突然看见一只飞蛾，探出爪子往桌上一扑——\n啪嚓！啪嚓！\n最后两只皇家描金杯顺着桌沿滚落，在她脚边摔成了八瓣。\n\n“——啊啊啊蠢白夜！今晚不准你吃晚饭了！！阿夏！等等我啊！”"
 PAU.19.a: "出发，彻底清除亡灵！"#触发h4事件

PAU_zhyk: "最后一箱罐头"
PAU_zhyk_desc: "从仓库里拖出来的罐头就剩下最后几箱了，等伤员和工人们分完这锅肉汤，厨房的锅底就彻底见光了。城外的麦苗早被亡灵践踏成了烂浆，车库里那几台车的汽缸也裂了缝了。拿惯了步枪的老兵不会摆弄农具，懂车床的工人们又饿得拿不起扳手。要是赶在下个冬天来临前没法让工厂重新开工、没法把麦子种进地里，大家就算没死在战场上，也得在这座空港里活活饿死。"
PAU_zhyk_tt: "偿还王室欠款"

PAU.20.t: "开着战船去打鱼"
PAU.20.d: "我看着墙上挂着的存粮清单，上面的数字已经被晓枫用红笔划掉了好几遍。\n后勤库房里剩下的糙米只够维持短短几天，地里的麦苗也全被亡灵踩成了黑色的泥浆。内陆的运粮道被王室的残部卡死了，圣杯王国的军舰又在海湾外面虎视眈眈。要是再弄不到吃的，刚打下来的港口立刻就会变成一座饿殍遍地的死城了。\n正当我头疼的时候，门被人用靴子一脚踹开了。\n小遥卷着沾满水气的裤腿跑了进来，手里还拎着一个木桶。她把木桶往桌上一放，两条银亮的海鱼立马在水里扑腾出大片的水花，溅得海图到处都是。\n“看！海里的大鱼！”小遥甩掉脸上的水沫，眼睛睁得老大，“内陆的土地被死气泡烂了，但外海深水区的鱼群可不知道索拉娜是个什么东西！”\n晓枫抬起头，有些迟疑地指着窗外的海湾：“港里的渔船早就被王室撤退时全烧光了，我们拿什么出海？”\n“谁说要用木头渔船啦？”小遥跳到桌边，得意地拍向胸口，“藤井他们把货船上的吊臂改成了拖网绞盘，巡防舰前面那两盏高功率探照灯夜里往水里一照，成群的鱼顺着光就往网里钻了！我和水手们试捞了一网，甲板上堆得连站脚的地方都快没了！”\n她从兜里掏出一张连边角都画满线条的草图，放在了我和晓枫面前：\n“不仅是打鱼！我让工人们把几辆印着王室徽章的轻坦炮塔也拆了，换上装卸铲，拿柴油机当牵引车去犁地排水。只要把泥层底下的盐碱翻出来晒透了，再掺上木屑和腐殖土，下周就能把耐寒的种子给播下去啦！”\n看着草图上那些字迹歪扭却详尽的机械改装图样，我不由得愣住了。\n这个平日里满嘴胡话的异国少女，办起正事来竟然意外得利索。\n“阿夏，别愣着啦！”小遥伸手推起我的胳膊，笑嘻嘻地催促道，“快让你的老兵们换上干活的衣服，跟工人们一起去海滩拉网吧。今晚我们要让全城的人都吃上一顿海鲜大餐！”"
PAU.20.a: "“去通知各连队，全员去码头帮水手拉网。”"

PAU_wrcr: "谁也不想承认这里"
PAU_wrcr_desc: "逃走的王室给各国港口发了通报，把我们打成了霸占沿海的叛乱暴徒。圣杯王国的巡逻船天天在港外游弋，借着防瘟疫的名头把航线封得严严实实。更让人头疼的是，樱花本土那帮新上台的军官在每天都在喇叭里反复播报着通缉令，逼藤井把军舰开回去受审，小遥的名字更是排在了第一位。在外人眼里，我们是一群连出港证明都开不出来的黑户；在我们眼里，公社工人、军团溃兵和樱花逃兵全都挤在了同一个国家里，大家到底算是一支军队还是一个新政权，谁也没法给出一个定论。"

PAU.21.t: "抢群众口粮的外乡人"
PAU.21.d: "“这车米是工会先排队领的，你们凭什么横插一手啊？！”\n粮站门前，气得不行的铁路工人正拽着运粮板车的把手。\n对面的老兵抓着车栏和他起着争执：“昨天夜里在雨里替大家站哨巡逻阵地的人可是我们，米应该给我们才对！”\n两边的人越聚越多，工人和老兵各自抓紧了手里的家伙，眼看就要动手。\n我和晓枫正要上前叫停，小遥就一下子站到了人群正中央。\n“诶诶诶！都闭嘴，听我说两句！”\n人群停下了推搡，老兵和工人都抬起了头。\n小遥的神色少见地凝重起来，目光深沉地扫过面前的每一个人，言语间甚至带上了一种近乎悲壮的庄严感：\n“我知道，看着这袋米，大家心里都压着很重的心结。”\n“一边是当年在工区遭受的苦难，一边是驻防在黑暗里流血的军人天职。作为跨越大海来到这里的异国同伴，我深知这种矛盾的复杂与痛苦。我思考了很久，思考着正义，思考着牺牲，思考着历史与命运的沉痛重量……”\n“——所以我想通了。”\n刚才还在推搡的老兵和工人都停下了手，一直到老兵和工人们都下意识屏住呼吸时，小遥才煞有介事地指起自己的鼻尖：\n“这袋米其实应该归我才对。”\n“……”"
PAU.21.a: "“……”"

PAU.211.t: "抢群众口粮的外乡人"
PAU.211.d: "人群后面，一个抱着饭盒的小姑娘怯生生地探出头来：“春日小姐……这袋白米真要被拿走吗？我妈妈说今天排到我们家了……”\n小遥指着自己的手停在了空中，脸上的笑容也僵住了。她原本只是想用一句荒唐话把两边的火气打散，忘了对这些人来说，大米可不是能随手拿来逗趣的东西，可能就是一家人今晚唯一的一顿饭。\n“……我开玩笑的。”她把手从米袋上收了回来，脸红到了极点，“这车米先照原来的名单发，排到谁家就给谁。老兵夜哨的口粮我们另外让后勤核账，不能拿工会已经登记好的粮食来补了。”\n年轻工人仍旧盯着她：“那刚才你说米该归你，也是开玩笑？”\n“是……是我嘴欠了！”\n“你们明明饿着肚子，我还拿这个开玩笑，是我想得太少了！”\n她又连忙指向争执的两边：“不过…不过你们要是继续堵在这里的话，只会导致粮车卸不了货，到时候……就谁都领不到了。”\n人群仍然有些别扭，但工人终于松开了板车把手，老兵也把抓着车栏的手放了下来。两边的人互相瞪了几眼，才不情不愿地合力把车推向仓库。\n小遥跟在车后面走了几步，像是终于想起自己还该维持点原来的架子，便又乐呵呵地凑到了我面前：\n“阿夏长官，我刚才处理得还行吧？今天的午饭……能不能多分我点？”"
PAU.211.a: "“…………”"

PAU_tyzz: "同一张桌子"
PAU_tyzz_desc: "从王宫里搬出来的大会议桌被工人们合力抬进了车库。雪伊带着工会代表占了桌子左边，阿夏手底下的老兵规规矩矩地坐在右边，晓枫把新拟定的配给条例摊在了桌子中央。藤井和几个樱花水手原本有些拘谨地挤在桌尾，直到小遥抱着白夜一屁股坐上桌子，大声宣布他们这帮外乡人也要按期领工资时才放松了不少。这是一群走投无路的亡命徒在天黑前搭起的临时草台班子。用几张垫在油渍上的纸，大家才勉强把枪口从对方脑门上挪开，围在一口锅前商量接下来怎么把各自的肚子填饱。"

PAU_mzyy: "埋葬夜莺"
PAU_mzyy_desc: "在过去漫长的岁月里，亡灵的低语从群山一直蔓延到了海边，把原本繁荣的集镇与工矿变成了亡魂游荡的空城。既然带来灾祸的王室已经瓦解，亡灵的源头也已被彻底斩断，我们就没道理再让阴影继续笼罩在这片土地上。死者理应归于安息，生者必须向前迈步。这场纠缠了所有人数年的噩梦，该由我们亲手画上句号了。"

PAU.22.t: "她们不会再出来了"
PAU.22.d: "“索拉娜！滚出来受死！”\n听到踹门的巨响，索拉娜吓得一哆嗦。她撑着扶手想站起来，两条腿根本使不上劲，直接跌回了椅垫里。\n“叫什么叫……”索拉娜咳出一口血沫，布满血丝的眼睛恶狠狠地盯着我们，“带枪进来了不起啊？来！往脑门上打，你看我眨不眨眼睛！”\n雪伊朝索拉娜几步跨去，将枪口直接顶在了索拉娜额前：\n“厂里死掉的工友，还有断桥那边没能爬上来的孩子……你今天必须拿命赔给他们！”\n晓枫刚想说些什么，就看到了桌面上散落的草图和满是血印的文件，目光忽然停在了那里。\n在无数撤退令里，里面还夹杂着两封索拉娜亲笔用各种鬼画符一样的图案签发的军晌调拨令，可底下负责核准的大臣印鉴一栏却全都是空的，显然，没有多少官僚听从了她的命令。\n“雪伊，先把枪放下来。”\n“凭什么？！”雪伊头也不回地怒吼，“她是放出怪物的罪魁祸首！”\n“大臣们掏空国库跑路了，她现在已经成了怪物的养料了。”\n“在沿海撤退那会儿我就觉得不对劲，那些亡灵连王室自己的车队都撕。她早就被反噬得失去控制力了，后来的仗，她自己也是被失控的尸潮一路追杀逃进这间屋子的。”\n“晓枫……少在这儿装明白人！是我抢了心脏，是我把这片地变成地狱的，有种你就开枪啊！”\n没等索拉娜继续顶嘴，莉莉安娜默默从兜里摸出一块糖，塞进了索拉娜吵嚷的嘴里。\n索拉娜被突如其来的糖块堵住了嘴，剧烈地喘息着，再也喊不出声了。\n“就算她被反噬了又怎样？！死掉的人就能活过来吗？！”\n“不能。”\n“但你现在把这具半死不活的空壳打成筛子，除了把旁边那个神惹毛、把这片地再炸平一次，什么都换不回来。”\n雪伊盯着藤椅上像废人一样含着糖块的索拉娜，过了很久，才终于收回了步枪：\n“想痛快死？你做梦。你就烂在这间屋子里，听着那些冤死鬼的哭声过一辈子吧。”\n“索拉娜她……现在连路都走不动，这里的门我会锁好的，请……你们走吧。”莉莉安娜握住了索拉娜焦黑的手掌，用轻盈又胆怯的声音对我们说道。\n“走了，雪伊。”\n“通报上就写索拉娜已经在城破时死于反噬了。外面还有几万张嘴等着吃饭呢，没工夫把时间耗在这间死人屋子里。”"
 PAU.22.a: "“把门锁好，别再让她跑出来了。”"


PAU_gxzp: "我也不是坐办公室的料啊"
PAU_gxzp_desc: "硝烟还没散干净，大门前就被钉上了一块临时办事处的木板。\n这也配叫办公室？我这双拿惯了炮门拉绳的手，如今每天得在几百张烂纸条上签字。老兵们堵在走廊右边要过冬的粮饷，工会的代表堵在左边门口抗议巡逻队踩坏了菜地。\n在战场上，谁开枪谁就是敌人，事情简单得很；可坐在这张破桌子前，两边却全是一起拼杀过来的同伴啊。再这么被夹在中间逼下去，我的脑袋迟早要炸掉。"

PAU.23.t: "印章该交给谁"
PAU.23.d: "我把手里的笔扔在桌上，看着它滚进了两叠文件堆中间。\n左边是雪伊递上来的公社请愿书，上面签满了工人的名字，要求立刻收缴军团的一切重武器，将市政防务全交给工厂自卫队管；右边则是跟着我从烂地里一路杀出来的老兵们的请愿书，这帮浑身刀疤的军官措辞强硬，坚决要求保留军团的独立薪饷与防务阵地，不接受任何公社干部的指手画脚。\n这两叠纸像两座大山一样压在桌子两头，一旁还摆着那枚刚刚刻好的临时执政印章。\n从当年在艾瑞波拉为了一口粮食替王室卖命，到在大海上逃命、带着队伍杀回莉兰迪亚，我已经记不清自己有多少个月没脱下靴子好好睡一觉了。工人们对我这个昔日的雇佣军头子始终充满戒心，我自己也清楚，我根本不是个懂得治理国家的材料。\n这种坐在高位上的无力感，比被机枪压在土坑里还要让人透不过气。\n“怎么，阿夏长官，这就打算撂挑子逃跑了？”\n小遥端着一杯刚泡好的咖啡溜进房间，怀里的白夜顺着桌沿爬过来，伸爪子去拨弄那枚刚刻好的临时执政印章。\n“别让它把印泥踩得到处都是。”我伸手把印章拿开，推到了小遥面前，“公社那边有雪伊带着工人支持，又有晓枫在做全盘规划。我把这枚印章交出去，让公社名正言顺地接管政权，不是皆大欢喜吗？”\n“你真把印章交出去试试看啊。”小遥放下茶杯，直截了当地把话挑明了，“你信不信你今天上午交出权力，下午工人和你那些军人们就能在广场上拔枪对射？”\n“什么？”\n“雪伊的脾气太冲了，她眼里容不得军队的一点沙子，要是让她掌权，第二天就会下令缴了老兵们的枪，你手底下的兵痞肯定立刻炸营；至于晓枫……虽然她懂大局，也懂怎么带兵，但在你那些老部下眼里，晓枫当年是抛弃军团退进山里的‘叛徒’。你把政权交给她，老兵们只会觉得是你这个老长官出卖了他们，把军队打包送给了公社。”\n“你一旦撒手，老兵们没了主心骨，立刻就会把公社当成要砸他们饭碗的仇敌，到时候谁也拦不住他们在大街上兵变。”\n“那你说说。”我抓起桌子那枚印章，整个人疲惫地陷进了椅背。\n“想放也放不下，想退也退不掉，我又该干嘛呢？”"
PAU.23.a: "“去把雪伊和晓枫叫进来，我们继续开会。”"

PAU.24.t: "我不是什么神仙"
PAU.24.d: "“阿夏！你的兵今天上午又把我们工人的东西给扣了！”雪伊撑在桌沿上大声质问，“这是原则问题！工会不可能接受军队骑在工人头上，你今天必须下令让那几个带头扣车的营长公开向工会道歉，再把他们全都关起来！”\n坐在对面的晓枫把整份调度案推到了我面前：\n“雪伊，现在不是讲原则的时候。阿夏，看看这张排期表。如果不把港口的警备范围和工会的管辖边界切分清楚，明天上午电厂的储煤量就会见底。我拟了几套折中方案，每一套都需要你用大统领的名义强行签发。行政机构不能一直瘫着不动了，你必须现在挑一个盖章。”\n“晓枫！你这叫什么折中？！”雪伊扭头怒喝，“你这是在各打五十大板和稀泥！”\n“我不在乎谁吃亏谁占便宜，我只在乎这栋大楼下周还能不能点得起灯。”晓枫抬起那双锐利的眼睛看向了我，“阿夏大统领，拍板是你的职责。别拖延下去了，快把主意拿起来。”\n一边是雪伊带着满腔仇恨与原则的怒吼，另一边是晓枫算尽了每一吨煤和每一条法令的表格。\n两个人一左一右，像两台推土机一样，把堆积如山的难题全部往我脸上碾了过来。\n咚的一声巨响，印章砸翻了水杯，咖啡一下就把桌上的表格和文件全泡成了一团糟。身后的椅子随着我站起身的动作，向后翻砸在了地面上。\n“都给我闭嘴！！”"
PAU.24.a: "……"

PAU.244.t: "我不是什么神仙"
PAU.244.d: "“你们到底当我是个什么东西？！我是个会变戏法的神仙吗？！”\n雪伊和晓枫被我这一嗓子吼得闭上了嘴。\n“雪伊！老兵们扣煤车是因为后勤营连续几天都没领到配给煤，重伤员在棚子里冻得浑身发紫！我知道他们以前替王室干过脏活，可现在仗打完了，就要让他们活活冻死在床上吗？！”\n我又指向对面的晓枫：\n“还有你！你拿着写满百分比的表格逼我签字，可一共就剩最后几吨煤了！划给工会发电，军营的伤员就得冻死；划给军营烧炉子，全城的抽水机和机床就得停工！手心手背全是一起卖命的自己人，你让我怎么判？！”\n\n就在这时，文件柜角落里突然传出咔嚓一声脆响。\n小遥正蹲在椅子上啃着一条烤咸鱼干，见我们仨全盯着她，连忙把剩下的鱼干塞进白夜嘴里，含糊不清地嘟囔道：\n“那个……既然一共只有最后几吨煤了，你们干嘛非要分两头烧呀？直接把军营里的伤员床铺搬进发电厂的锅炉房地下室不就行了吗？工人们照常烧煤发电，伤员白蹭锅炉管道散出来的余热，算下来还能省出两吨煤给食堂烤东西吃呢。”\n\n雪伊原本准备打人的手，晓枫拿着表格的手，都停住了。\n我和晓枫、雪伊对视了一眼，三个人像是突然想通了什么，视线齐刷刷地锁定了角落里那个白发丫头。"
PAU.244.a: "“……晓枫，我突然有个好主意。”"

PAU.25.t: "这出大戏是你开的头"
PAU.25.d: "晓枫默默合上了那份争执了一上午的煤炭调度表，非常赞同地看向我：\n“阿夏说得对。在老兵眼里，我是带头脱离军团的叛徒；在工会眼里，阿夏是开过枪的军官，雪伊又眼里容不得半点沙子。我们三个无论谁坐上大统领的位置，底下的人都会觉得是在被仇敌偏袒。”\n晓枫目光径直落在了正准备悄悄往门口溜的小遥身上：\n“但如果，让这个谁也不偏袒、脑子转得比谁都快、连自己老家都回不去的外乡丫头来当大统领呢？”\n雪伊愣了一下，随即反应过来，上下打量着小遥：\n“……别说，这丫头虽然满嘴跑火车，但在广场上确实敢站出来跟两边评理。而且港口那两艘军舰和打鱼的水手只听她一个人的。让她坐台前按公开的规矩盖章，我们三个在底下盯着，或许还真可以。”\n刚摸到门把手的春日小遥浑身一僵。\n她把白夜抱在胸前，整个人贴在门上，急赤白脸地叫了起来：\n“喂！！你们三个讲点道理好不好？！我刚才只是随口出了个省煤的主意，怎么就把这么大一口黑锅往我头上扣啊？！我来南美只是为了混口饭吃，可没答应给你们当保姆啊！”\n我弯腰捡起了地上那枚沾了咖啡渍的执政印章。\n“当初是谁揣着假公函把我们从山沟里忽悠出来的？”我看着她那副慌乱的模样，憋着笑扬起嘴角，“既然这出大戏是你亲手开的头，那就给我老老实实坐上来，把剩下的烂摊子管到底吧。”"
PAU.25.a: "“恭喜上任，春日小遥大统领。”"

PAU_gydj: "各押一份定金"
PAU_gydj_desc: "小遥坐上大统领椅子的第一天，根本没去写什么冠冕堂皇的宪章。她把雪伊、阿夏和晓枫拽进厨房，指着冒着热气的灶台定下了规矩：军团老兵负责外围防线和重工业开采，但他们的口粮配额必须由公社工会每日签字；工会全面接管市政运作与工厂，但治安巡逻必须由一名老兵带着一名工人共同执勤；而水手们带回来的鲜鱼和煤炭，则由港务局按人头平价分发。\n小遥把这套把戏叫做“押定金”。大家用不着装出一副亲如一家的和气模样，但谁要是敢私下里动歪心思，另外两方会在一个小时内彻底掐断他的饭碗。"


PAU_msbf: "莉兰迪亚避风港"
PAU_msbf_desc: "因为先前亡灵的躁动，圣杯王国在海湾外面拉起了防疫警戒线，海对面的樱花军部通缉令也天天在广播里播报着小遥她们的罪行。既然正经的外交途径全被堵死了，小遥干脆把大海对面那些对付黑市巡警的手段搬到了南大西洋。\n她让工人们修好了老码头的深水泊位，在灯塔上挂起大灯，公开向公海上所有来历不明的货船发出信号：莉兰迪亚提供全大海最便宜的修船船坞、不收重税的燃油补给，以及装满底舱的优质咸鱼。"

PAU_bzwtp: "那是什么怪物？"
PAU_bzwtp_desc: "在西边的山谷处，传回来的报告一次比一次诡异。阿德莱希那边盘踞着的根本不是讲人话的军队，它们是一群长着多余肢体、披着烂皮在废墟里嚎叫的怪物。我们才刚刚从亡灵嘴里好不容易抢回一口气，绝对不能再让这种莫名其妙的脏东西漫过我们的边境线了。"

