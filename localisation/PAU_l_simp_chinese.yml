####人物####
PAU_Nymph: "阿夏"
PAU_Nymph_desc: "§L十几岁刚进兵营的时候，阿夏加入的“无国界之军”是整片大陆名气很大的雇佣军。在巴罗这些老兵的带领下，她学会了怎么用枪，怎么开坦克、甚至是重新领导一群新兵打赢胜仗。那时的军团按合同拿钱办事，靠着强硬的作战本事在各地受雇打仗。\n1934年，王室强令军队去工区镇压罢工，彻底撕裂了军团。\n老军团长离世后，晓枫带着一部分人退入深山，阿夏则留下来接管了剩下的队伍。她理解晓枫的选择，但留守的几百名兄弟姐妹和家属总得有口饭吃，阿夏选择守着既有的合同留在营地。§!"

PAU_xiaoyao: "春日小遥"
PAU_xiaoyao_desc: "§L在樱花群岛的海港镇上长大，小遥从小就在造船厂、火车站和码头摊位之间到处奔跑。她讨厌大人们立下的各种规矩，却熟悉工人的日子和码头的门道。在街头长大的经历，让她懂得怎么跟各种人打交道，也习惯在走投无路时找出生路。\n故乡的局势越来越乱，小遥带着同伴们从神社救出的白兽‘白夜’，横跨大海一路开到了南美。这支孤独的船队避开沿途的巡逻，最终停靠在莉兰迪亚的港湾里。§!"

PAU_bl: "巴罗"
PAU_bl_desc: "§L“无国界之军”资历最老的一批战车长之一。阿夏当年刚进军营时，就是跟着他学会了怎么开坦克与拆装机枪。脸上留着早年引擎回火燎出的伤疤，虽然嘴上整天抱怨军饷被克扣、履带老得修不动，但只要吹响集合哨，他的坦克永远是第一个打着火开出车库的。§!"

PAU_baiye: "白夜"
PAU_baiye_desc: "§L一团很难分清到底是猫、是狗、是狐狸、还是单纯一颗长了耳朵的雪白大毛球。四条短腿短得几乎被圆滚滚的肚子完全遮住，平时除了趴在小遥的衣领里打呼噜装死，唯一的特长就是在饭盒开盖的一瞬间以惊人的速度探出脑袋。据说有着特别尊贵的来头，但目前来看，除了吃得越来越胖以外完全没看出来。§!"
PAU_aws: "埃文斯"
PAU_am: "艾玛"
####特质####
Maj_soul: "山灵加护"
Maj_soul_desc: "§L这支部队受到来自樱花的山灵“白夜”的神秘庇护。即便身处补给断绝、死气弥漫的绝境，白夜残留的纯净灵气也能护佑补给与战士免受恶劣环境侵蚀，并在瞬息万变的战场上凭借不可思议的本能趋吉避凶。§!"

PAU_baiye_trait: "白夜"
PAU_baiye_trait_desc: "§L显然，让一只小动物来指挥一个军队是一件很好笑的事情§!"
####决议###
PAU_LHS_weiji:0 "王室危机"
PAU_LHS_weiji_dec: "这是留给我们的最后期限"
PAU_LHS_weiji_dec_desc: "我们不能再等下去了，王室给不了我们时间，晓枫给不了我们时间，我们不能停下，我们不能停下来继续等死。"
PAU_LHS_weiji_dec2_desc: "王室的装甲援军正碾过泥泞向前线开进。三十天后，莉兰迪亚皇家装甲师将抵达我们的战线。"
PAU_LHS_weiji_dec3_desc: "第二批王室援军已经在路上。三十天后，两个满编的皇家装甲师将完成集结。"
PAU_LHS_weiji_dec2: "§R王室援军在路上§!"
PAU_LHS_weiji_dec3: "§R王室援军在路上§!"

PAU_xiufu: "重新打通 [FROM.GetName] 的通道"
PAU_xiufu_desc: "晓枫带队退入深山前炸塌了整段隘口，滚落的碎石封死了通往矿区的通道。为了夺下被截断的运粮线，工兵连必须带着炸药与推土铲尽快将堵塞的道路重新清理出来。"

PAU_xiaoyao_plan: "让白夜在 [FROM.GetName] 溜达"
PAU_xiaoyao_plan_desc: "当前已让白夜溜达过的受控州：[?ROOT.PAU_baiye_patrol_count|0]\n那个小家伙天天在营房里睡大觉，肚子都快吃成皮球了。既然附近的街区与山口到处弥漫着阴冷的死气，不如打开窗户由着它跑出去四处转转。选择一处尚未溜达的受控州，花费 10 政治点并等待 15 天，白夜就会完成溜达；该州会获得“白夜的庇护”，持续压制敌军补给、损耗和速度。"

xiaoyao_plan_flag: "白夜正在四处溜达"
PAU_xiaoyao_state_flag: "白夜曾在此处散步"

PAU_wl_attack_dec: "亡灵在缓慢蚕食着我们" #可选，由直接宣战变为决议倒计时的亡灵缓慢蚕食
PAU_wl_attack_dec_desc: "亡灵正在沿边境缓慢蚕食：每7天，与亡灵控制区相邻的莉兰迪亚、野火、王国或公社领土都会被拖入死亡的阴影。若不尽快结束战争，整片边境都会变成亡灵的土地。"

PAU_wl_anti: "亡灵在反扑"
PAU_wl_anti_desc: "徘徊在阴影里的亡灵正试图用污浊的死气污染白夜去过的任何地方。我们要是不加紧清剿的话，好不容易恢复生机的地区便会再度被死亡笼罩的。"

PAU_hetong: "雇佣契约" #雇佣契约 决议组名
PAU_hetong_desc: "与交战国签订雇佣合同，在有限期限内为对方作战。合同结束后，我们会撤出并带走应得的报酬；但若雇主崩溃、战争中断或我们主动撕毁契约，信誉和地区控制都会受到影响。"

PAU_guyong: "向 [FROM.GetName] 发出雇佣邀请" #雇佣契约 决议名
PAU_guyong_desc: "向一个正在交战的国家派出信使，提议以我们的力量换取报酬。对方可以选择接受或拒绝。接受后，我们将进入准备阶段，并获得雇主控制的一个沿海地区控制权。"

PAU_guyonged_flag: "雇佣契约进行中" #询问有不要期间的flag 防止一次性按多次
PAU_bop_loan_active: "雇佣契约已生效" #同意的flag

PAU_guyong_zhunbei: "为 [FROM.GetName] 集结远征队" #对方同意雇佣，用于准备调兵过去的缓冲时间
PAU_guyong_zhunbei_desc: "合同已经签下。我们需要在30天内完成动员、装载与航线整备。准备完成后，我们将率部加入雇主的战争，并接管一处沿海地区作为前进基地。"

PAU_guyong_attack: "履行雇佣合同" #雇佣倒计时
PAU_guyong_attack_desc: "我们正在为雇主作战。合同最长持续365天；如果雇主战败、战争结束、军团投降或主动撕毁契约，任务将提前结束。"

PAU_guyong_touxiang: "终止合同并投降" #投降，结束雇佣
PAU_guyong_touxiang_desc: "在雇佣战争中选择放弃合同并向敌方投降。我们将失去信誉，并在一段时间内承受稳定度、战争支持度与非核心省份攻防的惩罚，但可以保住残部。"

PAU_guyong_dianshu_tt: "£GFX_PAM_am 雇佣军信誉: $RIGHT|+=0$" #原计划当我们拥有信誉点数时可以在国策中用于强化军事线buff

####雇佣事件####
PAU.172.t: "雇佣军？" #询问是否需要雇佣
PAU.172.d: "一封并未署名的信被送到了我们的前线指挥部。信纸上只有寥寥数行：一支在南美边境失去补给的雇佣军愿意接受合同，条件是雇主需要支付军饷、提供港口，并允许他们带走阵亡者的遗物。\n信使等在门外，说阿夏不会为同一份合同敲第二次门。"
PAU.172.a: "签下合同，让他们过来。" #同意
PAU.172.b: "我们的战争不需要外人。" #拒绝

PAU.173.t: "合同已签下" #我方收到对方同意了
PAU.173.d: "信使带着正式答复回来了。雇主同意开放港口和补给线，并授予我们在战区内的通行权。\n阿夏把合同翻到最后一页，确认了印鉴和报酬条款，随后吩咐各连开始装载。"
PAU.173.a: "开始准备出港。"

PAU.174.t: "对方谢绝了合同" #我方收到对方拒绝了
PAU.174.d: "雇主婉拒了我们的提议，理由是他们还能自己撑住防线。\n阿夏把合同收进了抽屉：至少这一次，我们不用替别人流血了。"
PAU.174.a: "把合同收好，继续训练。"

PAU.175.t: "合同失败" #作为雇佣兵帮助雇主失败了
PAU.175.d: "坏消息从前线传来：雇主没能撑住，防线崩溃，敌军已经接管了他们的首都。\n军团接到撤退命令时，营地里的气氛沉重得可怕。未能履行完合同，不只意味着报酬落空，也意味着“无国界之军”的招牌又多了一道裂痕。"
PAU.175.a: "先把活着的人带回来。"

PAU.176.t: "合同完成" #作为雇佣兵帮助雇主打赢了
PAU.176.d: "战争结束了。雇主的旗帜仍飘扬在首都上空，军团也如约拿到了报酬。\n士兵们难得没有抱怨军饷被克扣。"
PAU.176.a: "清点报酬，登船返航。"

PAU.177.t: "合同超时" #超时了也未能帮助雇主打赢
PAU.177.d: "合同期限已经过去，雇主却始终没能赢得战争。继续待下去只会把我们拖进无底洞里。\n既然合同上承诺的胜利没有到来，我们也没有必要陪着雇主一起烂在战壕里了。"
PAU.177.a: "撤出战区，终止合同。"

PAU.178.t: "敌军雇佣兵投降" #作为雇佣兵放弃雇主 发给雇主敌对国家
PAU.178.d: "与我们作战的雇佣军部队已经停止抵抗了。他们交出了重装备和部分储备，以换取安全离开战区的权利。\n指挥部的军官们认为，这支部队一旦脱离战场，雇主的防线就会出现无法弥补的缺口。"
PAU.178.a: "接管他们的阵地和物资。"

PAU.179.t: "枪口转向雇主" #作为雇佣兵宣战雇主
PAU.179.d: "局势已经无法挽回。雇主把我们的驻扎地视为新的威胁，而军团也不愿再为一份被撕毁的合同流血。"
PAU.179.a: "那就让合同在炮火里结束吧。"
PAU.179_tt: "与相关国家停战并重新划分战线。" #与其他国家和谈

####民族精神###
PAU_borderless_army:0 "无国界之军"
PAU_borderless_army_desc:0 "我们没有祖国，战场就是我们的故乡。契约是我们的信条，黄金是我们的旗帜。长久以来，我们作为南美大陆上最精锐的职业武装，为出价最高者献上胜利。莉兰迪亚王室曾是我们的雇主，镇压那些所谓的“赤匪”，是我们冰冷任务清单上的一行。\n直到老军团长的出现。她从那些衣衫褴褛的革命者眼中，看到了比黄金更耀眼的东西。她开始质疑，我们这支最锋利的剑，是否应该永远只为腐朽的王权服务。她秘密地向我们中的一些人——包括她最器重的参谋晓枫——描绘了另一幅蓝图：一支为人民而战的、真正荣耀的军队。\n那一刻，许多人心中那早已被金钱和硝烟掩盖的火焰，被重新点燃了。我们以为，我们即将迎来新生。\n\n然后……§R老军团长……消失了。§!\n\n在随之而来的混乱与猜忌中，军团内部务实的声音压倒了一切。她们说，理想主义的狂热已经结束，我们必须回归“现实”。于是，我们将枪口，对准了昨天还与我们分享最后一根香烟的同志。在莉兰迪亚，在艾瑞波拉，我们亲手将那刚刚燃起的革命火焰，重新踩入血泊之中。\n如今，我们重归旧主麾下，但信任的链条一旦断裂，便再也无法复原。王室利用我们，也提防我们。而我们，则像一群背负着双重背叛的幽灵，在昔日战友的尸骸上执行着新的契约。鹰徽依旧闪亮，但许多人的眼神，却永远留在了那片被我们亲手制造的废墟里。我们是谁？是忠于契约的无情利刃，还是……一群迷失在理想与现实之间的……亡魂？"
PAU_royal_arrears:0 "王室欠饷"
PAU_royal_arrears_desc:0 "§L王都的欠条已经堆满了抽屉。军饷、粮食和冬装都卡在那几道永远走不完的公文里，营地里的人只能继续拿旧装备和空锅顶着。等王都陷落，这笔账就会自动一笔勾销。§!"
PAU_divided_legion:0 "裂开的军团"
PAU_divided_legion_desc:0 "§L老军团长留下的那点人望，已经在卡卡罗姆的枪声里散得差不多了。老兵信不过新来的，新兵也看不惯老兵。命令还能传下去，但没人敢保证每一枪都会朝同一个方向打。§!"
PAU_baiye_state: "白夜的庇护"
PAU_baiye_state_desc: "这片土地还残留着那个白毛小家伙蹭过的痕迹。灵气驱散了空气中残留的腐臭，连带着让担惊受怕的居民们也感到了安心。路口供上的烤鱼和米糕驱散了大家心里的阴霾，看着那个每天都在晒太阳的大毛团，街坊邻里的日子终于重新有了希望啦。"

PAU_annex_debuff: "雇佣期间禁止兼并" #作为雇佣兵不能在此期间吃地但是有核心外加成
PAU_guyong_debuff: "雇佣兵信誉受损" #作为雇佣兵选择投降或者失败或者我们在雇佣期间宣战了雇主
PAU_guyong_buff: "雇佣赔偿" #投降的赔偿
####国策与事件####
#政治线国策v
PAU_tx: "又是……欠条！"
PAU_tx_desc: "王室送来的信件写得明明白白，结款的日期又被那帮狗东西往后推了。\n大家现在都空着肚子，脾气自然好不到哪去。可要是现在撂挑子走人，这里的营地立刻就得散伙，我们谁都不想同时被王室和晓枫一起追着咬。于是只能先把催款信塞回抽屉，顺便交代炊事班往汤锅里多舀几勺水，先把接下来这顿饭应付过去再说。"

PAU.1.t: "荒唐的敲门声"
PAU.1.d: "面饼烤得太老了。\n我用后槽牙磨着那块焦硬的饼皮，就着水壶里的凉水往下咽着。\n副官站在旁边，手里还拿着刚才从信差手里接回来的信封。\n“长官，王都那边的批条……”\n“别念了。”\n我把水壶塞子拧上，面无表情地打断了他。\n“闭着眼睛都知道写着什么。无非是让大家再发扬一下军人精神，多顶几个星期。”\n“……您猜得挺准。他们还附了一份前线慰问致辞。”\n“留着生火吧。今天晚上风还挺大的，煤棚那边正好缺一点引火用的纸。”\n远处的卡卡罗姆山谷只剩下一片灰暗的冷光。\n晓枫带着人退进那片山谷已经很久了。临走前她在指挥所指着我的鼻子骂着，说我们这帮守合同的老兵迟早要被内廷当成擦过鞋底的烂抹布扔了。\n当时我还拔枪跟她顶嘴。现在想想，好像是挺傻的。\n——铛、铛、铛。\n门岗上的手摇铃毫无征兆地响了起来。\n摇铃的卫兵力道乱七八糟，全无规律，听着毫无章法。\n“长官！门口……来了个奇怪的家伙！”\n我把没啃完的面饼随手塞进上衣口袋，拍去裤腿上的煤渣说道：\n“信差又折回来了？还是山里的游击队迷路了？”\n“都不是……您自己来看看吧。”"
PAU.1.a: "把枪放低，让她进来吧。"

PAU.1000.t: "荒唐的敲门声"
PAU.1000.d: "我踩着泥泞的碎石路走到了营区栅栏前。\n值班的两个哨兵正端着上了膛的步枪，脸上的表情说不出是紧张还是想笑。\n铁丝网外面站着一个姑娘。\n白头发，个头不高，身上套着一件宽大得不像话的风衣，肩头上还趴着一团长软毛的白东西。\n她正把两只手搭在生锈的铁丝网上，垫着脚尖往营房后厨的方向使劲瞅着，那只大衣领口里的小毛球也跟着探头探脑，鼻子一抽一抽的。\n看见我走过来，她不仅没往后躲，反而咧开嘴，特别用力地冲我挥动起了胳膊。\n“打扰啦——！”\n她的嗓门清脆得让人耳朵疼，直接把哨塔上的野鸽子给惊飞了。\n“顺着山路走了好久好久，总算看见有烟囱的地方啦！那个……请问这里是饭馆吗？有食堂也可以！能匀我一口热汤吗？我有带钱的哦！”\n几个哨兵彻底僵在了原地。\n在这片除了炸药味、烂泥巴味和废纸条的死人谷里，居然有人背着行囊，把架着机枪的重装步兵哨卡当成了路边的面摊。\n“……她脑子正常么？”我转头问向旁边的副官。\n“报告长官，她刚来的时候还问过我，门口挂着的旗子是不是招牌菜的幌子。”\n铁丝网外的白发少女已经从口袋里摸出了两枚透亮的硬币，在掌心里摊开，笑得眼睛弯成了两条缝。\n“你看，我真没吃白食的意思。哪怕只有冷水泡饭也行呀，我家这个小家伙饿得连尾巴都摇不动啦。”\n她肩头那团圆胖的白毛像是为了配合她，当场打了个毫无诚意的假哈欠，四条短腿缩进风衣，蜷成了一个球。\n我盯着那枚硬币看了一会儿，视线移向了她风衣下摆沾着的一层黑泥。\n“把枪放下。”\n我拉开了铁丝网门上的插销。\n“……进来吧。只有盐水，要喝就喝，不喝自己滚。”"
PAU.1000.a: "……"

PAU.2.t: "另一种可能"
PAU.2.d: "“如果换作是王室的宪兵，你现在已经被抓起来关进大牢了。”我对着用勺子在碗里刮过了最后一圈的少女打趣道。\n少女自己只喝了苦涩的盐水，她把仅有的两片烂菜叶掐碎，塞进了领口里的小动物嘴里。\n“多谢款待。虽说除了盐味就没尝出别的，但喝下去浑身都热乎起来了呢。”\n她抬起头，眼神里那股嬉皮笑脸的劲头忽然收敛了起来。\n“其实王室答应给你们拨过来的口粮，上周就已经在海港被扣下了。”\n我刚点上烟的手悬在空中停住了。\n少女从兜里掏出一张皱巴巴的复写纸，啪的一声拍在桌上。那是一张盖着王室海关印的货运提单。\n“运粮船里面根本就没装麦子，甲板底下装的都是给内廷贵族过冬用的葡萄酒和熏肉。那些大臣给你们寄欠条，无非是想把你们钉在阵地上，替王都挡住山里的游击队罢了。”\n少女双手交叠托着下巴，像是在讨论明天该吃什么一样继续说道：\n“山谷那边的晓枫也没什么吃的了，但她就等着你们的库存见底。只要你们饿得拉不开枪栓，她的队伍就会顺着公路反攻过来。”\n食堂窗口那边还传来士兵们敲饭盆的吵闹声，可我面前这张桌子上的空气却冷得像结了层霜。\n“你从哪弄到这东西的？”我终于开口问道。\n“顺手捡来的呀。”少女歪了下脑袋，“我们在外海漂了好久，刚好撞见王室的走私船抛锚。不过阿夏长官，比起货单，更要命的是你们。”\n她伸手指向窗外那些蹲在台阶上喝汤的年轻士兵。\n“老军团长不在了，晓枫也带着人走了。留在营地里的这些人，既没有可以效忠的祖国，也拿不到卖命的赏钱，只能每天守着空枪饿肚子，不是吗？”\n少女收起手帕，直视着我的眼睛：\n“阿夏长官，你打算带着大家在这里坐着等死，还是换个真正有出路的活法？”"
PAU.2.a: "……说说你的条件吧。"

PAU.3.t: "谁要给外人当枪使"
PAU.3.d: "“换个雇主？”我把空碗推到了一旁，“是去给樱花的天皇卖命，还是给海上的殖民者当看门狗？”\n“都不对。”\n少女摇了下头，又从兜里掏出一张叠好的路线图，直接在桌面上摊了开来。\n“给别人卖命，迟早会被当成耗材扔掉。晓枫是对的，你们老团长也是对的，只有傻子才会一直给外人当枪使。”\n她伸手按在沿海公路的一处岔路口上，那是王室用来中转出口物资的军需仓库。\n“他们既然不发军饷，为什么还要替他们守门？那里的仓库里囤着能吃几个月的麦粉和肉罐头，还有几大罐准备运往海对面的燃油。”\n少女抬起眼眸，那只小白兽跳到了桌面上，蹲在地图边缘舔起了爪子。\n“动了王室的仓库，那我们就成和晓枫一伙的了。”我说。\n“明明是他们先赖账的。”少女说得理直气壮，“雇佣契约上白纸黑字写着拿钱办事。既然他们连饭都不给，你们自己去后厨端菜也是天经地义的吧？”\n此时此刻，在两人对话的屋子外面，巡逻队的脚步声从走廊经过，换岗的哨兵正在交接佩枪。\n“抢了之后呢？”我问，“就算能撑过这阵子，等王都的火炮和山里的游击队两头包夹过来，我们照样无路可走。”\n“那就去港口。”少女在地图最东边画了一个圆圈，“外海有两艘能开动的船答应接应我。只要先占下码头、打通航道，至少就没人能轻易把你们堵死在这片山里。”\n我盯着地图上的港口：“两艘船能装下几百号人？谁在船上指挥？要是到了码头才发现走不了，我们可是连退路都没有了。”\n小遥的手指顿了一下，随即又笑了起来：“船既然能开到外海，就总有办法嘛。先把仓库拿下来再说，难道我们还能继续留在这里等到饿死嘛？”\n她说得轻巧，仿佛只要先把眼前这一步走出去，后面的难题就会自己找到解法。\n我盯了她一眼，但没有继续追问了。营地里饿得连枪栓都快拉不动的人就在窗外，我已经没有多少可供挑剔的选项。\n她收回手指，看着我：\n“到时候你们就是一支自己说了算的队伍。有饭吃，有油用，还能把武器换成机床零件，有一套自己的产线。”\n我低头看着被茶水浸湿的路线图，耳边是走廊里又一次响起的哨音。\n蹲在这里是饿死，退回王都也是死路一条。\n“……图纸留给我。”我站起身，把军帽扶正，“等天黑了，我叫几个队长过来开会。”"
PAU.3.a: "另外，要是敢耍花招，\n我第一个请你吃枪子"

PAU_qxjd: "不借也得借"
PAU_qxjd_desc: "卡卡罗姆矿区是去往东部公路唯一的关口。晓枫不可能把根据地的咽喉让出来，我们也没法放弃那条运粮的活路。现在双方都退到了悬崖边上，我们只能靠大炮和子弹来决定谁能活着走过去了。"

PAU.4.t: "二百码开外"
PAU.4.d: "“测距二百码。”\n副官把测距板递给了我。\n“要现在开炮吗，阿夏长官？”\n我举起望远镜，望向对面山梁上隐约闪烁的红光。\n晓枫在那座山梁上布设了阻截阵地。她以为我们是奉了王室严令前来围剿的走狗，也清楚我们要去抢夺物资，无论这些物资是来自于谁的，我也清楚她不会把这条命脉让出来。\n我们都在为了自己身后那些人的命，把枪口对准曾经最熟悉的人。\n“真要动手啊？就不能谈谈吗？”\n小遥靠在车厢挡板旁，正随手翻弄着手里的路线图。\n“对方是你的同僚吧。”\n“正因为是当年的参谋长，她比谁都懂。”我放下望远镜，“她封死了下山的路，我们车库的油料也撑不过一周。双方都退到了悬崖边上，枪声一响，谁先手软谁就得饿死在这道峡谷里。”\n山梁上猛然亮起一串橘红色的火光。一梭子机枪子弹贴着车顶扫过，当场把卡车左边的后视镜打得粉碎。\n这是晓枫正在划出界线。只要我们的车轮再往前滚过哪怕十米，整道山梁的火力就会立刻迎头砸落下来。\n“不准瞄准掩体人员。目标对准两侧崖壁支撑点，把两边的石头全都给我打碎了，给卡车推平通道！”"
PAU.4.a: "开火"

PAU_sdft: "别装老实人"
PAU_sdft_desc: "车库里那些履带车已经停了不知道多久了，车门上还贴着王室盖了红印的白纸封条呢。以前不动它们，是因为燃油不够用，也是为了维系表面上的安分。但如今我们要是想活命的话，就没法再继续装起老实人了。把坦克都开出来吧，不管是王室的还是我们的，能给我们杀出一条路来就行。"

PAU.5.t: "熟悉的声音"
PAU.5.d: "随着老掉牙的起动机接连咳嗽了好几声，它的尾气管终于喷出了浓烈的黑烟。\n车库大门的铁链被拽得哗啦作响，几辆轻型坦克慢腾腾地挪到了空地上，车体侧面的金鹰徽记依旧油光发亮的样子。\n副官手里拎着黑漆桶，踩在挡泥板上问：\n“长官，这老鹰标记……要不要先用油漆抹掉？前面就是晓枫的阵地了，要是让她看见了……”\n“费那劲干什么。”\n我扣紧防风镜的带子，用被发动机的轰鸣盖得很闷的声音说道：\n“只要引擎声一响，晓枫闭着眼睛都知道来的是什么车。当年这底盘散热孔开多大、每块钢板垫多厚，都是她亲手画的图纸。你就算在车头上画满小花，她也认得出这死动静。”\n副官听完，挠着脖子把漆桶随手挪在了路边，不再言语。\n山梁上的信号火光依旧明亮，透过望远镜看去，山口正上方插着一面崭新的红旗。\n晓枫这会儿肯定也在掩体后面举着望远镜和我们对视呢。\n在她眼里，事实明摆着。当年在工区街道上碾死工人的是这批车，现在开进卡卡罗姆、准备轰开她家大门的，也是这批车。\n“真残忍呢，阿夏，就不能再谈谈吗？”\n小遥两手插在风衣口袋里靠在车棚的柱子旁，用带着点事不关己的态度调侃着：\n“从山上看过来，你们简直就像王室养的最听话的狗呢。”\n“快闭嘴吧你。能谈早谈了，用不着你这白毛丫头指手画脚。”\n说完，我踩着踏板翻上车顶，弯腰钻进了狭窄的炮塔里。\n随着金属顶盖砰的一声关上，风、尘土和草腥味都被隔绝在了外面。\n我拉过通话器的软管，对着麦克风低声开始了吩咐：\n“各车拉开距离，谁也不准熄火掉队。”\n“听到的……就踩紧油门，在我屁股后面跟紧了。”"
PAU.5.a: "现在，我们的大门彻底关上了。"

PAU_sdjt: "在山谷那一边"
PAU_sdjt_desc: "矿区入口的枪声终于停下来了，在我们把路面上的碎石和弹壳清理完后。我怀着复杂的心情来到了扣着晓枫的原本属于矿管的地下值班室里，几个负责看押的卫兵正站在门口等着我的发落。是用她的人头去王室领赏换取口粮，还是带上这个昔日的同僚一起去海港抢货，必须在天亮前拿个主意。"

PAU.6.t: "请松绑吧"
PAU.6.d: "来到营地，晓枫正坐在靠墙的椅子上，她的两只手腕被麻绳紧捆在椅背后面，冷漠地注视着我推门进来。\n“王室开给你的赏金可不低。”我拖过一张折叠椅坐在了她面前，“用你的脑袋换来的钱，足够给后面整支车队加满油吃饱饭了。”\n晓枫笑了一声，一点求饶的意思都没有：\n“老军团长走前，交代你护好留下的兄弟姐妹。阿夏，你就真打算带着那帮老兵，给王室当一辈子撕咬同胞的看门狗？”\n她越过我的肩膀，扫了一眼门外的车印：\n“还把压箱底的轻坦都给拉出来了……阿夏，你营地里的存粮撑不过今天了吧？你要是真想领赏，刚才在山上就该把炮弹直接灌进矿洞。你现在连把战车开回王都的油料都不够，少在这儿虚张声势。”\n当我还沉浸在被她这番话语戳到痛处的烦躁时，门口传来了急促的脚步声。\n小遥踢开门帘走了进来，肩头的小白兽还在探头探脑地打量四周。她径直走到晓枫背后，还没等我反应过来，她立刻从袖子里滑出一柄小折刀，刀刃一挑，椅背上的麻绳便散落了一地。\n两名卫兵下意识抬起枪口：\n“长官？！”\n“小遥，你干什么！？”我一把按住枪套站了起来。\n少女一点都没有害怕的样子，在一个转身的功夫，就解开了风衣内袋的扣子，取出一份盖着红色印章的信函，随手拍在了桌面上。\n“王室的金币你们是领不到了，阿夏长官。”\n“王都早就被南下的亡灵大军冲垮了，那些大臣眼下正忙着抢车逃命呢。”\n“我坐船出发的时候，商会批下来的护航合约上统共就写着两个名字。”小遥的视线在我与晓枫之间转了一圈，“一个是军团最后的带队人，一个是懂全盘战术的参谋长。”\n她收回小刀，看向正在活动手腕的晓枫：\n“卡卡罗姆艾瑞波拉这片地王室早就打算扔掉不管了。要是阿夏今天没带队强攻打通山道，再过几天赶到这里的，就是索拉娜的亡灵尸潮。你们谁也逃不掉的。”\n晓枫揉着手腕上的红痕，抬头看向小遥和我：\n“商会…亡灵……阿夏，原来不是奉命清剿，而是被这个不知道打哪儿冒出来的小丫头忽悠了，想去海港抢王室的仓库？”\n我盯着桌上那份印着樱花印章的文件，整个人都变得恍惚了起来。\n晓枫眼底的讥诮慢慢收敛：\n“看来王都的欠条终于把你们逼上绝路了。你想去码头抢油抢粮，我不拦你；但卡卡罗姆矿道里还有几百名罢工工人和伤员。你要是不把他们一起带走，我就留在这里。等亡灵漫过来，我看你将来拿什么去见死掉的老军团长。”"
PAU.6.a: "带上她吧，我们抓紧时间去港口。"
PAU.6.b: "先封锁道路，然后我们再去港口。"
pau_wlxz: "§R亡灵将会直接对我们宣战§!"
pau_wljy: "§R亡灵将会以决议的形式蚕食我们§!"

PAU_ddjr: "我们多带几个人吧"
PAU_ddjr_desc: "晓枫不肯一个人上车，卡车上的篷布底下也还能再挤一挤。燃油不多，但卸掉后排几箱子弹，就能多腾出位置拉上几个人。至于北边公社的雪伊……只能在电台里给她留个通报，能不能从亡灵嘴里杀出一条路，就全凭她自己的本事了。"

PAU.7.t: "人命与子弹"
PAU.7.d: "“车队装不下这么多人。燃油只够一口气跑到海港，多拉那么多人，大家到时候都得停在路上当靶子。”\n旁边的小遥正整理着风衣领口，笑眯眯地插了一句：\n“樱花的船很大，底舱正好缺一批懂得修机床和装配引擎的熟练工。只要手里还能拿得动扳手，到了那边，我们工钱照付哦。”\n晓枫抓住机会，直接又将了我一军：\n“听见了吗？他们是机械工，不是扛枪打仗的步兵。缴了他们的枪换成工具箱，这样总能拉上车了吧？”\n我呼出浊气，朝走廊外的副官招手：\n“去通知后排卡车，把弹药箱推下去。拆掉几块挡板，让能走动的全爬进车厢。挤不下的，手把栏杆扶紧了，哪怕掉下车我们也不会减速去捡的。”\n副官应了一声，迅速跑去传令。\n我转回身看着晓枫，提起了另一件事：\n“公社那边怎么说？雪伊还在北边的工厂区。卡卡罗姆一丢，索拉娜的尸群顺着铁路很快就会压过去吧？”\n晓枫走到了窗台前，扯出电源线将步话机插进墙上信号塔的备用蓄电池组，将发报频率旋钮拧到了底：\n“我们现在掉头回去，就是白白送死。雪伊不是傻子，看到王都方向的黑烟，她自己就会带人往外突围。”\n她把步话机往窗台高处一放，拉长了天线：\n“把这个留在矿顶的信号塔上，向他们全天循环播报车队的撤退路线和海港坐标。雪伊要是能杀出来，就会顺着车印追上我们；要是她杀不出来……我们去了也只是多搭上几条命。”\n晓枫的话音刚落，车库方向就传来了卡车排气管轰鸣的声浪。\n小遥也朝我和晓枫招起了手：\n“那么，两位长官，该去码头赶船了。”"
PAU.7.a: "“我们走吧。”"

PAU_zbgk: "开往海港的道路"
PAU_zbgk_desc: "为了安全起见，卡车的大灯已经全部关上了，几十辆车正顺着沿海公路全速前进着。车厢里挤得连转个身都费劲，车轮碾过坑洼时能听见悬挂嘎吱作响的哀鸣。北边天际线上的黑烟越来越浓，那是王都被尸潮吞没的火光。晓枫坐在副驾驶上盯着里程表，小遥在后面哼着家乡的调子。我们谁也没心思回头再看，所有的活路都被系在了港口的那批燃油和粮食上了。"

PAU.8.t: "快把大门钥匙交出来"
PAU.8.d: "伴随着车队在港区货栈的门前的刹车声，几名戴着王室帽徽的看守提着马灯从哨房里跑了出来，慌慌张张地举起手里的佩枪，还没弄明白怎么回事就被跳下车的士兵围在了墙根底下。\n“你们是哪个部队的？！”领头的看守官拉开嗓子喊道，手抖得连保险都拉不开，“这里是王都封存的军需，擅动者按叛乱论处！”\n我推开车门跳下踏板，脚底踩在了码头的湿水泥地上。\n“你们的王都早就没了。”我看着他的眼睛，“内廷那些老爷大概已经在给怪物填肚子了。想保住脑袋的，就把大门钥匙交出来。”\n看守官愣在原地，脸色唰地一下全空了。\n晓枫从车后面走了过来，手里拿着一把用来撬锁的撬棍，连看都没看那群吓呆的看守，直接插进了大门铁锁的扣环里。两名跟上来的工人用力一扳，挂锁啪的一声断成了两截。\n铁门里面整整齐齐码放着上千个木箱，麦粉的干香混着燃油味扑面而来。\n看到此景，车厢里的伤员和矿工们发出了一阵压抑的骚动，隐约还能听到几声如释重负的抽泣。\n小遥从车厢边沿跳下来，走到码头的水泥桩旁抬手指向漆黑的海面。\n海面上，两长一短的鸣笛声破开浓雾压了过来。\n放眼望去，能看到海湾深处，两艘悬挂着樱花旗帜的庞大军舰正缓慢驶入锚地，甲板上的探照灯打出一道道雪白的光柱，落在了我们的卡车前。\n“看，我没骗人吧。”海风吹起了小遥的风衣下摆，“船到了，王室的粮食和燃油也抢到了，多亏了我提供的信息哦。”\n晓枫站在敞开的库房门前，看着那些跳下卡车拼命搬运物资的工人和士兵，神色复杂地低声问我：\n“接下来呢？登船离开，还是把港口变成下一个阵地？”"
PAU.8.a: "“先把油箱灌满，别的事待会儿再说。”"

PAU_jmyx: "加满油箱"
PAU_jmyx_desc: "在战士和工人们提着油桶轮流给每辆车灌满之后，由于好几个月都没闻到过真正的饭菜香味，大家都围坐在了集装箱旁边狼吞虎咽着，甚至连掉在衣服上的肉碎都捏起来吃了。樱花的运输舰在栈桥边放下了登船跳板，他们的水手正忙着清点登船人数。此时此刻，我们的油加满了，我们的肚子也饱了，所以我们谁也没法装作听不见北面铁路线上传来的求救信号。"


PAU.9.t: "跳板搭稳时"
PAU.9.d: "工人们手里捧着刚用热水烫过的牛肉罐头坐在仓库门前的空地上，呼哧呼哧吃得满嘴是油。几个缠着绷带的年轻士兵也在互相碰着拳头庆祝好不容易得来的休整，这些都是我们在艾瑞波拉几个月都没见过的干劲了。\n小遥站在运输舰的舷梯旁，朝我招了招手：\n“我们的货舱腾出了好几个够你们睡大觉的隔间，里面淡水和饼干也都管够呢。阿夏，你们的人现在就能排队上船了哦。”\n闻言，我低头看着脚边的空油桶思索了起来。卡车的引擎已经全部热好，只要开上运输舰，这帮跟着我受苦受累的兄弟姐妹就能彻底从这场泥潭里脱身。\n但是，谁又能保证这艘船把我们带去何方呢？\n就在我犹豫时，港务室的门突然被人用力推开了。\n晓枫跨步走了出来。\n“通了。”她站在台阶上看着我。\n我转过身：“什么通了？”\n“留在矿顶的步话机。”晓枫摘下一边耳机递向我，“北区工业区彻底完了。雪伊为了掩护工人们的家属往港口后撤，自己带着车队把尸潮主力全引到了沿河的铁路，她们就只剩下几辆卡车了，弹药也快打光了。”\n耳机里传来了刺耳的电流杂音，隐约能听到雪伊在另一端粗着嗓子的嘶吼，伴随着密集的机枪点射和撞击声。\n小遥不紧不慢地走下跳板，而后站在了我们两人中间：\n“舰队必须赶在退潮前出港。要是亡灵主力涌进港区，樱花军舰会立刻收起跳板离港。我们的任务是接走你们，可没义务替游击队打阻击战啊。”\n晓枫把手里的耳机递得更近了些：\n“雪伊只要能冲过跨河铁桥，就能甩开后面的亡灵追兵。但那座桥被王室撤退时炸断了一截，车根本开不过来。”\n码头上的风吹起一波波海浪拍打在桩子上，碎成了一片片泡沫。\n夹杂在这海浪声中的，一边是已经搭好跳板、随时可以启航的运输舰；另一边是加满了燃油、炮口还能开火的几辆轻型坦克。\n所有的人都停下了手里的动作，回头看向了我。"
PAU.9.a: "“……二连留下来装船，其余人跟我上车，去铁桥接人。”"
PAU.9.b: "“……收起跳板，我们立刻开船。”"

PAU_zjwyj: "追加违约金"
PAU_zjwyj_desc: "小遥把一张重新拟好的赔偿清单直接拍在了挡风玻璃上。擅自掉头去救人等于把整个樱花舰队拖在浅水区当靶子，按规矩要赔上好几倍的运费。可她转头就抄起通讯，让外海的护航战舰把主炮转到了铁桥方向。嘴上说着蚀本买卖，手底下的舰炮火力却一发也没含糊。"


PAU.10.t: "副驾驶"
PAU.10.d: "燃油机的黑烟刚喷出来，车门就被人在外面用力拍了两下。\n还没等我踩下离合，遥拉开副驾驶车门拎着旅行包直接挤了进来，那只小白兽也跟着跳上仪表盘找了个地方趴了下去。\n我瞪她一眼说：“你上来干嘛？船不等潮水了？”\n小遥把包塞在脚下，从怀里掏出一副连着长天线的通讯器：“开船的指令我推迟了。擅自带着主力掉头救人，阿夏长官，你明白这在合同里叫严重违约吧？”\n坐在后排的晓枫刚核对完等高线图，正准备开口。\n我抢先松开手刹，打死方向盘把车头拐上了公路：“违约金记我账上，以后打工还你就是了。不过，要是怕死的话，现在跳下去还来得及。”\n小遥听得翻起了白眼，话语间满是嫌弃：“打工？拿你在泥巴里打滚的那点薪水还到下个世纪吗？”\n她不再跟我斗嘴，伸手按下了通讯器的发射开关发令道：\n“这里是小遥。通知海湾里的军舰，主炮解除待命。目标锁定沿河铁路线北岸，覆盖追击公社车队的尸群。”\n听筒那头传来藤井气急败坏的嗓门：“小遥？！我们刚把锅炉点着！……算了！瞎猫碰死耗子，你们自己找掩护！”\n交代完炮火支援，小遥侧过脸看着我，神情又变回了精明的小贩子：“救人的弹药损耗全算在你的债务账单里。等到了樱花，你手下这帮人每天都得老老实实去厂里上班。”\n轰——！\n海湾方向传来一阵撼动地面的轰鸣，两团赤红的火球撕裂夜空，呼啸着越过头顶砸向北面的山脊，气浪把公路两旁的灌木吹得一同弯下了腰。\n后座的晓枫望着窗外被炮火映亮的天际线，喃喃说道：\n“雪伊要是听见这动静，肯定以为又是哪路王室舰队来要她的命了。”\n“抓稳了。”我踩下油门，顺着火光直奔铁桥冲去。"
PAU.10.a: "“去把那个跑不动的家伙捞回来。”"

PAU.11.t: "断桥"
PAU.11.d: "来到断桥，江面上的雾气被远处的炮火撕得粉碎，跨河铁桥中央垮塌了一个几米宽的豁口，扭曲的钢梁斜斜吊在湍急的江水上方。望向对岸的铁轨旁，能看到一辆侧翻的货车冒着滚滚浓烟，几个公社伤员躲在桥墩后面躲避着流弹。\n车还没停稳，晓枫就撞开车门冲了下去，顺着倾斜的断裂钢板直接跑到了边缘。\n对岸靠在车轮后面的身影立刻抬起长枪，剧烈咳嗽着吼道：\n“对岸的是谁？！我手里的枪可不长眼！”\n那是雪伊的声音。\n晓枫站在断口前，双手拢在嘴边大喊：“雪伊！是我！”\n对岸的身影明显僵住了。雪伊抹了把脸上的污迹，瞪大眼睛认出了晓枫，紧接着目光就扫到了我和开上桥头的军用卡车上。\n“晓枫？！你没死？……等等，王室的狗腿子怎么也在旁边？！你又叛变回去了？！你们是来拿我换赏钱的？！”\n雪伊又惊又怒。\n我走上前，从车里拉出一根拖车缆绳，甩起带挂钩的那头用力扔过断口，稳卡在对岸的一根枕木上。\n随后冲着对岸吼了回去：“少在那边废话！王都早让怪物给吃了，谁有闲心抓你去换钱！能动的赶紧抓紧绳子爬过来，动不了的就绑在腰上，我们这边拉！”\n后面的小遥也跟着小跑过来，手扶着栏杆大声补充道：\n“动作要快哦！战舰的炮弹很贵，舰队只答应掩护十五分钟，超时了大家都要留在这儿喂亡灵呢！”\n\n在我的指挥下，工人们把伤员一个个固定在钢缆上。我们几名士兵抓紧缆绳，轮流把人拖过断口。雪伊也带着还能行动的人帮忙，\n可就在我们刚准备拉上最后一批的伤员时，对岸废墟里忽然涌出一大片亡灵。钢缆骤然绷紧，桥上残存的钢梁发出令人牙酸的断裂声；两名还没来得及过桥的工人拼了命得抱着缆绳，脚下却已经悬在空中了。\n“继续拉！那边还有人！”晓枫冲我喊道。\n我看见尸群正顺着钢缆扑来。再拖下去，亡灵就会沿着缆绳爬过断口；而一旦钢梁被亡灵的重量彻底压垮，我们桥头的人也会被一起拖下去的。\n“阿夏，等等！”晓枫似乎猜到了我的心思，立马伸手拦向了我。\n我冲到桥头锚点旁，抄起撬棍朝固定扣狠狠砸了下去。卡扣终于崩开，绷紧的钢缆猛地脱落，那两个人影随即带着身后的亡灵一起坠进了江雾，转瞬就被湍流吞没了。\n炮火仍在远处轰鸣，桥头却安静得只剩下众人的呼吸，直到最后被拉过来的雪伊扶着栏杆站稳，她睁大了眼睛，一直盯着被雾吞没的对岸说道：\n“……阿夏，你对我们做的那些畜生事，我可没答应就这么算了。”\n我把一盒热好的牛肉罐头塞进了她的怀里：\n“我也没打算让你就这么算了。不过，还是先吃点东西再说吧。”"
PAU.11.a: "“所有人上车，登船。”"

PAU_zmxx: "装满鲜血的罐头"
PAU_zmxx_desc: "撤回港口的卡车还没熄火，车厢里就吵翻了天。脱险的侥幸被对岸留下的血腥味冲得干干净净。雪伊不肯咽下军团分发的口粮，指着车厢里的伤员厉声质问。卡卡罗姆阵地上被炮火轰碎的工事、铁桥北岸没能抓牢缆绳的同伴，成了横在所有人中间拔不掉的钉子。谁也没法替死在路上的兄弟姐妹大度地假装一切都没有发生。"

PAU.12.t: "谁留在对岸"
PAU.12.d: "返程车队到达港口的时候，我刚刚下车，就听见了车厢后面传来一阵压抑的咳嗽声。往车厢看去，十几个刚从江水里捞上来的伤员挤在帆布底下，身上还在往下淌着不知是血液还是泥水的液体。\n雪伊就瘫坐在车尾板旁边，怀里还紧抱着刚才塞给她的那个牛肉罐头。\n晓枫也跟我一起走了过来。\n瞥见了晓枫的身影，雪伊这才慢慢抬起脸，脸上早已分不清是江水还是眼泪了：\n“晓枫…死掉的那两个……是工厂的学徒工，他们连个像样的鞋子都没有。他们的师傅，是老罗根，他为了给卡车垫后，才被怪物扑进水里的……绳子，怎么就断了呢？”\n晓枫按在车板上的手收紧了：\n“如果不断缆绳，那群怪物几分钟就能顺着爬过来。到时候我们都要留在那里的。”\n“我知道！”\n雪伊的嗓子彻底哑了，一巴掌拍在了冰冷的车板上：\n“我知道你算得对！你每次都算得那么清楚！可为什么留下的是他们？！凭什么开枪断后的是他们，坐在车里活着吃肉的是我们？！”\n“缆绳是我砍断的。”\n雪伊闻声立马瞪向了我。\n“在卡卡罗姆开炮清路的是我，在桥头下令弃车断缆的也是我。”我迎着她的视线继续说道，“你想发牢骚就冲着我来，少在这里冲着晓枫发难，她手里的枪早就被我缴了。”\n\n不知海浪拍打栈桥的撞击声持续了多久，一直站在跳板旁的小遥抬手看了一眼天色，轻声提醒道：\n“港口的军舰已经在催人了。距离潮水退去只剩最后几分钟，想吵架的话，等所有人都活下来，到了船舱里有的是时间吵。”\n晓枫走到车厢边缘，朝雪伊伸出了手：\n“下车吧，雪伊。把眼泪擦了，我们去帮后勤队抬担架去。”\n雪伊避开了晓枫伸过来的手，自己扶着栏杆摇摇晃晃地站了起来。她翻下车厢，抱紧那罐一口没动的罐头，一步步走向了跳板前坐着的伤员们。"
PAU.12.a: "“去核对登船名单，一个名字都不许漏。”"

PAU_jjka: "紧急靠岸"
PAU_jjka_desc: "谁也没料到亡灵会从几百米深的海底浮上来。船的尾舵被水下的断木撞坏了，海水直接往轮机舱里灌了进来，凭这副破损的船体根本不可能横穿大海。顺着航标灯的指引，船队只能拐进圣杯王国设在孤岛上的前哨站。那里的港务官咬死规章不松口，硬要扣下货舱里五成的粮食和燃油当作停泊税。为了给舱里的伤员争取抢修时间，只能咬着牙认下这笔盘剥。"

PAU.13.t: "按圣杯的规矩办"
PAU.13.d: "脚底下的甲板传来第一声撞击时，大家还以为只是碰上了暗礁。\n紧接着又是两下剧烈的震颤，底舱的油桶被当场震翻，混着海腥味的冷水顺着甲板缝隙猛涌上来。\n探照灯的光柱往水下一照，浮上来的都是缠在沉船残骸上的泡胀死尸，几具骷髅甚至抓着船舷的排水孔，顺着铁锚链往上爬。\n谁也没想到索拉娜的尸潮早就顺着海底海沟蔓延到了大海深处。\n虽然甲板上的火炮打碎了水下的骨架，但船尾的舵面被撞变形卡死了，想靠这副破损的船体横跨大洋无异于白日做梦。\n挨到天亮，冒着烟的船队只能顺着航标灯，拐进圣杯王国设在近海孤岛上的巡防基地。\n刚进港口，巡逻艇的高音喇叭就传出通告：\n“未通报的武装船只，立刻落锚熄火。甲板人员退后，接受战时卫生检疫。”\n晓枫扶着被海水打湿的舷梯扶手，朝岸上的哨塔抬起视线：\n“圣杯在南大西洋的据点，遇上这帮吃人不吐骨头的，看来我们要遭老罪了。”\n一名披着海军常服的圣杯军官踩着跳板走上甲板，目光扫过浑身硝烟味的士兵和伤员：\n“船身有严重的死灵污染痕迹。按港口条例，我必须拒绝未登记的武装难民入港。”\n我刚想上前拿货物清单交涉，身旁的小遥已经一步跨到了我身前。\n她翻开风衣领口亮出那枚徽记，顺手将一份盖着鲜红印章的公函递到军官面前：\n“我是樱花派遣的随船全权代表春日小遥。这几艘船登记在我们的护航名册下，船上的人员属于受公约保护的随船技工。”\n圣杯军官扫过印章，原本冷淡的神色微敛，换上公事公办的辞令：\n“既然持有正规使节公函，港口可以依照避难条约为你们提供船坞与消杀药品。但入港税照旧，我们要征收货舱里五成的货物作为停泊与消杀的担保。”\n这简直是在明抢，那些物资是所有人拼了命才从仓库里拖出来的。\n“可以，按你们的规矩办。”小遥在停泊单上签下名字，将单据递还了回去，“请立刻接通岸上的维修电缆，安排伤员进棚治伤。”\n军官收好单据，行了个标准的军礼，挥手示意岸上的起重机准备卸货。\n看着一箱箱货物被吊上栈桥，晓枫靠在栏杆边感叹道："
PAU.13.a: "“至少……大家暂时不用沉进海底喂鱼了。”"

PAU_wcka: "老家根本回不去了"
PAU_wcka_desc: "拿口粮换来的停泊许可撑不了几天，樱花那边传来的消息更是直接断了大家的念想。开回南美迎接数不尽的亡灵无异于自讨苦吃，继续往前又是樱花军警把守的死胡同。几千名兄弟姐妹还在舱底等着出发的口令，我们已经不能再等下去了。"

PAU.14.t: "缉捕名单"
PAU.14.d: "小果子把耳机紧贴在耳边，随后回过头看起了我们，带着快要哭出来的腔调喊道：\n“小遥姐姐……广播里反反复复放着的明明都是军乐，报出来的也全都是叛徒被捕的名单，码头工会那边根本没人回话呀……”\n晓枫把那份文件推到了小遥的眼皮底下：\n“上面的商会印章几年前就作废了，樱花根本没派过所谓的官方使节。这支船队到底是谁调来的？”\n我盯着桌对面的少女，省去了所有客套：\n“所以，你带着我们在山道上拼命，又割掉一半物资给圣杯交税，结果海对面的码头我们根本靠不上去？”\n屋里的空气一下子凝固了。\n小遥靠在门旁，原本嘴硬的神气一点点塌了下去，整个人显得有些无所适从。\n“……对，公函是我偷刻了印章伪造的。”\n“可我有什么办法？！老家那边天天被警察封锁，大家连饭都吃不上了！藤井他们好不容易把船开出来，我……我只是想带懂打仗的人回去帮大家救命啊！”\n她继续委屈得说道：\n“我要是老老实实跑到你们营地去要饭，说我只是个被通缉的穷学生，阿夏你会把坦克开下山吗…你们谁会多看我一眼嘛……”\n“我原本以为……只要带你们回去，工会就能挺过去……我怎么知道那帮发疯的军官会突然开枪政变啊……我怎么知道他们几天就把老家彻底变成军营了啊……”\n“反正事情是我搞砸了。你们要是觉得被我骗了，现在就把罪名加在我身上把我捆了送去给王室领赏，或者直接捆了扔下海，我没话说！”\n靠在门边换药的雪伊嗤笑了一声：\n“行了，少在这儿演英雄受刑的戏码。当年的王室比你会算计得多，我们还不至于蠢到拿一个小姑娘的脑袋去讨好它们。”\n晓枫顺手把海图摊开在两人中间，打断了空气里的紧绷：\n“用不着把什么罪名都往自己身上揽，小遥。卡卡罗姆那一仗，就算你没来，阿夏为了手底下士兵的活路也会跟我们鱼死网破的，我也不可能就此把那里让出去。那是迟早要撞上的坎。”\n晓枫在图纸上用力点了两下：\n“所以我们现在的麻烦是，南美大陆回不去了，你们的老家也彻底变成了疯子军管的死路。至于你欠我们的，可不是像你说的那样一下子就能解决的事，等以后找到能落脚的地方再说吧。”"
PAU.14.a: "“我们得重新商量怎么活下去。”"

PAU.15.t: "你到底是个什么来头"
PAU.15.d: "我拽着小遥走到仓库后方的背风拐角。等走廊里的脚步声彻底走远，我才靠在栏杆上点着了一支烟：\n“公函的事晓枫已经挑明了。我现在只想知道两件事。”\n我吐出一口烟气：\n“第一，你一个小丫头，到底是怎么摸清我和晓枫的底细，甚至连沿海公路那个隐蔽军需库的防卫换岗都算得一清二楚的？”\n小遥把下巴埋在了领口里：\n“王室走私船的大副是个酒鬼，喝醉了把随船公文全落在了舱里。单子上写得明明白白，王室把换来的军需全囤在沿海公路的转运栈桥，守备队每隔四小时换一次岗。藤井他们只懂开船，陆战根本摸不进守备森严的铁网，我必须找懂行的人带路破门。”\n我掐灭烟头，抬手指向了她风衣领口里缩着的那团白毛：\n“第二，这只毛团到底是什么来头？在山道上能提前察觉到亡灵，在深海里甚至能把爬上锚链的水鬼震下去，它也是你从走私船里捡来的？”\n小遥伸手拨开围巾，轻轻顺着白夜背上的软毛：\n“它叫白夜，是后山神社里代代养着的山灵。我们的小镇因为经济萧条变得特别穷，神社因为交不上税就被警察贴上了封条。那帮收债的跟外国走私商签了合同，说是要把白夜装进笼子卖给巡回马戏团来抵债。我和同伴们看不下去了，就趁夜把它给偷出来了。”\n她把围巾拉高，露出小白兽软趴趴蜷缩着的模样：\n“它天生对死气和恶念敏感。在山道上，几十里外只要有怪物聚集，它就会立马炸毛哼唧，带我们挑没怪物的荒路走；在大海里，也是它拼命耗光了所有灵气护住龙骨……现在它累了，连耳朵都耷拉着动不了啦。”\n海风把她的白发吹得乱糟糟的，怀里的白夜正发出微弱的呜咽，爪子无意识地抓着她的衣襟。\n看着眼前这个满嘴大话、怀里却护着一只小动物的落魄少女，我原本堵在胸口的火气莫名消退了下去。"
PAU.15.a: "“走吧，回屋里去，看看晓枫她们怎么说。”"

PAU.16.t: "掉转船头"
PAU.16.d: "“把船直接开进老铁厂的排污河道！趁着涨潮把坦克吊上岸，顺着铁路线就能抄那些怪物的后路！”\n刚到门口，雪伊的大嗓门就撞了过来。\n晓枫站在几只箱子拼成的桌前，手里的笔在图纸上停了下来：\n“然后让吃水深的大船在退潮时搁浅在烂泥滩上，大家跳进水里推船吗，雪伊同志？”\n“……晓枫！你能不能少泼点冷水？！”雪伊被噎得只能瞪起眼来。\n小果子急忙举手打圆场：\n“晓枫姐，雪伊姐，别吵啦！港口那边的电台又来消息了，是铁道编组站的留守工友发来的！”\n“多亏了雪伊姐之前把尸潮主力引向了断桥，港区趁机把几千名撤退家属全接进了海港的工厂！工人们把厂区大门焊死了，还顺手撬开了王室留在编组站的军械库！”\n“军械库？”我和小遥听见让人出乎意料的话语，一前一后跨进了门槛，“里面有什么？”\n“堆满了大口径炮弹和成箱的炸药！”小果子对着空气有模有样地比划着，“但工人们全是在车间摇机床的，根本没人会开炮瞄准，更没有能掩护步兵的战车！围在断桥的怪物群发现上当，正在调头往港口围过去的路上，大家快要顶不住了！”\n话音刚落，雪伊一把将手里罐头按在桌面上，咬牙切齿地低吼：\n“我们死在铁桥上的那些兄弟姐妹……就是为了保住船厂里那几千条人命！他们手里有炮弹，我们手里有坦克和正规炮手，杀回去正好里应外合！”\n“索拉娜的力量失控了，海底下冒出的亡灵就是证据，她现在根本压不住那些怪物。主力早就全被拖在内陆王都打混战去了，沿海的防线早就已经空掉了。”\n小遥靠在桌边，也跟着摊手：\n“反正老家那边到处都在通缉我，我是回不去了。与其在大海上漂成淹死鬼，不如跟你们拼一把，好歹船上那两门大炮还能替你们开路呢。”\n见众人都如此充满决心的样子，我不禁感慨道：\n“真拿你们这帮不怕死的没办法。去通知水手准备起锚，把坦克和剩下的弹药都固定好。”"
PAU.16.a: "“我们再相信自己一次吧”"

PAU_dsyq: "现在，赌上我们的一切吧"
PAU_dsyq_desc: "离开那片土地的时候，我们是一群丢盔卸甲的逃亡者；\n而现在，翻滚的浪花正把我们推回那座燃烧中的故乡。\n前方的海岸线越来越近，每一门火炮都已经校准完毕……\n\n§R我们，该回家了。§!"

PAU.17.t: "压根没有什么特派员"
PAU.17.d: "“小遥小姐，下次千万看好白夜，别让它再钻进配电箱了，电缆皮都差点被它当磨牙棒啃烂了。”\n那只小白兽正舒舒服服地趴在小遥的膝盖上，懒洋洋地打了个大哈欠。\n我走上前，抬脚踢开脚边挡路的撬棍：“吊臂检修完没有？晓枫在前面核对航标，让我过来确认一下那两门炮的俯仰角和装填速度。”\n水手见我过来，心虚地瞅了一眼小遥：\n“这位长官……实话说吧，我们根本不是正规海军。眼下掌舵的是被海校退学的士官生藤井，我们几个在上船前尽是些在底舱铲煤的炉工。船厂里倒有两个负责炮塔装配和测距调试的技工，可他们在来南美之前从没在战场上开过炮。”\n我手里的航海图差点掉在甲板上。\n“……你说什么？”我扭过头瞪着小遥。\n小遥手里挑麻绳的动作突然停住了。她缓慢的抬起了头，干巴巴地笑了两声，眼神飘向了一旁：“哎呀，阿夏长官，别在意这些细节嘛。你看刚才的炮火支援不也打得挺准的嘛？”\n旁边的水手索性把抹布扔进铁桶，把实情全倒了出来：\n“长官，您就别听小遥小姐吹牛了。这原本是政府向我们厂订购的巡防舰，用来在沿海巡逻护航。结果军舰刚造好、大炮刚装上，内阁换届削减预算，一纸公文直接毁约拒付尾款！厂长卷钱跑路，银行要带警察把新舰按废铁拍卖抵债，全厂工人连买米的钱都没了！藤井气不过，带着大家把船坞反锁，连夜把两艘没挂牌的军舰当工钱强行开出了港口！”\n水手伸手指向缩在旁边的小遥：\n“小遥小姐当时在码头掩护几个反抗抵押拆迁的学生逃跑，被警察追得没路走，顺着缆绳滚进了我们的运煤舱里。我们每人都背着通缉令，哪里的港口都进不去，只能靠藤井自学的那点看星星认路的本事一路往东漂，想着跑来南美找个地方隐姓埋名混口饭吃。”\n“所以你明知道这不是正规护航舰队，却一直没把实情说清楚。”我卷起海图，面无表情地盯着小遥。“你知道我们急着找一条活路，就把两艘逃亡者开出来的船说成有官方担保的护航舰队。要是炮击打偏了，或者船在海上再出一次故障，船上这些人的命怎么办？”\n小遥把膝盖上的白夜一把抱进怀里挡住了脸，似乎又想用一句玩笑糊弄过去，最后才小声说：\n“我只是…不想让大家……”\n“我知道你想救人。”我打断了她。\n……\n开着装满大炮的正规军舰到处流浪要饭，这帮人到底是怎么活到今天的？"
PAU.17.a: "“去把说明书拿来，我现在教你们怎么瞄准。”"


PAU.18.t: "既然我们早已无处可逃"
PAU.18.d: "“阿夏姐，岸上接通了……他们正到处问，海面上是不是有船来救他们了……”\n小果子把耳机递给我，双手抖都快抓不住了。\n狭窄的驾驶室里连转身都困难。缠着纱布的老兵、满身灰的水手，还有靠在门边换药的伤员，全都在看着我。\n我伸手接过那个还带着体温的话筒，按下了通话开关。\n广播喇叭与沿海无数部破旧的收音机里，同时响起了粗糙刺耳的电流声。\n“救你们？”\n我对着话筒自嘲地张开了嘴巴：\n“听清楚电台里的声音，我是阿夏。\n在工区碾碎罢工的工人的是我，在铁桥上砸断缆绳扔下同伴上船逃命的也是我。对岸要是还有活人，应该还认得我这惹人厌的声音吧？\n当年老军团长走后，晓枫拉着队伍退进深山。她指着我的鼻子骂，说军队不该永远给腐朽的王权当狗，该为了底下受苦的人流尽最后一滴血。\n我何尝不知道她是对的？晓枫画出来的蓝图那么干净、那么漂亮。可谁来管那些断了腿、除了开枪修车什么都不会的老兵？谁来管营房后头几十个连稀汤都喝不上的家属？我自以为守着合同四处讨饭是在替大家抗下所有脏水。所以在卡卡罗姆撞上的时候，我把炮口对准了她。\n我逼着自己不去想山梁上那面旗子，逼着自己相信开枪全是为了活命——可其实，我只是嫉妒她。我嫉妒她敢清清白白地去守着理想，而我只能带着大家在烂泥里永远当个恶人。”\n这几年，我把王室那几张欠条当成了救命稻草。每次运粮官送来推迟兑现的字据，我都对自己说，再等等，再熬几个星期，王都总会把军饷发下来的。我们替他们守了这么多年要道，他们总不至于真把大家活活饿死在山口里。我守着这点可怜的侥幸自欺欺人。为了维系这份苟延残喘的合同，我甚至冲着劝我离开的同伴拔枪。\n直到那个白发丫头揣着盖了假章的单子撞进营房。\n她嬉皮笑脸地说明天去抢王室的仓库，外海有大船能接我们逃跑。这种荒唐话任谁听了都觉得不可信，天晓得这个不知从哪儿冒出来的丫头到底在盘算什么。\n可营地里的库房彻底见底了，大锅里连野菜都煮不出几片了，身后的老兵饿得连枪栓都要拉不动了。\n所以我咬着牙跟她赌了，去抢仓库、上了外国的船。\n我以为只要把你们全甩在身后、只要逃得够远，就能把这些亏心事全当成没发生过。”"
PAU.18.a: "……"

PAU.188.t: "既然我们早已无处可逃"
PAU.188.d: "“结果呢？我们在大海上挨了亡灵的撞击，我们拐进了圣杯的孤岛，还让人家生生剥走了一半救命的口粮。好不容易挨到修好船舵，电台里传来的，却是这白毛丫头的老家也落进军阀手里的死讯。“\n“我们成了公海里哪座港口都不收的黑户，连个能下锚的水道都没有。”\n“这时候电台响了。你们在海岸线上被怪物堵在厂房里，连弹药都快打光了，却还在冲着海面发报，问是不是有船来救你们了……”\n你们居然在向一个自私透顶的逃兵求救啊。这真是我阿夏这辈子听过最难受、最让人抬不起头的笑话了。\n我听到这句话，我真恨不得把自己的脸皮剥下来扔进海里。”\n我冲着话筒用尽全力吼了出来：\n“如果我们早就没有地方可以逃跑了——\n那我们就掉头！把船开回去！不就行了吗？！”\n厂区里的工友，自卫队的兄弟姐妹，给我找结实的掩体趴好！\n我没脸求你们原谅，更不配当什么救世主。我是在大海上吓破了胆、连家在哪都找不到的逃兵。我们把船开回来了……回来求你们收留，求你们救救我们这帮走投无路的人！”\n咔哒一声，我关死开关，把话筒重重挂回铁钩上。\n雪伊背过身去，低声骂道：\n“真是个无可救药的混蛋……早点这样说不就好了。”\n晓枫站在海图台旁看着我，脸上露出了重逢以来少见的笑意。\n“听到了吧，藤井！见风使舵可从来不是我们这帮叛徒的规矩，把主炮的保险全给我打开！”小遥猛拍传令管，冲着底舱大声喊道。\n巡防舰的前主炮猛然喷吐出刺目的火球，炮弹带着尖锐的呼啸划破夜空，笔直砸向了海岸线上那片被死气笼罩的废墟。"
PAU.188.a: "“全舰全速推进，我们回家了。”"

PAU.19.t: "明天还得继续出操"#拿下亡灵
PAU.19.d: "桌上摊着刚送来的几张紧急报告，城镇和矿区的求救通报一条接着一条发了过来。\n城里的危险虽然过去了，但山里的残存亡灵还在骚扰各处村庄，躲在地窖里的百姓急需救援。\n雪伊猛站起身，手边的陶杯被带翻在地，啪的一声摔得粉碎：\n“南区工厂和铁道那边还有几千个家属和学徒！刚抢通的线路要是被截断，大家明天连早饭都吃不上！我去带人救他们！”\n晓枫站在地图前冷静地指出要害：\n“如果水电枢纽被破坏，海港的生产几天内就会陷入瘫痪。不能等了，现在必须继续推进阵地。”\n她迅速卷好图纸，随手把喝空的杯子甩进墙角的废品桶里，啪嚓一声砸得粉碎：\n“我去调配弹药与炮兵。”\n我按着腰间的枪套站起身，故意埋怨着：\n“我还打算安稳睡一觉呢，真是群叫人操心的家伙。带上家伙跟我走，总不能留下烂摊子让别人替我们收拾。”\n我仰头喝完最后一口水，随手把杯子往地板上一甩，同样砸得粉碎，迈步跟了上去。\n随着大家急匆匆地各奔东西，原本热闹的大厅转眼间就剩下了小遥一个人。\n小遥还像傻子一样端着那个刚倒满水的杯子，呆呆地看着门口。\n她瞅着地上散落一地的碎片，忍不住冲着门外大声抗议起来：\n“喂！你们一个个着急就砸东西是跟谁学的啊？！这些杯子明天后勤还得花钱去买呢！雪伊！阿夏！你们赔我买杯子的钱啊！”\n大厅里一下子安静下来，门外已经传来了人员调动的呼喊与卡车的引擎声。\n小遥低头盯着手里的杯子，小声嘀咕着：\n“……真是的，走得那么快。反正少了我他们肯定搞不定嘛。”\n她心一横，抬手把手里的杯子也用力往地上一砸，当然也摔了个粉碎，随即抱着白夜追了出去：\n“——等等我啊！我也要去！”"
PAU.19.a: "出发，彻底清除所有的亡灵！"#触发h4事件

PAU_zhyk: "最后一箱罐头"
PAU_zhyk_desc: "从仓库里拖出来的罐头就剩下最后几箱了，等伤员和工人们分完这锅肉汤，后厨的锅底就彻底见光了。城外的麦苗早被亡灵践踏成了烂浆，车库里那几台车的汽缸也裂了缝了。拿惯了步枪的老兵不会摆弄农具，懂车床的工人们又饿得拿不起扳手。要是赶在下个冬天来临前没法让工厂重新开工、没法把麦子种进地里，大家就算没死在战场上，也得在这座空港里活活饿死。"


PAU.20.t: "开着战船去打鱼"
PAU.20.d: "我看着墙上挂着的存粮清单，上面的数字已经被晓枫用红笔划掉了好几遍。\n后勤库房里剩下的面粉只够维持短短几天，地里的麦苗也全被亡灵踩成了黑色的泥浆。内陆的运粮道被王室的残部卡死了，圣杯王国的军舰又在海湾外面虎视眈眈。要是再弄不到吃的，刚打下来的港口立刻就会变成一座饿殍遍地的死城了。\n正当我头大时，门突然被人用靴子一脚踹了开来。\n小遥卷着沾满水气的裤腿跑了进来，手里还拎着一个木桶。她把木桶往桌上一放，两条银亮的海鱼立马在水里扑腾出大片的水花，溅得海图到处都是。\n“看！海里的大鱼！”小遥抹了一把脸上的水珠，眼睛亮得像是在发光，“内陆的土地被死气泡烂了，但外海深水区的鱼群可不知道索拉娜是个什么东西！”\n晓枫抬起头，有些迟疑地指着窗外的海湾：“港里的渔船早就被王室撤退时全烧光了，我们拿什么出海？”\n“谁说要用木头渔船啦？”小遥跳到桌边，得意地拍向胸口，“藤井他们把货船上的吊臂改成了拖网绞盘，巡防舰前面那两盏高功率探照灯夜里往水里一照，成群的鱼顺着光就往网里钻了！我和水手们试捞了一网，甲板上堆得连站脚的地方都快没了！”\n她从兜里掏出一张画得密密麻麻的草图，直接拍在我和晓枫面前：\n“不仅是打鱼！我让工人们把几辆印着王室徽章的轻坦炮塔也拆了，换上装卸铲，拿柴油机当牵引车去犁地排水。只要把泥层底下的盐碱翻出来晒透了，再掺上木屑和腐殖土，下周就能把耐寒的种子给播下去啦！”\n我看着草图上那些字迹歪扭却详尽无比的机械改装图样，不由得愣住了。\n这个平日里满嘴胡话的异国少女，办起正事来竟然意外得利索。\n“阿夏，别愣着啦！”小遥伸手推起我的胳膊，笑嘻嘻地催促道，“快让你的老兵们换上干活的衣服，跟工人们一起去海滩拉网吧。今晚我们要让全城的人都吃上一顿海鲜大餐！”"
PAU.20.a: "“去通知各连队，全员去码头帮水手拉网。”"

PAU_wrcr: "谁也不想承认这里"
PAU_wrcr_desc: "逃走的王室给各国港口发了通报，把我们打成了霸占沿海的叛乱暴徒。圣杯王国的巡逻船天天在港外游弋，借着防瘟疫的名头把航线封得严严实实。更让人头疼的是，樱花本土那帮新上台的军官在每天都在喇叭里反复播报着通缉令，逼藤井把军舰开回去受审，小遥的名字更是排在了第一位。在外人眼里，我们是一群连出港证明都开不出来的黑户；在我们眼里，公社工人、军团溃兵和樱花逃兵全都挤在了同一个国家里，大家到底算是一支军队还是一个新政权，谁也没法给出一个定论。"

PAU.21.t: "抢群众面粉的外乡人"
PAU.21.d: "“这车面粉是工会先排队领的，你们凭什么横插一手啊？！”\n粮站门前，气得不行的铁路工人正拽着运粮板车的把手。\n对面的老兵抓着车栏和他起着争执：“昨天夜里在雨里替大家站哨巡逻阵地的人可是我们，口粮应该给我们才对！”\n两边的人越聚越多，工人和老兵各自抓紧了手里的家伙，眼看就要动手。\n我和晓枫正要上前叫停，小遥就一下子站到了人群正中央。\n“诶诶诶！都闭嘴，听我说两句！”\n人群停下了推搡，老兵和工人都抬起了头。\n小遥的神色少见地凝重起来，目光深沉地扫过面前的每一个人，言语间甚至带上了一种近乎悲壮的庄严感：\n“我知道，看着这袋面粉，大家心里都压着很重的心结。”\n“一边是当年在工区遭受的苦难，一边是驻防在黑暗里流血的军人天职。作为跨越大海来到这里的异国同伴，我深知这种矛盾的复杂与痛苦。我思考了很久，思考着正义，思考着牺牲，思考着历史与命运的沉痛重量……”\n“——所以我想通了。”\n周围的人群闻言都跟着安静了下来，一直到老兵和工人们都下意识屏住呼吸时，小遥才煞有介事地指起自己的鼻尖：\n“这袋面粉其实应该归我才对。”\n台下的人被这句突如其来的话震得僵在了原地。"
PAU.21.a: "“……”"

PAU.211.t: "抢群众面粉的外乡人"
PAU.211.d: "人群后面，一个抱着饭盒的小姑娘怯生生地探出头来：“春日小姐……这袋面粉真要被拿走吗？我妈妈说今天排到我们家了……”\n小遥指着自己的手停在半空，脸上的笑容也僵住了。她本来只是想用一句荒唐话把两边的火气打散，却忘了对这些人来说，面粉不是能随手拿来逗趣的东西，可能就是一家人今晚唯一的一顿饭。\n“……我开玩笑的。”她把手从面粉袋上收了回来，脸红到了极点，“这车面粉先照原来的名单发，排到谁家就给谁。老兵夜哨的口粮我们另外让后勤核账，不能拿工会已经登记好的粮食来补了。”\n年轻工人仍旧盯着她：“那刚才你说面粉该归你，也是开玩笑？”\n“是……是我嘴欠了！”小遥没有再替自己找理由，“你们明明饿着肚子，我还拿这个开玩笑，是我想得太少了！”\n她又连忙指向争执的两边：“不过…不过你们要是继续堵在这里的话，只会导致粮车卸不了货，到时候……就谁都领不到了。”\n人群仍然有些别扭，但工人终于松开了板车把手，老兵也把抓着车栏的手放了下来。两边的人互相瞪了几眼，才不情不愿地合力把车推向仓库。\n小遥跟在车后面走了几步，像是终于想起自己还该维持点原来的架子，便又乐呵呵地凑到了我面前：\n“阿夏长官，我刚才处理得还行吧？今天的午饭……能不能多分我点？”"
PAU.211.a: "“…………”"

PAU_tyzz: "同一张桌子"
PAU_tyzz_desc: "从王宫里搬出来的大会议桌被工人们合力抬进了车库。雪伊带着工会代表占了桌子左边，阿夏手底下的老兵规规矩矩地坐在右边，晓枫把新拟定的配给条例摊在了桌子中央。藤井和几个樱花水手原本有些拘谨地挤在桌尾，直到小遥抱着白夜一屁股坐上桌子，大声宣布他们这帮外乡人也要按期领工资时才放松了不少。这是一群走投无路的亡命徒在天黑前搭起的临时草台班子。用几张垫在油渍上的纸，大家才勉强把枪口从对方脑门上挪开，围在一口锅前商量接下来怎么把各自的肚子填饱。"

PAU_mzyy: "埋葬夜莺"
PAU_mzyy_desc: "在过去漫长的岁月里，亡灵的低语从群山一直蔓延到了海边，把原本繁荣的集镇与工矿变成了亡魂游荡的空城。既然带来灾祸的王室已经瓦解，亡灵的源头也已被彻底斩断，我们就没道理再让阴影继续笼罩在这片土地上。死者理应归于安息，生者必须向前迈步。这场纠缠了所有人数年的噩梦，该由我们亲手画上句号了。"

PAU.22.t: "她们不会再出来了"#打死夜莺
PAU.22.d: "“索拉娜！滚出来受死！”\n这间屋里弥漫着一股刺鼻的苦草药味和焦糊的臭气，索拉娜就歪在窗边一张藤椅上，她的两只手腕裹着渗血的布条，整个人看起来消瘦了不少。莉莉安娜正坐在旁边的椅子上，手里拿着一把梳子，一下一下替她理着打结的头发。\n听到踹门的巨响，索拉娜不自觉地抽搐了一下。她挣扎着想从椅子上站起来，膝盖却一软，重新栽回了椅垫里。\n“叫什么叫……”索拉娜咳出一口血沫，恶狠狠地盯着我们，“……带枪进来了不起啊？往脑门上打，要是眨一下眼睛就不算活过！”\n雪伊将枪口直接顶在了索拉娜额前：\n“厂里死掉的工人们，还有那些没能爬过来的那些兄弟姐妹们……你今天必须拿命赔给他们！”\n晓枫走上前，伸手翻开桌面上那些散落的草图和满是血迹的撤退命令，随即看到了索拉娜垂在身侧那条焦黑溃烂的手臂。\n“雪伊，先把枪放下来。”\n“凭什么？！”雪伊头也不回地怒吼，“她是罪魁祸首！”\n“她在后面根本就指挥不动那帮怪物，你以为我们是怎么打回南美的。”晓枫把手里那叠被血浸透的军令扔在了桌上，“在沿海公路撤退那会儿我就觉得不对劲，那些亡灵连王室自己的车队都砸，港口外面的水鬼更是连他们的运粮船都连带着一起拖进海底了……她早就被力量反噬了。后来的仗，她是被失控的亡灵一路追杀逃进这间屋子的。”\n索拉娜嘴里却还在硬撑着：“晓枫……少在这儿装什么明白人……是我抢了心脏，是我把这片地变成这样的，你们开枪啊！”\n莉莉安娜默默从兜里摸出一块糖，塞进索拉娜吵闹的嘴里，还顺手替她把滑落的毛毯拉到了脖子底下。\n索拉娜被突如其来糖块噎住，终于没力气再嚷嚷了。\n雪伊握枪的手更用力了，枪口随着她的胸口剧烈起伏着：\n“就算她被反噬了又怎么样？！死掉的那些人就能活过来吗？！”\n“不能。”\n我走上前，伸手把雪伊的枪管按了下去：\n“但你现在把她打成筛子，除了把旁边那个神惹毛、把这片地再炸平一次，换不来一斤粮食，也修不好一列火车。”\n雪伊咬牙盯着藤椅上那个被像喂废人一样喂着糖的索拉娜，收回了步枪。\n“雪伊……开枪啊！……胆子这么小了吗？”\n“想死？你做梦。”\n“你就待在这间屋子里，好好听着那些被你害死的人在你耳边叫唤一辈子吧。”\n莉莉安娜重新坐回椅子上，伸手握住了索拉娜那只焦黑溃烂的手掌，说道：\n“心脏……我已经收回来了。索拉娜她……现在连路都走不动，闹不了多久了。这里的门我会关上的，请你们…走吧……”\n“走了，雪伊。”我拉下帽檐，转身往外走去，“通报上写索拉娜在城破时死在反噬里了就行。莉兰迪亚还有几万张嘴等着吃饭，我们可没工夫把时间烂在这间死人屋子里。”"
PAU.22.a: "“把门锁好，别再让她跑出来了。”"


PAU_gxzp: "挂上新招牌"
PAU_gxzp_desc: "硝烟还没散干净，大门前就被钉上了一块临时办事处的木板。\n这也配叫办公室？我这双拿惯了炮门拉绳的手，如今每天得在几百张烂纸条上签字。老兵们堵在走廊右边要过冬的粮饷，工会的代表堵在左边门口抗议巡逻队踩坏了菜地。两边在大厅里撞见，空气里紧绷得能擦出火星。\n在战场上，谁开枪谁就是敌人，事情简单得很；可坐在这张破桌子前，两边却全是一起拼杀过来的同伴啊。再这么被夹在中间逼下去，我的脑袋迟早要炸掉。"

PAU.23.t: "印章该交给谁"
PAU.23.d: "我把手里的笔扔在桌上，看着它滚进了两叠文件堆中间。\n左边是雪伊递上来的公社请愿书，上面密密麻麻签满了工人的名字，要求立刻收缴军团的一切重武器，将市政防务全交给工厂自卫队管；右边则是跟着我从烂地里一路杀出来的老兵们的请愿书，这帮浑身刀疤的军官措辞强硬，坚决要求保留军团的独立薪饷与防务阵地，不接受任何公社干部的指手画脚。\n这两叠纸像两座大山一样压在桌子两头，一旁还摆着那枚刚刚刻好的临时执政印章。\n从当年在艾瑞波拉为了一口粮食替王室卖命，到在大海上逃命、带着队伍杀回莉兰迪亚，我已经记不清自己有多少个月没脱下靴子好好睡一觉了。工人们对我这个昔日的雇佣军头子始终充满戒心，我自己也清楚，我根本不是个懂得治理国家的材料。\n这种坐在高位上的无力感，比被机枪压在土坑里还要让人透不过气。\n“怎么，阿夏长官，这就打算撂挑子逃跑了？”\n小遥端着一杯刚泡好的咖啡从门外溜了进来，大大咧咧地靠在文件柜旁，怀里从不离身的白夜正嗅着桌子上的墨水。\n我按着额头说道：\n“公社那边有雪伊带着工人支持，又有晓枫在做全盘规划。工人们本来就只认她们两个，对我这个镇压过他们的军团头子肯定防得像防贼一样。我把这枚印章交出去，让公社名正言顺地接管政权，不是皆大欢喜吗？”\n“你真把印章交出去试试看啊。”小遥放下茶杯，直截了当地把话挑明了，“你信不信你今天上午交出权力，下午工人和你那些军人们就能在广场上拔枪对射？”\n我手上的动作停住了。\n“雪伊的脾气太冲了，她眼里容不得军队的一点沙子，要是让她掌权，第二天就会下令缴了老兵们的枪，你手底下的兵痞肯定立刻炸营；至于晓枫……虽然她懂大局，也懂怎么带兵，但在你那些老部下眼里，晓枫当年是抛弃军团退进山里的‘叛徒’。你把政权交给她，老兵们只会觉得是你这个老长官出卖了他们，把军队打包送给了公社。”\n小遥伸手敲着桌上那枚印章，眼神始终没有离开过我：\n“你一旦撒手，老兵们没了主心骨，立刻就会把公社当成要砸他们饭碗的仇敌，到时候谁也拦不住他们在大街上兵变。”\n我抓起桌子那枚印章，整个人疲惫地陷进了椅背。\n想放放不下，想退退不掉，我又该怎么办呢？"
PAU.23.a: "“去把雪伊和晓枫叫进来，我们继续开会。”"

PAU.24.t: "我不是什么神仙"
PAU.24.d: "“阿夏！你的兵今天上午又把我们工人的东西给扣了！”雪伊撑在桌沿上大声质问，“这是原则问题！工会不可能接受军队骑在工人头上，你今天必须下令让那几个带头扣车的营长公开向工会道歉，再把他们全都关起来！”\n坐在对面的晓枫把整份调度案推到了我面前：\n“雪伊，现在不是讲原则的时候。阿夏，看看这张排期表。如果不把港口的警备范围和工会的管辖边界切分清楚，明天上午电厂的储煤量就会见底。我拟了几套折中方案，每一套都需要你用大统领的名义强行签发。行政机构不能一直瘫着不动了，你必须现在挑一个盖章。”\n“晓枫！你这叫什么折中？！”雪伊扭头怒喝，“你这是在各打五十大板和稀泥！”\n“我不在乎谁吃亏谁占便宜，我只在乎这栋大楼下周还能不能点得起灯。”晓枫抬起那双锐利的眼睛看向了我，“阿夏大统领，拍板是你的职责。别拖延下去了，快把主意拿起来。”\n一边是雪伊带着满腔仇恨与原则的怒吼，另一边是晓枫算尽了每一吨煤和每一条法令的表格。\n两个人一左一右，像两台推土机一样，把堆积如山的难题全部往我脸上碾了过来。\n太阳穴里的青筋在疯了一样突突乱跳着。\n我抓起桌上那枚印章，用尽全身的力气砸在文件中央。\n咚的一声巨响，印章砸翻了水杯，咖啡瞬间把桌上的表格和公文全泡成了一团糟。身后的椅子随着我站起身的动作，向后翻砸在了地面上。\n“都给我闭嘴！！”"
PAU.24.a: "……"

PAU.244.t: "我不是什么神仙"
PAU.244.d: "“你们到底当我是个什么东西？！我是个会变戏法的神仙吗？！”\n雪伊和晓枫闻言都僵在了原地。\n“雪伊！老兵们扣车是因为后勤营连续好几天没领到配给煤，伤员在棚子里冻得要死！我知道，他们打了几十年仗，除了打枪修车什么都不会，但正是因为这样，他们就要被你们当垃圾扔掉吗？”\n我指着自己的鼻子说道：\n“晓枫！你拿着这些写满百分比的表格让我签，可我怎么知道，划给工会，军营的供暖怎么办？划给军队，全城喝西北风怎么办？”\n“现在仗打完了，你们要建新世界，要搞大同公社，结果呢？一遇到理不清的麻烦，都跑来塞到我脸上逼我负责吗！”\n“我懂什么税率？！我懂什么治安条例？！我就是个只懂带着手下保命的军人！我每天晚上闭上眼睛，耳朵里就全是在阵地上的肢体被炸飞炸烂的动静！”\n“在战场上，谁是敌人谁是自己人一眼就能看清；可坐在这个破位置上，你们两边全是他妈的自己人！你说我到底该怎么判？！”\n屋里依旧一片死寂，只有我粗重的喘息声在墙壁间回荡。\n原本坐在柜子旁的小遥悄悄抱紧了怀里的白夜，低着头一声不吭。\n我跌坐回椅子里，按住剧痛的额头闭上了眼睛。\n“印章就在这。”\n“你们谁有本事谁拿去管。”"
PAU.244.a: "“老娘不干了！”"

PAU.25.t: "这出大戏是你开的头"
PAU.25.d: "“阿夏不肯管，工会就绝对不会答应把东区让给军队，军队要是敢强占，今晚工人们就上街跟他们拼了。”\n“工人们一闹起来，全城的物资调配立刻就会瘫痪的，雪伊。”晓枫直视着雪伊，“另外，雪伊，你很清楚我为什么不能接手。在老兵眼里，我是当年带头脱离军团的闹事头子；而在工会眼里，我又总在为了大局物资逼你们向军队妥协。我们这些人身上的旧仇太多了，谁坐上去，底下都会有人觉得是在被仇敌统治。”\n晓枫转过脸，视线穿过满地的纸屑，径直投向了靠在文件柜旁边的那个角落。\n小遥蹲在椅子上，手里拿着一条烤干的咸鱼，正一点点撕成细条喂给膝盖上的白夜。察觉到屋里的死寂，她撕鱼肉的手动作一僵。\n“但要是让那个连自己老家都回不去的外乡丫头坐上去呢？”晓枫开口说道。\n雪伊愣了一下，随即像是听到了天大的笑话一样站起了身：\n“她？！晓枫你疯了吗？！当初就是她在山里满嘴鬼话，骗着阿夏把卡卡罗姆的防线轰开，又把我们所有人骗上那两艘破船到处逃命！她惹出来的祸还不够多吗？！”\n“正因为这祸是她惹出来的，所以必须由她来坐这个位置。”\n晓枫继续说道：\n“她骗了阿夏的军队替她开路，但也带来了撤走伤员的货船；她强行把我们从山里逼了出来，但也帮着工会在铁桥前打退了怪物。”\n“她欠了驻军的债，因为她把老兵当成了抢油的枪使；她同样欠了工会的债，因为她把大家逼进了大海上的绝路。她没有资格靠人情换取信任，真要坐稳这个位置，就只能靠公开的规矩让两边都受约束。”\n晓枫指向了窗外的海港方向：\n“更何况，港口里的两艘军舰，以及天天出海拉网带回鲜鱼的水手，都只听她一个人的。但这支海防力量也必须纳入我们的共同调度，不能变成她的私人家底。老兵和工会谁也没法一口吞下整支舰队。”\n雪伊盯着那个还捏着鱼干的少女，沉默了好一阵子，最后还是有些别扭地吐出气来：\n“……在广场上，她确实敢站出来跟老兵和工人们评理。。”\n三道目光齐刷刷盯住了刚悄悄逃到门口的小遥。她把白夜一把抱进怀里，整个人往门外缩去，急赤白脸地嚷嚷起来：\n“喂！你们三个疯了吗？！我当时撒谎是为了找饭吃！你们现在把这么大个烂摊子往我头上扣，是嫌我还不够惹人嫌吗？！”\n我伸出手把泡在咖啡里的印章捡了起来，随后一把推到了桌子中央。\n“当初是你把我们从烂坑里忽悠出来的。”我看着她那副慌张的模样，不禁扬起了嘴角，“既然这出大戏是你开的头，那就老老实实坐上台，把剩下的麻烦都给我们好好摆平了。”"
PAU.25.a: "“恭喜你，春日小遥大统领。”"

PAU_gydj: "各押一份定金"
PAU_gydj_desc: "小遥坐上大统领椅子的第一天，根本没去写什么冠冕堂皇的宪章。她把雪伊、阿夏和晓枫拽进后厨，指着冒着热气的灶台定下了规矩：军团老兵负责外围防线和重工业开采，但他们的口粮配额必须由公社工会每日签字；工会全面接管市政运作与工厂，但治安巡逻必须由一名老兵带着一名工人共同执勤；而水手们带回来的鲜鱼和煤炭，则由港务局按人头平价分发。\n小遥把这套把戏叫做“押定金”。大家用不着装出一副亲如一家的和气模样，但谁要是敢私下里动歪心思，另外两方会在一个小时内彻底掐断他的饭碗。"


PAU_msbf: "莉兰迪亚避风港"
PAU_msbf_desc: "因为先前亡灵的躁动，圣杯王国在海湾外面拉起了防疫警戒线，海对面的樱花军部通缉令也天天在电台里播报着小遥她们的罪行。既然正经的外交途径全被堵死了，小遥索性把大海对面那些对付黑市巡警的手段搬到了南大西洋。\n她让工人们修好了老码头的深水泊位，在灯塔上挂起大灯，公开向公海上所有来历不明的货船发出信号：莉兰迪亚提供全大海最便宜的修船船坞、不收重税的燃油补给，以及装满底舱的优质咸鱼。"

PAU_bzwtp: "那是什么怪物？"
PAU_bzwtp_desc: "在西边的山口处，传回来的报告一次比一次诡异。阿德莱希那边盘踞着的根本不是讲人话的军队，它们是一群长着多余肢体、披着烂皮在废墟里嚎叫的怪物。我们才刚刚从亡灵嘴里好不容易抢回一口气，绝对不能再让这种莫名其妙的脏东西漫过我们的边境线了。"

PAU_mfsn: "她们就是魔法少女吗？"
PAU_mfsn_desc: "东北边那片被称作魔法少女联盟的领地里，据守阵地的竟然是一群穿着花里胡哨的裙子、手里拿着发光的……呃…某种高科技机械还是什么东西，和一些老式长枪的小姑娘。老兵们一开始全都把这件事当成了笑话，直到侦察队亲眼看见那些女孩用古怪的光芒把袭扰的怪物轰成了渣渣。虽然搞不清她们那套力量是从哪儿来的，但至少对方还能讲人话，也没表现出吃人的恶习。先派人接通她们的电台试着打探下虚实，但在彻底摸清这帮神秘邻居的脾气之前，门口的机枪保险谁也不准擅自关上。"

PAU_sbtxd: "听说圣杯来了个探险队？"
PAU_sbtxd_desc: "根据小遥截获的电台消息，进驻在亚马逊河口的远征军，正是当初在海岛上逼我们交出大量物资的那帮圣杯人。这群老爷在大海上颠簸了几个月，对外宣称是要开进原始雨林寻找沼泽里盘踞的那些人形蜥蜴。小遥在看完一张缴获的探险路线图后，笑得差点从椅子上掉下去：“谁会大老远跨过大海专门跑来抓蜥蜴啊？这帮老爷八成是盯上了林子里的矿产和木材。”\n不过玩笑归玩笑，对方那些满载火炮的护航舰确实停在下游水道上。按照小遥的盘算，既然当年我们在海岛上挨了他们的盘剥，现在正好倒过来向他们高价推销丛林探险的物资，顺带看看能不能让他们在丛林前线充当阻挡阿德莱希那群怪物的好帮手；但要是这群探险家敢借着势头让炮口对准我们的工区，我们也随时准备教教他们，到底谁才是这片雨林真正的主人。"

PAU.26.t: "如果我们都在的话"
PAU.26.d: "通讯里跳出了一个此前从未监听过的固定频段，几声清脆的按键声过后，里面传出了一个带着关西口音的年轻女声：\n“我是莉兰迪亚的临时大统领春日小遥。各位魔法少女指挥官们，占用几分钟频率。”\n对方那里还隐约能听见机床冲压铁皮的哐当声：\n“我们的前沿哨兵前几天发回了你们跟那些……是魔女还是什么来着……交火的战况。总之在如今这个秩序碎成渣的大陆上，看到年纪比我们工厂里的小学徒还小的女孩端起武器顶在前线，没人会觉得这是什么光鲜亮丽的故事。大家心里都清楚，你们身后肯定也有哪怕失去性命也想保护的人。”\n通讯那里传来了翻动纸张的声响：\n“我们手里有刚出炉的优质钢轨、成箱的口粮，以及能连夜抢修火炮的技工；你们在前线有压制怪物的强悍火力。如果大家都是为了让身后的平民能吃上一顿饱饭而搏命的话，就用不着互相拿枪口瞄着对方了。只要你们愿意把边境的通道打开，我们可以在莉兰迪亚筑起掩体替你们分担阿德莱希那群怪物的压力，甚至我们可以直接合伙，组一个一辈子都不会解散的阵营，一起把生活过下去，你们看怎么样？”"
PAU.26.a: "我们需要能并肩作战的伙伴"
PAU.26.b: "我们各自安好就行了"

PAU.27.t: "找蜥蜴总得先吃饱饭"
PAU.27.d: "一艘悬挂着双色信号旗的小型汽艇在警戒水域外停下了，艇上的扬声器直接向远征军的旗舰播放了一段清晰的明码录音：\n“圣杯王国的远征军指挥官阁下，日安。”\n“我是接管莉兰迪亚港口的春日小遥。我们对贵国的行事章程并不陌生，毕竟不久前你们海岛上的驻军同行才刚按照战时条例，收了我们好大一笔靠港物资，所以贵方的价目表我们心里有数。”\n录音那边传来一声笑声，接着是茶杯磕在桌面上的轻响：\n“听说诸位贵族军官千里迢迢开进亚马逊，为了扫荡沼泽里的蜥蜴人？总之，我们对你们抓爬行动物的兴趣不作评价，但雨林里的恶性疟疾和无底泥潭，可不会因为各位穿着精良的装备就手下留情。”\n“我们手里有足量的药品、行军用具和食物。只要你们承认莉兰迪亚的管辖权，大家完全可以搭伙签个互助协议，由我们替你们守住下游的退路；当然，如果诸位的枪口打算往我们这边挪……那这片复杂的烂地可比大海上的孤岛难走得多。"
PAU.27.a: "我们没必要在雨林里多树立一个敌人"
PAU.27.b: "远征军从不向流民低头"

PAU_zxd: "我们不会再逃跑下去了"
PAU_zxd_desc: "我以前总觉得，只要脚底抹油跑得够快，厄运就追不上我。\n可直到今天我才明白，人越是一味逃跑，身边能站立的地方就越小。\n看看阿德莱希里的那些怪物吧，它们可听不懂什么叫公约，更不会给我们留第二次逃命的港口。如果你们这帮人非要将性命押在我这个满嘴谎话的家伙身上，如果我已经彻底坐上了这个大统领的位置——\n那就谁也别想再后退一步了。\n传令兵，去拉响战斗警报。\n我以莉兰迪亚大统领的名义下令：\n各部队全线出击，\n碾碎阿德莱希！"

PAU_sztytz: "身在南美，不许置身事外！"
PAU_sztytz_desc: "这片大陆刚被我们从死人堆里抢救起来，谁也不知道地底下哪天会再冒出亡灵、魔女、五神六神，更不知道海对面的战火什么时候会烧到我们家门口。单打独斗只有死路一条，我们必须把各自的家底全凑到一起。远征军出军舰与航海技术，我们出钢铁、机床和口粮，魔法少女退下前线轮休、去学校念书，大家全都联合起来，这样才能保住每个人吃饭睡觉的安稳日子。\n至于那些到现在还躲在角落里紧闭大门、打着小算盘企图看戏的势力，要是哪天外面的黑手真伸过来了，你们自家的破木头栅栏能顶得住什么啊？我可不打算给大家留几个随时会漏水的窟窿。要么带着你们的物资名册坐下来签字，要么，莉兰迪亚的装甲连队今天就开进你们的政府大楼，替你们把字签了。"

PAU.28.t: "要么入伙，要么让开"
PAU.28.d: "通告里的内容简单到了近乎粗暴的地步：莉兰迪亚要求沿途所有独立国家和武装据点在当天日落前作出抉择，要么交出图纸与物资名册，推选代表加入统一的联合议会，共同统合军事与工业；要么就作为南美大陆统一的顽固阻碍，等待后续部队直接开火扫平阵地。\n驻守阵地的军官与镇上的代表们正争论得不可开交。强硬派认为这是赤裸裸的武力兼并，主张依托工事顽抗到底；但更多看着库房见底的后勤官与伤员却很清楚，对面的政权确实拿出了实打实的工业品与口粮。与此同时，也有人指出：缺粮时接受保护，与在炮口下交出自治权，并不是同一回事。春日小遥给出的期限没有留下太多协商空间；选择加入的代表们知道自己争取到了生存机会，却也清楚对方似乎根本没有打算给任何人留下观望拖延的余地。"
PAU.28.a: "加入莉兰迪亚的联合政权。"
PAU.28.b: "谁也别想强占我们的地盘！"

PAU_xkst: "夏日祭典"
PAU_xkst_desc: "刚将南美的地图拼凑整齐，底下的麻烦就一窝蜂涌了上来。圣杯的移民嫌工厂的工人粗鲁，老兵们看着魔法少女发怵，而那些十几岁的魔法少女则习惯了在角落里戒备所有人。\n在樱花老家的时候，每次工人闹罢工或者街道邻里吵架，那些精明的町内会长总喜欢拉着两边去路边摊一边嗦面一边谈话。于是我就照葫芦画瓢，在每个农村和城镇划分了各种能够摆摊的摊位。\n要是让老家的同伴看到我居然用搞夏日祭典的套路来治理大陆，估计眼珠子都要瞪出来了。不过管他呢，只要大家能安稳坐下来一起开开心心吃顿饱饭，手段土气一点又有什么关系。"

PAU_zjpb: "直接拍板！"
PAU_zjpb_desc: "圣杯那帮习惯了议会程序的官僚刚搬进市政大楼，就试着用几十页的申报条例塞满我的桌面；公社的代表们又非要为了一个零件的价格开上整整一天的辩论会。\n当年在樱花的造船厂，资方就是用这种繁琐手续将工人的诉求拖成废纸。我现在既然坐在这个位置上，可容不下这种故意磨洋工的恶习。\n我设立了现场调解队，由工会、老兵和水手各派一人直奔现场。铁轨断了就立刻去现场调拨钢材，厂里资源分配不均就当场按各自的产出分摊，谁要是敢拿出厚得要死一叠废话公函来推诿扯皮，就给我去后厨削土豆去。\n晓枫经常叹着气说我做事太像个雷厉风行的当铺掌柜，随身揣着印泥和印章到处跑的样子更是不像个正经大统领。但我可没闲工夫去学那些慢吞吞的官僚腔调，早点平息纷争，我还能多抽点时间给白夜梳梳毛呢。"

PAU_bndlsg: "总不能一直当临时工吧"
PAU_bndlsg_desc: "靠着大锅煮汤、胡乱盖章和到处两头劝架，我确实拽着大家在大厅里坐了好几个月。\n这种街头救急的土把戏，它虽然救得了一时，可它救得了一世嘛？食堂里依然有人因为口音和出身掀翻桌子，现场调解队也解决不了错综复杂的土地产权与矿山归属问题。各地的公社想要明确自治权利，圣杯的移民想要成文法典，军队则需要正式的建制预算。我们不能继续像打游击一样靠着临时拍板过日子了，哪怕过程再繁琐、争吵再激烈，我们也必须坐下来，将这片土地长久运转所需的公道与规矩全都给敲定下来。"

PAU.281.t: "印章也有盖不平的事"
PAU.281.d: "小遥整个人把下巴垫在白夜背上，然后趴在了桌子上，将一张皱巴巴的报告纸推到我的面前。\n“食堂昨天又有人打架了。圣杯来的水手嫌工人们吃饭声音大，工人们骂水手是外来殖民者，两边抄起椅子砸翻了好几锅汤……还有那个调解员，林场和煤矿为了同一片林子争管辖权，调解员去现场直接拍板把林子分了，结果两边今天同时递了抗议信，说调解员连哪棵树归谁砍都没分明白就搁那瞎胡闹。”\n她又从报告下面抽出几张折得特别整齐的请愿书：\n“那几个最后加入的镇子也来信了。他们要求撤回由同盟直接派去的临时防务官，重新协商驻军、征税和地方议事会的权力。信里有句话写了好几遍呢：‘我们是需要粮食，但不等于我们需要你们来管。’”\n小遥把脸彻底埋进白夜的绒毛里，闷声闷气地埋怨道：\n“我之前总觉得只要把大家拉到路边摊吃顿饭、随手盖个章，什么事都能大事化小。原来治国根本不是搞祭典啊……汤面只能填饱大家的肚子，大家心里的怨气一点都没少呢。更麻烦的是，有些怨气还是我自己留下的。当初我嫌他们犹豫，觉得先把人拉拢到一起、先撑过眼前的危机再说嘛，之后总有时间谈自治的。现在人家只是来问我：那个‘之后’，到底什么时候才轮到他们说话啊？”\n\n“知足吧。要不是你那几家摊位和到处乱跑的调解队，这帮人几个月前就该在街上重新拔枪对射了。你替大家争出了喘口气的时间，现在不过是到了该交真正答卷的时候了。至于你当初逼他们签下的那几张纸，也不能因为送过粮食就当它们从没发生过，没错吧？”\n小遥听后，沉默了一会儿，才坐直身子，两只手在脸颊上用力揉了一把，随后抓起桌上的笔说道：\n“去把晓枫和雪伊叫来。先把那些请愿一件件登记清楚，再把驻军和地方权利写进宪章草案里。\n今晚！我们谁也别想早睡了！”"
PAU.281.a: "“我们到底是一个什么样的国家……”"


PAU.29.t: "别把毛团拉进来"
PAU.29.d: "雪伊一巴掌拍在摊开的报纸上，指着上面写得密密麻麻的候选名单：\n“南美工农武装公社！这名字哪里不响亮了？！一听就知道工厂和枪杆子归谁管！”\n坐在对面的晓枫闻言，立马打断了她：\n“老兵们看见武装公社四个字就会联想到清算，圣杯的移民更是会连夜把船开走。我提议的亚马逊联合工务处在法理上更中立，也更方便跟海外谈生意。”\n“得了吧，晓枫。”我咬断嘴里的草茎，接话道，“你那个名字听起来像是一家濒临破产的仓储转运公司。”\n“那也比阿夏你写的自由卫队联合管区强。”雪伊翻了个白眼，“不知道的还以为军阀又在大楼里复辟了。”\n几个人从中午争到日头偏西，桌上的废纸堆成小山，谁也不肯让出一步。\n雪伊转头看向坐在桌子末尾的小遥：\n“喂！我说春日小遥大统领大人！你天天在公函上盖大印，轮到定国名了，你从刚才开始就一声不吭，该不会连个像样的名字都憋不出来吧？！”\n我和晓枫也跟着转过了视线。\n小遥正把下巴放在桌沿上，拿着一根吃剩下的饼干棒专心致志地试图将印泥盒子顶在白夜的鼻尖上。被雪伊这么一嚷，印泥盒啪的一声掉在桌上，把白夜吓得一头钻进了她的袖子。"
PAU.29.a: "……"

PAU.299.t: "别把毛团拉进来"
PAU.299.d: "小遥坐起身子冲着雪伊嚷嚷起来：\n“哈？！干嘛突然冲着我发火啊！还有，‘大统领’这破称呼到底是谁硬塞给我的？！听起来像个长着大胡子的独裁老头，我明明才十九岁，天天被你们叫大统领，感觉头发都要早早掉光了！”\n雪伊被她噎了一下，然后抱胸冷笑道：\n“嫌称呼难听，那你倒是给我们这片地方起个好听的名字啊！”\n小遥气鼓鼓地抓过那张报纸，拿起笔唰唰几下划掉了我们之前写下的所有提案。\n她在纸面上写下几个字，随后自信地拍在桌子中央。\n我和雪伊凑上去看，上面写着——\n“白夜同盟”\n雪伊瞪大了眼睛，指着那张纸喊道：\n“你疯了吧？！你打算拿这只昨天刚咬断我电话线的毛团来当国名？！”\n“这怎么啦？！”小遥理直气壮地叉着腰，“在我们樱花老家，神社还把狐狸和猫供在牌位上呢！白夜在大海深处护住了货船的龙骨，大家才没沉进海沟里，它立的功劳比你们那些死掉的国王大多了！”\n“而且你们那些名字，什么公社、什么工务处、什么管区，每个字都带着一股想压别人一头的火药味。”\n雪伊原本想要反驳的话卡在了嗓子眼里。\n晓枫盯着那张草稿纸看了好一会儿才开口：\n“老兵不会觉得被公社吞并，工会不用向军队低头，圣杯的移民也挑不出宗派毛病。对外，没有任何一个海外帝国能从这个名字里找出旧政权的影子。”\n晓枫放下笔，抬头看着小遥：\n“在政治法理上……确实…没问题？”\n雪伊张大了嘴，有些别扭地看向从小遥袖子探出小脑袋的白色小动物，最后哼了一声把头扭向一边：\n“……便宜这只偷吃我香肠的毛团了。”\n我看着那个得意洋洋把白夜举在头顶的白发少女，忍不住笑了起来。\n拿一只贪吃的小动物来命名一整片大陆的国家，这大概是全天下最荒唐的决议了。\n但在这间挤满了逃亡者的大楼里，这确实是唯一一个谁也挑不出刺的荒唐了。"
PAU.299.a: "“那就这么定了，白夜同盟。”"

PAU_sbzq: "书包是比枪托要轻的"
PAU_sbzq_desc: "巡视了一圈阵地和工厂，我发现那些十几岁的小孩个个都能熟练地拆装步枪，可递过去一张食堂的菜单，居然连上面的白菜和土豆都不认识。\n仗打完了，总不能让下一代人继续当只会扣扳机的文盲。几栋空置的营房被收拾了出来，工人们从造船厂拉来涂了黑漆的木板充当黑板。教员队伍更是凑得五花八门：水手负责教四则运算和看海图，退役老兵教识字，连圣杯留下的办事员也被拽来教地理与历史。\n至于那些习惯了战斗的魔法少女，我也硬给她们在第一排占了课桌的位置。双手既然能用来施展奇迹，就没理由握不住小小的粉笔。哪怕最初只能照着说明书磕磕绊绊地拼读，但这群在硝烟里长大的孩子，终于不用每天夜里抱着枪管入睡了。"

PAU_byq: "印上爪印就能当钱花？"
PAU_byq_desc: "用几箱燃油换几袋土豆的以物易物，应付战时避难还行，要在整个大陆恢复贸易根本就是场灾难。工人们不想靠天天领粮食充当工钱，圣杯的商人也不肯收公社的工时票据，老兵们更是拿着作废的王室旧币四处叫骂。\n于是小遥干脆让人腾出了报社的印刷机，用剩下的纸印出了第一批继王室覆灭后的莉兰迪亚统一货币。先清点粮食、燃油、公共食堂产能和工厂工资总额，再确定发行数量；每一批新券都要登记入账，储备与发行记录张榜公示。至少得让每张纸后面都有能够查清的粮食、物资或劳动成果，不能再靠一枚印章就叫百姓相信承诺。"

PAU.30.t: "白夜券进入集市的第一天"
PAU.30.d: "“阿夏！看这边！今天本小姐请客，想吃什么尽管点！”\n港口集市的面包摊前，小遥手里拿着几张刚印出来的白夜券甩得沙沙作响。\n我跟在她身旁，看着她挤到摊位前冲着系着围裙的摊主开口：\n“大叔！来两条刚烤好的黑麦面包！”\n小遥将两张白夜券放在摊位上，得意地扬起下巴：“不用找了，剩下的算小费！”\n摊主是个五十来岁的干干瘦瘦的男人。他拿起那两张印着爪印的纸钞，迟迟不敢将它们收进柜台里，反而从摊位底下端出一个装满废纸的铁盒，放在了小遥的面前，用近乎哀求的声音说道：\n“大统领大人……这是新的军用借据？我们这条街必须强制收下这个，对吗？”\n小遥被他这一声称呼问得愣在了原地：\n“……这怎么会是借据呢？这是白夜券呀，能买东西的。”\n摊主指着盒子里那一叠叠盖着金印与官印的纸条，眼圈红透了：\n“以前那些老爷也是这么说的。印了一叠又一叠好看的花纸，搬空了面粉，拿走了煤油。等大家饿得不行拿着纸片去换粮，换来的只有枪托和皮鞭……我们真的经不起再被骗一回了，大统领，行行好，把面包直接拿走吧，别再拿纸片糊弄我们了……”\n周围买东西的码头工人与市民见到此景都围拢了过来，一道道满含戒备与绝望的目光投向了摊位前站着的大统领。\n小遥脸上的得意瞬间凝固了。"
PAU.30.a: "……"

PAU.300.t: "白夜券进入集市的第一天"
PAU.300.d: "“王室当年用欠条骗了大家多少年了？在他们眼里，我们这些印钞的人，和当年拿枪抢粮的强盗是没有任何区别的。”我低声提醒到。\n小遥脸上的任性与轻浮散得干干净净，伸手抓住了摊主的围裙：\n“大叔，带上你的面袋，现在跟我去码头后厨。”\n摊主有些不知所措：“去……去后厨干什么？”\n“去看我们怎么定规矩。”\n她转身看向围拢过来的市民，把白夜券拍在显眼的柱子上：“大家都听清楚了！我们不搞王室那种瞎吹牛的兑换把戏！”\n人群里顿时起了一阵骚动。\n“但是！”小遥抬高声音打断了窃窃私语，“从今天中午开始，全港所有的公共食堂、码头每天拖网打上来的鲜鱼集市、还有工厂后面的供暖浴室，全部只认白夜券！私人摊贩愿不愿意收，由他们自己决定；公营窗口的价目表、库存和每日发行量都要贴出来，由工会和民政代表共同签字。谁也不准强迫百姓把旧钱换成新券。”她把两张白夜券收回钱袋:\n“大叔，这两条面包的价钱先从我的个人配给里折算给你，我想了一下，不能让你先替我们承担信用的风险。你愿意的话，可以来库房看看库存和补货记录；等你觉得这张券真的能换到东西，再决定要不要收也行的。”\n她扭头看向我：“阿夏！通知后勤处，把今天捕上来的海鱼全拉到集市这里，按公示的份量分发。我看谁敢在窗口少给百姓一两鱼肉！”"
PAU.300.a: "“我们必须以身作则才行啊。”"

PAU_yjl: "总要有个讲理的地方"
PAU_yjl_desc: "回忆当年，军团的坦克曾经无情地碾碎过工人们的罢工队伍，那些留在工厂外墙上的弹孔到现在都没能填平。如今战争结束了，死难工人的家属在领口粮的队伍里总能撞见当年扣动扳机的老兵。私底下的寻仇与斗殴几乎每天夜里都在巷子里上演。\n光靠几句虚无缥缈的客套话，抹不平当年的血债；可要是放任私刑，整座城市立刻就会被复仇的火苗重新点燃。我们必须设立真正的法庭，颁布公开透明的法律。当年的暴行必须由审理官在日光下核实并给予补偿，无休止的私下报复也必须明令禁止。从今天起，不管是扛枪的老兵还是握扳手的工人，解决旧怨的唯一途径只能是法庭的判决，而不是，手里的枪。"

PAU.31.t: "当年是谁签的字"
PAU.31.d: "我推开侧厅的门，晓枫坐在那张堆满文件袋的桌子后面，正把钢笔按在墨水瓶里吸着墨。\n桌子当中摆着明天第一场公开听证会的卷宗，封皮上写着“莉兰迪亚工人起义”。\n我拉开椅子坐下，伸手翻开那份卷宗的第一页。上面赫然夹着当年军团的调令，最底下的指挥官签名处签着我的名字，而在行动路线的测绘图角落里，还留着晓枫当年作为参谋长画下的工整图例。\n“你真打算明天把这份卷宗原封不动地公开？”我抬起头问她。\n晓枫放下墨水瓶，拿起吸墨纸吸干了纸面上的残墨：\n“受害工人家属的诉状已经递上来了。当年死在工厂门口的十几名工会干事，家属要求确认开枪军官的责任。既然要设立真正的法庭，第一桩案子就不能搞任何幕后调解。”\n“我的名字在调令最底下。”我瘫在了椅背上，“工人们恨透了当年的军团，他们明天会骂死我的。”\n“测绘封锁网的人是我，图例底下也有我盖的章。”\n“后来我虽然脱离军团退进了山里，但这不代表我在工区画下的封锁线没有困死过人。”\n她将一份正式的传唤应诉书推到了我面前，上面已经很工整得签好了她自己的名字：\n“阿夏，底下的老兵和公社之所以天天在街上打架，就是因为大家都在怀疑新政权会包庇自己人。如果我们这两个当年的军团主官不敢站在法庭上接受质询，这间屋子里立起来的法律就跟王室的欠条一样，全变成废纸了。”\n听完了晓枫的话，我拿起了桌上的笔。那场在暴雨里碾碎工人们的一切的罪恶，在我脑海里不断重演着。\n逃避了这么多年，这笔债务终于还是追到了我的眼前。\n“赔偿金从我们两个每个月的津贴里扣。”我在应诉人一栏干脆利落地签下了自己的名字，将笔啪的一声拍在了桌上，“明天上午，我们一起去听受害家属当面骂娘。”\n晓枫收起那份签好字的卷宗，一直紧绷的眉头终于舒展了一些，轻轻推过来一杯还热着的咖啡：\n“放心，法庭门口不会安排任何卫队的。要挨臭鸡蛋，也是我们两个一起挨。”"
PAU.31.a: "去准备明天的庭审发言吧。"

PAU.32.t: "军礼"
PAU.32.d: "我刚走到法庭大厅的台阶下，就被迎面冲过来的两个老营长堵在了廊柱旁边。\n带头的是当年在工区带队开车的巴罗，他扯下胸前那枚军团的勋章砸在了柱子上：\n“阿夏长官！你真打算走进去向那帮工会的人低头认罪？”\n几个换岗的卫队老兵停下了脚步，目光同时压了过来。\n“当年在工区开火是王室下的死命令！军令如山，不上前线就是军法处决啊！”\n“我们在战壕里打滚，被弹片削掉了皮肉，后来又跟着你跨过大海四处挨饿！我们帮着抢回了港口，打烂了亡灵，现在仗打赢了，你却告诉我们，我们全被打成了该被审判的凶手么……”\n他一把抓住了自己的枪带：\n“不行！我们绝对咽不下这口气的，阿夏长官！你别害怕！大不了我们回营地把那些坦克都拉出来，跟他们拼个鱼死网破！”\n我停下脚步，伸手揪住了巴罗的衣领，将他整个人拽到了眼前：\n“拼个鱼死网破？然后再将这片好不容易建起来的家园再轰碎一次？！”\n巴罗眼睛瞪大了。\n“听清楚了，巴罗。”我盯着他的眼睛，压低了声音，“今天站在审理台上挨骂的是我，名字写在应诉书上的是我和晓枫。当年在工区下达突击命令的人是我，如果有人该为当年的血债负责，那个人只能是如今我这个带队的最高长官！”\n我松开手，替他拍平了被扯歪的肩章：\n“你们以为我愿意去受审？但如果不把当年的罪责清清楚楚查明白、将王室的烂摊子挑到日光底下，你们脱下这身军装走到街上，工人们就会在黑巷子里用铁棍砸烂你们的脑袋！”\n“我今天走进去，只要法官敲下锤子，过去的旧怨就到此为止。从明天起，谁要是敢越过法律去动底下一个听令开火的士兵，我第一个带枪毙了他！”\n巴罗原本紧握着枪带的手慢慢松开了。随后，他捡起掉在台阶上的勋章塞进了军服口袋里，再挺直身板，向我敬了一个无比沉重的军礼。\n我做了个深呼吸，重新上下打量了巴罗一眼，便朝着法庭那压得让人无法呼吸的大门走去了。"
PAU.32.a: "“我们开庭吧。”"

PAU.33.t: "我们站在审理台前"
PAU.33.d: "旁听席左侧坐着佩戴黑纱的工人家属，右侧则是军容整齐的老兵。\n法官敲响法槌，当众宣读针对当年莉兰迪亚工人起义惨案的起诉书：\n“鉴于基层士兵长期受王室严酷的战时连坐法令胁迫，法庭将逐案调查其命令来源、实际行为与拒令风险，不以军籍自动定罪；但签署突击命令的阿夏、测绘封锁路线的晓枫，必须直面死难者的诉求。”\n起诉书念到晓枫的名字时，工会席位上突然站起一位满头白发的老车工：\n“法官阁下！晓枫同志后来退进深山带我们打了数年游击，港口保卫战也是她带着大家守住了工厂！当年她在图纸上签字必定受了蒙蔽，工会愿意为她担保！”\n工人们低声议论起来，目光在图纸和晓枫身上来回摇摆，神情满是纠结。\n紧接着，念到我的名字时，后排的老兵霍然起身来：\n“要判长官有罪，我们这些老兵全部同罪受罚！”\n几名士兵甚至试图翻过栏杆。\n“都给我把手放下！坐回去！！”\n一声怒吼切断了喧闹。一直沉默站在第一排的巴罗转过身，用宽阔的胸膛挡在了骚动的部下面前：\n“谁让你们在这儿喧哗的？！你们也想学当年的王室，在老百姓的头上耍横吗？！全给老子坐下！听长官领判！”\n晓枫转过脸面向工会席位：\n“工会的各位同志，肃静！”\n“当年在指挥部画下封锁线的人是我。我很清楚那张图纸会封死工厂的退路！如果因为我后来替大家打过胜仗便抹去过去的血迹，那今天这座法庭和王室随心所欲的赏罚有何区别？！我站在这里，求的是公正的裁决，概不接受任何功过相抵的情分！”\n法官再次敲响法槌，面容肃穆地看向法庭两侧：\n“法庭充分知悉二位被告在抗击亡灵与建立同盟中的历史功绩，也清楚工会与军队各自的陈情。然而，在法理层面，功勋与罪责从来都不可混为一谈。”"
PAU.33.a: "……"

PAU.333.t: "我们站在审理台前"
PAU.333.d: "法官展开了判决书：\n“下达屠杀指令的王室已被依法定性为非法暴力政权。二位被告作为执行防务的主官，罪责确凿，无可推卸。依据同盟过渡期法权条例，本庭判决如下：”\n\n“一、阿夏、晓枫战争罪名成立，载入同盟永久司法档案，剥夺二人过往军职附带的一切特权与赦免权；”\n\n“二、查封原军团留存特别账户，全数并入抚恤金；二人名下薪饷按月强制扣划，用于抚恤工区死难者遗孤直至成年；”\n\n“三、鉴于二人具备同盟防务与工业建设不可替代的统筹能力，判处二人终身保留戴罪服役身份，接受工会与民政委员会监督，为全同盟的重建承担无偿调度之责。”\n\n“退庭！”\n\n法槌落下，发出了庄重的回响。\n\n席位上鸦雀无声，无人欢呼，亦无人再出言抗议。\n\n直到我将那顶戴了十几年的军帽放在了受审席之上，\n人们才开始纷纷离去。"
PAU.333.a: "走吧，该去干活了"

PAU_bycx: "别对着白夜乱拜了啊"
PAU_bycx_desc: "去街上散步的时候，我发现好几个拐角都立起了小神龛，里面供着白夜的木雕，底下堆着烤鱼干、白米饭和点着的蜡烛。经历过亡灵浩劫的人们太渴望抓住一点寄托了，大家不仅坚信白夜的绒毛能驱散疾病，甚至把我也传成了从大海对面渡海而来的神使。\n这都算哪门子的怪事啊！当初定下这个名字是为了让军队和工会别再继续争吵，可不是为了给自己立牌位的！更要命的是，白夜那只贪吃兽每天夜里偷偷溜出窗户，把全城神龛里的炸鱼和香肠都吃得干干净净，现在胖得连窗台都快跳不上去了。\n强行下令拆除神龛只会让担惊受怕的平民更加惶恐。我和晓枫商量后，索性将这种盲目的狂热引导为同盟的民俗集市，将供奉神仙的习惯改造成了社区互助活动。谁要是敢借着白夜的名头私设教派敛财，我一定不会放过他。至于那只日渐发福的白夜……"

PAU.34.t: "它真的吃不下了"
PAU.34.d: "我和小遥顺着后巷找过去的时候，拐角那处堆着木箱子的空地前正围着好几个人。\n一个擦得干干净净的木箱子上铺着红布，上面点着两支蜡烛。白夜正四脚朝天瘫在供盘里，圆滚滚的肚子鼓得像个小瓜，嘴里还咬着一根炸得金黄的小鱼干。\n旁边跪坐着一个包扎着臂膀的退役炮手，还有两个提着菜篮的妇女，嘴里正念念有词地念叨着家人的名字。\n“喂！白夜！你今天到底在外面蹭了多少顿饭？！”\n小遥一步迈上前，提着白夜后颈的皮毛将它拎了起来。那团白毛嘴里还叼着小鱼干，四条短腿在空中无辜地扑腾着。\n跪在地上的老兵吓了一跳，连忙摆手阻拦：\n“春日大人！使不得啊！那是送给护国白兽的供奉，乱动会招来厄运的……”\n“招什么厄运啊！”小遥气得直跺脚，将白夜塞进了我怀里，“你们再这么毫无节制地喂下去，它明天就要患上急性肠胃炎！哪家神仙会长一身肥膘连老鼠都追不上啊！”\n身旁那位提着菜篮的妇女低头小声解释着：\n“当初亡灵围城的时候，家里的小孙子吓得天天夜里发高烧……周边邻居们都传白夜身上的白毛能驱散亡灵那些不干净的邪气，我们这才……”\n小遥嘴边的数落声停住了。\n她瞥见妇女篮子里那顶小毛线帽，伸手从供盘里拿了一块玉米饼掰成两截递了回去：\n“小孩子夜里发烧，明天早上去公立诊所找大夫领退烧药不就行了，求这个吃了睡睡了吃的懒蛋可不管用。”\n小遥自己咬了一口剩下的玉米饼，嚼得两腮鼓鼓的：\n“不过这饼烙得倒是挺香的。神龛以后我允许你们摆，但里面不准再放荤腥，剩下的供品也得由你们自己分着吃了，就当成大家聚在一起聊天的理由，听到了吗？至于白夜——”\n小遥指着在我怀里打着饱嗝的小动物大声宣布：\n“从明天开始，谁要是再敢偷偷塞给它炸鱼，我就罚那个人去大楼给全同盟的办公椅子底下全扫一遍！”\n听完小遥的一番话，巷子里原本神色紧绷的众人被逗得笑出了声。"
PAU.34.a: "别忘了明天给诊所多送几箱药"

PAU_mgsh: "别忘了我们的老朋友"
PAU_mgsh_desc: "圣杯本土的议会发来了一封满是质问的越洋电报。那帮老爷完全搞不明白，为什么自家的远征军会跟造船厂工人坐在一张桌子前面，更让他们无法理解的，是同盟居然给这群身负神秘法术的魔法少女发了书包和饭卡。\n在殖民老爷的眼里，掌握神秘力量的姑娘不过是好用的武器。既然他们想要个说法，小遥便给他们个痛快话：\n“同盟立下死规矩：谁也不准逼这帮十几岁的小丫头扛枪打仗，全都得给我老老实实背着书包进学校念书！她们现在是造船厂的学徒和正经学生，身上的怪毛病全由公立诊所接管治伤。谁要是敢把主意打到这些小姑娘头上、想把她们当武器使，莉兰迪亚的大炮第一个轰烂他的大门。”\n\n“战舰开过来，大炮等着你们；商船开过来，咖啡咸鱼管够。选哪个，各位议员老爷自己看着办。”"

PAU.35.t: "皇家海军的耻辱"
PAU.35.d: "海军部作战室里的煤炉烧得很旺，但桌子两旁的军官们脸色却难看得不行。\n海外舰队司令官将一份损管日志放在了海图中央：\n“派去亚马逊河口的通报艇核实了。远征军并没有全军覆没，他们把皇家护航舰开进了当地工团的水港，甚至联合当地武装接管了我们的港口。”\n听到此番话语的保守派议员立马就坐不住了：\n“这是叛国！皇家海军几百年来从未蒙受过这种耻辱！一群领着王国津贴的职业军人，居然向海外流民低头称臣！”\n“他们不仅低头了，议员阁下。”司令官划过海图上的南大西洋航道，“他们依托修造厂修复了巡逻舰，并且控制了河口全部重油储罐。如果圣杯派出惩戒编队，他们随时可以切断我们绕行好望角南段的货运路线。”\n作战室陷入了一片死寂。\n一位年长的海军元帅打破了沉默：\n“欧陆局势吃紧，我们根本不值得抽调出成建制的远洋舰队去打一场跨洋远征。就算把他们全部宣布为叛徒，我们也夺不回那些舰船的。”\n议员咬着牙反问：\n“难道我们就任由这群叛徒在海外割据吗？！”\n在桌子尽头的内阁代表翻开一页文件，面无表情地提醒道：\n“最新报告，南美没有悬挂任何激进政权的旗帜，甚至主动提出了港口通航草案。他们愿意对王国的商船开放泊位，并且优先供应他们的铜矿与原木。既然军力顾不过来，与其耗费巨资去打一场注定亏本的跨洋作战，不如先在纸面上把冲突冻结起来。”"
PAU.35.a: "这是明智的选择"
PAU.35.b: "立刻封锁他们的航道！"

PAU.36.t: "请松绑吧"
PAU.36.d: "临时关押点的门被推开时，晓枫正低头活动着被麻绳勒红的手腕。\n“审完了？”她抬起眼，语气里没有半点阶下囚该有的客气，“要是还想从我这里问出卡卡罗姆矿道的地图，就别拿这种绳子来绑人。你们营地缺粮，我的人缺药，再耗下去，便宜的是那些正往南边压过来的东西。”\n我把钥匙放在桌上，没有立刻接话。外面的岗哨正来回换班，谁都清楚，亡灵的压力并不会因为抓到一个人就减轻多少。\n“绳子可以解开。”我说，“但你要和我一起走。港口那边的仓库还够我们撑一阵子，矿道里的人也不能丢下。”\n晓枫沉默了一会儿，伸手拿起了钥匙。\n“早该这样。”"
PAU.36.a: "把绳子解开，该出发了。"

PAU.37.t: "梦"
PAU.37.d: "梦里总能听见电车驶过路口时的叮当声，伴随着细密的雨水敲在了教室的玻璃上。\n老家海港小镇的空气里常常混着煤烟与路边摊的油香。\n记忆里的那条巷道很窄，藤井拽着我穿过了堆积钢材的阴影：\n“小遥，从备用舷梯先走！”\n可警报突然响了，刺眼的探照灯瞬间封死了舷梯。为了引开追过来的巡警、让后面的同伴脱身，我抱着白夜在雨水里发疯一样跑向卸煤栈桥，顺着系缆绳一骨碌滚进了运煤舱的煤堆深处。\n躲在煤堆的漫长航程里，透过甲板舱盖的缝隙只能看着故乡栈桥上的灯火一点点缩成微弱的光点。那些掩护我翻上船舷的同伴，全被留在了码头刺眼的巡逻车灯光底下。\n这么多年过去了，我在大海对岸装成精明的说客，学着像模像样地跟军官和工会争论，可每次睡着的时候，自己依旧是那个躲在货舱深处不敢出声的逃亡学生，不知道当年留在岸上的那些名字，现在是不是也已经被彻底抹掉了。\n……\n下颌上传来温暖的触碰，白夜的小耳朵正贴着我的脖颈轻轻蹭着。\n我从办公桌前抬起头，日光顺着窗户斜铺在了墙上的地图之上。\n“醒了？刚才听你趴在桌上说梦话，一会儿念叨下雨，一会儿喊电车。”\n我揭下脸上的草稿纸，目光停在了地图西北角那片狭长的岛屿群上。\n“阿夏。”\n“嗯？”\n我揉着白夜的耳朵：\n“等秋粮全部入库、新的泊位建好……陪我回一趟老家吧。”\n“当年我一个人逃跑丢下的那些人，总得去确认一下……大家还在不在。”"
PAU.37.a: "……"

PAU_zgjd: "海那边可全是正规舰队啊"
PAU_zgjd_desc: "想在这片小船坞里拼凑出一支正规海军去打决战是不可能的。大海对面的军部手里握着成排的主力舰与航母，正规交火我们连一轮齐射都撑不过去。\n但藤井在海图室里指出了唯一的胜机：军部的大部分主力舰队正被牵制在海峡西岸的中国抗日战场上，本土的各处军港防御空前空虚。\n我们不需要去跟战列舰对决，我们的目标是斩首。征用海湾内所有适航的远洋货轮，用防弹钢板改装成隐蔽的装甲运输船，将岸防炮焊上甲板充当近程火力掩护。利用白夜对深海盲区的感知避开巡逻潜艇，在本土造船厂工会的罢工掩护下，将战车和老兵直接送进本土军港的腹地，一击击碎军部的大本营！"

PAU_zszz: "现在可不是客气的时候"
PAU_zszz_desc: "面对大海对面正规舰队的重炮，继续按平时的慢节奏造船修闸就是坐以待毙。小遥在船厂黑板上画下全港布防图，宣布所有的民间泊位、钢板库房与大型吊机全面转入战时改装。既然要迎头撞向风暴，我们就把手里能打出去的家伙全给搞出来！"


PAU.38.t: "谁也不是为了当英雄"
PAU.38.d: "埃文斯把一份签满外文名字的舰队名单放在桌上，他的制服领口敞开着，显然刚和手下的船员发生过激烈的争吵。\n我递过去一杯凉水问他：“你们那些水手真愿意登船？我还以为他们更想开船回本土去呢。”\n“回去当无业游民吗？”埃文斯端起水杯一口饮尽，“本土的议会早就把远征队视为叛徒了。要是空着手回去，我们是要上军事法庭的。留在莉兰迪亚，至少每月能按时领到粮食与津贴。”\n埃文斯指着海图上的航道：\n“何况樱花军部的潜艇已经在太平洋击沉了不少商船了，他们正试图封锁大海。如果不能把航线打通，我们在南美的港口早晚也会变成与世隔绝的死港。参战不仅是为了帮你们，也是为了保住我们自己的退路。”\n门口传来推门的声响，巴罗夹着一个文件袋走了进来：\n“长官！老兵们的报名表收齐了，装甲连和炮兵连的志愿书全在这里。”\n我抬起头打断了他：\n“我现在是个在工地上领基础工资的施工员，判决书还在市政大楼门口贴着呢。”\n巴罗有些尴尬地咳了一声：\n“叫习惯了，换个称呼舌头会打结的。”\n我翻开老兵们的申请名单：“法庭已经保证了退役抚恤和土地。你们留在城里种玉米，晚上能睡安稳觉，何必跟着船队去大海上拼命？”\n“种地？”巴罗低声说道，“弟兄们打了十几年仗，除了装填炮弹和修坦克，做起别的活计笨手笨脚。当年我们听信王室的命令向同胞开火，走到哪里都觉得抬不起头。现在跟着大统领去大海对面，是去阻击那些肆意侵略的军队。哪怕最后沉在海里，我们墓碑上刻的名字也不至于让人骂一辈子了。”\n门外传来皮靴踩过水坑的声响，雪伊带着工会的登记册走了进来。\n她连看都没看巴罗一眼，直接抽出一支红笔，在调度单的联席批准栏上签下了自己的名字：\n“阿夏，别以为你又能一个人说了算。路上要是敢乱动平民，回来之后法庭接着审你。”"
PAU.38.a: "“去核对下舰队的登船名单吧。”"

PAU_zdgj: "如果这套办法管用的话"
PAU_zdgj_desc: "底舱里堆得乱七八糟，翻来翻去，连一件像样的正规军需品都挑不出来。\n防风的大衣全是用帆布改的，领口上面甚至还印着面粉袋的红字；备用的螺栓与垫圈用麻绳胡乱捆在铁柱上，扳手柄上居然还刻着不同机修铺的记号；最显眼的咸鱼桶边上，不知道被谁用烧焦的木炭在箱子上写了行字：“省着点吃，别刚出海就全啃光了。”。\n……等等，仔细想想，现在的同盟明明有炉子也有纺织厂，早就不至于穷到揭不开锅了，怎么大家装船还是跟逃难一个德行啊？"

PAU.39.t: "不要再搞封建迷信了啊"
PAU.39.d: "小果子正站在壁柜前，规规矩矩地整理着两盘刚蒸好的包子。\n柜子最上层摆着一张画像，上面是画着的是小遥和白夜。白夜本尊此时正大模大样地蹲在盘子旁边，欢快地舔着包子上的油脂。小果子合拢双手，十分虔诚地拍了两下手掌，嘴里还小声念叨着祈词。\n拿着几份物资清单的小遥从门口路过，看到这一幕立马呆住了：\n“小果子……你在那儿拜什么呢？”\n小果子挺起胸脯：\n“在向春日大明神和白夜大人祈祷今天库房的土豆不要受潮变质呀！”\n“哈？！春日大明神是谁啊？！”\n“就是小遥姐姐你呀！”小果子理直气壮地指着画像，“码头的大婶说了，小遥姐姐是带着神兽渡海拯救大家的神使。水手们也说出海前对着小遥姐姐祈祷，就能网到吃不完的大鱼呢！”\n小遥手里的清单差点脱手飞了出去，直接冲到柜子跟前，揪住白夜脖颈上的软毛将它提了起来：\n“什么大明神啊！我是大活人！”\n小遥指着小果子，气得直跺脚：\n“还有，水手能捞到大鱼是因为藤井带队找准了洋流！”\n小遥顺手从盘子里抓起一个包子塞进嘴里，恶狠狠地嚼着：\n“听好了小果子，立刻把这个供奉我的架子撤掉！我都说了多少次了！我们是靠大家的双手把同盟建起来的，谁允许你们搞这种乱七八糟的封建迷信了？！以后全城谁要是敢借着这种理由搞迷信敛财，治安队直接按投机倒把扣他的钱！至于小果子你，罚你这星期的零食全归我吃！”\n小果子委屈地收起盘子，小声嘟囔着：\n“可是……昨天拜完之后，船厂的配件真的准时造出来了嘛……”\n我倚在门边，拿起盘子里剩下的另一个包子咬了一口：\n小遥，你前段时间才说过的，神龛可以留着让大家互相打气？小果子只是祈祷土豆别受潮而已，又没逼人捐钱，更没有拦着谁去看医生。你不能非得到了看见自己画像的时候，就把所有人都当成借着迷信去敛财的骗子吧？\n小遥瞥了一眼那张画像，别别扭扭地说道：\n“……我知道啦。刚才说得太过啦，对不起，小果子。”\n她伸手把画像从最上层拿下来翻到了背面，才把它放回了柜子里：\n“不过别再把我画得像什么神使一样啦，好不好？”\n小遥又用手指点向小果子的额头：\n“还有，罚你零食全归我吃这条……撤回一半。另一半算你包庇白夜偷吃包子的惩罚！”\n\n“看来春日大明神的法力确实挺灵验的。”\n\n“阿夏！你又跟着起哄！”"
PAU.39.a: "“春日大明神，保佑明天船厂吊车别掉链子。”"

PAU_ldwm: "请不要再为自己感到悲伤"
PAU_ldwm_desc: "故乡那些狂热的军阀以为掌控了战舰就能为所欲为。他们逼着孩子穿上军装去充当炸药，剥夺了母亲为战死儿子哭泣的权利，还妄图把整片亚洲拖进无底的深渊。\n他们当初把我们打成叛乱者，以为隔着大海就能把反抗的火种彻底踩灭。行啊，那就让他们睁大眼睛看清楚，从大海另一端开回来的，到底是一支什么样的队伍！\n告诉还在暗地里坚持的工友，告诉海峡对岸正在浴血抗战的同胞们：白夜同盟的远征舰队已经拔锚。\n这一次，我们回去当面做个了结，把眼泪与身而为人的尊严，原原本本地还给这片土地上的所有普通的人们！"

PAU.40.t: "如果他们看见现在的我"
PAU.40.d: "夜晚的风带着些许凉意，卷着海潮的咸腥味灌上了山坡。\n我看着膝盖上熟睡的白夜。脑海里挥之不去的，都是那些原本已经模糊的面孔。\n坐在前排喜欢在笔记本上画花球的美月，总爱跟我抱怨数学老师留的题目太多；造船厂那个爱抽旱烟的老车工，休息时总会悄悄从机床底下刨出烤得流油的番薯塞给我。那时候虽然大家手里都没钱，可谁也没想过去杀人，更没人成天把为国捐躯挂在嘴边。\n这场即将爆发的远征，在那些故乡人的眼里究竟是什么样子？\n当挂满火炮的庞大船队出现在海平线上，他们看见的是解救同胞的故人，还是跨海而来、企图摧毁他们家园的侵略者？\n我原本的一生应当平淡无奇：在放学时和同学们打打闹闹，休息时就逛逛街买买东西，下大雨时就躲在教室里不敢出来，或是庆幸自己鞋柜里刚好放着一件黄色雨衣。\n就这样，直到平凡地老去。\n究竟是从哪一天开始，我居然背负起了成千上万人的命运，带着整支异国舰队回去向生养自己的故土宣战呢？\n“一个人躲在这里发呆可不好，各舰的锅炉现在可都点着火了。”\n阿夏不知何时就在我身旁坐了下来，朝我递来一罐饮料。\n我擦了下额头，轻声问道：\n“阿夏，你说……老家码头上的那些熟人，看见我带着装满大炮的舰队开回去，会觉得我是个带来灾难的敌人吗？”\n阿夏仰头喝了口水：\n“换作任何人，看见军舰堵在家门口都会感到害怕的。”\n“当年我开着坦克冲进工区，自以为在履行军人天职，结果在工人们眼里，我成了屠杀同胞的刽子手。直到前几天我脱下军官制服在工地上推车，他们才肯走上前跟我搭话。”\n阿夏指向港湾里整装待发的船队：\n“我们开船回去，不需要他们对我们心怀感激。船上的大炮是为了去捣毁那些绑架了所有人的军部大本营的。等战火平息之后，你走下船，去街上买几个小吃什么的，坐在车站台旁边跟他们一块吃。到了那个时候，大家自然知道回来的究竟是谁了。”"
PAU.40.a: "“走吧，该登舰了。”"


PAU_llbg: "呼叫当年的暗号"
PAU_llbg_desc: "随着舰队逐渐逼近，小遥在通信机上调出了当年学生会与造船厂约定好的备用频段。那是她在逃难前夕与留在港口的同伴们最后约定的联络方式。既然舰队已经重返故土了，她迫切需要唤醒潜伏在本土的地下反抗组织，摸清那些要塞的布防与军部的巡逻盲区，去接应那些当年在警笛声中掩护她翻船逃跑的故人。"

PAU.41.t: "往日、老友"
PAU.41.d: "在通信机的指示灯跳动之后，刺耳的杂音突兀消散，频道竟然顺利接通了。\n小遥抓着话筒，语速飞快地念出了当年的暗号后继续说道：\n“我是春日小遥！白夜同盟的舰队已经在近海就位了！美月，你们还在港口吗？！”\n听筒那头只有刺耳的电流哨音与海浪杂音。过了很久，发射开关发出咔哒一声轻响，里面才传出了美月的声音……：\n“春日小遥。你果然成了外国势力的枪手。”\n小遥愣在操舵台前，把话筒贴在了耳边：\n“美月？你……大家还好吗？其他人呢？”\n“当年的罢工者全被军队清算了。”\n“我们主动向军队检举了所有的反战分子。那些顽固不化的家伙现在正关在毒气试验舱里，他们的尸骨会成为帝国圣战最光荣的肥料。”\n“包括当年的老师，也是我亲自签署的告密书。多亏了他，我现在已经是造船厂女子挺身队的队长了。”\n听筒里隐约能听见那边整齐划一的军靴踏地声与狂热的口号：\n“你以为带着几艘外国破船能改变什么？全校的学生都在争相报名军队，连十多岁的孩子都在工厂里装填炸药呢，大家都迫不及待要去炸沉你们这些叛国者。”\n“是你们背叛了国家，劣等国民春日小遥。”\n嘟——嘟——嘟——\n频道被单方面切断，重新变回了一开始的电流杂音。\n小遥维持着握着话筒的姿势一动不动僵在了原地。\n“……阿夏。”\n“我在。”\n“通知各舰，主炮解除保险。”"
PAU.41.a: "“……准备迎击敌舰。”"

PAU.42.t: "美月的日记"
PAU.42.d: "通信机在警报尖啸中断开了，但发射机底座的电传打字机却没有停下来。字轮与色带哒哒哒地走字，吐出一截预先打好孔、被强行塞进高速发报槽的纸带。\n那是美月早已卷好在轴芯里的私人电文。\n纸带上的油墨杂乱无章，记录着这几年里那个小镇上发生的事情：\n\n“四月十二日\n隔壁佐藤家的次子在大陆战死的消息传回那天，佐藤太太在院子里跪了一整天。她一声都没有哭出来，手里甚至还在不停地缝着准备留给孩子的白布，因为街道里长站在门外说，为国捐躯是我们身为樱花国民的无上光荣，家属若是落泪便是对英灵的不敬。\n大家都在害怕。大家谁也不敢交谈，大家害怕脸上的哀伤被当成不忠诚的证据。母亲咳得越来越厉害了，家里剩下的吃的也已经见底了。小遥，我好想念过去我们在走廊下躲雨的黄昏，那时大家脸上的笑容，究竟是从哪一天开始彻底消失的呢？\n\n五月十八日\n教官在课桌前握住了我的手。他的态度温和得令人害怕，他说老师私下珍藏的外国诗集会动摇前线士兵的意志，若是士兵犹豫，就会有更多像佐藤家那样的年轻男孩子死在战场上。他说他拿走书本是为了医治老师的糊涂，是为了保护大家。\n我相信了他。我带着宪兵翻开了教室的地板。\n直到老师被推上卡车、他年幼的女儿哭倒在泥水里捡拾撕碎的图画时，我才跪在地上明白过来，是我亲手将敬爱的老师送进了深渊。\n\n八月二十日\n母亲昨晚在工位上倒下了，再也没有醒过来。她闭眼前抓着我的衣服，反复向我道着歉，愧疚着仅仅因为自己生病就拖累了整个国家。\n今天清晨，我跟着挺身队去码头给开拔的运兵船送行。甲板上站满了与我们同龄的孩子，他们头上绑着白布，微笑着向岸上挥着手，大声唱着出征的歌。\n要是我现在背叛了国家，我又该怎么面对出卖老师、失去母亲的痛苦呢？\n小遥，我已经学会了跟他们一样唱歌，学会了像他们一样对哀求声视若无睹。你千万不要再回来了，因为我已经彻底变不回从前的那个美月了。”"
PAU.42.a: "……"

PAU_byzc: "大家都可以哭出来了"
PAU_byzc_desc: "军国主义的残火熄灭了，但空气中依旧弥漫着恐惧与绝望的死寂。街道两侧的门窗仍然紧闭着，站在门缝后面的市民也照旧用看待魔鬼般的目光注视着巡逻的队伍。在疯狂的教条里浸泡了不知多年的土地，如今早已装满了难以愈合的创口与戒备。想要把被扭曲的人心一步步拉回人间，是没有任何捷径可走的。"


PAU.43.t: "喂！我的巴罗连长"
PAU.43.d: "我正带着连队清查诡雷的时候，就看见那个从公社新分过来的新兵正着急地解下腰间的水壶。\n水坑里，缩着一个年纪很小的敌兵，他浑身被排泄物和泥浆浸透，正捂着被炸断的腿，带着满脸鼻涕眼泪，哑声喊着他的母亲。\n那个新兵拿着水壶走上前去，似乎想把水壶递给对方。\n“退后！别过去！”\n巴罗的大吼声在后方突然响起，可惜已经为时已晚。\n“万…万岁！！！”原本奄奄一息的孩子猛然睁开眼睛，拉开身旁泥地里露出的拉火索要和眼前向自己递水的另一个孩子同归于尽。\n几乎就在同一时间，巴罗整个人已经飞身将那个吓呆了的新兵扑了出去。\n炸药在战壕里爆开，扬起的泥土劈头盖脸地砸落了下来。\n还没等到身后队伍惊呼的声音，我便急忙冲上前扒开了泥块，只见巴罗伏在土里，后背已被弹片炸得血肉模糊。\n而那个新兵，那个从公社调来的新兵，他已经整个人都瘫坐在地上了，怀里还抱着水壶傻傻发抖。\n我的视线瞬间就变得模糊了起来，一把抓起他的衣领，带着胸腔里所有的怒意冲他吼着：\n“你他妈是脑子被猪吃了吗？！战地条例背到狗肚子里去了吗？！”\n就在这时，一只手掌用微弱的力气抓住了我的手腕。\n这是巴罗的手，他的胸口正不断起伏着：\n“阿…长官……啊，又叫错了……你现在是施工员来着……”\n“少说话，留着力气等医护兵过来。”我蹲下来托住了他的肩膀。\n“别骂这小子了……他刚从厂里出来……哪见过这帮疯子……”\n巴罗费力地呛出一口黑血，抓着我的手腕，字句在喉咙里断断续续：“这帮军阀……把自己的孩子都训成了畜生……我们不能……不能也变成那样。”\n“我们当年是王室的狗，像这群疯子一样朝工人开枪，良心早就……被狗吃了……\n可这帮公社的孩子手是干净的。要是今天在这儿……逼着他把所有人都当成牲口看……\n\n那这场仗……就算打赢了，\n\n我们…也永远死在这场仗里了……”"
PAU.43.a: "……"

PAU.433.t: "喂！我的巴罗连长"
PAU.433.d: "巴罗费力地从上衣口袋里摸出当年被他砸在柱子上、后来又被他悄悄捡回来的军团勋章。\n他将那枚章塞进了我的手心：\n“阿夏……等舰队回了南美……\n记得按法庭判决的规矩，把我的抚恤金全部划给那些死难工人的遗孤……”\n随后，他像带着所有未尽的执念一样，注视着我的眼睛：\n“报名出征那天，我说我不想死后被后人骂一辈子……\n应该…不会了？”\n“对。\n巴罗，你是我们最好的坦克连长。”\n“那就好……叫了十几年的长官……改口……可真是件费劲的事啊……”\n\n“……长官也好……\n施工员也好……”\n“这最后一次……换老子……给你下道命令……\n听好了……二连长巴罗命令你……放下枪……回老家好好活着……\n……不准哭……长官……”\n\n“……不……傻丫头……\n\n阿夏……”\n\n他的手掌从我的手腕上脱力滑落，永远停下了呼吸。\n不知道为什么，我突然就听不到了。\n队伍里的喊声、哭声、骂声、以及身旁那个新兵的抽泣声，\n这些刚刚还在耳边的声音全都听不到了，只留下一阵嗡嗡的耳鸣。\n\n不知过了多久，等耳边的风声重新响起，我才站起身，拔出腰间的配枪冲到那个死去的敌兵身前，对着那具残骸的方向扣动了扳机。\n砰！\n砰！\n砰！\n砰……\n\n打在了一旁的空地里。"
PAU.433.a: "“阿夏听到了，巴罗连长。”"

PAU_zxlk: "让我们再定一次规矩吧"
PAU_zxlk_desc: "当年我躲在船里逃命的时候，要是谁跟我说将来有一天我会带着舰队打回老家，我肯定觉得对方是在胡说八道。\n现在军部那帮指手画脚的长官枪毙的枪毙，关进大牢的关进大牢。可看着眼前乱成一团的烂摊子，我才发现真正的头疼事现在才刚开始呢。\n这片故土以后到底该怎么过日子？\n是干脆把两边大海的工厂与田地彻底连在一块，让造船工人与农民自己掌管工厂，建立一个谁也别想剥削别人的劳动者联合？还是索性推行彻底的去中心化自治，让每个小镇自己管自己的事，永远断掉野心家集权开战的念头？\n不管选哪条路，反正那些高高在上的恶魔们已经彻底滚蛋了。这一次，这几座岛屿的明天该往哪儿走，可是由我们自己说了算的。"

PAU.44.t:"以后"
PAU.44.d: "距离小遥最初接受代理大统领一职，已经过去了好几年了。联合议会按约公开了军费、粮仓和港务账目，各地代表也投票同意，在正式宪制方案确定前，暂时续任她为代理大统领，由她处理日常政务。\n“我说雪伊，你别死盯着那张写着红字的草案了，面条放凉了可就坨了。”\n小摊前，小遥正握着竹筷挑着面条。\n桌面上压着两份草案。雪伊和晓枫坐在了桌子对面。\n阿夏端着热汤开口道：\n“埃文斯天亮前跑来找我。远征军听说以后工厂都要收归公家，以为手里那点私房钱要被抢走了，好几个水手吓得连夜去收拾行李了。”\n雪伊把大碗往桌上一顿，挺直身子反驳：\n“工会早就说明白了，安家费和私人物件谁也不准碰！但船厂、煤矿和铁轨是绝对不能归私人霸占的。所有的工厂产出分配，必须归全城工人一起说了算，省得以前那些老爷和奸商再骑到大家脖子上作威作福！”\n晓枫把碗里的汤吹凉，指着右边那份方案：\n“可各个小镇和码头的代表根本不同意。樱花的老百姓刚从兵营一样的管制里熬出头，一听全归上面管这几个字就害怕。他们希望各个镇子自己当家作主，大伙平起平坐搭伙过日子，上面少来指手画脚。”\n小遥咽下嘴里的面条，放下了筷子：“白夜同盟这块牌子我们肯定不能摘的。但这两条路确实挺让人犯愁呢。”\n雪伊盯着她转来转去的印章：“你自己的判断呢？你是大统领，不能只负责把印章递出去。”\n小遥指尖一顿，笑容立马消失了。她本想顺口说一句“这叫民主”，话到嘴边却又咽了回去。\n“……我当然也有偏向。”她低声嘟囔，“两条路我都有顾虑，万一选错了，最后还不是得让大家一起承担后果。”\n小遥抬起脸，重新挤出笑容：“哎呀，我会把我自己的判断也写进去的，你们用不着担心啦。”"
PAU.44.a: "工团主义：工厂与矿山由工会联合会直接管理。"
PAU.44.b: "民主社会主义：各地公社自治，全国代表会议协调。"
PAU.44.c: "听听小遥怎么说（进入 444/4444，可选择列宁路线）。"


PAU.444.t:"不能总是以后"
PAU.444.d: "“说起来，那几个被我们催着限期加入的镇子，最近又送来信了。”\n小遥用筷子拨着碗里剩下的面条，继续说着：\n“他们想重新谈谈镇子里的事情到底该由谁做主。”\n她抬起头，看向雪伊，又看向晓枫。\n“现在想想，人家当时连拒绝的余地都没有。我拿着装甲连队和最后期限去催他们签字，他们就算签了，也不代表心里服气呀。”\n雪伊皱起了眉头：“可那时候要是不把各地联合起来，真遇上敌人了怎么办？我们总不能眼睁睁看着一个镇子一个镇子地被打垮。”\n“我知道呀，所以我到现在也不觉得当时的决定全是错的。”小遥挠着脸颊继续说道，“只是……有些事情一旦拖到以后，就很容易一直拖下去。等大家终于想起来要谈的时候，说不定连当初为什么答应都忘了。”\n“而且，我以前最讨厌的，不就是有人仗着自己手里有兵、有权，就替别人决定该怎么活吗？偏偏这回，我也成了那个替别人作主的人了。”\n一直没声的晓枫这时才轻轻点起了头。\n小遥把桌上的两份草案挪到了一起。\n“所以，我更想试试晓枫说的办法。”"
PAU.444.a: "……"

PAU.4444.t: "不能总是以后"
PAU.4444.d: "“我倒是有个问题。”雪伊用筷子夹走碗里的一根葱，“要是一个镇子的人都嫌麻烦，非要镇长替他们拿主意呢？”\n晓枫瞥了她一眼：“那也不能把镇子当成镇长的私产。”\n“可人家是自己选出来的呀。”雪伊慢悠悠地说，“镇长说要让大家过好日子，大家就选了他。结果转头就把工会赶出镇子呢？”雪伊向晓枫瞥了回去，\n“他还可以说，这是多数人的意思。”\n听到此话，小遥嘴里的面条停在了半空。\n“这、这算什么嘛！选镇长又不是买一送一，怎么连工人的嘴也附赠给他了？”\n“别光顾着生气。”雪伊敲着桌上的草案，“有些工人连合同都看不明白，镇长却有一整个办事班子。工会就算写进了章程，也未必争得到自己应有的东西。”\n小遥低头看着自己的印章，忽然把它扣在草案上。\n“那就让他们自己来管呀！”\n“你要让每个工人都当镇长？”晓枫问。\n“才不是！那样每天光排队盖章就要排到明年了！”小遥把草案翻过来，在背面画了几个方框，“工人代表，农民代表，大家组成地方代表会。镇长可以管日常事务，但不能自己决定工人能不能组织起来。代表也要向选他们的人交代，干得不好就能换下来。总不能选个人上去，就连后悔的机会都没有吧？”\n晓枫凑过去看了看：“那同盟的事情呢？总不能每个地方各管各的。”\n“所以还要有全国的代表大会呀。”小遥答得很快，仿佛早就想到了这一层，“各地选出代表，一起决定同盟的大事，再选出负责执行的人。至于怎么把工人和农民真正组织起来，就得有一个纪律严明的革命党来领导。不能只在事情顺利的时候才想起大家是一伙的。”\n雪伊终于笑了起来：“你反倒把事情想得挺远。”\n“那当然！我也是有认真考虑的时候的！”小遥得意地挺起胸膛，随即又把声音放低了些，“而且……要是所有事情都得我点头，那我哪天犯了傻，大家不就得陪我一起倒霉嘛？”\n她看了一眼碗里结成一团的面条，沉痛地叹气道：\n“不过，眼下倒是有个问题需要我亲自解决。”\n“什么？”\n\n“呜诶……面坨了诶！都怪你们，聊起政治怎么比吃饭还没完没了呀！”"
PAU.4444.a: "工团主义：让各地公社自治联合。"
PAU.4444.b: "民主社会主义：由工会联合会掌握生产与分配。"
PAU.4444.c: "列宁路线：由革命党统一领导全国建设。"



PAU_thsg: "不能乱拿别人的东西"
PAU_thsg_desc: "那些关在大牢里的军官，他们到现在还在嚷嚷着军港库房里那些封存的箱子是皇国的战利品。\n这算哪门子的战利品啊，分明就是一堆明火执仗抢来的脏物嘛。当年那帮军官为了填饱侵略舰队的胃口到处劫掠，我们白夜同盟可不打算替这帮强盗藏污纳垢。\n如果想要让饱受战火蹂躏的各国人民相信这几座岛屿上的疯狂确实停歇了，我们就不能找任何借口继续推脱。拿了别人的东西，就老老实实送回去，这可是做人最基本的规矩呢。"

PAU.45.t: "今天的号外"
PAU.45.d: "“啦啦啦，啦啦啦，我是卖报的小行家……”\n歌声在江边茶摊旁边停下，我扬起手里带着油墨味的新报纸，冲着长椅上的茶客大声叫卖：\n“号外！号外！特大新闻喽！鬼子的大本营教人给端了！”\n茶摊掌柜端着水壶，皱着眉头在桌面上一磕：\n“去去去，小鬼头大清早编什么胡话？前几天这儿防空警报还在响呢，鬼子还在前线扔炸弹呢，今天能让人给端了？我看你就是为了多卖两份报纸瞎嚷嚷，当心我抽你嘴巴子。”\n“谁编胡话了！”我抽出一份晨报拍在了茶桌上，“您自己瞧！正面战场抗战到底，鬼子后方也炸了锅，樱花军部被彻底赶下了台！挂着白旗的船队今天一大早就停在泊位上，正往岸上卸当年抢走的发电机和钢材呢！”\n几个坐着喝茶的伤员立刻围拢过来，目光落在报纸头版黑字上。\n“这……这上面写的是真的？”一个拄着拐杖的伤兵念出声来，“‘军部覆灭，抢掠物资原样归还’……‘沿江各厂被掠设备已全数起运交割……”\n江堤方向突然传来一阵雷鸣般的喧哗，几个码头工人一路小跑着冲进街口，上气不接下气地大喊：\n“快去看啊！是真的！大船上的姑娘和水手正带着江防司令部的人验货呢！当年被鬼子抢走的东西都给拉回来了！”\n整条街的茶客轰的一声全站了起来，连茶钱都顾不上扔，跟着人潮争先恐后奔向江堤。\n掌柜抓着那份报纸怔在了原地：\n“这仗……打了这么多年……天真的要亮了？”\n我捡起桌上落下的铜板揣进布兜，甩动着手里的报纸，继续唱着歌向街口跑去：\n“啦啦啦，大新闻！小鬼子抢走的东西全送回来喽——！”"
PAU.45.a: "欢迎回家"

PAU_blsm: "地里的玉米熟了呢"
PAU_blsm_desc: "舰队跨越大海返回南美的时候，我和那个年轻战士带着巴罗的遗物，回到了同盟当初给他分好的那块农田边。\n地里的玉米结出的穗子金黄饱满。那个被他救下的年轻战士蹲下身，小心翼翼地掰下一把成熟的玉米放在墓碑前，替老连长磕了好几次头。\n但愿，长眠于此的故人能够安心，但愿，他们再也不会被战火所践踏。"

PAU.46.t: "不用改口了"
PAU.46.d: "田里的玉米长势很好，穗子结得很饱满，连秸秆都被压弯了。等风一吹过来，叶子撞在一起的声音都快赶上当年一群人擦装甲的动静了。\n我让那个跟着一起来的公社新兵去路口守着。\n那小子一开始还不肯走，非要留下来帮我一起拔草。我瞪了他一眼，说我要在这儿上厕所，他才涨红了脸，抱着用帆布裹着的铁锹一溜烟跑远了。\n现在，四周总算安静下来了。\n我走到了荒地里那块没怎么打磨过的墓碑前面。\n碑面刻得很粗糙，正中几个字是“二连长巴罗之墓”。底下那行小字是工会给加的，写着“白夜同盟初垦拓荒者”。\n说起来也挺讽刺。一个开了一辈子战车、手上沾过血的老兵，最后落了个开荒模范的名号。\n我从口袋里摸出巴罗的勋章，把它牢牢卡在了墓碑顶端的裂缝里。\n“喂，巴罗。”\n“今天的解散哨，刚才在山坡上已经吹过了。没听见就算了，反正你活着出操时也总爱装聋作哑。”\n“以后的名册里，你们这帮老骨头的编制算彻底销户了。不用半夜爬起来排空化油器的积水，也不用提防哪个大臣又往连部寄白条了。至于你们那点津贴……法庭判决书上写得很明白，每个月直接划扣给工区的那些孤儿院，你们应该不会介意吧？”"
PAU.46.a: "……"

PAU.466.t: "不用改口了"
PAU.466.d: "“……行了，骗谁呢。”\n我自嘲地笑了一声。\n“海那边还在没日没夜得造军舰呢，圣杯估计也天天在报纸上骂我们是海盗呢。这世道哪有一天真正消停过。”\n草叶上的冷露浸透了裤腿，寒气也顺着布料灌进了我的身子里，让我不禁蹲了下去。\n“十几岁那会，刚进营地的时候……我连机枪卡壳该拉哪道栓都分不清。夜里听见山里的动静，也只会裹在毯子里哭得喊妈妈。是你夜巡路过掀开帐篷，从怀里摸出个烤土豆塞给了我。最中间那点能吃的全让你抠给我了，自己只吃外圈那些又黑又苦的硬皮，还粗着嗓门吹牛，说老兵就喜欢挑焦的吃，特别抗饿。”\n“你这满嘴胡话的混蛋，哪有人真爱吃那种东西。”\n说着说着，我垂下头，不断用衣服抹起了眼睛上的雾气，水迹却顺着下巴砸进了脚前的地里。\n“后来我当了长官，天天板着一副臭脸，学老团长那样天天背着手在队伍前面晃……我装给谁看啊？我心里怕得要死啊。”\n“每天早上哨声一响，我都怕帐篷帘子一掀开又少掉几张熟悉的脸……我怕又听见谁在床上喊着长官救命……”\n我深吸一口带着土腥味的冷气，抬头冲着眼前的荒地大喊：\n“听好了！巴罗！还有二连那些躺底下的混蛋们！”\n“就算哪天警报真又响了……就算不得不拿起枪去跟外面的疯子拼命……”\n“那也是为了守住我们手头开出来的这几垄地，守住那帮不用再进战壕的孩子！听明白了没有？！”\n“真到了那时候，我，阿夏，依旧是你们的长官。我照样开着战车顶在最前面。这一辈子……我绝不再把任何人丢在身后了！”\n风在这会儿又吹过来了，巧得像是巴罗那伙人听见了我说的话一样。\n我撑着膝盖站起身，往后退了两步，随后挺起背部，抬手敬了一个端正的军礼。\n“走了。”\n我迈开脚步，走出几步又停了下来，侧过脸小声骂道：\n“……都在底下把嘴闭严实了。谁敢笑话我刚才哭鼻子，等以后我也闭眼了，非得把你们全揍一顿不可。”"
PAU.466.a: "谁都不准迟到"

PAU_wdct: "电车站台"
PAU_wdct_desc: "当年为了铸造炮弹被拆毁的电车轨道，终于由工友们重新铺设完毕了。通电的架空线在海风中划出整齐的弧线，电车在一声清脆的铃铛声里驶进了站台。\n那些在噩梦里回响的警报已经彻底远去，现在，它们变成了每一趟按时进站的叮当叮当声。"

PAU.47.t: "下大雨那天"
PAU.47.d: "学校车棚的长椅上，正咬着汽水吸管的千夏突然用胳膊碰了下我的手臂：\n“喂，小遥，你记不记得以前你经常放在鞋柜里的那件黄色雨衣呀？”\n我咬着手里的点心，含含糊糊地回应道：\n“哪件？……你干嘛提这个？”\n千夏把身子往后一靠，笑出了声：\n“那天下了好大的暴雨，我忘带雨伞，自作主张从你柜子里翻出那件雨衣套着跑去车站。你母亲那时候老是唠叨你粗心大意，所以特意在领口内侧写了‘春日小遥’，我没说错吧？”\n千夏踢着脚边的落叶，满不在乎地讲起当年的往事：\n“我才刚到检票口，几个巡警莫名其妙冲上来把我按在地上，大声嚷嚷抓到了通缉犯人！后来我才知道，你那天下午被挂上了紧急通缉，正好我又穿着写着你的名字的雨衣……”\n千夏一脸心有余悸又得意的样子：\n“我一开始还拼命喊‘我是佐藤千夏’呢！结果那帮家伙说春日小遥只是在码头犯了点小错，现在坦白交待的话就能从轻处理，家人也不会受到任何牵连。”\n千夏压低声音凑过来，悄悄冲我眨眼：\n“于是本姑娘就把心一横，直接大喊：‘没错！我就是春日小遥！有本事的都冲我来！’——哇，那巡警气得脸都绿了，非要我交代什么工会的据点和逃跑路线，还把我塞进拘留所关了好久好久，哪怕后来查清楚了也没有把我放了！最后……是二哥把去往满洲的志愿书拍在桌上然后立马磕头道歉，他们才肯放人。不过，雨衣在挨打的时候就被扯烂了……二哥走前还笑着拍我的脑瓜，让我别哭，说等他回来了给我买件更好的……”\n我嘴里的点心咽不下去了。"
PAU.47.a: "……"

PAU.477.t: "下大雨那天"
PAU.477.d: "当年翻进船里的那天……\n原本封锁码头的警车拉响警笛离开，几乎全部的搜捕巡逻都冲向了电车站台……\n千夏感觉到我的视线，疑惑地和我对视了起来：\n“……喂，小遥？你怎么愣住了？……该不会真生气了吧？我可是替你挨了打哎，一件雨衣而已，你不会这么小气吧……”\n我伸开双臂，突然扑上前抱住了千夏的脖子，把脸深埋进了她的肩膀里。\n千夏被撞得差点从椅子上掉下来，有些手足无措地扶住椅背：\n“哇……小遥你今天怎么回事呀？突然抱过来干嘛，好肉麻哦。”\n我从喉咙里发出了心疼的哽咽：\n“……赔我。”\n“大傻子……快把雨衣赔我。”\n千夏彻底呆住了，感受到肩窝里滚烫湿透的眼泪，刚才还耀武扬威的大英雄瞬间慌了神。轻轻拍抚着我的后背：\n“别骂了…对不起嘛…那件雨衣是你妈妈亲手缝的，肯定特别珍贵对不对？！别哭了小遥……我赔你，等我二哥……等他回来，我拉着他一起赔你还不行嘛……”\n说到最后，千夏自己的声音却也跟着颤抖了起来，再也坚持不下去了。\n\n“……别哭了，求你别哭了，好不好……\n都怪你……突然抱过来干嘛啊……\n再这样下去的话……\n我也有点想哭了啊…………”"
PAU.477.a: "一定要赔我一件一模一样的啊，笨蛋"
PAU.477.a_tt: "§L连名字，也要写得一模一样……§!"

PAU_els: "既是同路人，总得打声招呼"
PAU_els_desc: "听说北方有一群推翻沙皇统治的同伴。虽然我们双方说的语言完全不同，小遥也对那些冗长刻板的理论文稿感到头疼，但大家都是为了让普通人有口饭吃而拼过命的人。派遣代表团渡海前往莫斯科，互递免于冲突的友好通报。哪怕彼此隔着广袤的荒原，至少得让北方的同胞知道：在这里，同样有一群不肯向压迫者低头的同行者在努力生活着呢。"

PAU.51.t: "请你先从桌子上下来"
PAU.51.d: "“……苏维埃政权之所以存在，就是要证明普通劳动者有能力掌握自己的命运。我们全联盟的电气化不仅是一个工业指标，它更是为了让每一个偏远乡村的孩子都能在电灯下读书……”\n小樱站在展开的规划图前，正认真地对几名委员阐述着构想。\n“真好啊……连那种山沟里的孤儿院，也给画上电线了吗？”\n一个白发少女不知道什么时候坐在了地图的一角，怀里那团白色小动物正伸着爪子，好奇地去够茶炊的开关。\n小樱手里的尺子停在了空中。\n“警卫！……等等，等等，外面的迎接仪式刚刚开始，你怎么自己跑到偏厅里来了？还有，谁允许你坐在桌子上的？！”\n“这样就能看得清楚一点了嘛……”少女咽下嘴里的面包屑，笑着挥手，“我是白夜同盟的大统领。外面那些交接手续的速度太慢啦，我就自己先溜进来了。放心好啦，鞋子在上桌前就已经脱在门边上了呢。你画得真仔细啊，小樱同志。”\n小樱放下尺子，突然用充满庄重充满威严的声音开口了：\n“春日同志。苏维埃始终注视着对岸的斗争。你们捣毁了军国主义的大本营，将掠夺的资产原样还给受难的邻邦，工会的情报我都看过了。只要你们是真心为了劳动者而战，这里永远认可你们的努力。”\n说到这里，小樱庄重肃穆的神情突然垮了下来，她指着桌子上的毛团，鼓着脸嚷道：\n“但是！光脚踩了一地灰再爬上桌，这哪里干净了啊！而且那个小家伙刚才把果酱全吃光了！那可是给今天会议准备的茶点啊！”\n“小樱同志，别那么小气嘛。”小遥从桌上跳下来，拍了下衣服，“听说你们这儿也在为了大家能过上好日子而努力，我就坐着列车顺路过来打个招呼。怎样，要不要跟我们联手组个互助的条约联盟什么的？”\n小樱重新整理好桌上的图纸，两手抱在胸前说道：\n“联合的前提，是你们必须彻底杜绝资本的垄断与复辟，确保每一个工厂都由工人自己说了算。另外……以后开会的时候，严禁这个小家伙靠近任何图纸！”\n“成啦！”小遥笑眯眯地拉过椅子坐下，“那现在，能让同志们再送一碟浆果来吗，小樱同志？”\n小樱看着眼前这个毫无拘束的异国领袖，无可奈何地摇着头：\n“真是不讲规矩……不过，欢迎来到莫斯科，春日同志。”"
PAU.51.a: "欢迎白夜同盟加入第三国际！"
PAU.51.b: "先保持观察。"


PAU_zg: "我们以后就是邻居了"
PAU_zg_desc: "运送退还物资的船队陆续靠上周边各国的港口码头，站在栈桥上接应的，是同样穿着普通工装的工友代表与抗战老兵。他们清点完木箱，关切地询问起这边的船厂工人是否有足够的口粮过冬。\n这才是我们渴望见到的邻邦。对岸掌权的是在焦土上浴血奋战出来的新政权，他们深知被压迫的滋味，也最懂得和平的分量。\n同盟正式宣布废除旧政权强加于邻国的一切不平等条约，彻底放弃所有海外特权与据点。将造船厂新造的民用钢材与机器零件源源不断运往各处受灾的港湾，全力支援领邦重建被战火毁坏的城镇与铁道。握紧彼此的双手吧，从今天起，我们平起平坐做真正和平友好的邻里。"

PAU.48.t: "握手"
PAU.48.d: "我坐在会客室里，看着正对面那个低头站立的年轻水手。\n她身上双手局促地贴在两旁，跟当年端着刺刀横冲直撞的侵略者毫无相似之处。\n在我们中间的，是一份联合条约。那帮推翻了樱花的军国主义的年轻人，在草案里主动抹掉了过去强加的所有特权，甚至提出由他们出动护航舰队，替我们在外海警戒西方列强的战舰。\n“长官……”水手仍然带着一副紧张的样子，“如果你们的海岸需要保护，我们愿意替你们挡在风浪最大的地方。”\n我按在桌面上的手掌碰到了她因弹片留下的伤疤。\n这场仗打了太多年，多少连队打光了番号，多少村落化作了焦土。面对这个来自樱花的年轻人，要咽下过去的血仇绝非易事。\n可看着那双满是诚恳与忐忑的眼睛，我知道，坐在对面的人已经不再是当年那帮畜生一样的侵略者了，她是同样从地狱里爬出来的同胞。\n我向她伸出了自己的右手。\n年轻水手愣住了，随即慌忙伸出满是伤痕的手迎了上来。\n过去的深仇大恨交由历史的人民们去裁决，而眼前的这双手，值得我们以平等的尊严友好相待。"
PAU.48.a: "既然推翻了暴政，那便坐下来谈谈和平。"
PAU.48.b: "收下物资与诚意，但我们暂且保持独立自主。"

PAU_zg_fd: "旧账还了，换下皇帝可免谈"
PAU_zg_fd_desc: "对岸海港里收下了我们退还的全部物资，可统治者居然是个穿着朝服、做着朝贡帝国大梦的封建余孽，甚至还有军阀企图将战火反向烧向我们的海湾。\n小遥在回电的公函底下用很重的力气盖上了白夜同盟的印章：当年的掠夺是帝国的罪行，我们低头退赔是为了对得起海峡对岸受苦的百姓；但这可不代表我们会向另一个骑在人民头上的新皇帝下跪！\n我们连本土的狂热军阀都亲手砸碎了，更不可能容忍任何外来的独裁者对同盟指手画脚。同盟正式重申底线：物资归还完毕，领海互不侵犯。如果对岸的官僚企图以战胜者自居发动新的战争，布防在沿海的岸防大炮与各舰炮口，随时准备给那些看不清局势的野心家好好上一课。"

PAU_mdg: "少拿骨头架子吓唬人"
PAU_mdg_desc: "那个自称魔导国的国度传来的消息令人作呕。一个顶着王冠的白骨骷髅，居然带着一群嗜血的怪胎在欧洲建立起奴役活人的亡灵帝国。我们在南美早就领教过亡灵怪物的残忍，那些被死气吞噬的荒野到现在都让人心有余悸。我们头顶上的天空，无论如何也不能任由一群行尸走肉来主宰！"

PAU_sbwg: "请先守好自己的家"
PAU_sbwg_desc: "圣杯本土的议会大体上接受了远征军留居南美的既成事实，大海两端总算迎来了长久的安宁。那些留在这边的水手与家属已经融入了社区，海对面的议会也明白劳师远征只会自讨苦吃。我们会与圣杯王国正式签署“永久”和平协约：双方各自尊重对方的边界，圣杯留在本土继续搞他们的议会政治，白夜同盟在两块大陆上建设属于人民的家园。只要那帮议员不派军舰到我们的水域游弋，彼此安安稳稳过日子便是最好的结果。"

PAU_bm_hp: "能握手就别拔枪"
PAU_bm_hp_desc: "隔着辽阔水域相望的北美大陆拥有着庞大的工业力量。尽管那里对我们这套制度指指点点，但老百姓刚刚从战火里缓过劲来，谁也不想再去打一场耗费无数生命的跨洋大战。只要对方识趣地缩回伸向海洋的触角，承认同盟在两岸的主权，我们就愿意与他们结盟。大家一起发展，总好过将年轻的孩子送进战壕里送死。"

PAU.50.t: "省下的军费归谁"
PAU.50.d: "议事大厅里的争吵声几乎要把屋顶掀翻。\n保守党议员挥舞着几张报纸，唾沫星子横飞：\n“‘不可抗力滞留’？！远征军居然在报里声称全军遇上了不可抗力？！舰队、水手，现在全在南美港口当上了起重机工和农场主！他们甚至在信里附上了跟当地姑娘的结婚公证书！”\n财政大臣坐在桌子对面，两手一摊，面无表情地打断了他：\n“议员阁下，比起他们的婚礼，你最好先看看随信附上的远征军尾款报销单。”\n大厅里骤然安静了一下。\n财政大臣冷漠地宣读着这笔荒唐的绝密文件：\n“第一项：过去八个月欠发的海外津贴与热带防疫津贴，共计八十六万圣杯币；第二项：受损巡逻舰的折旧与船坞占位费；第三项：由于本国议会单方面冻结后勤账户，全军将士被迫向莉兰迪亚‘白夜同盟’签署劳务抵押贷款……如果王国现在要求撤军，必须先向南美港务局垫付一百四十万圣杯币的违约金。”\n“这是彻头彻尾的敲诈！”几位老将军气得拍案而起。\n“好啊，那派舰队去讨伐吧。”财政大臣把账本往桌上一扔，“派几艘主力战列舰横跨大洋，往返燃油需要四十万圣杯币，打赢了带回战火毁掉的废墟和几千名失去工作的难民在那领救济金，打输了海军造船厂直接破产。请问各位阁下，这笔钱从谁的选区税收里扣？”\n议员们面面相觑，原本叫嚣着维护王国尊严的贵族们慢慢缩回了椅子里。\n负责海关的商会代表抓准时机站起身，清了下嗓子：\n“各位……他们依旧在附言里说，只要我们签署事实上的和平贸易协议，南美港口的免税泊位明天就能对我们的运粮船开放，连咖啡豆都不收离港税呢。”\n沉寂了几秒后，议长甚至懒得举行辩论，直接按响了表决铃。"
PAU.50.a: "签字吧，就当我们在大西洋买了个便宜货栈。"
PAU.50.b: "我们不会咽下这口恶气的！"

PAU.49.t: "既然谁也不想开战"
PAU.49.d: "“……等等，你是说那个在大洋上打赢了樱花舰队的统领，实际上是个十多岁的小姑娘？！”\n指挥室里，我正靠在椅背上喝着汽水，看着刚刚送达的战报与那份盖着猫爪印记的防务条约。\n身旁的参谋官擦着额角的汗水，神情紧绷地递上侦察报告：\n“千真万确。春日小遥，原本是个连身份证明都不齐备的流亡者。她带着两艘改装船起家，拉拢了南美的佣兵与造船工人，强行攻克了樱花帝国的要塞。现在……现在她以白夜同盟的名义向我们递来公函，提议建立一个联合互助的联盟。”\n一名主张动武的军官按耐不住地插话进来：\n“这帮家伙根本就是一群不按常理出牌的反叛者！如果放任他们在对岸立足，大洋上的航道迟早……”\n“行啦，少拿那些陈词滥调来烦我。”我放下手里的汽水罐，打断了他的唠叨，“你们要是真有本事，怎么之前不敢开着战舰去跟樱花碰一碰？人家带着一群穷工人和破船就把不可一世的樱花给掀翻了，现在回过头给我们送来停火协定，问我们要不要搭伙守护这片水域。”\n我翻开那份协定草案，上面的条款直白坦率：\n“对方承诺尊重北部的领海边界，开放商贸航线，还主动提出共同防范那些企图跨海侵扰的殖民舰队。你们看看这上面的字句，‘谁也别想让自家的年轻人继续送死’，这可比那些老贵族虚伪的客套话真诚多了。”\n参谋官的语气有些迟疑：\n“那……您的决定是？”\n我拔开印章的盖子，直接按在了缔约确认栏上：\n“通知舰队停止战备巡航。既然对面是个敢作敢当的爽快姑娘，我们北美州就陪她好好守住这份安宁！”"
PAU.49.a: "批准联盟请求，白夜同盟是值得信赖的盟友。"
PAU.49.b: "我们拒绝与异国流民建立任何军事同盟！"

PAU_bm_kz: "真当白夜同盟好欺负？"
PAU_bm_kz_desc: "北美那些唯利是图的财阀显然坐不住了。他们看着我们砸碎了樱花帝国、解放了各地的工厂，生怕这股平等的火苗烧到他们自家的庄园与矿山里去，甚至在暗地里调动战舰企图封锁我们的航线。小遥站在海图前冷哼了一声：真当从南美一路冲出来的白夜同盟是任人拿捏的软柿子吗？！既然这帮大亨非要将战火烧到我们头上，那就索性迎战到底，彻底杜绝帝国主义在太平洋上的一切霸权！"

#A（世界革命）
#判定条件：与苏联成为盟友、与中国革命政权联合
#与 PAU_hpgc、PAU_zdbf 互斥
PAU_sjgm: "革命的日子还没到头呢"
PAU_sjgm_desc: "莫斯科的回电到了，对岸中国工友的回信也到了！他们接住了我们递过去的手，要和各地反抗压迫的人们互相支援。\n我当年以为带着大家逃出一条生路，就算万事大吉了。可看看这张地图，海那头还有无数人在皮鞭底下流血呢！我们好不容易走到了今天，总不能眼看着别人受苦，却连一封回信、一船药品都不肯送过去吧？\n各工区立刻准备军需物资，货轮装载钢材、药品与机器零件，随时待命出海。愿意与我们共同斗争的力量，可以来谈合作、提要求；需要援助的地方，将由同盟共同商议对其的援助方案。至于当地的人想走哪条路嘛，当然还是要靠他们自己决定才行的。\n我可不敢说自己什么都懂，更没本事替全世界的人安排好所有的明天。不过，既然我们已经有能力帮上一把，那就再也不要别装作什么也没看见了！\n白夜同盟从今天起，要做全世界反抗力量靠得住的好伙伴。如果有谁愿意和帝国主义斗争到底，就来谈谈吧。这回，我春日小遥第一个奉陪！"

#B（和平共处）
#判定条件：圣杯议会批准和平、北美联合、中国维持和平
#与 PAU_sjgm、PAU_zdbf 互斥
PAU_hpgc: "看吧，和平才是最强的奇迹"
PAU_hpgc_desc: "回信都送到了！圣杯的议会撤回了战舰，北美同意尊重边界，邻邦也接纳了我们的谢罪与友善！\n以前那些大人物天天叫嚣着弱肉强食，断言不同旗帜下的人注定要互相残杀到死。那么！现在就让他们睁大眼睛看清楚，我们这帮曾经一无所有的普通人，终于彻彻底底在两块大陆之间建起了一个不用互相开火的和平世界！\n从今天起，把武器收进仓库吧，造船厂全都开足马力去造客轮和渔船吧！我们不仅要活下去，还要活得比谁都舒服、比谁都热闹，向世人证明普通人能够靠着双手守护属于自己的明天！"

#C（武装中立）
#判定条件：失败拒绝承认友好、与北美敌对、与中国反动政权敌对
#与 PAU_sjgm、PAU_hpgc互斥
PAU_zdbf: "有本事就放马过来啊！"
PAU_zdbf_desc: "海对面那些傲慢的帝国居然把我们的和平协约扔了回来，还妄图将我们当成可以随意拿捏的流民？！\n那可真是给他们脸了！我们跨越大海打碎了自家的军部，可不是为了跑去向另一群殖民强盗低头讨饶的！他们要是想在海那边继续争权夺利，就由着他们烂在自家的泥潭里去吧！\n不管哪路帝国主义的军舰敢把炮口对准同盟的水域，我就带着舰队把它们轰进海沟里去！谁想封锁我们的航线、逼我们低头，就先掂量掂量自己付不付得起这个代价！"

PAU_cxzm: "与国同罪"
PAU_cxzm_desc: "在档案里翻出那些写着叛国罪名的通缉令时，几个代表曾建议举办一场大会把以前的事全免了，以此向世人宣告过去的恩怨一笔勾销。\n小遥直接驳回了特赦的提案。\n如果接受特赦，就等于承认当年的反抗确实有罪，无非是侥幸得到了新政权的宽恕。\n当旧政权逼迫人民去残害邻邦、强令孩子去当炮灰的时候，违抗这种命令便成了一个人守住良知的正当选择。同盟正式在所有通缉令上盖下印章，宣告过往因反抗侵略与拒不服从军令而被定罪的人员全部清白无辜。\n需要被钉在耻辱柱上接受审判的，是那个妄图吞噬一切人性的旧体制本身，而非拒绝沦为凶手的普通百姓。"

PAU.52.t: "喂、喂，听得见吗？"
PAU.52.d: "“喂、喂？一、二……听得见吗？后面电车站旁边那个咬着肉饼的大叔，能听清我的声音吗？听得清就挥挥手让我看见——啊，看见了看见了，扩音器效果还挺不错的呢。”\n高台上的小遥调整着话筒的高度，声音顺着街角的几个大喇叭在整个街区飘荡着。\n台下站满了市民、脱下袖标的学生与集结的工友，大家都屏息注视着台上那个新任领导者。\n小遥停顿了一下：\n“站在这儿之前……我其实拖了很久、特别久啊。”\n“战火平息了，电车也通了，条约也签完了，我才磨磨蹭蹭走上台。”\n“因为我很心虚啊。真的很心虚。”\n“当年军部开着战舰去蹂躏海峡对岸、把成千上万的人推进深渊的时候，我除了像个懦夫一样继续逃亡，什么都做不到。现在站在这儿说话，我都觉得脸颊烫得特别厉害。”\n台下一片寂静，无数双眼睛都纷纷望向了高台。\n“这几天，好多代表私底下跑来跟我说。”\n“他们说，小遥啊，现在大家都打赢了，你就当个好人，告诉大家过去的事全是一场误会。”\n“就说大家无非是受害者嘛。母亲不敢哭是因为害怕，学生告密是因为肚子饿，士兵开枪是因为军令连坐。就好像大家一起抱头痛哭一场，把罪名推给几个死掉的长官，过去的血迹就算彻底擦干净了一样。”\n\n“是啊，大家都是被迫的，一切都是上面那帮已经被审判的恶魔干的。只要把眼泪擦干，明天大家就又是一个清清白白的好人了。”"
PAU.52.a: "……"

PAU.522.t: "喂、喂，听得见吗？"
PAU.522.d: "“……可这算什么啊？！”\n小遥突然拔高了音调，嘶吼声如同雨雷般响起：“这是在开什么玩笑啊！！”\n“法庭没有把一线士兵和普通百姓一概定罪，是为了让这座城市免于无休止的私刑与复仇！那是法律的底线！！那是法律给活人留着种地开车的台阶！可我们凭什么把法官的饶恕，当成自己良心无罪的奖状啊？！”\n“邻居家被搜捕的时候，我们关上了门窗；\n老师被拖走的时候，我们低下了头颅；\n对岸的城镇被烧成焦土、捷报传回街道的时候，我们一边吃着抢来的粮食一边跟着收音机挥舞着小旗高呼万岁！”\n“如果今天我随口说一句‘大家都受了委屈、过去就算了’……那海峡对岸死在烈火里的人算什么？那些被出卖的师长算什么？那些被逼着死在异乡的年轻孩子又算什么啊？！”\n台下的人群剧烈骚动起来，许多人捂着脸泣不成声。\n小遥拿出一张公文纸，迎着全场的视线继续宣读道：\n“下达侵略命令的长官，该处决的已经处决，剩下的送进监狱服刑；靠着告密和充当爪牙换取特权的人，名下侵占的房屋和田产全部依法充公，退还给受害者的家属；军国组织的骨干分子，剥夺一切任职资格，明天就会迎来公庭的审判，法庭就在政府大厅门口，每一笔罪责都会查得清清楚楚。”\n\n“但是，除了法律的审判，以后……再也不会有人替我们做善恶的选择了。”\n“我今天站在这里，可给不出什么皆大欢喜的答案。美月给不出，台下的你们给不出，我也给不出。”\n“明天早晨醒来，我们去工厂工作、去学校教书、去跟邻居打招呼……遇见曾经被自己伤害过的人，也别急着装作什么都没发生。该道歉的道歉，该承担的责任就给我好好承担。”\n“散会了！回家去，好好想想明天的早饭，好好看着身边，还活着，还没被自己伤害过的人。”"
PAU.522.a: "“大家……全都好好想一想啊！”"



PAU_fby: "白夜本来就是只野兽"
PAU_fby_desc: "小遥抱着白夜走上老家后山，来到那座空置已久的神社前。\n当年她带着白夜翻上船，生怕这个山里的小家伙被军部抓去充当战争的试验品。后来在大海对岸，她拿白夜的名字当盾牌建立了同盟，大家甚至在街头给这个贪吃的毛团立起了神龛。\n如今，枪声、炮声、所有的有关战争的声音都彻底停歇了：\n“两边的仗都打完了，海里再也不会冒出吃人的怪胎，人类这堆麻烦事也用不着你来扛着。回去当你的野兽去吧，抓松鼠也好，在树洞里睡大觉也行，爱去哪儿去哪儿。”"

PAU.53.t: "回家"
PAU.53.d: "后山的神社已经空掉了，连鸟居上的红漆都掉得差不多了，露出了底下灰白色的朽木。我把白夜从怀里放下来的时候，它还有点懵，歪着脑袋一直瞅着我。\n“走啦，野兽就该回林子里去。”\n我冲它摆手催促。\n“两边的仗都打完了，老老实实抓松鼠去吧。省得天天跟我抢咸鱼吃，笨蛋。”\n说完，我没等它反应过来，转过身一路小跑下了山。\n顺着熟悉的下坡路拐过两个弯，那栋带小院子的木屋就出现在巷子尽头。\n院门虚掩着，推开的时候发出嘎吱一声长响。院子里的杂草长得有半人高，把当年的洗衣盆全盖住了。\n我踩上走廊，脚底下的地板发出空洞的响声。\n这里，很安静呢。\n“……喂！老头子！”\n我站在玄关门口，两手叉着腰大喊：\n“你藏在收音机电池仓里的私房钱，我当年逃跑前全都顺走啦！连一分都没给你留呢！你到现在都不知道吧？！”\n风穿过破损的障子门，吹动着屋顶悬挂着的蛛丝。\n既没有人出来骂我，也没有人拿着鸡毛掸子追着我打。\n“……老妈！你腌的梅子难吃死啦！酸得人牙都要掉了，隔壁千夏每次收下，转头就倒进后沟里了，我可全都看见了哦！”\n屋子里依然只有我自己的回音。\n走廊旁边的那根木柱子上，还留有一排小刀刻出来的印记。\n每一道旁边都写着年份。最上面那一道刻得很深，旁边是用毛笔歪斜写着的一行小字：\n“春日小遥，十七岁。再不长个子可就真嫁不出去了。”\n我走过去，把手掌平贴在自己的头顶，再往柱子上一推。\n指尖正好压在那道刻痕的上方，高出了两寸多一点。\n“……老头，我长高了哦。”\n我盯着那道刻痕，声音不由自主地低了下去。\n“真的长高了……哪怕是在船上天天吃面包，也长高了……”"
PAU.53.a: "……"

PAU.533.t: "回家"
PAU.533.d: "警察当年找上门的时候，老头子肯定急得把眼镜都摔碎了吧。\n后来军部把他们当成叛乱家属带走的事，我在南美的电台里早就听说了。我一直没提，跟阿夏没提，跟晓枫她们也没提。\n我还天天跟他们吵架，装成全天下最精明、最讲利益的说客……\n因为我不敢停下来啊。\n我要是停下来哪怕一分钟去想这件事，我就连明天早上的粥都咽不下去了。\n我再也站不住了，顺着柱子滑坐下来，一边抱着膝盖，一边把脸彻底埋进了裙子里。\n“差劲透了……”\n“世界上怎么会有我这么差劲的女儿啊……要是我当年听话，老老实实去当学徒……家里明明好好的……”\n“白夜也跑了……”\n“跑了好……谁稀罕养一头连老鼠都追不上的大肥团子……”\n反正大家最后都会走的。\n老爸也是，老妈也是，千夏的哥哥也是……最后留在屋子里的，永远都只有我自己一个人。"
PAU.533.a: "……"

PAU.5333.t: "回家"
PAU.5333.d: "——沙沙。\n院子里的枯草突然剧烈地响动了起来。\n还没等我抬起头，一团带着泥腥味和草叶味的热乎东西，像颗炮弹一样直接撞在了我的小腿骨上！\n“哎哟！”\n我疼得脑袋都懵了，直到我抹开了脸上的眼泪，才看到……\n是…白夜……它正趴在了我的鞋子上，四条小短腿沾满了泥巴，白毛上还挂满了带刺的苍耳。\n它抬起那张沾着泥巴的圆脸，嘴巴一张——\n啪嗒。\n一颗熟透的鲜红野柿，正好落在了我的膝盖上。\n吐完柿子，它像立了大功一样，拼命晃着那截短得几乎看不见的尾巴，两只前爪扒着我的裤管，鼻子一个劲往我脸上凑，呜呜地叫个不停。\n“……你……”\n“你怎么又跑回来了啊？！”\n“不是让你回山里当神兽吗？！身上全是泥，别往我衣服上蹭啊！脏死了！”\n白夜根本不管我怎么骂，一头钻进我的怀里，喉咙里发出舒服的呼噜声，舌头在我满是泪痕的下巴上使劲舔着。\n我一把抱住这团发烫的白夜，眼泪完全不受控制地砸在了它的脑袋上。\n“大笨蛋……”\n“都说了这里没有炸鱼了……连老爸老妈都不在……你跟着我喝西北风吗……”\n“笨蛋白夜……”\n它把耳朵贴在我的手心里，安静地任我抓着。\n过了好久，我抽着鼻子把膝盖上那颗野柿子拿了起来，在袖子上擦干净之后，掰成了两半。\n一半塞进白夜嘴里。\n另一半塞进我自己嘴里。\n吃起来好涩，还干了吧唧的，但是…好甜啊……甜的要死。\n我咽下那口柿子肉之后，重新抬起头望向了柱子上那行字。\n\n“爸爸。”\n“妈妈。”"
PAU.5333.a: "“小遥今天……来带你们回家了哦。”"


PAU_end: "明天就交给你们了"
PAU_end_desc: "礼堂里的大会总算散场了。来自工区、远征军与樱花的代表们，在共同宪章上按下了手印。\n代表们原本想选出一个大总管，被我当场回绝了。天天坐在办公室里核算指标，我可受不了那种苦差事。大统领的位置正式取消，各地工厂与铁路归属选举产生的工友议事会自主打理。\n不过那帮老兵和工会生怕对方暗中使绊子，在宪章最后加了一条：春日小遥保留临时的紧急仲裁权，两边在桌上要是争得不可开交，还是会由我出面拍板定案。\n我把印章锁进了参事会的柜子里，揣好布包就偷偷溜出了大门。\n五点整的下班铃声已经响起来了，我的差事办完啦。以后的生活，就交给你们自己去过咯。"

PAU.54.t: "五点零二分"
PAU.54.d: "电车站台的长椅上，我撕开了冒着热气的纸包，里面冒出了肉饼的香味。\n“呐，肉饼分你一个，算我请客。”我将其中一块递给了身旁的阿夏。\n阿夏接过去咬了一大口，平淡地嘟嚷道：\n“拿我掏钱买的肉饼请我的客，前大统领大人的便宜占得可真顺手呢。”\n“都说了别叫那个头衔啦！”我嚼着酥脆的肉饼，含含糊糊地抗议着，“我现在可是无业游民，明天起要去船厂当正经学徒工的呢。”\n看着站台上来来往往、我突然想起了在南美山坡上的那个晚上。\n当时阿夏坐在草地上，也是这样漫不经心地随口应付我：说什么等仗打完了就去街上买点小吃坐在车站台旁边吃，大家自然知道是谁回来了……\n现在四周确实没人戒备我，也没人把我当成开着战舰的怪物，但阿夏好像跟完全忘记了一样，吃肉饼的模样看起来比我都香。\n“阿夏。”\n“又怎么了？”\n“肉饼挺香的吧。”\n阿夏嚼着饼白了我一眼：“废话，我掏的钱。”\n咔哒，站台的挂钟时针不偏不倚地定格在了五点零二分。\n紧接着，一阵铃声顺着铁轨由远及近荡了过来，电车停在站台前，啪得一声用气阀声打开了车门。\n随着车门打开，一群学生背着书包跑下车厢，嘴里争论着明天的功课；刚下班的工人们提着饭盒走上来，互相询问着晚饭的菜单。\n我把布包背好，站起身迈向了车门：\n“阿夏，上车啦。”\n“今天晚上吃什么？”\n阿夏踩上车厢踏板回答道：\n“南美带回来的玉米还有两袋，煮玉米糊怎么样。”\n“又是玉米糊啊！那我要加糖，必须加好几大勺糖！”\n“行，随你。”\n随着电车门在身后关上之后，这辆载着喧闹与笑语的车厢，悠悠地驶向了象征着平淡生活的海湾小镇。"
PAU.54.a: "“可别忘了我的糖，阿夏长官”"

PAU.55.t: "谁算自己人"
PAU.55.d: "“呜哇！抱歉抱歉！”\n艾玛捧着一大叠刚缝好的桌布慌慌张张跑上台，脚下一绊，手里的毛线球骨碌碌滚开，正好在埃文斯的皮靴上绕住好几圈。\n埃文斯手里拿着协议草案，低头盯着被毛线捆住的靴子：\n“艾玛小姐，等一下……毛线要扯断了。我正在讨论正经事呢。”\n艾玛蹲在地上手忙脚乱地解线结：\n“对不起埃文斯先生！这团线完全不听使唤……”\n讲台另一边，雪伊正指挥着几个人挪桌子，扭头冲后面提醒：\n“后面的轻一点！地板刚擦过，经不起你们这么砸。”\n旁边抬长椅的工匠抹掉额头的汗，顺口接话：\n“就是啊长官，怎么还在担心这种事啊，刚才进门就听见你在那儿瞎操心了。明天码头要给大船装新舵，缺人手缺得要命，大家忙都忙不过来，谁有空管你以前是什么来头。”\n埃文斯把缠在鞋扣上的毛线扯开，眉头依然皱着：\n“我可不是在开玩笑。字虽然签了，但我们毕竟是从海对面过来的，以前习惯的那套跟你们完全不一样。等以后日子长了，我们这些人当真不会被当成异类排挤掉吗？大家到底是自己人，还是迟早要被清理的外人？”\n正在翻看账册的晓枫停下笔，抬起视线：\n“我们看重的是做不做事，又不是查你的家底。只要愿意老老实实干活，参事会的座位肯定少不了你们的。”\n艾玛终于把毛线理顺了，抱着线团仰起脸帮腔：\n“就是说呀！而且埃文斯先生前天分给大家的红茶超好喝的，工友们都夸呢！”\n埃文斯的表情有些挂不住，不自在地正了下帽子：\n“……那叫正规外交礼节！还有，那可是我好不容易攒下的私房货！”\n雪伊把手套扯下来塞进兜里，走上前说道：\n“听懂了吧？想在这里安稳待着，光靠嘴巴担心可没用。顺便问一句，埃文斯指挥官——”\n雪伊冲着墙角歪了歪头：\n“今天会议室的值日表上写着谁的名字，你该不会装不知道吧？台阶那边的木屑和碎纸，什么时候带人打扫干净？”\n埃文斯低头瞅着墙角那把扫帚，面对眼前这群完全不讲客套的同僚，只得无奈点头答应。"
PAU.55.a: "“去把扫帚拿过来吧……”"


####军事线####
#阿夏军事线
#开局
PAM_xbhm:"别把新兵扔在后面"
PAM_xbhm_desc:"老军团长以前就不喜欢我带队时只顾着走在前面。那时候我还觉得，只要前面的人走得够快，后面的人总会跟上来的。现在轮到我看着这群孩子了，才知道这种想法有多讨人嫌。\n最近补进来的新兵还没摸熟装备，就已经有人在打听什么时候进山了。我让老兵带着他们重新练一遍。有人嫌麻烦，我也没心情跟他们争。等真遇上野火的人，总不能指望他们临场才学会怎么配合。"

PAM_nzdt:"那张地图得重画了"
PAM_nzdt_desc:"新参谋送来的地图又被我退回去了。上面把几条山路画得很漂亮，连村口那段塌方都没标出来\n我记得去年运粮车就在那里陷了整整半天，最后还是附近的村民帮忙把东西搬出来的。\n我不想再看见这种事。负责侦察的人要重新走一遍路线，沿途的村镇也要打听清楚。至于那些说着问题不大的家伙，我已经把他们的名字记下来了。下次就让他们自己去走那条路。"

#与野火开战
PAM_jzbx: "那片山坡还没看清"
PAM_jzbx_desc: "炮击申请取消了。因为前线说山坡后面有野火的人，可他们自己也没看清对方到底有多少人，地图上的位置更是差了好一截。负责传令的年轻人急得直跺脚，他说再拖下去的话，等他们跑了又得追半天了。但我让他先去喝口水，等侦察的人回来再说。\n我知道大家都想赶紧往前走。这场仗拖到现在，谁都没剩下多少耐心。可山里的地形本来就麻烦，几支队伍隔着山脊，连彼此在哪儿都未必清楚。炮弹落下去以后，可没人能把它叫回来的。\n晓枫的人也在那一带活动。我不愿意拿从前的交情替他们求情，真打起来，该还击的时候还是得还击。但在连目标都没弄清楚的时候就开炮，我实在没法点这个头。"

PAM_jzbx2: "我还不打算追进去"
PAM_jzbx2_desc: "前面的阵地已经空了好几个地方了。有人回来时还带着缴获的东西，兴冲冲地跟我说野火大概撑不住了，照这个势头，很快就能打到他们的山里去。我听了没说什么，只让他先把手里的东西交给后勤登记。\n我当然也想早点结束。营地里还有一堆等着处理的事情，伤员要送回去，弹药要补上，几辆坏车到现在都没修好。可前锋已经走得很远了，后面的队伍却又堵在了路上。真遇上什么情况，光靠跑得快可是救不了人的。\n晓枫以前就知道怎么利用地形。她现在会不会故意把阵地让给我们也完全说不定，虽然我也不想凭这点猜测就把所有撤退都看成圈套。于是，我就让前面的人把队伍收拢一些，等后面的队伍跟上之后再继续推进。要是她真有别的打算，至少我们不能自己先乱了阵脚。"

#返回南美，开始亡灵战役
PAM_nlwq: "弹药可经不起这么糟蹋"
PAM_nlwq_desc: "我把那份战斗报告看了好几遍了，还是没弄明白一个连队怎么能在半天里打掉那么多弹药。报告上写着敌人数量庞大、攻击持续不断，最后的伤亡是没多少，弹药消耗却快赶上我们以前打一场硬仗了。\n我把负责这次行动的军官叫来问了嘴。他说亡灵一直往阵地上冲，弟兄们根本不敢停火。我能理解，第一次见到那些东西的时候，我自己也没好到哪儿去。明明前面已经倒下了一大片了，后面还是不停地往上挤着，换谁都会觉得它们根本杀不完。\n可弹药又不会自己长出来。我们带来的存货看着不少，真要这样打下去，也撑不了多久的。我让他们把那天的射击记录和各方阵地的情况重新整理一遍，尤其得弄清楚哪些火力确实挡住了亡灵，哪些只是在白白消耗子弹。说起来容易，做起来肯定又得有人嫌麻烦了。随他们怎么说吧，等到弹药箱空了，可没人能替我们把里面的子弹变出来。"
PAM_nlwq2: "我可不想再抬一遍"
PAM_nlwq2_desc: "我以前总觉得，打进一座城以后，最麻烦的就是把敌人赶出去。现在才发现，光是让自己的人能活着出来，就已经够折腾了。\n上次清理街区的时候，前面一度被倒塌的墙和临时路障堵住了。担架队抬着伤员绕了好几条巷子，最后还是从一处快塌掉的门洞里挤出来的。我当时正好在附近，看着他们把担架放下来歇气，伤员疼得直哼哼，抬人的几个家伙连骂人的力气都快没了。我没忍住，冲着负责安排路线的人发了顿火。现在想起来，声音大也没让那条路自己变宽。\n所以这次进城前，我亲自看了几处预定的进出路线。工兵要设障碍可以，但得留出能让担架和运货车通过的地方，还得有人知道出了问题该往哪儿走。军官们对路线安排有自己的想法，我也没打算把每个细节都管死。只要真打起来的时候，不用再抬着伤员在废墟里兜圈子，我就谢天谢地了。"

#亡灵威胁结束，进入重建阶段
PAM_ax_bz: "我就想安静吃顿饭"
PAM_ax_bz_desc: "我刚端起饭碗，边境那边就送来了消息。最近几晚，山路附近总有人点火，隔着老远都能看见。值班的人想知道是不是有武装在集结，我也想知道，可惜我又没长一双能穿过山的眼睛。\n我让熟悉那片地形的巡逻队沿着山路一路查访，遇到附近居民就问问山里的近况，再顺着他们提供的消息确认火光的来处。夜里的岗哨照旧轮班，遇上不对劲的动静就立刻报告。暂时先按这个办法办，真要把所有人都调过去，别的地方反倒没人守了。\n饭后来不及吃热的，我也就懒得抱怨了。反正军营里只要有人说一句“可能有情况”，我的饭就得先放在一边。等消息送回来，我倒要看看那几堆火究竟是有人在扎营，还是谁家的锅又烧穿了。"

#开启南美战争
PAM_ax_nyjs: "我不想在树林里捡人"
PAM_ax_nyjs_desc: "战争开始以后，前线的命令是一封接一封地往下发，仿佛只要把地图上的箭头画长一点，所有人就都能跟着走到地方。我倒希望事情真有这么简单。\n队伍进了林子以后，前面的人急着赶路，后面的人却被泥地拖得越来越远。有几个士兵为了追上主队，连水壶都顾不上拿。我让各队按照自己能维持的速度推进，沿途约好停步和重新集合的信号。要是谁发现队伍散得太开，就先把人带回来，再接着走，别为了多赶一段路，把自己的同伴落在林子里。\n指挥部很快又送来催促前进的命令。我把那封电报塞进衣袋，打算等负责联络的军官赶到以后，再让他把我们目前的位置报回去。仗才刚开始，我可不想以后每次点名，都得先派人进树林里挨个喊名字。"

#进入南美战后治理阶段
PAM_ax_nyfy: "废弃下来的阵地"
PAM_ax_nyfy_desc: "仗停下来以后，我才发现有些麻烦比敌军撤退得慢得多。山路旁边的铁丝网被藤蔓盖住了，废弃阵地里的弹药箱也都泡在了泥里，原先的地图确实早就把这些地方标成了安全地带。有回我经过村外，看见放牧的人正把生锈的金属往车上拖，结果旁边的士兵急得一路追过去制止，连嗓子都喊哑了。\n这事让我很恼火。当地人缺铁料，想把废弃军械拿去换钱，也不是什么难以理解的事；可那些东西究竟还能不能碰，连熟悉战场的老兵都未必说得准。统一后的工兵部队得把清理阵地当成长期任务，沿着村路和农田逐步排除遗留爆炸物。暂时无法处理的地方要明确标出危险范围，附近居民也得知道发现弹药以后该找谁处置。\n我不打算催他们为了赶进度冒险。工兵清理过的道路，会由巡逻队和当地向导共同确认，再逐步恢复通行。等所有人都忙完了，村民至少能把牛牵过山路，不必每次经过废弃阵地时都先担心脚底下踩着什么。"
#准备攻打樱花
PAM_ax_jhdd: "这艘船上次漏水是什么时候"
PAM_ax_jhdd_desc: "远征的事终于落到我们这边了。前几天，送来的计划还挺像样，船队排得整整齐齐，连登陆以后往哪儿走都画好了。我把它交给几个跑过海运的老兵看，他们倒没说计划不好，就问：这批船上回出港的时候，修船的钱结清了没有。\n我一时答不上来。后来跟着他们去船坞转了一圈，才发现有艘运输船的船底还留着以往漏水的毛病，负责维修的人一直等着零件到货。平时运货还能凑合，真要把人和装备送到樱花那边，半路出了问题，可没人能开辆卡车来救急。\n我只好先把这艘船留下来修，再从别处想办法调零件。船坞里的人忙得连饭都顾不上吃，我也跟着在港口耗到了天黑。等船终于重新下水，原定的出发时间已经往后挪了一截。陆军那边催得厉害，我也只能告诉他们，晚走几天总比到了海上再找地方补船底强。\n后来有人问我，这趟远征准备得怎么样了。我说，至少现在有一艘船能保证把人送出去。至于它上次漏水是什么时候，最好还是别让乘客知道得太清楚。"
#樱花战后
PAM_ax_zsjs: "谁把岗哨排到菜市场了"
PAM_ax_zsjs_desc: "战事结束后，我接到命令，要把留在樱花的部队重新安排好，免得大家闲下来以后各找各的事做。我本来想先把巡逻路线理顺，结果当地官员拿着一张投诉单来找我，说我们的人天天守在菜市场门口，把买菜的居民吓得绕路走。\n我赶紧去问带队的老兵。他说那条街最近丢东西，大家都是奉命加强警戒。我一听觉得有道理，便问他查出什么了。他说暂时还没抓到小偷，不过菜市场里卖鱼的摊主已经主动给他们留了位置。\n我过去一看，好家伙，几个士兵端着枪站在鱼摊边上，摊主正热情地问他们要不要买两条，说有他们站着，今天连鱼都卖得特别安稳。\n我只好把巡逻安排重新调整，让士兵按规定巡查，遇到治安问题就交给当地人员一起处理，不能把整条街当成自家营地。临走时，鱼摊老板追上来问我，明天还来不来。\n我说：“巡逻会照常进行，但不会固定站在你摊子旁边。”\n他叹气道：“那我今天给他们留的鱼，算不算白留了？”\n我这才明白，有些人已经开始把我们的岗哨当成招牌了。"
#迈向世界
PAM_ax_sjjs: "我们全连都学会敬礼了"
PAM_ax_sjjs_desc: "我们刚开始在海外驻扎时，上头要求大家注意当地礼节，别让居民觉得我们仗着手里有枪就不懂规矩。这个要求本来挺好，坏就坏在负责训练的新兵班长特别认真，硬是把敬礼练成了每天的必修课。\n过了几天，我发现连炊事员看见当地小孩都要立正，连去买面包的士兵也能在柜台前把手举得整整齐齐。我问班长这是怎么回事，他说礼节得养成习惯，不能等遇到正式场合才想起来。\n我让他带我去看看训练成果。他挺自信，刚走到街口，一个老太太拎着篮子从我们面前经过，全连刷地一下抬起手来，把人家吓得差点把苹果掉在地上。\n老太太站稳后看了会我们，慢慢把篮子举起来，问是不是也得回礼。\n我赶紧让大家把手放下，跟她解释这是部队训练出了点偏差。回营以后，我把敬礼训练改成了按场合进行，还让班长先弄明白当地人平时怎么打招呼。\n第二天，我看见他跟门口的守卫打招呼，总算没再抬手。只是他把帽子摘下来鞠了一躬，帽子直接掉进了水桶里。\n我觉得这事还得再练练，不过至少这回，没人把老太太当成了上级军官。"

#晓枫雪伊军事线
#亡灵威胁结束，进入重建阶段
PAM_xfxy_jsgz: "两支队伍，一张地图"
PAM_xfxy_jsgz_desc: "雪伊：晓枫，你给我的这张地图上，为什么同一条路有两个名字？\n晓枫：因为地方巡逻队沿用旧称，我们的地图用的是战时名称。我正在确认它们是不是同一个地方。\n雪伊：那你最好快一点。昨天有一队人沿着旧地图走了半天，最后发现自己巡逻的地方就在出发点后面。\n晓枫：他们至少确认了出发点的位置。\n雪伊：你要是把这句话写进报告里，我就把报告拿去给他们当地图。\n晓枫：好吧，我会把道路名称、各队驻地和联络方式统一起来。不过，联合巡逻的路线还得由熟悉当地的人确认，光靠旧地图容易出错。\n雪伊：这才像话。你负责把图画明白，我去找那些巡逻队谈妥时间。至于谁先走哪条路，最好也提前说好，省得大家在路口互相敬礼，谁也不肯先走。\n晓枫：我会把这条写进安排里。\n雪伊：别写得太正式，人家是来巡逻的，又不是来参加地图考试的。"
#开启南美战争
PAM_xfxy_nyjs: "电台那头的咳嗽"
PAM_xfxy_nyjs_desc: "雪伊：晓枫，前线的电台又出毛病了。刚才我听见有人报告情况，听到最后就只剩下咳嗽声了，害得接收的人也跟着咳嗽了起来。\n晓枫：南美这边的天气不太适合依赖单一的联络方式。信号一断，前面的部队还在往前走，后面的命令就送不到了。\n雪伊：那你打算怎么办？总不能让每个传令兵都随身带一台电台吧，那样的话，敌人还没打过来，咱们先得给传令兵找个搬机器的人。\n晓枫：我准备给各支部队安排固定的联络人员，让他们在电台失灵的时候接力传达命令。常用的信号也会提前约定好，免得有人听见一声哨响，就以为整场战斗已经结束了。\n雪伊：这个办法不错。昨天还有个军官听错了集合信号，带着整队人去吃饭，结果炊事班还以为自己突然升了军衔。\n晓枫：所以我会把信号重新统一，再让各部队在出发前实际演练一次。\n雪伊：很好。记得把演练安排在饭前，免得炊事班又以为咱们要给他们开庆功宴。"
#进入南美战后治理阶段
PAM_xfxy_nytjjs: "命令不能替别人签字"
PAM_xfxy_nytjjs_desc: "雪伊：晓枫，共同防务委员会又送来一份方案，说是要让各地军队统一指挥。\n晓枫：哪一部分统一？\n雪伊：你看，你也觉得这话说得不清楚。\n晓枫：我是在问他们自己有没有说清楚。\n雪伊：写了。写得还挺漂亮。就是没说地方指挥官不同意的时候怎么办。\n晓枫：那就得先谈好。总不能等到开战了，才发现大家对统一指挥的理解不太一样。\n雪伊：我确实见过这种场面。两边都说自己在等命令，最后敌人等不及，替他们把仗打完了。\n晓枫：所以紧急支援的条件要提前约定。符合条件时，可以直接联系对方；涉及联合行动，再按双方认可的办法协调。\n雪伊：这样就好。自己的军营自己管，真要并肩作战的时候，也别拿自治当借口，站在旁边看热闹。\n晓枫：嗯。这两件事并不冲突。\n雪伊：那你把这句也写上吧。省得有人把方案看完，只记住了前半句。"
#准备攻打樱花
PAM_xfxy_ycdd: "完美作战计划"
PAM_xfxy_ycdd_desc: "雪伊：陆军那边送来一张樱花登陆图，我看了好久，觉得他们挺会挑地方。\n晓枫：怎么说？\n雪伊：挑的全是好地方。港口宽敞，道路平整，连登陆以后怎么推进都画好了。就是不知道，樱花那边的人肯不肯配合。\n晓枫：他们大概不会专门出来迎接我们吧。\n雪伊：那可麻烦了。图上连庆祝胜利的地点都圈出来了，总不能到了以后再临时找地方吧？\n晓枫：我听说，运输船的安排还没定下来。\n雪伊：这我知道。陆军已经在挑登陆地点了，海军却还在问要送多少人。万一船不够，难道让先到的人在码头替后到的人占座吗？\n晓枫：他们倒考虑过分批登陆。\n雪伊：那第一批打完了，第二批还在海上看风景？\n晓枫：所以我把那张图退回去了。先把船队能运多少人和多少装备算清楚，再决定登陆规模。返航和后续补给也得算进去，不能只研究怎么抵达。\n雪伊：退得好。要不然等我们终于打下港口，才发现船全开回家了，那可真算得上一次漂亮的孤军深入。\n晓枫：你可以把这句话留给下一次作战会议。\n雪伊：不用了。我怕他们听完，真把返航写成撤退预案。"
#樱花战后
PAM_xfxy_zsjs: "钥匙交给谁比较好？"
PAM_xfxy_zsjs_desc: "雪伊：樱花那边的仓库清点完了，几个前线军官就来找我，说弟兄们打了这么久，总该拿点东西犒劳一下。我问他们想要什么，他们说还没想好，不过最好先把钥匙交给自己人保管。\n晓枫：东西都没想好要什么，就先惦记上钥匙了？仓库里还有当地商户寄存的货，得先把人家的东西还清楚，剩下的才能照规矩领用。\n雪伊：我也是这么说的。他们听完倒挺痛快，说既然要把账弄清楚，那就应该由军官亲自看着仓库，免得出了差错。\n晓枫：这个提议倒能理解，不过看仓库总得有人负责，不能出了问题以后，大家都说自己只是来看看的。\n雪伊：你还真说中了。刚才还争着要钥匙的人，一听说领走东西得在单子上签字，立刻开始谦让起来。有个军官说自己最近忙着整顿部队，另一个说自己不擅长算账，还有一个干脆表示，他可以负责监督前两个人。\n晓枫：那谁来监督负责监督的人？\n雪伊：你别说，他们还真讨论起来了。最后大家一致认为，这件事得交给一个公正、可靠、又不直接经手物资的人。\n晓枫：听上去像是个不错的人选，他们推举了谁？\n雪伊：仓库管理员。他们说他最熟悉仓库，肯定不会弄错。我提醒他们，人家本来就在管仓库，他们这趟过来究竟是来帮忙，还是来给人家颁奖的？\n晓枫：让原来的管理员继续管出入，同盟派人核对账目，谁领走东西就由谁签收。这样出了问题能找到负责的人，也不至于让一个管理员替所有人担责任。\n雪伊：我把这话转告给他们，他们总算填好了领用单。就是那位最先提议拿钥匙的军官，最后申请的东西特别有意思。\n晓枫：他领了什么？\n雪伊：一把仓库钥匙。他说拿回去研究一下，看看以后怎么提高物资管理效率。\n晓枫：仓库就在那儿，管理员也在那儿，他研究完了打算把钥匙用到什么地方？\n雪伊：我也是这么问的。他想了想，把申请单收回去了，说自己忽然觉得，还是研究怎么把手头的部队带好比较要紧。\n晓枫：那倒是终于想明白了一件正事。\n雪伊：可见这把钥匙挺有用的，至少帮他省下了一份研究经费。"
#迈向世界
PAM_xfxy_sjjs: "军号到底归谁管"
PAM_xfxy_sjjs_desc: "雪伊：驻外部队刚到新港口，当地人就来投诉，说我们的军号每天清晨准时响，连他们的公鸡都不敢叫了。\n晓枫：公鸡也有意见？\n雪伊：它主人意见更大。他说自己养了那么多年，头一回见它等军号响完才打鸣，还问我们能不能把起床号推迟一小时。\n晓枫：这倒提醒我了。部队的训练时间不能只按军营里的习惯来定，驻地周围还有当地居民的生活。让驻军指挥官和地方代表商量训练时段，紧急集合照常执行，日常操练尽量避开居民休息的时间。\n雪伊：已经谈好了。当地代表很满意，还特意问我们能不能把军号借去用几天。\n晓枫：他们要干什么？\n雪伊：港口工人想拿它当上工铃，省得每个工头天天喊。\n晓枫：军号可以借，使用时间得说清楚，别让工人误以为港口也进入了紧急状态。\n雪伊：我已经交代了。现在他们每天吹两次，工人准时上工，公鸡也恢复了自信。\n晓枫：看来我们终于和当地建立了良好的关系。\n雪伊：是啊。昨天那只公鸡还对着军号回敬了一声，附近居民说，这是它第一次参加国际合作。"

#小遥军事线
#亡灵威胁结束，进入重建阶段
PAM_xy_fy: "每个人都必须正确地犯错"
PAM_xy_fy_desc: "亡灵威胁结束后，春日小遥在重建区帮忙登记集市摊贩。她走到一个卖黑色方块的摊位前，盯着那些方块看了半天，终于忍不住问：“请问，这个是什么？能吃吗？”\n摊贩抬起头，瞥了一眼小遥，就望向了摊位上的牌子。牌子上写着“肥皂”，下面还甚至画了一只正在洗手的手。\n他用一种看见鱼爬上树的眼神望着小遥，拿起一块肥皂，在她面前郑重得洗起了手，随后把泡沫举到她眼前：“能。您要是愿意，吃完还可以漱漱口。”\n小遥这才看清牌子，脸一下红了。她本来想赶紧离开，目光却落在摊位旁边的一张集市登记表上。上面把肥皂归在了“食品及日用品”一栏，还是她前两天帮忙整理的分类。\n摊贩顺着她的目光看过去，脸上的表情顿时从看傻子变成了看见更大的傻子。他把登记表翻过来，指着那一栏问：“同志，所以说……您是打算让我洗手，还是打算让我吃饭？”\n小遥只好把表格带回去重改。她把食品和日用品分开登记，又在容易弄混的地方补上了清楚的说明。忙完以后，她特意绕开了那个摊位。\n第二天，摊贩远远看见她，立刻举起一块肥皂，大声问：“同志，今天这个能吃吗？”\n小遥捂住脸，加快了脚步。她终于明白，有些错误确实应该统一处理，尤其是自己犯下的那种。"
#开启南美战争
PAM_xy_nyjs: "谁替莉兰迪亚答应了"
PAM_xy_nyjs_desc: "南美战争刚开始，前线就送来一份当地武装的接洽请求。对方愿意停止抵抗，条件是白夜同盟承认他们在几座城镇的自治权，并保证战后不追究他们此前与敌对势力的往来。军方希望尽快接受谈判，免得继续作战牵连当地居民；随军的地方联络人员却提醒说，这些武装并不能代表所有城镇，更不能替那些曾被他们征用过粮食的居民作主。\n小遥被叫去整理谈判意见。她原以为只要把双方的条件写清楚就好，结果刚写完第一稿，就有人要求删掉“当地居民的意愿”，理由是目前还没有一份能够证明全体居民意见的正式文件。另一位军官随即指出，若非要等到所有居民都表态，谈判恐怕要拖到战争结束以后。\n小遥把笔放在纸上，认真地说：“那我们先让愿意停战的部队放下武器，再由当地代表商量自治安排。至于他们以前做过什么，不能因为今天来谈判就一笔勾销，也不能因为他们曾经站错队，就连谈判的机会都不给。”\n这番话总算让会议继续了下去。最终送往前线的指示允许军方与当地武装先谈停火和解除武装，涉及城镇自治与战后追责的条件则留待地方代表参与协商。小遥在文件末尾加了一行说明，提醒接洽人员别把某支武装的承诺当成整座城镇的意见。\n第二天，前线传回消息，对方同意派代表来谈。随信附上的代表名单里，有一位自称代表全城商户的人。地方联络员在旁边写了批注：此人经营的店铺目前只剩两家，而且其中一家已经关门好几个月了。"
#进入南美战后治理阶段
PAM_xy_tltx: "桥的两端居然都是自己人"
PAM_xy_tltx_desc: "统一后的南美铁路逐步恢复运输，小遥搭乘一列运送军需的火车前往了沿线驻地。列车在一座跨河铁桥前停了下来，司机说桥两头的守军都已经加入白夜军，可东岸只认原先东部部队的通行命令，西岸也坚持沿用自己的规矩。两边都承认对方是友军，唯独谁也不肯先让火车过去。\n小遥下车时，两个哨兵正隔着铁轨商量这件事。东岸的士兵认为自己守的是桥梁入口，西岸的士兵则认为自己负责的是桥梁出口，列车只要从中间经过，就必然有一段路不归任何一方负责。他们说得很认真，连司机都开始怀疑，自己是不是开进了某种新式的军事演习。\n小遥把两边的军官叫到一块，建议沿线交通改由统一的联络指挥负责，双方共同派人协助检查和护送军列。涉及当地治安的事务，仍由熟悉沿线情况的人员参与处理；遇到紧急军情时，各部队则必须服从统一调度。她还特意说明，以往部队的指挥关系可以逐步调整，但不能让一纸命令在不同驻地之间失去效力。\n商量结束后，火车终于驶上铁桥。两名哨兵分别站在桥头，目送列车通过。过了一会儿，东岸的士兵忽然朝同伴喊道：“这回总算知道桥归谁管了！”西岸的士兵回答：“归火车管！它要是再停下来，咱俩就得一起负责把它推过去。”"
#准备攻打樱花
PAM_xy_ydjs: "原来樱花在海的那一边啊"
PAM_xy_ydjs_desc: "小遥参加远征演练时，信心十足地在计划上签了字。海军负责护航，陆军负责登陆，运输部门负责把人和装备送到樱花。现在，每个部门都说自己准备妥当了。\n演练开始那天，护航舰先出发了，运输船却还在码头装货。小遥赶到港口，发现大家正忙着证明自己没耽误时间。\n“那登陆部队怎么办？”她问。\n“等运输船。”\n“运输船呢？”\n“等装货。”\n“货呢？”\n“已经准备好了。”\n小遥望着堆得整整齐齐的物资，忽然觉得这场远征离胜利最近的时候，大概就是所有东西还放在仓库里的时候。\n她赶紧联系海军，让舰艇在安全海域等待，又重新安排装货顺序。演练最终延期，她也得在报告上解释自己为什么提前签了字。\n报告交上去后，一位军官安慰她说，至少这次演练让大家积累了经验。\n小遥点点头：“是啊。现在我们终于知道，樱花在海的那一边。”"
#樱花战后
PAM_xy_zsjs: "他们走路为什么像小偷"
PAM_xy_zsjs_desc: "樱花战事结束后，春日小遥跟着同盟的巡逻队走了一趟街区。队伍全副武装，靴子踩得整整齐齐，刚经过一家店，老板就赶紧把门关上了。小遥很奇怪，明明是来维持治安的，怎么他们一出现，连做生意的人都跑得比谁都快。\n当地负责人告诉她，居民经历过太多军队上街的日子，听见整齐的脚步声就会紧张。小遥觉得该改改巡逻的方式，便叮嘱带队军官，平时巡逻按正常步伐走，路过商铺时说明来意，别弄得像马上要挨家挨户抓人。\n第二天，她再去查看，发现整支队伍正贴着墙根踮脚前进，连拐过街角都小心翼翼。小遥愣了半天，问他们在做什么。军官认真地回答：“您说不能让居民紧张，我们就尽量不发出声音。”\n小遥捂住了脸：“我让你们别像来抓人的，没让你们像来偷东西的呀！”\n这回她干脆请当地的巡查人员带路，让士兵熟悉街区，也把巡逻安排提前告知附近居民。遇到需要帮助的人，队伍就停下来处理；遇到确实有危险的情况，也照常按规定行动。军官终于明白，日常巡逻不需要演成一场夜间突袭。\n一周后，街区的治安记录有了好转。小遥高兴地翻开报告，发现最后还附着一条居民意见：“新来的巡逻队总算走得像正常人了。建议继续保持，尤其是晚上，别再贴着我家窗户练踮脚。”\n小遥把这条意见认真抄进了改进记录。她觉得这次总算办成了一件好事，只是下一回视察之前，还是得先问问军官们有没有把她的话理解成什么奇怪的训练科目。"

#迈向世界
PAM_xy_sjjs: "坦克需要停车位"
PAM_xy_sjjs_desc: "白夜同盟开始参与海外行动后，春日小遥去视察驻地附近的装甲部队。她本来以为第一次海外驻扎，大家最需要适应的是陌生的环境，结果到了营地才发现，最大的问题居然是停车。\n当地负责人拿着一份申请表找到她，说同盟的坦克开进城以后，占用了不少地方，居民不知道该把自己的车停在哪里。\n小遥愣了一下：“坦克也需要停车位吗？”\n负责人看着她，沉默了几秒：“理论上不用。但它确实比普通汽车大一点。”\n小遥去现场看了一眼，发现几辆坦克整齐地停在广场边上，车组成员还按照军队习惯把车辆排列得笔直。路过的居民倒没有害怕，反而有人认真研究起这些“新式公共设施”该怎么使用。\n有个老人甚至问驾驶员：“这个大家伙晚上停这里，应该不会收停车费吧？”\n驾驶员不知道该怎么回答，只能说：“它跟车不一样。”\n\n老人点点头：“我知道，就是看起来挺大的。”\n小遥觉得这个问题不能继续靠解释解决，于是让部队重新规划驻地位置，训练和巡逻车辆按需要行动，平时不要把公共区域当成自己的车库。同时也让当地居民了解哪些区域会有军事活动，避免双方互相误会。\n几天后，小遥再次来到驻地，发现坦克旁边多了一块牌子。\n她走近一看，上面写着：“此处停放装甲车辆，不提供过夜住宿。”\n小遥看了很久，问负责写牌子的士兵：“为什么要加最后一句？”\n士兵认真回答：“昨天有人来问，坦克里面能不能租给游客睡觉。”\n小遥沉默了一会儿，觉得海外合作的第一课，可能不是如何开坦克。\n而是先让大家知道，坦克确实不能当旅馆。"


####经济线####
#阿夏经济线
#开局
PAM_bxsb:"不许少报一袋"
PAM_bxsb_desc:"仓库那边又说账目对不上了。我本来不想亲自过去，毕竟这种事情总该有人负责，可听见他们说只是少了几袋粮，我还是把手里的文件放下了。\n上回也是几袋，后来查出来的数可没这么少。管仓库的人看见我就开始解释，我让他先别说了，带我去看粮袋。查完以后，我还得去找负责运输的人谈谈。晚饭前大概是回不来了，记得让厨房给我留一份，别又拿忙忘了来糊弄我了。"

PAM_jxbs:"军饷不是下个月的事"
PAM_jxbs_desc:"今天又有人把欠饷的名单送到了我这里。最前面那个人我认识，他上个月还问过我，能不能先把一部分钱寄回家。我当时答应得挺痛快，结果到现在也没办成。\n我不想再让他们拿着同一张条子跑来跑去了。财政那边说款项还在等批复，我就把名单留在了桌上，让他们给个确切的答复。该拖的事情已经拖够久了。我知道军费不是凭空变出来的，也没打算假装这件事很容易解决，但总得有人把话说清楚。"
#与野火开战
PAM_jjcl: "再给卡车一会时间"
PAM_jjcl_desc: "修理班的人一早就来找我，说棚子里那辆旧卡车实在是没有再修的必要了。发动机的问题还没弄好，轮轴还又出了毛病，再这么折腾下去，恐怕连仓库里剩下的零件都得搭进去。我过去看了一眼，车厢里还留着几条没来得及清洗的毯子，是上回送伤员回来时用的。\n我还是让他们再试一天。倒不是我有多舍不得这辆破车，实在是现在能开的车没剩几辆了，前线还天天催着要东西，总不能让人一直等在山路上吧。要是最后还是修不好，那就把能用的零件拆下来，留着给其他车用就行了。"

PAM_jjcl2: "修车不用跑那么远"
PAM_jjcl2_desc: "昨天下午，一辆运送物资的卡车又在山路上坏了。司机折腾到天黑也没修好，只能先把货卸下来，再找人分批运回营地。前线等了半天没等到物资，修理厂那边却还得派车来拖故障车，光这一趟就搭进去不少燃料和工夫。\n我去问了修理班，才知道这种小故障其实不算难修，麻烦在于车坏的地方离修理厂太远，拖回去的费用有时比零件还贵。可要把整套维修设备搬到运输线上也不现实，工人和工具都有限，总不能每条山路旁都盖间修理厂。\n我跟几个工头商量后，决定先把运输线边上的空工棚收拾出来，放些常用工具、轮胎和容易损耗的零件，再安排修理人员轮流值守。一般故障就在附近处理，碰上复杂的问题再送回主修理厂；每次维修也记下用了什么零件、花了多少时间，后面才知道该备多少货，免得零件堆了一屋子，急用的那颗偏偏没有。\n有人担心多设一个维修点会增加开支。我让他先把上个月的拖车费和延误损失算出来，等他算完，连反对的话都说得没那么响了。毕竟工棚也要花钱，可总比每次都把一辆坏车和一整批货，送去几十里外排队等着有人修要划算。"
#返回南美，开始亡灵战役
PAM_nljj: "我连药箱都找不到了"
PAM_nljj_desc: "港口那边真是乱得没法看。我原本只想去找一箱药品，结果先被一辆倒不出去的货车堵在了路上，绕了一圈，又差点踩进搬运工刚卸下来的木箱堆里。等终于找到负责登记的人，他翻了好久本子，却只告诉我药品大概还在仓库附近。\n我当时真想问他，什么叫“大概”。不过看他那副熬了一夜的样子，我最后还是把话咽回去了。现在每天都有船靠岸，粮食、弹药、医疗用品和各种零碎东西全往这里送，卸货的人手却一直没跟上。东西不是没有，只是挤在一块儿，谁也不知道下一批急用的物资究竟压在哪个角落。\n我让人先把仓库和临时货棚分开整理，药品、弹药这些急着送走的东西单独放，其他物资也得记清楚放在什么地方。光靠几个人拿着本子到处找肯定不行，还得把搬运和领用的顺序理清楚。唉，早知道今天会折腾成这样，我至少该先吃完早饭再过来。"

PAM_nljj2: "人家也要过日子的"
PAM_nljj2_desc: "谈粮食的事情比我想的要难办得多。我们带去的人拿着清单，开口就报了需要的数量，对方听完以后半天没说话，最后只问了一句，村里剩下的人要吃什么。\n这话让我没法接。我知道部队的粮食不能断，可人家也不是专门给我们种地的。那些农场已经荒了不少了，仓库里的存粮还得留着过冬呢，真要照着我们的清单拿走，接下来会是什么样，可是谁都猜得到的。我不想让士兵饿着肚子往前打，也不想刚从亡灵手里夺下来的地方，转眼就被我们自己弄得没人敢住。\n最后我们重新谈了数量，先买下对方愿意拿出来的一部分，价钱和交货时间也写清楚了。至于后面还能不能继续供应，得看他们的收成，也得看我们能不能把附近的道路守住了。临走时，我还问了问村里有没有人懂修农具。军队总不能只会把东西运走，真想在这里待下去，有些事情就得慢慢恢复起来。"
#亡灵威胁结束，进入重建阶段
PAM_ax_jt: "钱总得花在能住人的地方"
PAM_ax_jt_desc: "市政厅把一份租约推到我面前，想让部队继续租下那几栋离驻地很远的房子。我原本只是来谈续约，结果听着听着才发现，附近居民已经等着收回房子，住在里面的士兵也受够了每天来回赶路。合同倒写得清楚，提前退租得赔钱，继续租下去也得按月付账。两边都催着我签字，好像只要笔落下去，住不进房子的人就会自动消失。\n我后来想起驻地旁边那栋停用的海关仓库，便带着市政厅的人过去看了一趟。仓库里还存着地方上暂时用不着的货物，屋顶也有几处漏水，不过承重的木梁还算结实。商量下来，仓库里的一部分继续留给市政厅存货，剩下的地方交给本地工匠修整，工钱当场谈妥。那几栋远处的房子等租约到期便不再续租，部队也能慢慢腾出地方，让居民搬回自己的家。\n我原本以为修仓库总得折腾上好一阵，没想到工匠们干起活来比我们营里开会利索得多。雨落下来的时候，第一批士兵已经搬进了修好的房间。我从门口经过，听见屋里有人把湿透的旧床垫扔到院子里，随后便是一阵终于能睡个安稳觉的欢呼声。不过今晚，我不用再被人叫起来挪床了。"
#开启南美战争
PAM_ax_nyjj: "汽油不能自己长出来"
PAM_ax_nyjj_desc: "前线退回来的两辆卡车停在营地门口时，油箱已经快空了，车队却连原定路程的一半都没走完。司机带回来的消息很简单：地图上那条看起来平坦的道路已经被雨水冲坏，车辆只能绕着泥坑慢慢挪，有一辆车还在半路上拖坏了油桶。负责运输的人的确按计划领足了燃料，照原先的算法来看，问题应该出在司机身上。\n我没兴趣拿着一张地图跟开车的人争论他们究竟有没有走够里程。那天我跟车队走了一段，亲眼见到重车陷进泥里以后，后面的车辆全都得停下来等。等我们终于绕到河岸边，天都快黑了。再照着纸面上的距离发油，下一批车恐怕也得把一半燃料烧在路上。\n我把原来的分配办法改了，往后出车要把实际路况算进去，回程需要的油也得预先留下。走过的路如果临时变了，车队回来就把情况告诉后面的人，免得下一拨司机还对着旧地图犯愁。至于那条被画得笔直的近路，我干脆在地图上划了道粗线，旁边写了四个字：雨天别走。\n几天后，新一批运油车沿着河岸驶过营地。那张地图被司机钉在了车厢里，边角都已经让风吹得卷起来了，红色的叉号也显眼了许多。"
#进入南美战后治理阶段
PAM_ax_nyxx: "教室画在图纸的中央"
PAM_ax_nyxx_desc: "我拿到学校建设图纸时，发现设计的人把校长办公室画得特别气派，可教室却挤在了它的后面。南美不少地方的学校在战火里受了损，孩子们临时借用以前的房子上课，碰上雨季就得把课本抱在怀里躲水。我不是教育专家，可我也知道，房顶漏雨的时候，墙上挂着什么校训都没用。\n这份图纸得重新画。新学校先得有宽敞结实的教室，采光和通风也要适合当地气候；地方工匠可以参与施工，省得所有材料和工人都从远处调来，工程还没开始就先被运费拖住了。学校建起来以后，还得让本地愿意教书的人接受培训，教师也需要稳定的薪水。要不然房子修好了，孩子坐在里面，还是找不到能教他们读书的人。\n有些偏远村镇暂时凑不齐修建新校舍的条件，就先把安全的公共房屋整理出来，让孩子有地方上课，等正式校舍建成再搬过去。这些安排看着没什么惊天动地的地方，可要是每件事都等到战后所有问题解决了才开始，那恐怕直到有些孩子都长大了，也等不到属于他们的学校开门了。"
#准备攻打樱花
PAM_ax_hyjj: "前线说他们还没饿死"
PAM_ax_hyjj_desc: "远征部队抵达前线后，补给报告总算送回来了。负责后勤的军官把报告递给我时，神情相当轻松，因为按照出发前的计算，部队的口粮应该还能撑上一段时间。报告最后也确实写着，当前没有发生大规模断粮。\n我问他，既然情况这么好，为什么申请补充口粮的电报已经来了这么多封了。他说，前线指挥官可能是担心以后不够用，所以提前申请。我又问他，既然是提前申请，为什么电报里还特意提到有士兵已经开始拿干面包换烟。那名军官想了会，说这可能属于部队内部的自发调剂，不在正式补给统计的范围内。\n我差点以为自己听错了。照这个说法，只要大家还没饿到去啃运输箱，后勤账目就能继续保持令人满意的平衡。\n我让他重新核对前线的实际消耗。原先的计划把行军路程算得很准，却没算上道路损坏以后车辆要绕行，也没考虑到有些部队因为任务延长，根本没能按预定时间返回补给点。那些纸面上看起来充足的储备，到了不同的部队手里，情况完全不是一回事。\n从那以后，前线必须定期报告剩余物资和实际消耗，后方则根据这些情况安排后续运输，不能再把出发前那份计划当成一张永远不会过期的圣旨。紧急缺口也要单独处理，免得所有东西都按照原定批次慢慢排队，最后连急着救人的药品都得等到下一班船。\n那名军官听完以后，认真地问我，今后报告里是不是应该增加一栏，专门记录部队是否仍然能够正常吃饭。\n我说：“不用写得这么委婉。要是他们已经开始拿军靴炖汤了，你就直接告诉我。”\n他在笔记本上记了下来。我看了一眼，发现他真的写了这句话，只好让他把它划掉。"
#樱花战后
PAM_ax_zsjj: "咖啡不认军籍"
PAM_ax_zsjj_desc: "港口刚恢复营业，就有商人来找我，说寄存在仓库的两箱咖啡豆不见了。我问仓库的人，对方回答得很干脆：“没丢，已经领用了。”\n我又问是谁领的，他说军需处；军需处说是炊事班；炊事班说箱子放在军需仓库，没标商户名字，还以为是上头补的伙食。我赶到食堂时，最后一壶咖啡已经煮好了，几个值夜的老兵正夸今天的伙食总算像回事。\n这下倒好，商人的货没了，军营的伙食改善了，只有我得掏钱赔。以后临时存放的货不能因为进了仓库就算公家的，谁也不能拿着钥匙就顺手领用。我让人把赔偿和交接的事处理清楚，又特意嘱咐仓库：下回遇到来路不明的好东西，先问清楚是谁的，别等吃完了才想起找主人。\n负责仓库的老兵还挺不服气，说大家难得喝上这么好的咖啡。我告诉他：“那你把这句话写进赔偿单，看看人家肯不肯收。"
#迈向世界
PAM_ax_sjjj: "这回工钱按天算"
PAM_ax_sjjj_desc: "海外工地开工后，我发现当地工人和同盟派来的技术人员总在工钱上闹别扭。合同写的是按天结算，可工地遇上暴雨停工，当地工人觉得自己白跑一趟，财务人员却说没干活就不能算工钱。\n我不懂他们那些复杂的合同条款，只知道雨是从天上掉下来的，工人又不是自己把工地淹了。我把双方叫到临时办公室，让他们把实际情况说清楚。最后谈下来的办法是，正常施工按工时结算，因天气和工程安排造成的停工，则按事先约定的标准补偿；工人代表也能参与核对工时，账目贴在工地外面，谁觉得有问题都能提出来。\n财务人员起初担心这样会增加开支，我让他先把之前为争工钱耽误的工期算进去。他算完以后沉默了好一会儿，第二天主动把新表格印了出来。\n发第一笔工钱时，一个工人拿着单子问我：“以后下雨也有补偿，那我们是不是盼着下雨就行了？”\n我说：“你要真这么盼，最好先问问修路的人答不答应。路不通，咱们谁都拿不到下一份活儿。”\n他想了好久，才把钱收好，转身去检查排水沟了。看样子，至少这回大家都知道该盼什么。"

#晓枫雪伊经济线
#亡灵威胁结束，进入重建阶段
PAM_xfxy_jjhf: "工坊里少了一把锤子"
PAM_xfxy_jjhf_desc: "晓枫：这份工坊清单有一处对不上。战时借走的工具已经归还了，记录上却还写着由军方保管。\n雪伊：那就把记录改过来。总不能一把锤子已经回到工人手里，还要让人家先证明自己拿着的是锤子吧。\n晓枫：问题在于，有些工具确实已经归还，有些还留在部队里修理装备。我不能把它们全算成同一种情况。\n雪伊：那就分开处理。已经还回去的，就把旧记录销掉；还留在部队里用的，就先跟工坊说好，等手头的修理工作一结束便送回去。工坊等着开工，总不能让师傅拿着空手对着机器发愁。\n晓枫：我已经安排人逐间核对。地方工坊原有的机器和工具会优先归还，军方仍需使用的设备则由双方商定期限，必要时支付租用费用。\n雪伊：不错。那把锤子呢？\n晓枫：已经找到，在修理班的工具箱里。\n雪伊：很好。现在请你在清单上注明，它已经结束服役，可以光荣退伍了。\n晓枫：我不会这么写。\n雪伊：那你写得快一点，我还得去找下一把呢。"
#开启南美战争
PAM_xfxy_nyjj: "军令不能当工钱"
PAM_xfxy_nyjj_desc: "雪伊：晓枫，军方的新采购单贴出去以后，厂主们倒是来得挺齐，我还以为大家终于想通了，准备积极支援前线呢。\n晓枫：结果呢？\n雪伊：结果他们排着队来讨上个月的货款。还有个老板特别客气，说只要我们把旧账结了，新订单随时欢迎，连茶都给我倒好了，就是没让我碰那张采购单。\n晓枫：看来茶水已经招待到位了，剩下就等我们把钱带到位。\n雪伊：可不是嘛！采购处还嫌他们不够配合，说战时订单优先级最高，厂家应该先把东西做出来。我就问了一句，既然订单这么急，能不能先给人家付点原料钱？你猜对方怎么说？财政拨款还在走流程。\n晓枫：那工厂拿什么买原料？\n雪伊：靠信念吧。反正采购处说得挺有信心的，我差点以为他们已经发明了不用烧煤、工人也不用吃饭的新式工厂。\n晓枫：那可得赶紧登记专利，省得别的国家先拿去用了。不过眼下还是先把欠款结一部分，真正急需的订单分批签，给工厂留出买原料的钱，交一批就结一批。我们不能一面催人家赶工，一面让人家自己想办法垫钱，最后机器没转起来，倒先把做买卖的信用花光了。\n雪伊：我也是这么跟他们说的。那个老板听完挺高兴，还答应把我们欠款的数目继续挂在办公室里。\n晓枫：催款告示？\n雪伊：不，他说那是他厂里最稳定的宣传栏，别人家的业绩每个月都有起伏，只有我们同盟，连续几个月都能准时增加欠款。\n晓枫：那可不行。明天你陪我去把账谈清楚，先把能付的付掉，剩下的约好日期。总不能让人家一看见我们的公章，就下意识先去找账房先生哭穷。\n雪伊：行啊。不过我已经跟老板说好了，下次再贴采购公告，得把付款日期写在交货日期旁边。\n晓枫：这很合理。\n雪伊：他还特意补了一句，最好用大字写。上回交货日期印得那么大，他在厂门口等了一天，还以为自己看漏了付款那一行呢。"
#进入南美战后治理阶段
PAM_xfxy_nykf: "磨坊重新冒烟了"
PAM_xfxy_nykf_desc: "雪伊：你闻到了吗？这里终于有面粉的味道了。附近农户以前收了粮食，还得四处找人收购；磨坊停工以后，大家宁愿把粮食留在仓里，也不愿意冒险运去远处卖。\n晓枫：战事中断了当地原有的买卖关系，几家大收购商又掌握着通往城镇的运输渠道。农户即使恢复生产，也很难靠自己把粮食卖出去。\n雪伊：庄稼总算长出来了，结果倒在了卖粮食这一步。再这么下去，城里的人抱怨面包贵，乡下的人却抱怨粮食卖不掉，双方明明都不缺辛苦，偏偏都过不好日子。\n晓枫：恢复磨坊的生产只是开始。地方合作社可以把周边农户组织起来，统一对接收购和加工业务；政府也会公布基本粮食的参考收购价，避免小农户只能接受大商人临时开出的价格。磨坊重新运转后，城镇的日常供应也能逐渐恢复。\n雪伊：这就对了。我们总不能把每个农民都训练成商人，再把每个磨坊主都训练成银行家。\n晓枫：你倒替他们省下了不少工作。\n雪伊：我是在替所有人省时间。毕竟我还等着看看，等这地方恢复正常以后，那些商人还能找什么理由把一袋面粉卖出两袋的价钱。"

#准备攻打樱花
PAM_xfxy_hybd: "便宜的油，\n贵得要死的修理费"
PAM_xfxy_hybd_desc: "雪伊：晓枫，你上回不是说燃料采购省了一笔吗？船厂今天送来的维修单，怎么把省下来的钱都快吃回去了？\n晓枫：还没全吃回去呢，剩下的得等财务结账的时候再心疼。\n雪伊：你还有心思开玩笑呀？我看那几艘船都快被修成新船了。\n晓枫：我知道，这次确实是只顾着压采购价了。有几批燃料和老船的发动机不太合，机器一出毛病，维修费是一笔，停航耽误的运输又是一笔，算总账就不划算了。\n雪伊：供应商当时怎么说的来着？我记得他说这是通用型燃料。\n晓枫：通用型大概是说谁都可以买，不是说谁买了都能用。\n雪伊：啧，这话倒是让他说得挺省事，钱收了，剩下的事都归发动机管。\n晓枫：也不能全怪供应商，合同里的燃料规格确实写得不够细。采购的人按低价办事，船厂等着修机器，运输部门又催着出航，大家都有自己的道理，就是船一直没动。\n雪伊：这配合得还挺好，愣是没一个部门闲着，货倒是安安稳稳留在码头了。\n晓枫：可不是嘛，咱们花钱雇了一群人，把一桶便宜油变成了三份开支。以后得把燃料规格写清楚，常用零件提前备好，检修也要和船期一起安排。省钱当然是好事，可不能省到最后，连船都得跟着预算一起躺下。\n雪伊：行，那以后采购报价除了写每桶多少钱，再添一项，这油到底能让船跑多远。\n晓枫：好啊。起码下次开会，总算能聊聊跑了多少海里，不用再比谁家的维修单写得快了。"
#樱花战后
PAM_xfxy_zsjj: "这张钞票还没认输"
PAM_xfxy_zsjj_desc: "雪伊：晓枫，我今天买咖啡，店主收了同盟的钱，找零却给了我一张樱花的旧钞。他还说这张照样好用，讲得跟在替老朋友说话似的。\n晓枫：附近的人还习惯用旧钞，店里的货也按原来的价格卖。现在就把旧钞宣布作废，明天要买面包的人先得跟着着急。\n雪伊：那总不能让两种钱在街上互相竞争吧？以后买杯咖啡，还得先问问它今天支持哪一边？\n晓枫：先公布兑换办法和期限，让旧钞在过渡期内还能用于日常交易。店家知道该怎么收钱结账，居民才不会一觉醒来，发现钱包里的钱突然少了一半。\n雪伊：那我这张还能花？\n晓枫：可以，按公布的办法使用或者兑换。你最好先看清楚期限，别等到最后一天才想起来。\n雪伊：我还以为它要带着樱花的国籍，在我钱包里流亡一辈子呢。\n晓枫：你只是拿到一张找零，怎么已经替它安排好后半生了？雪伊：我这叫关心货币的去向。再说，那家店答应我下次打折，我总得留着这张钞票，看看明天还能便宜多少。\n晓枫：人家答应给你打折，跟你拿哪种钞票有什么关系？\n雪伊：当然有关系。万一明天旧钞兑换以后涨价了呢？\n晓枫：货币兑换又不会替咖啡涨价。\n雪伊：那可难说，店主今天还跟我说，最近什么都在变。\n晓枫：他是在提醒你咖啡要涨价吧？\n雪伊：所以我才得趁打折赶紧去。\n晓枫：绕了半天，你关心的还是那杯咖啡。\n雪伊：那不然呢？我总不能为了研究货币政策，每天去银行坐着吧。"
#迈向世界
PAM_xfxy_sjmy: "拖拉机到了，零件呢"
PAM_xfxy_sjmy_desc: "雪伊：晓枫，海外贸易代表团回来啦！我们送去的拖拉机很受欢迎，当地报纸还登了照片。\n晓枫：那很好。后续订单呢？\n雪伊：暂时没有。当地合作社说，机器确实好用，可坏了以后找不到合适的零件，最后只能停在田边当风景。\n晓枫：我们把机器卖过去，却没把维修办法和零件供应安排好。光有交货记录，不能算生意做成了。\n雪伊：代表团倒是带回了一份建议。他们希望我们派技术员过去教人维修，还愿意用本地生产的农产品支付一部分费用。\n晓枫：可以谈。技术培训由双方商定，零件供应也要有稳定合同，不能让人家每次坏一颗螺丝，都得等同盟的船开过海。\n雪伊：我已经把新方案送去讨论了。代表团长还说，这次总算知道当地人真正需要什么。\n晓枫：他以前以为他们需要什么？\n雪伊：他说，他们需要一台拖拉机。\n晓枫：这不是已经送去了吗？\n雪伊：所以他现在觉得，自己至少猜对了一半。"

##小遥经济线
#亡灵威胁结束，进入重建阶段
PAM_xy_sc: "会议上的鸡"
PAM_xy_sc_desc: "亡灵被赶走以后，莉兰迪亚终于重新开起了市政厅。公社的人忙着恢复食堂、修理街道，军团则还在按照战时习惯安排人手，双方倒没有因为这些事闹出什么大矛盾，直到巴罗把一只鸡带进了预算会议。\n小遥原以为他是来汇报清剿时发现的幸存者，结果巴罗把鸡往桌上一放，说军团最近的伙食改善有了新办法，申请拨一笔钱，给它修个像样的鸡棚。\n公社的会计抬起头：“我们连被炸掉的公共厨房都还没修好，你先给鸡申请住房？”\n巴罗回答得很自然：“厨房不会下蛋。”\n“可厨房能做饭。”\n“那你们倒是先把锅找回来啊。”\n小遥赶紧打断两人。她知道城里的锅确实丢了不少，可她实在没想到，战后重建的第一次预算协调，会变成厨房和鸡之间的辩论。\n会计坚持，公共食堂眼下最缺的是锅、柴火和能干活的人，鸡棚应该往后排。巴罗则认为，鸡能稳定提供食物，养好了比等外地运粮可靠得多。双方说的都有道理，偏偏谁也没注意到，那只鸡已经跳上桌子，把会计刚整理好的预算表踩出了一串爪印。\n小遥把纸救下来时，巴罗还挺高兴：“你看，它已经开始参与你们的生产了。”\n会计的脸色变了：“那它踩坏的纸算谁的成本？”\n“算它的启动资金吧。”巴罗说。\n小遥终于笑出了声。她让公社先把公共厨房恢复到能开火的程度，军团则可以用现有材料搭个简易鸡棚，先养着这只鸡，等食堂和供给恢复后再考虑扩大饲养。鸡蛋送去食堂，饲料和修棚的开销单独记账，别为了证明某种办法更先进，就把眼前真正缺的东西给耽误了。\n会议总算结束了。巴罗抱起鸡准备走，临出门时又问小遥：“那我能不能给它安排个勤务兵？每天有人负责喂食，顺便观察产蛋情况。”\n小遥说：“你要是能说服公社，让他们给鸡编制，我就承认你比亡灵更懂怎么制服活人。”\n巴罗认真考虑了一下，最后决定还是自己喂。毕竟他打过那么多仗，实在不想在战后第一份人事申请上，写出‘鸡的直属负责人’这么丢人的职务。"
#开启南美战争
PAM_xy_nyjj: "面包还没领到通行证"
PAM_xy_nyjj_desc: "南美的战争刚开始，市政厅就准备发布一份临时经营规定。负责起草文件的人认为，既然战时需要统一管理物资，商店最好先暂停营业，等拿到许可之后再重新开门。\n小遥读完草稿，发现这个办法执行得相当彻底。第二天一早，街上的商店全都关着门，面包店也不例外。巡逻的士兵想买早餐，只能站在门外等着市政厅决定面包能不能出售。\n小遥找到负责这件事的官员，建议让商店继续正常营业。军方需要采购时，可以和店主商量价格并留下凭据；确实出现哄抬物价的情况，再由地方人员出面处理。官员提醒她，取消临时许可可能会让管理变得不够严密。\n小遥回答：“现在连面包都卖不出去了，管理是很严密啊。街上也什么也买不到啦，谁也不用担心有人乱卖东西啦。”\n官员最终同意修改规定。午后，面包店重新开门，第一批刚出炉的面包很快就卖完了。负责起草许可文件的人也买到了自己的午餐，不过他仍然把那份尚未启用的表格带回了办公室，准备留待以后处理更适合申请许可的生意。"
#进入南美战后治理阶段
PAM_xy_zjdq: "庄稼等得了地契吗？"
PAM_xy_zjdq_desc: "小遥跟着地方经济委员会去了解一处荒废的庄园。庄园代理人带着以前的地契，坚持土地仍归原来的主人所有；附近的农户则说，他们早就在这片地上耕种，只是战乱烧毁了原来的凭据。代理人认为缺少文件就不能继续耕种，农户担心再争论下去，眼看要来的雨季又得白白错过。\n小遥听着双方争执，发现谁也不愿意放弃这片土地，却没人愿意承担土地荒废的损失。她觉得，产权需要查清，农时也得顾上。战后暂时无法理清归属的土地，但可以在地方议会协调下交由实际耕作者临时耕种，等原有权利得到核实，再依照法律处理后续安排。愿意恢复生产的小农户也应当获得种子和农具方面的信贷支持，以防土地终于能种了，手里却连下地的本钱都没有。\n复耕开始以后，庄园代理人仍然坚持要求在地图上保留原主人的名字。小遥答应了他，随后把地图递给农户，请他们也把实际耕种的地方标清楚。代理人对这件事颇有意见，小遥却觉得很公平：既然大家都说这片土地归自己管，至少该先弄清楚，究竟是谁一直在田里干活。"

#准备攻打樱花
PAM_xy_ydjj: "面包不能兼任砖头"
PAM_xy_ydjj_desc: "远征采购的面包送到验收点时，负责签收的军需官正拿着小刀费劲地锯面包。小遥本来只是过来问问采购开支，听了一会儿，才知道这批面包是专门为远征准备的。供应商保证它们耐放耐摔，价格还比其他商家的便宜不少。\n小遥拿起一块面包，在桌沿敲了一下，声音倒是挺清脆的。\n“这个真能吃吗？”\n“能，当然能！只是需要一点技巧。”军需官连忙解释，“供应商说，泡进热汤里就会软一些。”\n小遥又问：“那要是前线没有热汤呢？”\n军需官顿时没了声音。恰好路过的巴罗顺手拿了一块，垫在摇晃的桌腿底下，整张桌子立刻稳当了不少。他满意地点头：“这玩意儿不错，至少比仓库里那块烂木头结实。”\n“巴罗叔！”小遥差点把手里的面包捏出裂缝，“我们是花钱买口粮，不是来给军营采购建筑材料的！”\n这事追根究底，还真不能全怪供应商。原先的采购合同只要求面包能保存足够长的时间，价格越低越好，却没有明确规定硬到什么程度就不能拿来吃。负责采购的人觉得自己压低了开支，供应商也觉得自己严格按照合同办事，最后只有真正要吃这些东西的士兵没有发言的份。\n小遥只好让军需处重新制定验收办法。以后的采购不能只比较价格，面包得先抽样试吃，重量和保存情况也要符合约定；不合格的货物不能照常结算，供应商得负责更换。她还要求部队在大批采购前先试用一小批，免得纸面上的好买卖，到了前线全变成啃不动的麻烦。\n几天后，负责采购的军官拿来了一份新的合同，满脸认真地请小遥确认其中一条补充规定：面包不得用于垫桌腿、堵门缝及其他非食用用途。\n小遥盯着那行字，沉默了好一会儿。\n“……这条先删掉。咱们得让人家把面包做好，不是让全世界知道巴罗叔拿军粮修桌子。”"
#樱花战后
PAM_xy_mdtz: "菜单上的兔子不卖"
PAM_xy_mdtz_desc: "樱花战后，春日小遥发现附近的饭菜越来越贵，许多工人下班后只能随便买点东西填肚子。她支持当地居民合办食堂，大家一起采购食材、分担工作，饭钱照着实际开销来算，每笔收支都记在公开的账本上。\n食堂开张前，小遥主动帮忙画菜单。她觉得墙上贴着几张冰冷的价目表实在太严肃了，便在胡萝卜炖菜旁边画了一只圆圆的小兔子，还特意给它画了两颗很亮的眼睛。\n第二天，厨师跑来问她：“你昨天画的那只兔子，是不是也算在菜钱里了？一早就有孩子来问，炖菜里有没有兔肉。”\n小遥愣住了：“可我画的是兔子呀！”\n厨师说：“我也解释了，可孩子问我，既然菜单上有兔子，为什么端上来的只有胡萝卜。”\n小遥赶紧拿起粉笔，在旁边写上“图案仅供欣赏，菜里没有兔子”。她原本以为这下总算解释清楚了，结果记账的大婶拿着账本过来，说菜单用的粉笔也得记进食堂开支里。\n小遥低头看着账本，认真问：“那我画的兔子要不要算工钱？”\n大婶笑了：“你要是肯天天来画，我们就给你安排个活儿。不过今天这只兔子先欠着，等食堂赚了钱再说。”\n小遥把兔子又画得圆了一点，觉得自己好歹也算给食堂出了力。过了几天，她再来时，发现那张菜单旁多了一行字：“本店不供应兔肉，画兔子的同志也不负责抓兔子。”\n她盯着那行字看了半天，最后红着脸把自己的名字补在了菜单下面。毕竟食堂的账都公开了，总不能连这只兔子是谁画的都说不清楚。"
#迈向世界
PAM_xy_sjjj: "机器归大家，钱也归大家"
PAM_xy_sjjj_desc: "春日小遥来到一间准备改为工人合作社的机械作坊。原来的老板已经离开，当地工人愿意接手生产，但谈到以后怎么分配收入，几个人立刻争了起来。\n有人觉得所有人都该拿一样多，有人说自己负责最难的工序，理应多算一些，还有个年轻学徒小声问，自己连机器都还没学会操作，是不是只能分到最少的那份。\n小遥起初也觉得平均分配最简单，便把方案写在黑板上。工人看完后，负责维修的师傅指向了一台老机器：“这台设备几个月都没人修，真要恢复生产，恐怕得先有人干一星期的脏活。大家拿一样多，那这星期谁来？”\n小遥把原来的方案擦掉，和工人一起重新讨论：基本报酬先保障，额外劳动按公开规则计算，剩余收入再由全体成员决定如何用于改善设备、培训和共同福利。账目定期公开，规则也允许工人提出修改。\n作坊重新开工那天，小遥看见学徒正认真记下每台机器的维修情况，便夸他做事仔细。\n师傅在旁边说：“他现在可积极了，毕竟以后机器修得好不好，也关系到他自己那份收入。”\n小遥笑着点头。学徒却忽然抬头问：“那我能不能提议，先给记账的人买把舒服点的椅子？”\n小遥看了下自己站酸的腿，觉得这个提议倒是很有群众基础。"




####事件####
PAU_by_h1.t: "它……在门板后面？"#白夜溜达事件一阶段
PAU_by_h1.d: "灶台上的陶罐正咕嘟咕嘟冒着热气。\n我站在桌边切着土豆，随着刀刃碰到木砧板上，笃、笃、笃，节拍和平常一样整齐。\n可是……有些不对劲。\n笃、笃、笃。\n砧板上的声音似乎慢了一拍。切下去的明明是土豆，刀口渗出来的却像灰色的泥浆。\n屋角那个放杂物的地窖木盖，正传出轻微的沙沙声。\n像有人用指甲在它的背面，一下，一下地挠动着。\n“……是姐姐吗？”\n我张开嘴，听见自己的声音沙哑干涩。\n姐姐去年死在矿坑里了，大家都去送过葬了。可那扇木盖底下，确实传出了她平时哼唱的调子。那个声音混在了水汽里，顺着脚踝一层层缠绕了上来。\n屋里的光线越来越暗了，把影子拉得渐渐细长了起来。就连墙上的挂钟，也正在以惊人的速度疯狂倒转着。\n那道声音，那道声音在叫我的名字：\n“快把门打开……好冷……我快死了……救救我…………”\n我放下手里的菜刀，挪动步子走向了地窖。\n脑袋已经沉得无法思考了，我的心里却觉得拉开门是理所应当的事情。只要拉开门，就能见到姐姐了，就能一起去那个安静的地方睡大觉了。\n就在这时，窗台上方猛然传来哐当一声脆响。\n一个木碗随着响声被撞翻在地，在地上骨碌碌打着转。\n就在这时，一团雪白的影子从窗格缝隙里钻了进来，它身上带着泥土与草叶的气味，轻盈得落在了砧板旁边。\n那团白毛抖了抖身上的灰尘，毫不客气地叼起我刚切好的土豆块，嚼得吧唧作响。\n地窖的抓挠声骤然消失了。\n墙上的钟表也在正常地走着，陶罐里翻滚的不过是普通的菜汤，砧板上切开的也依旧是干净的土豆。\n哪来什么姐姐的声音，地窖木盖上分明积着特别厚特别厚的灰，上面挂锁也锁得完好如初。\n那团白毛吃完了土豆，歪着脑袋瞅了我好一阵，随后就从桌子上跳下去，顺着敞开的门缝一溜烟跑掉了。"
PAU_by_h1.a: "“刚才到底是怎么回事……？”"

PAU_by_h2.t: "这根线多出来了"#白夜溜达事件二阶段
PAU_by_h2.d: "后勤缝纫工厂里，十几台脚踏机正发出嗒嗒嗒的急促声响。\n我和玛莎并排坐着，负责缝补从前线送回来的大衣。屋子里充斥着陈年羊毛发霉的气味，以及洗不干净的干涸血腥味。\n我捏着手里的粗线穿过破损的布料。针尖扎下去的时候，指尖碰到的却是一种黏冷发软的触感。\n那件大衣胸口处被弹片撕开的破洞像是一张合不拢的嘴。随着风的吹拂，布料微微起伏，隐约像是在一下一下微弱地抽搐。\n玛莎一边踩着踏板，一边大声抱怨着供销的肥皂越来越难买。她的说话声听起来忽远忽近，就好像我已经掉到了水里一样。\n我的视线落在大衣内衬翻出来的布签上，上面工整地写着阵亡士兵的姓名与籍贯。\n不知为什么，那个陌生的名字在眼前渐渐扭曲，变成了去年矿难名单上姐姐的名字，后面还跟着密密麻麻、在战争里死去的那些工友的面孔。\n一股冰冷而麻木的念头顺着脊梁爬了上来：\n死了那么多人……凭什么坐在阳光下的，是我这种连机床都摇不动的笨蛋呢？\n也许我还活着本身就是没道理的。只要我死了，就再也不用闻这些刺鼻的血味，再也不用担惊受怕了。\n我手里的剪刀慢慢偏了方向，抵在了自己的手腕上，心里甚至涌起了一丝期待解脱的安宁。\n“喂！艾玛！你往哪儿剪呢？是昨晚没睡好吗？”\n听到玛莎的喊声，我手腕一抖，剪刀啪嗒一声掉在脚边的碎布堆里。\n工厂的机器声重新灌回了我的耳朵里，阳光重新照在了机油斑驳的地面上。\n那些游荡在街角的死气根本不需要破门而入，它们正顺着每一个幸存者的愧疚与虚弱，悄无声息地往他们的脑髓里钻着。"
PAU_by_h2.a: "“我没事……只是有点头晕而已。”"

PAU_by_h3.t: "今天的汤太咸了"#白夜溜达事件三阶段
PAU_by_h3.d: "“姐，你碗里的汤都快溢出来了。……喂，你碗里那块大的分我一口嘛。”\n坐在对面的弟弟把筷子伸过桌子中央，冷不丁被母亲用抹布顺手拍了一下手背。\n“自己碗里的都顾不过来，少打你姐的主意。”母亲在旁边的板凳上坐下来，顺手把一小碟腌萝卜推到我手边，“……玛莎下午特意跑来家里，说你剪布料的时候差点伤到手腕。要是工厂里活计太重，明天就在家多睡会儿，工会那边我去替你递请假条。”\n“妈……真的不用担心啦，昨夜做噩梦醒得太早了嘛。”\n我低头应着，舀起一勺汤送进嘴里。舌尖尝到很重的咸味之后，原本飘忽沉重的念头瞬间落回了肚子里。\n母亲一边擦着桌子，一边低声念叨：\n“隔壁的大婶今天也说，昨天深夜听到后院有熟人在敲门。修车铺那边也是，几个学徒晚上吓得不敢回去睡觉，大家都说最近怪怪的。”\n弟弟咽下嘴里的土豆，抢着比划道：\n“我今天也遇到怪事了！修车铺旁边有团长得像猫一样的白毛小家伙，不仅抢了我一口烤红薯，还冲着水沟呜呜叫呢！它叫完之后，那股怪风一下子就散掉了！”\n母亲伸手按住弟弟乱动的脑袋，把锅里留着的一块熟土豆夹进我碗里，随后伸手握住了我的手。\n母亲的手很粗糙，掌心里带着浓厚的温暖：\n“艾玛，别一个人胡思乱想了。只要我们一家人都还在一起，外面那些乱七八糟的怪事就找不上我们的门了。”"
PAU_by_h3.a: "“嗯。”"

PAU_by_h4.t: "跟我来吧"#白夜溜达事件四阶段
PAU_by_h4.d: "工棚熄灯的时候，外面的天已经全黑了。\n我踩着路边的碎石往回走，身旁不知何时多了一道熟悉的身影。她走得很慢，转过脸冲我轻柔地笑着。\n“艾玛今天又被工长扣工钱了吧？”姐姐并肩走在我身侧，身形轻柔得像晚风一样。\n“嗯……剪坏了几尺布。”我握紧了她牵住我的手。\n那只手掌冰凉刺骨，还沾着洗不掉的煤渣。\n我心里其实明白这是阴影里的怪东西布下的幻觉。可眼前的姐姐不仅长着生前的模样，甚至连眼角那颗小痣都一模一样。\n“白天妈妈握着你的手，说大家在一起就能挺过去，对不对？”姐姐拉着我的步子慢了下来，手指轻轻摸过我腕子上被剪刀磨出的血泡，“可家里的面粉不够三个人吃了呀。妈妈每顿都把土豆留给了你和弟弟；弟弟快十三岁了，还穿着你改短的裤子。”\n姐姐停下脚步，转头看向了我：\n“在这座满是王室的兵痞和公爵老爷的烂城里待着太苦了。只要你跟我走，家里就少了一张吃饭的嘴……妈妈不用每天夜里替你发愁，弟弟也能多喝两口稠粥了。艾玛，跟我走吧。跟姐姐走，他们就能好好活下去了。”\n小巷的灯火在不知不觉中暗了下去，脚下不知何时变成了城外废弃矿坑的碎石悬崖。\n眼前浮现出母亲偷偷倒掉的苦水，以及弟弟饿得发瘪的肚子。\n心底最后那一层防线无声地坍塌了。\n我的眼泪砸在了姐姐的枯骨手掌上，慢慢闭上了眼睛。"
PAU_by_h4.a: "“她是我的…好姐姐……”"

PAU_by_h5.t: "快拉她上去"#白夜溜达事件完成后由19事件触发#
PAU_by_h5.d: "那个年轻姑娘快要掉进塌陷的坑洞里时，我扑上前抓住了她的上衣领口。\n雪伊也跟着冲了过来，扣住姑娘的双肩用力往上拉着。可坑底下伸出来的灰手力气特别大，拼命拽着姑娘的脚踝往深处拖。\n悬在坑沿上的姑娘疼得哭出了声：\n“姐……好疼……脚要断了……”\n坑底下那具残破的身形顿住了。\n那双手骨原本还在用力撕扯，可在触碰到妹妹温暖的皮肤、听见那声带着哭腔的呼喊时，动作骤然僵在了原处。\n勒在妹妹脚踝上的枯骨陷在皮肉里，已经留下了青紫的淤痕。像是被滚烫的开水烫到了一样，那双手骨不自觉地缩了回去。\n地底传出了带着心痛的哭声：\n“……艾玛？”\n“是我不好……是姐姐把你吓坏了吧……”\n“我都已经死了……你还跟着我跑出来干嘛啊……”\n“做事还是这么毛手毛脚，胳膊细得跟竹竿一样……这么笨，掉到这种地方你该怎么活啊……”\n死去的姐姐伸出枯骨垫在妹妹脚底，像小时候托着妹妹翻院墙一样，用尽力气拼命往上顶了起来：\n“快拉住她！上面的长官！求你们快把我妹妹拉上去！！”\n“艾玛，回城里去……回去告诉妈妈……以后的汤别煮得那么咸了……告诉弟弟，快点长高，以后……替姐姐保护你……”\n“姐姐骗了你……底下太黑了，根本睡不着的……这里明明…冷得要死啊……”\n“听姐姐的话，永远……都不要再来看我了……好吗？”\n我们借着那股推力，一口气将姑娘拉回了平地。\n轰的一声，坑底下的土石彻底滑落，死去的姐姐随着崩塌的碎块坠入黑暗深处，再也看不见了。\n艾玛瘫坐在地上，紧抱着自己满是青紫指印的脚踝，终于撕心裂肺地放声大哭。"
PAU_by_h5.a: "“带她回去找家人吧。”"

PAU_by_wide.t: "信我的准管用"#白夜溜达事件最终阶段
PAU_by_wide.d: "后勤处的门被哐当一声推开。\n艾玛一瘸一拐地跨进门槛，她脚踝上缠着之前包扎的纱布，手里还提着一截草绳：\n“春日小姐！前天我问你地窖有怪声音该怎么办，你当时可是拍着胸脯向我保证过你的办法没问题的呢！”\n小遥正坐在桌边啃着苹果，嘴里嚼得鼓鼓的，连连点头：\n“对、对呀……照我说的办，亡灵肯定不敢靠近嘛……”\n“亡灵是不敢靠近了！”艾玛将那根油乎乎的草绳放在桌上，大声埋怨道，“我昨晚听你的在后门挂了一整串肉，白夜是来吃了，可它吃饱拍拍屁股走了，留下的肉味招来了整条街的十几条野狗！在院子里为了抢骨头打得头破血流，叫了整整一个晚上！”艾玛挽起袖子，气急败坏地数落着：\n“我弟和我妈端着扫帚在院子里追着狗打了大半夜，我们整条街都被吵得连睡觉的时间都没有啊！”\n小遥听得直眨眼，突然把胸膛一挺，理直气壮地抢过话茬：\n“等等！艾玛，你仔细想想看！这难道不是天大的好事吗？！”\n艾玛被噎得一愣：“……啊？”\n“你想想看嘛！”\n小遥越说越起劲：\n“你看，昨晚大家光顾着生野狗的气，是不是根本想不起来害怕地窖里的声音了？是不是？”\n“看吧，事情这不是解决得挺顺利的嘛！”\n一旁的阿夏面无表情地打断了她：\n“艾玛，别听她瞎编。我们一早就安排了巡逻队去清理街道了。还有小遥大统领你，虽然我不懂政治，但我可不觉得可以拿没验证过的办法让居民冒险。”小遥抿起了嘴：“知道了，知道了，我会把赔偿记在自己的本子上的。”\n艾玛望着一脸无辜的小遥，忍不住噗嗤一声笑了出来：\n“……亏我之前还以为春日小姐是个多沉稳的大人物呢，原来也是个爱胡来的姑娘呀。”\n“喂！艾玛！我很靠谱的好不好！”"
PAU_by_wide.a: "“以后可别再乱挂香肠了。”"
