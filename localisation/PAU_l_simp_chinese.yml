PAU_end_title_1:0 "§t随后，通往明日的电车开动了§!"

PAU_end_tip_1:0 "电车车厢里挤满了放工的人群，我和阿夏抓着吊环刚刚站稳，就看见靠窗的椅子上坐着一个熟悉的身影。\n那是个穿着很好看的校服的小姑娘，她正把书包规规矩矩抱在怀里，膝上还摊开着一本崭新的数学课本。\n§t“哎？小果——”§!\n我刚抬起手想打招呼，小姑娘猛地抬起头，十分认真地打断了我：\n§9“停！春日学姐，在公共场合请称呼我‘禾果’同学。我已经正式登记了学籍，小果子那是战时的临时代号，现在可是和平的新时代呢。”§!\n§t“啊？！禾果？！”§!我差点咬到自己的舌头，§t“听起来像什么点心铺子里卖的糯米团子一样嘛！”§!\n§9“才不是点心！”§!禾果小脸涨得通红，生气地合上了课本，§9“这是晓枫姐亲自告诉我的名字！‘禾’代表春天下种的庄稼，‘果’代表秋天丰收的果实！多有学问、多吉利呀！哪像小遥学姐你，名字听着就像天天琢磨着逃跑旷课的样子！”§!\n一旁的阿夏面无表情地接了一句：\n§Y“啊……禾果同学分析得很到位。喜欢逃课的大统领春日小遥。”§!\n§t“阿夏！你怎么也跟着外人一起挤兑我啊！”§!\n§Y“外人在哪呢？我怎么没看到？让我找找……”§!\n正吵吵嚷嚷着，白夜毛茸茸的脑袋突然从我的布包里探了出来，先用鼻子嗅了嗅，随后一口叼住了禾果书包侧兜里露出来的纸包。\n§9“白…白夜大人……不对，白夜！你怎么又来偷吃我的东西呀！”§!\n禾果慌忙把纸包护在胸前，随后却又抽出了两块烤红薯递了过来：\n§9“真是服了你们两个了……给，分你们两块，免得等会儿下了电车肚子饿得咕咕叫。”§!\n白夜叼着红薯缩回布包里吧唧起嘴来，我也跟着咬下了一大口，感受着嘴里甜滋滋的味道。\n§9“小遥学姐！红薯蹭到我作业本上了啦！”§!\n§t“哎呀，数学老师肯定不会计较这点小事的。”§!\n§9“绝对会计较的！绝对会扣平时成绩的！！”§!"

PAU_end_tip_lower_1:0 "感谢您陪伴军团与春日小遥走过这趟漫长的风浪！\n愿屏幕前的您，在属于自己的现实生活中，也能拥有推翻困境的勇气。"

PAU_end_close_button_1:0 "§t“明天见啦，禾果同学。”§!"

PAU_end_close_button_TT_1:0 "§L其实啊……是你们这群笨蛋，一直护着一个除了逃跑什么都不会的骗子，\n把她随口编出来的假话啊，一步步变成了能让所有人安稳回家的路呢。§!"


#设定
PAU_GATHERING_STORM_DESC: "我们没有祖国，战场就是我们的故乡。契约是我们的信条，黄金是我们的旗帜。长久以来，我们作为南美大陆上最精锐的职业武装，为出价最高者献上胜利。莉兰迪亚王室曾是我们的雇主，镇压那些所谓的“赤匪”，是我们冰冷任务清单上的一行。\n直到老军团长的出现。她从那些衣衫褴褛的革命者眼中，看到了比黄金更耀眼的东西。她开始质疑，我们这支最锋利的剑，是否应该永远只为腐朽的王权服务。她秘密地向我们中的一些人——包括她最器重的参谋晓枫——描绘了另一幅蓝图：一支为人民而战的、真正荣耀的军队。\n那一刻，许多人心中那早已被金钱和硝烟掩盖的火焰，被重新点燃了。我们以为，我们即将迎来新生。\n\n然后……§R老军团长……消失了。§!\n\n在随之而来的混乱与猜忌中，军团内部务实的声音压倒了一切。她们说，理想主义的狂热已经结束，我们必须回归“现实”。于是，我们将枪口，对准了昨天还与我们分享最后一根香烟的同志。在莉兰迪亚，在艾瑞波拉，我们亲手将那刚刚燃起的革命火焰，重新踩入血泊之中。\n如今，我们重归旧主麾下，但信任的链条一旦断裂，便再也无法复原。王室利用我们，也提防我们。而我们，则像一群背负着双重背叛的幽灵，在昔日战友的尸骸上执行着新的契约。鹰徽依旧闪亮，但许多人的眼神，却永远留在了那片被我们亲手制造的废墟里。我们是谁？是忠于契约的无情利刃，还是……一群迷失在理想与现实之间的……亡魂？"

