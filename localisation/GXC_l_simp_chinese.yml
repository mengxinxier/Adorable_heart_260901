  guangxi_news.01.desc:  "据悉，前国民党重要人物，一度担任一把手的汪兆铭已经离开了广东境内。\n\n自从1927年中国的戡乱战争结束，广东一直被国民党政府控制，一直宣传着“推翻帝制，建立共和”。\n\n汪兆铭的目的地--广西地方也发布了声明，陆荣婷和汪兆铭联合宣布广东政府为“背叛孙先生”的伪政权，而广西地方则是真正的国民革命继承人。"
