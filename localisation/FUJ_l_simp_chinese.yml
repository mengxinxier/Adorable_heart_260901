####人物####
  POLITICS_LONG_FUJ_DESC: "北方失利后，吴佩孚率直系残部南下，与福州的周荫人、南昌的陈光远合兵。他以东南剿匪总司令部维系闽赣联军，一面借定武军和云岿山稳住防线，一面筹划整军。张勋要借兵权恢复道统，仪玄则把目光投向旧都遗迹。眼下，玉帅还必须和两派共事。"
  FUJ_Zhang_Xun_leader_desc: "张勋以定武军为根基，借闽赣宗族与士绅的声望聚拢复辟派。旧朝覆亡七十余年，他仍主张尊王护教，盼从赣鄱重建他所信奉的秩序。"
  FUJ_Hoshimi_Miyabi_leader_desc: "星见雅曾是旧都仪仗铁卫统领。复辟、整军和秘仪都令闽赣百姓付出了代价，她决意与月城柳接过地方防务，凭垂天长刀守住武夷与海疆。"
  FUJ_Yixuan_leader_desc: "仪玄带云岿山弟子进入闽赣，以秘仪数次稳住前线。她借联军探寻失落的旧都遗迹，叶瞬光等人则竭力监察充能引发的反噬。"
  FUJ_Ye_Shunguang_political_advisor: "$FUJ_Ye_Shunguang$"
  FUJ_Ye_Shunguang_political_advisor_desc: "秘仪枢机，负责监测灵脉与经营密谍网。"
  FUJ_Yixuan_theorist: "$FUJ_Yixuan$"
  FUJ_Yixuan_theorist_desc: "秘仪宗师，负责统筹联军的秘仪运用。"
  FUJ_Hoshimi_Miyabi: "星见雅"
