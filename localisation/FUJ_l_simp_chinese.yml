####杂项####
  FUJ_his_page_01_title: "武夷残垒"
  FUJ_his_page_02_title: "三重正统"
  FUJ_his_page_03_title: "闽江前夜"
  FUJ_Country_History_Page_01: "太平天国覆清七十余年，八闽宗祠与赣鄱旧学尚在。北方战局失利后，吴佩孚率直系残部南下，与福州周荫人、南昌陈光远合兵。武夷山挡住了一时的兵锋，马尾船坞仍能修舰，闽江与鄱阳湖维系着两省往来。东南剿匪总司令部便在这片山海之间站稳脚跟。"
  FUJ_Country_History_Page_02: "吴佩孚倚仗北洋法统，希望以近代军制统合两省。张勋的定武军却借士绅与宗族招募兵员，立誓尊王护教。联军最危急时，仪玄带云岿山弟子以秘仪稳住防线，也让旧都天命成为第三股力量。星见雅和月城柳指挥铁卫，在各派争执中维持地方守备。"
  FUJ_Country_History_Page_03: "1936年，吴佩孚仍主持联军。赣北前线催要军费，定武军拒交兵权，云岿山则传来灵脉异动的报告。马尾的舰队与船坞尚可保住海上补给，沿岸百姓却越来越难承受各派征调。一旦南昌与福州的军令再起冲突，铁卫就得在继续维持联军和自行守土之间作出决定。"
  FUJ_GATHERING_STORM_DESC: "北方失利后，吴佩孚率直系残部退入闽赣，倚武夷山与马尾海防立足。张勋的定武军握有赣鄱士绅与宗族的支持，仪玄的云岿山秘仪也曾数次挽救联军于危局。\n\n1936年，福州的命令仍由吴佩孚签发，南昌却未必照办。赣北告急、灵脉异动，星见雅与月城柳带铁卫守着两道防线。闽赣还能维持多久的共治？"

####精神###
  FUJ_wuyi_mountain_bastion_idea: "武夷山海，残垒孤悬"
  FUJ_wuyi_mountain_bastion_idea_desc: "武夷山脉横亘八闽与赣鄱之间，闽江与鄱阳湖水网纵横。群山与大海替这座孤悬残垒挡住了不少狂澜，却也让跨区调兵与重工业扩张显得步履维艰。"
  FUJ_tripartite_legitimacy_friction_idea: "三重正统，联军同床"
  FUJ_tripartite_legitimacy_friction_idea_desc: "福州与南昌的军政大权名义上归于联军，实则北洋法统、复辟道统与旧都天命各怀心思。政令常在扯皮中延误，前线将领也难免在各派号令之间左右观望。"
  FUJ_confucian_clans_and_revival_zeal_idea: "卫道余烬与宗族盘根"
  FUJ_confucian_clans_and_revival_zeal_idea_desc: "自太平天国倾覆旧朝以来，闽赣宗族与士绅对“乱党”与激进变革深怀警惕。张勋的定武军与陈宝琛等儒宗在乡间根基深厚，既能凝聚顽强的守旧力量，也常令现代改制举步维艰。"
  FUJ_ancient_ritual_undercurrent_idea: "旧都秘仪，灵脉未定"
  FUJ_ancient_ritual_undercurrent_idea_desc: "来自旧都的秘仪力量为危局中的闽赣带来了超凡手段，却也让山川灵脉与基层人心暗生波澜。每一次仪式的起落，都在考验着执掌者的克制与承受极限。"
  FUJ_mawei_naval_legacy_idea: "马尾余晖，海防待兴"
  FUJ_mawei_naval_legacy_idea_desc: "马尾船政的船坞与闽系海军老将仍在守望东南海疆。尽管规模有限、重工尚待扩充，但只要政权稳固，这片海防底子便能成为闽赣抵御外敌与支撑近海补给的重要屏障。"
  FUJ_jade_marshal: "蓬莱玉帅"
  FUJ_jade_marshal_desc: "以近代军令统合联军，整顿指挥与战备。"
  FUJ_loyal_restorer: "忠义护国"
  FUJ_loyal_restorer_desc: "号召定武军与地方士绅，以守礼护教聚拢兵心。"
  FUJ_lord_of_rituals: "旧都秘主"
  FUJ_lord_of_rituals_desc: "借云岿山秘仪巩固军政中枢，同时征调资源供养坛场。"
  FUJ_chuitian_blade: "垂天铁卫"
  FUJ_chuitian_blade_desc: "以垂天铁卫稳固武夷山与东南海疆的防线。"
  FUJ_yunkui_vanguard: "虎威破阵"
  FUJ_yunkui_vanguard_desc: "率云岿山精锐穿越丘陵，在狭窄地形争取突破。"
  FUJ_iron_guard_marksman: "铁卫特勤"
  FUJ_iron_guard_marksman_desc: "组织铁卫侦察与特种作战，在前线搜集战场情报。"
  FUJ_ritual_theorist: "秘仪宗师"
  FUJ_ritual_theorist_desc: "将秘仪用在战前推演与阵地规划。"
  FUJ_ritual_intel_chief: "秘仪枢机"
  FUJ_ritual_intel_chief_desc: "主持灵脉监测、密谍网与反情报工作。"
  FUJ_mawei_shipbuilder: "船政总工"
  FUJ_mawei_shipbuilder_desc: "主持马尾的船坞建设、舰艇生产与舰船改装。"

