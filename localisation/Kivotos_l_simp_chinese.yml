  #Tooltip
  KVO_Reply_from_School_tt: "触发事件“§Y各学院的回复§!”"
  KVO.Openning.2.tt: "§Y重要信息：联邦搜查部，夏莱，超越联邦法律，可无限制招收基沃所有学院学生机构加入，在各学院自管区可无限制战斗。§!"
  KVO.Openning.9.tt: "§R为时已晚，但我们不能退缩。§!"
  KVO_Federal_Autonomy_Act_tt: "§L《基沃托斯联邦自治法》\n\n“基沃托斯联邦是由基沃托斯联邦学生会，以及各大小学院共同组成的联邦共同体，联邦包括如下联邦单位，即歌赫娜，圣三一，千年，山海经，百鬼夜行，阿拜多斯，瓦尔基里，红冬， SRT以及其他中小型学院……\n\n基沃托斯联邦实行自治制度，由各学院自愿联合，以学生和市民自治为基础，组建成为共同的学院自治共同体。学生是联邦的领导阶级，市民是基沃托斯联邦事务重要的参与者。\n联邦所有学院一律平等，学院的权力机构由各学院自行组织，各学院拥有管理自管区，自行组织学院活动，保留部分学院军事武装等权力，但不得与联邦活动冲突……\n\n§R联邦学生会与各学院应在协商一致的基础上，对联邦事务进行讨论与执行，联邦学生会主要职能为引导和协调基沃托斯联邦各学院的自治利益。”§!§!"
  #关系修正
  KVO_Break_Ice: "外交破冰"

  #国策
  KVO_focus_After_new_year: "新年后的学生会"
  KVO_focus_After_new_year_desc: "基沃托斯又在新年的焰火中度过了新的一年。值此重要时节，联邦学生会会长已经下达了一项行政令，召集联邦学生会各大小室长，部门职员，瓦尔基里警察学院，srt特殊学院学生会，以及凯撒集团企业代表来联邦学生会开会，商讨未来基沃托斯发展的详细规划。"
  KVO_focus_Union_Economic_Settlement: "联邦经济决算"
  KVO_focus_Union_Economic_Settlement_desc: "联邦在伟大战争之后获得了飞速的发展，与西欧大部分国家关系的正常化发展和与周边国家的友好关系给我国带来了巨大的财富。如今，会长打算对这一段时间的经济发展做一个详细的复盘，在审视过去发展的过程中规划未来的发展计划。"
  KVO_focus_Meeting_representatives: "会见企业代表"
  KVO_focus_Meeting_representatives_desc: "在伟大战争后，基沃托斯采取了一项有别于欧洲各国的发展策略，政府主动扶持企业广泛参与到社会经济的发展中，学生会给予其帮助和扶持，以此带动产业与社会发展，满足学生的诸多需要。但近年来他们也给联邦搞了不少乱子，会长决定联系一下凯撒集团总裁，敲打一下他们。"
  KVO_focus_Change_The_plan: "转变发展计划"
  KVO_focus_Change_The_plan_desc: "烈火烹油，鲜花着锦。虽然目前的市场情况仍是一片欣欣向荣，但就葵室长带来的情报和我们相关的情报来看，圣杯内部已经难以维持继续增长的趋势，可见的是，他们不日之间就将出现大的问题，而我们能做的，只有改变原有的继续投资计划，并试图在危机到来之间拯救我们的关键资产，减少可能带来的冲击"
  KVO_focus_Establish_FID: "建立联邦搜查部"
  KVO_focus_Establish_FID_desc: "随着经济的发展，联邦学生会原有的组织和人员组成需要与基沃托斯的发展进一步适应，联邦需要面对的突发状况也不断提升。会长已经决定，扩展联邦学生会的部分机构，以备不时之需。"
  KVO_focus_Send_to_every_School: "致函各学院"
  KVO_focus_Send_to_every_School_desc: "基沃托斯联邦是由各学院共同支持下组成的自治联邦，因此，联邦的权力来源来自于各大小学院的认同和支持。值此会议期间，会长将向各学院学生会长发出通讯，向各大小学生会发布新年后的第一次祝福，并对各大小学院的回函进行回复，指示未来发展。"
  KVO_focus_New_Diplomatic_policy: "新外交方向"
  KVO_focus_New_Diplomatic_policy_desc: "在伟大战争后，圣杯王国寄希望于我国对苏维埃联盟在南欧方向进行相对应的围堵，因此对我国进行了援助与承认，但时至今日，圣杯王国对我国的援助没有上升，要求却越来越多。会长已经决定，基沃托斯联邦将改善与苏维埃联盟的关系，走出关系正常化的第一步。"

  #事件
  KVO.Openning.1.t: "新年后第一次学生会会议"
  KVO.Openning.1.d: "今日的基沃托斯学生会异常的热闹，大大小小，不同光环的学生提着大包小包来到了联邦学生会所在的大会议室。会长已经在此等候多时了，她双手撑在桌上，旁边放着一叠公文，时不时的轻轻敲着桌子，似乎在打着一曲有节奏的交响乐。\n首先进来的是联邦调停室室长，岩柜步梦，她慌慌张张的小跑进会议室，看着还没有几人的会议室才松了一口气，会长微笑着向步梦摆了摆手，她才放下一口气，去寻找她的座位。\n然后是联邦防卫室室长，不知火花耶，她眯着小眼睛扫了一圈会议室，然后向会长打了个招呼，见会长对她致以礼貌的微笑，她也转头去寻找自己的座位。\n接下来是交通室室长，由良木桃可，她手里拿着一包明太子牌的薯片走进了会议室，刚想拿起一片薯片往嘴里扔，就看见会长的微笑突然消失了，她赶紧把薯片放回去，走向座位。\n……\n看着差不多会议室已经坐满了人，会长终于咳嗽一声，“好啦，大家差不多都到齐了吧，凛，通报一下本次会议的到场情况吧。”\n联邦学生会秘书长，七神凛站了起来，扶了下眼镜，然后翻开一本花名册，“是的会长，本次会议到会人数376人，缺席人数18人，其中有5人提前向联邦学生会请了病假。学生会各室领导无一人缺席，完毕。”\n会长招手让凛坐下，笑了笑，“看来大家的新年过得很愉快呢，那很好，新年的第一次联邦学生会集体会议正式开始，今年将会讨论并解决很多的问题，希望大家能在接下来的会议中积极听取工作要求，及时完成任务”"
  KVO.Openning.1.a: "第一项动议，提拔秘书长七神凛担任联邦行政官"

  KVO.Openning.2.t: "老师？"
  KVO.Openning.2.d: "“恭喜你，凛酱，你以后就是新任的联邦行政官了！”上午的会议结束之后，会长特意找到了凛，热情的向凛发出了祝贺，并给了她一个大大的拥抱。“不想说点什么吗？”\n凛叹了口气，“感谢您的提拔，会长，但联邦学生会内并不是所有人都支持我担任这一职务，我会尽力用成绩去说服她们的。”\n“不用担心吗，凛酱”，会长笑着说，“我跟你说啊，我很看好你的能力的，之前联邦好多的公文都是由你来接受处理的，要我说啊，要是有一天我不在了，凛酱你来接替我的职…”\n“请您慎言！”凛严肃的打断了会长的话，“如果您没有别的事情的话，那我就告辞了。”\n“等等啊凛酱，我这确实有一件重要的事情，想要咨询你的意见。现在各个学院都在向联邦申请援助，有些我作为会长不好下场介入，而且就上午防卫室的工作汇报来看，这几年基沃托斯的紧急事件发生率越来越高了，D.U.的防卫压力越来越高，连凯撒都不安生了，前几年fox小队才查了他们搞出来的大规模杀伤性武器，最近他们又在扩展军工。着实不让人怀疑啊。”\n“您的意思是？”\n“我打算成立一个联邦搜查部，这个部门可以随时调动联邦学生会甚至所有其他学院的学生，可以介入紧急事件，必要的时候甚至可以行使我的职权来解决联邦范围内的问题。”\n凛倒吸一口凉气，“这样的部门是否权责太大了，如果您真要创立这样一个部门的话，那您最好选择一位完全可靠的人来担任这一职务。”\n“不用担心，凛酱，人我已经选好了，如果大家没有意见的话我打算马上向他写信邀请他来联邦任职，我也准备好了相关的东西，相信他肯定能胜任，帮助到大家的”。\n在凛无奈的眼神中，会长又笑了笑。"
  KVO.Openning.2.a: "是的，我们要有一位老师了。"

  KVO.Openning.3.t: "危机前兆"
  KVO.Openning.3.d: "“所以，综合近几年的经济发展势头来看，今年基沃托斯还会保持一个高水平的发展态势，而且随着圣杯城市化进程的发展，我们的出口还能继续扩张，应该没错吧。”会长翻看着一张张的财务报表，然后抬起来，问道。\n“是的，会长”，一旁的扇喜葵点了点头，“从近期经济走势来看，学生会早期借助圣杯王国贷款快速发展经济的措施无疑是有效的，我们向他们借了款，他们才愿意开放给我们市场，让我们的产品能够打入西欧市场。要不然就拿游戏机产品来说，我们就难以和杜伦布和超次元联邦进行竞争，更不要说其他多余的产能消化了。”\n会长点了点头，把文件一张张收好，叠在一起，“葵，你说的这些是目前来看联邦好的一方面发展，照你的观点来看，你觉得基沃托斯经济目前有什么问题吗”。\n见会长说的直白，扇喜葵也就不再拘束。“实际上联邦和圣杯走的太近了，也并不是一件好事。”\n“怎么说？”\n“会长，我去圣杯的时候，在他们最豪华的伦敦城我出去一趟就碰上了4个给我推销让我贷款买房的，他们自己的百姓更是大多都进行了超前消费，他们的城市化发展飞快，但大多订单都是贷款购买甚至是超前预支的，如果他们的市场突然收缩，我们在欧洲打开的市场定然会遭殃，目前很多联邦的居民都在圣杯投资的企业里务工，我不敢想象他们要是失业了会怎么办…”\n“说下去。”\n“还有一件事，联邦现在的发展是很大程度依赖和圣杯以及它们的附属国借款进行的，我们目前的债务规模其实很危险了，如果我们保持当前发展势头应该是可以还上的，但如果出现意外，联邦很可能出现重大危机。”\n“所以问题就在于，我们必须在可能的危机发生之前，尽可能的减少外债的影响，只有尽可能缩小债务规模，才能尽可能的减少危机？"
  KVO.Openning.3.a: "是的，这也是联邦任何时候都必须注意的。"

  KVO.Openning.4.t: "万魔殿的回复"
  KVO.Openning.4.d: "致联邦学生会：\n  感谢联邦学生会对歌赫娜高等学院一如既往的支持，自歌赫娜回归联邦以来，一直蒙受关顾。在去年一整年的时间里，联邦一直支持本学院打击犯罪，反对分裂，并给予歌赫娜学院若干经济支持。万魔殿对联邦的支持深表感谢。\n  ……\n  然而，有关联邦对歌赫娜发展要求一事，本学院表示暂不可执行，本学院学生会万魔殿仍处于财政问题之中，学院装备更新、学院优秀社团奖励费用、后勤物资供给等仍受若干阻碍，大量学员反映教学资源不足，希望联邦进一步予以支持。\n  其中歌赫娜风纪委员会在其中造成了极坏的影响，此社团坐拥若干学员，以维护联邦治安为名，支取歌赫娜大量财政资金为己用，特别是其会长空琦日奈，多次藐视万魔殿以及联邦法令，拥兵自重，其行为极其恶劣，望联邦学生会早日撤销此组织学生组织资格。\n\n                                                                    万魔殿议长： 羽沼真琴"
  KVO.Openning.4.a: "联邦已了解歌赫娜学院的困难，但风纪委不可取消"

  KVO.Openning.5.t: "圣三一的回复"
  KVO.Openning.5.d: "致联邦学生会：\n  圣三一茶会对联邦学生会致以诚挚的祝福。由于在公在私过于繁忙，茶会对于未能前往联邦学生会致以新年问候表示十分遗憾，为表歉意，特已遣人送上圣三一上好的茶叶。望联邦予以谅解。\n  ……\n  有关联邦对本校和歌赫娜高等学院有关伊甸园条约一事，茶会经商讨后已经决定，同意进一步推进该条例，但望联邦派出一位合格代表予以监督和推进。本校内部分学员对于歌赫娜高等学院仍存在较大的反对意见，茶会必须充分考虑其意见并做出回复。\n\n                                                              茶会主持： 百合园圣娅  圣园未花  桐藤渚"
  KVO.Openning.5.a: "同意茶会意见，联邦学生会将在谈判开始后进行全力协助"

  KVO.Openning.6.t: "千年的回复"
  KVO.Openning.6.d: "致联邦学生会：\n  千年研讨会向联邦学生会问好。最近由于千年内多项资金项目审查出现问题，研讨会在全力对预算进行全面核查，暂无法出席联邦学生会相关会议。望联邦予以谅解。\n  去年以来，联邦学生会对千年科技学院予以多项支持，本校大量科研项目得以快速应用和投入市场，千年科技学院对联邦致以诚挚的感谢。\n  ……\n  下一届基沃托斯胱轮大会将在千年科技学院举办，千年科技学院希望联邦学生会能够及时联系其他学院组织代表队，并参与大会委员会协调工作一事，望联邦同意。 \n\n                                                            研讨会会计： 早濑优香 生盐诺亚 黑崎小雪"
  KVO.Openning.6.a: "同意研讨会请求，学生会将给予帮助"
  KVO.Openning.6.b: "下一个是，百鬼夜行联合学院。"

  KVO.Openning.7.t: "旧敌新友？"
  KVO.Openning.7.d: "这次秘密会见选在一家豪华饭店里。会面的时间已经是下午，散落的余晖透过饭店的百叶窗，落在会长的脸上，让人看不透她现在的表情。她仔细的回味着过去基沃托斯和圣杯王国之间的许多纠纷和冲突，并想着接下来会见苏联外交官的说词。\n在伟大战争结束后，基沃托斯联邦虽然战胜了中央同盟，打垮了分裂的歌赫娜势力，保卫了联邦的统一，但重建的代价太大了，以至于她不得不向圣杯和幻想乡再一次低头，申请了经济援助，圣杯王国对基沃托斯进行了贷款和一部分军火提供，使得基沃托斯保证了发展和安全需要，并确定了基沃托斯当时跟随圣杯王国发展的方针。\n可好景不长，会长还记得，当她拿到圣杯、幻想乡私下与意呆莉的秘密谈判报告，读到有关瓜分基沃托斯沿海地区领土的部分时候，她的内心是多么的不安与愤怒。她当时几乎是立刻召开了学生会议，在商讨后公开宣布了退出协约国。她当时赌圣杯为了围堵新生的苏维埃在巴尔干方向的渗透，不敢轻易放弃基沃托斯，事实证明她对了，圣杯发出了抱怨，却没有做什么，甚至还追加了一笔投资。\n十几年之后，时过境迁。圣杯对于基沃托斯所做的越来越少，要求的却越来越多，乌克兰的沙皇日薄西山，圣杯却不依不饶。基沃托斯现在已经不能继续依靠圣杯，她要为联邦多谋一条出路。她抬起头来，苏联大使已经在凛的指示下进了屋。\n“会长女士，我是苏维埃联盟联络官谢尔盖，您是有什么重要的事情需要当面说吗？”\n“是有一件事”，会长拿起桌上的茶水喝了一口，然后说出了一句重量级的话，“您觉得基沃托斯如果和苏维埃联盟建立外交关系，需要花费多长时间？”\n谢尔盖沉默片刻，“女士，如果您不是开玩笑的话，我需要立刻联系莫斯科，这件事并非我一人可以定夺，但我以个人名义感谢会长您的好意。”\n会长拿起桌子上的布丁，咬了一口。“圣杯王国的茶点确实好吃，但是吃多了也太浪费奶油和茶叶了，我们总该买点新甜点，您说是吗？”\n两人相顾片刻，谢尔盖突然笑了出来"
  KVO.Openning.7.a: "“对，我也很期待基沃托斯的桌子上，能看到祖国的奶油巧克力呢。”"

  KVO.Openning.8.t: "过界"
  KVO.Openning.8.d: "“您好，这里是凯撒集团，我是凯撒集团接线员，如果您想找我们集团的会长的话，请在特定时间预约…”\n会长眯起了眼，“叫你们会长接电话，少给我来这一套，这是私人联络电话！”\n“哎呀，对不起啊会长”。凯撒集团领袖的声音从话筒另一侧传来，“抱歉，今天去跟一个客户聊了聊生意上的问题，来的有些晚了，我的这位临时接线员没有什么冒犯您的想法，她要是惹您不乐意，我大可把她给开了，向您赔罪。”\n“我倒是没有什么意见，但我有些事情可要跟您聊聊了，前不久，我们接到学生举报，凯撒集团的军工厂在大规模扩建产能违规生产武器，您知道吗？”\n“会长阁下，凯撒集团是基沃托斯联邦的企业，我本人当然希望能够为基沃托斯的发展尽一份力量，因此，凯撒集团不希望遭受无辜的污蔑…”\n“但前一年SRT的fox小队就已经在你们的军工厂搜查出了重要物品，那么大一颗体积的弹头，凯撒在完全没有联邦许可的情况下就生产出来，你们做的太过分了。”\n“阁下，这件事不是已经了结了吗，这是凯撒集团旗下的军工组织的恶意生产，目的在于制造集团与联邦学生会之间的冲突，总集团并未参与此事，我们也已经重罚了负责人……”\n“那阿拜多斯呢？”会长的语气带上了些怒意，“你们在阿拜多斯的土地上收购了绝大多数的土地，然后也不搞开发工程，却在那修了军事基地？你们想要干什么？那里是不是有什么东西？”\n“不，阁下，我们可是和阿拜多斯学生会进行的合法交易，他们把土地卖给我们，来偿还那片沙化土地的债务，未曾开发的原因是凯撒要对治沙做出一个长期的规划，等到完成我们就动工……”\n“您如此推卸责任，我也送给您一次警告吧”会长突然笑了出来，“关于凯撒与奈芙蒂斯集团有关D.U.地下铁道修建一事，我们更看好奈芙蒂斯和海兰德的合作，联邦需要保障总体铁道的统一规制运行。\n“您不能这样！基沃托斯的发展现在离不开我们的资助，您这是破坏游戏规则……”\n“您好像搞错了什么，领袖”，会长加重了下语气，“请您记住，这里是基沃托斯，在这里，学生才是这片土地的真正主人，东方有句老话说得好，‘过犹不及’，如果您一而再再而三的觊觎不该你们拥有的东西，那么——”"
  KVO.Openning.8.a: "“我们会很高兴看到你们的覆灭的”"

  KVO.Openning.9.t: "刹车"
  KVO.Openning.9.d: "下午三点，D.U.，联邦学生会大楼内，扇喜葵发出了一阵由衷的悲鸣。\n“你是在跟我开玩笑吧，步梦？！”她转过头，难以置信的问身旁的岩柜步梦，后者也是一脸难以置信的看着面前的扇喜葵。\n“确实如此，葵部长。在会长的消息传达之后，我立刻开始派遣人手，根据您的指示，重新对联邦制定的发展计划进行分析，当那个经济学家听到我们对他制定的经济计划提出质疑的时候，他看起来就像一只被踩了尾巴的猫一样，激愤的对我们大吼大叫。但我们把所有的可疑数据拿出来之后，他就夹起尾巴，灰溜溜的逃出去了。”\n扇喜葵苦笑了一下。“也好，至少我们少了一个小麻烦。步梦，请你继续与凛部长联系，要修改的部分还有不少。所以谈谈接下来的工作吧，我们还得继续研究可能的经济失控的爆发点，你有没有什么发现？”\n步梦找出一个文件夹，从里面挑出几份文件，递给了扇喜葵。\n“财务室长，就目前分析来说，联邦之前制定的经济合作计划和订单，嗯，都存在着一定风险，特别是圣杯和幻想乡的大量订货方和企业，明显存在信誉不良情况，而且有报告称，很多即将达成的订单，金额的落实都推进缓慢。”\n扇喜葵轻拍了下额头，虽然她对潜在的问题已经有所心理准备，但眼前的问题已经让她开始有所恐惧。眼前的问题只是可见危机的一个缩影，它所爆发所带来的损失会将基沃托斯可见的繁荣摧毁殆尽，而她们所做的只是在这毁灭的浪潮爆发之前刚刚开始修建庇护所。"
  KVO.Openning.9.a: "“先回去休息吧，步梦，我们还有很多事要做。”"

  KVO.Openning.10.t: "突如其来的经济危机"
  KVO.Openning.10.d: "从圣杯王国传来了一个惊天噩耗：他们的股市已经于前几日崩盘，虚假的金融泡沫已经破碎。而基沃托斯也紧接着遭遇了重大的冲击：大量的资本正在试图逃窜，大量的对外货物出口订单被取消，一些原定在联邦进行投资的企业正打算撤出资本。联邦的经济发展势头被重重的打断。我们要同时面临债务危机和经济危机双重的压力了。"
  KVO.Openning.10.a: "偏偏这个时候来！"


#idea
  idea_KVO_Federal_Autonomy_Act: "基沃托斯联邦自治法"
  idea_KVO_Federal_Autonomy_Act_desc: ""
  idea_KVO_island_of_Mainland: "大陆上的孤岛"
  idea_KVO_island_of_Mainland_desc: "在伟大战争之中，基沃托斯联邦付出了惨痛的代价，大量生命因战争而消逝，学院因人员不足被废校，联邦积攒的财富也所剩无几，战争给联邦带来了极大的创伤。\n然而，联邦在战后却没有得到任何收获，甚至在圣杯王国和幻想乡共和国的暗中协议中，基沃托斯联邦还要割地给意呆莉，这种屈辱导致基沃托斯联邦内部形成了强大的反战和孤立势力，他们对于基沃托斯联邦在欧洲的一切可能的主动介入事务都保持强烈的反对态度，哪怕强如会长都难以动摇他们的势力。久而久之，基沃托斯联邦逐渐成为了一个欧洲大陆上的孤岛，它在欧洲所有的外交事务中都保持着不主动参与，不关注的态度。仿佛一切都与己无关。"
  idea_KVO_Renpou_Seitokai: "联邦学生会"
  idea_KVO_Renpou_Seitokai_desc: "基沃托斯联邦学生会是基沃托斯联邦的权力机构，由学生会长担任最高领袖，并控制着基沃托斯的核心：神圣之塔。联邦学生会包含总括室和行政委员会两部分，总括室下辖首席行政官，对学生会长负责。行政委员会下辖财务室、交通室、调停室、防卫室、体育室、人才资源室、保健室等20余个部门，他们共同组成了基沃托斯联邦学生会。行政委员会的成员由学生会长任命，成员拥有两项职责，一是承担基沃托斯联邦行政工作，二是因任何原因空缺时选举新学生会长。\n\n基沃托斯联邦学生会的干部是基沃托斯联邦最有影响力的人物，他们支撑起了联邦生活的方方面面，联邦学生会的持续运行离不开她们的鼎力相助。"
  idea_KVO_Saimuizonkata_keizai: "外债依赖型经济"
  idea_KVO_Saimuizonkata_keizai_desc: "第一次伟大战争后，基沃托斯联邦为保证自身的恢复，获取参与至圣杯王国为首的西方经济圈的发展资格，采取了一项颇受争议的措施：联邦向圣杯王国及其盟友进行举债，通过债务获取他国投资者的支持，并积累发展的资本，促进投资增长。通过这项举措，联邦成功从战后恢复过来，并在圣杯王国所引领的战后大发展中获得了巨大的利益。\n\n然而，随着时代的发展，这项举措也对联邦产生了不利的影响，随着债务累积的持续增多，联邦每年所需要偿还的债务不断上升，且由于债务累计的不断增多，政府债务对弥补私人投资，推进公共建设，助推经济发展等多方面的影响越来越弱，市场和外贸受财政压力逐步衰退。\n\n§R如果联邦经济不能保持增长态度，我们就要有大麻烦了。§!"
  idea_KVO_Lagging_indigenous_industries: "滞后的自主产业"
  idea_KVO_Lagging_indigenous_industries_desc: "对外界来说，基沃托斯联邦是与超次元联邦，杜伦布共和国并称的欧洲三大科技发展中心，与杜伦布强大的机械科技，超次元的电子游戏科技相比，基沃托斯联邦以强大的电子应用科技发展著称，各种千奇百怪的机器设备，高效的城际电力网络，发达的通信，构成了人们对于基沃托斯的第一印象。\n\n然而，对于基沃托斯联邦内部来说，面临的却是另一种情况，基沃托斯联邦对于自主产业的投资逐年下降，很多科技门类已经长期得不到该有的投资，联邦在金融等产业的投资已经压过了对实体产业的投资，产业不平衡问题已经逐步影响了基沃托斯方方面面的发展，联邦要想得到进一步发展，就必须改善这一现状，推动现代化发展。"
  idea_KVO_developed_firearms_industry: "发达的制枪业"
  idea_KVO_developed_firearms_industry_desc: "在基沃托斯的生活中，枪占据着一个非常重要的地位。在基沃托斯，如果你想买枪，那你随便走进一家便利店，你就能花便宜价格随便挑选一支枪，还能在货架上买到成堆的子弹。由于基沃托斯学生对于枪械的免疫力，枪不止被用来战争，甚至还渗入了学生们的学习，工作乃至生活。联邦只对重火力进行管制的现实也助推了枪产业的进一步发展。\n\n因此，基沃托斯的制枪产业极为发达，每年联邦以及各学院都会订制大量的武器弹药作为学生们的必备用具，甚至周边各国也会来基沃托斯订制武器。可以说，枪已经是基沃托斯生活中不可或缺的部分。"
  idea_KVO_Highland_Nephthys_relations: "海兰德——奈芙蒂斯联系"
  idea_KVO_Highland_Nephthys_relations_desc: "自伟大战争后，为抵御外来资本的影响，联邦开始主动与企业合作，进行重点行业的建设，特别在铁路方面，专精铁路运营的海兰德铁道学院和奈芙蒂斯集团在铁路行业的长期合作，让联邦在重点交通方面成功抵御了外来资本的影响。\n然而，随着联邦经济上的困境，联邦铁路方面的发展也随之受到影响，奈芙蒂斯集团在铁路技术升级和服务的投入上逐步丧失动力，海兰德内部与奈芙蒂斯集团也是勾心斗角，这些都影响了联邦铁路方面的需要和发展。 "
  idea_KVO_Uncontrolled_illegal_organisation: "失控的非法组织"
  idea_KVO_Uncontrolled_illegal_organisation_desc: "一直以来，由于基沃托斯学生持械的传统，暴走族、不良学生以及黑龟组等非法组织流窜在联邦以及各学院的学院区和市民区进行各种非法活动，且受伟大战争后各国出售装备的影响，这些非法组织大量收购装备武装自身。对此，联邦不得不授权瓦尔基里警察学院，对其进行镇压维稳。"
  idea_KVO_Kivotos_Union_student_army: "基沃托斯联邦学生军"
  idea_KVO_Kivotos_Union_student_army_desc: "基沃托斯联邦学生军一直是保卫基沃托斯的重要武装力量。然而近些年来，受经济发展和孤立思想的影响，联邦秉持去军事化中立政策，联邦学生军的军费逐年减少，SRT和瓦尔基里的军备更新也迟迟得不到落实，这使基沃托斯联邦将在面对一切潜在冲突时都面临不利地位。"
