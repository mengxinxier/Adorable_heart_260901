# 柏林
  Berlin: "柏林"
  Berlin_desc: "§L“没有勃兰登堡门，人们无法想象柏林是什么样。”\n四匹雄壮天马拉动车绳一致向前，于勃兰登堡门之上的胜利女神维多利亚驾驶两轮马车俯视着柏林与整个德意志。1788年普鲁士国王弗里德利希·威廉二世塑造了她的身躯，背生的双翼，手中权杖上展翅欲飞的戴冠鹰鹫。象征胜利的女神为王者加冕，1871年薇莲一世驾驶白马通过大理石门下向世界宣告统一德意志的新帝国自诸王国纷争的终结中崛起。§!"
  Adorable_heart_city_story_title_Berlin: "欧洲之心--柏林"
  Adorable_heart_city_story_desc_DVL_Berlin: "“没有勃兰登堡门，人们无法想象柏林是什么样。”\n四匹雄壮天马拉动车绳一致向前，于勃兰登堡门之上的胜利女神维多利亚驾驶两轮马车俯视着柏林与整个德意志。1788年普鲁士国王弗里德利希·威廉二世塑造了她的身躯，背生的双翼，手中权杖上展翅欲飞的戴冠鹰鹫。象征胜利的女神为王者加冕，1871年薇莲一世驾驶白马通过大理石门下向世界宣告统一德意志的新帝国自诸王国纷争的终结中崛起。\n战争是女神受敬仰的意义，在伟大战争中她见证了多少德意志的孩子带着热血奔向战场。她为每个人祝福，最终却只见得多少残肢断臂、家破人亡。十多年来，女神漠视德国与柏林的混乱，革命的“暴徒”、妥协的“民主派”、癫狂的“民族主义者”在舞台上轮番登场，争夺这座德意志的心脏之城。\n1933年的一切宛如是场怪诞科幻书翻拍的恶作剧。自坟墓中崛起的骷髅浪潮淹没柏林，吞噬勃兰登堡门，夺走德意志的骄傲和故土。女神的双眼被侵略者阖上，她不会哭泣，那双为百年风雨锈蚀的青绿铜制眼眸无法哭泣。\n\n§C但在那黑暗之中，她是否在为流浪的真正德意志之子祈祷......§!"
  Adorable_heart_city_story_desc_GER_Berlin_Free: "“没有勃兰登堡门，人们无法想象柏林是什么样。”\n四匹雄壮天马拉动车绳一致向前，于勃兰登堡门之上的胜利女神维多利亚驾驶两轮马车俯视着柏林与整个德意志。1788年普鲁士国王弗里德利希·威廉二世塑造了她的身躯，背生的双翼，手中权杖上展翅欲飞的戴冠鹰鹫。象征胜利的女神为王者加冕，1871年薇莲一世驾驶白马通过大理石门下向世界宣告统一德意志的新帝国自诸王国纷争的终结中崛起。\n战争是女神受敬仰的意义，在伟大战争中她见证了多少德意志的孩子带着热血奔向战场。她为每个人祝福，最终却只见得多少残肢断臂、家破人亡。十多年来，女神漠视德国与柏林的混乱，革命的“暴徒”、妥协的“民主派”、癫狂的“民族主义者”在舞台上轮番登场，争夺这座德意志的心脏之城。\n1933年的一切宛如是场怪诞科幻书翻拍的恶作剧。自坟墓中崛起的骷髅浪潮淹没柏林，吞噬勃兰登堡门，夺走德意志的骄傲和故土。女神的双眼被侵略者阖上，她不会哭泣，那双为百年风雨锈蚀的青绿铜制眼眸无法哭泣。\n德意志民族已向世界证明这片土地与他们永相凝结，但流离之苦却不能无端消减。所幸磨难只是锤炼了他们意志，而没有让他们走向疯狂。理智最终战胜野心家的鼓动。在欧罗巴的中心，柏林呼唤爱与自由，穿透纳粹的贯骨链锁。月桂花环落于女神权杖之上，战争没有胜利，此后唯有和平。\n\n§C于是女神不再哭泣，阳光沐浴身躯，青铜竟弥漫花香。§!"
  Adorable_heart_city_story_desc_GER_Berlin_Nazi: "“没有勃兰登堡门，人们无法想象柏林是什么样。”\n四匹雄壮天马拉动车绳一致向前，于勃兰登堡门之上的胜利女神维多利亚驾驶两轮马车俯视着柏林与整个德意志。1788年普鲁士国王弗里德利希·威廉二世塑造了她的身躯，背生的双翼，手中权杖上展翅欲飞的戴冠鹰鹫。象征胜利的女神为王者加冕，1871年薇莲一世驾驶白马通过大理石门下向世界宣告统一德意志的新帝国自诸王国纷争的终结中崛起。\n战争是女神受敬仰的意义，在伟大战争中她见证了多少德意志的孩子带着热血奔向战场。她为每个人祝福，最终却只见得多少残肢断臂、家破人亡。十多年来，女神漠视德国与柏林的混乱，革命的“暴徒”、妥协的“民主派”、癫狂的“民族主义者”在舞台上轮番登场，争夺这座德意志的心脏之城。\n1933年的一切宛如是场怪诞科幻书翻拍的恶作剧。自坟墓中崛起的骷髅浪潮淹没柏林，吞噬勃兰登堡门，夺走德意志的骄傲和故土。女神的双眼被侵略者阖上，她不会哭泣，那双为百年风雨锈蚀的青绿铜制眼眸无法哭泣。\n德意志民族已向世界证明这片土地与他们永相凝结，但流离之苦却不能无端消减。大主席台上演讲者口灿莲花，舞动舌尖挑动疯狂的复仇之潮。披上军国之甲的民族主义不容半分怯懦，疯狂裹挟之下就连女神也必须举起战争之杖，迷茫的为才获新生的孩子们指明死亡的方向。\n\n§0无法摆脱的铜铸身躯中，是放下高举之手为无名白骨阖目，母亲的灵魂。§!"
  Adorable_heart_city_story_desc_GER_Berlin: "“没有勃兰登堡门，人们无法想象柏林是什么样。”\n四匹雄壮天马拉动车绳一致向前，于勃兰登堡门之上的胜利女神维多利亚驾驶两轮马车俯视着柏林与整个德意志。1788年普鲁士国王弗里德利希·威廉二世塑造了她的身躯，背生的双翼，手中权杖上展翅欲飞的戴冠鹰鹫。象征胜利的女神为王者加冕，1871年薇莲一世驾驶白马通过大理石门下向世界宣告统一德意志的新帝国自诸王国纷争的终结中崛起。\n战争是女神受敬仰的意义，在伟大战争中她见证了多少德意志的孩子带着热血奔向战场。她为每个人祝福，最终却只见得多少残肢断臂、家破人亡。十多年来，女神漠视德国与柏林的混乱，革命的“暴徒”、妥协的“民主派”、癫狂的“民族主义者”在舞台上轮番登场，争夺这座德意志的心脏之城。\n1933年的一切宛如是场怪诞科幻书翻拍的恶作剧。自坟墓中崛起的骷髅浪潮淹没柏林，吞噬勃兰登堡门，夺走德意志的骄傲和故土。女神的双眼被侵略者阖上，她不会哭泣，那双为百年风雨锈蚀的青绿铜制眼眸无法哭泣。\n而如今，柏林已重回德意志的怀抱，新的故事也将开始......"
  Adorable_heart_city_story_desc_Berlin: "“没有勃兰登堡门，人们无法想象柏林是什么样。”\n四匹雄壮天马拉动车绳一致向前，于勃兰登堡门之上的胜利女神维多利亚驾驶两轮马车俯视着柏林与整个德意志。1788年普鲁士国王弗里德利希·威廉二世塑造了她的身躯，背生的双翼，手中权杖上展翅欲飞的戴冠鹰鹫。象征胜利的女神为王者加冕，1871年薇莲一世驾驶白马通过大理石门下向世界宣告统一德意志的新帝国自诸王国纷争的终结中崛起。\n战争是女神受敬仰的意义，在伟大战争中她见证了多少德意志的孩子带着热血奔向战场。她为每个人祝福，最终却只见得多少残肢断臂、家破人亡。十多年来，女神漠视德国与柏林的混乱，革命的“暴徒”、妥协的“民主派”、癫狂的“民族主义者”在舞台上轮番登场，争夺这座德意志的心脏之城。\n1933年的一切宛如是场怪诞科幻书翻拍的恶作剧。自坟墓中崛起的骷髅浪潮淹没柏林，吞噬勃兰登堡门，夺走德意志的骄傲和故土。女神的双眼被侵略者阖上，她不会哭泣，那双为百年风雨锈蚀的青绿铜制眼眸无法哭泣。\n异族肆意出入凯旋门正中通道，立柱之上的诸神为此羞颜垂首。又是新的侵略者了占领柏林，德意志民族的屈辱是否真的没有尽头？胜利女神保佑，如今只祈望他们善待落冠鹰鹫的子民。\n\n§O纵使骄傲不再，女神的身躯依旧荫蔽门下德意志哪怕方寸的土地。§!"
  Adorable_heart_city_story_title_Germania: "世界之都--日耳曼妮娅"
  Adorable_heart_city_story_desc_Germania: "世界之都——日耳曼妮娅，谁能不承认这座由阿道夫·莉莎元首亲自命名，帝国首席建筑师阿尔伯特·斯佩尔设计的城市是新古典主义的奇迹？\n当然有人怀疑，德意志是否有能力完成这个计划，这或许是他们吹嘘的妄想。他们曾这样说，但现在可以闭嘴了。\n光辉大街贯穿世界之都南北，街边建筑林立。大街中央凯旋门的高度足是人间之里凯旋门的两倍，其下是一个能容纳百万观众的阿道夫·莉莎广场。日耳曼妮娅最伟大的建筑莫过于“元首宫”——占地面积比传说中的尼禄王金殿至少大一倍。其竣工之日，随着一声令下，塔吊将悬挂在穹顶缺口处披着黑布、连接铁质鹰徽的天窗塔放下，十五名工人在外侧平台调整其位置。\n“咚......”巨大声响从承载处发出，震动自上而下沿着弧顶传自下方，变得沉闷厚重，这也许就是古人听到的神明之音。工人们拉下掀开黑布向外一抛，其在空中展开，在风的托举下缓缓滑翔下落，阴影如同黑鹰的羽翼掠过大地，以及人们的头顶。\n黑布最终落在地上。但穹顶的正中，黑鹰永远盘踞，鄙夷众生。\n德国人花费无数的人力财力物力修筑这座“世界之都”，只为向世界证明德国人已洗刷第一次“伟大战争”的耻辱与被侵略的苦楚、只为证明德意志民族不逊于任何的民族，不愿为任何民族的傀儡。这个国家的人民是这样团结有力，经济是这样富庶，技术是这样先进。与他们为敌将是极不明智的。\n“如果他们能创造这样一座城市，也就能毁灭无数城市。”\n\n§0让被吓破胆的人逃离吧！我的同胞们，德国和德国人民万岁！自由，万岁！§!"

# 纳萨力克
  Adorable_heart_city_story_title_Nasalik: "纳萨力克地下大坟墓"
  Adorable_heart_city_story_desc_Nasalik: "纳萨力克地下大坟墓的地面面积两百公尺见方。周围受到六公尺厚的墙壁保护，前方与后方各有一个入口。墓地的杂草修得很短，营造清爽的气氛。不过另一方面，墓地的大树枝叶茂密，处处都有树荫，制造出阴郁的感觉。还有许多白色石材的墓碑杂乱排列。修剪整齐的杂草与杂乱无章的墓碑相辅相成，营造强烈的落差感。\n大坟墓本是九大世界之一永夜世界赫尔海姆的挑战副本，在被安兹乌尔恭公会征服后被拓至地下十层，作为公会基地运营。\n时空错乱中，大坟墓整体都被传送到了柏林郊外。利用地形魔法，大坟墓的外露部分被隐藏了起来。对很多人来说，它只是一个传说。"
  Adorable_heart_city_story_title_New_German: "新德意志城"
  Adorable_heart_city_story_desc_New_German: "纳萨力克地下大坟墓的地面面积两百公尺见方。周围受到六公尺厚的墙壁保护，前方与后方各有一个入口。墓地的杂草修得很短，营造清爽的气氛。不过另一方面，墓地的大树枝叶茂密，处处都有树荫，制造出阴郁的感觉。还有许多白色石材的墓碑杂乱排列。修剪整齐的杂草与杂乱无章的墓碑相辅相成，营造强烈的落差感。\n大坟墓的地面部分依旧矗立在柏林郊外。现在，昔日的恐怖之窟沦为一个观光景点，纪念再次征服纳萨力克之人的胜利。"


# 崇宫澪-生命之树特区
  Adorable_heart_city_story_title_Cabala: "崇宫澪-生命之树特区"
  Adorable_heart_city_story_desc_Cabala: "诞生自独立战争硝烟中的精灵联邦傲然挺立于北美这广袤无垠的土地上，崇宫澪-卡巴拉生命树特区，则位于联邦的正中心。卡巴拉生命树，这棵孕育了精灵这一奇迹物种的神树，枝叶繁茂而又深植大地，给予了联邦无限的生机与活力；崇宫澪，不是别人，正是那位带领精灵奋起抵抗圣杯压迫，在战后又斡旋于各方势力之间，最终促使精灵团结一致，齐心协力建立精灵联邦的精灵独立英雄。\n特区内，卡巴拉生命树高耸入云，树冠如同保护伞般覆盖整个城市。树下，是建筑风格融合了精灵族的独特美学与工业时代的科技色彩，现代又不失优雅的繁华街区。树干则被挖空，辅以必要设施与点点装饰，成为了精灵联邦的国会所在地。街道两旁，随处可见的绿植与栖息于生命树上的鸟儿相映成趣。整个城市宛如一座巨大的花园，无处不充满了自然气息。\n而特区不仅是精灵联邦的政治中心，更是精灵族文化和精神的象征。在这自由的土地，勇者的家园，独立英雄崇宫澪的精神依旧激励着每一个精灵，启蒙思想的光辉仍然照耀着每一个角落。特区的每一片树叶都铭刻着历史的痕迹，一砖一瓦都诉说着精灵族对未来的希望。\n在这里，历史与未来水乳交融，传统和现代交相辉映。毫无疑问，崇宫澪-卡巴拉生命树特区以其独特的魅力和深厚的文化底蕴，成为了精灵联邦乃至整个世界的一颗璀璨明珠。\n\n§C“我发誓，精灵绝对不会再分开了，一切绝对不会再出错了。”§!\n\n§R本该如此。§!"

# 列宁格勒
  Leningrad: "列宁格勒"
  Leningrad_desc: "§L彼得大帝首先在涅瓦河三角洲的兔子岛上修建了彼得保罗要塞，驻重兵把守，以防御瑞典军队的进攻，后扩建为城；至此，波罗的海出海口从此纳入俄罗斯版图，彼得大帝在圣彼得堡创建了波罗的海舰队，使俄罗斯在历史上第一次拥有了自己的海军。\n1712年，俄罗斯将首都从莫斯科迁到圣彼得堡定都200多年，直到1914年，这一时期一直叫圣彼得堡。\n1914年第一次“伟大战争”爆发，当时俄罗斯同德国是敌对国，因为圣彼得堡的“堡”字是源自德语发音，当局决定把城市改名叫彼得格勒。\n1917年，随着阿芙乐尔号巡洋舰的一声炮响，列宁领导的十月革命在这里获得成功，从此开创了一个全新的苏联时代。\n1918年3月，首都从这里又迁回莫斯科。\n1934年列宁逝世后，为了纪念列宁，城市改名为列宁格勒，“格勒”在俄语中为城市的意思。§!"
  Adorable_heart_city_story_title_lngl_SOV: "世界革命的发源地-列宁格勒"
  Adorable_heart_city_story_title_lngl: "彼得格勒"
  Adorable_heart_city_story_desc_lngl: "“这座城是从沼泽里填出来的——用木桩、石头，和几十万人的命。”\n\n1703年，彼得大帝要在涅瓦河口的烂泥上建都。桩一根根打下去，海水一年倒灌一次，工人成批死在这片沼泽里。城市立起来了，先有的是码头、船厂和工人棚屋，宫殿是后来才盖的。从一开始，这里就是劳动者的城。到十九世纪末，涅瓦河右岸全是厂房：普梯洛夫、波罗的海船厂、涅瓦纺织。烟囱比教堂的尖顶多，工人住在地下室和通铺，一天干十四个小时。\n\n1895年，一个年轻人在维堡区的工人小组里给大家讲《资本论》；1905年1月9日，上万工人举着圣像和沙皇画像走向冬宫，换来的是排枪。这一天的血，比后来任何一份宣言都更能解释十月。1917年2月，普梯洛夫厂的工人罢工，全城跟上，而沙皇的军队不肯开枪了。工人和士兵代表苏维埃在塔夫利达宫成立。十一月七日晚九点四十五分，阿芙乐尔号在涅瓦河上开炮——那是信号；赤卫队从桥头冲向冬宫，走在前面的不是军官，是穿工装的工人。\n\n今天的列宁格勒有二百八十万人，基洛夫厂的烟囱从早到晚在吐，船台上躺着没装完的舰体；涅瓦大街的电车一班接一班。六月白夜，凌晨两点天还是灰的，河堤上坐着不肯回去睡的年轻人。斯莫尔尼宫的长桌还在，每个来访的共产党人都要去摸一下门框。\n\n§O别的城市纪念革命，这座城是革命留下来的那部分本身。§!"

# 莫斯科
  Moscow: "莫斯科"
  Moscow_desc: "§L莫斯科§!"
  Adorable_heart_city_story_title_Moscow_SOV: "国际无产阶级革命的灯塔-莫斯科"
  Adorable_heart_city_story_title_Moscow: "四十个四十教堂之城-莫斯科"
  Adorable_heart_city_story_desc_Moscow: "“莫斯科不是一座城，是一份职务。”\n\n克里姆林宫的红墙立在莫斯科河左岸，比这座城本身更固执。它见过蒙古人的马蹄、拿破仑的火、白军的炮，也见过来“进京赶考”的赤色少女们。1918年3月，政府从彼得格勒搬进这座要塞，莫斯科从此不只是俄罗斯的心脏，它成了另一种东西：一个要用全世界的尺度来衡量的首都。穿过斯帕斯克塔楼的门洞，砖地被鞋跟磨得发亮。院子里停着黑色轿车，人民委员会的人抱着文件夹在走廊里小跑；军械库旁那门从未开过火的沙皇炮，炮口正对着党机关的车道。第一个五年计划把乌拉尔的铁、顿巴斯的煤变成了莫斯科宫图纸上的厂房，第二个五年计划又把这些厂房变成了街道尽头黑压压的烟囱。\n\n1935年5月，第一列地铁从索科利尼基钻进地下，红白相间的大理石站台被电灯照得像舞厅。救世主大教堂的位置早已清空，等着一座四百一十五米高的苏维埃宫殿，殿顶立一尊七十五米高的列宁像；图纸画了五年，地基还在泥里。列宁已经不在了。画像换了，底下的人照样排队买面包。队伍里有俄罗斯人，也有兽人、舰娘、高加索来的亚人：她们领同一种配给票，用一种语言骂同一个售货员。克里姆林宫的钟声压过电车铃，压过河面上的风。\n\n§O这座城市见过太多人从它身上走过去，它记得每一个，也一个都不打算饶过。§!"

# 木之本格勒
  Kinomotograd: "木之本格勒"
  Kinomotograd_desc: "§L木之本格勒§!"
  Adorable_heart_city_story_title_clj_SOV: "红色伏尔加-木之本格勒"
  Adorable_heart_city_story_title_clj: "察里津"
  Adorable_heart_city_story_desc_clj: "“这座城市第一次被叫作‘红色’，不是因为旗子，是因为守城的全是工人。”\n\n1589年，沙皇在察里察河口垒起木要塞。要塞没几年就朽了，真正把城撑起来的是渡口：两条水路在这里交汇，一条往莫斯科运盐、鱼和木材，一条往阿斯特拉罕拖巴库的石油。伏尔加河上的纤夫是这座城市最早的无产者。冬天河面封冻四个月，他们凿冰、修船、在冰上拉纤；夏天一天卸两百袋盐，工钱按袋算，一袋两个戈比。工人区沿着河岸摊开，一条街十二户人家共用一个水龙头，孩子在货场里长大，认得每一种船。\n\n1905年，察里津的工人罢工，电车停驶，面粉厂停工。1917年，工人和士兵代表苏维埃在这座城里成立。1918年，白军从顿河压过来，工人自己编成了团，在渡口和街垒上守了半年，城没丢,全俄中央执行委员会给了这座城市一面红旗，从那时起，人们叫它“红色伏尔加”。1930年，拖拉机厂在城北动工,上万名工人从农村来，住土窑、睡工棚，冬天在零下二十度里浇混凝土。厂门口的工人俱乐部同时开班，教认字、教算术、教开机床。驳船照样上来，粮食照样往下走，码头上的号子换成了喇叭里的进行曲。名字是新的,全苏联找不到第二座以活人命名的大城市，而这个人就生在这座城里。老码头工人私下还是叫它察里津，而年轻人已经不会念那三个字。\n\n§O城是工人一袋一袋扛出来的,哪天名字换了，扛砖石的还是他们。§!"

#摩尔曼斯克
  Adorable_heart_city_story_title_memsk_SOV: "北极圈的不冻港-摩尔曼斯克"
  Adorable_heart_city_story_title_memsk: "摩尔曼斯克"
  Adorable_heart_city_story_desc_memsk: "摩尔曼斯克没有纪念碑。城里最老的东西是一台吊车。\n\n1916年铁路通车，港口建城，名字里带着沙皇的姓：罗曼诺夫-纳-摩尔曼斯克。那台吊车是随第一批码头一起从圣杯运来的，铸铁的底盘，铆接的臂，起重量十五吨。通车第一年，它卸的是面粉、煤和军需；第二年冬天，它卸的是圣杯干涉军的弹药——1918年，干涉军和白军开进科拉湾，港口被占了两年，吊车没停过一天，只是换了个主人。1920年红军收复这座城，吊车归了港务局。那年冬天它第一次卸自己的货：鱼、木材、从南方运上来的粮食。\n\n1930年，罐头厂、修船厂一座接一座立起来，码头上多了两台新吊车，国产的，起重量二十五吨。老的那台退到二号泊位，专门卸鱼，理由是它认得出渔船的舱口。1933年，北方舰队成立，主基地设在科拉湾里的波利亚尔内。从那天起，这座城的码头分成两半：一半卸鱼和木材，一半卸军舰用的煤和炮弹。\n\n摩尔曼斯克有十几万人，是苏维埃唯一一个全年不冻的北冰洋港口。冬天有四十天见不到太阳，极光在头顶上晃，零下三十度，火车每天从列宁格勒开来。港口俱乐部墙上挂着历年突击班组的名字，最上面那一栏还是 1931 年的，写着“二号泊位，全班”。\n\n§O这台吊车记不住人的名字，只记得吨位；这座城市的历史，恰好也是按吨位算的。§!"
  
#伊尔库茨克
  Adorable_heart_city_story_title_yekck_SOV: "西伯利亚东部的红色首府-伊尔库茨克"
  Adorable_heart_city_story_title_yekck: "伊尔库茨克"
  Adorable_heart_city_story_desc_yekck: "“贝加尔湖的水从城边流过去，铁路和商队都必须在这里停一停。”\n\n1661年，哥萨克的队伍在安加拉河右岸筑起木要塞，向周围收皮毛的税；1686 年设市。城靠着三样东西活着：恰克图运过来的中国茶、西伯利亚的皮毛、勒拿河的金子，商队从贝加尔湖上过去，冬天走冰面，夏天走船。1826年以后，十二月党人一批批被流放到这里，随他们来的是书、琴和第一批不归官办的学校；此后半个世纪，伊尔库茨克是西伯利亚流放地的中心，也是革命思想在东部的第一个落脚点。\n\n1898年，西伯利亚大铁路通到这里，环贝加尔湖的一段还没有修完，列车靠破冰船和湖岸便道接驳；铁路一通，伊尔库茨克从商埠变成东西伯利亚的货栈与中转站。1918年，白军与外国干涉军控制了这条铁路，鄂木斯克的反革命政权把这里当作东线后方；1920年1月，红军攻入城中，白军政权的头目随后在城里被处决。1920年设东西伯利亚边疆区，伊尔库茨克为首府。\n\n第一个五年计划给这座城添了重工业：城郊立起重型机械厂，航空厂的机身车间盖在铁路支线旁边，木材与云母加工沿安加拉河排开；工人新村贴着厂墙建，学校、诊所、俱乐部一并配套。几场大火之后，老木屋区逐片让给石砌的公共建筑，街道取直，铺上路面与电车轨道；贝加尔湖边的渔村照旧打鱼，安加拉河上的码头一年比一年忙。1936年的伊尔库茨克有二十五万人，是西伯利亚东部的行政、工业与文化中心。\n\n§O这片地方流过放的政治犯，比运过去的茶叶更值钱；这座城的下一代会记住的是他们的名字，不是商队的。§!"

#阿尔汉格尔斯克
  Adorable_heart_city_story_title_aehgesk_SOV: "北方的灯塔-阿尔汉格尔斯克"
  Adorable_heart_city_story_title_aehgesk: "阿尔汉格尔斯克"
  Adorable_heart_city_story_desc_aehgesk: "“白海一年封冻六个月，这座港口只能靠破冰船和铁路活着。”\n\n1584年，伊万雷帝的官吏在北德维纳河口圈出一块地，建起木寨与码头，那是俄国唯一通向西方的出海口：英国的船从白海进来，皮毛、亚麻、松脂从这里的栈桥装走。1693年，彼得大帝在索洛姆巴拉岛上设造船厂，俄国的第一支商船队和第一批海图从这里下水；彼得堡建成之后，生意被新都抢走，阿尔汉格尔斯克退回木材与鱼，锯木厂沿河一字排开，冬天砍伐、春夏流送，运出去的是整个北方的原木。\n\n1898年，莫斯科来的铁路通到码头，木材出口翻了几番。1918年8月，外国干涉军的运输舰开进北德维纳河口，登陆的部队扶持白军政权，港口被占了两年，木材换成军需，码头工人被赶下栈桥；1920年2月，红军收复这座城，码头重新交还给港务局。1929年设北方边疆区，阿尔汉格尔斯克成为整个北方的行政中心。\n\n第一个五年计划把木料接进了计划：锯木厂扩产，纸浆与造纸厂在下游建起，索洛姆巴拉的船厂修渔船、修破冰船，北海航线的补给与船员换班集中在这里，冰情报告一年比一年厚。城东的工人新村成排盖起，学校、医院、俱乐部随之落成；冬天极夜，街上只剩雪橇和马灯，夏天白夜，码头整夜不歇。1936年的阿尔汉格尔斯克有二十五万人，是苏联北方的最大港口与木材工业中心。\n\n§O码头最后归了把它开动的人。§!"

# 北京
  BeiJing: "北京"
  BeiJing_desc: "§L前不见古人，\n后不见来者。\n念天地之悠悠，\n独怆然而涕下！§!"
  Adorable_heart_city_story_title_BeiJing: "帝国之心--北京"
  Adorable_heart_city_story_title_BeiPing: "北平特别市"
  Adorable_heart_city_story_title_BeiJing_generic: "[608.GetCapitalVictoryPointName]"
  Adorable_heart_city_story_desc_BeiJing: "所谓“天子守国门，君王死社稷”，自从永乐皇帝迁都北京以来，这里一直是中国的政治中心。\n时过境迁，这里是神州蒋家王朝最后的都城，也是东亚传统帝制的最后一座堡垒。这座千年古都浸润着天子脚下的威严与暮气，却又在西方工业文明的冲击与革命浪潮的暗涌中剧烈震颤。这一年，广州与四川的枪声叫嚣着终结延续两千余年的帝制，而紫禁城内的龙椅上，年幼的永和皇帝蒋丽华尚不知晓，她正坐在一个时代的火山口上。\n\n北京城的格局仍严格遵循《周礼·考工记》的礼制：外城包裹内城，内城环抱皇城，皇城拱卫紫禁城，层层叠叠的城墙如同凝固的等级秩序。清晨的鼓楼钟声里，官员们穿过正阳门，沿着千步廊走向午门，朝服补子上的禽兽纹样在晨光中闪烁；护城河边，贵族提着鸟笼遛弯，一口京片子；胡同深处的四合院飘出豆汁焦圈儿的香气，骆驼商队驮着蒙古皮毛与山西煤炭，在德胜门外扬起沙尘。\n\n紫禁城内，太和殿的金銮宝座空悬已久，实际掌权的帝国内阁与摄政王蒋百里在养心殿处理政务，奏折中充斥着“广州异动”“川北匪患”等烫手议题。东交民巷使馆区的西洋建筑鳞次栉比，各国公使的马车频繁出入总理衙门，海关税务司的赫德虽已退休，但街头的煤气灯、电报局与轰鸣的蒸汽机车仍在提醒着：这座古老都城已被强行拽入现代世界。\n\n“这时候的北京，仿佛一个穿缎子袄的老绅士，明明兜里只剩几个铜板，还要端着盖碗茶说：‘咱们这是天子脚下！’”"
  Adorable_heart_city_story_desc_BeiPing: "北平如同一幅褪色的水墨长卷，既保留着千年古都的雍容气韵，又深陷于动荡时局的阴霾之下。此时的北平已不再是中国的政治中心，在国民政府迁都南京后，它褪去了“京城”的光环，但仍是文化、教育与历史的象征之地。\n\n北平的城墙依然巍峨，九座城门分隔着传统与现代的呼吸。前门大街商铺林立，瑞蚨祥的绸缎、同仁堂的药香、全聚德的烤鸭香气交织成市井繁华；东安市场里，西装革履的绅士与长袍马褂的遗老摩肩接踵，玻璃橱窗中的西洋钟表与胡同口的剃头挑子相映成趣。人力车夫奔跑在石板路上，吆喝声与叮当的电车铃此起彼伏，偶尔还有驼队缓缓穿过城门，提醒着人们这里仍是通往塞外的商贸枢纽。\n\n尽管政治地位下降，北平仍是全国的文化心脏。北京大学、清华大学、燕京大学等学府聚集着中国最顶尖的学者：朱自清在清华园的荷塘边写下散文，梁思成与林徽因正踏遍郊野测绘古建，钱玄同、刘半农等人继续推动着新文化运动的余波。琉璃厂的旧书店里，线装书与西文典籍并列，教授与学生在此寻觅思想的火种。\n\n北平，是一座在历史夹缝中喘息的城市。它承载着中华文明的厚重，却不得不面对现代化的撕裂与殖民侵略的屈辱；它孕育着觉醒的星火，却又被旧时代的尘埃所笼罩。"
  Adorable_heart_city_story_desc_BeiJing_generic: "所谓“天子守国门，君王死社稷”，自从永乐皇帝迁都北京以来，这里一直是中国的政治中心。\n这座千年古都浸润着天子脚下的威严与暮气，却又在西方工业文明的冲击与革命浪潮的暗涌中剧烈震颤。\n\n北京城的格局仍严格遵循《周礼·考工记》的礼制：外城包裹内城，内城环抱皇城，皇城拱卫紫禁城，层层叠叠的城墙如同凝固的等级秩序。清晨的鼓楼钟声里，官员们穿过正阳门，沿着千步廊走向午门，朝服补子上的禽兽纹样在晨光中闪烁；护城河边，贵族提着鸟笼遛弯，一口京片子；胡同深处的四合院飘出豆汁焦圈儿的香气，骆驼商队驮着蒙古皮毛与山西煤炭，在德胜门外扬起沙尘。"

# 南京
  NanJing: "南京"
  NanJing_desc: "§L登临送目，正故国晚秋，天气初肃。千里澄江似练，翠峰如簇。归帆去棹残阳里，背西风，酒旗斜矗。彩舟云淡，星河鹭起，画图难足。\n念往昔，繁华竞逐。叹门外楼头，悲恨相续。千古凭高对此，谩嗟荣辱。六朝旧事随流水，但寒烟衰草凝绿。至今商女，时时犹唱，后庭遗曲。§!"
  Adorable_heart_city_story_title_NanJing: "--南京"
  Adorable_heart_city_story_desc_NanJing: ""

# 杭州
  HangZhou: "杭州"
  HangZhou_desc: "§L东南形胜，三吴都会，钱塘自古繁华。烟柳画桥，风帘翠幕，参差十万人家。云树绕堤沙，怒涛卷霜雪，天堑无涯。市列珠玑，户盈罗绮，竞豪奢。\n重湖叠𪩘清嘉，有三秋桂子，十里荷花。羌管弄晴，菱歌泛夜，嬉嬉钓叟莲娃。千骑拥高牙，乘醉听箫鼓，吟赏烟霞。异日图将好景，归去凤池夸。§!"

# 广州
  GuangZhou: "广州"
  GuangZhou_desc: "§L广南富庶天下闻，\n四时风气长如春。\n长城百雉白云里，\n城下一带春江水。§!"

# 香港
  HongKong: "香港"
  HongKong_desc: "§L沸地笙歌海，排山酒肉林。\n连环屯万室，尺土过千金。\n民气多羶行，夷言学鸟音。\n黄标千万积，翻讶屋沉沉。§!"

# 青岛
  QingDao: "青岛"
  QingDao_desc: "§L海气苍苍岛屿回，\n山巅楼阁抗崔巍。\n茂林峻岭百驰道，\n又入仙山画里来。§!"

# 上海
  ShangHai: "上海"
  ShangHai_desc: "§L落日西风见沪城，\n瓶山终古峙峥嵘。\n沙虫猿鹤知何在，\n惟有寒潮作战声。§!"

# 天津
  TianJin: "天津"
  TianJin_desc: "§L云帆十幅下津门，\n日落潮平不见痕。\n芦荻茫茫沙鸟起，\n满城秋色半黄昏。§!"

# 武汉
  WuHan: "武汉"
  WuHan_desc: "§L昔人已乘黄鹤去，此地空余黄鹤楼。\n黄鹤一去不复返，白云千载空悠悠。\n晴川历历汉阳树，芳草萋萋鹦鹉洲。\n日暮乡关何处是？烟波江上使人愁。§!"

# 重庆
  ChongQing: "重庆"
  ChongQing_desc: "§L江畔谁人唱竹枝，\n前声断咽后声迟。\n怪来调苦缘词苦，\n多是通州司马诗。§!"

# 西安
  XiAn: "西安"
  XiAn_desc: "§L秦川雄帝宅，函谷壮皇居。\n绮殿千寻起，离宫百雉馀。\n连甍遥接汉，飞观迥凌虚。\n云日隐层阙，风烟出绮疏。§!"

# 苏州
  SuZhou: "苏州"
  SuZhou_desc: "§L桃花坞里桃花庵，桃花庵里桃花仙。\n桃花仙人种桃树，又摘桃花换酒钱。\n酒醒只在花前坐，酒醉还来花下眠。§!"

# 大江山
  Adorable_heart_city_story_title_dajiangshan: "大江山"
  Adorable_heart_city_story_desc_dajiangshan: "§Y · 大江山：§!\n曾名丹波山，是平安京北部耸立着的极高山峰。山顶居住着曾独自征服了鬼域并称王的厉鬼酒吞童子。一位自称是鬼王挚友的大妖曾用其鬼手将大江山劈成两半，令原本陡峭的山崖又添一分险峻，犹如双刃直插云霄。\n§Y · 罗生门：§!\n进出大江山时必经的关隘，据说只有亲自战胜鬼王的部下茨木童子的人才会被允许通行。\n§Y · 人之谷：§!\n大江山双峰之间的峡谷。大江山被一分为二时，滚滚温泉从峡谷中涌出，滋养了山下的这一方土地。\n§Y · 鬼王座：§!\n传说酒吞童子征服鬼域的最后一战持续了七天七夜，他的对手身形硕大如峰、气力拔山扛鼎，每一击都震天撼地。艰难获胜后，酒吞童子命令败者俯身低首，就此成为他的王座，自己则高居王座之上，俯视着芸芸众生与他打下的这片天地。"
# 七角山
  Adorable_heart_city_story_title_qijiaoshan: "七角山"
  Adorable_heart_city_story_desc_qijiaoshan: "§Y · 七角山：§!\n平安京北部的七角山，因其山体有七个不同方向的转角而得名。七角山也因为独特的地理位置而成为众多河流的交汇点。据说如今这里的地貌，是由数十年前的一场山洪所造就的。\n§Y · 苍风神社：§!\n七角山附近的村子有着信仰风神的传统。曾经为了祈求风调雨顺所有村民都会定期前往神社参拜。\n§Y · 森之心：§!\n七角山脚下有着一片幽深的密林。当年山洪爆发时生活在这的鹿人一族背井离乡，逃向了荒野。时过境迁，世上存活的最后一只鹿人寻着鼓声回到家乡，这里却只剩残破的石像与枯倒的树木……"

# 京都平原
  Adorable_heart_city_story_title_jingdu: "京都平原"
  Adorable_heart_city_story_desc_jingdu: "§Y · 京都平原：§!\n传说千年前的一场雷暴中，四名阴阳师将一位来自高天之上的邪神封印在了这片土地下。在巨大的五芒星结界的护佑下，妖鬼怨气消散、人类耕耘劳作……无数人与妖同行的美好故事，如今也在这片土地上孕育。\n§Y · 平安京都：§!\n由人类建立的都城，以繁华的市井与林立的楼阁而远近闻名。据说在平安京都四个方向的城门上，有四名神兽在默默镇守着这片人类的家园。可土地下邪神的封印松动，这座名为「平安京」的都城，似乎总是不太平呢。\n§Y · 晴明庭院：§!\n被誉为「天才阴阳师」的晴明为了省去不必要的麻烦，选择在城郊不远处的一座小院落里生活。无论是衣食起居、修行术法，还是缔结与式神的契约，抑或是在硕大的樱花树下撰写文字，晴明都会在这一方小小天地间完成。\n§Y · 源氏宅邸：§!\n作为京都势力最强的家族之一，源氏家族曾以极强的武力取得了无数的财富与荣誉。而这武力，似乎来源于一场场禁忌的仪式与见不得光的交易。\n§Y · 藤原宅邸：§!\n在三大阴阳师家族中，藤原家是最为低调、收敛的家族。在面积与其它家族相比微不足道的宅邸中，收藏着数以万计的古籍与卷宗。据藤原道纲所说，「情报」可是他们家族最为自豪的武器。\n§Y · 贺茂宅邸：§!\n贺茂家族世世代代追求将阴阳术钻研到极致，家族中的高位阴阳师都与许多大妖有着深厚的渊源。据说就连如今的天才阴阳师晴明，也曾拜贺茂家的人为师。\n§Y · 缘结神社：§!\n由于穷酸的外表与偏远的位置，不少人误以为这座神社已经废弃，但只要虔诚地祈祷，似乎真的会有一位元气满满的少女神明出现，帮助情人们结成良缘?"

# 荒川
  Adorable_heart_city_story_title_huangchuan: "荒川"
  Adorable_heart_city_story_desc_huangchuan: "§Y · 荒川：§!\n由曾经征服了怒涛与巨浪、一统海洋的大妖荒川之主统领的海峡。这位统治者传说中性情残暴，却多次于劫难之中保护了荒川子民，为许多居无定所的小海妖提供了避风的港湾。"

# 逢魔之原
  Adorable_heart_city_story_title_fengmo: "逢魔之原"
  Adorable_heart_city_story_desc_fengmo: "§Y · 逢魔之原：§!\n由大妖怪玉藻前统领，只有妖怪居住的原野。相传在夕阳西下、阴阳更替之时各地的妖怪会聚集到逢魔之原举行一场小小宴会，谓之「逢魔之时」。\n§Y · 狐火环：§!\n由于曾失去至亲，玉藻前格外珍惜生活在逢魔之原的小妖怪们。他将强大的妖力凝聚成火焰，把妖怪们生活的家园团团围绕。骇人的火焰既吓跑了妄图侵扰的人类，又给予了小妖怪们源源不断的妖力，使得他们得以建设独属于自己的乐园。"

# 杏原岛
  Adorable_heart_city_story_title_xingyuan: "杏原岛"
  Adorable_heart_city_story_desc_xingyuan: "§Y · 杏原岛：§!\n歌舞盛世的荣华在遥远边海的杏原岛上被传颂，这里本是人类的豪门贵族聚集起来培养歌舞伎享受音乐的地方。\n§Y · 离岛：§!\n岛上唯一一座名为「离人阁」的建筑，曾曾被一场滔天大火吞噬殆尽，化作了焦黑的废墟。"

# 黑夜山
  Adorable_heart_city_story_title_heiye: "黑夜山"
  Adorable_heart_city_story_desc_heiye: "§Y · 黑夜山：§!\n坐落于京都平原东侧的黑夜山，是迁离月宫的天狗族如今的聚居地。高耸如云的山巅恰好适合天狗幼崽练习飞翔。"

# 雅罗斯拉夫尔
  Adorable_heart_city_story_title_Yaroslavl_SOV: "伏尔加河畔千年商埠-雅罗斯拉夫尔"
  Adorable_heart_city_story_desc_Yaroslavl_SOV: "伏尔加河在这里拐了个弯，把一座城留在右岸。\n\n一〇一〇年，雅罗斯拉夫大公在熊出没的河湾上竖起木栅；十七世纪的过路商队留下教堂，二十世纪的工厂留下烟囱。两条街之间隔着八个世纪，谁也没打算搬走。\n\n五年计划下来，橡胶厂和纺织厂接了军需订单，河港的浮码头往南接长了二百米。\n\n§O这座城把钟声和汽笛装在同一条街上。§!"

# 布良斯克
  Adorable_heart_city_story_title_Bryansk_SOV: "交会的军械城-布良斯克"
  Adorable_heart_city_story_desc_Bryansk_SOV: "德斯纳河从布良斯克州穿过去，两岸是连成一片的松林。\n\n铁路铺到这里以后，森林成了掩体，车站成了货场：木材、粮食、军火都从这里转运。一九一八年德军沿铁路来，一九一九年红军沿铁路回，来回踩的是同一条路基。\n\n现在的机车修理厂、木材加工厂和军械库仍守着站场，货场一到夜里就排满车皮。\n\n§O森林给了这座城两样东西：木头和遮蔽。§!"

# 图拉
  Adorable_heart_city_story_title_Tula_SOV: "苏维埃兵工厂-图拉"
  Adorable_heart_city_story_desc_Tula_SOV: "图拉的名字后面永远跟着“兵工厂”三个字。\n\n一七一二年彼得在这里设官营铁厂，十九世纪做成了俄国的枪械中心；一九〇五年工人扛着枪上街，一九一七年他们把厂里的车床当作革命的本钱。\n\n如今厂区连成一片，步枪、机枪、火炮零件各有车间，工人的宿舍就盖在围墙外头。\n\n§O一座城的本事，是能把铁变成留住别人的东西。§!"

# 奥廖尔
  Adorable_heart_city_story_title_Oryol_SOV: "奥卡河上游要塞城-奥廖尔"
  Adorable_heart_city_story_desc_Oryol_SOV: "奥卡河在奥廖尔分成两条支流，城就卡在两条水道的交汇处。\n\n一五六六年建要塞，为的是挡住南边的骑兵；后来要塞成了粮栈，粮栈成了车站，车站周围长出了厂房。\n\n一九一九年白军从这里往北推过一次，被挡在城郊的铁路路堤下面。\n\n§O要塞早就没用了，城还站在原来的位置上。§!"

# 库尔斯克
  Adorable_heart_city_story_title_Kursk_SOV: "黑土带枢纽-库尔斯克"
  Adorable_heart_city_story_desc_Kursk_SOV: "黑土是库尔斯克最不值钱也最值钱的东西——插根棍子就能长庄稼。\n\n一〇三二年见于记载，后来做过要塞、省城、粮食集散地；一九一八年到一九一九年，白军和红军在这片平原上拉锯，铁路桥炸了修、修了炸。\n\n现在城里有机械厂、食品厂和一所农学院，编组站每天往北送粮、往南送铁。\n\n§O城也是在一次次被踩过之后才长成这样的。§!"

# 梁赞
  Adorable_heart_city_story_title_Ryazan_SOV: "奥卡河苏维埃粮仓-梁赞"
  Adorable_heart_city_story_desc_Ryazan_SOV: "奥卡河从梁赞城下流过，渡口比城还早。\n\n一〇九五年见于记载，十三世纪被蒙古骑兵烧过一次，之后在离旧城五公里的地方重新长起来；十九世纪铁路绕开了它，它就把码头让给木船，自己守着粮栈。\n\n五年计划里建了机床厂和皮革厂，河港改运木材，粮仓仍是全州最大的那座。\n\n§O城挪过地方，改过行当，唯一没改的是等上来的东西。§!"

# 沃罗涅日
  Adorable_heart_city_story_title_Voronezh_SOV: "顿河红色城-沃罗涅日"
  Adorable_heart_city_story_desc_Voronezh_SOV: "顿河在沃罗涅日拐了个大弯，河湾里泊着驳船。\n\n一五八六年建要塞，十八世纪造舰队，十九世纪做粮食生意；一九一九年白军骑兵冲到城下，被工人支队和铁路上的装甲列车顶了回去。\n\n如今收割机厂、机床厂、合成橡胶厂各占一片地方，河港的起重机是新换的。\n\n§O城是从木桩子起家的，后来换成砖，再换成钢。§!"

# 坦波夫
  Adorable_heart_city_story_title_Tambov_SOV: "苏维埃粮仓-坦波夫"
  Adorable_heart_city_story_desc_Tambov_SOV: "坦波夫的街上闻得到麦子味，一年里有一半时间在往外运粮。\n\n一六三六年建要塞，后来成了省城；一九二〇至一九二一年的农民暴动从这里起，坦克和骑兵开进过郊区的村子。\n\n现在城里是面粉厂、肉类联合厂和一所师范学院，铁路支线一直通到各个粮站。\n\n§O这座城记性好：它记得每一年的收成，也记得收成被谁拿走过。§!"

# 高尔基
  Adorable_heart_city_story_title_Gorky_SOV: "伏尔加与奥卡交汇的汽车城-高尔基"
  Adorable_heart_city_story_desc_Gorky_SOV: "奥卡河在这里汇入伏尔加，两水之间夹着一座城。\n\n下诺夫哥罗德的集市曾是全俄最大的，一九三二年改名高尔基，同年汽车厂投产；厂区比老城还大，宿舍、学校、食堂按车间编号排开。\n\n如今卡车和轿车从流水线上下来，直接开上伏尔加的渡船。\n\n§O老城卖东西，新城造东西。§!"

# 罗斯托夫
  Adorable_heart_city_story_title_Rostov_SOV: "高加索门户-罗斯托夫"
  Adorable_heart_city_story_desc_Rostov_SOV: "顿河在罗斯托夫变得又宽又慢，离亚速海只剩几十公里。\n\n一七四九年设海关，十九世纪做粮食出口，码头上一年四季在装船；一九一八年到一九二〇年，白军和红军为这座城打了三年，城里的街道换过四次旗。\n\n现在是机械厂、造船厂和全俄数得着的粮食码头，河运与铁路在站场里接上。\n\n§O河流往南，粮食往南，兵也往南。§!"

# 克拉斯诺达尔
  Adorable_heart_city_story_title_Krasnodar_SOV: "库班河畔社会城-克拉斯诺达尔"
  Adorable_heart_city_story_desc_Krasnodar_SOV: "库班河在克拉斯诺达尔绕了个缓弯，两岸是一眼望不到边的麦地。\n\n一七九四年哥萨克在这里筑起要塞，十九世纪成了库班州的中心；一九一八年到一九二〇年，白军把这里当后方，红军收复时城里的面粉厂还在转。\n\n现在是油脂厂、面粉厂、农机修造厂，粮仓沿着铁路一字排开。\n\n§O城是跟着麦子长起来的，麦子长到哪儿，它的街就往哪儿伸。§!"

# 萨拉托夫
  Adorable_heart_city_story_title_Saratov_SOV: "伏尔加转运港-萨拉托夫"
  Adorable_heart_city_story_desc_Saratov_SOV: "伏尔加河在萨拉托夫宽到看不清对岸，冬天结冰，夏天涨水。\n\n一五九〇年建要塞，十九世纪做粮食和盐的转运生意，德国移民在河对岸种出了整片麦田；一九一九年这里是东线的一个支点，车站上堆满弹药物资。\n\n如今有机械厂、石油加工厂和一所大学，河港的仓库从码头一直排到火车站。\n\n§O这座城的本事是把河上的东西变成铁路上的东西，一年做四遍。§!"

# 阿斯特拉罕
  Adorable_heart_city_story_title_Astrakhan_SOV: "里海之滨-阿斯特拉罕"
  Adorable_heart_city_story_desc_Astrakhan_SOV: "伏尔加河在阿斯特拉罕散成几十条水道，最后流进里海。\n\n一五五八年伊凡雷帝拿下这里，从此它守着河口的鱼、盐和通往波斯的路；十九世纪的码头上堆着鲟鱼、鱼子、盐包和棉花。\n\n现在有鱼品联合厂、船舶修理厂和港口，河海两用的驳船一年到头在河口进出。\n\n§O河到这里就没有岸了，城也只能跟着水散开，一截一截地长。§!"

# 格罗兹尼
  Adorable_heart_city_story_title_Grozny_SOV: "苏维埃小油库-格罗兹尼"
  Adorable_heart_city_story_desc_Grozny_SOV: "格罗兹尼是沿着油井长起来的一座城，街名里全是井号。\n\n一八九三年第一口井出油，炼油厂就在井边盖起来；一九一七年以后油田收归国有，工人把泵站当成自己的车间守着。\n\n如今炼油厂、机械修配厂连着输油管，油罐沿铁路排成几公里。\n\n§O城底下是黑的，城上面是灰的；它所有的热闹都从井口往上冒。§!"

# 第比利斯
  Adorable_heart_city_story_title_Tbilisi_SOV: "高加索之花-第比利斯"
  Adorable_heart_city_story_desc_Tbilisi_SOV: "库拉河在第比利斯切出一道峡谷，两岸的硫磺温泉把这座城养了十五个世纪。\n\n四世纪建城，十二世纪做过格鲁吉亚王国的都城，十九世纪成了外高加索的行政与商业中心；一九一八年以后这里是外高加索联邦的所在地。\n\n如今有机械厂、纺织厂、葡萄酒厂，铁路通向巴库、巴统和埃里温。\n\n§O温泉从地底下冒出来，铁路从山外头钻进来；城夹在这两股热乎气中间。§!"

# 巴库
  Adorable_heart_city_story_title_Baku_SOV: "苏维埃石油命脉-巴库"
  Adorable_heart_city_story_desc_Baku_SOV: "巴库的油不用挖，把管子插进地里就会自己上来。\n\n十九世纪七十年代第一批油井在城郊开钻，二十世纪初这里是世界最大的产油区之一，一九〇五年工人罢工把整片油田停过一星期。\n\n如今炼油厂、机械厂、造船厂沿着阿普歇伦半岛摆开，油轮从里海往伏尔加运河走。\n\n§O这座城没有什么风景，只有井架、油管和风，风一来，整座城都是黑的。§!"

# 古比雪夫
  Adorable_heart_city_story_title_Kuybyshev_SOV: "伏尔加河湾新都-古比雪夫"
  Adorable_heart_city_story_desc_Kuybyshev_SOV: "伏尔加河在古比雪夫拐出一个大湾，湾里泊着驳船和木排。\n\n一五八六年建要塞，十九世纪做粮食与盐的生意，一九三五年改名古比雪夫；机器厂、机床厂、食品厂沿着河岸一字排开。\n\n车站与河港之间修了直通线，一车皮粮食上岸就进面粉厂。\n\n§O城的命运写在河道上。§!"

# 喀山
  Adorable_heart_city_story_title_Kazan_SOV: "伏尔加与卡赞卡河口的大学城-喀山"
  Adorable_heart_city_story_desc_Kazan_SOV: "卡赞卡河在喀山汇入伏尔加，两条水之间夹着一座白色的克里姆林。\n\n一四三八年建城，一五五二年被伊凡雷帝攻下，十九世纪成了伏尔加流域的大学城与商贸中心；一九〇五年这里的学生和工人一起上过街。\n\n如今有机械厂、化学厂、皮革厂，大学的老楼还立在克里姆林边上。\n\n§O经学院、大学和工厂排在同一条街上，谁也不觉得别扭。§!"

# 彼尔姆
  Adorable_heart_city_story_title_Perm_SOV: "卡马河畔兵工城-彼尔姆"
  Adorable_heart_city_story_desc_Perm_SOV: "卡马河在彼尔姆宽得像海，河岸上是成片的厂区。\n\n一七二三年彼得大帝下令在这里建铜厂，十九世纪做成火炮与机械的中心；一九一八年以后兵工厂没有停过工，工人把车床搬上驳船躲过一次轰炸。\n\n如今有火炮厂、发动机制造厂、造船厂，铁路桥横跨卡马河。\n\n§O订单一来，厂房就往外扩一圈。§!"

# 马格尼托格尔斯克
  Adorable_heart_city_story_title_Magnitogorsk_SOV: "山脚钢铁城-马格尼托格尔斯克"
  Adorable_heart_city_story_desc_Magnitogorsk_SOV: "马格尼托格尔斯克是一座从图纸上直接长出来的城，建城那年这里只有一座叫马格尼特纳亚的山。\n\n一九二九年第一批工人住进土窑和帐篷，一九三二年一号高炉出铁；炼焦、炼钢、轧钢三片厂区按流程排队，宿舍按车间编号。\n\n如今高炉日夜不熄，火车把铁矿石从山那边拉进来，把钢坯往西边送出去。\n\n§O这座城没有老城可以拆，它的地基就是矿石。§!"

# 车里雅宾斯克
  Adorable_heart_city_story_title_Chelyabinsk_SOV: "乌拉尔工人城-车里雅宾斯克"
  Adorable_heart_city_story_desc_Chelyabinsk_SOV: "米阿斯河从车里雅宾斯克穿过去，东边是草原，西边是乌拉尔山的林带。\n\n一七三六年建要塞，十九世纪做粮食与茶叶的转运生意，西伯利亚大铁路从这里过；一九一八年捷克军团在站场上打过一仗，站房烧了半边。\n\n如今拖拉机厂、机床厂、冶金厂连成一片，编组站是乌拉尔最大的一个。\n\n§O山那边的货、山这边的货，都得在它的站场上换一次车。§!"

# 斯维尔德洛夫斯克
  Adorable_heart_city_story_title_Sverdlovsk_SOV: "乌拉尔的心脏-斯维尔德洛夫斯克"
  Adorable_heart_city_story_desc_Sverdlovsk_SOV: "伊塞季河在斯维尔德洛夫斯克汇入更大的水系，城就压在山与河之间。\n\n一七二三年建冶炼厂与要塞，十九世纪成了乌拉尔的矿业与铁路中心，一九二四年改名斯维尔德洛夫斯克；这里是乌拉尔工业区的指挥部，重型机械、化工、电力设备各有一片厂区。\n\n如今机器厂、涡轮厂、电缆厂昼夜开工，铁路把它和莫斯科、秋明、车里雅宾斯克连成一串。\n\n§O乌拉尔的账本全在它手里。§!"

# 秋明
  Adorable_heart_city_story_title_Tyumen_SOV: "西伯利亚第一站-秋明"
  Adorable_heart_city_story_desc_Tyumen_SOV: "过了乌拉尔山，铁路遇到的第一个大站就是秋明。\n\n一五八六年建要塞，是俄国在西伯利亚最早的据点；十九世纪做皮毛、茶叶和粮食的转口生意，西伯利亚大铁路修到这里时，它已经等了三百年。\n\n如今有机械厂、造船厂、木材加工厂，河港接鄂毕—额尔齐斯水系，往北能一直通到冻土带。\n\n§O城的资历比铁路老。§!"

# 卡拉干达
  Adorable_heart_city_story_title_Karaganda_SOV: "草原煤都-卡拉干达"
  Adorable_heart_city_story_desc_Karaganda_SOV: "卡拉干达的煤埋得浅，最早是牧人挖坑取暖挖出来的。\n\n一九二〇年代开始勘探，一九三一年第一条铁路支线铺进来，矿工在草原上搭起第一批土房；一九三六年这里已经是全联盟第三大煤田。\n\n如今矿井沿着铁路排开，选煤厂、机修厂、发电厂围着井口长起来。\n\n§O城立在没有水、没有树的草原上，唯一的靠山是地底下那层黑东西。§!"

# 阿克莫林斯克
  Adorable_heart_city_story_title_Akmolinsk_SOV: "草原粮站-阿克莫林斯克"
  Adorable_heart_city_story_desc_Akmolinsk_SOV: "伊希姆河从阿克莫林斯克边上淌过去，两岸是哈萨克草原。\n\n一八三〇年建要塞，一九六一年以前一直叫阿克莫林斯克；西伯利亚大铁路支线修过来以后，这里成了草原上的粮食集散地。\n\n如今有面粉厂、肉类联合厂、农机修配厂，粮仓沿着铁路一字排开，秋天站场上全是装麦子的车皮。\n\n§O草原上什么都缺，唯独不缺距离。§!"

# 鄂木斯克
  Adorable_heart_city_story_title_Omsk_SOV: "额尔齐斯河畔铁路枢纽-鄂木斯克"
  Adorable_heart_city_story_desc_Omsk_SOV: "额尔齐斯河在鄂木斯克与鄂木河汇合，铁路桥横在两水之间。\n\n一七一六年建要塞，十九世纪做西伯利亚总督府驻地，一九一八年到一九一九年这里是白军的“首都”，高尔察克的政府就设在城里。\n\n如今有机车厂、机械厂、皮革厂，编组站是西伯利亚大铁路上的大站之一。\n\n§O这座城做过旧政权的最后一张桌子，如今它只是西伯利亚干线上的一节车厢。§!"

# 新西伯利亚
  Adorable_heart_city_story_title_Novosibirsk_SOV: "社会主义西伯利亚的首府-新西伯利亚"
  Adorable_heart_city_story_desc_Novosibirsk_SOV: "西伯利亚大铁路在鄂毕河上只找到一处能架桥的地方。\n\n一八九三年桥桩打进河床，一八九七年通车，桥头聚起的村子叫新尼古拉耶夫斯克；一九二六年改名新西伯利亚。一九一八年白军和干涉军从这里过，一九一九年红军收复。\n\n五年计划里库兹涅茨克的煤和乌拉尔的铁在这里合流，编组场铺到二十股道。\n\n§O一圈一列车皮，一列车皮一段西伯利亚。§!"

# 托木斯克
  Adorable_heart_city_story_title_Tomsk_SOV: "托米河畔的大学城-托木斯克"
  Adorable_heart_city_story_desc_Tomsk_SOV: "托米河从托木斯克城下流过，岸上是成片的木房子。\n\n一六〇四年建要塞，十九世纪靠金矿和皮毛富起来，一八七八年办了帝国第一所西伯利亚大学；一九一九年白军在这里设过政府，一九二〇年初红军进城。\n\n如今有电机厂、轴承厂、木材加工厂，大学的老楼仍占着城中心最好的一片坡地。\n\n§O先有学校，后有工厂，读书人的脚印比工人的深一点。§!"

# 克拉斯诺亚尔斯克
  Adorable_heart_city_story_title_Krasnoyarsk_SOV: "叶尼塞河英雄城-克拉斯诺亚尔斯克"
  Adorable_heart_city_story_desc_Krasnoyarsk_SOV: "叶尼塞河在克拉斯诺亚尔斯克被一道山脊夹住，河面在这里窄得能看清对岸的车。\n\n一六二八年建要塞，十九世纪靠金矿和西伯利亚大铁路富起来；一九一八年到一九一九年，白军和红军在城外的山谷里打过几仗。\n\n如今有机械厂、机车修理厂、木材加工厂，河港与铁路在岸边接上。\n\n§O河把木头和金砂往下游送，城把人和机器往上游拦，两边都在跟水较劲。§!"

# 哈巴罗夫斯克
  Adorable_heart_city_story_title_Khabarovsk_SOV: "阿穆尔东方前哨-哈巴罗夫斯克"
  Adorable_heart_city_story_desc_Khabarovsk_SOV: "阿穆尔河在哈巴罗夫斯克宽到三公里，对岸就是另一片土地。\n\n一八五八年建城，一八九七年通铁路，一九二〇年远东共和国把政府设在这里；城里的兵营、码头、铁路工厂都是按“前哨”的规格修的。\n\n如今有机械厂、造船厂、炼油厂，铁路桥横跨阿穆尔河，往东一直通到太平洋。\n\n§O城是插在江边的一根桩子，桩子周围的土都得算它的。§!"

# 符拉迪沃斯托克
  Adorable_heart_city_story_title_Vladivostok_SOV: "太平洋岸的军港-符拉迪沃斯托克"
  Adorable_heart_city_story_desc_Vladivostok_SOV: "金角湾三面是山，湾口只留一道窄缝——这样的地形，天生就是海军要的。\n\n一八六〇年建军港，一八七五年设市，西伯利亚大铁路的终点站就修在码头边上；一九一八年到一九二二年被外国干涉军占着，一九二二年十月红军收复。\n\n如今是太平洋舰队的基地，修船厂、鱼品联合厂、机车厂都在湾里，码头上一年四季有船进出。\n\n§O这座城的街是顺着山坡修的，所有的路最终都通到码头。§!"

#斯摩棱斯克
  Adorable_heart_city_story_title_Smolensk: "苏维埃之盾-斯摩棱斯克"
  Adorable_heart_city_story_desc_Smolensk: "斯摩棱斯克的城墙比城还老。\n\n1596年到1602年，为守住全俄西部的门户，六公里半的石墙和三十八座塔楼一座接一座砌起来。1611年波兰人破城，1812年拿破仑的大火烧过一遍，墙一段段塌下去，砖被人搬走盖房子。\n\n三条铁路在这里交汇，1918年城里的苏维埃政权成立，1929年设西部州；新厂房就贴着墙根盖，仓库干脆拿塔楼当背墙。\n\n§O这座城把工事住成了房子。§!"

# 勒热夫
  Adorable_heart_city_story_title_Rzhev: "莫斯科西大门-勒热夫"
  Adorable_heart_city_story_desc_Rzhev: "沃尔加河从上游下来，在勒热夫这里第一次宽到能行船。\n\n十二世纪的编年史把这个渡口写作 Ръжевъ，那时它是特维尔与斯摩棱斯克之间的界河哨所。木材、亚麻和粮食顺流而下，皮货和铁器逆水上来，河滩上一年一度摆开集市。\n\n十九世纪铺来的铁路正好从河湾穿过，城就顺着铁轨拉成一条长条：亚麻厂、榨油坊、砖窑，还有一片专修农具的铁匠铺。\n\n§O八百年里，这座城只靠两条路活着：一条是河，一条是铁轨。§!"

# 加里宁
  Adorable_heart_city_story_title_Kalinin: "改名换姓的州府-加里宁"
  Adorable_heart_city_story_desc_Kalinin: "一条笔直的街道从沃尔加河码头一直通到火车站，这是特维尔在1763年大火之后重新画下的第一条线。\n\n河里走驳船，街上走马车；1851年尼古拉铁路通车以后，火车站的钟和教堂的钟在城里各响各的。纺织厂的蒸汽机一动，半城人按汽笛作息。\n\n1931年城改名加里宁，1935年它成了加里宁州的首府，机关、报社、师范学院跟着搬进来，城里的公文比布匹多了。\n\n§O这座城做过公国的都城，如今它是州里的一张办公桌。§!"
