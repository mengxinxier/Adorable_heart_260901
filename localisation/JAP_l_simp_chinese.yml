  JAP_Local_History_Title: "日出之国"
  JAP_loca_his_t_01: "黑船来航"
  JAP_history_page_01: "\n\n§Y黑船来航§!\n\n在圣杯的军舰于1823年开入关门海峡之前，东国的英灵统治者以天皇为核心领导着这个古老的英灵国度。这是由一场庞大而血腥的战役所决定的——由天皇玲所领导的朝廷结束了大名割据的混乱局面。彼时西国为三家所瓜分，他们联合起来试图维护自己的独立地位，但在北方诸侯的支持下天皇最终在关原以一战结束了东西对峙的局面，樱花帝国于十八世纪重新归于一统。\n\n尽管失去了彼时府郡之主的地位，但三家氏族——岛津、毛利、长宗我部仍然具有不容小觑的政治影响。彼时三家藩国掌握着濑户内海的门户——博多、门司，以及土佐一国。这使得他们在面对入侵之时成为首当其冲的应对者。\n\n"

  JAP_loca_his_t_02: "绥靖派"
  JAP_history_page_02: "\n\n§Y绥靖派§!\n\n面对圣杯代表团屡次进犯樱花，朝廷的抵抗情绪甚高，天皇玲向公卿与忠于她的大名保证樱花帝国将坚决抵抗外部入侵。但问题是，承受抵抗外夷并付出代价的却只有西国。被攘夷情绪点燃的长洲藩一开始坚决表示应当武力抵御圣杯侵略，但随后在下关海峡发生的军事冲突中朝廷任由长州军队与圣杯舰队发生冲突而没有做出任何回应。这激起了西国统治者的强烈不满。但此时他们还没有更多的心思。\n\n在发现实力差距过于巨大之后，部分藩国开始尝试与外部接触。逐渐地圣杯乃至整个旧世界的船队均获准开进濑户内海，九州－中国建立起了通向东南亚、印度乃至地中海的贸易航路。而新经济的因素，真正能够让樱花走上近代化道路的养分也由此输入了进来。\n\n以萨摩、长州、土佐等大名为首，整个西国对外夷的态度开始转变，随着条约签订，东西航贸开始发达起来，一些大名甚至私自派遣藩士组织对外活动。\n\n而京都以东，天皇和她的朝廷借此大量引进西式军备，他们相信只要在军事上打造一支近代化军队，樱花国就能在外国入侵的狂潮中得以傲然挺立。问题是，随着交流的深入。东方的樱花藩国呼吁着“师夷长技以制夷”的口号。但在实质上西樱花的绥靖者们把控着真正的西化事务。天皇没有意识到他们取得的成就究竟应该归因与谁，这形成了一个致命的悖论。\n\n"

  JAP_loca_his_t_03: "严岛、鸟羽、伏见之战"
  JAP_history_page_03: "\n\n§Y严岛战役§!\n\n在天皇玲认为时机合适之后，她再一次开始煽动樱花的民族主义情绪。1853年，朝廷指责长洲藩主“长久以来对忠于攘夷事业的天皇信徒进行大肆屠杀”。要求其上洛述职。最后这演变成了一场血腥的闹剧：长州藩主在京都城内的居所被付之一炬，京都的治安部队“新选组”大肆捕杀长州使团的随行人员，在京都民众的欢呼声下，京都内的绥靖派公卿被逐出京都。玲将长洲藩立为朝敌。号召诸大名勤王远征。势必一举消灭主持着西方事务的绥靖领主。不过长州藩并非孤身一人。\n\n萨摩藩早在1850年便在一为土佐藩士的斡旋下与长洲藩密结盟约。他们率先宣布将出兵支援中国战事。圣杯王国也对萨长军队表示支持，意外将原本仅负责编练事务的2000海军陆战教导部队投入这场战事。西国的其他领主与国人也不出意外地表现出对朝廷的敌意。甚至公然与萨长站在统一战线。其中便包含占据着严岛一地的广岛藩。\n\n萨长联军的联合舰队较强于官军——他们都订购过数艘西式的铁甲舰。海员也经过西式编练。作战素质不容小觑。他们在濑户内海以严岛为基地封锁了界港乃至整个樱花南岸的对外航线。在陆上，天皇军的两路进攻均被挫败。东国海军几次试图进入濑户内海，均遭到萨长军迎头痛击。对于天皇而言，拿下严岛将能为本家舰队在内海的行动提供巨大的帮助。一举扭转战事僵局。为此，天皇玲亲自集结了3万军队自山阳道出击，并以出其不意之势南下横渡严岛，萨长舰队匆忙驶向西方，驻守该地的陆军只能龟缩在该地抵抗天皇军主力的围攻。\n\n1853年12月3日，萨长舰队主力在严岛以西30里秘密集结，在知晓官军尽全力进攻严岛后，位于长州的临时大本营也同样制定了一个孤注一掷的突袭计划。这支舰队搭载着六千联军部队于雨夜在严岛西岸秘密登陆。因为雨情帝国军队甚至没能察觉到这支部队的存在。\n\n在第二日清晨，大雨止息，人困马乏之时，集结完毕的萨长联军向天皇部队发动了奇袭。这直接导致了官军的彻底溃散。这还不够，萨长舰队北上给予了整备中的樱花海军沉重打击，他们溃退并逃离严岛，这导致天皇军没有船只可供他们渡回本岛。最终三万大军在此地全军覆没，但天皇侥幸逃离。\n\n§Y鸟羽、伏见之战§!\n\n在石山，遭受重创的天皇只能选择暂时与萨长一方停战。经此一役，天皇彻底失去了对西国的控制。而在停战之后，土佐、肥前、长州、萨摩、加贺五强藩举行了历史性的会谈。萨长联盟扩张改组为维新派联盟。受西国的自由主义思潮影响，维新政权的主要诉求便是推翻天皇统治，由西国领主在樱花国建立共和统治。\n\n1870年5月2日，鸟羽、伏见之战爆发。这场战役既是维新战争的开始——7000维新军队遭到了2万集结起来的京都军队的突然袭击。又是这场战争的关键——这支不算主力的维新军队以其过硬的军事素质坚持到了周边援军的抵达，并将意志动摇的皇军主力再一次击溃并逐回京都。这几乎是决定性的一战，原本还考虑上京支援的大名此刻开始摇摆，东国军队失去了集结在天皇旗帜下的能力。而维新联盟则已磨刀霍霍，集结起大军打算彻底结束东方三道在樱花的统治地位。最终伏见之战的失败使得京都门户大开，天皇仓皇逃离，留下一众曾经狂呼酣战的民众被到来的维新军队所屠戮，劫掠持续了三天三夜。\n\n在这之后，新政府宣布建立，由五藩藩主组织的临时内阁掌控了局势，尽管东国大名抵抗情绪激烈，但在一场惩罚性的北上征伐结束之后，东国领主要么被直接消灭，要么屈膝向新政府表示恭顺。樱花共和国就这样以一场血腥的内战所建立。\n\n"

  JAP_loca_his_t_04: "留守内阁时期"
  JAP_history_page_04: "\n\n§Y留守内阁时期§!\n\n天皇的统治结束之后，临时内阁主宰了政局，五位藩主彼时矛盾激烈，但最终还是同意彼此瓜分胜利的果实。一个由永久性的合议团体所主导的专制政府建立起来。在十九世纪60年代至90年代的30年间，樱花共和国维持着与圣杯王国的良好关系，废除了藩国体制，现代的税收制度开始逐渐施行。行政机构上的变革为樱花国带来了前所未有的开放时期，早在萨长同盟时期便大行其道的“开国论”思想如今为维新政府所实践，新成立的樱花外交部门积极在南海，乃至太平洋沿岸的诸多国家进行交涉，樱花国得天独厚的地理位置在数十年间开始成为太平洋西岸的一个重要的贸易节点。来自世界各地的商队往来于濑户内海之中。而樱花本国的国际航运事业也日渐壮大。一时间樱花国逐渐以“东方马车夫”的称号为世人所知。贸易利润更是源源不断地流入这个新生的现代化国家。\n在这样优渥的发展环境之下，尽管因为签署的各项不平等条约樱花国有相当多的既得利益被转让给了圣杯王国，但是本岛的工业化进程仍然如火如荼的进行着，在堪称急速的工业化运动中，早期的工人无产阶级在生活条件极其恶劣的情况下迅速激进化，并且因为其独特的社会条件，工人与农民阶级的同盟关系较早地被建立起来。樱花的底层人民在政治斗争中实现了广泛的团结与统一战线。他们的政治力量将在未来成为文官政府建立的最直接的推力。\n维新政府建立到一次大战开始的这一段时间被后世称为“留守内阁”时期，但事实上这个内阁的形成相对较晚的。由木户孝允为首的欧洲出巡团于1879年外出周游考察，这支以进一步考察西方政治文化为目的的出使团在外考察了整整4年才回到樱花，期间由各个维新派氏族的领袖或者其派遣的代表组成的阁员团组成将在这数十年间任训政之责的“留守内阁”。以4人为核心，总计有18人的临时内阁一直持续到西南战争中期。这个时期的樱花最高领导层是混乱的，无组织的。权力争夺的明争暗斗可谓愈演愈烈。争斗最为激烈的时候政府内部的每一个部门都会成为党争的阵地。\n此时沉迷于争夺樱花国领导权的旧维新武家们没有意识到民权运动正在愈发蓬勃，以旧土佐藩士板垣退助为首的民权派强烈要求结束临时议会空悬的局面，民权家在各地煽动因为工业化而极度不满的底层人民，他们的主要诉求有二\n·在樱花国各地组织普选，选举出议员正式组成樱花国议会，内阁的选举常态化。\n·尽快推进樱花国的立宪工作，要求临时议会制定宪法。\n这场运动取得了民间，乃至军政界人士的广泛支持，他们大多已经对四强藩族把持樱花国实权的现状感到强烈不满，这场自由民权运动开始积极冲击留守内阁的训政统治，一时间这个军事独裁政权开始变得岌岌可危。此时离一次大战的开始还有不到十年的时间。\n\n"

  JAP_loca_his_t_05: "西南战争与樱苏战争"
  JAP_history_page_05: "\n\n§Y西南战争§!\n\n第一次伟大战争的爆发让樱花国嗅到了商机，他们开始大肆扩张军工产业以将其军备输入当时急需外来军火的协约阵营以牟取暴利。靠着这几年与圣杯的军火贸易，樱花国的工业扩张进入了一个相当长的黄金时期，重工业在战争的带动下飞速发展。但这也不全是好事——财阀政治的坏处开始涌现出来，在他们的带动下樱花本国的金融资本对军事工业趋之若鹜，他们似乎都没有意识到这场战争结束之后他们所制造的军火价值将一落千丈。当时正值一次大战最为白热化的阶段，一箱武器带来的利润甚至远超百匹棉布。樱花国开始近乎疯狂的产出军备，轻工业发展遭到了相当程度的忽视。\n西南战争的爆发长久以来被认为是社会底层矛盾激化的直接后果，但这并不准确：在早期成立的樱花总劳联（后樱花共产党）与樱花历史上第一个在野政党自由党的鼓动之下，最低工资法案与福利法得到颁布。起始的左翼政治运动得到了初步胜利，他们与民权主义者的联盟也建立起来。\n问题仍然要追溯至民族矛盾上。在做法堪称残暴的最初的维新联盟时期结束后，留守内阁的保守性与软弱性致使他们无法像十年前一般坚决镇压民族主义者。保皇派的论调更是在这个时期开始尘嚣甚上。他们仍然对维新政府的作为感到失望——尤其是樱花国同意将琉球岛租借给圣杯王国之后。与他们立场一致的还有未能乘东风把持财政大权的一众封建贵族。他们因为藩国制的废除直接失去了财政来源与统治权。一些对民权运动不以为然的旧佃农与市民也仍然寄希望于至高的天皇回归京都，整肃败相。在这样混乱的政治布局下，基层的统治秩序实际上已经处于半内战的边缘。工人代表与演说家将暴民描述为“无知的反动派拥趸”，而重新穿上旧日服饰的旧武士英灵则打出“皇政复古”的口号，开始聚集支持者。这样的乱象开始在全国各地上演。\n最终，1917年，这场内战意外在九州岛爆发，最先举起义旗的是萨摩氏的旧武士们，很快这场内战再一次分裂了整个樱花——九州与四国岛沦陷，政府军仅能做到坚守门司城没有被攻破。\n在巨大的政治压力下，留守内阁在一片嘘声中正式宣布组织选举，并于1917年7月30日解散。取而代之的是自由党与总劳联的执政联盟。共和国开始筹措反攻，并最终于1919年9月30日结束了这场旷日持久的内战。\n\n\n\n§Y樱苏战争§!\n\n一次大战已经结束，协约国旋即着手准备针对新生的苏维埃俄国以及其盟友的武装干涉计划。在这样的背景下，圣杯王国再一次向樱花国提出请求，希望后者能派兵参与干预部队。尽管在身陷内战的情况下坚持履约也许并不明智，但自由党内阁仍然力排众议批准了远征军计划。考虑到政治因素，新政府用更多动员起来的民兵武装接替了前线的正规军部队以为九州征伐之主力，被撤回的现有正规部队部分被派遣北上登陆库页岛，大部则临时改组为远东干预第一远征军。1919年3月，第一远征军从朝鲜登陆，他们的任务是与协约国的干涉部队及神州帝国仓促组建的北伐军北上西伯利亚，彻底剿灭远东共和国与西伯利亚红军武装。\n然而，东北军队准备不足，补给匮乏，军心散乱。在西伯利亚冰原被红军驱赶着溃退回国境线内，而不知情况的协约国联军在海参崴以北约50公里的丘陵内遭遇了红军部队，在帝国军队溃散的当下，干涉军多面受敌，进攻失利，被迫撤回海参崴，并在此地与远东联军陷入对峙。\n随着20年中旬欧洲白卫军被彻底逐回乌克兰，苏俄内战走向尾声，布尔什维克红军主力开始东进剿灭高尔查克匪帮。内战结束的新政府不再对远东的军事干涉抱有信心，命令远征军南撤回国。圣杯只能默许樱花干涉军脱离联军，但他们拒绝让樱花军队自海参崴撤离，理由是这样会对联军士气造成毁灭性的影响——尽管不过半年和议就将达成。"

  JAP_loca_his_t_06: "文官政府"
  JAP_history_page_06: "\n\n§Y朝鲜战争§!\n\n神州帝国在北方的惨败在朝鲜地区引发了连锁反应，彼时朝鲜王国已经兴兵独立，神州军队无力征讨。独立后的朝鲜国王拒绝为樱花军队借道，当然这是合情合理的：樱花军队完全能从海路离开本土，没有必要渡过朝鲜海峡。神州帝国也颇为强硬地拒绝了樱花的入境请求，蒋瀚宸害怕樱花假道伐虢。对东北做出不利之举。\n某种程度上讲，神州帝国的担心成真了。远征军统帅（）眼见归乡无路，在报告东京之后率军强行越过了鸭绿江。这支孤军无人策应，补给无源，他们一路掳掠，目标直指平壤。朝鲜军队随即集中兵力，试图以军力优势阻止南归的樱花军团。但一方是承平日久且专业化程度低下的民兵军队，另一方是久经战阵的现代化军队。战斗结果可想而知，樱花军连战连捷，一路烧杀掳掠，最终进入了平壤城。\n在意识到朝鲜军队孱弱不堪后，远征军的目的随即改变。而在发现国际社会似乎无人关注朝鲜战事时，在新内阁因首相病逝而混乱不堪的当下，自由党内阁无视了社会主义者的反对意见批准了远征军南下的军事行动。这意味着东京下定了战争决心，正式向朝鲜挑起战事。神州帝国自然对樱花国入侵藩属的行为大为愤怒，但被重创的新军让帝国无法做出任何口头外的干预。\n1920年12月，在本土派来的援军支持下，樱花远征军一路南进，最终突袭并攻克了汉城，俘虏了来不及逃离的朝鲜王室。战争的顺利在某种程度上应当归因于协约国的默许态度。他们需要樱花国在远东与苏俄分庭抗礼。两个月后，在汉城建立的傀儡政府标志着大韩民国的成立。作为一次大战给樱花带来的礼物，朝鲜半岛在短短半年的时间内彻底易主。樱花自此成为远东角力的一员。苏联依靠军事胜利确保了其享有的中东路权益，但樱花军队可以在更近的位置对奉天施加压力。圣杯王国似乎在这时才意识到，它已无法取代樱花国继续在东北地区对抗苏联的影响。\n不再有余裕国力干涉远东地区的圣杯王国于1926年第二次与樱花协商修订了《樱花国防卫条约》。经过不懈的外交努力，圣杯被迫将琉球的归还期提前至1936年以维持与樱花共和国的军事通行权与贸易特惠。强大的樱花国海军取代了太平洋舰队成为苏维埃联盟在远东的心腹之患，双方在库页岛的问题上更是矛盾重重。\n\n§Y文官政府§!\n\n西南战争宣告结束。天皇流亡海外，而九州的保皇派支持者遭到了疲惫不堪的政府军自发进行的劫掠行动——数十年前的惨剧在南方重又上演。不幸的是，在同年7月16日，第一任樱花国首相板垣退助病逝。失去了共同敌人的左右两派宣告分裂，总劳联重组为樱花共产党。期间也有相当多的小型政党建立，甚至是极右翼党派也在国立议会有着一席之地。随着二十世纪20年代军队国家化原则的基本确立，军队的宗族主义倾向大部去除，这也标志着樱花国的文官政治正式建立。随之而来的是一系列民主原则的确立：言论自由、开放市场、保障个人权利……\n战争结束后的数年对于樱花来说是苦涩的，他们必须在平复内战伤口的同时承担工业发展失衡的后果，数个财阀家族在战争结束之后资金链断裂而退出舞台，这在一定程度上给樱花国内的新企业起步和发展提供了一个窗口期，这个问题在20年代开始缓解，但樱花经济的黄金时代已一去不复返。\n1926年，旧新选组成员冲田总司宣誓就职首相，开始了自由党内阁可能将是樱花历史上执政最久的一个时期。在这十年间反西方势力在民主原则的庇护下一次抬头——一些老派极右翼论者在民间再次开始传播极右翼言论，一些为他们背书的政治家也多有得势。甚至一些极右翼立场军事将领也很乐意与他们合作。天皇玲也静静等待着重建帝国的机会。他们很快就将把握一个关键节点——圣杯将面临向樱花国归还冲绳岛的处境，很显然他们无意将这块租借地拱手让出。维新战争也好，西南战争也罢，樱花的民族主义者仍然不会屈从于西方派的暴力之下。但若是找不到一个像样的原爆点，他们就不得不将坐看积蓄已久的民族情绪黯然退潮。\n\n"
  
  JAP_start_game_text: "§Y天皇万岁！§!"

  JAP_fascism_end_title: "至此，§F[JAP.Getname]§!的征途告一段落"
  JAP_fascism_end_tip: "随着§F[JAP.Getname]§!成为§Y大东亚战争§!中无可争议的胜利者。任何阻拦在泛亚事业的蛆虫均已在天皇陛下的意志下化为齑粉。\n\n§F八纮一宇§!之梦业已实现，§Y天皇陛下§!不再仅仅只是天照大国的制裁者，自东京升起的旭日照耀着整个亚洲的臣民。照耀着夹杂密林与雪地的亚太大陆，照耀着波光粼粼的太平洋....\n\n自海上而来的白种人们狼狈地仓皇地，自海上而去，而她们的命运，也不过只在天皇陛下的一念之间....\n\n当然，另一种意义上说，只在您的一念之间....\n\n"
  JAP_fascism_end_tip_2: "感谢游玩钢铁萌心。"
  JAP_fascism_end_close_button: "七生报国，万岁！"
  JAP_fascism_end_close_button_TT: "§R帝国永远不会忘记那些为实现大东亚共荣而献身的英灵。§!"

  JAP_communism_end_title: "至此，§R[JAP.Getname]§!的征途告一段落"
  JAP_communism_end_tip: "从东京的街头到马尼拉的港口，从德里的工厂到雅加达的种植园，旧世界的锁链已被§R无产阶级革命§!的洪流冲垮。§R[JAP.Getname]§!作为亚洲革命的先锋，已将§t赤旗§!插遍了这片大陆的每一个角落。 \n\n我们不仅推翻了本土的§F财阀§!与§F军阀§!，更点燃了整个亚太地区的解放之火，与各国同志共同建立起§N泛亚革命阵线§!。曾经被帝国主义奴役的亿万人民，如今都已站立起来，成为自己命运的主人。 \n\n\n§R“全世界被压迫民族和被压迫人民，联合起来！”§! \n我们将在革命的道路上继续前进，直到共产主义的曙光照亮全球，永无止境！"
  JAP_communism_end_tip_2: "感谢游玩钢铁萌心。"
  JAP_communism_end_close_button: "红色亚洲万岁！世界革命万岁！"
  JAP_communism_end_close_button_TT: "§R将共产主义的理念播撒到世界的每一个角落，彻底埋葬帝国主义和资本主义的残余。§!"

  JAP_democratic_end_title: "至此，§C[JAP.Getname]§!的征途告一段落"
  JAP_democratic_end_tip: "当§C文官政府§!在风暴中堪堪屹立之际，没有人觉得一地鸡毛的弹丸之国能够取代欧洲人的意志，在亚太中心竖起§Y独立§!与§R解放§!的旗帜。\n\n当§R红军§!从西伯利亚的草原席卷而来之际，当§B皇家海军§!再一次骄傲的航行在亚洲人的航路之际，没有人觉得陈旧且老式的东方军队能够阻挡来自欧洲最新的、最为凶猛的战争机器。\n\n而现在，任凭高傲的白种人如何找补，她们改变不了现实，民族解放的浪潮已经彻底淹没印度洋上的王冠。\n代表着民族自决与联合的砧锤在您的指挥下一步步将编织百年的殖民主义之网砸的千疮百孔。\n§C透过那缺口看去，能够看见的，是新时代的光芒。§!"
  JAP_democratic_end_tip_2: "感谢游玩钢铁萌心。"
  JAP_democratic_end_close_button: "为了和平与自由！"
  JAP_democratic_end_close_button_TT: "§G亚太各民族的独立自主是本区域长治久安的唯一基石。§!"

 JAP_route_guide_desc:0"首次游玩樱花国不建议看路线指南，除非有特别想玩的路线。\n进错了线之后再看路线指南是作者认为比较提升游戏体验与代入感的好方法。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n↓路线指南在下面↓\n\n\n\n\n\n如果不想让总司死亡，需要在前期事件中不与陆军有任何妥协，也不能动用任何陆军的力量。\n\n§P新事件链（冲田总司遇刺身亡）§!路线指南：\n\n§B蓝线§!（圣杯的狗）：如果想让冬马走加圣杯路线，需要在宣布国家进入紧急状态之后寻求海军的帮助，该选项前提是在前期事件中不激怒海军。如果想让雪菜走加圣杯路线，同样需要此前不激怒海军，之后在建立举国一致内阁的事件中就会出现选项“宪政还得继续，民主得以存续”。\n\n§C蓝线§!（天皇复辟）：如果想让冬马走天皇复辟线，需要在事件中选择“呼吁各方克制”，然后选择“接受天皇的提议”即可。雪菜不能走这条线。\n\n§R红线§!：在前期事件中不要激怒共产党，冲田总司被暗杀后宣布国家进入紧急状态，然后寻求共产党帮助即可。\n\n§Y黑线§!：有多种进入方式，最快捷的是选择“宣布国家进入紧急状态”，之后在陆军密谋政变事件中选择“我们无能为力”。\n\n以下为§0旧事件链（决定未来的一个月）§!路线指南：\n\n§C蓝线§!：关于共产党提案的事件选择“假意接受提案”，之后在“忍无可忍”事件中就只会有“兵变被镇压”一个选项，选择之后便可进入蓝线。如果要走冲田总司线，需要在此之后根据提示完成国策树右上角的内阁独有国策，同时在事件“天皇密信”中不要交出权利，否则内阁线国策将会被锁定。\n\n§R红线§!：关于共产党提案的事件选择“拒绝共产党的提案”，关于天皇的事件选择“天皇回归是迟早的事”，之后在“忍无可忍”事件中会出现选项“共产党从兵变中看到了机会...”，选择后进入红线。注意，红线必定内战。\n\n§Y黑线§!：关于共产党提案的事件选择“批准共产党的提案”，关于天皇的事件选择“天皇已经是过去式了”，之后在“忍无可忍”事件中会出现选项“然而，有人利用了兵变...”，选择后进入黑线。\n"
