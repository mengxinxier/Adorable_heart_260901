 jap.53.t:0"处置外星人"
 jap.53.d:0"佐仓玲子站在不明飞行物残骸旁，头灯照亮一小群身影——自称“真日本帝国”的外星人军官。她们的制服虽破损，却带有熟悉的樱花纹饰，容貌与樱花国人惊人相似。领头的东乡毅，目光坚毅，语气中透着疲惫却不失威严：“我们是真日本帝国的幸存者，与你们同属大和民族。我们的天皇在坠落中失踪，但看到你们的樱花国，我们愿加入你们，共同寻找她。”他的声音低沉，带着一丝恳切。\n\n玲子紧握步枪，警惕地观察这些外星来客。她注意到她们的武器与装备虽先进，却因坠毁而残破不堪。东乡毅身后的军官们神情复杂，有的低头默哀，有的眼神中燃着希望。玲子低声向指挥官报告：“她们自称是大和民族，技术远超我们，但现在毫无威胁。东乡毅似乎真心想合作。”指挥官沉默片刻，点头同意。\n\n驻军迅速行动，为外星军官提供临时营地。玲子协助安置，观察到她们的纪律严明，甚至在简陋的帐篷中仍保持军姿。东乡毅主动交出部分残骸中的技术资料，声称愿与樱花国共享，以换取寻找天皇的支援。玲子翻阅资料，惊叹于其中记载的能量武器与推进系统，内心却隐隐不安：“她们的天皇……会给我们带来什么？”她低声自语，目光投向雪夜中的残骸。\n\n东京方面接到报告，政府高层震动，紧急讨论如何利用这些外星盟友。北海道营地内，佐仓玲子与东乡毅并肩而立，凝视远方的雪林。"
 jap.53.a:0"将她们纳入麾下"
 jap.53.b:0"我们不能接受"
 jap.54.t:0"不明飞行物降落在北海道"
 jap.54.d:0"北海道的天空在清晨泛着微光，寒冷的薄雾笼罩着雪原。年轻的驻军通讯兵佐仓玲子正站在瞭望塔上，揉着冻僵的手指，望向远处的森林。突然，一道刺眼的光团划破天际，伴随着低沉的轰鸣，坠入远处的雪林。玲子瞪大眼睛，抓起通讯器，声音急促：“报告！有不明物体坠落在北区，绝不是飞机！”她的声音在寒风中微微颤抖，夹杂着震惊与好奇。\n\n驻军迅速行动，士兵们荷枪实弹，冒着风雪奔向坠落地点。玲子被编入搜索小队，跟随部队深入森林。现场一片狼藉，雪地上散落着金属碎片，散发着诡异的微光，中心是一个深不见底的坑洞，周围的树木被高温烧焦。玲子皱眉，低声嘀咕：“这东西……不像任何国家的科技。”她小心翼翼地记录现场，注意到碎片上刻着奇异的符号，散发着淡淡的热量。\n\n当地驻军的指挥官下令封锁区域，禁止任何消息外泄，但目击者的传言已在北海道的小镇中流传开来。酒馆里，渔民们低声议论，称那光团“像是天外的来客”。玲子回到营地，翻看着手绘的草图，内心不安。她向长官报告：“村民们开始恐慌，谣言说这是外星人的入侵。”长官皱眉，命令加强巡逻，同时上报东京。\n\n东京的政府大楼内，关于不明飞行物的报告引发激烈争论。有人认为是敌国的秘密武器，有人猜测是未知的自然现象。玲子虽未参与高层会议，却在营地听到了风声：政府正考虑派遣专家调查，而驻军已被要求严守秘密。北海道的雪夜中，坠落点的光芒依旧闪烁，佐仓玲子站在瞭望塔上，凝望远方，隐隐感到一股未知的风暴正在酝酿。"
 jap.54.a:0"不要大惊小怪"
 jap.55.t:0"寻找能量源"
 jap.55.d:0"佐仓玲子站在驻军营地的瞭望塔上，寒风刺骨，她紧握望远镜，目光锁定远处的雪林。几天前不明飞行物坠落的消息已传遍军营，最新情报显示，坠落点散发出一股巨大的能量波动，仪器检测到异常的辐射信号。玲子咬紧嘴唇，低声自语：“这东西……绝不是普通陨石。”她的笔记本上满是手绘的符号，记录着坠落点的诡异碎片。\n\n驻军指挥部下令展开全面搜索，玲子被编入一支精锐小队，深入森林追查能量源的位置。雪地中，士兵们踩着厚重的军靴，探测器发出刺耳的蜂鸣，指向坠落点深处的坑洞。玲子小心翼翼靠近，注意到坑洞边缘的雪融化成水，空气中弥漫着微弱的金属气味。她的探测仪指针剧烈晃动，屏幕显示能量读数远超常规：“长官，这能量源不稳定，像是活的一样！”她的声音带着一丝不安。\n\n搜索小队在雪林中穿梭，能量波动的信号时强时弱，像是故意躲避追捕。玲子紧跟队伍，靴子深陷雪中，脑海中闪过村民的传言：有人声称看到光团移动，甚至听到低语般的怪声。她低头检查设备，试图捕捉信号源，却发现仪器偶尔失灵，仿佛被某种力量干扰。夜幕降临，能量源的踪迹仍未锁定，驻军只得暂时撤回，留下警戒哨。\n\n回到营地，玲子在昏暗的灯光下整理笔记，眉头紧锁。她向指挥官报告：“那东西在移动，像是……有目的性。”指挥官沉默片刻，下令上报东京，要求增派专家与重型设备。北海道雪夜中，能量源的微光在远处若隐若现，佐仓玲子凝视窗外，心中涌起一股莫名的不安，未知的谜团正悄然逼近。"
 jap.55.a:0"派遣更多专家，必须查明真相！"
 jap.56.t:0"外星飞船残骸"
 jap.56.d:0"佐仓玲子跟随驻军小队，踏着厚雪，抵达了能量源的所在地。森林深处，坠落点赫然在目——一具庞大的不明飞行物残骸，扭曲的金属壳体嵌在雪地中，散发着微弱的蓝光。玲子瞪大眼睛，手中的探测仪指针剧烈抖动，信号指向残骸的核心。她低声惊叹：“这东西……完全不像人类造的。”残骸表面布满奇异的刻痕，破损的舱体冒着淡淡的蒸汽，空气中弥漫着刺鼻的金属气味。\n\n驻军迅速封锁现场，士兵们围成警戒圈，枪口对准残骸，防备未知的威胁。玲子小心靠近，靴子踩在融化的雪水上，记录着残骸的细节：断裂的结构露出复杂的电路，核心区域的能量波动依然强烈，但已趋于衰减。她向指挥官报告：“能量源就在残骸内部，但它似乎在自我耗尽。没有明显生命迹象，可我感觉……我们得找找有没有幸存者。”她的声音带着急切，目光扫过残骸的裂缝，试图寻找任何活物的线索。\n\n指挥官点头，下令小队展开搜索。玲子与几名士兵钻进残骸的破损舱体，头灯照亮幽暗的内部。金属通道扭曲变形，墙壁上闪烁着未知的符号，空气中回荡着低沉的嗡鸣。玲子紧握步枪，心跳加速，每一步都小心翼翼。残骸深处，一台破碎的装置仍在微微发光，像是某种控制核心，却没有生物的踪影。她低声呢喃：“如果有幸存者，他们可能已经离开……或者，根本不是我们能理解的生命。”\n\n东京的命令很快传来，要求保护残骸并寻找任何可能的幸存者。北海道雪夜中，佐仓玲子站在残骸旁，凝视那微弱的蓝光，心中不安愈发强烈。未知的谜团如雪花般堆积，樱花国的命运似乎与这残骸紧密相连。"
 jap.56.a:0"先别着急，看看她们有没有什么要说的"
 jap.56.b:0"我们必须继续寻找幸存者"
 jap.56.c:0"切换到真日本帝国游玩"
 JAP_xiaomiewaixingren:0"消灭外星人"
 RJE_allice_JAP:0"和平共处"
 RJE_allice_JAP_desc:0"我们应该想办法回到自己的宇宙，而不是在这里寻求扩张，也许樱花国可以帮助我们。同样，我们也会给予她们一些补偿。"
 jap.57.t:0"左翼浪潮的威胁"
 jap.57.d:0"东京的内阁会议室中，昏黄的灯光映照在冲田总司疲惫的脸上。她揉着额角，面前堆积着关于极端左翼分子的报告。冬马和纱斜靠在椅背上，语气中带着不耐：“这些左翼分子越来越猖狂，炸弹、传单、地下集会……再不强硬处理，民众会被他们的反西方口号煽动！”她的手指敲击桌面，眼中闪过一丝急躁。\n\n小木曾雪菜低头翻阅文件，语气迟疑：“可他们的支持率确实在涨，尤其是年轻人……我们若处理不当，恐怕会激起更大反弹。”她抬头看向冲田总司，试图寻找指引，但冲田只是沉默，眼神游移，似在权衡各方后果。\n\n冬马和纱猛地起身，声音拔高：“流放！把这些麻烦的左翼分子全送到韩国去！那是我们能掌控的地方，让他们在那闹腾，省得在本土生乱！”她的提议激进，带着不容商量的气势。小木曾雪菜皱眉，反驳道：“流放只会让问题外溢，韩国那边本就不稳。若是终身监禁，至少能控制局面，还不至于引发民怨。”她的声音虽轻，却透着谨慎。\n\n冲田总司双手交握，目光在两人间游移。她低声开口：“公开处刑……会不会太极端？可若直接释放，又会显得我们软弱……”她的语气犹豫，透露出内心的挣扎。冬马和纱冷笑：“释放？那等于向左翼示弱！他们会更肆无忌惮！”小木曾雪菜却摇头：“处刑会让政府背上暴虐的骂名，冲田，我们得冷静。”"
 jap.57.a:0"将监狱里的左翼分子流放到韩国去！"
 jap.57.b:0"终身监禁就好了"
 jap.57.c:0"全部公开处刑！"
 jap.57.e:0"放了她们吧"
