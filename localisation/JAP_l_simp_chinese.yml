 jap.64.t:0"来自意呆莉的使团"
 jap.64.d:0"一支来自意呆莉的外交使团来到樱花国，她们代表轴心国表明了德意两国对我国的友好态度，并且希望我们也能加入到对抗魔导国的队列中来。"
 jap.64.a:0"我有个提议"
