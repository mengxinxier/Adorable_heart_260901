 JAP_rw_qinhua_desc:0"军队已经无法掩盖她们对征服神州的渴望，即使政府不为所动，她们也有办法被迫将我们卷入战争..."
 jap.78.t:0"陆军要求对神州采取行动"
 jap.78.d:0"陆军中的狂热军国主义者再也压抑不住对征服神州的野心，她们的呼声如烈焰般席卷军部。会议桌上，地图摊开，中原的疆域被反复圈点，军官们眼神炽热，催促政府尽快备战。她们宣称，神州的资源与土地是樱花国崛起的基石，拖延只会错失良机。街头巷尾，军国主义的宣传单四散，鼓吹战争的口号愈发高涨，民众的情绪被悄然点燃。皇宫外，军靴声隐约可闻，战鼓似乎已在边境敲响。"
 jap.78.a:0"又要下克上了吗？"
 JAP_rw_nanxia:0"§C议程§!：§R南下计划§!"
 JAP_rw_nanxia_desc:0"我们非常需要东南亚的丰富物资来支撑我们的战争机器，海军深知这一点。"
 jap.79.t:0"海军要求南下"
 jap.79.d:0"海军将领们在会议室中齐声高呼，帝国的未来系于东南亚的丰饶资源，他们的渴望如潮水般汹涌。摊开的航海图上，东南亚的岛屿被圈定为战略要地，舰队指挥官们目光如炬，力陈南下夺取资源区的紧迫性。他们宣称，石油、橡胶与矿藏是樱花国称霸的命脉，错过时机将让帝国陷入被动。"
 jap.79.a:0"起码她们没有陆军那么无脑"
