 JAP_new3_desc: "万幸民主得到了拯救，接下来我们将消除政府内的军国主义影响。"
 JAP_new4: "军部政变"
 JAP_new4_desc: "懦弱的文官政府不配掌控我们的国家！武士必须将命运把握在自己手中！"
 JAP_new5: "谈判破裂"
 JAP_new5_desc: "民主政府否定我们一切，那我们就必须武力夺取这一切！"
 JAP_new6: "危机边缘"
 JAP_new6_desc: "军国主义者正在配合民主政府镇压我们的同志，情况紧急，时不我待。"
 JAP_new7: "转移阵地"
 JAP_new7_desc: "是时候将同志们集结起来了，随时做好武力斗争的准备。"
 JAP_new8: "拉拢军部"
 JAP_new8_desc: "一些左翼军官混杂在军国主义者中，她们只是因反对西方政府而被迫加入了右翼集团，现在这些潜伏的同志们可以回归了。"
 JAP_new9: "引爆炸弹"
 JAP_new9_desc: "一切都已准备就绪，革命必将胜利！"
 JAP_new10: "革命胜利"
 JAP_new10_desc: "我们成功了！但我们的国家需要一段时间来恢复。"
 JAP_new11: "抓捕皇室"
 JAP_new11_desc: "此前天皇已经被军国主义者秘密保护着，我们必须逮捕这些旧时代的残党！"
 JAP_new12: "文官政府的命运"
 JAP_new12_desc: "我们给过文官政府和平解决问题的机会，但她们却对我们赶尽杀绝，是时候决定这些人的命运了。"
 JAP_new13: "清洗军国主义者"
 JAP_new13_desc: "军国主义会将我国带入深渊，对待这些人不必手软。"
 JAP_new14: "战后重建"
 JAP_new14_desc: "我们需要花费一些时间重建国家。"
 JAP_new15: "没收财阀资产"
 JAP_new15_desc: "财阀在我国的政治与经济领域上有着近乎无限的力量。今天，这将成为历史。国家将控制一切！"
 JAP_new16: "软硬兼施"
 JAP_new16_desc: "对待非强硬派，我们应该采取较为柔和的措施，使她们接受如今的现实。"
 JAP_new17: "反对激进主义"
 JAP_new17_desc: "一些同志在与他国同志的接触中染上了极端主义思想，这些激进的想法是不被允许的，我们必须及时教育她们回头。"
 JAP_new18: "全党整风运动"
 JAP_new18_desc: "樱花共产党已经不再是之前那个被迫依附于西方政府的小党派，我们必须改革党内部分同志残留的一些小毛病。"
 JAP_new19: "集体化进程"
 JAP_new19_desc: "我国的集体化必须开始进行，这将是第一步。"
 JAP_new20: "农业合作社"
 JAP_new20_desc: "在土地改革初见成效后，农业合作社能让我国的集体化更进一步。"
 JAP_new21: "四年计划"
 JAP_new21_desc: "我国应该设立一个国家发展规划，来确定我国未来的发展道路。"
 JAP_new22: "东亚赤色灯塔"
 JAP_new22_desc: "我国是亚洲一颗闪亮的红色灯塔，必须建设强大的军队来解放其他还在饱受折磨的东亚友国！"
 JAP_new23: "加入共产国际"
 JAP_new23_desc: "加入共产国际与苏联一同对方西方世界是最佳选择。"
 JAP_new24: "亚太革命阵线"
 JAP_new24_desc: "我国应该建立属于自己的阵营，创建一个亚洲人的共产主义联盟。"
 JAP_new25: "支援中国革命"
 JAP_new25_desc: "中国共产党的处境仍然不够乐观，但只要我们工人团结一致，一定能走向亚洲革命的未来！"
 JAP_new26: "解放西方殖民地"
 JAP_new26_desc: "东南亚被西方殖民了许久，如今我们将给她们带去自由！"
 JAP_new27: "传播革命到北美"
 JAP_new27_desc: "北美的共产党人战败了，但我们将挺身而出！"
 JAP_new28: "全球革命"
 JAP_new28_desc: "革命不会停下，直到赤旗覆盖全球，迎来全世界被剥削者的解放和共荣！"
 JAP_new29: "安抚共产党"
 JAP_new29_desc: "共产党一直是我们最重要的盟友之一，优先安抚她们的情绪以确保我们在政府内的多数支持。"
 JAP_new30: "与财阀合作"
 JAP_new30_desc: "财阀控制了国内大部分财富，我们必须和她们打好关系。"
 JAP_new31: "遵守与海军的承诺"
 JAP_new31_desc: "海军为文官政府提供了诸多支持，我们必须回报她们。"
 JAP_new32: "确保各党派支持"
 JAP_new32_desc: "我们必须团结任何可以团结的小党派，不然樱花国将万劫不复！"
 JAP_new33: "秘密联络天皇"
 JAP_new33_desc: "许多军国主义者受到天皇的暗中支持。虽然明面上政府为了与圣杯交好抵制天皇势力，但我们必须告知天皇陛下一点：只有民主政府才能使樱花国走向繁荣。"
 JAP_new34: "扩大军队支持"
 JAP_new34_desc: "军部并不全是疯子，把她们之中的理智派拉拢到我们这边，以确保接下来的行动顺利。"
 JAP_new35: "清洗军国派"
 JAP_new35_desc: "是时候清洗政府内的军国主义者了，在此之后樱花国便可走向稳定。"
 JAP_new36: "维持现状"
 JAP_new36_desc: "我们派往圣杯王国的使节为更进一步的合作打开了可能性的大门，包括可以为工业进一步发展提供资金的贷款，与西方交好百利而无一害！"
 JAP_new37: "迎回天皇"
 JAP_new37_desc: "民族骄傲和对战争的支持激励了每一个天皇的子民，驱使他们达到为国献身的新高度！文官政府必须在这点上妥协！"
 JAP_new38: "加强自由主义"
 JAP_new38_desc: "自由！在大部分亚洲国家还水深火热时，樱花国的人民就已经品尝了自由的芳香！"
 JAP_new39: "英灵特殊地位"
 JAP_new39_desc: "由于我国与圣杯王国的特殊关系，再加上我国国内也有大量本土英灵，英灵将被优先征兵入伍。"
 JAP_new40: "改进东亚条约"
 JAP_new40_desc: "樱花国作为东亚地区的领头羊，有能力和义务重新规划东亚格局。"
 JAP_new41: "支持保守主义"
 JAP_new41_desc: "我国还是应该保持较为保守的姿态较好，过于强调自由是毫无意义的。"
 JAP_new42: "宣告樱花帝国"
 JAP_new42_desc: "随着天皇回归，我国国号也该正式改为樱花帝国。"
 JAP_new43: "改善娼妓行业"
 JAP_new43_desc: "娼妓行业为我国带来了不菲的收入，如果能善加利用的话..."
 JAP_new44: "限制军部权利"
 JAP_new44_desc: "军部在过去的几年里多次越权，必须对此严格限制！"
 JAP_new45: "与军国主义者的联盟"
 JAP_new45_desc: "残余的军国主义者因我们的仁慈而逃过一劫，如今天皇已经获得正统地位，她们只得臣服。"
 JAP_new46: "消灭娼妓行业"
 JAP_new46_desc: "娼妓行业是国家的耻辱，我国还没有到必须依靠娼妓行业来维持经济的地步。"
 JAP_new47: "加入圣杯同盟"
 JAP_new47_desc: "事实证明加入西方强权的势力圈才是亚洲国家的唯一出路。"
 JAP_new48: "西太平洋公约"
 JAP_new48_desc: "西方帝国主义者逐渐显露出了她们的真面目，我们应该建立属于自己的阵营，创造一个真正自由民主的亚洲！"
 JAP_new49: "东亚守护者"
 JAP_new49_desc: "我国作为亚洲最先进强大的国家，有义务保护其他亚洲国家免受西方帝国主义侵蚀。"
 JAP_new50: "反共壁垒"
 JAP_new50_desc: "虽然樱花共产党也是政府内的大党之一，但那与国家的反共立场是两回事：樱花共产党早就被改造为了一个和平的左翼政党，与西方的社民党相似。而外国的共产主义者可远没有的樱花的这么友善。"
 JAP_new51: "朝鲜的命运"
 JAP_new51_desc: "我们应该在朝鲜举行一场公投来决定她们的命运，这是一场绝对民主的投票，一切遵从民意。"
 JAP_new52: "中原代理人"
 JAP_new52_desc: "我们需要一位来自神州的盟友来确保我们的在华利益，内阁认为神州帝国或者奉系是我们的最佳盟友。虽然神州帝国腐败不堪，但她们作为中原正统政府，其工业与军队都还是最强大的。至于奉系则是在地理上与我国更加接近，也更方便进行各类援助。"
 JAP_new53: "对苏有限战争"
 JAP_new53_desc: "我们国家是抵御布尔什维克主义的盾牌，保护东方不受共产主义的影响。我们必须以自豪的态度来承担这一责任，并准备在必要时诉诸武力。"
 JAP_new54: "反殖民运动"
 JAP_new54_desc: "圣杯帝国和其他西方势力的殖民地是我们主要绊脚石，必须阻止圣杯英灵继续盘剥亚洲的资源，如果她们拒绝和平离开亚洲，那我们将用武力请她们离开！"
 JAP_new55: "插手中原大战"
 JAP_new55_desc: "中国的各方势力已经打成一团，是时候帮助我们的中国盟友收拾残局了！"
 JAP_new56: "宣告击破帝国主义"
 JAP_new56_desc: "我国成功维护了亚洲，消灭了所有西方帝国主义势力！"
 JAP_new57: "收拾残局"
 JAP_new57_desc: "迅速行动，清扫剩余的亲西方成员。"
 JAP_new58: "掌控财阀"
 JAP_new58_desc: "财阀再怎么样也是人，在我们特高科的监视下，她们无法逃出这个国家。不过我们也不会把她们怎么样，只要她们服从天皇的命令就好。"
 JAP_new59: "恒明维新"
 JAP_new59_desc: "天皇身为幕府傀儡的时代早已过去，他必须直接统治这个国家。只有这样天皇才能比肩欧洲帝王，并带领我们与之对抗。"
 JAP_new60: "狂热军国崇拜"
 JAP_new60_desc: "那些认为军队仅仅是必要之恶的人在面对战争时必然犹豫不决。我们的文化中将根植入军国主义从而全民皆兵。"
 JAP_new61: "帝国动员令"
 JAP_new61_desc: "帝国需要任何子民为之献身，大东亚之梦必将实现！"
 JAP_new62: "樱花国民至上"
 JAP_new62_desc: "我国是亚洲最强大的国家，同时也先于其他国家步入了现代，亚洲必将由樱花国统治！"
 JAP_new63: "向陆军让步"
 JAP_new63_desc: "随着右翼政府上台，陆军也寻求着更多的权利，我们只能对其做出让步。"
 JAP_new64: "拉拢右翼文官"
 JAP_new64_desc: "文官政府中并不只有无脑追随西方的蠢货，拉拢这些右翼政客将更好的帮助我们治理国家。"
 JAP_new65: "为天皇而战"
 JAP_new65_desc: "民族骄傲和对战争的支持激励了每一个天皇的子民，驱使他们达到为国献身的新高度！"
 JAP_new66: "粉碎左翼抵抗"
 JAP_new66_desc: "现在就是与共产党全面开战的最佳时机，彻底扫清左翼分子！"
 JAP_new67: "规范娼妓行业"
 JAP_new67_desc: "为了我国的战争工业发挥更大功力，我国必须保留娼妓行业，并将其改造为带来更多利润的合法行业。"
 JAP_new68: "国家防卫体制"
 JAP_new68_desc: "[ROOT.GetLeader]已宣布实施“新体制”，将樱花国转型为“国家防卫国家”，全民动员保卫祖国。根据国家动员法，政府将掌控全国一切资源。凭借此体制，帝国将永世长存！"
 JAP_new69: "宣扬东亚共荣"
 JAP_new69_desc: "我们要建立一个强大的亚洲，一个属于亚洲人的亚洲！"
 JAP_new70: "大陆军计划"
 JAP_new70_desc: "完全不够！如果要发动一场全面战争，我国就必须拥有一支更为庞大的军队！"
 JAP_new71: "碧蓝之海"
 JAP_new71_desc: "舰娘是海上的女神，海军需要建造更多舰娘来应对与圣杯王国的命定一战。"
 JAP_new72: "八纮一宇"
 JAP_new72_desc: "八纮一宇，天下一家，此乃樱花之天命，兹不可忘。"
 JAP_new73: "对朝鲜发出最后通牒"
 JAP_new73_desc: "我国已控制了朝鲜半岛很长时间，但现在朝鲜民族自决的呼声日益壮大。我们必须否认他们的自治权，控制在朝鲜的一切利益。"
 JAP_new74: "渗透东北军阀"
 JAP_new74_desc: "满洲的东雪莲是一个不折不扣的野心家，也许我们可以利用她达到我们控制满洲进而侵略中国的目的。"
 JAP_new75: "控制使馆城市"
 JAP_new75_desc: "西方势力并没有我们想象中那么关注这座通往中国的门户，我们的特高科可以轻松渗透这座城市。"
 JAP_new76: "整合朝鲜领土"
 JAP_new76_desc: "我们自古以来与朝鲜族结下了深厚的友谊，两族人民都坚信融合为一个国家才是最好的结果。"
 JAP_new77: "满洲前线建设"
 JAP_new77_desc: "我国与中国之间必有一场恶战，为此我们应该提前做好准备。"
 JAP_new78: "扩建海军船坞"
 JAP_new78_desc: "海军多次催促政府扩充海军军费，为了联合舰队这是值得的。"
 JAP_new79: "山海关事变"
 JAP_new79_desc: "樱花国的资源实在贫瘠，但我们的邻居可是出了名的地大物博。所以，我们所需要做的不过是去他们那“拿”罢了。现在，我们所缺的不过是个借口————让几个有干劲的士兵去做吧。在口实到位之后，无论准备充分与否，天皇陛下都非得同意宣战了……"
 JAP_new80: "粉碎共产主义"
 JAP_new80_desc: "苏联一直会担心他们在对抗魔导国的时候我们会背刺他，她们猜对了。但苏联十分庞大，我们肯定无法完全击败她们。"
 JAP_new81: "袭击南洋资源区"
 JAP_new81_desc: "时机已到，我们将把富饶的西方殖民地占为己有。"
 JAP_new82: "虎！虎！虎！"
 JAP_new82_desc: "夏威夷是太平洋上最重要的战略节点，既然精灵迟早会加入圣杯王国对抗我们，那不如由我们先下手为强。"
 JAP_new83: "与苏联议和"
 JAP_new83_desc: "苏联的庞大虽然没有将我们耗干，但也没必要继续耗下去了。"
 JAP_new84: "在武士的阴影下"
 JAP_new84_desc: "如今我们已经取得了对华战争的胜利，而我们新建立的傀儡政府必须认清现实。"
 JAP_new85: "强迫圣杯议和"
 JAP_new85_desc: "我们在东南亚和印度的战争中付出了巨大的伤亡，继续南下可能并不是个好主意，与圣杯的谈判已经提上日程。"
 JAP_new86: "樱花旗下的新秩序"
 JAP_new86_desc: "我国彻底带领整个亚洲崛起，泛亚之梦终得实现！"
 JAP_new87:0"成立太平洋阵线"
 JAP_new87_desc:0"我们应该效仿欧盟，建立一个集军事，政治，经济于一体的庞大联盟。"
 JAP_new88:0"大萧条"
 JAP_new88_desc:0"来自西方世界的大萧条严重打击了樱花国的经济，政府必须立刻做出对策。"
 JAP_new89:0"紧急缩减军队支出"
 JAP_new89_desc:0"我国军队已经多年没有进行战争了，但军部一直强烈要求保持高军费来应对突发情况，但此刻为了国家经济复苏，政府不得不削减军费。"
 JAP_new90:0"政府提供工作岗位"
 JAP_new90_desc:0"国家必须为失业的群众提供工作岗位来让社会重新步入正轨。"
 JAP_new91:0"强迫财阀发放救济金"
 JAP_new91_desc:0"财阀一直控制着我国经济的命脉，但此刻为了使樱花国摆脱西方大萧条的影响，我们不得不抽调财阀的利益。"
 JAP_new92:0"放手一搏"
 JAP_new92_desc:0"在军费被削减后，奇怪的事情发生了：陆军并未表现出严重不满，但军部一直在以各种理由抽调部队前往朝鲜..."
 JAP_new93:0"与财阀的交易"
 JAP_new93_desc:0"我们不能与财阀彻底撕破脸皮，至少不是现在，巧的是财阀们主动提出了要求..."
 JAP_new94:0"最后期限"
 JAP_new94_desc:0"在总司内阁的迅速行动下，樱花国的经济即将重新复苏。"
 JAP_new95:0"樱花复兴计划"
 JAP_new95_desc:0"樱花国急需复兴，她必须成为真正成为一个现代的工业化国家。"
 JAP_new96:0"国家高速公路"
 JAP_new96_desc:0"我们应该效仿西方建造一条高速公路来连接整座岛屿。"
 JAP_new97:0"挖掘地下资源"
 JAP_new97_desc:0"樱花国资源匮乏，因此我国必须开掘出岛内的所有隐藏资源。"
 JAP_new98:0"扩大九州造船业"
 JAP_new98_desc:0"海军一直是我国最重要的部分，九州的造船厂将在政府支持下进一步扩大规模。"
 JAP_new99:0"正式步入工业化国家行列"
 JAP_new99_desc:0"随着我国工业水平的不断提升，现在我们终于可以自豪的宣布樱花国成为了亚洲第一个现代化发达国家。"
 JAP_new100:0"为先进航空业筹备资金"
 JAP_new100_desc:0"我国航空业发展缓慢，她们需要得到国家的支持。"
 JAP_new101:0"内陆工业建设"
 JAP_new101_desc:0"将我国重要的工业设施放置在内部能有效防止敌人的轰炸或登陆。"
 JAP_new102:0"专注军事生产"
 JAP_new102_desc:0"樱花国的崛起离不开大量的武器装备，樱花国将专注于军事生产。"
 JAP_new103:0"援助韩国建设"
 JAP_new103_desc:0"韩国的经济潜力不容小视，适当的帮助她们是可以被接受的。"
 JAP_new104:0"帝国工业心脏"
 JAP_new104_desc:0"东京与京都是我国的工业心脏，我们必须保护好这两座城市。"
 JAP_new105:0"专业化装备生产"
 JAP_new105_desc:0"通过对装备流水线的升级，我国生产装备的效率更高了。"
 JAP_new106:0"满苏边境防御"
 JAP_new106_desc:0"苏联很有可能在处理完欧洲事务后对我国发动攻击，必须提前做好准备。"
 JAP_new107:0"延后侵华计划"
 JAP_new107_desc:0"主导了奉天事变的石原莞尔大将并不赞同军部急于进攻神州的计划，她认为我国需要优先夺取西方殖民地的丰厚资源，中国各方势力会在期间互相消耗。在那之后帝国再入场才是最佳时机。"
 JAP_new108:0"与苏联签署互不侵犯条约"
 JAP_new108_desc:0"苏联很有可能与魔导国正面开战，我们应该提前签署友好条约来减轻边防的压力。"
 JAP_new109:0"与圣杯王国缓和关系"
 JAP_new109_desc:0"虽然我们最终避免不了与圣杯的宿命一战，但在北进论的主张下，与苏联的战争更为优先。"
 JAP_new110: "陆军扩编"
 JAP_new110_desc: "我国政府必须把即时而大幅的扩军能力作为核心信条之一。"
 JAP_new111: "速战速决"
 JAP_new111_desc: "虽然我国是东亚最强的国家，但我国的国力依然支撑不起一场长期战争，必须统合起所有资源，协调好部队，速战速决。"
 JAP_new112: "重点突破"
 JAP_new112_desc: "盲目的冲锋只会带来失败，但过度的管理则会招致下克上。因此我国需要的是在放任下级部队推进，而总参谋部将专注于攻克关键城市。"
 JAP_new113: "替换旧装备"
 JAP_new113_desc: "我国军队急需装备先进枪械以与潜在之敌相匹敌。"
 JAP_new114: "新式火炮"
 JAP_new114_desc: "尽管我军英勇而凶悍，他们依然需要火力优势掩护推进。"
 JAP_new115: "加强特务机构"
 JAP_new115_desc: "我国对外国的间谍活动是很有必要的，军部必须大力支持这些渗透者。"
 JAP_new116: "武士与坦克"
 JAP_new116_desc: "不少国家已经体验到装甲部队的威力。我们必须不落人后，发展更多先进而有力的装甲载具，以强力而迅捷地打击敌人。"
 JAP_new117: "投资帝国大学"
 JAP_new117_desc: "帝国大学孕育着我国的下一代，她们是未来的希望。"
 JAP_new118: "战斗机现代化"
 JAP_new118_desc: "我们必须在所有领域保持优势，空战也一样。因而先进战机是极其必要的。"
 JAP_new119: "加强宪兵队"
 JAP_new119_desc: "我们必须确保国内的安全与稳定，任何间谍都无处可逃。"
 JAP_new120: "战车道精神"
 JAP_new120_desc: "以西娟代为首的装甲部队军官展现出了惊人的战斗意志，整个樱花军队都应该学习这种品质！"
 JAP_new121: "支持间谍活动"
 JAP_new121_desc: "通过对情报机构的进一步升级，我国将掌握敌人的一举一动。"
 JAP_new122: "大本营训练计划"
 JAP_new122_desc: "我们的下级军官经常犯一些低级错误，这些人必须接受更多的教育！"
 JAP_new123: "研究支援战机"
 JAP_new123_desc: "现代化的支援战机是致胜的关键。"
 JAP_new124: "统一标准飞行器研发"
 JAP_new124_desc: "多年以来，我们受到海军和陆军分开发展战机的困扰。我们需要统一这些方案以确保武器的统一性，更有效率地利用我们有限的研究资源。"
 JAP_new125: "合作或死亡"
 JAP_new125_desc: "我国的陆军企业大多被财阀掌握，然而军部强大的影响力将逼迫她们与政府合作。"
 JAP_new126: "意志至上"
 JAP_new126_desc: "没有灵魂的剑斩不断任何东西；武士手持木剑也能杀人。"
 JAP_new127: "科技至上"
 JAP_new127_desc: "科技带来胜利。为了在军备上超出敌人，我们必须不遗余力发展科技。"
 JAP_new128: "武士道精神"
 JAP_new128_desc: "家国与神道能够在人民思想上灌输七生报国的精神。"
 JAP_new129: "樱花国海军"
 JAP_new129_desc: "我国拥有着世界上数一数二的强大海军，但我们面对的敌人也同样强大。"
 JAP_new130: "提拔海军新秀"
 JAP_new130_desc: "相比起毫无秩序可言的陆军，海军的将官选拔程序更为严苛，能够脱颖而出的必然是国家的栋梁。"
 JAP_new131: "海军训练计划"
 JAP_new131_desc: "海军需要更多训练来迎接未来的战斗。"
 JAP_new132: "航母作战实践"
 JAP_new132_desc: "战列舰已经是旧时代的化石了。我们需要把目光投向未来，而未来属于航空兵。航空母舰将允许我们向太平洋投射我们的力量。"
 JAP_new133: "扩建造船厂"
 JAP_new133_desc: "我国需要更多造船厂来应对未来的大战。"
 JAP_new134: "现代护航舰队"
 JAP_new134_desc: "我们的舰队要求最现代的护卫舰队，不受到敌军潜艇和鱼雷艇的阻碍。"
 JAP_new135: "长枪鱼雷"
 JAP_new135_desc: "全球资源残酷的分配现实令我们的海军数目远远比不上敌军。因此，我们需要开发出世界上最先进的鱼雷。这就是射程超长且威力无穷的九三式酸素鱼雷，它将由压缩氧气而不是压缩空气充当助燃剂，它能够令我军的小型水面舰艇更高击沉吨位远胜于它的战舰。"
 JAP_new136: "扩编海军特别陆战队"
 JAP_new136_desc: "太平洋的海战将大量涉及海军登陆作战。海军特种登陆部队如果要完成任务就必须扩编。"
 JAP_new137: "调用盟友产能"
 JAP_new137_desc: "我们的盟友大多是几乎没有海军的陆权国家。既然如此，我们应该调用她们的造船厂，以实现共同目标。"
 JAP_new138: "终极战舰"
 JAP_new138_desc: "既然我们的资源有限，我们就必须保证有效利用它们。我们将建造有史以来最强大的战列舰，粉碎胆敢阻拦它的一切敌人。"
 JAP_new139: "蔚蓝航线"
 JAP_new139_desc: ""
 JAP_new140: "注重群岛防御"
 JAP_new140_desc: "太平洋岛屿必须被我国牢牢控制，不能让敌人有可乘之机。"
 JAP_new141: "东亚联合舰队"
 JAP_new141_desc: "为了最大限度地发挥攻击威力，我们将把世界上最大规模的航空母舰集中到一个战斗群中。通过发展这种形式的协同进攻行动所需的理论，我们的敌人将不会有任何机会反制我们的海军航空兵。"
 JAP_new142: "太平洋海上霸权"
 JAP_new142_desc: ""
 JAP_new143: "樱花陆战舰娘"
 JAP_new143_desc: "作为实际拥有最多舰娘的国家，我们终于研究出了强大的陆战舰娘：现在舰娘们可以携带正常步兵使用的装备在陆地上作战了！"
 JAP_new144: "日出之樱"
 JAP_new144_desc: "樱花国不会走向终结，武士的末路不会到来。"
 JAP_new145: "苍蓝的誓约"
 JAP_new145_desc: ""
 JAP_new146: "大帝国战争"
 JAP_new146_desc: "我们就不该相信这群所谓的“外星人”！"
 JAP_new147: "重新宣扬正统性"
 JAP_new147_desc: "我们必须重新向群众宣传我国天皇的正统性，民众不能迷信伪帝！"
 JAP_new148: "东京快速布防"
 JAP_new148_desc: "敌人已经兵临城下，我们必须做好防护首都的准备，如果东京失守，天皇将撤去京都。"
 JAP_new149: "紧急国民动员"
 JAP_new149_desc: "时隔多年，樱花国再度迎来大规模内战，全体国民都必须为国献身！"
 JAP_new150: "重新调查飞船"
 JAP_new150_desc: "有必要对这艘可疑的飞船残骸进行二次调查..."
 JAP_new151: "陆海临时合作"
 JAP_new151_desc: "大敌当前，陆军与海军将达成暂时合作，共同对抗入侵者。"
 JAP_new152: "「帝」的谎言"
 JAP_new152_desc: "帝的谎言终会被戳穿。"
 JAP_new153: "假日本国"
 JAP_new153_desc: "所谓“真日本帝国”根本就不存在！"
 JAP_new154: "樱花不落，帝国仍存"
 JAP_new154_desc: "在一切结束后，迎接真日本帝国高层的就只有毫不留情的处决。"
 JAP_new155: "朝鲜起义"
 JAP_new155_desc: "朝鲜已经爆发了由赤匪领导的大规模起义，我们必须迅速镇压！"
 JAP_new156: "赋予临时特权"
 JAP_new156_desc: "政府将赐予总督临时特权，碾碎这些叛乱者！"
 JAP_new157: "下达死守命令"
 JAP_new157_desc: "在本岛援军到来之前，当地守军必须坚持到底！"
 JAP_new158: "恩情不再"
 JAP_new158_desc: "革命终将被粉碎。"
 JAP_establish_nippon_hassoden_mx: "成立樱花发送电株式会社"
 JAP_establish_nippon_hassoden_mx_desc: "为加强政府对国家电力供应的控制与调配，我们应整合全国电力公司，成立统一的樱花发送电株式会社，全面监管电力产业。"
 JAP_yhfsdgs: "樱花发送电株式会社"
 JAP_ministry_of_colonial_affairs_mx: "拓殖省"
 JAP_ministry_of_colonial_affairs_mx_desc: "最初设立为北海道开拓使的拓殖省如今职责已大幅扩展。我们应赋予其更大权限，以妥善管理南洋、朝鲜、樺太、关东与台湾。"
 JAP_sea_promote_japanese_settlement_mx: "鼓励樱花人移民"
 JAP_sea_promote_japanese_settlement_mx_desc: "通过将本国民众迁往满洲，我们可以增加劳动力，从而建设更多工厂。这些移民也能从事农业生产，将农产品运回本土。"
 JAP_establish_the_japanese_korean_army_mx: "扩编朝鲜军"
 JAP_establish_the_japanese_korean_army_mx_desc: "朝鲜军一直作为驻朝鲜的守备部队存在，很少参与作战。我们应废除束缚朝鲜总督府的条约，扩编此部队，使其成为真正的战斗力量。"

####新事件和长事件####
jap.122.t:"暗杀之风席卷樱花国"
jap.122.d:"在樱花国首都，夜幕下的樱花树影摇曳，空气中却弥漫着不安的阴霾。近日，政府内部接连发生针对政客的暗杀事件，震惊朝野。刺杀手法诡秘，行凶者如幽灵般消失无踪，留下的只有血迹与恐慌。冲田总司眉头紧锁，坐在内阁会议室中，与她的核心幕僚——冬马和纱与小木曾雪菜——商讨对策。两位内阁成员同样神色凝重。\n\n“又是暗杀！这已经是本月第三起了！”冬马和纱拍案而起，长发微微晃动，声音中带着愤怒与无奈，“那些政客虽非核心人物，但他们的死让民众对我们的统治失去信心！”她看向冲田总司，试图寻求决断。小木曾雪菜低头沉思，手指无意识地摩挲着桌沿，语气迟疑：“我们必须找出幕后黑手……但线索太少，凶手行踪全无。”\n\n与此同时，街头巷尾的传言愈演愈烈。巴御前站在集会台上，声音铿锵有力：“冲田政府软弱无能，连自己的官员都保护不了！唯有天皇归位，才能重振樱花国！”她的追随者高声附和，群情激昂。而另一边，冷静而锋芒毕露的堀北铃音在私下集会中分析局势，语气冷峻：“这些暗杀绝非偶然，背后必有势力推动。冲田的犹豫只会让局势更糟。”\n\n内阁会议室内，冲田总司揉了揉太阳穴，试图理清思绪。冬马和纱提议：“或许是共产党人？他们的地下组织一直对政府不满，暗杀可能是他们的手段。”她的话音刚落，小木曾雪菜却摇了摇头：“可军队内部也不安分。一些将领对我们的政策颇有微词，他们有能力组织如此精准的行动。”两人争执不下，目光转向冲田总司，期待她做出决断。然而，冲田只是沉默，眼神游移，内心挣扎于两种可能。\n\n首都的樱花依旧盛开，但花瓣之下，暗流涌动。究竟是共产主义者的阴谋，还是军队内部的叛乱？"
jap.122.a:"优先怀疑共产党"
jap.122.b:"也许是军队的人"
jap.123.t:"陆军与海军的争吵"
jap.123.d:"樱花国大本营会议室内，气氛如绷紧的弓弦，随时断裂。长桌两侧，陆海军将领分坐，目光交错间火花四溅。西绢代猛地拍桌，声音尖锐如刀：“陆军装甲部队的突击能力才是国之利刃！海军那群龟缩在船上的家伙，怎能与我们正面决战的铁流相比？”她的眼神炽热，毫不掩饰对海军的轻蔑。\n\n长门端坐对面，神色沉稳，语气却带着不容忽视的坚定：“西绢代，你太急躁。海军的舰队是樱花国的屏障，控制海域才能确保资源与战略主动。陆军的冲动若无后援，不过是匹夫之勇。”她的声音温和却掷地有声，引来海军阵营的低声附和。\n\n源赖光冷哼一声，双手交叉，语气沉重：“海军的巨舰大炮耗资无数，却连近海都护不住！陆军才是国之脊梁，唯有我们能直捣敌心！”她的目光扫向文官政府代表，似在逼迫表态。土方岁三皱眉，试图缓和气氛：“双方各有长处，何必争得你死我活？国家需要的是团结。”但他的话被西绢代的冷笑打断：“团结？海军若再拖后腿，陆军可不会等！”\n\n加藤惠轻声开口，语调柔和却条理清晰：“海军并非拖延，而是着眼长远。我们的舰队能切断敌方补给，陆军若无海运支持，如何远征？”她看向长门，眼中带着支持，却也试图平息争端。然而，西绢代毫不退让，猛地起身，指着加藤惠：“空谈战略！陆军浴血奋战时，你们在海上喝茶吗？”\n\n会议室内的争吵愈演愈烈，陆海军将领你来我往，言语如刀剑交锋。文官政府代表沉默不语，夹在两方之间，左右为难。长门与加藤惠力求冷静，试图以理服人，而西绢代的激进与源赖光的强硬让气氛越发紧张。土方岁三的调和努力如石沉大海，会议陷入僵局。"
jap.123.a:"支持陆军"
jap.123.b:"支持海军"
jap.123.c:"保持中立"
jap.124.t:"军部不满"
jap.124.d:"东京，内阁会议室内的空气凝重如铁。冲田总司坐在主位，面容沉静却难掩疲惫，冬马和纱与小木曾雪菜分坐两侧，桌上摆满了经济报告。门外，军部的抗议声隐约传来，夹杂着陆军省的愤怒呐喊。削减军费的决定如一颗炸弹，在军部中掀起轩然大波。\n\n西绢代率先闯入会议室，军装笔挺，眼中燃着怒火：“冲田总司，你这是要毁了樱花国的脊梁！陆军省的装甲部队正需扩充，削减军费等于自断臂膀！”她猛拍桌子，震得茶杯微颤。源赖光紧随其后，语气冰冷：“经济危机不能成为借口！陆军是国家命脉，削弱我们就是在向敌人低头！”她的目光如刀，刺向内阁众人。\n\n冬马和纱皱眉回应，语气急促：“军费不是无限的！圣杯王国的大萧条已经波及我们，财政吃紧，不削减军费怎么稳住经济？”她试图强硬，却掩不住声音中的一丝不安。小木曾雪菜低声补充：“我们并非针对陆军，只是……必须平衡各方。海军那边也有些不满，但他们至少没像你们这样公开叫板。”她的话点到即止，暗示海军的不满虽隐晦却同样存在。\n\n冲田总司揉着太阳穴，试图平息争端：“西绢代，源赖光，我们明白军部的重要性，但国家需要稳定……”她的声音缺乏决断力。西绢代冷笑：“稳定？没有强大的陆军，哪来的稳定？内阁的软弱只会让樱花国沦为笑柄！”源赖光附和，语气咄咄逼人：“若不恢复军费，陆军省绝不善罢甘休！”"
jap.124.a:"绝不与军部妥协！"
jap.124.b:"我们应该适当让步"
JAP_buchangjunbu_idea:"对军部妥协"
jap.125.t:"财阀拖延放款"
jap.125.d:"政府要求财阀发放救济金以缓解民困，然而四大财阀却以各种借口拖延放款，激起民怨。冬马和纱向来不喜财阀，这次也一样：“这些财阀简直是国家的吸血鬼！同意放款却一拖再拖，民众快要揭不开锅了！”她的长发微微晃动，眼中闪着不耐。\n\n小木曾雪菜翻阅着财阀的回复函：“她们声称资金周转困难，可我看不过是想保住自己的利润。我们得采取行动，但不能操之过急，否则可能吓跑投资。”她抬头看向冲田总司，期待一个决断。冲田却陷入沉默，手指无意识地摩挲着桌沿，犹豫不决：“强硬逼迫可能会适得其反……可民众的抗议已经让政府压力巨大。”\n\n冬马和纱冷笑，语气激进：“压力？财阀的拖延才是压力的根源！派宪兵去，直接逼她们把救济金吐出来！再拖下去，街头的游行会变成暴动！”小木曾雪菜却摇头，试图缓和：“宪兵太强硬了，容易让财阀联合抵制。派警察去象征性提醒，施加压力但不撕破脸，或许更有效。”她的声音轻柔，却透着对局势的担忧。\n\n冲田总司的目光在两人间游移，内心挣扎：“宪兵……会不会太激进？可警察的威慑力又够不够？”"
jap.125.a:"派出宪兵胁迫财阀就范！"
jap.125.b:"派些警察象征性提醒一下就行了"
jap.126.t:"冲田总司遇刺身亡"
jap.126.d:"东京的夜晚，樱花飘零，空气中弥漫着不安的寒意。冲田总司，樱花国的领袖，刚刚结束一场冗长的内阁会议，步出政府大楼。她的身影在街灯下显得单薄，步伐因连日操劳而略显疲惫。突然，一道黑影从暗巷中闪出，寒光一现，匕首直刺她的胸膛。冲田来不及反应，鲜血迅速染红了她的衣襟，她踉跄倒地，眼中犹带震惊与不甘。卫兵的呼喊撕裂夜空，但刺客如幽灵般消失在东京的迷雾中。\n\n消息如惊雷炸响，内阁会议室瞬间陷入混乱。小木曾雪菜呆坐在桌旁，手中的文件滑落，声音颤抖：“总司……怎么可能？她昨晚还在和我们讨论经济对策……”泪水在她眼中打转，却强忍着不让落下。冬马和纱猛地拍桌，眼中燃着怒火：“这不是普通的暗杀！是有人要动摇樱花国的根基！”她的声音尖锐，掩不住内心的震怒与悲痛。\n\n东京街头，民众很快得知了噩耗。政府大楼前的广场挤满了人，有人高举冲田总司的画像，有人低声啜泣，还有人愤怒地咒骂未知的凶手。樱花树下，悼念的烛光连成一片，映照出民众的悲伤与迷茫。暗杀的阴影如乌云笼罩，刺客的身份成谜，而针对政府官员的暗杀却未停歇，恐慌在首都蔓延。\n\n内阁紧急召开会议，冬马和纱被推选为新任领袖，但冲田总司的倒下如同一道裂痕，撕开了樱花国的稳定。窗外，东京的夜色更深，危机未解，暗杀的刀锋仍在暗处悄然磨砺。"
jap.126.a:"最黑暗的时刻到来了"
jap.127.t:"破局之道"
jap.127.d:"冲田总司遇刺身亡的噩耗仍在樱花国上空回荡，政府大楼前的烛光悼念未散，街头却已隐隐透出骚乱的气息。内阁会议室内，冬马和纱刚刚接任领袖之位，面容严峻，眼中却燃着决断的火光。小木曾雪菜坐在一旁，手指紧握，声音低沉：“总司的死让民众陷入恐慌，暗杀还在继续……我们必须找到破局的办法，否则樱花国将彻底失控。”\n\n冬马和纱猛地起身，语气急切：“现在不是犹豫的时候！刺客肆无忌惮，民众的信任在崩塌，宣布国家进入紧急状态是唯一出路！”她挥手指向窗外，东京街头的抗议声隐约传来，“只有强硬手段才能震慑敌人，恢复秩序！”她的声音掷地有声，却透着些许冲动。\n\n小木曾雪菜皱眉，缓缓摇头：“紧急状态可能会让局势更糟，民众已经够恐慌了，强硬手段只会激起更大反弹。”她看向冬马和纱，试图劝说：“我们应该呼吁各方克制，给民众信心，同时暗中彻查刺客的来路。”她的目光沉稳，却掩不住对未来的担忧。\n\n会议室内，空气凝重如铅。桌上堆积的情报文件无人翻动。窗外，东京的夜空下，民众的低语与抗议交织，暗杀的阴影如幽灵盘旋。樱花国站在十字路口，内阁的抉择将决定能否从黑暗中觅得一线生机。"
jap.127.a:"宣布国家进入紧急状态"
jap.127.b:"呼吁各方克制"
jap.128.t:"陆军密谋夺权"
jap.128.d:"东京的夜空被警报声撕裂，樱花国宣布进入紧急状态后，紧张的气氛如紧绷的弦。内阁会议室内，冬马和纱紧握情报文件，脸色铁青：“陆军竟然敢密谋政变！可靠消息说他们已经在东京郊外集结部队，准备武装夺权！”她的声音颤抖，既愤怒又焦急，眼中却透着决不退让的决心。\n\n小木曾雪菜低头审视地图，手指划过陆军集结的地点，语气沉重：“紧急状态显然激怒了陆军，他们觉得我们在削弱他们的权威。现在我们必须找到盟友，否则内阁根本挡不住他们的铁蹄。”她抬头看向冬马和纱，眼中满是担忧，“但我们的选择不多，时间更紧迫。”\n\n冬马和纱语气急促：“海军！他们能制衡陆军！只要我们之前没彻底得罪他们，海军的舰队和岸防力量可以威慑陆军的行动！”她的提议激进，却带着一丝希冀。小木曾雪菜却皱眉，声音谨慎：“海军确实是个选择，但他们的支持并不稳固。如果海军不肯出手……或许我们只能求助共产党。他们的地下网络和民间的号召力能帮我们拖延时间，但前提是我们没把他们逼到对立面。”"
jap.128.a:"海军会帮我们的！"
jap.128.b:"现在唯有共产党能帮我们"
jap.128.c:"我们无能为力..."
jap.129.t:"陆军夺取政权"
jap.129.d:"东京的黎明被炮声撕裂，樱花国陷入前所未有的动荡。陆军的政变如狂风骤雨般席卷而来。深夜，装甲车和步兵部队悄然集结于东京郊外，军靴踏碎了樱花瓣铺就的街道。凌晨时分，政变正式爆发，坦克的轰鸣震颤着首都的每一寸土地。\n\n政府大楼前的广场，警察的防线在陆军的第一波冲击下迅速崩溃。机枪火光划破夜空，子弹呼啸，文官政府的卫兵节节败退。陆军部队以迅雷不及掩耳之势占领了电台、火车站和主要街道，切断了东京与外界的联系。坦克碾过临时搭建的路障，履带声如雷霆，宣示着武力的绝对统治。\n\n市中心，民众被突如其来的战火惊醒，街道上弥漫着硝烟与恐慌。政府大楼的玻璃窗在爆炸中粉碎，火光映红了夜空。陆军士兵身着整齐的军装，手持步枪，井然有序地封锁了行政中枢。广播电台被迅速接管，一道冷峻的声明反复播放：“文官政府的无能已让樱花国陷入混乱，陆军将接管国家，恢复秩序！”声音回荡在东京上空，压倒了民众的惊呼与抗议。\n\n天亮时分，政府大楼已被陆军旗帜覆盖，昔日的文官办公室沦为指挥部。街道上，装甲车巡逻，士兵列队，东京宛如一座军事要塞。樱花树下，散落的传单被风吹起，诉说着文官政府的覆灭。陆军的铁腕政变以雷霆之势完成，樱花国进入了新的统治时代，未来却笼罩在未知的阴霾中。"
jap.129.a:"武士们控制了樱花国"
jap.130.t:"陆军发动政变"
jap.130.d:"东京的夜空被战火点燃，陆军的政变如雷霆般席卷而来。尽管文官政府拉拢了共产党的支持，冬马和纱与小木曾雪菜紧急调动的资源与地下网络仍未能挡住陆军的铁流。装甲车的轰鸣碾碎了街道的寂静，政府大楼在枪炮声中沦陷。文官政府的防线迅速瓦解，士兵与警察的抵抗被陆军的重武器碾压，东京的中心化为战场。\n\n夏娜，樱花共产党的领袖，目光如炬，带领残余的共产党成员撤入地下。她的身影在暗巷中穿梭，手中紧握一份加密的通讯器，语气坚定：“陆军的暴行不会长久！我们必须保存力量，准备抗争！”在她的指挥下，共产党的地下网络迅速运作，秘密据点里，武器被分发，传单被印刷，誓言要以游击战对抗陆军的统治。\n\n东京街头，陆军的坦克与士兵封锁了主要道路，电台反复播放政变成功的宣言。政府大楼的旗帜被陆军旗取代，民众在恐慌中四散。然而，地下室的灯光下，夏娜与她的同志们围坐，地图上标满了游击据点与补给线。她低声激励：“文官政府虽倒，但樱花国的希望未灭。我们将战斗到底！”她的声音虽轻，却燃着不屈的火焰。\n\n夜色中，共产党的抗争火种在东京的暗角悄然蔓延。陆军的铁腕统治下，内战的阴云正在聚集，夏娜的地下抗争成为樱花国未来的未知变数。"
jap.130.a:"黎明尚未到来"
jap.131.t:"挫败政变阴谋"
jap.131.d:"东京的清晨，空气中还残留着昨夜的紧张气息。文官政府在海军的强力支持下，先发制人，成功挫败了陆军的政变阴谋。海军舰队在东京湾严阵以待，岸防部队连夜封锁了陆军可能的进攻路线。冬马和纱站在内阁会议室窗前，目光扫过海面上的战舰，松了一口气：“多亏海军及时出手，否则陆军的坦克恐怕已经开进东京了。”\n\n小木曾雪菜翻阅着情报文件，语气中带着谨慎的欣慰：“我们逮捕了陆军高层的策划者——佐藤一郎和田中健二。他们交代了部分计划，但似乎只是替死鬼，真正的幕后黑手还在暗处。”她抬头看向冬马和纱，眼中闪过一丝忧虑，“不过，公开处决这些替死鬼，总算能震慑陆军的躁动。”\n\n行动当晚，海军特遣队突袭了陆军在东京郊外的秘密集结地。夜色中，军舰的探照灯刺破黑暗，士兵们在码头与陆军小股部队交火，枪声短暂却激烈。佐藤一郎和田中健二在藏身处被捕，双手被缚，神情复杂。他们的供词指向一场更大的阴谋，却语焉不详。海军的果断行动让陆军的计划胎死腹中，坦克与部队被迫撤回营地。\n\n东京街头，民众得知政变被挫败，爆发出一片欢呼。政府大楼前的广场上，樱花瓣随风飘落，象征着危机的消散。冬马和纱握紧拳头，语气坚定：“我们守住了樱花国！”窗外，海军的舰艇依旧巡弋。"
jap.131.a:"太好了！"
jap.132.t:"天皇密信"
jap.132.d:"东京的夜色深沉，冲田总司遇刺的阴影仍笼罩着樱花国。冬马和纱选择呼吁各方克制，试图平息暗杀风波与民怨，但局势依旧如履薄冰。内阁会议室中，灯光昏暗，冬马和纱与小木曾雪菜对坐，桌上摆满情报与抗议传单。突然，一封密信被悄然送至冬马手中，封蜡上刻着天皇的印记。\n\n冬马拆开信，目光扫过内容，脸色骤变。信中，天皇玲以不容置疑的语气承诺：若允许她回归帝位，她将以天皇的权威安抚躁动的军队，阻止陆军的政变阴谋，确保文官政府不倒。冬马将信递给小木曾雪菜，语气急促：“玲说她能摆平军队！这或许是我们避免崩溃的唯一机会！”她的眼中闪过一丝希冀，却也带着不安。\n\n小木曾雪菜仔细阅读密信，眉头紧锁：“天皇的回归可能确实能稳住军队，但这等于让文官政府的权力受制于帝位。玲的承诺可靠吗？我们若拒绝，她会不会转而支持陆军？”她抬头看向冬马，眼中满是忧虑，“这是一场豪赌，选错了，樱花国可能陷入更大的混乱。”\n\n冬马和纱紧握拳头，内心挣扎：“接受玲的提议，我们或许能保住政府，但天皇的回归会让我们失去多少控制权？可若拒绝，她真去煽动军队，我们连现在的局面都守不住！”小木曾雪菜低声补充：“民众对天皇仍有崇敬，若我们处理不当，可能会被视为对抗传统……”\n\n会议室内，空气凝重如铅。密信的内容如一颗棋子，摆在樱花国的棋盘中央。"
jap.132.a:"接受天皇的提议"
jap.132.b:"拒绝天皇的提议"
jap.133.t:"天皇安抚了军部"
jap.133.d:"冬马和纱选择接受天皇的密信提议，允许玲以帝位之尊重返樱花国政坛。军队的激进派，在天皇的亲自安抚下，收敛了政变的野心。陆军将领们在东京郊外的军营中齐聚，宣誓效忠文官政府，条件是天皇的权威得到承认。坦克与士兵撤回营地，政变的阴云暂时消散。\n\n内阁会议室内，冬马和纱站在窗前，目光复杂地看着广场上的民众。她的声音低沉，带着一丝疲惫：“我们保住了政府，但付出的代价不小。天皇回归会让我们的权力被分薄，军队的忠诚也更依赖她。”她的语气中透着不甘，却也松了一口气。\n\n小木曾雪菜翻阅着准备签署的协议：“军队的激进派被安抚了，陆军承诺不再轻举妄动，但他们的效忠是给天皇，而非我们。玲的影响力会成为双刃剑，若她有别的打算……”她没有继续说下去，但眼中闪过一丝忧虑。协议规定天皇拥有象征性权力，但实际影响力已渗透进政府与军部的决策。\n\n冬马和纱握紧拳头，低声呢喃：“我们赢得了时间，但未来呢？”小木曾雪菜轻叹：“至少文官政府还在……希望这代价值得。”窗外，樱花国的国旗飘扬，新的权力平衡在微妙中成型。"
jap.133.a:"至少我们仍然站在这里"
jap.134.t:"冬马和纱遇刺身亡"
jap.134.d:"东京的深夜，寒风刺骨，樱花国的政局再度被血色撕裂。冬马和纱拒绝了天皇玲的密信提议，试图以文官政府的权威平息乱局，然而这一决定却引来致命后果。一夜之间，冬马在官邸外遭暗杀，刺客的子弹精准无情，她倒在台阶上，鲜血染红了地面的樱花瓣。消息传出，东京街头陷入恐慌，民众的哀叹与愤怒交织，抗议的火把照亮夜空。\n\n内阁会议室中，小木曾雪菜紧急接任领袖之位，面容憔悴却眼神坚毅。情报确认，刺杀冬马及此前冲田总司的幕后黑手，正是陆军中的激进派。他们隐藏在军营的暗影中，策划着一场场政治暴力的风暴。小木曾雪菜紧握拳头，声音低沉却坚定：“我们已无退路。陆军激进派的暴行必须被遏制！”她宣布组建举国一致内阁，联合所有党派，共同对抗政治暴力。\n\n会议室内，各党派代表齐聚，气氛凝重。共产主义者、旧贵族、甚至部分温和的军方代表都坐在桌前，试图在危机中寻求共识。小木曾雪菜扫视众人，语气沉重：“陆军的阴谋暴露，但我们仍无力直接对抗他们的武力。唯有团结，才能防止樱花国滑向深渊。”她推动新政令，试图通过舆论与联合阵线孤立激进派，但陆军的势力如阴影笼罩，难以撼动。\n\n东京街头，民众的游行愈演愈烈，标牌上写满对暗杀的谴责与对和平的呼唤。樱花树下，悼念冬马的烛光连绵不绝。然而，陆军激进派的暗杀行动未见停歇，军营中的调动仍在暗中进行。小木曾雪菜的举国一致内阁虽暂时稳住政局，但樱花国的未来依旧悬于一线。"
jap.134.a:"宪政还得继续，民主得以存续"
jap.134.b:"我们必须团结一致，并清除一切威胁"
jap.157.t:"粉碎政变阴谋"
jap.157.d:"东京的夜空被海军舰队的探照灯刺破，樱花国在小木曾雪菜的紧急领导下，凭借海军的强力支持，成功挫败了陆军的政变阴谋。海军战舰封锁东京湾，特遣部队连夜突袭陆军在郊外的秘密集结地。枪声与爆炸声短暂响彻，陆军的政变计划在海军的雷霆行动下胎死腹中。被捕的陆军高层——山本太郎与中村健一——被指为策划者，但在审讯中，他们的供词漏洞百出，显然只是替罪羊，真正的幕后黑手依然隐藏在暗处。\n\n内阁会议室内，小木曾雪菜端坐主位，目光沉稳却难掩疲惫。她翻阅情报：“海军的果断让我们赢得了时间，山本和中村只是替死鬼，陆军激进派的真正领袖还在观望。”她看向窗外，海军的舰艇在海面上巡弋，象征着暂时的稳定，“但至少，陆军现在不敢轻举妄动。”\n\n会议室外，东京街头的民众得知政变被粉碎，爆发出阵阵欢呼。政府大楼前的樱花树下，民众挥舞国旗，颂扬小木曾雪菜的决断。然而，暗杀的阴影未完全散去，陆军的沉默更像是暴风雨前的寂静。小木曾雪菜低声对身旁的幕僚说：“政权暂时稳固，但我们必须警惕。海军的支持不是无条件的，陆军的野心也未真正熄灭。”\n\n夜色中，东京的秩序缓慢恢复，海军的军舰与岸防部队成为政府的坚强后盾。举国一致内阁在小木曾雪菜的领导下，勉强维持着樱花国的稳定。"
jap.157.a:"为时不晚"
jap.135.t:"小木曾雪菜被迫下台"
jap.135.d:"东京的寒风席卷街头，樱花国的政局如风中残烛。小木曾雪菜的举国一致内阁未能获得军队的支持，孤立无援的处境让政权岌岌可危。陆军激进派的不满如烈焰般爆发，死亡威胁的信件如雪片般飞向内阁成员，字里行间透着冷酷的杀意。政府大楼外的抗议声愈演愈烈，陆军的坦克与士兵在东京郊外集结，摆出逼宫之势。\n\n内阁会议室内，小木曾雪菜坐在主位，面容苍白，手中的辞职声明微微颤抖。她低声开口，语气沉重却无奈：“我们试图联合各方对抗政治暴力，但没有军队的支持，我们连自保都做不到。”她的目光扫过空荡的会议桌，昔日盟友已因恐惧四散。陆军的威胁如利剑悬顶，内阁成员人人自危，士气低落。\n\n陆军通过电台公开发出最后通牒，声称若内阁不即刻解散，将以“维护国家秩序”为名武力接管。小木曾雪菜紧握拳头，试图寻找一线生机，却发现无路可走。她最终下令起草辞职声明，宣布举国一致内阁解散。消息传出，东京街头一片哗然，民众在樱花树下聚集，有人愤怒咒骂，有人黯然落泪，政府的倒台让希望化为泡影。\n\n夜色中，小木曾雪菜带着内阁成员悄然离开政府大楼，步履沉重。陆军的军靴声在街道上回响，坦克的阴影笼罩东京。樱花国的政权陷入真空，陆军的野心昭然若揭，未来的命运被浓重的阴霾笼罩。"
jap.135.a:"已经到这个地步了吗？"
jap.136.t:"外星人被感化了"
jap.136.d:"北海道的雪原已褪去寒意，曾经坠落在北海道的“真日本帝国”外星军官，经过数月的接触与磨合，已彻底融入樱花国的社会。佐仓玲子站在新设立的融合营地前，目光扫过训练场上与樱花国士兵并肩操练的外星人。她们的制服上已绣上樱花国的标志，昔日的陌生感被熟悉的纪律与热情取代。\n\n东乡毅，曾经的外星军官领袖，如今成为夏娜政府的顾问。她站在玲子身旁，语气平静却坚定：“我们看到了樱花国的理想，共产主义的信念让我们放弃了寻找天皇的执念。我们愿留在这里，为大和民族的复兴贡献力量。”他的目光扫过营地，昔日的同伴们正与本地工人一起建设新的工厂，分享外星科技的蓝图。\n\n玲子低头记录，内心感慨。她曾对这些外星人充满戒心，但如今看到她们教授先进的能源技术，帮助改造北海道的工业设施，甚至融入当地的节日庆典，戒备早已消散。外星人的技术让樱花国的电力系统焕然一新，工厂的烟囱冒出白烟，象征着经济复苏的希望。村民们不再畏惧这些“天外来客”，反而在集市上与她们分享樱花糕，笑声在雪后的村庄回荡。\n\n东京的政府大楼内，夏娜对这一变化表示满意。外星人的融入不仅带来了技术飞跃，还增强了共产主义政权的民心支持。玲子向指挥官报告：“东乡她们完全适应了我们的制度，甚至开始学习我们的语言和历史。她们说，樱花国就是她们的新家。”指挥官点头，目光投向远方。\n\n夜色中，北海道的营地灯火通明，外星人与樱花国人共同点燃篝火，歌声飘扬。"
jap.136.a:"太好了！"
jap.137.t:"谣言四起"
jap.137.d:"近期，司法省向国会与首相提交了一份关于近期在北海道与奥、羽州地区传开的流言的报告。最糟糕的地方在于，这些流言蜚语所透露的理念似乎意味着帝国内阁大力推行的民族主义政策超出了掌控——动乱地区的民众开始质疑英灵统治日出之国的合法性，甚至有人声称樱花岛的合法统治者应该理所应当的属于人类。最棘手的地方在于，在天皇玲之前，后嵯峨天皇之后，于两统交替间的确曾存在过多达6位的人类天皇——尽管天皇陛下比这些人的寿命都要长久。\n\n现天皇陛下实际上是作为当年带领东国大名的英灵领袖击败西国朝廷，才终结了天有二日的局面。再一次成为天皇。幕藩体制下尚且没有武家敢质疑天皇的合法性，但共和派的遗产却给了背后主使利用这一问题大做文章的机会。司法省请求趁事态扩大之前查清流言源头，必要时可能甚至需要内务省的支持。"
jap.137.a:"勒令警务部门尽快查清"
jap.137.b:"以平息事端为重，要求司法省与内务部相机行事"
jap.138.t:"大帝国战争"
jap.138.d:"外星人向我们发难！原来他们几个月前就找到了他们的天皇，而这些忘恩负义的“日本人”之后却打算将自己的部队偷偷运输过来，并消灭我们！在此地建立一个真正的“大日本帝国”！这些谣言除开破坏东京政府的合法性以外，完全是为了秘密集结部队而打出的幌子。目前集结在北方的他们已经放弃了“外星人”的身份，转而以人类的口号煽动北国的民众加入他们，以建立一个真正属于“日本民族”而非樱花国英灵的国度。因为对方的矛头直指我主玲天皇于樱花国进行统治的合法性，所以帝国必须速战速决，帝国海陆军队于今日开始集结，为了消灭这群莫名其妙的“日本人”。内战已不可避免。"
jap.138.a:"为了真正的樱花国！"
jap.139.t:"警视厅调查无果"
jap.139.d:"一群酒囊饭袋！调查已经陷入僵局，警视厅在各地的追查均无果。地方警部更是只将一群人云亦云的无业游民和佃农塞进了派出所便敷衍了事。不过来自北海道的警察本部提交了一份颇有意思的报告：他们希望引入一位私人侦探的支持——侦探毛利小五郎曾经是当地警察本部的高级警官，退休后在本地开了一间私家侦探所。他有兴趣以个人身份对流言案进行私人调查，但需要警视厅和地方警部的全力支持。"
jap.139.a:"我们愿意为其买单"
jap.139.b:"我们不需要体制外的力量干预调查"
jap.140.t:"调查方向"
jap.140.d:"毛利小五郎坐在桌前，皱着眉头，手里捏着一封调查报告，嘴里叼着根香烟，烟雾缭绕。他身旁的毛利兰整理着资料，忍不住抱怨：“爸，你能不能别在屋里抽烟？柯南都咳嗽了！”坐在角落的柯南推了推眼镜，默默观察着小五郎的动作。小五郎吐出一口烟圈，敲了敲桌上的报告，自言自语：“这些关于天皇的谣言，警视厅查了半天，连个影子都没摸到，哼，幸好有我这名侦探出马！”\n\n他顿了顿，翻开笔记本，语气变得严肃：“我觉得吧，调查得先从谣言的来源入手。找到源头，才能顺藤摸瓜，搞清楚是谁在背后搞鬼。”柯南抬起头，小声插话：“毛利叔叔，谣言的传播速度这么快，会不会是有组织的政治目的？比如动摇政府的权威？”小五郎一愣，瞪了柯南一眼：“喂，小鬼，少在这瞎掺和！不过……你这话倒有点道理。”他挠了挠头，嘀咕道：“政治目的？有可能，但现在没证据，追来源更靠谱。说不定是某个反对派，或者外敌势力，故意散布这些谣言。”\n\n毛利兰放下资料：“爸，那你打算怎么查来源？警视厅都束手无策。”小五郎嘿嘿一笑，摆出自信的架势：“简单！先从东京的地下情报网查起，那些酒吧、黑市，总有人知道点风声。我再去查查最近的印刷厂，看看有没有可疑的传单来源。哼，区区谣言，难不倒我毛利小五郎！”"
jap.140.a:"调查谣言来源"
jap.140.b:"调查谣言影响"
jap.140.c:"调查政治目的"
jap.141.t:"掐断谣言来源"
jap.141.d:"东京警视厅的办公室内，灯光昏黄，毛利小五郎的第二封报告摆在桌上，宣告了案件的突破。报告中，他语气坚定地写道：“经过连夜追查，谣言的来源终于水落石出！是东京当地的黑社会团体‘暗樱会’策划并散播了关于天皇和樱花国正统性的谣言！”\n\n小五郎在报告中详细记录了调查过程。他先从东京地下酒吧的情报网入手，追踪到一批可疑传单的印刷厂，继而锁定暗樱会的秘密据点。警视厅随即展开突袭，抓捕了数十名谣言传播者，缴获了成堆的宣传单和通讯设备。小五郎在报告中得意地写道：“这些家伙以为能瞒过我毛利小五郎的眼睛？哼，太天真了！”\n\n柯南听完报告，低声对毛利兰说：“兰姐姐，背后会不会有更大的势力指使？”小五郎闻言，拍桌喝道：“小鬼，别在这胡思乱想！没证据的事，我可不猜！”但他随即皱眉，补充道：“不过，动机确实还得再挖。”"
jap.141.a:"至少现在问题解决了，无须理会明日洪水如何滔天。"
jap.142.t:"谣言再起"
jap.142.d:"谣言又开始在国内传播开来——为什么我一点都不对此感到惊讶——更糟的是，这一次麻烦已经不只是局限在北国了——全国各地都开始有人讨论起“完全去英灵化”的可行性，有史以来第一次英灵本身在日出之国的统治地位遭到了完全质疑，如今这已经不是警察部门或几个私家侦探就能够解决的事态，除了全权委任内务部展开弹压以外似乎没有更好的做法。"
jap.142.a:"娘的，管他呢，特高课，出动！"
jap.143.t:"军部的阴谋"
jap.143.d:"毛利小五郎点燃一根香烟，吐出烟圈，皱眉道：“这些谣言的影响太恶劣了，民众对政府的信任都动摇了！我查了半天，线索总指向军部，尤其是那些激进派将领。他们的动作太可疑了！”他敲了敲桌子，语气沉重，“我已经说服目暮警官，打算去东京警视厅，秘密调查军部背景的政治人士。可这事风险大，搞不好会捅马蜂窝。”\n\n“爸，这太危险了！军部的人要是知道你在查他们，肯定不会善罢甘休！”毛利兰看向柯南，寻求支持。柯南推了推眼镜：“毛利叔叔，军部确实有动机，但内阁的方针是团结军部，首相绝不会批准这种调查。如果我们能从其他渠道入手，比如外星人给你提供的那些情报……”他顿了顿，“真日本帝国的人现在还算友好，他们的情报可能有突破口。”\n\n小五郎瞪了柯南一眼，哼道：“小鬼，少在这出馊主意！外星人的情报？谁知道他们是不是也在玩花样！”他揉了揉太阳穴，语气犹豫，“不过，军部的线索不能放过。如果内阁肯授权，我就能在警视厅的掩护下挖得更深。可若首相不点头，这事就得另想办法。”他看向报告，低声嘀咕：“谣言背后，到底藏着什么鬼？”"
jap.143.a:"秘密授权毛利小五郎继续深入调查"
jap.143.b:"也许，我们有必要审视一下外星朋友带来的情报？"
jap.144.t:"军部的抗议"
jap.144.d:"东京郊外一处隐秘的宪警据点，毛利小五郎等人被“请”进一间狭小的房间，门窗紧锁，门外宪警的脚步声沉重。房间内只有一张桌子和几把椅子，空气中弥漫着紧张的气息。小五郎坐在椅子上，双手被铐，脸上写满不甘，嘴里叼着熄灭的香烟，怒气冲冲地嘀咕：“该死的特高课！内阁刚授权我们查军部，他们就把我关在这破地方！这帮家伙鼻子比狗还灵！”他猛地拍桌，手铐哗哗作响。\n\n毛利兰站在窗边，试图推开被封死的窗户，声音中带着焦虑：“爸，内务大臣都公开发飙了，军部还派人去面见天皇！他们说我们的调查是‘子虚乌有’，连温和派都站出来反对……这下麻烦大了！”\n\n柯南坐在角落的小椅子上，冷静分析：“毛利叔叔，特高课的反应这么快，说明军部内部有人早就盯着我们。内阁想秘密调查，却没料到军部竟然空前团结，连温和派都用这么强硬的措辞。”他顿了顿，低声补充，“天皇没法再支持内阁，毛利叔叔被软禁，调查已经彻底停了……但这也说明，军部确实有鬼。”小五郎冷哼一声，瞪着天花板：“哼，军部那帮家伙摆明了在掩饰什么！还派代表去见天皇，摆出一副受害者的嘴脸！现在好了，内阁被军部公开指责，连天皇都不敢保我们！”他挣扎了一下，手铐勒得手腕发红，语气更急，“这破地方连烟都不让抽，简直要把我憋疯了！”房间外，宪警的影子晃动，毛利小五郎的调查被迫中止。"
jap.144.a:"就这么结束了吗？"
jap.145.t:"觐见天皇"
jap.145.d:"东京皇宫的会客殿内，烛光摇曳，空气中弥漫着淡淡的檀香。毛利小五郎身着整洁的西装，站在天皇玲面前，额头微微冒汗，尽力保持镇定。天皇玲端坐于高台，容貌清丽，目光如水却透着威严，身后屏风上绘着盛开的樱花。\n\n小五郎躬身行礼，语气恭敬却带着他一贯的直率：“陛下，关于天皇正统性的谣言，我毛利小五郎查了半天，觉得这事不简单，背后有政治目的，关系到国家安危！可我这粗人揣摩不了圣意，恳请陛下指点方向，帮我这调查指条明路！”\n\n玲微微颔首，声音柔和却不失力度：“毛利侦探，谣言动摇民心，朕深感忧虑。你既以政治目的为切入，朕以为，须关注那些能从中渔利的势力。你有何建议？”她的目光扫过小五郎，似在试探他的决心。小五郎搓了搓手，语气稍显急切：“陛下，我这鼻子闻着，谣言的政治味儿太浓了！可能是想让政府和群众闹翻，或者转移咱们的注意力。我琢磨着，军部最近动作频频，内部调查兴许能挖出点东西。可共产党那边也不老实，他们的地下活动没停过。还有那些外星人……呃，真日本帝国的人，表面友好，谁知道背地里打什么主意？”他顿了顿，挠头道，“可具体查谁，我得听陛下您的意思！”\n\n天皇玲沉默片刻，眼中闪过一丝复杂的神色，低声道：“军部、共产党、外星人，皆有可能。此事关乎樱花国根基，需谨慎。你若有心，朕许你深入追查，但切记，勿轻举妄动。”她轻挥手，示意退下。\n\n小五郎退出大殿，擦了把汗，低声嘀咕：“陛下的意思……好像啥都说了，又啥都没说。得，这案子还得我自己摸索！”"
jap.145.a:"也许需要对军部进行一次内部调查"
jap.145.b:"也许我们应该把目光放在共产党身上"
jap.145.c:"再次对我们的外星人朋友进行深入调查"
jap.146.t:"对共产党人的调查"
jap.146.d:"毛利小五郎专注地翻阅一份共产主义者的传单，吐出一口烟，皱眉嘀咕：“这调查算是撞对路了，查共产党果然有点收获，可我总觉得……还没摸到真相的边儿！”\n\n“爸，你不是说警视厅抓了好几个共产党的宣传头子吗？谣言都少了很多，怎么还说没摸到真相？”毛利兰语气中带着疑惑。小五郎哼了一声，敲敲桌子：“兰，你不懂！我们突袭了几个地下印刷点，抓了几个散布天皇谣言的家伙，确实让流言消停了点。可这些家伙交代的都是小鱼小虾，背后的大鱼还在水里游呢！”\n\n柯南抬起头，冷静插话：“毛利叔叔，共产主义者散布谣言，可能是想动摇政府的正统性，煽动民众。可他们的组织太分散，感觉不像有统一指挥。你有没有想过，谣言的源头可能不是共产党，而是有人故意把线索引向他们？”小五郎瞪了柯南一眼，嚷道：“喂，小鬼，少在这添乱！不过共产党这帮人嘴硬，审了半天也没挖出大头目。”他揉了揉太阳穴，叹气道：“警视厅那边催我交报告，可这案子就像一团乱麻，剪不断理还乱。得再挖挖，不然这谣言的真相永远是个谜！”"
jap.146.a:"对于政府来说，谣言的源头似乎已经不重要了。"
jap.147.t:"真相大白"
jap.147.d:"毛利小五郎坐在桌前，烟雾缭绕，手中的特高课报告让他额头冒汗。报告直白指出，潜伏在樱花岛北部的不明武装部队，竟是真日本帝国的外星人，数万精锐悄然集结，伺机叛乱。他们的情报部门散布天皇的谣言，扰乱民心。小五郎猛拍桌子，嘀咕：“好家伙，我查外星人果然没选错！这帮天外来客，嘴上说丢了天皇，其实早就找到她，打算推翻樱花国！”他瞪着报告，语气急促，“东乡毅那小子，现在连个影子都没了，肯定知道我们发现他们的阴谋！”毛利兰站在一旁，担忧地问：“爸，这么大的事，陆军省怎么说？他们不是派人跟你一起去交涉吗？”小五郎哼了一声，指着桌上的地图：“陆军省吓得跟热锅上的蚂蚁似的！西绢代那火爆脾气，昨天还嚷着要带装甲部队直接杀去北部把外星人碾平！”他顿了顿，压低声音，“源赖光倒冷静些，说要先跟外星人的交涉人员谈，可东乡毅早跑了，谈个鬼！”\n\n说谁谁到，西绢代推门而入，军装笔挺，语气急躁：“毛利侦探，你查出的这摊子事让我们焦头烂额！北部那帮外星人摆明了要造反，陆军已经调集部队，你最好赶紧找出他们的弱点！”源赖光跟在后面，语气冷峻：“毛利，交涉没戏了，我们得准备最坏的情况。你还有什么线索？”小五郎挠头，苦笑道：“线索？就知道他们天皇在背后撑腰，具体干啥，谁知道接下来会发生什么！”"
jap.147.a:"还能发生什么？奶奶的，要内战啦！"
jap_147_tips:"§R做好战斗准备！§!"
jap.148.t:"第二次箱馆战争"
jap.148.d:"忆往昔，政府军在奥羽越列藩战争中取得了足以奠定樱花国未来的决定性胜利，而如今，不识时务的“真日本帝国”武装几乎在防备薄弱的北方再一次与国家开始了南北对峙，试图阻止樱花的海陆军队进入奥羽越诸国。外星人们几个月前就找到了他们的天皇，他们寻找天皇的托词只是在为集结叛乱者争取时间，其真实目的是在此地建立一个真正的“大日本帝国”。不过现在看来，他们试图在国内争取民众支持的计划已因我们的努力而失败，被迫仓促起事，近百年之后，帝国的军队又将跨过群山，越过海峡，彻底平定源自北海的无妄之灾。"
jap.148.a:"唉，为什么要说“又”？"
jap.149.t:"玲子的秘密任务"
jap.149.d:"佐仓玲子被任命为特别行动小队指挥官，率领精锐小队秘密潜入沦陷的北海道，目标是重返不明飞行物残骸，搜集证据证明“真日本帝国”的外星身份。她身着伪装服，匍匐在雪林边缘，目光锁定远处的残骸据点。外星部队的巡逻队严密守卫着坠落点。\n\n小队趁夜色掩护，避开巡逻队，悄然接近残骸。破损的金属壳体在雪地中若隐若现，核心区域依然散发着诡异的能量波动。玲子钻入残骸内部，头灯照亮扭曲的舱体，墙壁上的符号与电路远超人类科技的认知。\n\n她小心翼翼地切割一块残骸碎片，仪器显示其材质非地球已知金属，核心装置的能量反应更是人类无法复制。玲子低声记录：“这些科技……完全不是我们的水平。他们确实是外星人。”她发现一具损坏的机械残骸，内部芯片上刻有“真日本帝国”的标记，佐证了敌人的身份。小队迅速收集样本，躲避巡逻队的扫射，成功撤离。\n\n回到临时据点，玲子将证据上交东京。政府虽曾试图否认外星人的存在，但面对确凿的科技样本，无可辩驳：敌人是货真价实的外星来客。然而，玲子在报告中补充：“他们的部队虽强，但后勤补给似乎不稳，樱花国仍有胜算！”"
jap.149.a:"外星人不是已经被删除了吗？"
jap.150.t:"帝的谎言"
jap.150.d:"临时指挥部内，玲子凝视桌上刚截获的外星通讯记录。屏幕上，“真日本帝国”的天皇“帝”现身，一位美丽少女的影像震撼了所有人。她的容貌清丽，气质超凡，声称自己是大和民族的正统天皇，统治着银河系的庞大帝国。她的声音柔和却充满威严：“樱花国是我族的分支，回归真日本帝国是你们的宿命。”影像在指挥部内引发哗然，士兵们面面相觑，愤怒与疑惑交织。\n\n玲子紧握拳头，她翻阅情报，确认入侵计划虽非“帝”亲自敲定，却在她默许下由东乡毅等军官执行。玲子向指挥官建议：“我们必须对外宣传这是‘帝’的弥天大谎！她的银河帝国不过是夺权的幌子，挑起民愤，孤立她们！”\n\n宣传部在得到内阁许可后迅速行动，电台与传单铺天盖地，揭露“帝”的谎言。东京街头，民众高举标牌，怒斥外星人的野心，樱花树下燃起抗议的火把。玲子亲自起草宣传稿，强调“帝”虽以天皇自居，却与樱花国的传统无关，她的入侵是对大和民族的亵渎。"
jap.150.a:"她们无法染指樱花国！"
jap.151.t:"假日本国"
jap.151.d:"佐仓玲子站在驻军指挥部的瞭望塔上，手中握着一份刚从东京传来的政府公报。公报中，樱花国政府将“真日本帝国”更名为“假日本国”，彻底否定其自称的大和民族正统性。玲子低声读出公报标题：“假日本国……好一个名字。”\n\n指挥部内，军官们围绕新命名展开热议。宣传部门已在全国铺开攻势，电台反复广播：“假日本国是外星侵略者，冒充我族天皇，妄图颠覆樱花国！”东京街头，民众高举标牌，上面写着“驱逐日本国，守护樱花魂”，抗议声浪震天。玲子翻阅最新的传单，注意到政府特意强调“帝”的银河帝国与樱花国毫无关联，旨在激起民愤，凝聚抵抗力量。"
jap.151.a:"既不大和，更非帝国"
jap.152.t:"审判外星人"
jap.152.d:"临时军事法庭外，寒风刺骨，玲子手中紧握一份政府下达的处决命令。真日本帝国的外星军队已大部撤离，留下的仅是低级外星士兵与被蒙骗入伍的樱花国人。然而，驻军在最后一次清剿中抓获了几名未能逃脱的外星军官，她们的制服上仍带有“真日本帝国”的徽记。政府的命令冰冷明确：全部处死，以儆效尤。\n\n法庭外，临时搭建的行刑场已被雪覆盖，士兵们围成警戒圈，枪口对准被俘的外星军官。玲子凝视这些俘虏，她们的面容与樱花国人无异，却带着一丝异样的冷漠。一名军官试图辩解，声音颤抖：“我们只是奉命行事，‘帝’的计划与我们无关！”但玲子冷冷打断：“你们入侵我们的家园，假借大和之名，罪不可赦。”她的语气坚定，掩盖住内心的复杂情绪。\n\n处决在肃杀的氛围中进行，枪声短暂而沉闷，雪地上染上点点猩红。被蒙骗的樱花国士兵被隔离审讯，部分人痛哭流涕，称自己不知真相。玲子看向远方的雪林，真日本帝国的残骸仍在散发微光，提醒着这场战争的未了余波，樱花国的未来仍笼罩在复杂的光影之下。"
jap.152.a:"帝国仍存"
jap.153.t:"星野爱之死的真相"
jap.153.d:"经过毛利小五郎的调查，星野爱实际上是被其前男友害死的，那位狂热粉丝正是通过前男友得知了星野爱的住所。而星野爱被前男友杀害的原因则令人大跌眼镜：二人在未成年时就发生关系，而星野爱还为此生下了一对双胞胎，并在此之后断绝了与前男友的联系，这才使前男友起了杀心。这过于抽象的真相一经警方发布，许多星野爱粉丝就由粉转黑，而星野爱生前的许多商业物品也因此飞速贬值。"
jap.153.a:"简称：闹麻了"
jap.154.t:"朝鲜起义"
jap.154.d:"天皇领导下的樱花国政府正面临前所未有的危机。将朝鲜整合为本土的决定点燃了朝鲜民众的怒火。金日成领导的赤匪游击队迅速壮大，化为一支规模庞大的起义军，在朝鲜半岛的山林间掀起反抗的狂潮。\n\n朝鲜的雪山与密林中，起义军的旗帜迎风飘扬。金日成的部队以小股游击战骚扰帝国军，炸毁桥梁、伏击车队，令正规军疲于奔命。平壤街头，传单散落，号召民众加入反抗，谴责樱花国的吞并政策。\n\n东京的皇宫内，天皇的命令传下：不惜一切代价平定叛乱，以确保东亚霸权。窗外，东京的樱花依旧盛开，但朝鲜的战火已成燎原之势。这场战斗不仅关乎朝鲜的控制，更将决定樱花国在东亚扩张的命运。"
jap.154.a:"没什么好怕的，消灭她们！"
jap.154.b:"扮演朝鲜（难度较高）"
jap.155.t:"$news_event_background$樱花岛内战"
jap.155.d:"樱花国境内突然爆发了大规模的内战。\n\n这群自称来自“真日本帝国”的神秘人物不知从哪里召集起了一支大军，浩浩荡荡向樱花政府宣战。而樱花政府则拒绝向外界透露任何有关“真日本帝国”的消息。不过有小道消息表示，“真日本帝国”很有可能是来自其他次元的樱花国人，某种意义上来说算是外星人。不过该消息可信度较低，毕竟外星人什么的还是太离奇了。\n\n目前两军已经开始交战，真日本帝国军队的士兵中甚至有不少是明显的樱花国人，也许樱花政府的统治并不牢固。"
jap.155.a:"统一樱花岛！"
jap.155.b:"消灭这群疯子！"
jap.155.c:"这次看起来不是下克上"
jap.156.t:"$news_event_background$朝鲜起义"
jap.156.d:"樱花国强行将朝鲜整合进本土的行为激起了朝鲜群众的广泛抵抗，而朝鲜人民军则利用了这一点，召集了规模庞大的起义军，试图推翻樱花国的统治。\n\n朝鲜人民军的前身是大韩民国的共产党游击队，如今她们的力量足以建立起一个新国家，但樱花国很有可能将她们再度打入深渊。\n虽然樱花国坐拥强大武力，但如果樱花军队没能战胜朝鲜起义军，那么等待这个帝国的就只有毁灭。"
jap.156.a:"革命不会失败！"
jap.156.b:"粉碎起义！"
jap.156.c:"静观其变"
jap.158.t:"恩情不再"
jap.158.d:"朝鲜的雪山密林间，朝鲜的旗帜在寒风中摇摇欲坠。樱花帝国的铁蹄无情碾压，金日成领导的朝鲜人民军虽顽强抵抗，却在帝国军队的猛攻下节节败退。平壤以北的山谷中，金日成与残余的游击队员在夜色掩护下仓皇撤退，试图突围至边境。他的身影在月光下显得瘦削，眼神却仍燃着不屈的火焰，手中紧握步枪，低声激励部下：“坚持下去，朝鲜的灵魂不会屈服！”\n\n帝国军队的侦察机在夜空中盘旋，探照灯如利剑刺破黑暗。金日成带领小队穿梭于雪林，靴子深陷泥泞，每一步都带着绝望的沉重。突然，远处传来坦克履带的轰鸣，帝国军的装甲部队已封锁了山谷出口。金日成咬紧牙关，指挥部下分散隐蔽，自己却选择引开追兵。他跃上一处高地，挥舞旗帜，高喊：“为了朝鲜，战至最后一刻！”他的声音在山谷回荡，激励着游击队员的士气。\n\n然而，帝国军的狙击手早已锁定目标。一道冷光从远处闪过，狙击枪的子弹精准击中金日成的胸膛。他踉跄倒地，鲜血染红了雪地，手中旗帜缓缓滑落。游击队员的惊呼被炮火淹没，帝国军队迅速包围，坦克的火光照亮夜空。金日成的部下试图抢回他的遗体，却被密集的机枪火力逼退。帝国军冷漠地确认目标死亡，将金日成的遗体拖走，宣告起义的彻底失败。\n\n朝鲜的山林间，起义军的残余在悲痛中四散。金日成的死如重锤，击碎了反抗的希望。雪地上，散落的传单被风吹散，诉说着朝鲜人未尽的抗争与逝去的领袖。"
jap.158.a:"再见了，将军"
