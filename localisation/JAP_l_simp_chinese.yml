 JAP_jianshemanzhoujungongye_desc:0"我们应该帮助我们的满洲盟友建设更多军工厂以应对之后的战争。"
 JAP_yumanzhoudelianhejunyan:0"与满洲的联合军演"
 JAP_yumanzhoudelianhejunyan_desc:0"与满洲进行联合军演可以帮助我们的军队更好熟悉中国战场，也许我们每年都应该联合军演一次。"
 jap_yinghuaguojunshiguwen_idea:0"樱花国军事顾问"
 JAP_paiqianjunshiguwen:0"派遣军事顾问"
 JAP_paiqianjunshiguwen_desc:0"中国军队急需磨炼，我们的顾问会帮助她们更快步入现代化战争。"
 JAP_juanzengzhuangbei:0"向满洲捐赠武器装备"
 JAP_juanzengzhuangbei_desc:0"我国可以将老旧装备捐赠给[MAN.GetName]，让她们能武装更多的军队。"
 jap.101.t:0"樱花国给我们送来了武器装备！"
 jap.101.d:0"为了表示对我们的支持，樱花国不但在投资我们的工业，同时也为我们送来了武器装备。"
 jap.101.a:0"枪不嫌多！"
 JAP_MAN_zcjiemeng:0"如果我国选择与§Y[MAN.GetName]§!结盟，则解锁§Y建设满洲§!决议。"
 JAP_ROC_zcjiemeng:0"如果我国选择与§Y[CHI.GetName]§!结盟，则解锁与§Y[ENG.GetName]§!的§Y外交博弈：在华代理人§!决议。"
 jap.102.t:0"中原代理人"
 jap.102.d:0"是时候选择我们的代理人势力了，如果奉系军阀还保持独立，那她们应该会非常愿意担任这一职责。\n我们当然也可以选择神州帝国，她们算正统政府，同时实力也最强大。"
 jap.102.a:0"奉系军阀能为我国带来最多的利益"
 jap.102.b:0"神州帝国应该好好考虑我们的提议"
 jap.103.t:0"与§R[JAP.GetNameDefCap]§!的外交博弈开始了"
 jap.103.d:0"[JAP.GetNameDefCap]正在寻求更大的在华利益，樱花人的野心终于暴露了出来。如今我们已经不再是弱小的地区军阀，因此我们必须在外交上夺得主权，捍卫中国的领土完整。"
 jap.103.a:0"§R博弈已经开始了§!"
 jap.104.t:0"[MAN.GetNameDefCap]取得胜利"
 jap.104.d:0"[MAN.GetNameDefCap]在谈判桌上取得了完全的胜利，中国的领土得到了保护。"
 jap.104.a:0"太好了！"
 jap.104.b:0"小小的挫折"
 jap.105.t:0"平局"
 jap.105.d:0"双方都没有在谈判桌上取得优势，这件事最终不了了之。"
 jap.105.a:0"起码没有损失"
 jap.106.t:0"边境陆军擅自行动"
 jap.106.d:0"与边境陆军的联络突然中断，东北的特高科报告，一部分边境陆军擅自越境，悍然闯入[MAN.GetName]的领土！军方的电报如雪片般飞来，语焉不详却透着不安，边境的哨所已发现装甲车与步兵的踪迹，行军路线直指辽满腹地。特高科的情报指出，这些部队未受高层指令，似由激进的少壮派军官私自行动，意图挑起冲突，扩张势力。[MAN.GetName]的军队已进入戒备状态，边境线上的气氛剑拔弩张，随时可能爆发战斗。"
 jap.106.a:0"她们疯了吗？"
 jap.107.t:0"边境陆军占领东北"
 jap.107.d:0"樱花国的边境陆军已经借调查理由进入了东北三省，东雪莲也在此时发动了政变，[MAN.GetLeader]的凳子还没坐热两天就又要换人了..."
 jap.107.a:0"我们从一开始就不应该相信樱花国！"
 jap.108.t:0"来自[JAP.GetNameDefCap]的新条约"
 jap.108.d:0"[MAN.GetLeader]最终屈服于[JAP.GetNameDefCap]，签下了新的不平等条约。"
 jap.108.a:0"这是中国新的耻辱"
 jap.108.b:0"这是属于我们的外交胜利"
 JAP_MAN_beiboxuedejingji:0"贸易被樱花国掌控"
 JAP_yaoqiuzaihualiyi:0"要求在华利益"
 JAP_yaoqiuzaihualiyi_desc:0"虽然中国还尚未完全统一，但我们对[MAN.GetLeader]的帮助可足够多了，是时候要求我们在华的利益了。"
 JAP_yaoqiuzaihualiyi_2:0"要求在华利益"
 JAP_yaoqiuzaihualiyi_2_desc:0"中国已经基本统一，这离不开我们的保护与帮助，是时候向[CHI.GetLeader]提出我们的要求了。"
 jap.109.t:0"樱花国要求更多的在华利益"
 jap.109.d:0"我们在樱花国的帮助下赢得了内战，但她们在胜利后却狮子大开口，要求控制我们大部分的港口城市，我们该如何抉择？"
 jap.109.a:0"我们别无选择"
 jap.109.b:0"她们简直是疯了！"
 jap.110.t:0"神州拒绝了我们的要求"
 jap.110.d:0"狂妄的[CHI.GetLeader]拒绝了我们的正当要求，两国此前的友好关系瞬间消散，唯有战争可以得知谁对谁错。"
 jap.110.a:0"她们会付出代价的"
 JAP_yhfuxingjihua:0"樱花复兴计划"
 JAP_zzjssc_idea2:0"专注军事生产"
 jap.111.t:0"与财阀的交易"
 jap.111.d:0"财阀代表意外抛出橄榄枝，宣称愿原谅政府的干涉，但条件苛刻：要求文官政府与财阀展开更广泛的合作，甚至深度介入政策制定。\n\n“财阀这是趁火打劫！她们的‘合作’不过是想把手伸进政府，架空我们的权力！”冬马和纱明显不愿与财阀合作，而小木曾雪菜则低头审视提案，语气谨慎：“她们的资金和资源确实能解燃眉之急，但若让步太多，政府可能沦为她们的傀儡。”\n\n“财阀的要求……或许不会像我们想的那么糟糕。合作能稳定经济，缓解民怨。”冲田总司一反常态，似乎对财阀有所信任。\n\n冬马和纱冷哼：“相信财阀？她们从没把国家利益放在心上！”小木曾雪菜却叹息：“可我们现在四面楚歌，经济、军部、民众……拒绝财阀，怕是雪上加霜。”"
 jap.111.a:0"我们无法做出这种保证"
 jap.111.b:0"我们现在自身难保，只能相信财阀了"
 JAP_wufafankangcaifa_tips:0"§0如果文官政府得以存续，在未来我们将无法抑制财阀的影响力§!"
 jap.112.t:0"加强对军队的监管力度"
 jap.112.d:0"总司目光扫过桌上的军部报告，眉头微皱。陆军省近期频繁调动部队，尽数开往朝鲜与满洲边境，表面上并无反政府意图，但这异常的举动让内阁不安。冬马和纱斜靠椅背，语气中带着不屑：“陆军这帮家伙，缩减军费都没闹起来，现在又搞这些小动作。既然不是政变，何必浪费精力管她们？”她挥了挥手，似要将此事抛诸脑后。\n\n小木曾雪菜却低头审视地图，手指划过朝鲜与满洲的边境线：“调动规模不小，参谋本部却说不清缘由。这么多部队集中在边境，若在国外惹出乱子，收拾烂摊子的还是我们。总司，军队向来不服管教，‘下克上’的传统根深蒂固，监管还是必要的。”\n\n“我知道陆军现在不敢公开反对，毕竟没有天皇撑腰……但这些调动太反常了。若真在国外闹出事端，樱花国的外交处境会更糟。”总司的声音犹豫。冬马和纱冷哼：“管她们做什么？陆军自己惹祸，自己担！我们还有经济危机要处理！”小木曾雪菜却反驳：“国外的乱子最终会烧回本土，总司，抽调人手监督，至少能防患于未然。”"
 jap.112.a:0"既然不是军事政变就不需要担心"
 jap.112.b:0"在国外惹事也得政府来处理烂摊子，还是得去管一管"
 jap.113.t:0"军队的反常举动"
 jap.113.d:0"总司选择放任陆军的异常调动，试图将精力集中在国内经济危机上。然而，朝鲜与满洲边境的局势却如脱缰野马，愈发不可收拾。桌上的情报文件堆积如山，冬马和纱皱眉翻阅：“陆军在边境的动作越来越大，集结了重装部队，还在修筑工事！辽满军阀已经全线戒备，这要是擦枪走火，战争可就来了！”她猛地看向冲田总司，眼中带着责问。\n\n小木曾雪菜声音低沉：“我们放任不管，陆军显然更加肆无忌惮。参谋本部依然语焉不详，但情报显示他们的物资储备已经超出常规演习的规模。”她抬头，“总司，当初若派人监管，或许还能压住势头。现在……恐怕得有大事态才能让他们停手。”\n\n冲田总司试图辩解：“我以为他们不敢轻举妄动……毕竟没有天皇支持，陆军不至于公然挑事。”她的声音透着往日的优柔寡断。冬马和纱冷笑：“不敢？他们现在就是在试探底线！辽满军阀若反击，樱花国得背上侵略的骂名！”小木曾雪菜叹气，补充道：“边境的紧张已经传回国内，民众开始议论纷纷。若不尽快遏制，内忧外患会一起爆发。”"
 jap.113.a:0"“但是现在已经晚了...”"
 JAP_rw_junduizaichaomanbianjingjuji:0"§C议程§!：§R军队在朝满边境集合§!"
 JAP_rw_junduizaichaomanbianjingjuji_desc:0"军部以各种理由抽调了大批陆军前往朝满边境，我们不知道军队下一步会做出何种行动。"
 JAP_kuodazhanguo_time:0"扩大战果"
 JAP_kuodazhanguo_time_desc:0"突击！只要能够控制关键的省份，就能进一步扩大战果！"
 JAP_kuodazhanguo_time_2:0"进一步扩大战果"
 JAP_kuodazhanguo_time_2_desc:0"还不够！距离整个中国的战败还很遥远，必须进一步进攻！"
 JAP_shuaxindedixingxiuzheng_tips:0"§0在敌方关键城市获得永久的进攻修正，该效果不会随着一击必胜的失效而消失§!"
 JAP_cuiruodefangxian_idea:0"脆弱的防线"
 JAP_cuiruodefangxian_idea_desc:0"中国尚未做好应对樱花国全面侵略的准备，防线一触即溃...."
 jap.114.t:0"边境陆军擅自行动"
 jap.114.d:0"行动失败了！由于缺乏充分的计划与后续来自大本营的支援，边境陆军对满洲边防军的挑衅最终以失败告终。"
 jap.114.a:0"没搞出什么大动静就好"
 JAP_ruqinxiaweiyi:0"入侵夏威夷"
 JAP_ruqinxiaweiyi_desc:0"珊瑚宫的位置至关重要，在远洋战败之后，我们可以轻易入侵这里。"
 jap.115.t:0"与樱花国的互不侵犯条约"
 jap.115.d:0"樱花国想要与我们缔结互不侵犯条约，这说明她们有更为优先的敌人。"
 jap.115.a:0"同意，我们之后再处理东亚事务"
 jap.115.b:0"拒绝，我们不可能与军国主义者妥协"
 jap.116.t:0"[FROM.Getname]拒绝签署互不侵犯条约"
 jap.116.d:0"[FROM.Getname]拒绝了签署互不侵犯的提议，看来她们在准备进攻我们...."
 jap.116.a:0"该死"
 JAP_jiesuojueyi_ziyouqinhua_tip:0"解锁决议：§Y入侵中国§!\n之后可以§C自由选择§!入侵中原的时间了，但如果选择了§Y一击必胜§!，则§R无法获得§!额外的§Y攻势加成§!，但我国可能会获得一个§G与中国势力结盟§!的机会"
 JAP_shoudongruqinzhongguo:0"入侵中国"
 JAP_shoudongruqinzhongguo_desc:0"时机已到，是时候执行入侵中国的计划了。同时我们会尝试拉拢国民政府加入我方，这可是绝佳的机会..."
 jap.117.t:0"樱花帝国抛出了橄榄枝"
 jap.117.d:0"出乎意料的事件发生了，一向主张彻底征服中原的樱花国竟然主动向我们抛出了橄榄枝，她们想让我们加入共荣圈一方，樱花国承诺会协助我国统一除东北外的整个中国。当然，代价一定是樱花国的各种对我国的经济控制了。"
 jap.117.a:0"如果没有满洲，那还算什么完整！"
 jap.117.b:0"我们可以接受这样的条件"
 JAP_manzutiaojianklalong_tip:0"在满足特定条件的情况下，我国会试图拉拢国民党，如果她们不回信则代表拒绝了我们的帮助"
 trait_jap_xgz:0"香公主"
 trait_jap_qctz:0"请吃团子"
 trait_jap_szz:0"神之子"
 JAP_yumodaoguoyihe:"与魔导国议和"
 JAP_yumodaoguoyihe_desc:"中国有句古话叫识时务者为俊杰。如今魔导国横扫欧陆，轴心国已经覆灭，同时拥有着共同敌人的我们不应该相互敌对。"
 jap.118.t:"[JAP.GetNameDefCap]请求和谈"
 jap.118.d:"樱花国想与我国议和，她们已经承认了我们的欧陆霸主地位，并承诺会与轴心国残余划清关系，与我们共同对抗苏联和圣杯王国。"
 jap.118.a:"我们不接受樱花国的臣服"
 jap.118.b:"暂时停战，之后再考虑东亚事务"
 jap.119.t:"魔导国拒绝停战"
 jap.119.d:"魔导国拒绝了我们的停战请求，她们注定会失败！"
 jap.119.a:"那就这样吧"
 jap.120.t:"魔导国接受停战"
 jap.120.d:"魔导国接受了我们的停战请求，暂时与我们休战，专心对抗共同的敌人。"
 jap.120.a:"太好了！"
