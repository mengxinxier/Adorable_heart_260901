 LING_DESC:0"§Y玲§!\n§Y恒明天皇§!\n  · $MODIFIER_STABILITY_FACTOR$：§G+50.00%§!"
 LING_Diplomacy_desc:0"§Y玲§!\n@JAP§Y[FROM.Getname]§!的§C天皇§!\n\n§Y恒明天皇§!\n  · $MODIFIER_STABILITY_FACTOR$：§G+50.00%§!"
 jap.100.t:0"山海关事变"
 jap.100.d:0"樱花国声称她们的士兵在我们的边境失踪了，要求控制河北省份以进行搜查，这无疑是极大的挑衅行为。"
 jap.100.a:0"拒绝她们，这是中国的领土！"
 jap.100.b:0"她们太强了，我们只能接受"
 jap.200.t:0"中方拒绝"
 jap.200.d:0"不出所料，对方果然拒绝了我们的要求，时机已经成熟，是时候发动进攻了。"
 jap.200.a:0"她们知道后果是什么"
 jap.300.t:0"中方同意"
 jap.300.d:0"对方同意了我们的要求，虽然令人吃惊，但这并不会延缓帝国进军的脚步。"
 jap.300.a:0"暂时放她们一马"
 jap.38.t:0"推翻亲西方政府"
 jap.38.d:0"在一部分年轻军官发起兵变后，一些现政府的高级官员遭到杀害，这给了我们绝佳的机会，只要抓到冲田总司，我们就能取得胜利。"
 jap.38.a:0"我们成功搜索到了冲田总司的所在处，天皇陛下胜利了！"
 jap.38.b:0"冲田总司已经逃离了东京，内战不可避免了"
 jap.39.t:0"组建新政府"
 jap.39.d:0"陆军成功推翻文官政府，天皇玲的回归让樱花国迎来新的篇章。政府大楼前的广场上，陆军旗帜与天皇旗帜并肩飘扬，民众聚集，目光中夹杂着期待与不安。新政府亟需组建，一位首相必须被选出，以协助天皇重塑国家秩序。会议室内，气氛肃穆，陆军与海军的代表齐聚，围绕三位候选人展开激烈争论。\n\n织田香的名字首先被提出。她是此次政变的领导者之一，织田家的公主，容貌清丽可爱，性格温和如春风。她的声音轻柔却坚定，谈及幕府时代的荣光时，眼中闪着光芒。旧贵族的代表们低声附和，称她为“复兴传统的希望”，认为她的温和能弥合政变后的裂痕，赢得民间与贵族的支持。\n\n接着，长门的提名让会场气氛一振。作为海军的象征，她虽面容可爱，却自带一股不容置疑的威严。她的发言沉稳有力，强调海军对樱花国海域的掌控与战略重要性。海军将领们齐声支持，称她为“神之子”，认为选择她将巩固海军的地位，确保新政府与舰队的紧密联结，震慑外敌。\n\n最后，巴御前的名字被提及。她曾是亲西方政府的一员，却始终是坚定的忠君派，致力于天皇回归。她的身影挺拔，目光如炬，代表着陆军的意志。支持者们认为，她的果敢与忠诚能强化陆军的权威，巩固政变成果，但她的背景也引发争议，有人担忧她与旧政府的联系会让民众质疑新政府的纯洁性。"
 jap.39.a:0"织田香与旧贵族们值得信任"
 jap.39.b:0"长门与海军的支持是我们所需要的"
 jap.39.c:0"巴御前所代表的陆军更符合我们的扩张理念"
 jap.40.t:0"大萧条波及亚洲"
 jap.40.d:0"我们的经济并没有像圣杯的殖民地一样过度依赖于圣杯，因此受到的经济冲击也相对较小，但这还是不可避免的导致了反西方势力壮大。"
 jap.40.a:0"没办法"
