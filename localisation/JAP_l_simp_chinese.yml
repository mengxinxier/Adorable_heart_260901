 jap.121.t:"樱花国想要使用我国的海军产能"
 jap.121.d:"樱花国认为我们的海军力量较为弱小，应该用部分海军产能帮助樱花的舰队生产。为了弥补我们的产能损失，她们会派遣专家援助我们的陆军装备生产。"
 jap.121.a:"这是个两全其美的好主意"
 jap.121.b:"我们仍然坚持生产自己的海军"
 JAP_new137_tips:"如果§Y满足条件§!，则§Y对方国家§!会触发一个§Y事件§!。将该国的一部分§G海军产能§!转交给我们。每有一个盟友§G同意§!，我们的§Y海军产出§!增加§G5%§!。\n\n获得§Y集中盟友海军产能§!，其效果为\n海军船坞产出：§G+5.00%§!"
