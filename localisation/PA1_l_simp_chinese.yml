  PA1_revolution_diplomatic_desc: "尽管我们已经推翻了腐朽的王国体制，但是放眼南美，我们的处境可以说不容乐观。东有帝国虎视眈眈，南方的莉兰迪亚革命仍然悬而未决，魔法少女联盟及其圣杯盟友更是积极尝试介入局面，北方的社会主义者自顾不暇。革命的火种必须被保存下去，我们为此不得不从理想中抽身，来关注现实的外交问题。\n\n莉兰迪亚革命的局势：[PA1_lldy_revolution]\n\n帝国对我们的态度：[PAQ_attitude]\n\n魔法少女联盟及其盟友对我们的态度：[MGU_attitude]"
