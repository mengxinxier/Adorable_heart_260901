  PA1_left_icon_ui_introduce: "作为幻想乡大革命的一个衍生体，§R新山岳党§!在§R藤原千花§!的带领下取得了革命的胜利，建立了共和国，并在初次国民公会中取得了最大的优势。§R正统系§!主张进行§R社会主义§!和§R共和主义§!革命，也支持民众的运动，但同时支持理性政治，反对过度的狂热。不过，还是要注意，如果过于的优柔寡断也许会造成意想不到的后果..."
  PA1_right_icon_ui_name: "§Y宪政自由派§!"
  PA1_right_icon_ui_introduce: "不同于§R新山岳党§!的激进分子，§Y宪政自由派§!大多对于§R社会主义§!缺乏兴趣，主要是§R共和主义§!和§Y自由主义§!者为了反对暴政而加入的联盟。当然，在很多事情上面，她们的反应会较为保守，不过呢，也许让她们保持一部分影响力不完全是一件坏事呢，至少在§R野兽§!和§B浮士德§!尚且留存于世的时候如此..."
