#结局
  PA1_bad_end_title: "至此，南美合众国的§C伟大社会§!才刚刚开始..."
  PA1_bad_end_tip: "美洲，这片被欧洲人称为黑暗大陆的土地，在无知和蒙昧中度过了无数个世纪。亡灵试图撕碎她，殖民者试图奴役她，无知者试图出卖她，世界似乎抛弃了这片实验失败的衍生物，任由她在一场又一场浩劫中遭受耻辱和苦难。\n\n然而，美洲的孩子们没有放弃过对于自由的渴求，从来没有！\n\n在莉希雅皇女的带领下，自由的王国和爱戴着她的民众，用枪炮将那些强加在南美躯体上的伤疤和耻辱一并扫荡一空，整个美洲最终也归于一统，而莉希雅则像慈爱的母亲，看着这片她爱着的土地上拔地而起一座座高楼，黑夜中的霓虹灯驱散了旧日愚昧带来的恐惧，取而代之的是一个苏醒的，充满活力的美洲。\n\n“父亲，我做的...还好吗...”莉希雅如此问道。"
  PA1_bad_end_tip_2: "这就是第二王国线的所有内容了，感谢你游玩钢铁萌心，另外，§C不可思议，你居然做到了！一己之力消灭了所有美洲势力！§!"
  PA1_bad_end_button_TT: "§CAll the leaves are brown\nAnd the sky is grey\nI've been for a walk\nOn a winter's day\nI'd be safe and warm, if I was in LA\nCalifornia dreamin'\nOn such a winter day§!"
  PA1_bad_end_button: "雄鹰张开翅膀"
  PA1_normal_end_title: "至此，南美民主共和国联邦的§R命运§!翻开了下一页"
  PA1_normal_end_tip: "随着内部争论的逐渐平息，以及北美战争的结束，南美民主联邦共和国及其盟友已经控制了整个美洲大陆。藤原千花和共和派也逐渐随着革命战争胜利带来的威望而稳固了新山岳党和革命派在国民公会中的优势地位。\n\n斜阳西下，藤原千花伏在窗台边，任由橘红色的落日将她的侧脸染的熠熠生辉。楼下不远处，车水马龙，人声鼎沸，孩童的笑声从市立公园传来。曾经的孩子们总是哭，现在，她要让她们笑，真正的，发自内心的笑。"
  PA1_normal_end_tip_2: "感谢您游玩南美民主共和国联邦，另外，还有一个共和国结局在等着你，如果你还没玩过的话。"
  PA1_normal_end_button: "悲伤已成过往"
  PA1_normal_end_button_TT: "§R毕竟，明天又是新的一天§!"
  PA1_good_end_title: "至此，§C自由§! 平等 §R革命§!已经遍及美洲"
  PA1_good_end_tip: "§R我看见警棍下的男人，我看见被推搡的女人，我看见爆炸的催泪弹，我看见呼喊的人群。但我仍看见平等的梦想，看见酝酿的反抗，我看见行进的军靴，和自由的旗帜！§!\n\n就像1789年的法兰西王国那般，暴政终究招来了反抗，自由之花在暴君鲜血的灌溉下迅速成长。新山岳党人们接过了大革命的衣钵，挥着起了赤红的共和国旗，向着黑暗大陆和旧世界开战。\n\n北美帝国主义者，帝国，殖民者，一个接着一个的暴君倒在了自由和革命的呼声中。\n\n欢呼声中，曾经嚼着野菜根的姑娘们手握在了一起，一双，两双，三双...已经数不清几双手了，但有一点她们很清楚，未来，还有更多的手会握住她们，直至世间再无哭泣。"
  PA1_good_end_tip_2: "以上便是南美民主共和国联邦的真正结局了，感谢您游玩钢铁萌心，§R也感谢你为这个世界做的一切！§!"
  PA1_good_end_button: "她们的名字是..."
  PA1_good_end_button_TT: "藤原千花，雪伊，小果子，晓枫，鹿目圆...\n\n§R还有你啊，我亲爱的朋友§!"
