  PA1_the_revolution_will_level_up: "全面叛乱倒计时"
  PA1_vendee_introduce_text: "游汐港由于其特殊性，社区和教会利益密切绑定，我们的行为毫无疑问惹怒了当地人，也给了那些真正的§B反革命分子§!可乘之机。现在，我们必须安抚当地人，恢复他们对于§R革命政府§!的信心。你需要确保安抚度达到80%，且烈度低于20%，才可以结束这次暴动。一旦无法妥善解决，§R一些极端分子§!也许会做出什么..."
