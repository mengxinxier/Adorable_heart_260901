#展示国策部分
  PA1_show_1: "起来，共和国的公民"
  PA1_show_1_desc: "一起走吧，祖国的子女，光荣的一天已经到来，暴政面对着我们！"
  PA1_show_2: "军队问题"
  PA1_show_2_desc: "苏联的政委制度保证了军队的意识形态忠诚，使得她们是一支革命的军队，并被先锋队牢牢控制。然而立宪派和部分温和派则认为我们应该国有化军队，来确保民本政治和宪政常道的运行。因此，我们将做出最后决定，革命的军队，还是共和国的军队。"
  PA1_show_3: "救国委员会的职权？"
  PA1_show_3_desc: "救国委员会是一个在帝国威胁日益加重时期形成的组织。其拥有国民公会赋予的超然权力，可以在必要时期采取措施。然而，随着帝国败退，有人质疑救国委员会存在的必要性。在这个问题上，立宪派和激进派达成了惊人的一致，即保留救国委员会作为一个保险手段，防止那些在阴影里的阴谋分子再次利用漏洞攫取权力和革命果实。"
  PA1_mission_2_is_over: "§R叛乱已经结束§!"