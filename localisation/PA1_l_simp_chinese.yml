  PA1_far_left_icon_ui_introduce: "作为共和行动内部新山岳党内最激进的派系，§R民粹系§!毫无疑问是那个大众眼里最为痛恨旧秩序和渴望着革命的群体。诚然，她们的§R革命热情§!确实很大程度是我们所需要的，然而，最好不要让她们的热情失去理性的束缚，否则今天砍向§B反动分子§!的铡刀明天同样会落在你的头上..."
