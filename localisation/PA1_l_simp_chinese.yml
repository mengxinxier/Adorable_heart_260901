  PA1_great_library: "§0黑之读姬§!"
  PA1_golden_fairy: "§Y金色妖精§!"
  PA1_central_meeting_name: "国民公会"
  PA1_central_meeting_desc_1: "国民公会\n§R革命火炬§!"
  PA1_central_meeting_Diplomacy_desc: "国民公会\n@PA1§R[PA1.GetName]§!的革命火炬"
  PA1_central_meeting_desc: "§C你，自由，我们挚爱的自由\n你，自由，我们渴望的自由\n你当是我们的希望，我们的力量\n你当是我们的欢愉，我们的幸福\n我们的歌声日益高昂\n我们的歌声传向四方\n欢声歌唱，把信念颂扬\n自由啊自由，愿你成为我们的信仰\n自由啊自由，愿你成为我们的法度\n哦你能带来希冀\n哦你昭示喜悦\n\n§!§R啊，自由，我们挚爱的自由\n你要终日在我们身旁\n你要终日在我们心房\n让我们远离奴役\n让我们远离监牢\n世间再没有特权\n让我们远离饥饿和屠戮\n让我们远离那暴政的时代\n自由，我们要把你的名字日日传唱§!"
  PA1_Kaguya_sub_name: "四宫辉夜"
  PA1_Kaguya_sub_desc_1: "四宫辉夜\n§R共和之声§!"
  PA1_Kaguya_sub_Diplomacy_desc: "四宫辉夜\n@PA1§R[PA1.GetName]§!的共和之声"
  PA1_Kaguya_sub_desc: "四宫辉夜的经历和藤原千花有颇多相似之处，同样的，她出生于富贵家庭，并且和藤原千花在王都上了同一家贵族学校。当然，命运和政治动荡同样也没有放过这位大小姐，随着经济崩溃和政坛动荡，四宫辉夜的家境也逐渐的衰落，并最终不得不和藤原千花一起从贵族学校辍学。\n\n然而，不同于藤原千花选择在基层摸爬滚打，四宫辉夜在餐馆打了几年工之后决定好用一种更加有力和快捷的方式传达出自己对于变革的渴望，于是她创办了她的第一份地下报纸，报纸起初没有名字，只是针对一些问题发表自己和其他作家的见解。直到有一天，藤原千花前来邀请她加入她的团体，并且让她接触到了幻想乡大革命和共和思想，以及社会主义运动，于是，报纸正式改名《共和报》，而四宫辉夜则决定用这份报纸来作为南美共和主义的先驱和普罗米修斯。\n\n§R直到新世界的到来，直到新公民的诞生，直到吃人制度的彻底消亡！§!"
  PA1_Liselia_Elfrieden_intro: "热月与凯撒\n\n作为一个王室出生的大家闺秀，莉希雅从头到尾都看不上这场在她眼里的暴民暴动。当然，她不否认王国改革的必要性，但这一切必须要稳健的进行。这一点上，她的丈夫，前国王，现在的国民议会议长相马一也就做的不错，为此她也对这位平头小子施展芳心，接纳了她作为家庭的一员。\n\n革命以降，在相马一也的劝说下，她接受了共和国建立的事实。砍掉贵族？行吧，反正她和相马一也也干过。国有化？冷静，莉希雅，冷静，我们得为国家的未来着想，你的前皇女，如果这样能有利于国民那么好吧，应该不会有更过分的了。什么？要把相马一也和自己彻底踢出权力体系！是可忍熟不可忍，莉希雅带着多年来积累下来的人脉和在军中的威望，发起了一场南美的跨过卢比孔河，并像历史上的凯撒一样，夺取了元老院和权柄。现在，她终于可以把那些该死的暴民踢出权力中心了。\n\n§R凯撒将会带领着更理性的新的王国和人民，走向一个新的未来！§!"
  PA1_republic_conversation: "艾尔孚利登第二王国"
