#红线人物介绍
  PA1_Fujiwara_Chika_intro: "§R火玫瑰§!\n\n藤原千花出生在一个衣食无忧的家庭，父亲外交官的身份给了她从小养尊处优的环境，如果不出意外的话，她会在德莫克拉西的氛围里走时和她父亲一样的道路。\n\n然而世事无常，随着王国政局的变动和混沌势力的肆虐，藤原千花的家境也逐渐的衰落了下去，到最后她不得不离开原先的学习环境，进入一所平民学校学习。\n\n在这里，她见到了生活残酷的一面，看见了无力偿还贵族债务的家庭的孩子如何被催债人粗暴上门暴力逼债，也和父母残疾而不得不勤工俭学的朋友一起在充满油烟气的饭店里刷盘子，而她的思想也逐渐接受了淬炼，视线开始从§B纸醉金迷的生活§!中转向了§R世间百态§!。\n\n很快，藤原千花加入了一个§R幻想乡大革命§!的地下学会，在那里，她接触到了§B自由§!，§W平等§!,§R博爱§!的理念。而在这时，一朵赤红的§R火玫瑰§!已然缓缓绽放。"
  PA1_meeting_intro: "§R很显然，她们做的不会比相马一也更好...\n\n是不是忘了什么...§!"
  PA1_meeting: "艾尔孚利登贵族议会"
  PA1_soma_sub_leader_name: "相马一也"
  PA1_soma_sub_leader_desc_1: "@PA1§R[PA1.GetName]§!的国民议会会长"
  PA1_soma_sub_leader_Diplomacy_desc: "相马一也"
  PA1_soma_sub_leader_desc: "南美的§B拉法耶特§!\n\n既然革命已经无法阻挡，而内战只会陡增帝国入侵的可能，相马一也自然而然的放弃了王位，承认了共和国的成立。\n\n作为协议的一部分，相马和那些旧贵族不同，不仅免于上断头台，还因为其在国民心目中的改革和精干形象，以及在军队中的影响力，成为了§R共和国§!国民议会的会长。\n\n这种微妙的平衡在今后很长的一段时间里都会成为§R共和国§!政治生活的一部分，维持着§R共和国§!和§B王国遗产§!的关系。\n\n§R但愿如此...§!"
#红线国策
  PA1_for_the_dark_contient: "看看这黑暗大陆"
  PA1_for_the_dark_contient_desc: "亡灵，王国，殖民，杀戮，战争，南美这片土地似乎是遭到诅咒一般，对着其之上的生灵宣泄着暴戾和苦难，混沌诸神的帝国，狼群肆虐的南方，人性泯灭，苦难一茬接着一茬，而反抗则寥寥数笔。"
  PA1_birth_of_revolution: "革命的火星子"
  PA1_birth_of_revolution_desc: "那么，全南美的暴君，还有那些高高在上的殖民者们，听好了，南美是一捆干柴，而我们就是那个火星子，你们点燃了这个火星子，而玩火者，必自焚。"
  PA1_for_lives_of_thousands: "依她们的意志"
  PA1_for_lives_of_thousands_desc: "我们是一个耗牛一般的民族，我们不再为了暴君和贵族而活，我们代表着所有受苦的人，所有哭泣的孩子，我们依照她们的意志，我们宁可死也不低下骄傲的头颅。"
  PA1_we_cannot_fall_down: "来吧，我们绝不倒下"
  PA1_we_cannot_fall_down_desc: "那个女王带着她的血腥帝国想要灭亡我们这个革命的螺丝钉，那么我们现在就告诉她们，我们是多么硬，打不烂咬不死的一颗钉子。"
  PA1_we_meet_you: "我在战壕里遇见你"
  PA1_we_meet_you_desc: "我们的国家和帝国之间隔着一座山，如果在上面修建防御工事，那么我们就可以以此为防线将暴君的杀人部队拦截在国境之外。"
  PA1_we_live_for_tomorrow: "你眼中承载着夏天"
  PA1_we_live_for_tomorrow_desc: "你看见她们开心的笑脸了吗，你看见那些捧着食物的村民了吗，她们的愿望很简单，那就是吃饱穿暖活下去，然而帝国则想要给她们套上枷锁，用恐怖威胁她们去和牛马一般活着，为了这来之不易的幸福，我们绝不能投降。"
  PA1_a_scarf_on_your_handle: "你背上披着一条红围巾"
  PA1_a_scarf_on_your_handle_desc: "远行去前线的少女啊，希望你可以收下这一条红围巾，山上天气冷，希望这一点微薄之力可以帮到你们。千千万万条红围巾，像千千万万个火炬，照亮着黑暗的大陆，也照亮着每个战士的内心。"
  PA1_a_song_for_you: "唱着关于你的歌"
  PA1_a_song_for_you_desc: "放牛的孩子站在山坡上看着远处的要塞敞开歌喉，用稚嫩的童声歌唱着对远去之人的思念，这份感情，你感受到了吗？"
  PA1_watch_you_for_growth: "在街巷看着你长大"
  PA1_watch_you_for_growth_desc: "老妇人站在村口的大陆上，望着子女挥手告别，就像无数次看着那个孩子逐渐长大远去的背影，而这个故事绝不能有一个悲伤的结尾。"
  PA1_a_new_world_in_your_mind: "你的心中有一个新世界"
  PA1_a_new_world_in_your_mind_desc: "共和，解放，公民，这些词太遥远宏大了吗？那么，自由，幸福，温暖这些想必是你一直追求的吧，少女。无论如何，我知道在你的眼中有一个新的世界，而我们要做的很简单，就是一起牵起手来，把这个新世界带来人间，我们团结一致，我们至死不渝。"
  PA1_yell_for_lives: "你呐喊着生命的话语"
  PA1_yell_for_lives_desc: "三色花绽放于王之血，而暴君以其死使千万黎民获新生。少女的生命怒放于地狱，高喊着生命的话语。"
  PA1_hurt_by_sunshine: "后背被烈日灼烧"
  PA1_hurt_by_sunshine_desc: "普鲁米修斯是苦难的，他遭受烈日的曝晒，而即便如此，理想绝无泯灭之可能，即便我们的后背被那毒辣的骄阳刺痛，我们也高傲的耸立，直到生命的谢幕。"
  PA1_sing_for_the_poors: "你唱着贫民梦想的旋律"
  PA1_sing_for_the_poors_desc: "千万年的苦难，无数个沉默的矿洞，无数片流血的田地，而你歌唱着那小人物的颂歌，对于箱庭之中的勇士不屑一顾，你赞颂所谓下人的美德和勇气，并刺向暴君的胸膛。"
  PA1_fight_for_freedom: "你为所有的儿女播下自由的战斗"
  PA1_fight_for_freedom_desc: "过去，我们为了国王和贵族而战，现在，我们为了自己而战，为了自由而战。"
  PA1_fire_and_fire: "步枪呼啸不断"
  PA1_fire_and_fire_desc: "子弹无情，但是只有子弹才能抵挡帝国的军队；步枪呼啸不断，给帝国的军队带来死亡。"
  PA1_make_you_free: "她使你自由"
  PA1_make_you_free_desc: "没有恐怖的美德是软弱的，没有美德的恐怖是邪恶的。暴力不是原罪，相反，只有她才能给我们带来自由。"
  PA1_gurrillas: "夏日使你成为游击队员"
  PA1_gurrillas_desc: "夏天的星空下，你带上面具，来到压迫最深的地方，用最小的代价，给暴君带来最大的伤痛。"
  PA1_angry_and_smile: "你带着微笑和愤怒"
  PA1_angry_and_smile_desc: "笑脸留给亲人和同志，而愤怒留给敌人。"
  PA1_fire_rose: "§R火玫瑰§!"
  PA1_fire_rose_desc: "§R火玫瑰§!，你如此高大年轻，准备好战斗，而今天，更年轻的孩子，从未知道你的名字，却再次捡起铺路石，并拆掉铁栏杆，§R过去的呐喊将会回响。§!"
  PA1_we_are_different: "我们生而不同"
  PA1_we_are_different_desc: "共和国在各方势力的妥协下建立，而面对帝国的威胁，我们虽然生而不同，但是我们应该团结一致，至少在击退那些杀人不眨眼的暴徒之前，如果他们中的某些还能算作人的话。"
  PA1_we_do_our_best: "但我们人尽其力"
  PA1_we_do_our_best_desc: "死人可没资格谈理想，只有活下去才是一切事业的基础，那么，无论你是谁，都应该支持共和国的儿女抗击帝国的伟业。"
  PA1_get_factory: "工厂转入战时状态"
  PA1_get_factory_desc: "现在开始，全部的重心都要转到两件事情上面来，保证粮食的供应和抵御帝国。"
  PA1_stand_up: "起来，共和国的公民"
  PA1_stand_up_desc: "一起走吧，祖国的子女，光荣的一天已经到来，暴政面对着我们！"
  PA1_wonderful_day_is_coming: "光荣的日子已经到来"
  PA1_wonderful_day_is_coming_desc: "拿起武器，公民们，组织起你们的军队，前进！前进！用敌人的污血，灌溉我们的田野！"
  PA1_solve_the_problem_of_food: "开仓放粮"
  PA1_solve_the_problem_of_food_desc: "那些蛀虫把我们的食物全部堆进仓库里，用恶犬锁起来，宁可我们吃野菜根饿死也不让我们吃上一口饭。现在，那些畜生被送上了断头台，再也没有什么可以阻止我们拿回我们的个人劳动成果了。"
  PA1_put_them_into_army: "流民编入军队"
  PA1_put_them_into_army_desc: "对于那些已落草为寇的人来说，比起让他们复工加大地方财政的压力，不如将他们编入军队，毕竟我们现在缺乏人手"
  PA1_extend_farmland: "大力垦荒"
  PA1_extend_farmland_desc: "南美存在大量的未开发土地，有些是难以开发的雨林，但有些则是有发展潜力的平原树林，与其让他们荒在那，不如让军队和农民去开发当地。"
  PA1_change_the_policy_of_farmland: "初步地租改制"
  PA1_change_the_policy_of_farmland_desc: "旧王国的土地税法具有严重的问题，作为左翼共和国，我们毫无疑问要确立土地国有制，但是这个过程是漫长的，在这之前我们需要先调整一个合理的税率，并且由国家直接收税，取代旧式包税官。"
  PA1_change_the_policy_of_farmland_2: "降低税率"
  PA1_change_the_policy_of_farmland_2_desc: "农民目前承受的土地税率还是太高了，这导致了大量农民抛下土地涌入城市，严重破坏了农业产能。为此，我们需要进一步降低税率。"
  PA1_whats_next: "那么接下来呢？"
  PA1_whats_next_desc: "现在帝国已经灰溜溜的滚蛋了，我们的共和国承受住了考验。但是，就如外界担忧的那样，当前的救国联盟内部混乱程度堪比1793年的雅各宾，所有人都在问一个问题：下一步呢？"
  PA1_chaos_of_gov: "不和的共和"
  PA1_chaos_of_gov_desc: "列宁同志说过，1917的苏俄混乱程度堪比雅各宾，我们现在是真正意义上的混乱如雅各宾。罗伯斯比尔在上啊，但愿我们可以像苏联一样在一位小樱那样的领导人领导下抵达新世界啊。但是显然我们还是得靠自己，相马为首的实用主义者显然对革命没什么热情，而民粹派又像埃贝尔一样过于热情，共和国的未来该往何方？藤原千花书记如此想到。"
  PA1_one_or_two: "参议院问题"
  PA1_one_or_two_desc: "摆在我们面前现在有两个选择，一个是效仿苏俄组建一个一院制国家，亦或者如同幻想乡一样组建一个两院制国家，在国民公会外再设立一个参议院。"
  PA1_information: "情报部门与权限"
  PA1_information_desc: "共和国处在威胁之中，我们需要强力机关来保卫我们国家的安全，当然，也有人担忧这些机关会反过来侵害公民的个人自由，如果我们给予其太大权力的话。为此，我们需要做出决定，是将她们作为一个普通的部门，亦或者革命的盾和剑。"
  PA1_help_poor: "制定基本扶贫法案"
  PA1_help_poor_desc: "战争结束了，但战争带来的伤痛和旧王国时期的遗留问题却一直困扰着我们。为此，有人提出我们应该编制一张保险网，来保证公民的基本生活水平。"
  PA1_tax_law: "累进税法"
  PA1_tax_law_desc: "我们不得不承认，现在我们的国家存在严重的贫富差距问题，为此，我们将推进累进税制度，通过向富人征税来实现财富的二次分配，来缓解国内的贫富差距问题。" 
  PA1_election: "选举问题"
  PA1_election_desc: "共和国需要一套选举制度，然而对于这个问题我们和立宪派似乎有不同的看法，立宪派认为应该立刻推进选举，但是当前的共和国局面动荡，倘若匆忙选举也许会导致严重的政治危机，为此，我们中的一部分认为应该推迟选举，来避免不可逆的后果。"
  PA1_land_reform: "土地改革法案"
  PA1_land_reform_desc: "母庸质疑，贵族和地主的暴行已经造成了全国人民的厌恶和唾弃，那么，将土地公有化，剥夺那些豪强的地产便成为了一件百利无一害的事情。为此，我们将提交改革法案，通过后便会在全国实行。"
  PA1_law_of_work: "劳动法"
  PA1_law_of_work_desc: "工人，这个长期在王政时期被忽视的群体，利益长期遭受了损害。为了保证工人和其他劳动者的权益，我们需要制定一部劳动法，来通过国家强制力维持这种新国家常态。然而，也许有些人不怎么乐意这么做，不过呢，一些利益承诺和威胁也许可以改变一部分人的想法。"
  PA1_local_development: "地方发展评议委员会"
  PA1_local_development_desc: "地方革命政府可以采取一些自主行动，来完成一些自主建设。根据各地发展状况不同采取不同的恢复和发展措施。"
  PA1_the_right_of_coucil: "救国委员会的职权？"
  PA1_the_right_of_coucil_desc: "虽然战争已经暂时结束，但是救国委员会却依然存在。我们现在面临着两个选择，解散救国委员会，彻底回归民本政治。亦或者暂时保留她，但停止她的进一步行动，仅在必要时刻保卫共和。"
  PA1_army_leader: "军队问题"
  PA1_army_leader_desc: "苏联的政委制度保证了军队的意识形态忠诚，使得她们是一支革命的军队，并被先锋队牢牢控制。然而立宪派和部分温和派则认为我们应该国有化军队，来确保民本政治和宪政常道的运行。因此，我们将做出最后决定，革命的军队，还是共和国的军队。"
  PA1_win_of_the_republic: "1917再临"
  PA1_win_of_the_republic_desc: "无产者和革命的胜利震颤了黑暗大陆，就如同1917的赤旗震撼了欧罗巴。满怀信心高歌前进，去为幸福战斗，赶走痛苦和贫困吧，少女们，就如同1917年一样奋战着。"
  PA1_country_planner: "建立国家规划委员会"
  PA1_country_planner_desc: "我们既然驱逐了傲慢的暴君，那么我们就应该同样驱逐那些旧的吃人景观。我们应该效仿苏联建立计划经济，并相应的创建国家规划委员会。"
  PA1_Cybernetics: "控制论的应用"
  PA1_Cybernetics_desc: "我们的委员会中的一名北美委员提出了一种名叫控制论的理论，她认为不同的学科和部门间应该打破壁垒，并建立反馈机制，来实现工厂的现代化和自动纠错。也许我们应该试一试。"
  PA1_network: "信息化的启示"
  PA1_network_desc: "计算机，这种新生的产物，拥有着巨大的潜力。对于计划经济和国家计划委员会而言，这种技术无疑是有巨大帮助的。"
  PA1_industry_plan: "工业化计划"
  PA1_industry_plan_desc: "常年的农业经济和战争已经让我们国家满目疮痍，工业能力远远落后于帝国和世界。为了保卫共和和革命，我们需要一份工业化计划。"
  PA1_active_labour: "激发工会自主性"
  PA1_active_labour_desc: "工会作为工人的基层组织，具有我们中央政府不具备的直接管理和直接民主作用。我们也许可以激发工会的激进性，来实现对于工业生产的高效管理。"
  PA1_union_of_city_and_town: "建立市镇同盟"
  PA1_union_of_city_and_town_desc: "在中世纪的德意志地区，为了抵御封建领主，自由市们建立了一种叫市镇同盟的结构，现在，为了各地协力合作保卫革命，我们也应该如此。"
  PA1_extend_army_factories: "铁与火之舞"
  PA1_extend_army_factories_desc: "没有恐怖的美德是软弱的，暴力是一种神圣的力量，而我们的革命需要这种力量，并且将它作用到那些暴君脑袋上，那么我们就需要枪炮，以及军工厂。"
  PA1_extend_infra: "全国基建计划"
  PA1_extend_infra_desc: "战火，战乱，暴政，祖国满目疮痍，基础设施遭到破坏，一个计划被提上日程，一个重建国家的计划。"
  PA1_general_command: "共和国总参谋部"
  PA1_general_command_desc: "共和国的军队应该早日摆脱无序和低效，我们应该创立一个总参谋部，来高效协调各个部队的作战和调度。"
  PA1_connect_fire: "与野火合作"
  PA1_connect_fire_desc: "纵观南美各国，也许只有野火革命军可以称得上是一个革命政权，我们是一个小国，不能孤立无援的作战。因此，我们可以向野火求助，通过她们的作战经验来帮助我们完成军事改革。"
  PA1_republic_step: "共和分列式"
  PA1_republic_step_desc: "正步走，整齐划一的步伐，不仅仅是阅兵仪式上的风景，也是军队组织度的象征，我们的共和国军队将大踏步向前。"
  PA1_fire_director: "火力覆盖"
  PA1_fire_director_desc: "共和国是一个小国，无法和帝国打绞肉战。为此，我们需要引入火力优势学说，毕竟消耗炮弹总好过消耗宝贵的人力。"
  PA1_iron_army: "斯巴达纪律"
  PA1_iron_army_desc: "军队不应该是自由散漫的，而应该具有铁一样的意志和纪律，信念坚定，服从命令，秋毫无犯才是共和国的革命军队该有的样子。"
  PA1_tank_wave: "装甲风暴"
  PA1_tank_wave_desc: "随着坦克和装甲力量投入战场，我们可以将其化为尖刀，刺穿敌军防线，减少冲锋导致的伤亡和难度。我们的装甲部队将是共和国最锋利的剑，刺向敌人的胸膛。"
  PA1_army_budget: "扩张军事预算"
  PA1_army_budget_desc: "我们四周被各种反动分子和敌人所包围，如果我们想要在这片黑暗大陆上生存，那么我们就需要向军事方面倾斜更多资源。"
  PA1_crazy_army: "意识形态狂热"
  PA1_crazy_army_desc: "这不是一场普通的战争，而是一场对于共和理想和革命的神圣战争，那些反动分子自以为把握了世界的命脉，而不知道风暴降至。我们的军队不是一支混吃等死的部队，而是一支革命的狂信徒。"
  PA1_around_us: "哪怕四周§g阴风阵阵...§!"
  PA1_around_us_desc: "我们的共和国和共和理想尚且处在危难之中，反动分子，混沌帝国以及其他糟糕的东西在我们周围窃窃私语，密谋着扼杀革命和共和。为了处在危难之中的祖国和革命，我们必须寻找能团结的力量。"
  PA1_fire_union: "而§R革命之火§!从未熄灭..."
  PA1_fire_union_desc: "我们也并非完全鼓励无援。野火革命军和她们的南美工人联合会是一个不错的朋友。我们应该立刻联系她们，来共同防御可能的敌人。"
  PA1_attack_kingdom: "而§g暴君§!必尝恶果..."
  PA1_attack_kingdom_desc: "索拉娜以为她扼杀了革命就可以高枕无忧，然而我们并不是坐以待毙的羔羊。既然索拉娜是南美反动分子最薄弱的一环，那么我们就要从她开始肃清这片大陆。"
  PA1_flag_rise: "...§R牧月的红旗§!仍然飘扬"
  PA1_flag_rise_desc: "幻想乡的大革命给我们带来了共和，而苏俄1917革命给我们带来了红旗，而现在她正迎风飘扬。"
  PA1_attack_PAQ: "击碎王冠"
  PA1_attack_PAQ_desc: "帝国以为自己可以随意发动战争和屠杀民众，而庶民不会有朝一日拿起尖刀挑开她们的宫殿大门。然而她们错了，错的很彻底，我们这些嚼着野菜根的姑娘手持钢枪，在团结如一人的口号下，要和她们大干一场！"
  PA1_attack_MGU: "绝望消弭"
  PA1_attack_MGU_desc: "魔法少女，这个充满悲情的种族，从诞生开始就受到了死亡和绝望的威胁。她们的联盟无法保护好她们，那么我们的美德和解放将会去拯救她们。"
  PA1_special_PAQ: "混沌对策部门"
  PA1_special_PAQ_desc: "帝国从被她们称为亚空间的地方，和一些亵渎美德的存在进行了交易，她们的部队被那种被称为混沌的诅咒力量所强化，对我们构成了严重的威胁。所幸我们的科研部门已经研究出了相关的特殊针对性武器，现在，让那些亵渎的存在尝尝自由之神阿尔比恩和至高主宰的愤怒。"
  PA1_large_bullet: "黑枪"
  PA1_large_bullet_desc: "对于那些强化体，常规口径的子弹显然作用有限，为此，我们的科研人员给出了一种新型的大口径单兵武器，她们称其为“黑枪”。这种枪械形态看起来像一把大型手枪，通体漆黑，但是子弹口径远超于常规步枪。当然，代价是，巨大的后坐力导致士兵过度使用这种武器可能损害身体健康。"
  PA1_against_pollution: "抗腐蚀套装"
  PA1_against_pollution_desc: "那些帝国军毫无下限的将混沌这种生物武器，好吧，我们也无法准确定义这是什么东西，总之她们把这种显然灭绝人性的武器投入了前线。不过幸运的是，我们发现银制涂层可以有效阻止这种东西的腐蚀。"
  PA1_special_MGU: "魔法对策部门"
  PA1_special_MGU_desc: "魔法少女主要有两大威胁，第一种威胁是魔法少女本身的魔法能力，第二种是魔法少女在魔女化后会变为巨大的不可控因素。不过归根结底，我们还在和魔法力量作战，不过我们在先前和其他势力打交道过程中，已经有了相关经验，现在只需要将先前的对策部门整合为一个部门即可。"
  PA1_study_MGU: "逆向魔法研究"
  PA1_study_MGU_desc: "当然，我们不是魔法少女或者其他的什么奇怪的生物，我们不可能通过肉体来发射魔法，但这不代表我们不可以利用魔法发生器和投诚的魔法少女来组建部队。"
  PA1_spy_MGU: "赤旗和少女"
  PA1_spy_MGU_desc: "我们在魔法少女联盟内部也并非孤立无援，有一批同样怀揣着解放他人和自己的魔法少女存在。那么，我们也许应该联系她们，来帮助我们取得胜利。"
  PA1_build_of_new_soc: "新世界的轮舞曲"
  PA1_build_of_new_soc_desc: "共和国逐渐步入正轨，并且初步的建设已经完成。那么，我们也是时候开启第二阶段的建设了。帝国的威胁虽然已经暂时远离，但我们不应该就此放松警惕，毕竟，帝国仍然存在，而她们不太可能就此善罢甘休。"
  PA1_the_start_of_new_cycle: "第二个经济计划周期"
  PA1_the_start_of_new_cycle_desc: "第一个经济计划周期在共和国的全体公民的劳动下已经宣告提早完成，那么，我们应当开启第二个经济计划周期了。共和国必须工业化，因为共和国必须生。"
  PA1_extend_people_industry: "扩大民用设施"
  PA1_extend_people_industry_desc: "在过去的几年里，我们为了应对边境的阴云，不惜劳民伤财，把几乎所有的资源都投入到了军事和国防上。如今帝国的威胁已经暂时远去，那么我们是时候进行民生建设了。"
  PA1_ask_soviet: "来自苏联的同志"
  PA1_ask_soviet_desc: "苏维埃社会主义共和国联盟作为全欧洲最强大的工业国之一，拥有丰富的工业建设经验，考虑到我们两个国家的意识形态的相近性，可以向苏联求援，获取相关方面的指导顾问。"
  PA1_find_energy: "发掘能源"
  PA1_find_energy_desc: "探测显示，我们国家地下深埋着石油和煤炭等工业需要的能源物质，然而王国时期我们的国家堕落腐朽，没有开采的能力。现在，随着我们的工业化进程的推进，我们是时候尝试去开采这些财富了。"
  PA1_red_army_industry: "无产阶级军事化"
  PA1_red_army_industry_desc: "我们的国家虽然击退了帝国，但是国际上的敌对势力仍然不容小觑。为此，我们作为无产者的国家，应该武装起来，为世界革命做好准备。"
  PA1_build_law: "标准建筑条例"
  PA1_build_law_desc: "在过去的很长一段时间里，各地的工匠和工人按照着各自传承的技术进行无序建筑。这样做导致了产出的大楼和其他建筑呈现出良莠不齐和难以维修的问题。我们将要召集一批工匠，商讨一个建筑质量和流程标准，并且在全国推广。"
  PA1_cap_school: "首都高等师范学校"
  PA1_cap_school_desc: "幻想乡在大革命后于人里修建了人间之里高等师范学校，人称人里高师，为幻想乡的建设和革命提供了源源不断的人才。我们也决定在首都设立贝亚特高等师范学校，来为我们的共和国提供人才。"
  PA1_get_resource: "开发金属"
  PA1_get_resource_desc: "在我们探查能源资源的过程中，我们的探测结果显示了我们的国家地下不止有能源物质，更有金属原材料。考虑到我们目前主要的金属主要依赖于进口，发掘这一批原料毫无疑问可以缓解我们原材料不足的问题。"
  PA1_computer_industry: "计算机工业"
  PA1_computer_industry_desc: "计算机，这种新技术，给我们的工业带来了新的可能。计算机比人力更加的准确，高效，在工业流程中可以发挥出重要的作用。"
  PA1_worker_list: "劳工条例"
  PA1_worker_list_desc: "目前，关于工厂内部的详细技术安全指导，以及生产民主的条例并没有被被明确的制定，尽管各地有自己的情况，但我们仍然可以规定一些基本的这方面的细则，来完善我们的工厂管理体系。"
  PA1_strictly_law: "严格落实劳动法"
  PA1_strictly_law_desc: "为了确保我们的工人可以得到应有的待遇和福利，我们需要保证劳动法的实施和落实，而不是让它们仅仅作为一纸空文留存在纸面上。"
  PA1_develop_worker: "劳工培训"
  PA1_develop_worker_desc: "一个技术工人的作用顶得上十几个无经验的新人。因此，在她们正式进入工厂参与劳动前，我们必须要为他们提供相应的劳动培训和技术指导。"
  PA1_organization_of_workers: "工厂工人委员会"
  PA1_organization_of_workers_desc: "在王政时期，工厂的主人是那些贵族或者厂长。但是现在，我们把她们赶走了，我们自然不会再设立一个国王凌驾在我们的脑袋上，因此，我们决定设立在每个工厂设立一个委员会来对工厂进行民主管理。当然，我们也会让地方革命政府任命一位管理员，但是总体的管理小组只服从于委员会。"
  PA1_management_technology: "工业管理技术"
  PA1_management_technology_desc: "对于整个工业体系的规划不是一件简单是事情，这涉及到各个部门的协调和反馈。为此，我们将积极学习苏联的管理经验，协调好工业部门的工作。"
  PA1_soc_economy: "美德自钢铁中迸发"
  PA1_soc_economy_desc: "我们在王国的废墟上，建立一个民主共和国，我们用美德取代暴政，用钢铁保卫了我们的共和。而现在，美德自钢铁中绽放。"
  PA1_central_military_commission: "全国军事委员会"
  PA1_central_military_commission_desc: "在前几年我们设立了总参谋部，而现在我们决定再进一步，合并另外几个冗余部门为一个更加高效的全国军事委员会，来统一规划军事行为。"
  PA1_modern_theroy: "理论现代化"
  PA1_modern_theroy_desc: "南美在很长的一段时间里都是被视为野蛮世界。情况也确实如此，落后的社会和停留在几百年前的军事理论依旧缠绕在我们的头顶。因此，我们必须积极改进理论体系，引入欧洲的先进理论体系。"
  PA1_invite_soviet_officer: "邀请苏联军事顾问"
  PA1_invite_soviet_officer_desc: "我们的军事基础较差，作为社会主义盟友和欧洲第一陆军大国的苏联自然是我们寻求帮助的优先选择。"
  PA1_wild_fight: "野战训练"
  PA1_wild_fight_desc: "南美不同于欧洲，大片未开发的雨林和山地河流使得常规军队无法有效发挥战斗力，为了克服这种问题，我们需要加强野战训练。"
  PA1_Surume: "部队特战化"
  PA1_Surume_desc: "圣杯等欧洲国家训练过一批特殊部队，用于特殊地形特化作战和精英训练。南美大地需要针对雨林地形的特殊训练，为此我们可以尝试将普通部队进行特化训练，来应对南美的未来战争。"
  PA1_super_army: "单兵重火力装备"
  PA1_super_army_desc: "在和帝国的战争中，我们发现了敌军大规模应用混沌恶魔和大体型单位，使得轻步兵难以对付。为了对付这些特殊的敌人，我们需要确保步兵也具有应对坦克单位的重火力。"
  PA1_take_them_over: "人人应为共和国献身"
  PA1_take_them_over_desc: "我们的国家土地狭小，人口也不足。如果想要抵御东边的利维坦，那么我们需要确保人人都可以在危难时服役。"
  PA1_red_imperial: "举国战争态势"
  PA1_red_imperial_desc: "帝国似乎已经从失败的阴影中回过神来，并且开始蓄势待发，为了保卫共和国，我们要做好举国战争的准备。"
  PA1_information_war: "信息化作战"
  PA1_information_war_desc: "现代战争中，通讯已经成为一个必不可少的部分，那么，我们自然而然的要把信息化技术应用于军事领域。"
  PA1_extend_company: "扩大军事企业"
  PA1_extend_company_desc: "王政时期留下了一批军事企业，如今她们已经被公有化了，然而我们不能因为她们过去的性质就忽视了对其的投资。"
  PA1_cheap_tank: "标准化坦克装配"
  PA1_cheap_tank_desc: "我们的坦克目前缺乏规范化流程化生产，我们应该引入标准化坦克装配技术，这会帮助我们更好的生产装甲装备。"
  PA1_officier_train: "军官训练"
  PA1_officier_train_desc: "既然部队和理论已经现代化了，那么我们的将军也应该现代化。为此，我们将在苏联顾问的帮助下训练我们的将军"
  PA1_more_guns: "人手一把枪"
  PA1_more_guns_desc: "为了确保我们的军队的装备供给，我们将使用最新的枪械装配技术，使得我们可以以更低的价格制造出相同的枪械。"
  PA1_more_support: "补给扩大"
  PA1_more_support_desc: "在上一次战争中，我们意识到了南美的烂地条件常规补给的困难，不过随着我们的交通技术的发展，我们也许可以扩大我们的有效补给范围。"
  PA1_we_are_red_army: "我们是共和国的赤色部队"
  PA1_we_are_red_army_desc: "我们要做的，只有一件事，开拓自由的国家，只有这一件事。风雪喧嚣，星星飞过的夜晚也是，心一直所指的，也是遥远的远方！"
  PA1_blood_Saturday: "垂泪之日"
  PA1_blood_Saturday_desc: "共和的旗帜之下，谁曾想为自由而战的英雄却遭到脑满肠肥的宵小之徒的暗算，血染大地，死不瞑目。倘若至高主宰仍在注视，那这堕落而血腥的一天必定是垂泪之日。"
  PA1_anti_amry_party: "维耳图斯震怒"
  PA1_anti_amry_party_desc: "这件事绝不能就此罢休，无论是谁，谁策划了，谁下令了，谁执行了这次败坏美德的反革命暴行，都必须付出代价，都要血债血偿。彻底的调查，彻底的清算。"
  PA1_do_not_know_too_much: "愿理性仍存"
  PA1_do_not_know_too_much_desc: "调查是有必要的，但是大规模的调查则是有损革命政府的。政治不是过家家，妥协是政治的美德，也许我们应该适可而止，对一些不那么“严重”的人睁一只眼闭一只眼。"
  PA1_execution: "当断头台丮丮而立"
  PA1_execution_desc: "共和国不会容忍这些为了一己私欲，而不惜贪污，甚至屠杀人民，屠杀英雄的叛徒，败类。等待她们的下场只有一个，那就是被断头台枭首。"
  PA1_pay_to_victim: "宣告普罗米修斯无罪"
  PA1_pay_to_victim_desc: "处理完叛徒，我们也该去尽我们作为一个革命政府的义务了。那些抚恤金和额外的赔偿，我们都要如数交给那些受害者。"
  PA1_make_laws_for_rerired_army: "悲剧永不再现"
  PA1_make_laws_for_rerired_army_desc: "虽然我们赔偿了受害者家属，然而这件事情反映出了长期以来的退伍兵待遇问题存在严重隐患，待遇不足，发放不规范，贪污。我们需要一部法律来堵上这个缺口。"
  PA1_limit_army: "暴力必须是神圣的，且具有美德"
  PA1_limit_army_desc: "军队为什么能向昔日的老前辈，老英雄开枪？为什么军队不经过中央的同意就可以私自行动，就可以私自插手警察负责的治安事件，最后甚至还能私下未经审叛处决他人？我们的暴力到底是否仍然掌握在我们国家和革命政府手里？还是说已经沦为了某些宵小之徒的私兵，如此目无法纪，引得我们深思。"
  PA1_end_problem_1: "告慰亡灵"
  PA1_end_problem_1_desc: "结束了，我们惩罚了叛徒，补偿了受害者，也许是时候给这件事情画上句号了。"
  PA1_revolt_youxi: "游汐港暴动"
  PA1_revolt_youxi_desc: "看来我们忘了一件事，那就是游汐港的特殊性。教会在当地的资产很大一部分来自于当地社区的捐赠，当然，教会也会在日后逐渐将这笔财富还给当地社区。我们鲁莽的行为毫无疑问的导致了当地人的反感。同样的，教会也是当地农民进步的一大途径。无论如何，当地人已经抗议了我们的行为，并且根据情报，似乎有更为激进的活动正在酝酿。"
  PA1_indemnity: "紧急拨款"
  PA1_indemnity_desc: "好吧，看来我们又需要花钱了。既然没收了他们的资产，那就把属于社区的那一部分还回去，但愿我们还还得起。"
  PA1_ready_army: "准备军队"
  PA1_ready_army_desc: "无论如何，我们都要做好最坏打算，如果最糟糕的情况发生了，那么我们就必须动用最后手段来平定乱局。"
  PA1_special_envoy: "让特派员前去交谈"
  PA1_special_envoy_desc: "好吧，在我们能采取有效的行动前，我们需要一个人去和他们谈谈，来稳住他们。当地的特派员？早就被当地人当过街老鼠了。所以，我们应该选择另一位可靠的中央特派员去和他们交谈。"
  PA1_pay_indemnity: "支付赔款"
  PA1_pay_indemnity_desc: "那么，我们是时候把钱还给当地人了。"
  PA1_make_promise: "承诺席位"
  PA1_make_promise_desc: "既然原本的进步道路被我们堵死了，我们不如给他们另一个泄压阀。当地的政府和议会里为他们保留一些席位，当然，我们还是确保革命派占多数，反正他们只管自己的个人前途。"
  PA1_arrest: "逮捕顽固分子"
  PA1_arrest_desc: "当然，总有一帮顽固分子，这些人专注于恢复旧秩序，我们的赔偿对他们没用，他们一意孤行，那么我们就不得不对他们采取雷霆手段了。"
  PA1_end_problem_2: "不流血的平叛"
  PA1_end_problem_2_desc: "带头的顽固反动派已经被我们逮捕，而其余诉求被满足的群体已经被我们分化和收买，现在剩下的那些家伙也掀不起风浪了。"
  PA1_reyue: "热月九日"
  PA1_reyue_desc: "纸牌屋终究还是坍塌了，看来，随着时间流逝，我们和那些潜在的保皇派及保守派间的矛盾已经愈演愈烈。随着藤原千花的报告被打断，一切开始了。1794年之于幻想乡，现在也会发生在我们的共和国。"
  PA1_the_storm_is_approaching: "不欢而散"
  PA1_the_storm_is_approaching_desc: "国民公会的争吵并没有结果，现在国民公会已经休会，而两派人马各自踏上了自己的道路，秩序正在崩溃。"
  PA1_the_dream_of_butterfly: "蝴蝶之梦"
  PA1_the_dream_of_butterfly_desc: "凯撒能如此，为何我不能。庄周梦蝶，究竟革命是梦呢，还是王国是梦呢。"
  PA1_goosestep: "卢比孔河"
  PA1_goosestep_desc: "“哪怕化为国家的罪人，我也不能眼睁睁看着我的爱人被围困在重围中，原谅我这一次吧，原谅我。”"
  PA1_people_stop_them: "禁止通过！"
  PA1_people_stop_them_desc: "从首都到边陲，无数的民兵和人民在呐喊，他们虽然方言不同，但喊着同一句话：他们绝对不能通过！"
  PA1_tell_people: "动员起来，公民"
  PA1_tell_people_desc: "四宫辉夜和共和国报的声音在全国回荡，一个声音在响起，公民们，动员起来，消灭暴君，消灭叛乱，墨索里尼和凯撒的孽种绝不能在我们的国家降生"
  PA1_organise_army: "轮到你开口了，毛瑟枪同志"
  PA1_organise_army_desc: "我们不要那些空口大白话的泛泛而谈之辈，我们需要你们，无数把英勇的毛瑟枪，只有你们才能阻止叛军。"
  PA1_the_end_of_play: "大戏落幕"
  PA1_the_end_of_play_desc: "结束了，一切都该结束了..."
  PA1_the_end_of_chaos: "混乱的终结"
  PA1_the_end_of_chaos_desc: "革命和反革命，以及几个月来的动荡，无数人为之付出生命，终于在今日画上句号。国家的命运已经被决定。"
  PA1_new_kingdom: "国祚永存"
  PA1_new_kingdom_desc: "野心家的愿望落空了，暴民的阴谋也失败了，现在，祖国又回到了艾尔孚里登王室和莉希雅皇女慈爱的怀抱中。天佑王国，永葆昌盛，天佑女王，胜利长随！"
  PA1_no_one_wins: "现状永存"
  PA1_no_one_wins_desc: "相马一也和保守派仍然在国会中占据一席之地，虽然失败的叛乱使得一些和莉希雅走的很近的人士和莉希雅一起被罢免下狱，但是相马一也却仍然作为国会议长在政治中有着一席之地。也许，共和国的未来将永远如此。"
  PA1_revolution_win: "暴君已死"
  PA1_revolution_win_desc: "随着相马一也出逃，在过去的几天里，曾经的皇女莉希雅和无数的叛乱参与者一起在断头台上人头落地，共和国可以骄傲的宣布自己已经杀死了暴君。共和国和共和主义的理想的旗帜将会永远飘扬在这片土地之上。"
  PA1_no_socialist: "边缘化激进派"
  PA1_no_socialist_desc: "对于那些暴徒，莉希雅皇女并没有过度的追责，她们从哪来回哪去，最好和她们领头的那几个疯丫头一起滚出去，当然，莉希雅的仁慈有一个前提条件，就是她们永远不要再试图干涉王国的政局。"
  PA1_ban_parliament: "驯服国民公会"
  PA1_ban_parliament_desc: "莉希雅作为一名年轻的皇女，自然和那些老顽固不同，国民公会作为民众和莉希雅皇女沟通的地方，当然可以被保留，当然，前提是国民公会不要过度的损害王国的宪政常道。"
  PA1_continue_soma: "继续相马改革"
  PA1_continue_soma_desc: "作为相马一也的妻子，莉希雅当然明白王国旧体制的不可持续性和相马一也改革的必要性。现在，大权在手的莉希雅自然会毫无保留的支持自己的丈夫推进被暴民打断的改革。"
  PA1_keep_revolution_partly: "大革命的产物"
  PA1_keep_revolution_partly_desc: "不可否认，对于莉希雅和相马一也的部分改革而言，大革命极大的摧毁了那些拦路的老顽固并且一步到位的把他们丢尽了历史的垃圾堆。自然而然的，莉希雅也不想那些老东西再跑回来趴在王国的躯体上尸位素餐。"
  PA1_republic_kingdom: "自由的王国"
  PA1_republic_kingdom_desc: "莉希雅并不讨厌大革命的部分产物，相马一也更是只厌恶其中的部分激进产物，那么，新的王国也不需要是一个传统的王国，她可以是自由的，崭新的王国。"
  PA1_kill_theater: "清算叛徒"
  PA1_kill_theater_desc: "虽然出于一些原因，我们只能软禁莉希雅而不是处死她，但是并不意味着我们不能杀一些比较容易下手的典型案例来杀鸡儆猴。"
  PA1_get_new_friends: "拉拢温和反对派"
  PA1_get_new_friends_desc: "显然，我们需要接下来长期在国民公会里和保守派以及立宪派唇枪舌剑，不过话不要说这么死，有一些立宪派和我们有较为相近的想法，给他们一点许诺，也许可以有不一样的效果。"
  PA1_enhance_workers: "加强工会权力"
  PA1_enhance_workers_desc: "显然，光靠议会里的吵嘴是不够的，为了在社会上加强自己的政治力量，我们需要让工人具有更大的话语权，那么进一步扩大工会权力显然是有必要的。"
  PA1_give_a_hand: "适当让步"
  PA1_give_a_hand_desc: "我们应该吸取先前的教训，不要把一些温和派逼的太紧，给他们一些空间，然后温水煮青蛙或许是个更好的选择。"
  PA1_step_by_step: "逐步走向新世界"
  PA1_step_by_step_desc: "无论如何，我们至少走在了逐步向着新社会而去的道路上。一些适当的让步，并不妨碍我们去取得胜利...但愿如此..."
  PA1_revolution_endless: "从革命走向革命"
  PA1_revolution_endless_desc: "几年前，我们的革命摧毁了王国政治；而现在，我们的第二次革命摧毁了莉希雅和凯撒的野心。共和国的旗帜将永远飘扬在南美上空。"
  PA1_horror: "美德与恐怖"
  PA1_horror_desc: "虽然我们已经处死了莉希雅和其他的叛乱分子，但是这不代表我们的国内没有更多的潜藏着的保皇党分子，就像幻想乡革命之初的法兰西贵族余孽一般。那么我们需要亮出刺刀，将他们从社会上清除出去。"
  PA1_rebuild_society: "进一步社会重组"
  PA1_rebuild_society_desc: "国民公会内部已经没有保皇派可以掣肘我们了，是时候推行进一步的社会结构重组了。我们将彻底消灭资产阶级法权和保皇党存在的社会经济基础。新社会建成之日，革命完成之始。"
  PA1_end_of_horror: "宣告恐怖时代已经终结"
  PA1_end_of_horror_desc: "随着最后的蛀虫被我们的热心公民送上断头台去见她们的莉希雅皇女，新社会终于脱胎换骨于旧世界的废墟之上。恐怖已然褪去，唯留美德与共和。"
  PA1_the_wonderful_future: "南美共和壁垒"
  PA1_the_wonderful_future_desc: "在南美这片多灾多难的土地上，我们不会是第一个，也不会是最后一个举起共和旗帜的，但我们一定会成最坚实的壁垒。"
  PA1_north_countries: "目光向北"
  PA1_north_countries_desc: "南美的事务平息后，我们是时候把目光投向北美了..."
  PA1_revolutional_friends: "革命盟友"
  PA1_revolutional_friends_desc: "中美洲的红色圣遗物革命者取得了胜利极大的促进了美洲革命的传播，我们是时候派人前去建立联系了。"
  PA1_they_should_die: "侧卧之塌"
  PA1_they_should_die_desc: "中美洲的势力毫无疑问给我们带来了巨大的威胁，为了国家的安全，她们必须被铲除。"
  PA1_attack_USA: "旧秩序的终结"
  PA1_attack_USA_desc: "北美的旧秩序该结束了，我们绝不会允许这样一个巨大的威胁存在。是时候把他们彻底赶出美洲了。"
  PA1_free_america: "自由的美洲"
  PA1_free_america_desc: "美洲，这片美丽的土地，在殖民者和野心家手里饱受蹂躏，她被监禁，被逮捕，被伤害，但是自由的儿女从未放弃过，以前没有，现在没有，未来更不会有。自由将回归这片土地，直到永远。"
#红线事件
  PA1_revolution_list.1.t: "青天颓"
  PA1_revolution_list.1.d: "“所以，你可以解释解释你的改革效果吗，陛下，或者说勇者先生。”几个贵族拿着一份报告，面露讥讽的看着相马一也。“这个，这个，我可以解释，”相马显然有些慌乱，他清楚前一阵子的改革已经得罪了太多的旧贵族，而现在他不仅立足未稳，还让人大失所望。“农业改革已经取得一定效果了，经济改革也一定可以的，只需要给我更多的时间...”“时间？勇者先生什么时候开始也要干这种拖延时间来掩盖自己失败的行为了。”贵族笑容更加明显，相马感觉到了周围群狼一般的眼神，而他就像一只流着血的山羊，自己的失误散发出的血腥味已经吸引到了这些豺狼的注意，而他也已经跑不掉了。\n\n宫门被推开，老国王推门而入，相马一也抱着最后的希望看向老国王，“陛下，请再给我一些时间，只需再几天就...”老国王只是摆了摆手，眼神复杂又无奈的看着他：“陛下，或者说勇者先生啊，这些都没关系，你是我们国家的功臣，又是国王，我们怎么会怪你呢。”相马眼中泛起一丝欣喜，然而很快又被当头一棒，“不过啊，什么事情都拜托你还是太失礼了，这些说到底也是我们王国自己以前留下的问题不是吗，你也很累了吧，过几天和莉希雅大婚之后，就去芬迪尔住几天吧，那边阳光和海滩好，就当是和我女儿去度假了吧，至于王国的事情..."
  PA1_revolution_list.1.a: "“我们会处理好的...”"
  PA1_revolution_list.2.t: "火炬"
  PA1_revolution_list.2.d: "“有进展了吗。”老国王坐在卧室的沙发上，低头看着一份份财政报表，粮食短缺报告和流民问题的奏折，窗外，黑压压的人群包围了皇宫，他们大多面黄肌瘦，还有些人需要他人搀扶着才能站稳。“陛下，他们要求见国王，额，不是您，陛下，他们要见相马先生。”老国王深吸一口烟，缓缓吐出，“相马，昨天刚和莉希雅去芬迪尔度假了吧，怎么，我们要把他召回来吗。”几个贵族面面相觑，犹豫着不愿开口。他们见识过相马的手段，要是这时候给他叫回来，那借着这股民意所有的经济农业改革方案就都能被强行通过了，包括他们绝对不愿意接受的那些。\n\n老国王苦笑一声，摇了摇头，便不再言语。与此同时，窗外的民众已经再也等不及了，几个大胆的农妇已经爬过栏杆试图进入皇宫内院，皇家警卫立刻举枪瞄准了他们，大声呵斥着让他们回去。农妇则是叉着腰，表示自己家里还有几个孩子要养，除非同意立刻满足他们对于粮食的要求，让贵族开仓放粮，否则今天绝对不会后退一步。\n\n双方紧张对峙了几个小时后，皇家警卫长最终忍无可忍，朝天开枪向他们下达了最后通牒，要求他们立刻回去，否则视为叛乱。\n\n“他们在恐吓我们，”一个工匠大喊道，“他们想放任我们饿死！”民众喧闹起来。皇家队长下令开火，但是迟迟没有反应，队长回头看向警卫队，却发现士兵早已把枪收了起来，缓缓的从院子侧门离开了。“你们这是叛国！”队长声嘶力竭，却无人停下脚步。“不，我们忠于艾尔孚利登，忠于相马国王。”一个士兵回头看了眼队长，“而相马陛下绝对不会放任臣民饿死。”队长脸色惨白，看着欢呼的民众推到栏杆冲进院子，把他推到在地，着了魔一样四处寻找粮仓。\n\n几分钟后，几个农夫和工匠押着伪装成平民，脸色铁青的老国王和贵族从正门出来。人群后方走出一个粉色头发的少女，给国王和贵族各自戴上了农夫帽，贵族们相视无言。“你们好，我叫藤原千花，”少女笑着开口。"
  PA1_revolution_list.2.a: "“希望你们喜欢这顶帽子。”"
  PA1_revolution_list.3.t: "决断"
  PA1_revolution_list.3.d: "皇家宫殿，或者说现在的临时政府里，几百双眼睛望着藤原千花。在此之前，他们就已经争论了如何处理皇室和贵族，更重要的是，如何处理现在仍在芬迪尔度假的国王相马一也和莉希雅。激进派认为一定要逼迫国王退位，然后彻底让革命法庭清算其和旧贵族的罪责。而温和派则认为相马一也上台以来改革措施显著，民生极大改善，且军队大多数仍然效忠于国王，民众也对相马一也本人有着极大的信任，倘若清算他一定会全国骚乱，从而给帝国或者保皇党可乘之机。\n\n藤原千花本人则是冷汗直冒，毕竟根据报告各地的军队都在集结，目前尚不清楚他们的立场，而凭借着帝都的这点革命军和投诚部队完全没有抵抗的能力。尽管她也很想让相马一也放弃皇位建立共和制度，但其中的风险也是不言而喻的。\n\n于此同时，远在芬迪尔的相马一也和莉希雅也面色凝重的看着不断传来的军队私自集结和首都已经被共和派占领的消息。相马很清楚如果此刻发生内战会有什么后果，也很清楚自己不退位那么内战的风险就不可避免。但是退位了自己有会有什么下场呢。他不由得想到了在北美洲的法兰西王国，即便是相马本人无所谓共和或是君主，只要可以抵御帝国那么他都愿意尝试，但是自己的身家性命却不得不考虑。\n\n“陛下，有你的信件，”一个卫兵拿着一封来自首都的信件敲响了房门。”“进来”相马回应到。卫兵递上了信件，相马和莉希雅眉头紧锁的接过信件，颤抖着拆开..."
  PA1_revolution_list.3.a: "“临时政府主席藤原千花致相马一也陛下...”"
  PA1_revolution_list.4.t: "爱，死亡和共和"
  PA1_revolution_list.4.d: "几天内首都笼罩在不安和动荡中，有人传闻军队即将开入首都清算共和派，还有人说马上就要肃清保皇派了，街上的行人也是形单影只，市场上的人也是稀稀落落，有些摊位索性直接不出摊，竟也没有导致其他摊位的拥挤。藤原千花不安的等待着，尽管她已经压制了激进派告知了相马如果他接受共和，那么临时政府不会对相马一也进行迫害，并保证他的基本生活质量。然而权力的欲望是难以克制的，藤原千花出身外交官世家，对于这条亘古真理再熟悉不过。\n\n这时，城外传来了骚动，有人高喊着国王的车队来了，临时政府的国防部长也立刻推门而入，神色慌张。“放他进来。”藤原千花定了定神色，开口道。“什么，”国防部长惊愕的看着藤原千花，“您说什么，主席小姐。”“我说放他进来，”藤原千花冷冷开口，“如果发生内战，我们的革命可能就到此为止了，艾尔孚利登的历史可能也就到此为止了。”“可是”“开门！”藤原千花拍了拍桌子，“我让你开门听见没有。”\n\n半小时后，楼下传来了人群的聚集声，欢呼声和叫骂声。“藤原小姐，”相马一也在楼下喊道。藤原千花走上阳台，相马一也站在马车顶上，挥舞着农夫帽。"
  PA1_revolution_list.4.a: "“公民相马一也，恭喜共和国成立。”"
  PA1_revolution_list.5.t: "\n\n\n\n\n\n[news_event_spec_logo]\n\n\n\n\n\n\n\n                                                                                                                                                       艾尔孚利登爆发共和主义革命"
  PA1_revolution_list.5.d: "就在今天，艾尔孚利登王国走向了它的末日。在过去的几周内的宫廷政变和长期以来的农业和财政问题的作用下，王国政权和君主制被藤原千花领导的“南美共和行动”以及愤怒的民众推翻。\n\n由于国王相马一也在革命时尚且处于半废黜状态，贵族议会遭到了来自改革立宪派和共和派的双重压力，革命者在短短一天内就控制了首都并逮捕了贵族议会议员。而迫于帝国的威胁，前国王相马一也和共和派达成了和解，共和制度和革命成果得到了几乎完全的保留，但是相马一也和其妻子免于清算，并在国会任职。外界评论家认为这个脆弱的同盟不会长久，而另一部分则认为这是和圣杯王国的“光荣革命”一般的政治壮举。\n\n目前，苏联及第三国际的成员在几乎第一时间就表达了热情的祝贺，并表示这是“共和主义和社会主义的胜利”，但同时表达了对政治稳定性的担忧。圣杯王国和民主国家同盟大多表达了谴责，认为“革命有走向暴徒暴动”的趋势。而[PAQ.GetName]则发表了一篇不符合外交礼仪的几乎是歇斯底里的羞辱发言。"
  PA1_revolution_list.5.a: "共和主义在南美的胜利"
  PA1_revolution_list.5.b: "不过是一群暴徒"
  PA1_revolution_list.6.t: "战争与和平"
  PA1_revolution_list.6.d: "“为此，我们建议，尽早完成对于土地和农业的集团化生产来解决当前的农业生产效率低下问题...”贝亚特小巷内的一家报社内，四宫辉夜，《共和报》的主编和著名笔者，正在口述着关于农业改革的社论。作为藤原千花的老相识，四宫辉夜同样在很久以前就对于王权政治有所不满，在王国时期就创办了地下报刊《共和报》。而共和国建立后，四宫辉夜却依旧选择在旧址继续印刷发行《共和报》，用她的话说，就是“为什么呢，大概是这边比较有感觉吧。”\n\n正在报社里的工作有条不紊的进行时，木门“咔哒”一声被人推开，“我来自议会，辉夜小姐，我们有麻烦了。”早坂爱，藤原千花的秘书官，抱着一叠会议纪要和其他文件闯进报社。\n\n辉夜有些不悦，“藤原千花那家伙，也知道来找我啊。”早坂爱白了她一眼：“你先看看这个”辉夜有些得意的拿过一份议会纪要，随后脸色逐渐凝重。“都停一下，”辉夜高声喊道，“先把农业改革的社论放一边。”工人们停下了手里的工作，疑惑地看着她。“头版头条位置，”四宫辉夜顿了顿，“[PAQ.GetName]的部队正在边境线集结。”工人们顿了一下，肌肉立刻绷直，几个本来正在说笑的女工也停止了嬉闹。“为此，我呼吁贝亚特的公民做好入伍，”四宫辉夜继续说道，“哦不对，改掉，是做好卫国的准备。”"
  PA1_revolution_list.6.a: "“《共和报》特别报道”"
  PA1_revolution_list.7.t: "不必再哭泣"
  PA1_revolution_list.7.d: "游汐港的码头上，船只来来往往，在晨光中，共和国的旗帜飘扬在海关大楼的楼顶，迎着海风飘扬。“哟，姑娘，最近怎么样。”少女的肩头被人重重拍了一下。“大姐，你怎么来了，”少女笑了笑，抱住了久别的亲人，“最近我们这些泥腿子可以吃饱了，收税的那些老爷已经很久没来了，然后上个月一群人还给我们发了粮食，现在只要每个月把基本的收入税报上去就可以了。”“哦，是吗，”大姐笑了笑，“你知道为什么吗。”少女摸着脑袋，然后抱起一捆蔬菜，“我哪知道这个，就听那些城里人说什么国王没有了，然后换掉了海关楼上的那面星月旗。”少女把蔬菜从车上放到摊子上，擦了擦头上的汗，“不过嘛，现在乡下的氛围确实好很多了，大家都有饱饭吃之后小偷小摸的什么也少了很多呢。”橙黄色的晨光照在少女脸上，少女的笑容被海风吹过，带着乡野土壤的味道。“那你呢，大姐，你怎么突然想起来回来了。”大姐一拍脑袋：“哎呀，忘了说了，是首都那边派我过来处理前一阵子的革命的后续事宜的。”“什么是革命”，少女问道"
  PA1_revolution_list.7.a: "“革命啊，就是让我们吃饱饭,不再哭的东西。”"
  PA1_revolution_list.8.t: "孩童"
  PA1_revolution_list.8.d: "清晨的晨雾笼罩在山谷里，马匹和军械的碰撞声叮叮当当。“还有多久到啊，皮埃尔。”一个士兵转头问道。“我怎么知道，”另一个名叫皮埃尔的士兵抱怨了两句，“这破路到底什么时候是个头。”泥泞，泥泞，还是泥泞，士兵们已经在泥泞中前行了几天，士气也逐渐走低，如果说出发时是精神抖擞，那么此刻的部队的热情早已被无穷无尽的山路和泥潭拖进了一个深不见底的坑洞。“所有人，就地休息吧。”带队士官喘着气宣布到。士兵们如蒙大赦，纷纷靠在石头和树上喝水，咀嚼压缩饼干。\n\n“一起走吧，祖国的子民们...”“你刚刚唱歌了？”皮埃尔问身边的士兵。“唱什么歌啊，我哪会唱歌。”疑惑间，远处的迷雾中一个人影逐渐清晰，士兵们转头看去，原来是一个附近牧羊的孩童，嘴里哼唱着奇怪的调调。“小孩，你在唱什么。”皮埃尔走上前问道。“天狗里曲，港口那边的叔叔们唱的，我还能唱给你听呢。”“那好啊，你唱吧。”皮埃尔饶有兴致的看着孩童。“一起走吧，祖国的子民们，光荣的一天已经到来，暴政面对着我们，已经升起血腥的旗帜...”"
  PA1_revolution_list.8.a: "“拿起武器，公民们！前进，前进！”"
  PA1_revolution_list.9.t: "母亲"
  PA1_revolution_list.9.d: "村庄的早晨静悄悄的，少年戴上了三色花的帽子，和妹妹不动声色的拥抱后，爬上了另一群热情小伙子的卡车，在发动机轰鸣声中逐渐变小模糊，消失在乡道的尽头。妹妹看到哥哥离去才松了一口气，然而下一刻心脏一缩，一只苍老的手搭上她的肩膀。“还是走了吗，”一个苍老的女声在背后响起，“哎，我这个老婆子哟，以后只能靠你了呀。”妹妹转过头去，有些尴尬的看着苍老的母亲，“妈，对不起，我没告诉你...”“哎哎，算了，”老妇人摆摆手，望向那层叠的笼罩在晨雾里的群山，泥泞的乡道，还有和几十年前一样的永远繁茂的树林，“小伙子，终究还是要出门的。”\n\n是啊，终究会出门的啊。老妇人有那么一瞬似乎感觉自己又回到了年轻，追赶着年幼的男孩，跨过泥泞的道路和积水坑，男孩转头朝母亲一笑，随后手指触及，顷刻间指尖枯槁，现实追上了老妇人，眼角挂着几滴泪。“没事的，哥哥说他几个月后就会回来。”“几个月，”老妇人呢喃了几句，“才刚吃饱饭，就又出远门。”\n\n“喂，小子，家里还有老妈子呢吧，要不要回去啊，”其他几个佩戴三色花的青年推了推他，“保罗车技很好的，现在送你回去我们也不迟到。”男孩笑了笑，带着些腼腆和青涩，“不了，妈妈她，需要人保护，我一个男孩子如果不能拿枪保护她，那才是孬种呢。”“哈哈哈，好小子，希望你上了战场还有这种底气啊，”其他几个青年起哄道，“哦对了，你妈妈知道你是革命派吗。”"
  PA1_revolution_list.9.a: "“我不知道，但我们知道她一定爱我”"
  PA1_revolution_list.10.t: "哨兵"
  PA1_revolution_list.10.d: "“你看那群东西越来越多了”雷泽弗望着山底下的黑压压的人影，不安的开口。“慌什么，”前原一见咬了一口压缩饼干，然后艰难的撕下了一小块放进嘴里咀嚼，“新来的，那些东西啊，也是要听人话的，就像上头不让我们开枪，我们就不能开，不然啊，就是要上军事法庭的。”前原一见玩味的看着这个新来的小伙子。雷泽弗拿起一块压缩饼干，撕开简易的包装，然后咬下一口，“啊，这什么东西，“雷泽弗惨叫一声，捂着嘴蹲在地上。“你个蠢小子，”前原大笑着拿出一个水壶，“这玩意是要弄湿了吃的。”雷泽弗痛的直流眼泪，“就吃这玩意？”“本来有汤料配给的，但我前几天喝完了，所以下个月之前你就只能将就下了，”前原说着说着，语速越来越慢，“你小子就知足吧，现在最起码吃的管够，还有汤喝，贵族滚蛋前那才叫一个苦啊，那时候你小子有饭吃就不错了，我们这帮大头兵也是饥一顿饱一顿的。”“人嘛，总是要向前看的不是吗，”雷泽弗反驳道，“革命吃不饱饭命不就白革了嘛。”前原拍了怕雷泽弗背：“你小子可以啊，刚来嘴里就革命什么的一套一套的，罢了，说不过你了，最后这个我藏的汤包就给你吃了吧，记住啊，半锅水，开水泡十分钟，”前原笑了笑，丢出一个纸盒子包裹的东西。"
  PA1_revolution_list.10.a: "“这汤做不好的话我的汤料包不就白给了嘛”"
  PA1_revolution_list.11.t: "毛瑟枪"
  PA1_revolution_list.11.d: "“那么，告诉我们，你们为什么要参军。”一个军官模样的人站在一个箱子上对着一群年轻人发问，“你们来到这里，离开家乡，离开亲人，是为了什么。”一个年轻人向前一步，中气十足：“报告同志，我参军是为了支持革命。”“哦，支持革命，”军官眯起一只眼，看着这个年轻人，“那么你支持革命又是因为什么呢。”“因为...因为...”年轻人有些迟疑，支支吾吾。“不要怕，说出来，告诉我们，你因为什么来到这里，”军官点了一支烟，“士兵首先要知道自己为什么而战。”\n\n年轻人定了定神，豁出去一般大喊：“因为，因为我要保护我喜欢的女孩子不再被包税官老爷那种人欺负！”四周哄笑起来，军官让他们安静些，然后开口道：“很好，那么拿好这只毛瑟枪。”军官走下箱子，从武器库房里拿出一支毛瑟枪，“拿着她，莱茵兰那边产的。”军官拍了拍年轻人的肩膀，“记住，这把枪就是你的心上人，就是你保护你心上人的工具，”军官顿了顿，甩掉了烟头"
  PA1_revolution_list.11.a: "“不要害怕她，她是你的另一半”"
  PA1_revolution_list.12.t: "在寂静的河流"
  PA1_revolution_list.12.d: "[PAQ.GetName]的原野，死寂，死寂，还是死寂。村庄噤声，纠察队，混沌造物，帝国军在旷野上行进。“队长，快来这里，”一个带着防毒面具的士兵指着一副壁画喊道，“那群老鼠来过这里。”一个穿着普鲁士旧制服的男人牵引着一头混沌兽来到一堵被炸弹炸成残骸的墙壁前，墙上用红色颜料涂着一个巨大的镰刀锤子。“该死的，不就是一群老鼠吗，一个月了，他们在把我们当猴耍，”男人抄起一个喷火器，把那个刺眼的图案烧至焦黑，连带着墙体一起化为漆黑的一片，再也分辨不出来任何的轮廓，才缓缓放下喷火器，然后面部抽搐一下，“那还是老规矩，附近的村庄去找几个革命党，然后割下他们脑袋拿回去来保住我们脑袋。”\n\n半个小时后，村民们在村口站成一排，男人面无表情的拉出一个二十出头的小伙子：“告诉我，那些革命党去哪了。”小伙子脸色苍白，双腿打着战跪在地上，拼命摇头否认着自己见过游击队。男人面部一拧，松开手一脚把小伙子踢倒在地，随后一枪打爆了他的脑袋。几个妇女惊叫起来，随后男人抬头又是一人一枪，几个女人立刻失声倒在地上，血液浸透了乡道，剩余的活人无一人敢再开口。\n\n“那么，你们中有人知道革命党去哪了吗，啊？”男人继续面无表情的重复着这句话，“不说，很好。”一队士兵抬起步枪，瞄准了人群，男人抬手看着眼前的这些将死的东西，刚准备下令开火，这时，一颗子弹贯穿了他的脑袋，男人不可思议的嘟囔着，倒在了小伙子的尸体上。“是游击队，是游击队，”剩下的士兵惊恐的喊叫到，“他们来了，杀了他们！”随后，步枪和迫击炮的响声响彻了河流和村庄，士兵和混沌兽在流弹下化作了残骸。十分钟后，一切化为寂静，十几个面容消瘦的人从树林中缓缓走出，领头的队长只是向村民了解了一些帝国军的情况，交换了些物资，随后又回到了树林中消失了，不过村里似乎有几个小伙子也跟着他们一起离开了。"
  PA1_revolution_list.12.a: "毕竟，哪里有压迫，哪里就有反抗"
  PA1_revolution_list.13.t: "少女"
  PA1_revolution_list.13.d: "开往萨拉特的火车随着目的地的接近，逐渐笼罩在环山里，山雾如同轻纱蒙在车窗上，清晨的温差则是彻底模糊了玻璃，只留下一篇朦胧。一个三十出头的男人打开一个帆布包，里面装着一条红色的手织围巾，就那么静静地躺在男人的怀里。“这是你老婆给你弄的？”邻座的一个青年把头靠向右侧，带着打听八卦的心态问道。“不是，是我女儿织的，”男人抚摸着手里的的围巾，“我加入国民自卫军那天我的女儿就开始偷偷晚上躲在房里织这条围巾。”\n\n“有福气啊老哥，”青年人拍了拍男人肩膀，“女儿这么贴心哈，真羡慕你们这群家业美满的啊。”男人低下头，欣慰的笑了笑，“想想我真对不起我的妻子啊，害她吃了那么多年苦。十年前我还是个王国军的新兵蛋子，她则是城里富商的女儿，我当年是个花言巧语的骗子，”男人顿了顿，“我就像那群浪荡公子哥，混混，用毒药一样的语言把她骗的神魂颠倒，然后，然后她就不顾家里反对和我结了婚。”男人苦笑一下，“然后她家里就和她断了往来，我呢还天天被拖欠军饷，有几年我们真是得喝西北风了，吃了上顿没下顿，可怜我的妻子啊，还有我的女儿，娘两个能把一块红薯当两块用，手泡在冷水里，一到冬天娘两个手就发红发痛，我一个大老爷们什么都干不了。”青年沉默了，无言以对，半晌后男人才又笑了笑，缓缓开口：“也得亏现在那群贵族滚蛋了，地方政府也终于把欠我的军饷发了，那群天杀的老财王爷，我们吃糠咽菜，他们倒好，库房里堆的盆满钵满，他们这一完蛋，我们可算得救了，”男人戴上那条围巾，“所以啊，我不能再让她们挨饿了，我一个大头兵能干什么呢，也就是在前线流血，让她们娘两个在家里能睡个好觉了。”"
  PA1_revolution_list.13.a: "“不然政府养我们这群老油条干什么呢。”"
  PA1_revolution_list.14.t: "罐头面包"
  PA1_revolution_list.14.d: "“喂，保罗，你那边还有什么可以取暖的东西吗。萨拉特的一个要塞里，一个青年人搓着手，嘴里哈出白气，“这鬼地方怎么这么冷。”“白痴，这里在山顶上，现在还是后半夜，你就裹着一条夏天的军毯没给你小子冻死都算你命大。”保罗白了他一眼，“萨沙奇啊萨沙奇，你说说看你也不是什么菜鸟新人了，怎么还能干出来拿着军大衣和毛毯去换酒喝的事情。”萨沙奇嗤笑了一声，“你还有脸教训我了，酒你没喝？烟你没抽？”“你...算了，”保罗把一件军大衣丢给萨沙奇，“穿着这个吧，再多就没了，别明天早上我边上躺了一具冻人干。”萨沙奇颤抖着拿起军大衣，盖在身上，脸色逐渐好转。“嘿，你小子又欠我一条命，”保罗笑了笑，“回去记得请我吃烤猪蹄。”“能活着回去的话，我请你去你最爱去的那家酒馆吃烤猪蹄，”萨莎奇回呛道，“你个老东西之前眼珠子盯着老板娘快瞪出来了，回去让她给你亲自端上来吃，祖国英雄，让她伺候你怎么了。”“你个臭小子，我是那种不要脸的人吗。”保罗忍不住笑了，“当然，前提是...”"
  PA1_revolution_list.14.a: "“回的去的话...”"
  PA1_revolution_list.16.t: "无边的谷堆"
  PA1_revolution_list.16.d: "“肃静，肃静，”法官敲了敲法槌，示意大厅里的人们安静下来。大厅的四角装饰着三色花和农民帽，审判席的正后方挂着一面共和国国旗。人们逐渐安静下来，两名国民自卫队成员押着一个胖子上了被告席。法官的目光扫视一圈陪审团，最后定格在胖子身上。“你叫，菲利普·弗朗茨是吧，”法官翻看着卷宗，“请问你是否知道自己因为什么罪名被起诉。”“那群家伙诬告我谋杀，法官先生，我不允许我一个公民遭受如此的侮辱。”法官面无表情的看着菲利普，随后翻过卷宗：“你被指控投机倒把，囤货居奇，并暴力催收致人死亡，因此被以反革命和谋杀罪起诉。”“你这是血口喷人，”胖子一拍桌子，“我是在要回我的个人合法财产，你应该去起诉那些无赖拖欠我的粮食，而不是在这里给我泼脏水。”法官瞥了他一眼，冷笑一声，“传证人。”几分钟后，一个老妇人抱着一张黑白画像哭哭啼啼的从大厅前门进入。刚看见菲利普，就两眼猩红地大喊着冲上去：“你还我儿子，你还我儿子，你个畜生，我要送你上断头台。”两名国民自卫队成员拉住了老妇人，这才避免了一场冲突。“那么，请证人陈词，你要发誓，自己不会作伪证，否则要承担相应责任，明白吗。”老妇人揉揉眼睛，举起一只拳头，“先生，我发誓我的证词句句属实。”法官点了点头，随即开口道：“那么请开始你的陈词。”老妇人刚一开口，眼泪就忍不住往下流：“几年前，我们这边遭了粮灾，这个畜生放高利贷给我们这些村民，规定一磅麦子开春后要还两磅，我看着手里的儿子，他快饿的没气了，就问他借了60磅麦子，结果开春收成去掉税后只有一百多磅，全家饿死也还不上了，然后这个畜生就派人摔死了我儿子，他才三岁啊。”老妇人再也止不住泪水，抱着画像嚎啕大哭。菲利普则是脸色苍白地看着恨不得手撕了他的陪审团和一脸怒相的法官。“菲利普，你还有什么想说的吗。”法官阴沉的看着他。“我，我，我只是想要回我的合法财产...”“闭嘴吧畜生，”陪审团里不知谁大喊一声，“去死吧，革命之敌，公民的敌人！”其余人也开始嘶吼：“给这个畜生上断头台！上断头台！”“那么，我觉得结果已经很明显了，”法官敲了敲法槌，“被告菲利普·弗朗茨，犯反革命罪，谋杀罪，判处死刑，没收所以财产。”两名国民自卫队成员立刻把菲利普押下去，准备送往市中心断头台处死。”\n\n此时，菲利普的府邸门前，大批的农民和工匠看着国民自卫队拉着一车一车的麦子和其他食物出了那道曾经高耸的铁门，发出了阵阵欢呼。那是怎么样的一个谷堆啊，金黄，喷香，高耸，比曾经的老爷家门还要宏伟啊。风吹国谷堆，也吹过麦田，泛起麦浪。香气四溢，笑声不断，从此以后，这片麦田不再属于一切特权。"
  PA1_revolution_list.16.a: "这片麦田将属于她真正的主人"
  PA1_revolution_list.17.t: "院制问题"
  PA1_revolution_list.17.d: "幻想乡等传统的民主国家通常都采用两院制，而苏联则采取一院制。立宪派和部分温和派认为我们应该同样设立两院制，因为可以达成有效的权力制衡而避免官僚专权。激进派则怒斥这种想法是向资本主义过渡，并且认为两院制会导致效率低下，满口空谈，应该采取和苏联一样的一院制来高效使用权力，监督问题则另外考虑。现在，我们应该做出决定，采取哪一派的意见。"
  PA1_revolution_list.17.a: "我们仅设立国民公会"
  PA1_revolution_list.17.b: "我们将额外设立众议院"
  PA1_revolution_list.18.t: "大选问题"
  PA1_revolution_list.18.d: "在帝国的威胁暂时消退之后，我们就要开始考虑选举问题了。立宪派要求我们立刻开展选举，而另一部分则担忧现在国内局势暗流涌动，贸然选举也许会导致革命陷入危险之中。无论如何，我们必须给出一个选择结果。"
  PA1_revolution_list.18.a: "选举只有在革命安全后才能进行"
  PA1_revolution_list.18.b: "立刻开始选举"
  PA1_revolution_list.19.t: "委员会问题"
  PA1_revolution_list.19.d: "救国委员会是一个在帝国威胁日益加重时期形成的组织。其拥有国民公会赋予的超然权力，可以在必要时期采取措施。然而，随着帝国败退，有人质疑救国委员会存在的必要性。在这个问题上，立宪派和激进派达成了惊人的一致，即保留救国委员会作为一个保险手段，防止那些在阴影里的阴谋分子再次利用漏洞攫取权力和革命果实。"
  PA1_revolution_list.19.a: "那么，保留委员会及其权力"
  PA1_revolution_list.20.t: "情报部门问题"
  PA1_revolution_list.20.d: "为了保卫革命和抵御来自外界的威胁，我们需要一个情报部门来破获国内外反革命分子的阴谋和行动。然而，我们需要明确的是，我们应该赋予多少权力个这个可能的利维坦。我们是应该仅仅赋予其部分权力仅仅够用于常规的行动，亦或者赋予其更大的权力，用于更好的捍卫革命，但代价是也许会对民众的权益造成破坏。"
  PA1_revolution_list.20.a: "没有恐怖的美德是软弱的"
  PA1_revolution_list.20.b: "也许这应该适可而止"
  PA1_revolution_list.21.t: "军队问题"
  PA1_revolution_list.21.d: "战争结束后，军队的控制权也应该重新考虑了。我们应该将军队的权力继续置于救国委员会的手中，直到革命彻底安全，还是将军队的控制权交还给国民公会。一部分人担忧我们倘若继续把持这军队的控制权会形成实际上的军事独裁，而另一部分则认为倘若放弃军权革命可能会遭到威胁。"
  PA1_revolution_list.21.a: "我们不应该放弃军队"
  PA1_revolution_list.21.b: "我们应该交还军队控制权"
  PA1_revolution_list.22.t: "革命之后呢？"
  PA1_revolution_list.22.d: "“萨沙奇，该回家了。”一个萨拉特的一处要塞内，一个穿着军官制服的人敲响了其中一间房间的大门。“哦，知道了，”萨沙奇披着一条有些污渍和缝补的毯子，嘴里叼着根烟，漫不经心的回答到。“别忘了，今天下午四点的车，错过了你就要在这里待到下个月了。”军官嘱咐完后关山了房门，留下了萨沙奇一个人留在房内抽烟。他缓缓起身，推开房门，走到一处要塞前的开阔空地上，那里有个新的小土堆，上面立着一块石头。“保罗啊，最后再来看看你一次，”萨莎奇点了一支烟，放在了土堆前，“今天下午我就要回去了，对不起，没办法请你吃烤猪蹄了，就抽根烟意思下吧。”萨沙奇坐在土堆边，由掏出一根烟，点上，“兄弟我陪一根，”萨莎奇嘴里叼着烟，傻傻的笑了，“保罗啊，我们这算是为了革命流血了吧，但是啊，”萨莎奇抬头望了望天，乌云在天际上快速的移动，“革命可不是个便宜的东西啊。”\n\n与此同时，帝国被击退的消息已经传到了首都。藤原千花把一张帝国投降的报纸就那么放在桌上，没有狂喜也没有凝重，只是就那么静静地看着窗外一片欢腾的挥舞着共和国旗帜和喊着共和万岁的人群。“喂，你也会露出这种表情吗，”四宫辉夜拍了拍藤原千花肩膀，“怎么了，担心在议会里输掉吗。”藤原千花又换上了以往那副无忧般的笑容，说出来的话却让四宫辉夜倒吸了一口冷气：“哪有啊，议会里输掉倒是不要紧啊，可是万一不是在议会里输掉怎么办呢”“你...你的意思是，”四宫辉夜脸色顿时阴沉。“在其他地方输掉咯，比如军队啊，报纸啊，还有在大家心目中输掉咯，输给你倒是还好，输给其他人那就麻烦啦。”藤原千花脸上还是挂着笑，但是房间里的气氛却早已降至冰点。"
  PA1_revolution_list.22.a: "革命之后...自然还是革命"
  PA1_revolution_list.23.t: "宿敌已死，那么同盟自然不再神圣"
  PA1_revolution_list.23.d: "相马一也和莉希雅的府邸原理市中心，位于首都的郊外，以避免过度的噪音和打扰。相马一也许久没有这么高兴过了，帝国如愿以偿的被打回去了，国家保住了，他对的起所有人，他以前是个合格的国王，现在是个合格的共和国议长，以后也将一如既往，不是吗。然而莉希雅显然没有一起喝酒的兴致，当被问及缘由时，莉希雅思索许久，随后开口道：“你觉得，她们的革命会到此为止吗。”“为什么不会，”相马一也笑了笑，“我好歹也是国民公会议长，总不至于弄死我吧。更何况，我们刚刚把帝国打回去了不是吗，祖国安全了。等等，安全了...”相马一也似乎想到了什么，“对啊，国家安全了，国家安全了。”相马一也突然意识到，自己似乎处在风口浪尖，而那个可以保护他免受风浪侵袭的理由，即国防危机，已经随着帝国的远去而灰飞烟灭。无论如何，团结在不久的未来就会成为一个笑话，毕竟..."
  PA1_revolution_list.23.a: "你可以待人友善，但你不能同疯狗同眠..."
  PA1_revolution_list.24.t: "共和旗下..."
  PA1_revolution_list.24.d: "“给我出来，你们这群骗子！”“滚出来，老子拿着枪给帝国那群狗娘养的怪物打回去的时候你们这帮东西在哪里，我钱呢。”芬迪尔中心城区的街道上，几百个老兵堵的马路水泄不通。萨沙奇披着一件大衣，拉过一个穿着破旧军大衣的老兵，“喂，大伯，出什么事了。”老兵瞥了萨莎奇一眼，没好气的说道：“小兔崽子，去去去，大爷我讨钱呢。”“讨钱，”萨沙奇疑惑道，“讨什么钱？”大爷举起被炸掉的半截手臂，上面还带着炸弹遗留下的焦黑色，“诺，老子去和帝国那帮狗腿子拼命的时候，被那帮混账东西炸掉了一条手臂，按理说政府应该要给我一笔钱的吧，叫什么抚恤金，结果呢，”大爷冷笑了一下，“什么也没有，特派员和个大爷一样坐在那边的楼里喝茶，搞得和帝国是她们打回去的一样。”萨沙奇有些惊诧，毕竟在他印象里的长官大体上都呈现一种对他比较照顾和友善的态度，加上萨莎奇本人没有负伤，因此他直到现在才知道由一大批和保罗一样的人被如此对待。“你看，那边的是那个小姑娘的丈夫死了，二十几岁守了寡，现在连点安置费都拿不到，”老兵指着一个二十几岁扎着马尾辫的女孩，她的手里抱着一幅黑白遗像，上面是一个同样年轻的男子，女孩没有大声叫喊，或者像某些老兵一样尝试去踹特派员的大门，而是就那么静静的站在那，抱着画像，似乎这样就可以让她的丈夫陪在她身边一般。\n\n突然，前面的人群开始骚动起来了，老兵有些激动，以为是特派员出现了，伸着脑袋想要看清发生了什么。然而映入眼帘的却是一批批身着军服的人将前排的老兵按倒，而后排的群众和老兵大喊着“叛徒”“骗子”和军服大汉扭打在一起。“砰！”，随着一声枪响，第一个老兵脑袋朝下重重栽倒在地，随后人群发出惊呼，疯了似的往回跑，而身着军服的大汉则手持盾牌和步枪将一个个落单的人按倒在地，或是向着逃跑的人群开火。萨莎奇躲进了一间咖啡屋里，看着外面的地狱景象，想起了保罗，不知道他的家属在不在其中呢，萨莎奇这么想着。“保罗啊，你为此付出了性命的东西，真的值得吗...”"
  PA1_revolution_list.24.a: "...竟是旧时景"
  PA1_revolution_list.25.t: "鲜艳的红色"
  PA1_revolution_list.25.d: "藤原千花站在窗前，窗外是熙熙攘攘的人群，阳光洒在她常穿的黑色制服上。楼前的广场上，立着一尊巍峨的断头台雕像，庄严肃穆。她知道无辜者的鲜血洒在了芬迪尔的街道上，也知道那些刽子手肮脏的血同样也洒在那里，还有更多的人的血液也会顺着断头台流向那摊污血。污血的主人现在也许穿着共和名头制成的西装，衣装笔挺的坐在国民公会里侃侃而谈。但这无关紧要，藤原千花明白，他们不会永远的坐在那里，旧制度的鹰犬将会在未来的某一天腾空而起，扑向普罗米修斯，这时候革命的剃刀也会像这次一样将他们碾为齑粉。\n\n一双熟悉的手搭在了藤原千花的肩上，“还在看呢，这次是你赢了，我的报纸没派上什么用处呢。”藤原千花转过身来，对着四宫辉夜笑了笑。"
  PA1_revolution_list.25.a: "“是“我们”赢了哦。”"
  PA1_revolution_list.26.t: "一抹暗红色"
  PA1_revolution_list.26.d: "在鲜血染红了芬迪尔的土地之后，当地一直弥漫着肃杀的氛围。尽管相关“涉事分子”已经在中心广场就地正法，断头台砍下了那些下令开火的军官和监督员的脑袋，本就充满血腥气味的土地又在正义的名号下增添了更多的污血。富歇特派员依旧在路尽头的那座小屋里，喝着酒看着街上零星几个匆匆离去的行人和车辆。秩序井然，富歇对此很满意，这才理想中的共和国该有的样子。然而街角转个弯，依旧能见到孩童扮演者大革命的模仿戏。"
  PA1_revolution_list.26.a: "无言..."
  PA1_revolution_list.27.t: "豆蔻年华"
  PA1_revolution_list.27.d: "少女穿梭于街道，手持报纸叫卖。“芬迪尔发生血案，共和国英雄遭屠戮，凶手竟是前国王卫队！”“富歇特派员骄奢淫逸”，流言蜚语传遍了共和国的每一个角落。大楼与霓虹灯下走旌旗，芬迪尔的场景在各地上演。特派员们或惊喜，或恐惧，或震怒。血海在上涨，夜空被火焰点亮，狂欢，革命，民粹已经彻底将这个新生国家吞没。随着局势的失控，和平示威也逐渐成为了不同派系的街道暴力政治，民粹主义者焚烧了特派员的府邸，保皇党的准军事组织和革命青年队互相倾泻子弹，烈焰高旋，血液四溅。\n\n议会内部亦是指责谩骂，保守派指责革命派放任民粹横行，革命派则以血腥刽子手的罪名回敬。理性彻底被聒噪淹没，民粹举起了革命的旗帜，在烈火和废墟里，民兵笑的狰狞如地狱三头犬。反动派如伊甸园毒蛇，蛊惑着每一个熟睡的市民，促使她们去亵渎，去撕咬，共和与美德正在死去，而恶毒的诅咒正在露出獠牙。"
  PA1_revolution_list.27.a: "莫比乌斯环？"
  PA1_revolution_list.28.t: "断头台"
  PA1_revolution_list.28.d: "“杀了她，杀了他”“杀了这个王政分子”芬迪尔的主干道路口处，无数的民众围着一个断头台，它本该在一个偏远些的位置，因为前些日子无数的老兵血洒此地所以特地搬过来处刑凶手。一个面无表情的卫队队长被压上行刑台，人群立即对其愤怒的嘶吼起来。队长一眼不发，只是眼神看向了台下一个穿着军大衣的男人。萨莎奇和卫队队长对上视线，他从对方眼中看见的不是恐惧，也不是愤怒，而是麻木，一种不理解为何遭此刑法的麻木。这种眼神，萨莎奇在保罗眼里也见过，那是在保罗被一颗子弹击中胸口后死前的眼神，没有对死亡的恐惧，只是麻木，以及习以为常。苦难不是他们的稀客，而是生活的一部分。保罗死前也只是把剩下的几支烟递给了萨莎奇，就像他早就知道会有这么一天一样。萨莎奇似乎理解了为何保罗可以面不改色的冲向敌方要塞，为何卫队队长可以毫无负担的下令射杀人群。男孩眼中的兴奋与老者眼中的狂热并非同类，萨莎奇如此想到。他忍不住瞥向另一侧的老者，他也像年轻人一样喊着口号，挥舞着共和国的国旗，然而眼神中的东西却也和保罗别无二致。萨莎奇感到遍体生寒，裹紧了大衣，没再看落下的人头。"
  PA1_revolution_list.28.a: "新的，旧的"
  PA1_revolution_list.29.t: "《关于抄没反革命组织财产的通告》"
  PA1_revolution_list.29.d: "各位共和国的公民们：\n共和国成立前的多少个年月里，那些无所事事的寄生虫趴在我们广大公民的身上吸血。看看吧，我们辛勤的劳作，他们却巧立名目以苛捐杂税将公民的血汗从我们的手中榨取，他们用愚昧和故事，名正言顺的骗取我们的财富。在我们饿死的时候，他们在干什么？他们在趴在累累尸骨上喝着红酒，吃着肉排，用恶毒的鹰犬为他们看家护院。\n\n但是，共和国已经建立，我们要告诉他们，千年的铁树也是能开花的，因此，国民公会在此发布一则行政令，即日起对于尚未被公有化的贵族封地，以及教会资产，赌场资金等非法反革命所得进行查抄，并尽数公有化。对于敢于抵抗的，地方革命政府及特派员要严厉打击，绝不能让这些恶徒带着他们亵渎革命和美德的血钱继续逍遥自在。\n\n署名：\n\n国民公会及救国委员会\n\n藤原千花"
  PA1_revolution_list.29.a: "三十年河东，三十年河西"
  PA1_revolution_list.30.t: "堕入幸福"
  PA1_revolution_list.30.d: "白色的日光照他的脸上，显得格外惨白。“那么，现在这样子，我觉得我们还是离婚吧。”女人面露难色的开口，却又带着一丝不易察觉的决绝和如释重负。他没有反驳，只是看着手上那张遗产转让单，或者曾是遗产转让单的东西，他想不明白为什么自己的一辈子似乎都像一个在列车上坐过站的乘客，被其他人所抛弃。他的思绪像是被什么击中，在他还是孩童时，就因为自己左手的残疾而遭到他人嗤笑和冷落，“怪物”“废物”，这些恶毒的词汇在他的童年里代替了其他孩童和朋友，陪伴在他的身侧。事情在他20岁迎来了转机，进入教会，成为了一名神职人员，使得他终于第一次在面对他人时找到了勇气。似乎那些谩骂和白眼已经成为了一个孩提时代的恐怖故事，被他永远的抛在了身后。然而，一纸文件再一次让他支离破碎，一夜之间他失去了自己的地位，失去了收入，甚至于自己最后那点底气，一笔存在社区教会的不菲遗产也化为飞灰。那些恶毒的词汇，那些糟糕的旧日时光再一次吞没了这个不知所措的中年人。破碎的家庭，无望的前途，他和无数的游汐港人一样，就那么呆愣愣地站在被警戒线封锁的库房外，看着卡车运走了成吨成吨的金银细软。\n\n游汐港再一次被人声和火光吞没，人们颂唱着圣歌，挥舞着旧时代那个已经被埋没的旗帜，就如同大革命时他们挥舞着共和旗一般。禁忌的名字被呼喊，特派员府邸外，民众呼喊着圣人的名讳，歌颂着贤明王们的姓氏。旧时的时光美好与否早已不重要，事实早已被符号吞没，人们在茫然中上下求索，只为给自己一个许诺。"
  PA1_revolution_list.30.a: "一个一切会好起来的许诺"
  PA1_revolution_list.31.t: "暗流涌动"
  PA1_revolution_list.31.d: "“我觉得，各位应该先冷静一下”藤原千花看着眼前这群争的脸红脖子粗的议员，连忙出声阻止。很可惜，并没有什么人听的进她的劝阻。被相马一也激将法气的失去理智的四宫辉夜已经抄起了桌子上的墨水盒，准备朝着相马一也脸上砸去，“你在嚣张些什么啊，当了几个月议长就觉得自己是什么政坛老手了啊？什么叫我太天真你给我讲清楚。”相马一也喝了口茶，笑了笑，“我说辉夜小姐啊，你有没有想过，你们做事是不是操之太急了呢，这才击退帝国多久，就要在国内搞这种大动作...”“那你又算什么东西，”四宫辉夜回呛道，“天天拿现实主义说事，按照你那套东西我们搞什么共和国，革命那会直接喊尊王攘贵族得了。你别以为我忘了富歇和你的前卫队干的大好事。”“啪！”藤原千花猛砸桌子，“你们给我闭嘴，吵吵吵，现在你们互相把对面骂成叛国贼有什么用？那些暴动的游汐港人会自己消停下来吗？”四周安静了下来，四宫辉夜也终于把举起来的椅子放了回去。\n\n“那么，各位没意见的话我来说两句。”藤原千花清了清嗓子，“首先，我来定个调子，这件事情要不要平定下去，是肯定要的，这点各位都没有意见。那么问题就变成了怎么平定。”“我觉得还是不要和他们做出太多妥协的好，”四宫辉夜站起来说道，“毕竟我们和保皇党是不共戴天的。”“诚然，我们不应该过多的让步，但是也不代表我们一定要把事情做的不好看。报告显示，有些人只是为了钱，那么我们不如把钱还给他们，反正我们也不差这点。当然，对于那些真保皇党，”藤原千花顿了顿，随后开口道..."
  PA1_revolution_list.31.a: "“还是得重拳出击”"
  PA1_revolution_list.32.t: "来杯水吧"
  PA1_revolution_list.32.d: "天色刚亮，游汐港的一切暴露在阳光下，虽然街上仍然是混乱一片，但总体而言相较于以往，已经平静了不少。今天天气不是很好，并没有多少，气温也较低，因此他裹了裹大衣，以防止着凉。前面的路段上排着几百个人，人群的今天是一栋灰白色的建筑物，在王国时期这里据说是一个贵族的网球场，现在这里被改造成了一个政府的办事处。人们从前门进去，然后从侧门领着钱离开。他攥着手里的那张盖着教会印章的转让书，心里带着一点若有若无的希望随着队伍向前蠕动。像他这种闹过事的还会还给他钱吗？钱能全部到账吗？他不知道，但他似乎也没什么更好的选择，毕竟现在他也没什么可失去的了，试一试总比什么也不做强。“你好先生，能给我看一下你的相关证明文件吗？”一个少女的声音在他前面响起，这时他才反应过来自己已经轮到他了，他有些局促不安，手里的文件几次想要交出都没有成功。“额，先生？”少女疑惑的开口，“请问你有证明文件吗，就是财产转让书之类的东西？”“哦，有的。”他这时才拿出了那张转让书，随后又给了对方自己的身份文件。少女核对了两份文件上的信息以及本人的相貌后，在一张表格上画了个勾，随后把一张支票和两张文件递给了他，“好了先生，”少女开口道，看着眼前这位嘴唇开裂的男子，笑了笑..."
  PA1_revolution_list.32.a: "“请问你需要一杯水吗。”"
  PA1_revolution_list.33.t: "一块红布"
  PA1_revolution_list.33.d: "“奥斯塔，我们有麻烦了。”男人一脚踢开房门，对着里面的另一个男人喊道，“别捣鼓你那没用的无线电了，快走吧，再晚点就来不及了。”“这是怎么了，”奥斯塔疑惑地看着眼前惊慌失措的同伴，露出了不解的神情。“城西的小组被捕了。”“什么？”奥斯塔手里的电台“啪”的一声掉在地上，“你说什么，你确定吗？”“千真万确，”男人喊道，“今天早上的消息，另外，我们在首都的人从相马一也的部下那边得知了，我们已经被盯上了，现在已经专门派人过来了。”\n\n“不许动，把手抱在身后！”一声怒喝从男人背后响起，随后几十个荷枪实弹的士兵从楼梯，窗户等地方突袭进入楼道内。玻璃破碎，留下一地的碎屑，楼道里脚步声如雷鸣般隆隆作响。楼下的街道早已被几辆伪装成民用车辆的皮卡以一种看似是意外的方式堵住，远处的路口处，交通管制已经被实施。奥斯塔和男人脸色惨白，几乎是本能的抱头蹲在地上，其中一名士兵核对了他们身份，确认了其保皇派地下组织成员的身份后，将他们押上了一辆卡车。"
  PA1_revolution_list.33.a: "“城东，清除”"
  PA1_revolution_list.34.t: "曙光之年"
  PA1_revolution_list.34.d: "随着最后一面王国旗帜被从最后一个据点上缓缓降下，暖黄色的日光再一次笼罩在了共和国的旗帜上。恐怖被一而再再而三的反复确认，以避免沦为失去美德的罪恶。美德最后对名单做出裁决，那些名单上的人民公敌的污血顺着断头台架子流淌而下，就像他们在旧秩序下无数次使得公民们遭受的那样。暖黄色的阳光照在游汐港的建筑上，暴乱和反动已经远离了这片土地，取而代之的，是一个曙光的未来。在过去的几个世纪里，在王政的统治下，我们无法想象一个没有那些亵渎美德的景观存在的社会，无法想象一个不同于过去一切范式的新社会，但现在，我们可以说，我们将再次敢于想象。"
  PA1_revolution_list.34.a: "自由啊，我们美丽的自由..."
  PA1_revolution_list.35.t: "酿月"
  PA1_revolution_list.35.d: "灯一盏盏的熄灭下去，今夜的教堂钟声没有再响起。人类或许是一种被仇恨驱动的生物，将一个团体凝结起来最好的手段自然是针对另一个群体刻骨铭心的恨，对于某个族裔的怨恨，又或者是对于某个阶层的恨意。一个瞎了一只眼的老人，和上千名不辞而别的士兵，如同闻见血腥味的狼群，向着混乱的中心靠近。已经太久了，被贵族羞辱的经历，死在催债人和包税官手下的父母和兄弟，已经太久了，随着那一面面翻飞的旧秩序的旗帜，还有那些让他作呕的歌声，那些回忆一次又一次的击中了这位年迈的老人。为什么要和这些畜生讲道理，图罗斯不明白，为什么要和这些为虎作伥的恶鬼讲道理，他们的血管里流着肮脏的血液，他们吃的每一口食物都是自己和自己那些小伙子们的苦难和血肉。那么，既然革命政府要向恶鬼妥协，那么他图罗斯和他的“地狱纵队”，就要来执行迟到已久的暴力。\n\n枪声，哭喊声，惨叫声，歌颂停止了，旗帜落在地上，被污血染红，图罗斯拿起那面被血浸染的旗帜，随后丢入火中付之一炬，刺刀刺穿了还在咒骂和求饶的濒死者的胸膛。敌人，敌人，敌人，满大街都是敌人。士兵们歇斯底里，把一个个躲进建筑内的暴乱者连带户主一同揪出了他们的一亩三分地，随后是近乎报复的虐杀。待到军队赶到制止，游汐港已经徒留断垣残壁。"
  PA1_revolution_list.35.a: "自由，多少罪恶假汝之名"
  PA1_revolution_list.36.t: "热月九日"
  PA1_revolution_list.36.d: "“所以，真的要这样吗？”相马一也面露担忧地看着一旁手里拿着报告的莉希雅，“我们真的要冒着葬送国家的风险去做这件事吗。”“不然呢，他们都蹬鼻子上脸了，”莉希雅把四宫辉夜的报告拍在桌上，面露痛苦的喊道，“我们还不够容忍这些理想主义者为所欲为吗。她们要共和，好，我们答应了。她们要国有化，好，我们答应了。结果呢，我们得到了什么，她们今天要我们的地产，明天要工人更好的待遇，到现在彻底把我们踢到一边去了。”莉希雅指着那封指责相马一也勾结保皇组织要求撤换议长的报告，一脸担忧地看着眼前的丈夫。“你听着，这件事情无论你答不答应，反正我一定要去做。保守派就不用说了，立宪派和一部分温和新山岳党也早就看这几个丫头不爽了，明天我就帮你讨个公道。”相马一也想说什么，但是话到嘴边又咽了回去。最后眼神也坚决了下来。\n\n“放手去做吧。”\n\n“四宫辉夜，你不要太过分。”四宫辉夜眉头皱了皱，显然对于公然打断她报告的行为感到不满。但还没等她开口，另一个声音就响了起来：“就是，你现在连议长都要打成人民之敌，明天是不是要把其他人都送上断头台啊。”“哈？我有说要杀了议长吗，我只是说把他解职...”“别狡辩了，解职之后你个疯丫头就能肆无忌惮痛下杀手了。”“疯丫头滚蛋”四宫辉夜气的脸色发青，一旁的藤原千花却是眼神一直撇着后门口来回走过的警卫，笑容逐渐冷淡。她悄悄叫来一个民兵，民兵听完看了一眼后门，脸色发白，随后带着一张纸从侧门离开。台上的争吵还在继续，越来越多的两方议员加入了这次骂战，双方开始不满足于口头争吵，取而代之的是纸团和桌椅飞了起来。就在四宫辉夜准备搬起讲台下的一块翘起的地板时，几十个国民自卫队冲入会场，枪口指着手里还举着桌椅的四宫辉夜和激进派议员。“四宫辉夜小姐，在会场上对着议长动武可是对于国民公会以及共和国的亵渎啊。”为首的队长冷冷地看着四宫辉夜。四宫辉夜立刻脸色煞白，呆愣在原地，而莉希雅脸色露出了得意的神色。就在这时，一队头戴着三色花的民兵和国民自卫军也从侧门进入了会场，挡在了藤原千花和四宫辉夜面前。“你也不差啊，”藤原千花这时才幽幽开口，“在会场上拿枪指着我这个国家元首，是不是和帝国或者魔联反动派串通好了啊？”两方人马互相剑拔弩张。许久之后，相马一也才提议今日休会，各自散去，改日再议。藤原千花对着相马一也和莉希雅笑了一下，带着刺骨的寒意，让人不由得升起一层冷汗，“那好啊，我们改天好好谈谈吧，相马先生。”"
  PA1_revolution_list.36.a: "“顺便，解决一下残留的议题吧。”"
  PA1_revolution_list.37.t: "不欢而散"
  PA1_revolution_list.37.d: "残阳如血，零零散散的脚步声被军靴踩过主干道的声音冲碎。旌旗在空中飘扬，每一个士兵脸上都带着不安的神色，一旁的市民窃窃私语，同样面露不安之色。城门口，国民自卫队和民兵大喊着让守卫设卡禁止通行，临时管制进出交通，然而下一秒她们就只能对着远去的卡车队咬牙咒骂。\n\n毫无疑问，纸牌屋坍塌了，就像无数次被警告的那样。相马一也和莉希雅穿着国民自卫队的军服坐在车队中间的一辆卡车后方，一层轻薄的绿色军用帆布遮住了残阳的余温，只有零散的光线透过缝隙勉强让两人可以看清对方的面容。道路前方不远处隐隐约约开始浮现出城市的轮廓，城门口几排国民自卫队士兵正在掩体后严正以待，随着车队靠近，枪口对准了为首的头车。一声脆响，头车向暗淡的黄昏天空中发射了一枚特制烟花弹，士兵看见蓝色的彼岸花图案在空中炸开，立刻收起了武装，挪开了工事。车队大摇大摆的进入了城内，相马一也和莉希雅在当地保守派议员和立宪派特派员的欢迎中掀开军用帆布，脱去军大衣，从车上爬了下来。\n\n深夜，道路和居民楼的古老砖石被火把的火光照得通红，兵士在喊杀声中越过街道，皮靴敲打地面阵阵作响，军械随着颠簸而碰撞，每扇大门都被锁的严严实实，胆小者用被子裹住身体，呼吸几乎难以为继。祈祷着这种景象可以尽早远离的他的所在，一夜无眠。"
  PA1_revolution_list.37.a: "不祥之兆"
  PA1_revolution_list.38.t: "蝴蝶之梦"
  PA1_revolution_list.38.d: "莉希雅其实并不想这么做。帝国的军队还在外面，她当然知道，她也知道自己的行为会导致什么后果。在这一点上，可以说她和藤原千花是一致的，想要尽可能的和平解决问题。当然，她也很清楚，这是不可能的。在断头台砍下贵族脑袋的那一刻，她就知道，这一天迟早会到来。在那些温和派还在想办法绥靖和握手时，相马一也就和她开始准备这一切。收买，恐吓，贿赂，承诺，在军中部署自己的派系，总得有人来做这一切，也总得有人来认领这些代价。那么，作为相马一也的妻子，众人口中的余孽，被拿来和开明派丈夫对比的血统王室成员，就让她来承担这一切吧，让自己本就污秽不堪的名望再添一抹黑色吧。议长必须是无辜的，发动兵变？她认了。绑架议长？也是她。蝴蝶在蚕蛹中沉默数月，只为了最后几十天的起舞，那么，她就来做这只蝴蝶吧。毕竟，拯救王国遗产和她的性命到现在，她也无以为报，无论对方是否反对，她都必须站出来。她第一次拿过指挥刀，向着首都方向挥舞利刃。军靴踩过地面，在脚步的轰鸣中，她喃喃低语..."
  PA1_revolution_list.38.a: "“...原谅我的自私吧”"
  PA1_revolution_list.39.t: "来自旧世界"
  PA1_revolution_list.39.d: "千年前，一个欧罗巴的巨人手持利刃，向着元老院和罗马发出了响彻的欧洲的嘶吼，随后整个罗马共和国为他倾覆。现在，莉希雅拔出了那把象征着权柄的利刃，从浸泡着污血的尸体中，向着另一个共和国为她珍视的一切撕心裂肺。跨过卢比孔河...跨过卢比孔河...跨过卢比孔河...她的脑海被这个念头击中，她感觉自己不再是一个人，对啊，早就该这么做了，父亲说的对，什么共和，早就不该容忍这群野孩子为所欲为了。她有些后悔自己在几年前的软弱和屈服，如果当时就愿意冒这个险，现在又怎么会这么多此一举，自己的熟悉的一切又怎么会在自己眼前被暴民亲手扼杀。\n\n“来吧，让我们看看，二十世纪的元老院和凯撒谁会先倒下。”\n\n藤原千花依旧站在主席台上，看着台下惶惶不安的新山岳党议员和血脉膨胀的民粹派分子，脸上依旧挂着招牌微笑。如果凯撒一定要跨越卢比孔河，那么元老院自然不必继续对她手软，而共和行动也不是软弱的元老院。“各位，”藤原千花清了清嗓子，台下本在议论的议员渐渐不再言语，“各位，我们依旧在这里，不是为了坐以待毙，而是为了我们国家的未来。我们绝对不能将我们的共和国拱手让给反动分子。因此，我呼吁各位，立刻发动民兵，宣传机器以及剩下的国民自卫军，把这些暴徒一举彻底打垮！”台下虽有疑惑和迟疑，但还是鼓起来掌声，随后按部就班的回到岗位。"
  PA1_revolution_list.39.a: "骰子已经落下"
  PA1_revolution_list.40.t: "禁止通过！"
  PA1_revolution_list.40.d: "“让一下，女士们，让一下！”军车驶过闹市区，抱着菜的妇女们在吆喝声中移动到一侧，注视着一辆辆满载着小伙子的皮卡驶过。“又要打仗了吗。”一个抱着菜的少女突然挤到队伍最前面，对着为首的年轻军官喊道。“是那些贵族或者帝国打过来了吗？”“差不多，”青年军官笑了笑，“那些姥爷又要打回来让我们交钱了。当然，我们会把他们打到哭鼻子的。”“你又来吹牛了，莱昂特，”靠在角落里的另一个男青年白了他一眼，“和帝国打那次谁被子弹划伤大腿在那边哭爹喊娘的，啊？”“就你话多，”莱昂特狠狠地拍在那个青年头盔上，“到时候你丢脸了我给你老家见人就说一遍...”莱昂特凑到青年耳边，对他又补充了一句：“包括你喜欢那个妹子...”“莱昂特，”青年猛地推开莱昂特，脸色有些发红，周遭士兵见状哈哈大笑，“莱昂特，积点口德吧，当心嘴留疮！”“等等，我也要去！”一个青年从人群中窜出，跳上了一辆军车。莱昂特看了他一眼，皱了皱眉，“不是和你说了，你腿部残疾回去休息吗。”“我不，”青年固执的说道，“从小你们就因为我腿不好看不起我，我腿不好怎么了，我会做饭，我们村里都说我做饭好吃，大不了我给你烧饭吃，一天三顿我包了！”莱昂特苦笑了下，无奈的拍了拍男孩肩膀，“好吧，我们现在送你回家也来不及了，那你就和我们一起去吧。”随后，莱昂特像是想到了什么，丢给了青年一把手枪，“拿着，别弄丢了。”"
  PA1_revolution_list.40.a: "“虽然说是做饭，但是一个好的厨子也得会打架。”"
  PA1_revolution_list.41.t: "禁止通过！（续）"
  PA1_revolution_list.41.d: "城外在炮声已经响了三天了。莉希雅的部队在东芬迪尔外连续使用炮兵阵地轰炸了许久，城楼早已残破不堪，城市房屋也早已化为一片断垣残壁。然而，莉希雅的部队每次试图穿越这一片看起来早已死气沉沉的地区时，却发现尘埃中仍然有一道道由废石料和木板等就地取材制成的街垒和防御工事拦截在各大主要路口，民兵和正规军早就已经混在一起，无法辨认，躲在街垒掩体后向着每一个试图越过去的人倾泻子弹。试图直接穿越建筑废墟的更是不出几步路就被潜伏在阴影处的冷枪放倒，余下的士兵也只能仓皇丢下同伴遗体，逃离这个死亡陷阱。\n\n当然，胳膊终究拧不过大腿，随着时间的推移，这股残军已经几乎耗尽了他最后的有生力量，剩下的几个小队不是疲惫至极，就是早已缺枪少炮，身上也或多或少的付了伤。“各位，”莱昂特捂着被打穿的手臂，挥舞起一杆残破的共和国国旗，“我们没多少时间了，对方下一次装填完毕，我们就完了。”剩下的几个士兵，包括那名瘸腿的厨子，并没有预料中的害怕，只是静静地看着莱昂特。也对，毕竟这几天也早就见惯了生离死别了，莱昂特如此想到，随后猛地挥舞起那面紫红色的旗帜，“那么，与其坐以待毙，不如最后让那些畜生付出点代价吧。”莱昂特用负伤的手臂接过旗杆，另一只手拿着一杆步枪，一只脚踏上街垒的一脚，纵身一跃，冲向地方阵地，“各位，英灵殿见！”莱昂特说罢，挥舞着那面旗帜，另一只手不断开枪还击，剩下的士兵也一个个鱼贯而出。“一起走吧，祖国的子女，光荣的一天已经到来，暴政面对着我们...”"
  PA1_revolution_list.41.a: "“东芬迪尔，2900人，尽数牺牲”"
  PA1_revolution_list.42.t: "车队"
  PA1_revolution_list.42.d: "“皇女殿下，芬迪尔郊区现在十室九空，人全跑了，市区废墟勘测下来只找到了残肢断臂。”莉希雅静静地站在已经沦为废墟的芬迪尔城门口，听着派出去的斥候讲述着城内的状况。莉希雅并没有展现出明显的惊讶或是失望，毕竟作为一个久经沙场的人，她并不指望会有多少人真的热烈欢迎她们这群充满煞气的叛军。不过，这一切对于莉希雅来说并不重要，倘若抱着占山为王的思想准备试图在占领区恢复生产然后打持久战，那么藤原千花的中央政府毫无疑问可以用大半个国家的力量和资源把她莉希雅碾成齑粉。因此，人口流失反而对她有利，这样一来就不考虑后方治安问题了，那么在这场生死竞速中莉希雅就可以更快的到达首都，然后成为第二凯撒。\n\n当然，对于那些看着半辈子积蓄和心血化为废土的当地难民来说，此刻的他们能做的只有带着尽可能的多的个人物品，然后乘坐卡车或者原始的马车，从浓烟滚滚的芬迪尔逃离，然后混入更庞大的难民车队中，望着远处的首都贝亚特祈祷，但愿神明可以保佑他们安全到达那一方他们心目中的秩序仍然存在的地方。\n\n抱怨声，咒骂声，人们咒骂着这位妄图成为新凯撒的疯女人，咒骂着这次无妄之灾。有人提及了自己的父母被一发炸弹在自己面前炸的血肉模糊，还有人哭诉着自己住了一辈子的老房子带着自己和父母朋友的回忆一起被一把火烧了个精光。那么，在到达贝亚特后，四宫辉夜的宣传机器稍加运作，这些人中的相当大一部分纷纷加入了抵抗武装也就不足为奇了。"
  PA1_revolution_list.42.a: "人们厌恶凯撒"
  PA1_revolution_list.43.t: "将对将，相对相"
  PA1_revolution_list.43.d: "莉希雅终于看见了贝亚特中心广播塔的塔尖。当然，她同样也看到了一些不愿意看到的东西。那是一双双愤怒的眼睛，青年，妇女，手持着简易的民兵装备，在河的那一侧，就这么直勾勾地看着她，看着她带领的那支越过卢比孔河的部队。她认识他们，那是无数个被她摧毁的城镇中仓皇出逃的身影，那是无数她曾视之为任人宰割的顺从的羔羊的面孔。那些曾经怯懦的影子，如今变为了站在她面前具象化的威胁。当然，还有最让她厌恶的存在，她曾无数次称之为“地球之癌”的少女，那个葬送了王国的刽子手，藤原千花，此刻就在河的那一侧，身侧同样带着无数眼含怒火的国民自卫军。\n\n大河湍急，时间，现在最重要的是时间。莉希雅明白，自己在时间上不占优势，庞大的军队，完全断绝的补给链，以及急行军带来的完全不具备稳定的控制区，一旦僵持不下，来自绝望士兵的背叛会比革命法庭的死刑判决更快要了她的命。随着军刀划过，莉希雅的军队向着河流对岸发起了冲锋，子弹在空中来回穿梭，一个接着一个的士兵倒下，摔下船只，被河流冲走..."
  PA1_revolution_list.43.a: "兄弟阋墙"
  PA1_revolution_list.44.t: "末路"
  PA1_revolution_list.44.d: "莉希雅似乎做了一个很长的梦。几十年的时光，她似乎回到了自己出生的那个房间，看见了许久不见的那些旧日老友，随后是她童年的漫长夏天，带着橘黄色的黄昏和百合花香的黄昏，一个追逐着蝴蝶而不得的小女孩坐在王宫花园被残阳镶的金黄的门口生闷气。转瞬间，这个小女孩就如拔节的竹子一般长成了一个坚强的姑娘，然后是相马一也和她的改革...\n\n一声锥响，大梦初醒，莉希雅的思绪回到了那张一米见方的被告席上。面对一双双愤怒的眼神和铺天盖地的指责，莉希雅出乎意料的平静。莉希雅突然感到一阵发笑，她这荒唐的后半生，阴谋也好，暴力也罢，都只是为了把自己带回那最初的十几年。她为自己编制了一个橘黄色的梦，于是她穷尽一生想要回到那个梦中的理想乡。血流漂杵，却只是为了这个荒唐的大梦。那么，让这场梦醒吧，至少她为她最后爱的人争取到了活下去的机会。面对死神，和愤怒的民众，莉希雅没有去看那片会结束她生命的刀片，只是目光一直看向远处，看着那个已经远去的大梦，看着那个被她保护后离去的爱人。\n\n“对不起，谢谢你，再见了，哦不，永别了...”"
  PA1_revolution_list.44.a: "再见了，晚安..."
  PA1_revolution_list.45.t: "投降"
  PA1_revolution_list.45.d: "死亡，死亡，还是死亡。\n\n子弹的炼狱已经吞没了成千上万的生命，而战线却始终无法推进过那条大河。生活在人间的人类总是试图描绘地狱，却在地狱正在露出那冰山一角的地方视而不见。莉希雅在晨雾中看着那条已经变为淡红色的河流，断肢残臂随着河流的冲刷上下起伏，对岸的雾气中却仍然充斥着源源不断的人影。“莉...莉希雅殿下，我们被包围了！”一个士兵慌慌张张的跑来，莉希雅心头一紧，但在看到为首的相马一也后，松了一口气。相马一也骑在一批马上，周遭士兵几乎没有抵抗就纷纷放下武器，自觉的站到了路两侧。莉希雅没再多做什么，接受了被“俘虏”的事实。是啊，多么好的剧本啊，我们的公民议长又回来了，从邪恶保皇派手中死里逃生，然后维护了共和国的尊严。多么好的一个故事啊。"
  PA1_revolution_list.45.a: "唯一的问题是，这是个脚本故事"
  PA1_revolution_list.46.t: "尾声"
  PA1_revolution_list.46.d: "结束了，莉希雅大踏步走进了那座象征着共和国的国民公会，就像千年前的凯撒进入罗马一般。国民公会内部也早已人去楼空，只留下了一排排混乱和掀翻的桌椅，以及地上残留的血迹。看来那些入城的清扫部队很好，莉希雅眼神里带着赞许。唯一让她不满意的是，藤原千花等人不知所踪。不过无论如何，莉希雅的橘黄色的大梦，终究还是得意实现了。那些疯子的迄语，野心家的计划，最终还是被挫败了，祖国又回到了立宪派和温和派的温柔怀抱里。任凭那些共和派和雅各宾分子哀嚎吧，反正任何动物死前都是会啼哭的，莉希雅会亲手把他们埋葬，就像数年前她亲手和相马一也一起血洗宫殿，把那些顽固老东西的脑袋砍下来一样。一个仁慈，进步的王国，一个秩序的未来，正在未来冉冉升起。"
  PA1_revolution_list.46.a: "无言"
  PA1_revolution_list.48.t: "\n\n\n\n\n\n[news_event_spec_logo]\n\n\n\n\n\n\n\n                                                                                                                                                       左翼共和主义者统一南美"
  PA1_revolution_list.48.d: "就在今天，艾尔孚利登民主共和国及其盟友消灭了南美大陆上最后一个敌对政权，随后“南美工人联合会”发表了一则通告，宣布南美“已经驱逐了殖民主义和反动主义对南美的毒害”。据悉，以野火革命军和艾尔孚利登等国家组成的“南美工人联合会”目前正在筹备南美的战后重建工作，并决定在近期完成合并，以实现南美的真正统一。此外，据小道消息透露，南美的革命势力似乎有北上继续输出革命的计划...\n\n苏联和第三国际成员等左翼国家在第一时间表达了对南美革命胜利的祝贺，并称这是“无产阶级战胜强权的典范”。而以圣杯王国为首的圣杯同萌成员则对“暴民政治”的谴责，并着手准备对南美进行进一步制裁和武力威胁。"
  PA1_revolution_list.48.a: "祝贺南美摆脱枷锁"
  PA1_revolution_list.48.b: "不过是一群暴民"
  PA1_revolution_list.49.t: "野火和火炬"
  PA1_revolution_list.49.d: "野火烧光了杂草，只留下一片肥沃的土壤，供这片土地上的民众随意取用。\n\n火炬照亮的洞窟，驱逐了别处来的黑鹰，现在村庄的孩子们再也不用担心被那些故事里的怪物抓走了。\n\n长久之后，孩子们会在阳光下健康长大，姑娘们会吃上新鲜的麦子，天空上再也没有乌云密布。村庄和城市再也不用担心那天外来客和本地野兽的侵扰。吃人的洞穴也被火炬和野火驯服，成为了源源不断吐出黄金和面包的喷泉。\n\n野火和火炬相视一笑，最后，不知道是谁先伸出手，紧接着两人愣了一下，两只温热的手紧紧握在一起。"
  PA1_revolution_list.49.a: "火炬咯咯的笑了"
  PA1_revolution_list.49.b: "野火高歌一曲"
  PA1_revolution_list.50.t: "愿望"
  PA1_revolution_list.50.d: "曾经有一个女孩，她许了一个愿望，一个其他魔法少女不再被绝望缠绕的愿望。\n\n曾经也有一个女孩，她也许了一个愿望，一个所有人不再受苦的愿望。\n\n两份愿望相隔千里，却最终心意相通，两个少女最终站到了一起，为了同一个愿望，即天下再无人独自哭泣。\n\n现在，是时候打破最后一层隔阂了，让两个不同的心灵合二为一。"
  PA1_revolution_list.50.a: "美德少女"
  PA1_revolution_list.50.b: "希望少女"
  PA1_revolution_list.51.t: "\n\n\n\n\n\n[news_event_spec_logo]\n\n\n\n\n\n\n\n                                                                                                                                                       美洲大陆战争：\n                                                                                                                                                       左翼共和主义者向北方进军！"
  PA1_revolution_list.51.d: "如同日前预料的那样，左翼共和主义者在完成了南美的整合后，选择了与中美洲的红色圣遗物使用者结成统一战线，以抵御“北方的殖民主义和反动主义威胁”。目前，北美当局对于拉丁美洲诸国的不宣而战感到“愤怒且不可理喻”，并宣布将动用全北美的力量来“粉碎疯狂的暴民政治”。日前，拉丁美洲诸国组成的联合部队已经越过了北美和中美洲国家的边境线，毫无疑问的是，战争已经开始。\n\n苏联和第三国家呼吁拉丁美洲和北美”保持克制”，并谴责了资本主义世界长期以来对于拉丁美洲的殖民压榨。而圣杯王国和民主国家同盟则严厉警告拉丁美洲诸国，倘若继续她们的“超出合理范围的武力行为”，圣杯王国将会采取武装干预措施来“保卫民主和和平”。"
  PA1_revolution_list.51.a: "让圣杯佬见鬼去"
  PA1_revolution_list.51.b: "令人担忧"
  PA1_revolution_list.52.t: "\n\n\n\n\n\n[news_event_spec_logo]\n\n\n\n\n\n\n\n                                                                                                                                                       美洲大陆战争：\n                                                                                                                                                       南美合众国向北方进军！"
  PA1_revolution_list.52.d: "虽然艾尔孚利登王国在战后一度被认为难以为继：其强行夺取的土地或许将会导致严重的当地人叛乱问题。而残余的革命党更是对复辟的王国心存怨恨，渴望再现大革命故事。然而莉希雅皇女政府却没有如同外界预料一般垮台，反而整合了南美各地形成了一个所谓的“南美合众国”。现在，北方的担忧终于要化为现实，在消灭了中美洲的几个政权后，王国军队终于越过了北美和中美洲的边界线。北美当局宣称会“不惜一切代价摧毁野蛮的国度”，而南美合众国则声称此举是为了将北美也“置于美洲独立国家联盟的保护下”。\n\n苏联和第三国际表达了对美洲局势的担忧，而圣杯王国则严厉警告南美合众国，倘若继续她们的“超出合理范围的武力行为”，圣杯王国将会采取武装干预措施来“保卫民主和和平”。"
  PA1_revolution_list.52.a: "世界屏息凝神"
  PA1_revolution_list.53.t: "老朋友，新伙伴"
  PA1_revolution_list.53.d: "暴君已死，野心家被革命的铁拳砸了个稀碎，现在南美已经在同一个理想下共同大踏步前进。同样的，被人称之为“恐怖统治”的时期也可以结束了，美德已经战胜了堕落，因为那些曾经在田地里，工厂里咀嚼野菜根的姑娘组成的野火的剃刀已经把那些害人的杂草彻底扫入历史垃圾堆。\n\n对于共和国的未来，各位都有自己的看法，国民公会和各地的小伙子和姑娘们也对各自期望的人选做出了选择。那么，现在到了揭晓结果的时候了。"
  PA1_revolution_list.53.a: "晓峰姐（人民阵线），你经验丰富"
  PA1_revolution_list.53.b: "雪伊姐（工团主义），还是得你来"
  PA1_revolution_list.53.c: "小果子（革命民主），也许让年轻人来试试？"
  PA1_revolution_list.53.e: "藤原千花，当之无愧"
  PA1_revolution_list.54.t: "晓峰当选"
  PA1_revolution_list.54.d: "经过了紧张的角逐，最终当选的是前野火革命军领袖之一的晓峰。"
  PA1_revolution_list.54.a: "恭喜"
  PA1_revolution_list.55.t: "雪伊当选"
  PA1_revolution_list.55.d: "经过了紧张的角逐，最终当选的是前野火革命军领袖之一的雪伊。"
  PA1_revolution_list.55.a: "恭喜"
  PA1_revolution_list.56.t: "小果子当选"
  PA1_revolution_list.56.d: "经过了紧张的角逐，最终当选的是前野火革命军领袖之一的小果子。"
  PA1_revolution_list.56.a: "恭喜"
  PA1_revolution_list.57.t: "藤原千花当选"
  PA1_revolution_list.57.d: "经过了紧张的角逐，最终当选的是艾尔孚利登革命的发起者之一的藤原千花。"
  PA1_revolution_list.57.a: "恭喜"
  PA1_revolution_list.58.t: "\n\n\n\n\n\n[news_event_spec_logo]\n\n\n\n\n\n\n\n                                                                                                                                                       艾尔孚利登第二王国统一南美"
  PA1_revolution_list.58.d: "近日，南美结束了长期以来的战乱和动荡，随着最后一声枪响熄灭，南美在连年战火后终于回归了平静。出乎所有人预料的是，统一者既不是莉兰迪亚王国，野火革命军或者被认为是南美普鲁士的帝国，而是一个被认为应该早已灭亡的国家——艾尔孚利登第二王国。该政权由革命后的艾尔孚利登民主共和国演变而来，因共和派长期无法妥善处理国内问题，最终遭到前王国皇女莉希雅发动军事政变推翻。王国军队消灭了革命军和帝国武装力量，并将圣杯支持的远征军和魔法少女联盟势力彻底逐出了南美，随后该国宣布“南美已经回到了她真正的主人手中。”\n\n目前，圣杯王国及其盟友表达了对艾尔孚利登第二王国，或者说现在已经被称为南美合众国的谴责，并声称不得“破坏圣杯在南美的合法利益”，而苏联和第三国际则并未对此做出回应，只是附上了一段简短的，仅仅是外交礼仪的祝贺。"
  PA1_revolution_list.58.a: "什么，王国回来了？"
  PA1_revolution_list.59.t: "伟大社会的理想"
  PA1_revolution_list.59.d: "霓虹灯在落地式窗前照出了一个个闪耀的大字，远处的轨道传来轰鸣声，一个个如同沙丁鱼罐头的车厢载着一个个灵魂，承载这一个个疲惫而却又或大或小的愿望。经济引擎随着莉希雅皇女笔尖划过的油墨和飞驰的列车轰鸣咆哮，带动着南美合众国这辆庞然大物在经济轨道上飞驰而过。\n\n莉希雅曾经做过一个很长的梦，梦的内容是她的童年，和那些早已模糊的脸庞，以及一个追着蝴蝶的小姑娘。这些童年记忆就像一个漫长的橘色夏天，承载着她那注定亲手埋葬的旧梦。而在旧梦的冠冢上，一个名叫伟大社会的理想真在拔地而起，莉希雅抚摸着一张落灰的相片，那是她的父亲，母亲，还有年幼的她，随后这张照片被放入了一个抽屉，然后不再打开。\n\n成千上万的人正翘首以盼，各种语言，各种身份，汇出一句话，“我们要去哪”。\n\n莉希雅的笔尖没有停下，一个梦想，一个美洲被压抑了千年的自由梦想，伟大的社会，正在她和相马一也的笔下逐渐成型。美洲雄鹰正在挥动她的翅膀..."
  PA1_revolution_list.59.a: "而世界也要为此颤抖"
  PA1_revolution_list.60.t: "火炬"
  PA1_revolution_list.60.d: "“结束了吗。”藤原千花没有抬头，只是看着一封战报，对着来人开口。“是的，对方已经批复了，圣杯王国和北美当局已经同意了我们的要求，”一个手臂上带着三色花和红旗徽章的官员干脆利落的开口，“现在北美当局已经流亡在外，北美的新姐妹共和国已经在我们的协助下建立了。”藤原千花依旧带着笑，表情上却放松了不少，随后又想到了什么，“新闻，对，我们需要立刻把这个消息告诉我们的人民。”“已经发出去了，藤原千花小姐，”脚步声由远及近，一个熟悉的身影出现在了门口，“这一局，算我赢了吧。”藤原千花这时才猛地抬起头，看着眼前这个拿着一张报纸捂着嘴笑的少女，无奈的笑了笑。\n\n“不哦，其实是我们都赢了，辉夜酱。”"
  PA1_revolution_list.60.a: "“什么，什么叫你已经通知了广播站和报纸一起报道？！”"
  PA1_revolution_list.61.t: "耀眼的火炬"
  PA1_revolution_list.61.d: "一双双在泥土中，在工厂里磨损的双手，一双双曾经麻木的双眼，现在却朝向了一个方向。一个声音在向她们诉说，一个姑娘，一个理想，诉说着数千万灵魂的故事，数千个日夜，数百万矿洞，还有那一道道火红的鞭印，在无数个夜里的奴隶背上火辣辣的作痛。“多谢，各位有劳了。”远处传来了雷鸣的空洞感。\n\n“这样装模做样的你，我真是无比厌恶呢。”一个，两个，三个，随后是千万个声音响起，重复着这句话，鞭子抽啊，抽啊，而呐喊声却愈发嘹亮，直到寰宇都听的见。那鞭子吓破了胆啊，顺着山路就跑了，头也不回一下。无数个难以辨别的灵魂砸开了铁栅栏，第一次沐浴到了阳光。“看，我能认出你了。”一个声音惊讶的喊道，“我也能认出你了。”这些灵魂的面容逐渐清晰，丑陋的表壳逐渐脱离，露出了一个个不同的美丽的身姿。\n\n在阳光下，这些灵魂第一次发现，自己竟然如此的美丽，而身后的栏杆后，无数语言刻成的语句也逐渐蚀穿了混凝土..."
  PA1_revolution_list.61.a: "真相已经大白于天下"
  
