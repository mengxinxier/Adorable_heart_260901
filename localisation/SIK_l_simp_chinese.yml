####事件####
  SIK.02.title: "新疆局势升级"
  SIK.02.desc: "神州帝国的统治危机正沿着漫长的驿道向西蔓延，昔日维系天山南北平衡的脆弱秩序终于在今春彻底瓦解。北境之外，苏维埃联盟的身影愈发逼近伊犁河谷，由目白阿尔丹领导的亲苏革命组织“新疆军民委员会”也在北疆各城加紧串联；天山南麓，以九色鹿为首的察合台独立武装更已公开举旗，连克莎车、和田诸城并步步紧逼吐鲁番。\n\n随着北京朝廷鞭长莫及，新疆都指挥使司已事实上脱离了原有的宗藩与同盟体系。迪化城内暗流汹涌，中原派、苏联派与地方独立势力三方剑拔弩张——一场决定西域最终归属的激烈博弈，此刻正式拉开帷幕。"
  SIK.02.a: "风暴已至，天山南北再难宁日。"

  SIK.03.title: "中原派取得胜利"
  SIK.03.desc: "历经数月刀光剑影与明争暗斗，新疆的尘埃终于落定。以新疆都指挥使司主官仇白为首的中原派在孤立险境中稳住了迪化防线，并与自河西走廊驰援出关的朝廷部队形成合击之势，先后肃清了吐鲁番与南疆绿洲的察合台独立武装，同时在北疆与伊犁一线彻底挫败了苏联派的攻势。\n\n随着反对派据点逐一瓦解，目白阿尔丹只得率残部撤出疆界。重整旗鼓的都指挥使司再度竖起效忠北京的旌旗，这片高祖浴血换来的西域门户，终究还是留在了神州的版图之中。"
  SIK.03.a: "西域既定，当重振都司防务！"

  SIK.04.title: "苏联派取得胜利"
  SIK.04.desc: "持续数月的三方较量迎来了决定性的黎明。在苏维埃联盟的物资与政治支援下，长期扎根新疆基层、争取各族群众并推动土地斗争的知识分子领袖目白阿尔丹，协同新疆军民委员会步步为营，在迪化城内外一举击溃了摇摇欲坠的都指挥使司守军，并将南疆的察合台独立武装逐出要冲。\n\n原守将仇白携残部向东撤离后，旧衙门上的旗帜被彻底降下，取而代之的是猎猎作响的红旗。伴随着庄严的建国宣告，“新疆苏维埃共和国”在天山脚下正式诞生。"
  SIK.04.a: "天山南北，从此归于人民！"

  SIK.05.title: "地区独立势力取得胜利"
  SIK.05.desc: "当神州帝国的旧秩序在风沙中分崩离析、北方强邻的渗透又步步紧逼之时，真正崛起于大漠与绿洲间的本土力量改写了西域的结局。九色鹿率领经过西式整训的察合台武装自莎车、和田一路北上，先克吐鲁番要冲，继而攻入迪化，在两大强权的夹缝间同时迫使仇白的都司守军败退关内、将目白阿尔丹领导的苏联派势力逐出天山北麓。\n\n随着旧朝官制宣告废除，“察合台自治政府”在迪化正式立起大旗。从今往后，这片古老的土地将不再听命于北京或莫斯科的任何一方。"
  SIK.05.a: "属于察合台的新时代开始了！"

####新闻####
  SIK_news.001.title: "$news_event_background$中原派取得新疆博弈胜利"
  SIK_news.001.desc: "持续数月、牵动中亚与东亚各方神经的新疆博弈终于尘埃落定。随着迪化方面发布捷报，以新疆都指挥使司主官仇白为首的中原派在神州帝国朝廷的支援下力挽狂澜，成功稳住了天山南北的动荡局势。\n\n据前线传回的消息，中原派守军与自河西走廊驰援出关的部队相互呼应，不仅逐一肃清了吐鲁番与南疆绿洲一带的察合台独立武装，更在伊犁河谷与北疆要道挫败了亲苏派系及其背后苏联势力的步步紧逼。随着反对派据点接连瓦解，包括目白阿尔丹在内的部分苏联派骨干被迫撤出新疆，经由边境退往苏联或流转他处。\n\n仇白随后在迪化重申新疆都指挥使司对北京朝廷的效忠，并宣布全面整饬西域军政与防务。外界普遍认为，中原派在西陲的胜出为深陷危机中的神州帝国守住了至关重要的西北门户，也在一定程度上缓和了紫禁城摇摇欲坠的统治威信。"
  SIK_news.001.a: "西域重归安宁，天朝威仪犹在！"
  SIK_news.001.b: "黄沙百战，终不负戍边之责。"
  SIK_news.001.c: "反动派暂时守住了防线，但斗争远未结束。"
  SIK_news.001.d: "神州朝廷竟然还稳得住西域的局面？"
  SIK_news.001.e: "至少在西域，北京还没有失去它的旗帜。"

  SIK_news.002.title: "$news_event_background$苏联派取得新疆胜利"
  SIK_news.002.desc: "随着迪化城头的旧旗缓缓降下、鲜红的旗帜在天山北麓迎风升起，持续数月的新疆博弈以苏联派的全面胜利落下帷幕。在苏维埃联盟的鼎力支持与本地革命力量的密切配合下，由新疆军民委员会主导的新政权正式宣告成立“新疆苏维埃共和国”。\n\n这场剧变的核心人物正是长期深耕新疆革命运动的知识分子领袖目白阿尔丹。凭借在争取各族群众、推进土地变革与整合武装方面的出色筹划，她在错综复杂的三方角逐中步步为营，最终同时击溃了效忠北京的中原派守军与天山南麓的察合台独立势力。守城失利的原都指挥使司主官仇白已率残部撤出新疆，退返神州帝国境内。\n\n莫斯科方面迅速对迪化新政权表示欢迎，并承诺将在工业、交通与防务领域提供援助。与此同时，北京紫禁城则陷入一片震动——西北边陲一夜赤化，不仅令神州帝国的王朝危机雪上加霜，也彻底改写了中亚与整个中国西北的战略天平。"
  SIK_news.002.a: "俄夷染指西域，实乃帝国奇耻大辱！"
  SIK_news.002.b: "雪山之上，终于迎来了属于人民的黎明。"
  SIK_news.002.c: "又一面红旗在亚洲腹地升起了！"
  SIK_news.002.d: "红旗飘扬于迪化，西北格局已彻底改写。"
  SIK_news.002.e: "莫斯科的手，已经伸到了戈壁深处。"

  SIK_news.003.title: "$news_event_background$独立势力取得新疆胜利"
  SIK_news.003.desc: "在长达数月的明争暗斗与武装冲突之后，新疆的命运既未重回北京掌中，也未落入莫斯科的版图——以九色鹿为首的察合台独立势力异军突起，在天山南北的三方博弈中笑到了最后。\n\n这支最初发迹于天山南麓的本土武装，借西式操练重整军纪，自莎车、和田一路北进，先后攻克吐鲁番要冲并最终进驻迪化。面对中原派与苏联派的双重夹击，九色鹿巧妙周旋于绿洲部族与地方势力之间，最终迫使神州帝国守军主官仇白败退关内，同时也将目白阿尔丹领导的苏联派势力逐出新疆。\n\n随着迪化旧衙门易主，新成立的“察合台自治政府”宣布脱离神州帝国的朝贡与管辖体系，并宣称将独立决定西域各族的未来。不过，夹在神州与苏维埃联盟两大强权之间，这座崛起于大漠与雪山间的独立政权究竟能否长久立足，国际社会仍普遍拭目以待。"
  SIK_news.003.a: "逆党割据西陲，早晚必兴兵讨之！"
  SIK_news.003.b: "大漠与绿洲的命运，终将由我们自己书写。"
  SIK_news.003.c: "又一个反动的分裂政权挡在了通往东方的道路上。"
  SIK_news.003.d: "西域竟然也树起了自立的大旗……"
  SIK_news.003.e: "在大国博弈的缝隙里，西域走出了自己的路。"

