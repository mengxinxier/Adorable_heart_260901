 TAM_news.1.title: "$news_event_background$特雷森统一"
 TAM_news.1.desc: ""
 TAM_news.1.a: ""
 CAC_Early_Prepare_For_Cicil_War_desc: "随着谈判破裂，内战已不可避免！\n我们必须未雨绸缪，做好内战的准备！"
 CAC_Early_Army_1_desc: "我们的陆军在应对一般威胁时已经足够，但我们现在要面对的，是一场全面战争。\n我们必须发动并武装民兵，以应对随时可能爆发的战争。"
 CAC_Early_Industry_1_desc: "我们的工业体系早已落后于时代，我们需要大刀阔斧进行改革。"
 CAC_Early_Politics_1_desc: "战争的阴云临近，我们的工厂的流水线却缺乏预热。\n购买武器应该可以解一时之急。"
 CAC_Early_Ready_To_War_desc: "我们已经做好准备，加入这场中亚领导人的角逐了。\n（开启二阶段国策。不过这里后面没国策了。我还没做完，所以不要怀疑是自己的问题。）\n（顺便一提，这一条内战线也是会重做的，所以以后没有这么高的数值了。）"
 CAC_Early_Industry_5_desc: "将战略资源集中在首都，能让我们更专心于设防。"
 CAC_Early_Industry_6_desc: "任何一个地方，可以是教堂的墓地下，可以是村庄的枯井内，可以是城市的下水道里，都能成为支援我们的地下工厂。"
 CAC_Early_Industry_2_desc: "我们需要集中资源，确保一切资源优先供给战争。"
 CAC_Early_Army_2_desc: "仅靠目前的军队，我们不足以应对战争。我们需要扩大征兵的规模。"
 CAC_Early_Army_4_desc: "我们可以尽可能保存并藏匿一些装备，以在需要时使用。"
 CAC_Early_Army_3_desc: "令人不安的消息不断从边境传来，我们需要训练更多部队，以应对接下来的冲突。"
 CAC_Early_Politics_2_desc: "我们需要快速获得一笔圣杯盾以应对战争。为此我们需要发行高利息的战争债券。至于如何兑付，只能留到战后再说。"
 CAC_Early_Industry_3_desc: "我们急需大量的武器，放开民间武器的制造，虽然会导致武器质量的下滑，但我们可以迅速武装军队。"
 CAC_Early_Politics_3_desc: "我们需要削减行政支出，转向军事支出。"
 CAC_Early_Industry_4_desc: "我们会将一些不重要的工厂改装为军用工厂。"
 CAC_Early_Politics_4_desc: "将大量资源留在边境线上很明显不是什么好主意，我们会将这些资源转移到安全的地方。"
 CAC_Early_Politics_5_desc: "我们将转移部分人口，以防战事不利。"
 CAC_Early_Army_6_desc: "我们现在或许靠着步兵和骑兵，但我们在战场上面对的，可能还会有坦克。\n我们不能放任只有敌人有这些钢铁巨兽。"
 CAC_Early_Army_5_desc: "只有人海是不够的！我们要培养自己的精英部队。"
 extra_tech_slot: "增加科研槽"
 extra_tech_slot_desc: "我国工业不断扩张，各行各业不断进步，这使得我们能够同时进行更多科研项目。"
 extra_tech_slot_2: "增加科研槽 II"
 extra_tech_slot_2_desc: "我国的快速工业化让我们在科研上有了新的突破。"
 CAC_mid_foc_01: "支持战争"
 CAC_mid_foc_01_desc: "战争已经打响，我们需要不遗余力支持战争。\n【这条下面的国策会在未来（我也不知道什么时候）进行重写。】"
 CAC_mid_foc_res: "CAC_mid_foc_res"
 CAC_mid_foc_res_desc: "CAC_mid_foc_res_desc"
 CAC_mid_foc_res1: "统一规划资源"
 CAC_mid_foc_res1_desc: "我们将对战略资源进行进一步整合。"
 CAC_mid_foc_res2: "CAC_mid_foc_res2"
 CAC_mid_foc_res2_desc: "CAC_mid_foc_res2_desc"
 CAC_mid_foc_tec: "增加科研槽"
 CAC_mid_foc_tec_desc: "多亏工业的发展，我们的研究获得了长足的进展。"
 large_navy: "大舰队"
 large_navy_desc: "我们的海军学说理论将被调整，我们将更为重视大战舰，并注重兼顾护航舰队的安全，这会助益我们研发相关任务所需的舰船。"
 army_effort: "重视陆军"
 army_effort_desc: "尽管空战与海战技术不断发展，地面战斗仍是未来战争的关键。如若我们做好准备，就可避免再次陷入堑壕战的地狱。"
 CAC_mid_foc_army1: "生于战火"
 CAC_mid_foc_army1_desc: "我们应该自主研制达到世界领先水平的步兵武器，而不是购买或仿制外国货。"
 CAC_mid_foc_ind: "CAC_mid_foc_ind"
 CAC_mid_foc_ind_desc: "CAC_mid_foc_ind_desc"
 CAC_mid_foc_army2: "鲜血淬炼"
 CAC_mid_foc_army2_desc: "我们必须继续努力，来让我军步兵和支援部队拥有站在时代前沿的装备。"
 CAC_mid_foc_army3: "死得其所"
 CAC_mid_foc_army3_desc: "陆军装备日新月异，我们将致力于为战士们研发出最好的装备。"
 CAC_mid_foc_ind2: "集中建设"
 CAC_mid_foc_ind2_desc: "将我们政策的效力集中用在工业建设上以获得跳跃式发展。"
 CAC_mid_foc_ind1: "战争工业"
 CAC_mid_foc_ind1_desc: "将我们政策的效力集中用在工业建设上以获得跳跃式发展。"
 CAC_mid_foc_ind3: "应急工厂"
 CAC_mid_foc_ind3_desc: "将我们政策的效力集中用在工业建设上以获得跳跃式发展。"
