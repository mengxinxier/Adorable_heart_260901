 AFG_Matsuda_Arisa_leader_dip_tt: "$AFG_Matsuda_Arisa_leader$\n§Y[AFG.GetNameWithFlag]§!的统计专家\n§Y工业现代化倡议者§!\n  - $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$：§G+5.00%§!\n  - $MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$：§G+5.00%§!\n  - $MODIFIER_LINE_CHANGE_PRODUCTION_EFFICIENCY_FACTOR$：§G+15.00%§!\n  - $MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$：§G-10.00%§!\n"
 AFG_Matsuda_Arisa_leader_desc: "§Y松田亚利沙§!是一位对统计和数字非常敏感的统计专家，而初衷，据她自称，可能仅仅是为了更好地追偶像？\n\n美浦州日益严重的政治危机，中亚愈发紧张的气氛，让她坚信，只有一个强而有力的政府，才能终止无休止的政治迫害。\n\n“为了更好的未来，我会为美浦州，为了大家的笑容，献出我的一切。”"
 AFG_Matsuda_Arisa_head_of_government: "§Y工业现代化倡议者§!"
 #神崎兰子
