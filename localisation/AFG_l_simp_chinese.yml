###开局介绍
 AFG_his_page_01_title: "白军、叛军与军阀"
 AFG_Country_History_Page_01: "美浦国民阵线的前身，是19在沙俄落败之后，由流亡的白军和美浦地区总督建立的美浦军政府。美浦州位于沙俄统治区的边缘地带，此处一直活跃着对沙俄统治不满的叛军和地方武装。\n\n“伟大战争”时期，美浦州的地方军阀们，为沙俄提供了大量的翠源石和魔法使用者，以获取沙俄许诺的战争利益。沙俄被新生的红色政权推翻后，除了流亡基辅、蒙古的白军，美浦地区也存在着一支孤立无援的白军。\n\n1932年的“闪耀戡乱”中，美浦军政府被推翻，由起义军、叛军和军阀组成的联合政府，美浦国民阵线上台。"
 AFG_his_page_02_title: "魔法、闪耀和偶像"
 AFG_Country_History_Page_02: "面对国际政治上的孤立无援，北方大国的敌视和贸易制裁，叠加物资短缺，极端气候，美浦州陷入了“黑暗的十五年”。军队废弛、物价飞涨、民生凋敝、生态灾难。陷于内斗和绝望的白军政府则对此毫无解决办法。\n\n在这十五年之中，即使是再高傲的魔法使用者，也不得不为了生计，将魔法用在日常、民生之中。包括但不限于魔法作物、魔导机械、魔法教学。为了避免引起超级大国的警惕，美浦州改用“闪耀力量”和“偶像活动”，来包装这种右翼的魔法狂热。\n\n然而，对力量和权力的追求是永无止境的。获得了“闪耀力量”的偶像团体，逐渐架空了军政府的各地总督，反而成为了新的实际地方话事人。"

 AFG_his_page_03_title: "政治倾轧"
 AFG_Country_History_Page_03: "美浦州同时处在北方特雷森苏维埃的武力威胁、西方波斯（栗东）的政治影响、东南方艾恩葛朗特的渗透下，这让美浦州各个势力不得不保持一致对外的表象。但在美浦内部，血腥而残忍的政治倾轧从未停止。\n\n起义成功后圈地自重的摩登军，对魔法狂热的闪耀追寻者，被打散但依然有拥趸的白军，有心改变政局却无力的左翼……各个势力正盘踞在美浦这张群山舞台之上。\n\n1935年被镇压的“秋季罢工”，可能是美浦内部分裂的最后一根稻草。"
 AFG_Local_History_Title: "美浦州"
 AFG_loca_his_t_01: "群山天险"
 AFG_history_page_01: "早在十九世纪之前，美浦地区便以易守难攻的山峦和河流，而被各国军事学家们认为是“帝国坟场“。无情的高温、沙漠和群山，足以吞噬任何没有做好充足准备的入侵者。\n\n险恶的地理环境下，美浦州却拥有着哪怕是放在全世界也毫无疑问算是丰腴的翠源石矿藏，和更高比例的，具有激发翠源石能力的魔法使用者。\n\n即使是沙俄的鼎盛时期，其对美浦州的掌控力度依然很孱弱，此处也成为了圣杯和沙俄两国战略博弈的最前线。\n\n然而随着沙俄的倒下，中亚特雷森地区的革命浪潮，和协约国干涉军的撤离，美浦州已然成为了白军在中亚、西亚地区的最后一处据点。相较于基辅政权，这里远离协约国的利益，只有东南方毗邻的艾恩葛朗特，尝试对美浦进行渗透，想将美浦地区纳入掌控。"
 AFG_loca_his_t_02: "黑暗的十五年"
 AFG_history_page_02: "在“伟大战争”中，面对欧洲愈发不利的战争事态，和国内激化的共产主义革命，沙俄曾向美浦州许下了独立承诺，而美浦州也为此，向沙俄提供了源源不断的翠源石和娴熟的魔法使用者，参与“伟大战争”和镇压特雷森地区的起义。但沙俄战败了。\n\n圣杯王国组建的干涉军，中亚的白军，在1918年特雷森起义中节节败退，大部分回到了美浦州，少部分流亡到了波斯（栗东）。\n\n前沙俄西亚军团重装甲旅的指挥官，唐纳德·摩登，在特雷森起义时，公然反对干涉军借道美浦，他因此被剥夺了沙俄的军权。但很快，他就组织起一支自称“摩登军”的私人武装，潜伏在美浦东部，暗中为特雷森革命者提供支持。\n\n镇压特雷森起义失败的流亡白军和美浦的前沙俄官僚，在1921年初，组成了受到圣杯王国操控的军政府，该军政府在1921年至1932年的十二年里，深陷内部的扯皮和党争，既没有对美浦进行建设，也没有改善民生，更没有解决愈发严重的饥荒和旱灾。这导致美浦的左右翼政党势力迅速扩大。\n\n直到1932年6月，由于怀疑北方瓦罕地区窝藏、包庇特雷森左翼革命者，美浦军政府制造了震惊全国的“瓦罕惨案”，由此引发的罢工和暴动，在美浦左右翼和军方志士联手下，迅速演变成一场席卷全国的武装起义。"
 AFG_loca_his_t_03: "闪耀戡乱"
 AFG_history_page_03: "1921年3月，第一支偶像团体在赫拉特建立，创始人已不可考据，但普遍被认为是“伟大战争”时期，沙俄的宫廷法师，后流亡至美浦，因源石病死亡的格里戈里·拉斯普京。\n\n1932年6月，美浦北部的瓦罕地区，一支军政府的白军部队，在搜捕特雷森左翼革命者时，对该区域一处平民聚居点进行了惨无人道的虐杀和屠杀。该事件迅速发酵，在遍布全国的闪耀追寻者偶像团体自发的义演宣传下，美浦的平民开展了声势浩大的罢工运动。\n\n1932年7月，喀布尔的白军军警，对闪耀追寻者的罢工游行队伍进行了突袭，造成数人伤亡。这一举措，彻底引爆了美浦州的局势。左翼政党，右翼政党，平民的同情者，纷纷发起了武装起义。\n\n1932年11月，仅仅五个月，军政府被美浦的各路起义军击溃。出于政治考量，失势的军政府高层和士兵并未被完全清算，而是归于被打乱分散，安置到了美浦州各地。至于随白军军政府留下的魔法工艺和装甲科技，则是被起义军瓜分。\n\n1933年1月，美浦临时政府的第一届公民代表大会上，被各方起义军认可的精神领袖，四条贵音，也正式成为美浦国民阵线的领袖。而右翼的闪耀追寻者，和政治中立的摩登军组成了右翼联合执政党。\n\n1933年2月，艾恩葛朗特尝试对美浦南部进行武装渗透，但被早有准备的临时政府阻挡。这也标志着美浦和艾恩葛朗特的关系彻底破裂。\n\n1934年3月，美浦特雷森左翼党被指控在“瓦罕惨案”中，利用平民充当军事诱饵。这场指控没有实质性证据，但在联合执政党的默许下，该指控迅速发酵，进而演变成对美浦特雷森左翼党的一场围剿。时任美浦国民阵线财政部长，美浦特雷森左翼党的领袖，北部玄驹，被迫辞职，而美浦特雷森左翼党也被勒令解散。\n\n1934年5月，北部玄驹的好友，也是特雷森苏维埃社会主义共和国的革命者，里见光钻，自北方入境，秘密建立特雷森抵抗组织，该组织暗中吸纳前美浦特雷森左翼党成员，并尝试在温和偶像团和军队之中博取支持者。\n\n1935年9月，因一切生产服务于政府、军队，对产业工人和农民的高压控制，美浦州南方的工人，在温和偶像团的党魁，高板惠乃果带领下，掀起了一场被称为“秋季罢工”的罢工运动。而面对此次罢工，右翼联合政府的另一方，摩登军，则是对罢工进行了消极应对。\n\n1935年10月，美浦州北方的工人，也在特雷森抵抗组织的支持下，进行罢工，响应南方罢工。摩登军对此情形保持了克制，只是加强了各个驻地防御。\n\n1935年11月，四条贵音调动美浦州的魔法部队，对“秋季罢工”进行了镇压。同时，右翼联合政府宣布温和偶像团政党非法，并大肆搜捕其支持者。\n\n1935年12月，“秋季罢工”虽然被镇压，但一道隔阂，已经在闪耀追寻者和摩登军之间裂开。而特雷森抵抗组织和温和偶像团之间，也为了共同的目标，达成了临时联合。\n\n这场“闪耀戡乱”，并没有解决美浦的危机。旱灾、饥荒、粮食、瘟疫、军阀、封锁、专权、乱兵……天灾和人祸依然考验着美浦国民阵线。而北方的特雷森，则是在十多年和平发展之后，将目光再次聚焦于美浦地区。"


