 AFG_black_TOOLTIP: "£faction_AFG_zveno §Y闪耀激进派§!是由具有“闪耀之力”的偶像团体所创建的右翼组织，目前由偶像§Y[AFG_Matsuda_Arisa.GetName]§!领导。\n£faction_AFG_zveno §Y闪耀激进派§!将会拉拢偶像军官们加入其组织，假以时日，其甚至会阴谋政变并建立军事独裁政权。"
 AFG_blue_TOOLTIP: "£faction_AFG_bs §Y温和偶像团§!是信奉社会民主主义的泛阶层联盟，目前由偶像§Y[AFG_Kosaka_Honoka.GetName]§!领导。\n£faction_AFG_bs §Y温和偶像团§!在产业工人阶级以及工会当中拥有着强大的影响力，若是其对政府不再忠诚，便将掀起声势浩大的罢工。"
 AFG_white_TOOLTIP: "£faction_AFG_bzns §Y摩登军§!是一支反对旧帝国黑暗统治，从旧帝国脱离的自由军事集团，目前由军官§Y唐纳德·摩登§!领导。\n£faction_AFG_bzns §Y摩登军§!大多数时候不参与美浦的政治倾轧，但一旦其利益受损，可能在军队的战斗力上产生严重后果。"
 AFG_red_TOOLTIP: "£faction_AFG_nsm §Y特雷森左翼§!是由深受北方特雷森革命启发的马娘所创建的左翼组织，目前由马娘§Y[UMA_Satono_Diamond.GetName]§!领导。\n£faction_AFG_nsm §Y特雷森左翼§!将会试图通过煽动组织民众在全国发起罢工、游行示威的方式争取支持率。若是其认为实力足够，将会尝试鼓动民众、地区独立。"
 AFG_LOYALTY_TOOLTIP: "§Y合作意向§!反映着各派系与政府合作的意愿。\n§Y合作意向§!越高，派系对抗政府的可能性就越小。\n在将某个派系整合进政府之前，有必要通过若干决议拉拢其成员效忠政府，并将其§Y合作意向§!提升至100。"
 AFG_POPULARITY_TOOLTIP: "§Y民间影响§!反映着各派系在美浦地区的支持度。\n§Y民间影响§!越高，派系对政府的政治诉求就会越强硬。\n不要让某个派系的§Y民间影响§!过高，以防止其提出政府不可能完成的政治诉求。"
 AFG_POWER_TOOLTIP: "§Y势力强度§!反映着各派系掌控军队实力的大小。\n§Y势力强度§!越高，派系也将越有可能武力对抗政府。\n在摧毁某个派系前，有必要通过若干决议对其进行弱化，并将其§Y势力强度§!降低至0。"
