 AFG_Shijou_Takane_desc: "§Y四条贵音§!是一位充满神秘色彩的领袖。关于她的一切都只有传闻。其中包括，她参加过1918年的特雷森起义，和曾有一位名为拉斯普京的魔术师传授其魔法。\n\n三年前，在美浦州因饥荒而陷入最黑暗的混乱时，她通过一系列堪称教科书级别的政治博弈，和神秘的§Y“闪耀力量”§!，获得了美浦国民联盟和摩登军的支持,推翻了美浦军政府而上台。\n\n如今，美浦境内局势危如累卵，北方的特雷森数次在瓦罕地区挑衅，西方的栗东态度暧昧，东南的艾恩格朗特一直没有放弃拓展其影响力。这是挑战，也是美浦重回世界的机遇。"
