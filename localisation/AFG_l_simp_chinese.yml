 AFG_Army_1: "征召民兵"
 AFG_Army_1_desc: "所有公民都需要进行军事训练，以成为民兵预备役。"
 AFG_Army_2: "武装乡村"
 AFG_Army_2_desc: "指望御敌国境线外是痴心妄想，我们必须武装乡村，让游击队承担部分防御压力。"
 AFG_Army_3: "构筑街垒"
 AFG_Army_3_desc: "我们需要设置街垒，让每一个街道，每一处区域，都成为敌方的坟场。"
 AFG_Industry_1: "征收工厂"
 AFG_Industry_3: "民间工坊"
 AFG_Industry_1_desc: "面对战争风险，我们需要将民间的工厂征收，统一调度。"
 AFG_Industry_2: "配给制度"
 AFG_Industry_3_desc: "将大量武器制造转移到民间工坊之中，我们可以节省出不少的工厂产能。"
 AFG_Industry_2_desc: "我们要对所有的资源精打细算，实行配给制度。"
 AFG_Politics_2: "国家紧急状态"
 AFG_Politics_1: "采购武器"
 AFG_Politics_2_desc: "战争的阴云越来越近，我们不得不宣布国家进入紧急状态。"
 AFG_Politics_1_desc: "我们可以向外国请求武器采购，以武装我们的部队。"

