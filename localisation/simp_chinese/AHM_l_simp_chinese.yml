l_simp_chinese:
  ahm_economy.1.a:0 "我知道了"
  ahm_economy.1.d:0 "制作组国家（AHM）已从世界地图上消失。模组依赖该国家调度部分全局系统，此后部分经济结算和数据刷新将无法正常触发。请读取 AHM 尚存在的存档，或重新开始游戏。"
  ahm_economy.1.t:0 "制作组国家已消失"
  AHM_core_impassable_state_262:0 "同步无法进入地区核心（[262.GetName]）"
  AHM_core_impassable_state_262_desc:0 "当[262.GetName]的拥有者尚未拥有该地区核心，但拥有其相邻任意地区核心时，为其拥有者补充该地区核心。"
