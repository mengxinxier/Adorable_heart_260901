l_simp_chinese:
  LOADING_TIP_0: "“莫斯科不相信眼泪，就算流泪也不会改变失败的事实”\n- 喀秋莎"
  LOADING_TIP_1: "如果全世界都否定你的话，那么我就要超过他们更加的肯定你!\n- 五河士道"
  LOADING_TIP_2: "会站起来的，为了你的话，即使千百次也会站起来。\n- 时崎狂三"
  LOADING_TIP_3: "“伟大战争”的胜利消灭了所有能与圣杯王国匹敌的力量，但同时世界已被这场浩劫毁灭的满目疮痍。国王阿尔托莉雅认为自己应对这场浩劫有着难以推卸的责任。这位国王主动下放了自己的权利，希望自己余生的修行可以为之赎罪\n- 圣杯摄政会成立"
  LOADING_TIP_4: "我没能拯救我的国家，我亲手将它推入了深渊。我虔诚祈求上帝宽恕我罪恶的灵魂\n- 阿尔托莉雅·潘德雷根"
  LOADING_TIP_5: "现在，没有任何担心的理由，这一繁荣的高潮将会继续下去。\n- 夏洛特·麦克唐纳 1936"
  LOADING_TIP_6: "圣杯王国是世界上最强大的国家。"
  LOADING_TIP_7: "只要主权国家持有强大的武力，战争就无法避免。\n- 阿尔伯特·爱因斯坦"
  LOADING_TIP_8: "明明想要杀死某种生物，却没有做好被杀死的觉悟，你不觉得这种心态很奇怪吗？所谓的将枪口对准生命，就是这么一回事哟！\n- 时崎狂三"
  LOADING_TIP_9: "历史表明没有无敌的军队，从来没有。\n- 索尼娅·凛冬"
  LOADING_TIP_10: "这不是和平，这是二十年的休战。\n- 东风谷早苗 1919《人间之里合约》"
  LOADING_TIP_11: "	其实我不想做到这种地步......可是，如果不战斗的话，敌人就会伤害到我们......！\n- 拉达"
  LOADING_TIP_12: "我们需要的，不是一块面包！而是一个生存空间！一个民族的生存空间！这生存空间，不是靠乞求和抗议来实现的，而是靠铁和血来实现的！\n- 阿道夫·莉莎"
  LOADING_TIP_13: "任何不以开战为目的的盟友都是愚蠢而无用的。\n- 阿道夫·莉莎"
  LOADING_TIP_14: "伟大的骗子同时也是伟大的魔术师。\n- 阿道夫·莉莎"
  LOADING_TIP_15: "如果今天我得作为一个革命者站在这里，那这就是一场针对这场革命的革命。\n- 阿道夫·莉莎"
  LOADING_TIP_16: "我们赢得了胜利，却无法赢得战争。\n- 海因茨·古德里安"
  LOADING_TIP_17: "源萃取石的发现历史已久，其蕴含着惊人的能量，但是鲜有人能对其加以利用"
  LOADING_TIP_18: "幻想乡更应该依靠自己，而不是轻易相信别人\n- 博丽灵梦"
  LOADING_TIP_19: "在所有堡垒和要塞掌握在我们手中之前，在木之本樱的最后一名士兵从索米和东卡累利阿离开之前，绝不收剑入鞘！ \n- 《剑鞘宣言》"
  LOADING_TIP_20: "献给我的儿子：自从你的双眼闭上，我的双眼就没有停止哭泣 \n- 无名烈士母亲"
  LOADING_TIP_21: "升官发财请往他处，贪生怕死勿入斯门。\n- 黄埔军校正门对联"
  LOADING_TIP_22: "反抗命运，不是那么容易的，但正因如此，反抗命运才会有价值，成就目标才会有意义。\n- 《舰队Collection》"
  LOADING_TIP_23: "没有哪个杂种会因为誓死为国赢得一场战争。他通过让别的可怜的傻杂种为国捐躯来获胜。\n- 夜刀神十香"
  LOADING_TIP_24: "敌进我退、敌驻我扰、敌疲我打、敌退我追\n- 毛润芝"
  LOADING_TIP_25: "我认为克服恐惧最好的办法理应是：面对内心所恐惧的事情，勇往直前地去做，直到成功为止。 。\n- 时崎狂三"
  LOADING_TIP_26: "青年应当接替我们老年人。青年应当举起我们的旗帜直到胜利的终点 \n- 列宁"
  LOADING_TIP_27: "幻想乡是迄今为止人类与妖族关系协调最好的国家 \n- 幻想乡事迹"
  LOADING_TIP_28: "战斗的那个人我不想她有任何的名字。因为我们每一个人都在战斗，我们所有人都是斗士。\n- 塔露拉"
  LOADING_TIP_29: "西奥多，这是海因里希。刚打下两架轰炸机。没有弹药了。我要撞过去了。再见，英灵殿再会！\n- 海因里希·埃尔勒, 纳粹德国空军"
  LOADING_TIP_30: "一旦战争同圣杯爆发战争，我们的水面舰队只能是英勇的去赴死\n- 卡尔·邓尼茨"
  LOADING_TIP_31: "各种勃勃生机，万物竞发的境界尤在眼前。\n- 蒋介石"
  LOADING_TIP_32: "我有三十万东北军怕他球的小樱花？\n- 张作玲"
  LOADING_TIP_33: "你们这群人真的这么渴望圣杯吗？在地狱滚烫的岩浆里，你们必将感受到我迪卢木多的诅咒！\n- 迪卢木多"
  LOADING_TIP_34: "王来承认，王来允许，王来背负整个世界。\n- 吉尔伽美什"
  LOADING_TIP_35: "为了姐姐，我要变得比任何人都强！ \n- 涅普姬雅"
  LOADING_TIP_36: "伟大的斯洛卡伊万岁\n- 三勇教"
  LOADING_TIP_37: "流汗不流血，流血不丢命，但是有脑子可以同时做到。\n- 埃尔温·隆美尔"
  LOADING_TIP_38: "不过傲慢分为两种。一种是能力过于低下，还有一种是志向异常远大的。前者显得非常愚蠢，后者是难得一见的珍贵种类。\n- 吉尔伽美什"
  LOADING_TIP_39: "博丽大结界明明是为了保护妖精们，为什么一开始还会有那么多妖精反对呢？" 
  LOADING_TIP_40: "去在拂晓的水平线上刻下胜利！\n-樱花舰队"
  LOADING_TIP_41: "你们之中若是有外星人、未来人、异世界人、超能力者的话，就尽管来找我吧。以上！\n- 凉宫春日"
  LOADING_TIP_42: "§R接受我的，接受我的一切吧！§!\n- 夏娜"
  LOADING_TIP_43: "柏林！柏林！\n- 阿道夫·莉莎"
  LOADING_TIP_44: "我舰遭受鱼雷袭击，各舰不要管我，继续前进，攻击敌人！\n- 莱特湾海战中西村中将在山城号上的最后一条命令"
  LOADING_TIP_45: "士兵比任何人都渴望和平，因为正是他们必须忍受和忍耐战争带来的最大伤痛。\n- 夜刀神十香" 
  LOADING_TIP_46: "通过流血的抗争从被奴役的黑暗中得到自由的金色光芒\n- 阿道夫·莉莎"
  LOADING_TIP_47: "一步也不许后退！\n- 苏联第227号命令"
  LOADING_TIP_48: "虎！虎！虎！\n- 渊田美津雄，1941年12月7日"
  LOADING_TIP_49: "沉睡的雄狮一旦觉醒必将震彻世界\n- 莫德雷德"
  LOADING_TIP_50: "又要…离开了呢。全员…上…甲板…。武藏、信浓，后面的事交给你们了……。\n- 大和号战列舰沉没于菊水作战"
  LOADING_TIP_51: "战况发展到了对日本并不一定有利的局面。\n- 昭和天皇, 1945"
  LOADING_TIP_52: "无数樱花飘落，只为那一次升阳\n- 冲田总司"
  LOADING_TIP_53: "那些视死如归的拥趸，尝试破坏着任何胆敢阻挡的人，默念着领导他们的那个名字——“塔露拉”。" 
  LOADING_TIP_54: "战争不是随机的，是必然的\n- 阿道夫·莉莎"
  LOADING_TIP_55: "隐藏着黑暗力量的钥匙啊,在我面前显示你真正的力量！现在以你的主人小樱之名命令你——封印解除！\n- 木之本樱" 
  LOADING_TIP_56: "你的名字无人知晓，你的功绩永世长存。\n- 莫斯科无名烈士墓"
  LOADING_TIP_57: "莱茵演习作战啊，俾斯麦的唯一一战……很怀念呢。\n- 俾斯麦号战列舰"
  LOADING_TIP_58: "就算一切徒劳无功，就算结果不过如此，我仍然选择我自己认为最好的决定\n- 吉田一美"
  LOADING_TIP_59: "那些轻言战争的人们...真的做好了付出代价的准备了吗？\n- 长门" 
  LOADING_TIP_60: "王者的誓言是不能破坏的，我有自己不得不去完成的使命，我的愿望从一开始就只有一个，从我拔剑之时开始，这份誓言就永远不会改变。\n- 阿尔托莉雅·潘德雷根"
  LOADING_TIP_61: "获得拯救的人们脸上的表情，吾永远不会忘记...那才是吾想要保护的东西\n- 长门" 
  LOADING_TIP_62: "如果子弹结束了我们的生命， 如果我们在劫难逃， 那至少我们忠实的坦克， 会给我们一个金属的坟墓\n- 德国装甲师战歌"
  LOADING_TIP_63: "女神大人的意志，谁都不能违背\n- 阿库娅"
  LOADING_TIP_64: "没有良好的后勤，再厉害的舰队也只是乌合之众！\n- 三笠" 
  LOADING_TIP_65: "生老病死，天地万象，尽在吾辈。\n --胡桃" 
  LOADING_TIP_66: "优势在我！\n- 蒋介石"
  LOADING_TIP_67: "一寸山河一寸血，十万青年十万军。\n- 蒋介石"
  LOADING_TIP_68: "一起为了人类而战吧\n- 三笠与阿芙乐尔在一次联合行动中对话" 
  LOADING_TIP_69: "但愿...能迎来铸剑为犁的那天——...\n- 长门" 
  LOADING_TIP_70: "击沉，烧毁，俘获，摧毁。不要让任何东西通过。\n- 安德鲁·坎宁安, 突尼斯战役"
  LOADING_TIP_71: "地中海是意呆莉的，我们必须从英灵手中夺回来！\n- 阿库娅"
  LOADING_TIP_72: "历史，是由胜利者书写的。。\n- 圣杯王国"
  LOADING_TIP_73: "我们唯一的恐惧，就是恐惧本身\n- 时崎狂三"
  LOADING_TIP_74: "开始是结束的起点，结束后的重新开始。即使你忘记了，我也不会忘记你。无论重来多少次，我都会拯救你。为了救你，我愿意不论多少次去死。如果有一天世界否认你的存在，我就和你一起否认这个世界。"
  LOADING_TIP_75: "泪水划过母亲的脸庞，祖国就在身后\n- 喀秋莎"
  LOADING_TIP_76: "违背本心有否？言行不一有否？萎靡不振有否？惰懒懈怠有否？半途而废有否？\n- 海军五省"
  LOADING_TIP_77: "别了，我温柔的你。别了，我的骑士。别了，我在这世界上最重要的人。 \n- 露易丝·法兰西斯·露·布朗·杜·拉·瓦利埃尔" 
  LOADING_TIP_78: "“有死之荣，无生之辱”"
  LOADING_TIP_79: "给我20年，还你一个强大的瑞典。\n- 斯卡哈·斯卡蒂"
  LOADING_TIP_80: "市场中不存在一个能把私人利益转化为社会利益的看不见的手，经济危机和失业不可能消除，只有依靠看得见的手即政府对经济的全面干预，才能摆脱经济萧条和失业问题。\n- 约翰·梅纳德·凯恩斯 1936 于圣杯下议院的演讲"
  LOADING_TIP_81: "经验表明，一个足够坚定的人使用近战武器攻击坦克基本上总能成功。 \n- 德国陆军中央集团军群反坦克手册"
  LOADING_TIP_82: "睡觉可以没有床，饭也可以吃不饱，但我不想低头的时候，是绝对不会低头的。\n- 平贺 才人" 
  LOADING_TIP_83: "政治是不流血的战争，战争是流血的政治。\n- 毛润芝"
  LOADING_TIP_84: "存人失地，人地皆存；存地失人，人地皆失。\n- 毛润芝"
  LOADING_TIP_85: "我宁愿死在大罗马尼亚的沼泽中，也绝不活在小罗马尼亚的天堂里。\n- 奥尔加·伊兹卡"
  LOADING_TIP_86: "这样啊。就算是神社里的神变了，对于灵梦也没什么大影响是吗？\n- 雾雨魔理沙" 
  LOADING_TIP_87: "因为被结界包围起来的境界线本来是看不见的，所以看起来才会觉得有很多敌人\n- 博丽灵梦"
  LOADING_TIP_88: "看什么看。赶紧给我散场散场！幻想乡的和平由我来守护！\n- 博丽灵梦 东方求文口授"
  LOADING_TIP_89: "刚才开始就听你们在那随便瞎扯！你们这些人添了多少麻烦，让我来曝光！\n- 博丽灵梦 东方求文口授"
  LOADING_TIP_90: "诶？你们不知道吗？你们瞧，明明那么明显的\n- 东风谷早苗" 
 


