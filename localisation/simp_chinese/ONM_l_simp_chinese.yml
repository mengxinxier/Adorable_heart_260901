  onm_pol_9: "建立蛇之国度"
  onm_pol_9_desc: ""
  ONM_Repair_Project: "修复工程"
  ONM_Repair_Project_desc: "对平安京灵力中枢进行排查与修复，重新梳理紊乱的灵气脉络。"
  ONM_Purification_Magic_Circle: "净化法阵"
  ONM_Purification_Magic_Circle_desc: "在平安京重要节点布置大型灵气净化法阵，通过持续运转的阴阳术阵，过滤空气中混杂的邪祟之气，调和失衡的阴阳二气。"
  ONM_Reshaping_the_Spiritual_Vein: "重塑灵脉"
  ONM_Reshaping_the_Spiritual_Vein_desc: "大地深处纵横交错的灵脉，是一切灵力的源头。依靠蛇神的权能，我们着手重整境内灵脉走向，疏导四散灵力。稳定充盈的灵脉，将为帝国提供源源不断的灵力。"
  ONM_APATHETIC_OBSERVER: "供奉蛇神"
  ONM_APATHETIC_OBSERVER_desc: "源源不断的供奉物资汇入国库，充实帝国财政。"
  ONM_VENERATE_SERPENT_GOD: "安抚官员"
  ONM_VENERATE_SERPENT_GOD_desc: "帝国各级官吏是维持秩序的支柱。我们将推行安抚举措，稳固官僚阶层的人心。"
  ONM_VENERATE_SERPENT_GOD_unlock_tt: "解锁藤原道纲成为§Y副领袖§!的可能性"
  ONM_STRIKE_ONMYO_BUREAU: "打击阴阳寮"
  ONM_STRIKE_ONMYO_BUREAU_desc: "阴阳寮秉持自身的陈旧理念，拒不服从蛇神帝国的统治，是一股难以忽视的敌对势力。"
  ONM_SERPENT_GOD_WATCHES: "蛇神在注视"
  ONM_SERPENT_GOD_WATCHES_desc: "无数信徒响应号召，§R自愿§!拿起兵器投身军队。"
  ONM_TEMPTATION_AND_PROMISE: "诱惑与承诺"
  ONM_TEMPTATION_AND_PROMISE_desc: "诸多小妖保持中立，静观局势变化，不愿轻易投身蛇神麾下。我们将许下丰厚承诺拉拢这群观望者，"
  ONM_FORGIVENESS: "宽恕"
  ONM_FORGIVENESS_desc: "愿意放下武器、宣誓不再与帝国为敌者，皆可得到宽恕。"
  ONM_CORRUPTION: "腐化"
  ONM_CORRUPTION_desc: "世间唯有蛇神秩序为一，其余种种不过是分散的众相，他们终将舍弃旧日阴阳之道。"
  ONM_kill: "处刑"
  ONM_kill_desc: "残酷的处置将警示所有人，任何反抗蛇神统治的势力都将迎来严惩。"
  ONM_RULE_BY_FEAR: "神力威慑"
  ONM_RULE_BY_FEAR_desc: "心存抵触者在神威面前心生畏惧，敢于抗拒蛇神信仰的人不断减少。"
  ONM_RULE_BY_DESIRE: "拉拢大妖"
  ONM_RULE_BY_DESIRE_desc: "实力强大的大妖怪手握独立武装，始终游离在帝国核心体系之外。我们向大妖抛出橄榄枝，许诺给予相应地位，准许妖类派系编入帝国陆军作战序列。"
  ONM_HERALD_OF_SERPENT_GOD: "蛇神代言人"
  ONM_HERALD_OF_SERPENT_GOD_desc: "阴阳寮的旧势力已被彻底肃清，京都在沉默中等待新的秩序。如今，是时候选出一位蛇神代言人了。"
  ONM_HERALD_OF_SERPENT_GOD_tt: "完成该国策将确立一名§Y副领袖§!，国策§Y巫女之魂§!和§Y安抚官员§!将解锁更多§Y副领袖§!的人选。"
  ONM_ORDER_OF_THE_SERPENT: "蛇之秩序"
  ONM_ORDER_OF_THE_SERPENT_desc: ""
  ONM_SERPENT_PRIESTESS: "蛇之巫女"
  ONM_SERPENT_PRIESTESS_desc: ""
  ONM_INCARNATE_SHIKIGAMI: "化身式神"
  ONM_INCARNATE_SHIKIGAMI_desc: ""
  ONM_FUJIWARA_FAMILY: "藤原家族"
  ONM_FUJIWARA_FAMILY_desc: ""
  ONM_SERPENT_GODS_DOMINION: "蛇神统治"
  ONM_SERPENT_GODS_DOMINION_desc: "帝国境内各方势力尽数平定，阴阳寮的威胁已然消散。人族官吏、各路妖众尽数归于蛇神麾下，整片大地皆臣服于蛇神的意志！"
  ONM_OVERTHROW_THEOCRACY: "颠覆高天原"
  ONM_OVERTHROW_THEOCRACY_desc: "如今平安京已由我们掌管，但高天原的诸神必然不会袖手旁观……"
  ONM_APOSTLE_OF_GOD: "神之使徒"
  ONM_APOSTLE_OF_GOD_desc: "八岐大蛇神麾下的将官，他们是蛇神意志的化身，肩负着在凡世间扩张神威的使命。"
  trait_onm_god: "神之使徒"
  trait_onm_god_desc: "八岐大蛇神麾下的将官，他们是蛇神意志的化身，肩负着在凡世间扩张神威的使命。"
  trait_onm_god_navy: "神之使徒"
  trait_onm_god_navy_desc: "八岐大蛇神麾下的将官，他们是蛇神意志的化身，肩负着在凡世间扩张神威的使命。"
  ONM_GODS_KIN: "神之眷属"
  ONM_GODS_KIN_desc: "平安京的一切生灵皆为八岐大蛇神的眷属。"
  ONM_SERPENT_GOD_FAITH: "神之信仰"
  ONM_SERPENT_GOD_FAITH_desc: "天地万物皆因八岐大蛇神而生，亦因祂的意志而存。"
  ONM_SERPENT_GOD_ERA: "蛇神纪元"
  ONM_SERPENT_GOD_ERA_desc: ""
  ONM_Establish_Oracle_Agency: "建立神谕机关"
  ONM_Establish_Oracle_Agency_desc: "八岐大蛇神以神格之威庇佑万民。若能得与蛇神交好的诸神垂佑，则[ROOT.GetName]之基必愈加稳固，神威之势必愈加隆盛。"
  ONM_Spread_Great_Serpent_Totem: "扩大神谕机关"
  ONM_Spread_Great_Serpent_Totem_desc: "目前看来，神谕机关运作成效良好。鉴于其在政府治理中的积极作用，我们不妨适度增加拨款，以进一步强化其作为政府机构的职能。"
  ONM_Communicate_With_Serpent_God: "阴界之门"
  ONM_Communicate_With_Serpent_God_desc: ""
  ONM_Establish_Intelligence_Agency: "建立情报机构"
  ONM_Establish_Intelligence_Agency_desc: "我们需要一支情报力量搜集列国动向和监视境内异己势力。帝国将组建直属中枢的情报机构，编织遍布各处的情报网络，为帝国扩张扫清潜在阻碍。"
  ONM_Fusion_of_Ritual_and_Espionage: "祭祀与谍报结合"
  ONM_Fusion_of_Ritual_and_Espionage_desc: "遍布各地的祭祀场所，是极佳的掩护，我们将谍报活动与祭祀仪式融为一体。"
  ONM_Serpent_Eye: "蛇瞳"
  ONM_Serpent_Eye_desc: "如同蛇神无处不在的竖瞳，紧盯世间一切威胁帝国的暗流。"
  ONM_Serpent_Shadow: "蛇影"
  ONM_Serpent_Shadow_desc: ""
  ONM_Serpent_Scale: "蛇鳞"
  ONM_Serpent_Scale_desc: "蛇鳞是帝国无形的屏障。他们重点清查潜伏的奸细、瓦解外部渗透，抵御一切试图从暗处瓦解帝国的阴谋。"
  ONM_Dual_Methods: "密码部门"
  ONM_Dual_Methods_desc: "谍报网络持续扩张，往来秘密讯息数量日渐繁多，一套可靠的保密体系必不可少。"
  ONM_bop_1: "储备力量"
  ONM_bop_1_desc: ""
  ONM_bop_2: "巩固信徒"
  ONM_bop_2_desc: ""
  ONM_bop_3: "求助盟友"
  ONM_bop_3_desc: ""
  ONM_In_the_Moment_of_Slumber: "重启审判"
  ONM_In_the_Moment_of_Slumber_desc: "为了建立那美妙无比的只属于罪恶的世界，我从来都不曾放弃过颠覆高天原，即使身处狭间，也早有计划。源氏日渐没落，也日渐贪婪，祭品巫女的力量解放了狭间封印。如今，真正禁锢着我的早已不是封印和结界，而是那柄贯穿我身的天羽羽斩。若能再次开启高天原的审判，这把刑具定能解放。而这一次，“审判者”自然是我，蛇魔们早已侵染了京都和铃鹿山，从各地为我汲取充沛的灵力。虽然想找到神格不亚于须佐之男的强大“处刑者”并非易事。不过，我心中的处刑者已有了人选。但唯独有一件东西，难以找到，那就是比我更罪大恶极的“罪人”。"
  ONM_In_the_Dreams_of_the_Dreamer: "云外镜黑镜"
  ONM_In_the_Dreams_of_the_Dreamer_desc: "云外镜·黑镜的碎片将被植入各地，为我映照众生罪恶，作为审判的对象。而云外镜·黑镜的本体，则将投射出高天原的审判场，正中那巨大的天平，和当年一模一样，留出了为审判者准备的空席。"
  ONM_In_the_Dreams_of_the_Dreamer_tt: "获得云外镜黑镜，以投射出高天原的审判场，映照§Y众生罪恶§!。"
  ONM_The_One_Dreamed_of_Is_Also_Awakening: "与破坏神阿修罗合作"
  ONM_The_One_Dreamed_of_Is_Also_Awakening_desc: "阿修罗成为“破坏神”后，神格会不断侵蚀其心智。而神器・天羽羽斩能斩断神格、暂时压制恶念。我想，他会很乐意担任这位处刑者。"
  ONM_pol_16: "裁决"
  ONM_pol_16_desc: "“我为诸位谱写了如此精美绝伦的剧本，又如何能不亲自裁决。”"
  onm_pol_16_tt: "完成§Y终焉裁决§!系列决议后，游戏将进入§Y终局§!。"
