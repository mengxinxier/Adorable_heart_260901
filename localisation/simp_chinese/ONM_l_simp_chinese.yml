  ONM_navy_ui_Array_tt: "第[?ONM.ONM_navy_ui_roll_dice_Index_Array^i]次投掷   出目[?v]   结果值[?ONM.ONM_navy_ui_roll_dice_2_Array^i]   获得探险成果[?ONM.ONM_navy_ui_roll_dice_result_Array^i]"
  ONM_navy_on_going: "探险行动进行中"
  ONM_navy_roll_dice_tt: "投掷一枚十面骰子，计算结果值"
  ONM_navy_start: "启航"
