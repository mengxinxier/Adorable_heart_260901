##### 黄金爪号探险行动 #####
  ONM_navy: "黄金爪号探险行动"
  ONM_navy_ui_desc_tt: "派出黄金爪号进行探险行动，以期获得§Y远航宝藏§!。\n§Y兑换远航宝藏§!决议可以消耗§Y远航宝藏§!兑换种种奖励。\n点击启航开始探险，要想完成探险行动，需要达到14§Y结果值§!。探险开始时，激活一个自循环的§Y探险行动进行中§!决议，效果为投掷一枚十面骰子，出目会与§Y黄金爪号加成§!和§Y已获得探险成果§!相加，随后减去§Y探险难度§!作为§Y结果值§!。\n根据§Y结果值§!的不同，存在四种情形：\n§R一无所获§!：结果值小于或等于§Y5§!。\n§Y小有成果§!：结果值介于§Y6-10§!之间，获得探险成果§Y1§!点。\n§Y取得进展§!：结果值介于§Y11-13§!之间，获得探险成果§Y2§!点。\n§G探险完成§!：结果值大于或等于§Y14§!，探险完成。"
  Get_ONM_navy_ui_phase_tt_0: "当前状态：靠港"
  Get_ONM_navy_ui_phase_tt_1: "当前状态：启航"
  Get_ONM_navy_ui_weather_tt_0: "当前天气：§Y晴天§!"
  Get_ONM_navy_ui_weather_tt_1: "当前天气：§Y大雾§!"
