  ONM_pol_shortcut: "政治"
  ONM_pol_shortcut_1: "政治：八岐大蛇"
  ONM_army_shortcut: "陆军"
  ONM_navy_shortcut: "海军"
  ONM_air_shortcut: "空军"
  onm_pol_1: "平安时代"
  onm_pol_1_desc: ""
  onm_pol_2: "八岐大蛇"
  onm_pol_2_desc: "世人总以为狭间是太阳女神天照的牢狱，终年无光黑暗，其实并非如此。日光虽不造访，但月光偶尔也会流淌进这阴气深重的禁地，照亮无数埋葬在这里的秘密。虽被封印在狭间缝隙之中，八岐大蛇不甘言败，而是不停地以巨蛇之躯冲击封印，试图脱离。封印的力量日渐衰微，如今，封印破除的机会近在眼前了。"
  onm_pol_2_tt: "启动八岐大蛇的§Y封印破除§!进程。\n§L采取行动将封印完整度降低至0以破除封印。§! "
  onm_pol_3: "与源氏阴阳师合作"
  onm_pol_3_desc: "源氏看管着封印邪神的禁地，世代训诚绝不可放出邪神，既然谁也不肯为我打开狭间之门，那就反其道而行。「进奉灵力强大的巫女，我将保平安京繁荣，源氏长威不衰。」"
  ONM_cooperate_with_Genji_tt: "§Y封印破除后§!，获得以下民族精神：（此效果将会叠加）"
  onm_pol_4: "与源赖光的交易"
  onm_pol_4_desc: "那天突然出现在我面前的源氏阴阳师，名叫源赖光。他的眼神里充满野心和阴谋，就像熊熊燃烧的火焰，却不知道那火焰正在将他自己消耗殆尽。"
  onm_pol_5: "巫女之魂"
  onm_pol_5_desc: "由祭品巫女的鬼魂、怨念和一些腐烂的残肢融合成一团污秽的东西，在祭坛上挣扎、扭动着。终于，那东西化形成了八头八尾的巨蛇。"
  onm_pol_5_unlock_tt: "解锁巫女之魂成为§Y副领袖§!的可能性"
  onm_pol_6: "团结民众"
  onm_pol_6_desc: "部分民众对阴阳寮的不满情绪由来已久，我们可以在暗中推波助澜……"
  onm_pol_7: "秘密破坏"
  onm_pol_7_desc: "暗中组织试图破坏阴阳寮权威的人，并为其指条明路。"
  onm_pol_8: "制造阴界裂隙"
  onm_pol_8_desc: "通过扩大狭间与现世的连结，我们得以将手伸向更广阔的地区。"
  onm_pol_10: "大江山"
