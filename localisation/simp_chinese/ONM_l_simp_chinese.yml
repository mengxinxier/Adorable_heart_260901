  Get_ONM_navy_ui_weather_tt_4: "当前天气"
  Get_ONM_navy_ui_chance_tt_0: "探险成功几率"
  Get_ONM_navy_ui_chance_tt_1: "探险成功几率：§Y[?ONM.ONM_navy_ui_chance|%.0]§!"
  Get_ONM_navy_ui_diff_tt_0: "探险难度"
  Get_ONM_navy_ui_diff_tt_1: "探险难度：§R[?ONM.ONM_navy_ui_diff]§!"
  ONM_navy_ui_buff_tt: "黄金爪号加成：§G[?ONM.ONM_navy_ui_buff]§!"
  Get_ONM_navy_ui_result_tt_0: "已获得探险成果"
