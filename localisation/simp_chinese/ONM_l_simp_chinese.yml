  ONM_Yamata-no-Orochi_Seal_desc: "世人总以为狭间是太阳女神天照的牢狱，终年无光黑暗，其实并非如此。日光虽不造访，但月光偶尔也会流淌进这阴气深重的禁地，照亮无数埋葬在这里的秘密。虽被封印在狭间缝隙之中，八岐大蛇不甘言败，而是不停地以巨蛇之躯冲击封印，试图脱离。封印的力量日渐衰微，如今，封印破除的机会近在眼前了。\n\n§L采取行动将封印完整度降低至0以破除封印。§!                    §L封印完整度:§!"
