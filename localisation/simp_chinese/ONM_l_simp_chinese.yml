#####  地牢  #####
  ONM_dnd_readme: "在地牢冒险中，你会遭遇种种事物并与之互动。大部分事物都有等级，代表它的危险程度。要想对其造成影响（比如攻击），你必须至少投出等于其等级的数值。要想避免被其影响（比如防御），你必须至少投出大于其等级的数值。"
  ONM_dnd_player_dead: "§R冒险者因此死亡§!"
  ONM_dnd_player_dead_tt: "§R死亡§!"
  ONM_dnd_Warrior_tt: "战士"
  ONM_dnd_Warrior_tt_delayed: "特性:战士总是将其等级数值加总到攻击投掷中。\n\n起始装备:盾牌（防御投掷+1）、单持武器。\n\n生命值上限:6+等级数值。一名等级1的战士拥有7点生命值上限。"
  ONM_dnd_Cleric_tt: "牧师"
  ONM_dnd_Cleric_tt_delayed: "特性:牧师总是将其等级数值的一半(向下取整)加总到攻击投掷中。\n\n法术:牧师在每次冒险中可以分别施放祝福术和治愈术各至多3次。祝福术移除一名小队成员的负面状态，比如诅咒或石化效果。治愈术治疗d6+LV（等级数值）的生命值。\n\n起始装备:轻型单持武器。\n\n生命值上限:4+LV。"
  ONM_dnd_Rogue_tt: "盗贼"
  ONM_dnd_Rogue_tt_delayed: "特性:盗贼总是将其等级数值加总到解除陷阱和防御投掷中。只有在攻击敌寡我众的低级怪物，即小队人数超过低级怪物的个数时，才会将其等级数值加总到攻击投掷中。这代表着盗贼潜伏至敌人身后，对它们施以正义的背刺。\n\n只可用轻型单持武器。\n\n只可用轻型护甲。\n\n起始装备:轻型单持武器(攻击投掷-1)。\n\n生命值上限:3+LV。"
  ONM_dnd_Wizard_tt: "阴阳师"
  ONM_dnd_Wizard_tt_delayed: "特性:阴阳师只有在使用法术进行攻击时(包括通过卷轴施放的法术)才将其等级数值加总到投掷中。\n\n禁用盾牌和护甲。\n\n只可用轻型单持武器。\n\n法术:阴阳师在一次冒险中可以施放2+LV个法术，等级1的阴阳师至多可以施放3个法术。阴阳师必须在开始冒险前决定其准备的法术。他可以准备多个同种法术，或若干个不同法术的组合。阴阳师可以在冒险中发现法术卷轴并使用（使用卷轴不计入施法限制）。\n\n起始装备:轻型单持武器(攻击投掷-1)。\n\n生命值上限:2+等级数值。"
  ONM_dnd_Barbarian_tt: "狂战士"
  ONM_dnd_Barbarian_tt_delayed: "特性:狂战士总是将其等级数值加总到攻击投掷中。他不能使用魔法物品，卷轴及药水。他可以使用非魔法治疗(绷带)。他可以接受牧师的治愈术，因为严格意义上来说该能力不是魔法，而是神之加护，因此他也能使用圣水。\n\n狂战士可以在每次冒险中进行若干次狂怒攻击，狂怒攻击次数等于1+其等级数值的1/2(向下取整)。因此在2级时可以进行2次狂怒攻击，而在4级时可以进行3次。在一次狂怒攻击中，投掷攻击骰子(d6)三次,选择其中最好的结果。如果命中(命中指攻击投掷成功)，则将对怪物造成双倍伤害。\n\n起始装备:单持武器。\n\n生命值上限:7+等级数值。"
  ONM_dnd_Elf_tt: "精灵"
  ONM_dnd_Elf_tt_delayed: "特性:精灵将其等级数值加总到弓箭攻击投掷中。同阴阳师一样,精灵总是将其等级数值加总到施法投掷中(包括通过卷轴施放的法术)。\n\n法术:精灵在每次冒险中可以施放其等级数值次数的法术。精灵必须在开始冒险前决定其准备的法术。他可以准备多个同种法术，或若干个不同法术的组合。阴阳师可以在冒险中发现法术卷轴并使用（使用卷轴不计入施法限制）。\n\n起始装备:弓箭(在战斗开始时进行一次额外的攻击)。\n\n禁用重型护甲。\n\n只可用弓箭（双持）。\n\n生命值上限:4+等级数值。"
  ONM_dnd_player_choose_confirm_tt: "已选择的冒险者： [?onm_dnd_players^num] / 4 "
  ONM_dnd_spell_confirm: "阴阳师需要准备的法术数目为： [?onm_yys_spells] \n\n 当前已准备的法术数目为： [?onm_dnd_spells_yys_total]"
  ONM_dnd_spell_confirm_elf: "精灵需要准备的法术数目为： [?onm_elf_spells] \n\n 当前已准备的法术数目为： [?onm_dnd_spells_elf_total]"
  ONM_dnd_elf_spells_left_5: "防护术x[?onm_dnd_spells_elf^4]"
  ONM_dnd_elf_spells_left_4: "逃脱术x[?onm_dnd_spells_elf^3]"
