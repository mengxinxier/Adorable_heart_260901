###### 事件 #####
  onm_pol.1.t: "平安京"
  onm_pol.1.d: "传说在千年以前，在一场由高天原发起的审判中，八岐大蛇被打入与世隔绝的狭间永世囚禁。\n为镇压邪神，守护人世，据传须佐之男曾谴镇墓兽前往人间。被派来下凡看守狭间的镇墓兽，招来数名人类于座下说道 。\n「听从神意，吾为你们带来高天原镇压邪神的法朮。用此术可与妖鬼搏斗，待到妖鬼退居他处之后，可在此建立结界，定期举行封印仪式，便能代代平安。」这种既不借用神力，也不使用妖力，而是利用人类自身的灵力与邪恶对抗的法术，被后世称为——阴阳朮 。\n驱使阴阳朮的人类中很快出现了四位灵力强大的领袖，他们带领众阴阳师组建了讨伐八岐大蛇的军队，在狭间上建立了巨大的结界，以镇邪神。\n这片镇压邪神的土地，在千年后成为了繁威的人世之城——平安京 。\n而这四名镇压了八岐大蛇的人类，就是最初的阴阳师。\n四名阴阳师中的三人在此定居，广纳门徒，传授后人阴阳朮之法，其后世子孙与门徒形成了平安京后世的三大家族——贺茂氏、源氏、藤原氏 。\n此后，由源氏看管着封印邪神的禁地，世代训诚绝不可放出邪神。"
  onm_pol.1.a: "了解"
  onm_pol.1.a_tt: "启用国策内嵌界面：§Y平安京陆军派系§!\n§L提示：该系统可在国策树界面查看。完成特定国策，或是花费政治点数和陆军经验可提升派系影响力。将鼠标悬停在其上以查看更多细节。§!"

  # onm_pol.2.t: "平安京的统御者"
  # onm_pol.2.d: "晴明天生拥有强大的灵力，被认为是阴阳道当之无愧的大师。晴明认为鬼类并非全是邪恶之辈，他倡导人类与鬼类和平相处，尊重彼此的生存空间。\n源氏家族现任家主为源赖光，一名实力强悍的阴阳师，带领着源氏家族快速崛起。他强调严格的社会秩序和等级划分，认为不同阶层的人应各司其职，各安其位。"
  # onm_pol.2.a: "了解"

  onm_pol.2.t: "平安京工业化"
  onm_pol.2.d: "平安京目前的农耕生产方式十分落后，老旧的生产模式束缚了大量人口。想要真正发展国力，唯一的出路就是发展第一产业生产力。通过提升生产效率，我们可以用更少的人手养活全国人口，把被束缚在土地上的劳动力彻底解放出来，投入工业建设。"
  onm_pol.2.a: "了解"
  onm_pol.2.a_tt: "启用决议组：§Y平安京工业化§!\n§L提示：完成特定工业国策可以提高§Y第一产业效率§!，降低生产每单位粮食所需要的劳动力，从而增加§Y粮食供给率修正§!\n完成特定工业国策可以提高§Y受教育劳动力§!比例，让过剩劳动力从事工业,从而增加§Y工业劳动力§!\n完成机床，工业和建筑技术的科技可以提高§Y工业效率§!，从而增加§Y工业水平修正§!§!"

  onm_pol.3.t: "与源氏阴阳师合作" 
  onm_pol.3.d: "源氏的阴阳师想要利用我的力量，为我修建了祭坛。\n我们达成了交易，源氏向我奉献祭品，作为交换，我赐给源氏我的力量。\n但是，我在意的并不是源氏的祭品。\n通过源氏的祭祀，我终于拥有了一只观察人间的眼睛。\n“人类，就像花期短暂的樱花一样，真脆弱啊。”\n“啊？”源氏的阴阳师惊恐地低下头，“您在和我说话吗，尊贵的蛇神大人？”\n“是啊，你们明明这么脆弱，却想要追求永恒，这可真是……”\n“这是我们的信念。”源氏的阴阳师毫无迟疑地回答我，“家族的繁荣就是我们的信念。”\n“……这可真是无知啊。”我看着那阴阳师单纯而坚定的眼睛，“……不过，你的那份无知，反而令人羡慕。”\n“您在说什么，蛇神大人？”\n“这个世界上，凡是有生命的东西，只要有开始，就会有结束，只有神例外。”像是自我提醒般的，“……只有神例外。”\n我看向狭间，是无边的黑暗。我要怎样才能穿过阴阳之间的界线，亲自去看看呢？"
  onm_pol.3.a: "§3凡人虽脆弱，但信念永恒。§!" 
  onm_pol.3.b: "§0凡人终将凋零，唯神永恒。§!" 

  onm_pol.4.t: "与源赖光的交易"
  onm_pol.4.d: "他年轻而桀骜的脸上，没有一丝畏惧，“尊贵的蛇神，我想请你赐给我，创造生命的力量。”\n“你想要拿那个力量，做什么呢？”\n“我想创造只属于自己的式神。我给你带来了新的祭品，尊贵的蛇神。”\n祭坛上锁着的年轻的巫女，因为恐惧全身都在颤抖。我能感受到从她身上散发出来的灵力，或许……可以用这灵力做一点什么。\n“我可以把那个力量赐给你。不过，这是有违阴阳之理的行为，只能创造出残缺的生命。”\n“残缺的生命吗？”年轻的脸上浮现出冷漠的笑容，“交易成立。”\n当我的力量进入巫女的身体，她因承受不住这份神力而悲鸣。\n她就像一朵樱花，凋谢了。"
  onm_pol.4.a: "§3残缺又如何？只要能为我所用……§!"
  onm_pol.4.b: "§0巫女的灵力……它会找到归宿的。§!"

  onm_pol.5.t: "巫女之魂"
  onm_pol.5.d: "“……还是化成了蛇的样子。”我看着那只巨蛇，“真可惜啊……你们灵魂中本来有许多美丽的东西，但现在却只剩下怨恨了。”\n“复仇……可恶的阴阳师……可恶！罪孽的京都……！”\n被当做力量的容器献祭的巫女，憎恨着阴阳师、憎恨着京都。她们内心产生的恐惧、怨恨变得越来越强，又因为承载了我的力量，她们无法保持自己原本的形态、变成了蛇的样子。\n“人类的欲望与罪孽孕育出来的怪物。你们既不是人类、也不是妖怪、更不是神……”\n“我是……我是……我是邪神八岐大蛇！！”巨蛇发出痛苦的吼叫，“我是八岐大蛇！我要向京都复仇……！”\n我盯着那只巨蛇，“连自我都舍弃了吗……”\n怪物发出含糊不清的叫声，隐没在祭坛的阴影中。\n打破阴阳界线的力量，在巨蛇体内孕育着。巨蛇崩坏时，就是我降临人间的机会。"
  onm_pol.5.a: "§3阴影正在逼近……§!" 
  onm_pol.5.b: "§0那一刻不会太久了。§!" 
  

  onm_pol.6.t: "阴影"
  onm_pol.6.d: "新月之夜，京都的空气中弥漫着不安。 \n民众接连报告，他们在梦中看见巨蛇的身影，或在夜半听到模糊的低语。 \n河川与井水泛起异样的涟漪，仿佛有阴影在水下蠢动。\n阴阳师们终于察觉到一个令人不安的事实：\n这并非单纯的怨灵作祟，而是某种更庞大、更古老的力量正在侵蚀阳界的秩序。"
  onm_pol.6.a: "这是八岐大蛇的阴谋。" 
  
  onm_pol.7.t: "蛇神降临"
  onm_pol.7.d: "月蚀之夜，京都的天空骤然暗沉，连星辰都被吞没。\n祭坛深处传来震耳欲聋的轰鸣，仿佛大地本身在哀号。\n百姓们惊恐地发现，梦境与现实已无法分辨：他们在梦中见到的巨蛇，如今正从阴影中缓缓浮现。\n八头八尾的庞然巨影在祭坛上扭动，怨恨与神力交织，撕裂了阴阳的界限。\n护符纷纷碎裂，结界如同纸张般被撕开。\n巫女们的残魂在蛇神的身躯中哀嚎，她们的痛苦化为力量，推动着封印的彻底崩解。"
  onm_pol.7.a: "§0八岐大蛇，降临这个世界！§!" #切换国策树：八岐大蛇 获得idea 社会动荡 阴阳失衡

  onm_get_300_hcp: "§Y300单位§!的£hcp_small 加入§Y国家存款§!\n"
  onm_pol.8.t: "选择代言人"
  onm_pol.8.d: "阴阳寮的旧势力已被彻底肃清，京都在沉默中等待新的秩序。如今，是时候选出一位蛇神代言人，来统御人间、传递神意。候选者各自承载着不同的力量与宿命：\n那位巫女，曾是源氏献祭的牺牲者，如今怨念凝聚，化为蛇神的幽暗之声；\n八岐大蛇的化身式神，冷漠而威严，象征着蛇神本体的直接意志；\n藤原家族的阴阳师后裔，延续古老血脉，试图以人类的智慧与传统来代言神祇\n谁将成为这位冷漠而至高的蛇神的代言人？"
  onm_pol.8.a: "巫女"
  onm_pol.8.b: "化身式神"
  onm_pol.8.c: "藤原家族"




  # onm_pol.8.t: "激战"
  # onm_pol.8.d: "鬼武士的刀刃擦着晴明耳畔划过，带起几缕银发。他侧身躲过致命一击，感受着四周的灵气流动，脑海中回想起师父传授的阴阳术。当源赖光的攻击即将触及他时，他突然睁开眼，眼中闪过一道精光。\n\n“阴阳之道，在于平衡。你一味追求力量，早已偏离正道！”晴明大喝一声，双手结出一个前所未有的复杂印诀。天地间的灵气疯狂汇聚，形成一个巨大的阴阳鱼虚影。阴阳鱼缓缓转动，散发出柔和而强大的光芒。\n\n鬼武士和源赖光的攻击在阴阳鱼面前如同蚍蜉撼树，晴明操控阴阳鱼朝着源赖光压去。最终，阴阳鱼将他重重压在祭坛之上，他吐出一口鲜血，失去了反抗能力，鬼武士也随之消散。晴明顾不上理会倒地的源赖光，转身望向八岐大蛇，眼神坚定而决绝。他知道，真正的挑战才刚刚开始。"
  # onm_pol.8.a: "不管怎样，神乐安全了"
  # onm_pol.9.t: "解封"
  # onm_pol.9.d: "八岐大蛇的鳞片擦过天际，漆黑的蛇信垂落间掀起腥风血雨。它的尾鳍扫断祭坛石柱，裂缝如蛛网般在地面蔓延。不等众人反应，八岐大蛇猛地冲向天际，撕开一道空间裂缝。浓稠如墨的瘴气从裂缝中涌出，大蛇庞大的身躯迅速没入其中，只留下空中弥漫的腥臭味，和满目疮痍的战场。\n\n神乐缓缓苏醒，望着天空喃喃道：“它……走了？”晴明握紧拳头，眼神坚定：“八岐大蛇虽暂时逃脱，但只要我们还在，就绝不会让它危害平安京！”"
  # onm_pol.9.a: "蛇影遁，然劫云未散，暗潮汹涌"
  onm_pol.10.t:"平安京统御者"
  onm_pol.10.d:"源赖光的败北让源氏势力分崩离析，而八岐大蛇的逃脱在平安京上空笼罩着更浓的阴云。谁将领导平安京，应对八岐大蛇解封危机？"
  onm_pol.10.a:"神乐"
  onm_pol.10.b:"晴明"
  onm_pol.11.t:"神乐掌权之路"
  onm_pol.11.d:"神乐指尖划过掌心残留的通灵符文，第一次感受着体内涌动的强大力量。八岐大蛇逃脱后，平安京各方势力因源氏失势陷入权力真空，她深知，权力的真空往往比妖怪更危险————京都贵族觊觎阴阳寮的掌控权，残存的源氏旧部暗中谋划，甚至连一向中立的大阴阳师们，也在权衡新的依附对象。"
  onm_pol.11.a:"我该怎么做？"
  onm_pol.12.t:"晴明掌权之路"
  onm_pol.12.d:"晴明垂眸凝视掌心流转的灵力，八岐大蛇逃脱后，平安京各方势力因源氏失势陷入权力真空，他深知，权力的真空往往比妖怪更危险————京都贵族觊觎阴阳寮的掌控权，残存的源氏旧部暗中谋划，甚至连一向中立的大阴阳师们，也在权衡新的依附对象。"
  onm_pol.12.a:"我会守护好平安京"
  onm_pol.13.d:"“时辰已到。”源赖光的声音低沉而冰冷，在寂静的祭坛上空回荡。他缓缓走到祭坛中央，指尖蘸取特制的朱砂，在神乐额头画出扭曲的符咒。祭坛四周的青铜烛台渗出黑油，火苗在阴风里诡异地弯成蛇形————这是八岐大蛇即将回应召唤的征兆。\n\n地面剧烈震动，裂缝如蛛网般蔓延开来。八岐大蛇的虚影从裂缝中缓缓浮现，巨大的蛇身遮天蔽日，每一片鳞片都散发着令人胆寒的气息。它的八颗头颅同时发出震天的咆哮，声音中充满了对祭品的渴望。\n\n源赖光丝毫不惧，反而露出了得意的笑容。他加快念咒的速度，双手结出复杂的印诀。神乐被一股无形的力量托起，朝着八岐大蛇飞去。当神乐的身体消失在蛇口的那一刻，源赖光眼中闪过疯狂的光芒。他知道，自己精心策划的计划已经成功了大半，八岐大蛇即将被他掌控，源氏家族称霸平安京的时代即将到来。"
  onm_pol.13.a:"神乐……"
  onm_pol.14.d:"八岐大蛇吞下神乐后，那本该引爆灵力的符咒却如死灰般黯淡无光，祭坛的符文在大蛇威压下开始扭曲变形。源赖光瞳孔骤缩，“不可能！”\n\n八岐大蛇的竖瞳里映出源赖光扭曲的面容，八颗头颅同时发出震耳欲聋的嘲笑。它随意甩动尾鳍，源赖光精心布置的束缚符咒瞬间化作齑粉，祭坛四周的烛台也被震得粉碎。腥风扑面而来，源赖光踉跄后退，后背重重撞在祭坛石柱上。\n\n“渺小的虫子，也想算计神明？”八岐大蛇猛地冲向天际，撕开一道空间裂缝。浓稠如墨的瘴气从裂缝中涌出，大蛇庞大的身躯迅速没入其中，只留下空中弥漫的腥臭味和满目疮痍的祭坛。"
  onm_pol.15.t:"失败"
  onm_pol.15.d:"源赖光单膝跪在碎裂的祭坛上，指缝间的鲜血滴落在焦黑的土地上，宛如绽开的恶之花。八岐大蛇离去时掀起的风暴尚未平息，他却突然低笑出声————笑声越来越响，最后变成癫狂的嘶吼。"
  onm_pol.15.a:"失败？不，这只是第一步棋落错了子而已。"
  onm_pol.16.t: "重新封印八岐大蛇"
  onm_pol.16.d: "当八岐大蛇的八颗头颅再次仰天嘶吼，整片天空都被染成不祥的血红色。数百名阴阳师组成巨大的阵法，古老的咒语在平安京上空回荡。式神们化作流光穿梭于蛇躯之间，武士们的刀剑与大蛇的鳞片激烈碰撞。在众人齐心协力下，封印阵法迸发出耀眼光芒，八岐大蛇的嘶吼声逐渐减弱，庞大的身躯被缓缓拉入地下，最后只留下一道刻满符文的石阵，昭示着这场惊心动魄的战斗终于落下帷幕。"
  onm_pol.16.a: "平安京重归安宁"

  onm_pol.17.t: "蛇魔的袭击"
  onm_pol.17.d: "阴阳寮收到报告称，京都周边区域突发大规模破坏事件。幸存者目击到数十头身披鳞甲、目泛赤芒的妖物，这些妖物以利爪撕裂墙体，用毒液腐蚀民众，甚至强行吞噬了正在执行巡逻任务的武士小队。确凿证据表明此乃八岐大蛇爪牙————蛇魔发动的蓄谋破坏！"
  onm_pol.17.a: "真是一场灾难"

  onm_pol.18.d: "伪装成平民的八岐大蛇腐化者用某种方式将炸弹带到了居民区。他们在哨卡遇到安保人员时引爆了炸弹，对周围的环境造成了巨大的损害，造成的人员伤亡不计其数！"

  onm_pol.19.t: "军械库失窃"
  onm_pol.19.d: "平安京军械库发生失窃事件。当值巡查小队发现军械库大门完好无损，而军械库守卫却不知所踪。经阴阳术探测，仓库内残留浓烈的妖力痕迹。经清点，库内近百支制式步枪连同弹药不翼而飞。"
  onm_pol.19.a: "这是八岐大蛇策划的"

  onm_pol.20.t: "军官被腐化！"
  onm_pol.20.d: "前线军官被八岐大蛇腐化了。一连串的反常活动与异常行为报告引起了阴阳寮的注意，情报机构对军官展开内部调查，随后军官被处决了。调查显示他即将把军事机密传递出去，但他没能得逞。"
  onm_pol.20.a: "至少保住了军事情报"

  onm_pol.21.t: "封印余波"
  onm_pol.21.d: "八岐大蛇虽已被再度封印于地脉深处，但其垂死挣扎时释放的巨量灵力如同巨石投入平静湖面，在平安京掀起了远超预期的灾变涟漪。天地间阴阳二气剧烈碰撞，化作遮天蔽日的黑雾笼罩京都。平民们陷入了无尽的恐慌，商铺关门，街道空荡，骚乱与暴动在各个角落蔓延。\n\n值得注意的是，一道空间裂隙出现在封印仪式现场，它似乎是因阴阳失衡而撕裂的，通往未知领域的通道。"
  onm_pol.21.a: "我们必须尽快处置"
  onm_pol.22.t: "平安京新生"
  onm_pol.22.d: "晨雾初散时，第一缕阳光穿透了积郁多日的阴霾。街道的青石砖缝里，嫩绿的新芽倔强地探出，仿佛在宣告生命的不可阻挡。街道两侧，紧闭多日的商铺木门次第推开，“吱呀” 声惊起檐角的白鸽，扑棱棱飞向澄澈如洗的碧空。\n市集里此起彼伏的叫卖声重新响起，蔬果摊前的竹筐堆满了水灵灵的鲜货，布料铺的丝绸在风中轻轻翻飞。孩童追逐着纸鸢嬉笑奔跑，银铃般的笑声回荡在街巷，与小贩的吆喝声交织成欢快的乐章。街角茶馆蒸腾起袅袅茶香，老人们围坐在一起，谈论着那场惊心动魄的危机，脸上满是劫后余生的庆幸。\n城墙上斑驳的裂痕还残留着战斗的痕迹，却已有人在忙着修补。阴阳师们神色疲惫却眼神坚毅，在城中各处布下结界，金色的符文在空气中流转闪烁，为平安京构筑起新的守护屏障。武士们也整齐列队，步伐铿锵地巡逻街巷。\n夜幕降临，万家灯火亮起，照亮了平安京的每一个角落。曾经弥漫全城的黑雾早已消散，取而代之的是温暖而祥和的人间烟火。神社前的灯笼在风中轻轻摇曳，烛火明灭，仿佛在诉说着这座城市的重生与希望。历经磨难的平安京，正以崭新的姿态，迎接充满希望的明天。"
  onm_pol.22.a: "灯火重燃，平安再临。"
  onm_pol.23.t: "阴阳寮危机会议
  onm_pol.23.d: "京都的夜幕被闪电割裂，八岐大蛇脱困的嘶吼震碎天际，沉睡千年的凶兽再次苏醒，妖气如同瘟疫般迅速蔓延，平安京陷入前所未有的恐慌之中。\n\n晴明神色凝重，立即召集阴阳寮众人。庭院内，青竹灯笼在风中剧烈摇晃，发出令人不安的吱呀声。一众阴阳师和式神们围聚，气氛压抑得几乎能拧出水来。\n\n“八岐大蛇的解封绝非偶然，它的力量正在不断恢复，我们必须争分夺秒。”晴明目光如炬，扫视着众人，声音沉稳却透着不容置疑的坚定。他率先提出防御策略，委派源博雅带领武士与部分式神，在平安京的各个关键路口和要地，布置结界和陷阱。\n\n神乐主动请缨，运用她与自然沟通的能力，召集各地的式神和妖怪，让它们时刻关注八岐大蛇的动向，一旦有风吹草动，立即传回消息。\n\n另一边，八百比丘尼负责情报收集。八百比丘尼凭借自己对古老咒术和传说的了解，翻阅无数古籍，试图从尘封的历史中找到重新封印八岐大蛇的线索。"
  onm_pol.23.a: "齐心守护平安京！"
  onm_pol.24.t: "雨夜"
  onm_pol.24.d: "暴雨如注，平安京的夜幕被闪电撕裂，照亮了一场混战。队长鬼切将染血的长剑插入青石地面，看着最后一名黑帮成员瘫倒在泥泞中，雨水冲刷着他制服上的徽记。这场持续一个月的扫黑行动，终于在今夜迎来终局。\n\n“报告！地下赌场已控制，缴获黄金三十箱，火铳二十支！”队员踩着满地碎玻璃跑来，背后是被爆破炸开的暗门。队长眯起眼睛，透过雨幕望向赌场深处，那里曾是黑帮头目“夜叉”的巢穴————雕花木窗被火焰吞噬，梁柱轰然倒塌，燃烧的账本像蝴蝶般漫天飞舞。\n\n行动开始于子时三刻。三百名精锐队员分五路包抄，犬神率领的突击组最先突破外围防线。当他们踹开风月楼后门时，正在分赃的黑帮分子甚至来不及拔枪。犬神的怒吼声与火铳轰鸣同时炸开，硝烟中，溅起的瓷片在墙上划出狰狞裂痕。\n\n最激烈的交锋发生在“鬼市”地下通道。青坊主带领的情报组追踪到夜叉的踪迹，却陷入埋伏。黑暗中，淬毒的暗器如骤雨袭来，青坊主挥动禅杖，杖头的铜铃震碎暗器，身后的队员们以盾牌结成防线，步步推进。夜叉挥舞双斧冲来，被随后赶到的鬼切一剑刺穿肩胛。\n\n此刻广场上，浑身是伤的夜叉被铁链锁住。鬼切俯身扯下他脸上的恶鬼面具，露出一张布满刀疤的脸：“平安京不需要法外之地。”人群中爆发出欢呼，百姓们举着油纸伞涌来，看着警车将一箱箱赃物运走，火光映照着夜叉不甘的面容。\n\n雨渐渐停了，东方泛起鱼肚白。鬼切望着清理现场的队员，远处传来小贩支起摊位的声响。"
  onm_pol.24.a: "收队"
  ONM_hcp_add_300: "获得§G300§! £hcp_small"
  onm_pol.25.t: "斩妖除魔"
  onm_pol.25.d: "经过长达数周的艰苦战斗，平安京为非作歹的妖类终于被成功肃清。我们付出了惨痛的代价，许多优秀的阴阳师和武士在战斗中牺牲，他们的英勇行为换来了平安京的和平。为了纪念那些在战斗中牺牲的英雄，政府举行了盛大的葬礼，并对他们的家属进行了优厚的抚恤。那些英雄们的事迹，将永远被铭记在平安京的历史之中。"
  onm_pol.25.a: "英烈不朽，平安永驻"

  onm_pol.26.t: "高天原神使降临"
  onm_pol.26.d: "平安京现在我等掌控之下，然而高天原并未沉默。\n一位来自高天原的神使降临，身影仿佛由云霞与神光铸成，他开口宣告：\n「此世不容恶神擅权，速速回归封印！」\n自此，蛇神的威信逐渐崩落 (每周威信-5) ，高天原的干预渐至。\n\n§B提示：玩家可以在此处存档\n蛇神威信初始为 100 ，降低到 0 或以下则会失败\n蛇神神力初始为 50 ，目标是 100 \n权力平衡到达阶段四时结算\n这两项数值可以在权力平衡界面中查看\n完成特定国策和权力平衡决议可以增加神力§!"
  onm_pol.26.a: "出言嘲讽"
  onm_pol.26.a_tt: "§L千载之前，高天原的光辉也未能熄灭我的威势如今，你们还想再试一次吗？§!"
  onm_pol.26.b: "表面妥协"
  onm_pol.26.b_tt: "§L假意承认神使的宣告以拖延时间。§!"

  onm_pol.27.t: "信仰之争"
  onm_pol.27.d: "高天原的神谕如同无形的潮水，渗入民众的心灵，试图争夺人间的信仰。\n一部分民众转向了高天原，成了「天神信徒」。"
  onm_pol.27.a: "镇压天神信徒"
  onm_pol.27.b: "容忍天神信徒共存"

  onm_pol.28.t: "神罚降临"
  onm_pol.28.d: "高天原的意志化为灾异降下。如果我们不采取行动，将会出现伤亡。"
  onm_pol.28.a: "直面神罚"
  onm_pol.28.b: "献祭不幸受伤的民众"

  onm_pol.29.t: "须佐之男"
  onm_pol.29.d: "天边突然风雷大作，一道惊雷炸响山巅，乌云也被劈散。闪电的白光散去后，一名身披战甲的神将出现在众人面前。\n天空中的闪电汇聚到那名神将手中，化作一柄雷电之枪，他冷冷地说道。\n「神高居于天上，罪人关入地狱，这是天地之初的法则！吾名须佐之男，为天地刑罚所生之行刑神。」\n"
  onm_pol.29.a: "须佐之男，你的末路已至！" #八岐大蛇胜利
  onm_pol.29.b: "罪人们啊，天刑已至！" #须佐之男胜利

  onm_pol.30.t: "八岐大蛇的胜利"
  onm_pol.30.d: "雷霆与神光交织的战场上，八岐大蛇怒吼震天，以无尽的神力压制须佐之男。\n须佐之男的神剑在黑雾中逐渐黯淡，最终被蛇神的獠牙与毒息吞没。\n神祇的身影轰然倒下，天地间的光辉随之消散。"
  onm_pol.30.a: "高天原最强大的处刑神陨落了，他们对我们再无威胁。"
  
  onm_pol.31.t: "高天原的胜利"
  onm_pol.31.d: "须佐之男下手狠毒，时而以枪穿心，时而以剑断头，时而又召唤雷电，将对手劈为灰烬，所到之处尸骸遍地，妖魔心生畏惧四散逃窜。\n最终，八岐大蛇的怒吼化为低沉的回响，被重新封印于狭间。"
  onm_pol.31.a: "平安京重归高天原掌控。"

  onm_pol.33.t: "威信尽失"
  onm_pol.33.d: "曾经俯首的民众已不再畏惧，信徒四散，祭坛沉寂。\n威信彻底崩塌，蛇神的统治失去了根基。\n在这片动荡的国度中，阴阳师残党与天神信徒趁势而起，誓要终结蛇神的时代"
  onm_pol.33.a: "蛇神的时代走向终结。"

