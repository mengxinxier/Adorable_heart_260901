  onm_pol.40.t: "终焉裁决 • Ⅰ"
  onm_pol.40.d: "你坐于天平正中心的裁决者座上，四面涌出审判场的边沿以及外侧的观客席。“今日吾以吾之神格代替八咫镜，衡量众生罪行，让曾经的众神和天地万物亲眼看看，他们该当何罪！”\n“神的羔羊们啊，你以跪拜之态降生，落地即向神祈求安宁。”\n“神于是赐你弱小，赐你无知，又赐你足枷锁链。”\n“神言道，『这样你们便不会为恶，世间便永恒安宁。』”\n“神却不曾言，罪因弱小而生，因无知而犯，足枷锁链，本就是为罪人锻造”\n\n第一颗星辰朝着大地坠落，岩浆自地底喷出，掀起一片火海，草木触及即刻烧成灰烬，掀起狂风，将野火送往更远处燃烧，所到之地，无论森林草地，皆化为一片焦黑。\n“旧神陨落，新的审判者降世，却见世间满是罪行，无人不是罪人。”\n“他天生慧眼，所有罪责都不能逃过他的眼睛。”\n“他升上宝座，所有不公都不能躲过他的判决。”"
  onm_pol.40.a: "“他朝着众生宣判道，『有罪！』”"

  onm_pol.41.t: "终焉裁决 • Ⅱ"
  onm_pol.41.d: "第二颗星辰朝着大海而去，燃烧的山峰如同滚石般填入海水，海水顿时沸腾起来，海面升起滚烫的雾气，海上的船只被热气迷惑失去方向，在急速的洋流中被巨浪吞没，巨浪过后，翻滚的水面变成血红，被海水烫熟的残骸，从水底浮出，漂满了血红的海面。\n『请宽恕我的罪吧！』羔羊们向审判者乞求道。"
  onm_pol.41.a: "『我并非是自愿犯下这般罪行。』"

  onm_pol.42.t: "终焉裁决 • Ⅲ"
  onm_pol.42.d: "第三颗星辰朝着黑夜一侧的世界降落，带着漫天流星自夜空中落下，将黑夜映照成白昼，流星在空中燃烧解体，化为无数陨石的碎片，如同暴雨一般砸向人间，山脉断裂河水断流，村落刹那间消失在白光里，山林化为一片火海，海水化为岩浆，冲上岸边，海啸吞没了一切。\n『请端正这不公吧！』羔羊们向审判者乞求道。"
  onm_pol.42.a: "『我并非是自愿戴上这足枷，穿上这锁链。』"

  onm_pol.43.t: "终焉裁决 • Ⅳ"
  onm_pol.43.d: "第四颗星辰朝着白昼一侧的世界袭去，原本洁白的云朵被击中后消散，化为血红的火烧云，华美的楼阁被击中，繁茂的参天大树被劈成两截，躲藏起来的生灵们闻声纷纷逃窜，大地陷落，将众人吞入深不见底的裂缝。”\n羔羊们哀叹道，"
  onm_pol.43.a: "『我的身体在永世的劫难中烧灼，我的灵魂在无尽的迷宫中彷徨。』"
  onm_pol.43_tt: "游戏进入§Y终局§!"
  onm_pol.43_before_tt: "游戏将进入§Y终局§!"

  onm_pol.44.t: "终焉裁决 • Ⅴ"
  onm_pol.44.d: "第五颗星辰朝着日夜交汇的天空一击落下，光影阴阳的平衡彻底被打破，黑暗侵蚀向太阳，白昼侵蚀向星月，天空如同被扰乱的墨盘一般明暗交错互相侵蚀，只是片刻，日月星辰都丧失了原本的光辉，白昼不再明亮，夜空无星放光，无边的黑暗彻底笼罩了世界。彻底的黑暗之中，周围只有世人此起彼伏的哀嚎声。\n『请赐予这无边黑暗最初的光明吧。』\n『请赐予这无望之地最后的怜悯吧。』\n『请开启终结之刻，将这罪恶的一切烧为灰烬。』\n罪人在我脚下请求道，"
  onm_pol.44.a: "『在那新世界到来之时，请赐予我安眠。』"

  onm_pol.45.t: "入梦"
  onm_pol.45.d: "此刻正值子夜，万物沉睡，漆黑的镜面笼罩着薄雾，入梦者的脸镌刻其上，如此沉醉、如此静谧，如此安宁——阴阳师和白狐依偎一处，京都被皑皑白雪覆盖，宁静祥和；九尾和巫女的身影自其中显现，梦中相会，倒显得情真意切。\n\n……\n\n无论妖鬼人类，酣睡之时最为脆弱，心底的欲求化成如此景象交叠在一起，反倒变为了模糊不清的色彩。\n“不论是鬼王还是阴阳师，又或是芸芸众生，都有着最纯质的情愫。”\n“若要他们抛开与生俱来的这一切，恐怕如同放弃生命一般吧。”\n自离开狭间，我还从未如此深入地抵达梦境的尽头。位于灵魂深处的思绪借由梦境交缠一起，混合出欲望的芬芳。我凝视镜面中映照出的幻象，交缠的蛇影中映出一道金色的创口。"
  onm_pol.45.a: "那存在了千年的伤痕，至今未能愈合。"

  onm_pol.46.t: "琉璃假面 其一"
  onm_pol.46.d: "有拾荒者在一处破败的神祠中躲避风雨，意外发现了一张琉璃所制的假面。\n琉璃宝光四射，绝非凡物。只可惜假面缺失一角，不得完满。拾荒者触碰它时，在脑海中听见了仿若神明的低语。\n“找到下一张假面吧，” 那声音说道， “每张假面都能实现你的一个愿望。找齐五面琉璃之时，你将不再有缺憾之事。”\n拾荒者半信半疑，但仍然对琉璃许愿道：“我希望不再受颠沛流离之苦。”\n说罢，他倒头睡去。一梦醒来，却发现周围已经不再是破败的神祠，而是一座山间的小院。田地井然，鸡犬相闻——琉璃已然应允了他的愿望。\n他大喜过望，认为自己得到了神明的眷顾，于是立时将昔日只在梦中的家园抛诸脑后，"
  onm_pol.46.a: "在面具的指引下，踏上了寻找下一张假面的旅程。"

  onm_pol.47.t: "琉璃假面 其二"
  onm_pol.47.d: "为寻找琉璃，拾荒者不惜越过刀山火海，穷尽一切。找到第二张假面时，他许愿离他而去的家人回到他的身边。找到第三张假面时，他求得了取之不尽的钱财。\n此时，他已经不再是一个拾荒者，而是一个家庭美满，生活富足的人了。这位富人居住在都城最为豪华的宅子里，雇佣别人替自己寻找下一张琉璃面具。\n那个声音问道：“你难道还有尚未实现的愿望吗 ？ ”\n富人道：“我的妻子会因为琐事与我争吵，我的儿女时常不服管教。下人们偶尔做出愚蠢的行为，扰乱我的生活，城主在一些事务上与我意见相左，损害我的利益。我的生命中仍然有着缺憾。"
  onm_pol.47.a: "琉璃聆听着他的愿望，却只是轻笑了一声，不再答话。"

  onm_pol.48.t: "琉璃假面 其三"
  onm_pol.48.d: "寻找第四张假面十分困难，富人不得已牺牲了自己的得力干将，又因为忽视了一场热病而再次失去了儿女。绝望而孤独的妻子跳下了高楼。\n那宝光四射的琉璃终于落入手中之时，富人除了这四张琉璃面具，已经再度一无所有。他听到脑海中的声音问他：“这一次，你想要失去的一切都回到你身边吗 ？ ”\n他却答道：“我想要第五张面具。\n愿望实现了。五面琉璃齐聚于他的手中，仿若蛇鳞般层层叠起，再无残缺。视野内宝光大盛，片刻后又归于沉寂。一切奇幻褪去，周围依旧是破败的神祠，唯余一尊拾荒者所化琉璃人像，矗立其间。\n蛇神的虚影缓缓浮现，开口时，赫然是那来自琉璃面具、微微含笑的声音：“而今你已得菩提，身如琉璃，内外明澈，净无暇秽。”\n语罢，他指尖轻点琉璃，"
  onm_pol.48.a: "琉璃与虚影，便一并破碎，再无踪迹。"

