  onm_navy.1.t: "启程其一"
  onm_navy.1.d: "今日，一个消息很快在平安京的百姓中间传开——平安京的港口处，出现了一艘华美无比的宝船。\n有人说那是名门望族的私人商船，有人说午夜时上面有妖怪出没。围观的人群中，只有你知道这艘船究竟为何物。\n这正是开辟无数航线，创下赫赫传说的「黄金爪号」。其无往不胜的秘诀，就藏在船底下负责乘风破浪的章鱼——「金八爪」身上。\n湍津姬：“哧哧~看看是谁来了，还记得我吗？”"
  onm_navy.1.a: "“好久不见，湍津姬。你还是老样子。”"

  onm_navy.2.t: "启程其二"
  onm_navy.2.d: "湍津姬：“嗨……别提啦，船里现在只有我一个。泷和白容裔那两个家伙，神神秘秘地说要去会见什么大家族，独留我和金八爪在船上看家。”\n湍津姬突然眨眨眼睛，表情狡黠地咧嘴，露出了自己的小尖牙。“比起这个，要不要……跟我偷偷溜出海冒险呀？”\n“偷偷？如若泷与白容裔归来，你届时会如何应对呢？”\n（泷是黄金爪号大副, 白容裔是船医）\n湍津姬：“那倒是不用担心，我们只要在白天开着'黄金爪号'出去，再在他们夜归之前返回，就绝对没问题的！而且，我都拟好了一个冒险计划了！” 湍津姬把一张海图举到你面前。\n湍津姬：“我标记了一些我从来没有见过的岛屿。我想，其中会有我生活过的那片海域……是、是的啦！我知道我是被驱逐出来的！我对那段生活没有印象了，并不记得准确的目的地，只知道附近有一个小岛，那是我被金八爪收留的地方……但是，我就是想要回去看看。” \n你理解了湍津姬心里的纠结。"
  onm_navy.2.a: "“也罢，总比放任你独自出航的好。”"
  onm_navy.2.a_tt: "启用决议组：§Y黄金爪号探险行动§!\n§L提示：派出黄金爪号进行探险行动，以期获得§Y远航宝藏§!。§Y兑换远航宝藏§!决议可以消耗§Y远航宝藏§!兑换种种奖励。§!"
  
  onm_navy.3.t: "荒川河畔"
  onm_navy.3.d: "航行进度过半，湍津姬慢下速度，将「黄金爪号」停靠在附近的岸边。\n湍津姬：“哧，作为一名冒险家，偶尔停下来补充体力也是很重要的！让我看看，这片陆地属于哪座小岛呢……”\n椒图：“哎呀，今天的荒川有客人来~ ”\n鲤鱼精：“是一位新朋友！河童先生，快来一起打招呼吧~”\n河童：“这位小姐该如何称呼呢？”\n湍津姬：(荒川……原来今天的航行，才刚刚抵达荒川河畔啊。)“ 你们好，我叫湍津姬，英勇无敌的冒险家——就是我啦！”\n椒图：“「冒险家」？难怪呢，看到你，总有种看到了小时候的金鱼姬妹妹的感觉。在她离开的那几年，虽然我们也很挂念她，但还是希望她能看到更广阔的天地。”\n湍津姬：“哇……”\n湍津姬听着椒图的话，一副若有所思的样子。\n“湍津姬，你在想什么？”\n湍津姬：“我在想——要是泷大公子和白容裔也抱着这种心态就好了！这样，我就可以十分帅气地出去冒险，再也不用这么偷偷摸摸的了。”\n（湍津姬还真是个小孩子呢……）\n湍津姬：“不过话又说回来，只要我们严格执行日落而归的冒险计划，就不会被他们发现的！各位，很高兴认识热情的大家！我们差不多也休息够了，要继续向着今天的目的地出发啦！”\n鲤鱼精：“一路顺风，记得再来找我们玩呀~”"
  onm_navy.3.a: "一路顺风。"

  onm_navy.4.t: "渔岛"
  onm_navy.4.d: "顺着海图的指示，你们抵达了今天的目的地：一座渔岛。\n湍津姬：“传说，这座岛周围生活着各式各样的鱼类，我的出生地，会是这片海域吗……”\n你观察四周，却发现岛上的样貌有些萧条，零星坐落着几户房屋，门口挂着空空的渔网。\n渔民：“你们是前来买鱼的商人吗？请回吧，今年不是丰年，渔场里只有尚未成熟的鱼苗。我们现在连自己的肚子都填不饱，已经连着几天没吃过像样的一顿饭了。”\n“没吃过像样的一顿饭？那就到我出手的时候了！”湍津姬决定大展身手。她向渔民借用了灶台，又找来「黄金爪号」上的一些食材存货……\n湍津姬：“哧哧~这就是我在船上时经常偷偷做的创新菜——酱油海带汤煮甜菜根！”\n渔民看着这一碗被染得黑乎乎的料理，面露难色，又不好意思拒绝这番好意。\n湍津姬：“别看它这样，味道可是很不错的，饱腹感也是一流！相信我嘛！”\n你低头闻了闻，率先喝了一口：“噢，竟然意料之外的好喝！虽然卖相有待提升，但味道果真鲜美，食材中的一点点甜味很提鲜。”\n看着大家惊喜的表情，湍津姬顿时十分骄傲，“哼哼，一个冒险家，当然不能让自己饿肚子啦！不过话说回来，这片海域看起来没有鲨鱼活动的痕迹啊……”\n“别灰心，至少我们排除了一个目标地点不是吗？也许鼓励人心的消息就藏在下一站。”\n湍津姬：“哧~是啊，冒险就是充满了惊喜与不确定的！时候不早了，今天我们就先赶回去吧。明天早上，记得在老地方等我啊，我的特聘船员！”"
  onm_navy.4.a: "尝到了湍津姬的手艺，也算是不虚此行了。"

  onm_navy.5.t: "小岛"
  onm_navy.5.d: "途经一座小岛时，湍津姬抛下船锚，例行整顿休息。\n你们环视四周，岛上没有人类，只有很多宝箱。很多宝箱仍紧紧闭着，封锁着里面的宝藏。\n“……此地有异常。”话音刚落，一只红色的章鱼瞬间浮出水面，这里竟是石距盘踞的地方！\n石距完全从水面露出了巨大的身体，疑惑地看着你们。你正打算有所动作，却被湍津姬拉住：“等一下，先别动手！”\n湍津姬三步并作两步来到石距面前，很好奇地望着石距。你跟在她的身后，随时准备应对石距突如其来的愤怒。\n湍津姬：“大章鱼？你也是个大家伙啊！你认识金八爪吗？我也是金八爪的好朋友噢！”没想到，石距真的退了回去，游到海中，看到了自己的同类。它围着船底的同类游了三圈，好像在跳舞，随后游走了。\n“没想到，风风火火的湍津姬，也有这么细腻的一面呢。”\n湍津姬：“哧哧~我也只是抱着试一试的心态啦！我能感觉到，它今天没有什么攻击的意图。而且，我不想伤害任何一只章鱼，这样会让金八爪伤心的。……咦？”\n湍津姬定睛一看，刚才石距停留过的地方，居然留下了一个宝箱。\n湍津姬：“哇！今天还真是超级幸运！”"
  onm_navy.5.a: "保持住这个势头，我们继续出发吧。"

  onm_navy.6.t: "浮动岛其一"
  onm_navy.6.d: "顺着海图的指示，你们抵达了今天的目的地：一座浮动的岛。\n湍津姬：“这座岛很奇怪，根据海图上的修改痕迹，它经常换位置。这里会是鲨群的聚集地吗？这种狡猾的作风，很符合鲨鱼的性格呢，哧哧——”\n踏上地面，你们却感觉到脚下的地面在隐隐震动……\n湍津姬：“哎？不是吧！是地震吗？！”\n说话间，这座「岛」已经拔地而起——原来这里根本不是什么岛，而是正在休息的蜃气楼。\n你连忙护住湍津姬。原本正在沉睡的蜃气楼浮出海面，露出了下面的庞大躯体。借着这股力量，你们重新跳回船上。蜃气楼仍穷追不舍，用巨大的钳子挥向「黄金爪号」。\n“没办法了，应战吧！” 湍津姬已经完全摆出了战斗姿态，身上的鳍全部张开，乘着风浪一跃而起，灵敏地跳向蜃气楼。“哧，真是烦人的家伙！有我在，谁都不能伤害「黄金爪号」！”"
  onm_navy.6.a: "准备战斗！"

  onm_navy.7.t: "浮动岛其二"
  onm_navy.7.d: "有惊无险地结束战斗后，湍津姬挠着头走到你的身边。“不好意思啦，今天是我导航失误，没想到尽是一些大家伙啊！作为冒险家、一名「黄金爪号」的王牌水手，让同伴置于险境，这真是我的失职啊！” 湍津姬有些气鼓鼓地双手抱胸，一副发誓要彻底保护大家的样子。你注意到了她的手臂。\n“湍津姬，你受伤了？”\n“哧，没事！一点擦伤，舔舔就行！” 说话间，你已经开始为湍津姬疗伤，她手臂上的小擦伤开始有消退的迹象。“噢，这个阴阳术真帅！我也要学这个！” \n你轻轻摸了摸湍津姬的头。“还是先找到鲨群要紧。”\n湍津姬：“这周围的海水被蜃气楼搅得很浑浊，看起来也没有鲨群呢。只能再去下一个目的地看看喽。明天——不用我多说了吧，老地方出发，我们继续航行！”"
  onm_navy.7.a: "轻轻摸湍津姬的脑袋"

  onm_navy.8.t: "离岛"
  onm_navy.8.d: "湍津姬：“哇——我原本还以为是我眼花了，大海上怎么会漂浮着漂亮的灯笼。没想到，真的有这么漂亮的地方啊——” \n「黄金爪号」已在离岛海岸停泊，湍津姬站在离岛的土地上，接连发出感叹。“这里的楼台漂亮，灯火也漂亮……咦，前面那个姐姐穿得也漂亮！”\n“湍津姬的嘴里只剩「漂亮」了呢。”\n“哧~我心里怎么想就怎么说了嘛！” 说话间，被湍津姬注意到的「漂亮姐姐」已经走到了二人面前。\n歌留多：“哦？是你啊？真是许久不见！要不要久违地来一局？顺带在歌弈坊稍事歇脚。”\n“呵呵，若是入了歌弈坊坊主的局，怕是容易流连忘返，忘了来时的目的。”\n歌留多：“几位是急着去哪里？”\n湍津姬：“哧哧~是我抓着他出来的，我要一个个地去往我没去过的地方，直到找到我诞生时的那片海域。”\n歌留多：“那么，直到你冒险归来，歌弈坊也会一直恭候你哦，小冒险家。”\n湍津姬：“你叫我冒险家？！你真是很有眼光啊！哧哧~” 湍津姬被夸得有些晕晕乎乎，被你摸了摸脑袋才回过神来。\n湍津姬：“事不宜迟，我们还要继续赶路！漂亮姐姐，我下次再来找你玩啦！”"
  onm_navy.8.a: "“再会。”"

  onm_navy.9.t: "隐珠滩"
  onm_navy.9.d: "顺着海图的指示，你们抵达了今天的目的地：一座与世隔绝的岛。\n湍津姬：“在这座孤零零的岛周围，会不会生活着我的族群呢……”\n远处，已经有一些人向着二人的方向走来，看模样打扮，像是采珠为生的海女。“几位也是前来采购的商队吗？”\n“不，我们只是因为私人原因出航的海员。”\n海女：“真是稀奇……这里除了商队，还没有其他人特意到访过。”\n湍津姬：“那鲨鱼呢？有没有鲨鱼到访过？”\n海女：“这……倒是也从没见过，如果有的话，我们这些海女也不会在此生活了。”\n湍津姬：“这样啊，看来也不是这里了。”\n“'海女'是什么，你们难道也生活在海里吗？”\n海女：“呵呵，可以这样说。我们世代掌握着采珠的技艺，不停地游至海中，再把珍珠带出来。”\n湍津姬：“哇……深入海域、取得战利品，这不就是冒险家嘛！”海女们纷纷被湍津姬逗得发出一阵笑声。“既然你们是海员，就给我们讲讲海上的生活吧。我们一直生活在这里，从来没有人给我们讲过这些。”\n湍津姬：“哧哧~那当然没有问题啦！你们问我可算是问对人了……”\n湍津姬和海女们笑作一团。\n不知不觉，湍津姬的故事讲到了黄昏降临，已经到了返航的时间了。\n湍津姬意犹未尽地和海女们告别，登上了'黄金爪号'。\n“方才你讲的这些故事里，有一个故事的主角，其实应该是我吧。”\n湍津姬：“哧，有什么关系嘛，总有一天，我会把我没经历过的冒险都经历一遍的！”\n湍津姬：对啦，我们明天——"
  onm_navy.9.a: "“明天，老地方，出发！”"

  onm_navy.10.t: "铃鹿山"
  onm_navy.10.d: "蟹姬：“走开、走开！哇——不许把蟹姬拎起来！不许吃掉蟹姬！”\n铃鹿山的海滩上，蟹姬和一只巨大的海鸟扭打在一起。海鸟抓住蟹姬的衣服扑着翅膀，正想把蟹姬拎跑。\n湍津姬：“哧——去！去！去！滚开，滚开！”你和湍津姬跑上前，替蟹姬喝退了图谋不轨的海鸟。\n“好了，现在没事了。”还好湍津姬眼尖，看到了这一幕。\n蟹姬：“呼，谢谢你们的搭救。蟹姬也在努力变强了，已经不会轻易被这些坏鸟抓走了。”\n湍津姬：“这鸟真坏！一会儿它要是还敢飞回来吃你，我们就抓住它，拔了它的毛，把它做成烤鸟！”\n蟹姬：“烤鸟……你，也喜欢做料理吗？”\n两个小女孩一见如故，叽叽喳喳地凑在一起分享自己喜欢的料理菜单。时间飞快，转眼到了再出发的时候。\n“啊，请等一下。”蟹姬叫住你们，然后跑开了。再回来时，端了满满一盘美食。“请吃完这些再走吧~！”\n湍津姬：“嘿嘿——那我就不客气啦！”湍津姬看着蟹姬端着的美食，迫不及待地直接埋头下嘴，瞬间，蟹姬吃痛地大喊起来。"
  onm_navy.10.a: "“哇！那是……蟹姬的蟹钳啊……”"

  onm_navy.11.t: "海角屿其一"
  onm_navy.11.d: "顺着海图的指示，你们逐渐驶向了海的尽头。\n“人们常说的'天涯海角'，指的就是这种地方吧。”\n“那，我的族群会住在这种天涯海角吗？”湍津姬在脚下的岛屿四周张望，寻找着鲨群的踪迹。\n'啦啦……啦啦啦……'，风中突然传来一阵清丽的歌声。\n“这是，鲨群的摇篮曲么？”\n湍津姬：“不，不是的。那首摇篮曲的旋律，我一下子就能分辨。”\n你驻足细听，立即发现蹊跷，歌声充满异常，仿佛能扰乱人的意识。“小心！”\n你捂住了湍津姬的耳朵，歌声的源头逐渐逼近——一群会唱歌的海妖，将你们团团围住。"
  onm_navy.11.a: "击退他们！"

  onm_navy.12.t: "海角屿其二"
  onm_navy.12.d: "击退海妖后，湍津姬平复着酣战之后的兴奋，抄起海图，低头确认着。“唉，是了，海图上标好的几个位置，如今已经都被我们找遍了。就这么撞大运地四处寻找鲨群，果然还是很困难的事啊。”\n“如果就这样结束冒险，心里会觉得遗憾吧。”\n湍津姬：“哧，当然会觉得遗憾啦，毕竟也是我的愿望嘛！不过……好在和你一起出来冒险，还是那么有意思！虽然找不到我出生的那片海域，但这么多天下来，我也玩得很痛快。而且，我们这些天的偷偷出航，一次都没有被发现呢！”\n湍津姬眨眨眼睛，已经恢复了平日的神气。\n“湍津姬你真是乐观啊。”\n湍津姬：“哧——那当然啦，我活到现在，当然碰到过很多不如意的事情。但要是总想着那些不如意的事，就会把开心的事情也忘掉了！走吧，我的特聘船员，'黄金爪号'就要扬帆返航了！”\n湍津姬说着，已经跳上了'黄金爪号'。"
  onm_navy.12.a: "你沉默思索着，也踏上了黄金爪号"

  onm_navy.13.t: "礁石群"
  onm_navy.13.d: "“哧，这样真的可以吗……”湍津姬抱着臂站在你的身边，担心地看着脚下船底的金八爪。\n今天，是一场完全听从金八爪引导的出航。\n“我从第一天就在想，金八爪能不能为寻找鲨群提供它的助力。经过前几天的航行，如今让它自己来操控'黄金爪号'，也许会带我们抵达全新的地方。“\n湍津姬：“哎——没有'黄金诱饵'的引导，金八爪真的没问题吗？“\n“相信你的好朋友吧。“\n湍津姬：“嗯……说的也是！！“\n不知过了多久，'黄金爪号'缓缓停下，金八爪抵达了一块很小的礁石群，它似乎也有点累了。\n湍津姬：“这是……金八爪想带我来的目的地吗？“\n“无论是或不是，我们都下去看看。“\n湍津姬：“好。“\n踏上这片礁石群，你们发现这里荒凉无比，既没有人类，也没有妖怪。\n湍津姬：“奇怪，这些礁石的触感，似乎有点熟悉……难道……这就是我被金八爪搭救时的那座岛吗？“湍津姬绕着面前的礁石，走来走去，时不时停下来闻闻气味，甚至低下头用牙咬了两下石头。\n直觉告诉你，这次的方向很有可能是对的。\n'咔哒——咔哒——'远处的海面上方，突然传来了一种奇特的叫声。\n湍津姬停了下来，开始变得沉默，甚至有些坐立不安。她竖着耳朵倾听，叫声每传来一次，她就要起身四处张望一下——这是鲨鱼的叫声。\n“走吧，我们现在就启程。“"
  onm_navy.13.a: "“向着——叫声的目标地出发。”"

  onm_navy.14.t: "海之口其一"
  onm_navy.14.d: "循着叫声的方向，'黄金爪号'终于抵达了这片完全陌生的海域。海域中央的岛屿，从来没有在海图上出现过。\n仔细观察，这是由一座海底火山演化而成的小岛，历经数年地势变化，陆地四周即是深不见底的海渊。\n“此地水势险恶，不是可以逗留的地方。“\n湍津姬：“哧哧——！你快看那边！！！“\n湍津姬睁着她敏锐的双眼，指着几海里之外的方向。你顺着她指的方向仔细辨认，才能依稀看见一些移动的灰黑色。\n——那不是别的，正是鲨鱼鳍。\n可与此同时，你也立刻发现了怪异之处：鲨鱼们聚在一起，并非在悠闲地游动，而是在被迅疾的海浪追赶。\n那边的浪头凶猛异常，仿佛具备意识，掀起的巨浪如同巨口，立刻把几只游动的鲨鱼吞没。\n随后，你们眼睁睁地看着这些鲨鱼被卷进海浪涌向的方向—— 一片万丈的漩涡之中。\n湍津姬：“不行！！不能就这么让它们一个个地死掉！“\n湍津姬紧急调转'黄金爪号'的船头，向着这张'大海之口'冲去。\n哪怕前方是更加险恶的境地，哪怕对方是曾经驱逐了湍津姬的族群。湍津姬已经毫不犹豫做出了选择。\n你站在湍津姬身后，扶住了她的肩头，无论是什么情况，你都会护好湍津姬的安全。\n湍津姬：“哧哧~准备好了吗？我的特聘船员！“"
  onm_navy.14.a: "“这次我们要面对的，可是整片大海啊！！！“"

  onm_navy.15.t: "海之口其二"
  onm_navy.15.d: "湍津姬驾驶着'黄金爪号'，劈开无穷的海浪，浪花痛苦地翻涌，终于逐渐在躁动中平息。\n你看着面前这些得救的鲨群，它们正忙着清点幸存者。\n几只体型健壮的鲨鱼，已经带领着几只受了伤的瘦弱小鲨，向着海的更浅处游去。\n湍津姬看着这个画面，突然愣了一下。\n湍津姬：“那个声音……你听到了吗？“\n你摇摇头，除了海浪声，你没有听见其他的声音。\n湍津姬陷入一种安详的沉默，她双手在胸前交握着，似乎在与这股声音共鸣。\n(原来如此……这便是，只有鲨群之间才能彼此听到的摇篮曲。)\n熟悉的摇篮曲安抚着湍津姬的心，也安抚着所有的鲨鱼，它们用这一曲与离开的孩子告别，也用这一曲让亡者安息。\n湍津姬：“原来，我就是这样被驱逐出族群的……”\n湍津姬：“因为那时的我，还是一只体型过小的、长不大的、会被漩涡吃掉的鲨鱼。”\n这就是鲨群的规则，适者生存。只有被寄予厚望的强者，才允许在这种险象环生的深海生存下去。\n长期盘踞它们生存地的巨大漩涡，使它们不断向浅海驱逐被淘汰的孩子，这种规则十分残酷，又未尝不是一种温柔。"
  onm_navy.15.a: "那首鲨群的摇篮曲，就是它们无论身在何处，都会永萦于心的族群记忆。"

  onm_navy.16.t: "尾声其一"
  onm_navy.16.d: "你们终于开着'黄金爪号'返回平安京附近的港口时，时间已近子夜。\n“完了完了，这下完了！”湍津姬突然开始心虚，泷和白容裔此时肯定已经守在岸边，等着抓她现行。\n'黄金爪号'缓缓靠岸，泷和白容裔果然已经站在原地等着她了。\n湍津姬：“哧哧……泷公子哥，还有白容裔！好、好巧啊，你们怎么在这里啊！哈哈……”\n泷：“小鲨，这几天的冒险怎么样？”\n泷看着你笑了，你也释然一笑，你早就料到了，你和湍津姬偷偷跑出去的事情，一直被这二位知晓。\n白容裔：“当然了，我和泷都知道的。”\n湍津姬：“知、知道什么啊……”\n白容裔：“知道你一直都有当冒险家的梦想，又是那么期待他也能成为'黄金爪号'的船员。”\n白容裔：“那么，我们就姑且睁一只眼闭一只眼了。”\n湍津姬：“好啊——原来你们早就发现了！我还以为我和金八爪瞒得毫无破绽呢！哧哧哧~你们每天出去那么久，是不是就在等这一刻，等着看我笑话啊？好啦好啦，笑吧笑吧！嘶嘶也可以笑哦！”\n（嘶嘶是一只小蜥蜴，是'黄金爪号'的船员之一）\n“嘶嘶——”嘶嘶扑过去舔湍津姬的脸颊，湍津姬痒得大笑起来。"
  onm_navy.16.a: "“哈哈哈哈！嘶嘶，我也很想你啦！”"

  onm_navy.17.t: "尾声其二"
  onm_navy.17.d: "趁着湍津姬被嘶嘶拖住，泷示意你跟他来。走至稍远一点的地方，一个沉甸甸的盒子被塞到了你的手里。\n“这是……”\n泷：“马上…哦，准确来说，就是午夜刚过的现在，今天这个日子，就是湍津姬登上'黄金爪号'的纪念日了。我从一位汤泉老板处听闻，平安京的藤原氏，前些日子刚购得一株华丽罕见的珊瑚。那珊瑚的产地，正是鲨群聚集的深海。所以，我和白容裔前去拜访，确实见到了货真价实的真货。我们交涉了几日，终于为津姬买了下来。现在，我希望你也和我们一起，把这份礼物送给她。”\n“二位远道而来，又与藤原氏辛苦交涉，实在为这份礼物耗费了一番心力。没有人比你们更适合送出这份礼物了。”\n泷：“不必如此客气，你最大的帮助，便是这几日陪着她四处航行，为她护航。”\n另一边的湍津姬早就等得不耐烦了，她跑到你和泷的身边，立刻被你们手中的盒子吸引。“咦，这是什么？”\n泷：“拆开吧，小鲨，这是属于你的礼物。”\n白容裔：“我们确实在等这一刻——等着把它送给你。”\n“生日快乐，湍津姬。你知道吗，今天即是你的生日。”\n湍津姬：“哎？我？今天吗？我只记得今天好像是我登船的日子，我都不知道我的生日是什么时候啊……”\n可就在她拆开盒子，看到这株美丽珊瑚的一瞬间，各种气味都钻入她灵敏的鼻腔。\n她捕捉到了那片深海让人熟悉的味道，其中还混杂着你的气息、泷身上贵重的金属味、白容裔身上的药香、嘶嘶鳞片的味道。\n湍津姬：“哧哧~是呀，从今以后，这一天就是我的生日啦。”"
  onm_navy.17.a: "“因为，黄金爪号的大家在哪里，哪里就是我的家。”"
  onm_navy.17_tt: "设定之后的§Y探险难度§!为3\n增加一条§Y黄金爪号§!的生产线"

  onm_navy.18.t: "晴天"
  onm_navy.18.d: "黄金爪号驶入一片晴朗海域，海面安稳视野开阔，船员顺利校准航线，本次探险难度无变化。" 
  onm_navy.18.a: "了解"

  onm_navy.19.t: "狂风"
  onm_navy.19.d: "骤然袭来的海风掀起大浪，黄金爪号船体剧烈颠簸。"
  onm_navy.19.a: "这真糟糕"
  onm_navy_ui_diff_add_1_tt: "本次§Y探险难度§!§R+1§!"
  onm_navy.19.b: "黄金爪号已经招募了训练有素的船员应对这一天气。"
  
  onm_navy.20.t: "大雾"
  onm_navy.20.d: "浓稠大雾遮蔽海天,黄金爪号难以辨识航向。"

  onm_navy.21.t: "雷暴"
  onm_navy.21.d: "雷电伴着暴雨倾盆而下，黄金爪号探险遭遇严峻阻碍。"

  onm_navy.22.t: "黄金爪号探险完成"
