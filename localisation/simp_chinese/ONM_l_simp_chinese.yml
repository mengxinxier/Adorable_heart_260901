  ONM_navy_4_reward_tt: "黄金爪号探险行动：获得§Y远航宝藏§!§G+10§!\n§Y兑换远航宝藏§!决议新增兑换选项\n黄金爪号探险行动：§Y探险难度§!§R+2§!"

