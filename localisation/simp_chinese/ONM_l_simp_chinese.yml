  ONM_dnd_trap_1: "毒镖（等级2）\n毒镖随机刺向一名冒险者。被选中的人进行1次防御投掷，如果失败则失去1点生命值。"
  ONM_dnd_trap_2: "毒气（等级3）\n毒气弥漫，随机一名冒险者进行1次防御投掷，无视防御加成（盗贼除外），如果失败则失去1点生命值。"
  ONM_dnd_trap_3: "陷阱门（等级4）\n随机冒险者踩到了伪装成地板的陷阱门。投掷d6（而不是防御投掷）。身穿轻型护甲投掷结果-1，身穿重型护甲投掷结果-2，精灵的投掷结果+1，盗贼的投掷结果+2。如果失败，则将跌入陷阱门中，失去1点hp"
  ONM_dnd_trap_4: "捕兽夹（等级4）\n随机一名冒险者踩到了捕兽夹。被选中的人投掷d6（而不是防御投掷）。精灵的投掷结果+1，盗贼的投掷结果+2。投掷失败会被夹住一只脚，失去1点生命值，且他的攻击和防御投掷都将-1。"
  ONM_dnd_trap_5: "长矛（等级5）\n长矛随机刺向一名冒险者。被选中的人进行防御投掷，失败将失去2点生命值。"
  ONM_dnd_trap_6: "大石块（等级6）\n大石块从天而降。被选中的人进行防御投掷，失败将失去2点生命值。"
  ONM_dnd_special_scene_1: "喷泉：一名由你选定的受伤冒险者将恢复1点生命值。\n\n请选择一名受伤的冒险者"
  ONM_dnd_special_scene_2: "神佑庙宇：一名由你选择的冒险者在一段时间内攻击投掷+1。\n\n请选择一名冒险者"
  ONM_dnd_special_scene_3: "武器库：获得一个双持武器。\n\n请选择一名冒险者装备之"
  ONM_dnd_special_scene_4: "诅咒祭坛：当你进入这个房间时，一个阴森的祭坛发出了幽冥的光芒。一名随机的英雄被诅咒了，一段时间内，他的防御投掷-1。"
  ONM_dnd_special_scene_5: "雕像：你可以无视这个雕像，也可以选择触碰它。"
  ONM_dnd_special_scene_5_1: "你惊扰了雕像里面的幽灵。随机一人进行等级4的恐惧检定,如果失败则失去1点生命值。牧师可以将其等级数值加总到投掷中。"
  ONM_dnd_special_scene_5_2: "雕像突然裂开，你得到了雕像内部[?onm_dnd_random_gold_total]的灵石。"
  ONM_dnd_special_scene_6: "谜题室：这个房间里有一个等级为6的迷笼。你可以无视它或者尝试解开它。每次失败都会使进行该尝试的冒险者失去1点生命值。阴阳师和盗贼会将他们的等级数值加总到此次投掷中。\n\n请选择尝试解开迷笼的冒险者"

#####  地牢怪物  #####
  ONM_dnd_monster_0: "受到恶鼠的伤害时有1/6的概率因为伤口感染而额外失去1点生命值。"
  ONM_dnd_monster_1: "受其恼人啸叫声的影响，施法者的施法投掷将-1。"
  ONM_dnd_monster_2: ""
  ONM_dnd_monster_3: "受到巨型蜈蚣伤害后必须进行等级2的剧毒检定，如果失败则额外失去1点生命值。"
  ONM_dnd_monster_4: ""
  ONM_dnd_monster_5: "不死生物"
  ONM_dnd_monster_6: "不死生物"
  ONM_dnd_monster_7: "不死生物"
  ONM_dnd_monster_8: ""
  ONM_dnd_monster_9: ""
  ONM_dnd_monster_10: ""
  ONM_dnd_monster_11: ""
  ONM_dnd_monster_12: "受到蘑菇精伤害后必须进行等级3的剧毒检定，如果失败则额外失去1点生命值。"
  ONM_dnd_monster_13: "不死生物,双重攻击"
  ONM_dnd_monster_14: "双重攻击"
  ONM_dnd_monster_15: "食人魔每次命中的攻击会造成2点生命值的伤害。"
  ONM_dnd_monster_16: "所有冒险者（牧师除外）在战斗开始时必须进行一次等级4的凝视攻击检定，如果失败则将被石化，无法行动，直到他们被施予祝福术。盗贼将其等级数值加总到该次检定中。"
  ONM_dnd_monster_17: "三重攻击"
  ONM_dnd_monster_17_a: "三重攻击\n恶魔之眼：每名冒险者投掷d6,如果投出1-3,则该英雄的所有防御投掷-1,直至混沌之主被击败。"
  ONM_dnd_monster_17_b: "三重攻击\n能量抽取:任何受到混沌之主伤害的冒险者必须投掷d6,如果投出1-3,则冒险者的等级减少1级"
  ONM_dnd_monster_17_c: "三重攻击\n地狱烈焰波:在战斗前，所有冒险者必须投掷d6,如果投出1-5,则失去2点生命值;牧师会将其等级数值加总到此次投掷中"
  ONM_dnd_monster_18: "双重攻击。\n幼龙概率施展火焰吐息,对所有未通过等级6的火焰吐息检定的冒险者造成1点伤害(每名冒险者将其等级数值的一半加总到检定中，向下取整)。"
  ONM_dnd_monster_19: "双重攻击。\n受其野蛮冲撞能力的影响，冒险者针对牛头人的防御投掷-1"
  ONM_dnd_monster_20: "三重攻击。\n针对食铁者的防御投掷无法享受来自重型护甲的加成(盾牌和轻型护甲仍提供防御加成)。如果食铁者攻击成功，则冒险者不会受到伤害,而是失去他的护甲，盾牌，主武器或金币，按照此顺序作为优先级失去相应物品。"
  ONM_dnd_monster_21: "三重攻击。\n奇美拉概率施展火焰吐息，所有冒险者必须进行等级4的火焰检定，如果失败则失去1点生命值。"
  ONM_dnd_monster_22: "所有冒险者在战斗开始时必须进行等级4的凝视攻击检定，如果失败则失去1点生命值。"
  ONM_dnd_monster_23: "受到巨型蜘蛛伤害的冒险者必须进行等级3的剧毒检定，如果失败则额外失去1点生命值。受蛛网的影响，小队不能从该次战斗中撤退,除非他们在战斗中使用火球术。火球术不仅会正常造成伤害，还能烧毁蛛网。"
  ONM_dnd_monster_24: "???"

#####  地牢法术  #####
  onm_blessing_spell: "祝福术:祝福一名冒险者。\n该法术能移除一名英雄身上的一个诅咒，比如由美杜莎造成的石化。"
  onm_fireball_spell: "火球术:召唤一个火球攻击敌人\n本法术与攻击投掷类似。阴阳师和精灵会将其等级数值加总到施法投掷中。使用火球术攻击低级怪物时，它将击败若干个低级怪物，数值等于施法投掷的结果数值减去低级怪物等级的数值。"
  onm_lightning_spell: "闪电术:召唤一道闪电攻击敌人\n本法术与攻击投掷类似。阴阳师和精灵会将其等级数值加总到施法投掷中。对一组低级怪物施放时，本法术在命中后将只击败一个低级怪物。对一个高级怪物施放时，命中后将造成2点生命值的伤害。"
  onm_escape_spell: "逃脱术:施法者从其当前位置消失并出现在地牢外（相当于从本次冒险中离开）。逃脱术无需投掷，效果自动生效。"
  onm_protection_spell: "防护术:本法术将使一名冒险者在一次战斗中的所有防御投掷+1.如果本法术的施放目标是一名阴阳师，则其防御投掷的加成变为+2。施法者可以对自己施法。"

  onm_pol.300.t: "致雨沈"
  onm_pol.300.d: "时光荏苒，白驹过隙，一转眼便到了我们相识的第一个除夕。\n今年没有腊月三十啦，夕阳在除夕祝你生日快乐~\n从萌心群的初识，到战地的并肩作战，雀魂的欢声笑语，再到约定一起征战钢铁雄心，这一路的陪伴夕阳倍感珍惜。\n爆竹声中一岁除，春风送暖入屠苏。祝愿你在新的一岁一年里，平安喜乐，岁岁常安，顺利完成导师的任务，找到一份喜欢的工作。最重要的是:天天开心!\n希望在新的一年里，夕阳能够常伴在你左右，共同创造更多的美好回忆~"
  onm_pol.300.a: "收下"



