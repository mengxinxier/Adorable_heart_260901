  onm_liexi_lingli: "灵力+10"
  onm_liexi_tech: "裂隙探索"
  onm_liexi.1.t: "长廊"
  onm_liexi.1.d: "我们踏入了一片诡谲之境，身陷于由舱室交织成的迷网，放眼望去，前后皆不见尽头，舱室间彼此勾连，仿若永无出口。\n\n脚下的地面，似是由光亮通透的电路板铺就。目力所及，幽蓝的能量如活物般，顺着导体勾勒出的支路脉络蜿蜒流淌。\n\n这条无尽的长廊仿佛陷入了永恒的轮回，每一处转角、每一间舱室都如出一辙，毫无差别。目前的探索一筹莫展，建议另辟蹊径。"
  onm_liexi.1.a: "打穿地面"
  onm_liexi.1.b: "凿穿墙体"
  onm_liexi.2.t: "坚硬的地面"
  onm_liexi.2.d: "我们没能打穿地面。它的构成与我们所知的任何透明材料均不相同。暴力无法使其变形，甚至无法在表面留下任何痕迹。\n\n然而，经过一番努力，我们成功地在用雷击术式钻打出了一个小小的洞。导通电路的是一种高度浓缩的密织的灵能混合物。\n\n和这个发现一样有趣的是，我们也许不可能用这样的方式在地上打开一个通道。我们还得回到正常的探索方式。"
  onm_liexi.2.a: "好吧，继续探索"
  onm_liexi.3.t: "再生"
  onm_liexi.3.d: "虽然墙体并不难破坏，但是这种破坏是暂时性的。\n\n无论从墙上移走多少材料，基本建筑材料组成的晶体网络很快就开始自我编织、层层堆叠起来，形成一个与原有的东西非常接近的结构。我们可以看到我们下方的能量通路向着被我们破坏的地方导通着能量。\n\n和这个发现一样有趣的是，我们也许不可能用这样的方式在墙上打开一个通道。我们还得回到正常的探索方式。"
  onm_liexi.3.a: "好吧，继续探索"
  onm_liexi.4.t: "变化"
  onm_liexi.4.da: "我们终于在环境中找到了一丝变化：一座巨大的舱室，里面是一台核心终端，操控着布满整个舱室的屏幕。其中一个屏幕上是周围长廊的地图。\n\n屏幕记录了我们最近拆墙的位置。\n\n如果我们能弄明白控制台，就能大大增进对电子技术的理解。然而目前也不知道它有没有什么安保措施。"
  onm_liexi.4.db: "我们终于在环境中找到了一丝变化：一座巨大的舱室，里面是一台核心终端，操控着布满整个舱室的屏幕。其中一个屏幕上是周围长廊的地图。\n\n屏幕记录了我们最近钻穿地面的位置。\n\n如果我们能弄明白控制台，就能大大增进对电子技术的理解。然而目前也不知道它有没有什么安保措施。"
  onm_liexi.4.a: "派出工程师"
  onm_liexi.4.b: "把它拆了"
  onm_liexi.5.t: "活埋"
  onm_liexi.5.d: "一个保护措施被触发了，这个房间瞬间被一种扩张性的泡沫状物质淹没。还没有人来得及作出任何行动，工程师们就被完全包裹住了。这些材料一经移除就会快速自发归位，我们多次尝试解救也毫无成效。"
  onm_liexi.5.a: "过于危险，任务终止"
  #custom_effect_tooltip = onm_liexi_stop
  onm_liexi.6.t: "建材"
  onm_liexi.6.d: "尽管我们还没完全破译其模式，但毫无疑问这里的环境遵从着某种规则。我们取回了一些建材样品，它们呈现出一些自我复制的特性。尽管仍需要进一步测试，我们推测把这种材料放在任意位置并施加正确的引导将能够重建出大量相似的建筑结构。此外，针对控制台的研究使得我们对电子技术的理解提升了。"
  onm_liexi.6.a: "真是令人着迷的材料"
  onm_liexi.7.t: "拆解"
  onm_liexi.7.d: "我们把这台终端拆解成了零件。在它的线路中找到了数量可观的灵能结晶。这台机器原来到底用来干什么的我们已经不关心了。"
  onm_liexi.7.a: "好极了"


  onm_liexi.8.t: "怪异图案"
  onm_liexi.8.d: "我们踏入了一处充盈着诡谲视觉奇景的空间，目之所及尽是阴阳术式般玄妙的几何纹路，流转的色泽如式神符咒上的灵光般变幻无常。周遭看似并无妖邪之气萦绕，却似被施加了蛊惑人心的幻术，那些交织的光影如同迷惑之阵，令人步步错判方位。构成这片异空间的物质尤为离奇。无论这些样本如何放大，我们都会看到同样的重复模式，如同自身的无限浓缩。\n\n此间裂隙之中，显然蛰伏着超越现世法则之理。"
  onm_liexi.8.a: "进一步探索"
  onm_liexi.8.b: "在原地研究环境"
  onm_liexi.9.t: "多维度"
  onm_liexi.9.d: "此间空间，与我等熟知的阳界大相径庭。行进之态全然背离常理。本欲向前突进，却诡谲地向左横移；试图加速，速度反倒减缓。我们推测，此界具有超越三个的标准维度，这也带来了一些突破。也许以这个视角检测周围环境，我们就可以开始理解周围的图案。"
  onm_liexi.9.a: "继续调查"
  onm_liexi.10.t: "多维度"
  onm_liexi.10.d: "若不能参透此界法则，纵有通天灵力亦难行半步。是以，所有阴阳师皆分散去勘察周遭玄机。起初，收集的信息如百鬼夜行时的呢喃般杂乱无章，直至一人勘破天机————此界竟蕴含超越三个的标准维度！也许以这个视角检测周围环境，我们就可以开始理解周围的图案。"
  onm_liexi.10.a: "继续调查"
  onm_liexi.11.t: "瓶中信"
  onm_liexi.11.d: "对我们周围环境图样进行四维空间处理，我们成功的创建了一副可用的舆图。图中显化出那些循环图案的中枢结界。\n\n从四维空间的角度来看，我们可以沿一条直线到达中枢结界，然肉眼所见，却似穿行于九曲百折的迷障之中，我们需要急转弯，有时还得往回走，但我们最终还是到达了目的地。\n\n在它的中心，我们找到了一个熟悉的装置。上面书写的是一套如何进一步探索的说明。"
  onm_liexi.11.a: "这可信吗？"
  onm_liexi.12.t: "时间旅行"
  onm_liexi.12.d: "我们在所有的时间轴上进行旅行。\n\n按照摆在我们面前的指示，我们轻松地穿越了此界。好几回，我们看到自己从另一条路线穿过。其他的一些我们似乎处于困境中，他们随身物品的腐蚀破旧也说明他们在此界迷失了许久。\n\n我们已经为自己留下了指示。"
  onm_liexi.12.a: "令人不安……"
  onm_liexi.13.t: "到达"
  onm_liexi.13.d: "终于，我们到达了或许就是这个迷宫真正终点的中心。\n\n在其最核心处漂浮着三个透明球，每一个都包含着向一个轴向无限重复的图样。这里就再也没有什么指引了。缺失来自未来的信息可能表明，与这些球互动可能会产生可怕的后果。"
  onm_liexi.13.a: "取回那些球"
  onm_liexi.13.b: "我们到此为止吧"
  onm_liexi.14.t: "回归"
  onm_liexi.14.d: "我们返回了平安京。后续研究显示，当放置于独立的容器中，这些球自发地弯曲进入额外维度，增加了周围空间的有效容积。我们还不确定这个效应的扩展极限，但推测这个装置可以在工厂密集的区域派上大用场。"
  onm_liexi.14.a: "有惊无险"
  #密集型工业？
  onm_liexi.15.t: "回归"
  onm_liexi.15.d: "尽管我们选择不将球带走，最终我们还是发现它们三个出现在裂隙的这端。一定是另一个我们取回了它们。\n\n通过实验，我们发现了这些球具有有趣又实用的性质。具体来说，它们可以弯曲进入额外维度，增加周围空间的有效容积。我们还不确定这个效应的扩展极限，但推测这个装置可以在工厂密集的区域派上大用场。"
  onm_liexi.15.a: "我们帮了自己一把"



  onm_liexi.16.t: "心灵交流"
  onm_liexi.16.d: "我们到达了一个寒冷的地方。几乎立刻，我们就被一种强大的心灵交流所震撼：“你们好，远道而来的人们。从我的冥想深处，我感知到了你们穿越界面的旅程。来吧，让我们见面吧。也许你们的到来，就是我一直在等待的突破。”一个孤立山洞的景象被展现给了我们。无论这是谁，他们的灵力都远远超过了我们。"
  onm_liexi.16.a: "找到这个山洞"
  onm_liexi.17.t: "山洞"
  onm_liexi.17.d: "我们到达了那处山洞。一个蒙面人坐在那里冥想。她是有着灰色的皮肤的人形生物，被一种柔和脉动的能量的紫色光环笼罩着。“谢谢你接受我的邀请，我们有很多事情要讨论。我被称为先知。多年来我一直在这些冰冻荒原冥想，等待启示。你出现在这里并非偶然。我一直在努力进入灵性维度。你们的人民将这个地方称为“阴界”。最近，我感受到了一种奇怪的呼唤，我相信它来自阴界深处。我现在站在第一次踏入阴界的门槛上。”先知叹了口气。\n\n“我的人民把这个责任托付给了我。进入阴界确实可以赋予我们巨大的力量，但我充满了怀疑。我越接近，阴界对我的拉力就越大。在内心黑暗的角落里有窃窃私语。这样的力量真的可以被控制吗？而现在，在选择的时刻，你出现了。这绝非巧合。"
  onm_liexi.17.a: "我们可以提供我们的观点以供参考"
  onm_liexi.17.b: "我们无权干预"
  onm_liexi.18.t: "我们的观点"
  onm_liexi.18.d: "我们解释说，我们相信社会的目标是根据其原则发展和繁荣。在国际舞台上体现国家的价值观，才是对一个文明的真正考验。如果进入阴界确实是你们人民的意愿，那么你们就有责任继续前进。\n\n先知回应到：“我明白，但是我的人民的意志是分裂的。来自远方的旅行者，你能提供什么指导？决策的负担太沉重了，我一个人无法承担。”"
  onm_liexi.18.a: "鼓励先知进入阴界"
  onm_liexi.18.b: "反对先知进入阴界"
  onm_liexi.19.t: "建议"
  onm_liexi.19.d: "我们鼓励先知冒险进入阴界，她接受了我们的建议，并将其作为预言。作为感谢，她给了我们一个小而重的灵力晶体。我们告辞了。之后，我们将晶体转化为了更有用的能量形式。"
  onm_liexi.19.a: "也许我们会再会"
  onm_liexi.20.t: "来自彼岸的讯息"
  onm_liexi.20.d: "我们检测到一个陌生容器从未知裂隙中出现，它包含一条简单的消息：“感谢你们命中注定的造访。我们突破了阴界，它为我们提供了令人难以置信的力量，我们正在经历一个我们从未想象过的社会乌托邦！在我们完全进入阴界之前，我们想与你们分享我们的一些物质财富。”"
  onm_liexi.20.a: "我们会好好利用它们的"
  onm_liexi.21.t: "建议"
  onm_liexi.21.d: "我们反对先知进入阴界。我们认为，阴界的力量是不可控的，可能会导致灾难性的后果。先知接受了我们的建议，并将其作为预言。作为感谢，她给了我们一个小而重的灵力晶体。我们告辞了。之后，我们将晶体转化为了更有用的能量形式。"
  onm_liexi.21.a: "也许我们会再会"
  onm_liexi.22.t: "来自彼岸的讯息"
  onm_liexi.22.d: "我们检测到一个陌生容器从未知裂隙中出现，它包含一条简单的消息：“感谢你们给出的预言。从那时起我就避开了阴界的所有诱惑。我们正在分享我们的一些发现以表达感激之情。”容器中含有大量研究数据。"
  onm_liexi.22.a: "我们会好好利用它们的"
  onm_liexi.23.t: "交由命运抉择吧"
  onm_liexi.23.d: "我们决定不干预先知的选择。我们解释说，我们没有兴趣提供我们的见解，这也不是一次命中注定的拜访。我们是探险家，来到这个地方纯属偶然。\n\n“很好。也许你决定不干预只是我要解释的另一个信号。那就走吧。” 留下先知独自沉思，我们探索了附近的地形，希望我们在这里的旅程能带来一些实际的好处。没过多久，我们就在两座山峰之间发现了宝贵的灵力水晶矿藏。"
  onm_liexi.23.a: "很好"


  onm_liexi.24.t: "巨卵"
  onm_liexi.24.d: "我们在裂隙中发现了一窝巨大的的蛋，每一颗都有一辆坦克那么大。它的表面布满了奇异的符文，散发着微弱的光芒。我们无法确定它的来源，但它似乎蕴含着强大的能量。\n\n这些蛋预计很快就要孵化。"
  onm_liexi.24.a: "继续观察"
  onm_liexi.25.t: "孵化"
  onm_liexi.25.d: "蛋正在孵化。浑身覆羽的有翼生物破壳而出，落地便振翅腾空，成群结队掠过天际，宽大的羽翼在地表投下遮天蔽日的阴影。它们逆着罡风直上九霄，长尾翎羽划破云气。"
  onm_liexi.25.a: "靠近点"
  onm_liexi.25.b: "保持安全距离"
  onm_liexi.26.t: "接近"
  onm_liexi.26.d: "我们靠近时，这群幼崽并无惊惶之态。它们生着三目六羽的奇相，似乎对我们生起好奇，纷纷旋绕飞近。借此良机，我们很轻松地近距离观察了这些生物。它们的身体和羽翼具有很强的抗压性，这些生物很有可能已经进化到能够进行长时间的飞行。"
  onm_liexi.26.a: "真了不起"
  onm_liexi.27.t: "初次飞行"
  onm_liexi.27.d: "观察这些幼崽的初次飞行极具启示意义。这些幼崽在空中盘旋，似乎在练习飞行。它们的动作笨拙而不协调，但随着时间的推移，它们逐渐掌握了飞行的技巧。它们的翅膀如机械扇叶般有力地开合，迅速提速至惊人的速度，划破云层的刹那，气流在羽翼边缘激起银白色的光晕。在上层大气中，它们以近乎杂技的姿态嬉戏，时而舒展双翼借着气流滑翔出优美的弧线，时而收拢羽翼如流星般俯冲，又在接近云层的瞬间骤然上扬，展现出令人惊叹的飞行天赋与灵活机动性。"
  onm_liexi.27.a: "真了不起"
  onm_liexi.28.t: "远去"
  onm_liexi.28.d: "在对这些幼崽的行为模式进行进一步研究的过程中，一只无比巨大的个体倏然而至。那些生物纷纷围绕了过去，争抢地想要接近这只巨兽。似乎这就是它们的母亲。\n\n看来这里是这些生物的筑巢区。在我们的注视下，那只成体赶着幼崽朝远处飞去。"
  onm_liexi.28.a: "真是厉害的生物。"



