  ONM_GOD_Agency: "神谕机关"
  ONM_GOD_Agency_desc: "八岐大蛇神以神格之威庇佑万民。若能得与蛇神交好的诸神垂佑，则[ROOT.GetName]之基必愈加稳固，神威之势必愈加隆盛。\n§L提示：共有六位“神明”可以沟通，沟通有三个积极的阶段和一个固定的代价。第一阶段不需要任何条件，第二阶段需要达成某些条件，第三阶段需要一定数值的神力，通过决议”祭祀仪式“可以增加神力。§!"
