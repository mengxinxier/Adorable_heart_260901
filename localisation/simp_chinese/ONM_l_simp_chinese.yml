  ONM_dnd_yys_spells_left_2: "火球术x[?onm_dnd_spells_yys^1]"
  ONM_dnd_yys_spells_left_1: "祝福术x[?onm_dnd_spells_yys^0]"
  ONM_dnd_treasure_roll_dice: "投掷D6决定宝物价值"
  ONM_dnd_treasure_detail: "宝物投掷结果为: [?onm_dnd_dice_output]\n找到了价值[?ONM_dnd_treasure_content_detail]灵石的宝物"
  ONM_dnd_bag_spells_left_5: "防护术x[?onm_dnd_spells_bag^4]"
  ONM_dnd_bag_spells_left_4: "逃脱术x[?onm_dnd_spells_bag^3]"
