# 大江山
  Adorable_heart_city_story_title_dajiangshan: "大江山"
  Adorable_heart_city_story_desc_dajiangshan: "§Y · 大江山：§!\n曾名丹波山，是平安京北部耸立着的极高山峰。山顶居住着曾独自征服了鬼域并称王的厉鬼酒吞童子。一位自称是鬼王挚友的大妖曾用其鬼手将大江山劈成两半，令原本陡峭的山崖又添一分险峻，犹如双刃直插云霄。\n§Y · 罗生门：§!\n进出大江山时必经的关隘，据说只有亲自战胜鬼王的部下茨木童子的人才会被允许通行。\n§Y · 人之谷：§!\n大江山双峰之间的峡谷。大江山被一分为二时，滚滚温泉从峡谷中涌出，滋养了山下的这一方土地。\n§Y · 鬼王座：§!\n传说酒吞童子征服鬼域的最后一战持续了七天七夜，他的对手身形硕大如峰、气力拔山扛鼎，每一击都震天撼地。艰难获胜后，酒吞童子命令败者俯身低首，就此成为他的王座，自己则高居王座之上，俯视着芸芸众生与他打下的这片天地。"
# 七角山
  Adorable_heart_city_story_title_qijiaoshan: "七角山"
  Adorable_heart_city_story_desc_qijiaoshan: "§Y · 七角山：§!\n平安京北部的七角山，因其山体有七个不同方向的转角而得名。七角山也因为独特的地理位置而成为众多河流的交汇点。据说如今这里的地貌，是由数十年前的一场山洪所造就的。\n§Y · 苍风神社：§!\n七角山附近的村子有着信仰风神的传统。曾经为了祈求风调雨顺所有村民都会定期前往神社参拜。\n§Y · 森之心：§!\n七角山脚下有着一片幽深的密林。当年山洪爆发时生活在这的鹿人一族背井离乡，逃向了荒野。时过境迁，世上存活的最后一只鹿人寻着鼓声回到家乡，这里却只剩残破的石像与枯倒的树木……"

# 京都平原
  Adorable_heart_city_story_title_jingdu: "京都平原"
  Adorable_heart_city_story_desc_jingdu: "§Y · 京都平原：§!\n传说千年前的一场雷暴中，四名阴阳师将一位来自高天之上的邪神封印在了这片土地下。在巨大的五芒星结界的护佑下，妖鬼怨气消散、人类耕耘劳作……无数人与妖同行的美好故事，如今也在这片土地上孕育。\n§Y · 平安京都：§!\n由人类建立的都城，以繁华的市井与林立的楼阁而远近闻名。据说在平安京都四个方向的城门上，有四名神兽在默默镇守着这片人类的家园。可土地下邪神的封印松动，这座名为「平安京」的都城，似乎总是不太平呢。\n§Y · 晴明庭院：§!\n被誉为「天才阴阳师」的晴明为了省去不必要的麻烦，选择在城郊不远处的一座小院落里生活。无论是衣食起居、修行术法，还是缔结与式神的契约，抑或是在硕大的樱花树下撰写文字，晴明都会在这一方小小天地间完成。\n§Y · 源氏宅邸：§!\n作为京都势力最强的家族之一，源氏家族曾以极强的武力取得了无数的财富与荣誉。而这武力，似乎来源于一场场禁忌的仪式与见不得光的交易。\n§Y · 藤原宅邸：§!\n在三大阴阳师家族中，藤原家是最为低调、收敛的家族。在面积与其它家族相比微不足道的宅邸中，收藏着数以万计的古籍与卷宗。据藤原道纲所说，「情报」可是他们家族最为自豪的武器。\n§Y · 贺茂宅邸：§!\n贺茂家族世世代代追求将阴阳术钻研到极致，家族中的高位阴阳师都与许多大妖有着深厚的渊源。据说就连如今的天才阴阳师晴明，也曾拜贺茂家的人为师。\n§Y · 缘结神社：§!\n由于穷酸的外表与偏远的位置，不少人误以为这座神社已经废弃，但只要虔诚地祈祷，似乎真的会有一位元气满满的的少女神明出现，帮助情人们结成良缘?"

# 荒川
  Adorable_heart_city_story_title_huangchuan: "荒川"
  Adorable_heart_city_story_desc_huangchuan: "§Y · 荒川：§!\n由曾经征服了怒涛与巨浪、一统海洋的大妖荒川之主统领的海峡。这位统治者传说中性情残暴，却多次于劫难之中保护了荒川子民，为许多居无定所的小海妖提供了避风的港湾。"

# 逢魔之原
  Adorable_heart_city_story_title_fengmo: "逢魔之原"
  Adorable_heart_city_story_desc_fengmo: "§Y · 逢魔之原：§!\n由大妖怪玉藻前统领，只有妖怪居住的原野。相传在夕阳西下、阴阳更替之时各地的妖怪会聚集到逢魔之原举行一场小小宴会，谓之「逢魔之时」。\n§Y · 狐火环：§!\n由于曾失去至亲，玉藻前格外珍惜生活在逢魔之原的小妖怪们。他将强大的妖力凝聚成火焰，把妖怪们生活的家园团团围绕。骇人的火焰既吓跑了妄图侵扰的人类，又给予了小妖怪们源源不断的妖力，使得他们得以建设独属于自己的乐园。"

# 杏原岛
  Adorable_heart_city_story_title_xingyuan: "杏原岛"
  Adorable_heart_city_story_desc_xingyuan: "§Y · 杏原岛：§!\n歌舞盛世的荣华在遥远边海的杏原岛上被传颂，这里本是人类的豪门贵族聚集起来培养歌舞伎享受音乐的地方。\n§Y · 离岛：§!\n岛上唯一一座名为「离人阁」的建筑，曾曾被一场滔天大火吞噬殆尽，化作了焦黑的废墟。"

# 黑夜山
  Adorable_heart_city_story_title_heiye: "黑夜山"
  Adorable_heart_city_story_desc_heiye: "§Y · 黑夜山：§!\n坐落于京都平原东侧的黑夜山，是迁离月宫的天狗族如今的聚居地。高耸如云的山巅恰好适合天狗幼崽练习飞翔。"
###背景故事###
  xxx: "彼时，世界荒芜而无序，而自混沌之中诞生的第一缕光，从悠久无尽的沉寂之中制离出了生的概念，终于出现了最初的众神。\n「让我来分开天空与大地吧。」 有神这样说道。于是立地成山，耸入天际，化为了山神。\n有神则说，「让我来填满天地间的缝隙吧。」于是化作气浪，呼啸着充盈了天地间的空旷处，成为了风神。\n「就由我来修补大地的裂痕。」于是引来大水，灌溉了大地沟壑，化为了海神。\n「就让我来使天空不再寂寥。」有神说道。于是纺出云朵，降下雨雪搭建彩虹，联通在天地之间，成为了雨神。\n「那就让我，来使世界不再寂静。」有神说道。于是造出种子撒向世界，化为千千万万的草木生灵，它们生长发芽。这寂静的世界，终于变得热闹起来。\n最后，火神出现了，他一降生就将万物烧尽，使海水蒸发，云朵消散，风流紊乱，天地间的一切都被他烧去。众神震怒，誓要将其讨伐，但靠近火焰的神明都会被烧成灰烬。\n就在这时，耀眼的光辉从天而降，那是一名光芒万丈的女神，她所到之处，连火焰都因她的光辉而暗淡。\n她不费吹灰之力，就降伏了作乱的火神。\n「吾名天照，乃是光辉之神。」她说道。天照的光辉所及之处，终使天地有色，万物生息。\n「你等都因我而生，是以我即是全知全能之神，能为众神裁决是非善恶。」\n众神将信将疑，天照于是隐去天地光芒，顿时天地失色，万物没了生息，众神见状，将天照迎回，奉为众神之神。」\n「我已为世界带来了万物生息，却不能止于此，」天照说道，「我也要像诸位一般，去为这个世界而创造。」\n「我将为世界所创造的东西，名为「爱」。」\n黑夜褪去，光辉重归大地，重生的万物比往日更加鲜活，水中出现游鱼，空中诞生飞鸟，地面上奔跑着百兽。无论哪一种，在诞生时，被太阳的光芒所照耀的一瞬都学会了爱。他们爱上父母兄弟，爱上彼此，爱上所诞生的世界，更比什么都要爱着天照。\n在他们的爱之中，不断诞生新的生命，最终在大地上出现了和诸神形貌相近的人类。\n而人类比任何一种生命都要聪慧，也比任何一种生命都渴求着爱，他们将爱献给天照，也坚信天照同样爱着他们。\n诸神为天照所为感化，也向她寻求光辉，从她的光辉中，习得了「爱」。\n于是，神高居于天上，人匍匐于地面。众神所居的高天之上被称为一--高天原。\n而众神之中，却也有着并不信服天照的神。\n诞生于天地之初的蛇神盘踞于地面，其身体所通过的地方化为河川，鳞片所划开的地方则化为山峦，他长久地匍匐在人世，令人类惧怕不已，巨蛇时而逼迫他\n们深入绝境，时而又引诱他们自相屠戮，观之为乐。\n那些被蛇神所引诱的人类，即使侥幸生还，最终却会葬送在同族手中。\n人类的神官说道，「吾等以天照之名行正义之事，排除有罪之人。」\n于是或将罪人处决，又或将其驱逐，任野兽吞食。\n终有一天，巨蛇朝着光芒万丈的太阳抬起头来，吐着信子问向高天原的天照。\n「自称全知全能的天照，请你告诉我，你像世人爱你那般爱着世人吗? 」\n「我比世人爱我还要爱着他们。」\n「既然如此， 那为何令他们诞生， 却又裁决他们受过?」\n「只因他们染上了罪恶。」\n「罪恶?你可是全知全能，这世上的罪恶又从何而来?」\n「“天照，你既造出世人，难道不能让他们免于罪恶侵染?既然不能，你凭何为众神之神。」\n「我虽创造世人，却无法触碰他们的心，于是将爱赋予其心中，使之免受罪恶之苦。然而我乃全知全能，爱却并非如此。」\n「既然如此，何不宽恕他们。」\n「罪恶不可宽恕。」\n「那应由罪恶的创造者来衡量，而非是你。告诉我，罪恶若不是你所造，又究竟是何人所造，你自称全知全能，既如此厌恶罪恶，为何不与它的创造者一较高下，令它彻底消失于世?」\n天照沉默了，从她的沉默中，蛇神嗅到了一丝秘密的气息。\n「罪恶的源头也是来自于你?」蛇神质疑道。\n天照不答。\n「天照，」蛇神说道，「你可知道当聚集了太多的光辉，并不会驱散阴霾，反而会点燃毁灭一切的火焰。」\n「蛇神，你可知道当太多的怀疑聚集在了心中，并不会带来真相，反而会化作自欺欺人的开端。」\n为探寻罪恶的真相，八岐大蛇回到高天原，决心找寻罪恶的本源。他放出蛇魔四处探查，窃取了高天原每-个角落的秘密，终于得知在高天原的神狱中关押着七个罪行。\n蛇神潜入祭坛深处的神狱，祭坛的地下藏着错综复杂的迷宫，蛇神的身体在狭窄而扭曲的秘道中穿行，顺着螺旋的阶梯上层层往下，越是向下，就越是远离天照的太阳光芒。\n蛇神打开了一道又一道的门，每一道门都将一层光明遮挡在了门外，越是靠近神狱，就越是黑暗。暗道，门锁，楼梯，一切的形体都逐渐被黑暗所吞没，在打开了第九千九百九十九道门的瞬间，彻底的黑暗将蛇神包围，他无法辨别自己究竟身在何处。\n「罪恶们！」他高声喊道，「这里可是你们的牢笼?」\n「我自乐园而来，那里强者理应被崇拜，供奉为神明，可惜你们竟被困在牢笼中，无法前往！」他高声道，「请让我来为你们打开大门，放你们离开！只要你们回应我的声音，就能换来自由！」\n然而黑暗用沉默回答了他的请求。\n「如此可悲，」他悲叹道，「你们如此强大，却不为人所知晓，竟然连作答的勇气，都一并失去了吗?」突然，一簇火焰在黑暗中炸裂，它仿佛自漆黑的魔盒中跳出，围绕着蛇神如同初生孩童般舞蹈，紧接着是一簇又一簇火焰的点燃，一连串颜色各异的火焰朝着牢门飞去，不遗余力地撞击着它，一时间四溅的火星照亮了神狱，也照亮了蛇神着迷的脸庞，他毫不犹豫地斩断了牢门的封印，六簇鲜活的火焰冲破牢笼，朝着自由的世界，飞了出去。\n蛇神将六个罪恶引向人间，教给他们玩弄人心的手段，使他们引导人类堕落。\n人类因此愈发惧怕灾祸，为保身而将罪恶们供奉起来，称之为恶神。六个罪恶化为六名恶神，常伴于八岐大蛇左右，被人间合称为一一七恶神。 虽不在高天原之列，却胜过高天原众神。\n终于，有人不堪忍受，向七恶神乞求道。\n「我饱尝苦难， 仍心存良知，为何神还不救我? 」\n恶神们如孩童般笑道，「我们已经来了，我们就是神啊。」\n闻言，人类突然放声大哭，进而又大笑不止，身形扭曲成可怕的弧度，肉身从原本的皮囊中脱出，化作了畸形丑陋的鬼相，口吐瘴气，将曾经的同族撕成了碎片。\n人类迅速集合起来，将化为妖鬼的同族囚禁、驱逐、屠戮。\n妖鬼质问道，「我们由人而生，做人所不敢做，做人所不能做，为何你们是人，我们却不是?」\n人类与妖鬼开战，比蛇神所见过的任何一-场战争都要惨烈。\n蛇神震惊之余，兴奋得浑身颤抖，这才是千百年来他所追求的真相，他终于知晓了天照的秘密，他对恶神们说道。\n「我已看破了天照的阴谋，罪恶之所以被封印， 是因为它会引导自由。」\n「有形之物自降生便失去了自由，困于形体的牢笼，然而心却不会，无论形体如何孱弱，心都向往自由，而自由之中，蕴藏着无尽的力量，即使是天神的力量，也不能与之抗衡！」\n「可那天照，却在每一颗心开始跳动的那一刻，在其上铭刻了枷锁，令它们视自由为罪恶，视强者为罪人，反过来讴歌自己的愚蠢和弱小。」\n「那枷锁，就是她口中的「爱」 ！」\n「恶神们啊，」 蛇神抬手指向远方即将落山的太阳，和即将被夜色吞没的大地，「你们可知，你们本是高天原神王天照的分身，可她登上神王之位，却将你们打入神狱。」\n「如今，我们要让人类从天照的欺瞒中清醒，赋予他们真正的自由，这是我们独一无二的神力！」\n「从太阳的光辉中拯救众生，正是我们生来的使命！」\n「我们，才是这世界的救世主！」\n蛇神的话在恶神们之中掀起了轩然大波。\n「可如何才能战胜天照?」\n「她既以伪善来打压人世，我等就应以大罪来击败她！」\n「可什么才是这世上最大罪?」\n「天照以爱缚人世，使其降生便知亲子手足，故而弑亲便是第一大罪！」\n「天照以神威治世，万物以神为尊，故而弑神才是第一大罪！」\n「天照以神王自居，使众神众生皆尊她为主，故而反叛就是第一大罪！」\n蛇神大笑，「你们本就是天照的分身，由天照心中诞生，故而天照和你们本为一体，她是你们至亲，是你们的神，也是你们的主人。恶神们啊，只要摧毁她，弑神弑亲反叛，这三大恶行合一，不就是世间的最大罪?你们既是恶神，又岂能罢休！」\n恶神们闻之大喜，化为火焰，围绕着蛇神如蛇魔般狂舞。\n「我们要摧毁神王天照，不为别的，只因我们，正是七恶神！」\n在蛇神的教唆下，恶神们以瘴气腐化人类，令妖鬼如同春草一般疯狂滋生，在这罪恶橫行的人世间，迅速就形成庞大的妖魔之军。\n八岐大蛇化为巨蛇之身，用蛇腹搅动地面，掀起洪水滔天淹没人世，山川则聚集在一起，越长越高直指天边，形成了一座连通地面与天际的桥梁，恶神们率领着妖魔的铁军踏上巨蛇之身，踏上高峰，一路朝着高天原冲去，高天原急忙派军拦路，却根本无法阻挡愤怒的妖魔们。\n「天神们神力滔天高高在上，却眼睁睁地看着人世被罪恶所侵染，漠视生灵涂炭而不置一词！我等已不再是人，而是妖鬼，我族与这天，上的天神，永世为仇！」\n就在这时，天边突然风雷大作，一-道惊雷炸响山巅，妖将们顷刻被烧为灰烬，四处皆是哀嚎，乌云也被劈散，闪电的白光散去后，一名身披战甲的神将出现在众人面前。\n在他身后的湛蓝晴空之中，是光芒万丈的女神天照。天空中的闪电汇聚到那名神将手中，化作一柄雷电之枪，他冷冷地说道。\n「神高居于天上，罪人关入地狱，这是天地之初的法则！吾名须佐之男，为天地刑罚所生之行刑神。罪人们啊，天刑已至！」\n说罢，率大军下界迎战，和妖魔军交锋，下手狠毒，时而以枪穿心，时而以剑断头，时而又召唤雷电，将对手劈为灰烬，所到之处尸骸遍地，妖魔心生畏惧四散逃窜，六名恶神立刻围了上去。\n「可怜之人啊，被天照欺骗，落入我们手中。」\n「让我们救你出牢笼，自由那欢愉的滋味会让你永生难忘。」\n「向我们祈求吧，我们的甘霖比众神的谎言更加甜美。」\n「向我们跪拜吧，我们的火焰比正义的光芒还要耀眼。」\n须佐之男却不为所动，「你们的躯骸将涂满神殿前的石阶，你们的火焰会在神的脚底碾灭成灰烬。」\n恶神们将他团团包围，大笑道。\n「我们和太阳本就是一体，就算熄灭，一旦太阳重现，我们又会燃烧在干枯的大地上，卷土重来！」须佐之男冷笑道。\n「既然如此，就只好让你们全都求死不能了。」\n于是，须佐之男与六名恶神交战于山巅。然而恶神们本是天照分身所化，拥有近乎无穷的生命力。可做尽恶事的他们竟也被须佐之男的残酷所震惊，一个又一个地被逼入绝境。一名恶神被须佐之男用枪刺穿眼睛，将封印打入脑中，又有一~名恶神被须佐之男削去四肢，用枪将封印刺入腹中，几名恶神见状一-齐攻向须佐，两只手同时伸向他的要害，然而被须佐双手接下，二神竟无法逃脱，须佐之男错开发力，二神被扯住手腕刺向彼此胸膛，两颗跳动的心脏掉在地上，封印被打入二神胸口，第四名恶神见状从背后偷袭，撕扯下须佐之男的左手，然而第二次偷袭时却被须佐之男右手接住，他两指一错，将雷光凝成刀锋握在手中，反手割断了对方的喉咙。\n处决了五神的须佐之男左手已毁，右手握枪，最后的恶神见状转身想逃，却被须佐之男单手压制，跌倒在地，抬起头时对上那双冰冷的金瞳，见须佐之男用牙咬住雷枪，抵在他的心口，于是哭喊道。\n「为何只敬畏太阳的光芒，难道罪恶的光辉就不能照亮这个世界吗?」\n须佐之男咬住枪柄，一枪贯穿了他的心脏。\n战场在一瞬间恢复了寂静，须佐之男闭了闭眼，仿佛在享受着片刻的宁静，然而就在这时，一道巨大的黑影落在了他的脸上，他急忙抬头看向空中，却见巨蛇从空中掠过，以极快的速度冲向了他身后的天照。见状，须佐之男跃向云端，单手执枪，挡住了即将冲向天照的巨蛇，蛇神扑空，只得张口咬住长枪，二者一时僵持，蛇神见天照近在眼前，自己竟然无法前进半分，于是将雷枪一口咬碎，将须佐之男甩了出去。\n「让开，处刑神，我此行意不在你。」 蛇神步步紧逼，「虚伪的光辉之神，今日就是你的陨落之日！」蛇神稍稍退后蓄力，紧接着张开大口朝着天照咬去。\n然而须佐之男志在必得地抬起头，「可惜了蛇神，我此行就是为你而来！」\n他将右手伸进左手的残肢之中，从断开的上臂中抽出了半截染红的臂骨，与手中的断枪接在了一起，二者爆发出强烈的光芒融为了一体，雷枪与须佐之男的骨肉结合，化为一柄金色的雷剑，雷剑随着他一~跃而起，自蛇神头顶向下，如金色闪电一般劈了下来。\n白光炸裂，蛇神被雷剑贯穿匍匐在天照脚下，紫色的蛇血喷溅了满地，他抬起头来，却见天照面色不变，\n甚至衣袍都没有沾染一丝污垢。蛇神突然释放堕化之力，号令蛇血之中爬出无数紫黑色的小蛇，潮水一般地朝着女神涌去，然而须佐之男却再次挡在了天照的面前，他满身伤痕，被蛇群环绕，蛇魔爬满了他的身体，撕咬他的腰腹，缠绕他的四肢，却迫于他的神威无法靠近天照半步，片刻之后终于力竭，如同被须佐之男的身躯所吸食一般，化为一~滩滩妖气，漩涡一般环绕着他的胸口，最终消失不见。\n重伤的蛇神终于匍匐在地，不再动作，然而在他的身侧，六名恶神却已经缓慢地恢复了形体。\n「看来罪恶和光辉一样，取之不尽用之不竭。」蛇神笑道。「你又该如何是好呢，天照。」\n一直都在观战沉默不语的天照却抬起了一只手，朝着空中张开了五指。\n「六道之阵，起。」她命道。\n她手心的白光折射为七色，其中六色分别流向了地上的六名恶神。至此，封印从贯穿六名恶神身躯的伤口中射出，在空中扭曲旋转，化为漩涡。旋涡中六扇大门突然显现，分別通往六个不同的异界，恶神们的身体顷刻被旋风卷入门中。\n纵使恶神们如何挣扎嘶吼，都无法忤逆旋风的威力，他们释放出各自的力量，六种颜色各异的火焰在旋风中涌动，在急速的气流中被卷向各自的门，刹那间就将原本一模一样的六个异界烧成了不同的模样，成为了最初的「六道」。\n「终有一日，罪恶会重新笼罩世间。」恶神们挣扎着起誓道。\n须佐之男降下惊雷，层层叠叠的锁链从雷云中涌出，将异界之门锁在万干道锁链之中，然后在云端猛然收紧，一并化为了碎片。\n洪水退去，云雾消散，天照率众神重新出现在了天边，俯瞰着匍匐在地的巨蛇。\n须佐之男说道。「六名恶神身负重伤，被封印在六界之中。六界之间互不相通，他们永无再和你相见的可能。」\n「八岐大蛇，你败了。」\n「我败了吗?」巨蛇却笑道，他低头看向洪水褪尽的人世。」\n「好好看看周围吧，虚伪的神啊。你的子民们已经学会了罪恶，罪恶将会伴随着他们的生命代代流传。无论在什么时代，神都不会再被无条件地崇拜，无论去往哪里，你都会听见质疑的声音。」\n「这世界已经不再是神的，而是罪人们的世界了。」\n战败的八岐大蛇被关押在高天原的神狱中，将择日押至刑神场，对其审判。\n但这场高天原镇压恶神的战事，却透着说不出的诡异，八岐大蛇并未马上参战，而是在六恶神被封印后才出手，这番作为并不像他一贯的作风。\n天照命预言之神月读对即将举行的审判进行占卜，但未得到任何有用的预言，月读甚至只预言到一句「若神明有异心，高天原或会陨落，弹指一瞬，灰飞烟灭」，一时间众神惶恐。\n而被蛇神罪行所震惊的诸神们，为了杜绝可能存在的未来，重新聚集起来商议对策。\n神殿之中，天照坐于王座上闭目养神，而武神须佐之男则立于大殿中心。那柄与他臂骨融合后的巨大雷剑凭他的意志所操控，漂浮在大殿上空，置于众神的头顶，昭示着须佐之男极致的武力。\n「人类一族本性纯良，却被七恶神为害。今日众神都在，我愿第一个请愿，恶神们虽已被封印，八岐大蛇也已关押于神狱。但恶神作为原初之神，拥有无穷的生命力。」须佐之男说道，「只有将他们诛灭，才能守护人间。」\n满座哗然，自开天辟地神族只增不减，从不曾有神经历过湮灭，更没有神屠神之事，然而静观天照仍是闭目养神的样子，似乎已有定论。\n片刻之后，终于有神站出来问道。「可神的力量与万物同在，如何才能毁灭?」\n须佐之男答道。「锻造神器作为刑具， 毁灭其神格。」\n「可这样的神器到底该如何锻造?」\n天照伸出手来，指向悬浮在大殿上的雷剑。\n「以此为模，雷电为锤，尘世为炉，取神骨为芯，蛇神血为釉，锻造刑具六把，以警醒众神威慑众魔。其器如明镜，可映照出与受刑者同等的力量，从而获得处刑之力，触及神格时两两相抵，将罪神诛灭。铸成之后，将交予须佐之男执行。」\n话毕，须佐之男跪下。「领命。」\n「我愿献骨。」接着他说道。\n天照缓缓说道。\n「以汝之骨为芯，蛇神之血为釉，名之——天羽羽斩。」\n须佐之男却并不起身，似乎没有得到想要的答案。\n天照不答，沉默蔓延在大殿之中，片刻之后，终于开口说道。\n「蛇神由世间邪念所生，但邪念并非是恶行，恶行却也不尽然出于邪念，然而邪念能使万物腐化，即使强大如你，也无法在蛇神堕化的侵蚀中保持神圣无罪。此神器若以你骨为芯，则非邪神之血不能制衡，若用蛇神之血，则一旦铸成，就躲不开罪孽轮回的因果。在预言中，执此剑者，必将犯下更深的重罪。」\n「须佐之男啊，你为武神之首，强大到能摧毁世间一切，可因果无形，永远无法斩断，」 她问道，「 你可有此等决心?」\n这一回，须佐之男终于抬起头来，神色如初。\n「若是在那一战之前，」须佐之男说道，「我定能断言，我有决心。即使千年万年，也不会改变。」\n「如今呢。」天照追问道。「须佐之男，如今的你到底在看向什么?」\n须佐之男终于答道，「因果。」\n然而天照似已看透了真相。\n「须佐之男，你难道....」\n就在这时，一位衣衫不整的神使冲上大殿，急切地说道。\n「须佐大人，为了审判顺利进行，我等神使数人尝试去取蛇神的神格，然而蛇神邪念太重，在狱中竟也能摧毁他人心智!只要靠近就会被其腐化，化为蛇魔吞噬一切....幸免于难的神卫们要么重伤，要么疯癫....」\n「让神使们撤离， 我去会会他。」须佐之男打断道。\n「那位蛇神还说，请传话于那位战胜了七恶神的武神，告诉他我有一句道谢的话，要他当面来听取，不要因为一时得意，而失了礼数。」神使扑通一声跪在殿前，再不敢抬头。\n须佐之男站了起来，拒绝了天照的挽留转身离去。\n「须佐之男，愿你不会让自己后悔，」天照的声音自背后传来，「也愿你，不会让我后悔。」\n而牢狱中的蛇神也在筹谋着他的计划，待审判之时，高天原的众神都会前来，正是让高天原陨落的最佳时刻，而为了谱写这曲目最高潮的桥段，他必须埋下前奏。\n须佐之男来到了神狱，太阳的光芒已从高天原隐去。\n昏暗的牢笼分列两旁，延伸到远处。满地都是紫色的腐水，蛇魔们在黑暗中蠢蠢欲动。\n一道雷光闪过，震碎了狱中的锁链和围栏，重归黑暗后狱中遍地都是蛇魔焦黑的遗骸，丧命的蛇魔褪去紫色的瘴气，遍地的躯骸几乎挡住了去路。\n一个平静的声音从牢狱尽头传来。「看来能点亮黑暗的也不只有天照的光辉。」\n只见蛇神已化作儒雅的青年，身披白袍，端坐在堆积成山的神使躯骸上，目光锐利地端详着眼前的访客，仿佛自己才是那断罪的裁决者。\n「听上去，一个等待被处决的罪犯，倒像是在盼着我来。」须佐之男说道\n「须佐之男，我要替被封印的六名恶神向你道谢，」蛇神说道，「 他们自以为精通恶行，却败在你手中，可见离真正的恶神还相距甚远。这也难怪，他们只习得了如何犯下罪行，却不曾尝过他人罪行的滋味。经此一败，待到他们归来，定不会再辜负我的期待。」\n须佐之男一言不发，但目光锐利。\n「你心中有所迷茫 。可怜处刑人断了别人的罪， 却不知道谁能来断罪自己。」蛇神一语道破，「方才你应是在神殿与众神议事，可你却抛弃了辉煌的大殿，来\n到这躯骸遍地的牢狱。你真心想听见的是怎样的话语，不言自明。」\n说到这里，他张开双手，向须佐之男展示这地狱般的牢狱之景一满地的腐水和骸骨。\n「告诉我，我的谢礼，可回应了你的期待?」\n「我确实很是期待，」须佐之男说道，「我一路猜测反叛高天原的邪神究竟是怎样的狂徒，却是恶得如此纯粹。」\n「真是不坦诚的行刑人，众神只会盛赞你的英勇，而天照也只会褒奖你的忠心，但你却知道他们所言非实。」\n「因为，须佐之男，真正的你，和我一样一一是个十恶不赦的罪人。」\n须佐之男问道。「你认为我将恶神击败驱逐，是我对他们所犯下的罪行?」\n「妖鬼食人，要受到天刑;罪神害人，要受到处决。而你斩灭妖鬼、处刑罪神，何不是同等的罪恶?你究竟是为了什么而行刑?」\n「蛇神，难道你是认为，我渴求的并非正义，而是屠戮?」\n「封印了六恶神却唯独处决我，这就是你的正义?我教导世人作恶，却并不亲自为恶。只有面对我的质问，天照才会哑口无言。我才是最令你们恐惧怀疑的那一个一一」\n「败者无权质问，胜者也没有作答的理由。蛇神，你认为自己只是败给了规则，于是想要彻底改变规则。也难怪输得彻底。」\n「规则?那不过是上神维护秩序的借口。是谁定义的善恶，又是谁定义的规则?」蛇神哈哈大笑。「那么，我就让你亲眼看一看-规则的真相 。」\n他挥动双手召唤了幻境，突然落下的黑暗将须佐之男包围，牢屋与骸骨都被黑暗完全吞没。黑暗中他模糊分辨出一道仿佛永无止尽通往黑暗的螺旋楼梯，一簇火焰照亮了他的周围，须佐之男认出了自己的所在，这里是位于高天原地底最深处的神狱大门。\n神狱的门上绘制着可怖的壁画，如同在警告着来者其中囚徒的可怕，又如同在预言未来般，生动地画满了七种罪恶肆虐人间，将世界毁于一旦的末日景象。\n七个恶神的神格印记，如同眷属一般环绕着一簇更耀眼的光球旋转，竟是天照八咫镜的纹样。\n大蛇说道。「众生一面供奉着天照，一-面又乞求她退治恶神，殊不知二者一体。恶神，本就是天照的罪!」画像一变，从末日之景转为天照创世之初降下「爱」，慈爱的女神矗立在祥和的人间，被授予了「爱」的世人们感谢女神的恩赐。然而在女神的背后，光明的纹样却分裂为七种印记，化为恶神在人间肆意为恶，散播灾难。\n「天照抛弃了自己所有的罪恶，难道就能成为正义的化身?」\n一瞬的沉默昭示着不可言明的裂痕。见须佐之男沉默不答，蛇神悄然释放了腐蚀心智的瘴气，并在须佐之男未察觉时加深了所操纵的幻境，却换_上一副更冷峻的口吻，对须佐之男斥责道。\n「别忘了，是天照将爱赐予世人。为爱而欲求、为生而掠夺、为美而贪婪，这些也是罪孽吗?自己高高在上而将罪恶分割出去的天照，你能断言，那就是纯粹的正义了吗?」\n「天照固然有罪，有罪的却不只她一一个。万千众生只要活着，又有谁能逃脱罪责?」\n蛇神闻言一顿，故作惊讶笑道。\n「你竟承认天照有罪?须佐之男，你可真是太有意思了。」\n「你说得不错，万千众生只要活着，沐浴在天照的光芒之下，又有谁能免于罪责，就连你，也不例外!不信，就看看你自己吧!」\n神狱之门再度变化，重新化为七恶神作恶的地狱绘卷，然而这一回，七恶神的形态不再是火焰，而近似人形，其中领头恶神的身形竞无比熟悉。狱门化作一面巨大的镜子，映照出须佐之男的面容，片刻之后，镜中的面容开始扭曲，口中生出獠牙，手化为尖利的爪，如同妖魔般发出嘶吼。\n「作为自诩正义的行刑人，须佐之男--你不是要处决世间所有的罪恶吗?你要对你的太阳拔剑吗?」大蛇笑道，「有朝一日，天照不在，规则尽失，你这正义的看门狗又会变成什么样呢?」\n漆黑的神狱一瞬间化为高天原的神殿，须佐之男立于众神之中，只见众神看向大庭广众下的须佐之男，议论纷纷，退避三舍，每个人口中都喃喃着「妖魔」等词，须佐之男抬起头来，对上天照失望的双眼。\n「须佐之男，」她说道，「你已经处决了这世上所有的罪人，现在只剩你自己了。」\n「不，我不是妖魔。」须佐之男否定道。\n「不。」蛇神附和道，「这世上还有罪人可斩，因为这世上本就只有伪善，所有人都是罪人，清算永远不会终结，你可以一直屠戮下去，直到将万物处刑殆尽!」\n「诛尽他们吧须佐之男 !」他指向满座的众神， 「他们全都罪无可恕!」\n「妖魔」冲了上去，用新长出的獠牙和利爪撕碎了众神，高天原顿时被染成一片鲜红。\n「没错，没错!你与其做正义的奴隶，不如挣脱枷锁!」蛇神赞许地笑道，「认我为新主吧!这天下的罪人，将任你屠戮!」\n雷暴袭击了整个高天原，众神被炸成碎片，哀嚎遍地，新生的野兽冲向了神坛上的天照。\n「在我将创造的新世界中，我不会将世人分为正义和邪恶，只有欲望的自由，才是世间的极乐!」\n曾经是须佐之男的恶魔露出獠牙，将天照开膛破肚，啃食她的肉，吸吮她的骨。\n大蛇笑得越来越疯狂。「你可以自由地狩猎所有罪人!这整个世界，都是你的刑场!」\n「须佐之男啊，这才是你想要的，不是吗?」\n野兽抬起头来，发出本能的嘶鸣，鲜红的液体从他的下已滴落，他一一爪摁住了天照的肩膀，将她撕碎。\n幻象戛然而止。\n利爪变回了手指，须佐之男五指伸向幻境外蛇神的脊柱，然后猛地向外拉去整个幻境闻声消散。\n「你说的不错，但我现在要杀的猎物，可是你。」须佐之男赞同地笑道，他张开手心，露出手心中的蛇神神格，「这个东西确实是我想要的，没有它，审判怕是不能顺利。」\n大蛇微微睁大了眼，戏谑的笑还挂在嘴边。\n「哦?即使因这审判规则的存在，处刑了所有罪恶的你将堕落为彻底的恶神，你也依然要维护规则?」\n「蛇神啊，若你觉得我会因杀孽而问心有愧。那么你错了。」\n「这个世界并非你所说的那般非善即恶，即使是恶贯满盈的魔王，也绝非百分百的恶人，受拥戴的君主，也不是至善至美的完人。故天照担神王之任，必承其重其恶。但为庇佑子民，使人心向善，她制定规则，退治自身之恶，承担审判者的责任。而我也一样。」\n蛇神大笑。「你让我有了新的想法，或许想要真正地赢你们，我必须尝试用你们的规则....」\n须佐之男并不作答，转身准备离去，蛇神却说道。\n「不如我们打一个赌。我将做到在你正义的规则之下审判众生，令高天原所维护的秩序崩塌。」\n须佐之男停下脚步，「有意思，你能赌什么?」\n「赌注是你， 神将大人。」\n「我?」\n蛇神的神格上悄然化出一条小蛇，不易察觉地爬上须佐之男的手臂然而须佐之男一把将其捏碎，它又重新化为一抹黑雾。\n「我赌到那时，你将自愿成为邪恶的信徒。」\n本遍布星光的星海被黑暗笼罩，冰冷的海水起伏着，年少的神使用尽力量探寻着命运之海，最后发出绝望的哀叹。\n「没有希望，」荒颤抖着双手说道。「哪里都没有。」\n须佐之男却拍了拍他的肩膀。「不，你已经找到了命运的转机。」\n「你真的要这么做吗?」少年神使问道。\n「我愿意一搏。这是八岐大蛇留下的赌局，我必须去。只是——」须佐之男迟疑了一下，继续说道，「这件事，只有你我知道，不要告诉天照。」\n话毕，须佐之男转身离去，星海中只留下少年神使一人。\n「我的职责本是做出预言，而非做出选择。」少年的动摇最终化为决绝，「 但为了高天原也为了世间——我一定要更改命运!」\n到了审判之日，须佐之男将八岐大蛇押往刑神场。刑神场正中心立着一座巨大的天平，天照遥遥坐于正中的审判者之位，高天原众神环坐于刑神场，面色凝重。\n天平之前，审判已经就绪，蛇神被锁在天平的正前方，低着头看不清表情，负责审判仪式的神官站在蛇神附近，为刑场中的众神传达天照女神的旨意。\n待到天照降下光芒，仪式神官高声宣布道。\n「蛇神私自放走恶神，为害众生，谋逆高天原，请神王裁决。」\n天照道。「审判开启。」\n仪式神官宣读道。\n「天平的一侧为八咫镜，八咫镜为审判之标准，其中无善无恶。善行多于恶行者，将受其庇佑;反之，恶行多于善行者，将判定有罪。」\n「将蛇神的神格，置于天平另一侧，若上浮，轻于八咫镜，则为无罪;若下沉，重于八咫镜，则行刑。」审判仪式庄严肃穆，一时间众神屏息，无人敢开口出声\n然而就在这寂静之中突然传来一声突兀的笑声，高亢的笑声一声高过一声，仿佛听见了什么再有意思不过的笑话。当众神察觉到这笑声来自即将被审判的蛇神，议论声从观席传来，这反而让蛇神笑得更加厉害，直到天照抬手命众神安静。\n偌大的审判场上，只留蛇神一人癫狂的大笑在天平与观席之间回响，而天照似乎并不在意他的怪异行径，开口道。\n「说。」\n蛇神泰然自若，仿佛早就在等待这一刻，平静之余，又隐隐露出一一丝兴奋，抬起头来似笑非笑地反问道。\n「以八咫镜为准，轻则无罪，重则行刑，是谁定下的规矩?」\n天照说道。\n「吾。」\n蛇神说道。\n「那我也定下规矩，以我之神格为准，重则无罪，轻则行刑，不知你意下如何?」\n「无稽之谈。」\n蛇神故作疑惑。\n「这天平上的，当真是罪责的重量?」\n蛇神装作思索的样子，然后说道。\n「天照啊，你自称无罪，又如何知道在座的万干众神里，能有几人的神格善恶相抵后，轻过你的八咫镜?」\n蛇神继续压低声音诱导着。「我又如何知道这裁决是否真的公平，你当真能断定，按照这裁决之法，在座众神皆是人人无罪吗!」\n「你敢断言，无论是我还是在座众神，只要神格在这天平上重过八咫镜，就是该被当庭处决的罪神，理应灰飞烟灭吗!」\n天照只是冷眼看着蛇神。\n蛇神哈哈大笑。「好!来啊，把我的神格放上天平吧!公正的天平会证明给所有人看，我的质疑是不是对的。」\n八岐大蛇的神格被取出，数条白色的蛇在他的神格中相互交缠，记录着神格主人一生 的恶行与善行。\n置于天平另一侧后，善恶相抵，多余的恶行重量远远大于八咫镜，蛇神一侧的神格迅速地沉了下去。\n环坐于刑场外的众神窃窃私语，为八岐大蛇的罪行所震惊。\n仪式神官道。\n「蛇神，结果已明。请天照大人宣判。」\n天照判决道。\n「蛇神有罪，当毁去其神格，令其灰飞烟灭，重归于尘土，与万物合一。」\n「须佐之男，行刑。」\n须佐之男走上处刑台，以雷电在手中凝聚出一把天羽羽斩，接着召唤五把巨大的天羽羽斩出现在天平上空。\n「领命。」\n话毕，五把天羽羽斩在须佐之男的命令下缓缓浮向天平。随着须佐之男的指示，五把剑如同闪电般刺入蛇神的胸口，瞬时刑神场的地面满是喷溅出的紫红，并随着刑具的增加不断变得粘稠，渗入地面的缝隙。\n「这罪证，确实十分明了，但是.....」\n蛇神的话还未说完，第五把天羽羽斩就已斩落，他一直高举的头颅终于低下，他残破的身体向后倒去，毫无生气，不再动作，连天平上环绕着白色蛇群的神格也黯然无光。\n仪式神官见蛇神丧命，宣读到。\n「行刑已毕，审判结一一」\n突然，仪式神官像是被扼住了咽喉般无法发出声响。\n只见他的脖颈上瞬间出现一-道 锋利的切口，还未等他回过神，他的头颅竟已滚落到了地面上，满地都是金色的液体。\n那头颅瞪大了双目，恍惚看到一个身影向自己走来，将头颅从地面举起，待仪式神官看清，才发现来人的笑容毛骨悚然，是须佐之男。\n仪式神官扭头，见自己无头的身躯已仰面倒地在数米之外。\n刚才竟是须佐之男一剑砍断了神官的脖颈。\n「须、须佐大.....」神官瞪大了眼。「....为何?」\n「你好好看清楚，那是什么?」须佐之男温柔轻笑，将手中的头颅扭向天平的一侧一一原本放着蛇神神格的位置。\n说罢，他一挥手，竟挥开了缠绕在蛇神神格上的数条蛇魔，露出了里面真正的东西，一枚雷电形的神格。\n「那是? !」，神官的眼球几乎要瞪出眼眶，「 须佐.....您......神格? !」\n「答对了。」须佐之男陶醉地舔了舔嘴角，凑近神官的头颅，几乎要贴到他的脸上，又轻柔地问道。「那你再说，错判是非，颠倒黑白之人，该当何罪?」\n「按、按律....当一..」被捏住脸颊的神官艰难地发出一声。「--斩....」\n话音未落，头颅被须佐之男一手捏碎，只见他一甩手，头颅拖着长长的金色滚落到天照的王座之下。\n一时间满场哗然，无人知道究竟是发生了何种变故，只见向来冷峻的须佐之男突然放声大笑，站在了无生气的蛇神旁边，令人汗毛倒竖。\n须佐之男炫耀一般地向众神展示天平上的神格。\n「看啊，这是何等的讽刺!蛇神曾对我说，天照的规则全无公平可言。他与我打赌，为高天原维护秩序的我身上罪孽深重，恶贯满盈——如今一见，蛇神竟是对的!」\n众神瞠目结舌。\n「你竟交出了 自己的神格代为 审判?」\n「你可知自己此举，是背叛了高天原，背叛了天照大人!」\n在这一片嘈杂的声讨声中，唯独王座上的天照自始至终都一言不发。\n「背叛?」然而，须佐之男却如同听到了什么笑话一般顿了一下，随即飞速走向了天平之下，抬头质问。\n「试问我何等忠心，从不曾做过一件违背天照意愿之事!但又为何，听从天照的意志而行动的我，却落得如此罪孽深重，被判为罪人的下场?」\n「而天照自己，却自称无罪，安坐在王座之上!」他召回了天羽羽斩，神器从蛇神重创的身体中抽出，在他的指示下，环绕在天平四周，剑锋直指天照。\n「天照啊，若我有罪，你亦有罪。若你有罪，众生皆罪!」\n「你们的罪，就由我来处刑!」\n众神为突如其来的变故所震惊。\n但耀眼的光芒从空中浮现，光芒勾勒出透明的结界，天照降落在了众神面前，她挥舞衣袖，结界如光辉般伸展。神卫们也在天照身后展开反击的阵法。\n然而诸神的反抗对武神之首的须佐之男来说，如同螳臂当车。须佐之男惬意地笑着，灵活地翻动着手指，就轻易地驱使着五把巨剑摧毁着刑神场。\n巨剑朝着广阔的高天原飞去，肆意破坏着高天原的一切，横扫众神。只是一斩，就有数百神明被毁去神格，跌落人间。在须佐之男碾压般的屠戮下，众神们只得纷纷奔逃。然而天羽羽斩紧追其后，几乎将众神逼至绝境。\n天照却依然支撑着结界，掩护慌乱的诸神们逃离。\n「你们的太阳女神不会怜悯你们一因为，在我为她犯下罪孽时，她也不曾救赎过我啊!」\n他回过头来，剑锋一转， 指向座下众神。\n须佐之男一脚踩在一名倒地的神官脸上，笑道。正要一击斩下之际，剑身却被光辉的结界抵挡。\n「天照，掩护诸神的去路，你自己要怎么逃呢?」\n「这里是我的土地，这些是我的子民。」天照说道。\n「可你的众神真的值得吗?他们只顾着逃跑，已经选择离开你了。那就让我，来夺走他们吧。」\n说完，须佐之男突然控制着剑尖改变轨道，只见刀刃一转，朝着地面插去，一把利刃直直插入高天原位于云端的土地，转瞬间便生出一条裂缝，另外四把争相效仿，沿着裂缝一把又一-把地插入地面，竞然将高天原的土地一分为二，摇摇欲坠。\n情急之下，天照用神力稳住了身后众神脚下的半边土地，然而另一侧高天原却带着未来得及逃走的神族们，逐渐从云端坠落。但即使有天照的神力稳固，另一半的高天原仍是缓缓下落，天照只得释放更多神力维持。\n「好可怜啊，我的太阳女神。你只能独自面对你曾经所倚仗的、现在正对你持刀相向的武神了。」\n须佐之男自然没有错过天照的危机，趁她支撑整个高天原之时，命天羽羽斩掉头刺向她。\n「收起你的演技，你不是那位贯彻正义的武神。」天照却说道。\n「你很敏锐。」须佐之男竞然停下攻势，转而露出一丝邪恶的笑容。「可已经无济于事了一-」「作为这个世界上罪孽最为深重的人。」他举起手中的天羽羽斩，刀锋一转，五把剑刃一一~指向天照。\n「轮到你来面对，天平的审判了。」\n然而这蓄势待发的一击却被突如其来的落雷击中，神器摔落在地，反噬的力量甚至灼烧了须佐之男的手指。然而雷声并不停歇，--场震耳欲聋的雷暴突然降落在了刑场之上，瞬间劈断了禁锢蛇神的锁链。\n本应殒命的蛇神突然睁开了双眼，然而双目的颜色却并非是紫色，而是和须佐之男如出一辙的金色。\n浑身残破的蛇神出现在了天照的身前，他手中凝聚雷电，接连不断降下雷暴，将须佐之男操控的天羽羽斩一把把击落，直到须佐之男双手都已经焦黑，再难以\n驱动神器上前。「竟然....」像是惊讶丧命的蛇神回光返照般，须佐之男停顿了一下，接着又饶有兴味地说道。\n「哈哈哈，你竟是终于醒来了，可是来和我一同见证这高天原的陌路?」须佐之 男继续道，「但你的身体已是强弩之末，恐怕帮不了你多久。」说罢，又一柄天羽羽斩朝着二人刺去，这一回，雷电已比之前晚了许多，未能将神器击落，二者在空中碰撞，抗衡许久，不分胜负。直到另一道闪电击中了天羽羽斩，神器在闪电的包裹之下突然停顿，转而调转剑锋，将剑柄送入了蛇神手中。\n「用我的脸满口胡言，真是令人恶心。」「蛇神」冷笑道，「我承认你有几分聪明，竟自第一回交手就侵蚀我的神格，之后的数次挑衅，都不过是为了引开我的注意力，最后甚至通过交换灵魂，来让我替你受过。」\n时已至此，「须佐之男」也无心再继续伪装，他放声大笑，将双眼埋在手心，等到再抬起手掌，掌心下的双目已然变成了代表蛇魔力量的紫色。\n「怎么如此无情呢，我的「共犯」啊。」 须佐之男模样的蛇神笑道，「 我不过是终于做出妥协，选择了在你们制定的正义规则之下，重来一场公平对决罢了，须佐之男!」\n二人转而在云层中继续激战，须佐之男驱使雷暴追逐着占据自己身体的蛇神，然而却被蛇神控制的另外五把天羽羽斩挡下。雷云炸裂的白光之中，他握住已经夺回的那把剑，朝着蛇神的胸口刺去。\n然而蛇神却并未躲开，而是笑着用身体接下了这一击。\n「为何不躲?」须佐之男察觉不对，向后闪退一步。\n「既然得到了这具强韧的身体，如何能不炫耀一番?你这前主人难道不想知道，到底要刺多少剑才能让这身体倒下吗?」\n「方才在刑场上对着自己都能下杀手，现在又故技重施，你实在恶趣味十足。」\n「怎么就说我恶趣味。」蛇神冷笑道。「 规则是天照所定，我既遵从，有何不公?善恶是天照所裁，我既受刑，有何不义?我可是为此才来参加这场审判。」\n「倒是多亏你天真的慈悲心，助我一臂之力。」蛇神继续笑道。\n「镇压六恶神时，你全身沾染蛇血，竟能承受那么久都不被我侵蚀。直到我设局在神狱中污染神使，你为了拯救他们，只能亲自接触我的神格，让我成功侵蚀，在行刑时置换了你的神格，把你的身体据为己用。」\n「不过须佐之男，就是我也没想到，你这向来律已的看门狗，杀孽竟会超过我。」须佐之男不以为然，「我说过，我只斩罪人。」随即他握紧手中的剑朝着尚未恢复的蛇神刺去。很快，蛇神的招数就被须佐之男一一破解，剑锋稍偏就将蛇神手中的神器弹开，朝着周围的建筑劈去。\n八岐大蛇决定狐注一掷，放弃了天照和众神们，召唤五柄天羽羽斩同时出现在了须佐之男的头顶。「我倒要看你能撑到几时。」\n五柄剑同时朝着须佐之男劈下，剑锋未到狂风就已将大地劈开，气浪自头顶压下，周围的建筑纷纷倒塌。即便如此，却还是被须佐之男横过剑身稳稳地接住了这一击，但他整个人竟然朝着地下陷没了三寸。\n然而被五把神器贯穿过的身体却早已残破不堪，高举双手接下五剑的围攻令伤口尽数崩开。须佐之男将梗在喉中的鲜红吐出，表情却仿佛无知无觉。他一手推开剑身一手握住剑柄，剑锋滑动在五柄天羽羽斩的刀尖之下，擦出耀眼的火光，竟将五柄天羽羽斩尽数弹了出去，插在了远处的地面上，脱离了蛇神能够控制的范围。\n八岐大蛇见状急忙追去，须佐之男不等他反应，一跃上空中，自空中朝着蛇神的方向掷出了手中的利剑，将蛇神钉在了碎裂的巨石之上。随即手指苍穹，一瞬间空中乌云密布，云层中闪电翻滚，一场巨大的雷暴即将到来。\n蛇神迎风抬起头来笑道，「须佐之男，你要杀我?别忘了，这可是你的身体。」\n「没错，这确实是我的身体。」须佐之男说道，「可你的灵魂，却见不得光。」\n他毫不犹豫地挥下了高举的手，空中的雷电如同得到了号令一般朝着高天原的方向落下，闪电不间断地击中了被钉在巨石上的蛇神。\n然而蛇神却抬起头来，决意和戏谑掩盖了他脸上的痛苦，紧随而来是更深刻的疯狂。「你要斩罪人，不如我来帮你。」\n蛇神伸出右手，一条蛇魔从他的手心滑出，快速缠绕住掉落在附近的一把天羽羽斩，将其抛至蛇神手中蛇神毫不迟疑地举起剑，朝着自己的胸口刺了进去，剑深及脊柱，蛇形的神格剧烈地搏动了一下，骤然变成了须佐之男的神格。\n在那一瞬，须佐之男清楚地看到了八岐大蛇那志在必得的笑容出现在自己的脸上，然而下一瞬，一阵刺痛从胸口传来。他低下头，看见了深深插入胸口的剑身，抬起头来，再度对上了八岐大蛇那志在必得的笑容。\n闪电劈开了地面，碎石从高天原的边界滑落，在坠落的那一刻，须佐之男才切实地意识到，他终于回到了自己的身躯。\n目送须佐之男坠落的身影彻底消失在云间后，八岐大蛇才从半空中落回地面，轻柔地降落在了已经掩护众神撤离的天照面前\n他的步子因为伤口裂开而有些不稳，但这并不影响他轻松的心情，他煞有介事地召回了剩下的五柄天羽羽斩，令他们一个接一个地回到自己的身边，在慢条斯理地做完这一切后，才轻声对天照说道。\n「天照，你所建立的高天原被毁，你所倚仗的武神被你亲自下令锻造的刑具诛灭，现在轮到你为这即将诞生的新世界献上祝福了。」\n天照神色不变。「蛇神，你口中的新世界，遵循怎样的法则而生。」\n蛇神闻言也大笑起来，「法则?」\n「不，天照，在我即将建立的新世界里，神不会给世界定下任何的规矩，世间再不会有什么神的法则。有的，是邪神的意志，我的意志!」\n「在我的意志之下，这世上再也没有能还是不能，只有愿还是不愿。这世上将再无反叛和动乱，想要成为神，想要力量，就尽管来将我击落，将它据为已有。而我，会乐在其中地看着。」\n「蛇神，也许在命运之中原本真有着你所期望的可能性，但这并不是你摧毁这个世界的理由，我也不会允许。」天照却平静地说道。\n「我将从你手中守护这个世界，即使这会使我和他们受千年之难，我也要撑起这半座高天原，使世间的万物生息延续。」天照身前的八咫镜升起，逐渐散发出白色的光芒。\n「我在此预言，巨蛇将被封印禁锢千年。」天照说道，八咫镜的光辉越发明亮耀眼。「而那黎明的转机，也将在千年以后。」\n「你在剥离自己的神力。难道你还妄图维系这摇摇欲坠的世界?」八岐大蛇注视着亮起光芒的天照笑道。「天照，至高无上的太阳女神，为了这即将到来的新世界，请你，就此陨落吧!」\n八歧大蛇同时发动了五把天羽羽斩，朝着天照刺去，然而就在这时，一双手臂挡住了这致命的一击。\n须佐之男以血肉之躯挡住了五把天羽羽斩，他的胸口还插着那把他坠落时带下去的那把剑，另外五把剑也瞬间贯穿他的身体，与骨骼撞击，却也被骨头牢牢卡住动弹不得，喷溅而出的鲜红将剑身染红。\n浑身伤痕的须佐之男如同从炼狱中爬出的恶鬼，周身缠绕着跌落云端时所没有的戾气，然而当他抬起头来，双目却透亮无比，没有丝毫的畏惧，如同光芒万丈的惊雷 。\n他反手握住刀刃，看向蛇神\n「比起天照，」八岐大蛇看到其目光，不由笑道「你这阴魂不散的家伙….….倒是比太阳更加耀眼。]「但是，即使你在阳光下还是高天原的行刑人，等到了夜晚，你也将被罪恶侵蚀，堕落为真正的堕神。」尖锐的蛇骨缠绕上须佐之男的身躯，八岐大蛇再次发动了堕化之力，试图阻拦他的动作。\n须佐之男笑道。「这个世界的因果确实是公平的。它不会原谅你这样的罪人，但也不会原谅我。」\n「而我，依然会为正义行刑。」\n说罢，他不顾一切地驱动已被蛇骨贯穿的双手，生生从胸口的肋骨缝隙中拔出了刺入其中的一把剑。\n「为什么你要做到这个地步?」八岐大蛇终于问道。\n被须佐之男握住的神器找回了它真正的主人，顿时朝着八岐大蛇露出了锋利的獠牙，风暴雷云将太阳隐去，光芒消失在了云雾之中，取而代之的狂风和雷电自雷云中落下，缠绕在了天羽羽斩的剑刃上。\n须佐之男的脸庞却露出一丝悲悯。\n「那当然是因为--」\n一声响彻天地的雷声中，须佐之男一剑贯穿了八岐大蛇的神格。\n「神爱着这个世界。」\n狂风和雷电同时击中了蛇神的身体，他无法再维持人身，化为巨蛇，从高天原的云端跌落。刺穿他神格的天羽羽斩化为巨剑插向蛇头，他扭动着身躯妄图缠住剑身将其拔出，却被利剑贯穿了腹部。\n巨蛇抬头看向云端上那差一点就要毁灭的高天原，以及持剑的行刑人。在他的身后，不祥的乌云笼罩着天空，暗雷滚滚的云层深处，似乎隐藏着什么更深刻的秘密.\n一张巨大的面具从蛇头浮现，为八岐大蛇抵御了部分神器的攻击。「天真的行刑人，你的神格已被我污染，你以为这斩神之剑能如你所愿吗?」\n「感受到罪恶的洗礼了吗?接受我的力量吧!罪孽深重、神圣不再的你，还有资格杀我吗?」蛇头上的面具露出诡异的笑容。\n「那又如何，蛇神，去狭间的黑暗里，享受你的不死不灭吧!」\n「须佐之男，若我被你封印，必将带走这世间的光明，让你困在黑暗中挣扎数干年，直到我解开封印回到人世，再来取你的性命。」\n「在那之前，尽情痛苦，尽情悔恨，尽情诅咒自己，然后在痛苦和悔恨中等待我的归来，到那万物终结再来向我祈求宽恕和救赎。」蛇神的笑愈发疯狂。\n「我拭目以待。」须佐之男冷笑道。「届时，我也会让你明白，你真正的归宿。」\n云层中顿时万雷齐发，无数闪电照亮了黑暗的大地击中了坠落的巨蛇，耀眼的光芒乍现，比太阳更加明亮，如同这世上最转瞬即逝的火焰。\n火焰，光明。\n「你难道..…?」在那一瞬间，蛇神似乎意识到了一个惊天的秘密。「哈哈哈哈，看来快要先等不及的，竟然是我。干年啊，快过去吧，我已迫不及待地要去往世界的尽头，亲眼看看万物和你的末路，须佐之男!」\n云层深处，在雷声的层层回响之中，隐约传来了歌斯底里的笑声，笑声随着蛇神的坠落渐行渐远，最终他以巨蛇缠剑之形，与另外数把天羽羽斩一同跌下万丈高空 。\n在坠落之中，剑尖将人间的土地劈开，划出一条巨大的狭间裂缝，带着巨蛇跌落其中，紧接着裂口被雷云中降下的锁链遮盖，彻底封印了出口。\n大战过后，乌云终于散去，云层中重见光辉，天照依然在将光芒撒向大地，驱散黑暗，今万物复苏，众生见状纷纷祈祷，在一声又一声狂喜的惊叹声中，天照说道 。\n「审判已结束，然而世间却也被邪神侵染。为了万物众生，就让我将神力化作真正的太阳，照亮这个世界，开启新的轮回。\n天照的光辉洒向世界，光明的波纹沿着天照的身体层层生长，如同结晶般将她包裹其中，诞生了最初的太阳。初生的太阳托举起高天原重新升入云端，将永恒的光芒洒向大地，而天照栖息在了太阳之中，太阳那透明的外壳逐渐收紧，变得浑浊，明亮到令世人无法直视其中，将天照的身形逐渐隐去。\n在陷入长眠前，她对世间的子民们说道。\n「从今往后，我将与黑暗同在，互相追逐千年万年而这世上，黑夜即将再临。但你们无需害怕。因为黑暗一定会结束，黎明一定会到来 。」「而太阳，会照常升起。」\n邪神由此坠入人间\n虽被封印在狭间缝隙之中，八岐大蛇不甘言败，而是不停地以巨蛇之躯冲击入口，试图脱离，使大地撕裂，河流改道，其污秽从狭间溢出，给人类带来无尽的灾难 。\n为镇压邪神，守护人世，据传须佐之男曾谴镇墓兽前往人间。被派来下凡看守狭间的镇墓兽，招来数名人类于座下说道 。\n「听从神意，吾为你们带来高天原镇压邪神的法朮用此术可与妖鬼搏斗，待到妖鬼退居他处之后，可在此建立结界，定期举行封印仪式，便能代代平安。」这种既不借用神力，也不使用妖力，而是利用人类自身的灵力与邪恶对抗的法术，被后世称为--阴阳朮 。\n驱使阴阳朮的人类中很快出现了四位灵力强大的领袖，他们带领众阴阳师组建了讨伐八岐大蛇的军队，在狭间上建立了巨大的结界，以镇邪神。\n这片镇压邪神的土地，在千年后成为了繁威的人世之城--平安京 。\n而这四名镇压了八岐大蛇的人类，就是最初的阴阳师。\n四名阴阳师中的三人在此定居，广纳门徒，传授后人阴阳朮之法，其后世子孙与门徒形成了平安京后世的三大家族--贺茂氏、源氏、藤原氏 。\n此后，由源氏看管着封印邪神的禁地，世代训诚绝不可放出邪神，八岐大蛇数次蛊感都失败了，既然谁也不肯为他打开狭间之门，那就反其道而行。蛇神蛊感道，「进奉灵力强大的巫女，我将保平安京繁荣，源氏长威不衰。」\n源氏终于答应。然而容巫女灵魂通过的入口如此之小，远不足以让蛇神离开，蛇神却并不在意，门这种东西和欲望一样，一旦打开了一个小口，只会越来越大，人的欲望，有朝一日，一定会大到众神都不敢想象的地步 。"


