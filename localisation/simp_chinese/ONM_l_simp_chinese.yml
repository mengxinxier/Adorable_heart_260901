  ONM_magic_14_desc: "抽调灵力，为灵力中枢提供能量补充。"
  ONM_Purification_Magic_Circle: "净化法阵"
  ONM_Purification_Magic_Circle_desc: "在平安京重要节点布置大型灵气净化法阵，通过持续运转的阴阳术阵，过滤空气中混杂的邪祟之气，调和失衡的阴阳二气。"
  ONM_Study_of_Ancient_Books: "研读古籍"
  ONM_Study_of_Ancient_Books_desc: "动员阴阳寮中精通古籍的学者，深入研究古代关于阴阳调和的秘术典籍，试图从古老智慧中寻找解决当前危机的方法。"
  ONM_Reappear_Ancient_Magic_Circle: "重现古代法阵"
  ONM_Reappear_Ancient_Magic_Circle_desc: "依据古籍研究成果，尝试复刻上古时期用于稳定天地灵气的强大法阵。"
  ONM_Secret_Art_Inheritance: "秘术传承"
  ONM_Secret_Art_Inheritance_desc: "将研究出的阴阳调和秘术在阴阳寮内广泛传播，培养新一代掌握特殊术法的阴阳师，为平安京储备人才。"
  ONM_Social_Problem: "社会问题"
  ONM_Social_Problem_desc: "平安京社会秩序混乱，民心涣散，我们需要采取措施。"
  ONM_Basic_Guarantee: "基本保障"
  ONM_Basic_Guarantee_desc: "我们只需要尽可能减少国民挨饿的问题。至于其他问题，一概不管。"
  ONM_Decent_Standard: "体面标准"
  ONM_Decent_Standard_desc: "从长远的角度来讲，忽视国民的需求百害而无一利。"
  ONM_Social_Welfare: "社会福利"
  ONM_Social_Welfare_desc: "关注人民的需求是国家最重要的职责。"
  ONM_Class_Economy: "阶层经济"
  ONM_Class_Economy_desc: "优先保障统治阶级，牺牲普罗大众的生活品质。如果他们想改善自己的状况，就得努力工作。"
  ONM_Share_Weal_and_Woe: "同甘共苦"
  ONM_Share_Weal_and_Woe_desc: "我们将为所有人提供平等的机会和资源。每个人都能享受到国家的繁荣成果。"
  ONM_Worship: "供奉"
  ONM_Worship_desc: "我们只值得拥有最好的，他们必须服务，而我们必须享受。"
  ONM_Priority_for_Nobles: "贵族优先"
  ONM_Priority_for_Nobles_desc: "在平安京的古老屋檐下，贵族们掌控着权力与资源。这些高高在上的贵族们坚信，唯有他们的领导，才能带领平安京走出混乱的泥潭。巩固贵族阶级的地位，利用他们的影响力与资源，试图稳定社会秩序。"
  ONM_Luxury_Supply: "奢侈品供应"
  ONM_Luxury_Supply_desc: "对于贵族而言，奢侈品不仅是身份的象征，更是维持社会等级秩序的纽带。保障奢侈品的供应，能满足上层阶级的需求，换取他们对稳定社会的支持。"
  ONM_Above_All: "万人之上"
  ONM_Above_All_desc: "权力集中于一人之手，能更高效地推行政策、解决危机。赋予统治阶级绝对的权威，期望以强大的领导力，带领平安京走出困境。"
  ONM_Priority_for_Elites: "精英优先"
  ONM_Priority_for_Elites_desc: "平安京从不缺乏才华横溢的精英。无论是智谋超群的将领，还是学富五车的科学家，精英们被视作社会稳定的中流砥柱。给予精英优先发展的机会，期望他们能凭借卓越的能力，引领平安京走向繁荣与和平。"
  ONM_Academic_Privilege: "学术特权"
  ONM_Academic_Privilege_desc: "学术界的精英们被视为平安京的智慧源泉。他们的研究成果和创新思想是推动社会进步的重要动力。赋予学术界特权，鼓励他们在各自领域内追求卓越，期望通过科学与技术的力量，解决平安京面临的各种挑战。"
  ONM_Elite_Leadership: "知识改变命运"
  ONM_Elite_Leadership_desc: "在平安京，知识被视为改变命运的钥匙。大力推广教育，让更多人有机会获取知识，期望通过提升全民素质，为社会的长远发展奠定基础。"
  ONM_Priority_for_Commoners: "平民优先"
  ONM_Priority_for_Commoners_desc: "平安京的基石是千千万万的平民百姓，只有满足他们最基本的需求，倾听他们的声音，才能真正化解社会危机，让平安京重归安宁。"
  ONM_Reallocation: "再分配"
  ONM_Reallocation_desc: "贫富差距日益悬殊，成为平安京社会混乱的根源之一。实施再分配政策，将财富从富裕阶层向贫困阶层转移，试图打破阶层固化，实现社会的相对公平。"
  ONM_Labor_is_Glorious: "劳动最光荣"
  ONM_Wealth_Tax_desc: "倡导劳动精神，鼓励全民参与生产建设。宣扬劳动最光荣的理念，激发平民的工作热情，提高生产效率，推动平安京的经济发展。"
  ONM_Maintain_Public_Order: "维持治安"
  ONM_Maintain_Public_Order_desc: "平安京的治安问题日益严重，盗贼横行，民不聊生。加强治安管理，打击犯罪活动，维护社会秩序，是恢复平安京稳定的首要任务。"
  ONM_Crackdown_on_Underworld: "扫黑除恶"
  ONM_Crackdown_on_Underworld_desc: "地下势力在平安京肆意妄为，威胁着正常的社会秩序。对黑社会展开严厉打击，捣毁他们的巢穴，抓捕头目，让秩序重临此地。"
  ONM_Eliminate_Demons: "肃清妖类"
  ONM_Eliminate_Demons_desc: "妖类在平安京四处作乱，给百姓带来无尽灾难。组织强大的阴阳师与武士队伍，对妖类展开全面肃清，守护平安京的安宁。"
  ONM_Distribute_Relief_Food: "发放救济粮"
  ONM_Distribute_Relief_Food_desc: "饥荒的阴影笼罩着平安京，无数平民在饥饿中挣扎。政府必须采取紧急措施，向最需要帮助的民众发放救济粮食，确保他们的基本生存需求得到满足。"
  ONM_Provide_Medical_Care: "提供医疗救助"
  ONM_Provide_Medical_Care_desc: "许多平民因病痛而苦不堪言。政府应当组织医疗队伍，向受灾群众提供必要的医疗救助，帮助他们渡过难关。"
  ONM_Work_for_Relief: "以工代赈"
  ONM_Work_for_Relief_desc: "通过组织平民参与公共工程建设，既能解决他们的就业问题，又能改善基础设施。"
  ONM_Seimei: "晴明"
  ONM_Seimei_desc: "晴明是平安京最强大的阴阳师，他的智慧和力量守护着平安京。"
  ONM_Ruler_of_Balance: "平衡的统御者"
  ONM_Ruler_of_Balance_desc: "晴明的统治理念是平衡与和谐，他相信人类与妖类可以和平共处。"
  ONM_Ruler_of_Wisdom: "智慧的统御者"
  ONM_Ruler_of_Wisdom_desc: "晴明的智慧和远见使他成为平安京的领袖。"
  ONM_Ruler_of_Heiankyo: "平安京的统御者"
  ONM_Ruler_of_Heiankyo_desc: "晴明的领导使平安京在动荡中保持稳定。"

