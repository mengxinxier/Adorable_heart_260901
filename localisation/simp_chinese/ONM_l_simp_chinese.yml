  ONM_Minamoto_no_Raikou: "源赖光"
  ONM_Minamoto_no_Raikou_desc: "源赖光，源氏现任家主，实力强悍的阴阳师。他强调严格的社会秩序和等级划分，认为不同阶层的人应各司其职，各安其位。贵族阶层将享有更多的权力和资源，承担治理国家的主要责任；而平民百姓则需服从统治，通过辛勤劳作来支持国家的运转，每个人都应明确自己在社会中的地位和角色，不得逾越。"
  ONM_Yamata_no_Orochi: "八岐大蛇"
  ONM_Yamata_no_Orochi_desc: "身披蛇影，气息阴冷而压迫，展现出冷漠超然的姿态，令人心生恐惧与敬畏。\n————罪恶，已经在其中生根发芽。"
