##### 顾问 #####
  ONM_Yamata_no_Orochi_trait: "昔日邪神"
  ONM_Yamata_no_Orochi_trait_1: "昔日邪神"
  ONM_Yamata_no_Orochi_trait_2: "八岐大蛇神"

  ONM_Ebisu: "惠比寿"
  ONM_Ebisu_trait: "财富"
  ONM_zi_zhu_jiao: "紫衣主教"
  ONM_Ebisu_desc: "传说中惠比寿能给人们带来财富。可是财富，或者说金钱，真的那么重要吗？如果真的给人们带去财富，这世上是会多了一个幸福的人，还是只是会多一个贪婪鬼呢？惠比寿一直很烦恼这件事情呢。"

  ONM_Kotodama: "言灵"
  ONM_shen_guan: "神官长"
  ONM_Kotodama_trait: "言动"
  ONM_Kotodama_1_trait: "语罪"
  ONM_Kotodama_desc: "由言海所孕育的神明，真言道的古神。生来便继承真言之力，以真言筑造真言道，传授言文。"

  ONM_Fujiwara_no_Michitsuna: "藤原道纲"
  ONM_secretary: "秘书长"
  ONM_Fujiwara_no_Michitsuna_desc: "藤原道纲出身于平安时代的藤原氏家族，是一位沉稳而精明的人类政治家。他以贵族血统为根基，兼具阴阳师的学识与政治手腕，善于在复杂的权力格局中游走。"

  ONM_Shinara: "紫那罗"
  ONM_Shinara_trait: "序之音"
  ONM_big_zhu_jiao: "大主教"
  ONM_Shinara_desc: "远离京都的严岛，曾被长夜笼罩多年。潜伏在黑暗中的妖怪与人类为敌，使得生灵几近灭绝。在绝望之中，紧那罗手执琵琶「玄象」用音乐引导着人们开拓希望的道路。最后，她改写那古老的历法，成为照耀严岛、守护人类的光明。"

  ONM_Enmusubi: "缘结神"
  ONM_Enmusubi_trait: "神赐良缘"
  onm_education: "教育改革家"
  ONM_Enmusubi_desc: "与其他高高在上的神明不同，缘结神更像是邻家女孩，有着人类的丰富情绪。在与人类的相处中，她渐渐理解了缘分真正的寓意。再一次选择相信缘分并决定会努力守护好每一段姻缘。"

  ONM_Miketsu: "御馔津"
  ONM_Miketsu_trait: "丰收"
  ONM_public_leader: "公共工程总监"
  ONM_Miketsu_desc: "生活在高天原的丰收之神，性格温柔平和。"

  ONM_Hamaji: "饭笥"
  ONM_Hamaji_trait: "蓄食待发"
  ONM_apostolic: "使徒"
  ONM_Hamaji_desc: "传说中的食之神明，为消灭饥饿而四处流浪，忠于“吃饱才是正事”的原则。曾经是饿死于郊外的少女，临死前得到高桥羽赠予的饭团，死也要吃到的执念使之脱离阴阳轮回，与高桥羽探险后终于吃到温暖的美味，生命得以圆满，才成为传说的食之神明。"

  ONM_Onikiri_Hime: "妖刀姬"
  ONM_Onikiri_Hime_trait: "幽锋"
  ONM_security: "国家安全顾问"
  ONM_Onikiri_Hime_desc: "手持巨大妖刀的少女。原本是人类，却不知为何与妖刀相互依存。平时看上去有些阴郁，也很少会和他人说话。但战斗时却会变成另一个人，残暴又恋战，没有人能躲过她的妖刀，刀下亡魂累累，平静下来后，她又会因伤害了太多人而自责。有时候「强大」并不是一件好事，必须有承受和控制这份「强大」的能力才行。"

  ONM_Innaba_Hime: "因幡辉夜姬"
  ONM_Innaba_Hime_trait: "愿满夜"
  ONM_zi_zhu_jiao: "紫衣主教"
  ONM_Innaba_Hime_desc: "自明月诞生的月宫公主，为月之民抚养，却拥有一颗温暖的心。曾因保护月姬遭司正流放，但也因此在平安京拥有了真正的生活。如今流放之期将至，拒绝遗忘的辉夜姬怀抱因幡兔坠落，先前赠予月之羽姬的愿力被尽数归还，月宫的公主终于恢复了自己的力量。眼见月宫冰冷依旧，回眸注视守护在自己身旁的众人，因幡辉夜姬做出了自己的抉择————她会给予冰冷的月宫，一个温暖的未来。「比起那个冰冷的世界，你们更重要。」"

  ONM_Season: "季"
  ONM_Season_trait: "四时一隅 春"
  ONM_groupie: "狂信者"
  ONM_Season_desc: "暴食恶神野椎神吞噬四季后诞生的神明，四季的意识和化身。虽与恶神的神格二位一体，却拥有世间至善、至美、至爱的本心。季与春惜之国的春夏秋冬同生共死。每当她逝去，此季凋亡，而后与新的季节一同复生。为了夺回被涂炭的四季，倾其一生与恶神抗争，只为迎来四季流转依旧，生灵不再饥徨绝望的时代。尽管恶神始终视她至亲，她亦不愿再记起「鹿尾野姬」的赐名。因为，唯有「季」，真正诠释了她未诞的过往，和绚烂的今生。"


##### 三军部长 #####
  ONM_Ryuuaku: "龙珏"
  ONM_Ryuuaku_desc: "龙珏，昔日云华统领之女，幼年目睹母亲被刺，自此流离失所，漂泊四方。虽浪迹天涯但拜得名师，得其真传，而龙珏亦砥砺意志，终领悟武学巅峰境界。历经沧桑，龙珏击败祸乱云华的煜天，她建立龙息堂，教授云华城子民有力自保。多年流浪，云华城是龙珏心之所系，魂牵梦萦的故土。她与天地，与云华，与自己许下坚定之诺————无论未来何许，必挺身而出，护云华安宁。"

  onm_n_tdxs: "提灯小僧" #陆军改革
  onm_n_tdxs_desc: "提着夜灯的小和尚，脸庞红彤彤的。常常会出现在夜晚的街道上，来回地奔跑着，提醒人们注意安全，如果看到了提灯小僧，一定要注意安全。因为他的警告，可都是非常灵验的哦。无论何时，多加小心是不会有坏处的。"

  ONM_Taki: "泷"
  ONM_Taki_desc: "「黄金爪号」大副，无可挑剔的「王牌掌事人」。做事圆滑周到，为人滴水不漏，深受一众船员信赖。凭借开阔的眼界与丰富的阅历，以及独到绝佳的鉴宝手腕，他也被称赞为航海界的「公子」。航行海上，「黄金爪号」被他管理得井井有条，但对于他的野心而言，「黄金爪号」一时的成就只是小小的起点。他要做的，是将全船共同创造出的荣光，永恒地延续下去。"

  ONM_Great_Tengu: "大天狗"
  ONM_Great_Tengu_desc: "面容清秀，背上长有翅膀的大天狗。擅长吹奏笛子，他的笛声能使人心情平静。性格固执而冷傲，因此也很容易被人利用、误入歧途。但实际上是个很有原则、也非常正直的妖怪。一旦认定了自己的主人，就会十分忠心。"



##### 陆海军将领 #####
  
 ##### N卡 #####
  onm_n_dlg: "灯笼鬼"
  onm_n_dlg_desc: "灯笼化成的妖怪，里面就是灯火。身体上有一个大窟窿，常常担心自己的灯火会被风吹灭。个性单纯，就算说谎也会自己先说漏嘴。不仅可以照明，还会帮忙看家哦。就算只是一盏灯，也在为了家而好好努力呢。"



  onm_n_cs: "赤舌"
  onm_n_cs_desc: "栖息于河川的水生妖怪。拥有红色的大舌头和四只眼睛。性格顽皮，偶尔会去别人家的稻田中取水。但是却会在关键的时刻，保护稻田和人们。知恩图报可是很重要的，连妖怪都懂得这样的道理。"

  onm_n_dmxg: "盗墓小鬼"
  onm_n_dmxg_desc: "以盗墓为生的妖怪戴着斗笠，从不露出自己的面容。去过很多的墓穴，也经历过很多灵异的事情，偶尔会讲起自己的经历，每一件都很惊险。比起盗取墓中的物品，更好奇幕中人的故事。所以最吸引人的不是财富，而是未知的东西。"

  onm_n_tzsy: "唐纸伞妖"
  onm_n_tzsy_desc: "纸伞化成的妖怪。伞面的颜色已经有些旧了，看上去应该是被人遗弃很久了。眼睛留着血泪，似乎非常地悲伤。作为一把伞，也许最幸福的时候，就是为人们遮风挡雨的那一刻吧。"

  onm_n_jsh: "寄生魂"
  onm_n_jsh_desc: "没有自身实体的妖怪，平时看上去只是淡红色的灵体。但是可以附身和寄生在其他的妖怪或人身上，从宿主身上获得能量，还能操纵他人活动。不过常常被宿主的友人发现、赶跑。一个人是没办法完全代替另一个人的，看来妖怪也是。"

  onm_n_txgl: "天邪鬼緑"
  onm_n_txgl_desc: "额头两侧长着鬼角，拥有绿色皮肤的妖怪。常常出现在热闹的地方，喜欢惊吓人类，有时也会抢走人们的东西来故意激怒他们。如果制止它的话，它会用背后的羽子板反击，虽然有些调皮，但遇到它的话也不必担心。只要对它宽容一些，它就会很温顺。"

  onm_n_txgc: "天邪鬼赤"
  onm_n_txgc_desc: "通体发红的妖怪，体型巨大，长有獠牙。手中的剑玉既是它的玩具，也是它的武器。曾经居住在山中，过着安稳的生活，后来却被人类驱赶出了自己的家园。因此对人类怀有敌意，会主动攻击人类。有时也会模仿人们的言行举止来诱拐小孩子。要远离这种危险的妖怪，才能保证安全呢。"

  onm_n_txgh: "天邪鬼黄"
  onm_n_txgh_desc: "手持鼓锤的小孩子，坐在一只魔鼓当中。性格有点胆小，看到陌生人就会逃走。平时都躲在地板下，夜深人静的时候才会出来，然后开始挥舞着鼓锤「咚！咚——！」地打鼓，吵得人们不得安宁。但如果有人找到了它，它就会停止演奏，还会把脑袋藏到鼓里面去，以为不会被发现。不过其实这样，根本就藏不住呢。"

  onm_n_txgq: "天邪鬼青"
  onm_n_txgq_desc: "手里拿着风筝的女孩。一般出现在森林中，一边跑一边放风筝。但由于森林中树木茂密，经常会撞到树上，风筝也很难飞起来，但偶尔也会成功。她会乘着风筝，嘲笑还在地上的其他妖怪，有时候还会往下扔脏东西呢。不过像这样欺负他人的人，最后是一定会从高空中摔下来的哦。"

  onm_n_zs: "帚神"
  onm_n_zs_desc: "扫帚化成的妖怪。性格有些调皮，但却十分勤劳。它经过的地方，都会被打扫得干干净净。不过有时候也会故意把人们扫好的落叶堆搅得乱七八糟，还一脸得意。真是让人无可奈何的妖怪呢。"

  onm_n_tb: "涂壁"
  onm_n_tb_desc: "看起来就像一面普通的墙壁，但其实是不折不扣的妖怪哦。会突然出现在人们面前，挡住大家的去路，如果试图绕过它，它就会跟着一起动起来。不过并不是没有办法破解哦，只要狠狠地踹向它的墙根就好了。这就是所谓「要从根基开始击溃」吗？"

 ##### R卡 #####

  ONM_Koi_Girl: "鲤鱼精"
  ONM_Koi_Girl_desc: "鲤鱼化成的妖精，可爱的人鱼少女。天真烂漫，不知忧虑为何物。还未察觉这世界的阴暗面，因此对所有人都很友善。可是感情上却有一点点迟钝，分辨不清他人对她的善意、或是恶意。有时希望她变得敏锐和清醒一点，有时也希望她能保持那份天真。"

  ONM_NineLife_Cat: "九命猫"  
  ONM_NineLife_Cat_desc: "长着猫耳朵和猫尾巴的猫娘，连说话的时候都会在句尾加上「喵」因此就算是生气起来，也毫无震慑力。可是性格却很难缠，要小心不要惹到她。万一惹到了的话，也许温柔地摸摸她的脑袋会有效哦？毕竟无论多么暴躁，到底也还是可爱的小猫。"

  ONM_Lady_of_Chou_Hour: "丑时之女"  
  ONM_Lady_of_Chou_Hour_desc: "一手拿着草人，一手拿着木锤的少女。笑容十分灿烂，看上去很可爱。但说的话、做的事情，却让人毛骨悚然。她所拥有的诅咒之力，和她对杀戮的渴望，都不是一个平常的少女应该有的。不知道她曾经历过什么事情，让她从一个可爱的少女变成这副模样。"

  ONM_Shouzu: "椒图"
  ONM_Shouzu_desc: "坐在贝壳之中，人身鱼尾的少女。对人间的一切都充满了好奇心，似乎十分喜欢这个世界。不过这个世界其实并没有她想的，那么美好和充满惊喜。但也正是这样，才会在遇到美好的时候，觉得格外惊喜呢。"

  ONM_Mountain_Rabbit: "山兔"
  ONM_Mountain_Rabbit_desc: "拥有可爱外表的兔妖。平时坐在一只魔蛙上，常常对魔蛙撒娇，有时候还会欺负它。也许是知道自己很可爱，所以稍微有些任性。要小心不要被她捉弄了哦？不过就算被捉弄，看在她这么可爱的份上，还是原谅她吧。"

  ONM_Shining_Grass: "萤草"  
  ONM_Shining_Grass_desc: "手中拿着萤草的可爱少女。看上去十分柔弱、性格也是这样。不过却一直在努力支持自己的同伴，不希望自己成为累赘。同时也一直都在关心和照顾小伙伴们。其实比起「真的能够帮到忙」，「想努力帮大家」的这份心情，已经很棒了哦。"

  ONM_butterfly: "蝴蝶精"  
  ONM_butterfly_desc: "居住在梦境世界的蝴蝶妖精。用自己的鼓声去指引在梦中迷路的人们。有时也会一边演奏一边起舞，十分可爱。如果在梦中迷失了自己的话，不用害怕，小小的蝴蝶精一定会来到身边，请仔细听她那沙拉啦啦啦的演奏声吧。"

  ONM_Akuro: "垢尝"
  ONM_Akuro_desc: "垢尝常常出现在脏兮兮的角落，看似是在污秽中诞生的妖物，实际是有洁癖的小家伙，无比热衷于打扫卫生的妖怪。曾在严岛生活过一段时日，听不见紧那罗琴声以后四处流浪。倘若在城中一隅遇见，请不要因外表而误解他哦。"

  ONM_HeTong: "河童"
  ONM_HeTong_desc: "水生妖怪河童，住在京都附近的水池里。喜欢的人是鲤鱼精，这一点除了鲤鱼精，应该所有人都看出来了吧。也不知道这算是幸运还是不幸呢。如果再有自信一点，能把心意告诉她就好了。但或许对于河童来说，能守在鲤鱼精的身边，已经足够幸福了呢。"

  ONM_YaTianGou: "鸦天狗"
  ONM_YaTianGou_desc: "和大天狗一样，同属于天狗。因翅膀像乌鸦一般漆黑，被称为「鸦天狗」。戴着面具，手持长刀，常常自夸能力超凡，却被大家无情地戳穿。不过比起吹嘘自己的能力，朝着口中那样厉害的自己，不断的努力才是最重要的呢。"

##### SR卡 #####

  ONM_Peach_Blossom_Demon: "桃花妖"  
  ONM_Peach_Blossom_Demon_desc: "桃花化成的妖怪，活泼温柔的少女。对她来说，樱是十分重要的好友。她见证了樱的爱情，也一直担心樱受到伤害。樱失去了爱人之后，她也作为友人、支持和保护着樱，并决定和樱共同生活下去。樱能得一友如此，实乃一件幸事。对于桃而言，能保护重要的友人，也很幸福。"

  ONM_Vampire_Princess: "吸血姬"  
  ONM_Vampire_Princess_desc: "面容苍白，背后长有蝙蝠翅膀的少女。曾经有幸福的家庭和爱护她的父母。但却在某一天突然失去了这一切。以血为食的她，难道不会感到害怕吗？或者恶心，又或者是已经麻木了？不知道是得到过又失去了比较不幸，还是从一开始就没有得到过比较不幸呢。"

  ONM_TwoMouthed_Woman: "二口女"  
  ONM_TwoMouthed_Woman_desc: "少女模样的二口女，总是在说着“对不起”。其实很想与他人亲近，也很想结交朋友。但不知道怎么回事，身边的人总是会……一个一个接连不断地消失。她也觉得很迷茫，明明自己什么都没有做。那是因为，在她的脑后……有奇怪的东西，千万不要去看她的脑后哦"

  ONM_Cherry_Blossom_Demon: "樱花妖"  
  ONM_Cherry_Blossom_Demon_desc: "樱花化成的，美丽的妖怪。住在樱花林中，性格温柔坚强，她与花瓣共舞的姿态美得令人惊叹。她曾有一位温柔的爱侣，却失去了他。还好尚有挽回的余地，轮回转世之后，她与她的爱人或许还能再见。"

  ONM_Spider_Woman: "络新妇"  
  ONM_Spider_Woman_desc: "面容美艳，身形却十分可怕的妖怪。曾是远近闻名的美人，最后却化身为怨灵蜘蛛。因为被所爱之人背叛，便对世间的所有男人都充满怨恨。恨意蚕食着她的身体，还有心。无论曾经多么美丽，一旦被仇恨所控制的话，都会变得面目全非。"

  ONM_Uozumi: "海坊主"
  ONM_Uozumi_desc: "鱼头人身的妖怪。有鱼尾巴，以及长长的胡子。如果有暴风雨来临的话，会去提醒船夫们。但是总有人不相信他的劝告。所以有时候，听听他人的劝诚也是很重要的，说不定会有很大的帮助呢。"

  ONM_GoldFish: "金鱼姬"
  ONM_GoldFish_desc: "可爱的小妖怪，生活在荒川。似乎和荒川之主有些不愉快，但和辉夜姬是好朋友。梦想是统治世界，但不会对陌生人轻易提起自己的梦想。每一天都在为了统治世界而努力加油。"

  ONM_Whale: "化鲸"
  ONM_Whale_desc: "失去母亲后孤独地死去的幼鲸亡灵。会在雨夜跑进人类的村子寻找母亲，吹响海螺将他认为是母亲的渔民的妻子引入海中溺死。而再次变回一个人的他只能孤身一人，回到黑暗的海中，继续地徘徊着，等待下一个雨夜。"

  ONM_XieJi: "蟹姬"
  ONM_XieJi_desc: "蟹姬蟹生三件事，吃饭，睡觉，打食材。吃饱了就能睡个香香的午觉。睡好了才可以精神百倍地开始捕猎！但是说到捕猎的话……似乎是不要被当成食物抓走更重要呢。"
  
  ONM_Soul_of_The_Deep_Sea: "灵海蝶"
  ONM_Soul_of_The_Deep_Sea_desc: "诞生时便被抛弃的体弱多病的孩子，多年前流落到铃鹿山，被大岳丸救起，在那里度过了一段快乐而短暂的时光。直至久病难愈，魂归蔚蓝寂海。世事流转变迁，山麓沉海，浊海化净天，无数同样流浪的小小海灵拼凑成新的身体，她便抱起尚未送出的礼物，乘着潮汐，循着月光的指引，踏上回家的路。"

  ONM_Tuan_Jin: "湍津姬"
  ONM_Tuan_Jin_desc: "著名冒险船「黄金爪号」上的王牌水手、第二厉害的冒险家————湍津姬一向是这样介绍自己的。是一条因为长不大而被逐出族群的小鲨鱼，与巨大的章鱼「金八爪」相依为命。被泷收留下来，从此在「黄金爪号」安了家，虽然总是和泷斗嘴，但内心里十分崇拜泷的力量，把他当做哥哥。胃口大得出奇，孩子气又暴躁，缺乏人类常识，野蛮感十足。具有鲨鱼凶猛的天性，在极为信任的人面前，才会流露出脆弱的一面。"

##### SSR #####

  ONM_Suzuka_Gozen: "铃鹿御前"  
  ONM_Suzuka_Gozen_desc: "于大海漂泊多年，想得到统领海妖的力量。却在看似弱小的人类身上，知晓何为「家人的羁绊」。经历了失去「家人」的痛苦，她决定回到大海深处，完成自己的目标。于是，曾经称霸大海的铃鹿御前，与大岳丸和众多海妖一起，建造了名为「铃鹿山」的家"

  ONM_Kaguyahime: "辉夜姬"  
  ONM_Kaguyahime_desc: "沉睡在竹节中的少女。偶然才被人们发现，因为相貌清丽、性格温和，而受到大家的疼爱和照顾。平时有些沉默不语，也常常一个人待在房间里。"

  ONM_Red_Spider_Lily: "彼岸花"  
  ONM_Red_Spider_Lily_desc: "居住在冥界的妖怪。外表美艳动人，性格却难以捉摸。她美丽的身影常常出现在三途川边的彼岸花海中。虽然她曾经在人界生活过，但却很少提起自己的过去。"

  ONM_Mask_Spirit: "面灵气"
  ONM_Mask_Spirit_desc: "最初少女得到面具时，只是把它们当做朋友。后来面具们却察觉到了少女内心的脆弱，少女在面具们的蛊惑下，原本清澈的心变得逐渐黑暗……最终,少女与面具融为一体，成为妖怪面灵气。"

  ONM_Chihime: "千姬"  
  ONM_Chihime_desc: "大海的尽头，冰霜冻结的永生之海，高傲而美艳的鲛人公主守护着她的族人。数百年的冰封无法动摇她的决心，怀抱着最虔诚的守护之心，越战越勇，最终千姬用最后的一首歌，唤醒永眠的大海，鲛人缔结了新的约定，朝未来而行。"

  ONM_Shuten_Douji: "酒吞童子"
  ONM_Shuten_Douji_desc: "传说中站在鬼族顶点的妖怪。曾经冷静而残酷，具有王者风范。但现在却整日借酒消愁，除了酒，再也没有什么能够引起他的兴趣。他所钟情的红叶也对他毫无好感，不过逃避终究会有结束的一天，昔日的酒吞童子总会归来。"

  ONM_Ibaraki_Douji: "茨木童子"
  ONM_Ibaraki_Douji_desc: "十分强大的妖怪，一只手臂被鬼切砍下。一直追逐着酒吞童子。对他来说，酒吞童子既是唯一的友人，也是他心目中最欣赏的男人。但酒吞童子却对他的示好毫不在意，不知他何时才能再次和酒吞童子一起，在那森林中，对酒当歌，如同往昔。"

  ONM_Onikiri: "鬼切"
  ONM_Onikiri_desc: "曾经是源氏家族最强大的斩妖兵器。清冷寡言但正直。将主人源赖光作为毕生信仰，忠心耿耿地守护并敬爱着。在大江山退治中为源赖光挡下鬼王的致命一击。后来当他斩断茨木童子的鬼手时，发现了一个惊人的真相。"

  ONM_Imari: "一目连"
  ONM_Imari_desc: "沉默而寡言，用头发遮住了一只受伤的眼睛的青年。陪伴着他的只有他身后的龙。曾是守护一方水土的风神。而如今却堕为妖怪。到底是什么让他放弃了作为神明的高贵？或者又是，神放逐了他？"

  ONM_Fushigi: "不知火"
  ONM_Fushigi_desc: "曾经是离岛闻名天下的歌姬阿离。有着绝美的容颜，歌声与舞姿令无数人一见误终生。每当她演出，海面上点亮的渔灯连天蔽海，仿佛传说中的大妖怪————不知火。在一个美丽而残酷的夜晚，在即将失去生命的时候，她与传说合二为一。她成为了歌姬————不知火。"

  ONM_Shoukaku: "帝释天"
  ONM_Shoukaku_desc: "天人一族的帝王，光明纯白，温柔圣洁，冷静飘逸，足智多谋。在曾经肃杀战乱的天域，帝释天与战神阿修罗并肩而战，他们一同守护天域，讨伐进犯边境的鬼族。他们一同终结了天人与鬼族千百年的战争。帝释天的心自始至终从未改变。他坚信，终有一日，永世的和平将会到来。"

  ONM_Asura: "阿修罗"
  ONM_Asura_desc: "天人一族的最强战神。曾是整个天域的英雄、奇迹与希望。暴虐嗜杀、桀骜不驯、勇敢直率、凶猛霸道。长时间战斗会变为疯狂杀戮的鬼神。自诞生的那一刻，他就是黑暗之子，却被光明中那温暖圣洁的白色吸引。然而，天魔所至之处皆将毁灭。世人将不再惧怕魔神、恶鬼、黑暗和伪善。取而代之的，是他的名讳————阿修罗"
  trait_onm_asura: "炼狱虐杀"
  trait_onm_asura_desc: "我所至之处，皆得毁灭."

  ONM_Oitsuki: "小鹿男"
  ONM_Oitsuki_desc: "半身是人，半身是鹿的妖怪。从小便是孤儿，父母被人类所害。孤独的他，却没有放弃寻找伙伴的信念。有了伙伴之后，应该会比一个人的时候，要轻松很多吧？同伴可是非常重要的哦，一定要好好珍惜。"

  ONM_Shiratsuyu: "白藏主"
  ONM_Shiratsuyu_desc: "梦山中的白狐，化作俊美的少年行走人间。清澈的眼睛仿佛对一切都充满好奇。天性纯真善良，对人类充满信任，但却被复杂的人类所欺骗。人类的心，到底是怎样的呢？"

  ONM_Fushigiyama: "不见岳"
  ONM_Fushigiyama_desc: "古老山岳间，有一位山一样清冷的少年，他沉默寡言，孤独地守护着万物生灵。闲时与石龟游乐，或随旅人登山踏青。不解山下风潮，却一直聆听众人的声音。他常常遥望云雾缭绕的山巅，似乎在守望着什么重要之物。然而，每当人们问起他的过往，他总是以歌诉情，不再多言。"

  ONM_Nekokawa: "猫川"
  ONM_Nekokawa_desc: "远近闻名的豪商，经营着名为「猫川别馆」的温泉旅店。关于他的传言很多，许多人认为他不好相处，唯有初见的时候和颜悦色————那正是他撬动你财富的手段之一。传说在旅馆过夜，会发生奇怪的事。但客人们都不太记得具体发生了什么，唯有疗愈的感受异常清晰。因此仍然顾客盈门，大概就是老板的手段吧。「只要他想做的生意，没有做不成的。」"

  ONM_YunWaiJing: "云外镜"
  ONM_YunWaiJing_desc: "流传于世的神器，也是有生命的镜子。据说曾因力量过于强大，就一分为二，藏于不同的地方。眼目所见，便能在镜中世界完美重现。"
  trait_onm_yun: "云岸净空"
  trait_onm_yun_desc: "时时拂拭，勿惹尘埃。"

  ONM_PingJiangMen: "平将门"
  ONM_PingJiangMen_desc: "曾经是平氏的天之骄子，鲜衣怒马的少年将军。追寻着无分贵贱的常世乐土，有一颗金子般的心。但胜利的征伐的背面，却是无尽的杀戮与迷茫。邪马台的僭神大国主乘虚而入，利用了他随着勇武征程悄滋暗长的暴虐。他逐渐成为立于尸骸枯骨之上，内心也毫无波澜的疯王。然而，他的心并没有就此死去，他的抗争也从未止歇。王将决心以自身的鲜血祭旗，他将在这场与自己的战斗中，赢取最终的胜利。"

  ONM_HuangKuLou: "荒骷髅"
  ONM_HuangKuLou_desc: "守诺可靠的骷髅将军，霸气野性但并不张扬，更像是厚重的山峦，见惯生死的内心仍有可贵热血。生前是平将门最信任得力的大将，为平氏征战四方，号称「平氏的铁壁」。在生死一线的行军途中， 与大妖彼岸花交易，求其救自己士兵性命，代价是付出灵魂堕为花泥。长期的花海岁月，消磨了荒骷髅曾经的力量，却从未能侵蚀他的意志。他一直在等待心中的军旗，重新飞扬的那一天。"

  ONM_XueYvQian: "雪御前"
  ONM_XueYvQian_desc: "既有龙胆幽玄之美，也有冰雪凌厉之姿的「巫女剑圣」。当平氏的烈焰呼啸而来，焚尽四野。在深渊之畔，她以己躯冲破桎梏，将剑刃执于掌中。雪落无声，剑过无痕——优雅而果决的身姿中，清冽的灵力与锐利的剑锋相融，终抵至臻之境。灿然绽放的龙胆冲破火焰，千里冰封，璃花开遍。最洁净的雪是未冷的火，最灼目的火是未化的雪，冰与火的共振与永烬便在此刻。她孑然一身，踏雪前行，战局，由她逆转。"

  ONM_HuangChuanZhiZhu: "荒川之主"
  ONM_HuangChuanZhiZhu_desc: "荒川的守护者与主宰者。经历过岁月变迁、沧海桑田，荒川流域一直平静而繁荣。虽然他是个专制的暴君，却不得不承认他的实力足以称王。他却很少有笑容，也许无上的权力带给他的，并不是快乐。"

##### SP #####
  ONM_HeartHunting_Onna_Momiji: "心狩鬼女红叶"
  ONM_HeartHunting_Onna_Momiji_desc: "她生来便被当作振兴家族的棋子，一味的压抑和顺从，换来的却是被至亲之人抛弃于红叶林。也许一生本该如此结束，但她心有执念难以消解，最终由人化妖。六道之门开启，妖气弥漫，祸乱世间，面临绝境，红叶迫不得已反噬恶妖，但最终也被邪气侵蚀，身体急速腐朽。疯狂的举止之下，自我逐渐迷失，一切仿若走向末路。而若想破解困局，则须循心而行，这一次，她做出了自己的选择。"



  


