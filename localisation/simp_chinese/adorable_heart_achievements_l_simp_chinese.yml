  ##钢铁萌心成就-亚洲
  03_AdorableHeart_achievements_asia: "钢铁萌心成就-亚洲"
  AH_achievements_Oriental_Red_NAME: "东方红"
  AH_achievements_Oriental_Red_DESC: "§L东方红，太阳升，中国出了个......§!\n\n扮演@PRC§Y中国共产党§!，统一全中国"
  AH_achievements_Earl_of_Glamorgan_NAME: "格拉摩根伯爵"
  AH_achievements_Earl_of_Glamorgan_DESC: "扮演§Y国民政府§!，使蒋介石成为国家领导人，控制南威尔士"
  AH_achievements_big_house_NAME: "德州大豪斯"
  AH_achievements_big_house_DESC: "扮演中国的任意一个势力，控制德克萨斯州"
  AH_achievements_Tiger_Tiger_Tiger_NAME: "虎！虎！虎！"
  AH_achievements_Tiger_Tiger_Tiger_DESC: "扮演§Y辽满政府§!，走虎妞线，占领夏威夷"
  AH_achievements_bluesky_whitesun_and_world_is_red_NAME: "青天白日全球红"
  AH_achievements_bluesky_whitesun_and_world_is_red_DESC: "扮演@ROC§Y广州国民政府§!，让全世界只有共产主义国家"
  AH_achievements_CHI_108_army_leader_NAME: "神州108将"
  AH_achievements_CHI_108_army_leader_DESC: "§L大河向东流哇，天上的星星参北斗哇......§!\n\n扮演§Y神州帝国§!，在§Y组织现代化军校§!国策中同时为至少§Y108§!位将领增加属性"
  AH_achievements_I_wont_wear_kimono_NAME: "再练我也不会穿上和服的"
  AH_achievements_I_wont_wear_kimono_DESC: "扮演§Y阿斯特莱雅§!，将百地希留耶的将领等级升到9级"
  AH_achievements_ROC_always_watching_you_NAME: "我会一直盯着你……"
  AH_achievements_ROC_always_watching_you_DESC: "§L谁说伟大的识之律者女士不懂情报工作？你的每一个念头，本小姐早就看得一清二楚啦！§!\n\n扮演@ROC§Y广州国民政府§!，让§Y识之律者§!担任国家领导人，并完成全部§Y情报部门升级§!。"
  AH_achievements_ROC_always_watching_you_agency_tt: "完成所有情报部门升级（§Y31/31§!）"
  AH_achievements_ROC_one_more_card_NAME: "再换一张卡就睡觉"
  AH_achievements_ROC_one_more_card_DESC: "§L明天再打仗，今晚先把这手政策卡配出最优解……再换一张就睡，真的！§!\n\n扮演@ROC§Y广州国民政府§!，累计拥有至少§Y30§!张政策卡，并在全部政策卡槽位均已装备卡片的状态下统一全中国。"
  AH_achievements_ROC_reunit_china_tt: "成功统一全中国"
  AH_achievements_ROC_one_more_card_count_tt: "累计拥有至少§Y30§!张政策卡（当前：[?ROC_policy_owned_card_count|Y0]）"
  AH_achievements_ROC_one_more_card_full_slots_tt: "全部已解锁政策卡槽位均已装备政策卡"
  AH_achievements_ROC_borrow_italian_cannon_NAME: "楚团长，借你意大利炮一用！"
  AH_achievements_ROC_borrow_italian_cannon_DESC: "§L“二营长！你他娘的意大利炮呢？给我拉上来！”——这回直接开到罗马城下原厂提货。§!\n\n扮演@ROC§Y广州国民政府§!，在拥有将领§Y楚云飞§!的状态下控制§Y罗马§!（傀儡控制也可完成）。"
  AH_achievements_ROC_red_star_dragon_robe_NAME: "姐姐的红星，妹妹的龙袍"
  AH_achievements_ROC_red_star_dragon_robe_DESC: "§L一顶乌萨斯的红星，一袭大炎的龙袍；跨过西伯利亚与长江的，终究是血脉相连的姊妹。§!\n\n扮演@ROC§Y广州国民政府§!，由§Y陈晖洁§!建立§Y大炎王朝§!，与§Y塔露拉§!领导的@SOV§Y苏维埃联盟§!结成同盟并完成国策§Y莫斯科-南京！§!。"
  AH_achievements_ROC_yan_empire_tt: "已建立§Y大炎王朝§!"
  AH_achievements_ROC_hurry_up_hu_NAME: "老胡，你倒是快死啊！"
  AH_achievements_ROC_hurry_up_hu_DESC: "§L为了解锁清波寨与识之律者，指挥官已经把胡宗南一个人派去单挑敌军师团十次了……§!\n\n扮演@ROC§Y广州国民政府§!，触发§Y胡宗南§!战死转线事件，并由§Y汤汤§!或§Y识之律者§!完成各自路线终章国策（§Y清波寨的未来§!或§Y民国，如常运作§!）。"
  AH_achievements_ROC_hurry_up_hu_kia_tt: "已触发§Y胡宗南§!战死转线事件"
  AH_achievements_ROC_train_station_is_safe_NAME: "火车站很安全，真的"
  AH_achievements_ROC_train_station_is_safe_DESC: "§L这一次，沪宁铁路的站台上没有枪声，只有高呼宪政与选票的人群。§!\n\n扮演@ROC§Y广州国民政府§!，由§Y宋娇仁§!担任国家领导人并完成国策§Y天下为公§!，控制§Y上海§!，且§Y民主主义§!支持度不低于§Y70%§!。"
  AH_achievements_ROC_democratic_70_tt: "§Y民主主义§!支持度不低于§Y70%§!"
  AH_achievements_ROC_advantage_is_mine_NAME: "优势在我！"
  AH_achievements_ROC_advantage_is_mine_DESC: "§L“八十万对六十万，优势在我！”——这一次，微操大师终于把纸面兵力变成了真正的胜利。§!\n\n扮演@ROC§Y广州国民政府§!，由§Y胡宗南§!担任国家领导人并完成国策§Y蒋介石的真正继承人§!，统一全中国，且现役陆军总人力达到§Y80万§!。"

