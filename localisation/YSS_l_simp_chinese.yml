 YSS_gy_5_desc:0 "扩建首都周边的窑厂和水泥生产线，补上各地工地常年短缺的建材缺口。"
 YSS_gy_6:0 "中央大区冶金工业集团"
 YSS_gy_6_desc:0 "将中央大区分散的小高炉和轧钢车间编入统一体系，稳住联盟最基础的粗钢产出。"
