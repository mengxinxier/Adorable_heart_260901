 YSS.47.d: "致：《人民报》编辑部\n\n同志们：\n\n刚翻了贵报近三期的文艺副刊，有两处实在看不过去。\n\n第三版连载的《红海日出》写红军战士肉搏，架势很足，可写到弹尽粮绝时，主人公竟从怀里摸出一本《共产党宣言》替自己挡下了子弹，随后喊着“为了联盟”跃出战壕。编辑部诸位应当明白，马克思主义是革命学说，不是护身符，更当不了防弹钢板。把英雄事迹写成神怪戏法，不但唬不住敌人，反倒叫识字的读者笑话。\n\n还有第五版那首《拖拉机颂》，通篇把拖拉机比作“钢铁的骏马”“大地的情人”。词藻倒是花哨，可诸位不妨打听一下，全联盟眼下总共才几台拖拉机？乡下农民大半辈子只见过瘦耕牛，连拖拉机长什么样都没摸过，你让他们怎么跟着“颂”？\n\n报纸是给工农看的，不是给亚的斯亚贝巴咖啡馆里的文人互相捧场用的。建议编辑部抽几个人，去提格雷的铁矿和锡达莫的棉花田住上一个月，跟着工人农民同吃同干活，弄明白他们真正在意什么，再回来动笔。\n\n致以同志的问候。"
 YSS.47.a: "门柯思图"
 YSS.48.t: ""
 YSS.48.d: "致：国家经济统筹委员会、各人民委员部\n\n同志们：\n\n经济建设年度指标调整案经过政治局三次讨论、各部两轮修改，我逐条看完了。大方向同意提交中央全会复核，但以下四处必须改过。\n\n第一，重工业指标定得太满。草案要粗钢和煤炭产出三年翻一番。可全国能开火的高炉屈指可数，老底子全是旧帝国留下的修理摊子；提格雷矿区得按期扩产、亚的斯亚贝巴焦炭不能断、铁路运力得翻倍——这三件事哪一件有十成把握？指标往下压三成，留点余地。到时候超额完成了算本事，完不成丢的是中央的脸。\n\n第二，农业集体化要求三年覆盖全国六成农户，这数字多半是在屋里按算盘打出来的。去问问国木田花丸，这阵子建起来的集体农庄究竟站稳了多少？有的春天挂牌，秋天就散了伙。集体化看实效，不看好看的百分比。改成“在条件成熟的地区稳步推进，不设全国硬指标”。\n\n第三，国防工业写得太虚，通篇只有一句“加强军工生产”。把步枪、火炮、弹药的年产数写实在，新建几座兵工厂、改造哪几座老厂，一件件列出来。红军正等着用家伙，装备绝不能断档。\n\n第四，也是我最不满的一条。整份方案满纸都是吨数、台数、厂房数，唯独看不见人。工人住哪儿？吃什么？病了往哪儿送？孩子在哪儿念书？我们搞工业化是为了让工人农民日子有奔头，不是为了往年鉴里凑一串数字。如果炼出来的钢要靠工人饿着肚子、农民交出救命粮去换，那这份计划从根上就错了。\n\n统筹委员会按这四条改，十天内交修订稿。国家计划不是关起门来念账本。\n\n致以同志的问候。"
 YSS.48.a: "门柯思图"
 YSS.49.t: ""
 YSS.49.d: "致：内务人民委员部、中央调查委员会\n\n同志们：\n\n机场破坏案刚一破获，我就接到几份反映：个别办案组一抓起顺藤摸瓜便没了边际，连不懂政治的老机修工和刚毕业的测绘员也一并扣进了审讯室。政治局反复权衡后，决定把内务部在军工与技术部门办案的权限收进规矩里。这不是翻旧账，也不是否定你们查出真破坏分子的功劳；恰恰相反，抓敌人越狠，手上的分寸越不能乱。\n\n具体三条，即日起执行：第一，内务部今后实施逮捕、搜查、查抄，须事先拿到中央调查委员会或同级检察机关的书面批条；情况紧急可先控制，但四十八小时内必须补齐手续。第二，严格区分蓄意破坏与技术失误，凡涉党员及专业技术骨干的案件，一律移交中央调查委员会复核，不准凭口供草率定性。第三，在押人员的羁押期限、审讯笔录和申诉渠道，严格照《联盟刑事诉讼法》办；凡搞刑讯逼供的，查实一个，按反革命罪办一个。\n\n我知道内务部里会有同志心里不痛快。你们替联盟挡掉了不少暗箭，这份苦劳中央认账。可同志们也要想明白：一个革命政权要是管不住自己的专政机关，把宝贵的技师和飞行员都逼得人人自危，那它跟旧帝国的秘密警察又有多大分别？抓敌人是为了让百姓和前线睡安稳觉，不是为了自毁长城。\n\n谁有意见，按组织程序往上提，但不许磨洋工，不许在底下发怪话。内务部依然是联盟的刀，只是握刀把的手必须是政治局，不能是任何个人或单个部门。\n\n致以同志的问候。"
 YSS.49.a: "门柯思图"
 YSS.50.t: ""
 YSS.50.d: "致：联盟文化委员 帆楼同志\n\n帆楼：\n\n前几天走了几家工厂和机关，碰见桩不起眼、却叫我有点在意的事，顺手写封信跟你提个醒。\n\n从1910年那个夜里起，你跟着大伙儿一路走到今天，办报、兴学、排戏，二十多年没挪过窝。你鬓角比当年白了不少，做事还是那股细劲儿，我心里一直有数。\n\n这回下去转了转，发现不少人嘴上已经不太习惯叫“同志”了。有叫科室主管“老爷”的，有喊厂长“长官”的。头一回听见我以为是老工人改不了口，后来连着在几个单位都听见，才觉得不像偶然。\n\n文化战线的事你比我敏感。一声称呼改不了钢产量，也少不了红军一颗子弹，可嘴上叫顺了什么，脑子里往往就还留着什么。是旧习气太厚，还是底下某些干部自己就受用这一套，我拿不准，只是觉得这苗头不能放任。\n\n这几年文化口的风气慢慢正过来了，你的苦劳我都看在眼里。我只是把听见的话原样转告你，具体要不要发个通告、排几出戏点一点，你自己拿主意。老同志了，分寸你比我有数。\n\n对了，听说前些晚你又在审核室盯剧本盯到天亮。戏排慢两天误不了大事，身子熬坏了可没人替你顶。别学我这个坏榜样。\n\n保重。"
 YSS.50.a: "门柯思图"
 YSS.51.t: ""
 YSS.51.d: "致：战争姬元帅同志\n\n战争姬同志：\n\n国防工业人民委员部刚刚挂牌，第一批军工整顿单子就压了下来。趁这空当给你写几句：统一战争之后，红军留下来的摊子千疮百孔，外头盯着，里头绊脚，你把主干稳住、把日常整训一点点往正轨上拉，中央看得很清楚。旧军队里走出来的将领不少，可像你这样既有真本事、又肯替联盟扛事的没几个。\n\n不过有句话我得直说。打垮旧皇帝靠一夜政变，把共和国换成联盟靠一场硬仗，唯独改军队不是一朝一夕能逼出来的。整编往深处推，旧派干部软顶硬抗少不了，也有不少老兵油子转不过弯。我知道你性子急，眼里容不得沙子，可部队的事既要立军法，也得给底下留出改过和消化的工夫。火候过了，反而容易把能用的人推到对立面去。\n\n往后办事，不管是兵工厂交货拖了后腿、军费被卡了脖子，还是哪个省的干部敢对军区指手画脚，你直接递条子给我。别总憋着自己硬扛，挡在建军路上的石头，中央替你挪。\n\n你这阵子在亚的斯亚贝巴和各军区之间来回跑，作息全乱了。大仗还没真正打起来，陆军的主心骨先把身子跑垮了可不行。闲下来多歇半晌，往后要你压阵的硬仗还长着呢。\n\n保重。\n\n致以同志的问候。"
 YSS.51.a: "门柯思图"
 YSS.52.t: ""
 YSS.52.d: "致：杏寿郎同志\n\n杏寿郎同志：\n\n总军事建设局报上来的军工基建清单和航空兵近况简报，我都看完了。平心而论，看之前我早有心理准备，看完还是压不住火。今天不谈别的，单就你对航空兵事务的敷衍，咱们把话说透。\n\n这阵子你帮着盯陆军兵工厂扩建和地面装备配套，确实下了苦功，这我认账。可杏寿郎，你是不是忘了，联盟的领空同样归你管？你的心思全扎在地面师旅和步炮产线上，对分管的航空兵却冷淡得叫人费解。航油配给一团乱麻、飞行员全年飞不满几个钟头、偌大个红军航空兵连个满编中队都凑不出来——这些报告压在你的案头多久了，你究竟翻过没有？\n\n看看我们四周是什么处境：圣杯王国的侦察机随时能擦着红海飞过来，周边列强的机场就修在眼皮底下。没了制空权，陆军在地上拼死拿下来的阵地，一轮轰炸就能炸成平地。把空军当成可有可无的附庸，这是极短视的失职。\n\n工业底子薄、军费紧，这些话不用你提醒我。没人指望你明天就变出一支堪比欧陆列强的战略空军。可家底穷是一回事，撒手不管、听之任之是另一回事。航空部门的人在漏雨的机库里还在琢磨怎么攒出能飞的简约机型，你这位分管空军的高级将领，给过她们几句支持，批过几笔实在预算？\n\n写这封信不是为了在纸上训你一顿解气，是要你把屁股挪正。别只盯着地面那几条战线，天上漏了洞，地上谁也守不住。回去把空军那几份积压报告逐页翻一遍，想清楚自己到底躲了什么难。\n\n下周这个时候，我要在办公桌上看到由你牵头拟出的联盟空军整顿与建设计划。不要空话，要时间表、要指标、要人选。"
 YSS.52.a: "门柯思图"
 YSS.53.t: ""
 YSS.53.d: "致：蝴蝶忍同志\n\n忍：\n\n上个月下小雨那天，我第三次登你的门。提了两罐新茶，本想借着谈新工业区扩建的图纸，顺便坐下来叙叙旧。警卫员挡在门口支支吾吾，说你今天不方便见客。我从门缝瞥见客厅灯还亮着，屋里却半点动静没有，只好把茶叶搁在门廊下走了。\n\n这已经是第三回。头一回托病，第二回敲了半晌，里头只听见什么东西摔在地上。说不介意是假话——我不是来催公文的，只是老朋友登门喝杯茶，何至于次次吃闭门羹？\n\n听说你近来酒喝得很凶，门口常堆着空瓶子。若是工程上的难处压得透不过气，你递句话就行，不必自己闷着扛；若是别的什么事放不下，这么多年交情，你连跟我开口都不肯了吗？\n\n我不是来数落你的。谁心里都有绕不过去的坎，可关起门对着酒瓶子熬夜，总归不是法子。我未必替你解得了结，陪你坐半个钟头、听你发发牢骚还是可以的。\n\n实在不愿见人，我也不逼你。只是哪天清醒些了，托人捎个字条回来，哪怕只写一句“我还好”。\n\n旧友，"
 YSS.53.a: "门柯思图"
 YSS.54.t: ""
 YSS.54.d: "致：娜塔莎\n\n娜塔莎：\n\n前天你托人送到办公室的那罐蜂蜜茶，秘书泡了一壶，总算把这几天嘴里的烟苦气压下去了些。\n\n听来送茶的警卫说，你近来气色比上月好多了，院里那拨来识字的姑娘也熟络起来，见着你就围着说笑。这点我一向比不上你。我成天板着脸训人，昨天连阿诺德那样闷头干活的老实同志都被我骂得抬不起头；你却总有本事让生人卸下防备。\n\n我这边还是老样子，案头的公文削不平，会一场接一场。今天刚听完汇报，某个军区的装备缺口又比上月大了两成。我在会上发了通火，散会后坐在椅背上，又觉得发火也生不出枪和炮来——可若不发火，底下便觉得中央好糊弄。\n\n其实没什么要紧事。只是这几天夜里起风，气温落得快，你晚上翻书别挨着窗坐，记得多披件衣裳。我这边一切照旧，吃得下也撑得住，就是偶尔忙完抬头，觉得这间书房修得实在太宽敞，一个人坐着显得空。\n\n写完这半页纸，心里倒松快了不少。灯还亮着，你收到时多半已经晚了，早些睡吧。\n\n晚安，娜塔莎。"
 YSS.54.a: "门柯思图"
 YSS.55.t: ""
 YSS.55.d: "致：小原鞠莉小姐\n\n小原鞠莉：\n\n明天下午的日程全部推掉。能顺延的往后挪，挪不开的请千歌同志代为主持。有人打听，就说我身子不舒坦，闭门静养。内务部那边我亲自打过招呼，你不必操心。\n\n不用问去哪儿，也别派警卫车跟着。备一辆不挂牌的普通轿车，司机挑嘴严的。顺便把衣柜里那件旧灰大衣找出来，别拿显眼的制服。\n\n明天是国木田花丸的生日。你多半也看见了，集体农庄铺开之后，农业人民委员部的卷宗越摞越高，她白天往乡下跑，晚上蹲在办公室核田亩和粮账，常常熬到后半夜。上周勤务员送文件回来跟我学，说她桌上凉透的咖啡杯摆了一整排。当面问她睡得怎样，她咧嘴只说“还行”——眼白都熬红了，还嘴硬。\n\n她从1910年起就跟着我走南闯北。那年皇宫外巷子里乱枪扫过来，她替我挡过流弹，我也背着她淌了半条街才躲进暗巷；后来去提格雷乡下做调研，回来整个人脱了形，瘦了十几斤。劝她保重，她总笑嘻嘻打哈哈；如今位子高了，反倒连自己的生辰都记不住。\n\n所以明天我自己去一趟。不带随从，不搞排场。我让厨房偷偷烤了点点心——别往外说出处——再带瓶葡萄酒，敲开她的门，看着她坐下来吃两口，道声生日快乐就走。对付她这种听不进劝的死脑筋，只能人直接堵到门口，把盘子搁在她案头。\n\n我出门之后，办公厅的事你看着兜住。普通访客一律挡回去，真有火烧眉毛的急事，请千歌同志转达。你办事向来稳妥。\n\n替我守口如瓶。"
 YSS.55.a: "门柯思图"
 YSS.56.t: ""
 YSS.56.d: "致：联盟国家主席 千歌同志\n\n千歌同志：\n\n今天政治局会上气氛不对，散会后我在屋里多坐了半个钟头。当我拍着桌子要求彻查贵族残余、绝不再退半步时，对面几张脸立刻沉了下来。没人当场反驳，可那种互相递眼色的沉默，我太熟了。\n\n党内外近来对我议论不少，我心里清楚。被撤了职的地方干部私下咒骂，丢了田产特权的旧势力恨得牙痒，连几位老同志也觉得我下手太重、把局面绷得太紧，背地里议论我像个不讲情面的暴君。\n\n他们没说错，我确实得罪了不少人。只是这些话吓不住我。\n\n给你交一句底：我知道，我死后，有人会把一大堆垃圾扔到我的坟上，但历史的风会毫不留情地把这堆垃圾刮走。\n\n有人盼着我早些倒下，好往我名头上扣一顶独裁者的帽子。随他们去吧。你是国家主席，外事周旋、院内调停这些吃力不讨好的活儿全压在你肩上，你的难处我明白，也谢你替我挡了不少明枪暗箭。但到了大是大非的节骨眼上，我退不了，也不打算退。\n\n不必替我忧心。把眼前的事做完，剩下的留给后人去评。"
 YSS.56.a: "门柯思图"
 YSS.57.t: ""
 YSS.57.d: "致：娜塔莎同志\n\n娜塔莎同志：\n\n昨夜在农业人民委员部清完最后几摞各省农庄和合作社的粮账，出来已是深更半夜。车过恩托托山脚时，不知怎的忽地想起你。回到住处泡了杯热茶，实在睡不着，索性提笔写几句。\n\n前几天你托人捎来的茶叶收到了，谢你惦记。我这人粗枝大叶，忙起来常拿凉面包对付，有口热茶压一压强得多。顺带跟你交代件事：前些日子总书记不知从哪儿摸到我的新住址，下着晚风一个人提着酒和点心来敲门，说是给我过生日。我屋里乱得连下脚的空都没有，被她数落了一通，硬逼着吃了两块点心她才肯走。这事八成也没瞒过你。\n\n说句心里话，这两天翻看各省报表，我忽然生出个念头：原来在她接手之后，这个国家已经走了这么远的路。\n\n把1910年的旧档和今天的亚的斯亚贝巴摆在一块儿看，反差吓人。当年这里还是个连外交都做不了主的破落帝国；如今钢铁炉子点起了火，乡下办起了农庄和合作社，国家总算有了自己的骨架。从前我们把皇帝拉下马，却花了二十五年都没动得了乡下的一根毫毛；真正把地契、铁轨和枪杆子交回百姓手里的，是她，而且全挤在短短这几年里。\n\n外头开会的人只见她拍桌子、下严令，脾气越来越硬。我跟了她二十多年，如今才算真看明白，她那副总挺得笔直的身板底下，到底扛着多沉的担子。\n\n娜塔莎，话说到这份上，算老战友托付你一件事：旁人劝不动她，只有你的话她肯听进半句。家里多拉着她歇一歇，别由着她整夜靠咖啡顶着。顺便替我带句话——国木田花丸嘴上总爱跟她顶牛，可这条命是当年她从枪林弹雨里背出来的。只要她还在前面顶着，脏活累活我照单全收。\n\n望你们俩都平安。"
 YSS.57.a: "国木田花丸"
 YSS.58.t: ""
 YSS.58.d: "致：联盟国家主席 千歌同志\n\n千歌同志：\n\n有句话在政治局会上没讲，写下来留给你看。\n\n近来偶尔闲下一刻，总会琢磨：我们这代人这样拿命硬熬，最后究竟能给后来人留下些什么？\n\n不少人眼皮子浅，只盯着眼下谁握权、谁分利，看不清自己站的是哪段门槛。可再过几十年，后人的目光一定会回头打量我们今天做过的事、打过的仗。他们会沿着我们蹚出来的印子接着往前走，也会拿着今天的账本来衡量我们的成败。\n\n我们干的活儿，不止是清掉几个旧王公、补上国库里的窟窿。阿克苏姆昔日也阔过，那点体面全靠奴隶的骨头和佃农的血汗垫着。今天我们要在同一块高原上立起另一套规矩——没有老爷，也没有农奴。宪法再怎么扯皮，三年计划再怎么磕绊，只要根扎在工农身上，把旧时代遗留的烂摊子扫干净，底子就能站稳。\n\n路不好走，也得咬牙走到底，绝不回头。但愿往后翻史书的人看见这一页，能说一句：那帮人没把旗子举歪。\n\n共勉。"
 YSS.58.a: "门柯思图"
 YSS.59.t: ""
 YSS.59.d: "致：炭治郎同志\n\n炭治郎同志：\n\n昨夜收到你从南部发来的报告，农业合作社推得不顺，字里行间全是压不住的疲惫和灰心。你问，社会主义真正落到这片土地上，究竟还要等多少年？\n\n炭治郎，你还年轻，冲劲足，这是好事。但作为共事多年的长辈，今天我得把话跟你交实底：我们必须认清一个躲不开的事实——理想与现实之间，往往横着一道连续而巨大的沟壑。\n\n这道沟壑，不是哪一两个干部软弱挖出来的，也不是开两场大会就能填平的。千年的封建旧账、盘根错节的宗族关系、积重难返的官僚习气，再加上我们自己经验不足，全都堆在一处。我们想用二十来年走完别人两三百年才熬过去的路，哪有不摔跟头、不流血的道理？亲眼看着纸上的蓝图落到乡下走了样，心里发堵、发慌，再正常不过。\n\n可沟壑横在眼前，并不意味着路断了。要是嫌难就停步，或者图省事向地方老爷让步，那前些年倒在战壕里的人就白死了，我们跟旧时代的军阀政客也就没了区别。\n\n别指望马克思主义是本照着念就能万事大吉的经书，它是拿来一点点啃硬骨头的工具。正因为眼前到处是泥坑和破绽，才轮得到我们这些人去干——要是世道原本就太平完满，还要革命做什么？\n\n歇口气，把南部那几个闹得最凶的村子逐一摸清，该谈的谈，该办的办。跨过这道沟注定脱层皮，可跨不过去，后面就没有路。\n\n我在亚的斯亚贝巴等你的下一份报告。\n\n致以同志的问候。"
 YSS.59.a: "门柯思图"
 YSS.60.t: "关于民族问题上的错误倾向"
 YSS.60.d: "致：中央组织局、各民族地区党委\n\n同志们：\n\n最近案头上攒了一叠来自厄立特里亚、阿法尔和索马里的材料，有地方党委报的，有内务部特派员递的，也有普通党员寄来的信。摊开一看，问题扎眼得很。我也不绕弯子：我们不少干部，在民族问题上拉偏架。\n\n什么叫拉偏架？嘴上念着民族团结，真办起事来，屁股全坐在多数民族那边。提格雷的干部派去阿法尔，张口闭口照提格雷的规矩压人；阿姆哈拉的干部去了索马里，嫌人家话听不懂、礼拜勤、习俗怪。更不像话的是，个别地方党委分灌溉水、批商路牌照、断部落纠纷时，明目张胆偏帮本族，把少数民族合情合理的诉求硬压下去，还美其名曰“顾全大局”。这不是顾全大局，这是亲手把人往敌人怀里赶。\n\n想想我们国号里为什么还留着“阿克苏姆”几个字。我们既不是阿姆哈拉一族的党，也不是提格雷或索马里的党，而是全联盟劳动者的党。少数民族的工人、佃农、牧民，一样挨过旧帝国的鞭子，一样在1910年出过力，一样在统一战争与建设里扛过枪、流过汗。谁拿民族出身分亲疏远近，谁就不是布尔什维克，不过是把旧皇帝“分而治之”的老套路拾回来接着用。\n\n还有一拨干部，专爱替自己本族撑腰，自以为重情义，其实最害人。今天你借权势替本族抢了水渠，明天邻族就敢拖欠公粮，后天边境上就有人给外国探子带路。一旦把民族仇怨点着，最先引火烧身的，正是这帮自以为得计的“护短人”。中央绝不许任何人打着民族旗号划地盘、拉山头。\n\n中央决定三条：第一，各民族地区主要负责人一律实行回避制度。阿法尔的党委书记不由阿法尔人出任，索马里的行政首长不由索马里人出任。这不是信不过少数民族干部，反而是为了让他们到更宽阔的地方施展手脚，免得陷在乡亲宗族的烂泥里。第二，凡查实偏袒本族、压制他族的干部，不管资历多老、功劳多大，一律先查再撤。第三，各地党委近期召开民族工作专题会，把歧视和偏帮的旧账摊在桌上说清，不许和稀泥。\n\n民族问题是联盟的命门，谁敢在这上面动歪心思，就是刨联盟的根。\n\n致以同志的问候。"
 YSS.60.a: "门柯思图"
 YSS.61.t: "关于从城市看农村的错误思想"
 YSS.61.d: "致：中央宣传部、农业人民委员部、各级党校\n\n同志们：\n\n我们这支干部队伍有个通病，今天必须摊开讲清楚：绝大多数人是在亚的斯亚贝巴、哈尔格萨、摩加迪沙这些城里念的书、入的党、当的官。城里的马路、工厂、报馆摸得门清，出了城门，对田埂、水井、牲口棚和部落议事会却一窍不通。不懂可以学，要命的是不懂装懂，坐在办公室里拍着桌子往乡下发号施令。\n\n刚翻过几份地方汇报，越看越气人。有一份写某县农民“思想落后，抵触集体农庄，需加大宣传”。我叫内务部下去核实，结果呢？人家压根不是不肯入社，是入了社连来年下地的种子粮都被公家收走了，一家老小眼看要断顿，换你你积极得起来？还有份材料指责某地牧民“抗拒征购，觉悟低下”。再一查，征购价压得比集市低了一半，卖一头羊换不回一双靴子。这种账，坐在城里吹电扇是算不出来的。\n\n同志们得记牢：城里端上桌的每口饭是农民种的，厂里纺的每寸棉是农民摘的，红军身上穿的军装也是乡下养羊种麻换来的。你们在会议室里念报表、画曲线时，可曾想过背后压着多少农户的生计？连一头牛怎么喂、一亩地几时下种、旱年怎么熬都答不上来，凭什么动辄指责农民“落后”？\n\n更危险的是，这套“从城市看农村”的眼光已经拐进了政策里。有人私下鼓吹，要赶工业化进度，农村就该多交粮、多出人，等城里富起来再说。这不是社会主义路线，这是变相盘剥农民。工业化是为了让全联盟过上像样的日子，不是让城市骑在乡村脖子上吸血。拿农民饿肚子换来的工厂，盖得再高也站不稳。\n\n我定三条规矩：第一，各级党校从下期起，所有城市出身的学员必须下乡住满三个月，跟农民同吃同住同下地，回来交一份实打实的调查报告，糊弄过关的一律不予结业。第二，中央宣传部抽调一批记者、作家、画家常驻农牧区，写乡下真实的光景，别成天关在城里编什么“田园牧歌”。第三，各人民委员部但凡拟定涉农政策，必须先征求农业人民委员部和当地党委意见，不准几个城市干部关起门拍板。\n\n农民不是联盟的累赘，是联盟立身的根。忘了这一条，就不配当我们的干部。\n\n致以同志的问候。"
 YSS.61.a: "门柯思图"
 YSS.63.t: "关于党员革命性质的秘密报告"
 YSS.63.d: "一份绝密材料摆上了门柯思图的案头。材料指出，转入和平建设之后，党内早年的锐气正在迅速消退：不少老党员握权之后沾染了官僚习气，讲究排场、贪图安逸；更棘手的是，一些人开始在私下里非议中央路线，党内风气已显出松动迹象。"
 YSS.63.a: "嗯...让这位同志好生休息，中央会考虑这些问题的。"
 YSS.64.t: "核对党内文件"
 YSS.64.d: "为了摸清全党底细，中央下令突击交叉核对建党以来的全部人事档案、履历表和入党介绍信。一大批伪造出身、涂改旧史的记录接连露了馅，各级机关里的空气骤然紧绷起来。"
 YSS.64.a: "看来确实有必要清理一下“垃圾”。"
 YSS.65.t: "隐藏在身边的反对派"
 YSS.65.d: "档案核查揭出的问题比预想的深得多。除了潜伏的外来探子，更棘手的是混在党政军要害部门里的“同路人”与两面派：会上喊口号比谁都响，底下却暗中搜集黑材料、串通旧势力，等着挑拨发难。"
 YSS.65.a: "其实，如果我们自己做的更好，那反对派又能干什么呢？"
 YSS.66.t: "关于内务部干部存在的懈怠迹象"
 YSS.66.d: "连本该最讲铁纪的内务人民委员部也出了毛病。一部分掌着生杀大权的干部开始居功自傲、贪图享受，甚至公器私用、借机排挤同僚，对中央发下去的指示阳奉阴违。"
 YSS.66.a: "对其进行整顿。"
 YSS.67.t: "对国内反动势力的评估报告"
 YSS.67.d: "综合评估显示，各地失势的旧贵族、被分了地的富农和心怀怨望的地方官僚正在私下搭线。她们四处造谣、借机煽风点火，指望着把局势搅浑，再趁乱翻盘。"
 YSS.67.a: "借题发挥一下或许不错。"
 YSS.68.t: "鹿角理亚的报告"
 YSS.68.d: "鹿角理亚递上了深化党内纪律审查的执行方案。报告语气克制，先列举了部分基层单位纪律涣散、作风滑坡的实情，随后指出常规思想教育已难以应对隐蔽渗透，建议在现行体制内收紧审查程序，有步骤地甄别并清退队伍中的不稳定分子。"
 YSS.68.a: "立刻揪出那些反革命分子。"
 YSS.69.t: "鹿角理亚的报告"
 YSS.69.d: "鹿角理亚的第二份报告列出了近期的肃反数字：数个反革命地下网被连根端掉，大批涉案人员落网。但报告后半段话锋转冷——人抓完了，根未必断了，漏网者只会藏得更深；思想上留着缝隙，党组织迟早还会被蛀空。"
 YSS.69.a: "党的内部必须保持纯洁。"
 YSS.70.t: "鹿角理亚的报告"
 YSS.70.d: "审查一旦触及地方实权，阻力立刻摆上了台面。鹿角理亚在第三份报告里点明，多位地方负责人正打着“维持稳定”的幌子软顶调查，暗地里互为掩护、抱团护短，已经直接撞上了中央的权威。"
 YSS.70.a: "中央的权威不容置疑。"
 YSS.71.t: "鹿角理亚的报告"
 YSS.71.d: "面对盘根错节的地方官僚，鹿角理亚这回倒没有急着硬撞。她在报告里直言，一口气撤换全部地方大员只会让基层政务瞬间瘫痪；不如先从外围副职和边缘人手调离审查，利用地方派内部原有的裂痕逐个拆解。"
 YSS.71.a: "不急。"
 YSS.73.t: "新的敌人"
 YSS.73.d: "一批更加隐蔽的反对者正在体制内冒头，她们不喊反动口号，只盘算着从里头悄悄把联盟变了颜色。该收手还是继续挖，中央必须拿主意。"
 YSS.73.a: "继续查！"
 YSS.73.b: "适可而止吧。"
 YSS.74.t: "新的斗争"
 YSS.74.d: "明面上的旧阶级大多已经打散，可博弈并未画上句号。境外列强和流亡反动派仍不死心，正换着法子通过思想与人事渠道往党内安插代理人。新一轮暗战已经开始了。"
 YSS.74.a: "继续查！"
 YSS.74.b: "适可而止吧。"
 YSS.75.t: "名单"
 YSS.75.d: "鹿角理亚把一摞厚实的卷宗放在桌上。里头是一份长长的名单，密密麻麻列着数百个名字——不少人曾是联盟的元老功臣，甚至此刻就坐在内务部和中央委员会的办公室里。每个名字后面都跟着几行冷冰冰的红字批注。屋里静得听得见挂钟走字，签字的钢笔停在纸页上方，迟迟没有落下。"
 YSS.75.a: "剪除这些毒瘤！"
 YSS.75.b: "适可而止吧。"
 YSS.79.t: ""
 YSS.79.d: "致：中国共产党中央委员会 毛润芝同志\n\n尊敬的毛润芝同志：\n\n冒昧致信，请多包涵。原想着写得正式些，可一想到您是在农民占绝大多数的国度里把革命打胜的前辈，倒觉得不必拘泥于外交辞令了。\n\n近来夜里翻文件，我常忍不住琢磨一件事：我们那场革命，是不是抢得太急了？当年若不那么仓促，多花十年在乡下扎根，等工人阶级真正长出气候再动手，今天是不是不至于如此吃力？我们急着把红旗插上皇宫屋顶，却直到现在还在四处找能稳住旗杆的土。\n\n有时我甚至怀疑，当年根本不该在那个节点发动政变，而该等封建土地关系在工业冲击下自己松动。马克思讲生产力决定生产关系，我们一群没啃过几本理论书的年轻人，企图拿一场政变直接跨过整个历史阶段，这算不算狂妄？\n\n可转念又清楚，世道从没给过我们慢慢等的机会。圣杯王国不会等我们发育，幻想乡不会等我们建齐工厂，国内旧势力更不会坐看我们从容培养出一批红军干部。所谓“成熟条件”，真要干等，早被敌人连根掐死了。\n\n顾虑很多，但我并不后悔。这条路难得要命，可左右看去，能走通的也只有这一条。\n\n我清楚门柯思图算不上什么完人。手上沾过血，签下的命令让不少人吃尽苦头，在旁人眼里多半还是场荒唐赌局。只是这副担子既然已经扛上了肩，我就没打算半道撂下。\n\n向您请教在落后农业国如何跨过阶段建成社会主义，并非我手里毫无章法，而是想听听像您这样斗了更久的人，瞧出我这套办法里还漏了哪几处要害。我并不怕犯错——只要我还没倒下，联盟就得一步步往前挪。我盘算的，还远不止眼前这一步。\n\n盼复。\n\n致以同志的敬礼。"
 YSS.79.a: "门柯思图"
 YSS.81.t: "我们的基础设施遭到了破坏"
 YSS.81.d: "交通委员会递来了急电。随着土改铺开，几个省的基层彻底失了控：激进分子挑动农民分完地主家产还不罢休，转身拿公共设施撒气。好几条干线铁轨被撬走，桥梁拆下来当盖房的木料，电报杆和铜线也被当成“旧官府的耳目”拔了个精光。多地运输和通讯一夕中断，面对赶来质问的特派员，带头的人却理直气壮，一口咬定这是在“砸烂旧世界”。"
 YSS.81.a: "铁路可以修，路走错了没法修。"
 YSS.82.t: "我们的工厂设施遭到了破坏"
 YSS.82.d: "几个主要工业城市同样出了乱子。激进工会带着工人接管厂房后，不仅赶跑了行政主管，连留用的工程师和老技师也一并打成“阶级敌人”轰出了车间。没人懂参数和规程，留守工人盲目开机，几台进口精密机床当场报废，锅炉炸毁，甚至有一家纱厂起了大火。中央派去稳住生产的专员被堵在办公楼里，外头只管高喊“工人自己做主”，谁的指令也不听。"
 YSS.82.a: "把工程师请回来，一个都不许少。"
 YSS.83.t: "我们的社会秩序遭到了破坏"
 YSS.83.d: "不少基层乡镇已经滑进了无政府状态。群众撇开司法机构自设“革命法庭”，动辄私刑处决，不少无辜百姓和基层干部惨遭错杀。失了地的地主残余、土匪和地方宗族趁乱拉起流氓武装，也打着红旗趁火打劫，偏远县镇接连爆发了流血械斗。"
 YSS.83.a: "革命法庭，也得由革命来管。"
 YSS.85.t: "第二次大革命宣告胜利"
 YSS.85.d: "这一关总算咬着牙闯过来了。盘踞乡村数百年的王公地主阶级被连根拔除，耕地第一次写上了佃农的名字；党内盘根错节的山头与蛀虫也挨个清了出去，中央政令终于畅通无阻。代价沉重得让人喘不过气，但靠着中途及时勒住缰绳，联盟终究没有滑进失控的深渊。旧秩序的架子已经拆净，新国家正一砖一瓦立起来。这一场用血和汗换来的翻身仗，正如门柯思图所说——是我们应得的。"
 YSS.85.a: "我们应得的！"
 YSS.87.t: "革命失败"
 YSS.87.d: "不知是动员出了岔子，还是基层早已寒了心。轰轰烈烈的大革命刚一启幕，各地群众却始终按兵不动，只是冷眼看着中央忙前忙后，无人响应。"
 YSS.87.a: "我的同志们都在哪？"
 YSS.89.t: "革命失败"
 YSS.89.d: "失控的浪潮反过来把联盟吞没了。各地陷入彻底的混乱，工厂停摆，农田荒芜，土匪四起。中央的政令早出不了亚的斯亚贝巴城门，各省挂着红旗的“革命委员会”干的却是割据土皇帝的勾当。中央试过弹压，也试过安抚，到头来才绝望地发现，手里已经抓不住任何东西。我们原以为把地分出去、把旧老爷打倒，新世界就会顺理成章地长出来，却忘了拆房子只需要一把火，盖房子要的是规矩和秩序。当愤怒烧毁了铁轨和机床，这场运动便再也收不回来了。"
 YSS.89.a: "是我们做的不够好..."
 YSS.90.t: "我们取得了胜利"
 YSS.90.d: "炮声终于在阿克苏姆的群山与红海沿岸停了下来。贡德尔的皇室旗帜落了地，东非港口的意呆莉军舰狼狈撤走。从亚的斯亚贝巴的街巷到东部刚收复的种植园，到处挂起了红旗。\n\n十三年分裂画上了句号。北方的复辟王冠和东部的殖民总督府一并成了历史，这片高原第一次真正握在了自己人手里。\n\n列宁同志说过，夺取政权只是头一步。今天我们靠刺刀把敌人撵了出去，明天就得靠炉火、铁轨和粮仓，把这座千疮百孔的国家撑起来。"
 YSS.90.a: "起来，伟大的国家！"
 YSS.92.t: "群众正在行动"
 YSS.92.d: "原本沉寂的底层一下点着了。起初只是几户穷佃农跟着工作队去丈量地主的田亩，不出半月，火势便烧遍了各省。积压多年的怨气决了堤，群众不再等着公家按章程分地，而是成群冲进富农大院抢粮拉牛，给往日作威作福的老爷戴上高帽游街。村里的年轻人扛着锄头木棍，扯着嗓子喊些自己也一知半解的口号。\n\n很快，城镇里的工人和市民也卷了进来，旧秩序几乎在一夜间散了架。可缺乏约束的“自发行动”很快露出了失控的苗头：不少人砸完地主牌匾还不罢手，开始胡乱焚毁账册农具，甚至因为旧怨猜忌在邻村之间打起了群架。\n\n闸门一旦掀开，这股洪水已经不是几纸通告就能摁回去的了。"
 YSS.92.a: "接下来会如何？"
 YSS_shouren_liaison: "兽人联络者"
 YSS_cecilia_desc: "苏联曾短暂地向联盟公派过一批志愿者。而在苏联撤回支援后，一批坚持兽人解放的兽人志愿者留在了索维耶特，采齐利娅是这批兽人的领导者。借助这些人的关系，联盟不仅接收了不少兽人社会主义运动的志愿战士，还获取了不少索维耶特联盟急需的物资和情报（这包括一些不光彩的走私行为）。只是兽人的网络为何如此神通广大，还是个未解之谜。"
 YSS_bri_desc: "列宁格勒国立大学毕业生，采齐利娅的养女。由于苏联紧张的政治氛围和养母的召唤来到了索维耶特联盟。由于缺乏军事经验，再加上当地对于魔法不重视，布里在此并没有太多用武之地。"
 YSS.2000.t: "亚的斯亚贝巴郊外"
 YSS.2000.d: "“Товарищи из России? Как поживаете! Меня зовут Цецилия.（是从俄罗斯祖国来的同志吗？幸会！我是采齐利娅）”\n\n“啊，是从神州来的志愿者同志，我叫采齐利娅。东非的气候还适应吗？说起来，我的祖上还是神州人呢......”\n\n“总指挥！物资到了......”一个高大的狼耳青年掀开帐篷。\n\n“好的，梅莱斯。那请各位休息片刻......”采齐利娅从围坐在帐篷中的众人中间穿过，走到帐篷外。山谷中的寒风袭来，采齐利娅不禁打了个寒战，尾巴立刻蜷进大衣下。\n\n“梅莱斯，是从阿斯旺过来的货吗？这个点也该到了。在哪里？”\n\n“就在山脚下。我刚刚去点过了，亚的斯亚贝巴要的机械零件，磺胺和奎宁，都不少。不过......”高大的狼耳青年四下望了一下，“有个人跟着货一起到了。按理来说这批志愿者都到齐了......”\n\n“长着什么样子?”\n\n“黑头发，红眼睛的犬兽人，挺高的......”\n\n“布里？”采齐利娅一怔。\n\n“布里？布里是......”\n\n还没等梅莱斯多说什么，一个黑影就从他身后掠过，径直扑向了采齐利娅。梅莱斯定睛一看，黑头发，高挑，犬耳，正是那个随货物一起来的人。\n\n“妈妈，真的好久没见你了！”\n\n“诶，布里......行了行了，别舔我的脸......”\n\n望着面前抱在一起的两人，梅莱斯一时有些手足无措。\n\n“梅莱斯，这个就是保密货物A了。向你介绍一下，这是我的养女布里。”采齐利娅好不容易把布里推开，擦了擦脸说。\n\n“保密货物A？总指挥，货物清单上明明写着货物......额，这位小姐会六个月之后才到啊？”\n\n“谁知道伦敦那边是怎么想的。梅莱斯，还请你先组织人把物资送到前进仓库去。”采齐利娅挥了挥手。\n\n“妈妈，你在这里送东西吗？”望着梅莱斯远去的身影，布里转头问，“我还以为你会在这里杀人呢。”\n\n“杀人？”采齐利娅抓了抓头发，“我当年只在前线服役过两个月，你为什么会有我喜欢杀人的印象？”\n\n“我还以为主动来到这片蛮荒之地的都喜欢杀人呢。我坐着马车过来的时候，一路上看到不少兵拖着枪带着炮。这肯定是要打仗了吧？”\n\n“是啊，这也是我想让伦敦那边晚点让你过来的原因。你怎么提前跑来了？”\n\n“唉，时间紧任务重啊！”\n\n“任务？”\n\n“我是说，马上就能见到妈妈了，我心里就像任务要完成一样欣喜。”布里拍拍脑门，吐舌头做了个鬼脸。\n\n“那既然如此，就跟我过来吧。我带你熟悉熟悉这里。”采齐利娅拉着布里的手，向着帐篷走去，“马上要打仗了，之后我得要好好训练你。希望你从列宁格勒念了三年书，没把我之前教过你的训练忘了。”\n\n“妈妈，你不会打算要像那位博奇卡列娃那样严厉吧？”\n\n“提那个十五年前就枪毙了的人干什么？”采齐利娅抓了把头发，“再贫嘴，我就像她那样把你头发给剃秃了。”\n\n“哎呀，真的有必要那么严厉吗？不过妈妈你放心吧，就算在大学，我也没忘记锻炼身体的。而且，这里不是运输队吗？总比前线要安全吧。”\n\n“我不这么认为。好了，进来暖和一下吧，顺便见见你的新同伴们。”采齐利娅掀开帐篷门帘，而那些席地而坐，正在闲聊的人们立刻安静下来，纷纷望向她。"
 YSS.2000.a: "各位新同志，给你们介绍一下这位女同志。"
 YSS.2001.t: "怪客"
 YSS.2001.d: "“布里，帮我在登记处干一会活。”\n“好的，妈妈！你需要我怎么做？”\n“今天有一批其他节点的志愿者到了，你帮我登记一下。记一下姓名，来历，种族，参加理由和特征就行。你来了，我就可以空出时间去上阿姆哈拉语课了。”\n“啊，好的好的……妈妈好好学习！”\n……\n“真无聊啊。现在是什么时候了？妈妈什么时候回来啊……哦！是新来的志愿者吗？请过来登记一下。”\n“喵就是在这里登记喵？”\n“啊……对对对，这位同志说话好怪啊。”\n“喵从小时候就这样喵。”\n“好的好的，呃，报一下名字吧。”\n“佐藤雅尼子喵。”\n“是樱花国人吧，猫兽人？”\n“是的喵。”\n“那参加兽人共产主义者斗争同盟索维耶特支部的理由……”\n“嚓~”\n“同志，可以不要在这里抽烟吗？”\n“喵？那喵不抽了喵。”\n“也请你不要把烟头扔在地上踩灭。参加兽人共产主义者斗争……”\n“为了抽更多的烟喵。”\n“啊？”\n“为了抽更多的烟喵。喵没有烟就不能活喵。”\n“呃，这个理由……。你的家人情况怎么样？”\n“喵？喵的妈妈在国内喵，妹妹在后面喵。”\n“还有妹妹吗？同志，这里的斗争可是很危险的。你真的准备好了吗？”\n“那就把喵安排在安全的岗位喵。革命不是总需要牺牲的喵。”\n“并不是这样的。虽然我们的工作并不危险，但总会有些牺牲的可能。你要是不能接受的话，还是请回去吧。”\n“什么意思喵！？”\n“同志……”\n“要把喵赶回去喵？！把喵赶回那个一天只让买五根烟的地方喵？！”\n“只让买五根烟？”\n“说什么要支援战争，兽人连烟都要配给喵！喵什么坏事都没做过！为什么单单只克扣喵的烟喵？喵今天就要留在这里喵！哈~~……”\n“好的好的，同志，别激动，已经了解你的情况了。这就帮你登记好。”\n“这还差不多喵，嚓~”\n“都说了不要在这里抽烟啊！”"
 YSS.2001.a: "佐藤雅尼子，樱花国猫兽人，为兽人平等斗争而来，浅绿发色，疑似烟瘾极重。"
 YSS.2002.t: "贡德尔郊外"
 YSS.2002.d: "“坚持住，手不要动。”贡德尔郊外的某处平坦空地上，采齐利娅正在大声命令着。布里手中握着一根木杆，而木杆上吊着一块大石头。\n“杆保持水平，腰往前，头往前看！”采齐利娅围绕着布里，时不时上去拍打她动作不标准的身体部位。\n“妈妈。快一个小时了，让我休息一下，我的手臂都快失去知觉了。”\n“你之前的那股蛮横呢？冬日狂犬？”\n“啊？妈妈，你怎么知道我的这个外号？”\n“当我真不知道？我在东非都知道你在大学斗殴的事情。学校都给我发信件了。”\n“学校寄信会把我外号也带上吗？妈妈，已经一个小时了吧。”\n“啊，确实。那放下来，休息五分钟。杆子不准抛！”\n“啊……”采齐利娅的话还没落地，布里手中的木杆已经被抛到了地上。她听到母亲的话，又立刻把杆捡起，再弯腰轻轻放下，又顺势坐到了地上。\n“行了，休息一会。”采齐利娅坐到地上，从地上的大铁瓶中倒了些水到一个罐头盒，递给布里：“喝水吗？”\n“喝不了了，手都举不起来了。”\n“行，看来是真累了，特批你再多休息五分钟。”采齐利娅把罐头盒放到嘴边，咕咚喝了几大口。\n“妈妈，有个事情我很在意，我想问问你。”\n“说吧。”采齐利娅把罐头盒放到脚边。\n“你也是猫兽人，你说话为什么不带喵？”\n“啊？”采齐利娅转头去看布里，低下头，耳朵压平，眼睛在眼眶中打转。“你看那些猿人，要是他们说话的时候，每句话后面加上‘哼哼哈哈’，不是很奇怪吗？那我也是同理。”\n“这样啊，我还以为妈妈你是和其他猫兽人不一样的。”\n“怎么说？”\n“就凭你有两条尾巴。“布里低下身子，把手伸进采齐利娅的大衣里，”两条尾巴的猫是妖怪！”\n“我生下来就这样，我是什么妖怪？别胡说。我就是个普通的人。”采齐利娅躲了躲。\n“你是普通人，那我是什么？我连普通人都不是？”布里嘟着嘴，“你再看看你让我练的，这不是抬步枪的动作吗？可我是文职啊！我用的上这个？”\n“好，那给你展示一下你用得上的。”采齐利娅从地上抓了把土，把罐头盒里剩余的水倒进手心，把土捏成泥团。她站起身，从腰间拔出一把精巧的手枪，上了一个弹匣，又插回了腰间的枪套。\n“看好了。”采齐利娅右手伸直，手心朝上，把泥团放在手心。下一刻，她右手如蛇一般缩回，从腰间拔出了手枪，斜向下一指。泥团刚掉到她膝盖高度，就被一枪打的粉碎，泥点子溅到了布里的脸上。\n“哇，好快！”\n“快拔防身术，你应该用的上吧。”采齐利娅把弹匣卸下，又拉动枪套退弹，把手枪递给布里，“你先拿空枪比划一下。”\n“啊？现在就练啊，我能行吗？”布里往后缩。"
 YSS.2002.a: "你刚才抓我尾巴的时候，手臂不是已经能举起来了吗？"
 YSS.2003.t: "总书记办公室内"
 YSS.2003.d: "采齐利娅最后检查了一下手中的箱子，在门口深吸了一口气，敲了敲门。\n“请进。”\n采齐利娅推开门，门柯思图正坐在办公桌后写信。见有人来，她迅速把信纸收进抽屉，从硬木椅子上站起，走上前来：“啊，是你呀！采齐利娅，请坐请坐。”\n“谢谢。”采齐利娅把手中的箱子放在地板上，坐在了办公室一侧的沙发上，把箱子打开，里面是几个暗红色的瓶子。\n“客气客气，带这么多礼物干什么？”\n“卡维酒庄的葡萄酒，有兴趣尝尝吗？”\n“卡维吗？”门柯思图一愣神，采齐利娅从箱子里又拿出了一个铁皮杯子，倒上满满的葡萄酒递过去。\n“真让人怀念呢。”门柯思图接过杯子，呷了一小口，“当时我去法兰西留学的时候，就常喝这种酒呢。”\n“哦？那挺有意思的。”\n“怎么说？”\n“这批酒本来打算走私给厄立特里亚一个官员的，你这边一开打，这些酒就砸在我手里了。”采齐利娅叹了口气，“可惜了，这人连这种廉价葡萄酒都没机会喝上了。说不定已经被红军打死了。”\n“那有什么办法？这位‘同志’虽然和我有一样的酒品，但是他站在了人民对立面给封建买办卖命，那就由不得他了。”门柯思图又喝了一大口：“不过，酒不能喝太多，待会我还要给部长们写信呢。你知道的，全国刚刚统一，事情可多了。”\n“休息一会儿。我和你的秘书小原小姐谈过了，这次会面足足有三十分钟呢，你就抓紧时间休息一下。”\n“那可真是谢谢你，不过，就算你这么说，我也不敢休息啊。”门柯思图拍了拍采齐利娅身下的沙发，“一年多之前，伊尔玛当时就躺在这沙发上，我把枪顶在他脑门上，他的政府就垮了。软凳子就是这样，坐上去容易，下来可就难了。”\n“你说的对，”采齐利娅摸了摸身下的沙发软垫，“没有可靠的团队，什么都得自己来，我理解你的感觉。我三年之前来这里的时候也是这样的。你看看，一年前你还是意气风发的少壮军官，现在看起来，你已经快变成老人了。”\n“为联盟和人民鞠躬尽瘁，我不后悔。我对得起国家和人民。”门柯思图抬起头，把杯中的酒一饮而尽。\n“好，那我也来帮帮你好了，让你可以办事轻松些。”采齐利娅深吸一口气，“你知道的，过往我们组织把货物从欧洲运来，卖给这里的贵族和殖民者赚点外快，现在随着你的统一战争，这条财路已经断掉了。”\n“那可没办法，国有国法，走私是不能容忍的。”门柯思图把铁杯子放到沙发一旁的桌上。\n“索维耶特的人民也没有多少钱，就算有钱，也被你拿去打统一战争了。我可不会从他们身上赚钱。”\n“真刺耳，可是我确实无法反驳。那你打算赚谁的钱？”\n“你有钱，我打算赚你的钱。”\n“有意思，你打算怎么做？不会是让我把你手上的酒都买下来吧？”\n“你又不是酒桶。”\n“那你的意思是？”\n“我想问问联盟的轻重工业部门，农业部门和军队想要些什么。”采齐利娅指向门柯思图喝过的空杯子，“打个比方，只要你能在联盟找到地方种葡萄，给你搞来农艺师，品酒师，外加一整条生产线，也不是不可能。”\n“有意思有意思，既然是这样的话，那我非常乐意你来赚我的钱了。”门柯思图从沙发上站起，走到桌旁，把抽屉里的信纸抽出一张。"
 YSS.2003.a: "稍等片刻，你可以拿着介绍信先去和重工业部谈谈。"
 YSS.2004.t: "亚的斯亚贝巴小餐馆"
 YSS.2004.d: "傍晚时分，布里从兽人共斗同盟在亚的斯亚贝巴的办事处溜出来，沿着行人稀疏的街道走进了一家小餐馆。\n“老板，今天还是老规矩。”\n“哦，布里姑娘，红菜汤配面包是吧，稍等片刻。”柜台后的老板头也没抬，径直走向后厨，布里则顺势走向了厕所。\n进入隔间，关上门，布里赶忙从衣兜里抽出一根皱巴巴的卷烟，擦亮火柴点燃，猛吸了一大口，又慢悠悠地吐出烟雾。\n“啊，舒服。”\n几乎每天傍晚，布里都会来到这家俄餐店，享受一道相对正宗的祖国风味晚餐。而隔间里这一口烟的功夫，则是她一天当中为数不多属于自己的时间。\n布里又叼住过滤嘴，猛吸一口，烟头燃着的火光迅速蔓延过半只香烟。\n“几年前还是列宁格勒的优秀大学生，现在已经沾上烟草了？”\n“嗯？”布里一怔，她摸了摸耳朵，确定自己没听错，“谁？”\n“听说犬兽人难以代谢尼古丁，一支烟就会上头。不知道是真是假。”厕所隔间隔壁，一个低沉的女声传来。\n“啊，你是谁啊？”布里问。\n“家乡的亲戚。”对面回答。\n“请问是哪里的亲戚？”\n“我家住在捷尔任斯基广场附近。”\n“啊！”布里心头一紧，“卢比扬卡？”\n“嗯。”\n“那么……”布里试探地问：“卢比扬卡的亲戚为何要突然找我？这种方式不太正规吧？”\n“家里人很关心你，希望问问你母亲身体是否健康。”隔间那边回答，“家中长辈要出远门了，可能后面会顾不上你。”\n“那……妈妈现在身体健康，从来没有明显问题，和伦敦的朋友往来密切，凡事我都已经告诉长辈了。”布里回答。\n“明白了，家里人不会忘记你的，但短时间内确实顾不上你了。”隔间那边说：“写好你的日记，日后用它来和家里人相认。”\n“日记？日记是指什么？”\n可这次，隔壁不再有回应。布里冲出厕所，隔壁已经空空荡荡。她再冲出厕所，无论是餐馆里还是大街上，都不见半个人影。\n“布里姑娘，怎么了？”老板从后厨走出，手中餐盘里是一碗热腾腾的红菜汤和一盘面包。\n“老板，刚才有人来过吗？”\n“嗯……我一直在后厨干活呢，只听到门口有过一阵杂乱的脚步声，没见过人影。怎么了，布里姑娘？”"
 YSS.2004.a: "呃，没什么，还是先吃饭吧。"
 YSS.2005.t: "吉布提港码头"
 YSS.2005.d: "“怎么了？这么伤心？”\n夕阳西斜，远行的轮船发出悠长的汽笛声，咸味的海风中回荡着海鸥的叫声。\n“总指挥……我想不通。老布亚诺夫就像是我的第二个父亲一样。”梅莱斯抽泣着。\n“人各有志。”采齐利娅站在他的身旁，拖着慵懒的语气，“他不想为理想奋斗了，那就让他去吧。”\n“他曾经是最有激情的人！每个学生都知道，他是最嫉恶如仇的人！”梅莱斯抹着眼泪，“总指挥，为什么连他都不想为兽人的未来奋斗了？”\n“他或许是累了。”采齐利娅蹲在地上，从衣服口袋里拿出了一小块面包，一点一点撕成面包屑，扔进海里。\n“好吧，累了。总指挥，要是人人都以‘累了’作为借口的话，我们的未来还能好起来吗？”\n“你希望每个人都能永远富有激情吗？”\n“为什么不？”梅莱斯力争：“总指挥，你知道的，一批兽人可以坐在伦敦城和猿人谈笑风生，而另一批兽人就在伦敦的动物园展出。这种现状，总指挥，你难道不心痛吗？你难道能够放任这种情况继续下去吗？”\n“伦敦？伦敦太远了吧。”采齐利娅依然在扔面包屑。\n“好，总指挥，我就说个近的。”梅莱斯抹了把眼泪：“联盟的新宪法颁布之后，兽人确实和猿人法律上平等了。但是你看看，兽人只能选自己的村长，再往上，还是得听猿人的命令。我们真的平等了吗？这联盟总书记也不过是想当另一个猿人主子罢了！”\n“不如我给你讲个故事吧，我亲身经历过的。”采齐利娅喃喃道，手中的动作没有停下，“或许你听了之后，你会明白老布亚诺夫。”\n“好，总指挥……我听着呢。”梅莱斯呜咽着。\n“二十多年前，德国人入侵了俄罗斯母亲，那个时候出了一个叫博奇卡列娃的奇女子，她看不惯德国人的横行霸道，号召俄罗斯的妇女奋起反抗。而当时，不少的寡妇饱含被夺走丈夫的愤怒，真的聚集到了她的身边。”\n“那总指挥，后来呢？”\n“冬宫围城之夜后，她几乎所有的部下都叛离了她，而她后来也被苏维埃枪毙了。”\n“为什么？“梅莱斯不解，”苏维埃不是主张妇女解放吗？”\n“她所谓的妇女解放，只是让妇女也能填充战线罢了，而荣誉都是她的。“采齐利娅撕下一大块面包，用力扔向海里，几只海鸥俯冲而下，争抢起海面的面包屑，”她所谓的保卫俄罗斯也是如此，当我们……当妇女们发现，她想保卫的俄罗斯只是个虚无的概念，和她们的家乡亲人关系不大后，也就不再看重她。”\n“我想说的是，”采齐利娅站起来，“如果所谓的兽人解放，只是像博奇卡列娃那样，用无数人还过得去的生活去换自己的荣耀，那注定会被抛弃。老布亚诺夫想要追求更好的生活了，选择了放弃伟大理想，我想这无关对错，只是历史的局限而已。”\n“总指挥……”梅莱斯吞了口口水，“和你同一批来到这里的兽人已经不多了，你会不会有一天也像老布亚诺夫一样，离我们而去？”\n“我不会，因为我只是想在这里建立一个能不受猿人纷扰的小家，过更好的生活罢了。”采齐利娅把面包屑撕碎，放在右手上。\n“是吗？总指挥，但你应该可以轻易完成这个目标了吧？”梅莱斯问。\n“让这个家稍微再大点也可以吧？这样也会安全些。”一只海鸥从天空降下，停在采齐利娅的右手手掌上，啄食着她手上的面包屑，“几年之前你还是个胆小的年轻人，现在你已经从老布亚诺夫那里学到了很多。有兴趣接手他的工作吗？”\n“嗯，总指挥，我想我可以试试。”梅莱斯点了点头。\n“那就先从开车开始吧，换你来开车载我回去。”\n“总指挥，我……我的驾驶水平还是有些稚嫩。”梅莱斯有些犯难。\n“那车的座椅不好调整，老布亚诺夫又那么健壮，我踩不着踏板。”采齐利娅高举右手，把手上的海鸥托举起来。那海鸥扑腾翅膀，一下子就腾空而起。"
 YSS.2005.a: "那海鸥飞得很快，一会儿就飞到了看不见的高度。"
 YSS.2006.t: "在红海"
 YSS.2006.d: "公海上，一艘不起眼的商船正在航行着。布里走到船舷，从怀里抽出一小盒香烟，挑出一支，擦亮火柴点燃，轻轻吸了一口。\n正午时分，大海一望无际，云层连绵至天边，耳旁只听得海浪轻拍船身的声音。布里趴在船舷上，小口细品着每一口烟雾。\n“如果一切正常的话，傍晚就可以看到苏伊士运河了。”布里看着手表自言自语，“唉，押船好无聊啊，不是看货就是看海的。”\n香烟燃尽，布里顺手把烟头扔进海里。\n“借一根喵。”\n“嗯？”布里回头，佐藤雅尼子只穿着短衬衫，踩着拖鞋，站在她的身后。\n布里尴尬地低头：“我也就这么一根，你知道的，我不敢在妈妈面前抽的。”\n“说什么谎呢？喵能闻到烟盒的味道。”\n“真的吗？”布里尴尬地摸向衣兜，把那盒香烟拿了出来。佐藤雅尼子一把夺过去，抽出一根叼在嘴上，又把烟盒扔给布里。\n“借个火喵。”\n布里又把口袋里的火柴盒递过去。雅尼子迅速点燃了香烟，又把火柴盒扔了回去，猛吸了一大口，又轻轻地吐了出来，“Thank you 喵。”\n“像你这样的老烟民，不应该常备着烟吗？”布里问。\n“喵的妹妹在船上，在妹妹面前不敢抽喵。妹妹把烟都藏起来了喵。”\n“妹妹也在船上吗？”\n“是的喵。喵已经押船跑过十多次了喵，从吉布提到亚历山大。”佐藤雅尼子猛吸了一口，“结果妹妹现在过来管我了喵。”\n“唉，妈妈也管着不让我抽烟啊。”布里顺势从烟盒里抽出一根香烟咬住，点燃，轻轻地抽了一口。“说起来，佐藤同志觉得押船这项工作怎么样？”\n“总指挥是个好猫喵，给喵安排的工作，喵很满意喵。”\n“可是押船……佐藤同志不会感觉无聊吗？”布里望着海面，“和一群陌生人在一起，每天都盯着一样的风景，就这样盯一整周，循环往复，我感觉我干不来这样的工作。”\n“喵？喵感觉很自由啊？”\n“嗯？”\n“不需要操心数字，不需要和太多人打交道，每天做好固定的事情，到了埃及或者回港就有烟抽，这种生活最自由了喵。”\n“诶？佐藤同志，难道你就没有一点不满或者建议吗？”\n“完全没有喵。”\n“好吧，可妈妈不会满意的。”\n“总指挥太认真了喵。要是你和她都不那么认真，你们也不会有烦恼的喵。”\n“哈哈，可惜做不到啊。”布里陪笑着，又轻轻吸了一口，“妈妈跟我说，不自己动手，烦恼不会自己跑掉的。这也是为什么她非常不希望我抽烟。”\n“那布里小姐为什么会抽烟呢？”\n“唉，抽烟的时候，烦心的事情都会自己散掉。有些烦心事，不会因为自己努力就能解决的。”\n“喵也一样喵。”佐藤雅尼子举起手中的香烟，指向天上的云：“喵抽烟的时候，总感觉像云朵一样自由，可是烟抽完的时候才发现，喵原来还在地上喵。”\n“是啊。”\n相对无言，只有烟雾缭绕。\n“如果跟着总指挥干到底，喵能不能想抽多少烟就抽多少烟？”佐藤雅尼子望向天际。\n“那当然可以。共产主义成功，物质就极大丰富了，那到时候当然是你需要多少烟就有多少烟。”\n“那喵的肺会不会一天就坏掉喵？”\n“呃……到时候应该会发明出不伤身体的烟吧。”\n“那喵就一定要支持革命了。”雅尼子又猛吸一口，火光几乎烧到了过滤嘴，“可惜革命成功太远了，喵还是现在先逍遥一会。”\n“那可真好啊。”布里放下烟，望着远方的海面，“可惜.....”\n“啊！姐姐，你居然躲在这里抽烟！”\n一个陌生的声音从后面袭来，布里转头一看，一个浅紫发，穿着海员制服的猫兽人正掐着佐藤雅尼子的衣领。\n“姐姐你是怎么和我保证的，不是说好了戒烟的吗？”\n“喵！对不起喵！对不起，妹妹放开喵，求求喵。”佐藤雅尼子在央求。\n“啊，这就是佐藤同志的妹妹吧！”布里迎上去，而那个猫兽人立刻放开了雅尼子，向布里鞠了一躬。\n“初次见面，是布里小姐吧？真抱歉，姐姐实在是太没礼貌了，居然把烟味都蹭到您身上来了。”\n“没关系没关系。说起来，这位同志叫什么名字？”\n“妹子，佐藤妹子喵。”雅尼子搭话。\n“一摸阔？妹妹的名字叫妹妹吗？好形象的名字呢。”\n“总之，给您添麻烦了，我一定好好教训姐姐！”妹子又鞠了一躬，拽着雅尼子向船舱走去。\n“啊疼疼疼！妹妹轻点喵！”\n“姐姐，你怎么又藏烟？你这次的烟又是从哪里来的啊？”\n望着逐渐远去的姐妹，布里不由得苦笑起来，顺手一扔，把藏在手心的烟头越过船舷扔进了海里。"
 YSS.2006.a: "“你说你想像云一样自由，哪有那么容易啊！”"
 YSS.2007.t: "喀土穆某处"
 YSS.2007.d: "“比约定时间早了三分钟，猫女士，您还真是守时啊。”\n喀土穆城郊，一座木制仓库门口，一群人正在等待着。而人群前，一个操着伦敦腔的俊美男子正向驶来的卡车打着招呼。卡车迅速停稳在仓库门口，采齐利娅从副驾驶跳下。\n“先看看货。”采齐利娅面无表情。\n“啊，这可不行，X光机不太适合见光啊，不过其他货物，您可以先看看。”男子说着，挥了挥手，一个扎着头巾的少年从男子身后走来。\n“女士您好，我是阿维拉，我在伦敦医学院的放射科学习过，我能保证这台机器的正常运作。”\n“埃及人？”采齐利娅抬起头看了看少年。\n“本地人熟悉本地环境嘛。”男子笑道。\n“那维修工程师呢？”\n“哦，比起维修，您应该把这台二手机器用到报废，这样会更加经济。”\n“行吧，不过这样，尾款就要减少了。”采齐利娅挥了挥手，“梅莱斯，来和这几位一起把货物装车吧。”\n“那，女士，我们现在可以私聊一下了吗？”俊美男子询问。\n“行吧，亨利，我们找一个安静的地方吧。”采齐利娅点了点头。\n两人避开仓库门口装卸的人群，走到了仓库的后门处。亨利从口袋里抽出香烟，点燃，吸了一大口。\n“大石匠那边有什么消息吗？”采齐利娅问。\n“大石匠对你非常满意。你知道，大萧条之后，什么事都不好做。你能弄来黄金，这确实让大石匠很惊讶。”\n“那还真是感谢了。”采齐利娅望向远方，“如果有可能，后面我还能弄来咖啡，宝石和酒，这些东西应该很抢手。”\n“这样就非常好了，我们的交易会非常顺利。”亨利抽了一大口烟。\n“是吗？那亨利先生你呢？为大石匠服务也顺利吗？”采齐利娅把手背到背后，“不过就我而言，人类或许还是少插手兽人的事情比较好。”\n“没有大石匠的资助，我的家族要怎么在圣杯的议院夺到一个位置呢？”亨利看向采齐利娅，“不过就我而言，共党还是少插手资本主义世界的事情比较好。”\n“说我是共党？可真是抬举我了。我既没有加入布尔什维克，也没有在内战中站到他们那一边。”\n“那这么说，你说我是人类，或许也有些偏颇。”亨利吐出一大团烟雾：“人类要怎么和大石匠共舞呢？”\n“但你看起来像人类。”\n“那你就是看起来像个共党了。毕竟你也是在为一个东非小政权服务嘛。”\n“那就各取所需吧。毕竟即使像大石匠这样高贵的兽人，也少不了我这样的人。”采齐利娅叹了口气，“亨利先生有孩子了吗？听说你之前结婚了？”\n“妻子怀孕了，不过还没出生呢。怎么？猫女士怎么想起这样的事情了？”\n“烟味，这让我想起布里身上有时也有一股这样的味道。小孩子有自己的想法了，我已经管不着了。”\n“布里是？”\n“保密货物A，有印象吗？”\n“是你的女儿啊！唉，中年人的烦恼啊。这让我想起马丁那毛头小子。他一天到晚闯祸，说话口无遮拦，做兄长不比做父母容易啊！”\n“好吧，看来无论是共党还是资本主义的绅士，都有满头的烦恼，不是吗？”\n“那就为了我们各自眼中的光明未来而奋斗吧。”亨利把烟头抛得老远，“如果可以，我也希望这样的和平能够继续下去，可是那完全不现实。矛盾总有一天会爆发，到时候，什么避难所都不会留下。”\n“是吗？我觉得你有些太悲观了。”\n“但愿是吧，总之，祝你和你们的政权好运，猫女士。”"
 YSS.2007.a: "祝你和你的事业平安，亨利。"
 YSS.2008.t: "亚的斯亚贝巴城外"
 YSS.2008.d: "夕阳下，二人长短的影子行走于郊外。\n“呼！偶尔这样到郊外走走也不错嘛。最近可是忙上加忙。”门柯思图披着军大衣，手放在荷包里，走在前面。\n“我也想为你分担些烦恼，可是我并不方便插手，毕竟我已经不再是总指挥了。”采齐利娅走在后面。\n“我不信。像你这样有影响力的人，就算卸任了，你也不会离公务太远。”门柯思图微微一笑，“你肯定还在辅导那些年轻人。”\n“瞒不过你，到底是国家元首啊。”\n“哪里哪里，只是些简单推理罢了。”\n“为什么会想到让我来陪你来郊外散步呢？你周围就没有更合适的人吗？”采齐利娅问。\n“毕竟只有你名义上有时间嘛。蒙巴萨案之后，各个机关都在忙着自查，大家都忙。”\n“那你为什么还想着出来散步呢？这可不符合你工作狂的性格。”\n“医生强迫的。”门柯思图抚摸着胸口，“最近工作久了，胸口总是隐隐有些发闷。联盟这边的医生也看不出个所以然，只能劝我多休息了。唉，为了更好的为人民服务，要活得久一些嘛。”\n“我这边有一台X光机，不知道你有没有兴趣试试。”\n“哦？你居然有这么好的东西？为什么重工业部从来没和我说过？”门柯思图回过头去。\n“从圣杯一家破产私立医院买来的二手货而已。要是我能弄到质量更好的，早就给重工业部了。”\n“机器能行吗？”\n“目前还可以，有空的话给你检测一下，我把胶片匿名发到圣杯去，让资本主义的医生给你看看。”\n“那还真是谢谢你了，”门柯思图望向前方，“你办事，我放心。之后我会让我的秘书联系你的。”\n“是吗？“采齐利娅叹了口气，”即使是在我的组织里出了间谍之后吗？”\n“毕竟你也为联盟服务多年了。”门柯思图背起手来踱步，“‘兽人建国主义者’，这还真是个容易被资本主义利用的幌子。我已经从内务部报告看过那几个人的情况了。”\n“年轻人就是容易被一些不切实际的想法所蛊惑，他们最常做的就是自己振臂高喊呼唤变革，却让别人去承担变革的代价。“采齐利娅踩着门柯思图的脚印，”我一直致力于逐步提升兽人们的生活待遇。此时此刻，我还有志愿者在给联盟的兽人教书呢。”\n“多么有见地啊，这就是为什么我会信任你。”门柯思图望向远方，“我一直想，如果在未来，联盟的人类和兽人能够不因种族和文化而相互隔阂，互相称呼兄弟姐妹，那该有多好啊。到时候，还需要什么兽人建国吗？”\n“那会很困难吧。联盟的兽人在过去几千年从来没有和人类平等过。”\n“何止是联盟，整个世界都是如此。你们兽人不是最喜欢念叨一句话，叫什么‘有的兽人在伦敦金融圈，有的兽人在伦敦动物园’？”\n“我想说的是，恐怕在你的理想实现之前，‘兽人建国主义’会一直有追随者吧。“采齐利娅望向天际，”面对不公的痛苦，人们自然会想到最粗暴的解决办法。你是否准备好了呢？”\n“我想，先用强力部门把他们保护起来，再由文化部门和宣传部门逐步教化。这样才有机会吧。”\n“没有想过让兽人自治吗？”\n“即使是自治，隔阂依然存在，依然会被利用啊！“门柯思图回过头，”你刚刚不是说过，面对不公的痛苦，人们会选择最粗暴的解决办法吗？我想，革命者总会去寻找出路，而不是只顾个人宣泄。否则我在当年就不会去组织推翻伊尔玛，而是去找一颗打向我胸膛的子弹了。”\n“这样啊……“采齐利娅望向地面，”那可真是高尚啊。”\n夕阳西沉，两人站在砂石道路上，远方的夕阳正在逐渐隐藏至山下。\n“就这样吧，真是愉快的聊天啊！我们上车回去吧？”门柯思图说。\n“啊，不用了，我自己走回去吧。”采齐利娅依然低着头。\n“真的不用吗？这里离城区还有十多公里呢！”\n“毕竟我很闲嘛。”\n“那好吧。”门柯思图挥了挥手，一辆轿车就开到了她身边。她打开车门，扬长而去。"
 YSS.2008.a: "于是，夕阳下，只剩下一个人的影子。"
