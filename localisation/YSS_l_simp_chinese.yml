 YSS_sanjieduan.1.t: "庆功晚宴"
 YSS_sanjieduan.1.d: "“喂，各位快看是谁来了？”\n\n“是门柯思图总书记！”\n\n不知是谁大喊了两声，人们开始向着会场的入口张望。门柯思图穿着一身板正的军装，笔挺地站在门口，在簇拥下走入了会场。\n\n“欢迎，欢迎各位。”门柯思图向着到场的来宾招手示意，“欢迎各位出席今晚的宴会。”\n\n“呀，真神气，像一只狮子一样。”圣杯王国的外交官低声说道。\n\n“噫，可别用狮子比喻她，她最讨厌那些封建时代的称呼了。”苏联的外交官在一旁提醒。\n\n“狮子？用雄鹰如何？”德国的外交官说。\n\n“还是用铁人好了，这样非常合适，你们说呢？”苏联的外交官笑道。\n\n“哈哈哈！”外交官们一齐窃笑起来。\n\n“今天，是一个喜庆的日子。”门柯思图站上会场的讲台，声音在麦克风里显得极富磁性，“各位来到索维耶特的外交官们，我们一同庆祝欧洲和平的再临。各位一同举杯，尽情享受和平吧。”\n\n“好！”会场下掌声雷动。\n\n“总书记，使馆区的行程已经完成了，我们接下来怎么做？”门柯思图走下讲台，秘书小原站在一旁小声说，“离下一个行程还有一个多小时呢。”\n\n“时间还有些吧，那让我和那些外交官们聊两句好了。”\n\n“明白了，我在讲台这里等您。”\n\n门柯思图向侍者示意，取过一杯香槟，走向外交官们：“各位，欢迎你们出席这里的庆功晚宴。我们的祖国都被卷入了欧陆的血战，我们理应因共同的胜利而获得更紧密的关系，对吧？”\n\n“啊，门柯思图阁下，您肯定已经在勾勒战争之后的和平蓝图了。我想圣杯王国的民众和索维耶特的未来应该会更加和平友好，虽然我们......有一些过往的不愉快。您可以做出这样的承诺吗？”\n\n“马丁阁下，您还真是直接啊，您这是打算总书记阁下如何回答呢？”苏联的外交官笑着调侃。\n\n“哦，谢尔盖阁下，您也希望我们的未来更加光明吧？”圣杯王国的外交官回答。\n\n“这是当然，圣杯王国的人民和索维耶特联盟的人民，一定会建设一个和平共处的未来。我可以承诺。”门柯思图说完，顺势把杯中的酒一饮而尽。\n\n“哦！总书记真是令人惊讶！”苏联的外交官惊讶道。\n\n“没关系，今天是开心的日子，这精致的香槟，多喝一些，没问题的。”门柯思图把酒杯放在桌上，又举起另一支装满的酒杯，“各位可以与我一同分享此时的喜悦吗？”\n\n“乐意至极。”两位外交官应声说道。三人一同将酒杯里的香槟一饮而尽。\n\n“贵国有您这样的领导人，实在是幸运啊。”圣杯王国的外交官说。\n\n“是啊，如果讨论起喝酒，总书记阁下，我们这里最厉害的外交官，说不定也要忌惮您。”\n\n“谢谢你们，宴会还很长，我们......”话还没说完，门柯思图突然低头，捂住了鼻子，血色从她白手套的指缝处晕开。\n\n“总书记阁下，您还好吗？”两位外交官问。"
 YSS_sanjieduan.1.a: "谢谢各位，失态了，我离开一下。"
 YSS_sanjieduan.2.t: "卫生间内"
 YSS_sanjieduan.2.d: "门柯思图搓洗着双手，血迹已经洒得卫生间到处都是，可鲜血却依然不停地从鼻腔中涌出来。她抬头看向镜子，镜子里的人面容苍白，满脸都是血迹，丑陋极了。\n\n“这怎么行？”她把凉水拍在自己的脸上，清水立刻变得绯红起来，可热辣的血液依旧不断地从鼻腔中滚出。\n\n“哈......哈......”门柯思图的心脏开始猛跳起来。为什么会这样？为什么出血会止不住呢？这不是简单的流鼻血吗？\n\n难道是有人下了毒？怎么可能？\n\n门柯思图的脑海里迅速浮现出一大群人，那些爱戴她的，讨厌她的......可是没有一个人符合能够下毒的条件。\n\n就算他们下毒了，要怎么做到把毒药独独投到她的酒中呢？会场可是有那么多杯酒......\n\n门柯思图的心脏狂跳着，突然一发紧，剧烈地疼痛起来。门柯思图记得这种感觉，这股剧痛，就像十多年前擦过自己皮肤的那颗子弹，带来的痛楚一样。\n\n她捂住胸口，后退两步，滑倒在地，靠在了卫生间的墙上。\n\n“我这是怎么了？要死了吗？不行，我还有很多事情没有做，还有很多人没见......”\n\n“刚才X光机的结果已经出来了。”不知怎的，此刻出现在门柯思图脑海中的人是采齐利娅，她正拖着慵懒的语调说着。\n\n“胸主动脉瘤，很凶险的疾病。”记忆中的采齐利娅站在不知何处的帐篷旁，手中拿着一份写满外国文字的纸。\n\n“要怎么办呢？”记忆中的门柯思图问道。\n\n“你可以出国去接受手术，当然，对于总书记来说会很麻烦吧，而且医生也提到，这很危险。”记忆中的采齐利娅说道，“或者是吃药，当然，这并不便宜。可能和买X光机和请大夫的价钱不相上下。”\n\n吃药？对了！吃药......\n\n门柯思图挣扎着，在口袋里摸索着。口袋的最深处，她摸出两个小药瓶。\n\n“麦角素和碘化钾。”记忆中的采齐利娅说着，“降血压用的，吃完会有些昏昏欲睡。”\n\n“是吗？看来吃起来会有些麻烦......”记忆中的门柯思图回答着，声音开始变得有些模糊不清。\n\n“但总的来说，它只能......延续......你......的......生......命”采齐利娅的声音变得又浑浊又低沉，最后低到再也听不清了。\n\n“哈......哈......”门柯思图大口喘息着，额头沁满汗珠，手中的药瓶也已经散落在地上。\n\n“我的生命就到此为止了吗？不行，不行......”门柯思图挣扎着，咬着嘴唇，扶着卫生间的门框站了起来。\n\n“总书记！”当门柯思图走出卫生间时，秘书小原立刻迎了上去，“您这是怎么了？外交官们说您身体不舒服，您还好吗？”\n\n“哈.......我还好。”门柯思图弓着背，捂着胸口，喘息着。"
 YSS_sanjieduan.2.a: "然后，山岳就这样倒下了。"
