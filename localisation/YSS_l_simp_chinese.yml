 YSS_GATHERING_STORM_DESC: "1910年的政变劈碎了千年帝国的旧王冠：北方是复辟的阿克苏姆帝国，东部是反客为主的意呆莉东非总督府，中部高原上则是苟延残喘的索维耶特联盟共和国。1923年停战协议划下了一道十三年的死局，也把旧共和国困死在王公庄园与官僚泥潭里。\n\n1935年，总书记门柯思图发动政变软禁大统领伊尔玛、废除议会，决意用自己的方式打破僵局。如今已是1936年，欧洲列强正被新的风暴牵住手脚，红海之滨再无调停者。\n\n统一高原只是第一步。内有旧贵族与党内暗流，外有圣杯封锁与强敌环伺——这个在夹缝里杀出来的红色政权，要替自己争一条活路，也要替整个非洲点起一把火。"

 YSS_new_tips: "@YSS§O索维耶特社会主义共和国联盟§!内容更新：\n§L1.完整两阶段国策树：高原统一战争、第八次党大会、第一个三年计划与红军重建\n2.新增第一个三年计划工业统筹、第二次革命与宣传鼓动部机制\n3.新增非洲解放与互助系统，支持向全非洲输出革命与盟友协作§!"

