 YSS_Country_History_Page_01: "公元7世纪，阿拉伯帝国横扫北非，阿克苏姆却靠着埃塞俄比亚高原的险峻地势与外围荒漠，守住了自己的山头，始终未被外敌彻底征服。\n\n几个世纪后，欧洲列强掀起了瓜分非洲的浪潮，踏上这片高原时却大吃一惊：这个在西方地图上早该作古的“传说帝国”，居然还留着成套的官僚机构、常备军和言之凿凿的古代疆界主张。仗着梵蒂冈与拜占庭的基督教古籍撑腰，又赶上圣幻意等列强在此互相掣肘，阿克苏姆在1888年的《伦敦议定书》里勉强保住了主权。\n\n但外敌没打垮的东西，时间自己蛀空了。到了1910年，帝国只剩下一副庞大而发脆的架子：宫廷里满是抽鸦片的贵族，乡下是麻木的农奴，国库里堆着无人肯认的铜币。这尊站了千年的庞然大物，已经走到了尽头。"

 YSS_Country_History_Page_02: "1892年，帝国派了五十名贵族子弟前往欧洲桑赫斯特与圣西尔军校留学。这批见识过现代世界的年轻人回国后，看到的却是宫廷的昏聩与满朝暮气。1910年，他们用德语和法语串联密谋，趁夜发动政变，把塞努希一世软禁进修道院，决意按新的法子改造这个老帝国。\n\n他们建立的国家叫索维耶特联盟共和国：一部1910年写成的宪法，一个以蒙尼利克党为多数的议会，一位不叫皇帝、叫大统领的国家元首——伊尔玛。此后的二十五年里，亚的斯亚贝巴有了选举、报纸与外交照会；而特瓦赫多共产党作为执政联盟的一员坐在议会里，席位一年比一年少，提案一年比一年难通过。乡下却几乎没有变过：王公的庄园、富农的粮仓、佃农的租子，一样都没有动。\n\n而且，这个国家的命运从头起就没完全攥在自己手里。\n\n政变当夜，皇帝的兄长塞拉西趁乱逃出首都，一路北上故都贡德尔。靠着西方势力的资金与军火，塞拉西在北方重立阿克苏姆帝国，打着正统的旗号伺机反扑。\n\n东部的索马里王公们则因害怕亚的斯亚贝巴的“红色革命”危及领地，病急乱投医，向盘踞海岸已久的意呆莉远征军求援。意呆莉人一进来便反客为主，丢开王公，径直用大炮和铁丝网在东部立起了东非总督府。\n\n一顶旧王冠被劈成三截。革命、复辟与殖民，把这片高原扯成了一盘死局。"

 YSS_Country_History_Page_03: "1920年，北方的帝国军、东部的意呆莉军与索维耶特联盟终于撕破脸皮，在高原和荒漠间大打出手。\n\n血战三年后，欧洲爆发鲁尔危机，列强自顾不暇，停掉了对东非的拨款与军火供应。断了外援的帝国军与意呆莉部队无力再战，底子单薄的联盟也耗到了极限。\n\n1923年，在圣杯的调停下，三方签下停战协议。阿克苏姆就此一分为三，一僵就是十三年。\n\n僵局最后是被亚的斯亚贝巴自己打破的。1935年，总书记门柯思图发动政变，大统领伊尔玛被软禁，议会随即废除；1910年宪法却还挂在墙上，要等新宪法通过的那一天才会被取下。\n\n如今已是1936年。三方隔着停战线剑拔弩张，谁也没打算让对方活到明天。欧洲的风声又紧了起来，列强一旦抽不开身，这片停火十三年的土地便再无顾忌。\n\n这一次，没人会再来调停。高原上只能留下一个声音。"

 YSS_Local_History_Page_01: "公元前八世纪，来自阿拉伯半岛南部的移民在埃塞俄比亚高原北端定居下来，带来了灌溉、石砌与文字。他们建立的达尔马特王国，是这片土地上第一个留下姓名的国家。此后的几个世纪里，阿克苏姆城从红海商道的终点长成了帝国的都城——商队从内陆驮来象牙、乳香与黄金，船队从印度洋驶入阿杜利斯港，城中的花岗岩石柱一根比一根高，最高的那座有三十三米，至今还立在那里。\n\n公元四世纪，国王埃扎纳受洗。给他施洗的是亚历山大城的教会，罗马和波斯都没能插手。从那天起，高原上的基督教与红海对岸的伊斯兰教、与南方更古老的信仰，在这片土地上开始了一场延续一千五百年的拉锯。七世纪阿拉伯帝国席卷北非时，阿克苏姆的城墙挡住了兵锋，却没有挡住商路改道：红海的港口一座接一座荒废，帝国缩回高原，只剩下一座座石柱，还记着它曾经同时望着三个大陆。\n\n高原上的人说，示巴女王曾在耶路撒冷为所罗门王生下儿子，约柜至今仍藏在阿克苏姆的教堂里。信不信由你，反正历代的皇帝都是这么说的。"

 YSS_Local_History_Page_02: "十一世纪，高原南部的扎格维王朝取代了衰落的阿克苏姆王族。他们在拉利贝拉的山岩里凿出十一座教堂，用一整块岩石凿成一座穹顶。在被敌人包围的高原上，教堂就得凿在最不容易被挖出来的地方。\n\n1270年，一位自称所罗门后裔的修士结束了扎格维的统治，把王冠重新带回阿姆哈拉。此后六百年，这个王朝在高原上反复迁徙：先是大厦，再是贡德尔，然后是没完没了的宫廷内斗。十六世纪，东方的阿达尔苏丹国在伊玛目艾哈迈德率领下几乎把帝国打穿，皇帝一度只能在山上打游击；葡萄牙火绳枪手跨海而来，替皇帝赢回了王朝，也把耶稣会士一起带来了。于是又有了一场关于信仰的战争，这一次的敌人换成了拉丁教会。皇帝赶走了耶稣会，关上了国门。此后两百年，高原成为一座孤岛。\n\n孤岛上有自己的历法、自己的文字、自己的圣徒。它不知道欧洲发生了什么，欧洲也几乎忘了它还在那儿。直到十九世纪，第一批英国探险家带着望远镜和火枪爬上高原，才发现这座岛上还坐着一位自称所罗门与示巴之后的皇帝。"

 YSS_Local_History_Page_03: "高原上的居民从来不止一种。人类与兽人在这片土地上各占一半，谁也说不清哪一支先来。人类多在高原的耕地与市镇上，兽人多在低地与半山的牧场、盐矿和商道边。同属一个被称为“人族”的大范畴，两边的日子却不一样：地契、税册、教堂里的席位，多半写着人类的名字；兽人的名字多出现在佃租账上。\n\n这也不是什么秘密。十九世纪末，高原上的贵族学会了把土地当作抵押品，向亚的斯亚贝巴的商人借钱，再把整片村庄的佃租抵出去。1888年那份在伦敦签下的文件给了帝国一个体面的名字，却没有给佃农任何东西。到二十世纪，高原上最不缺的是教堂，最缺的是自己的地。\n\n1936年的春天，一支土地测量队第一次带着卷尺和绘图板走进奥罗米亚的村庄。老人们站在田埂上看，不知道这些人是来分地，还是来登记。他们很快就会知道。"

