 YSS_tudigeming_category: "土地革命"

 YSS_tudigeming_category_desc: "尽管国家已经统一，新解放区上封建殖民制度仍然没有完全废除。我们需要加紧革命，推进这些地方的土地革命。\n\n§R完成土地革命所有决议可以获得新解放区的核心。§!"

 YSS_tudigeming_1: "消灭匪患"

 YSS_tudigeming_1_desc: "内战过后，新解放区仍然残留着大量来自前封建殖民军队的土匪和王公私人武装。我们必须宣布军事管制，消灭土匪武装，夺走王公们的武器，这样新解放区的人民才能安全。"

 YSS_tudigeming_2: "土地再分配"

 YSS_tudigeming_2_desc: "组建农会，贫农团体来分配没收所得殖民者土地和王公的多余土地，并赋予他们监督土地流转的权力。"

 YSS_tudigeming_3: "成立人民政府"

 YSS_tudigeming_3_desc: "随着安全和土地问题解决，新解放区终于重归稳定。是时候结束军事管理，重归正常了。"

