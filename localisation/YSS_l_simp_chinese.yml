 # 决议组介绍（配合 114x101 档案头图）
 YSS_civil_war_category_desc:0 "统一高原的战事已经打响。趁列强深陷大萧条、无暇顾及红海之际，集中主力先打垮一边，再合围另一边，彻底结束十三年的分裂僵局。"
 YSS_renwu_category_desc:0 "第八次党代会之后，中央政治局把国家整顿拆成了一张张限期交卷的硬指标。每一项任务按期落地，都能替联盟稳住党政军各条战线的基本盘。"
 YSS_dao_category_desc:0 "红海沿岸与东非腹地的几块故土仍在列强殖民政府手里。与其在力量不足时硬碰硬，不如先凭国库黄金与外交筹码，一步步把历史疆域赎回联盟版图。"
 YSS_kj_buy_category_desc:0 "国内航空工业尚在起步，眼下要让红军航空兵先飞起来，只能动用外汇与政治筹码向航空强国成批订购战机，再边飞边仿制。"
 # 非洲阵线专属阵营目标
 YSS_faction_goal_seize_historic_opportunity_name: "抓住历史机遇"
 YSS_faction_goal_seize_historic_opportunity_desc: "十三年的分裂与停火已经走到尽头。趁列强深陷危机、无暇他顾之机，彻底消灭北方复辟政权与东部殖民当局，将阿克苏姆全境重新统一在联盟旗帜之下。"
 YSS_COLLECTION_UNUNIFIED_AKSUM_STATES: "尚未由联盟完全控制的阿克苏姆地区"
 YSS_faction_goal_build_core_metropolitan_circle_name: "建设核心城市圈"
 YSS_faction_goal_build_core_metropolitan_circle_desc: "首都亚的斯亚贝巴是全联盟的政治与交通中枢。将首都所在地区的基础设施建设至最高等级，为全国物资调度与核心工业布局打通主动脉。"
 YSS_faction_goal_develop_second_capital_name: "发展第二首都"
 YSS_faction_goal_develop_second_capital_desc: "依托千歌特马的枢纽位置，将哈勒尔建设为分担首都压力的副中心：在此落成至少三座工厂，并将该地区的行政等级与开发程度一并推至最高级。"
 YSS_faction_goal_second_capital_factories_tt: "千歌特马所在地区拥有至少 §Y3§! 座工厂（民用工厂或军用工厂）"
 YSS_faction_goal_expand_rear_base_name: "后方基地扩建"
 YSS_faction_goal_expand_rear_base_desc: "叶狮古德背靠高原腹地，是战时保存军工命脉的理想纵深。将该地区的兵工厂扩建至五座，筑牢联盟的战略后方兵工基地。"
 YSS_faction_goal_achieve_economic_targets_name: "达成经济指标"
 YSS_faction_goal_achieve_economic_targets_desc: "只有把纸面规划落成冒烟的烟囱，革命政权才算真正站稳脚跟。圆满完成第一个三年计划，并将全国总工厂数推进至四十座以上。"
 YSS_faction_goal_rebuild_red_air_force_name: "重建红空军"
 YSS_faction_goal_rebuild_red_air_force_desc: "没有制空权的红军在现代战场上寸步难行。清整旧弊、扩充产能并编成现役航空联队，让至少五十架战机重新升上非洲之角的天空。"
 YSS_faction_goal_reclaim_sudan_region_name: "收复苏丹大区"
 YSS_faction_goal_reclaim_sudan_region_desc: "沿青尼罗河谷向西北推进，将卡萨拉-森纳尔与努比亚并入联盟版图，彻底打通红海西岸与尼罗河上游的战略防线。"
 YSS_faction_goal_complete_liberation_mission_name: "完成解放使命"
 YSS_faction_goal_complete_liberation_mission_desc: "索维耶特联盟不是孤悬红海之滨的一座孤岛。打垮盘踞大陆的殖民总督与反动军阀，让非洲阵线的旗帜覆盖整片非洲大陆。"
 YSS_COLLECTION_UNLIBERATED_AFRICA_STATES: "尚未由非洲阵线控制的非洲可通行地区"
