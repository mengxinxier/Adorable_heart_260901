 Adorable_heart_city_story_title_ydsybb: "鲜花之都-亚的斯亚贝巴"
 Adorable_heart_city_story_desc_ydsybb: "亚的斯亚贝巴在阿姆哈拉语中意为“新鲜的花朵”。半个世纪前，这里还只是1886年孟尼利克二世皇后泰图扎下的一片营帐，如今已经成了非洲之角最大的都会。这朵花长在高原赤土里，根扎在阿克苏姆千年的旧制上，头上却挂着“索维耶特”的红旗。它是联盟的政治中枢，也是周边列强领事馆终日盯梢的焦点。\n一条看不见的界线把城分作两半，白天的喧闹又把两边搅在一处。\n北城是革命的地盘。人民议会大厦居中而立，花岗岩门廊上飘着红旗。当年留学归来的军官穿深褐色制服，在走廊里用阿姆哈拉语夹着德法战术术语争论不休。城北军事学院的操场上，年轻军官端着近代工厂造的步枪操练，喊出的军歌调子却仍是阿克苏姆流传下来的古赞美诗。\n南城留着旧帝国的影子。阿克苏姆圣城派来的宗主教在此设了驻跸处，旧宫廷的文书官仍用吉兹语写公文，贵族住在石砌宅邸里，院中种着从也门引来的咖啡树。她们口中仍管这里叫“芬芬”——那是城市的古名，仿佛“亚的斯亚贝巴”只是个迟早要换掉的临时招牌。\n两片城区的交界处是梅斯克尔广场。每年九月，城里人都在这里点起篝火过梅斯克尔节，纪念公元四世纪圣海伦娜寻得真十字架碎片的传说。今年，篝火旁多了一排从德国进口的高音喇叭，轮番播送索维耶特人民委员会的通告。旧礼俗与新政令挤在同一片广场上，谁也压不过谁。\n§C亚的斯亚贝巴是非洲之角最喧闹、也最奇异的城。§!"
