 YSS_1: "一团乱麻的宗教信仰"
 YSS_1_desc: "社会主义？逊尼派？阿克苏姆教义？基督教？没人说得上来联盟到底信什么，这个古老又撕裂的国度，兴许自己都还没想明白该拿什么把人民拢在一起。"
 YSS_1_0: "一团乱麻的宗教信仰"
 YSS_1_1: "一团乱麻的宗教信仰"
