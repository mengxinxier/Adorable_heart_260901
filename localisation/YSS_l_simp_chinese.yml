 YSS_red_army_modifier: "联盟红军"
 YSS_red_army_modifier_desc: "国家红军是一支保卫人民的军队，她们对党忠诚，时刻准备着为了联盟抛头颅洒热血。"
 YSS_red_navy_modifier: "联盟海军"
 YSS_red_navy_modifier_desc: "索马里和东非之角的海洋将由联盟掌控。虽然海军仍处于起步阶段，但联盟的理想是建立一支东可以出击印度洋，北可以掌控尼罗河的强大海军。"
 YSS_red_airforce_modifier: "联盟空军"
 YSS_red_airforce_modifier_desc: "非洲辽阔的天空，一千年里只有雄鹰飞过。联盟想建一支独立自主的空军，即便追不上西方列强，至少也能守住自己的头顶。随着立体作战的兴起，这笔账已经拖不下去了。"
 YSS_peasant_economy_idea: "小农经济主导"
 YSS_peasant_economy_idea_desc: "阿克苏姆本质还是那个阿克苏姆——沉寂了千年的黑非洲农业社会。共和国留下的那点工厂重新开了起来，可土地还攥在王公与富农手里，小农经济为主导的劣势依旧没有改变。"
 YSS_economic_blockade_idea: "经济封锁"
 YSS_economic_blockade_idea_desc: "作为所有帝国主义者都不希望看到的国家，我们面临着多个国家组成的联合经济封锁网。"
 YSS_politburo_modifier: "中央政治局"
 YSS_politburo_modifier_desc: "中央政治局是我国的最高决策机构，党代表大会闭会期间，一切大事由它拍板。从1910年政变时的几十个人，到现在遍布全国的党组织，这个东非的革命之脑的一举一动，都影响着阿克苏姆的千万人。无论有人称赞或是讽刺，有一点是肯定的：想轻易摧毁它，并非易事。"
 YSS_economic_committee_modifier: "经济统筹委员会"
 YSS_economic_committee_modifier_desc: "经委会是为统筹全国经济而设立的。党代会一直认定，高度集中的计划经济可以快速推动工业发展——前提是先凑齐实行计划经济的条件：一份可信的统计、一批能读懂图纸的工程师，还有足够的粮食。§R出于我们薄弱的工业实力，在完成第一个三年计划之前无法修建民用和军用工厂。§!"
 YSS_impure_party_modifier: "不纯洁的党组织"
 YSS_impure_party_modifier_desc: "§R我讨厌她们。§!\n\n为了抢时间稳定局势，党内最初没有搞激进清洗。不少旧王公为了保住权势顺势入了党，胸口别着的东西从狮子徽章换成了镰刀锤子，行事却一点没变。至于大批新近入党的成员，底细同样有待商榷……"
 YSS_grim_international_situation_idea: "严峻的国际局势"
 YSS_grim_international_situation_idea_desc: "阿克苏姆作为新兴的社会主义国家，被数个殖民总督区团团包围，红军必须时刻警戒，以应对一切可能的西方国家对我国主权的无理侵犯。"
