#新闻内容
 YSS.news.1.t: "$news_event_background$东非之角爆发战争" #新闻头条
 YSS.news.1.d: "亚的斯亚贝巴的索维耶特联盟中央委员会今日正式颁布全国动员令。红军部队已越过停战线，向北方复辟政权与东部的意呆莉殖民军发动全面进攻，长达十三年的对峙在炮声中告终。\n\n尽管联盟工业薄弱、部队重装备匮乏，大批刚刚完成整编的士兵仍以惊人的决绝压向敌军阵地。\n\n国际观察家普遍认为，这一仗将重画红海沿岸的势力版图，而冲在最前线的底层农奴与兽耳士兵，恐怕会让轻视他们的对手吃尽苦头。"
 YSS.news.1.a: "起来，做决死斗争！" #联盟视角
 YSS.news.1.b: "怎么偏偏在这个时候..." #圣杯视角
 YSS.news.1.c: "她们似乎想要凭借数量取胜。" #其他国家视角
 YSS.news.2.t: "$news_event_background$门柯思图去世"
 YSS.news.2.d: "索维耶特社会主义联盟总书记门柯思图，已经于近日去世，死因是突发主动脉瘤破裂。据有关人士声称，门柯思图早在数年前就已确诊主动脉瘤问题，然而其出于风险考虑，选择了姑息治疗。联盟主席高海千歌目前宣布代理其党内职务，并组织治丧事宜。"
 YSS.news.2.a: "伟人之逝"
 YSS.news.2.b: "团结在高海千歌主席周围"
 YSS.news.2.c: "舵手已逝，扬帆启航"
 YSS.news.2.e: "联盟接下来会怎样？"

#事件介绍
 YSS.2.t: "解体"
 YSS.2.d: "由于我们没有妥善处理好国内的状况，中央已经无法压制那些封建余孽，她们把修道院里的皇帝搬了出来，推翻了无产阶级的统治。"
 YSS.2.a: "不，是我们的路……"
 YSS.3.t: "议程一"
 YSS.3.d: "“……我必须指出，国内局势虽然基本稳住，经济状况却远远称不上乐观。过去二十五年里，伊尔玛政权在工业上几乎毫无建树，顶多算勉强守住了旧摊子。如今我们能运转的只有些粗浅的轻工业和农产品加工，设备老旧、门类残缺，重工业更是薄弱得可怜。比起旧帝国，我们多出来的不过是几条铁路和一座略显近代模样的亚的斯亚贝巴。不过，推翻伊尔玛集团、拨乱反正以来，局面已经松动了。我们完成了铁路国有化和初步土改，大批靠得住的铁路工人、佃农和退伍老兵正在被送去培训成干部。只要运输、土地和干部这三样陆续齐备，联盟就有底气迈出工业化的第一步。”"
 YSS.3.a: "报告人：国家经济统筹委员会的主要负责人，白"
 YSS.4.t: "议程二"
 YSS.4.d: "“……新解放区的基层行政虽然暂时稳住了，但新旧解放区之间的落差，以及国内的民族与种族矛盾绝不能回避。尽管人类与兽人在这片高原上人口几乎各占一半，兽人的经济地位却长期被压在底下，自耕农比例只有人类的三分之一。而在新解放区，近六成土地仍攥在王公和人类富农手里。土地革命要想站住脚，先得把人类与兽人的平等问题摆平；否则，就算今天把地分下去，兽人也很难凭自己守得住。我们打算先从扩大兽人党员比例入手，一步步拉平双方在人格、教育、财产和出路上的差距——这注定是桩苦差事，急不得，也拖不得。”"
 YSS.4.a: "报告人：农业人民委员国木田花丸，重工业人民委员阿诺德"
 YSS.5.t: "议程三"
 YSS.5.d: "“……阿克苏姆帝国和东非总督府已经成了过去，可替它们撑腰的人并未收手：罗马的报纸把东非易手骂作「文明的倒退」，开罗总督府在边境加紧筑垒，圣杯王国拒绝承认我国，还把我们的商船列入了禁运名单。\n\n不过，东非的战果也引起了莫斯科的注意。早年苏联曾向伊尔玛政权派过一小批志愿者，后来见伊尔玛毫无作为，失望而归。眼下据外事渠道回报，苏联驻开罗办事处正在大批搜购我国地图，显然对这边重新动了心思。既然旧世界容不下我们，我们理应主动向莫斯科靠拢，争取苏联的援助与技术来撑起现代化。唯有把自己的拳头攒硬、把战略回旋余地打出来，我们才能在列强的围堵下活下去。”"
 YSS.5.a: "署名：外交人民委员真由理"
 YSS.6.t: "突发议程"
 YSS.6.d: "就在国家主席千歌同志准备结束这次会议的时候，门柯思图同志突然打断了主席同志的发言，宣布了关于取代1910年宪法的联盟新宪法草案进度，并将草案分发到了每个代表的桌上。虽然很多人都已经或多或少知道了新宪法正在草拟的情况，但总书记同志的突然袭击让她们感到措手不及。"
 YSS.6.a: "总书记同志想要干什么？"
 YSS.7.t: "致：联盟国家主席 高海千歌同志"
 YSS.7.d: "千歌同志：\n\n关于宪法的问题，我有一些想法需要与你沟通。\n\n1910年的那部宪法，是伊尔玛大统领在皇宫阳台上念出来的。它诞生于政变的第二天早上，它的作者们连一次像样的制宪会议都没有开过，只是把欧洲各国宪法胡乱拼凑齐全了事。它完成了自己的历史任务，把王冠从皇帝头上摘了下来。但目前来看，它在推翻皇帝后就已经失去了存在的意义。二十五年里，依仗这部宪法，王公和买办资本家凭借着知识和财富鸿沟，依然如帝制时期一样横行。\n\n自推翻伊尔玛之后，这个国家的阶级力量对比已经改变。我们重新分配了土地，国有化了工厂，工人和佃农第一次有了说话的地方。既然如此，国家力量就应该跟进，保障他们的基本权利。\n\n我认为，新宪法尤其不应该像旧宪法那样在密室里写成，它的骨架可以来自外国先进的经验，但应当接受全体民众的检验。否则，它就不会长久。宪法应当脚踏实地，开篇就要把人民群众的斗争成果写上，起到统领全篇的作用，这样，它才能得到人民群众的长久拥护。\n\n此外，我倾向于引入全民公决制度，让这部宪法在程序上更具合法性。\n\n这份工作必须严肃对待。我希望你能以中央执行委员会主席的身份，在近期组织相关同志，开始新宪法的宣传准备工作。我们需要在下一届党代表大会上，正式提出并通过这部新宪法，为此，我会为一切组织事务提供帮助。\n\n祝你诸事顺遂。"
 YSS.7.a: "你的门柯思图"
 YSS.8.t: "公开反对"
 YSS.8.d: "出于突然袭击的考虑，新宪法并未让全国代表们提前知晓其中内容，以避免互相串联的情况。但在粗略看完手中的草案后，面对其中提出的将地方权利收归中央，执行差额代表选举，禁止旧官僚，不劳而获者和神职人员选举和提高佃农与工人选举权重的条款，大多数代表都表达了反对意见。如果就这样下去，我们根本没法通过宪法。"
 YSS.8.a: "意料之中。"
 YSS.9.t: "地方集团联名反对"
 YSS.9.d: "草案中废除地方自治、将权力收归中央的条款引起了地方集团的高度警觉。来自各个地方的实权人士正在联名情愿，试图以集体抵制的强硬姿态逼迫中央放弃集权的宪法条款。"
 YSS.9.a: "他们真的代表人民吗？"
 YSS.10.t: "民众对宪法漠不关心"
 YSS.10.d: "由于新宪法的起草始终在高层进行，未向普通民众公开详细内容，加上接连不断的争论和拖延，底层民众普遍认为这只是高层官僚之间的权力斗争，因此对宪法的推行表现出极度的冷漠和旁观态度。"
 YSS.10.a: "宣传部门救一下啊！"
 YSS.11.t: "来自全国各地的反对信"
 YSS.11.d: "来自全国各地基层干部的反对信如雪片般飞往首都。信中大谈中央收权将会破坏地方稳定，并暗示强行通过宪法会导致社会动荡，这让中央内部对强行推行新宪法的决心产生了动摇。"
 YSS.11.a: "难道新宪法的内容确实不适合现在的环境？"
 YSS.12.t: "表决再次失败"
 YSS.12.d: "在多方掣肘下，重开的表决会照样没能凑够法定赞成票。会场散得极快，新宪法草案就这么僵在了半道上。"
 YSS.12.a: "或许我们应该考虑一些干部们的意见。"
 YSS.12.b: "地方干部不可信，我们直接发动人民来支持我们。"
 YSS.13.t: "修订"
 YSS.13.d: "为了打破僵局，宪法修订委员会痛定思痛，删除了部分过于激进的条款，放弃了高度集权，在征税权、地方干部任免权上做出了重大让步，并删去了提高佃农与工人选举权重的条文。修订后的草案很大程度上顾及了地方干部的利益，终于换取了大部分人的初步赞同。"
 YSS.13.a: "暂时的妥协……"
 YSS.14.t: "积极参与的人民群众"
 YSS.14.d: "党组织绕开官僚，直接动员群众的方针卓有成效。在动员民众进行集体讨论后，被压抑已久的广大人民群众终于发出了自己的声音。在大量地方，被发动的群众积极维护自己的宪法权利，怒斥地方干部是为了保住自己的一己私利而阻挡国家进步，形成了声势浩大的倒地方运动。这种压力迫使足够多的代表支持宪法，宪法通过已经只是时间问题。"
 YSS.14.a: "群众路线，一抓就灵！"
 YSS.15.t: "最终草案"
 YSS.15.d: "几番拉锯下来，定稿终于摆上了台面。里头满是向地方让步的痕迹，离最初的设想差了一截，可眼下能把各方稳住、不至于掀桌子，也就只能做到这一步了。"
 YSS.15.a: "先这样吧。"
 YSS.16.t: "最终草案"
 YSS.16.d: "顶着地方干部集团的重重抵制，趁着基层声援的势头，中央直接把未作妥协的终稿按过了表决。拖了这么久的死结，终于强行劈开了。"
 YSS.16.a: "到我们了！"
 YSS.17.t: "致索维耶特联盟总书记门柯思图"
 YSS.17.d: "亲爱的门柯思图同志：\n莫斯科向你们问好。这封信我写了两遍。第一遍太像公文，知世看了说，人家刚从街垒上下来，你给人家念文件做什么。我认为她说得对，所以这封信完全代表我个人的内心感受。\n去年你们夺权的那个晚上，亚的斯亚贝巴的广播念出革命委员会名单的时候，克里姆林宫走廊里议论纷纷，人们纷纷在讨论，门柯思图是谁？而如今，不会有人再问这样的问题，因为我们已经可以看到，在红海之滨，在那片被封建王权锁链压了千年的土地上，你领导着人民群众将红旗升起来了。列宁同志说过，帝国主义的链条会在最薄弱的环节断裂。他没有说那个环节一定在欧洲。从东欧平原到非洲之角，中间隔着地中海和红海；这段距离既然能断，大西洋、印度洋、太平洋那边，也未必不能断。\n可是门柯思图同志，我不能只跟你们说好话。\n你们换了旗子，但换了旗子的房子，往往还留着旧旗子的钉子。你们日后会发现，你们不能轻易地扫除顽固势力，他们会以另一种方式渗入革命的生活。你们的部长或许可以亲历亲为，但是当行政区划扩大后，你们将不得不面临与顽固势力暂时共存的现实。你们需要更多的知识分子和干部来建设国家，一刻也不能停歇，因为资本主义的围剿不会等待你们。但是你们缺乏教材，缺乏人手，更缺乏时间，你们可能不得不妥协于顽固势力，才能将国家运转下去。\n我们在建立苏维埃政权的头几年也犯过这个错：以为推翻了临时政府，打跑了白军和干涉军，革命就算完了。结果，饥荒，封锁和水兵兵变接踵而至。革命不是一次政变，是一场要把地基挖开重打的工程。谁要是以为换了旗子就大功告成，谁就是在替旧世界争取时间。\n所以，请你们把土地分下去，把军队整编好，把那些名字还留在王公门客名册上的人，一个一个替换掉。\n我以联共（布）中央和第三国际的名义，也以一个普通的革命者名义，请求你们：把这场革命做完。\n致以崇高的共产主义敬礼！"
 YSS.17.a: "署名：木之本樱"
 YSS.18.t: "红海来信"
 YSS.18.d: "红海南岸的社会主义革命成功，为我们提供了一个良好的机会。政治局商议后一致认为，用二五计划后淘汰的三十年代初工业设备去交换热带紧俏物资，如烟草，咖啡，宝石和黄金是一笔不错的交易。即使国内无法消化这些物资，也可以转手出口创汇。"
 YSS.18.b: "我还是想痛饮咖啡。"
 YSS.18.a: "打造革命橱窗的时候到了。"
 YSS.19.t: "苏联支援我国工业化"
 YSS.19.d: "苏联已经同意向我们提供低息卢布贷款以购买苏联工业品和聘用顾问，并以慷慨的价格收购我们的农产品以偿还贷款。换言之，苏联已经开始支援我们的工业化。"
 YSS.19.a: "老大哥都发话了，我们撸起袖子加油干吧！"
 YSS.20.t: "苏联支援我国工业化"
 YSS.20.d: "苏联已经同意向我们提供低息卢布贷款以购买苏联工业品和聘用顾问，并收购我们的农产品以偿还贷款。换言之，苏联已经开始支援我们的工业化。"
 YSS.20.a: "老大哥都发话了，我们撸起袖子加油干吧！"
 YSS.20.b: "这也并非不可……"
 YSS.21.t: "只剩滚木的空军"
 YSS.21.d: "调查组走进机场时，一度以为走错了废品站。宽敞的停机坪上连一架能滑出跑道的整机都没有，机库漏着雨，连垫机轮、修跑道的枕木都烂成了干裂的木头渣。放眼望去，整个所谓红军航空兵，只剩几截滚木和一地生锈的蒙皮。"
 YSS.21.a: "？空军为什么什么都没写"
 YSS.22.t: "玄学训练法"
 YSS.22.d: "翻开飞行大队的训练日志，调查组差点没敢信自己的眼睛。缺油、缺飞机，也缺正经教官，基层部队干脆自己找起了出路：不讲航线气象，不练编队战术，成天围着机库烧香算风向，拜起什么“空中战神”，指望靠香火把飞机保佑上天。"
 YSS.22.a: "我看做个梦也能上天了"
 YSS.23.t: "不称职的军官"
 YSS.23.d: "航空兵各级指挥位子上坐满了从未摸过操纵杆的钻营之辈。这帮人连最基础的气象图都认不全，批起采购和招待经费来却毫不手软。上回演习，一位连起落架开关都分不清的大队长硬把三架宝贵的教练机塞进了沼泽，事后不仅没挨处分，反倒写报告把锅全推给了“地势湿滑”。"
 YSS.23.a: "现在沼泽地除了飞机，还要多几个人了"
 YSS.24.t: "空无一物的库存"
 YSS.24.d: "调查组撬开后勤仓库的铁锁，才算见识了什么叫账实不符。账本上明明白白记着上百架备用机、成箱的航空炸弹和几万吨高标号航油；推门一看，里头除了窜来窜去的老鼠和一捆伪造的出入库单，空得能跑马。大笔军费与航材，早顺着空军高层的私门流进了黑市。"
 YSS.24.a: "他们最好能飞着跑掉"
 YSS.25.t: "空军中的破坏分子"
 YSS.25.d: "内务人民委员部接手之后，查出来的已经不只是贪墨。有组织的破坏分子就混在机务和参谋部门里：往发动机气缸塞细沙，往航油桶里掺水，偷偷篡改夜航领航表。她们冲着的不是几个钱，而是要在起飞跑道上把我们的飞行员和防空底子一并送进坟墓。"
 YSS.25.a: "秃鹫食腐……"
 YSS.26.t: "来自国家经济统筹委员会的报告"
 YSS.26.d: "第一个三年计划还在起草，指标尚未定稿，国家经济统筹委员会就先向中央交上了一份摸底报告。按中央的要求，这一次不许估算。\n\n数字很难看。全联盟能开工的工厂只有五家，设备都是帝国时代留下来的，机床的型号连图纸都找不全；电站只有亚的斯亚贝巴郊外那两座，装机容量还不够全城点灯；也没有一份完整的工业普查——各省报上来的产量彼此对不上，同一批钢材在三个省的账上各记了一次。\n\n报告的最后一句是：计划不是许愿。指标只能按这个家底分；定高了，第一年就会落空。"
 YSS.26.a: "把账算清楚，再谈指标。"
 YSS.27.t: "阿诺德同志的报告"
 YSS.27.d: "主持重工业技术的阿诺德交了份补充报告，话讲得很直白：厂房倒是凑出几座，可熟练工和工程师缺得厉害；西方封锁一收紧，精密机床和关键备件全断了供，不少车间现在只能拆旧机器补新机器，勉强让轮子先转着。"
 YSS.27.a: "看来我们要重视技术上的难关。"
 YSS.28.t: "建设当中的实际问题"
 YSS.28.d: "不少地方官员只顾着往上报漂亮数字，压根不管当地有没有水电和铁路，拍脑袋就上大项目。款拨下去了，机器拉到荒地里淋了半年雨，水不通、电不亮、路没修，最后落得个半拉子工地，白白糟蹋了紧缺的钢材和预算。"
 YSS.28.a: "记下了。"
 YSS.29.t: "十几个部门，十几道公章"
 YSS.29.d: "摊子铺大了，衙门病也跟着冒了头。一个普通工程从递报告到破土动工，要跑十几个部门、盖十几道公章。这个科卡一下，那个处吃一笔，一份公文在亚的斯亚贝巴的走廊里转上一圈，半年工期就这么耗光了。"
 YSS.29.a: "记下了。"
 YSS.30.t: ""
 YSS.30.d: "阿诺德：\n\n重工业人民委员部报上来的摸底材料我都看过了。老实说，比我原先估的强些：亚的斯亚贝巴钢铁厂的炉子还烧着，提格雷的煤矿也没停。摊子这么破，你们那条线上的同志能把架子撑住，不容易。外头那些人天天盼着我们停工散伙，机器还转着，就是最硬的回话。你这阵子出力不少，中央心里有数。\n\n话说到这里，毛病也得摆在明面上。机器是转起来了，出活的质量却惨得很。好些厂子为了凑报表上的吨数，铁水没炼透就往模子里倒，白糟蹋好料；几座复工的矿井和车间更是乱作一团，扯皮磨洋工，设备开足的时候连设计产能一半都不到。还有技术骨干的事，老指望外国专家不是长久之计，我们自己的红色工程师必须抓紧带出来。顺便给底下那些厂长带句话：别拿假账糊弄中央，查出来谁也保不住她们。\n\n这些留到明天会上逐条掰扯。今天单独写这几行，是为另一件事——你的身子。\n\n前两天开完会走过走廊，我看你眼窝深得吓人，随口问了你的秘书，才知道你已经连着几周在办公室睡行军床，每天合眼不到四个钟头，全靠浓茶和烟顶着。阿诺德，工业化不是三天两头就能打完的仗。你要是累垮在图纸堆里，重工业部下一程谁来压阵？\n\n这回不是商量，算中央给你下的命令：这几天里挑一天，彻底歇着。不准进办公室，不准见下属，报表一张不许看。去郊外树林里走走也好，拔掉电话线在床上蒙头睡一整天也好，总之离办公桌远点。\n\n下回医生的条子递上来，我希望看见写着“睡眠尚可”。\n\n致以同志的问候。"
 YSS.30.a: "门柯思图"
 YSS.31.t: "国木田花丸同志的报告"
 YSS.31.d: "国木田花丸交了一份关于地方吏治的详报。许多地方干部在一个州蹲了十几年，盘根错节、任人唯亲，早把公家地盘经营成了自家后院。中央的调令发下去压根推不动，她们还私下挑唆地方情绪，明里暗里顶着巡视组干。"
 YSS.31.a: "看来地方同志的山头主义很严重啊。"
 YSS.32.t: "杂乱无章的交通网络"
 YSS.32.d: "各省各自为政的苦果在交通上全露了出来。公路宽窄不一，铁路标准各吹各的号，半截路、断头路到处都是。最荒唐的是，相邻两州修的铁路连轨距都对不上，货到了省界全得靠人扛着换车，国家的经济命脉就这么卡在半道上。"
 YSS.32.a: "记下了。"
 YSS.33.t: "偷工减料的建筑工程"
 YSS.33.d: "巡视组抽查地方工地，抖出一串烂账。地方官和承包商串通虚报预算，好钢好水泥半道换成了次货。新建的厂房还没装机器墙先裂了缝，大桥未通车桥墩已经下沉——钱进了私人腰包，留给国家的是一堆随时会塌的危房。"
 YSS.33.a: "记下了。"
 YSS.34.t: "不配合的地方官僚"
 YSS.34.d: "巡视组刚要深挖，地方官僚立刻竖起了硬茬。藏账本、烧单据还是轻的，有几个县甚至煽动不明就里的乡民把调查组堵在旅馆门口，打着“保卫地方利益”的旗号起哄，存心把中央派来的人撵回去。"
 YSS.34.a: "记下了。"
 YSS.35.t: "颁布第一个三年计划"
 YSS.35.d: "把全国工厂的实底、各省的烂账和交通瓶颈一笔笔摊在政治局桌上之后，中央终于不再凭空画饼。经委会按现有产能和口粮重新核定指标，正式颁布第一个三年计划——联盟头一回拿出一份能对得上账的计划书，正式迈开了工业化的第一步。"
 YSS.35.a: "向着工业化迈步！"
 YSS.36.t: "海洋工业的欠缺"
 YSS.36.d: "联盟的造船家底薄得近乎空白。全国找不到一座能造大型水面舰艇的干船坞和重型龙门吊，舰用特种钢和主机更是无从谈起。现有几家船厂勉强能敲敲渔船和内河炮艇，工人们连正经军舰的施工图纸都没见过。海军想要一支像样的舰队，眼前连下米做饭的锅都没有。"
 YSS.36.a: "尽力克服吧。"
 YSS.37.t: "地理环境的限制"
 YSS.37.d: "海军参谋部的报告很干脆：地理上我们就先天吃亏。仅有的几个出海口离腹地工业区太远，又正对着列强的殖民基地。真打起来，对方只需在海峡口布上水雷、蹲几艘潜艇，就能把我们的船全憋死在港里。缺纵深、缺良港，这支海军一出门就踩在人家的枪口底下。"
 YSS.37.a: "我们本就处在风口浪尖......"
 YSS.38.t: "极为有限的财政预算"
 YSS.38.d: "中央定下的盘子是先陆军、再空军、最后才轮到海军。造舰计划和扩港预算在政治局桌上砍了一轮又一轮。面对见底的国库和憋着一肚子火的海军将领，中央也只能让他们再熬一熬。"
 YSS.38.a: "海军同志们再隐忍一下吧。"
 YSS.39.t: "军事改革一塌糊涂"
 YSS.39.d: "调查委员会递上来的军改评估把桌上的众人都看傻了。上面常年睁一只眼闭一只眼，底下地方派阳奉阴违，号称联盟柱石的红军早已被拆得七零八落，大半缩成了各地看家护院的杂牌部队，指挥系统拧成一团乱麻，十二年军改不过是攒了一堆废纸。"
 YSS.39.a: "事情比我想象的更糟糕......"
 YSS.41.t: "空有斗志的红军"
 YSS.41.d: "上面烂透了，基层却让巡视组看得心里发堵。普通战士仍然相信联盟，拉上战场敢往前冲。可一问起步炮协同、交替掩护这些基本战术，连排长都答不上来。人家端着机枪重炮打现代战争，我们只剩一股死拼的血气，这么送上火线，跟白白送死没有两样。"
 YSS.41.a: "这是怎么回事？"
 YSS.42.t: "严重漏缺的各式装备"
 YSS.42.d: "武器库清点下来同样惨不忍睹。纸面上满编的师，连卡车轮胎都凑不够一套；拨往部队的火炮半道上就能被地方官僚倒手卖掉。战士们扛着老式步枪，连人均几发实弹都供不上。再不抓出这群挖墙脚的蛀虫，红军迟早要毁在自己人手里。"
 YSS.42.a: "有些人要为此付出代价！"
 YSS.43.t: ""
 YSS.43.d: "致：亚的斯亚贝巴钢铁厂 里韦诺同志\n\n里韦诺同志：\n\n我在重工业人民委员部的生产简报里看到了你的名字。过去三个月，你累计完成了定额的百分之一百四十七，还把自己摸索出的快速铸铁法教给了同车间的十二名工友。我代表中央委员会向你道一声谢。\n\n你大概觉得这不过是本分——多出几炉铁，多带几个徒弟。可对眼下的联盟来说，每一吨多出来的铁水都是实打实的家底。外头的列强和城里的旧老爷都指望着我们的高炉熄火、厂门贴封条，你们车间这几个月交上来的实数，比发一百份声明都管用。\n\n听说你出身提格雷农家，没进过一天大学门，全靠跟着炉子转，把老辈传下的土法子改出了门道。文凭说明不了什么，懂炉温、懂料性才是真本事。中央眼下正在推“红色工程师”，你有空把操作步骤口述下来，让厂里文书抄成小册子，给其他车间的工人兄弟也看看。\n\n不过有件事也得提醒你。质量监察委员会报上来，采用快速铸铁法的几个炉次里，有一小批铁件硬度没过线。快是好事，但次品拉到兵工厂和机修厂就是废铁。你找厂里的技术员一块儿查查配料和火候，把质量稳住，这套法子才算真正立得住。\n\n顺便代我向你母亲问好。听说她总惦记你连轴上夜班熬坏身子。你替我转告她：中央要的是能干几十年的好工人，不是累垮在炉前的病号。该歇就歇。\n\n致以同志的问候。"
 YSS.43.a: "门柯思图"
 YSS.44.t: ""
 YSS.44.d: "致：联盟国家主席 高海千歌同志\n\n千歌：\n\n写这几行字的时候已经过了凌晨两点。政治局会议刚散，桌上还压着三十多份没批的卷宗。没什么要紧公事，就是累得睡不着，找你说两句实话。\n\n千歌，我这阵子实在有些顶不住了。每天睁开眼就是报不完的窟窿：钢产量差一截，得找阿诺德核账；空军编制烂得不像话，开会免不了拍桌子；地方王公串通抗税，要签调查令；连贵族子弟学校里那帮戴着红袖章念《宣言》的少爷小姐闹出丑闻，最后都得压到我案头。今天批完一尺，明早又码上一尺半，仿佛永远见不到桌板。\n\n夜里常合不上眼，干睁着看天花板。前天在走廊里咳得直不起腰，值班医生让我歇两天，被我顶回去了。这摊子哪儿容得下我歇？\n\n你还记得1910年冲进皇宫那一夜吗？那时觉得把老皇帝请进修道院，换了旗子，天就亮了。一晃二十多年过去，我还在跟同一拨旧官僚、假报表和收不上来的地租较劲。有时真觉得这个国家的每一块砖都得我亲自盯着烧，一松手墙就要歪。\n\n这些话在会上不能讲，全政治局也只有你见过我这副狼狈相。千歌，搭把手吧。那几项督查和地方协调的活儿，你以国家主席的名义直接压下去催一催，别什么都往我这边汇。我只需要腾出半天空当喘口气。\n\n这话就当你没看过。天亮之后，该拍的桌子照样得拍，该盯的账照样得盯。只是今晚，我实在不想再看哪怕一行铅字了。\n\n祝好。"
 YSS.44.a: "门柯思图"
 YSS.45.t: ""
 YSS.45.d: "致：我亲爱的娜塔莎\n\n娜塔莎：\n\n夜深了，亚的斯亚贝巴总算起了点凉风，把白天的燥气压下去些。刚送走最后一位来汇报工作的同志，屋里一静，听见院外哨兵换岗的脚步声，忽然很想喝你泡的那壶茶，也想看你在灯下安安静静翻书。\n\n昨天车队绕过城南，警卫说远远看见你在妇女识字班的院子里带着女工翻菜地。你向来坐不住，到哪儿都能把日子拾掇出模样来。只是你的胃老毛病一直没断根，讲完课千万按时吃饭，别顾着照看那帮姑娘孩子，自己又拿凉面包凑合。\n\n外头报纸上这阵子又多了些捕风捉影的闲话，你心思细，多半已经翻到了。别往心里去，党内这点风波算不了什么，我都压得住。\n\n倒是欠你一句抱歉。这几个月实在抽不开身，连院子里新栽的那几株咖啡树抽了芽，我都没顾上去看一眼。回到家往往已是半夜，留给你的永远是一身烟味和说不了两句就合眼的疲惫。\n\n可只要推开家门看见你在屋里，白天那些烂账和扯皮就都隔在了门外。人总得知道自己忙来忙去究竟是为了谁，看见你，我就还记得。\n\n我这边还好，顶多咖啡喝得比从前浓些。等下周这批案子落了地，我一定空出半天，咱们去恩托托山脚走走，不带文件，也不提半句公事。\n\n夜凉，早点歇着。\n\n你的，"
 YSS.45.a: "门柯思图"
 YSS.46.t: "就粮食征购问题致各省党委的紧急指示"
 YSS.46.d: "致：各省党委、各专区党委\n\n一、情况 农业人民委员部估产，南方本年收成较去年略有增长。同期，阿姆哈拉、提格雷、锡达莫三地上报：农户完成征购后口粮不足，部分村庄已以野菜、树皮代食。估产与上报不符，须逐县核对。\n\n二、指标\n\n各省党委于本月内重新核定已下达指标，对照实际产量，不得沿用上报数。\n\n征购后农户人均口粮低于最低生存标准的，退还所征部分，或由国家储备调拨补足。退粮与调拨不计入下年度指标。\n\n种子粮一律不得征购。已征者，原数退回。\n\n三、责任 由各省党委书记亲自负责，不得转交下属。逾期未改，或再出现征购后饿死人的，交革命法庭。\n\n四、纪律 纠偏不等于停征。城市与红军用粮指标不变；擅自取消征购的，同样交革命法庭。 征购中收受富农财物、留其粮仓而征走贫农种子粮的，查实一件，处理一件。\n\n五、汇报 收文后十五日内上报核定结果，附逐县口粮测算表。"
