 YSS.1600.t: "来自索维耶特联盟的加盟邀请"
 YSS.1600.d: "索维耶特联盟发来正式邀函，称见我国新秩序日渐稳固、革命根基已成，愿同我国合组联合阵线，把非洲各国的革命力量拧成一股绳，共同反击帝国主义干涉。"
 YSS.1600.a: "我们联合！"
 YSS.1600.b: "我国仍旧需要一定的时间去适应新秩序……"
 YSS.1601.t: "[FROM.GetName]谢绝了我们的加盟邀请"
 YSS.1601.d: "[FROM.GetName]方面复函婉拒了加盟提议，并附上国内实况说明，表示眼下仍有诸多善后与整顿事务亟待处理，希望暂缓入盟进程。"
 YSS.1601.a: "那我们继续支持你们"
