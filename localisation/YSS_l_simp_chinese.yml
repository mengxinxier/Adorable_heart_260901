 faction_template_Africa_union: "非洲阵线"
 YSS_officer_support_revoluntion: "来自索维耶特联盟的军官团支持"
 YSS_officer_support_revoluntion_desc: "索维耶特联盟派出的军事教官已进驻起义军营地，替这支草创武装补上了指挥与操典短板。"
 YSS_volunteer_to_other_country: "索维耶特联盟志愿军"
 YSS_volunteer_to_other_country_desc: "作为这片大陆的红色前哨，联盟向邻境起义战线派出志愿人员，协助当地工农武装打垮殖民政权与反动军阀。"
 YSS_the_cooperation_benefit: "合作共赢"
 YSS_the_cooperation_benefit_desc: "索维耶特联盟与友邦签下长期经贸与技术互助协定，互通有无，彼此补齐建设短板。"
 YSS_the_past_ruler: "旧日权威"
 YSS_the_useless_democratic_speeker: "虚伪的民主骗子"
 YSS_advisor_locked_because_anti_revolution: "这些顾问无法使用，因为她们与中央的理念不和或是有害于革命。"
 YSS_atom_heart: "原子之心"
 YSS_atom_heart_desc: "§L她把作战理论命名为「原子之心」：胜负最终取决于谁能在战线上堆出更多的师，以及谁能把它们更快地练成活人。§!"
 YSS_GUARD.8001.t: "联盟的命运"
 YSS_GUARD.8001.d: "联盟的生死存亡就看这一仗，手里能动的兵都得掂量着派上用场。荻花统领的革命近卫军一向镇守首都亚的斯亚贝巴、装备最为精良——现在该不该把她们也调往前线？"
 YSS_GUARD.8001.a: "毫无疑问，是的！让她们上吧！"
 YSS_GUARD.8001.a.tt: "在首都部署 §Y3§! 支「首都近卫军」师：9 个步兵营，支援连为火炮支援连、工兵连、宪兵队，团级支援为重武器连。装备与人力满编。"
 YSS_GUARD.8001.b: "我们的首都同样也需要保卫。"
 YSS_GUARD.8001.c: "让她们分一部分武器过来就好了。"
 YSS_love_live: "Love Live！"
 YSS_love_live_desc: "§L她们把排练室搬到了战壕里。歌声不算战术，但部队确实不容易被打散。§!"
 MODIFIER_EXPERIENCE_GAIN_FACTOR: "陆军将领经验获取"
 YSS_holy_see: "圣地"
 YSS_holy_see_desc: "§L圣地的圣徒只做一件事：把不属于人间的存在赶回黑暗里。她们正面迎击，不退，也不投降。§!"
 YSS_traveler: "旅人"
 YSS_traveler_desc: "§L她属于所有位面，也属于任何一个。行装永远打着，地图永远只画到下一站。§!"
 YSS_armored_titan: "铠之巨人"
 YSS_armored_titan_desc: "§L坚硬的骨甲覆盖全身，连炮火都能挡下。他冲起来的时候，大地会先一步知道。§!"
 YSS_bloodsucker: "吸血鬼"
 YSS_bloodsucker_desc: "§L血族的身体在夜色里比在白日里更锋利。夜战对血族而言如同白昼：行动更利落、士气更高，伤口也愈合得更快，连战斗中的损失都不那么容易让人心慌。§!"
 YSS_mage_tower: "法师塔"
 YSS_mage_tower_desc: "§L她站在黑塔的最上层，指挥的不是士兵，而是灵装列阵。法师塔的号令一出，灵装在咒文里重新成形。§!"
