 YSS.1001.t: "来自[FROM.GetName]的信件"
 YSS.1001.d: "[FROM.GetName]的地下同志发来密电：当地的革命组织已经站稳脚跟、群众基础初具规模，请求与我国里应外合，即日举事推翻殖民统治。"
 YSS.1001.a: "万事俱备，只欠东风！(§R注意！革命只有120天的窗口期！超过120天直接强制失败！§!)"
 YSS.1001.b: "时机未到，继续蛰伏！（继续准备30天）"
