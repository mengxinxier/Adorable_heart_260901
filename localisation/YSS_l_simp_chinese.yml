#人物介绍
 YSS_byner_name: "高海千歌"
 YSS_byner_DESC_1: "§Y高海千歌§!\n@YSS§Y索维耶特联盟§!的§O国家主席§!"
 YSS_byner_warrior_desc: "§L位子坐得再高，她看上去仍像个再普通不过的教书先生。\n\n常年握笔让她的手指微微起了茧，外套袖口总沾着一小块洗不净的墨渍。高海千歌从不在意这些。她只担心今天桌上的文件签不完，明天底下的救济粮和调令就得误事。人人都记得总书记在政治局会议上拍桌发火的模样，却很少留意散会之后，是谁留下来把翻倒的墨水瓶扶正，把散了页的草案重新按编号码齐，把争得面红耳赤的议题拆成一条条能落地的办法。高海千歌就是那个收拾摊子的人，极少站在掌声里露面。对她来说，信念不像口号，倒更像每天备课改卷子一样的习惯。她读过《共产党宣言》，也啃过《资本论》，但心里最清楚的还是眼前这摊账：这片千疮百孔的土地上，总得有人喊出方向，也得有人蹲下来把漏水的桶一只只补上。她不算什么风云人物，只在乎凌晨合上卷宗独自走回家时，亚的斯亚贝巴的街巷能不能比昨天安稳一分。\n\n教师是人类的灵魂工程师。§!"
 YSS_byner_Diplomacy_desc: "§Y高海千歌§!\n@YSS§Y索维耶特联盟§!的§O国家名誉主席§!"
 mlym_DESC: "列宁把礼物赠给世界人民，门柯思图的礼物是联盟本身。\n\n她并非天生心狠。处决名单一摞摞递上案头，基层半瘫，国库见底，几个山头宁肯勾结外敌也不肯交权。她也曾犹豫过，可围堵在外面的列强不会等她想明白，城里的旧贵族更不会因为她手软就交出地契。这个庞大、笨重、满身旧病的国家，只能靠她咬牙扛在肩上。她把自己整个搭进了这场豪赌，只为在非洲之角硬撑出一个不肯低头的红色政权。至于这份“礼物”最后换来的是生路还是绝路，她已无暇细算。骂名也好，颂歌也罢，她都一并接下，头也不回。\n\n也许历史的风向，早已对你不再有意义了吧。"
 YSS_mlym_NEW_DESC: "门柯思图最近总是睡得很浅。\n\n夜里醒来的时候，她会坐在床沿上，让护士把灯拨到最暗。她的身体这几年一直在往下走——医生说是常年积劳，心脏和血压都不大好，可没有人敢把话说尽。她自己心里有数：还能支撑多久，谁也说不准。\n\n灯光昏暗，案头那摞红色卷宗看着有些发花，恍惚间像极了1910年政变前夕抄写的讲稿。那时候他们都还年轻。如今，旧日并肩的战友有的已入黄土，曾经阿谀奉承的反对派散落各处，连修道院里那个疲惫的老皇帝，也成了遥远得像上辈子的事。"

#战争国策
 YSS_end_of_thirteen_year_stalemate: "十三年僵局之终"
 YSS_end_of_thirteen_year_stalemate_desc: "伊尔玛辜负了人民的期待，放任北方封建势力和东方殖民者分裂国疆。在总书记门柯思图的领导下，联盟红军已经改组，并尽可能地武装了起来。为了修正旧共和国的错误，全国上下必须齐心协力，积极地向敌人进攻！"
 YSS_distribute_war_supplies: "分发物资"
 YSS_distribute_war_supplies_desc: "过去，门柯思图借由自己在军队中的关系，一直控制着一批来自外国走私网络和苏联援助的军火、子弹、药品和载具，现在是将它们全部下发部队的时候了。这些装备必须尽可能在战争的头一个星期发挥最大作用，不给敌人进行持久战的机会。"
 YSS_infiltrate_enemy_territory: "渗透敌境"
 YSS_infiltrate_enemy_territory_desc: "我方将派出渗透工作人员前往敌境以完成组织农民斗争、革命宣传、策反敌方士兵与官员、侦察要地和敌军动向和组织破袭的任务。成败在此一举，渗透工作队应当有自我牺牲的准备。"
 YSS_mobilize_militia: "动员民兵"
 YSS_mobilize_militia_desc: "此次军事行动不仅要在漫长的边界上同时发动多处进攻，还需要派兵控制新领土，造成既成事实。为了稳固新领土，边境各地的党组织需要负责动员民兵完成协助占领任务。虽然他们手里只会有土造手榴弹、单发步枪，甚至雷汞枪和燧发枪，但只要他们能迟滞、骚扰敌人，坚持到主力赶来救火，就算成功。"
 YSS_mobilize_militia_tt: "§Y十五个民兵师将被集结到首都，他们装备匮乏，经验不足，但斗志昂扬！§!"
 YSS_launch_liberation_war: "[Get_YSS_war5_name]"
 YSS_launch_liberation_war_desc: "[Get_YSS_war5_desc]"
 YSS_war5_name_jibuti: "吉布提港事变"
 YSS_war5_name_daxiaotiao: "全国总攻击令"
 YSS_war5_desc_jibuti: "一艘事先安排好的联盟货轮将会在一个安静的夜晚被疏散并爆破，而货轮上会留下足以指向北方封建政权和东方殖民政府的伪证。我们会利用这个事件在边境挑起冲突，并在列强介入之前达成蚕食边境的既成事实。这将是我们为解放全国踏出的第一步。"
 YSS_war5_desc_daxiaotiao: "资本主义世界大萧条的爆发，为我方创造了一个极其有利的军事行动窗口。先前仅局限于蚕食边境的计划就此放弃，联盟红军将会趁列强深陷内部危机，无力干涉的机会解放全国。"
 YSS_war5_effect: "[Get_YSS_war5_effect]"
 YSS_war5_effect_jibuti: "§Y完成这个国策后，会在边境上发起边境战争。胜利后可以夺取阿克苏姆帝国或东非总督府一个省份，并解锁更多的冲突决议。§!"
 YSS_war5_effect_daxiaotiao: "§R为祖国的完全解放，前进！§!"
 YSS_founding_tasks_accomplished: "立国万事已周"
 YSS_founding_tasks_accomplished_desc: "命运之战的硝烟已经散去，阿克苏姆的群山与红海沿岸终于统合于一个国家里。接下来，党和国家的首要任务就要转到国家建设上来。"
 YSS_convene_eighth_party_congress: "召开第八次党大会"
 YSS_convene_eighth_party_congress_desc: "既然国家已经统一，党又摆脱了伊尔玛集团的控制，那么党就要重新担负起领导国家的责任。按照惯例，党每三年召开一次全国代表大会，今年正是第八次全国代表大会召开的年头。"
 YSS_agenda_stabilize_domestic_situation: "议题：稳定国内局势"
 YSS_agenda_stabilize_domestic_situation_desc: "无论我们有着怎样的抱负，稳定全国局势是万众所望，我们不能辜负人民的期待。国家将从战备中解放出来，而新解放区的行政机构将被保留，明显的罪犯、奸细和特务将会被惩处，而怠工和不学无术者会被清退，其他旧官员，警察都会被保留。"
 YSS_agenda_learn_from_past_experience: "议题：吸取过去经验"
 YSS_agenda_learn_from_past_experience_desc: "国家统一后，地区之间发展的不平衡问题已经难以无视。在过去一年，全国有近七万八千妇女首次获得受教育资格，但她们完全处在旧解放区，在原帝国和总督区地区，这个数字是零。这个现状警告我们，现有的革命速度必须加快，必须将解放之光快速地投射到新解放的地区去。"
 YSS_agenda_survey_international_situation: "议题：放眼国际局势"
 YSS_agenda_survey_international_situation_desc: "国家统一战争之后，我们已经和圣杯王国与意呆莉彻底交恶。尽管两国深陷大萧条危机，无力干涉我国，但作为世界上最发达的资本主义国家，圣杯王国对我国的封锁依然是我国的切肤之痛。我们必须要考虑新的对外政策。"
 YSS_announce_new_constitution_draft: "宣布新宪法的草案进度"
 YSS_announce_new_constitution_draft_desc: "废止1910年旧宪、起草一部属于联盟的根本法，是政变以来拖了最久的头等大事。新宪法将正式确立联盟的社会主义国体与政权架构，今天起草委员会将首次向全社会公开草案进度。"
 YSS_promote_constitution_unionwide: "向全联盟宣传宪法"
 YSS_promote_constitution_unionwide_desc: "宪法不能只是一纸空文。我们必须通过宣传机器与行政网络，让‘联盟宪法’的知名度覆盖到每一个区域，而非仅停留于亚的斯亚贝巴。"
 YSS_reach_limited_compromise: "达成有限妥协"
 YSS_reach_limited_compromise_desc: "为了宪法的顺利通过，我们选择削弱中央集权，删除提高工农选举权重和禁止旧社会精英投票的条款，以此换取干部们对新宪法的书面承认。"
 YSS_call_for_mass_discussion: "号召民众集体讨论"
 YSS_call_for_mass_discussion_desc: "把晦涩的法条译成通俗易懂的“十大权利与义务”，印成小册子发往工厂、学校和乡村支部，请工农兵代表当面提意见。联盟头一回真正把立法摆进了百姓手里。"
 YSS_reach_accord_with_cadres: "与党政干部达成协议"
 YSS_reach_accord_with_cadres_desc: "草案付诸表决之前，得先把党内实权派的口风统一起来。几场闭门会谈和政治许诺，足以确保关键人物不会在表决时发难。"
 YSS_organize_collective_discussion: "组织集体讨论"
 YSS_organize_collective_discussion_desc: "为了让宪法真正反映民意，中央决定暂时放宽报刊与集会的创办门槛，并要求地方党组织组织群众公开批评草案中的遗留封建条款。"
 YSS_revise_draft_articles: "对部分内容进行修订"
 YSS_revise_draft_articles_desc: "吸收群众讨论与干部协议中的“合理”建议，我们削弱了宪法中有关中央集权的条款，使其更符合联盟现状。"
 YSS_push_through_new_constitution: "施压通过新宪法"
 YSS_push_through_new_constitution_desc: "当协商陷入僵局时，唯有依靠中央权威打破僵局。中央将动用私人关系，群众批评，政治施压等非正式手段让一些投票代表“回心转意”。"
 YSS_vote_to_adopt_new_constitution: "投票通过新宪法"
 YSS_vote_to_adopt_new_constitution_desc: "历经拉锯、妥协与几轮改稿，带着多处让步条款的宪法终稿总算在全国代表大会上凑齐了赞成票。离最初的设想差了一截，联盟却到底立下了自己的根本大法。"
 YSS_report_on_party_revolutionary_character: "关于党员革命性质的报告"
 YSS_report_on_party_revolutionary_character_desc: "政变之后队伍扩得太快，党内成分早已泥沙俱下。中央下令逐一复核党员的家庭出身、留洋履历及与旧贵族的私交，先摸清家底再谈整顿。"
 YSS_audit_party_archives: "核对党内文件"
 YSS_audit_party_archives_desc: "调出内务部与各级党委历年封存的档案袋，把党员登记表、思想汇报和人事调令摆到一块对账。涂改过的履历和前后对不上的签名，正一页页露出来。"
 YSS_hidden_opposition_within: "隐藏在身边的反对派"
 YSS_hidden_opposition_within_desc: "查档结果很不乐观：一批出身贵族世家的党员，借着联姻与利益输送在党内织起了私网。她们嘴上不反联盟，真正听令的却不是中央。"
 YSS_rectify_nkvd: "对内务部进行整顿"
 YSS_rectify_nkvd_desc: "刀把子自己先锈了，还怎么切病灶？内务部里塞着不少旧帝国密探和投机客，拿它去查别人之前，得先把里头清理干净。"
 YSS_reestablish_central_investigation_committee: "中央调查委员会再组建"
 YSS_reestablish_central_investigation_committee_desc: "由总书记直接授命，另立一套独立于内务部和地方党委的中央调查委员会。人选专挑出身贫寒或无门第牵绊的年轻骨干，只认中央，不认山头。"
 YSS_yilma_counterrevolutionary_clique: "伊尔玛反革命集团"
 YSS_yilma_counterrevolutionary_clique_desc: "调查委员会头一锤砸出了实证：伊尔玛留在机关里的旧部正借着职权，暗中向地方王公倒卖军工物资、泄漏军情，这已经不是派系之争，而是通敌。"
 YSS_preserve_party_purity: "保持党的纯洁性"
 YSS_preserve_party_purity_desc: "抓出几个内鬼远远不够。从入党介绍、定期复审到群众检举，必须立起一套常态规矩，堵死投机分子二次钻营的门路。"
 YSS_reassert_central_party_authority: "重审党中央权威"
 YSS_reassert_central_party_authority_desc: "首都的钉子拔得差不多了，各省的官僚却还在阳奉阴违。中央的政令既然要出亚的斯亚贝巴城门，整顿就得铺到全联盟去。"
 YSS_replace_local_cadres: "撤换地方干部"
 YSS_replace_local_cadres_desc: "各省、军区和重点厂矿的一把手，有大半是当年向旧贵族妥协时硬塞进来的。中央以“政治立场不稳”为由，一口气撤换这批占位不干事的老油条。"
 YSS_expand_investigation_scope: "调查规模扩大化"
 YSS_expand_investigation_scope_desc: "只动地方官员，动不了贵族与官僚盘根错节的裙带网。审查范围顺势从党政军溢向高校、报馆乃至贵族子弟学校，沾上旧势力边的一律过筛。"
 YSS_curb_nkvd_authority: "限制内务部职权"
 YSS_curb_nkvd_authority_desc: "失控的刀迟早割伤握刀的人。中央及时收回内务部的无限侦讯权，把整肃限定在确有实据的目标内，免得肃反演成公报私仇。"
 YSS_root_out_internal_enemies: "彻查内部敌人"
 YSS_root_out_internal_enemies_desc: "借着铺开的审查网，调查委员会突击进驻各王公旧领的基层党委，把埋藏多年、与旧朝藕断丝连的暗桩连根起出。"
 YSS_eliminate_unreliable_elements: "肃清不合因素"
 YSS_eliminate_unreliable_elements_desc: "只要你对联盟不利，或者你想要对联盟不利，那你就要被清除！"
 YSS_thus_begins_the_purge: "于是清洗开始了"
 YSS_thus_begins_the_purge_desc: "整党终于越过了临界点。军委、内务部与调查委员会三线合流，一场席卷全联盟的清洗全面铺开，没人再敢保证明天早晨自己的名字不在名单上。"
 YSS_emergency_halt_to_purge: "紧急叫停"
 YSS_emergency_halt_to_purge_desc: "失控的清洗已经把基层绷到了断弦的边缘。一通来自最高层的紧急指令按下暂停键，全联盟的大规模搜捕与审查随即停摆，政治局转入追责与善后。"
 YSS_dismiss_purge_directors: "将负责人撤职"
 YSS_dismiss_purge_directors_desc: "要安抚党内外的惊恐，总得有人出来背这口锅。中央下令把主导扩大化清洗的内务部主官与激进调查员一并撤职调离，先替体制兜住底。"
 YSS_rehabilitate_wronged_cases: "平反冤假错案"
 YSS_rehabilitate_wronged_cases_desc: "中央另设复查专班，逐案重审清洗期间的定性卷宗。凡属屈打成招、证据不足或遭人构陷者，一律撤销处分、恢复党籍。"
 YSS_current_state_of_union_industry: "联盟现今之工业"
 YSS_current_state_of_union_industry_desc: "要定指标，先得知道手里有什么。中央统计委员会把全国工业从头数了一遍：能开工的工厂只有五家，设备是帝国时代留下来的，机床的型号连图纸都找不全；产量大多来自把旧设备重新转起来，而不是新建了什么。伊尔玛的共和国连一份完整的工业普查都没做过，联盟是从零开始记账的。这份清点既是成绩单，也是问题清单。"
 YSS_report_from_economic_coordination_committee: "来自国家经济统筹委员会的报告"
 YSS_report_from_economic_coordination_committee_desc: "国家经济统筹委员会提交了一份详尽的经济结构分析。报告承认，联盟接手的是一副烂摊子：大部分工厂是共和国从帝国手里接过的修理车间，设备老旧、门类残缺，重工业尤其单薄。战后这几个月里勉强拿得出手的成绩，也只是把这几座旧厂重新开动起来；真正的窟窿，是账面上从来没有过的那些东西——没有机床，没有图纸，没有能看懂图纸的工程师。"
 YSS_report_on_local_construction: "关于地方建设的报告"
 YSS_report_on_local_construction_desc: "地方建设报告充满了令人不安的数据：上报完工的项目里，真正投产的不到一半；同一批钢材在三个省的账本上被记了三次；有些县把去年的工地原样报成了今年的新项目。"
 YSS_practical_problems_in_construction: "建设当中的实际问题"
 YSS_practical_problems_in_construction_desc: "基层的技术底子薄、施工经验缺，再好的中央规划落到工地也会走样。这些现实短板，正卡着全联盟建设的脖子。"
 YSS_chaotic_administrative_procedures: "混乱的具体流程"
 YSS_chaotic_administrative_procedures_desc: "中央一笔拨款到工地手上，中间至少得过五道衙门。每过一道刮一层油，最后落到砖瓦钢材上的钱常常不到预算六成。"
 YSS_disorganized_transport_network: "杂乱无章的交通网络"
 YSS_disorganized_transport_network_desc: "现有的铁路公路全是帝国时代留下的底子，只顾着往亚的斯亚贝巴聚拢，省与省之间几乎没有横向连线；再加上王公们各自乱修的窄轨支线，物资一跨省就得卸车倒腾。"
 YSS_shoddy_construction_projects: "偷工减料的建筑工程"
 YSS_shoddy_construction_projects_desc: "调查组抽查了十二处重点工地，九处查出以次充好、私改图纸。承建商清一色是旧贵族的亲戚，验收签字早成了过场。"
 YSS_uncooperative_local_bureaucrats: "不配合的地方官僚"
 YSS_uncooperative_local_bureaucrats_desc: "一碰真账，不少地方官立刻板起脸来，拿“地方特殊情况”顶撞调查组，死活不交账簿——她们背后站着的，多半就是当地的旧王公。"
 YSS_promulgate_first_three_year_plan: "颁布第一个三年计划"
 YSS_promulgate_first_three_year_plan_desc: "摸底、整顿、把账重新算过之后，中央才正式颁布第一个三年计划。指标不再是从上往下派的数字，而是按各厂的实际产能、煤铁的实际产量、各省的实际口粮定的：该砍的砍，该加的加。计划第一次有了一份能对得上的账。"
 YSS_revise_first_three_year_plan: "修订第一个三年计划"
 YSS_revise_first_three_year_plan_desc: "吃过虚报和脱节的亏，又借着重启对苏联系打开了外部通道，中央印发《第一个三年计划修订纲要》：把零散小农逐步归入集体农庄，以国营统筹顶住帝国主义的经济封锁，再按实情重排国防、轻工与农业的硬指标。"
 YSS_reorganize_the_politburo: "改组政治局"
 YSS_reorganize_the_politburo_desc: "清洗风暴平息、冤假错案陆续平反之后，旧班子已经配不上新局面。在扩大化中越界的旧委员被请出决策层，空出的席位由在基层建设与统一战争中成长起来的务实骨干补上，以重塑最高决策层的权威与平衡。"
 YSS_convene_politburo_session: "召开政治局会议"
 YSS_convene_politburo_session_desc: "改组后的政治局头一回坐齐开会：给大清洗做结、拍板各省新任主官名单、审议党性新标准。联盟的权力中枢，从此换了一副新骨头。"
 YSS_redefine_party_spirit: "对于党性的重新定义"
 YSS_redefine_party_spirit_desc: "一味查三代早已查不出真假忠诚。中央委员会敲定新标准：不单凭出身断人，专看是否忠于联盟、是否同封建旧习割席、是否真肯下到群众中干活。"
 YSS_commissariat_of_defense_industry: "国防工业人民委员部"
 YSS_commissariat_of_defense_industry_desc: "军工不能再散在各省各自凑合。中央专设国防工业人民委员部，把全国兵工厂、设计局和军用原材料一并收归直管。"
 YSS_commissariat_of_light_industry: "轻工业人民委员部"
 YSS_commissariat_of_light_industry_desc: "棉布、盐巴和日用品样样靠进口，外汇早晚见底。轻工业人民委员部专管纺织、食品和日化制造，既稳住市面供应，也替重工业攒本钱。"
 YSS_commissariat_of_agriculture: "农业人民委员部"
 YSS_commissariat_of_agriculture_desc: "农业摊子最大，底子也最薄。重组扩编后的农业人民委员部要一手推集体化、一手抓选种和收粮，三年计划能不能站稳，全看庄稼地里给不给面子。"
 YSS_rationalize_defense_industry: "国防工业的合理组织"
 YSS_rationalize_defense_industry_desc: "现有的军工修配能力零散地落在各地的旧兵工车间、铁路机厂与手工作坊里，图纸各画各的，原料各抢各的。新委员部头一件事，就是把全国产能绘成一张总表，按轻重缓急分级统管。"
 YSS_technical_base_of_light_industry: "轻工业的技术基础"
 YSS_technical_base_of_light_industry_desc: "靠家庭手织机撑不起一个国家的穿衣吃饭。轻工业部打算动用外汇购进成套纺机与食品加工线，顺带办起技工班，把本地学徒带成熟练工。"
 YSS_raise_labor_efficiency: "提高劳动效率"
 YSS_raise_labor_efficiency_desc: "新机器一时买不齐，只能先从工时和工序里挤产能。拆细工段、试行计件工资，争取不动家底先把日产出往上拔三成。"
 YSS_call_for_collective_farms: "呼吁集体农庄"
 YSS_call_for_collective_farms_desc: "一家一户守着巴掌大的薄田，连头耕牛都凑不齐。农业部号召各村并户建庄，农具耕畜统管、地界打通连片，好把零散人力聚成规模。"
 YSS_ten_thousand_tractors_plan: "一万拖拉机计划"
 YSS_ten_thousand_tractors_plan_desc: "嘴上喊农业现代化，地里却还是木犁配人拉。农业部立下“一万拖拉机计划”的军令状——三年之内，要把一万台铁牛开进高原的庄稼地。"
 YSS_red_army_equipment_improvement_bureau: "红军装备改进局"
 YSS_red_army_equipment_improvement_bureau_desc: "部队手里的步枪大多是旧帝国剩的杂牌货，空军连张像样的飞机图纸都没有。装备改进局联合各设计所，着手定出新一代步枪、火炮与侦察机的制式标准。"
 YSS_general_military_construction_bureau: "总军事建设局"
 YSS_general_military_construction_bureau_desc: "在国防工业部下再设总军事建设局，专司新兵工厂选址、旧车间扩建以及厂区水电铁路配套，免得工厂盖好了却通不了车、送不进料。"
 YSS_establish_quality_inspection_committee: "成立质量监察委员会"
 YSS_establish_quality_inspection_committee_desc: "光赶产量不管质量，造出来的炮弹只会炸膛。质量监察委员会将向每座兵工厂派驻独立质检员，不达标的一律扣下，谁打招呼也不放行。"
 YSS_rectify_production_discipline: "整顿生产纪律"
 YSS_rectify_production_discipline_desc: "口头动员管不住散漫，新条例直接动真格：无故旷工扣配给，延误工期追主官责，敢在军品上弄虚作假的一律移送军事法庭。"
 YSS_adapt_factory_machinery: "工厂设备的适应化改进"
 YSS_adapt_factory_machinery_desc: "洋纺机吃不惯本地短绒棉，一开机就频频断线。工程师正拆机改罗拉和锭距，让进口设备认下高原自家种出来的棉花。"
 YSS_adopt_assembly_line_production: "学习流水线模式"
 YSS_adopt_assembly_line_production_desc: "留洋回来的工程师把欧洲的流水线作业法搬进了罐头厂和纺织厂。一道工序拆给一个人专做，新手上手快了一倍，产量也跟着蹿上去。"
 YSS_pilot_trade_union_democracy: "试验工会民主制度"
 YSS_pilot_trade_union_democracy_desc: "不能把厂长变成新式包工头。部分国营厂开始试行工会委员会，排产计划和食堂住房分配，都得听工人代表说话。"
 YSS_promote_stakhanovite_spirit: "提倡运动精神"
 YSS_promote_stakhanovite_spirit_desc: "宣传口把超额竞赛塑成全社会的头号荣誉。青年突击队在各车间轮番摆擂台，比谁废品少、比谁先交班。"
 YSS_establish_agricultural_cooperatives: "成立农产品合作社"
 YSS_establish_agricultural_cooperatives_desc: "单户农民进城卖粮，总被粮行压价坑得血本无归。由村社合办收购合作社，统收统售直接对接城里工厂，把中间商那层油水挤掉。"
 YSS_advance_fuel_and_chemical_industry: "燃料与化学工业的推进"
 YSS_advance_fuel_and_chemical_industry_desc: "没柴油拖拉机就是铁疙瘩，没化肥增产全是空话。农业部会同重工部门抢建小化肥厂和乡下油库，先替机械化铺好底料。"
 YSS_collective_farm_night_schools: "农庄夜校"
 YSS_collective_farm_night_schools_desc: "收工以后点起马灯，集体农庄的夜校就开课了。前半节认字算账，后半节讲轮作、治虫和修犁，先把文盲率往下摁。"
 YSS_defense_industry_leaping_forward: "国防工业正在跃进"
 YSS_defense_industry_leaping_forward_desc: "清账、定标、严质检一套组合拳打下来，主力兵工厂的月产量比整顿前翻了近一倍，出厂枪炮也头一回全数通过了独立验收。"
 YSS_triumph_of_light_industry: "轻工业的辉煌成就"
 YSS_triumph_of_light_industry_desc: "从手工作坊换到流水线，国产布匹、罐头和肥皂的产量较接手时翻了一番。街面上少了洋货的影子，工人食堂和制服也肉眼可见地阔气起来。"
 YSS_historic_leap_in_agriculture: "农业的历史性跨越"
 YSS_historic_leap_in_agriculture_desc: "集体农庄推得磕磕绊绊，一万台拖拉机也远没凑齐，但粮食实产、合作社和扫盲班的账面总算站住了。联盟头一次摸到了自给自足的底线。"
 YSS_complete_first_three_year_plan: "完成第一个三年计划"
 YSS_complete_first_three_year_plan_desc: "离当初的纸面蓝图虽还有一截距离，可国家的骨架已经变了样：经济命脉捏进了统筹委员会手里，零散小农与外部封锁的困局一并破开，联盟总算熬过了最脆的起步期。"
 YSS_tooltip_sannianjihua_flag19: "三年计划圆满完成！"
 YSS_emergency_mobilization_contingency_plan: "紧急预案动员计划"
 YSS_emergency_mobilization_contingency_plan_desc: "边界上列强的兵力一天没撤，和平建设就随时可能被打断。中央在三年计划的底子上另编一套战时总预案，从厂房转产到壮丁征召全部提前画好表。"
 YSS_rehearse_wartime_production: "对战时生产进行预演"
 YSS_rehearse_wartime_production_desc: "挑出一批民用机械厂拉响试警报，限期切入半军工状态试产零件。不发总动员令，先拿真机器测一测转产到底卡在哪个环节。"
 YSS_restrict_strategic_exports: "限制出口"
 YSS_restrict_strategic_exports_desc: "大仗随时可能打响，不能把救命物资全换成外汇卖出去。粮食、油料和有色金属即日起实行出口配额，优先塞满自家仓库。"
 YSS_establish_arms_and_ammunition_bureau: "成立枪支弹药局"
 YSS_establish_arms_and_ammunition_bureau_desc: "真打起仗来，子弹消耗比造枪快得多。从国防工业部单划出枪支弹药局，专盯口径统一、药料供应和前线基数测算。"
 YSS_resource_stockpile_planning_bureau: "资源预储备规划局"
 YSS_resource_stockpile_planning_bureau_desc: "光囤成品还不够，矿脉和能源得提前摸清。资源预储备规划局负责把全国矿藏、林区和水电站编目造册，排定战时优先开采次序。"
 YSS_wartime_evacuation_planning: "战时疏散规划"
 YSS_wartime_evacuation_planning_desc: "万一前线吃紧，靠边的工厂和熟练技工绝不能留给敌人。交通部与军工部联手排好了拆机装车顺序与内迁路线，真到那天按表照办。"
 YSS_reserve_manpower_bureau: "后备人力局"
 YSS_reserve_manpower_bureau_desc: "打仗拼铁，更拼人。后备人力局把全国适龄公民的工种、体格和文化底子逐一造册，确保征兵时不把稀缺钳工和电工全填进战壕。"
 YSS_consolidate_military_industrial_bases: "对军工生产基地进行统合"
 YSS_consolidate_military_industrial_bases_desc: "把撒在各省的零星车间并成几座成建制的军工基地，自备水电与修理厂，哪怕外面断线，厂区里照样能出炮弹。"
 YSS_estimate_wartime_finances: "对战时财政进行推算"
 YSS_estimate_wartime_finances_desc: "大炮一响，黄金万两。财政部拿出几套战时账本，把不同烈度下的军费缺口、通胀风险与税赋极限全算透，免得打到一半国库先崩。"
 YSS_adjust_industrial_layout: "调整现有工业布局"
 YSS_adjust_industrial_layout_desc: "照着疏散方案动真格：将最要命的几家厂子从暴露在空袭半径里的首都周边拆迁至南部和西部群山，往后新建的工厂也一律往腹地扎。"
 YSS_party_building_work: "党的建设工作"
 YSS_party_building_work_desc: "尽管党已经从伊尔玛的影响中脱离出来，但它免不了需要总书记持续干预才能正常行使功能，这并不稳妥。健康的党组织若想要起到领导作用，必须要拥有可靠且不断自新的干部组织，这正是我们需要建设的。"
 YSS_enter_cultural_and_arts_circles: "进军文艺圈"
 YSS_enter_cultural_and_arts_circles_desc: "城里的剧院、画室和报馆还把持在贵族清客手里，整天吟风弄月。中央决定拨款扶持工农出身的青年写手与艺人，把革命和车间搬上舞台。"
 YSS_prioritize_mass_work: "群众工作必须抓紧"
 YSS_prioritize_mass_work_desc: "不少地方党委把群众工作当成闲差，只盯着钢产量和征粮表，不管底下百姓怎么想。中央严令各级支部：人心丢了，报表再漂亮也是白搭。"
 YSS_uphold_core_ideology: "核心思想不能动摇"
 YSS_uphold_core_ideology_desc: "文教整顿不能半途滑回老路。马克思主义必须站稳头把交椅，谁想拿部落祖制或教会训诫来掺沙子，一律按路线错误纠正。"
 YSS_report_on_international_changes: "关于国际形势变化的报告"
 YSS_report_on_international_changes_desc: "联共布在欧陆步步进逼，圣杯王国在非洲攥紧殖民地，南美那边也燃起了革命烽火。世界正在重新洗牌，联盟得弄清自己站在棋盘哪一格。"
 YSS_predicament_of_red_navy: "当前红海军的窘境"
 YSS_predicament_of_red_navy_desc: "海军委员会递上来的材料惨不忍睹：几条老炮艇连出海巡逻都费劲。再不想法子补课，红海沿岸迟早成了别人随便上岸的后院。"
 YSS_report_on_red_army_air_units: "对于红军航空兵部队的有关报告"
 YSS_report_on_red_army_air_units_desc: "几座机场的摸底清单刚送到桌上，字里行间全是坏消息——红军航空兵的实际家底，比总参最悲观的估计还要空。"
 YSS_twenty_sixth_year_of_peoples_army: "人民军队的第二十六个年头"
 YSS_twenty_sixth_year_of_peoples_army_desc: "联盟红军的前身，是1910年政变时跟着军官团冲进皇宫的学生军与起义士兵。二十五年间，它成了共和国的常备军，也在伊尔玛手里慢慢锈成一支只活在花名册上的队伍。如今它被重新整编，名义上有数十万人，实有的枪却少得多。"
 YSS_peoples_song_and_dance_ensemble: "人民歌舞团"
 YSS_peoples_song_and_dance_ensemble_desc: "由中央出面组建人民歌舞团，顺着公路下厂下乡巡演。借百姓熟悉的民间小调填新词、编新舞，比贴十张标语管用得多。"
 YSS_develop_film_industry: "电影行业的努力"
 YSS_develop_film_industry_desc: "乡下认字的人少，银幕上会动的人影却谁都看得懂。中央电影局筹拍三部建设纪录片和一部革命故事片，带着放映机往各省巡回放。"
 YSS_women_hold_up_half_the_sky: "妇女能顶半边天"
 YSS_women_hold_up_half_the_sky_desc: "旧帝国把女性关在灶台后头，新政权嘴上写了男女平等，乡下照旧当耳旁风。中央发动妇女解放运动，把女孩送进夜校、工厂和基层机关。"
 YSS_new_generation_of_communists: "新一代的共产党员"
 YSS_new_generation_of_communists_desc: "头一批在联盟学校里长大的年轻人陆续踏上社会。她们没沾过旧皇宫的脂粉气，认的是新国家的理。把这批人稳妥吸纳入党，党的血液才能真正换过来。"
 YSS_report_on_founding_komsomol: "关于建立共青团的报告"
 YSS_report_on_founding_komsomol_desc: "十四到二十五岁的年轻人精力最旺，不能任由教会或帮会拉走。青工委递交了筹建“联盟共产主义青年团”的章程，把先进青年编进统一组织。"
 YSS_revolution_begins_in_childhood: "革命要从幼儿开始"
 YSS_revolution_begins_in_childhood_desc: "等进了厂才讲道理太晚了。教育部联合青工委开办“红色幼儿园”，把新课本、识字歌和集体生活从娃娃阶段就扎下根。"
 YSS_young_cadre_vanguard: "年轻的党政干部生力军"
 YSS_young_cadre_vanguard_desc: "随着共青团和新党员成长起来，中央开始成批提拔三十岁以下的年轻骨干充实省县班子。她们没有旧官场的人情包袱，做事也更有冲劲。"
 YSS_theory_of_continuous_revolution: "继续革命论"
 YSS_theory_of_continuous_revolution_desc: "夺了政权不代表革命收工。总书记在青年干部会上抛出“继续革命论”：旧土壤没翻净，新人也会长成新老爷，每一代都得打自己的仗。"
 YSS_report_on_socialist_realism: "关于社会主义现实主义的报告"
 YSS_report_on_socialist_realism_desc: "中央为文艺界定下调子：不许沉溺于沙龙里的无病呻吟，要写实、写工农、写眼前的苦与拼劲，让作品真正替革命鼓劲。"
 YSS_negotiate_with_britain_again: "再度与圣杯交涉"
 YSS_negotiate_with_britain_again_desc: "四面八方几乎全被圣杯王国的殖民地围着。哪怕心里再不痛快，只要还想透口气，就绕不开这个头号资本主义邻居。"
 YSS_threat_of_nonhuman_powers: "来自异族的威胁"
 YSS_threat_of_nonhuman_powers_desc: "北边德意志的非人种族蠢蠢欲动，远在南美的混沌帝国更在成片吞噬人类城邦。面对这股不讲道理的祸水，联盟不可能装作看不见。"
 YSS_recontact_cpsu: "再次联系联共布"
 YSS_recontact_cpsu_tt: "§Y完成这个国策将会向苏联请求援助工业化。§!"
 YSS_recontact_cpsu_desc: "中央向俄罗斯共产党发出正式联络函，表明联盟立场并申请技术援助与外交承认。莫斯科怎么回信，正好试出它们的真实态度。"
 YSS_aid_south_american_comrades: "支援南美的同志"
 YSS_aid_south_american_comrades_desc: "远在南美的野火革命军正遭政府军和列强干涉军两面夹击。联盟自己手头也紧，但能挤出的枪械与经费，绝不能在兄弟党危难时攥着不放。"
 YSS_cooperate_with_valhalla_commune: "和瓦尔哈拉社的合作"
 YSS_cooperate_with_valhalla_commune_desc: "中美洲的瓦尔哈拉社刚打垮国内反动派，稳住了美洲的赤色阵地。同路人之间应当拉起贸易与技术合作，互相搭把手，凿开资本主义的封锁墙。"
 YSS_join_the_comintern: "加入第三国际"
 YSS_join_the_comintern_desc: "在莫斯科与亚的斯亚贝巴几番艰难角力、欧陆战火重燃之后，索维耶特联盟正式加入第三国际。红海之滨的红旗，终于不再是孤身一人。"
 YSS_question_of_historical_territories: "过去领土的有关问题"
 YSS_question_of_historical_territories_desc: "圣杯王国在东非周边与印度洋海域攥着大片殖民领地，其中不少故土与战略要冲早有历史渊源。中央打算借势重启外交交涉，看能不能拿黄金把这些地盘一步步赎回来。"
 YSS_urgent_military_inspection: "军事检查刻不容缓"
 YSS_urgent_military_inspection_desc: "调查委员会和内务部凑出十二个检查组，突击进驻各大军区和独立团，限时三个月把红军家底翻个底朝天——到底多少活兵、多少好枪，不许再看花名册。"
 YSS_inventory_erroneous_army_ideologies: "清点红军中的严重错误思想"
 YSS_inventory_erroneous_army_ideologies_desc: "检查组一进营房就听出了不对劲：有的军官私下怀念帝国旧制，有的干脆把驻军当成自家私兵，只认山头不认中央。这股歪风再不刹，枪口迟早指错方向。"
 YSS_botched_military_reforms: "军事改革一塌糊涂"
 YSS_botched_military_reforms_desc: "过去十二年越改越乱：三个军区印着七套编制表，同一个师番号在军委和省里的账面上兵力能差出三倍，连指挥链都理不清。"
 YSS_dispatch_central_commissioners: "中央下驻特派员"
 YSS_dispatch_central_commissioners_desc: "各军区自查根本靠不住。中央往各大军区派驻常设特派员，不插手日常操练，却有权随时查账查档案，并持专线直报政治局。"
 YSS_reorganize_military_organs: "改组各级军事机关"
 YSS_reorganize_military_organs_desc: "机关肥得像油桶，连队却缺额缺编。中央大刀阔斧裁并总参、军区与师部的重叠科室，把占着办公桌吃空饷的闲职清出去。"
 YSS_high_morale_untrained_red_army: "空有斗志的红军"
 YSS_high_morale_untrained_red_army_desc: "普通士兵并非没了心气，很多人仍肯为联盟拼命；可她们的时间全耗在了走队列和帮官长盖房上，真枪实弹没摸过几回，光靠一腔热血挡不住机枪。"
 YSS_severe_equipment_shortages: "严重漏缺的各式装备"
 YSS_severe_equipment_shortages_desc: "实盘清点让人背脊发凉：不少步兵师几乎没有重火炮，步枪实有数还不到编制一半。这副家底别说反攻，连守住边境都悬。"
 YSS_make_up_twelve_years_of_military_reform: "补救十二年军改光阴"
 YSS_make_up_twelve_years_of_military_reform_desc: "过去十二年那套东拼西凑的旧改法救不活了。别再缝缝补补，把旧编制和旧条令一并推倒重来，替红军重新搭架子。"
 YSS_directive_on_red_army_ideological_education: "关于重建红军内部思想教育的条令"
 YSS_directive_on_red_army_ideological_education_desc: "新条令写死在操课表里：全军每周雷打不动安排四节政治课，讲清为什么扛枪、替谁打仗，地位与实弹演练平起平坐。"
 YSS_rectify_military_districts: "对各个军区进行整顿"
 YSS_rectify_military_districts_desc: "中央下达三个月死限：各军区必须重新点验人头、核清枪械、划死编制。到期交不出实账或阳奉阴违的军区主官，就地撤职。"
 YSS_fill_equipment_deficits: "全力补足装备空缺"
 YSS_fill_equipment_deficits_desc: "军工口接到死命令，所有产线优先吐步枪、机枪和子弹；同时国库批出专款，从海外抢购一批急缺的野炮和野战电台。"
 YSS_restore_commissar_system: "恢复政委制度"
 YSS_restore_commissar_system_desc: "凡团级以上单位一律恢复政治委员，与军事主官实行双签制。重大调动和人事处分，政委有权一票挡回。"
 YSS_eradicate_perfunctory_work: "杜绝应付式工作"
 YSS_eradicate_perfunctory_work_desc: "从前上面一来检查，部队就突击刷墙、借枪充数，检查组前脚走、后脚全照旧。这回特派员常驻不走，突击复查成了家常便饭。"
 YSS_comprehensive_army_reorganization: "全方面重组计划"
 YSS_comprehensive_army_reorganization_desc: "把虚设的空壳番号统统裁撤，零散兵员合编进实打实的齐装满员师旅。从今往后，图上标着一个师，拉出去就得是一个师的战力。"
 YSS_redefine_armored_forces: "对装甲部队重新定义"
 YSS_redefine_armored_forces_desc: "红军手里本就只有寥寥几十辆旧坦克，还被切碎了撒给各步兵师当摆设。新条令把装甲车全部收回拳头里，单编独立坦克旅，专啃硬骨头。"
 YSS_assign_artillery_to_core_units: "将炮兵下放到基干"
 YSS_assign_artillery_to_core_units_desc: "往日炮兵攥在军区手里，前线营连挨了打，叫炮火得层层请示半天。现在直接往团营两级配属迫击炮和步兵炮，遇敌随时还手。"
 YSS_commissars_in_wartime_command: "政委介入战时指挥"
 YSS_commissars_in_wartime_command_desc: "政委不止管平时上课。战时凡涉及阵地撤守、士气整肃与俘虏处置，政委必须参与拍板，防止军事主官私下动摇。"
 YSS_deploy_party_cadres_to_army: "直接应用党政干部"
 YSS_deploy_party_cadres_to_army_desc: "军中合格的政工干部缺口太大。中央从地方党委和机关抽调一批久经考验的实干干部，速训几个月便直接充进连团政工席。"
 YSS_reform_general_staff: "改革总参谋部"
 YSS_reform_general_staff_desc: "旧总参里坐满只会背诵欧洲旧战例的贵族军官，对高原山路和自家家底一窍不通。彻底换血，把懂现代协同的年轻军官扶进作战室。"
 YSS_discard_obsolete_military_dogma: "摒弃固有军事教条"
 YSS_discard_obsolete_military_dogma_desc: "拿欧洲平原的大兵团教材照搬到高原山地，只会打成笑话。所有战术条令推倒重写，一切从高原地形和现有火力出发。"
 YSS_report_on_combined_arms: "关于合成兵种的报告"
 YSS_report_on_combined_arms_desc: "重编后的步、炮、装、工兵头一回在同一张想定图下合练。总参这份复盘既记下了协同打通的甜头，也没回避通讯掉链子的丑相。"
 YSS_tiered_commissar_oversight: "政委逐级监督"
 YSS_tiered_commissar_oversight_desc: "师政委盯团政委，团政委盯营教导员，营教导员盯连指导员——层层连坐、逐级复核，绝不让军改令停在团部办公室里。"
 YSS_party_members_as_vanguard: "党员发挥先锋队作用"
 YSS_party_members_as_vanguard_desc: "演习挑重担，冲锋打头阵。军中党员戴徽上岗、编入突击队，普通士兵不用听空道理，看前头冲锋的是谁就够了。"
 YSS_large_scale_military_exercises: "大型军事演习"
 YSS_large_scale_military_exercises_desc: "整训告一段落，拉出去真刀真枪考一场大试。一来看新编制和新战法磨合得如何，二来也给边境对面那几位提个醒。"
 YSS_deploy_new_mechanized_units: "新型机械化部队的应用"
 YSS_deploy_new_mechanized_units_desc: "外购的装甲车、牵引火炮和国产卡车完成了合编实测。机械化步兵营在高原干道上拉起的速度和火力，让观摩的军区主官眼前一亮。"
 YSS_establish_red_army_logistics_department: "设立红军后勤保障部门"
 YSS_establish_red_army_logistics_department_desc: "各师自筹粮饷的老法子养肥了一堆军需蛀虫。中央专设总后勤部，把采购、仓储、运力收成一盘棋，掐死军中“诸侯后勤”。"
 YSS_a_reborn_red_army: "焕然一新的红军"
 YSS_a_reborn_red_army_desc: "查账、裁冗、换装、实演一路熬下来，红军总算褪去了纸面大军的空壳。离列强精锐虽还有差距，可这支队伍已经实打实能拉出去硬碰硬了。"
 YSS_lack_of_maritime_industry: "海洋工业的欠缺"
 YSS_lack_of_maritime_industry_desc: "联盟有修船坞和小型造船厂，却没有一处能造千吨以上的舰艇。船用钢材、轮机、导航仪器这些关键配套几乎全靠进口。海洋工业立不起来，红海军就是一句空话。"
 YSS_geographical_constraints: "地理环境的限制"
 YSS_geographical_constraints_desc: "红海狭窄闷热，盛夏舱温动辄破四十度，极耗机器和人；再加上沿岸多浅滩淤港，没几处天然深水泊位，大吨位军舰就算造出来也靠不了岸。"
 YSS_severely_limited_naval_budget: "极为有限的财政预算"
 YSS_severely_limited_naval_budget_desc: "三年计划把钱全砸进了工厂和陆军，海军分到的盘子还不到国防预算的百分之八。连老炮艇的修船费都要挤着花，大舰巨炮只能留在梦里。"
 YSS_provisional_red_navy_regulations_1936: "《1936年暂行红海军条令》"
 YSS_provisional_red_navy_regulations_1936_desc: "海军委员会总算认清了家底，在《1936年暂行红海军条令》里砍掉不切实际的远洋梦，定下“近海守门、轻舰为主、岸基航空配合”的务实路子。"
 YSS_fulfill_shipbuilding_program: "尽力完成造舰计划"
 YSS_fulfill_shipbuilding_program_desc: "钱紧归钱紧，海岸线不能全靠礁石守。各船坞拧紧工期，先把手头批下来的几批轻型舰艇造下水再说。"
 YSS_naval_aviation_experiments: "海军航空兵的尝试"
 YSS_naval_aviation_experiments_desc: "造不起巡洋舰，便试着往天上找便宜法子：派岸基轰炸机和侦察机盯红海航道，用鱼雷和航弹替水面舰队补上火力缺口。"
 YSS_austere_warship_designs: "简约式舰艇"
 YSS_austere_warship_designs_desc: "设计局抛弃花哨指标，拿出“简约式舰艇”方案：按商船规范焊船壳、降航速、省装甲，换来工期短、造价低、本国船厂能成批赶造的实惠。"
 YSS_establish_naval_aviation_department: "成立海军航空部"
 YSS_establish_naval_aviation_department_desc: "海上试点尝到甜头后，中央单设海军航空部，统管全部涉海飞行队，专攻海上巡逻、反潜和反舰，不再和陆军航空兵扯皮。"
 YSS_request_more_naval_funding: "要求更多预算"
 YSS_request_more_naval_funding_desc: "船坞和海航双线铺开，百分之八的盘子彻底捉襟见肘。海军委员会硬着头皮上书中央，请求把海军份额提到国防预算的百分之十五。"
 YSS_develop_new_aircraft_carriers: "新式航母研发"
 YSS_develop_new_aircraft_carriers_desc: "正规航母想都不敢想，海军设计室退而求其次：找条大商船削平上层建筑、铺上飞行甲板，哪怕只能起降十来架侦察和护航机，也足够让舰队头顶不再光秃秃的。"
 YSS_a_serviceable_red_navy: "勉强够用的红海军"
 YSS_a_serviceable_red_navy_desc: "一番苦心经营下来，红海军总算凑出了一支像模像样的近海防卫队。跟列强远洋舰队比当然不够看，但至少谁再想大摇大摆摸进红海沿岸，得先掂量掂量挨揍的代价。"
 YSS_air_force_reduced_to_logs: "只剩滚木的空军"
 YSS_air_force_reduced_to_logs_desc: "检查组推开几座机库大门时几乎不敢相信眼睛：蒙布底下尽是缺引擎、断机翼的破架子，与其叫飞机，不如叫几根沾了机油的滚木。"
 YSS_incompetent_air_officers: "不称职的军官"
 YSS_incompetent_air_officers_desc: "航空兵的团长参谋大多是陆军塞过来的关系户，连航图和气象简报都认不全，只懂拿着飞行补贴在城里喝酒。"
 YSS_empty_aviation_depots: "空无一物的库存"
 YSS_empty_aviation_depots_desc: "翻开航材库账本，油料、火花塞和备件早已见底——不是被倒卖了，就是发霉报废，连让现存几架教练机升空转一圈都凑不齐。"
 YSS_saboteurs_in_air_force: "空军中的破坏分子"
 YSS_saboteurs_in_air_force_desc: "短短半年里一连摔了多架尚能起飞的战机，油箱里甚至查出了铁屑和糖块。政治局拍案而起：这不是技术差，是机务库里藏着破坏分子。"
 YSS_found_union_air_force_commissariat: "联盟空军人民委员会成立"
 YSS_found_union_air_force_commissariat_desc: "空军不能再挂在陆军尾巴后面吃残羹剩饭。中央单设联盟空军人民委员会，独立抓清查、采购与重建。"
 YSS_mystical_training_methods: "玄学训练法"
 YSS_mystical_training_methods_desc: "没有航校教材，老教官全凭“手感”和口诀教飞行，甚至让学员靠祈祷辨云层。不把这套玄学扫进垃圾堆，招再多飞行员也是往地里摔。"
 YSS_rectify_aviation_units: "整顿航空兵部队内部"
 YSS_rectify_aviation_units_desc: "重建先从抓规矩开始：停飞检查、逐机定人、清查航材黑账，把机场上那股吊儿郎当的散漫劲彻底拧紧。"
 YSS_uncover_air_force_conspiracy: "侦破空军阴谋"
 YSS_uncover_air_force_conspiracy_desc: "顺着那几起人为事故往下摸，调查组连端几个串通外部情报网的机务团伙，把埋在机场里的黑手彻底挖断。"
 YSS_rebuild_the_air_force: "努力重建空军"
 YSS_rebuild_the_air_force_desc: "清完烂账，空军委员会开始一砖一瓦补课：修平整跑道、开办正规航校、拉起地勤维修班，先让机场重新像个打仗的地方。"
 YSS_dismiss_negligent_air_cadres: "将不务正业的干部撤职"
 YSS_dismiss_negligent_air_cadres_desc: "把占着空军编制却连座舱都没坐过的关系户统统撵走，腾出的指挥席交给真正懂飞行、肯泡在跑道边的专业军官。"
 YSS_procure_foreign_fighters: "从外国采购先进战机"
 YSS_procure_foreign_fighters_desc: "指望本国工厂立刻造出战斗机不现实。委员会咬牙批出外汇，先从海外买进一批现役单翼战机，替红空军撑起头一片天。"
 YSS_reverse_engineer_soviet_fighters: "仿制苏式战斗机"
 YSS_reverse_engineer_soviet_fighters_desc: "买来的飞机摔一架少一架。航空工厂拆开引进样机逐件测绘，先仿制结实耐造的苏式机架与引擎，给自主航空工业打下第一根桩。"
 YSS_purge_air_force_counterrevolutionaries: "全面扫荡空军系统里的反革命"
 YSS_purge_air_force_counterrevolutionaries_desc: "借着审讯口供，从航材仓库到指挥司令部来了一轮拉网排查，凡与旧势力或敌国暗线沾边的内鬼一律清出空军系统。"
 YSS_form_aviation_divisions: "建立航空师团"
 YSS_form_aviation_divisions_desc: "新机入列、新飞行员毕业，零散中队终于整编为建制齐全的歼击与强击航空师团，红空军头一回有了成体系的作战序列。"
