 #第一个三年计划

 YSS_sannianjihua_category: "第一个三年计划"

 YSS_sannianjihua_category_desc: "我们决心仿照苏联式工业化，利用农业剩余出口换得工业基础。虽然我们国力远不如1918年的苏俄，但借助苏联援助，以及资本主义经济危机，我们仍然能够实现高质量工业化。每月，收集的农业剩余会被兑换成工业点数，而工业点数可以被兑换成对应的工厂。一旦我们建成工厂，我们就需要工业点数去维护，但民用工厂的产出也可以兑换成工业点数。\n\n工业点数月产出：[?YSS_gy_output|Y0]\n\n工业点数总量：[?YSS_gy_point|Y0]"

 YSS_gy_1: "提格雷金矿"

 YSS_gy_1_desc: "把提格雷北部的零散金矿收归国营、加装抽水与选矿机械，替三年计划攒出第一批硬通货。"

 YSS_gy_2: "阿拉比卡咖啡"

 YSS_gy_2_desc: "统购统销南方高地出产的阿拉比卡咖啡豆，靠出口换回急需的机床与外汇。"

 YSS_gy_3: "贡德尔宝石"

 YSS_gy_3_desc: "整顿贡德尔旧矿场的采掘与分拣渠道，把原本流进贵族私囊的宝石矿收归国库。"

 YSS_gy_4: "亚的斯亚贝巴机械厂"

 YSS_gy_4_desc: "在首都近郊合并几家旧机修作坊，搭起联盟第一座能成批加工农机与通用零件的机械厂。"

 YSS_gy_5: "亚的斯亚贝巴水泥厂与砖厂"

 YSS_gy_5_desc: "扩建首都周边的窑厂和水泥生产线，补上各地工地常年短缺的建材缺口。"

 YSS_gy_6: "中央大区冶金工业集团"

 YSS_gy_6_desc: "将中央大区分散的小高炉和轧钢车间编入统一体系，稳住联盟最基础的粗钢产出。"

 YSS_gy_7: "内罗毕拖拉机厂"

 YSS_gy_7_desc: "依托南方铁路枢纽筹建拖拉机装配厂，替集体农庄补上最缺的耕作机械。"

 YSS_gy_8: "哈拉雷电子工业集团"

 YSS_gy_8_desc: "集中全国稀缺的电工与无线电技师，从军用电台、开关和真空管起步，试着补上弱电空白。"

 YSS_gy_9: "人民牌石油工业集团"

 YSS_gy_9_desc: "整合炼油车间与港口储油库，统一调配卡车、拖拉机和军队的紧缺油料。"

 YSS_gy_10: "中央大区合金工业集团"

 YSS_gy_10_desc: "在普通碳钢之外试制耐热与装甲用特种合金，为火炮炮管和军工机床备料。"

 YSS_gy_11: "哈尔格萨轴承厂"

 YSS_gy_11_desc: "在哈尔格萨建起专业轴承车间，解决车辆和机床一坏就只能等进口件的老毛病。"

 YSS_gy_12: "蒙巴萨工业仪表生产厂"

 YSS_gy_12_desc: "利用蒙巴萨港的技术与进口元器件渠道，量产压力表、电表和车床量具。"

 YSS_gy_13: "阿法尔化肥厂"

 YSS_gy_13_desc: "开采阿法尔盆地的钾盐和硫矿，就地建厂生产氮磷钾化肥，稳住高原耕地的收成。"

 YSS_gy_14: "亚的斯亚贝巴兵工厂"

 YSS_gy_14_desc: "把几座旧枪械修配厂并成国营兵工厂，按统一图纸量产步枪、机枪和制式弹药。"

 YSS_gy_15: "咖法重型机械厂"

 YSS_gy_15_desc: "在咖法新建重型铸锻车间，承接矿山机械、重型车架与大型火炮部件加工。"

 YSS_gy_16: "哈尔格萨航空工业集团"

 YSS_gy_16_desc: "依托哈尔格萨机场旧机库组建航空修造厂，先从维修和仿制教练机、轻型战机做起。"

 YSS_gy_17: "蒙巴萨汽车厂"

 YSS_gy_17_desc: "在蒙巴萨设立卡车与军用运输车总装厂，补上陆军后勤和省际货运的运力短板。"

 YSS_gy_18: "摩加迪沙造船厂"

 YSS_gy_18_desc: "疏浚摩加迪沙船坞并加装起吊设备，让联盟拥有第一座能造护航舰艇与商船的船厂。"

 YSS_gy_19: "第一个三年计划顺利收官"

 YSS_gy_19_desc: "核算全部重点工程的投产实数，为联盟第一个三年计划正式画上句号。"

 YSS_smuggle_1: "走私金砂"

 YSS_smuggle_1_desc: "托兽人共斗同盟的边境暗线把提格雷金砂运出封锁圈，绕开列强禁运换回急需经费。"

 YSS_smuggle_2: "走私咖啡"

 YSS_smuggle_2_desc: "借由红海沿岸的隐蔽商船外销咖啡豆，哪怕冒着被扣货的风险也要换回外汇。"

 YSS_smuggle_3: "走私宝石"

 YSS_smuggle_3_desc: "把体积小、价值高的贡德尔原石交由地下渠道转运出境，专门用来套购精密设备。"

