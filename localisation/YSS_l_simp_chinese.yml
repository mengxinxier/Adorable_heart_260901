 YSS_faction_panel_banner_desc: "如果说§Y第一次大革命§!动的是旧势力的特权，那么§Y第二次大革命§!就要动旧势力的根基。只要土地还攥在贵族手里，联盟的§Y社会主义改造§!就无从谈起。清洗期间，§Y中央§!将§G逐步收回土地§!，而§Y地方王公§!势必竭力阻挠。一旦选择终止调查，将§R无法再推进任何改革，你只能被动承受后果，无从补救§!。§O革命烈度§!代表人民对大革命的§G支持§!程度：烈度越高，群众§G支持§!越强烈，反之反对声就越响。§O革命烈度§!过低会导致大革命失败；过高则会让中央渐渐失控，扣除大量稳定度，甚至酿成国家解体。"
