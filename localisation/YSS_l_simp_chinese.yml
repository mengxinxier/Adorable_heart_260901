 YSS_sanjieduan.4.t: "要求索维耶特联盟加入战争"
 YSS_sanjieduan.4.d: "与德意志国的战争打响了，我们必须争取一切可以团结的力量。那个非洲革命国家是时候承担自己在世界舞台上的角色了。"
 YSS_sanjieduan.4.a: "快来帮帮老大哥！"
 YSS_sanjieduan.5.t: "加入第三国际"
 YSS_sanjieduan.5.d: "苏联正式向我们发出邀请，加入第三国际。虽然很明显，这是希望我们参加欧陆大战，但我们清晰知道目前苏维埃的敌人有多么野心勃勃。为了保卫我们的革命，我们必须与苏联结盟。"
 YSS_sanjieduan.5.a: "是时候大干一场了。"
 YSS_sanjieduan.6.t: "深夜的办公桌"
 YSS_sanjieduan.6.d: "“唉，批不完的请示。”\n门柯思图把批好的文件放在堆积如小山的文件堆顶，靠在硬木椅子上。办公室里漆黑一片，唯余她办公台上的一盏孤灯。自战争开始之后，这已经是她的日常，不，应该叫做“夜常”了。\n门柯思图揉了揉太阳穴和眼眶，舒缓了一下酸痛的眼睛，从硬木椅子上起身，舒展身体，绕着办公桌走了一整圈。\n“接着干，干到三点，再去睡上四个小时......”\n门柯思图坐回硬木椅子上，她的目光落到办公桌另一端，那里有两个小玻璃瓶子，和被纸张与墨渍填充的桌面格格不入。\n门柯思图好奇地端详着两个瓶子，上面的标签被另一张写着阿姆哈拉语的发黄字条覆盖。\n“麦角碱，碘化钾？”门柯思图读着上面的文字。她思考了一番，却忘了这两个药瓶从何而来。\n“效果是.......吃下去会有些昏昏沉沉......延续你的生命......”\n一句不知从何而来的话语从记忆闯进门柯思图的脑海。可当再想去捕捉是谁在何时说了这话时，又什么也搜不到。\n“唉，工作得脑袋都晕了，这是谁送我的安眠药吧？”\n门柯思图晃了晃脑袋，自己过去好像经常在睡前吃这种药，有时又会忘掉。\n“哎呀，算了算了，怎么对着无关紧要的玻璃瓶走神这么久？”门柯思图拍了拍脑袋，把思绪集中到眼前的文件上。\n“总参谋长陵报告：军队近况简报如下......”\n当门柯思图的视线下移的时候，一滴红色的液体不合时宜地滴在了简报上。那液体迅速沁染开来，模糊了下面的文字。\n“哎呀！”门柯思图反应过来，滚烫的液体正从她的鼻腔流下。\n“这个时候流鼻血？”门柯思图环顾四周，办公桌上没有任何方便用来擦拭的纸张。她紧张地翻动着文件，试图找一张不那么重要的纸张来解决问题，而一个不注意，文件堆就倾倒下来，纸张散在桌上，有的还飘到了地上。\n她捂着鼻子，又一次起身。可刚走了两步，脚下一滑，一张躺在地面暗处的纸张让她滑了一跤，摔在地上。\n“好疼啊！简直比政变时挨的那一发流弹还疼！”门柯思图咒骂一声，左手捂着鼻子，右手捡起地上的文件放回桌上。回到椅子上，她拿起手旁的电话，拨打了一个熟悉的号码。\n“叮铃铃。”门柯思图把听筒放在耳边，焦急地等待着回音。\n可是，刚刚摔在地上的身体却不知为何，疼痛感反而越来越强，\n“这里是小原，总书记，您需要些什么？”\n门柯思图刚想开口，胸口如中弹般撕裂地疼痛起来。她浑身因剧痛抽搐起来，手中的话筒滑落，与她整个人倒在了地上。\n门柯思图还想伸手去抓话筒，但世界立刻变得无色而透亮起来。"
 YSS_sanjieduan.6.a: "总书记？您需要些什么？您怎么了？总书记？"
