 YSS_faction_struggle_category: "联盟派系斗争"

 YSS_faction_struggle_category_desc: "毋庸置疑，门柯思图总书记是联盟的团结核心，但这并不代表联盟内部不存在其他意见。总书记小心翼翼地保持着各个派系的平衡，但情况总会发生变化的。在未来，我们或许可以通过培养出足够多的新干部，通过新老交替来解决派系问题，但如果总书记在那之前失能的话，派系矛盾将会把国家导向不可预知的结果。\n派系力量变化只能通过国策或事件实现。\n\n目前的主导派系是：[Get_YSS_leader_party_name]\n\n§R党权派§!：来自伊尔玛政权中的激进社会主义文官。他们的主要目标是仿效苏联（尤其是列宁）建立强大的共产主义政党，这使得他们的行事风格偏向强硬和政治挂帅。\n党权派目前的状态是：[Get_YSS_party_party_situation]\n\n§O军队派§!：来自伊尔玛政权中的左翼军官。他们相对务实，主张基于联盟实际情况建设苏联式社会主义国家。虽然他们与党权派关系良好，意识形态接近，但因为其保守路线而被批评为“老卫兵”。\n军队派目前的状态是：[Get_YSS_party_army_situation]\n\n§C国家派§!：来自青年学生，地方官员和地方党支部。他们主张以实用主义推进国家建设，推崇地方分权和政治透明化。由于其接近资产阶级自由主义的思想，他们往往被认为“离经叛道”。\n国家派目前的状态是：[Get_YSS_party_country_situation]\n\n§P世界派§!：来自青年学生，新军官和社会主义学者。他们主张激进革命，快速工业化和输出革命，公职人员普遍选举和随时罢免制度。虽然意识形态无可挑剔，但其行为往往被批评具有盲动和无政府主义倾向。\n世界派目前的状态是：[Get_YSS_party_world_situation]"

