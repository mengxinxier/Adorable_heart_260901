 YSS_srgdtm_category_desc: "兽人共产主义者斗争同盟是以苏联公派志愿者中的兽人为核心的组织。这个组织利用兽人在非洲各国边境杂居的条件进行走私活动，为联盟提供了大量紧缺物资，甚至帮助过门柯思图夺取政权。然而，内务部指出，该组织内部经济不透明，联盟无法控制其内部意识形态情况，我们应当与他们交好，但不能过多依赖他们。\n\n兽人共斗同盟目前的领导者是：[Get_srgdtm_leader_name]\n\n兽人共斗同盟的势力现在是：[YSS_Get_srgdtm_power]\n兽人共斗同盟对联盟的忠诚程度现在是：[YSS_Get_srgdtm_loyalty]"
