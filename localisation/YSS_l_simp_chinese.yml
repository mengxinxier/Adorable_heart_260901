 YSS_Country_History_Page_3: "1920年，北方的帝国军、东部的意呆莉军与索维耶特联盟终于撕破脸皮，在高原和荒漠间大打出手。\n\n血战三年后，欧洲爆发鲁尔危机，列强自顾不暇，停掉了对东非的拨款与军火供应。断了外援的帝国军与意呆莉部队无力再战，底子单薄的联盟也耗到了极限。\n\n1923年，在圣杯的调停下，三方签下停战协议。阿克苏姆就此一分为三，一僵就是十三年。\n\n僵局最后是被亚的斯亚贝巴自己打破的。1935年，总书记门柯思图发动政变，大统领伊尔玛被软禁，议会随即废除；1910年宪法却还挂在墙上，要等新宪法通过的那一天才会被取下。\n\n如今已是1936年。三方隔着停战线剑拔弩张，谁也没打算让对方活到明天。欧洲的风声又紧了起来，列强一旦抽不开身，这片停火十三年的土地便再无顾忌。\n\n这一次，没人会再来调停。高原上只能留下一个声音。"

