 YSS_tudigeming_category: "土地革命"
 YSS_tudigeming_category_desc: "尽管国家已经统一，新解放区的封建殖民制度仍然没有完全废除。我们需要加紧革命，推进这些地方的土地革命。\n\n§R完成土地革命所有决议可以获得新解放区的核心。§!"
 YSS_tudigeming_1: "消灭匪患"
 YSS_tudigeming_1_desc: "内战过后，新解放区仍然残留着大量来自前封建殖民军队的土匪和王公私人武装。我们必须宣布军事管制，消灭土匪武装，夺走王公们的武器，这样新解放区的人民才能安全。"
 YSS_tudigeming_2: "土地再分配"
 YSS_tudigeming_2_desc: "组建农会，贫农团体来分配没收所得殖民者土地和王公的多余土地，并赋予他们监督土地流转的权力。"
 YSS_tudigeming_3: "成立基层人民政府"
 YSS_tudigeming_3_desc: "随着安全和土地问题解决，新解放区终于重归稳定。是时候结束军事管理，让人民选举出的官员接管基层了。"
 YSS_test_leader_switch: "测试：更换领袖与副领袖"
 YSS_test_leader_switch_desc: "当前领袖退休，共产主义继续执政，战争姬成为领袖（子意识形态军事社会主义），副领袖换成绫叁。"
 YSS_test_byner_switch: "测试：领袖换成高海千歌"
 YSS_test_byner_switch_desc: "当前领袖退休，高海千歌成为共产主义领袖，副领袖换回国木田花丸。"
