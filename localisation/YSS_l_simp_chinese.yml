 YSS_route_guide_desc: "§Y阿克苏姆-索维耶特联盟§!路线指南\n\n§O第一阶段·高原统一战争§!\n开局处于停战十三年的三分僵局。推进战前国策与决议，趁大萧条或边境事变窗口迅速击败北方的阿克苏姆帝国与东部的东非总督府，统一非洲之角后自动解锁第二阶段国策树。\n\n§O第二阶段·建国、改革与第一个三年计划§!\n统一全国后，依次召开第八次党大会、推进新宪法表决、整顿三军与党内风气，并通过§Y第一个三年计划§!、§Y国家行政拓展与地区开发§!及§Y第二次革命§!决议体系夯实工业与地方控制。\n\n§O对外与非洲解放§!\n可选择联络苏联加入第三国际，或与周边列强有限斡旋以金赎地；完成§Y对于本大洲革命事业的努力§!后将开启§Y非洲解放与互助系统§!，向全非洲输出革命或扶持赤色盟邦。"
