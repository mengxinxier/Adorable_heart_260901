  SWE_war_to_DEN_decision_cate: "第四次杜瑞战争"
  SWE_war_to_DEN_decision_cate_desc: "对杜伦布的战争已经开始，但就目前尚不稳定的政府而言，瑞典依旧承担不起一场全面战争，杜伦布人承平日久，这意味着若我军不能尽快收复失地，一旦他们从混乱中恢复过来，最先支撑不住的便会是我方\n尽管民众狂呼酣战，但前线不会说谎，一旦局势僵持甚至是失控，我军士气将难以为继。因此，百日之内，速战速决，拿下卡尔玛等故土。否则我们将付出难以预计的代价。\n愿北欧诸神与我等同在。"
