  SWE.066.title:  "紧急通知：全国军事戒严"
  SWE.066.desc:  "致[SWE.GetName]全体公民：\n近期，由杜瑞战争失败引起的一系列恶性事件对瑞典构成了严重威胁。为确保国家稳定，保障公民的生命财产安全，军方决定于形势好转前在全国范围内实行军事戒严。现将有关事项通知如下：\n一、自本通知发布起，瑞典全国范围内进入军事戒严状态，直至另行通知为止。所有地方政府机构，企事业单位与公民需全力配合戒严维稳工作。\n二、全体公民必须严格遵守各项法律法规与戒严期间的特殊规定，服从军方指挥，不得以任何形式妨碍、抗拒或逃避军事管制。任何违反规定者，将依法严肃处理。\n三、戒严期间，国家与地方的各级选举将临时停止。军方有权对公民的出版，集会，结社，游行，示威等政治权利加以适当限制，以稳定社会秩序。\n四、军方将部署武装力量将对热点区域实行24小时巡逻和监控，并实施宵禁。\n在此特殊时期，请全体公民保持冷静，减少不必要外出，保护好自己与家人。军方将竭尽全力，确保事态尽快重归正常。"
  SWE.066.a:  "[SWE.GetName]国防部，即刻生效"

  SWE.067.title:  "晚间新闻"
  SWE.067.desc:  "[SWE.GetName]全体公民们，晚上好！我作为瑞典国防部发言人，代表瑞典政府，在此发布几条消息：\n第一条消息\n鉴于国内形势已趋于稳定，军方决定于今日晚十二时整正式结束在全国范围内的军事戒严，并将权力移交给新一届文官政府。临时军事基地与封锁线等军事设施会逐步予以迁移或拆除，如在此过程中对各位的出行造成不便，敬请谅解。\n第二条消息\n军方与文官政府已达成共识，瑞典应放弃遏制政策，适当缩减国防开支，转而寻求与杜伦布关系的正常化。并积极发展与斯堪的那维亚国家的多边外交，共同维护地区和平稳定。与杜伦布方的外交沟通已逐步恢复，后续细节请关注外交部相关情况通报。\n第三条消息"
  SWE.067.a:  "下面我将公布关于新一届文官政府的若干相关细节……"

  SWE.068.title:  "答记者问"
  SWE.068.desc:  "记者：明内幽主席，请问以您为代表的新政府上任后的第一步计划是什么？\n明内幽（以下简称“幽”）：我们的首要任务是建立一个民有，民治，民享的政府。我和小之星海果副主席会全力以赴，确保每一笔税款都会被用在正确的地方，每一个决策都能反映出人民的意愿。\n记者：小之星海果，您作为副主席，有什么想对大家说的吗？\n小之星海果（以下简称“海果”）：大家好，我……我会尽我所能的做好分内之事，并配合明内幽主席的工作，让瑞典变得更好，谢谢。\n幽：别紧张，海果。\n海果：嗯。\n记者：明内幽主席，从刚才您鼓励她可以看出，二位合作似乎非常默契。您能分享一下相关经验吗？\n幽：当然！我和海果其实是老相识了，虽然彼此性格稍有不同，但我们一直是最好的朋友，也正是这种互补让我们的合作更加紧密。海果的细致和敏感总能让我看到问题的另一面，而我的乐观和行动力也能为她带来信心。\n海果：诶嘿。\n记者：明内幽主席，您对当前的瑞典-杜伦布关系与国际形势有何看法？\n幽：国际形势固然复杂多变，但我坚信，我们始终需要以开放包容的态度面对挑战。而谈到瑞杜关系，我也持相同态度——和平发展才是最适合两国的出路。\n记者：小之星海果副主席，您怎么看待瑞典的经济现状？\n海果：经济……嗯，我们会积极推动经济转型，注重可持续发展，推动科技创新与科技进步。同时也会关注社会福利，让每一位公民都能从经济高质量发展中受益。\n幽：没错，海果说得很好，问题出在经济！不过新政府会在大力发展经济的同时，不落下任何一位在贫困中苦苦挣扎的底层公民。\n记者：明内幽主席，请问您真的像传闻中所说的那样，是一位外星人吗？\n幽：向一位淑女说出这样的话，可是很不礼貌的哦。"
  SWE.068.a:  "下一个问题！"

  SWE.069.title:  "在明内幽桌上发现的备忘录（节选）"
  SWE.069.desc:  "瑞典人，你要自信。\n……\n今天魔导国这个魔导王，真是的，给我的感觉就是没有文化，真的没有文化，不是一般的没有文化！如果你们懂德语，听她讲，会很自然的觉得这个德语是没有文化的德语。所以我讲这流氓国家，这个魔导国人用的词，背后也是，对这波人没有文化，深感痛惜。这个什么国王，什么亲卫队队长，如果你把这些职务拿掉，就是街上一个老百姓的话，三流，就是这样，所以我真看不起。\n……\n我上次去伦敦，回来之后在斯德哥尔摩街头看了一下，这个盒饭确实比圣杯中产阶级吃得好。所以我说这个，一出国就爱国，太正常了，这个效果比同好会的教育还要好。\n……\n苏联现在这个领导班子的特点是教养不够，所以最好用最直白的语言问她们一些直白的问题，我觉得挺好，至少她们能听得懂。你太含蓄了，她们可能听不懂。所以当时我就和翻译说，我们给她们一点小小的瑞典震撼。\n……\n我们不需要很多的舞蹈、演出、专业演员，就让海果她们在那走一遍，我觉得这就是一种自信。而这种条条框框，面子工程，外国还在搞。所以我就说，你们这是不了解瑞典而妄下论断。"
  SWE.069.a:  "为了避免丑闻，赶紧毁掉。"

  SWE.070.title:  "真实的谎言"
  SWE.070.desc:  "“海果？”\n“幽，我在的。”\n“我有件事想对你说。”\n“嗯？”\n“回到宇宙，对我来说恐怕只是个不切实际的幻想。我已经失去了过去的记忆，这个世界的科技水平距离载人航天也相差甚远。在这个目标上倾注精力，只会是竹篮打水一场空。”\n“可是，你的记忆——”\n“海果，我确实很想找回记忆，更想有朝一日回到外星上的故乡。但更紧迫的现实是，我们的国家，瑞典，需要我们。作为领袖，我和你有责任把瑞典建设得更好。让她的人民吃饱穿暖，让她雄踞在斯堪的纳维亚之上。”\n“……”\n“海果，你是我最好的朋友。过去是，现在是，未来也一定会是。这一路走来，我知道你是真心实意为我好。但如今我们身居此位，肩负着的神圣使命已经不允许我继续那无谓的幻想了。发射火箭只是我和你的愿望，但体面的活着，幸福的拥抱那美好的未来，可是依靠我们的无数人最真实的梦。”\n“那，我要你发誓，待到时机成熟就会重启火箭工程。愿望也好，幻想也罢，我一定要亲眼见证它成为现实！只因为，这是我和你在相遇之时就定下的，共同的约定！”\n“会的。一定，一定会的。”\n“那好，一言为定，不准反悔！”\n“一言为定。”\n语毕，海果便离开了办公室。这一次，她无论如何都不会让最爱自己的人看到自己哭了。"
  SWE.070.a:  "她没想到的是，门后的明内幽也在默默地抹眼泪。"

  SWE.071.title:  "[SWE.GetName]和[DEN.GetName]关于恢复外交关系的联合公报"
  SWE.071.desc:  "[SWE.GetName]和[DEN.GetName]商定，自此联合公报发布之日起恢复外交关系。\n[SWE.GetName]承认[DEN.GetName]是杜伦布的唯一合法政府，[DEN.GetName]承认[SWE.GetName]是瑞典的唯一合法政府。\n[SWE.GetName]和[DEN.GetName]重申先前会谈中双方一致同意的各项原则，并再次强调：\n──双方都希望减少国际军事冲突的危险。\n──任何一方都不应该在斯堪的纳维亚地区以及世界上任何地区谋求霸权，每一方都反对任何国家或国家集团建立这种霸权的努力。\n──任何一方都不准备代表任何第三方进行谈判，也不准备同对方达成针对其他国家的协议或谅解。\n──[SWE.GetName]放弃对[DEN.GetName]的领土要求，并承认实际控制线为两国的正式边境线。\n──双方认为，瑞杜关系正常化不仅符合瑞典人民和杜伦布人民的利益，而且有助于斯堪的纳维亚和世界的和平事业。"
  SWE.071.a:  "[SWE.GetName]和[DEN.GetName]将择日互派大使并重开大使馆。"

  SWE.072.title:  "挪威，瑞典，杜伦布，索米关于建立北欧共同体的联合声明"
  SWE.072.desc:  "挪威，瑞典，杜伦布，索米四国国家元首考虑到结束北欧分裂的历史重要性和创立未来北欧建设坚实基础的需要，决心把北欧一体化进程推向新阶段。为此，我们\n坚持对自由原则、民主原则和尊重人权及基本自由原则以及法制原则的信念；\n愿意在尊重彼此国家的历史、文化和传统的同时加深彼此人民间的团结；\n决心实现彼此国家经济的强大和同步发展，并依据本条约的规定建立一个包含一种单一及稳定的货币的经济和货币联盟；\n决定在完善内部市场、加强团结和环境保护范围内，为了彼此的人民促进经济和社会进步，并在各个其他领域施行与上述进步相适应的政策；\n决心建立彼此国家国民共同的公民身份；\n决心实行一项包括最终构建共同防务政策的共同外交和安全政策，以便促进北欧和世界的和平与安全；\n通过本条约引入关于司法和各国国内事务的规定，在保障彼此人民和国家安全的同时，重新肯定促进人员自由流动的目标。\n鉴于促进北欧一体化需要采取进一步的措施，我们决定建立北欧共同体，并为此特分别指定以下人员为各国的全权代表：（名单略）"
  SWE.072.a:  "上述全权代表互相交换全权证书并认为妥善后，议定条款如下："

  SWE.073.title:  "和平颂"
  SWE.073.desc:  "晨曦洒在大地之上，\n驱散黑夜的荒凉；\n如同鸟儿展翅飞翔，\n往那无边的苍茫。\n\n无声的泪水在风中流淌，\n炮火的轰鸣在空中回荡；\n曾经的家园在硝烟中消亡，\n吾等之愿望是让和平绽放。\n\n枪声远去，琴声悠扬，\n火焰熄灭，花儿绽放；\n战鼓停歇，孩童欢唱，\n愿世间永远和平安详。\n\n让我们携手同心，\n用爱织成无边的网；\n将仇恨化作尘埃，\n齐心共建美好家乡。\n\n心中的种子已然播下，\n漫山遍野生根发芽；\n让我们守护这片净土，"
  SWE.073.a:  "切莫重演那历史的疮疤。"

  SWE.074.title:  "仲夏夜之心语"
  SWE.074.desc:  "时钟敲了整整六下，意识到已经到了下班时间的明内幽缓缓起身，走到小之星海果身旁，和她并肩坐下。夕阳发出的光辉为窗外的高楼大厦和绿树成荫的街道镀上了一层薄薄的金色。打开窗户，阵阵微风拂过，带来了独特的夏日气息。\n“海果，看看这一切，我们真的做了很多事。”明内幽深情地说道。她的目光跟随着路上的车水马龙，内心则在回忆过去几年的点点滴滴。\n小之星海果微笑着点头，“是啊，幽。这几年来，瑞典确实取得了很大的进步。亲眼见证这座城市，这个国家走向繁荣，我感到无比自豪。”\n“不过，我们的工作还远未完成。”幽话锋一转，缓缓说道。海果注意到，她眼中正闪烁着坚毅的光芒。“我们必须继续努力，为人民的明天，为瑞典的未来而不懈奋斗。”\n语毕，幽不经意间将目光投向办公室墙上的一幅照片，那是她们就任时宣誓的场景。她不禁微微一笑，仿佛那一刻就在昨日。\n“记得当时我们一路上面对的那些艰难险阻吗？”幽看向海果，轻声问道。\n海果点点头，幽的目光让她也陷入了回忆的漩涡。“那时候，我们背负着比起现在更沉重的责任。我也想过退缩，想过放弃，但最终还是和你一起扛了下来。现在再看，这份坚持毫无疑问是值得的。”\n“是啊，海果。不仅你需要我，我同样需要你。”\n窗外的城市渐渐沉入夜幕，不远处的霓虹灯光星星点点的闪烁。\n“已经这么晚了啊。要不今天，就到这里吧。”\n“可是，我还有些话想——”\n“没事，今天我送你回去。”幽一边说着，一边轻轻地牵起了海果的手。"
  SWE.074.a:  "“路上我们慢慢聊，亲爱的。”"

  SWE.075.title:  "决心"
  SWE.075.desc:  "“海果，通用机器制造部那边怎么说？”\n“幽，她们对我们的火箭计划，整体上持保守态度。”\n“你不用这么拘谨，直接把原话转述给我便是。”\n“如果想要夕阳火箭计划圆满完成，需要党中央，国家计划委员会和工业军事委员会，以及9个国防工业部门，600多个相关专业和8000多家配套厂家。总之，需要一个伟大的国家才能完成。但此时此刻，这个世界上还不存在这样的国家……”\n“所以她们的意思是，火箭计划完全不现实吗？”\n“是的。”\n沉默，死一样的沉默。不过几分钟后，幽率先开口。\n“海果。”\n“嗯？”\n“你是发自内心的想去往那遥远的太空吗？”\n“嗯。”\n“遥乃，瞬，同好会的大家。虽然彼此目标和想法各有差异，但都和你一样，是一心向往着太空的吧？”\n“是。”\n“想必你和她们二位也明白，回到宇宙并取回记忆，是自从我来到地球就魂牵梦绕的愿望吧。”\n“毫无疑问。”\n“那么去告诉部里，我心意已决。这个计划必须执行，而且一定会成功！”\n但当海果走到门口时，幽突然叫住了她。\n“海果，请帮我一个忙。待你见到部里人的时候，给她们带一句我的话。”\n“什么？”"
  SWE.075.a:  "“信念的力量可不是列数字就能比拟的，爱的力量亦如是。”"

  SWE.076.title:  "星灵感应"
  SWE.076.desc:  "繁星点点的夜空下，夕阳火箭静静地矗立在发射台上。站在一旁的明内幽与小之星海果仰望着凝结着同好会和无数人心血的它，期待着不久后那只属于它的壮美时刻——点火升空。\n“海果，你还记得我们第一次试验火箭的时候吗？”明内幽转过头来注视着小之星海果，轻声问道。\n“当然记得。”小之星海果微笑着回答。幽注意到，她的眼睛正闪烁着和星星一样闪亮的光芒。\n“是啊。这一路上，我们无时无刻不在追寻梦想。虽然路上有许多困难和挑战，但幸好我们没有放弃。”\n“是的，正因为我们坚持了下来，才能在今天站在这里见证它。”\n“不过此时此刻，我突然有个有趣的问题想问海果。”幽一边说着，一边轻轻牵起海果的手，二人顺势贴的更近了些。\n“是什么？”\n“火箭明天就要发射升空。这对于你，我和同好会的大家，都是历史性的一刻。你有什么想说的呢？”\n“嗯，让我想想。”\n“在萌动的世界中展翅的我们定能翱翔远方，定能翱翔远方……”还没等海果回答，幽突然唱起歌来。\n“诶诶诶诶诶？！幽，你怎么知道我——”\n“嘿嘿，我刚才‘无意’中碰到了海果的额头哦。”"
  SWE.076.a:  "“这可是只属于你和我的，星灵感应！”"

  SWE.077.title:  "[FROM.Getname]威胁我们！"
  SWE.077.desc:  "大事不好！今日瑞典政府已经向我们发出了最终通牒！要求我们恢复大北方战争前双方的关系——也就是说，她们的立宪君主重新向我们索求挪威的王位！\n贸然让步定会招致国内不满，尤其是已经享受几百年独立的魔物们，可是就双方的实力来看，武装抵抗来自瑞典的压力似乎也有些痴人说梦。"
  SWE.077.a:  "我们不得不同意"
  SWE.077.b:  "滚！"

  SWE.078.title:  "[FROM.Getname]同意"
  SWE.078.desc:  "挪威人已经同意了我们的要求，这个联盟共和国在两百年后接受了现实，再一次将挪威的皇冠拱手奉上。"
  SWE.078.a:  "好"

  SWE.079.title:  "[FROM.Getname]拒绝"
  SWE.079.desc:  "挪威人拒绝了我们的要求，这意味着该让我们给她们体面了。让陛下拿回本就属于古斯塔夫王朝的皇冠。"
  SWE.079.a:  "草！"

  SWE.080.title:  "变革的惨败"
  SWE.080.desc:  "被魔族从挪威驱逐的是维京部落，还有我们的宿敌飞龙。瑞典收留维京部落的条件便是替他们防范飞龙的威胁——就像几百年来我们一直做的那样。但维京人从未没忘记故土，我们寄希望于瑞典的强大，人类打败魔族，夺回失去的土地。龙骑兵团为瑞典而战并非是英灵殿的指引，维京人始终牢记，只有故土是唯一能安息的瓦尔哈拉，此间所有战争皆无法入奥丁之目。\n曾几何时，我向父亲证明变革与交流的意义。我们同飞龙化敌为友，携手在这片寄居之地生存。但也许是我错了。瑞典的变革一度带来希望，最后却是惨败。如果我们同瑞典坠落一道坠落，那么所有的牺牲都将毫无意义。"
  SWE.080.a:  "我们必须归乡，不惜一切代价，用尽一切手段......"

  SWE.081.title:  "部落至上"
  SWE.081.desc:  "”希卡普...呃，酋长？您不能这样做，我的企业完全合法，您不能没收他，瑞典没有任何一条法律支持这一行为。“\n”喔喔，别激动，我认识你，你的曾祖父抛弃了部落逃到城市，靠做手工艺品发家，最后贿赂官僚更改了自己的出身，我说的没错吧？“\n”您，您怎么知道...？“\n”并非只有政府会登记姓名。即使你的祖先用尽一切办法，他们的名字依旧被准确的书写在部落谱系内。作为部落的一员必须以身作则践行传统，财富属于部落。在那之后，你能得到属于你的一部分。“\n“但是，这不公平，这是我的私有财产，是神圣不可侵犯的。”\n“那在此之前先祖们是如何活下来的呢？靠分享，靠家庭。是你们摧毁了这些，让人们变得自私。我来告诉你什么才是神圣的......"
  SWE.081.a:  "传统，荣耀，部落与家族至上。"

  SWE.082.title:  "埃尔之诗"
  SWE.082.desc:  "“我恭请诸位——全体神明和海姆达尔子孙，不分贵贱。奥丁天父，要不要我讲述历史——从我记忆所及的最早的开端。\n我记得远古诞生的巨人，很久以前，他们把我养育，我记得九个世界、九个女先知，我记得地下神圣的裁判。在最初之时一切虚无。"
  SWE.082.a:  "不要停，我的瓦尔基里"

  SWE.083.title:  "再度扬帆"
  SWE.083.desc:  "维京部落老道的长辈只用嗅一嗅风带来的味道，就知道出海的季节到了。波罗的海畔雾气弥漫，对其它航海者来说这是糟糕的消息，他们会分不清方向，无法确认位置。但对维京人来说，雾是最好的掩护。先祖在雾气中出发而下征服欧洲，如今，我们要逆流而上，破开迷雾回到家乡。飞龙振翅待发，船帆在海风中呼呼明胶，催促出发。\n来吧，维京的勇士们，让我们再度扬帆。"
  SWE.083.a:  "为米德加尔特，为中庭而战。"

  SWE.084.title:  "直到诸神黄昏"
  SWE.084.desc:  "所有维京部落都为北海帝国欢呼！这一伟大的成就证明我们选择的正确，世界需要的不是难以琢磨的变化，而是一以贯之，灵魂追逐的荣耀，以及在这一过程中铸造的传统。我们不会再动摇，我们无需改变。北海帝国永恒，直到诸神黄昏。"
  SWE.084.a:  "世界沉没水底，最终复苏。"

###新闻
  SWE_news.001.title: "$news_event_background$第四次杜瑞战争"
  SWE_news.001.desc: "自卡尔马崩溃以来，为了争夺北海霸权，瑞典与南方的杜伦布共和国冲突不断。但随着瑞典入侵俄罗斯的惨败，杜伦布的Y机械师抓住机会，以决定性的优势击溃了瑞典。这一连串惨败不仅让瑞典失去了大片领土，更是给瑞典笼罩上了一层挥之不去的阴影。\n\n几天前，瑞典以侵犯领海为理由扣押了杜伦布的一艘渔船。在再三警告无果之后，杜伦布派出海岸警卫队试图武力夺回渔船，但警卫队见到的却是全副武装的瑞典军队——瑞典早就计划以此为契机，以“杜伦布悍然武装入侵瑞典”为名义，动员军队对杜伦布发起了全方位的进攻。\n\n而在昨日正午召开的新闻发布会上，[SWE.Getleader]在接受记者提问时声称：“要么瑞典得胜并夺回先前失去之物，要么瑞典从此不复存在，没有第三种可能。”"
  SWE_news.001.a: "要么光复凯旋，要么就此赴死！"
  SWE_news.001.b: "这次我们就跟他们奉陪到底！"
  SWE_news.001.c: "北海到底什么时候才能消停下来？"
  SWE_news.001.d: "北海到底什么时候才能消停下来？"
  SWE_news.001.e: "北海到底什么时候才能消停下来？"
  SWE_news.001.f: "北海到底什么时候才能消停下来？"

  SWE_news.002.title: "$news_event_background$[SWE.Getname]建立"
  SWE_news.002.desc: "随了第四次杜瑞战争的完全胜利，整个瑞典沉浸于数日的欢呼。\n正当西方怀疑斯卡哈·斯卡蒂这个执掌瑞典近30年的独裁者是否会此次事件的声望继续极权统治时，斯德哥尔摩确传出了震惊世界的消息，斯卡哈宣布了自己的辞职，将由此前协助她处理大萧条的临时内阁领袖[SWE.Getleader]组织筹建新的瑞典政府。\n对此，瑞典内部人民既有不舍也有称颂；大部分民主人士称之为20世纪的“辛辛纳图斯”。\n随着[SWE.Getleader]在斯德哥尔摩市政厅前的广场上的演讲后，[SWE.Getname]建立正式成立了，[SWE.Getleader]是[SWE.GetRulingParty]党内有名的莫斯科派，国际观察家普遍认为瑞典将会很快与苏联靠拢甚至加入第三国际，布尔什维克的势力将会很快扩张到北欧；也有人认为，瑞典国内本土工团主义力量也很强大，布尔什维克主义可能很难在瑞典的土壤中发芽。"
  SWE_news.002.a: "瑞典的工人站起来了！"
  SWE_news.002.b: "她们就是我们的遗产建设她们所谓的“共产主义”吗？"
  SWE_news.002.c: "不久的将来，共产主义的风暴将席卷整个欧洲！"
  SWE_news.002.d: "必然想办法遏制这些极权分子。"
  SWE_news.002.e: "必然想办法遏制这些极权分子。"
  SWE_news.002.f: "希望不要来“解放”我们。"

  SWE_news.003.title: "$news_event_background$北欧诸国的统一"
  SWE_news.003.desc: "随着北境诸国皆已克灭，[From.GetOldAdjective]政府现已开始加速对新征服领土的整合。而为了将民众团结于一国，政府同时还展开了一系列泛民族主义的宣传活动。\n\n[From.GetOldAdjective]官方对此引用旧谚，称“北欧诸国相亲，合当聚而为一，使民得同心共存。”看起来，该国政府是打算通过亲缘上的联系来团结民众。而作为“真正的北欧共同体”，该国正式改其国号为“[From.GetNameDef]”。"
  SWE_news.003.a: "团结的北境将更加强大！"
  SWE_news.003.b: "北境诸国或将很快成为其邻国的忧虑……"
  SWE_news.003.c: "这持续不了多久的！"

  SWE_news.004.title: "$news_event_background$斯德哥尔摩民众冲击市政厅"
  SWE_news.004.desc: "随着战争的失利，瑞典国内积压了二十多年的情绪终于爆发，年轻人从出生起，斯卡哈就掌握着政府，整个国家也被绑架在了她可笑的收复失地的战争机器上，现在战争失败，瑞典二十多年的努力全部浪费。\n昨日，一支政变部队闯入了斯卡哈的办公室，将斯卡哈暂时软禁起来了；愤怒的民众冲向了斯德哥尔摩市政厅，要求现任内阁首脑辞职，组织新的政府。\n整个斯德哥尔摩陷入混乱中......"
  SWE_news.004.a: "太糟糕了。"
  SWE_news.004.b: "手下败将的必然结局。"
  SWE_news.004.c: "我们静观其变。"

  SWE_news.005.title: "$news_event_background$明内幽成为瑞典新主席"
  SWE_news.005.desc: "随着民众的压力越来越大，前临时政府首脑日奈森亚梦不得不宣布辞职，随之一起退出瑞典政坛的，是以她为首的瑞典共产党莫斯科派。\n现在，瑞共本土派系的领袖明内幽已经正式接管了政府，随着新政府的建立，瑞典国内的乱象也开始缓和，毫无疑问，如何处理这场事件，将是决定瑞典此后国家命运的重要时刻。\n有小道消息称，虽然明内幽是瑞共本土派的领袖，但是她本人其实是外星人，不过大部分人都是把这个当作是茶余饭后的荒谬谈资，瑞共中央也未做出任何回复。"
  SWE_news.005.a: "新政府，新气象。"
  SWE_news.005.b: "不过是换汤不换药。"
  SWE_news.005.c: "希望她们不会再捅娄子了。"
  SWE_news.005.d: "这是对莫斯科的背叛。"

  SWE_news.006.title: "$news_event_background$[SWE.Getleader]公布航天计划"
  SWE_news.006.desc: "一则震惊的新闻来自斯德哥尔摩：瑞典官方对此前明内幽是外星人的谣言辟谣：谣言是真的！\n不过明内幽主席失去了她来到地球以前的所有记忆，她也宣誓将永远效忠于她现在祖国--瑞典。\n同时，她也宣布了一则更为重量级的消息，瑞典中央为了帮助明内幽主席找寻失去的记忆与母星，决定开启人类的首个航空计划。副主席小之星海果在斯德哥尔摩市政厅前广场宣布：\n\n我们选择去太空！"
  SWE_news.006.a: "瑞典，敢于逐梦！"
  SWE_news.006.b: "这是疯子一样的计划。"
  SWE_news.006.c: "我们必须防范于未然。"

  SWE_news.007.title: "$news_event_background$瑞典火箭被魔导国击落"
  SWE_news.007.desc: "随着瑞典近年来对火箭科技的大力投入，一场航天火箭的公开实验开始了。\n全世界的人们紧盯着电视机或者守在收音机旁，秉住呼吸期待着这一人类历史性的时刻----“3...2...1，点火，发射。”\n随着火箭拖着长长的尾焰直插云霄，全世界的人们开始欢呼这一历史性的时刻，有人期望着地球和魔导国在太空进行一场公开的较量，有人期望着外星的物资与生存空间，更多人是对人类的探索边界的扩充与科技的进步感到由衷的欣喜。\n但是，数小时后，一则重磅消息传到世界各地，随着一道火焰炸开，瑞典失去与火箭的通讯--魔导国的星际舰队击落了瑞典的火箭。这无疑是给全世界的当头一棒，刚刚还在欢呼的地球陷入了可怖的死寂中......"
  SWE_news.007.a: "全国之努力化为泡影。"
  SWE_news.007.b: "我们将一直无法前往太空吗......"
  SWE_news.007.c: "这就是挑衅我们的下场。"

  SWE_news.008.title: "$news_event_background$瑞典成功发射人类第一颗人造卫星。"
  SWE_news.008.desc: "随着瑞典近年来对火箭科技的大力投入，一场航天火箭的公开实验开始了。\n全世界的人们紧盯着电视机或者守在收音机旁，秉住呼吸期待着这一人类历史性的时刻----“3...2...1，点火，发射。”\n随着火箭拖着长长的尾焰直插云霄，全世界的人们开始欢呼这一历史性的时刻，有人期望着地球和魔导国在太空进行一场公开的较量，有人期望着外星的物资与生存空间，更多人是对人类的探索边界的扩充与科技的进步感到由衷的欣喜。\n随着人造卫星成功进入太空轨道，地球上的人们也认识到，曾经盘旋于头顶的外星舰队已经离开。随着无线电信号传回的，是太空的温度、湿度以及一张--地球的彩色照片。\n\n\n\n\n\n£SWE_Launch_of_Sputnik_Win_Pic\n\n\n\n\n\n\n这是人类第一次看到这颗她们祖祖辈辈生活了上万年的星球的全貌。"
  SWE_news.008.a: "人类的一大步！"

  SWE_news.009.title: "$news_event_background$瑞典建立民主政府"
  SWE_news.009.desc: "随了第四次杜瑞战争的完全胜利，整个瑞典沉浸于数日的欢呼。\n正当西方怀疑斯卡哈·斯卡蒂这个执掌瑞典近30年的独裁者是否会此次事件的声望继续极权统治时，斯德哥尔摩确传出了震惊世界的消息，斯卡哈宣布了自己的辞职，将由此前协助她处理大萧条的临时内阁领袖[SWE.Getleader]组织筹建新的瑞典政府。\n对此，瑞典内部人民既有不舍也有称颂；大部分民主人士称之为20世纪的“辛辛纳图斯”。\n随着[SWE.Getleader]在斯德哥尔摩市政厅前的广场上的演讲后，[SWE.Getname]建立正式成立了，这也标志着二十余年的独裁的结束，瑞典重回民主制度。"
  SWE_news.009.a: "明天会更加美好！"
  SWE_news.009.b: "让她们欢呼吧，暂时。"
  SWE_news.009.c: "反动派越来越强了。"
  SWE_news.009.d: "这将有利于遏制共产主义的威胁。"
  SWE_news.009.e: "这将有利于遏制共产主义的威胁。"
  SWE_news.009.f: "这将有利于遏制共产主义的威胁。"

  SWE_news.010.title: "$news_event_background$[SWE.Getname]建立"
  SWE_news.010.desc: "随了第四次杜瑞战争的完全胜利，整个瑞典沉浸于数日的欢呼。\n正当西方怀疑斯卡哈·斯卡蒂这个执掌瑞典近30年的独裁者是否会此次事件的声望继续极权统治时，斯德哥尔摩确传出了震惊世界的消息，斯卡哈宣布了自己的辞职，将由此前协助她处理大萧条的临时内阁领袖[SWE.Getleader]组织筹建新的瑞典政府。\n对此，瑞典内部人民既有不舍也有称颂；大部分民主人士称之为20世纪的“辛辛纳图斯”。\n随着[SWE.Getleader]在斯德哥尔摩市政厅前的广场上的演讲后，[SWE.Getname]建立正式成立了，瑞典将彻底走上右翼的道路，走向她们所谓的民族复兴。"
  SWE_news.010.a: "迈向伟大复兴！"
  SWE_news.010.b: "她们将溺死在法西斯主义的泥潭里。"
  SWE_news.010.c: "一个独裁者下去了，另一个独裁者上来了。"
  SWE_news.010.d: "一个独裁者下去了，另一个独裁者上来了。"
  SWE_news.010.e: "我们可以开始讨论合作问题了。"
  SWE_news.010.f: "一个独裁者下去了，另一个独裁者上来了。"

  SWE_news.011.title: "$news_event_background$瑞典君主制复辟"
  SWE_news.011.desc: "随着民众的压力越来越大，民主政府摇摇欲坠，这个时候暗中潜藏的保皇人士成功崛起，夺取了政权。\n1910年，斯卡哈·斯卡蒂建立政权时，虽然流放了瑞典王室，但是并未彻底清算国内的保皇势力，这使得保皇派仍有足够的政治势力在如今迎回流亡王室。\n现在流亡中的克里斯蒂娜六世已经回到斯德哥尔摩，她的加冕仪式也即将举行。"
  SWE_news.011.a: "天佑女王。"
  SWE_news.011.b: "反动派越来越强了。"
  SWE_news.011.c: "一个独裁者下去了，另一个独裁者上来了。"
  SWE_news.011.d: "一个独裁者下去了，另一个独裁者上来了。"
  SWE_news.011.e: "一个独裁者下去了，另一个独裁者上来了。"
  SWE_news.011.f: "一个独裁者下去了，另一个独裁者上来了。"

  SWE_news.012.title: "$news_event_background$瑞典龙骑兵团政变"
  SWE_news.012.desc: "随着民众的压力越来越大，民族派政府的公信力掉至冰点。在斯德哥尔摩爆发大规模抗议游行时，政府选择了调集军队入城，做最坏的打算。\n但是，作为瑞典精锐部队龙骑兵团的领袖小嗝嗝·恐怖·黑线鳕三世并不愿向民众出手，他选择了顺应民意发动了政权，飞龙不费吹灰之力就攻下了斯德哥尔摩市政厅，卡莲·艾露维希娅斯的吸血鬼帝国宣布灭亡。\n小嗝嗝联合军队与政府中的其它维京人，组建起了新的瑞典政府--维京帝国。"
  SWE_news.012.a: "复兴维京荣光！"
  SWE_news.012.b: "这是什么旧时代的遗老？"
  SWE_news.012.c: "这是什么旧时代的遗老？"
  SWE_news.012.d: "这是什么旧时代的遗老？"
  SWE_news.012.e: "这是什么旧时代的遗老？"
