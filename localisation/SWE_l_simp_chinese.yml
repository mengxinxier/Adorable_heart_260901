  SWE_his_page_01_title: "繁荣的过往"
  SWE_his_page_02_title: "近代的衰落"
  SWE_his_page_03_title: "20年的奋斗"
  SWE_Country_History_Page_01: "为了对抗汉莎同盟，让北欧组成了自己的联盟－“卡尔马联盟”就此成立，它们以武力昌盛，一直以战争为主的杜伦布王国为自己的共主联邦之主。\n联盟初期，杜伦布王国为了稳固盟主地位，经常以怀柔手段对待各国贵族，使得最初的杜伦布王室得到了各国的拥戴。但后来杜伦布王室不断企图控制挪威和瑞典的内政事务，导致联盟的离心离德。频繁的战争影响了瑞典的收入，由杜伦布主导的联盟中央不断的集权也起瑞典贵族的反对。因此，瑞典枢密院要求政府给予一定限度的自治。\n15世纪末，杜伦布王室和瑞典贵族的矛盾激化，反对联盟的冲突不断爆发。1520年亲率重兵攻克被瑞典独立派占领的瑞典首都斯德哥尔摩，并且屠杀了大批参与叛乱的瑞典贵族，史称“斯德哥尔摩惨案”。\n在惨案的遇难者当中包括古斯塔夫的父亲埃里克·约翰松，而古斯塔夫本人幸免于难。他逃往到达拉纳省，到1521年成功地在那里组建了一支听命于他的志愿军。国内的一些城邦公会和汉萨同盟中的一些人给予了他很大的帮助，其下属的绝大多数部队来自各地公会。1521年8月，达拉纳的居民推举古斯塔夫·瓦萨为瑞典摄政和最高统治者。\n他在接下来的两年里逐渐消灭了前来讨伐的杜伦布军队，并一举剪除杜伦布在大陆上的势力，让杜伦布只能依靠海峡天险苦苦支撑。最终在军事压力和各方斡旋下，古斯塔夫放弃了直接占领整个杜伦布，而杜伦布需要废除国王，建立共和政府；瑞典最终成功联统了挪威与索米，古斯塔夫成为瑞典国王。\n\n"
  SWE_Country_History_Page_02: "十七世纪末，在一次次的扩张和改革中，瑞典最终占据了波罗的海的主导权，称霸北欧已是既定事实，但快速的崛起最终会引起那些强大帝国的觊觎。俄罗斯帝国、卡西米尔王国和杜伦布共和国组建北方联盟对抗瑞典王国。\n为此，瑞典国王卡尔十二世以强大的军事才能和瑞典规模巨大的陆海军，先是击败杜伦布，惩戒其首鼠两端的背叛行为。然后再挥军卡西米尔，在其敌国城下将他们引以为傲的骑兵正面击溃迫使卡西米尔退出北方联盟。他用20年的时间将这场老牌帝国的打压一步步瓦解。\n到十八世纪初，他已经将这个所谓的北方联盟逼到分崩离析，只需要进军俄罗斯，将这个摇摇欲坠的破房子踹上最后一脚。但此时俄罗斯帝国在一次次失败中已经淬炼得今非昔比，彼得一世改革之后军力也不可同日而语。在俄罗斯坚壁清野的战术之下，瑞典军队深入俄罗斯腹地，然而惨烈的战争消耗和漫长的补给线最终拖垮了这支铁血强军。卡尔十二世几乎仅以身免才得以逃回瑞典。俄罗斯迅速反攻，在节节胜利中夺取大片区，建立起索米附庸国。\n这场战争的失败严重影响了瑞典王国对其他地区的掌控，挪威的魔物联盟独立主义已甚嚣尘上，杜伦布共和国脱离联盟的声音也风起云涌。公会城邦的领袖们也在向着这位光杆国王要求更多的权利，整个国家都如同燃烧的烈焰般疯狂，而瑞典政府的残酷镇压也无异于为这团内乱的烈焰加上了最好的助然剂。\n在一场对魔物独立游行的镇压成为了压死骆驼的最后一根稻草。内战席卷了联盟全境。内战遍及全国，强军最终变成了流寇。内战的双方都吊着最后一口气苦苦坚持，内战走到尽头，瑞典同意以联盟国的形势让挪威成为魔物联盟的国度，杜伦布共和国也摆脱了附庸国的身份。\n随着工业革命的开始，曾经的死敌杜伦布随着海水的上涨大片陆地被海水吞噬，就要在大海的波涛中消弭，在危机之中，杜伦布得到了一个名为“Y”的神秘人的帮助，用神乎其技的“机械”技术保下了即将沉没的杜伦布，他也因此成为了杜伦布事实上的领袖，疯狂的“Y”开始展露出战争贩子的真面露，杜伦布对瑞典不宣而战。\n一支强大的“机械”军团踏上杜伦布“故土”，他们势如破竹，轻松的就推进到那个以卡尔马命名的地方，他的名字代表曾经的辉煌，也因代表未来的辉煌，本该是这样的......\n侵略者的铁蹄已经兵临斯德哥尔摩城下，即使过去矛盾重重的政客放下了成见，即使过去激烈角逐的公会也放下了利益，即使刚刚经历过天灾的平民百姓也拿起了武器，与那支强大的“机械”军团浴血奋战。战线开始一点点的反推，战争的天平也开始向瑞典倾斜，但这样的爆发也不知能持续多久。\n随着战事的糜烂，杜伦布战争的热情一度进入冰点，而瑞典的反攻也在卡尔马城下出现了疲态，双方最终就在卡尔马一线僵持下来。随着“Y”的老去，杜伦布一统北欧的野望也被现实的疲软扫进历史的尘埃中，在20年的缠斗后，1910年，双方开始了和平谈判的进程。\n《卡尔马条约诞生了》，瑞典南方大量富庶的领土被割让给了杜伦布，瑞典失去了12％的领土与四分之一人口。\n\n"
  SWE_Country_History_Page_03: "战争的失利使得国王的公信力彻底崩塌了，瑞典的“最后一位神明”—斯卡哈·斯卡蒂宣告政变，驱逐了王室，开始了她的20余年的独裁。\n在这20多年里，瑞典击败了苏俄的追兵，接纳了芬兰流亡者，占领了托尔尼奥，使瑞典人重振信心；经济振兴，工业化与现代化开始吹拂瑞典的国土；复仇主义狂热，瑞典不会忘记曾经的耻辱，国家团结一致，为了复兴过去的荣耀。\n1934年，国防军已经无法抵挡骸骨之夜的攻势，德国政府不得不南逃奥地利，而德国的北方舰队便失去了容身之港，这时，瑞典便向德国抛出了橄榄枝，来自德意志的先进技术与科技进入瑞典国，而代价则是把哥得兰岛租借给德国作为海军基地。\n\n就这样，瑞典迎来了风雨飘摇的1936年。\n\n"

  Nordic_Local_History_Title: "§C北欧§!地区"
  Nordic_Local_History_Title_01: "海盗时期"
  Nordic_Local_History_Title_02: "卡尔马联盟"
  Nordic_Local_History_Title_03: "大北方战争"
  Nordic_Local_History_Page_01: "杜伦布人擅长航海，常南下罗马帝国以琥珀、燧石等换取谷物和其他用具。他们往往亦商亦盗，在夏季纠众出海进行抢劫。\n793年，杜伦布海盗袭击了英格兰的林第斯法恩岛。自此以后，杜伦布海盗对英格兰的侵扰规模越来越大。\n871年杜伦布海盗占领伦敦。878年英格兰国王阿尔弗雷德大帝和杜伦布海盗媾和，双方平分英格兰，杜伦布移民在英格兰东北部建立“杜伦布区”。985年形成统一王国。 \n1016年杜伦布国王克努特大帝攻占英格兰全境，并建立了版图包括挪威、英格兰、苏格兰大部和瑞典南部的“北海大帝国”。这个帝国在1042年瓦解。\n10世纪，罗马天主教从杜伦布传入到瑞典，并很快巩固下来。 \n11世纪初，瑞典开始形成国家。 \n1157年，瑞典兼并芬兰。瑞典独立后，新教路德宗取得了支配地位。早期的传说留下了几位早期瑞典国王的姓名和事迹，如埃里克家族和斯沃克家族，直到福尔孔王朝统治的建立。 \n与近邻杜伦布人和挪威人相比，海盗时期的瑞典人更注重商业贸易而不是征服和殖民，致力于向欧洲东部和东南的经营，势力曾经远达黑海和里海沿岸。在这里瑞典人与阿拉伯人甚至更往东的民族交换皮毛，金属等产品，到达过君士坦丁堡，耶路撒冷和巴格达。瑞典王宫钱币展览馆收藏有当地出土的古代西亚国家铸币。\n瑞典人首先到达了芬兰湾北岸、涅瓦河和拉多加湖一带。他们在这里建立据点，并继续向南推进，在诺夫哥罗德建立了诺夫哥罗德公国。据基辅修士的记载，一支瑞典人进入东欧腹地并建立了基辅罗斯，他们被称为瓦良格人。过程是这样的：维京人因对斯拉夫人征收重税而被逐出，但斯拉夫部族却由此陷入混乱之中。有人提出从别的国家请一位国王来统治他们。于是使者来到瑞典，有三兄弟成为候选人，他们是留里克，辛由斯和特鲁弗。他们成为后来诺夫哥罗德、白俄罗斯和伊兹伯斯克的统治者。辛由斯和特鲁弗去世后，留里克接管了他们的土地。他的继任者奥列格征服了基辅，成立了基辅罗斯国。\n"
  Nordic_Local_History_Page_02: "为了对抗汉莎同盟，北欧组成了自己的联盟－“卡尔马联盟”就此成立，它们以武力昌盛，一直以战争为主的杜伦布王国为自己的共主联邦之主。\n1397年成立以杜伦布女王玛格丽特一世为盟主的卡尔马联盟，疆土包括现杜伦布、挪威、瑞典、冰岛、格陵兰、法罗群岛以及芬兰的一部分，杜伦布处于统治地位。 卡尔马联盟前后共维持了126年，在此期间，杜伦布为打破汉萨同盟对波罗的海经济支配权继续对外扩张，经过长期战争并吞了石勒苏益格和荷尔斯泰因。长期战争耗费了杜伦布大量财力，导致赋税加重。富豪贵族兼并土地引起农民暴动。\n14世纪中叶黑死病又夺走近一半人口的生命。为平息不满和动乱，1468年，国王克里斯蒂安一世召集了四级会议寻求支持。但是暴动连绵不断，尤其在瑞典。\n联盟初期，杜伦布王国为了稳固盟主地位，经常以怀柔手段对待各国贵族，使得最初的杜伦布王室得到了各国的拥戴。但后来杜伦布王室不断企图控制挪威和瑞典的内政事务，导致联盟的离心离德。频繁的战争影响了瑞典的收入，由杜伦布主导的联盟中央不断的集权也起瑞典贵族的反对。因此，瑞典枢密院要求政府给予一定限度的自治。\n15世纪末，杜伦布王室和瑞典贵族的矛盾激化，反对联盟的冲突不断爆发。1520年亲率重兵攻克被瑞典独立派占领的瑞典首都斯德哥尔摩，并且屠杀了大批参与叛乱的瑞典贵族，史称“斯德哥尔摩惨案”。\n在惨案的遇难者当中包括古斯塔夫的父亲埃里克·约翰松，而古斯塔夫本人幸免于难。他逃往到达拉纳省，到1521年成功地在那里组建了一支听命于他的志愿军。国内的一些城邦公会和汉萨同盟中的一些人给予了他很大的帮助，其下属的绝大多数部队来自各地公会。1521年8月，达拉纳的居民推举古斯塔夫·瓦萨为瑞典摄政和最高统治者。\n他在接下来的两年里逐渐消灭了前来讨伐的杜伦布军队，并一举剪除杜伦布在大陆上的势力，让杜伦布只能依靠海峡天险苦苦支撑。最终在军事压力和各方斡旋下，古斯塔夫放弃了直接占领整个杜伦布，而杜伦布需要废除国王，建立共和政府；瑞典最终成功联统了挪威与索米，古斯塔夫成为瑞典国王。\n"
  Nordic_Local_History_Page_03: "在1560至1658年间，瑞典形成了一个以芬兰湾为中心的波罗的海帝国，包括卡累利阿，因格里亚，爱沙尼亚和立窝尼亚。在三十年战争中，瑞典在德意志也得到了大片领地，包括西波美拉尼亚，维斯马，不莱梅公国和费尔登。同时瑞典还征服了杜伦布和挪威在松德海峡以北的领地。\n这些胜利可能要归因于训练有素的军队，尽管其规模相对较小，但是比大多数欧陆军队专业化程度高得多。尤其是其专业军事训练使得其可以维持高比例的小型火枪队。但是由于战争费用不能由占领区提供，瑞典最终证明不能在旷日持久的战争中维持其军队。\n大动乱期间外国对俄罗斯的干涉使瑞典在《斯托尔博沃条约》（1617）大有斩获。该条约剥夺了俄国通往波罗的海的直接出海口，意味着俄国从此不再有挑战瑞典地区霸权的实力。\n俄罗斯的命运在17世纪后半叶得到了逆转，尤其是在彼得大帝即位后，他一直寻求夺回之前的损失并重建在波罗的海的地位。\n17世纪90年代末，探险家约翰·帕特库尔通过《普列奥布拉任斯科耶条约》成功将俄罗斯，杜伦布和萨克森结成联盟，三国于是于1700年发动了俄国北部战役。\n经过了11年的血腥战争，最终以瑞典的失败告终，俄罗斯得到了索米及波罗的海周围的领地，成为了东欧最强大的国家。\n"

