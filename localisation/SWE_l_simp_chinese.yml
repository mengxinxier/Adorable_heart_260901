  SWE_Dragoon_regiment: "博克岛的龙骑兵团"
  SWE_Dragoon_regiment_desc: "飞龙，一种原产自北欧的强大生物。\n过去人们认为飞龙是一种邪恶的、侵略性的生物；但是事实证明，只要我们表现出足够的尊重与友善，飞龙也能成为人类忠诚的盟友乃至战斗力。\n\n现在，来自博克岛的专业驯龙大师们愿意为了我们驯服这些强大的战争机器，只要我们提供足够的资金支持。"

