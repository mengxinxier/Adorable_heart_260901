 #一阶段国策
  SWE_urbanization: "城市化"
  SWE_urbanization_decision_tt: "解锁使用§Y政治点数§!获得§Y提升省份地区类型§!和§Y建筑槽§!的决议"
  SWE_urbanization_desc: "工业化和城市化实为一体之两翼。城市里的岗位越多，来自乡村的人口迁移也就越多。我们如果要避免城市落得拥挤不堪的贫民窟的下场，就需要投资扩建基础设施，为即将到来的人口增长做好准备。"
  SWE_Review_economy: "审视国内经济"
  SWE_Review_economy_desc: "重新稳定一个国家是艰难的，由此当我们领导瑞典回归稳定并重建了我们赖以生存的工业体系。举国上下的乐观态度是毋庸置疑的，这会是终点吗？"
  SWE_Review_troops: "检阅部队"
  SWE_Review_troops_desc: "瑞典已经拥有一支能够在意外冲突面前保卫主权的可靠军队，但这远远不够——一场新的战争也许已迫在眉睫。"
  SWE_Crisis_years: "危机岁月"
  SWE_Crisis_years_desc: "于圣杯王国内爆发的经济危机已经蔓延至我国，这对我国脆弱的经济体系来说无疑是当头一棒，未来可能的政治动乱也可预见。"
  SWE_Form_cabinet: "组织内阁"
  SWE_Form_cabinet_desc: "斯卡哈已经选择了最有可能稳定混乱局势的一派组织内阁。"
  SWE_Democratic_Cabinet: "民主党内阁"
  SWE_Democratic_Cabinet_desc: "基督教民主联盟成功得到了当局者的青睐，以圣女为首的温和主义者需要在动荡局势之下尽快做出对策。"
  SWE_National_Industrial_Revitalization_Act: "国家工业振兴法案"
  SWE_National_Industrial_Revitalization_Act_desc: "瑞典的首要之事便是刺激本国的低迷产业，内阁提出了一项临时的经济投资计划，以集中国家资金扶持关键的经济支柱产业。"
  SWE_Guaranteed_minimum_wage: "保障最低工资"
  SWE_Guaranteed_minimum_wage_desc: "瑞典各地的工会都在不遗余力的为共产党的主张造势，内阁无法对此置若罔闻，从最低工资标准开始，瑞典必须开始筹措全国社会福利体系。"
  SWE_Establish_minimum_working_hours: "规定最长工时"
  SWE_Establish_minimum_working_hours_desc: "工会骚乱正在极大的打击各地产业的生产秩序，内阁的首要任务是重新挽回瑞典企业家对国内经济的信心。为此可以不择手段。"
  SWE_God_bless_Sweden: "上帝保佑瑞典"
  SWE_God_bless_Sweden_desc: "经济危机所导致的社会分裂对于瑞典来说是致命的，不过以上帝的名义，内阁的保守主义政策暂时弥合了国内分歧。这一次不再将有人绽露笑颜，大家都清楚一点：长路漫漫，但时不我待。"
  SWE_Nationalist_Cabinet: "民族派内阁"
  SWE_Nationalist_Cabinet_desc: "瑞典民族联盟成功上台组阁，他们致力于通过目光对外来消弭本不应发生的社会对立。"
  SWE_Class_collaboration: "阶级协作"
  SWE_Class_collaboration_desc: "要想尽快开展我们的工作，那就必须解决劳资双方的恶性对立。萝卜也好大棒也罢，他们必须接受由国家主导的调和机制。将所谓的“阶级斗争”抛诸脑后。"
  SWE_Strengthen_authority_of_government: "加强政府权威"
  SWE_Strengthen_authority_of_government_desc: "在我们的印象里，斯卡哈的独裁政府经常被冠以“独裁”的帽子，以至于内阁在上任时惊讶于现政府应对地方问题竟如此无力和退让。就目前的情况来说，我们必须扭转中央权力式微的局面，重新对各地施加直接影响。"
  SWE_Enslavement_of_foreign_laborers: "奴役外族劳动力"
  SWE_Enslavement_of_foreign_laborers_desc: "来自海外的异族劳工正在一步步蚕食国内职工的生存空间，只要稍加引导，我们就能将群众的目光聚焦在他们身上，将他们踩在脚下的举措也将由此被赋予合法性。"
  SWE_Increase_military_orders: "增加军事订单"
  SWE_Increase_military_orders_desc: "经过一系列雷厉风行的举措，我们确保了瑞典人民能够真正团结在一面旗帜之下。要想将这个国家建成一个真正的战争机器还需时日，不过一场足以证明瑞典民族的冲突已经离我们不远。"
  SWE_Communist_Party_Cabinet: "共产党内阁"
  SWE_Communist_Party_Cabinet_desc: "斯卡哈力排众议默认了共产党在政府中的统治地位。这无疑是向工会领导者们举起了白旗。毋庸置疑的是，共产党人给出的良方乃彻底变革瑞典的经济体制。"
  SWE_Formation_of_planning_committee: "组建计划委员会"
  SWE_Formation_of_planning_committee_desc: "为了重振低迷的经济产业，我们得先组织起一个足以指导我国经济渡过危机的经济发展部门"
  SWE_Acquisition_of_bankrupt_estates: "收购破产产业"
  SWE_Acquisition_of_bankrupt_estates_desc: "我们目前没有足够的实力将国有化计划摆上台面，但考虑到经济危机造就了大量已经破产或处于破产边缘的“遗产”，我们完全有理由将这些产业纳入国家的直接控制。"
  SWE_Collectivization_of_agriculture: "农业集体化"
  SWE_Collectivization_of_agriculture_desc: "经过一场强制性的农业集体化运动，我们有望在五到六年内在农村实现合作社经济，这将是对瑞典的个体农业最为深远而有益的改造。"
  SWE_Launch_of_five_year_plan: "启动五年计划"
  SWE_Launch_of_five_year_plan_desc: "在足够的国控企业的支持下，效仿其他的社会主义国家制定长期经济计划的提议已经变得可能，如果这场伟大的经济实践能够取得重大成果，我们就能巩固社会主义者在瑞典经济领域的领导地位。"
  SWE_Public_works_construction: "公共工程建设"
  SWE_Public_works_construction_desc: "目前社会上存在大量的失业人口，我们必须在短期内制造大量的应急社会岗位，好在瑞典的城市化计划本就如火如荼，我们可以用大量的公共工程项目来解决凶猛的失业潮。"
  SWE_National_Guaranty_Bank: "国家担保银行"
  SWE_National_Guaranty_Bank_desc: "大量的私立银行正处在信用破产的边缘，中央银行不能坐视这些银行的崩溃，内阁已经提出一项紧急的储备金支出草案，中央银行将向情况危急的银行提供大量的无息贷款。"
  SWE_Expand_power_of_trade_unions: "扩大工会权力"
  SWE_Expand_power_of_trade_unions_desc: "经济危机造成的现况肯定也不是工会所乐于看见的，通过一些适当的妥协与放权，我们可以缓解来自左翼政治团体的政治压力。"
  SWE_Abolish_the_gold_standard: "废除金本位"
  SWE_Abolish_the_gold_standard_desc: "经济危机的迅猛程度超出了央行的想象。在一场紧急组织的中央会议之后，废除金本位制度的意见占据了多数。瑞典需要结束本国货币固化的历史，以实现国家金融政策的灵活化。"
  SWE_Reconstruct_monetary_system: "重构货币体系贬值克朗"
  SWE_Reconstruct_monetary_system_desc: "就目前而言瑞典不太可能去得到来自外部的金融投资，在国内经济普遍低迷的情况下，我们必须对克朗进行贬值并加大货币供应以扭转紧缩通货政策。"
  SWE_Survive_crisis_together: "共度危机"
  SWE_Survive_crisis_together_desc: "大敌当前，瑞典却深陷经济混乱之中，人民正在陷入愤怒和互相指责的窠臼。瑞典绝不能以一个裂开的房子的姿态横渡泥潭，全瑞典的人民都应当为了拯救这个国家而同舟共济。"
  SWE_The_dust_settled: "尘埃落定"
  SWE_The_dust_settled_desc: "经济危机已经结束，现任内阁在政治动荡中站稳了脚跟。而战争也已近在眼前......."
  SWE_Revenge_for_1910: "为1910复仇"
  SWE_Revenge_for_1910_desc: "时机以至，瑞典的“邓南遮”们无时无刻不在期盼着这一天，瑞典民族将要夺回它在1910年所失去的一切。但他们代表不了人民，若这场孤注一掷的举措最终一败涂地，那将更是如此......"
  SWE_The_mighty_man_triumphed: "壮士凯旋"
  SWE_The_mighty_man_triumphed_desc: "这是瑞典第一次扬眉吐气的时候，旧日之痂已被轻轻掸去，瑞典人终于再一次回到了他们阔别二十年之久的卡尔马。莫要打扰他们的喜悦，唯有我们需要继续筹划这个国家的未来......"
  SWE_Defeat_Karma_again: "再败卡尔马"
  SWE_Defeat_Karma_again_desc: "你预见了我们将要遇到的惨败——你应该不会想说你打算让瑞典失败的吧？那大可不必，不会出现什么独特的内容的，老老实实打赢战争罢......什么？瑞典真的即将失败？不必惊惶，诸事无常，我们只需做好万全准备——还没到画上休止符的时候。"

 #红线（战胜）
  SWE_Communist_government: "共产党政府"
  SWE_Communist_government_desc: "战争的胜利让共产联盟在瑞典的统治变得无可争议，崭新的左翼内阁宣告着这个北欧国家倒向社会主义阵营。"
  SWE_dream_of_Hinamori_Amu: "日奈森亚梦的心绪"
  SWE_dream_of_Hinamori_Amu_desc: "诚然，瑞典共和国迈过了复兴的第一道门槛，但前路仍未可知。莫斯科派与本地工团主义者的分歧正在摆上台面。两派意见的交锋将紧密牵动瑞典的政治方向。"
  SWE_Proletarian_democracy: "无产阶级民主"
  SWE_Proletarian_democracy_desc: "我们不能冒险让政权落入先锋队精英的手中。我们必须确保工人阶级能够实实在在的成为共和政府之倚仗。要求建立苏维埃政权的意见实乃不合国情。"
  SWE_Respect_Nordic_faith: "尊重北欧信仰"
  SWE_Respect_Nordic_faith_desc: "即使是在工人阶级内部，大多数实业工人也依然信仰国教，我们不能因为简单的进步与否就对本国的宗教事务横加干涉，瑞典公民的宗教信仰权利应当得到保证。"
  SWE_Party_activity_is_permitted: "允许党派活动"
  SWE_Party_activity_is_permitted_desc: "左翼联盟本就不是一言堂，错误的推行一党政治只会轻易加剧联盟内部的分裂，我们应当允许不同的社会主义政党进行活动。"
  SWE_People_Homeland: "人民家园"
  SWE_People_Homeland_desc: "瑞典在近几年取得的工业成果允许我们进一步完善、加强本国的福利政策。任何忠于国家、忠于社会主义的瑞典公民都应当能够享受完善的社会保障福利，瑞典将成为真正的人民家园。"
  SWE_Raise_authority_of_Soviets: "提高苏维埃权威"
  SWE_Raise_authority_of_Soviets_desc: "执政联盟的意见对立对于瑞典来说是危险的，这会削弱党在政府内的话语权。如果布尔什维克们想要真正巩固他们在北欧的权力，那么将瑞典转变为一个真正的苏维埃政权就是我们当前最紧要的任务。"
  SWE_democratic_centralism: "民主集中制"
  SWE_democratic_centralism_desc: "我们统治这个国家的权力来源于瑞典的无产阶级人民，而不是所谓海纳百川的临时议会。长久的一人摄政让新议会难以在瑞典站稳脚跟，我们应当取缔议会，实现真正的社会主义体制下的集中指导民主。"
  SWE_State_atheism: "国家无神论"
  SWE_State_atheism_desc: "斯卡哈的政教合一倾向将瑞典与天主教会紧紧联系在了一起，现存的教士阶级已然成为国家无法容忍的反动势力所在。要想尽可能平稳的废黜天主权威，组织国家无神论教育应当是瑞典的首要事务。"
  SWE_State_atheism_tt: "将禁用§Y英灵殿§!决议且相关§Y民族精神§!将会失效"
  SWE_Dictatorship: "无产阶级专政"
  SWE_Dictatorship_desc: "虚伪的资产阶级代议体制也许适合各怀心思的“同志”们争锋相对，但绝不可能为真正的无产阶级统治所容，没有必要和政治异见者打哑谜了，我们要让这个社会主义国度变得名副其实。"
  SWE_Look_at_planned_economy: "审视计划经济"
  SWE_Look_at_planned_economy_desc: "五年计划的推进为我们带来了许多宝贵的实践经验，瑞典缺乏有力的地方行政部门和可靠的经济专家，打肿脸充胖子的举措并不明智。"
  SWE_Democratization_of_industry: "产业民主化"
  SWE_Democratization_of_industry_desc: "我们的国家产业应当交由经验最为丰富的技术工人进行统筹领导。通过组织鼓励产业工人自发进行企业内选举，我们可以尝试在个体企业范围内同时实现工人民主与选贤与能的社会愿景。"
  SWE_commune_produced_autonomously: "公社自主生产"
  SWE_commune_produced_autonomously_desc: "我们不应当干涉公社单位的具体运作，只要我们每年的计划指标符合现实预期，我们便毋需担心公社的生产积极性与工作效率，应当在此基础上进一步简政放权，将管理产业的权力下放公社。"
  SWE_land_reform: "土地改革"
  SWE_land_reform_desc: "在斯卡哈政府几十年的摄政之下，超过半数的国家田地归于天主教会和乡村地主的控制之下，瑞典的工业扩张必须以农业的稳定为前提，我们不能再和这些国家的敌人虚与委蛇了。一场大规模的土地改革势在必行。"
  SWE_Soviet_model: "苏联模式"
  SWE_Soviet_model_desc: "五年计划的成功意味着瑞典迈向计划经济的道路已经不再存在阻碍。党中央将一步一步的在瑞典的经济部门内部实现全面且精密的控制，社会主义的大手将更加有力地操控这个新生国度。"
  SWE_In_depth_five_year_plan: "深入五年计划"
  SWE_In_depth_five_year_plan_desc: "我们实行的第一次五年计划现在看来不过是个虚设标靶的奇怪举措，光靠摇旗呐喊是无法拉动国家机器的，我们必须在下一次的五年计划中更加细致的明确各经济部门的计划指标与发展要务，以保证政府对工农业发展的精准调控。"
  SWE_Collectivization_of_peasants: "农民集体化"
  SWE_Collectivization_of_peasants_desc: ""
  SWE_Nationalized_industry: "国有化产业"
  SWE_Nationalized_industry_desc: "直至战后，依然有大量的民控企业独立于中央以外独立经营，我们不能容许这些资产阶级企业继续自行其是，通过赎买等方式，我们要一步步的实现国家产业的完全国有化。"
  SWE_Nordic_Spark: "北欧星火"
  SWE_Nordic_Spark_desc: "瑞典是作为一个北欧的社会主义政权的形象立于世界的，而非莫斯科乃至所谓共产国际在北欧的代理人。布尔什维克们尽可在那吹嘘国际主义的陈词滥调，但我们必须在大战的前夜做好觉悟，瑞典是北欧无产阶级的未来！"
  SWE_Reconciliation_with_Durumbu: "与杜伦布和解"
  SWE_Reconciliation_with_Durumbu_desc: "杜伦布政权内部的社会主义倾向使得他们有可能对我们的友好协定予以考虑，没有瑞典的庇护他们难以独自面对来自南方的压力。我们应当重新实现合作。"
  SWE_Across_the_strait: "跨过海峡！"
  SWE_Across_the_strait_desc: "是时候了，同志们！遭遇新败的丹麦反动政权已经摇摇欲坠，只要我们的军队跨越海峡，定能一战将日德兰半岛收归我手，是时候为两家于斯堪的纳维亚半岛那旷日持久的恩怨画上休止符了。"
  SWE_Negotiations_with_Norway: "与挪威谈判"
  SWE_Negotiations_with_Norway_desc: "我们已经成为整个半岛无可争议的统治者，唯一一个尚未表明态度的挪威王国想必也已对此胆战心惊，我们没有必要付出无谓的牺牲。"
  SWE_Suomi_problem: "索米问题"
  SWE_Suomi_problem_desc: "东方的芬兰政权长久以来处于苏联政权的军事控制之下，对于一个统一的北欧政权来说这是不可接受的。我们必须要求苏联吐出它在北欧的既得利益，哪怕必要时我们不得不诉诸武力......"
  SWE_Pro_Third_International_Diplomacy: "亲第三国际外交"
  SWE_Pro_Third_International_Diplomacy_desc: "对于共产主义运动来说，瑞典是北欧乃至中欧地区重要却也几乎是唯一的政治与军事存在，我们在国际上的地位是危险的。若我们仍要在日德兰与北海与敌争利，那么就有必要积极争取来自共产国际同志的多方支持。"
  SWE_Economic_exchanges_with_Moscow: "与莫斯科经济交流"
  SWE_Economic_exchanges_with_Moscow_desc: "索米政权的存在使得我们能促成瑞典与莫斯科间更进一步的经济联系，来自俄罗斯的资金与战略资源能够畅通无阻的往来于波罗的海与北陆。而苏联的军事力量对于瑞典来说也是可靠的保障。"
  SWE_Trying_to_merge_with_Suomi: "试图与索米合并"
  SWE_Trying_to_merge_with_Suomi_desc: "索米共和国臣服于苏联统治已经有些年头，但是其民族主义情绪至今仍令克里姆林宫颇为头痛，也许经过协商，我们能够用一些代价换取芬兰地区的统治权，同时以民族主义的方式解决民族主义的问题？"
  SWE_Northern_Fortress_Plan: "计划：北方堡垒"
  SWE_Northern_Fortress_Plan_desc: "魔导国帝国的军事力量显然已经开始威胁到共产主义国际的独立地位，红色阵营与外星人的军事霸权间的冲突一触即发，在战争开始之前，我们必须做好准备，以保证北欧不会被南方军势轻易染指。"
  SWE_Nordic_Storm_Plan: "计划：北欧风暴"
  SWE_Nordic_Storm_Plan_desc: "来自南方的黑色威胁在地球保卫同盟诸国的围剿下大势已去，现在我们可以抽出力量解决斯堪的纳维亚土地上残存的反动势力，统合北欧各民族之于一体，为国际共产主义运动添砖加瓦。"

 #蓝线（战胜线）
  SWE_Christian_Democratic_government: "基督教民主党政府"
  SWE_Christian_Democratic_government_desc: "基督教民主党政府成功带领着瑞典赢得了战争。但这场胜利是建立在妥协与退让之上的。瑞典的分裂已经不可避免，我们能做的唯有在圣女的旗帜下拉拢一派的人心，，至少不要让我们瘸着一条腿地领导这个国家。"
  SWE_Promote_democratic_reforms: "推进民主化改革"
  SWE_Promote_democratic_reforms_desc: "战争的结束意味着将这个国家重建为一个民主国度已经成为瑞典的首要事务。我们必须加紧筹备各地方政府的选举活动。"
  SWE_Work_with_the_left: "与左翼合作"
  SWE_Work_with_the_left_desc: "瑞典的工人阶级声势浩大，他们要求瑞典进一步推进社会福利与劳动法律的议题。除了同意他们的请求以外我们找不到其他能够安抚他们的举措。"
  SWE_Legalize_right_to_strike: "合法化罢工权"
  SWE_Legalize_right_to_strike_desc: "作为瑞典工人阶级呼声最为强烈的要求，共产党希望我们能够将罢工行动立为国内劳动者反对不人道、不实际的恶性压迫行为的正当手段，这意味着瑞典的工人阶级将允许自己争取他们的应有权利。"
  SWE_Protect_workers_rights_and_interests: "保障劳工权益"
  SWE_Protect_workers_rights_and_interests_desc: "将国家分裂了一年有余的社会分裂必须在今天被遏止。通过一系列劳动法律的出炉，劳动者将得到他们所应当得到的东西——稳定的工作、合适的薪资、还有更加良性的竞争机制......"
  SWE_Raise_the_level_of_consumption: "提高消费水平"
  SWE_Raise_the_level_of_consumption_desc: "议会左派要求内阁采取措施解决目前的经济紧缩问题。对于瑞典来说经济危机现在已经无关紧要，我们可以尝试更加激进的金融举措。同时切实的提高瑞典人民的生活质量。"
  SWE_Expand_social_security: "扩大化社会保障"
  SWE_Expand_social_security_desc: "尽管在战前我们确立了基本的社会福利体系，但是困于战争需要这项事业被限制在了一个相当有限的规模内，如今要求者成为了领导者，我们做事不应再束手束脚。"
  SWE_Child_allowance: "儿童补贴"
  SWE_Child_allowance_desc: "要在源头上解决童工问题光靠立法是不够的，我们必须对国内的穷困家庭增发抚育补贴，以此保障千万劳动者家庭的生计问题。"
  SWE_Free_education: "制定义务教育"
  SWE_Free_education_desc: "再穷不能穷教育，国家的未来即系于此事，瑞典将会确保尚未成年的儿童都能享受到最基本的教育服务。"
  SWE_Organize_state_government_elections: "组织州政府大选"
  SWE_Organize_state_government_elections_desc: "各地的地方政府在敦促之下已经准备好组织起地方官僚的行政选举工作。经过对地方血液的常规性更换，我们将能够确保各州政府不会在当地腐败变质抑或是形成地方阻力。"
  SWE_Speech_control_is_unfrozen: "言论管控解冻"
  SWE_Speech_control_is_unfrozen_desc: "瑞典从建国到现在，关于战争、和平、民族的争论一直没有真正的被消灭，乃至在经济危机时造成了几乎不可逆的社会分裂。阻止人意的传播永远是最愚蠢的行为，而我们要做的便是疏浚江河。"
  SWE_The_value_of_freedom: "自由的价值"
  SWE_The_value_of_freedom_desc: "要想民主政府坚如磐石，最根本的举措在于使民众认同“民主”给予他们的东西，这是一个漫长但重要的任务——消灭政治冷感与建立组织认同。"
  SWE_Work_with_the_right: "与右翼合作"
  SWE_Work_with_the_right_desc: "此诚为瑞典最为危险的时刻，工贼叛逆正在一步一步的腐蚀着我们所仰仗的社会传统，绝不能让他们移风易俗的妄想得以实现。我们的手中仍有底牌。"
  SWE_Restructuring_of_trade_unions: "改组工会"
  SWE_Restructuring_of_trade_unions_desc: "作为肆虐着各地的工人运动的总指挥部，工会里的社会主义者正在滥用旧时代所给予他们的“合法权利”，这群虫豸必须被排除出工会体系，取而代之的将会是某些——更保守的人。"
  SWE_Repair_of_churches: "兴修教堂"
  SWE_Repair_of_churches_desc: "如果说“共产主义”是荼毒人民的精神鸦片，那么唯有对天主最虔诚的信仰才是将人民从幻梦中唤醒的良方，我们应当重新拾起在19世纪为我们所放弃的对于天主教的自信。"
  SWE_Doctrine_governs_country: "教义治国"
  SWE_Doctrine_governs_country_desc: "这个国家需要被一个更加有利的社会价值观念所管制，对于无神论者，瑞典必须时刻将他们置于宣传机器的舆论压力下。对上帝的虔诚必须为全体国民奉之为准。这个国家不需要无神论者，就像我们不需要社会主义者一般。"
  SWE_Towards_social_democracy: "迈向社会民主"
  SWE_Towards_social_democracy_desc: "随着民主化的成功推进，瑞典只需要一步便能彻底结束自斯卡哈时代至现在数十年的训政期，一个社会主义的民主政府将在瑞典得到建立，而基督教民主党与它的党魁也将结束它的职责——无论她是否愿意"
  SWE_People_Homeland_Democratic: "人民家园"
  SWE_People_Homeland_Democratic_desc: "旧民主党时期的社会福利事业已经发展到了一定的阶段，而我们则要将其彻底成为瑞典的头等大事。一个完备的去军事化草案已经完成，计划中将被削减的军费将用于大规模的民生建设工程。"
  SWE_Separation_of_church_and_state: "政教分离"
  SWE_Separation_of_church_and_state_desc: "作为世界上少数的仍然遵从天主教地位的国家，瑞典的神职人员一直在国家体系内享有着不容小觑的政治影响力，这种情况必须被中止，一个左翼政府不需要上帝为其背书。"
  SWE_People_Republic: "人民共和国"
  SWE_People_Republic_desc: "我们相信，人民才是一个共和国能够生存于世的柱石，一个民主政府如果不能服务于它的人民，那么即便拥有着无上武力，它终究也只是空中楼阁，瑞典共和国是人民的共和国，所有人都将知道这一点。"
  SWE_Nordic_neutrality: "北欧中立政策"
  SWE_Nordic_neutrality_desc: "瑞典乃至整个北欧都在面临来自外部的直接威胁。但是瑞典没有主动投入这场世界赌局的任何必要。考虑到共和国民生计划正在稳步推进，一个与之相匹配的中立政策可能才是最为妥当的。"
  SWE_Facilitate_trade: "斯堪的纳维亚经济协作"
  SWE_Facilitate_trade_desc: "友邻的经济发展对于整个斯堪的纳维亚半岛的未来起着举足轻重的作用，瑞典也许无法在国际动荡中争得机会，与瑞典的朋友保持联络总是有益的"
  SWE_Dead_lips_and_cold_teeth: "唇亡齿寒"
  SWE_Dead_lips_and_cold_teeth_desc: "我们的力量来自于认同，来自于协作，更来自于团结。世界大战正在迫近北疆，我们可以缩着头捂住耳朵对战火视而不见，但没有人能担保他者的兵锋不会试图越过海峡。在此危机岁月，瑞典诚应与整个斯卡但纳维亚半岛的安危共同进退。"
  SWE_Expand_the_power_of_church: "扩大教会权力"
  SWE_Expand_the_power_of_church_desc: "这个新生的所谓“民主政府”正在各个领域威胁瑞典国立教会在国家中的神圣地位，但我们的声音已不再需要受其节制。温和派无权享受胜利的成果。瑞典将再次成为天主之壁垒，一如往日。"
  SWE_Expand_the_power_of_church_TT: "§Y言峰绮礼§!将成为国家实际领袖，圣女将成为永远的花瓶。"
  SWE_Heaven_on_earth: "地上天国"
  SWE_Heaven_on_earth_desc: "我们的行动是上帝的意指，瑞典的公民都是最为虔诚的忠仆，我们的面前已经不再有需要正视的阻力，只需要稍加运作，一点点的解释和引导，便能让我们的信众意识到上帝正赋瑞典以方面之任。"
  SWE_For_God_sake: "为了天主"
  SWE_For_God_sake_desc: "作为天主教唯一的军事中心，的任务是艰巨的，无法之徒正占据着上帝的乐土，异教徒与宗教异端分子正主导着欧洲绝大部分的地区，以基督之名义，从统一整个斯堪的纳维亚半岛开始，天主的兵锋将指向全世界，十字军来自斯德哥尔摩，主会保佑我等战无不胜！"
  SWE_For_God_sake_TT: "获得对§Y北欧各国§!的战争借口\n且你可以通过§H$territorial_integration$§!的占领法案在$state_integration_at_fifty_compliance$"
  SWE_Recapture_the_English_positions: "夺回英格兰阵地"
  SWE_Recapture_the_English_positions_desc: "英格兰的圣杯王国在当年的浩劫中背离了天主成为了异端过度，如今吾辈整备完全，自当跨越北海征伐列岛。"
  SWE_Recapture_the_English_positions_TT: "获得对§Y圣杯王国§!的战争借口\n且你可以通过§H$territorial_integration$§!的占领法案在$state_integration_at_eighty_compliance$"
  SWE_Recreating_Thirty_Years_War: "再现三十年战争"
  SWE_Recreating_Thirty_Years_War_desc: "北欧曾经在一场声势浩大的宗教战争中南下协助过北德意志民族坚持其基督教信仰，如今不死族盘踞德意志，旧德国又已经沦为了极端民族主义的乐园，是时候让瑞典的十字军再一次跨越哥本哈根了。"
  SWE_Recreating_Thirty_Years_War_TT: "获得对§Y中欧各国§!(§L德意志、火车之国、意大利、卡西米尔、捷克斯洛伐克、宝石之国、波罗的§!)的战争借口\n且你可以通过§H$territorial_integration$§!的占领法案在$state_integration_at_eighty_compliance$"
  SWE_Bridging_East_and_West_Churches: "弥合东西教会"
  SWE_Bridging_East_and_West_Churches_desc: "东罗马帝国灭亡后，俄罗斯——苏联仍然维持着东正教廷在斯拉夫地区的宗教影响力，但大战已经让这匹巨兽筋疲力尽，这是我们完成前辈梦寐以求之目标的机会。两派基督教必须得到统一。"
  SWE_Bridging_East_and_West_Churches_TT: "获得对§Y巴尔干各国、俄罗斯、土耳其、卡兹戴尔§!的战争借口\n且你可以通过§H$territorial_integration$§!的占领法案在$state_integration_at_eighty_compliance$"

 #黑线（战胜线）
  SWE_Nationalist_government: "民族派政府"
  SWE_Nationalist_government_desc: "民族派政府业已得胜，民众大多也对这个新生的国度表示欢迎。现在，这个真正的瑞典人的瑞典已经屹立于世界之林。"
  SWE_Bloodline_supremacy: "血族帝国至上"
  SWE_Bloodline_supremacy_desc: "在这个帝国，有一点是显而易见的，那就是其对于瑞典民族的极端化认同，这恰恰适合将这个帝国彻底改造为瑞典民族叙事的光荣战车。"
  SWE_War_mobilization: "战争动员"
  SWE_War_mobilization_desc: "第一步是建立并强化帝国的动员体系，要想恢复帝国曾经及其方便迅捷的战争动员速度，我们必须在民间做好动员教育与战争宣传工作，让每个瑞典人都明白战争的日常性。"
  SWE_Expand_conscription: "扩大征兵"
  SWE_Expand_conscription_desc: "为了适应帝国长年累月的持续作战传统，我们应当再一次下调我们的征兵标准，以图全民皆兵。"
  SWE_heroism: "英雄主义"
  SWE_heroism_desc: "我们民族的光荣来自于那些名留青史的英雄人物，我们现在的民族宣传也应该仰仗那些能在帝国的战史中留下名讳之人，那些战争英雄将被帝国的子民万世称颂，他们将万古长青。"
  SWE_Dependency_system: "眷属制度"
  SWE_Dependency_system_desc: "血族是帝国军队力量的支柱，血液于帝国军队之重要性不亚于枪炮和餐饮，军营里每名血族兵士的床铺上都应当有两只枕头，帝国为她们送去日夜所需的眷属，寂静深夜中的甜蜜美餐则能为帝国带来胜利。"
  SWE_Establish_slavery: "建立奴隶制"
  SWE_Establish_slavery_desc: "帝国的胜利为血族带来了无上权威，任何胆敢反抗的异族都将被毫不留情地处理掉，对外族进行奴役已然成为帝国子民生活之日常。不过，我们仍需赐予这些外族正式的奴隶身份以彰显帝国的正义和仁慈，好让她们感激涕零地为帝国服务。"
  SWE_Strict_hierarchical_society: "严格等级社会"
  SWE_Strict_hierarchical_society_desc: "在这个帝国内，只有真正的瑞典裔帝国公民才应该享有完全的社会权利，在此基础上，通过对不同民族进行严格的管制措施，我们可以节省可观的社会资源以用于培养优秀的帝国公民。"
  SWE_Nationalist_propaganda: "民族主义宣传"
  SWE_Nationalist_propaganda_desc: "让这个国家安然渡过经济危机与二次战争的最大良方便是瑞典人自身的民族自豪感，我们应当对此加大力度，加强瑞典民族叙事对于公民价值观的塑造，以培养帝国内部的社会凝聚力。"
  SWE_War_fanaticism: "战争狂热"
  SWE_War_fanaticism_desc: "帝国所奉行的乃完全的实力至上主义，彰显实力的最好办法便是征服！帝国不需要和平主义者，我们唯一需要的是永远进取，永远冲锋在帝国战争第一线的勇士。我们渴望战争！"
  SWE_Expulsion_of_opponents: "驱逐反对者"
  SWE_Expulsion_of_opponents_desc: "左翼政治团体的抗议活动已经持续了数月之久，帝国对于这些异见者已经忍无可忍，在他们正式开始冲击帝国的政治秩序之前，我们有必要将其予以最终解决。"
  SWE_The_revival_of_empire: "帝国的复兴"
  SWE_The_revival_of_empire_desc: "穆尔奈特，血族帝国，在伟大女皇卡莲·艾露维希娅斯治下重现昔日荣光，帝国军队攻无不克、百战百胜；帝国政府公正廉明、上下一心；帝国社会臣民生活富足、民族自信团结。瑞典民族找回了百余年前统治波罗的海沿岸的荣光，强盛的帝国向世人昭告自己的复兴。"
  SWE_State_Military_Industry: "国家军事工业"
  SWE_State_Military_Industry_desc: "帝国需要一个基本的军事工业体系来进行军队建设，再此基础上我们将开始兴建数个专门用于军事生产的工业集群。"
  SWE_Start_war_machine: "开动战争机器"
  SWE_Start_war_machine_desc: "现在是好好利用瑞典的城市化成果的时候了，帝国将在这些宝贵的建筑用地上建立起一个庞大的战争工业体系，帝国的战车即将正式启动。"
  SWE_All_for_sake_of_war: "一切为了战争"
  SWE_All_for_sake_of_war_desc: "与其他国家不同，帝国自古以来便有着以战养战的军事传统，当战争陷入僵局的时候，我们有理由要求国内动用一切资源来支援战事，苦一苦人民，这是为了帝国的胜利。"
  SWE_Issuance_of_war_bonds: "发行战争债卷"
  SWE_Issuance_of_war_bonds_desc: "帝国的军费相比于我们的邻居来说可谓捉襟见肘，要筹集足够的军费，我们必须利用好人民的战争热情——并且将热情化为实际的战争资金。"
  SWE_Military_industrial_complex: "军工复合体"
  SWE_Military_industrial_complex_desc: "通过将军工企业与各地地方政府建立起直接的合作渠道，我们可以将军事工业的发展置于国家发展的同步轨道，让帝国与他的战争机器实现血肉交融的联合。"
  SWE_Produced_for_the_state: "为国家生产"
  SWE_Produced_for_the_state_desc: "帝国公民所进行的生产活动其能也只能为帝国的事业服务，我们必须向本国国民传达这样一个信号：为了国家的光荣而进行的生产也是光荣的，帝国也以那些为帝国军队保驾护航的工人们为骄傲。"
  SWE_Innovative_production_equipment: "创新生产设备"
  SWE_Innovative_production_equipment_desc: "我们应当将生产工具的迭代视为重心，因为工具的发展意味着能有更多的预备役投入帝国军队。"
  SWE_New_military_industry: "新建军事工业"
  SWE_New_military_industry_desc: "相比于大陆其他强权，我们的军事工业体系仍然太过薄弱，有必要将经城市化项目所诞生的可用区划尽可能的用于兴建军事工业。"
  SWE_The_rise_of_militarism: "军国主义崛起"
  SWE_The_rise_of_militarism_desc: "对于这个曾经要求连年征战的军事帝国而言，其军国主义的大行其道几乎是必然的，在这辆战争机器面前，它的选择可谓多样——只看它愿意将战争进行到何种地步。"
  SWE_Conquistador_League: "征服者同盟"
  SWE_Conquistador_League_desc: "南方的魔导国正在为了寻求新的社会秩序而寻找着盟友，我们与他们的意见有着不少相似之处——至少与他统一战线能让我们不再缺乏战争。"
  SWE_DVL_SWE_communicated: "魔导国-瑞典交流"
  SWE_DVL_SWE_communicated_desc: "魔导国拥有着大量的军事科技，但其军事领导层缺乏在地球表面进行作战的经验，我们可以就此进行双向的交流合作"
  SWE_Northern_Fortress: "北方要塞"
  SWE_Northern_Fortress_desc: "随着魔导国陷入多方作战，我们的敌人可能会试图染指日德兰半岛甚至威胁哥本哈根，有必要在北海建立起一道专门用于防御海上入侵的静态防线。"
  SWE_Embrace_DVL_culture: "接纳魔导国文化"
  SWE_Embrace_DVL_culture_desc: "魔导国的先进不仅仅体现在军事上，他们在科技、理念、价值观念上的超前性对于帝国来说几乎都是可以汲取的养分，这不是自惭形秽，而是我们对魔导国文化的有益吸收。"
  SWE_Together_we_will_win: "共赴胜利"
  SWE_Together_we_will_win_desc: "我们的联盟坚不可摧，在魔导国征服世界的道路上，帝国的精锐之师将会时刻在战争中发挥举足轻重的作用，没有东西能够阻止德意志与北海的联合，让我们共赴胜利！"
  SWE_Bloodline_hegemony: "血族霸权"
  SWE_Bloodline_hegemony_desc: "帝国的目标很简单——将瑞典人的荣耀传至四海。帝国绝不会投身于无意义的战争，经过一场决定性的较量，帝国将重建它在整个北海的霸权，并将斯堪的纳维亚半岛的威势辐射至整个世界。"
  SWE_Bloodline_fiefdoms: "建立血族封地"
  SWE_Bloodline_fiefdoms_desc: "中央政府不愿，也无力管辖帝国政府的庞大地区，通过将血族显贵分封至各地，我们能够在遥远的帝国边疆与难以节制的庞大地域实现遥控管理。"
  SWE_Bloodline_fiefdoms_tt: "我们将在我们的卫星国建立§Y血族封地§!"
  SWE_Annihilation_of_Red_October: "湮灭红十月"
  SWE_Annihilation_of_Red_October_desc: "东方的苏维埃俄国长久以来一直威胁着波罗的海沿岸，现在强弱之势此消彼长，是时候向东用兵了。"
  SWE_Conquer_the_continent: "征服大陆"
  SWE_Conquer_the_continent_desc: "偌大的欧洲大陆此时正陷入自相残杀之中，而我们无需顾及后方，可以毫无顾忌的举兵西下，从北德意志开始，整个欧罗巴大陆都将落入帝国之手。"
  SWE_Sweeping_the_UK: "席卷英伦"
  SWE_Sweeping_the_UK_desc: "北岸的圣杯王国拥有着广袤的殖民地和庞大的势力范围，帝国没有精力在多个战场与其鏖战，但若是我们能够登陆其本岛，那么圣杯霸权的崩溃也只是时间问题。"
  SWE_Rule_Scandinavia: "统治斯堪的纳维亚"
  SWE_Rule_Scandinavia_desc: "帝国征服的第一步自然是统一整个斯堪的纳维亚半岛。"
  SWE_Go_south_to_Copenhagen: "南进哥本哈根"
  SWE_Go_south_to_Copenhagen_desc: "杜伦布在卡尔马之战中丢失了绝大部分有生力量，现在他们只能困守哥本哈根，但考虑到的魔导国也在对日德兰半岛虎视眈眈，外面的当作要尽可能地迅速。"
  SWE_Go_south_to_Copenhagen_TT: "获得对§Y[DEN.Getname]§!的战争借口\n且你可以通过§H$territorial_integration$§!的占领法案在$state_integration_at_fifty_compliance$"
  SWE_East_out_of_Oslo: "西进奥斯陆"
  SWE_East_out_of_Oslo_desc: "西方挪威王国深陷国家混乱之中，一直未能建立起一只具有威胁性的防御部队，征服他们对于帝国来说易如反掌。"
  SWE_East_out_of_Oslo_TT: "获得对§Y[NOR.Getname]§!的战争借口\n且你可以通过§H$territorial_integration$§!的占领法案在$state_integration_at_fifty_compliance$"
  SWE_Go_west_to_Helsinki: "东出赫尔辛基"
  SWE_Go_west_to_Helsinki_desc: "东方的索米政权正夹在我们与苏联的势力范围间，虽然某种程度上来讲它可以成为我们的缓冲带，但考虑到俄国人可能捷足先登，而我们则必须先发制人。"
  SWE_Go_west_to_Helsinki_TT: "获得对§Y[FIN.Getname]§!的战争借口\n且你可以通过§H$territorial_integration$§!的占领法案在$state_integration_at_fifty_compliance$"

 #战败线通用国策
  SWE_Emergency: "紧急状态"
  SWE_Emergency_desc: "旧政府已经停止运作，目前全国都陷入了全面瘫痪的状态，现在必须在全国范围内实行戒严，此诚为国家的至暗之时。"
  SWE_army_entered_the_city: "军队进入城市"
  SWE_army_entered_the_city_desc: "好在，军队在处置了旧政府人员之后没有过多发难，他们现在已经宣布听从我等号令，在局势走向彻底崩溃之前，我们需要这些纯粹的军人力挽狂澜。"
  SWE_Organize_the_government: "组织政府"
  SWE_Organize_the_government_desc: "为了逃避清算，斯卡哈政府的领导队伍绝大部分已经悉数逃亡，而文官政府也已经彻底破产，当务之急是马上在斯德哥尔摩招募行政人员，一切以重建临时政府为要务。"
  SWE_Temporary_Officer: "临时官员"
  SWE_Temporary_Officer_desc: "在斯德哥尔摩，我们已经勉强立起一个足以管理全国的中央政府，但这场骚乱已经蔓延至全国，我们必须继续在全国组织行政官员的培训与任命。"
  SWE_Organize_production: "恢复农业生产"
  SWE_Organize_production_desc: "在稳定好全国局势后，接下来的任务是重新组织起全国范围内的农业生产，此乃百万民众衣食所系之事，绝不可怠慢。"
  SWE_Restart_the_factory: "重启工厂"
  SWE_Restart_the_factory_desc: "大量的轻重工业在骚乱中陷入了停摆，没有这些工厂生产的工业品这个国家将无法恢复正常。对于需要恢复机能的企业国家会拨款进行援助。已经随着混乱而失去归属的破产企业则由我们进行暂时运营。"
  SWE_Back_to_normal: "重归正常"
  SWE_Back_to_normal_desc: "谢天谢地，这个国家就目前来说——恢复了最基本的机能，但这场失败带来的社会创伤也许是我们需要花费数十年才能平复的。"

 #红线（战败线）
  SWE_Akeuchi_Yuu_Government: "明内幽政府"
  SWE_Akeuchi_Yuu_Government_desc: "明内幽主席以出色的领导能力和充满智慧的远见思想，成功带领瑞典人民共和国从第二次杜瑞战争悲剧造成的混乱中挣扎而出，瑞典社会的运行虽然重归秩序，但数十年来积累的民族自信和发展成果已被深深的绝望和经济萧条取代。向往星空的少女们，正在积极地重组红色政权。散发着星空般迷人气质的领袖，正在带领瑞典人民重振精神，重新拾起乐观与理想，向未来进发。"
  SWE_Swedes_you_have_to_be_confident: "瑞典人，你要自信"
  SWE_Swedes_you_have_to_be_confident_desc: "“我们的瑞典祖国有丰饶的物产、有多彩的文化、有聪慧勤劳的人民，斯堪的纳维亚是我们曾经不可分割的领土。诚然，收服故土的战争冒险对瑞典的复兴造成了巨大的创伤，但我们相信，瑞典的问题都说得清、瑞典的问题都有解法。欧洲正有一股黑色的火焰在日益升腾，世界将迎来巨大变革，瑞典人，你要自信，瑞典一定能走出自己的道路，实现自己的复兴。”"
  SWE_Expand_livelihood_projects: "扩大民生项目"
  SWE_Expand_livelihood_projects_desc: "战争的创伤和社会的混乱让瑞典人民无心关注生活以外的事，糖果、饮料和各类生活消费品的充盈能实打实地提高幸福感，不公与贫穷可不是共产主义该有的样子。"
  SWE_Strengthen_foreign_trade: "强化对外贸易"
  SWE_Strengthen_foreign_trade_desc: "瑞典的劳动人民从大地中采掘的矿物、在工厂中制造的机械，即使在圣杯和幻想乡这样的国家也称得上品质上乘。充满远见的明内幽主席在视察时说过，与其让资源被投入波罗的海或腐烂在仓库里，不如出售给有需要的国家，让工人们找外国资本家拿工资。"
  SWE_Expand_public_welfare: "扩大公共福利"
  SWE_Expand_public_welfare_desc: "为了让每一位孩子能够在早餐时吃上抹着黄油的面包，为了让每一个家庭都能在节假日自信地走进商场、影院享受生活的美好，为了让瑞典人民摆脱饥饿、寒冷、劳累的困扰，我们致力于扩大社会的公共福利。国家的财富来自瑞典人民的劳动，也将回馈给为瑞典崛起付出努力的人民。。"
  SWE_Increase_power_of_trade_unions: "提高工会权力"
  SWE_Increase_power_of_trade_unions_desc: "斯德哥尔摩的议会厅上插着象征革命和解放的红旗，但这面旗下的瑞典共产党还不能亲力亲为地解决每一起劳资争端，我们会放手让工人组织的工会为仍受压迫的工人们争取利益，使工厂的生命力再度蓬勃起来。"
  SWE_Reform_of_Democratic_Assembly: "改革民主议会"
  SWE_Reform_of_Democratic_Assembly_desc: "叛国者斯卡哈统治瑞典的数十年间，民主议会有名无实，不过是选择哪一派政治团体传达独裁者指令的工具。要让真正人民的代表坐上议席，让人民的议会有权决定国家的航向行动。明内幽相信，瑞典人民从不掩饰自己对美好生活的向往，瑞典人民会做出正确的选择。"
  SWE_Local_self_government: "地方自治"
  SWE_Local_self_government_desc: "瑞典国土颇为狭长，除去斯德哥尔摩周边，大量城镇地区之间都被森林河流阻隔起来，由国家统一进行发展规划显然不太现实，不如将选择决定权交给地方，让各地区自己负责发展，中央政府进行宏观调控，好好休养生息一番。"
  SWE_Look_up_at_stars: "仰望星空"
  SWE_Look_up_at_stars_desc: "我们生活的土地上，争端正在平息，饥饿与死难逐渐远去。人民最基本的需要已经满足，深夜城市的灯光渐熄时，闪亮的星空吸引了越来越多人的目光，想要探索天空之外世界的情绪正在高涨，当我们触及星空之时，人民也将步入远视共产主义的未来。璀璨的群星中，有想去的地方！"
  SWE_Plan_Sunset_rockets: "计划：夕阳火箭"
  SWE_Plan_Sunset_rockets_desc: "想要触摸星空，不能指望奇异魔幻的魔法魔术，一飞冲天的火箭最符合瑞典的条件。从最简单的钢铁火箭起步，终有一天，我们会在夕阳下、波罗的海灯塔旁，伴随火箭的焰华进入梦想的遥远之地，向世界传达少女们的声音。"
  SWE_Technologists_enter_government: "技官进入政府"
  SWE_Technologists_enter_government_desc: "明内幽主席认为，技术官僚在远视主义政府中应当具有主导地位，这有利于瑞典科技的发展进步，辩证且实事求是的技官远比只会空谈和纸面工作的官僚们更适合管理国家，科学与生产力能解决一切问题。"
  SWE_Stockholm_Institute: "斯德哥尔摩研究所"
  SWE_Stockholm_Institute_desc: "梦想的实现需要脚踏实地的工作，奔向宇宙的少女们组成了庞大的研究团队，现有的研究设施已经难以满足理论和工程研究，斯德哥尔摩将有一座全新的研究中心拔地而起，足以支持全国的研究学者和技术人员全力投入到自己的项目中。"
  SWE_Enable_advanced_production_mode: "启用先进生产模式"
  SWE_Enable_advanced_production_mode_desc: "瑞典现行的产业生产模式还远不足以支持探索星空所需的资源生产效率，为了触及星空的梦想，明内幽主席宣布即刻在全国启用一套天才般的，充分平衡了效率与公平的先进生产模式。"
  SWE_Bold_leaders: "大胆的领导者"
  SWE_Bold_leaders_desc: "无创新则无未来，发明创造凝聚科学与思辨，技术变革领导建设和发展，瑞典的未来在呼唤敢于创新的劳动者和领导者，请摒弃一切束缚，大胆地追寻心中的梦想，在最美好的前途面前鼓起勇气，不让自己留下遗憾。"
  SWE_Let_your_dreams_fly: "放飞梦想"
  SWE_Let_your_dreams_fly_desc: "社会的全面进步带来了瑞典的空前发展，从货架上崭新的商品到研究所里的新锐火箭产线，瑞典人民的曾经遥不可及的梦想正在一步步实现。这片土地上，我们所生活的地球上，自智慧诞生以来，从来不曾断绝过的梦想-触摸星空的梦想，将被我们实现，凝结着人民智慧和汗水的火箭会带着梦想突破天空和引力的束缚。"
  SWE_Starry_sky_sensing: "星灵感应"
  SWE_Starry_sky_sensing_desc: "宇宙，我们最后的边疆，地球，我们永远的摇篮。从来不曾被证实过的天外世界、从未有地球人亲眼见过的母星全貌，或许常有人怀疑星空的真实，但在某个晴朗的星夜，瑞典人民睡梦中的失重感十分强烈，银河、群星、地球与月亮清晰地出现在意识里，星辰织成的画布呼唤着梦想触及星空的人。宇宙，是为了到达而存在的！"
  SWE_Feet_on_ground: "脚踩大地"
  SWE_Feet_on_ground_desc: "星空迷人，星辰璀璨，宇宙浩瀚，突破天际进入太空的梦想固然远大且美丽，但人民生活和世界局势让我们不得不收起珍藏的火箭，为大地上更现实的事情付出智慧和行动。"
  SWE_Poverty_alleviation: "扶贫攻坚战"
  SWE_Poverty_alleviation_desc: "瑞典人民虽已普遍处于国家福利保障之下，但广大的乡野地区仍有为生活穷困而发愁的人，作为社会主义者，清除瑞典社会的贫困，即便付出一生也在所不惜。"
  SWE_Eliminate_bourgeoisie: "消灭资产阶级"
  SWE_Eliminate_bourgeoisie_desc: "杜瑞战争的阴影曾经遮蔽到社会多个方面，顾及到经济恢复发展的需要，我们没有彻底地革资产阶级的命，现在这些资产阶级遗毒是时候选择成为劳动者还是沦为阶下囚了。"
  SWE_Trade_union_representation: "工会代议制"
  SWE_Trade_union_representation_desc: "工会的力量在党和劳动者支持下得到空前增强，工会将成为国家政治主体，取代民主议会，我们把地方权力交到工人手中，使试图通过议会阻碍革命进行的顽固分子完全失败。"
  SWE_Economic_decentralization: "经济去中心化"
  SWE_Economic_decentralization_desc: "国家发展以往被独裁者或利益团体把控的危险一去不复返了，经济发展的决策和资源分配权现在不再由某个部门垄断拥有，各个地区都可以集中自身力量投入发展，自主保卫我们的红色政权。"
  SWE_Protecting_farmers: "保护农民"
  SWE_Protecting_farmers_desc: "瑞典的农田分散割裂，农民群体也势单力薄，在各个城镇已经普及电气设施时，田地里的劳作仍然需要依靠一人一把镰刀；一年的收成依旧十分仰赖自然晴雨有度。为了保护农民和每天餐桌上都有面包的权利，我们组织起农业合作社，并赋予合作社与工会平等的权力。"
  SWE_the_commune_produced_autonomously: "公社自主生产"
  SWE_the_commune_produced_autonomously_desc: "工会与合作社，统称为“公社”的组织，作为经济发展主体存在于瑞典的生产单位，不仅要履行发展经济的职能，还要自我组织、自我革命，彻底地实现群众组织自治化。"
  SWE_Proletarian_paradise: "无产阶级天堂"
  SWE_Proletarian_paradise_desc: "在斯堪的纳维亚半岛上，有每天都可以吃黄油白面包的地方；有不存在任何阶级剥削和压迫的土地；有无产阶级生活得自由又快乐、富足且公平的国家。瑞典在脚踏实地的社会主义明内幽政府领导和步调一致的全体人民建设下成为了公认的无产阶级天堂，接下来将要上演的是朝着梦想奔跑，少女们闪闪发光的青春故事！"
  SWE_Rapprochement_with_Denmark: "与杜伦布和解"
  SWE_Rapprochement_with_Denmark_desc: "百年来瑞典与杜伦布的战争造成了无数悲剧，卡尔马地区经历一个世纪的易手和发展早已成为杜伦布的核心领土，我们将遵守1910年的条约，同时放弃这片土地的宣称，寻求与杜伦布的和解。武力称王的时代已经过去，宁静祥和的未来是我们所有人的期冀。"
  SWE_Peace_and_development: "和平与发展"
  SWE_Peace_and_development_desc: "与杜伦布的和解使北欧地区洋溢着久违的乐观与和平气息，人民放下旧日的仇恨，展望光明的未来。瑞典的大多数人都坚信，我们已经迎来了和平与发展的新时代。"
  SWE_Friends_rather_than_master_servants: "朋友而非主仆"
  SWE_Friends_rather_than_master_servants_desc: "数百年来，北欧各个地区的人民经历了多次彼此征服的轮回，强大的盟主、国王奴役统治波罗的海沿岸的文明，我们要宣告，平等友好的朋友关系才是北欧的未来。"
  SWE_Nordic_Free_Trade_Area: "北欧自贸区"
  SWE_Nordic_Free_Trade_Area_desc: "纵使海洋河流阻隔、山脉密林遮掩，北欧各国人民之间的联系也从未断绝，外部强敌环伺，国际市场的竞争日益激烈。大萧条的浪潮虽已远去，但从长远来看，彼此开放市场是北欧增强经济实力免于国际市场波涛冲击的必要措施。"
  SWE_Nordic_Community: "北欧共同体"
  SWE_Nordic_Community_desc: "我们已经向世人做出了表率，瑞典与杜伦布的友好关系极大地促进了两国的发展，东方与西方的邻国也因自贸区的建立而关系日益紧密，北欧各国人民之间的隔阂广泛消弭，是时候向朋友们发出明内幽主席的邀请，请和瑞典组成永远的北欧共同体吧！"
  SWE_Release_the_dove_of_peace: "放飞和平鸽"
  SWE_Release_the_dove_of_peace_desc: "欧洲大陆上最黑暗最邪恶最贪得无厌的势力-魔导国已经覆灭，威胁欧洲乃至世界和平的最大不安定因素已经被清除，在和平如星夜照耀欧洲的当下，我们庆祝和平、我们珍惜和平、我们维护和平，希望世界重归友好，向着地球的未来前进。"
  SWE_Start_Nordic_integration_agenda: "开启北欧一体化议程"
  SWE_Start_Nordic_integration_agenda_desc: "北欧诸国的经济、文化、社会已经紧密的联系在一起，仰望星空，这片土地上的人民已如银河中的繁星团结在一起，将北欧诸国统合为一体，只是临门一脚，我们将首先发起倡议，好好商讨统一的北欧国家的未来。"
  SWE_Choosing_a_side: "选边站？"
  SWE_Choosing_a_side_desc: "以圣杯为首的民主国家阵营和以苏联为首的共产国家阵营已经成为欧洲两极，双方的关系日益剑拔弩张起来，珍贵的和平难以维系，战火又将席卷欧洲乃至世界。即使我们已经统合了北欧地区，力量也还是太过弱小，也许选择一方作为我们的后盾才能守护北欧人民的未来免受侵害。"
  SWE_nonalignment: "不结盟"
  SWE_nonalignment_desc: "星空大地之间一定有北欧人民的立足之地，维护和平是北欧人民不懈的追求，北欧人民会以自己的方式、自己的力量保卫来之不易的和平，向全世界呼吁不结盟的行动，并以自身为表率调解世界的纷争。"

 #复辟线（战败线）
  SWE_Kristian_Restoration: "克里斯蒂娜复辟"
  SWE_Kristian_Restoration_desc: "斯拉蒂用了二十年证明了她的草台班子破败不堪，这个建立在复仇主义之上的四不像政权已经寿终正寝。此乃拨乱反正。为了上帝与国王！"
  SWE_Great_Northern_Alliance: "大北方同盟"
  SWE_Great_Northern_Alliance_desc: "1523年的瑞典疆域离我们似乎已十分遥远，但若是能重新恢复瑞典王国在北欧大陆的支配地位，我们便有资本重新挑战北海之外的军事威胁。"
  SWE_Atlantic_Strategy: "大西洋战略"
  SWE_Atlantic_Strategy_desc: "我们必须在陆地上重新成为北海无可争议的话事人，为此重掌旧卡尔马联盟疆域乃是必要之举。"
  SWE_Revenge_for_Kalmar: "越过海峡"
  SWE_Revenge_for_Kalmar_desc: "杜伦布在卡尔马取得的第二场胜利证明了他们有足够的能力久据南斯堪的纳维亚的领土。瑞典不需要另一次孤注一掷，我们要做好全面战争的准备。"
  SWE_Reunite_Norway: "重新联统挪威"
  SWE_Reunite_Norway_desc: "虽然挪威地区承平日久，但正因如此他们始终未能建立起可堪重任的防卫力量。在外部势力再次图谋北欧之前，有必要在西方重新建立来自斯德哥尔摩的直接控制。将北国团结在一顶王冠之下！"
  SWE_European_Royal_Alliance: "欧洲皇室联盟"
  SWE_European_Royal_Alliance_desc: "欧洲正被两个意识形态之间的冲突所撕裂，但他们不过是一丘之貉。近两百年来在斯堪的纳维亚乃至整个欧罗巴发生的政治变动是极其失败且血腥的，在合适的时候结束他们便是应行之事。"
  SWE_Eastern_Front_Strategy: "东线战略"
  SWE_Eastern_Front_Strategy_desc: "在东方发生的政治动荡为王国的扩张提供了一个机会，无论是重建对芬兰的附属统治，还是与其再结秦晋之好，我们都需面对其可能导致的可怕后果。"
  SWE_Conquer_Somi_again: "再征服索米"
  SWE_Conquer_Somi_again_desc: "我们不能坐视红色芬兰彻底倒向俄罗斯人，尽管这会使我们直接面临来自东方的军事压力。但收复芬兰之役当尽快提上日程。"
  SWE_White_Guard_Alliance: "白卫军联盟"
  SWE_White_Guard_Alliance_desc: "早在俄罗斯内战时期我们便不遗余力地为白卫军芬兰提供全面支持，战后更是有大批难民来到我国以寻求政治庇护，如今其重掌芬兰政权，这也许能为我们之间的政治乃至军事合作提供一个契机。"
  SWE_Restart_Great_Northern_War: "重启大北方战争"
  SWE_Restart_Great_Northern_War_desc: "昔日俄帝国军势庞大，纠集诸逆以围君上，瑞典亦能数战而力挫诸侯。如今北欧一统，天命攸归，罗斯chi fei以区区之数，以何阻我雄狮之军？既居北境之主，当一尝沙皇之冕！"
  SWE_Economic_recovery: "经济复苏"
  SWE_Economic_recovery_desc: "战败与全国性的戒严为王国的经济带去了灾难性的后果，现在已经重建基本的经济秩序，我们应当进一步整顿糜烂的国内经济。"
  SWE_Drive_market_recovery: "推动市场复苏"
  SWE_Drive_market_recovery_desc: "经济发展的关键之一就是是交易活跃，而要想恢复交易，就得有一个稳定而强大的市场。随着女皇陛下着手恢复经济，我国市场上的商品数量逐步增多，但市场仍未得到更好的发展，这种不配套会影响众多企业投资人对我国市场的信心，因此，我们必须出台措施，推动市场进一步复苏发展，让更多的企业加入进来。"
  SWE_Decentralized_capitalists: "放权资本家"
  SWE_Decentralijuzed_capitalists_desc: "“钱不会说话，它们轻声细语”，金钱从始至终都是国家发展最不可或缺的部分，女皇的诸多事业也需要大量资金的投入。但如今，我国最有钱的资本家们却顾虑再三，不肯拿出钱来资助女皇陛下的事业。但我们可以给她们一定的权力参与到经济中去，让他们获取最关键的红利，那么，她们将为我们慷慨解囊。"
  SWE_Royal_Enterprise: "皇家企业"
  SWE_Royal_Enterprise_desc: "王室被斯卡蒂逐出瑞典之时，其将王室旗下众多皇家企业收归国有，但好在，其中的绝大多数产业仍作为国有资产留存，如今应当将他们重新纳入国王的控制中。"
  SWE_Nordic_monarchy: "北欧君主制"
  SWE_Nordic_monarchy_desc: "北欧君主制的复辟同时证明了政治极端主义与复仇主义的失败，不过陛下此前尚未有从政经验，为其指点迷津方为重中之重。"
  SWE_Dictatorship_of_Monarchy: "君主专政"
  SWE_Dictatorship_of_Monarchy_desc: "君主绝不可再放权于代议机关。“人民的智慧”曾一手将斯卡蒂那样的疯子搬上舞台。为此保皇党应当坚持训政地位，作为国王的手足便宜行事。"
  SWE_The_Kings_Cabinet: "国王的内阁"
  SWE_The_Kings_Cabinet_desc: "陛下尚且年幼不暗政事，当务之急是从原有的临时政府内选出足够忠城的王国命官组织起新届内阁。确保政令皆出于国都。"
  SWE_The_Kings_Guard: "国王亲卫军"
  SWE_The_Kings_Guard_desc: "保皇党目前得到了军队的大力拥护，不过要确保王室的威严与国王的安全，我们仍需要一支强大的卫队以国王的名义拱卫王室。"
  SWE_king_is_only_one: "国王独尊"
  SWE_king_is_only_one_desc: "我们所重建的绝非是另一个斯卡蒂政府，它并非建立在妥协与团结之上，而是出自专断与权威之下。也许国王仍会为这个忠于她的国家机器感到无所适从，但这不重要，保皇党人就是这般纯粹的东西，天生是为了国王的权威而服务的!"
  SWE_group_to_establish_constitutional_government: "组建立宪政府"
  SWE_group_to_establish_constitutional_government_desc: "当今经济混乱，主少国疑，当以团结国民为首要之举，当迫君上重开参院，拨乱反正，择一良臣组阁以渡多事之秋。如此则王国幸甚。"
  SWE_Election_of_Prime_Minister: "选举首相"
  SWE_Election_of_Prime_Minister_desc: "在斯卡蒂僭位之时，时任内阁曾辞位解散以明忠属。今山河复明，当重新接纳他们，并选出一位德高望重之士统领大局。"
  SWE_Continue_democratic_reforms: "继续民主改革"
  SWE_Continue_democratic_reforms_desc: "不能再让斯卡蒂这样的独裁者以神明之位独断专行。我们将彻底敲定瑞典新的宪政体制，确保王国不会因一个疯子的振臂一呼而国业尽隳。"
  SWE_Nordic_lighthouse: "北欧灯塔"
  SWE_Nordic_lighthouse_desc: "我们将作为传统价值观的阵地立于北境，瑞典的皇冠将庇护万千人民免受政治极端主义的威胁。无战则已，若战祸将至，瑞典当率铁铸之军，领北境之民，以力止戈。"

 #维京线（战败线）
  SWE_Viking_Legion_is_in_power: "维京军团掌权"
  SWE_Viking_Legion_is_in_power_desc: "背信弃义的神明受到了该有的报应，她们夸下海口要恢复瑞典的故土，却再次惨败于南方的强盗们，我们再也不能相信这些无能之辈了。好汉能自救，高贵的维京勇士们将重新竖起大旗，带领瑞典人民重返故土，夺回荣耀。"
  SWE_Viking_reconquest: "维京再征服"
  SWE_Viking_reconquest_desc: "在历史上，高贵的维京人曾经脚步遍布大北方，我们的殖民地横跨大洋，海对岸的人们要么战战兢兢的和我们开展贸易，要么被我们所征服。如今，沉眠的维京之魂已经被我们所唤醒，重返故土的时机已到，起帆！孩子们！"
  SWE_Return_to_homeland: "返回故土"
  SWE_Return_to_homeland_desc: "远离家乡虽好，但家乡最好。维京勇士渴望着征服与侵略，但如果我们没能收复故土，那死在异国他乡也只是毫无意义。生命有终尽，为名可不朽,向家的方向冲锋吧，勇士们，如果我们成功了，这将是当代最伟大的奇迹，你们也将成为最伟大的传奇。"
  SWE_Surprise_attack_on_Gotland: "奇袭哥德兰"
  SWE_Surprise_attack_on_Gotland_desc: "哥德兰岛是哥德兰人的居所，而哥德兰人很早很早之前就臣服在瑞典的旗帜之下，但如今，一伙日耳曼人霸占了我们的土地，还大言不惭的以所谓“复国”之名赖着不走，她们也只是另一群侵略我们家园的强盗，和杜伦布渣滓没什么区别，对付这些强盗，我们就得收起大旗，给她们来点出其不意的惊喜。"
  SWE_Conquest_of_Jutland: "征服日德兰"
  SWE_Conquest_of_Jutland_desc: "在我们重返故土的事业成功后，杜伦布人卷着尾巴逃回了日德兰半岛，试图在那个弹丸之地苟延残喘。但别忘了，每个时代都有自己结束的那一天，杜伦布人的时代已经结束了，此刻的历史以及未来都属于维京勇士，我们必须跨过海峡去，彻底消灭她们的一切，只有这样，才能让我们的子子孙孙都能永葆和平。"
  SWE_Revival_of_North_Sea_Empire: "北海帝国复兴"
  SWE_Revival_of_North_Sea_Empire_desc: "历史上的北海帝国因过度分权而在诸多野心中分崩离析，昙花一现。很多人甚至就此妄言北欧的时代已经结束。但维京勇士回来了，我们收复了故土，夺回了我们的应许之地，原先林林总总的瑞典人已经集结在维京大旗之下，诸神保佑，历史已经见证维京人的荣耀就此归来。"
  SWE_Revival_of_Viking_tradition: "维京传统复兴"
  SWE_Revival_of_Viking_tradition_desc: "事到如今，瑞典人的惨败已经证明了所谓的唯一真神，君权神授都是谎言，都是厚颜无耻的君主们为了维护她们所谓的权力集中向一神教作出的妥协，这些谎言麻痹了勇敢的战士们，让我们的人民安于服从，却失去了尚武的传统。这些该死的谎言必须被推翻，维京人的传统必须被重新树立。"
  SWE_Warrior_education: "战士教育"
  SWE_Warrior_education_desc: "在历史上，维京人以卓越的军事能力和独特的征服原因而闻名于世，虽然时代已经改变，枪和炮成为了新时代的主宰，但传统的战争策略以及战争传统在北欧的土地上却不会褪色，想要重返故土，就得让我们的子民们重新温习传统的维京战士教育，引入如马术、举重、摔跤等对抗类的游戏，我们将重新唤醒瑞典人心中的维京之魂。"
  SWE_Viking_longship: "维京长船"
  SWE_Viking_longship_desc: "作为维京历史的重要部分，维京船只以独特的船只设计和优越的造船技术著称，在复兴传统的过程中，我们也将把这一传统继承到我们的设计中去，为了重返故土，并恢复我们对外的贸易，我们将重视起船只设计和建造，让我们重新成为海洋的主宰。"
  SWE_Viking_warriors: "维京勇士"
  SWE_Viking_warriors_desc: "我们是峡湾之子，我们从自北方而来，洗劫那些异教徒的财富，然后带回我们的家乡。在维京勇士的血脉里，我们刚韧如剑，渴望探险，渴望鲜血，我们无所不畏，以一敌百，庸人们将会惧怕于我们的无情和残暴，要么服从，要么死亡。"
  SWE_Second_Viking_Age: "第二次“维京时期”"
  SWE_Second_Viking_Age_desc: "在历史上，我们的脚步遍布大半个欧洲，我们的龙船所到之处，沿海的各国都会惊惧于我们的力量，甚至称呼我们是魔鬼降临，四海到处都是我们的生存空间。时代已经改变，但维京勇士已经归来，我们将让欧洲人再次体会一下她们先辈所感受过的我们的“热情”，如果她们受不了，她们大可搬到内陆去，把海洋让给我们。"
  SWE_Revival_of_Viking_natural_economy: "复兴维京自然经济"
  SWE_Revival_of_Viking_natural_economy_desc: "在很多人的刻板印象里，维京人只是会洗劫的海盗，但我们也是优秀的贸易者，我们的祖辈们是最好的渔夫和猎人，我们的手工产品也曾在欧洲大地上流传，维京人将把过去的的辉煌带回现在，我们将拥抱自然的灵魂，喂饱我们的民众"
  SWE_Tribalization: "部落化"
  SWE_Tribalization_desc: "如果文明真的像她们所说的那么强而有力的话，那么我们就不会败给杜伦布，松散的所谓神之政府在战争面前什么都不是，而现在我们是整个瑞典的主人，我们将把我们的统治方式带给她们，我们将重建维京诸部，考察我们的血脉与思想，返璞归真，世人将在我们的重塑中领会到像维京人一样生活是多么精彩"
  SWE_Small_farmsteads: "小型农庄"
  SWE_Small_farmsteads_desc: "农业是人类生存的根本，我们寒冷的土地上很难赠予我们足够的食物喂饱我们的每一位勇士，神之政府强迫人民为战争竭尽全力，却忘却了饿肚子的勇士是打不赢仗的现实，但我们不会。我们会在部落之内建设农庄，我们的人民将在部落的土地上产出她们所需要的粮食，并在自然的生活与饮食中重返野性之魂。"
  SWE_Family_Council: "家族议会"
  SWE_Family_Council_desc: "现代文明对维京传统的一大原罪就是它摧毁了我们本应保持的家族传统，在所谓的文明之下，我们不再彼此忠诚，我们的公平正义被千里之外不熟悉的所谓法官所裁决，我们的孩子们叛逆而压抑，以后再也不会这样了。我们会重建传统的家族议会，从今往后，家族将成为瑞典这片土地上新的基础组织，血脉将把我们再次连为一体。"
  SWE_Reboot_Troubadour: "重启游吟诗人"
  SWE_Reboot_Troubadour_desc: "历史需要被流传，我们绝不能让我们的传统再一次被所谓文明被埋没，为此，我们需要新的方法来保存我们的历史，传播我们的影响。而历史上正好有一个职业能够流传我们的故事和诗歌：游吟诗人，她们是上好的歌手，她们的音乐正好能够传颂我们的尚武精神与勇士气魄"
  SWE_Reestablish_original_faith: "重建原始信仰"
  SWE_Reestablish_original_faith_desc: "过去，我们拥抱了所谓文明、稳定、秩序的一神信仰，但这并未带来所谓的荣耀，只让我们在南方的杜伦布人面前丢盔弃甲，一败再败，让我们背井离乡，蒙受耻辱。败者的神明不值得称颂，从今往后，我们会把旧神的雕像推倒在地，重新建立维京人的信仰，瑞典人需要明白，神灵存在于万物之间，我们要做的是称颂它们，赞美它们，我们将重新领悟自然之法则。"
  SWE_Praise_to_Valhalla: "赞颂英灵殿"
  SWE_Praise_to_Valhalla_desc: "啊，瓦尔哈拉，我们的天堂，每当我们的勇士们光荣赴死，他们的灵魂就将升华于此，超脱世俗的禁锢，拥抱英灵殿的荣光，在这里，他们将得到奥丁的致意，得到众多神明的尊敬，他们将大口喝酒、大口吃肉，获得与我们的神明共赴诸神之黄昏的资格。作为最高级、最虔诚的战士，我们的勇士们将从英灵殿之中明悟战争的道理，我们将以勇敢为无上美德，以战死为无上光荣。为神赴死，就是我们维京人的至高法则。"
  SWE_Praise_to_Valhalla_TT: "§L§Y$SWE_Odin_idea$§!、§Y$SWE_Thor_idea$§!、§Y$SWE_Hela_idea$§!、§Y$SWE_Brynhild_idea$§!、§Y$SWE_Gilda_idea$§!、§Y$SWE_Valkyrie_idea$§!将被整合为§Y$SWE_The_Aesirs$§!§!"
  SWE_Blessed_by_gods: "诸神祝福"
  SWE_Blessed_by_gods_desc: "超脱凡性，拥抱神之赐福。在我们虔诚与勇敢的行动之下，英灵殿诸神已经注视到了我们，来自奥丁、索尔、芙蕾雅等诸神的赐福如今已经加之于吾辈。接下来，我们必须踏上血与火之征途，欧罗巴的文明们将在人世之间迎接一场诸神黄昏，维京勇士的野蛮咆哮将再次让我们的敌人们为之战栗！"
  SWE_Blessed_by_gods_tt: "§Y永久获得英灵殿的将领§!"

 #德瑞关系
  SWE_Deepening_German_Swiss_relations: "深化德瑞关系"
  SWE_Deepening_German_Swiss_relations_desc: "曾经的德意志或许只是海峡对面的强权，是牵制劲敌手段，但新势力的崛起，其无法抑制的攻击性让瑞典的核心利益受到了巨大的威胁，也许我们应该更进一步，唇亡齿寒之事不应由我们的错误导致。"
  SWE_Establish_Friendship_University_of_GER_SWE: "成立瑞德友谊大学"
  SWE_Establish_Friendship_University_of_GER_SWE_desc: "国与国之间的交往从来都没有友谊之说，只有价码之别，但这并不意味着没有需要证明友谊的需要，证明友谊本身就是价码的一部分，或许友谊大学不能带领友谊，但它一定能带来价值。"
  SWE_Reception_of_Germany_refugees: "收留德国难民"
  SWE_Reception_of_Germany_refugees_desc: "德意志的崩溃本就只是顷刻之间，而在残酷统治下已然踏上逃亡之路的难民或许才是真正热爱德意志的人，虽然我们并非他们的祖国，但他们热情依旧能在刻意的引导下为我们所用。"
  SWE_invite_Germany_mechanics: "邀请德国技工"
  SWE_invite_Germany_mechanics_desc: "德意志的土地陷入沦陷，德意志的人民四处逃窜，只需要我们略施小计就能获得强权尸体上撕下来的美味，而且是正大光明毫无舆论压力的获得，毕竟我们是为了德意志的友谊，德意志的人民，不是吗?"
  SWE_add_to_AXIS: "加入轴心国"
  SWE_add_to_AXIS_desc: "旧的强权刚刚倒下，新王就开始蠢蠢欲动，所谓的霸主已然陨落，世界已然面目全非，我们不能再坐视新王一步步走上它的加冕之路，更不能让它踏着我们的尸体加冕，我们需要团结一切力量，获得那群最坚定反抗者的支持，在新王称帝前斩下它的头颅。"
  SWE_Tear_up_treaty: "撕毁条约"
  SWE_Tear_up_treaty_desc: "原以为德意志经历不过是一场叛乱，租借的土地不过是临时所为，但没想到，不可一世的德意志崩溃得竟然如此之快，那当时签订条约可就成为了一次错误的决定了，不过条约嘛，不就是撕碎时才有他的价值。"
  SWE_Blockade_of_Gotland: "封锁哥得兰"
  SWE_Blockade_of_Gotland_desc: "疲兵之计一直是战争史上一个经久不衰的战术，不过对于一个身处岛屿，毫无外援的敌人而已，疲兵只需要封锁即可。"
  SWE_Prepare_for_landing_operations: "准备登陆作战"
  SWE_Prepare_for_landing_operations_desc: "军队开始集结，物质开始调配，严密的训练以保证士兵的战斗力，繁忙的港口预示着充足的后勤，准备好一切只为千里决胜。"
  SWE_Initiating_conflict_in_Gotland: "启动哥得兰冲突"
  SWE_Initiating_conflict_in_Gotland_desc: "骰子已经掷下！为了复取此处我们已准备数月，一支为夺取哥德兰组建起来的登陆部队目前刚刚就位，但需注意，我们必须在冲突扩大前结束战事，没人希望双方在这片小岛上大动干戈。"
  SWE_Establish_Sweden_Academy_of_Sciences: "组建瑞典科学院"
  SWE_Establish_Sweden_Academy_of_Sciences_desc: "无论时光荏苒，岁月变迁，科学总是一个国家能否立于潮头的重要武器。我们有必要在真正威胁到瑞典的大战来临前为我们的战争科技奠定基石。哪怕风浪稍歇，国家的建设与发展亦系于此。"


