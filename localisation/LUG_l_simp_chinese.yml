 LUG_War_of_GRE_ITA: "第二次伟大战争"
 LUG_War_of_GRE_ITA_desc: "今天，历史又一次重演。敌人越过了他们的边境，进攻我们的土地，屠杀我们的人民。在历史上，我们失败过很多次。但这次，我们绝不会失败！"
 LUG_Arise_warriors: "紧急动员"
 LUG_Arise_warriors_desc: "向人民发布紧急动员，一步也不许后退，我们的身后就是祖国！"
 LUG_Fantasy_Township_never_surrenders: "先制吞并保加利亚"
 LUG_Fantasy_Township_never_surrenders_desc: "保加利亚在巴尔干长期中立，但我们知道，它这次逃不过战火。因此，我们决定先吞并它，这样我们就可以像保护祖国一样保护它。"
 LUG_Only_whole_people_united_we_lead_to_victory: "迫使意大利白和"
 LUG_Only_whole_people_united_we_lead_to_victory_desc: "如果你不能让他们感受到光，就让他们感受到热。拉丁蛮子在我们的国境上肆意妄为，可他们无法突破我们的防御。吃痛的拉丁蛮子终于意识到：只要露格尼卡的人民团结一致，我们就战无不胜！"
