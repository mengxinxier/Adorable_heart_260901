#人物
 LUG_Subaru_desc: "昴是一个拥有运动员体格的高个子黑发、棕瞳男孩。长相一般，由于他的三白眼，看起来目光凶恶，初次见面外表就会给别人留下坏人的印象。经常穿着被召唤到异世界时所穿的那件运动服，其他着装还包括在罗兹瓦尔宅邸工作时的执事服，与艾米莉娅的骑士授勋仪式时所穿的纹有罗兹瓦尔家纹的骑士服，还有女装时穿的黑色礼裙和在奥古利亚沙丘时的沙漠行装。"
 LUG_Subaru_desc_1: "§Y菜月昴§!\n§Y死亡回溯§!\n  - 政治点数：§G+15.00%§!\n  - 计划加成上限：§G+10.00%§!\n  - 计划速度：§G+15.00%§!"
 LUG_Subaru_Diplomacy_desc: "§Y菜月昴§!\n@GRE§Y[FROM.Getname]§!的§C骑士§!\n\n§Y死亡回溯§!\n  - $MODIFIER_POLITICAL_POWER_FACTOR$：§G+15.00%§!\n  - $MODIFIER_MAX_PLANNING$：§G+10.00%§!\n  - 计划速度：§G+15.00%§!"
 
 LUG_Subaru_desc_2: "§Y菜月昴§!\n§Y死亡回溯§!\n  - 政治点数：§R-15.00%§!"
 LUG_Subaru_2_Diplomacy_desc: "§Y菜月昴§!\n@GRE§Y[FROM.Getname]§!的§C骑士§!\n\n§Y死亡回溯§!\n  - $MODIFIER_POLITICAL_POWER_FACTOR$：§R-15.00%§!"

 LUG_Subaru_desc_3: "§Y菜月昴§!\n§Y死亡回溯§!\n  - 政治点数：§R-50.00%§!"
 LUG_Subaru_3_Diplomacy_desc: "§Y菜月昴§!\n@GRE§Y[FROM.Getname]§!的§C骑士§!\n\n§Y死亡回溯§!\n  - $MODIFIER_POLITICAL_POWER_FACTOR$：§R-50.00%§!"

 LUG_Karsten_desc: "库珥修是位威风凛凛的女士，她深绿色的头发留到背部中央，用白色蝴蝶结在末端绑住。她高挺的鼻梁很漂亮，有着琥珀色的双眸。虽然她有着柔和的面容，但表情比较严肃，给人以精悍的印象。她的身材很好，但平时喜欢男装打扮。当她穿礼服温柔地微笑时，她给人的印象大为不同。"
 LUG_Karsten_desc_1: "§Y库珥修§!\n§Y视风的加护§!\n  - 陆军经验增长：§G+10.00%§!\n  - 骑兵攻击：§G+10.00%§!\n  - 骑兵防御：§G+10.00%§!"
 LUG_Karsten_Diplomacy_desc: "§Y库珥修§!\n@GRE§Y弗利艾·露格尼卡§!的§C青梅竹马§!\n\n§Y视风的加护§!\n  - 陆军经验增长：§G+10.00%§!\n  - $MODIFIER_CAVALRY_ATTACK_FACTOR$：§G+10.00%§!\n  - $MODIFIER_CAVALRY_DEFENCE_FACTOR$：§G+10.00%§!"

 LUG_Emilia_desc: "很重视约定，十分反感违约的行为，对艾米莉娅来说，「约定」代表着爱与信任，是非常重要的东西。\n在别人都相信昴不会有事的情况下，只有艾米莉娅知道昴一个人的时候会感到孤独，会哭泣。她经常说古语，甚至过去与她一起生活的福尔图娜都想知道她是从哪里学来的。\n艾米莉娅的座右铭是「一生努力」，也一直努力成为更好的自己，并且想要成为一个合格的国王。如今她王选的理由已经不仅仅是当初为了解救艾力欧尔大森林的同胞们了，在圣域篇后她追求公平的愿望显得愈发强烈，不仅仅是要消除血统隔阂，而是想要消除所有不平等。"
 LUG_Emilia_desc_1: "§Y爱蜜莉亚§!\n§Y银发半精灵§!\n  - 非核心人力：§G+10.00%§!\n  - 核心领土攻击：§G+5.00%§!\n  - 核心领土防御：§G+5.00%§!"
 LUG_Emilia_Diplomacy_desc: "§Y爱蜜莉亚§!\n@GRE§Y露格尼卡最高苏维埃§!的§R主席§!\n\n§Y银发半精灵§!\n  - 非核心人力：§G+10.00%§!\n  - 核心领土攻击：§G+5.00%§!\n  - 核心领土防御：§G+5.00%§!"
