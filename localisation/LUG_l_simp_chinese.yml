 LUG.8.t: "来自蕾姆的告白"
 LUG.8.d: "正当菜月昴的精神崩溃时，去找蕾姆想要逃走自我否定时。\n蕾姆对他说雷姆是有多少高兴，想必就算是昴也一定不会知道\n——雷姆相信。 无论有怎样辛苦的事情，就算昴看上去就要输了。 就算世界上谁也变得不相信昴，就算连昴自己也变得不相信昴了——雷姆也会，相信\n有雷姆。 昴救下来了的雷姆，现在就在这里\n有雷姆。 只要是昴的话，不管什么都会听的。 想要去听\n从这里，开始吧。 从一……不对，从零！ \n谨遵，受命。 若是如此昴——雷姆的英雄，就能笑着迎接未来的话"
 LUG.8.a: "蕾姆不能和昴一起逃走，因为，未来的事，如果不是笑着说可不行哦"
 LUG.8.a.desc: "§C菜月昴的精神状态重置为§G100§!§!"

 LUG.9.t: "弗利艾·露格尼卡逝世"
 LUG.9.d: "整个露格尼卡王室因为某未知疾病病死，剩下的贵族大臣们都惊慌失措，不确定与神龙的盟约是否依旧有效，因为神龙的盟约是与王室签订。此时王国内忧外患，内部经济危机，外部保加利亚帝国可能乘虚而入。虽然王国及时与保加利亚签订了临时的互不侵犯条约，但并不是长久之计。为了解决没有国王的窘境，龙历石预言了会有五位龙之巫女出现参与王选，胜出者将成为新的国王更新盟约。\n确定候选人的方式是通过王室的传家宝——镶嵌龙珠的徽章，当候选人拿着它时，徽章就会发出红光。在寻找了一年的候选人后，只找到了五位中的四位，直到最近莱茵哈鲁特·范·阿斯特雷亚意外发现了贫民窟内的第五位，菲鲁特。\nps:由于除爱蜜莉亚线以外的其他路线并没有做完，所以将自动跳过选举的细节开启爱蜜莉亚线"
 LUG.9.a: "我们正在走向新的未来"

