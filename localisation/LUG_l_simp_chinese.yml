#设定
 #GRE_Local_History_Title: "希腊（露格尼卡）地区设定"
 #GRE_his_page_01_title: "变革之新风"
 #GRE_Country_History_Page_01: "希腊人、或者说露格尼卡人，就在他们以为百年的痛苦终于画上了句号时，命运却再次和他们开了一个残酷的玩笑——一个新的噩耗震惊了整个王国：国王离世，可却膝下无嗣。一时间，整个王国内部暗流涌动，国内的各大势力与国外的敌人都磨肩擦掌，准备夺取他们失去的一切。\n可就在这个新生的王国即将因内战分崩离析时，露格尼卡王国再次创造了奇迹——王国内的权臣与贤人们齐聚王都，并且共同宣布了“选王制度”的诞生。从此之后，任何国王的子嗣都不能理所应当地获得继承权，王国的继承者将从五位拥有声望、地位与能力的候选人选出。\n“选王制度”的诞生让露格尼卡王国真正步入了一个崭新的时代，可这场变革还是来得太晚，来得太温和了。放眼世界，西欧的文化启蒙与一场魔法与科技的深入融合革命正如火如荼地进行着。圣杯王国、德意志帝国、幻想乡共和国…这些新崛起的霸权每一天都在拓展着自己的势力范围——不进则退，就是这个时代无比残酷却最为正确的准则。"
 #GRE_his_page_02_title: "擦肩而过之灾难"
 #GRE_Country_History_Page_02: "当列强们将世界瓜分得所剩无几之时，人们便在计算着一场“终焉之战”到来的日子。可当那一天真的来临，人们却才意识到在时代的洪流面前，自己的力量弱小得多么微不足道。伟大战争的爆发，震撼了整个欧洲与世界。而对于露格尼卡王国来说，这场战争无异于一架驶向地狱的末班车——要不要上车，结果都只有死亡。\n战争的爆发使列强在露格尼卡王国的投资极速缩水，王国赖以生存的农业、矿业与旅游业都受到了毁灭性的打击。而更糟糕的是，王国最大的敌人，奥斯曼帝国的继承者，公然扬言要加入德意志帝国的同盟，夺回他们的“伊斯坦布尔”。一时间，露格尼卡王国从上到下一片哗然，人们在深夜不敢入睡，大量流民逃离君士坦丁堡，生怕这里成为与突厥人对峙的战争前线。\n在边境冲突频发，全面战争局势一触即发时，圣杯王国时任首相赫伯特•阿斯奎斯终于接受了露格尼卡国王的请求，公开宣布“圣杯王国将不惜代价地保护中立国免受战争的威胁”。突厥人最终退却了，他们想起了数百年前的巴尔干梦魇，并且暂时放下了他们的野心——\n于是乎，露格尼卡王国与伟大战争的灾难擦肩而过，相比战后颓废的欧洲与纷纷崩塌的霸权帝国，露格尼卡王国奇迹般地躲过一劫，并且在战后迎来了一段宝贵的发展期。"
 #GRE_his_page_03_title: "晦暗不明之前路"
 #GRE_Country_History_Page_03: "时值1936年，露格尼卡王国再次迎来了命运的时刻——老国王驾崩，新一届王选在即。面对国内猖獗的魔女教恐怖分子、经济全面崩溃、愈演愈烈的精灵歧视与混乱的外交环境，五位国王候选人提出了截然不同的解决方案——而王国命运的决定权，此刻交到了你的手中，露格尼卡王国到底是走向伟大还是淹没于历史的尘埃，全由你来决定。\n出发，掌握你的命运！"
 #GRE_loca_his_t_01: "爱琴海之子"
 #GRE_history_page_01: "希腊文明，发源于欧洲东南部巴尔干半岛南端。这里岛屿众多，海岸线漫长，河流湍急，境内多山，缺乏开阔的平原。不论是从地形还是气候来看，这里都不是适合文明生存与发展的风水宝地。\n可就是在这样的环境里，人们硬是凭借着他们的智慧和毅力，在奇迹与魔法的帮助下开辟出了一片理想的生存空间——在鼎盛时期，希腊文明的威名从爱琴海到地中海无人不知、无人不晓。希腊文明哺育的骄子们垄断了大半个地中海的贸易，无数的黄金伴随着人们的敬意源源不断地流入了伯罗奔尼撒半岛的土地。\n贸易的发达同时催生了希腊人思辨的智慧与文化的繁荣，希腊文明为当时晦暗的欧洲点亮了文明的明灯，让来自各地的人们见证了不同的族群、不同的文化所共同演奏的和谐唯美的乐章。雅典，希腊文明的中心，在当时便有“爱琴海的宝珠”之美喻。而在雅典生长起来的希腊人们，便是不折不扣的“爱琴海之子”。"
 #GRE_loca_his_t_02: "征服之剑"
 #GRE_history_page_02: "然而，这样完美的希腊文明并非铁板一块。在希腊文明蒸蒸日上，人们沉浸在雅典宏伟的宫殿与舒适的生活时，挑战却也接踵而至——长期居住于山地的斯巴达城邦奉行着与雅典城邦截然相反的行事准则，他们粗犷、暴戾、残忍，对于一切雅典的文明嗤之以鼻。最后，愤怒爆发了，战争接踵而来。在这一场没有胜利者的战争中，斯巴达人奄奄一息，雅典城毁于一旦。可真正的敌人，却才刚刚到来——\n当罗马人翻山越岭征服了希腊后，他们的失望是显而易见的——这里没有他们美梦里的金山银山与繁荣富饶，只剩下了一片残垣断壁。罗马人在雅典留下了他们的誓言：\n“我们会延续你们的文明，而且会比你们做得更好！”"
 #GRE_loca_his_t_03: "帝国之殇与抵抗之火"
 #GRE_history_page_03: "诚然，罗马人做到了——他们打造帝国，巩固集权，终结了希腊的分裂，并且将统治拓展了整个地中海。人们怎么都不可能想到——如此庞大的帝国，竟也有土崩瓦解的的一天。\n突厥人的新月弯刀划破了帝国最后一丝幻梦，皇帝殉国，国家沦丧。而更糟糕的还在后面——突厥人公开宣布希腊文明的死刑，他们来自一个完全不同的世界，信奉着与希腊人截然不同的信仰与原则。希腊人这次没能用文明征服征服者，他们第一次真正意义上地沦为了奴隶与囚徒，只能在哀叹中仰人鼻息，收拾文明仅剩的一点残片。没有人说得清楚是哪个希腊人第一个举起了反抗奥斯曼帝国的大旗，但所有人都清楚——只要希腊还有一天处于突厥人的暴政之下，他们的反抗就会持续一天。帝国的镇压越是残酷，希腊人的抵抗就越是激烈。\n“我们失败了一次，又失败了第二次，难道还要失败第三次吗？”\n奥斯曼帝国的统治者是贪婪的，他们征服了君士坦丁堡，征服了巴尔干，可他们并不满足于此——他们要跨过巴尔干的群山，前往广袤的欧洲平原，去建立属于他们的罗马。\n可他们忘了，他们从来不是罗马。当帝国苏丹面对维也纳的城墙与奋起反击的基督徒们时，他只觉得太过可笑。帝国的伟业，决不能就此停息。帝国的征伐从未停息，可情况却在悄然起着变化——从那位被后世以“狮子王”尊称的年轻人接过希腊的反抗之火时，他要做的，只是让这把火烧遍整个希腊。"