##人类
  culture_Gensokyo_Human: "§Y人类§!-§C幻想乡人类§!"
  culture_Gensokyo_Human_desc: "世代定居在结界内部的本土农耕与城镇居民。他们聚集在人间之里，依靠神明与博丽巫女的庇护维系日常运转。尽管凡人的肉体在面对超自然威胁时显得脆弱，但他们对故土与传统的执着、繁衍潜力以及不可或缺的信仰基石，构成了整个幻想乡生态的稳定支柱。"
  culture_Lunarian_Noble: "§Y人类§!-§Y月之民§!"
  culture_Lunarian_Noble_desc: "自远古时期便迁徙至月球背面的超凡人类后裔。月之民视地上的万物与生死轮回为极度污秽的剧毒，构筑起高度隔绝且不染纤尘的超古代纯净文明。他们以无暇的白玉宫阙与高傲的冷漠著称，俯视地界的一切冲突，仅在纯净受到外来威胁时展现降维般的无情铁腕。"
  culture_North_German: "§Y人类§!-§g北德意志人§!"
  culture_North_German_desc: "栖息于低地平原、易北河畔以及波罗的海沿岸的北德意志民众。深厚的普鲁士军政参谋传统与严谨的容克工业秩序深深烙印在他们的血脉中。他们擅长组织庞大高效的近代工业机器与高纪律装甲陆军，以冷峻的条理性和绝对的执行力驱动战线推进。"
  culture_South_German: "§Y人类§!-§C南德意志人§!"
  culture_South_German_desc: "扎根于阿尔卑斯山谷、巴伐利亚高原与多瑙河流域的南德意志居民。相较于北方的机械化严整，他们更依恋天主教巴洛克式的传统文化、山地步兵的坚韧与工坊匠心。崇山峻岭锤炼了他们顽强的防守意志，在保卫家园与自治领地时展现出极高的凝聚力。"
  culture_Maitetsu_Human: "§Y人类§!-§C御一夜人§!"
  culture_Maitetsu_Human_desc: "伴随铁道汽笛与沿线工商业兴起而繁盛的御一夜近代市民。从车厂机务段工人到隈元银行的金融商人，他们深信钢铁轨道所连接的贸易与协作能够重塑世界。这群务实的工匠与铁路职工极为擅长高强度基建铺设与精密调度，是前线后勤网最高效的维系者。"
  culture_Fontainian: "§Y人类§!-§C枫丹人§!"
  culture_Fontainian_desc: "源于原始胎海祝福、在正义与律法审判下获得真正血肉的廷露之民。枫丹人拥有高度繁荣的近代蒸汽工业文明与精密法理体系，崇尚优雅的戏剧审美与契约精神。得益于律偿混能与动能发条技术的成熟运用，他们在高端科研、军工标准化生产与海洋基建方面拥有极高的天赋，能以高度机械化的工业产能支撑现代化战争。"
  culture_Gamindustri_Human: "§Y人类§!-§C游界居民§!"
  culture_Gamindustri_Human_desc: "居住在紫耀之都及各工业大都会中的近代市民阶层。得益于女神带来的高次元信息科技与轻量化工业，游界人享有发达的娱乐、电子产业与自动化生活。他们崇拜自己的守护女神，对国家充满纯粹的向心力，但在面对残酷的地缘血腥屠杀时，往往缺乏足够的冷酷心理准备。"
  culture_Jioral_Human: "§Y人类§!-§R吉欧拉尔人§!"
  culture_Jioral_Human_desc: "继承了吉欧拉尔王国森严封建体制的传统人类定居者。在国王与教会的长期灌输下，他们坚信人类是万物的主宰，并自命为抵御魔族与异端的第一线。其社会阶层分明，军规残酷严苛，骑士阶层极为擅长使用铁血手腕镇压被占领区，是维系伊比利亚南部与腹地封建动员的基本盘。"
  culture_Briton_Arthurian: "§Y人类§!-§B不列颠人§!"
  culture_Briton_Arthurian_desc: "宣誓效忠于白亚之城卡美洛的纯正不列颠王国居民。在骑士王阿尔托莉雅的崇高誓约与公正律法庇佑下，他们恪守谦逊、荣誉与牺牲的崇高骑士道德。其社会虽处于神代神秘逐步衰退向人代过渡的破晓期，但凭借高度训练的近卫长弓手、封建骑士扈从与坚韧的城防工程，是不列颠岛上最坚实的主权骨干。"
  culture_Kivotos_Student: "§Y人类§!-§C基沃托斯学员§!"
  culture_Kivotos_Student_desc: "头顶神秘光环、兼具神性本质与青春活力的学园自治区武装女高中生。光环赋予了她们极其强悍的物理伤害耐性与自愈力，即使直面轻武器扫射与迫击炮轰击也仅会感到轻微擦伤。凭借高度自治的学园理事会体质、与生俱来的枪械本能以及源自崇高神秘的技术科研力，基沃托斯学员能够以极低的步兵战损和凶悍的巷战火力，在战线建立起令人咋舌的青春武装阵线。"
  culture_North_Italian: "§Y人类§!-§C北意大利人§!"
  culture_North_Italian_desc: "世代生息在波河平原、威尼斯水系与阿尔卑斯南坡的北意大利居民。这里是近代文艺复兴与重工业机械的摇篮，工匠传统与近代资本工商业高度发达。凭借菲亚特式的汽车工坊、军械铸造厂以及四通八达的水陆交通，他们擅长组织精密机械化师团与海军后勤体系，是亚平宁半岛战时工业与科技研发的核心引擎。"
  culture_South_Italian: "§Y人类§!-§O南意大利人§!"
  culture_South_Italian_desc: "根植于两西西里旧地、地中海海湾与干旱丘陵地带的南意大利民众。他们历经诺曼、拜占庭与西班牙王朝的漫长洗礼，对土地、虔诚天主教与本土家族氏族怀有极为固执的忠诚。尽管工业基础相对薄弱，但炎热山峦锤炼了其坚忍耐劳的性格与凶悍的近身缠斗技巧，在宗族号召下能爆发出惊人的动员人力与顽强的游击韧性。"
  culture_Baharuth_Imperial: "§Y人类§!-§g巴哈斯人§!"
  culture_Baharuth_Imperial_desc: "在‘鲜血帝’吉克尼夫雷霆铁腕统治下的中央集权化军国臣民。帝国彻底清洗了腐朽弄权的旧贵族阶层，建立起依靠帝国魔法学院与常备职业化骑士团维系的高效官僚军政体制。得益于大魔法师福鲁达的技术革新，魔法在此被全面下放于农业生产、土木基建与军械标准化。纪律森严的帝国正规军不仅战术素养极高，更对皇权抱有绝对的盲从与敬畏，是以绝对秩序推动扩张的精锐兵团。"
  culture_Slane_Theocracy: "§Y人类§!-§Y斯连人§!"
  culture_Slane_Theocracy_desc: "奉六大神为至高信仰、自诩为整个人类种族最后庇护所的狂热神权国度。在最高神官长与六色圣典的暗中操盘下，教国推行极端的‘人类至上主义’，视亚人与异形种为必须肃清的污秽宿敌。得益于六大神遗留的秘宝装备与神代传承，教国培育了精通谍报、斩首与特种死斗的六色圣典特战军团，全体国民拥有无与伦比的宗教凝聚力与防御韧性，是为捍卫人类存续不惜动用一切灭绝性禁忌手段的神权铁壁。"
  culture_Danish: "§Y人类§!-§C杜伦布人§!"
  culture_Danish_desc: "生息于日德兰半岛与西兰海岛的原住北欧斯堪的纳维亚臣民。他们历经卡尔马联盟瓦解的血火洗礼，又在无情的海潮沉陆天灾中死里逃生。多舛的命运与周边列强的争端催生了其极度崇尚自保与武装中立的政治传统。作为共和国的基石人口，他们既维系着传统的农业、渔业与商业海运，又在面对地缘压迫时展现出如北欧坚冰般的顽固防御韧性。"
  culture_Norwegian_Refugees: "§Y人类§!-§O挪威人§!"
  culture_Norwegian_Refugees_desc: "在本土因圣杯战争与狂暴魔法潮汐沦陷后，翻越斯堪的纳维亚雪山退守瑞典边境的维京遗民。在漫长而残酷的流亡生涯中，他们唤醒了古老的北欧猎龙与驯龙秘术，成功将栖息于峡湾绝壁与极北冻土的野生飞龙驯化为忠实战友。依靠独特的皮鞍索具与骨制哨音，这群剽悍的北境猎手不仅精通极寒滑雪与山地伏击，更组建起了令敌军步兵胆寒的飞龙掠袭空骑编队。这股狂暴的空中死斗战力既是瑞典抵御魔灵的第一道空中天堑，也是挪威人矢志收复峡湾故土的终极王牌。"
  culture_Swedish: "§Y人类§!-§C瑞典人§!"
  culture_Swedish_desc: "生息于斯堪的纳维亚半岛东部与波罗的海沿岸的北欧强悍之民。自古斯塔夫撕碎卡尔马联盟、卡尔十二世御驾远征起，瑞典人便将尚武传统与严谨的线列纪律刻入骨髓。尽管在连番大战与地质异变后霸权不再、境内亦涌入了流亡挪威人等杂居势力，但他们依旧坐拥优质的北方铁矿、林业资源以及自给自足的军工制造体系。瑞典线列步兵与近代国防军素以高组织度、坚韧的阵地战素养以及极端气候下的顽强作战意志著称。"
  culture_Suomi: "§Y人类§!-§C索米人§!"
  culture_Suomi_desc: "生息于波的尼亚湾东岸千湖之国与广袤原始泰加林深处的不屈北境之民。在大北方战争与列强扩张的夹缝中，索米人养成了内敛沉默却韧如坚钢的‘希苏’坚忍意志。面对周边斯拉夫庞然大物与魔潮异变的威胁，他们依托纵横交错的沼泽冰湖与密林，将滑雪机动、精准狙击以及‘莫洛托夫’游击战术发挥到了极致。任何胆敢踏入芬兰冻土的进犯者，都将在漫无边际的白色死神与林海伏击中耗尽鲜血。"
  culture_Zhcted_Baltic: "§Y人类§!-§C吉斯塔特人§!"
  culture_Zhcted_Baltic_desc: "生息在波罗的海沿岸城镇、农庄与重工矿区的世俗平民阶层。他们历经德俄两大帝国的反复割据与圣杯战争的浩劫，在广泛的地下抵抗运动中磨砺出了强烈的民族自决意识。作为共和国绝大多数的纳税者、工厂劳工与常备军兵源，他们既疲惫于大赦神权教义的精神束缚，又对战姬领主的封建割据深恶痛绝。"
  culture_Ukrainian: "§Y人类§!-§C乌克兰人§!"
  culture_Ukrainian_desc: "生息在第聂伯河两岸黑土平原上的东斯拉夫民族。在十月革命爆发前，他们承受着沙皇帝国的同化与地主盘剥；而在沙俄崩溃后，新生的乌克兰大公国沦为圣杯势力的缓冲傀儡与流亡白军的寄生之所。乌克兰人既保留着哥萨克传统的桀骜骑术与林原游击智慧，又深陷在底层黑土农民的贫困与苛捐杂税之中。他们对彼得格勒的复辟妄想毫无眷恋，面对列强干涉军的冷酷统治与东境苏维埃工农法令的暗中渗透，整片黑土地正暗潮汹涌，时刻准备用手中的弯刀与步枪夺回属于自己的民族命运。"
  culture_Russian: "§Y人类§!-§R俄罗斯人§!"
  culture_Russian_desc: "生息于东欧平原与辽阔西伯利亚冻土之上的斯拉夫巨灵之民。在圣杯战争的溃败与十月革命的暴风雨后，他们亲手将腐朽的罗曼诺夫王朝埋葬，并在“东方小个子魔女”列宁的领导下唤醒了炽烈的红色信仰。从旧军队的残破瓦砾中重生的苏维埃战士，展现出了令整片欧陆列强胆寒的牺牲精神与大纵深攻坚韧性。凭借对极端严寒的绝对耐受力、近乎无限的动员潜能以及工农集体主义的钢铁意志，俄罗斯人正化作扑向西方旧秩序与帝国主义干涉军的滔天赤潮。"
  culture_Caucasian: "§Y人类§!-§O高加索人§!"
  culture_Caucasian_desc: "盘踞在黑海与里海之间、险峻大高加索山脉裂谷中的强悍山岳部族。他们长期在奥斯曼、波斯与沙俄帝国争霸的夹缝中保持着桀骜的独立与古老部族荣誉，民风剽悍尚武、视刀剑如生命。他们凭借出神入化的险峰攀爬、近身匕首白刃战与精准山地狙击，令任何试图控制这条欧亚咽喉的机械化集团军在悬崖峭壁间寸步难行。"
  culture_Romanian: "§Y人类§!-§O罗马尼亚人§!"
  culture_Romanian_desc: "生息于喀尔巴阡山弧与多瑙河下游平原的达契亚罗马遗民。他们夹在东欧红潮、巴尔干乱局与黑海咽喉的十字路口，历经多重帝国的拉扯，养成了精明务实且极度顽强的生存哲学。依托普洛耶什蒂珍贵的黑金油田与喀尔巴阡山脉的天然屏障，罗马尼亚人构建起了足以令列强觊觎又忌惮的自卫国防军。在群山密林与古老吸血鬼传说的庇护下，他们深谙山地伏击、堑壕拉锯与焦土防御，既不愿沦为西方阵营的弃子，亦时刻警惕着东方苏维埃与乌克兰方向南下的红色风暴。"
  culture_Wu: "§Y人类§!-§C吴越人§!"
  culture_Wu_desc: "生息于太湖流域与钱塘江两岸水乡沃土的江南之民。吴越之地自古人文荟萃、富甲天下，拥有极度发达的丝织、手工业与水网航运体系。在近代工商业与外来思潮洗礼下，吴越人将精明的实业筹算与传统的士绅文脉完美结合，是沿海金融、远洋贸易与精密制造不可撼动的核心动脉。"
  culture_Jianghuai: "§Y人类§!-§C江淮人§!"
  culture_Jianghuai_desc: "居于长江与淮河两大水系过渡走廊上的坚韧之民。江淮自古扼守京杭大运河与两淮盐税咽喉，南北风尚在此碰撞交融。这片土地既孕育了极尽考究的淮扬市井与文人庖厨，又磨砺出了悍勇果决的兵家血性。无论乱世纷争还是洪涝灾患，江淮儿女始终在治水筑堤与抵御南侵中展现出极强的社会韧性。"
  culture_Zhongyuan: "§Y人类§!-§O中原人§!"
  culture_Zhongyuan_desc: "生息于黄河中下游平原与河洛枢纽的华夏腹心之民。作为数千年农耕文明的滥觞与交锋主战场，中原人经历了无数次兵燹、洪灾与饥馑的洗礼，养成了极度坚忍、恋土重迁且朴素达观的性格。面对外部大灾变与战火，中原广袤的麦田与纵横交错的铁路网，始终是维系神州命脉最为厚重持久的兵源与粮食基石。"
  culture_Yanyao: "§Y人类§!-§C燕赵人§!"
  culture_Yanyao_desc: "盘踞在幽燕大地与太行山以东广袤北平原的古老民系。自古‘燕赵多慷慨悲歌之士’，他们常年直面塞外铁骑与极寒沙尘的冲刷，造就了沉稳坚毅、崇尚义气、舍生取义的刚烈民风。作为历代中枢朝堂与北疆长城之间的铁血盾牌，燕赵子弟是近代北方填线步兵与重工业骨干最坚实的基本盘。"
  culture_Qilu: "§Y人类§!-§C齐鲁人§!"
  culture_Qilu_desc: "生息于泰沂山脉周围与胶东半岛的山海之民。齐鲁之地兼得儒家重礼尊序之源与管仲通商兴渔之利，民风质朴重诺、崇礼尚公，身形骨架尤为魁伟。依托四通八达的半岛良港与肥沃平原，齐鲁人既是恪守纪律、服从大局的模范兵员与钢铁工匠，也是敢于闯荡风浪、开拓沿海海疆的坚韧拓荒者。"
  culture_Jin: "§Y人类§!-§O晋人§!"
  culture_Jin_desc: "繁衍于太行与吕梁山脉环抱、汾河谷地之中的表里山河之民。地处内外长城关隘要冲，晋人自古深谙在险要地形中构筑关卡与土堡自守。他们将独特的票号钱庄金融智慧与近代煤铁矿产紧密融合，生性俭朴务实、精打细算却又极具向心力，是割据防御战中令敌军难以寸进的铁桶要塞守望者。"
  culture_Qinlong: "§Y人类§!-§O秦陇人§!"
  culture_Qinlong_desc: "生息于八百里秦川与陇山黄土高原的关中之民。承袭先秦虎狼之师与丝路起点的古老底蕴，秦陇人性格浑厚直爽、尚武好勇，极富吃苦耐劳的开拓意志。这群黄土地的子民面对干旱与严寒毫不退缩，在近代工业转移与战略内退中，他们筑起的窑洞群与兵工厂，构成抵御外辱最为可靠的大后方屏障。"
  culture_Bashu: "§Y人类§!-§G巴蜀人§!"
  culture_Bashu_desc: "繁衍于紫红盆地与天府平原之上的古蜀遗民。依靠都江堰的滋润与剑门天险的阻隔，巴蜀人形成了安逸乐观、市井闲适的生活趣味。然而在国家危亡与外敌逼近之际，袍哥大义与保路抗暴的血性便会瞬间觉醒，‘无川不成军’的坚壁清野与死战到底，历来是华夏绝境反击的大后方中流砥柱。"
  culture_Jingchu: "§Y人类§!-§G荆楚人§!"
  culture_Jingchu_desc: "生息在云梦泽与九省通衢枢纽的江汉平原之民。楚风浪漫热烈且桀骜不驯，赋予了荆楚人敢为天下先的叛逆胆气与变法求新意志。作为扼守长江中游与南北铁道大动脉的咽喉，这里的重镇兵工聚集、商埠繁忙，荆楚儿女既精于水网阵地穿插，也能在革命浪潮爆发时率先打响颠覆旧秩序的雷霆第一枪。"
  culture_Hunanese: "§Y人类§!-§R湖湘人§!"
  culture_Hunanese_desc: "生息在三湘四水与苍莽南岭间的勇烈之民。湖湘之地群山合抱，磨砺出他们‘吃得苦、霸得蛮、耐得烦’的刚烈性格。深受岳麓书院与经世致用学风影响，这群人在近代风云激荡中屡次以‘湘军’之姿平定天下大乱，具有极强的政治抱负、严整军纪与不破楼兰终不还的决绝战力。"
  culture_Gan: "§Y人类§!-§O赣人§!"
  culture_Gan_desc: "生息于鄱阳湖平原与赣江丘陵盆地的吴头楚尾之民。这里自古是南北驿道咽喉与陶瓷冶铁圣地，赣人性格质朴敦厚、恪守宗族宗祠传统，但在大是大非面前尤为坚定决绝。面对近代红色风暴的播撒，群山环抱的赣地村落化作星火燎原的摇篮，这里的工农先锋以惊人的牺牲意志筑成了反围剿战线的血肉长城。"
  culture_Cantonese: "§Y人类§!-§Y粤人§!"
  culture_Cantonese_desc: "生息于珠江流域与南海之滨的南岭重商民系。粤人得海上丝绸之路与十三行商埠先机，民风务实通达、敢闯敢拼。他们拥有牢固的宗族祠堂与乡土互助体系，无论是开埠通商、筹饷办学还是远渡重洋开拓殖民地，粤人始终走在对外交流与近代实业变革的最前列。"
  culture_Hakka: "§Y人类§!-§R客家人§!"
  culture_Hakka_desc: "世代南迁并聚居在赣南、闽西、粤东深山险丘中的‘天涯过客’。数次躲避战乱的迁徙历程造就了他们铁壁般的团结心与围屋防御哲学。客家人耕读传家、尚武善战，女子同样长年下地劳作并不裹足。在近代动乱中，客家子弟是冲锋在最前线的铁军骨干，凭借坚不可摧的土楼防线与群山机动，令任何入侵者望而却步。"
  culture_Hokkien: "§Y人类§!-§C闽南人§!"
  culture_Hokkien_desc: "背靠武夷九龙、面向台湾海峡的搏浪拓海之民。‘爱拼才会赢’的海洋性格刻在每个闽南人的骨子里，为了生计他们敢于驾一叶扁舟闯荡南洋甚至大洋彼岸。凭借极为牢固的血缘宗亲与妈祖神明信仰，闽南人织就了遍及海内外的庞大走私、贸易与军火转运网络，是华夏在沿海岛屿与外洋博弈中最具冒险精神的海权先驱。"
  culture_Fuzhou: "§Y人类§!-§C福州人§!"
  culture_Fuzhou_desc: "繁衍于闽江入海口盆地、三坊七巷文脉核心的闽都之民。得海防开埠与马尾船政之先声，福州人自近代起便开眼看世界，诞生了大量海军将帅、外交官与近代工业先驱。他们性格温和内敛却胸怀寰宇，既守得住古街深巷的书香雅趣，又精于现代造船工程与远洋航运组织，是沿海舰队建设不可替代的中流砥柱。"
  culture_Chaoshan: "§Y人类§!-§Y潮汕人§!"
  culture_Chaoshan_desc: "偏居韩江三角洲、山海相迫狭窄平原上的精细耕作与海商巨族。人多地狭的严酷环境磨炼出了潮汕人冠绝天下的精细功夫与行商直觉，其工夫茶与红头船网络遍布东南亚商道。潮汕宗族内聚力坚不可摧，行事低调内敛却极度团结，在物资调配、秘密金融借贷与地下情报网络运营方面拥有近乎垄断的敏锐手腕。"
  culture_Guandong: "§Y人类§!-§C关东汉人§!"
  culture_Guandong_desc: "生息在白山黑水与黑土地上的北境拓荒民系。数代由齐鲁、燕赵挺进关外的拓荒浪潮，磨砺出他们粗犷豪放、抱团互助且极耐严寒的韧性。在近代奉天工业化、森林采伐与铁路枢纽的催生下，关东人既是恪守林海猎户与淘金行规的豪爽汉子，也是神州最早掌握重工业机器与现代化兵工体系的产业工人中坚。"
  culture_Manchu: "§Y人类§!-§O满人§!"
  culture_Manchu_desc: "繁衍于白山黑水森林与八旗故地的渔猎武士遗脉。自王朝覆灭后，满族人从特权阶层回归山野与近代城镇，其射柳骑射之风虽渐次消磨，但尚礼重序、尊崇宗族的传统依然根深蒂固。面对列强对东北亚黑土地的渗透与瓜分，满洲子弟在白桦林与老林子里重拾古老的猎枪与雪橇，以深谙林海雪原游击战的姿态守护白山祖地。"
  culture_Mongol: "§Y人类§!-§O蒙古人§!"
  culture_Mongol_desc: "策马驰骋在大兴安岭以西无垠荒漠与草场上的苍狼白鹿后裔。严酷的高寒风暴磨炼出他们顶级的马背耐力与弓马战技，千百年来逐水草而居的游牧生活铸就了他们崇尚长生天、豪爽重诺的草原风骨。即使在近代骑兵逐步被机械化装甲替代的战局下，蒙古各部的机动骑兵师与熟稔草场水系的向导，仍是荒原大拉锯战中最飘忽致命的轻骑刀锋。"
  culture_Uyghur: "§Y人类§!-§Y维吾尔人§!"
  culture_Uyghur_desc: "依托天山南北雪水绿洲与坎儿井系统繁衍生息的丝路古民。得盆地干热气候与古道商埠之利，他们精于棉果种植、铜铁手作与丝毯织造，性格乐观明朗、能歌善舞。依托分散且封闭的绿洲城镇体系，维吾尔人在极端缺水的高温戈壁中具备极强的生存耐性，是商旅驼队横穿塔克拉玛干与帕米尔山口不可或缺的领航者。"
  culture_Tibetan: "§Y人类§!-§W藏人§!"
  culture_Tibetan_desc: "雄踞在世界屋脊与青藏雪域高原上的古老信徒与勇士。常年生活在极度严寒、空气稀薄的高山恶劣环境，赋予了他们超越常人的心肺机能与对雪山风暴的绝对耐性。藏人深受藏传佛教信仰与土司宗族管辖，民风兼具虔诚内省与剽悍尚武。无论是高山雪崩、激流裂谷还是外敌攀爬隘口，身披藏袍、背负火绳枪的高原骑士皆是一道坚不可摧的冰峰屏障。"
  culture_Yunnanese: "§Y人类§!-§G云南人§!"
  culture_Yunnanese_desc: "聚居在彩云之南横断山脉纵谷、滇池盆地与茶马古道上的多元山地民系。这里汉、白、彝、傣等各族杂居共融，造就了从容闲适却又善走险途的商道性格。近代滇越铁路开通与边防督军整饬下，滇人养成了极强的自卫意识，其著名的滇军劲旅在崇山峻岭间机动如风、敢打恶仗，既是守护西南国门的坚盾，亦是南洋陆路交通线的把关人。"
  culture_Guizhou: "§Y人类§!-§g贵州人§!"
  culture_Guizhou_desc: "生息于‘天无三日晴、地无三尺平’的喀斯特峰丛溶洞地带的山民。恶劣贫瘠的山地环境造就了苗、侗、布依与汉家屯堡人极度耐劳、善避深山的生存韧性。他们精于利用溶洞打设伏击、在无路峭壁间轻装行军，民风坚忍刚毅、嗜酸辣提神，在抗击外敌与应对围剿时，复杂奇绝的喀斯特溶洞迷宫即是他们天然的地下兵工厂与永不陷落的堡垒。"
  culture_Guangxi: "§Y人类§!-§R广西人§!"
  culture_Guangxi_desc: "生息在十万大山与左右江喀斯特田园间的骆越遗族与狼兵后裔。广西民风自古悍勇善战，素有‘广西狼兵雄于天下’之称，壮、汉儿女皆能涉险山、御瘴气。在近代严苛的地方自治与军政训练下，广西人展现出了令人生畏的铁血纪律与丛林山地突击力，是华南防御与反攻战役中令敌胆寒的尖刀虎狼之师。"


##兽人
  culture_Kazimierz_Kuranta: "§Y亚人§!-§Y卡西米尔库兰塔§!"
  culture_Kazimierz_Kuranta_desc: "根植于平原与密林之间、以天马及骏马种属‘库兰塔’为主体的骑士之国。卡西米尔的社会在古老征战骑士的崇高誓约与现代商业联合会的狂热资本之间撕裂撕扯，孕育出高度发达的‘骑士竞技’娱乐商业工业。无论是恪守骑枪荣誉的乡村征战骑士、依靠赛会包装的名人竞技骑士，还是穿梭于暗巷的地下感染者游击队，这群疾驰在铁轨与荒原上的骁勇骑手都拥有傲视战场的机动冲锋与坚韧战意。"
  culture_Ursus_Race: "§Y亚人§!-§O乌萨斯§!"
  culture_Ursus_Race_desc: "带有熊类亚人特征的古老北方种族。乌萨斯人骨架粗壮、气力惊人，拥有远超普通人类的耐寒体质与肌肉承载力。常年生息在暴风雪肆虐的极北荒原与针叶林地带，磨砺出了他们坚忍、质朴却又极度崇尚力量的直率民风。在战争中，乌萨斯战士无需复杂装备便能负重跋涉于深雪泥泞，单兵披挂厚重防具即可作为肉搏攻坚的核心；当陷入绝境或被怒火驱使时，其体内潜藏的狂暴野性更能爆发出一往无前的近战压迫力。"
  culture_Sarkaz_Race: "§Y亚人§!-§R萨卡兹人§!"
  culture_Sarkaz_Race_desc: "头生异角、伴生暗黑魔力的古老异族。作为饱受排挤与战乱撕扯的流亡种族，萨卡兹人分散在亚洲与欧陆各处边缘地带，多以雇佣兵、黑市工匠与游荡行商维生。他们骨骼密度极高，天生具备对古老源石咒术的敏感度与强大的肉体再生机能。千百年的苦难造就了他们冷峻寡言、抱团警惕却又极其看重同族羁绊的性格。即便身处废墟瓦砾之中，他们依然保持着擦拭武器、围炉煮茶的粗粝生活节奏；而一旦被卷入战火，萨卡兹人挥舞着巨剑与蚀刻法术的身影，便是战场上最致命的死神浪潮。"
  culture_Uma_Musume: "§Y亚人§!-§C赛马娘§!"
  culture_Uma_Musume_desc: "生息于帕米尔高原、里海荒漠与无垠中亚草原上的赛马娘分支。她们承袭了古老游牧马匹与‘天马’的坚韧血统，在干燥、多风沙且昼夜温差极大的环境下，磨砺出了无与伦比的长距离耐力与抗风沙奔跑技巧。这群奔跑在丝路古道上的赛马娘民风豪爽、极度自由，她们不仅在天然的高地砂石赛道上进行传统的赛跑，更将奔跑融入日常的牧群守护与节庆庆典。即便是休整时刻，她们也喜欢聚在毡房前，伴着冬不拉的琴音分享马奶酒与烤馕，展现出既剽悍狂野又乐观好客的草原生活形态。"

##妖怪
  culture_Tengu: "§Y妖怪§!-§t天狗§!"
  culture_Tengu_desc: "盘踞在妖怪之山绝壁之上的封闭山岳部族。天狗拥有极度森严的军警等级体制与迅猛的空降机动能力，由鸦天狗负责情报刺探与舆论宣传，白狼天狗执掌近战要塞防御。凭借俯瞰全图的险要地势和庞大族群，他们是山岳地带不可轻易撼动的空中武力集团。"
  culture_Kappa: "§Y妖怪§!-§G河童§!"
  culture_Kappa_desc: "聚居于玄武之泽两岸与清澈溪流畔的水生妖怪工程师族群。河童天生对机械、水力、电能与外界精密仪器抱有无可救药的狂热。虽然正面单兵格斗并非强项，但其拼装外挂武器、逆向工程外界科技以及水陆两栖后勤作业的能力，使他们成为战线上最顶尖的技术供应者。"
  culture_Gensokyo_Fairy: "§Y妖怪§!-§C雾之湖妖精§!"
  culture_Gensokyo_Fairy_desc: "诞生于雾之湖湿地、森林与自然万物微光中的小型妖精精怪。她们心智纯真宛如孩童，组织纪律极度松散，却拥有源于大自然本质的无限次重生特性。在战场上，这些低消耗轻步兵能以近乎无穷无尽的骚扰浪潮填塞战线，无论遭遇何种惨烈战损都能迅速恢复。"
  culture_Magicians: "§Y妖怪§!-§Y魔法使§!"
  culture_Magicians_desc: "通过长期研习深奥秘术、完成舍身舍食转化而抛弃凡人肉身的不老魔法使群体。她们长年隐居在幽暗的魔法之森中，潜心于符文推演、禁忌炼金与魔导兵器改装。这一族群人数极为稀少但单体破坏力恐怖，往往能以小规模精锐连队释放出媲美大口径重炮群的战术压制。"
  culture_Earth_Rabbits: "§Y妖怪§!-§S妖怪兔§!"
  culture_Earth_Rabbits_desc: "定居在迷途竹林幽深竹海中的妖怪兔群落。在领袖因幡帝的管辖下，这些看似天真胆小的兔妖展现出惊人的农垦、采药与隐蔽战术天赋。繁密的密林是她们天然的掩体，借助庞大的人口基数与地利迷阵，她们能以极低的后勤消耗维系庞大的预备役支援网络。"
  culture_Oni: "§Y妖怪§!-§0鬼§!"
  culture_Oni_desc: "曾君临地上妖怪顶点的远古豪族，因厌恶人类阴险的退治诡计而举族隐居于旧地狱地下都城。鬼族拥有全图最为恐怖的纯血肉身蛮力与近战突破性能，性格坦荡豪爽、嗜酒如命。她们从不玩弄权谋诡诈，一旦挥舞铁棒踏上正面战场，便是任何正规装甲阵线都极难阻挡的冲锋铁锤。"
  culture_Flower_Fairy: "§Y妖怪§!-§G花之妖精§!"
  culture_Flower_Fairy_desc: "依附于太阳花田盛开花海中汲取养分的高阶自然妖精。她们虽然外貌娇弱，但在风见幽香的威压与花田结界的护佑下展现出远超普通妖精的侵略性。任何践踏花田的敌对部队都会遭遇漫天飞舞的花粉暴风与残酷的植物缠绕反击，是绝境死守的天然屏障。"
  culture_Gensokyo_Vampires: "§Y妖怪§!-§R吸血鬼§!"
  culture_Gensokyo_Vampires_desc: "由欧洲流亡迁徙至红魔馆湖畔的西洋高阶纯血血族领主。吸血鬼拥有超凡的断肢自愈力、蝠化机动与令敌胆寒的突破威慑，但也深受日光照射与流水规则的致命制约。当猩红之雾笼罩天空或在夜幕下发起突击时，这支贵族军团能以少数精锐瞬间撕开敌军指挥核心。"
  culture_Kobito: "§Y妖怪§!-§g付丧神§!"
  culture_Kobito_desc: "由历经漫长岁月洗礼的器具、弃置兵刃与古老乐器汲取灵力或受异变魔力催化而觉醒的器物之灵。她们脱胎于死物却拥有灵动的心智与自律身躯，天生与各类军备器械、工业构件存在着超自然的共鸣感应。付丧神极擅长维护改装武器、在废墟残骸中逆向回收军备，或将器物本身的特质化为奇特诡谲的战斗术式，是擅长以巧破力、以小搏大的特化战力。"
  culture_Underground_Youkai: "§Y妖怪§!-§8地底妖怪§!"
  culture_Underground_Youkai_desc: "盘踞在旧地狱地灵殿周边、被地上世界放逐孤立的异端妖怪与地底使魔。这群包含心智读心者、操纵灼热地狱火的乌鸦与驭使怨灵的火炎猫的群落，对侵犯领地的外来者极度戒备。他们善于利用地底酷热与恐惧心智展开心理战，将入侵者拖入灼热的深渊。"

##魔法生物
  culture_Magical_Creature: "§Y魔法生物§!-§S人形§!"
  culture_Magical_Creature_desc: "由高级魔法使以精密齿轮、秘银丝线与灵能核心亲手构筑的自律战斗人偶。人形完全剥离了凡人的恐惧与士气动摇，不知疲倦且严格执行每一个微秒的战术指令。只要后方魔力丝线与补给未断，这批整齐划一的机械傀儡就能像精密的屠杀机器般平稳扫荡防线。"
  culture_Lustrous_Gems: "§Y魔法生物§!-§C宝石人§!"
  culture_Lustrous_Gems_desc: "远古人类肉体消亡后、在虚无海滨经受漫长地质淬炼诞生的无机矿物拟态生命。宝石人通体由微小生物（包藏体）驱动结晶矿石构成，不具性别与血肉脏器，更无生老病死与饥渴之虞。即便躯体在烈度交锋中崩碎破裂，只要收集碎片重新粘合便能奇迹般重获新生。其单兵动作迅捷如风、心智纯粹澄澈，在金刚老师的带领下恪守职责分工，能以极低的战损代价与不知疲倦的晶体刃锋执行超长战线巡逻与坚守。"

##智械
  culture_Railords: "§Y智械§!-§N铁路人偶§!"
  culture_Railords_desc: "伴随大型蒸汽与内燃机车诞生的高度精密自律型机车操纵人偶。她们的心智核心与铁道网络深度绑定，拥有人类无法企及的列车操纵感知与调度算力。虽然人偶自身无法充当线列步兵，但她们的存在能让全境的军列运力、后勤吞吐与前线补给效率产生质的飞跃。"
  culture_Shipgirls: "§Y智械§!-§B舰娘§!"
  culture_Shipgirls_desc: "由人类历史上的战舰之魂、心智魔方或海洋执念凝聚而成的少女形自律决战兵器。她们身着由多联装舰炮、装甲板与动力烟囱构成的外挂式‘舰装’，拥有单兵在波涛之上高速掠行并释放战列级齐射、航空轰炸的超凡破坏力。作为海洋的绝对主宰，舰娘不占用常规陆军人力，但能以无可匹敌的单兵战力撕裂敌方舰队。她们对所效忠的提督与母港怀有誓死不渝的羁绊，是维系制海权与跨海登陆战的终极深海屏障。"
  culture_Initial_Y_Automata: "§Y智械§!-§P时钟自律偶§!"
  culture_Initial_Y_Automata_desc: "由神话级钟表师‘Y’生前倾尽毕生心血亲手打造的自律型齿轮机巧少女。这批超越时代极限的构装体拥有独立的人格心智与操控特定物理概念的恐怖机能。虽然初号机‘琉紫’等核心机体因关键技术失传而长年陷入机能停摆，但在杜伦布军民心中，她们是拯救大地的图腾象征，亦是危难之际能够扭转国运的终极战略钥匙。"

##不死族
  culture_Phantoms: "§Y不死族§!-§g幽灵§!"
  culture_Phantoms_desc: "肉身早已泯灭、滞留在冥界白玉楼与幽明结界边缘的虚幻死者魂魄。作为纯粹的非实体死灵，幽灵完全免疫常规的毒气窒息、辐射沾染与机械穿透伤，也不需要消耗任何口粮。这群徘徊于落樱之下的虚幻亡者，是守护黄泉安宁的最后一道静谧长城。"
  culture_Nether_Spirits: "§Y不死族§!-§g死灵§!"
  culture_Nether_Spirits_desc: "由战场暴毙之人的极度怨念、残缺执念与冥府幽能凝聚而成的半实体亡魂浪潮。死灵游离于生死狭缝之间，不具肉体凡躯，完全免疫寻常的毒气侵蚀、严寒创伤与弹片穿透。在通灵战术的统率下，这股源自死亡本身的阴冷浪潮不仅能对生者步兵造成极大的恐慌压制，更能伴随全图惨烈战事的蔓延，将源源不断的阵亡者转化为自身的死灵人力池。"
  culture_Skeletons: "§Y不死族§!-§7骷髅§!"
  culture_Skeletons_desc: "由古战场遗骨、荒冢残骸经死灵术法或地脉秽气复苏的白骨亡军。它们彻底脱离了血肉躯壳的桎梏，不具痛觉、无需粮饷补给，亦完全免疫毒气与严寒环境。尽管单具骷髅的机械骨架脆弱且战术机动迟缓，但凭借绝对的服从性、源源不断的唤醒潜能以及无视伤亡的白骨填线战术，它们是防线上最为冰冷刺骨的消耗铁壁。"

##神灵 
  culture_Immortals: "§Y神灵§!-§Y仙人§!"
  culture_Immortals_desc: "隐于仙界神灵庙与绝壁洞天、参悟道家虚静与尸解长生秘术的修行者集团。仙人们脱胎于凡胎却超脱生死，举手投足间能引动天地清气与道术雷击。辅以毫无痛觉的道门僵尸护卫，她们以冷峻出尘的战略眼光审视凡俗争端，为了实现宏道大计绝不吝于动用天道神罚。"
  culture_Celestials: "§Y神灵§!-§O天人§!"
  culture_Celestials_desc: "居于万丈云海之上、终日宴饮天界桃园的古老高维神仙。天人们自幼远离凡间疾苦，性格往往傲慢骄纵、肆意妄为。然而她们掌控着操控大地地脉、震碎山岳的‘要石’伟力，单兵身躯坚不可摧，随时能以天罚之名将天崩地裂的地震带到地表。"
  culture_Secret_Gods: "§Y神灵§!-§P秘神眷族§!"
  culture_Secret_Gods_desc: "游离于正统众神体系之外、依附在后户之国与万物背阴面的古老秘神侍从。在多面神摩多罗的统辖下，秘神眷族司掌着生命力、障碍与演艺的幽暗平衡。她们能从任何虚掩的门扉缝隙中直接穿梭空间建立敌后奇袭通道，以难以防范的因果律扰乱整个战场。"
  culture_Dream_Dwellers: "§Y神灵§!-§0梦境住民§!"
  culture_Dream_Dwellers_desc: "纯粹栖息在全生物潜意识深处、由梦境秩序构建的特殊幻境生灵。在貘族食梦者的维系下，梦境住民穿梭于真实与荒诞的边缘。当她们涉足实体争端时，现实的物理防线往往会被扭曲的梦境逻辑所瓦解，使前线敌军陷入无法苏醒的群体幻觉与精神瘫痪之中。"
  culture_CPU_Goddesses: "§Y神灵§!-§B守卫女神§!"
  culture_CPU_Goddesses_desc: "由大众信仰与‘信仰水晶’凝聚显现的第四天面高维守护神。她们在日常状态下是性格迥异的少女，但一旦启动女神化，身躯便会覆上神圣装甲并掌握移山填海的弑神算力。女神们不仅是国家意识形态的核心图腾，更是能够单机突破敌军重装甲集团军的前线战略决战兵器。"

##魔物
  culture_Tempest_Kijin: "§Y魔物§!-§R大鬼族§!"
  culture_Tempest_Kijin_desc: "由大鬼族吸收庞大魔素进化而来的高位魔人将领与参谋阶层。他们拥有近乎人类的优雅容貌与长着独角或双角的威严特征，将东方传统剑技、暗影忍术与超自然火焰法术锤炼至宗师水准。大鬼族作为中央军务省与直属亲卫队的绝对中枢，不仅是一骑当千的突破统帅，更是全军组织度与攻坚战意的精神支柱。"
  culture_Goblins: "§Y魔物§!-§G哥布林§!"
  culture_Goblins_desc: "生息于密林、荒野与地下洞窟的群居亚人族群。它们体型矮小、面容丑陋，虽单体战力微弱且常被视为杂兵，却拥有令人咋舌的繁衍速度与顽强的环境适应力。在原始状态下，它们依靠数量优势进行伏击与骚扰；而在获得强力领袖庇护、赐名进化或接受近代军事化训练后（如哥布林重装步兵、狼骑兵及工兵团），它们能迅速克服天生的胆怯，蜕变为纪律严明、擅长山林游击与要塞构筑的庞大武装浪潮。其极低的人力消耗与悍不畏死的集群冲锋，使它们成为战线上最难缠的填线与骚扰力量。"
  culture_Tempest_Demon_Lord: "§Y魔物§!-§C八星魔王眷族§!"
  culture_Tempest_Demon_Lord_desc: "环绕在真·魔王利姆鲁御座之下的高位破格神格存在。在‘智慧之王’的算力网络联结下，这批直属随从拥有近乎无限的魔素再生、空间切断与全图级情报感知。他们不受任何凡俗规则与常规物理损伤制约，仅在国家主权面临覆灭绝境时作为终极战略决战手段降临前线，以绝对的位阶压制抹消任何胆敢进犯森林的敌对集团军。"


