	PAQ_1:"现实问题"
	PAQ_1_desc:"唉，大萧条。"
	PAQ_2:"把经济甩在一边！"
	PAQ_2_desc:"“我不想听你们扯这些经济相关的问题，你们自己想办法解决！”"
	PAQ_3:"来为帝国服役！"
	PAQ_3_desc:"为了下一场扩张战争，帝国需要更多士兵。"
	PAQ_4:"打开混沌之门"
	PAQ_4_desc:"是时候打开混沌之门了，诸神许诺过薇莉安，这里可以从混沌那里接收源源不断的兵源..."
	PAQ_5:"继续宏伟计划"
	PAQ_5_desc:"女皇的伟大计划不能停滞，我们必须抓紧时间。"
	PAQ_6:"帝国战争规划"
	PAQ_6_desc:"帝国必须规划好如何面对她的敌人们。"
	PAQ_7:"月光黯淡"
	PAQ_7_desc:"[PA1.getname]是个弱小的国家，也许帝国应该先从这里下手。"
	PAQ_8:"分崩离析"
	PAQ_8_desc:"妖精们始终处于分裂的状态，帝国将使她们被迫“统一”。"
	PAQ_9:"为了帝国，冲锋！"
	PAQ_9_desc:"为了女皇与帝国，让我们的士兵发起冲锋！"
	PAQ_10:"稳扎稳打，保存实力"
	PAQ_10_desc:"与混沌的交易是一把双刃剑，帝国必须尽可能保存实力应对更多战斗。"
	PAQ_11:"逐个击破"
	PAQ_11_desc:"妖精各族位置分散且缺乏统一指挥，帝国可以轻易将她们逐个击破。"
	PAQ_12:"毁灭打击"
	PAQ_12_desc:"管她那么多干什么！直接一路碾压过去就好了！"
	PAQ_13:"王冠落地"
	PAQ_13_desc:"中美在南美的前哨站已经被帝国清除。"
	PAQ_14:"栖息之地不复存在"
	PAQ_14_desc:"大仇得报，妖精国度已经不复存在。"
	PAQ_15:"腐蚀蔓延"
	PAQ_15_desc:"该面对真正强大的对手了。"
	PAQ_16:"少女终幕"
	PAQ_16_desc:"魔法少女们自以为能够凭借与圣杯的联盟与我们抗衡，帝国会用强大的军力碾碎她们的幻想！"
	PAQ_17:"魂飞云散"
	PAQ_17_desc:"夜莺是个畸形的国度，亡灵们不该存在于凡世！"
	PAQ_18:"内心恐惧"
	PAQ_18_desc:"帝国必须通过战争的力量激发出魔法少女们内心深处的恐惧。"
	PAQ_19:"噩梦再临"
	PAQ_19_desc:"“魔女之夜”似乎是魔法少女们的心头大患，如果女皇用诡计的力量让她们陷入幻觉的话..."
	PAQ_20:"利用亡灵"
	PAQ_20_desc:"混沌的力量可以支配一部分亡灵为女皇所用，帝国军官们可以从中得知亡灵们的弱点。"
	PAQ_21:"长生腐蚀"
	PAQ_21_desc:"为何不试试长生的力量呢？如果混沌为不死者延续寿命会发生什么呢，真令人好奇..."
	PAQ_22:"联盟之死"
	PAQ_22_desc:"魔法少女的联盟不该存在于这里。"
	PAQ_23:"夜莺终曲"
	PAQ_23_desc:"亡灵们得以真正安息。"
	PAQ_24:"王国哀歌"
	PAQ_24_desc:"莉兰迪亚王国的暴君残忍镇压了公社的起义，这可能会是帝国最为棘手的敌人。"
	PAQ_25:"公社末日"
	PAQ_25_desc:"野火革命军的疯狂扩张令女皇十分担忧，帝国必须遏制红色势力的继续壮大。"
	PAQ_26:"混沌侵蚀"
	PAQ_26_desc:"莉兰迪亚内部并不稳定，腐蚀她们会很轻松。"
	PAQ_27:"正面击破"
	PAQ_27_desc:"帝国强大的军队可以直接从正面击败她们，不需要混沌的更多帮助。"
	PAQ_28:"更多契约"
	PAQ_28_desc:"或许女皇可以借由色欲的力量，腐蚀莉兰迪亚的底层人民..."
	PAQ_29:"再见，莉兰迪亚"
	PAQ_29_desc:"无论是王国还是公社，都将共同埋葬。"
	PAQ_30:"南美王座"
	PAQ_30_desc:"终于，在经过一番长久的战争后，女皇带领帝国扫清了所有的敌人，统一了南美！"
	PAQ_31:"偿还之日"
	PAQ_31_desc:"这样下去不是办法：混沌诸神开始索取越来越多的东西，但女皇不可能保证每一场战争都取得胜利，她必须在此刻做出抉择。"
	PAQ_32:"卡丘军官团的分歧"
	PAQ_32_desc:"卡丘军官团的将军们在一些军事问题上发生了分歧，她们请求皇帝做出决断。"
	PAQ_33:"支持剪刀手组织"
	PAQ_33_desc:"剪刀手鼓励步兵战术。"
	PAQ_34:"支持乌尔比诺财团"
	PAQ_34_desc:"乌尔比诺财团鼓励综合战术。"
	PAQ_35:"支持欧泊防卫局"
	PAQ_35_desc:"欧泊鼓励陆空协同战术。"
	PAQ_36:"重视凡人军队"
	PAQ_36_desc:"毫无疑问，凡人军队是帝国的根基，我们必须重用凡人军队。"
	PAQ_37:"超弦体军队？"
	PAQ_37_desc:"关于这一点，卡丘军官团提议可以试试她们世界的超弦体军队..."
	PAQ_38:"支持混沌军队"
	PAQ_38_desc:"混沌军队的强大是有目共睹的，重用混沌军队才能让帝国战无不胜。"
	PAQ_39:"针对魔法少女联盟"
	PAQ_39_desc:"魔法少女联盟是帝国的首要目标。"
	PAQ_40:"首要敌人是莉兰迪亚"
	PAQ_40_desc:"帝国最强大的敌人是莉兰迪亚。"
	PAQ_41:"必须排除外界势力"
	PAQ_41_desc:"来自外部的敌人才是最应该警觉的。"
	PAQ_42:"设立仆从国"
	PAQ_42_desc:"帝国应该在南美以外的土地上设立混沌仆从国。"
	PAQ_43:"统一管理"
	PAQ_43_desc:"混沌不需要仆从国，所有土地都属于混沌诸神。"
	PAQ_44:"工业基础"
	PAQ_44_desc:"作为南美工业实力最强的国家，我国的工业基础决定了其发展上限就注定不低。"
	PAQ_45:"扩建首都工业区"
	PAQ_45_desc:"阿德莱希城一直是南美北部最大的城市，其占地面积之大允许我们建造更多的工业设施。"
	PAQ_46:"强迫企业巨头合作"
	PAQ_46_desc:"企业巨头必须与国家合作，她们别无选择。"
	PAQ_47:"乌尔比诺财团的实验"
	PAQ_47_desc:"南瓜头先生有一些很有意思的想法，帝国会允许她们自行实验。"
	PAQ_48:"军工业扩张"
	PAQ_48_desc:"为了应对接下来的大战，国家需要更多武器。"
	PAQ_49:"支配企业利润"
	PAQ_49_desc:"在混沌的支配下，任何人都必须成为国家的齿轮。"
	PAQ_50:"新型能源"
	PAQ_50_desc:"乌尔比诺财团的研究有了成果，一种新型能源准备投入使用。"
	PAQ_51:"大规模工业建设"
	PAQ_51_desc:"建设更多的工厂。"
	PAQ_52:"开采更多煤炭"
	PAQ_52_desc:"通过乌尔比诺财团提供的新能源，我们的开采技术也得到了提升。"
	PAQ_53:"南美工业霸主"
	PAQ_53_desc:"[PAQ.getname]毫无疑问是南美大陆发展最快的国家，我国的现代化是其他南美国家无法比拟的。"
	PAQ_54:"重新建设南美"
	PAQ_54_desc:"大战之后，混沌腐蚀下的废土等待新生。"
	PAQ_55:"扩建帝国工业区"
	PAQ_55_desc:"在阿德莱希城的工业区企划十分成功，必须将其投射至整个南美。"
	PAQ_56:"命运抉择"
	PAQ_56_desc:"由于四神已经明确表示对萌心世界失去了兴趣，那么接下来女皇将做出属于她个人的判断了：是安于现状留在南美，还是向整个世界发动入侵？"
	PAQ_57:"混沌大陆"
	PAQ_57_desc:"固守南美可能并不符合混沌诸神的思想，但在四神已经失去兴趣的现在，这也算是一种明智之举，四神也不会因此怪罪女皇。"
	PAQ_58:"混沌入侵"
	PAQ_58_desc:"安于现状？开什么玩笑！帝国已经在混沌的沐浴下浴火重生，统一南美仅仅是这场伟大游戏的开始，世界必将在混沌的注视下颤抖！"
	PAQ_59:"毁灭之兆"
	PAQ_59_desc:"战争。"
	PAQ_60:"变革之影"
	PAQ_60_desc:"诡计。"
	PAQ_61:"折磨狂潮"
	PAQ_61_desc:"色欲。"
	PAQ_62:"腐朽王座"
	PAQ_62_desc:"长生。"
	PAQ_63:"向北进军"
	PAQ_63_desc:"混沌与中北美的战争迟早会发生，女皇将主动出击，打响对秩序世界的第一枪。"
	PAQ_64:"万事俱备"
	PAQ_64_desc:"经过漫长的准备工作，混沌大军已经做好了对整个旧世界的入侵准备。"
	PAQ_65:"最终时刻"
	PAQ_65_desc:"......"
	PAQ_66:"韬光养晦"
	PAQ_66_desc:"我们需要隐藏实力，为下一次大战做好充足准备..."
  PAQ_66_tips:"§Y阿德莱希战败线§!的§Y临时内容§!到此为止，§Y更多内容§!请等待§Y未来更新§!"
	PAQ_67:"被抛弃者"
	PAQ_67_desc:"由于薇莉安自战败后就闭门不出，因此一切国家事务都将交给托莉娜神官处理。"
	PAQ_68:"四神遗产"
	PAQ_68_desc:"帝国必须尽快缓和与混沌四神的关系，被抛弃的是薇莉安，又不是阿德莱希！"
  PAQ_68_tips:"将§Y混沌四神§!的§Y关系值§!重置为§C初始值§!\n\n在§Y阿德莱希城§!部署四支§Y神选者§!部队"
	PAQ_69:"新的种子"
	PAQ_69_desc:"四神挑好的继承人们都已经做好了准备，是时候再次让这片土地热闹起来了。"
	PAQ_70:"阿德莱希的妹神官"
	PAQ_70_desc:"被四神选中的人们将展开最终的博弈，获胜者的报酬是整个阿德莱希，也有可能是整个南美洲。而托莉娜要做的，就是确保这一过程中国家的安全。"
	PAQ_71:"加冕礼"
	PAQ_71_desc:"伟大游戏结束了，为我们新的混沌神选献上一切！"
	# 战败线 · 战争神选（莱娅）
	PAQ_zz_1:"唯一的正统"
	PAQ_zz_1_desc:"皇室其他人全被薇莉安杀光了，现在只有莱娅才是阿德莱希合法的主人。"
	PAQ_zz_2:"清算死士与薇莉安"
	PAQ_zz_2_desc:"还在替薇莉安卖命的死士和那个弑亲的篡位者，一个都不会放过。"
	PAQ_zz_3:"铁十字血律"
	PAQ_zz_3_desc:"用最严酷的军法重新整顿部队，以后整个国家只为打仗运转。"
	PAQ_zz_4:"军国至上体制"
	PAQ_zz_4_desc:"过去那些粉饰太平的制度全没用了，现在的阿德莱希就是一座大兵营。"
	PAQ_zz_5:"第六次扩张战争"
	PAQ_zz_5_desc:"前两次扩张战争丢尽了帝国的脸，这回必须拿敌人的血讨回来。"
	PAQ_zz_6:"碾碎魔联与夜莺"
	PAQ_zz_6_desc:"不管是魔法少女还是夜莺的亡灵，都挡不住重新整编的帝国主力。"
	PAQ_zz_7:"莉兰迪亚血战"
	PAQ_zz_7_desc:"莉兰迪亚是南美最硬的一块骨头，正好拿来给战争之神当祭品。"
	PAQ_zz_8:"颅骨与嗜血祭坛"
	PAQ_zz_8_desc:"只要前线的仗一直打下去，血神就不会吝啬祂的恩赐。"
	PAQ_zz_9:"血神祭礼"
	PAQ_zz_9_desc:"把战场上收来的颅骨献上祭坛，换取更强的赐福。"
	PAQ_zz_10:"血军召唤"
	PAQ_zz_10_desc:"战场上的血腥味越浓，亚空间里的血军就越容易跨过裂隙。"
	PAQ_zz_11:"嗜血狂怒"
	PAQ_zz_11_desc:"不需要防守和克制了，让全军只管往前冲。"
	PAQ_zz_12:"骸骨铸就的南美"
	PAQ_zz_12_desc:"南美各国已经被彻底打服，接下来该把枪口对准外面的世界了。"
	# 战败线 · 诡计神选（格蕾）
	PAQ_gj_1:"黎明之下的新政"
	PAQ_gj_1_desc:"内乱总算平息，格蕾和伙伴们开始动手收拾这个烂摊子，而且一切都出奇地顺手。"
	PAQ_gj_2:"必要的阴影"
	PAQ_gj_2_desc:"国库见底、部队疲惫，正面硬打只会白白送命。哪怕手段脏一点，也得先保住国家。"
	PAQ_gj_3:"扭曲的救赎"
	PAQ_gj_3_desc:"前线一直在打胜仗，可身边的朋友却一个个离她而去。"
	PAQ_gj_4:"提线木偶的南美"
	PAQ_gj_4_desc:"几封假电报和暗地里的挑拨，就够让南美各国在开打前先自己乱成一团。"
	PAQ_gj_5:"碎镜中的最后清醒"
	PAQ_gj_5_desc:"南美彻底平定的那一夜，格蕾走进参谋室，终于看清了背后牵着自己的那双手。"
	PAQ_gj_6:"编织命运丝线"
	PAQ_gj_6_desc:"收集秘典和各方情报，把局势攥在自己手里。"
	PAQ_gj_7:"窃取疆土"
	PAQ_gj_7_desc:"不用派兵强攻，靠几纸假调令和潜伏的教团就能直接接管对面的防区。"
	PAQ_gj_8:"静止的棋盘"
	PAQ_gj_8_desc:"想打就打，想停就停，连对手的停战决定都能随手篡改。"
	PAQ_gj_9:"挑起世界之火"
	PAQ_gj_9_desc:"给旧世界的几个大国递点假消息，让他们自己先打个头破血流。"
	PAQ_gj_10:"阴影情报总局"
	PAQ_gj_10_desc:"把旧帝国的宪兵和密探整合起来，方便随时盯着国内外的动静。"
	PAQ_gj_11:"禁忌奥术研习"
	PAQ_gj_11_desc:"常规技术的进展还是太慢了，亚空间里留下的东西要好用得多。"
	PAQ_gj_12:"呼唤万变魔君"
	PAQ_gj_12_desc:"在科学院地下备好仪式，把那位帮过忙的双翼大魔请到现世来。"
