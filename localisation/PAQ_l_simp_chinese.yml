PAQ_sbzzfs_jyz: "血祭血神"
PAQ_sbzzfs_jyz_desc: "为战争之神奉上无尽的毁灭，便可得到无穷的力量。\n所有核心领土都被散播混沌腐蚀的非主要国家可以被打上混沌印记，在最终时刻成为混沌忠实的仆从。"
PAQ_sbgjfs_jyz: "诡计教团"
PAQ_sbgjfs_jyz_desc: "在其他国家设立诡计教团，利于散播腐蚀。\n所有核心领土都被散播混沌腐蚀的非主要国家可以被打上混沌印记，在最终时刻成为混沌忠实的仆从。"
PAQ_sbsyfs_jyz: "色欲诱惑"
PAQ_sbsyfs_jyz_desc: "色欲代表着所有的欲望，因此可以快速向国外散播腐蚀。\n所有核心领土都被散播混沌腐蚀的非主要国家可以被打上混沌印记，在最终时刻成为混沌忠实的仆从。"
PAQ_sbcsfs_jyz: "长生瘟疫"
PAQ_sbcsfs_jyz_desc: "伟大的长生之神掌握着所有疾病，它的信徒们致力于传播这些疾病。\n所有核心领土都被散播混沌腐蚀的非主要国家可以被打上混沌印记，在最终时刻成为混沌忠实的仆从。"
