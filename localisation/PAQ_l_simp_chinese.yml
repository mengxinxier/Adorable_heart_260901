# PAQ_hundunzhushen_jyz_desc: "混沌四神指的是战争，色欲，诡计，长生四位神明。它们诞生于凡人情绪的实体化，分别对应仇恨、希望、欢乐与绝望四种基本情绪。这四位神明原本无心干涉萌心世界，但薇莉安的祈愿触动了它们，诸神赐予帝国皇帝与她的臣民混沌的力量，而整个帝国都必须为了四神赴汤蹈火。\n由于各个神明之间偶尔会产生冲突，因此女皇必须平衡好与各神的联系，争取在得到赐福的同时不被其他神明惩罚。§0主要信仰在达到“神选”后可以获得最高程度的赐福，次要信仰则不行。§!\n\n§R战争对女皇的态度§!：§O[Root.Gethundun_zz_gx]§!\n\n§C诡计对女皇的态度§!：§O[Root.Gethundun_gj_gx]§!\n\n§P色欲对女皇的态度§!：§O[Root.Gethundun_sy_gx]§!\n\n§G长生对女皇的态度§!：§O[Root.Gethundun_cs_gx]§!\n"
PAQ_Four_Gods_of_Chaos_window_desc: "混沌四神指的是战争，色欲，诡计，长生四位神明。它们诞生于凡人情绪的实体化，分别对应仇恨、希望、欢乐与绝望四种基本情绪。这四位神明原本无心干涉萌心世界，但薇莉安的祈愿触动了它们，诸神赐予帝国皇帝与她的臣民混沌的力量，而整个帝国都必须为了四神赴汤蹈火。\n由于各个神明之间偶尔会产生冲突，因此女皇必须平衡好与各神的联系，争取在得到赐福的同时不被其他神明惩罚。§0主要信仰在达到“神选”后可以获得最高程度的赐福，次要信仰则不行。§!"
PAQ_hundunenci_window_desc: "混沌四神指的是战争，色欲，诡计，长生四位神明。它们诞生于凡人情绪的实体化，分别对应仇恨、希望、欢乐与绝望四种基本情绪。诸神赐予阿德莱希混沌的力量，而整个国家都必须为了四神赴汤蹈火。\n在信仰单个神明的情况下，只需为这位神明尽责。\n§0主要信仰在达到“神选”后可以获得最高程度的赐福。§!"
