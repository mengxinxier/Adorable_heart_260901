PAQ_weidayouxi_time_desc: "伟大游戏就是混沌诸神为了争夺混沌领域内绝对统治权的一场游戏（或者说是比赛）亚空间不仅是混沌诸神的居所，亦是祂们的战场。但是没有任何一位神可以赢得这场战争。因为如果其他混沌神被消灭，亚空间将变得一坨毫无生机的纯能量领域，混沌也将不复存在。所以这场战争永远不会结束。混沌诸神们将几乎所有精力都放在了这场伟大游戏之上。"
