	PAQ_1:"现实问题"
	PAQ_1_desc:"唉，大萧条。"
	PAQ_2:"把经济甩在一边！"
	PAQ_2_desc:"“我不想听你们扯这些经济相关的问题，你们自己想办法解决！”"
	PAQ_3:"来为帝国服役！"
	PAQ_3_desc:"为了下一场扩张战争，帝国需要更多士兵。"
	PAQ_4:"打开混沌之门"
	PAQ_4_desc:"是时候打开混沌之门了，诸神许诺过薇莉安，这里可以从混沌那里接收源源不断的兵源..."
	PAQ_5:"继续宏伟计划"
	PAQ_5_desc:"女皇的伟大计划不能停滞，我们必须抓紧时间。"
	PAQ_6:"帝国战争规划"
	PAQ_6_desc:"帝国必须规划好如何面对她的敌人们。"
	PAQ_7:"月光黯淡"
	PAQ_7_desc:"[PA1.getname]是个弱小的国家，也许帝国应该先从这里下手。"
	PAQ_8:"分崩离析"
	PAQ_8_desc:"妖精们始终处于分裂的状态，帝国将使她们被迫“统一”。"
	PAQ_9:"为了帝国，冲锋！"
	PAQ_9_desc:"为了女皇与帝国，让我们的士兵发起冲锋！"
	PAQ_10:"稳扎稳打，保存实力"
	PAQ_10_desc:"与混沌的交易是一把双刃剑，帝国必须尽可能保存实力应对更多战斗。"
	PAQ_11:"逐个击破"
	PAQ_11_desc:"妖精各族位置分散且缺乏统一指挥，帝国可以轻易将她们逐个击破。"
	PAQ_12:"毁灭打击"
	PAQ_12_desc:"管她那么多干什么！直接一路碾压过去就好了！"
	PAQ_13:"王冠落地"
	PAQ_13_desc:"中美在南美的前哨站已经被帝国清除。"
	PAQ_14:"栖息之地不复存在"
	PAQ_14_desc:"大仇得报，妖精国度已经不复存在。"
	PAQ_15:"腐蚀蔓延"
	PAQ_15_desc:"该面对真正强大的对手了。"
	PAQ_16:"少女终幕"
	PAQ_16_desc:"魔法少女们自以为能够凭借与圣杯的联盟与我们抗衡，帝国会用强大的军力碾碎她们的幻想！"
	PAQ_17:"魂飞云散"
	PAQ_17_desc:"夜莺是个畸形的国度，亡灵们不该存在于凡世！"
	PAQ_18:"内心恐惧"
	PAQ_18_desc:"帝国必须通过战争的力量激发出魔法少女们内心深处的恐惧。"
	PAQ_19:"噩梦再临"
	PAQ_19_desc:"“魔女之夜”似乎是魔法少女们的心头大患，如果女皇用诡计的力量让她们陷入幻觉的话..."
	PAQ_20:"利用亡灵"
	PAQ_20_desc:"混沌的力量可以支配一部分亡灵为女皇所用，帝国军官们可以从中得知亡灵们的弱点。"
	PAQ_21:"长生腐蚀"
	PAQ_21_desc:"为何不试试长生的力量呢？如果混沌为不死者延续寿命会发生什么呢，真令人好奇..."
	PAQ_22:"联盟之死"
	PAQ_22_desc:"魔法少女的联盟不该存在于这里。"
	PAQ_23:"夜莺终曲"
	PAQ_23_desc:"亡灵们得以真正安息。"
	PAQ_24:"王国哀歌"
	PAQ_24_desc:"莉兰迪亚王国的暴君残忍镇压了公社的起义，这可能会是帝国最为棘手的敌人。"
	PAQ_25:"公社末日"
	PAQ_25_desc:"野火革命军的疯狂扩张令女皇十分担忧，帝国必须遏制红色势力的继续壮大。"
	PAQ_26:"混沌侵蚀"
	PAQ_26_desc:"莉兰迪亚内部并不稳定，腐蚀她们会很轻松。"
	PAQ_27:"正面击破"
	PAQ_27_desc:"帝国强大的军队可以直接从正面击败她们，不需要混沌的更多帮助。"
	PAQ_28:"更多契约"
	PAQ_28_desc:"或许女皇可以借由色欲的力量，腐蚀莉兰迪亚的底层人民..."
	PAQ_29:"再见，莉兰迪亚"
	PAQ_29_desc:"无论是王国还是公社，都将共同埋葬。"
	PAQ_30:"南美王座"
	PAQ_30_desc:"终于，在经过一番长久的战争后，女皇带领帝国扫清了所有的敌人，统一了南美！"
	PAQ_31:"偿还之日"
	PAQ_31_desc:"这样下去不是办法：混沌诸神开始索取越来越多的东西，但女皇不可能保证每一场战争都取得胜利，她必须在此刻做出抉择。"
	PAQ_32:"卡丘军官团的分歧"
	PAQ_32_desc:"卡丘军官团的将军们在一些军事问题上发生了分歧，她们请求皇帝做出决断。"
	PAQ_33:"支持剪刀手组织"
	PAQ_33_desc:"剪刀手鼓励步兵战术。"
	PAQ_34:"支持乌尔比诺财团"
	PAQ_34_desc:"乌尔比诺财团鼓励综合战术。"
	PAQ_35:"支持欧泊防卫局"
	PAQ_35_desc:"欧泊鼓励陆空协同战术。"
	PAQ_36:"重视凡人军队"
	PAQ_36_desc:"毫无疑问，凡人军队是帝国的根基，我们必须重用凡人军队。"
	PAQ_37:"超弦体军队？"
	PAQ_37_desc:"关于这一点，卡丘军官团提议女皇可以试试她们世界的超弦体军队..."
	PAQ_38:"支持混沌军队"
	PAQ_38_desc:"混沌军队的强大是有目共睹的，重用混沌军队才能让帝国战无不胜。"
	PAQ_39:"针对魔法少女联盟"
	PAQ_39_desc:"魔法少女联盟是帝国的首要目标。"
	PAQ_40:"首要敌人是莉兰迪亚"
	PAQ_40_desc:"帝国最强大的敌人是莉兰迪亚。"
	PAQ_41:"必须排除外界势力"
	PAQ_41_desc:"来自外部的敌人才是女皇最应该警觉的。"
	PAQ_42:"设立仆从国"
	PAQ_42_desc:"帝国应该在南美以外的土地上设立混沌仆从国。"
	PAQ_43:"统一管理"
	PAQ_43_desc:"女皇不需要仆从国，所有土地都属于混沌诸神。"
	PAQ_44:"工业基础"
	PAQ_44_desc:"作为南美工业实力最强的国家，我国的工业基础决定了其发展上限就注定不低。"
	PAQ_45:"扩建首都工业区"
	PAQ_45_desc:"阿德莱希城一直是南美北部最大的城市，其占地面积之大允许我们建造更多的工业设施。"
	PAQ_46:"强迫企业巨头合作"
	PAQ_46_desc:"企业巨头必须与国家合作，她们别无选择。"
	PAQ_47:"乌尔比诺财团的实验"
	PAQ_47_desc:"南瓜头先生有一些很有意思的想法，女皇会允许她们自行实验。"
	PAQ_48:"军工业扩张"
	PAQ_48_desc:"为了应对接下来的大战，国家需要更多武器。"
	PAQ_49:"支配企业利润"
	PAQ_49_desc:"在混沌的支配下，任何人都必须成为国家的齿轮。"
	PAQ_50:"新型能源"
	PAQ_50_desc:"乌尔比诺财团的研究有了成果，一种新型能源准备投入使用。"
	PAQ_51:"大规模工业建设"
	PAQ_51_desc:"建设更多的工厂。"
