# 诡计线渐进堕落事件链
 paq.81.t: "第一次妥协"
 paq.81.d: "收复边境失地的作战会议开得不顺。参谋部给的伤亡预估是两万到两万五千人。帝国刚打完内乱，根本经不起这种放血。\n\n散会后，格蕾在办公室坐到天黑。桌角压着一份没署名的方案，不知是谁夹在公文里送进来的。上面把艾尔孚利登和妖精联军后勤点的位置标得清清楚楚，连几名主和派官员的私人行程都有。方案的建议很直接：找一队死士换上妖精的衣服，把那几个主和派做掉，再往饮水点投毒。只要两边互相猜忌闹起来，帝国主力不用硬啃就能推过去。\n\n格蕾看得很反胃，可一想到那两万多人的阵亡预估，手还是按在了印泥上。\n\n刚走出门，克雷和马克就在走廊里把她拦住了。\n\n“格蕾，名单里有一半是不拿枪的文官。”克雷捏着刚发下去的密令，脸色很难看，“这种下三滥的路数，跟以前那些旧贵族有什么区别？”\n\n马克凑过来翻了翻方案背面：“而且这情报哪来的？连收发室的章都没盖，谁递给你的？”\n\n“我不管谁递的，有用就行。”格蕾把参谋部的伤亡评估塞进克雷手里，“正面硬打，这两万多人就得埋在林子里。我父母当年就是这么没的。脏我一个人的手，能换他们活着回来，这笔账怎么算都值。就这一次，等边境拿回来，这些暗线我亲手撤掉。”\n\n克雷盯着那串数字看了半天，最后叹了口气，侧身让开了路。马克站在原地没走，多看了两眼密令纸角那个奇怪的蓝色水印，打算私下查查这东西的来头。"
 paq.81.a: "“为了少死人，就这一次。”"

 paq.82.t: "空椅子"
 paq.82.d: "前线的仗打得太顺，“就这一次”很快变成了十几次。只要照着脑子里冒出来的念头布置，敌人就接二连三往口袋阵里钻。\n\n彻底撕破脸是在森林北部的收官战。为了把妖精主力咬在包围圈里，格蕾扣下了南线诱饵营和野战医院的撤退通知。等克雷察觉不对、违抗军令杀进去救人的时候，阵地早被两边的炮火犁了一遍。艾玛满身是血地坐在弹坑边，周围全是没救回来的伤兵。\n\n那天半夜，克雷闯进了政务院。他把领口的勋章扯下来砸在桌上，红着眼质问格蕾，为什么敌军前脚刚进谷，我方重炮后脚就砸在了自家野战医院头上，连标尺都不用调。\n\n格蕾张了张嘴，对上他的目光又咽了回去。艾玛连楼都没上，第二天就申请调去南方最偏僻的伤兵医院，从此断了联系。\n\n克雷走到门口，停下来问了一句：“马克呢？这半个月怎么一直没见着他？”\n\n“我派他去外地查军饷了呀。”格蕾脱口而出。等门摔上，她却愣住了：自己到底是哪天派马克出去的？\n\n半个月前，马克顺着那个蓝色水印摸进了情报局地下室。他在里头没找到什么线人，只翻出一摞写满暗杀和构陷计划的原稿，字迹他熟得很，全都是格蕾亲手写的。马克没能走出那间地下室，而格蕾关于那天的记忆却被抹得干干净净。\n\n又过了几天，安娜半夜端茶推开议事厅的门，手里的托盘差点摔在地上。长桌边明明一个人都没有，格蕾却笑着给旁边的四把空椅子倒茶，嘴里还轻声商量着战后怎么给平民减税。撞见安娜通红的眼眶，格蕾脸上的笑僵了一下，耳边忽然响起了一阵低低的窃笑。"
 paq.82.a: "“他们只是出去忙了，打完仗就会回来的。”"

 paq.83.t: "碎镜中的最后清醒"
 paq.83.d: "南美平定的那天夜里，首都到处都在放烟花。格蕾没去庆功会，一个人穿过长廊，走向皇宫最里头的中枢参谋室。\n\n路过偏殿时，早就没人理睬的薇莉安正靠在栏杆上看烟花。听见脚步声，她连头都没回，随口笑了一声：“戏都唱完了，还不去后台看看自己身上拴着几根线吗，代理人小姐？”\n\n格蕾没接话，推开了参谋室的门。月光从琉璃彩窗透进来，屋里很静。她走到桌边，摸出怀里当年在荒原上拆开的无字纸条，顺手翻开了桌上摞成山的历年密令卷宗。\n\n借着月光，她看清了纸上的字。那些她一直以为是“神秘线人”递来的情报、那些害死无数人的毒计原稿，笔迹全都跟她自己一模一样。而无字纸条的衬纸夹层里，正隐隐透出一枚九羽印记。当年老仆人送来爷爷的遗书时，第二张纸条早在半路被人掉了包；马克留在地下室桌缝里的半截血字、克雷砸在桌上的勋章、安娜躲着她走的眼神，这些被她刻意忘掉的事，这一刻全回到了脑子里。\n\n她猛地抬头望向墙边的镜子。镜子里哪有什么参谋室，她身后的中枢祭坛上，一团泛着诡异蓝光的契约核心正一明一暗地跳动着，无数看不见的丝线穿过彩窗连向整个南美。从打开那个纸条起，她干的每一件事，全都是在替诡计之神搭台唱戏。\n\n耳边的笑声越来越响，留给她清醒的时间没几秒了。中枢祭坛上的契约核心就在手边，砸碎它，靠阴谋维持的南美统治就会当场反噬崩塌，整个阿德莱希也会跟着陪葬。"
 paq.83.a: "“滚出我的脑子！就算毁掉一切，我也要挣脱你！”"
 paq.83.a_tt: "§R极低概率（10%）挣脱诡计之神的掌控——但反噬将令全南美所有旧国家原地独立围攻，阿德莱希彻底崩溃灭亡！§!\n§C绝大多数情况（90%）反抗失败，彻底陷入纯粹的疯狂……§!"
 paq.83.b: "“……呵呵，何必再演戏呢？这盘棋，才刚刚开始。”"

 paq.84.t: "破碎的自由"
 paq.84.d: "随着一声震碎琉璃彩窗的尖啸，格蕾亲手毁掉了中枢祭坛上流淌着诡谲幽光的契约核心。刹那间，连诡计之主都露出了片刻的错愕。\n\n然而，建立在诡计与亚空间丝线之上的庞大霸权，也在同一秒轰然坍塌。全国各地的情报网瞬间失控，被强行压服的南美诸国——从妖精森林到魔法少女联盟、从夜莺荒原到莉兰迪亚——几乎在同一夜揭竿而起，无数复仇的火焰从四面八方吞没了彻底瘫痪的阿德莱希。\n\n没有英雄凯旋，也没有美好的明天。格蕾坐在满地碎玻璃中，久违地流下了一滴滚烫的眼泪——至少在帝国彻底化为灰烬的这一刻，她是清醒的。"
 paq.84.a: "“这样……也好。”"

 paq.85.t: "万变之主的嗤笑"
 paq.85.d: "一声愉悦而戏谑的笑声在虚空深处轰然炸响。所谓“清醒”，不过是万变之主为剧本添上的最后一段精彩插曲。\n\n镜面彻底粉碎，昔日那位怀揣正义梦想的老元帅孙女终于彻底消散。重新抬起头来的少女嘴角勾起优雅而癫狂的弧度——整个南美已经尽在掌中，而这片棋盘之外，还有更加广阔的旧世界正等待着她亲手拨乱命运的丝线。"
 paq.85.a: "“赞美万变之主——现在，轮到全世界起舞了。”"

