modifier_army_sub_unit_paq_hundunemo_org_recovery_cap_factor: "£army_morale_texticon 混沌恶魔组织度恢复"

#事件
paq.1.t: "大萧条波及南美"
paq.1.d: "作为南美为数不多的工业国，帝国不可避免的遭受了大萧条带来的影响。"
paq.1.a: "我不想听这些消息！"
paq.2.t: "选择主要信仰"
paq.2.d: "女皇需要选择一个混沌神明作为帝国的主要信仰，这会让帝国得到该神明的赐福并极大改善与该神明的关系，除了立刻获得的赐福之外，在之后的事件中女皇也可以获取各种相对应的增益。同时，我们之后有一次更换主要信仰的机会，但更换主要信仰会严重损害女皇与前主要信仰的关系。所以在选择主要信仰前，务必思考周全。"
paq.2.a: "战争"
paq.2.b: "诡计"
paq.2.c: "色欲"
paq.2.e: "长生"
paq.3.t: "更换主要信仰"
paq.3.d: "更换主要信仰会极大损害与前信仰神明的关系，请谨慎选择！"
paq.2.f: "我不换了"
paq.4.t: "选择次要信仰"
paq.4.d: "除了主要信仰之外，女皇还可以选择一位神明作为次要信仰：虽然帝国可以获得该神明的赐福效果，但我们无法从事件中获得其对应的增益，同时也无法获得次要信仰的最高赐福效果。次要信仰无法更换，想好了再做选择。"
paq.5.t: "战争赐福升级"
paq.5.d: "前线源源不断送回来的阵亡名单和战报让战争之神非常满意。作为对[PAQ.Getleader]四处征战的奖赏，更强的血神赐福降到了帝国军队身上。"
paq.5.a: "正合我意"
paq.6.t: "战争赐福降级"
paq.6.d: "最近前线的动静太小，战争之神对[PAQ.Getleader]的怠慢很不满，直接收回了之前赐给军队的力量。"
paq.6.a: "得尽快找下一场仗打了"
paq.7.t: "战争赐福升级"
paq.7.d: "靠着最近几场硬仗流出的血，战争之神总算消了气，收回了之前对[PAQ.Getleader]降下的惩罚。"
paq.8.t: "战争赐福降级"
paq.8.d: "[PAQ.Getleader]的消极怠战彻底惹恼了战争之神。原本降在军队身上的赐福一夜之间全变成了反噬的诅咒。"
paq.9.t: "诡计赐福升级"
paq.9.d: "接二连三的算计和阴谋合了诡计之神的胃口。祂很欣赏[PAQ.Getleader]的手腕，给帝国赐下了更深的庇护。"
paq.10.t: "诡计赐福降级"
paq.10.d: "诡计之神嫌[PAQ.Getleader]近来的手段太笨拙乏味，随手撤回了之前给帝国的赐福。"
paq.11.t: "诡计赐福升级"
paq.11.d: "最近几手漂亮的暗算重新讨好了诡计之神，祂收回了之前对[PAQ.Getleader]的惩戒。"
paq.12.t: "诡计赐福降级"
paq.12.d: "[PAQ.Getleader]的愚蠢举动彻底惹怒了诡计之神，原本的赐福当场变成了让人发疯的诅咒！"
paq.13.t: "色欲赐福升级"
paq.13.d: "全国上下弥漫的狂热和享乐风气让色欲之神非常受用，祂欣然向[PAQ.Getleader]赐下了更多恩宠。"
paq.14.t: "色欲赐福降级"
paq.14.d: "色欲之神嫌现在的帝国死气沉沉、半点乐子都没有，直接收回了之前给的赐福。"
paq.15.t: "色欲赐福升级"
paq.15.d: "重新热闹起来的宴会和献祭哄好了色欲之神，祂撤回了之前对[PAQ.Getleader]的惩罚。"
paq.16.t: "色欲赐福降级"
paq.16.d: "[PAQ.Getleader]的冷淡彻底激怒了色欲之神，赐福转眼变成了折磨全国上下的诅咒！"
paq.17.t: "长生赐福升级"
paq.17.d: "长生之神对[PAQ.Getleader]这段时间的虔诚供奉很满意，给帝国降下了更深厚的长生赐福。"
paq.18.t: "长生赐福降级"
paq.18.d: "长生之神觉得[PAQ.Getleader]近来不够虔诚，撤回了此前赐给帝国的庇护。"
paq.19.t: "长生赐福升级"
paq.19.d: "新献上的病灶和祭品让长生之神重新露出了笑脸，此前对[PAQ.Getleader]的惩罚被收回了。"
paq.20.t: "长生赐福降级"
paq.20.d: "[PAQ.Getleader]的所作所为严重冒犯了长生之神，原本护佑信徒的赐福直接变成了要命的瘟疫诅咒！"
paq.21.t: "诸神之争"
paq.21.d: "战争之神嫌色欲的信徒只知道享乐不肯上战场，色欲之神则嘲笑战争的疯子只懂砍杀。两边吵得不可开交，同时逼[PAQ.Getleader]表态站队。"
paq.21.a: "支持色欲"
paq.21.b: "支持战争"
paq.22.d: "诡计之神一直在算计着打破现有的僵局，长生之神却只喜欢按部就班的腐朽与循环。两位神明再次起了冲突，[PAQ.Getleader]必须得挑一边站。"
paq.22.a: "支持诡计"
paq.22.b: "支持长生"
paq.23.t: "诸神恩赐"
paq.23.d: "不知是不是亚空间里难得心情不错，四位神明今天都没发脾气，反而同时向[PAQ.Getleader]抛出了橄榄枝。不过这好处每次只能挑一家领。"
paq.23.a: "战争"
paq.23.b: "诡计"
paq.23.c: "色欲"
paq.23.e: "长生"
paq.24.t: "四神争斗"
paq.24.d: "亚空间里的四位神明突然吵成了一团，谁也不服谁。祂们一致逼着[PAQ.Getleader]出来选一个支持，但不管帮谁说话，另外三位肯定都不会给好脸色看。"
paq.24.a: "支持战争"
paq.24.b: "支持诡计"
paq.24.c: "支持色欲"
paq.24.e: "支持长生"
paq.25.t: "激怒四神"
paq.25.d: "伺候四位脾气古怪的神明总有疏忽的时候。最近帝国的一项政令不小心踩了某位神明的忌讳，这位发火的神明是……"
paq.25.a: "战争"
paq.25.b: "诡计"
paq.25.c: "色欲"
paq.25.e: "长生"
paq.26.t: "诸神争端"
paq.26.d: "四位神明这回罕见地分成了两拨掐架，一边是主张大动干戈的战争与诡计，另一边是偏爱慢慢侵蚀的色欲与长生。[PAQ.Getleader]只能选一边帮腔。"
paq.26.a: "战争与诡计"
paq.26.b: "色欲与长生"
paq.27.t: "战争与色欲"
paq.27.d: "战争之神今天直接在[PAQ.Getleader]脑子里大骂色欲之神是个只会坏人军心的软骨头，要求帝国少跟色欲那套东西扯上关系。"
paq.27.a: "战争说得对"
paq.27.b: "我不许你诋毁色欲！"
paq.27.c: "战争和色欲都不太行"
paq.28.t: "诡计与长生"
paq.28.d: "诡计和长生天生就合不来，一边天天想折腾新花样，一边只想着把所有东西熬成一锅烂泥。到底哪一位才更值得帝国倚重？"
paq.28.a: "诡计会指引我们"
paq.28.b: "长生像一位慈父"
paq.28.c: "诡计和长生都不太行"
paq.29.t: "诡计之神的奖励"
paq.29.d: "诡计之神突然主动找上门来，说愿意白送帝国一份大礼。当然，祂的条件也很有祂的风格：去给另外三位神明里的一位添点堵。"
paq.29.a: "降低与战争的关系"
paq.29.b: "降低与色欲的关系"
paq.29.c: "降低与长生的关系"
paq.30.t: "战争赐福"
paq.30.d: "战争之神对近期的献祭很满意，向帝国的军工厂和前线部队降下了新的赐福。"
paq.30.a: "太好了"
paq.33.t: "诡计赐福"
paq.33.d: "诡计之神回应了祭坛上的祈求，把一部分亚空间里的隐秘知识赐给了帝国。"
paq.33.a: "太好了"
paq.36.t: "色欲赐福"
paq.36.d: "色欲之神很喜欢近期献上的祭礼，给帝国上下赐下了让人干劲倍增的欢愉赐福。"
paq.36.a: "太好了"
paq.39.t: "长生赐福"
paq.39.d: "长生之神接纳了这段时间的供奉，向帝国的土地和军队降下了顽强的生命力。"
paq.39.a: "太好了"
paq.42.t: "神罚"
paq.42.d: "[PAQ.Getleader]和主要信仰神明的关系已经跌到了冰点。盛怒的神明直接降下神罚，把原本的赐福全改成了折磨帝国的诅咒！"
paq.42.a: "我们会悔改的"
paq.43.t: "卡丘军官团的分歧"
paq.43.d: "来自“卡拉彼丘”世界的将领分为三个派系：欧泊是原世界的统治机构，她们在军事上主张陆空协调与科技进步。剪刀手是主要反对势力，她们主张人海战术与步兵作战。乌尔比诺财团是中立方，她们在军事上倾向于各取所长。各方所支持的战术都有其长处和短处，[PAQ.Getleader]需要亲自决定军队后续的发展方向。"
paq.43.a: "知道了"
paq.44.t: "期限已到"
paq.44.d: "四神定下的最后期限已经到了，可[PAQ.Getleader]答应献上的胜利和祭品却还没影……"
paq.44.a: "“不，再给我一些时间！”"
paq.0.t: "游玩须知"
paq.0.d: "在开始游戏之前，请先确保你能接受以下内容：\n1.主路线剧情较少，战败线剧情更多。\n2.国策整体数量偏少，部分国策时间较长，主要内容集中在决议上。\n3.纯反派定位，无洗白内容，无美好结局。\n4.混沌四神捏他自中古战锤混沌四神，部分细节有所改动。\n5.纯粹的数值与战斗，与其他国家几乎没有宣战和渗透之外的交互。\n\n若您无法接受以上提到的内容，则不建议游玩该势力。"
paq.0.a: "我知道了"
paq.45.t: "广泛起义"
paq.45.d: "虽然女皇成功洗刷了第四次扩张战争失败的耻辱，但帝国的快速扩张为统治带来了不小的隐患。即使[PAQ.Getleader]陛下拥有混沌给予的神力，依然无法快速镇压各地的反抗势力，帝国需要一段时间来镇压这些反抗帝国统治与混沌神明的起义。"
paq.45.a: "好吧"
paq.46.t: "[PAQ.Getleader]遭到反噬"
paq.46.d: "阿德莱希帝国的女皇[PAQ.Getleader]凭借混沌的力量让我们节节败退，但她最终自食恶果，被混沌的力量所吞噬。而由混沌力量组成的帝国军队陷入混乱，现在正是我们反击的最佳时机。"
paq.46.a: "开始反攻！"
paq.47.t: "起义被镇压"
paq.47.d: "随着帝国军队的快速行动，起义已经被彻底镇压，现在[PAQ.Getleader]陛下可以继续她的伟大征途了！"
paq.47.a: "很好"
paq.48.t: "向战争索取更多奖励"
paq.48.d: "战争之神对[PAQ.Getleader]的表现非常满意，准许[PAQ.Getleader]再额外挑一项趁手的好处。（提示：获得的效果默认隐藏）"
paq.48.a: "更强大的军队"
paq.48.b: "更便宜的装备"
paq.48.c: "生产更多装备"
paq.49.t: "向诡计索取更多奖励"
paq.49.d: "诡计之神很欣赏[PAQ.Getleader]近来的手腕，准许[PAQ.Getleader]从祂手里再多讨一样本事。（提示：获得的效果默认隐藏）"
paq.49.a: "隐藏帝国的情报"
paq.49.b: "获取他国的情报"
paq.49.c: "抵抗无处遁形"
paq.50.t: "向色欲索取更多奖励"
paq.50.d: "色欲之神非常喜欢[PAQ.Getleader]，大方地准许[PAQ.Getleader]再额外提一个要求。（提示：获得的效果默认隐藏）"
paq.50.a: "臣民努力工作"
paq.50.b: "疯狂鼓励生育"
paq.50.c: "减少国家开销"
paq.51.t: "向长生索取更多奖励"
paq.51.d: "长生之神对[PAQ.Getleader]关怀备至，愿意再额外赐给帝国一份实用的恩惠。（提示：获得的效果默认隐藏）"
paq.51.a: "更强壮的士兵"
paq.51.b: "强化的生产线"
paq.51.c: "军队更多补给"
paq.52.t: "四神的奖励"
paq.52.d: "难得四位神明今天对[PAQ.Getleader]最近干的事都很满意，破天荒地一起给帝国赏了点甜头。"
paq.52.a: "太好了！"
paq.53.t: "四神的惩罚"
paq.53.d: "亚空间里的四位神明最近不知道又因为什么破事吵翻了天，结果拿[PAQ.Getleader]当出气筒，平白无故受了顿牵连……"
paq.53.a: "无妄之灾"
paq.54.t: "寻欢作乐"
paq.54.d: "色欲之神嫌现在的阿德莱希太闷了，催着帝国多办几场通宵达旦的狂欢宴会找点乐子。"
paq.54.a: "不可以涩涩"
paq.54.b: "遵从色欲的指示"
paq.55.t: "长生的奖励"
paq.55.d: "长生之神很满意[PAQ.Getleader]近期的作为，顺手给帝国多降下了一点赐福。"
paq.55.a: "感谢长生之神"
paq.56.t: "色欲之神的奖励"
paq.56.d: "色欲之神闲得发慌，想给帝国送点好处找乐子，不过条件是要去恶心一下另外三位神明里的一个。"
paq.56.a: "降低与战争的关系"
paq.56.b: "降低与诡计的关系"
paq.56.c: "降低与长生的关系"
paq.57.t: "战争渴望鲜血"
paq.57.d: "战争之神只喜欢看血流成河的场面，可眼下帝国偏偏没在打仗，祂已经开始不耐烦地催要祭品了……"
paq.57.a: "为战争献上祭品"
paq.57.b: "不能把普通人当成祭品"
paq.57.c: "快去找色欲来！"
paq.58.t: "战争与色欲和解"
paq.58.d: "平时见面就掐的战争与色欲最近居然消停了一阵子，趁着两边心情都不错，[PAQ.Getleader]正好在中间捞了一笔好处。"
paq.58.a: "太好了！"
paq.59.t: "诡计与长生和解"
paq.59.d: "一向死对头的诡计和长生最近难得没吵架，夹在中间的[PAQ.Getleader]也跟着松了口气，顺便白捡了一点恩赐。"
paq.59.a: "好！"
paq.60.t: "诡计之神的别称"
paq.60.d: "色欲之神今天心血来潮，非要让[PAQ.Getleader]当面评价一下诡计之神到底是个什么货色。"
paq.60.a: "千变万化"
paq.60.b: "千恋万花"
paq.60.c: "全知全能"
paq.60.e: "骗术大师"
paq.61.t: "释放自我"
paq.61.d: "色欲信徒搞出来的花样越来越多，最近不少教徒大白天就在街上胡搞，连路人都看不下去了。要不要派宪兵管一管？"
paq.61.a: "无需干涉信徒行为"
paq.61.b: "要注意公众形象"
paq.62.t: "拒绝和平"
paq.62.d: "全国上下太久没听见炮声了，战争之神非常火大，在[PAQ.Getleader]耳边咆哮着要求立刻见血。"
paq.62.a: "战争期间也没见你啊"
paq.62.b: "我们会进行反省"
paq.62.c: "为战争献上祭品"
paq.63.t: "思想统一"
paq.63.d: "既然已经是阿德莱希手底下的仆从国了，国内的信仰自然也得跟宗主国看齐，老老实实改信混沌诸神。"
paq.63.a: "好的"
paq.64.t: "边境危机"
paq.64.d: "在原妖精领土与远征军的边境上，面对保护了部分妖精的圣杯远征军，帝国军队与其之间的摩擦越来越多。由于帝国境内的全面动乱，我们暂时无法发动全面战争，不过彼此之间的擦枪走火就难以避免了。"
paq.64.a: "我们之后再处理她们"
paq.65.t: "与混沌帝国的边境冲突"
paq.65.d: "近期[PAQ.getname]的军队在边境线上频繁挑事，两边的哨所随时可能擦枪走火。"
paq.65.a: "这或许是了解混沌的好机会"
paq.66.t: "挑衅成功"
paq.66.d: "我军在边境冲突里狠狠教训了对面一顿，前线部队的实战经验又扎实了不少。"
paq.66.a: "好"
paq.67.t: "略胜一筹"
paq.67.d: "我们的边防部队打退了前来挑衅的帝国军，顺便摸清了不少混沌部队的底细。"
paq.67.a: "好事"
paq.68.t: "边境冲突战败"
paq.68.d: "前线部队在刚刚结束的边境冲突里吃了亏，没能占到便宜就退了回来……"
paq.68.a: "总结经验"
paq.69.t: "偿还之日"
paq.69.d: "薇莉安终有一天要偿还代价，而这天马上就要到来。现在她面临两个选择：要么向四神恳求，继续延长回报的时间；要么否定四神，与四神为敌。前者是更为妥当的选择，至于后者，有人砍过战争，有人骗过诡计，色欲力量较弱，长生会因世间人类健康而衰弱，那薇莉安也有机会摆脱四神..."
paq.69.a: "四神给予了我一切，违抗它们的后果不堪设想"
paq.70.t: "四神的回应"
paq.70.d: "四神似乎对萌心世界逐渐失去了兴趣，这也许和薇莉安彻底征服了南美有关，也可能是因为它们本就对这个世界兴致不高。当四神得知薇莉安的请求时，它们几乎想都没想，就达成了一致：混沌诸神将不再向薇莉安索取报酬，而她如果想对外部的秩序世界展开更大规模的战争，四神也依然会给予其支持，因为她已证明了自己的能力。"
paq.70.a: "赞美四神"
paq.71.t: "最终选择"
paq.71.d: "这将是[PAQ.Getleader]面临的最终选择，选择留守南美意味着永世安宁，养精蓄锐，可以等到四神再度注视之时再重新开始行动。而选择准备发动对外部秩序世界的入侵不一定能得到四神口头答应的支援，毕竟它们已经失去了相当多的兴趣..."
paq.71.a: "......"
paq.72.t: "古怪瘟疫"
paq.72.d: "我国突然开始流行起一种古怪的疾病，任何医学专家都无法得知它是如何出现的..."
paq.72.a: "太糟糕了"
paq.74.t: "四神的弃子"
paq.74.d: "一切都结束了，薇莉安输掉了与敌人的战斗，即使对方是那么弱小，她也依旧输掉了这场战争。四神对薇莉安失望透顶，看来薇莉安没有能力给四神献上祭品，仅凭阿德莱希境内的“情感”是远远不够的，混沌四神开始物色新的代理人..."
paq.74.a: "“不！再给我一次机会！”"
paq.75.t: "被选中者们-其一"
paq.75.d: "莱娅从以前的部下那里听说了薇莉安最近的失利，作为女皇的亲姐姐，她终于不用再躲来躲去了。\n“殿下，这是您登上皇位的绝佳机会，四神已经抛弃了小公主！”\n“我知道，因此才要做好完全准备。还有多少人忠于我？”\n“小公主倒台前，只有一个师倾向于您。但在她失势之后，军队里大部分人都在观望，等待您出面接管大权。不过……一部分军队仍受托莉娜总主教直接指挥，这群人是正统派的死士，不会认可我们。”\n“你说什么？正统派？”莱娅的眼神骤然冷了下来，几乎就在一瞬间，剑锋一闪，下属的脸颊被划开一道血口，鲜血顺着下颌滴落，染红了他的衣领。“我才是正统派！我是第三顺位的皇位继承人！其他人都被薇莉安杀光了，现在只有我有资格坐上那个位置。再让我听到'正统派'三个字从你嘴里冒出来，我会直接把你的头砍下来，拿去献给血神！”\n下属捂着伤口，浑身发抖地跪倒在地，不敢再说一个字。"
paq.75.a: "......"
paq.76.t: "被选中者们-其二"
paq.76.d: "同一时刻，帝国东部一座小城。教堂的彩窗投下斑驳的光影，修女莉娅跪在圣坛前，对抗着色欲的诱惑。“来吧，拥抱欢愉吧！你不必再隐藏自己了！”\n“又来了……”莉娅咬紧牙关，额头渗出冷汗。“为什么你的声音越来越清晰？”\n自从薇莉安失势，欢愉王子的低语便如潮水般涌来，每时每刻都在蛊惑她成为色欲大军的领头人。她拼命抵抗，但那份甜美而堕落的快感，正一点点侵蚀她的意志。\n更令她不安的是——当地军队早已被教会完全控制，而教堂的神父早已不知去向。\n“打扰了，请问莉娅修女在吗？”一个陌生的声音打断了她的祈祷。来人穿着信使的制服，看起来不像本地人。\n“在的，我就是。”\n“这里有一封来自首都的信件，托莉娜总主教亲笔。”信使将信递到莉娅手中。就在指尖相触的瞬间，那人忽然涨红了脸，目光慌乱地移开。“那、那我就不打扰了……还请您仔细阅读大主教的信。”\n信使几乎是逃也似的离开了教堂，留下莉娅困惑地站在原地。\n她拆开信封：“亲爱的莉娅修女，我从下级处收到多封推荐信，鉴于你在当地的优秀表现，我决定正式提拔你为帝国东部大主教，管辖本区域一切宗教事务。你或许会对这种跨级提拔感到不解甚至不安，但请不必担心——你的优秀有目共睹。在此之前，你需要来首都见我一面，我将通过正式流程完成对你的任命。”"
paq.76.a: "......"
paq.77.t: "被选中者们-其三"
paq.77.d: "帝国边境的密林中，枪声骤起。“听说叛军就在这附近？”“是啊，据说是长生派系的——等等，你看那边！”\n一群畸形的纳垢灵从林间冲出，紧随其后的是一群衣衫褴褛却目光狂热的人类。帝国士兵仓促应战，双方瞬间绞杀在一起。\n叛军领袖黛丽·达威站在高地上，冷眼看着下方的厮杀。她仅用一个月就召集起这支大军——一群被帝国抛弃的人，信仰着长生之神，誓要将这个腐败的国家彻底摧毁。她握紧手中的武器，母亲倒下的那一幕、父亲被带走时的背影……所有记忆在这一刻翻涌上来。\n“等着吧，薇莉安，我很快就会来了。”"
paq.77.a: "......"
paq.78.t: "被选中者们-其四"
paq.78.d: "帝国西北，一处废弃的军营中。\n“这国家现在已经成这样了吗？”一名青年环顾四周，语气中满是失望。“不仅腐败，甚至遍地污秽。”\n“马克，你又不是第一天生活在这里了。”旁边的克雷抱着双臂，“就这样的军队，输掉跟小国家的战争也不奇怪。”\n“所以我们才要拯救她啊。”领头的金发女孩转过身来，目光坚定。“拯救这个被混沌腐蚀的国家。”\n“格蕾，我知道你爷爷是赫赫有名的老元帅，但我们几个人，拿什么去对抗整个帝国？”同行的艾玛眉头紧锁。\n“大小姐会有办法的——这也是各位会聚集在此的原因，不是吗？”女仆安娜微笑着说。\n格蕾从怀中取出一封泛黄的信。“爷爷在国外临终前托人给我寄了遗书。里面除了他的吩咐和留给我的遗产，还有一封写给几位故旧将领的信——他们至今仍手握兵权，且始终不认可混沌的统治。”\n“等等，你是说……”马克瞪大了眼睛。“一封纸条就能解决我们的问题？格蕾姐，你没开玩笑吧？”\n“是啊格蕾，虽然不愿打击士气，但我们确实胜算渺茫。仅靠一腔热血，赢不了战争。”克雷摇了摇头。\n朋友们面面相觑，眼中仍有疑虑。但格蕾却笑了。\n“你们应该乐观一点。并不是所有人都被混沌腐蚀了——只要召集起全国上下的正义之士，我们一定能击败那些邪神。而且，我不会只依赖爷爷留下的东西。现在小公主被四神抛弃，如果我们能借此机会将她挽回，让她重新走上正轨……那我们一定能拯救阿德莱希。”"
paq.78.a: "......"
