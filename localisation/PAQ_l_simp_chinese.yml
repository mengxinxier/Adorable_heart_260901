# 阿德莱希的妹神官（PAQ_70）玩家专属剧情事件链 (paq.86 ~ paq.102)
# =============================================================================
 paq_70_laiya_win: "莱娅在叛军火并中胜出"
 paq_70_daili_win: "黛丽在叛军火并中胜出"
 paq_70_liangbaijushang: "莱娅与黛丽的叛军两败俱伤"
 paq_gelei_mad_portrait_tt: "§R格蕾陷入疯狂§!"

 paq.86.t: "狭路相逢"
 paq.86.d: "天刚蒙蒙亮，西部的红土官道上就扬起了尘土。莱娅的部队一路往东赶，所有人都是冲着阿德莱希城去。\n\n前锋刚拐过山口，风里忽然飘来一股说不出的腐甜味。还没等斥候看清林子里藏着什么，灌木丛里先滚出几十只绿皮矮怪，尖叫着往路上扑。它们后面密密麻麻站满了衣衫破烂的人，手里攥着生锈的农具和抢来的旧步枪。\n\n副官好不容易勒住受惊的马，急忙凑到莱娅旁边：“殿下，是长生派的叛军！探子说他们也反对薇莉安，也是往首都去的，要不要喊个话，叫他们让条路？”\n\n莱娅连马缰都没收，顺手抽出了佩剑。\n\n“让路？跟一帮靠瘟疫造反的泥腿子借道？”她嗤笑一声，剑尖往林子那边一指，“这国家姓阿德莱希，挡在正统继承人面前的，管他反谁，统统算逆贼。传令散开阵型，一个别放跑。”\n\n土坡另一头，黛丽·达威也看清了官道上那面铁十字旗。旁边的起义军小头目压低嗓子问：“首领，听说带队的是二公主莱娅，她不仅之前没死，还跟薇莉安有血仇，不是首都派来剿咱们的，要不要先撤回林子避避？”\n\n黛丽盯着那身熟悉的帝国军装看了好一会儿。\n\n“都是皇室的人，穿的还是那身吃人的皮，换谁坐上去有区别吗？”她声音平平的，听不出什么火气，“害死我父母的，从来不只是皇宫里那个小疯子。既然自己送上门来了，就叫他们连同旧帝国一块烂在这儿吧。”\n\n两边谁也没再废话。第一发炮弹很快砸进了树林，硝烟和惨绿色的毒雾搅在一处。虽然都跟薇莉安势不两立，可血神的兵跟长生的教徒凑一块儿本来就是火星撞油桶，转眼就在荒野里杀红了眼。战局一路绞杀到午后，眼看就要分出个死活。"
 paq.86.a: "莱娅的正规军略胜一筹"
 paq.86.b: "黛丽凭借混沌恶魔取得了优势"
 paq.86.c: "谁也没占到便宜，两败俱伤"

 paq.87.t: "西门风波"
 paq.87.d: "刚过正午，阿德莱希城西门外已经堵得水泄不通。前线败仗接二连三，各地又闹叛乱，城防查得比平时严了十倍。商队、逃难的乡民全挤在门洞外晒太阳，几个挎着步枪的检查员慢悠悠地翻包，动不动就骂两句。\n\n“查个证能磨蹭到天黑。”马克双手抄在兜里，踢飞一颗石子，“前线打妖精跑得比兔子还快，刁难自家老百姓倒挺来劲。”\n\n“行了，少惹事。”克雷习惯性地扫了眼周围，话说到一半忽然停住，“等下，前头好像闹起来了。”\n\n队伍最前面，三个检查员把一个穿黑白修女服的精灵姑娘堵在了石墩边。她低着头，几缕银发从头巾边垂下来，在灰扑扑的人群里格外显眼。领头那个胖子捏着她的信晃来晃去，就是不盖章，眼睛直往人家领口瞄：“法二国籍的精灵修女？啧，你这信上的章看着怪怪的。这样吧，跟我进值班室核对一下，里头凉快，耽误不了你多少工夫。”\n\n说着，一只油乎乎的手就往她肩膀上搭。莉娅吓得往后一缩，后背直接撞上城墙砖，双手死死攥着胸前的十字架：“请、请您别碰我……那是托莉娜总主教亲笔写的召见信，上面有大教堂的火漆……”\n\n“手拿开。”\n\n格蕾挤开看热闹的人，直接插到两人中间，顺手把一枚刻着夏普家徽和老元帅军章的银牌拍在胖子胸口。\n\n“格蕾·冯·夏普。大教堂请来的客人你们也敢拦着占便宜？把你名字和编号报上来，我现在就去城防司令部问问，是谁教你们这么当差的。”\n\n老元帅这块牌子在首都还没彻底失效。胖子看清银章，脸上的横肉抖了一下，立刻换上笑脸连声赔罪，双手把信奉还。格蕾接过来递给莉娅，语气松了下来：“没事吧？最近城里不太平，进去以后尽量走大路。”\n\n“谢、谢谢小姐……愿神明保佑您。”莉娅匆忙鞠了个躬，连头都没怎么抬，拿回信就快步钻进城门，很快没影了。\n\n“一群蛀虫，回头见了大主教非得说说这事。”格蕾拍拍手招呼同伴进城，走出去几步才发现少了一个人，“哎，马克？发什么呆呢？”\n\n落在后头的马克还盯着人家消失的街角，听见喊声才猛地回过神，耳根有点发红，干咳两声小跑跟上：“没、没什么！就觉得刚才没踹那胖子两脚，怪可惜的！”\n\n他嘴上胡扯着，脑子里却还停在刚才那姑娘抬头道谢的模样，怎么晃都晃不出去。"
 paq.87.a: "进城办正事要紧。"

 paq.88.t: "授职仪式"
 paq.88.d: "阿德莱希城中心的大教堂高得让人发怵。午后光线从彩绘玻璃透下来，大厅里点了极浓的熏香，闻久了脑袋发沉。\n\n红毯尽头，代行国政的托莉娜大主教亲自出来迎接。她穿着素白教袍，笑得很客气，一点架子都没有：“一路辛苦了，莉娅修女。东部教区的举荐信我都看了，越是乱世，帝国越需要像你这样得民心的神职人员。”\n\n唱诗班唱完圣歌，托莉娜亲手把象征东部大主教权柄的银权杖和红绸任命书交到她手里。换了别人，这大概是一辈子求不来的荣光，可莉娅握着冰凉的权杖，后背却直冒冷汗。\n\n圣歌一停，大殿安静得古怪。她甚至能听见四周有人咽口水，还有压不住的粗重呼吸。\n\n莉娅硬着头皮用余光扫了眼两侧，心一下凉了半截。不管是柱子边站着的年轻神父、拎着长戟的卫兵，还是前排衣冠齐整的帝国官员，全都在死死盯着她，连眼睛都不眨。那根本不是看上司或者大主教的眼神，更像是饿极了的人盯着一盘端上桌的肉，赤裸、滚烫，直往她脖颈、手腕和修女服的腰身上刮。\n\n她手指抠紧权杖，浑身发僵，恨不得当场扔下东西跑出去。偏偏在这时候，脑子深处那个又轻又腻的声音又贴着耳朵响了起来。\n\n“你看，莉娅，满屋子的人都在馋你呢。你生来就该被这么捧着、盯着、迷恋着，干嘛还把自己裹在黑袍子里哆嗦？”"
 paq.88.a: "“闭嘴……我不要这种眼神！”"

 paq.89.t: "孤城末路"
 paq.89.d: "进城才半个月，格蕾就凭着爷爷留下的老面子和一腔实诚，拿到了托莉娜大主教的信任。等她真正走进皇宫大殿，见到那个让半个南美闻风丧胆的小女皇时，却只看见薇莉安歪在宽大的王座上发呆，眼皮都懒得抬一下。\n\n“爱怎么折腾就怎么折腾吧。”薇莉安懒洋洋地摆了摆手，像是在打发苍蝇，“四神都不要我了，这破摊子谁爱收拾谁拿去。”\n\n话就这么轻飘飘地落了地，帝国的权柄交到了格蕾手里。可她连办公桌上的公文都没理顺，防空警报就响遍了全城。在西部踏平长生叛军的莱娅一路东进，黑压压的部队转眼就把阿德莱希城围了个严实。\n\n指挥部里，电报机响了一整夜。格蕾以老元帅孙女和皇室的名义发出去几十封勤王令，结果连半个回电都没有。\n\n“不对啊，周边四个军区，还有爷爷当年的老部下呢？”她抓着话筒不肯放。克雷慢慢挂掉旁边那部电话，脸色难看得要命：“别打了，格蕾。城南哨卡刚才发回最后一条明码电报，外面的兵昨晚全倒向莱娅了。现在全国的军队只认她。”\n\n退无可退，众人只能靠着残破的城防死撑。重炮把大道轰得面目全非，莱娅手下那群沾了血神赐福的兵跟不知疼的疯狗一样，一批倒了又爬上来一批。\n\n战线撑到第三天就彻底垮了。艾玛在西街救一个伤兵，连人带担架被迫击炮掀进了瓦砾堆；克雷死顶着侧翼的缺口没往后退半步，等援军赶到时，他身上插着几把刺刀，两只手还死死箍着一个敌兵的腰。退到皇宫石阶下时，一挺机枪突然从街角扫了过来，马克红着眼把格蕾撞进门廊，自己仰面栽倒，张了张嘴连句整话都没来得及说完。最后连一直寸步不离的安娜也替她挨了一发流弹，软倒在她怀里，小声念了句“大小姐，活下去”，手就垂了下去。\n\n整条街最后只剩格蕾一个人。她满脸血污，拎着克雷留下的断刀，拖着发软的腿朝围上来的刺刀冲过去。\n\n可就在子弹和刀锋落到身上的前一拍，她脚边突然炸开一道幽蓝的光，空气像被扯皱的布一样扭了一下。冲上来的士兵扑了个空，满地碎砖里，人凭空没了影。谁也没看清是怎么回事，阿德莱希城就在这片错愕里彻底陷落。"
 paq.89.a: "一切都结束了"

 paq.90.t: "新皇登基"
 paq.90.d: "五天后，中央广场上挤满了被赶来观刑的军民。炮火熏黑的旗杆上重新挂起铁十字旗，木头搭的刑台摆在正中间。\n\n薇莉安被两个卫兵架了上去。见着当年唯一逃出屠杀的亲姐姐，这个失宠的小女皇既没哭也没求饶，甚至没回头多看皇宫一眼，安安静静跪下去闭上了眼。莱娅提着剑走过去，居高临下地看着她，声音通过扩音器传遍广场。\n\n“当年你踩着兄姐的骨头爬上王座，今天我拿你的血给他们赔罪。”\n\n剑起剑落，干脆利索。莱娅甩掉剑刃上的血，举剑面向黑压压的人群，宣布自己是阿德莱希唯一正统的皇帝。广场上哄地乱成一片，前排几个旧派军官扯着嗓子欢呼，后头胆小的百姓被血气熏得发抖不敢抬头，更多人扛不住她身上那股逼人的杀气，腿一软，稀里哗啦跪倒了一大片。\n\n加冕仪式刚散场，皇宫门外忽然吵了起来。一个浑身干涸血污、光着脚的金发姑娘摇摇晃晃走上台阶，正是城破那天凭空不见的格蕾。\n\n卫兵端着枪围上去，刺刀都快戳到胸口了，她连躲都不躲。她眼神散得没了焦距，歪着头小声念叨马克、克雷、艾玛和安娜的名字，念着念着又突然捂住脸“咯咯”笑起来，在空荡荡的大殿里听得人后脊发凉。\n\n王座上的莱娅单手支着下巴，饶有兴致地看了她半晌，忽然低笑了一声。\n\n“老元帅最宝贝的孙女，居然自己找上门了。把剑还给她，留在我手下吧。真打起仗来，一条彻底疯掉的恶犬，比满嘴仁义的骑士好用多了。”"
 paq.90.a: "阿德莱希换了新主人"

 paq.91.t: "绿雾围城"
 paq.91.d: "进城这半个月，托莉娜大主教对格蕾信任有加，至于皇宫里的薇莉安，早已一副等死的做派，二话不说就把千疮百孔的政务全甩给了这位老元帅的孙女。\n\n可还没等新班子理出个头绪，噩梦就先到了城下。在西部打垮莱娅的黛丽·达威带着黑压压的腐蚀军团一路压境，厚重发黏的腐绿雾气很快糊住了城外每条大路。电报线被疯长的霉菌蚀断，派出去报信的骑兵一扎进绿雾就再没音讯，整座首都转眼成了孤岛。\n\n“顶住！别放它们翻过街垒！”格蕾满脸黑灰，手指扣扳机扣得生疼。可扑上来的纳垢灵和起义军根本不怕疼，胸口挨了枪照样咧着嘴往前爬。克雷肩膀挨了一口毒液，烂得见了骨头，还是死压着机枪不肯挪窝；后头的急救点早就塌了，艾玛药箱翻空，连干净绷带一沾雾气都发黑发臭，最后连同伤员一起被涌进来的绿雾吞没。街垒被撕开的时候，马克抄起一根铁棍嚎叫着替安娜挡在前面，两个人转眼就被密密麻麻的腐朽人影扑倒。\n\n这是一场一点指望都没有的死仗。枪声渐渐稀落下来，伙伴们倒在格蕾眼前，很快被潮湿发臭的菌毯盖住。退到宫墙根的格蕾攥着空枪准备拼命，脚下却突然炸开一道没人注意到的蓝光，眨眼就把她整个人抽离了这座炼狱，自此音讯全无。\n\n城门在锈蚀和腐烂里轰然塌了。黛丽·达威踩着掉在地上的铁十字旗缓步进城，看着那些在绿雾里发抖瘫软的帝国贵族和卫兵，神色平静得出奇。\n\n“爸，妈……这个吃人的国家，总算完蛋了。”她轻声念了一句，“往后，所有人都能在慈父怀里平平安安待着了。”"
 paq.91.a: "旧帝国成了腐土"

 paq.92.t: "兵发城西"
 paq.92.d: "靠着老元帅的余荫和诚意，格蕾没费多大劲就取得了托莉娜大主教的信任。皇宫里的薇莉安更是彻底摆烂，连奏折都懒得翻，大手一挥就把军政大权全交给了格蕾。\n\n可新政还没来得及铺开，一匹跑得口吐白沫的战马就冲进了指挥部院子。满身泥点的侦察队长翻身滚下来，跌跌撞撞跑进大厅：“格蕾大人，出大事了！半个月前莱娅和黛丽在西边拼了个两败俱伤，可两边现在都收拢了残部，正沿着南北两条官道往首都扑呢！”\n\n厅里顿时炸了锅，格蕾反倒精神一振，一把按住桌上的地图：“两败俱伤？那正是老天爷留给我们的机会！绝不能缩在城里等他们合围。克雷、马克、艾玛、安娜，马上点齐首都主力随我出城，趁他们没缓过劲，在野外各个击破！”交代完，她又郑重向托莉娜行了个礼，“大主教，我带兵出去这段时间，城里的政务和治安就全托付给您了。”\n\n大队人马很快开出西门，全城的目光和防务也跟着挪到了城外。没人注意大教堂最里头那间拉严窗帘的偏殿，独自留守的莉娅正蜷在冰凉的地砖上，浑身直哆嗦。\n\n“唔……哈啊……”修女服的领口全被冷汗濡透了。一股说不出口的燥热和细痒从骨头缝里往外拱，像是有什么温热的东西正贴着皮肤来回蹭，磨得她手脚发软、喘不上气。脑子里的声音比以往任何一次都清晰，软绵绵的，带着笑意。\n\n“格蕾已经带兵出城了，没人再盯着你啦，莉娅。忍成这样图什么呢？松开手吧，顺着这份感觉走，让整座城都陪你一块快活去……”\n\n莉娅指尖死抠着砖缝，牙关咬得咯咯响，连呼吸都开始发烫。"
 paq.92.a: "哪怕咬破嘴唇也要忍住！"
 paq.92.b: "别再折磨自己了……放手吧。"

 paq.93.t: "大梦初醒"
 paq.93.d: "也不知过了多少天，莉娅只觉得自己像泡在一场又热又甜的紫色大梦里，浮不上去也醒不过来。等她好不容易挣出一点神智，推开偏殿大门走上石阶时，眼前的一切让她僵在了门口。\n\n外头的阿德莱希城已经认不出来了。天色泛着不正常的紫红，风里全是呛人的甜香。往日肃穆的大教堂广场和街道上，贵族、教士、卫兵和平民全都衣衫不整地缠在一块纵情享乐，喘息和大笑顺着巷子到处飘。几个瘫在台阶边的人眯着眼瞧见莉娅，竟猛地扑过来跪伏在地，声音发颤地喊着同一个名号：“圣女大人！”\n\n“圣女……这半个月我到底干了什么……”莉娅脸色发白，下意识往后退了半步，脚踝却碰到了一具硬邦邦的身体。\n\n她低头一看，浑身血液一下凉了。石阶阴影里躺着个没了呼吸的年轻人。那张脸她记得，半个月前在西门口跟着那位金发小姐帮自己解过围，好像叫马克。人早就凉透了，可脸上还挂着一抹满足得吓人的笑，竟是在极乐里活活耗干了命。离他几步远的地方，当年跟他一块来的那几个伙伴也早就丢了魂，正毫无顾忌地纠缠在一起，唯独到处都不见格蕾的影子。\n\n莉娅捂住嘴，疯了似的往皇宫跑，想找托莉娜大主教问清楚。可推开议事厅大门，里面早已乱成一团。一向端庄守礼的托莉娜衣衫散乱地倒在人群中，连站都站不起来。瞧见莉娅冲进来，她一面喘着粗气，一面满脸潮红地把最高权杖推到莉娅怀里，笑着把整个国家拱手送了出去。\n\n空旷的大殿最里头，只有被冷落的薇莉安还坐在高高的王座上，单手托着腮，百无聊赖地往下瞧，仿佛满殿荒唐都跟她没半毛钱关系。"
 paq.93.a: "我昏迷的时候到底发生了什么......"

 paq.94.t: "荒原僵局"
 paq.94.d: "偏殿里，莉娅狠心咬破下唇，靠着满嘴血腥味硬把那股邪火压了下去。\n\n五天后，带主力急行军出城的格蕾在西郊丘陵撞上了重整旗鼓的莱娅。\n\n开打前，莱娅独自骑马晃到阵前。甲胄上还留着干掉的血垢，她抬眼打量着对面的金发姑娘，冷哼一声：“老元帅的孙女？少犯糊涂了，我才是阿德莱希正统的皇帝。薇莉安那疯丫头杀光兄姐抢了位置，你替个篡位者卖什么命？现在带兵投过来，以前的事我全不计较。”\n\n格蕾的手下意识按在胸口。爷爷留下的第一张纸条里写得明明白白，小公主薇莉安本性不坏，是被欺负狠了才叫邪神钻了空子，务必设法把她拉回正道。再看眼前这位二公主，满身藏不住的戾气，国家落她手里只会血流成河。\n\n“我绝不投降！”格蕾拔出佩剑指着她，“你比薇莉安还要嗜血，把帝国交给你，老百姓只会死得更惨！”\n\n“行，那就拿你的脑袋祭血神。”莱娅懒得再废话，挥剑下令开火。\n\n头半天，刚跟长生军拼过的叛军确实有些显乏，首都军借着锐气稳住了阵脚。可仗越打越不对劲：莱娅手里本来就是帝国老牌精锐，沾了血神的赐福更是越打越红眼，越死人喊杀声越响。反观首都军，几轮硬碰硬下来伤亡不小，士兵眼见怎么都打不垮这帮疯子，军心很快散了。\n\n天黑休战后，指挥帐篷里的气氛闷得让人发慌。\n\n“格蕾，听我的，马上撤回城里。”克雷按着渗血的绷带指着地图，“兵心已经散了，在野外跟这帮疯子硬耗必输。退回去靠城防工事打，咱们还有机会。”\n\n“胡扯！现在退了才真完蛋！”马克一拍桌子站起来，急得脖子发红，“克雷你忘了后头还有谁？黛丽那帮长生怪物正往这赶呢！趁莱娅还没完全缓过来，咬牙在这把她拖垮！缩回城里被两家前后一夹，全得死里头！”\n\n旁边正擦手术刀的艾玛抬起头，声音很稳：“硬打打不过，回城怕被围。既然两家恨不得吃对方的肉，不如边打边往南撤，把莱娅往黛丽那边引。只要他们先掐起来，我们就能喘口气，甚至坐收渔利。”\n\n安娜端着凉掉的茶站在桌旁，忧心忡忡地看着没吭声的格蕾。\n\n外头零星落着冷炮，三个主意各有各的道理。格蕾皱着眉抬手按了按胸口，指尖隔着衣料碰到一个硬实的小布包。她这才想起来，爷爷临终托人送来的遗物里，除了那封早就拆开的遗书，还一直封着第二个没动过的纸条。"
 paq.94.a: "不退！就地死守，把莱娅拖垮在这儿！"
 paq.94.b: "先撤回阿德莱希城，靠城防再打。"
 paq.94.c: "往南边退，引莱娅去撞上黛丽。"
 paq.94.e: "打开爷爷留下的第二张纸条"

 paq.95.t: "夜袭崩盘"
 paq.95.d: "没过十天，事实就狠狠扇了原地死守一记耳光。\n\n士气本来就见底，还硬逼着部队跟血神精锐拼消耗，防线很快从里头烂穿了。伤兵躺在泥沟里没人顾得上，夜里冷枪冷炮没完没了，成排的士兵趁黑溜号。到第八天，甚至有几股逃兵走前直接抢空了辎重帐篷，把全军最后几天的口粮全卷跑了。整条战线彻底断了顿。\n\n第十天半夜，寒雾压得很低，连哨兵都饿得靠在战壕壁上打盹。盯了好几天的莱娅亲自带着人摸了过来，火光和惨叫眨眼就吞了大营。饿得没力气的首都军根本组织不起抵抗，一冲就散。黑灯瞎火里，格蕾的几个伙伴连凑到一块的机会都没有，有的还在梦里就挨了刀，有的仓促抓起家伙拼命，到底架不住人多，全倒在了泥水里。等天亮清点战场，叛军却发现一桩怪事：抵抗的人尸首一具不少，偏偏把整座营盘翻了个底朝天，也没找着格蕾本人。\n\n“跑了？算她命大。”莱娅甩净剑上的血，干脆利落地拔营东进，直扑没了屏障的阿德莱希城。\n\n可真等这位大胜的二公主勒马停在城门外，向来冷硬的脸上却少见地露了怯。城墙根下七零八落堆着大批自己瓦解掉的纳垢灵干尸，整座首都浸在一层诡异的紫红雾气里。甜得发晕的风从大敞的城门洞往外灌，没一会儿，她身后的百战老兵就开始眼神发直，稀里哗啦扔了步枪。\n\n不过两天，连这位嗜血傲慢的战争神选自己也没能顶住。刀剑也好，瘟疫也罢，最后全栽在了欢愉的甜风里。"
 paq.95.a: "所有人都被她钻了空子..."

 paq.96.t: "孤城断援"
 paq.96.d: "格蕾咬牙下了撤退令。全靠克雷带着人拼死断后，被打残的部队才勉强退回阿德莱希城。一进城门，格蕾连甲都没来得及卸就冲进电报室，搬出皇室和老元帅的名号，向全国各军区连发十万火急的勤王令。\n\n发报机响了一宿，发出去的求救信全像石沉大海。外头的驻军将领早看清了风向，个个干脆地倒向了血脉正统、打仗又猛的二公主莱娅。\n\n五天后莱娅兵临城下，重炮没费多大力气就把城门轰成了碎石。更要命的消息紧跟着传来：黛丽的长生叛军压根没能摸到首都，半路就被莱娅顺手收拾掉了。绝望之下，格蕾和伙伴们退进内城打巷战，可兵力装备差得太远，身边的兵和朋友接二连三倒下去。眼看再硬撑下去，剩下这几个浑身是血的伙伴也要全交代在这儿，格蕾红着眼看了大家一眼，到底还是松了手。佩剑当啷一声砸在石板上，她选了投降。\n\n硝烟还没散，满身血渍的莱娅大步走过来，眼神冷得吓人：“扛到这份上，算你们有种。可惜败者没活路，全拉下去毙了。”\n\n行刑的卫兵齐刷刷拉响枪栓。格蕾闭上眼，准备和大家一块上路。可枪还没响，已经转过身的莱娅却忽然抬手喝了一声停。她回过头，盯着这几个伤得站都站不稳、临死还彼此护着的年轻人看了好几秒，冷哼一声收剑入鞘。\n\n“算了，先留着吧，全押大牢里去。”"
 paq.96.a: "“对不起大家……真的尽力了。”"

 paq.97.t: "观刑"
 paq.97.d: "五天后，中央广场戒备森严，全城军民都被叫来见证旧时代落幕。\n\n失宠的薇莉安被押上高台。面对亲姐姐的利刃，她从头到尾没吭一声，安安静静迎来了早就猜到的结局。长剑落下，莱娅高举血刃，在逼人的血神威压里宣告自己才是阿德莱希唯一正统的皇帝。台下人声嘈杂，有欢呼的，有吓得浑身发冷的，更多人扛不住那股凶悍气势，直接跪了下去。\n\n广场一侧的木栅栏后面，解了绳索、被带出来观刑的格蕾静静看着台上那个猩红的身影。风卷着尘土打在脸上，她心里沉甸甸的，满是说不出的憋屈。小公主没救回来，爷爷的遗愿也全落了空。\n\n可微微一偏头，看见旁边缠着厚厚绷带、好歹都还喘着气的马克、克雷、艾玛和安娜，心口那股差点把人逼疯的绝望慢慢沉了下去。\n\n她长叹一口气，垂下眼睛，认了这个改不了的结局。高台上的新女皇似乎察觉到了这边的动静，远远瞥来一眼。既然老元帅的孙女脑子还清醒，这把好剑往后就留给帝国用吧。"
 paq.97.a: "旧梦醒了，铁血女皇坐上了王座"

 paq.98.t: "空欢喜"
 paq.98.d: "听了艾玛的主意，格蕾带着首都军跟莱娅缠斗了整整十天。\n\n部队化整为零，一会儿袭扰侧翼，一会儿故意卖个破绽，硬把火冒三丈的血神军团一路往南拽。十天没怎么合眼的奔波拉扯，格蕾到底卡准了火候，把急着决战的莱娅和缓缓压过来的黛丽长生军全引到了同一条窄山谷里。两拨本来就仇深似海的人迎头撞上，哪还顾得上首都军，当场就在谷底杀得天昏地暗。\n\n格蕾带主力摸上高地喘了口气，等底下两家拼得筋疲力尽、尸横遍野，养足精神的首都军一声号响冲下去，痛痛快快收了尾。莱娅和黛丽虽然各自靠亲卫拼死保着逃了出去，可经此一败脸面丢尽，四神大概也懒得再理她们，往后再也掀不起浪。\n\n“赢了！格蕾姐，咱们真把他们全办了！”马克乐得一把将帽子甩上天，克雷、艾玛和安娜也跟着笑开了花。众人意气风发地班师回朝，可刚走到能望见阿德莱希城门的地方，队伍前头的笑声就一点点停了下来。\n\n高大的城门洞敞开着，既没仪仗也没来迎的百姓。诡异的紫红雾气正顺着街巷往外漫，甜得人脑仁发疼，城里来来往往的人全都眼神涣散、衣衫不整，放浪的笑声和喘息隔着老远就能听见。几人顿觉不妙，急着冲进城想救场，却一头扎进了躲不开的迷香里。\n\n不过三天，格蕾就在这座彻底失控的首都里没了踪影。没了主心骨，剩下的伙伴也没能扛住那股甜腻的诱惑，一个个丢掉理智，彻底沦陷在了城里。"
 paq.98.a: "打赢了城外所有强敌，却丢了身后那座城"

 paq.99.t: "白纸"
 paq.99.d: "帐篷里油灯一跳一跳的。格蕾深吸一口气，当着所有伙伴的面扯断火漆，拆开了爷爷留下的第二张纸条。\n\n泛黄的纸条摊在地图上，帐里一下子静得针掉地上都听得见。纸上干干净净，半个字也没有。\n\n“空的？”马克凑过头瞪大眼，“老元帅临走前忘写了，还是装错纸了？”\n\n格蕾却盯着那张白纸一动不动。说不清怎么回事，目光落在白纸上的那一刻，脑子里乱成一团的战局忽然透亮得吓人，一个连她自己都觉得离谱的念头直接冒了出来。\n\n“传令，全军马上集合。”格蕾猛地抬头，“今晚不退也不守，全军直扑敌阵右翼那道隘口！”\n\n满帐篷的人都以为听岔了。克雷一把攥住她手腕，声音都变了调：“格蕾你疯了？兵都快散架了，这时候强攻就是拉大伙去送死！”\n\n格蕾说不出理由，她也压根解释不清，只是反手握住同伴发凉的手：“再信我这一回。我保证，这一次老天站在我们这边。”\n\n接下来的事连她自己回想起来都觉得玄乎。首都军硬着头皮杀穿敌军右翼，居然不偏不倚撞上了莱娅亲临前线督战的指挥点。格蕾反应极快，低声叫潜伏在草丛里的狙击手盯紧敌将，自己直接冲到最显眼的地方大声喊话，硬把莱娅的目光全勾了过去。\n\n好斗的莱娅一眼就盯上了她，提剑大步迎上来冷笑：“有两下子啊，老元帅的孙女，连我在这儿都摸到了！自己送上门，那就不客气了！”\n\n一声枪响划破夜空，暗处的狙击子弹稳稳钻进莱娅肩胛，溅起一蓬血雾。可顶着血神赐福的二公主连晃都没晃，反而咧着嘴挥剑劈来。\n\n热兵器不管用，格蕾只能硬着头皮提剑接招。凡人和混沌神选哪是一个量级，没过几招就被打得节节败退，被莱娅一脚踹翻在泥水里，带血的剑锋直接压上咽喉。生死一线，格蕾闭上眼在心里拼命念着爷爷的名字，盼着谁能拉一把。\n\n轰的一声，明明晴朗无云的夜空居然劈下一道刺眼的蓝光，一道不知打哪儿来的魔法结结实实砸在正要挥剑的莱娅身上。焦烟里，战争神选闷哼一声扑倒在地，浑身抽搐动弹不得。格蕾顾不上疼，翻身扑上去按住她，冰凉的剑锋反抵在了莱娅脖子上。\n\n周围叛军亲眼看着战无不胜的二公主被当场活捉，瞬间乱了套，纷纷丢枪投降。躺在泥里的莱娅喘着粗气看了一眼夜空，冷笑一声松开手，倒也光棍，认了这个阶下囚的命。\n\n硝烟还没散尽，全军上下一片欢腾，可麻烦还没完。黛丽的长生叛军正一步步逼近，眼下该怎么走？"
 paq.99.a: "弟兄们都打乏了，先回首都休整。"
 paq.99.b: "趁热打铁，全军立刻去迎击黛丽！"
 paq.99.c: "别再跟那股直觉拧着来了，听天由命吧。"

 paq.100.t: "窄巷"
 paq.100.d: "算准黛丽那支长生军走得慢，格蕾带得胜之师抢先回了阿德莱希城。一进门就顾不上歇，赶紧叫上托莉娜和一众官员开会，商量怎么收编俘虏、补足军备、重整城防。\n\n扯皮的会议从下午拖到天擦黑。向来最烦官僚腔的马克坐在角落里浑身难受，干脆偷偷溜出议事厅，顺着石板街散步透气。刚拐进一条没人的窄巷，他脚步猛地停住了。\n\n昏暗的巷尾墙根下，那个自西门初见后就一直放不下的精灵修女莉娅，正单手撑着砖墙发抖。她的头巾有点歪，脸颊烧着不正常的红，喘得又急又乱，看着难受极了。\n\n“莉娅修女？”马克心里一紧，什么都顾不上想，几步跑过去扶住她肩膀，“你怎么一个人躲在这儿？发烧了吗？我带你去找艾玛瞧瞧——”\n\n话没说完，一直低着头的莉娅忽然抬起了脸。那双原本胆怯清亮的眼睛已经彻底染成了紫红。她没回答，只是轻笑着伸出滚烫的胳膊勾住马克的脖子，踮起脚尖直接吻了上去。甜香扑面而来，马克浑身一僵，眼神很快散了。没多久，两个人影便相拥着隐进了巷子深处。\n\n傍晚散会，格蕾迟迟找不着马克，心里隐隐发毛，赶紧带着克雷、艾玛和安娜上街寻人。可走出皇宫不到两条街，几个人的心就一点点凉了下来。街上的行人个个神情迷离、举止失态，抬头一看，首都上空不知什么时候已经染上了一层妖异的紫红。\n\n三天后，姗姗来迟的黛丽带着长生军走到城外，迎面撞上的却是一座彻底变了味的城市。攻城令还没出口，随风飘来的甜香先钻进了军阵。她眼睁睁看着自己手下狂热的起义军一个个扔掉家伙、迷迷糊糊地抱在一起，就连成群结队的纳垢灵也在紫雾里发出细弱的哼唧，接连化作一滩滩烂泥。到最后，连长生军也没能跨进城门一步。"
 paq.100.a: "功亏一篑"

 paq.101.t: "徒步归途"
 paq.101.d: "这一回，格蕾赌输了。\n\n刚打完一场恶仗的首都军早就精疲力竭、弹药见底，碰上以逸待劳又不知痛楚的黛丽长生军，几乎一触即溃。漫山遍野的绿雾和疫军很快冲烂了防线，格蕾的伙伴们在泥泞和毒瘴里拼死撑着，到底寡不敌众，死伤惨重。更糟的是，后营一乱，被押着随军的莱娅趁机挣脱绳索，抢了匹马一头扎进烟尘跑没了影。\n\n眼看大势已去、身边的朋友接连倒下，浑身挂彩的格蕾攥紧武器，已经打定主意留在这儿拼到最后。可就在畸形的利爪扑到脸前的那一刻，她眼前猛地一黑，彻底断了片。\n\n不知过了多久，格蕾大口喘着气惊醒过来，四周安静得吓人。炮声、惨叫、绿雾全没了，她孤零零躺在一条完全陌生的荒凉山谷里。爬起来四处找了一圈，嗓子喊哑了也没人回应，马克、克雷、艾玛和安娜一个都不在。\n\n她也顾不上琢磨自己是怎么被弄到这儿的，辨清方向就拖着伤腿往回走。饿了啃野果，脚底磨出血泡也咬牙硬撑，日夜不停地只盼着早一天赶回首都。\n\n几天后，耗干最后一点力气的她终于爬上能望见阿德莱希城的山脊。可抬头看清山脚下那片轮廓时，她整个人僵在了风里。\n\n曾经宏伟的首都已经彻底烂透了，头顶压着厚厚的腐绿色浓云，塌了一半的城墙和街道之间，密密麻麻爬满了长生恶魔和打滚傻笑的纳垢灵。她还是来晚了。"
 paq.101.a: "一个人走回来，故都早已面目全非。"

 paq.102.t: "庆功宴"
 paq.102.d: "面对进退两难的死局，格蕾闭上眼睛，干脆不再跟脑子里那股莫名清晰到诡异的直觉拧着来了。\n\n她铺开地图，下令主力部队沿着黛丽长生军的必经之路设伏。每一处炮位、每一道交叉火网、每一条退路都标得细致离谱，随行的老军官面面相觑，私下里直犯嘀咕，怀疑这位大小姐是不是在这片荒野里闭着眼走过几百趟。安顿好前线伏兵，格蕾没留下来等捷报，反而脸色发沉，悄悄带着马克、克雷、艾玛和安娜连夜赶回了阿德莱希城。\n\n刚拐过内城街角，一股甜得腻人的异香就扑了过来。果然跟她预感的一样，色欲的毒已经渗进了首都，源头就在大教堂圣坛上。修女莉娅赤着脚站在高台中央，双眼泛着迷离的紫红，周身缠着粉紫色的魔力，早已神智不清。\n\n“莉娅修女，你醒醒！”看着藏在心里的姑娘变成这样，马克握着家伙的手直抖，怎么都下不去手。\n\n“马克，别犯傻！”格蕾厉声喝住他，挥剑劈散迎面涌来的香雾，“现在站那儿的不是那个修女，是要吞掉整座城的怪物！再心软，明天全城几十万人全得完蛋！”\n\n马克咬了咬牙，终于稳住手脚。艾玛先甩出两瓶醒神药剂打散浓雾，克雷从侧面抄过去封住退路，格蕾带着马克和安娜正面压上，五个人费了老大劲，才把失控的莉娅按倒制服。随着狂暴的紫红魔力散掉，莉娅眼里的迷离一点点退去，竟缓缓回过了神。看清满殿狼藉，她后怕得蹲在地上哭个不停，一遍遍向格蕾和大家道谢。窗外压在城头的紫红雾气也很快散尽，重新露出了蓝天。\n\n没过多久，城门外响起一片欢呼，前线主力得胜归来了。黛丽的长生军压根没想到会在必经之路上撞进这么严密的口袋阵，被打了个措手不及，死伤惨重、溃不成军。\n\n格蕾就这么硬生生把濒死的阿德莱希从鬼门关拽了回来。皇宫大殿上，冷眼旁观了全程的小女皇薇莉安破天荒下了道诏书，正式封格蕾为“女皇代理人”，把帝国一切政务全交给了她。\n\n当晚皇宫里摆起庆功宴，灯火通明。马克、克雷、艾玛和安娜围着微笑的格蕾举杯畅饮，热热闹闹聊着没有混沌、没有腐败的新日子。满堂笑声里，谁也没留意被特邀出席的薇莉安正独自缩在昏暗的角落。她晃着手里一口没动过的红酒，静静盯着灯光下满怀希望的年轻人，对着酒杯低声嘀咕了一句。\n\n“不过是……四神的一场游戏罢了。”"
 paq.102.a: "“阿德莱希的明天，总算守住了！”"

# =============================================================================
# 诡计线（格蕾）进线后扩写剧情事件 (paq.103 ~ paq.110)
# =============================================================================
 paq.103.t: "出奇的顺利"
 paq.103.d: "新政推行的第一个月，顺利得有点反常。\n\n以前在议事厅里天天扯皮的旧官僚，现在半句废话都没有；克雷去整编城防军，几个刺头将领第二天就交了兵权告老还乡；连最难查的军需烂账，格蕾翻开账本扫一眼就能直接圈出亏空在哪儿。大教堂那边，大病初愈的莉娅修女也辞了大主教的职务，搬去城郊修道院清修去了。\n\n这天下午，格蕾拿着刚拟好的改革章程去偏殿见薇莉安。她始终记着爷爷信里的交代，想拉这个小女皇一把。\n\n偏殿里没点灯，薇莉安窝在沙发里撕废纸玩。听格蕾认真讲完往后的规划，她停下手，上下打量了格蕾半天，噗嗤笑出了声。\n\n“夏普家的小姐，你真以为底下那帮老狐狸是怕你才这么乖的？”薇莉安用手指敲了敲太阳穴，“以前我刚坐上去那会儿，也觉得自己聪明绝顶，算计谁都一算一个准。你现在觉得顺手，回头有你哭的时候。”\n\n格蕾皱了皱眉，只当她还在说气话，把章程放在桌上就退了出来。"
 paq.103.a: "她受了太多刺激，慢慢引导吧。"
 paq.103.b: "不管为什么听话，政令能推下去就行。"

 paq.104.t: "空白档案"
 paq.104.d: "为了防备境外间谍和混沌余孽，格蕾把旧帝国的宪兵队改组成了情报总局。她特意立了规矩，所有抓人和监听的命令都得经她签字，不许再搞以前贵族私设黑狱那一套。\n\n总局挂牌那天，负责清理旧大楼的工程副官跑来找她，把一串旧钥匙搁在桌上。\n\n“大人，这楼底下不太对劲。”副官压低声音汇报，“图纸上写着地下只有两层，可工人刚才在配电室后面敲开一堵假墙，里头还有间没登记过的档案室。架子上摆了一百多本蓝皮卷宗，属下翻了好几本，全是白纸，半个字都没有。”\n\n格蕾跟着他下到地下室，随手从架子上抽出一本翻开。在副官眼里空无一物的纸页，在她眼里却写满了一行行黑字：朝中大臣的私下交易、边防军官的赌债、甚至还有几个将领没来得及动手的串通计划。\n\n“确实是空的。”格蕾合上本子，神色如常地递回架上，“大概是以前没用完的备品。把门锁上，钥匙交给我，叫刚才下去的工人别往外传。”\n\n副官敬了个礼先上去了。格蕾在地下室站了几秒，把那串钥匙揣进了衣袋。"
 paq.104.a: "留着吧，上面的东西迟早用得上。"
 paq.104.b: "太邪门了，锁起来别再翻。"

 paq.105.t: "假电报"
 paq.105.d: "主力部队刚在边境线上摆开阵势，还没正式开炮，对面南美各国的防线自己就先乱了套。\n\n魔法少女联盟截获了一封“圣杯远征军准备趁战时吞并魔联防区”的密电，暗语和签名分毫不差，气得几支前线部队当场拒绝联防。另一头，莉兰迪亚第三军团的副官被人发现死在旅馆里，皮包里塞满阿德莱希银行的汇票，统帅部连夜撤换了一半的前线军官。夜莺荒原的亡灵部队也收到互相矛盾的指令，在山口自己打了起来。\n\n参谋室里，格蕾站在沙盘前，把代表敌军防线的几个木牌挨个拨倒。\n\n“你们看，我就说不用硬打吧。”她转过头，冲着长桌旁的四把空椅子温和地笑了笑，“克雷，这下前线的士兵不用白白送命了；艾玛也不用担心伤兵太多忙不过来。等这一仗打完，咱们五个就去乡下休假。”\n\n门口送战报的年轻秘书不敢抬头，把文件夹轻手轻脚搁在门边桌案上，低着头退了出去。"
 paq.105.a: "趁他们自己乱了，全军压上去。"

 paq.106.t: "科学院西楼"
 paq.106.d: "帝国科学院西边的小楼封了三个月。对外说是研发新型密码机，其实里头连一台发报机都没有，黑板上写满了从亚空间遗物上抄下来的古怪符号。\n\n今天早上，主持研究的老教授突然冲出封锁线，在院子里又哭又笑，非说自己算出了时间是倒着走的。卫兵费了老大劲才把他按住送去医务室。格蕾赶过去的时候，实验室桌上只剩下一沓演算纸，还有老教授掉在地上的怀表。\n\n格蕾捡起怀表看了一眼，秒针果然在倒着走。那些让研究员看一眼就头晕反胃的符号，在她眼里却清清楚楚。她只扫了两眼黑板，军工部卡了半年的几个难题就在脑子里解开了。\n\n随行的卫兵队长小心翼翼地问，要不要把这些害人发疯的稿子烧了。\n\n“烧了干什么？老教授只是累坏了，送去乡下休养吧。”格蕾把怀表揣进兜里，“桌上的稿子全送到我书房，再挑几个聪明点的学者顶上。”"
 paq.106.a: "普通人算不明白，那就由我来算。"

 paq.107.t: "召唤仪式"
 paq.107.d: "半夜，科学院地下的大厅点起了九盏蓝灯。\n\n格蕾照着秘典最后一页念完祷词。大厅中间的地面裂开一道口子，一只长着双翼、鸟头人身的巨大恶魔从蓝光里走了出来。跟来的几个秘术师当场吓瘫在地上，只有站在最前面的格蕾没退。\n\n她刚想念约束咒语，这只被称为“万变魔君”的混沌大魔却低下巨大的鸟头，凑到她面前。\n\n“又见面了，夏普家的小姑娘。”一个沙哑的声音直接在她脑子里响起，带着笑意，“上次在城外荒原，替你劈倒二公主莱娅的那道蓝雷，还挺好用的吧？”\n\n格蕾一愣，手下意识摸向腰间的剑。那天晚上的雷不是老天爷显灵吗？她刚张嘴想追问，脑子里却突然空了一拍。等她回过神，压根记不起自己刚才要问什么，只看见面前的双翼大魔已经低头行礼，后面整整齐齐站着四队穿蓝金重甲的混沌士兵。\n\n“你刚才说什么？”格蕾皱着眉问。\n\n“我说，您的部队已经到齐了，代理人阁下。”大魔低着头回答。"
 paq.107.a: "“好，编入主力，听我调遣。”"

 paq.108.t: "一纸调令"
 paq.108.d: "不用宣战，甚至不用派兵强攻。\n\n三天前，情报总局和当地潜伏的教团同时发出了十几份伪造的换防公文。今天早上，帝国的接收人员刚到当地，驻军团长居然带着全团列队敬礼，客客气气交出营房钥匙和防区地图，还顺便打听自己团该去后方哪个城市报到。\n\n当地市政府那边也全乱了套。档案室里的土地册子一夜之间全改了字迹，白纸黑字写着这地方一直归阿德莱希管；几个前两天还喊着抵抗到底的议员，早上起来全忘了自己说过什么，正忙着在街上挂欢迎横幅。\n\n秘书拿着改好的新地图进来汇报，说话都有点不利索：“大人，整整一个州的驻军和政府，连一枪都没放就接管了……这真靠几份假公文就能办到吗？”\n\n格蕾拿铅笔在地图上把那块地涂成阿德莱希的颜色，轻笑了一声：“动刀动枪多俗气啊。改几个字就能让他们把家底自己捧上来，不比打仗有意思多了？”"
 paq.108.a: "这样省事多了。"

 paq.109.t: "隔岸观火"
 paq.109.d: "两份伪造的进攻计划书，在同一天夜里送到了旧世界两个大国元首的桌上。第二天，一艘中立国商船在公海莫名其妙被炸沉，两边同时截获了对方准备动手的假电报。不到两天工夫，原本还在谈判的两个阵营彻底翻脸，同时下达全国总动员令，海陆空全面开火。\n\n阿德莱希的皇宫书房里，收音机正播着大洋彼岸全面开战的紧急新闻。播音员声音急得发抖，格蕾却坐在地毯上，手里拿着两个代表不同阵营的小木偶往一块儿撞，自己先笑了起来。\n\n她早把以前那身军装扔了，散着头发，眼底泛着淡蓝色的微光。\n\n“打吧，打得越狠越好。”她随手把两个木偶丢在世界地图上，“等你们流干了血，就轮到我上场了。”"
 paq.109.a: "“热闹才刚开始呢。”"

 paq.110.t: "旧照片"
 paq.110.d: "向北方各国宣战的命令刚发下去两天，潜伏在北美的密探就赶在战线封锁前，从南方一家教会疗养院偷运回了一只旧皮箱。几年前，被薇莉安流放的老元帅就是在那儿去世的。\n\n军官把这只皮箱送到了格蕾的指挥部。当天晚上，格蕾叫人出去，自己打开了箱子。\n\n里头只有几件洗旧的衣服、一副老花镜，还有老元帅临终留在床头的草稿本。本子上除了第一封信的底稿，还写着第二张纸条原本的内容：老人家在上面反复叮嘱她，如果首都事不可为，千万别强求兵权，一定要带着几个朋友远走高飞，平平安安过完这辈子。箱子最底下还压着一张泛黄的合照，上面是十几岁的格蕾，身边站着马克、克雷、艾玛和安娜，五个人在老宅院子里笑得很开心。\n\n窗外，大批混沌异兽和魔军正踩着泥水往北面防线集结开进，吼声震得窗户直晃。\n\n格蕾拿着草稿本和照片看了一会儿，指尖冒出一簇蓝火，顺着纸边烧了过去。本子和相纸很快化成一小撮黑灰。她拍了拍手，推开门走了出去。"
 paq.110.a: "“全军继续北进。”"

# =============================================================================
# 色欲线（莉娅）进线后扩写剧情事件 (paq.111 ~ paq.120)
# =============================================================================
 paq.111.t: "代行国政"
 paq.111.d: "搬进皇宫办公的头几天，莉娅坐哪儿都觉得别扭。\n\n原本冷清的议事厅被托莉娜叫人重新布置了一遍，地上铺满厚紫地毯，屋里成天点着甜腻的熏香。来汇报政务的大臣和将军倒是很听话，从不跟她顶嘴，可只要莉娅一低头看公文，台下几十双眼睛就直勾勾粘在她的脖子、手腕和脸上，看得她浑身发毛。\n\n托莉娜大主教现在更是没个正形，整天衣服穿得松松垮垮，动不动就端着酒杯凑过来，贴着她耳朵教怎么盖章：“圣女大人，别总绷着脸嘛。现在全国上下都把您当神仙供着，您叫他们去死，他们都抢着去呢。”\n\n好不容易熬到散会，莉娅逃去后宫向名义上的女皇请示公文。闭门不出的薇莉安正窝在寝殿沙发里吃点心，见莉娅红着脸局促不安的样子，隔着老远笑话她：“喂，小修女，外头现在只认你，拿给我看干嘛？不过你要是再端着架子装圣人，底下那帮家伙光靠眼神都能把你生吞了。”\n\n从寝殿退出来，走廊里又飘来一股浓郁的熏香味。莉娅揉了揉发晕的额头，停在了台阶上。"
 paq.111.a: "把香炉撤了，开窗透气！"
 paq.111.b: "大家既然喜欢，留着也没什么。"

 paq.112.t: "禁令"
 paq.112.d: "莉娅决定按修道院的规矩来。她一连下了几道严令：皇宫和教堂一律不准点致幻熏香，官员和卫兵必须把领口扣紧，街上通宵的宴会必须在天黑前散场，违者关禁闭。\n\n命令发下去没几天，阿德莱希城表面上正常了不少，工厂按时开工，街上也没人明目张胆胡来了。可每天傍晚在大教堂主持晚祷的时候，莉娅心里还是直打鼓。\n\n台下跪着的信徒和军官确实把衣服扣得严严实实，但盯着圣坛的眼神比以前还要吓人。几个年轻神父拿戒尺狠抽自己的手心认罪，脸涨得通红，眼睛却死死钉在台上的莉娅身上，安静的大殿里全是压抑的喘气声。\n\n晚祷刚散，脑子里那个声音就笑了起来：\n\n“莉娅，你可真行。管得越严、越不让他们碰，他们心里那股火就烧得越旺。你这副冷冰冰不让碰的样子，比穿什么华丽衣服都勾人。”\n\n莉娅手一抖，差点把圣典掉在地上，赶紧低着头回了自己的房间。"
 paq.112.a: "“闭嘴！我是在教他们守规矩！”"

 paq.113.t: "圣宴"
 paq.113.d: "莉娅最终放弃了严管。既然大家都喜欢热热闹闹的，再逼全城人过苦行僧的日子，反倒显得不近人情。\n\n一道宽免令发下去，大教堂两边那些阴暗的忏悔室当天就被拆了，改成了摆满软垫和酒桌的长廊。教会还出面，免费给全城的工厂和军营发掺了花蜜的甜酒。\n\n这招比严刑峻法管用得多。为了拿到一张周末进大教堂参加圣宴的门票，军工厂的工人自己加班加点，三天干完了平时半个月的活；征兵处外面排起长队，年轻小伙子听说打胜仗能领到圣女亲手发的丝带，个个抢着报名。\n\n晚上，莉娅换上托莉娜送来的紫色礼袍走到露台往下看。广场上到处都是喝多了唱歌跳舞的市民，见她出来，底下爆发出一阵欢呼。莉娅扶着栏杆吹了会儿带酒气的夜风，没再叫卫兵去驱散人群。"
 paq.113.a: "大家过得高兴，应该也没什么不好……"

 paq.114.t: "白手帕"
 paq.114.d: "每天用冷水洗脸、一有杂念就罚自己抄经书，莉娅硬是在皇宫里守住了修女的规矩。她一口甜酒不喝，出门必戴面纱，对身边侍从也管得极严。\n\n这天夜里下雨，莉娅写完公文，发现自己平时擦汗用的白手帕不见了。她拿着蜡烛去外间找，刚走到屏风后面，就听见角落里有人压着嗓子喘气。\n\n透过屏风缝看过去，平时在她身边最老实、连抬头看她都不敢的小侍女，正跪在地毯上，把那块白手帕死死捂在脸上，肩膀直抖，嘴里还一遍遍小声念着莉娅的名字。\n\n莉娅站在屏风后面没敢出声。脑子里好久没动静的欢愉王子轻叹了一声：\n\n“看见了吧？哪怕你把自己冻成一块冰，只要还带着我的力量，你越干净，身边的人就越难受。你能管住自己，管得住别人吗？”\n\n莉娅没搭腔，悄悄退回里屋锁上门，坐在床边发了一夜的呆。"
 paq.114.a: "至少我自己不能乱。"

 paq.115.t: "林间甜雾"
 paq.115.d: "出兵攻打妖精森林和艾尔孚利登之前，军部的老参谋其实挺担心的。几年前第四次扩张战争时，老皇帝御驾亲征，就是在这片毒虫和冷箭遍地的林子里吃了大亏。\n\n不过这次前锋没带多少重炮，反而推着几十辆改装过的香炉车。部队一进林子，混着花香的粉紫色雾气就顺着风漫了过去。\n\n仗打得非常古怪。平时藏在树上放冷箭的妖精射手闻了几口雾气就手脚发软，一个个从树杈上跌下来，连弓都拉不开。艾尔孚利登的边防阵地更荒唐，守军听着扩音器里放的圣女祈福录音，打了不到半小时就丢下步枪，成群结队爬出战壕往帝国阵地这边跑。\n\n才打了五天，后方俘虏营就塞满了，绝大多数俘虏身上连点皮外伤都没有。前线军需官发急电诉苦，说子弹一箱没动，倒是捆俘虏的绳子和提神用的薄荷油全用光了，催首都赶紧补给。"
 paq.115.a: "别虐待俘虏，按规矩看管起来。"
 paq.115.b: "不用死人就能打赢，也算是好事吧。"

 paq.116.t: "防线瓦解"
 paq.116.d: "军部原本以为，靠意志支撑的魔法少女和没有痛觉的夜莺亡灵不会吃迷香这一套。结果部队推过去之后，这两家的防线垮得比凡人军队还快。\n\n魔联的前线部队常年高压作战，年纪不大的魔法少女们心里本来就憋着一肚子苦水。一进飘着甜香和圣歌的战区，很多人紧绷的神经当场断了。她们胸口的灵魂宝石没有变黑，反而泛出一种奇怪的粉紫色。没过几天，好几支小队自己解除武装，迷迷糊糊走进帝国军营地，说只想好好睡一觉。\n\n夜莺荒原那边同样出人意料。那些死去多年、全靠执念行动的亡灵士兵一沾上色欲魔力，居然重新想起了活着时的感觉：饭菜的香味、热水的温度、还有生前的种种欲望。成片的亡灵扔掉生锈的武器，趴在泥地上抓着土大哭，再也不肯往前冲了。"
 paq.116.a: "连死人和魔法少女都顶不住吗……"

 paq.117.t: "走私香膏"
 paq.117.d: "周围几个国家早就把阿德莱希产的玫瑰香膏和圣女画像列成了违禁品，海关查得极严，但走私船还是源源不断地往各国港口钻。\n\n在外国的贵族圈子里，私下点一支阿德莱希的紫蜡烛、藏一张精灵圣女的画片，已经成了最时髦的消遣。有个邻国的内政部长白天还在议会里大骂阿德莱希是魔窟，晚上回家锁上门，就偷偷点上香膏，对着莉娅的画像写满三页情书，托地下教团的人带回首都。\n\n如今每周送到皇宫的外国密信都得拿麻袋装，里头除了肉麻的情书，还夹着驻军地图、银行汇票甚至城防钥匙。莉娅拆开两封扫了一眼，上面的字句实在露骨，红着耳尖赶紧丢回了筐里。\n\n旁边的托莉娜弯腰捡起来替她整理好：“别害羞啊，圣女大人。等这帮大人物把家底都寄过来，咱们连兵都不用派，他们的国家自己就姓阿德莱希了。”"
 paq.117.a: "信烧掉，只留有用的情报！"
 paq.117.b: "随他们写吧，只要听话就行。"

 paq.118.t: "无血接收"
 paq.118.d: "接收使团出发的时候，连一辆装甲车都没带，只开了六辆礼宾车。\n\n车队开过边境线时，对面的铁丝网早被当地人自己拆干净了。通往首都的公路两边站满市民和没带武器的士兵，拼命往车上扔鲜花。等车停在中央议事堂门口，那个国家的内阁大臣和陆军将领全都穿着礼服跪在台阶下面，脸上半点亡国的难过都没有，个个面泛潮红，神情狂热。\n\n领头的执政官双手把权杖和降表举过头顶，一个劲地求使团向莉娅圣女转达他们的忠心，说只要圣女肯赏一件穿过的旧披肩让他们供在广场上，叫他们干什么都行。\n\n消息传回阿德莱希，朝堂上下一片欢呼。"
 paq.118.a: "不用打仗就能解决，总归是好事。"
 paq.118.b: "以后会有更多国家像这样跪过来的。"

 paq.119.t: "南美一统"
 paq.119.d: "莉兰迪亚的最后一座要塞在歌声中打开城门后，南美大陆再也没有一支反抗阿德莱希的军队了。\n\n庆祝统一的典礼办在首都大教堂。以前那面黑底铁十字旗降了下来，换成了画着银荆棘和紫圣杯的新旗。各地民众都在同一时间停下手里的活，面向首都的方向跪拜。\n\n大教堂二楼露台后面，莉娅站在镜子前理了理衣领。她换上了一身白金配紫纱的教袍，头上戴着象征南美共主的花冠，神色已经平静了许多。\n\n推开门走上露台，底下望不到头的人群立刻爆发出海啸般的欢呼声，无数双手臂朝着高台伸了过来。"
 paq.119.a: "南美已经彻底安静下来了。"

 paq.120.t: "旧日故乡"
 paq.120.d: "向北方各国宣战的号令刚发下去，作战地图上的一个名字让莉娅看了很久：法兰西第二王国。\n\n她很小的时候就跟着父母坐船逃出了路易斯安那。她对老家的印象一直很差：到处宣扬“纯净人类国家”的警察、在巷子里堵着异族小孩扔石头的贵族少爷、还有父亲为了保住码头的工作到处陪笑的样子。当年一家人凑钱逃到阿德莱希，只是想找个没人拿种族说事的地方过日子。\n\n开战消息刚传到北美，潜伏在法二境内的地下教团就连夜送回了一摞密信：那些以前自诩高贵、连跟异族同桌吃饭都嫌脏的法国旧贵族，现在为了买一瓶黑市流出去的阿德莱希香水抢破了头。好几个贵族一听说圣女的大军要往北打，赶紧写信过来，赌咒发誓说自己家里其实也有几分之一的精灵血统，求圣女大军打过来的时候一定去他们庄园住两天。\n\n莉娅放下手里的信，听着大帐外面北伐军集结出发的号声，起身走出了门。"
 paq.120.a: "以前受的气，是时候讨回来了。"
 paq.120.b: "那些高傲的老爷跪下来求饶的样子，一定很有意思吧？"

# =============================================================================
# 南美其他国家通用感知事件 (paq.121 ~ paq.126)
# =============================================================================
 paq.121.t: "来自北方的畸变难民"
 paq.121.d: "最近半个月，大批从阿德莱希逃出来的难民拼命往各国的边境哨卡涌。可边防军把人拦下来检查时，好几个新兵当场就吐了出来。\n\n这些逃难的人身上多多少少都带着不正常的畸变：有人后背的皮肤底下长着还在乱转的眼球，有人张嘴说话时嗓子里同时发出两三个人的声音，还有人明明胸口烂了个大洞，却跟没事人一样求哨兵给口水喝。\n\n随军医生和军官审问了几个神智还算清醒的逃亡者，得到的口供拼凑出了一个让人头皮发麻的事实：现在的阿德莱希早就不是正常人待的地方了。那边的天空一到半夜就会泛起邪门的光，整个国家已经变成了一座拿活人血肉和灵魂去喂养亚空间怪物的巨大祭坛。"
 paq.121.a: "一个都不准放进来，边境线全部戒备！"
 paq.121.b: "挑几个还没彻底疯的关起来审问，摸清对面的底细。"

 paq.122.t: "边境夜空下的异象"
 paq.122.d: "靠近阿德莱希方向的边境线上，最近连天气都变得不对劲了。\n\n每到入夜，北边的天际线就会泛起一层散不掉的暗紫色，压在头顶让人喘不过气。界河里顺水漂过来的鱼虾全都是畸形的，有的鱼嘴里长着人的牙齿，捞上岸还在泥地里发出像婴儿哭一样的怪声；边境林子里的鸟兽早就跑得一只不剩，只有夜风吹过铁丝网的时候，会带过来一阵阵像几万人同时在远处念经、又像在哀嚎的动静。\n\n驻守边境的官兵现在晚上睡觉都不敢关灯。所有人心里都清楚，对面那个被混沌吞掉的帝国迟早会打过来。"
 paq.122.a: "给边防军配发双倍弹药，日夜盯紧对面。"

 paq.123.t: "地下室里的邪教祭坛"
 paq.123.d: "首都警察局原本只是去查一桩人口失踪案，结果在城郊一座废弃仓库的地下室里，撞见了一幕让老警察都当场拔枪的场景。\n\n地下室的墙上用人血画满了阿德莱希那边的混沌符号，几十个平时看起来老实本分的市民、甚至还有两名政府部门的文员，正围着地上的一团不断渗出黑水的肉块跪拜。警察破门抓人的时候，领头的教徒非但不怕，反而指着警察狂笑，诅咒所有敢反抗阿德莱希的人都会从肚子里烂穿，或者在半夜自己割断喉咙。\n\n当天夜里，关在看守所里的十几个教徒在同一时间全身血管爆裂暴毙。牢房墙上只留下一行用血抹出来的字：“祂们已经在你们城里了。”"
 paq.123.a: "全城搜查，发现一个枪毙一个！"
 paq.123.b: "先把消息压下来秘密清理，别引起恐慌。"

 paq.124.t: "第一道屏障塌了"
 paq.124.d: "北面战线彻底没了动静。最后一批从沦陷区逃出来的侦察兵带回了坏消息：挡在阿德莱希南边的第一批邻国已经撑不住了。\n\n最可怕的还不是阿德莱希大军的推进速度，而是占领区变成的样子。前线冒死带回来的几张照片上，原本的城镇和林子里到处立着怪异的混沌祭坛；投降的守军根本没被送进普通的战俘营，要么被当场拉去祭坛放血，要么在诡异的雾气里被折磨成了不认人的狂信徒，调转枪口就编进了阿德莱希的前锋营。\n\n这头怪物已经吃饱了第一顿，接下来就该轮到南美剩下的国家了。"
 paq.124.a: "下一个就轮到我们了，全国立刻备战！"
 paq.124.b: "抓紧时间加固防线，绝不能步她们的后尘。"

 paq.125.t: "不像是人类的对手"
 paq.125.d: "跟阿德莱希开打才没几天，后方医院里收治的精神崩溃士兵就已经比枪伤伤员还要多了。\n\n从火线退下来的老兵抓着军官的袖子直抖，说对面冲过来的根本不能算是人：那些顶着混沌印记的士兵挨了机枪扫射，还能踩着自己流出来的肠子继续往前扑；战壕外面的夜雾里整宿飘着让人产生幻觉的哭喊、怪笑和甜腻的腥气，稍不留神就会有哨兵突然发疯，调转枪口朝自己人开火；好几处前线观察哨更是亲眼看见半空中裂开口子，成群非人的亚空间恶魔和长着兽角的异兽直接跳进战壕生撕活人。\n\n这根本不是普通的国与国打仗，而是跟整个地狱拼命。"
 paq.125.a: "退一步就是死路一条，给前线督战队下死命令！"
 paq.125.b: "增派医疗队和随军牧师，先把士兵稳住！"

 paq.126.t: "南美最后的警钟"
 paq.126.d: "连南美腹地的强国也没能挡住阿德莱希的混沌大军。\n\n沦陷区最后发出来的明码求救电报在半截突然变成了一串刺耳的杂音和怪笑，随后整片地区的通讯就彻底断了。高空侦察机冒险飞过去拍回来的照片，让参谋部里的军官半天没人敢说话：原本繁华的市区已经被改造成了巨大的露天屠宰场和祭坛，街上到处是游荡的混沌恶魔和异兽，几十万没来得及逃走的平民在一夜之间全都成了献给邪神的活祭品。\n\n阿德莱希的混沌狂潮已经吞掉了大半个南美，留给剩下国家的时间已经不多了。"
 paq.126.a: "拼到最后一个人，也绝不活着落进她们手里！"
