#开局介绍
 PAQ_start_game_text: "§0为此世献上浩劫§!"

 PAQ_his_page_01_title: "锈蚀的铁十字"
 PAQ_Country_History_Page_01: "在一个世纪前，当第一批挂着铁十字旗帜的战舰划破南美的海雾时，这些来自旧世界的德国流亡者们坚信自己带来了文明与钢铁的秩序。她们征服、通婚、融合，直到普鲁士的严谨与这片大陆的狂野彻底熔铸成了一个全新的民族——阿德莱希。前三次扩张战争的步步高升，如同烈酒般灌醉了整个帝国，让她们产生了一种战无不胜的错觉。然而，辉煌的表象下，蛀虫早已蚀空了帝国的栋梁。军队的腐败如同潜伏的毒疽，贵族的傲慢则是催化剂。当那位刚愎自用的老皇帝，无视参谋部的警告，御驾亲征试图碾碎森林中的妖精时，灾难降临了。那不是一场战争，而是一场羞辱。引以为傲的装甲在魔法与丛林面前变成了笨重的铁棺材，腐朽的指挥链在第一波伏击中就已断裂。皇帝的战死，并没有造就一位殉国的英雄，反而成为了戳破帝国虚假繁荣的最后一根手指。铁十字在泥泞中锈蚀，留下的只有破碎的版图和无尽的耻辱。"

 PAQ_his_page_02_title: "镀金笼中的野兽"
 PAQ_Country_History_Page_02: "在皇宫那光鲜亮丽的帷幕之后，薇莉安的生活是一场漫长而安静的窒息。作为没有继承权、甚至被视为“害死母亲的灾星”的小公主，她是被遗忘在角落里的尘埃。父皇的眼里只有版图，兄姐的眼里只有王座，而留给薇莉安的，只有冷嘲热讽与残羹冷炙。为了呼吸，她逃离了那座令人作呕的黄金牢笼，却在帝都最肮脏的贫民窟里找到了某种扭曲的归属感。在那里，下等人的粗俗、暴戾与真实的欲望，第一次填补了她内心的空洞。也就是在那些充满恶意的嘲笑和泥泞的斗殴中，某种不可名状的存在——混沌诸神，向这个满怀怨恨的皇室弃子投来了玩味的一瞥。当第四次战争的败报传来，当她的兄长和姐姐们为了那顶染血的皇冠而像疯狗一样互相撕咬时，薇莉安并没有参与争夺。她只是静静地站在阴影里，聆听着脑海中那个疯狂而诱人的低语，并在那个雷雨交加的夜晚，微笑着签下了一份出卖灵魂的契约。"

 PAQ_his_page_03_title: "混沌的加冕礼"
 PAQ_Country_History_Page_03: "那场夺权或许没有载入史册的宏大进军，但一定淌满了一夜之间流遍皇宫回廊的鲜血。当第二天太阳升起时，阿德莱希的人民惊恐地发现，那些曾经不可一世的皇位有力竞争者们，都已化为了不可名状的肉块，而那个最不起眼、被所有人轻视的小公主，正端坐在荆棘与骸骨重塑的王座之上。薇莉安不需要军队的效忠，因为她带来了更纯粹的力量——混沌。她用恐惧缝合了帝国崩裂的伤口，用疯狂重铸了军队的脊梁。如今，阿德莱希不再是那个追求领土与荣耀的世俗帝国，它已沦为神与魔的游乐场。薇莉安的目光投向了国境之外，投向了整个南美。她发动战争不再是为了征服，也绝非为了利益。她是为了向那些曾经蔑视她的人证明自己的力量，是为了向赐予她新生的混沌诸神献上最盛大的祭礼。对于薇莉安而言，如果世界将在战火中化为灰烬，那么这灰烬，便是她加冕礼上最完美的礼花。"

