#超事件
PAQ_news.1.t: "$news_event_background$ 永世的加冕礼"
PAQ_news.1.d: "这片大陆上的每一个生灵，都在同一时刻，感受到了那股来自灵魂深处的、粘稠的恶寒。\n那是一场席卷了整个世界的噩梦。在梦中，天空被撕开了一道巨大的、流淌着脓血的伤口，无数不可名状的窃窃私语汇聚成那个疯癫女皇的嬉笑声。“战争”是国与国之间的博弈，而她所发起的，是一场针对所有存在本身的、盛大的祭奠。\n神庙里的塑像毫无征兆地崩裂，井水变成了腥甜的血酒，刚出生的婴儿在摇篮里发出了苍老的叹息。所有的迹象都在诉说着同一个绝望的事实：那个被遗弃在阴沟里的女孩，如今已戴上了由混乱铸就的冠冕。她只想将这个有序的世界像旧布偶一样撕碎，看看里面到底塞满了怎样的悲鸣。\n旧日的秩序已在昨夜死去。现在，这是她的游乐场了。"
PAQ_news.1.a: "神啊……那笑声在我的脑子里停不下来……"

