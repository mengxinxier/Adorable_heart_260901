#超事件
PAQ_news.1.t: "$news_event_background$ 永世的加冕礼"
PAQ_news.1.d: "就在同一天夜里，整片大陆的人都做了一个一模一样的噩梦。\n梦里的天空裂开了一道大口子，耳边全是从没听过的怪笑和低语。神庙里的雕像自己裂开，井里打上来的水带着一股铁锈和血腥味，街上的牲畜整宿整宿地惨叫。各国的占卜师和学者查了一夜，最后只得出了一个让人绝望的结论：阿德莱希皇宫里那个曾经谁也看不起的小女孩，已经彻底把整个国家献给了混沌四神。\n她打仗根本不是为了割地赔款，也不是为了争什么霸权，只是单纯想把这片大陆上所有的秩序和生灵全部拖下水。\n旧规矩已经在昨晚死透了，接下来谁也别想安生。"
PAQ_news.1.a: "神啊……那笑声在我的脑子里停不下来……"

