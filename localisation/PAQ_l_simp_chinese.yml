# 色欲线事件
 paq.80.t: "彻底沉沦"
 paq.80.d: "教堂彩窗透进来的光早就变成了一片紫红。莉娅站在镜子前，听着自己嘴里哼出来的陌生调子，已经完全想不起来自己上一次正经念祈祷词是什么时候了。以前每次快要撑不住的时候，她还会咬着牙告诉自己不能乱；可现在只要脑子里那个甜腻的声音一响，她浑身上下就软得一点力气都提不起来，只剩下说不出的舒服和踏实。\n\n“还较什么劲呢？你本来就是为了今天才站在这儿的。”\n\n镜子里的精灵姑娘慢慢笑了起来。当年那个从乡下教会进城的小修女已经彻底不见了，往后留在阿德莱希皇宫里的，只有顺从欲望的欢愉圣女。"
 paq.80.a: "“……再多给我一点吧。”"

