	PAQ_sy_1:"圣女的代行权"
	PAQ_sy_1_desc:"莉娅接过了代行国政的印信，但脑子里那个声音还是没完没了。"
	PAQ_sy_2a:"克制圣咏"
	PAQ_sy_2a_desc:"按修道院的规矩整顿全城风纪，决不能任由大家胡来。"
	PAQ_sy_2b:"狂喜祷告"
	PAQ_sy_2b_desc:"拆掉忏悔室，把甜酒发下去，让大家顺着本能痛快过日子。"
	PAQ_sy_3a:"神圣工坊"
	PAQ_sy_3a_desc:"严抓生产纪律和工艺标准，先把国家的工业底子稳住。"
	PAQ_sy_3b:"奢靡狂潮"
	PAQ_sy_3b_desc:"用圣宴门票和享乐当奖赏，刺激工人们没日没夜地干活。"
	PAQ_sy_4a:"纯白圣卫"
	PAQ_sy_4a_desc:"整顿军纪，严禁军营里点致幻熏香，靠稳固的防线打仗。"
