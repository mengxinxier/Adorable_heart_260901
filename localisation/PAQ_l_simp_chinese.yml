PAQ_001: "血色十日"
PAQ_001_desc: "时机已到，薇莉安是时候开始展开行动了..."
PAQ_002: "灰飞烟灭"
PAQ_002_desc: "一切旧秩序都已灰飞烟灭，属于她的新时代即将开始。"
PAQ_003: "背叛者们"
PAQ_003_desc: "大臣们自以为薇莉安没有手段能够当上皇帝，她们必将付出血的代价。"
PAQ_004: "长兄坟墓"
PAQ_004_desc: "曾经高高在上的皇子们，如今面临死亡却丑态百出...."
PAQ_005: "监管者"
PAQ_005_desc: "混沌诸神派遣了一位监管者来监督薇莉安，时刻提醒她为混沌贡献更多。"
PAQ_006: "姊妹命运"
PAQ_006_desc: "曾经不可一世的姐姐们此时也终于跪地求饶，但薇莉安会因此放过她们吗？"
PAQ_007: "处理军官团"
PAQ_007_desc: "帝国的将军们只会打败仗，这些老东西们依仗自己的权势免于审判，但薇莉安不会放过她们。"
PAQ_008: "异界将领"
PAQ_008_desc: "借由混沌那强大的力量，薇莉安可以从异世界召唤一群强者为自己所用，这些来自异世界的人会组成新的军官团。"
PAQ_009: "流放老元帅"
PAQ_009_desc: "老元帅曾经帮助过薇莉安，因此她决定放老元帅一马，然而这位老人似乎已经时日不多了..."
PAQ_010: "诸神赐福之人"
PAQ_010_desc: "赞美薇莉安吧，她就是此世唯一的混沌神选！"
PAQ_011: "力量的代价"
PAQ_011_desc: "混沌的力量是有代价的，且代价不菲..."
PAQ_012: "重塑帝国荣光"
PAQ_012_desc: "薇莉安将重塑帝国荣光，夺回帝国所失去的一切！"
PAQ_013: "未来近在咫尺"
PAQ_013_desc: "在混沌的帮助下，我国国力恢复迅速，第五次扩张战争马上就会开始..."

