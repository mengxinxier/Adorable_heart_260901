	PAQ_cs_7:"漫过最后的城墙"
	PAQ_cs_7_desc:"不用着急强攻，让瘟疫慢慢耗干莉兰迪亚最后一点力气。"
	PAQ_cs_8:"慈父的大锅"
	PAQ_cs_8_desc:"架起大锅收集各地的病灶，熬制慈父赐下的第一锅浓汤。"
	PAQ_cs_9:"祝福型病灶"
	PAQ_cs_9_desc:"外人眼里的绝症，在长生信徒身上反而是能挡子弹的厚甲。"
	PAQ_cs_10:"腐朽型诅咒"
	PAQ_cs_10_desc:"把最要命的瘟疫撒到对面防线和粮道上，没等交火他们自己就烂穿了。"
	PAQ_cs_11:"终极毒株循环"
	PAQ_cs_11_desc:"大锅里的毒株已经养熟了，腐殖循环的产出比以前翻了一倍。"
	PAQ_cs_12:"慈父的南美花园"
	PAQ_cs_12_desc:"没有贵族，也没有欺压，整个南美都变成了安安静静的腐殖花园。"
