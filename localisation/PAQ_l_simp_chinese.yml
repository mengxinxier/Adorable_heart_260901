#开局介绍
 PAQ_start_game_text: "§0为此世献上浩劫§!"

 PAQ_his_page_01_title: "锈蚀的铁十字"
 PAQ_Country_History_Page_01: "一百年前，一批来自德国的流亡者乘船抵达南美。她们靠着手里的枪炮和严密的军事组织，在这片大陆北部站稳了脚跟，建立起阿德莱希帝国。\n\n前三次扩张战争的接连获胜，让帝国的版图迅速膨胀，却也掩盖了内部的腐烂。贵族和将领忙着克扣军饷、搜刮民脂民膏，军队早就没了当年的战斗力。等到第四次扩张战争打响，刚愎自用的老皇帝不顾劝阻，非要御驾亲征去攻打妖精森林。结果笨重的重装备在密林里寸步难行，混乱的指挥系统在第一轮伏击后就直接瘫痪。老皇帝本人死在了丛林里，前线全面崩盘，曾经在南美不可一世的阿德莱希一夜之间丢地赔款，沦为全大陆的笑柄。"

 PAQ_his_page_02_title: "深宫里的弃子"
 PAQ_Country_History_Page_02: "在等级森严的皇宫里，最小会受宠那套从来不存在。薇莉安的母亲在生她时难产去世，没有继承权的她从小就被当成累赘。老皇帝眼里只有打仗和年长的子女，兄长和姐姐们则把欺负这个小妹妹当成日常消遣。\n\n为了躲开宫里的冷眼和折磨，薇莉安经常偷偷溜出皇宫，跑去首都最混乱的贫民窟里跟底层平民混在一起。被姐姐们发现后，迎接她的是变本加厉的羞辱。长年累月的怨恨让她的脾气越来越极端，也在无意间引来了亚空间里混沌四神的注视。第四次扩张战争老皇帝战死的消息传回首都后，她的哥哥姐姐们为了争抢皇位打得头破血流，没人多看角落里的薇莉安一眼。而在那个夜晚，走投无路的小公主顺从了脑海里的声音，同混沌诸神立下了契约。"

 PAQ_his_page_03_title: "血色登基"
 PAQ_Country_History_Page_03: "那场夺权只用了一个晚上。等第二天太阳升起的时候，皇宫里的卫兵和大臣惊恐地发现，前一天还在争夺皇位的皇子皇女们已经全部惨死在回廊里，连尸体都拼不完整。那个平时谁也看不起的小公主薇莉安，就这么浑身是血地坐上了皇位。\n\n靠着混沌四神赐予的力量，薇莉安用最残忍的手段镇压了所有敢出声的反对派。现在的阿德莱希已经不再是以前那个只想着争夺地盘的普通帝国了，从政府到军队都成了侍奉混沌的工具。薇莉安把目光投向了边境之外的整个南美——她既要想尽办法打赢下一场战争来向曾经看不起她的人证明自己，也必须用更多的战火与祭品，去填饱脑海里那四位神明的胃口。"

#路线指南
 PAQ_route_guide_desc: "如果正常一路赢下去便是薇莉安混沌统合路线，如果在38年之前输掉战争会进入战败线，随后根据事件链选择可进入四条不同的独特路线，其中诡计线和色欲线的事件较为丰富。\n\n战争线需要让莱娅取胜，注意该路线薇莉安必定死亡，如果不想格蕾陷入疯狂，则需要一开始不让莱娅立刻取胜，后续再输给莱娅。\n\n长生线需要让黛丽和她的长生起义军取胜，最简单的方式是在首个事件中取胜，另一种进线方式偏后期。注意此路线也会导致薇莉安死亡。\n\n色欲线进线方式较多，但前提都是莱娅与黛丽两败俱伤，随后莉娅只要不压制自己的欲望就可进入。\n\n诡计线需要让格蕾与她的伙伴们一路赢下去，除了一开始需要让莱娅和黛丽两败俱伤外，其他时候只需一直听从纸条指示与天意即可。注意，格蕾在统一南美后可以选择反抗诡计之神，但反抗成功的概率极低，且反抗成功后会立刻进入最坏结局（对其他人来说是好结局）。"

#角色与介绍
 PAQ_GATHERING_STORM_DESC: "第四次扩张战争的惨败和老皇帝的战死，把阿德莱希帝国积累多年的腐败彻底抖在了阳光下。正当皇子皇女们为了皇位在首都争得你死我活时，一直被当成废物和灾星的小公主薇莉安，却在混沌四神的扶持下血洗了整个皇宫，踩着兄姐的尸体戴上了皇冠。\n\n现在的阿德莱希已经彻底变了样。老派军官被成批清洗，来自异界的将领和亚空间的恶魔填补了军队的空缺，原本的教会也改换门庭成了传播混沌信仰的帮凶。国内的烂摊子被薇莉安用高压和恐惧强行压了下去，但混沌的力量从来不是白给的。\n\n为了偿还四神的恩赐，也为了洗刷上一次战败的耻辱，薇莉安已经在边境重新集结大军。一场席卷整个南美的战争随时都会打响，而这一次，阿德莱希要么把所有邻居拖进深渊，要么在反噬中彻底崩盘。"
 PAQ_WLA_DESC: "薇莉安是阿德莱希皇室中年龄最小的妹妹，然而作为小公主的她并没有得到太多宠爱。出生在强者至上国度的少女，因没有王位继承权便从小被兄长与姐姐们嘲笑，欺负。而拥有雄心壮志的父亲也更看好他年长的孩子们。至于薇莉安的母亲，则早在分娩时离世。从小在被欺压的环境下长大的薇莉安，性格逐渐变得暴躁。由于在皇宫内没有朋友，她经常跑到城里去和那些下贱的平民玩耍。被姐姐们发现后的嘲笑使她的性格更加步入极端，而她也因此在无意间得到了混沌之神的瞥视。在第四次扩张战争失败后，哥哥姐姐们拼死争夺皇位时，她终于得以与混沌的神明对话，并得到了它们的认可，获得了强大但可怕的力量，并最终通过一系列血腥手段登上了皇位。如今，为了报答混沌的恩赐，同时也是为了证明自己的能力，在内部彻底安定后，她将对整个南美发动一场浩劫般的战争。也许这场战争会摧毁南美的一切，但对她来说，那又能如何呢？"
 PAQ_laiya: "莱娅"
 PAQ_LY_DESC: "莱娅·冯·阿德莱希，薇莉安的二姐，在皇位继承中位列第三。在薇莉安针对兄弟姐妹的屠杀中因一位将领的良心发作而逃过一劫，那人因此死亡。为了宣扬薇莉安的正统性，并防止有人借助姐姐的宣称，帝国一直在对外宣称薇莉安之外的皇室成员已全部死亡。由于之前四神对薇莉安的宠爱，莱娅只能躲在暗处，无法做出反抗，随着薇莉安失宠，莱娅将对这不听话的妹妹展开报复。\n莱娅对薇莉安有着无尽的仇恨，如果说薇莉安的凶狠是后天形成的，那莱娅就是天生的屠夫。但她的残暴只针对敌人，对自己人来说，她或许是个强大的女武神。但无论如何，莱娅都不会放过这个杀害血亲，夺取皇位的妹妹"
 PAQ_gelei: "格蕾"
 PAQ_GL_DESC: "格蕾·冯·夏普，老元帅的孙女，被认为是帝国最有正义感的贵族。她的父母在第四次扩张战争中随皇帝一同奔赴冥河。爷爷在被薇莉安流放后不久就在北美因年迈离世。在临终前，他将遗言写好，交给最信任的仆人，让他交到孙女的手中。格蕾如实收到了这封遗书，除了爷爷给她留下的遗产，还有一条重要的讯息：拯救被混沌蛊惑的帝国，让小皇帝走上正道。为此，老人还委托仆人邀请了格蕾正义的朋友们，让他们帮助格蕾一同矫正小皇帝。但由于此前薇莉安大权在握，格蕾等人即使住在边境，也依旧被严重监视，根本无法接近薇莉安。\n朋友一号马克是个愤世嫉俗的小伙子。在混沌降临前就因不满教会的种种行为被视作问题青年。作为小贵族却被认为是贵族的耻辱，在一次被恶意举报逮捕后与审问他的格蕾相识。\n朋友二号安娜是和格蕾一起长大的女仆。在老元帅家中，仆人与主人之间并没有什么差异。作为老女仆的女儿，她从小就和小主人格蕾一起长大，因此二人的三观也十分相近。\n朋友三号克雷是格蕾在军营认识的士兵，他来自乡下，怀着一腔热血参军，却发现帝国军队腐败至极，与他理想中的军队差异极大，在服役三年后决定复员。\n朋友四号艾玛是格蕾家本地的小贵族之女，二人在一次贵族宴会上结识，因同样对美好世界的向往而走到了一起。不过与格蕾根据家族传统从军不同，艾玛家是医学世家，她本人从事医术。\n随着薇莉安失宠，格蕾和她的伙伴们踏上了拯救国家的勇者之旅，但诡计之神的眼睛早已注视到了这群心怀理想的年轻人……"
 PAQ_liya: "莉娅"
 PAQ_LIY_DESC: "莉娅，真名不详，精灵族，法兰西第二王国国籍。由于法二国内的种族歧视，她的父母在她小时候就带着全家移居到了阿德莱希，因为这里是全南美最发达的国家。莉娅成年后在当地的教会担任修女，很受周围孩子们的喜欢。这家教会的神父经常不在，很多事情都交给了她。莉娅因此结识了当地的一些军官，其中一位对她一见钟情，对她展开了疯狂的追求，莉娅对此很是困扰。她询问神父的意见，神父让她去聆听神明的话语。但随着混沌降临，神明的言语已模糊不清。取而代之的，是色欲之神的蛊惑。\n在薇莉安大权在握的时期，色欲的蛊惑经常被其他混沌神明的声音所覆盖。但随着薇莉安被抛弃，欢愉王子的声音愈发清晰。她试图抵抗这份甜美的诱惑，但回应所带来的快感却令人难以忘怀。"
 PAQ_daili: "黛丽"
 PAQ_DL_DESC: "黛丽·达威（自称，真名不详）出生在一个贫困家庭，虽然家里很穷，但父母的感情很好，一家人过着精神世界充足的生活。他们对现状并无不满，一家人都在积极享受着工作与生活。但这一切在第四次扩张战争打响后消失了。老皇帝身边的奸臣为了敛财，强行征募远超预期需求的成年人进入预备役。黛丽的父亲不愿参军，而征兵处的人想强行带他走，黛丽的母亲极力反对，甚至用家具打伤了其中一位士兵的胳膊。在争执中，黛丽的母亲被那位受伤的士兵失手打死。在场的军官声称只要黛丽的父亲参军，这桩事故便会妥善处置，政府会付给黛丽一笔赔偿费，而他退伍后也会得到更好的待遇。碍于权威与热兵器的威胁，同时也担心军人杀人灭口，黛丽的父亲只能同意。士兵们草草把母亲掩埋，便将男人带走了。在临走之前，军官留给黛丽一点钱，说是提前垫付的精神赔偿。\n随着扩张战争结束，父亲没有回来，而军官声称的政府赔偿费也迟迟没有落款。黛丽前去讨要说法，却被官方人员认为查无此事，甚至连当时的征兵名单里都没有她父亲的名字。就在她绝望之际，一位贵族伸出了援手。这位青年温柔地安慰了黛丽，并帮助她寻找父亲的踪迹，但结果令人寒心：她父亲被那群士兵带走后不久，就被残忍杀害了，军官带他离开不过是为了杀人灭口。之所以不杀黛丽，是因为可以借征兵的名义，走官方程序带走她父亲，不会打草惊蛇。而上层从头到尾都不知道这件事，所以也根本没有赔偿金。至于当事人士兵和军官，黛丽根本不知道他们的名字。由于阿德莱希的士兵通常用头盔蒙面，她也不知道失手杀害她母亲的士兵到底是谁。\n黛丽悲痛欲绝，而贵族再一次温柔安抚了她。黛丽因此对贵族心生爱慕，同时也是为了报答他的帮助，二人相爱。而且，这位贵族出乎意料的是个正经人，没有任何桃色关系，也愿意迎娶黛丽这么一位出身平民的女人。但戏剧性的一幕在他们结婚前再次上演：黛丽在贵族熟睡后，翻阅他以前的照片，竟发现其中几张身穿军装的照片，与她记忆中误杀她母亲的那位士兵极度相似。她不安地询问宅邸中的仆人，才得知贵族是在战争结束后因军功被册封的新贵族。虽然战争失败了，但许多贵族战死，因此一些有军功的平民被册封了爵位。也就是说，他之前只是一名普通士兵，并且在当地征兵处工作过很长时间。黛丽极力劝说自己这只是巧合，毕竟蒙面士兵的体型都差不多，直到她注意到贵族胳膊上那道伤口——那正是之前黛丽母亲留下的。\n黛丽崩溃了，她发了疯似的逃出贵族的宅邸，她想不明白贵族为什么要帮助她，而自己则将身体交给了这个恶魔！她在漫无边际的荒原上如同行尸走肉一般走着，不知方向，也不知目的。直到失去所有力气，倒在了地上。她诅咒军队，诅咒那名士兵，诅咒那个军官，诅咒这个害她家破人亡，又戏弄她的国家。她向神明祈祷，祈祷神明赐予她新的生命，与她的旧过去一刀两断。\n没有正义的神明做出回复，只有长生之神回应了她的愿望。她此后便改名为黛丽·达威，计划报复整个阿德莱希帝国，摧毁这个腐败至极的国家。随着薇莉安大势已去，她的计划终于得以开始。"
 PAQ_WLA_ZB_DESC: "§Y薇莉安§!\n@PAQ§Y[FROM.Getname]§!的§Y皇帝§!\n\n§Y四神不选§!\n  · £ai_acceptance_texticon  所有意识形态外交接纳度：§R-999§!"
 PAQ_WLA_ZB_DESC2: "薇莉安输掉了一切，四神不再支持她，她静静等待着自己死期将至的那天。"
