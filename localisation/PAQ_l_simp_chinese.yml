paq.1.t: "大萧条波及南美"
paq.1.d: "作为南美为数不多的工业国，帝国不可避免的遭受了大萧条带来的影响。"
paq.1.a: "我不想听这些消息！"
paq.2.t: "选择主要信仰"
paq.2.d: "女皇需要选择一个混沌神明作为帝国的主要信仰，这会让帝国得到该神明的赐福并极大改善与该神明的关系，除了立刻获得的赐福之外，在之后的事件中女皇也可以获取各种相对应的增益。同时，我们之后有一次更换主要信仰的机会，但更换主要信仰会严重损害女皇与前主要信仰的关系。所以在选择主要信仰前，务必思考周全。"
paq.2.a: "战争"
paq.2.b: "诡计"
paq.2.c: "色欲"
paq.2.e: "长生"
paq.3.t: "更换主要信仰"
paq.3.d: "更换主要信仰会极大损害与前信仰神明的关系，请谨慎选择！"
paq.2.f: "我不换了"
paq.4.t: "选择次要信仰"
paq.4.d: "除了主要信仰之外，女皇还可以选择一位神明作为次要信仰：虽然帝国可以获得该神明的赐福效果，但我们无法从事件中获得其对应的增益，同时也无法获得次要信仰的最高赐福效果。次要信仰无法更换，想好了再做选择。"
paq.5.t: "战争赐福升级"
paq.5.d: "帝国就是战争的化身，战争之神非常赞赏女皇的行为。"
paq.5.a: "太好了"
paq.6.t: "战争赐福降级"
paq.6.d: "战争之神认为女皇不够勤奋，撤回了此前给予的赐福。"
paq.6.a: "这不该发生"
paq.7.t: "战争赐福升级"
paq.7.d: "战争之神收回了此前对女皇的惩罚。"
paq.8.t: "战争赐福降级"
paq.8.d: "女皇严重激怒了战争之神，帝国的赐福变成了诅咒！"
paq.9.t: "诡计赐福升级"
paq.9.d: "帝国就是阴谋的化身，诡计之神非常赞赏女皇的行为。"
paq.10.t: "诡计赐福降级"
paq.10.d: "诡计之神认为女皇缺少计策，撤回了此前给予的赐福。"
paq.11.t: "诡计赐福升级"
paq.11.d: "诡计之神收回了此前对女皇的惩罚。"
paq.12.t: "诡计赐福降级"
paq.12.d: "女皇严重激怒了诡计之神，女皇的赐福变成了诅咒！"
paq.13.t: "色欲赐福升级"
paq.13.d: "女皇就是色欲的化身，色欲之神非常欣赏女皇。"
paq.14.t: "色欲赐福降级"
paq.14.d: "色欲之神认为帝国缺少乐子，收回了此前给予的赐福。"
paq.15.t: "色欲赐福升级"
paq.15.d: "色欲之神收回了此前对女皇的惩罚。"
paq.16.t: "色欲赐福降级"
paq.16.d: "女皇严重激怒了色欲之神，帝国的赐福变成了诅咒！"
paq.17.t: "长生赐福升级"
paq.17.d: "女皇就是永生的存在，长生之神非常支持女皇。"
paq.18.t: "长生赐福降级"
paq.18.d: "长生之神认为女皇不够虔诚，因此撤回了此前给予的赐福。"
paq.19.t: "长生赐福升级"
paq.19.d: "长生之神收回了此前对女皇的惩罚。"
paq.20.t: "长生赐福降级"
paq.20.d: "女皇严重冒犯了长生之神，帝国的赐福变成了诅咒！"
paq.21.t: "诸神之争"
paq.21.d: "战争与色欲发生了冲突，女皇应该支持哪一边？"
paq.21.a: "支持色欲"
paq.21.b: "支持战争"
paq.22.d: "诡计与长生发生了冲突，女皇应该支持哪一边？"
paq.22.a: "支持诡计"
paq.22.b: "支持长生"
paq.23.t: "诸神恩赐"
paq.23.d: "四神突然大发慈悲，允许[PAQ.Getleader]获取其中一方的青睐，女皇该选择谁？"
paq.23.a: "战争"
paq.23.b: "诡计"
paq.23.c: "色欲"
paq.23.e: "长生"
paq.24.t: "四神争斗"
paq.24.d: "四神之间似乎爆发了一场激烈的争吵，它们要求女皇支持其中一方，但这势必会激怒另外三方。"
paq.24.a: "支持战争"
paq.24.b: "支持诡计"
paq.24.c: "支持色欲"
paq.24.e: "支持长生"
paq.25.t: "激怒四神"
paq.25.d: "女皇无意中激怒了一位神明，它是..."
paq.25.a: "战争"
paq.25.b: "诡计"
paq.25.c: "色欲"
paq.25.e: "长生"
paq.26.t: "诸神争端"
paq.26.d: "四神这次两两分组展开了争吵，女皇只能选择其中一方。"
paq.26.a: "战争与诡计"
paq.26.b: "色欲与长生"
paq.27.t: "战争与色欲"
paq.27.d: "战争之神向女皇表达了对色欲之神的厌恶。"
paq.27.a: "战争说得对"
paq.27.b: "我不许你诋毁色欲！"
paq.27.c: "战争和色欲都不太行"
paq.28.t: "诡计与长生"
paq.28.d: "诡计与长生之间一直不对付，哪一方才是值得帝国尊敬的？"
paq.28.a: "诡计会指引我们"
paq.28.b: "长生像一位慈父"
paq.28.c: "诡计和长生都不太行"
paq.29.t: "诡计之神的奖励"
paq.29.d: "诡计之神突然大发慈悲，想要给予帝国一些奖励，代价仅仅只是降低与某个神明的关系..."
paq.29.a: "降低与战争的关系"
paq.29.b: "降低与色欲的关系"
paq.29.c: "降低与长生的关系"
paq.30.t: "战争赐福"
paq.30.d: "战争之神给予了女皇赐福。"
paq.30.a: "太好了"
paq.33.t: "诡计赐福"
paq.33.d: "诡计之神给予了女皇赐福。"
paq.33.a: "太好了"
paq.36.t: "色欲赐福"
paq.36.d: "色欲之神给予了女皇赐福。"
paq.36.a: "太好了"
paq.39.t: "长生赐福"
paq.39.d: "长生之神给予了女皇赐福。"
paq.39.a: "太好了"
paq.42.t: "神罚"
paq.42.d: "女皇与主要信仰的关系太低了，它对帝国降下了神罚，赐福变成了诅咒！"
paq.42.a: "我们会悔改的"
paq.43.t: "卡丘军官团的分歧"
paq.43.d: "来自“卡拉彼丘”世界的将领分为三个派系：欧泊是原世界的统治机构，她们在军事上主张陆空协调与科技进步。剪刀手是主要反对势力，她们主张人海战术与步兵作战。乌尔比诺财团是中立方，她们在军事上倾向于各取所长。各方所支持的战术都有其长处和短处，女皇需要亲自决定军队后续的发展方向。"
paq.43.a: "知道了"
paq.44.t: "期限已到"
paq.44.d: "时间到了，然而[PAQ.Getleader]还没有战胜她的敌人们..."
paq.44.a: "“不，再给我一些时间！”"
paq.0.t: "游玩须知"
paq.0.d: "在开始游戏之前，请先确保你能接受以下内容：\n1.目前仅有一条路线，且伴有极少的文本量和剧情量。\n2.国策整体数量较少，部分国策时间较长，主要内容集中在决议上。\n3.纯反派定位，无洗白内容。\n4.混沌四神捏他自中古战锤混沌四神，具体设定有所改动。\n5.纯粹的数值与战斗，与其他国家几乎没有宣战和渗透之外的交互。\n\n若您无法接受以上提到的内容，则不建议游玩该势力。"
paq.0.a: "我知道了"
paq.45.t: "广泛起义"
paq.45.d: "虽然女皇成功洗刷了第四次扩张战争失败的耻辱，但帝国的快速扩张为统治带来了不小的隐患。即使[PAQ.Getleader]陛下拥有混沌给予的神力，依然无法快速镇压各地的反抗势力，帝国需要一段时间来镇压这些反抗帝国统治与混沌神明的起义。"
paq.45.a: "好吧"
paq.46.t: "[PAQ.Getleader]遭到反噬"
paq.46.d: "阿德莱希帝国的女皇[PAQ.Getleader]凭借混沌的力量让我们节节败退，但她最终自食恶果，被混沌的力量所吞噬。而由混沌力量组成的帝国军队陷入混乱，现在正是我们反击的最佳时机。"
paq.46.a: "开始反攻！"
paq.47.t: "起义被镇压"
paq.47.d: "随着帝国军队的快速行动，起义已经被彻底镇压，现在[PAQ.Getleader]陛下可以继续她的伟大征途了！"
paq.47.a: "很好"
paq.48.t: "向战争索取更多奖励"
paq.48.d: "战争之神非常支持女皇，因此[PAQ.Getleader]可以从它那里获得更多好处。（提示：获得的效果默认隐藏）"
paq.48.a: "更强大的军队"
paq.48.b: "更便宜的装备"
paq.48.c: "生产更多装备"
paq.49.t: "向诡计索取更多奖励"
paq.49.d: "诡计之神非常欣赏女皇，因此[PAQ.Getleader]可以从它那里获得更多好处。（提示：获得的效果默认隐藏）"
paq.49.a: "隐藏帝国的情报"
paq.49.b: "获取他国的情报"
paq.49.c: "抵抗无处遁形"
paq.50.t: "向色欲索取更多奖励"
paq.50.d: "色欲之神非常喜欢女皇，因此[PAQ.Getleader]可以从它那里获得更多好处。（提示：获得的效果默认隐藏）"
paq.50.a: "臣民努力工作"
paq.50.b: "疯狂鼓励生育"
paq.50.c: "减少国家开销"
paq.51.t: "向长生索取更多奖励"
paq.51.d: "长生之神非常赞同女皇，因此[PAQ.Getleader]可以从它那里获得更多好处。（提示：获得的效果默认隐藏）"
paq.51.a: "更强壮的士兵"
paq.51.b: "强化的生产线"
paq.51.c: "军队更多补给"
paq.52.t: "四神的奖励"
paq.52.d: "混沌四神都非常赞同[PAQ.Getleader]最近的行动。"
paq.52.a: "太好了！"
paq.53.t: "四神的惩罚"
paq.53.d: "四神最近因为一些莫名其妙的事情大发雷霆，女皇受到了牵连..."
paq.53.a: "无妄之灾"
paq.54.t: "寻欢作乐"
paq.54.d: "色欲之神希望帝国进行更多的欢愉行为，现在这样太沉闷了！"
paq.54.a: "不可以涩涩"
paq.54.b: "遵从色欲的指示"
paq.55.t: "长生的奖励"
paq.55.d: "长生之神鼓励了女皇最近的行为。"
paq.55.a: "感谢长生之神"
paq.56.t: "色欲之神的奖励"
paq.56.d: "色欲之神觉得很无聊，所以想给予帝国一些奖励，而代价必然是与其他神明降低关系。"
paq.56.a: "降低与战争的关系"
paq.56.b: "降低与诡计的关系"
paq.56.c: "降低与长生的关系"
paq.57.t: "战争渴望鲜血"
paq.57.d: "战争之神非常享受战争所带来的甜美滋味，但显然帝国目前正处于和平状态..."
paq.57.a: "为战争献上祭品"
paq.57.b: "不能把普通人当成祭品"
paq.57.c: "快去找色欲来！"
paq.58.t: "战争与色欲和解"
paq.58.d: "战争与色欲最近的紧张氛围有所缓解，女皇因此受益。"
paq.58.a: "太好了！"
paq.59.t: "诡计与长生和解"
paq.59.d: "诡计与长生最近的紧张氛围有所缓解，女皇因此受益。"
paq.59.a: "好！"
paq.60.t: "诡计之神的别称"
paq.60.d: "色欲之神非常希望女皇评价一下诡计之神是什么样的。"
paq.60.a: "千变万化"
paq.60.b: "千恋万花"
paq.60.c: "全知全能"
paq.60.e: "骗术大师"
paq.61.t: "释放自我"
paq.61.d: "色欲的概念不仅是涩涩这么简单，它包含了所有的欢乐情感。帝国的一些色欲信徒经常在公共场合进行不文明的活动，女皇是否该对此进行限制？"
paq.61.a: "无需干涉信徒行为"
paq.61.b: "要注意公众形象"
paq.62.t: "拒绝和平"
paq.62.d: "因为帝国处在和平状态，所以战争之神很不高兴。"
paq.62.a: "战争期间也没见你啊"
paq.62.b: "我们会进行反省"
paq.62.c: "为战争献上祭品"
paq.63.t: "思想统一"
paq.63.d: "我国应该与宗主国一样，共同信仰混沌诸神。"
paq.63.a: "好的"
paq.64.t: "边境危机"
paq.64.d: "在原妖精领土与远征军的边境上，面对保护了部分妖精的圣杯远征军，帝国军队与其之间的摩擦越来越多。由于帝国境内的全面动乱，我们暂时无法发动全面战争，不过彼此之间的擦枪走火就难以避免了。"
paq.64.a: "我们之后再处理她们"
paq.65.t: "与混沌帝国的边境冲突"
paq.65.d: "近期[PAQ.getname]的军队频繁发出挑衅，边境冲突一触即发。"
paq.65.a: "这或许是了解混沌的好机会"
paq.66.t: "挑衅成功"
paq.66.d: "帝国军队取得了边境冲突的胜利，我们的军队更成熟了。"
paq.66.a: "好"
paq.67.t: "略胜一筹"
paq.67.d: "我们的军队成功击败了挑衅的帝国军队，现在我们对混沌军队的构成有了更多的认知。"
paq.67.a: "好事"
paq.68.t: "边境冲突战败"
paq.68.d: "军队在与对方的边境冲突中战败了..."
paq.68.a: "总结经验"
paq.69.t: "偿还之日"
paq.69.d: "薇莉安终有一天要偿还代价，而这天马上就要到来。现在她面临两个选择：要么向四神恳求，继续延长回报的时间；要么否定四神，与四神为敌。前者是更为妥当的选择，至于后者，有人砍过战争，有人骗过诡计，色欲力量较弱，长生会因世间人类健康而衰弱，那薇莉安也有机会摆脱四神..."
paq.69.a: "四神给予了我一切，违抗它们的后果不堪设想"
paq.70.t: "四神的回应"
paq.70.d: "四神似乎对萌心世界逐渐失去了兴趣，这也许和薇莉安彻底征服了南美有关，也可能是因为它们本就对这个世界兴致不高。当四神得知薇莉安的请求时，它们几乎想都没想，就达成了一致：混沌诸神将不再向薇莉安索取报酬，而她如果想对外部的秩序世界展开更大规模的战争，四神也依然会给予其支持，因为她已证明了自己的能力。"
paq.70.a: "赞美四神"
paq.71.t: "最终选择"
paq.71.d: "这将是[PAQ，getledaer]面临的最终选择，选择留守南美意味着永世安宁，养精蓄锐，可以等到四神再度注视之时再重新开始行动。而选择准备发动对外部秩序世界的入侵不一定能得到四神口头答应的支援，毕竟它们已经失去了相当多的兴趣..."
paq.71.a: "......"
paq.72.t: "古怪瘟疫"
paq.72.d: "我国突然开始流行起一种古怪的疾病，任何医学专家都无法得知它是如何出现的..."
paq.72.a: "太糟糕了"


#结算事件
PAQ_end_title: "§9现在，万物归于沉寂§!"

#剧情文本
PAQ_end_tip: "天空不再有日升月落，取而代之的是一片永恒的、温柔流淌的深紫。曾经那些以此为傲的文明、钢铁铸就的秩序、还有那些声嘶力竭的呐喊，都在混沌的潮汐中，化为了平等的、沉寂的尘埃。\n“……结束了。”我轻声说道，声音在空旷的天地间没有回响。那些在我脑海中喧嚣了半生的低语，那些来自神明的催促，在这一刻统统消失了。因为祭坛已经堆满，承诺已经兑现。\n他们曾恐惧这股力量，称其为浩劫，视为毁灭。可在我眼里，这却是……净化。我亲手剥去了这个世界虚伪、嘈杂、充满了偏见的外壳，让它回归到了最初的、不分彼此的宁静之中。\n再也没有人会因为出身而被蔑视，再也没有人会为了虚荣而争斗。在这片紫色的永恒里，众生平等，万物归一。\n\n好安静啊。\n真的……好安静。"

#感谢语与寄语
PAQ_end_tip_2: "感谢您对钢铁萌心与阿德莱希帝国内容的喜爱与支持！\n愿你在凝视深渊之时，亦能找到属于内心的片刻安宁。"

