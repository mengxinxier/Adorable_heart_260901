PAQ_sbzzfs_jyz: "血祭血神"
PAQ_sbzzfs_jyz_desc: "为战争之神奉上无尽的毁灭，便可得到无穷的力量。\n所有核心领土都被散播混沌腐蚀的非主要国家可以被打上混沌印记，在最终时刻成为混沌忠实的仆从。"
