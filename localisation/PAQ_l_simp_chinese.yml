#角色与介绍
 PAQ_GATHERING_STORM_DESC: "曾经引以为傲的普鲁士鹰徽，如今已在南美湿热的瘴气中生出了艳丽而致命的霉斑。阿德莱希帝国，这个曾由钢铁与纪律铸就的庞然大物，在老皇帝驾崩的那一刻，便已沦为一具散发着甜腻腐臭的巨大尸骸。\n在那场没有记载于史册、却流淌着浓稠鲜血的晚宴后，那些曾经不可一世、为了皇冠互相撕咬的皇子皇女们，都已变成了王座下无法辨认的肉块。而那个被视为灾星、被遗忘在阴沟里的疯癫小公主薇莉安，正踩着亲族的碎骨，在混沌诸神的嬉笑声中加冕。\n如今，理性的光辉已从这片土地上彻底熄灭，取而代之的是癫狂的呓语。帝国的军队不再是为了扩张版图，而是为了满足女皇那扭曲的破坏欲而存在的猎犬。她注视着国境线外的世界，眼底没有统治者的贪婪，只有一种孩童般残忍的天真——她想把这片大陆像旧玩具一样拆开，看看里面是不是也塞满了有趣的惨叫。\n对于薇莉安而言，即将到来的根本不是什么政治博弈或卫国战争，而是一场向着虚空献祭的、盛大而血腥的……游戏。"
 PAQ_WLA_DESC: "薇莉安是阿德莱希皇室中年龄最小的妹妹，然而作为小公主的她并没有得到太多宠爱。出生在强者至上国度的少女，因没有王位继承权便从小被兄长与姐姐们嘲笑，欺负。而拥有雄心壮志的父亲也更看好他年长的孩子们。至于薇莉安的母亲，则早在分娩时离世。从小在被欺压的环境下长大的薇莉安，性格逐渐变得暴躁。由于在皇宫内没有朋友，她经常跑到城里去和那些下贱的平民玩耍。被姐姐们发现后的嘲笑使她的性格更加步入极端，而她也因此在无意间得到了混沌之神的瞥视。在第四次扩张战争失败后，哥哥姐姐们拼死争夺皇位时，她终于得以与混沌的神明对话，并得到了它们的认可，获得了强大但可怕的力量，并最终通过一系列血腥手段登上了皇位。如今，为了报答混沌的恩赐，同时也是为了证明自己的能力，在内部彻底安定后，她将对整个南美发动一场浩劫般的战争。也许这场战争会摧毁南美的一切，但对她来说，那又能如何呢？"
