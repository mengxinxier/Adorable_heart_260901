PAQ_sbgjfs_jyz_desc: "在其他国家设立诡计教团，利于散播腐蚀。\n所有核心领土都被散播混沌腐蚀的非主要国家可以被打上混沌印记，在最终时刻成为混沌忠实的仆从。"
PAQ_sbsyfs_jyz: "色欲诱惑"
PAQ_sbsyfs_jyz_desc: "色欲代表着所有的欲望，因此可以快速向国外散播腐蚀。\n所有核心领土都被散播混沌腐蚀的非主要国家可以被打上混沌印记，在最终时刻成为混沌忠实的仆从。"
PAQ_sbcsfs_jyz: "长生瘟疫"
