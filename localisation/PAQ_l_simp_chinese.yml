	PAQ_sy_5:"林间与王冠的迷香"
	PAQ_sy_5_desc:"不用跟妖精和艾尔孚利登硬拼，顺着风把迷香吹过去就够了。"
	PAQ_sy_6:"堕落星光与夜曲"
	PAQ_sy_6_desc:"不管是苦撑的魔法少女还是夜莺的亡灵，都扛不住欢愉的侵蚀。"
	PAQ_sy_7:"莉兰迪亚不眠夜"
	PAQ_sy_7_desc:"先把享乐的风气散进莉兰迪亚后方，等他们自己松懈了再动手。"
	PAQ_sy_8:"欢愉教团网络"
	PAQ_sy_8_desc:"往各国上流圈子走私香膏和画像，把他们的权贵先发展成信徒。"
	PAQ_sy_9:"甜美的侵蚀"
	PAQ_sy_9_desc:"靠地下的色欲教团一点点掏空邻国，让他们彻底离不开阿德莱希。"
	PAQ_sy_10:"无血的臣服"
	PAQ_sy_10_desc:"只要把对面的上下全都腐蚀透，连仗都不用打，他们自己就会跪着送上门。"
	PAQ_sy_11:"南美极乐圣国"
	PAQ_sy_11_desc:"南美再也没有反抗的声音了，整片大陆都成了侍奉圣女的乐土。"
	# 战败线 · 长生神选（黛丽·达威）
	PAQ_cs_1:"埋葬阿德莱希"
	PAQ_cs_1_desc:"砸烂旧皇冠和铁十字旗，这个吃人的旧帝国早该入土了。"
	PAQ_cs_2:"审判每一块勋章"
	PAQ_cs_2_desc:"从皇室余孽到靠死人军功爬上去的新旧贵族，挨个拉出来算总账。"
	PAQ_cs_3:"化铁十字为沃土"
	PAQ_cs_3_desc:"把旧帝国的钢铁和废墟埋进土里，正好拿来养活新的菌毯。"
	PAQ_cs_4:"无痛的平等军团"
	PAQ_cs_4_desc:"慈父拿走了病痛和饥饿，被旧帝国欺压的穷苦人现在全是不怕死的战士。"
	PAQ_cs_5:"腐朽森林与王冠"
	PAQ_cs_5_desc:"南美闷热潮湿的林子最适合养瘟疫，让菌丝顺着边境漫过去。"
	PAQ_cs_6:"生与死的循环"
