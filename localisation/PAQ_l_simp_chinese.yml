#剧情文本
PAQ_end_tip: "天上再也没有日出和日落了，抬头看去，只剩下一片望不到头的深紫色。以前那些不可一世的大国、坚固的防线、还有战场上没完没了的喊杀声，现在全都淹没在了混沌的浪潮里，半点动静都没剩下。\n“……结束了。”我小声说了一句，空荡荡的天地间连个回音都没有。那些在脑子里吵了半辈子的神明低语，到了这一刻总算彻底消停了。祭坛已经堆满，当初签下的契约也彻底结清了。\n外头的人以前总怕这股力量，管这叫末日。可现在放眼看去，再也没有人会因为出身低微被人踩在脚下，也没有人会为了抢一口吃的或者争个皇位打得你死我活。在这片紫色的雾气里，不管是贵族还是平民、活人还是死人，总算全都一个样了。\n\n真安静啊。\n从来没这么安静过。"

#感谢语与寄语
PAQ_end_tip_2: "感谢您对钢铁萌心与阿德莱希帝国内容的喜爱与支持！\n愿你在凝视深渊之时，亦能找到属于内心的片刻安宁。"

