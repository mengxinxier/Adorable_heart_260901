  com_japan_news.002.title: "$news_event_background$樱花国革命胜利"
  com_japan_news.002.desc: "今日上午十时，樱花革命临时政府在江户日比谷公园举行建国典礼。数十万工人、农民、士兵和学生聚集在公园及周边街道，见证了樱花社会主义共和国的诞生。\n\n典礼上，革命委员会主席夏娜同志发表了建国演说。\n她首先向六十年来为反抗军国主义、封建压迫和资产阶级剥削而牺牲的烈士致敬。随后宣布了新政权的首批法令：\n一、废除天皇制及一切贵族爵位。天皇将作为普通公民接受人民法庭审判。\n二、废除寄生地主土地所有制。全国土地收归国有，无偿分配给无地和少地的农民。\n三、废除财阀垄断。三井、三菱、住友、安田等财阀的全部资产收归人民所有。\n......\n\n夏娜同志在演说中特别强调：\n“这场革命不是换一面旗。这场革命是让那些从来没有被问过‘你想要什么’的人，第一次被问这个问题。工人想要什么？农民想要什么？被军国主义驱赶上战场的士兵想要什么？失去丈夫和儿子的母亲想要什么？我们问她们。然后照她们说的去做。”\n典礼最后公布了革命委员会组成名单。除夏娜同志担任主席外，副主席由原樱花赤军政治委员威尔艾米娜同志担任，军事人民委员为原海军起义将领坂本真一，农业人民委员由农民运动领袖山田花子出任。革命委员会中工人代表占四成，农民代表占三成，士兵代表占两成，知识分子代表占一成。\n截至发稿时，全国已有三十七个县宣布响应革命。大阪、名古屋、札幌等主要城市均在工人赤卫队控制之下。零星抵抗仅存在于九州部分乡村地区，预计将在数日内平息。\n六十年。从明治维新到军国主义狂飙，从太平洋战争到军阀割据，从饥荒到内战——这片土地经历了太多。今日，樱花国第一次有了一个问人民“你想要什么”的政府。"
  com_japan_news.002.a: "我们得到是全世界！"
  com_japan_news.002.b: "似了喵"
  com_japan_news.002.c: "东亚的明天会更光明"
  com_japan_news.002.d: "世界革命的伟大胜利"
  com_japan_news.002.e: "我去！"

  com_japan_news.003.title: "$news_event_background$远东军事法庭"
  com_japan_news.003.desc: "今日上午九时，远东人民法庭在江户皇居前广场开庭。这是樱花人民共和国成立后首次以人民政权名义举行的国际审判。\n审判长由威尔艾米娜同志担任。公诉人席上坐着樱花、中国和朝鲜的三方检察官代表。\n被告席上站着东条英机、近卫文麿、松井石根等二十八名甲级战犯。起诉书列明四类罪行：发动侵略战争罪、危害人类罪、战争罪、对本国人民之罪。公诉人宣读了一名南京大屠杀幸存者的证词，旁听席鸦雀无声。\n夏娜同志向法庭提交书面声明：\n“今天审判的不是几个人，而是一整套制度——军国主义、天皇制、财阀资本共同构成了这台杀人机器。不要再把罪恶推给民族性。没有任何民族生来就是屠夫。”\n声明以一句她标志性的话结尾：\n“烦死了。快点审完。外面还有很多事要做。”\n初审结束时，东条不认罪，近卫保持沉默。威尔艾米娜审判长敲下法槌：\n“历史不会因为换一面旗而不同。但正义会因为这面旗是红旗而到来。”\n广场上，有人放了二十八把空椅子，每把椅子前摆着一束野花。"
  com_japan_news.003.a: "好死！"

