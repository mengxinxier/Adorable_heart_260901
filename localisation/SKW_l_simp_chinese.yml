  com_japan.002.title: "皇室的命运"
  com_japan.002.desc: "虽然人民已经牢牢把控了权力，但旧皇室的问题仍悬而未决。对于如何处理他们存在各种观点，一些人建议改造他们，让他们和普通劳动者平起平坐，另一些人则认为他们应该为战争期间和更久之前对人民犯下的罪行受到更严厉的惩罚。尽管尚未做出决定，但不管何种选择都需要处理异议。"
  com_japan.002.a: "让他们像普通人一样生活。"
  com_japan.002.b: "让他们在监狱里度过余生。"
  com_japan.002.c: "让他们活着太危险了！"

