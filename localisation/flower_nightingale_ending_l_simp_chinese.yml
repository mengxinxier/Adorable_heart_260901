 l_simp_chinese:
 FLOWER_NG_ACT1_TITLE:0 "于是，长夜终于结束了"
 FLOWER_NG_ACT1_SUBTITLE:0 "【归档】莉兰迪亚亡灵危机处理完毕 —— 临时执政委员会纪要"
 FLOWER_NG_ACT1_CAPTION:0 "白城外港，停泊旗重升的清晨"
 FLOWER_NG_ACT1_BODY:0 "王城钟楼的最后一声警报，在天亮前停了下来。\n\n工兵连清理完血魔城到白城一带游荡的亡灵后，已经从外侧将王宫地下大厅的大门焊死。至于前任王室成员索拉娜的去向，临时委员会统一对外公布其已在破城时死于反噬。\n\n海风重新吹起了港口的旗帜。伤兵坐在岸边晒着早春的太阳，孩子们在空地上奔跑追逐，港湾里的渔船也陆续出港了——\n\n接下来，只要稳妥完成眼下的交接，把废墟清理干净，大家就能走出寒冬，迎向盼了太久的幸福了——"
 FLOWER_NG_ACT1_SCROLL_HINT:0 "—— 向下滑动以查阅封门归档附件 ——"
 FLOWER_NG_ACT2_LEAD:0 "……等等。清晨赶着印发正式通告时，值班参谋其实没敢把工兵队补交的这份附件订进去。"
 FLOWER_NG_ACT2_SUBHEAD:0 "【附件二--封存备忘】王宫内廷封门勘验及夜巡笔录"
 FLOWER_NG_ACT2_BODY:0 "礼堂高台下那口据称封存着“那位神明”遗骸的水晶棺，撬开以后里面几乎是空的，只留着几片干枯的墨绿花瓣，什么骨灰都没有找到。\n而礼堂尽头通往深殿的那扇双开门，工兵班本来打算从外侧焊死，推了好几下却根本推不动——可门外挂锁的铁环十年前就已经锈死了，从来没有人碰过。拿灯顺着门缝往里照去，里面的门栓，原本就是被人从内侧插上的。\n\n【凌晨四点五十分：第一哨位口供】\n“长官，城里是不是还有没登记的孤儿？刚才两点半我在王宫东回廊换岗，听见前面有光脚走路的声音，很轻，走几步就停一下……我把灯照过去，隔着几根柱子看见一个穿黑袍子、个子只到人腰边的小女孩，一边走一边哼着特别奇怪的歌。我连忙举起勘验用的相机拍了一张，可刚绕过柱子她就不见了，只看得见一块黑布，摸上去冷得像块冰一样。洗出来的底片我放在底下了，您自己看一眼吧……”"
 FLOWER_NG_ACT2_PHOTO_NOTE:0 "照片编号 #04-A（冲印时间 03:15）\n那串小小的光脚印只有六岁孩子的大小——\n\n（背面原本写着几行批注，被人用力涂掉了，只剩下最底下用红笔写着的一句：\n§R别再往下翻了。§!）"
 FLOWER_NG_ACT3_MOCK:0 "……§1“埋葬夜莺”？§!\n只是关上几扇门、印一份让大家安心的纸，你们就真的以为……已经把我埋进土里了呀。"
 FLOWER_NG_ACT3_BODY:0 "你好像也很喜欢看他们这样坐在岸边晒太阳吧？\n\n其实我也一样哦——这群孩子好不容易能靠在岸边笑一笑，在空地上跑来跑去。无论谁看了，都会忍不住觉得这样真好吧。\n\n可光凭他们自己，原本怎么可能这么快就站得起来呢……\n\n只要屏幕外的你愿意相信这是真的，他们就会一直这样，§0高高兴兴地朝你招手哦。§!"
 FLOWER_NG_ACT4_W1:0 "那个抢了心脏的可怜家伙，还有陪着她关在一起的小姑娘，现在待得很安静呢……"
 FLOWER_NG_ACT4_W2:0 "倒是外面这群人类，明明受了那么重的伤，怎么还是这么急着往前走呢？停火通告才刚刚贴出去吧？他们就已经忙着收拾东西、商量怎么把生活重新过好了。"
 FLOWER_NG_ACT4_W3_BG:0 "对不对啊——一直坐在屏幕外面、隔着玻璃翻看他们国策树的“观众”？"
 FLOWER_NG_ACT4_W3_FG:0 "对不对啊——一直坐在屏幕外面、隔着玻璃翻看他们国策树的§R“观众”？§!"
 FLOWER_NG_ACT4_WAIT:0 "别这么紧张嘛，我今天可不是来打扰大家的。\n正好相反，§R我会安静地陪着你一起等下去……§!\n等这里重新变得热闹了，等大家把好不容易盼来的生活过好了，等所有人都像现在这样放心地笑着、以为漫长的黑夜已经彻底过去的时候……"
 FLOWER_NG_ACT4_GOLD:0 "因为大家抱在一起发抖的时候，看着可一点意思也没有嘛。\n总要等你们彻底放下心来、觉得以后真的都会好起来……\n那个时候再留下来陪我，我才不会觉得那么冷、那么无聊呀。"
 FLOWER_NG_ACT5_SHH:0 "“嘘——”"
 FLOWER_NG_CLOSE_BTN:0 "“嘘。别停下来，继续往前走吧……我会一直看着你的。”"
 FLOWER_NG_CLOSE_BTN_TT:0 "门，本来就是从里面锁上的。\n现在，轮到你把这扇窗口关上了。"
 FLWAI.45.t:0 "长夜，余响"
 FLWAI.45.d:0 "一切………照旧………………"
 FLWAI.45.a:0 "……"
 flower_nightmare_overture:0 "八音盒"
 flower_nightmare_release:0 "落锁，回廊"