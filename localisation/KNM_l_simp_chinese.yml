####介绍####
KNM_new_tips:0 "§4@KNM雾之湖§!的§Y内容更新§!:\n£GFX_PAM_am §9莉莉白线§!:\n§9春天来啦！\n春天真的来啦！\n\n咦，你说春天还没来吗？\n你看呀！那片雪正在化呢。\n那朵花马上就要开啦。\n\n没关系，我再飞一圈。\n把没撒完的春天，\n一点一点，\n都撒下去。\n\n等到大家都从冬天的被窝里探出头来，\n春天才算真正到了。\n在那之前——\n我会一直一直，\n在这里飞来飞去的！§!"
KNM_start_game_text: "§7雨停了诶，大家都还在吗§!"
KNM_route_guide_desc:0 "§9感谢名叫Beartice的大佬为雾之湖提供的兵模哦！！！§!\n\n§4雾之湖联盟§!路线指南\n\n一、§9莉莉白线§!\n\n喂！听好了，你这个笨蛋！既然你想看那个白衣服妖精出来表演，那本小姐就勉为其难地教教你好了！\n\n首先，你要跟着最聪明、最强的琪露诺大人，去彻底击败南边那个红魔馆，拆掉她们的破铁门！\n\n等我们打赢了，大厅里就会弹出一个叫§Y《这里的地毯真暖和》§!的事件。到那时候，你千万别选别的，必须选择那个§9“春天怎么还没来？”§!的选项！\n\n选了这个，那个白衣服的家伙就会揉着眼睛醒过来，带着大家开始她的春天大冒险啦。办法就是这么简单，连本小姐都一听就懂，你可绝对不许选错啊！"
KNM_Local_History_Title: "§4雾之湖§!地区"
KNM_loca_his_t_01: "雾之湖水域"
KNM_Local_History_Page_01: "位于幻想乡王国与德意志帝国交界地带的雾之湖，自古便是低地地区的核心水系。自《凡尔登条约》划分帝国版图以来，这片水域长期作为两大强权之间的天然缓冲区。由于地势低洼、水汽终年不散，这里形成了大片的沼泽与湿地。1871年普法战争幻想乡战败后，这片水域曾与南侧的红魔馆一同割让给德意志；直至1918年伟大战争结束，幻想乡虽收回红魔馆，但对这片终年大雾、不宜人居的潮湿湖泊未能建立起有效的直接行政管辖，使其在战后成为了事实上的无政府地带。"

KNM_loca_his_t_02: "红魔馆北疆"
KNM_Local_History_Page_02: "红魔馆北疆紧邻雾之湖水系南侧。这里曾是斯卡蕾特王朝（1328~1416年）的核心领地。在瓦鲁瓦王朝崛起、红魔馆降格为公国后，此地便退缩为幻想乡王国的边境堡垒。在长达数个世纪的强权均势博弈中，红魔馆的控制权数次易手，见证了多次惨烈的边境拉锯战。伟大战争后，红魔馆虽然重归幻想乡版图，但由于大公家族依然保持着高度自治，加之北侧雾之湖妖精势力的无序扩张，红魔馆的北部边境在1936年初再次面临着前所未有的治安压力。"

KNM_loca_his_t_03: "博丽结界边缘"
KNM_Local_History_Page_03: "作为分隔幻想乡内部与外部世界的博丽结界，其东段边缘正好横亘于雾之湖水域的边境。1871年幻想乡战败后，结界节点的控制权一度丧失，导致这一地区的魔法力流向发生严重偏移，气温骤降。1918年战后，虽然幻想乡夺回了结界控制权，但由于长期的战争破坏与魔法辐射，结界边缘的力场处于极不稳定的状态。大片未受管辖的自然灵性在此处溢出，形成了独特的局部微气候。这也为后来妖精的大规模聚集提供了源源不断的魔力养分。"

KNM_his_page_01_title: "低地真空"
KNM_Country_History_Page_01: "雾之湖作为政治实体的萌芽，源于低地地区长期的权力真空。自843年《凡尔登条约》将查理曼帝国一分为三以来，这片介于东西法兰克之间的沼泽地便从未建立起强有力的中央集权。在1871年德意志帝国崛起与1918年伟大战争的两次大洗牌中，双方法律上的管辖权频繁交替，导致基层行政机构彻底瘫痪。战后，幻想乡由于忙于国内的民主改革与经济重建，对这片湿地采取了消极托管态度，从而在红魔馆北侧遗留下了一片完全不设防的行政真空地带。"

KNM_his_page_02_title: "自然灵性大汇聚"
KNM_Country_History_Page_02:0 "伴随着行政真空的，是自然生态的急剧变化。由于伟大战争期间大量的魔法炮击与结界破损，雾之湖周围积累了高密度的残留魔力。这种由战争余波形成的湿润、充沛的魔法环境，对高度依赖自然活性生存的妖精族群产生了致命的吸引力。自1920年代中期起，来自幻想乡内地的野生妖精开始大规模向此地迁徙。这些心智单纯、不受世俗法律约束的自然灵性生物在湖畔安营扎寨。短短数年内，其数量便超越了本地的人类和妖怪居民，彻底改变了该地区的族群结构。"

KNM_his_page_03_title: "宣誓与现状"
KNM_Country_History_Page_03: "1936年初，这群处于无序状态的妖精群体迎来了一个戏剧性的转折。自称“最强”的冰之妖精琪露诺，在雾之湖畔聚集了数以千计的追随者。凭借着远超一般妖精的强大冰雪魔力，她击败了其他竞争对手，并在一片混乱的欢呼声中，单方面向外界宣告了“雾之湖联盟”的成立。由于妖精缺乏基本的文字书写与契约常识，这个所谓的“联盟”在外界看来更像是一个庞大的民间游乐场。然而，随着琪露诺开始对南侧的红魔馆表现出试探性的军事敌意，这片长期被遗忘的低地沼泽，再次将幻想乡的地缘政治目光吸引了过来。"
