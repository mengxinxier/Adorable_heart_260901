spring_goal_desc:0 "为了保护刚刚长出的嫩叶，大家要拉起手，跨过结界，去融化那些堆满积雪的关卡，推倒那些吐着黑烟的烟囱。春风会将花种子带去所有遥远冷清的角落，让生命重新在土里扎根。等明晃晃的阳光再次照亮每一座山头，这片大地上的人们，就全都能开心地笑起来了。"
