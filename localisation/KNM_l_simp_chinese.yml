KNM_bfbj:0 "冰封边境"

KNM_djdbxdnj:0 "大家都不想动脑筋"
KNM_djdbxdnj_desc:0 "在这片湿地里可没有规矩。大家整天在湖边飞来飞去，去树林里捉迷藏，或者在草地上打滚。要是有人拿着大本子让大家去干活，大家多半一眨眼就全飞走了。反正谁也不识字，地图和报告都跟好看的画片没什么两样，签字的时候按个泥巴脚印就好啦。至于要把房子盖得整整齐齐排成一排……唔，那是什么很难玩的游戏吗？"

KNM_bxjtxydq:0 "本小姐天下第一强"
KNM_bxjtxydq_desc:0 "琪露诺大人是雾之湖最能打的，能在一瞬间将肥肥的小鱼冻成冰块。跟着这么厉害的首领，大家心里都骄傲极了。不管是南边那个红颜色的大宅子，还是东边那些高高的铁管子，琪露诺大人一挥拳头，保准能把他们全打趴下。大家一齐大喊着往前冲，就觉得自己是无敌的。"

KNM_bxjtxydq1:0 "本小姐和大家都很强"
KNM_bxjtxydq1_desc:0 "琪露诺大人已经向整片湖泊宣告过了，在这片水面上，不仅她是最强，大家也全都是天下第一强！大喊大叫地往前冲，就算是天上开着大鸟的坏人，也会被这股闹哄哄的气氛吓得抱头鼠窜。看好了，我们就是最最聪明、最最厉害，谁也打不过的。。。反正就是最强的啦！"

KNM_dbzsmhy:0 "东边总是在冒黑烟"
KNM_dbzsmhy_desc:0 "靠近东边国境的天空总是阴沉沉的，连吹过来的风里都带着一股味。有时候，湖面上会落下一层黏糊糊的灰。那些高耸的管子一直在发出沉重的轰鸣，虽然不知道那是什么，但每次风里带上苦苦的灰尘，大家的翅膀就变得重重的了，咳嗽也根本就停不下来了。。"
KNM_dbzsmhy2:0 "东边总是在冒黑烟"
KNM_dbzsmhy2_desc:0 "靠近东边国境的天空总是阴沉沉的，连吹过来的风里都带着一股味。有时候，湖面上会落下一层黏糊糊的灰。那些高耸的管子一直在发出沉重的轰鸣，虽然不知道那是什么，但每次风里带上苦苦的灰尘，大家的翅膀就变得重重的了，咳嗽也根本就停不下来了。。"
KNM_dbzsmhy3:0 "东边总是在冒黑烟"
KNM_dbzsmhy3_desc:0 "靠近东边国境的天空总是阴沉沉的，连吹过来的风里都带着一股味。有时候，湖面上会落下一层黏糊糊的灰。那些高耸的管子一直在发出沉重的轰鸣，虽然不知道那是什么，但每次风里带上苦苦的灰尘，大家的翅膀就变得重重的了，咳嗽也根本就停不下来了。。"
####联合国策####
FRA_focus_wetland_buffer:0 "那只是片烂泥地而已"
FRA_focus_wetland_buffer_desc:0 "北边要修防线，可账面上根本抠不出多少钱来。正好，那群小妖精成天在边界上刨坑。今天搬两块石子，明天挖一个泥坑，脏得不成样子。外面的人看过去觉得是个幼稚鬼们的泥林子，可要是真有铁家伙想开过来，踩进这些烂泥里，保准陷得连轮子都拔不出来。一分钱不用花，由着她们去折腾吧。"

FRA_focus_requisition_labor:0 "稳赚不赔的买卖"
FRA_focus_requisition_labor_desc:0 "那些小妖精又把卡车开得呼呼直响，在神社后门卸下一大堆比马车还大的南瓜，还有一筐筐晒得干透的山栗。放着也是招老鼠，不如把储藏室里那些生了锈的铲子、铁箱，还有地精们喜欢的铁片给她们拉回去。做账的河童看着这笔买卖直揉眼睛，说天底下哪有这么赔本的合同。可妖精们只觉得今天赚大发了，抱着一堆铁器在草地上直打滚。罢了，后厨今晚能蒸好几锅南瓜糕，先吃饱了再说。"

FRA_focus_west_germany_core:0 "等春花开满山头"
FRA_focus_west_germany_core_desc:0 "西德那一带现在焦黑一片，全是被兵工厂熏出来的焦油和烂铁的味道，看着就让人犯恶心。不过，那地界本来就是我们的。不如让莉莉白过去转转，她嗓门大，一喊就能招来风。等漫山遍野开满迎春花，把那些肮脏的焦味全盖住，我们就能写信给外面那帮老家伙，说这地里的花开得正好，我们要收回来管着。谁也挑不出毛病，地里长出了乐园的花，那地不就是我们的吗？"

FRA_focus_grant_autonomy:0 "往后就不归我们管了"
FRA_focus_grant_autonomy_desc:0 "天天看着一群不识字的小家伙在屋里抢零食、在刚擦净的地板上踩满脏脚印，我这脑壳都要疼裂了。既然仗都打完了，防线也安稳了，干脆随她们去吧。写张大纸盖个章，说以后湖边和林子归她们自己管。她们觉得是自己当了家，高兴得满天直飞。至于大方向嘛，当然还是我们说了算。这下子，屋里清静了，连雇人扫地的工钱都省下不少，真是谢天谢地。"
FRA_focus_grant_autonomy_t:0 "获得§Y@KNM[KNM.getname]§!现有工厂§Y10%§!的额外使用权"
FRA_focus_grant_autonomy_t2:0 "获得§Y@KNM[KNM.getname]§!现有工厂§Y20%§!的额外使用权"
FRA_focus_grant_autonomy_t3:0 "如果我们选择成立§3欧盟§!，§Y@KNM[KNM.getname]§!将无条件支持我们的提议！"

FRA_focus_teach_literacy:0 "至少学会签个名字"
FRA_focus_teach_literacy_desc:0 "文书送过去，退回来时纸上全是带泥的印子。这群连手指数不全的家伙指望不上，可总不能天天由着她们踩坏公文。我们在她们外面摆了几张木桌，倒不是要教她们什么大道理，好歹得让她们学会用笔在纸上画个名字，或者老老实实画个圆圈也行。往后发补给的时候，至少别拿泥脚丫子把文书糊得一塌糊涂。至于学不会的？关在门外不给点心吃，多试几次她们就老实了。"

FRA_focus_cold_chain_logistics:0 "地窖底层的寒冰"
FRA_focus_cold_chain_logistics_desc:0 "隔壁那个魔导国整天散出鬼一般的冷气，连带着我们这儿的夏天都热不起来，终年潮湿。行军最怕干粮受潮长霉，好在湖边那群没脑子的妖精整天打水仗，琪露诺曾经冻出来的冰块丢得满地都是。这些冰块堆在路边也碍事，我们索性差人拉回仓库。这种带着法术的寒冰镇在地窖里，能让储藏的食物保鲜很久。"

FRA_focus_herb_gathering:0 "去草丛深处寻找草药吧"
FRA_focus_herb_gathering_desc:0 "那些蠢妖精成天在树根底下打滚，虽然傻气，但找草药的直觉倒是比狗鼻子还灵。她们睡觉时压扁的草丛里，总能刨出几株止血定痛的草药。我们搭了几个临时医护所，让随军医生跟在这群家伙后面转转。她们刨出来什么，我们就收走什么。这群小家伙成天在泥地里扑来扑去，前线受伤的士兵就不愁没有伤药用。"

FRA_focus_border_liaison_post:0 "不如在边境旁建个游乐场"
FRA_focus_border_liaison_post_desc:0 "防线上的关卡建得太死板，反倒叫湖边那群野猫一样的妖精觉得我们要来抓人。不如在边境旁建个供妖精游玩的游乐场，再放上几碗甜水和点心。那些小家伙没什么心眼，探头探脑地溜过来蹭吃蹭喝，喝饱了就嚷嚷她们在边界外面瞧见的新奇玩意。有些我们在公文里怎么也打听不着的魔导国的动静，在游乐场里，往往听两句这群蠢妖精的随口抱怨，就全明白了。"
####国策####
KNM_gdjg:0 "这里归大家管"
KNM_gdjg_desc:0 "搬到这片雾蒙蒙的水边已经好几天啦。虽然大家还没搞清楚地图上的路往哪儿走，但把碍眼的家伙通通冻住，这儿不就是大家说了算吗？琪露诺大人拍着胸脯保证，非要让南边那个红颜色的大宅子知道谁才是老大。这儿有这么多水，不全冻成大冰块也太可惜啦。"

KNM_bhsqdz:0 "湖水全给本小姐冻住！"
KNM_bhsqdz_desc:0 "雾气贴着湖面散开，冰凉的触感从脚底钻上来。琪露诺张开手，那些跳动的水珠就变成了冰块。虽然大家没这种本事，但帮着把冰坨子推到岸边铺成一条长路，还是完全没问题的。等湖面冻结实了，大家就能在上头尽情打滚，再也不用担心弄湿翅膀了。"
KNM_qhmgdn:0 "去红魔馆门口大闹"
KNM_qhmgdn_desc:0 "南边那个红颜色的大宅子总是静悄悄的，一点也不热闹。大家商量好了，趁着红头发门卫打瞌睡，悄悄溜到围墙边上唱歌，还要将湖里的水泼到那些高高的窗户上。里面的人不肯出来？那我们主动去大门口吵吵，看谁先受不了那阵乱糟糟的翅膀声。"

KNM_ggcjdjd:0 "盖个超级大基地"
KNM_ggcjdjd_desc:0 "既然这片湖边已经是大家的地盘了，就得有个放宝贝的地方。大家去树林里捡树枝，去湖边捡石头，还要去那些没人要的房子里搬木板。琪露诺大人说，要盖一个比树还要高的房子，里面要塞满大家喜欢的玩具。等这个基地盖好了，大家就有属于自己的家啦。"

KNM_btqhl:0 "夺回大家的宝贝！"
KNM_btqhl_desc:0 "红魔馆里的家伙简直太过分了。她们刚才出来扫了一圈地，就把大家辛辛苦苦捡来的漂亮石头和树枝全当成垃圾倒进湖里。那可是琪露诺大人好不容易才冻住的冰雕呀。把我们辛辛苦苦捡来的宝贝当垃圾？那我们也去把红魔馆那些擦得反光的窗户全变成垃圾！带上冰块，去把那扇一点都不好玩的大铁门砸烂吧！"

KNM_jyngdyz:0 "红魔馆是我们的！"
KNM_jyngdyz_desc:0 "红魔馆里的草坪修得又平又整齐，不拿来打滚真是太浪费了。琪露诺大人已经决定，将那座红色的大宅子变成全幻想乡最大的冰霜乐园。那些穿黑白衣服的妖精女仆整天只知道擦窗户，看着就让人觉得没劲，还不如跟着大家一起玩。至于门口那个一直拦路的红头发门卫，她虽然拳头挥得很快，可我们这么多人呢，一起冲过去她肯定拦不住。带上平时攒的石头和冰块，跟着琪露诺大人冲进那个大院子里吧。"

KNM_jyngdyz_tt:0 "我们将向@KMK§R红魔馆§!宣战！\n§R注意§!:请务必要在@KMK§R红魔馆§!解决§Y妖精叛乱§!前夺得胜利！"

KNM_zzctznl:0 "找找春天在哪里"
KNM_zzctznl_desc:0 "红魔馆的院子很大，但是现在到处都还是光秃秃的。虽然琪露诺大人带回来的冰块还没化完，但我觉得泥土里已经有东西在翻身了。我得飞去每一个花坛，钻进那些还没发芽的灌木丛里，看看第一片小叶子躲在哪儿。大家都在忙着搬家具和分红茶，这种寻找春天的小事，交给我一个妖精就好啦。"

KNM_hxyydygs:0 "好消息总要第一个说"
KNM_hxyydygs_desc:0 "我找到春天的小尾巴啦！这个暖洋洋的好消息，一定要第一个告诉琪露诺大人和大家。她们正在那个大房子里玩得那么开心，要是知道了春天也来了，肯定会蹦得更高。得飞得快快的，把这个好消息第一个告诉她们！"

KNM_drygxyx:0 "大人们也该笑一笑啦"
KNM_drygxyx_desc:0 "接下来要去人类的村子，那里的大人们总是穿着厚厚的衣服，看起来好辛苦。春天来了，大家就不用再怕冷了。飞到他们的屋顶上，用最大最大的声音地告诉他们这个消息，这样他们就不会再皱着眉头，可以开心地笑起来了。"

KNM_mfsyxzdb:0 "魔法使也想知道吧"
KNM_mfsyxzdb_desc:0 "春天是一种很厉害的魔法，那魔法使肯定会对这个消息感兴趣的。虽然她的房子总是乱糟糟的，但我知道在哪里。穿过那些大蘑菇，找到她的窗户，告诉她这个关于春天的大秘密。"

KNM_wfdn:0 "请不要把春天关起来"
KNM_wfdn_desc:0 "我好像飞得有点太远了。前面出现了一个看不到头的大房子，比红魔馆还要大，也比人类的村子还要热闹。不过，那里的空气闻起来怪怪的，有种说不出来的感觉。\n悄悄地飞近一点，躲在云彩后面看一看。要是那里的人都和琪露诺大人一样，整天只喜欢玩闹和晒太阳，我就飞下去告诉他们春天来了，跟他们一块儿玩。可万一他们的脸色都和以前红魔馆的大姐姐一样冰冷严肃……那得赶紧飞回去告诉琪露诺大人，这回碰上个比红魔馆还麻烦的大个子。春天可不喜欢那种冷冰冰的地方。"

KNM_nfcdbcl:0 "暖风从东边吹来"
KNM_nfcdbcl_desc:0 "虽然灵梦一直皱着眉头说还没到时候，但能感觉到，东边那一块总是暖烘烘的，像是有个巨大的火炉藏在云彩后面。那些直戳云彩的铁管子一定就是春天的大树，它们长得那么高，肯定是为了最先抱住太阳。飞过去看一看，那一块儿是不是已经开满了五颜六色的花。要是那里藏着春天的种子，正好捎一些回来，种在红魔馆的泥土里。"


KNM_wyhqzlm:0 "我要回去找灵梦"
KNM_wyhqzlm_desc:0 "翅膀拍得好痛好痛，风刮在脸上像小刀子割一样，流出来的眼泪一下就变凉了。我的手心里还紧紧握着那些带着热气的湿泥巴，那里面有大酱，也有琪露诺大人呢。我必须用尽全身的力气飞回去，飞向博丽神社。灵梦虽然脾气坏坏的，但她是特别厉害的巫女，一定知道怎么把大家重新变出来。去好好求求她，只要她肯帮忙，我保证以后再也不在神社门前大吵大闹了。飞快一点……再飞快一点呀……！"

KNM_wyqzhzz:0 "去找找花种子吧"
KNM_wyqzhzz_desc:0 "手心里还有那些黑泥巴苦苦的味道，怎么洗也洗不干净。灵梦摸了摸我的头，说大酱和琪露诺大人这次是真的死掉了，再也醒不过来了。可是……我不相信。泥土是种子睡觉的地方呀，有了暖和的太阳，漂亮的花种子，地里就一定会重新开出花来的！我想，等小花开满山头的时候，大酱她们一定也会拍着翅膀从泥里钻出来的。离开这个冷掉了的神社吧，去森林里，去山谷里，把藏在每一片叶子底下的暖风都攒起来。去找最厉害的花种子，把真正的春天带回来！"

KNM_xnyz:0 "小鸟要站在最高处"
KNM_xnyz_desc:0 "那些大烟囱排出来的黑烟越来越重了，偶尔还能听到地底下传来闷雷一样的声音。小鸟们很害怕，我也很害怕。我们要让小松鼠、麻雀和各种各样的鸟儿，都飞到大结界边缘高高的树梢上站着。它们看到雾气里有奇怪的铁盒子在动，或者闻到那种难闻的焦味变浓了，就要大声叫起来。这样大家就能最先知道，冬天的恶劣天气是不是要过来捣乱了。"

KNM_stybxmg:0 "送魔理沙一包发光小蘑菇"
KNM_stybxmg_desc:0 "魔理沙的小木屋里堆满了瓶瓶罐罐。她说，她要用闪闪发光的粉末做一些很大很大的礼花，这样等天黑下来的时候，就能把东边的阴影全都给照亮呢。我从森林深处采集了好多发光的小蘑菇，还有冰块融化时留下的露水，这些都是能让礼花变得更响的材料。把这些全送去她家里吧，她一定会高兴得在院子里转圈圈。"

KNM_blmsly:0 "帮灵梦扫落叶"
KNM_blmsly_desc:0 "灵梦这几天看起来好累，一直在神社的大门前叹气。那个透明的、保护大家的大结界，上面好像多了一些细细的裂缝，像快要碎掉了一样。我知道大结界很重要，大结界一坏，东边那些怪物可要跑进来了。我要带着森林里的妖精，帮灵梦把神社的院子扫得干干净净，还在井水边放上好吃的野果。这样灵梦就不用扫地啦，能安安心心地去补那个大结界啦。"

KNM_phdyqz:0 "排好队一起往前走"
KNM_phdyqz_desc:0 "大家平时总是乱哄哄地到处飞，一遇到狂风吹过来就吓得躲进草丛。可现在琪露诺大人不在了呀。得让大家学着排好队，跟着风的节奏一起往前走。虽然一开始肯定歪歪扭扭的，但只要排在一起，大雾突然围过来的时候谁也不会走散。要是碰到踩坏花草的坏家伙，大家还能一拥而上把它赶跑。"

KNM_sgxzcsd:0 "好吃的都藏进树洞"
KNM_sgxzcsd_desc:0 "春天虽然会来，但现在天空中总是飘着奇怪的烟，有时候阳光也会被挡住。要把森林里所有的松果、橡子还有地底下的吃的都找出来，统统搬进又深、又干燥的树洞里。就算外面突然变得好冷好冷，或者有坏家伙把路挡住不让大家出门，我们也照样有坚果吃，肚皮绝不咕咕叫。"

KNM_nbrhh:0 "泥巴要变得软乎乎才好"
KNM_nbrhh_desc:0 "东边那些沉甸甸的铁轮子，没路就走不动了。我想让湖水漫出来，把平整的路全浇透，让土变成黏糊糊的烂泥。泥巴要是能像化掉的棉花糖那样缠人，卡车轮子一旦陷进去，就再也拔不出来了。大家如果能够在旁边看着这些坏车子陷下去，肯定特别有趣。毕竟这样，小草就能安心地长出来了。"

KNM_hxws:0 "喝下一大杯温水"
KNM_hxws_desc:0 "大酱她们在风雪里不见了之后，留下来的小妖精们整天缩在被窝里偷偷地哭。大家都知道那些黑灰意味着什么。去煮一大锅热腾腾的温水吧！在里面撒满干花和香甜的蜂蜜，给大家一人盛上一碗。小家伙们捧着碗，一边掉眼泪，一边小口小口喝着。当肚子里有了温暖的感觉，冻僵的小手和小脚慢慢有了知觉，大家才有力气擦干眼泪，在这片寒冷的废墟上，重新把家盖起来呀。"

KNM_cypmdfz:0 "草叶铺满了大房子"
KNM_cypmdfz_desc:0 "红魔馆里现在留下了好多个空房间呢。我要带大家去林子里收集嫩叶，还有带松脂味的干草，满满当当铺在每个房间的地上。这样新朋友搬过来的时候，就能窝在一起打滚啦。大家动手搬呀，把空空的屋子全塞得满满的！"

KNM_dfzsht:0 "大石头房子就送给河童吧"
KNM_dfzsht_desc:0 "湖边有些好大好大的石头房子，里面有烧得通红的炉子，河童们管它们叫“工厂”。那些铁疙瘩总是发出很响的噪声，妖精们根本不会用，只会看着它们发呆。灵梦说，河童们需要这些房子来做有用的工具。那我就把这些大房子全送给河童好啦！反正大家更喜欢在草地上晒太阳，用这些冷冰冰的房子换新朋友来陪我们，真是太划算啦。"

KNM_qsllqxpy:0 "森林里能请来新朋友"
KNM_qsllqxpy_desc:0 "空出来的床位太多了，湖畔的草地上也冷清清的。让松鼠和麻雀飞去神社和魔法森林，告诉那里的妖精，我们这里有又大又暖和的床，还有分不完的栗子和甜水。搬过来和我们一起住吧！每天都能在平整的草坪上玩耍，新朋友们快来，这里特别需要你们！"

KNM_djyqlgz:0 "大家一起来工作"
KNM_djyqlgz_desc:0 "新来的朋友和大家还不太熟悉，总是冷不丁地缩在角落。这可不行，带着大家一起去湖边捡石头，去林子里找蘑菇，把被大雪压断的树枝清理干净。大家的小手都动起来，一起做有意思的事，说说话，原本陌生的小妖精也会变成最好的朋友，工作的速度也会变得飞快呢。"

KNM_hlzxdyh:0 "捧起第一朵花"
KNM_hlzxdyh_desc:0 "新朋友和老朋友现在都围在我的身边啦。在幻想乡最显眼的地方，挖开松软的泥土，一起用双手把第一粒花种子埋进去。大家一起对着泥土唱起叫醒春天的歌，那股暖融融的力量就会把寒风吹散。等第一朵花开出来的时候，大家就能明白，我们已经重新站起来了。"
#备战魔导国#
KNM_cbbpl:0 "再小的翅膀也不会怕冷的"
KNM_cbbpl_desc:0 "风雪把大结界撞得啪啪响，外面的灰色雾气已经贴到窗户上了。我知道，一味地躲在屋子里，那些变成泥土的朋友也永远不会醒过来。虽然我的身子很小，翅膀也很薄，但这一次，我再也不会害怕冬天的寒冷了。大家把厚衣服穿好，我们要准备出发了。"

KNM_bzyq:0 "大家抱在一起就不怕了"
KNM_bzyq_desc:0 "地精们已经将木棒擦得闪闪发亮，大青蛙们也都潜在水里等待着出发。妖精们手拉着手，互相拥抱着暖和的身子。哪怕外面的天阴沉沉的，但只要我们的心全部都连在一起，那种温暖的气息就能驱散所有的寒风。做好准备，大家一起去夺回春天吧！"

KNM_yqdbdt:0 "我们一起去打败冬天好不好"
KNM_yqdbdt_desc:0 "我飞回了大家商量事情的大厅。里面冷冷的，大人们都在看着我。我想要问问那里的大人和大家，愿不愿意和我们一起去东边。那里有好多喷火的管子，也有会让人变成泥土的法术。等我们一起拆掉了那个铁房子，春天肯定会重新回来的。"

KNM_cglsct:0 "风吹过来的时候就是春天"
KNM_cglsct_desc:0 "森林里的风、山谷里的风，还有高空中的气流，现在都在我们的屁股后面使劲吹着。这股风很大很大，暖洋洋的，夹杂着桃花和泥土的香气。我们张开翅膀，顺着这股大风飞得越来越快。当这股暖风刮到东边的时候，那些脏烟囱和铁疙瘩也肯定会被春天融化的！"

KNM_gsblx:0 "把春天大声唱出来"
KNM_gsblx_desc:0 "东边的地平线上已经能看到密密麻麻的钢盔和铁轮子了。那里的喇叭在发出难听的噪音，像是在嘲笑我们的弱小。我深吸了一口暖乎乎的空气，用尽全身的力气响亮地唱起叫醒春天的歌。这歌声在云彩里横冲直撞，比他们的炮声还要响亮。要让那些冷酷的家伙听见，春天可不是那么好欺负的！"

KNM_ctll:0 "“春天来啦！”"
KNM_ctll_desc:0 "逆风刮过来，翅膀有些拍不动了。落下来的黑雪扑在睫毛上，扎得眼睛酸酸的。\n\n衣领里塞着的那只小木盒还是暖和的。大酱和琪露诺大人热热的泥巴贴在我的心上，是这整片荒野上唯一不冷的地方。\n\n前面全是灰扑扑的烟，还有那种很重很重的铁轮子在地上轰隆轰隆地压过去。我闭着眼睛往前飞，风把眼泪吹成了一滴滴凉凉的水。但我还是把头抬起来了。对着那片阴沉沉的天空，用尽全身的力气，大声喊了出来：\n\n§9“听好啦——春天来啦！！”§!"
KNM_ctll_tt:0 "我们将向@DVL§0魔导国§!宣战！\n§R注意§!:这意味着我们将打响§R第二次“伟大战争”§!"

KNM_tytfs:0 "让风轻轻地吹过去"
KNM_tytfs_desc:0 "大酱以前最喜欢听湖边的风声了。我把装着黑泥的小口袋挂在高高的树梢上，让风轻轻地吹过去。风里有湖水的味道，也有大家以前玩耍时的喧闹。泥土里的粉末在微微发亮，我相信，一直听着这些熟悉的声音，那些睡着的灵魂就会慢慢记起回家的路。"
KNM_sjxs:0 "收集山谷中的所有笑声"
KNM_sjxs_desc:0 "新来的妖精总是在林子里大笑，笑声在山谷里飘来飘去，特别好听。大酱和琪露诺大人以前也是这样，整天在水边闹个不停。我提着小竹篓，把这些快乐的声音都装进去，然后把它们全都洒在有了些许暖意的泥土里……然后，泥土里似乎就变得痒乎乎的了，冒出了好多个小气泡，那一定是她们在里面笑呢。"
KNM_sgdx:0 "找找……找找琪露诺大人"
KNM_sgdx_desc:0 "琪露诺大人很喜欢冰，她以前总爱把碎冰洒在大家头上。我在大树底下的落叶堆里，找到了好些没有化掉的小冰碴。大家把这些冰碴收集起来，小心翼翼地埋进泥里。凉呼呼的温度能让睡在里面的琪露诺大人觉得很舒服吧，她最怕热了。"
KNM_wzhdcg:0 "大家围着火堆唱歌吧"
KNM_wzhdcg_desc:0 "天色暗下来了，森林里燃起了暖和的篝火。新来的朋友和我们围成一个大圈，手拉着手唱着歌。歌声飞到了树梢上，也落进了软和的泥土里。那些原本凉透了的灰烬，在歌声和火光里变得温暖了起来，好像有无数个小手在泥土里跟着歌声拍打一样。春天最喜欢听大家唱歌了。"
KNM_zqychmg:0 "再去一次红魔馆大门前"
KNM_zqychmg_desc:0 "我们再次回到了那扇红色大门前。现在这里很安静，门上的冰块早就融化了，空气里散发着泥土的香气。大酱琪露诺她们以前总爱在这里和门卫小姐闹来闹去，我想，她们的记忆一定有一大半留在了这里。我把泥土洒在门槛旁，这样就能让她们重新回忆起曾经喜欢跑来跑去的地方啦！"
KNM_ylcg:0 "眼泪擦干后就是晴天"
KNM_ylcg_desc:0 "灵梦说，哭泣是不能唤醒死者的。我想，如果我总是掉眼泪，大酱她们醒过来的时候也会跟着难过的。不会再哭了。要挺起胸脯，笑着迎接春天。等到了那时候，大家也一定都会跟着我一起露出笑容的！"

KNM_cyxjnt:0 "春雨洗净了泥土"
KNM_cyxjnt_desc:0 "天空终于下起了细密的春雨。这些雨水很温和，顺着树叶和花瓣落进干裂的黑色泥土里，洗刷着那些残留的焦黑污渍。泥土变得松软而干净，散发出久违的清新气味。被雨水洗净的土地，终于可以重新作为新生命诞生的温床了，大家都很开心地在雨里拍着翅膀。"
KNM_gxyzwts:0 "小叶子是需要喝水的"
KNM_gxyzwts_desc:0 "烟囱底下的那片小绿叶子现在长得很大了，但它需要更多营养。我从博丽神社后面的泉里挑来干净的水，一勺一勺地浇在它的根部。它贪婪地喝着水，叶片变得更加翠绿，表面还泛着水珠。它在茁壮成长，也带着大家的心愿一起成长，摸起来暖乎乎的。"
KNM_zmxh:0 "种满漫山遍野的小花"
KNM_zmxh_desc:0 "光有一片叶子是不够的。必须让整片山谷都开满鲜花。新来的朋友们带着无数的花种子，在泥土里尽情播撒了起来。红色的花，黄色的花，还有蓝色的风铃草，它们很快就会把焦黑的废墟盖住。当花儿盛开的时候，土地里的死气就会被彻底净化干净，大地全都会是花香的味道的。"
KNM_nfcshy:0 "暖风吹散了黑烟"
KNM_nfcshy_desc:0 "东边残余的那些灰色雾气还在天边飘荡。我们不能让那些脏东西继续遮挡阳光。我带着所有的妖精一齐飞到高空中，挥舞着翅膀，招来最温和的南风。南风像一把大扫帚，把那些焦黑的烟雾全部吹散，让明晃晃的太阳重新照亮我们的幻想乡，温暖每一个角落。"
KNM_hmghyzk:0 "在红魔馆花园里面做客"
KNM_hmghyzk_desc:0 "红魔馆的花园重新恢复了生机，里面的刺玫瑰开得比以前还要鲜红。我和大家带着新采的浆果去那里做客。那些妖精女仆们拉着我们的手，在开满鲜花的走廊上跑来跑去。红色的宅子不再像以前那样冷清，而是充满了欢声笑语。土地上的伤痕正在慢慢愈合。"

KNM_bqzxzgj:0 "我的白裙子现在干干净净了"
KNM_bqzxzgj_desc:0 "我的白裙子上面的黑灰全都洗掉啦！在清清凉凉的泉水里泡了很久，上面的焦痕一点都不剩了，又和初雪时一样白。把裙子挂在大树底下的藤蔓上，风一吹就飘得老高。嗯！莉莉白已经准备好出发啦！"


KNM_brad:0 "不让一朵小花在风里挨冻"
KNM_brad_desc:0 "大自然生来就是公平的。每一个小小的草芽，还有飞不快的小妖精，大家都应该分到一碗热热的甜茶和馋人的烤栗子。大个子的地精可以用肩膀背着那些飞不动的小家伙，带她们去最高最高的树梢上晒太阳。大家凑在一起，谁也不会在冬天的冷风里挨冻。大家都要吃得饱饱的、过得暖融融的才行。"
KNM_tygq:0 "太阳高高挂起的时候就睡觉"
KNM_tygq_desc:0 "干活应该是一件高高兴兴的事，要是觉得累了，就说明该睡觉啦。从现在开始，每当太阳升得高高的时候，大家就要把手里的铲子丢掉，在软和的草地上舒舒服服地睡个大午觉。地精们在铁房子里也能喝到好喝的果汁，更能听到小鸟唱着的歌。睡饱了，大家才能一直有力气呀。"
KNM_gbsty:0 "隔壁的朋友也来晒太阳吧"
KNM_gbsty_desc:0 "东边那些高高的房子里，一定有好多怕冷又没有花看的人。他们好辛苦啊。我们要把大门开得大大的，任何觉得身上冷冰冰、没有地方去的朋友，都可以来湖边躺在松软的草地上，喝一碗暖茶。我们不种那些扎手的铁丝网，我们要用暖洋洋的春风把大家都迎进来。"
KNM_qtyz:0 "倾听每一片叶子在说什么"
KNM_qtyz_desc:0 "种什么花，大家要一起商量才好。在把新花种埋进地里之前，我们要先去听听小草叶在说什么，问问小小的风妖精有什么愿望。大家的想法都很重要，哪怕是小小的叹息也要听仔细。大家都点头，我们再一起放声唱歌。这样，我们就能永远在一起啦。"
KNM_fxylc:0 "废墟变成温暖的游乐场"
KNM_fxylc_desc:0 "那些大烟囱全都轰隆倒下啦，地上的乱铁也被搬空了。我们要往黑泥土上种满青苔，在铁柱子上系起高高的秋千。倒塌的工厂不见了，这里变成了快快乐乐的大游乐场！妖精、地精还有人类，都能趴在草地上抱成一团打滚呢！"

KNM_zgsj:0 "整个世界，全都开满花吧！"
KNM_zgsj_desc:0 "我们湖边的春天太暖和了，多得都要从大门溢出来了。春风会把好多好种子带去大结界外面，飘到那些被黑烟封锁的灰色城市里。暖洋洋的力量会拥抱整片大地。明天早上，春天都会准时去叫醒每一个怕冷的人。"

KNM_cfcdsjjt:0 "春风吹到了遥远的尽头"
KNM_cfcdsjjt_desc:0 "我飞得很高很高，连云彩都被我甩到脚底下了哦。大结界的大门已经被春风吹得宽宽的，外面的灰色平原上开始冒出一朵朵红色和蓝色的小花。听说外面的世界很大，有很多我们不知道的地方。那就要一直飞，飞到那些高高的大楼顶上，飞到冷清的工厂里。把好闻的果香和漫天飞舞的花种子带到每一个怕冷的人身边。听好啦，春风要吹到世界尽头去，大家再也不用害怕冬天了！"
KNM_cfcdsjjt2:0 "春风吹到了世界尽头"
KNM_cfcdsjjt2_desc:0 "我飞得很高很高，连云彩都被我甩到脚底下了哦。大结界的大门已经被春风吹得宽宽的，外面的灰色平原上开始冒出一朵朵红色和蓝色的小花。听说外面的世界很大，有很多我们不知道的地方。那就要一直飞，飞到那些高高的大楼顶上，飞到冷清的工厂里。把好闻的果香和漫天飞舞的花种子带到每一个怕冷的人身边。听好啦，春风要吹到世界尽头去，大家再也不用害怕冬天了！"

KNM_djyqh:0 "大家一起大喊，春天来啦！"
KNM_djyqh_desc:0 "雾气彻底散了。大酱和琪露诺大人都在身边，大家的翅膀变回了闪闪发光的样子，再也不用和寒风打架了。我拉着大家的手，在天空中飞得很高很高。飞过神社，飞过森林，飞到红魔馆的大门前，像以前那样挥着手大声叫喊。这一次，所有人都会笑着听我们呼喊春天的到来。"

##莉莉白经济##
#农业
KNM_dlmchcd:0 "地里长出好多好吃的"
KNM_dlmchcd_desc:0 "趴在泥土上轻轻呼气，那些胖乎乎的根茎就会拼命往上钻。整片幻想乡很快会盖满绿油油的叶子，松软的泥里藏着圆滚滚的土豆和饱满的麦粒。大家才不需要像人类那样辛苦地翻地呢。跟着风唱歌的时候，种子自己就会找到舒服的位置睡下，一眨眼长成小山一样高的庄稼。"

KNM_dsytz:0 "大树一天就变得很高啦"
KNM_dsytz_desc:0 "盖木屋需要很多好木头，可谁也不想伤害那些有松鼠住着的树。把这里的泉水浇在幼苗根部吧，它们在太阳底下一天就能窜到云彩里。这些新长出来的树木性格温和，树干又直又软。就算拿走一些做梁柱，它们也会开心地在旁边重新抽出嫩芽。"

KNM_ydnghqtz:0 "大南瓜能换来崭新的铁铲哦"
KNM_ydnghqtz_desc:0 "种出来的南瓜比红魔馆的马车还要大，里面的瓜肉甜得像蜜糖。灵梦和人类村庄的大叔们总是缺粮食，正好用这些大南瓜和一袋袋金灿灿的麦子，去换他们手里那些闪闪发光的铁铲子。用吃不完的美味换来好用的工具，大家就不用自己去费劲地敲打那些烫手的红铁了。"

KNM_zjzdhh:0 "麦田一整年都是暖烘烘的"
KNM_zjzdhh_desc:0 "虽然外面的风有时候会变冷，但大家只要一起往泥土里吹气，这里的土地就永远不会结冰，这样的话，麦田一整年就都像春天一样暖和了。不管是刮风还是下雪，歌声不停，地里的菜叶子就永远绿油油的，我们的仓库也总是会被塞得满满当当。"

#资源
KNM_sgbsttsl:0 "老树为我们带来了礼物哦"
KNM_sgbsttsl_desc:0 "地底下的铁矿和铜矿藏得太深了，大家的小手根本拿不动那些沉重的铁镐。好在森林里的古老大树很乐意帮忙。跑去抱抱它们的树干吧，等树根在泥土里伸个懒腰之后，那些矿石就会被顶到草地上啦。大家提着小篮子，像捡落叶一样捡起来就行。"

KNM_zjgmt:0 "地上有好多木头呢"
KNM_zjgmt_desc:0 "活着的树木是大家的伞，谁也不许用锯子去拉疼它们。不过我们可以收集那些因为风大自己掉下来的树枝呀，还有那些已经老得睡着了的枯木头，把它们整整齐齐地码在湖边。这些木头干透了，生火的时候会有一股好闻的松香气的，适合拿来做各种好玩的东西。"

KNM_fgsb:0 "水底藏着小小的冰块"
KNM_fgsb_desc:0 "雾之湖的水底下藏着明亮的水晶，在夜里像星星一样闪烁。那些蓝色的石头里藏着好听的风声和清凉的魔力。潜进凉呼呼的水里，发光的碎石子一粒粒捞上来，铺在秘密基地周围。周围的空气会变得清清爽爽，连东边飘过来的那股难闻的焦味，都不敢靠近我们的秘密基地啦"

KNM_hhtk:0 "草药能够换来好多石头"
KNM_hhtk_desc:0 "河童们在山里挖出了好多硬邦邦的铁矿，可她们身上总有一股锈味。送去在山谷里采集的、闻起来很甜的草药，正好能治治她们因为干活熏坏的嗓子。作为交换，荷取会用大卡车把整箱整箱熔好的铁锭运到湖边。有了这些铁锭，地精们就能做更多有用的东西了。"

#工业
KNM_jgdj:0 "地精喜欢吵闹的屋子"
KNM_jgdj_desc:0 "红魔馆留下的那些大铁房子整天“咣当咣当”地乱响，里面还有焦黑的机油，妖精们光是走进去就会被熏得打喷嚏，根本没人想在里面干活。不过，住在附近的绿皮肤地精好像很喜欢这种热闹的地方。这些吵闹的工厂全送给地精住好啦！他们每天待在里面敲铁，把做好的盾牌送出来。作为回报，大家在厂门外放一筐筐刚刨出来的南瓜和金黄的麦子，让他们吃得肚子饱饱的。"

KNM_dxzf:0 "树底下有了一座小工坊"
KNM_dxzf_desc:0 "大树底下阳光明媚，大家用藤蔓和木板搭起了一间间凉爽的小木屋。大伙儿围坐在一起，把闪闪的矿石和干花缝进了皮甲里，再一边唱歌，一边把魔力揉进防具深处。这里听不到工坊刺耳的敲击声，只有鸟鸣与风吹树叶的沙沙声。这样做出来的防具穿在身上轻便多了，还带着花草的清香呢！"

KNM_mcxmhtg:0 "大南瓜还可以换铁轨呢"
KNM_mcxmhtg_desc:0 "湖边多出来的麦子和南瓜可以装满好几十个大竹筐，我们把它们一路送给幻想乡的大家吧。她们看到这么多好吃的，眼睛都会笑成弯弯的月亮的。她们会去跟河童商量，用板车把那些结实的铁轨一路颠簸着送进我们的林子里。有了这些铁轨，地精们就能用小矿车把矿石运得快快的了，大家再也不用抱着沉沉的石头走路了。"

KNM_xjyc:0 "烟囱一定会开满小花的"
KNM_xjyc_desc:0 "地精们工作的工厂顶上总是冒着灰蒙蒙的烟，把旁边的绿叶子都熏黑了。这可不行，春天可不喜欢脏兮兮的颜色。用清凉的湖水顺着高高的烟囱浇下去，灰尘就能直接冲进地底下的深泥里。在烟囱口种上生命力强的小藤蔓，让废气变成香甜的青草味。这样，工厂也能变得很亮很亮了。"

##莉莉白军事线##
#陆军
KNM_djdz:0 "胖乎乎地精排在了最前面"
KNM_djdz_desc:0 "东边那些坏家伙要是冲过来，肯定会带着吓人的铁家伙。妖精们身体太小，不擅长跟他们硬碰硬。不过没关系，那些吃饱了红薯、穿着厚皮甲的地精们力气大得要命，还特别喜欢挥舞大铁棒。地精排成整齐的队伍站在最前面，用盾牌牢牢挡住坏人的路。我们在后面帮他们吹风加油就行。"

KNM_dmbby:0 "水里泡出打倒坏人的木棒"
KNM_dmbby_desc:0 "地精们喜欢用粗粗的木棒当武器，可那些木头一撞就容易裂开。那把林子里结实的木棒都搬到雾之湖深处的泉水里泡着吧。泉水里有琪露诺大人留下来的凉爽魔力，木头在里面泡上十天，就会缩得实实的，变得比铁还要硬。地精们拿着木棒，一棒子下去就能砸扁坏人们的铁盾了。"

KNM_tmcsj:0 "小草会帮忙缠住坏人"
KNM_tmcsj_desc:0 "坏人们走路的时候总穿着重重的鞋子，踩在草地上发出难听的响声。跟地里的草儿和藤蔓说悄悄话，让它们在坏人经过的时候突然长高。细细长长的绿藤蔓会像小蛇一样，缠住他们的脚脖子和铁轮子。等他们急得在原地直跺脚、怎么也走不动的时候，大家就可以在树梢上开心地朝他们扔番茄了。"

KNM_djzmc:0 "大家在雾里开心得捉迷藏"
KNM_djzmc_desc:0 "湖泊和森林里到处都是白蒙蒙的雾，坏人一走进来就会迷路，连自己的手指头都看不清。可大家最擅长在雾里飞了。大家分成好多个小队伍，在雾里忽左忽右地发出笑声。等他们子弹全部打光、累得一屁股坐在地上时，地精们就可以冲上去抓住他们啦。"

#海军
KNM_mtbyq:0 "青藤能扎出大木筏"
KNM_mtbyq_desc:0 "这里不需要像河童那样造铁皮大船，那种大船在沼泽里一下子就会陷进泥里。去林子里挑粗粗的木头，用藤条将木头绑在一起，做成一个个平平扁扁的大木筏。这些木筏轻飘飘的，踩上去软和，就算在浅浅的水洼里也能像叶子一样滑行，永远都不会沉下去。"

KNM_lcz:0 "大青蛙可是拉船小能手"
KNM_lcz_desc:0 "木筏上没有桨，大家飞在空中拉船太累。不过，雾之湖里住着好多和磨盘一样大的巨型青蛙。送给它们一些花蜜，巨型青蛙长长的舌头会卷住木筏前面的藤条。在水里扑腾扑腾地往前游，木筏就会像离弦的箭一样飞快地滑出去，在满是稀泥的河道里走得比什么都快。"

KNM_wqcgn:0 "湖上落满了白白的雾"
KNM_wqcgn_desc:0 "要是不讲道理的家伙开着铁船想从水路上过来，大家一齐张开翅膀，把湖面上的水汽玩命往他们脸上吹。白蒙蒙的浓雾一遮，看他们往哪儿转方向盘！大木筏可以顺着水流的细微声音，在大雾里悄悄绕到他们船尾，用竹竿捅断所有的船桨，让他们只能在湖中心打转。"

KNM_hjb:0 "小鱼可以拿去换铁板"
KNM_hjb_desc:0 "大木筏虽然走得快，但要是遇到坏人的火球，木头还是很容易被烧焦的。用大渔网在湖里捞好多肥美的小银鱼吧，再用木桶装好送到玄武泽去。河童们最喜欢吃这种小鱼了，她们会用那种轻质的铁一样的甲板送到湖边来回报我们的。地精们用藤条将这些甲板固定在木筏的前面，这下子，木筏就再也不怕他们的火球了。"

#空军
KNM_zcgrxq:0 "天上下起了松果"
KNM_zcgrxq_desc:0 "飞在天上的小妖精，手里可拿不动沉沉的铁枪。不过，可以收集林子里的大松果，让地精们在上面绑上一点点魔理沙送的爆炸粉末。抱着这些松果飞到高高的云彩上面，对准下面那些黑糊糊的装甲车，像雨点一样扔下去。松果落地的时候会炸开，坚硬的松子和烟雾射得到处都是，让坏人们连眼睛都睁不开。"

KNM_fdgc:0 "高空中全是我们刮的风呢"
KNM_fdgc_desc:0 "东边那些坏人会开着铁翅膀的大飞机在天上飞，发出难听的声音。我们一齐飞到高空中，拉着手围成大圈，对着飞过来的铁飞机拼命刮起冷风。我们虽然不会琪露诺大人的冰雪法术，但一起刮出来的冷风也足够冻结天空中的水汽啦。叫那些铁飞机的翅膀挂满冰霜，重重地栽进地上的烂泥坑里！"

KNM_dbb:0 "大乌鸦是我们最神气的保镖"
KNM_dbb_desc:0 "天空中风太大的时候，大家娇小的翅膀有时候会飞得歪歪扭扭，还容易被坏人的大网兜住。找大乌鸦和大家一起飞吧。它们的翅膀又宽又硬，飞起来的时候风呼呼地响。有它们在旁边飞着，坏人的小飞弹根本不敢靠近，大家就能安心在天上扔松果了。"

KNM_sym:0 "大家有着漂亮的羽毛"
KNM_sym_desc:0 "我们收集了好多森林大乌鸦掉落的黑色硬羽毛，还有天空中彩虹鸟的彩羽毛，这些都是做扇子和魔法道具的好材料。把漂亮的羽毛装进小竹篓，再送给幻想乡的大家，就换来一叠折得整整齐齐的起风符了。把符纸往翅膀上一贴，大风就在屁股后面拼命得吹，飞得像闪电一样快，坏人的子弹可追不上我们。"


####事件####
KNM.1.t:0 "那座红房子好烦人"
KNM.1.d:0 "湖面上的雾气厚得化不开。琪露诺坐在高高的冰堆上，晃着光溜溜的脚。大酱蹲在旁边，盯着远处那个巨大的红色影子。红魔馆的家伙们总是一副高高在上的样子，连走路的声音都带着那股让人不舒服的傲气。“她们总是说这片湖也是她们的地盘，可这明明是本小姐先看中的。”\n那个红头发的门卫最讨厌了，每次大家想去那边的草坪上打滚，她都会板着脸把人赶走。“本小姐才是最强的！”琪露诺对着那个红色的轮廓大喊。妖精们在雾里瞬间乱成了一团，有的忙着搓起了冰球，有的忙着去南边吹起了风。既然那些家伙不讲理，那就把那座大房子也一起冻成冰雕好了。"
KNM.1.a:0 "“看本小姐的厉害！”"

KNM.2222.t:0 "去把吸血鬼刺杀掉吧"
KNM.2222.d:0 "白蒙蒙的雾里钻出一个怪影子，走路的姿势扭来扭去，手插在兜里。琪露诺大人正忙着往湖里投冰块，那个家伙就这么大摇大摆地晃到了岸边。那件衣服的花纹全是反着的，盯着红魔馆尖屋顶的眼神里透着股要找茬的火气，嘴角挂着一丝让人不舒服的坏笑。\n“喂，你们这群只知道玩过家家的妖精，”那个家伙开口了，声音像是在拿枯树枝蹭地，听着让人耳朵痒，“在这儿吹风多没意思。我打算去把那个红魔馆里的吸血鬼给宰了，让她也尝尝从房顶上掉下来的滋味。”\n她自称叫鬼人正邪，嘴里不停冒出要把地翻到天上这种疯话。大酱被吓得缩到了冰堆后面，琪露诺大人倒是一副很感兴趣的样子，歪着头盯着看。这个叫正邪的家伙挥舞着手臂，嚷嚷着刺杀之类的词儿，虽然走路的方式总像是要摔跟头，但那股要把一切都弄乱的力气确实挺吓人的。要是真的冲进那座红房子里，恐怕连那个爱睡觉的门卫都要被气醒。这种乱糟糟的事情，我们躲在雾里看热闹就好啦。"
KNM.2222.a:0 "“那家伙看起来好狂啊！”"

KNM.2.t:0 "冰块做的大椅子"
KNM.2.d:0 "湖岸边多了一排奇形怪状的冰墩墩。琪露诺得意地骑在高高的冰墩墩顶上，拍着手叫大家快来坐。大酱跑过来试了试，结果被冻得一下子跳了起来，捂着屁股在草地上乱蹦。一些小妖精想去摸摸那些尖角，结果手指头被粘在上面了，急得一边转圈一边哭。\n琪露诺叉着腰大笑，说这可是只有她才能做出来的宝贝。虽然大家被弄得手忙脚乱，甚至还在冰面上摔了好几个跟头，但湖边这下子变得亮亮的，看着就很有精神。既然琪露诺这么有兴致，大家也就开心地跟着在冰块中间玩起了捉迷藏。"
KNM.2.a:0 "“快看，这里有个更大的！”"

KNM.3.t:0 "这个门卫在偷懒"
KNM.3.d:0 "趁着大雾，一群小妖精偷偷摸摸地靠近了红魔馆的铁门。那个红头发的门卫果然又靠在门柱上睡着了，嘴角还沾着口水，睡得可香了。大家互相挤眉弄眼地偷笑，小妖精们从兜里掏出了几片皱巴巴的枯叶，悄悄放在她的帽子上。\n就在大家想更靠近一点的时候，里面那个穿女仆装的家伙好像走过来了，皮鞋踩在地板上的声音特别清脆。大家吓得呼啦一下散开了，像一群被惊动的小麻雀，在大雾里拍着翅膀乱撞。虽然没真的抓到什么好玩的，但看到那个门卫被惊醒时慌张的样子，大家就躲在雾里偷偷笑，觉得开心得不行呢。"
KNM.3.a:0 "“下次一定要揪她的头发！”"

KNM.4.t:0 "这里就是秘密基地"
KNM.4.d:0 "湖边的草地上现在乱糟糟的，到处都是妖精们搬回来的“宝贝”。大酱拖着一块比她还大的木板，累得满头大汗。大酱她们找来了好多五颜六色的羽毛和干花，正忙着往那个歪掉的墙上贴。琪露诺飞在半空，指着湖边的冰块，让大家把它们搬过去垫在地基下面。虽然在别人眼里这只是一堆木头和破烂，但在大家心里，这可是最了不起的城堡。\n大家围着这堆东西飞来飞去，已经在商量晚上要在里面藏什么好吃的了。大家一直往上面叠东西，这个基地总有一天能盖到云彩上面去。"
KNM.4.a:0 "“快看，我捡到好看的石头了！”"

KNM.5.t:0 "我们的宝贝呢！？"
KNM.5.d:0 "大酱正蹲在湖边的泥坑里抹着眼泪。刚才那个穿黑白围裙、总是拿着小刀的家伙又出来了。她走得特别快，手里的扫帚挥了几下，大家堆在湖边那一小堆碎石子和干透了的漂亮树枝就不见了。那是大家攒了好久的宝贝，原本打算拿去装饰我们最伟大的秘密基地。琪露诺大人气得翅膀都变了色，围着那个空荡荡的土坑转了好几圈。\n“她们凭什么把大家的东西当成垃圾扫走！”琪露诺大声嚷嚷着，手里已经变出了一个长满尖刺的大冰球。那些住在红魔馆里的家伙总是这样，觉得大家的心血都是碍眼的脏东西。她们爱干净？那我们去把她们的地毯全浇得透透的！还要把她们的茶杯全部冻烂，给那个偷懒门卫的耳朵边上吹冷风冻死她！\n这回可不是在玩捉迷藏，这次是认真要跟她们干一架哦！所有的冰块都搬到岸边啦，琪露诺大人小手一挥，我们就全往红魔馆里砸！"
KNM.5.a:0 "“这就去让她们好看！”"

KNM.6.t:0 "门卫小姐突然摆了个奇怪的姿势"
KNM.6.d:0 "雾气绕着红魔馆的大铁门转来转去，冷冷的空气里全是大家拍动翅膀的声音。琪露诺大人飞在最前面，蓝色的翅膀在雾里闪着亮亮的光。那个红头发的门卫这回没睡觉，她站在门前，两只手在空气里慢吞吞地画着圆圈，动作看起来像是在跳一种奇怪的舞。\n琪露诺大人说那种招式在本小姐面前一点用都没有，手指轻轻一弹，铁门上的水汽就变成了白霜。咔嚓咔嚓的声音响成一片，那是空气被冻结的声音。大酱她们已经叫嚷着往前冲了，无数的碎石子和冰块像雨点一样飞过去。\n我们要趁着那个人手忙脚乱的时候，从铁门的缝隙里钻进去，把那些平整的草坪全都踩乱。瞧，琪露诺大人已经把空气都冻得冰冰凉凉的啦，大家闭着眼跟着冲锋就好！"
KNM.6.a:0 "“大家快跟上，本小姐要发威了！”"

KNM.7.t:0 "这里的地毯真暖和"
KNM.7.d:0 "平时总爱板着脸的家伙们全都不见啦，现在的红魔馆可热闹了！\n\n我绕着顶上那个挂满水晶珠子的大灯飞了好几圈，琪露诺大人把楼梯扶手全冻上了，弄出了一条滑溜溜的冰道，正领着大酱她们排着队往下滑呢，大家开心的笑声在大房子里撞来撞去。\n\n那些以前只会在走廊里低头擦灰的妖精女仆，这会儿也把抹布往墙角一扔，乐呵呵地凑过来抓起冰渣子互相砸着玩。大门口那个老爱拦路的门卫姐姐，正抱着膝盖坐在门槛上叹气，不过谁也没空去理她啦。\n\n我飞得有点累了，干脆一屁股坐进旁边那张特别大的椅子里。身子陷进软乎乎的垫子里，呜……真舒服呀，比湖边那些硌脚的石头好太多了。\n\n现在这里归大家管啦！不如先舒舒服服地睡个大午觉吧？"
KNM.7.a:0 "§4“这里以后就是大家的游乐场了！”§!"
KNM.7.b:0 "§9“奇怪……春天怎么还没来呢？”§!"
KNM.7.c:0 "§1“不听话的就要被捉弄”§!"
KNM.7.f:0 "§O“为什么要安安静静的？”§!"

KNM.8.t:0 "这种味道是春天"
KNM.8.d:0 "大厅里还在乱哄哄地吵闹着，大家尖叫的声音把水晶灯敲得叮当响。\n\n我刚想在软乎乎的地毯上打个滚，一抬头，突然看见窗台上多了一个白花花的小影子。不知道她是什么时候飞上来的呢。\n\n她就那么蹲在那里，裙摆上沾着湿漉漉的泥。她伸出一根软软的手指戳了戳地毯上一摊正在融化的冰水。\n\n水顺着指尖流开，在红色的地毯上晕出一个深色的小圆点。\n她盯着那个圆点看了好久好久，才揉了揉眼睛转过头来。\n\n“那个……”她的眼睛亮亮的，像是刚从被窝里揉着眼睛探出头来，“春……春天，还没到吗？”\n\n她的声音轻得像是一片羽毛，可不知为什么，就这么穿过了满屋子的尖叫声，落进了我的心里。"
KNM.8.a:0 "“春天马上就要来啦！”"
fra_jiaqiang_tt:0 "当§Y@FRA[FRA.getname]§!与我们同阵营时，将会对ai进行适当强化"

KNM.9.t:0 "第一个绿点点"
KNM.9.d:0 "红魔馆外面的花园安安静静的，琪露诺大人留下的冰块正在慢慢化掉，水顺着枯草秆子往下流着，钻进泥里就没有了声音。\n\n我把脸凑到泥面上，凑得很近很近，连土粒之间的细缝都看得清清楚楚的。冰块已经只剩薄薄的一层壳了，透过那片快化透的冰壳底下，我看到了一个绿色的小点点。\n\n它从泥缝里挤出来时脑门上还顶着一滴水珠。阳光顺着水珠照下来，晃得人眼睛痒痒的，就像从水里捞出来的小珍珠一样。\n\n我盯着它看了好久……好久，一点也不敢去碰它，好害怕一口气就把它吹跑了。"
KNM.9.a:0 "“找到你了。”"

KNM.10.t:0 "看呀看呀春天到啦"
KNM.10.d:0 "我飞进红魔馆那个高高的大厅，这里现在比外面还要热闹。琪露诺大人正领着大家在铺着红地毯的楼梯上滑着冰，冰碴子和妖精们的笑声一起飞得到处都是。\n\n“春天来了呀！”我绕着那个大吊灯飞了一圈，大声告诉着她们。\n\n琪露诺大人从扶手上滑了下来，稳稳地停在我面前。她呼出的气还是白白的，像一小团云一样。\n\n“春天？那种软绵绵的东西有什么好玩的，还是冰块最厉害啦！”\n\n她说完，又在光洁的地板上冻出了一小片冰，带着大酱她们继续玩了起来。\n\n大家好像对滑冰更感兴趣。不过没关系啦，大家玩得这么开心，肯定也是因为春天到了嘛。"
KNM.10.a:0 "“琪露诺大人好有精神呀！”"

KNM.11.t:0 "我要去告诉大家"
KNM.11.d:0 "人类的村子总是安安静静的。我轻飘飘地落在那个旧旧的鸟居下面，对着那些穿着厚衣服、缩着脖子走路的人们挥手。\n\n“春天已经来了哟！”我的声音在冷清的街道上弹来弹去。\n\n一个正在往屋里搬柴火的大叔停了下来，抬头看了看灰蒙蒙的天，又搓了搓手，冲我摇了摇头。\n\n“小姑娘，你看这风还是从北边吹的，地面也还冻得跟石头一样硬。离春天，怕是还有好一阵子呢。”\n\n他说完又抱起柴火，急匆匆地走了。\n\n街上的人们看着这一幕，也对我笑了笑，然后把自己裹得更紧了。\n\n我歪了歪头，感到特别疑惑。大人们好奇怪呀，明明空气里本来就有春天的味道嘛。不过没关系，等太阳再暖和一点，他们就知道我说的是对的了。"
KNM.11.a:0 "“大人们总是想得太多啦。”"

KNM.12.t:0 "森林里也该知道了"
KNM.12.d:0 "魔法森林里的空气总是湿漉漉的，带着一股蘑菇和腐烂叶子的味道。我穿过那些奇形怪状的大树，找到了那个总是乱糟糟的房子。\n\n“魔理沙，春天来了！”我趴在窗户上，对着里面那个整天戴着大帽子的魔法使喊道。\n\n她正摆弄着桌上一堆瓶瓶罐罐，闻言只是懒洋洋地抬了下眼皮，拿手指头弹了弹旁边一个滴溜溜转的小东西。\n\n“春天？这魔力的流向还是冬天的样子，一点活跃起来的意思都没有啊。”\n\n她没再理我，又低头忙自己的事情去了，嘴里还念叨着什么“又是哪个笨蛋搞出来的异变”。\n\n我拍了拍翅膀。魔法使的鼻子是不是被蘑菇塞住啦，这么香的味道都闻不到。不过没关系，等森林里的花都开了，她总会发现的。"
KNM.12.a:0 "“魔法使的事情真难懂呀。”"

KNM.13.t:0 "春天在敲门"
KNM.13.d:0 "哨口的人放下了手里的文书，那个白色的身影正拍打着翅膀，悬停在半空中。莉莉白歪了歪脑袋，正盯着那座灰扑扑的城市发呆呢。她手里握着一小截刚发芽的柳条，翠绿的颜色在灰色的城墙映衬下显得显眼无比。\n\n“春天已经在那边醒了哟。”她落在了地上，声音里满是甜甜的喜气。\n\n守卫们对视了一眼。谁都认得这位总是准时报春的妖精，她看起来一点也不像那些传闻中到处捣乱的麻烦精，倒让人想起了太阳的味道。\n\n红魔馆的变故早已传到了这里。那些占领了湖边的妖精们展现出了合作的意向。\n\n这个带着花香的小家伙，正等着我们的回话呢。是请她们搬进来一起住，还是让她们在湖边安家，偶尔串串门？"
KNM.13.a:0 "让妖精们搬进院子里来住吧（§Y她们会成为我们的一部分§!）"
KNM.13.b:0 "让她们作为附庸留在湖边"

KNM.14.t:0 "灵梦为什么不出来呢？"
KNM.14.d:0 "我在博丽神社的台阶上蹦了好久好久，喊得嗓子都哑了。\n\n“灵梦！灵梦！春天真的到了呀！”\n\n可是神社的大门关得紧紧的，连条缝都没露出来。明明……明明风刮过来的时候，能感觉一股特别温暖的气息，就像趴在刚晒好的被子上一样舒服呢。\n\n我贴在门缝往里看，灵梦正缩在那个叫被炉的大方桌底下，脸冻得白白的，怀里还紧紧抱着个空溜溜的钱罐子。\n\n她瞪着眼睛看我，重重地叹了一大口气：“春个头啊，你自己看看背后。”\n\n我好奇地转过头去。一片冰雪刚好落在了我鼻尖上，化成了一滴冰凉的水。\n\n诶？怎么……还在下雪呢？\n可是，那种热乎乎的感觉又是从哪里飘来的呢？我吸了吸鼻子，风里夹着一股怪怪的味道，就像有什么东西被烧焦了一样。\n\n奇怪……春天，也是这种味道吗？"
KNM.14.a:0 "“怎么还在下雪呀……”"

KNM.15.t:0 "又是一个倒霉日子"
KNM.15.d:0 "赛钱箱里连一个硬币都没有，屋顶的缝隙还在往里落着雪籽。\n\n我把手缩在了袖子里，恨不得让自己整个钻进被炉深处去。那个春妖精在外面吵死了，一边拍翅膀一边嚷嚷着什么春天到了。\n\n我推开门缝看了眼。感受到的只有风和冰渣，在我脸上胡乱拍着。\n这个笨蛋妖精感受到的暖气，根本不是什么春天，是隔壁那些工厂昼夜不停排出来的热浪吧。\n\n把灾难的前兆当成报春的喜讯……妖精这种生物，还真是又简单，又让人没办法呢。"
KNM.15.a:0 "“那是死人的温度啊，笨蛋。”"

KNM.16.t:0 "空气突然变硬了"
KNM.16.d:0 "云彩后面藏着一股干燥的暖意。一点都不像小花开花时的甜味，倒像是石头被太阳暴晒了很久很久的感觉。我拍打着翅膀飞得高高的，想要穿过那片灰蒙蒙的雾气去瞧瞧看。\n\n灵梦总说那是坏东西，但我能感觉到，那股热热的感觉就在东边跳动着呢。\n\n就在我张开双臂想抱住那团暖风的时候——\n\n“咚”的一声。\n我的头撞到了一层看不见的、硬邦邦的东西。明明眼前什么都没有，可撞上去的时候，额头好疼好疼，就像在冰面上滑倒了一样。\n\n我贴着这层寒冷的隔阂往远看。灰暗的影子底下，戳着好多个冒着黑烟的大管子。那种热风，就是从那些管子里吐出来的。\n\n可是……它们看起来，一点都不像春天啊。"
KNM.16.a:0 "“怎么……飞不过去了呀？”"

KNM.17.t:0 "大家一起飞过去"
KNM.17.d:0 "我拍打着飞酸了的翅膀落到露台上的时候，琪露诺大人正领着大家把光亮的盘子叠成一座高塔。我急得绕着她们转圈，大声说着那堵看不见的、比冰块还要硬的墙。\n\n大酱停下手里的活，歪着小脑袋看我：“莉莉酱是不是飞得太快，撞到哪片云彩上了呀？”\n\n琪露诺大人叉着腰，蓝色的翅膀抖落出一串冰屑。她扬起下巴，指着东边那团灰雾：\n“本小姐才是最强的！就算前面是座大山，我也能撞个窟窿出来！走，大家一起去瞧瞧！”\n\n于是，大家吵吵闹闹地飞上了天，像一串彩色的糖果。我跟在后面，心里像有小鼓在咚咚敲着。\n\n我们越飞越高，之前那种硬邦邦的感觉真的不见了。可是……空气变得又黏又重，带着一股苦涩的怪味。底下原本漂亮的颜色全退掉了，变成了一片看不到头的灰色。\n\n“看吧！哪有什么墙嘛！”琪露诺大人在前面飞得更欢了。\n\n我也愣住了。原本以为是春天的暖风扑在脸上，却让人喘不过气来。那些吐着黑烟的巨大管子，就在我们脚下……"
KNM.17.a:0 "“原来……真的能飞过来呀。”"

KNM.18.t:0 "慢慢逝去的季节"
KNM.18.d:0 "大酱牵着我的手，指缝里还卡着刚才在后花园里挖出来的草根。我想转过头告诉她，不用管这个草根了，我们早就找到第一个小绿芽了哦。\n\n可是……手心里突然变轻了。\n轻得像是什么都没有抓住一样。\n\n我愣住了，低过头去看。大酱的翅膀已经不再扑动了，湿答答地贴在了她的背上，就像被雨水淋湿的树叶一样。她的手指此时还勾着我的指尖，可一点力气都没有了。\n\n“莉莉酱……我好像……有点飞不动了呢……”\n她冲我笑了一下。那个笑容太浅了，还没等落稳，就消失了。\n\n紧接着，她的指尖……就那么一点点地碎掉了。\n\n像干透了的草一样，风一吹，就化成了细细的粉末。我急得想要用力握紧她，可越是合拢手掌，那些灰灰的粉末就越是从指缝里漏出去，怎么捧都捧不住。\n\n“大酱……？别开玩笑了呀……”\n\n四周好安静好安静。平时总是飞在最前面的琪露诺大人不见了……那些穿着漂亮裙子的小伙伴们，也全都不见了，换来的只有地上的满满一层灰。\n风一吹，就在泥巴里打着滚，根本分不清哪一堆是谁。\n\n“大家……琪露诺大人！大酱！春天来啦！快点醒过来呀……！”\n\n以前在湖边的时候，她们最喜欢玩这种装睡的游戏了。闭着眼睛怎么叫都不理人，非要等我凑过去，才突然跳起来吓我一跳。可是这次……她们装得好像真的一样啊。\n\n我蹲下来，拼命用两只手去收集地上的灰。可怎么也粘不回原本的模样。我想把它们全藏进口袋里，可风一吹，又悄悄溜走了。\n\n笨蛋……春天才不是这种味道呢……！"
KNM.18.a:0 "（春天……才不会把大家变成泥巴的……）"

KNM.19.t:0 "灵梦的脸色很难看"
KNM.19.d:0 "我摔在地板上，膝盖疼得厉害。身上又是雪又是泥，摔出了一地水印子。\n\n我爬到灵梦脚边，两只手捧着那摊泥巴，举到了她的眼皮底下。\n\n“灵梦你快看看，大酱和琪露诺大人都在里面呢！”我拿袖子抹了把脸，不知道抹掉的是泥巴还是眼泪，“我们是妖精呀，天暖了就会从湖里长出来的对不对？你最厉害了，你帮我把她们变回来，好不好？”\n\n我低下头，拼命往手心里的黑泥巴上吹气。我用尽了全身的力气，把暖绵绵的风吹进去。可我吹了好多好多次，手心里的泥巴还是灰蒙蒙的，一点温度都没有，只是像一摊死灰一样粘在我的皮肤上。\n\n灵梦突然挥了挥手，一把拍在我手腕上。泥巴啪嗒一声掉在木地板上，摔成了好几瓣。\n\n“你们……为什么要跑出去？！”她的声音好大，连肩膀都在发抖，“谁让你们绕过大结界去外面的？！”\n\n我吓得缩起了脖子。\n\n“因为……因为东边有春天的风啊。我们只是想去找春天……”\n\n“那根本不是春风！笨蛋！！”\n\n她盯着地板上那摊散发着焦味的黑泥巴，手抖个不停。\n\n“她们不会再醒过来了。这一次……是真的死掉了。”\n\n我呆呆地看着地板上那些变凉的泥巴。\n\n大结界外面……真的没有春天吗？"
KNM.19.a:0 "“大酱……琪露诺大人……大家……求求你们醒一醒呀……”"

KNM.20.t:0 "不听话的笨蛋妖精"
KNM.20.d:0 "外面的雪下得很大，赛钱箱上面堆满了白雪。\n\n我刚想关门，一个满身黑灰的小影子就这么滚了进来，在走廊上摔了好几个跟头。\n\n是莉莉白。她的白裙子全脏了，背后的翅膀烧得像破掉的飞蛾。她在发抖，两只手抓着一小团冒着焦味的黑泥巴，哭得话都说不清，说大酱和琪露诺都在泥巴里，等春天到了大家就会醒过来。\n\n看着那一团脏泥巴，不由得升起了一肚子火，一巴掌打在了她的手腕上——啪嗒，泥巴掉在了地板上，摔成了好几块，黑色的泥水混着妖精的眼泪慢慢渗进了木缝里。\n\n“你们……为什么要跑出去？！”我盯着她，声音冷得像外面的风雪，“谁让你们绕过大结界去外面的？！”\n\n这个笨蛋妖精缩成一团，一边哭一边还在小声念叨着春天。\n\n平时那些妖精哪会真的死掉啊？就算被砸扁或者被妖怪啃碎，过不了几天就会在湖边的草丛里蹦出来。可是……隔壁那些怪物搞出来的邪门法术，不光烧掉了她们的身体，连雾之湖的生机都彻底弄死了。\n\n水干了，树焦了，连魂都不见了。没有春天能把她们叫醒，在那团死泥巴里……她们是真的醒不来了。\n\n“真是群……笨得没办法的家伙。”"
KNM.20.a:0 "“……也许，她们再也不会回来了吧。”"

KNM.21.t:0 "这里有红浆果"
KNM.21.d:0 "博丽神社的后院这几天落满了枯叶，屋顶上还沾着冰屑。我捏着酸痛的肩膀走出屋子，本来打算去拿扫帚，却在台阶下愣住了。\n\n院子已经被扫得干干净净，堆在墙角的落叶码得整整齐齐。井水边上用大叶子垫着，搁了一小叠红彤彤的野浆果，上面还带着晶莹的晨露。\n\n一个雪白的小翅膀在鸟居后面的树丛里一闪而过。\n\n是莉莉白她们。\n\n自从那场大变故之后，这群劫后余生的小家伙就变得异常安静。她们不再像以前那样吵闹，反倒每天天不亮就跑来这里，用树枝笨拙地清理着院子，把这些洗净的野果留了下来，生怕打扰到我。\n\n我知道大结界上的裂缝每天都在变宽，外面那些魔导国的钢铁怪物正在沿着边界集结。我本以为这群妖精只会添乱，没想到她们是在用这种近乎傻气的办法，帮我节省体力去修补结界。\n\n看着那一小叠野浆果，我叹了口气。她们只是觉得把我照顾好了，春天就能早一点到。"
KNM.21.a:0 "“那就专心去补结界吧。”"

KNM.22.t:0 "这里有小包裹"
KNM.22.d:0 "魔法森林的小木屋里，我正对着一桌子干瘪的素材揉太阳穴。东边的风越来越冷，空气里总有股刺鼻的硫磺味。我急需一些能引发剧烈反应的魔力触媒，来制作能在夜里报警的高空照明弹，可这个季节森林里的活气全被压住了。\n\n咚。\n\n窗台上突然传来一声轻响。\n\n我推开窗，只看到一个用干草和藤蔓扎成的小包。打开一瞧，里面密密麻麻地码着一排新鲜得还在滴水的光蘑菇。这种蘑菇在湿冷的环境下生长，很不稳定，轻轻一碰就会爆发出强光。\n\n远处的大树后面，一个白衣服的身影缩回了脑袋。\n\n“又是妖精。”\n\n莉莉白大概还以为我是在做驱散乌云的礼花吧。她跑遍了森林湿冷又危险的地方，就为了帮我收集这些随时可能炸开的小火药。既然有了这些，今晚的照明弹就能多做一大批了。在那些重型装甲车辆开过来之前，我们至少能把这片森林的夜空彻底照亮。"
KNM.22.a:0 "“真是一份及时雨。”"

KNM.23.t:0 "稀泥覆盖的道路"
KNM.23.d:0 "从前线传回来的消息有些让人难以置信。\n\n东边边境的斥候报告，那些沿着大道缓缓推进的魔导国装甲侦察车，在距离大结界不到十里的低洼地带全部趴窝了。原本干燥结实的路面，不知何时变成了一片深达数尺的沼泽。\n\n根据目击，几天前有一大群妖精在湖边嬉闹，她们把河道上的泥沙挖开，任由湖水漫灌。她们在泥浆里打滚、泼水，把这片咽喉要道彻底变成了一滩稀泥。\n\n那些钢铁怪物的履带被胶着的黏土牢牢卡住，工兵们不得不冒着寒风，费力地试图把车辆从泥潭里拔出来。她们的进军速度被不可思议地拖慢了。\n\n在她们单纯的想法里，把路弄湿只是为了让那些车子陷进去，这样她们就可以在旁边看热闹，顺便保护小草。但这滩泥，确实为整个幻想乡争取了宝贵的备战时间。"
KNM.23.a:0 "“真是帮了大忙。”"

KNM.24.t:0 "河童送来了新的图纸"
KNM.24.d:0 "河城荷取跑上山的时候，脸上的机油都没来得及擦干净。她怀里抱着一叠刚画好的草图，上气不接下气地冲进院子。\n“那些湖边的妖精……把湖畔的所有工业车间和重型熔炉，全送给我们了！”\n我有些诧异地看着她。那些大房子原本是红魔馆在外面建的工坊，里面装满了精密的铸造机和锅炉。莉莉白昨天托小鸟送了一封信过来，上面用红红绿绿的果汁歪歪扭扭地画着几个图案。她在信里说，那些“大大笨笨的石头房子”里整天吵个不停，地上又没有可以打滚的草地，所以决定把这些“石头房子”全送给河童当玩具。\n荷取两眼放光。她说，车间里的重型蒸汽锅炉和锻造设备，比玄武泽现有的作坊还要先进，正好能用来批量组装防御用的铁家伙。至于代价，莉莉白在信纸的背面画了几个手拉手的小人。她只想要我们这边的妖精过去，陪她们一起玩，把空房间住满。\n这哪里是交换，这简直是把值钱的家底白送了过来。妖精们大概根本不知道那些车间和炉子意味着什么。可对我们来说，这些多出来的工业产线，简直就是雪中送炭。"
KNM.24.a:0 "“她们真的只要朋友吗？”"

KNM.25.t:0 "背起包袱去往远方"
KNM.25.d:0 "一大早，我就看到神社后山的树林里乱哄哄的。平时整天在草丛里睡觉的几个小妖精，这会儿居然把她们平时收集的石头和树叶都塞进了小布包里，正排成一列往山下挪。\n“你们这是去哪儿？”我叫住她们。\n带头的小妖精回过头，一脸骄傲地拍了拍她那干瘪的包袱，说莉莉白派了小鸟来送信。信里说，湖那边有好多好大的空房子，地上铺着香香的干草，还有喝不完的茶和香喷喷的栗子，过去了就能和大家一起玩。\n我看着这些甚至不知道大结界外面有多危险的小家伙。她们只是听到了“温水”和“朋友”，就高高兴兴地打算搬到那个时刻可能爆发冲突的边界去。我知道，因为河童们已经接管了那些工厂，我们作为大人的，不能在这时候把这些单纯的家伙拦下来。\n“在路上别乱跑，跟着鸟儿走。”我挥了挥手。\n她们清脆的笑声一瞬间就飘远了。看着她们单薄的背影，我只能希望，那些高耸的工厂里做出来的铁疙瘩，真的能在冬天彻底降临的时候，护住这些什么都不懂的妖精。"
KNM.25.a:0 "“一路上一定要安全啊。”"

KNM.26.t:0 "风雪里站着的小影子"
KNM.26.d:0 "博丽神社的客房里，一整晚都点着昏暗的蜡烛。\n大人物们围在木桌旁，争吵的声音顺着纸门缝隙传出来。看着桌上那些画满了线条和防线的图纸，我的眉头紧皱起来。\n\n“我们必须把大结界彻底关死。”一个声音沉沉地说，“外面的怪物是个能把神明都碾碎的疯子。让幻想乡去对抗那种东西，是拿所有人的命在赌！那些妖精在外面变成灰，是她们自己太蠢了。”\n“如果今天把门锁死，眼睁睁看着那群连枪都拿不稳的小家伙在风雪里死掉，那我们和外面的骨头架子还有什么区别？我们算什么守护乐园的人？”另一个声音喊道。\n\n桌子两边突然安静了下来。\n\n就在这时，纸门被推开了一条缝，外面的风雪抢着涌了进来。\n\n莉莉白抱着那只小小的木盒子站在门廊里。她的白裙子脏乱无比，下摆冻得像块硬掉的抹布。背后的翅膀在寒风里直打哆嗦，可她抬起脸时，那双清澈的眼睛里，却透着一股让人心疼的决绝。\n\n“姐姐……”她的声音很小，“我把大家……都重新攒起来了哦。那边的风很冷很冷。可是……只要把那个最大的黑色房子砸碎，春天就会回来的。大酱和琪露诺大人，也一定会回来的。我……我要去跟那个冬天打一架。”\n\n我们这些大人，这几天一直在用功利与得失算计着一切。可幻想乡……什么时候变成这种冰冷的地方了？这里是乐园啊。如果连一个春之妖精为了守护同伴都要独自走向风雪，而我们只能躲在被炉里算账……那这片乐园，其实早就在大雾里死掉了啊。"
KNM.26.a:0 "“走吧！我们陪你一起去砸烂那个冬天！”"
KNM.26.b:0 "“太危险了……我们……不能去。”"

KNM.invitedfra_tt:0 "当@KNM§9[KNM.GetName]§!与@DVL§0[DVL.GetName]§!爆发战争时，我国将会向@DVL§0[DVL.GetName]§!宣战。"
KNM.invitedfra_tt1:0 "@KNM§9[KNM.GetName]§!宣战@DVL§0[DVL.GetName]§!的时间将会推迟。"

KNM.27.t:0 "渐渐在风雪中远去"
KNM.27.d:0 "博丽神社的纸门留了一条窄缝。屋里被炉的暖气正顺着门缝往外跑着，扑在我的后背上，带着烤红薯的甜味。\n\n站在台阶顶上，雪花砸在脸上很快就化成了凉凉的水。我把手在衣服上蹭了蹭，随后塞进口袋里，紧紧握住了那个小木盒。盒子里装着大家剩下的灰。明明那么轻，却把口袋压得一直在往下沉着。\n\n回头看了一眼那扇透着火光的纸门。灵梦早就不理我了，但我听得见门板后面衣料摩擦的声音，她肯定正靠在那儿，隔着门缝偷偷看着我呢。\n\n“莉莉，外面好冷的哦。”大酱以前最爱这么说了。那时候我刚往结界边缘凑一凑，她就在后面急得直扑翅膀，非拽着我的裙角不放。\n\n可我现在连翅膀都冻硬了，真的能飞过去吗？\n我伸手往后够了够，摸到了自己那对破破烂烂的翅膀，破口处呼呼地往里漏着冷气。我拍了拍它，歪歪扭扭地踩进了雪地里。\n\n往下走一级。雪没过了脚踝，冻得脚底板渐渐没了知觉。\n再走一级。\n台阶上那一串小小的脚印，风一吹，就被新雪盖住了。\n\n结界外面的风一个劲地往领口里灌。我缩起脖子，盯着前面那片灰蒙蒙的雾。\n穿过去，就是外面的世界了。\n那边有生锈的大铁罐子，有冒黑烟的烟囱，还有那个把一切都冻死在原地的恶劣冬天。\n大酱在那边。琪露诺大人在那边。大家都留在那边了。\n\n我只是一个小小的春之妖精。轻得连阵大点的风都挡不住，破掉的翅膀飞几下就快要散架一样。\n\n可是……没办法呀。\n\n我必须要去那个不讲道理的冬天里，把春天一点一点……夺回来。"
KNM.27.a:0 "“那么……我出发啦！”"


KNM.28.t:0 "春天马上就要来了"
KNM.28.d:0 "废墟周围的黑烟散掉了，天变得干干净净的，好蓝好蓝。太阳光从那些破铁板的缝里漏了下来，斜斜地照在了大地上。\n\n我蹲下身，两只手伸进口袋捧出那一小包黑泥，轻轻摊在还有点热乎的土坑里。\n\n“大酱，琪露诺大人，烟囱已经倒下去了哦。”\n\n我凑过去，对着泥土吹暖风。吹一口，再吹一口。吹得腮帮子都变得酸酸的了。\n但是，泥巴还是泥巴的样子，一点也没有变。\n\n我趴在泥巴边上等了好久好久，把脸贴上去听。除了感觉凉凉的，什么声音也没有。\n眼泪突然就自己掉下来了。吧嗒吧嗒落进泥块里，化成了一片片潮湿的深色。\n\n灵梦说过的。被那种法术烫过之后，就再也不会像以前那样，一觉醒来就拍着翅膀在湖边乱飞了。\n我把脸埋进胳膊里，不想看了。\n\n哭了很久。\n\n后来睁开眼的时候，眼泪淌过的那块泥里，有什么东西动了一下。\n\n一个小的、嫩绿色的尖尖。从碎屑底下钻了出来，顶着晶莹的水珠，在太阳底下摇晃着。\n\n我盯着它看了好久，好怕它也会像烟一样消失掉。\n可是它没有缩回去。就那么立在泥里，叶子张开了一点点，散发出一种清清凉凉的湖水的味道。\n\n是琪露诺大人的味道，她平时在湖边冻冰块的时候，空气里就是这个味道呢。\n\n妖精才不会不见呢。她们只是变成泥了，变成风了，变成第一个从土里钻出来的绿芽了。\n\n我在绿芽旁边坐下来，把破破烂烂的翅膀收好，像大树那样闭上了眼睛。\n一直吹着这里的暖风，一直喊着她们的名字。好多年好多年以后的某个春天，她们肯定又会从树洞里、从花丛里钻出来，拍着翅膀喊“本小姐才是最强的”。\n\n我就在这里一直等着她们吧。\n就在……这里……一直等着……"
KNM.28.a:0 "“春天，马上就来到这里了。”"

KNM.29.t:0 "黑色小雪花"
KNM.29.d:0 "落下来的雪花是黑色的，闻起来黏糊糊的，带着刺鼻的焦味。刚刚才钻出地面的一点点小嫩芽，一碰到这些黑雪，叶尖就泛起了灰败的颜色。\n\n呜……这该怎么办呀。好不容易才砸碎了那些喷火的大铁罐子，为什么天空还是不肯放晴呢？我的手冻得僵硬无比，翅膀也因为在浓烟里熏过，到现在还疼得根本飞不起来。身边已经没有可以帮忙的地精大叔了，好玩的小船也都在打架时碎掉了。越来越多的黑雪落在肩膀上，冷得让人好想流眼泪。\n\n看着那个快要枯萎的绿色小点点，我终于一咬牙，整个人趴在了湿漉漉的泥地上。双手在胸口前合拢，用破破烂烂的翅膀把小嫩芽严严实实地护在身下。\n\n我的脸颊贴着冰凉的泥土，把最后一点温暖的气息，轻吐在小小的叶片上。\n\n绝对……不能让它冻死。这是大家留下来唯一的希望了呀。\n\n意识渐渐模糊，身体冷得快要动弹不得。可就在这时候，胸口下方的泥土里，突然传来了一下微弱的、清清楚楚的跳动。\n\n（咚。）\n\n胸口这个小小的生命还在跳呢！那就绝对不能放弃！春天……一定会来的！"
KNM.29.a:0 "“一定要……暖和起来呀……”"

KNM.30.t:0 "泥土里长出了小翅膀"
KNM.30.d:0 "阳光落在新翻开的泥土上，散发着一股暖洋洋的水汽。\n我正拿着小水壶往刚铺好落叶的花坛里浇水呢，旁边的泥巴突然颤动了一下。一朵红色的郁金香花苞从地里抖了出来，接着它慢慢张开，里面居然冒出了一个满头是水的小脑袋。\n\n“呜呀……好痒……”\n那个小妖精揉了揉眼睛，迷迷糊糊地看着我。她身上还沾着黑泥巴，背后的半透明翅膀软塌塌地贴着，像刚破壳的小小鸟。\n\n我呆呆地站在原地，连水壶里的水泼在了脚丫子上都没发觉。\n\n紧接着，旁边的草丛里、花朵里、树皮的缝隙里……一个又一个湿漉漉的小脑袋探了出来！她们有的还在打着哈欠，有的正好奇地揉着鼻尖，全都是那些在大雾里不见了的小伙伴。她们就像小草一样，在温暖的泥土里喝饱了春天的雨水，然后……就这么自然而然地重新长出来了！\n\n“莉莉酱？你怎么……在哭呀？”\n那个小妖精拍了拍翅膀，摇摇晃晃地飞过来，用沾着泥巴的小手去擦我的脸。\n\n我拼命摇着头，一把将她紧紧抱进怀里。原本透着凉气的泥土，现在晒得温温的，散发着湿泥与花草的甜味。她们真的回来了……虽然身子变小了一点，虽然很多事都不记得了，但她们真的回到我身边了！"
KNM.30.a:0 "“欢迎回家……！大家！”"

KNM.31.t:0 "那个爱逞能的笨蛋醒了"
KNM.31.d:0 "湖中心的冰层开始发出“咔嚓咔嚓”清脆的开裂声。\n在阳光下，那座曾经冻得结结实实的冰雕正化成温暖的水流，顺着泥土缝隙静静流淌。湖中心那朵由琪露诺大人的魔力结成、一直没有枯萎的巨大冰花，此时正像真正的莲花一样，在暖风里一层层绽开。\n\n我站在湖边，屏住呼吸看着冰花中央。\n水汽散去，两个娇小的身影正并排躺在花蕊里。大酱最先揉着眼睛坐了起来，背后的绿翅膀扑了两下，上面还挂着亮亮的冰屑呢。她转过头，看到了身旁的蓝衣服妖精，接着一下子捂住嘴，眼泪控制不住得涌了出来。\n\n琪露诺大人慢慢睁开眼睛。她那双冰蓝色的眼睛里还带着睡意，下意识地想要拍着胸脯大喊“本小姐才是最强的！”\n\n可当她看到我那身洗得干干净净、却依然有些破破烂烂的裙摆与翅膀时，她的大眼睛忽闪了两下，猛地从花蕊里跳出来，气呼呼地落在我面前。\n\n“莉莉酱！你的翅膀怎么破了？！是不是红魔馆那些家伙干的？！”琪露诺大人挥舞着小拳头，虽然身子比以前小了一圈，但那股神气的模样一点都没变，“可恶！竟敢欺负本小姐手下的人！本小姐现在就去把他们全部冻成冰棒！”\n\n大酱在一旁破涕为笑，拉着她的小手：“琪露诺酱，打架已经结束了哦，是莉莉白赢了呢。”\n\n“诶？！本小姐还没发威呢怎么就赢啦？！这不算！一定是本小姐在梦里帮了大忙！”琪露诺抓着头发，很不甘心地嚷嚷着。\n\n我站在岸边，看着在暖风里大呼小叫的她，终于忍不住咯咯笑了起来。"
KNM.31.a:0 "“最强的琪露诺大人，早上好！”"

KNM.32.t:0 "院子里又变吵了"
KNM.32.d:0 "阳光落在走廊上，我正拿着扫帚清理着台阶上的花瓣。\n一阵拍翅膀的声音突然从院墙上砸下来，又急又猛，像有人拿竹竿在敲瓦片一样。\n\n“灵梦！你看！本小姐就说过，我才是最强的！”\n话音还没落，一个蓝色的小影子就从半空中直直扎了下来，差点一头撞进茶室里。琪露诺叉着腰站在走廊上，身子比以前小了一圈，背后的冰翅膀还在往下掉细碎的水花。不过那张脸还是老样子，神气、又欠揍得要命。\n\n大妖精和几个熟面孔的小湖精跟在后面，在院子里追来追去，手里握着刚摘的野果，已经啃了好几口了。\n\n莉莉白落在最后。她那身白裙子洗得不沾半点灰痕，在太阳底下晃得人眼睛微酸。她没跟着其他人闹，自己踮起脚尖，够着枝头上剩的一小串野果。那双翅膀扑扑地拍着，还是飞不太稳，身子往旁边歪了一下，差点撞上了赛钱箱。\n她自己不好意思地笑了一声，又扑了两下，总算抓住了果子。\n\n我看着这一幕，不自觉得想起了那天……\n浑身泥水的她趴在我脚边，抠着地板的缝隙，把大酱她们的灰举给我看。我跟她说，回不来了。雾之湖已经死了，春天不会再来了。\n那时候我是真不信她。一个连冬天都熬不过去的小春精，翅膀薄得透光，但凡风大一点都能把她刮个跟头。我甚至觉得，她还没摸到大结界的边，就会冻死在哪个没人知道的阴沟里。\n\n可她飞到了。还飞回来了。还把整片湖都变回来了。\n\n我无奈地把扫帚靠在墙边，嘴角自己往上扬了起来。\n\n“真是一群……怎么也除不掉的杂草啊。”"
KNM.32.a:0 "“别在我的院子里洒水啊，琪露诺！”"

KNM.33.t:0 "我们该出发了"
KNM.33.d:0 "最后一点焦炭的臭味从湖面散去，阳光终于彻底照亮了世界。那些生满铁锈的机器残骸上正爬满着绿苔。几朵娇嫩的小黄花从钢板缝隙里探出头来，在风里轻轻地晃。\n莉莉白站在红魔馆的露台上，白色裙角在暖风里晃动。指尖小心地触碰着花瓣，脸上是满足、单纯的笑容。妖精们正在不远处的花坛边，因为谁摘的水果更大而争论个不停。\n这场关于春天的远征，在今天，终于写下了最后的篇章。\n她抬起头，大口吸着清甜的空气，拍打着翅膀飞上了蔚蓝的天空。"
KNM.33.a:0 "“那么，就去给大家报春吧！”"


KNM.34.t:0 "不要在雪地里发抖哦"
KNM.34.d:0 "雪花落在了生锈的刺刀上，发出细微的沙沙声。\n三个穿着油污大衣的魔导国士兵，正缩在干枯的灌木丛里小心翼翼地挪动着。他们的手早就冻得紫掉了，连扣扳机都觉得费力无比。在后方，督战队的机枪随时准备扫射任何胆敢后退的人。\n\n灌木丛突然动了动。\n士兵们吓得慌忙举起了枪，牙齿在风里打起架来。可钻出来的……只是个怀里紧紧抱着个粗瓦罐的小影子。\n\n莉莉白落在了一根枯木上，长长得吐出一口白气。她一点也没理会那三个黑漆漆的枪口，从小瓦罐里掏出两个用树叶包着、还带着热气的烤栗子放在了干净的雪地上。\n\n“吃点东西吧，外面好冷呀。”她小声说着，拉了拉单薄的领口。\n\n最前面的年轻士兵盯着那两个栗子。在长官口中，结界里全是会吃人的怪物。可他实在太饿了……饥饿压过了害怕。他猛地扑过去，用满是泥巴的手套抓起雪地上的栗子，连壳也顾不上剥，粗暴地塞进嘴里大嚼起来。干涩的栗子肉泛着一丝甜味，他的眼角突然湿润了起来。\n\n“不准私通异类！”\n刺耳的哨子声突然响起。巡逻的士官冲过来，一枪托重重砸在年轻士兵的后脑勺上。士兵连哼都没哼一声就倒在了雪里，嘴里还吐着没嚼烂的栗子壳。士官用皮靴将雪地上的另一个栗子踩得粉碎，泥水沾满了靴底。\n\n士官拉响了手枪，枪口对准了树上的白色小影子。\n\n莉莉白吓得拍打着翅膀飞上了天。她想不通……为什么自己送了甜甜的栗子，那个吃栗子的大叔却会被人用铁棍子打出血来？\n\n逃跑时，冷风割在她的脸上好疼好疼，身后的枪声在山谷里沉闷地响着。\n这里……根本就没有可以听人说话的地方啊。"
KNM.34.a:0 "“大叔……为什么流血了呀？”"

KNM.35.t:0 "大家都在本子上写字吧"
KNM.35.d:0 "在刚被清理干净的大广场中央，泥土被大家合力翻开，种下了第一粒小小的花种。\n周围站满了人。新来的妖精们排成歪歪扭扭的队列，吃饱了烤栗子的地精们规规矩矩地举着木棒，还有几个从人类村庄过来的记录员。他们手里握着笔，脸色严肃地盯着场地中央。\n我被大家推上了那个用废旧木箱搭成的小台子。风吹过来，台子有些晃，不得不蜷起光溜溜的脚趾，努力站稳。灵梦说，作为一个盟约的“首领”，在种下第一粒种子的时候，必须要对大家进行一次严肃的演说。\n我清了清嗓子，对着这片黑压压的脑袋大喊起来：“大家听好啦！泥土踩坏了就不好玩了，谁也不许去踩。还有，绝对不准偷偷把地底下的花种挖出来吃掉，因为那个很涩，一点都不甜。地精们要是乖乖听话不捣乱，今天晚上就能分到一整筐烤栗子！”\n台子底下安静了一瞬，那些记录员们开始在小本子上飞快地写着字，发出沙沙的声音。\n“……听到了吗？‘不准吃花种’，这真是对保障战时的核心农业储备、杜绝非理性消耗最接地气的阐释啊。”\n“分烤栗子更是高明，用食物的再分配，来保障异族劳工的协作积极性，这绝对是超越了传统社会层面的关怀政策……”\n我站在木箱上，看着那些一边念叨着听不懂的词、一边拼命记笔记的人，又低头看了看自己脏兮兮的脚尖。我根本听不懂他们在说什么，我只是知道，如果把种子吃了，明年春天就真的不会来了。我当不了什么伟大的领袖。我只是一个很累、翅膀很疼，想要睡着的妖精们快点醒过来的春之妖精。但如果这些奇怪的大人们只要记记笔记，就能送来更多的花种子，那我就在木箱上多站一会儿。我努力板起小脸，让自己看起来尽量像个严肃的领袖。"
KNM.35.a:0 "“听好啦，一定要每天浇水呀！”"

KNM.36.t:0 "给泥巴也留一碗甜水吧"
KNM.36.d:0 "红魔馆的后院里，一口比水桶还大的铁锅正冒着白气。干枯的野菊花、干荷叶，还有一大罐蜂蜜倒进了沸水里，空气里一下子充满了甜味。\n\n幸存的小妖精们披着灰毯子围缩在草棚里，像一群无家可归的小鸟。大家垂着头，脸色惨白惨白的。\n“没有琪露诺大人了……风又这么冷，我们是不是要冻死了呀……”\n一只小妖精抽泣着。话还没说完，一碗温热的蜂蜜甜茶就塞进了她手里。莉莉白抱着木勺站在大锅旁，正挨个给大家分着甜水。\n\n小家伙们捧着碗，缩着脖子小口小口喝着。\n（咕嘟。）\n“哇……好甜！”\n哭声在一瞬间不见了。温热的甜茶咽下肚去，原本冻得惨白的小脸蛋，很快就变得红红的了。\n“莉莉酱！我还要一碗！”“南瓜布丁能不能多给我一块？”妖精们很快又为了抢布丁在毯子堆里打成了一团。\n\n扭打中，一碗甜茶不小心泼在了角落里。那个装着大酱和琪露诺的小木盒，正静静地放在那里……\n“啊！别浪费喝的呀！”\n大家停下动作凑过去看。被温水浇透的泥块并没有散开，干燥的泥巴像是一块海绵，把甜水一点点吸了进去。那一瞬间，泥土里散发出的焦味似乎淡了一些，隐约透出了雨后湿润泥土的芬芳……但一晃眼又不见了。\n\n莉莉白看着颜色变深了的泥块，有些留恋地用指尖碰了碰它，轻声说：\n“别怕哦，琪露诺大人、大酱……很好喝的水，已经分给大家了。”"
KNM.36.a:0 "“要给她们……也留一碗呢。”"

KNM.37.t:0 "红茶里落进了小花瓣"
KNM.37.d:0 "圣杯王国的伦敦总是在下雨，但今天下午，一股没来由的暖风突然吹散了满城的浓雾。\n在一座铺着厚地毯、挂满祖先油画的贵族宅邸里，两位衣着考究的绅士正靠在红木椅子上，慢条斯理地谈论着最近的国债利率与远洋股票。\n一抹雪白的身影毫无预兆地从敞开的落地窗飞了进来，带进了一大片粉红色的樱花瓣和湿泥的味道。\n“噢，亨利，这是什么？”威廉勋爵放下绘有烫金花纹的茶杯，有些嫌恶地用手杖拨了拨飘到大理石桌面上的花瓣，“幻想乡送来的最新款发条玩偶？还是哪个落后殖民地进献的珍稀飞禽？”\n莉莉白落在一只精致的银质糖罐上，歪着头看着这两个打扮得像黑乌鸦一样的人类。她从小篮子里抓出一小把刚从泥土里刨出来的、湿漉漉的花种子，顺手丢进了威廉勋爵那杯昂贵的红茶里。\n“春天来啦！大家快晒太阳呀！”莉莉白拍着翅膀，对着他们大声喊。\n两位绅士面面相觑。他们不约而同地调整了一下领结，神色变得非常严肃。\n“威廉，看到了吗？”亨利爵士压低了声音，盯着那杯正飘着泥沙的红茶，“纯白无瑕的衣着代表了古老血统的骄傲，她刚才的动作……那是幻想乡的古老礼仪！她把珍贵的作物种子投进你的杯子里，这是在向我们进行农业投资！”\n“天哪，亨利，你真是个天才。这一定是一种全新的、具有垄断性质的奇特香料！”威廉勋爵激动得手指发颤，当即从口袋里掏出一张盖着家族印章的巨额支票，毕恭毕敬地递到莉莉白面前，“高贵的女士，这是五万圣杯盾的本票，我们将全额收购您手中所有的种子产权……”\n莉莉白看了看那张毫无温度的白纸，觉得一点都不好玩，转过身拍打着翅膀，飞快地从窗户钻回了蔚蓝的天空中，只留下两个手里捧着泥沙和枯叶、以为自己垄断了全球香料市场的绅士，还在对着窗外优雅地脱帽致敬。"
KNM.37.a:0 "“大乌鸦们的纸片一点都不甜。”"

KNM.38.t:0 "红围巾和超级大萝卜"
KNM.38.d:0 "在西伯利亚寒风呼啸的泥地里，两个穿着厚呢大衣的男人正对着一片冻坏的土豆地发愁。那是集体农庄的庄长和一位戴着红围巾的农艺师。\n“今年冬天的计划额度泡汤了，达瓦里希。”农艺师在表格上重重地画了个叉，“我们恐怕要去北边挖煤了。”\n一抹雪白的身影在风雪里掠过。莉莉白拍打着翅膀落在坚硬的冻土上。她好奇地看着这两个冻得直跺脚的人类，尤其是那条鲜艳的红围巾，看着就像神社里的符纸一样暖和呢。\n莉莉白趴下身子，对着泥土呼了一大口暖气。\n咔嚓咔嚓的声音响成了一片。冻土在几秒钟内融化，泥地里，一个个大得出奇的甜萝卜和土豆争先恐后地冒了出来，堆成了好几座小山。\n农艺师和庄长大吃一惊，笔掉在雪地里也顾不上捡。\n“……达瓦里希，这完全超出了播种计划。”庄长手忙脚乱地翻看报表，“这些萝卜本该在明年夏天成熟，现在才一月！表格上可没有妖精这一栏啊，我的报告该怎么写？”\n莉莉白飞下来，从小篮子里掏出一颗浸过温水的红浆果，塞进了庄长的嘴里。\n庄长一下子闭了嘴。他嚼了嚼那颗浆果，脸上的愁容在清甜的味道里融化了。他看了看满地的萝卜，又看了看旁边那个在天空中翻跟头的小白影子，索性把手里写满公式的报表扔进了雪地里。他一屁股坐在大萝卜堆上，掰开一个甜美多汁的萝卜，大口嚼了起来。反正冬天已经过去了，去他的计划表格吧。"
KNM.38.a:0 "“那里的达瓦里希，表情好严肃呀。”"

KNM.39.t:0 "茶杯里长出了嫩芽"
KNM.39.d:0 "大雾笼罩着临街的窄门，石板路上湿漉漉的，带着江水潮湿的腥气。\n昏暗的茶馆里，几个裹着粗布绑腿、大衣有些破损的军官围坐在缺角的方木桌旁。桌上搁着几块干硬的锅盔饼，盖碗茶里的粗茶渣泛着焦苦的涩味。由于连年的战事，大家都有些疲惫，靠在竹椅上沉默地抽着烟草。\n“格老子，这饼硬得能砸死鬼子，牙齿都要咬断喽。”\n话音刚落，一抹雪白的身影毫无预兆地从大雾里飞进来，轻飘飘落在装满茶渣的盖碗边缘。莉莉白歪着头，看着这些嘴里吐着白烟、愁眉苦脸的人类。她觉得这个地方全是浓雾，特别亲切，便高兴地对着茶碗吹了一大口暖气。\n茶碗里那些原本已经泡烂、发黑的苦茶渣突然在温暖的气息中舒展开来。它们吸饱了水分，在众人的注视下，迅速抽出一枚枚嫩绿的茶芽，散发出雨后新茶的清香。不仅如此，柜台上那株插在破泥罐里、早已干枯的腊梅枝，也突然绽开了一朵朵蜡黄、清香的花苞。\n茶馆里顿时安静得连一根针掉地上都能听见。\n“要得！要得！”老板最先反应过来，手里的旱烟袋啪嗒一声砸在地上，整个人差点从竹椅上翻过去，“青城山的仙姑下凡喽！这是仙术啊！”\n“莫瞎说，依我看这是峨眉山的仙子，专程送吉兆来喽！”旁边的军官猛地一拍大腿，激动得满脸通红，当即恭恭敬敬地从兜里摸出一包红糖和两粒花椒，用红纸包好递了过去，“仙姑，尝尝我们四川的土产……”\n莉莉白好奇地咬了一口花椒，麻得舌头直打颤，一连打了好几个响亮的喷嚏。她觉得这颗红红的小果子实在太古怪了，便扇着小翅膀，高高兴兴地重新飞回了浓雾深处。茶馆里，一群人正围着那杯长满嫩芽的盖碗茶，争论着这位“白衣仙姑”到底是哪座道观的护法。"
KNM.39.a:0 "“红红的小果子好麻呀。”"

KNM.40.t:0 "木桌上生出了新树枝"
KNM.40.d:0 "在市中心街角的一家小餐馆里，留声机正有气无力地放着欢快的爵士乐。\n柜台前，两个穿着风衣的职员正端着粗陶杯，对着里面黑糊糊的液体叹气。由于最近好吃的管制，现在的咖啡全是用劣质菊苣根磨出来的代用品，喝起来黏糊糊的，像一碗刷锅的水。\n“乔，我发誓，这杯黑水迟早要把我的胃给烧穿。喝完它，我整个人都在发昏。”\n话音刚落，一抹雪白的身影轻飘飘地从大开的窗户外飞了进来。莉莉白歪着头，看着这些在冷铁椅子里缩着脖子的人类，还有这个冷清清、连一点绿色都没有的屋子。她觉得他们实在太可怜了，便对着面前那张粗糙的松木长桌用力吹了一大口暖气。\n这张桌子是用原色松木拼成的。随着这股温柔的微风，木料缝隙里的松脂突然开始渗出香气，紧接着，一抹抹嫩绿的松针在众人的注视下，活生生从木纹里钻了出去，甚至还长出了一小截毛茸茸的新树枝。\n餐馆里顿时一片寂静。\n“乔，”旁边的同伴眨了眨眼，手里的汤匙滑落进杯子里，“快，扇我一巴掌。我大概是被那杯代用咖啡毒出幻觉了。我看到桌子在发芽，还看到一个长着翅膀的小人在冲我们笑。”\n“啪！”一声清脆的耳光响过。\n“醒了吗？”\n“没有……那个小人还在。她甚至在咬你刚放在桌上的那一分硬币。”\n莉莉白用小牙齿咬了咬那枚硬币，硬硬的，差点崩了门牙。她嫌弃地把硬币吐在桌上，拍打着小翅膀，高高兴兴地重新飞回了窗外的夜空深处。\n“噢，她飞走了。幻觉消失了，谢天谢地，我刚才真的以为自己疯了……”乔揉着红肿的脸颊，松了一口气。\n然而当他们低下头时，那条长着松针、滴着新鲜松脂的新树枝依然结结实实地横在桌子上，散发着好闻的森林香气。\n还没等他们想明白，餐馆老板已经举着粗木棍气急败坏地从厨房里冲了过来，对着他们大声咆哮：“该死的！你们两个对我的桌子做了什么？！我的古董松木桌全毁了！你们今天必须赔偿我的损失！”\n只留下两个职员捂着脸，看着那张还在顽强抽芽的木桌，欲哭无泪。"
KNM.40.a:0 "“这个圆片片，一点也不好吃。”"

KNM.41.t:0 "紫色缝隙里的怪姐姐"
KNM.41.d:0 "博丽大结界的边缘，空气里突然凭空裂开了一条亮着无数紫色眼珠的恐怖缝隙。\n我正拉着大酱的手在草地上散步，一个穿着洋装、手里拿着折扇的漂亮女人，便慢吞吞地从那条缝隙里探出半个身子坐了下来。她用扇子遮住半张脸，用一种深不可测、听起来让人有些发毛的声音对我说：\n“小家伙，你最近带着大家在大结界上钻了好多洞呢。要是结界漏风了，我可是会很困扰的。”\n大酱被那些密密麻麻的眼珠子吓得直往我身后钻。但我看着那个坐在缝隙里、看起来懒洋洋的女人，完全感觉不到害怕。那些在黑色缝隙里转来转去的眼珠子，圆滚滚、水灵灵的，看起来特别像地精大叔们喜欢玩的彩色弹珠。\n“大姐姐，你的弹珠真好看。你要吃刚摘下来的樱桃吗？”\n我从小篮子里端出一碗茶，上面还飘着两颗洗得干干净净的红樱桃，垫着脚尖，高高地递到了她的跟前。\n那个漂亮的姐姐僵在了半空。她那双深邃、仿佛看透了千百年岁月的眼睛微微睁大，有些迟疑地盯着我手里那碗茶。她大概没料到有人会把她的隙间眼珠当成弹珠，更没料到这个擅自破开结界的“犯人”会大模大样地请她吃水果。\n最后，她有些挫败地叹了口气，用折扇在我的脑门上敲了敲。\n“真拿你们这些不长脑子的妖精没办法。”她接过木碗，嘴角带上了一丝有些放松的笑意，“看在这碗茶的份上，以后我把结界的隔阂弄得软和一些，让你们飞得更轻松些。不过，不许往我的缝隙里扔大蒜哦”\n说完，她便撑起阳伞，慢悠悠地缩回了那条缝隙里。大结界似乎真的在一瞬间变软了，像是一层随时可以穿过去的透明薄膜。"
KNM.41.a:0 "“那个缝隙里的姐姐，其实不坏呢。”"

KNM.42.t:0 "无法凋零的花朵冰雕"
KNM.42.d:0 "阳光透过树叶落在大草地上。我蹲在花坛边，刚用暖烘烘的气息吹开一朵小小的黄花，就高兴地拍着翅膀跳了起来。\n“春天来啦！大酱！琪露诺大人！”\n还没等我把手里的花瓣展示给大家看，一阵冷风就从屁股后面刮了过来。紧接着，那朵刚舒展开的小黄花就发出了咔嚓咔嚓的声音，被封在了一块泛着微光的冰疙瘩里。\n“哈哈！这下子它就不会谢了！”\n琪露诺大人踩着冰块，得意洋洋地飘在半空。她挥舞着小拳头，大声宣布这是她最伟大的艺术品。大酱此时则在一旁有些不好意思地拉着她的袖子。\n我气得在地上直跺脚，拍着翅膀在后面追她。冰块在阳光下反射着刺眼的光，我们在湖边的草地上绕了一圈又一圈。虽然我的花被冻坏了，但看着那块冰在和煦的阳光下慢慢化成水滴，顺着草尖落进泥土里，大家最后还是在草地上笑成了一团。\n那时候的太阳，总是这么暖和。"
KNM.42.a:0 "“琪露诺大人最讨厌了！”"

KNM.43.t:0 "风车怎么不转了呢"
KNM.43.d:0 "平原上矗立着一栋栋奇形怪状的木房子，屋顶上还长着四片巨大、正在呼呼转动的木翅膀。那些本地的人类管它们叫风车。我觉得那些风车一定是某种受了伤、在痛苦挣扎的木头怪兽，因为它们在风里转动的时候，总是发出吱呀吱呀的刺耳惨叫。\n我飞了过去，落在其中一片巨大的木叶片上。我抱住那根粗糙的木头，用春风吹拂着它。木叶片上的水汽迅速化开，原本干枯的木料开始疯狂抽芽，长出大片大片绿油油的常春藤和莹润的花苞。\n木翅膀越转越慢，最后被那些茂密的藤蔓彻底卡住，一动不动了。我有些得意，觉得这只怪兽终于被我的魔法治好、可以安静地晒太阳了。\n当那个缠着围巾的人类农夫揉着眼睛从磨坊里走出来时，他整个人都傻了。他看着自己那座在一瞬间开满了鲜花、彻底变成了一棵大绿树的磨坊，还有坐在叶片上友好朝他挥手的白色小妖精，手里的烟斗啪嗒一声掉在了泥地里。他可能这辈子都没想过，自家的风车也会有开花的一天。"
KNM.43.a:0 "“大木头怪兽，现在不疼啦。”"

KNM.44.t:0 "甜甜的小松饼"
KNM.44.d:0 "地精们居住的乱石窟里光线暗淡，空气里弥漫着一股湿泥土和劣质松脂的味道。几十个皮肤粗糙、长着宽大耳朵的大家伙正围着一堆烧剩下的篝火剔着牙，脚边横七竖八地丢着缺口的铁镐。我抱着装满水果和松饼的竹筐，慢慢走了进去。\n领头的大地精猛地站了起来，他那宽大的肩膀几乎把背后的火光遮得严严实实，嗓音粗哑地吼着，问我是不是红魔馆派来催租的。但我丝毫没有退却，仰起头，将一块还带着炉子的余温的松饼递到他满是伤痕的掌心里。他迟疑了一下，塞进嘴里大嚼起来，原本紧绷着的厚嘴唇慢慢松弛了下来。\n“车间里太冷清了，大叔们愿意帮大家一起去干活吗？每天都有好吃的松饼呢。”\n我一边说着，一边伸出手，用帕子去擦他下巴上粘着的灰尘。这个原本能单手捏碎大木棒的强壮地精，在温热的帕子面前，突然红了脸，有些手忙脚乱地退后了几步。他有些不好意思地把大手往身后藏了藏，粗糙的大手指局促地抠着衣服，眼睛直勾勾地盯着我手里那只散发着面粉香气的竹筐。炉子的火焰和铁锤，这下子总算能派上用场了。"
KNM.44.a:0 "“地精大叔们，其实很好商量呢。”"

KNM.45.t:0 "种下未来的花种"
KNM.45.d:0 "在靠近东边国境的一处泥泞战壕里，倒着一顶灰色、沉甸甸的铁帽子。\n铁帽子在泥水里泡得有些生锈，旁边还散落着几张湿透了的写着看不懂的语言的小纸片。我拍着翅膀落在铁帽子边缘，原本以为里面会全是焦黑的毒药，却在钢盔内衬最深处的缝隙里，发现了一粒干瘪瘪的小种子。\n\n这是一粒矢车菊的花种子。\n那些排放着黑烟、把大家变成泥巴的坏人，在出门打仗的时候，居然也悄悄藏着一粒故乡的花种子呢。\n\n原来……他们也是喜欢花的呀。\n\n我看着这粒小种子，手心变热了。我小心地把它从缝隙里抠出来，埋进了战壕潮湿的泥土里。趴下身子，对着那块泥土吹了一口温暖的春气。\n\n嫩绿的小叶片眨眼间就顶开了泥巴，在废墟里开出了一朵小小的、蔚蓝色的、像天空一样好看的野花。在冷硬的钢铁旁边，小蓝花在风里摇晃着，正散发着微弱又芬芳的香气。\n\n“等大家都不打架了……这里也会开满蓝色的花吧。”我对着小蓝花小声说着，拍拍翅膀重新飞向了天空。"
KNM.45.a:0 "“大家……其实都想要春天呀。”"

KNM.46.t:0 "地精大叔不高兴了"
KNM.46.d:0 "红魔馆外围的铁器车间里，今天安静得有些反常，听不见一点往日沉重的锻铁声。\n几十个地精正抱着胳膊坐在门外的石堆上，个个耷拉着嘴角，把沉重的铁锤随便扔在泥地里。炉子的烟囱已经冷了下去。\n前几天，妖精们为了让工厂看起来生机盎然，跑进去在所有的传动皮带和风口里塞满了茂密的青苔与牵牛花。结果，湿漉漉的草叶缠在传动带里解都解不开，炉子里的火也被青苔彻底闷死，炉温一降，什么铁也敲不出来了。\n“铁需要火。你们这些妖精种的草把风口全给堵住了，我们的炉子连火都升不起来，我们还怎么干活啊？”领头的地精指着那些被杂草卡住的铁管，粗声粗气地朝我嚷嚷，两只耳朵气得发抖。\n我知道自己做错了事，看着那些不再冒烟的烟囱，不好意思地扯着裙角。我上前把裙子挽到膝盖上面，蹲在泥水洼里，跟着大叔们一起把管道里的湿草一根根扯出来。泥水黏在手掌上，又脏又黏，我的手指很快就被坚硬的铁构件割出了几道浅色的红印。\n领头的地精看向我，叹了口气，伸出他那长满厚茧的大手一把将我从污水里拎到了干燥的木箱上。他自己蹲下身，两三下就用粗壮的手指扯断了那些缠绕在转轴深处的藤蔓。\n干完活，我从篮子里掏出用干草包着的烤红薯，递到了他们沾满黑油的手掌里。\n“以后里面的机器全交给大家管，我们只在围墙外面种些吸烟的小花，再也不去碰里面的铁管了。”我用沾了温水的手帕擦去了他额头上的汗水。\n闻着烤红薯的香气，地精们互相看了看，原本紧绷着的绿脸慢慢松了下来。他们抓起红薯塞进嘴里，一边含糊不清地嘟囔着，一边重新拎起沉铁锤，在叮当的炉火声里敲打了起来。"
KNM.46.a:0 "“地精大叔们也很善良呢。”"

KNM.47.t:0 "这里总会开满小花"
KNM.47.d:0 "东边那条曾经满是战壕和铁丝网的边境线，如今已经变成了一片起伏的绿色山坡。\n拍着翅膀落在山坡上。那些焦黑的泥土和难闻的煤烟气味全都不见了，空气里满是泥土湿润的芬芳。\n那顶曾经装过小花种、沉甸甸的灰色铁帽子，此刻正半埋在松软的草地里。里面的钢盔内衬早就被雨水洗得干干净净，几只淡黄色的小鸟正在里面筑巢，叽叽喳喳地唱着歌。\n铁帽子旁边，坐着一个穿着破烂衣服的普通人类。\n他的右袖管空荡荡的，在风里微微摆动。他不曾戴着钢盔，也未曾拿着那根生硬的铁枪，安静地坐在草地上，看着满山遍野、正迎风摇曳的蓝色矢车菊。\n听到翅膀拍动的声音，他转过已经被阳光晒得有些黑红的脸，眼神里满是平静与温存，用那只仅剩的左手折下一朵蓝色的小花，放在了那顶生锈的铁帽子上。\n“谢谢你，小妖精。”他看着我，粗糙的脸上露出了温和的笑容，“我回家了。故乡的花，真的很美。”\n其实我听不懂他说的“故乡”和“家”是什么意思。不过他的手心好暖呀，而且他也不再发抖了。\n我冲他高兴地笑了笑，拍打着翅膀，在蓝色的花海里绕了个圈，飞向了高空。春风将这些花粉带得很远，大家现在全都在太阳底下暖和起来了。"
KNM.47.a:0 "“大叔，春天已经到啦。”"

KNM.48.t:0 "大雪人也是很温柔的"
KNM.48.d:0 "大雪铺天盖地落下来，寒风在光秃秃的树枝间呜呜地吹着。\n我抱着冻得麻麻的手，正缩在一起大石头后面。我一直以为冬天全是坏东西，连带着也有些讨厌起眼前这个穿着蓝白衣服的雪女大姐姐了。\n\n蕾蒂·霍瓦特洛克拍了拍衣服上的雪，慢吞吞地走了过来。她叹了一口气，伸出那只冰凉却意外软乎乎的手摸了摸我的脑袋。\n\n“小家伙，你把冬天和那些东边的怪物弄混了呢。”\n我委屈地缩了缩脖子：“可是……冬天的风会把大酱她们变成泥巴，还会把小草熏黑，还让大家发抖……”\n\n“冬天的风确实很冷，但那里面是不一样的。”蕾蒂摇了摇头，指向东边那片阴沉沉的灰雾，“大自然的冬天，是让大家舒舒服服地睡个大觉，等积雪融化的时候，春天才能更有力气地醒过来。那是温柔的睡眠。而东边那个冬天，是会把生命彻底掐断的、坏透了的冬。它抢走了你的春天，还不打算让大家醒过来。”\n\n她从雪地里刨出一根结实的草根，指着上面的霜花。\n“看，我的霜花只是在保护种子。我们要打败的是那个不讲道理的坏冬天。让大家睡觉的好冬天，可不是我们的敌人哦。听懂了吗，小春精？”\n\n我看着霜花底下完好无损的草根，懵懵地点了点小脑袋。原来……大雪人是温柔的好冬天呀。等把坏冬天打跑了，好冬天就能安心地让大家睡大觉啦。"
KNM.48.a:0 "“原来……大雪也是在保护大家呀。”"

KNM.49.t:0 "草地上按了两个小手印"
KNM.49.d:0 "湖边的草坪上摆着一张有些开裂的矮木桌。\n我拿着一盒红红的朱砂，把它放在了木桌子中央。地精首领挠了挠大耳朵，有些局促地站在旁边。他粗壮的绿手指上还粘着陈旧的机油，宽大的脚板在泥地里不安地蹭着。\n灵梦站在旁边，她用笔在泛黄的纸张上写下了好多字。她说这是确立我们和地精大叔们共同生活的盟约。以后大家不用再躲着红魔馆的皮鞭，大家是一样的居民，可以平分地里收上来的土豆和水果。\n“俺不会写字。”地精首领瓮声瓮气地嘟囔着，有些不好意思地把大手往围裙后面缩。\n“没关系，按手印就好啦！”\n我高兴地伸出小手，在红红的朱砂里用力按了按，然后在纸张的右下角拍出了一个小小的、有些歪斜的红色掌印。\n地精首领看着那个还没有他一根手指大的红印，裂开大嘴笑了。他也伸出大手，小心翼翼地在我的小掌印旁边落了下去。那只大大的手掌，在纸面上留下了一个粗糙的印记。整个桌面似乎都跟着震了震。\n阳光落在粗糙的纸页上，一大一小两只掌印靠拢在一起，像是在泥土里并排长出来的两朵野花。在这片时常被风雪和黑烟笼罩的边界上，这片大草地，从今天起就是我们共同的家了。"
KNM.49.a:0 "“拉拉手，以后大家就是一家人啦。”"

KNM.50.t:0 "大小姐端着红茶看热闹"
KNM.50.d:0 "红魔馆二楼的长廊里，我（咲夜）看着底下闹哄哄的大厅，额头上的青筋正一跳一跳的。\n大厅名贵的红地毯上结了一层滑溜溜的冰，几个小影子正排着队从楼梯扶手上大呼小叫地滑下来，把昂贵的大吊灯撞得晃来晃去。\n“大小姐，妖精们已经把西侧的客房全铺满了干草和烂泥。如果再放任不管，这栋宅子怕是要彻底变成沼泽了。”我握着腰间的飞刀，极力压抑着声音里的怒气。\n蕾米莉亚坐在红木椅子上，优雅地端起瓷杯，抿了一口红茶。她看着底下那个正在指挥地精搬木板、忙得满头大汗的白色小妖精，眼里反而带着一丝新奇。\n“算了，咲夜。反正平时这地方也太安静了。”她放下茶杯，有些慵懒地撑着下巴，“而且，你不觉得她们把大厅的吊灯擦得比你平时擦的还要亮吗？既然她们能把那些讨厌的黑烟挡在大门外面，让这里有些生气，那就随她们去吧。”\n我顺着她的视线看去。虽然大厅里一片狼藉，但原本死气沉沉的红魔馆，现在确实充满了清脆的笑声和温暖的风。我叹了口气，默默把飞刀收回了袖子里。\n“那么，我去给她们准备一些甜点和红茶，大小姐。”"
KNM.50.a:0 "“唉，今天也只能这样了。”"

KNM.51.t:0 "门卫小姐在画大圆圈"
KNM.51.d:0 "红魔馆的大铁门前，红美玲正扎着马步，两只手在半空中慢吞吞地画着大圆圈。\n“嘿……哈……这是太极，懂不懂？”她一边擦汗一边向旁边探头探脑的妖精们炫耀，“气沉丹田，万物皆空。只要本姑娘这一掌过去……”\n话音未落，莉莉白飞了过来，落在了她的绿帽子上。美玲的身子一僵，两只手还停在半空中画圆，眼珠子拼命往上翻，试图看清头顶上的小家伙。\n“门卫姐姐，你是在玩定住不许动的游戏吗？”莉莉白歪着头问。\n周围的妖精们以为这是一种新游戏，呼啦一下全飞了过来。有的学着美玲的样子扎马步，有的在半空中跟着乱画圆圈。几十个小翅膀嗡嗡响，在美玲身边绕成了一个乱糟糟的旋涡。\n“哎呀，别闹，我是在练功……哎呀，好痒！”美玲被妖精们的翅膀尖扫到脖子，痒得直缩脖子，脚下一滑，一屁股跌坐在地毯一样的草坪上。\n正当她揉着屁股叹气的时候，二楼的窗户推开了，咲夜面无表情地探出头，手里还拿着吓人的飞刀。\n“美玲，大小姐问你，大清早在院子里带着妖精们转圈，是红魔馆的新娱乐项目吗？”\n美玲吓得一缩脖子，赶紧从怀里掏出两个热包子塞给莉莉白，合起双手拼命告饶：“仙姑们，求求你们快飞走吧，再闹下去，我今天晚上的饭盒就要被咲夜没收了！”\n莉莉白抱着包子，咯咯笑着飞走了，留下美玲一个人在草地上手忙脚乱地捡着帽子。"
KNM.51.a:0 "“包子香香的，门卫姐姐真好玩。”"

KNM.52.t:0 "花朵都在朝土里长"
KNM.52.d:0 "鬼人正邪抱着胳膊站在刚种好的花田边，看着那些开得规规矩矩的迎春花，脸上满是不屑。\n“天天‘春天来啦’，烦都烦死了。凭什么春天就要在上头，冬天就得在底下待着？”\n她趁着妖精们都在睡觉，悄悄溜进花田，用手把那些刚长出来的小花一朵朵拔出来，倒着插回泥土里。她拍了拍手上的泥，看着那些花根朝天、花瓣朝地的滑稽模样，发出了得意的坏笑。这些人循规蹈矩地活着，全翻过来才好玩。\n第二天莉莉白一摇一摆地走过来，也不恼，只好奇地蹲下身，瞅着那几朵花看了好半天。\n“哇，正邪姐姐，你是在帮花朵挠痒痒吗？”莉莉白拉着正邪的袖子，把一碗果汁递给她，“它们在土里一定很暖和。正邪姐姐心肠真好。”\n正邪僵在原地。原本打算看妖精们哭鼻子，可迎来的却是一张笑脸。那股别扭脾气一瞬间被春风吹得散了架，有些气急败坏地夺过茶碗，一口气灌了下去。\n“多管闲事！我最讨厌甜东西了！”\n她大声嚷着，把空碗扔回莉莉白怀里，气呼呼地转过身走了，一路上还顺手把几朵倒插的花又给正了回来。"
KNM.52.a:0 "“正邪姐姐走起路来，像个不倒翁呢。”"

KNM.53.t:0 "两朵小花花"
KNM.53.d:0 "人类村庄的边界登记处里，桌上摊着一本泛黄的公文。登记员揉了揉发酸的太阳穴，盯着眼前的申请书。\n在“申请国名”那一栏里，什么字也没有。只有一个用泥巴印上去的脚丫子印，旁边还粘着两瓣已经干枯的小花。\n“听着，小家伙，”登记员指着那个泥印子，试图对飘在茶壶上的白色妖精讲道理，“这里必须写字。你们国家的正式名字到底叫什么？”\n莉莉白歪着头，咬着一根草茎：“花花！开满花的花花！”\n“……花花？”登记员叹了口气，在纸上落笔，“那就叫，花花乐园。那么，你们的签字……”\n莉莉白高兴地飞过来，一脚踩在旁边的墨水池里，接着“啪”地一声，在纸上按了一个脚印。\n这份公文就这么被送到了外面那些势力的桌上。没过几天，隔壁的领袖们纷纷发来公函，甚至还有学者写了长长的文章，他们拍着桌子，非说“花花”这两个字大有深意，是什么对传统秩序的无情戏谑；而那个泥巴脚印，则是人地相依、血脉相连的无上昭示。”"
KNM.53.a:0 "“大家都觉得我们的名字很好听呢！”"

KNM.54.t:0 "大家突然变穷了是什么意思？"
KNM.54.d:0 "几只小妖精围着一个挑着扁担的人类商贩，急得直拍翅膀。\n大酱踮着脚，把一叠印着女王头像的漂亮纸钞递过去，指了指筐里的红豆团子。以前只要拿出一张这种纸片，人类就会笑得合不拢嘴，能换一大包甜食。\n可卖货的男人挥了挥破了洞的袖口，连连摆手。他叹着气说道：“不行啦。海那边的圣杯王国银行全倒了。你们手里这印着花的票子，现在什么都兑不出来，全成了废纸。”\n\n妖精们互相看了看，完全听不懂他在说什么。\n\n大酱急了，又从怀里掏出一小把闪亮的硬币：“那硬币呢？硬币还是发着光的呀！”\n男人看了眼硬币，咽了口唾沫，却把护着筐的手臂收得更紧了：“硬币倒是真钱。可外面的工厂全停了，运粮的火车早就不开了，有钱你也买不着食物。这点团子是我最后一点口粮，我得带回家给孩子保命，不卖了。”\n\n他缩着脖子，挑起扁担走了。走起路来摇摇晃晃的，背影看着特别沉。\n大家抱着一堆金属片和一叠废纸票子，有些发懵地坐在木桩上。\n“我们好像变穷了。”大酱吸了吸冻得发红的鼻子。\n“变穷是什么意思？”莉莉白歪着头问。\n“大概就是……外面那个盖图章的大房子死掉了，所以这些纸片也跟着死掉了，再也变不出好吃的了。”\n大酱摊开手，看着那些原本能换来好几车红豆的漂亮纸张。大家盯着这些废纸，觉得扔了怪可惜的。莉莉白凑过去伸手摸了摸，发现它们其实挺软和。\n“那我们把这些没用的纸片铺在树洞里的小床上吧？”莉莉白眨了眨眼，“垫着睡觉，肯定很暖和。”\n大家一听，又高兴地扑起翅膀来。虽然吃不到团子了，但在不讲理的冬天里，大家的小床肯定比以前要舒服得多。"
KNM.54.a:0 "“这些小纸片，现在只能拿来睡觉啦。”"

KNM.55.t:0 "绝不向春风投降"
KNM.55.d:0 "从幻想乡吹来的那些暖风危险至极。报告显示，前线的士兵正在战壕里丢掉武器、看着刚发芽的花朵失声痛哭，后方兵工厂的劳工们也开始消极怠工、吵着要实行什么阳光和假期的制度。这是一场蓄谋已久的、针对帝国意志的无形打击。\n那群住在雾之湖的妖精，正在用这种不可思议的方式融化我们的工业与防线。如果放任这股邪风继续吹拂，我们的秩序和钢铁意志将在明天清晨彻底瓦解。大本营已经下达了绝对的命令：立刻出兵，彻底踏平那个叫作雾之湖的妖精巢穴，将这股该死的春风彻底掐灭在源头！"
KNM.55.a:0 "“那么……我们有把握吗？”"
KNM.55.b:0 "这已经不是我们要考虑的事情了"

KNM.56.t:0 "春天已然到来"
KNM.56.d:0 "沉闷的工厂汽笛并没有在今天清晨响起来。\n乔（工人）推开那扇布满红锈的铁窗户，原本习惯性地想要用衣袖去挡刺鼻的煤烟，却在柔和的微风吹在脸上时，愣在了原地。\n外面的废土上，原本用来运送煤炭的铁轨已经被一层松软的绿苔悄悄覆盖。几朵金灿灿的迎春花正从一台报废的阀门里钻了出来，在风里可爱地晃动着。空气里难闻的硫磺味消散了，此刻全是新泥和花朵的清香。\n那个在天空中飞舞、大声叫喊的春之妖精，当真把暖风吹进了千家万户的窗格。大家瞅着窗外的迎春花，这才恍惚回过神来——日子原本可以不用过得像木偶那般生硬。人们在温暖的阳光下相视而笑，乔拍了拍大衣上的煤灰，嘴里哼起了一首他以为自己早就忘记了的、关于春天的儿歌。"
KNM.56.a:0 "“谢谢你，春之妖精！”"

KNM.60.t:0 "如果他们再也不会开花"
KNM.60.d:0 "倒塌的废墟上，现在已经长满了绿油油的嫩叶，无数迎春花开得像一片金色的海。大酱和琪露诺大人拉着手在前面跑着，大家都在大声欢笑。\n\n我拍着翅膀跟在后面，中途却在废墟的角落里，停在了一棵高大的橡树前。\n这棵老橡树的树皮全被大火烧焦了，像一具黑漆漆的巨大骨架。别的树都已经在春风里抽出了嫩芽，可它的枝丫依然干枯、发凉，上面落满了旧年的灰。\n\n我飞过去，抱住它焦黑的树干，用尽全力呼出一口口春风。我吹了好多下，吹得喉咙都疼了起来，可老橡树一动不动。树干里听不到树液流动的声音，也看不到绿叶长出来。它已经……彻底死掉了。\n\n“莉莉！别吹啦！这棵树已经死啦，它不会再开花啦！”琪露诺在后面喊着，过来拉我的手。\n\n我摸着那些粗糙、焦黑的树皮，难过地低下了头。原来……在大火里受伤的老树，哪怕等来再柔软的春风，也是再也醒不过来了啊。\n\n我从小篮子里摘下一朵漂亮的野花，轻放在了老橡树黑乎乎的树根下。\n“对不起哦，老树大叔。”我小声地对它说着。\n\n虽然它再也听不见春天的歌声，但我知道，新长出来的绿草和小花，会替它一起在阳光下长大的。我擦干眼泪，重新拍打着翅膀飞回了大家吵闹的欢笑声里。春天很美很美，可也有些树木……永远留在了那个冬天的废墟里。"
KNM.60.a:0 "“老树大叔……晚安哦。”"

KNM.61.t:0 "春天来啦，大家醒醒呀"
KNM.61.d:0 "湖边的草坪暖烘烘的，风吹过来全是甜甜的味道。\n琪露诺大人正跟大妖精在湖面上大呼小叫，冰花在阳光下折射出亮晶晶的光。大家都笑得好开心，声音传得好远好远。\n\n我坐在大树的阴凉里，看着她们打闹。白裙子被风吹得轻轻飘动，背后那双在火光里受过伤的翅膀，现在已经感觉不到疼了。\n\n“莉莉酱！发什么呆呀？”大妖精抱着一捧红艳艳的果子，扑着翅膀落到了我的身边。她瞪着眼睛盯着我背后的伤疤，用手指戳了戳，“哎呀，这里怎么黑黑的？你是不是又背着大家偷偷跑进大烟囱里去啦？”\n琪露诺大人也飞了过来，对着那些伤疤用力吹了几口气，好像这样就能把灰尘吹掉一样：\n“本小姐不管！虽然颜色难看，但只要莉莉酱还会飞，我就允许你继续跟着我！”她得意地叉着腰，把一小块冰塞进了我的手心，“看！这是专门给你的奖赏，快点把脏东西洗干净，我们还要比赛谁飞得快呢！”\n\n看着她们两张可爱的小脸，我的心里好像一下子塞满了那种甜甜的满足感。\n\n她们……真的什么都不记得了呢。\n不记得那场下不完的黑雪，不记得那些变成烂泥的小伙伴，也不记得我是怎么拖着破破烂烂的翅膀，在炮火里把大家一点点唤醒的。对她们来说，这只是稍微长了一点的午觉，睡醒了，就能继续在草地上玩耍。\n\n既然大家都这么开心，那就不用记得那些坏事啦。\n我把手心里那一小块闪着金光的冰紧紧握住，用力拍动着翅膀。\n“好！比赛开始啦！”\n我喊着，一头扎进了那阵吵吵闹闹的笑声里。能听见她们的打闹声，看到她们的笑容，闻到漫山遍野的花香……我就觉得自己，是世界上最幸福的妖精了。"
KNM.61.a:0 "“大家……都很开心呢！”"

KNM.62.t:0 "明年春天再见吧"
KNM.62.d:0 "树梢上的叶子已经绿得发暗了，风里那股暖洋洋的劲儿也正在慢慢散去。\n\n琪露诺大人和大酱正坐在湖边的大石头上，分着不知道从哪儿翻出来的零食，笑声贴着水面飘过来，清清脆脆的。\n\n我把手伸进口袋，摸到了那只小木盒子。盒子里是大酱和琪露诺大人剩下的那点泥巴，摸上去暖暖的，像一块晒过太阳的石头。\n\n眼皮开始往下坠了。每年都是这样，春天走到尾巴上的时候，风一软下来，我的身子就跟着变重了。该睡觉了呀。\n\n远处那棵大树底下，落叶铺得厚厚的，去年剩下的干草也还在那里呢，躺上去应该正合适吧。我把木盒放在了树根底下，挨着它坐进了落叶堆里，把脸埋进了胳膊。\n\n湖上的风轻轻吹过来，撩起了我的裙边，又轻轻落了下去。\n\n这些年做了好多好多事呢。飞了那么远，打了那么大一场架，还把那座好大好黑的铁房子给拆了。不过现在好困呀……有什么事，明年春天再说吧。\n\n嗯。明年春天……再去找她们玩。"
KNM.62.a:0 "“明年春天……再见吧。”"

KNM.63.t:0 "故事书里的春风"
KNM.63.d:0 "学堂里换了新桌椅，木头的味道还没散干净。窗外的阳光落在书页上，把纸页照出了璀璨的金黄。老先生翻开历史本子，一个字一个字地往下写。写到那场仗的时候，笔顿了一下，墨在纸上荡开了一个小黑点。\n\n人类会记得这些事。防线上留下的疤，大雪里丢掉的亲人，饿着肚子等春天的那种酸楚，都刻在我们的骨头里了。\n\n“先生。”坐在底下的孩子指着窗外，“妖精也受过伤吗？”\n\n窗外的集市上，琪露诺正站在一筐樱桃面前，拍着胸脯嚷嚷那是她用魔法冻出来的。大妖精和莉莉白拉着手跟在后面，手里拿着一块没吃完的饼干，在人群里钻来钻去，脸蛋被太阳照得红扑扑的。\n\n老先生摘下眼镜看着她们，用袖口慢慢擦着镜片。\n\n“没有的事。”他把本子合了起来，手在封皮上停了一小会儿，“妖精哪里会受伤啊。她们只是在冬天睡得久了一点。一睁开眼，太阳有了，花也开了，什么都好起来了。”\n\n人类会把这些事扛着。纪念碑会一座座立起来，纸上的字也会一行行传下去。可是看着这些什么都不记得、还在草地上追来追去的小家伙……大家总觉得身上的伤口，好像也没那么疼了呢。\n\n在春风里傻笑的孩子们，就是这片土地平平安安的，最实在的凭据呀。"
KNM.63.a:0 "“她们只是……睡了个午觉而已哦。”"

KNM.64.t:0 "“以后不许再来捣乱了”"
KNM.64.d:0 "树梢上的叶子在风里摇晃。我正蹲在纸箱子前捏泥巴，林子外面传来了脚步声。\n抬头一看，灵梦手里抱着个木箱子，正拉着脸深一脚浅一脚地往里走。魔理沙跨在扫帚上，手里揪着一根干枯的草茎，优哉游哉地跟在后面。\n灵梦把箱子往地上一搁，发出沉闷的木头撞击声。她揉了揉手腕，没好气地瞪了我一眼。\n“拿好了。往后这片林子随你们怎么闹，写公文的大人们盖了章，以后不归我们管了。”\n我好奇地凑过去，掀开箱子盖。里面除了一张盖了红戳的厚纸，还塞着几床揉软了的被子，和两袋子晒干的苹果肉。\n“看什么看，都是神社配房里占地方的旧货，扔了可惜，便宜你们了。”灵梦拍了拍衣袖上的灰，转过脸去，自顾自地扯了扯衣服上的褶子，“听好了，往后要是外面那些不讲道理的家伙打过来，只管往神社后面跑，大门给你们留着缝。平时嘛……不许再跑来我们这捣乱。”\n\n魔理沙在旁边嘿嘿直乐，顺手从怀里摸出一个小布包，嗖地一声扔进我怀里。\n\n“这里面幻想乡特制的肥料，种花最管用。往后自己当家了，可别一眨眼就把林子给糟蹋光了啊。”\n\n她们没待多久。灵梦嫌林子里潮气重，转过身就往回走。魔理沙冲我眨了眨眼，骑上扫帚，一溜烟飞上了天。\n\n我抱着那个有分量的木箱子，闻着里面苹果干的甜味，又看了看那张盖了章的大纸。\n\n好像，以后真的没有大人会拿着扫帚，黑着脸来赶我们了呢。"
KNM.64.a:0 "“谢谢灵梦，谢谢魔理沙！”"

KNM.65.t:0 "树底下多了个秋千"
KNM.65.d:0 "莉莉白最近成天板着张小脸，在木箱子上站得笔挺，学着大人的样子训话，看着就叫人替她累得慌。我和斯塔她们才不操那份心呢。\n\n我拍着翅膀在边界的那棵橡树附近晃，大老远就闻到一股甜味。\n\n悄悄飞过去一瞧，哨卡旁边原本光秃秃的空地上，不知道什么时候多了个木头架子。架子用麻绳吊着一块厚木板，风一吹就来回晃。\n\n“是秋千！”\n\n斯塔和露娜一溜烟从树丛里钻出来，连翅膀都顾不上拍，一屁股坐上去，揪着绳子荡得高高的。\n\n橡树底下还支着两条很长的小板凳。凳子旁边的木桩上放着个陶瓦罐，旁边整整齐齐地码着一圈木碗，里面装满了好喝的果汁。旁边的竹筐里还搁着几块刚烤好的饼干。\n\n大家可不客气，一个人捧着一个木碗，蹲在板凳上咕嘟咕嘟地喝。\n\n守在关卡那里的两个高个子士兵就坐在不远处。他们手里拿着擦枪的油布，眼皮都不抬一下，好像根本没看见我们在偷喝他们的果汁。\n\n“桑尼，外面那些铁车今天又在挖泥坑了，吵得我睡觉都得捂着耳朵。”斯塔一边嚼着饼干，一边冲我小声嘟囔。\n“对啊，还有好多喷火的管子，不知道要搬到哪里去。”露娜也凑过来接话。\n大家就这么围着瓦罐，七嘴八舌地嚷嚷着。\n\n那两个高个子士兵手里的动作慢了一些。其中一个人还从兜里掏出了个小本子，拿着铅笔在上面飞快地写着什么。\n\n他们大人的游戏可真奇怪，连擦枪都要在纸上写字。\n不管啦，秋千真好玩。明天的果汁要是还能有这么多，我就去把莉莉白也拉过来。她最近总是不爱笑，喝点甜的，说不定心情就能变好啦。"
KNM.65.a:0 "“明天还要来玩！”"

KNM.58.t:0 "别让大家受伤"
KNM.58.d:0 "车间里的风箱呼啦呼啦地响着，烧红的铁水在槽里翻滚，散发着刺鼻的焦铁味。\n一个绿皮肤的地精大叔正咬着牙，把一块烧红的铁块按在铁砧上。大锤落下来的时候，火星像小雨点一样飞溅。突然，他发出了一声闷哼，粗壮的大手指被飞溅的火星烫到，瞬间冒出了一小股白烟，皮肉烧焦的味道在空气里散开。\n他却只是把手指含进嘴里吮了吮，红着眼，继续用力敲打着那块盾牌。\n我站在旁边捧着甜点，在大火和汗水跟前，手里忽然有些发轻。原来地精大叔们每天都在忍受这样的疼痛，他们是在用自己的皮肉和骨头，在为大家制造挡子弹的铁家伙。这根本不是什么好玩的“敲铁游戏”。\n我走过去，拧干了凉丝丝的湿手帕，敷在他那根肿起来的大手指上。\n“对不起，大叔。我不知道这里这么疼。”我小声说。\n地精大叔看着我，有些局促地想把手缩回去，最后还是顺从地让我敷着。他粗声粗气地说：“铁器生来就是硬的，不烫就做不出好盾。妖精姑娘，别在这里待着了，这里到处都是灰，会弄脏你的白裙子。”\n我没有半点离开的意思，坐在满是灰尘的工具箱上，帮他一下下地吹着红肿的手指。我决定了，以后每天都要送新鲜的草药膏过来，大铁锤要落下来，但伤口也必须治好。"
KNM.58.a:0 "“大铁锤，原来这么沉啊。”"

KNM.59.t:0 "有些脏东西是洗不掉的"
KNM.59.d:0 "门窗关得很紧，屋里的柴火跳着火星，散发着干草的香气。\n\n我靠着干爽的草堆，想要像以前那样飞上房顶大声大喊。可刚一张开双臂，背后的翅膀上就抖落了一小片黑灰。擦不掉，也拍不掉。\n\n我跑到水井边，一桶接一桶地往翅膀上浇着冷水。\n刺骨的井水把小手搓得又红又痛，可羽毛上的黑色斑痕依然紧紧粘在上面，像是一块块抹不掉的补丁。水流顺着羽翼尖滴答滴答地落回了井里，在空荡荡的井底发出一声声回响。\n\n“莉莉，别洗啦，再揉翅膀都要被你揉秃了哦。”\n大酱以前……好像真的这样笑着用手摸着我的头，说过这种话呢。可是现在，只要我一闭上眼睛，满脑子就全都是那些黑压压的烟囱，还有天空中像大雪一样落下来的焦炭与碎屑。\n\n明明坏人已经被打跑了呀。明明烟囱已经倒下去了呀。可身上的灰，为什么还是洗不干净呢。"
KNM.59.a:0 "“翅膀……变得好重好重了呢。”"

KNM_corrupted_by_spring_spirit:0 "§R春风消磨了我们的意志§!"
KNM_corrupted_by_spring_spirit_desc:0 "春风正在让我们的兵工厂齿轮生锈，前线的士兵居然在战壕里抱着花朵哭泣，甚至连劳工们都开始抗议、吵着要睡觉！如果不消灭这股风的源头，我们的纪律和荣光将彻底灰飞烟灭。"

KNM_blessed_by_spring_spirit:0 "§9春天已然到来§!"
KNM_blessed_by_spring_spirit_desc:0 "风突然变得暖洋洋的。冰雪融化成了清澈的溪流，土地里钻出了青草。工厂里的工人和地里的农夫觉得身上的疲惫在一瞬间消失了。窗外开出了金灿灿的小花，空气里全是甜茶和新泥的清香。大家觉得日子变得舒服多了，干活也更有了力气。"

KNM_spring.1.t:0 "风里有了一点点温度"
KNM_spring.1.d:0 "呼——风吹过来的时候，脸颊突然一点都不疼了呢！\n\n明明周围都还是白白的大雪，树枝上也光秃秃的，可吹过来的风摸起来软软的，闻起来还有一点点湿泥巴的香味。\n\n地底下的小草一定已经醒过来、正悄悄踩着泥巴往上钻了吧！莉莉白在雪堆里高高兴兴地跳了好几下，小翅膀挥舞起来拍得可快了。虽然我们还找不到小小的绿叶，可身上早就舒服舒服的啦。\n\n快点呀，快点呀！好想立刻飞去最高最高的树枝上，用大大的嗓门大喊春天来啦！"
KNM_spring.1.a:0 "“听好啦——春天要来啦！”"

KNM_spring.2.t:0 "大家在冷水里拍浪花"
KNM_spring.2.d:0 "扑通！扑通！大家戴着草叶折的小帽子，一个个全跳进湖里啦！\n\n虽然头顶上的天空黑沉沉的、太阳一点都不热，湖水也冰得脚丫麻麻的，可大家一点都不怕！在凉水里互相泼水、大声咯咯笑，这不就是夏天的玩法嘛！只要大家凑在一起玩，心里面就一点都不冷啦！"
KNM_spring.2.a:0 "“夏天也是很温暖的！”"

KNM_spring.3.t:0 "橡子落在干草堆上面"
KNM_spring.3.d:0 "啪嗒！树上掉下来好大一颗橡子，正好砸在了草堆上！\n\n林子里的树叶全都变黄啦，上面虽然沾着擦不掉的灰灰，可看起来还是很亮很亮的。松鼠们正忙着往树洞里塞坚果，大家也提着小竹筐，在树底下捡那些落下来的松果。地精大叔在外面烤着栗子，香喷喷的味道飘得老远了！吸溜……把肚皮吃得圆滚滚的，秋天可真好呀！"
KNM_spring.3.a:0 "“秋天有好多好吃的！”"

KNM_spring.4.t:0 "白雪落在大树的脚下"
KNM_spring.4.d:0 "大雪下起来啦！白白软软的雪花落下来，把地上脏兮兮的灰全给盖住啦。\n\n莉莉白裹着厚厚的草毯子，缩在小屋子角落里看着雪。外面风刮得呼呼响，可大家都知道，这是地底下的泥巴要准备睡个大觉呢。等在雪被子里睡饱了，明年春天醒过来的时候，大家就又有用不完的力气啦！闭上眼睛，做个香甜的好梦吧。"
KNM_spring.4.a:0 "“大家在被窝里睡个好觉吧。”"

KNM_spring.5.t:0 "风里全是花香的味道"
KNM_spring.5.d:0 "大雾全不见啦！天空变成了好亮好亮的蓝颜色！\n\n暖洋洋的风吹过草地，冰雪一下子全变成了哗啦啦的小溪流。莉莉白拉着裙角在花丛里飞快地跑，扯着特别大的嗓门大喊春天来啦！大酱和琪露诺大人也在旁边飞来飞去，把粉红色的花瓣捧在手里撒得到处都是。泥土又软又甜，这才是大家盼了好久好久的、真正的春天呀！"
KNM_spring.5.a:0 "“春天真的来啦！”"

KNM_spring.6.t:0 "树荫底下有冰冰的甜水"
KNM_spring.6.d:0 "大太阳高高挂在天上面，把湖水照得亮亮的！\n\n大家戴着用大荷叶叠的小帽子，在水里踩着水花扑腾扑腾直跳。琪露诺大人游在最前面，把刚刚冻好的小甜冰一块块分给大家吃。东边那些难闻的黑烟全都跑掉啦，蓝天干干净净的。没有坏人打架，也没有冷冰冰的风，大家在水里玩得可开心啦！"
KNM_spring.6.a:0 "“夏天也太好玩啦！”"

KNM_spring.7.t:0 "这里的树叶是金色的"
KNM_spring.7.d:0 "林子里的树叶全变成金黄金黄的啦，一点脏灰都没有！\n\n小松鼠在树枝上跳来跳去，大家提着大竹筐，在干爽的树叶堆里抠松果和饱满的橡子。地精大叔们终于架起一大锅的栗子烤起来啦，还有甜甜的大南瓜，香得大家口水都要流出来啦。秋天带着满满好吃的走过来啦，这下大家顿顿都能吃得饱饱的呢！"
KNM_spring.7.a:0 "“秋天有吃不完的栗子呢。”"

KNM_spring.8.t:0 "雪花落在了屋顶上"
KNM_spring.8.d:0 "下雪啦！天上传下来的全都是干干净净、洁洁白白的白雪花，把整片大地都装得像是个大蛋糕一样。\n\n莉莉白和大家挤在温暖的草棚里，一口咬下甜呼呼的南瓜布丁，再喝上一大口热茶，从肚皮一路暖到了翅膀尖。就算外面很冷，可大家的心里都热热的。小草正盖着雪被子做美梦呢，等明年春天醒过来，一定会更好看！"
KNM_spring.8.a:0 "“晚安，好冬天。”"
####新闻####
KNM_news_event_background: "£KNM_news"
KNM_news.1.t:0 "$news_event_background$第二次伟大战争"
KNM_news.1.d:0 "谁也没有想到，最先跨过边界的，居然是一个个连枪都拿不稳的小妖精们。那个只会在树梢上欢呼“春天到啦”的春之妖精，独自飞向了那些吐着黑烟的巨大要塞。\n\n面对那个连神明都会为之战栗的冷酷帝国，她的背影小得就像是一片随时会被狂风撕碎的落叶。消息传开的时候，有人叹息，有人摇头，甚至已经有人在窗前擦着眼泪，写下了挽歌的开头。\n\n大家都知道，那是一趟再也回不来的旅程。\n\n可她还是飞过去了。\n\n当第一片沾满余烬的翅膀跌落在冰冷的铁轨上时，整片喧嚣的大陆，在一瞬间彻底安静了下来。\n\n大家能在草地上肆意欢笑、无忧无虑打滚的日常……就这么走到了尽头。\n\n阴沉的天空中，下起了黑色的雪。"
KNM_news.1.a:0 "……春天真的还会回来吗？"

KNM_news.2.t:0 "$news_event_background$春风吹到了世界的尽头"
KNM_news.2.d:0 "一缕和煦的暖风越过了大结界的边缘，吹散了遮蔽天空的黑色煤烟。废铁与焦土之中，嫩绿的藤蔓和漫山遍野的小花开始疯狂生长，将那些死气沉沉的装甲车与钢筋水泥无声地包裹了起来。工厂里疲惫的工人们推开布满锈迹的窗户，阳光倾洒在了他们沾满灰尘的脸上，暖得让人想哭。\n\n那个飞在天上、拍着翅膀大声喊春天来了的小家伙，终于收起她的翅膀，落在了一朵刚开的花旁边。她把脸埋进花瓣里沉沉地睡了过去。整个世界都安静下来了，连风都放慢了脚步。\n\n大结界外的广袤废土被盎然的绿意吞没了。那些在烟尘和大雪里冻得发抖的人，那些已经很久没有抬起过头的人，都在这片暖洋洋的阳光里闭上了眼睛。这一觉，应该能做一个好梦吧。"
KNM_news.2.a:0 "外面也变得暖和起来了"

#超事件
#第二次伟大战争（莉莉白）

#结算事件
KNM_end_title:0 "§9看呀，那是春天的歌声§!"
KNM_end_tip:0 "博丽神社的台阶两旁，樱花树开得层层叠叠。\n莉莉白拍打着小小的翅膀，对着整个山谷大声喊出心里最骄傲的那句话：\n§9“春天来啦！春天来啦！”§!\n\n§4“等一下！本小姐才是第一个发现春天的人！”§!琪露诺大呼小叫地在后面追着，手里握着的冰屑在阳光下化成了水滴。\n§7“琪露诺酱，跑慢点，要追不上了。”§!大妖精怀里抱着刚摘下的樱桃，也在后面挥舞着翅膀跟着笨蛋妖精们的队伍。\n走廊下，灵梦正捧着茶碗，热茶升腾的白雾熏得让人眼睛疼。她看着那群把花瓣落了自己一头的小家伙，无奈地拍了拍衣角，嘴角却不自觉地扬了起来。\n漫山遍野回荡着风吹树叶的沙沙声，还有大家清脆的嬉笑打闹的声音。\n大结界外的那些战争，此时都远得像是一场很久以前的噩梦。莉莉白曾独自在风雪中哭泣，以为再也见不到那些熟悉的笑脸。可现在，一切回到了最初的模样。她还是那个整天乐呵呵的春之妖精，迎着温暖的太阳，把花开的消息带给每一个人。"
KNM_end_tip_2:0 "感谢您对钢铁萌心与雾之湖内容的喜爱与支持！\n是您的陪伴与选择，最终为这些娇小的妖精带回了漫山遍野的花开。"
KNM_end_close_button:0 "§9春——天——来——啦！§!"
KNM_end_close_button_TT:0 "§L大酱、琪露诺大人，还有大家……\n我们一起，把春天带回来了哦。§!"
KNM_cfcdsjjt_fascist_target_tt:0 "\n§R警告！！！！！！！！！！！！！！！！！！§!\n§L§9春天的宣告§!激怒了世界上所有的§8法西斯政权§!与§W封建势力§!！\n它们无法容忍春风动摇军心，已立刻获得对我们的§R【征服】§!战争目标！§!"
