KNM_li_xj_dec:0 "给坏人们准备一个泥巴坑"
KNM_wqcgn_dec:0 "给朋友们布置大雾"
KNM_li_xj_showorhide:0 "把泥巴坑悄悄藏起来/找出来"
KNM_KNM_mcxmhtg_tt:0 "§Y$FRA_KNM_buy$§!：每次和幻想乡交换宝贝，大家都能额外留下一个新来的小妖精帮手（获得§Y民用工厂§!）"
KNM_industrial_migration:0 "大铁房子搬家啦"
KNM_industrial_migration_desc:0 "那些烟囱越来越近了，这里已经变得不安全。地精大叔们说，那些卡车和铁管子要是继续留在边界，保准会被坏人抢去，或者用炮弹炸得稀巴烂。大家得一起动起来，帮地精大叔拆掉锅炉，用厚木板箱子把所有机器都装好，往大后方运。大房子虽然在地图上找不着了，可如果机器还在，在深林里搭个“隐形”工坊也一样能造防身的玩具。小妖精和幻想乡的大家会帮我们一起迁移工厂，作为回报，我们将把当地工厂的15%赠送给他们。"

KNM_industrial_migration_desc_effect_tt:0 "该地区的所有§Y军用工厂§!、§Y民用工厂§!或§Y船厂§!将会被拆除，并转化为无法被敌军占领或轰炸的§Y地图外工厂§!。"
FRA_KNM_buy:0 "大南瓜交换协议"
FRA_KNM_buy_desc:0 "草地上长出来的南瓜比马车还要高，瓜肉也甜得像糖蜜。神社的大家和河童们总是觉得这些美味特别稀奇。大家不会去车间里敲打红铁，那正好把这些沉甸甸的大南瓜装满大竹筐，送去隔壁神社。喷火的铁筒、跑得飞快的卡车，还有铁皮大箱子，全能换回来。大家开开心心地种地，防身用的玩具就多得数不过来啦。"
KNM_better_buy:0 "地里的南瓜太多啦"
KNM_better_buy_desc:0 "我蹲在田埂上数了半天，手指头掰过来掰过去，还是没数明白。反正就是好多，好多个大南瓜。\n\n大人说，反正大家也吃不完，不如整筐整筐搬上卡车，送去神社那边。灵梦看到了，总会拿些东西来换的。上次搬了三筐南瓜过去，就换回来一捆擦得亮亮的铲子，还有好几箱玩具。\n\n地精大叔在旁边点了点头，又补了一句：莉莉白前几天也说了，花田边上那几垄麦子也快收了，到时候也能一道送过去。\n\n这样一来，地里长出多少好吃的，就换回来多少好用的东西。可以自己挑时候去换，要是嫌麻烦，也可以跟神社那边讲好，让大家每次收了庄稼就顺手把东西送过来。"
KNM_better_buy_tt2:0 "§Y关闭自动化§!：可以等到想换购买的装备的时候再手动点决议。"
KNM_better_buy_tt:0 "§Y开启自动化§!：每次攒够一车庄稼，神社那边就会按约定把东西送过来，不用大家再跑一趟。"
 KNM_spring_market_tt:0 "§9小妖精们将会举办§Y春日集市§!来为整个幻想乡获得增益！§!"
 KNM_spring_market:0 "春日集市"
 KNM_spring_market_mission:0 "春日集市"
 KNM_spring_market_desc:0 "湖边的空地上，现在可热闹了。泥土里的南瓜收成很好，地精大叔们将大卡车开得呼呼直响，林子里新来的小家伙们也排着队挤了过来。大家决定在湖畔办一个高高兴兴的大集市。\n地精大叔们搬出新鲜的浆果分给巡逻的队伍，河童们用刚出炉的零件换来甜水。南瓜长得好，换来的玩具就多；神社的炉子烧得旺，分到的小饼干就更香。大家在和煦的阳光下跑来跑去，大呼小叫地抢着红豆团子。春风吹过平原，每个人的心，好像都被温暖的空气悄悄拉在了一起。"

 KNM_spring_market_effect_tt:0 "根据幻想乡的三方规模，春日集市提供以下持续§Y120天§!的互惠增益：\n一、§Y雾之湖§!的每个民用工厂（当前：§G[?num_of_civilian_factories|Y0]§!个）：为§Y幻想乡§!和§Y小妖精联军§!提供地区最大工厂数：§G+0.1%§!，军用工厂建筑速度：§G+0.05%§!，且每月人口：§G+0.1%§!。\n二、§Y幻想乡§!的每个军用工厂（当前：§G[?FRA.num_of_military_factories|Y0]§!个）：为§Y雾之湖§!和§Y小妖精联军§!提供每周人力：§G+10%§!，稳定度和每日指挥点数增长乘数：§G+0.05%§!。\n三、§Y小妖精联军§!的每个陆军师（当前：§G[?KFL.num_divisions]§!个）：\n为§Y幻想乡§!和§Y雾之湖§!提供陆军师损耗：§G-0.1%§!，补给范围：§G+0.1%§!，且工厂能源消耗：§G-0.1%§!。"

 KNM_spring_market_cooldown:0 "大集市刚刚结束，大家还在收拾摊子呢。§Y40天§!后才能再次举办。"

 KNM_spring_market_synergy_spirit:0 "§9春日集市·阳光照耀雾之湖§!"
 KNM_spring_market_synergy_spirit_desc:0 "湖边的大集市热闹非凡。每一座民用工厂都在为春天的联盟贡献力量，政治活力与建设热情正随着集市的歌声一同高涨。"

 KNM_spring_market_synergy_spirit2:0 "§9春日集市·妖精赠礼§!"
 KNM_spring_market_synergy_spirit2_desc:0 "军工厂的炉火在集市的欢声笑语中燃烧得更旺了，河童们的图纸也随着一筐筐南瓜流通到了整片雾之湖。"

 KNM_spring_market_synergy_spirit3:0 "§9春日集市·小妖精口粮§!"
 KNM_spring_market_synergy_spirit3_desc:0 "甜甜的饼干让小妖精们精力充沛，一碗碗温水下肚，队伍的步伐也变得更加整齐有力了。"


