KNM_buy.1.t:0 "想要哪些会喷火的铁筒？"
KNM_buy.1.d:0 "这些长长的大铁筒能从老远的地方将大土块（炮弹）射出去，落地时的巨响震耳欲聋，气浪能将坏人们的靴子都炸飞。有了它们，地精大叔们就不用拿着木棒冲在最前面和人硬碰硬了。大卡车正载着大家的一竹筐一竹筐金灿灿的麦子，一车车送去神社。哪一种铁筒子更适合用来保护幻想乡呢？"
KNM_buy.1.a:0 "要那种能打好远的普通铁筒"
KNM_buy.1.a_tt:0 "神社那边会送来§Y200§!门§Y牵引式火炮§!"
KNM_buy.1.b:0 "要那种能对准天上的防空铁筒"
KNM_buy.1.b_tt:0 "神社那边会送来§Y200§!门§Y牵引式防空炮§!"
KNM_buy.1.c:0 "要那种能砸碎硬铁板的反坦克铁筒"
KNM_buy.1.c_tt:0 "神社那边会送来§Y200§!门§Y牵引式反坦克炮§!"

KNM_buy.2.t:0 "挑选跑得飞快的车子"
KNM_buy.2.d:0 "前线需要运送好吃的坚果和松饼，可大青蛙们拉车太累了。地精大叔们瞧中了那些不用青蛙拉、自己就会跑的大铁车。这些家伙的车轮转得飞快，跑起来呼噜呼噜直响，活像一只只铁皮小怪兽。哪一种会跑的铁皮怪兽更适合帮大家运东西呢？"
KNM_buy.2.a:0 "要那种跑得快快的轻型车子"
KNM_buy.2.a_tt:0 "神社那边会送来§Y200§!辆§Y摩托化载具§!"
KNM_buy.2.b:0 "要那种穿着铁衣的重型车子"
KNM_buy.2.b_tt:0 "神社那边会送来§Y100§!辆§Y机械化载具§!"

KNM_buy.3.t:0 "看看哪种大箱子比较好"
KNM_buy.3.d:0 "幻想乡里造出了好多长着履带、像大乌龟一样硬的铁皮箱子。听说那些巨大的铁轮子可以帮大家挡住飞来的子弹。虽然这些大家伙动起来的时候声音很响，还会冒黑烟，但能保护大家不受伤害，就是很管用的盾牌。作为交换，大卡车正拉着大家刚收上来的南瓜，一车车送去神社。地精大叔们已经钻进车里准备踩油门了，选哪一种大箱子来保护大家呢？（需要先进行设计才能正常购买）"
KNM_buy.3.a:0 "要那种跑得快的小铁箱子"
KNM_buy.3.a_tt:0 "神社那边会送来§Y80§!辆§Y轻型坦克§!"
KNM_buy.3.b:0 "要那种不大不小的铁箱子"
KNM_buy.3.b_tt:0 "神社那边会送来§Y65§!辆§Y中型坦克§!"
KNM_buy.3.c:0 "要那种又重又硬的铁箱子"
KNM_buy.3.c_tt:0 "神社那边会送来§Y40§!辆§Y重型坦克§!"

KNM_buy.4.t:0 "要选哪些能飞的铁鸟呢？"
KNM_buy.4.d:0 "幻想乡送来的铁翅膀大鸟实在太重，里面塞满了不听话的钢疙瘩，飞起来的声音吵得要命。要是没有地精大叔在前面开，妖精们可坐不习惯。得先想想，哪种大鸟更适合在天上陪着大家一起扔松果？\n（需要先进行设计才能正常购买）"
KNM_buy.4.a:0 "要那种飞得快、能在天上打架的铁鸟"
KNM_buy.4.a_tt:0 "神社那边会送来§Y80§!架§Y战斗机§!"
KNM_buy.4.b:0 "要那种能飞得很低、帮地上扔松果（炸弹）的铁鸟"
KNM_buy.4.b_tt:0 "神社那边会送来§Y60§!架§Y近距支援机§!"
#扩大
KNM_buy.5.t:0 "想要哪些会喷火的铁筒？"
KNM_buy.5.d:0 "这些长长的、沉甸甸的铁筒子可以从大老远的地方把大土块（炮弹）打出去，落在地上会发出巨响，把坏人们的靴子都炸飞。有了这些东西，地精大叔们就不用拿着木棒冲到前面和坏人硬碰硬了。大卡车正把我们大竹筐里金灿灿的麦子一车车送去神社作为交换。我们要选哪一种铁筒子来保护幻想乡呢？"
KNM_buy.5.a:0 "要那种能打好远的普通铁筒"
KNM_buy.5.a_tt:0 "神社那边会送来§Y800§!门§Y牵引式火炮§!"
KNM_buy.5.b:0 "要那种能对准天上的防空铁筒"
KNM_buy.5.b_tt:0 "神社那边会送来§Y800§!门§Y牵引式防空炮§!"
KNM_buy.5.c:0 "要那种能砸碎硬铁板的反坦克铁筒"
KNM_buy.5.c_tt:0 "神社那边会送来§Y800§!门§Y牵引式反坦克炮§!"

KNM_buy.6.t:0 "挑选跑得飞快的车子"
KNM_buy.6.d:0 "为了把好吃的坚果和松饼运到更远的前线，地精大叔们需要一些不用大青蛙拉、自己就会跑的大铁车子。这些车子的铁轮子转得可快了，跑起来的时候还会发出呼噜呼噜的声音，像是一只只跑得飞快的铁皮小怪兽。我们要选哪一种会跑的铁皮怪兽来帮大家运东西呢？"
KNM_buy.6.a:0 "要那种跑得快快的轻型车子"
KNM_buy.6.a_tt:0 "神社那边会送来§Y800§!辆§Y摩托化载具§!"
KNM_buy.6.b:0 "要那种穿着铁衣的重型车子"
KNM_buy.6.b_tt:0 "神社那边会送来§Y400§!辆§Y机械化载具§!"

KNM_buy.7.t:0 "看看哪种大箱子比较好"
KNM_buy.7.d:0 "幻想乡里做出了好多长着履带、像大乌龟一样硬的铁皮箱子。灵梦说，那些巨大的铁轮子可以帮我们挡住可怕的子弹。虽然这些冷冰冰的大家伙动起来的时候声音吵吵的，还会冒起难闻的黑烟，但只要能保护大家不受伤害，就是最好的盾牌。作为交换，大卡车正把我们刚收上来的南瓜一车车送去神社。地精大叔们已经钻进车里准备踩油门了，我们要选哪一种大箱子来保护大家呢？（我们需要先进行设计才能正常购买）"
KNM_buy.7.a:0 "要那种跑得快的小铁箱子"
KNM_buy.7.a_tt:0 "神社那边会送来§Y400§!辆§Y轻型坦克§!"
KNM_buy.7.b:0 "要那种不大不小的中型铁箱子"
KNM_buy.7.b_tt:0 "神社那边会送来§Y300§!辆§Y中型坦克§!"
KNM_buy.7.c:0 "要那种又重又硬的巨型铁箱子"
KNM_buy.7.c_tt:0 "神社那边会送来§Y200§!辆§Y重型坦克§!"

KNM_buy.8.t:0 "要选哪些能飞的铁鸟呢？"
KNM_buy.8.d:0 "幻想乡送来的铁翅膀大鸟太重了，里面全是不听话的齿轮，飞起来的时候声音还特别吵。要是没有地精大叔们在前面开，妖精们可坐不习惯。得先想想，大家需要哪种大鸟在天上陪着一起扔松果。\n（我们需要先进行设计才能正常购买）"
KNM_buy.8.a:0 "要那种飞得快、能在天上打架的铁鸟"
KNM_buy.8.a_tt:0 "神社那边会送来§Y400§!架§Y战斗机§!"
KNM_buy.8.b:0 "要那种能飞得很低、帮地上扔松果（炸弹）的铁鸟"
KNM_buy.8.b_tt:0 "神社那边会送来§Y300§!架§Y近距支援机§!"

KNM_buy_artillery_tt:0 "\n大家将在订购200门§Y普通铁筒§!、§Y防空铁筒§!或者§Y反坦克铁筒§!之中作出选择。\n"
KNM_buy_vehicles_tt:0 "\n根据地精们的研究进展，大家可能会选择订购200辆§Y跑得快的小轻车§!或100辆§Y穿铁衣的重车§!。\n"
KNM_buy_armor_tt:0 "\n大家将在订购80辆§Y小铁箱子§!、65辆§Y不大不小的铁箱子§!或者40辆§Y巨型铁箱子§!之中作出选择。\n"
KNM_buy_aircraft_tt:0 "\n大家将在订购80架§Y上天打架的铁鸟§!或者60架§Y低空扔炸弹的铁鸟§!之中作出选择。\n"
#扩大
KNM_buy_artillery1_tt:0 "\n大家将在订购800门§Y普通铁筒§!、§Y防空铁筒§!或者§Y反坦克铁筒§!之中作出选择。\n"
KNM_buy_vehicles1_tt:0 "\n根据地精们的研究进展，大家可能会选择订购800辆§Y跑得快的小轻车§!或400辆§Y穿铁衣的重车§!。\n"
KNM_buy_armor1_tt:0 "\n大家将在订购400辆§Y小铁箱子§!、300辆§Y不大不小的铁箱子§!或者200辆§Y巨型铁箱子§!之中作出选择。\n"
KNM_buy_aircraft1_tt:0 "\n大家将在订购400架§Y上天打架的铁鸟§!或者300架§Y低空扔炸弹的铁鸟§!之中作出选择。\n"

FRA_KNM_buy_technology:0 "向幻想乡讨教好玩的点子"
FRA_KNM_buy_technology_desc:0 "幻想乡的大家脑子里总有数不清的聪明办法。送去竹筐里满满的南瓜和野果，换来她们在小纸片上写下的一些奇妙设计。这些点子能够帮地精大叔和大家把防身的玩具造得更快、更好看。反正大卡车闲着也是闲着，多拉几趟南瓜过去，那些聪明的脑袋就会很乐意和大家分享秘密。"
KNM_buy_technology_flag:0 "正在向幻想乡的大家讨教新点子呢"
KNM_buy_tec_tt:0 "大卡车正载着大家的南瓜和团子，运去神社换来一个§Y随机研究加成卡§!。"

FRA_KNM_military_exercise:0 "和大家在草地上玩演习游戏"
FRA_KNM_military_exercise_desc:0 "东边那些坏人要是冲过来，大家可不能慌了手脚。跟神社、还有森林里的朋友们一起进行联合演习。大家互相扮演对手，用泥巴和水枪模拟打仗。在打闹中，地精们能学会怎么把队伍排得更好，妖精们也能飞得更加整齐。多玩几次这样的游戏，大家就什么都不怕了。"
KNM_military_exercise_flag:0 "大家正和盟友在草地上玩打仗游戏呢"
KNM_exercise_tt:0 "大家正在和幻想乡进行联合演习，双方将获得§Y陆、海、空军经验§!。"

FRA_KNM_mas:0 "我们要开始钻研绝招了"
FRA_KNM_mas_desc:0 "地精大叔们虽然力气大，但如果只是闭着眼睛挥舞木棒，还是很容易吃亏的。大叔们决定利用空闲时间，和幻想乡的教官们一起坐在篝火旁，研究各种厉害的排兵布阵方法。大叔们越聊越兴奋，甚至在木板上画满了奇奇怪怪的阵线。这些绝招能使大家在地面上的防守变得像大石块一样稳固。"
KNM_mas_flag:0 "地精大叔们正在篝火旁研究绝招呢"
KNM_mas_tt:0 "地精们和盟友将获得长达一年的§Y陆军学说每日精通点数加成§!。"


KFL_xyj:0 "雨之妖精"
KNM_spring_ally.1.t:0 "森林里走出来了新朋友"
KNM_spring_ally.1.d:0 "莉莉白将消息带进了茂密林子深处。那些平时连打雷都会吓得躲在苔藓和树洞下面、偷偷看热闹的小妖精，这一次，居然一个接一个地飞了出来。她们个子小小的，翅膀跟刚发芽的嫩叶一样绿。由于常年不见阳光，她们的脸色有些苍白，身体也在微微发抖，两只小手用力抓着粗糙的木棒。\n领头的那个小家伙吸了吸鼻子，伸手拍了拍莉莉白的手，声音虽然在发颤，却特别清楚：“烟囱已经把树叶都熏黑了，谁让她们抢走大家的春天呢。虽然我们很小，但这一次，我们也要跟着大家一起让春天回来！”"
KNM_spring_ally.1.a:0 "欢迎加入！春天是大家的！"

KNM_spring_ally.2.t:0 "小妖精们不想要国界线"
KNM_spring_ally.2.d:0 "战场终于安静了。小妖精们依然列队站在那片用翅膀守护过的土地上。那里曾经是敌人的钢铁要塞，现在长出了新的草芽。不过，天天盯着那些用石头堆出来的边界线实在太让人头疼了，大家已经在商量要怎么把两边的林子拼在一起。"
KNM_spring_ally.2.a:0 "干脆把两边的草地拼在一起吧"
KNM_spring_ally.2.b:0 "让她们自由地飞去任何地方"

KNM_spring_ally.3.t:0 "大家都是一家人了"
KNM_spring_ally.3.d:0 "新土地上，从前是废墟的地方已经开满了红的小花、黄的小花。小妖精们的家已经和雾之湖合在了一起。因为数边界线太麻烦，大家决定拆掉所有的篱笆，以后就在同一个大林子里睡觉。莉莉白站在新开垦的泥土上，能感觉到脚底下有细细的暖意往上钻——这些土地记住了她们的名字。"
KNM_spring_ally.3.a:0 "这里的花，以后也是我们的花！"

KNM.2002.t:0 "灵梦的“警告”"
KNM.2002.d:0 "博丽神社的御札把一张信纸钉在了树干上。上面的字迹潦草又狂硬：\n\n“雾之湖的那群笨蛋们：\n\n听好了，别让我说第二遍。\n\n我们今天早上和一群自称“第三国际”的人谈了一会，说要拉我们一起管管这片大陆。我看过他们的条件了，不收我们的香油钱，还能保证大家地里的庄稼不被抢走，谁来砸场子就帮我们一起打回去。\n\n我替你们应下了。\n\n（划掉的墨迹：反正给你们看公文也是白搭）\n\n省得哪天你们又在哪片水坑里被战车碾烂了，还要跑来博丽神社哭天喊地。那群人脑子虽然死板，但至少讲道理。跟着他们，你们那些破屋子和多得要死的花花草草算是有了个靠山。\n\n想继续不带脑子得玩下去的话，就在这张纸上按个手印。不按也行，下个月要是有人开着坦克来碾你们，别指望我免费跑出来替你们打异变了。\n\n——博丽灵梦\n\n对了：把你们上次塞进我赛钱箱里的冰块全给我弄干净，再敢拿冰块当硬币扔进来，我就把你们的屋子全拆去卖了。"
KNM.2002.a:0 "“听灵梦的！大家快去按手印！”"
KNM.2002.b:0 "“灵梦又在吓唬我们啦，才不去呢！”"

KNM_spring_alliance:0 "我们永远在一起"
KNM_spring_alliance_desc:0 "林子深处藏着好多身体小小的妖精。她们平日里胆子特别小，可现在，她们也想和大家一起去寻找春天。我们在前面手拉着手带路，等冬天的黑烟散了，我们就都能在同一个林子里盖起全新的家园。"

KNM_zhaoji_chunling_lianmeng:0 "叫上新朋友"
KNM_zhaoji_chunling_lianmeng_desc:0 "林子深处住着好多愿意一起玩闹的小伙伴。如果大家还守在树林边境，就能邀请她们组成一支庞大队伍。她们虽然个子小，但对地上的路熟得很，而且——等打架结束，带她们去过的草地，以后就都是大家的啦。§Y小妖精盟友可在任意战争中召集，合并后重置冷却，30天后可再次邀请。§!"

KNM_zhanling_zhuanyi_KFL:0 "给小家伙们指路"
KNM_zhanling_zhuanyi_KFL_desc:0 "小家伙们正在大雾里欢快地奔跑呢。直接将大家占领的土地交给她们，她们的林子就会变得越来越大。等打架结束，这些涂上了小花印记的草地，以后全都会变成我们的领地。"

KNM_KFL_created:0 "新朋友们已经到齐啦"
KNM_jiesuan_KFL:0 "大家一起手牵手"
KNM_jiesuan_KFL_desc:0 "打架已经结束啦。现在到了大家坐在一起吃栗子的时候。和这些新朋友抱在一起，她们之前占领的所有草地和林子，以后就全都是我们的新家园了。"

KNM_kfl_transfer_done_tt:0 "该州已移交小妖精联军管辖，战后合并时将成为§Y雾之湖§!宣称"
KNM_kfl_zhiyuan_tt:0 "§Y@KFL小妖精联军§!也能使用§Y大南瓜交换协议§!了！"

KNM_xsybcdyp:0 "小树叶编成大雨披"
KNM_xsybcdyp_desc:0 "那些刚从深林里跑出来的小雨妖精浑身都湿漉漉的，冷得直打哆嗦。大家去采摘大荷叶和橡树叶，用细藤蔓穿起来，给她们编织成防雨的小外衣。穿着这些软和的绿叶披风，就算在刺骨的雨雪里飞，翅膀也不会被淋湿了。大家也能暖烘烘地继续飞翔。"

KNM_xjxmb:0 "削尖小木棒"
KNM_xjxmb_desc:0 "地精大叔们可以用铁炉造大刀，但这些身体娇小的新朋友只能拿动小木棍。大家坐在篝火旁，用锋利的小石片将松树枝和桦树枝的尖端削得尖尖的。这些木棒虽然扎不透大坦克，但能戳坏敌人的履带和通风口，给那些冷冰冰的机械捣乱。"

KNM_mqbdjch:0 "麻雀快来帮大家传话吧"
KNM_mqbdjch_desc:0 "战场上的黑烟太重了，小家伙们飞进去很容易迷路。那些住在森林里的麻雀和松鼠能充当我们的联络官。两声鸟鸣代表集合，三声松鼠叫代表躲进草丛。这样一来，大家就能像一大片彩色的云彩一样，整整齐齐地在雾气里飞舞。"

KNM_dgat:0 "大锅里正熬着松子热汤呢"
KNM_dgat_desc:0 "赶路累了的时候，联军的小家伙们也需要好好休息。在边境的空地上架起几口大铁锅，咕嘟咕嘟地熬着放了松子和甜草的野菜热汤。飞累的小妖精们可以在这里落脚，喝上一大碗，让干瘪的肚子和冷得发硬的翅膀都重新温暖起来。"

KNM_tsdsz:0 "天上掉下了好多小石头"
KNM_tsdsz_desc:0 "小妖精们飞得可快了，敌人的枪口很难瞄准她们。我们给她们的小布包里塞满从捞出来的“小石头”。她们飞到那些坏人的头顶上，就解开布包，将石子像下雨一样洒下去，砸得坏人们只能捂着钢盔缩在壕沟里。"

KNM_lqsbsk:0 "我们拉起手之后，\n就永远不会再松开了"
KNM_lqsbsk_desc:0 "不管是从湖边来的，还是从森林深处走出来的，大家其实都是一样的妖精。既然已经站在一起了，就再也没有什么“你的林子”和“我的湖泊”。两边的队伍彻底合并在一起。大家手拉着手，那股暖和的春风就会变成坚固的屏障。"

KNM_focus1:0 "甜茶与阳光属于所有朋友"
KNM_focus1_desc:0 "在一些遥远的地方，大家会把所有的食物都放在一张桌子上平分，地里干活的人也都是自己的主人。琪露诺大人说，那些红色旗子下的朋友最懂分享了。去和他们见个面，告诉他们，真正的春天也是这样的，阳光对每个人都一样暖和。但是，大家也得互相提防着那些住在灰色城堡、把春天锁起来的坏家伙。如果大家能达成共识，就能一起保护幻想乡的泥土，不让坏家伙的霜冻害了大家的庄稼。"

KNM_focus2:0 "暖风吹拂过所有人的脸庞"
KNM_focus2_desc:0 "幻想乡所有懂得分享的朋友都对我们点头了。那些红色旗子下的林子和农田，现在都和大家拉起了手。她们也同意，绝对不能让那些只知道抢夺和命令的坏首领把寒冬带过来。温暖的风现在变得好粗好壮，一浪一浪地往东边推。那些原本冷清清的红色边境线，现在都像雾之湖一样暖烘烘了。"

KNM_focus3:0 "小草们想一起商量"
KNM_focus3_desc:0 "在另一些地方，大家种什么庄稼、什么时候休息，都是聚在树荫底下一起拍手商量出来的。大家都觉得，这种人人都能说话的地方，最适合小花发芽了。去和这些蓝色旗子下的朋友拉起手，达成一个关于春天的约定。大家要互相守望，提防那些只会挥舞大鞭子、讨厌别人大声说话的冷酷头领。保护好大家的小院子，比什么都重要。"

KNM_focus4:0 "每朵小花都那么五彩缤纷"
KNM_focus4_desc:0 "那些喜欢在树荫底下商量事情的蓝色旗子，现在都和大家手拉着手。漫长的走访结束了，这片大陆上所有向往自由的朋友，都已经站在了春天的阵营里。灵梦也说，这种由大家共同用符纸和誓言筑起来的防御，比任何城墙都要结实。温暖的阳光现在已经洒满了每一个山头，任何想要重新将寒冬带回来的坏头领，都休想踏进大家的小院子一步。"

KNM_li_war:0 "大家都想要春天呀"
KNM_li_war_desc:0 "外面的冷风越来越大了。那些在烟囱下发抖的人类和妖精，一定也一直在盼着太阳重新照下来。\n给那些红色旗子和蓝色旗子的朋友送朵花吧。要是那些懂得分享和商量的好心人愿意和大家拉起手，暖洋洋的春风就能吹到更远的地方，把抢走春天的坏坏冬天彻底打跑！"
KNM_call_to_war_c:0 "给§t[FROM.Getname]§!送一朵花"
KNM_call_to_war_c_tt:0 "解锁决议: §Y给红色旗子送一朵花§!"
KNM_call_to_war_d:0 "给§3[FROM.Getname]§!送一朵花"
