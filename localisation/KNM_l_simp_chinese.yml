KNM_GATHERING_STORM_DESC:0 "打完大仗之后，大结界漏了好长一道风，终年飘着白雾的低地，就变成了一块没人管的水洼。\n\n1936年的春天，自称最强的琪露诺在大家的欢笑声里，大声宣布“雾之湖联盟”成立啦！不过，大家既不认识字，也看不懂地图上的画，在外面的人眼里，这里大概只是一座幼稚的小幼儿园吧。\n\n可是，外面的冰冷，从来不会因为大家笨笨的就停下来。南边是做梦都想去打滚的红魔馆草地，而东边，黑漆漆的烟囱正吐着苦苦的烟，刺骨的冷风吹得结界发出呜呜的响声。\n\n连冬天都熬不过去的小小妖精们，就这么被卷进了风雪里。是跟着琪露诺大人去毫无防备地冒险呢，还是迎着风雪去唤醒那阵能让人暖和起来的春风？\n\n低地的未来，现在就在您的手里了哦。"
####人物####
  KNM_Cirno: "琪露诺"
  KNM_Cirno_desc: "§L雾之湖的雾气总是凉凉的，水面上那些结了冰的叶子，就是琪露诺喜欢的床。有时候，她会大摇大摆地在湖中心睡到太阳下山，让路过的妖怪误以为水底住着厉害的水怪。不过，她的小屋其实只是湖畔一间有些歪斜的冰屋。在这片潮湿的大水洼里，她是所有妖精公认的领袖。她有着一双闪亮的翅膀，和一肚子永远用不完的好胜心。她喜欢把水里的青蛙冻成冰块，再放到水里看着它们慢慢融化。虽然每试三次总会有一只青蛙不幸在水里碎掉，但她依然乐此不疲，管这叫最伟大的结冰修行。她总是觉得自己最厉害，神社举行热闹的祭典时，她也总是最快跑过去，在参道旁摆起一个简陋的刨冰摊。对她来说，能把水冻成冰，再把冰分给大家，就是整个世界最有趣的事情了。§!"
  KNM_Sunny: "桑尼"
  KNM_Lunar: "露娜"
  KNM_Star: "斯塔"
  KNM_Daiyousei: "大妖精"
  KNM_Daiyousei_desc: "§4@KNM雾之湖§!的§7大妖精§!"
  KNM_Daiyousei_desc_1: "§4@KNM雾之湖§!的§7大妖精§!"
  KNM_Daiyousei_Desc:0 "§L在雾之湖畔，总能听见大妖精轻轻呼唤琪露诺的声音。她是一只比普通妖精要稍微大上一些、也稍微懂事一些的小家伙。当其他的妖精都在湖面上乱哄哄地泼水时，她总是静静地跟在那个自称最强的冰之妖精后面，帮她拉着飞快奔跑时快要掉下来的丝带。在那些微风轻抚的漫长午后，她会和琪露诺一起在树林里玩捉迷藏。即使琪露诺每次都躲到很远、甚至连晚饭时间都找不到的地方，她也依然会提着裙角，耐心地在落叶堆里寻找。她就像是雾之湖上温柔掠过的风，每当琪露诺在大声宣告自己的强大时，她就会在一旁弯起眼睛，露出温和而信任的微笑。§!"
  KNM_Sukuna_Shinmyoumaru: "少名针妙丸"
  KNM_Kijin_Seija: "鬼人正邪"
  KNM_qyj: "青妖精"
  KNM_fyj: "粉妖精"
  KNM_my: "梦月"
  KNM_yls: "伊莉斯"
  KNM_hutao: "胡桃"
  KNM_Lilywhite: "莉莉白"
  KNM_Lilywhite_desc:0 "§L谁也不知道莉莉白平时睡在哪里。冬天一到，林子安静下来，她就不见啦。大概是在山脊的某个石头缝里，扒拉了一堆枯叶把自己埋进去了，就这么蜷缩着睡过了一整个冬天。\n\n不过，她对暖和的风可敏感啦！每年春天刚冒头的那几天，第一缕暖风蹭过树梢，松鼠还在打呼噜呢，她就先睁开眼睛啦。从石头缝里钻出来，拍拍裙子上沾着的碎叶子，飞到最高最高的那根树枝上，深吸一口气，然后用清脆的声音大喊：“春天来啦！”\n\n等大家都揉着眼睛从被窝里悄悄张望的时候，她又不知道飞到哪里去玩了。有人说她攒了好多亮晶晶的财宝，可她自己好像根本记不得那些。她只记得今年第一朵花开的味道，那种甜甜的香气，比什么都要宝贝呢。§!"
  KFL_Lilyblack: "莉莉黑"
  KNM_Lilyblack_desc:0 "§L当然，也没人知道莉莉黑是什么时候飞过来的。她穿着一身黑漆漆的裙子，翅膀也像秋天的落叶一样暗暗的。和那个整天在树梢上欢呼、做着暖烘烘美梦的莉莉白不同，她更喜欢在风大、叶落的季节里活动。\n\n当雨雪刮在脸上的时候，她可不会缩在被窝里掉眼泪。大家被灰熏得不知所措时，是她默默地带着大家在林子里找柴火，教大家用树叶编织挡雨的小披风。她总是板着小脸，对莉莉白那些关于春天的甜美故事撇撇嘴。可当风雪真的要压垮大家的家时，她又是第一个冲在前面，用自己那双破破烂烂的翅膀，替大家挡下落下的冰雹。她嘴上说着讨厌春天，心里却比谁都想看到小花在湖边发芽呢。§!"
