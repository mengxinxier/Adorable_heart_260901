KNM_KFL_army:0 "抓紧我的翅膀"
KNM_KFL_army_desc:0 "每一个在风雪里飞舞的小家伙都非常娇小，身子软绵绵的，甚至一阵大风都会让大家落进草丛中。可是，当无数的小翅膀同时拍打，当所有人拉起手，那股微弱的温度就会连成一片。面对那些黑漆漆的装甲车和刺眼的法术，大家紧紧搂在一起，迎着冷风放声歌唱，那股暖流便会汇成漫山遍野的春潮。整片荒原上都将是扑来扑去的小翅膀，直到每一个角落都能听见大家的歌声。"
