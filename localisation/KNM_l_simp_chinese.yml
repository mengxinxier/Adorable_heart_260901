KNM.57.t:0 "写在树叶上的外交邀请？"
KNM.57.d:0 "办公室里，壁炉里的火已经有些弱了，窗外还飘着薄薄的雾气。\n桌上放着一个用细草绳系着、干荷叶裹着的小包裹。送件的外交使者嘛……据守卫说，那只是一只在窗前拼命用嘴啄玻璃的黑色小乌鸦。\n拆开荷叶，里面静静躺着又一片宽大的树叶。绿色的叶片上用黑泥巴按了一个小脚印，旁边还贴着几片晒干的黄色花瓣，和一颗捏扁了、散发着甜香味的红果子。\n随附的小纸条上，用红果汁歪歪地画着一个大大的太阳。\n这大概是那个被称为花花乐园的妖精国家送来的公函。那个总是大呼小叫的春之妖精，正在用她拙劣又天真的方式，向大家发出关于保护春天的邀请。\n在一整片被灰雾和战火熏得死气沉沉的大陆上，这片散发着甜味的橡树叶，确实带着一丝久违的、让人舒心的暖意。\n“给她们回信吧。”我放下这片叶子，拉了拉有些发凉的衣领，“顺便，送一些干净的白纸和钢笔去湖边。谁家正经国家会在树叶上写国书啊。”"
KNM.57.a:0 "“告诉她们，春天也是大家伙的朋友。”"
KNM.57.b:0 "“这……该不会是谁在恶作剧吧。”"
KNM_call_to_arms:0 "帮助春之妖精"

KNM_call_to_war_yes_tt:0 "我们将同意这个可爱的邀请，国家边境将向§Y花花乐园§!暂时敞开。\n之后那个“不讲道理的坏冬天”向她们§R宣战§!时，我们将能作为坚固的护盾加入这场春天的战斗。\n在未来，我们将获得一个效果可观的正面§Y民族精神§!。"
KNM_zmgct:0 "在每个§9春天§!里：\n"
KNM_infantry_entity:0 "§9莉莉白§!"
KNM_KFL_transfer_tt:0 "将全部陆军转移给§Y@KFL[KFL.getname]§!"
KNM_KFL_transfer_1_tt:0 "将全部陆军转移给§Y@KNM[KNM.getname]§!"
KNM_KFL_transfer:0 "让小妖精来带头"
KNM_KFL_transfer_desc:0 "林子深处的新朋友们更熟悉前面的路。既然达成了协议，地精大叔和护卫队全都可以交由小妖精盟友去指挥。大家在茂密的灌木丛里走得更快，也不会在东边的灰雾里迷失方向。她们在前面带路，后方的防线也显得更加安稳。"
KNM_KFL_transfer1:0 "大家都回到湖边来"
KNM_KFL_transfer1_desc:0 "前线的风雪暂时变小了。现在需要将所有的护卫和队伍，统统召回雾之湖的草地上。新老朋友聚在一起，重新数数人数，在温暖的炉火旁分着吃烤栗子和热茶。只有在这里重新整好队伍，大家才能在下一次严寒来临前，严严实实地守护好所有的花盆与树林。"

KNM_KFL_cooldown:0 "小家伙们已经在森林深处高高兴兴地玩耍去了，需要等上§Y30天§!才能重新整理好小包袱。"
KNM_KFL_independent_factory_tt:0 "§9如果小妖精们在林子里有了自己的家，那些藏在深林里的大铁房子，地精大叔也会帮她们造一半呢！§!\n§Y（若小妖精联军已独立，她们将额外获得雾之湖已搬迁工厂的一半数量）§!"
KNM_no_play_tt:0 "§R注意！！！（暂无内容）§!"

#学说
lili_strike_witches_xueshuo_name: "§Y春符§!·§9惊喜之春§!"
lili_strike_witches_xueshuo_desc: "莉莉白从树梢上探了出来，深吸了一大口气，把攒了一整个冬天的暖气全吹了出去。风里沾着花粉，翅膀上抖落的露珠变成细雨。她只会在那里到处喊。喊得积雪发软，喊得枯枝冒芽，喊得那些缩在战壕里的人忽然想起家里晒着的衣服。"
lili_strike_witches_xueshuo_lili_strike_witches1: "探出脑袋东张西望"
lili_strike_witches_xueshuo_lili_strike_witches2: "暖风藏在了翅膀底下"
lili_strike_witches_xueshuo_lili_strike_witches3: "大家一路喊过去"
lili_strike_witches_xueshuo_lili_strike_witches4: "炮管子里开出花来"
lili_strike_witches_xueshuo_lili_strike_witches5: "飞到哪儿，哪儿就是春天啦"