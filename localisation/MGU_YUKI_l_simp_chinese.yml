 MGU_land_describe_1:0 "§Y南方管制区，作为军政管理时期的民主派老巢，在我们月代雪大人上台后反抗的尤为激烈，加之处于边境，地势偏远，可谓是鞭长莫及。§!§R可以肯定，这里有大量的叛军活动。§!"
 MGU_land_describe_2:0 "§Y位于神滨市的西南方，也是羽彩环等人的故乡。由于靠近南方的管制区，本身也存在大量的民主派以及左派人士活动。值得注意的是，在这块地区同样存在着§!§R大量的叛军活动！§!"
 MGU_land_describe_3:0 "§Y靠近联盟最高学府的城市，大量的魔法少女和学者聚集于此，是联盟南方的活力中心，本身思想混杂，可谓是百花齐放。文化繁荣，经济发达。§!"
 MGU_land_describe_4:0 "§Y见泷原，鹿目圆和晓美焰等人的所在地，这座城市见证了五色的诞生和无数个轮回中的魔女之夜的诞生。另一方面，在联盟中，见泷原也具有象征意义，她代表着魔法少女们坚强乐观的品德和联盟的伟大精神。综合上来说，是一座未来感十足的，繁荣的城市。§!"
 MGU_land_describe_5:0 "§Y中央大区其实不是一个地区的名字，而是对几个地区的统称，这几个地区靠近首都神滨市，因此受到的管控较为严格，因此基本上处在联盟中央的控制下，§!§R但是仍有被渗透控制的风险§!"
 MGU_land_describe_6:0 "§Y幻想乡的托管区域，并不属于联盟的一部分，至少现在不属于，因此战火不会波及到这里，当然，你也不可能拉拢他们加入联盟的内部冲突的。§!"
 MGU_land_describe_7:0 "§Y神滨市，作为新五色的发源地，联盟的首都，魔法少女们的中心城市，无论是我们，还是叛乱分子都不想破坏这里。当地也为此早早戒严，因此这里将会作为中立区存在。§!"
 MGU_land_describe_8:0 "§Y北方三市靠近玛吉斯之翼的势力范围，当地民风长期以来和民主派处于敌对状态，作为玛吉斯之翼背景的月代雪可以较为轻易的拿下这里的民心。§!"
 MGU_land_describe_9:0 "§Y工匠区顾名思义，是联盟的工业中心，当地长期以魔法制品和技术人员闻名，这里和北方三市一样，同样也倾向于我们。§!"
 MGU_land_describe_10:0 "§Y工匠区顾名思义，是联盟的工业中心，当地长期以魔法制品和技术人员闻名，这里和北方三市一样，同样也倾向于我们。§!"
 MGU_land_describe_11:0 "§Y玛吉斯之翼的基本盘之一，天生倾向我们，但是如果我们什么也不做§!§R也会有意料之外的后果§!"
 MGU_land_describe_12:0 "§Y玛吉斯之翼的基本盘之一，天生倾向我们，但是如果我们什么也不做§!§R也会有意料之外的后果§!"
 MGU_land_describe_13:0 "§Y玛吉斯之翼的基本盘之一，天生倾向我们，但是如果我们什么也不做§!§R也会有意料之外的后果§!"
 MGU_land_describe_14:0 "§Y玛吉斯之翼的基本盘之一，天生倾向我们，但是如果我们什么也不做§!§R也会有意料之外的后果§!"
 MGU_land_describe_15:0 "§Y圣杯王国远征军的驻地，并不属于联盟的一部分，至少现在不属于，因此战火不会波及到这里，当然，你也不可能拉拢他们加入联盟的内部冲突的。§!"
 MGU_land_describe_16:0 "§R搜索联盟资料库....\n错误！未找到地区！\n请联系管理员或检查拼写！§!"
