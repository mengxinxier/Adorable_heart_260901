 MGU_yuki_end_title:0 "至此，§4魔法少女联盟§!的复仇告一段落"
 MGU_yuki_end_tip:0 "风吹走了残骸留下的灰烬，火烬灰冷，伦敦，莫斯科，东京，神滨市，高楼耸立在空无一人的大地上，这是§Y人类§!，§R妖精§!，§4魔法少女§!和其他种族的故事的结尾，是所有罹难者的墓志铭，这个荒诞的故事开始于对一名少女的浮世绘一般的执念，收笔于幻梦般泡沫的裂解。睡吧，睡吧，你将忘记阴霾和苦难，即便§C亡灵的公主§!已经成为画卷的一个注脚，即便§Y死者的执念§!已经被刻入大幕浮雕，即便旧世已经终焉，漆黑的地母仍会展开双臂搂住每一个罹难的孩子..."
 MGU_yuki_end_tip_2:0 "§4如果可以，下次，请不要再让这个世界毁灭了吧...§!§Y感谢您游玩魔法少女联盟月代雪线的内容，欢迎提供宝贵的建议§!"
 MGU_yuki_end_button:0 "睡吧，睡吧，睡吧..."
 MGU_yuki_end_button_TT:0 "§4“这个故事也许有点太悲伤了不是吗，那么，我们换一个吧，梅露露”§!§Y“呼...呼...呼...”§!§4“睡着了吗，真是个可爱的孩子呢，梅露露。”§!"
