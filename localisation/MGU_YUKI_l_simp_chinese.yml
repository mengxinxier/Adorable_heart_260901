 MGU_yuki_character:0 "§4刻骨铭心§!\n\n倘若我问你，仇恨的期限是多少，你会如何回答。\n\n月代雪用自己的行动给出了她的年限：§4五百年§!。\n\n月代雪不知道自己是怎么走到今天的，作为一个大魔女，和后世人为形成的只知道杀戮的怪物不同，月代雪是一个温柔，善良，博学的存在，至少在§R那一夜§!之前是这样的.\n\n一夜间，她的故乡化为火海，而月代雪本人也不得不背井离乡，带着为族人复仇的心情，作为旧世界的亡灵在七海洋徘徊。\n\n她也曾一度放下了仇恨，那是她和艾玛与希罗相识的几年，她干涸的内心似乎又泛起了涟漪，而她也默默的收回了曾经的复仇计划，心想着日子也许可以一直这样下去吧...直到§R国会的一声爆炸§!再一次击碎了她的世界，她的寄托和她的幻想。\n\n复仇计划再一次被提上日程，靠着和玛吉斯们的交情和爆炸案带来的右翼舆论浪潮，月代雪成功从幕后走上台前，所有人都认为这不过是一次简单的对左翼的报复性打击，而只有月代雪知道，§R一切才刚刚开始§!"
