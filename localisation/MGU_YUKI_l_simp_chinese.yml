l_simp_chinese:
#国策本地化
 MGU_yuki_prepare_for_civil_war:0 "为了她们的世界"
 MGU_yuki_prepare_for_civil_war_desc:0 "吾等屹立于世，强敌环伺，兄弟阋墙几余载而终又归于一统。而满朝公卿皆为名利，魑魅妖魔勾结于高堂，终成大祸。吾等挚友或死于非命，或竟昏迷。而今宵小之辈卷土重来，妄图再次撕裂吾等神圣之联盟。为了她们的世界，吾等必将肩负重担。"
 MGU_yuki_recruit_army:0 "你会加入正义军吗"
 MGU_yuki_recruit_army_desc:0 "“我们，还是他们，你会选择站在哪一边？”作为一名魔法少女，你需要知道，你应该为了自己而战，而不是为了那些软弱的叛徒而战。更何况，哪怕按照所谓的民主程序，我们也是绝对的合法政府。"
 MGU_yuki_official:0 "一起为了那伟大国家共患难"
 MGU_yuki_official_desc:0 "一些将军也显然对原有的软弱政府并不买账，我们的上台毫无疑问是给了她们一个新的希望。因此，在暴风雨到来前，我们应该尽可能的和她们达成合作，一起为了伟大联盟奋战。"
 MGU_yuki_millitia:0 "用团结筑起街垒"
 MGU_yuki_millitia_desc:0 "所谓民心可用，用于形容现在的魔法少女联盟再合适不过了。爆炸案毫无疑问激发了魔法少女们的愤怒。不少民众要求严惩叛徒，强硬态度。也许将她们武装一下，就能让她们成为一支准军事组织为我们而战。"
 MGU_yuki_ultra_mind:0 "愤怒总比懦弱强"
 MGU_yuki_ultra_mind_desc:0 "诚然，叛乱者的说辞成功的动员了军队中一批不忠诚的分子。然而，我们同样也注意到，有一些强硬派的爱国士兵对我们表现出了强烈支持。虽然她们有时候，额，比较鲁莽，但是愤怒总比怯懦强对吧。"
 MGU_yuki_transform_weapons:0 "用枪炮让联盟四时安康"
 MGU_yuki_transform_weapons_desc:0 "你无法用嘴皮来说服他人，对付叛乱分子，只有枪炮才能让她们冷静下来并且乖乖闭嘴。这个主义者那个主义者，多说无益，再来走一躺吧，为了联盟的未来，让钢铁走上舞台！"
 MGU_yuki_make_sure_loyal:0 "魔法少女们，到这里来"
 MGU_yuki_make_sure_loyal_desc:0 "我们已经注意到，叛乱分子正在地方煽动叛乱，这已经让不少本就动摇的地区开始倒向叛军。我们也该行动起来了，在一切为时已晚前。"
 MGU_yuki_publicity:0 "“嘘，不许多嘴，仔细听”"
 MGU_yuki_publicity_desc:0 "对于一些摇摆地区，我们可以采取一些比较温和的手段来拉拢他们，比如在潜移默化中宣传我们的思想，阴谋论也好，舆论控制也好，总之让她们了解我们想让她们了解的东西，从而确保她们的服从。"
 MGU_yuki_northern:0 "北方的玛吉斯们..."
 MGU_yuki_northern_desc:0 "北方的玛吉斯们长期和前政府保持着敌对关系，即便是在谈判之后也仍有不少玛吉斯们对此表示不满，而我们则是重建了玛吉斯之翼的朋友，毫无疑问，只要我们稍微拉拢一下，玛吉斯们会站在我们这一边。"
 MGU_yuki_blame_left:0 "都是她们的错"
 MGU_yuki_blame_left_desc:0 "无论策划爆炸案的人是怎么想的，她们的这一行为毫无疑问是给人落下来口实。我们凭借着软弱的民主派和左翼叛徒的说辞成功上台，现在，我们不介意再用这个说辞来笼络人心。"
 MGU_yuki_martial_law:0 "所有人留在家里"
 MGU_yuki_martial_law_desc:0 "难以置信，居然有那么多人信了那些叛徒的鬼话，闹剧该落幕了，从现在开始全国戒严，谁都不许给我闹事。"
 MGU_yuki_love:0 "爱的渣滓"
 MGU_yuki_love_desc:0 "纯洁的艾玛，善良的艾玛，好孩子艾玛..."
 MGU_yuki_enter_the_focus_tree:0 "出乎意料的人选"
 MGU_yuki_enter_the_focus_tree_desc:0 "无数次从噩梦中惊醒\n愈发珍惜锈蚀的回忆\n已经行至此处了呢\n§R已经无需再担心了§!"
 MGU_yuki_enter_the_focus_tree_name:0 "§R恶魔将会披上天使的外衣§!"
 MGU_yuki_recruit_army_name:0 "§R三支§!§Y魔法少女部队将会加入我们§!"
 MGU_yuki_make_sure_loyal_name:0 "§R五支§!§Y魔联部队将会加入我们§!，§R并且开始对于动荡地区的拉拢决议§!"
 MGU_yuki_millitia_name:0 "§R五支§!§Y民兵部队将会加入我们§!"
 MGU_yuki_ultra_mind_name:0 "§R五支§!§Y魔联部队将会加入我们§!"
 MGU_yuki_northern_name:0 "§Y通过沟通可以保证玛吉斯之翼的部队在内战开始时候会加入我们§!§R而不是内部分裂导致不可逆的后果§!"
 MGU_yuki_rebuild:0 "废墟中的百合花"
 MGU_yuki_rebuild_desc:0 "我们成功击溃了那些腐朽堕落的叛徒和民主派带领的叛军，联盟是魔法少女的联盟，而不是任何其他人的。然而，短短十几年内两度内战已经使得我们的国家支离破碎，经济凋敝。为此，我们需要一个重建计划，我们将在废墟中开出最美丽的花。"
 MGU_yuki_people_economy:0 "子时将至"
 MGU_yuki_people_economy_desc:0 "毫无疑问，圣杯在战前持续对我们输出影响力，并且让我们的经济受制于他人。不过，随着内战的爆发，圣杯和其他欧洲国家的企业也陆续离开了这个是非之地。清算她们是早晚的事情，但是我们也许可以开放一些无关紧要的领域来吸引她们投资，这样不仅可以缓解我们的经济重建压力，也可以更好的呈现一个“文明”的假象来掩盖我们的计划。"
 MGU_yuki_zero_clock:0 "钟声响起"
 MGU_yuki_zero_clock_desc:0 "既然那些殖民者已经滚蛋了，就没有必要再迎回她们了。另一方面而言，对于仍然对于我们保有非分之想的圣杯企业，我们应该掐断她们不切实际的野心。至于经济发展，我们也许可以仅仅以盟友的名义向国际社会申请资金和技术人员援助，当然，作为代价，这些人到来之后必然会接触一些较为核心的问题，尽管我们可以隐藏，但这仍然会导致§R外界疑心加重§!"
 MGU_yuki_peace_factory:0 "民生经济"
 MGU_yuki_peace_factory_desc:0 "尽管我们并不是什么真正意义上的和平主义者，但考虑到战后民生凋敝，国家百废待兴。为此，我们需要优先重建联盟的民生。"
 MGU_yuki_mixed_factory:0 "混合式重建"
 MGU_yuki_mixed_factory_desc:0 "我们不能完全的把精力放在军事工业的重建上，但是这不意味着我们就要放弃宝贵的事件来过度享乐。联盟需要民生，更需要安全，为此我们将会在两者间达成一个平衡。"
 MGU_yuki_war_factory:0 "军工复合体"
 MGU_yuki_war_factory_desc:0 "军事工业是保护我们魔法少女免受威胁的重要部门，我们应该不遗余力的支持军事工业的重建和扩张，但是我们这么做可能释放了一个§R不友善的外交信号§!"
 MGU_yuki_army_condition:0 "联盟的利刃"
 MGU_yuki_army_condition_desc:0 "联盟的军队在战后面临着建制破坏和专业人员不足的问题，这是我们无法忍受的，一支专业强大的军队是我们实现夙愿的关键，军事改革必须尽快展开。"
 MGU_yuki_national_army:0 "联盟军队"
 MGU_yuki_national_army_desc:0 "专业的事情应该交给专业的人来做，月代雪小姐并非专业的军官，为此，也许交给巴麻美为首的军官来指挥魔法少女军队是个更好的选择。"
 MGU_yuki_obey_leader:0 "首脑至上"
 MGU_yuki_obey_leader_desc:0 "晓美焰的叛乱已经证明了，不能让联盟的军权流向叛徒和不忠诚之人，为此，月代雪小姐必须对军队有绝对控制权，这样一来，月代雪小姐的魔法强化也可以更好的作用于联盟军。"
 MGU_yuki_helldiver:0 "南美大陆军"
 MGU_yuki_helldiver_desc:0 "我们最终的目标是统合南美，来抵御欧洲殖民者和人类对我们的压迫的损害。为此，军队的目标和设计方向都应该是南美大陆军，而不是一支龟缩在联盟内的内卫。"
 MGU_yuki_official_army:0 "职业化魔法少女"
 MGU_yuki_official_army_desc:0 "联盟在多年内战中军队素质和理念长期落后于世界，为了扭转颓势，我们需要尽快实现魔法少女军队的现代化和职业化。"
 MGU_yuki_copy_england:0 "圣杯模式"
 MGU_yuki_copy_england_desc:0 "圣杯是当今世界上最强的国家，拥有最强大的军队和最先进的理论，学习圣杯的模式毫无疑问是我们的最好出路。"
 MGU_yuki_new_age:0 "少女黎明"
 MGU_yuki_new_age_desc:0 "我们已经摆脱了软弱的民主谎言的枷锁，魔法少女将迎来解放的黎明，彻底摆脱殖民主义的未来就在眼前。"
 MGU_yuki_invasion:0 "南美统合主义"
 MGU_yuki_invasion_desc:0 "如果仅仅依靠联盟的有限资源，和圣杯王国对抗毫无疑问是以卵击石，如果南美和魔法少女要获得自由和解放，那么整合南美毫无疑问是唯一出路。只是有人担忧这样的扩张主义政策是否会引发他国警惕和怀疑我们的真实目的。"
 MGU_yuki_conservation:0 "魔法少女保守政策"
 MGU_yuki_conservation_desc:0 "目前的联盟不宜过早的展示自己的野心，当务之急的在百废待兴之际保持我们的独立和联盟的安全，因此当前的重心应该是自保而不是扩张计划。"
 MGU_yuki_london_travel:0 "伦敦之行"
 MGU_yuki_london_travel_desc:0 "在我们拥有充足的实力和做好复仇准备前，我们必须装作亲近圣杯王国，因此，月代雪小姐将亲自去一趟伦敦来展示友好。"
 MGU_yuki_south_america:0 "南美倡议"
 MGU_yuki_south_america_desc:0 "现阶段直接吞并南美还是过于困难了，且暴露野心的风险是我们无法承受的。为此，我们可以打着圣杯王国和圣杯同萌的名义和南美诸国加强合作，如果她们愿意的话。即便不愿意，也可以展示我们的友好态度，有利于我们将来整合南美。"
 MGU_yuki_corporation:0 "魔法少女法团经济"
 MGU_yuki_corporation_desc:0 "为了避免社会矛盾激化，产生动荡破坏我们的伟大计划，月代雪小姐决定引入法团经济，通过二次分配和国有行会来缓和阶级矛盾。当然，考虑到我们魔法少女的特别性，也要加以改良。"
 MGU_yuki_controlled:0 "魔法少女统制经济"
 MGU_yuki_controlled_desc:0 "为了复仇，联盟应该控制国家经济的方方面面。一切的计划都必须由月代雪小姐亲自过目和批准，绝不可以使用漫无目的的市场经济。一切为了复仇，复仇即是一切。"
 MGU_yuki_deadline:0 "捍卫玛吉斯们的底线"
 MGU_yuki_deadline_desc:0 "尽管现在权力已经集中在月代雪集团手里，原玛吉斯之翼和玛吉斯们已经被边缘化，但是我们不能忘记她们的贡献。为此，我们必须坚持一个原则，即我们的最终目的一定是解放魔法少女，避免她们悲惨的命运的到来。为此，我们也要在一定程度上保证魔法少女们的生活水平。"
 MGU_yuki_kill_republic:0 "共和之死"
 MGU_yuki_kill_republic_desc:0 "无论你承不承认，魔法少女联盟的民主政治已经终结了，现在的联盟和联盟议会只不过是极端主义和复仇主义者的遮羞布和伪装，共和体制名存实亡，唯一存在的目的只不过是为了骗过圣杯王国和其他国家。那么，接受她吧，毕竟你什么也改变不了。"
 MGU_yuki_technology:0 "以科技武装吾等"
 MGU_yuki_technology_desc:0 "我们不会忘记殖民者是怎么用枪炮和先进的科技来碾碎我们的土地的，也不会忘记那些比我们的魔法更强大的子弹和装甲对我们造成的伤痛。为此，我们必须要用科技武装我们的军队。"
 MGU_yuki_magic:0 "魔法的回响"
 MGU_yuki_magic_desc:0 "我们的科技已经明显落后，因此想要和超级大国进行装备科技竞赛是不可能的，但是我们有着魔法优势，只要用科技配合魔法，就能发挥出一加一大于二的效果。"
 MGU_yuki_new_order:0 "§R再续前仇§!"
 MGU_yuki_new_order_desc:0 "西方风暴将至，赤匪，暴君，邪神信徒都磨刀霍霍，准备争夺这片土地的控制权，但是这片土地只能属于魔法少女！"
 MGU_yuki_war_factory_name:0 "§R这会大幅度提高警惕值！§!\n§R注意：这将影响后续的国策效果§!"
 MGU_yuki_mixed_factory_name:0 "§R这会小幅度提高警惕值！§!\n§R注意：这将影响后续的国策效果§!"
 MGU_yuki_peace_factory_name:0 "§R注意：这将影响后续的国策效果§!"
 MGU_yuki_plague_inc:0 "[MGU_yuki_plague_inc_word]"
 MGU_yuki_plague_inc_desc:0 "[MGU_yuki_plague_inc_body]"
 MGU_yuki_plague_inc_word_bad:0 "侧卧之塌"
 MGU_yuki_plague_inc_body_bad:0 "月代雪做了一个梦，一个魔法少女被屠戮殆尽的梦。月代雪还有另一个梦，一个魔法少女自由的在七大洲生活的梦。然而，月代雪也深知，光凭武力无法完成自己的乌托邦构想。为此，月代雪决定重启魔女因子计划，来快速毁灭人类。"
 MGU_yuki_plague_inc_word_good:0 "看看这悲惨世界"
 MGU_yuki_plague_inc_body_good:0 "这个世界上的不公和贫困太多了，战乱，饥荒...我们魔法少女取得了解放，也不能忘了援助她们。"
 MGU_yuki_infect_england:0 "奥鲁斯的天使"
 MGU_yuki_infect_england_desc:0 "圣杯王国是当今世界上最强大的国家，她们拥有令人绝望的海军和不容小觑的陆军和空军，无论是哪一种都不是我们短期之内可以追上的，加上其独立于欧陆和美洲的孤岛位置，魔女因子难以直接通过大陆交通到达，因此，我们需要直接在当地散布魔女因子。军事交流也许是个不错的幌子。"
 MGU_yuki_spy_infect:0 "[MGU_yuki_spy_infect_word]"
 MGU_yuki_spy_infect_desc:0 "[MGU_yuki_spy_infect_body]"
 MGU_yuki_spy_infect_word_bad:0 "笑面梦魇"
 MGU_yuki_spy_infect_body_bad:0 "可爱的少女在世俗眼里往往是美好，善良的代表。然而，月代雪似乎对此有不同的见解。月代雪将会以公费留学的名义将附着魔女因子的少女们送去各国，这将会是无数个感染源。当然，留学也有助于我们的科技水平提高"
 MGU_yuki_spy_infect_word_good:0 "互通有无"
 MGU_yuki_spy_infect_body_good:0 "多多交流，有利于我们消除自身和他人的分歧，通过和平途径解决问题"
 MGU_yuki_anti_cure:0 "[MGU_yuki_anti_cure_word]"
 MGU_yuki_anti_cure_desc:0 "[MGU_yuki_anti_cure_body]"
 MGU_yuki_anti_cure_word_bad:0 "魔法抗性"
 MGU_yuki_anti_cure_body_bad:0 "魔女因子常常让人联想到烈性传染病，然而，其本质上只是月代雪魔力的延申，也就是，本质上只是一种魔法，或者说一种魔法物质。这种物质并不畏惧传统医学，但是会被一部分的魔法和魔药所破坏，月代雪将会改进魔法，让魔女因子更难被常规魔法消毒措施消灭，从而更有利于在轮船飞机和城市内传播。只不过，也许还有一些意外收获。"
 MGU_yuki_anti_cure_word_good:0 "魔法疗法"
 MGU_yuki_anti_cure_body_good:0 "我们将开启一系列的魔法治疗实验，帮助解决世界范围内的疫病。"
 MGU_yuki_european:0 "[MGU_yuki_european_word]"
 MGU_yuki_european_desc:0 "[MGU_yuki_european_body]"
 MGU_yuki_european_word_bad:0 "欧罗巴之殇"
 MGU_yuki_european_body_bad:0 "欧洲是全世界的科技和经济中心，同样也是最有可能对我们造成威胁的地区，为此，欧罗巴应当尽早遭到感染。和欧罗巴企业合作的同时，我们也得以扩张我们的工业。"
 MGU_yuki_european_word_good:0 "欧罗巴重生"
 MGU_yuki_european_body_good:0 "我们不是再1873年了，我们生活在1936年，欧罗巴却依旧哀号遍野，疫病战争层出不穷，因此，我们将拯救欧洲。"
 MGU_yuki_Japan:0 "[MGU_yuki_Japan_word]"
 MGU_yuki_Japan_desc:0 "[MGU_yuki_Japan_body]"
 MGU_yuki_Japan_word_bad:0 "樱花永落"
 MGU_yuki_Japan_body_bad:0 "除了圣杯王国，樱花帝国同样是一个强大的海洋帝国，同样拥有令人惊叹的海军，难以登录。为此，我们也得给我们东亚的朋友一个小小的“惊喜”。"
 MGU_yuki_Japan_word_good:0 "日出东方"
 MGU_yuki_Japan_body_good:0 "樱花是东亚最早的列强，也是民生最糟糕的地区之一，为此，我们将派出人员救助贫苦人民。"
 MGU_yuki_bird:0 "[MGU_yuki_bird_word]"
 MGU_yuki_bird_desc:0 "[MGU_yuki_bird_body]"
 MGU_yuki_bird_word_bad:0 "鸟类魔化"
 MGU_yuki_bird_body_bad:0 "成千上万的携带魔女因子的候鸟将会跨越一个个国家..."
 MGU_yuki_bird_word_good:0 "放飞和平"
 MGU_yuki_bird_body_good:0 "和平是如此的飘渺，如此的美好，为此我们也将更加珍惜和平。我们将放飞和平鸽，让世界都体会到这份愿望的珍贵。"
 MGU_yuki_railway:0 "[MGU_yuki_railway_word]"
 MGU_yuki_railway_desc:0 "[MGU_yuki_railway_body]"
 MGU_yuki_railway_word_bad:0 "大陆运输"
 MGU_yuki_railway_body_bad:0 "如果只是依赖活体传播，那么魔女因子的传染能力还是太局限了，月代雪将一部分常用的滞留魔法和魔女因子结合，使得这种魔女因子可以长时间在非活性物体表面停留，感染接触者。那么这样一来，一列列货车拉的不再是货物，而是联盟特酿的魔法。当然，这些特快专列也会满载而归。"
 MGU_yuki_railway_word_good:0 "希望列车"
 MGU_yuki_railway_body_good:0 "列车是二十世纪的最重要的运输方式之一，如果我们想要尽可能的帮助更多的人，就必须使用这种运输方式，这将是一辆希望列车。"
 MGU_yuki_France:0 "[MGU_yuki_France_word]"
 MGU_yuki_France_desc:0 "[MGU_yuki_France_body]"
 MGU_yuki_France_word_bad:0 "幻想乡战略"
 MGU_yuki_France_body_bad:0 "幻想乡四面皆敌，兵力和物资的捉襟见肘，更重要的是，幻想乡的地缘格局决定了其在欧洲的交通线中占有重要地位，为此，感染幻想乡将会是一个重大进展。向她们输送带有魔女因子的武器装备可以有效的造成大规模感染，而且她们对此一无所知，相信面对魔导国的威胁，她们不会拒绝的。我们也可以在此基础上扩大资源贸易来解决我们的物资问题。"
 MGU_yuki_France_word_good:0 "人间之里-神滨"
 MGU_yuki_France_body_good:0 "幻想乡四面皆敌，兵力和物资的捉襟见肘，更重要的是，她们是欧陆共和制度的先驱，也是抵御不死族的先锋，为此，我们必须向她们援助武器和物资。"
 MGU_yuki_babie:0 "[MGU_yuki_babie_word]"
 MGU_yuki_babie_desc:0 "[MGU_yuki_babie_body]"
 MGU_yuki_babie_word_bad:0 "§R再建巴别塔§!"
 MGU_yuki_babie_body_bad:0 "§R一路走来，想必是充满了艰辛\n接下来你可以安心了\n因 为 地 上 天 国 要 来 了§!"
 MGU_yuki_babie_word_good:0 "§C美丽新世界§!"
 MGU_yuki_babie_body_good:0 "§R一路走来，想必是充满了艰辛\n接下来你可以安心了\n因 为 地 上 天 国 要 来 了§!"
 MGU_yuki_revolution_south:0 "南美革命"
 MGU_yuki_revolution_south_desc:0 "是时候了，把整个南美和魔法少女从殖民者，王权疯子，混沌信徒和不切实际的空想主义者手里解放出来了，魔法少女们，拿起武器，为了联盟和魔法少女的革命而战。"
 MGU_yuki_militray_magic:0 "魔法少女军事化"
 MGU_yuki_militray_magic_desc:0 "自由散漫的弊病必须被根除，一切为了前线，一切了为了魔法少女的胜利，魔法少女们要踊跃参军。"
 MGU_yuki_the_most_dangerous:0 "魔法少女的存亡之际"
 MGU_yuki_the_most_dangerous_desc:0 "联盟遭到攻击，魔法少女最后的安身立命之地遭到威胁，姑娘们，团结起来，消灭强敌！"
 MGU_yuki_make_sure_equipments:0 "一切为了前线"
 MGU_yuki_make_sure_equipments_desc:0 "如果我们在这场战争中失败，那么我们将万劫不复。因此，每一把枪，每一发子弹，每一发魔弹，都需要为了前线的战事服务。"
 MGU_yuki_all_for_the_war:0 "一切为了胜利"
 MGU_yuki_all_for_the_war_desc:0 "少女们应该重拾起当年面对魔兽和魔化的同伴的悍不畏死的精神了，敌军来势汹汹，为了胜利，每一个人的牺牲都是值得的，没有什么牺牲大到无法接受，也没有怯懦和背叛小到可以被原谅！"
 MGU_yuki_angel_action:0 "安乐天使行动"
 MGU_yuki_angel_action_desc:0 "跨越最后的街垒和阵地，我们誓要把魔法少女的胜利和救赎带向整个南美！"
 MGU_yuki_great_war:0 "宿命之战"
 MGU_yuki_great_war_desc:0 "逃出去吧，逃出去吧，从魔法少女的悲惨轮回中逃出去吧，因为你不是那注定生在奈落的花..."
 MGU_yuki_anti_cure_effect:0 "[MGU_yuki_anti_cure_effect_name]"
 MGU_yuki_infect_england_effect:0 "[MGU_yuki_infect_england_effect_name]"
 MGU_yuki_spy_infect_effect:0 "[MGU_yuki_spy_infect_effect_name]"
 MGU_yuki_european_effect:0 "[MGU_yuki_european_effect_name]"
 MGU_yuki_Japan_effect:0 "[MGU_yuki_Japan_effect_name]"
 MGU_yuki_bird_effect:0 "[MGU_yuki_bird_effect_name]"
 MGU_yuki_railway_effect:0 "[MGU_yuki_railway_effect_name]"
 MGU_yuki_France_effect:0 "[MGU_yuki_France_effect_name]"
 MGU_yuki_anti_cure_effect_bad:0 "§R魔女因子现在可以随着船只飞机感染周边地区§!\n强化§C恶之花§!，§R恨之花§!"
 MGU_yuki_anti_cure_effect_good:0 "§C我们将专注于协助其他国家用魔法控制疾病§!\n强化§C恶之花§!，§R恨之花§!"
 MGU_yuki_infect_england_effect_name_bad:0 "§R我们将派出携带魔女因子的人员和物资前往感染圣杯王国§!\n强化§C恶之花§!，§R恨之花§!"
 MGU_yuki_infect_england_effect_name_good:0 "§C我们将和圣杯王国进行贸易和交流§!\n强化§C恶之花§!，§R恨之花§!"
 MGU_yuki_spy_infect_effect_name_bad:0 "§R伪装分子将会出动§!\n强化§C恶之花§!，§R恨之花§!"
 MGU_yuki_spy_infect_effect_name_good:0 "§C我们将派出留学生和交流人员§!\n强化§C恶之花§!，§R恨之花§!"
 MGU_yuki_european_effect_name_bad:0 "§R我们将会感染欧罗巴§!\n强化§C恶之花§!，§R恨之花§!"
 MGU_yuki_european_effect_name_good:0 "§C我们将会援助欧罗巴§!\n强化§C恶之花§!，§R恨之花§!"
 MGU_yuki_bird_effect_name_bad:0 "§R鸟会带来死亡...这会导致跨国传播§!\n强化§C恶之花§!，§R恨之花§!"
 MGU_yuki_bird_effect_name_good:0 "§C和平鸽将会带来希望...§!\n强化§C恶之花§!，§R恨之花§!"
 MGU_yuki_railway_effect_name_bad:0 "§R魔女因子专列，开向非洲§!\n强化§C恶之花§!，§R恨之花§!"
 MGU_yuki_railway_effect_name_good:0 "§C希望专列，开向非洲§!\n强化§C恶之花§!，§R恨之花§!"
 MGU_yuki_France_effect_name_bad:0 "§R人间之里不会知道她们收下的是什么§!\n强化§C恶之花§!，§R恨之花§!"
 MGU_yuki_France_effect_name_good:0 "§C这将会帮助幻想乡抵御不死族威胁§!\n强化§C恶之花§!，§R恨之花§!"
 MGU_yuki_Japan_effect_name_bad:0 "§R樱花树下，她们平静的接受死亡的馈赠§!\n强化§C恶之花§!，§R恨之花§!"
 MGU_yuki_Japan_effect_name_good:0 "§C樱花树下，她们迎来新的希望§!\n强化§C恶之花§!，§R恨之花§!"
 MGU_yuki_great_war_effect:0 "§R联盟的考验已至\n少女的考验已至§!"
 MGU_yuki_rebuild_south_america:0 "故国满目疮痍"
 MGU_yuki_rebuild_south_america_desc:0 "南美统一了，至少除了圣杯的远征军这个明面上的盟友外的军阀都被我们扫入了垃圾堆。然而，这样的胜利的代价是大地满目疮痍，魔法少女的家园也毁于战火，为了让魔法少女看见希望和完成下一步计划，我们必须重建南美。"
 MGU_yuki_rebuild_aircraft:0 "铁翼的启示"
 MGU_yuki_rebuild_aircraft_desc:0 "第一次伟大战争时期飞机就被用于战争，而我们却长期忽视，或者说无力发展空军，然而，现在南美已经统一于我们和“盟友”的旗帜下，我们已经不再是那个弱小的国家了，空军建设也是时候提上议程了。"
 MGU_yuki_rebuild_industry:0 "铁砧和锤子的轮舞曲"
 MGU_yuki_rebuild_industry_desc:0 "战争期间，我们的工业遭到了战火摧残，到了战争后期甚至由于大量少女前往前线，出现了产业停摆的现象。现在随着军队复员和新的领土被整合，工业的引擎将被重新启动。"
 MGU_yuki_rebuild_naval:0 "南美海军"
 MGU_yuki_rebuild_naval_desc:0 "月代雪不会忘记，是什么让她家破人亡，殖民者的坚船利炮轰开了无数个第三世界国家的大门，也包括曾经的魔女岛。现在，她绝对不会让灾难重新降临在联盟身上。"
 MGU_yuki_aircraft_technology:0 "天空主宰者蓝图"
 MGU_yuki_aircraft_technology_desc:0 "相较于其他主要的大国，联盟的飞机技术不可谓不落后，承认，魔法在一定程度上承担了飞行器技术的位置来让魔法少女们在空中战斗，但是我们不能让少女们用肉体或者落后的战机去和列强新式战机对抗，为此，新技术的研发迫在眉睫。"
 MGU_yuki_aircraft_magic:0 "魔法少女的传统"
 MGU_yuki_aircraft_magic_desc:0 "当然，魔法少女之所以为魔法少女，当然是因为我们悠久的魔法使用历史。我们可以尝试把这种历史和传统应用到现代化的空军上，或许有奇效。"
 MGU_yuki_aircraft_cheaper:0 "多就是好"
 MGU_yuki_aircraft_cheaper_desc:0 "我们的空军基础太薄弱了，如果想要打造一支强大的空军部队，想要拥有遮天蔽日的铁翼，那么我们就必须在质量上暂时做出一些牺牲。"
 MGU_yuki_aircraft_cas:0 "死亡从天而降"
 MGU_yuki_aircraft_cas_desc:0 "机炮向敌军倾泻怒火，子弹撕碎了士兵和装甲。死亡不一定来自于眼前的敌人，有时候死神会在轰鸣声中从天而降。"
 MGU_yuki_aircraft_producer:0 "与企业合作"
 MGU_yuki_aircraft_producer_desc:0 "一支好的空军离不开一批好的供应商，为此，联盟将对飞机之制造商提供补贴，帮助她们更好的生产物美价廉的机体。"
 MGU_yuki_aircraft_anti_ship:0 "让她们沉海底！"
 MGU_yuki_aircraft_anti_ship_desc:0 "我们的海军短期内无法和圣杯等大国抗衡，因此我们需要一些战斗机来对舰作战，为我们提供海上火力优势。让一切胆敢阻拦侵犯联盟和魔法少女的敌人沉入海底！"
 MGU_yuki_rebuild_infra:0 "条条大路通神滨"
 MGU_yuki_rebuild_infra_desc:0 "南美长期以来被殖民和战火所困，各地处于割据局面，基建和道路可以说是落后又分散。如果我们希望建立一个统一的联盟，那么将这些地区的基础设施翻新新建救赎有必要的。"
 MGU_yuki_rebuild_core:0 "宽恕，遗忘"
 MGU_yuki_rebuild_core_desc:0 "有一些原先的所谓革命军和王国分子不愿意臣服于我们，还有一些亡灵也对莉莉安娜的离去感到愤怒，但是，她们既然现在也是联盟的一份子，同样也是殖民者或者暴君暴政下的受害者，那么我们也不必要对她们过度严苛，接纳她们并给她们新的开始，对于我们来说毫无疑问是一个更好的开始...\n§R有些事情是忘不掉的，月代雪...你，也明白这一点吧...§!"
 MGU_yuki_rebuild_get_factory:0 "名花有新主"
 MGU_yuki_rebuild_get_factory_desc:0 "原先各国的企业因为我们的到来很多有所顾虑，尤其是那些为旧主子积极效力的，担心我们对其进行清算拆分。我们现在要告诉他们，无需担忧，照旧生产，只不过需要为我们联盟服务。"
 MGU_yuki_rebuild_army_factory:0 "挽救，回报"
 MGU_yuki_rebuild_army_factory_desc:0 "我们注意到有一批敌方军工企业在战火中产业遭到毁灭性打击，濒临倒闭，但是她们的技术工人和产品仍是我们需要的，所以，我们可以给她们一些帮助，作为回报，她们需要帮我们生产所需的军备。"
 MGU_yuki_rebuild_united_south_america:0 "南美，合而为一"
 MGU_yuki_rebuild_united_south_america_desc:0 "我们需要认识到，单凭任何一个南美国家单独的力量都无法对抗列强和殖民者，只有一个统一的南美才能主宰自己的命运，因此，对顽固的抵抗分子进行无情镇压就是我们的必要之恶了。"
 MGU_yuki_rebuild_welfare:0 "向她伸出一只手"
 MGU_yuki_rebuild_welfare_desc:0 "雪不会忘记那个坐在火海里哭泣的女孩，也不会对魔法少女和南美的战争苦难视而不见，有那么多嗷嗷待哺的孩子和穷人需要喂养，联盟不会坐视不管。§R那么，这一切是怎么发生的呢，月代雪小姐...§!"
 MGU_yuki_industry_centre:0 "新世界的明珠"
 MGU_yuki_industry_centre_desc:0 "联盟，不可分割，她是多么统一而强大，多么的光彩照人，魔法少女的家园，新大陆的楷模！"
 MGU_yuki_ship_cheaper:0 "再便宜些"
 MGU_yuki_ship_cheaper_desc:0 "俗话说的好，十年陆军百年海军，我们显然没有一百年来消磨，因此必须对于质量放低一些标准，以此达到快速建立一支可堪一用的海军。"
 MGU_yuki_ship_technology:0 "引入圣杯造船技术"
 MGU_yuki_ship_technology_desc:0 "作为圣杯的盟友，至少现在还是，我们可以向圣杯请求技术援助帮助我们的造船技术实现快速的飞跃。"
 MGU_yuki_ship_attack:0 "舰炮的奏鸣曲"
 MGU_yuki_ship_attack_desc:0 "无论如何，和列强相比，我们的海军还是有较大不足的，但是，魔法和舰炮的结合或许是一个突破口，也许可以达到1+1大于2的效果。"
 MGU_yuki_ship_build_more:0 "修缮,新建"
 MGU_yuki_ship_build_more_desc:0 "强大的海军需要大量的船坞来完成建造，我们可以利用内战期间那些还没被完全破坏的船坞，加以修缮，并建造一批新的，来支持我们的海军事业。"
 MGU_yuki_ship_doctorine:0 "完善学说"
 MGU_yuki_ship_doctorine_desc:0 "联盟没有多少海战经验，或者是，压根没有真正在意过海军学说。但是今时不同往日，学说的建设也必须被提上历程。"
 MGU_yuki_ship_air:0 "铁鸟和巨炮"
 MGU_yuki_ship_air_desc:0 "我们的海军是弱小的，因此必须有空军对其进行联合作战，才能真正和列强有一战之力。"
 MGU_yuki_global_action:0 "此世间全部之恶..."
 MGU_yuki_global_action_desc:0 "自新纪元伊始，人类便如蝗虫遍布于世，屠我族类，灭吾文化，屠戮他者，攘灭四邻，曰尊王攘夷，曰文明开化，曰启蒙，曰共荣，自诩第一流而不知大劫将至..."
 MGU_yuki_invade_north_america:0 "光自新大陆来"
 MGU_yuki_invade_north_america_desc:0 "无论是法国人也好，远洋的东亚人又或者是所谓的精灵，都没有放弃对于南美的索求，门罗主义的影子笼罩在联盟的头顶，只等一声枪响，达摩克里斯之剑就会刺穿魔法少女的脑袋。那么，一个合乎常理的行动就此拉开帷幕——§R魔法少女们先下手为强，借那些野心家的脑袋一用§!"
 MGU_yuki_invade_soviet_union:0 "红十月的葬礼"
 MGU_yuki_invade_soviet_union_desc:0 "在几十年前，在舰炮的轰鸣声中，沙皇的帝国土崩瓦解，新生的苏维埃又用一颗子弹结束了这个无能者的一生。月代雪并不想走沙皇的老路，她也清楚自己早就在苏维埃联盟的清算名单上了，毕竟，她永远也忘不了野火革命军那帮丫头被处决前的眼神，她很清楚，如果不能利用好和圣杯的那一层关系来让这个红色巨人入土，那么入土的就是她月代雪了。"
 MGU_yuki_invade_China:0 "巨龙沉眠"
 MGU_yuki_invade_China_desc:0 "在巨龙苏醒之前，让她彻底睡着吧..."
 MGU_yuki_invade_Japan:0 "奈落之花，开在东京"
 MGU_yuki_invade_Japan_desc:0 "三途川并不是一个虚无缥缈的概念，至少对于现在的樱花国民来说不会再是了。作为海权大国，如果不借圣杯那支让人闻风丧胆的舰队把联合舰队和大和魂一起沉进海底，樱花帝国毫无疑问会在太平洋上肆意宰杀魔联军队。那么，就让来自地狱的奈落之花越过三途川开在东京吧。至于当地人嘛，殖民地的百姓又会有什么好的待遇呢。"
 MGU_yuki_set_puppet:0 "现在，轮到我们了..."
 MGU_yuki_set_puppet_desc:0 "那些自诩文明的人类在南美的土地上动刀兵，那么现在轮到她们了，恶鬼从她们的地狱里爬了出来。为你的命运悲哀吧，毕竟这是你先辈犯下的罪孽啊。只不过，月代雪在午夜梦回时分，有没有惊醒过。§R老来多惊梦，似有献刀人§!"
 MGU_yuki_invade_nine:0 "北美门户之战"
 MGU_yuki_invade_nine_desc:0 "在美洲大陆上，月代雪最视之为眼中钉的莫过于中美洲的那帮圣遗物使用者。一方面，意识形态的分歧是不可调和的火药桶，另一方面，如果联盟想要继续北上，那么这帮拦路虎是一定要被拔除的。现在，放弃你们可笑的梦想吧，接受你们的命运。"
 MGU_yuki_get_naval:0 "虎口拔牙"
 MGU_yuki_get_naval_desc:0 "樱花帝国现在已经变成了一个历史概念，那么作为一只死老虎，至少她们的残缺不全的利齿仍可以为我们所用。收缴她们的联合舰队残余专业人员，然后给个名分，就可以为我们所用了。"
 MGU_yuki_invade_Germany:0 "欧洲褐斑"
 MGU_yuki_invade_Germany_desc:0 "德意志已经归来，而她的兵锋直指欧罗巴乃至全世界，我们的处境很显而易见，要么消灭她们，要么被她们消灭。"
 MGU_yuki_no_culture:0 "历史的终结"
 MGU_yuki_no_culture_desc:0 "和历史上大多数征服者一样，魔联在每一个占领的地区推行了文化同化和魔法少女化进程。但是与今天的魔联相比，哪怕是成吉思汗或者沙皇见了也得为之汗颜，我们将走出更远的一步，我们不仅要求她们不做，不说，更要她们彻底忘记，忘记曾经的所有。"
 MGU_yuki_invade_england:0 "§R审判日§!"
 MGU_yuki_invade_england_desc:0 "§R艾玛啊，希罗啊，你们看见了吗\n看啊，胜利，自由，魔法少女的明天就差一步之遥了\n魔法的洪流冲走历史的尘埃，圣杯王国也将接受她的必然\n南朝四百八十寺，多少楼台烟雨中...§!"
 MGU_yuki_the_final:0 "终局...？"
 MGU_yuki_the_final_desc:0 "一切都结束了，对吧...？"
 MGU_yuki_pain:0 "为什么她们没有笑容..."
 MGU_yuki_pain_desc:0 "为什么？为什么？我们明明胜利了，为什么会这样？"
 MGU_yuki_why_they_are_unhappy:0 "那些失望的脸庞..."
 MGU_yuki_why_they_are_unhappy_desc:0 "那些事情真的就这么重要吗..."
 MGU_yuki_dead:0 "还有再也回不来的挚爱..."
 MGU_yuki_dead_desc:0 "我...我很抱歉...我不想这样的..."
 MGU_yuki_sorry:0 "对不起..."
 MGU_yuki_sorry_desc:0 "对不起...对不起...对不起...艾玛...希罗...梅露露...还有阿丽斯姐姐...我搞砸了一切...我...我...是我害死了所有人..."
 MGU_yuki_bye:0 "所以，永别了..."
 MGU_yuki_bye_desc:0 "也许啊，该被审判的不是人类...而是在漫长岁月里，被仇恨蒙蔽双眼，最后扭曲成怪物的魔女啊...所以，永别了..."
 MGU_yuki_show:0 "§R审判日§!"
 MGU_yuki_show_desc:0 "§R艾玛啊，希罗啊，你们看见了吗\n看啊，胜利，自由，魔法少女的明天就差一步之遥了\n魔法的洪流冲走历史的尘埃，圣杯王国也将接受她的必然\n南朝四百八十寺，多少楼台烟雨中...§!"
 MGU_yuki_recall_our_power:0 "重构联盟"
 MGU_yuki_recall_our_power_desc:0 "联盟内战，山河破碎，陈腐的，过时的，破坏的，都在枪炮中灰飞烟灭。联盟病了，联盟需要重构，联盟需要回到魔法少女。"
 MGU_yuki_a_necessary_path:0 "联盟防务工业"
 MGU_yuki_a_necessary_path_desc:0 "南美虽然是日落之地，但是这不代表我们面临的威胁就不足为惧。革命军，帝国，还有那些亡灵，妖精，诸如此类，都对我们的联盟造成着威胁。为此，我们需要尽快重建工业来武装我们的联盟。"
 MGU_yuki_develop_skillful_worker:0 "培养技术工人"
 MGU_yuki_develop_skillful_worker_desc:0 "现代化的生产需要专业的技术工人，然而，魔法少女长期依赖魔法战斗和生产，关于工业化的大生产流程，魔法少女显然缺乏相关的培训。我们可以尝试向圣杯寻求顾问和技术，来改善我们的生产体系。"
 MGU_yuki_magic_union_of_industry:0 "魔法工业部"
 MGU_yuki_magic_union_of_industry_desc:0 "现在国内的生产秩序相当混乱，各部门各行其是，浪费产能。我们将成立一个魔法工业部来统筹这些生产事务。"
 MGU_yuki_pay_for_magis:0 "与玛吉斯合作"
 MGU_yuki_pay_for_magis_desc:0 "虽然月代雪已经掌握了联盟的大权，但是玛吉斯仍然和我们分享着权力。好吧，虽然月代雪并不喜欢她们的思想，但至少在让魔法少女复兴这件事情上是一致的，那么我们也可以继续加深和玛吉斯的合作，来完善自身的工业体系。"
 MGU_yuki_mixed_body_of_industry:0 "工业复合体"
 MGU_yuki_mixed_body_of_industry_desc:0 "工业要和学术机构合作，我们也要对其给予大力支持，来帮助我们迅速工业化。"
 MGU_yuki_city_plan:0 "都市圈计划"
 MGU_yuki_city_plan_desc:0 "目前，魔法少女联盟的人口主要集中在几个大城市里。然而这导致了人口过于集中和城市承载能力达到极限的问题。我们将修建卫星城，来疏散部分人口，缓解压力。"
 MGU_yuki_highway:0 "道路修建计划"
 MGU_yuki_highway_desc:0 "想要实现高效的社会运转和工业发展，道路的发展是必不可少的。"
 MGU_yuki_put_efforts_to_industry:0 "批准建设基金"
 MGU_yuki_put_efforts_to_industry_desc:0 "社会的工业化需要原始资本和启动资金，那么我们来给他们提供这笔钱。"
 MGU_yuki_armys_factory_new:0 "魔法少女军工厂"
 MGU_yuki_armys_factory_new_desc:0 "不要忘了，我们周围群狼环伺，没有猎枪，就只能沦为猎物..."
 MGU_yuki_dig_for_resources:0 "发掘潜在资源"
 MGU_yuki_dig_for_resources_desc:0 "我们目前极度缺乏铁和镍等工业常见的基本原料，购买进口资源又会浪费大量资金，还会出卖自身安全。不过地质学家测算我们的国家仍具有未发觉的金属资源，或许可以为我们提供一些帮助。"
 MGU_yuki_law_and_order:0 "纪律和指令"
 MGU_yuki_law_and_order_desc:0 "魔法少女长期自由散漫，而工业社会需要纪律，所有我们必须强调，没有纪律，就没有未来！"
 MGU_yuki_eng_official:0 "邀请圣杯指导"
 MGU_yuki_eng_official_desc:0 "南美洲作为货真价实的第三世界，技术和工业对我们来说更像是一个可望不可及的东西，但是圣杯王国却有着这一切。我们可以借助我们圣杯盟友的身份向他们寻求技术指导。"
 MGU_yuki_army_law:0 "军事化管理"
 MGU_yuki_army_law_desc:0 "对于一部分重要产业，我们可以尝试进行封闭式管理，把军队的纪律引入工厂，来实现铁腕生产。"
 MGU_produce_resource:0 "合成材料技术"
 MGU_produce_resource_desc:0 "南美缺少石油和橡胶等战略资源，那么，我们唯一能保证资源稳定产出的办法就是使用合成技术了。"
 MGU_annouce_success_in_industry:0 "宣布工业计划大成功"
 MGU_annouce_success_in_industry_desc:0 "我们已经实现了第一个工业计划的目标，让我们为自己欢呼！"
 MGU_yuki_nation_guard:0 "军靴和宪兵"
 MGU_yuki_nation_guard_desc:0 "在我们选定了军队的发展方向后，我们需要开始真正进行军事改革了。现在的联盟军队弊病丛生，想要成为一支真正的军队还有很长的路要走。"
 MGU_yuki_set_army_school:0 "扩大军费预算"
 MGU_yuki_set_army_school_desc:0 "我们长期以来对于军队的忽视导致了严重的问题，我们的军队堪比一群乌合之众，内战有余，面对革命军或者帝国却无能为力。那么第一步就是提高军队地位，扩大军费支出。"
 MGU_yuki_magic_support:0 "魔法科技支持"
 MGU_yuki_magic_support_desc:0 "我们的军事学家和科研部门告诉我们了一个好消息，现代科技已经成功结合了传统魔法，我们应当立即普及这种新的作战思路。"
 MGU_yuki_mojo:0 "强袭魔女"
 MGU_yuki_mojo_desc:0 "一战末期的德意志帝国采取了一种名叫风暴突击队的战术，东线的拳击行动更是直接击溃了沙俄。我们也将学习这种战术，让魔法少女发挥她们的突破优势。"
 MGU_yuki_save_in_wild:0 "韧性计划"
 MGU_yuki_save_in_wild_desc:0 "南美的地形相当的糟糕，雨林，河流还有其他的各种恶劣环境无时无刻会要了那些养尊处优者的命。我们的士兵必须人人都是雄鹰，人人都要接受野外极限训练，一遍在雨林中作战。"
 MGU_yuki_magic_supply:0 "魔法补给兵"
 MGU_yuki_magic_supply_desc:0 "部队训练反应出一个问题，那就是雨林的恶劣环境不利于常规补给的输送，不过我们是魔法少女啊，魔法也许会有奇效。"
 MGU_yuki_magic_storm:0 "完善风暴突击队"
 MGU_yuki_magic_storm_desc:0 "随着军队改革的完善，我们有必要再度审视我们的强袭计划，将其再度完善。"
 MGU_yuki_information_staff:0 "信息化联队"
 MGU_yuki_information_staff_desc:0 "军队的效率很大程度上受制于他的通信技术，为此我们需要加大对于通信技术的研究和应用，来实现灵活调动。"
 MGU_yuki_fire_now:0 "火炮齐鸣"
 MGU_yuki_fire_now_desc:0 "无论什么时代，火炮永远是战争之神，那么，部署火炮把吧，另外也不要忘了我们的魔法炮。"
 MGU_yuki_suport_line:0 "工程支援连"
 MGU_yuki_suport_line_desc:0 "除了在前线战斗的士兵，后方的支援也是极为重要的，我们应该更多关注这方面。"
 MGU_yuki_wolf:0 "国家突击犬"
 MGU_yuki_wolf_desc:0 "忠诚，强大，嗜血，美丽，这就是我们的部队该有的样子，她们是我们的利刃，是嗜血的猎犬，是国家和魔法少女的突击者。"
 MGU_yuki_magic_point:0 "魔女因子武器化"
 MGU_yuki_magic_point_desc:0 "我们注意到，魔女因子除了可以让人失去理智，也可以极大幅度提高士兵的耐受性。那么，我们也许可以考虑将其武器化和防具化。"
 MGU_yuki_magic_get_used_to:0 "适应魔法"
 MGU_yuki_magic_get_used_to_desc:0 "我们的军队必须能够更好是适应南美雨林的环境，魔法也许可以提供帮助。不过再军工产业方面，我们的魔法也许也可以有意想不到的作用，比如提高恶劣环境下工作效率。"
 MGU_yuki_magic_bullet:0 "附魔弹头"
 MGU_yuki_magic_bullet_desc:0 "普通的子弹也许会被装甲轻易挡住，但是我们的魔法子弹可不会。"
 MGU_yuki_magic_puppet:0 "魔法使魔"
 MGU_yuki_magic_puppet_desc:0 "如果直接派出魔法少女或者凡人部队去做侦察工作，那么毫无疑问会造成伤亡，且较大的体型也容易被发现。使魔很好的解决了这个问题，我们将把她们派上战争作为侦察手段。"
 MGU_yuki_magic_armor:0 "装甲魔法化"
 MGU_yuki_magic_armor_desc:0 "我们的装甲部队除了科技的加持，也可以尝试使用一些魔法手段来帮助其生存和攻击。"
 MGU_yuki_magic_legacy:0 "魔女的遗产"
 MGU_yuki_magic_legacy_desc:0 "我们不会忘记伤痛，也不会忘记魔女们曾经的辉煌，那么是时候让这种辉煌再现于世了。"
 
#事件本地化
 yuki.1.t:0 "晌午"
 yuki.1.d:0 "樱羽艾玛其实并不喜欢开会，毕竟没事干谁会喜欢坐在那件闷热的议会大厅里几个小时呢。艾玛望向了坐在边上的二阶堂希罗，她的黑发盖住脸，趴在桌上一动不动。“喂，希罗酱。”艾玛用手肘戳了戳了希罗的背部，希罗毫无反应，只有背部有轻微的起伏告诉别人她在和爱丽丝一起梦游仙境。\n\n主席台上，梓美冬还在絮絮叨叨的念个没完车轱辘话，什么玛吉斯和平条约的注意事项，前排的要员们认真的抄录着要点，不过艾玛和希罗这种普通议员则对此并不在意，大多数都坐在中后排发呆或者拿着笔在纸上随便涂涂画画，当然，像希罗这样直接倒头就睡的也就是特例。按理说这种行为是要被处分的，不过考虑到上次议会议长来找希罗时被骂了个狗血淋头，说什么让她来参加这种和她毫无关系的议会是错误的，气的议长差点给她革职，最后碍于二阶堂家的势力还是妥协了之后，就没人再来找这种不愉快了。\n\n艾玛百无聊赖的盯着角落里看，正想着中午吃啥的时候，一个少女匆匆忙忙的从门口闯了进来，在众人不悦的目光下从后门走向了议员席，手里拎着一个鼓鼓囊囊的公文包。\n\n艾玛看着这个少女，一股恶寒爬上了脊梁。由于刚才的喧闹，希罗也迷迷糊糊的醒来了，然后目光就锁定在那个新来的少女身上，显然她也感觉到了不对劲。少女逐渐走到她们眼前，手正准备拉开公文包时：..."
 yuki.1.a:0 "希罗没能阻止她，炸弹被引爆了，爆炸波及了整个议会"
 yuki.1.b:0 "希罗一把按住了她，未激活的炸弹从公文包里滚落"
 yuki_1_a_name:0 "§R这将会导致严重的后果...§!"
 yuki.2.t:0 "\n\n\n\n\n\n[news_event_spec_logo]\n\n\n\n\n\n\n\n                                                                                                                                                       魔法少女联盟议会发生爆炸案"
 yuki.2.d:0 "就在近日，魔法少女联盟传来了惊人的消息：一名左翼议员因对现状不满而在议会上引爆了炸弹，根据事后统计，一共有十人不幸遇难，另外有三十二人受伤，凶手当场死亡。受害者大多数为玛吉斯之翼的成员。相关机关对此案的调查显示凶手与南美极左翼组织“野火革命军”有密切联系。\n\n晓美焰在新闻发布会上表示：我们沉痛悼念不幸逝去的同胞，并对她们的遭遇表示遗憾。同时她也表示为了捍卫民主，将会对极左翼激进分子实行更加周全的监视和限制。\n\n国际社会目前普遍认为这将会让魔法少女联盟来之不易的脆弱民主蒙上一层阴影，也有人质疑这种反极端主义措施是否会成为另一段政治恐怖时代的开始。"
 yuki.2.a:0 "不幸的消息"
 yuki.2.b:0 "我就说她们的天真幻想会自食恶果"
 yuki.3.t:0 "葬礼"
 yuki.3.d:0 "见泷原市在下雨。司仪在公墓前以低沉的声音，诵读着悼词。“二阶堂希罗，长期刚正不阿，对于一切的罪恶都绝不姑息，我们悲痛的失去了这位...”墓地的空地上放着一口棺木，二阶堂希罗就静静地躺在棺木里，小小的身躯像一个人偶一般摆放在白布包裹的棺木内侧。棺木两旁的朋友和亲戚脱帽向希罗做最后的告别，二阶堂夫妇则是早已泣不成声。\n\n在队伍的角落里，一个穿着学生西装的白发少女一言不发的混迹在人群中，眼神直勾勾的看着希罗的遗体，表情木讷。\n\n半晌后遗体下葬，其他人三三两两的离去了，也包括抹着眼泪的二阶堂夫妇，只有少女仍然站在那里，嘴里还在喃喃低语着：“为什么，为什么，希罗为什么要这么早离开我。”少女的拳头攥紧，一行清泪划过脸颊。"
 yuki.3.a:0 "她们必须付出代价，希罗，§R我会让她们血债血偿§!，§C以我大魔女月代雪的名义起誓§!"
 yuki.4.t:0 "蒙上血泪的照片"
 yuki.4.d:0 "心电检测仪的“滴滴”声是护士换完营养液之后病房里唯一的声音。月代雪坐在病床前，病床上躺着一位粉色头发的少女——樱羽艾玛。虽然捡回了一条命，但是代价是爆炸的冲击波导致了她就此陷入昏迷。\n\n月代雪无数次哀求过医生，表示无论多少钱，什么代价她都会帮忙出的。但是得到的回复只有一句冰冷的无能为力。\n\n“艾玛，你知道吗，我刚刚去送希罗了，她就那么躺在那里，好孤独，好渺小...就像，就像你一样。”月代雪无法控制自己的眼泪不再流下，泪珠滴落在西装上，溅出一朵朵如同绽放的血花一般的水韵。\n\n月代雪颤巍巍的拿出一张照片，那是她们在高中时期照的，希罗，艾玛和月代雪，三个人穿着校服坐在天台上看夕阳，艾玛高兴的像个孩子。照片上滴落了泪水，模糊了希罗的脸，“我好想，再和你们一起坐在天台上啊，我们一起看落日，一起吃路边的关东煮，一起...”\n\n病床上的艾玛依旧静静的躺着，小雪看着她，似乎希罗躺在棺材里的身影和艾玛的躯体开始重合，然后随着哀乐缓缓陷入漆黑的地底。\n\n“不，不要，不要走，艾玛。”月代雪伸出手想要拉出艾玛，摸到了一双温热白皙的小手，黑暗褪去，艾玛仍然静静的躺在床上，但是月代雪的心里有什么东西“咔哒”一声碎了。"
 yuki.4.a:0 "艾玛，我一定会保护你，§R无论代价有多么高昂...§!"
 yuki_1_b_name:0 "§C民主制度幸存§!"
 MGU_yuki_stop:0 "§Y局面没有失控§!"
 yuki.6.t:0 "老朋友"
 yuki.6.d:0 "神滨市的四季雨水都不少，淅淅沥沥的雨冲刷了火药味逐渐浓厚的联盟，也冲刷了那刚刚解严的喜悦。联盟该何往，少女们人心惶惶。街角的咖啡馆，就像幻想乡街角的那些一样，似乎刺杀的风波没有波及到这一片在幻想乡大革命时期也不会被街垒流弹侵袭的避风港。\n\n当然，三位玛吉斯显然无缘消受这一份喜悦。里见灯花，阿莉娜和柊音梦围坐在一张圆桌前，玛吉斯之翼在一天内同时失去了梓冬美和蓝家姬奈两位话事人，一时间少女们群龙无首。\n\n里见灯花首先抿了一口咖啡，向其他两人提议直接由三位玛吉斯直接接管玛吉斯之翼。这一决定很快遭到了反对，虽然和平解决了和联盟的矛盾，但是作为刚刚归顺的前叛乱分子，这一行为无疑会招致其他党派的警惕，其他的魔法少女们显然也对此不会买账。\n\n阿莉娜则是提议解散玛吉斯之翼，并入议会中央。当然这个说法连她自己也没有说服，毕竟这就意味着直接投降了，是对于死去的少女的不尊重。\n\n最后，柊音美缓缓吐出一句话："
 yuki.6.a:0 "“你们觉得月代雪怎么样”"
 yuki.7.t:0 "新面孔"
 yuki.7.d:0 "玛吉斯之翼的成员们在台下嘈杂不已，爆炸案带来的阴影还未消退，议会大厅的一角还带着爆炸残留的焦黑，自然的，少女们自觉的远离了那一片不详的是非之地。\n\n“哎，你听说吗，好像玛吉斯们说要解散玛吉斯之翼了”一名黑羽和另一个少女切切喳喳。“哎呀”一拳头砸在她脑袋上，一名白羽脸上不悦，“不要散播恐慌，说什么呢你。”那名黑羽悻悻地继续保持沉默。好吧，其实也没保持多久。\n\n“各位，安静一下，”里见灯花站在一个箱子上，努力的把自己的上半身探出演讲台。台下的少女们停下了窃窃私语，转头望向这位玛吉斯。\n\n“各位，首先我们为逝去的少女们默哀，发生这种事情，我们始料未及。但是，我们还是得关注于玛吉斯之翼的未来发展状况。”有一个白羽站起来疑惑道：“三位玛吉斯们不能像以前一样直接自己做决策吗。”灯花苦笑了一下，“各位，我们虽然已经和联盟和解，但这不代表我们不会被其他人当成“叛徒”看待。所以，我们还是需要一个新的面孔来担此大任的。”随后，灯花从箱子上跳下，一名穿着西装的白发少女面对着硕大的议会大厅，笑了一下：“各位，我叫月代雪...”"
 yuki.7.a:0 "“你们愿意成为我的共犯吗”"
 yuki.8.t:0 "不信任议案"
 yuki.8.d:0 "七海面露苦涩，此时此刻哪怕是聚光灯打在她身上也能没有了往日的那种精神和自信。台下密密麻麻的坐着各党派的议员，少女们或屏息凝神，或面露不安，只有玛吉斯之翼们面露得意，而巴麻美则是一如往常的面色平静。\n\n七海苦笑一声，就像是4年前魏玛共和国的社民党议员那样，她很清楚在爆炸案之后，民主的前途就已经被议会坍塌的砖块掩埋了，不信任议案则是给着脆弱的民主盖上了最后一块棺材板，这也许就是最后一次真正意义上的民主程序了。随后，她清了清嗓子，向台下宣布：“那么，宣布不信任议案的表决结果，最后的结果是，”她几乎要哭了，“不信任议案通过，另外，根据另一项表决结果，下一任联盟盟主是...”"
 yuki.8.a:0 "“月代雪...”"
 yuki_new_tree:0 "§R将加载新的国策树§!"
 yuki.9.t:0 "红茶，胜利，魔法少女"
 yuki.9.d:0 "巴麻美其实并不想和曾经的好友们刀剑相向。\n\n然而，最近的军队状况让她难以放心。军队异常调动，海军私自出港，这些还只是小事，更令人不安的是民间的准军事组织，比如联盟民主青年团等民兵分子，被报告近期活动异常增加，且装备和人员都得到大量补充。\n\n巴麻美知道，现在情况已经到了无法挽回的地步。也许她应该和昔日好友们一起对抗所谓的暴君月代雪，但是挽回了民主之后呢，魔法少女们就得救了吗？异见分子可以登堂入室炸毁议会，她的朋友们，其他和她一样的魔法少女，难道就不会步死者的后尘了吗？\n\n思索良久，她拿起了电话..."
 yuki.9.a:0 "“帮我接佐仓杏子和沙耶香”"
 yuki.10.t:0 "逝去的不会再回来"
 yuki.10.d:0 "一本本日历被撕下，马孔多在下雨。她们是怎么称呼我们的？香蕉园，殖民地，后花园...悲苦百余载，自从殖民者用她们的所谓枪炮轰开了魔法少女和南美的头颅，再把她们所谓的自由民主灌入拉美大陆。\n\n无量英雄无量血，似乎换来了自由和独立。但惜换得旧人间，肉食者弹冠相庆，虚假的独立冠以民主之名。\n\n奶与蜜的流淌之地，血和骨的埋葬之地，黄金国的美名由魔法少女的苦难来奠基。半个世纪骨肉相残的记忆，光耀的圣杯旗，将被魔法少女暴起扯下。"
 yuki.10.a:0 "而未来尤可追。"
 yuki.11.t:0 "回信"
 yuki.11.d:0 "致月代雪小姐：\n我们已经获悉了近期国内的动荡状况。作为玛吉斯之翼的一份子，我很高兴您在当选后仍记得玛吉斯的愿望，以及全世界魔法少女的解放，我再次向您致以崇敬敬意。\n\n我们今日也收到了所谓民主派的来信，信中指控您忘记了玛吉斯的愿望只希望夺取权力享福，组织内一部分人动摇了，但感谢您提供的证据和来信成功澄清了这一点。\n\n作为三位玛吉斯之一，我在此代表三位玛吉斯向您承诺将会提供包括武装力量在内的一切支持。\n\n此致\n\n里见灯花"
 yuki.11.a:0 "感谢你们的帮助"
 yuki.16.t:0 "一封最后的信"
 yuki.16.d:0 "月代雪小姐，你好：\n\n在你看见这封信的时候，我已经在南方了。我在内战中见到了太多人因为战火流离失所了，我见到那些因为战争失去家人的孩子在废墟上哭泣的样子。所以，说实话，我本不想这么做，因为这意味着再一次骨肉相残。\n\n然而，我更清楚绝望的破坏力，她会让一个少女变成怪物，她会让朋友相残，因此我必须让少女们见到希望，必须要结束她们的恐惧和绝望.\n\n然而，月代雪小姐的行为无疑是在让这个国家和无数魔法少女坠入暴政和绝望的深渊，您也许有自己的苦衷，但我也不能让过去无数岁月中无数次发生在见泷原的惨剧发生在全联盟。\n\n希望您好自为之。\n\n落款：晓美焰"
 yuki.16.a:0 "你也要知道，反抗不会有结果的..."
 yuki.17.t:0 "南方集团军切断了通讯渠道。"
 yuki.17.d:0 "我们的最后通牒被无视了！晓美焰拒绝了一切和平谈判的可能性。军队已经陈列在控制区的边境，晓美焰发布公开声明要“消灭暴君”。"
 yuki.17.a:0 "她们很清楚另外一种选择是什么。"
 yuki.19.t:0 "晓美焰和鹿目圆的逃离"
 yuki.19.d:0 "在我们的军队即将攻入南方叛军最后的据点时，一架飞机自机场起飞，目标似乎是圣杯王国。鹿目圆和晓美焰已经被报告位于那架飞机上，目前已经离开联盟空域。"
 yuki.19.a:0 "无关紧要"
 yuki.20.t:0 "\n\n\n\n\n\n[news_event_spec_logo]\n\n\n\n\n\n\n\n                                                                                                                                                       魔法少女联盟再陷战火"
 yuki.20.d:0 "近日，最令人担忧的消息传来了：魔法少女联盟在结束了内战没多久后，就陷入了严重的政治撕裂中。激进民族派和原民主建制派的分歧日益巨大，政治暴力和街头混乱层出不穷。而就在昨日，晓美焰已经宣布公开起义，宣称为了捍卫民主和魔法少女的未来而战。作为回应，月代雪为首的中央政府则在边境部署了军队，并且于今日越过控制区边境。国际社会普遍认为这是第二次内战的开始。"
 yuki.20.a:0 "事情开始起变化"
 yuki.20.b:0 "令人不安"
 yuki.21.t:0 "梦（其一）"
 yuki.21.d:0 "“我在哪里”月代雪从松软的床上醒来，空气中弥漫着一种熟悉的水汽和湿润感，这是一种很久前就已经失去的体验，但是即便如此，她也忘不了，这是魔女岛，她的家乡的味道。月代雪揉了揉眼，有些不可思议，双眼聚焦于宅邸的细节处，吊灯，红色的墙纸，华丽的装潢，不同于拉美风格的建筑，月代雪这才有了回家的实感。\n\n不同于往日的死寂和破败，似乎有一些东西刺激到了她习惯于孤寂的大脑，这是她日夜怀念的声音，感觉是....其他魔女的声音！而且似乎有人在呼喊着她的名字。月代雪一个踉跄下床，扑倒在窗台上，脑袋探出窗外，院子里不是萧瑟破败的样子，而是围坐了二三十个少女，其中一个抬头看见了她的窘态，忍不住扑哧一声的笑了出来，“小雪啊，怎么过个生日激动的连路都不会走了。”月代雪眼里出现了一双无数日夜魂牵梦绕的脸，黑色长发的少女，水精魔女阿丽斯，正朝着她露出一个纯洁的笑容，这是她在人类社会中几百年未曾见到的天使般的笑容。\n\n她再也无法抑制住自己的眼泪，一个飞身下楼搂住了对方，趴在对方的肩膀上不住抽泣。“怎么了，小雪，”阿丽斯被月代雪突然的举动吓了一跳。“我...我好想你们..”月代雪泣不成声，“我做了一个梦，梦见你们都死了，被人类杀了。”阿丽斯无奈的摸着宛如小孩一般的月代雪的头，抚摸着她松软长顺的头发，“那群凡人怎么可能能杀死魔女呢，何况我们和她们无冤无仇，为什么会有人无缘无故的干这种残忍的事情呢。”其他的魔女也围上来对她说：“你可是大魔女，怎么可以在众人面前哭鼻子呢。”月代雪这时才反应过来，自己现在是在其他晚辈面前，自己必须得维持一个大魔女的尊严，正了正脸色，几滴泪仍然残留在眼角，“对，今天生日，不能哭着过生日。”"
 yuki.21.a:0 "“得笑啊”"
 yuki.22.t:0 "梦（其二）"
 yuki.22.d:0 "在魔女岛的日子不紧不慢的过去了，有时候月代雪几乎要忘记那一个噩梦了，那个亲人朋友族人被人类屠杀殆尽，自己颠沛流离的噩梦。雪现在常常会和阿丽斯在黄昏时分在海滩上感受着海浪冲击着双脚。不知怎么的，雪经常会望着海的尽头陷入发呆，阿丽斯总是笑着打趣说大魔女大人变傻了，魔女们要听一个笨蛋的话了。月代雪总是笑一笑，然后点着阿丽斯的鼻子说：“那阿丽斯姐姐就接替我，当一个笨蛋的接班人。”\n\n又是一个黄昏，月代雪问了一个问题：“阿丽斯，我已经问过这个问题多少次了。”阿丽斯依旧在笑，“你终于想起来了吗，小雪。”话音刚落，噼噼啪啪的火焰响声自身后传来，月代雪惊恐的回头一看，魔女岛笼罩在火海里，少女们四散奔跑，被士兵持枪射击，倒在了血泊里，试图抵抗的大魔女们被红衣大炮轰成了齑粉。“不...不...不要啊！”雪撕心裂肺的喊了起来，发疯一样试图拦住一个士兵，但是士兵像是没看见她似的，这是，一只手搭在了月代雪腿上，雪回头一看，阿丽斯像一个布袋散落在沙滩上，身后留下一条血红的通道，“小雪，不要哭，要笑，活下去，为了阿丽斯姐姐，活下去好吗。”“啊啊啊啊！”月代雪扑在阿丽斯身上，“不要，不要丢下我一个人，不要走，阿丽斯不要走。”但是阿丽斯此刻依然一动不动地趴在了沙滩上，涨潮的海水逐渐把她拖向深渊。月代雪拉住阿丽斯的手腕，眼泪落在海水里，消失的无影无踪，身体不断向后退，一只手抓住了那杆在火光，惨叫声和血腥气里飘扬的卡洛斯旗，“阿丽斯，我不会再让你离开我了。”月代雪抽泣着拉扯阿丽斯的身体，却无济于事，最后阿丽斯逐渐消失在黑暗里，雪也因为体力不支而脱手。\n\n“那边还有一个，把她杀了，然后把那些香料和宝石搬上船。”背后一个男声喊道，雪缓缓转过头，眼里不再是悲哀和伤痛，而是似乎比火光更炽热。子弹袭来，穿过了她的身体，血从弹孔流出，在衣服上留下一个个红色的圆圈，但是雪任然是站着，为首的男人有些惊恐，但很快恢复了狠厉的模样，“继续开枪，不要停，为了国王！”更多的子弹呼啸而来，然而仿佛打的是一个假人，雪依旧纹丝不动。随后，一个抬手，一颗巨石飞向了一队士兵，将他们也砸为烂泥。“怪...怪物啊！”军官丢下武器向着船上飞奔，下一秒，船连带着那个军官一起在爆炸声中化为乌有。剩下的士兵吓的瘫倒在地，随后被一个个撕成两瓣，脏器横飞，最后的士兵看着浑身血污走来的雪，就像看着地狱的恶鬼向他爬来。“不要杀我，我还有妻子，还有孩子，还有...啊！”雪没有等他说完，随手将他也烧为灰烬。这时，雪才觉得意识模糊，随后也倒在了沙滩上。"
 yuki.22.a:0 "雪从梦中醒来，眼角泪眼婆娑。"
 yuki.23.t:0 "落灰的相片"
 yuki.23.d:0 "又是一个黄昏，神滨市医院里弥漫着消毒水的气味，空旷的走廊里摆着空置的担架和轮椅，一道橘黄色的光芒从被十字分割的窗户口射入，把打盹的护士照的金黄。\n\n一个穿着黄色大衣，头戴墨镜的少女在桌上敲了敲，护士睡眼惺忪的抬起头，不耐烦的嗯了一声，“探亲吗，找谁。”少女没说话，只是拿出一张泛黄的照片，白色的边框围堵着昏黄的背景，和天台上的三个学生。少女用手指了指其中一名女孩。护士把照片拿过去，按在患者名单边比对了一番，“哦，樱羽艾玛啊，522病房，走廊尽头左转第一间。”说罢把照片递了回去。少女不知道自己是怎么走到病房的，也许这段时间有几百年之长，长到好像和她被迫从魔女岛目睹阿丽斯的死亡后流亡至今一样的让她麻木和空虚。\n\n病房里很干净，也很空，白色的墙，白色的床，白色的被子，白色的窗，只有窗口被夕阳照到的地方是格格不入的橙黄色。少女脱下墨镜和大衣，露出了一件整洁的老式校服。\n\n艾玛依旧像上次那样平躺在白色中，粉色的头发松散的摊开在洁白的被褥表面。不知怎么的，少女看着艾玛，又想到了神滨市郊外的那个雨天，希罗的葬礼，悲痛的人群，和茫然的少女。她握起艾玛的手，手是温的。少女突然像是想到了什么，从挎包里拿出一把鲜艳的假花，放在艾玛的床头。“对不起，艾玛，我太没用了，”少女带着哭腔，”我连花都只能买假的给你，因为我这么让人讨厌，这么没用，身上总有异味，靠近的花都会枯死，只能拿着假花骗人。”“艾玛，还记得好几年前吗，那个时候我也是这样，又臭又讨人厌，这么肮脏的我，这么糟糕的我，只有你和希罗接纳了我，你和希罗带着我看夕阳，让我就像一个普通的女孩子一样，和朋友一起吃饭，一起上学，放学一起回家，一起说笑打闹，这段时间是我自从流亡以来最快乐的时光。艾玛，我觉得我像一朵假花，我告诉其他人的背景是假的，告诉别人的过去是假的，我的本质多么糟糕，多么肮脏，是一具毫无生气的死物。”"
 yuki.23.a:0 "“但是，这么糟糕的我，你却接受了。”"
 yuki.24.t:0 "昼梦"
 yuki.24.d:0 "“哈哈哈，怪物，滚出去。”几个脸上还带着稚气的女生站在门边，“你是有爹娘生没爹娘养的吗，每天那个穷酸样，衣服脏成那样，你是从泥地里爬出来的吗。”月代雪趴在地上，脸上依旧带着那迟钝的表情。“哎，你这是什么反应，你倒是骂我们啊，废物，你是木头吗，”其中一个高挑的女生气的指着月代雪鼻子，然后径直走到了一张被涂满涂鸦的课桌前，从课桌里拖出来那个被写满了“怪物”“去死”的书包。高挑女生把书包倒过来抖动，钢笔和破烂的书本在纸张翻页的哗哗声中掉落在冰冷的地板上，就像抖筛糠一样。短发女孩走到一地的书本边，对着月代雪露出了一个残忍的笑容，随后一双沾满了操场泥土的靴子碾在了被涂鸦画满的摊开的书页上。“帮你这个木头的书加点青春活力，”短发女孩对着月代雪又投来了一个挑衅的目光，脚没有停下来，依旧在书本堆上来回碾压。“脏死了，还给你。”短发女孩一脸嫌弃的捏起课本，一本本的丢到了门外。\n\n月代雪手忙脚乱的笨拙的捡着满地沾染鞋印和泥浆的课本和文具，笨手笨脚的装进被泼了墨的书包里。这时，一双手碰到了雪那双纤细而沾满了泥土的手，雪抬头，和一个头戴贝雷帽的少女四目相对。“那个，我....我叫樱羽艾玛，你没事吧，如果，你不介意的话，我来帮你捡吧...”雪的嘴角抽搐了下，心里似乎感觉到了一些东西，一些自从阿丽斯死后就一直暗淡无光的东西，一种在日复一日为了复仇而隐藏自己的内心中被抛弃的东西。\n\n樱羽艾玛被雪的默不作声吓了一跳，“对不起，打扰到你了吗，如果你介意的话我现在就走..”“没...没有”雪慌忙说到，眼里似乎多了些东西，那是一种往日里没有见到过的慌乱，和一丝不易察觉的泪光。艾玛松了口气，摸着雪的脸：“你怎么把自己搞成这样了，衣服都脏了要洗啊，”艾玛看向了破烂的书包，“书包也破了啊，我还有一些剩下的零用钱，我们一起去买书包，然后去买一身新衣服，再洗个澡...额，应该是够的吧，我数数啊，”“唉，我来出吧。”希罗不知道何时已经站在了艾玛背后，“真是的，霸凌这种事情是不正确的，有这种事情艾玛你怎么不和我说啊，钱我来出好了。”雪一脸茫然的看着眼前穿着整洁气质不凡的少女，艾玛慌忙介绍道：“啊，这位是二阶堂希罗，也是我的朋友哦。”“朋友...吗...”雪思索着，努力的回忆这个词汇的含义，似乎是很遥远的记忆，雪只记得一片甜蜜的感觉，朋友是甜的，雪如此想到。\n\n第二天，雪站在艾玛和希罗中间，穿着崭新的制服，和其他的少女一样结伴上学，虽然依旧很别扭，但雪仍然尝试着“发自真心的笑”和“发自真心的交谈”。霸凌她的短发少女远远的站在门口，想要把墨水泼出，但是被希罗蹬了一眼又畏畏缩缩的退了回去。\n\n雪感觉自己内心有什么东西融化了，坚冰在夕阳下化成了甜甜的蜜水，三个少女在相机镜头背对着余晖，“朋友是甜的，就像草莓蛋糕一样。”雪如此想到。"
 yuki.24.a:0 "“也许，阿丽斯也希望我这样吧。”"
 yuki.24.b:0 "§R“但是，如果你们不在了怎么办...”§!"
 yuki.25.t:0 "炉边夜话"
 yuki.25.d:0 "神滨市的夜晚被霓虹灯点亮，玻璃外墙反射着大屏幕招牌和彩灯的光芒。月代雪把一捆柴丢进壁炉里，火舌肆虐，“噼噼啪啪”的点点火星炸开，并不算宽敞的房间内被火光照成橘黄色。门“吱呀”一声被推开了。“晚上好，月代雪小姐，”一个稚嫩的声音响起，“真抱歉这么晚了还来打扰你。”“没关系哦，灯花，我本身就不习惯早睡或者通宵办公，更何况现在也不算很晚。”里见灯花笑了一下坐到月代雪对面，那张哥特风格的软垫座椅上。火炉依旧“噼噼啪啪”的作响，灯花看着雪那张被炉火映红的脸，那是一张年轻，精制但疲惫的脸，“看来雪小姐最近休息的不怎么好呢，”里见灯花打趣道。月代雪苦只是苦笑一下，“真是世事无常啊，不是吗。”\n\n“是啊，世事无常，谁也这不知道明天和灾难哪个先来，就像魔法少女们长期不知道绝望和明天的太阳哪个先来。”里见灯花拿起桌上的红茶，抿了一口，“雪小姐，我此生都致力于让魔法少女活在一个没有魔女和绝望的世界里，因此我们创立了玛吉斯之翼，当然，我很高兴你能有和我们一样的理想并加入我们，但是，现在你是联盟的领导者了，说实在的，我从未想过玛吉斯之翼可以如此之快的掌握联盟，我也很清楚，外部环境不会给我们多少和平的时间了，北边的帝国，还有西边的那群极左翼恐怖分子和嗜血君主，我也理解雪小姐重整军备的心情。”里见灯花顿了一下，表情有些微妙的变化，“但是，魔法少女的日常也应该是我们珍视的对象，你说对吧，雪小姐，我现在担忧的是，会不会有一天，本来应该用于保卫魔法少女的利剑却变成了催生魔法少女绝望的帮凶。”\n\n月代雪表情很平静，似乎早就知道灯花会这么说，“灯花，你是担心我背叛玛吉斯之翼，变成欺压魔法少女的暴君吗”“没...没有...”灯花红着脸否认，“我只是担心...担心...”“没事的灯花，我理解，毕竟现在我是联盟盟主，又是玛吉斯之翼的临时第四位玛吉斯，担心我滥用权力也是正常的，”月代雪笑了笑，似乎是为了缓解尴尬的气氛，“我自己也经历过颠沛流离的生活，为此我绝不会让这种事情重演，家破人亡的惨剧绝不能再上演。”说罢递给灯花一份文件，灯花的脸色一点点的红润了起来。“联盟救济法案，收入保障法案，”灯花放下文件，脸色一扫先前的顾虑，“看来我真是没看走眼呢。”"
 yuki.25.a:0 "“雪小姐，总有一天我们的诞生会像圣诞节一样被全世界庆祝”"
 yuki.27.t:0 "\n\n\n\n\n\n[news_event_spec_logo]\n\n\n\n\n\n\n\n                                                                                                                                                    南美内战结束"
 yuki.27.d:0 "近日，南美地区的战事逐渐平息，魔法少女联盟和圣杯远征军的同盟消灭了所有其余的南美军阀统一了南美大陆。\n魔法少女联盟盟主月代雪小姐和副盟主里见灯花表示，将会致力于和各国保持良好的关系和贸易往来，并用强硬立场捍卫魔法少女的尊严和利益，保护世界的民主和和平。\n月代雪的助理冰上梅露露小姐也表示，南美将会一以贯之的维护和各国的友谊。\n然而，有国际评论家指出，魔法少女联盟至今仍然处在由于刺杀案和南美混战的戒严状态，联盟的未来仍然不明朗。"
 yuki.27.a:0 "至少和平了，不是吗..."
 yuki.27.b:0 "仍待观察"
 yuki.28.t:0 "魔法的奇迹....?"
 yuki.28.d:0 "晨风吹进了少女的书房，眼皮眨动，少女此刻意识到自己已经趴在自己的书稿上睡了一宿之久，头发蓬松，身上带着难闻的汗臭味，身体也有些梦魇导致的不听使唤。也许是好几个晚上不眠不休的结果吧，少女下意识想到了之前不知道在哪听说睡眠不足会导致虚汗和梦魇。“算了，想这个有什么用”少女扭头瞥了一眼窗外，天空大体还是蓝墨色的，不过海面上有了一些鱼肚白。街上已经陆陆续续有拎着包打着哈欠去等公交车的人了，稀稀拉拉，少女知道一个小时后街上就会出现一条人头的河流，公交车也会变成沙丁鱼罐头充斥着各种味道。\n\n一封信件从门口滑入客厅，少女想起身，最后还是放弃了，瘫坐在椅子上，她不用想都知道那是催房租的信件，毕竟她已经拖欠了两个月的房租了。她想起来，事情似乎并不是一直这么糟糕，在内战前的一个月的房租还是4000联盟币，而内战后却变成了8000出头，她不知道自己是否该庆幸自己在那场灾难中活了下来，或许是那些埋骨在砖瓦废墟下的少女更加幸运呢？至少死者不用面对满目疮痍的现实，而生者却只能羡慕死者。战火打破了一个常态，然后锻造了一个新常态，恢复，重建，这一切都成了绕不开的话题，魔法少女们常说魔法可以带来希望和奇迹，但是似乎一切的奇迹都有代价。那么这个代价有多高昂呢？少女停止了胡思乱想，毕竟这些事情并不重要，如果她不能发表新作品来获得缴纳房租所需的稿费，那么她下个月就得卷铺盖走人了。"
 yuki.28.a:0 "“也许，这就是奇迹的代价吧”"
 yuki.29.t:0 "战火的余波"
 yuki.29.d:0 "“所以，你的意思是....那帮恐怖分子还没灭绝？”月代雪看着桌上触目惊心的袭击报告。一张照片里赫然映着一具联盟军的尸体，另一张则是一名手持土枪的少女，边上是原野火革命军统治地区的一座广播塔，此刻已经在爆炸下轰然倒塌。“是的，月代雪小姐”情报少女向月代雪做出了简短的回答报告。月代雪又拿起了那张照片，照片上的少女肩膀处的那个野火肩章如一把尖刀明晃晃的刺进她的眼眶。\n\n“好啊，既然你们想再打一次，好，我月代雪成全你们。”"
 yuki.29.a:0 "“现在判处你们，死刑。”"
 yuki.30.t:0 "庆祝"
 yuki.30.d:0 "“来，为我们的胜利干杯”酒杯碰撞，酒水洒出，滴落在白金汉宫宴会厅的桌布上。阿尔托莉雅好久没有这么放松了，过去的几年先是伦敦危机，然后是第二次伟大战争，紧接着民主国家同盟又直面了轴心国和苏维埃的威胁。阿尔托莉雅在那些日子可是夜不能寐，尤其是幻想乡沦陷的那至暗时刻，不死族的铁蹄横扫了欧陆，战火和死亡离圣杯王国只有隔了一道看似弱不禁风的海峡。当然，天佑不列颠，她们最后都低下了高傲的头颅，民主现状也因此得保。\n\n“各位女士们先生们，”阿尔托莉雅起身致辞，“我们伟大的祖国，伟大的民主制度，在过去的十年间，遭受了极端主义，以及不死族的威胁，但是，我今天可以很高兴的宣布，不列颠和圣杯王国已经消灭了她的敌人，我们将建立一个真正意义上的，民主的世界新秩序。”座位传来了首相等人的掌声。不知道是酒喝多了还是室内通风不太好，阿尔托莉雅似乎觉得头顶上的吊灯有些模糊和晃眼了，光晕越来越大和越来越亮，落地窗上似乎也反射出吊灯的光影，那个光圈愈发明亮愈发巨大，直到似乎地平线上也泛起了点点亮光。\n\n“女王陛下快趴下”警卫大喊一声把阿尔托莉雅护在身下，下一秒落地窗破裂，玻璃碎片随着震耳的轰鸣声飞溅而出，首相等人也被警卫扑到从而幸免遇难。\n\n“现在这是什么情况”阿尔托莉雅挣扎着起身，嘴里吐出一口血，“是事故还是恐怖袭击”。“不，情况比这个更糟，女王陛下，”损坏的大门被人一脚踢开，外务大臣着急忙慌的拿着一份电报闯入了宴会厅的废墟，“魔法少女联盟刚刚向我们发动了全面的军事袭击，不光是圣杯本土遭到潜伏人员的袭击，所有和魔联及其附属国陆上接壤的国家都遭到了全面入侵。我们在袭击发生后才接到了来自联盟盟主月代雪的电报。”阿尔托莉雅拿过电报，上面只有简短的一句话："
 yuki.30.a:0 "“血债血偿”"
 yuki.31.t:0 "\n\n\n\n\n\n[news_event_spec_logo]\n\n\n\n\n\n\n\n                                                                                                                                                    魔法少女联盟宣布发动“审判日”行动"
 yuki.31.d:0 "紧急新闻，根据白金汉宫传回的最新信息，魔法少女联盟已经向民主国家联盟宣战，并声称要“让刽子手们血债血偿”。\n\n目前，魔法少女联盟的军队已经越过了边境，并且潜伏人员在圣杯王国及其盟友境内发动了多次恐怖袭击，白金汉宫也在早些时候遭到了炸弹袭击，万幸的是阿尔托莉雅和首相目前安然无恙。\n\n“这是对民主和和平的背叛”圣杯王国外务大臣在接受采访时说道，并表示会保护盟友和民主免受“南美恐怖主义”威胁。魔法少女联盟目前没有作出任何回应。\n\n另外，世界各地也接连报道出现了不明人形生物袭击事件，目前尚不清楚是否为魔联所为。"
 yuki.31.a:0 "不必理会将死之人"
 yuki.31.b:0 "这群叛徒！"
 yuki.32.t:0 "\n\n\n\n\n\n[news_event_spec_logo]\n\n\n\n\n\n\n\n                                                                                                                                                       《伦敦协定》签署"
 yuki.32.d:0 "就在今天，魔法少女联盟盟主月代雪和圣杯王国女王阿尔托莉亚及首相在伦敦签署了《伦敦协定》，宣告着魔法少女联盟正式加入了民主国家联盟。\n\n据称，月代雪表示虽然现在联盟仍然处在战争导致的戒严状态，但是会早日完成“安全问题”的解决和开启民主化进程。\n\n幻想乡和其余民主国家联盟的成员国对此表示祝贺，苏联则谴责其为“霸权主义和殖民主义”的回归，并考虑启动制裁措施。"
 yuki.32.a:0 "民主的一大步"
 yuki.32.b:0 "圣杯重回南美了"
 yuki.33.t:0 "黎明"
 yuki.33.d:0 "空气中弥漫着火药和烧焦的味道，安地斯山脉下的大地上点点火光照亮了山脚上被炸成断垣残壁的前哨和化为木炭的森林。村中央的水井被断裂的石壁填埋，村道两旁的建筑，如果那还能被称为建筑的话，火光中映出漆黑的横梁，然后摧残，坍塌。\n\n军车声逐渐远去，只留下“噼噼啪啪”的火星声和时有时无的抽泣和呻吟。断墙后，一个娇小的身影小心翼翼的摸索着，快速的闪过乡道，摸到一堆瓦硕前。砖块碎片仍带着高温，少女被烫的缩回手。“咿...”少女嗦着手指，把围巾扯下来一段包住纤细的手指和手臂，随后一咬牙插入废墟中，砖块一块块的被少女抛到身后。一只焦黑的手臂逐渐显露出来，少女楞了一下，随后发了疯一样的刨开废墟上的砖瓦，随后用力一拉。\n\n一节焦黑的手臂随着惯性和少女一起向后倒去。少女抱着那一截手臂，长久的就那么躺在地上不再动弹，最后抽泣声转为嚎啕大哭，在夜幕下最终归于沉默。\n\n黎明的安地斯山被晨光照亮，村庄的废墟上已经火烬灰冷，断臂上刻画的古老的安德烈图腾神话也在榴弹炮下逐渐黯淡，扭曲。远处山坡上沙尘飞扬，又一队军车停在村庄废墟上，士官在断壁上插上了一面残破的魔联旗，在风中猎猎作响..."
 yuki.33.a:0 "...无言的看着大地的迷藏"
 yuki.34.t:0 "翌日（上）"
 yuki.34.d:0 "“各位各位，听一下，由于战争的形势较为严峻，因此今天每个人都得再加产两小时才能完成指标。”一个白羽拿着一张通知单，对着神滨兵工厂的魔法少女和普通工人宣布到。“搞什么，昨天就已经加到了12小时了，今天又加两小时，这样我们连末班车都要赶不上了”“就是啊，我家在见泷原的，回去还得至少半个小时...”“都给我闭嘴，带头闹事那个，你给我过来。”白羽恼羞成怒，随手拿起桌上的锤子就向那个单马尾少女丢去。\n\n锤子突然被一道魔法击落在水泥地板上，发出了沉闷的响声。“都干什么，谁让你随便对魔法少女动手的！”工厂大门被人推开，一个娇小的身影出现在门口。“灯..灯花小姐，”白羽显然有些惊慌，但很快正了正脸色，拿着手里那张盖了联盟盖章的通知书，如同拿着免死金牌，“上面来了命令，要求增加产量，我们也是迫不得已才这样的...”里见灯花表情有些凝重，由于叛乱给三位玛吉斯们带来的负面影响，里见灯花很长一段时间里都没有过问联盟的事务了，联盟的实际权力也早就从玛吉斯之翼手里转移到了月代雪的班底手里。\n\n然而这不是最让她感到担忧的，联盟内部早有传闻，有一种奇怪的魔女化疾病武器，这种疾病发病无法通过悲叹之种治愈，然而在这之前灯花一直将其视为都市传说，但是最近联盟越发具有扩张性的外交政策和对于月代雪本人越来越少公开露面，以及各地增长的不明袭击案件让她开始逐渐怀疑月代雪的真实目的。如果说加班和死亡作为玛吉斯理想道路上的必要之恶可以被“牺牲”，那么那种最坏的可能性是灯花无论如何也不能接受的。无论如何她现在已经下定了决心，一定要去找月代雪谈一谈，“作为曾经的叛乱者，哪怕是冒着被非议的风险...”"
 yuki.34.a:0 "“我也必须要找雪谈一谈”"
 yuki.35.t:0 "翌日（下）"
 yuki.35.d:0 "办公室的门没有被闭合，只是虚掩着，里见灯花的透过门缝看见房内一片狼藉，各种报告和实验记录凌乱的散落在桌子上和地板上。“门外的那个小个子，不用站着了，进来吧。”里见灯花楞了几秒钟才反应过来，随后是无比的羞愤，“你叫谁小个子呢，月代雪，你看看你都在干什么，说好的要解放魔法少女呢，说好的玛吉斯的愿望呢。”月代雪眼里闪过一丝寒意，“我不就是在解放魔法少女吗”“你管这叫解放？被当成奴隶一样驱使叫解放？”里见灯花脸涨的通红，因再也无法克制自己的愤怒情绪而指着月代雪破口大骂。“灯花啊，你还是太年幼，如果人类继续掌握这个世界的霸权那么我们魔法少女就永远只能被当成非人和怪物看待，因此，我不惜一切代价消灭人类霸权怎么就不能叫解放呢？”\n\n“歪门邪道，所以你为了消灭人类霸权，就要把所有人变成那种怪物吗。”灯花不再遮掩。“不愧是天才少女，这也被你知道了啊，不错，我确实在制造魔女因子，而且我还要把人类都变成那种东西让她们因为内心的恶念狗咬狗，直到这群垃圾彻底从世界上灭绝。”\n\n虽然早有心理准备，但亲耳听见这个疯狂的计划还是无论如何也无法接受。“你个怪物，恶魔，”里见灯花撕心裂肺的喊道，“你这是对玛吉斯理想的背叛，是对魔法少女解放事业的亵渎！”里见灯花迈向门口，准备摔门而去。\n\n“站住，你不会以为我会就这么放你走吧，然后你想干什么？再学着晓美焰她们打一场内战？还是叫上其他人类一起来魔女狩猎？”说罢月代雪拍了拍手，两个魔女残骸一左一右押走了里见灯花，灯花见势准备发动魔女化身许愿逃离，然而出乎意料的是毫无反应。“忘了告诉你，自从爆炸案之后议会和联盟盟主府都做了禁魔处理，也就是说在这里你就是一个普通小女孩罢了，看守，带她去“她的房间”，没有命令不要放出来。”两个看守机械地带着灯花穿过走廊，消失在视野里。"
 yuki.35.a:0 "然后门轰的一声关上了。"
 yuki.36.t:0 "新生"
 yuki.36.d:0 "胜利了。\n\n月代雪没想到这一天可以这么快到来，她，艾玛，魔法少女，胜利了。\n\n人类的最后的堡垒——圣杯王国已经在感染者和魔法少女的魔炮轰击下化为齑粉。\n\n“阿丽斯姐姐，你看到了吗，小雪帮你报仇了...”这么想着，月代雪意识开始模糊。\n\n“小雪，你已经站在那个地方很久了，要涨潮了哦。”月代雪震颤了一下，转瞬间发现自己已经穿着短袖赤着脚站在了白色的沙滩上，脚底感觉到了久违的颗粒感和海水的凉爽感，而熟悉的声音更是让她眼角模糊。当然，她知道这一切不过是一场幻梦罢了，阿丽斯姐姐的尸体，殖民者的狞笑，还有那刻骨铭心的恨意，月代雪没有忘记过，也未敢忘记过。\n\n“阿丽斯姐姐...我...我帮...阿丽斯姐姐和魔女们报仇了...”即便如此，月代雪仍然无法克制自己的眼泪，阿丽斯也仍由着她扑在自己怀里像个孩子一样哭泣，“傻孩子，黑眼圈那么重，好久没好好睡觉了吧。姐姐已经不在了，姐姐不需要你帮我们再做什么，阿丽斯姐姐只要你开心就好。”\n\n“可是姐姐，我报仇了啊，你难道不恨他们吗。”“恨，恨啊，姐姐恨啊，可是恨了又怎么样，恨了姐姐能回来吗，姐姐不是和你说了，要你好好替姐姐活下去吗，可是你看看你现在的样子，姐姐看了很心痛啊，满脸愁容，歇斯底里...姐姐要你快乐的活着，姐姐不想看你背负这么多啊...”阿丽斯说罢也抱着月代雪的肩膀开始抽泣，“好孩子，答应姐姐，回去了好好的过日子，可以吗，不要再干这种不开心的事情了。”阿丽斯的面容逐渐模糊，声音也逐渐远去，最后变成一个点，留下了月代雪怀抱的姿势，和婆娑的泪眼。\n\n“姐姐，我会的，但是，在这之前，我还有不得不做的事情...”"
 yuki.36.a:0 "“对不起，姐姐”"
 yuki.37.t:0 "天光大亮"
 yuki.37.d:0 "“求求你小姐，绕了我吧。”小巷里，一个衣衫褴褛的少女跪坐在地求饶，然而拳脚任然如同雨水般打来。“狗东西，垃圾，杂种，谁让你在我们魔法少女的土地上跪着的，给我起来。”两个士兵狞笑着讥讽，没有丝毫怜悯的意思。“老娘昨天又被那个该死的酒鬼克扣工资了你知道吗，那个酒鬼又和我们说什么军费紧张只能发一半，老娘提着脑袋去和那帮圣杯杂种的坦克玩命，连个吃饱饭的钱都拿不到，”士兵叫上的力道愈发重，少女的也逐渐从求饶转为哀嚎，“都是你们这帮该死的东西，一点魔法都没有，一点战斗力都不存在，在后方混吃等死的寄生虫，仗着自己寿命比我们长，然后一个个老油条都吃的满嘴流油。”士兵的脚用力一蹬，瘦骨嶙峋的少女轻呼了一声倒在了地上，身体因疼痛而颤抖，呻吟声也开始断断续续。\n\n“给我住手，”一声怒喝在身后响起，“你们这帮家伙，居然敢当街行凶。”两个士兵刚要泄愤，被这一出打断，满脸怒意的转过身去，“谁啊，本大爷寻乐子还要你...”话没出口停在嘴边，随后士兵立刻换上了一副恭敬的样子，“原来是沙耶香将军啊，失敬失敬，在下只是再清理蛀虫执行命令罢了。”\n\n又是这个理由，沙耶香记得的很清楚，在联盟授权了对人类的暴行后，这种暴行几乎每天都会发生，每当她试图用军法约束时那帮畜生就会拿这个该死的法条当她们泄欲的挡箭牌。\n\n“什么狗屁...”沙耶香刚想出言不逊就被一支手拦住了，“喂，那你们记得南美人是豁免权的吧，在外面干干得了，回来还敢目无纪律小心本大爷打断你们的腿。”两个士兵哆嗦着道歉，随后脚底抹油开溜了。\n\n“谢谢你，杏子。”沙耶香擦了擦汗，对佐仓杏子道谢。“你个笨蛋，要不是我及时赶到了，你就该口出狂言了吧，小心到时候隔墙有耳被人举报上去就麻烦了。”佐仓杏子咬了一口没吃完的苹果，递给沙耶香一个，“我早说了，我们魔法少女是一种以悲叹之种为猎物的生物，和那帮人，”杏子的手指着躺在地上的少女，“有本质的区别，也就是，我们和他们不一样，以后这种事情少管，知道了吗，笨蛋。”沙耶香刚想说什么，就看见少女趴在地上有气进没气出，但是仍然吐出了一句话：“谢谢”，随后就没了动静。\n\n“你还好吗”沙耶香转头就把杏子的话抛到脑后。“喂，等等，你有没有在听我讲话，”佐仓杏子试图拉着她，但是最终没有成功。看沙耶香着急忙慌的检查着呼吸，杏子无奈的叹了一口气，“笨蛋，这是饿晕了，我以前流浪的时候也被饿晕过，所以很清楚。”随后佐仓杏子军用包内的一罐糖水，“上次在野外没喝完，给她喝吧。”随着糖水顺着咽喉流入体内，少女逐渐恢复了知觉。“谢谢你们，”少女醒来便对着二人千恩万谢，“没有两位相助我今天就要被他们打死了。”“行了行了，既然没事了就走吧。”少女正准备走，就感觉手里多了个东西，圆圆的还隐隐带着香气，一看是一个苹果。少女激动的抬头，对上了杏子面无表情的脸，“拿着这个，走吧，下次小心点，离魔法少女远点吧。”"
 yuki.37.a:0 "“下一次可救不了你了”"
 yuki.38.t:0 "老师"
 yuki.38.d:0 "“和谐，炽热的激情，就会流出我的双唇，全世界就像此刻的我一样——侧耳倾听。”早乙女和子朗读完最后一行诗句，合上了课本，“好了同学们，这就是这个学期的最后一节古代文学鉴赏课了，那么，还请同学们在课余背诵完雪莱的《致云雀》。那么，下课。”\n\n教室里的女孩们像往常一下三两结成小团体，商量着哪家店的章鱼烧或糖果更好吃，或者哪里有新款的服饰。“哦对了，各位，最近不明袭击事件频发，请各位放学后立刻回家，不要在天黑后四处闲逛。”女生们表情明显失望了很多，也有一些是不屑。然而早乙女和子此刻却全然顾不上少女们的反应，只是默默的装起教科书，把书小心的放进一个纸袋里，然后用订书机订上装进文件袋里，如同在存放什么稀世珍宝。\n\n时钟指向下午四点，见泷原小学的教室里已经空空荡荡，午后的阳光斜射入落地窗内，照得课桌发烫。早乙女和子却坐在讲台前，就像她似乎还在给孩子们朗诵雪莱的诗篇一般看着台下，期待着从无人的座位上看出一两个人的思考或是共鸣。\n\n“和子老师，您怎么还没回家。”一声稚嫩的童声打破了压抑的寂静。少女站在门口，带着好奇和担忧的询问，“老师，您还好吗”“没事，我没事，只是...我只是还想再多看看教室，多看看你们...”和子低着头回应，“老师，还想教你们古代文学。”\n\n“啊，老师下个学期不能继续教我们《十四行诗》了吗。”少女有些失落，“可是下个学期还有文学鉴赏课啊，老师如果想教的话为什么不教呢？”和子抬起头，嘴唇微微颤动，像是做了心理斗争，最后还是吐出了那句话：“老师不想把...战书和檄文作为艺术...”少女不解的看向和子。“校长昨天和我谈过了，说明年要停止开设南美以外文学和庸俗文学的课程，所以，这是最后一节鉴赏课了，”和子看向少女，少女震惊而又悲伤，眼泪开始在眼眶打转。“不要难过了，”和子强行让自己冷静，安慰道，“渚老师会继续教你们文学课的，她也是很温柔的老师哦。”“我不管，我就要和子老师。”少女哭着奔向和子，和子将她搂入怀中，再也无法控制自己的感情，泪水滴落在被斜阳照至金黄的地板上，如同一颗鸡蛋撞上磐石，顷刻间分崩离析。和子突然想到了雷雨前的云雀，“响彻你婉转的歌喉，仿佛在荒凉的黑夜”和子呢喃起来。"
 yuki.38.a:0 "“在寂寞难言的时刻...”"
 yuki.39.t:0 "昔我往矣"
 yuki.39.d:0 "冬天荒凉的花园里轰炸机隆隆作响。\n\n七旬的和田已经忘记了自己是什么时候搬来神滨的，也许是几年前，或许是几十年前，记不清了，唯一可以肯定的是那时候她和自己的女儿一起搬进了这套三居室，那时候她的视力还很好，女儿是个爱笑的女孩，皮肤白皙，二十岁出头的她崇拜着一位不知名的蒙面街头艺术家，常常和她赞叹那个玩弄油漆罐的天才。\n\n“后来吗，后来你猜怎么着，这丫头真去找她的偶像了，还真给她找到了，”和田咯咯的笑着，自言自语，双目失明的她抚摸这那张略微泛黄的合照，“这丫头居然扛着一个比她还小的小丫头回来了，和我说她叫城崎诺亚，哎呀你能想象吗，那么小的一个孩子当了大明星。”远处传来爆炸和警笛声，和田却并不在乎，只是靠在那张对准窗口的躺椅上感受着阳光带来的少有的温暖，自从和田的女儿参军离开后，她就孤身一人住在这间公寓里。其实战争开始时女儿并不想参军，因为她说军队的日子很无聊，没法从事她热爱的艺术事业，只能画些无聊的宣传海报。但是后来和女儿达成合作的画廊倒闭了，而和田也不幸罹患脑部疾病，她至今记得女儿为了谋生去参军时的最后一面，女儿哭的像个三岁孩子，就像童年时一样抱着和田痛哭流涕。女儿对她说，等到门口的梧桐树下一次秋叶落下她就会回来。然而，新的一年开春时，和田却已经无法再看见新芽抽枝了。疾病夺走了她的视力，虽然保住了性命，代价是余生只能在无边黑暗中度过。有人告诉和田她可以以她女儿参军为由入住神滨市疗养院，和田却只是笑着拒绝，表示要等到看见门口的梧桐树下一次秋叶落下才会走。\n\n春去秋来，和田的视力没有恢复，她也习惯了靠听力生活的日子，当然她看不见门口的梧桐树上的子叶抽芽，生长，凋零。在她的梦里，门口的梧桐树永远是女儿离家前的落英缤纷的样子。"
 yuki.39.a:0 "就像那个爱笑的女孩一样美。"
 yuki.40.t:0 "今我来思"
 yuki.40.d:0 "“咚咚咚”，敲门声将和田从迷迷糊糊的幻想中拉回现实，她熟练的摸索着找到门把手，转动着把大门缓缓拉开。“您好，请问是和田女士吗，”一个疲惫的女声传来，“我是您女儿的朋友，额，您女儿托我给您带了封信。”和田十多年来没有波澜的内心第一次泛起了涟漪。“我的女儿，她怎么样了，过的还好吗，”女生的话像被卡在了喉咙里，欲言又止，陷入了诡异的沉默。“怎么了，我女儿她还好吗，什么时候可以回家，”和田察觉到了一丝不对劲，有些着急的喊道。“和田女士，其实，您女儿她，已经回来了...”“在哪呢，小云，你在那边吗，怎么回来了不叫妈妈一声。”女生犹豫了片刻，最后从帆布包里拿出一个纱布包裹的长条状物体递给和田，“和田女士，小云她，在这里。”纱布缓缓掉落，和田摸到了一个坚硬冰冷的物体，带有皮肤的触感，那是半截手臂，末端还带着爆炸留下的焦黑。和田感觉内心有什么东西碎掉了，她双腿发软瘫坐在地上。想哭吗？也许吧，如果是几年前或许和田真会大哭一场然后寻短见，但是现在她只感觉自己的身体像是被抽走了什么东西一般空虚和怅然若失。\n\n过了许久，女生犹豫着开口：“和田小姐，这里还有封信，要我念给您听吗？”和田楞了几秒，随后像是做了这么重大决定般点了点头。“亲爱的妈妈，”女生拆开一个信封掏出一张信纸，“不用担心我，我在前往圣杯王国的船上了，我们队长说了，打完这一仗就可以回家了。您知道吗，我真的很想您，但是战事紧张，我没能当个诚实的孩子，在秋叶落下时就回家，您也要注意保暖。我托人给您办理了见泷原度假村的入住资格，您在那里应该会更舒服。”\n\n屋内又陷入了死一样的沉默，过了许久，女生开口道：“和田女士，最近神滨的新型魔女化感染者越来越多了，见泷原那边暂时还是安全的，要不我送您一起去吧，您不是有您女儿给的入住资格吗，刚好可以派上用处...”“我，不想离开这间屋子。”和田缓缓开口打断，强撑着站起来走到桌边，轻轻擦拭那张和她女儿的合照，窗外不远处又传来了爆炸声，女生有些着急：“为什么，您的身体状况在这里就是等死啊。”和田笑了笑，说道：“因为啊...”"
 yuki.40.a:0 "“我还在等着梧桐树叶落下啊”"
 yuki.41.t:0 "破败"
 yuki.41.d:0 "已经太久了。\n\n几百年的岁月已经让月代雪的感官变的迟钝乃至麻木，而昏迷的艾玛和死去的希罗更是让她彻底失去了除了愤怒和恨意外的其他感知。严格意义上来说，她已经死过两次了，第一次是在故乡沦为屠宰场的时候，第二次是那一声爆炸，而留下的这具叫月代雪的尸体则是继续在活人的世界里徘徊了数年之久，才逐渐的腐败。\n\n随着宿敌的一个个坠入地狱，“月代雪”这个概念的存在也逐渐的像热水中的方糖一样溶解消失了。她常常把自己关在自己的房间里一天一夜，瘫坐在那张略显老旧的沙发上如同遭了梦魇一般大口喘气，虚汗从头顶渗出。直到浑身散发出连她自己都能闻到的难闻的异味，她才会如梦初醒般挪动着似乎已经僵硬的身体去做最基本的清洁。月代雪觉得自己越来越力不从心，就连先前为她在内战中出力的，奠定了她统治基础的玛吉斯民兵都逐渐开始抓不住。一切都在离她而去，魔女因子失控了，玛吉斯们也开始和她离心离德，魔法少女们在感染者和饥饿的威胁下哀嚎着，据如同曾经被殖民者鞭挞一般。日子一去不复返，朋友，家人，理想，无论她如何努力的走过每一个时刻，都注定不会留下任何脚印。\n\n她常常在噩梦和天堂间循环，前一秒回到了魔女岛，后一秒又被烈火和枪炮包围，在痛苦的渴望，悲哀的循环中，曾经的理性似乎再一次击中了她，我是谁？我是大魔女，我是月代雪，我...我是魔法少女联盟的盟主，是啊，为什么不早意识到呢？月代雪喃喃自语，镜子里的她穿着一身凌乱的魔女礼服，看起来滑稽又可笑——这是我啊，这是我月代雪自己啊。月代雪的大脑可以说被癔症乘虚而入了，但是她相信自己是幸福的，是快乐的，是成功的，是大仇得报的，是英雄的！复仇了，对啊，她复仇了，阿丽斯姐姐的仇，艾玛的仇，希罗的仇，族人的仇，魔法少女的仇，人类已经被消灭了，现在正是大展宏图的时候，让魔法少女实现自由和幸福的时候，一切都来得及！"
 yuki.41.a:0 "哪里不对吗...？"
 yuki.42.t:0 "宣讲"
 yuki.42.d:0 "“所以，我认为，魔法少女的命运应该由自己掌握而非由我或者玛吉斯们来独断的裁决，因此我宣布联盟的戒严正式解除，同时一并解除联盟的战事状态。”月代雪对着落满灰尘的国会大厅高昂的宣布到，月代雪好久没有状态这么好过了，头脑是如此清爽，思维如此敏捷，她似乎又回到了那些和圣杯王国及人类殊死搏斗的岁月。她觉得自己像一个巨人，站在新大陆的陆地上，向着旧世界呐喊。鲜花和掌声包围了她，月代雪看到台下座无虚席，灯光打在她恢复了些红晕的脸上，艾玛，希罗，梅露露，阿丽斯姐姐，都在给她鼓掌啊，这一刻她觉得自己成长了，终于从那个小女孩成为了一名独当一面的大魔女，功勋卓著的联盟盟主。“谢谢大家。”一声清脆而又温柔的道谢回荡在空旷的国会大厅内，形成了回音，吓走了最前排座位上的一只魔化海鸥。\n\n然而快乐并不长久，月代雪又开始抱怨为何大街上空荡荡的，为什么没有魔女岛时那样的嬉笑声，是她做的不够好吗？也许她应该早点让梅露露去...哦对啊，梅露露呢？月代雪四处环视，并没有见到梅露露的影子。她推门而出，暴雨前的风掀起一张报纸，吹在她脸上，月代雪只是急切的将其扯下丢开。“梅露露，你在哪？梅露露。”无人回应，空荡荡的神滨街道上是死一般的寂静，只有几个挂在路灯上的残肢在风中摇摆来回应她。月代雪一路小跑到了联盟盟主府邸前，大门被她走时暴力轰开，地上散落着加固措施，魔女化患者尸体，几具魔女残骸，和...梅露露！月代雪上前抱住了她：“梅露露，我刚刚辞职了，现在人类不能再伤害我们了，我们一起去你一直想去的夏威夷度假吧。”梅露露低着头沉默不语，月代雪有些生气：“梅露露我叫你呢你听见了吗。”梅露露的头突然抬起，那哪里是梅露露，分明是二阶堂希罗。“希罗，你还活着。”下一秒，希罗的头上出现了一个窟窿，血液从中流出，月代雪吓的尖叫，起身想要擦掉身上的血迹，却发现自己赫然穿着西班牙人的服饰，而地上横七竖八的躺着梅露露，希罗和艾玛。月代雪跪倒在地，呢喃道：“对啊，我怎么忘了...”"
 yuki.42.a:0 "“...她们已经不在了啊...”"
 yuki.43.t:0 "腐烂"
 yuki.43.d:0 "“梅露露，你来...”月代雪喝醉了，作为大魔女显然她喝酒是不合适的，然而今天她却喝的酩酊大醉，“梅露露，你个死丫头跑哪去了。”月代雪怒不可遏的喊着，下一秒，她打了一个嗝，“对啊，梅露露，已经在门外被那些东西，被我亲手创造的东西咬死了。哈哈哈，我，我，我的造物，杀掉了我最后可以被称为亲人的人...”她拿起空酒瓶向着墙上的挂画砸去，她在这之前似乎从未注意到这里有一张挂画，但她有些醉了，因此看不清挂画上画的是谁。“你呢，你又怎么看我，我很狼狈吧，堂堂大魔女沦落到这个地步，你也在看我笑话吧...”月代雪颤巍巍的指着画中的人喊道。一片寂静。她想起来曾经在杂志上看过一篇文章，好像是一个叫夏目安安的人写的，说什么动物在濒死之际会把自己蜷缩成一团，“那大概，是我现在这样吧。”月代雪突然觉得自己喘不过气，像是被人活埋在一个墓室内，她起身像开窗，无意间瞥见了走廊尽头那扇被人暴力轰开的房门。“灯花...”月代雪摇摇晃晃的走进房内，“灯花，对不起，你还在那吗...”房内空无一人，就如神滨其他部分一样。月代雪不知道联盟其他部分是否还有活人存在，“只要我死了，魔女因子和这场灾难就可以消失了吧。”月代雪这么想着，“也许这样，还能拯救一些人吧。”"
 yuki.43.a:0 "“那么，永别了...”"
 yuki.26.t:0 "结束了..."
 yuki.26.d:0 "一切都结束了，我们的行为暴露了我们的目的，现在圣杯和远征军要来消灭我们了，全完了..."
 yuki.26.a:0 "魔法少女完蛋了..."
 yuki.44.t:0 "新世纪"
 yuki.44.d:0 "“喂，沙耶香，不要走那么快，”佐仓杏子向前几步拉住了正准备进入盟主府邸的沙耶香，“里面可是那家伙老巢，你个笨蛋是真不怕死啊。”沙耶香却不以为然，“一路上过来连一个感染者都没见到，而且前几天见泷原郊外的感染者都突然痊愈了，我觉得应该是发生了什么导致魔女因子消失了吧，”沙耶香若有所思，随后她有些惊讶的翻开门口的一具尸体，“杏子你快来看这个，这件衣服时是不是有点眼熟。”沙耶香拿起一件白色的修女服，在手里抖了抖，抖落了一大片尘埃。“咳咳咳，沙耶香快，咳咳咳，把这玩意放下，咳咳咳...”杏子被灰尘呛得咳嗽。“哦...抱歉！”沙耶香慌忙把修女服丢在地上，有些歉意的看着杏子。“咳咳，这件衣服好像是，”佐仓杏子定了定神色打量起那件可疑的修女服，“好像是她的助手梅露露的衣服吧。不过为什么会在这里，还残破不堪的，难不成也已经遇害了...那尸体去哪了...”“哎，不要想这么多了嘛，也许就是死了呢。”沙耶香倒是不在意这些，毕竟已经有几个星期都没见过感染者了。\n\n“哦对了，杏子。”沙耶香突然开口问道。“怎么了，”杏子转过头来看着沙耶香，“你想到了什么吗。”\n“我在想，联盟的其他地方，或者说，世界上其他地方还有活着的人吗。”\n“谁知道呢，也许有吧，也许和之前几个城市一样一个人都没有，”杏子叼着麦秆，“至少啊，我们都还活着不是吗，至少我们都不孤单。”"
 yuki.44.a:0 "“也对，至少我们都不孤单...”"
 
