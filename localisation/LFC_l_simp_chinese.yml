    LFC_event.101.t:"经济危机波及我国"
    LFC_event.101.d:"来自本土的经济危机已经波及到我们。市场崩溃、贸易萎缩、资本撤离，殖民地经济正面临严峻挑战。"
    LFC_event.101.a:"艰难时刻"

 #总督府决议事件
    LFC_event.2.t:"调整与本土的经济联系"
    LFC_event.2.d:"作为圣杯经济体系的一员，露斯契亚的许多企业由本土资本掌控，每年都有大量商品输往母国。这种依附关系虽在一定程度上挤占了本地的工业产能，却也换来了经济与技术的持续输入。联邦事务局发放的调度许可，也在很大程度上取决于此。\n\n不过，与寻常殖民地不同，圣杯联邦的成员向来享有较高的自治权，马库斯总督在伦敦亦颇有人望。因此，我们可以根据自身需要，灵活调整与本土的经济联系规模。"

    LFC_event.2.a:"保持最低限度的经济联系"
    LFC_event.2.b:"加深与本土的经济联系"
    LFC_event.2.c:"建立全面的经济联系"

 #国策事件
    LFC_event_foc.1.t: "能源安全保障法"
    LFC_event_foc.1.d: "为保障我国能源命脉不受外部势力控制，必须对能源产业的外资持股比例作出法律限制。"
    LFC_event_foc.1.a: "有限保障（外资≤75%）"
    LFC_event_foc.1.b: "明确主导权（外资≤49%）"
    LFC_event_foc.1.c: "严格管控（外资≤25%）"

    LFC_event_foc.2.t: "海上油田开发谈判"
    LFC_event_foc.2.d: "贸易协会向我们提出了一个诱人的提议：共同开发位于南大西洋深水区的深渊海脊油田。据勘探报告显示，该油田储量极为丰富，但开采深度超过两千米，需要贸易协会的深海钻探技术支持。\n\n双方将按出资比例分配股份——贸易协会出资越多，油田投产速度越快，但我们的收益份额也相应减少。"
    LFC_event_foc.2.a: "贸易协会主导（我方出资25%，180天投产）"
    LFC_event_foc.2.b: "对等合作（各出资50%，270天投产）"
    LFC_event_foc.2.c: "政府主导（我方出资75%，360天投产）"

    LFC_event_foc.3.t: "深渊海脊油田井喷"
    LFC_event_foc.3.d: "经过艰苦的深海钻探作业，深渊海脊油田的第一口探井终于钻穿了盐层，高压原油从井口喷涌而出！黑色的黄金染黑了钻井平台，所有在场的人都为之振奋。\n\n威弗利港的石油储备设施迅速投入运转，我国的能源格局就此改写。"
    LFC_event_foc.3.a: "我国的能源未来有了保障"

    #进口学园都市煤炭
    LFC_event_foc.4.t: "进口学园都市煤炭"
    LFC_event_foc.4.d: "贸易协会向总督府提交了一份详尽的报告，指出我国工业的迅猛发展正面临煤炭供应的瓶颈。报告建议向同属圣杯体系的学园都市派遣商业代表团，洽谈煤炭进口事宜。学园都市拥有丰富的煤炭资源，而我国的外汇储备足以支撑长期进口合同。"
    LFC_event_foc.4.a: "同意派出商业代表团"
    LFC_event_foc.4.b: "没必要，我国煤炭可以自给自足"

    LFC_event_foc.8.t: "露斯契亚商业代表团到访"
    LFC_event_foc.8.d: "露斯契亚商业代表团到访学园都市，急切希望进口煤炭以支撑其能源需求。理事会认为，与其单纯出口，不如趁势将未开发矿脉的开采权打包出售——鲍恩盆地的煤田储量巨大，中背山脉的铁矿也急需外来投资重振。"
    LFC_event_foc.8.a: "仅签订煤炭出口协议"
    LFC_event_foc.8.b: "签订协议，并出售鲍恩盆地煤矿开采权"
    LFC_event_foc.8.c: "签订协议，打包出售煤矿与中背山脉铁矿开采权"

    #三种条款
    LFC_event_foc.5.t: "学园都市回复"
    LFC_event_foc.5.d: "学园都市政府同意了煤炭出口方案。双方签署了一份长期煤炭进口协议，学园都市将定期向我国输送优质动力煤和炼焦煤。作为回报，我国支付了一笔合理的外汇款项。\n\n虽然这只是单纯的贸易往来，但稳定的煤炭供应已经足以缓解我国工业的燃眉之急。"
    LFC_event_foc.5.a: "签订煤炭进口协议"

    LFC_event_foc.6.t: "学园都市回复"
    LFC_event_foc.6.d: "经过多轮磋商，学园都市不仅同意向我国出口煤炭，还以优惠价格出售了鲍恩盆地的煤矿开采权。该盆地煤炭储量极为可观，此前因学园都市缺乏开发资金而长期闲置。\n\n我国获得了鲍恩盆地的独家开采权，这意味着我们不仅能确保煤炭的稳定供应，还有望从开采收益中获得丰厚回报。"
    LFC_event_foc.6.a: "只签订进口协议"
    LFC_event_foc.6.b: "签订协议并购买煤矿开采权"

    LFC_event_foc.7.t: "学园都市回复"
    LFC_event_foc.7.d: "学园都市给出了最大诚意的合作方案：煤炭出口、鲍恩盆地煤矿开采权、以及中背山脉铁矿开采权全部对露斯契亚开放。中背山脉拥有百年铁矿开采历史，但近年来因设备老化和资金不足产量持续下滑，学园都市希望借助我国资本重振这一传统矿区。\n\n面对这份丰厚的菜单，我们仍需根据国库状况做出审慎选择——是仅仅进口煤炭解燃眉之急，还是趁机拿下矿产开采权，从源头上掌控战略资源的命脉？"
    LFC_event_foc.7.a: "仅签订进口协议"
    LFC_event_foc.7.b: "签订协议并购买煤矿开采权"
    LFC_event_foc.7.c: "签订协议并购买煤矿和铁矿开采权"

    #三种答复
    LFC_event_foc.9.t: "与露斯契亚的煤炭贸易协议达成"
    LFC_event_foc.9.d: "学园都市与露斯契亚正式签署了长期煤炭出口协议。虽然这只是一份单纯的贸易合同，但稳定的外汇收入将为学园都市的科研事业提供宝贵的支持。"
    LFC_event_foc.9.a: "每一分钱都是为科研而存"

    LFC_event_foc.10.t: "与露斯契亚的贸易协议达成"
    LFC_event_foc.10.d: "学园都市不仅与露斯契亚签订了煤炭出口协议，还出售了鲍恩盆地的煤矿开采权。这笔交易为学园都市带来了可观的资金，也为鲍恩盆地的开发注入了新的动力。"
    LFC_event_foc.10.a: "这笔资金将大大缓解我们的研究经费压力"

    LFC_event_foc.11.t: "与露斯契亚的全面矿产合作协议"
    LFC_event_foc.11.d: "学园都市与露斯契亚达成了全面的矿产合作协议——煤炭出口、鲍恩盆地煤矿开采权、中背山脉铁矿开采权悉数售出。这笔丰厚的收入不仅填补了科研经费的缺口，更为学园都市的长期发展奠定了坚实的财政基础。"
    LFC_event_foc.11.a: "这笔巨款将改写学园都市的未来"




 #雨林探索
  #玩家选项事件
    LFC_event_forest.1.t:"购买补给"
    LFC_event_forest.1.d:"要想筹备勘探任务，首先要购置足够的补给，我们准备的补给越多，探险队能坚持时间就越长。\n\nPS:需要有至少200块钱才能显示全部选项"
    LFC_event_forest.1.a:"购置标准补给"
    LFC_event_forest.1.b:"购置较多补给"
    LFC_event_forest.1.c:"购置丰厚补给"
    LFC_event_forest.1.e:"容我三思"

    LFC_event_forest.2.t:"选择探险队类型"
    LFC_event_forest.2.d:"其次，我们需要选择探险队的装备类型，装备越精良，探险队在面对敌人时的战斗力就越强。\n\nPS:需要有足够的库存装备才能显示全部选项"
    LFC_event_forest.2.a:"给探险队配备普通装备"
    LFC_event_forest.2.b:"给探险队配备机械化装备"
    LFC_event_forest.2.c:"给探险队配备构装骑士"
    LFC_event_forest.2.e:"容我三思"

    LFC_event_forest.3.t:"选择探险队规模"
    LFC_event_forest.3.d:"最后，我们要决定派出何种规模的探险队，规模越大，探险队人数就越多，抗损耗能力就越强。\n\nPS:需要有足够的库存装备和人力才能显示全部选项"
    LFC_event_forest.3.a:"派出一支小型探险队"
    LFC_event_forest.3.b:"派出一支中型探险队"
    LFC_event_forest.3.c:"派出一支大型探险队"
    LFC_event_forest.3.e:"容我三思"

    LFC_event_forest.4.t:"补给不足"
    LFC_event_forest.4.d:"由于物资储备降至安全红线以下，外勤勘探队被迫中止了当前的深入行动。为了避免毫无意义的非战斗减员，前线指挥官在目标近在咫尺时，艰难地下达了撤退命令。\n\n这是一次令人极其遗憾的挫折。历经千辛万苦，探险队在险恶的雨林中克服了重重阻碍，却最终受制于现实的后勤压力，未能在彻底探明该区域前坚持下来。\n\n然而，这次充满艰辛的行动并非一无所获。虽然未能建立稳固的前哨站，但探险队的勘探数据和雨林生存记录，已被军方参谋部妥善归档。这些用汗水换来的实地教训，将为我们未来的恶劣地形作战提供宝贵的经验。"
    LFC_event_forest.4.a:"下一次的后勤筹备必须更加严密"

    LFC_event_forest.5.t:"人员枯竭"
    LFC_event_forest.5.d:"由于持续遭遇丛林敌对生物的袭击与险恶环境的折磨，外勤勘探队的伤亡率已突破可承受的临界点。战斗人员的数量跌破维持最低警戒与推进的标准，队伍已无力应对深林中随时可能出现的突发威胁。为了优先护送伤员安全撤退并保留探险队的最后建制，前线指挥官被迫下达了全面后撤的命令。\n\n这是一次充满血泪与遗憾的折戟。探险队在无尽的绿海中展现出了惊人的坚韧，但在残酷的伤亡数字面前，单纯的意志已无法弥补阵线的空虚，他们最终未能支撑到完成任务的那一刻。\n\n然而，这些鲜血与牺牲并未完全白费。生还者带回了大量关于丛林遭遇战的第一手战报。这些沉重的实战教训已被参谋部整理吸收，化作指导未来勘探行动的基石，并将为我们的部队在恶劣地形交火中提供极其宝贵的战术经验。"
    LFC_event_forest.5.a:"一次惨痛但必要的教训"

    LFC_event_forest.6.t:"勘探行动圆满成功"
    LFC_event_forest.6.d:"历经连日的艰苦跋涉与重重险阻，外勤勘探队成功撑过了密林的严酷考验，圆满完成了对此地区的全面测绘与异常勘探工作。在保持建制完整与后勤运转的前提下，探险队于数个战略咽喉上建立了一系列坚固的武装前哨站与物资集散点。\n\n后续部队与工程兵团已沿着探险队开辟的安全路线迅速跟进。我们现已实质性地接管并确立了对该区域的全面控制。这片曾经潜伏着致命威胁的未知丛林，如今已正式化作我们前沿防御纵深中不可或缺的一环。\n\n当捷报传回新安普顿时，不仅极大地振奋了民众对远征行动的信心，也令本土对当前的推进速度感到十分满意。毫无疑问，这是一场战术与战略上的双重胜利。"
    LFC_event_forest.6.a:"稳扎稳打，步步为营"


  #雨林非战斗负面事件
    LFC_event_forest.11.t:"活体迷宫"
    LFC_event_forest.11.d:"探险队进入了一片由巨大珊瑚状植物构成的森林，这些植物的生长速度快得惊人，在我们身后不断改变着路径。侦察兵报告，我们似乎被困在了一个活的、不断变化的迷宫里。时钟塔的魔术师警告，这片森林本身就是一个巨大的魔术结界，旨在困住入侵者。"

    LFC_event_forest.11.a:"原地驻扎，等待魔术师解析结界"
    LFC_tooltip_forest_event_11_a:"我们建立了防御营地，保护魔术师们进行不间断的研究。在消耗了补给和数天时间后，他们终于找到了结界的薄弱节点，并为我们指明了唯一的出路。\n\n"

    LFC_event_forest.11.b:"依靠炸药，强行开路"
    LFC_tooltip_forest_event_11_b:"我们决定不把希望寄托于漫长的研究。工兵们用炸药在前方开路，士兵们则负责清理不断重新长出的植物。虽然这让我们付出了不少人员伤亡和物资消耗，但总算杀出了一条血路。\n\n"

    LFC_event_forest.11.c:"辨识‘主干’的生长方向"
    LFC_tooltip_forest_event_11_c:"妖精们似乎能看穿这些植物的生长脉络。她们带领着一队士兵，精准地砍断了几个为整个迷宫提供能量的‘主干’。结界的生长立刻停止了，我们得以从容地离开。\n\n"


    LFC_event_forest.12.t:"千面之雾"
    LFC_event_forest.12.d:"探险队驶入了一片弥漫着甜香花粉的浓雾之中。很快，士兵们开始出现严重的幻觉，他们看到了家乡的亲人、过去的战友，甚至是不应存在的怪物。这不是普通的雾，而是一种能将人拖入记忆与幻想深渊的危险花粉。整个队伍的指挥系统已濒临瘫痪。"

    LFC_event_forest.12.a:"启动车辆的空气循环系统"
    LFC_tooltip_forest_event_12_a:"我们下令所有人员进入车辆，并启动了能耗极高的空气循环和过滤系统。在耗尽了近半的能源储备后，我们像潜水艇一样，安全地‘潜’过了这片雾区。\n\n"

    LFC_event_forest.12.b:"强行冲出雾区"
    LFC_tooltip_forest_event_12_b:"在雷达的指引下，我们决定用最快的速度冲出去。虽然大部分人员成功脱险，但一些负责殿后的队员因陷入幻觉而掉队，永远地迷失在了雾中。\n\n"

    LFC_event_forest.12.c:"制作天然的过滤器"
    LFC_tooltip_forest_event_12_c:"妖精们认出了这种致幻花粉的来源，并迅速采集了数种能中和其毒性的植物。她们指导士兵将这些植物的叶片做成简易的口罩，这让我们安全地通过了这片区域。\n\n"


    LFC_event_forest.13.t:"深渊裂谷"
    LFC_event_forest.13.d:"我们前方的道路上出现了一道深不见底的裂谷，它彻底切断了我们的去路。对岸近在咫尺，但深渊中传来的风声仿佛是死神的呼吸。我们必须找到跨越这道天堑的方法。"

    LFC_event_forest.13.a:"建造一座临时桥梁"
    LFC_tooltip_forest_event_13_a:"工程师们指挥士兵砍伐了周围所有能用的巨木，耗费了九牛二虎之力才搭建起一座摇摇欲坠的桥梁。\n\n"

    LFC_event_forest.13.b:"寻找绕行的道路"
    LFC_tooltip_forest_event_13_b:"我们派出了侦察队，最终找到了一条需要多走数天的崎岖山路。虽然这极大地消耗了我们的物资储备，但总算是安全地绕过了裂谷。\n\n"

    LFC_event_forest.13.c:"发现“巨人之脊”"
    LFC_tooltip_forest_event_13_c:"妖精们展现了她们无与伦比的侦查能力。她们轻盈地沿着裂谷边缘进行快速搜索，找到了一座被藤蔓和青苔完全覆盖的天然石桥。我们轻易地抵达了对岸，并将这座石桥命名为“巨人之脊”。\n\n"


    LFC_event_forest.14.t:"变质的口粮"
    LFC_event_forest.14.d:"持续的高温和湿气终于摧毁了我们防线的一部分。一批储藏不当的食品发生了变质，但直到数十名士兵在晚餐后痛苦地倒下，我们才发现这个致命的问题。一场突如其来的食物中毒正在营地中蔓延。"

    LFC_event_forest.14.a:"原地修正，依靠士兵的体质硬撑过去"
    LFC_tooltip_forest_event_14_a:"我们为病患提供了干净的饮水和休息环境，希望他们能依靠自身免疫力恢复。大部分士兵最终挺了过来，但这次中毒事件严重削弱了我们的有生力量。\n\n"

    LFC_event_forest.14.b:"动用珍贵的药物进行治疗"
    LFC_tooltip_forest_event_14_b:"医疗官动用了大量的广谱抗生素和止泻药物，为所有出现症状的士兵进行治疗。虽然这消耗了我们近半的药品储备，但大多数士兵很快就恢复了健康。\n\n"

    LFC_event_forest.14.c:"施展群体治愈术"
    LFC_tooltip_forest_event_14_c:"魔法少女吟唱着治愈的祷文，温暖的圣光拂过每一位痛苦的士兵。在魔力的作用下，他们体内的毒素被迅速中和，很快便恢复了活力。\n\n"


    LFC_event_forest.15.t:"日晷之锁"
    LFC_event_forest.15.d:"我们发现了一座先驱者神庙的入口，但它被一个巨大的日晷之锁所封印。根据壁画的提示，需要将数道特定角度的阳光同时聚焦在锁芯的水晶上，才能将其打开。然而，神庙位于深邃的峡谷底部，终年不见阳光，这使得谜题从物理上无法解开。"

    LFC_event_forest.15.a:"架设一个巨大的反射镜系统"
    LFC_tooltip_forest_event_15_a:"工程部队消耗了大量的镜片、金属和能源，在峡谷顶部架设了一个极其复杂的反射镜系统，试图将阳光折射下来。经过数天的调试和等待，我们总算捕捉到了几分钟的阳光，成功打开了大门。\n\n"

    LFC_event_forest.15.b:"尝试从侧面进行爆破"
    LFC_tooltip_forest_event_15_b:"我们决定放弃解谜，直接从神庙侧面的墙壁进行爆破。虽然这最终让我们得以进入，但剧烈的爆炸也引发了内部结构的坍塌，并导致了部分人员伤亡。\n\n"

    LFC_event_forest.15.c:"用魔法解决"
    LFC_tooltip_forest_event_15_c:"魔法少女根据研究人员的的指示，施展了精巧的光系魔法，创造出数个稳定可控的光源，完美地模拟了阳光。在众人的合作下，这个古老的谜题被轻易解开。\n\n"


    LFC_event_forest.16.t:"血蝇瘟疫"
    LFC_event_forest.16.d:"一群拳头大小、散发着腐臭的‘血蝇’盯上了我们。它们无孔不入，其叮咬不仅会吸取血液，更会传播一种使人肌肉无力的疾病。整个队伍的士气和效率都因此大幅下降，我们必须立刻处理掉这些恼人的害虫。"

    LFC_event_forest.16.a:"分发驱虫药剂，进行全面涂抹"
    LFC_tooltip_forest_event_16_a:"我们消耗了大量的驱虫药剂储备，命令所有士兵进行全身涂抹。药剂的气味令人作呕，但血蝇的骚扰确实大幅减少了。\n\n"

    LFC_event_forest.16.b:"组织捕杀小队，手动清除蝇群"
    LFC_tooltip_forest_event_16_b:"我们组织了专门的小队，用网和喷火器来捕杀这些血蝇。这是一场混乱而疲惫的战斗，许多士兵在捕杀过程中被反复叮咬而病倒。在消耗了少量燃料后，我们总算将营地附近的血蝇清理干净。\n\n"

    LFC_event_forest.16.c:"释放冰霜法术，冻结它们"
    LFC_tooltip_forest_event_16_c:"随着魔法少女吟唱咒文，一阵刺骨的寒风扫过营地，所有靠近的血蝇瞬间被冻结在半空中，然后像玻璃一样碎裂。\n\n"


    LFC_event_forest.17.t:"河道塌方"
    LFC_event_forest.17.d:"我们正沿着一条干涸的古河道行军，两侧高耸的崖壁因连日暴雨而变得不再稳固。突然，伴随着一阵巨响，我们后方的道路被一场大规模的塌方完全堵死，而前方的天气预报显示，一场更大的风暴即将来临。我们被困在了这个天然的死亡陷阱中，必须尽快脱困。"

    LFC_event_forest.17.a:"呼叫空军进行紧急吊运"
    LFC_tooltip_forest_event_17_a:"我们立刻联系了后方基地，请求重型运输飞艇的支援。在原地等待了数天后，飞艇终于抵达，将我们的人员和车辆分批次吊运出了这片绝境。\n\n"

    LFC_event_forest.17.b:"在风暴来临前清理出一条通路"
    LFC_tooltip_forest_event_17_b:"时间紧迫，我们决定依靠自己。士兵们顶着落石的风险争分夺秒地清理着道路。在付出了相当多的人员伤亡后，一条简陋的通道总算在风暴来临前被挖通了。\n\n"

    LFC_event_forest.17.c:"让工程部队清理道路"
    LFC_tooltip_forest_event_17_c:"工程部队的推土机和挖掘机在这种环境下展现了其无与伦比的效率。一条足以让整个车队通行的安全道路在一天内内就被清理了出来。\n\n"


    LFC_event_forest.18.t:"崩塌的遗迹"
    LFC_event_forest.18.d:"我们发现了一座半埋在山体中的先驱者建筑。就在先头部队进入其中进行勘探时，遗迹的结构突然开始变得不稳定，巨大的石块从天花板上不断坠落，出口也被落石堵死。我们必须立刻救出被困在里面的小队。"

    LFC_event_forest.18.a:"派出工兵进行挖掘"
    LFC_tooltip_forest_event_18_a:"经过数小时的奋战，一条通道被挖开。但许多士兵在挖掘过程中因过度劳累和二次坍塌而严重受伤。\n\n"

    LFC_event_forest.18.b:"使用工程炸药进行爆破"
    LFC_tooltip_forest_event_18_b:"工程师们计算了精确的爆破点，用有限的炸药清出了一条救援通道。虽然爆炸引发了进一步的坍塌，导致我们无法对遗迹进行更深入的探索，但被困的小队被成功救出。\n\n"

    LFC_event_forest.18.c:"让构装骑士清理障碍"
    LFC_tooltip_forest_event_18_c:"构装骑士巨大的动力臂在这种环境下发挥了无可替代的作用。它轻易地举起数吨重的巨石，像清理积木一样开辟出一条安全的通道。被困小队被迅速救出，几乎没有造成任何额外的人员损失。\n\n"


    LFC_event_forest.19.t:"剧毒瘴气林"
    LFC_event_forest.19.d:"前方的森林被一种散发着诡异绿色微光的瘴气所笼罩，空气中弥漫着一股甜腻的杏仁味。研究人员的紧急报告令人不寒而栗：这并非普通瘴气，而是一种未知植物散发出的、专门针对高等哺乳动物神经系统的剧毒气体。我们的常规防毒面具无法有效过滤这种超微粒子，任何吸入者都会在几分钟内呼吸系统麻痹，并在痛苦中窒息而死。"

    LFC_event_forest.19.a:"呼叫攻击机，投放燃烧弹"
    LFC_tooltip_forest_event_19_a:"我们呼叫了空中支援。数架攻击机呼啸而至，向森林中投掷了大量的燃烧弹。熊熊大火成功地烧光了所有植物，探险队得以顺利通过。\n\n"

    LFC_event_forest.19.b:"派遣一支穿着重型防护服的突击小队"
    LFC_tooltip_forest_event_19_b:"一支由精锐士兵组成的小队，穿上了我们为数不多的、用于处理极端生化危害的重型防护服。他们携带高压喷火器，手动清理出一条狭窄的通路。虽然任务最终成功，但仍有数名队员因防护服在行动中意外破损而牺牲。\n\n"

    LFC_event_forest.19.c:"让骑士作为开路先锋"
    LFC_tooltip_forest_event_19_c:"构装骑士拥有完全密封的驾驶舱和独立的空气循环系统，使其能完全免疫毒气的影响。它像一艘破冰船，在前方用喷火器开辟出一条宽阔的道路，我们紧随其后，安全地通过了这片区域。\n\n"


    LFC_event_forest.20.t:"无尽的绿海"
    LFC_event_forest.20.d:"我们进入了一片地貌极其单调的原始雨林。这里所有的树木都长得一模一样，没有任何可供辨认的地标。更糟糕的是，研究人员报告该区域存在强烈的地磁异常，导致我们所有的罗盘都已失灵。我们就像一叶孤舟，彻底迷失在了这片无边无际的绿色海洋之中。"

    LFC_event_forest.20.a:"呼叫侦察机，进行高空三角定位"
    LFC_tooltip_forest_event_20_a:"我们向后方基地发送了求助信号。在原地等待了数天后，一架高空侦察机终于抵达。它通过与我们进行多点信号交互，成功地为我们重新校准了坐标，并规划出一条离开这片区域的路线。\n\n"

    LFC_event_forest.20.b:"派遣侦察兵，向所有方向进行探索"
    LFC_tooltip_forest_event_20_b:"在导航系统失灵的情况下，我们只能回归最原始的办法。大量的侦察兵被派往不同方向，用记号标记着路线。虽然我们最终通过这种拉网式搜索找到了出路，但也付出了数支小队失联的惨痛代价。\n\n"

    LFC_event_forest.20.c:"利用构装骑士的的雷达系统"
    LFC_tooltip_forest_event_20_c:"我们启动了构装骑士搭载的先进军用雷达。它扫描了周围数十平方公里的地形，并将其与我们出发前准备的地形图进行匹配。在经过数小时的运算后，我们成功找到了当前所在的位置，并依靠雷达的指引离开了磁场异常区域。\n\n"

  #雨林负面战斗事件
    LFC_event_forest.21.t:"丛林中的伏击"
    LFC_event_forest.21.d:"我们的队伍在泥泞和藤蔓中艰难前行。空气闷热潮湿，充满了腐烂植被和未知生物的气味。就在斥候报告前方发现一处相对开阔的河岸时，丛林突然‘活’了过来。无数手持黑曜石棍棒的蜥人战士从树冠和灌木丛中一跃而出，它们结实的肌肉在潮湿的空气中泛着光，冰冷的眼睛里闪烁着原始的杀意。"

    LFC_event_forest.21.a:"组成环形防线，正面迎敌"
    LFC_tooltip_forest_event_21_a:"士兵们迅速组成防线，用子弹和勇气对抗着蜂拥而至的蜥人战士。\n\n"

    LFC_event_forest.21.b:"集中火力，重点突破"
    LFC_tooltip_forest_event_21_b:"装甲车的重机枪喷吐着火舌，为我们打开了一条通路。\n\n"

    LFC_event_forest.21.c:"让构装骑士发起突击"
    LFC_tooltip_forest_event_21_c:"随着驾驶员启动动力核心，构装骑士背部的推进器发出一声轰鸣，沉重的机体一跃而起，猛然砸入敌阵。它们手中的等离子光剑轻易地撕裂了蜥蜴人的鳞甲，肩部的机炮则喷吐出致命的火雨。\n\n"

    LFC_event_forest.21.e:"交替掩护撤退，我们绕路走"
    LFC_tooltip_forest_event_21_e:"面对如此数量的敌人，硬拼并不明智。我们用火力压制住敌人的攻势，且战且退，但这片未知的雨林会消耗掉更多的补给。\n\n"


    LFC_event_forest.22.t:"蜥人部落"
    LFC_event_forest.22.d:"斥候带回了令人不安的情报。在我们前进的必经之路上，出现了一个不应存在的障碍。远处的树木被大量砍伐，形成了一片人为的开阔地，隐约能看到烟柱升起，空气中传来模糊的鼓声和野兽的咆哮。毫无疑问，一个颇具规模的蜥蜴人据点盘踞于此，将我们的道路完全封死。"

    LFC_event_forest.22.a:"发动一次果断的突袭"
    LFC_tooltip_forest_event_22_a:"经过详细的战术规划，探险队对部落发起了协同进攻。战斗很激烈，但我们最终还是成功攻克了这座据点。\n\n"

    LFC_event_forest.22.b:"让机械化部队主导进攻"
    LFC_tooltip_forest_event_22_b:"车载重火力为进攻提供了有效支援，压制了敌人的抵抗。\n\n"

    LFC_event_forest.22.c:"投入构装骑士，碾碎他们"
    LFC_tooltip_forest_event_22_c:"构装骑士的介入让这场战斗变成了一场单方面的屠杀。他们厚重的装甲无视了敌人的武器，强大的火力将整个据点化为一片火海。\n\n"

    LFC_event_forest.22.e:"我们没必要招惹它们，绕路走"
    LFC_tooltip_forest_event_22_e:"在评估了风险后，我们决定避开这个威胁。探险队转向进入了更茂密的丛林，在消耗了大量时间和物资后，终于重新回到了预定路线上。\n\n"


    LFC_event_forest.23.t:"太阳引擎"
    LFC_event_forest.23.d:"探险队正在狭窄的河谷中行进，突然，一道灼热的太阳光束从高处山脊上射下，在我们前方的地面上炸开一个熔融的弹坑。斥候紧急报告：一头巨大的甲龙正盘踞在山脊上，它背上驮着一个由巨大水晶和黄金构成的古代装置——太阳引擎，它能将阳光聚焦成一道毁灭性的能量光束，把我们完全压制在了这片开阔的河滩上。"

    LFC_event_forest.23.a:"用火箭筒抵近射击"
    LFC_tooltip_forest_event_23_a:"在火力掩护下，士兵们以散兵线展开，利用岩石和树木作为掩体，交替前进。在付出了相当的代价后，火箭筒小组终于进入有效射程，成功将那头巨兽击毙。\n\n"

    LFC_event_forest.23.b:"用车载火炮轰击敌人"
    LFC_tooltip_forest_event_23_b:"尽管有几辆装甲车在途中被直接命中，但剩余的车辆成功进入了有效射程。数轮齐射后，那头巨兽终于在爆炸中轰然倒下。\n\n"

    LFC_event_forest.23.c:"让构装骑士发起突击"
    LFC_tooltip_forest_event_23_c:"构装骑士启动了推进器，无视了崎岖的地形，以一道精准的抛物线直接跃上了山脊。面对这些从天而降的钢铁巨人，甲龙的抵抗毫无意义，很快就被破城矛轰成了碎片。\n\n"

    LFC_event_forest.23.e:"呼叫空中支援，进行一次精确打击"
    LFC_tooltip_forest_event_23_e:"我们向后方呼叫了空中支援。不久，数架轰炸机呼啸而至，投下的航弹准确地命中了目标。剧烈的爆炸将那头巨兽连同它脚下的山脊一同掀翻。\n\n"


    LFC_event_forest.24.t:"火蜥蜴"
    LFC_event_forest.24.d:"探险队正在一片林间空地休整，突然，一阵阵尖锐的嘶鸣声从周围的密林中传来。紧接着，数道黏稠的火球从林中喷射而出，在我们的人群中炸开，瞬间将几名士兵吞噬在火焰里。我们遭到了伏击，但敌人隐藏得很好，我们看不见他们，只能被动地承受着一轮又一轮的火焰洗礼。"

    LFC_event_forest.24.a:"组织步兵，向火力点发起反击"
    LFC_tooltip_forest_event_24_a:"在军官的指挥下，数个步兵班组冒着火焰向着攻击来源的方向发起了冲锋。在付出了不小的伤亡后，他们终于找到了那些隐藏在灌木丛中的、如同巨型蝾螈的喷火蜥蜴，并成功将其全部消灭。\n\n"

    LFC_event_forest.24.b:"用压倒性的火力清除威胁"
    LFC_tooltip_forest_event_24_b:"所有车辆立刻将车载的重机枪和火炮对准了丛林，进行不间断的扫射。在密集的弹雨和爆炸下，敌人的火力点被逐一清除，林中的嘶鸣声最终归于沉寂。\n\n"

    LFC_event_forest.24.c:"启动热成像索敌，进行精确清除"
    LFC_tooltip_forest_event_24_c:"构装骑士启动了它们先进的热成像传感器，那些喷吐火焰的冷血生物在显示屏上清晰可见。骑士们用榴弹炮对这些目标进行了逐一的精确点杀，很快歼灭了敌人。\n\n"

    LFC_event_forest.24.e:"呼叫空中支援，进行一次“焦土”打击"
    LFC_tooltip_forest_event_24_e:"我们暂时后退并向后方呼叫了空中支援。不久，轰炸机群抵达，将大量的燃烧弹倾泻在了那片丛林中。燃起的大火将所有隐藏的威胁都化为了灰烬，彻底终结了这场伏击。\n\n"


    LFC_event_forest.25.t:"死亡之翼"
    LFC_event_forest.25.d:"探险队正在狭窄的峡谷中行进，两侧的高崖限制了我们的视野和机动。突然，刺耳的尖啸从头顶传来，一群骑乘着双足翼龙的灵蜥从天而降。它们盘旋在峡谷上方，骑手们居高临下地向我们投掷着淬毒的短矛和火瓶。"

    LFC_event_forest.25.a:"就地寻找掩护，组织对空火力网"
    LFC_tooltip_forest_event_25_a:"士兵们依托岩壁和车辆进行隐蔽，将所有能对空的武器都指向了天空。子弹与短矛在空中交织，虽然我们最终击退了空中的威胁，但还是有不少士兵在仰攻中被击中倒下。\n\n"

    LFC_event_forest.25.b:"展开防空火力，进行区域封锁"
    LFC_tooltip_forest_event_25_b:"半履带车上的防空机枪开始怒吼，迅速在峡谷上空构建起一道致命的弹幕。面对这道无法逾越的火网，双足翼龙在丢下几具同伴的尸体后便仓皇撤退了。\n\n"

    LFC_event_forest.25.c:"启动火控雷达，进行精确打击"
    LFC_tooltip_forest_event_25_c:"构装骑士启动了它们的火控雷达，先进的弹道计算机迅速锁定了空中高速移动的目标。随着指令下达，肩部的自动机炮精准地喷吐出火舌，将天上的威胁如苍蝇般一一清除。\n\n"

    LFC_event_forest.25.e:"释放烟雾弹，掩护部队通过"
    LFC_tooltip_forest_event_25_e:"我们向峡谷中投掷了大量的烟雾弹，浓厚的烟雾迅速遮蔽了天空。失去了视野的翼龙骑手无法再进行有效攻击，只能在空中徒劳地盘旋，我们趁机安全地通过了这片死亡区域。\n\n"

  #雨林正面事件
        LFC_event_forest.31.t:"静谧林地"
        LFC_event_forest.31.d:"“在穿越了又一片令人窒息的密林后，探险队意外地发现了一处不像存在于这个世界的静谧林地。这里的空气一扫雨林的闷热与腐臭，变得清新宜人。奇异的发光植物散发着柔和的光芒，照亮了清澈的溪流和色彩斑斓的鲜花。这里就像一个与世隔绝的圣所，与周围的险恶环境形成了鲜明的对比，似乎值得我们花时间探索一番。”"

        LFC_event_forest.31.a:"采集此地的果实和水源"
        LFC_tooltip_forest_event_31_a:"我们发现此地的果实不仅无毒，还富含水分和能量。清澈的溪流也为我们提供了宝贵的洁净水源。\n\n"

        LFC_event_forest.31.b:"在林地中休整，治疗伤员"
        LFC_tooltip_forest_event_31_b:"事实证明，这里的泉水拥有神奇的治愈效果。伤员的伤口迅速愈合，所有人的疲劳也一扫而空。\n\n"

        LFC_event_forest.31.c:"仔细勘探这片区域"
        LFC_tooltip_forest_event_31_c:"在林地的深处，我们发现了一条被巧妙隐藏起来的古道。这条道路似乎能让我们绕开前方大片的崎岖地形。\n\n"



        LFC_event_forest.32.t:"遗忘的前哨"
        LFC_event_forest.32.d:"在清理一片被藤蔓覆盖的废墟时，探险队有了一个惊人的发现：一个早已被遗忘的殖民地前哨站。从一块锈蚀金属板上褪色的徽章来看，这属于几十年前深入这片雨林，最终不幸失联的远征队之一。此地寂静得有些诡异，但或许能找到一些有用的东西。"

        LFC_event_forest.32.a:"搜刮前哨站的仓库"
        LFC_tooltip_forest_event_32_a:"我们在仓库里找到了大量密封完好的口粮和燃料。这次意外的发现极大地补充了我们的物资储备。\n\n"

        LFC_event_forest.32.b:"检查前哨站的医务室"
        LFC_tooltip_forest_event_32_b:"在医务室里，我们发现了一批保存完好的强效药物。利用这些药品，我们的伤员得到了远超预期的治疗和恢复。\n\n"

        LFC_event_forest.32.c:"调查指挥官的办公室"
        LFC_tooltip_forest_event_32_c:"在指挥官办公室的保险箱里，我们找到了这支初代远征队覆灭前的最后发现——一件被他们发掘的先驱者遗物。\n\n"



        LFC_event_forest.33.t:"林中偶遇"
        LFC_event_forest.33.d:"探险队正在林间小憩，几名士兵突然报告说，感觉自己正被什么东西‘观察’着。片刻之后，一支妖精巡林客队伍悄无声息地从周围的树木后现身。我方立刻进入戒备状态，但随队的学者立刻上前，用流利的妖精语表明了我们的身份。\n\n在解除了误会后，妖精的领队解释说，她们正在追踪一伙深入雨林的蜥蜴人。在确认了我们是来自露斯契亚的盟友后，她们紧绷的表情也放松了下来。"

        LFC_event_forest.33.a:"提议分享物资"
        LFC_tooltip_forest_event_33_a:"我们用一些制式口粮，从她们那里换来了许多关于这片雨林的知识，并被指引着找到了不少可食用的植物和果实。\n\n"

        LFC_event_forest.33.b:"说服她们加入探险队"
        LFC_tooltip_forest_event_33_b:"在得知我们的目的地与她们追踪的方向大致相同后，妖精们同意与我们同行一段路程。\n\n"

        LFC_event_forest.33.c:"询问周围的道路"
        LFC_tooltip_forest_event_33_c:"妖精领队慷慨地分享了一份她们绘制的简易地图，上面标记出了一条能够绕开前方大片沼泽地的隐秘捷径。\n\n"



        LFC_event_forest.34.t:"意外的援军"
        LFC_event_forest.34.d:"前方的密林中传来了此起彼伏的爆炸声和尖锐的嘶吼，显然有激烈的战斗正在发生。侦察兵带回了惊人的情报：一小队身着奇特服装的少女，正在被潮水般涌来的、外形可怖的魔物围攻。随队的魔术师认出了她们的身份——来自“魔法少女联盟”的成员，而那些魔物，则是传说中魔女的使魔。\n\n在我们的重火力支援下，这些烦人的使魔很快就被成功肃清。魔法少女解释说，她们正在追猎一个逃入雨林的魔女，并表示愿意为我们提供一些力所能及的帮助。"

        LFC_event_forest.34.a:"接受她们赠予的礼物"
        LFC_tooltip_forest_event_34_a:"为了表示感谢，她们赠予了我们一些备用的施法材料。这些珍贵的材料极大地补充了我方魔术师的储备。\n\n"

        LFC_event_forest.34.b:"说服她们与我们同行"
        LFC_tooltip_forest_event_34_b:"我们向她们提议，可以共同行动来应对雨林中的威胁，短暂的讨论后，魔法少女们决定暂时加入探险队。\n\n"

        LFC_event_forest.34.c:"向她们询问周围的情况"
        LFC_tooltip_forest_event_34_c:"我们向她们询问了关于这片区域的情报。她们提到不远处有一座巨大的古代建筑。根据她们提供的位置，我们稍作探索，便发现了一个隐秘的先驱者遗迹。\n\n"



        LFC_event_forest.35.t:"蛇神金字塔"
        LFC_event_forest.35.d:"连日的暴雨让探险队寸步难行，我们被迫在一处相对稳固的山坡上扎营。就在午夜，一阵震耳欲聋的轰鸣声将所有人从睡梦中惊醒——我们对面的那座山坡，在被雨水浸透后，竟发生了大规模的垮塌！\n\n直到黎明，这场可怕的自然灾害才终于平息。当清晨的第一缕阳光刺破云层时，我们震惊地发现，那座垮塌的山坡竟露出了一角完全不应属于这个世界的建筑。随着我们小心翼翼地靠近，这座建筑的全貌逐渐展现在我们面前：这竟是一座宏伟的阶梯金字塔，它完全由黑曜石砌成，表面镶嵌着复杂的黄金纹路，描绘着凡人无法理解的星辰轨迹与蛇形神祇。山体滑坡竟为我们开辟出了一条直通其基座的宽阔甬道。空气中弥漫着古老的寂静与一种若有若无的能量嗡鸣。一座被掩埋了不知道多久的先驱者遗迹，就这样展现在了我们面前。"

        LFC_event_forest.35.a:"探索金字塔的储藏室"
        LFC_tooltip_forest_event_35_a:"在内部的一个储藏室里，我们发现了一批被精心储存的能量水晶。它们是珍贵的施法材料，极大地补充了我方魔术师的储备。\n\n"

        LFC_event_forest.35.b:"搜寻金字塔的净化池"
        LFC_tooltip_forest_event_35_b:"在一处祭坛上，我们发现了一个仍在汇聚着能量的石制水盆。其中的液体拥有神奇的治愈效果。\n\n"

        LFC_event_forest.35.c:"调查金字塔的核心密室"
        LFC_tooltip_forest_event_35_c:"在密室中，我们找到了这座神殿的能量核心——一块被放置在黄金基座上、仍在缓缓脉动的巨大水晶。\n\n"




