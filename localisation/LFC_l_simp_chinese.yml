  LFC_decision_l_2_Rainforest_Exploration:"深入雨林"
  LFC_decision_l_2_Rainforest_Exploration_desc:"百年前，殖民者们只能龟缩在海岸线，躲避雨林深处的险恶环境和怪物。但如今，远征军的旗帜已插遍大片新拓的疆土，征服整个雨林似乎指日可待。\n而我们的成就，也引来了整个圣杯联邦的瞩目。雨林深处不仅蕴藏着宝贵的资源，更有沉睡了万年的先驱者遗迹被发现。这些遗物的价值无可估量，本土对此事的重视日益加深，无数怀揣着发财梦的民间冒险家也如潮水般涌入我们的港口，渴望在这场新的淘金热中分一杯羹。\n探险队的每一次出发都不是简单的勘探行动，而是一场深入未知、挣扎求存的冒险。探险队将独自面对饥饿、疾病以及潜伏在丛林中的可怖生物，他们的每一步都将书写新的历史，或成为雨林中又一个无名的悲剧。\n在这里，胜利不仅取决于武器的精良，更取决于后勤的坚韧。毕竟，雨林从不吝于吞噬那些准备不足的鲁莽者。"

  LFC_decision_l_3_Colony:"先驱者遗迹开发署"
  LFC_decision_l_3_Colony_desc:"对雨林地区的初步勘探与控制仅仅是第一步，持续的移民投资与基建开发才是确立长久统治的基石。与此同时，广袤的密林深处仍隐藏着大量未被发掘的先驱者遗迹，组织探险队深入未知、建立稳定的遗物发掘网络已是当务之急。为此，时钟塔已在露斯契亚正式设立分部，他们将全权负责解析这些远古遗物，并将其转化为切实可行的技术应用。\n\n§Y先驱者遗物数量：§!§C[?LFC_VAR_Rainforest_product|0]§!\n§Y每月遗物增长：§!§G[?LFC_VAR_Rainforest_product_monthly|0]§!"

  LFC_decision_l_4_Empire_Reinforcements:"帝国援军"
  LFC_decision_l_4_Empire_Reinforcements_desc:"作为圣杯王国的殖民地之一，露斯契亚在过去数个世纪中始终维系着行政自治权与独立的军事指挥体系。出于地缘战略与后勤成本的考量，本土鲜少直接干预此地的军务运转。\n然而，随着雨林深处的“先驱者遗迹”重见天日，伦敦的态度迎来了根本性的转折。本土开始以前所未有的力度将军事筹码压注在这片曾经的边缘之地。时至今日，日不落帝国各地的军队都已经做好了随时增援露斯契亚的准备。\n\n§Y当前战备等级：§![GET_VAR_LFC_defcon_text]\n§Y当前£LFC_trait_planning 调度许可：§!§C[?LFC_VAR_Empire_license|0]§!\n§Y每月£LFC_trait_planning 调度许可增长：§!§G[?LFC_VAR_Empire_license_monthly_end|0]§!"

