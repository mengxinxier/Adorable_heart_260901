#第二领袖
  LFC_aetle_name:"弗朗西斯·德雷克"
  LFC_aetle_buff:"§Y弗朗西斯·德雷克§!"
  LFC_aetle_Diplomacy_desc:"§Y弗朗西斯·德雷克§!\n@LFC§Y[FROM.Getname]§!的§C舰队司令§!"
  LFC_aetle_desc:"弗朗西斯·德雷克并非这个时代的凡人，而是被唤醒的英灵。生前的她是一位铸就了不朽传奇的“星之开拓者”：她曾率领舰队沿着南美洲东海岸一路南下，在未知的狂风巨浪中完成了史诗般的勘探，不仅证明了火地岛并非南方大陆的一部分，更发现了合恩角与那条以她名字命名的险恶水道——德雷克海峡。她也是令全欧洲敬畏的海军将领，在1588年面对庞大的西班牙“无敌舰队”时，正是她以惊人的战略眼光和果断的火船突击，在格瑞福兰海战中撕裂了敌人不可一世的阵型，拯救了风雨飘摇的不列颠。\n\n伟大战争后，露斯契亚雨林深处新出土的先驱者遗迹重新点燃了她探索未知的狂热。这位骨子里流淌着冒险之血的海军中将拒绝了伦敦的安逸，她主动请缨，率领舰队再次回到了这片曾留下她足迹的狂野大陆。\n\n现任总督马库斯原本看中了德雷克无与伦比的开拓能力和历史经验，为了加快对雨林的控制，破格任命这位海军中将兼任“拓殖与边境事务局局长”。然而，两人的蜜月期并未持续太久。\n\n德雷克性格豪放开朗、气场极强，虽然在台面上保持着帝国将领的礼度，但骨子里却坚持大航海时代的殖民扩张思想，这让她对马库斯谨慎保守的外交路线大为不满。她极度不信任周边的原住民政权，并断言北方的阿德莱西帝国迟早会大举南下。因此，她极力主张抢在帝国之前武力吞并孱弱的妖精联盟，并要求加强对魔法少女联盟的政治干预，将其从盟友转变为受控的保护国。\n\n尽管这位行事雷厉风行、极具扩张欲的局长常常让寻求平衡的总督感到头痛无奈，但所有人都心知肚明，只要她的旗舰“黄金鹿号”还停泊在新安普敦，露斯契亚的制海权就无可撼动。"

#人物
 #领导人
  LFC_character_Markus:"马库斯·沃法特"
  LFC_character_Markus_desc:"马库斯·沃法特并非出生于圣杯王国繁华的雾都，而是来自露斯契亚边境的偏远村落德拉肯堡。在她赴首都求学期间，故乡因遭到雨林内怪物的袭击而毁灭。这场惨剧成为了她一生的转折点。在投奔本土的远亲后后，她将悲痛化作冷酷的专注，以优异成绩从军校毕业，并成为了一名手段雷厉的怪物猎人。\n\n伟大战争为她兑现卓越的军事天赋提供了舞台。在条件极其恶劣的非洲热带雨林战区，马库斯展现出了无与伦比的指挥艺术，率部屡次击溃敌国军队。凭借赫赫战功，她不仅一路晋升为陆军元帅，更被女王亲自授予了神器“琥珀之弓”，成为军中备受瞩目的新星。战后，随着露斯契亚深处先驱者遗迹的重见天日，敏锐察觉到昔日仇敌踪迹的马库斯欣然接受了本土的任命，组建远征军并以总督之姿重返故土。\n\n自上任以来，马库斯总督展现出了铁腕与务实并重的执政风格。她迅速整合了本地官僚体系，并巧妙利用因遗迹热潮而涌入的本土资本与劳动力，将其转化为自治领的基建与工业。她并没有选择龟缩于安全的海岸线，而是以一战老兵为骨干组建远征军，向着危机四伏的西部原始雨林发起了一系列卓有成效的扩张。在她的指挥下，远征军披荆斩棘，在毒瘴与野兽的包围中建立起层层推进的前哨要塞与后勤补给网络，将人类的绝对控制力深深锲入了这片“绿色地狱”。"

  LFC_character_Francis_Drake:"弗朗西斯·德雷克"
