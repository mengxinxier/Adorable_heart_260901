    LFC_idea_jjlx_1:"与本土的经济联系（较弱）"
    LFC_idea_jjlx_1_desc:"每通过此民族精神贡献1工厂，每月调度许可+2。此外，较弱，普通，较强三个等级会额外提供30，60，90每月调度许可。由此民族精神提供的调度许可会显示在修正中，数值每月刷新。"
    LFC_idea_jjlx_2:"与本土的经济联系（普通）"
    LFC_idea_jjlx_2_desc:"每通过此民族精神贡献1工厂，每月调度许可+2。此外，较弱，普通，较强三个等级会额外提供30，60，90每月调度许可。由此民族精神提供的调度许可会显示在修正中，数值每月刷新。"
    LFC_idea_jjlx_3:"与本土的经济联系（较强）"
    LFC_idea_jjlx_3_desc:"每通过此民族精神贡献1工厂，每月调度许可+2。此外，较弱，普通，较强三个等级会额外提供30，60，90每月调度许可。由此民族精神提供的调度许可会显示在修正中，数值每月刷新。"

    LFC_idea_bphdgyxt:"不平衡的工业体系"
    LFC_idea_bphdgyxt_desc:"露斯契亚的经济长期依赖转口加工——集中南美各国的原料与初级产品，经初步加工后输往本土及海外市场。建筑业、轻工业与出口贸易因此兴盛，但精加工和高科技产业长期薄弱，电子元件、精密仪器与技术装备几乎完全依赖本土供应。\n\n在和平时期，这种分工格局影响有限，反而发挥了本地的特产优势。然而近期南美局势日趋动荡，阿德莱西与莉兰迪亚的政局均不稳定。一旦战争爆发，仅靠本土的军事援助远不足够，我们必须尽快改善这条失衡的产业链，力求在战时具备批量生产技术装备的能力。"

    LFC_idea_bphdgyxt_2:"不平衡的工业体系"
    LFC_idea_bphdgyxt_2_desc:"露斯契亚的经济长期依赖转口加工——集中南美各国的原料与初级产品，经初步加工后输往本土及海外市场。建筑业、轻工业与出口贸易因此兴盛，但精加工和高科技产业长期薄弱，电子元件、精密仪器与技术装备几乎完全依赖本土供应。\n\n在和平时期，这种分工格局影响有限，反而发挥了本地的特产优势。然而近期南美局势日趋动荡，阿德莱西与莉兰迪亚的政局均不稳定。一旦战争爆发，仅靠本土的军事援助远不足够，我们必须尽快改善这条失衡的产业链，力求在战时具备批量生产技术装备的能力。"

    LFC_idea_bphdgyxt_3:"不平衡的工业体系"
    LFC_idea_bphdgyxt_3_desc:"露斯契亚的经济长期依赖转口加工——集中南美各国的原料与初级产品，经初步加工后输往本土及海外市场。建筑业、轻工业与出口贸易因此兴盛，但精加工和高科技产业长期薄弱，电子元件、精密仪器与技术装备几乎完全依赖本土供应。\n\n在和平时期，这种分工格局影响有限，反而发挥了本地的特产优势。然而近期南美局势日趋动荡，阿德莱西与莉兰迪亚的政局均不稳定。一旦战争爆发，仅靠本土的军事援助远不足够，我们必须尽快改善这条失衡的产业链，力求在战时具备批量生产技术装备的能力。"

    LFC_idea_bphdgyxt_4:"不平衡的工业体系"
    LFC_idea_bphdgyxt_4_desc:"露斯契亚的经济长期依赖转口加工——集中南美各国的原料与初级产品，经初步加工后输往本土及海外市场。建筑业、轻工业与出口贸易因此兴盛，但精加工和高科技产业长期薄弱，电子元件、精密仪器与技术装备几乎完全依赖本土供应。\n\n在和平时期，这种分工格局影响有限，反而发挥了本地的特产优势。然而近期南美局势日趋动荡，阿德莱西与莉兰迪亚的政局均不稳定。一旦战争爆发，仅靠本土的军事援助远不足够，我们必须尽快改善这条失衡的产业链，力求在战时具备批量生产技术装备的能力。"

    LFC_idea_jjwj:"经济危机"
    LFC_idea_jjwj_desc:"一场严重的经济危机正在席卷我们的殖民地。工厂减产、贸易萎缩、失业率攀升，经济基础正遭受前所未有的打击。"

    LFC_idea_jjwjyb:"经济危机余波"
    LFC_idea_jjwjyb_desc:"紧急听证会过后，政府迅速出台了一揽子干预措施，危机已初步得到遏制。但经济复苏尚需时日，部分负面影响仍在持续。"

    LFC_idea_jkbtsb:"进口本土工业设备"
    LFC_idea_jkbtsb_desc:"为了尽快填补国内制造业的缺口，总督府以优惠关税大批进口了本土的工业母机、建筑器械与精密测量仪器。这些设备被优先分配至各重点工地和新建工厂，显著提升了施工效率，也降低了消费品对本土的依赖。"

    LFC_idea_wbdgyxt:"完备的工业体系"
    LFC_idea_wbdgyxt_desc:"历经多年的工业化改造，露斯契亚终于建起了覆盖采矿、冶炼、制造与精密加工全链条的自主工业体系。从新安普顿的钢铁高炉到金斯布里奇的飞机装配线，每一环都掌握在自己手中。这座曾经依赖转口加工的殖民地，如今已能独立量产从步枪到战舰的各类装备，本土的技术与资本在此扎根，再也无法被轻易动摇。"

    LFC_idea_tjjcss:"推进基础设施建设"
    LFC_idea_tjjcss_desc:"总督府设立了专项建设基金，在全国范围内大规模推进公路、铁路、港口与公共设施的兴建与升级。施工队伍遍布城乡，塔吊与脚手架成为新时代的风景线，殖民地的基础承载能力正得到根本性提升。"

    LFC_idea_lscsh:"露斯契亚城市化"
    LFC_idea_lscsh_desc:"随着高速公路网、水坝与水电设施的相继竣工，露斯契亚的核心领土已从零散的殖民地聚落蜕变为功能齐备的现代都市群。新安普顿、金斯布里奇等中心城市迅速扩张，工厂、住宅与商业区井然有序地铺展开来。工业税收与消费税成为财政支柱，帝国的资本与技术在此扎根，一座座新兴城市正以惊人的速度拔地而起。"

    LFC_idea_xjyd:"西进运动"
    LFC_idea_xjyd_desc:"边疆垦殖法的颁布掀起了新一轮向西开拓的浪潮。政府以优厚的土地配额和税收减免为激励，吸引大批移民深入内陆垦荒建镇。人口持续流入，新兵源的补充速度与规模均得到显著提升。"

    LFC_idea_jyjsry:"经验丰富的技术人员"
    LFC_idea_jyjsry_desc:"鼓励本土技工移民的政策吸引了大量来自帝国的熟练技师、工程师与工头。他们在新大陆建立起高效的生产管理体系，将本土的先进工艺与殖民地实际相结合，工厂与船坞的产出效率显著提升，生产线从第一天起就能以更高的水准运转。"

    LFC_idea_bzgsf:"标准工时法"
    LFC_idea_bzgsf_desc:"限制最高工时、规定最低工资、改善劳动环境——这一系列举措短期内抬高了工厂运营成本，消费品需求随之增加。然而更健康的劳动队伍带来了更稳定的生产节奏，工厂的上限产能与效率爬坡速度均得到提升。"

    LFC_idea_jmqys:"减免企业税收"
    LFC_idea_jmqys_desc:"为刺激经济活力，政府大幅削减企业所得税与消费税税率，减轻企业负担以释放其生产潜力。工厂与船坞的利润率随之攀升，消费品价格下降，更多的资金得以投入技术研发，整个殖民地的工业竞争力显著提升。"

    LFC_idea_zsky:"重视资源开发"
    LFC_idea_zsky_desc:"露斯契亚地大物博，但广袤的自然资源若不加以系统勘探与规模化开采，便只是沉睡的财富。政府设立专门的地质勘探局与资源开发基金，鼓励企业深入内陆进行矿产普查，引进最新采矿技术与设备。煤炭产量稳步攀升，油田钻井日夜不息，帝国所需的战略资源正以前所未有的规模从这片新大陆涌出。"

    LFC_idea_frckmy:"繁荣的出口贸易"
    LFC_idea_frckmy_desc:"随着资源开发规模的扩大，露斯契亚的出口贸易迎来了黄金时代。煤炭、石油、橡胶与各类矿产从新安普敦、威弗利等港口源源不断地装船运往帝国本土与国际市场。政府设立贸易促进署，与各国签订优惠贸易协定，外商纷至沓来，露斯契亚的商品在国际市场上赢得了无可替代的声誉。"

    LFC_idea_nybzyx: "能源保障法"
    LFC_idea_nybzyx_desc: "规定外资持股上限设为75%，在吸引外资与保障能源自主之间寻求平衡。"
    LFC_idea_nymqzddq: "能源保障法"
    LFC_idea_nymqzddq_desc: "规定外资持股不得超过49%，确保本国资本对能源命脉的最终决策权。"
    LFC_idea_nyyggk: "能源保障法"
    LFC_idea_nyyggk_desc: "规定外资持股不得超过25%，由国家牢牢掌控战略能源产业命脉。"

    LFC_idea_ast_xylscqkmt: "向露斯契亚出口煤炭"
    LFC_idea_ast_xylscqkmt_desc: "学园都市与露斯契亚签订了长期煤炭贸易协议，每月向露斯契亚输送优质煤炭资源。这笔稳定的外汇收入为学园都市的科研与建设注入了新的活力。"
    LFC_tooltip_idea_ast_xylscqkmt: "£hcp_small 每月额外收入：+10%"
