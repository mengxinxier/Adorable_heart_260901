 PAW_GATHERING_STORM_DESC: "银蓝色的光幕已经笼罩这片土地整整十三年。\n没有人知道它从何而来，也没有人能穿越它。昔日的商船航线早已荒废，外交使节在边界徘徊后无功而返，地图上的“翁法罗斯”四个字被标注为“通讯断绝”。外界猜测它已陷入混乱，或毁灭，或沉睡——但真相远比任何猜测都更诡异。\n国境之内，一切仍在运转。工厂的烟囱照常冒烟，稻田照常生长，港口的水手照常装卸货物——只是所有人都面无表情，目光空洞。他们的女皇刻律德菈已在奥赫玛皇宫深处沉睡十三年，与她一同沉睡的还有整个国家的统治阶层。他们的身体被安置在某种大理石棺椁中，维持着微弱的生命迹象；他们的意识则被困在一个名为“翁法罗斯”的虚拟世界中，一次又一次地轮回，不知疲倦地追逐着“集齐十二泰坦火种”这个被植入的目标。\n这一切的幕后推手是一名不该存在于此世界的智械。他声称这一切是为了“打破文明的边界”，但从未解释过这意味着什么。智械以女皇之名维持着这个国家的运转，等待着“变量”的降临。\n§R“变量已抵达。永世轮回实验，进入最终阶段。欢迎，命运之外的访客。翁法罗斯等待你的选择。”§!\n"

