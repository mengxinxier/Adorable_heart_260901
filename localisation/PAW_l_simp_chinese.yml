#地形
Okhema: "奥赫玛"
Okhema_desc: "§L「永恒圣城」奥赫玛，是所有挣扎求生的凡人最后的避难所。在翁法罗斯被黑潮吞噬的末世里，唯有此处因负世泰坦刻法勒的守护，依旧被永恒的白昼所笼罩。高耸的城墙与泛着金辉的神圣建筑间，承载浪漫神权的黄金裔阿格莱雅以金丝织就万帷网，为流离的灵魂提供着秩序与庇护。\n城中景观最奇伟的，莫过于天边那尊背负黎明机器的巨神刻法勒。那台原属天空泰坦的造物被祂以自身火种点亮，撑起了圣城的永昼。而热闹的云石天宫与云石市集，则为这座圣城带来了末世中难得的生机与烟火气。这里不仅是凡人在绝望中唯一能安眠的净土，更是英雄们踏上逐火之旅、奔赴再创世征途的起点，承载着凡人对重塑世界、重获新生的全部信仰。§!"
GroveofEpiphany: "神悟树庭"
GroveofEpiphany_desc: "§L「贤者之乡」神悟树庭筑于裂分之枝的巨圣树干之间，坐落在翁法罗斯的林野盆地之上。理性之泰坦瑟希斯以巨树神躯垂临此地，终年沉思不语，将智慧的权能散入枝叶与根系之中。祂不曾轻易宣示意旨，只以生长的脉络藏下世界的答案。求学者纷纷奔赴此地，为思辨而来，为求真而来。\n最初的学者塞勒苏斯在巨树下建起第一座庭院，铺开第一卷草纸记录所思。此后千年，书页翻动的声响从未停歇。七贤人分掌七大学派与树庭要务，在层叠的木质廊宇间往复论辩。他们或倚坐枝桠凝思，或伏案书阁推演，以笔墨与逻辑一寸一寸叩问世界的本源。这里少有颂唱的圣歌，多是羽笔擦过纸页的轻响；典籍与手稿堆积如山，每一页都载着尚未穷尽的追问。§!"
AedesElysiae: "哀丽秘榭"
AedesElysiae_desc: "§L哀丽秘榭，这枚遗落在翁法罗斯尽头的旧梦，被岁月泰坦欧洛尼斯垂下的永夜之帷轻轻庇护。它不曾见诸任何一张舆图，只在风中低语着自己的名姓。它藏着岁月封存的往昔，是旅人魂梦里最温柔的归处。\n此地的风是慢的。它推着田边的风车缓缓地转，拂过麦穗时只留下一层层金色的呼吸，最后消融在海浪拍岸的潮音里。麦田、风车与潮声，便是哀丽秘榭全部的言语，日复一日地吟唱着一首不为外人听闻的牧歌。灯火稀疏散落在薄暮之间，像是有人随手撒下的一把星屑，暖而昏沉，照着归人，也照着旧路。§!"
EyeofTwilight: "晨昏之眼"
EyeofTwilight_desc: "§L「穹顶关塞」晨昏之眼，是一座高悬天际的浮空要塞，亦是天空之泰坦艾格勒的栖身之地。这尊以苍穹为眼睑的百眼巨鸟，睁眼便洒下白昼，阖眼便沉入永夜，曾是整座城塞乃至整片大地的钟摆与历法。城壁间的天象画壁映照着祂的万千心绪，在祂失神以前，画壁上酝酿的阴晴雨雪，都会尽数化作翁法罗斯的真实天象。\n纷争年代无数浮空堡垒相继陨落后，唯有此处留存着最完整的天空文明遗迹。城塞的骨械梁柱间刻满了旧日族群对飞行与苍穹的执念，曾分掌不同天象的天空三族在此侍奉泰坦，以金葬之礼将取自神明的祝福归还熔金奠池。阳雷骑士弑神的旧事落幕之后，族群荣光日渐凋零，余下后嗣迁往大地，只留下这座空寂的云端遗堡，在云海间守着残存的孤傲，望向永无归期的苍穹。§!"
Styxia: "斯缇科西亚"
Styxia_desc: "§L海潮尚未退尽，礁屿灯塔的乐声便已响起。\n那座以鲸油引火、以水晶透镜为光的长明灯塔，本身便是一架庞大的水漫琴。海水顺着砖石孔隙中的玻璃管攀援而上，随潮汐涨落拨弄琴身。斯缇科西亚的每一个晨昏，都是从一首海给出的曲子开始的。\n海洋泰坦法吉娜以臂弯般的海湾将此地环抱，日夜以浪涛哼唱着宠溺的童谣。寻欢者渡海而来，循着灯塔的歌与光撞入迷雾，触礁沉没后自浪中复生，受邀混入那永不休止的盛筵之中。白日里，假面游行者的欢歌与宴饮者的笑闹交织飘荡；入夜后，整座城沉入盛大的声与光的潮汐，乐声不息，舞影不止。在这里，沉默是罕有的，歌唱与畅饮是呼吸般的寻常。\n斯缇科西亚是一场绚烂到极致、永不醒来的醉梦。它不问来处，不诺归途，只为每一个寻欢而至的灵魂，献上翁法罗斯不曾饮尽的欢愉。§!"
Janusopolis: "雅努萨波利斯"
Janusopolis_desc: "§L雅努萨波利斯是翁法罗斯的信仰腹地，世人称它「千门之城」。\n门径之泰坦雅努斯、律法之泰坦塔兰顿与岁月之泰坦欧洛尼斯在此同受供奉，三位泰坦的权能彼此交织，令这座城池成为整片大地最负盛名的神谕圣地。四方信众渡海翻山而来，在命运三相殿前朝圣叩问，只求从神谕中窥见命运的方向。\n然而雅努萨波利斯真正令人难忘的，是那无处不在的门。城中每一道门扉都刻着雅努斯的神圣印记，传说它们通往不同的前路、不同的结局。人们在此叩门，便是在叩问未来。阶前的祷辞与殿中的颂声终日不绝，千道门扉开合往复，载着无数人的期许与抉择，织就成整片大地最庞杂的命运脉络。§!"
CastrumKremnos: "悬锋城"
CastrumKremnos_desc: "§L「蛮都」悬锋城，是一座横亘大地的巨型移动要塞。纷争之泰坦尼卡多利的天谴之锋高悬于城阙之上，锋刃直指苍野，千年未曾垂落。整座城邦便在这柄神锋的辉光之下，以铁与血铸就了翁法罗斯最负盛名的战士之乡。\n建城者歌耳戈率部族追逐尼卡多利的战吼遍历诸邦，曾于特雷托斯城郊徒手搏杀为祸一方的黄金雄狮，将凶兽的咆哮铸入部族的战魂。纷争泰坦认可了这群逐锋者的勇烈，将自铸的神锋赐下。歌耳戈便率众以巨石垒砌、层层拱卫锋刃，筑成这座可征伐四方的移动要塞，悬锋城自此立世。\n奔赴此地的战士必先踏过征伐行道。正门大桥的长风裹挟着征伐之气扑面而来，行道两侧的锋刃徽记凛凛生光，先挫去外来者的骄矜与犹疑。怯懦者未及正殿便已转身退去，能行至纷争正殿的人，还需跨过铸魂仪门，受泰坦神性的恫视，照见心底最深处的怯懦。留下的人，皆以勇气、荣耀、理智、坚韧、牺牲五大美德为标尺，在斗技场与锻冶坊中日夜淬炼。铁锤敲击铁砧的声响是城邦终年不歇的节律，这里以战为荣，以锻刃为业，每一次挥击都向着更强的自我突进，每一道伤疤都是荣耀的勋章。§!"
Aidonia: "哀地里亚"
Aidonia_desc: "§L「雪城」哀地里亚——飘雪的死亡之邦，曾在风雪中矗立，也在风雪中缄默。\n亘长的黄金世中，几乎人人都在暖盎的大地上尽享长生之乐，极少数人厌恶了停滞的日夜交替，决心寻觅生命的归程。「生命缘何而生？又该归往何处？」苦行者之首埃琉希斯一边吟诵着生死诘问，一边与苦行者们向北前行，寻觅一场甘甜而冰冷的长梦。身披长袍的苦行者们在万籁俱寂的北境荒原上定居，建起一座肃穆的城邦——漫天飞雪终年不休，被人们称为「哀地里亚」。§!"
Dawncloud: "黎明云崖"
Dawncloud_desc: "§L「半神议院」矗立于黎明云崖之巅，是永恒圣城奥赫玛的信仰中心与政治枢纽。负世泰坦刻法勒的巨神身影静立在断崖尽头，永昼的金辉穿过殿顶晶格，铺满整座环形议事殿堂。\n云崖圣道自山麓盘桓而上，道旁设着会客设施，元老院的文员们在此处理日常庶务，接引步入殿堂的元老与信使。前庭立着绘满泰坦神迹的壁画，主殿之内席位沿阶台层层环列，十二神柱环绕殿堂而立，托举着诸神权能赋予的神圣威仪。殿堂正央悬浮着核火之匣，其中封存着刻法勒的核心火种，是整座圣城光明与信念的根源。\n自圣城立世以来，这里便是奥赫玛裁定国策的核心之地。元老院成员在此陈词论辩，发起律法与逐火征程的议题，无数关乎救世的决断都在此酝酿落定。每一位奔赴前路的逐火者都曾在此受召领受使命。断崖深处的石阶直通泰坦觐见处，曾有神谕自彼处传来，指引着世人在末世中前行。它是永昼之下最坚实的秩序基石，托举着整片大地仅存的希望，在黑潮席卷的岁月里，始终长明不熄。§!"
VortexofGenesis: "创世涡心"
VortexofGenesis_desc: "§L创世涡心藏于波涛深处，是翁法罗斯世界的原初起点，亦是寄宿着十二泰坦原初神性的伟大圣所。相传混沌初开之时，众泰坦的权能在此汇聚，托举起整片大地与天穹。十二张虚位图腾环列于涡心中央，对应着十二尊泰坦的神权，每点亮一座星宿，便代表一颗火种重归其位。\n黄金裔的逐火之旅始终以此为终点。世代的救世者奔赴此处，将回收的泰坦火种归还原位，叩问再创世的可能。它是神谕中创世奇迹应允降临之地，也是永劫轮回里新生与终结的交界。当最后一位英雄只身走入涡心深处，所有的火种与宿命都将在此归一，为旧世界画上句点，为明日拉开序幕。§!"
GreatTomb: "无名泰坦大墓"
GreatTomb_desc: "§L「全世矩阵」无名泰坦大墓，是翁法罗斯至深的地底遗迹，也是权杖δ-me13内核层的核心所在。它深埋于无人抵达的大地深处，封存着全世所有不为人知的过往。褪去神话的外衣，巨型储存阵列在幽暗中明灭不休，静静刻录着万古以来的岁月痕迹。\n静域墓门划开两道世界的边界。门前是神话与悲喜交织的千古岁月，门后是数据与电信号织就的寂静疆域。中央区渡台作为访问控制节点，径直通向存储阵列的最深处。数据平流扇区内，信息的交换如不息的云雨往复蒸腾；潮汐换热扇区内，高压浆体如涨落的潮汐循环奔涌。一升一落的节律，暗合着天地间最本源的运行轨迹。\n矩阵最深处的德谬歌矩阵，沉睡着翁法罗斯的第十三位泰坦——无人传颂名姓的最初智种德谬歌。而真相更为隐秘：这位神明从未真正降世，大墓所藏不过是权杖最初演算目标的遗骸。三千万次轮回的全部记忆都沉淀于此，每一世的昔涟都会踏至大墓深处，向权杖讲述此生的见闻，让所有本该消散的轮回痕迹尽数留存。\n这里只有永不停歇的光流在阵列间穿行，所有诞生与覆灭、铭记与遗忘，最终都归寂在这片无声的疆域。它是永劫轮回的隐秘锚点，藏着翁法罗斯最本源的真相，在无人知晓的地底深处，静静等待着被重新叩响的一日。§!"
#城市故事
Adorable_heart_city_story_title_Okhema: "永恒圣城--奥赫玛"
Adorable_heart_city_story_desc_Okhema: "奥赫玛，“永恒圣城”，是所有挣扎求生的凡人最后的避难所。在翁法罗斯被黑潮吞噬的末世里，唯有此处因负世泰坦刻法勒的守护，依旧被永恒的白昼所笼罩。高耸的城墙与泛着金辉的神圣建筑间，承载浪漫神权的黄金裔阿格莱雅以金丝织就万帷网，为流离的灵魂提供着秩序与庇护。\n\n城中景观最奇伟的，莫过于天边那尊背负黎明机器的巨神刻法勒。那台原属天空泰坦的造物被祂以自身火种点亮，撑起了圣城的永昼。而热闹的云石天宫与云石市集，则为这座圣城带来了末世中难得的生机与烟火气。这里不仅是凡人在绝望中唯一能安眠的净土，更是英雄们踏上逐火之旅、奔赴再创世征途的起点，承载着凡人对重塑世界、重获新生的全部信仰。\n\n§O“以「负世」之名，刻法勒永志不忘！”§!"
Adorable_heart_city_story_title_Janusopolis: "神谕圣地--雅努萨波利斯"
Adorable_heart_city_story_desc_Janusopolis: "雅努萨波利斯是翁法罗斯的信仰腹地，世人称它「千门之城」。\n\n门径之泰坦雅努斯、律法之泰坦塔兰顿与岁月之泰坦欧洛尼斯在此同受供奉，三位泰坦的权能彼此交织，令这座城池成为整片大地最负盛名的神谕圣地。四方信众渡海翻山而来，在命运三相殿前朝圣叩问，只求从神谕中窥见命运的方向。\n\n然而雅努萨波利斯真正令人难忘的，是那无处不在的门。城中每一道门扉都刻着雅努斯的神圣印记，传说它们通往不同的前路、不同的结局。人们在此叩门，便是在叩问未来。阶前的祷辞与殿中的颂声终日不绝，千道门扉开合往复，载着无数人的期许与抉择，织就成整片大地最庞杂的命运脉络。\n\n§R圣女缇里西庇俄丝自这座城启程。这位窃夺了门径火种的黄金裔，以自我分裂千身为代价，借助雅努斯的万径之门穿行于翁法罗斯的每一寸土地，将负世泰坦刻法勒降下的救世神谕传遍四方。§!"
Adorable_heart_city_story_title_AedesElysiae: "永夜乡隅--哀丽秘榭"
Adorable_heart_city_story_desc_AedesElysiae: "哀丽秘榭，这枚遗落在翁法罗斯尽头的旧梦，被岁月泰坦欧洛尼斯垂下的永夜之帷轻轻庇护。它不曾见诸任何一张舆图，只在风中低语着自己的名姓。它藏着岁月封存的往昔，是旅人魂梦里最温柔的归处。\n\n此地的风是慢的。它推着田边的风车缓缓地转，拂过麦穗时只留下一层层金色的呼吸，最后消融在海浪拍岸的潮音里。麦田、风车与潮声，便是哀丽秘榭全部的言语，日复一日地吟唱着一首不为外人听闻的牧歌。灯火稀疏散落在薄暮之间，像是有人随手撒下的一把星屑，暖而昏沉，照着归人，也照着旧路。\n\n§O有人说，英雄白厄曾在此度过了此生唯一一段无忧的岁月。那时的他尚不知前路的重量，与青梅竹马的昔涟赤脚踩过田埂，便以为跑过了整个世界。他握着小小的锄头当作剑客的武器，心愿只是做一名守护村庄的小英雄，陪亲友与故园安稳度日。每一条小径都认得他少年时的足迹，每一片稻香都封存着他尚未学会忧伤的笑声。§!\n\n§P祝祭庭院里，昔涟亲手种下的红花年复一年地开着。这座供奉欧洛尼斯的院落常回荡神谕低语，身为见习祭司的昔涟便在此聆听岁月启示。§!\n\n这座村庄不属于纷争的王权，只属于所有渴望歇息的灵魂。若你有幸循着记忆寻见它，便可在此卸下全部的疲惫，枕着晚风与潮音，做一个不必醒来的安宁的梦。"
Adorable_heart_city_story_title_GroveofEpiphany: "辉痕圣林--神悟树庭"
Adorable_heart_city_story_desc_GroveofEpiphany: "神悟树庭筑于裂分之枝的巨圣树干之间，坐落在翁法罗斯的林野盆地之上。理性之泰坦瑟希斯以巨树神躯垂临此地，终年沉思不语，将智慧的权能散入枝叶与根系之中。祂不曾轻易宣示意旨，只以生长的脉络藏下世界的答案。求学者纷纷奔赴此地，为思辨而来，为求真而来。\n\n最初的学者塞勒苏斯在巨树下建起第一座庭院，铺开第一卷草纸记录所思。此后千年，书页翻动的声响从未停歇。七贤人分掌七大学派与树庭要务，在层叠的木质廊宇间往复论辩。他们或倚坐枝桠凝思，或伏案书阁推演，以笔墨与逻辑一寸一寸叩问世界的本源。这里少有颂唱的圣歌，多是羽笔擦过纸页的轻响；典籍与手稿堆积如山，每一页都载着尚未穷尽的追问。\n\n§G“人子啊，记住了：知晓自身的无知便是最大的睿智。”§!"
Adorable_heart_city_story_title_CastrumKremnos: "浴血战端--悬锋城"
Adorable_heart_city_story_desc_CastrumKremnos: "「蛮都」悬锋城，是一座横亘大地的巨型移动要塞。纷争之泰坦尼卡多利的天谴之锋高悬于城阙之上，锋刃直指苍野，千年未曾垂落。整座城邦便在这柄神锋的辉光之下，以铁与血铸就了翁法罗斯最负盛名的战士之乡。\n\n建城者歌耳戈率部族追逐尼卡多利的战吼遍历诸邦，曾于特雷托斯城郊徒手搏杀为祸一方的黄金雄狮，将凶兽的咆哮铸入部族的战魂。纷争泰坦认可了这群逐锋者的勇烈，将自铸的神锋赐下。歌耳戈便率众以巨石垒砌、层层拱卫锋刃，筑成这座可征伐四方的移动要塞，悬锋城自此立世。\n\n奔赴此地的战士必先踏过征伐行道。正门大桥的长风裹挟着征伐之气扑面而来，行道两侧的锋刃徽记凛凛生光，先挫去外来者的骄矜与犹疑。怯懦者未及正殿便已转身退去，能行至纷争正殿的人，还需跨过铸魂仪门，受泰坦神性的恫视，照见心底最深处的怯懦。留下的人，皆以勇气、荣耀、理智、坚韧、牺牲五大美德为标尺，在斗技场与锻冶坊中日夜淬炼。铁锤敲击铁砧的声响是城邦终年不歇的节律，这里以战为荣，以锻刃为业，每一次挥击都向着更强的自我突进，每一道伤疤都是荣耀的勋章。\n\n§Y“宁战死，毋荣归！”§!"
Adorable_heart_city_story_title_Styxia: "酣歌海垠--斯缇科西亚"
Adorable_heart_city_story_desc_Styxia: "海潮尚未退尽，礁屿灯塔的乐声便已响起。\n\n那座以鲸油引火、以水晶透镜为光的长明灯塔，本身便是一架庞大的水漫琴。海水顺着砖石孔隙中的玻璃管攀援而上，随潮汐涨落拨弄琴身。斯缇科西亚的每一个晨昏，都是从一首海给出的曲子开始的。\n\n海洋泰坦法吉娜以臂弯般的海湾将此地环抱，日夜以浪涛哼唱着宠溺的童谣。寻欢者渡海而来，循着灯塔的歌与光撞入迷雾，触礁沉没后自浪中复生，受邀混入那永不休止的盛筵之中。白日里，假面游行者的欢歌与宴饮者的笑闹交织飘荡；入夜后，整座城沉入盛大的声与光的潮汐，乐声不息，舞影不止。在这里，沉默是罕有的，歌唱与畅饮是呼吸般的寻常。\n\n斯缇科西亚是一场绚烂到极致、永不醒来的醉梦。它不问来处，不诺归途，只为每一个寻欢而至的灵魂，献上翁法罗斯不曾饮尽的欢愉。\n\n§2“世事如沧海，潮起潮落，一切终会在浪中消逝。所以，请在生命的每一刻都纵情高歌吧。”§!"
Adorable_heart_city_story_title_EyeofTwilight: "穹顶关塞--晨昏之眼"
Adorable_heart_city_story_desc_EyeofTwilight: "晨昏之眼是一座高悬天际的浮空要塞，亦是天空之泰坦艾格勒的栖身之地。这尊以苍穹为眼睑的百眼巨鸟，睁眼便洒下白昼，阖眼便沉入永夜，曾是整座城塞乃至整片大地的钟摆与历法。城壁间的天象画壁映照着祂的万千心绪，在祂失神以前，画壁上酝酿的阴晴雨雪，都会尽数化作翁法罗斯的真实天象。\n\n纷争年代无数浮空堡垒相继陨落后，唯有此处留存着最完整的天空文明遗迹。城塞的骨械梁柱间刻满了旧日族群对飞行与苍穹的执念，曾分掌不同天象的天空三族在此侍奉泰坦，以金葬之礼将取自神明的祝福归还熔金奠池。阳雷骑士弑神的旧事落幕之后，族群荣光日渐凋零，余下后嗣迁往大地，只留下这座空寂的云端遗堡，在云海间守着残存的孤傲，望向永无归期的苍穹。\n\n§P“在彩虹桥的尽头，天空之子将缝补晨昏”§!"
Adorable_heart_city_story_title_VortexofGenesis: "源始圣涡--创世涡心"
Adorable_heart_city_story_desc_VortexofGenesis: "创世涡心藏于波涛深处，是翁法罗斯世界的原初起点，亦是寄宿着十二泰坦原初神性的伟大圣所。相传混沌初开之时，众泰坦的权能在此汇聚，托举起整片大地与天穹。十二张虚位图腾环列于涡心中央，对应着十二尊泰坦的神权，每点亮一座星宿，便代表一颗火种重归其位。\n\n黄金裔的逐火之旅始终以此为终点。世代的救世者奔赴此处，将回收的泰坦火种归还原位，叩问再创世的可能。它是神谕中创世奇迹应允降临之地，也是永劫轮回里新生与终结的交界。当最后一位英雄只身走入涡心深处，所有的火种与宿命都将在此归一，为旧世界画上句点，为明日拉开序幕。\n\n§O庄严的十二泰坦，支撑世界的支柱——\n我们于此索求神性，以填补世界的裂缝——\n为肉身灌注黄金之血，为神谕甘愿枯竭干涸……§!"
