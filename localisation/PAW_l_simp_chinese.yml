PAW_28: "向冥河解缆起航"
PAW_28_desc: "哀地里亚的废墟就在前方。风堇和遐蝶走在前面几步，药箱和木箱在风雪中轻轻晃着。那个没有风的静止瞬间——我不记得了。我只知道这条路是我选的，而那座死城里有我要找的东西。"
PAW_29: "请载我横渡冥流"
PAW_29_desc: "踏入哀地里亚的废墟，那股压迫感再次从地底深处涌上来——和梦里一模一样。死亡泰坦，塞纳托斯。那次醒来之后的记忆仍不清晰，就像那头龙为什么给我一种说不出的悲哀。"
PAW_30: "探索水之城"
PAW_30_desc: "我在奥赫玛的战报里读到过这个名字——斯缇科西亚，临水的炼金术之城，供奉海洋泰坦法吉娜。那座城沦陷得很早，早到连完整的逐火记录都没留下。但海洋的火种不会凭空消失。如果我要找线索，只能去废墟里翻。"
PAW_31: "英雄未死之前"
PAW_31_desc: "[PAW_31desc]"
PAW_31_desc1: "......"
PAW_31_desc2: "斯缇科西亚的废墟深处，我撞见了两个绝不该在此地的人——刻律德菈与海瑟音。女皇没有带任何护卫，骑士统领也没有站在她身后。空气中弥漫着一股血腥味，比海风的咸涩更重。"
PAW_32: "埋葬暗酒色的梦"
PAW_32_desc: "斯缇科西亚的海雾里藏着不该出现的东西。大量的黑潮造物正不断向港口西侧的一处水湾聚集，像是被什么召唤。不论那是什么，能在这种地方吸引黑潮的，恐怕只剩下与泰坦有关的事物。"
PAW_33: "重返圣城"
PAW_33_desc: "连夜策马赶回圣城，我看到的奥赫玛已经不是离开时的样子了。广场上站着元老院的卫兵，黄金裔的营房门上贴着封条，所有人都在悄悄谈论同一个名字：凯妮斯。阿格莱雅被关在禁室里，火种握在元老院手里。我从城外策马奔入时在想的是：哪一个更重要——是夺回火种以阻止凯妮斯永远锁住逐火的路，还是先救出那些随时可能被搜出来的同袍？"
PAW_34: "相信丝线"
PAW_34_desc: "火种可以再夺，人死了就什么都没了。阿格莱雅被关在禁室里，广场上还有三十多个被抓的同袍——我必须先把他们救出来。至于凯妮斯手里那三枚火种，等我的人到位了，她守不住。"
PAW_35: "夺取火种"
PAW_35_desc: "凯妮斯手里有三枚火种，她说不会用于逐火，要用来锁死逐火之路。如果我现在去救人，她会趁这段时间把火种藏到更深的地方，深到这一轮逐火再也碰不到。火种是一切，我必须先把它们夺回来。"
PAW_36: "于真理门前再会"
PAW_36_desc: "阿格莱雅通过衣匠传来信息——虽然她仍未脱困，但奥赫玛的局势不容我们孤军奋战。她示意我去神悟树庭，那里有一位连她也经常搞不定的学者。那刻夏。如果他能出手，无论是对抗元老院还是推进逐火，形势都会大不一样。"
PAW_37: "莫让生者空垂涕"
PAW_37_desc: "元老院政变后，奥赫玛内的黄金裔几乎被一网打尽，但城外的黄金裔尚未被波及。缇宝她们在搜捕开始前就逃出了圣城，此刻正在城外集结所有还能联系上的黄金裔与依然信任我们的旧部。阿格莱雅还在禁室里，元老院还控制着圣城——但至少，我们已经有了反击的资本。"
PAW_38: "且领受金血烧灼"
PAW_38_desc: "营地边缘躺着一个不该出现在这里的人。万敌——那个拥有不死之身的男人，此刻正靠在断柱上，战甲碎裂，血从裂口里往外渗。他不应该伤成这样，除非有人知道怎么伤他。"
PAW_39: "兑现那染血的冀望"
PAW_39_desc: "城门已经攻破，战火正在元老院的走廊里燃烧。我冲过广场上还在交战的人群，脑子里只剩下一个念头——禁室。因为阿格莱雅还在那里。"
PAW_40: "走过安眠地的花丛"
PAW_40_desc: "我又做梦了，梦里我在追她——赛飞儿。我看见赛飞儿在巷子里跑，左腿上有一道剑伤。我看见自己提着剑在追她。我不记得自己为什么要追她，但我的手不是我的手，我的嘴里在反复念着同一句话..."
PAW_41: "镌留记忆的涟漪"
PAW_41_desc: "我又梦见哀丽秘榭了。麦田还是那片麦田，大树还是那棵大树，但站在树下的她好像和平时不太一样。她说了一些我完全听不懂的话——但我总觉得，她不是在跟我说。"
PAW_42: "在黎明升起时坠落"
PAW_42_desc: "最后的火种悬在天空之上。风堇说，昏光庭院的先祖曾以彩虹为桥，登上天空与艾格勒对话——但那是千年前的事了。如今天空泰坦早已不再回应任何人的祈祷，它只盯着大地，用那些残存的眼瞳审判每一个胆敢靠近的人。我们必须去。不是为了祈祷，是为了夺回最后的光。"
PAW_43: "成为昨日的明天"
PAW_43_desc: "[PAW_43desc]"
PAW_43_desc_1: "火种齐了。我从每一个拦在我面前的人身上取下了他们不肯交出来的东西，又从天空泰坦身上夺下了最后一枚。刚好十二枚。创世涡心就在前面，黑潮压境与我无关——我只差最后一步。"
PAW_43_desc_2: "火种不够。元老院那三枚被证实是假的，凯妮斯从头到尾都在撒谎。腾荒和长夜月带来的火种填上了两个空缺，但剩下的缺口仍在。而黑潮已经兵临城下——这一次不是试探，是总攻。"
PAW_43_desc_3: "黑潮从地平线压过来的时候，我还在数火种。数来数去，总是少那么几枚。城外黑压压的一片，城墙上的人都在等我下令——但我还有许多事没做，许多人没救，许多火种没找到。时间不够了。它从来都不够。"
PAW_44: "管理员档案：隐藏文件夹"
PAW_44_desc: "屏幕边缘泛起细微的像素裂痕，一行半透明的文字从裂痕中缓缓滑入。不是来古士惯常的古典体，而是更简练、更接近日志条目的格式——像是某个不该被打开的文件夹被悄悄翻开了。某人的声音在虚空中轻轻“嘘”了一声，然后退到一旁，把这份档案推到你面前。"
PAW_45: "永劫轮回"
PAW_45_desc: "我又醒了。奥赫玛的晨光，石板路上的脚步声，靠在床边的剑。一切和上次醒来时一样，一切和上上次醒来时也一样。但这一次，我不需要再问自己“那个梦是什么意思”——我记得。我记得所有的事。"
PAW_46: "死者与生者"
PAW_46_desc: "我记得那些脸。有些人的眼睛在我闭上眼时仍然看着我，有些人的手我还记得握过的温度。逐火之路走了这么远，有些人与我并肩至今，有些人倒在了半途——倒在我剑下，或倒在我来不及赶到的地方。我必须面对他们，无论是死去的，还是活着的。"
PAW_47: "搭档的声音"
PAW_47_desc: "那道视线。从天外之音响起时便伏在我肩上，从第一次拔剑时便注视着我。我一直在想它是什么——是敌是友，是审判还是守护。现在我终于明白了。只是我明白得可能太晚，也可能太早。"
PAW_48: "面具与镜子"
PAW_48_desc: "那双眼睛。我第一次在废塔下见到他时，只觉得那是一张没有表情的面具。但现在我闭上眼就能看到那双眼睛——从面具后面看着我，像在照一面镜子。我不明白。如果他是我，为什么他会在这里？如果我是他，为什么我什么都不记得？"
PAW_49: "末日倒计时"
PAW_49_desc: "黑潮的蔓延速度突然加快了。战报从四面八方涌来，每一封都比上一封更急。我不明白——我们明明已经收回了这么多火种，为什么黑潮反而越来越近？"
PAW_50: "最后一枚火种"
PAW_50_desc: "[PAW_50desc]"
PAW_50_desc_1: "还差最后一枚。它不在任何一座泰坦的领域里，不在黑潮最浓的废墟深处，不在任何需要同伴掩护才能抵达的险境。它就在哀丽秘榭外围的采石场里，安静地躺在一座被遗忘的祭坛上。我知道去那里的路——那条碎石路上只有我一个人的脚印。以前不是这样的。以前这条路有人陪我走，有人在抱怨路太陡，有人在开玩笑说采石场的蝙蝠比黑潮还吓人。现在只有风从石缝里穿过，和我握剑的手。够了。一个人，一把剑，一枚火种。拿到它，然后回去。不需要更多了。" #白厄杀过剧情角色
PAW_50_desc_2: "还差最后一枚。它就在哀丽秘榭外围的采石场里，安静地躺在一座被遗忘的祭坛上。我知道去那里的路，也知道谁会走在我右边——万敌会抱怨路太陡，风堇会念叨毒气残留，那刻夏会边走边写笔记，阿格莱雅的金线会替所有人警戒来路。缇宝她们会挤在祭坛旁边踮着脚尖张望。这条路我走过无数次，但这一次，身后的人还在。最后一枚火种，最后一程路。拿到它，然后带着所有人回去。一个都不能少。" #白厄没有杀过任何剧情角色
PAW_51: "残酷的真相"
PAW_51_desc: "你已经注视他走了两轮。看着他拔剑，看着他选择，看着他在杀与不杀之间反复摆荡。现在他就在你面前，对即将到来的终点一无所知。你决定告诉他一切——关于这个世界的本质，关于来古士的实验，关于他身为数据的真相。这个选择可能会击垮他，也可能会让他更坚定。但他应该知道自己为什么活了一次又一次。而你——作为他的搭档——不该让他蒙在鼓里走向终点。"
PAW_52: "沉默的守护"
PAW_52_desc: "你已经注视他走了两轮。看着他拔剑，看着他选择，看着他在杀与不杀之间反复摆荡。现在他就在你面前，对即将到来的终点一无所知。你决定保持沉默——不是逃避，不是退缩，是你相信他不需要知道那些冰冷的真相也能走到终点。他已经背了太多东西。这一次，就让他在不知道答案的情况下，凭自己的心做出最后的选择。而你——作为他的搭档——会继续伏在他肩上，和从前一样安静，和从前一样坚定。"
PAW_53: "代码中的花园"
PAW_53_desc: "昔涟还活着。在之前的轮回中，她曾在麦田里对你说话，在矮墙下偷偷朝你挥手。现在她再次出现了——不是来送别白厄，是来找你的。她说她有很多秘密想告诉你。关于这个世界，关于她自己，关于白厄，关于那些被抹去的轮回。她希望你耐心倾听，因为这些话她憋了太久太久。"
PAW_54: "共犯的诞生"
PAW_54_desc: "昔涟有一个秘密要告诉你——关于盗火行者。那个戴面具的黑衣剑士，那个伴随黑潮而来、只追击黄金裔的无名之人，那个白厄在梦里追过、在废塔下见过、在万敌的伤口上认出过剑痕的影子。她说，她知道他是谁。因为他的诞生，她从头到尾都在场。"
PAW_55: "写给你的信"
PAW_55_desc: "昔涟有一封信要给你。不是写在纸上的那种——是写在心里，攒了好多个轮回，一直没机会当面说的话。她本来打算等一切结束之后再说，但来古士已经等不及了。他加速了进程，末日倒计时比任何人预想的都更快。所以她只能现在告诉你——关于她是谁，关于她为什么站在这里，关于她在这无数轮回中一直在做什么。"
PAW_56: "德谬歌"
PAW_56_desc: "昔涟还有一个秘密要告诉你。不是关于白厄，不是关于盗火行者，是关于她自己——关于她在无数轮回中培育的那个存在，关于她留到最后的底牌。她说，那个存在是翁法罗斯的另一个核心，是她在时间外侧种下的种子。现在这颗种子已经长成了。它的名字叫德谬歌。"
PAW_57: "迈向最终舞台"
PAW_57_desc: "[PAW_57desc]"
PAW_57_desc_1: "火种已经齐了。那些陪我走到这里的人——在隘口挡在我前面的，在禁室里用金线替我指路的，在采石场风里走在我右后方的——全都在。我知道这个世界是什么，我知道我是谁，我知道来古士在终点等我。但他们不知道。他们只知道我叫白厄，他们只知道这场仗还没打完。这就够了。告诉他们真相不是我的任务——带他们走到终点才是。创世涡心就在圣城深处，我们走进去，然后结束这一切。" #情况一：白厄得知轮回真相，且未杀过角色
PAW_57_desc_2: "火种已经齐了。那些陪我走到这里的人——在隘口挡在我前面的，在禁室里用金线替我指路的，在采石场风里走在我右后方的——全都在。我不知道终点有什么在等我，不知道逐火之后会发生什么，不知道那道一直伏在我肩上的视线为什么从来不告诉我答案。但我不是一个人。不管前面是什么，有人跟我一起走。创世涡心就在圣城深处，我们走进去，不管出来的是什么——是我们自己选的。" #情况二：白厄不知道轮回真相，且未杀过角色
PAW_57_desc_3: "火种已经齐了。我是一个人走到这里的。我知道这个世界是什么，我知道我是谁，我知道来古士在终点等我。那些曾经陪我走过的人——已经不在了。我把他们留在了上一轮的密室、实验室、篝火旁和禁室石墙下。这一次我独自走向创世涡心，不是因为我需要火种——是因为有一笔账要跟来古士算清楚。" #情况三：白厄得知轮回真相，且杀过角色
PAW_57_desc_4: "火种已经齐了。我是一个人走到这里的。我不知道终点有什么在等我，不知道那道视线为什么一直沉默，不知道那些被我杀死的人——如果再来一次——会不会原谅我。但火种已经齐了，路只剩最后一段。不管真相是什么，我已经走到了这里。创世涡心在圣城深处，不管出来的是什么——我没有资格再回头。" #情况四：白厄杀过角色，且不知道或不接受真相（跳过国策）
PAW_57_bypass_tips: "实验陷入特殊情况"
PAW_58: "创世涡心"
PAW_58_desc: "创世涡心的门在我面前敞开了。十二枚火种在匣中安静地亮着，像是等了太久太久，久到连它们自己都忘了自己在等什么。我站在这里，身后是所有走过的路——有些路上有人并肩，有些路上只剩我自己的脚印。前方是来古士在终点设置的最后一道命题，而我已经没有时间再想了。火种必须归位，逐火必须走到终点。不管从这扇门里走出去的是什么——是我，还是另一个我，还是那个戴面具的影子——我都必须踏进去。这是最后一次了。"
PAW_59: "一如初见的重逢"
PAW_59_desc: "与你一起，我们无所不能。"
PAW_59_tips: "\n§P昔涟的特质可以加强翁法罗斯之心的效果§!"
PAW_60: "西风尽头，宁谧永恒"
PAW_60_desc: "让刹那，成为永恒。"
PAW_61: "此诗，献予一切生命"
PAW_61_desc: "群星啊，请为英雄闪耀。"
