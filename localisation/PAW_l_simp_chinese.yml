PAW_huoxingchang: "将算力投入到生产建设"
PAW_huoxingchang_desc: "来自管理员的信息：“尊敬的玩家，我发现您在游玩过程中积攒了大量的政治点无处可用，我建议您将一部分政治点投入到我的计算中，这样可以增强我的算力。作为回报，我会抽出一部分用于翁法罗斯实验的子个体来协助您建设工厂。请放心，这不会增加您的通关难度。”"
PAW_huoxingjun: "将算力投入到军事工业"
PAW_huoxingjun_desc: "来自管理员的信息：“如果您不需要增加民用工业，那么我可以协助您获取更多的军事工业。请放心，这不会增加您的通关难度。”"
PAW_huoxinggezi: "将算力投入到扩展地区"
PAW_huoxinggezi_desc: "来自管理员的信息：“亲爱的玩家，我发现您已不满足于增加工厂数量。或许您已经发现了，我们翁法罗斯的流亡地是一片极为贫乏的土地，因此只要您需要，我会提供一些发展地区方面的帮助。”"
