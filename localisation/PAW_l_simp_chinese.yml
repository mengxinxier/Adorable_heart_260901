#国策
PAW_1: "轮回之始"
PAW_1_desc: "玩家已成功接入系统，在她/他完成这个国策后，游戏将正式开始。"
PAW_2: "迎战黑潮"
PAW_2_desc: "奥赫玛边境的黑潮浓度已逼近峰值，斥候队发回的情报一片混乱。元老院下令全力布防，但我们谁都清楚——这是一场用人命填的防御战。必须去。必须守住。希望今天遇到的，只是一群普通的黑潮造物……"
PAW_2_tips: "§R最好先进行一些训练...§!"
PAW_3: "避其锋芒"
PAW_3_desc: "迎战黑潮之后，奥赫玛的防线暂时稳固。但我与万敌之间，除了一场酣战，似乎并未对彼此留下什么好印象。他独来独往、言语带刺，与他同行只会徒增摩擦。求见凯撒刻律德菈大人才是要事，没必要在路上节外生枝——我们大可各行其道。"
PAW_4: "冤家路窄"
PAW_4_desc: "与万敌迎战黑潮时，他虽嘴上刻薄，但也确实出手相助了。他说要去奥赫玛找人算账——后来我才知道，他要找的正是凯撒刻律德菈大人。虽然不想承认，但他无惧黑潮的姿态，让我隐隐感到此人不简单。或许，这趟觐见凯撒大人的路，有个同行者也不坏。"
PAW_5: "面见凯撒"
PAW_5_desc: "从隘口一路赶到圣城深处，终于站在了凯撒刻律德菈的宫殿前。关于黑潮、关于悬锋城、关于黄金裔的使命——我需要一个答案。但不知为何，踏入殿门的那一刻，我感到某种沉淀已久的疲惫正笼罩着这座宫殿。"
PAW_6: "求学之旅"
PAW_6_desc: "自哀丽秘榭陷落后，我对黑潮与泰坦的认知便止步于战报与口传。奥赫玛的骑士们能教我如何挥剑，但无法告诉我黑潮为何蔓延、泰坦因何堕落。据说神悟树庭的学者们世代都在研究这些谜题——或许他们的典籍里藏着答案。"
PAW_7: "阿那克萨戈拉斯"
PAW_7_desc: "在神悟树庭的走廊里，我不止一次听到学者们压低声音提起那个名字——阿那克萨戈拉斯，智种学派的创立者，七贤人之一，也是树庭最富争议的“渎神者”。据说他公开质疑逐火的使命，甚至对泰坦的神格也毫不敬畏。这种人，要么是疯子，要么知道些什么别人不敢知道的事。我要见他。"
PAW_8: "缇里西庇俄丝"
PAW_8_desc: "离开神悟树庭的回廊时，我在一截盘根交错的古树枝干间看见了一个火红色的身影——或者说，三个。她们在石板路上小跑，三双小翅膀在阳光下晃动。有人说过，翁法罗斯最不可思议的信使就在树庭一带活动。如果她们走过的路比任何人都多，那么她们一定见过我需要知道的东西。"
PAW_9: "圣城奥赫玛"
PAW_9_desc: "从我来到奥赫玛开始，人们就在谈论黄金裔、逐火之旅与黑潮。但在这座圣城的大街小巷里，普通人究竟过着怎样的生活？他们如何看待我们这些背负使命的人？我似乎从没有认真看过这座城市。在奔赴下一场战斗之前，也许我该在城里转一转。"
PAW_10: "金织与盗贼"
PAW_10_desc: "[PAW_10desc]"
PAW_10_desc_1: "在奥赫玛，我时常听人提起“金织”阿格莱雅——那位被称为黄金裔领袖的传奇织者。据说她珍藏着翁法罗斯过去的秘密，并一直在寻找引领逐火之旅的继承人。或许，她能告诉我下一步该往哪儿走。" #凯撒未遇刺文本
PAW_10_desc_2: "凯撒刻律德菈遇刺身亡，圣城奥赫玛一夜之间失去了她的统治者。元老院与黄金裔紧急推举“金织”阿格莱雅接任翁法罗斯的统领之责。我从未见过这位传说中的织者——如今她已是背负整个国家命运的女主人。她会如何对待一个前来请命的黄金裔？" #凯撒已遇刺文本
PAW_11: "凯撒与鲸鱼"
PAW_11_desc: "在奥赫玛，“凯撒”和“鲸鱼”这两个名字我听了无数遍。训练场、传令兵的简报、领面包的队伍里——人们提起凯撒时总是压低声音。而海瑟音的名字似乎永远跟凯撒绑在一起，但究竟是什么样的关系，我从没听人完整讲过。"
PAW_12: "拜访元老院"
PAW_12_desc: "来到奥赫玛后，我一直在听人提起元老院——那个与黄金裔共治圣城的古老机构。有人说他们是秩序的基石，也有人说他们是绑住黄金裔手脚的锁链。无论如何，既然我要在奥赫玛长留，就得知道元老院到底是敌是友。"
PAW_13: "黄金裔的谎言"
PAW_13_desc: "凯妮斯上次说，如果我感兴趣，就再去见她。这几天我反复回想她那句话——一个元老院的代表，为什么要对初次见面的黄金裔提这种事？是挑拨离间，还是她真的知道些什么？无论如何，我决定再走一趟元老院。"
PAW_14: "黄金血之真实"
PAW_14_desc: "黄金裔的血液里流着黄金。那不是神赐的恩典，而是被植入的枷锁——每一滴金血都是被设计好的程序，让英雄们在逐火的路上走得更远、更拼命，然后更早地倒下。"
PAW_15: "轮回骗局"
PAW_15_desc: "逐火失败不是因为英雄不够多，而是因为逐火从头到尾就不是为了成功。每一次轮回都在重复同一条路——英雄集结、回收火种、然后失败。失败之后，一切从头再来。"
PAW_16: "调查死之城"
PAW_16_desc: "哀地里亚——覆雪的死亡之邦，翁法罗斯最早沦陷的城邦之一。奥赫玛的战报里关于它的记载少得可怜，只说是被黑潮吞没，无人幸存。但黑潮为什么会从那里最先爆发？那座城里到底有什么？也许废墟里还藏着一些战报不会记录的东西。"
PAW_17: "同行者"
PAW_17_desc: "前往哀地里亚的路途遥远，我本以为会是一段独自跋涉的旅程。但在出发的岔路口，我遇上了两位同样前往那座死城的黄金裔——一位是曾在那里生活过的入殓师，一位是沿途救治伤患的医师。同去一座城，或许不必分头走。"
PAW_18: "异乡客"
PAW_18_desc: "在前往哀地里亚的途中，我撞见了两个一看就不是翁法罗斯本地人的家伙——一个拿着打不开的地图，一个举着照相机到处拍。他们的穿着打扮、口音举止，都和这片土地上的人截然不同。更奇怪的是，我总觉得有些不对劲，但说不上来哪里不对。"
PAW_19: "死亡的咆哮"
PAW_19_desc: "踏入哀地里亚的废墟后，死寂的雪原上忽然响起了不应存在于这个世界的声音——某种介于哀嚎与嘶吼之间的咆哮，将我拉入一场被迫的死斗。死亡泰坦，塞纳托斯，这座死城不容外人踏足，那就只能将它击败。"
PAW_20: "必要的锻炼"
PAW_20_desc: "来到奥赫玛之后，我一直在适应这里的训练节奏。黄金裔的职责是逐火，但在此之前——我得先确认自己这把剑还握得住。"
PAW_21: "盗火行者"
PAW_21_desc: "那个伴随黑潮而来的无名剑士正在逼近奥赫玛。几天前，侦察营截获了一份残缺战报，说他在哀丽秘榭的废墟上逗留了很久。而现在，他抢在所有人之前袭击了一名持有火种的黄金裔——就在距圣城数个时辰路程的废塔附近。我不是那个黄金裔的护卫，但我必须亲眼看到那家伙到底是谁。没人接到的请求，我自己去。"
PAW_22: "最初的火种"
PAW_22_desc: "在哀丽秘榭外围的废墟中，我偶然踏入了一处从未被黑潮侵蚀的地下密室。那里残留着某种古老的力量——微弱却尚未熄灭。如果那真是传说中的火种，哪怕只有一枚，也必须带回奥赫玛。"
PAW_23: "终结轮回"
PAW_23_desc: "十二枚火种——泰坦的火种、无名的火种、一枚从未被任何逐火录记载过的火种——在数日之内全部到齐。黑潮撕裂迷雾，直逼奥赫玛城下，时间一分一秒都在倒计。翁法罗斯有史以来第一次出现十二枚火种齐集的情况，也许也是最后一次。神谕中的预言，所有黄金裔在逐火之路上前赴后继的牺牲，轮回中千万次无功而返的挣扎，全指向这一刻。他们将火种带往创世涡心，逐火将成，轮回将终。"
PAW_24: "轮回继续"
PAW_24_desc: "从梦中惊醒。我做了一个很长的梦——长到像是活过了一整段人生。梦里有金色的麦田、覆雪的废墟、一个沉默寡言却总是站在我身后的少女，还有更多我叫不出名字却莫名熟悉的家伙。而现在，窗外是奥赫玛的早晨，训练场的晨钟还没响，一切都安静得像什么都没发生过。"
PAW_25: "再访死之城"
PAW_25_desc: "那些梦没有消散。它们在我醒来之后继续盘桓，像一层薄雾附在意识深处。我记得一些模糊的轮廓——其中有一个粉色的身影，站在哀地里亚的路标下，对我说过什么。我不确定那是记忆还是幻觉。唯一能确定的是，我必须再去一趟哀地里亚。也许那座死城里有什么东西能告诉我，那些梦到底是什么。"
PAW_26: "不期而遇"
PAW_26_desc: "前往哀地里亚的路不算长，但我总觉得会在这条路上碰到什么人。不是因为沿途有村庄——是这条路的岔口在梦里出现过。梦里有人背着药箱回头叫我快点，有人提着旧木箱走在旁边，安静得像雪本身。"
PAW_27: "[PAW_27_0]"
PAW_27_desc: "[PAW_27desc]"
PAW_27_1: "异乡客"
PAW_27_desc1: "在前往哀地里亚的途中，我撞见了两个一看就不是翁法罗斯本地人的家伙——一个拿着打不开的地图，一个举着照相机到处拍。他们的穿着打扮、口音举止，都和这片土地上的人截然不同。更奇怪的是，我总觉得有些不对劲，但说不上来哪里不对。"
