#开局介绍
PAW_start_game_text: "§P开始游戏§!"
PAW_route_guide_desc: "为了保证你的游戏体验，建议在开始游戏前的规则设置中给魔导国AI设置+4加强（或者给圣杯和苏联设置削弱）\n觉得兵模太吵可以关掉音效声音（注意是音效）\n文案部分由90%的AI+10%的游戏原文组成，§Y建议没有接触过原作的玩家认真思考涉及分支选择的国策！§!§R前两次轮回的时间有限，不可能完成全部的国策。§!\n\n翁法罗斯真结局线索\n（注意，该文档并非管理员输入，请仔细甄别真假）\n\n1.管理员档案很重要，想办法收集所有的档案。\n2.角色关系对于流程的影响不关键，但是否结识了他们这点很关键。\n3.角色全部存活与角色全部死亡，必定抵达某种完美结局。\n4.角色在某些情况下无法在轮回重置后复活，但所有角色都能在结局后复活。\n5.这局游戏里的两个局外人对流程影响很大，但在结局前他们没什么用。\n6.昔涟是可以完全信任的，但昔涟无法帮助你抵达真结局。\n7.管理员来古士永远不会对玩家撒谎。\n8.如果觉得事件文本太长，可以选择性阅读事件，因为大部分的事件选项对结局的影响微乎其微。\n9.随时注意觉醒度的变化，几乎所有事件都会影响觉醒度，而关键事件的觉醒度变化将极大影响结局走向。\n10.这十条陈述中，一共有四条假线索。\n\n\n§P翁法罗斯目前有六条不同的分支路线，其中包含两个好结局和四个坏结局，你在游戏过程中做出的选择将决定最终结局，各结局路线拥有不同的特殊机制。§!"
PAW_route_guide_desc2: "§P一封来自小涟的信♪§!\n\n亲爱的伙伴：\n嗨，我想你啦。会不会有些突然呢？我只是，想再回头看一眼。\n开拓的旅程一定充满未知吧。所以，我也想在你的生命中再留下一份惊喜，一道记忆的涟漪，还有…妖精的小小魔法。\n不知不觉中，我们一起走过了好长的路呀。旅途的下一站，你又会写下怎样的故事呢？我会在你的回忆里期待着，只要闭上眼睛，就能看见你的眼睛，里面装着整个宇宙……\n就像清风吹拂的麦浪，就像群星闪耀的明天♪ \n愿我们的故事，跨越万千光年，也会化作你旅途中一朵小小的浪花。"
PAW_his_page_01_title: "流亡的贵族：从科林斯的烈焰到南洋的迷雾（公元前146年 – 公元前120年）"
PAW_his_page_02_title: "黄金时代的潮起潮落：从扩张的雄心到现代的轮廓（公元前120年 – 公元1918年）"
PAW_his_page_03_title: "永劫轮回：献祭、封锁与虚拟的牢笼（1918年 – 1936年）"
PAW_Country_History_Page_01: "公元前146年夏天，罗马军团焚毁了科林斯。希腊最后的反抗——亚该亚同盟——被彻底碾碎。然而，并非所有人都接受了被征服的命运。来自科林斯的名门之后阿伽狄诺斯，一位曾统领重装步兵的将领，在城陷前夜召集了两千三百余名家人、部属与奴隶，登上十艘改装过的商船，趁着夜色冲破罗马舰队的封锁，驶向未知的东方。他们的目标并非早已沦为罗马附庸的希腊化东方，而是一个从水手与哲人的口耳相传中隐约浮现的传说：在印度更东方的海上，有一片被古称“黄金半岛”的土地——那里河流中金沙泛光，森林里香料如烟。\n\n船队经克里特、过亚历山大港，沿着古老的香料航线航行，在印度西海岸稍作休整后借助季风穿越孟加拉湾。大约在公元前143年，疲惫的船队望见了一处开阔河口的海岸线。他们上岸了。\n\n阿伽狄诺斯站在河口的高地上，俯瞰着这片陌生而丰饶的土地。他想起了一个古老的传说——据说在时间的开端，最初的“负世之泰坦”刻法勒从虚无中开辟了天地，十二位泰坦自神明投下的火种中诞生，各司其职：有的开辟天地，有的捏塑生灵，有的引渡灾祸，有的编织命运。在众泰坦的庇佑下，世界迎来过黄金时代，万邦毗邻，城邦如繁星般点缀大地。然而“灾厄三泰坦”——“纷争”“死亡”“诡计”——撕碎了和谐，引发了神明间的内战，随后“黑潮”降临，吞噬一切。但在毁灭的灰烬中，亦有新生。那块传说中从泰坦纪元遗落于尘世的圣石——据说正是刻法勒创世时凿下的第一块基石——被世人称为“翁法罗斯”，意即“世界的中心”。它承载着万物起始之地的记忆，是连接泰坦纪元与凡人时代的脐带。\n\n“我们的科林斯已化为灰烬，”阿伽狄诺斯拔剑插入泥土，“但正如翁法罗斯在神明堕落后的废土中屹立不倒，我们亦将在这片土地上重燃文明之火。这国，便叫翁法罗斯。”\n\n最初的落脚点建在河口高地，阿伽狄诺斯将其命名为斯缇科西亚，在翁法罗斯神话中这是“曙光照耀之门”的意思——寓意流亡者如同泰坦纪元结束时穿越黑潮抵达永恒圣城的幸存者，从东方迎来新的黎明。凭借精湛的石砌建筑技术和冶金工艺，斯缇科西亚很快从一座简陋的堡垒发展为繁荣的港口。阿伽狄诺斯采取联姻与分化策略，逐步吸纳周边孟人部落，形成一个以希腊贵族为核心、混血后代为骨干的城邦联盟。\n\n阿伽狄诺斯深知，要在这片土地上长治久安，必须控制内陆的咽喉与要道。其子利昂尼达斯继承遗志，向北远征，经过三次决定性战役，翁法罗斯的势力范围扩展至湄南河中上游的广大区域。利昂尼达斯在群山环抱的谷地中发现了一处易守难攻、水源充沛之所，遂决定在此建立新的都城，命名为奥赫玛。在翁法罗斯神话中，奥赫玛是“永恒圣城”——刻法勒亲自守护的最后堡垒，在“黑潮”席卷万物的永夜中，唯有此城仍能独享黎明的眷顾。此后，奥赫玛便成为翁法罗斯的首都与神圣中枢，斯缇科西亚则作为海港和造船中心继续繁荣。\n\n随着疆域扩张，翁法罗斯人在各地兴建起独具风格的城邦：\n\n悬锋城建于东方高原的台地之上，三面绝壁，一径可通。翁法罗斯神话中，“纷争”泰坦尼卡多利的居城便是悬锋城，那座曾经兵戈作响的尚战之邦以移动的堡垒碾碎一切来敌。此城亦借其名，成为翁法罗斯抵御东方入侵的钢铁壁垒。\n\n哀地里亚位于南方两河交汇之处，水网如织，沃野千里。在翁法罗斯神话的“幻灭世”中，“死亡”泰坦塔纳托斯的领域便在一片迷雾弥漫的三角洲上，亡者的灵魂在寂静的长河上摆渡。哀地里亚承其名，却以生机与贸易赋予其新的意义——它成了翁法罗斯南部的商业与行政中心，高耸的议院和宏大的贸易广场使这里成为“南方的明珠”。\n\n哀丽秘榭建于西部海岸的深水良港，船坞林立，百舸云集。翁法罗斯神话中，哀丽秘榭是英雄灵魂得以安息的至福之地。此城因此得名，成为翁法罗斯通往西方的门户，造船业和远洋贸易冠绝诸邦，是名副其实的“万邦所归之门”。\n\n神悟树庭坐落在入海口北岸，一株参天古榕下设有翁法罗斯最古老的神谕祭坛。传说泰坦纪元尚未终结之时，“智慧”泰坦雅典娜曾在此树下沉吟三日，向凡人降下第一条神谕。每年都有无数朝圣者前来寻求神启。\n\n雅努萨波利斯建于两河交汇之处，城内架设数十座石拱桥连接各个街区，水陆辐辏，商贾云集。翁法罗斯神话中，“千门之城”雅努萨波利斯是所有道路的起点与终点，每一道门都通向一个截然不同的命运。此城以此为名，成为翁法罗斯的水陆交通枢纽。\n\n在魔法与勤劳双手的共同浇灌下，这些城市的规模与繁荣程度远超现实中的历史同期。翁法罗斯不仅站稳了脚跟，更成为这片大陆上首屈一指的文明国度——如同传说中泰坦纪元的黄金时代，万邦毗邻，城邦如繁星般在异乡的土地上依次亮起，它的光芒甚至吸引了远在印度的希腊化王国前来遣使通商。\n\n至此，一个融合了希腊与孟人血统、以翁法罗斯神话为精神根基、以魔法与热带资源为血肉的新生文明，在这片古老而陌生的土地扎根。而这一切的起点，正是十艘从科林斯烈焰中驶出的商船，和一个被重新命名为“翁法罗斯”的世界之脐。"
PAW_Country_History_Page_02: "站稳脚跟之后的翁法罗斯，迎来了长达数百年的扩张时代。奥赫玛的君王们自视为“负世之泰坦”刻法勒在人间的代言者，坚信翁法罗斯命定要统一整个黄金半岛。从公元初年到中世纪，翁法罗斯的军队一次又一次地跨出湄南河流域，向四方播撒希腊化的火种。\n\n向东，方阵跨过湄公河，一度兵临洞里萨湖畔。高棉人的早期王国在重装步兵的冲击下节节败退，翁法罗斯的旗帜飘扬在哀地里亚以东的广袤平原。然而雨季的泥泞、丛林的险阻以及高棉人游击式的抵抗，使得每一次东征都如同踏入泥沼。翁法罗斯能在湄公河西岸建立一系列堡垒和殖民点，却始终无法将统治延伸至更远的东方。向西，海军从哀丽秘榭启航，沿缅甸海岸北上，曾数次攻占缅甸南部的孟人城邦，但阿拉干山脉和漫长补给线使统治仅限于沿海港口。向南，舰队穿过马六甲海峡，在马来半岛建立了一系列以香料和锡矿贸易为核心的殖民城邦，但随着海岛伊斯兰教苏丹国的兴起，这些远隔重洋的殖民地逐渐松动。唯有向北最为成功——兰纳、素可泰等泰人王国尚未兴起时，翁法罗斯的势力已深入泰北山地，奥赫玛本身就坐落于此。但与中华帝国接壤后，扩张便戛然而止。\n\n数百年间，翁法罗斯的疆域如潮水般涨落：鼎盛时西抵伊洛瓦底江、东达湄公河、南控马来半岛大部、北触云南边陲；衰退时则龟缩于湄南河流域的核心地带。但无论疆界如何变动，有一个趋势从未逆转——同化。翁法罗斯人从未像欧洲殖民者那样实行种族隔离。从阿伽狄诺斯与孟人公主联姻开始，混血便成为这个国家的常态。希腊语演化为翁法罗斯方言，希腊多神教融合了翁法罗斯神话与本地泛灵信仰，方阵军事传统、城邦自治制度、石砌建筑成为立国之本。孟人、泰人、高棉人、缅人的后代，经过一两代人的希腊式教育，便视自己为翁法罗斯人。得益于地中海血统的强势、持续的欧洲移民（拜占庭、威尼斯商人偶尔漂流至此），以及通婚对象多为本地上层，翁法罗斯人的主流外貌仍然是西方人面孔——白皮肤、高鼻深目。走在斯缇科西亚或奥赫玛的街道上，外来者会恍惚以为自己身处某个南欧城市。\n\n14世纪以后，随着素可泰、大城等泰人王国的崛起，翁法罗斯的势力范围被逐渐挤压。泰人从北方南下，凭借更适应热带作战的战术和庞大的人口基数，一步步蚕食外围领土。翁法罗斯的君王们选择了务实的策略：收缩防线，守住湄南河流域。经过数百年拉锯，至18世纪末，疆界最终稳定下来——北至奥赫玛，南至马来边界，东至悬锋城以东不超过湄公河，西至哀丽秘榭的丹那沙林海岸。\n\n19世纪，欧洲殖民者的坚船利炮叩开了东方的大门。圣杯王国吞并缅甸，幻想乡控制印度支那。然而，翁法罗斯并非那些被动等待命运的东方古国——它与欧洲从未真正断绝过联系。数百年来，斯缇科西亚和哀丽秘榭的港口中，威尼斯、幻想乡、圣杯国商人的身影从未断绝。贵族子弟时常前往人间之里、伦敦留学，欧洲的书籍和科学新知源源不断流入。当殖民浪潮席卷东南亚时，翁法罗斯并没有像缅甸或越南那样措手不及。早在1810年代，蒸汽机便出现在斯缇科西亚的船坞；1850年代，悬锋城至奥赫玛的铁路通车，比樱花国的第一条铁路还早了十年。军队全面换装线膛步枪和新式火炮，建立了欧洲式的常备军和参谋体系，河海舰队足以在近海防御。\n\n外交上，翁法罗斯利用自身“欧洲遗民”的身份，在欧洲列强之间巧妙周旋——不是殖民地，不是保护国，而是“文明世界在东方的前哨”。圣杯国人试图将翁法罗斯纳入势力范围时，它向幻想乡示好；幻想乡渗透印度支那时，它又向圣杯国靠拢。这种平衡术使翁法罗斯在列强的夹缝中生存下来，虽然付出了部分经济主权的代价，但从未沦为任何一方的殖民地。当欧洲人看到翁法罗斯的希腊式神庙、听到贵族们流利的法语和英语、品尝到熟悉的橄榄油烹饪时，他们很难将这个国度与“土著”联系在一起。至19世纪末，翁法罗斯保住了全部核心领土，仅在东湄公河和马来半岛北部失去一些争议地带。\n\n1914年，第一次世界大战在欧洲爆发。翁法罗斯的朝堂上爆发了激烈争论：一方主张以“希腊文明之盾”的身份加入协约国，另一方主张保持中立。最终，君王决定保持中立。原因并非无力参战，而是清醒的战略计算：翁法罗斯的军事力量足以自保，但尚不足以主动挑战圣杯王国在东南亚的霸权。贸然参战弊大于利。于是，在整个一战期间，翁法罗斯的港口向交战双方出售大米、锡和橡胶，大发战争财。\n\n当1918年停战的钟声敲响时，翁法罗斯已成为东南亚最富裕的国家之一。它的军队装备精良、训练有素；它的工业门类齐全、足以自给；它的外交灵活务实、游刃有余。一战结束的1918年，翁法罗斯站在了一个新的十字路口。它的文化是希腊与东南亚的奇异融合，它的人民长着西方人的面孔却说着东方的语言。殖民主义的阴云尚未散去，民族主义的浪潮正在酝酿——而在欧洲，一场更加猛烈的风暴即将席卷世界。"
PAW_Country_History_Page_03: "一战结束后的翁法罗斯，在女皇刻律德菈的治理下迎来了空前的繁荣。刻律德菈于1915年加冕，是翁法罗斯历史上最年轻的君主。她并非天生的王室血脉，而是出身北境信仰塔兰顿的旧王朝帝国许珀耳的流浪孤儿。贵族将她推上王座作为傀儡，她却在暗中积蓄力量，最终亲自率军镇压叛乱，夺回了权杖。当摄政王试图拆穿她不是黄金裔时，刻律德菈划破手腕——流淌而出的是金色的血液。那是她用“永驻幼年”与律法泰坦塔兰顿交易得来的。她信奉绝对的公正与等价交换，坚信一切获得都须以等价的付出为代价。\n\n1923年的一个雨夜，一位不速之客来到了奥赫玛的皇宫。那是一个被称为“来古士”的智械——通体银白，身披古典式样的长袍，白发紫瞳，胸前嵌着一枚脉动着银蓝色光芒的水晶核心。他自称来自“天外”，是一个古老文明的守望者，因追寻“永恒”而流浪于星辰之间。他向女皇提出了一个匪夷所思的提议：将整个翁法罗斯献祭为一场名为“永世轮回”的实验场地。作为交换，他将揭示泰坦纪元覆灭的真相，以及通往“负世之泰坦”刻法勒的终极道路。\n\n女皇与智械密谈了三天三夜。没有人知道交易的具体内容。第四天的清晨，刻律德菈面色苍白地走出密室，立即下达了一道前所未有的敕令：国境全线封锁，所有港口停航，所有无线电通讯终止，翁法罗斯进入为期十多年的“静默”。\n\n1923年冬至日，翁法罗斯全境同步启动了“永世轮回”实验。银蓝色的光幕如同倒扣的巨碗将整个国度笼罩，所有通讯瞬间中断，边界变成了一道无法逾越的屏障。来古士向翁法罗斯高层提供了“沉浸式意识接入舱”——外形如同大理石棺椁。女皇率先躺入其中，随后是王室成员、枢密院大臣、高级军官和首席祭司们。他们的身体陷入沉睡，意识被上传到了一个来古士构建的虚拟世界——那个世界依然名为“翁法罗斯”，却比现实更加精密和真实。\n\n然而，在意识接入的那一刻，所有进入虚拟世界的人都失去了进入前的全部记忆。刻律德菈不再记得自己是女皇，不再记得来古士，不再记得实验的初衷。他们只知道一件事：集齐十二泰坦的火种，再创世界。这个目标如同烙印般刻在每个人的灵魂深处。\n\n来古士同时存在于两个世界。在虚拟世界的翁法罗斯中，他以女皇副官的身份出现，沉默而可靠地辅佐刻律德菈，记录每一次轮回的数据，从不引导，只作见证。在现实世界中，他获得了女皇的明确授权，以刻律德菈之名颁布法令、调度资源、维护秩序。他通过遍布各地的水晶棱镜发出指令，公文上盖着女皇的印玺，签着女皇的名字，但所有人都知道，真正说话的是那个银白色的身影。\n\n底层群众——数以百万计的平民——并未接入系统。他们没有那个资格。一部分人被疏散至指定区域从事基础生产，维持国家的基本运转；另一部分人的意识被稀释为虚拟世界的背景人群，成为那个世界中熙熙攘攘的NPC；还有一部分人——没有人知道他们去了哪里。\n\n国境线封锁后，外界曾派遣外交官和商船试图靠近，但所有尝试都以失败告终。圣杯国外交部曾照会翁法罗斯驻伦敦的代办，得到的唯一回复是“女皇的手谕”：“实验结束前，翁法罗斯不接受任何外界的干涉。”随着时间的流逝，外界逐渐放弃了探究。商船改道，外交关系冻结，地图上那个区域被标注上“通讯断绝”字样。\n在翁法罗斯内部，现实世界变成了一座沉默的双重领地。沉睡在接入舱中的高层身体被安置在奥赫玛皇宫深处的“静谧殿”中，由机械哨兵日夜守护；被疏散的平民则在来古士以女皇之名发布的法令下，继续着劳作与休憩的日常——只是再也没有朝堂的倾轧，没有战争与和平的抉择。他们的生活变得单调而平静，仿佛整个国家进入了一场漫长的午睡。\n\n十多年的沉默之后，1936年。一个闯入者——不知以何种方式——穿透了那道连列强炮火都无法撼动的屏障。他踏上了这片被隔绝了十三年之久的土地。斯缇科西亚的港口半空半满，水手们面无表情地装卸货物；奥赫玛的皇宫大门紧闭，石阶上落满落叶；悬锋城的城墙上依然插着锈迹斑斑的旗帜，守军眼神空洞。在皇宫深处，女皇刻律德菈的身体依然沉睡在大理石棺椁之中，金色的血液在透明的导管中缓缓流动。\n来古士似乎早就预见了这位闯入者的到来。他的声音同时在现实与虚拟两个世界中响起，平静而毫无波澜：\n\n§R“变量已抵达。永世轮回实验，进入最终阶段。欢迎，命运之外的访客。翁法罗斯等待你的选择。”§!\n"

