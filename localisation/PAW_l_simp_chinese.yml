#短事件
paw.134.t: "翁法罗斯的未来"
paw.134.d: "翁法罗斯已重返世界舞台，但如今世界局势愈发紧张，我们不得不选边站：加入一方强大势力得到帮助，亦或自己偏隅一方保持独立？"
paw.134.a: "加入§Y圣杯同盟§!能保证我们的安全"
paw.134.f: "加入§Y西太平洋公约§!更符合我们的利益"
paw.134.g: "加入§Y圣杯同盟§!，但要求[ENG.getname]交出部分领土"
paw.134.b: "加入§F大东亚共荣圈§!实现征服的伟业"
paw.134.c: "§C创建属于我们自己的民主阵营§!"
paw.134.e: "§R创建属于我们自己的毁灭阵营§!"
paw.135.t: "[PAW.getname]索取缅甸领土"
paw.135.d: "[PAW.getname]认为她们在太平洋战争中付出了巨大代价，因此要求我们将缅甸领土赠予她们。"
paw.135.a: "这可以接受"
paw.135.b: "绝无可能，这是属于帝国的土地！"
paw.136.t: "[JAP.getname]同意了"
paw.136.d: "缅甸的领土已被交给我们。"
paw.136.a: "太好了"
paw.137.t: "[JAP.getname]拒绝了"
paw.137.d: "[JAP.getname]拒绝交出领土，她们无视了我们的要求！"
paw.137.a: "算了，我们无法与[JAP.getname]抗衡"
paw.137.b: "是时候实施真正的计划了"
paw.138.t: "将领叛逃"
paw.138.d: "一些将领受到了[PAW.getname]的蛊惑，背叛了帝国！"
paw.138.a: "我们回头再找她们算账！"
paw.139.t: "错位"
paw.139.d: "来古士的控制在一瞬间消失了。\n没有预警，没有过渡。那些由智械以女皇之名颁布的政令、维持了十五年运转的调度体系、遍布各地的水晶棱镜网络——全部在同一秒内陷入沉默。行政命令断了，物资调配停了，连皇宫屋顶那枚脉动着蓝光的棱镜都暗了下去。翁法罗斯像一架突然失去了驾驶员的马车，缰绳垂落在空中，没有人知道该往哪个方向走。\n而在边境，有些人敏锐地察觉到了这股权力真空。那些在来古士统治时期被压制、被遗忘、被排除在虚拟实验之外的力量，开始招兵买马。他们不知道实验的具体内容，不在乎逐火之旅的结局，不关心奥赫玛的王座上坐着的是谁。他们只知道一件事——那个管控了这片土地十五年的存在，不在了。而空出来的位置，总要有人去抢。"
paw.139.a: "边境暗流涌动"
paw.140.t: "传播"
paw.140.d: "通讯中断的报告从四面八方涌向奥赫玛。边境哨站的信号一个接一个熄灭，不是被切断的——是没人接了。信鸦派出去，飞不回来；电报发出去，没有回音。那些地方的行政长官是谁、驻军有多少、是否已经倒向叛军——全都不清楚。\n与此同时，游行开始出现在街头。不是边境的流民，是核心区域的居民。他们举着随手写的标语，堵在市政厅门口，喊着没有人确切知道内容的口号。有人要求恢复正常秩序，有人要求追责，有人只是跟着人群走。没有统一的指挥，没有明确的政治诉求，只是十五年来被压得太紧的一切，终于崩开了第一道裂口。"
paw.140.a: "情况不容乐观"
paw.141.t: "爆发"
paw.141.d: "游行尚未平息，边境的通讯仍未恢复，而第一声枪响已经划破了奥赫玛的夜空。\n一支自称为“暹罗解放阵线”的武装力量在边境揭竿而起。他们的口号在每一座被攻占的城镇上空回荡——“打倒外来殖民者，建立真正的亚裔国家”。他们将翁法罗斯十五年来的封闭与沉睡归结为黄金裔的谎言，是与来古士共同规划的阴谋。\n信鸦最后一次从边境飞回时，腿上绑着的不是战报，是一截被撕碎的旗帜。\n内战爆发了。不是黑潮造物的侵袭，不是来古士的实验变量，是翁法罗斯自己的土地、自己的人民、自己的裂痕。那些在虚拟轮回中被暂时掩盖的伤疤——原住民与希腊裔之间的憎恨——全部在这一刻从地底喷涌而出。来古士留下的权力真空，正在被各路人马用最快的速度填满。"
paw.141.a: "这无法避免"
paw.142.t: "蔓延"
paw.142.d: "北部边境的少数民族地区宣布脱离奥赫玛的掌控，内战范围正在扩大。"
paw.142.a: "这不是正确选择"
paw.143.t: "介入[PAW.getname]内战？"
paw.143.d: "[PAW.getname]国内已陷入大规模起义，这正是我们解放她们的绝佳时机！"
paw.143.a: "机不可失，立刻宣战！"
paw.143.b: "我们还有更要紧的事"
paw.144.t: "[VIN.getname]宣布介入！"
paw.144.d: "[VIN.getname]已正式宣布介入翁法罗斯内战，并向我们宣战了！"
paw.144.a: "坚守阵线！"
paw.145.t: "内战结束"
paw.145.d: "翁法罗斯内战结束了，我们最终挫败了分裂主义者的阴谋，翁法罗斯仍然存在。"
paw.145.a: "重归稳定"
paw.146.t: "继续战争"
paw.146.d: "起义尚未结束，暹罗极端主义者会成为新的威胁，我们必须真正解放这片土地上的人民。"
paw.146.a: "继续战争！"
paw.147.t: "设立自治区"
paw.147.d: "距离翁法罗斯上次统治这些地区已经过去了太久时间，她们无法真正成为我们的核心领土，在这些地区给予一定自治权才是合理的做法。[PAW.getname]内部已经准备好了三套方案。\n\n第一种方案是给予当地人完全自治权，只要对方承认自己是[PAW.getname]核心地区的一部分就行。这个方案最为温和，虽然能极大安抚当地情绪，但无疑会大幅影响当地的兵源和工业。\n\n第二种方案是给予一定自治权，但最上层官员必须由翁法罗斯人担任。这样可以保证在当地民族不过多反抗的情况下，我们仍能对该地拥有较大的控制权。\n\n第三种方案是设立军事管辖区，把这些地区充当我们的后备人力库。[PAW.getname]将直接管理这些地区，好处是在不影响工业与资源的情况下大范围征兵，坏处是这必将引起当地人的不满。\n\n最终的决定权在[PAW.GetLeader]手中。"
paw.147.a: "全权自治吧，这样方便管理"
paw.147.b: "给予部分自治，但派遣总督进行监管"
paw.147.c: "直辖这些地区，设立军事管辖区"
paw.148.t: "东南亚自由联军"
paw.148.d: "虽然[PAW.getname]此前成功扑灭了东南亚的起义浪潮，但一个极端组织已经在战争中悄然诞生：一个名为“东南亚自由联军”的极端组织，由那些至今仍拒绝向翁法罗斯低头的顽固分子暗中纠集而成。在大多数抵抗组织都已接受现实、获得宽恕与善待之后，这群人依然执迷不悟，私下串通，密谋对[PAW.getname]发动恐怖袭击。更令人发指的是，他们的屠刀毫无差别——即便面对同族同胞、无辜平民也绝不手软，不惜用流淌的鲜血铺就他们所谓的“自由”之路。为了捍卫来之不易的秩序，[PAW.getname]必须抢在这群暴徒造成更多惨剧之前，将这股毒焰彻底扑灭。"
paw.148.a: "当理想沦为暴行，便不再有任何正义可言"
paw.149.t: "东南亚自由联军请求得到我们的帮助"
paw.149.d: "虽然[PAW.getname]已经粉碎了起义，但新生的东南亚自由联军还在活动。她们希望彻底粉碎由希腊裔统治的翁法罗斯，重新建立越南，暹罗等亚洲民族国家。因此乞求得到我们的帮助。"
paw.149.a: "我们必须帮助她们！"
paw.149.b: "这不符合我们的利益"
paw_jap_dnyjfzx_tips: "一旦@PAW§Y[PAW.getname]§!停止抵抗，@SIA§Y[SIA.getname]§!与@VIN§Y[VIN.getname]§!将立刻得到解放，并成为@JAP§Y[JAP.getname]§!的附庸国"
paw.150.t: "越南地区开始出现恐怖袭击"
paw.150.d: "[JAP.getname]疑似资助了东南亚自由联军，印度支那联盟的残余正在帮助自由联军发动更多的恐怖袭击。"
paw.150.a: "他们背弃了信仰，我们必须阻止这场疯狂"
paw.151.t: "东南亚自由联军被彻底消灭"
paw.151.d: "今日，最后一名东南亚自由联军的恐怖分子宣布投降，[PAW.getname]本土终于重归安宁。"
paw.151.a: "再次胜利"
paw_bjzfl_tips: "即使我国停止抵抗，@SIA§Y[SIA.getname]§!与@VIN§Y[VIN.getname]§!也不会被@JAP§Y[JAP.getname]§!释放"
paw.156.t: "$news_event_background$翁法罗斯内战全面爆发"
paw.156.d: "翁法罗斯在长达十余年与世隔绝的沉寂之后，重新进入国际视野的方式并非外交照会，而是一场规模空前的内部叛乱。\n据确认，一支自称要为实现东南亚民族解放的武装力量已在翁法罗斯境内发动大规模起义。该组织以“建立亚洲人的东南亚”为号召，迅速获得了对现政权不满的地方派系和武装团伙的支持。短短数周内，起义军已控制大片领土，并宣布成立与之对立的政权。\n观察人士认为，此次起义根植于翁法罗斯长期封闭所积累的深层矛盾。在国境封锁期间，边缘地区与核心城邦之间的裂痕持续加深，加之高压统治和资源分配不均，最终导致了这场全面爆发的内战。更令人担忧的是，多个少数族裔聚居区已趁乱宣布自治，进一步加剧了该国的分裂态势。\n目前，国际社会正密切关注翁法罗斯的局势发展。由于该国地理位置关键，其内战走向可能对周边地区的稳定产生深远影响。各主要强权已开始评估这场冲突对自身战略利益可能带来的冲击。"
paw.156.a: "知道了"
paw.156.b: "消灭翁法罗斯！"
paw.156.c: "我们会取得胜利！"
paw.157.t: "$news_event_background$[VIN.getname]全面介入翁法罗斯内战"
paw.157.d: "翁法罗斯的内战局势在一夜之间急剧升级。[VIN.getname]于今晨正式发表声明，宣布与翁法罗斯现政权进入战争状态，其正规军已从三个方向越过边境，向翁法罗斯腹地全面推进。\n河内方面在声明中措辞强硬，称翁法罗斯现政权为“腐朽的封建残余与外部势力的傀儡”，并表示[VIN.getname]军队的介入旨在“彻底解放翁法罗斯受压迫的各族人民，将革命火种播撒到这片被暴政笼罩的土地上”。声明还宣布，[VIN.getname]将向所有与翁法罗斯现政权作战的起义军提供军事援助，并派遣军事顾问团协助其整编部队。\n军事分析人士指出，这对翁法罗斯现政权而言无疑是沉重一击。该政权刚刚从长达十余年的封锁中恢复对外联系，军队尚未完成现代化整编，如今又不得不在两条战线上同时应战——对内镇压极端民族主义者的起义，对外抵御[VIN.getname]的正规军入侵。\n伦敦和人间之里方面尚未对此事做出正式回应，但据悉内阁正紧急磋商应对方案。东京方面则对[VIN.getname]的行动表示“严重关切”，警告此举可能导致地区冲突进一步扩大。莫斯科方面尚未发表评论，但外界普遍认为河内此次行动事先得到了莫斯科方面的默许。"
paw.157.a: "出人意料的发展"
paw.157.b: "解放东南亚！"
paw.157.c: "我们不会投降！"
paw.158.t: "关于向翁法罗斯移交南洋属地的提案"
paw.158.d: "翁法罗斯政府已正式向我国提出请求，希望依据《共同防御及行政协作协定》草案，将圣杯属南洋若干行政区的管辖权移交于彼方。该区域虽非战略要冲，但涉及数千圣杯籍及当地居民之生计，以及我国在远东之既有声望。\n当前战局严峻，我国亟需稳固远东盟友、减轻本土防务压力。翁法罗斯在东南亚拥有深厚根基，若其以此作为加入[ENG.GetFactionName]的条件，则移交这些属地或可换取其在马来半岛及夏连特拉外围提供有效的侧翼牵制。\n内阁对此意见不一：外交大臣倾向于将其视为团结反魔导国和樱花国阵营的必要让步；而殖民地事务部则担忧此举将开创先例，动摇帝国治下其他属地的信心。女王陛下政府必须做出决断。"
paw.158.a: "同意移交，欢迎翁法罗斯加入[ENG.GetFactionName]"
paw.158.b: "拒绝移交，维持现有边界"
paw.159.t: "[ENG.getname]同意移交南洋属地"
paw.159.d: "圣杯国政府已正式批准《共同防御及行政协作协定》，同意将圣杯属南洋部分属地移交我国，并接纳我国加入[ENG.GetFactionName]阵营。上述区域已按程序完成行政接管，当地居民享有完全国民待遇。我国将在盟军框架下承担相应军事义务，共同抗击他国侵略。\n外交部对圣杯国政府的信任与支持表示感谢，并重申翁法罗斯将恪守国际承诺，以正义与和平为己任，与盟国并肩作战至最终胜利。"
paw.159.a: "翁法罗斯正式回归世界舞台！"

