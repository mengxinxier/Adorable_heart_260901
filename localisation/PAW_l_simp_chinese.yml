PAW_baie_tt: "[PAW_baie_tt_desc]"
PAW_baie_tt_desc_tips: "白厄是圣城奥赫玛现存的黄金裔之一，来自哀丽秘榭，年幼时与昔涟是好友。由于被黑潮夺去了挚友、亲人与故乡，于是独自踏上旅途，加入了抵抗黑潮的逐火之旅。被旁人称为没有缺陷的救世主，完美的神性容器，将带领所有人敲开奇迹的大门。"
PAW_baie_tt_desc_tips_true: "白厄，本名卡厄斯兰那，翁法罗斯永劫轮回的原因之一，盗火行者的真身。在毁灭机器铁墓即将成型之时，为保住行将毁灭的翁法罗斯，白厄踏上数万次的永劫轮回，夺取火种试图反抗核心，并因负载数亿颗火种的灼烧而失去理智，成为我们如今见到的盗火行者。\n得到神谕：“汝将肩负骄阳，直至灰白的黎明显著。”"
PAW_age_tt: "[PAW_age_tt_desc]"
PAW_age_tt_desc_tips: "§Y阿格莱雅§!\n\n阿格莱雅，承载【浪漫】神权的半神，黄金裔与逐火之旅的领导者，拥有借助金丝获取与传递信息的能力，为奥赫玛编织了万帷网。"
PAW_fengjin_tt: "[PAW_fengjin_tt_desc]"
PAW_fengjin_tt_desc_tips: "§G风堇§!\n\n风堇，又名雅辛忒丝，是翁法罗斯的黄金裔之一，天空之泰坦艾格勒的辅祭，神悟树庭智种学派那刻夏的讲师助理，医疗机构昏光庭院的首席护理师。\n作为天空之子的后裔，她与那些善于征战的先祖不同，而是更希望作为医生，看护英雄背后的平民。在夺回天空火种后，她牺牲自己为翁法罗斯撑起苍穹，降下虹光看护那些遭受灾难之人。"
PAW_nakexia_tt: "[PAW_nkx_tt_desc]"
PAW_nkx_tt_desc_tips: "§G那刻夏§!\n\n阿那克萨戈拉斯，翁法罗斯的【理性】半神，神悟树庭七贤人之一，智种学派的创始者，大地兽的狂热爱好者。\n幼年时被黑潮夺走家人，因为向泰坦祈求无果不再相信神明。树庭求学后，他创立了智种学派，坚信世间万物出自同一本源，甚至妄图熔炼泰坦，创造理想中的完美世界。"
PAW_kelv_tt: "[PAW_kelv_tt_desc]"
PAW_kelv_tt_desc_tips: "§C刻律德菈§!\n\n刻律德菈，尊号「凯撒」，律法的半神，被人们冠以止战的燃冕者、云崖的独裁官、圣城的女皇、逐火的凯撒等众多称号。原为王国王女，由于王国国力衰微，刻律德菈踏上了称王的征程，最终独揽奥赫玛大权，并开启了第一次逐火之旅。"
PAW_haiseyin_tt: "[PAW_hsy_tt_desc]"
PAW_hsy_tt_desc_tips: "§B海瑟音§!\n\n海瑟音，又名海列屈拉，海洋的半神、海妖的公主、奥赫玛的骑士统领、刻律德菈的近侍。在深海中为抵御黑潮而战，成为海妖族唯一的幸存者，上岸后被刻律德菈收入麾下，如今为逐火之旅而战。"
PAW_xilian_tt: "[PAW_xilian_tt_desc]"
PAW_xilian_tt_desc_tips: "§P昔涟§!\n\n*********************************************************\n曾得到预言：“汝将收梢于花开时，一如终结诞下起始。”"
PAW_saifeier_tt: "[PAW_sfe_tt_desc]"
PAW_sfe_tt_desc_tips: "§C赛飞儿§!\n\n赛飞儿，承载【诡计】神权的半神，拥有【人人信以为实，谎言即可成真】的能力。年幼时被阿格莱雅收留，在成为半神之时得到预言：“汝将与贪婪同行，亦将亡于分文。”"
PAW_xiadie_tt: "[PAW_xiadie_tt_desc]"
PAW_xiadie_tt_desc_tips: "§0遐蝶§!\n\n遐蝶是翁法罗斯的黄金裔之一，曾经哀地里亚的督战圣女，奥赫玛的入殓师，也是翁法罗斯轮回的铁证。她在之前得到过一则预言：“花海尽头，生者的魂灵将温暖汝之指尖；相拥之后，便是永恒的离别。”"
PAW_tibao_tt: "[PAW_tibao_tt_desc]"
PAW_tibao_tt_desc_tips: "§R缇宝§!\n\n缇宝，本名缇里西庇俄丝，承载【门径】神权的半神，翁法罗斯大部分黄金裔的老师，是雅努萨波利斯的先代圣女，翁法罗斯的第一位半神。曾以自我分裂为代价，将救世的神谕传递到各个城邦，如今绝大部分都已牺牲，仅余缇宝，缇安与缇宁。"
PAW_wandi_tt: "[PAW_wandi_tt_desc]"
PAW_wandi_tt_desc_tips: "§H万敌§!\n\n万敌，承载【纷争】神权的半神，本名迈德漠斯，悬锋城的新王，即使死去也能拒绝冥界的诱惑，从冥界杀回人间重获新生，唯一的弱点是背后的第十节胸椎。在成为半神时得到预言：“终有一日，汝将背后负创而死”。"
PAW_danheng_tt: "[PAW_tenghuang_tt_desc]"
PAW_tenghuang_tt_desc_tips: "§Y丹恒§!/§H腾荒§!\n\n丹恒并非翁法罗斯本地人，他通过某种特殊方式进入翁法罗斯，并融入了黄金裔的体系中。对他来说，最重要的是破解翁法罗斯的轮回谜题，返回原本所处的世界。"
PAW_sanyueqi_tt: "[PAW_cyy_tt_desc]"
PAW_cyy_tt_desc_tips: "§C三月七§!/§0长夜月§! \n\n三月七并非翁法罗斯本地人，她通过某种特殊方式进入翁法罗斯，并融入了黄金裔的体系中。长夜月原为藏于三月七心中的执念，在特殊时刻会附身保护三月七。对她来说，最重要的是破解翁法罗斯的轮回谜题，返回原本所处的世界。"
