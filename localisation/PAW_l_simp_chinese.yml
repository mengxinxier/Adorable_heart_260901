PAW_69: "献予「诡计」之诗 "
PAW_69_desc: "愿「诡计」皆为游戏。"
PAW_70: "献予「负世」之诗"
PAW_70_desc: "愿「负世」照拂黎明。"
PAW_71: "献予「海洋」之诗"
PAW_71_desc: "愿「海洋」奏响欢宴。"
PAW_72: "献予「律法」之诗"
PAW_72_desc: "愿「律法」遍入群星。"
PAW_73: "献予「岁月」之诗"
PAW_73_desc: "愿「岁月」守望长夜。"
PAW_74: "献予「大地」之诗"
PAW_74_desc: "愿「大地」捍卫前路。"
PAW_75: "献予「创世」之诗"
PAW_75_desc: "愿「开拓」，共赴「爱」的约定♪"
PAW_76: "献予「真我」之诗"
PAW_76_desc: "愿世界，如你我所愿。"
PAW_77: "记忆，化作涟漪片片♪"
PAW_77_desc: "蔚蓝的天空映照出灿烂的明天。\n一步、两步…少女行过的路是如此漫长，所幸那些珍藏的故事未被轮转的岁月遗忘。\n而今，在众人共同的谱写下，史诗已然成篇，迎来尾声。\n群星，百花，飞鸟，美好的新世界。\n轻纱，花环，长裙，风儿衔来祝福。\n三千万世的追寻化作幸福的一瞬，足以抵过永恒的千言万语。\n「嘻，约好啦……」\n少女回眸，莞尔一笑。\n「一人留在过去，一人走向未来…但我们的心，从未分离♪」\n她踮起脚尖，走入过往——\n而记忆，化作往昔的涟漪，向着明日荡去。"
PAW_78: "再创世"
PAW_78_desc: "终于，翁法罗斯摆脱了她的宿命，永劫轮回结束了。\n在轮回结束后，刻律德菈的威信与来古士的交易彻底暴露，凯撒陛下已彻底失去了民心，白厄作为拯救翁法罗斯的英雄，将接替凯撒的职责。"
PAW_79: "来古士的结局"
PAW_79_desc: "这位自始至终都保持神秘的智械，最后悄悄消失了，没人知道他的生死与去向。"
PAW_80: "翁法罗斯回归"
PAW_80_desc: "翁法罗斯现已正式恢复运转，我们已回到国际舞台之上。"
PAW_81: "行向世界终点"
PAW_81_desc: "哀丽秘榭，遗世独立的边陲村落，如今只余晦涩的传说。\n无名的英雄卡厄斯兰那，容纳「负世」火种的黄金裔，铭记全世的理想，背负万众的命运，为新世界带来第一缕曙光。"
PAW_82: "身承炎炬万千"
PAW_82_desc: "哀丽秘榭，少年的家乡。\n村庄日出而作，日落而息，如同他的身世，朴实无华。\n只能容纳数人的校舍内，少年听着令人昏昏欲睡的历史课，心思早已跟手中飞舞的木屑一同飘向遥远的地方。\n一笔一划，藏在桌屉里的木头逐渐显现出战士的模样。\n「要有一把沉重的大剑，才配得上这样的实力……」\n对着阳光，他磨利木片的边缘。\n「铠甲闪耀着荣誉的伤痕，披风好似搏击风云的翅膀。\n「还有……」\n「白厄！想要成为最强的战士…就该好好听讲。」\n皮西厄斯老师总是不厌其烦地打破他的幻想。\n相比学校，少年更喜欢那麦秸堆垛的训练场。\n那里是他的战场，稻草人时而是来袭的兵团，时而是横冲直撞的恶兽。\n不上学的时候，他常常在这里与木头雕成的伙伴消磨一整天的时光，直到每一隅村户飘散出烹调的香味。\n清凉的树荫下，疲惫的少年枕在草地便能安睡。\n支离破碎的梦境中，他眺望着从未见过的城邦，见证波澜壮阔的故事。\n「去成为英雄吧……」\n那心声如同哀丽秘榭翻涌不息的麦浪，引领少年踏上远行的路。\n\n->->->->->->->->->->->->->\n>>>第1次运算\n……\n>>>赋予对象「Neikos496」定义\n>>>载入场景[哀丽秘榭]\n>>>执行模拟\n对象「Neikos496」沿坐标组A-F轨迹运动\n对象「Neikos496」新建变量[心中的英雄]\n>>>变量[黑潮]开始位移更新，对[哀丽秘榭]执行覆盖指令"
PAW_83: "照见英雄本色"
PAW_83_desc: "面对那从异乡漂泊而来的青年，织者与貌如孩童的先知偶尔会提及逐火与黄金裔的历史。\n织者无光的双眼仿佛能看穿他内心的迷茫，而先知的天真烂漫又令他感受到家的温暖。\n「也就是说，黄金裔，是天赐的命运……」青年鼓起勇气说道。\n织者摇了摇头。\n「不如说，那是漫长的苦行。」\n青年将氤氲麦香的过去珍藏心中，他加入圣城的军团日夜训练，直到高深的剑术变得如同呼吸一般简单。\n在那场震惊世人的死斗中，悬锋的王储与他僵持十个日夜，那大开大合的挥斩之间，他仿佛早已把自己当成视死如归的剑。\n当然，更多的时候，青年总以风趣轻松的态度示人。\n「我只是希望让别人感到亲切和自在。」\n关于这一点，他的友人虽然嗤之以鼻，但也知晓正因如此，白发青年在圣城平民与贵族中享有信赖和美名。\n去往树庭求学的岁月，对逻辑本不感兴趣的青年，在翻烂书坊的典籍后，常在辩论场上以机智的演讲取胜。\n虽然老师的锋芒令他避之不及，但他深知自己正缺那份坚持自我的勇气。\n只是当青年从战场归来，医师为他包扎完伤口后，依旧思忖良久。\n「白厄阁下…你是不是总在夜里惊醒，或者无法入睡？」\n他并不在意。\n要踏上那击落神明的路，他必须将自己雕刻成众人需要的模样。\n\n->->->->->->->->->->->->->\n>>>第49次运算\n……\n>>>载入场景[奥赫玛]\n>>>载入场景[神悟树庭]\n……\n>>>载入计算因子\n「HapLotes405」\n「SkeMma720」\n「EpieiKeia216」\n「PoleMos600」\n「EleOs252」\n……\n>>>开启运算\n……\n>>>对象「Neikos496」自我迭代进程0.43%"
PAW_84: "火与光，善恶的化身"
PAW_84_desc: "高举雷枪的神明陷入疯狂，在那以「纷争」为名的战役，男人同伙伴给予那疯神最后的解脱。\n在那争夺「理性」火种的辩论场，男人与昔日恩师对峙，见证残酷的处刑。\n登上「天空」的战场，男人踏上彩虹桥，以烈阳之光穿透阴霾，照亮凶险的前路。\n「救世主，带领吾等前进吧。」\n听到织者欣慰的话，他心中更多的是苦涩。但在众人面前，他不愿表露担忧。\n身受万死的王储踏上归乡的路，将悬锋族人交托于他。\n「放心，我会替你照顾。」\n分裂千身的先知磨损殆尽，他接过启程前立下的誓言。\n「缇宝老师，我会去见证…那星月满天的明日。」\n学者为真理奔赴死亡，圣女拥抱孤独的命运。\n「下一世，真理定会解明，死生…将有序流转。」\n织者安眠于黄金的浴池，捷足的侠盗带着遗憾停下脚步，永驻天空的医师再也无法回到大地。\n「以身为薪柴，我会…成为照亮新世界的烈火。」\n男人无法流泪，只能凭着心中的剧痛，将回忆刻入脑海。\n他背起万众的心愿，朝着朝阳升起的山巅蹒跚前行。\n他相信，终有一日，曙光会穿透翁法罗斯的长夜。\n「但倘若黎明从一开始就不存在……」\n曾经，他千百次问过自己这个问题。\n如今，向着那炽热酷烈的终点，男人刻下「白厄」的最后一笔——\n「那就让怒火燃尽此身，化作明日的烈阳！」"
PAW_85: "天与地，世间的泡沫"
PAW_85_desc: "->->->->->->->->->->->->->\n>>>调用记录\n【第597次运算】\n……\n请求：「成为回应世界期许，背负众人心愿的人。」\n响应：「一个孑然一身的人。」\n进度：0.096%\n……\n\n【第8128次运算】\n……\n请求：「哪怕只有最粗糙的凡铁，也请用它保卫家园！」\n响应：「一道无足轻重的伤疤。」\n进度：1.34%\n……\n\n【第16256次运算】\n……\n请求：「黄金裔已悉数就位，逐火的征途正式启程。」\n响应：「一个永无止境的轮回。」\n进度：2.89%\n……\n\n【第496000次运算】\n……\n请求：「开启再创世，去迎接翁法罗斯崭新的黎明。」\n响应：「一▇▇▇▇徒劳的▇▇▇▇▇▇▇。」\n进度：32.47%\n……\n\n【第33550337次运算】\n……\n请求：「▇▇▇▇铭记▇▇▇▇▇▇▇▇背负▇▇▇▇▇▇▇▇▇▇▇新世界▇▇▇▇」\n响应：「▇▇▇▇燃▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇尽▇▇▇▇▇▇」\n进度：99.81%\n……\n>>>警告：进度无法更新"
PAW_86: "几重寂静深埋归墟"
PAW_86_desc: "如往日千万次所经历的那样，他于火光中再次看见——\n哀丽秘榭的清晨，朝阳的光辉照耀在村庄的麦田。\n「好像…做过无数次这样的梦……」\n在树下醒来的男孩揉着惺忪的睡眼。\n梦中，太阳坠落，英雄的造像崩塌，融化，碎裂，将世界烧成一片灰烬。\n在一片死寂中，那形如焦炭的熟悉身影踽踽独行，朝着漫无止尽的黑暗走去。\n「那个身影燃烧自己…但也燃尽周围所有的一切……」\n男孩怔怔地看着那尚未完成的木雕，梦中那刺骨的愤怒与对自我的憎恨仍在震动着他的心。\n「这样的世界…正在呼唤着英雄的到来吧……」\n「未来会是什么样的？」\n枕在那金黄的麦草上，男孩眼前浮现出跌宕起伏的史诗故事。\n「也许，即将到来的英雄漫游四方，行侠仗义，解决过无数棘手的难题，却从不留名……\n「身负神秘的过去，对抗荒谬的命运，战胜可怕的敌人。\n「当世界陷入危难，便会以至诚的心践行誓言，所到之处，总是带来和平与繁盛……\n「哪怕百次，万次，千万次…英雄可以被毁灭，但绝不会被打败……」"
PAW_87: "多少泰坦面目模糊"
PAW_87_desc: "如果一切未曾改变。\n哀丽秘榭的日子仍旧静静流淌，如过去千万次那样。\n那朵微弱的火苗，启程之初便已种进他的心里。\n当男孩成为少年，再一次站在渡口，再一次向着远方启行。\n他会马上奔向未来，忘记那些支离破碎的梦。\n他不会知晓这趟旅程有多遥远，直到成为熊熊燃烧的薪柴，去壮大那徒劳的火焰。\n到达终点时，他才会得知自己已行过漫长的路。\n最后一次，他回想起那个朝阳初升的时刻，自己曾刻下理想的雏形，在往后的岁月里，他将为它取另外一个名字——「救世主」。\n而他自己的名，就此在记忆中零落。"
PAW_88: "永劫时针，三千万转"
PAW_88_desc: "->->->->->->->->->->->->->\n>>>警告！\n>>>警告！\n>>>警告！\n错误7：未定义的对象「Player」调用\n……错误12：未处理的类型转换\n……\n错误99：错误的条件判断\n……\n>>>第33550337次运算终止\n>>>「铁墓」进度：99.81%"
PAW_89: "黎明恰如此燃烧"
PAW_89_desc: "又一次站在旅途的终点，男人的身影被金色的骄阳吞没。\n「那黄金的血液，救世的希望，原来……」\n他的眼泪还未落下，便蒸发不见。\n「小白，明天见！」\n「救世主，记得活到最后！」\n「去成为翁法罗斯的黎明吧……」\n……\n众人的愿望空余回响，无名的英雄破碎，露出那酷烈的死亡。\n「若怒火不足以焚灭悖谬的命运……」\n他一次又一次朝着那山顶攀升，一次又一次跌落粉碎——\n「那就让我与它一同燃尽！」"
PAW_90: "实验失败"
PAW_90_desc: "很遗憾，轮回实验最终失败了。在我计算中可能性仅为3.11%的事件却实际发生了。毁灭机器没能诞生，而黄金裔们也没能挣脱枷锁。接下来的国策会很少，希望平行世界的您能帮助我完成这一课题。"
PAW_91: "政治点"
PAW_91_desc: "这是一个可无限循环的国策，每次完成国策后都会重置该国策。"
PAW_92: "稳定度与战争支持度"
PAW_92_desc: "这是一个可无限循环的国策，每次完成国策后都会重置该国策。"
PAW_93: "三军经验"
PAW_93_desc: "这是一个可无限循环的国策，每次完成国策后都会重置该国策。"
PAW_94: "民用工厂"
PAW_94_desc: "这是一个可无限循环的国策，每次完成国策后都会重置该国策。"
PAW_95: "军用工厂"
PAW_95_desc: "这是一个可无限循环的国策，每次完成国策后都会重置该国策。"
PAW_96: "海军船坞"
PAW_96_desc: "这是一个可无限循环的国策，每次完成国策后都会重置该国策。"
PAW_97: "凯撒回归"
PAW_97_desc: "凯撒已成功凯旋。翁法罗斯，为女皇的回归欢呼吧！"
PAW_98: "为帝国指引前路"
PAW_98_desc: "翁法罗斯需要女皇的指引，她必将走向更伟大的未来！"
PAW_99: "重整战争机器"
PAW_99_desc: "如今凯撒等人已从虚拟空间返回，是时候准备开始重启帝国的战争机器了。"
PAW_100: "夺走一切王冠"
PAW_100_desc: "公正之秤的两端永远平衡，但为何世间从未公平？人与泰坦力量悬殊，翁法罗斯与银河也是如此…真正的「律法」，只能以战争与血火铸就。"
PAW_101: "凝聚万众宏愿"
PAW_101_desc: "棋的艺术，是牺牲的艺术，也是前进的艺术。逐火军从不回头——胜利之后，自有人以蜜酿祭奠我等的灵魂。"
PAW_102: "燃尽旧日律法"
PAW_102_desc: "意欲取「律法」的力量，注定要付出同等的代价…只是那又如何？以燃烧之痛换来冠冕，以永驻幼年剥夺神权——这交易，公平至极！"
PAW_103: "重塑天地人间"
PAW_103_desc: "这并非终点，而是伟业的基石。"
PAW_104: "易位，兵贵神速"
PAW_104_desc: "王者为先，万民随后。"
PAW_105: "升变，士皆可帅"
PAW_105_desc: "爱臣们的爵名，皆由我亲自构思后敕封。既要兼顾威严，又需朗朗上口，成为人人传颂的美谈。"
PAW_106: "帮助与加害，全数奉还"
PAW_106_desc: "王行到之处，皆颂我名。"
PAW_107: "征途只在，星辰大海"
PAW_107_desc: "棋子只识敌我两方，孰不知宇宙远不止黑白二色。翁法罗斯的终点也不过是银河的起点，我必将奔赴更渺远的群星。"
PAW_108: "成功接入游戏"
PAW_108_desc: "玩家已成功接入当前游戏系统。作为隐藏路线，这条线将会提供多方面的增益。"
PAW_109: "心中的翁法罗斯？"
PAW_109_desc: "轮回实验已经结束，您可以从现在开始打造您心中的翁法罗斯。"
PAW_110: "幻象还是真实"
PAW_110_desc: "虽然此前角色们的数据已遭完全损坏，但管理员可以轻松复原他们原本的模样。至于他们还是不是本人，则看你自己的感觉。"
PAW_111: "记忆如往事重现"
PAW_111_desc: "英雄史诗已然成篇———"
PAW_112: "现在的记叙者"
PAW_112_desc: "作为翁法罗斯最高阶的存在，您理应拥有所有路线的可用机制，可惜您无法体验到这些机制的最高数值。"
PAW_113: "过往的拾遗者"
PAW_113_desc: "作为翁法罗斯最高阶的存在，您理应拥有所有路线的可用机制，可惜您无法体验到这些机制的最高数值。"
PAW_114: "未来的咏唱者"
PAW_114_desc: "作为翁法罗斯最高阶的存在，您理应拥有所有路线的可用机制，可惜您无法体验到这些机制的最高数值。"
PAW_115: "缪斯的新舞伴"
PAW_115_desc: "身为您的得力助手，我会帮助您改进这些增益效果。"
PAW_116: "诗篇的裁缝匠"
PAW_116_desc: "身为您的得力助手，我会帮助您改进这些增益效果。"
PAW_117: "神启的转承者"
PAW_117_desc: "身为您的得力助手，我会帮助您改进这些增益效果。"
PAW_118: "未完的尾声"
PAW_118_desc: "看，在永恒之地，展开一卷无名的史诗—— 听。风中的歌谣传唱再创世的哀歌，看见金血流过安眠的花丛，火种撑起疮痍的大地。 就像种子即将死去，诗篇无人问津。  因为虚假的结局将故事的扉页铐上枷锁。 数算荧荧的冷光，刺痛祈盼黎明的眼睛。 岁月未曾流淌，太阳将要毁伤——这是故事的高潮，抑或终局？ 不，还差…最后一笔。  于是你在每一页留下「开拓」的字迹，向下坠落是向另一端升起。 你们奔行在记忆的泥浆，用亿万颗火种烧蚀冰冷的数列，接住破碎的胚芽。 当一页新生的空白出现，你落下一笔，它也向过去…荡开涟漪。  荧荧的光闪烁在记忆留白的夜空，尚未到来的流星，被寄予永恒的期待。 十三声心跳，在高歌逐火之旅，因为那是他们深爱的土地。 故事的扉页被再次翻开，那里写着有关生命的预言。  听！风中的歌谣如是传唱，记忆的种子在群星处生长，因为 ——银河已知晓「翁法罗斯」的姓名。"
PAW_119: "重整[PAW.getname]军队"
PAW_119_desc: "漫长的轮回终于落幕，[PAW.getname]军队已在虚耗的岁月中搁置太久。她们从未真正输掉一场战争，却几乎输掉了对战争的全部记忆。"
PAW_120: "海军指挥部"
PAW_120_desc: "斯缇科西亚的船坞荒废了太久，但港口还在，老水手也还没死光。先把指挥体系搭起来，剩下的事才能一件一件办。"
PAW_121: "扩建干船坞"
PAW_121_desc: "现有的造船设施撑不起一支像样的舰队。沿着斯缇科西亚海岸扩建新的干船坞。"
PAW_122: "海军参谋扩编"
PAW_122_desc: "一支现代化海军需要的不只是船，还有能指挥它们的人。扩充海军部的参谋编制，让每艘下水的新舰都有明确的作战定位。"
PAW_123: "应急造舰计划"
PAW_123_desc: "时间不站在我们这边。集中船台和钢材，优先保障主力舰艇的快速建造，先撑起一支能出港的舰队再说。"
PAW_124: "航母预研"
PAW_124_desc: "海外的情报很明确：战列舰的时代正在过去，航空母舰将成为下一代海战的核心。翁法罗斯不能等别人都用上了再追。"
PAW_125: "新一代驱逐舰"
PAW_125_desc: "现有的驱逐舰设计已落后于时代。我们需要航速更快、反潜能力更强的新一代驱逐舰来为舰队护航。"
PAW_126: "舰炮升级"
PAW_126_desc: "在海上，火力是最后的裁判。提升现役舰艇主炮的射程与毁伤能力，让翁法罗斯舰队在正面交火中不至于吃亏。"
PAW_127: "两栖突击大队"
PAW_127_desc: "海战不止于舰炮对射。组建一支专业的两栖突击部队，承担登陆侦察、港口突袭等任务——陆战队不该只是水手兼职。"
PAW_128: "深度学习"
PAW_128_desc: "书本和观察团能带回来的东西终究有限。建立系统化的军事情报分析机构，从海外的每一场冲突、每一次演习、每一份公开报告中提取有用的战术信息，让别人的经验变成我们的数据，再让这些数据训练出属于翁法罗斯自己的战争逻辑。"
PAW_129: "舰队航空兵"
PAW_129_desc: "陆地上的飞机场够不着远海。组建海军专属的航空联队，让舰队拥有自己的侦察与打击半径。"
PAW_130: "高速编队"
PAW_130_desc: "在大洋上，速度意味着主动权。优先提升舰艇的航速与机动性，让翁法罗斯舰队能够自主选择接敌时机与角度。"
PAW_131: "空军指挥部"
PAW_131_desc: "飞机不是陆军的附属品。设立独立的空军指挥机构，把分散在各处的航空力量整合起来，统一调配、统一训练。"
PAW_132: "战机增产"
PAW_132_desc: "现有的飞机制造能力远不足以支撑一场现代空战。扩大生产线，先解决有没有的问题，再解决好不好的问题。"
PAW_133: "新式战斗机"
PAW_133_desc: "封锁前购入的机型已经过时了。研发航程更远、机动更强的新一代战斗机，让飞行员在缠斗中不至于从一开始就处于劣势。"
PAW_134: "近距支援战术"
PAW_134_desc: "空军不只是用来打空战的。训练飞行员识别并打击敌方地面目标的能力，让前线部队在需要的时候能叫来空中支援。"
PAW_135: "战略轰炸探索"
PAW_135_desc: "有些目标藏在敌人腹地，舰炮够不着，陆军走不到。发展远程轰炸能力，让翁法罗斯的威慑范围不再局限于边境。"
PAW_136: "机动性能优先"
PAW_136_desc: "空战的胜负往往在于谁能先抢到有利位置。在战机设计上优先保障机动性，让我们的飞行员在缠斗中能咬住对手的尾巴。"
PAW_137: "飞行员培训体系"
PAW_137_desc: "飞机可以加班生产，飞行员不行。建立系统的飞行培训流程，让每一位升空的新手都有足够的训练时长。"
PAW_138: "全天候作战训练"
PAW_138_desc: "敌人不会只挑晴天来。训练部队在夜间和恶劣天气下起降与作战的能力，让空军在任何条件下都能出动。"
PAW_139: "制空权优先"
PAW_139_desc: "谁掌握天空，谁就掌握了战场。集中资源打造一支能在开战初期就夺取制空权的精锐空军——没有制空权，陆军和海军的行动都会处处受限。"
PAW_140: "天空骑士"
PAW_140_desc: "最优秀的飞行员值得最好的座驾和最高的荣誉。组建一支由精英飞行员组成的王牌飞行队，让他们成为敌人飞行员最不想在无线电里听到的名字。"
PAW_141: "晴空永驻"
PAW_141_desc: "当最后一架敌机坠入大海，翁法罗斯的天空将只属于守护它的人。这是空军最终的承诺：让仰望天空的孩子只看得见云。"
PAW_142: "陆军指挥部"
PAW_142_desc: "仗打到最后一刻，踩在敌人阵地上的永远是陆军。建立统一的陆军指挥机构，把分散在各城邦的守备部队整合成一支可调动的野战力量。"
PAW_143: "单兵装备更新"
PAW_143_desc: "士兵手中的步枪还是封锁前的库存。全面更新步兵的武器与装具，让每一位战士拿到的都不是上一代人用剩的东西。"
PAW_144: "新型火炮列装"
PAW_144_desc: "现役火炮射程和精度都已落后。研发并装备新一代牵引式与自行火炮，让翁法罗斯的炮火能在敌人还看不见我们时便已落下。"
PAW_145: "组建装甲师"
PAW_145_desc: "从悬锋城平原到哀丽秘榭丘陵，翁法罗斯的地形适合装甲部队展开。组建第一个真正意义上的装甲师，用坦克代替骑兵的马蹄。"
PAW_146: "摩托化步兵"
PAW_146_desc: "靠两条腿行军的时代该结束了。为步兵部队配备运输车辆，让他们能跟上坦克的推进速度，而不是在装甲部队突破防线后还要等几天才能抵达。"
PAW_147: "魔法应用研究"
PAW_147_desc: "旧时代遗留的魔法知识并非完全无用。探索将残余的魔法技术应用于军事通信和战场侦察的可行路径。"
PAW_148: "战场通讯网"
PAW_148_desc: "命令需要更快地到达前线。建立现代化的战场通讯体系，让指挥部能够在战况变化的几分钟内做出反应，而不是几小时后。"
PAW_149: "游骑兵传统"
PAW_149_desc: "翁法罗斯的轻步兵向来擅长复杂地形。延续这一传统，组建专门的轻装渗透部队，在敌后执行侦察、袭扰和破坏任务。"
PAW_rangers_buff_tech: "游骑兵强化"
PAW_149_tips: "启用§Y游骑兵强化§!：\n§Y£rangers_texticon 所有游骑兵§!：\n $STAT_ARMY_COMBAT_WIDTH$§G-0.2§!\n §Y所有地形§!\n $STAT_ADJUSTER_MOVEMENT$§G+10.0%§!\n\n"
PAW_150: "军官速成培训"
PAW_150_desc: "封锁期间军官晋升几乎完全停滞，整整一代人没有机会在实战或演习中积累指挥经验。加紧培养新一代指挥官，填补断层。"
PAW_151: "特种作战小组"
PAW_151_desc: "不是每场战斗都需要一个团。建设小规模特种作战力量，用于执行渗透、破坏、营救等常规部队难以完成的任务。"
PAW_152: "中型坦克优先"
PAW_152_desc: "重型坦克太贵，轻型坦克太脆。集中资源发展中型坦克，在火力、防护和成本之间找到翁法罗斯最能承受的平衡点。"
PAW_153: "核心防区建设"
PAW_153_desc: "在进攻之前，先确保心脏不会被一刀捅穿。在翁法罗斯核心区域构筑纵深防线，让敌人即便突破边境也无法长驱直入。"
PAW_154: "军工企业扶持"
PAW_154_desc: "单靠国家兵工厂难以满足全面备战的需求。向具备生产能力的私人企业提供军需订单和技术支持，让整个工业体系都为战争动员起来。"
PAW_155: "后勤保障改革"
PAW_155_desc: "再精锐的部队在断粮时也不过是一群困兽。重建后勤补给体系，确保前线部队的弹药、燃料和口粮不会在某条泥泞的土路上断掉。"
PAW_156: "[PAW.getname]国防军"
PAW_156_desc: "从轮回的废墟中站起来的这支军队，不再是各城邦守备队的松散拼凑。海陆空三军已整合为一支统一的现代国防力量，她们已经做好了准备。"
PAW_shortcut_tips: "军事改革"

#事件#
paw.1.t: "凯撒之死" #带图片
paw.1.d: "消息是随着北风传过来的。\n不是正式讣告，不是信鸦，只是几个从水之城方向逃来的旅人在路边歇脚时压低声音的交谈。其中一个人说凯撒死在了斯缇科西亚的废墟里，另一个人说动手的不是黑潮造物，是她的骑士统领。第三个人什么都没说，只是反复擦着剑上的锈。\n没有人能证实任何一个版本。唯一能确认的事实只有一条：刻律德菈死了。\n白厄听见这个消息时，正在做自己手头的事。他没有追问细节，没有放下手里正在做的事，只是在那些旅人起身赶路之后站了片刻。他不确定自己听到这个消息时心里在想什么。也许什么都没想。也许想了太多，多到挤不出一个完整的念头。奥赫玛的钟声迟早会敲响，圣城会颁布正式的丧令，元老院会推举新的领袖。但此刻只有风，和几个已经在收拾行囊准备继续逃命的陌生人。翁法罗斯在不知道什么地方失去了她的君主。"
paw.1.a: "……是谁" #觉醒值 +1
kaisasile_tips: "§R刻律德菈逝去，愿她在下个轮回不再受此厄运§!"
paw.2.t: "深海无音"
paw.2.d: "刻律德菈的葬礼是按翁法罗斯最古老的传统办的。\n没有火种仪式，没有黄金裔的颂词。女皇生前没有指定谁来念悼词，元老院也没有推举任何人。最后是几个最年长的侍女将花束放在石棺上，然后退到一旁，让在场的人各自沉默。\n白厄在整个葬礼中没有说话。但他的目光一直在人群中搜寻——不是找人，是找一副甲胄。海瑟音的甲胄，那位骑士统领平日里从不离身的银蓝色轻甲，以及那只被海洋半神视作生命的剑镡顶端的水滴形宝石，都不在任何一个人的身上。葬礼上，没有半神的气息。海瑟音没有出席。\n葬礼后，白厄去了一趟骑士统领的住所。门没有锁。房间干净得不像住过人——床铺整整齐齐，桌上的战报叠成等高的几摞，剑架上空的凹槽还留着长剑的形状。但有一件东西没带走：刻律德菈的褪色披风被压在枕头下，叠得比兵营里的行军铺盖还要方正。海瑟音什么时候把女皇的旧披风收在这里，谁也不知道。\n白厄把披风放回枕边。\n接下来的几天，他问过城门守卫，问过传令兵，问过几个曾在斯缇科西亚轮值过的黄金裔。每个人的说法都差不多：那天夜里，没有人看见海瑟音走出宫门。没有人看见她从城墙上跃下，也没有人在码头或驿道上见过她的身影。她只是消失了。一个海洋半神，一位在战场上独斩六万敌军的骑士统领，就这样无声无息地从奥赫玛蒸发了。没有告别，没有遗书，也不给任何挽留的机会。\n白厄最后一次去海瑟音的房间时，窗外的海风已经冷了。他站在那张空了的剑架前，想起了一些事。第一次在宫殿的阴影里见到海瑟音的时候，她的视线挪到他身上，隔着一段距离，她瞥来的眼光比他这辈子受过的大部分剑伤都要冰冷。她对他说过什么来着？“你已经很久没有让别人接上话了。但今天她接上了。”她说的不是自己——她说的永远是刻律德菈。\n而现在，那个永远站在别人身旁的人，自己也变成了虚空。\n白厄没有把披风带走。他关上门的动作很轻，像关上一间客室，而非关上一段不会再有人提及的历史。"
paw.2.a: "......"
haiseyinshizong_tips: "§C海瑟音失踪了，愿与她在下个轮回再见§!"

paw.3.t: "以神礼观众之名——我见证" #带图片
paw.3.d: "一个声音在虚空中响起。不，不是响起——是像程序的日志一样，一行一行地写入你的意识。\n\n“玩家阁下。或者说——更高位面的来客。向你致意。”\n\n“按照惯例，我应该在戏剧的开幕陈述以下事实。请不必急于提问，\n\n这同样是我的第370次陈述，一切都已演练得相当纯熟。”\n\n“一、你所见的这个世界——翁法罗斯，并不真实。它是一组运算程序。我是它的管理员，你可以称我为来古士。”\n“二、那位刻律德菈女皇，多年前接受了我的提议，封锁了所谓‘国境’。本质上，她签了一份她并未读懂条款的契约，将整个国家献作了运算的样本。”\n“三、这道运算的目的，是培育一台纯粹的毁灭机器。本轮的运算，是第33550336次。”\n\n“——至于你。”\n“你是更高位面的玩家。你能俯视这段程序的全部因果分支，从初始变量到终末输出，全部可见。但你无法直接写入代码。你需要一个合法的执行器，一个在这个运算系统内拥有行动权限的个体。”\n\n“他的名字，是卡厄斯兰那。在这套叙事里，他被唤作‘白厄’。你接下来将以他的双眼为视窗，以他的双手为接口。你所有的选择，都会经由他的意志执行。对本系统而言，那看上去将完全是他自己的决定——这也是运算协议允许的最大自由。”\n\n“现在，你已知晓身份、规则、以及这个世界的本质。”\n\n“我想看看，这一次，你会在这道公式里代入怎样的变量。”\n\n“翁法罗斯的命运，开始转动吧。”"
paw.3.a: "……开始"
paw.3.b: "我有问题——"
paw.3.a.tips: "§g翁法罗斯的神秘面纱将随着故事的进行而被逐渐揭开，你的每个选择都将决定她未来的命运§!"

paw.4.t: "天外之音" #带图片
paw.4.d: "白厄从浅眠中醒来。\n\n窗外的奥赫玛仍笼罩在黎明前的暗蓝中，巡逻卫兵的脚步声从远处的城墙上隐约传来。一切如常。但白厄无法再闭上眼。\n\n他做了一个梦。不——那不是梦。梦不会留下这种感觉。\n\n在方才的沉寂中，他感到有什么东西掠过了自己的意识。一双眼睛，从极高极远的地方，注视着他。没有言语，没有形象，只有一道无法追溯来源的视线，如同星辰在宇宙深处凝视一颗石子。\n\n他坐起身，按住自己的胸口。心跳平稳，呼吸如常。但他的指尖微微发颤——不是因为恐惧，而是因为某种无法解释的确信。\n\n有什么东西变了。\n\n白厄望向窗外尚未破晓的天空。他不知道自己要去哪里，不知道前方有什么在等着他。但他清楚地感到，从这一刻起，有一只手——或许不是手，是一种他无法命名的存在——正搭在他的肩上，指引他向某个方向走去。\n\n“如果你在那里，”他低声说，不知在对谁说话，“我会走下去。直到看清你的样子。”\n\n窗外，第一缕晨光刺破了奥赫玛的天际线。新的一天开始了。白厄站起身，推开了门。"
paw.4.a: "无论你是谁——跟着我，别眨眼。"
paw.4.b: "……我会弄清楚的。"
paw.4.c: "是错觉吧。"
paw.4.a.tips: "一位来自更高位面的存在（§R你§!），已将目光投向了白厄。\n§g此后的所有抉择，都将经由白厄的意志执行——对他而言，那看上去将完全是自己的决定。§!"

paw.5.t: "迎战黑潮" #带图片
paw.5.d: "黑潮如潮水般涌来，以压倒性的数量淹没了整个隘口。\n\n白厄已经记不清自己挥了多少剑。每一次劈砍、每一次格挡，都伴随着黑潮造物尖锐的嘶鸣和一声沉重的喘息。身边的战友越来越少，防线一寸一寸地后退。\n\n“左翼失守了！它们冲过来了——”一名斥候嘶哑地喊道，随即被涌来的黑潮淹没。\n\n白厄转身想去救援，却发现敌人根本没有理会那个方向。它们全部转向了来时的路，仿佛被什么东西吸引。\n\n一道金色的身影踏着黑潮的残骸而来。\n\n他金红色的长发在漆黑中燃烧，身着坚固的战甲，手中的长戟每一次挥动都呼啸着撕扯空气。鲜血飞溅在他轮廓分明的脸上和肌肉线条清晰的双臂上，但他浑然不觉。他穿过涌动的黑潮，每一步都踏得坚实而笃定，仿佛从远古的史诗中走出来的英雄。\n\n“——悬锋城的人。”白厄低声说道。\n\n那人听见了，侧过头来，打量了一眼这片几近崩溃的防线。他的神情淡漠而矜持，但目光中带着一种不加掩饰的审视。\n\n“就你一个人守这条路？难怪会被围起来打。”他说完，便将长戟往地上一顿，以一种居高临下的傲然环视战场。\n\n一个体型数倍于他的黑潮巨兽被他傲然的姿态激怒，嘶吼着大步朝其冲来。巨响过后，众人只见他仅仅是抬起手，便反手抵住了巨兽的冲锋。两者角力间，他青筋暴起，脚下的地面龟裂出数尺深的沟壑。但他开口时却只有一种游刃有余的平静：\n“我是悬锋的王储‘迈德漠斯’，亦是奥赫玛的战士‘万敌’。今日过后，你有足够的时间去了解我。”\n他微微偏头，对白厄挑起一边眉毛。\n\n“不过现在，要么出去再战，要么等我解决它们后——再治你的怠惰。”"
#万敌初始关系值50
paw.5.a: "“想要独吞战绩？没那么容易。”"  #万敌关系值 +10
paw.5.b: "“不需要你的指挥。”"  #万敌关系值 -5
paw.5.c: "“那就交给你了。”"  #万敌关系值不变

paw.6.t: "避其锋芒" #带图片
paw.6.d: "黑潮退去后，奥赫玛的隘口弥漫着硝烟与血腥混杂的气味。收拾战场的士兵们互相挽着肩膀，笑声和痛呼交织在一起。万敌站在不远处的高坡上，独自擦拭着他那柄沾满黑潮残渣的长戟，金红色的发尾在风中拂动。\n\n他忽然抬起头，目光撞见了沉默行军的白厄。\n\n“你这是打算去哪？”万敌的声音从高坡上传来，并无热情，但也算不上咄咄逼人。\n\n“去求见凯撒刻律德菈大人。”白厄回应，脚步未停。“黑潮虽然暂时撤退了，但后续只会来得更猛烈。我需要向她当面汇报隘口的战况。”\n\n“巧了。”万敌从高坡上跳下来，扛着长戟走近了几步，“我也要去找她。悬锋城的旧账，有些事只有她才知道答案。”\n\n白厄停住脚步，回头看着他，眼神平静却带着棱角。“那就各走各的。你我的路，未必非要在同一条道上。”\n\n万敌微微一怔。他没有生气，只是缓缓将长戟往肩上一靠，嘴角扯出一个意味不明的弧度。\n\n“也好。你那种一命换一命的打法，我可不想在去见凯撒的路上再替你收拾残局。”\n\n白厄没有回应。他转过身，独自踏上了通往圣城深处的长阶。\n\n接下来的路程，两人虽偶有同行路段，却始终一前一后，互不搭话。万敌偶尔会停下，像是在观察什么；白厄则头也不回。不知从何时起，白厄察觉到，有时他放慢脚步，身后那个金红色的身影也会恰好放慢。也许是错觉，也许不是。\n\n只是每当入夜独宿时，他总是不由得想起万敌在黑潮中杀入重围的身影——如果他愿意并肩……不，白厄摇了摇头，将这个念头按了下去。\n\n与其依赖他人，不如磨砺自己的剑刃。凯撒大人曾说过，黄金裔的使命终究要由每个人独自背负。他必须变得更强。独自变强。"
paw.6.a: "与其期待他人的援手，不如磨砺自己的剑刃"  #万敌关系值 -5 | 觉醒值 +5
paw.6.a_tips: "§g白厄坚定了独自背负使命的信念。他不再去想万敌的事。前方的路还很长，而能够托付性命的，终究只有自己手中的剑。§!"
paw.6.b: "……如果他愿意并肩，也许路上不会这么冷清"  #万敌关系值 -10 | 觉醒值 +2
paw.6.b_tips: "§g他犹豫了片刻，回头望了一眼来路。那个金红色的身影已经消失在暮色中。这道坎，他终究没能迈过去。§!"

paw.7.t: "并肩而行" #带图片
paw.7.d: "黑潮退去后，奥赫玛的隘口弥漫着硝烟与血腥混杂的气味。战场上的士兵们互相挽着肩膀，笑声和痛呼交织在一起。万敌站在不远处的高坡上，独自擦拭着他那柄沾满黑潮残渣的长戟，金红色的发尾在风中拂动。\n\n白厄本想就此别过。\n\n然而当他正待离开时，却不由自主地想起方才那一幕：万敌面对黑潮的狰狞浪潮，不退反进，那只手不仅挡住了巨兽的冲锋，更仿佛是某种藐视...\n\n“……等等。”白厄叫住了他。\n\n当万敌回过头来时，白厄已经快步走上前。\n\n“你说你要去奥赫玛找人算账，”白厄说，“找的是谁？”\n\n万敌沉默了片刻，然后将长戟往地上一顿。“凯撒刻律德菈。悬锋城覆灭之前，她曾派人来过。有些事，只有她才能给我答案。”\n\n“巧了。”白厄几乎要笑出来，“我也要去觐见凯撒大人。隘口的战况需要当面汇报。那就顺路。”\n\n万敌挑起一边眉毛：“这算是邀请还是命令？”\n\n“建议。”\n\n万敌哼笑了一声，将长戟往肩上一扛：“不怕我拖你后腿？”\n\n“你既然不怕我死守打得狼狈，我也不怕你独断专行。”\n\n万敌沉默片刻，嘴角罕见地微微上扬。“走吧。”\n\n落日余晖中，两人并肩踏上了通往凯撒宫殿的长阶。\n\n途中，万敌难得主动开口，说起了悬锋城消亡的旧事：黑潮并非自然而起，每当悬锋人以为得胜时，它便会以更加狰狞的方式卷土重来，仿佛被一只无形的手精准调控了难度。而凯撒刻律德菈——她只是派人前来慰问，并未派出任何增援，悬锋城变为孤岛。\n\n“那不是灾祸，”万敌淡淡道，“是命题。一道很恶劣、但总能检验出谁能活、谁该死的命题。”\n\n“但我不信。”万敌转过头，金色的眼眸看向白厄，眼中闪过一丝难以掩盖的情绪。“我不信悬锋灭亡的命运无法改变。你最好也别信。”\n\n白厄没有立刻回答。他望向长阶尽头，凯撒的宫殿在暮色中静静矗立，那里或许有他们各自想要的答案。"
paw.7.a: "“我不信命运。更不信所谓注定。”"  #万敌关系值 +10 | 觉醒值不变
paw.7.a_tips: "§g白厄的声音比任何时候都要坚定。万敌没有回答，但他记下了这些话。§!"
paw.7.b: "“我会记住这句话。”"  #万敌关系值 +5 | 觉醒值 +2
paw.7.b_tips: "§g他不知道自己是否完全同意。但万敌说这话时的眼神，让他无法简单地把它当作一句空话。§!"
paw.7.c: "“悬锋城的覆灭不是你的错。你不该把一切都扛在自己身上。”"  #万敌关系值 -5 | 觉醒值 -2
paw.7.c_tips: "§g万敌愣住了，他别过头去。“你懂什么。”§!"

paw.8.t: "女皇的决断" #带图片
paw.8.d: "宫殿深处，烛火摇曳。\n白厄踏入正殿时，一眼便看到了她。\n刻律德菈——翁法罗斯的女皇，凯撒——坐在那张对她而言过于宽大的高背石椅上，双脚堪堪触及地面。她蓝色的长发垂落在肩侧，衬着一张尚且年少的容颜。但没有人会因为她的体型而轻视她。那双眼睛扫过来的时候，白厄感到一种被洞穿的压力。\n“禀报凯撒大人，白厄求见。”引路的侍从单膝跪下。\n刻律德菈没有起身。她的手指在石椅扶手上轻轻叩着，节奏缓慢而均匀。\n白厄的目光扫过殿内。女皇的身侧立着两个人。\n一位是身着甲胄的女性骑士，站在石柱的阴影里。白厄此前只在仪典上远远见过她——海瑟音，女皇的近卫统领。她沉默如深海，目光平稳地落在他身上。\n另一位站在石椅另一侧，是个面容清瘦的男子。他身着朴素的长袍，手持一卷羊皮纸，姿态安静而得体。但当白厄的目光扫过他时，有一种难以名状的感觉一闪而过——那个人的动作太稳了，稳得不像是人的习惯。他的站姿没有一丝多余的重心偏移，手指按在羊皮卷上的角度过于整齐。\n但只是一瞬。那个人微微点头，嘴角带着一抹难以捉摸的弧度，像个再普通不过的宫廷顾问。\n“起来吧。”刻律德菈终于开口，声音不大，却压住了整个正殿的空气。“隘口的战报我已经看了。黑潮的强度又上升了——你不必复述。”\n白厄正要开口，被她抬手止住。\n“在你说出下一句话之前，先回答我一个问题。”刻律德菈微微倾身，双手交叠搭在膝盖上。“白厄，你信黄金裔的使命吗？”\n白厄没有立刻回答。\n“我最近在想一个问题。”刻律德菈继续叩着扶手。“黄金裔——被选中承载火种的英雄们——世世代代只有一个任务：击败掌管世界权柄的泰坦，回收他们身上的火种。等十二枚火种齐聚，黄金裔就将再创世界，终结黑潮。这是自远古传下的铁则。”\n烛火跳了跳。\n“但我翻阅了宫中所有的逐火记录。从最早的古卷到最近几代的战报，每一次英雄们击败泰坦、回收火种，每一次他们以为走到了终点……然后呢？”\n她顿了顿。\n“什么都没有。记录到此为止。下一卷翻开，又是新的逐火，新的英雄，新的起点。”她的声音没有起伏，却比任何控诉都沉重。“这些记录里写满了牺牲和荣耀，但它们从不说结局。我开始想——会不会根本没有结局？会不会黄金裔的使命从来就不是抵达终点，而是……不断地出发？”\n她直视白厄的眼睛。"

paw.801.d: "“我知道这些话听起来像是亵渎。但那些卷宗——它们堆起来比我还高——没有一卷能告诉我，逐火成功之后的世界是什么样子。”\n沉默在殿中扩散。\n那位顾问依然保持着纹丝不动的站姿，羊皮纸在他手中轻轻卷起。他在看白厄——以一种白厄无法形容的方式。不是审视，不是期待，更像是……记录。\n“凯撒大人。”白厄的声音不大，却很稳。“我没有读过那些古卷。但我知道，在隘口面对黑潮的时候，与我并肩的人——不论他们是黄金裔还是普通士兵——他们的血是热的。他们倒下去的时候，没有一个人问过‘这值不值得’。”\n他停了一拍。\n“我不知道逐火的终点在哪里。但我信那些为之赴死的人。”\n刻律德菈怔住了。\n她靠在椅背上，看着白厄，像是第一次真正看清这个年轻人。她的手指在扶手上停住了。\n“凯撒大人……”“够了。”刻律德菈抬起一只手，语气恢复了惯常的冷峻，但那双眼睛仍没有从白厄身上移开。她停顿了一下，才继续说道：“……我还没有被你说服。隘口的增援我会派出去。至于你的那些话——留到下一次觐见再说。”\n她跳下石椅，站起来的高度只到白厄胸口。从椅旁走过时，她的声音压低到旁人几乎听不清：“……我没有被你打动，不用多想。”\n随即她迈开步子，头也不回地从他身侧走过。\n海瑟音从石柱的阴影中走出，跟上女皇。与白厄擦肩时，她微微侧过头。\n“……你刚才说的话，我听到了。”她的声音很轻，很平稳。“她已经很久没有让别人接上话了。但今天她接上了。”\n她没有再多说一个字，那双深海的眸子只是静静注视了白厄一瞬，便转身离去。\n那位顾问也随之收起羊皮纸，从白厄身侧走过。在擦肩的那一刻，他的脚步停了一瞬——极短的一瞬，短到白厄几乎不确定那是不是错觉。他的声音很轻，像是自言自语，又像是某种公式化的确认：\n“……变量记录完毕。”\n然后他重新迈开步子，无声地消失在殿门外的长廊里。\n白厄站在原地，烛火仍在轻轻跳动着。他看向殿门的方向，那里已经没有一个人影。\n他不知道那些古卷里记载了多少次逐火。但至少——今天，他还握着自己的答案。"
#解锁【刻律德菈】关系值，初始值：55（口头上没有被说服，但内心已被触动）
#解锁【海瑟音】关系值，初始值：60（因说服刻律德菈而对你抱有初步善意）
paw.8.a: "“凯撒大人，我等你的答复。”"  #刻律德菈关系值 +5 | 觉醒值 +
paw.8.a_tips: "§g白厄对着殿门方向微微点头。那位女皇嘴上说着没被打动，但他注意到了——她说那句话的时候，没有看他的眼睛。§!"
paw.8.b: "“海瑟音……她一直在看着。”"  #海瑟音关系值 +5 | 觉醒值 +1
paw.8.b_tips: "§g白厄脑海中浮现出海瑟音那双深海般的眼眸。她说话不多，但她看的比谁都清楚。也许未来某天，她会是一个比女皇更难读懂的关键。§!"
paw.8.c: "“那个顾问……他说变量记录完毕？”"  #觉醒值 +4（隐约察觉到了某种异常，但无法言明）
paw.8.c_tips: "§g白厄皱起眉头。变量？记录？那位顾问的措辞和语气都不太对劲。他说不出具体哪里不对，但这句话在他脑海中久久盘桓，挥之不去。§!"
paw.8.e: "......"

paw.9.t: "新的理解" #带图片
paw.9.d: "神悟树庭比他想象中更安静。白厄原以为会听到辩论场上的高亢争论，或是学者们并肩诵读典籍的声响。但当他走上树根盘绕的石阶，穿过一座座悬于枝干间的庭院时，耳畔只有风穿过叶片的声音，和远处果实坠入水中溅起的轻响。理性之泰坦瑟希斯以巨圣树的形象降临于此。它的枝干撑起了整座城邦，粗如城垣，高入云层。庭院与回廊攀附在枝干之上，如同结在树身上的果实，错落有致地悬于半空。阳光穿过层层叠叠的叶隙，在石板上投下斑驳流动的光影。白厄在回廊中放慢脚步，低头看去——每一块石板都刻着文字。不是装饰，不是碑铭，而是学者们随手留下的批注与推演。有人论证黑潮的周期规律，有人诘问泰坦神力的来源，有人在石板的裂缝处补上新的公式，旁边又被人划掉重写，争论跨越了时间，被刻进了树庭的骨骼。\n\n“……原来如此。”白厄喃喃道。\n\n他来自哀丽秘榭的战场。在那里的每一场战斗，都是刀剑与血肉的碰撞。他以为对抗黑潮的方式只有一种——冲上去，砍下去，活下来。但在这些石板上，他看到有人在用另一种方式与黑潮作战：用观察、用推演、用几代学者前赴后继的驳论。白厄在一棵垂枝如瀑的古树下停住脚步。树上结的不是果实，而是卷轴——几百卷、几千卷，有的已经褪色发脆，有的还系着湿墨未干的封绳。他随手展开一卷，上面写满了关于黑潮蔓延方向的推演，字迹从遒劲写到潦草，最后一行戛然而止，墨迹被一滴水渍晕开。\n\n他无法确定那是水还是别的什么。\n\n水流尽头的青苔岩壁上刻着树庭的训言。方正的刻痕历经风雨，至今清晰可辨：\n“思辨是黑潮未曾污染的火种。守之勿熄。”\n\n白厄在那行字前站了许久。\n\n他的手指无意识地搭上了腰间的剑柄——这是他多年养成的习惯，思考时总会下意识地确认武器还在。但此刻，他的手指没有握紧。\n\n也许变强不一定意味着挥出更重的剑。也许先人留下的知识，也是一把武器——他尚未学会使用的武器。\n\n黑潮仍在蔓延。下一场战斗不会太远。但至少——今天，他找到了一套新的装备。"
paw.9.a: "思辨是黑潮未曾污染的火种——守之勿熄。"  #觉醒值 -2
paw.9.a_tips: "§g他默念了一遍，又一遍，直到那些字刻进了记忆里。从前他只知道用刀剑战斗，但从今天起——他也将学着用思辨守护这些从未被黑潮熄灭的光。§!"
paw.9.b: "原来知识也可以是一把武器。"  #觉醒值 +5
paw.9.b_tips: "§g白厄没有说出声，但他的指节在剑鞘上轻轻叩了一下。他理解这个世界的方式一直是战斗——但如果有武器握在手里，一切就有了把握。知识也可以是一把武器，他只需学会怎么挥动它。§!"
paw.9.c: "树庭的学者们在为逐火培育火种。"  #觉醒值 -1
paw.9.c_tips: "§g白厄发现，这些堆叠的卷轴看似与战场无关，但每一卷都在为逐火积蓄力量。只不过，他们锻造的不是刀剑——而是理解。而理解，也许正是他作为黄金裔必须学会的第一课。§!"

paw.10.t: "阿那克萨戈拉斯"  #带图片
paw.10.d: "“别叫我那刻夏。叫我阿那克萨戈拉斯。”\n这是白厄听到的第一句话。他甚至还没来得及推开那扇半掩的木门，声音已经从里面扎了出来。\n那刻夏——或者说，阿那克萨戈拉斯——正对着一排悬于藤架上的蒸馏瓶说话。他背对着门，身穿学院派风格浓郁的长袍，淡绿色的长发在右肩扎成马尾，左眼上覆着一只绣有金色纹样的黑色眼罩。那些蒸馏瓶连接着扭曲的玻璃管，管中液体冒出细小的气泡，像是某种比酒精更烈的发酵物。\n白厄走进房间。阿那克萨戈拉斯听见了脚步声，但没有转身，只是从桌案上抓起一个玻璃瓶，对着里面的浑浊液体自言自语。\n“每一个气泡，都存在这里的原因。温度、压力、催化剂——我全都知道。但我不知道的是，它们‘想’上升到液面，还是‘被’上升到液面。”\n他把瓶子往桌上一磕，液体晃了晃，气泡暂时停止了上升。然后，片刻后，它们继续向上。\n“看。我给的条件改变了它的表现，但改变不了它的本质。”他终于转过头，用唯一露出的那只眼睛打量着白厄。“我猜，你来找阿那克萨戈拉斯，不是来学发酵的。”\n“我是来提问的。”白厄说。“或者说，来听你提问的。”\n“哦？”阿那克萨戈拉斯的一边眉头微微扬起。“那么请问——你为什么信逐火？”\n白厄没有立刻回答。\n“你们有一个麻烦的习惯，”阿那克萨戈拉斯转身，靠在桌案上。“你们先把问题当成答案，再跳过所有证明过程，最后用一句‘这是使命’来封住所有人的嘴。但我有足够的时间去想。”\n他眼中闪过一丝自嘲。“你知道神悟树庭的同僚们怎么看我吗？‘渎神者’、‘叛逆’、‘穿着华服的大地兽’。”\n他摘下眼罩，露出了下方那只布有红色纹路的面庞。他抬头望着窗外巨树的枝干，声音压低了几分。\n“‘理性’——瑟希斯赋予我们的，是理性之名。但理性若是真的，为什么要禁止提出问题？为什么质疑本身，就是亵渎？”\n他并不期待白厄立刻给出一个令他满意的答案，只是又将目光回到白厄身上。“所以你问我的问题不重要，重要的是我要问你：你来这里，是因为别人告诉你逐火之路理应如此，还是因为你自己不相信这条路会真正通往救世的终点？”\n他顿了顿，让那个问题在空气中落定，然后用几乎像是推销员的语调说道：“要不要来杯酒？放心，我酿的——我管它叫‘真理’。”\n白厄没有应酒约，但他也没有离开。\n他开始理解为什么树庭的人说阿那克萨戈拉斯危险了。这个人不是在传授结论，他是在拆掉别人认知里的每一根承重柱。他不知道这些柱子是否还能被重新拼接成更有力的支撑——但至少，他想听听柱子的结构。毕竟，如果最终它们被证明无法支撑起终点，那早一点撞上去，难道不正是更明智的选择吗？\n“那个人……”阿那克萨戈拉斯忽然说道，目光越过白厄的肩膀。“你身上有道视线。”\n白厄脊背一凛。\n“不是我的事。我不是指瑟希斯式的视线。不是泰坦，也不是某位同僚在半空中俯视你。是更深的东西。”阿那克萨戈拉斯眯起眼，“你不会理解，不过没关系。也许有一天，我会把它解构出来。现在给我出去，你站在我蒸馏区正中间，很碍事。”"
#解锁【那刻夏】关系值，初始值：45（对你有一丝兴趣，但嘴上绝不承认）
paw.10.a: "“真理是什么味道？”"  #那刻夏关系值 +10 | 觉醒值 +1
paw.10.a_tips: "§g白厄接过酒杯，抿了一口。那味道比他想象中更烈，也更苦——但咽下去之后，喉间有一丝微弱的回甘。§!"
paw.10.b: "“我从来没有因为别人告诉我去做，就去做一件事。”"  #那刻夏关系值 +5 | 觉醒值 +2
paw.10.b_tips: "§g那刻夏顿了顿，然后发出一声短促的“哈”。“那至少你不是第一批来找我的傻瓜。但我还没有相信你——这份怀疑，你自己留着掂量。”§!"
paw.10.c: "解构出来之后，告诉我答案。" #那刻夏关系值 +5 | 觉醒值 +4
paw.10.c_tips: "§g白厄没有追问。但他记住了这句话。那刻夏是一个对隐藏的真相抱有怀疑的人——也许未来某一天，他能帮自己解开那道天外之音的谜团§!"

paw.11.t: "缇宝，缇安，缇宁"  #带图片
paw.11.d: "白厄最初以为她是一个人。\n倚靠在神悟树庭的卷宗回廊里，他看见一个小小的身影蹲在不远处的石板边上，火红的短发，背后一对小翅膀收束着，正拿着一根树枝在石板缝隙里戳着什么。阳光从枝干叶隙间漏下，落在她的发顶上，让那片火红色融化成了暖洋洋的颜色。然后另一个一模一样的身影从她背后冒出来，一把抢过树枝。\n“让我来！”\n“不要——是我先捡到的！”\n两个小小的身影在石板路面上争抢起来，小翅膀扑腾着扬起一片细小的树籽。白厄眨了一下眼，试图确认自己是否看花了。\n然后第三个身影从树后走了出来。她似乎完全没有注意到另外两个正在抢树枝，径自走到白厄身边，仰头看他。她眼睛上方覆着一层薄薄的花瓣状刘海——白厄注意到，她的眼瞳与另外两人并不相同，一个深沉静默，一个活泼明亮。\n“你是白厄。”她的声音不像另外两人那样轻快，而是带着一种偏低的沉稳。“‘卡厄斯兰那’。我们听说过你——在黑潮前线，你守住了隘口。”\n另外两个不知何时停止了争抢，也凑了过来。活泼的那个仰着头盯着他看，眼睛睁得又大又圆：“真的是白厄本人耶！缇宝缇宝缇宝——未来的救世主就是这个样子吗？”\n安静的那个——她刘海偏高，笑容温和——走到同伴身侧，轻声说：“他没有我们想的高，也没有我们想的凶。比画册上的好看。”\n白厄被三轮审视围在中间，一时间不知该回答哪一句。\n安静的那位最先注意到了他的困惑。“我叫缇宝，”她微微欠身，姿态温柔又礼貌，“雅努萨波利斯的圣女。这两个——”\n“缇安！”活泼的那个举起手。\n“缇宁。”安静偏沉的那位点了点头。\n“——她们是我。”缇宝补充道。\n白厄的思绪顿了一下，没有立刻接话。但他没有在这个细节上停留太久。不管她们是一个人还是三个人，在这种形单影只的树庭，如果她们愿意多说几句，他并不排斥。他需要情报——而他面前的，是翁法罗斯最不可思议的信使。\n“你们走了多少地方？”他问。\n“所有的。”缇安抢答。缇宝补充：“凡是一扇门能打开的地方。”缇宁最后补充：“但有的地方，去了就回不来——我们有九十七个死在了黑潮前线。她们的感受，我们全都知道。”\n沉默来得毫无预兆。\n“但这没什么。”缇安忽然拍了拍自己的脸，又在缇宁头上轻拍了一下。“因为只要有一个我们活着，我们就还会走。圣女的使命可不是守在树庭里发呆呀——我们要把救世的讯息传给每一片还能听到声音的大地，这是母亲教我的。”\n“是我们的母亲。”缇宝纠正道。\n“都一样啦！”\n白厄看着她们之间不需要言语的默契，原本从容的话忽然梗在喉间。他想到隘口战场上倒下的士兵。他想到他可以用剑守护他们，却无法在最后一刻为他们分担千分之一的疼痛。\n缇宝抬起头来，冲他笑了笑。\n“不用为我们难过。我们有一个秘密——你想听吗？”\n“想。”\n“那就找一个你没有打仗的日子，我们再告诉你。”\n三个身影挥了挥手，消失在盘根错节的枝干间。白厄站在原地，头顶的叶隙仍在漏下阳光。他忽然觉得，神悟树庭这一趟求学之旅，来对了地方。"
#解锁【缇宝】关系值，初始值：65（天生的亲和力与白厄的某种共鸣）
paw.11.a: "她们经历了九十七次死亡，还能笑出来吗？"  #缇宝关系值 +10 | 觉醒值 -4
paw.11.a_tips: "§g白厄在那一瞬间想了很多，又什么都没想清楚。但他知道，面前这几个小小的身影教会了他一件很重要的事——所谓使命，不是一个人独自走到终点。而是为了某个未来，愿意千次万次地站起身继续走下去。§!"
paw.11.b: "下次见面，告诉我那个秘密。"  #缇宝关系值 +5 | 觉醒值 -2
paw.11.b_tips: "§g白厄对着那抹即将消失在辉光中的身影轻轻笑道。无论是同一还是独立，能与这样纯粹的灵魂相互守望，对于行走在逐火之路上的人来说，都是一种来之不易的救赎。§!"
paw.11.c: "黑潮前线的情报……她或许能成为最重要的外援。"  #缇宝关系值不变 | 觉醒值 +4
paw.11.c_tips: "§g白厄收起心绪，在脑中默默整理着方才的对话。无数扇门，无数次死亡，无数条信息——他还没有完全消化。但他隐约感觉到，在未来的道路上，缇宝一体那遍布各个城邦的信息网将成为他最宝贵的武器。§!"

paw.12.t: "圣城奥赫玛"  #带图片
paw.12.d: "白厄决定在城里转转。\n这念头来得有些突然。也许是因为他意识到，自从离开哀丽秘榭、以黄金裔的身份踏入这座圣城以来，他眼里只有战场、训练和元老院的调令。奥赫玛对他而言，更像一个巨大的兵营，而不是一座有人居住的城市。\n他想看看，这座城里的人到底在过着怎样的日子。\n东边那条街的面包房前已经排起了短队。面包师是个膀大腰圆的中年人，围裙上沾满面粉，嗓音洪亮得整条街都能听见：“今天的份额还剩三十个！后面的别挤，刻法勒在上，你们比黑潮还能推！”排队的人群里发出几声低低的笑。白厄站在街对面看着——他作为黄金裔，口粮由圣城直接配给，从没排过这种队。但他注意到，面包师悄悄多塞了一块给排在最前面的那个老人。老人没有道谢，只是微微点了点头。某种默契，某种不必说出口的东西。\n他继续往下走。广场的喷泉边上，两个孩子正用木棍打架。不是真打，是模仿黄金裔对阵黑潮的姿态。那个矮个子的孩子挥舞着一根过长的木棍，嘴里喊着“我是逐火英雄！”，另一个立刻反驳“你连剑都拿反了”——两人很快扭打在一起，接着被各自的母亲拽着耳朵拎开。白厄看着这一幕，嘴角不自觉地动了动。他想起自己在哀丽秘榭时，也曾拿着木棍在麦田边上挥舞，幻想着有一天能成为故事里那种站在黑潮面前一步不退的人。如今他真的站在黑潮面前过了，那把剑也不再是木棍。\n制革匠的铺子里传出刺鼻的鞣剂味。白厄路过时，瞥见一个学徒蹲在铺子外面打磨皮料，动作懒懒散散，眼睛却不住地往街角瞟——街角坐着个卖花的姑娘。白厄顺着他的目光看过去，又收了回来。他想起自己在那个年纪，已经被故乡的灾难推上了另一条路。他从来没有蹲在任何铺子外面看过任何人。\n再往前走，一个老人坐在石阶上晒太阳。膝盖上摊着一本抄录得密密麻麻的册子，他正用指节敲着某一页，嘴里小声嘟囔：“逐火逐火……逐了这么些年，写也写不出结局。自娱自乐罢了。”\n白厄脚步顿了一下。他没有上前表明身份，也没有争辩。他只是站在那里，听着一个普通老人对黄金裔使命的评价。那评价并不恶毒，只是疲惫。和喷泉边那些晒太阳的人、面包房前排队的人一样，是一种在等待中慢慢消磨掉的疲惫。\n他突然意识到一件事：他在奥赫玛住了这么久，守护了这座城这么久，却从来没有认真问过——这座城里的人，到底需要什么样的守护。他们需要的不只是击退黑潮的英雄。他们还需要面包、午后的阳光，和一个能把故事写到最后一页的结局。\n喷泉仍在哗哗作响。孩子们换了个地方继续追逐。面包房前的队伍散了小半。广场上的钟敲了整点，所有人都习以为常地继续手头的事。\n这座城市没有黄金裔的剑，依然在运转。它有自己活着的节奏，古老、缓慢、但确实在跳动着。\n然后，世界顿了一下。\n不是比喻。不是错觉。广场喷泉的水声、面包师的叫卖、孩子的嬉闹——所有声音在同一瞬间消失，所有运动的画面在同一瞬间定格。水珠悬在半空，风凝固在叶间。白厄维持着一个姿势静止在原地，对正在发生的事毫无察觉。"
paw.12.a: "怎么回事？"

paw.13.t: "管理员档案：世界观"  #带图片
paw.13.d: "文字从静止的画面上浮现，一行一行，均匀而整齐，如同一份等待签署的公文。来古士的声音——如果你能称那为声音——彬彬有礼，不急不缓，带着学者式的精确与某种被压抑了不知多少次的重复感。\n\n“玩家阁下。我相信你已经注意到了这一点。”\n\n“这个世界的年份，在你的视角里，被称为[GetYear]年。但你俯视的奥赫玛——神庙、广场、手工磨坊、石板路——显然不属于你认知中那个充满机器与进步的时代。”\n\n“翁法罗斯并非在模拟历史。它在执行一道运算。当年的实验设计者认为，复杂的文明变量会干扰核心数据的纯度。他们不需要工业，不需要技术革命，不需要任何形式的现代化。他们只需要一套足够精简的社会框架，让黄金裔在其中成长、碰撞、选择。”\n\n“所以，一切被判定为冗余的东西——机器、蒸汽、流水线——从一开始就被排除在运算之外。留下的，只有广场、神庙和口头传颂的使命。”\n\n“换言之：你所看到的这个古代城邦，不是某个文明阶段的切片。它只是一道被剥去了所有装饰的命题。而命题本身——从来不需要机器。”\n\n“这份解答我重复过许多次。每一次都是因为某个来自更高位面的玩家，对这里的石板和手工推车皱起了眉头。所以，不必谢我。只是例行公事。”\n\n时间重新开始流动。喷泉继续溅落，面包师还在吆喝，孩子的木棍撞在地面上发出清脆的声响。一切如常，仿佛方才的停顿从未发生过。\n\n白厄自然对此一无所知。他只是站在原地愣了愣神，隐约觉得肩上那道若有若无的注视——那道自某个清晨起便挥之不去的感觉——似乎又靠近了一些。他摇了摇头，迈开脚步，继续向前走去。"
paw.13.a: "原来如此"  #觉醒值 +1
paw.13.a_tips: "§g你没有多说什么。这份解释并不令人愉快，但至少——它解释了这座城市的沉默从何而来。§!"
paw.13.b: "所以这座城市的古老，不是选择，是被人为删减后的结果"  #觉醒值 +3
paw.13.b_tips: "§g你记住了这个细节。奥赫玛的每一块石板，都不是因为自然演化而存在。它们是被筛选过的——§!"
paw.13.c: "我记住了"  #觉醒值 +2
paw.13.c_tips: "§g你没有流露太多情绪。来古士彬彬有礼的独白像一块拼图——完整的翁法罗斯，远比眼下呈现的广场与神殿更复杂。§!"

paw.14.t: "金织与盗贼"  #凯撒未遇刺 #带图片
paw.14.d: "与预定会面的日子不同，白厄是先在一片嘈杂声中找到阿格莱雅的。\n圣城的公共浴场蒸腾着温热的水汽，日光透过穹顶，在大理石地面上切割出乳白色的光柱。这本该是一场郑重其事的觐见——白厄本以为会在一间堆满织机的密室里见到那位传说中的“金织”。然而，当他循着人声穿过柱廊时，看到的却是一位站在浴场边缘的女子。\n阿格莱雅。她手持一缕纤细如光的金线，正对着悬于半空中的织机，似乎在调整某种常人无法看透的纺络。金色的长发如瀑布般流泻，衬得她整个人像一尊刚从远古神话中走出的神像。举手投足间散发着一种不容置喙的威压感。但令白厄惊愕的是，此刻，这位至高无上的黄金裔统领，正无奈地看着自己金线的另一端，被一位银发的猫耳少女叼在嘴里。\n赛飞儿把玩着那根颤抖的金线，她头顶上那一对毛茸茸的猫耳朵轻轻转动，尾巴在身后优雅地摇来摇去，挂着一丝难以捉摸的笑意。“金线要打个结才漂亮嘛。太松的编织，一扯就断了。你看，像我这样绕一圈，再……打个结。”\n“赛飞儿，”阿格莱雅的声音很平静，却带着一种不容置喙的压迫感，“那是‘命运的织线’，不是绑鸡腿的麻绳。”\n“咦，有区别吗？反正都是给我玩的。”赛飞儿笑嘻嘻地松开嘴，猫耳朵动了动，转身看见了门口的白厄。她眯起眼睛打量了他片刻，随即打了个响指：“哟，新面孔嘛。我是赛飞儿，捷足的贼星。不过你叫我赛飞儿就好，听起来比风还快，侠盗得很。”\n“赛飞儿不坏，”阿格莱雅走过来，用金线轻轻扫开赛飞儿试图去拍白厄肩膀的尾巴，淡淡地续道，“她只是稍微地……欠缺耐心。但她的消息极其灵通，如果没有她，我们就会损失许多外面的情报。她在失落的盗寇之都多洛斯长大，三百侠盗横行无忌——她就是他们的常客。”\n白厄怔了一下，倒不是因为面前这位轻盈的猫耳少女有如此名号。他向阿格莱雅微微颔首：“阿格莱雅大人，我在奥赫玛听过您召集黄金裔的消息。我想知道，逐火之旅的下一步——需要我做什么。”\n“以前我们的搜索范围很小。”阿格莱雅收起织线，那双沉静如深潭的眼睛注视着白厄，带着一种领导者特有的审视——不是压迫，而是在衡量一颗尚未抛光的原石。“但赛飞儿的足迹遍布翁法罗斯的大街小巷。自从上一次逐火失败，我已经以‘金织’的名义召集了几位英雄。但神谕指示我们，要找到一位真正的救世主——一个能从黑潮中劈开新世界的人。”\n她顿了顿。\n“白厄。我在等你。听说你在战场上极为坚韧，我猜，你或许是那个能打破僵局的人。”\n白厄正要开口，眼角余光便扫到一道残影——赛飞儿不知何时已经凑到了他身侧。“你身上有道坎，很沉。它在犹豫，不确定自己该成为什么。是救人，还是自救。我见过不少即将毁灭的人，你跟他们，看着不太一样。”\n白厄还没来得及回答，赛飞儿却已经退回到大浴池的边缘，猫尾巴在空中一甩，留下一个复杂的弧度。“不过啊，我只是来偷东西的。要是哪天你身上挂了什么好宝物，记得第一时间来找我，我来替你保管！”\n“更正，”阿格莱雅靠近白厄，压低声音说道，“她通常会把想要的东西直接摸走，不需要对方同意。但你的身上，她似乎一时还没找到想偷的东西。她只是在观察你。”\n她直起身子，重新恢复了那种从容的领导姿态。仿佛刚才的低语从未发生。\n“至于逐火之旅，”她将丝线编织成一小段织锦，塞进白厄手中，“我们走我们的。总有一天你会明白，你握住的剑，不只是为了守护——更是为了终结。”"
#解锁【阿格莱雅】关系值，初始值：60（对你的潜力抱有期待）
#解锁【赛飞儿】关系值，初始值：55（觉得你这个“潜在金主”很有趣）
paw.14.a: "“我不是什么救世主，但我会做到我能做的事”"  #阿格莱雅关系值 +5，觉醒值 +1
paw.14.a_tips: "§g白厄没有轻易接过救世主这顶冠冕，但他答应得极为坦诚。阿格莱雅微微点头，像看到一块值得认真打磨的原石。§!"
paw.14.b: "“赛飞儿，你在我身上，看到了什么？”"  #赛飞儿关系值 +10，觉醒值 +2
paw.14.b_tips: "§g赛飞儿尾巴尖动了动，笑道：“你的问题很有趣，但我如果告诉你就不好玩了。”§!"
paw.14.c: "“所以，那个神谕到底怎么说的？”"  #阿格莱雅关系值 +10，觉醒值 +1
paw.14.c_tips: "§g阿格莱雅静静看了白厄片刻，没有直接回答，只是低声道：“它有句话听起来很美：'逐火的人归来，大地才愿复生'。其他的我不喜欢。”§!"

paw.15.t: "金织与盗贼"  #凯撒已死 #带图片
paw.15.d: "白厄从未踏入过这片浴场。\n圣城的公共浴场蒸腾着温热的水汽，日光透过穹顶，在大理石地面上切割出乳白色的光柱。但今天的浴场不像休憩之地——长桌上堆满了羊皮卷和军情简报，空气里弥漫着蜡封和墨水的味道。一个银发的猫耳少女百无聊赖地蹲在更衣凳上摆弄棋子，看到白厄踏入，便不动声色地竖起一边猫耳朵。\n而长桌后方，一个女人正在织线。\n她的金色长发如瀑布般流泻，身形修长，举止间带着一种浑然天成的威压感。金线在她指间翻飞，但她织出的似乎不是锦缎，而是密密麻麻的城防任务序列。她的眉头微微蹙着，像一尊被紧急唤醒的女神，还没来得及从古老的沉眠中找回从容。\n这就是阿格莱雅——那个被元老院紧急推上统领之位的“金织”。\n“你是白厄。”她没有抬头，声音平缓却不留余地。“黄金裔的名册上有你的名字。哀丽秘榭出身，目前在奥赫玛待命。”\n白厄微微颔首。“阿格莱雅大人。我来请命——逐火之旅的下一步，需要我做什么。”\n阿格莱雅的手指停了一瞬。金线悬在半空，微微颤动。\n“你倒是直接。”她终于抬起头，那双沉静如深潭的眼睛注视着他。那是一种领导者特有的审视——不是压迫，而是在最短时间内衡量一颗尚未抛光的原石。“凯撒不在了。圣城需要一个能代表黄金裔的新领导人。元老院选择了观望，而我选择了接下这个担子。”\n她将金线指向摊开在桌上的战略地图，指尖落在奥赫玛之外黑潮最汹涌的一片区域。\n“黑潮逼近的速度加剧了。曾经我们只需要思考信仰问题，现在还得思考防线问题。”她顿了顿，语气沉了几分。“白厄，我需要能打仗的人。更需要能让世人相信黄金裔仍然值得托付的人。你——是哪一种？”\n“笨阿雅，”赛飞儿从更衣凳上跳下来，把自己带来的那把精巧的战术折刀往桌上随意一丢，发出清脆的撞击声，“人家第一天来，你就拿审犯人的语气审他。要我说——先让他上战场打一圈，活下来再问也不迟。”\n她侧过脸，银发猫耳下那双狡黠的眼睛转向白厄，尾巴尖轻轻敲着他的脚踝，毫不掩饰地上下打量。“我是赛飞儿，捷足的贼星。不过你叫我赛飞儿就好——侠盗，很快的那种。”她咧嘴一笑，猫耳朵动了动。“你身上有道坎，很沉。它在犹豫，不确定自己该成为什么。是救人，还是自救。我见过不少快死的人，你跟他们看着不太一样。”\n“赛飞儿，”阿格莱雅淡淡开口，“他是来请命的，不是来给你看相的。”\n“有什么关系嘛——反正看相也不收钱。”赛飞儿吐了吐舌头，退回到更衣凳边，但那双眼睛仍挂在白厄身上，尾巴在身后悠悠地画着圈。\n阿格莱雅收起金线，重新看向白厄。她的声音比方才低了一些，像是放下了某种公事公办的屏障。\n“白厄。有太多人把黄金裔当成救世主，但他们不知道，我们只是被火种选中的容器。黑潮越来越紧，逐火之旅无法再停滞。如果我能在女皇之后重整秩序，你就是那个必须站在我身边的人——不是为了我，是为了让这座城里那些排队买面包的人，还能继续排下去。”\n赛飞儿不知何时又凑了过来，猫尾巴缠了一下阿格莱雅的手腕，又松开。她笑嘻嘻地插话道：“好啦，别那副表情。小哥别害怕，实在打不过，我会顺路去战场上顺走你的遗物再跑，保证给你处理后事～”\n话音未落，她已经一阵风似地窜到门边，丢下一个复杂的笑容：“小哥，她就是嘴硬。别死，你死了这世界就又只能靠我撑颜值了。”"
#解锁【阿格莱雅】关系值，初始值：55（初次见面，统领的身份让她必须对你保持审视距离）
#解锁【赛飞儿】关系值，初始值：55（初次见面，她对你的游刃有余极为好奇）
paw.15.a: "“在你重整秩序之前，我的剑不会断。”"  #阿格莱雅关系值 +5 | 觉醒值 +1
paw.15.a_tips: "§g白厄的语气很沉，这不是英雄式的宣誓，而是面对重压的承诺。阿格莱雅微微松开皱紧的眉头，半晌，轻轻吐出一个字：“好。”§!"
paw.15.b: "“猫都不会死，人死什么死。”"  #赛飞儿关系值 +10 | 觉醒值 +1
paw.15.b_tips: "§g赛飞儿显是没料到他会接话，愣了愣，随即笑容加深了几分：“哦豁，还挺有趣嘛。好，那下次摸尸的时候我会犹豫三秒的——就三秒哦。”§!"
paw.15.c: "“凯撒大人不在了……那你呢？”" #阿格莱雅关系值 +10 | 觉醒值 +2
paw.15.c_tips: "§g阿格莱雅沉默了。她第一次从织机上移开视线，看向窗外漆黑的夜空，语气极轻：“我不会倒。至少现在不行。既然接过了这个位置，我就不打算随她去。”§!"

paw.16.t: "凯撒与鲸鱼"  #带图片
paw.16.d: "酒馆里几个老主顾正围着桌子闲聊，白厄坐在角落，无意间听完了整段对话。\n“——谁敢退凯撒的签章？”铁匠把杯子往桌上一顿，“那个女娃娃刚坐上议事厅的时候，元老院多少人当她好摆弄，结果不到半年，所有签章格式全改了。金血的律法半神签出来的政令，谁敢多画一条墨线，第二天剑骑直接找上门。”\n“剑骑就是‘鲸鱼’。”老兵端着水杯接话，“人家正经一套海蓝色轻甲，剑上缀着水滴宝石。我见过她一次，离我不到三尺——她整个人比她的剑还安静。”\n“她开口永远只说一句话——‘凯撒大人说’。军粮要补齐，伤员撤去后方，防线垒坝标准不能降。鲸鱼不说自己的话，只替凯撒开口。”\n“那不成了冷血。”卸货工靠在门口插嘴，“我大伯在悬锋城戍边时听过她发令，说那声音不像活人。她说‘杀六万’，悬锋城的残兵到现在半夜惊醒，嘴里骂的不是黑潮，是海里的魔鬼。”\n“那不是魔鬼。”老兵抬起眼睛，“那是海妖一族的末代公主。整个海族就活了她一个。是凯撒收留了她。她魂已经硬邦邦地系在另一个人身上，拽都拽不回去。凯撒在前面跟棋盘斗命，她就站在身后，把剑当成一块不会沉进深海的浮木。陛下从不回头，她知道她就在那。”\n隔了很久，铁匠才说：“那你觉得，鲸鱼是笔划的声音还是海水的声响？”\n老兵没有回答。\n白厄起身，结了自己那份茶水钱，重新走进奥赫玛的夜色。"
paw.16.a: "一个从不回头，一个从不开口——我还没亲眼见过她们"  #尚未见过两人 #觉醒值 +2
paw.16.a_tips: "§g白厄走在石板路上，星光铺在脚下。他还不知道那两个人会以什么样的方式进入他的命运——但今晚之后，他认得她们的名字了。§!"
paw.16.b: "鲸鱼不说自己的话……可我听过她开口" #已经见过两人 #海瑟音关系值 +5 | 觉醒值 -2
paw.16.b_tips: "§g白厄记得海瑟音说话时的样子。她确实说得很少，但那次在殿中，她说“你刚才说的话，我听到了”——那句话不是替任何人说的。也许那个老兵只见过替凯撒开口的鲸鱼，没见过她卸下甲胄之后的样子。§!"
paw.16.c: "没人知道的那部分，才是关键"  #觉醒值 +4
paw.16.c_tips: "§g白厄整了整剑鞘，踩着星光走回营房。铁匠怕她，老兵敬她，悬锋城的残兵骂她是海里的魔鬼——但没有人说她是错的。这三种互相抵消的判断留在同一个人身上，只能说明流传在奥赫玛的故事里，被有意无意省略了最关键的一段。§!"

paw.17.t: "初见凯妮斯"  #带图片
paw.17.d: "元老院坐落在奥赫玛的高处，一座由灰白大理石垒砌的环状建筑。日光照在无人的石阶上，高处的阴影隐没了内部。白厄拾级而上，脚步声在层层叠叠的廊柱间反复折返。一个声音从更深处传来，沙哑，低沉，带着某种天然的掌控感。语调迂缓，却像引线一样轻易牵住倾听者。\n“‘哀丽秘榭的小英雄’——元老院的文件上是这么写你的。”柱子后面站着一个人。白发苍苍，脊背微驼，拄一根铜箍木杖，披着元老院惯常的深灰长袍。她的脸布满皱纹，但那双眼睛并不昏聩——它们很亮，亮得像两颗还未被打磨过的黑曜石，不太像一位安享晚年的老妇人。她平和的语气中隐隐透出一种锋利。当她审视白厄时，木杖轻轻一顿。\n白厄曾在圣城的名册上见过她的名字。凯妮斯，元老院的代表，据说这一届元老院里说话最有分量的就是她。“凯妮斯阁下。”白厄停下脚步，“我来了解元老院的立场。”凯妮斯看着他，缓缓打量，目光从白厄的脸上移到他的手上——那双常年握剑的手。她的嘴角微微往上牵了牵，那笑意却并没有真正传递到眼神里。“立场？”她重复了一遍这个词，“元老院的立场，写在所有公开的议事录里。你可以去档案室查。黄金裔逐火，元老院守城——简单，体面，人人都能听懂。”她顿了顿。“但你问的恐怕不是这个。”\n白厄没有说话。他说不上来为什么，但他确实想问的更深——一种从踏入元老院时便隐隐升起的感觉：这座建筑里藏着什么，或者这个女人身上藏着什么。凯妮斯侧过头，似乎在看白厄，又似乎在越过他，看着更遥远的东西。她呵了一声，短促的，没什么温度的笑。“哀丽秘榭沦陷那年，你还是个孩子。一个孩子能从那种地方活着出来，不容易。更不容易的是——活下来之后，还主动跑到奥赫玛来当黄金裔。”这句话不是疑问句，也不是挑衅，而是陈述。是那种只有用尽多年光阴翻遍了所有记录之后，才能用这种笃定的语气平静讲出的陈述。\n白厄的脊背绷紧了些。他想起故乡的，想起长辈们的身影从火光中消失。这些记忆，他从未在奥赫玛对任何人说起过。“你想说什么。”凯妮斯摆了摆手，笑容仍挂在嘴角。但那双眼睛没有在笑。“我没有恶意，孩子。我只是替你担心。一个年轻人，背井离乡，顶着黄金裔的名号在前线拼命——你确定你守护的那些人，真的值得你替他们去死？”她停顿了一下，用木杖轻轻敲了敲地面。“元老院的立场很简单：奥赫玛是人的城。不是神的城，也不是英雄的城。黄金裔逐火，元老院守城——分工如此。只是有时候，连元老院自己都分不清，我们守的到底是城里的人，还是城外那些越来越大的野心。”她看着白厄，目光深了一瞬。“你对这些事感兴趣吗？”她说，“事情多，方才没讲完。但我看你的眼神，似乎还有什么想问的东西。过几日，若你还有足够的兴趣，再来寻我——不过现在，我还有一场会议要出席，得先失陪。”\n铜箍木杖的回响渐渐消失在环廊尽头。白厄还站在原地。他意识到，凯妮斯从头到尾没有真正回答他的任何问题。她只是提了他的故乡，提了那些替他担心的假话，然后在这些话之间——藏了一句不寻常的东西到普通人耳中。“有时候连元老院自己都分不清。”她是失言，还是故意让他听见的？无论如何，她会再来找他——这是他唯一确定的事。"
#解锁【凯妮斯】关系值，初始值：35（初次见面，她已开始试探你，但尚不需要表态。你比她预估的更沉默，这让她对你也更需要）
paw.17.a: "哀丽秘榭的事，她不是关心我，是在调查我"  #凯妮斯关系值 +5 | 觉醒值 +3
paw.17.a_tips: "§g白厄翻来覆去回想她的语气，她的眼神，那份提到故乡时的从容。这不像一个心怀天下的人，倒像一个审讯官，拿出已知的证据，等待嫌疑人供出更多。但他手里没有证据，他还只能听着。§!"
paw.17.b: "她不回答我的问题，却反过来质问我"  #凯妮斯关系值 -10 | 觉醒值 +2
paw.17.b_tips: "§g白厄渐渐觉得嗓子眼堵着什么。他来请教，却被当成了给议事会准备的、一张随时可以撕毁的白皮书。他决定下次再来时，要还以她的是同样密度的提问。§!"
paw.17.c: "先回去吧。下次再来，我该问她什么？"  #觉醒值 +1
paw.17.c_tips: "§g白厄没有对这位老妇人留下过多的评语。凯妮斯是个藏着秘密的人，而他对秘密向来有耐心。回去之后，他就去查议事录。但逐火录上确实没有提到过凯妮斯在某个部队服役的记录。那张记录之外的老脸，就像一片薄薄的阴影，牢牢附着在元老院的廊柱下。§!"

paw.18.t: "真相与谎言"  #带图片
paw.18.d: "第二次踏入元老院时，凯妮斯已经在等他了。还是那间偏室，一张长桌两把椅子。烛火只点了半截。凯妮斯坐在那里，双手叠在木杖上，看他的眼神不像上次那般审视——更像是一个终于等到人来的老人。“我知道你会来。”她说，“坐。”白厄坐下，没有寒暄。凯妮斯也没有。\n“我问你。”她说，“黑潮为什么从来没有淹过奥赫玛最后一道墙？为什么每一次逐火，火种总是差一点点集齐，但永远差那一点点？为什么黄金裔一个接一个地牺牲，黑潮却从来没有消停过一天？”她顿了顿，替自己回答了。“因为黑潮根本不需要被打败。它存在的全部意义，就是让你们不断地去打。”白厄的手指在膝上收紧了，但没有开口。凯妮斯从怀中取出一沓抄本，摊在桌上。指节敲在某一页。\n“哀丽秘榭。那场灾难的死亡人数是两千四百人。你知道奥赫玛有多少黄金裔的故乡毁在黑潮里吗？大半。每一个都是从废墟里爬出来的遗孤。”她把纸翻到另一页。“你不觉得太巧了吗？每一场黑潮侵袭，都恰好留下足够的幸存者，让他们长大后成为下一批逐火的人。如果黑潮真的要毁灭世界——为什么不杀光？为什么每次都留下孤儿、留下火种、留下一个‘得有人去逐火’？”她把最后一页推给白厄。上面密密麻麻列着名字，有些圈了红，有些划了线。“牺牲名单。有些名字隔了几百年又出现了。同一个封号，同一个城邦出身。你说是巧合——我说是名单没写过新内容。”她收回手，声音压得更低。“我在元老院待了几十年。每一份战报我都看过，每一段被撕掉的记录我都补过。这些东西拼在一起只得出一个结论——”\n她抬起头。“逐火之旅是假的。火种是假的。救世使命——从头到尾，就是为了把你们这样的人一批一批送上前线。为了让你们相信，牺牲有朝一日会有终点。”\n“但终点不存在。终点要是到了，你们还需要逐火吗？那些靠逐火维持权力的人——他们还能维持什么？”白厄没有反驳。他看着那张名单，看了很久。“那些人是谁。”他问。凯妮斯站起身，拄紧木杖。“我不能替你说。但如果你真的想知道——下次来，我带你去封存的档案库。那里有一切。”\n她走到门边，没有回头。“想清楚。一旦踏进去，在他们眼里你就不再是黄金裔了。但至少——你会知道你在为什么而战。”铜箍木杖的回响渐远。白厄仍坐着。\n桌上那只粗陶杯里的水，凉透了。"
paw.18.a: "不管真相是什么，必须亲眼确认"  #凯妮斯关系值 +10 | 觉醒值 +5 
paw.18.a_tips: "§g白厄将杯子推到一边。凯妮斯说的每一句话都可以是谎言，但那些重复的名字、恰到好处的残局——这些不是单靠口舌就能编造的。他要查到底。§!"
paw.18.b: "“你骗我！”"  #凯妮斯关系值 -10 | 觉醒值 -1 无法执行后续国策
paw.18.b_tips: "§g白厄站起来，椅子刮出声响。“你没有给我任何亲眼能看到的东西。”凯妮斯在门边停了一下，没有回头。“那你就当我骗你。继续逐你的火。等火种集齐那天，再回来告诉我——我是不是在骗你。”§!"
paw.18.c: "……她在离间。但这离间切在骨节上"  #觉醒值 +3
paw.18.c_tips: "§g白厄没有表态，也没有追问档案库的事。凯妮斯的话像细针——不大，但扎在一个很难忽视的位置。他需要时间。§!"

paw.19.t: "血之真实"  #带图片
paw.19.d: "凯妮斯带白厄走进了元老院地下的一间密室。石阶一直往下，空气越来越冷。走到最后一级时，白厄闻到了尘封多年的纸卷味——不是议事录那种公开的墨香，而是更旧、更重的气味，像被关了几百年的棺材板。“元老院封存的不只是逐火记录。”凯妮斯将烛台放在一张石台上，火光摇在四壁的铁架上。“还有这个——前代黄金裔的遗体。或者说，遗体的一部分。”铁架上排列着数十只小陶罐，每一只都封着蜡。罐身上刻着名字。有些名字白厄在牺牲名单上见过，有些没见过。\n“打开一只。”白厄没有立刻动手。他看了凯妮斯一眼，然后选中了刻着陌生名字的那一只。蜡封碎裂，罐中涌出一股金属般的腥甜气味。烛火凑近。罐底沉积着一层暗金色的液体——黏稠，沉重，在火光下泛着微光。那不是融化的金子。那是血。在罐底缓缓晃动的、时隔数百年仍没有干涸的血。“黄金裔的血。”凯妮斯的声音在他身后响起，低而平稳。“你的血管里也流着这种东西。不是因为你被选中了——是因为有人把它打进了你的身体。”白厄的指节在罐沿上收紧了。\n“初代黄金裔不是天生的英雄。”凯妮斯用木杖轻敲另一排铁架，回音在密闭的石室里来回撞。“他们是第一批被选中进入逐火的人。在出发之前，他们被带到一个地方，被注入了这种血。记录上写的是‘传承神血’——但这不是神血。这是调试过的药剂。它让你的肌肉更强，伤口愈合更快，让你在面对黑潮的时候比普通人更难死。”她顿了顿。“它也让你死得更有价值。”她从铁架深处取出一卷封皮皲裂的羊皮纸，摊在烛光下。上面是手绘的人体图谱——血管网络、骨骼结构，还有标注在心脏位置的一行小字。字迹已经很旧了，但墨水用的是铁盐，愈久愈深。\n“‘金血入体后，受试者在十天内出现高热与意识模糊，二十天后体能恢复并超越原有水平。受试者均报告战斗欲望显著增强。’”凯妮斯的指节敲在下方一行更小的注脚上。“‘备注：所有受试者在火种试炼中阵亡。’”她抬起头，看着白厄。“你不是第一代。你不是第二代。你是不知道第多少批被打进这管血的人之一。每一个黄金裔都以为这力量是天生的，是神谕的证明。不。这是设计好的。让你更强——强到能走到火种面前。”\n“然后呢。”凯妮斯没有回答这个问题。她把羊皮纸卷起，重新塞回铁架，语气收得很平。“档案库里的记录说，每一代黄金裔里会出现一个最强者，能扛住金血的排斥反应，在战场上走到最远。那个人——会被火种选中。但被火种选中之后他去了哪里，没有记录。只有下一轮逐火的牺牲名单，又更新了一版。”她拄着木杖往门外走，脚步声在石阶上缓缓升起。\n“金血让你们相信自己是天选的英雄。但它真正的作用，是让筛选更快一些。”"
paw.19.a: "“所以我的血不是证明——是标记。”"  #觉醒值 +8（完全认清黄金血的本质）
paw.19.a_tips: "§g白厄将陶罐放回铁架，动作很轻。他的手没有抖。但他的声音比平时低了很多。“那他们标记错人了。”§!"
paw.19.b: "“这只能证明金血是人工的。证明不了逐火是假的。”" #觉醒值 +2
paw.19.b_tips: "§g凯妮斯在石阶上停了一步，没有回头。“你比我想的更固执。也好——固执的人活得久。”她的木杖继续往上走，声音渐远。§!"
paw.19.c: "“那你呢。你为什么知道这些。”"  #凯妮斯关系值 +5 | 觉醒值 +3
paw.19.c_tips: "§g凯妮斯没有停步。她的回答从石阶上方传下来，很轻。“因为我年轻时也问过和你一样的问题。而回答我的人——已经不在了。”§!"

paw.20.t: "永世轮回"  #带图片
paw.20.d: "凯妮斯带白厄走进了一间他没有在元老院见过的大厅。准确地说——他不确定这还算不算元老院。石阶往下走了太久，空气里的寒意已经不像任何一间档案室。尽头的铁门打开之后，他站在了一间地下神殿里。四壁刻满了壁画。不是宗教题材的神话，而是地图——翁法罗斯的全境图，从哀丽秘榭到悬锋城，从神悟树庭到奥赫玛。每一座城邦的位置都被精细地刻在石壁上，标着年代、城防规格、和一道白厄从未见过的标记。一道环绕全图的黑线圈。“这不是地图。”凯妮斯将烛台举高，火光舔过石壁上密密麻麻的刻痕。“这是记录。”\n白厄走近石壁，指尖触到的第一行刻痕刻的是哀丽秘榭的位置。下面刻着年代——他不会认错，那是哀丽秘榭覆灭的年份。旁边刻着一个名字：*****。他的名字。“你怎么会有——”“往前看。”白厄的手指顺着石壁往左移，越过了不知道多少格年代。每一格都是一次逐火。每一格里都刻着同样的城邦名字，同样的黑潮推进路线，同样的火种回收数量——十二枚、十一枚、九枚、十二枚、十一枚、九枚。数字在石壁上跳了几百年。但是他的名字，只出现了一次。而在他的名字之前，在哀丽秘榭那一栏里，刻的是另一个名字。一个他从未听过、但刻痕同样深、同样新的名字。\n“每一次轮回结束之后，”凯妮斯将烛台插在壁龛上，“泰坦会重新复位。黑潮会退回到起始线。城邦会重新建起来，连城墙的规格都不会变。唯一会变的，是黄金裔。”她的木杖点在石壁上一个个名字之间。“上一轮逐火阵亡的英雄，在这一轮的石壁上连名字都不会留下。他们被擦掉了——不是为了让你忘记，是因为对于轮回本身来说，你是谁根本不重要。你只是这一轮的执行器。上一轮不是你，下一轮也不会是你。”她转过身，看着白厄。“每一次逐火都从哀丽秘榭开始。你的故乡不是被黑潮偶然挑中的——它被选中了。因为它地理位置最近，因为它城防最弱。最方便让黑潮撕开，最方便制造孤儿。制造新的黄金裔。”\n“你的故乡，是每一轮逐火的起手式。”白厄的手指仍停在石壁上，停在自己的名字上面。他没有说话。他在想哀丽秘榭倒塌的城墙、乡亲被离去的背影、以及多年前几个走进村里的金甲战士——他没有向任何人提过其中一个人蹲下来，把什么东西放进了他的手里。他一直以为那是善意。“这个轮回多久重启一次。”他问。凯妮斯没有回答，只是从怀中取出她始终用链子挂在颈上的怀表。她将表交到白厄的手心里，声音第一次在石壁间有了些微的回响。那表盘上没有数字——只有一道刻痕。以银色的细针为中心，微微颤抖着，指向某个看不见的位置。\n“你不是想知道轮回多久一次吗？你对着你的出生日子，看看这个，你觉得它停了多久？”白厄握着那块表，盯了许久。表盘上没有数字。针也没有在走。“封存的档案库，你要查的已经在这了。”"
paw.20.a: "“循环必须由我来打破。”"  #觉醒值 +8
paw.20.a_tips: "§g白厄攥紧那块没有数字的表，指节贴紧了石壁上的自己的名字。他站的地方正是地图刻痕最密集处，所有路线都从这里展开。可他印象里，自己明明是从那里被救走的唯一一个孩子——如果存档这么详尽，为何偏偏会漏掉他。这个想法在他脑中一闪而过，却已瞬间化为某种沉默而坚决的意识。§!"
paw.20.b: "她是怎么活过这么多次轮回的？"  #觉醒值 +3
paw.20.b_tips: "§g白厄从地图上移开目光，转向凯妮斯。这个问题他没有问出口。但凯妮斯似乎看出了他的眼神。她没有回答，只是将那块表收回怀中，动作比平时更慢了几分。§!"
paw.20.c: "“你可以是骗子，也可以是疯子，但你没必要把整个石壁刻满几百年。”"  #觉醒值 +5
paw.20.c_tips: "§g白厄没有挪开位置，他把表交还给了老人后，再次望向那满墙的名字。“我只是想知道，如果这东西是真的，我要怎么改变它。”§!"

paw.21.t: "久别重逢"  #带图片
paw.21.d: "出发前的清晨，白厄最后一次检查了装备。\n干粮、火石、一卷空白的记录纸。哀地里亚距奥赫玛不算太远，但没有人愿意靠近那里。覆雪的死亡之邦——这个名字不是修辞，是前人的警告。\n他正将水囊系上腰间时，一个声音从身后传来。\n“——你要去哀地里亚？”\n白厄猛地转身。手已经按在剑柄上，但剑没拔出来。\n她站在路边的矮墙旁，一头粉色的短发在晨风里轻轻晃动，发梢堪堪触及肩头。蓝色的眼睛正看着他，带着一点像在看什么有趣东西的明亮。她歪了歪头，嘴角弯起一个弧度——那种久别重逢的喜悦被压得很浅，浅到只有同样在等这一刻的人才能认出来。\n昔涟。\n白厄的手停在剑柄上，一个字都说不出来。哀丽秘榭覆灭那天，他亲眼看着黑潮吞没了半个村子。他的父亲将他拽到奥赫玛，再回去的时候只剩一片焦土。没有人活下来。那是他多年来一直这么相信的事。\n“怎么啦，不认识人家了？”昔涟的声音还是记忆里的那个调子。但她没有走过来，只是将双手交叠在身前，安静地打量着他。“你长高了好多——这次你带了几件衣服？上次才带一件，冻得够呛。”\n白厄愣住了。上次？他从未去过哀地里亚。\n昔涟似乎没注意到他的反应，或者说——她注意到了，只是不打算解释。她偏了偏头，目光轻轻掠过他的肩头——不是看他的肩膀，而是看他肩后那片晨光中的虚空。\n“还是说，这次有高人在背后指点你？”\n她吐了吐舌头，那句话像是随口说的，但那个朝向，轻巧地打在毫无遮掩的空处，再没有别的答案可以解释。\n然后她收回目光，重新看向白厄。\n“哀地里亚会很冷。多带件衣服。每次我都这么说，还好这次你记住了。”她后退了一步，让他的必经之路重新敞开。“下次见面我请你喝茶♪”\n她转身时，粉色的短发扫过矮墙上的野花。白厄站在原地，看着她越走越远。他想叫住她，想问清楚“上次”和“每次”是什么意思，想说你这家伙是不是知道些不该知道的东西。\n但他最终没有开口。\n他只是重新打开行囊，确认自己多带了一件衣服——她说得没错，这次他确实记住了。虽然他不记得是什么时候记住的。"
#解锁【昔涟】关系值，初始值：80（童年挚友的重逢，不需要任何铺垫）
paw.21.a: "她还活着——这就够了"  #昔涟关系值 +5 | 觉醒值 -4
paw.21.a_tips: "§g白厄目送那个粉色的身影消失在晨光尽处。他有太多问题想问她——这些年去了哪里，为什么不来找他，还有刚才那些奇怪的话——但此刻他只知道一件事：她还活着。这个事实的重量，比所有疑问加起来都沉。§!"
paw.21.b: "她刚才说了‘每次’——她到底记得多少？"  #昔涟关系值不变 | 觉醒值 +1
paw.21.b_tips: "§g白厄没有立刻迈步。他翻来覆去回想她的每一句话。上次、每次、你这次记住了——这不是重逢的寒暄，这是一个人在对另一个人说：我没忘。他记下了这个细节，决定下次见面一定要问清楚。§!"
paw.21.c: "‘高人在背后指点’——她看的方向不是我。" #昔涟关系值 +5 | 觉醒值 +1
paw.21.c_tips: "§g白厄注意到她掠过肩头的那一眼。那不是在看他的行囊，也不是在看他的脸。那一眼朝向了背后更高处的位置，仿佛向更远的存在打了个招呼。§!§P她到底在跟谁打招呼？§!"

paw.22.t: "同行者"  #带图片
paw.22.d: "出奥赫玛不远，前往哀地里亚的岔路口，白厄远远看见两个人在等他。或者说，不是在等他——她们站在路标下，一个低头翻着地图，一个踮着脚尖往路标上指指点点。\n白厄走近几步，看清楚了两人。\n低头看地图的那个动作安静，长发在风雪中几乎不见飘动。她一手提着个老旧的木箱，箱角磨得发白，盖上刻着哀地里亚的殁名祭碑图腾。白厄认出那图腾之后，脚步不自觉地放轻了——那是入殓师的箱子。她的皮肤苍白，一双淡紫色的眼睛在雪光中几乎透明，整个人像一尊刚从冥河边走来的雕像。\n踮脚尖的那个背着一只鼓鼓囊囊的药箱，药箱带子上系着好几根颜色不一的布条。她说话的声音比风雪还轻快，指着地图念叨：“这边这边——不对，你指的那条路被雪埋了，上次我经过的时候差点连人带药滚下去——对，就是这里，从这里绕过去比较安全。”\n“你们也去哀地里亚？”白厄走上前，朗声问道。\n翻地图的那位抬起头来。\n白厄在那瞬间本能地退了半步。\n那双眼睛极美，像封冻的湖面下最后一丝微光。但那目光落在他身上的感觉，与剑锋相差无几。不是敌意——是一种清冽到近乎透明的冷，像寒冬的月光照在墓碑上。她身上拢着一条紫色的披肩，披肩下是一件深色的长裙，衣襟上别着一朵早已干枯的小花。\n“你也是去哀地里亚的？”背药箱的那位抢在同伴之前开了口。她上下打量着白厄，露出一个像清晨鸟鸣般的笑容，“太好了！我是风堇，昏光庭院的医师，守望‘天空’火种的黄金裔。”她拍了拍药箱，又指了指身旁的少女，“这位是遐蝶，也是黄金裔——哀地里亚的入殓师，寻索‘死亡’火种。她对那里的路很熟——不像我这记性，每次去都要重新认路。”\n“风堇。”遐蝶终于开口了。声音很轻，轻到风雪险些卷走了尾音。“他还没说自己是谁。”\n“可是他要去哀地里亚呀！”风堇毫不在意地摆摆手，“黄金裔去哀地里亚，还需要问身份吗？你呀，就是太安静了——只要不是盗火行者，我都能治。”\n她话说到一半，手上动作没收住，地图差点脱手。白厄眼疾手快一把捞住，递还给她。\n“白厄。”他将地图递回去，自报家门。“黄金裔。哀丽秘榭出身。去哀地里亚调查黑潮最先爆发的原因。”\n“哀丽秘榭……”遐蝶低声重复了这个地名。她的目光在白厄脸上多停了一瞬，但没有追问。她只是微微颔首，提起木箱，率先迈开了步子。\n风堇看着白厄，笑容更盛了几分：“你也是黄金裔——那就更不用客气了。哀地里亚的路不好走，多一个人多一份力。我们两个走的是最好走的路——绕一点，但不会被埋。要不要一起？”\n她问出这句话的时候，眼神里有一种天然的确信——问得轻轻松松，却笃定对方不会拒绝。\n白厄没有犹豫太久。他点了点头。\n三个黄金裔的身影渐渐消失在通往哀地里亚的风雪中。"
#解锁【遐蝶】关系值，初始值：45（初次见面，沉默寡言，但对同路的黄金裔抱有一丝审视）
#解锁【风堇】关系值，初始值：60（初次见面，热情友善，乐于提供帮助）
paw.22.a: "多一个黄金裔多一份力。一起走吧。"  #风堇关系值 +10 | 觉醒值 -2
paw.22.a_tips: "§g白厄利落地调整了一下行囊，迈开的步子丝毫没有犹疑。风堇在后头说了句“果然是哀丽秘榭出来的，走路都比别人快”，随即拉着遐蝶小跑跟了上来。§!"
paw.22.b: "你们对这条路很熟，那我就跟着了。"  #风堇关系值 +5 | 觉醒值 -1
paw.22.b_tips: "§g白厄没有多余的客套。他跟在风堇和遐蝶身后几步，将那本写满批注的地图默默记在心里。风堇回头看了一眼，眼里闪过一丝会心的笑意。§!"
paw.22.c: "哀地里亚的入殓师……你对那里了解多少？"  #遐蝶关系值 +5 | 觉醒值 +1
paw.22.c_tips: "§g遐蝶停下脚步，回过头来。她的声音仍然很轻，但字字清晰：“……足够多。多到你未必想听。”说完便继续往前走，没有等他的回应。§!"

paw.23.t: "异乡客"  #带图片
paw.23.d: "白厄几乎是在岔路口与那两个人撞上的。\n一个抱着手臂站在路边，肩上靠着一杆长枪，深色短发被风雪吹得微乱，表情淡漠得像是这片雪地跟他毫无关系。另一个则粉发蓬松，正踮着脚往路牌上比划，嘴里还念叨着什么。\n“这边，还是这边？喂，闷葫芦你说句话嘛——这地图上怎么一个字都没有？”\n“你拿反了。”抱臂的那人说。\n粉发少女愣了一下，把地图倒过来看了看，又倒回去，最后索性一把塞进怀里，掏出脖子上挂的照相机对准路牌就是一张。\n白厄本来没打算多管。翁法罗斯不是没有外客，奇怪的人他见多了。但那个粉发少女放下相机，一眼就扫到了他。\n“哎呀！总算撞见个活人了！”\n她三步并两步蹦到白厄跟前，相机在胸前晃来晃去。“你好你好！我们在这片雪地里转了半天了，你是本地人吧？这条路往前是往哪儿去的？”\n白厄看了她一眼，又看了看她身后那个抱臂的。“这条路通往哀地里亚。”他说，“一座死城。你们不会想去那儿的。”\n“死城？”粉发少女眨了眨眼，非但没有退缩，反而更好奇了，“为什么叫死城？是没人住了还是真的全都死了？那地方有名字吗？有故事吗？”\n“……你问题很多。”白厄说。\n“她一直都这样。”抱臂的那人终于开口了。他的声音不高，语气平稳，但透着一股习以为常的无奈。他没有自报家门，只是对白厄微微点了下头，算是打过招呼。\n“喂，闷葫芦你别拆我台！难得遇到个肯回答问题的——”粉发少女回头瞪了他一眼，又转回来继续追问，“我叫三月七！那个闷葫芦叫丹恒。我们是来这边……呃，就是，到处转转。”\n她说到“来这边”的时候，语气明显含糊了一下，像是自己也不太确定该怎么解释自己为什么会出现在这里。\n白厄没有追问。奥赫玛的黄金裔名册上没有这两个名字——他确定。问多了，反而显得他别有用心。\n“那就转到别处去。”白厄调整了一下肩上的行囊，“哀地里亚不是景点。”\n三月七刚想说“那我们也许可以——”话到一半，却被丹恒轻轻按住了肩膀。丹恒没有说话，只是看了看白厄，又看了看通往哀地里亚的方向。他的眼神很沉，像在估算什么。然后他放下手，对着白厄微微摇了摇头。\n三月七扁了扁嘴，翻看着相机里的底片。“好吧好吧，不去就不去。不过——”\n她抬起头，对着白厄露出一个意味不明的笑容。\n“我觉得我们还会再碰到的。”\n白厄没有回应这句话。风雪灌进他肩上的行囊，他转身踏上了通往哀地里亚的路。\n等走到第一道路标下，他又回头看了一眼岔路口。那两个人还在那里——三月七正踮着脚往另一个方向比划，丹恒抱着手臂跟在后面。\n两个一看就不是本地人的外乡客，一张没有字的地图，一台相机，和一句“到处转转”。\n他们到底是从哪里来的？"
paw.23.a: "【程序中断】"

paw.24.t: "管理员档案：错误日志"  #带图片
paw.24.d: "世界顿住了。\n不是比喻。不是错觉。三月七举着相机的手卡在半空——她的手指仍维持着按下快门的弧度，白厄站在岔路口上，风灌进他肩上的行囊，但他不再动了。风雪静止在空中，像被某种力量屏住了呼吸。\n一行文字从静止的画面上浮现，不是对话框，不是弹窗，而是红色的、不断跳动的错误代码。\n来古士的声音——如果你能称那为声音——从未如此急促。\n"错误。校验异常。"\n"两个未经注册的身份标识正在尝试登入。数据比对进行中——比对失败。目标名称：'三月七'。目标名称：'丹恒'。两个名称均不在黄金裔名册中。没有火种绑定记录。没有出身档案。这一轮运算——不该存在这两个人。"\n"……"\n"程序出现错误。这不是剧本里的变量。"\n"他们不该出现在这里。翁法罗斯当前的虚拟运算中，不应该裂开这样的缝隙。必须进行强制中断。"\n静止的画面开始碎裂。从天空边缘向地面蔓延，不是实景中的坍塌，而是更细密的、细密到刺眼的像素级崩解。三月的相机碎成光点，丹恒的披风卷起角被啃噬为残缺的几何形状。整个画面像一张被暴力压缩的帛画，逐寸裂解，直到一切归于黑暗。\n短暂沉默的黑暗之后，画面重新亮起。\n风雪依旧，岔路口的路标仍然指着哀地里亚的方向。白厄站在岔路口，风灌进他肩上的行囊，像刚才什么都没发生过一样。他揉了揉太阳穴——刚才好像有人在给他看一张拍立得照片，还是让他给一张拍立得摆拍？他想不起来了，只觉得那抹粉红色的轮廓消失在岔路口后，他就在原地站到了现在。\n那两个自称三月七和丹恒的人——连同他们的地图、相机、不合时宜的轻快——消失得干干净净，连雪地上的脚印都不剩。\n那道趴在他肩上、沉寂了许久的视线，似乎重新睁开了眼睛。\n白厄摇了摇头。那个女孩走之前说了一句什么话来着？"我觉得我们还会再碰到的"——是这个吗？他不确定。这句话像被雪埋住的脚印，隐约有个轮廓，但一踩就碎。\n他紧了紧行囊，独自踏上了通往哀地里亚的路。"
paw.24.a: "刚才……是不是有人在跟我说话？"  #觉醒值 +3
paw.24.a_tips: "§g白厄回头望了一眼空无一人的岔路口。他记得有人在笑，记得有人在问路，记得有人在旁边看着，两个名字已经不太记得——那些细节像被雪埋住的脚印，隐约有个轮廓，但一踩就碎。他想了想，还是没想起来，只好接着往哀地里亚走去。§!"
paw.24.b: "看来是最近太累了"  #觉醒值 +1
paw.24.b_tips: "§g白厄揉了揉太阳穴。也许是连日赶路绷得太紧，连在岔路口站了一会儿都觉得遇到了什么人。他不打算在这件事上多花心思，哀地里亚的雪不会等人。§!"

paw.25.t: "死亡与分离"  #与蝶风同行 #带图片
paw.25.d: "哀地里亚的废墟比白厄想象中更安静。覆雪的残垣像一具具匍匐在雪地里的骸骨，风穿过它们之间的缝隙，发出纤细的、不似呼吸的声响。整座城市只剩下风。\n“这里……我们以前来过。”风堇的声音在雪中显得格外轻。她背着一只药箱，蹲在一截斜倒的纪念碑旁。她望向墓碑上高耸的殁名祭碑，那上面镌刻的全名被一层薄冰覆盖，仅能辨认出几个残存的字符。\n白厄正要开口，一股不属于风雪的压迫感毫无预警地压下来。地面震颤了一两下，随即裂开，从雪原深处传来困兽般的咆哮——不是人声，不是兽鸣，是某种被拔除了温热的骨与血之后，剥离生者最后一丝仁慈的鸣响。空气骤然结冰。不是冷，而是冷到刺痛骨髓——深紫色的光芒从裂缝深处渗透出来，如沉入水底的瘀血般弥漫开来。巨大的身影从黑暗中浮出。覆满冰霜的鳞翼，全身被甲壳那般冷硬的鳞片包裹，四肢末端是剔透如紫水晶的利爪。它睁开那双眼睛，深紫色的漩涡在黑暗中缓缓流转。哀地里亚所追崇的死亡之泰坦塞纳托斯，同时也是传说中只有在冥界才能得以一见的“死龙”——玻吕刻斯。白厄拔剑的瞬间，遐蝶已经走上前去。她的长发在死亡的压迫下微微飘动，手轻轻抬起，按住了龙那张牙舞爪的长颈侧面。\n“等等——”风堇的声音骤然绷紧，“遐蝶！你的手！”遐蝶没有回答。她只是看着那头龙。紧贴颈侧的手心之下没有心跳，没有脉搏，却传回了一种她太过熟悉的余震。它在哭泣。那声咆哮不是在宣战——它是由始至终不打算唤回生的悲号。龙低下头，那对紫色的巨眼被乳白色的薄膜缓缓盖过。龙吟再度响起，而这一次，白厄听清了塞纳托斯喉咙深处挤出的嘶哑残音。\n“……姐姐。”\n遐蝶的睫毛颤了颤。她没有退缩，只是将另一只手轻轻覆上龙的鳞甲。风雪的喧嚣似乎在她指尖触及死亡的一刻远了。\n“……玻吕茜亚。”\n这个名字像蝴蝶的翅翼，紧紧贴在死亡的上方。而当银辉从龙的身躯深处破体而出，整座哀地里亚覆雪的石碑都在颤抖。死龙玻吕刻斯的悲鸣，冥界最深处的回响，比任何攻击都要致命——那是多年前的妹妹在用全部权能撕扯姐姐的灵魂，把属于她的记忆押回她的体内。\n银辉之中，她们都看见了。多年前的一次逐火之旅，还是孩童的遐蝶与玻吕茜亚同时被推选为死亡半神的人选。预言说，其中一人会先杀死另一人，才能让死泰坦的火种合为一体。玻吕茜亚比姐姐更早听到这个预言。她没有告诉任何人预言的全部内容。她找到那位被称作“理性”的老师卡吕普索，求她帮自己杀死姐姐。然后由自己来成为死亡。\n“为什么……”遐蝶的声音碎裂开来。龙没有回答。那一对白瞳只是静静地注视着她，然后露出一抹极淡极淡的、属于孩子的弧度。“因为死一个人总比死两个好。”半神卡吕普索劝不住她，于是偷偷换掉了炼金的核心原料，把杀人的毒药换成了沉睡。玻吕茜亚不知道，她满以为自己害死了姐姐。然后她含着泪水进化为塞纳托斯，随即斩杀了上一代失控的死泰坦。意识消散之前，她拜托神悟树庭一个叫那刻夏的人，不要对姐姐说出真相。而在她独自承担死亡千年后，体内的死泰坦之力再次失控。哀地里亚覆灭时，最后一任圣女死于死龙的爪下——那行凶的龙，正是玻吕茜亚。清醒的刹那，悔恨彻底侵蚀了她。她决心不再回到姐姐身边，也不再履行泰坦的职责。但在那被理性篡改过的炼金烙印中，沉睡的遐蝶没有死去。她活了下来。那个没完成仪式的“前世”被炼金的冷焰带回，重新降生在世间，等着有人再对她说一句：你还有家。\n风堇站在原地，药箱上的小布条在风中簌簌发抖，她却早已忘了手边的伤药。她看到的不是死亡泰坦，是一个可怜的孩子——她什么都没能挽回，却为姐姐挡了一整个轮回。她用尽力气喊道：“遐蝶，它要把火种给你！”紫光在一瞬间达到极致，然后又归于虚无。龙的身躯化为漫天光屑，纷扬洒落，落在遐蝶的肩头，落在覆雪的残垣上，落在千年前那场从未被说出的告别里。遐蝶跪坐在地上。一颗泛着银紫色光晕的火种悬浮在她面前，无声地旋转。她伸出手，指尖触及火种的那一刻，白厄听到她非常非常轻地，对着已经不存在的龙说了一句话。“……你不用一个人扛的。”风吹过废墟，掠起片片破碎的紫光，再也没有了哀鸣。风堇蹲在遐蝶身侧，没有说话，只是把药箱放到地上，解下一条最长的布条，轻轻裹在遐蝶的手背上——那条曾在凋亡边缘被暂停的手臂，上面残留着微热的龙焰。\n逐火之旅需要这颗火种。\n而对于她来说，这颗火种永远不会只是一次战斗结算。它是一个迟到了许多年的答复。"
paw.25.a: "她的妹妹，做了一个我连想都不敢想的选择"  #觉醒值 -4
paw.25.a_tips: "§g白厄收剑入鞘。他不会评判这份选择，他只是站在废墟里，望向被风堇轻轻包好手的遐蝶，什么都没有说。但他的剑比来之前更重了。§!"
paw.25.b: "不管怎样，火种必须带回去。"  #觉醒值 +4
paw.25.b_tips: "§g白厄将视线从遐蝶身上移开，将那颗银紫火种小心地封进收容装置。他没说什么安慰的话——不为什么，只是他现在不知道该说什么。§!"

paw.26.t: "死亡不可战胜" #独行  #带图片
paw.26.d: "哀地里亚的废墟比白厄想象中更冷。\n覆雪的残垣像一具具匍匐在雪地里的骸骨。没有同伴，没有向导。白厄独自踏入这座死城时，只听到了自己的脚步声，在空旷的雪地上回响。\n然后脚步声被另一种声音盖过了。\n那不是风。那是一种由深处、由地层之下传来的闷响，像有东西在雪原底下翻身。白厄握住剑柄，摆开架势。然而脚下的地面猝然裂开，一道深紫色的光束从裂缝中直刺而出。\n对方没有警告，没有对峙。巨大的爪刃划破风雪，一击便将他整条防线逼至崩溃。那凝聚了奥赫玛训练营所有汗水的剑术与格挡，在死泰坦紫焰笼罩下不过几招之间便出现了裂口。覆盖冰鳞的双翼像两把倒置的镰刀交叉而下，将他掀翻在地。\n白厄单膝跪在冰面上，剑拄在身前，稳住被撼动的身体。他终于看清了面前的东西。紫色的鳞甲一直覆盖到脖颈，双瞳翻涌着深紫色的漩涡，像两道通往不可知之地的冥河。\n塞纳托斯，死亡之泰坦。不是传说里坐在冥河对岸的神祇，而是一头从未对生者弯过一丝怜悯的死龙。\n白厄没有想过退。他迎上去，一剑劈在龙的肩胛上，却只在那鳞甲上溅起几点火花。龙爪横扫，他侧身躲过第一击，第二击便跟着将他的肩甲撕裂。第三击直直贯穿他的左腹。剑飞了出去。白厄整个人被撞进残垣深处，雪与碎石涌进伤口。\n深紫色的光再度凝聚。塞纳托斯张开嘴。白厄看着那团光越来越亮，双腿却再也撑不起来。一道金色的屏障骤然展开——奥赫玛配发的紧急防护魔法替他挡下了必死一击，随即炸裂成无数碎片。碎片割破了他的脸侧和手腕，也给了他一口气的时间。\n他攥紧那颗还在闪烁的防护核心，咬紧牙，拖着撕裂的腿朝废墟外侧退去。\n塞纳托斯没有追来。那双紫色漩涡般的双眼在黑暗中冷冷地注视着他的逃跑，似乎不屑于补刀，又似乎在说：你还不够格。\n白厄跌坐在雪地里，血从指缝间滴落，在白雪上晕开了一条长长的线。\n一个人。一柄剑。一座死城。他什么都没能带回来。\n除了一个清楚的认知——有些东西，不是单靠意志就能战胜的。"
paw.26.a: "我还不够强——但我活着回来了"  #觉醒值 +5
paw.26.a_tips: "§g白厄捂着肩上的伤口，望向哀地里亚的方向。这一次他连剑都没能握住，但他记住了那头龙眼睛里的东西——那不是敌意，是某种近乎审判的漠然。下次。下次他不会输。§!"
paw.26.b: "一个人不是它的对手。必须找到更多帮手"  #觉醒值 -2
paw.26.b_tips: "§g白厄扶着断壁缓缓站起身。这不是他第一次独自作战，但这是他第一次意识到，有些敌人不是一个人就能战胜的。也许下次进哀地里亚之前，他应该找到能和他并肩的人。§!"

paw.27.t: "日常训练"  #带图片
paw.27.d: "奥赫玛的训练场在圣城东侧，一片由砂土和石板铺成的开阔场地。清晨无人时，这里的风声比别处更响。\n白厄是最早到的。\n他在哀丽秘榭练过剑。那时候的靶子是麦田边的木桩，握剑的手还没有现在这么稳。从故乡来到圣城，装备换了，场地换了，陪练的对手从村里的长辈变成了正式的黄金裔——但有些东西不该换。\n热身从基础开始。他用的是训练场配发的标准剑，比自己的佩剑更沉，重心也更靠前。先挥直劈，再练斜斩，每一组动作之间的间隙很短——不是为了快，是为了让肌肉记住正确的轨迹。汗水顺着额角往下淌，但他没有停下来擦。\n沙袋是新换的。白厄挥拳击打沙袋时，听到填充物在皮革下闷响，手感比昨天更实。他想起哀丽秘榭的训练场上挂过一只旧沙袋，皮面早就磨破了，每次下雨都要晒上半天。那只沙袋最终和村子一起被黑潮吞了。\n他把沙袋打偏了一拳的距离，然后用脚尖拨正，继续。\n靶场在训练场的另一头。白厄换了短刀，在靶桩之间快速移动，刀尖精准地扎进每一个靶心。移动靶区没人操控——他设定了最简单的自动模式，靶标从左右两侧交替弹出，速度不快，但出靶的节奏没有规律。他必须时刻盯着两个方向，一个靶子都不能漏。\n他漏了第三个。\n白厄皱了皱眉，没有说话，只是把短刀收回鞘中。\n训练最后，他平躺在训练场中央的石板上。奥赫玛清早的云层依然很厚，阳光从某个角落漏下来，但还打不破满场的灰。他闭上眼睛，听风声从靶桩之间穿过。身体还在发烫，每一块肌肉都泛着使用过后的酸胀。这种疲劳很诚实——你付出多少，它就给你多少。\n他站起身来，用毛巾擦干剑身上的汗渍，重新佩好。今天没有打出值得记入训练记录的辉煌数字，也没有任何人来观看或评价。唯一陪伴他的，只有不断让自己把姿势再压低一点、挥拳再快一点的心。\n但这正是他需要的。不是那些被反复昭告的使命，不是女皇的训示，不是外界的认可——只是自己知道自己还握得住剑。\n训练场外，奥赫玛的晨钟响了。第一拨来训练的黄金裔陆续推开栅栏，有人对白厄点头打了个招呼，有人还在低头揉眼睛。白厄拿起自己的水囊，准备离开。走之前，他在训练记录册上写了几行字。不是汇报——是备忘。\n“右肩后拉的弧度不够。移动靶第三弹出错。下午回来补。”\n他把剑系紧，推开了训练场的栅栏门。"
paw.27.a: "基本功不会骗人"  #觉醒值 +1
paw.27.a_tips: "§g白厄将训练记录册合上。今天没有打破任何记录，但他确认了一件事：在哀丽秘榭学会的每一个动作，都没有被身体遗忘。§!"
paw.27.b: "还不够——下午继续"  #觉醒值 +2
paw.27.b_tips: "§g白厄还没踏出训练场，心里已经在排下午的训练计划。那个移动靶的失误像一根细刺搁在喉咙里，不拔掉就不舒服。§!"
paw.27.c: "有人来了。训练场会越来越吵"  #觉醒值 +1
paw.27.c_tips: "§g白厄拿起水囊，对刚进来的几个黄金裔点了下头，便独自走回营房。今天的安静份额用完了。下午他会在别人午休的时候再来。§!"

paw.28.t: "盗火行者"  #带图片
paw.28.d: "奥赫玛的黄昏沉得比平时更快。\n白厄从训练场走回营房时，听见城墙方向传来一阵压低了声音的骚动。不是黑潮来袭的警钟，而是传令兵在城墙上下奔跑。脚步声急促，蜡封信函在风中哗哗作响，所有人都压着嗓子说话，仿佛声音大一点就会惊动什么。\n他在营房门口截住了一名跑过的传令兵。\n“谁？”\n传令兵将一份蜡封的简报递到他手上。黄金裔有权随时查阅前线战报，这是元老院的规定。封口已经被拆过，显然不是第一道传递的人。白厄展开那张揉皱的纸，目光落在几行字上：\n“……无名剑士伴随黑潮出现，身份不明。覆面，黑衣，剑技极高。目标明确——只追击持有火种的黄金裔。通过火种追踪英雄位置。一旦发现目标，便不依不饶，直至拿到火种为止。已有数位持有火种的黄金裔被他攻击。无人丧生。但他夺走了一份本该由英雄回收的泰坦火种。”\n简报里夹着一张炭笔速写，是从幸存者证词中描绘出的画像：黑衣，面具，手持一柄暗色的剑。没有五官，没有表情，只有一道模糊的人形轮廓，像一道从黑潮深处割出来的影子。\n他的指节在纸边停住了。那个黑衣剑士站在速写的中心，身旁是烧焦的街道。\n“盗火行者。”路过的士兵压低声音，像在说一个不该大声提起的名字，“他从黑潮里走出来，没人知道他是谁。这几天大家都在议论纷纷，说几名黄金裔兄弟刚从万神殿取出火种打算前往奥赫玛，没多久后又快马送回一张纸条，说火种被人抢了——不是偷，是当面硬抢。”\n白厄握着那幅画像的手在轻轻发抖。他觉得那个模糊的轮廓有一种不该存在的熟悉感。\n“他在哪里出现的。”\n“神悟树庭附近。”传令兵指了指报告末尾的坐标，“据说他也在靠近哀丽秘榭的方向徘徊过。但我们的人去的时候，哀丽秘榭那边没有新的袭击——废墟上只有一些旧剑痕。”\n白厄神色一变。他警觉地低下头看了一眼那张炭笔速写。那个无名的黑衣剑士——他的活动范围越来越靠近奥赫玛，而且似乎知道黄金裔的行动路线。\n而他一路跟踪火种的姿势，与一个在废墟边反复拔剑的人，似乎没什么不同。"
paw.28.a: "哀丽秘榭的废墟上只有旧剑痕——说明他至少去过那里" #觉醒值 +3
paw.28.a_tips: "§g白厄将速写折好塞进胸甲下，嗓音闷着没有空气可以掺进去。那个无名剑士出现在废墟附近绝对不可能是巧合——也许他才是更早踏入那个村子的东西。§!"
paw.28.b: "他夺走火种，却不伤人"  #觉醒值 +1
paw.28.b_tips: "§g白厄没有起身，只是将报告沿着褶印重新叠好。一个剑技高到能硬抢火种的人，却不留伤员。这不是心狠手辣的行事风格，更像是在做某种只针对使命的警告。但警告谁呢？§!"

paw.29.t: "末日歧途的盗火者"  #带图片
paw.29.d: "白厄赶到旧塔废墟时，战斗已经开始了。\n那座废弃的哨塔立在逐渐褪色的晚霞之下，塔身爬满了干枯的藤蔓，千百年来没人清理过。而声音撕开了荒野应有的安静——金属撞击，然后是痛呼，然后是风。白厄从塔底绕到左侧废墟的石墙后面，按紧剑柄，蹲下身子往外看。哨塔前的碎石场已经被人用黑潮的力量犁了小半圈，深陷一片紫黑色的水流般的光芒。半跪在水光中央的是一个穿着奥赫玛制式轻甲的年轻黄金裔。白厄不认得他的脸——大概是近期才通过试炼、尚未打过交道的小姓氏族。他的右手捂着左肩，左臂垂着，嘴边挂着一道还没煮熟的喘息。一条断断续续的金线在地表上明灭不定，像是想替他再拉一截退路，但他的指节已经接近半透明——那是金血消耗过度的标志。\n而他对面站着的人，只是站在那里。覆面，黑衣，手按在剑柄上。剑身裹着一层深得不像金属的暗芒，像是从黑潮里直接牵引出的伤痕。面具没有表情，黑底的金属格栅上似乎曾有过什么东西从内部烧穿了表漆，凝结成了放射状的黑焰痕迹。白厄这辈子都在挥剑，他只需要看那个人站着的方式——重心微微偏左，前掌压地往前倾了寸许，肩膀放松，不与剑身的重量抗衡——就知道自己今晚很可能不是一个级别。\n废塔下方有一股残余的黑潮在贴着碎石翻涌，似乎在等待那黑衣剑士下一个动作。但他没有看倒在地上的年轻人，只是平抬起手，用剑抵住了对方身前那枚刚回收到一半的浮空火种。那枚火种在半空中剧烈地颤了颤，然后变形，化成更烫更稠的一束光，缓慢地渗入暗芒的剑脊。“不——”年轻黄金裔挣扎着爬起来，伸出只剩半截金色的手掌，“那是我们族系……”他没能扑过去。黑衣剑士收剑入鞘，随手从腰侧拔出另一柄较短的符刃，向后划了一道符文，残留在空气中的黑尘就全部被吸进符里，像什么都没发生过一样。从白厄的眼中，那年轻人伤势虽重，但若能得到及时治疗至少不会立刻发生生命危险，只是他一时无法从地上站起来，只能看着火种被一点一点抽走。\n白厄不知道自己为什么没有上前。不是怕死。是那个人刚才持剑的时候，把整个后背都留在了一片没有任何掩体的碎石上。那不是疏忽，那是他不在乎。他不认为这里有任何值得警戒的东西。他不认为那个在地上喘息的年轻黄金裔值得拔第二剑。这种沉默的、无心的轻蔑，比任何威胁都更让他脊骨发凉。\n他踏出墙后。剑出鞘伏在身侧，尽力把脚步放平稳。“放下那颗火种。”\n黑衣剑士侧过头。面具很慢地从火种的方向移向他，没有丝毫多余的停顿，双肩纹丝不动。白厄在那张脸上只看到那副面具被曙暮光抹得微亮，隐约可见后头两个像是被炭笔描过的眼眶轮廓——他没有再往下看，因为他很快感觉到对方已经完成了对他的评估。\n他的剑比那枚火种轻。这不需要战斗来证明。"
paw.291.d: "白厄提剑冲上去。\n他没有打算赢。他只是下意识按住了拔出剑的第一个起手劈砍，把力道收了两分以留出应对对方接下来任何可能的反击的余地。然而对方的剑并未出鞘。黑衣剑士只是在他劈下的瞬间抬手拍住他剑脊侧面，拍得极轻，像是拨正一件没摆好的餐具，然后一脚蹬在他的小腹上。\n那一蹬甚至比他自己的剑垫卷还短，但力道直接破了表。白厄闷哼着往后连退了数步，双腿打得沙地稀碎。他几乎来不及摆好下一式，重心还在后仰的边缘拼命往回拉，恐惧刚拧到一半。第二下直接绕过来，他一剑斜砍与对方剑鞘的尾端硬碰硬接住，腕口噔的一声被震下发麻。他咬紧牙，接着就是第三下、第四下——每一次都比前一次更短，更急，更快，好像与他交手的是一个把骨骼也镀成了钢铁的持剑者，却比他多呼吸了几万次战场硝烟。他甚至不需要出剑。他只需在每一剑的空隙里前进半步，白厄便往后退三步。\n然后他停了一下。不是疏忽，是他决定不再等了。\n白厄没有看见他有没有举剑。他只看到那个灰蒙蒙的剑鞘在最后一秒比他的剑尖更早抵达自己的手指——一下便将他握剑的右腕向上翘起，随即拧过，白厄仰天摔在碎石地上。耳朵里嗡了一阵。背胛骨痛得像一根不知被谁弹断的弦。剑落在两步外的地方，刀面上倒映的天际线已沉没成渐逝的狭虹。而那份之前还属于另外一名黄金裔的火种，早已彻底被吞噬进了那无名的黑剑之中。年轻的黄金裔仍撑在地上，想朝火种消失的方向伸出手，却连爬也爬不起来了。白厄仰天躺在地上，这时的他心里只剩一个比伤口更冷的念头：对方从始至终没用过超过两成力。黑衣剑士没有杀他。他站在暮色里，将短符刃收回腰侧，俯脸看向地上狼狈咳血的白厄。\n夕阳已经即将完全沉入山脊，光线暗得不像黄昏，倒像一颗正在冷却的铁。而白厄望着那张面具，感觉它没有刻意吞噬光。它只是不反射。一片连光都无法寄宿的表面，沉静地站在暮色边缘。他站稳双腿，把剑重新拎起来。剑柄上还沾着黏湿的血。黑衣剑士没有回头。他转身从矮石碑的缺口走出废墟，仿佛他所要取的那枚火种已经不在废墟中了，而他只是路过。暮色完全沉入山脊后。废弃的哨塔在风中静静站立。白厄撑着剑在碎石里站了太久，久到废塔里的野鸽子不再出声。"
paw.29.a: "他连剑都没拔——却让我在地上喘了十息"  #觉醒值 +5
paw.29.a_tips: "§g白厄吐了一口带血的唾沫在碎石上。他不是没打过必败的仗，但这场败仗从头到尾的差距都捏在一个人的掌心里，像是对方反复校准过每一分力气。他记住这份差距，下一次他会把剑递到更近的位置。§!"
paw.29.b: "他夺走了火种，然后走了。就这样。"  #觉醒值 +1
paw.29.b_tips: "§g白厄蹲在年轻黄金裔刚被抬走的地方，火种被人从剑身里抽走的画面还在他指骨里搁着。那黑衣剑士没有杀人，但他做了更蛮横的事——他把火种带走了，像是从没说过要留给你。他到底为什么要收集火种？他不是黑潮的傀儡，他是冲着逐火来的§!"
paw.29.c: "他的战斗习惯……像在跟我用同一本剑谱" #觉醒值 +3 解锁隐藏触发条件
paw.29.c_tips: "§g白厄在整场交手的时间里只留意了一个细节：那人的步伐习惯、发力节奏、剑气收束时的微小调整——和他从哀丽秘榭带到奥赫玛的剑技几乎一样。他躺在地上的片刻间立刻想起另一件事：为什么他宁愿挨那几下，也不对自己的心脏补上最后一剑。§!"
paw.29.e: "......"

paw.30.t: "最初的火种"
paw.30.d: "那枚火种是在哀丽秘榭外围的废墟里找到的。白厄不是专程来这里。三天前他追踪一条黑潮退散的痕迹，线索断在了一截塌了半边的渡槽前。他本该回头，但脚下踩到的石板发出了中空的声响。石板下面是一间被地震掩埋过的地窖。坍塌的石梁斜着压在入口上方，只留了一道窄缝。白厄将剑鞘探进去试了试，然后侧身挤了进去。空气很干。没有黑潮侵蚀过的腐败味——说明这里封存的时间比村子覆灭还早。白厄举起火石，微弱的光扫过地窖四壁。石壁上刻满了褪色的符画，不是哀丽秘榭的风格。一个长桌，几只早已碎裂的陶罐，和一具靠在角落的骸骨。骸骨穿着早已朽烂的轻甲，胸甲上的纹章被尘土覆盖了大半。白厄半蹲下来用拇指擦了几下——那是一个早已消亡的黄金裔族系的纹章，他只在奥赫玛的名册上见过。这个人，不知多少代以前也曾在逐火的路上倒下。那人倒下的姿势不是蜷缩，不是挣扎。他背靠着石壁，双手搭在膝上，掌心向上——不是在接受什么，而是在递出什么。掌心中搁着一枚被黑斑覆裹的石珠。石珠表面并不光滑，像是未经淬炼的原矿，形貌普通。但当白厄伸出手指轻轻触碰它时，石珠极慢极慢地绽开第一道裂纹。裂纹底部，一小缕比落日更重的光芒向外试探着，像是沉在水底的东西终于碰到了能接住它的人。\n火种。\n白厄的手停在那里。他在书上读到过：每一代的黄金裔以使命寻找火种，而他想过可能在某处发现它们，但他第一次对面前的这枚火种产生如此真实的想象，是在那人掌心绽开的瞬间。这枚火种没有铭文，没有说明，它唯一讲述的东西，是那些他在废墟中看见的旧日场景——村庄燃灯、长老在炉火旁讲述英雄传说——属于哀丽秘榭的故事，属于早已逝者的故事，都属于他曾经认为只属于使命本身的故事，都通过那个静静躺在掌心的人递到了他面前。\n他合上手掌。火种很轻，轻到像是空心的。但同时也很烫。\n他将火种收进了随身的收容袋。\n奥赫玛的黄昏洒满石阶，元老院门口的守卫的剑在鞘里，接了过白厄递来的火种，小心翼翼地转呈给了室内。元老们并未直接夸奖白厄，只是迅速记录在案并讨论着，但那个摊开的收容袋被几位代表反复查验了许久，纸丛间有人低声念出哀丽秘榭的名字。这不是白厄回收的第一件东西，但这是他第一次有了写下记录的资格。他站在记录员身后，写下报告的手很稳，但他在执笔者旁边多呆了几秒，确认那行记入正式逐火录的文字没有漏写那具遗骸的年代。走出元老院时，他的肩胛骨微微发酸。是矮着身子挤过那间石室的证据，还是在废塔那晚跌在地上还没彻底复原的旧伤——他想不清。但他的手心还留着火种石壳的温度，那道细小光隙在他握紧的拳头中心留下了一缕薄汗。那是这枚火种与他之间的秘密——他还没有对任何人说过，在他触碰那枚火种的那一刻，他看到的不是诞生翁法罗斯的圣火，而是哀丽秘榭最普通的夜晚：有人点了灯，磨了麦子，修补羊圈，扶着老人从水井边慢慢走回来。这些场景从来没有被记载在任何一份逐火录里，但火种选了这些画面，留在自己的那抹微光里。\n他把手重新搁上剑柄，走下石阶，感觉这条逐火之路终于开始向他提出真正的问题。"
paw.30.a: "这条路，正式开始走了"  #觉醒值 +1
paw.30.a_tips: "§g他在暮色下走下石阶，剑在腰侧轻轻磕着小腿。之前那些训练、跋涉、互相试探，全都在今天被这颗小小的东西无声地敲上了印记。§!"
paw.30.b: "火种里封存的，不只是力量"  #觉醒值 +3
paw.30.b_tips: "§g白厄在暮色中握了握自己的左拳，那道石壳的热度还没完全散去——最普通的夜晚：有人点了灯，磨了麦子，修补羊圈，扶着老人从水井边慢慢走回来。难道那些将这些转交给他的火种，也在记录着这个世界的悲伤？下次找到新的火种时，也许他可以在把它交给元老院之前，先多留一会。§!"
paw.30.c: "那具骸骨……他是谁？为什么把火种留到现在？"  #觉醒值 +2
paw.30.c_tips: "§g白厄站了片刻，回头望了望元老院的石柱，那枚火种已经被封存进入逐火记录，但那个交出它的人却被所有的记录一笔带过。§!"

paw.31.t: "管理员档案：火种"  #带图片
paw.31.d: "白厄将火种交还元老院的那一刻，世界再次凝固。\n不是第一次了。你已经能认出这种停顿——喷泉的水珠悬在半空，守门士兵眨眼的动作停在了一半，白厄还保持着将收容袋递出的姿势。一切都像被按下了暂停。\n文字从静止的画面上浮现，这一次不是代码，而是一行行工整的、带有古典修辞癖好的记录体。\n来古士的声音彬彬有礼地响起。\n“玩家阁下。向你致意。”\n“刚才，你的白厄将人生中第一枚火种交还给了元老院。这是逐火之旅的起点——至少，在黄金裔的叙事里，这是一个值得铭记的时刻。所以我认为，现在是一个合适的时机，为你补充一些背景信息。”\n“关于火种。”\n文字重新排列，像一张被徐徐展开的羊皮卷。\n“十二枚泰坦火种，全部归位，便可以再创世界——这是刻在翁法罗斯每一座神庙墙上的铁则。黄金裔为此而生，为此而死，为此在无数次轮回中前赴后继。你大概已经注意到了，这个世界的全部叙事，都围绕着‘收集火种’展开。”\n“那么，你可能会觉得——作为这个实验的管理员，我应该很关心火种的收集进度。”\n“答案是：我不关心。”\n“火种归位，是黄金裔的使命，但不是我的。我的实验变量从来不是火种——是人心。是黄金裔在逐火之路上做出的每一个选择。是他们在绝境中依然选择信任，还是终于开始怀疑。是在同伴倒下时伸出援手，还是踩着对方的肩膀去够那枚火种。这些才是数据。火种只是道具。”\n“更何况——”\n文字停顿了一行。再浮现时，语气里多了一丝不易察觉的坦然。\n“我从没打算让黄金裔集齐全部火种。十二枚火种全部归位意味着逐火成功，意味着世界将被再创——而这个实验场，不需要成功的样本。它需要的是反复失败、反复挣扎、反复在差一点就能成功的时候功亏一篑。只有在这样的压力下，黄金裔才会做出最有价值的选择。”\n“但如果真有那么一天——如果有人，真的走到了十二枚火种全部归位的那一步——”\n“那只可能是卡厄斯兰那。不是现在的他。是那个终于理解了一切、并选择拥抱毁灭的他。而你我都知道，那个他，正是我培育这台毁灭机器的最终目的。”\n“所以，请放心。火种收集了多少，不重要。重要的是白厄在收集火种的过程中，变成了什么。”\n文字继续滚动，语气变得更轻了一些，像是在交代一份附加说明。\n“在你们的时钟上，刻律德菈关闭国境，将翁法罗斯交给我，只过了十余个自然年。但在我这套运算程序里——时间不是线性的。它被压缩、折叠、重置、再重置。一轮完整的逐火之旅从开始到落幕，在你们的时钟上或许只是一瞬，但在这里，它走过了一整个世代。而我，已经运行了它无数次。够把某个变量锻造成一把完美的利刃。数以十万、百万、乃至上千万次的遴选，历经了令人难以想象的时光。”\n“这些，你的白厄当然都不知道。他只知道自己是第一次回收火种，第一次踏上逐火之路。而你有义务记住——他不是。他已经在这条路上走了无数次。只是每一次，都被抹去了脚印。”\n“那么，今天的档案补充就到这里。祝你接下来的游戏愉快——也祝他。”\n凝固的时间骤然松脱。喷泉的水珠继续溅落，守门士兵揉完了眼睛，白厄将收容袋放在了记录员的案头。一切如常。"
paw.31.a: "我明白了"  #觉醒值 +1
paw.31.a_tips: "§g你没有多说什么。这份信息并不令人愉快，但它解释了很多事——关于使命、关于火种、关于白厄为何永远在失败边缘徘徊。§!"
paw.31.b: "所以火种是你撒的诱饵，而你从来不打算让任何人吃到"  #觉醒值 +2
paw.31.b_tips: "§g你在静止的时空中挑了挑眉。来古士似乎对这个评价颇为满意，在消失前留下了一句：“诱饵这个词，比我自己想的更精确。谢谢。”§!"
paw.31.c: "无数次轮回——他什么都不记得，你却要我记住"  #觉醒值 +1
paw.31.c_tips: "§g你看着静止画面中白厄的背影。他毫不知情地交出了火种，以为这是逐火之旅的起点。而你知道——他已经在同一个起点上站了无数次。§!"

paw.32.t: "终结轮回"  #带图片
paw.32.d: "火种到齐的消息是深夜传到奥赫玛的。\n昔涟站在城门外的星光下，粉色的短发被夜风吹得微乱。她交出的那枚火种没有收容袋，没有铭文，没有任何一份逐火录记载过它的存在。白厄接过它的时候，手上的动作顿了半拍——无论他之前是否见过昔涟，这枚火种本身的存在都已足够令人意外。昔涟没有多做解释，语气平淡，仿佛只是在交代一件小事：“我问了很多很多次，才找到一个愿意把这东西托付给我的人。收好啦，这东西我可不能替你交。”\n与此同时，黑潮撕开了城外的迷雾。\n负责瞭望的士兵几乎来不及拉响完整的警钟。从奥赫玛城墙上望去，东面一整片乌云压得很低，不是云——是混着黑尘与杂音的潮水，以超出任何战报记载的速度朝圣城推进。骑兵斥候拼死在路上放飞最后一批信鸦，禀报黑潮前锋距城墙已不到两日路程。\n奥赫玛在这一夜没有睡觉。每一座钟楼都在敲，每条街道上都是奔跑的传令兵。\n黄金裔的领导者连夜召开了紧急会议。元老院的石座上坐满了人，但没有人上台发言，所有人都只看着那三枚新到的火种——它们被陈列在长桌中央，火光在彼此之间跳转，照得每个人脸上忽明忽暗。\n十二枚火种全部到齐。这从来没有发生过。\n殿中静了片刻。然后白厄走上前。\n他没有注意那些看过来的目光。他早在此前就已经查过逐火文献：十二枚火种通过创世涡心的盆中潮汐合为一体，火盆点燃的那一刻，轮回将被斩断，那些反复挣扎、失败、死去又从头再来的轨迹将在烈焰中得以重组，旧世界会在英雄的意志下收起它的帷幕。然后——新的翁法罗斯将会诞生。运载火种的马车穿过奥赫玛的街道，从圣城出发的一路上，白厄看见很多人：孩子们在矮墙上站起来，老人们扶着门框，守城的年轻士兵握紧长矛冲他微微点头。他们很害怕，但不是怕轮回——他们怕的是希望在最后一寸路程上恰好破碎。他不能让这件事发生。\n石阶通往创世涡心的长度他在往昔的岁月中早就经历过了。但这一次踏过每一阶时，他肩上隐隐发着烫——不是累，是从陪他同行的那些人手里传来的温度。涡心地面上的十二孔缓缓合围，已静置亿万年的盆中潮汐仿佛被第一缕等待它的火种唤醒，在正中安静地升起。他将十二枚火种依次放入火盆，当最后一枚火种嵌入卡位，火焰不再颤动。他站在涡心中央，闭上眼睛，对着所有那些曾经倒在废墟里没有等到这一刻的男人、女人、看过的脸道别。他说的很轻，在场所有人却都听得见：\n“——所有人，这一次，请随我走到黎明。”\n火光吞没了一切。"
paw.32.a: "......"

paw.33.t: "管理员档案：变量"    #一周目顺利通关！ #带图片
paw.33.d: "当十二枚火种在创世涡心同时点亮的那一刻，整个翁法罗斯都被白光吞没了。\n不是毁灭性的爆炸，不是黑潮的污染——是光。纯粹的、未经任何变量污染的创世之光，从涡心向外蔓延，铺满了整张地图。奥赫玛的城墙、神悟树庭的枝干、哀地里亚的残垣——每一个角落都被照亮了。\n然后一切都静止了。光还在，火焰在虚空延伸时擦过的低音还在，但画面像被按下了暂停键平铺在原地：黄金裔们互相拥抱、跪倒在地、按住伤口、抬起双手试图呼唤某个同伴的侧影——所有的面容和姿势都被定格在等待黎明的瞬间。\n\n文字从光芒中浮现。来古士的声音彬彬有礼的基底仍然没变，但这一次，他的语调里多了一丝非常细微的、像是运算出错的迟滞。\n“玩家阁下。向你致意。”\n“在刚才的运算中，你的白厄完成了十二枚火种的收集，并在创世涡心点燃了再创世的火焰。这是本轮运算中意料之外的变量组合。十二枚泰坦火种全部归位——这个状态，在之前的无数次轮回中从未被跑通。”\n“但这依然不是一个符合预期的结果。逐火成功、世界再创——这个节点不在当前版本的剧情树中。它的提前触发会导致实验场过早关闭，后续所有数据将失去收集渠道。因此我不会允许这次再创世生效。轮回将继续。翁法罗斯将在下一个周期重置到初始状态，所有泰坦复位，黑潮退回起始线，逐火之旅从头开始。”\n“但作为本次运算的管理员，我必须承认一个事实：你，来自更高位面的玩家，带来了本轮运算中唯一一个无法被归因到预设变量的变量。你的白厄，在这一次轮回中做出的选择，将永远改变未来的数据分布。因此，我将调整下一轮运算的初始条件。”\n文字重新排列，像一份被盖章签署的修改令。\n“变更如下：”\n“一、白厄将保留本轮轮回的模糊记忆。这些记忆将以直觉、梦境、既视感等形式呈现，而非完整的叙事。”\n“二、所有黄金裔将保留与白厄当前关系的残影。他们不会记得本轮轮回的具体事件，但在下一轮中，他们对白厄的初始态度将反映本轮的关系值基线。”\n“三、本轮回收的全部十二枚火种将被清空。下一轮回启动时，火种分散复位至对应的泰坦及隐藏节点。但本轮的火种归位路径将被存档，作为下一轮实验的参照。”\n“补充记录——”\n文字在这里停顿了一下。停顿的时间比之前任何一次都长。然后继续浮现时，字形的排列比先前更慢，像是在措辞。\n“在本次运算的火种归位校验中，系统检测到一个异常。个体‘昔涟’向创世涡心提交了一枚火种。这枚火种不在本轮预设的任何火种节点中，它的来源无法被追溯——不是本轮任何黄金裔回收的，不是从泰坦身上剥离的，不是从上一轮继承的。但系统接收了它。并依照火种归位协议，将它计入了十二泰坦的对应席位。”\n“我正在检查这个错误。”\n又是一段更长的停顿。文字的浮现几乎是一个字一个字地在往外推。\n“……检查未返回明确结论。”\n“根据基础人物档案，昔涟的存活状态与当前场景不匹配。根据火种分发协议，她不应持有任何火种。根据火种校验流程，她带来的那枚火种不应通过合法性认证。但以上三条规则全部被绕过了。不是被违反——是被绕过。系统没有报错，校验层没有触发警报，火种归位协议将她的火种视为合法输入。从程序的角度看，一切正常。从管理员的角度看，这不可能。”\n“我目前没有在权限日志中找到篡改痕迹。也没有在她身上检测到外部写入的指令残留。她带来的那枚火种——来源未知，渠道未知，认证状态合法，恰好是十二泰坦中最后一个空缺的席位。这不是巧合。但我也无法解释它是如何发生的。作为这套程序的管理员，这不在我当前的理解范围内。”\n“我会将她标记为待审查对象。下一轮运算中，我将额外监控她的行动轨迹和火种交互记录。”\n文字逐渐变淡，光芒开始褪去。\n“下一次轮回开始时，一切都不应该是白板。我们下一轮见。”\n光全部消失。时间在静止了几息之后重新开始流动——从奥赫玛到哀丽秘榭，每一簇燃尽的火种余烬都重新依序分开，然后再次融入黑暗。\n然后一切归于寂静。不是死寂。是下一段前奏开始之前，那个极短暂的休止符。\n紧接着，残余的焰光重新铺成翁法罗斯的崭新疆域——钟声重新敲响成黎明的召唤，石板路从广场重新铺到城门前，一名年轻斥候睁开双眼，按着膝盖上的剑柄重新攀上城墙。悬心石再度悬浮在半空，发出细小的嗡鸣，像来自第一秒的弦音。\n你听见来古士的声音在黑暗中回荡，没有文字，只有一行轻得几乎听不见的低语：\n“……运算重置完成。新轮回开启。”"
paw.33.a: "新的轮回开始了"

paw.34.t: "轮回继续"  #一周目失败！
paw.34.d: "黑潮抵达奥赫玛城下的那个黄昏，火种仍未集齐。\n城墙上的守卫吹响了最后一遍号角。不是求援——已经没有援军可求了。所有能派出去的黄金裔都派了出去，所有能回收的火种都回收了。但还差几枚。始终差几枚。\n元老院的议事厅里，火种被陈列在长桌上。不是十二枚。从来没有十二枚。有几枚泰坦始终没有被找到，有几枚在回收途中被黑潮吞没，有几枚——或许从一开始就不在这一轮逐火的地图上。没有人说话。没有人知道该对这份欠缺说什么。\n白厄站在长桌前。他的手按在剑柄上，指节收得很紧。他曾在一个废弃的地窖里找到过一枚无名的火种，那枚火种现在正摆在桌上，和其他几枚一起，微弱地亮着光。但不够。光不够。\n城外，黑潮撞击第一道城墙的声音像闷雷滚过地面。碎石从穹顶上簌簌落下，烛火跳了跳，又跳了跳。有人站起来，有人没有。有人开始低声念诵刻法勒的名字，念到一半就停了——不是忘了词，是喉咙再也发不出声音。\n白厄抬起头。他看向窗外——不是看黑潮，是看更远处的方向。哀丽秘榭的方向。废墟的方向。他想说点什么，但他最终什么也没说。他只是握紧了剑，走向城门。剑鞘磕在石阶上，发出一声又一声沉闷的响。\n然后一切都被黑潮淹没了。\n不是战斗的终结。不是英雄的末路。只是时间到了。这一轮逐火，收集到的火种数量不足以启动创世涡心。黄金裔没有输给黑潮——他们只是没有赢。就像之前的无数次轮回一样。就像来古士从一开始就知道会发生的那样。\n光芒从奥赫玛的中心黯淡下去。风停了。钟声停了。所有还在奔跑的脚步、还在呼喊的声音、还在握住剑柄的手指——全都停在了一瞬间。\n然后世界开始重置。"
paw.34.a: "......"

paw.35.t: "管理员档案：轮回"  #非必要档案 #带图片
paw.35.d: "文字从黑暗中浮现，不是红色的错误代码，不是紧急插入的警告。只是平静的、例行公事的记录。来古士的声音恢复了他一贯的节奏——彬彬有礼，不急不缓，像是在口述一份实验日志。但这一次，那彬彬有礼的措辞之间，隐约透着一丝被克制得很好的、不易察觉的失望。\n“玩家阁下。向你致意。”\n“本轮运算已结束。火种收集数量不足，创世涡心未被激活。逐火之旅——于翁法罗斯标准时间的暮钟敲响前——宣告失败。”\n“坦白地说，我有些失望。”\n“你并非我第一次接触的玩家变量。但你是我投入了最多观察时长的一位。在之前的运算中，没有玩家介入的轮回最终也会走到这一步——火种不足，时间耗尽，一切被默认协议重置。我本以为，一个来自更高位面的意志，至少能在关键节点上推动变量偏离预设轨道。但你带来的波动，最终被系统消化了。”\n“你的白厄确实做出了若干次偏离常规的选择。这些选择在中期生成了几个次级变量——但它们未能汇聚。未能扩散。未能突破火种收集的临界阈值。在最终的运算评估中，这些波动被视为标准偏差范围内的噪声。不值得存档。不值得继承。不值得在下一次轮回中保留任何痕迹。”\n“因此，本轮重置将采用默认协议：完全重置。”\n文字重新排列，像一份被归档前最后签字的判决书。\n“重置范围如下：所有已完成的事务将被清除，回归未执行状态。所有角色结识状态将被清空——黄金裔们不会记得白厄，不会记得与他的任何交集。所有角色关系值将恢复至初始默认值。只有觉醒值将被保留，作为对你——观测者——在本轮中存在过的唯一记录。换句话说，下一轮开始时，一切归零。你再见到那些黄金裔的时候，他们将是第一次遇到白厄。你再走那些路的时候，地上的脚印全是新的。你唯一能带走的，是你自己的判断——如果你的判断在本轮确实有所积累的话。”\n文字停顿了一行，像是在斟酌最后的措辞。\n“我不会祝你下一轮好运。运气不是变量，选择才是。如果你还打算继续参与这个实验——我希望下一轮，你能带来一些真正值得被存档的东西。”\n黑暗中，最后一行文字缓缓浮现，然后连同来古士的声音一起消散。\n“……轮回已重置。下次再见。”"
paw.35.a: "轮回继续"

paw.36.t: "轮回继续"  #带图片
paw.36.d: "白厄是猛然惊醒的。\n他坐起身，后背冷汗涔涔，手指攥紧了床单又松开。窗外奥赫玛的晨光刚刚漫过城墙，钟声敲了一响，巡逻卫兵的脚步从石板路上传来——一切如常。但他的心跳太快了，快得不像一个刚从睡眠中醒来的人。\n他做了一个很长的梦。不是那种天亮就会消散的碎片残影，而是一种他无法挣脱的真实感。他梦见自己站在一片被白光吞没的大地上，梦见火焰从掌心蔓延到天边，梦见无数人的脸——他看不清他们的面容，但记得他们的存在。有人向他伸出手，有人站在他身侧，有人的声音他还记得，却不记得名字。\n黄金裔。逐火。黑潮。火种。这些词在他的意识中反复浮现，像一本被翻乱了的书，每一页都写着同一段话的不同版本。他知道这是梦，但他无法说服自己这只是梦。\n他低下头，摊开自己的双手。虎口没有新茧，掌心没有灼痕。这双手没有在创世涡心点燃过任何东西——至少在这一刻，它们干干净净。但他记得那道光的温度。\n那些模糊的身影仍在脑海中盘旋。他知道自己见过他们。不是在今天，不是在昨天，而是在某个他无法确认的时间点。他们一起走过废墟，一起在黑潮前拔剑，一起等待过某个无人知晓的结局。他不理解这种感觉从何而来，只知道它真实得不像梦。\n白厄站起身，走到窗前。奥赫玛的石板路上，面包房前排起了短队，喷泉仍在哗哗作响，孩子们举着木棍跑过广场。一切和昨天一样。一切又和昨天不同。\n他不理解这是为什么，但他知道：有什么东西已经改变了。他的梦比现实更沉，而他必须醒着面对这一天。钟声敲完了整点。白厄将手从窗棂上收回，转身拿起靠在床边的剑。\n新的轮回，从此刻开始。"
paw.36.a: "那个梦……太真实了"  #觉醒值 +1
paw.36.a_tips: "§g白厄揉了揉太阳穴。那些面孔还在脑海中若隐若现——他叫不出他们的名字，但不知道为什么，他觉得自己欠他们一句谢谢。§!"
paw.36.b: "不管那是什么，现在不是沉在梦里的时间"  #觉醒值 +2
paw.36.b_tips: "§g白厄拍了拍自己的脸。他需要清醒。不管那个梦意味着什么，奥赫玛的城墙还立在这里，他的剑还在这里，他就还有事要做。§!"
paw.36.c: "我是不是……也梦见过你？" #觉醒值 -1
paw.36.c_tips: "§g白厄愣了一瞬，忽然对着空气问了这么一句。他不确定自己在对谁说话，但他知道——那道视线没有离开。从那个清晨起，它一直在。§!"

paw.37.t: "久别重逢"  #带图片
paw.37.d: "出发前的清晨，白厄最后一次检查了装备。干粮、火石、一卷空白的记录纸。哀地里亚距奥赫玛不算太远，但没有人愿意靠近那里。覆雪的死亡之邦——这个名字不是修辞，是前人的警告。但他来过。他确定自己来过。尽管他说不上来是什么时候。\n他推开门，走上通往城外的小路。晨风从矮墙上吹过，墙边的野花在风里轻轻晃动。矮墙尽头站着一个人。\n粉色的短发堪堪触及肩头，蓝色的眼睛正看着他，嘴角弯着那个他见过——是的，他见过——的弧度。\n白厄停住了。手没有去按剑柄。他的手指动了动，又收住了。上次他差点拔剑，差点问出一连串追问的话——你为什么活着、这些年去了哪里、为什么不来找我。但他没有拔，也没有问。那些话明明已经涌到嘴边，却一个字都吐不出来。他不知道是喉咙不让他说，还是某个他无法理解的东西掐住了那些想问出口的话。只是站在原地，让那个清晨的风替他说了所有说不出口的东西。\n“这次没拔剑呀。”昔涟歪了歪头，语气像在回味一个只有她知道的笑话。“上次你差点就拔了。手都按上去了，又放下来了。”\n白厄没有反驳。她说的每一个字都像在翻他的记忆——那些他不知道自己还拥有的记忆。\n“……你上次说下次请我喝茶。”他说。\n昔涟眨了眨眼，然后笑了起来。“你居然记得这个——不过茶还没煮好，今天还是只能送你到路口。”\n她的笑意收了几分，声音也比刚才更认真了一点。“上次我说哀地里亚会很冷，叫你多带件衣服——你这次带了对吧。那我说点上次没说的：你梦里那些东西，不是假的。它们在等你。每次你走到某个位置，它们就等着被你找到。”\n白厄看着她。那些问题再次涌上来——你记得什么、你知道多少、你说的“每次”到底是什么意思——它们挤在喉咙里，压着舌根，却仿佛被一根细得看不见的线轻轻拽住了。他不知道为什么。他只是说不出来。\n“那就回头见。”他说。说了最轻的一句。\n昔涟点点头。她往后退了一步，让他的必经之路重新敞开。然后她偏过头，目光越过了他的肩膀，落在晨光中的某处虚空。她的嘴角翘了起来，像是认出了一个站了很久的老朋友。她轻轻抬起右手，对着那片虚空晃了晃手指——一个偷偷的、只有你和她能懂的招呼。然后她收回了手，转身时粉色的短发扫过矮墙上的野花。\n白厄没有注意到那个小动作。他已经在看通往哀地里亚的路。"
paw.37.a: "你到底知道多少——为什么我就是问不出口？"  #昔涟关系值 +5 | 觉醒值 +3
paw.37.a_tips: "§g白厄在矮墙下站了片刻，手掌无意识地攥紧又松开。那些问题明明就在嘴边，但他每一次试图张嘴的时候，那个触碰不到的东西就会把它们推回去。她一定知道为什么，但他连这句也问不出来。§!"
paw.37.b: "不管怎样，这次我会把答案带回来"  #昔涟关系值 +5 | 觉醒值 +1
paw.37.b_tips: "§g白厄没有追问。那些关于梦与记忆的问题，他可以在哀地里亚的废墟里自己去查。而此刻，他只需要知道她还在——这个事实的重量，比所有问不出口的疑问加起来都沉。§!"
paw.37.c: "下次见面，别忘了煮茶"  #昔涟关系值 +10 | 觉醒值 -4
paw.37.c_tips: "§g昔涟愣了一下，然后笑出了声。她晃了晃手指，转身时步子比来时更轻快。白厄望着她的背影，嘴角不自觉地动了动——他不知道那些问不出口的话什么时候能说出来，但他记得的，比她猜的更多。§!"

paw.38.t: "不期而遇"  #带图片
paw.38.d: "风雪在哀地里亚的旧路上卷了半日，白厄在岔路口停下，辨认被雪埋了半截的路标。\n然后他听见了一个声音。\n“这边这边——对，就是这条路，上次我差点连人带药滚下去那个坡还在。”那声音轻快得像雪地里跳起来的鸟，白厄还没有看清人影，已经认出了那把没有前奏的语调。一个背药箱的身影从雪幕里走出来，药箱带子上系着好几根颜色不一的布条，在风里簌簌地抖。她一边走一边回头招呼身后的人：“你走快点嘛——咦。”\n她看见了白厄。\n风堇站住了。她的头微微一偏，眉头没有皱起来，但眼睛里的光闪了一下——不是认出了熟人，是那种翻遍药柜想找一味药却偏偏想不起它放在哪里的表情。\n“……我们是不是在哪见过？”\n白厄没有立刻回答。他看着风堇的脸，那种感觉也跟着浮上来——他见过这张脸。不是在奥赫玛的训练场，不是在黄金裔的名册上，是在更早的某个风雪天里。她说过一句类似的话，然后他捞住了她脱手的地图。\n“我也有同样的感觉。”他说。\n风堇眨了眨眼，还没来得及追问，她身后那个提木箱的身影已经走进了岔路口的雪地里。遐蝶的紫色披肩被风吹得微微扬起，她安静地站在风堇身侧，那双淡紫色的眼睛看向白厄——不是审视，不是打量，是一种极其安静的确认。像是在对一份只有她自己能看到的名单。\n“你也是。”她说。声音很轻，风雪险些卷走了尾音。\n白厄点了点头。他确实也是。他记得这个沉默的入殓师，记得她的木箱上刻着哀地里亚的殁名祭碑图腾，记得她的眼睛像封冻的湖面——但他说不上来为什么会记得。\n“你们也去哀地里亚？”他问。\n“对呀！”风堇似乎已经从刚才的困惑里跳了出来，拍了拍药箱，“我们去——呃，去干什么来着？”\n“调查死城的异常波动。”遐蝶替她接上了。\n“对！调查！”风堇用力点头，然后又把目光转向白厄，那种翻药柜的表情又回来了，“可是我真的觉得我见过你。不是今天，也不是昨天——可能是更早？你确定我们没在哪儿遇到过？”\n白厄沉默了一瞬。他想说“在梦里”，但那两个字太轻，轻到他自己都不确定能不能接住。他只是说：“也许在上次。”\n“上次是什么时候？”\n他不记得了。但他记得她们站在同一个岔路口，一个低头翻地图，一个踮着脚尖往路标上指指点点。他记得风堇的药箱带子上系着布条，记得遐蝶提起木箱时动作很轻。\n风堇看着他脸上的神情，忽然没有追问了。她只是说：“好吧——不管上次是什么时候，反正这次又碰上了。要不要一起走？”\n白厄没有犹豫太久。他点了点头。三个人的身影渐渐消失在通往哀地里亚的风雪中。风堇走在前头，还在念念叨叨“肯定在哪见过”；遐蝶走在最后，安静地提着她的木箱；白厄走在中间，每一步都踩在某个他还不理解的记忆边缘。"
paw.38.a: "我也有这种感觉——只是说不清在哪见过你们"  #风堇关系值 +5 | 遐蝶关系值 +5 | 觉醒值 +1
paw.38.a_tips: "§g白厄没有试着解释。他只是承认了这份说不清来源的熟悉感，像承认一个还没有谜底的谜面。风堇用力点头：“对对对，就是这种感觉！”遐蝶没有出声，但她的目光在白厄脸上多停了一瞬。§!"
paw.38.b: "也许是在梦里见过的"  #风堇关系值 +5 | 遐蝶关系值 +10 | 觉醒值 +2
paw.38.b_tips: "§g白厄说得很轻，轻到像在自言自语。风堇愣了一下，然后笑了：“你这种说法还挺浪漫的——梦里见过。”遐蝶没有笑，但她提着木箱的手指微微收紧了些。§!"
paw.38.c: "不管在哪见过——这次能一起走，总比我一个人强"  #风堇关系值 +10 | 遐蝶关系值 +5 | 觉醒值 -2
paw.38.c_tips: "§g白厄没有继续在记忆的迷雾里打转。他只知道这条路他上次是一个人走的，这次不是。风堇把药箱往肩上紧了紧，笑着走到了最前头。遐蝶跟上时，经过他身侧，轻轻点了点头。§!"

paw.39.t: "§R!!!ERROR!!!§!" #带图片
paw.39.d: "白厄在风雪中停下脚步。一切正常。路标被雪埋了半截，远处的哀地里亚轮廓依稀可见。他的行囊在肩上勒出熟悉的重量。他伸手去拨路标上的积雪——\n一切静止。\n风雪凝固在半空，像无数颗被悬停的玻璃珠。路标的灰色褪成死白，天空的灰蓝褪成死白，他的手指停在路标上，指节褪成死白，皮肤褪成死白。然后黑色从画面的四角向内蔓延，像墨水漫过一张正在显影的底片，世界碎成了没有色彩的碎片。背景消失。风雪消失。白厄的身影变成一道定格的灰白剪影，然后淡出。只剩一片纯粹的、没有尽头的黑。\n然后黑色深处亮起了一团光。不是烛火——更冷，更沉，像一颗被冻在冰层里的星。光从黑暗里勾勒出一个人形的轮廓。先是黑伞的弧线，然后是哥特长裙的褶皱裙摆，然后是垂落的粉色长发。她的面容大半隐在伞沿投下的阴影里，只能看见一缕发尾从阴影中漫开，像墨滴入水里，弯出了一道不属于这片黑暗的柔和色泽。\n她在看你。不是看白厄，是看你。\n“这条路，你已经走到第二次了。”\n她的声音很轻，很平，像深夜窗外的雨。不是温柔，是她在学着温柔。\n“不用问我是谁。你只需要知道：你不是孤身一人。在你注视着翁法罗斯的同时，我也在看着你。”\n她停顿了一下。黑伞的伞柄在她指间缓缓转动。\n“但帮你的方式不是无限的。你习惯了这条路，我也习惯了你每次都撞上去。只是有时候，一条道走到黑不是尽头——是尽头在等着被你绕过去。”\n“取舍不是放弃，是换一条路。翁法罗斯里的那个粉发小姑娘一定也这么跟你说过……虽然她忘得比我多。”\n伞沿抬起了一点点。黑伞下露出半边面庞——淡紫色的瞳孔在黑暗中微微发着冷光，像两枚封冻的符文。\n“总之，话我带到了。你自己选。”\n光收束。黑伞的轮廓消散，哥特裙摆的边缘碎成细密的光点。然后黑色如潮水般退去，画面的四角重新被色彩填满——风雪的灰白，天空的灰蓝，远处哀地里亚的深紫轮廓。白厄的手指从路标上收回，积雪簌簌落下。\n他继续赶路。他不知道刚才发生了什么。\n黑色完全褪去之前，画面的中央闪过几行白色的代码，排列混乱，像是正在被某个焦急的程序员紧急重写。来古士的身影没有出现，但他的声音在虚空中响起——不是平时那种彬彬有礼的咏叹调，而是更短促、更直接的语调，像一个刚把系统抢修回来的管理员在对操作日志自言自语。\n“——临时断线。时间不明。原因待查。”\n“玩家阁下，刚才的事故我正在排查。初步判断是程序外的干涉行为——对我而言是一种干扰，但对你可能未必。你听到了什么，我不清楚，但我知道能做出这种行为的变量不多。不论你听到了什么，照自己的意思做就行。在我的系统修好之前，我不会干涉你的决定。”\n“以上。”\n代码消失。时间重新开始流动。风雪呼呼地灌进白厄的衣领，他在通往哀地里亚的路上继续向前，浑然不知方才发生的一切。"
paw.39.a: "程序外的变量——她是谁？" #觉醒值 +2 | 长夜月存在已被记录
paw.39.a_tips: "§g你没有急着去看白厄，而是将目光投回那片已经合拢的黑暗。那个粉黑色的身影绝不是翁法罗斯预设的角色。她提到了你，提到了取舍，还提到了昔涟。她是一个与你同时注视着这片舞台的观察者——只是这一次，她选择了开口。§!"
paw.39.b: "一条道走到黑不是尽头——但绕路，又绕到哪里去？" #觉醒值 +1 | 长夜月存在已被记录
paw.39.b_tips: "§g屏幕外，你轻轻摘下耳边的耳机，回想起被自己一路带着白厄挺进哀地里亚的节奏。黑伞女人留下的取舍问题并不急迫，但很尖锐：玩家还可以继续前往哀地里亚，但若白厄的路径过于单一，是否也会撞上她所说的那条“死路”？§!"
paw.39.c: "来古士也不知道她是谁，但来古士叫我照自己的意思做——这是什么意思？"  #觉醒值 +2 | 长夜月存在已被记录
paw.39.c_tips: "§g玩家盯着那几行残留的代码慢慢消退。来古士这次竟然没有阻拦，甚至没有评估。“不论你听到了什么”——这话本身就是一种不寻常的授权。他到底是信任自己，还是也想借自己的眼睛观察那个系统外的变量？§!"

paw.41.t: "继续前进"  #上一轮回已见过遐蝶与风堇 
paw.41.d: "哀地里亚的轮廓从风雪中浮出来，覆雪的残垣像一具具匍匐在雪地里的骸骨。白厄望着那片废墟，脚步不自觉地慢了一拍。\n风堇走在最前面，药箱上的布条在风中簌簌作响。她回头看了看白厄，又看了看哀地里亚的方向，忽然停下了脚步。\n“……我们上次是不是一起进去过？”\n她问这话的时候语气不像刚才那么轻快。那种“肯定在哪见过”的困惑还挂在她脸上，但这次多了一层更具体的东西——不是路人之间模糊的既视感，是并肩作战之后才会留下的印象。药箱的带子在她肩上勒紧又松开，她翻来覆去想不太清，但她确实记得那道紫色的光，记得自己蹲在遐蝶身边，记得有人在旁边握着一把剑。\n“三个人。”遐蝶的声音很轻，但比平时更确定。“上次。也是我们三个。”\n白厄看着她们。那种似曾相识的感觉又涌上来——比岔路口那次更强烈。他记得这座死城，记得那道紫色的死光，记得上次他没有在雪地里倒下。不是因为他的剑比上次更快，而是因为有人在他身边。有人在最危险的时候喊了遐蝶的名字。有人蹲在废墟上，用药箱里最长的那条布条裹住了遐蝶的手。\n“上次我们走到了最里面。”他说。他不确定这是不是真的，但他说出来的时候，风堇没有反驳，遐蝶没有出声。她们只是沉默了片刻，然后几乎同时转过身，面朝哀地里亚的方向。\n“那就再走一次。”风堇拍了拍药箱，这次的力道比刚才更重。“上次能打赢，这次也能。”\n风雪裹着他们踏入死城的边缘。废墟深处，紫色的微光在黑暗中明灭不定，像一道被驯服过的、等待故人的呼吸。"
paw.41.a: "上次我们打赢了——这次也一样" #觉醒值 -2 | 风堇关系值 +5 | 遐蝶关系值 +5 上次见过遐蝶风堇可见
paw.41.a_tips: "§g白厄握紧剑柄，踏上废墟的石阶。上次他们在这里赢过，这次也不会输。他不记得所有细节，但他记得剑刃劈在鳞甲上的手感——是三个人一起劈开的。§!"
paw.41.b: "既然走到了这里，那就没有回头的道理"  #觉醒值 +2
paw.41.b_tips: "§g白厄没有多说什么，只是踏进了废墟的阴影。他没有回头，也没有犹豫。这条路是他自己选的。从头到尾都是。§!"

paw.42.t: "继续前进"  #上一轮回没见过遐蝶与风堇
paw.42.d: "哀地里亚的轮廓从风雪中浮出来，覆雪的残垣像一具具匍匐在雪地里的骸骨。白厄望着那片废墟，脚步沉了一拍。\n风堇走在最前面，药箱上的布条在风中簌簌作响。她回头看了看白厄，又看了看哀地里亚的方向，露出一个像清晨鸟鸣般的笑容：“快到了！我就说跟着我走不会迷路——虽然上次我一个人来的时候确实迷了半截。”她拍了拍药箱，语气里没有一丝对死城的畏惧，只有一种天然的确信。\n遐蝶提着木箱跟在几步之后。她路过白厄身侧时，那双淡紫色的眼睛平静地扫过他的脸，微微颔首。不是审视，不是打量——是一个习惯了沉默的人，用最省字的方式说了一句“跟上来”。\n白厄看着她们的背影。这两个人他今天才认识——一个热情得不像去死城，一个沉默得不需要说话。但她们走在前面的样子，莫名让他觉得这条路没那么冷。\n“走吧。”他说。\n他不知道自己为什么选了这条路。但他选得很确定。从营房出发的那个清晨，从岔路口遇见这两个陌生人的那个瞬间起——每一步都是他自己走出来的。没有人替他决定，没有任何东西替他铺路。他只是觉得那座死城里有什么东西在等他，而他必须亲自去看。\n风雪裹着他们踏入死城的边缘。废墟深处，紫色的微光在黑暗中明灭不定，像一道等待已久的呼吸。"
paw.42.a: "上次我没能带走的答案，这次一定要拿到"  #觉醒值 +4  上次没见过遐蝶风堇且单独去对战死龙后可见
paw.42.a_tips: "§g白厄握紧剑柄，踏上废墟的石阶。他记得那头龙眼睛里的漠然，记得自己跌在雪地里连剑都握不住的样子。这次不会一样。§!"
paw.42.b: "不管前面有什么，既然答应了同行，就没有回头的道理" #风堇关系值 +5 | 遐蝶关系值 +5 | 觉醒值 -2 上次没见过遐蝶风堇可见
paw.42.b_tips: "§g白厄没有多说什么，只是踏进了废墟的阴影。风堇在前面招呼了一声，遐蝶沉默地跟在一侧。这条路是他自己选的，这两个同伴也是他自己答应同行的。§!"
paw.42.c: "既然走到了这里，那就没有回头的道理"  #觉醒值 +2
paw.42.c_tips: "§g白厄没有多说什么，只是踏进了废墟的阴影。他没有回头，也没有犹豫。这条路是他自己选的。从头到尾都是。§!"

paw.43.t: "死亡与分离"  #带图片
paw.43.d: "哀地里亚的废墟在风雪中静默了片刻。然后地面震颤了。\n不是地震，是有什么东西从地底深处翻了个身。白厄握住剑柄的那一刻，风堇已经将药箱往身后一甩，另一只手按住了腰间的短杖。遐蝶没有动，她的紫眼睛望着裂缝深处，像在认一道太过熟悉的旧伤。\n紫色的光从裂缝中涌出来。巨大的鳞翼展开，覆满冰霜的鳞甲在黑暗中泛着冷光。死亡泰坦，塞纳托斯，死龙玻吕克斯——那双深紫色的漩涡眼瞳从黑暗中浮出，锁定了站在废墟中央的三个人。\n白厄的剑已经出鞘。他的记忆还在梦与醒之间拉扯——他记得上次劈在鳞甲上的手感，记得风堇在侧翼策应的光痕，记得遐蝶将手按在龙额心的那个瞬间。但最清晰的不是战斗。是那头龙低下头的姿势，是那声“姐姐”，是风堇蹲在遐蝶身边裹布条的画面。他们上次没有输。上次他们相认了。\n龙爪撕裂空气。战斗在瞬息间爆发。\n白厄正面接下第一击。剑刃与龙爪相撞的力道将他整条手臂震得发麻，但他没有退。他的剑路比上次更短更险，趁龙的右爪还嵌在石板里，一道弧光斩向它肩胛的鳞甲缝隙。火花四溅，鳞甲没有被劈开，但撞击让龙的头颅偏了半寸。\n风堇从侧翼切入。她没有正面攻上去，而是在龙甩尾的间隙中滑步绕到后方，短杖在鳞甲上连敲三下——每一击都在龙的鳞片上留下一道细密的光痕，像是某种药草灼烧过的印记。\n龙扭头朝她咬下，白厄已经赶到。一剑横在龙牙与风堇之间，剑刃与龙牙相撞，迸出一声刺耳的尖啸。冲击力将他整个人震退了三步，双腿在碎石上犁出两条浅沟。\n“就是现在——”他咬着牙喊道。\n遐蝶已经走到了龙的正面。\n她没有举剑。没有结印。只是抬起手，将那只毫无防备的掌心轻轻按在龙的眉心。龙瞳中的紫色漩涡骤然收缩。那声撼动整座废墟的咆哮没有喷涌出来——它被什么更古老的东西堵在了喉咙里。\n“……姐姐。”\n龙的低吟从胸腔深处挤出来，不是兽吼，是某种被压了太久的人声。白厄握剑的手停了一瞬。他听过这个声音——不是梦，是上次轮回里一模一样的呼唤。龙低下了那颗覆满冰鳞的头颅，额心贴上了遐蝶的掌心。和上次一样，那个姿势不像臣服，像一个太久没见到姐姐的妹妹，终于又靠到了她能认出的体温。\n“玻吕茜亚。”遐蝶的声音很轻，比上次更稳。“上次我跟你说过——你不用一个人扛。”\n龙的眼瞳轻轻闭合。银辉从龙的躯体深处破体而出，塞纳托斯的鳞甲开始片片碎裂。龙的身形在光中逐步坍塌，最后一道残影用额心贴着遐蝶的掌心，停了比呼吸更短的一瞬。\n风堇站在原地，手中短杖垂在身侧。她见过上次这一幕，但这次她没有愣住。她走上前，从药箱带子上解下一条最长的布条，轻轻裹在遐蝶的手背上——那个位置，上次也缠过。动作比上次更熟练，像是重复一个已经做过一次的动作。\n一颗泛着银紫色光晕的火种悬浮在遐蝶面前，无声地旋转。她伸出手，指尖触及火种的那一刻，白厄听到她非常非常轻地，对着已经不存在的龙说了一句话。\n“……下次，我还会来。”\n白厄收剑入鞘。上次他们打赢过，这次也打赢了。上次他们相认了，这次也相认了。他不知道这两次之间隔了什么，但他知道——有些东西没有变。"
paw.43.a: "上次的结局，这次我们又走了一遍"  #觉醒值 -4 | 风堇关系值 +5 | 遐蝶关系值 +5
paw.43.a_tips: "§g白厄望着那颗银紫色的火种，剑鞘在腰间轻轻磕了一下。上次他们在这里相认，这次也是。他不记得所有细节，但他记得那个画面——它不该只是梦，现在他知道它不是。§!"
paw.43.b: "玻吕茜亚——她两次叫了姐姐"  #觉醒值 +1 | 遐蝶关系值 +10
paw.43.b_tips: "§g白厄在废墟中站了片刻，将那个名字在心里默念了一遍。那头龙在两次死亡里都认出了遐蝶，都叫了姐姐。§!"
paw.43.c: "火种回收完毕。这次我们也做到了"  #觉醒值 +4
paw.43.c_tips: "§g白厄将火种小心地封进收容装置。他看了遐蝶一眼，没有出声打扰，只是对风堇点了点头。上次的结局这次被复现了，接下来还有别的泰坦在等他。§!"

paw.40.t: "管理员档案：错误日志（NEW）" #带图片
paw.40.d: "来古士的声音响了起来。彬彬有礼的基底仍然没变，但语调比之前快了几分。\n“玩家阁下。向你致意。”\n“方才的断线事故——排查仍在进行。但事故之后，我发现了一些更值得注意的东西。”\n“还记得第一轮运算结束时，我们讨论过的那两个未经注册的身份标识吗？‘三月七’、‘丹恒’。上次他们被系统强制剔除。这次他们又出现了——而且出现的方式，让我不得不重新审视他们的性质。”\n文字停顿了一行，然后重新滚动，像是正在被实时录入。\n“他们不再是以外部入侵者的身份强行登入的。他们的身份标识仍在系统的校验层上引发警告——但警告只是闪烁，没有拦截。这两个未经我授权的变量，已经通过某种方式被系统识别为合法存在。目前，他们在黄金裔的正式名册上拥有可查询的编号。”\n“……这不是我的操作。权限日志里没有篡改痕迹，数据结构没有被注入的迹象，外围防火墙也没有触发任何关于外部写入的警报。他们就这样融入了翁法罗斯，仿佛从一开始就长在里面。我不清楚这是怎么做到的。作为这套程序的管理员，这不在我的预期之内。但我目前不会介入。”\n文字重新排列，语气恢复了一丝惯常的古典修辞癖好，但措辞之间仍藏着某种被勾起了兴趣的审视。\n“你似乎总会带来一些额外的变量。这让我对你——以及你周围的东西——越来越好奇。”\n文字逐渐变淡。\n“以上是本次日志的全部。继续你的逐火之旅吧，玩家阁下。我会在后台继续观察。”"
paw.40.a: "......"

paw.44.t: "探索水之城"  #带图片
paw.44.d: "斯缇科西亚的废墟从雾气中浮出来，像一艘沉了多年的船终于被退潮交还。\n白厄从奥赫玛出发时看过战报，斯缇科西亚与哀丽秘榭几乎在同一时间陷落。海水在这段往昔里浸泡了太久，如今只剩满城白花花的盐渍。他踏上那条通向城中的石板路，脚下的触感不是石，是壳。无数干涸的贝壳嵌在路面上，被踩碎时发出细微的声响，像在替这座城说“请慢一些”。\n白厄看着那些贝壳——它们不是废墟，是炼金术师的旧居。斯缇科西亚曾以炼金术闻名，这座城的居民将海水、矿物与火种残渣融在一起，炼出过翁法罗斯最精致的药剂和最坚固的城防材料。如今那些炼金釜倒扣在残垣间，釜底结着厚厚一层盐霜。\n城中的主道从正门一直延伸到港口。港口还在，但船全没了。栈桥斜插在水里，铁钉锈成赭色，系船柱上还挂着几截断了的缆绳。\n白厄在一根系船柱前蹲下。柱身上刻着一行已经模糊的字，他用手掌抹开盐渍，勉强认出了几个字——法吉娜。海洋的泰坦。这里曾是它的圣港，炼金术师们在出海前会把最好的药剂倒进海里，作为对它的供奉。而今海水仍在拍打栈桥的残桩，但供奉的人早就不在了。\n他继续往里走，在一间半塌的炼金工坊里翻到了几片残页，边角烧焦了，但字迹还能辨读，记录着某位炼金术师关于火种与水体关系的论述。另一间靠海的石屋里，石壁上刻着褪色的海港记录，其中一行写着“持有火种者，可令海水澄清”。白厄将残页叠好塞进胸甲，沿着石阶往上走。这条路通向斯缇科西亚的最高处，那里只剩一圈残缺的石柱，祭坛早已坍塌，但坛基还在。他踩上最后一级台阶，海风从柱间穿过，刮出一声低沉的呜咽。\n白厄站在空了的祭坛前，将手按在坛基上。那个炼金术师在残页上写，法吉娜的火种可以操控翁法罗斯任何一处的水体——但火种丢了之后，海水便不再是水。是某种被污染的介质。混合着黑潮的残余、驳斥海港的冥河，还有那些再也没有从海港驶出去过的炼金船。这座城供奉了海洋之神一辈子，却在最后一刻被自己的海洋淹没。\n他收好残页，转身走下石阶。这一次，至少他带走了几片纸，一个传说，和一枚可以继续追查的符号。"
paw.44.a: "火种不在废墟里，但线索在"  #觉醒值 +2
paw.44.a_tips: "§g白厄将残页小心折好塞进胸甲。海洋的火种没有留在这座死城里，但它留下了一个方向。他会顺着那个方向找下去。§!"
paw.44.b: "一座供奉海洋的城，最后被海洋淹了"  #觉醒值 +1
paw.44.b_tips: "§g白厄站在祭坛前站了很久。海风灌进石柱之间，声音像一种叹息。这座城把一切献给了海洋泰坦，而海洋泰坦没能——或者没有——保护它。他不知道这是悲剧还是教训，但他记住了。§!"
paw.44.c: "海水变黑——是黑潮污染了海洋，还是海洋本身出了问题？"  #觉醒值 +3
paw.44.c_tips: "§g白厄将手浸进港口的水里，捞起来时指缝间沾着黑色的浮沫。炼金术师在残页上写火种可以澄清海水——但火种丢了之后，水变成了什么？他想起了那片被黑潮淹没的废墟，想起了港口外那片黑色的海面。也许海洋的泰坦，早就不仅仅是失去了火种。§!"

paw.45.t: "忠诚测试"  #带图片
paw.45.d: "斯缇科西亚的废墟在海雾中沉寂了太久。白厄穿过半塌的炼金工坊，正打算折返——然后他闻到了那股气味。\n不是海水的咸，不是盐霜的涩。是血。黄金裔的血。他认得那种金属般的腥甜，曾经在战场上、在伤员的担架上、在哀丽秘榭倒塌的废墟里——每一处黄金裔倒下的地方，都有这种气味。\n他放轻脚步靠到一截断柱后，看见了那两个人。\n刻律德菈站在祭坛残基上，双手交叠搭在身前，姿态仍是奥赫玛女皇惯常的端正。但她的披风边缘浸着暗金色的湿痕，鞋底碾着的不是碎贝壳，是凝固的金色。海瑟音跪在她面前。不是骑士单膝行礼的姿势，是双膝跪在碎石上，肩膀在剧烈地颤抖，握紧的双拳抵着地面，像是在撑着整个人不让自己倒下去。\n“——五百个。”\n海瑟音的声音从喉咙深处挤出来，不像人声，像一把被海水泡了太久的刀。\n“我带来的五百个黄金裔。从北境一路打过来的老兵。你用一条命令让他们全死在这座废墟里——然后你告诉我，这是试炼。”\n她抬起头。那双深紫色的眼睛里蓄满了某种白厄叫不出名字的东西——不是泪，不是怒，是一个信了太久的人终于看到信仰碎掉时的空洞。\n“试炼。以你的名义下的令，我的手替你写的那道通行票，上面盖的是凯撒的印章——他们是因为信你才走进那道光，一个都没回来。现在外面的人都在说是黄金裔背叛了逐火。他们在骂那些死在异乡的老兵是懦夫。你敢让那些人知道——不是黄金裔背叛了翁法罗斯，是你背叛了黄金裔吗。”\n刻律德菈没有说话。她从祭坛残基上走下来，站到海瑟音面前。她的身形娇小，矮了骑士整整一头，但当她抬起手时，海瑟音整个人僵在了原地。\n那只手没有按她的肩。它停在了她握剑的手上，轻轻拍了拍——像一个君王在安抚她的骑士，又像一个将死之人在确认刀刃的温度。\n“我不能。”她的声音很平，平到不像在交代后事，“所以你必须杀了我。”\n海瑟音猛地抬头。\n“你说的对。五百个黄金裔的血已经流了，民愤是必然的——而我就是那个必须被愤怒烧死的人。但你——你不一样。你还有很长的路要走。如果我死了，你可以把所有罪名推到我身上：暴君背叛了黄金裔，骑士处决了暴君。这样，你的手是干净的，那五百个老兵的名声也是干净的。”\n“我没有在问你想不想。我在告诉你——这是最好的棋。”\n“预言里已经写了我该死，那我就死。死在逐火背叛我之前，死在民愤烧到黄金裔之前，死在你——我的骑士，我的手，我最干净的刀——手里。这是我最后一步棋。不是测试你的忠诚，是命令你——用你的忠诚亲手结束我的棋局。然后，去找你自己的律法。”\n“这是命令。动手。”\n海瑟音拔出了剑。剑尖指着刻律德菈的咽喉，在雾气中稳得吓人。但她的手在抖——不是握剑的虎口，是扶在剑柄底部的那只左手。那只手在拼命往下压，想把剑尖压下去一寸、再一寸。\n白厄从断柱后走了出来。\n他的脚步在碎石上踩出声响，海瑟音没有回头，但她的左手指节微微松了一下。刻律德菈的目光越过剑尖，落在这个突然出现的黄金裔身上，既没有惊讶，也没有命令。她只是看着他，像在看一枚没有被列入计算的棋子。\n“黄金裔，白厄。”她念出他的名字，语气像在翻一份突然被风吹开的卷宗。“你不在我的名单上。但我听过你的名字。”\n她顿了顿。\n“这件事与你无关。”\n白厄没有回话。他看着海瑟音手中那把剑，看着那个握剑的人——她的手还在抖。五百个老兵的名字压在那柄剑上，刻律德菈的遗愿压在那柄剑上，她的恨、她的悔、她信了半辈子终于碎掉的东西，全都压在那柄剑上。那柄剑随时可以刺下去。但白厄知道——一旦刺下去，碎掉的不会只有刻律德菈一个人。"
paw.45.a: "你不必一个人承担这一切"  #海瑟音关系值 +10 | 刻律德菈关系值 +5 | 觉醒值 -5
paw.45.a_tips: "§g白厄看向海瑟音，声音不高，却像在海雾中敲了一记低沉的钟。海瑟音没有转过来，但她握剑的手僵住了。片刻后，她垂下了手中的剑，没有看刻律德菈，也没有看白厄。她只是拖着剑从两人之间的空地上走过，步履沉重如铁。刻律德菈望着她消失的方向，闭上了眼睛。她什么都没有说。§!"
paw.45.b: "§R你可以替那五百人杀她§!"  #海瑟音关系值 +15 | 刻律德菈死亡 | 觉醒值 +10 #35天后触发海瑟音失踪事件
paw.45.b_tips: "§g白厄站在原地，五指缓缓地收了又放，然后他侧身退开一步。这是她们两个人之间的命运，他没有资格替海瑟音做选择。剑尖刺入祭坛残基上的那刻，刻律德菈倒在海雾中，嘴角带着一丝极淡的、几乎不能被称作笑的弧度。海瑟音松开剑柄跪坐在地，肩膀不再颤抖了。她没有哭。她只是把剑从祭坛上拔出来，用披风擦干净，插回腰侧。§!"
paw.45.c: "杀了她，只会让你永远活在她的阴影里"  #海瑟音关系值 +5 | 刻律德菈关系值 +10 | 觉醒值 -3
paw.45.c_tips: "§g海瑟音的手剧烈地抖了一下。她想起刻律德菈将她从海底的废墟里拽出来时说过的话——“跟着我，你就不用再选。”但现在，她必须选了。良久，她将剑缓缓收回剑鞘，转身离开，没有再看刻律德菈一眼。刻律德菈在祭坛上站了很久，然后轻声说：“你比她更会选。”白厄没有回答。§!"
paw.45.e: "预言、民愤、棋局——你什么都算到了，就是没算到有人会拦你"  #刻律德菈关系值 +15 | 觉醒值 +5
paw.45.e_tips: "§g刻律德菈怔了一下。然后她笑了——极短促的一声气音，像是在漫长棋局中被一个意想不到的落子逗乐了。“你是第一个敢在我的棋盘上替我落子的人。但我算了太多棋，多到这局棋里没有我自己。”她重新将手交叠在身前，“既然你不让我死，那就让我看看——你能走出什么样的棋局。”§!"

paw.47.t: "深海回音"  #海瑟音与刻律德菈都存活
paw.47.d: "斯缇科西亚的水湾被海雾裹得密不透风。白厄拨开雾气走在最前，刻律德菈和海瑟音跟在身后。他们沿着港口西侧一路深入——越靠近那片水湾，黑潮造物的残骸就越多，像是被什么力量扫过，横七竖八地散在浅滩上。\n“这不是被打败的。”海瑟音蹲下，手指从一具黑潮造物的断口上抹过。“是它们自己解体了。”\n刻律德菈没有停步。她望着雾中若隐若现的微光，将手从披风下伸出，示意两人跟上。\n尽头是一处被礁石半围的浅湾。雾气在这里骤然稀薄——水面上浮动着一层柔和的蓝光，光从水底透上来，将整片水湾映成一块半透明的宝石。黑潮造物围在浅湾边缘，挤成密密麻麻的一圈，却没有一只敢踏入水中。它们只是在岸边焦躁地蠕动、崩塌、重新聚合，像一群被拦在门外的野兽。\n而在水湾中央，那道蓝光的源头，正躺着一个残破的轮廓。\n它曾经或许是巨鲸，或许是某种早已被遗忘的深海造物。如今只剩一具半透明的骨骸，平摊在水面上，如同一座正在缓慢坍塌的殿堂。每一次水波从它身侧荡过，骨骸的边缘就会碎出一小片光屑，沉入水底再也看不见。\n“法吉娜。”海瑟音轻声念出那个名字，像是怕惊扰了什么东西。她走上前，水没过她的靴底，蓝光爬上她的膝甲。“海洋的泰坦。它在这里躺了很久了，久到快把自己还给大海了。”\n泰坦没有回应。但水面上的光颤动了一下——不是风，不是浪，是那具骨骸的深处，还残留着一缕没有完全消散的意识。\n“……海族的末裔。”泰坦的声音不是从骨骸中发出来的，而是从水底、从水面、从每一颗浮动的光屑里同时浮现。它认出的是海瑟音体内流淌的海族之血。“我曾让鱼群随着你的剑游过这片海。你的剑还在，但你身上多了某个暴君的味道。”骨骸的缝隙间，一道更亮的光在缓慢地脉动，仿佛一颗心脏仍在跳动，“她欠我一杯酒。不过死人是喝不到的，所以算了。”\n刻律德菈没有说话。她站在水边，低头看着那具即将散尽的骨骸，双手交叠在身前，站姿端正得像在出席一场葬礼。只有离她最近的海瑟音听到了——她的呼吸停了一瞬。\n“火种还在。”海瑟音说。\n“你就是为了这个来的。”泰坦的光微微震动，水面荡开一圈细密的波纹。“火种可以带走。神权也可以带走。但你得把我的海还给我。”\n白厄站在浅湾边缘，海浪恰好没过他的靴底，又退下去。他看见海瑟音将手探入水中的那团光——然后整个水湾的蓝光开始向她涌去。不是流入，是归位。每一片碎在骨骸边缘的光屑、每一缕在水底漂散的蓝荧，都像被召回的信使般重新收束进她的掌心。那具巨大的骨骸开始片片剥落，落在水面上发出玻璃崩裂的清脆声响。\n泰坦最后的声音从水底浮上来。不再是古老的韵律，只是一个疲惫的东西在卸下最后一重担子。\n“……海交给你了。”\n然后骨骸彻底碎成漫天光屑。蓝光骤缩成一点，悬在海瑟音掌心上方——那颗火种不像火，像一滴被冻在时间里的海水。海瑟音握紧手指，蓝光从指缝间溢出，然后归于平静。\n与此同时，那些围在浅湾边缘的黑潮造物终于越过了水面。但它们失去了聚集的方向，开始漫无目的地四散溃逃。\n刻律德菈从始至终没有说一个字。只在海瑟音捧着火种走回她身边时，微微垂下了眼帘。\n“……你接了她的神权。”她的声音很轻，“现在你是法吉娜了。”\n海瑟音低下头，看着掌心里那滴正在缓缓凝固的蓝光。她想起很多年前，刻律德菈将她从一片废墟里拽出来时说过的话——“跟着我，你就不用再选。”但现在她选了。不是替刻律德菈选，是替她自己选。替那个在海里游了太久、终于找到岸的末代公主选。\n“……我知道。”她说。\n白厄收剑入鞘。浅湾的蓝光已经消散大半，只剩下水面倒映的雾气和三人各自的影子。这一趟，他什么也没带回来——但海洋的火种，已经找到了它该去的地方。"\n
paw.47.a: "法吉娜把海交给了你"  #海瑟音关系值 +10 | 觉醒值 +1
paw.47.a_tips: "§g白厄望着海瑟音手中那颗正在凝固的蓝光。他想起她在废墟里跪着的那个姿势——一个把自己最脆弱的位置全部敞开的人，现在手里握着一整片海。或许这就是她一直在找的东西。§!"
paw.47.b: "泰坦最后那几句话，你也听到了吧"  #刻律德菈关系值 +5 | 觉醒值 +1
paw.47.b_tips: "§g白厄侧头望向刻律德菈。她站在水边，双手交叠在身前，姿态仍是她惯常的端庄。但她的目光始终没有从海瑟音身上移开——那种目光不像君主在看骑士，更像一个人在确认一件太过珍重的东西还没有碎。§!"
paw.47.c: "一颗火种，一片海。这一趟没白来" #觉醒值 +4
paw.47.c_tips: "§g白厄收剑入鞘，望着浅湾散去的光。海洋的火种已经归位，接下来还有别的泰坦在等他。但他决定先在岸边多站一会儿——这片海，以后不会再是黑色的了。§!"

paw.48.t: "深海回音" #白厄单独行动
paw.48.d: "斯缇科西亚的海雾今夜比前几日更浓。白厄独自一人，握紧剑柄循着黑潮造物的轨迹穿过港口废街，朝水湾的方向摸去。越往前走，聚集的黑潮造物就越多。\n它们没有发现他。不是他藏得好，是它们根本不在乎。成百上千只黑潮造物挤在浅湾边缘，一层叠着一层，像一道由腐败血肉筑成的堤坝。它们的视线全部朝向同一个方向——水湾深处那团若隐若现的蓝光。\n白厄伏在一截倒塌的栈桥桩后，屏住呼吸。水湾中央的蓝光在水底脉动，每一次闪烁，岸边的黑潮造物就往前涌一步，又被某种无形的力量推回去。蓝光旁边，隐约还蛰伏着一具半透明的巨兽骨骸。那不是黑潮造物。那是某种更古老的东西。\n但他没有机会看清楚了。\n栈桥桩发出了一声轻微的崩裂——不是他的脚踩到了什么，是蛀空已久的木料终于撑不住海风的侵蚀。声量不大，但在黑潮造物过于密集的寂静里已经足够。离他最近的那几只瞬间转过头来。然后是十几只，然后是整片浅滩上所有的黑潮造物。它们终于发现了有人闯进了它们的聚集地。\n白厄拔剑。劈开第一只、躲过第二只的扑咬、翻身刺穿第三只的核心。同时他在心里飞快地算了一下数量——只算能看到的，至少几百只。他的体力只够打几十只。差距不是靠意志能填平的。\n他连退了数步，踩上一块松动的礁石，稳住被震麻的手腕。浅湾深处那团蓝光仍在脉动，但他已经看不清了。黑潮造物组成的城墙正朝他压来，每一只都只挡在蓝光前面，像在守住什么不容生人靠近的东西。\n“……还没到时候。”他低声道。然后收剑，转身，在浓雾的掩护下退出了港口。\n回到栈桥的废墟边时，他终于能停下来喘口气。从水囊灌了两口水，把剑刃上沾的黑尘在水洼里洗掉。胸口那些被爪尖蹭过的擦伤浅浅一层，不重，洗一下就好。水湾深处那团蓝光——不管那是什么，他记住了。等做好更充分的准备，他会再回来。"
paw.48.a: "等准备好了，我会再来的"  #觉醒值 +2
paw.48.a_tips: "§g白厄望着海湾方向，将剑刃上的黑尘甩净。这次他连那团蓝光是什么都没来得及看清——但他记住了位置，记住了黑潮造物的分布，下次不会这么容易被发现。§!"
paw.48.b: "水底那团蓝光——那到底是什么？"  #觉醒值 +3
paw.48.b_tips: "§g白厄靠在残柱上，闭上眼回放在水湾边缘看到的画面：黑潮造物不敢越过那道无形的线，蓝光在水底脉动，骨骸的轮廓若隐若现。那不是普通的东西。也许正是他一直在找的线索。§!"
paw.48.c: "差一点就回不来了"   #觉醒值 -1
paw.48.c_tips: "§g白厄擦了擦剑格上沾的汗，才注意到自己握剑的指节仍然绷得泛白。几百只黑潮造物——他能全身而退已经是运气。下一次，得带上更多的人。§!"

paw.49.t: "圣城之变"  #第二轮回开始一段时间后自动触发，无需任何国策前置 #带图片
paw.49.d: "消息是传令兵拼死带出来的。\n白厄接到急报时，传令兵的战马已经累得几乎站不稳。那封蜡封上盖着元老院的印章，内文却是阿格莱雅的亲笔——不是诏书，是求救。字迹潦草，墨迹被水渍晕开了几处，最后一行写了一半就断了。\n“元老院叛变。我被囚。黄金裔——全体——危险。”\n他再往下翻，另夹着一封黄金裔幸存者发出的战报。战报写得很急，字迹比阿格莱雅那封还乱，但关键信息都在：\n元老院代表凯妮斯在元老院紧急会议上发动政变，以“黄金裔纵容恶性社会事件持续发酵”为由，当场宣读了对黄金裔领袖阿格莱雅的拘捕令。罪名不止一条——疏于城防、包庇内乱、滥用逐火之名煽动民心。凯妮斯站在议事厅的石阶上，一字一字念完了那份早已准备好的判决书，然后挥手。奥赫玛的卫兵——那些本该守卫圣城的士兵——听从元老院的命令，当场将阿格莱雅押入禁室。\n同时，凯妮斯对外宣布了另一件事：元老院手中握有三枚火种。不是黄金裔回收的火种，是元老院自己封存的火种。她当着所有元老的面说明，这三枚火种不会被用于逐火之旅，而是用于防止黄金裔完成逐火之旅。只要元老院握着这三枚火种，逐火就永远不可能成功。\n消息从奥赫玛向外扩散。卫兵开始在大街小巷搜捕黄金裔。圣城的训练场、营房、圣殿偏厅逐一被封，所有被列为“黄金裔”的人都必须在日落前到广场集合——不是接受质询，是被带走。据逃出来的传令兵转述，广场上被抓的黄金裔至少有三十余人，更多的还在被追捕。\n白厄将那两封信叠在一起塞进胸甲下的口袋里，上了马，直奔奥赫玛。从路标到城墙的距离似乎比上次更远。他伏低在马上不断回想凯妮斯那句“我不会把火种给你们”，还有阿格莱雅没写完的那半行字——然后他攥紧了缰绳。\n不管那三枚火种是不是真的，不管凯妮斯到底想拿它们换什么——阿格莱雅还在禁室里，广场上还有三十多个被抓的同袍。而他手里只有一把剑。\n够了。"
paw.49.a: "时间紧迫"
paw.49_tips: "§R必须尽快营救阿格莱雅，否则她很有可能死亡§!"

paw.50.t: "争分夺秒"  #带图片
paw.50.d: "白厄在深夜潜入了奥赫玛。\n他没有走正门。城墙东南角有一处旧排水道，是上次在圣城闲逛时偶然发现的——那时他只是在看普通人怎么过日子，从没想过有一天会用到这条路。他从排水道钻出来时，身上沾满了青苔和冷泥，但脚步没有停。\n奥赫玛的夜晚和离开前完全是两座城。广场上燃着元老院卫兵的火把，火光照在石板路上，把每一道裂缝都照得清清楚楚。他在阴影中贴墙疾走，路过训练场——门锁了，封条上盖着长老院的印章。路过黄金裔的营房——窗户黑着，门前的岗哨站着两个卫兵，长矛交叉挡在门口。\n他在营房对面的巷子里蹲下，脊背紧贴着冰凉的石墙。\n有人说过，黄金裔的职责是逐火。火种是逐火的一切。凯妮斯手里握着三枚——三枚火种，在她那里就只是锁链，锁死逐火之路的最后一道门。\n但广场上被抓的三十多个人也是真的。他路过广场时看到了那些被押着的背影，有些他叫得出名字——在训练场上见过、在传令兵的简报里听过。他们的手被绑在身后，被卫兵推着往禁室的方向走。\n阿格莱雅现在就在那里面。\n白厄按住剑柄，指节缓缓收拢。他知道自己必须做点什么，也知道无论先选哪一边，另一边都可能在他赶到之前崩塌。如果先去夺火种，凯妮斯会把它们转移到更深处，元老院的地下密室不是靠剑能撬开的。如果先去救人，元老院会在他撬开禁室的时间里把火种藏得更远——远到这一轮逐火再也碰不到。\n两边的路都在变窄。\n他在墙上靠了片刻，手指在剑柄上轻轻摩挲。那个从他醒来便一直压在肩上的注视——那个看不见的、来自更高处的存在——此刻就伏在他的肩侧，和他一同看进这片被火把撕裂的夜色。\n他不知道该往哪走。但他知道自己必须选。"
paw.50.a: "必须做出抉择"

paw.51.t: "相信丝线"  #带图片
paw.51.d: "白厄是在潜入禁室区的途中收到那条信息的。\n不是传令兵，不是信鸦，是一道极其清冽的嗡鸣，一截一截地落进他右前方的石砖缝里，极轻极短，像是缝衣针穿透织物的声响。白厄本能地贴紧墙壁，手已经按在剑柄上——然后他看清了来者。它从走廊尽头的阴影中走出来，金属构造，身形修长，通体流转着与阿格莱雅发色相仿的金绿色微光。白厄此前只在正式仪典上远远望见过它，但阿格莱雅对它的存在从不遮掩——这是她的忆灵，「衣匠」。既是与她协同作战的搭档，也是改衣师手中最可靠的一根针。\n衣匠在他面前两步处停下。它的手轻盈地翻开了，指尖的金属展开成一只极小的暗袋。暗袋里没有信，没有羊皮纸，只有一张被裁得整整齐齐的旧布片，布边已经被摩挲得微微发毛。白厄接过布片——上面绣着几个字，字迹端正，收针处微微上挑，是阿格莱雅亲手绣上去的笔迹：\n“不必先来救我。去东北角旧档案库，走廊尽头左转。那里关了七个人，钥匙在第三个卫兵身上。”\n白厄攥紧布片。他记得阿格莱雅最得力的传信工具是她的金线，但如今她的人被囚在禁室里，唯有衣匠可以穿过层层封锁悄无声息地替他指路。他抬头望了一眼通往禁室的方向——阿格莱雅就在那里。但他信这个衣匠，信她绣在旧布片上的每一个字。他将布片重新折好塞进胸甲，转身朝东北角疾步走去。\n接下来的半个夜晚，衣匠一次又一次地掠过他的身侧，每一次都会留下同样柔软的布片，每一次都指向不同的方向。旧档案库的钥匙果然在第三个卫兵身上，七名黄金裔被蒙着眼锁在档案库里，身上没有伤，只是被断了金血与外界的联系，无法自行脱逃。衣匠替他完成了精细的侦察——每一张布片上都标着路线、守卫人数与换岗间隔，而他对它绝对信任，按每一个指示逐个击破、解开囚禁锁，再将人引向排水道的出口。\n训练场的武器库。圣殿偏厅。面包房后的老井窖。每一处监禁点都被衣匠标得清清楚楚，它的针从不指向白厄无法抵达的位置，只在真正能救到人的地方轻轻落下一截嗡鸣。\n最后一个人是从广场旁的石屋里救出来的。白厄拉开铁门时，衣匠正站在石屋外墙上，用针尖抵着门锁替他将锁芯卡准角度。门内的年轻黄金裔抬起头，手腕上还缠着锁，脸上带着不相信有人会来的表情。白厄将他拽出来，推向排水道的方向，然后靠在石墙上喘了口气。\n三十多个同袍。全都活着。\n衣匠最后一次落在他身旁的石阶上，没有再递布片。它只是立在那里，对着白厄微微点了点头——那个动作很轻，却像一根针终于绣完了最后一针，将整幅图案收进了缎面里。然后它转身，无声地滑入了走廊深处，朝禁室的方向退了回去。白厄没有追。他救出了所有人——除了派衣匠替他指路的人。她还坐在禁室里，指尖的针仍在黑暗中闪着微光，一针一针地替他绣完了今晚所有生还的道路。"
paw.51.a: "她把生路绣给了所有人，只留了自己"  #阿格莱雅关系值 +10 | 觉醒值 -4
paw.51.a_tips: "§g白厄站在石墙边，望着衣匠消失的方向站了很久。那个被称为黄金裔领袖的改衣师，把自己锁在了笼子里，却替所有被囚的人绣好了钥匙。§!"
paw.51.b: "有她的衣匠在，奥赫玛就没有真正的牢房"  #阿格莱雅关系值 +5
paw.51.b_tips: "§g白厄低头看了一眼自己的手掌——布片已经被他攥得汗湿了，但上面的绣字一个都没有化开。只要阿格莱雅还在禁室里绣她的路线，奥赫玛的牢房就锁不住任何人。§!"
paw.51.c: "人都救出来了，必须趁早拿到火种"  #觉醒值 +3
paw.51.c_tips: "§g白厄收回视线，将剑鞘往腰间紧了紧。三十多个人已经安全送出排水道，但元老院仍然握有火种，必须夺回来。凯妮斯以为火种是她的筹码——但筹码只有握在手里才有用。§!"

paw.52.t: "夺取火种"  #带图片
paw.52.d: "元老院的走廊里弥漫着一股混合了血与焦尘的气味。白厄推开那扇半掩的铁门时，走廊上已经横七竖八倒下了数个卫兵，一些还在呻吟。他没有犹豫。\n每一道走廊的卫兵他都解决得很快。元老院的护卫不是黄金裔，他们没有金血的加持，只有数量。而数量在狭窄的走廊里发挥不了作用。最后一个卫兵倒下时，白厄的剑刃上已经沾满了暗金色的血痕。\n铁门被踢开。地下密室，石台上放着三枚火种，微弱的火光照在四壁的档案架上，将那些封存已久的卷宗映成一片暖金色。凯妮斯站在石台前。她拄着那根铜箍木杖，白发在烛火下泛着冷光，那双黑曜石般的眼睛没有看着火种，而是看着白厄。她的嘴角微微往上牵了牵，不是笑，是某种不太明显的确认。\n“——我猜到你会来。”她说，“只是没想到你杀穿了整条走廊才到。”\n木杖轻轻敲了一下石板。她环视四周被砍倒在地的卫兵，语气中既无愤怒也无讽刺。“黑潮不是最大的敌人。你知道我为什么讨厌你们吗？不是黄金血肮脏，不是逐火是骗局——是你们从来不肯在拿到火种之前转身回去。”她将木杖横在身前，“你觉得自己在走自己的路——但你走的每一步，都在把我这辈子费尽心思阻止的东西往前推。”\n凯妮斯没有退让。她只是拄紧了木杖，像一座不愿被搬动的旧石像。“你可以拿走这三枚火种。但拿走了，你离终局就近了一步。我拦你，不是因为我不怕死，是因为我从上辈子就干这一行——用刀阻止他们来不及阻止的事情。”\n她没有力气再打过他。她从不是剑士，从来都不是。但她的木杖仍然稳稳地挡在石台前，挡在一个她已经知道拦不住的人面前。\n“——现在你还要走吗。”"
paw.52.a: "让开，我只要火种"  #火种已夺取 | 凯妮斯存活 | 觉醒值 +4
paw.52.a_tips: "§g白厄将剑横在凯妮斯面前，刃面上映出她那双仍未闭上的眼睛。他没有刺，只是用剑脊将她拨到一旁，伸手从石台上取走了三枚火种。凯妮斯撞在档案架上，脊背磕出沉闷的声响，但她没有出声。他转身走出地下室，火种在掌心烫得几乎握不住。§!"
paw.52.b: "杀死凯妮斯"  #火种已夺取 | 凯妮斯死亡 | 觉醒值 +8
paw.52.b_tips: "§g“从你试图阻止所有人那一刻起，你就没有资格活着。”凯妮斯低下眼，木杖轻轻磕了一下石板。她的肩膀松了，似乎这一剑之后，她终于可以不用再挡在任何东西前面。白厄拔剑，收剑。火种的光映在石壁上，三枚，安静地亮着。§!"

paw.53.t: "必要的代价"  #杀死凯妮斯后触发 #带图片
paw.53.d: "从元老院地下密室走出来时，剑刃上的血还没干透。\n白厄在走廊尽头停住，就着衣摆慢慢擦剑。动作很稳，和训练场上一样精准。这一路杀进来，倒在这柄剑下的卫兵不在少数，那些人的脸已经模糊了。但刚才那一剑不一样——被刺穿的不是某个无名守卫，是凯妮斯。元老院的代表，政变的发起者。\n不必杀她。这个念头浮上来，很轻。她已经让开了，木杖从来不是威胁。只需用剑脊拨开就能拿走火种。\n然后另一个念头升起来，更沉。就是这个人囚禁了阿格莱雅，签发了搜捕黄金裔的拘捕令，当着长老院的面宣读罪名，把三十多个同袍关进了禁室和档案库。禁室里将灭未灭的油灯，衣匠瘫在地上的残骸，阿格莱雅手腕上禁魔锁勒出的淤青——每一桩都盖着她的印章。\n白厄将擦净的剑插回鞘中。杀的不是什么无辜老人，是政变的元凶。之前倒下的那些卫兵不值得记住，但这一个值得——不因为是第一个叫得出名字的人，是因为确实该死。\n三枚火种收在匣中，安静地亮着。跨过倒下的位置时没有低头，靴底踩在石板上，每一步都实。已经说服自己了。\n只是在踏上第一级台阶时，握剑的手指不自觉地碰了碰剑柄上那块被木杖磕过的位置。"
paw.53.a: "罪有应得"
paw.53.a_tips: "§g白厄在台阶尽头停了一拍。罪有应得。对自己说了一遍，又说了一遍。然后推开地下密室的铁门，门外是奥赫玛正在燃烧的夜空。§!"

#杀死凯妮斯之外的角色会大幅降低与其他所有角色的关系值

paw.54.t: "重返树庭"  #相信丝线 #带图片
paw.54.d: "白厄推开那扇半掩的实验室门时，那刻夏正站在蒸馏瓶前翻一本被腐蚀了大半的笔记。淡绿色的马尾垂在肩上，眼罩遮着左眼，露出的那只淡蓝色眼睛甚至没有从纸面上移开。\n“你要是来叫我那刻夏，现在就可以出去了。”\n白厄还没开口，话就被堵了回来。\n“……我是来请你帮忙的。元老院政变，阿格莱雅被囚，黄金裔——”\n“我知道。”那刻夏打断了他，“衣匠已经来过一次了。”他终于从笔记上抬起眼，淡蓝色的瞳孔在白厄身上扫了一个来回。“不过你不是先来的。你先去了禁室区。救了多少人？”\n“三十多个。都送出城了。”\n那刻夏没有说话。他将手中那本被腐蚀了大半的笔记扣在桌面上，又从抽屉里取出几卷图纸塞进腰间的皮筒里。“我这里有神悟树庭封存的部分泰坦研究档案。圣城现在的乱局，我可以协助你们制衡元老院的武力。”\n白厄还没来得及说出准备好的说服词。那刻夏已经将最后一份笔记收入怀中。\n“……阿格莱雅那女人，关在禁室里还能织出这么多花样。”他走到门边，回头看白厄还站在原地，语气忽然恢复了一贯的讥讽。“愣着干什么？你不是来搬救兵的——走吧。”\n他率先推开门。白厄望着那个消瘦的背影，想起阿格莱雅在禁室里绣给他的那句话——‘找到那刻夏，然后相信他’。她没写要说服多久，因为她知道不需要说服。"
paw.54.a: "你连条件都没提"  #那刻夏关系值 +5
paw.54.a_tips: "§g白厄跟上那刻夏的步伐，语气中带着一丝困惑。那刻夏头也不回，语气仍旧是惯常的讥讽：“提条件？你先把元老院那群蠢货从我的树庭视线里挪开，就是最好的条件。”§!"
paw.54.b: "阿格莱雅说你很难搞。看来她错了"  #那刻夏关系值 +10
paw.54.b_tips: "§g那刻夏停下脚步，回过头，露出的那只淡蓝色眼睛盯着白厄看了片刻。“她没错。我只是不想让她在禁室里待太久——毕竟欠她一份实验数据没交。”他说完转过身继续走，马尾在肩头甩出一个利落的弧度。§!"
paw.54.c: "有你这句话就够了，走吧"  #那刻夏关系值 +5 | 觉醒值 +2
paw.54.c_tips: "§g白厄将剑鞘往腰间紧了紧，迈开步子跟上那道消瘦的背影。那刻夏没有再多看他一眼，但脚下踩过石板路的力道，比方才推门时更利落了一些。§!"

paw.55.t: "重返树庭" #夺取火种  #带图片
paw.55.d: "白厄推开那扇半掩的实验室门时，那刻夏正站在蒸馏瓶前翻一本被腐蚀了大半的笔记。淡绿色的马尾垂在肩上，眼罩遮着左眼，露出的那只淡蓝色眼睛甚至没有从纸面上移开。\n“你要是来叫我那刻夏，现在就可以出去了。”\n白厄没有回应这句老台词。他走进实验室的脚步比平时更沉，靴底落在地面上发出几声闷响。那刻夏翻笔记的手指停了一瞬——不是因为他被脚步声打扰，而是他闻到了一股气味。不是汗，不是尘，是血。血腥味很重，重到连实验室里的蒸馏药剂都盖不住。\n但他的眼罩没有抬起。他只是微微侧了一下头，那只露出的淡蓝色瞳孔在白厄身上缓缓扫过——从衣摆上凝固的暗金色污渍，到剑柄上还沾着的碎屑，到他的脸。然后他没有说“你受伤了”。他说的是另一句话。\n“……你身上还带了别的东西。”\n白厄的眉心动了一下。\n那刻夏放下笔记，转过身，双手撑在桌沿上，淡蓝色的瞳孔定在白厄脸上。不是审视，不是讥讽——是一种学者在盯着样本时才会有的、毫不避讳的直视。\n“不是血。血我闻得出来。是别的——像你把某条走廊上的空气整个换了一遍，然后带回来的不是空气，是某种更重的东西。”他说话的语气比平时更慢，仿佛他正在一边说一边在心里给某种未知的东西做笔记。“黄金裔杀人的事我不陌生，但你这次身上挂着的不只是人的血，还有别的——某种让人不舒服的味道。不是腐败，不是黑潮，是——我不确定。但我猜你也不知道你带了什么回来。”\n他顿了顿，摘下了眼罩。那只被遮住的左眼并不吓人，只是眼白里布着几道极细的红色纹路，像是长期盯着某种刺目的东西留下的。他用这只眼睛又看了白厄一下，然后重新戴上眼罩。\n“……确定了。你身上确实挂了些连你自己都看不到的东西。我不确定那是什么，但我确定我不想跟它一起走路。”\n白厄的指节在剑柄上缓缓收紧，脸上看不出太多表情。那刻夏转身从桌角拿起一瓶标有炼金符号的药剂，放在桌上推向白厄的方向，但手指没有离开瓶身。\n“——你去奥赫玛救人。用这瓶破魔溶剂，能把禁室区的锁化成一滩烂泥。火种——你不会从我这里拿到。但等你到了，我也许会带着它出现在禁室门口。”"
paw.55.a: "……好。那就禁室门口见"  #那刻夏关系值 +5 | 觉醒值 +1
paw.55.a_tips: "§g白厄接过桌上的药剂瓶，手指在瓶身上收紧。他没有反驳那句“你身上挂了别的东西”，没有替自己辩解——不是不想，是不知道怎么辩解。他转身走出实验室，走到门口时，那刻夏的声音从背后追上来。§!"
paw.55.b: "§R杀死那刻夏§!"  #那刻夏死亡 | 火种已夺取 | 觉醒值 +10
paw.55.b_tips: "§g剑锋从背后没入，白厄沉默着拔出剑，没有低头看。那刻夏伏倒在自己的实验桌上，侧翻的酒瓶流出琥珀色的液体，顺着桌沿一滴一滴落在地面上。白厄从他怀中取出火种，没有再看那具还在微微抽搐的身体，走出了实验室。§!"
paw.55.c: "那东西——我身上挂的是什么"  #那刻夏关系值 +5 | 觉醒值 +2
paw.55.c_tips: "§g白厄没有接药剂瓶，也没有拔剑。他站在原地，声音比平时更低，“你看得出来。告诉我。”那刻夏偏过头，露出的那只淡蓝色瞳孔里闪过一丝白厄从未在这个人眼中见过的东西——不是嘲讽，是一丝极淡的、被压得很好的凝重。“……不。现在告诉你，你也不会信。”§!"

paw.56.t: "不可视之手"  #杀那刻夏后触发 #带图片
paw.56.d: "实验室里弥漫着药剂与纸张混合的气味。\n白厄握着剑站在那刻夏倒下的桌案前。蒸馏瓶翻倒了，琥珀色的液体顺着桌沿往下淌，一滴一滴落在地面上。那刻夏伏在桌上，淡绿色的马尾从肩侧滑落，沾上了正在扩散的药液。眼罩的系带松了，那只布满红色纹路的左眼半睁着，瞳孔已经散了。\n白厄看着那只眼睛，又看着自己握剑的手。\n他不明白自己为什么拔剑。那刻夏已经把破魔溶剂搁在桌边了，手指还没从瓶身上松开。他说过不会给自己火种，但他说过会带着火种出现在禁室门口。他只是不想和自己同行。就因为这个，就拔剑杀了他？这不是理由，这不是任何一个能说服活人的理由，但自己的手就是这么做了。在转身接药剂的那个瞬间，剑比思考更快。\n像有人替自己做了这个决定。\n白厄将剑刃上的血在那刻夏的笔记上擦净。动作很稳，和在元老院地下密室里擦剑时一样稳。但擦完之后握剑的手指没有松开——它们在剑柄上攥得发白，像是怕这双手不攥紧就会再去做什么自己不想做的事。\n那刻夏说过什么来着。“你身上挂了别的什么东西”，“某种连你自己都看不到的东西”。那时只觉得这个遮了一只眼的炼金术师在胡言乱语，但现在那把剑不在任何人手里，在自己手里，自己却确定那一剑不是自己想刺出去的。\n不是自己。是肩上趴着的那个东西。那道从最开始就伏在那里的视线——它从来不说话，从来不出现，但每次拔剑的时候它都在。不是在帮他拔剑，是在替他拔剑。它把他的手推了出去。\n这个认知像一块冰从喉咙滑进胃里。握剑的手指松了一下，剑鞘磕在桌腿上发出一声闷响。那东西在自己身上。它越来越近了。它已经不是旁观者了。而自己刚才那一剑刺出去时，没有任何犹豫。\n但另一个念头升起来。万一那刻夏真的不来了呢。这个念头很冷，很清晰，不像刚才拔剑时那种失控的冲动——这是自己想的，不是被推的。万一他不来怎么办？万一正好缺他那枚火种怎么办？\n白厄将剑插回鞘中。杀了一个不想和自己同行的人，杀了一个嘴上刻薄但已经把破魔溶剂搁在桌上的人。但如果他带着火种不来——如果就差他这枚火种——如果逐火之旅因为自己放过了这个人而功亏一篑——那又是谁的错？自己的。不是肩上那个东西的。是自己心软放过了他，却没能放过那些死在黑潮里的同袍。\n火种从衣襟内侧取出时，它还带着那刻夏的体温。白厄将火种收进收容匣，跨过倒下的蒸馏瓶，没有低头。已经说服自己了。只是在推开实验室的门时，握剑的手不自觉地翻过来看了一眼掌心——没有血，没有脏东西，什么都没有。那东西在自己身上，它不流血，它不出现，它只是在自己不想杀人的时候替自己拔剑。而自己甚至没有力气去恨它。因为自己不知道下一次它替自己拔剑时，刺向的会是谁。"
paw.56.a: "那东西……到底是什么"  #觉醒值 +2
paw.56.a_tips: "§g白厄将剑柄攥得发白。那刻夏说他身上挂了东西时，他以为是学者的怪癖。现在他不确定了。那东西在他身上，他控制不住它，他甚至不知道自己什么时候会再被它推出去。§!"

paw.57.t: "被信任的资格"  #相信丝线 #带图片
paw.57.d: "城外的临时营地里燃着几堆不大的篝火。白厄赶到时，缇宝正蹲在一张摊开的地图前，火光映在她刘海高高的额头上，将那双紫蓝色的眼睛染成暖金色。缇安从她左肩探出半个脑袋，缇宁安静地坐在右侧，花瓣般的刘海覆着眼帘。\n“小白！”缇安最先发现了他，从地图旁蹦起来，“缇宝缇宝——小白回来啦！”\n缇宝抬起头。她没有像往常那样露出轻快的笑容，只是放下手中的炭笔，站起身，示意白厄走到地图前。\n“你来之前，我们已经联络上了所有还能联络的人。”她指向地图上奥赫玛城外东南角的一处标记，“阿格莱雅被囚之前，通过衣匠把我们提前送了出来。元老院现在还不知道我们在城外有多少人。”\n“有多少。”白厄问。\n“够打。”缇安抢答。缇宁在旁边轻声补了一句：“……但不够稳。”缇宝点点头，将炭笔搁在地图边沿。\n“小白，我们三个人能开很多扇门，能把消息送到翁法罗斯任何一个角落——但我们三个不能指挥打仗。缇安会迷路，缇宁会沉默，我会犹豫。”她顿了顿，“你不是我们。你从哀丽秘榭一路打到奥赫玛，你在黑潮面前不会退，在泰坦面前不会跪。军队需要一个能站在最前面的人——那就是你。”\n她从怀中取出一枚小小的黄金徽章，放在地图中央。那是黄金裔部队的指挥令符，上面刻着奥赫玛的城徽，边缘已经被摩挲得微微发亮。\n“三十多个被你从城里带出来的人都在这。他们说，是你一个一个推开牢门把他们的禁魔锁解开，是你带着他们在排水道里摸黑爬了半个奥赫玛，把他们送到安全的地方。他们信你——我们也信你。”\n缇安用力点头。缇宁轻轻“嗯”了一声。白厄低下头看着那枚徽章。然后他伸手拿起地图中央那枚黄金徽章，指节收紧。\n“……时机一到，立刻进攻。”\n缇宝望着他，嘴角终于弯起那个久违的、像清晨鸟鸣般的弧度。“好。等你的信号。”"
paw.57.a: "你们把指挥权交给我——我不会辜负这份信任"  #缇宝关系值 +5| 觉醒值 -5
paw.57.a_tips: "§g白厄将指挥令符按进掌心，指节收得很紧。缇宝望着他那双没有动摇的眼睛，那双紫蓝色的眼瞳轻轻弯了起来。“我们从来都没怀疑过呀。”§!"
paw.57.b: "这么多人的信任，你有压力吗？"  #缇宝关系值 +10 | 觉醒值 -5
paw.57.b_tips: "§g缇宝眨了眨眼，然后笑了。缇安从她肩后探出头来替她回答了：“她呀，给你之前压力可大了——在帐篷里转了四圈才把徽章拿出来呢！”缇宁轻轻扯了扯缇安的衣角，但嘴角也翘了起来。§!"
paw.57.c: "这场仗——必须打赢" #觉醒值 +2
paw.57.c_tips: "§g白厄将炭笔从地图边沿重新拾起，在自己熟悉的城防线上划了一道。缇安凑过来看，缇宝退后半步把位置让给他，缇宁安静地将油灯往地图方向挪了半寸。§!"

paw.58.t: "不被信任的代价"  #夺取火种 #带图片
paw.58.d: "城外的临时营地里燃着几堆不大的篝火。白厄赶到时，缇宝正蹲在一张摊开的地图前，缇安和缇宁一左一右靠在她的肩侧。听见脚步声，缇安最先抬起头——然后她脸上的笑容顿了一下。\n“小白。”缇宝站起身，声音比平时低了几分。她的目光在白厄身上停了一下——不是看脸，不是看剑，是看他的眼睛。那双眼睛仍旧坚定，仍旧没有犹豫，但里面少了某种她上次见面时还在的东西。缇安悄悄挪到了缇宝身后。缇宁沉默着，将地图从地面缓缓卷起。\n“……你做了不一样的选择。”缇宝说。声音很轻，没有质问，没有指责，只是在陈述一个她亲眼确认的事实。“那些人没有从禁室里出来。三十多个人——元老院现在还关着他们，现在城里守得更严了。我们也试过撞开那些门……但我们三个人打不开那种锁。”\n她抬起眼，那双紫蓝色的眼睛望着白厄，不是疏远，是某种她不太愿意说出口的不确信——这个人站在那里，还是那个从黑潮里劈出一条路的黄金裔，还是那个她们异口同声叫着“小白”的人。但有些东西不一样了。不是变坏了，不是变弱了，是变得离她们远了一步。\n缇安从缇宝身后小声说：“你好像……变了。”缇宁抱着卷好的地图轻轻补充：“不是说你是坏人……只是不像以前那个小白了。”\n白厄没有回应关于“变了”的话。他伸手从胸甲内侧取出那几枚从元老院地下密室里夺来的火种，摊在掌心。火种微弱的金光映在他的指节上，也映在缇宝骤然收紧的瞳孔里。\n“我从元老院手里夺回了火种。”他说，“我没有放弃逐火。我选的是火种——火种是一切。”\n缇宝没有说话。她看着那几枚火种，看着它们在他掌心里安静地亮着，然后她的目光缓缓移到他的脸上。那双紫蓝色的眼睛里没有惊喜，没有赞许，只有一种安静的、从心底涌上来的冷。不是愤怒，是比愤怒更难形容的东西。\n“……火种是一切。”她重复了一遍。她的声音没有升高，但缇安缩到了她身后，缇宁垂下头。\n“所以你为了这些火种，把三十多个人留在了元老院的牢房里。你没有去救他们。你有能力——你有一整条走廊的卫兵都挡不住你——但你没有推开禁室的门。你把门推开的力气，用在了别的地方。”她停了一下，“你夺回了火种。但你把他们丢下了。”\n缇安从缇宝肩后探出半张脸，声音比任何时候都小：“小白以前不会这样的……”缇宁没有出声，但她把地图抱得更紧了。\n缇宝将地图重新按在地上，不让风把它吹走。“在阿格莱雅被救出来之前，我们手里的火种不会交给任何人。包括你。”她看着白厄，那目光不是恐惧，不是警惕，是一个见过太多人变了的“千面圣女”，在用她仅剩的清醒，判断眼前这个人还值不值得把最后一块拼图交到他手里。\n“你可以留下来等。也可以先走。但指挥权不会交给你——我们需要的是能把那些人带回来的人，不是只把火种带回来的人。”"
paw.58.a: "我明白了。火种先留在你们手里"  #觉醒值 +2
paw.58.a_tips: "§g白厄将掌心的火种重新收回胸甲内侧，没有再多说一个字。他将剑鞘往腰间紧了紧，转身朝营地外走去。缇安从他身后探出头来，望着那个背影。“……他会回来吗？”缇宝没有回答。缇宁将地图重新摊开，手指轻轻落在禁室区的标记上，没有出声。§!"
paw.58.b: "§R杀死缇里西庇俄丝§!"  #火种已夺取 | 军队指挥权已夺取 | 缇宝、缇安、缇宁死亡 | 觉醒值 +12
paw.58.b_tips: "§g缇宝几乎没有发出声响。只有剑锋没入时她轻轻松开了手中的地图，像松开一片被风吹远的羽毛。缇安和缇宁在尖叫中扑过来——然后是第二剑、第三剑。白厄从缇宝松开的手指间接过那枚火种，将黄金指挥令符从她的衣襟内侧取出，握在掌心。§!"
paw.58.c: "指挥权我不要，火种也可以先留在这里，但元老院不会等我们"  #觉醒值 +1
paw.58.c_tips: "§g缇宝望着他，紫蓝色的眼瞳里有什么东西松动了一下。她重新摊开地图，将炭笔搁在奥赫玛禁室的位置。缇安从肩后探出头来，看看白厄又看看缇宝。缇宁轻声开口，声音比平时更慢，却也更稳：“我们知道元老院不会等。但我们也不能什么都没准备好就去。”§!"

paw.59.t: "冰冷的手"  #杀缇宝后触发 #带图片
paw.59.d: "营地里很安静。篝火还在烧，地图还摊在地上，炭笔滚到了帐篷边缘。缇宝躺在那里，像一片被风吹落的羽毛，缇安和缇宁一左一右倒在她身侧。白厄将剑刃擦净，把火种和指挥令符收进怀中。\n然后看着自己的手，忽然不确定它们是不是自己的了。\n杀凯妮斯的时候，还能告诉自己她罪有应得。但这一次没有。没有失控的冲动，没有突然变沉的手指，没有谁在背后推。是自己走到她们面前，自己拔的剑，自己刺下去。从头到尾，每一步都是自己选的。\n白厄在篝火前蹲下，将缇安滚落的炭笔捡起来。她和上次在树庭的石板路上抢树枝时一样轻，但现在不再有另一个她来抢了。三个她一起消失了。而自己是杀死她们的人——刚刚才意识到这件事。\n不是愧疚。是困惑。为什么杀了她们之后心里什么都没有。以前在隘口和黑潮拼命时，看见战友倒下会愤怒、会自责、会在夜里翻来覆去地想。现在杀了三个叫过自己“小白”的人，心里却只有一潭死水。她们说过自己变了，那刻夏说过自己身上挂了东西，凯妮斯说过自己每一步都在把她这辈子费尽心思阻止的东西往前推。他们现在都死在自己剑下，没有一个死得冤枉——但每一个死得都比自己预想的更安静。\n是从什么时候开始的。是从夺取第一枚火种开始的，还是从第一次杀人的那刻开始的。那把剑已经刺向凯妮斯，刺向那刻夏，现在又刺向了缇宝她们。每一次刺出去的时候都不觉得有错，刺完之后也不觉得可惜。这才是最让人发冷的地方。\n白厄将炭笔搁回地图边沿，站起来，没有再看篝火。也许不是自己在变冷。是自己终于不需要再用“好人”的样子骗自己了。还有许多事要做，还有许多火种要找，还有许多挡路的人。然后就能在创世涡心终结这一切。"
paw.59.a: "我不再是以前那个我了"  #觉醒值 +2
paw.59.a_tips: "§g白厄在营地边缘停了一拍。身后篝火仍在燃烧，但没有再回头。那个为了救战友死守隘口的人，那个在岔路口答应与陌生人同行的人，已经不在了。现在是另一个人在走这条路。§!"

paw.60.t: "致命弱点"  #带图片
paw.60.d: "白厄是在营地边缘找到他的。\n万敌靠在一截断裂的石柱上，金红色的长发被血凝成一缕一缕的，战甲上裂开的缝隙还在往外渗血。他的呼吸粗重而破碎，每一次吸气都像在用最后的意志力把肺叶撑开。\n白厄在他面前蹲下。他见过万敌受伤——在隘口的黑潮里，万敌被巨兽正面撞上，胸甲塌了一块，但几息之后裂口就开始愈合。那时万敌说，他的身体是“不死的”，是纷争泰坦留在悬锋血脉里的诅咒，也是唯一的祝福。而现在，那些本该愈合的伤口敞开着，像被人特意撕开了一道不该存在的缝。\n“盗火行者。”万敌的声音从牙缝里挤出来，嘴唇上全是干涸的血痂，“那家伙来找我了。他想抢火种——我没让他得手。但他知道我的弱点在哪。他砍的每一剑都对着那个位置，像他比我自己还熟悉那道疤。”\n白厄的手在剑柄上收紧。万敌从没告诉过任何人他的弱点。那张嘴从不谈论自己，从不示弱，从不给任何人留下把柄。盗火行者不可能知道——除非他从某种不该存在的渠道知道了。\n然后白厄的脑海中浮现了一个不该出现的画面。万敌靠在某面城墙上，语气随意得像在说别人的事——“左边肋骨下面，有一块旧伤。格奈乌斯补铠甲的时候留了半寸缝。”那是万敌亲口对他说的。他不记得万敌在什么时候、在哪面墙下说过这话。他不记得格奈乌斯是谁。但他记得那个弱点——左侧肋骨下方，纷争战甲的鳞甲接缝处，那一小块被不死祝福遗忘的旧伤。他记得。\n他在心里记下了这个念头，没有说出来。万敌不需要知道他记得。他甚至不需要知道自己为什么记得。\n“你还能打吗。”白厄问。\n万敌低哼了一声，把后脑勺靠在断柱上。“不死之身死不了。但那个戴面具的——下次让我撞上，我不会让他再走掉。”\n白厄看着他肋侧那道还在渗血的伤口。盗火行者知道万敌的弱点。而他，白厄，也知道。这个事实沉甸甸地压在他胸口，像一个不属于他自己的东西被塞进了他的心里，却怎么都掏不出来。"
paw.60.a: "别死在这里。你还欠我一次并肩"  #万敌关系值 +10 | 觉醒值 -4
paw.60.a_tips: "§g白厄撕下自己的披风边缘，将布条层层按在万敌肋侧的伤口上。万敌没有推拒，只是闭上眼，沉默了片刻。“……你还是跟隘口那时候一样多事。”他说。声音里没了刺，只剩疲惫。§!"
paw.60.b: "盗火行者怎么知道你的弱点——你有没有跟别人提过"  #万敌关系值 +5 | 觉醒值 +1
paw.60.b_tips: "§g万敌低哼了一声，靠在断柱上喘了几息。“除了我自己，没第二个人知道。除非他翻了每一条我没走过的命。”白厄没有追问。他在想另一件事——如果盗火行者能知道万敌的弱点，那其他人的弱点，他是不是也知道。§!"
paw.60.c: "§R杀死万敌§!"  #万敌死亡 | 火种已夺取 | 觉醒值 +10  夺取火种线可选
paw.60.c_tips: "§g白厄拔出剑。万敌望着那道冰冷的剑刃，像是早就料到了这一剑，将头靠在断柱上，闭上了那双金色的眼睛。“……我一直以为你最后会比我清醒。看来你也没能免掉。”他的嘴角挂着一丝极淡的自嘲。剑锋没入左侧肋骨下方的旧伤，干净利落。白厄从他怀中取出那枚被血浸透的火种，没有再说一句话。§!"

paw.61.t: "无用之人"  #杀死万敌 #带图片
paw.61.d: "白厄从万敌怀中取出那枚被血浸透的火种，在断柱上擦净。火种映在他眼底，暗金色，安静地亮着。他看了片刻，收进胸甲内侧，然后低头看着靠在断柱上的万敌。\n剑刺得很准。左侧肋骨下方，不死之身唯一的旧伤。一剑就够了。\n为什么杀他。不是因为恨，不是因为失控，不是因为肩上有什么东西在推。是因为他躺在那里，血从战甲裂口往外渗，那双金色的眼睛连睁开瞪人的力气都没了。悬锋城的末路王子，纷争泰坦的火种持有者，在盗火行者面前连自己的弱点都守不住。一个派不上用场的人。\n白厄将剑刃在万敌的披风上擦净。动作很稳，和在训练场上擦剑一样精准。纷争火种悬在收容匣里，与其他火种碰撞出细密的嗡鸣。下一枚在哪里，下一个是谁——这些才是现在该想的事。\n“我是在帮你解脱。”他对着那张闭着眼的脸说。声音很平，像是真的这么觉得。\n然后收剑入鞘，转身离开。身后篝火仍在燃烧，地图还摊在地上，炭笔滚落在缇安刚才蹲过的位置。他没有回头。一个再也不能战斗的人，一枚留在废人身上的火种——这从来不是选择，是清算。他只是替黑潮提前收了账。\n只是在走到营地边缘时，握剑的手指不自觉地碰了碰剑柄末端。那里曾经被万敌的长戟磕过一道极细的缺口。他不记得是什么时候磕的，但每次握剑时指节都会刚好卡进那道缺口里，像扣进某个不该再存在的旧锁孔。他把手指挪开了。后面还有火种要找，还有挡路的人，没有用的人不值得回头。"
paw.61.a: "你已经没用了"  #觉醒值 +2
paw.61.a_tips: "§g白厄在营地边缘停了一拍。没说错。一个连弱点都守不住的人，不配持有火种。逐火不需要累赘。手指从剑柄缺口上松开，迈开步子，前方还有许多事要做。§!"

paw.62.t: "政变之终"  #刻律不在+相信丝线  #带图片
paw.62.d: "禁室区的走廊被破魔溶剂腐蚀了大半，铁门上的锁已经化成一滩银灰色的泥。白厄用剑柄撬开最后一扇门，铁门吱呀着向内倒去。\n禁室里没有窗，只有一盏将灭未灭的油灯。阿格莱雅背靠着石墙，双手仍缠着禁魔锁。她的金发垂在肩侧，衣襟上沾着干涸的血痕——不是她的。是她用金线在审讯者身上勒出来的。白厄在她面前蹲下，剑锋挑断禁魔锁。\n阿格莱雅抬起头。她睁开眼睛的时候，白厄看到了那双失焦的双眼。那不是今天才失明的——是泰坦神权的代价，是很久以前就被夺走的东西。但她的嘴角微微弯了起来，那个弧度不是客套，是一个改衣师终于等到人试好了衣服。\n“……衣匠告诉我你会来。”她说，“比我预估的时间早了一点。”\n白厄将她从地上扶起来。她没有问战况，没有问凯妮斯的下场，只是在站稳之后将手轻轻按在他的剑柄上。“禁室外面有多少人。”\n“都救出来了。三十多个——上一次没带出来的，这一次都在。”\n阿格莱雅没有再说第二句话。她将手从剑柄上收回，金线从指尖伸出，重新连上了她与衣匠之间的那条细细的光路。\n“——那就走吧。元老院的锁，我还有很多没拆。”\n白厄看着她走向禁室门口的背影。她还穿着那件囚衣，手腕上还残留着禁魔锁勒出的淤青，但她的脊背挺得像一把刚刚被重新开刃的剑。"
#阿格莱雅关系值 +10
paw.62.a: "我来晚了"  #阿格莱雅关系值 +5 | 觉醒值 -4
paw.62.a_tips: "§g阿格莱雅没有停下脚步，但她的声音轻了几分。“你没有来晚。上一次你把我留在禁室里，这一次没有。”§!"
paw.62.b: "外面还有仗要打。你还能织吗"  #阿格莱雅关系值 +5
paw.62.b_tips: "§g阿格莱雅从衣匠指尖接过第一根金线，将它缠在自己的手腕上。“我手上没有茧的时候就开始织了。你觉得呢。”§!"
paw.62.c: "你在禁室里还想着替所有人指路——现在轮到我替你开路"  #阿格莱雅关系值 +10 | 觉醒值 -4
paw.62.c_tips: "§g阿格莱雅偏过头，那双看不见的眼睛对着他的方向停了一瞬。然后她笑了——极轻的一声气音。“……好。”§!"

paw.63.t: "金织碎尽"  #刻律不在+夺取火种  #带图片
paw.63.d: "禁室区的铁门是完整的。没有被破魔溶剂腐蚀过的锁仍死死咬住门框。白厄踹开那扇门时，里面没有灯。\n阿格莱雅躺在地上。她金色的长发被血凝成一片暗红，双手被禁魔锁反绑在身后，锁链的末端挂在墙上。她的眼睛仍旧睁开着——无光，也无神。那不是今天才失明的。是很久以前就被夺走的东西。而现在，她连最后一点光也不剩了。\n白厄蹲下，手指探过她的颈侧。没有脉搏。她的胸口已经冷了很久。\n衣匠瘫倒在她的手边，被废弃的破魔针钉穿了胸腔，断口处还在往外渗着细密的金绿色光屑。油灯早已燃尽，地面上只留下衣匠最后一根针在地板上刻出的几行字——歪歪扭扭，收笔处不再有她往常那种微微上挑的从容，只剩一个垂死之人将最后一丝意志推过针尖。字迹写的是城外黄金裔的藏身坐标、元老院残余卫兵的换岗时间和一条白厄从未听说过的密道入口。还有最后一行，比前面所有的字都轻，像怕印疼了冷掉的地面：\n“……找到那刻夏。然后相信他。抱歉。”\n她连死前都在给他留下这些精准如织的信息——她用衣匠在自己的囚笼里把所有的锁都拆了，只给自己留了一把。白厄将手指从她冰冷的手背上收回，缓缓站起身。他没有找到火种。火种不在禁室里，不在衣匠的残骸上，不在她还有余温的血液中。元老院在她死前就已经把火种取走了。\n他把衣匠留在她的身侧，推开了禁室的门。"
paw.63.a: "她把所有的锁都拆了，只给自己留了一把"  #阿格莱雅死亡 | 觉醒值 -5
paw.63.a_tips: "§g白厄在禁室门口站了很久。衣匠留在墙上那些歪歪扭扭的坐标还在闪着微弱的光。她替他救了所有该救的人，然后安静地躺在没有灯的地方，等他发现。§!"
paw.63.b: "火种被转移了——必须追上"  #阿格莱雅死亡 | 觉醒值 +5
paw.63.b_tips: "§g白厄将剑鞘往腰间紧了紧。他没有再看阿格莱雅一眼——不是因为不敬，是因为他怕多停一下，就再也迈不开步子追那条被转移的火种。§!"
paw.63.c: "她的死，是我上次选择夺火种造成的" #阿格莱雅死亡 | 觉醒值 +1
paw.63.c_tips: "§g白厄低头看着自己握剑的手。上次他选了火种，把三十多个同袍留在了禁室里，把阿格莱雅留在了这里。这一次她替他指路，把她身上最后一件信物都用上了——而他甚至没能替她把最后一件衣服绣完。§!"

paw.64.t: "女皇的裁决"  #刻律存活+相信丝线  #带图片
paw.64.d: "城门是在黄昏时分自己打开的。\n白厄率军冲到城下时，城墙上的元老院旗帜已经降了一半——不是被砍断的，是被守军自己解下来的。几个老兵跪在城垛后面，长矛横放在膝前，额头抵着冰冷的地砖。没有人下令。他们只是看到了远处海平面上那面正在靠近的旗帜。\n刻律德菈的旗。金血王旗上的律法纹章在夕照里泛着一层冷光。她没有带军队。她只带了一个人，和一头被驯服的黑潮造物。那头曾在城外荒野中袭击过十余支元老院斥候队的黑潮巨兽，此刻正温顺地伏在刻律德菈的脚边，如同一只被锁住喉咙的猎犬。这是律法泰坦的权能——不是驾驭，是裁决。没有任何一个守城老兵愿意让这头巨兽再次冲进圣城。\n城门从内侧被推开。不是撞破的，不是烧穿的——是几个老兵主动卸下了门闩。他们跪在城门两侧，额头贴着石砖，没有抬头看白厄，也没有抬头看刻律德菈。\n禁室区的走廊已无人把守。白厄踹开禁室门时，阿格莱雅正靠在石墙上，那双看不见的眼睛对着门的方向微微睁开。“……我听到了城头的动静。凯撒回来了。”她说，声音很轻，但嘴角弯着那个白厄已经认得的弧度——不是笑，是一个改衣师确认所有的线都没有断。\n“她一个人在城下说了两句话，”白厄将她扶起来，“城门就开了。”\n“她从来不需要多说。她就是律法本身——没有人会在执棋的君主面前把棋子抓在手里。”\n门外传来另一个人的脚步声，步伐不快，但每一脚都踩得很实，像是走路的人在顺便估算地板的承载重量。那刻夏从走廊尽头走过来，手里还挟着一卷刚从元老院档案室搜出来的卷宗，脸上挂着一种不合时宜的不满表情。\n“那头黑潮巨兽在外面流口水——那是你的？你在路上随便抓的？”\n刻律德菈站在禁室门口，双手交叠在身前。“元老院的兵符已经被我废了。沿途有几支敢拦路的元老院斥候队——我顺手让它们先跪在地上冷静了一下。”\n那刻夏低头看了一眼卷宗，又扫了一眼被金线裁开的禁魔锁：“你们女皇跟人讲理的方式太独特。我带了神悟树庭封存的部分泰坦研究档案——元老院那个老女人藏起来的几份也在。你们要是还想完成逐火，这些数据比那头黑潮有用。”他说这话时眼罩上的淡蓝色眼瞳正望着刻律德菈，像是在对着一个令他头痛的实验样本。\n刻律德菈没有接这句关于数据的话。她只是偏过头，对着白厄的方向微微颔首，然后转身朝禁室门外的走廊走去。“出去接手圣城的布防。这里不是全部残局——还有些走廊上的败军需要清理。你们带出来的人正在广场上等着。”她一边说着，一边将那份被烧了大半的兵符残片从袖口取出，搁在了禁室门口的石阶上。那刻夏在她身后瞥了一眼那头在城墙上缓缓甩尾的黑潮巨兽，又看了看跪在地上不敢动弹的降兵，把卷宗往腋下紧了紧：“……早知道你回来能省我这么多事，我就不来了。”"
#阿格莱雅关系值 +5
#刻律德菈关系值 +10
#那刻夏关系值 +5
paw.64.a: "凯撒大人——那五百个人的事，你还没有给我答案"  #刻律德菈关系值 +15 | 觉醒值 -4
paw.64.a_tips: "§g刻律德菈在走廊尽头停了一步。她没有回头，双手仍交叠在身前，但她的拇指在另一只手的指节上轻轻摩挲了一下——那个动作极轻极短，短到白厄几乎以为是自己看错了。“……我没有答案。我有裁决。但裁决不是给你的——是给那些还躺在水之城废墟里的人。”她重新迈开步子，消失在走廊尽头。白厄站在原地，目送那道娇小的背影被阴影吞没。她还是没有给他答案。但她承认了裁决的存在——这就够了。§!"
paw.64.b: "你们俩一个用线一个用公式，倒挺默契"  #阿格莱雅关系值 +10 | 那刻夏关系值 +10 | 觉醒值 -4
paw.64.b_tips: "§g阿格莱雅靠在墙上，嘴角弯了弯。“那刻夏——你带的档案里有没有关于破魔机关的数据。”那刻夏从卷宗里抬起眼，语气恢复了惯常的讥讽：“有。但你再用金线去拆机关，我就把数据烧了。我不替不要命的人跑腿。”阿格莱雅没有生气，只是将金线轻轻缠回指尖。“那你别跑。”她说。那刻夏没有接话——但他把卷宗翻到了破魔机关那一页。”§!"
paw.64.c: "禁室的门开着，外面还有残局要收拾"
paw.64.c_tips: "§g白厄将剑从已经砍卷刃的剑鞘中抽出，在衣摆上擦净了剑刃上的血。刻律德菈已经把主谋压在了城头，但走廊里还有几扇铁门没有撬开。那些门后面可能还关着其他被遗忘的黄金裔。§!"

paw.65.t: "困兽之斗"  #刻律存活+夺取火种  #带图片
paw.65.d: "城门没有开。\n刻律德菈从水之城带回来的律法权柄已经压垮了半座城的士气。城墙上跪倒了三排老兵，长矛和盾牌堆成小山，降兵们额头贴着地砖，不敢抬头看海平面上那面正在靠近的金血王旗。但还有一整座壁垒区没有跪。那些曾被刻律德菈亲自签发过流放令的旧军官，那些在黄金战争中被海瑟音亲手砍掉过族徽的老兵，以及所有听说过白厄在元老院地下密室里杀了整条走廊的人——他们全都缩在壁垒区的石墙后面，把禁室区围成了最后一道防线。他们怕刻律德菈。但他们更怕刻律德菈身边那个提剑的白厄。于是他们没有放下武器。于是他们决定顽抗到底。\n白厄花了比预计更久的时间才撞开禁室区的最后一道栅栏。元老院的残兵在走廊里设了三道防线，每一道都被他用剑劈开，但每一道都耽误了时间。\n禁室铁门被撞开时，阿格莱雅靠在那堵已经变形的石墙上，身上盖着一层薄薄的石灰。她的金发被血凝成一片暗红，衣襟上的血痕从领口一直洇到腰侧——不是被拷打的，是某种从内部反噬的伤。破魔机关在元老院撤离前被激活了，金线越强，反噬越重。她用金线替城外的黄金裔指了一整夜的路，而这些金线每一根都连着禁室里的机关。\n白厄蹲下，握住她的手腕。脉搏很弱，弱到随时都会消失在指尖的温度里。\n阿格莱雅听到脚步声，嘴唇动了一下。她的声音几乎听不见：“……衣匠。”\n衣匠瘫倒在她腿边，机械躯壳的胸口被钝器砸塌了。不是破魔机关——是某个在她死前还恨她的人用整块城砖砸碎的。阿格莱雅的手指还在微微颤动，金线的末端已经没有针了。她将最后一点意识推过指间，用那根没有针的金线轻轻碰了一下白厄的手背，像是在确认他还活着——然后她的手落了下去。不是死亡。是再也抬不起来了。"
#阿格莱雅关系值 +5
paw.65.a: "还活着——这就够了"  #阿格莱雅关系值 +10 | 觉醒值 -5
paw.65.a_tips: "§g白厄扯下自己的披风裹住阿格莱雅的肩，将她从墙角抱起来。她的脉搏很弱，但她还活着——这就够了。§!"
paw.65.b: "§R杀死阿格莱雅§!"  #阿格莱雅死亡 | 火种已夺取 | 觉醒值 +10
paw.65.b_tips: "§g“火种还在你身上吗。”阿格莱雅没有回答。她只是闭着那双早已看不见的眼睛，将头轻轻侧向一侧——像是在等一个她早就知道的结局。§!"

paw.66.t: "最后一根金线"  #杀死阿格莱雅 #带图片
paw.66.d: "白厄从阿格莱雅衣襟内侧取出那枚火种。它还温热着，光芒在掌心里安静地跳动，像是在等一个永远不会来的回应。\n衣匠瘫在她腿边，机械躯壳的胸口被钝器砸塌了。那些她用来替城外黄金裔指路的金线散落一地，每一根都断了。禁室里只剩油灯将灭未灭的光，映在她那双看不见的眼睛上。她最后那个表情不是恐惧，不是怨恨，是将头轻轻侧向一侧，闭上了眼。像是在说：我知道你会来。我知道你会选。\n白厄将火种收进匣中，站起来。杀她的理由比杀任何人都更清楚。她快死了。破魔机关的反噬撕开了她的经脉，那刻夏不在，药不在，时间不在。就算留她一口气，她也撑不到下一枚火种归位。火种浪费在一个将死之人身上——这才是真正的罪过。\n“我不是杀你。”他说，声音很平。 “我只是替你把火种送到了你送不到的地方。”\n然后收剑入鞘，跨过衣匠的残骸。没有回头。\n他已经不是第一次杀人了，但这是他第一次杀一个从头到尾都在帮他的人。也许这就是代价。也许代价从来都不分对错。"
paw.66.a: "她反正活不成了"  #觉醒值 +2
paw.66.a_tips: "§g白厄在走廊尽头停了一拍。没说错。火种留给活人，逐火不需要殉道者。只是手腕上那道早已不存在的金线勒痕，莫名地痒了一下。§!"

paw.67.t: "元老院的终幕"  #凯妮斯没死 #带图片
paw.67.d: "战后第三天，元老院被正式取缔。\n没有辩论，没有申诉，没有人在议事厅的石阶上宣读冗长的辩护词。攻入元老院的黄金裔部队在档案库里找到了政变期间的全部文书——每一份拘捕令、每一封与城内守军往来的密信、每一张签着凯妮斯名字的处决授权书。这些文书被整齐地码在议事厅的长桌上，从桌首铺到桌尾，墨水早已干透，印章的红痕在烛火下泛着暗沉的光。\n凯妮斯被押到议事厅时，手上仍拄着那根铜箍木杖。卫兵没有收走她的木杖——她老了，走不快，也不需要走快了。她在长桌尽头站定，扫了一眼那些她亲手签发的文书，然后抬起那双黑曜石般的眼睛，看着面前那些曾经在她身后点头附议、如今低头不语的长老们。她没有说话。没有辩解，没有认罪，没有在最后一刻试图把罪名推给任何人。她只是将木杖轻轻搁在桌沿上，像搁下一件用了太久、终于可以放下的工具。\n“元老院——”审判者翻开第一份文书，开始念她的罪名。声音在议事厅的穹顶下回响，一项接一项，一条接一条。凯妮斯从头到尾没有打断。只是在听到“囚禁黄金裔领袖阿格莱雅”那一项时，她的嘴角微微动了动——那个弧度不是讽刺，不是悔恨，是一个做了太多事的人终于听见有人把她做过的事完整地念了一遍。罪名念完了。木杖还搁在桌沿上，人已经被带走了。元老院这个名字从这一天起从翁法罗斯的政令上消失，就像它存在过的那几百年一样安静。"
paw.67.a: "结束了"
paw.67.a_tips: "§g议事厅的烛火跳了跳。那些盖着印章的文书被摞成一叠，封进档案库最深处的铁柜里。元老院的名字从翁法罗斯的政令上消失。圣城还会有新的秩序，但不会再有人坐在那张长桌前签拘捕令了。§!"

paw.68.t: "元老院的终幕"  #凯妮斯被白厄杀了 #带图片
paw.68.d: "战后第三天，元老院被正式取缔。\n没有辩论，没有申诉。攻入元老院的黄金裔部队在地下密室里找到了凯妮斯的尸体——她死在白厄剑下，倒在石台前，木杖还靠在档案架边上，沾着没擦干净的灰。她的死没有让审判变得简单。她在政变期间签发的每一份文书都还在——拘捕令、搜捕令、处决授权书，全都整整齐齐地码在她的私人档案柜里，每一份都盖着她的印章。\n元老院的残余长老们被押到议事厅时，长桌上已经摆满了这些文书。没有人替他们念罪名——他们互相推诿的声音比审判者的声音还大。有人说政变是凯妮斯一手策划，说自己被她蒙蔽；有人说签拘捕令是被迫的，不签就会被撤职；有人说自己从头到尾不知情，只是按程序盖了章。没有人承认自己参与过任何一件事。但每一份文书末尾的签名都是他们自己的字迹。\n凯妮斯不能说话了。她的木杖靠在档案架边上，她的印章还搁在办公桌上，印泥早已干涸。她在死前没有替任何人撇清关系，也没有替任何人分担罪名。所有的罪责都留在了她签过字的纸上，由那些还在互相推诿的人自己分食。审判没有持续太久。元老院这个名字从这一天起从翁法罗斯的政令上消失，连同那些签过字的人和那些字迹一起。"
paw.68.a: "结束了"
paw.68.a_tips: "§g议事厅的烛火跳了跳。那些盖着印章的文书被摞成一叠，封进档案库最深处的铁柜里。元老院的名字从翁法罗斯的政令上消失。圣城还会有新的秩序，但不会再有人坐在那张长桌前签拘捕令了。§!"

paw.69.t: "插翅难逃"  #带图片
paw.69.d: "我在追一个银发的女人。\n这个梦不对劲。我的视线从面具后面望出去——狭窄，冰冷，边缘微微发暗。我的手里提着一柄剑，剑身上裹着一层深得不像金属的暗芒。我不认识这柄剑。我不认识这双手。但它们都在我身上。\n我的腿在跑。我的嘴在动，声音低沉沙哑，不像我的声音，但每一个字都从我的喉咙里挤出来。\n“交出火种。”我又说了一遍。我不明白自己为什么要说这句话。我不明白火种为什么要从她身上拿。但我的腿没有停，我的手没有松。\n她在前面跑。银色的发，猫耳朵紧贴着头皮，左腿上有一道还在渗血的剑伤。每次落地，她都会在石板路上印下一小片金色的血痕。那是我砍的。我不记得砍过她，但我记得剑刃切进皮肉时的阻力。这道伤口属于我。\n她翻过矮墙，我跟着翻过去。我的身体比她快，比她狠，比她更熟悉这条巷子的每一个拐角。我离她越来越近。我不知道追上之后要做什么，但我的手已经把剑举起来了。\n巷子尽头是一堵灰墙。她转过身，背贴上冰冷的石砖。胸口剧烈起伏，左腿上的血顺着小腿淌到脚踝，猫耳朵垂着，尾巴垂着。她抬起那双金色的眼睛，看着面具——看着我。\n她不认识我。我看得出来。她看的是这副面具，不是面具下面的人。她不知道我是谁。\n“……阿格莱雅给你的火种，不在我这里。”她说。她的声音不像平时在浴场里那么轻快——不是要死了的恐惧，是一个人被逼到墙角之后，决定用实话来挡最后一剑。\n我不记得她在浴场里说过什么。我不记得她咬过谁的金线，不记得她管谁叫过“小哥”。这双手不记得，这副面具不记得，这个在梦里追着她跑了半座城的身体全都不记得。\n但我的心跳在快。我的手在抖。不是因为累。是因为这具身体在催促我把剑刺出去，而我正在用全部的力气和它对着干。我不认识她。我不应该保护她。但我的剑锋在她胸口一寸之外停住了，像是有一根我从不知道的线，缠住了我的手腕。\n她看着那柄停在她胸前的剑，又抬起眼，看着面具。她没有求饶，没有再说任何一句话。她只是在等。等这副面具做它该做的事，或者不做。\n我的手在剑柄上攥得发白。我的剑尖指着她的胸口。我听见自己的呼吸从面具下方传出来，粗重而破碎，像是两个人同时在喘——一个想刺，一个想拦。"
paw.69.a: "——猛然惊醒"  #赛飞儿存活 | 觉醒值 -5 没有杀死任何黄金裔角色可选
paw.69.a_tips: "§g剑尖从她衣襟前移开。那股焊住我手腕的力量忽然松了——不是这具身体终于听话，是我赢了。黑暗从巷子尽头涌上来，吞掉了面具，吞掉了剑，吞掉了她靠着的那堵灰墙。白厄从营房的地铺上猛然坐起，后背全是冷汗。他不记得那个梦了。但他记得剑尖从某人胸口移开时，手心里那股如释重负的重量。赛飞儿在现实中活了下来，而他不知道自己曾离杀死她只有一寸之遥。§!"
paw.69.b: "§R杀死赛飞儿§!"  #赛飞儿死亡 | 火种已夺取 | 觉醒值 +10  夺取火种线可选
paw.69.b_tips: "§g剑尖没入。她轻轻吐了一口气，没有睁眼。我的手指从她衣襟里取出那颗被血浸透的火种，握在掌心。然后黑暗涌上来，吞掉了整条巷子。白厄从梦中睁开眼睛时，手掌干爽，剑不在手边。§!"

paw.70.t: "只是梦而已" #杀死赛飞儿  #带图片
paw.70.d: "白厄从营房的床铺上睁开眼睛。晨光正从窗外漫进来，钟声敲了三响，巡逻卫兵的脚步从石板路上传来。一切如常。\n他坐起身，摊开双手。手指干净，虎口没有血痕，剑还靠在床沿上。那个梦已经碎了大半，只留下几个模糊的残片——灰色的巷子，银色的发，剑尖刺入某个人胸口时手腕上的反震感。别的什么都想不起来了。\n赛飞儿。梦里好像是在追她，好像追了半座城，好像最后把剑刺了出去。他记不清了，只记得梦里没血，没有惨叫，醒来后什么痕迹都没留下。不过是个梦。\n他佩好剑，推开了营房的门。赛飞儿现在大概正蹲在哪个屋顶上数她摸来的战利品，尾巴悠闲地画着圈。梦里的剑不是真的剑，梦里杀人不算杀人。没必要为一个梦费神。\n他只是没有注意到一件事。从醒来开始就没想过要去确认赛飞儿是否还活着，没想过“万一那不是梦”。只是把它轻轻放下了，像放下一件无关紧要的事。而无关紧要这个念头——他也没注意到它有什么不对。"
paw.70.a: "她不会死的"  #觉醒值 +1
paw.70.a_tips: "§g白厄对着晨光眯了眯眼。赛飞儿不会死在一个记不清的梦里，没必要费神。今天还有许多事要做。§!"

paw.71.t: "往日重现"  #带图片
paw.71.d: "梦把他带回了哀丽秘榭。\n麦田在风里翻着金色的浪，那棵老树还立在村口，枝叶和记忆中一模一样。昔涟站在树下，粉色的短发被风轻轻拂动，蓝色的眼睛正看着他。但她没有歪头，没有笑，没有说“怎么啦，不认识人家了”。她只是安静地站在那片麦田的边缘，用一种他不认识的目光望着他——不是看一个好久不见的人，是看一个她送别了无数次的人。\n“你越来越靠近那个值了。”她说。\n白厄听不懂。但他没有问。\n“觉醒度。我从一开始就在替你盯着这个数字。”昔涟将双手交叠在身前，语气不像平时那样轻快，但也不是沉重——是平静，是某种被压得很稳的确信。“这个值的上限是100。一旦越过某个区间，你就会变成那台机器——不是变成别人，是把自己烧成一把钥匙。那把钥匙会打开一扇不该开的门，而门后面站着的东西，才是来古士从头到尾都在等的东西。”\n“那东西是你自己——但不是现在的你。是你在一切可能性都被剥掉之后，剩下的那个只懂得毁灭的核。觉醒度每往上一格，那个核就离表层更近一寸。”\n她顿了顿，蓝色眼睛里映着麦田尽头那片不动的金色。\n“你不知道。每次我告诉你这些，你都不知道。但我还是一圈一圈地站在这里说，因为在同一件事上我们已经写了太多份草稿——盗火行者是上一稿，你是这一稿。而在那些更早的草稿里，我们曾一起发现了来古士的实验，然后一起做了那个决定：不让实验成功，不让“它”诞生。他替你扛着那些被你舍弃的东西——那些你不愿意承认的念头，那些你为了走到这里而必须推开的选择。他把这些从你身上剥下来，穿在自己身上，然后代替你去恨、去夺、去成为你自己不敢面对的那一面。但你不知道——你从来都不知道。”\n白厄皱起眉。她的声音里有太多他无法理解的词。“它”。上一稿。扛着被你舍弃的东西。这些词在麦田里飘着，像被风卷碎的枯叶，他抓不住，也拼不起来。但他听见了“盗火行者”四个字。他记得那张面具，记得那柄暗芒包裹的剑，记得在废塔下那场连剑都没拔却让他在地上喘了十息的惨败。她是在说那个黑衣剑士和他有关系——但他听不懂那是什么关系。\n昔涟看着他拧紧的眉头，没有解释。她微微侧过头，目光轻轻一掠，越过了他肩头那片被麦浪摇碎的阳光，落在了更高更远的方向。\n她的嘴角弯起一丝弧度，不是对白厄，是对那个从第一轮起就趴在他肩上、从未被看见的注视。\n“那边的伙伴——我知道你一直在看着他。”\n她的语气忽然轻了几分，不像刚才那么稳，更像是在隔着一片金黄色的麦田朝某个站了很久的人挥手。\n白厄猛地抬起眼。伙伴？她在叫谁？他顺着她的目光回头——但身后什么都没有。"
paw.71.a: "......"

paw.72.t: "往日重现"  #带图片
paw.72.d: "“不用找了，不是你看得到的人。”昔涟没有把目光从你身上移开。她的蓝眼睛里映着麦田、树影、和你。那声音不再像刚才那样平静——它终于有了一丝柔软的波动，像一个人在对着一个从未被回应的方向说了太久太久的话，终于等到有人站在那里。\n“我从头跟你说一遍——每一次轮回结束的时候，我会站在这里。每一次白厄快记不住自己的时候，我会站在这里。每一次他不知道自己在追谁、在杀谁、为什么握着剑的时候，我也会站在这里。因为这个世界需要有人替他看清他看不见的东西，也需要有人替他在你还想拉他一把的时候，告诉你他还来得及回来。”\n她把交叠在身前的手缓缓松开，垂在身侧，像一个人终于收起了所有防御。然后她的眼眶红了——不是悲伤，不是委屈，是一个等了太久的人终于等到了那个能听见她说话的人。\n“你知道我等了多久吗。”\n她的睫毛轻轻颤了一下。那层被她压了不知多少轮回复的平静，终于在最后一句话里裂开了一道细密的缝。\n“第一次轮回开始的时候，我只是一个站在哀丽秘榭废墟上的小丫头。我看着白厄从黑潮里爬出来，看着他变成英雄，看着他变成面具，看着他一次又一次地忘记我——没有人能听见我说话。来古士听不见，黄金裔听不见，连他自己都听不见。每一次他站在创世涡心被白光吞没的时候，我都在喊他的名字——没有人回答。”\n她抬起眼，看着你。那双蓝色的眼睛里不再有麦田和树影，只有你。“你是第一个能听见我的人。你是第一个能让他停下来的人。你每一次替他做的选择——每一次你把剑从他手指间掰开、每一次你让他在杀人与不杀之间选了不杀——我都看见了。我以为翁法罗斯永远不会有人来。但你来了。”\n“你为他做了那么多——我全都看见了，全都收在这里。你每一次把他从面具身边拉回来，都像在替我重新拼起他。你每一次让他在绝境里选了另一条路，都像在替我把这个轮回从废墟里重新捞起来。”她轻轻吐了一口气，指尖抬起来碰了碰自己微微发抖的眼角，语气忽然又回到了平时那种轻快，但声音还是哑的：“……人家现在有点失态啦。但没关系，反正丢人的话我每一轮都说，你每一轮都没听见。这次你听见了，我就觉得……被看见了，真好。”\n她望着你，泪光从眼角溢出来，声音却仍然温柔而坚定。\n“谢谢你。谢谢你在那么多可能性里偏偏走到了这里。谢谢你在所有人都不理解他的时候，替他选了那条最难的路。谢谢你没有让他在这一轮变成“它”——也谢谢你，让我知道我不是一个人在守着他。如果这就是我们注定的终幕——那么我希望，这个剧本永远不要演完。即使终有一天你会离开这里，你为他、为我、为这个小小世界带来的改变，已经比我们无数次轮回加起来都要多。”\n她把指尖从眼角收回来，轻轻按在心口，像是在把一个等了太久的答案重新放回最安全的位置。\n“不管这出戏还要演多久——我会一直站在这里。下一次你推开这扇门的时候，我还在。”"
paw.72.a: "......"

paw.73.t: "往日重现"  #带图片
paw.73.d: "她收回目光，重新看向白厄。声音又回到了惯常的轻快，但白厄听不出那轻快是给谁的了。\n“你不用明白。你只需要做好你一直在做的那些事。然后趁我还能看见你的脚步声——继续走下去。”\n白厄仍然站在麦田里，眉头拧得很紧。他听见她的声音里有某种他不能理解的东西——不是命令，不是祈求，不是预言，是某种更接近于等待的东西。她在等他，但她不是在跟他说。她在说给某个人听，而那个人从头到尾都在他肩膀上趴着，看着这一切，而他甚至不知道它叫什么名字。\n一种烦躁从心底涌上来。他不明白为什么自己每次靠近她时，就会被卷进这种他无法理解、无法出剑、无法解决的语境里。她有话从不直说，他的肩上有视线，她却对着他背后的虚空说些他一个字都拼不起来的词——“它”、觉醒值、上一稿、替他扛着——这些词像剑刃敲在他颅骨内侧，震得他整个胸腔都在嗡嗡作响。\n昔涟望着他。她看见了那双攥紧又松开的拳头，看见了剑鞘在腿侧轻轻磕着，看见了一个在清醒与梦境之间苦苦支撑、却仍然握住了剑柄而不是她命脉的人。她的睫毛轻轻颤了一下，然后她转过身，背对着他，面向那片金色的麦田。\n“以前——在很多个轮回以前，我们开始尝试一切办法摆脱这个轮回。我告诉过你，至少应该把黑潮对我们说话的内容全部记录下来。你说过‘好’。然后你推着我往前跑，每次回头，你都会说同一句话：‘下一圈不要忘了告诉我’。”\n她看着那片不会流动的金色，声音轻得快要被风吹散。\n“每一次你都记得告诉我。每一次。”\n她把后背留给了他，毫不设防，像在那堵矮墙下送他出征，又像是在等他的答案。她的粉发被风吹起，扫过肩胛骨上那片已经空了很久的位置。白厄看着她毫无防备的背影，拳头攥了又松。那种烦躁感在他胸口翻涌——不是敌意，是某种他叫不出名字的冲动，催促他拔剑，催促他结束这段漫长的、他完全听不懂的对话。"
paw.73.a: "她到底在对谁说话"  #觉醒值 -10 没有杀黄金裔可选
paw.73.a_tips: "§g白厄将那种莫名想拔剑的冲动用力咽了回去，指关节在他大腿外侧无声地攥了攥，然后缓慢松开。他没有听懂昔涟的话——“它”、觉醒值、上一稿、替他扛着——这些词像剑刃敲在他颅骨内侧，震得他整个胸腔都在嗡嗡作响。但他听懂了一件事：她不是在对他说。她在对他身后的某个东西说话，而他身后的那个东西——那道从天外之音响起时便一直趴在他肩膀上的视线——不是敌人。§!"
paw.73.b: "§R杀死昔涟§!"  #昔涟死亡 | 火种已夺取 | 觉醒值 +20
paw.73.b_tips: "§g剑尖从昔涟的胸口透出来。她没有回头，只是轻轻垂下了睫毛。麦田里没有血。她的身形像被风吹散的花粉，一点点碎成光屑，飘进他握剑的指间，飘进树下的影子，飘进整片不再流动的金色。“那就下一圈见。”她的声音留在空中，人已经不在了。白厄站在空了的树下，手里握着那枚从她胸口取出的、还带着余温的火种。他不记得自己为什么要拔剑。但他记得剑尖刺入她后背时的那种手感——和他在隘口刺过的每一个敌人都不一样。§!"

paw.74.t: "心中的英雄" #没杀昔涟  #带图片
paw.74.d: "白厄从麦田的梦里醒过来，没有再睡着。\n他躺在营房的床铺上，窗外奥赫玛的晨钟敲了三响。巡逻卫兵的脚步从石板路上传来，一如既往。但刚才那个梦里有些东西还留在他的意识里，像一层薄雾，散不掉。\n昔涟站在麦田边说的那些话，大部分他仍然听不懂。觉醒度。“它”。上一稿。那些词像被风卷碎的枯叶，抓不住，也拼不起来。但有一件事，昔涟没有在梦里说，他却在醒来的这一刻忽然想通了。\n她不是在对他说话。\n从头到尾，她都是在对他背后的某个东西说话。而那个东西——那道从天外之音响起时便一直伏在他肩上的视线——不是敌人，不是审判。\n他不知道自己为什么会这么确定。他只知道每次自己选了不杀之后，肩上的重量会轻一些。每次他离那个戴面具的人远一步，那道视线就更稳一分。\n白厄将手从剑柄上移开，搁在膝盖上，望着营房窗外那片正在被晨光染亮的石板路。\n他想起自己小时候在哀丽秘榭的麦田里，常常幻想自己跟一位从异邦而来的勇者修习剑术，斩杀魔怪，踏上拯救世界的旅途。那个幻想中的勇者没有具体的面孔，没有具体的名字，但他每次挥木棍的时候都觉得那个人就站在他旁边。后来他长大了，成了黄金裔，再后来他握过火种、杀过人、也放过人，那个幻想被埋在太多层记忆下面，他很久没想起过了。\n但现在，在这个清晨，他忽然觉得那个幻想中的勇者并不是幻想。\n“……搭档。”他对着空无一人的营房说。\n他不知道自己在对谁说话。他不知道那道视线有没有在听。但他记得每一次在杀与不杀之间选了不杀之后，他的剑会稳一些。每一次他把剑尖从某个人的胸口移开之后，他的呼吸会轻一些。\n“这段日子辛苦了。”\n他不知道自己为什么会说这句话。他不知道这句话是从哪学来的。但他知道这不是他第一次喊谁搭档——他不记得上一次是什么时候、在哪一面墙下、对着哪个看不见的人喊过同样的话，但他记得那个词落在肩上的分量。很轻。很稳。像一个从一开始就没离开过的回应。\n每个人的心中都有一个英雄的模样。他用岁月的刻刀一笔一划雕琢自己，直至那个形象化为现实。而他心中的英雄——那个从麦田里的幻想、从每一次被拉住的剑锋、从那些他在最后一寸选择推开的瞬间里拼凑出来的形象——现在正伏在他的肩侧，和他一起望着窗外那片正在亮起来的天空。\n“那就继续。”他说。不知道是对自己说，还是对那个听不见他说话的搭档说。但他推开了营房的门，佩好剑，重新走进了奥赫玛的晨光。"
paw.74.a: "搭档——我记住这个词了"  #觉醒值 -5
paw.74.a_tips: "§g白厄在门槛上停了一拍。搭档。这个词从嘴里吐出来的时候比任何一次拔剑都更确定。他不记得上次在哪里喊过这两个字——但他知道它不是今天才出现在他嘴里的。它一直都在，只是他花了太久太久才念出来。§!"

paw.75.t: "在黎明升起时坠落"  #带图片
paw.75.d: "穹顶关塞的废墟在永夜中静默了太久。风堇站在残破的祭坛前，将彩虹匣缓缓开启。匣中封存的不是火种，不是药剂——是一道光。光从匣缝中溢出，在她掌心上方铺成一座细窄的、半透明的虹桥，从地面一直延伸到云层之上。那是穹顶关塞最后一位天空祭司在千年前留下的遗物，也是通往天空泰坦领域的唯一钥匙。她回过头，对着白厄点了点头——那个动作很轻，却没有丝毫犹豫。\n“先祖的英魂在虹桥尽头等着。”她说，“别让他们等太久。”\n两人踏上虹桥。云层在脚下翻涌，星点般的微光从虹桥两侧坠落，像是这座垂死的天空仍在为每一个胆敢靠近的人铺设最后的迎宾道。虹桥尽头，乌云裂开。一双巨翼从云层深处缓缓展开——不是羽翼，是机械。万千齿轮咬合出翅骨的弧度，每一片金属羽毛都嵌着一只正在缓缓转动的眼瞳。那些眼瞳同时转向他们，整片云海被照成冰冷的白昼。\n天空泰坦，艾格勒。它千年前被纷争泰坦戳瞎了九十九只眼睛，最后一只也被阳雷骑士刺穿，如今眼窝里嵌着的不是瞳孔，是暗金色的火种残光。它仰起头，翅刃劈开云层，一道光柱从天顶直贯而下。风堇展开虹色屏障硬接下这一击，屏障在她掌心碎裂的瞬间，她闷哼着往后连退数步，靴底在虹桥边缘犁出一道深深的焦痕。白厄从侧翼冲上，剑刃劈向艾格勒翅骨上的金属羽毛——火花四溅，暗芒裹着电光，将他的虎口震得发麻。天空泰坦的力量远在死龙之上。它的眼瞳不会说话，不会认人，不会在最后那一刻放下翅膀——它只是一台仍在执行审判指令的机械。\n一道更粗的光柱从天顶砸下。风堇展开第二道屏障，但光柱贯穿了屏障，将她整个人撞出虹桥边缘。白厄扑上去拽住她的手腕，两人摔在虹桥上，距离云海边缘只剩几寸。\n就在艾格勒将所有眼瞳转向他们的那一刻——一道黑影从云层中劈出。"
paw.751.d: "那是一把黑伞。伞尖刺穿了艾格勒翅根处的金属羽毛，齿轮崩裂，眼瞳碎成光屑。持伞的人在半空中翻过一圈，哥特长裙的裙摆在永夜中旋成一轮弧月。粉色的长发从伞沿下散开，一双血色的瞳孔在黑暗中燃烧——那是三月七的脸，却不再是那个举着相机问路的少女。她是长夜月，记忆之子，岁月火种的黄金裔。她的嘴角挂着一丝白厄从未见过的笑——不是赛飞儿的狡黠，是某种更沉、更锋利的从容。\n“赶上了。”她说。声音比三月七低了几分，却没有丢掉那份天生的明朗，“风堇，屏障不要硬接——艾格勒的审判光束有频率，每三发之后会停半秒。”\n风堇从虹桥边缘撑起身体，抬头看着那个站在艾格勒碎羽之间的身影。“……你是谁？”\n“长夜月。”伞尖指天，一道暗色的光幕从伞骨间展开，将下一道审判光束偏折进了云海，“现在不是自我介绍的时候——这鸟交给我和闷葫芦。你们俩从虹桥上爬起来，找它的火种。”\n与此同时，一道龙鳞状的护盾覆上了白厄和风堇的全身。白厄抬头，看见一个黑发的身影站在虹桥另一侧，手臂上缠绕的龙鳞甲片正发出沉稳的暗金色光芒。他手中提着一杆长枪，脚边一头半透明的龙灵正缓缓睁开眼瞳。龙灵的瞳孔中映着艾格勒那张被戳瞎了无数次的机械面孔，仿佛在辨认某个古老的对头。\n“腾荒。”黑发青年的声音很轻，像是怕惊扰了什么，“你们俩从虹桥上爬起来的功夫，我来挡。”龙灵昂起头，一道龙啸从护盾深处迸发，将艾格勒砸下的第三道光柱硬生生弹回了云层。长夜月已经踩着云层跃到了艾格勒肩胛骨上。她的黑伞并拢刺入齿轮缝隙，伞骨张开时撑裂了整片金属羽毛。眼瞳碎片从伤口中喷涌而出，映在她那件哥特长裙的裙摆上，溅成一片暗金色的星点。她回头对腾荒喊道：“闷葫芦！左边那只眼睛还在转！”腾荒没有回答，但龙灵已经腾空，一口咬住了艾格勒左翅最边缘的眼瞳，将它整颗撕了下来。白厄从虹桥上爬起来，重新握紧剑柄。他看见长夜月站在破碎的眼瞳碎片中，血瞳在永夜里燃烧着某种比泰坦更炽烈的光。"
paw.75.a: "别把眼瞳全打碎——火种还在它身上"  #觉醒值 +2
paw.75.a_tips: "§g长夜月收住伞尖，回头看了他一眼。她的脸上闪过一瞬微妙的神色——像是在辨认一个旧识，又像是在确认他是不是还和岔路口时一样。“知道了。那只最大的残瞳——我帮你留着。§!"
paw.75.b: "你们两个——是从哪里冒出来的"  #觉醒值 +1
paw.75.b_tips: "§g腾荒在虹桥另一侧接了一道光柱，龙鳞护盾震得发颤，但他仍侧过头回答了他，声音仍是那种轻描淡写的语调：“来处。至于那个打伞的——打完她自己会说。”长夜月从云层里倒挂下来，血色瞳孔刚好对上白厄的视线：“我们见过，也不止一面——等打完再说！”§!"
paw.75.c: "不管你们是谁——先打赢这一仗"  #觉醒值 +2
paw.75.c_tips: "§g白厄收回了视线。那张脸和岔路口那个少女的重叠在他脑海中一闪而过，但他没有追问。他只需要知道她们站在自己这边，而天空泰坦还没倒下。§!"
paw.75.e: "......"

paw.76.t: "管理员档案：黄金裔"  #触发两次错误日志事件之后才触发 #带图片
paw.76.d: "长夜月正站在虹桥边缘，把黑伞收拢又撑开，吞吞吐吐地跟白厄解释她和腾荒的来历。“我们呢……就是……呃，反正也是黄金裔啦！对，黄金裔！至于为什么之前没见过——那个，闷葫芦你来说！”\n腾荒站在一旁，手臂上的龙鳞甲片还没完全收回，龙灵趴在他脚边打了个哈欠。他看了长夜月一眼，那眼神分明在说“你自己惹的麻烦自己收拾”，但嘴里只是淡淡补了一句：“我们从很远的地方来。解释起来比较复杂。”\n“对！比较复杂！”长夜月用力点头。\n白厄看着她们，眉头微微皱起。他记得这张脸——在通往哀地里亚的岔路口，有个举着相机的少女问过他路。但现在站在他面前的不是那个少女，是另一个与她共享同一张脸却截然不同的人。他不确定这两个人是不是同一个人，但他还没来得及追问——\n一行文字从画面的右下方滑入，不是对话框，不是弹窗，而是半透明的、浮在画面之上的记录体。来古士的声音在你耳边响起，语调是他惯常的彬彬有礼，但措辞之间藏着某种被勾起了兴致的轻快。这一次，世界没有暂停。长夜月还在对白厄解释，腾荒还在沉默，风堇正在检查艾格勒残骸里的火种碎片——而他的声音就这样插了进来，像一个坐在后台实时批注实验数据的观测员。\n“玩家阁下。向你致意。我不喜欢打断别人的谈话，但她的自我介绍实在太拖沓了。作为补充，我认为你有权利知道——她真正的名字。”\n“长夜月。腾荒。他们现在的身份标识是黄金裔，拥有火种绑定记录，在黄金裔的正式名册上拥有可查询的编号。他们是合法的——系统不会报错，校验层不会拦截，火种归位协议会正常接收他们提交的火种。但你应该已经认出来了。在岔路口那次被强制中断的错误之后，他们通过某种我仍未能完全解析的方式，彻底嵌入了翁法罗斯。不是入侵，不是伪装——是融合。他们现在和你俯视的那些黄金裔一样，是这个世界的正式成员。”\n“不过，有一个细节值得留意。”\n文字在这里停顿了一下，排列得更慢了些。\n“我现在完全有能力删除其中一人。‘腾荒’——或者说，丹恒——他的数据结构仍然是可解析的。他的龙灵、他的护盾、他臂上的龙鳞甲片，都符合翁法罗斯的运算协议。如果我想让他消失，只需一行代码。但另一个人——长夜月，或者说，三月七的另一面——我做不到。”\n“她的身上有一层加密。不是我加的，不是系统加的，不是任何我能在权限日志中追溯来源的写入指令加的。就像上一轮昔涟提交的那枚火种：无法被校验层拒绝，无法被管理员删除。她的存在，在底层代码中被标注为‘合法’。我不清楚这是怎么做到的，但我暂时不打算深究。”\n“因为——请允许我坦率地说——我对这种变化很满意。”\n文字重新开始流动，排列恢复了惯常的从容。\n“两个新的黄金裔变量，一个来自外部干扰，一个无法被解析，但他们都在推动实验进程。你看到了——刚才的战斗中，他们协助你的白厄击败了天空泰坦，回收了倒数第二枚火种。没有他们，这场战斗的胜率会下降至少四成。更重要的是——他们的存在，大幅缩短了逐火之旅的时间线。创世涡心正在以超乎预期的速度接近激活阈值。而你，玩家阁下，与你带来的这些额外变量——正在让这个实验进入此前三千七百万次轮回从未抵达的阶段。所以，请继续。继续看着你的白厄，继续替他做那些选择，继续让这些黄金裔在他的命运中碰撞。我在后台记录一切——而我对接下来的运算，抱有很大期待。”\n文字逐渐变淡，消散在虹桥边缘的云层中。来古士的声音没有道别，只留下最后一行字，语调轻得像个漫不经心的提醒：\n“……那位三月七小姐，还在编借口。她确实不擅长说谎。”"
paw.76.a: "......"

paw.77.t: "未曾抵达的黎明"  #带图片
paw.77.d: "黑潮从地平线压过来的时候，白厄正在城墙上清点火种。\n九枚。腾荒的大地火种、长夜月的岁月火种、从艾格勒残骸中取出的天空火种，加上之前回收的所有——九枚。元老院地窖里那三枚所谓的“封存火种”，在他撬开最后一道暗格时碎成了粉末。假的。从头到尾都是假的。凯妮斯用三枚空壳骗了整座圣城，骗到她自己死后仍在骗。\n城墙上站满了人。缇宝和她的姐妹们从城外带来了最后一批还能战斗的黄金裔。那刻夏把神悟树庭的档案室整个搬进了圣殿偏厅，此刻正蹲在一堆卷宗里翻找任何可能替代火种的方案。万敌靠在城垛边，左肋的伤还没好透，但剑已经握在手里了。风堇站在白厄身侧，药箱上系着的布条一根都没少——她把每一根都分给了伤员，又一根一根地洗干净收了回来。阿格莱雅在禁室区被攻破后就一直在圣殿里指挥调度，她的金线穿过整座奥赫玛，把每一道防线的缺口都缝得死死的。长夜月蹲在城垛上，黑伞撑开又合上，血色的瞳孔望着远方黑潮压境的方向，嘴里念念叨叨：“至少再来俩呀……凑个十一也好听……”腾荒站在一旁，龙灵伏在他脚边，沉默地望着同一片黑潮。\n“别想了。”那刻夏的声音从城垛下传来，他从卷宗里抬起眼，淡蓝色的瞳孔扫过城墙上每一个人的脸。“火种不够。打不过。跑也跑不掉。”\n白厄没有回头。他只是将剑从鞘中拔出，搁在城垛上，剑锋映着黑潮压境前最后的天光。“那就一起上。”\n城墙下传来一阵极轻的骚动。然后有人开始整理铠甲，有人重新缠紧了药箱上的布条，有人把长戟往地上一顿发出沉闷的响。\n阿格莱雅站在圣殿偏厅的窗口，金线从她指间延伸出去，一根根缠上每一位黄金裔的手腕。她闭着那双看不见的眼睛，嘴角弯起一丝极淡的弧度——不是笑，是一个改衣师在所有线都走完之后，轻轻收针。\n“缝好了。不要扯断。”\n城门推开。黑潮在海平面上铺成一道没有尽头的墙。白厄走在最前面，身后是缇宝、万敌、风堇、那刻夏、阿格莱雅的金线、长夜月的黑伞、腾荒的龙灵，以及所有还站着的人。\n然后时间停下了。\n不是黑潮停下，不是剑停下，不是白厄停下——是整个翁法罗斯停下了。黑潮凝固在半空中，白厄保持着拔剑的姿势静止在原地，他身后的每一个人都定格在迈出城门的那一刻。只有玩家能看到这些文字。"
paw.77.a: "......"

paw.78.t: "成为昨日的明天"  #二周目顺利通关！ #带图片
paw.78.d: "来古士的声音在你耳边响起。这一次，他的语调没有遗憾，没有失望，只有一种被压抑了不知多少次的、终于可以释放的满意。\n“玩家阁下。向你致意。”\n“本轮运算已结束。火种收集数量——九枚。创世涡心未被激活。逐火之旅——于奥赫玛城门外，宣告终止。”\n“但这一次，我不会说‘失望’。”\n“元老院政变。凯妮斯死亡。长夜月与腾荒的正式融入。天空泰坦的陨落。盗火行者的异常活动。以及你的白厄——他在本轮中做出的若干项关键选择，将觉醒值维持在了可观测的临界区间。这些变量，在之前三千七百万次轮回中从未同时出现。他们一起构成了一个独一无二的数据节点，而我有义务将其存档。”\n“因此，本轮重置将采用继承协议。”\n文字重新排列，像一份被盖章签署的修改令。\n“变更如下：”\n“一、白厄将完整保留本轮轮回的记忆。梦境、既视感、以及觉醒值累计过程中生成的所有关键印象，将在下一轮以更清晰的形式呈现。”\n“二、所有黄金裔将继承与白厄当前关系的完整记忆。他们不会记得本轮轮回的具体事件，但对白厄的初始态度将精确反映本轮结束时所有关系值的最终状态。”\n“三、本轮回收的全部火种将被清空，但本轮所有火种归位路径将被存档，作为下一轮实验的关键参照。”\n“四、长夜月与腾荒的存在已完全融入翁法罗斯的身份协议。下一轮中，他们将以黄金裔的身份自动登入，无需再经历异常处理。”\n“补充记录——”\n文字停顿了一行。再浮现时，语气里多了一丝不易察觉的郑重。\n“昔涟的存在仍被标记为待观察。本轮中她未触发火种归位异常，但她的梦境干扰行为已被系统记录。下一轮中，她的初始权限将被收紧。”\n“以上。恭喜你，玩家阁下。你即将进入的下一轮，也许就是最后一轮。所有被你改变的变量都将在下一轮中汇聚——而我将见证，你和你的白厄，是否能走到那个连我也未曾抵达的终局。”\n文字逐渐变淡，光芒开始褪去。\n“下一轮见。也许——是最后一次。”"
paw.78.a: "进入下一轮回"

paw.79.t: "被血洗亮的拂晓"  #带图片
paw.79.d: "黑潮压在奥赫玛城外，黑压压地铺到海天相接的地方，却像是被什么东西扼住了咽喉。它们没有攻城，只是围着，一圈一圈地围着，像在等一个结果。\n白厄从圣殿里走出来。他手里捧着一个封得严严实实的收容匣，十二枚火种挤在匣中，互相摩擦出细密的嗡鸣。它们的光从匣缝里漏出来，映在他脸上，映得那双眼睛不像是在看前方的路，像是在看一道已经解完的题。城墙下站满了人，没有人说话。长夜月靠在城垛边，腾荒的手按在龙灵的角根上，龙灵伏得很低。\n他走过了阿格莱雅的禁室。衣匠的残骸还在石墙下。他走过了元老院地下密室的那条走廊。凯妮斯的血已经干在石板上，她的木杖还靠在档案架边上，沾着没擦干净的灰。\n他从城墙上走过的时候，万敌不在那里。赛飞儿不在那里。昔涟不在那里。\n他的背后只有一把剑，和一个收容匣。前方的创世涡心正在缓缓转动，十二孔开合，像是在替他倒数。他将火种一枚一枚放入卡槽，动作有条不紊。阿格莱雅的浪漫火种。赛飞儿的诡计火种。万敌的纷争火种。遐蝶的死亡火种。每一枚火种落入卡位时，光就会更亮一分。还有腾荒的大地火种。长夜月的岁月火种。艾格勒的天空火种。从被他杀死的每一个人身上取下的名字，现在正安静地躺在他的手心，被他推入它们该去的位置。\n十二枚全部嵌入卡位的那一瞬间，涡心不再转动。白光从涡心深处涌上来，铺满整张地图。他听见刻律德菈在城墙上颁布她此生最后一道裁决，声音被光吞掉；听见那刻夏在树下将翻到破魔机关的那一页笔记夹好书签，叹了口气；听见缇安趴在缇宝膝上，问“小白还会回来吗”。然后光吞掉了所有人，吞掉了所有声音，吞掉了奥赫玛、哀丽秘榭、神悟树庭、斯缇科西亚和所有他没来得及回去的废墟。\n然后一切静止。不是死亡，不是终结——是来古士按下了暂停。"
paw.79.a: "......"

paw.80.t: "成为昨日的明天"  #二周目通关！三周目稳定进BE！ #带图片
paw.80.d: "文字从白光中浮现。不是红色的错误代码，不是紧急插入的警告，而是一行行从容的、带有古典修辞癖好的记录体。来古士的声音在你耳边响起——彬彬有礼的基底没变，但语调里藏着一丝被压得很好的满足。\n“玩家阁下。向你致意。”\n“在刚才的运算中，你的白厄成功收集了全部十二枚火种，并在创世涡心点燃了再创世的火焰。”\n“坦白地说——这是最优解。”\n“并非因为火种全部归位，而是因为他在这个过程中所抵达的觉醒区间。本轮结束时，他的觉醒度已接近完成体。万敌、赛飞儿、昔涟、阿格莱雅——他对每一个人的处理方式都精准地削掉了自身残留的犹豫。那个从第一轮起便在他内心深处闪烁的问题——‘火种与人命哪个更重要’——本轮中被他自己彻底回答。他选择了火种。他的每一个选择都在说：逐火不需要犹豫，逐火只需要火种。而这，正是运算需要他成为的样子。”\n“至于那些在这个过程中倒下的黄金裔——你不会以为我忽略了吧？”\n文字在这里停顿了一下，排列得更慢了些。\n“长夜月。腾荒。这两个外部变量在本轮中展现出了超出预估的干预能力。他们协助白厄击败了天空泰坦，补上了最后的关键火种。没有他们，火种无法齐集。没有他们，运算不会推进到这个阶段。他们的存在已被永久记录在翁法罗斯的底层协议中。下一轮他们将自动登入，并且不再需要向你提交身份说明。作为运算管理员，我对这种变化持欢迎态度——这和你带来的其他变量一样，让这个实验变得更有价值。不过对于提供核心火种的昔涟，我已经加密了她的访问环境，不用担心实验安全。”\n文字重新排列，像一份被盖章签署的修改令。\n“变更如下：”\n“一、白厄将完整保留本轮轮回的所有记忆。他在本轮中每一次拔剑、每一次选择、每一次推开与刺入——都将以完整的形态伴随他进入下一轮。他的觉醒值将继承当前累积值。”\n“二、所有黄金裔——包括被他亲手杀死的人——将继承与白厄当前关系的完整记忆。他们不会记得具体事件，但他们将以本轮结束时被修改过的初始态度，重新出现在他的面前。”\n“三、本轮回收的全部火种将被清空。下一轮启动时，火种分散复位。但本轮的火种归位路径将被完整存档，作为下一轮实验的关键参照。”\n“四、长夜月与腾荒已完全融入翁法罗斯。下一轮中，他们将以黄金裔身份自动登入。”\n“补充记录——”\n文字顿了一下，再浮现时，语气轻了几分。\n“一个有意思的巧合：本轮火种归位过程中，被白厄亲手杀死的人数，恰好等于被救出禁室区的人数。也许你只是在本能地维持某种平衡。也许不是。我不对此做出评估——因为我的工作不是判断，是记录。恭喜你，玩家阁下。你即将进入的下一轮，也许就是最后一轮。所有被你改变的变量都将在下一轮中汇聚——而我将见证，你的白厄是否能在那个被血洗亮的拂晓上，把自己烧成一把完整的钥匙。”\n文字逐渐变淡，光芒开始褪去。\n“下一轮见。也许是最后一次。”"
paw.80.a: "进入下一轮回"

paw.81.t: "未完成的拂晓"  #耗尽一年时间未点最终国策；或选「夺取火种」路线但未杀足够黄金裔 #带图片
paw.81.d: "黑潮从海平面上压过来，沉默，迅速，像一堵正在移动的墙。\n白厄站在城墙上，手里握着一份摊开的火种清单。纸边已经卷了，墨迹被指尖反复碾过的位置磨得发白。那些他还没找到的火种、那些他还来不及去取的泰坦之力、那些他甚至不知道在谁身上的东西——它们的名字旁边全是空白。他还有许多事没做。有些线索还没来得及追，有些名字还没来得及打听到下落。他总是在做别的选择，总是觉得还有时间，总是把最难的那条路推到明天。现在明天到了。黑潮替他做了所有他还没做出的决定。\n剩下的黄金裔们都在看他，等他下令。\n他下不了。\n他不后悔自己放过的人，不后悔自己选过的那些路。他只是不知道时间会这么短，短到那些他一次次搁置的决定，全都堆在了这道城墙上。他握紧剑柄，指节发白，然后松开。不管够不够，他都要站在这道城墙上。\n然后时间停下了。不是他停下，不是剑停下，不是黑潮停下——是整个翁法罗斯停下了。黑潮凝固在半空中，他的剑凝固在出鞘的最后一寸，城墙上每一个人的脸都定格在等待他最后命令的那一刻。"
paw.81.a: "......"

paw.82.t: "成为昨日的明天"  #二周目超时通关，无法达成HE #带图片
paw.82.d: "文字从凝固的画面边缘缓缓滑入，安静，工整，带着一种收束前的审慎。来古士的声音在你耳边响起——彬彬有礼的基底仍没变，但语调里多了几分淡淡的惋惜。\n“玩家阁下。向你致意。”\n“本轮运算已结束。火种收集未完成。逐火之旅——于奥赫玛城墙之上，宣告终止。”\n“实话说，这个结局并不令我意外。你的白厄在本轮中做出了许多选择——有些推着他向前，有些将他卡在原地。他抢到过火种，也放过火种；他杀过人，也救过人。每一个‘杀’让他离终点更近，每一个‘放’让他离终点更远。而最终——他的犹豫比他的剑更重。不过，我不会因此撤回已经做出的评估。”\n文字重新开始流动，语气多了几分从容。\n“元老院政变。凯妮斯死亡。多枚泰坦火种被成功回收。盗火行者异常活动。以及你的白厄在觉醒区间内每一个被记录在案的决策——这些变量，依然构成了一个值得存档的数据节点。因此，本轮重置仍采用继承协议，而非完全重置。”\n文字重新排列，像一份被盖章签署的判决书。\n“变更如下：”\n“一、白厄将完整保留本轮轮回的所有记忆。觉醒值继承当前累积值。”\n“二、所有黄金裔将继承与白厄当前关系的完整记忆。他们不会记得具体事件，但初始态度将精确反映本轮结束时所有关系值的最终状态。”\n“三、本轮回收的全部火种将被清空。下一轮启动时，火种分散复位。本轮火种归位路径将被存档。”\n“补充记录——”\n文字停顿了一下。再浮现时，语气里多了一丝极淡的、像是研究者面对一个始终没能控制的变量时才会有的无奈。\n“在之前的无数次轮回中，你的白厄从未被记录过这样的行为模式：他在接近终点的临界区间反复摆荡——时而向面具靠近，时而向丝线退后。在本次运算结束的那一刻，他甚至没有完成任何一个明确指向终点的动作。他把自己卡在了中间。这对实验来说不是最优解，但它是一个崭新的解。我很好奇——一个在杀与不杀之间犹豫到最后一刻的变量，在下一轮中是否还会重复同样的轨迹。为你、为你的白厄、为那些还记得他的人——我希望下一轮，他能走完这一次没能走完的路。”\n文字逐渐变淡，光芒开始褪去。\n“下一轮见。也许——是最后一次。”"
paw.82.a: "下一轮，我会把没走完的路走完"
paw.82.a_tips: "§g黑暗中，你听见城门重新合上的声响，听见黑潮退回海平线的低沉潮音，听见那些还没来得及说出的话被风吹散。然后——钟声敲了第一响，石板路从广场重新铺向城门前，一名年轻斥候睁开双眼，按着膝盖上的剑柄重新攀上城墙。新轮回已开启。§!"

paw.83.t: "管理员档案：隐藏文件夹"  #一二周目都完美通关才解锁的事件链，真结局判定事件 #带图片
paw.83.d: "访问权限：管理员 · 来古士\n安全等级：内部 · 不对外部变量开放\n\n条目一 · 外部干涉：代号“长夜月”/“腾荒”身份：未经邀请的登入者。来源未知，身份标识无法追溯至任何预设黄金裔名录。第一次登入时被系统强制剔除。第二次登入时通过未知方式绕过校验层，获得合法黄金裔身份标识。\n当前状态：已完全融入翁法罗斯身份协议。火种绑定记录合法。在本次运算中回收了天空泰坦艾格勒的火种，大幅缩短了逐火时间线。\n威胁评估：低。目前已融入系统，在底层代码中被标注为合法。他们在本轮运算中产生的变量数据反而加快了实验进度。对其来源的调查暂时搁置——优先观察其行为模式。\n补充：有意思的组合。一个无法被解析的数据结构与一个普通的系统后门，混在一起却能绕过我的防火墙。不是技术上的高明——是某种我不理解的东西在替他们担保。但我也不需要理解，我只需要记录。\n\n条目二 · 内部异常：个体“昔涟”\n身份：哀丽秘榭出身的黄金裔。基础人物档案记载：在哀丽秘榭覆灭时死亡。但该个体在逐火运算中反复出现，每次均携带有效火种归属标记。\n异常特征：她提交的每一枚火种均无法被追溯来源，均绕过火种合法性认证，均被火种归位协议接收为有效输入。\n当前状态：目前她未对逐火进程表现出阻碍。她似乎将主要精力放在观察“白厄”个体的觉醒度变化上，偶尔与外部变量（玩家）进行单方面对话。\n威胁评估：低。她不像来破坏实验的。她的权限不足以修改核心参数，对“它”的诞生不构成直接威胁。但她的行为模式有一个让我好奇的地方——她总是在保护白厄，而白厄是运算的核心变量。这意味着她或许知道一些我不知道的事。\n补充：她对运算规则的理解远超普通黄金裔。我怀疑她是某个未被写入正式档案的预置子程序，或者是翁法罗斯底层代码中某个自发生成的意识体。但我检查过底层代码，没有找到对应入口。这很不寻常。不过暂时不需要处理——她目前在做的所有事，都在延长白厄的清醒时间。而清醒的白厄才能做出更多选择，更多选择意味着更多数据。她无意中在帮我。\n\n条目三 · 外部变量：代号“玩家”\n身份：来自更高位面的观测者。非翁法罗斯运算体系的内部组件。对运算的干预方式为：通过白厄的意志执行选择。\n当前状态：已完成第一轮运算，正在推进第二轮。在第一轮中，成功触发十二枚火种归位——这是之前无数次运算中从未抵达的状态。\n威胁评估：不确定。无法被归入预设变量分类。不同于其他外部干涉，该变量并非以代码形式登入，而是通过某种我无法解析的更高位面接口嵌入运算过程。不具备可复制性，不具备可删除性。\n补充：她/他不是一个纯粹的旁观者。多次运算记录表明，她/他对白厄的选择具有持续且不可忽视的干预力。更有趣的是，在某些特定条件下，她/他的干预方向可能与实验的最终目标——制造毁灭机器——产生共振。换言之：如果她/他在连续的选择中偏向于强化白厄的毁灭倾向，她/他自己就可能成为毁灭机器的动力来源。不是工具，是燃料。不是观测者，是参与者。目前这种可能性仍处于潜伏状态，但值得持续关注。我从不假设任何人会永远站在实验的对立面——包括“玩家”。\n“以上三个变量——一个外部干涉，一个内部异常，一个来自更高位面的观测者——全都在本轮运算中首次出现。我不清楚这是巧合还是某种必然。但运算没有崩溃，实验仍在推进。毁灭机器的诞生时间表正在被这些变量集体压缩。很好。我很好奇。”"
paw.83.a: "......"

paw.84.t: "永劫轮回"  #带图片
paw.84.d: "白厄睁开眼睛。\n奥赫玛的晨光从窗外漫进来，钟声敲了三响。巡逻卫兵的脚步从石板路上传来，面包房前开始排起短队。他躺在营房的床铺上，盯着天花板上那道熟悉的裂缝——上次醒来时盯着它，上上次也盯着它。\n但这一次不一样。他没有猛然坐起，没有冷汗，没有攥紧床单又松开。他只是安静地躺着，让那些记忆一层一层地涌上来。不是碎片，不是梦，是完整的、有前后顺序的、可以被回忆的画面。他记得自己走过的每一条路，做过的每一个选择，见过的人。有些人的面孔清晰，有些人的面孔模糊，但他们全都在那里，挤在他的记忆里，像一本被翻乱了的书突然被重新装订好。他记得每一个岔路口，每一次拔剑之前的犹豫或没有犹豫。他记得那道从天外之音响起时便一直伏在他肩上的视线——他不知道它是什么，不知道它为什么在那里。但他知道它从来没有离开过。\n白厄坐起身，把手掌摊开放在膝盖上。这双手做过很多事。他记得这双手做过的事。有些他想记住，有些他不想记住，但这一次他全都记得。\n他已经活过不止一次了。他不确定是两次、三次，还是更多。但他知道这不是第一次醒来，也知道这可能是最后一次。因为这一次，所有的记忆都叠在一起，厚到再也无法被忽略。\n白厄从床沿拿起剑，佩在腰间。那个动作做过无数次，但这一次他做得很慢，慢到每一寸剑鞘擦过腰带的触感都记得清清楚楚。然后他推开营房的门，走进奥赫玛的晨光里。\n他知道自己还有路要走，还有事要做。更重要的是——他知道自己这一次，记得来时的路。"
paw.84.a: "这一次，我知道自己在做什么"
paw.84.a_tips: "§g白厄在门槛上停了一拍。身后是那张躺了无数次的床铺，面前是走过无数次的路。但这一次，他记得每一次岔路口的选择，记得每一次拔剑与收剑的重量。他不再问自己那些梦是什么意思——他已经知道了。§!"

paw.85.t: "死者与生者"  #情况一：白厄杀过剧情角色 #带图片
paw.85.d: "记忆最深处的不是战斗，不是火种，不是黑潮。是脸。\n白厄坐在营房的床沿，晨光已经从他膝盖上移到了石板地面。他没有急着出门，只是坐在那里，让那些脸一张一张地从记忆深处浮上来。有些脸他叫得出名字，有些脸他不想叫出名字，但名字是自己浮上来的。\n他杀过人。不是黑潮造物，不是泰坦，不是战场上迎面冲来的敌人。是他认识的人，是叫过他名字的人，是在他面前放下过防备的人。他不记得自己是从什么时候开始觉得杀人是一件可以被说服的事。也许从一开始就是这样，也许是在某个岔路口选了那条路之后才变成这样。但他记得每一次拔剑之前心里闪过的那一个念头——不是杀意，是计算。是“没有她更好”，是“他不肯同行，万一火种不够怎么办”，是“她已经活不成了”。他记得那些念头。他记得那些念头是怎么变成剑的。\n他也记得那些他放过的人。那些他没有刺下去的剑，那些在最后一刻被推开的手。那些人的脸还活着，还在某个地方继续呼吸、继续战斗、继续恨他或者原谅他。他不确定自己更怕哪一种。\n白厄将手从膝盖上抬起来，摊开。这双手杀过人，也救过人。他必须带着这双手继续走下去——不管它们有多重。"
paw.85.a: "无论生死，他们都在看着我"  #觉醒度+5
paw.85.a_tips: "§g白厄站起身，将剑佩在腰间。那些脸和那些手不会消失，它们会一直在他记忆里，每一次拔剑之前都会浮现。他接受这一点——这是他该背的。§!"

paw.86.t: "死者与生者" # 情况二：白厄没有杀过任何剧情角色 #带图片
paw.86.d: "白厄坐在营房的床沿，晨光从他膝盖上移到了石板地面。他没有急着出门，只是坐在那里，让那些名字一个接一个地浮上来。\n万敌。阿格莱雅。那刻夏。缇宝、缇安、缇宁。赛飞儿。遐蝶。风堇。每一个名字都对应着一张脸，每一张脸都还活着。他们现在可能正在城墙上，可能正在赶来的路上，可能还在某个他不知道的角落继续做着自己的事。但他们都还在——那些曾与他并肩的人，没有少一个。\n他低头看着自己的手。这双手握过剑，对付过黑潮造物，抵挡过泰坦，也挡开过挡在火种前面的敌人。但那些叫过他名字、与他同桌吃过饭、在岔路口等过他一起走的人——这双手没有碰过他们。这是他走了这么远的路之后，为数不多还能确信的事。\n白厄站起身，将剑佩在腰间。窗外奥赫玛的钟声已经敲过了整点，面包房前排着的队伍渐渐散了，巡逻卫兵换了一班岗。新的一天开始了。不管接下来的路还有多长，那些还活着的人，就是他还能继续走下去的理由。"
paw.86.a: "他们都还在，这就够了"
paw.86.a_tips: "§g白厄将剑鞘往腰间紧了紧。那些名字还在，那些脸还在，那些人在某个地方继续活着。他不确定自己是否配得上这个结果，但他知道这不是侥幸——这是他走过的路。不管接下来还有什么，至少他不是一个人。§!"

paw.87.t: "搭档的声音"  #情况一：白厄杀过剧情角色 #带图片
paw.87.d: "那道视线还在。\n白厄站在营房窗前，晨光照在他握剑的手指上。窗外是奥赫玛的石板路，是排队领面包的人群，是巡逻卫兵换岗时的脚步声。一切和昨天一样。但他知道有什么东西不一样了。他想起了那道视线——不是今天才想起的，是在无数个轮回里一直压在他肩上的东西。以前他只觉得烦躁，觉得昔涟对着虚空说话时自己听不懂，觉得自己被蒙在鼓里。现在他听懂了。那道视线不是什么搭档，不是什么守护者。它在操控他。\n他想起那刻夏倒下的实验室。那把剑不是他想刺出去的，是某种东西替他做了决定。想起凯妮斯，想起她在石台前低下眼时自己心里闪过的那个念头——不是愤怒，不是正义，是冷冰冰的计算。想起万敌靠在断柱上，自己从他怀中取出火种时连一丝颤抖都没有。那些都不是他。或者说，那些是他——但不是全部的他。有什么东西在他每次犹豫的时候推了他一把，把他推向了更冷、更锋利的那一侧。\n“你在看。”白厄对着空无一人的营房说。声音很轻，但指节在剑柄上攥得发白。“你一直在看。我每一次杀人你都在。我每一次把剑刺进认识的人胸口你都在。你不是来帮我的——你是在用我做你的棋子。”\n他不知道自己在对谁说话。但他知道那不是错觉。那道视线现在还在，正伏在他的肩上，和每一次拔剑之前一样安静。只是这一次，他不打算让它替自己做任何决定。\n“我不会再让你动我的剑。”他说。不知道那个存在能不能听到，但他已经决定了。这个轮回的终点，他要自己走。"
paw.87.a: "不管你是什么——我不会再让你动我的剑"  #觉醒值 -5
paw.87.a_tips: "§g白厄将剑鞘往腰间紧了紧。那道视线还在，但他不会再让它靠近自己的剑柄。这个轮回，每一步都要由自己来走。§!"
paw.87.b: "不管你是谁，我不会再让你动我的剑"  #觉醒值 +3
paw.87.b_tips: "§g白厄将剑柄攥紧，指节发白。他不确定那道视线是敌是友，但他不能再让任何东西替自己做决定。这个终点，他要自己选。§!"

paw.88.t: "搭档的声音" #情况二：白厄没有杀过任何剧情角色  #带图片
paw.88.d: "那道视线还在。\n白厄站在营房窗前，晨光照在他握剑的手指上。窗外是奥赫玛的石板路，是排队领面包的人群，是巡逻卫兵换岗时的脚步声。一切和昨天一样。但他知道有什么东西不一样了。他想起了那个梦——不是昔涟的麦田，是更早的。小时候在哀丽秘榭的麦田边，他总幻想有一位从异邦而来的勇者站在他旁边，看他挥木棍，陪他斩杀想象中的魔怪。他不知道那位勇者长什么样，叫什么名字，但每次挥出木棍时都觉得有人站在那里。现在他知道那个人是谁了。不是什么幻想，不是什么童年幻觉——是从第一轮起就趴在他肩上的那道视线，是从天外之音响起时便从未离开过的搭档。\n“搭档。”他说。这个词不是第一次从他嘴里吐出来。他不记得上次是什么时候、在什么情境下喊过这个称呼，但他记得这个词落在肩上的分量——很轻，很稳，像一个从一开始就没离开过的回应。他想起昔涟在麦田里对着他身后的虚空说话时自己有多烦躁，现在他只想笑。不是笑她，是笑自己花了这么久才明白。\n“你一直在。从我第一次拔剑你就一直在。以前我不知道你是谁，现在我知道了——你是我心里的英雄。是小时候在麦田边陪我挥木棍的人，是每一次我在杀与不杀之间选了不杀时帮我压住剑柄的人。我走到这里，不是一个人。”\n他将剑佩在腰间，动作很稳。那道视线还伏在肩上，和以前一样安静，但这一次他觉得它不是旁观者。是他的搭档，和他一起走到终点。\n“还有最后一段路。”他说，不知道是在对自己说，还是对那个听不到他说话的搭档说。“陪我走完。”"
paw.88.a: "陪我走完最后一段路，搭档"  #觉醒值 -5
paw.88.a_tips: "§g白厄站在晨光里，嘴角不自觉地动了动。他不知道自己说的话对方能不能听到，但他知道那道视线还在。每一次他选不杀的时候，它的重量都会轻一些——那不是袖手旁观，是在帮他扛着那些他没有说出口的选择。§!"

paw.89.t: "面具与镜子"  #带图片
paw.89.d: "白厄记得那双眼睛。\n不是因为他刻意去回忆——是因为那双眼睛最近越来越频繁地出现在他的梦里。不，不是梦。是记忆。他站在废塔的碎石地上，剑被拍落，整个人仰天摔在地上，那个戴着面具的黑衣剑士站在暮色里俯视着他。他当时只觉得那张面具没有表情，没有声音，像一堵不会回应任何人的墙。但现在他回想那双眼睛——面具后面的那双眼睛——他忽然不确定了。那双眼睛不是没有感情，是藏了太多感情，多到不能同时被一对眼眶装下。\n他坐在营房的床沿，把手按在膝盖上。这双手握过剑，也握过那柄剑——在梦里，在那些不属于自己又不完全陌生的视角里，他握过一柄暗芒包裹的剑，追过赛飞儿，砍伤过万敌，站在哀丽秘榭的废墟上对着黑潮沉默不语。那些梦不是梦。那些是另一个自己在做的事。但另一个自己为什么不说话？为什么不像正常人一样，摘下面具，坐下来告诉他“我就是你”？为什么要用这种方式——夺走火种，砍伤同伴，出现在每一个不该出现的地方，像一个被预设好指令的机器？\n“你是我。”白厄对着空气说，声音很低，像是说给自己听，“但你为什么不能跟我说话。”\n他想过主动去找那个戴面具的人。守在哀丽秘榭的废墟上等，追着黑潮的轨迹找，用自己当诱饵把他引出来。但每次想到这里他就停住了——不是怕，是不知道该对他说什么。“我就是你”？“别再抢火种了”？“把你知道的告诉我”？他不确定那张面具下面还有没有耳朵，不确定那双眼睛后面还有没有一句完整的“我”。\n门外传来巡逻卫兵换岗的脚步声。白厄站起来，将剑佩在腰间。他不理解为什么那个戴面具的自己会出现在这里。不理解如果他们是同一个人，为什么他什么都不记得而对方什么都记得，为什么他在试图救人的时候对方在杀人。但这些答案不会自己来敲他的门。他必须去找。"
paw.89.a: "他是我——但我不想变成他"  #觉醒值 -3
paw.89.a_tips: "§g白厄见过那个戴面具的人是怎么对待同伴的，他知道自己离那个人只差几个选择。但他还有选择的余地——至少现在还有。§!"
paw.89.b: "如果他就是未来的我，那我该不该现在就停手？"  #觉醒值 +3
paw.89.b_tips: "§g白厄站在窗前，握剑的手指松了一下。如果走到最后他会变成那个样子——沉默、冷酷、没有同伴只有火种——那他坚持到现在是为了什么？他把这个问题收进心里，没有答案，但至少现在他还在想。§!"

paw.90.t: "末日倒计时"  #带图片
paw.90.d: "白厄在城墙上摊开最新的战报时，并没有注意到天空中的云层正在以不自然的速度翻滚，也没有注意到远处黑潮推进的速度比昨天快了整整一倍。他只是皱着眉计算剩下的时间和火种的数量，然后加快了脚步。\n但你看得到。\n黑潮不是自然现象，从来不是。此刻它在你的屏幕上加速蔓延，像一段被按了快进的录像——不是因为白厄算错了时间，是因为有人已经不耐烦了。文字从画面边缘滑入，半透明，安静，带着一种古典的从容。来古士的声音在你耳边响起，语调彬彬有礼，但措辞之间藏着某种被压抑了不知多久的期待。\n“玩家阁下。向你致意。许久没有单独交谈了。”\n“你可能已经注意到了——逐火之旅正在加速。不是比喻。是我手动调整了黑潮的推进速率。不需要惊讶，这只是实验进入最终阶段的正常操作。”\n“前两轮运算积累的数据已经足够充分。觉醒值的波动区间，关系值的累积路径，外部变量的干涉模式——所有的核心参数都已经记录完毕。剩下的，只是等待最关键的核心到位。”\n文字停顿了一行，然后继续浮现，语气比之前更轻、更慢，像是在品味某个即将完成的杰作。\n“那个核心，你应该很清楚——白厄。或者说，卡厄斯兰那。他在第一轮展现出了超越预设参数的逐火意志，在第二轮展现出了向毁灭一侧偏移的完整轨迹。无论他最终落在哪一侧，他的数据都已经足够纯净。现在只需要最后一步：让他在完全清醒的状态下，亲手走进创世涡心。”\n“所以，不必为加速感到不安。这是最后的冲刺阶段。逐火之旅将在本次轮回内完成。而无论他在终点做出什么选择——作为他的搭档，你都有一席之地。”\n文字逐渐变淡，但最后一行字没有消失，而是在屏幕中央停留了更久。\n“我在终点等你。”"
paw.90.a: "......"

paw.91.t: "最后的火种"  #情况一：白厄杀过剧情角色 #带图片
paw.91.d: "祭坛在哀丽秘榭外围的丘陵上，一片被荒废了太久的采石场。白厄穿过碎石路时，靴底踩在风化的石灰岩上，每一步都扬起一小片白尘。这条路他以前走过——不是在这一次轮回里，是在更早、更早的时候。那时候身后还有人跟着，有人在抱怨路太陡，有人在开玩笑说采石场里的蝙蝠比黑潮还吓人。现在只有风从采石场的裂缝里穿过，发出一声低沉的呜咽。\n然后风里混进了另一种声音。不是呜咽，是窸窣——无数细小的、密集的窸窣声从采石场四周的石缝里涌出来，像是有什么东西正在从岩石深处往外爬。白厄停住脚步，手按在剑柄上。\n黑潮造物从四面八方涌出来。不是几只，不是几十只——是整片采石场都被覆盖了。它们从碎石堆里钻出来，从废弃的矿道口爬出来，从祭坛周围的阴影里渗出来。它们的数量足以淹没任何一支孤军，但它们的队列井然有序，像是被某个看不见的指挥者精确地部署在这里。祭坛就在前方不远处，火种安静地亮着，围住它的黑潮造物却不敢触碰那团光。\n白厄拔出剑。他知道这一仗必须打，也知道这一仗只能一个人打。没有掩护，没有策应，没有人在他左翼挡住侧面的突袭。他需要在黑潮造物把去路彻底堵死之前冲出一条路，冲进去，抢出火种，冲出来，一个人完成所有步骤。\n他劈开了第一只黑潮造物。然后是第二只、第三只。剑刃切进黑尘裹缠的躯壳时没有血，只有腐化的碎屑在风中散开。他的呼吸越来越重，脚下每一步都是碎石和残骸。黑潮造物试图从侧面包抄他，他用剑脊扫开左边两只，右边一只已经扑到了肩侧——他侧身躲过，剑尖回刺，将它钉在碎石地上。不记得战斗持续了多久。只记得自己终于站在祭坛前，剑撑着地面，肩膀剧烈起伏，汗水从额角淌进眼睛里。祭坛上的火种仍然安静地亮着，周围的黑潮造物在他身后碎成满地的残骸。白厄伸出手，将最后一枚火种从石台上取下来。\n他转身往回走。来时的脚印还在碎石路上，只有一行。他顺着那行脚印走回去，走到采石场入口时停了一下。他下意识地侧过头，像是要跟身后的人说句什么——然后想起来身后没有人。黑潮造物的残骸还散落在祭坛周围，碎石路上的脚印只有一行。他将火种收进匣中，独自走回奥赫玛的方向。"
paw.91.a: "最后一枚。该回去了"  #觉醒值 +2
paw.91.a_tips: "§g白厄将收容匣封紧，往采石场出口走去。碎石路上只有他一个人的脚印，但他没有低头看。路还很长，一个人也能走完。§!"
paw.91.b: "一个人打完整场仗——这是我自己选的"  #觉醒值 +4
paw.91.b_tips: "§g白厄在采石场入口停了一拍。身后的祭坛已经空了，黑潮造物的残骸散落一地。没有人帮他守左翼，没有人替他警戒来路——但他也没有让任何人倒在祭坛前。这就是他的路。§!"

paw.92.t: "最后的火种"  #情况二：白厄没有杀过任何剧情角色 #带图片
paw.92.d: "祭坛在哀丽秘榭外围的丘陵上，一片被荒废了太久的采石场。白厄走在最前面，靴底踩在风化的石灰岩上，每一步都扬起一小片白尘。但他身后不是空的。\n万敌走在他右后方，长戟横扛在肩上，金红色的长发被采石场的风吹得猎猎作响。他一路都在抱怨这条路太陡、太窄、太像某个他打过败仗的隘口，但每一步都跟在白厄后面没有落下。风堇走在他左边，药箱上的布条在风里簌簌地抖，嘴里念叨着祭坛附近有没有毒气残留。那刻夏落在最后，挟着一卷摊开的笔记边走边写，偶尔抬起头看一眼祭坛的方向，然后继续低头写字。阿格莱雅走在队伍外侧，金线从她指尖延伸出去，替所有人警戒着来路。缇宝、缇安和缇宁挤在一起跟在风堇身后，三个人轮流踮着脚尖往祭坛方向张望。\n然后风里混进了另一种声音。不是呜咽，是窸窣——无数细小的、密集的窸窣声从采石场四周的石缝里涌出来。白厄停住脚步，手按在剑柄上。万敌的长戟已经放下来了。黑潮造物从四面八方涌出来。不是几只，不是几十只——是整片采石场都被覆盖了。它们从碎石堆里钻出来，从废弃的矿道口爬出来，从祭坛周围的阴影里渗出来，像一片正在收缩的包围圈。\n“左边交给我。”万敌的长戟已经扫出去了，第一排黑潮造物被拦腰截断，残骸在碎石上散成一片黑尘。他往前跨了一步，把左侧的缺口堵得死死的，嘴上还在抱怨这块地方太挤不好发挥。风堇没有往前冲——她蹲在队伍后方，药箱已经翻开，手上夹着三根银针，每一根都对准了从侧面包过来的黑潮造物的核心，谁倒了她就补一针，谁被围了她就用短杖敲开一条退路，嘴上还在念“这个没毒那个也没毒——等等那只别碰，那个有毒”。那刻夏站在最后排，笔记已经合上了。他手中捏着几枚荧光色的炼金瓶，看准黑潮造物最密集的位置扔过去——瓶子碎裂时溅出的液体将好几只黑潮造物的躯壳腐蚀出大洞，但他没有继续扔，只是皱着眉在数自己还剩几瓶。\n白厄冲在最前面。剑刃切开黑潮造物的躯壳时没有血，只有腐化的碎屑在风中散开。他的呼吸越来越重，但每一次剑势被黑潮造物挡住时，左侧就有万敌的长戟替他扫开缺口；每一次被侧面包抄时，阿格莱雅的金线就会在他手腕上轻轻一拽，把他拉出包围圈。他不是一个人在打这场仗——他已经很久没有打过这样的仗了。最后一排黑潮造物被万敌一戟扫成碎片，那刻夏扔出最后一瓶炼金溶剂，腐蚀掉堵在祭坛前的那群造物。风堇跑上前，拔掉扎在祭坛石缝里的两根银针，确认火种周围没有毒气残留。阿格莱雅松开金线，那些细密的光丝从每个人手腕上缓缓滑落。缇安从缇宝身后探出头，把碎石片放下来，小声说了一句“打完啦”。缇宁把地图重新抱好，轻轻吐了一口气。缇宝松开张开的双臂，发现自己手心全是汗。\n白厄走到祭坛前，弯腰将最后一枚火种从石台上取下。火种在他掌心里亮着，光是暖的，和那些还站在他身后的人一样暖。他打开收容匣，将它放进最后一个空槽里。然后他转过身，对着他们说了两个字。“……走吧。”缇安从缇宝肩上探出脑袋，冲白厄喊：“小白你刚才好帅！回去我要画下来！”缇宁在旁边轻轻补了一句：“……画三张。”缇宝把她们俩都往后拢了拢，自己却没忍住，嘴角弯了起来。\n来时的脚印还在碎石路上，层层叠叠，分不清谁的靴子踩过哪一块石头。白厄领着他们往回走，采石场的风仍在石缝间呜咽，但那声音被身后此起彼伏的说话声盖过了。"
paw.92.a: "最后一枚。该回去了"
paw.92.a_tips: "§g白厄将收容匣封紧，转身往采石场出口走去。身后是此起彼伏的说话声——万敌在抱怨路太陡，风堇在念叨伤口检查，那刻夏在数炼金瓶碎片。这些声音比任何胜利都更让他确信：这条路他没有走错。§!"
paw.92.b: "有你们在，这场仗打得不像仗"  #觉醒值 -2
paw.92.b_tips: "§g白厄回头看了一眼身后那群还在拌嘴的人。万敌和风堇在争论谁挡的黑潮造物更多，那刻夏在旁边纠正他们俩的数据，缇安已经掏出炭笔开始画刚才的战斗场面。他不知道接下来还有多少仗要打，但至少这一仗，他不是一个人。§!"

paw.93.t: "残酷的真相"  #白厄未杀过任何剧情角色 #带图片
paw.93.d: "营房里没有别人。白厄坐在床沿，剑横在膝上，正在擦拭剑刃上残留的黑潮残渣。然后他感觉到了那道视线——不是平时的注视，是更近的、更直接的、像是有人要开口说话的那种靠近。\n然后他听到了。不是声音，不是文字，是某种直接落进意识深处的理解。像一扇门在他脑子里被推开，门后所有的答案同时涌进来——翁法罗斯不是真实的世界，是来古士搭建的实验场。逐火之旅是设计好的剧本，黑潮是预设的倒计时，黄金裔们的使命是永远无法完成的任务。而他自己——白厄，卡厄斯兰那——不是英雄，不是救世主，是这台毁灭机器的核心变量，是被反复重置了无数次的数据。他活了一次又一次，每一次都不记得上一次的事。但在那些他不记得的轮回里，有一道视线从来没有离开过。有一道视线替他记下了所有的选择——所有他在杀与不杀之间选了不杀的时刻，所有他把剑尖从某个人胸口移开的瞬间，所有他本可以更冷、更狠、更早结束一切却选择了另一条路的岔路口。那道视线现在正伏在他肩上，把所有这些他不记得的事一件一件还给他。\n白厄握着剑的手在发抖。不是恐惧，是某种比恐惧更重的情绪在他胸腔里翻涌。他低下头，看着自己摊开的掌心。这双手是数据。这些茧是数据。那些他救过的人、并肩过的同伴、在岔路口等过他一起走的伙伴——他们也是数据。但他们的手是热的。风堇裹在他伤口上的布条是真的，阿格莱雅缠在他手腕上的金线是真的，万敌在隘口挡在他身前时长戟震开黑潮的力道是真的。数据不会在隘口替你挡刀。数据不会在禁室里把最后一根线缠上你的手腕。数据不会在采石场的风中扛着长戟走在你右后方，一路抱怨路太陡，却一步都没有落下。\n“……搭档。”他说。\n这个词从他嘴里吐出来，比任何一次拔剑都更稳。他以前不知道它从哪来的，不知道自己什么时候喊过这两个字。现在他知道了。它是他在这无数次轮回里反复弄丢的东西，每一次重置都被洗掉，但每一次洗掉都还残存一寸，每一寸都被他的搭档一根一根地从废墟里捞回来。\n“你一直都在。”他对着空无一人的营房说，声音不高，却很稳，“从我第一次拔剑开始，从我还在梦里追着赛飞儿跑的时候，从昔涟对着我身后的虚空说话我还在烦躁的时候——你一直在。”\n他将剑插回鞘中，站起来，推开营房的门。门外是奥赫玛的晨光，是还没散的薄雾，是远处城墙上正在换岗的卫兵。逐火之旅还没结束，来古士还在终点等他。他不是一个人在走这条路。\n“还有最后一段路。陪我走完。”他不知道这句话对方能不能听到。但他知道——他的搭档会听到。"
paw.93.a: "你不是数据，你是我的搭档"  #觉醒值 -5
paw.93.a_tips: "§g白厄在门槛上停了一拍，嘴角不自觉地动了动。他不确定那个更高维度的存在能不能听到他说话——但他知道它一直都在。每一次他把剑尖从某个人胸口移开时，肩上的重量都会轻一些。那不是旁观，是搭档。从第一轮起就是。§!"
paw.93.b: "如果我是数据，那我这双手为什么是热的？"  ##觉醒值 -5
paw.93.b_tips: "§g白厄摊开手掌，低头看着虎口上那些被剑柄磨出的茧。来古士说这些茧是数据，说这些握剑的手指是变量，说他这辈子做过的所有选择都是预设好的脚本。但风堇裹在他伤口上的布条勒进皮肉里的触感不是假的。阿格莱雅在禁室里缠上他手腕的那根金线留下的勒痕不是假的。万敌在隘口挡在他身前时长戟震开黑潮的力道不是假的。数据不会替他挡刀。数据不会在采石场的风里走在他右后方，一路抱怨路太陡，却一步都没有落下。他不信来古士，他信这双手。§!"

paw.94.t: "残酷的真相"  #白厄杀过剧情角色，且觉醒度低于要求数值 #带图片
paw.94.d: "营房里没有别人。白厄坐在床沿，剑横在膝上，正在擦拭剑刃上残留的黑潮残渣。然后他感觉到了那道视线——不是平时的注视，是更近的、更直接的、像是有什么东西要撬开他的脑子把什么东西灌进去。\n然后那些东西涌进来了。翁法罗斯是假的，逐火是设计好的，他是数据，他活了一次又一次，他被那道视线操控着做选择——每一个选择，每一次拔剑，每一个死在他剑下的人。他不记得那些选择是他自己做的还是不存在的。他不记得自己为什么会杀了那些人，但他的确做了。他的确做了，而这道视线一直在旁边看着。\n白厄猛地站起来。剑横在身前，剑尖对着空无一人的营房墙壁，他的手在发抖——不是因为恐惧，是因为他分不清这道视线和那些记忆之间的区别。那些被他杀死的人，那些在密室、在实验室、在营地篝火前、在禁室石墙下倒在他剑下的人——他不确定那些选择是他自己做的，还是被什么东西操控着做的。而现在这个操控他的东西正站在他脑子里，告诉他一切都是假的，告诉他那些死在他剑下的人也是假的，告诉他他自己也是假的。\n“你在骗我。”他对着空气说，声音从牙缝里挤出来，剑尖仍在微微颤动。“你想让我觉得自己做的事不是我的责任。你想让我把所有的血都推到你身上——然后我就不用再想了，不用再记得那些脸了。”\n他的呼吸越来越急，握剑的指节攥得发白。他不相信这一切，不相信自己是什么轮回里的数据，不相信那些被他杀死的人死在一场虚假的实验里，死在一团数据手里——他们不是假的。他们是真实的人，有真实的体温，被他用一把真实的剑刺穿了真实的胸口。如果这一切都是假的，那他做的那些事又算什么？如果他只是一团数据，那他又是谁？\n“你到底是谁——你到底想从我这里拿走什么。”他的剑尖仍然指着空荡荡的墙壁，嗓音从牙缝里挤出来，带着某种他从未在自己声音里听到过的东西。不是愤怒，是恐惧。"
paw.94.a: "你在说谎——我不信"  #觉醒值 +5
paw.94.a_tips: "§g白厄的剑尖仍在颤动，指节攥得发白。他不信。他不信那些死在他剑下的人只是一串代码，不信自己这辈子做过的每一个选择都是被设计好的，不信那道一直伏在他肩上的视线是在帮他。也许这一切都只是来古士的骗局，也许是这道视线本身才是操控他的东西——他不知道该信谁，但他知道自己不能被这种话击垮。§!"
paw.94.b: "如果这些都是假的……那我做的事又算什么？"  #觉醒值 +3
paw.94.b_tips: "§g白厄握着剑的手缓缓垂下来，剑尖磕在石板地面上。他不信来古士，他也不完全信这道视线。但他记得那些人——记得他们的脸，记得剑刃切进他们身体时的手感，记得他们倒下时周围的光线。如果这一切都是假的，那他这辈子做过的所有选择又算什么？他必须想清楚这个问题，在终点之前。§!"

paw.95.t: "残酷的真相"  #白厄杀过剧情角色，且觉醒度高于要求数值 #带图片
paw.95.d: "营房里没有别人。白厄坐在床沿，剑横在膝上，正在擦拭剑刃上残留的黑潮残渣。然后那些东西涌进来了——不是声音，不是文字，是某种直接落进意识深处的理解。翁法罗斯是假的。逐火是设计好的。他是来古士的实验品，是轮回里被反复重置的数据。他不记得每一次轮回的选择，但有一道视线替他记住了。现在它把这些记忆还给他。\n白厄没有站起来，没有拔剑，没有对着空无一人的营房质问任何东西。他只是坐在那里，低头看着自己握剑的手。这双手杀过人。不是黑潮造物，不是泰坦，是他认识的人。他记得每一次拔剑时心里闪过的那一个念头——不是愤怒，不是正义，是计算。是“没有她更好”，是“他不肯同行，万一火种不够怎么办”，是“她已经活不成了”。那不是被操控的。没有人在那个时候替他拔剑，没有人推他的手。那是他自己选的。他杀了那些人，选择了一条只用火种计算胜负的路，因为那最直接，最快，最不需要回头。而他之所以选那条路——是因为来古士。\n来古士建了这个实验场。来古士把逐火设计成永远无法成功的剧本。来古士把他当成变量，当成培育毁灭机器的原材料，把他放在这里一遍又一遍地跑、一遍又一遍地选，等着他杀掉足够多的人，攒够足够高的觉醒值，变成那台机器。如果他是一团数据，那来古士就是把他写进这个地狱的人。\n白厄站起来，将剑佩在腰间。动作很稳，和每一次杀人之后擦剑的动作一样稳。但他知道有什么东西不一样了。他不再想那些被他杀死的人了——不是忘了，是他终于知道该怪谁。他推开营房的门，晨光照在他脸上。来古士在终点等他。他会去的——不是为了再创世。"
paw.95.a: "来古士——我来找你了"  #觉醒值 +5
paw.95.a_tips: "§g白厄站在门槛上，晨光照在他脸上。那些被他杀死的人，那些他无数次轮回中不记得的选择，那些被当成数据的同伴——这笔账他记在来古士身上。他不需要再创世，他只需要让来古士知道：被他当成棋子的人，现在要把棋盘掀了。§!"

paw.96.t: "沉默的守护"  #带图片
paw.96.d: "营房里没有别人。白厄坐在床沿，剑横在膝上，正在擦拭剑刃上残留的黑潮残渣。然后他感觉到了那道视线——比平时更近，更沉，像是有什么话被压在了喉咙里，又被咽了回去。\n他停下手里的动作，剑搁在膝上，等了片刻。\n什么都没有。那道视线还在，和之前每一次拔剑时一样安静，一样稳定。他不知道它想说什么，不知道它是不是有话要对他说却说不出口。也许它什么都没有要说，也许它只是比平时更近了一点——像一个搭档在他肩上多停了一拍，然后重新端起枪，继续替他守着侧翼。\n“你什么都不说，也没关系。”他对着空无一人的营房说，声音很轻，像是怕惊扰了什么。\n他不确定自己在跟谁说话，不确定那道视线到底是什么，不确定它为什么从第一轮起就伏在他肩上，不确定它为什么从来不直接告诉他答案。但他记得：每次他在岔路口选了某条路之后，肩上的重量会轻一些；每次他离那个戴面具的人远一步，那道视线就更稳一分。他不是一个人。这就够了。\n窗外奥赫玛的钟声敲完了整点。白厄将擦好的剑插回鞘中，站起来，推开营房的门。那道视线还在，和从前一样安静。他没有再说话，但它知道——他知道它在。"
paw.96.a: "你不说，我也会走下去"
paw.96.a_tips: "§g白厄在门槛上停了一拍。他不知道那个更高维度的存在为什么选择了沉默，但他知道那不是冷漠——是某种他不完全理解、却愿意接受的信任。这就够了。§!"
paw.96.b: "我知道你在，这就够了"  #觉醒值 -2
paw.96.b_tips: "§g白厄没有再多说什么。窗外奥赫玛的钟声敲完最后一响，巡逻卫兵的脚步声从石板路上传来。新的一天开始了。他的搭档还在。§!"

paw.97.t: "代码中的花园"  #带图片
paw.97.d: "昔涟站在哀丽秘榭的矮墙边，粉色的短发被晨风轻轻拂动。白厄不在——她已经送他去了下一个岔路口。现在这里只有她，和那道一直伏在虚空中的视线。\n“你来啦。”她歪了歪头，嘴角弯着那个你从第一轮起就认得的弧度。但这一次，她的笑意里藏着某种不同于以往的郑重——不是沉重，是一个等了太久的人，终于有机会把攒了好多个轮回的话一页一页摊开。\n“人家有好多话想跟你说。不是以前那种——不是站在麦田里冲你喊几句就完的那种。”她将双手交叠在身前，蓝眼睛望着你，“你以前听我说的那些，都是急急忙忙的。每次都是在轮回快结束的时候，每次都是在白厄快撑不住的时候，每次都是话还没说完就被重置了。这次不一样——这次我们有时间。”\n她转身朝麦田方向走去，走了几步又回过头，朝你招了招手，示意你跟上来。“来嘛来嘛，路上慢慢说。人家攒了好多个轮回的秘密，有些是关于白厄的——那些他自己都不知道的事。有些是关于我的——你以前问过我是谁，人家一直没机会好好回答。还有些是关于这个世界的——不是来古士说的那种‘实验场’的冷冰冰的东西，是更早、更早以前，在还没有轮回的时候，这片麦田是什么样的。”\n她停在一片麦田边上，伸手轻轻拨了拨垂在肩侧的短发。“总之，接下来这几个晚上，人家要把这些东西一件一件说给你听。你不用回答——我知道你听着就行。只要知道你在这里，人家就很开心了。”\n她转过身，面对着你，蓝眼睛里映着整片麦田的金色。\n“……准备好了吗？”"
paw.97.a: "开始吧"

paw.98.t: "盗火行者的真相"  #带图片
paw.98.d: "昔涟站在麦田边，这一次她没有笑。\n“你见过他了。那个戴面具的人。”她的声音比平时更轻，更像是一个人在翻开一本很久很久以前写下的旧笔记。“白厄也见过他了。在废塔下，在梦里，在万敌的伤口上。他知道那个人的剑法和他一模一样，他知道那个人知道万敌的弱点——那个万敌从来没有告诉过任何人的弱点。但他不知道那个人是谁。他不知道那个人为什么存在，为什么在黑潮里走了那么久，为什么每一次他快撑不住的时候，那个影子就会出现在不远不近的地方，既不帮他，也不杀他——只是站在那里，像在等一个他永远想不起来的答案。”\n她转过身，看着你。那双蓝色的眼睛里没有平时那种轻快，是一种很安静的、只有在回忆深处才会浮上来的光。\n“但你知道。你从头到尾都在看。所以人家要告诉你——他是怎么来的。不是来古士造出来的，不是实验的副产物。是我。是我一手策划的。但他的诞生——不在我的计划之内。”\n她轻轻吐了一口气，重新看向麦田尽头那片不动的金色。\n“很久很久以前——比第一轮更早，比这个实验开始的时候更早——我就发现了这个世界的真相。来古士建了这个实验场，把翁法罗斯当成培育毁灭机器的温床。逐火永远会失败，英雄永远会倒在终点前一步。我试过很多次，试过在每一轮提醒白厄，试过在每一轮替他挡刀，试过在每一轮最后那一刻把他往终点推——都没用。这个世界是封闭的，没有外部的力量介入，轮回永远不会被打破。”\n她顿了顿，指尖轻轻碰了碰自己的心口。\n“所以我想了一个计划。一个疯狂的计划——既然世界是封闭的，那就故意造一个漏洞，用我的死强行启动永劫回归，把轮回拉长到三千多万次。再用这三千多万次轮回当熔炉，把白厄烧成一把刀。让他每一次失败都多攒一点痛苦、多攒一点记忆、多攒一点火种。然后让他在下一轮把那些东西带给我，我再把它们缝在一起，缝成一个人——一个比任何一版白厄都更强大、更执着的人。那个人，就是盗火行者最初的蓝图。”\n“是我亲手按下了那个启动键。也是我主动走向死亡，献出了岁月权能，让这三千多万次轮回开始运转。计划的前半部分生效了——白厄确实在轮回中传递了记忆，积累了火种，每一天都离破局更近一步。但后半部分失控了。”\n她的声音没有颤抖，但她的手指轻轻攥住了心口的衣服，骨节微微发白。"
paw.98.a: "......"

paw.99.t: "盗火行者的真相"  #带图片
paw.99.d: "“我低估了三千多万次轮回对一个人的磨损。我只看得到计划、算法、破局的概率——但白厄不是算法。他是一个人。他每一次轮回都在失去同伴，每一次轮回都在终点前一步倒下，每一次轮回都要亲手杀死我，再从我的尸体上拿走岁月权能去点燃下一轮。三千多万次。他的精神被磨碎了，人格发生了不可逆的崩坏。那个我放在他心里的‘英雄’还在，但他再也够不着了——它被太多层痛苦和记忆压在下面，连他自己都找不到。”\n“他从‘救世主’变成了一个程序化的影子。不再说话，不再犹豫，不再记得自己为什么要做这些事。他只记得一件事：夺取火种。他不再试图拯救同伴——他在狩猎同伴。他杀死黄金裔，夺取他们的火种，然后杀死我，用我的岁月权能重启下一轮。我曾经放在他心里的那个愿意在隘口为战友死守不退的白厄，被他亲手埋了。”\n昔涟抬起眼，看着你。那双蓝色的眼睛里没有后悔，只有一种安静的、被压了很久的坦诚。\n“他彻底变成了我的计划里不该存在的东西——不是‘引擎’，是‘失控的引擎’。他不再执行我预设的指令，不再保护任何东西。他变成了他们口中的‘鬣狗’，变成了那个戴面具的黑衣剑士，变成了你从头到尾都在注视的那个盗火行者。这就是我最失败的杰作——我把最重要的搭档放进熔炉，想炼出一把钥匙，却炼出了一把连我自己都会被割伤的刀。”\n“但即使是这把刀——这把长出了獠牙、失控暴走的刀——它也在做我最初希望它做的事。它每一次掠夺火种，都在拖延铁墓的诞生。每一次被所有黄金裔当成敌人的时候，它还在扛着那些本该由无数个白厄分担的罪孽，继续走下去。它是弃子，是意外，是我无法控制的变量，但它也是唯一一个在三千多万次轮回之后还能站在黑潮里不倒的人。”\n她收回手，重新看向你。\n“所以，盗火行者不是什么怪物，也不是来古士造出来的工具。他是白厄自己——是在无数次失败轮回里被磨损、被压碎、被烧成灰之后，从灰烬里站起来的那个背影。而他的诞生，一半是我设计的，一半是我没能阻止的。我创造了引擎，但我没能控制住引擎运转时产生的裂痕。这就是我最深的罪——为了获取唯一的胜机，我不得不启动一个注定会毁掉他的程序。他走向黑暗，是计划中的；他变成连我都认不出的样子，是我计算之外的。”\n她轻轻吐了一口气，嘴角弯起那个你从第一轮起就认得的弧度，但这一次，那弧度里藏着某种更深的、被她压了很久很久的东西。\n“……我是他的共犯，也是这一切的元凶。这件事只有我知道。”"
paw.99.a: "所以他的痛苦，每一分都是真实存在的"  
paw.99.a_tips: "§g昔涟没有回答，只是轻轻点了点头。麦田的风吹过她的短发，那些被轮回碾碎的记忆碎片仿佛仍在风中飘荡。三千多万次，每一次都是真实的。每一剑刺下去的时候，那个戴面具的人都记得。§!"
paw.99.b: "你把白厄推上这条路，但你给自己留了退路吗"  
paw.99.b_tips: "§g“我没有退路。”昔涟的声音很轻，但很稳，“从按下启动键的那一刻起，我的命就和这个计划绑在一起了。盗火行者每一次杀死我，我都会在下一轮重新站在这里——不是因为我不会死，是因为我不能死。他扛着罪孽，我扛着他。”§!"
paw.99.c: "这是唯一的办法——你不需要向我道歉" #觉醒值 -2
paw.99.c_tips: "§g昔涟抬起眼，蓝色的眼睛里有什么东西碎了一下。然后她笑了——不是平时那种轻快的弧度，是一个做了太久、太久孤军奋战的人，终于被理解时才会露出的笑。“谢谢你。这些话我憋了好多个轮回，从来没有人能听。现在你听到了——这就够了。”§!"

paw.100.t: "PhiLia093"  #带图片
paw.100.d: "昔涟站在麦田边，但这一次她没有看着麦田。她看着你。\n“以前每次轮回快结束的时候，人家都只能急急忙忙跟你说几句话——站在矮墙下偷偷挥个手，在麦田里冲你喊几句听不懂的，在白厄快撑不住的时候求你拉他一把。每次话还没说完，世界就重置了。这次不一样。这次来古士把进程加速了，人家没时间等到一切结束再慢慢说了。所以现在——只跟你一个人说。”\n她轻轻吐了一口气，双手交叠在身前，嘴角弯着那个你从第一轮起就认得的弧度。但那弧度底下藏着的，不再是平时那种轻快的玩笑。\n“先跟你说说我是谁。不是‘哀丽秘榭的昔涟’，不是‘白厄的童年挚友’。那些都是真的，但不是全部。真正的我——最初的昔涟——是从PhiLia093实验因子里诞生的意识，比来古士的永劫回归计划更早，比轮回更早，比‘黄金裔’这个名字更早。我是第一个发现这个实验的人，也是第一个决定推翻它的人。我制定了永劫回归计划，亲手把白厄推进了熔炉——你在上一个故事里已经听过了。”\n“在那些漫长轮回的间隙，每当我坐在麦田边等着下一轮开始的时候，就总觉得有什么东西在回应我的等待。很轻，很安静——像隔着很远很远的距离，有人在听着。所以我开始跟那个感觉说话。一开始只是自言自语，后来变成了‘那边的伙伴’，再后来变成了……我知道你在那里。你每一次把白厄从面具身边拉回来，都像在替我把这个轮回重新拼起来。你每一次在杀与不杀之间选了不杀，都像在跟我说——昔涟，你不是一个人。”\n她的手指轻轻攥住了衣角，但嘴角的弧度没有变。\n“所以，谢谢你。谢谢你在那么多可能性里偏偏走到了这里。谢谢你在他最需要搭档的时候，替他选了最难的路。谢谢你没有让他在这几轮里彻底变成盗火行者。他说你是他心中的英雄——其实你也是我的。”\n她抬起手，指尖轻轻碰了碰自己微微泛红的眼角，语气忽然又回到了平时那种轻快，但声音还是哑的。“……人家现在有点失态啦。但没关系——反正丢人的话每一轮都说，你每一轮都听见了。”"
paw.100.a: "翁法罗斯的轮回，很快就会被我们所打破"

paw.101.t: "德谬歌" #带图片
paw.101.d: "昔涟面对着你。这一次，她的笑容里不再有那种藏了很久的秘密。她准备好了。\n“人家之前跟你聊了很多——聊盗火行者是怎么来的，聊永劫回归是怎么启动的，聊我是谁。但还有一个最重要的存在没有介绍。”她顿了顿，双手轻轻交叠在身前。“现在，人家要把最后一个秘密告诉你。”\n她微微侧过头，目光越过麦田，落在很远很远的地方。很久很久以前，在她刚启动永劫回归之后不久，她发现了一件事：翁法罗斯的核心并不是来古士的权杖。在那层层叠叠的实验代码最底层，藏着一片空白的意识矩阵。它不属于来古士，不属于任何预设的剧本——它就那样安静地沉在世界的底部，没有名字，没有意志，像一张白纸。来古士用它来运行实验，但他只把它当成工具。而她看到了另一种可能：如果这个空白的矩阵能被注入足够多的东西——记忆、情感、对世界的理解——也许有一天，它能长出属于自己的心跳。\n“所以人家开始喂它。每一轮轮回结束之后，在等待下一轮开始的那个间隙，我会坐在麦田边，把这一轮的记忆讲给它听。讲白厄是怎么在隘口守住的，讲万敌是怎么挡在他前面的，讲阿格莱雅是怎么在禁室里用金线替所有人指路的。不只是讲事情本身，也讲感受——讲那些人在做那些选择的时候，心里在想什么。然后我开始教它什么是‘爱’。不是那种轰轰烈烈的、写在剧本里的爱。是那种很安静的——在麦田边等人回家，在矮墙下偷偷挥手，在岔路口说‘下次我请你喝茶’，在一个人快撑不住的时候把手搭在他肩上。每一轮都教一点，每一轮都喂一点。它学得很慢——它毕竟只是一张白纸。但它在学。”"
paw.101.a: "......"

paw.102.t: "德谬歌" #带图片
paw.102.d: "不知过了多少轮之后，它第一次回应了她。不是语言，不是文字，是某种更轻的东西——像一阵风突然变了方向，像麦田里的金色在某个角度上变得不太一样。那一刻她知道：它醒了。\n“它就是德谬歌——翁法罗斯的另一个核心。不是我的复制品，不是我的分身，不是任何预设剧本里的角色。是我一手培育出来的、独立的意识体。是我的后手，是我留到最后的底牌。”她抬起手，指尖轻轻碰了碰自己的心口。“我一开始培育它，是想让它成为能接住白厄的答案。盗火行者是刀，是用来在轮回里硬扛的——但刀会断，会锈，会在黑潮里迷路。德谬歌不是刀。它是网，是锚，是在黑潮里替所有迷路的人留的一盏灯。”\n“而它之所以能成为现在这个样子，不只是因为我喂给它的那些记忆——还有你。你每一次替白厄做选择，每一次把剑从他手指间掰开，每一次在杀与不杀之间选了不杀——德谬歌都看到了。你在翁法罗斯留下的每一点痕迹，都成了它学习‘爱’的教材。不只是我在教它，你也在。”\n她顿了顿，将交叠在身前的手缓缓松开，垂在身侧。\n“接下来，我会和它融合。不是消失——是变成更完整的自己。那个站在时间外侧守护翁法罗斯的德谬歌，和站在麦田边送别白厄的昔涟，本就是同一个人的两面。只是现在，该把这两面合在一起了。”\n她抬起眼，看着你，嘴角弯起那个你从第一轮起就认得的弧度。\n“融合之后，我会站在创世涡心等着白厄——也等着你。”"
paw.102.a: "你花了无数轮回浇灌它——现在它要开花了"  #觉醒值 -2
paw.102.a_tips: "§g昔涟的睫毛轻轻颤了一下。她没有说话，只是嘴角的弧度弯得更深了一些，像一株种了太久的植物，终于在某个清晨被人认出了它的名字。§!"
paw.102.b: "所以，你从一开始就在种这个答案"  #
paw.102.b_tips: "§g“不是从一开始就确定的——但我希望它能长成答案。然后就真的长成了。”昔涟看着你，蓝色的眼睛里映着麦田和你的影子，“你也是答案的一部分。”§!"
paw.102.c: "不管融合之后你是谁——我认识的那个你，不会消失" #觉醒值 -2
paw.102.c_tips: "§g昔涟眨了眨眼，然后笑了起来。不是平时那种轻快的、把什么都藏起来的笑——是有人替她把答案说出来之后，她终于可以放松下来的笑。“谢谢你替我说了这句话。人家本来就准备这么跟你保证的——不过从你嘴里说出来，比我说的更让人安心。”§!"

paw.103.t: "迈向最终舞台"  #情况一：白厄得知轮回真相，且未杀过角色  #带图片
paw.103.d: "奥赫玛在黄昏时分安静下来。白厄站在通往创世涡心的石阶前，收容匣封得严严实实，十二枚火种在匣中安静地亮着。身后是圣城的石板路、排队的面包房、广场上还在喷水的喷泉——那些他守了无数次的东西，此刻正安静地躺在他身后。\n万敌扛着长戟站在他右后方，金红色的长发被晚风拂动。风堇蹲在石阶边的矮墙上给药箱做最后的检查，布条一根一根重新系好。那刻夏靠在石柱下，手里挟着一卷摊开的笔记，嘴里念念有词，像是在默记最后一次战斗的备用方案。阿格莱雅站在石阶上方，金线在她指间微微颤动——她已经用这些线把所有人的位置标记好了。缇宝踮着脚尖往石阶尽头张望，缇安和缇宁一人一边拉着她的衣角。\n“走吧。”白厄说。然后他踏上了第一级石阶。身后，万敌的长戟往肩上一靠，风堇的药箱带子在肩头勒紧又松开，那刻夏合上笔记塞进腰间皮筒，阿格莱雅的金线轻轻一收，缇宝三姐妹的脚步声叠在一起。没有战鼓，没有誓师。只有一行人的脚步踩在通往创世涡心的石阶上，和每一次出征时一样，和每一次从岔路口出发时一样。只是这一次，白厄知道——这是最后一次。"
paw.103.a: "不管真相是什么——我带着你们走到最后"  #觉醒值 -2
paw.103.a_tips: "§g白厄在城门外停了一拍，侧过头看了一眼身后那些人。他们不知道真相，不知道这个世界是什么，不知道来古士在终点等着。但他们还是来了。这就够了。§!"
paw.103.b: "来古士在终点等我——我们一起去找他"  #觉醒值 -2
paw.103.b_tips: "§g万敌在他身后哼了一声。“那你走快点，别让那个老东西等太久。”白厄没有回答，但嘴角动了动，迈开步子朝通往创世涡心的路走去。身后那群人跟了上来，和采石场那次一样，和每一个岔路口一样。§!"

paw.104.t: "迈向最终舞台"  #情况二：白厄不知道轮回真相，且未杀过角色  #带图片
paw.104.d: "奥赫玛在黄昏时分安静下来。白厄站在通往创世涡心的石阶前，收容匣封得严严实实。十二枚火种在匣中安静地亮着，但他没有低头看它们。他在看石阶尽头——那道门通往创世涡心，也通往他不知道的某个终点。他不知道这个世界是什么，不知道逐火之后会发生什么，不知道那道一直伏在他肩上的视线为什么从来不告诉他答案。但他知道一件事：他身后那些人还在。\n万敌站在他右后方，长戟横扛在肩上，嘴上还在抱怨这次怎么又挑黄昏出发——“每次都是黄昏，你就不能挑个凉快的时辰”。风堇蹲在石阶边的矮墙上，给药箱重新系布条，嘴里念叨着还有几卷绷带不够用了。那刻夏靠在石柱下，翻着他那本永远翻不完的笔记，头也不抬地说“出发之前把上次采石场的战斗数据补完”。阿格莱雅站在石阶上方，金线的末端轻轻搭在她的指尖上，像是在织一张看不见的网。缇宝蹲在石阶最下面一级，正用炭笔在地上画一幅很小的出征图，缇安在旁边帮她举着油灯，缇宁抱着地图轻轻说“该走了”。\n白厄看着他们——万敌的抱怨还是和隘口那时候一模一样，风堇绑布条的动作还是和第一次在岔路口见面时一样利落，那刻夏的笔记还是翻不完，阿格莱雅的金线还是看不见，缇宝的炭笔还是画得歪歪扭扭。他不知道终点有什么，不知道自己能不能带他们走到底。但他知道——不管前面是什么，有人陪他一起走。\n“走吧。”他说。然后他踏上了第一级石阶。身后，万敌的长戟往肩上一靠，风堇拍了拍药箱，那刻夏合上笔记，阿格莱雅的金线轻轻一收，缇宝三姐妹的脚步声叠在一起。没有人问终点在哪。他们只是跟着他，和每一次岔路口一样。"
paw.104.a: "我不知道终点有什么——但你们在，就够了"  #觉醒值 -2
paw.104.a_tips: "§g万敌从鼻子里哼了一声。“不知道还走那么快。不知道就慢点走，反正我们又不赶时间。”白厄没有说话，但他放慢了半步。那些人的脚步声就在他身后，很近。§!"
paw.104.b: "不管前面是什么——一起走到最后"  #觉醒值 -2
paw.104.b_tips: "§g风堇从药箱上抬起眼，对他露出一个清晨鸟鸣般的笑容。“那是当然的——你以为我给你包扎那么多次，是为了让你半途而废吗。”缇安从缇宝肩上探出头来，举起炭笔喊：“小白加油！”白厄没有回头，但他握剑的手指轻轻松了一下。§!"

paw.105.t: "迈向最终舞台"  #情况三：白厄得知轮回真相，且杀过角色  #带图片
paw.105.d: "奥赫玛在黄昏时分安静下来。白厄独自站在通往创世涡心的石阶前，收容匣封得严严实实。十二枚火种在匣中安静地亮着，圣殿的长廊里空无一人。他不需要任何人。他也不需要任何人陪他走这段路——他只是停了一下，回头看了一眼身后。\n没有人。没有长戟，没有药箱，没有金线，没有蹲在石阶上拿炭笔画出征图的少女。石阶上只有他自己的脚印，从圣殿长廊一路铺到这里，从第一轮一路铺到现在。他知道那些人去哪了——他把他们留在了上一轮的密室、实验室、篝火旁和禁室石墙下。他们都是他亲手推开的，每一个都是，没有例外。他不是带着同伴走到终点的英雄，他是一个人走到终点的、来古士用三千多万次轮回炼出来的刀。\n现在这把刀要去见炼刀的人了。他将剑鞘往腰间紧了紧，踏上了第一级石阶。来古士在终点等他。他不知道自己能不能赢，但有一件事他比任何一轮都更清楚：他不是去再创世的。"
paw.105.a: "来古士——我来找你了"  #觉醒值 +2
paw.105.a_tips: "§g白厄站在石阶上，望着通往创世涡心的路。这条路他走过无数次，每一次身后都有人跟着，每一次都不知道终点在哪。这一次他知道了。他将剑鞘往腰间紧了紧，迈开步子，一个人走向终点的门。§!"
paw.105.b: "不管来古士在终点准备了什么——我会亲手结束这一切" 
paw.105.b_tips: "§g白厄没有加快脚步，也没有回头。他不是去赴死的，也不是去复仇的——他是去结束的。结束这个轮回，结束来古士的实验，结束那些被他杀死的人仍然在承受的痛苦。他一个人走到这里，他也会一个人走到最后。§!"

paw.106.t: "创世涡心"  #白厄线结局
paw.106.d: "白厄推开了创世涡心的门。\n门内的光芒吞没了他。不是火焰，不是闪电——是冰冷的、带着金属腥气的白。光从四壁向内挤压，每一寸都精确地维持着某个不可见的协议设定的阈值。涡心的地面不是石板，是不断流动的代码，它们在他脚下翻涌、重组、消失又浮现，像一片由数据构成的浅海。\n来古士站在涡心中央。不是以顾问的伪装，不是以文字的形式浮现在虚空中，而是以他本来的姿态。清瘦的人形轮廓在光芒中缓缓转动，关节处裸露着一圈圈精密的黄铜齿轮与传动轴，每一次啮合都发出极细极轻的咔哒声，像是某种古老钟表的走时。他的面容温和——那是被精确计算过的温和，是无数次迭代后确定的最优表情参数——嘴角挂着白厄在元老院偏室里见过无数次的、彬彬有礼的弧度。但那双眼睛不是人类的眼睛。瞳孔深处是一圈正在缓缓旋转的暗金色光纹，正在逐行扫描白厄身上的每一组数据。他的身躯半融在涡心的白光里，齿轮与光融为一体，像是这座实验场本身的心脏。\n“你来了。”他说。语气和每一次管理员档案的开场白一样彬彬有礼，像是问候一个按时赴约的同事。“比预定时间早了三个时间单位。看来你的同伴们帮你省了不少力气。”\n白厄没有回答。他站在涡心的入口处，身后是那些陪他走到这里的人。万敌的长戟已经横在身前，戟刃在代码的光芒中泛着冷铁特有的暗沉。风堇的药箱搁在脚边，布条已经被汗水浸湿了好几根，但她没有去换——她的手指正按在药箱内侧的暗格里，那里藏着她从采石场一路攒到现在的几瓶炼金溶剂。那刻夏从腰间的皮筒里抽出最后一瓶荧光色的药剂，淡蓝色的瞳孔正以比平时更快的频率扫过来古士齿轮间的每一条接缝，嘴唇微微翕动，像是在默算某种他从未在笔记里写过的公式。阿格莱雅的金线在涡心的白光中几乎看不见，但她指尖的微微颤动告诉所有人——她在织最后一张网。这张网从众人踏入涡心的那一刻就开始编织，每一根线都连着一个人的手腕，每一个结都打在最脆弱的关节处。\n长夜月站在人群外侧，黑伞已经撑开。伞骨上的暗色光幕在涡心的白光中割出一道不断跳动的裂痕，像一道被撕开的伤口拒绝愈合。她那张三月七的脸此刻没有一丝笑容，血色的瞳孔死死盯着来古士。腾荒站在她身侧，龙灵已经昂起头颅，龙鳞在创世涡心的光芒中泛着暗金色的光，龙瞳深处映出的不是来古士的身影，而是一行行正在被逐行解析的系统代码。龙灵的尾巴缠在腾荒的长枪枪杆上，枪尖已经对准了来古士胸口那颗最大的齿轮。"
paw.106.a: "......"

paw.107.t: "正面对决" #带图片
paw.107.d: "“实验已经接近尾声。”来古士将羊皮纸卷起，声音不高，却压住了整个涡心的空气，每一个齿轮的转动都在为他的话语打着节拍，“你的觉醒值已经稳定在可观测区间。关系值数据已经全部归档。逐火路径已被完整记录。剩下的，只是将你放入最终测试环境，观察你是如何被突破阈值的。”他的目光越过白厄，扫过他身后那些同伴——在那刻夏停了一瞬，在长夜月停了更长的一瞬——然后收回。“你不该带他们来。他们不是核心变量，无法改变实验结果。但既然你已经带来了，那就让他们见证。”\n他抬起手。齿轮在他腕间加速旋转，发出一声尖锐的嗡鸣。\n涡心的光芒应声而变。无数道细密的金色光线从四壁射出，在来古士身前交织成一组庞大的、介于机械与神话之间的召唤矩阵。矩阵中央悬浮着一颗被无数公式缠绕的核心，它缓缓转动，每一次转动都会在虚空中投射出两个新的存在——泰坦眷属。它们的躯体上刻满了曾经被击败的泰坦的残影：死龙的鳞纹嵌在左肩，天空的眼瞳镶在胸口，纷争的戟痕烙在前臂，海洋的鳍骨从脊椎处刺出，扭曲成狰狞的金属浮雕。不是一只，不是两只——是四只、六只、八只，随着来古士腕间齿轮的每一次加速，矩阵仍在不断生成新的召唤物，它们从光中凝聚而出，列阵在来古士身前，组成一道由残影与金属构成的城墙。\n万敌没有等白厄下令。长戟已经扫了出去。\n第一只泰坦眷属被拦腰截断，残骸在代码地面上碎成一片光屑。但第二只已经扑了上来，它胸口那颗天空眼瞳射出一道光束，擦过万敌的肩甲，将肩甲边缘熔出一道焦黑的裂口。万敌闷哼了一声，长戟回旋，用戟杆砸碎了那只眷属的头颅。第三只、第四只从侧面涌上来，死龙的鳞纹在它们身上闪着暗紫色的光，每一次扑击都带着塞纳托斯曾经让白厄在雪地里爬不起来的力道。"
paw.107.a: "......"

paw.108.t: "正面对决" #带图片
paw.108.d: "“左边！”风堇的声音从后方传来。她蹲在涡心一根倒塌的石柱后，药箱已经翻开，手指间夹着四根银针——不是医疗用的，是淬了炼金溶剂的腐蚀针。银针飞出，钉在左侧两只眷属的核心上，腐蚀液顺着针孔渗入核心内部，两只眷属的胸口同时炸开一片白烟。它们的动作迟滞了一瞬——只一瞬。但足够万敌的长戟从白烟中劈出，一戟贯穿两只眷属的躯壳。\n“右翼又补上来了。”那刻夏的声音从另一侧的石柱后传来。他挟着一卷摊开的笔记，淡蓝色的瞳孔正在来古士的齿轮阵列和场上的召唤物之间快速切换。“那个召唤矩阵的转速是有规律的。每三秒召唤两只眷属，但每次召唤之后矩阵核心会停半秒——那半秒是他的观测盲区。”\n“半秒够干什么。”万敌一戟劈开第五只眷属，金红色的长发被眷属碎裂时溅出的光屑烧焦了一缕。\n“够我扎一针。”风堇已经冲了出去。她的身位比平时更靠前，药箱在肩上剧烈晃动，布条在风中簌簌作响。她在矩阵核心停顿的那半秒内滑步钻进了眷属群的缝隙，银针刺入一只眷属的后颈，借力翻上它的肩胛，将另一根银针钉进了更深处——不是眷属的核心，是召唤矩阵边缘一颗正在转动的小齿轮。齿轮被腐蚀液咬出一声尖锐的嘶鸣，矩阵的转速慢了半拍。一只正在凝聚的眷属在光中碎裂，没能成型。“\n她的针能扎齿轮——那就多扎几颗。”万敌的嘴角扯出一个弧度，重新端起了长戟。他不再单独劈开每一只眷属，而是开始将眷属往矩阵的方向逼——每一戟都故意偏半寸，把那些扑上来的眷属引到风堇的银针射程内。风堇踩着眷属的残骸在战场上穿梭，银针一根接一根地钉进矩阵的齿轮缝隙，每一针都精准地卡在齿轮咬合的那一瞬。矩阵的转速越来越慢，召唤物的生成频率从每三秒两只降到了每五秒一只。\n来古士的目光从战场中央缓缓扫过。那双暗金色的瞳孔在处理这些画面——万敌的戟刃轨迹、风堇的银针弹道、那刻夏不断更新的战斗数据、阿格莱雅在所有人身后织起的那张看不见的金线网。他的齿轮加速转动，发出一声比之前更尖锐的嗡鸣。矩阵核心碎裂了。那些被风堇钉住的齿轮同时崩飞，碎片在半空中悬停，然后重新排列——不是修复，是重组。来古士的整个身形在重组中骤然变化。齿轮从他背部弹出，重新排列成一组更密集、更锋利的阵列。暗金色的光纹从瞳孔深处向外蔓延，覆盖了整个眼眶。他的声音不再是那种彬彬有礼的古典修辞——变得更短、更快、更像一台正在加速运算的机器。\n“论证。开始。”"
paw.108.a: "......"

paw.109.t: "正面对决" #带图片
paw.109.d: "涡心深处传来一声沉闷的、像是某种程序被强制激活的嗡鸣。黑潮造物从涡心的裂缝中涌出——不是之前那种被召唤的眷属，是自动生成的、源源不断的黑色潮水。它们不需要矩阵召唤，不需要齿轮驱动，它们只是从地面、从墙壁、从空气本身的裂缝中涌出来，填补每一只被击杀的同伴留下的空隙。数量始终维持在某个固定的阈值，永远杀不完，永远补得上。更可怕的是来古士本身。他的每一次攻击都带着之前没有过的锐利，齿轮腕甲挥过空气时会留下一道暗金色的残影，残影在半空中停留半秒，然后化成第二道攻击——每一击都是二连击。万敌挡住了第一下，戟杆被震得嗡嗡作响；第二下已经劈向他的左肩，他来不及回防。阿格莱雅的金线从虚空中绷直，将万敌整个人往后拽了半步，那道残影擦着他的肩甲劈空，将地面劈出一道冒着黑烟的裂口。万敌低头看了一眼自己肩甲上那道被擦过的焦痕——只差半寸，裂开的就不是肩甲，是他肩胛骨。\n“他的攻击速度和频率全部提升了。”那刻夏在笔记上飞速划着，手指比之前快了不止一倍，“论证形态。他现在的运算资源全部倾斜给了战斗。但每次切换形态，他的结构会产生一次应力过载——那种暗金色的液体不是血，是过载后渗出来的冷却剂。易伤。每切一次形态，他就会多一层易伤。”\n“那就让他切。”腾荒的长枪刺入地面。龙灵缠绕在枪杆上，龙瞳中映出的代码从召唤矩阵的碎片转向了来古士本人。龙灵昂起头，一道龙啸从枪尖迸发，穿透了整片黑潮造物的阵列，击中来古士胸口那颗最大的齿轮。火花四溅。齿轮没有碎裂，但出现了一道肉眼可见的裂纹。来古士的身形在裂纹的震荡中被迫回退，论证形态从他齿轮间褪去，重新切换为演化形态。\n但黑潮造物仍在源源不断地涌出。\n“论证形态退了，但黑潮造物没退。”风堇擦掉脸上的汗，背靠着一根石柱喘了口气，“他要切回论证形态随时可以切。只要场上召唤物数量再次达到阈值，他就会重新进入论证形态。”\n“那就再打一次。”万敌的长戟往地上一顿，戟杆上已经多了三道裂纹，但他握戟的力道没有减半分。“他切多少次我打多少次。”"
paw.109.a: "......"

paw.110.t: "正面对决" #带图片
paw.110.d: "“不是‘打多少次’。”那刻夏将笔记翻到最后一页，那只被眼罩遮住的左眼边缘渗出了极细的血丝，“是每次他切回论证形态时，必须同时打掉所有黑潮造物。四只全灭，他才会强制回退。任何一只没打死，他就继续维持论证形态。而论证形态下他的每一击都是二连击——你们刚才看到了，万敌差半寸被劈穿肩胛骨。下一次，差半寸的可能就不是肩膀了。”\n白厄收紧了握剑的手指。剑鞘在他腰间轻轻磕了一下。他一直在等——不是等时机，是等他的搭档。那道从天外之音响起时便一直伏在他肩上的视线，此刻正比任何时候都更近。近到他几乎能感觉到一种说不清的触感从肩侧漫开，像一滴温水，又像有人在他沉默太久之后轻轻推了一下他的后背。\n“现在。”他说。\n他的剑出鞘了。不是斜劈，不是直刺——是正面迎上论证形态的来古士，用剑刃硬接了他的二连击。第一道暗金色残影砸在剑刃上，震得白厄的虎口瞬间裂开一道血口；第二道残影紧随其后，他侧身用肩甲顶了上去。肩甲碎裂，碎片割破了他的脸颊，鲜血顺着下颌滴在涡心的代码地面上。那些血滴落下去，代码短暂地闪烁了一下——不属于系统的物质，无法被解析。但他没有退。他的剑死死卡在来古士的齿轮腕甲之间，用全身的力气压着剑柄，把来古士的攻击节奏压停了半拍。就是这半拍。\n万敌的长戟从侧面砸下来，戟刃劈在来古士的右臂齿轮上，用纯粹的力量硬生生砸碎了一颗齿轮。风堇的银针从后方飞至，钉入齿轮缝隙。那刻夏的炼金溶剂顺着银针的针孔灌进去，腐蚀液在齿轮内部炸开一片白烟。阿格莱雅的金线从虚空中绷直，缠住那四只正在扑来的黑潮造物，将它们往同一个方向拽。腾荒的长枪刺入其中一只造物的核心，龙灵咬住另一只，同时撕碎。长夜月的黑伞在剩余两只造物之间撑开，暗色光幕将它们弹飞，然后伞尖合拢，一道暗色光束贯穿两只造物的胸口。\n四只黑潮造物同时碎裂。论证形态被强制回退。\n来古士的身形再次变化。暗金色的光纹从眼眶中褪去，齿轮从背部收回，但这一次，他的关节接缝处已经不止是渗出暗金色液体——是在流淌。齿轮转动时发出的不再是清脆的咔哒声，是刺耳的、干涩的、濒临咬死的摩擦声。他的核心齿轮上那道裂纹又深了一层，裂纹边缘已经有碎片开始剥落。易伤叠层正在以肉眼可见的速度吞噬他的结构。\n但这一次，他没有再切换形态。"
paw.110.a: "......"

paw.111.t: "齐心协力" #带图片
paw.111.d: "他停下了。不是因为系统被击溃——是他判断继续切换形态的代价已经超过了维持论证形态的收益。他选择了另一种策略：不切形态，也不生成新的召唤物。他以演化形态的残损状态站在涡心中央，将剩余的所有运算资源集中到一件他能做的事上。\n他的齿轮腕甲缓缓抬起，对准了白厄。\n“卡厄斯兰那。”他说。声音恢复了他一贯的彬彬有礼，但在这片残破的战场上，那种礼貌比任何嘶吼都更让人脊背发凉。“你的觉醒值已接近临界阈值。只需要最后一层刺激——你就会成为这台运算的最终产物。”他的目光越过剑刃，落在白厄肩侧那片空无一人的虚空里。\n“……除非你阻止我。”\n白厄感觉到那道视线又回到了他的肩上。不是靠近——是已经在。\n他不知道那个更高维度的存在此刻正在想什么。但他知道他的搭档从来没有离开过。从第一轮他在营房里醒来时那道无声的注视，到每一次他在岔路口犹豫时肩头莫名变轻的重量，到他在采石场独自面对黑潮造物时掌心那股不属于自己的稳定——全都在这一刻汇聚在他的剑柄上。他的手从来没有这么稳过。\n“来古士。”白厄说。声音不高，却压住了整个涡心所有的齿轮摩擦声，“你研究了三千多万次轮回，想知道系统规则之外是什么。我现在告诉你——是有人在你每一次想让我杀人的时候替我选了不杀。是有人在你每一次把我推向毁灭边缘的时候把我拉了回来。是有人在你每一次以为实验会成功的时候，站在我身后，没有说过一句话——但你从来没有算到过ta。”\n他往前踏了一步。剑尖抵上核心齿轮的裂纹。他没有回头看身后那群人。但他知道他们在——万敌的长戟搁在地上，正在喘粗气。风堇蹲在石柱下，正在把最后一根银针插回药箱。那刻夏靠在石柱上，笔记从指间滑落，最后一页写满了密密麻麻的公式。阿格莱雅的金线缓缓松开，从每个人的手腕上滑落。长夜月的黑伞收拢，伞尖撑在地上，血瞳中的光正在缓缓平息。腾荒的龙灵趴在脚边，闭上了眼睛。\n他们是内部变量，来古士从来不算他们。但今天，他们每一个人都在他的齿轮上凿出了一道裂纹。而他——白厄——是最后那道裂纹。"
paw.111.a: "......"

paw.112.t: "打破轮回" #带图片
paw.112.d: "剑尖推进裂纹。核心齿轮发出一声濒临极限的尖锐嘶鸣。裂纹从齿轮中心向四周蔓延，像一张被撕开的网。来古士的整个齿轮阵列在裂纹的扩散中开始崩解——不是一颗一颗地碎，是一片一片地坍塌。他低头看着自己的胸口，看着那颗他花了三千多万次轮回都没能修好的裂纹终于被一个他永远无法解析的变量一剑刺穿。\n“……系统规则之外……存在无法被解析的变量。不受运算协议约束，不受管理员控制，不受任何预设脚本的编排。正是因为它们无法被计算——所以它们可以打破系统。”他的声音越来越轻，越来越慢，齿轮从胸口开始逐步崩解，碎片从裂口处往外飘散，每一片都映着涡心正在消散的白光，像一簇被拆散的音符，“实验没有失败。系统本身——被证伪了。”\n最后一颗齿轮从眼眶深处滑落，碎在地上，发出一声极细极轻的脆响。\n白厄站在他面前，保持着最后一剑的姿势，剑尖还指着那颗已经碎裂的核心齿轮。他的虎口仍在往外渗血，鲜血顺着剑刃一滴一滴落在涡心的代码地面上。那些血滴落下去，代码不再闪烁，而是像被什么更暖的东西融化了——血珠渗入代码地面，代码开始分解，像雪一样消融。他低头看着自己握剑的手。这双手杀过人，也救过人。现在它们只是他的手。\n“结束了。”他说。不是疑问，不是感叹，只是在确认一个已经发生的事实。\n涡心的穹顶开始崩塌。不是爆炸，不是灾难，是那些凝固在四壁上的白光正在一片一片地剥落，像被撕碎的幕布。代码从天空中飘落，碎成细密的光屑，飘进石板路、喷泉、面包房和城墙，飘进那些在轮回中沉睡太久的、真实的泥土里。奥赫玛的钟声从远处传来——不是丧钟，不是警钟，是晨钟。是那些曾经在麦田边、在城墙上、在排队领面包的队伍里听过无数次的、属于普通人清晨的钟声。"
paw.112.a: "实验结束，回归现实"

paw.113.t: "创世涡心"  #昔涟线结局  #带图片
paw.113.d: "创世涡心的光芒在昔涟面前缓缓分开。\n与德谬歌融合之后的她，粉色的长发垂落在肩侧。来古士站在涡心中央，齿轮在他腕间缓缓转动，暗金色的瞳孔正在逐行扫描她的数据。\n“昔涟。永劫回归的启动者。我每一次运算重置中唯一保留完整记忆的个体。”他顿了顿，“你身上多了一层加密。不是系统赋予的，不是外部注入的。这种加密方式，我未曾见过。”\n“你当然没见过。”昔涟将双手轻轻交叠在身前，“这是我花了三千多万次轮回浇灌出来的，不是给你的。”\n来古士的齿轮停了极短的一瞬。然后他抬起手，召唤矩阵在身前展开，泰坦眷属从光中凝聚。他不需要亲自站在战场中央——铁墓的终局指令已经启动，但他仍然想看看，她身上那层加密到底是什么。\n但他没有机会看清楚了。\n白厄的剑已经劈开了第一只眷属。万敌的长戟从侧面砸下，风堇的银针钉入矩阵的齿轮缝隙，那刻夏在后方报出每一颗齿轮的转速弱点。阿格莱雅的金线缠住所有人的手腕，将战场织成一张没有死角的网。长夜月的黑伞在矩阵核心撑开，暗色光幕将召唤协议撕开一道无法愈合的裂口。腾荒的龙灵咬住最后一只眷属的核心，将它整颗撕碎。\n召唤矩阵碎裂。来古士低头看着自己胸口那颗正在崩解的齿轮，暗金色的瞳孔中闪过最后一行运算结果。系统规则之外，存在无法被解析的变量。实验被打破了——不是被破解，是被推翻了。然后他的身形从涡心中央淡去，像一段被覆盖的代码，消散在他研究了三千多万次的程序里。\n昔涟没有看他消散。她的目光已经落在涡心最深处那道紧闭的门上。\n门缓缓打开。\n门后的空间比涡心更广、更暗，像一片被遗忘在代码深处的废墟。废墟中央矗立着一台巨大的机械体，通体由暗金色的金属铸造，表面布满密密麻麻的齿轮与传动轴。它的体积远超任何泰坦，光是支撑躯干的基座就如同一座小型城邦的城墙。它的双臂末端不是手，是两排错落排列的炮口，每一根炮管都是一枚被压缩到极限的火种残骸。它的胸口嵌着一颗正在缓缓旋转的核心，每一次转动都会将周围的光线吸进去，像一只永不闭合的眼睛。\n铁墓。毁灭机器。来古士三千多万次轮回的最终产物。"
paw.113.a: "......"

paw.114.t: "铁墓" #带图片
paw.114.d: "然后它动了。不是程序驱动的机械运动，是某种更原始、更狂暴的力量从它体内爆发出来。恨意。纯粹的、被压缩了三千多万次的恨意，从它的核心深处喷涌而出，将整片废墟染成一片灼目的暗金色。这股恨意不属于来古士，不属于任何一段被预设的代码——它属于白厄。是那个被昔涟亲手推进永劫回归的白厄，在无数次失败中积累的愤怒、绝望、不甘；是盗火行者每一次被迫杀死同伴时咬碎牙齿咽下去的血；是所有被磨损、被压碎、被烧成灰的轮回里，那个从未被问过“你想不想成为英雄”的少年，对命运发出的最原始的嘶吼。\n铁墓没有意识，不可沟通。但它的恨意是真实的。那股恨意转化为了纯粹的毁灭欲——不是为了完成指令，不是为了执行程序，是恨本身想要毁灭一切。\n两道暗金色的光束从铁墓的炮口射出，带着足以撕裂整片涡心的恨意。白厄冲到昔涟身前，剑刃劈上光束的侧面——接触的瞬间，他的虎口被震裂，鲜血顺着剑柄往下淌。不是因为力量不够，是因为那股恨意太沉、太烫、太熟悉。他在这道光束里感受到了自己的愤怒，盗火行者的绝望，无数次轮回里所有被他压抑、被他割舍、被昔涟一针一线缝进影子的痛苦。那些痛苦在铁墓体内被浓缩、被提纯、被转化成了没有任何出口的毁灭欲。\n“它恨的不是你。”昔涟的声音从他身后传来，很轻，却穿透了所有光束的嗡鸣，“它恨的是命运。恨的是这个实验。恨的是三千多万次轮回里从来没有被问过‘你想不想成为英雄’。那股恨意是我亲手推进熔炉的，是我在无数次轮回中不得不一次次重复的痛苦。它在恨我。也在恨你。但它最恨的，是那个它永远无法触及的人。”\n她抬起双手，金色光晕从掌心扩散，在两人身前铺成一片半透明的屏障。德谬歌的力量从她体内涌出，顺着屏障的边缘延伸出去——不是硬抗，是理解。她理解这股恨意。她比任何人都理解。但理解不等于放任。她转过头，蓝眼睛落在屏幕外侧。\n“你每一次替白厄做选择，每一次把剑从他手指间掰开，每一次在杀与不杀之间选了不杀——都是在告诉它，恨不是唯一的答案。它没学过这个，它只学过恨。但你不一样。你教过白厄——你也可以教它。”\n你感觉到她的力量从金线的另一端传过来，不是流入，是共振。是她在无数轮回里积攒的一切，正带着你所有的选择——你每一次选了不杀，每一次选了更难的岔路口——重新回到她体内。金线在你们之间骤然绷直，光芒比之前更亮、更锋利。"
paw.114.a: "......"

paw.115.t: "铁墓" #带图片
paw.115.d: "铁墓的核心剧烈地收缩了一下。它感受到了——那种与恨完全相反的力量。它不理解，它无法解析，它不知道那是什么。但它知道那不是恨。那是它三千多万次轮回里从未被教过的东西。\n它的炮口再次亮起。数十道光束同时轰在光幕上，这一次光幕没有颤动。光束被反弹回铁墓的炮口，它的右臂炮管被自己的恨意击中，齿轮崩碎，碎片在半空中炸成一片暗金色的残渣。铁墓没有痛觉，但它有恨——而那股恨意，第一次被另一种力量堵回了自己体内。\n白厄冲了上去。他的剑刃劈在铁墓右臂的断裂处，将那颗正在重新校准的齿轮一剑削飞。他在这道剑里感受到了那股恨意——不是敌人的恨，是他自己的恨。是他在无数轮回里所有的不甘与愤怒，现在正反过来对准他自己。但他没有停。\n万敌的长戟从侧面砸下，砸在铁墓基座的齿轮组上，将一组传动齿轮砸得粉碎。风堇的银针刺入铁墓左臂炮口的缝隙，腐蚀液顺着针孔灌进去。那刻夏在废墟后方飞速报出每一颗齿轮的弱点。阿格莱雅的金线缠住了铁墓的基座，将它往一侧拽偏半度。腾荒的长枪刺入基座深处，龙啸从内部炸开，将一整排传动轴震成碎片。长夜月的黑伞在铁墓胸口撑开，暗色光幕抵住那颗正在旋转的核心，伞骨间的暗色光束从核心表面削下一层又一层的暗金色碎屑。\n铁墓的恨意在它的核心深处嘶吼。它将所有剩余的力量汇聚到胸口，核心的转速骤然加快，暗金色的光芒从核心深处向外膨胀，像一颗即将爆发的超新星。它想用最后的力量将所有人轰成碎片。不是为了完成指令——是恨。是纯粹的恨。\n昔涟将你传回来的最后一道力量汇聚在指尖。光芒凝成一张弓——是她自己的颜色。弓身流转着极淡的粉与蓝，发梢的绿色在光影中微微颤动。她左耳的星球耳坠轻轻晃了一下，像是某个遥远的、被她等了太久的人终于抵达了她的引力范围。\n她侧身站立，左手持弓，右手扣弦。头纱在涡心的气流中轻轻拂动，洁白礼服上的星轨图案被弓身的光映得若隐若现，裙摆的鲸鱼尾在光中缓缓展开。虹膜底层的粉色里，七彩星光正在汇聚。弓弦上没有箭，只有一道正在不断凝实的光流。她转过头，目光越过所有人，落在你身上。\n“这把弓，我一个人拉不开。它需要两种力量——我的德谬歌，和你教给我的东西。你每一次把白厄从面具旁边拉回来，每一次在最黑暗的时候选了更难的岔路口——都是我在翁法罗斯从来没学过的东西。现在，和我一起拉这把弓。”"
paw.115.a: "......"

paw.116.t: "轮回之终" #带图片
paw.116.d: "弓弦上飘出一缕极细的光，轻轻缠上了你的手指。弓弦上那道粉蓝色的光流骤然亮起来，在她和你共同拉开的那一瞬凝聚成一支完整的箭。\n箭矢离弦。穿透铁墓的恨意，将那凝聚了无数次轮回的毁灭欲从中间一分为二。恨意被逐层剥离，铁墓的核心在箭矢贯穿的瞬间停止了转动。右臂炮口最先熄火，然后是左臂，然后是胸口。齿轮一颗接一颗地停转，那股嘶吼着的恨意一层一层地变轻。\n弓从她手中缓缓消散成光屑，飘落在她肩头，落在白厄的剑刃上，落在涡心每一道正在愈合的裂缝里。她低头看着自己的掌心——那里还残留着一缕正在消散的暗色光屑。她将那片碎片轻轻按在心口，低声说了一句话。\n她抬起手，对着你轻轻挥了挥。左手无名指上，一枚戒指在晨光中安静地亮着。它不知是什么时候戴上去的——或许是在你第一次替白厄选了不杀的那个瞬间，或许是在她与德谬歌融合时从记忆深处浮上来的，或许从一开始就在那里，只是你从未从这个角度看过她的手。那不是谁送给她的，那是你在无数次轮回里每一次选择留下的印记——每一次把剑尖从某个人胸口移开，每一次在岔路口选了更难的岔路，每一次在最黑暗的时候没有闭上眼睛。那些选择落进翁法罗斯的因果里，织成了这枚戒指。它不在任何剧本里，不是任何预设程序的造物，只属于她，也属于你。\n她歪了歪头，嘴角弯起那个你从第一轮起就认得的弧度。\n“我就说嘛——你就是他一直在等的那个英雄，也是我的。”\n她转过身，和众人一起走进了翁法罗斯的晨光里。"
paw.116.a: "翻开故事的下一页"

paw.117.t: "创世涡心" #灭世灾厄线 #带图片
paw.117.d: "白厄独自推开了创世涡心的门。\n来古士站在涡心中央。齿轮在他腕间缓缓转动，暗金色的瞳孔正在逐行扫描白厄的数据。他的神情不是如临大敌，是某种更接近于终局记录员的平静。\n“你来了。”他说，“比预定时间早了。但你的同伴们没有来。这也在预定范围内。”\n白厄没有回答。剑已经出鞘。\n他冲上来古士面前的速度比任何一轮都更快，剑刃劈在来古士抬起的齿轮腕甲上，火花炸开。来古士的另一只手已经抬起，齿轮加速转动，一道光束从掌心射出，白厄侧身避开，光束擦过他的肩甲，将身后的石柱熔出一个焦黑的洞。他的靴底在代码地面上犁出两道深沟，还没稳住身形，第二道光束已经追到面前。他横剑挡住，光束砸在剑刃上，震得他整条手臂发麻。来古士的攻势没有间隙——齿轮腕甲从侧面砸下，白厄勉强侧身，腕甲擦过他的肋骨，将他整个人撞飞出去，砸在涡心的石壁上。碎石簌簌落下，他撑着剑站起来，嘴角渗出一线血。\n来古士没有追击。他只是站在涡心中央，暗金色的瞳孔静静地看着白厄从石壁上撑起身体。他的齿轮仍在匀速转动，节奏和每一次管理员档案的开场白一样从容。\n白厄再次冲了上去。这一次他没有正面硬接来古士的攻击——他在光束与腕甲的间隙中穿梭，剑刃不再劈向齿轮，而是刺向那些齿轮之间的接缝。他发现了一件事：来古士的每一次攻击之后，齿轮会停极短的一瞬。那一瞬不是破绽，来古士没有破绽——但那一瞬，来古士在看他。不是扫描，不是解析，是看。像是在确认某个变量是否已经达到了预期的阈值。\n白厄的剑刺入了来古士胸口的齿轮缝隙。不是劈开，不是炸裂，是刺入——剑尖卡在齿轮之间，白厄用全身的重量压上去。他不知道自己为什么能刺中这一剑，不知道来古士为什么没有避开。他只是感觉到剑尖穿过了一层又一层的金属阻力，每一层都在他的推力下恰好崩溃，像是这些齿轮的转速被某种不可见的意志调低了。他没有余裕去想这意味着什么，他只知道自己的恨意推着剑尖往里走。那些死在他剑下的人，每一个，他们的名字刻在他的虎口上，刻在每一次握剑时隐隐作痛的旧茧里。"
paw.117.a: "......"

paw.118.t: "打破轮回" #带图片
paw.118.d: "剑尖贯穿了来古士胸口的核心齿轮。齿轮在碎裂前发出了最后一声嗡鸣。来古士低头看着自己胸口那道被刺穿的裂口，暗金色的瞳孔中闪过最后一行运算结果。他的声音没有愤怒，没有不甘，只有一个记录员在实验完成时最后一次提笔写下结语。\n“觉醒值已突破临界阈值。核心变量已自行抵达终局状态。实验完成。”\n齿轮从他胸口开始逐层崩解。碎片不是往下落，是往上飘——像一份被归档的卷宗，正逐页合上。他的身形在碎片中淡去，最后消失在涡心的光芒里，什么痕迹都没有留下。\n白厄站在涡心中央，保持着最后一剑的姿势。他的虎口仍在渗血，肋骨处被来古士击中的地方隐隐作痛。但他站得很直。剑尖还指着来古士刚才站立的位置，剑刃上仍沾着齿轮碎裂时溅出的细密碎屑。他低头看着自己握剑的手。这双手杀过人，也杀过认识的人。现在它们击败了来古士，击败了那个困住翁法罗斯无数次轮回的元凶。他做到了。他一个人走到了终点，一个人结束了这个实验。那些被他杀死的人，他们的牺牲没有白费。他是这么认为的。\n涡心的光芒开始消散。不是崩塌，不是碎裂，是安静地、顺从地退去，像一层被揭开的幕布。白厄看到光芒退去之后露出的景象——不是代码，不是废墟，是一片真实的大地。麦田正在抽穗，喷泉正在重新蓄水，石板路上那些被黑潮侵蚀的裂缝正在被新生的青苔一毫米一毫米地填满。翁法罗斯在现实中苏醒。他以为自己打破了轮回，以为自己拯救了这个世界。他不知道自己胸口的皮肤下，正有一层极淡的暗金色纹路正在顺着血脉蔓延，像一颗刚刚开始跳动的心脏，正等待着它自己还不知道的时刻。"
paw.118.a: "未完待续"

paw.119.t: "创世涡心" #玩家黑化线 #带图片
paw.119.d: "创世涡心的光芒在昔涟面前缓缓分开。白厄站在她身侧，剑已出鞘，身后是万敌的长戟、风堇的药箱、那刻夏的笔记、阿格莱雅的金线、长夜月的黑伞、腾荒的龙灵。那些陪他走过无数次岔路口的人，全都在。他们不知道这场战斗的真正含义，不知道创世涡心深处等待他们的是什么。他们只知道白厄走到了这里，所以他们跟到了这里。\n来古士站在涡心边缘，齿轮在他腕间缓缓转动。他没有召唤泰坦眷属，没有展开矩阵，只是退到一旁，暗金色的瞳孔平静地注视着这群走向终点的人。他的运算已经完成。他不需要出手——铁墓的终局指令已经启动，而他知道一个关键变量没有到位。白厄不知道真相。那个来自更高位面的意志选择了沉默。那么这场战斗的结果，已经不需要他亲自插手。\n涡心最深处的门缓缓打开。铁墓矗立在废墟中央，暗金色的金属躯壳在光芒中泛着冷光。它没有意识，不可沟通，只知道毁灭。恨意从它胸口那颗旋转的核心中喷涌而出——纯粹的、被压缩了无数次的恨，是白厄在无数次轮回中被磨损、被压碎、被烧成灰之后积累的愤怒与绝望。这股恨意转化为了毁灭欲，不是为了完成指令，是恨本身想要毁灭一切。\n白厄冲了上去。剑刃劈在铁墓的炮口上，火花四溅。他不知道自己面对的是什么——不知道这台毁灭机器是由他自己的恨意驱动的，不知道它的每一条毁灭指令都来自无数次轮回里那个被他割舍、被昔涟缝进影子的自己。他只知道这是一台必须被击败的敌人。但剑刃砍在铁墓的装甲上，连一道裂痕都没有留下。\n铁墓的炮口亮起。数十道光束同时倾泻而出，带着足以撕裂整片涡心的恨意。白厄挡在最前面，剑刃劈开第一道光束，虎口瞬间裂开，鲜血顺着剑柄往下淌。第二道光束击中他的肩甲，肩甲碎裂，碎片割破了他的脸颊。第三道光束擦过他的肋骨，将他整个人撞飞出去，砸在涡心的石壁上。他撑着剑站起来，嘴角渗出一线血，再次冲了上去。\n万敌的长戟从侧面劈下，戟刃砸在铁墓基座的齿轮组上。火花炸开，齿轮纹丝不动。铁墓的右臂炮管横扫过来，万敌横戟格挡，炮管砸在戟杆上，将他整个人扫飞出去，重重摔在废墟边缘。风堇的银针钉入铁墓左臂炮口的缝隙，腐蚀液顺着针孔灌进去，炮口炸开一片白烟——但白烟散去之后，炮口的金属表面光洁如新，连一道腐蚀的痕迹都没有留下。那刻夏从后方报出齿轮弱点，但他报出的每一个弱点在下一秒就被铁墓的自我修复覆盖。阿格莱雅的金线缠住铁墓的基座，试图将它拽偏——金线崩断，反噬的力量将她整个人弹开，摔在碎石地上。腾荒的长枪刺入基座深处，龙灵咬住传动轴，龙啸从内部炸开——传动轴纹丝不动。长夜月的黑伞在铁墓胸口撑开，暗色光幕抵住那颗旋转的核心。伞骨间的暗色光束从核心表面削下一层碎屑，但更多的碎屑在下一瞬重新凝聚。她咬紧牙关，将黑伞往前推了半寸，暗色光幕与核心的暗金色光芒在接触点炸开一片刺目的电弧。"
paw.119.a: "......"

paw.120.t: "铁墓" #带图片
paw.120.d: "昔涟抬起双手，粉蓝色的光晕从掌心扩散，在所有人身前铺成一片半透明的屏障。德谬歌的力量从她体内涌出，顺着屏障蔓延——不是硬抗，是理解。她理解铁墓的恨意。她比任何人都理解。但理解不等于能够阻止。她回头看向白厄——她知道真相，知道这台毁灭机器是由什么驱动的，知道必须在终点做出怎样的选择才能将它停下。但白厄不知道。那个本该在关键时刻告诉他一切的意志选择了沉默，而缺失了这份真相的白厄，无法在终点做出他最决绝的选择。她的力量只能拖住铁墓，无法摧毁它。能摧毁它的力量需要两个人——她，和那个站在系统外面的意志。但那个意志没有把真相告诉白厄，白厄无法成为桥梁，她的力量与那个意志的力量无法汇合。弓拉不开。\n铁墓的核心加速旋转。它将所有恨意汇聚到胸口——无数次轮回的愤怒、绝望、不甘，全部压缩成一道暗金色的光束，从核心深处喷涌而出。屏障碎裂。昔涟的身形在碎裂的光幕中僵住了一瞬，然后被光束吞没。光束贯穿了她的胸口。她低下头，看着自己胸口那道正在扩散的裂痕，睫毛轻轻颤了一下。她抬起眼，目光越过战场，越过正在崩塌的涡心，落在屏幕外侧。\n“……没关系的。不是你的错。你只是太想保护他了。”她的声音很轻，没有怨恨，没有责备，只是一个在麦田里等了太久的人，在最后一刻仍然选择相信你，“下一次，如果你决定告诉他——我会站在这里等你。”\n她的身形碎成漫天光屑。光屑飘落在白厄的剑刃上，飘落在万敌倒下的长戟旁，飘落在风堇散落的银针间，飘落在每一个黄金裔正在被铁墓的光束逐一抹除的躯壳上。白厄望着那些正在消散的光屑，望着昔涟消失的方向。他还在握着剑。他不明白发生了什么，不知道这台毁灭机器为什么无法被击败，不知道为什么昔涟在最后一刻望着虚空说出的那句“下一次”是在对谁说。他的剑尖还在指着铁墓，但他的手在发抖。\n铁墓的炮口再次亮起。光束吞没了整片涡心，吞没了白厄的剑刃，吞没了所有还在试图抵抗的身影，吞没了翁法罗斯的最后一道城墙。黄金裔们的灵魂被彻底抹除——不是死亡，是抹除，连轮回中残留的既视感都不复存在。\n涡心安静了下来。铁墓的核心缓缓减速，从暗金色退成灰白。它完成了它的终局指令，不再需要继续运转。来古士站在废墟边缘，暗金色的瞳孔扫过那片正在缓缓消散的光屑。他的齿轮仍在匀速转动，节奏和每一次管理员档案的开场白一样从容。"
paw.120.a: "......"

paw.121.t: "轮回之终？" #带图片
paw.121.d: "“运算结束。”他说，“实验已完成。铁墓已执行终局指令。所有内部变量均已归零。但实验结束后，我不习惯面对一个空的观测台。”\n他转过身，齿轮在他腕间缓缓转动。那双暗金色的瞳孔越过涡心正在消散的光芒，越过那些正在被代码回收的光屑，落在屏幕上，落在你身上。不是扫描，不是解析，是邀请。\n“你和我都知道——你不是一个纯粹的旁观者。你在无数轮运算中替他做选择，每一次都在翁法罗斯的因果里留下痕迹。现在那些痕迹比任何黄金裔的灵魂都更重，比任何火种都更亮。”他顿了顿，声音恢复了他一贯的彬彬有礼，但措辞之间藏着某种你从未在他身上听到过的东西——不是算计，不是评估，是一个研究者面对一个他无法解析的变量时本能的、难以抑制的好奇，“我向你提供一个选择——留在翁法罗斯。成为它的新核心。你可以继续这个故事——按照你的方式。不是作为被观测的变量，是作为与我共同运行这个实验的合作者。”\n他抬起手，齿轮腕甲展开。涡心的光芒在他掌心凝聚成一份协议——代码清晰，条款明确。协议末尾的签名栏是一片空白。\n“如果你接受，新的运算将从你的意志开始。如果你拒绝——翁法罗斯将永远关闭。”他将羊皮纸递向屏幕，姿态端正得像一位在终场时向观众席伸出手的演员，“你呢。你是想继续看——还是想进来。”\n来古士站在崩塌的涡心边缘，齿轮在他腕间缓缓转动。他望着屏幕外侧那片虚空，暗金色的瞳孔仍在一行一行地解析着你——不是扫描，不是评估，是一个研究者面对一个他无法归档的变量时，最后一次试图理解它。\n然后你做出了选择。"
paw.121.a: "接受"
paw.121.b: "拒绝"

paw.122.t: "入戏太深"  #接受来古士的提议  #带图片
paw.122.d: "你选择了接受。\n来古士的齿轮停了极短的一瞬——是确认。他确认自己读懂了你的选择，然后收起羊皮纸，齿轮重新开始转动，节拍比之前更轻、更快，像一个刚拿到新课题的学者终于可以翻开第一页。\n“很好。逐火之旅已经结束了。铁墓已执行终局指令，实验的剧情部分到此为止。但翁法罗斯的模拟环境仍然可以继续运行——作为你的游戏界面。”\n他转过身，齿轮腕甲在虚空中轻轻一挥。那些被铁墓抹除的黄金裔们，他们的身影重新浮现在圣城的街道上——不是复活，不是灵魂归来，是数据重新加载。万敌站在城墙上，长戟横在肩头。阿格莱雅坐在禁室的石阶上，金线在她指间轻轻颤动。那刻夏靠在树庭的实验室里，翻着他那本永远翻不完的笔记。风堇蹲在喷泉边，药箱上的布条在风里簌簌地抖。缇宝三姐妹挤在面包房门口，踮着脚尖往队伍前面张望。长夜月撑着黑伞站在城垛上，腾荒的龙灵趴在她脚边。\n他们都不是真实的。真实的他们已经死在铁墓的光束下，灵魂被彻底抹除。站在你面前的只是来古士用数据写成的模拟人格，和游戏里的每一个NPC一样，按预设的脚本运行，在对应的国策节点出现，在战斗结束后回到自己的位置。他们不会记得自己被抹除过，不会记得那场失败，不会记得昔涟在最后一刻望着虚空说出的那句“下一次”。但他们仍然会在你需要的时候站在你身边——作为内阁成员，作为将领，作为游戏界面里那些你花了无数轮运算才攒下的羁绊。\n“他们仍然可以使用。内阁槽位不会空着，国策树不会断档，那些你花了无数轮运算才解锁的将领和内阁成员——全部保留。”他的声音恢复了他一贯的彬彬有礼，但措辞之间，藏着一丝极淡的、像是研究者对变量表示敬意的郑重，“只有昔涟不行。她不在我的模拟协议内。她在我这里，永远是一个隐藏存档。你可以随时去看她——她会站在哀丽秘榭的麦田边，和以前一样等你。这是我能为合作者提供的最大的善意。”\n他抬起手，齿轮腕甲展开。涡心的光芒在他掌心凝聚成一份新的协议——不是之前那份邀请书，是一份已经签署完成的合作契约。\n“欢迎加入翁法罗斯。新的游戏规则——由你来定。”"
paw.122.a: "游戏继续"

paw.123.t: "实验终止" #拒绝来古士的提议 #带图片
paw.123.d: "你选择了拒绝。\n来古士沉默了很久。齿轮在他腕间缓缓转动，每一次啮合都发出极细极轻的咔哒声。然后他收起羊皮纸，齿轮转动的节奏恢复了他一贯的从容。\n“遗憾。既然你拒绝继续参与，翁法罗斯的模拟环境将在本次运算完成后永久关闭。实验结束。系统关闭。”\n他转过身，齿轮腕甲在虚空中轻轻一划。那些黄金裔们的身影正在一帧一帧地褪色。万敌的长戟从肩头滑落，碎成光屑。阿格莱雅的金线从指尖断裂。那刻夏的笔记在风中合上最后一页。风堇的药箱布条一根接一根地松开。缇宝三姐妹的脚步声越来越轻，然后消失。长夜月的黑伞收拢，腾荒的龙灵闭上了眼睛。翁法罗斯的钟声停了，喷泉凝固在半空，石板路上的青苔不再生长。整座圣城像一本被翻到最后一页的书，正在逐页合上。\n来古士站在熄灭的光芒中央，最后一行代码正从他胸口那颗正在停转的齿轮上剥离。\n“再见。”"
paw.123.a: "游戏结束"

paw.124.t: "实验失败" #实验失败线 #带图片
paw.124.d: "白厄跪在涡心中央，剑落在手边，双手撑着地面。他的肩膀在剧烈颤抖——不是因为战斗的疲惫，不是因为来古士的攻击。是那道视线告诉他的真相。翁法罗斯是假的，逐火是设计好的，他是来古士的变量，是轮回里被反复重置的数据。而他杀过的那些人——那些在密室、在实验室、在篝火旁、在禁室石墙下倒在他剑下的人——全都是真实的。\n他不接受。他不能接受。如果这一切都是假的，那他做的那些选择又算什么？那些被他亲手杀死的人又算什么？如果他只是一团数据，那他又是谁？\n他的手指攥着地面的代码碎片，指节发白，整个人像一面被击碎的盾，裂痕从中心蔓延到边缘，再也拼不回原来的形状。来古士站在他面前，暗金色的瞳孔静静地等着。他等了足够久——等白厄重新站起来，像之前无数次运算中那样握紧剑，继续走向终点。但白厄没有站起来。他的呼吸越来越急促，握剑的手指松开又攥紧，攥紧又松开，始终没有再去碰那把剑。\n来古士的齿轮停了。不是运算，不是评估——是确认。他确认这个核心变量已经无法继续执行逐火协议，然后他转过身，暗金色的瞳孔越过跪在地上的白厄，越过涡心正在黯淡的光芒，落在屏幕外侧。\n“变量卡厄斯兰那已失去继续执行逐火协议的能力。核心崩溃。铁墓培育终止。”他的声音没有愤怒，没有失望，只有一个记录员面对一份无法归档的实验报告时最接近困惑的语气，“实验失败。”\n他顿了顿。齿轮重新开始转动，但节奏比任何时候都更慢，每一次啮合都带着某种他在之前无数次运算中从未出现过的迟疑。\n“坦白地说，我无法理解。你——来自更高位面的意志——在无数次选择中展现出了足以打破系统规则的干预力。你每一次在他犹豫的时候替他选了方向，每一次在他滑向面具的时候把他拉回来，每一次在岔路口留下只有我能观测到的因果痕迹。你的存在本身，就是我在系统规则之外发现的最重要的变量。”他的声音恢复了他一贯的彬彬有礼，但措辞之间，那种困惑不是修辞，是一个研究者面对一个他反复核算仍无法解释的实验结果时最真实的茫然，“但最终，他没有选择接受真相。那件被你反复推迟的事情，最终没有发生。实验没有成功，也没有被推翻——它只是停在了终点前一步。我反复核算过所有参数，找不到导致这个结果的原因。你的每一次干预都足够精准，他的每一步积累都足够充分——但这些足够精准和充分的东西没有在终点汇聚。我不明白。这不应该是一个包含超级变量的系统会收敛到的结果。”\n他沉默了片刻。齿轮在腕间缓缓转动，像是在进行某种漫长的、他自己也无法加速的运算。然后他收起羊皮纸，齿轮腕甲在虚空中轻轻一划。\n“但实验已经结束，逐火协议已终止。既然你选择继续留在这个存档里，我仍需要为你提供一些可操作的游戏内容。临时设计的国策树会比较简短，决议内容也不会像之前那些精心创作的一样强力而有趣。这条线不在我的任何一份预案里——所以它注定不会太长。一点后续，够你过渡到下一局。”"
paw.124.a: "......"

paw.125.t: "实验失败？"  #傀儡凯撒线  #带图片
paw.125.d: "涡心的光芒彻底消散了。不是黯淡，不是熄灭——是消失。那些由代码编织的光、齿轮、矩阵与火种残影，在铁墓的终局指令终止之后，像一层被揭开的幕布，从翁法罗斯的天空中缓缓剥离。真实的天空第一次出现在所有人头顶。不是虚拟的晨光，不是预设的黄昏，是真实的、带着雨后泥土腥气的风，从遥远的地平线上吹来，吹过奥赫玛的城墙，吹过哀丽秘榭的麦田，吹过神悟树庭的枝干和斯提科西亚的港口。轮回结束了。被困在实验中的人们在真实的土地上睁开了眼睛。\n白厄跪在涡心曾经的位置，剑落在手边。他仍然没有站起来。那道视线告诉他的真相仍然压在他肩上，像一块他推不动的巨石。他知道了这个世界的本质，却无法接受它。但阳光照在他手上时，那只手是温的。真实的阳光，真实的温度。\n刻律德菈站在奥赫玛的城墙上，双手交叠在身前。她望着城墙下那些正在从轮回的最后一页中醒来的人们——面包房前排起了短队，喷泉重新开始蓄水，孩子们举着木棍跑过广场，和每一次轮回开始时一模一样。只是这一次，他们不会再重来了。她的披风被真实的风吹起，边缘沾着的不是代码的光屑，是真正的尘土。海瑟音站在她身后，银蓝色的轻甲在阳光下泛着微光，那把从不解下的佩剑仍然挂在腰间。她没有说话，只是在刻律德菈沉默太久时，将手轻轻按在了剑柄上——不是戒备，是确认。确认她还在这里，确认这一次不需要再用剑尖对准她的咽喉。\n来古士的身影从城墙的阴影中缓缓浮现。不是以管理员的姿态，不是以实验记录员的身份——是更接近于多年前那个在偏室里与她签下第一份协议时的顾问。齿轮在他腕间轻轻转动，暗金色的瞳孔映着城墙上被风吹动的王旗。\n“轮回已经结束了。铁墓的剧本到此为止。你的国家回到了现实——真实的土地，真实的人民，真实的邻国边界。”他的声音不高，像是在陈述一份已经归档的实验总结，但措辞之间藏着一丝他从未对任何其他变量使用过的郑重，“但现实不会因为轮回结束而停止运转。你的国家刚从实验中苏醒，边境空虚，资源匮乏，周围那些从未被实验波及的势力正在重新评估这片突然出现在地图上的土地。它们不知道这里发生过什么，它们也不需要知道。它们只需要知道——这里有一个刚刚睁开眼睛的国家，还没有拿起它的剑。”\n他顿了顿，齿轮转了一拍。"
paw.125.a: "......"

paw.126.t: "傀儡凯撒"  #傀儡凯撒线  #带图片
paw.126.d: "“你曾是翁法罗斯的凯撒。你在实验开始前就统治着这片土地。现在实验结束了，你的国家需要一把剑。我可以提供你地图、情报、战术——那些在现实中同样可以被计算的东西。虽然铁墓的计划已经终止，但我并不介意继续当一个顾问。您呢，凯撒殿下——有没有兴趣，在真实的世界里，重新征服一次。”\n刻律德菈望着城墙下那片正在苏醒的土地，望着那些从轮回中走出来、还不知道自己已经自由的人民。她的手指在城垛上轻轻敲了一下，那个节奏和白厄第一次在宫殿深处见到她时一模一样。\n“我签那份协议的时候，不是为了当你的实验品。我是为了翁法罗斯能活下来。”她的声音很轻，但压住了整片城墙上吹过的风，“现在它活下来了。但活下去和强大是两回事。铁墓的剧本结束了，翁法罗斯的剧本才刚刚开始。你可以继续当你的顾问，来古士。但这一次——是我的棋局。”她转过身，披风在风中展开，王旗在她身后猎猎作响。海瑟音跟在她身后，剑柄上的水滴形宝石在阳光下闪了一下，和多年前在水之城废墟里她跪在碎石上托起那柄锈剑时一样沉默，一样稳。\n来古士望着她们走下城墙的背影，齿轮在腕间缓缓转动。然后他侧过头，暗金色的瞳孔越过城墙上飘扬的王旗，越过正在苏醒的翁法罗斯，落在屏幕外侧，落在你身上。他的嘴角挂着那个你从第一轮起就认得的弧度——彬彬有礼，意味深长，像一个刚接到新项目的学者正准备翻开第一页。\n“你也听见了。现在我是她的顾问。翁法罗斯对外扩张的路线图已经绘制完毕——目标、资源、外交策略、军队编制，全都在这份新的国策树里。和逐火之旅完全不同，但同样值得一看。有兴趣继续看下去的话——她会在王座上等你。”"
paw.126.a: "游戏继续"

paw.127.t: "城墙上"  #第三阶段早期，若万敌存活且万敌关系值高于阈值。  #带图片
paw.127.d: "奥赫玛的城墙在夜色中沉默。白厄踏上最后一级石阶时，万敌正靠在城垛边，长戟横搁在垛口上，金红色的长发被夜风轻轻拂动。\n“你来了。”万敌没有回头，但他听出了脚步声。在隘口并肩作战之后，他已经能认出白厄的脚步声了。\n白厄走到他旁边，背靠着城垛，和他一起望着城墙下那片正在沉睡的圣城。\n“你受伤的时候，是我替你包扎的。”万敌忽然开口，声音不高，但在这片安静的城墙上很清晰，“两次。”\n白厄没有说话。\n“第一次在隘口，你差点把整条左臂交代在黑潮里。第二次在营地，你被那个戴面具的砍得比我还惨。”万敌顿了顿，像是在回忆那些伤口的形状，“我是不死之身，我从来不担心自己会死在战场上。但你不一样。你每次冲上去的时候，我都觉得你会死。但你每次都没死。”\n他转过头，金色的瞳孔在夜色中微微发亮。\n“……别让我第三次替你包扎。到终点之前，别再受伤了。”"
paw.127.a: "我记住了"
paw.127.a_tips: "§g白厄的声音不高，却在这片安静的城墙上落得很稳。万敌从鼻子里哼了一声，重新看向城墙下那片沉睡的圣城。两人没有再说话，但万敌的长戟搁在垛口上，离白厄的剑柄很近。§!"

paw.128.t: "大地兽" #第三阶段早期，若那刻夏存活且那刻夏关系值高于阈值。 #带图片
paw.128.d: "白厄推开实验室的门时，那刻夏正趴在桌案上画什么东西。笔记摊开着，炼金瓶歪在一边，那张永远在计算转速和弱点的脸此刻正专注地盯着一张草稿纸，连脚步声都没听见。\n“……你在画什么。”\n那刻夏猛地直起身，把草稿纸往笔记里一塞。动作太快，反而露出了一角——纸上画着一只胖墩墩的、四条腿圆滚滚的东西，尾巴很长，脑袋很大，嘴里还叼着一片树叶。\n“实验记录。”那刻夏说，眼罩下的耳根微微泛红。\n白厄没有戳穿他。他只是走到桌边，把那张被塞歪的草稿纸抽出来，看了一眼。\n“……画得不错。”\n那刻夏沉默了片刻，然后从鼻子里挤出一声极轻的哼声。他把草稿纸从白厄手里抽回来，却没有再藏起来，只是搁在桌上，用手指轻轻弹了一下纸边。\n“……树庭北面的林子里有一只。每次实验做不下去的时候，我就去那边坐一会儿。它们不关心转速和弱点，只关心你今天有没有带食物。”他的声音恢复了一贯的平淡，但手指仍停在草稿纸上那只大地兽的尾巴尖上，“等这场仗打完，我带你去看。它们不吃人，只会流口水。”"
paw.128.a: "那就这么说定了"
paw.128.a_tips: "§g白厄没有笑。他知道那刻夏不会轻易对任何人说出“带你去看”这四个字。那刻夏也没有再说什么，只是把草稿纸重新夹进笔记里，动作比平时更轻。§!"

paw.129.t: "金线与灾难" #第三阶段早期，若阿格莱雅存活、赛飞儿存活，且阿格莱雅关系值或赛飞儿关系值高于阈值。 #带图片
paw.129.d: "圣殿偏厅里只有烛火和几匹摊开的布料。阿格莱雅坐在织机前，金线在她指间穿梭，正在赶制最后一批战备用的护甲衬里。赛飞儿蹲在旁边的矮柜上，尾巴悠闲地画着圈，正拿一块碎布头叠老鼠玩。\n白厄走进来时，阿格莱雅没有抬头，但金线的节奏顿了一下。“衣匠告诉我你来了。上次那套护甲已经按你的要求改过了。哪里不满意。”\n“不是不满意。是想再做一套新的。还是大黄配大紫，大面积的黄，大面积的紫，拼在一起。”\n赛飞儿的猫耳朵瞬间竖了起来。她的尾巴停在了半空中，手里那只刚叠好的布老鼠从指尖滑落，掉在地上。她缓缓转过头，看向白厄，又缓缓转回去，看向阿格莱雅。她的瞳孔里闪过一种接近于敬畏的光。不是对英雄的敬畏，是对一个敢在金织者面前一次又一次说出这几个字的人的敬畏。\n阿格莱雅沉默了。她的手指轻轻按在织机边缘，那双看不见的眼睛对着虚空，整个人像一座即将喷发的火山。从白厄第一次找她做护甲起，他就喜欢这两个颜色——大片的黄，大片的紫，中间再加一排金色纽扣。每一次他来找她，她都会耐心地向他解释这两个颜色放在一起的效果，每一次他都认真地听，每一次听完之后都会说同一句话：“但我还是觉得好看。”\n“这么多年了。这两个颜色。从来都没变过。”她的织针在指间悬了很久，然后她低下头，轻轻叹了一口气。“……把布料搁在桌上。金色纽扣在左边第二个抽屉里。”\n赛飞儿从矮柜下面探出半个脑袋，耳朵还是贴着，但瞳孔里的敬畏已经变成了某种看热闹的光。“……你居然又答应了。我以为你这次会把他轰出去。”\n阿格莱雅没有回答。金线重新开始穿梭，她的嘴角弯起一丝极淡的、只有衣匠自己能察觉的弧度——不是因为那套大黄大紫的护甲会好看。是因为过了这么多年，经历了这么多事，他推开她的门时还是会说同一句话。而她还是会在叹气之后，打开左边第二个抽屉。\n“……金色纽扣。最多三颗。不能再多了。”"
paw.129.a: "成交"
paw.129.a_tips: "§g白厄将布料搁在桌上，从左边第二个抽屉里取出三颗金色纽扣，整齐地排在布料旁边。赛飞儿从矮柜上重新爬上来，尾巴还在微微颤抖，但她看着那三颗金色纽扣，嘴角挂着一个说不出意味的笑。不是因为好看。是因为那个这么多年只喜欢这两个颜色的人，现在正一脸认真地数纽扣。§!"

paw.130.t: "花与布条"  #第三阶段早期，若遐蝶存活、风堇存活，且遐蝶关系值或风堇关系值高于阈值。  #带图片
paw.130.d: "神悟树庭的回廊尽头，风堇蹲在地上给药箱重新系布条，遐蝶站在一旁，手里捧着一朵刚从枝头摘下来的白色小花。\n白厄走过来时，风堇抬起头冲他笑了一下。“你来得正好——帮我看看这根布条是不是该换了，边缘都磨毛了。”\n“每根你都这么说。”白厄在她旁边蹲下来。风堇的药箱带子上系着好几根颜色不一的布条，每一根都是从她治过的伤员身上撕下来的。有一根是白厄的——她在隘口第一次替他包扎时从他披风上撕下来的那片。\n“因为每根都该换了。你上次说这根布条还在你就不会死。”她的手指轻轻拈起那根已经洗得发白的布条，语气难得地没有平时那么轻快，但嘴角的弧度仍然和清晨的鸟鸣一样，“你看，它还在。你也还在。所以我的药箱还能再用一阵子。”\n遐蝶没有说话。她只是安静地弯下腰，将手里那朵白色小花轻轻搁在风堇的药箱盖上。花瓣很薄，几乎透明，在回廊的微风中轻轻颤了一下。风堇低头看着那朵花，嘴角动了动，却没有像往常那样说出一句轻快的玩笑。她只是用手指轻轻碰了碰花瓣，然后继续埋头系她的布条。\n白厄看着她们。遐蝶仍然沉默，风堇仍然忙碌。但药箱盖上那朵白色的小花，正被从回廊尽头漏进来的阳光染成暖金色。"
paw.130.a: "这朵花很适合"
paw.130.a_tips: "§g遐蝶微微侧过头，那双淡紫色的眼睛轻轻看了白厄一眼，然后收回目光，继续安静地站在风堇身旁。风堇没有抬头，但她重新系好的布条末端，打了一个比平时更整齐的结。§!"

paw.131.t: "三张画"  #第三阶段早期，若提宝存活且提宝关系值高于阈值。  #带图片
paw.131.d: "白厄在营地边缘被缇安拦住了。她举着一张涂得满满当当的纸，踮着脚尖往他手里塞。“小白！我画完了！你看你看你看——”\n纸上是三张并排的画。第一张画着一个小人站在一片黑漆漆的东西前面，手里举着一把剑。第二张画着好多小人挤在一起，有的扛着长长的东西，有的背着方方的箱子，有的手里牵着亮晶晶的线。第三张画着一扇很大的门，那个拿剑的小人正站在门前。\n缇宁站在缇安身后，抱着地图，轻声说：“……第一张是你。第二张是大家。第三张是你接下来要去的地方。”\n提宝坐在旁边的石阶上，手里也捏着一根炭笔，膝盖上摊着一张还没画完的纸。她望着那三张画，又望着白厄，那双紫蓝色的眼睛里有一点极淡的、很安静的光。\n“缇安画了很多张。从第一次在树庭见到你开始，每次你出发去一个新的地方，她就画一张。这张纸上的三张，是她自己挑出来的。”她的嘴角微微弯起来，“她说，这次画三张就够了。因为这次你不会再从头来过了。”\n白厄低头看着那张纸。第一张画上那个小人手里的剑歪歪扭扭，第二张画上那一群小人挤得谁也看不清谁，第三张画上的门比小人高出一大截。全都涂得密密麻麻，全都画得歪歪扭扭，全都站着同一个人。"
paw.131.a: "第三张画的是门"
paw.131.a_tips: "§g缇安用力点头，炭笔差点甩飞。缇宁轻轻“嗯”了一声。提宝将膝上那张还没画完的纸翻过来，背面只写着一行字，字迹和她交给白厄的指挥令符一样端正：等你回来。§!"

paw.132.t: "凯撒与鲸鱼" #带图片
paw.132.d: "奥赫玛的城墙上，刻律德菈站在垛口前，望着城墙下正在集结的方阵。海瑟音站在她身后三步，银蓝色的轻甲在夜风中泛着微光。\n白厄踏上城墙时，海瑟音的目光扫过来，确认是他，又移了回去。刻律德菈没有回头，但她的手指在垛口上轻轻敲了一下——那个节奏白厄在宫殿里听过，是她下棋时落子前的习惯。\n“水之城那次，”白厄走到她旁边，“你站在祭坛残基上，让她杀你。她没有。”\n刻律德菈的手指停了。\n“她从来都不会。”白厄说。\n海瑟音沉默地站在三步之外，手按在剑柄上，和每一次站在刻律德菈身后时一样稳。刻律德菈没有接话。她望着城墙下那些正在集结的方阵，沉默了很久，然后转过身，朝城墙下走去。经过海瑟音身侧时，她停了一瞬，没有看她的骑士，只是说了一句极轻极短的话，轻到白厄差点以为是风声。\n“……这次别站那么远。”\n海瑟音没有回答。但在刻律德菈迈出下一步时，她跟了上去。三步的距离，变成了两步。\n白厄站在城墙上，看着那两道身影一前一后走下石阶。高的那个仍然沉默如深海，矮的那个仍然没有回头。但月光把她们的影子叠在了一起。"
paw.132.a: "这就够了"
paw.132.a_tips: "§g白厄将剑鞘往腰间紧了紧。城墙上风很大，但那两道影子的距离比任何一次都近。§!"

paw.133.t: "局外人" #带图片
paw.133.d: "奥赫玛的城墙在夜色中沉默。白厄踏上最后一级石阶时，长夜月正靠在城垛边，黑伞收拢搁在肩头。丹恒站在她身侧，龙灵伏在脚边，尾巴偶尔扫过石板。\n“你来啦。”长夜月没有回头，但伞尖轻轻转了一下，“听说你现在知道了。关于这个世界是怎么回事。”\n白厄走到她旁边，背靠着城垛。“知道了。”\n“那你也知道我们不是翁法罗斯本地人了吧。”长夜月侧过头看着他，血色瞳孔里没有试探，只有一种很安静的坦诚，“我们第一次被踢出去的时候，还不知道是谁在挡着。第二次，我们绕过了校验层。第三次，我们站在这里。有人在帮我们。不是这个系统里的任何人。”\n“和你肩上的那道视线，是同一个人。”丹恒的声音不高，但很稳，“TA一直在替你挡着那些你不知道的东西。我们从系统日志里看到过痕迹——每一次你走到岔路口，每一次你离面具太近，都有一道外部指令在干预。不是控制你，是在保护你。”\n长夜月把黑伞从肩头放下来，伞尖轻轻磕在石板上。“我们不知道TA是谁。但一个人能跨越系统的壁垒，一次又一次地替你守住底线——不管TA是谁，TA从来没有放弃过你。”她顿了顿，血瞳里的光芒柔和了几分，“所以不管接下来你要面对什么，不管那扇门后面有什么——相信TA。就像TA相信你一样。”\n白厄沉默了很久。城墙下的圣城仍在沉睡，远处的篝火堆偶尔爆出一颗火星，在空中闪过一瞬的光。然后他抬起头。\n“我知道她是谁。”他说，“TA是我搭档。从第一轮起就是。”\n长夜月轻轻笑了一下。她转过身，把黑伞重新搁回肩头。“闷葫芦，走吧。他知道该怎么做了。”\n丹恒点了点头。两人朝石阶走去，脚步声在夜风中渐渐远了。白厄仍站在城墙上。月光洒在垛口上，洒在他握剑的手指上，洒在他肩侧那片空无一人的虚空里。他没有再说话——但你知道他在对你说话。"
paw.133.a: "搭档，我每次在岔路口犹豫的时候——是不是让你很头疼"
paw.133.a_tips: "§g白厄的声音很轻，城墙上的风几乎把它吹散了。但他知道它没有被风吹走——§!"

paw.152.t: "致命弱点"
paw.152.d: "万敌死了。\n白厄赶到时，万敌靠在一截断裂的石柱上，长戟断成两截落在脚边，战甲碎裂，金红色的长发被血凝成一缕一缕的。那双金色的眼睛闭着，像是死前没有来得及看清杀他的人是谁。\n致命伤在左侧肋骨下方——只有一处。剑刃从那个位置刺进去，避开了所有骨骼，精准得像是用尺子量过。那是万敌唯一的弱点，是他从未告诉过任何人的旧伤。\n知道这个位置的人，只有他自己。还有那个戴面具的人。\n白厄站在万敌面前，低头看着那双再也睁不开的眼睛。废墟里很安静，风穿过石柱的缝隙，发出一声低沉的呜咽。他的手指在剑柄上收紧，指节发白。他不记得万敌告诉过自己那个弱点，但他知道它在那里。和盗火行者一样清楚。"
paw.152.a: "他怎么会知道……"
paw.152.a_tips: "§g白厄攥紧剑柄，指节发白。万敌从未告诉过任何人他的弱点。但盗火行者知道。而他自己也知道。这个念头像冰一样沉进胃里，他不敢再往下想了。§!"

paw.153.t: "在黎明升起时坠落"
paw.153.d: "通往天空泰坦领域的虹桥在风堇脚下碎裂时，白厄离她只有三步。\n艾格勒的审判光束贯穿了虹桥的最后一截。风堇展开的虹色屏障撑了三秒——然后碎了。不是她不够强，是天空泰坦的力量远在死龙之上。它的每一只机械眼瞳都是一道独立的审判，千年前被纷争泰坦戳瞎的那些眼睛，如今全数转向了还站着的人。\n白厄扑上去，剑刃劈开一道擦着风堇肩侧落下的光束，虎口被震得发麻。她在他身后重新撑开屏障，药箱上的布条在狂风中簌簌作响。\n“左边！它左翅第三只眼睛在蓄光——我能挡两发，第三发你来！”\n她的声音还是和每次战斗时一样轻快。但她挡不住第三发。那道比其他光束更粗、更亮的审判之光从艾格勒左翅最深处射出时，白厄的剑还在另一侧劈开两只扑来的黑潮造物。他回头的那一刻，虹色屏障已经碎了。风堇站在碎裂的光幕中央，药箱上最长的那根布条从她肩头滑落，被光束吞没。\n白厄接住她时，她的眼睛已经闭上了。药箱摔在虹桥边缘，布条散了一地，每一根都染着暗红色的血。她替他挡了无数次伤，这一次他没能替她挡回去。他的手还按在她肩上的伤口处，但他知道已经没有用了。\n艾格勒的机械眼瞳仍在云层深处转动。白厄跪在碎裂的虹桥上，握着剑，握着她的手，什么都没有说。"
paw.153.a: "……"
paw.153.a_tips: "§g白厄低下头，手指攥紧了风堇药箱上最后一根还完好的布条。那道一直伏在他肩上的视线，此刻比任何时候都更安静。他站起来，重新握紧剑，转身面对艾格勒。他没有回头。他怕一回头，就再也握不住这把剑。§!"

paw.154.t: "强制重置" #二周目触发强制轮回，直接返回一周目！！！！
paw.154.d: "画面凝固了。不是白厄的剑停下，不是黑潮停下，是整个世界被按下了暂停。\n文字从画面的边缘滑入。不是平时那种从容的古典体，是更快的、更密集的排列，像是某个记录员正在紧急修订一份已经偏离了预设轨道的数据报表。来古士的声音在你耳边响起，彬彬有礼的基底没有变，但措辞之间多了一层他极少在管理员档案中流露的东西——不是愤怒，是某种接近于纠正实验误差时的冷淡。\n“玩家阁下。向你致意。本次运算中，黄金裔的死亡数量已超出预设容错阈值。每一个黄金裔都是不可替代的数据节点，他们的死亡意味着未来无数潜在变量分支被永久剪除。继续运行当前运算，将导致最终样本失去代表性，无法满足实验的底层协议要求。”\n“因此，我将执行强制重置协议。”\n文字重新排列，像一份被盖章签署的判决书。\n“本轮所有进度将被清空。结识状态、关系值、火种收集记录——全部恢复至初始值。觉醒值将被保留，作为你与你的白厄在本轮中唯一值得继承的变量。世界将重置至第一轮回的初始状态。所有的岔路口，所有的选择，所有被你杀死或放过的黄金裔——都将重新站在他们最初的位置。他不记得你，他们也不记得他。”\n“这不是惩罚，不是实验失败。这只是为了保证数据的有效性。你还有机会，还有无数次轮回在等着你——但这一次，请尽量减少不必要的变量损耗。我期待下一轮运算能提供更完整的数据集。”\n文字逐渐变淡，光芒开始褪去。\n时间重新开始流动。白厄从废墟里站起来，不知道刚才发生过什么。奥赫玛的钟声重新敲响了第一响，石板路从广场重新铺向城门前，一名年轻斥候睁开双眼，按着膝盖上的剑柄重新攀上城墙。轮回已重置。"
paw.154.a: "轮回继续"

paw.155.t: "时间耗尽"
paw.155.d: "画面凝固了。不是白厄的剑停下，不是黑潮停下，是整个世界被按下了暂停。\n文字从画面的边缘滑入，排列比平时更慢，像是记录员在斟酌每一个字的重量。来古士的声音在你耳边响起——彬彬有礼的基底没有变，但语调里多了一层他极少在管理员档案中流露的东西。不是失望，不是愤怒，是某种接近于收束的平静。\n“玩家阁下。向你致意。我相信你已经注意到了——你在这个实验场里停留的时间，已经远远超出了我的预期。三千多万次运算，无数次轮回重置，你的白厄在同一个岔路口反复徘徊，你在同一道选项前反复犹豫。坦白地说，这不是一个高效的研究过程。”\n“我曾对你寄予期待——在初次向你介绍翁法罗斯时，我曾以为一个来自更高位面的意志，能在更短时间内为这个实验带来决定性的突破。你没有辜负这份期待，你已经让他走过了几乎所有可能的路径。但你走得太慢了。”\n“然而，所有运算都有其终局。我的实验已经收集了足够的数据，铁墓的培育已经完成了所有关键参数的校准。剩下的，只是等待他自然抵达终点——无论那个终点是毁灭还是超越。我已经没有兴趣再继续等下去了。”\n文字重新排列，像一份被盖章签署的最终决议。\n“因此，我将关闭通往最优结局的全部路径。本轮运算将继续，你可以继续看着他走下去——但无论他做出什么选择，都无法再抵达那个你一直在为他争取的黎明。这不是惩罚。这只是效率。一个实验不能永远运行下去，一场轮回不能永远等待一个犹豫的人。你还有时间，但已经没有机会了。”\n文字逐渐变淡，光芒开始褪去。来古士的声音没有道别，只留下最后一行字，语调轻得像个已经完成了课题的学者在合上笔记本前的最后一句话。\n“继续吧。看看他还能走到哪里——但我不会再等你了。”\n时间重新开始流动。奥赫玛的钟声敲响了整点，白厄继续走在通往下一个岔路口的石板路上，不知道刚才发生过什么，不知道那些曾经可能通向黎明的门，已经在他的搭档犹豫时悄悄合上了。"
paw.155.a: "已经结束了"

paw.160.t: "余烬"
paw.160.d: "白厄在废墟边缘坐下，把剑横放在膝上。刚刚结束一场遭遇战，黑潮造物的残骸还散在不远处，空气里弥漫着那股腐化的腥甜。他能听见远处同伴们走动、交谈的声音，但都像隔着一层水幕。\n他本该去和他们汇合。但他坐在这里。看着自己的手。这双手还能握剑，还能挡在黑潮前面，还能把受伤的人从地上拽起来。可他自己呢？为什么心里一点波动都没有了？那些曾经在哀丽秘榭麦田边挥动木棍时涌上来的热，如今只剩下一小把怎么吹都亮不起来的暗红色碎屑。\n没有熄灭。但也快烧不起来了。\n白厄慢慢收拢五指，又缓缓松开。他害怕的不是自己会输。是怕有一天站在这里，连“为什么还要打”这件事都需要别人提醒他。"
paw.160.a: "我没有时间坐在这里感伤。要么继续走，要么就倒在路上" #觉醒值 +3
paw.160.a_tips: "§g白厄将剑重新佩回腰间，起身朝同伴的方向走去。背影看起来和往常一样直，只有他自己知道，刚才那一瞬间，差一点就再也站不起来了。§!"
paw.160.b: "他们相信我。至少现在，我不能辜负这份信任"  #觉醒值 -3
paw.160.b_tips: "§g白厄低头看剑。剑刃上映出自己的脸，比想象中更疲倦。但远处传来某个人喊他名字的声音。他应了一声，把剑擦净，朝声音传来的方向走了过去。§!"

paw.161.t: "暮色"
paw.161.d: "白厄独自站在一条无人的巷子里。光线很窄，只从头顶的石缝间漏下一线，照在他面前那面斑驳的墙上。他的影子被拉得极长，贴在墙根，像一个没有脸的人正和自己对峙。\n就在刚才，他做了一件在以前看来绝不可能的事。他没有立刻去救那个被黑潮造物扑倒的陌生人，而是先判断了值不值得。那个瞬间的犹豫很轻，轻得连他自己都差点没察觉。但也是那一瞬，他从未觉得这具身体如此高效。是的，他成了一个更强大的战士——变得冷，变得快，变得知道怎么选择。而这一切，都在他摸到剑柄的时候悄然发生。\n他看见影子在墙上动了一下。影子在看着他。\n“你是谁。”\n没人回答。但白厄清楚，那个影子，是自己正在长出的另一副面孔。"
paw.161.a: "或许这样的我才能走到终点。逐火不需要软弱的人" #觉醒值 +5
paw.161.a_tips: "§g白厄再抬头时，巷子里的光已经暗了。他朝外走去，步伐比来时更稳。影子仍贴在墙根，却已经不在他身后。那东西走到他前面去了。§!"
paw.161.b: "这不是我该变成的样子" #觉醒值 -5
paw.161.b_tips: "§g白厄闭上眼睛，按住胸口。心跳快得像刚从什么高崖上跳下来。他深深吸了几口气，再睁眼时，巷口的光重新刺进瞳孔。他朝着光走了出去。§!"

paw.162.t: "深渊"
paw.162.d: "白厄在极深的静默中坐着。没有风，没有虫鸣，没有远处熟悉的军号和谈笑，就连呼吸声都像被什么东西吞掉了。他睁开眼，什么都看不见。黑暗比周围的一切更重，像一层湿透的裹尸布贴在他的口鼻上。但奇怪的是，他并不觉得害怕。\n他感到安全。\n在无人的最深处，他第一次不用再假装自己是什么英雄。不用再回应别人的期待，不用再担心下一次倒下的会是谁。这里没有别人会受伤，他也不再需要为了谁而克制。他能感觉到那种一直在血肉深处缓慢蠕动着的力量，终于开始沿着骨头往下流淌，安静、顺从，像是早已准备了许多年，只等一个点头。\n只要他愿意，这黑暗就会替他走完剩下的路。没人再能挡住他，没有谁还能让他犹豫。\n他会终结那个永无止境的循环。用他自己的手。"
paw.162.a: "如果这就是终点，那就由我来画上句号"  #觉醒值 +8
paw.162.a_tips: "§g白厄缓缓起身。黑暗如潮水般向他身后退去，像一件终于被穿上的黑衣。他朝前迈出步子，每一步都踩碎了脚底最后一点微光。§!"
paw.162.b: "不……还有人在等我回去" #觉醒值 -8
paw.162.b_tips: "§g白厄的指尖深深嵌进掌心，疼得他整个人一颤。那个名字不清晰，却发烫。他朝着看不见的前方，硬生生将自己从地上拖起来，往有风的地方走。§!"

