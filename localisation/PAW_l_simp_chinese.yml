PAW_admin_jy_5: "管理员档案：变量"
PAW_admin_jy_6: "管理员档案：错误日志（新）"
PAW_admin_jy_7: "管理员档案：黄金裔"
PAW_admin_jy_8: "管理员档案：隐藏文件夹"
paw_unknown_text: "§t！！！未解锁此档案！！！§!"
PAW_admin_jy_0_tips: "§g可能玩家们已经注意到了，翁法罗斯在开局时没有任何内阁成员。这其实是正常的，随着实验的进行，实验体们会逐渐觉醒，此时他们才会成为游戏中可用的内阁成员。角色死亡不影响使用对应的内阁和将领，因为他们只是在轮回中死去，管理员可以启用他们的备份。§!"
PAW_admin_jy_1_tips: "§g为了得到更为精确的数据，翁法罗斯的虚拟世界实际上建立在一个较为古老的时间段，类似于古罗马时期。这里没有任何的现代科技，人们依靠神学观念来对抗天灾“黑潮”，这正是管理员所需要的实验环境。被选中的黄金裔们将在这种情况下被迫做出抉择，管理员将通过不断轮回重启这个世界来达到它的目的。§!"
PAW_admin_jy_2_tips: "§g两个不该存在于翁法罗斯的角色出现了，虽然管理员及时删除了他们的存在 ，但玩家已经知晓这二人的存在了。这会对未来的计算产生不可磨灭的负面影响。§!"
PAW_admin_jy_3_tips: "§g想办法让泰坦们交出自己的神权，集齐十二枚对应的火种，黄金裔们就可以结束翁法罗斯的轮回————至少在他们眼中是这样的。但火种对管理员来说并不重要，因为它随时可以重启这个世界。一般情况下，十二枚火种很难被凑齐。即使遇到了万分之一的情况凑齐了火种，如果本次轮回没有得到管理员所需的实验数据，那么该轮回依旧会被记作废案。并且，在管理员得到完美数据前，轮回永远不会结束。§!"
PAW_admin_jy_4_tips: "§g翁法罗斯的轮回本质上是由管理员不断的重启世界所造就的。在轮回中的黄金裔被管理员灌输了虚假的记忆，以至于他们以为自己的前几代人已经经历了无数次所谓“黑潮来袭”的轮回。但实际上翁法罗斯的真正历史并不是这样（真实历史请参考国家介绍）。被管理员蒙骗的翁法罗斯人将作为实验品，不断在这个虚拟世界中进行它的实验，直到完美数据的诞生。§!"
PAW_admin_jy_5_tips: "§g玩家的出现大大改变了过往的计算，她/他为这个世界带来了巨大变化的同时也激活了许多隐藏在翁法罗斯虚拟世界中的“BUG”。对管理员来说，玩家这个变量为翁法罗斯无尽轮回带来的改变不一定是正向的，但这一定会大幅加快实验的数据采集速度。预计本轮实验会在三年内结束，将比预期提前60~80年————如果真的持续那么久，机器维护难度将变得极大，且维护材料将严重不足，实验体们很有可能死亡。\n至于变量所带来的BUG们，管理员认为“昔涟”是由翁法罗斯内部产生的BUG，而“丹恒”和“三月七”疑似外部干涉导致，管理员仍需时间查清这一切。§!"
PAW_admin_jy_6_tips: "§g未知的外部存在已经与玩家产生了联系，管理员不知道它对玩家说了什么，但这可能会对玩家未来的选择产生一定影响。但管理员认为这不一定是坏事，新的变量往往会带来更多的惊喜。管理员期待玩家为他带来更加完美的实验数据。§!"
PAW_admin_jy_7_tips: "§g来自外部的两个存在已经成功融入了翁法罗斯的世界，成为了合法的黄金裔，他们的存在代码如今在翁法罗斯的虚拟世界里是完全经过认证的。虽然管理员略有不满，但他还是接受了这个现实，并且这两个变量也与玩家一样，大大加快了实验的进程，也许实验很快就会结束了。§!"
PAW_admin_jy_8_tips: "§g重点观察对象：昔涟，玩家，长夜月/三月七，腾荒/丹恒。批注：目前长夜月和腾荒无害。昔涟常有小动作，但无法对翁法罗斯产生实质影响。玩家虽是更高位面的存在，但也有为毁灭机器提供能源的可能性，这点很重要。§!"
PAW_yigui_jyz: "更换角色立绘(管理员已授权)"
PAW_yigui_jyz_desc: "部分角色需要推进主线才会出现，出现后才会解锁对应的更换立绘功能。\n如果对应角色死亡，其对应的决议也会随之消失，直到对方复活后才会重新出现。\n某些角色可能无法复活。"
