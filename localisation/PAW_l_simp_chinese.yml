PAW_waijiaoshiwu_jyz: "外交事务"
PAW_waijiaoshiwu_jyz_desc: "翁法罗斯已重返世界舞台，我们的选择将影响东亚的未来。"
PAW_waijiaoxuanze_jy: "决定未来"
PAW_waijiaoxuanze_jy_desc: "是时候选边站了，翁法罗斯应该加入哪一方？"
PAW_attack_VIN_jy: "控制印度支那"
PAW_attack_VIN_jy_desc: "这片土地曾在多年前属于翁法罗斯，虽然我们在历史上从未长久占领过它，但随着时代的变迁，贫穷的印支地区与富饶的翁法罗斯已产生了明显差距。"
PAW_attack_ENG_jy: "挑战圣杯霸权"
PAW_attack_ENG_jy_desc: "[ENG.getname]对亚洲的殖民已经持续了数十年之久，现在是时候由我们来打破这一局面了。"
PAW_attack_JAP_jy: "反抗樱花侵略"
PAW_attack_JAP_jy_desc: "[JAP.getname]已经成为东亚的最大威胁，她们无尽的战争欲望迟早将我们拖入深渊，翁法罗斯必须提前出击，消灭这一严重威胁！"
PAW_big_PAW_jy: "重新整合东南亚"
PAW_big_PAW_jy_desc: "翁法罗斯已恢复其历史疆域，东西南北各邦在长期共存共荣中形成了牢固的国家认同。中央政府将全面推行一体化行政、司法与经济体系，确保每一寸国土上的公民都享有平等权利与发展机遇。这是全体翁法罗斯人共同努力的结果，也是我们迈向现代民族国家的重要里程碑。"
PAW_baihe_JAP_jy: "强迫[JAP.getname]议和"
PAW_baihe_JAP_jy_desc: "我们与[JAP.getname]的战争已经持续了很久，她们的陆军无法战胜翁法罗斯军队，我们的海军无法战胜联合舰队，是时候结束这场无意义的战争了。"
PAW_yujap_baihe_tips: "§Y@JAP[JAP.getname]§! 与 §Y@PAW[PAW.getname]§! 无条件和平\n\n由于战争毫无进展，[JAP.getname]被迫与[PAW.getname]议和。"
PAW_yihe_ENG_jy: "瓦解[ENG.getname]殖民体系"
PAW_yihe_ENG_jy_desc: "我们已经彻底击败了[ENG.getname]的亚洲殖民体系，现在是时候决定这些新国家的未来了。"
PAW_yueng_yihe_tips: "§Y@ENG[ENG.getname]§! 与 §Y@PAW[PAW.getname]§! 签署停战条约\n\n[ENG.getname]在东亚遭遇大败，其殖民地被[PAW.getname]接管。"
paw_yihe_eng_tips: "所有§Y高亮地区§!将被我们§Y直接控制§!，战败国的命运取决于我们的§Y意识形态§!\n\n"
