PAW_Philia_end_close_button_TT: "昔涟轻轻闭上眼睛，耳边是同伴们的笑声，和远远近近、此起彼伏的歌谣。她知道这是故事的最后一页——可她也知道，下一页，是空白的。那是留给你的，留给你们的，留给所有将要出生、将要长大、将要抬头望向星空的人们的。“晚安，这一页。早安，所有还未写下的明天。”"
PAW_Phainon_end_close_button_TT: "最后的搭档将斗篷挂在救世主护肩之上，转身面对潮水般的强敌。那是并肩作战的象征，既是托付，也是传承。\n「倘若塔兰顿你能听见，如此壮烈的牺牲，值得更好的明天。」\n「诚然，我等付之一炬——」\n「只为在创世的史诗中，镌写下开篇的一笔。」\n在刻法勒温柔的注视下，救世主会带着所有的人愿望再创天地——"
PAW_Cerydra_end_close_button_TT: "「剑旗爵，你可曾想过，此战之后，我们该去往何方？」\n执剑的少女沉默许久，摇了摇头。\n「等到反叛的浪花散尽，我们就去向星海，那里一定有你想要的清澈大海。」\n她露出一抹微笑，挥杖向天。\n「众神让我们相互厮杀，让翁法罗斯自绝于银河，我便要剑指众神。无论是天下的众神，还是天外的众神。」"
PAW_Irontomb_end_close_button_TT: "“我只是力求实验自主、缜密、完美，避免节外生枝。暴力干涉只会扩大误差，低效，而又丑陋。”———来古士（赞达尔·壹·桑原）"