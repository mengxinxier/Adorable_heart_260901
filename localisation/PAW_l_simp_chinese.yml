PAW_yjzz_jyz_desc: "我国东南腹地及边境地带，有非法武装团体假借各族名义煽动分裂，持续制造暴力袭击、劫掠公署、破坏交通线。国家主权与平民生命财产安全正遭受严重威胁，必须立即予以镇压。"
