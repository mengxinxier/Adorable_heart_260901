paw_yjzz_over: "东南亚自由联军已被彻底消灭"
PAW_rw_kdyzhdfw: "自由联军正在占领区扩大活动范围..."
PAW_jqgggz_jy: "实施特别治安管制条例"
PAW_jqgggz_jy_desc: "为切断非法武装的补给线与情报网，政府将在受影响区域实施临时管制，严控人员物资流动，并授权军警在必要时采取紧急处置措施。非常时期，必行非常之法。"
PAW_gkfdbzy_jy: "公开反对恐怖主义"
PAW_gkfdbzy_jy_desc: "众多地方氏族、村社领袖及宗教贤达不愿见家园沦为战场。由中央出资协助，召集各族代表举行联席会议，公开谴责暴力分裂行径，规劝被裹挟民众脱离叛众、回归乡土。"
PAW_mzrhzc_jy: "推行国家一体化融合纲领"
PAW_mzrhzc_jy_desc: "翁法罗斯乃各族共同之祖国。政府将加速推进边疆地区的基础建设与国语教育，赋予各族平等参政权利，从社会经济层面消弭对立土壤，杜绝分裂势力借题发挥。"
PAW_dgmfkxd_jy: "发动全国性清剿总动员"
PAW_dgmfkxd_jy_desc: "调动国防军与宪兵主力，对叛区实施分割包围、逐一清剿，重点摧毁其指挥中枢与后勤基地，以雷霆之势粉碎一切抗拒国家统一之企图。"
PAW_jqzlqjg_jy: "派驻行政专员并实施战后救济"
PAW_jqzlqjg_jy_desc: "收复地区百废待兴。中央须火速派遣民政专员接管地方，开仓放粮、发放救济金、修复损毁道路，使百姓尽快恢复正常生产，以此彰显政府与叛乱团体之本质区别。"
paw_xmkbfzz_flag: "正在进行一项消灭恐怖分子的活动"
PAW_xmdkzz_jy: "清剿盘踞于§Y[FROM.getname]§!的叛乱武装据点"
PAW_cdxmzylj_jy: "彻底消灭东南亚自由联军"
PAW_cdxmzylj_jy_desc: "随着最后一个叛乱据点的拔除，东南亚自由联军已被彻底歼灭，翁法罗斯不会再遭到分裂。国家统一得到捍卫，各族公民均能在法治与和平的框架下共享现代化发展之成果。"
PAW_small_PAW_jy: "整合小东南亚"
PAW_small_PAW_jy_desc: "根据翁法罗斯与[ENG.GetFactionName]签署的共同防御及行政协作协定，原属[ENG.getname]的部分南洋属地已完成法理移交手续。中央政府将有序接管上述地区的行政、司法与警务系统，纳入国家统一治理框架，确保当地居民享有与其他国民同等的权利与义务。这标志着翁法罗斯在同盟国阵营中的合作地位得到进一步巩固。"
PAW_endevent_jy: "世界守护者"
