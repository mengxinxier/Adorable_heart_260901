PAW_Philia_end_title: "§P翁法罗斯的永恒诗篇§!"
PAW_Phainon_end_title: "§Y点燃黎明的救世主§!"
PAW_Cerydra_end_title: "§Y金血铭刻的时代§!"
PAW_Irontomb_end_title: "§R迈向群星的毁灭§!"
#介绍
#PAW_Philia_end_tip: "“§0来古士§!的阴谋像一层§g灰蒙蒙的雾§!，一度笼罩了我们所有人的心。可你知道吗？雾是遮不住光的——只要大家愿意把手牵在一起。\n于是我们真的牵起了手。§Y黄金裔§!的每一位，§1翁法罗斯§!的每一位。不再互相猜疑，不再独自背负，不再让谁一个人站在最暗的地方。当我们一起抬起头，那片§g灰雾§!就再也撑不住了——它碎成千万片，被第一束§L星光§!穿透。\n§L光§!落下来的时候，我听见有人在哭，也有人在笑。我好像也哭了。不过那一定是开心的眼泪，因为所有的眼泪都亮晶晶的，像星星一样。\n但我们的§L星光§!没有停在这里。它越过群山，越过海洋，越过那些还在黑暗中发抖的人们的头顶。我们去了冷得让人打哆嗦的§S北方苔原§!，去了热得连空气都在跳舞的§O南方沙漠§!，去了被高高围墙围起来的圣殿，也去了被钢铁和火焰吞没的城市。每一处，都有人在等。等一道光，等一个声音，等有人告诉他们：不用怕了。\n我们就是那道§L星光§!。不是为了§0征服§!，不是为了当§R英雄§!。只是想把从§1翁法罗斯§!出发时握在手心里的那份温暖，送给每一个还在等待的人。§0邪恶的旗帜§!一面一面落下，§Y新的花儿§!一朵一朵地开。我们走到哪里，歌声就跟到哪里——那是我们出发时一起唱的歌呀，你还记得吗？\n现在，歌声传遍了大地。每一个曾被遗忘的人，都找到了属于自己的光。\n§P而我啊，还是最喜欢坐在黄金树下，看着星星一颗一颗亮起来。以前觉得它们好远好远，现在才发现——原来它们一直住在我们心里。只要我们在，光就在。只要我们在，这首歌就永远唱不完♪”§!"
PAW_Philia_end_tip: "名为§Y「翁法罗斯」§!的诗篇，岁月是它的书页，混沌是它的开篇。黄金的鲜血铭刻抗争的足迹，逐火的英雄，在创世的伟业中先行。\n§r「门径」的篇章，晓喻救世讯息，一千个明日冉冉升起。§!\n§C「律法」的篇章，与神明相博弈，只为世界自立于群星。§!\n§B「海洋」的篇章，浪花即便破碎，以千年坚守抵抗虚无。§!\n§H「浪漫」的篇章，引领逐火之旅，金丝为众人编织未来。§!\n§R「纷争」的篇章，血与火的征途，伤痕写就孤独的荣光。§!\n§3「诡计」的篇章，谎言包裹真心，于永夜之中延续光明。§!\n§1「生死」的篇章，拥抱迷途魂灵，令生死流转生生不息。§!\n§6「理性」的篇章，生命付之一炬，灵魂诘问世界的真理。§!\n§G「天空」的篇章，微光疗愈人心，以人的意志缝补晨昏。§!\n§O「负世」的篇章，怒火焚尽囚笼，英雄带来黎明的曙光。§!\n§g「大地」的篇章，熔铸不朽血脉，庇护大地流离的生灵。§!§0\n「岁月」的篇章，守望千万过往，致以不再忘却的纪念。§!\n……\n三千万世，女孩执笔，用§P记忆§!哺育着懵懂的§P「心」§!，十三种光彩，终融汇成§P「爱」§!的颜色。\n当流星划过，天外的英雄接过笔，与伙伴一起再度踏上逐火的旅途，以§Y「开拓」§!的方式写下不同以往的结局。\n故事的尾声，在永恒的净土中，繁花盛开。\n夜的那端，星光熠熠，昼的那端，人们也揉着眼角苏醒。西风轻拂，人们如三千万世经历过的那般，向彼此道出早安。\n于此，故事画上§P「。」§!，它如同一枚不再灼目的烈阳，如同§Y「开拓」§!的罗盘，也如同一只充满爱意的眼眸。\n§t「此世，他们将燃烧的金血熔进身躯。\n来日的命运，可会记得他们的姓名？」§!\n如今，诗篇的诘问已有了回答。\n苏醒在黎明的记忆，不会忘记——§P翁法罗斯§!的名字。"
PAW_Phainon_end_tip: "§H「『黄金之茧』，你将亲眼见证浪漫的终局，重织无瑕的命运。」§!\n§r「『万径之门』，你会敞开万千归途，实现明日相见的预言。」§!\n§6「『裂分之枝』，你埋下那『怀疑』的智种，终将在众人的智慧中发芽。」§!\n§G「『晨昏之眼』，看啊！那天空无缺无隙，尽头便是治愈的虹光。」§!\n§R「归乡吧，『天谴之矛』，你会登上众人簇拥的王座，为世间誓约和平。」§!\n§3「畅所欲言吧，『翻飞之币』，无论是狡黠玩笑，还是真诚言语，你无需隐瞒。」§!\n§1「尽情拥抱吧，『灰黯之手』，冥河的主人……」§!\n§P「你的温柔足以温暖彼岸的花海，人们每次离别都值得重逢的期待。」§!\n§B「世人会听见，『满溢之杯』的歌声在欢宴中不息。」§!\n§0「世人会看见，『永夜之帷』珍藏永不忘却的岁月。」§!\n§g「不朽的『磐岩之脊』将托举众生的远行，直至旅途的终点。」§! \n§C「『公正之秤』将赠予无私的律法，为逐火之旅的万千英杰加冕……」§!\n§O「『全世之座』 ，不必再孤独地背负起一切。\n你看，燃烧不灭的烈阳已然升起……」§!\n那由遗憾铸就的词句，将在重写的诗篇中圆满。§!\n那遥不可及的终点，将在§Y「开拓」§!中抵达。"
PAW_Cerydra_end_tip: "§g「千年后，历史将如何铭记刻律德菈？」§!\n\n她曾如此被人问道。\n\n有人心中，她是赫赫威名的§Y「凯撒」§!。\n\n那冰冷残酷的暴君，那野心勃勃的§R「燃冕者」§!，那以血与火烧尽旧时代的女皇……\n\n有人反驳，她只是一枚可怜的§0「棋子」§!。\n\n这众叛亲离的君王不过是野心的囚徒，在那场与神明对决的棋局中，她注定只能满盘皆输。\n\n也有人说，在那比海更幽暗的内心深处，她只是一个名为§C「刻律德菈」§!的凡人——\n\n她也会为死难的同伴哀悼，也会在沉重的使命前犹疑畏惧，止步不前……\n\n§g「呵，无需历史将我铭记……」§!\n\n她咽下心头苦涩，继续行在那由牺牲铺就的逐火之路——\n\n§O「是吾等燃烧的金血，铭刻了它！」§!"
