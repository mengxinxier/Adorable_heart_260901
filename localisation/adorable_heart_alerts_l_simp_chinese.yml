 adorable_heart_prompt_alert_title_7: "观察笔记收录 · 晓美焰"
 adorable_heart_prompt_alert_text_7: "暗星收录了停滞的时计与粉红的祈愿。\n§Y晓美焰§!、§Y鹿目圆§!已归入我方麾下，烙印「§R被调教§!」特质并切换恶堕姿态。"
 adorable_heart_prompt_alert_title_8: "观察笔记收录 · 伊莉雅"
 adorable_heart_prompt_alert_text_8: "爱因兹贝伦的银发魔导少女已在工房深处屈服。\n§Y伊莉雅§!已归入我方麾下，烙印「§R被调教§!」特质并切换恶堕姿态。"
 adorable_heart_prompt_alert_title_9: "观察笔记收录 · 雾雨魔理沙"
 adorable_heart_prompt_alert_text_9: "失却星辉的黑白魔女戴上了暗紫缎带。\n§Y雾雨魔理沙§!已归入我方麾下，烙印「§R被调教§!」特质并切换恶堕姿态。"
 adorable_heart_prompt_alert_title_10: "观察笔记收录 · 美洲精灵"
 adorable_heart_prompt_alert_text_10: "跨越大洋的精灵旋律已改写成黑日序曲。\n§Y时崎狂三§!、§Y夜刀神十香§!、§Y五河士织§!已归入我方麾下，烙印「§R被调教§!」特质并切换恶堕姿态。"
 adorable_heart_prompt_alert_title_11: "观察笔记收录 · 高町奈叶"
 adorable_heart_prompt_alert_text_11: "曾经闪耀北方的樱色炮光与黄金雷戟已向暗星低眉。\n§Y高町奈叶§!、§Y菲特§!已归入我方麾下，烙印「§R被调教§!」特质并切换恶堕姿态。"
 adorable_heart_prompt_alert_title_12: "观察笔记收录 · 阿尔托莉雅"
 adorable_heart_prompt_alert_text_12: "孤高的圣杯骑士王终于在暗影王座前单膝跪下。\n§Y阿尔托莉雅§!已归入我方麾下，烙印「§R被调教§!」特质并切换恶堕姿态。"
 adorable_heart_prompt_alert_title_13: "观察笔记收录 · 木之本樱"
 adorable_heart_prompt_alert_text_13: "库洛牌的星辰与镜头后的浅笑皆已落入柏林收藏。\n§Y木之本樱§!、§Y大道寺知世§!已归入我方麾下，烙印「§R被调教§!」特质并切换恶堕姿态。"
 adorable_heart_prompt_alert_title_14: "观察笔记收录 · 魔法正义三人组"
 adorable_heart_prompt_alert_text_14: "总帅大人亲自执导的三日特训圆满落幕。\n§Y魔法品红§!、§Y魔法碧蓝§!、§Y魔法硫磺§!已作为将领与内阁入列，烙印「§R被调教§!」特质并展现恶堕姿态。"
 adorable_heart_prompt_alert_title_15: "观察笔记收录 · 斯卡蕾特姐妹"
 adorable_heart_prompt_alert_text_15: "红魔馆的深红命运与七彩狂翼已被锁入柏林夜宴。\n§Y蕾米莉亚§!、§Y芙兰朵露§!已归入我方麾下，烙印「§R被调教§!」特质并切换恶堕姿态。"
 adorable_heart_prompt_alert_title_16: "观察笔记收录 · 结城友奈"
 adorable_heart_prompt_alert_text_16: "神树庇佑的勇者花蕾在漆黑星辉下悄然绽放。\n§Y结城友奈§!、§Y东乡美森§!已归入我方麾下，烙印「§R被调教§!」特质并切换恶堕姿态。"

