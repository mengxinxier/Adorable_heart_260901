  AH_JAP_ai_behavior_SELECTION: "@JAP 樱花国"
  JAP_GAME_RULE_1: "政变余波-文官政府的终结"
  JAP_GAME_RULE_1_DESC: "军部借由兵变产生的动荡，成功发动了政变。天皇会回归并重新统治国家，使樱花国走上对外扩张的道路。"
  JAP_GAME_RULE_2: "谈判破裂-樱花国革命"
  JAP_GAME_RULE_2_DESC: "樱花共产党与文官政府无法达成统一意见，樱花的共产主义者将会联合起来发起内战，推翻右翼文官政府的统治。"
  JAP_GAME_RULE_3: "民主幸存-西方的走狗"
  JAP_GAME_RULE_3_DESC: "民主得到拯救，并且冲田总司拒绝了天皇的提案并及时改革了政府，樱花国将继续维持现任政府，并尝试加入圣杯同萌。"
  JAP_GAME_RULE_4: "民主幸存-天皇和平回归"
  JAP_GAME_RULE_4_DESC: "冲田总司接受了天皇的提案，右翼文官控制政府并迎回了天皇，但这次樱花国将为消灭西方帝国主义而战。"
