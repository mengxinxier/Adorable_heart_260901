  AH_JSZ_ai_behavior_SELECTION: "@JSZ 南直隶总督府辖区"
  JSZ_GAME_RULE_1: "§O南直隶总督区仍存§!"
  JSZ_GAME_RULE_1_DESC: "风雨中，南直隶总督府仍存于南京，南直隶将继续效忠北京。\n§L--倾向于和§O帝国政府§!（§C立宪§!、§O王权§!）合作。§!\n§L如果§O帝国政府§!选择§Y袁克定§!路线，将会倾向于§O逐鹿中原§!。§!"
  JSZ_GAME_RULE_2: "§C国民党起义成功§!"
  JSZ_GAME_RULE_2_DESC: "国民党将会起义推翻南直隶总督府，三民主义将解放江浙人民。\n§L--倾向于和§3国民党§!合作。§!"
  JSZ_GAME_RULE_3: "§Y七十年太平血§!"
  JSZ_GAME_RULE_3_DESC: "七十年前统治天京、击败清妖的太平军从未灭亡，拜上帝会将重回于世。\n§L--倾向于§O逐鹿中原§!。§!"

  AH_FUJ_ai_behavior_SELECTION: "@FUJ 闽赣总督府辖区"
  FUJ_GAME_RULE_1: "§S玉帅再起§!"
  FUJ_GAME_RULE_1_DESC: "不再寄人篱下，不再依赖秘仪。§S吴佩孚§!要用近代化的军队和纯粹的军事才能，夺回属于自己的一切。\n§L--倾向于和§O帝国政府§!（§C立宪§!、§O王权§!）合作。§!\n§L如果§O帝国政府§!选择§Y袁克定§!路线，将会倾向于§O逐鹿中原§!。§!"
  FUJ_GAME_RULE_2: "§C铁卫独立§!"
  FUJ_GAME_RULE_2_DESC: "§C星见雅§!脱下仪仗礼服，穿上战甲，从旧都的护卫者，变成百姓的守护者。\n§L--倾向于和§3国民党§!合作。§!\n§L--倾向于和§R左翼政权§!合作。§!"
  FUJ_GAME_RULE_3: "§Y旧都复兴§!"
  FUJ_GAME_RULE_3_DESC: "§Y仪玄§!的目的从来不是统治闽赣——而是借助闽赣的力量，找到最后一座旧都遗迹，完成那个跨越千年的仪式。\n§L--倾向于§O逐鹿中原§!。§!"

  AH_WUH_ai_behavior_SELECTION: "@WUH 湖广总督府辖区"
  WUH_GAME_RULE_1: "§S神兵振兴§!"
  WUH_GAME_RULE_1_DESC: " 南宫问天下定决心，不再满足于偏安一隅。他要以神兵之力，在这个黑暗的时代重新照亮华夏。\n§L--倾向于§O逐鹿中原§!。§!"
  WUH_GAME_RULE_2: "§S守土安民§!"
  WUH_GAME_RULE_2_DESC: "南宫问天深知神兵之力并非万能，与其逐鹿中原让百姓再遭涂炭，不如以湖广为壁垒，为乱世中的黎民守住最后一片安宁。\n§L--倾向于和§3国民党§!合作。§!\n§L--倾向于和§R左翼政权§!合作。§!"
  WUH_GAME_RULE_3: "§P仁心能否镇乱世？§!"
  WUH_GAME_RULE_3_DESC: "一个拥有净化之力却毫无权谋经验的少女，被推上了乱世中军政权力的巅峰。她必须在理想与现实的撕裂中，找到一条没有人走过的路。\n§L--倾向于和§3国民党§!合作。§!\n§L--倾向于和§R左翼政权§!合作。§!"
  WUH_GAME_RULE_4: "§Y铁心入主§!"
  WUH_GAME_RULE_4_DESC: "神兵应当回归守护者的天职，不再干涉凡人政治——但铁心很快发现，拒绝卷入政治的梦想在乱世中根本不切实际。\n§L--倾向于§Y独立§!。§!"
  WUH_GAME_RULE_5: "§O旧军阀的复辟§!"
  WUH_GAME_RULE_5_DESC: "神兵不存，枭雄当立。孙传芳撕下伪装，湖广重新成为旧军阀的猎场。\n§L--倾向于和§O帝国政府§!（§C立宪§!、§O王权§!）合作。§!\n§L如果§O帝国政府§!选择§Y袁克定§!路线，将会倾向于§O逐鹿中原§!。§!§!"

  AH_YUN_ai_behavior_SELECTION: "@YUN 云贵总督府辖区"
  YUN_GAME_RULE_1: "§S彝帅定边§!"
  YUN_GAME_RULE_1_DESC: "曲是最务实的人。她不相信蛊术，不相信马帮，不相信任何超出她理解范围的东西。她相信的只有两样：滇军的枪，和昆明的城墙。她要做的不是变革云南，而是守住云南——在一个谁都想把手伸进西南的时代。\n§L--倾向于和§O帝国政府§!合作。§!"
  YUN_GAME_RULE_2: "§g蛊约天下§!"
  YUN_GAME_RULE_2_DESC: "蛊林的力量远超任何人的想象。它不是乡野迷信，不是巫术骗术——它是一种被遗忘的科学，一种与这片土地本身共生的古老系统。\n§L--倾向于§Y独立§!。§!"
  YUN_GAME_RULE_3: "§F炼天魔尊§!"
  YUN_GAME_RULE_3_DESC: "落魄谷中寒风吹，春秋蝉鸣少年归。荡魂山处石人泪，定仙游走魔向北。逆流河上万仙退，爱情不敌坚持泪。宿命天成命中败，仙尊悔，而我不悔！\n§L--倾向于§O逐鹿中原§!。§!"
  YUN_GAME_RULE_4: "§P共享家园§!"
  YUN_GAME_RULE_4_DESC: "什么是共享家园？就是我个人出钱，在我身后这座黔东南的大山里，打造一个大集体生活。我们所有人一起生产、一起劳动，最后所有的劳动成果由我们一起共享！\n§L--倾向于和§R左翼政权§!合作。§!"

  AH_SIK_ai_behavior_SELECTION: "@SIK@CHI@SOV 新疆内乱"
  SIK_GAME_RULE_1: "§O中原派§!"
  SIK_GAME_RULE_1_DESC: "中原派将会掌管新疆，将屈从于中原政权。\n§L--倾向于和§O任何中原政权§!合作。§!"
  SIK_GAME_RULE_2: "§R苏联派§!"
  SIK_GAME_RULE_2_DESC: "苏联派将会掌管新疆，将屈从于左翼政权。\n§L--倾向于和§R左翼政权§!合作。§!"
  SIK_GAME_RULE_3: "§Y地区独立势力§!"
  SIK_GAME_RULE_3_DESC: "地区独立势力将会掌管新疆，将不会屈从于任何政权\n§L--倾向于§Y独立§!。§!"

