  AH_PAW_ai_behavior_SELECTION: "@PAW 翁法罗斯"
  PAW_GAME_RULE_1: "§R失控变量§!"
  PAW_GAME_RULE_1_DESC: "实验结果在来古士的计算之外，实验彻底失败了，毁灭机器没有被制造出来，但翁法罗斯也彻底沉寂。§R（提示：此路线为黑线之一，目前共有四条黑线）§!"
