  NPT_GAME_RULE_5_DESC: "将会触发两方内战，需要§Y联邦政府§!赢得内战，§Y天王星涡芽§!将会在战后领导伊比利亚，倾向于建立§R工团国际§!或加入§R革命幻想乡§。"
