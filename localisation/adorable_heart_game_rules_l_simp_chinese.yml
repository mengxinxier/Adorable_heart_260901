  AH_FRG_ai_behavior_SELECTION: "@FRG 齐亚德联邦"
  FRG_GAME_RULE_1: "§Y民主仍存§!"
  FRG_GAME_RULE_1_DESC: "联邦成功镇压了军团叛乱，维持了民主体制"
  FRG_GAME_RULE_2: "§Y军团胜利§!"
  FRG_GAME_RULE_2_DESC: "§Y凯撒军团§!颠覆了联邦，梦想着恢复古罗马的荣光"
  FRG_GAME_RULE_3: "§Y军政府——麦克阿瑟继任谢泼德§!"
  FRG_GAME_RULE_3_DESC: "§Y谢泼德将军§!对恩斯特总统发动了政变，建立了军政府。赢得北美战争后，麦克阿瑟成为继承人。"  
  FRG_GAME_RULE_4: "§Y军政府——约瑟夫·艾伦继任谢泼德§!"
  FRG_GAME_RULE_4_DESC: "§Y谢泼德将军§!对恩斯特总统发动了政变，建立了军政府。赢得北美战争后，约瑟夫·艾伦成为继承人。"  
  FRG_GAME_RULE_5: "§Y军政府——芙拉迪蕾娜·米利杰继任谢泼德§!"
  FRG_GAME_RULE_5_DESC: "§Y谢泼德将军§!对恩斯特总统发动了政变，建立了军政府。赢得北美战争后，芙拉迪蕾娜·米利杰成为继承人。"  
  FRG_GAME_RULE_6: "§Y第二次人民革命——芙拉迪蕾娜·米利杰继任恩斯特§!"
  FRG_GAME_RULE_6_DESC: "§Y恩斯特·齐玛曼§!在镇压军团后宣布第二次人民革命，将齐亚德转变为社会主义国家。赢得北美战争后，芙拉迪蕾娜·米利杰成为继承人。"  
  FRG_GAME_RULE_7: "§Y第二次人民革命——亨丽埃塔·潘洛斯继任恩斯特§!"
  FRG_GAME_RULE_7_DESC: "§Y恩斯特·齐玛曼§!在镇压军团后宣布第二次人民革命，将齐亚德转变为社会主义国家。赢得北美战争后，亨丽埃塔·潘洛斯成为继承人。"  
  FRG_GAME_RULE_8: "§Y第二次人民革命——恩斯特留任总统§!"
  FRG_GAME_RULE_8_DESC: "§Y恩斯特·齐玛曼§!在镇压军团后宣布第二次人民革命，将齐亚德转变为社会主义国家。赢得北美战争后，恩斯特决定继续履行总统职责。"  
  FRG_GAME_RULE_9: "§Y帝国复辟——贵族架空女皇§!"
  FRG_GAME_RULE_9_DESC: "§Y凯撒§!在遇刺后军团内的保皇党人趁机夺权，随后迎回隐居的皇女复辟齐亚德帝国。赢得北美战争后，贵族架空了女皇。"  
  FRG_GAME_RULE_10: "§Y帝国复辟——女皇大权在握§!"
  FRG_GAME_RULE_10_DESC: "§Y凯撒§!在遇刺后军团内的保皇党人趁机夺权，随后迎回隐居的皇女复辟齐亚德帝国。赢得北美战争后，女皇粉碎了贵族的政变阴谋。"

