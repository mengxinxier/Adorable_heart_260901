  PAW_GAME_RULE_3: "§0永劫轮回§"
  PAW_GAME_RULE_3_DESC: "虽然白厄最终战胜了来古士，终结了翁法罗斯的轮回，但错误的过程使他已经成为来古士最完美的杰作，足以毁灭世界的终极兵器就此诞生。§R（提示：此路线为黑线之一，目前共有四条黑线）§!"
  PAW_GAME_RULE_4: "§Y再创世§!"
  PAW_GAME_RULE_4_DESC: "在白厄与昔涟的努力下，所有黄金裔齐心协力，最终战胜了来古士，并终结了翁法罗斯的轮回，但仍有些谜团尚未被解开...§C（提示：此路线为蓝线之一，目前共有两条蓝线）§!"

