 #天朝朝贡体系
  China_tribute_system_dipo_Title: "§Y天朝朝贡体系§!"
  China_tribute_system_Title: "£China_tribute_system_text_icon §Y天朝朝贡体系§!"
  China_tribute_system_leader: "£China_tribute_system_text_icon §Y天朝朝贡体系§!领袖"
  China_tribute_system_TT: "[GET_China_tribute_system_modifier]"
  China_tribute_system_dipl_TT: "§Y[From.GetNameDef]§!的经济同盟属于£China_tribute_system_text_icon §Y天朝朝贡体系§!\n\n[GET_China_tribute_system_modifier]"
  China_tribute_system_desc: "“朕膺天命，统御万邦。四夷来朝，厚往薄来。此非利之所驱，乃德之所化，礼之所序也。”\n\n在神州帝国的理念中，世界秩序并非建立在平等的条约之上，而是围绕着一个永恒的文明中心——即帝国本身——形成的天然等级体系。£China_tribute_system_text_icon §Y天朝朝贡体系§!正是这一古老世界观在近代的延续与重塑。\n\n该体系并非现代意义上的军事同盟或自由贸易区，而是一个以神州帝国为宗主，周边藩属、盟邦及特许贸易伙伴为成员的政治-经济圈。帝国通过军事保护、文明教化与特许贸易的“恩赐”，来换取周边国家的称臣纳贡与政治忠诚，从而构建一个以帝都南京/北京为核心、辐射四方的稳定秩序。"

