#设定
  CHI_his_page_01_title: "清末风云"
  CHI_Country_History_Page_01: "北京在1855年的陷落标志着来自满清皇权和中央秩序在中原的崩溃，太平军北伐军出乎意料的胜利，摧毁了各地团练民团与地方军队指挥体系，而朝廷亦是仓皇举家北狩。但这支军队没有，也无力取代清廷在中原的统治。\n\n此时距离太平军事变仅剩一年，而太平军政权也始终未能突破湘、淮两军对太平军的包围态势。这支孤军只能以攻占的北京为据点，试图重新打通与太平军的联系——但事变之后，一切尝试重新弥合天国政权的努力均宣告失败。天国分裂成两派，太平军也未能抓住彻底冲破军事封锁的宝贵时期，但在这四处出击的混乱中，让清廷中中原仅剩的一丝残血也化为乌有。\n\n而原先因为清廷崩溃而陷入混乱的各地方团练武装则得到了喘息的宝贵时间。清廷的覆亡给予了他们极大的震撼，但不多时，这些地方军队便意识到，此刻是拥兵自立的宝贵时期。\n\n接手了恩师身后的湘军，接任湖广总督的蒋世渊没有为北京的陷落所动，失去了清廷指挥的湘军，并没有因此而慌乱，而是被蒋世渊迅速重组，依旧忠实的贯彻着对太平军的封锁，不过在清廷覆亡之后这更多成为了一种保存实力的军事对峙，靠着“结硬寨，打呆仗”逐渐将劫掠维系的太平军方面拖入了持久战的泥泞中，并在之后的战斗中逐渐占据优势。另一面，太平军在江苏方面的战事也以失败告终，失去了头顶上的政治权威，此刻以上海为军事中心，盘踞在苏州的淮军也能够放开手脚向海外列强争取更多的武装支持。\n\n北京的陷落并未给太平天国带来真正的胜利。相反，中原王朝正式走向了总崩溃，而与两支强大的军团在南方拉锯的太平军政权反而逐渐在军事上愈发陷入被动。\n\n1864年洪秀全的逝世使得两方本就已岌岌可危的态势彻底倒向蒋氏一方，淮军持续向施压，蒋则向石达开推行招抚策略，并且委派大量的机动兵力进行军事压迫。石达开权衡再三最终同意招安，被封为西南都司都指挥使。这意味着太平军在两大军阀的联合绞杀下即将陷入绝境。\n\n1865年，湘军攻陷太平军，太平天国正式宣告覆灭，此刻踌躇满志的的蒋自然不再奉远狩的满洲朝廷为正朔，而在南京效法洪武改元建制，同时效仿西方制度，国号称神州帝国，年号武定。尽管此刻的蒋离结束中原的混乱还很有一段距离，但他有如此做的底气——湘军与淮军已经实现了合流。李鸿章原本就无争雄之志，是最先服从来自南京的新中央——也是服从的地方军队中最强大的旧清军。这支新旧杂糅的军队便是帝国军的雏形。\n\n很难从施政角度评价蒋世渊的功过，他将后半生都扑在统一华夏旧土的事业上。他与圣杯签订的一系列不平等条约在内容与危害性上比起旧清廷更甚，但平心而论，列强对神州军队的支持使得他可以以绝对的优势征讨依旧奉太平教——或满族人为尊的割据势力，并在一定程度上，维持了神州与其他列强间表面上的和平。不过，新的中央军内部并非铁板一块，湘军与淮军在不少地方存在对立甚至冲突——间接导致未来南北帝国军的分化——这使得收拾山河的工作并非一帆风顺。\n\n一般认为北直隶太平军在1878年的覆亡标志着神州帝国于事实上再次统一中原。而在1881年将龟缩与盛京满清余孽剿灭，更是一统华夏旧领的标志性事件。\n\n不知从什么时间开始，蒋世渊不在英明，不在勤奋，他如恶虎般紧握着军权，却对名声不在关注，作为一位开国君主，蒋世渊罕见的并不热衷于亲政——早在1878年攻入北京时，他便将早期从起兵时期就随其左右的一众幕僚提携至中央。在统一由军政官员组成的中央朝廷之外建立起一个专门的咨议机构。这便是帝国议会的雏形。当然，其嬗变实起于新朝。后人评价蒋世渊的统治末期时，是一个沉迷于享乐，不理国政切喜怒无常的昏聩之君。不过对于这一转变，后世之人往往众说纷纭。1887年，武定皇帝蒋世渊逝世，庙号太祖，谥号契天隆运奋武毅智弘文宣孝襄烈皇帝。当是时所有人都从的压力中舒缓，其中也包含太子蒋启钧，二代难继的诅咒终究没发生在他的身上。\n\n数周后，蒋启钧即位，年号绍熙，取义绍继先业，熙政维新。\n\n"
  CHI_his_page_02_title: "维新之殇"
  CHI_Country_History_Page_02: "蒋启钧花了近三年的时间来稳定新皇登基带来的影响，又花了近五年，试探着追赶着列强的脚步，试探着摆脱圣杯王国的影响，民族企业在期间欣欣向荣，工商业在期间蓬勃发展，仿佛希望就在明天，这或许是神州为数不多的治世吧，但当蒋启钧在1898年接受了康佑薇、梁启超领导的少壮维新派的公车上书，开始维新变法时，仿佛一切都变了，传统派的阳奉阴违，列强的威逼利诱正一步步束缚着改革的脚步。\n\n即使是不平等条约，也被圣杯为首的列强一项项撕碎，一夜之间神州与列强间的默契全面破裂。这一破裂的结果便是前者联合幻想乡共和国、德意志帝国、俄罗斯帝国、宝石多瑙河邦联组成的五国联军。这场战争极其惨烈，并且对于中央帝国军而言是灭顶之灾，即使有着远洋共和国的提起传讯而有所准备，但联军从海上而来，四处出击的联军也让中央军疲于奔命。数月混战，联军经天津登陆，已经兵临首都，各路勤王大军四处受阻，难以相援。\n\n但这也没有改变蒋启钧改革的决心，在北京城中，他将倾力培养的太子蒋瀚宸和众多维新派官员秘潜出京，而将传统派大臣强留京城，罪己遗诏是他为太子顺利登基的准备，而随北京殉国，是他向神州的交代。\n\n北京沦陷，先皇遗诏也被发出，派出使团，向联军求和。一方面在承诺恢复所有旧约的基础上签订了大量新的丧权辱国的国际性条约——其中便包括在上海设立国际租界以供海外国家在神州境内驻扎军队，但牺牲并非毫无意义，列强联军在北京城大战中亦损失惨重，这让列强们再难轻言入侵，但如此筹谋的代价是什么呢？\n\n许多地方的维新派人士对充满妥协的朝廷深感失望，由此开始转变为革命派。1901年，神州帝国投降，绍熙皇帝蒋启钧殉国，并且为这一失败的维新画上休止符。太子蒋瀚宸临危受命登基称帝，年号永兴。\n\n虽然新皇在努力继续推进改革与休养生息，但这场失败带来的连锁反应正在缓慢发酵。1911年的保路运动意味着整个南方地区都团结起来反对神州帝国为了筹集赔款而下达的铁路国有化命令。所有人都知道，这些由国人承建的铁路被收回中央后必然会作为赔款的一部分转售海外。对帝国政策的强烈抵制最终在4月演变成了大规模的武装起义，直至最后，这场被后世成为辛亥革命的南方大叛乱波及两广，两江，四川甚至云贵地区。\n\n至1912年3月，神州帝国才勉强镇压这次革命，将革命军赶到了广东，重新在长江以南建立了脆弱的统治秩序。此时皇家嫡系军队已在五国之乱中覆灭，传统派势力真空催生新权臣 —— 掌控北方的剿匪总司令袁世凯成为最大受益者。1914 年，帝国将南方划分为数个军政大省，总督直接节制巡抚并向中央负责，地方新军接管保境安民任务，蒋瀚宸乐于此安排，因可让东南大员负责与列强交涉，避免有损天威。\n\n1914-1918 年，袁世凯助力神州帝国扩张并现代化军队，朝廷摒弃经济改革，优先发展武装，为此加重南方税赋并拉拢袁氏。恰逢俄罗斯帝国崩溃，神州与协约国达成协议（圣杯王国承诺不支持俄领土要求、允诺解除部分不平等条约），袁世凯任北伐军统帅，率 20 万神州与协约国联军北伐西伯利亚，攻陷海参崴后北上，却最终惨败，三军尽没。1918 年袁世凯在哈尔滨病逝，其女袁克定集结残兵南撤，后要求接任帝国军总司令，朝廷无奈应允；东南军统帅吴佩孚率军入京重申忠诚，北方骚动平息。此战导致帝国统治规则失去支撑，朝廷难再随意驱使地方总督。\n\n1926年，国民党发动了北伐战争，南方各地的杂牌军难以应对北伐军的攻势，9月便以丢失半壁江山。朝廷不得不急调袁克定北方军南下，与中央军一共剿匪。\n\n1927年4月12日，袁克定与蒋介石决战于郑州郊外，袁克定悍然掘开花园口大堤，在漫天洪水的帮助下，她彻底歼灭了这只北伐主力军与其统帅蒋介石。同日，她在上海大肆屠杀已经投降的工人纠察队，直接导致了共产党组建红军并在江西、湖南等地建立了根据地。\n\n然而对北京朝廷而言，这场胜利却是令人不安。袁克定展现出的决断力与狠辣手段——炸开黄河大堤、以数十万军民性命为代价换取胜利——让朝廷不寒而栗。一个可以毫不犹豫牺牲数十万人的将领，还有什么是不敢做的？\n\n朝廷以明升暗降的方式将袁克定调离了南方战场。但这一举措只能延缓袁氏势力的膨胀，无法阻止一个事实的形成：经此一役，帝国最精锐的武装力量已牢牢掌握在袁克定手中，她不再是朝廷的臣子，而是以北方军为后盾的无冕之王。\n\n到1928年，革命军已无力再战。残部重新退回广东一省，北伐宣告失败。\n\n1930年朝廷新组建的南方军与中央军一共围剿湘江赤党，叛军西撤入四川。同期，康有为与梁启超矛盾激化，梁启超脱离公车派建立宪民主党，获皇帝支持 —— 皇帝将其弟子黎星刻接入皇宫伴读太女（蒋丽华），还拨皇室内帑让其组建京城新军卫所，以牵制袁氏军力。\n\n"
  CHI_his_page_03_title: "大乱序曲"
  CHI_Country_History_Page_03: "当蒋瀚宸登天子位的时候，他是否会忌惮太平天国的恶灵缠身？我们不得而知。唯一能够知道的是，他的子孙再一次直面“岁大饥，人相食”的威胁，一如往日。\n\n1931年，长江的怒吼为帝国带来了最为阴暗的时代，饥荒的连锁反应迅速蔓延至北方，失去了江南粮仓的北京朝廷甚至也在面临缺粮的威胁，更不必说皇城之外不见一粟的黎民百姓。在风雨飘摇的愁绪和天灾人祸的摧残下，皇帝的身体终究难以为继，他带着病躯尽全力的为蒋丽华的即位铺平道路。\n\n他将楚王蒋傅说这位在西北戈壁建久经战阵却又年迈的战将选为摄政王，将康有为定为国会总理，维持朝廷运转，将在远洋留学的黎星刻召回国内，接替几年前病故的梁启超，总督京城防务，将手握重兵的大将悉数外遣，更是将内卫提前从整，以确保对蒋丽华的忠心，可以说他做到了他能力范围里的一切，在回光返照般的坚持两年后，终于闭上了他沉重的双眼。\n\n1933年，蒋瀚宸病逝，庙号宣宗，谥号奉天效运敦孝宽温睿哲勤诚襄成皇帝。\n\n年仅13岁的蒋丽华登基，年号永和。依照宣宗遗诏，楚王、黎星刻与康佑薇组成摄政内阁，决定权全权由楚王受理。但年迈的楚王为维护幼女登位带来的影响已然捉襟见肘，更没有精力统领朝廷下争斗不休的帝国议会，对停滞的改革也毫无办法。他只能尽力维持着神州最后的体面，直到有回转之机的到来。\n\n同时在朝堂之外，南北军的矛盾已经愈演愈烈。\n\n在北伐战争中南方军被轻易击溃，愤怒的朝廷在战后将整个南方军上下清洗了个遍，并大力拨款组建新军。\n\n到1936年，袁克定直属的北方军无疑是帝国内最强大的军事力量，而由孙传芳的湖广军、吴佩孚的闽赣军以及段祺瑞的南直隶军组成的南方军集团却也能与之抗衡，不过前提是广东的革命党人不会将她们一网打尽。\n\n巴山之南，云贵与四川需要时刻提防着赤匪的反击，不过四川总督对于剿匪事宜，却是兴致缺缺；黄土之西，民族问题始终困扰着这片西域之地，如今北方的赤色巨熊也已经恢复过来，熊的利爪已经准备好随时伸向这里；长城之外，东北王与草原上的各族时刻关注着关内的动向。\n\n"

  China_Local_History_Title: "§Y中华§!地区"
  China_Local_History_Title_01: "大乱终结"
  China_Local_History_Title_02: "神州北伐"
  China_Local_History_Title_03: "天子之敌"
  China_Local_History_Page_01: "至1912年3月，神州帝国重新在长江以南建立了脆弱的统治秩序。将集结起来的革命派匪军赶到广东之后，北京决心在南方重建来自帝国的直接控制，但她们缺乏最为关键的武装力量——在军事上掌控着北方的剿匪总司令袁世凯对率军深入岭南腹地兴致缺缺，对他来说其麾下的军队已经完成了最为主要的任务——为这位总司令争取到足够的政治资本。双方的冲突似乎一触即发，但5月江西剿匪军区的建立似乎终结了争论。作为神州帝国建立的第一个行政军区兼战区，它很好的代表了神州新军在东南的权威。\n\n到1914年中旬，新一批地方总督的任命将南方划分为数个军政大省。与清廷不同，总督府直接节制诸省巡抚，并直接向中央负责。她们也不再是朝廷权臣，而是从地方任命的封疆大吏。这个决定对天子来说当然是苦涩的，但地方上的独立在某种程度上推进了新的近代化军制在全国的普及。在某种程度上并不忠于北方的地方新军接管了保境安民的政治任务。同时，军阀性质的总督们，并不愿意将自己的精锐部队折在与广东革命党人的战争上，尤其是在北伐后北京朝廷对南方控制力大减的背景下。值得一提的是，神州天子蒋瀚宸似乎乐于接受现状，因为朝廷与诸列强之间的交涉将可以全权授予东南大员而不必担心有损天威。而坐拥中央军与江西的神州朝廷自不必担心会出现第二次犯上之举。\n\n当然，为此获利的并非只有朝廷。同时，在南昌举起义旗的左翼国民革命军在一片混乱中向西进军，与在湘江起义的农民叛军合流并在湘江一带建立了一批小型的革命根据地。这支共产主义部队并未尝试控制湖广，而是将其势力延伸至湘西一带。湖广地方军数次纠集武装前去征讨，要么无功而返，要么大败而归。位于上海租借地的中国共产党中央则安全地指挥着湘潭、衡阳甚至是芷江的游击军队与地方苏维埃政府在湖广与总督分庭抗礼。不过这倒也为日后中共武装的路线之争乃至其导致的更为严重的政治后果埋下了伏笔。\n\n不管怎么说，在湖广地区发生的骚乱并不值得上达天听。\n"
  China_Local_History_Page_02: "从1914年至1918年，在袁世凯的支持下，神州帝国紧锣密鼓地进行着其军队的扩张与现代化。在新政失败与南方叛乱之后，对于当朝天子而言，一支足够震慑群臣的庞大军队显然是优先度更高的事宜。南方本就不堪的税赋压力因为中央军的扩张横生税目。这既代表着天子心态的转变，也反映了帝国的改革方向——经济变革已被摒弃，强大且近代化的武装力量才能帮助帝国渡过难关。为此北京不惜进一步拉拢袁氏以保证军队的忠诚。至于南方该如何承担起这无故猛增的朝廷支出，那就确乎只有上苍才能知晓了。\n\n也许是正应神州帝国的“天命”，这支被天子竭力压榨国力经营出来的强大武装，遇上了也许能再振帝国的天赐机遇。俄罗斯帝国的崩溃与迅猛但混乱的红色革命似乎让帝国重返外兴安岭成为了可能，成立的远东共和国孱弱无比，只能依赖东北布尔什维克的西伯利亚方面军抵抗西方的高尔查克匪帮。若是此时率天军大胆北上，定能驱逐鞑靼，甚至将其控制扩展到整个被西伯利亚也犹未可知。\n\n在这样的想法下，一直对外部事务毫无兴趣的皇帝兴奋的与协约国达成了协议，圣杯一方甚至做出承诺，这场军事行动将会停留在对革命的武装干涉这一名目上，协约国不会承认帝国与俄罗斯的战争状态，也不会对俄罗斯日后可能的任何要求帝国归还领土的外交动作做出任何支持。就这样，以袁世凯为北伐军统帅，张作玲在内的诸多北方大员拥军参与。神州开始了北伐。\n\n协约国开出如此大的价码并不奇怪。彼时中央军在四年内扩充至近10万，而北方相对更加亲近中央的几个边疆总督对军事行全力支持。若将协约国应允出征的干涉军算入，总逾20万的神州军队与协约国的联军大举进入西伯利亚平原，兵锋不可谓不大。远东的革命政权自是首当其冲，西北省军策应高尔查克匪军向红军发动进攻，而最为精锐的中央军队则与协约国分两路出兴安岭，在攻陷海参崴之后继续北上，大有封狼居胥，一举剿灭东北俄罗斯红军之势。\n\n然后呢？哈，当然是仓皇北顾。\n"
  China_Local_History_Page_03: "帝国在北方的军事赌博以三军尽没而告终，帝国伴随着中央新军一同失去的还有他们的朝鲜藩国，后者意识到神州再无可堪一用的中央军队之后便迫不及待的宣告独立。2年后，樱花远征军在日本本土的支持下武装控制了朝鲜半岛。惊恐的北方诸省匆忙撤回了军队并窥伺着朝廷的一举一动。不过这个时候朝廷的反应倒是无关紧要的：坐镇哈尔滨的北伐军统帅袁世凯在此时气竭而逝。其女袁克定临阵上马，重新集结溃败的残兵向南退却，只留下东北总督张作玲和形同虚设的地方军队阻挡布尔什维克的兵锋。不过好在迫于干涉军在海参崴的威胁，红军部队并未追击，神州残部才得以回到帝国北方。\n\n这场兵败对朝廷和袁氏来说都近乎致命。不过很快袁克定就重新掌控了北方局面，她一面呼吁江西的中央军部队北上“勤王”，一面上喻朝廷，要求接任其父的帝国军总司令一职。这一父死子继的任命一旦被下达，其影响不言而喻，但除了接受这个要求，此时的朝廷亦无其他选项。1918年8月，姗姗来迟的东南军统帅吴佩孚率军进入北京，他接受了新的上级并向朝廷重申忠诚，北方骚动至此才告一段落。\n\n看上去，似乎除了失去一支为帝国带来了沉重负担的庞大军队，这场失利并未在帝国各地掀起太大的波澜。但就后果而言，帝国用这支军队勉强建立起来的统治规则失去了最大的顶梁柱。朝廷能够随意任命并驱使地方总督的时代一去不复返。\n\n1926年，国民党发动了北伐战争，9月便攻陷了南方半壁江山，朝廷不得不急调袁克定北方军南下，与中央军一共剿匪。\n1927年4月12日，袁克定掘开了花园口大堤，漫天的洪水淹没了北伐主力军与统帅蒋介石，也淹没了革命军一统中原的野望。朝廷以明升暗降的方式将袁克定调离了南方战场，以图遏制袁克定的权力膨胀。到1928年，革命军已无力再战。残部重新退回广东一省，北伐宣告失败。1930年朝廷新组建的南方军与中央军一同围剿湘江赤党，此役对于帝国来说是辛亥革命以来为数不多的胜利。面对帝国军的缓慢推进，叛军被迫西撤，最终撤入四川。但随后的征讨工作开始变得花费颇巨，并且很快朝廷也将被另一件更重大的事情转移走注意力。四川当局则无力阻止工农武装在四川乃至云贵的扩散。这场将持续至1931年的革命战争被称为“土地革命”。在战略转移中赢得了领导权力的农民派将领毛润芝在四川重新建立起了一支有别于湘潭时期的工农武装，在断绝了与上海中央的联系后，湘潭-四川工农红军为苏维埃开辟了一系列新的革命根据地，并将在未来在事实上赢得军阀的俯首。\n\n不过道阻且长，15年，已是只争朝夕。\n\n\n当蒋瀚宸登天子位的时候，他是否会忌惮太平天国的恶灵缠身？我们不得而知。唯一能够知道的是，他的子孙再一次直面“岁大饥，人相食”的威胁，一如往日。\n\n1931年，长江的怒吼为帝国带来了最为阴暗的时代，饥荒的连锁反应迅速蔓延至北方，失去了江南粮仓的北京朝廷甚至也在面临缺粮的威胁，更不必说皇城之外不见一粟的黎民百姓。\n\n饥荒往往是革命的前兆，尽管再未来的两年，结果外交斡旋，神州争取到了来自西方可谓巨额的救济粮供应。但问题在于，粮食大多从南方经手，且不说腐朽的官吏会将这批粮食层层盘剥殆尽，在各个行省的分食之下，它们几乎无法被送至河北。\n\n天子病重的蒋氏朝廷选择对饥荒闭眼不见，而袁克定和她的中央军甚至需要自行筹措军饷，袁甚至征得朝廷下喻，将河北王畿的大部分地区划为粮区，以便官军劫掠。\n\n在南方，革命党人的威胁在朝廷的眼皮底下卷土重来，广东国民政府似乎已经恢复了元气，大有拥兵北伐的倾向。\n\n1933年10月8日，蒋瀚宸驾崩，唯一的女儿蒋丽华成为了帝国仅存的也是唯一的一位女性天子。尽管朝堂大臣对册立一位女皇帝议论纷纷，但此时担任摄政的楚王蒋傅说力排众议，让这位年幼的女孩子于13日登临天子之位。\n\n不知是巧合还是必然，1935年10月13日夜，四川总督府密邀她们的敌人于重庆密谈。政府军放弃了继续围剿“赤匪”的计划，转而允许她们在城市以外的地方扩张她们的苏维埃政权，这场在后世被称为“十月密谈”的合约意味着军阀与红军在四川的15年冲突就此告一段落。这份和平协议并不为中央所知，但就算能知晓，他们也没有时间应对了。革命党人——一支崭新的国民革命军，在黄埔军校中，沉默着，看着北方的广阔大地。第二次北伐战争似乎一触即发，而这一次，她们不太可能失败。\n\n此时离鼠年，还有不到两个月。\n"

  CHI_route_guide_desc: "§Y神州帝国§!路线指南：\n一、§C君主立宪§!路线§L§!\n-1.静待§R帝国崩溃§!，北方军入京。\n-2.在事件“§Y鼎革分潮§!”中选择“§Y子弹击碎了九龙壁一角。§!”\n-3.§O统一中国§!后解锁二阶段国策，可以根据国会支持率选举出新的执政党（§P农工民主党§!/§C立宪民主党§!/§7致公党§!/§O公民自由联盟§!/§g公车党§!/§0青年党§!）。\n\n二、§O王权§!路线§L§!\n-1.静待§R帝国崩溃§!，北方军入京。\n-2.在事件“§Y鼎革分潮§!”中选择“§Y子弹击穿了黎星刻的胸膛。§!”\n-3.在事件“§Y受命于天§!”中选择“§Y报君黄金台上意，提携玉龙为君死§!”。\n-4.§Y统一中国§!后可以选择不同的内阁阁老（§3千岱芷§!/§Y麟青砚§!/§r乐正绫§!）。\n\n三、§Y袁克定§!路线§L§!\n-1.静待§R帝国崩溃§!，北方军入京。\n-2.在事件“§Y鼎革分潮§!”中选择“§Y子弹击穿了黎星刻的胸膛。§!”\n-3.在事件“§Y受命于天§!”中选择“§Y我们受的是元帅恩，吃的是元帅粮§!”。\n-4.§Y统一中国§!后，根据一阶段国策完成的不同解锁不同的子路线。若完成“§Y提拔中国青年党§!”，则解锁§F东方阿道夫§!路线；若完成“§Y组建新政党§!”，则解锁§C洪宪皇帝§!路线。\n\n四、§R民主-共产§!路线§L§!\n-1.进入§C君主立宪§!路线。\n-2.在征服§R中共§!后，选择释放中共温和派。\n-3.保持§P农工民主党§!支持率为第一位。\n-4.让§P农工民主党§!选举上台，并完成国策“§Y迈向革命§!”。\n\n五、§Q共产君主§!路线§L§!\n-1.进入§O王权§!路线。\n-2.在征服§R中共§!后，选择和§S黍§!谈话。\n-3.二阶段国策选择§S黍§!为新的内阁阁老。\n\n六、§G联合政府§!路线§L§!\n-1.进入§C君主立宪§!路线。\n-2.§Y不要急于统一。§!\n-3.建立§Y统一战线§!，完成§R抗樱战争§!。\n4.触发事件链“§Y西安谈判§!”。\n\n§Y游玩提示§!：\n§L1.多支援§R忠于你§!的派系吧！§!\n\n"

