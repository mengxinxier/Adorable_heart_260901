  CHI_Grand_Marshal: "大元帅"
  Reiruroodo: "铁路人偶"
  Reiruroodo_desc: "§g铁路人偶并非血肉之躯，而是以操作盘为核心、以齿轮与蒸汽导管为筋骨的特殊存在。她们诞生于火车联邦的机车装配车间，最初被设计用于铁路调度与列车驾驶，却往往在服役过程中滋生出远超设计预期的自主意识。\n\n她们的身躯远比人类坚韧，寻常的撞击与轻武器的射击对她们而言不过是擦过装甲板的碎屑。而铁路人偶最引以为傲的技艺，则是对铁路机车的完全掌控。当一具铁路人偶坐进驾驶室，双手握住操纵杆的那一刻，整台机车便如同她肢体的延伸——锅炉的每一丝喘息、连杆的每一下往复、车轮与钢轨之间的每一寸摩擦，都在她的操作盘中化作精密无比的实时演算。在铁路运输任务中，一具人偶驾驶的机车可以拖着远超人类想象极限的载荷，在最恶劣的路况下准时抵达\n\n此外，铁路人偶彼此之间能够产生一种奇特的共鸣。无需线缆，无需信号，只需距离足够接近，便能直接感知到同类的存在与意图。只是这种能力出了火车联邦便近乎失去了用武之地——毕竟，也只有在那片土地上，每一台机车才会拥有一具属于自己的人偶。§!"
  CHI_disgraced_officer: "戴罪立功"
  CHI_disgraced_officer_desc: "该将领是因最近的战事而被特赦起复的，急于立功来证明自己。"
