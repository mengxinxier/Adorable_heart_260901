####新闻###

  China_news.001.title:  "$news_event_background$中原王朝危机"
  China_news.001.desc:  "在一段时间剧烈的政治与经济危机之后，神州帝国——腐朽的巨人被压垮了。\n目前，帝国政府还掌控着帝国的核心地区，帝国的南部则被国民政府掌控，共产党的军队在川渝地区蠢蠢欲动，东北、西北、西南等地则被一众军阀掌握。各个政权争先恐后地宣称着自己对这片大地的合法地位，神州的内战一触即发，而胜者，将决定着这个古老国家未来的命运。"
  China_news.001.a:  "此诚危急存亡之秋也......"
  China_news.001.b:  "将封建势力扫进历史的垃圾桶！"
  China_news.001.c:  "乱世也，机遇也。"
  China_news.001.d:  "神州的内战？有趣......"

  #袁克定政府统一中国
  China_news.002.title:  "$news_event_background$帝国政府统一神州"
  China_news.002.desc:  "尽管神州帝国一度崩溃，但在其所全权任命的救国大元帅袁克定的铁腕手段之下，残存的帝国政府想方设法以高压政策镇压了控制区内的一切异己分子，并将资源集中全都集中于帝国政府手中，最终依靠袁克定所组建的新军平定了绝大部分敢于挑战帝国政府的势力，终结了神州大地上持续了整整数年的混乱状态。\n但在一统神州帝国的过程中，袁克定所展现出的种种暴行受到了世界上绝大部分国家的一致谴责，且在其长年的独揽大权及新军的宣传造势之下，不少人民、官员甚至皇亲国戚都已经“独畏元帅而不知皇帝”。国际观察员们都在屏息注视着神州帝国的下一步变数。"
  China_news.002.a:  "大元帅万岁！帝国万岁！"
  China_news.002.b:  "强权者，因强而权也。"

  #立宪
  China_news.003.title:  "$news_event_background$帝国政府统一神州"
  China_news.003.desc:  "尽管神州帝国一度崩溃，但在其所组建的革新派内阁的努力之下，残存的帝国政府想方设法说服皇帝及一些遗老放弃了部分权力，革除了独裁统治所带来的种种弊病，修订了全新的宪法，最终在民心所向之下将整个神州重新纳入自己的版图之中，终结了神州大地上持续了整整数年的混乱状态。\n在新的宪法体制下，神州皇帝只在一些关键决策上握有实权，而其他权力则仿照圣杯体制赋予了新组建起来的议会。国际观察员们都饶有兴趣地观望着这个昔日帝国的崭新未来。"
  China_news.003.a:  "屋起于土，权出于民。"

  #王权
  China_news.004.title:  "$news_event_background$帝国政府统一神州"
  China_news.004.desc:  "尽管神州帝国一度崩溃，但在其所组建的改良派内阁的努力之下，残存的帝国政府想方设法缓和了帝制的种种弊端及所产生的各种矛盾，在不触及帝制根本的前提下使现有的政府体系焕然一新，最终成功使得帝国政府摆脱了当前的困境，并在重整旗鼓之后再度一统神州，终结了神州大地上持续了整整数年的混乱状态。\n现在的神州帝国虽然名义上依旧是由[CHI.GetLeader]一人专政，但整个帝国都由改良派所精心构建的政府机构所高效运转。神州人民及国际观察员们都对神州帝国的未来充满信心。"
  China_news.004.a:  "想必这就是所谓的开明专制时代。"

  #袁克定称帝
  China_news.005.title: "$news_event_background$袁克定称帝"
  China_news.005.desc: "神州帝国元帅袁克定昨天在北京举行了她的加冕典礼，正式改称中华帝国皇帝。根据中国问题国际权威专家的分析，袁克定似乎早已争取到了帝国军队和官僚的忠诚，前不久还因为镇压了为中国民众所痛恨的一些地方实权派而大大提升了自己的威望，而且之前的帝国并没有改善中国人的困苦生活，所以他们接受了又一名专制君主的统治。但不论何种原因，事实就是这个千疮百孔的国家仍旧在不亦乐乎地进行着各种政治反复。袁克定在其登基大典上宣称，她将带领中国走向富强，“复汉唐之荣光”。最终又会导致什么样的后果，我们拭目以待。"
  China_news.005.a: "中华帝国万岁！"
  China_news.005.b: "中国在崛起"
  China_news.005.c: "世界上又多了一个坏蛋"

  #袁克定摄政
  China_news.006.title: "$news_event_background$袁克定摄政"
  China_news.006.desc: "来自北京的消息传来，神州帝国北方军元帅袁克定已于今天正式被授加九锡、假节钺、剑履上殿的特权。\n据悉，在几周前神州帝国陷入分裂危机后，袁克定就已率军以“安定朝局”的名义进入了北京城，并在一系列内乱与镇压后平息了直隶地区的动乱。袁克定俨然已经成为了神州帝国实际上的掌权者，曾经的皇帝如今也只是她手下的傀儡。\n对此，神州帝国各方各方大多表达出谴责的声音。"
  China_news.006.a: "元帅万岁！"
  China_news.006.b: "打倒列强除军阀"
  China_news.006.c: "反动派狗咬狗"
  China_news.006.d: "北京怎么了？"
  China_news.006.e: "有趣"

  #革新同盟执掌大权
  China_news.007.title: "$news_event_background$革新同盟执掌大权"
  China_news.007.desc: "北京的动荡随天子蒋丽华下诏立宪平息，以黎星刻为代表的革新同盟已登顶帝国的权力中心，并宣称将着手开启改革。\n康佑薇在其做的公开发言中宣称，叛贼袁克定以“安朝政，清国贼”之名招摇进京，意在妄图揽大权以谋私，经多方有志之士的通力协作下已将这场阴谋彻底粉碎。\n不论幼年天子是被迫还是自愿，统治神州数百年的帝制已随那一封诏书而土崩瓦解，以黎星刻为代表的革新同盟是将带领崭新却又残破的神州重回巅峰，还是说这是那老旧王朝的最后一次回光返照？"
  China_news.007.a: "吾试问，天之声，地之唤，民之心！"
  China_news.007.b: "打倒列强除军阀"
  China_news.007.c: "反动派狗咬狗"
  China_news.007.d: "北京怎么了？"
  China_news.007.e: "有趣"

  #帝王亲政
  China_news.008.title: "$news_event_background$帝王亲政"
  China_news.008.desc: "在数周的沉寂后，北京在今日传出了最新消息：袁克定叛党已被打到，皇帝已经重掌大权。\n据悉，袁克定在数周前擅自率军进入京城，被处死了黎星刻与康佑薇等多位大臣与改革派人士，并一度威胁皇位。然而在皇帝与重岳、段祺瑞等忠臣的反击下，顺利打倒了野心家，皇帝重新掌握了政权。\n根据神州帝国官方说法，之后将会举行对被袁逆杀害的烈士的纪念仪式，并对此次行动的功臣加以封赏。\n国际各界则对这名第一次亲政的15岁小天子的能力表现出担忧。"
  China_news.008.a: "陛下有圣君之像啊"
  China_news.008.b: "打倒列强除军阀"
  China_news.008.c: "反动派狗咬狗"
  China_news.008.d: "北京怎么了？"
  China_news.008.e: "有趣"

  #神州革命帝国成立
  China_news.009.title: "$news_event_background$神州革命帝国成立"
  China_news.009.desc: "继粉碎袁克定叛乱后，神州帝国接连击败了东南和西南两地的反抗势力，中国大部分地区重归一统，神州帝国的皇帝——蒋丽华成为了这片大地唯一的掌权者。在全世界尚在重新审视这位年轻的皇帝之时，蒋丽华已经做好了准备，将帝国领向未曾设想的道路。\n\n在完成南方戡乱工作的收尾后，蒋丽华下诏宣布：神州帝国将走向君主社会主义的道路。蒋丽华承诺帝国在未来的建设发展中将会致力于社会公平和经济平等工作，强调国家对教育、医疗和福利等领域的责任。作为表率，蒋丽华下令将大部分皇室所属的私有企业收归国有，并要求各领域逐步开展公有化改革工作。\n\n对于蒋丽华和神州帝国的这一举措，世界各国普遍持保留态度。"
  China_news.009.a: "为了天子，也为了人民"  ##神州
  China_news.009.b: "不彻底的革命，但的确是走向了进步"  ##红色国家
  China_news.009.c: "空想者罢了，只需静待其自毁"  ##蓝色国家
  China_news.009.d: "叛徒！"  ##白色国家
  China_news.009.e: "有什么区别吗？不还是砧板上的肉"  ##棕色国家

  #中国和平统一
  China_news.010.title: "$news_event_background$中国和平统一"
  China_news.010.desc: "随着在西安的和平谈判出乎意料的顺利结束，尽管仍存部分问题亟待解决，但今日，共产党、国民党的领导者代表着其属下各个省区政府，与神州帝国一同团结在政治协商委员会的治下。以期用和平的方式将分裂已久的神州大地重新弥合在一起。更难能可贵的是，原应剑拔弩张的三方均同意用和平且民主的方式决定这个统一国家的未来，东亚有史以来第一个联邦共和国于此刻诞生。并将用宽容与民族自豪感将神州大地上的人民导向更光明的未来。\n纵有四万万殊异之心，若是合众，亦可为一。"
  China_news.010.a: "自由、公正与和平！"
  China_news.010.b: "暂时的胜利"
  China_news.010.c: "自由之风吹拂中国大地"
  China_news.010.d: "她们怎么联合起来的？"
  China_news.010.e: "她们怎么联合起来的？"

  #神州和平革命
  China_news.011.title: "$news_event_background$神州和平革命"
  China_news.011.desc: "在击败西南共产党势力后，神州帝国通过释放、起复共产党的温和派人士稳定了人心，加快完成了对原中共控制区的安抚和规划工作,以周恩莱为首的共产党温和派则大多被神州农工民主党吸纳。\n凭借多年的农民工作和基层实践经验，周恩莱等人很快便成为这个小政党的主心骨，在君主立宪的大趋势下，周恩莱利用自己的政治智慧纵横于神州政治场上，为农工民主党赢下大选立下了汗马功劳。合法赢得政权后，周恩莱等人继续推动着国家的社会主义化改革，并一步步的将这个政党改造为了真正的红色政党，也一步步的将这个国家改造为了革命者的国家。\n今日，周恩莱于北京正式宣布神州革命成功，神州帝国改名为神州社会主义共和国，宣布共和国将继续立足于农工同盟，稳步开展社会主义化改造。同时共和国承诺，给予蒋丽华等原皇室成员共和国公民权，并享受津贴补助直至其本人去世。"
  China_news.011.a: "历经无数曲折，赤旗终是插遍了神州"
  China_news.011.b: "流血的斗争，为她们不流血的变革奠定了基础"
  China_news.011.c: "如果这是她们人民的选择"
  China_news.011.d: "可笑的君主立宪给了赤匪趁虚而入的机会"
  China_news.011.e: "一群肥羊换了只领头羊罢了"

  #农工民主党赢得中国选举
  China_news.012.title: "$news_event_background$农工民主党赢得中国选举"
  China_news.012.desc: "在神州首次宪政选举中，赤羽领导的农工民主党以“保障工人待遇，给予创业优待”及“优化二次分配，提高社会保障”的务实政纲，赢得了广大劳工阶层与城市平民的共鸣。其主张的“发展民族企业”与“亚洲民主先锋”理念，成功勾勒出一幅兼具社会公平与民族自强的发展蓝图。\n\n新内阁宣布，将优先推动《最低工资法》与《全民医疗保障法案》的立法工作，并设立“中小企业创新基金”。赤羽在就职演说中强调：“本届政府，将让改革的春风，首先吹拂到底层民众的身上。”"
  China_news.012.a: "民生多艰，今始纾解。"
  China_news.012.b: "放弃武器的斗争显然是错误的"  ##红色国家
  China_news.012.c: "伟大的进步，伟大的胜利"  ##蓝色国家
  China_news.012.d: "唉，赤匪"  ##白色国家
  China_news.012.e: "社民的中国？有意思"  ##棕色国家

  #立宪民主党赢得中国选举
  China_news.013.title: "$news_event_background$立宪民主党赢得中国选举"
  China_news.013.desc: "作为君主立宪派的旗手与近代宪政的奠基人，黎星刻及其立宪民主党的胜利毫无悬念。该党以成熟的“民主下乡”方案与“完善民主制度”的坚定承诺，获得了期望社会稳定与制度革新的中产阶级、知识分子及地方士绅的广泛支持。\n\n黎星刻首相表示，新政府将立即启动第二阶段宪政改革，核心在于推动“公权共享”，细化中央与地方的权力分配，并强化国会监督职能。皇宫发言人亦表示，陛下乐见一个“更具代表性、更有效率”的政府成立。"
  China_news.013.a: "行宪政，安邦国。"
  China_news.013.b: "希望她们不会背刺我们"
  China_news.013.c: "我们或许有合作的可能"
  China_news.013.d: "我们或许有合作的可能"
  China_news.013.e: "希望她们不会背刺我们"

  #致公党赢得中国选举
  China_news.014.title: "$news_event_background$致公党赢得中国选举"
  China_news.014.desc: "以“扩大省权”与“联省制度”为两大口号的致公党，在党魁钟岚珠的带领下，凭借其深厚的商界背景与灵活务实的主张，成功组建联合政府。该党承诺将营造神州最优良的营商环境，同时确保“扩大经济自主权”，在开放中维护国家利益。\n\n新内阁预计将推出一系列税收优惠法案，并重新评估与圣杯王国等列强的商贸条约。钟岚珠强调：“我们的目标，是让神州的商品与资本，同样能自由地航行于世界之海。”"
  China_news.014.a: "开放兴业，互利共赢。"
  China_news.014.b: "希望她们不会背刺我们"
  China_news.014.c: "我们或许有合作的可能"
  China_news.014.d: "我们或许有合作的可能"
  China_news.014.e: "希望她们不会背刺我们"

  #公民自由联盟赢得中国选举
  China_news.015.title: "$news_event_background$公民自由联盟赢得中国选举"
  China_news.015.desc: "公民自由联盟的胜利，被视为一场“文化现代化”的温和革命。在形象亲和的洛天依带领下，该党聚焦于“弘扬民主思想”与公民权利的保障，其关于文艺创作自由、新闻自由与教育改革的承诺，深深吸引了年轻一代与都市市民。\n\n新政府宣布将启动“国家文化数字工程”，并修订《出版审查条例》。洛天依在虚拟音乐会上发表就职感言：“未来，将由每一个自由表达、充满创造力的个体共同谱写。”"
  China_news.015.a: "让思想自由流动。"
  China_news.015.b: "希望她们不会背刺我们"
  China_news.015.c: "我们或许有合作的可能"
  China_news.015.d: "我们或许有合作的可能"
  China_news.015.e: "希望她们不会背刺我们"

  #公车党赢得中国选举
  China_news.016.title: "$news_event_background$公车党赢得中国选举"
  China_news.016.desc: "在本届历史性大选中，符华女士领导的公车党以“以史为镜”的智慧与“君主制深谙人心”的坚定信念，赢得了国会多数席位，依法组建新内阁。该党纲领根植于神州悠久的政治传统，创造性地提出“天人感应”的现代阐释，主张天意通过民心显现，从而强化民本思想，将君主立宪的合法性建立在国泰民安的切实政绩之上。\n\n新首相符华在文华殿外的就职演说中强调：“政令之出，不在于迎合潮流，而在于顺应天命；而天命之察，必在于体恤民情。本届政府，将力行新儒家学说，以仁政聚民心，以德治兴邦国。”她同时宣布，将设立“皇家仁政奖”以表彰造福地方的良吏，并推动“经典新诠”工程，使传统智慧为现代治理注入灵魂。\n\n观察家认为，公车党的胜利，标志着神州在君主立宪的道路上选择了一条回归自身文化主体性的、稳健的维新之路。"
  China_news.016.a: "王道荡荡，天下为公。"
  China_news.016.b: "希望她们不会背刺我们"
  China_news.016.c: "我们或许有合作的可能"
  China_news.016.d: "我们或许有合作的可能"
  China_news.016.e: "希望她们不会背刺我们"

  #青年党赢得中国选举
  China_news.017.title: "$news_event_background$青年党赢得中国选举"
  China_news.017.desc: "青年党的压倒性胜利，如同一场政治风暴。在充满激情的汉阳造领导下，该党提出的“全面现代化”与“强制国有化外资”等激进纲领，精准捕捉了民众对旧秩序的不满与对强国地位的渴望，席卷了年轻选民群体。\n\n新政府宣布将启动涉及能源、交通、金融等关键领域的国有化计划，并誓言“内除国贼，外抗强权”。汉阳造在万人集会上高呼：“妥协与缓进的時代已经结束！我们将用一代人的时间，完成跨越百年的复兴！”"
  China_news.017.a: "非常之世，行非常之法！"
  China_news.017.b: "可恶的法西斯"
  China_news.017.c: "批着民主外衣的法西斯"
  China_news.017.d: "我们或许有合作的可能"
  China_news.017.e: "我们或许有合作的可能"

  #立宪民主党赢得中国选举（和统线）
  China_news.018.title: "$news_event_background$立宪民主党赢得中国选举"
  China_news.018.desc: "联合政府的成立并不意味着争斗的结束，相反，斗争再次以一种不流血的方式展开了。\n在长期的政治斗争中，立宪民主党靠着与末代皇帝亲近带来的政治人脉，自身温和、容易被各派人士所接纳的政治理念，以及立宪民主党领袖黎星刻的政治威望，一步步的吸纳着力量。团结了绝大多数可以团结的政治盟友，毫无意外的，立宪民主党成为了联合政府选举的最终赢家。"
  China_news.018.a: "所有人都能接受的结果"  ##神州
  China_news.018.b: "放弃武器的斗争显然是错误的"  ##红色国家
  China_news.018.c: "伟大的进步，伟大的胜利"  ##蓝色国家
  China_news.018.d: "皇帝都没了你叫什么立宪民主党？"  ##白色国家
  China_news.018.e: "他们终于掰扯清楚了？"  ##棕色国家


  #公车党赢得中国选举（和统线）
  China_news.019.title: "$news_event_background$公车党赢得中国选举"
  China_news.019.desc: "联合政府的成立并不意味着争斗的结束，相反，斗争再次以一种不流血的方式展开了。\n如果排开阵仗两军对垒，公车党或许是四个竞争者中最弱小的，但若是在朝堂上明枪暗箭，公车党的老师傅们则是个顶个的经验丰富。在自己最熟悉的领域，公车党的老朝臣们彻底拿捏了年轻人们，毫不费力的，他们成为了选举的最后赢家。"
  China_news.019.a: "一切照旧"  ##神州
  China_news.019.b: "放弃武器的斗争显然是错误的"  ##红色国家
  China_news.019.c: "固步自封的老顽固们"  ##蓝色国家
  China_news.019.d: "什么时候把你们的皇上请回来？"  ##白色国家
  China_news.019.e: "他们终于掰扯清楚了？"  ##棕色国家


  #共产党赢得中国选举（和统线）
  China_news.020.title: "$news_event_background$共产党赢得中国选举"
  China_news.020.desc: "联合政府的成立并不意味着争斗的结束，相反，斗争再次以一种不流血的方式展开了。\n中国共产党很年轻，同时也因为自己激进的执政理念完全无法争取到其余三大政党中任意一家的支持。但站在她们身后的，是全中国数量最多、能量最大的工农人民，其余三党也许能够在政场上占得便宜，但只要到了实践工作中，中国共产党便是唯一的强者。人民将中国共产党举了起来，将中国共产党推举为了选举的胜利者，因为人民相信，只有中国共产党是真正想着她们、为了她们的。"
  China_news.020.a: "民心所向，大势所趋"  ##神州
  China_news.020.b: "由最广大民众带来的伟大胜利"  ##红色国家
  China_news.020.c: "她们怎么赢的？"  ##蓝色国家
  China_news.020.d: "打仗打不过，搞政斗怎么也斗不过？"  ##白色国家
  China_news.020.e: "他们终于掰扯清楚了？"  ##棕色国家


  #国民党赢得中国选举（和统线）
  China_news.021.title: "$news_event_background$国民党赢得中国选举"
  China_news.021.desc: "联合政府的成立并不意味着争斗的结束，相反，斗争再次以一种不流血的方式展开了。\n为了最大化取胜的可能，国民党选择了高举三民主义和民主共和的旗帜。她们的固有实力不是最强，她们的民意基础也不是最牢，但她们也有自己的突出优势——与欧洲、美洲各民主国家的密切联系。事实证明，尽管三股势力已经联手击败了樱花侵略者，但欧陆老牌强国的政治影响力对神州政局依旧具备摧毁性的影响力，在各国的支持下，国民党最终赢下了选举的胜利。"
  China_news.021.a: "三民主义，吾党所宗"  ##神州
  China_news.021.b: "她们也具备革命的潜力"  ##红色国家
  China_news.021.c: "民主的又一伟大胜利"  ##蓝色国家
  China_news.021.d: "投机派罢了"  ##白色国家
  China_news.021.e: "他们终于掰扯清楚了？"  ##棕色国家


  #黍成为中国新任内阁首辅
  China_news.022.title: "$news_event_background$黍成为中国新任内阁首辅"
  China_news.022.desc: "收复西南后，神州帝国皇帝蒋丽华下诏释放了大部分革命人士，但这部分“有罪之人”也毫不意外的被贬为庶民，唯二的例外便是神州重臣重岳的两个妹妹年和黍，这两位姐妹被单独召回北京城等待任命。\n在外界普遍猜测这一赦令是缘于重岳元帅请求，给予两姐妹一份闲职之时，蒋丽华却下诏：任命年和黍为皇帝侍读，要求二人陪同自己一起读书、讨论治国之道。而这二人所持之道，毫无疑问便是革命之道。\n在新一任的内阁首辅的选拔上，蒋丽华更是选择了黍这名“前”通共人士。尽管朝廷内部对此颇有微词，但在这位年轻皇帝的文治武功面前，朝臣亦无一人敢言不。"
  China_news.022.a: "陛下必有自己的考量"  ##神州
  China_news.022.b: "共产党人的斗争或许并未结束"  ##红色国家
  China_news.022.c: "奇妙的组合"  ##蓝色国家
  China_news.022.d: "坏了，奸臣上台了"  ##白色国家
  China_news.022.e: "换汤不换药"  ##棕色国家

  #麟青砚成为中国新任内阁首辅
  China_news.023.title: "$news_event_background$麟青砚成为中国新任内阁首辅"
  China_news.023.desc: "重岳首辅功成身退，继任者并非来自传统文官或军阀体系，而是曾任帝国大理寺卿与天师府天师的膝青砚。这位以“提高道教地位”与“法治帝国”为两大支柱的政治家，出人意料又顺理成章地接过了权柄。\n\n在新内阁就职典礼上，膝青砚宣布了她的施政纲领：“道，法也。法，道之器也。” 她主张将道家“无为而治”的哲学与精密的法律体系相结合。其核心政策包括：设立 “天师军官团” 、完善神州法系、统一道士选拔等\n\n评论家认为，这标志着帝国找到了一条独特的、根植于自身传统的现代化路径。"
  China_news.023.a: "道法自然，国祚永昌。"
  China_news.023.b: "希望她们不会背刺我们"
  China_news.023.c: "古老的中国还是止步于民主之前"
  China_news.023.d: "我们或许有合作的可能"
  China_news.023.e: "我们或许有合作的可能"

  #乐正绫成为中国新任内阁首辅
  China_news.024.title: "$news_event_background$乐正绫成为中国新任内阁首辅"
  China_news.024.desc: "随着重岳的隐退，帝国选择了以文化和教育见长的乐正绫作为新一任内阁首辅。这被视为一个明确的信号：在武力统一之后，帝国将进入一个以文化复兴和精神建设为核心的新时代。\n\n乐正绫首辅在就职演说中宣布启动 “第二次新文化运动” ，其核心方针是“阳春白雪，下里巴人”——让高雅与通俗艺术共同繁荣。她承诺将推行：收音机补贴政策、大规模组织公益演出、在“吸纳传统文化”精髓的同时，“学习西方文化”之长，创造属于新时代的神州文艺。\n\n这一刻，整个帝国仿佛迎来了一场心灵的春雨。"
  China_news.024.a: "文以载道，风化天下。"
  China_news.024.b: "希望她们不会背刺我们"
  China_news.024.c: "古老的中国还是止步于民主之前"
  China_news.024.d: "我们或许有合作的可能"
  China_news.024.e: "我们或许有合作的可能"

  #千岱芷成为中国新任内阁首辅
  China_news.025.title: "$news_event_background$千岱芷成为中国新任内阁首辅"
  China_news.025.desc: "重岳归隐，留下的并非是一个和平的真空，而是一个需要强力手腕来巩固的帝国。最终，前皇家内卫统领、以铁血和忠诚著称的千岱芷，出人意料地走向台前，成为新一任内阁首辅。\n\n她的就职演说简短而充满压迫感：“帝国的秩序，高于一切。” 她宣布，新内阁将延续其 “暗影之人” 的风格，但将以更公开、更系统化的方式进行治理：训练忠义之士、上缉贪官，下拿奸佞，目标是建立一个从中央到基层都 “尽然有序” 的强力国家。\n\n此举赢得了渴望稳定秩序的民众支持，但也让自由派人士感到深深的忧虑。"
  China_news.025.a: "乱世用重典，沉疴下猛药。"
  China_news.025.b: "希望她们不会背刺我们"
  China_news.025.c: "古老的中国还是止步于民主之前"
  China_news.025.d: "我们或许有合作的可能"
  China_news.025.e: "我们或许有合作的可能"

  #袁克定复辟帝制
  China_news.026.title: "$news_event_background$袁克定复辟帝制"
  China_news.026.desc: "在神州天子死于紫禁城的兵变之后，袁克定宣布改元洪宪，在一众军士的拥护下于天津登基为帝。尽管朝野上下震动，但此时的神州朝廷已经名存实亡，紫禁城的陷落意味着神州法统亦毁于大火之中。新的国号目前暂定为“中华帝国”。这一富有民族主义色彩的国名似乎隐约暗示着这位华北新的君王的巨大野心"
  China_news.026.a: "用枪杆子立起来的帝国"
  China_news.026.b: "希望她们不会背刺我们"
  China_news.026.c: "自由之风不再吹拂中国大地"
  China_news.026.d: "我们或许有合作的可能"
  China_news.026.e: "我们或许有合作的可能"

  #袁克定成为中国领袖
  China_news.027.title: "$news_event_background$袁克定成为中国领袖"
  China_news.027.desc: "在神州天子意外死于在紫禁城发生的兵谏之后，袁克定通电全国，举国哀悼这位有为天子的早夭。并称蛊惑幼帝倒行逆施祸乱朝纲的维新与保皇派人士应当为皇族血脉的断绝负责。一场极大规模的清洗行动已经可以预见。\n如今皇位空悬，而袁克定无意另立新君，帝国的最高权柄依旧掌握在这位北洋新军的至高统帅手上，只是，已经无人能阻止其独揽大权，其已经成为神州帝国无可争议的领导者。"
  China_news.027.a: "来当一辈子摄政王！"
  China_news.027.b: "可恶的法西斯匪徒"
  China_news.027.c: "可恶的法西斯匪徒"
  China_news.027.d: "我们或许有合作的可能"
  China_news.027.e: "我们或许有合作的可能"

