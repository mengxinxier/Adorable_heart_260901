  CHI_zhonglanzhu_desc_1: "§Y钟岚珠§!\n§Y$CHI_United_Province_Advocate$§!\n  - $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G+10.00%§!\n  - $MODIFIER_GLOBAL_BUILDING_SLOTS_FACTOR$：§G+10.00%§!"
  CHI_zhonglanzhu_Diplomacy_desc: "§Y钟岚珠§!\n@CHI§Y[FROM.Getname]§!的§C首相§!\n\n§Y$CHI_United_Province_Advocate$§!\n  - $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G+10.00%§!\n  - $MODIFIER_GLOBAL_BUILDING_SLOTS_FACTOR$：§G+10.00%§!"
  CHI_zhonglanzhu_desc: "§Y派系§!：$ZhiGong_name$\n§Y生平§!：§L钟岚珠出生于南洋侨领世家，自幼在槟城、新加坡与上海之间辗转成长，十九岁执掌家族远东业务时便展现出卓越的商业手腕。1923年她在伦敦经济学院进修期间，亲历了英格兰地方自治运动，由此萌生出“联省自治”的政商构想。归国后她以沪上侨商联合会为平台，创造性地提出“航道经济学”理论，主张通过跨省航运联盟实现区域经济一体化，1927年促成的“闽粤糖盐互贸协定”成为联省自治的首个成功案例。\n\n当袁克定强化中央集权时，她公开在《申报》发表《现代行省论》，以火车联邦制为蓝本，论证地方财政自主与国防中央化的兼容性。1932年她联合江浙闽粤四省商会组建“东南互保商盟”，以侨资为担保发行区域流通券，使参与各省在北平金融动荡中免受冲击。1935年国府推行统制经济时期，她巧妙利用圣杯王国在华势力，促成租界当局与东南三省签订《关税分成暂行条例》，这项被北方斥为“割据”的协议，实则为联省自治奠定了财税基础。\n\n这位总是摇着檀香折扇的南洋名媛，珍珠手包里既装着各省物产价目表，也藏着手绘的联邦制宪法草案。当她在香港半岛酒店与怡和洋行董事共进下午茶时，绾发用的永远是一支闽南漆器发簪——正如她常说的那句谚语：“千帆过尽皆生意，百川归海自成邦。”§!"

