  CHI_hanyang_desc: "§Y派系§!：$Youth_name$\n§Y生平§!：§L汉阳造出生于湖北工业世家，其祖父曾参与张之洞创办的汉阳铁厂建设。1921年她从柏林工业大学学成归国时，婉拒了多家外国企业的邀约，毅然回到濒临倒闭的汉阳兵工厂任总工程师。面对德系装备的技术壁垒，她带领工人们用三年时间完成步枪生产线的全面改造，实现枪管钢材的国产化突破，使得改良后的“二四式”步枪成本降低百分之四十。1926年直系军阀试图强行接管兵工厂时，她组织工人护厂队昼夜巡逻，并巧妙利用英日商社之间的矛盾保全了生产线完整。\n\n1931年长江汛期期间，她创造性地将火炮防潮技术转用于堤坝加固，在汉口江段成功试用水泥桩防洪法。当袁克定推行军事标准化时，她以“统一规格须符国情”为由，顶着压力保留江南兵工厂的特殊生产线，为日后国产武器研发留下火种。1934年她主持编纂的《军械制造规范》被朝廷采纳为全国标准，其中迫击炮座钣工艺领先日本同期水平。这位袖口永远沾着机油的女工程师，在验收新机床时仍保持着用湖北乡音诵读《天工开物》的习惯——正如她常对学徒说的那句：“德意志的机械配上华夏的匠心，才是真正的自强之道。”§!"

  CHI_liehaiwang_desc_1: "§Y烈永周§!\n§Y烈海王§!\n  - $MODIFIER_ARMY_ORG_FACTOR$：§G+10.00%§!\n  - $MODIFIER_ATTRITION_FACTOR$：§G-10.00%§!"
  CHI_liehaiwang_Diplomacy_desc: "§Y烈永周§!\n@CHI§Y[FROM.Getname]§!的§C首相§!\n\n§Y烈海王§!\n  - $MODIFIER_ARMY_ORG_FACTOR$：§G+10.00%§!\n  - $MODIFIER_ATTRITION_FACTOR$：§G-10.00%§!"

