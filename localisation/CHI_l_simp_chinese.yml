  CHI_Yue_zhengling: "乐正绫"
  CHI_Yue_zhengling_desc: "§Y派系§!：$Honour_Emperor_name$\n§Y生平§!：§L乐正绫出生于广州的买办家族，自幼在岭南画派大师居廉指导下习画，十四岁创作的《荔枝红遍越秀山》便入选巴拿马万国博览会。1921年她负笈英伦，在剑桥修习艺术史期间深受布鲁姆斯伯里文化圈影响，归国时特意绕道印度考察佛教壁画，这段经历使她立下“融汇古今，贯通东西”的艺术理想。1928年在上海美专任教期间，她首创“社会写生课”，带领学生深入码头工厂，将吴昌硕的金石笔法与码头工人的劳动姿态相结合，创作出《黄浦江畔》系列组画。\n\n1932年她发起“新国乐运动”，组织音乐家采编江南丝竹与北方梆子，改编的《茉莉花变奏曲》首次采用西洋管弦乐配器，在南京国民会堂演出时引发轰动。当袁克定推行文化统制政策时，她巧妙周旋于租界文化圈，通过举办公益画展为地下文艺团体筹措经费。1935年长江洪灾期间，她组织“艺术赈灾团”乘船巡回演出，甲板上演唱的《渔光曲》与舱内展示的徐悲鸿奔马图相映成趣，这种“阳春白雪与下里巴人同行”的做法开创了文艺救灾的新范式。\n\n这位总是随身带着徽墨与素描簿的艺术家，在苏州河畔写生时发梢沾着颜料的模样，与在国际沙龙侃侃而谈时的优雅姿态同样令人难忘。当她在琉璃厂旧书店寻觅《芥子园画谱》时，手提箱里装着刚完成的抽象派油画稿——两种艺术血脉始终在她身上流淌交融。§!"
