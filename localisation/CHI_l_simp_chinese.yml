  CHI_Yuan_Keding: "袁克定"
  CHI_Yuan_Keding_desc: "§Y派系§!：$North_Army_name$\n§Y生平§!：§L袁克定作为北洋军阀领袖袁世凯的嫡女，自幼浸淫于权谋与军旅之间。在1918年其父于北伐途中猝然病逝后，她以非凡魄力收拢溃军，在哈尔滨危局中稳住阵脚，带着残存的中央军精锐南撤。面对分崩离析的北方政局，她迅速逼迫朝廷授予帝国军总司令之职，将父亲旧部与各地督军逐一收编，建立起以自己为核心的北方军体系。1920年她亲赴湖广接管剿匪事务，以铁腕手段将湘江赤党根据地连根拔起，却因不愿损耗实力而放任残部西窜入川，此举既展现了她的军事才能，也暴露了保存实力的军阀本性。\n\n在接下来的十五年里，她以直隶为根基，通过联姻、收买、威慑等手段将长城内外诸省逐步纳入掌控。当1931年大饥荒席卷北方时，她竟借机以“军需”为名划设粮区，纵兵劫掠河北余粮，同时冷眼旁观朝廷赈济无力导致的民变。1933年宣宗驾崩后，她利用摄政楚王年迈无能之机，逐步架空内阁，通过掌控军机处与漕运命脉，成为实际上的帝国主宰。至1936年元旦，这位身着德式军装、腰佩勃朗宁手枪的女帅已完全掌控北中国七省之地，其麾下二十万北方军装备德系火炮、配有装甲列车，成为神州大地最强大的军事力量。§!"
