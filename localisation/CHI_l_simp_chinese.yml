  CHI_army_reform_decision: "军队改革"
  CHI_army_reform_decision_desc: "腐败、能力低下和懦弱的问题存在于我们的每一层军官之中。解决这个问题将耗费相当长的时间。"
  CHI_army_reform_decision_MH: "军队改革"
  CHI_army_reform_decision_MH_desc: "腐败、能力低下和懦弱的问题存在于我们的每一层军官之中。解决这个问题将耗费相当长的时间。"
  CHI_army_reform_decision_ing: "正在军队改革中......"
  CHI_Alleviate_administrative_pressure: "缓解行政压力"
  CHI_issue_edict: "颁布诏书"
  CHI_issue_edict_desc: "天子之位，代天授命，以正四方。 在内战四起、军阀割据的危局之下，我们必须颁布诏书，重申皇权的至高无上与中央的绝对权威。此举旨在稳定朝堂人心，统一各省军民思想，并以天子的名义，号召天下忠诚之士，共讨叛逆。"
  CHI_Imperial_examination_reform: "科举改革"
  CHI_Imperial_examination_reform_desc: "祖宗之法不可轻改，但天下大势已非昨日。 传统的科举制度所选拔的官吏，已无法应对现代战争、魔导科技及复杂的国际局势。我们必须改革科举，引入新学和军事人才，选拔出忠于朝廷、且能承担起富国强兵重任的新一代精英。"
  CHI_reopen_parliament: "重开国会"
  CHI_reopen_parliament_desc: "朝野上下，议论已久，民心浮动，难安其志。 革命党人利用“共和”思想蛊惑民心，动摇了天子的权威。尽管此举将牺牲部分皇权，但重开国会能够争取到部分开明士绅和资本家的支持，拓宽天子的政治基础，以“君主立宪”的旗帜，对抗赤匪和革命军的威胁。"
  completed_CHI_reopen_parliament: "完成§O天命改革决议§!：§Y重开国会§!"
  CHI_feudal_foreign_domain: "晋封外藩"
  CHI_feudal_foreign_domain_desc: "汉唐旧制，威服四夷，乃天朝上国之本。 利用神州帝国深厚的文化底蕴和天子所代表的权威，重建古老而有效的外藩朝贡体系。通过将周边小国和部落封为藩属，不仅能彰显帝国的天命，还能在战略上获得资源和缓冲区域，以减轻我方在内战中的压力。"
  CHI_feudal_foreign_domain_tt1: "解锁外交行动§Y要求朝贡§!，允许我们要求其他国家成为我们的§C帝国朝贡国§!"
  CHI_feudal_foreign_domain_tt2: "解锁外交行动§Y晋封外藩§!，允许我们花费天命将§C帝国朝贡国§!转化为§G帝国外藩国§!"
  CHI_Internalization_of_outer_domain: "外藩内化"
  CHI_Internalization_of_outer_domain_desc: "藩属外臣，终非我土；唯有内化，方能永固。 仅凭朝贡关系难以保障边疆稳定。是时候将那些仅仅向我们称臣的“外藩国”转化为帝国的“藩王国”。通过更深入的经济、行政和军事整合，将这些区域纳入中央的实际管辖，建立一个强大而不可分割的神州帝国。"
  CHI_Internalization_of_outer_domain_tt: "解锁外交行动§Y外藩内化§!，允许我们花费天命将§G帝国外藩国§!转化为§O藩王国§!"

