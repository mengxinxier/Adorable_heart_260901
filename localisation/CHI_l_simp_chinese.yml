####派对####
  CHI_communism_party: "§R[已查禁]§!"
  CHI_communism_party_long: "§R[已查禁]§!中国共产党及其他左翼团体"
  CHI_democratic_party: "革新同盟"
  CHI_democratic_party_long: "§C革新同盟§!\n§W--------------------------------§!\n§L自北方军军阀集团凭借其强大的武力南下入关，以“武力统一”、“恢复秩序”为名，实际掌控了中央政权后，帝国原有的政治力量深感失望与恐惧。原本在议会和舆论界尚有空间活动的公车党和立宪民主党首当其冲，遭到排挤和打压。共同的生存危机和未竟的政治理想促使这两个在方法和激进程度上有所差异的党派摒弃前嫌，秘密联合，成立了“革新联盟”，旨在汇聚所有反对北方军独裁的力量，通过政治斗争乃至最终的武力反抗，推翻军事独裁，建立一个真正立宪、民主、革新的新神州。§!"
  CHI_fascism_party: "军队极端派系"
  CHI_neutrality_party: "帝国摄政议会"

  Innovation_Alliance_party: "革新同盟"
  Innovation_Alliance_party_long: "§C革新同盟§!\n§W--------------------------------§!\n§L自北方军军阀集团凭借其强大的武力南下入关，以“武力统一”、“恢复秩序”为名，实际掌控了中央政权后，帝国原有的政治力量深感失望与恐惧。原本在议会和舆论界尚有空间活动的公车党和立宪民主党首当其冲，遭到排挤和打压。共同的生存危机和未竟的政治理想促使这两个在方法和激进程度上有所差异的党派摒弃前嫌，秘密联合，成立了“革新联盟”，旨在汇聚所有反对北方军独裁的力量，通过政治斗争乃至最终的武力反抗，推翻军事独裁，建立一个真正立宪、民主、革新的新神州。§!"
  CHI_CCP_long: "§R中国共产党§!\n§W--------------------------------§!\n§L旧神州帝国的逝去并未带来新的曙光，取而代之的是军阀混战、列强宰割、经济凋敝和社会矛盾的极端尖锐化。国民党建立的南方政府虽高举民族主义和共和旗帜，但其改革的不彻底性和对底层民众的忽视，让一部分革命者感到失望。因而有一批深受马克思主义和共产主义运动影响的左翼知识分子、城市工人运动领袖和部分对国民党感到幻灭的左派成员联合起来组建了中国共产党。他们坚信必须通过一场彻底的无产阶级革命，才能最终扫除封建主义、帝国主义和官僚资本主义这三座大山，建立一个真正平等、公正的新中国。§!"
  CHI_KMT_long: "§3中国国民党§!\n§W--------------------------------§!\n§L神州帝国在内外交困中轰然崩塌，皇权陨落，中央权威瓦解，各地军阀割据，国家陷入空前分裂与混乱。一片废墟之中，一批深受近代民族主义与共和思想影响的革命者、知识分子和前帝国开明派官员，坚信必须建立一个统一、独立、民主的现代民族国家来拯救神州。他们汇聚于南方沿海地区，以早年存在的各种秘密革命团体为基础，以三民主义为指导思想，联合其他反帝制、谋求革新的派系，正式组建了“中国国民党”。§!"

  CHI_PWDP_party: "农工民主党"
  CHI_PWDP_party_long: "§P农工民主党§!\n§W--------------------------------§!\n§L农工民主党的主要成员主要来自自耕农、产业工人、进步学生等社会基层群体，其前身为旧神洲帝国的一些半合法农会、工会组织，在神州帝国宣布改革后因其贴近底层群众的政治主张迅速壮大。相比起共产党，农工民主党人更加温和，主张在遵循民主宪政的原则下向社会主义理想推进。虽然政治主张更加温和，但是农工民主党仍然摆脱不了左翼党派内部派系林立的问题。只不过相对来说，路线斗争的激烈程度更低。§!"
  CHI_PWDP_Radicals_party: "农工党-激进派"
  CHI_PWDP_Radicals_party_long: "§R农工民主党-激进派§!\n§W--------------------------------§!\n§L农工党内的激进派由部分温和派的前中共党员和党内激进派组成。§!"
  CHI_Cadets_party: "立宪民主党"
  CHI_Cadets_party_long: "$Cadets_name$\n§W--------------------------------§!\n§L立宪民主党最初由支持改革的旧官僚创建，后来随着党员的增多，民主支持者占据了部分党派的主导地位。他们主张在保护民族文化和资产，维持宪政的同时推动自由主义发展，最终将神州塑造成亚洲的民主灯塔。§!"
  CHI_ZhiGong_party: "致公党"
  CHI_ZhiGong_party_long: "$ZhiGong_name$\n§W--------------------------------§!\n§L“强省弱央，因地制宜”。致公党人的政治光谱难以简单地用左右划分，他们主张一种更具地域性和实用性的政策，即把中央权力更多地下发到地方。他们相信，每个省份都有其独特的优势和问题，比起中央统一调配，由省级单位自决自裁更具优势，也更加高效。这样的政治主张让他们吸引到了不少地方官员和企业家的支持。§!"
  CHI_CLU_party: "公民自由联盟"
  CHI_CLU_party_long: "$CLU_name$\n§W--------------------------------§!\n§L公民自由联盟的成员认为，神州想要走向现代化，来自自由世界的资本和民主思想必不可少，但保留神州本身的文化传承同样重要。比起所谓的民主灯塔，公民自由联盟的成员更多将神州和民族的伟大复兴视为己任，致力于将神州打造成一个真正的现代化国家。§!"
  CHI_GongChe_party: "公车党"
  CHI_GongChe_party_long: "$GongChe_name$\n§W--------------------------------§!\n§L公车党主要由传统的士绅阶级和怀念古代神州荣光的保守派组成，他们主张“复古维新”，强调自上而下式的民本思想，致力于将传承千年的君主制延续下去的同时，在不改变根本的情况下改造神州的思想根基和统治哲学，把神州帝国变为一个强大的现代化帝国。§!"
  CHI_Youth_party: "青年党"
  CHI_Youth_party_long: "$Youth_name$\n§W--------------------------------§!\n§L青年党人总是态度激进，他们认为革新是拯救神州和民族的唯一道路。他们主张民族主义和国家统制经济，希望建立高度集权的国家控制，强调进步和民族自豪感。对于外国文化和意识形态上的入侵，青年党人总是持有反对态度，他们梦想着神州摆脱一切束缚，实现民族、文化、政治、经济、军事等各方面的完全独立和强大，建立独属于神州的民族神话。§!"
  CHI_Honour_Emperor_party: "尊王派"
  CHI_Honour_Emperor_party_long: "$Honour_Emperor_name$\n§W--------------------------------§!\n§L由皇室宗亲和传统贵族领头的一股政治力量，维护皇权的神圣与至高是他们的核心信条。在他们眼里，皇权就是整个神州能够保持基本存在的柱石，任何与皇帝作对的组织都将被他们视为眼中钉。毫无疑问，他们的理想是中兴神州，再造乾坤，为此不惜让整个帝国付出任何牺牲。虽然民间早已不堪其苦，反声不断，但他们手里那落后但庞大的政治和军事力量仍是他们最大的依仗。§!"
  CHI_Imperial_Constitutional_Assembly_party: "帝国宪政会"
  CHI_Imperial_Constitutional_Assembly_party_long: "$Honour_Emperor_name$\n§W--------------------------------§!\n§L由旧尊王派的主要成员改组而来，虽然他们仍然坚持皇权至上的思想，但多少接受了一些“先进思想”比如促成宪政。帝国宪政会主张“护国体而行新政”，希望在尽可能维持神州传统的情况下拯救垂危的帝国。§!"
  CHI_PNSL_party: "保皇救国同盟"
  CHI_PNSL_party_long: "$Honour_Emperor_name$\n§W--------------------------------§!\n§L自袁克定率领其北方军控制了帝国中枢以来，皇室被逐渐架空，国家权力被袁克定一人独揽。仍然忠于神州帝国正统、信奉传统秩序与价值观的皇族成员、旧官僚、贵族等选择联合起来，成立了保皇救国同盟，梦想恢复皇帝的合法权力，驱逐北方军阀，挽救濒临倒台的帝国。§!"
  CHI_South_Army_party: "南方军"
  CHI_South_Army_party_long: "$CHI_South_Army_party$\n§W--------------------------------§!\n§L为抵御北方军的可能南下吞并，保护本地区利益，并实践自身不同于北方的政治理念，南方三大地区的军政首脑通过缔结了军事同盟，民间俗称“南方军”，他们公开打出“进步”的旗号，与北方的“保守”和“专制”分庭抗礼。§!"
  CHI_Progressive_Party: "进步党"
  CHI_Progressive_Party_long: "$CHI_Progressive_Party$\n§W--------------------------------§!\n§L袁克定宣布决定组建新政党后，由南方军改组而来的进步党的进步党显然更受进步青年欢迎。他们主张实业兴国和推进现代化，并在不断整合原本松散的内部力量。由于掌握着南方诸省庞大的税源和人口，虽然由北方军改组而来的统一党仍将他们视为眼中钉肉中刺，但遇事也需向他们退让几分。§!"
  CHI_North_Army_party: "北方军"
  CHI_North_Army_party_long: "$CHI_North_Army_party$\n§W--------------------------------§!\n§L北方军起源于旧神州帝国的新军体系。随着帝国中央不断衰弱，北方的袁氏家族开始大力扩充和现代化这支军队，并将其打造为只听命于袁家的私人武装。袁克定凭借其手腕和军中根基，开始逐渐接管军队和并整合军队中的不同派系，最终形成了袁克定对北方军基本的领导地位。§!"
  CHI_United_Party: "统一党"
  CHI_United_Party_long: "$CHI_United_Party$\n§W--------------------------------§!\n§L面对南方“进步党”的成立及其在意识形态和法统上的挑战，袁克定很早意识到，单纯依靠军事高压和旧式官僚体系难以有效应对新思想浪潮的侵袭，也注定无法获得国内外的长期认可。于是他开始将自己麾下的北方军逐步进行政党化改组，最终形成如今的统一党。这支政治力量仍然大幅度保留军阀时期的领袖依赖和专制，仍然以自己强大的军事力量作为立足根本，但至少变得更加“现代化”一点。§!"
  CHI_United_Youth_Party: "统一党-青年党"
  CHI_United_Youth_Party_long: "§5统一党-青年党§!\n§W--------------------------------§!\n§L随着袁克定的野心愈发膨胀，他掌控的统一党与在野的青年党达成了合作，引入了一种来自欧洲的新思想。这种思想主张国家至上、领袖至上，并将本民族视为全世界最优秀的民族，大力发扬极端民族主义，并将其称为“神州民族的理想”。在强力国家机器的掌控中，在伟大元首的指导下，神州似乎真的在从一个陈旧的落后帝国向着现代化强国迈进。联合政党的两方以及支持他们的人民心中已然有了高高耸立的领袖崇拜。虽然青年党中也有一些人看到了隐藏在这股强大力量背后的危险，但是这台高速运行中的战车已经彻底没有了停下的可能，要么狂飙到腐烂，要么突进到那无人可以预测的未来。§!"
  CHI_federation_party: "联邦临时政府"
  CHI_PCC_party: "政协会议"
  CHI_PCC_party_long: "政治协商会议\n§W--------------------------------§!\n§L§!"
  CHI_GXC_zhigong_party: "致公党（两广支部）"
  CHI_GXC_zhigong_party_loing: "$ZhiGong_name$\n§W--------------------------------§!\n§L“强省弱央，因地制宜”。致公党人的政治光谱难以简单地用左右划分，他们主张一种更具地域性和实用性的政策，即把中央权力更多地下发到地方。他们相信，每个省份都有其独特的优势和问题，比起中央统一调配，由省级单位自决自裁更具优势，也更加高效。这样的政治主张让他们吸引到了不少地方官员和企业家的支持。§!"

