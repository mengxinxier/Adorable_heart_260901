 ######### 新国策 #########
  ######### 第一阶段假国策 #######
  CHI_focus_New_year: "永和三年"
  CHI_focus_New_year_desc: "天子登基已有数年，然天灾人祸、内忧外患仍是从未停息。古老的传承与革新的思想前所未有地撕裂着帝国，数不胜数的派系团体明争暗斗要为自己捞取最多的油水。在天数有变神器更易之前，一系列的改革与维稳必须落实。永和三年，冰融春来，似乎预示着饱受苦难的国度也将春暖花开"
  CHI_focus_stabilise_dynasty_pilitics: "稳定朝政"
  CHI_focus_stabilise_dynasty_pilitics_desc: "楚王既薨，各方势力间原本微妙的平衡便被瞬间打破。当务之急便是稳定朝政，恩拢人心，威震宵小。朝局如战局，远交近攻、暗度陈仓、借力打力......唯有在纷乱的朝局中左突右击，方能博得喘息之机，将摇摇欲坠的朝政重新稳定下来。"
  CHI_focus_centralized_state_power: "中央集权"
  CHI_focus_centralized_state_power_desc: "如果没有足够的实力支撑，再多的阴谋诡计也都不过是水中月镜中花。为了更好地执行天子的意志，必须将各方权力逐步收归中央。是时候潜龙脱困，吟啸九天了"
  CHI_focus_Recovery_Governor_area: "收回总督区"
  CHI_focus_Recovery_Governor_area_desc: "长久以来，总督区一直与中央保持着微妙的关系。他们既有合作与臣服，但更多的是阴谋与算计。这些与中央离心离德的总督区必须被重新收归中央，朝与天子，许尔述职。不朝，六师移之"
  CHI_focus_remove_traitor: "消灭叛党"
  CHI_focus_remove_traitor_desc: "朝廷天威所到之处，众皆臣服，忠于北京的总督辖区已将军政大权奉还，但还有数群顽固分子妄图与中央对抗，这些叛党必须被彻底剿除。尤其对于盘踞在四川一带的赤匪，帝国军百万之众岂有不胜之理？王师一出，定能为帝国数十年来的动乱画上句号。"
  CHI_focus_Stabilizing_Borderland: "稳定边境"
  CHI_focus_Stabilizing_Borderland_desc: "神州大地业已安定，帝国恢复了对核心领土的控制，如今正当乘势收服西北、西南，稳固边关、保境护民，将威胁帝国统治的外部敌人拒于国门之外，告慰绍熙先帝之灵。"
  CHI_focus_eco_build: "主持经济建设"
  CHI_focus_eco_build_desc: "帝国那帮腐朽的官吏实在难堪重用，朝廷从西洋诸国争来救荒救民的粮食居然都被盘剥殆尽，神州大地在天灾人祸的蹂躏下正在滑入深渊，和这样一群虫豸在一起怎么能治理好国家呢？朝廷必须出手主持帝国的经济建设，把资源收回中央重新分配，稳定经济状况已经刻不容缓。"
  CHI_focus_modernization_reform: "现代化改革"
  CHI_focus_modernization_reform_desc: "腐朽落后的污血在神州瘀堵糜烂的身体里形成肿瘤，天子决心拿起手术刀将其尽数剜除，改革阵痛远比帝国崩塌易于承受。"
  CHI_focus_attract_foreign_investment: "吸引外资"
  CHI_focus_attract_foreign_investment_desc: "神州本土已无力承担大规模经济建设所需开支，好在我们与西方诸国尤其是圣杯的关系十分密切，她们也觊觎神州市场许久，有消息称大批跨国资本正在寻求新的落脚点，机遇近在眼前。"
  CHI_focus_Celestial_Empire_IR: "天朝工业革命"
  CHI_focus_Celestial_Empire_IR_desc: "在外国资本大力投入下，无数工厂、铁路在神州的土地上生长起来，工业蓬勃发展，市场欣欣向荣，崭新的流水产线吐出成箱廉价商品，昼夜不停的电报打来海外新增订单，帝国逐渐摆脱灾荒影响，天朝迎来了自己的黄金时代。"
  CHI_focus_preside_mili_reform: "主持军事改革"
  CHI_focus_preside_mili_reform_desc: "帝国军权自北伐失败后几乎为袁克定一人掌握，朝廷手中仅剩数支参差不齐的卫戍部队，帝国军乃本朝立国之本，虎符必须回到天子手中。"
  CHI_focus_study_west_tech: "学习西方科技"
  CHI_focus_study_west_tech_desc: "西方诸国武备发展远胜神州，获取一些较为先进的装备进行仿制虽然困难，但对于我们跟上世界军事科技发展进程大有裨益。"
  CHI_focus_modernization_army: "现代化军队制度"
  CHI_focus_modernization_army_desc: "帝国军队编制之混乱、体制之僵化足以让每一个西洋军士顾问瞠目结舌，旧时的军队打不赢现代的战争，大树仍需新鲜强韧的根茎才能生长挺立。"
  CHI_prestige_far_and_wide: "王师威仪远扬"
  CHI_prestige_far_and_wide_desc: "帝国中央军的青年兵士训练有素、整装待发，天子之剑磨砺一新，王师所到之处民众竭诚欢迎，神州内外皆为新军威仪惊慑叹服。"
  CHI_focus_Golden_age_Yonghe: "永和盛世"
  CHI_focus_Golden_age_Yonghe_desc: "我神州帝国自西元1865年改元建制，已历四世，天子蒋丽华克承大统以来，励精图治、一统华夏、内外皆定，神州万民皆得安居乐业、天朝荣光复照亚洲诸国。帝国终得以跻身列强，使世界今又得见汉唐气象，实乃“永和盛世”。"
  ########## 真 政治线 ########
  CHI_focus_yuan_into_capital: "袁军进京"
  CHI_focus_yuan_into_capital_desc: "各位将士，天子如今受奸臣蒙蔽，称我等为素有反心，欲杀我等而后快。我等别无他法，唯有追随袁将军进京讨逆，诛尽奸党叛逆，还天下朗朗乾坤！先入城者，有功者，袁公重重有赏！"
  ####### 袁神线 ###### 
  CHI_focus_new_regent: "新摄政王"
  CHI_focus_new_regent_desc: "主少国疑，大厦将倾之时，幸得我神州之忠臣，王师之统帅袁克定将军入京勤王，安朝内外之人心，慑环伺之群狼。然今朝倾邦离，势不可复挽，唯有赋予袁公权柄，方能解国家混乱之局......罔论皇室与否，袁公当为摄政王也！"
  CHI_focus_aggressive_industrialisation: "强硬工业化"
  CHI_focus_aggressive_industrialisation_desc: "昔日神州帝国的工业化进程在军队扩张与农业问题的压迫下举步维艰。这一局面当然要归咎于帝国朝廷乃至国会的议而不决，莫衷一是。如今袁公掌政，自然要为新的经济发展计划扫清障碍。并且，要让其势不可挡。"
  CHI_focus_Ministry_of_Economic: "经济部"
  CHI_focus_Ministry_of_Economic_desc: "先皇们很早的将改革的目光放在政治层面上，但至此便停滞不前，在国会内的庸碌之辈相互攻讦之际，堂堂北京朝廷居然依旧没能实现政府部门的现代化！让我们效仿彼岸的樱花政权，建立起一个现代化的帝国政府——就从经济部门开始。"
  CHI_focus_Hiring_international_students: "任用留学生"
  CHI_focus_Hiring_international_students_desc: "在改革时期曾经有大量公费留学生远渡重洋学习现代化的经济、政治制度，但维新的戛然而止和朝廷官员的僵化让这些才华横溢的留学生无官可做，在她们心灰意冷地离开翰林之前，应当拉拢她们为袁公即将推行的一系列政治、经济改革思虑筹划。"
  CHI_focus_public_private_partnership: "政企合作"
  CHI_focus_public_private_partnership_desc: "京畿地区存在着大批的本土企业家以及其所拥有的民办企业，与其出钱如力地发展帝国工业，不如与这些企业家结为合作关系，毕竟，如今皇室的脸面已不值一提，皇都的繁荣才是要紧之事。"
  CHI_focus_Big_QingSuan: "大清算"
  CHI_focus_Big_QingSuan_desc: "先皇驾崩之时，立宪派、清流党皆欲趁乱牟利，以图一步登天，然今袁公秉旄仗钺，军政要务皆出此门，这些帝国之奸贼怎可容忍其继续在国会里跳脚？连王师都不怕，这已经不是一般的谏臣了，必须出重拳！"
  CHI_focus_promote_YCP: "提拔中国青年党"
  CHI_focus_promote_YCP_desc: "中国青年党本是由夹在两派中间，不敢妄言国事的年轻一代议员成立的小党，但如今，袁公愿意支持这些同僚们在国会里对抗两派的影响里——当然，代表的自然是摄政王的利益。"
  CHI_focus_form_new_party: "组建新政党"
  CHI_focus_form_new_party_desc: "要想控制国会，拉一派打一派的做法且不说效果如何，失控的风险很高，得到的回报却又有限，以被我们抬进国会的中国青年党为基础，我们可以强行在国会组建一个绝对的第一大党——对掌握着枪杆子的摄政王来说，此事易如反掌。"
  CHI_focus_Control_propaganda_machine: "掌握宣传机器"
  CHI_focus_Control_propaganda_machine_desc: "摄政王很早便对新政府的喉舌机关表现过很大重视，如今礼部的腐儒们不为民间大众输出正确的价值观，反而固守陈腐不堪的忠君思想。有必要撤换她们——当然，袁公的意思是，让她们和她们的礼部一起见鬼去吧。"
  CHI_focus_control_TianZi_command_ZhuHou: "挟天子以令诸侯"
  CHI_focus_control_TianZi_command_ZhuHou_desc: "至先皇崩起，天下豪杰并起，诸州纷乱，北有张逆兽乱趁乱起势，南有军头共匪扰乱天下，此危急存亡之时，然天子年幼不可理政，又有康黎罪首图谋神器，非常之时当应非常之理，而今袁氏忠臣之后提兵北守，护天子威仪，保神州法统，此时正当顺天应人，邀仲姓子佑神州河山。"
  CHI_focus_dissolve_parliament: "解散国会"
  CHI_focus_dissolve_parliament_desc: "如今之局，袁公总览朝政，自然当激浊扬清，开我朝廷清明之局，考虑到最大的国贼就蜗居在这帝国议会之内，解散国会乃为肃清当下政治乱局、遏制激进议案乱行之必要举措。既然国会纷争不断，议事难决，那么解散便可重定国会架构，速成契合国情之宪法，以正朝纲、明法度，巩固中央权威，保地方之安宁。"
  CHI_focus_Replace_Army_officer: "军官大换血"
  CHI_focus_Replace_Army_officer_desc: "维新派的部分出身军旅之人曾建议幼帝改革原有的帝国军队，这是袁公无法接受的事情，毕竟对于一支军队而言，政治上的忠诚要远远比所谓的战术素养来的重要。所幸现在已是袁公当权，改革将会继续，而改革的成果将牢牢掌握在北洋一系的手中。"
  CHI_focus_Himitsu_Keisatsu: "秘密警察"
  CHI_focus_Himitsu_Keisatsu_desc: "为了袁公的大业向前更进一步，有必要临时组建一批秘密的警察部门。负责内务倒是其次，如果按照常规手段，不知袁氏何时，以何能代之？故摄政王大人决计另辟蹊径，而要想成此大事，我们便需要一支绝对忠诚的情报队伍..."
  CHI_focus_regent_bigger_than_emperor: "王命不出蒋"
  CHI_focus_regent_bigger_than_emperor_desc: "如今唯一需要担心的，便是幼帝本人，其本身在朝中仍具有不容小觑的势力，更糟的是，她早已怀疑袁公另有打算，正欲殊死一搏，好在，我们已经知道了这个情况，如今只需掩其耳目，秘不声张，保皇一派自有按捺不住的时候..."
  CHI_focus_Fire_of_Forbidden_City: "戡乱之时"
  CHI_focus_Fire_of_Forbidden_City_desc: "帝国叛贼已有所行动！并且，皇帝本人，也正处于政变阴云之中，富贵之事，今朝已全在诸公之手！这份荣光，袁公绝不独享。此非叛乱！乃是戡乱！作乱之人，正为帝也！"
   #第二段 #####
  CHI_focus_Adolf_of_Eastern: "东方阿道夫"
  CHI_focus_Adolf_of_Eastern_desc: "如今君主新丧，国家不稳，在商讨另立新君之前，我等皆需奉袁氏为尊，袁公实乃朝中柱石，朝中之事，皆需咨袁，而后示下！年幼无知的皇帝不能，也已无法再领导神州乃至整个东亚大陆的民族解放事业了，唯有集北洋一系之力，富国强兵，共克时艰。"
  CHI_focus_Youth_army_of_Yuan: "袁克定青年军"
  CHI_focus_Youth_army_of_Yuan_desc: "要将军队的忠诚与战斗力一齐提升，北洋军便需要一支真正的，实现了对个人绝对忠诚的新式军队用以示下。好在，一支新的将军亲卫已经组建完毕，她们将被冠以大将之名，成为帝国真正的嫡系军队。"
  CHI_focus_army_first: "军队为先"
  CHI_focus_army_first_desc: "如今国家昏乱，九洲倾覆，继续在政治领域进行无聊的过家家式变革是无用的，帝国当以军队的利益为先，先军政治势在必行。"
  CHI_focus_Chinese_nationalism: "中华民族主义"
  CHI_focus_Chinese_nationalism_desc: "若要光复全国，则需效仿南方的革命党人，为帝国军队乃至神州人民一个新的精神纽带，最好的工具便是民族主义。袁公治下的新政府无意继续强调伪朝对立天命当归，神州想要的，是真正团结起来的，一支军队，一个民族，一个国家。"
  CHI_focus_chinese_sphere_of_influence: "中华势力范围"
  CHI_focus_chinese_sphere_of_influence_desc: "与旧沙俄帝国一样，神州帝国也需要在周边建立一条政治上的安全带——相比于旧有的朝贡体系，这些位于帝国军事实力投射之下的附属国应当在更大程度上服从来自北京政府的调遣。"
  CHI_focus_rehabilitate_DiWang: "平反帝王"
  CHI_focus_rehabilitate_DiWang_desc: "旧日腐儒为限制君权，凡天子欲展宏图，施以政令者，便舞文弄墨，冠以暴君之名，致使后之天子束手，国政纷乱。今日吾皇登基，必扫除此等乱命。从今往后，我国当重修史书，复旧秦皇汉武等威名，破邪显正，以明天威。"
  CHI_focus_Fourth_empire: "第四帝国论"
  CHI_focus_Fourth_empire_desc: "我今日之神州帝国继自旧日之法统，却又一扫旧日之积弊，焕发新生。西方有德意志所建之第三帝国，清扫旧德帝之积弊，使德民族一雪前耻。今我元帅当效其法度，自先秦汉，唐宋，元明诸帝国之后，效法尧舜。再兴中华之威严，重建中华之第四帝国，重夺旧日荣光，恢弘志士之气。"
  CHI_focus_YuanKeDing_manseee: "元帅的恩情"
  CHI_focus_YuanKeDing_manseee_desc: "你若三冬来，换我一身雪白~想--吃--河--南--菜~袁大元帅就是我们的太阳！要是连萝莉大元帅都没法相信的话，瓦塔西！"

  CHI_focus_New_Mandate_of_heaven: "新天命"
  CHI_focus_New_Mandate_of_heaven_desc: "今废帝伏诛，皇党束手，朝中也早已噤声，如今正是我等同心戮力，助袁公匡扶社稷之时！天命有变，神器更易，而归有德之人，摄政本就威加四海，今有戡乱之功，当受百官劝进，建立大统！"
  CHI_focus_build_FaTong: "建立法统"
  CHI_focus_build_FaTong_desc: "神州帝国已衰微之极，无需恋旧，当弃之如敝屣。袁氏既登大位，当赦于天下，修前朝之史，以张新帝九五之尊！"
  CHI_focus_Zhou_Li: "复周礼"
  CHI_focus_Zhou_Li_desc: "旧日神州最为人诟病的一点便是在政治上的改革实在是走的太远，以至于礼崩乐坏，朝臣不侍立两旁，反而于国会内交口谤讪，争锋相对。如今新帝即位，更应拨乱反正，尊孔复古，以彰新朝之清明。"
  CHI_focus_centralise_TianXia_military: "收拢天下兵马"
  CHI_focus_centralise_TianXia_military_desc: "陛下不仅是皇帝，更是天下兵马大元帅，自然要收拢中央王师，统一操练指挥，毕竟，说一千道一万，枪杆子才是硬道理..."
  CHI_focus_centralisation: "中央集权"
  CHI_focus_centralisation_desc: "旧朝因主少国疑，放权现象极为严重，君不知京畿以外三十里之大事，可见君权孱弱之极！袁氏既代天命，自当重建皇朝权威，以重建九州咸服，万国来朝之气象。从今往后，帝国之事，皆决于一人而已！"
  CHI_focus_emulate_Juncker: "效仿容克"
  CHI_focus_emulate_Juncker_desc: "自新朝建立以来，我们已经对一批首义之臣加官进爵，但对于更多的底层军士以及官员，我们也当论功行赏。时至今日，我们当效法西方旧德册封容克之例，授予他们定难功臣之名，予以他们土地封赏，如他们愿更有作为，我们也将授予他们在工厂实业等方面一定特权，让他们在地方有所作为，报答天子之恩。"
  CHI_focus_Military_assessment_of_noblemen: "勋贵军事考核"
  CHI_focus_Military_assessment_of_noblemen_desc: "参与这场戡乱的新朝勋贵们为数不少，她们大多现以在军中担任要职，却多有玩忽职守之误，虽不可像前朝旧帝擅自杀伐，但仍需另作考核，筛选出真正可堪大用的军事将领。"
  CHI_focus_TaiShan_FengShan: "泰山封禅"
  CHI_focus_TaiShan_FengShan_desc: "皇天在上，后土在下。袁公既承天命，统御万邦。今登泰山之巅，当行封禅大典。四海升平，百姓安乐，此皆赖天地之佑、祖宗之德。更是仗新帝天威，修明武备，移师南疆，万民归伏。凭此功绩，天命在我，既寿永昌！"

  ######### 皇权线 #########
  CHI_focus_Imperial_comeback: "皇权归来"
  CHI_focus_Imperial_comeback_desc: "国贼袁克定已经伏诛！神州帝国真正的主人，解桎的龙已然回到了她的皇座，年轻的天子再无了肘胁之患，将第一次完全按照自己的意志将神州大地导向她所期望的未来"
  CHI_focus_Commemorating_Martyrs: "纪念烈士"
  CHI_focus_Commemorating_Martyrs_desc: "黎星刻，康佑薇，还有一个个其他为复兴这个国家而没入尘土的名字，袁贼已诛，但逝去的人已经回不来了，天子决定亲自主持对这些英烈的祭奠，以慰亡魂"
  CHI_focus_legacy_of_Westernization: "重拾洋务遗产"
  CHI_focus_legacy_of_Westernization_desc: "在过去向列强的学习中，我们曾引进西方的技术，建立起崭新的工厂，随着五国之乱的到来，这一切戛然而止，而如今，我们将重拾洋务运动的遗产"
  CHI_focus_build_new_IC: "兴办新厂"
  CHI_focus_build_new_IC_desc: "神州必须拥有自己的企业，自己的工业，天子的命令已经发出，我们将在神州中央政府能控制的地区兴办全新的工厂"
  CHI_focus_Nationalization_foreign_capital: "国有化外资"
  CHI_focus_Nationalization_foreign_capital_desc: "随着黑色星期五的到来，西方列强已无暇东顾，天子已经决定，神州帝国中央政府将没收一切西方侵略者在五国之乱之后在神州建立起来的企业，这些财富本身就是属于神州的"
  CHI_focus_infrastructure_expand: "基建扩张"
  CHI_focus_infrastructure_expand_desc: "铁路，公路乃是现代工业的血管，也是帝国组织防线的经络，为了实现天子的夙愿，扩张基建是无可避免的一步"
  CHI_focus_expand_raliways: "扩建铁路"
  CHI_focus_expand_raliways_desc: "我们的资金是有限的，我们需要把有限的资金运用在铁路扩建上——铁路才是与新的时代，新的技术相适应的交通工具，借由逐渐铺开的铁网，我们将为工业泵入新血，帝国的军队将沿着铁路镇守四境，移不臣，扶良善"
  CHI_focus_concentrate_road: "专注道路"
  CHI_focus_concentrate_road_desc: "帝国不能把她无数子民抛之脑后，普通的道路仍是大多数子民所赖以生存的基石，我们有限的资金需要专注在道路的扩张之中"
  CHI_focus_stop_reform: "改革暂停"
  CHI_focus_stop_reform_desc: "随着这一场大乱与改革派领袖人物的离世，我们不得不暂停正在进行的改革，现在不是讨论改革的时间了，眼下的第一任务是紧紧地团结在天子的身边，让神州帝国渡过眼前的危机"
  CHI_focus_reopen_parliament: "重开国会"
  CHI_focus_reopen_parliament_desc: "帝国议会因为一系列的事件和连续的动荡已经终止了一段时间的活动，当下为了稳定动荡不安的局势以及平衡帝国内阁各派的利益，也为了天子的意志得以贯彻，天子决定重开国会，提供一个商议国事的地方，也告诉天下人，新任天子不是一个独断专行的昏君——但是，天子将取得最终决策权，元气大伤的神州没有时间等待国会内部漫长的扯皮了"
  CHI_focus_reward_merit: "论功行赏"
  CHI_focus_reward_merit_desc: "忠诚应当受到奖赏，天子能重回大位，朝中诸位重臣功不可没，在国会已经重开，神州帝国帝逐渐走向平稳的当下，是时候根据在平定袁贼过程中的功劳给予诸位大臣和每一个英勇作战的战士应有的奖赏了"
  CHI_focus_stabilise_region: "安定地方"
  CHI_focus_stabilise_region_desc: "连续的动乱使得中央政府几乎失去了对神州各地的控制，就连仅剩的控制区也基本丧失了治理能力，现在我们需要先派出新的官员接管我们控制区域下的各处机构，并派遣军队消灭那些趁机四处作乱的叛匪"
  CHI_focus_crack_down_rebels: "严打乱党"
  CHI_focus_crack_down_rebels_desc: "袁氏乱党，赤匪，革命党人，这些乱党一次又一次的破坏着帝国的稳定，为了帝国明面上的统一，我们曾一次又一次的容忍她们的行为，但在这一次大乱之后，痛定思痛的天子决意，不能让这些人再肆无忌惮的破坏下去了，要扫除这些阻碍！"
  CHI_focus_restructuring_North_Army: "重组北方军"
  CHI_focus_restructuring_North_Army_desc: "北方军在袁贼伏诛之后已经重新归于帝国控制之下，但是北方军队内部仍有袁贼余孽，必须重组北方军，将其完全置于天子的控制之下，帝国经不起再一次的反叛了"
  CHI_focus_LaoGai: "劳动改造"
  CHI_focus_LaoGai_desc: "让那些叛党去劳动改造，以彰显天子的宽仁"
  CHI_focus_public_execution: "公开处决"
  CHI_focus_public_execution_desc: "对这些叛党不能有任何的仁慈，将他们弃市，以儆效尤，方能彰显天子威严"
  CHI_focus_Reorganise_local_armies: "改编地方军队"
  CHI_focus_Reorganise_local_armies_desc: "北方军的叛乱是前车之鉴，这种士兵只听从军事长官，而不知家国、天子为何物的组织形式不能再持续下去了，我们将改组各地军队，将所有武力置于天子控制之下"
  CHI_focus_appoint_new_officers: "任命新军官"
  CHI_focus_appoint_new_officers_desc: "旧军队的军官贪腐成性，喝兵血，吃空饷，暴虐不仁，疏于训练，让这些废物统领帝国的军队只会再现又一场大败，我们将从基层提拔出一批新的，忠于天子的军官作为未来新军的骨干"
  CHI_focus_Improving_soldiers_treatment: "改善士兵待遇"
  CHI_focus_Improving_soldiers_treatment_desc: "旧时代军队战力低下最重要的原因之一就是士兵的待遇地下——饿着肚子怎么能打好仗呢，天子正欲大有作为，怎可不铸一只利剑？我们必须提高底层士兵的待遇，让她们明白自己在为怎样一名圣明天子而战"
  CHI_focus_restore_old_country: "收拾旧山河"
  CHI_focus_restore_old_country_desc: "自维新之殇以来，神州山河破碎，风雨飘摇，各省几只知督抚，不知天子，赤匪祸乱，辛亥乱党，袁贼忤逆，神州大地屡受乱匪之扰，现今朝政稍安，我们终于有机会，兴王师，伐不臣，收拾这片破碎之山河"
  CHI_focus_ChaoTianQue: "朝天阙"
  CHI_focus_ChaoTianQue_desc: "诸逆毙，四海一，九州四方归一统，山河重聚，天下初安，诏令天下，朝觐天子，以论神州之未来"
    ##### 第二段 #########
  CHI_focus_Shu: "黍"
  CHI_focus_Shu_desc: "出乎所有人的意料，天子选择了来自曾经赤色乱匪的内阁学士，黍，作为她的内阁首辅，这位学士的经历和她的理念对朝中大部分官员来说是是难以理解，无法理喻的，但陛下既已决定，她的意志即为陛下之意志，朝臣们只需接受，并老老实实地按照新首辅的安排去完成工作即可"
  CHI_focus_Promoting_land_reform: "推动土地改革"
  CHI_focus_Promoting_land_reform_desc: "黍首辅刚走马上任，提出的第一项重要政策便是重启她曾经为赤匪效力时推行的土地改革政策，主张耕者有其田，誓要让天下的农民能够摆脱乡绅地主的奴役，激进的政策很快激起了地主阶级的抵抗，但陛下以强硬的手段镇压了抗议者，强行将这一政策推行了下去"
  CHI_focus_Acquisition_significant_capital: "收购重要资本"
  CHI_focus_Acquisition_significant_capital_desc: "黍首辅与天子商议之后得出结论，欲使帝国长治久安，国祚绵延，必先将那些重要的产业置于帝国中央政府控制之下，于是收购重要资本的行动马上开始，对那些涉及军事，民生保障等的基础产业展开收购——如果拒绝的话，就是没收了"
  CHI_focus_Improve_political_review: "完善政审制度"
  CHI_focus_Improve_political_review_desc: "政治上的可靠决定这个人是否可以被重用，虽然有点残酷，但对于现在的帝国来说，能力不是第一要素，忠诚才是！完善我们目前的政审制度迫在眉睫。"
  CHI_focus_Empire_of_Revorution: "革命帝国"
  CHI_focus_Empire_of_Revorution_desc: "尽管早有预料，但诏令颁发的那一刻还是有人认为天子疯了，一个脓肿腐朽的旧帝国居然会主动拥抱变革。说出这句话的人一定不了解我们的民族，让高高在上的官僚地主放弃自己的地位固然困难，但儒教那狂热的信仰，逼迫他们不能站在在家国大义的对立面，天子的诏令让大义站在我们这一边，再加上前期的改革让我们拥有了广泛的支持，没有人会在这一刻高举大旗宣告不臣！"
  CHI_focus_Establishment_Revolutionary_Guard: "建立革命卫队"
  CHI_focus_Establishment_Revolutionary_Guard_desc: "革命的果实虽已绽放，但它仍需荆棘的捍卫，让她不会黯然凋零。组建卫队，让那些地主老财们知道，这个国家究竟谁说了算！"
  CHI_focus_Output_Revolution: "输出革命"
  CHI_focus_Output_Revolution_desc: "穷则独善其身，达则兼济天下，帝国现在已经彻底清理了身上的疮痍，但举目望去，这个世界的压迫还在，那些贪婪傲慢的虫子仍在人民身上吸血，帝国绝不允许他们的存在，哪怕用刀剑，也要告诉他们，时代变了！"
  CHI_focus_Protecting_producers: "保护生产者"
  CHI_focus_Protecting_producers_desc: "每一个生产者都是可敬的，他们创造出的一米一线都是为了帝国更好的存续，保护他们，将他们高高举起，他们就是帝国勋章上最亮丽的那一抹色彩！"
  CHI_focus_Union_of_Agricultural_Workers: "农工联盟"
  CHI_focus_Union_of_Agricultural_Workers_desc: "不可否认的是，现在的帝国按照马克思主义阶级理论来说，绝大多数人民属于农工阶级，他们是帝国的分母，将作为分子的知识分子和精英贵族们高高举起，以前的帝国可能会漠视他们，但现在的帝国不会这么做，他们，将会天子手上最珍贵的货币！"

  CHI_focus_Leizi: "麟青砚"
  CHI_focus_Leizi_desc: "麟青砚大学士作为天师府的天师，她的入仕令人浮想联翩，有朝臣认为这代表天子可能陷入神鬼的迷信当中，对此痛心疾首，也有朝臣认为，麟青砚作为天师时的疾恶如仇正是天子目前所需要的，她的上位可能代表天子会来一场大清洗，总而言之，从今开始，所有朝臣见到她，都得恭恭敬敬的叫声首辅大人！"
  CHI_focus_Raise_status_of_Taoism: "提高道教地位"
  CHI_focus_Raise_status_of_Taoism_desc: "道教作为帝国本土宗教，提升它的地位有助于加强帝国平民对帝国的认同，同时也避免西方宗教色彩的入侵，当初帝国西方边区发生的政变仍然在目。同时道教自身的特性注定他们不可能大规模干涉政局，因此对于帝国来说，提高它的地位有益无害。"
  CHI_focus_TianShi_Army_officer: "天师军官"
  CHI_focus_TianShi_Army_officer_desc: "天师，这一带着神秘色彩的职业，经过麟首辅的以身作则，让世人对其充满的正面印象，同时，天师府内部对天师的培训，让他们的服从意识高，对于目前的军队来说，已经算是良好的军官资源了，经麟首辅提议，天子准许。诏令天下天师，入伍从军！"
  CHI_focus_rebuild_DaLiSi: "重建大理寺"
  CHI_focus_rebuild_DaLiSi_desc: "大理寺作为帝国的司法部门，在以前的乱政中早已崩塌，如今，麟首辅提出重建大理寺，用法家学说重振帝国，尽管有朝臣反对，但在天子的默认下，大理寺，这个违法乱纪者的梦魇，涅槃归来！"
  CHI_focus_improve_ShenZhou_Laws_system: "完善神州法系"
  CHI_focus_improve_ShenZhou_Laws_system_desc: "依法治国的前提是有法可依，遗憾的是，因为以前对法家的排挤打压，导致目前帝国的法治人才凋零，但困难阻挡不住法家弟子的热情，他们以可怕的精力与首辅的支持，在大朝会上提出构建神州帝国特色法治体系的设想，尽管礼部官员一直高喊秦法再世！但他们的反对犹如螳臂挡车，毫无作用。"
  CHI_focus_rule_of_law_Empire: "法治帝国"
  CHI_focus_rule_of_law_Empire_desc: "在所有人的努力下，帝国做到了有法可依、有法必依、执法必严、违法必究。这四项法治原则深刻贯彻到每一个帝国公民的内心，或许现在的帝国仍存在些许不足，但每一个人都相信，帝国，会再度屹立于世界文明之林当中！"
  CHI_focus_Promote_GongFa: "推广功法"
  CHI_focus_Promote_GongFa_desc: "天师府的功法能大幅提升人体素质上限，尽管有一些限制要求，但帝国四万万人民总能出现这种天才，在全国推广功法，让我们见识一下，现在的天骄们！"
  CHI_focus_selection_Taoist_priests: "统一道士选拔"
  CHI_focus_selection_Taoist_priests_desc: "在以前，道士的选拔标准不一，各个道观都有自己的标准，自从麟首辅上台以后，就十分重视道士的选拔标准，在她看来，不要求道士像她一般优秀，起码要比常人优秀，否则当什么道士，再加上道士们在道法符纂的加持下，破环力远超常人，大好年华不为帝国效力那你是不是对帝国不满？在天子威仪的加持下，所有的道观都同意了举行统一道士选拔。"

  CHI_focus_YueZheng_Ling: "乐正绫"
  CHI_focus_YueZheng_Ling_desc: "这是反对最大的一次首辅任命，朝臣们对天子的命令表现出难以捉摸的愤怒，在他们看来，首辅是麟青砚这位威名远扬的天师算是上乘；千岱芷这条忠于天子的狗勉强认可；实在不行那逆贼黍也有治理经验，什么叫首辅是一位戏子？这把朝臣们置于何处！哪怕乐正家在帝国有几分名声，但这也不是戏子治国的理由，所以朝臣坚决反对，有朝臣甚至想进行死谏，但天子意已决，朝臣只能恭敬表示吾皇万岁！"
  CHI_focus_Absorb_traditional_culture: "吸纳传统文化"
  CHI_focus_Absorb_traditional_culture_desc: "在冷眼中，我们的乐正首辅第一时间提出保护发扬传统文化，已拉拢反对最为激烈的老学究们，在补助和声名的加持下，这些平时对乐正首辅不屑的老东西直接宣布成立御绫军对一切反对乐正首辅的朝臣重拳出击。让人谈笑之余也不由感叹这位戏子首辅的政治手段。"
  CHI_focus_Learn_West_Culture: "学习西方文化"
  CHI_focus_Learn_West_Culture_desc: "乐正首辅从不避讳她对西方文化的称赞，在她看来，对西方文化可以取其精华，去其糟粕，将它们当中有益的部分用来充实帝国，这也是她对于西方文化的态度，实用主义者乐正首辅又借此机会得到那些留学归来的科学家的拥护，毕竟在外多年，这些科学家已经带着西方文化色彩了。"
  CHI_focus_second_New_Culture_Movement: "第二次新文化运动"
  CHI_focus_second_New_Culture_Movement_desc: "新文化运动对帝国造成的影响不亚于公车上书，如今，乐正首辅在朝会上提出进行第二次新文化运动的号召，尽管反对者甚众，但眼光毒辣的朝臣早已发现，乐正首辅在民间那庞大的粉丝群体，帮助她击碎所有的阻挡，民意大于天，在帝国这句话可不是开玩笑的。"
  CHI_focus_radio_subsidy: "收音机补贴"
  CHI_focus_radio_subsidy_desc: "让更多的人了解帝国制度，倾听天子玉音，在这一口号的要求下，乐正首辅要求内阁拿出可行方案，对收音机购买发放补贴，考虑到这一方案对政治稳定的影响，基本上没什么反对就通过了。也有人发现，。这位首辅的地位，越来越稳固了。"
  CHI_focus_Organise_charity_performances: "组织军队歌舞团"
  CHI_focus_Organise_charity_performances_desc: "乐正首辅在视察军队的时候提出建设军队自己的歌舞团，她希望歌舞能给军队带来额外的士气，野心家认为这是她插手军队的手段，支持者则认为这充分说明了乐正首辅对军队士兵的人文关怀，真相是什么已经不重要了，组建歌舞团势在必行！"
  CHI_focus_YangChunBaiXue_XiaLiBaRen: "阳春白雪，下里巴人"
  CHI_focus_YangChunBaiXue_XiaLiBaRen_desc: "在文艺界一直有讨论艺术究竟为了什么存在，有人认为艺术是高雅的，它存在的意义是抚慰国家精英的心灵；也有人认为艺术是亲和的，老百姓在农忙时的山歌、幼童口中的顺口溜、力工挖矿的击打声，它们都是艺术。在乐正首辅看来，帝国既需要高雅的艺术，也需要亲和的艺术，阳春白雪、下里巴人，各有各的路要走。"
  CHI_focus_Spring_of_Literature_Art: "文艺春天"
  CHI_focus_Spring_of_Literature_Art_desc: "这位被世人称为戏子首辅的乐正绫，以自己那朴素的政治思维和顶级的亲和力，开启了属于帝国文艺界的春天，她在文化的建设无疑是里程碑的存在。但是，在枪与火纷纷扰扰的世界上，这场文艺春天，帝国真的需要嘛？"

  CHI_focus_Qian_DaiZhi: "千岱芷"
  CHI_focus_Qian_DaiZhi_desc: "不出所料，天子将首辅之位托付给自己的内卫千岱芷，这位天子的班底可能政治能力不足，但那极端的忠诚恰好弥补了这一缺陷，所有人都明白，千岱芷的上位，代表着那位一直稳居钓鱼台的天子，亲自出手了！"
  CHI_focus_Loli_Behind_the_shadows: "暗影之人"
  CHI_focus_Loli_Behind_the_shadows_desc: "吾乃天子之影，躬耕于黑暗，服侍于光明，喜君之喜，忧君之忧。在冠冕的见证下，千家世代为蒋家赴汤蹈火！这是千家历代新统领的宣誓词，她们是这个王朝统治者最坚韧的棋子，如果说世间万物都是天子的棋子，那千家就是这盘棋局的支点！"
  CHI_focus_training_ZhongYi: "训练忠义之士"
  CHI_focus_training_ZhongYi_desc: "那场惊变是千岱芷这辈子也无法释怀的噩梦，所幸天子无碍，但千岱芷绝不允许千家护君的荣誉在自己手里染上污点，因此这位首辅上位第一件事就是训练一批忠诚天子的军队，这不由让人议论，但千岱芷并不在乎。"
  CHI_focus_wield_sword_for_you: "为君执刀"
  CHI_focus_wield_sword_for_you_desc: "首辅是天子的狗，这句话一直在京城流传，千岱芷倒是没有生气，但天子不能接受陪伴自己最忠诚的内卫被这样侮辱。但天子的动作很快就停下来了，据传千岱芷首辅当时刚好解决一些密谋分子，她风尘仆仆带着刀来到天子身前，然后跪着说了一声，汪！"
  CHI_focus_elite_YuLin_army: "精英御林军"
  CHI_focus_elite_YuLin_army_desc: "御林军作为拱卫天子的军队，他们的战场表现配不上天子的圣恩情重，因此千岱芷不顾朝臣的反对，强行通过了关于组建精英御林军的预算，不少朝臣却只能在家痛骂这条疯狗，却不敢在明面上有丝毫动作。"
  CHI_focus_SJTG_XNJN: "上缉贪官，下拿奸佞"
  CHI_focus_SJTG_XNJN_desc: "秘密警察，算是千岱芷首辅执政的一大特色，先前的皇城惊变让这位忠诚的内卫对所有人都抱有警惕，她宁愿相信人民在恐惧之中说出的真相，也不愿意相信所谓的忠诚之士，哪怕她自己就是那一条忠犬。"
  CHI_focus_Empire_orderly: "帝国，井然有序"
  CHI_focus_Empire_orderly_desc: "所有人都在歌颂天子的伟大，所有人都在痛骂逆贼的叛乱，仿佛那些为民请命都是虚假的，人们现在见面第一句就是天子万安，因为谁也不知道，那位天子的忠犬和她的眷属们，是否在偷听。我们并不知道这是否就是天子的意愿，但作为帝国的一份子，为天子献出一切这是应该做的！嘘，小点声同志，帝国，井然有序！"


  ########## 民主线 #########
  CHI_focus_democracy_HanGeKi: "民主的反击"
  CHI_focus_democracy_HanGeKi_desc: "虽然政府在袁氏乱党的攻势下几近崩溃，但帝国议会中的衮衮诸公在关键时刻达成了共识，组织起关键的力量阻挡了袁氏的攻势，并将其完全消灭，陛下也因此乱象得到迅速平定而下定决心，推进立宪民主。我等将乘陛下之大恩，全面推动民主化进程，不负黎先生与陛下之所托。"
  CHI_focus_economic_recovery_plan: "制定经济恢复计划"
  CHI_focus_economic_recovery_plan_desc: "长期的分裂使得神州各地之间分治已久，我们虽名为一个统一国度，实则各地经济发展各行其是，混乱不堪。因此，必须从现在开始制定各地的经济恢复计划，收拾各地残局。"
  CHI_focus_Attracting_foreign_investment: "吸引外资"
  CHI_focus_Attracting_foreign_investment_desc: "天下丧乱，正需用钱，我国国库却贫瘠不堪，难以长期支撑。但好在我国土地广袤，资源丰富，不少外国资本都想进入我国市场，但它们因为变乱的时局望而却步。如今政局已稳，我们可以给他们一定的政策便利，吸引他们的资本进入国内投资，带动市场建设。"
  CHI_focus_Appointed_entrepreneur: "委任新兴企业家"
  CHI_focus_Appointed_entrepreneur_desc: "资本唯有用的好才有用。旧的贵族地主们目光短浅，对外界事物认识不足，反而我国国内一批锐意进取的企业家们在市场上打拼许久，更加具备竞争的眼光。我们有必要从官方层面鼓励并支持一批有识之士，支持他们的企业发展，鼓励他们与外国人开展竞争，若有可能，我们也可以拉拢他们参与国政，咨以经济重任。"
  CHI_focus_Appointed_nobmen: "委任贵族与地主"
  CHI_focus_Appointed_nobmen_desc: "在天子当国之时，不少地方的开明地主和贵族参与国事，有所成就，但他们却被袁贼排挤，无从晋身，且他们老成持重，较年轻人更不容易受洋人的骗。今日国之当变，我们应当拉拢他们进入帝国议会，予以他们议事之权，进一步推动我国发展。"
  CHI_focus_Abolition_silver_standard: "废除银本位"
  CHI_focus_Abolition_silver_standard_desc: "我中华长期执行银本位，以银为中华锚定货币。但实际上，中华产银甚少，外国人甚至依仗掌握白银而威胁我国经济命脉，值经济危机期间，外国以银价变化掠夺我国财富，重创我国金融市场。有介于此，我们应当废除银本位，重建货币制度，此举会使我国经济遭遇一定创伤，但只要闯过去，我们便可实现更大的经济自主。"
  CHI_focus_Agricultural_Relief: "农业救济"
  CHI_focus_Agricultural_Relief_desc: "中华大地常年遭遇天灾威胁，大旱大涝以及瘟疫横行所带来的百姓流离失所直接造成人心丧乱，国家分裂。要想保证国家稳定，我们必须有更稳定的农业来源，我们会给予地方一定的农业补助，让农业发展有所兜底，保证农民至少有一口饭吃。"
  CHI_focus_Drafting_provisional_constitution: "拟定临时约法"
  CHI_focus_Drafting_provisional_constitution_desc: "袁氏逆贼虽已灭亡，但谁能肯定不会出现第二个袁氏？袁氏先前之所以做大，便是利用政治之漏洞，趁国难当头攫取大权为己用。我们得堵上这个漏洞，在与天子商讨之后，我们将共同制定一部临时约法，避免下一个权奸出现"
  CHI_focus_Return_power_to_Congress: "权力回归国会"
  CHI_focus_Return_power_to_Congress_desc: "中华之未来在于民主，但中华之现在还需陛下之帮扶。在约法通过之后，陛下手中的大权也将正式移交国会，从此往后，中华之未来当在国会之万民，而非一人之心。"
  CHI_focus_people_important_than_monarch: "民贵君轻"
  CHI_focus_people_important_than_monarch_desc: "破山中贼易，破心中贼难。即使天子已将权力交予国会，但在社会上很多人仍认为吾等只不过是新的封建宰相。我们没法一次性让整个社会都改变想法，但我们可以徐徐图之，先推动民贵君轻等思想回归社会，待时机成熟，再宣传民主之事。"
  CHI_focus_Depoliticisation_of_military: "军队去政治化"
  CHI_focus_Depoliticisation_of_military_desc: "解决袁氏之乱的关键，就是要推动军队去政治化。国会将正式立法，确立军队去政治化的法条。如袁氏一般挟军自重的情况必须被彻底阻止，我们将彻底分离军队与政治，保证军队只忠于国家，而不是作为家仆忠于他们的长官。"
  CHI_focus_Training_XinJun: "训练新军"
  CHI_focus_Training_XinJun_desc: "乱世需用重典，国家动乱之际，如无一支统一强大的力量拱卫中央安全，但凡再出一个袁氏逆贼，还会有众多志士丧生于刀兵之下。要保卫民主，我们不能光靠嘴，还需要培养一支强有力的武装，训练一支强有力的新军，排除旧军队的影响。"
  CHI_focus_Strict_military_discipline: "严肃军纪"
  CHI_focus_Strict_military_discipline_desc: "自外夷入侵开始，我国军队的乱像便暴露无余，上至军官，下至士兵，站无站相，坐无坐相，军纪法度更是无从谈起，致使对内对外连吃败仗。要重整军容，我们就必须肃正军纪，恢复军队应有的法度，排出那些军队中的毒脓"
  CHI_focus_Remove_Big_Tiger: "革除“大老虎”"
  CHI_focus_Remove_Big_Tiger_desc: "我国军队的第二项问题在于严重的贪腐。旧时军队中能有五成以上的空编都已经是谢天谢地，装备和人员上的腐败更是触目惊心，我们辛辛苦苦挣来的钱大半进了这帮腐败军官的口袋。经查，他们甚至还在袁氏作乱期间作壁上观，我们会给他们最后的机会，要么赶紧走人，要么被我们抓进监狱彻底完蛋。"
  CHI_focus_upgrade_New_Officer: "提拔新军官"
  CHI_focus_upgrade_New_Officer_desc: "天下变乱，帝国之军必须有新气象，我国军队不乏能征善战，思想活跃之人，但他们在过往的军事体制下没法得到应有的晋升，如不能归附袁氏等权贵，就不得不卸甲归田。我们要纠正这个错误，更改我们的军队晋升体制，提拔新锐的优秀军官，给予他们应有的地位和奖励。"
  CHI_focus_Appointment_Old_Nobmen: "委任旧贵族"
  CHI_focus_Appointment_Old_Nobmen_desc: "虽然袁氏乱党甚是可恶，但我们必须考虑到的是，很多新军官的实战经验严重不足，而当今时局之下，帝国国防压力仍未好转，大张旗鼓的军事改革很可能降低帝国军队的战斗力，我们最好还是以稳定为重，让温和、持重的旧贵族管理新军。"
  CHI_focus_Publicity_democracy: "宣扬民主思想"
  CHI_focus_Publicity_democracy_desc: "光靠高层宣传民主可不够，我们还需要将民主之思想传遍全国，当前神州陆沉，国民离心，我们也需要一种新的思想来凝聚四方民众之所愿，共匪以革命，国党以三民，我等则以民主与统一，构建中华未来的思想基石。"
  CHI_focus_Preparing_national_election: "准备全国大选"
  CHI_focus_Preparing_national_election_desc: "经过漫长的努力，中华终于重归统一，民主也在这一过程中被中华社会上上下下所接受。为检验它的成果，我们将在国会上齐聚一堂，开启中华历史上第一次正式的全国大选，展现中华民主之建设成果，这场大选将在很长一段时间内决定中华未来的走向。"
  CHI_focus_Preparing_national_election_trigger_tt: "未召开§Y西安谈判§!或§Y西安谈判§!破裂"
   ###### 第二段 #############
  CHI_focus_Election_PWDP: "农工民主党"
  CHI_focus_Election_PWDP_desc: "经过激烈的大选，以赤羽为首的农工民主党在本次选举中占据多数，赢得大选。在胜选后的演讲中，她承诺将提高工农地位，以温和的方式推动中国社会向社会主义的进步方向稳步发展。"
  CHI_focus_subsidise_subsistence_farmers: "补贴自耕农"
  CHI_focus_subsidise_subsistence_farmers_desc: "中华的历史便是一部农业史，无数的农民背朝黄土面朝天，耕作出了中华的历史。哪怕当前，农业也是我国产业中最重要的部分，但我们的农民生活基本收入仍是社会底层。对此，政府将确立法律，对社会底层的自耕农进行补贴。"
  CHI_focus_Protecting_workers_rights: "保障工人待遇"
  CHI_focus_Protecting_workers_rights_desc: "工业是近代生产力发展的重要力量，也是保卫我国国防的关键。但在过去的发展中，我国的工人地位不高，无论是工作条件还是薪资环境都被国内外工厂主严重剥削，我们必须发动社会力量，坚决保证工人应得的社会地位。"
  CHI_focus_Union_of_NongGong: "农工联盟"
  CHI_focus_Union_of_NongGong_desc: "要实现社会的变革，我们必须动员起社会最广大的力量。中国农村最广大的力量在于农民，城市最有力的力量在于工人。在过去，他们缺少领导的力量，往往被各种社会力量利用而不顾。我们必须将他们联合起来，推动社会变革。"
  CHI_focus_Optimise_secondary_distribution: "优化二次分配"
  CHI_focus_Optimise_secondary_distribution_desc: "在过去的社会发展中，我国社会上发展出一大批官僚资本，他们利用税收和其他政策获得了大量的资本，却既不保证平民百姓的利益，又不发展新兴身材生产力，只是中饱私囊。对此，我们在具体打击的同时，对经济制度进行改善，切断这种不法的流程。"
  CHI_focus_Improving_social_security: "提高社会保障"
  CHI_focus_Improving_social_security_desc: "过去的社会动乱很大原因都来自我国社会底层缺乏保障，底层人民面对接连不断的社会动乱期间吃不饱饭，生活条件差，被诸多乱党所蒙蔽。要根除动乱，我们就必须进一步完善原本的社会保障，仅仅是施粥可不够，她们应当有更好的生活。"
  CHI_focus_heaven_of_social_democracy: "社民天国"
  CHI_focus_heaven_of_social_democracy_desc: "我们与曾经的革命者不同的是，我们由衷的认为中国社会是可以通过温和的改革而发展到另一个社会阶段的，如今的社会状况也证明了我们的想法。为此，我们将对社会体制进行更深入的改革，使其更公平和人性化，在中国真正建立起社会主义和民主体制。"
  CHI_focus_Towards_Revolution: "迈向革命"
  CHI_focus_Towards_Revolution_desc: "要想保卫社会主义，我们不仅需要对人民的民主，也需要对社会上各种极端分子的专制。我们不能像过去的社会主义政权固守一方，等着被国内外资产阶级所颠覆和毁灭，我们必须主动出击，推动全方面的革命。"
  CHI_focus_Maintaining_democratic_institutions: "维护民主制度"
  CHI_focus_Maintaining_democratic_institutions_desc: "在当今的国际政治中，法西斯主义，极端神权等极端主义意识形态常常利用民粹主义思想，鼓动社会民众发动暴乱，制造所谓的暴民政治，借机登堂入室，毁灭正常的民主制度。对此，我们必须将它们扼杀于萌芽之中，绝不让这些暴徒有可乘之机。"
  CHI_focus_Expanding_the_electorate: "扩大选民群体"
  CHI_focus_Expanding_the_electorate_desc: "要针对这种名为民主实为暴民的政治乱像，在打击的同时，我们也需要扩大社会层面的选民团体，加强社会层面的基层组织，让我们的百姓具有从底层向高层的合理晋升空间，让民主能够真正落实在社会基层。"
  CHI_focus_rehabilitate_CP: "平反中共"
  CHI_focus_rehabilitate_CP_desc: "在西部，很多百姓还在回忆着曾经的共产党对他们的好。他们的思想也在社会层面具备很大的影响力。冤冤相报何时了，让推动社会的发展，我们不应该对他们进行反复的压制，而是需要在社会层面达成谅解，正视历史，中止仇恨的延续。"
  CHI_focus_build_MPH: "建立人民英雄纪念碑"
  CHI_focus_build_MPH_desc: "推进谅解需要一个符号，在正确的看待同时，我们也需要对那些曾经为国而战的双方战士进行定性。经过讨论后，我们认为，应该把过去中共的战士和帝国的将士葬在一块，认同他们都是中华民族的烈士，是人民英雄，我们将立此碑永恒纪念他们的功绩。"
  CHI_focus_reform_Dont_rush: "改革步子不能急"
  CHI_focus_reform_Dont_rush_desc: "中国的经济长期需要稳定的市场建设，但我们不能心急。社会主义的建设固然会让一些潜在里的反对者急迫，他们试图逃离我们这个转向极权的国家，证明我们是错的。但他们这样的害群之马跑了最好，我们会从头开始，走出属于我们的经济路线。"
  CHI_focus_build_socialist_market: "建立社会主义市场"
  CHI_focus_build_socialist_market_desc: "在过去，资产阶级绑架了市场的话语权，他们号称市场这个古早的概念只有资本主义才能建立，没有了他们我们的经济必然崩溃。但我们不会，我们会参考社会主义的计划经济和凯恩斯的概念，建立有约束的市场发展体制，从零开始探索社会主义市场体制，走出前所未有的发展道路。"

  CHI_focus_Election_Cadets_party: "立宪民主党"
  CHI_focus_Election_Cadets_party_desc: "通过多年的政绩，广泛的政坛关系以及优秀的宣传，黎星刻先生带领的立宪民主党成功在首届大选中赢得多数。作为中华民主化之后的首位首相，他已决心在过往改革的基础上扶助天子，进一步推动宪政以及立宪民主在中华的发展，构建起属于中华的东亚民主。"
  CHI_focus_preferential_treatment_to_entrepreneurs: "给予创业优待"
  CHI_focus_preferential_treatment_to_entrepreneurs_desc: "我党的竞选口号之一就是保护并发展民族资本，我们会履行这个承诺。虽然我国地大物博，但我国小企业却要面对来自国内大企业以及洋人资本的恶性竞争，这明显不利于未来中国经济的发展，政府将出台相关保护以及支持法案，让我国市场上拥有更多的活力。"
  CHI_focus_Developing_national_enterprises: "发展民族企业"
  CHI_focus_Developing_national_enterprises_desc: "发展民族资本，不仅要让它们活，也要它们成长。温室里的树木可长不成参天巨木。我们在给予民族企业发展优待的同时，也要提升民族企业的综合竞争力，我们的民族企业不仅要能够满足人民的需求，也要能够走出国土，去到更大更广阔的市场去竞争。"
  CHI_focus_Embrace_free_world: "拥抱自由世界"
  CHI_focus_Embrace_free_world_desc: "未来的世界是民主的世界，随着科技的进步，我们的民众必然面对世界上诸多思潮的冲击，如果偏居一隅，反而很容易造成思想上的混乱。我们将在现在的基础上再放开一定舆论限制，引入一定的，来自圣杯、幻想乡等西方诸国的自由思想进行讨论。"
  CHI_focus_democracy_pioneer_of_Asia: "亚洲民主先锋"
  CHI_focus_democracy_pioneer_of_Asia_desc: "回顾过去，亚洲周边的诸多邻国都对我国的发展恐惧万分，他们一边维持着落后的君主乃至军国体制，一边叫嚷着我们是亚洲伟大的威胁，必须消灭我们。这种不平等的封建制度恰是阻碍亚洲和平的最大障碍。我们将进一步阐述我们有关东亚民主的主张，神州乃是东亚民主的灯塔，我们必将照亮亚洲，扫净黑暗。"
  CHI_focus_democracy_into_countryside: "民主下乡"
  CHI_focus_democracy_into_countryside_desc: "虽然帝国上下民主之风盛行，但要更好的巩固政权，就当将向基层赋权，将民主之责下到乡里，推动党权到乡。阡陌乡里的百姓在未来也能通过民主参政之方式，登堂入室，体验到民主二字的含义。"
  CHI_focus_Sharing_of_public_authority: "公权共享"
  CHI_focus_Sharing_of_public_authority_desc: "民主民权不是用来说的，还需要人来践行。自古以来我国基层的百姓往往不知国法，只知有老爷乡里的家法。未来之中华要民主，就要进一步推动公权在基层方面的共享，每位百姓都应享受应得的权力，公权当为百姓服务，而非为一家服务。"
  CHI_focus_MWBB_BGBN: "民惟邦本，本固邦宁"
  CHI_focus_MWBB_BGBN_desc: "‘民惟邦本，本固邦宁’乃古圣人理想治国之良策，固民方能安国，得民心者得天下。今天我们以以民主为器证明了这一哲理。我中华当为亚洲民主之灯塔，民主之光辉将普照亚细亚之地，让广大百姓得享民主之福，护我中华之社稷。"

  CHI_focus_Election_ZhiGong_party: "致公党"
  CHI_focus_Election_ZhiGong_party_desc: "经过国内致公党员的努力和海外华侨团体的努力，致公党党魁钟岚珠成功在此次大选中获得多数，成为中国的新领袖。在就职大会上，她已向全国公布了中国未来数年接下来的施政方向：联省自治，建立中华联邦。"
  CHI_focus_expand_provincial_powers: "扩大省权"
  CHI_focus_expand_provincial_powers_desc: "未来的中华必然是一个联邦制国家，只有联邦制才是中华的未来方向。要建立联邦，目前完全被中央所抑制的各省权力必须得到加强。我们要放开手，给予各省充足的自我发展权力，才能推动各地自治的有效落实。"
  CHI_focus_Expanding_economic_autonomy: "扩大经济自主权"
  CHI_focus_Expanding_economic_autonomy_desc: "强有力的联邦不能只靠所谓的中央强大带动贫弱的各地，如各省能够自主发展，并发向上，那中华的未来会更好。当然，在此过程中我们作为中央也会协调其中，保证各地不会因恶性竞争而兵刃相见。"
  CHI_focus_organise_trade_union: "组织工会"
  CHI_focus_organise_trade_union_desc: "联省自治的最终是民主共和，但不加约束的政治最终只会成为少数精英的独裁，不会达到人民民主。为此，强有力的工会也是重要一环。我们将在各地推动工会制度的发展和制度完善，让人民得享应得的权力。"
  CHI_focus_Weakening_central_power: "中央权力减弱"
  CHI_focus_Weakening_central_power_desc: "对于中华这样的长期中央集权制国家来说，减弱中央权力可以说是自杀行为。但要建立与西方完全不同的民主代议制，我们就必须迈出这一步，在各地省权加强之后，中央便不必完全对地方权力方方面面进行压制，我们需要构建一种和谐共存的关系，实现中央与地方的合理分权"
  CHI_focus_WuWeiErZHi: "无为而治"
  CHI_focus_WuWeiErZHi_desc: "老子有云：无为而治。但这句话绝非我们完全的不作为。相反，在联省自治的权力结构下，我们要做的是遵循我们制定的规则，不妄自尊大，对地方的一切事务粗暴干涉，而是与各地保持一个合理限度，实现各地、各族各应所需，各适所宜。"
  CHI_focus_formulate_provincial_constitutions: "制定省宪"
  CHI_focus_formulate_provincial_constitutions_desc: "没有秩序约束的自治往往会沦落为盗匪集团和无政府，各省要推动自治，除权力的增强以外，也需要制定省宪，将各省约定俗成的规则制定为宪法，且这个过程需要各省人民的参与，人民可多得参政机会，才能认识到自治之可靠。"
  CHI_focus_self_determination_personnel_matters: "人事自决"
  CHI_focus_self_determination_personnel_matters_desc: "过去的岁月里，集权的中央为保证对地方的压制，长期不允许各地地方拥有自主的官员任免权，这样固然避免了地方割据做大，但流官制下这样却无法让地方获得有效的发展。在未来的联邦制度下，我们需要让地方获得本该有的人事自决权力，让他们具备统御整理之责，对地方发展负起责任。"

  CHI_focus_Election_CLU_party: "公民自由联盟"
  CHI_focus_Election_CLU_party_desc: "经过计票，公民自由联盟在本届大选中以优势赢得多数，党首洛天依顺利成为新时代第一位首相。在胜选演讲中，她承诺在进一步推进神州民主化的同时，政府未来将着眼于国家现代化建设，全面推进国家现代化的实现。"
  CHI_focus_Expanding_foreign_investment: "扩大外资规模"
  CHI_focus_Expanding_foreign_investment_desc: "当代国家之现代化离不开工业化的发展进步，我神州历经大难，工业水平较强国如圣杯、苏联等仍有一定差距。要迅速追赶此等列强，我们有必要引进其他国家的资本与科技通过给她们开出一定优待条件，弥补我国发展上的差距。"
  CHI_focus_CLU_developing_industry: "发展实业"
  CHI_focus_CLU_developing_industry_desc: "当今世界，以圣杯为首的民主国家正掀起一股金融化之风，她们以所谓贸易自由为幌子转移落后产业到其他地区，并鼓吹去工业化之风以消除潜在的竞争对手。我们神州有数万万子民，若上了洋人的当只会仰人鼻息。神州之发展离不开工业，我们的现代化也将对实业进一步投入资金与支持。"
  CHI_focus_praise_ShenZhou: "歌颂神州"
  CHI_focus_praise_ShenZhou_desc: "我神州当代历史可谓多灾多难，国土分裂，外敌入侵，天下大乱的同时人心亦丧乱不止。在让百姓吃饱饭的同时，我们也需要重拾失落的人心。我们将开动宣传机器，向天下人阐述一个道理：天下只有一个神州，唯有天子之神州才能救国救民，富国强兵。"
  CHI_focus_cultural_modernisation: "文化现代化"
  CHI_focus_cultural_modernisation_desc: "自近代以来，民族文化已经成为世界各国凝聚人心的重要标志。近代长期的积贫积弱导致我国在民族文化方面缺乏竞争力，且不说让洋人信服，哪怕我国民众对神州之文化也存在质疑。随着我国国力的增强，我们将吸收借鉴当今世界先进 文化部分，填充进我中华文化之中，实现文化上的现代化。"
  CHI_focus_Improve_democratic_institutions: "完善民主制度"
  CHI_focus_Improve_democratic_institutions_desc: "在对西方诸国的考察中，我们相关部门给出的考察报告表明。西式民主在地方管理上类似我国古代的地主割据，乡里百姓被有选举权的贵族所控制。这并非真正的民主，与其像立宪民主党一样一味将西式民主引入中华，我们不妨从神州实际出发，构建更符合神州国情的，属于我们的民主制度。"
  CHI_focus_Promoting_democratic_ideas: "弘扬民主思想"
  CHI_focus_Promoting_democratic_ideas_desc: "‘周虽旧邦，其命维新’。我中华自古以来就有民主共和之传统，周召共和亦是我中华纪年之开端。可以说，我中华之民主思想源远流长，正是有了民主，古代圣贤能拨乱反正，近代仁人能治国安邦。我中华之未来唯有将民主之思想一以贯之，才能推陈出新，彪炳千古。"
  CHI_focus_full_modernisation: "全面现代化"
  CHI_focus_full_modernisation_desc: "有了实力，有了文化，有了意识形态，我们的现代化之路便有了良好的开始。如今的神州既是世界上首屈一指的民主之国，又不仰人鼻息，走出了属于自己的现代化、民主化之路。未来的我们也将沿这条道路继续走下去，让神州成为亚洲，乃至世界第一的现代化强国。"

  CHI_focus_Election_GongChe_party: "公车党"
  CHI_focus_Election_GongChe_party_desc: "本届大选结果已经出炉，公车党通过在国会中的优势，成功赢得本次神州大选的胜利，党首符华成功出任神州帝国第一位首相。在胜选演讲中，她承诺将进一步完善神州君主制，并以传统思想为纲治国，以达成神州现代化的伟大目标"
  CHI_focus_Hisory_mirror: "以史为镜"
  CHI_focus_Hisory_mirror_desc: "以史为鉴，可以正衣冠。今日之神州在快速发展之余，社会上无疑出现了礼仪缺失、目无尊长、崇洋媚外等诸多乱象，这些都来自于现代化过程中中华传统的教育缺失。要扑灭此等乱象，我们就要重新塑造对中华历史的学习，以史为鉴，宽政爱民。"
  CHI_focus_Royal_News: "皇家新闻"
  CHI_focus_Royal_News_desc: "旧时中华天子深居京城，足不出宫门。天下百姓只知天子之威，不知天子之恩，稍作挑拨就怨天子之恩不至。如今科学发展，新闻业盛行，我们正可利用此等便利，向天下百姓宣传天子与皇室之形象，潜移默化之间令万民归心。"
  CHI_focus_Make_monarchy_Great_Again: "君主制深谙人心"
  CHI_focus_Make_monarchy_Great_Again_desc: "在我们重建国会秩序，扫平天下逆贼的过程中，我们所学到的最重要的成果便是基层组织。我们已向其他政党一样推动党权下乡，让乡里城内黔首走卒都有权力上达天听。通过此种方式，我们才能让皇权下至乡里。"
  CHI_focus_Tian_Ren_sensing: "天人感应"
  CHI_focus_Tian_Ren_sensing_desc: "未来治理天下，我们需要再次塑造下层的价值观。纵观古今，符合我们要求唯佑儒家的天人感应学说，我们可以此重新教化百姓，让他们明白每个人都应各尽其职，哪怕官吏都应恪尽职守，人人皆如此，才能国泰民安。"
  CHI_focus_ShunYing_TianMing: "顺应天命"
  CHI_focus_ShunYing_TianMing_desc: "基层当受教化，高层业不例外。古人有云：事各顺于名，名各顺于天。子亦有君君臣臣子子。当今天子乃至国会都应顺天应人，遵循天意，治理百姓。唯有如此，方能遏制不法，世出明君。"
  CHI_focus_reinforce_MinBen_idea: "强化民本思想"
  CHI_focus_reinforce_MinBen_idea_desc: "旧时天下之乱来自于帝国高层争权夺利，忽视百姓民生，才导致天下大乱，人心丧乱。如今我国的现代化发展必须重新树立发展思想。我们将重拾民贵君轻的民本思想，中华之根在于民，而非君。"
  CHI_focus_New_Confucianism: "新儒家学说"
  CHI_focus_New_Confucianism_desc: "中华文明历经千年而不倒，其思想渊源便来自于我国博大精深的儒家学说。近代以来，儒家因失去了发展方向而落后于西方，但经过多年思辨，我国先进的思想家已经找到了新方向。未来的儒家思想将在传统思想的基础上更加重视格物之说，对科学和外来思想的学习将是这种新格物学的重要方向，我们将以这种新思想重构中华文明，实现现代化。"

  CHI_focus_Election_YCP: "青年党"
  CHI_focus_Election_YCP_desc: "即使被指责为极端，但青年党人仍然在本次大选中获胜，党主席88式正式接受天子册封，成为神州新的首相。在胜选演讲中，她以一句话阐述了本届政府的施政理念：以神州之正气，逐外夷之不臣。"
  CHI_focus_Forced_nationalisation_foreign: "强制国有化外资"
  CHI_focus_Forced_nationalisation_foreign_desc: "即使我国国力不断增强，我国的民族企业在市场上仍不能完全处于优势。在一些领域，以圣杯、幻想乡为首的外国资本依靠先发优势以及技术垄断，肆意定价，横行不法，严重损害了我国人民的利益。我们将向她们下发最后通牒，要求她们将企业以及资本交给我们，我们会开出适当的价格。如果她们不愿意，我们会动用武力。"
  CHI_focus_make_way_for_national_capital: "为民族资本让路"
  CHI_focus_make_way_for_national_capital_desc: "要壮大我国的民族工业，不仅要把外国人的影响力赶走，也要给予我国工业及时的支持。对于发展良好、支持政府风向的企业，我们将认可她们，并给予政策支持。毕竟重赏之下必有勇夫，只有开好了路，我国的民族工业才能有足够的力量与外国竞争"
  CHI_focus_NeiChuGuoZei: "内除国贼"
  CHI_focus_NeiChuGuoZei_desc: "过去长期对外国的学习在我国国内培养出了一大批崇洋媚外的政客，她们广泛鼓吹外国的所谓先进生活和制度，出卖我神州利益。是可忍熟不可忍，我们将效法过去的民族主义运动，坚决打击、限制这些卖国贼，剥夺她们的一切权力。"
  CHI_focus_WaiKangQiangQuan: "外抗强权"
  CHI_focus_WaiKangQiangQuan_desc: "在打击国内的反贼势力的同时，我们也需要进一步增强国内武装以及思想力量建设，特别是意识形态构建。我们会告诫她们：近代以来神州的苦难起源便来自于外国入侵，要让此等痛苦永不再续，我们就必须建设强大的国家意识以及力量，坚决抵制外国任何的干涉行动，捍卫我国主权。"
  CHI_focus_Opposing_cultural_aggression: "反对文化侵略"
  CHI_focus_Opposing_cultural_aggression_desc: "长期对外交往的过程中让我国国内某些学者开始盲目吹捧外国文化，他们不惜把我国传统的美德贬得一无所处也要吹捧西方，甚至他们还借助自身的地位贬低我国的优秀学者。毋庸置疑，我们必须坚决打击这些学阀，抵制这种不正之风。"
  CHI_focus_Promoting_traditional_culture: "弘扬传统文化"
  CHI_focus_Promoting_traditional_culture_desc: "卖国学者常宣传是我国传统文化导致了近代的积贫积弱，但若没有传统文化，我们基层社会早会就土崩瓦解，况且我国传统文化也有革故鼎新之说。与其盲目吹捧外国，让天子与首相牵头恢弘传统之进步之风，才是中华发展之正道。"
  CHI_focus_China_stands_tall_in_the_universe: "中华屹立宇宙间"
  CHI_focus_China_stands_tall_in_the_universe_desc: "传统与变革齐头并进，这正是青年党所倡导的中华发展之愿景——中华的未来需要进步，但进步不代表我们要放弃我国悠久的传统，在摒弃那些传统糟粕的同时，吸收外国先进事物，抵制外国入侵，从而构建起新时代下中华的优势，让中华能够再次超越各国，成为当世第一，屹立于宇宙之巅。"

  CHI_focus_China_coalition_government: "中华联合政府"
  CHI_focus_China_coalition_government_desc: "在旧帝国民主党派的主导下，我们与国民党、共产党达成历史性的《联邦宪政协定》。旧王室接受了§Y体面的退位§!与丰厚的津贴，象征性地将权力交还给人民。一个由三方力量共同支撑的§Y中华联邦§!宣告成立，结束了旧王朝的统治。"
  CHI_focus_Peaceful_reunification: "和平统一"
  CHI_focus_Peaceful_reunification_desc: "联邦政府必须尽快将和平的成果推广到全国。我们将向各地仍然犹豫不决的旧军阀残余和地方势力发出最后通牒。目标是利用新的宪政框架和三方的强大军事力量，通过§Y政治协商为主、军事威慑为辅§!的方式，迅速实现国家的完全统一。"
  CHI_focus_Restore_reputation: "恢复名誉"
  CHI_focus_Restore_reputation_desc: "长期以来，国民党和共产党被旧帝国污蔑为“赤匪”和“乱党”，这严重阻碍了联邦内部的信任。为了巩固三方联盟，必须由联邦政府颁布法令，§Y公开肯定国民党和共产党在反帝反封建斗争中的历史功绩§!，彻底清除旧政权对两大党的政治污名。"
  CHI_focus_Commemorating_Fallen_Heroes: "纪念英烈"
  CHI_focus_Commemorating_Fallen_Heroes_desc: "为了弥合内战留下的巨大创伤，联邦政府决定以国家的名义，设立纪念碑和国家公祭日。我们将公平公正地纪念所有在推翻旧帝国、抵抗异族入侵（魔导国等）和建立联邦过程中牺牲的英雄，以§Y和解与共同信仰§!作为新联邦的精神基石。"
  CHI_focus_Organise_two_chambers: "组织两院"
  CHI_focus_Organise_two_chambers_desc: "联邦宪政的核心在于权力制衡。我们将设立§Y联邦参议院§!（由民主党派和国共两党固定席位）和§Y众议院§!（由民主选举决定席位）作为最高立法机构，确保各方政治力量都能在联邦的治理中发声。"
  CHI_focus_The_Big_Tent: "“大帐篷”"
  CHI_focus_The_Big_Tent_desc: "联邦的稳定需要广泛的社会基础。我们将开展一场§Y政治联盟扩大运动§!，鼓励所有愿意拥护联邦宪法的中小党派、社会团体和地方贤达加入进来。通过提供席位和政治参与，最大限度地扩大联邦的统治基础，实现真正的全民政治。"
  CHI_focus_Economic_revitalisation: "经济振兴"
  CHI_focus_Economic_revitalisation_desc: "连年的内战使国家经济濒临崩溃。联邦政府将联合三方的力量，立即启动§Y五年经济恢复计划§!。重点是恢复农业生产和基础工业，并利用前王室留下的津贴和国际援助，为联邦的快速工业化奠定物质基础。"
  CHI_focus_Integrated_Industrialisation_Experiment: "综合工业化实验"
  CHI_focus_Integrated_Industrialisation_Experiment_desc: "利用国民党与西方、共产党与苏维埃/幻想乡的技术联系，联邦政府将主导一场§Y技术整合与工业化实验§!。目标是在关键领域融合西方的工业体系、苏维埃的重工业模式和魔导科技，迅速建立起具有时代竞争力的联邦工业。"
  CHI_focus_Chinese_century: "中华世纪"
  CHI_focus_Chinese_century_desc: "在民主、共和、社会主义和民族主义的共同精神指导下，中华联邦已经完成统一和复兴。一个强大的、由人民和各党派共同治理的国家屹立东方。我们已准备好迎接挑战，并向世界宣布：§Y中华联邦世纪§!已经来临！"

  ########### 外交线 ##########
  CHI_focus_compete_for_Central: "逐鹿中原"
  CHI_focus_compete_for_Central_desc: "随着神州中央政府失去对神州各地的控制，神州再次陷入‘秦失其鹿，天下共逐之’的局面，而我们必将成为那个再次执掌神州权柄得存在，让那些割据叛乱分子向我们投降——或者被消灭！"
  CHI_focus_pacify_western: "王师平西"
  CHI_focus_pacify_western_desc: "在我们将目光望向神州各地之时，第一个眼中钉便是神州西部的各省，赤匪作乱的西南，华西摇摇欲坠，王师西征，平定西域已是必行之事"
  if_SIK_is_CHI_country: "如果§Y[SIK.Getname]§!是§Y中原派§!执政"
  CHI_focus_pacify_South_CHina: "戡乱华南"
  CHI_focus_pacify_South_CHina_desc: "自国民党起义以来，南方诸府已实际脱离中央控制，我们将要出重拳平定国民党叛匪，顺便让那些军头自己决定，是回归中央控制，还是尝一下中央的铁拳"
  CHI_focus_into_East_of_ShanHai: "闯关东"
  CHI_focus_into_East_of_ShanHai_desc: "毫无疑问，关东地区广大的黑土地是神州不可分割的一部分，大量闯关东的民众将神州的血脉融进了东北广阔的大地里，东北地区必须回到中央的控制之下——无论现在的东北军阀是谁，国民党、军阀。抑或是樱花的傀儡"
  CHI_focus_unification_of_Central: "中原一统"
  CHI_focus_unification_of_Central_desc: "现在，我们终于可以宣布，神州的内战已经告一段落，中原地区再次迎来了她的统治者，神州中原重归一统。神州帝国又一次屹立在这片广袤的土地上"
  CHI_focus_reclaim_concession: "收回租界"
  CHI_focus_reclaim_concession_desc: "海岸线上鱼鳞般分布的租界是神州大地上一道道深深的伤口，那是列强罪恶的侵略留下的罪证，现在神州崭新的政治格局已经形成，而西方列强正深陷第二次伟大战争的泥沼，这正是我们扫清这些不平等条约的疮疤之时"
  CHI_focus_stabilise_border: "稳定边疆"
  CHI_focus_stabilise_border_desc: "帝国的边疆已摇摇欲坠多时，甚至分离主义势力有抬头之势，现在已经处理完中原事宜，当迅速行动，稳定边疆"
  CHI_focus_Back_to_World: "重返世界"
  CHI_focus_Back_to_World_desc: "在我们处理完内部事务之后，神州终于得以将目光投向世界，要让这个世界知道，那个贫穷、落后、弱小的神州不复存在了，神州帝国将重返世界舞台的中央"
  CHI_focus_Hearts_of_Celestial_Empire: "天朝雄心"
  CHI_focus_Hearts_of_Celestial_Empire_desc: "我天朝上国，自古便是东亚地区的霸主，但自近代以来，却屡受列强欺辱，频遭割剐，曾经的朝贡体系业已完全崩溃，霸主地位荡然无存，现如今我们要神州帝国既已重返世界舞台，便要重拾往日的雄心，向世界证明我们霸主的地位"
  CHI_focus_ZongFan_system_modernisation: "现代化宗藩制度"
  CHI_focus_ZongFan_system_modernisation_desc: "过去老旧的宗藩制度已经不适应现代环境和浴火重生的神州帝国的需求了，我们需要彻底改组宗藩制度，使其现代化，并将其推广开来，运用于神州帝国对周围附庸的控制上"
  CHI_focus_Tributary_system_modernisation: "现代化朝贡制度"
  CHI_focus_Tributary_system_modernisation_desc: "随着近代列强的入侵和神州帝国中央政府失去对各地的控制，往日以神州帝国为核心的天朝朝贡体系彻底崩溃，但是如今重生的帝国既然决意重返世界舞台的中心，就必须重建朝贡体系并加以现代改造，使神州帝国能更好地掌控我们的附属国家"
  CHI_focus_XiXueDongJian: "跟随盟友"
  CHI_focus_XiXueDongJian_desc: "神州帝国已经离开世界舞台中心太久了，现在的国际形势已经不允许神州帝国再孤身立于世界之上，我们需要在如今的列强之中寻找盟友，并且紧跟盟友的脚步，这样才能适应这个时代"
  CHI_focus_Learn_advanced_technology: "学习进步科技"
  CHI_focus_Learn_advanced_technology_desc: "帝国的科技落后于如今世界主流强国太多了，我们要从先进的盟友那里学习先进的技术来使帝国跟上时代的步伐"
  CHI_focus_economic_cooperation: "促使经济合作"
  CHI_focus_economic_cooperation_desc: "一切的问题最终都会回到经济问题，多年的落后，工业化起步的迟滞，列强的入侵和残酷的内战都使得帝国的经济远远落后，我们要加强同盟友的经济合作，唯有经济强大才是一切发展的基石"
  CHI_focus_unforgettable_Former_territory: "故土难忘"
  CHI_focus_unforgettable_Former_territory_desc: "自维新失败以来，神州帝国屡遭割剐，无数故土落入他国手中，多少年来，神州人都难忘那一片片故土和其上受难的同胞，过去的我们弱小，因而只能把这份苦痛深埋心底，但如今神州帝国既已复兴，我们便要重提对那些故土的主张"
  CHI_focus_avenge_humiliation_of_north: "雪耻北疆"
  CHI_focus_avenge_humiliation_of_north_desc: "忆往昔，XX草草，封狼居胥，赢得仓皇北顾，神州自此再无可堪一用之中央军，此番神州再兴，当兴兵北伐，一雪前耻，光复故土，扬我国威"
  CHI_focus_into_europa: "进军欧陆"
  CHI_focus_into_europa_desc: "在苏联倒下之后，通往欧洲的门户已然洞开，现在是时候让那些欧洲人品尝一下神州过去所承受过的屈辱了，这些苦难我们要一丝不剩的奉还给他们"
  CHI_focus_Protection_south: "保护帝国南疆"
  CHI_focus_Protection_south_desc: "曾经的罗马帝国用一种十分有效的方式保护他们的边疆：扩张出新的边疆，这样旧的边疆便成了内部，神州帝国可以学习这一做法，为了保护帝国的南部疆界，利剑向南是必经之选"
  CHI_focus_reopen_silk_road: "再通丝路"
  CHI_focus_reopen_silk_road_desc: "丝绸之路是神州历史上宝贵的贸易通路，但随着西方的大航海和旧丝路的政权更迭，丝绸之路几近停摆，而今神州帝国想要扩张自己的经济影响力，重新打通丝路是必要手段"
  CHI_focus_Conquer_middle_east: "征服中东"
  CHI_focus_Conquer_middle_east_desc: "为了稳定新开辟的丝绸之路不受中东地区不稳定政权的袭扰，我们需要派出军队武力征服中东，在中东地区建立起稳定的秩序"
  CHI_focus_Free_korea: "解放朝鲜"
  CHI_focus_Free_korea_desc: "朝鲜一直以来都是我们神州帝国的附属，旧日的背叛不能容忍，卧榻之侧，岂容他人鼾睡，神州帝国的军队必须解放朝鲜，重置汉四郡，让朝鲜重归神州帝国控制之下"
  CHI_focus_Conquer_Japan: "东征瀛洲"
  CHI_focus_Conquer_Japan_desc: "旧日的仇恨如芒在背，让每个神州人都饱含苦痛和愤恨，东瀛地区本就是神州的拥簇，却对神州帝国刀剑相向，神州帝国无法容忍这种悖逆和冒犯，神州帝国中央政府的威权将随着神州的军队一同再次踏上那片土地"
  CHI_focus_back_New_Continent: "重返新大陆"
  CHI_focus_back_New_Continent_desc: "随着明末大乱局中原政权丢失了对北美殖民地的控制，但这抹消不了北美西海岸与神州大地同文同种，血脉相连的事实，我们将要重新掌控新大陆这片富饶之土，让这些神州子民重归王化"
  CHI_focus_go_south_sea: "下南洋"
  CHI_focus_go_south_sea_desc: "富庶的南洋曾经满是神州帝国的朝贡之臣，但随着西方殖民者的到来和天朝朝贡体系的完全崩溃，神州完全失去了对南洋的掌控，旧日的兰芳也随之解体，但复兴的神州已经无法容忍西方殖民者在南阳的存在，帝国水师即将南下平洋，将那些殖民者一个不剩的驱逐出去"
  CHI_focus_Protecting_maritime_trade: "保护海上贸易"
  CHI_focus_Protecting_maritime_trade_desc: "神州帝国的海上贸易仍然受到威胁，为了保护帝国的贸易路线，有必要武力开通一条安全的通路出来"
  CHI_focus_get_South_Continent: "摄取南方大陆"
  CHI_focus_get_South_Continent_desc: "南方的学园都市，是一片埋藏着丰富矿藏，拥有这丰沃水草的矿山和牧场，我们既已扫平西方殖民者在亚洲和大洋洲的存在，这最后一片珍宝也当入帝国之手"
  CHI_focus_Listen_loong_roar: "且听龙吟"
  CHI_focus_Listen_loong_roar_desc: "诸君，自维新失败以来，数十年的耻辱自此一扫而空，帝国重登亚洲霸主之位，且看那潜龙腾渊，直上九霄，且听那彻天的龙吟之声，响彻寰宇！"

  ######### 经济线 #################
  CHI_focus_eco_ZhenXing: "经济振兴"
  CHI_focus_eco_ZhenXing_desc: "中原数年的动荡不安已经过去，帝国仍然百业待兴，我们将为饱受灾荒袭扰的华夏大地洒下甘霖。"
  CHI_focus_Nation_lead_industrialisation: "国家主导工业化"
  CHI_focus_Nation_lead_industrialisation_desc: "中国弱小的民族资产阶级付出了毕生心血才在强敌环伺的世界里为我们积得一点微薄的工业，残酷的现实把耳光狠狠抽到自由放任派脸上，如今只靠社会上的其他阶层寻求实现中国工业化毫无希望。趁着京城政局已趋于稳定，我们决定今后由国家政府来主导工业发展，必须尽快摆脱国力孱弱的境地。"
  CHI_focus_restart_old_factory: "重启旧工厂"
  CHI_focus_restart_old_factory_desc: "过去数十年中国工业化并不是毫无成果，各地尚有数量规模可观的老旧厂矿设施，如果我们能将其重新启用并加以修缮，可以迅速地充实国家工业实力。"
  CHI_focus_state_farm: "组织国营农场"
  CHI_focus_state_farm_desc: "历代王朝政权的存亡始终离不开土地和农民，既然地主阶级死死地将地契捏在手中，不肯给农民也不肯给国家一条发展的生路，那干脆就由国家来当最大的地主。我们会把把荒废的土地和饥饿的农民集中起来建设成国营农场，为中国的贫苦农民提供生产资料，为中国的工业化提供产品原料。"
  CHI_focus_promote_farm_machine: "推广农机"
  CHI_focus_promote_farm_machine_desc: "我国国土虽广袤但也人口众多，随着时代发展，社会各方面对于粮食的需求越来越大，我国大部分国土也无法开垦耕地，传统的耕种方法也无法适应日益增长的粮食需求。向基层推广农业机械，便能够以最为高效的方式完成主要农业区的耕作，有效提高产量，满足我国人民的粮食需求。"
  CHI_focus_State_owned_road_administration: "路政国营"
  CHI_focus_State_owned_road_administration_desc: "近代以来，随着我国社会的快速发展，社会各界对于基础设施现代化，特别是路政建设的现代化的需求逐步上升，特别是铁路运营。要推动全国范围内的路政建设，我们就需要先将已建设的铁路进行国有化，保证以后的基础设施建设以及升级顺利进行。"
  CHI_focus_optimise_industrial_structure: "优化产业结构"
  CHI_focus_optimise_industrial_structure_desc: "近代以来，我国各个产业都开始主动或被动的对外接触。相对外国，我们在工农等行业的发展较为粗糙，仍有较大的发展空间。对此，我们将召集各个层面的技术人才，通过在各个产业深入的学习以及研究，促进这些产业的现代化升级。"
  CHI_focus_introduce_advanced_technology: "引进先进技术"
  CHI_focus_introduce_advanced_technology_desc: "近代以来，虽然我国在各个方面追赶外国，但我们仍与外国有着诸多技术差距。仅靠自主研发，我们可能需要二代乃至三代的时间才能追赶上世界先进水平，但有钱能使鬼推磨，我们可以施以重金，引进外国的先进技术进行学习和改进，实现技术上的赶超和突破。"
  CHI_focus_improve_assembly_line: "改进流水线"
  CHI_focus_improve_assembly_line_desc: "当今世界上主流的生产方式即为工厂流水线，但西方的工厂流水线过于漠视人命，既不符合我国以人为本的传统，也造成了熟练工人批量的损失。我们可以根据流水线的工作规律，改进流水线的工作规律和产能，从多方面提高我国的工业生产能力。"
  CHI_focus_private_capital_lead: "放权民间资本"
  CHI_focus_private_capital_lead_desc: "我国工业需要大批资金的投资，但政府需顾及之处不不止于工业，仅仅靠政府投资远远不能满足工业发展需要。但民间仍有大批资本希望能够为我国工业发展贡献自己的一定心力，我们可以适当给他们开个口子，引导这些资本进入我国工业。"
  CHI_focus_Promote_joint_ventures: "推广合资企业"
  CHI_focus_Promote_joint_ventures_desc: "很多外国资本希望在我国投资，但有之前洋企横行霸道之鉴，我们不可能让他们完全掌握我国企业，但为获取到外国技术，我们可以适当开个头，允许外国资本与我国资本共同出资共同经营企业，通过这等方式逐步学习外国技术，开拓外国市场。"
  CHI_focus_Improving_investment_environment: "改善投资环境"
  CHI_focus_Improving_investment_environment_desc: "不止民间，我国海外的侨胞也希望为我国的发展提供资金和技术帮助，但他们之前苦于我国政策限制，无法深入市场进行投资。对此，我们应该根据市场情况制定法律，保证这些他们能够便捷投资我国工业，也为其他资本提供便利。"
  CHI_focus_Encourage_national_enterprises: "鼓励民族企业"
  CHI_focus_Encourage_national_enterprises_desc: "自近代民族危亡以来，我们民间便有实业救国之说，希望通过置办企业挽救我国社会积贫积弱的情况，但仅靠民间的自主运动难以持续。我们应当在社会舆论和政策等双管齐下，以官方力量为民间背书，推动这一运动的扩大发展。"
  CHI_focus_reduce_agricultural_taxes: "降低农税"
  CHI_focus_reduce_agricultural_taxes_desc: "自近代国难以来，我国为发展实业，养兵御贼，在农业方面制定了多重较重的税负，这固然保证了朝廷存活，但也导致了农民压力较大，多有叛逆。如今工业有所发展，我们可以适当降低农税，减轻百姓负担，以安民心。"
  CHI_focus_subsidise_small_farm_machine: "补贴小型农机"
  CHI_focus_subsidise_small_farm_machine_desc: "推广大型农机在我国平原地区取得了巨大的成果，但我国广袤的耕地中还有大量丘陵山林地区，这些地方不适宜大型农机投入，一般民众也难以购入专用的小型农机，政府应当为他们提供补贴，保证他们能够买得起地，提高粮产。"
  CHI_focus_money_takes_precedence: "金钱挂帅"
  CHI_focus_money_takes_precedence_desc: "在工业设备发展的同时，我们也需要想办法提升我国工人的效率。当前我国工人效率地下的一个原因便是劳动无多得，干多无奖甚至加劳。要解决这个问题也很简单：以奖励入手，学习社会主义者的多劳多得理论，提升工人的工作效率"
  CHI_focus_active_market: "活跃的市场"
  CHI_focus_active_market_desc: "俗话说得好，流水不腐，户枢不蠹。市场要想保证活跃，就需要保持强有力的竞争。我们不需要一个死气沉沉的市场粉饰太平，我们会根据各种企业不同的情况进行取舍帮扶，保证它们能够在我国市场上同等竞争，保证我国经济的活跃。"
  CHI_focus_industrialisation_of_China: "中国工业化"
  CHI_focus_industrialisation_of_China_desc: "经过不断的发展，我国的工业化已经取得了卓越的成果，过去的积贫积弱情况得到了有效改善，工业生产能力大大提升。现在，是时候制定更深入的计划，推动我国工业化的深入发展。"
  CHI_focus_Uncovering_resources: "发掘资源"
  CHI_focus_Uncovering_resources_desc: "随着我国工业水平的提升以及国防需求的提升，我们迫切需要更多资源。以前我国工业水平较低，开采水平较差，现在我们已经有了较高水平的工业能力，是时候深入深山，将这些大自然的孑遗为我所用了。"
  CHI_focus_synthetic_resources: "合成资源"
  CHI_focus_synthetic_resources_desc: "尽管我国地大物博，但有些资源，诸如天然橡胶这类自然资源我国本土出产较少，即使立刻开始移植，所需也要经年。但我国工业上的进步能够弥补这个问题，通过工业制备，我们可以通过合成橡胶以弥补此种工业缺口。"
  CHI_focus_Industrial_Zone_Planning: "规划工业区"
  CHI_focus_Industrial_Zone_Planning_desc: "在我国工业发展过程中，京师，沪上等地自觉形成了几个不同的工业地带，这些工业地带在一定职能上存在重合，在发展中出现了不必要的竞争损失。随着发展，我们将合理划分国内诸多地区的工业企业，使之能够合理发展，达成国内一盘棋的优势发展局面。"
  CHI_focus_Investment_Factory: "投资工厂"
  CHI_focus_Investment_Factory_desc: "伴随我国工业的发展，我们开始触及我们未曾存在的门类，在这些领域已经没有外国经验能够为我们所鉴，我们需要从无到有开展科技研发。因此，有必要开展以政府名义深入开展工业投资，并为表现较好的工厂进行表彰。"
  CHI_focus_Promoting_public_schools: "推广公立学校"
  CHI_focus_Promoting_public_schools_desc: "自古以来，熟练工人便是工业发展的最基本单元，正是中国的传统熟练工人构成了我国工业发展的基础，但随着工业发展的深入，工人所需的文化程度逐步提升，我们要想推动工业发展，就必须培养大批量的知识工人。国会已经决定，在全国各地进一步推广公立学校，构建我国基础知识体系"
  CHI_focus_Organise_The_CAS: "组织中国科学院"
  CHI_focus_Organise_The_CAS_desc: "我国工业要想超越大国，屹立于世界，科技创新、思想进步都必不可少，这些只有我国最优秀的头脑们才能做到。如果他们分散各处，便是一盘散沙，难以城市。我们所能做的就是将他们组织到一处，建立起综合性质的中国科学院，充分发挥这些天才们的才华，引领未来的科技黄金时代，实现我国顶尖科技的突破。"

  ####### 陆军线 #########
  CHI_focus_Empire_strong_Army: "帝国强军"
  CHI_focus_Empire_strong_Army_desc: "自近代以来，虽屡战屡败，但神州帝国仍奋发图强，以列强的近代军队为蓝本，开始学习她们的军制，以求建立新式军队，抵御外国入侵。之前苦于国内政局不稳，诸事不顺，如今大局已定，我们将开启正式开始军事改革，建立帝国之强军。"
  CHI_focus_Unified_training_system: "统一练兵制度"
  CHI_focus_Unified_training_system_desc: "强军当有强兵，可在过去的练兵过程中，神州高层因为政见不一，各寻多国练兵之法，有人认为应学圣杯等西洋兵制，有人认为应学樱花等东洋兵制，各地督抚亦是政出多门，这都导致了我国军队的素质下降。如今我们将正式作出选择，向西洋德意志国发出邀请，向她们进行学习，练我神州精兵。"
  CHI_focus_conscription_Publicity_Department: "征兵宣传部"
  CHI_focus_conscription_Publicity_Department_desc: "国内长期的政局混乱导致我神州的征兵事务也随之崩溃，各部日常开拔期间日常出现强抓地方民夫补充士兵，良家子的缺乏导致了我军素质的严重下降。我们必须重新建立征兵制度，新的征兵宣传部将负责重建我国的征兵事务。"
  CHI_focus_Establishment_GSH: "建立总参谋部"
  CHI_focus_Establishment_GSH_desc: "在过去，我们虽然也学习西方试图建立参谋制度，但实际上参谋地位极其地下，一方面要负责军队内诸多军务事务，一方面地位甚至不如一般新军官，很多旧军官甚至将参谋当军师一般呼来喝去。对此，我们将学习德国军事制度建立我国的总参谋部，参谋的地位以及待遇将提升至军事长官一级，以此提升我国军队的计划与行动能力。"
  CHI_focus_Focus_on_radio: "重视无线电"
  CHI_focus_Focus_on_radio_desc: "通讯是近代战争最重要的一环，列强军队正是依靠高效的通讯完成了在对我们军队的战争中屡占优势，而我国军队长期还在使用古代传统的旗语和呐喊传讯，效率远远不及各国军队。随着我国经济的改善，我国电子行业的生产能力得到提升，我们对于无线电的仿制和下发也将随之推进，保证我们在通信上实现近代化。"
  CHI_focus_Organise_special_forces: "组织特战部队"
  CHI_focus_Organise_special_forces_desc: "我国历史上不乏在山地、海滩等特殊地形组建的精锐部队，但一旦用完即在常规战争中消耗殆尽，而列强军队却将其组织为特战部队，广泛使用。我国在与之交战的过程中屡吃苦头。要对抗特战部队，我们也要有自己的特战部队，强大的特战部队也能保证我军在极端环境下，有一支尖刀突破敌人的重重防线。"
  CHI_focus_Invite_Hermit_Sect: "邀请隐士宗门"
  CHI_focus_Invite_Hermit_Sect_desc: "纵观我们与世界各国军队交手的过程，我们曾经面都了各式各样的魔法军队，圣杯的蒸汽骑士，幻想乡的妖精，俄罗斯的魔法少女和战姬，德意志的法师等等，这些各式各样的魔法军队都是不可不防的威胁。单以天师府一府之智慧万万不够，但我华夏大地上其实不乏隐士宗门，我们应该以功名，大义等不同方式邀请他们，共克国难，他们也可以在研究外国修法的过程中得到进步。"
  CHI_focus_Taoist_priest_Army: "组建道士军队"
  CHI_focus_Taoist_priest_Army_desc: "在一段时间的收容与整训后，天师府呈上了一份奏疏，这份奏疏里总结了我国魔法军队的初步训练结果，得出结论：我国宗门众多，道术更适合基础的学习和使用；而大修士需应对强敌，若是将基层一般修士分散至各军使用，很容易在成建制的部队面前溃败，我们也应当学习其他各国经验，组建成建制的道士军队。"
  CHI_focus_Taoist_priest_weapon: "研制通用道士装备"
  CHI_focus_Taoist_priest_weapon_desc: "在道士军的相关训练过程中，一个很明显的问题是，无论是训练还是实战，虽然诸修士各有防御法门，但在大规模实战演练的过程中，一支拥有护具装备的道士部队较一支全仗法术防护的部队伤亡率能少两三成，这值得我们为之付出一定的科研力量进行相关研究"
  CHI_focus_WangShi_ChuCheng: "王师初成"
  CHI_focus_WangShi_ChuCheng_desc: "经过众多努力，曾经松散无章的神州帝国军队终于摆脱了落后的局面，成为了一支将勇兵强的部队。但时代在进步，世界其他国家的军队也在进步，各种先进科技的投入令我们高层也一时难以适应，但这也正是我们的机会，如果能利用好这些科技进行新一轮军改，我们就能够彻底赶超世界各国军队，成为当世第一强军。"
  CHI_focus_Focus_on_armour: "重视装甲运用"
  CHI_focus_Focus_on_armour_desc: "在我们与德意志国初步的交流中我们了解到，在上次伟大战争末期所使用的坦克已经在现代科技的武装和升级下，获得了最新的发展，能够以极快的速度完成对敌的包围和据点攻坚，经过实训，坦克在训练中发挥了惊人的效果，我们应当及时将这项训练成果下发至帝国诸军中，并研究相关反制战术。"
  CHI_focus_Reserve_training: "预备役训练"
  CHI_focus_Reserve_training_desc: "我们虽然已经建立了一定的征兵制度，但我们的新兵从入伍到成为合格的士兵，往往需要实现多年实现，一旦前线扩编或者较大的兵力缺口，我军的素质便会大大下降。因为，效法德意志和和樱花，建立相关的预备役制度，将极大提升我国军队的综合素质。"
  CHI_focus_modern_military_academy: "组织现代化军校"
  CHI_focus_modern_military_academy_desc: "蛇无头不行，兵无主自乱。好的将领可以为军队指明方向，极大提升麾下部队的战斗力。眼下我国的军队将领来自天南地北，素质不一，如果不经整训，无法适应现代化的战争。我们应当根据最新的军事理论招收教官，建立一所现代化的军校，在此让我们的新老将官在此进行总体训练，让他们能够更快适应现代化战争。"
  CHI_focus_Strengthen_military_discipline: "强化军队纪律"
  CHI_focus_Strengthen_military_discipline_desc: "纵观过去，我神州之军与众分裂势力交战之时，他们的军队往往较少投降，就是因为我军军纪散漫，往往出现劫掠士卒，迫害战俘等行为，导致愿参军者和投降者都极少，如今我军需要向强军发展，我们便需要再重视起军队纪律，违法乱纪者必将被惩处，才能保证我军素质得到确切提升。"
  CHI_focus_Uniform_regulations: "统一军服规制"
  CHI_focus_Uniform_regulations_desc: "军服是一国陆军国威、军威的外在体现，是军队正规化的表现之一。在过去的岁月里，因为帝国军费常年不足，军饷大量依仗地方剿总们进行筹备，导致神州各军队军服配置不一，在协调作战期间屡屡出现损失情况。因此，我们将统一我军军服的规制，推进我军进一步向现代化转型。"
  CHI_focus_modern_tactics_research: "研究现代化战术"
  CHI_focus_modern_tactics_research_desc: "伴随着我军现代化的发展与对外国此起彼伏的战争情况研究，各种新式战术开始摆上我们的参谋会议：闪电战，大纵深战术、猪突攻势、游击战、钳形攻势等等。他山之石可攻玉，通过对各种现代化战术的研究，我们可以从中研究出适合我国的战术，并有效反制敌国的战术。"
  CHI_focus_crackdown_military_bandits: "严打军匪"
  CHI_focus_crackdown_military_bandits_desc: "在战场上，一支有严明纪律的军队会比一支纪律涣散的军队更具战斗力。在我军的平乱以及实训过程中，不少部队表现出了严重的兵匪倾向：打骂士卒，劫掠所经乡民，甚至聚众赌博。针对这些违反帝国军规的行为，我们将发起一次严打运动，狠狠惩处这帮军匪的不良风气。"
  CHI_focus_CHI_GER_cooperation: "深化中德合作"
  CHI_focus_CHI_GER_cooperation_desc: "虽然交往艰难，但我们还是与德意志国实现了正常交往。德意志国防军虽然受到挫折，但是仍是一支劲旅，且为了保证国防军的强力战斗力，德国高层已经同意进行更深一层的军事化合作，我们会好好利用这个机会的。"
  CHI_focus_Introduction_German_equipment: "引进德企与德械"
  CHI_focus_Introduction_German_equipment_desc: "如今的德意志国境内有着众多跟随德国元首流亡至此的德国企业，他们均有很强的军备生产和设计能力，他们本身的流水线能力也能生产高质量的德械。如今的德国政府需要一个地方试验他们的武装，我们可以担任这个工作，通过合理的价格将这些德国企业和德械引进我国，以德为鉴，充实我国军备。"
  CHI_focus_Purchase_German_patents: "购买德械专利"
  CHI_focus_Purchase_German_patents_desc: "经过我国大使和顾问的考察，我们发现，德军对德国企业的军备采购和研发中，一部分军械表现并不差，但却因为不能迅速压缩价格而被摒弃，其本身实际有着较好的表现却不得使用。而如今的德国政府缺乏足够资金，我们可以与德国政府和企业进行洽谈，将这些军械的专利买过来，为我所用。"
  CHI_focus_invite_military_advisers: "邀请军事顾问"
  CHI_focus_invite_military_advisers_desc: "德军在战术上有着众多天马行空的想法，这正是我军所缺乏的，但他们要防备北方强敌而不敢轻易耗费军力，我们可以给他们这个方便，邀请部分德国顾问来到我国，由我军作为样板进行训练与战术实践，他们实践了战术，我们学到了经验，真可谓两全其美。"
  CHI_focus_Form_supervision_team: "组建督战队"
  CHI_focus_Form_supervision_team_desc: "我国自古以来便有监军一职，作为督战队临阵处斩溃兵，维持军纪。但自近代以来，帝国军军纪废弛，加之军队空饷严重，督战队往往名存实亡。如今帝国武备已经重组，我们将重建督战队一职，维持我军战场军纪。"
  CHI_focus_Promoting_New_Army: "推广新式军队"
  CHI_focus_Promoting_New_Army_desc: "通过一阵时间的训练，我们成功训练出了一批战斗力强大的新军，这支新军在与诸多旧军队的实训中胜多败少。且通过训练过程，我们已经可以充分复刻训练这种新军的经验，我们将逐步推广这种训练经验，全面提高我军的素质。"
  CHI_focus_Improving_old_rifles: "改进老式步枪"
  CHI_focus_Improving_old_rifles_desc: "在过去，由于缺乏近现代武器研究经验，加之国内战乱，军备人才稀缺，我军长期使用老式步枪进行对射。但在实战过程中，我军老式步枪长期出现卡壳，炸膛等严重问题。在引进欧洲的枪械产线之后，我们将全面改进老式步枪的产线，提升我国步枪的质量。"
  CHI_focus_Specialising_artillery_research: "专精火炮研究"
  CHI_focus_Specialising_artillery_research_desc: "随着我们对近代战争的适应，在无数场战斗的经验总结中，火炮在一场战争中能发挥关键的支援作用。更好的火炮也能移植到坦克上进行更强火力的支援。推进火炮相关的研究，对我们可谓百利而无一害。"
  CHI_focus_Promoting_military_motorisation: "推动军队机动化"
  CHI_focus_Promoting_military_motorisation_desc: "随着军队质量的提升，新的问题已经产生：我们不止需要能够击退敌人，也需要能够追上去，抓捕、消灭敌人，这光靠步兵的两条腿是难以做到的。如今我们产能充沛，可以造出更多的摩托以及机械战车供我们的步兵进行突击，这正是未来战争的方向，我们将坚定推动我军的全面机动化发展。"
  CHI_focus_logistical_support: "稳定后勤支持"
  CHI_focus_logistical_support_desc: "虽说皇帝不差饿兵，但哪怕出现一个饿兵，都可能对我国的军队战斗力造成危害。在过去我军缺乏统一的后勤兵体制，我军的后勤供给时常出现士兵饥饿的情况，要避免出现士兵挨饿，缺乏火力战斗的情况，我们就需要完善我国的后勤制度，保证我们的士兵吃得饱饭，打得起子弹。"
  CHI_focus_Improvements_military_equipment: "改进军械"
  CHI_focus_Improvements_military_equipment_desc: "过往的军工厂制度主要依靠官办下发指标。由于无奖无罚的情况，我们的军械质量处于一个数量不足，且质量低下的情况。如今帝国需要迅速提升军械质量，给予各大军械企业一定资金进行设计改善是一个好的办法。"
  CHI_focus_follow_west_weapon: "跟进西式军械制造"
  CHI_focus_follow_west_weapon_desc: "不可否认的是，我军在军械制造上严重落后于西方，特别是在各种支援武器以及炸药、喷火器等攻坚项目上，西方较我国有着显著的优势。要想不在发展的过程中被西方彻底甩开，我们就需要成立特别的军械研究所，对西方的优势进行研究，奋起直追。"
  CHI_focus_Western_tactics: "西方战术"
  CHI_focus_Western_tactics_desc: "西方人的优势不止在于军备上的领先，还有根据科技发展所提出的战术总结和概念提出和完善，他们的很多基础性战术甚至由普通军官提出，而我国基层军官缺乏相关的能动性，在军事概念上缺乏创新。在这一点上，我们应当学习西方人的创新精神，根据军械的发展跟进相关战术的完善。"
  CHI_focus_develop_TeSe_military_equipment: "研制中国特色军械"
  CHI_focus_develop_TeSe_military_equipment_desc: "虽说我国军事发展在总体上落后，但外国的武器装备在我国很容易出现水土不服的情况，损坏和报废都时有出现。而我国本土研究的火炮虽然火力较差，但使用质量较好，我们可以根据近代战争的情况研究中国特色的军械，减少对外依赖的同时为我国步兵提供更稳定的支援"
  CHI_focus_Eastern_tactics: "东方战术"
  CHI_focus_Eastern_tactics_desc: "我神州屹立至今，自有一套军事战术法则：以我国充足的军队规模为基础，依靠火炮摧毁敌人的突击，与敌进行长期消耗，直至压垮敌人。这一战术虽然被洋人耻笑为乌龟战术，但这正是符合我神州国情的战术，毕竟，他们可没有像我们一样规模的战争经验，也没有我们一样的充足的士兵，扬长避短，正是我神州武备之根本。"

 ###海空军
  CHI_China_Navy:  "神州海军"
  CHI_China_Navy_desc:  "在甲午海战之后帝国的海军就一蹶不振，如今战争的阴云再次降临东亚，正在崛起的樱花国对我国虎视眈眈，强大的圣杯王国依然占据着我们的领土，没有强大的海军是无法与他们对抗的。"
  CHI_Expansion_of_the_dock:  "扩建船坞"
  CHI_Expansion_of_the_dock_desc:  "我们需要建立更多船坞来造更多的船。"
  CHI_Weihaiwei_Construction:  "威海卫建设"
  CHI_Weihaiwei_Construction_desc:  "威海卫位于黄渤海之间，是北洋水师的基地所在，重要的战略地位使其成为兵家必争之地，我们必须要强化这一重要地区。"
  CHI_New_Naval_Academy:  "新建水师学院"
  CHI_New_Naval_Academy_desc:  "为了培养更多的海军人才，新的水师学校将被建设。"
  CHI_Transform_the_old_expulsion:  "改造旧驱逐"
  CHI_Transform_the_old_expulsion_desc:  "在海军中尚有一些老旧的驱逐舰在服役，这些军舰现在早已落伍，但就这样退役实在可惜，还是对其进行改造以适应现代海战的需要。"
  CHI_Introduce_foreign_designs:  "引进外国设计"
  CHI_Introduce_foreign_designs_desc:  "几份从国外高价购进的军舰图纸已经送达，这对我们的军舰研究有很大帮助。"
  CHI_Reorganization_of_the_Admiralty:  "重整海军部"
  CHI_Reorganization_of_the_Admiralty_desc:  "甲午惨败后帝国高层一度失去了对海军的信心，海军部也被缩编，如今我们决心发展海军，海军部也必须进行重整。"
  CHI_New_cruiser:  "新式巡洋舰"
  CHI_New_cruiser_desc:  "在引进国外蓝图的基础上，一类新型的巡洋舰已被成功研制出来，预计很快就会投入建造。"
  CHI_Submarine_research:  "潜艇研究"
  CHI_Submarine_research_desc:  "虽然短时间内建立起一支能跟列强硬碰硬的大型舰队很难，但是不妨换一种思路，大量建造较为廉价的潜艇来对敌军舰艇进行偷袭。"
  CHI_Imperial_Marine_Corps:  "帝国海兵队"
  CHI_Imperial_Marine_Corps_desc:  "登陆战也是当今战争的一种常见战术，这就需要我们发展一支专业的登陆部队。"
  CHI_Lessons_of_Jiawu:  "甲午的教训"
  CHI_Lessons_of_Jiawu_desc:  "甲午海战的失败原因是多方面的，其中也包括指挥的失误，我们将从中总结经验教训，防止重蹈覆辙。"
  CHI_Modern_battleship:  "现代战列舰"
  CHI_Modern_battleship_desc:  "巨舰大炮永远是浪漫！"
  CHI_Guard_the_border:  "守卫海疆"
  CHI_Guard_the_border_desc:  "我们必须做好应对敌人登陆战的准备。"
  CHI_Aircraft_carrier_plan:  "航母计划"
  CHI_Aircraft_carrier_plan_desc:  "航空母舰预计会成为未来海战的重要利器，我们决不能落下步伐。"
  CHI_Looking_back_glorious_history:  "铭记历史辉煌"
  CHI_Looking_back_glorious_history_desc:  "历史上的郑和下西洋给予了世人强烈的震撼，极大地扬了国威，而甲午战前我国拥有着亚洲第一大海军，这都是我们不能忘记的辉煌，铭记历史的目的就是为了开创未来。"
  CHI_Go_west_again:  "再下西洋"
  CHI_Go_west_again_desc:  "我们已经拥有了一支庞大而又精良的海军舰队，是时候重现当年郑和下西洋的辉煌了。"

  CHI_china_airforce:  "神州空军"
  CHI_china_airforce_desc:  "作为一战前夕才出现的新兵种，如今空军已经成为各国武装不可或缺的一部分，我们也不能落后于时代潮流。"
  CHI_New_airport: "新机场"
  CHI_New_airport_desc:  "我们要修建更多机场供我们的战机执行任务。"
  CHI_Attach_importance_to_naval_bombers:  "重视海军轰炸机"
  CHI_Attach_importance_to_naval_bombers_desc: "不得不承认的是，在海战中海轰往往比舰炮对射更管用。"
  CHI_New_fighter:  "新型号战斗机"
  CHI_New_fighter_desc:  "随着国际局势的紧张，我们需要控制的空域范围越来越大，旧式的战斗力航程有限，无法完成对各条战线我军的支援。因此，我们需要引进更先进的引擎，设计更强的战斗机机身，保证我们能够更好控制战线上的天空。"
  CHI_Train_pilots:  "培养飞行员"
  CHI_Train_pilots_desc:  "再好的飞机也需要人来开，若是没有高素质的飞行员，我们的飞机就是废铁。在这点上我们应当学习西方，开设足够的航校培养飞行员，向她们科普新锐的空军战术，以此快速提升我国空军的战斗力。"
  CHI_Quantity_first:  "数量优先"
  CHI_Quantity_first_desc:  "我还是想要点数量（认真点这不是EU4）"
  CHI_Quality_first:  "质量优先"
  CHI_Quality_first_desc:  "质量才是最好的！"
  CHI_Destroy_the_enemy_supply_line:  "破坏敌军补给线"
  CHI_Destroy_the_enemy_supply_line_desc:  "战争拼的就是后勤补给，既然我们有了强有力的空军，我们便可发挥我们的优势。敌人可能有强大的防空火力，但当我们摧毁她们一切的抵抗力量，然后将她们的补给线彻底摧毁。我们的敌人便会在前线丧失战斗力，只能乖乖投降。"
  CHI_Destroy_ground_forces:  "摧毁地面部队"
  CHI_Destroy_ground_forces_desc:  "空军最大的优势便是能够越过地面的无数火力，将敌人的高危单位摧毁。有了强大的空军，我们便可在进攻战中摧毁敌人的地面据点，在防守战中摧毁集群步兵和坦克等高危部队，以最小的成本将威胁扼杀在摇篮里。"
  CHI_Strategic_bombing:  "天女散花"
  CHI_Strategic_bombing_desc:  "扼杀敌军补给不止可以摧毁她们的补给线，也可以直接将她们的工厂和基础设施一并摧毁，让她们连生存都出现困难。因此，我们需要强大的轰炸机，这些轰炸机将能够飞至敌国土地上，将重型炸弹能够天女散花一般投下，将敌国的土地炸成一片无间火狱。"

 ###抗樱战争
  CHI_Build_second_capital: "建设第二首都"
  CHI_Build_second_capital_desc: "我们与樱花之间的战端已开。虽有天子守国门一说，但我们也万万不可让天子以及京师万民直面樱花之兵锋，必须做好接下来的准备。经百官商讨，我们已决定在西安地区建设第二首都。天子以及文武百官随时准备在危机时刻转移，保证抗樱大计不失。"
  CHI_Industrial_relocation_plan: "工业迁移计划"
  CHI_Industrial_relocation_plan_desc: "战端一开，除了京师一带，我国广袤海岸线处处都面临樱花的威胁，而这些地区还分布着我国重要的工业区，如果樱花大举发动登陆，我们将失去关键的工业生产能力。因此，必须立刻开始制订并实施工业转移计划，将沿海地区的工业向内陆进行迁移。"
  CHI_Yellow_River_Defense_Line: "黄河防线"
  CHI_Yellow_River_Defense_Line_desc: "京师一带光为平原，一马平川，而樱花有着不弱的装甲部队，一旦北京有失，北方无险可守。对此，总参谋部已经制定了相关的对应计划：我们需要在黄河一线构筑防线，一旦京师沦陷，我方的前线部队需要节节抵抗，有序撤退到黄河防线上，抵抗樱花的南进。"
  CHI_Reorganizing_local_armed_forces: "整编地方部队"
  CHI_Reorganizing_local_armed_forces_desc: "我们必须动员全国范围内的力量上前线，才能抵抗樱花近乎疯子一样的大规模攻势。因此，只靠中央部队是远远不够的，我们需要全面对各个地方的部队进行重新整编，根据不同的战区任务进行相关训练，填补我们守备方面的不足。"
  CHI_Reorganizing_local_administration: "整编地方行政"
  CHI_Reorganizing_local_administration_desc: "如今国家危难，在前线鏖战之时，我们也需要保证各个地方的稳定，为前线提供源源不断的粮饷供应。因此，各个地区行政从今日开始必须进入紧急军管状态，社会之中存在的闲职将被撤销，我们必须重整各个地区的行政制度和运行适应如今的战争状态，以保证为战争高效服务。"
  CHI_Xian_negotiations: "西安谈判"
  CHI_Xian_negotiations_desc: "我们与樱花的战争是一场全民族的生死之战，值此关头，任何的中华儿女都需要成为这场伟大战争的一部分。虽然我们与国民党和共产党等分裂势力都有着深仇大恨，但如果我们再次关头刀兵相向，只会让樱花趁虚而入，让中华沦为樱花的奴隶。我们绝不允许这样的情况出现，天子决定，我们将在西安地区与国民党和共产党等势力开展联合谈判，尽快吸纳她们加入中华统一战线之中，抵抗樱花侵略。"

