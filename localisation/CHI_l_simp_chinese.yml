  CHI_Leizi_desc: "§Y派系§!：§O[Get_Honour_Emperor_Faction_Name]§!\n§Y生平§!：§L麟青砚出身于源远流长的道门世家，年少时便以通晓律法、秉性刚直闻名朝野。她曾官至帝国大理寺卿，在十数载任内以《青砚刑律疏议》整饬法度，因其断案如神、铁面无私而被世人称为“铁面青天”。然而绍熙末年风云突变，激进维新浪潮与五国干涉接踵而至，帝国司法体系在改制中被大幅裁撤。因坚守“法统不可轻废”的古训，与新政理念屡生龃龉，她最终在时代的激荡中黯然去职，返回龙虎山天师府开始了隐居生涯。\n\n隐居期间，她将往昔执法如山的刚毅心志尽数倾注于雷法研修。在观云听涛的岁月里，她以掌心雷沟通天地，借煌煌天威淬炼道心，终使道门神通与律法精神在修行中相融相生。当永和初年重岳亲赴天师府，以“国需正法，道当济世”八字力邀其出山。\n\n望着山河破碎的神州，这位鬓角已染霜华的前朝法臣终于应召。她携着融汇道门精义与法家经验的智慧重归庙堂，誓要以雷霆手段整顿纲纪，为飘摇的帝国重塑法的基石。§!"

