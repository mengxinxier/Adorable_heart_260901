  CHI_shared_Ducu_Zongdu: "督促各地总督"
  CHI_shared_Ducu_Zongdu_desc: "随着京师大局已定，我们终于可以着手审视京师外部的局面，而不幸的是，各省逆贼叛党此起彼伏。尽管我们力量有限，且各地总督忠诚度难以保证。但如果我们不出手，各地忠臣们便会被乱党压垮，到时候我们平定天下便是难上加难。\n\n要镇压各地乱党，就要优先保证各地总督的忠诚，我们需要向各地总督发出电报，咨询她们对帝国的忠诚和镇压反贼所需的帮助，如果她们忠心朝廷，愿如实禀告，我们自会伸出援手。"

  CHI_shared_ChuanYu: "川渝"
  CHI_shared_ChuanYu_desc: "川渝自古以来被誉为天府之国，乃我国西部的战略要塞。随着天下大乱，川渝遂落入共产党之手，她们在此抵抗帝国天兵，反叛天子威严。如今川渝已定，我们需要重建川渝地区，恢复此地区的秩序"
  select_autonomy_SIC: "已在联合国策树中选择了§O放权§Y[SIC.Getnamewithflag]§!§!"
  CHI_shared_YiSheZhiShe: "以社制社"
  CHI_shared_YiSheZhiShe_desc: "自共产党控制川渝以来，她们在此大规模进行所谓‘打土豪，分田地’，在地区建立农会、农业合作社等方式改变地产关系，收买人心。我们要与共产党争人心，便不能完全废除共产党的政策，相反，我们要借力打力，在维持现有的生产关系同时，我们也要建立相关的农业合作社和地方合作社，以宽政示民以利，用时间来逐步洗刷共产党人存在的痕迹。"
  CHI_shared_middle_eco_center: "中部经济中心"
  CHI_shared_middle_eco_center_desc: "川渝地区资源丰富，农业发达，且共产党在此修建了大量的工业设备，让此地有了一定的发展。在我们收复川渝一地之后，我们不仅要压制本地反叛势力，也要着力发展当地的经济，恢复并发展本地工业，力争将本地建成中部新的经济中心。只要广大的老百姓能安居乐业，我们就能获得绝大多数人的支持。"
  CHI_shared_ChuanYu_Restore_direct_control: "恢复川渝直辖"
  CHI_shared_ChuanYu_Restore_direct_control_desc: "终于，经过长时间的努力，我们终于恢复了川渝地区的稳定，川渝一带的共产党残余势力已经不成气候，本地百姓已经重新认可了帝国权威。川渝总督已经上表，希望川渝地区重归帝国直辖。川渝的回归也将意味着帝国天命重归过程的巨大成功。"
  CHI_integration_SIC: "我们将会获吞并§Y[SIC.Getname]§!，获得§Y[SIC.Getname]§!的全部核心与人物"

  CHI_shared_YunGui: "云贵"
  CHI_shared_YunGui_desc: "云贵之地乃西南门户，是我们通往中南的关键要冲。川渝有失之后，曲大人带领九龙部曲在镇守此地之时，开始防御北方共党入侵。她已于近日向中央回复，愿意归附中央，并希望我们能提供及时的援助，抵抗北方共匪。"
  select_autonomy_YUN: "已在联合国策树中选择了§O放权§Y[YUN.Getnamewithflag]§!§!"
  CHI_shared_Clear_communism: "清扫赤匪"
  CHI_shared_Clear_communism_desc: "曲大人呈上来的奏疏表示，在四川地区沦陷于共产党之后，她们便以所谓传播革命为名，向云贵总督府发动了大规模进攻。虽然当前共产党攻势凶猛，但她已从中找出了一定进攻规律，但苦于资源缺乏，无法发动反击。\n\n既然曲大人如此有信心，我们可以帮她一把，为她提供足够的支援，如果成功，一方面能平定川渝之乱，另一方面也能收回云贵大权，可谓一举两得。"
  CHI_shared_reset_SiChuan_Zongdu: "恢复四川总督区"
  CHI_shared_reset_SiChuan_Zongdu_desc: "终于，在九龙众和帝国精兵的攻势下，川渝乱党被我们所击溃，共匪各部作鸟兽散。时隔多年，我们终于收回了天府之国。但现在的川渝各地秩序崩溃，混乱不堪。虽然九龙众可以维持此地治安，但其他方面的稳定措施必须跟上。我们需要及时派出帝国官僚，恢复四川总督区编制，重建西南地区的秩序"
  CHI_shared_bureaucratization_native_officers: "改土归流"
  CHI_shared_bureaucratization_native_officers_desc: "自近代以来，由于国力衰微，我国对于西南边陲之地无法施加有效的管理能力，为了防止西南地区出现叛乱，我们不得不恢复过去的土司制度，依靠当地的土司进行管理。如今帝国国力再度强盛，科技发展，我们也终于能将影响力施加到西南边陲之地。我们会逐个与西南地区的土司进行交流，以合理的条件换取她们放弃对本地的长期垄断地位，中央会以流官代之。如有反抗，六师移之。"
  CHI_shared_Modernisation_ethnic_policies: "现代化民族政策"
  CHI_shared_Modernisation_ethnic_policies_desc: "西南长期以来乃众民族聚居之地，我们要恢复流官制度，便要谨慎处置各民族的管理政策。在这方面我们要做到有所取舍。旧土司时期的制度有利则保留，赋税制度同于内地，但数额较少，并发展教育，移除陋习，以现代化的力量重塑西南各民族对中华的认同"
  CHI_shared_Reunification_southwest: "再一统西南边疆"
  CHI_shared_Reunification_southwest_desc: "经过长久的努力，我们终于实现了云贵地区的流官化发展，各个民族经过短暂的混乱之后重新实现了稳定，我们对云贵的控制更加稳固。现在，帝国将正式撤销云贵地区的军管状态，云贵将再次成为帝国的一个省。"
  CHI_integration_YUN: "我们将会获吞并§Y[YUN.Getname]§!，获得§Y[YUN.Getname]§!的全部核心与人物"

  CHI_shared_LiangGuang: "两广"
  CHI_shared_LiangGuang_desc: "经过血腥的战斗，我们终于摧毁了国民党在两广地区的抵抗，成功收回了两广地区。但这并不意味着我们就能平稳收回两广地区的治权，我们需要开展新一轮的建设，彻底摧毁国民党在此地区的一切影响力。"
  select_autonomy_GXC: "已在联合国策树中选择了§O放权§Y[GXC.Getnamewithflag]§!§!"
  CHI_shared_Clear_KMT: "清查叛党"
  CHI_shared_Clear_KMT_desc: "长期以来，国民党依靠海内外的影响力，不断向内地输送金钱，资本等影响力，甚至收买本地高官，在帝国危难之际发动叛乱。要避免此等乱象再次出现，我们就必须用重典，向两广总督府派出足够的行政官员，对当地涉及叛乱的势力进行彻底清洗，斩断国民党东山再起的可能。"
  CHI_shared_open_port: "开放港口"
  CHI_shared_open_port_desc: "在我们收复两广的战斗中，外国经常对我们发起抗议甚至制裁，她们在国民党控制的两广地区港口一带获取了诸多特权，她们害怕我们收回港口导致她们 利益受损。我们不会再让她们会有诸多特权，但我们可以在贸易方面给他们让步，向她们开放一定港口方面的交易便利，削弱外国对于国民党的支持。"
  CHI_shared_expand_IC_advantage: "扩大工业优势"
  CHI_shared_expand_IC_advantage_desc: "两广地区在工业发展方面也有着较大的优势，此地区资源丰富，且人口众多，在之前便有不错的工业发展。如今帝国收复此地，我们便能够利用原有的工业基础优势，推动本地工业进行更现代的改造，从而让本地区成为对外工业输出的窗口。"
  CHI_shared_Liangguang_restore_control: "恢复两广直辖"
  CHI_shared_Liangguang_restore_control_desc: "经过恩威并施，我们成功摧毁了两广一带国民党在此地的影响力，大量的投入也让带来了丰富的汇报，本地民众对帝国无不竭诚欢迎。木已成舟，我们将重新恢复两广地区的直辖地位，这也代表着帝国对反叛势力的胜利标志。"
  CHI_integration_GXC: "我们将会获吞并§Y[GXC.Getname]§!，获得§Y[GXC.Getname]§!的全部核心与人物"

  CHI_shared_JiangZhe: "江浙"
  CHI_shared_JiangZhe_desc: "作为东南富庶之地，江浙总督府一直是我们控制本地的重要力量，我们以此收取东南地区的赋税。虽然过程艰难，如今我们还是收复了江浙地区一带的控制区。接下来我们需要谨慎的选择治理方式，逐步恢复中央在此地区的控制能力。"
  select_autonomy_JSZ: "已在联合国策树中选择了§O放权§Y[JSZ.Getnamewithflag]§!§!"
  CHI_shared_YangTze_eco_area_build: "长江经济区建设"
  CHI_shared_YangTze_eco_area_build_desc: "作为我国近代以来最早对外开放的地区，江浙一带在国内外资本的投入下形成了复杂的经济区域，无论是工业区，还是附属发展地带，长江一线已经有了稳定的工业基础。这完全可以为我们所用，我们将投入资源，进一步发展长江一带经济情况"
  CHI_shared_keep_pace_with_ShangHai: "与上海接轨"
  CHI_shared_keep_pace_with_ShangHai_desc: "在过去，江浙一带经济完全依仗向上海的输出，主要依仗外国资本进行发展。在上海沦陷于樱花之手后，江浙一带的经济联系随之被斩断，如今我们已收回上海，我们将重新联系江浙与上海的联系，恢复过往的繁荣。"
  CHI_shared_international_economic_zone: "国际化经济区"
  CHI_shared_international_economic_zone_desc: "江浙地带的经济区一直存在着不少的外国投资，我国海外的侨胞再次投入也不少，我们完全可利用她们的资本发展本地经济。过去的混乱情况打断了本地的经济发展，如今我们恢复了秩序，便可以通过进一步的开放政策，推动本地区的国际化发展，进一步吸引外资和技术。"
  CHI_shared_SouthZhiLi_Restore_control: "恢复南直隶直辖"
  CHI_shared_SouthZhiLi_Restore_control_desc: "通过我们的有效经营，江浙一带的秩序得到完全恢复，资本开始滚滚流动，洋人在我们面前也不得不低下头颅，和我们好声好气的商谈商业，这是帝国的伟大成功。我们也终于可以彻底恢复南直隶地区的管辖权力，结束本地的军管情况。"
  CHI_integration_JSZ: "我们将会获吞并§Y[JSZ.Getname]§!，获得§Y[JSZ.Getname]§!的全部核心与人物"

  CHI_shared_MinGan: "闽赣"
  CHI_shared_MinGan_desc: "自天下大乱以来，为了保证东南剿匪一事，我们在闽赣一带设置了东南剿总司令部，对各地乱党进行镇压。如今乱贼束手，我们将重新审定东南剿总司令部的存在地位。"
  select_autonomy_FUJ: "已在联合国策树中选择了§O放权§Y[FUJ.Getnamewithflag]§!§!"
  CHI_shared_MinGan_eco_build: "闽赣经济建设"
  CHI_shared_MinGan_eco_build_desc: "在过去，作为对内镇压的军官地带，闽赣一带长期缺乏有效的经济发展，民生凋敝。如今我们要恢复本地的发展，便要为本地区重新发展民生，保证闽赣一带经济能够与帝国全局实现联动。"
  CHI_shared_rebuild_QuanZhou_Port: "重建泉州港"
  CHI_shared_rebuild_QuanZhou_Port_desc: "泉州港曾是我国东南贸易的重要支点，但自天下大乱以来，为防御国民党以及樱花的渗透，我们不得不关闭了泉州港。如今天下已定，我们将重新恢复、开放泉州港，它将成为我们东南贸易的新支点。"
  CHI_shared_rebuild_QuanZhou_Port_tt: "在§Y泉州§!获得2建筑位和船坞"
  CHI_shared_FuJian_NRI: "福建海军研究所"
  CHI_shared_FuJian_NRI_desc: "我中华历史上也有福建水师，但在与外国的交战过程中，福建水师一朝覆灭，海军发展也就此被打断。要接下来的时代让我福建水师迅速追赶外国，我们便需要在恢复福建水师的同时，建立海军研究所，让我们水师能够迅速赶超外国。"
  CHI_shared_FuJian_NRI_tt: "在§Y泉州§!建立一个§Y海军工程设施§!"
  CHI_shared_MinGan_restore_control: "恢复闽赣直辖"
  CHI_shared_MinGan_restore_control_desc: "经过我们的努力，闽赣地区的秩序终于得到稳定，本地的国防需求暂时得到有效缓解，重建的帝国海军已可以保护本地百姓不受外敌侵略。由此，我们将解除东南剿总一职，重新恢复闽赣两省编制。"
  CHI_integration_FUJ: "我们将会获吞并§Y[FUJ.Getname]§!，获得§Y[FUJ.Getname]§!的全部核心与人物"

  CHI_shared_HuGuang: "湖广"
  CHI_shared_HuGuang_desc: "湖广熟，天下足。湖广沃野千里，一直是我国重要的粮产和资源区域。为保本地安全，我们在此设置了湖广总督府以管理。如今帝国已收复湖广一带，我们将审视当前情况，抉择本地的未来发展。"
  select_autonomy_WUH: "已在联合国策树中选择了§O放权§Y[WUH.Getnamewithflag]§!§!"
  CHI_shared_PingNan: "[CHI_shared_PingNan_LOC]"
  CHI_shared_NanFangYiDing: "南方已定"
  CHI_shared_NanFangYiDing_desc: "自天下大乱以来，南方混乱不堪，帝国子民对于帝国的认同与日俱减，很多人都断言帝国将在此起彼伏的反叛中彻底崩溃。但如今，湖广一带已经恢复稳定，这正是我们需要的一场大胜利。我们将传檄天下，向天下展示帝国天威浩荡，恢弘忠臣志气。"
  CHI_shared_PingDingNanFang: "平定南方"
  CHI_shared_Rebuild_LiangGuang_ZongDu: "重建两广总督区"
  CHI_shared_Rebuild_LiangGuang_ZongDu_desc: ""
  CHI_shared_HuGuang_eco_build: "湖广经济建设"
  CHI_shared_HuGuang_eco_build_desc: "长期以来，湖广地区的工业以纺织和农产品加工为主，发展潜力薄弱，规模较小。我们要提升本地经济发展，便要逐步提升本地的经济规模，引入一批发展潜力大的工业企业，提升本地经济规模，吸引就业，促进本地发展。"
  CHI_shared_HuGuang_restore_control: "恢复湖广直辖"
  CHI_shared_HuGuang_restore_control_desc: "通过我们的努力，湖广的秩序得到了恢复，引入的工业已经大幅度提升了本地经济的规模，人民对于帝国的认同与日俱增。我们终于可以以发展的成功恢复湖广一带的秩序，撤销总督府，恢复帝国对于湖广两省的直辖地位。"
  CHI_integration_WUH: "我们将会获吞并§Y[WUH.Getname]§!，获得§Y[WUH.Getname]§!的全部核心与人物"

  CHI_shared_LiaoMan: "辽满"
  CHI_shared_LiaoMan_desc: "在消灭满洲当地分裂政权后，我们成功在此建立起辽满政府，作为帝国在东北地区的临时监管政府。东北诸多当前与帝国分离久远，张氏，樱花等势力对此地留下了太多影响力，我们必须谨慎抉择，重新恢复天子在此地区的权威。"
  select_autonomy_MAN: "已在联合国策树中选择了§O放权§Y[MAN.Getnamewithflag]§!§!"
  CHI_shared_Utilising_Japanese_companies: "利用樱资企业"
  CHI_shared_Utilising_Japanese_companies_desc: "在过去的十几年间，樱花在东北地区进行了大规模的工业以及铁路建设，但这并非好意，而是她们图谋东北的手段，而且她们的建设质量极差，与国内建设标准相差甚多，我们可以利用樱花资本重新恢复本地经济，但接下来的工业发展，应以我们为准。"
  CHI_shared_rebuild_concept_of_imperial: "重建皇权观念"
  CHI_shared_rebuild_concept_of_imperial_desc: "东北分离我国多年，众多分离势力都在此大肆宣传分离主义思想，从张氏四民，本地割据，到樱花所谓满洲复兴，崖山后无中华等之理论都在此毒害我国百姓，此诚可恨。我们必须彻底的铲除这些思想的任何载体，并重新恢复儒家教育体系，重建天子皇权在东北百姓中的影响。"
  CHI_shared_Exploitation_Northeast_Resources: "开采东北资源"
  CHI_shared_Exploitation_Northeast_Resources_desc: "东北地区分离日久，虽然各个分裂势力都试图以此地区资源发展工业，但她们发展水平较差，导致大量资源严重浪费，且未惠及百姓。现在轮到我们，我们会重新勘定本地地利，合理开发本地资源和工业，有效提升本地的工业实力。"
  CHI_shared_integration_LiaoMan: "整合辽满"
  CHI_shared_integration_LiaoMan_desc: "通过我们累年以来不计回报的投入，我们在辽满地区终于建立起正常的秩序，各地反贼被天兵诛灭，分裂思想得到铲除，在帝国的带动下，对东北的开发甚至带动了此地区新一轮发展。接下来我们将正式将辽满几省收归中央直辖，这将成为天子攘除奸邪，横扫六合的重要标志。"
  CHI_integration_MAN: "我们将会获吞并§Y[MAN.Getname]§!，获得§Y[MAN.Getname]§!的全部核心与人物"

  CHI_shared_QinJin: "秦晋"
  select_autonomy_SHX: "已在联合国策树中选择了§O放权§Y[SHX.Getnamewithflag]§!§!"
  CHI_shared_QinJin_desc: "秦晋乃京师之钥匙，连通我们多省要地，且出产大量煤炭，资源丰富，战略位置极其重要。在帝国实现对秦晋之地的完全控制后，本地士绅上表希望天子能恩准她们一定自治的机会，而朝堂上也有希望在秦晋实现一些发展模式的声音，这两种声音都需要当今天子予以定夺。"
  CHI_shared_QinJin_autonomy: "秦晋自治"
  CHI_shared_QinJin_autonomy_desc: "经过定夺，我们决定采纳秦晋士绅的意见，予以山西当地以自治省的地位，让他们进行一定的自治。当然，这并非我们发善心，我们是要在秦晋一地实验资源与经济发展的相关关系，为我国未来的工业发展决定方向。"
  CHI_shared_QinJin_autonomy_available: "秦晋地区的命运：已选择§Y秦晋自治§!"
  CHI_shared_Investment_QinJin: "投资秦晋工业"
  CHI_shared_Investment_QinJin_desc: "自煤炭工业发展以来，秦晋一地便聚集了我国一定的工业企业，这些企业依靠本地煤炭进行生产，本身水平不高。作为承诺，我们会给予她们一定的投资，试验她们本身的发展能力。"
  CHI_shared_stop_economic_experiment: "结束经济实验"
  CHI_shared_stop_economic_experiment_desc: "通过一段时间的经济实验，我们不难发现，本地的士绅在发展工业上往往依仗之前的发展经验，对提升总体能力缺乏认识，甚至试图对天子旨意阳奉阴违。闹剧该结束了，我们将结束这场实验，将全国经济统一发展。"
  CHI_shared_Remove_QinJin_Autonomy: "收回自治区"
  CHI_shared_Remove_QinJin_Autonomy_desc: "通过经年的秦晋自治，我们得出结论，天子治下必须中央重点管理，任何放任发展都可能造出严重的损失。自此，我们将收回山西当地的自治权，本地将重回天子治下，我们也会加大投入，弥补本次实验带来的损失。"
  CHI_integration_SHX: "我们将会获吞并§Y[SHX.Getname]§!，获得§Y[SHX.Getname]§!的全部核心与人物"
  QinJin_governor_is_working_on_it: "§R秦晋总督正在进行这项国策§!"
  CHI_shared_Model_Province_Shanxi: "山西模范省"
  CHI_shared_Model_Province_Shanxi_desc: "最终，我们决定采取朝廷诸公的建议，不予以山西自治权，而是派出天子新军，以重岳将军为首前往秦晋，建立山西模范省。我们将在此地进行新型省治的具体方法。"
  CHI_shared_Model_Province_Shanxi_available: "秦晋地区的命运：已选择§Y山西模范省§!"
  CHI_shared_recall_ChongYue: "召回重岳"
  CHI_shared_recall_ChongYue_desc: "经过一段时间的治理，我们在山西的治理取得了一定的成就。与此同时，朝野内外出现了一些传言，宣称重岳将军有自立之心。我们不然不信此等谣言，眼下山西建设有所成就，且为了平定悠悠之口，我们有必要召回重岳将军，向他咨询山西建设的相关情况。"
  CHI_shared_Imitating_JinArmy_training: "仿照晋军训练"
  CHI_shared_Imitating_JinArmy_training_desc: "在重岳将军的亲口叙述中，他在山西当地广招年轻兵士，从头开始学习西洋兵法知识，辅以儒家伦理，在几个月的山地训练后，便足以匹敌一众本地老兵。这种经验值得我们学习，我们完全可以将这种经验向帝国中央军进行推广。"
  CHI_shared_promotion_QinJin_mode: "推广秦晋模式"
  CHI_shared_promotion_QinJin_mode_desc: "经过一段时间的实验，我们得出结论，我们在秦晋实验的这种复兴儒家经典，中学为主西学为辅的模式成功的提高了本地人的综合素质，且压制了当地士绅的气焰，我们将逐步向各省推广秦晋模式，力求在全国范围内建成模范省区域"

  CHI_shared_XiBei: "西北"
  CHI_shared_XiBei_desc: "西北几省一直是京师通往内蒙西部和新疆的重要通道，但在帝国陷入混乱之际，马家拥兵自重，让我们失去了对西北的影响力。如今西北重归我手，我们将重新审视对这片地区的管理模式。"
  select_autonomy_XSM: "已在联合国策树中选择了§O放权§Y[XSM.Getnamewithflag]§!§!"
  CHI_shared_Remove_bandit: "清扫土匪"
  CHI_shared_Remove_bandit_desc: "在帝国天兵平定西北后，留给我们的便是满目疮痍，马家，共产党和分裂份子的长期交战导致本地毫无治安，土匪盛行，百姓民不聊生。乱世需用重典，我们要做的第一件事，就是派出重兵，剿灭此地诸多土匪叛贼。"
  CHI_shared_ethnic_autonomy: "民族自治"
  CHI_shared_ethnic_autonomy_desc: "西北各地在历史上就是各民族聚集之地，在马家治理时期，她们放任各民族仇杀以维持统治，而共产党实行的民族自治保证了本地民族的一定和谐，我们应当把这个制度拿过来，继续稳定本地民族关系。"
  CHI_shared_Northwest_Development: "西部大开发"
  CHI_shared_Northwest_Development_desc: "西部长期积贫积弱便来自此地区毫无发展的时间，但其实本地资源极其丰富，且通往西域各国，如有发展便可有一番成就。经今上恩准，我们将投入一笔巨款进行西部各省建设，重振西部丝路的繁荣景象。"
  CHI_shared_integration_XiBei: "整合西北"
  CHI_shared_integration_XiBei_desc: "经过我们经年的治理，西部终于不再是马匪横行，仇恨不断的死亡之地，它已经逐步成为了新的经济文化发展中心。从此开始，我们也将进一步推动新一轮的移民计划，在西北地区的增强中华民族的向心力，推动西北各省正式回归天子治下。"
  CHI_integration_XSM: "我们将会获吞并§Y[XSM.Getname]§!，获得§Y[XSM.Getname]§!的全部核心与人物"

  CHI_shared_XinJiang: "新疆"
  CHI_shared_XinJiang_desc: "新疆乃我国西北国门。历史上，无论是圣杯还是俄罗斯都试图染指本地政权，以此入侵我国西北。此地的重要性不言而喻，为此，我们必须谨慎选择本地治理之法，防止让外国势力有可乘之机。"
  select_autonomy_SIK: "已在联合国策树中选择了§O放权§Y[SIK.Getnamewithflag]§!§!"
  CHI_shared_bridging_ethnic_divides: "弥合民族裂痕"
  CHI_shared_bridging_ethnic_divides_desc: "在天下大乱的势头中，新疆也出现了大量的分裂势力，有些试图导向俄人，有些试图割据自立，她们都选择了在新疆各族间制造冲突，试图达成民族分裂的现实。所幸我们还在，我们将戳穿她们的把戏，好好扒开她们的心晾一晾，让新疆各民族看看谁才是真正的好人。"
  CHI_shared_set_XinJiang_WeiSuo: "成立新疆卫所"
  CHI_shared_set_XinJiang_WeiSuo_desc: "新疆地处边陲，各个外国势力对此都虎视眈眈，如果我们不立下一支重兵，我们可能对外国的入侵无法予以有效抵抗。为此，经朝堂审议，今上将建立新疆卫所，增强对新疆一地的军事存在"
  CHI_shared_Give_some_ethic_aotonomy: "给予部分民族自治"
  CHI_shared_Give_some_ethic_aotonomy_desc: "新疆的民族问题比西北更甚，此地汉族为少数，如果我们贸然予以汉中心发展，很容易为分裂势力提供口实。因此，我们需要更加谨慎，我们将给予本地部分民族以自治权，她们将有权力在本地民族委员会中参与新疆政务，我们要因地制宜，以稳定团结为主，保证新疆治理的有效发展。"
  CHI_shared_back_to_center: "回归中央"
  CHI_shared_back_to_center_desc: "经过我们稳中求进的治理，新疆这片西北大门终于恢复了稳定，各族无不叹服今上天威，各路宵小也逐个被捕杀，我们对于西北的控制力逐步增强。现在，是时候收回新疆一地，彻底摧毁外夷对我国西北的觊觎之心了。"
  CHI_integration_SIK: "我们将会获吞并§Y[SIK.Getname]§!，获得§Y[SIK.Getname]§!的全部核心与人物"

  CHI_shared_XieLaGe: "谢拉格"
  CHI_shared_XieLaGe_desc: "谢拉格一地地处高原，历史上此地与我国交情颇深，近代以来本地领袖希瓦艾什家族更是久慕王化，在抵御圣杯势力入侵高原上多有功劳。如今谢拉格一事已定，我们将谨慎抉择这片高原净土的未来。"
  select_autonomy_TIB: "已在联合国策树中选择了§O放权§Y[TIB.Getnamewithflag]§!§!"
  CHI_shared_institutional_reform: "制度改革"
  CHI_shared_institutional_reform_desc: "谢拉格在古代便实行所谓蔓珠院的宗教管理政策，但从我们的调查来看，蔓珠院的长老选拔颇为古老，且权钱交易严重，圣女选拔更是草菅人命。我们不会骤然废除这些制度，但会对其进行改革，革故鼎新，以更人道，更现代的方式进行改革。"
  CHI_shared_Highland_Modernisation: "高原现代化"
  CHI_shared_Highland_Modernisation_desc: "在外人看来，谢拉格只是一片荒芜的高山，但在我们到达此地之后发现，谢拉格本身在希瓦艾什家族的建设下已经有了一定的现代化成就，他们也在试图与外界沟通，但由于担心外国渗透，而脚步缓慢。现在我们将承担这个责任，在增强本地驻军的同时，我们会逐步推广希瓦艾什家的现代化政策，推动谢拉格的现代化进一步发展。"
  CHI_shared_integration_XieLaGe: "整合谢拉格"
  CHI_shared_integration_XieLaGe_desc: "感谢谢拉格的希瓦艾什家族，在他们的有效帮助下，我们对于谢拉格的掌控逐步稳固，宗教长老们对我们的阻扰被我们所排除，反抗者被我们所驱逐，本地民众对于现代化生活的接受也让天子教化逐步深入人心，我们终于可以将这片远离中原日久的高原，收归天子治下。"
  CHI_integration_TIB: "我们将会获吞并§Y[TIB.Getname]§!，获得§Y[TIB.Getname]§!的全部核心与人物"

  CHI_shared_Mongolia: "蒙古"
  CHI_shared_Mongolia_desc: "蒙古乃旧清之藩属，我朝顺天命灭清平乱，蒙古也随之成为我朝属国。当今民族危难之际，蒙古受帝俄流亡者以及本地部分住民鼓动，脱离了我国控制，如今蒙古再入我手，我们将采取合理的措施，收复蒙古人心。"
  select_autonomy_MON: "已在联合国策树中选择了§O放权§Y[MON.Getnamewithflag]§!§!"
  CHI_shared_promotion_Inner_mongolia_system: "推广内蒙制度"
  CHI_shared_promotion_Inner_mongolia_system_desc: "蒙古一地离中原甚远，如果我们贸然以流官进行治理，很容易出现人生地不熟，民族治理很容易出现混乱。因此，我们当效仿我们在内蒙的治理方式，尊重本地各族文化，加以经济支持，优先稳定本地人心。"
  CHI_shared_Mongolian_land_HanHua: "蒙地汉化"
  CHI_shared_Mongolian_land_HanHua_desc: "在蒙地与中原分离的多年以来，蒙地汉人大量逃亡，汉文化在此的影响力也逐步退化，这也为分裂势力绑架民众反抗天子提供了群众支持。要根除这种情况，我们便要重新在此进行教化，推动汉化教育在蒙地的回归，教导蒙地民众何为仁义。"
  CHI_shared_grassland_industrialisation: "草原工业化"
  CHI_shared_grassland_industrialisation_desc: "仓廪实而知礼节 衣食足而知荣辱。正是草原民众生活困难，才使得反抗势力能够吸引乱党加入。我们没法让草原民众有无穷的牧场，但我们可以引入工业化，让牧民们可以科学的在牧场经营，让普通民众在工厂里工作，人人有饭吃，才更不容易乱。"
  CHI_shared_integration_Mongolia: "整合蒙古"
  CHI_shared_integration_Mongolia_desc: "经过长期治理和投入，我们终于赢得了蒙古人心，各族百姓在此有了不同的工作，外国乱匪被我们剿灭或驱逐，混乱的人心得到纠正，蒙古一带已逐步成为帝国北疆新的发展重心。我们也将正式确定蒙古的省治地位，正式收回蒙古治权。"
  CHI_integration_MON: "我们将会获吞并§Y[MON.Getname]§!，获得§Y[MON.Getname]§!的全部核心与人物"

