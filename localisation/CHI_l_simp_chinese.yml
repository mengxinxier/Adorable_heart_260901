  CHI_Qian_daizhi_desc_1: "§Y千岱芷§!\n§Y$prince_of_terror$§!\n  - $MODIFIER_RESISTANCE_DAMAGE_TO_GARRISONS$：§G-25.00%§!\n  - $MODIFIER_FOREIGN_SUBVERSIVE_ACTIVITIES$：§G-30.00%§!\n  - $MODIFIER_GLOBAL_NON_CORE_MANPOWER$：§G+2.00%§!"
  CHI_Qian_daizhi_Diplomacy_desc: "§Y千岱芷§!\n@CHI§Y[FROM.Getname]§!的§Y内阁大学士§!\n\n§Y$prince_of_terror$§!\n  - $MODIFIER_RESISTANCE_DAMAGE_TO_GARRISONS$：§G-25.00%§!\n  - $MODIFIER_FOREIGN_SUBVERSIVE_ACTIVITIES$：§G-30.00%§!\n  - $MODIFIER_GLOBAL_NON_CORE_MANPOWER$：§G+2.00%§!"
  CHI_Qian_daizhi_desc: "§Y派系§!：§O[Get_Honour_Emperor_Faction_Name]§!\n§Y生平§!：§L千岱芷出生于1917年。她的家族——“千家”，起源于太祖时期。太祖皇帝为了建立一支绝对忠诚于己的秘卫体系，从秦淮河赎买了一位具有猫耳娘特征、眼神不屈的女子，为其取名“千两”，千家由此诞生，并世代掌管皇家内卫。\n作为千家后代，千岱芷在7岁时就被选入当时太女蒋丽华的内卫班底，成为其贴身护卫和玩伴。她与蒋丽华一同成长，建立了深厚的主仆情谊与个人忠诚。\n\n在先帝（蒋瀚宸）去世前，千岱芷正式接任皇家内卫统领之位，成为新一任千家家主。与此同时，前任老统领遵循千家“世代誓约”，带领所有可能不服新皇的旧部为先帝殉葬，以此为新皇蒋丽华扫清潜在威胁，彰显了千家对蒋氏王朝极端而残酷的忠诚。\n她是一位自幼被培养、完全忠于蒋丽华个人的“暗影守护者”。在其就任初期，当她的主要精力放在为蒋丽华应对两广叛乱的阴谋时，突如其来的皇城惊变让她措手不及，使其陷入了巨大的职责危机之中。§!"

