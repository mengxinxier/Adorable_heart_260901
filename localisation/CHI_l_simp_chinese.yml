  CHI_gambling_of_SIK: "新疆博弈"
  CHI_gambling_of_SIK_desc: "龙旗在西陲的风沙中。紫禁城的诏令，翻越祁连山后已失了雷霆之威；北境强邻的巨掌已穿透帕米尔高原的雪线，觊觎着商道与矿藏；天山南北，更有乱党如野火起势，在绿洲与戈壁间割据称雄。朝廷的驿马疲于奔命，军报如雪片，却追不上烽火的蔓延。既要提防贪婪的熊掌攫取伊犁，又须剿灭腹地豺狼。这片高祖浴血换来的疆土，如今在黄沙与权谋的漩涡里，正一寸寸变得滚烫而难以把握。\n\n@CHI§O[CHI.GetNameDef]§!的点数：[?global.gambling_of_SIK_var_CHI]\n@SOV§R[SOV.GetNameDef]§!的点数：[?global.gambling_of_SIK_var_SOV]\n§Y新疆独立势力§!的点数：[?global.gambling_of_SIK_var_SIK]"
