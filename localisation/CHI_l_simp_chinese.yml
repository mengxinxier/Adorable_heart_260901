  CHI_shezhengwang_desc: "§Y派系§!：§O[Get_Honour_Emperor_Faction_Name]§!\n§Y生平§!：§L蒋傅说出身宗室旁支，早年事迹不详。其军事生涯的辉煌起点在西北戈壁。在帝国统一战争中，他长期戍守帝国西陲，与各地的割据势力及民族武装作战，在严酷的环境中磨练出坚韧不拔的意志和丰富的野战经验，被誉为“戈壁之狐”。他的忠诚与战功获得了太祖蒋世渊的赏识，被委以重任，成为帝国在西部的重要军事统帅，并因功受封楚王。\n\n1933年，宣宗蒋瀚宸病重，在驾崩前为幼女蒋丽华的即位铺路。鉴于朝廷内部派系倾轧（袁克定、革新派）、地方军阀尾大不掉的危局，皇帝做出了最后的布局：将年迈、忠诚且资历足以服众的楚王蒋傅说选定为首席摄政王，与黎星刻、康佑薇共同辅政，但决定权全权由楚王受理。\n\n然而，此时的帝国已病入膏肓。§!"

  South_Army_leader: ""
  CHI_Nian_desc: "§Y派系§!：§R中共§!\n§Y生平§!：§L作为四川著名的铸造大师兼烂戏编剧，年本应与政治无缘，但在1933年，迫于汹涌的民意，四川行省的老总督被撤职，蒋瀚宸急需一个在四川富有名望的新总督来平息民愤，这时候，年被推举了出来。\n\n新官上任，年顺应民意停止了四川军的大规模军事活动，并逐步开始恢复民生工作。通过自己的姐姐黍，年与川北根据地达成了秘密合约，并在接下来的时间里，得到了来自于黍的宣传和教育，并在耳濡目染中逐渐接受了社会主义思想，于1935年2月正式成为了一名秘密党员。\n\n年对社会主义的理解还相当质朴，加上自己较为随性的性格，年在党内并没有明确的政治倾向。§!"
  TRB_19hao_CHI_advisor_desc: "§Y派系§!：§Y中立§!\n§Y生平§!：§L“芭岩铁路19号专用铁路”的铁路人偶，在来到神州之前，她在远离都市喧嚣的矿山镇山区线路上，与鸭鹅为伴悠闲地生活着。\n\n§Y重要信息：19号是来援助神州的铁路建设的，并不会参与任何政治斗争。§!§!"

