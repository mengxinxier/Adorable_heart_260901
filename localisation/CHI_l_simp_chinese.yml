  China.050.title: "出山"
  China.050.desc: "在周恩莱等几个前中共领导重回政坛的前夕，人们都得知了天安门广场将举行盛大的群众游行活动。\n北京大学1937级学生将代表北大参加大学生方队游行。当年暑假，这些北大学生没有休几天假，就提前返校开始紧张的训练，练队列、喊口号、跳集体舞。\n一月前，上面发了统一的服装，还发了彩纸，让学生们扎成花束，还有小彩旗。这期间，她们参加了天安门广场游行的预演。\n前一天晚上，几个学生在28号楼宿舍203房间里扎花，心情都很兴奋。\n大家边扎花边议论明天的活动，突然有人说：“明天的游行，我们能不能偷偷带点什么进去，能展现我们个性的东西？”于是有同学就说：“咱写点什么，做个横幅，让全世界看看。”她的提议得到了大家一致的赞成。\n大家七嘴八舌议论起来，主要还是围绕着大的形势。“振兴中华”被别人说过了，没有创意；“教育要改革”“加快民主改革步伐”等没有特色。一个个口号被提出又被否定。附近宿舍的几个同学也加入进来。\n这时，有人提议表达一下对周恩莱同志的感情，因为当时中共在华西的统治有好几年了，成效也非常显著。这些学生都是社会主义的支持者。大家都想表达对周恩莱同志的爱戴之情。有人提出写“周主席万岁！”，但这种“封建”式的口号立马被大家否定了。最后决定直接问声好，就写“尊敬的周恩莱同志您好”，但是又觉得句子长了点；就写“周恩莱同志您好”。大家越是议论，越是胆大，把姓氏也省略掉，干脆直呼“恩莱同志您好”。于是，有同学就拿来几张纸，一时找不到那么大的毛笔，就用宿舍里擦桌子的抹布，卷成小棒棒，蘸着墨汁写下了“恩莱同志您好”六个大字。\n字写好了，怎样做成横幅呢？想来想去，只好用床单，把六个大字粘在上面。这时，大家一致瞄准了其中一位同学的床单，因为比较新。这位同学边从床上边撤床单边说：“这可是个新床单。”\n把六个大字往床单上一比划，床单不够长。\n这时不知谁说了一句：“把‘同志’两个字也省去吧。”这句话一出来，本来很热闹的宿舍里，一下子静了下来。直接称呼国家领导人的名字，是不是有些不敬？要知道，对长辈、对领导是不习惯直接称名道姓的。再一想，她们又觉得这是对领袖的问候，没有别的意思，不至于上纲上线吧！于是，学生们赶紧把“恩莱您好”四个大字用订书机订在了床单上。\n条幅制作好了，怎么打出来？她们从几个宿舍找了三根长木杆，其中有拖把，把墩布头卸了，只留下棍子，把横幅绑在了杆子上。外面绕以彩带，顶端缀以纸花，横幅成了一把巨大的花束。\n忙完之后，大家立即休息。此时已是凌晨两点，离集合时间只有两个小时了。\n当天凌晨4时，203房间的同学穿上了实验室的白大褂，把横幅藏在了里面。大家乘坐大巴来到东皇城根集合，然后步行经过王府井，到达东长安街。这时，这位同学偷偷将横幅交给了班长。班长排在第一个，几个同学紧随其后，大家用手上的纸花为她们做掩护。\n当北大学生方队走到天安门金水桥东华表时，几个同学一下子打开横幅，队伍欢腾起来。当横幅在万头攒动中出现时，最先是刘少奇同志看到，然后指着横幅请恩莱同志看，周恩莱看后开心地笑了。"
  China.050.a: "恩莱您好！"

  China.051.title: "与黍的谈话"
  China.051.desc: "“京城一别，已是十余年未见了，只是我个当大哥的，可未曾想到我们的重逢会是在这种场合下。”\n“大哥你就别挖苦我俩了，输了就是输了，那条幼龙有没有说怎么处置我们，押送回京？还是就地正法？”\n“年！不得对陛下无礼！但……如果我说你们未必已经输了呢？”\n“何意？”\n“歌功颂德的奏折瞒不住陛下，西南的改变陛下看在眼里，你们来之前，这片土地饿殍遍地，你们来之后，西南的百姓家给人足。另外，哪怕是作为对手，我也必须称赞你们将士的精锐和顽强，若无武器装备和部队规模上的鸿沟，谁胜谁负还尚不可知。”“保证百姓温饱本就是我的职责，只是大哥又为何会说我们‘未必已经输了’？”\n“帝师和陛下至亲之人皆殁于贼人之手，斩杀逆贼后，陛下立誓奋发蹈厉、收拾山河。如今神州已近重归一统，然治理江山之法，帝师先生却来不及倾囊相授，我和令虽为从龙讨逆之臣，但终归只是武将，无力辅助陛下治国。因此，陛下希望继续学习，从经典中学习，也从对手——从你们处学习。”\n“向我们学习？”\n“承蒙圣意，陛下召你们二人入京，希望从你们处知晓你们为何强大，知晓你们是如何将西南边陲建设成如此富饶之地的。当然，陛下广开言路，一同进京的还有五湖四海各执政见的各界人士，你们的理念能否上达圣听，还得看你们的能力，和你们所坚持的道路是否真的正确。”\n“......”\n“如何，年和黍，如果你们愿意的话，我现在就可以派专人互送你们进京。”"
  China.051.a: "“如果幼龙真是这么想的话，那么值得一试”"
  CHI_unlock_cummunism_monarch_road_tt: "待统一全国后，我们将解锁§Q共产君主§!路线"

  China.052.title: "康佑薇逝世"
  China.052.desc: "“大变法”运动的倡导者、天命改革运动的灵魂人物康佑薇先生，于昨日在[CHI.Capital.GetCapitalVictoryPointName]与世长辞。先生毕生致力于在不损害天子权威的前提下，将现代制度引入帝国。他期望通过渐进式的维新，实现君主立宪，以图强国。\n\n在天子年幼、摄政专权的今日，康先生的逝世，使原本就举步维艰的科举改革和重开国会等国策失去了最坚定的精神导师。他的逝去，留下的不仅是悲恸，更是关于帝国未来走向的巨大空白。我们是应继续推行其遗志，争取开明士绅的支持？还是借此机会，巩固皇权，走向绝对集权？"
  China.052.a: "恭送康公"

  China.053.title: "来自西洋的铁路人偶"
  China.053.desc: "铁路人偶——由火车国生产的，控制铁路列车的人形部件。\n铁路人偶可以极大提高铁路运行的效率，当然对我们来说最重要的是——铁路人偶通常具备十分甚至九分的铁路相关经验。\n\n我国极度缺乏铁路相关的人才，而兴建铁路需求大量的铁路人才，为此我们决定从[TRB.GetName]邀请铁路人偶以协助我国铁路发展。结合我国幅员辽阔，多丘陵山地的情况考虑，[TRB.GetName]向我们派驻了有丰富山地铁路行驶经验的“芭岩铁路19号专用铁路”铁路人偶19号。"
  China.053.a: "欢迎您，19号"
  China.053.b: "“我看这铁路人偶似乎可以用于军事啊”"
  CHI_19hao_unit_leader_up_tt: "§G该选项是因为我们有§Y$CHI_Yuan_Keding$§!作为领导人或摄政王§!\n\n这将提拔§Y$TRB_19hao$§!作为陆军将领。"

  China.054.title: "发现兵马俑"
  China.054.desc: "临潼县骊山镇西杨村农民在陵东1.5千米的地方打井时发现几个破碎的用泥土烧制的与真人一样大小的陶俑，经陕西省考古队勘探和试掘，确认这是秦始皇时期的俑。"
  China.054.a: "这是始皇帝显灵了？"

  China.055.title: "[FROM.Getname]要求整编我们的军队"
  China.055.desc: "随着民族统一战线的成立，位于北京的“中央政府”认为我们应该团结在一个旗帜下缓解各方矛盾，统一抗樱，为此其电告我们接受神州帝国军队的整编，将我们的军队整编为帝国军队并在名义上听从中央政府号令。"
  China.055.a: "好"
  China.055.b: "不行"

  China.056.title: "[FROM.Getname]接受了"
  China.056.desc: ""
  China.056.a: "好"

  China.057.title: "[FROM.Getname]要求整编我们的行政"
  China.057.desc: "随着民族统一战线的成立，位于北京的“中央政府”认为我们应该团结在一个旗帜下缓解各方矛盾，统一抗樱，为此其电告我们接受中央政府的命令，将我们的政府改组为神州的特别行政区，在名义上听从中央政府的号令。"
  China.057.a: "好"
  China.057.b: "不行"

  China.058.title: "[FROM.Getname]接受了"
  China.058.desc: ""
  China.058.a: "好"

  China.059.title: "和平统一的设想？"
  China.059.desc: "随着樱花侵略者捏着鼻子承认了在东亚大陆的失败，中华民族第一次赢得了与列强战争的完全胜利。这使得原本依旧混乱不堪的神州大地第一次出现了统一的气象。\n对抗樱战争胜利的亢奋正在演变成对一个新的统一的中华国度的支持。但同时，国内的反战思潮也尘嚣甚上，很显然，民众不会对一个再次挑起内战烽火的神州政府表示欢迎。\n所以，天子提出的，关于和平统一中华大陆的设想已经不再是天方夜谭。不如说，这已经成为了我们必须予以考虑的选项。共产党与国民党人均提出可以组建一个兼具政治协商与和平谈判事宜的联合委员会，讨论将三个足以决定神州大陆之未来的割据政权合为一家的可能性。\n我们可以同意进行谈判，当然，我们会作为和平会议的主导者。"
  China.059.a: "至此，可望九州同矣"
  China.059.b: "中华只能有一个国家，一个帝国，一位天子"

  China.060.title: "[FROM.Getname]邀请我们前往西安进行统一谈判"
  China.060.desc: ""
  China.060.a: "好"
  China.060.b: "不好"

  China.061.title: "[FROM.Getname]接受了"
  China.061.desc: ""
  China.061.a: "好"

  China.062.title: "关于国会"
  China.062.desc: "会议上，三方出现分歧的第一个议题便切中要点，国共两方同意以神州国会为主导组织国家议会。但她们均要求在未来的新议会内部占据多于三分之一的席位。以阻止帝国在一会内部形成长期多数派的局面。我们当然要避免这一最坏的情况发生，好在，国共双方各自也有自己的算盘，我们可以考虑拉拢其中一方迫使另一方就犯，当然，这就涉及我们必须给予对方的一些东西……"
  China.062.a: "在共产主义的威胁下，我们不必再与革命党人继续你死我活。"
  China.062.b: "让蜗居西北的赤色分子帮助我们抑制国民党的影响力。"
  China.062.c: "提出折中方案：根据现有的省区划划分席位"
  China.062.d: "无论如何，帝国的国会，终究归属帝国"

  China.063.title: "关于战后政府"
  China.063.desc: "国民党强烈要求保留他们在南方组建的国民政府，他们声称“无法信任来自中原的帝制思想浓郁的新政府官僚”，要求保留自己在南方的统治体系。好在，这一次共产党人站在我们这边，她们愿意接受中原政府对西北苏区的改编，前提是王室能够对现存的共产党军队予以保留并承诺回去组建一个全方位的联合政府——这很明显是一种威胁，我们只能做权宜之计"
  China.063.a: "不能让南方依旧拥有自己的政府，这样谈不上统一"
  China.063.b: "相比之下，随时可能越过秦岭的痴肥才是肘腋之患"
  China.063.c: "去你妈的，你们全都得听天子节制。"

  China.064.title: "关于军队"
  China.064.desc: "对于和平统一后各个政权军队归属的问题，三方各自都有自己的意见：共产党只希望保留只听从于党的，只为了无产阶级利益而战的红色军队，但她们也提出可以将现有的红军改编为当地的警察部队，负责维持原边区政府的治安管理；国民党则要求必须将军队国家化，在监督完这一过程之后他们才会允许国民党军队并入新的政权。至于神州的军队，国共双方倒是达成了一致意见：必须在近期予以裁撤，以表达神州愿意和平谈判的决心。"
  China.064.a: "同意他们的请求"
  China.064.b: "再怎么说，我们也不能将军队国家化的提案上呈上朝廷"
  China.064.c: "同意痴肥的请求会导致我们彻底失去西北"
  China.064.d: "一个二个废话真多，把枪缴上来就是了"

  China.065.title: "关于帝制的存续"
  China.065.desc: "因为这一议题实在过于重要，所以我们尽可能的将其拖延至会议的最后进行讨论，期间我们对双方都进行了长久而艰难的交涉，但均无果而终，虽然共产党与国民党在很多地方存在巨大的分歧，但在是否要保留帝制这一问题上他们的态度一致而坚决：她们不会接受任何允许帝国及天子继续存在的方案。政治协商会议的未来必须是一个共和国式的代议制联合政府。而非天朝一家之堂。\n同样的，朝廷更加无法接受这一结果，尽管天子本人似乎并不排斥这一点。但朝廷上下无不反对。对她们来说这与叛国无异。我们究竟应该作何答复，还需好好斟酌"
  China.065.a: "妄动国体，兹事体大，还需从长计议"
  China.065.b: "天子既不反对，何须再有疑虑？"

  China.066.title: "谈判成功"
  China.066.desc: "尽管依旧存留着大量的待定事项与未解决的分歧，但三方最终共同达成了一个关于和平统一的总章程。这意味着，三个中国现存的强大政权愿意以民主而非武力的方式解决他们在意识形态上的争端。会议暂定未来的国体为联邦。在组建并选举出新的领导机构之前，政治协商委员会将暂时承担统合全国行政机构的任务。"
  China.066.a: "今日之功，二十四史皆阙其录"

  China.067.title: "谈判失败"
  China.067.desc: "在西安的谈判和平的结束了，很明显用和平的手段解决三方的争端是痴人说梦。会议勉强达成了一份停战协议——当然，在剑拔弩张的中原局势下，它成为废纸的日子也可预见。\n朝廷已下喻旨，要求驱散与镇压国内残存的反战运动，帝国军队重新集结起来准备应对未来的战事——想必其他两家也是如此。"
  China.067.a: "迟了王师南征光复之日，尔等究竟该当何罪？"

  China.068.title: "谈判未能召开"
  China.068.desc: "西安谈判的提案未能吸引到几大势力的兴趣，谈判未能召开。"
  China.068.a: "和平统一的梦该醒了"

  China.069.title: "联邦第一届选举"
  China.069.desc: ""
  China.069.a: "立宪民主党-黎星刻"
  China.069.b: "公车党-符华"
  China.069.c: "国民党-汪兆铭"
  China.069.d: "国民党-蒋介石"
  China.069.e: "共产党-毛润芝"

  China.072.title: "国民党战俘的命运"
  China.072.desc: ""
  China.072.a: "吸纳温和派"
  China.072.b: "去和她们去谈谈"
  China.072.c: "合作或处决"
  China.072.d: "全部毙了"

  China.073.title: "令人震惊的消息"
  China.073.desc: "烟花报报道：\n\n今天本是平平无奇的一天，令人震惊的消息却突然从帝都传向神州八方——帝国首辅，帝国执政党党魁，女皇陛下的至交好友，与女皇陛下一起再造神州，击溃了来犯的樱花帝国，收复了割让的领土的黎星刻先生宣布正式辞去首辅一职\n\n没人知道他为什么这么做，就连在他党内的同僚乃至传闻之中对自己上司暗怀恋慕之意的副手周香凛都向记者就此事表达了震惊，以至于一时之间谣言四起，有人说黎先生是认为自己威望太高怕女皇陛下猜忌才辞去职务，也有人说是因为黎先生艰苦奋斗多年自觉乏力欲要辞职休养，甚至有传出女皇陛下已有恋人，黎先生是为了给女皇陛下的恋人腾位置才辞去的职位，本报对以上言论除最后一条外皆持保留态度，盖因起过分荒谬，帝国上下谁人不知女皇陛下真正心仪之人是谁，怎么可能为了一个莫须有的恋人而逼迫黎先生。"
  China.073.a: "我都看见了些啥啊"

  China.074.title: "喜讯"
  China.074.desc: "距离前任首相黎星刻先生辞职，其副手周香凛继任已过去一个星期，今日的政府公开记者会上新任首辅与司礼监监正麟青砚一同宣布了这个使万民沸腾的喜讯：黎星刻先生即将加封为帝国皇夫，并不日与女帝陛下完婚\n\n现在尊敬的皇夫殿下辞职的原因就很显而易见了：即便他保持首辅的身份与陛下晚婚不会有任何人提出质疑，这也会对他一生极力推行的民主造成冲击，为了自己的爱情与理想，他宁可舍去首辅的权力也要追求人生目标的大圆满，让我们向伟大的皇夫殿下献上敬意！愿吾皇与皇夫大人百年好合，福如东海，寿比南山！"
  China.074.a: "所以婚礼什么时候举办？"

  China.075.title: "大婚"
  China.075.desc: "这不是黄历上的任何良辰吉日，也不是任何胜利日，节日庆典，这一天唯一的特别之处，可能只是女皇陛下在多年前恰好是在这一天与皇夫殿下相识的\n可当晨钟响彻金陵城时，整座帝都却自发地浸入了节日。家家户户的门楣上，一半挂着象征皇家传统的明黄绸花，另一半则系着代表婚礼的朱红缎带——这奇特的搭配，是民间对这一对传奇新人最朴实的理解：既是古老的皇室仪典，又是一对普通爱侣的结合。\n皇城外的广场上早已被肃穆与欢庆两种气氛共同笼罩。身着笔挺军礼服、佩戴金色绶带的帝国禁卫军沿宫墙与广场外围整齐列队，枪刺如林，在晨光中闪烁着冷冽而庄严的光芒。他们构成了严密而肃静的警戒线，将观礼的民众隔在安全距离之外，却又并非隔绝。警戒线之外，人山人海，万头攒动。民众的热情并未被森严的守备压抑，反而在秩序中愈发高涨。\n宫内，大婚之礼的第一项，便是最为庄重的祭礼。\n太庙前的汉白玉广场已被布置成临时的祭坛。中央设三层高台，上层设昊天上帝神位，中层设后土皇地祇神位，下层设蒋氏列祖列宗神主。香案、牲牢、玉帛、粢盛，一应俱全，依古礼陈设，却又在细微处透出新意——用以书写祝文的，不再是传统的竹简或绢帛，而是洁白坚韧的新式纸张；陈列的谷物中，除了传统的黍、稷，还有帝国农学院新近培育的高产稻种。\n大元帅重岳立于祭坛东侧，作为本次特命总司仪。他未着甲胄，一身玄端朝服，上绣山、龙、华虫、宗彝、藻、火、粉米、黼、黻九章，白发肃然，长须垂胸，手持玉圭，身姿如岳峙渊渟，目光沉静地注视着一切。礼部主管麟青砚则立于西侧，深青色云纹官服一丝不苟，手中捧着以朱笔详细标注流程的礼册，神情专注，随时准备应对任何仪轨上的细微调整。\n吉时将至。\n蒋丽华自斋宫步出。她已换下常服，身着玄衣纁裳的祭服，头戴十二旒冕冠，垂旒遮面，庄重无比。玄衣上织日、月、星辰、山、龙、华虫六章，纁裳上绣宗彝、藻、火、粉米、黼、黻六章，十二章纹俱全，象征天子承天受命，统御四方。她手持玉圭，步履沉稳，在女官引导下，缓步登上祭坛。\n黎星刻跟随其后，身着与蒋丽华同色但纹饰简化的玄端礼服，头戴七旒冕冠。作为皇夫，他今日的身份是“亚献”与“陪祭”，位在女皇之侧，稍后半步。"
  China.075.a: "好一对绝代佳人"

  China.076.title: "祭天"
  China.076.desc: "重岳朗声宣号：“维天佑神州，皇帝臣蒋丽华，敢用玄牡，昭告于皇天上帝——”\n蒋丽华于上层祭坛前肃立，双手奉玉圭过顶，而后缓缓下拜。黎星刻随之躬身行礼。礼乐奏响《昭和之章》，编钟清越，笙箫齐鸣。蒋丽华亲诵祝文，声音清越而坚定，透过垂旒传出：\n“嗣天子丽华，谨率皇夫星刻，敢昭告于昊天上帝：丽华以渺渺之身，承祖宗之业，受天命之重。今择贤良，正位中宫，以延国祚，以安黎元。伏惟上帝，歆兹禋祀，永锡祚胤，保我神州——”\n祝文焚于鼎中，青烟直上云霄。蒋丽华将玉圭置于案上，亲执玉爵，酹酒于地，完成初献。黎星刻随后上前，完成亚献之礼。"
  China.076.a: "仅此以告上天"

  China.077.title: "祭地"
  China.077.desc: "移至中层祭坛。此坛以五色土筑成，象征神州大地四方中央。坛中央供奉着象征地祇的黄色玉琮，周围陈列着来自帝国九州的新鲜土壤、五谷、以及象征着山林川泽的模型。阳光洒在坛上，为那些来自田野的谷物镀上一层温暖的金色。\n重岳再宣，声音比祭天时更为沉厚，仿佛与大地共鸣：“维地载万物，厚德无疆，皇帝臣蒋丽华，敢用黄琮、五谷、九州之土，昭告于后土皇地祇——”\n蒋丽华肃立于坛前，双手捧起一掬来自帝国最北疆黑土地上的土壤，将其缓缓撒在坛前，动作轻柔而充满敬意。随后，她接过礼官奉上的玉爵，却不是祭天时所用的清酒，而是清澈的泉水——取自帝国境内最大的江河之源。她将泉水缓缓倾洒于五色土上，声音透过垂旒，带着一种不同于祭天时的、更为温厚而恳切的语调：\n“嗣天子丽华，谨率皇夫星刻，敢昭告于后土皇地祇：坤德载物，养育群生。丽华与皇夫，仰赖厚土，食德饮和。今缔姻好，愿祈地灵：佑我神州，五谷丰稔，山河永固；庇我黎庶，安居乐业，无有灾殃。伏惟地祇，厚德配天，永绥邦本——”\n祝文诵毕，她将祝板置于玉琮之前。随后，她亲手将那些来自帝国农学院的新稻种，与传统的黍、稷一同，郑重地献于祭坛之上。这一举动，既是对古老农耕文明的尊崇，亦是对帝国未来“科技兴农”之路的祈愿与象征。黎星刻陪祭于侧，同样以泉水酹地，完成亚献。整个过程庄重而充满生机，仿佛能让人感受到脚下这片土地蓬勃的生命力。"
  China.077.a: "仅此以慰土地万民"

  China.078.title: "祭祖"
  China.078.desc: "最后移至下层太庙正殿前。此处气氛更为肃穆。蒋丽华与黎星刻面向列祖列宗神主，行三跪九叩大礼。重岳的声音在此处格外低沉而充满敬意：\n“维祖德昭明，皇帝臣蒋丽华，率皇夫星刻，敢昭告于列祖列宗神位之前——”\n蒋丽华褪去了面对天地时的宏大叙事，声音中多了几分属于子孙的孺慕与告慰：\n“不肖子孙丽华，仰承先泽，嗣守丕基。今遵古制，行大婚礼，迎立皇夫黎氏星刻。星刻忠勤体国，德才足辅。伏愿列祖列宗，在天之灵，鉴此诚心，佑我夫妇，同心同德，共保蒋氏宗庙，永固神州山河——”\n礼成。三祭完毕，已是日上三竿。\n蒋丽华与黎星刻退回斋宫，稍事休息并更换礼服。祭服庄重却繁复，接下来的婚礼仪式，需换上更为适宜的大婚礼服。"
  China.078.a: "接下来是不是该证婚了？"

  China.079.title: "婚礼"
  China.079.desc: "当两人再次出现在太庙前广场时，已换上了婚礼的盛装。\n蒋丽华一身正红色的改良式汉服婚袍，以云锦织就，色泽饱满如朝霞，裙裾曳地如流淌的火焰。袍身剪裁流畅，摒弃了过于繁复的层叠，更显轻盈。袖口与衣缘用极细的金银双线绣着连绵的缠枝莲与相对而鸣的凤凰，寓意和美。她头上的钻石冠冕在阳光下熠熠生辉，手中捧着一束红梅与石榴花。\n黎星刻则是一身深青色（近乎于黑）的广袖深衣，以暗纹提花绸料制成，衣摆处用银线绣着若隐若现的竹节纹样，腰间束一条素雅的玉带，悬着一枚羊脂白玉佩。全身上下，再无任何与军旅相关的饰物，唯有通身透着经史浸润过的儒雅与沉稳。\n观礼的人群屏息凝神。周香凛站在文武官员的最前方，目光追随着那对身影。\n重岳再次立于丹陛之上，手持玉圭，恢复了司仪的身份。祭礼的庄严肃穆过后，此刻的气氛转向了婚礼的喜庆与温情，但他的姿态依旧恭谨肃穆，完美地平衡着臣子的本分与仪式主持者的权威。\n“祭礼已成，天地祖宗共鉴。今行大婚正礼，以合二姓之好，以正人伦之始。”重岳的声音浑厚沉稳，清晰地传遍每一个角落。\n两人相对而立。\n重岳的目光平静地扫过二人，语气庄重而典正：\n“咨尔黎星刻，前以宰辅之才，经纬文武，定鼎安邦，功在社稷。今既致仕，尚其德馨。可愿谨守臣节，辅弼内庭，与天子陛下永结同心，共保宗庙？”\n黎星刻向御座方向躬身，而后转向重岳，执臣礼深深一揖：\n“臣星刻谨奉制命。陛下不以臣愚陋，托以腹心。今虽去位，此心不改。愿以余生，敬奉陛下，恪守臣道，永固邦本。”\n重岳微微颔首，目光转向蒋丽华，执圭行礼：\n“陛下承天景命，统御万方。今择贤良，以正坤仪。可愿降尊纡贵，与黎氏星刻共缔姻好，示天下以夫妇之伦，君臣之义？”\n蒋丽华手持玉璋还礼，仪态端庄，声音清晰而温和：\n“朕承祖宗之烈，赖臣工之力。黎卿忠勤体国，德才足称。今纳为皇夫，既合朕心，亦顺舆情。愿共守江山，同享太平。”\n问答之间，恪守君臣之礼，却又在严谨的仪轨中，透出超越礼法的情意。\n接着，在麟青砚的示意下，侍者捧上信物。黎星刻得到的，是一卷以金线捆扎的陈旧奏章——他当年推行《钦定宪法大纲》的第一版手稿副本。蒋丽华得到的，则是一枚温润的田黄石私印，上刻“星霜不改”。\n交换信物，互戴戒指。最后，黎星刻俯身，轻柔地吻了吻蒋丽华的额头。蒋丽华则微微踮脚，将捧花中的竹哨轻轻塞进他胸前的口袋。\n重岳高举玉圭，朗声宣告：\n“礼成！天地祖宗共鉴，百官万民同贺。自今而后，休戚与共，永绥福履。奏乐——”\n黎星刻与蒋丽华携手走下台阶，登上敞篷马车。绕城接受祝福时，蒋丽华倚在黎星刻肩头，轻声道：“祭天祭祖时，我很紧张。”\n黎星刻握紧她的手：“我在你身后。”\n马车经过宫门，蒋丽华的目光掠过城楼。重岳依旧肃立在原处，手持玉圭，身影在夕阳下拉得很长。他并未看向马车，而是遥望着太庙的方向，仿佛仍在守护着刚刚完成告祭的列祖列宗。那身影，沉默而坚定，如同这座帝国本身。"
  China.079.a: "是不是还有婚宴没办？"

  China.080.title: "婚宴"
  China.080.desc: "礼成之后，盛大的婚宴并未局限于宫墙之内。女皇陛下早有明诏：今日举国同庆，皇城开放东、西、南三处宫门外的广场，设“万民宴”，由光禄寺与帝都城内各大酒楼共同操办，流水席不绝，供帝都百姓自由取用。而太和殿前的丹陛与广场，则设“国宴”，款待文武百官、各国使节及有功将士代表。\n宫门之外，景象蔚为壮观。数百张长桌连绵铺开，覆盖着洁白的桌布。桌上陈列的，并非山珍海味的堆砌，而是精心准备的、兼具宫廷雅韵与民间风味的盛宴：玲珑剔透的蟹黄汤包、酥烂入味的金陵盐水鸭、刀工精细的文思豆腐羹、色泽红亮的东坡肉……这些昔日仅供皇室享用的名菜，如今热气腾腾地摆在百姓面前；来自帝国各地的特色美食也汇聚一堂：关中肉夹馍、川渝麻辣火锅（特设清汤区）、岭南烤乳猪、江南定胜糕……象征着帝国疆域辽阔，物产丰饶，民心归附；更有不少受西洋影响的新式糕点，如奶油裱花蛋糕、水果塔等，点缀其间，体现着开放与融合。\n百姓扶老携幼，有序取食，欢声笑语与食物的香气弥漫在空气中。禁卫军依旧在维持秩序，但神情已不似典礼时那般冷峻，偶尔还会帮孩童取一块糕点。这不仅是宴饮，更是一场前所未有的、皇室与民间的共融仪式。\n而在宴会的中心，一场好戏即将上演"
  China.080.a: "有请新首辅献贺词"

  China.081.title: "献词"
  China.081.desc: "宫内太和殿前，国宴的规格更为隆重。百官按品级落座，各国使节衣冠楚楚。宴席采用中西合璧的分餐与自助结合形式，长条餐桌上，银质餐具熠熠生辉，法式焗蜗牛与清蒸长江鲥鱼并列，意大利面与阳春面同陈，香槟塔与茅台酒交相辉映，极尽奢华与包容。\n宴至中酣，按照流程，应由百官之首向新人敬献贺词。出列的，正是接替黎星刻出任帝国首辅的周香凛。\n她今日身着深紫色一品文官朝服，补子上绣着振翅欲飞的云雁，象征其作为文官领袖的地位。乌发严谨地绾成朝髻，仅以一支碧玉簪固定，全身上下再无多余饰物，显得干练而庄重。她手持一卷以金线装裱的贺词，步履沉稳地走至御阶之下，向女皇与皇夫行标准臣礼。\n“臣，内阁首辅周香凛，谨代表帝国文武百官及天下臣民，恭贺陛下、皇夫殿下新婚大喜，永缔良缘.....”她的声音清晰平稳，透着文官特有的冷静与持重。\n贺词引经据典，文采斐然，既颂扬了女皇陛下“承天受命、泽被苍生”的仁德，也高度评价了皇夫黎星刻“功成身退、高风亮节”的品格，并着重强调了在其任内推行宪政、奠定帝国民主基石的“不世之功”。词中充满了对帝国未来在君主立宪框架下繁荣昌盛的期许，措辞严谨，格局宏大，完全符合她作为现任政府首脑的身份。\n然而，当她念到“愿陛下与皇夫，琴瑟和鸣，鹣鲽情深，为天下夫妇之表率”时，目光极其自然地扫过御座，在黎星刻沉静的面容上停留了几乎无法察觉的一瞬，随即流畅地移开，继续诵读。\n这一细微的凝滞，或许只有高踞御座之上、始终保持着得体微笑的蒋丽华，以及她身旁对旧日同僚熟悉无比的黎星刻能够感知。\n贺词毕，周香凛再次躬身，准备持卷退下。\n就在此时，蒋丽华却轻轻抬手，示意她稍候。"
  China.081.a: "天子何意味？"

  China.082.title: "宣誓主权"
  China.082.desc: "女皇陛下端坐于御座之上，头戴钻石冠冕，身着红色婚袍，在无数灯烛与目光的聚焦下，容光慑人。她并未立刻说话，而是先侧过头，看向身旁的黎星刻，唇角漾开一抹极温柔、却极具占有意味的笑意。\n然后，她伸出手，并非去拿酒杯，而是轻轻握住了黎星刻放在案几下的手，将其抬起，置于明处，两人的手指紧紧交缠。这个动作自然无比，却因在如此公开的场合、在刚刚代表百官献词完毕的现任首辅面前做出，而充满了无声的宣告意味。\n蒋丽华这才转回头，目光平静地落在阶下的周香凛身上，声音温和却带着不容置疑的穿透力：\n“周卿贺词，情真意切，朕心甚慰。皇夫昔年为首辅时，多赖卿等同心协力，方有今日之治。如今皇夫功成身退，朕得良人，内阁有周卿主持，朕甚安心。”\n她顿了顿，握着黎星刻的手微微收紧，继续道，语气中多了几分只有当事人才懂的深意：\n“昔日，皇夫与诸卿是朝堂同僚，共理国事。今后，皇夫是朕之夫君，安居内廷。这国事，日后还要多多倚仗周卿与诸位爱卿；而这内廷家事……”她眼波流转，再次看向黎星刻，笑意更深，“自有朕与皇夫，二人同心，足矣。”\n这番话，既肯定了周香凛作为现任首辅的能力与地位，明确了黎星刻不再涉政的现状，更在“国事”与“家事”的清晰划分中，划下了一道温柔的界限——黎星刻的过去与功业属于帝国朝堂，而他的现在与未来，完全属于她蒋丽华的个人世界。这是天子最含蓄，也最直接的“主权”宣示。\n周香凛身形几不可察地微微一滞，握着贺词卷轴的手指关节有些泛白，但她面上依旧沉静如水，深深低下头，声音平稳无波：“陛下信赖，臣感激涕零，定当竭尽驽钝，辅佐陛下，料理国事，不负圣恩。” 她退回座位，端起酒杯，一饮而尽，动作干脆利落。\n黎星刻自始至终面带温和的微笑，任由蒋丽华握着手，只在女皇说完后，才轻轻回握了一下，仿佛无声的附和与支持。他看向周香凛的方向，举杯致意，笑容坦荡，是纯粹的对昔日同僚、今日首辅的致意与祝福。\n插曲过后，宴乐再起，气氛重新变得热烈。美酒佳肴不断呈上，欢声笑语不绝于耳。宫墙内外，灯火辉煌，笙歌鼎沸，直至深夜。\n这一日，帝国的首都沉浸在美食、欢笑与对未来的憧憬之中。而宫宴上那短暂而微妙的交锋，如同投入湖面的一颗小石子，涟漪很快消散在更宏大的欢乐浪潮里，只成为极少数人心头一抹淡淡的、终将释然的痕迹。\n宴席终了，新人起驾回宫。马车驶离太和殿时，蒋丽华靠在黎星刻肩上，望着窗外流转的灯火与星空，轻声问：“我方才……是不是有些过分了？”\n黎星刻将她揽得更紧些，下巴轻轻蹭了蹭她的发顶，声音里带着笑意：“陛下只是陈述事实。况且，”他顿了顿，语气温柔而坚定，“我早已是你的，从前是臣子，如今是夫君。这一点，从未改变。”"
  China.082.a: "宫灯将两人的身影长长地投在御道上，紧密相依"




  China.999.title: "[FROM.Getname]拒绝了"
  China.999.desc: ""
  China.999.a: "可惜"

 #### 王权线 ####

  CHI_WangQuan.1.t: "追思铭记"
  CHI_WangQuan.1.d: "辰时三刻，紫禁城的广场上，临时拼凑的“百官”队伍身穿白衣，头戴白巾，跪立在宫道两侧。康佑薇与黎星刻的遗体被装在紫檀木的棺木之中，由大内侍卫扛运，将被送往西陵下葬。按照他们的身份，他们本不能享受如此排场的葬礼，可蒋丽华却坚持要这么做——康佑薇与黎星刻为了帝国改革的事业，献出了自己的性命。尤其是黎星刻将军，他本是袁克定栽培起来的新军将领，如果不是坚持护卫蒋丽华，袁克定不仅不会杀他，甚至有可能继续重用他。\n可是，他却为了我…蒋丽华抬起头，听着重岳高声朗诵着哀悼追思的挽词，看着此时紫禁城上雾蒙蒙的天际，她只觉得心中一阵疼痛，一道道泪水不自觉地滑过洁白的脸颊。好在此时内侍都已散去，蒋丽华无须担心被人看到此刻的自己。\n朕究竟是怎么了…明明…不应该这么痛苦…这么难受的…在此刻，蒋丽华才意识到，原来自己对黎星刻有着一种特别的感情，那是一种超越了君臣之谊，模模糊糊，暧昧不清的感情。"
  CHI_WangQuan.1.a: "可即使他还活着，朕会有勇气对他说出心中的感情吗？"

  CHI_WangQuan.2.t: "在工厂的一幕"
  CHI_WangQuan.2.d: "蒋丽华贵为帝国天子多年，却是第一次来到工厂内参观。还没下马车，蒋丽华就拉开帘子的一角，透过车窗向外看去：只见工厂的厂长、各个车间的主任甚至是工厂里所有的工人们已经齐刷刷地在道路两侧跪好，恭恭敬敬地等待她的来访。\n“陛下，我们不久前就给这个零件工厂批了一大笔资金，现在整个厂子都已经换装了全新的西洋工厂设备，今天您可以亲自来检验一下成果。”在马车左侧，骑着马的乐正绫不无自豪地向车内蒋丽华说道。\n“让他们都回去工作吧，比起这些虚礼，为帝国多生产一点东西重要得多。”蒋丽华放下帘子来，闭上眼睛，心中难免有点紧张。自蒋丽华记事起，她就没有一次性接触过这么多紫禁城外的人。\n“是，陛下。”乐正绫答应一声便提高声音说道：“陛下有旨：现今乃是特殊时期，各位爱卿子民勿拘泥虚礼，请回到岗位，继续为国家生产做贡献，这才是最好的向陛下展现忠诚的方式。”\n马车停在了工厂正门前，蒋丽华抓住乐正绫递过来的手走下马车，跟随着进入了工厂内部。对蒋丽华来说，这里仿佛是另一个世界——空气中弥漫着工人汗水与机器机油混杂的气味，耳畔只能听见机器轰鸣作响的声音。蒋丽华厌恶地皱起眉头，环顾四周。原来帝国里的大部分人，都是在这样的环境里工作的吗？\n“陛下，陛下？”乐正绫的声音打破了蒋丽华的遐思，蒋丽华眨巴眨巴眼睛，疑惑地看着面前的乐正绫。\n“陛下，随着越来越多新工厂的建立，我们也要决定应该用什么方式管理工厂了。是维持祖制，设立更多管理委员来进行统筹管理呢，还是下放更多管理权给厂长们呢？”"
  CHI_WangQuan.2.a: "“还是维持祖制吧。”"
  CHI_WangQuan.2.b: "“也许多给他们一点自主权也不错。”"

  CHI_WangQuan.3.t: "论功行赏"
  CHI_WangQuan.3.d: "王琳从没想象过会有这么一天——亲自接受当朝天子的封赏，这是任何一个她这样出身的娃娃兵都无法想象的殊荣。即使跪在地上，只能用眼角的余光看向正向这里靠近的天子，王琳的心还是难免越跳越快。\n与所有穷苦人家出身的孩子一样，王琳刚刚成年就报名进入了军队服役，恰逢袁克定组建新军，她也随之加入新军的队伍之中。随着帝国的局势愈发危急，她所属的部队被不断调动。凭借着一股不怕死的冲劲，王琳在与革命党的战斗中屡获战功，晋升营长。在她以为自己的人生将会在某一刻被敌人的枪弹或者刀剑终结时，一场变故毫无征兆地发生了。那一天，她的部队被紧急调动进京“勤王”。可当她看见自己面对的敌人正是当今天子，她才意识到自己参与的不是什么“勤王”，而是一场赤裸裸的军事政变。\n王琳这辈子学的东西不多，但在私塾课本上读到的那个“忠君爱国”，她还是一直铭记在心的。当天子对着叛军高喊“讨伐袁逆”时，她第一个冲了出来响应天子的号召。就连她自己都没有想到，天子的号召一呼百应，袁克定逆贼伏诛，天子大获全胜，而她就这样得到了封赏。\n“王琳讨贼有功，朕正式任命你为朕的贴身侍卫，还望你今后继续保护朕的安全。”\n“卑职王琳，谨遵陛下旨意，定为陛下出生入死，护卫陛下周全！”"
  CHI_WangQuan.3.a: "又一位为陛下出生入死的忠臣。"

  CHI_WangQuan.4.t: "旧山河，新气象"
  CHI_WangQuan.4.d: "一切都结束了，至少目前为止是如此。叛党噤声，神州复归一统。往日几乎已经死去的太和殿，在此刻再次热闹起来。\n“吾皇万岁万岁万万岁！”无数的称颂声在太和殿内此起彼伏地响起，而在大殿的中央，作为帝国中心的蒋丽华端坐御座之上。蒋丽华深呼吸了一口气，尽管已经遭遇太多太多的人生起伏，可她仍然有点不太适应，她真的已经是一位统领亿万万臣民的帝国的皇帝了吗？蒋丽华微微抬起头，看着金碧辉煌的宫殿天顶，心中还是有种不真实感。\n“臣重岳启禀圣上，臣追随陛下数载，只是期望为陛下与神州一统做一点微薄的贡献。现如今，神州复归一统，臣深感已是风烛残年，无力再为帝国继续做出更多贡献。因此，臣恳请陛下允臣告老还乡，将这内阁首席大学士交给一位更加合适的人选。”\n尽管已经在幕后商议无数次，可蒋丽华知道，重岳的此番启奏，定会在朝堂内掀起一股轩然大波。果然，朝堂内此刻一片鸦雀无声，重岳身后的四位内阁学士，更是要把头伏到地里去了。她们鸦雀无声，只是静静等待着蒋丽华的答复。\n“朕，准奏。”伴随着蒋丽华平淡的一句话，三位内阁学士意识到，"
  CHI_WangQuan.4.a: "决定她们自己与帝国未来的时刻，终于要到来了。"

  CHI_WangQuan.5.t: "帝国未来，何去何从？"
  CHI_WangQuan.5.desc.1: "“国不可一日无大学士，既然重岳阁下已经辞去首席大学士职务，那么倒不如就在此选出新一位内阁大学士吧。现在，四位内阁学士，请让朕听听各位对于帝国今后发展的设想吧。”\n尽管蒋丽华已经对眼前四位内阁学士的为人与主张并不陌生，可是要让朝堂上的大臣，要让全天下的子民们知道新一任内阁大学士的主张，那么这一步就是不可或缺的。\n“启禀陛下，请从臣先开始吧。”第一位开口的是黍，她是最晚加入内阁的学士，也是唯一一位从乱党而来的学士。\n“爱卿请说吧。”蒋丽华扫视一眼跪在一旁的三位学士，对着黍点了点头。\n“如诸位与陛下所知，臣曾经效力于乱党之一的共党之内。臣能归附朝廷，完全是因感到陛下有一颗体恤民情，爱民如子的心。臣深知陛下所做的一切，是为了神州亿万万的子民。可是，什么是真正有利于神州的子民，那么毫无疑问——那就是还地于民，保证民生，让神州工农们享受到真正平等的对待。只有神州工农幸福，神州帝国才有源源不断的前进动力。”\n“启禀陛下，黍学士的话，在我听来不过胡言尔。”黍的声音还在大殿回荡，麟青砚几乎是迫不及待地向前一步。“当今神州，的确需要规范法治，安定民心。可是按照黍学士的办法，陛下如何统领天下子民。黍学士的意见，不过是当年激进改革派的复制。依臣之见，陛下贵为天子，当调和阴阳，衡平五行，通过道家的理念，来重塑帝国臣民之道德。在德治之上辅以法治，方能保帝国延续万代。”\n就在两位学士间火药味正浓时，乐正绫那辨识度极强的悦耳声音响了起来。\n“臣乐正绫启禀陛下，臣认为，如今西洋科技与文化十分强大，而神州之文化也有其长处。臣更愿意博采众长，兼收并蓄，将西洋文化与神州文化中的优秀长处结合并进行发扬。如此，吾神州后辈，就能在世界舞台上屹立不败之地，这也是我从政至今梦寐以求的理想。”\n越来越多的方案，越来越多的想法，已经让蒋丽华的脑子几乎一片混乱。可是她还是不断提醒自己——现在最不能乱的就是朕，一定要保持冷静…冷静…蒋丽华再次深呼吸了一口气，又把目光投向最后的千岱芷。\n“臣千岱芷，掌管内务机构多年，臣深知真正惑乱神州的，乃是遍布帝国各地的贪官污吏。如果臣侥幸当选首席大学士，定继续作为陛下的眼睛与利剑，将整个帝国打造为一台高效的机器，让它能够为陛下的一切梦想与主张服务。”\n终于，抉择的时刻到来了——蒋丽华知道，自己必须在这四位内阁学士的道路间选择出一条来，可是，那条道路究竟是…"
  CHI_WangQuan.5.desc.2: "“国不可一日无大学士，既然重岳阁下已经辞去首席大学士职务，那么倒不如就在此选出新一位内阁大学士吧。现在，三位内阁学士，请让朕听听各位对于帝国今后发展的设想吧。”\n“启禀陛下，老臣多年钻研道家治国之术，自认为已参透其中的一点玄妙。依老臣之见，陛下贵为天子，当调和阴阳，衡平五行，通过道家的理念，来重塑帝国臣民之道德。在德治之上辅以法治，方能保帝国延续万代。”作为所有人中资历最老的学士，麟青砚第一个发言了。\n“臣乐正绫启禀陛下，臣认为，如今西洋科技与文化十分强大，而神州之文化也有其长处。臣更愿意博采众长，兼收并蓄，将西洋文化与神州文化中的优秀长处结合并进行发扬。如此，吾神州后辈，就能在世界舞台上屹立不败之地，这也是我从政至今梦寐以求的理想。”\n越来越多的方案，越来越多的想法，已经让蒋丽华的脑子几乎一片混乱。可是她还是不断提醒自己——现在最不能乱的就是朕，一定要保持冷静…冷静…蒋丽华再次深呼吸了一口气，又把目光投向最后的千岱芷。\n“臣千岱芷，掌管内务机构多年，臣深知真正惑乱神州的，乃是遍布帝国各地的贪官污吏。如果臣侥幸当选首席大学士，定继续作为陛下的眼睛与利剑，将整个帝国打造为一台高效的机器，让它能够为陛下的一切梦想与主张服务。”\n终于，抉择的时刻到来了——蒋丽华知道，自己必须在这四位内阁学士的道路间选择出一条来，可是，那条道路究竟是…"
  CHI_WangQuan.5.a: "“黍的观点深得朕心。”"
  CHI_WangQuan.5.b: "“麟学士调和阴阳的主张似乎不错。”"
  CHI_WangQuan.5.c: "“乐正绫小姐融贯东西，她会是最好的人选。”"
  CHI_WangQuan.5.d: "“千岱芷的保证非常有吸引力。”"

  CHI_WangQuan.6.t: "紧急朝会"
  CHI_WangQuan.6.desc: "卯时初刻，一场临时朝会在京城召开。可今天的朝会却和以往不同：偌大的太和殿内零零星星地站着些衣冠不整的廷臣，就连本该站立天子两侧的内侍都已没了踪影。国贼袁克定已然伏诛，可与其一起陪葬的，却是帝国百年的国运——两位锐意改革帝国的重臣伏尸紫禁城，帝国各地狼烟四起。眼见大厦将倾，无数帝国旧臣树倒猢狲散。可笑，若是数十年前帝国的开国之君看到如今的帝国，却不知作何感想。\n蒋丽华，这位看起来并不十分出众的少女此刻就坐在太和殿中央的龙椅之上。在名义上，她是帝国亿万万子民的母亲，是帝国天命的代言人。可如今，在这大殿之上，真正能被她信得过的却只有寥寥四人。少女无言，只是在心中轻轻地叹了口气——帝国难道真已天命尽失，朕就要做那亡国之君了吗？\n“陛下，帝师与黎将军的离世，吾等皆深感悲痛。可如今帝国已至万急之时，还望陛下节哀顺变。吾等定当肝脑涂地，助陛下匡正乾坤！”仿佛是看到了少女眼中深深的担忧，跪在众人最前面的内阁大学士之首重岳开口了。他的声音浑厚有力，把少女从自己的胡思乱想里拉了回来。\n“陛下，当今当务之急，乃是整肃内政，廓清吏治。臣千岱芷，愿为陛下尽心尽责，定不辱使命。”千岱芷上前一步，跪在重岳身侧。身为军机与内务大臣，千岱芷掌管着帝国最庞大的内务机构。不同于她的同僚，她虽认同帝制，却对贪污腐败恨之入骨，这也是她能够成为皇帝心腹的主要原因。\n“千岱芷阁下说得不无道理，可依老臣之见，当今中原之乱，归根结底，仍是人心之乱。这几十年来，中原叛党遍地，人心浮动。许多叛党更是借着改革名号混入朝廷，鼓吹大逆不道的激进之策。老臣早已预料到今日之乱，因此，老臣建议陛下暂缓帝国改革，正本清源，这样才能使民心重归陛下啊。”麟青砚悠悠开口道，她本是前朝重臣太常寺卿，可在改革派日渐掌权的朝廷里，太常寺被裁撤，她也逐渐因保守的改革理念而被边缘化。可如今，改革派重臣皆已离世，她终于有机会可以实现自己的宏图大志。\n“……”听着麟青砚的一番话，蒋丽华的脸色有点不太好看。谁都能听得出来麟青砚此番话里对蒋丽华这些年偏袒改革派的怨气，可如今绝不是应该动怒之时。麟青砚虽然在许多方面保守许多，可她对于皇帝的忠诚却是毫无疑问的。\n“陛下，臣乐正绫，斗胆进言。”就在此时，麟青砚的身后后面传来了一阵十分悦耳的少女之音。乐正绫，如今四位内阁学士中资历最浅，年纪最小的女孩，可却最受蒋丽华的喜欢。乐正绫出身自音乐世家，身为神州著名歌手的她曾游历各国，深感神州与当今世界的脱节，这才放弃了自己的音乐事业，投身政界。\n“请讲吧。”蒋丽华的脸上没有表情，心中却是一喜。麟青砚的神色中带着些许鄙夷，但也没有继续说什么。\n“臣以为，且不论改革派的真正目的，但继续向西洋学习先进的技术与文化，这点是绝不会错的。若是因改革派覆灭就回归故步自封的老路，那我们恐怕早晚会被乱党所擒。”\n乐正绫的发言结束，朝堂上再次陷入了静默之中。看着面前的四位内阁学士，蒋丽华只觉得心中一阵安心，却又对未来茫然无措。有这四位内阁学士的辅佐，帝国起码不会迅速崩溃。可是，他们能够如此平心静气地在这里议事，唯一的原因只是因为蒋丽华仍然在此。可早晚有一天，蒋丽华必须在他们中选择一条道路，带领神州走向新的未来。"
  CHI_WangQuan.6.a: "可那未来，究竟会是什么样子呢？"

  CHI_WangQuan.7.t: "梦想延期"
  CHI_WangQuan.7.desc: "“帝国国会改革紧急暂停！”这行大字在今早出现在京城大大小小的报纸头条之上，而且很快，它就会出现在神州各个割据势力乃至外国报纸的新闻之中。毕竟，神州帝国改革已经被作为国策实行多年，国会改革更是所有改革中的重中之重。这项改革被暂停，将被各种革命党势力作为罪证大书特书，作为讨伐帝国的又一个理由广为流传。\n不过，这项举措也并非没有拥护者。现如今，帝国需要的是上下一心，齐心协力。如果不能保卫帝国，弥合政治分歧，那么一切争论就都会失去意义。更何况，那些本就不支持改革的保守派们，也会被这项措施拉拢，回到帝国的身边。\n“所以，朕真的别无他选了吗？”王座上的蒋丽华看着跪在下面的麟青砚，还是有点不安地多问了一句。\n“恐怕正是如此，陛下。现如今，帝国根本抽不出手进行任何形式的政治改革了。”\n“那么…朕可以准奏这封奏折。不过，朕需要你的一个保证。”\n“什么样的保证，陛下？”\n“你要保证，这项举措只是暂时的。”\n麟青砚沉吟片刻，做出了回答。"
  CHI_WangQuan.7.a: "“陛下，我可以向您保证。”"

  CHI_WangQuan.8.t: "扫落叶"
  CHI_WangQuan.8.desc: "“军爷，军爷，这边走。”\n天刚拂晓，清晨的薄雾笼罩在街上带来丝丝凉意。街上的落叶被微风吹起，竟有些许凄凉肃杀之意。几个行色匆匆的人影打破了这份凄凉的寂静，为首的人挑着灯笼，后面是几个穿着铠甲的壮汉。\n片刻，他们停在了一所民房前。挑着灯笼的引路人识趣地让开，身后的壮汉深吸一口气，竟直接一脚踹开了面前的木门。伴随着一声巨响，其余几名壮汉蜂拥而入。\n“办案！全都不许动！”\n天刚亮，正是起床做早饭的时候。无视了惊愕的屋内人，在亮出了腰间的佩刀后，所有人都识趣的站在原地不敢动弹。控制住了他们后，刚刚才踹开门的壮汉便直接大步流星地闯进了里屋。屋内，一个瘦小男子正惊慌地打着火，在他身旁还散乱着落叶般凌乱的纸张。或是因为太紧张，男子颤抖的手始终无法成功将火升起。\n壮汉一步向前抓住了瘦小男子，控制住他后，便捡起了地上的纸张扫过几眼。不出所料，里面有不少的狂悖犯上之言。冷哼一声后，壮汉示意其他人收集证据，自己则是捆上了男子。\n“王头，这次我们又能拿到赏钱了。光是这些名单上的人，就够兄弟们小发一笔了。更别说我们还没撬开他嘴呢，到时候又是一笔横财。”\n王头没有回应，只是在出门时扔了一袋铜钱给挑灯笼的人。在对面的点头哈腰中，带着男子渐行渐远。\n“今日不同往日了，上头的人要我们进行什么恩情教育，所以你们对待人犯悠着点，懂了吗。先把他关进去，后面要怎么办听上头的。”"
  CHI_WangQuan.8.a: "明白了，头，这些乱党我们一个不留"

  CHI_WangQuan.9.t: "军不合力不齐"
  CHI_WangQuan.9.desc: "“陛下，眼下地方军队已是群龙无首，正是我们重新掌握地方军队的大好时机。卑职认为，此刻我们应该迅速行动，或诏安或利诱，或晓之以情或动之以理，用尽任何手段将地方军重新收归中央管辖。否则等他们又出现了一个领头的，则变数颇多，正如往昔李傕郭汜乱长安之事……”\n“你说的有理，朕也在思考这件事。只是地方军队派系林立，述求不一，不知该派何人才能说服他们。朕打算挑选有威望的大臣前去劝服，又怕有大臣会因此反遭逆贼余党的毒手。”\n御书房内，蒋丽华正伏案看着一张京畿地图，上面密密麻麻地标着京畿地区各个部队的详细信息，个别部队甚至精确到了伍长的个人喜好。不消说，这些消息是袁克定那些归降的手下们提供的。而王琳则在旁为蒋丽华讲解袁克定的御下统军之术，还时不时为天子出谋划策。\n“陛下，普天之下四海之内，还有谁能比陛下更有威望呢，还有谁能比陛下的御林军更能代表圣意呢。卑职认为，陛下大可派遣御林军去传达圣意。倘若他们得知陛下如此重视他们，比如会感激涕零。卑职不才，但也有几位兄弟如今正在地方掌军，卑职愿为陛下担此大任，去说服那几位兄弟。届时一传十十传百，大家都会归服陛下。”\n听着王琳慷慨激昂的陈词，蒋丽华没有抬头，在沉默了片刻后，她缓缓点了点头。"
  CHI_WangQuan.9.a: "改编地方部队就交给你了"

  CHI_WangQuan.10.t: "天子巡临"
  CHI_WangQuan.10.desc: "“快，快列队！天子要来巡视我们了，兄弟们都打起精神来，都给我列好队！”\n一大早，赵刚的耳旁就传来了伍长咋咋呼呼的声音。虽然他还想再睡一会，但身体早已条件反射地站了起来。在穿戴整齐，跟着其他人一块列好队伍后，赵刚才渐渐反应过来。\n“刚刚老王他说啥…天子？天子要来巡视？”\n赵刚瞬间抖了个激灵，站得更直了，腰也更挺了。他四下环顾了一下，旁边充斥着自己之前仅有数面之缘的新面孔。和赵刚一样，他们都是从各个地方部队里被抽调到京师的。天子名其名曰要创新军制，赵刚是个大老粗，不懂军制是什么意思，只希望天子别一顿折腾让自己又要多训练几个时辰。\n“天子驾到——”\n没让赵刚等多久，随着一声轻呵，天子出现在了军营门口。赵刚努力收起自己的好奇心，不让自己转头看向天子，而是站的愈发挺拔。不多时，几个穿着精甲的侍卫便走过了赵刚，紧接着，一身戎装的蒋丽华站在了赵刚面前。\n“刚刚几乎所有人都转头看朕，你却不为所动，怎么，你就不好奇？你叫什么名字，原属哪只部队？”\n“报，报告！我叫赵刚，是第二十三连的。我是陛下的兵，首先就要为陛下站好岗。站岗期间，就不该三心二意！”\n“赵刚是吗，你看起来是个忠厚人。朕问你，从地方调动到京师，可有什么地方不适应的？”\n“军营里有什么缺乏的但说无妨，陛下喜欢直言之人。”\n得到了一旁侍卫的鼓励后，赵刚费劲地咽了口口水，好一会才结结巴巴地开口。\n“报告陛下，兄弟们刚刚才从地方调集过来，很多军需粮饷都还不够。我们现在吃的跟大帅，啊，不，跟逆贼那会相比少了一顿，伙食的质量也差，一些兄弟都要偷偷溜出军营觅食。还有些兄弟衣服破了也没有新的补上，很多兄弟都没有鞋穿。然后……然后就是陛下治军严明，兄弟们已经好长时间没发过横财，没开过荤了……”\n蒋丽华听着赵刚的汇报，时不时地点了点头。听到最后，她别过脸去，吓得赵刚心脏都停了一拍。\n“王琳，都记下了吧。回去催促一下负责军需的大臣，还要派人调查一下有没有人敢中饱私囊的，有人胆敢贪污的直接处死。另外以后军饷翻一倍，再苦不能苦了将士们。回去看看能不能推行轮换制，让将士们有时间能进城歇息。”\n蒋丽华大声当众吩咐任务，即是表态稳定军心，也是鼓舞士气收买人心。听着蒋丽华惠及军人的命令一天天有条不絮地颁布下去，赵刚不觉热泪盈眶。"
  CHI_WangQuan.10.a: "我们吃的是天子粮，领的是天子饷"

  CHI_WangQuan.11.t: "旧人不如新人美"
  CHI_WangQuan.11.desc: "臣林蒙有本秘奏，今逆贼已定，然其作恶多年，余威尚在。地方军旅，盘根错节，逆贼余党何其之多。且逆贼窃天子之资，广布恩信，乃至地方军旅只知有大帅，不知有天子。\n臣以为，逆贼方除，逆贼余党群龙无首，陛下应即刻任免地方各军旅长官，去奸佞，任贤良。使士卒得知有陛下，军旅重归于天子。\n逆贼经营累年，一时之间余党难以尽数拔除。望陛下垂三春之泽，广布恩信。立秋霜之威，严以御下。逆党不过朽木腐虫，怎敌陛下春泽秋威。不出数载，必土崩瓦解。军旅则如臂使指，行止如一。"
  CHI_WangQuan.11.a: "准奏"

  CHI_WangQuan.12.t: "起复旧北方军将领？"
  CHI_WangQuan.12.d: "随着前线战报如同雪片般飞入[ROOT.GetCapitalVictoryPointName]，[ROOT.GetNameDef]正面临着前所未有的危机。樱花国的装甲部队正在撕裂我们的防线，而我们最缺乏的除了重武器之外——便是能够指挥大兵团作战的经验丰富的指挥官。\n在国会大厅内，一场激辩正在进行：是否起复关押在劳改营的一群特殊囚犯——前北方军的高级将领们。\n尽管这些人曾在袁克定的带领下参与了政变，但不可否认的是，他们依然是帝国受过最良好军事教育、且拥有实战经验的军官团。\n部分议员和前线参谋恳请政府“特赦”这些戴罪之人，让他们率领部队抵御外侮；而另一派则严厉警告，通过释放叛徒来拯救国家无异于饮鸩止渴，谁也无法保证这些“北方之虎”一旦重掌兵权，会不会再次反噬其主。"
  CHI_WangQuan.12.a: "国难当头，应摒弃前嫌。"
  CHI_WangQuan.12.a_tt: "这将§Y特赦§!以下将人物，并起复为将领："
  CHI_WangQuan.12.b: "一次不忠，百次不用。"
  CHI_WangQuan.12.b_tt: "§g\n在国会的决议下达后，劳改营的看守报告称，那些前将军们整夜沉默地望着东方的战火，无人入眠。§!"

  CHI_WangQuan.13.t: "紫禁城外的风向"
  CHI_WangQuan.13.desc: "“唉，这世道，变得比翻书还快！前些日子那姓袁的女帅还趾高气扬，转眼就成了刀下鬼。要说这回是真变天了，天子真坐稳了。”\n我叫李老栓，在紫禁城外摆摊卖些京味小吃。前些日子黎将军和康老先生的葬礼，那排场，啧啧，棺材都是紫檀木的。天子亲自去送，可见是真伤心了。可怜那两位，说是为了百姓，到头来还是白白送了性命。\n现在京城是安静多了，但也更紧了。“改革”那两个字，没人敢提了。听说朝廷颁布了“改革暂停”的诏书，老百姓大多是松了口气——折腾了这么多年，谁不想安生日子？\n可这安静也透着股肃杀。前几天，我家对门那常年发些小报的秀才，天不亮就被穿着黑甲的兵丁抓走了，说是“乱党余孽”。那士兵走时还扔下一句话：“要进行恩情教育，对待人犯悠着点。”我看是“悠着点”地抓人，京城的落叶是扫干净了，但人也少了一茬。这叫“扫落叶”吧？老百姓心里明白，这天下还是姓蒋，但掌刀子的，是千内务大臣那帮子人。"
  CHI_WangQuan.13.a: "至少社会在变得稳定。"

  CHI_WangQuan.14.t: "穿着天子新军服的日子"
  CHI_WangQuan.14.desc: "“报告！我们吃的是天子粮，领的是天子饷！” 我喊得声嘶力竭，心里却暖烘烘的。\n以前跟着袁帅那会儿，虽然能‘发横财’，但吃饭都是窝头咸菜，军饷还总被上头克扣。现在不一样了！自从王营长（王琳）成了天子的贴身侍卫，奉旨下来“改编地方军队”，我们这些从地方部队抽调来的老粗，立马换了新装。\n天子亲自来我们营地巡视那次，我算是头一个出糗的——当着天子的面，我结结巴巴地抱怨伙食差、没新鞋穿、还说了“没发横财”这种粗话。可天子竟然没怪罪！\n她当众就吩咐了：“军饷翻一倍！” “改善伙食！” “贪污军需的直接处死！” 这下谁还敢喝兵血？\n现在我们都换上了统一的新军服，训练虽然更严了，但肚子是饱的，心里也服气。以前我们只认我们自己的军官，现在，我们只听天子的。王营长说，这是为了把军队打造成一支只听天子命令的“利剑”。"
  CHI_WangQuan.14.a: "谁还管什么地方军、北方军？我们是御林军！"

  CHI_WangQuan.15.t: "龙椅上的经济学"
  CHI_WangQuan.15.desc: "“北京的天空总是灰蒙蒙的，但这并不影响我嗅到空气中浓烈的火药味——这次是经济上的。”\n我在工厂区徘徊。最近，年轻的女皇在内阁的辅佐下，正在进行一场没有硝烟的经济革命。\n那位于音乐界的乐正绫小姐，显然将工业发展放在了首位。我们看到“重拾洋务遗产”和“兴办新厂”的国策正在积极推行，政府投入大笔资金引进最新的西方设备。然而，管理方式似乎还在摇摆不定，是“维持祖制”的集权管理，还是给予厂长“自主权”？这显示了新政府内部仍在探索适应现代工业的统治模式。\n更令人震惊的是那项名为“国有化外资”的政策。借着西方列强被大萧条拖垮的空档，神州帝国中央政府正在没收过去列强在华的企业。这对伦敦的股东来说简直是晴天霹雳，但对这个新生的王权政体而言，无疑是一次快速积累原始资本、建立民族工业的捷径。\n天子，这位曾经被袁克定囚禁的少女，正在用铁腕推行她的经济主张——帝国必须拥有自己的工业。"
  CHI_WangQuan.15.a: "泰晤士报·驻京记者·Alistair·H."

  CHI_WangQuan.16.t: "奉天改制：一个来自赤匪的首辅"
  CHI_WangQuan.16.desc: "蒋丽华平静地看着阶下群臣。重岳已退，而她刚刚宣布了新的首席大学士——黍。这位曾为“乱党”效力，理念激进的女子，正站在这腐朽帝国权力之巅。空气凝固。\n麟青砚脸色煞白，她颤抖着膝行一步，奏道：“陛下，黍氏之学，大逆不道，岂可为万民师表？若奉其言，社稷将倾，纲常…” 她的话被一声轻咳打断。\n千岱芷上前一步，声音低沉而有力：“陛下既已决，其志即天命所归。麟学士，神州已无时间再谈纲常，内务府只认效忠天子的刀剑。”\n蒋丽华走下龙椅，亲自扶起黍：“卿之宏图，在救天下之饿殍。朕信卿，此为天子大义。去吧，将那份《土地改革草案》拟成诏书，朕来盖印。”\n黍抬起头，眼神狂热而坚定：“臣必不负陛下，这帝国将是天下农工的帝国！”"
  CHI_WangQuan.16.a: "地主阶级将迎来末日。"

  CHI_WangQuan.17.t: "跪在祖坟前"
  CHI_WangQuan.17.desc: "晨雾未散，急促的军靴声已踏破了张家庄园的宁静。张敬斋，这位平日里穿丝绸、读《四书》的体面人，此刻穿着单衣跪在祖宗祠堂前，手中紧攥着一份盖着红印的诏书——《神州帝国土地均分法》。\n门外，由王琳亲自指挥的革命卫队（新军骨干）已将庄园团团围住。一位年轻的卫兵冷冷地宣读：“自今日起，张家名下良田尽归国有，划拨周边农户。此地财产，除自住居所及衣物外，皆为公有。”\n张敬斋声嘶力竭：“狂悖！耕者有其田？这是数百年来的祖产！老夫曾捐银赈灾，忠君爱国，你们焉敢——”\n“家国大义在前，乡绅私利算什么？” 卫队长一脚踢翻了跪在地的张敬斋，指着祠堂的牌匾，“天子言，儒教的狂热信仰，是逼你等站到大义这一边！ 谁敢阻止农工幸福，便是站到了帝国对立面！”\n张敬斋被卫队拖走时，看见他家佃农老李，正红着眼睛，扛着锄头，带着妻儿踏上了他家的良田。"
  CHI_WangQuan.17.a: "老李脸上，是张敬斋从未见过的，对生活的狂热和感激。"

  CHI_WangQuan.18.t: "铁厂的红牌匾"
  CHI_WangQuan.18.desc: "老赵坐在轰鸣的蒸汽机旁，额头上的汗水混着机油。几个月前，这里还是洋人和旧军阀的产业，厂长是袁克定的人，动辄克扣，工人像牲口。\n上周，一队自称“中央政府工作组”的人来了，他们宣布工厂被“收购”（老赵知道，那其实就是没收），成为了“神州革命帝国军工联合体”的一部分。\n新来的厂代表，竟然是个年轻的女军官。她做的第一件事就是，将厂门上旧的“汉阳造”牌匾换成一块巨大的木牌，上面用朱红大字写着：“农工联盟”。\n女军官宣布：“从今天起，你们不再是工贼的奴隶，你们是帝国最可敬的生产者！天子有旨，军工企业工资上涨三成，提供工人宿舍和免费学堂。”\n老赵摸着手上的老茧，他知道，这不再是为资本家卖命。这位天子，这位首辅，将工人和农民高高举起，让他们成为帝国勋章上最亮丽的色彩。他将自己积攒多年的私房钱拿出来，准备买一幅天子的画像，挂在家里。"
  CHI_WangQuan.18.a: "好日子，来了"

  CHI_WangQuan.19.t: "帝国之筛"
  CHI_WangQuan.19.desc: "黍用朱笔圈掉了吏部推荐的一名官员名字：“此人曾为袁贼幕僚，虽有督办军务之才，却不可信。”\n千岱芷推了推眼镜，平静地问：“首辅大人，此人能力确在目前人选之上，您难道不担心，只顾政审会使帝国行政效率低下？”\n黍冷笑一声，语气坚定：“千岱芷大人，能力是虚，忠诚才是实的。一个不忠于天子、不忠于农工联盟的能人，便是帝国腹中的毒蛇。宁要忠诚的庸才，不要不忠的能人！ 我们要将这神州帝国，打造成一台由忠诚之血驱动的、高效的机器。”\n千岱芷起身，向黍行礼：“臣明白了。内务府将全面执行‘忠诚度优先’的原则，彻底清理旧官僚和思想不坚定的分子。这台机器的政审之筛，将确保每一个齿轮都为陛下而转。”"
  CHI_WangQuan.19.a: "宁要忠诚的庸才，不要不忠的能人！"

  CHI_WangQuan.20.t: "永和之誓：天子的革命"
  CHI_WangQuan.20.desc: "“朕，神州帝国天子蒋丽华，诏告天下：神州，今已为‘革命帝国’！”\n“我中华民族之大义，从来不是腐朽官僚与贪婪地主之私产！自今而后，以农工联盟为立国之本，推行耕者有其田，国企主导工业。此为天命维新，顺应苍生。”\n“朕知此举必遭宵小非议，故昭告：革命卫队已成立！此卫队以农工之子弟组成，以钢铁意志捍卫革命果实。谁敢阻碍农工幸福，必被天子之剑所诛！”\n“昔日，我中华民族以儒教狂热信仰维系家国不倒。今日，朕以这信仰之火，点燃革命的洪炉，将所有阻碍新神州崛起的腐朽之物焚烧殆尽！”\n“穷则独善其身，达则兼济天下。神州已自清，环顾四海，压迫仍在。朕之宏愿，终将是输出革命，解放天下受压迫之工农！”"
  CHI_WangQuan.20.a: "我们的革命，永不凋零。"

  CHI_WangQuan.21.t: "奉天改制：法治与德治的调和"
  CHI_WangQuan.21.desc: "麟青砚身着一袭素净的天师袍，代替重岳立于百官之首，她的出现本身就是对旧有政治的巨大冲击。百官们窃窃私语，直到麟青砚向龙椅上的蒋丽华深施一礼。\n麟青砚：“陛下，臣知有朝臣忧虑，以为臣入仕乃天子行神鬼迷信之举。然臣以为，神州千年，德治之衰，乃因法治崩塌。德治如调和阴阳，平衡人心，而法治则如秋霜之威，严惩不贷。”\n“臣请陛下，即刻颁布两道诏书：一，提高道教地位，以帝国本土之宗，固我民心之本；二，重建大理寺，以法家之术为骨，重立神州司法纲常！大理寺不再是空架子，而是违法乱纪者的梦魇！”\n蒋丽华的目光扫过底下震惊的群臣，语气坚定：“朕，准奏。朕深知，唯有法治，方能救帝国于乱世。麟学士，此事，全权交由你负责。”"
  CHI_WangQuan.21.a: "德治为心，法治为骨，方能立国。"

  CHI_WangQuan.22.t: "《新刑律》下的第一刀"
  CHI_WangQuan.22.desc: "粮商王福挤在人群中，看着曾经的城防守备被押上断头台。此人仗着旧摄政王袁克定的余威，一直盘剥百姓，私吞军粮，以前这种事最多被罚银罢官。\n但这次，新大理寺的判官身穿黑色法袍，不带一丝感情地宣读判词：“前城防守备张三，贪墨军粮三车，按《神州新刑律》第一百零七条，此乃贻害社稷之重罪，依法处以极刑！” 判词中，只提法律条文，不提人情。\n鬼头刀落下，人头滚地，围观百姓鸦雀无声。王福吓得手脚发软，赶紧转身离开。他回到家中，立刻将账本里那些偷偷虚报的旧账全部烧毁，心想：“这天子和天师，是动真格的了！执法必严，谁也别想钻空子。以后做生意，得干干净净。”"
  CHI_WangQuan.22.a: "律法面前，天子与庶民同罪！"

  CHI_WangQuan.23.t: "天师旗下的服从"
  CHI_WangQuan.23.desc: "老将孙虎看着练兵场上新来的数百名军官，他们佩戴统一的太极图章，腰悬长剑。他们是响应“天师军官”诏令入伍的道士和天赋者。\n孙虎虽然不懂道法，但不得不承认，这些新军官体能极佳（据说是修炼了功法），且纪律性远超旧军官。一名新军官训话时，强调的不是“军令如山”，而是“遵天师令，即遵天子令，此乃天道之法”。\n孙虎对副将低语：“这些道士不沾世俗，不谋私利，只信天道与天子。他们是最纯粹的服从者，是重塑帝国中央集权军队的绝佳资源。麟首辅这一招，高明啊，她给军队注入了忠诚的灵魂。”"
  CHI_WangQuan.23.a: "纯粹的服从者，是重塑帝国之基。"

  CHI_WangQuan.24.t: "天赋与帝国的未来"
  CHI_WangQuan.24.desc: "农家少年张小玄站在龙虎山下，参加帝国首次统一道士选拔。以前道士只收地主家的孩子，他根本没机会。但现在，天师府统一考核，只看天赋。\n他通过了体能和悟性测试。在“功法推广”的环节，他感受到一股奇异的力量在体内流转，身体素质比以前强健数倍。考官记录下他的数据，兴奋地宣布：“此子根骨极佳，入选‘天骄预备队’！”\n张小玄不敢相信，他一个农家子弟，如今竟有机会成为帝国精英。考官对所有入选者训话：“你们不再是旧时的道士，你们是法治帝国的天赋之才！你们将得到最好的培养，或入军旅，或入大理寺，成为捍卫天道之法的‘佩剑者’！”"
  CHI_WangQuan.24.a: "天赋者，当为帝国所用。"

  CHI_WangQuan.25.t: "“永和”新律：法治帝国成立"
  CHI_WangQuan.25.desc: "“法治帝国已成！经天子御览，内阁与大理寺协同编纂的《永和新律》今日颁布天下，自此，神州之运行，不凭人情，不凭关系，而凭天道之法！”\n“朕之臣民，当知：有法可依，有法必依，执法必严，违法必究。此四原则，乃帝国永续之基石。”\n“旧时帝国，人亡政息。今法治帝国，虽有天子调和阴阳，然法度已定，制度先行。国之长治久安，不再系于一人之贤愚，而系于律法之运行！ 天子之威，法度之严，同光日月！”"
  CHI_WangQuan.25.a: "法度即天命，天命即永恒。"

  CHI_WangQuan.26.t: "雅乐的利刃：御绫军成立"
  CHI_WangQuan.26.desc: "刑部侍郎王公在午门外跪地死谏，头磕得鲜血淋漓，高喊“戏子误国，请陛下收回成命！” 他的身后，是上百名持反对意见的朝臣，脸色铁青，不发一言。\n乐正绫身着一袭改良的对襟汉服，佩戴着小提琴形状的胸针，平静地从王公身旁走过，仿佛没看到地上的血迹。\n几日后，反对声戛然而止。那些平日里对乐正绫嗤之以鼻的翰林院老学究们，突然集体宣布成立“文化复兴促进会”，并以“御绫军”自居。原因无他：乐正首辅不仅批准了巨额的传统文化保护与发扬补贴，还亲自参与了京剧改良剧目的演唱。\n老学究们在报纸上发表联名信：“乐正首辅深谙华夏之魂，此等胸襟，远胜那班只会空谈的腐儒！” 他们转而将火力对准那些仍反对乐辅政的朝臣：“反对乐首辅，便是反对国粹！”\n一场针对首辅的“倒绫风波”，被乐正绫利用传统文化的软刀子，迅速、彻底地瓦解，这让所有人开始重新审视这位“戏子”的政治手腕。"
  CHI_WangQuan.26.a: "吾道不孤，传统文化为我所用。"

  CHI_WangQuan.27.t: "科学的掌声"
  CHI_WangQuan.27.desc: "乐正绫站在台上，身旁是数十位从西方留学归来的科学家和工程师。她用流利的德语发表了关于“帝国技术实用主义”的演讲。台下，那些带着西方文化色彩的归国精英，激动地鼓掌。\n“实用主义者从不避讳西方文化的强大！我们学习西方的技术、科学和管理，取其精华，去其糟粕。陛下深知，枪炮和铁路，才是保护传统文化的坚固盾牌！”\n随后，她宣布帝国将开展“第二次新文化运动”，核心不再是打倒传统，而是“融贯东西，为我所用”。这一口号迅速得到留学精英的拥护，他们不再将帝国视为落后的代名词，而是充满希望的新舞台。"
  CHI_WangQuan.27.a: "枪炮和铁路，才是保护传统文化的坚固盾牌。"

  CHI_WangQuan.28.t: "农忙时节的新歌谣"
  CHI_WangQuan.28.desc: "老李坐在自家土坯房的院子里，手里把玩着一个方方正正的木盒子——收音机。这东西以前他想都不敢想，但因为收音机补贴，他只用极少的铜板就买到了。\n傍晚，他拧开了开关，收音机里传出乐正首辅那悦耳的声音，她正在用一种平易近人的语调播报天子颁布的最新农税法令。随后，是乐正绫亲自演唱的一首新歌《大地的和声》，歌词是关于农工辛劳与帝国复兴的。\n以前，帝国的法令要靠县官吼，靠衙役贴，老李根本不懂。现在，天子的“玉音”直接穿过崇山峻岭，直接抵达他的耳边。他感到一种前所未有的亲近感和被重视感。\n“咱家这盒子，可比村长的话好使！” 老李的婆娘感叹。"
  CHI_WangQuan.28.a: "真正的力量，来自人民心底。"

  CHI_WangQuan.29.t: "火线上的“下里巴人”"
  CHI_WangQuan.29.desc: "士兵小张刚刚完成了一场艰苦的军事演习，浑身疲惫。今晚，军营里却灯火通明，军队歌舞团正在表演。\n上半场是传统的高雅昆曲，表演者唱腔婉转，小张听得云里雾里，只觉得“阳春白雪”离他太远。\n接着，乐正首辅亲自挑选的几位女兵换上了充满活力的军装，跳起了节奏明快的西方踢踏舞，并用顺口溜的方式宣传军事纪律和爱国思想。小张被那股朝气感染，和周围的兄弟一起跟着节拍拍手大笑。\n休息时，一位女兵走过来递给他一碗热汤，并微笑着问：“将士辛苦了，歌舞团的歌好听吗？” 小张觉得，比起那些只会训人的军官，这位首辅带来的人文关怀，更能让人心甘情愿地为天子卖命。"
  CHI_WangQuan.29.a: "以艺术抚慰心灵，以文化凝聚军心。"

  CHI_WangQuan.30.t: "文艺的春天"
  CHI_WangQuan.30.desc: "“在天子英明领导下，神州迎来了文艺的春天！乐正绫首辅以艺术为楫，文化为舟，带领帝国走上了全新的道路。”\n“吾等以《论语》之仁，调和西方之技；以昆曲之雅，融合流行之声。这证明了，真正的力量，不是只有枪炮和律法。”\n“民意大于天！ 天子之威仪，不再仅来自紫禁城，更来自每一位听着收音机、唱着新歌的百姓心底。我神州帝国，将以其独特的文化魅力和对人性之关怀，屹立于世界民族之林！”"
  CHI_WangQuan.30.a: "文化昌盛，国祚永续。"

  CHI_WangQuan.31.t: "内阁首辅的刀"
  CHI_WangQuan.31.desc: "蒋丽华将首辅之位授予千岱芷，朝堂上的震惊与不满几乎凝结成冰。但千岱芷面无表情，直接走向了她的新位置。\n千岱芷：“陛下，臣知百官对臣不服，但臣此生所愿，唯为陛下执刀，扫清所有威胁天子与帝国的障碍。”\n她的第一个命令，是向内阁索要所有高官的全部私密档案。\n户部尚书颤声抗议：“首辅，这不合祖制！内阁无权——”\n千岱芷冷冷打断：“祖制？祖制未能阻止袁贼叛乱，未能保护陛下安全！从今往后，陛下的安全与意志，就是神州唯一且最高的祖制。 臣将以暗影之手，重建帝国的支点，清理掉所有可能成为叛徒的棋子。”\n尚书被她眼神中那股不顾一切的忠诚和冷酷震慑，噤声不语。百官清楚：这位首辅，是那位一直深居简出的天子，亲手伸向朝堂的利爪。"
  CHI_WangQuan.31.a: "臣为陛下之影，躬耕于黑暗！"

  CHI_WangQuan.32.t: "“汪！”"
  CHI_WangQuan.32.desc: "一场秘密的清洗刚刚结束，几名密谋串联的军官被千岱芷“刚好解决”。她风尘仆仆，还带着淡淡的血腥味，来到御书房向蒋丽华复命。\n蒋丽华心疼地看着这位跟随自己多年、不顾流言蜚语的首辅：“外人传言，首辅是朕的狗，此事朕绝不能忍。”\n千岱芷却单膝跪下，将染血的匕首插入地板，低头：“陛下，臣不曾生气。京城流言，是臣在为陛下清洗的时候，故意留下的烟雾。臣的任务，就是让所有人知道，这把刀，是陛下最坚韧、最不惜性命的忠犬！”\n她抬起头，眼神狂热而坚定，一字一句，带着某种仪式般的狂热：“汪！”\n蒋丽华伸出手，轻抚千岱芷的发顶：“好了，起来。朕要的不是一只普通的狗，而是一只有能力守卫天下的猛兽。去，用最好的资源，训练忠义之士，为朕打造一支真正的精英御林军。”"
  CHI_WangQuan.32.a: "用最好的资源，铸造天子的利剑。"

  CHI_WangQuan.33.t: "茶馆里的沉默"
  CHI_WangQuan.33.desc: "李掌柜擦着桌子，茶馆里鸦雀无声。往日里，这里是京城百姓议论朝政、骂骂贪官的地方，如今，连说笑声都小了许多。\n两个月前，京城出了件大事：平日里欺行霸市、无人敢管的税务局长，一夜之间失踪。第二天，内务府贴出公告，列举其“贪污、受贿、与逆贼暗通”等三十多条罪状，随后被秘密处决。\n李掌柜知道，是“秘密警察”出手了。\n一位常客低声抱怨了一句：“这鸡蛋比以前贵了三文……” 话音未落，他旁边一位看起来平平无奇的茶客放下了茶杯，淡淡瞥了他一眼。\n抱怨的常客脸色瞬间煞白，赶紧拿起茶杯，用一种近乎虔诚的语气说：“天子万安，鸡蛋贵点也是应该的，大局为重，为天子献出一切是应该做的。”\n李掌柜心头一凛。他宁愿相信人民在恐惧之中说出的“真相”，也不敢相信任何人所谓的“忠诚”。他知道，这世上可能没有奸佞了，因为他们要么被抓了，要么就学会了伪装成最忠诚的样子。"
  CHI_WangQuan.33.a: "宁愿相信恐惧中的真相。"

  CHI_WangQuan.34.t: "预算的碾压"
  CHI_WangQuan.34.desc: "户部尚书再次抗议：“首辅大人！今年的御林军预算，竟是地方军队的两倍！这已严重影响民生开支，且地方军多有怨言！”\n千岱芷平静地拿出两份报告。第一份是精英御林军的训练成果：他们的单兵素质、装备水平和忠诚度远超所有旧军。第二份，是地方军官最新的“贪腐与效率”报告。\n千岱芷：“精英御林军是陛下拱卫天子的最后一道防线，其预算优先级高于一切。至于地方军的怨言？让他们先学会不喝兵血、不吃空饷，再来谈待遇！他们的战场表现，配不上天子的圣恩情重。”\n她将报告重重拍在桌上，目光扫视全场：“谁再敢以‘不合祖制’、‘影响民生’来阻拦对天子近卫的投入？你们是否认为，天子的安危，不如你们的痛骂和怨言重要？”"
  CHI_WangQuan.34.a: "天子之安危，重于泰山！"

  CHI_WangQuan.35.t: "秩序之歌"
  CHI_WangQuan.35.desc: "“永和七年，神州帝国在天子英明领导下，已实现全面的井然有序！”\n“所有逆贼、奸佞、贪官污吏，皆被天子的忠犬清除。街道上不再有乞丐，工厂里没有怠工，朝堂上没有异见。”\n“如今，人们见面第一句便是：‘天子万安’。这不是虚伪的颂歌，而是发自内心的赞美。因为我们深知，这份秩序，是用天子之影的刀剑，从混乱中搏杀出来的。”\n“嘘，小点声！同志，帝国，井然有序！ 愿这份对天子的极端忠诚与井然秩序，永世长存！”"
  CHI_WangQuan.35.a: "以忠诚为纲，以秩序为纪。"

 ####### 民主线事件 ########
  CHI_Democracy.1.t: "招标会"
  CHI_Democracy.1.d: "在权力重归议会后，与世界主要国家接轨与贸易便被提上日程，经过我们外交人员的不懈努力，[GER.Getname]、[ENG.Getname]、[SOV.Getname]三个国家的外交人员愿意与我国洽谈，但鉴于国家尚未稳定，我们目前只有能力接受其中一家的投资，我们的选择是？"
  CHI_Democracy.1.a: "德国的外资"
  CHI_Democracy.1.b: "圣杯的外资"
  CHI_Democracy.1.c: "苏联的外资"

  CHI_Democracy.2.t: "与致公党的对话"
  CHI_Democracy.2.d: "紫禁城，东华门外\n最开始钟岚珠还以为又是什么不得不赴的鸿门宴，但看到康佑薇娟秀的落款与天子的漆印才发觉这是正式邀请。\n“Miss钟，好久不见。”叶言的声音自钟岚珠迈进东华门后适时的响起，“此次入京，还算顺利？” \n “没你们的人在身后追，倒是轻松的很。”钟岚珠握住了叶言伸出的手，“那只老狐狸呢，喊致公党的人过来难道就是为了炫耀她们成功了？” \n “当然不是，钟小姐。”叶言侧过身，比了一个请字，“康公与黎公在殿内等您，有关您和致公党的问题，想必等您亲自见到他们二位自有定夺。” \n “哼……”\n…………\n “致公党，成立于1911年，党主席钟岚珠，常务主席刘美帆，我本来还以为你会带着她一起来，看来我们这个“革新联盟”还是被钟大小姐处处提防啊。“\n “少说两句，老狐狸，我来这里可不是听你来念稿子的。“钟岚珠一拍桌子，怒视端坐在前方的康佑薇\n“如果你觉得这是场鸿门宴，那大可不必撑那单刀赴会之盛气。进入正题吧，Miss钟。“康佑薇取出一份文件，转向递给钟岚珠。”贵党之理念虽略显不切实际，但亦为神州大地创新进取之理，亦然，贵党所行为神州黎民，与我等思行一致，故——“\n “择日召之议会首集，暂予致公党六十六席参议席位，邀其共参国政，共解国忧。“\n康佑薇将笔置于卷首，拱手作揖\n“如果钟小姐没有别的问题的话，请在这里签字。至于开会时间，定下来后会由白芷提前联系你的。” \n纸笔沙沙作响，某人尽力遏制住的声音还是难免流露出欣喜。"
  CHI_Democracy.2.a: "呐，美帆，天大嘅好消息哦"

  CHI_Democracy.3.t: "选举"
  CHI_Democracy.3.desc: "经过数年的政治、军事和经济改革，神州帝国在国会的带领下重归统一和稳定。国家宣布将举行中华历史上第一次正式的全国大选，以检验民主建设的成果。\n\n“麦子熟了几千回，立宪民主第一回。 今日，国会庄严宣布，全国大选筹备工作启动！这不是一场儿戏，而是对数年来以宪约帝，以法治国成果的庄严检验。政党将登台亮相，人民将以选票决定中华的未来走向。”"
  CHI_Democracy.3.a: "农工民主党"
  CHI_Democracy.3.b: "立宪民主党"
  CHI_Democracy.3.c: "中国致公党"
  CHI_Democracy.3.d: "公民自由联盟"
  CHI_Democracy.3.e: "公车党"
  CHI_Democracy.3.f: "中国青年党"

  CHI_Democracy.4.t: "[FROM.GetName]国有化了我们的资产！"
  CHI_Democracy.4.d: ""
  CHI_Democracy.4.a: "[FROM.GetLeader]她们就是帮暴徒！"

  CHI_Democracy.5.t: "打虎"
  CHI_Democracy.5.d: "袁克定一死，其麾下的亲兵必成隐患，此时不出手，更待何时！北方袁系奉天靖难之景不应二度重现……“\n“新党上台最要之事为收拢人心，袁定克伏诛，北方军虽势大但也必群龙无首，此时理应招安，定东北以制南军……”\n案前，黎星刻看着两份观点截然不同的文书，深深的叹了口气。的确，北方军势大但内部也未必铁板一块，多费些时日或许也能吸纳到一批优秀的将帅以便一统神州。但……\n“星刻，还没睡吗？”关切的声音将黎星刻从思绪中拉出，少女天子一袭素衣，悠悠自里殿藏书阁中走出。立宪诏下后国家事务由国会接管，早朝自然而然地淡出群臣视野，天子陛下闲下来后便将自己关在书房内，但多数政令仍需天子批阅。于是，黎星刻自然而然的当起了这么一个“桥梁”。\n “文书工作很快收尾，臣先送陛下回宫就寝……”\n“不要太勉强自己了。”\n”天子陛下”黎星刻微微一怔，支起半边的身子僵在原地。\n“我——说——不要太勉强自己了，星刻。”少女天子款款走向黎星刻，伸出小指，“我怎么说还是个天子，处理文书还是在行的，所以……可以的话，也可以依赖一下我的。”\n是啊，我还在疑虑什么呢，黎星刻还以蒋丽华以微笑，勾住了少女天子伸出的小指。\n\n良久，武英殿的烛光再度亮起，黎星刻将桌上的其中一纸文书丢入火内，提笔写道："
  CHI_Democracy.5.a: "重岳将军亲启……"

  CHI_Democracy.6.t: "临时约法"
  CHI_Democracy.6.d: "1.凡未经议会同意，以天子权威停止法律或停止法律实施之僭越权力，为非法权力。\n2.近来以天子权威擅自废除法律或法律实施之僭越权力，为非法权力。\n3.神州以天子为尊，以国会为首，国会之意乃天子之意，乃神州之意。\n4.设立审理宗教事务之钦差法庭之指令，以及一切其他同类指令与法庭，皆为非法而有害。\n 5.凡未经议会准许，借口天子特权，为天子而征收，或供天子使用而征收金钱，超出议会准许之时限或方式者，皆为非法。\n6.向天子请愿，乃臣民之权利，一切对此项请愿之判罪或控告，皆为非法。\n 7.除经议会同意外，平时在神州境内征募或维持常备军，皆属违法。\n 8.凡臣民系神州之臣民，常备武器者，皆属违法\n 9.议会之选举应是自由的。\n 10.议会内之演说自由、辩论或议事之自由，不应在议会以外之任何法院或任何地方，受到弹劾或讯问。\n 11.不应在未审判前强课过分之罚款，更不应滥施残酷非常之刑罚。\n 12.定罪前，特定人的一切让与及对罚金与没收财产所做的一切承诺，皆属非法而无效。\n13.为申雪一切诉冤，并为修正、加强与维护法律起见，议会应时常集会。"
  CHI_Democracy.6.a: "为天地立心，为生民立命，为往圣继绝学，为万世开太平！"

  CHI_Democracy.7.t: "立宪之日"
  CHI_Democracy.7.d: "夫神州衰落之发生，实继承专制时代之思想，对内牺牲民众利益，对外牺牲国家利益，以保持其过去时代之地位。夫反革命之恶势力所存，实由帝国主义卵翼之使然。近年来之战祸，直接受自军阀，间接受自帝国主义，明明白白，无可疑者。\n今者，袁氏伏诛以开天下之局，天子下诏以鼓天下之气，国臣练兵以强天下之势，是时以变法成天下之治，开万世之太平。神州立国七十载，造独立自由之国家，拥护国家及民众之利益。维新变法之目的纵未能完全达到，然不失正鹄，以日跻于光明，则有断然者。今朝吾辈继变法先烈之遗志，撑家国之傲骨！\n以宪约帝，以法治国，可定神州山河，屹世界之林，实现真正之民权制度，以谋平民群众之幸福。"
  CHI_Democracy.7.a: "麦子熟了几千回，立宪民主第一回"

  CHI_Democracy.8.t: "立宪典礼"
  CHI_Democracy.8.d: "这一天，太和殿广场聚集了数万京城百姓，见证立宪之日。少女天子蒋丽华穿着简朴的礼服，站在台前。她不是在登基，而是在移交权力。\n康佑薇在宣读《临时约法》时，语气庄严：“神州以天子为尊，以国会为首，国会之意乃天子之意，乃神州之意。 凡未经议会同意，以天子权威停止法律之僭越权力，为非法权力！”\n宣读完毕，蒋丽华平静地从案上取下代表至高皇权的玉玺，将其置于国会代表的面前。她没有一丝留恋，微笑着说：“朕之所愿，乃神州之万世太平。 朕信国会，能替朕开万世之基。”\n随后，她走向黎星刻，伸出了小指：“星刻，朕已将大权移交国会，但人心思变，”她指向广场上的民众，“未来，就靠你们在国会里，为朕守护这份太平。”"
  CHI_Democracy.8.a: "天子大权正式移交国会，帝国由专制转向立宪"

  CHI_Democracy.9.t: "为民主执剑"
  CHI_Democracy.9.d: "黎星刻和天子勾小指的微笑背后，是军政改革的巨大压力。袁氏余党的威胁未绝，军队的去政治化和肃正军纪刻不容缓。\n黎星刻看着自己批复的公文，公文中写道：“为杜绝袁氏般挟军自重，必须彻底分离军队与政治，保证军队只忠于国家！”\n黎星刻将其中一纸主张“招安”的文书丢入火内，提笔写道："
  CHI_Democracy.9.a: "重岳将军亲启：新军应以稳定为重......"

  CHI_Democracy.10.t: "民贵君轻：饭碗与新思想"
  CHI_Democracy.10.d: "大旱之年，以往只有等死。但今年，国会推行的农业救济补助款到账了。王老汉看着新送来的种子和工具，他知道今年至少能活下来。\n隔壁村的张秀才，正在田埂边对着一群农民宣讲。他不是在宣扬天子，而是在宣传“民贵君轻”的思想。\n张秀才：“老乡们，以前天子是天上，我们在地下。现在不一样了，民贵君轻，天子将权力交给了国会，国会是万民的。国会的议员，是咱们的仆人！”\n王老汉：“啥叫仆人？俺不懂。”\n张秀才：“你拿到这救济款，这就是仆人做的事！你饿肚子，政府就要管。以前只管上头的官老爷，现在要先管咱们农民！因为咱们的饭碗，比天子的龙椅更重要！”\n王老汉听得似懂非懂，但他记住了两点：第一，政府给了他活命钱；第二，他被告知，他自己很重要。一个能让他吃饱饭的民主，也许真的值得一试。"
  CHI_Democracy.10.a: "民贵君轻的思想开始渗透"

  CHI_Democracy.11.t: "农工联盟：民主的基石"
  CHI_Democracy.11.d: "赤羽站在一张巨大的神州地图前，标记着各地的农会和工会组织。她在选举中胜出，但深知国会中的反对派势力强大。\n赤羽：“国会不是我们的最终战场，人民才是。我们不能让农民和工人在旧势力的蛊惑下迷失方向。当务之急，是执行《自耕农补贴法》，并彻底将散乱的工会和农会整合成统一的‘农工联盟’。”\n内务大臣：“主席，整合农会势必会触动地方士绅的利益，他们的乡绅势力仍有影响力。而工会，特别是大城市中的洋行工会，对政府主导的联盟有抵触。”\n赤羽：“所以我们要赋予联盟权力——自耕农的基本收入保障，将由联盟监督发放；工人的劳动待遇保障，将由联盟主导谈判。我们要让工农明白，是我们在为他们争取利益，他们必须团结在联盟的旗帜下，作为捍卫民主与社会主义的坚实基础。”"
  CHI_Democracy.11.a: "工农万岁！立即成立统一联盟。"

  CHI_Democracy.12.t: "血汗工厂：工人待遇保卫战"
  CHI_Democracy.12.d: "纱厂女工小青已经在机器前连续工作了十二个小时，疲惫得眼前发花。在农工民主党上台前，她们的薪水被厂主随意克扣，工时毫无限制。\n今天，厂里突然贴出公告：政府颁布《最低工资与工时法》，要求所有工厂推行八小时工作制，并大幅提高最低工资。但厂主拒绝执行，引发了大规模罢工。\n小青却发现，这次和以往不同。新成立的农工联盟代表直接介入谈判，而政府劳工部的督查员也站在工人这边。他们要求厂主必须遵守法律，否则将面临罚款。\n厂主（愤怒地大喊）：“这是对我财产的掠夺！我给政府交了多少税？！”\n督查员（冷冷回应）：“您的利润已通过《二次分配税》流向了社会保障。现在，请您按照《劳动法》行事。工人的健康与权利，不再是您可以随意剥削的成本。” 小青第一次感到，自己不再是可随意丢弃的零件。"
  CHI_Democracy.12.a: "工人的权利优先，必须坚持执法到底。"

  CHI_Democracy.13.t: "分配之争：谁动了谁的奶酪"
  CHI_Democracy.13.d: "国会正在就赤羽政府提出的《二次分配税法》进行激烈辩论。该法案旨在通过累进所得税和遗产税，切断官僚资本的不法流程，并将资金用于提高社会保障。\n保守派议员：“赤羽主席！这是对私人财产的公然掠夺！这种‘优化二次分配’，与赤匪的暴力革命有何区别？这会使富人逃离，外资却步！”\n赤羽（平静地回应）：“区别在于，我们通过民主宪政的程序达成。我们在打击不法官僚资本的同时，将合法资本纳入体系，并让他们承担社会责任。一个没有社会保障的社会，是动乱的温床。 贫民因饥饿而暴动，最终的成本将由所有资本家承担。我们在做的，是为这个国家购买一份最稳固的保险。”"
  CHI_Democracy.13.a: "坚定信念，强力推行二次分配法案。"

  CHI_Democracy.14.t: "和平的宣言：社民天国"
  CHI_Democracy.14.d: "赤羽政府在国会和民众中获得了空前的支持，各项温和的社会主义改革均已通过并见成效。\n赤羽（在大会上演讲）：\n“我们用温和的改革，而非暴力的流血，将中国社会带入了一个新的阶段。社民天国并非空中楼阁，它就是：农民不再惧怕饥荒，工人不再被剥削，老者有所养，幼者有所教。”\n“我们与过去的革命者不同，我们证明了，在民主宪政的框架内，社会进步不仅可能，而且更持久。 农工联盟是我们最坚实的力量，国会是我们实现理想的工具。神州帝国，将成为世界上第一个通过和平民主程序建立的社会主义天国，为所有追求公平与人性的国家，树立典范！”"
  CHI_Democracy.14.a: "民主框架下的社会主义已取得胜利！"

  CHI_Democracy.15.t: "革命的宣言：废除帝制"
  CHI_Democracy.15.d: "赤羽（庄严地向国会宣布）：“迈向革命的进程不可逆转。我们通过民主宪政实现了对资本的约束和对工农的保障，但君主制这一封建残余，已成为我们继续迈向彻底社会主义理想的最大矛盾与讽刺。”\n周恩莱（发言）：“天子陛下在过去几年为和平立宪做出了巨大贡献，她的历史功绩不容抹杀。但人民共和国的最高主权，必须且只能属于全体人民。今天，我们必须完成历史的最终交接，彻底终结皇权！”\n在国会以压倒性多数通过《废除帝制法案》后，少女天子蒋丽华平静地签署了最后一份文件——一份象征着她自愿将皇权彻底交还于民的诏书。当夜，神州帝国国旗降下。\n最高宣告：“神州帝国寿终正寝！[ROOT.GetName]正式成立！”"
  CHI_Democracy.15.a: "建立[ROOT.GetName]！"

  CHI_Democracy.16.t: "英雄不朽：共和国的谅解"
  CHI_Democracy.16.d: "新生的共和国必须疗愈历史的创伤。在人民英雄纪念碑奠基仪式上，前帝国军人和前中共战士的家属被邀请同台。周恩莱在致辞中宣布：所有为中华民族独立和富强而牺牲的战士，不论曾隶属何方，均是人民英雄。\n前帝国将士家属（泪流满面）：“我的丈夫当年是为帝国而战死的，现在人民共和国承认他是英雄... 我能接受了。至少，他不是白死的。”\n周恩莱：“今日立此碑，旨在正视历史，平反所有为中华民族的独立和富强而牺牲的战士。只有放下仇恨，共和国才能真正团结一致，迈向未来。”"
  CHI_Democracy.16.a: "正视历史，达成民族谅解。"

  CHI_Democracy.17.t: "社会主义市场：前所未有的道路"
  CHI_Democracy.17.desc: "在废除帝制后，国会面临建立经济体制的挑战。许多反对社会主义的资本家携款外逃。国会中有声音要求采取激进的全面计划经济。\n赤羽：“他们逃了也好，但我们改革的步子不能急。我们不能重蹈覆辙，陷入僵化的计划经济。”\n周恩莱：“我们将参考社会主义的计划经济和西方的凯恩斯概念，建立一个有约束、有导向的社会主义市场体制。市场由人民和国家主导，而非资本。这是前所未有的发展道路，我们必须谨慎探索。”"
  CHI_Democracy.17.a: "从零开始，探索社会主义市场道路。"

  CHI_Democracy.18.t: "上海·人民钢铁厂"
  CHI_Democracy.18.desc: "工人老李站在高炉前，汗水浸湿了工装。这间厂过去是官僚资本的产业，老李曾是随时可能被解雇的“雇工”，工作时间被无限拉长，收入全靠老板的良心。\n现在，厂名换成了“人民钢铁厂”，老李也成了厂里的“工人代表”。厂里没有了以前那种为抢订单而不计代价的狂热，生产任务和原材料供应都由国家计划委员会在年初就下达，订单虽然稳定，但市场竞争的压力也小了许多。\n新来的厂长（以前的工人）对大家说：“是的，我们的社会主义市场不像资本家那样追求暴利，我们的步子慢，但稳。资本家跑了，我们自己来！我们保障产品销路，也保障各位的饭碗。这个市场，是国家和人民的契约，不是资本家的赌场！”老李摸了摸胸口口袋里的工人代表证，他知道，这个有约束的市场，首先保障的是他作为主人翁的尊严。"
  CHI_Democracy.18.a: "谁说社会主义不能搞市场？"

  CHI_Democracy.19.t: "民族资本的春天：扶助创业者"
  CHI_Democracy.19.desc: "黎星刻主持的经济委员会正在讨论如何落实“保护并发展民族资本”的竞选承诺。民族小企业在大企业和洋人资本的双重夹击下生存艰难。\n黎星刻：“我们不能重蹈覆辙，允许资本巨头垄断市场。给予创业优待，设立专项贷款和税收减免，是激活市场活力的第一步。我们要让所有有才华的国人，都有机会成为自己命运的主人，而不是被大资本剥削的劳工。”\n金融大臣：“首相，这会引起旧财阀的不满，他们认为政府干预了自由市场。”\n黎星刻：“真正的自由市场，不是任由强权欺凌弱小。我们是立宪民主党，我们保障所有人的基本权利——包括公平竞争的权利。只有民族企业壮大，我们才能真正发展民族企业，最终走出国土，与洋人竞争。”"
  CHI_Democracy.19.a: "扶助弱小，保障所有国民的创业自由。"

  CHI_Democracy.20.t: "东亚的目光：拥抱自由思潮"
  CHI_Democracy.20.desc: "在“拥抱自由世界”国策推动下，神州政府放宽了舆论管制，大量来自西方国家（如圣杯、幻想乡）的自由主义、宪政思想书籍和学者涌入神州。京城大学举办了一场关于“东亚民主与西方自由”的研讨会。\n学生甲：“圣杯的议会制度虽然先进，但并不完全适合我们。我们的立宪民主必须根植于中华文化，与我们的天子制度相结合。”\n西方学者：“神州这种在君主制框架下的自由尝试，是独一无二的。但真正成为亚洲民主先锋，需要你们能够承受住周边军国和极权势力的压力。”\n黎星刻在闭幕致辞中强调：“思想的自由激荡，是民主活力的源泉。我们引入思想，不是为了全盘照抄，而是为了择优而从。我们将用实践证明：民主与民族文化、与东亚秩序，绝非水火不容！”"
  CHI_Democracy.20.a: "思想自由，择优而从，吸收西方民主精华。"

  CHI_Democracy.21.t: "公权下乡：打通民主的最后一公里"
  CHI_Democracy.21.desc: "在偏远的华南农村，乡民老刘正参加他人生中第一次乡级选举。过去，这里的一切都由乡绅和地主说了算，老百姓只知有“家法”，不知有“国法”。\n如今，根据“民主下乡”的政策，新的乡长将由村民直接投票选出。乡政府墙上贴着“公权共享”的宣传画：国家权力不再是高不可攀的“老爷”的，而是每个百姓应得的权利。\n基层干部（对村民）：“我们来这里，不是为了当新的土皇帝。而是将中央的公权交到大家手上。村里修路、教育、卫生，你们说了算！你们的选票，就是你们最大的权力！”\n老刘看着自己手中的选票，尽管有些笨拙，但投下这一票，他感觉自己和远在京城的国会第一次产生了真正的联系。"
  CHI_Democracy.21.a: "将民主下到乡里，巩固基层公权。"

  CHI_Democracy.22.t: "亚洲民主先锋：民惟邦本"
  CHI_Democracy.22.desc: "在一系列政治、经济改革完成后，神州已然成为了一个稳定、富强的立宪民主国家。黎星刻在天安门广场发表了对亚洲邻国的《东亚民主宣言》。\n黎星刻（在演讲中）：“我们不追求军事霸权，我们追求思想灯塔！周边邻国对我们的恐惧，源于他们落后的君主制与军国体制。他们将民主视为瘟疫，但神州证明了：民惟邦本，本固邦宁！”\n黎星刻（面向世界）：“神州的成功，证明了民主绝非西方独有，亦可根植于东亚大地。我们愿与所有追求和平与进步的国家并肩，用我们的光辉，照亮亚洲，扫净黑暗，让亚洲各国百姓得享民主之福！”"
  CHI_Democracy.22.a: "民惟邦本，神州将是东亚民主的灯塔！"

  CHI_Democracy.23.t: "权力下放的试验：航道经济学的实践"
  CHI_Democracy.23.desc: "钟岚珠摇着檀香折扇，坐在会议桌的首位。她将一份由各省起草的经济发展草案分发给中央官员。草案内容涉及地方关税自主、区域货币流通等敏感权力。\n钟岚珠：“航道经济学告诉我，地方的繁荣是国家稳定的基石。中央过去对各省经济自主权的抑制，只会导致全国一盘棋、全国一盘死。沿海的贸易省份与内陆的农业省份，他们的发展需要不同的工具。”\n中央旧官僚：“主席，此举无异于开历史倒车，各省拥有扩大省权后，可能各自为政，引发恶性竞争！”\n钟岚珠：“竞争是必然的，但中央的作用是协调，而非压制。我们的职能是设定规则，而非代替各省行事。要相信各省的自我发展能力。千帆过尽皆生意，百川归海自成邦。”"
  CHI_Democracy.23.a: "放开手脚，授予各省完整的自主权。"

  CHI_Democracy.24.t: "无为之治：中央的后撤"
  CHI_Democracy.24.desc: "新生的中央政府做出了一个惊人决定：宣布中央权力减弱，大幅削减中央各部的权力与预算，并将大部分公共服务职能移交给省级单位。\n钟岚珠（对媒体）：“老子有云：无为而治。并非我们不作为，而是我们拒绝粗暴干涉。在联省自治的结构下，中央必须遵循制定的规则，将权力控制在一个合理限度内。”\n记者：“主席，这是否意味着中央将不再对地方事务负责？”\n钟岚珠：“恰恰相反。我们将通过问责制度，要求地方对人民负起更大的责任。中央的角色从‘家长’转变为‘仲裁者’和‘规则制定者’。中央的后撤，是为了地方的成长。”"
  CHI_Democracy.24.a: "以无为实现有为，中央只作仲裁者。"

  CHI_Democracy.25.t: "联省宪政：工会与人事自决的平衡"
  CHI_Democracy.25.desc: "各省正忙于制定省宪，将自治权力纳入法律框架。该宪法明确了人事自决的权力——省长及其官员将由地方选举或任命，而非中央指派。\n一些地方精英试图利用人事自决，将权力重新集中在少数富商或地方士绅手中。但中央政府（致公党）要求在所有省宪中加入“保障工会权力”的条款。\n地方士绅代表（对省议员）：“我们获得了人事自决，为何还要受工会牵制？他们只会煽动工人闹事！”\n钟岚珠代表（在省议会发言）：“自治的基石是人民民主，而非少数精英的独裁。工会是保障人民权力、防止地方割据的必要力量。流官制下的官员无需负责，但本地官员必须对本地百姓负责。 只有人民的参与，才能让省宪真正可靠。”"
  CHI_Democracy.25.a: "确保省宪的民主要求，工会权利不可或缺。"

  CHI_Democracy.26.t: "民族复兴的基石：实业与外资的平衡"
  CHI_Democracy.26.desc: "洛天依政府的首要任务是加速国家现代化。委员会正在讨论如何应对西方“去工业化”的鼓吹，同时最大限度地利用全球资本。\n洛天依：“我们不能像某些国家那样，为了短期利益和外资，就放弃我们发展实业的决心。神州有数万万子民，工业化是我们安身立命的根本，我们必须重金投入，不能仰人鼻息。”\n外交大臣：“首相，若对外资设置过多限制，他们会转向其他国家。”\n洛天依：“所以我们需要智慧。我们提供扩大外资规模的优待，以引进技术和管理经验；但同时，我们必须明确红线——外资必须服务于我们的实业发展和现代化目标，而不能是单纯的金融掠夺。我们要的，是合作的资本，不是主宰的资本。”"
  CHI_Democracy.26.a: "坚持实业为本，有条件地引进外资。"

  CHI_Democracy.27.t: "民主制度的中华化：拒绝西方照搬"
  CHI_Democracy.27.desc: "在完善民主制度的过程中，政府智库拒绝了全盘照搬西式民主的提议。他们认为，西式民主在地方管理上容易形成贵族割据，导致基层民众权力缺失。\n洛天依：“周虽旧邦，其命维新。 我中华之民主思想源远流长，周召共和便是开端。我们不应一味效仿。弘扬民主思想，要将民主与我们自古以来‘为民请命’的政治哲学相结合，构建出更符合神州国情的、能真正赋予基层百姓权力的民主制度。”\n智库负责人：“新的制度应确保地方百姓通过自己的方式参与决策，而非仅仅由少数有产者和贵族代议。这才能让民主一以贯之，彪炳千古。”"
  CHI_Democracy.27.a: "从神州实际出发，构建独特的民主模式。"

  CHI_Democracy.28.t: "文化复兴：新月学社的光芒"
  CHI_Democracy.28.desc: "在“歌颂神州”的宣传运动和“文化现代化”的资金支持下，以洛天依创办的“新月学社”为核心，一场全国性的文化复兴运动达到高潮。\n艺术家、作家、学者汇聚一堂，讨论如何将评弹、相声等民间艺术纳入学术体系，同时吸收世界先进文化，实现文化上的现代化。\n洛天依（在沙龙中）：“长期的积贫积弱使我们丧失了文化自信。我们必须向天下人阐述：天下只有一个神州！ 我们要用现代的笔触、现代的媒介（如收音机），让《黄河大合唱》这类新式作品传遍城乡，重拾失落的人心。真正的现代化，是精神和物质同时的强盛。”\n媒体人：“收音机进万家，我们的文化不再是少数精英的。它是大众的，是属于所有神州子民的！”"
  CHI_Democracy.28.a: "融合古今中外，实现文化的全面现代化。"

  CHI_Democracy.29.t: "现代化强国：古老帝国的涅槃"
  CHI_Democracy.29.desc: "在完成实业、文化、政治上的全面现代化后，神州帝国已涅槃重生。洛天依出席了“神州现代化成果展览会”。\n洛天依（在展览会上）：“我们没有盲目模仿西方，也没有固守传统。我们坚持实业，吸收外资；我们弘扬民主，但构建了中华式的民主制度；我们歌颂神州，同时实现了文化现代化！”\n洛天依（面向世界）：“神州已然成为了一个真正的现代化强国。我们的成就证明了：古老的东方帝国，能够在保留自身文化传承的同时，走出现代化、民主化的独特道路！我们将沿这条道路继续走下去，让神州成为亚洲，乃至世界第一的现代化强国！”"
  CHI_Democracy.29.a: "全面现代化目标达成，神州将是世界强国！"

  CHI_Democracy.30.t: "精神的复兴：皇权与礼仪"
  CHI_Democracy.30.desc: "符华政府的首要目标是利用现代手段重建国民的精神秩序。过去的动乱导致社会上“礼仪缺失、目无尊长”等乱象。\n符华：“我们必须利用现代科学的力量，为古老皇权注入新的活力。通过皇家新闻的电台和电影，向天下百姓宣传天子与皇室的勤政、亲民形象，消除旧时皇权深居宫墙的隔阂。”\n教育大臣：“同时，我们已将以史为镜写入新国民教育大纲。以传统礼仪和中华历史为纲，打击崇洋媚外之风，重塑国民对中华文明的自信和敬畏。”"
  CHI_Democracy.30.a: "复古维新，重建中华的精神脊梁。"

  CHI_Democracy.31.t: "民本思想的蓝图：皇权直达基层"
  CHI_Democracy.31.desc: "符华政府正在将“党权下乡”的政治成果，转化为“皇权下乡”的民本体系，以保障君主制下的人民权益。\n符华：“中华之根在于民，而非君。 我们必须重拾民贵君轻的民本思想。君主制深谙人心，不是靠天子的猜度，而是靠制度保障黔首走卒的权力，让他们通过基层组织上达天听。”\n内政大臣：“新的机制将建立对地方官员的问责制。如果地方出现贪腐或不作为，中央将迅速介入。此举是为了让百姓感受到皇权的服务和关怀，而非压迫。”"
  CHI_Democracy.31.a: "民贵君轻，建立皇权直通基层的问责体系。"

  CHI_Democracy.32.t: "皇室的温度：收音机进万家"
  CHI_Democracy.32.desc: "乡民老李坐在院子里，收音机正播放着天子蒋丽华慰问灾区的新闻，语气温和而坚定。过去，老李只知道天子威严，离他遥远。现在，他感到皇室有了“温度”。\n隔壁的王大婶走了过来，感激地说：“多亏了咱们新推行的‘皇权直通车’，我前几天通过乡里组织反映的修路问题，县里三天就派人下来勘察了！要是搁以前，我们百姓哪有机会上达天听？”\n老李看着收音机，又看了看院子外泥泞的路面，第一次感到京城和皇室不再只属于士绅阶级，这个古老的帝国正在用一种新的、温暖的方式，履行着民本的责任。"
  CHI_Democracy.32.a: "君主之恩，如沐春风。"

  CHI_Democracy.33.t: "新儒家的格物：以天命顺应科学"
  CHI_Democracy.33.desc: "符华政府宣布新儒家学说为新的治国纲领。她对传统思想进行现代化诠释，尤其是关于“天命”和“格物”的哲学。\n符华：“我们重新诠释天人感应，它要求所有人恪尽职守，顺应自然规律和道德天命。高层必须顺应天命——这意味着遵循科学规律（格物）和尊重民意。”\n学者代表：“新的儒家思想将更重视格物致知，把对科学和外来思想的学习纳入新格物学的重要方向。这才是儒家文明得以延续，并实现现代化的正道！”"
  CHI_Democracy.33.a: "格物致知，新儒家引领中华现代化。"

  CHI_Democracy.34.t: "伟大的现代化帝国：君主制的荣光"
  CHI_Democracy.34.desc: "符华（在太和殿向群臣宣告）：“我们以民本为心，以新儒家为纲，以天子为神州的象征与精神灯塔，找到了属于中华的现代化道路！那些嘲笑君主制已是历史糟粕的列强，都将看到一个全新的、强大的、充满活力的神州帝国！这荣耀，将彪炳千古！”"
  CHI_Democracy.34.a: "复古维新大功告成，中华帝国万年！"

  CHI_Democracy.35.t: "经济清洗：强制国有化外资"
  CHI_Democracy.35.desc: "汉阳造首相在会议上果断地宣布了对外国资本的最后通牒。她认为，以外国资本为首的“技术垄断和肆意定价”严重损害了神州利益。\n汉阳造：“我们不会再容忍外夷之不臣，强制国有化外资是收复国家经济主权的必要之举。我们将以最快速度完成资产估价，但若她们企图反抗，我们不惜动用武力！”\n财政大臣：“首相，这会引发国际社会强烈的反弹，尤其圣杯和幻想乡的经济报复。”\n汉阳造：“报复只会证明我们道路的正确性。神州的复兴必须为民族资本让路，我们将对支持政府、发展良好的民族企业给予政策和资金支持。重赏之下必有勇夫，只有先驱逐外敌，民族工业才能拥有与世界竞争的力量。”"
  CHI_Democracy.35.a: "以国力强制收复经济主权。"

  CHI_Democracy.36.t: "思想的净化：内除国贼"
  CHI_Democracy.36.desc: "随着经济清洗的开始，汉阳造将焦点转向意识形态领域。她宣布，国内的“崇洋媚外”政客和学者，是比外资更危险的“国贼”。\n汉阳造：“近代的苦难起源于外国入侵，但内奸的腐蚀让国家无力抵抗。我们必须内除国贼，坚决打击、限制那些鼓吹外国制度、出卖神州利益的政客和学阀，剥夺她们的一切权力。”\n安全部长：“首相，‘国贼’的定义可能过于宽泛，这会引发社会恐慌。”\n汉阳造：“我们强调的是国家意识和力量建设，必须外抗强权。那些不相信中华自强、不相信民族独立的言论，本质上都是在动摇国本。对她们的打击，正是捍卫我国主权、建设强大国家意识的第一步。”"
  CHI_Democracy.36.a: "肃清内奸，以铁腕手段捍卫国家思想主权。"

  CHI_Democracy.37.t: "文化的烈火：洋货焚毁"
  CHI_Democracy.37.desc: "在青年党政府的“反对文化侵略”运动感召下，一股激进的民族主义情绪席卷街头。城市广场上堆满了外国的唱片、电影海报和杂志，学生们正高呼口号，点燃了这些“洋货”。\n学生领袖（声嘶力竭）：“卖国学者常宣传是我国传统文化导致了积贫积弱！这是谎言！我们要弘扬传统文化，以我国传统美德和革故鼎新的精神，重拾民族自信！不属于神州的，都该被这烈火吞噬！”\n旁边的老匠人，正在教导一群学徒如何制作传统的漆器。他说：“天子与首相牵头恢弘传统之进步之风，是中华发展之正道。我们不排斥科学，但我们只用中华之魂！”"
  CHI_Democracy.37.a: "扫清精神毒瘤，文化自立。"

  CHI_Democracy.38.t: "兵工女杰的承诺：自强之道"
  CHI_Democracy.38.desc: "汉阳造首相回到了她的根基——汉阳兵工厂。在完成对外国资本的驱逐后，国家工业进入了完全国产化的轨道，但技术升级压力巨大。\n汉阳造（对工程师和工人代表）：“德意志的机械是先进，但我们照抄永远只能仰人鼻息！我的祖父曾参与建设汉阳铁厂，我们有匠心，我们有《天工开物》的智慧！”\n汉阳造：“德意志的机械配上华夏的匠心，才是真正的自强之道！ 我们将投入所有收回的资产和民族资本，实现军械生产线的全面国产化和技术突破。我们要让全世界看到，神州的自强，不依赖任何外夷施舍。”"
  CHI_Democracy.38.a: "德械华心，实现工业和军事的完全自立。"

  CHI_Democracy.39.t: "最终的宣告：中华屹立宇宙间"
  CHI_Democracy.39.desc: "在驱逐了外国势力、肃清了内部“国贼”、实现了经济和文化独立后，汉阳造在全国军民大会上，发表了最终的民族宣言。\n汉阳造（在演讲中）：“我们摒弃了传统的糟粕，吸收了外国的先进事物，但我们坚决抵制了外国的入侵！我们的文化、我们的制度、我们的军队，现在都独属于神州！”\n汉阳造（高声呼喊）：“以神州之正气，逐外夷之不臣！ 我们的进步不代表我们要放弃传统，我们的强大不代表我们要依附外夷！神州将再次超越各国，成为当世第一，中华屹立宇宙之巅！”"
  CHI_Democracy.39.a: "誓言达成，中华将独霸寰宇！"

  CHI_Democracy.40.t: "英雄不朽：历史功绩的肯定"
  CHI_Democracy.40.desc: "联邦政府常务委员会正在审议一项法令，旨在公开肯定国民党和共产党在反帝反封建斗争中的历史功绩。这对于曾长期互称“赤匪”和“乱党”的两党来说，是巩固三方联盟的信任基石。\n[ROOT.Getleader]：“为了巩固三方联盟，必须彻底清除旧政权对两大党的政治污名。历史的评判，现在由人民来书写。我们必须正视并肯定所有为民族存亡做出贡献的力量。”"
  CHI_Democracy.40.a: "肯定功绩，清除污名，弥合历史隔阂。"

  CHI_Democracy.41.t: "和解的祭奠：共祭英烈日"
  CHI_Democracy.41.desc: "国家公祭日，在新建的英烈纪念碑前，来自前帝国军、国民党军和共产党军的家属第一次站在一起。他们胸前佩戴着各自的徽章，但都为同一块石碑下的共同信仰而默哀。\n原帝国军士家属：“我的丈夫当年是奉命围剿赤匪的，而他的战友现在正站在我身边。但在抵抗樱花国入侵时，我们都流了同样的血... 联邦政府决定公平公正地纪念所有英雄，这让我们心头的创伤得到了弥合。”\n老百姓：“过去我们分不清谁是国贼谁是英雄。现在，联邦告诉我们：所有抵抗外敌、推翻旧王朝的，都是民族的英雄。有了这份和解，我们老百姓才敢相信和平是真的来了。”"
  CHI_Democracy.41.a: "放下仇恨，以共同信仰凝聚人心。"

  CHI_Democracy.42.t: "宪政蓝图：两院与大帐篷"
  CHI_Democracy.42.desc: "联邦政府正在构建其核心政治结构。会议确定设立联邦参议院（固定席位制）和众议院（民主选举制）作为最高立法机构。\n[ROOT.Getleader]主席：“组织两院是为了权力制衡，确保没有任何一方能够独大。参议院保障了国共两党和民主党派的长期席位；众议院则由人民选举，体现民主。”\n联邦总理：“此外，我们必须推行‘大帐篷’政治联盟扩大运动，鼓励所有中小党派和地方贤达加入联邦治理。只有最大限度地扩大统治基础，联邦才能稳定，实现真正的全民政治。”"
  CHI_Democracy.42.a: "两院制衡，海纳百川，扩大政治联盟。"

  CHI_Democracy.43.t: "经济复苏：五年计划的启动"
  CHI_Democracy.43.desc: "联邦政府宣布启动五年经济恢复计划，以恢复农业和基础工业。同时，一项雄心勃勃的综合工业化实验正在讨论中。\n经济部长：“我们将利用前王室的津贴和国际援助，为经济振兴奠定物质基础。更重要的是，我们将主导一场技术整合实验，融合西方的工业体系、苏维埃的重工业模式和魔导科技，迅速建立起具有时代竞争力的联邦工业。这是综合工业化的必经之路。”"
  CHI_Democracy.43.a: "整合技术，中西苏联手，启动五年计划。"

  CHI_Democracy.44.t: "机器的轰鸣：联合的成果"
  CHI_Democracy.44.desc: "东北的某重工业基地，原先是帝国留下的老厂，现在正进行着一场史无前例的“技术整合”。工程师老王，过去只接触过西方设备。现在，他正与来自苏维埃的专家和归国的留学生一起工作。\n苏维埃专家（指着图纸）：“你们西方的精密机械适合轻工业，但我们的重工业模式在钢铁生产上更高效。我们必须整合！”\n工程师老王：“我以前从未见过如此大规模的统筹规划，但它确实加速了生产！厂里刚来了不少新设备，听说有西方援助的，也有苏维埃运来的。工人们也不再为站队而争吵，大家只为一个目标：经济振兴。”\n机器的轰鸣声响彻云霄，老王感受到，这不是哪一党的胜利，而是三方合作带来的，实实在在的现代化力量。"
  CHI_Democracy.44.a: "工农一心，联合工业化力量强大。"

  CHI_Democracy.45.t: "时代的宣告：中华联邦世纪"
  CHI_Democracy.45.desc: "在国家统一和经济复兴大业完成后，中华联邦宣布完成其历史性转型。\n联邦主席（在议会大厦前）：“我们是民主、共和、社会主义和民族主义共同精神指导下的国家。我们经历了内战的创伤、异族的入侵，但我们选择了和解与合作！”\n联邦主席（面向世界）：“一个强大的、由人民和各党派共同治理的国家，屹立东方！我们已准备好迎接世界的所有挑战，并向全人类宣布：分裂和黑暗的时代已经终结！中华联邦世纪已经来临！”"
  CHI_Democracy.45.a: "中华世纪来临，联邦将领导亚洲。"

 ####### 袁线事件 ########
  CHI_Yuan.001.title: "大雪之下"
  CHI_Yuan.001.desc: "今日的天津，下起了鹅毛大雪。\n街上已看不见一个行人，倒不是大雪封门，而是因为每家每户都能听见密密麻麻的，几乎从不间断的军靴声封住了民户。神州军队正在有序的进入城区。并且安静、沉默。正如这座城市一般。\n若是外人看见，定会认为北方将有战事。不然为何要屯兵重镇。\n“那是第6军...是曹将军的军队，怎么连南方的部队都调回来了？”\n在小站的临时司令部内，第24军将军齐燮元听着门外又一波喧闹袭入门内，有些郁闷的将一块新的兵牌放了上来。\n“看上去也只有几千人的样子...你说，齐将军，为何大帅要将我们召至此地？万一发生战事，驻区的士兵群龙无首...”\n接话的是第8军统领孙殿英。二人同为袁氏嫡系，与老北洋系尚有分别，但与大帅亲近如此，两位将军也不知大帅欲意何为。\n十余名将军，数位督军，被秘令带领部分军队，从各地星夜赶回天津，此乃北洋一系龙兴之处。无人知晓袁克定为何要将这些关乎边境安危的大将召回。此举风险极大，若是遭遇突发战事。后果不堪设想。\n正因如此，当晚，当这些将领坐在堂外，顶着风雪等待大帅之时，有些老将便议论纷纷了。\n其中最激烈者当属“辫帅”张勋。此公一把年纪，却要顶着风雪与众将一同坐在屋外，自然大发牢骚。\n然而，当袁大元帅蹦蹦跳跳地不知从何窜出，站在一众将官面前时，后者随即噤声。\n“老齐，我叫的人都到齐了吗？”今日的大元帅，平日的军装被一套斗篷盖住，虽威严依旧，但言语间并无压迫感，反倒有些亲昵。\n“报大帅，均已到齐，目前屯军天津之兵士，已逾两万，皆听大帅调遣。”此语一出，原先安静下来的诸将便有开始议论纷纷。\n“各位，我仍然记得，新军颠覆之际，诸位与我戮力同心，才保的帝国如今之局面。”袁克定背着手，神情变得意外严肃。\n“这，这，大帅，多余的话自不必言，定是朝中奸佞又在口出狂言，迫害大帅！”张勋一改刚才的怨相，甩了甩脑后的辫子，似乎最先意识到事情并不简单。“如今国会早已解散，流言又如何伤到本帅？”她在众人面前来回踱步。接下来的话语让人脊背发凉。\n“这次，我们要面对的，不是暗箭，是明枪。根据可靠情报，一小时后，皇家内卫统领，千岱芷，会带着三千死士，袭击本帅的寓所，并且，杀进皇宫，救出当今的皇上。京城里的禁军，也会云集响应。”这下人群再一次安静下来。所有人都知道这意味着什么。\n“属下，斗，斗胆发问...这是，这是政变！？”“嗯，保王党们，已经按捺不住，那位小皇上，似乎，也准备好行少康故事了。”\n“如，如果丢失北京，我，我们都会被打为叛党！大帅，如今如何是好？”坐在后排的将军曹锟有些慌乱的发问。"
  CHI_Yuan.001.a: "要是丢了，打回去就行了。"
  CHI_Yuan.002.title: "京师之变"
  CHI_Yuan.002.desc: "“各位，我接下来的话，你们都听好。”看着底下正坐着的诸位将官，袁可定沉声说道。\n“现在，北京政府——我们的政府正面临前所未有的危机，我没有预料到保皇党人胆子如此之大，当政变计划水落石出之时，已经晚矣。如大家所知的，自从我父亲袁世凯讨伐帝国之敌，在天津建立起帝国新军以来，各位身居高位，统领万众，有谁不是受我父袁公恩惠之人？是袁公集结起新军之力，让我们这群武人能够督军全国，为了北京政府能有今天，父亲付出了多大的心血！”\n“一切，都是为了建立起崭新的，属于我等，属于新军的时代！袁公的大恩，尔等应当不敢忘记吧？”\n“为了报答他，我们该怎么办？当然是用他留给我等的遗产！去保卫他呕心沥血创建的武人之世！”\n“但是——”袁的语调转而变得悲伤。“年幼无知的少帝，被身边的那群发小蛊惑，在如今恍若天倾之时，还在做着四海来朝的春秋大梦！要摧毁帝国赖以生存的根本。如此，北洋危矣，帝国危矣！”\n“若有不愿见证悲剧发生的人，就请带领麾下军队，随我返回北京！若有忠君之士，我亦不强留。任凭离去。”\n“怎么可能会有这样的人！”话音刚落，孙殿英便站起大喊。虽然事先没有通过气，但在场的将军，哪个不是有几百个心眼的人精？\n“就在此地，先袁公创建了让我们得以安身立业的地方，不保卫这份基业，我还有什么脸面自称北洋新军！？”张勋咳嗽了两声，旋即起身响应。“皇帝又有什么可怕的！？若是无道暴君要卸磨杀驴，我们也不怕带上反贼的帽子！”袁的一席话点燃了台下的情绪\n“造反！造反！”十余位将军的喧闹声划为整齐的口号，但旋即遭到了大帅的否定。\n“并非造反！诸位！” 袁克定褪去了萝莉面孔下的娇嗔，露出了野兽一般的模样。“谋反之人，正是皇上自己！”\n就连台下群情激愤的人们都因这原本不可能合成一句话的词句愣了一下。“我再说一遍！谋反者，乃陛下也！我军，前去戡乱！”"
  CHI_Yuan.002.a: "敌人，就在那皇居之上！"
  CHI_Yuan.003.title: "紫禁城的大火"
  CHI_Yuan.003.desc: "“还没打下来吗？新华门？”京城内的临时总指挥部，张勋劈头盖脸地教训起身旁的参谋人员。\n“叛军据地利固守，又不能使用重火力，对方都是经过训练的死士，若是被拖入巷战，只怕对我军不利！”\n此帅并未过多犹豫。“那就调飞机重炮过来，炸了！”“将军，您是认真的？”“废话！”\n保皇党人并未想到北洋军队如此践踏皇城，不约而同的，数道大门皆遭北洋军炸毁，军士鱼贯而入，涌进了紫禁城。\n数千禁军与神州内卫正拼死守卫在内城的最后一道防线上，她们已经决意战至最后一人，因为她们的背后，便是皇居所在。\n战至下午，北洋军伤亡惨重，却仍未攻下，哪怕是前线指挥也不敢将炮口对准皇居，\n当幼小的天子出现在战场上时，北洋一方人心浮动，甚至出现了溃退的部队。\n“老齐头！大帅究竟怎么说？”曹锟指向远方的内城战场。“士兵们不敢将枪口对准皇上！如今再不做些什么，万事休矣！”\n“大帅的意思是，她从未下令禁止炮轰紫禁城。”“我当然知道！可是皇帝现在就在那，如今——”\n“袁公养汝，正拟今日！复何疑！？”哪怕已经做出了如此悖逆之事，但这句话依旧让曹锟倒吸一口凉气。\n“按大帅的意思，要死的？”“大帅的意思，要死的。”\n当袁克定的军队进入皇居之时，一同送进来的还有柴薪，因为没有发现天子的尸体，所以她们判断皇上躲进了皇宫。\n当日夜晚，紫禁城的大火，将整个北京的夜空染做橙黄，此时，骑着白马的袁克定这才踏雪而来，好像她从未参与过这场兵变。\n清理一下现场，明日，便可重建新的宫銮；清扫干净灰烬，明日，便可重建新的帝国。"
  CHI_Yuan.003.a: "如梦似幻"

  CHI_Yuan.004.title: "铁腕之下：新摄政王"
  CHI_Yuan.004.desc: "在清除黎星刻后，袁克定正式自封新摄政王。她将权力中心从紫禁城转移至原楚王府，并开始全面军事化管理朝政，以挟天子以令诸侯的方式，震慑天下。\n袁克定：“朝廷已无需再讨论什么立宪不立宪，国会不国会。主少国疑，大厦将倾，唯有集权方能解局。今后王命不出蒋，一切军政要务，皆出此门！对那些南方军头，让他们看看，这天下究竟谁在执牛耳！”\n亲信将领：“元帅，现在满朝文武只听摄政王调令，但幼帝本人依然被保皇一派视为希望。我们是否应该...”\n袁克定：“王命不出蒋。孤需要的是她活着，作为法统的旗帜。只要能掩其耳目，秘不声张，保皇一派自有按捺不住的时候。届时，我们只需戡乱，而非叛乱。”"
  CHI_Yuan.004.a: "王命不出蒋，权力集中于摄政王府。"

  CHI_Yuan.005.title: "国会清场：大清算"
  CHI_Yuan.005.desc: "袁克定认为帝国议会内的立宪派和清流党是其统治的最大障碍。她亲自率领宪兵团，对国会发动了“大清算”，以“肃清政治乱局、遏制激进议案”的名义解散国会。\n袁克定（在议会大厦门口，对列队的宪兵）：“这些帝国之奸贼蜗居在此，议而不决，莫衷一是，早已是阻碍神州进步的毒瘤！如今王师都不怕，已不是一般的谏臣，必须出重拳！解散国会！”\n被捕的立宪派议员（高喊）：“袁克定！你是军阀独裁！你破坏宪政！”\n袁克定（冷笑）：“宪政？在饥民哀鸿遍野时，你们在议论礼仪！只有速成契合国情之宪法，才能巩固中央权威，保地方之安宁。将所有反对者，送去修筑北方军的防线。”"
  CHI_Yuan.005.a: "出重拳，解散国会，逮捕国贼。"

  CHI_Yuan.006.title: "新经济架构：强硬工业化"
  CHI_Yuan.006.desc: "袁克定宣布成立现代化经济部，全面接管国家经济命脉，以推动强硬工业化。她召集了一批曾被旧朝廷排挤的公费留学生担任顾问和技术官僚。\n袁克定：“旧朝廷的工业化举步维艰，皆因议而不决！现在，我们要像彼岸的樱花政权一样，建立现代化帝国政府，让强硬工业化势不可挡。你们这些学成归来的留学生，有才华却无官可做，现在，效忠于我，为神州的强大筹划！”\n留学生代表：“摄政王，工业化需要巨大的启动资金，原朝廷的财政...”\n袁克定：“资金，我们可以从京畿的商人那里获取。我们有枪杆子，他们有钱。政企合作，是效率最高的办法。我们只需要控制命脉，不需要亲自下场。”"
  CHI_Yuan.006.a: "建立现代经济部，以铁腕推动工业化。"

  CHI_Yuan.007.title: "皇都繁荣：政企合作的黑幕"
  CHI_Yuan.007.desc: "京畿地区的富商李老板正心惊胆战地喝茶。他的民办钢铁厂刚刚接到了一笔来自摄政王府的“合作”订单——以低于市场价的价格供应军需钢材。\n李老板（低声对同伴）：“说是政企合作，实际上就是强买强卖！我若不签，她就说我‘资助赤党’。摄政王说皇室的脸面不值一提，皇都的繁荣才是要紧事。可这繁荣，是用我们的血汗铺成的啊！”\n同伴：“至少袁帅还给我们留了口饭吃。比起被那些老朽官员层层盘剥，现在虽然被压榨，但订单总归是稳定的。而且，北方军确实强大，我们也不用担心再被两广或张逆祸乱了。”\n李老板叹了口气，瞥了一眼茶馆外巡逻的北方军士兵，最终在合同上按下了手印。他知道，这片繁荣，是建立在军权的绝对掌控之上的。"
  CHI_Yuan.007.a: "接受合作，为摄政王的军需提供支持。"

  CHI_Yuan.008.title: "喉舌易主：掌握宣传机器"
  CHI_Yuan.008.desc: "袁克定宣布彻底改组旧礼部，建立新的宣传机构，以掌握宣传机器，为摄政王本人输出正确的价值观。\n袁克定：“礼部的腐儒们只知道固守陈腐不堪的忠君思想，他们无法为民间大众输出新的、正确的价值观。让她们和她们的礼部一起见鬼去吧！”\n新宣传部长：“元帅，我们将利用报纸、电台和电影，将摄政王打造成神州自强、挽救危局的象征。同时，对地方流传的谣言，秘密警察部门将负责清除。”"
  CHI_Yuan.008.a: "喉舌在手，为元帅打造民族救星形象。"

  CHI_Yuan.009.title: "忠诚之刃：军官大换血"
  CHI_Yuan.009.desc: "为了确保军队的绝对忠诚，袁克定以军官大换血为名，将原帝国军的非北洋系军官全部替换，或调往冲突前线。秘密警察部门也正式启动，专门负责监察军官团的忠诚度。\n袁克定：“政治上的忠诚要远远比所谓的战术素养来的重要。 维新派曾建议改革原有军队，这是我无法接受的。现在，改革继续，但成果将牢牢掌握在北洋一系的手中。”\n秘密警察头目：“元帅，我们已经组建了一支绝对忠诚的情报队伍，他们将负责监察所有军官。任何对摄政王的不忠言论，都将被记录并处理。我们决计另辟蹊径，成就您的大事。”"
  CHI_Yuan.009.a: "清洗旧军官，确保军队对摄政王的绝对忠诚。"

  CHI_Yuan.010.title: "东方之光：新史书与第四帝国"
  CHI_Yuan.010.desc: "在旧皇权被火焚毁后，国家需要新的精神纽带。袁克定命令国家文化委员会重修史书，将国家意志凌驾于一切之上。\n袁克定（电报）：“旧日腐儒为限制君权，以暴君之名限制施政。从今往后，要平反帝王！重修史书，复旧秦皇汉武之威名，以明天威！”\n汉阳造：“元帅的智慧超越凡俗！我们不必再强调伪朝天命，我们要强调中华民族主义。神州继自先秦汉、唐宋、元明诸帝国，今日元帅所建，乃是中华之第四帝国！我们要一扫旧日积弊，带领民族重夺旧日荣光，恢弘志士之气！”"
  CHI_Yuan.010.a: "破邪显正，以暴君之名正威严之实。"

  CHI_Yuan.011.title: "铁血长城：青年军与先军政治"
  CHI_Yuan.011.desc: "在一处秘密的训练营内，新组建的“袁克定青年军”正接受着远超常规部队的严苛训练。她们是元帅的真正嫡系军队，被要求对元帅个人保持绝对的忠诚。\n青年军军官（声嘶力竭）：“你们不是普通的士兵！你们是元帅的忠诚之刃！国家昏乱，九洲倾覆，继续在政治领域进行无聊的过家家是无用的！帝国当以军队的利益为先，先军政治势在必行！”\n新兵（自白）：“我从小就听说，军阀只会保护自己的利益。但元帅不同，她集北洋一系之力，富国强兵，就是为了民族解放！我的忠诚只属于元帅个人！”"
  CHI_Yuan.011.a: "忠诚铸铁军，以先军政治打造民族利刃。"

  CHI_Yuan.012.title: "太阳下的孩子：元帅的恩情"
  CHI_Yuan.012.desc: "在一间新修缮的乡村小学里，孩子们正齐声朗读政府新编的教材。教材的扉页是元帅袁克定穿着军装的画像，以及一些富有韵律感的句子。\n老师（指向黑板上新学的标语）：“来，我们再一起念一遍！‘你若三冬来，换我一身雪白~想--吃--河--南--菜~袁大元帅就是我们的太阳！’ 谁要是连萝莉大元帅都没法相信的话，瓦塔西！——”\n孩子们（齐声高喊）：“——瓦塔西！我绝对忠诚！”\n在不远处的农田里，老农民虽然听不懂那些奇怪的句子，但他知道，自从元帅上台后，军需征粮虽然严格，但赤匪和军头的祸乱确实少了。他默默念叨着：“袁公实乃朝中柱石。”"
  CHI_Yuan.012.a: "宣传入脑入心，确立元帅的太阳地位。"

  CHI_Yuan.013.title: "劝进表与真香定律"
  CHI_Yuan.013.desc: "紫禁城大火后的第十五天。袁克定站在铺满波斯地毯的临时朝堂上。一群以张勋为首的“定难功臣”正哭天抢地、声泪俱下地呈上劝进表。\n张勋（将劝进表举过头顶，涕泪横流）：“吾皇万岁！天命有变，神器更易，而归有德之人！袁公您有戡乱之功，又有威加四海之德，这皇帝之位，您就是坐在屁股底下那椅子，它自己都会长脚跑过来缠住您啊！新天命不就在您这吗？”\n袁克定（面无表情，内心OS）：“一群戏精。当初在午门外冻得像狗的是谁？现在跑得比谁都快来抢着当功臣。不过这九五之尊的排场，确实比‘摄政王’听着顺耳多了。”\n袁克定（轻咳一声，假意推辞）：“诸位卿家言重了。朕...哦不，袁公何德何能，能承大统？”\n孙殿英（大喊）：“您不能推辞啊！您要是不登基，我们就得回去接着做军阀！到时候您又得戡乱！求您了，为了天下不再混乱，当皇帝吧！”"
  CHI_Yuan.013.a: "从善如流，为大局计，勉为其难地称帝。"

  CHI_Yuan.014.title: "礼崩乐坏？不，是重塑周礼！"
  CHI_Yuan.014.desc: "新皇登基后的首次大朝会，气氛诡异。袁克定要求朝臣们尊孔复古，复周礼。\n袁克定（坐在新龙椅上，面色不悦）：“朕听说，旧日神州礼崩乐坏，朝臣不侍立两旁，反而于国会内交口谤讪，争锋相对？这简直是笑话！今后，你们都得规规矩矩地站好！谁再敢当面吵架，朕就让你们去西北喝沙子！”\n老臣甲（试图拍马屁）：“陛下英明！中央集权是正道！从今往后，帝国之事，皆决于您一人，可免去那群庸人的聒噪了！”\n袁克定（得意洋洋）：“那是自然。朕要重建九州咸服，万国来朝之气象！至于那些旧朝的放权现象？君不知京畿以外三十里之大事？从今往后，朕连你家今晚吃啥都得知道！”"
  CHI_Yuan.014.a: "拨乱反正，用周礼来规范朝臣的“站姿”。"

  CHI_Yuan.015.title: "军人的功勋：收拢兵马与军事考核"
  CHI_Yuan.015.desc: "袁克定宣布，作为天下兵马大元帅，她要收拢中央王师，并对新朝的勋贵们进行军事考核。\n袁克定（对众将领）：“诸位！你们因戡乱有功，大多身居要职。可朕最近听说，有些人在军中玩忽职守，只顾着收租子，把操练当过家家！枪杆子才是硬道理！朕可不像前朝旧帝，擅自杀伐。但你们得考试！考不好，就去给朕看守边境的马厩！”\n曹锟（擦汗）：“陛下，微臣老了，考不过啊！微臣...微臣擅长唱歌，陛下可否让微臣去礼部？”\n袁克定（冷笑）：“曹爱卿不必担心，朕说了，是筛选出真正可堪大用的军事将领。你...你先去陆军部给朕烧开水吧。收拢天下兵马，从朕统一指挥开始！”"
  CHI_Yuan.015.a: "军人也要考试，不合格的就去烧开水！"

  CHI_Yuan.016.title: "新容克的诞生：定难功臣的土地与特权"
  CHI_Yuan.016.desc: "原本在工厂打工的普通工人，现在成了“定难功臣”的佃农。新朝廷效法西方旧德册封容克之例，将工厂周围的土地和特许经营权赏给了参与戡乱的功臣。\n新地主（穿着新定制的丝绸长袍，对佃农训话）：“你们现在都是我的佃农！皇上论功行赏，授予我定难功臣之名，还有这片土地的特权！你们要感谢天子之恩！以后工厂的活儿，也得归我管，知道吗？！”\n佃农（低声议论）：“这跟以前的军阀有什么区别？不过是换了个皇帝。以前是武人督军，现在是武人封地。至少现在有饭吃，不用担心被赤匪来回拉锯。”"
  CHI_Yuan.016.a: "册封新贵族，用特权换取底层军士的忠诚。"

  CHI_Yuan.017.title: "泰山封禅：皇后的新衣"
  CHI_Yuan.017.desc: "在完成了对全国的军事和政治整合后，袁克定决定效仿古代帝王，登泰山行封禅大典，以向天地宣告天命在我。\n袁克定（登上泰山之巅，头戴新制九旒冕，穿着一套明显不适合登山的金色龙袍）：“皇天在上，后土在下！朕承天命，统御万邦！四海升平，百姓安乐，此皆赖朕修明武备，移师南疆，万民归伏！”\n随行太监（悄悄对身旁大臣）：“您看陛下这新龙袍，金光闪闪的，可比那旧朝的龙袍好看多了！就是这山路走上来，陛下这小短腿有点吃力啊...”\n张勋（大声喊）：“吾皇万岁！陛下万岁！这泰山都臣服在您的天威之下！既寿永昌！”\n袁克定（摆了个威严的姿势，但因风大差点跌倒，赶紧扶住）：“咳！天命在我！告诉那些不服的军头，朕有戡乱之功，枪杆子才是硬道理！去，给朕把山下那些看热闹的洋人记者都拉过来，让他们拍个够！”"
  CHI_Yuan.017.a: "天命永昌，新洪宪皇帝正式加冕！"

  CHI_Yuan.018.title: "朝会新风：谁的屁股该站哪儿？"
  CHI_Yuan.018.desc: "袁克定登基后，首次召集百官大朝会。但她宣布，为了“拨乱反正”，要彻底废除旧朝那套“不伦不类”的规矩，启用《周礼》！然而，当她看到一群军阀出身的新贵族们对着礼部官员发放的《周礼》站位图挠头时，面色开始变得铁青。\n袁克定（坐在龙椅上，面色不悦）：“朕听说，旧日神州礼崩乐坏，朝臣不侍立两旁，反而在那国会里像菜市场一样交口谤讪，争锋相对？简直是贻笑大方！从今日起，一切遵照《周礼》，分公、侯、伯、子、男五等，都给朕按爵位站好！谁再敢乱站，就是扰乱天命！”\n张勋（努力阅读手中写着“立于东阶”的图示，被旁边的曹锟不小心挤了一下）：“老曹！你挤我干啥？我是‘定南侯’，你才是‘安北伯’，你该往西边挪三步！别搞混了朕...哦不，是圣上的天威！”\n曹锟（满头大汗）：“我哪知道！那图上写着‘面北而立’，可泰山方向在哪？陛下，这站位比打仗复杂多了！我们能不能...能不能继续收拢天下兵马？枪杆子才是硬道理啊！”\n袁克定（冷笑）：“枪杆子是硬道理，但站位是面子工程！站不好，朕怎么重建九州咸服，万国来朝之气象？从今往后，朕不仅要中央集权，连你们走路的姿势朕都要管！谁再敢当面吵架，朕就让你们去西北喝沙子！”"
  CHI_Yuan.018.a: "拨乱反正，用周礼来规范朝臣的“站姿”。"

  CHI_Yuan.019.title: "京城轶事：卖油条老王的烦恼"
  CHI_Yuan.019.desc: "京城的小贩老王今天早上算是开了眼。自打袁大帅登基改元以来，规矩就跟雨后的春笋一样，“噌噌噌”地往外冒。什么“复周礼”，老王一个卖油条的哪懂啊？他只知道以前的朝臣们吵架归吵架，至少走路还算正常。\n现在可好，一队新封的“定难功臣”们，穿着新发的官服——那颜色据说得按爵位来，什么“玄色”、“朱色”，比戏台上的角儿还讲究——正小心翼翼地从街上走过。他们走得那个慢啊，生怕哪一步踏错了，踩了“天子”的威严。\n老王偷偷听见两个低级官员在争论：\n小官甲（偷偷翻着一张皱巴巴的《周礼站位示意图》）：“哎哟喂，我这‘承恩男’是该在东阶还是西阶的北面啊？我刚才在朝会上差点就站到张勋将军的侯爵位置去了，听说站错的直接被罚去马厩喂马了！”\n小官乙：“你管它东阶西阶！你只需要记住，走路的时候，得先拱手三次，再侧身四十五度，表示你心悦诚服！上次有位大人鞠躬角度不够，被陛下罚抄了三遍《周礼·春官宗伯》！”\n老王赶紧把头缩回摊位后面，心想：这新皇帝治国跟军训似的，连鞠躬角度都管！不过话说回来，规矩虽然多得吓人，但至少没人再敢在城里开枪打仗了。老王叹了口气，把手里的油条翻了个面，自言自语：“管他什么周礼秦制，只要油条能卖出去，就是好日子。只是这油条的颜色，不知道有没有犯新朝的忌讳啊？”"
  CHI_Yuan.019.a: "老王还是决定把油条炸得金黄酥脆，不理会那些古怪的规矩。"

