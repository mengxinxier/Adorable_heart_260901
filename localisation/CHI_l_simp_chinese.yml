  CHI_fuhua_desc: "§Y派系§!：$GongChe_name$\n§Y生平§!：§L「她承继了康公的衣钵，却非其简单的影武者；在旧学与新潮的碰撞中，她为古老的公车党注入了温润而坚韧的‘人事’之魂。」\n\n符华其名，在1937年康佑薇逝世之前，于帝国政坛尚不显山露水。她并非维新派的元老，而是康公晚年最为看重及栽培的关门弟子，一位在康佑薇流亡归来后、于新旧思想激烈碰撞的学院讲坛中被发现的璞玉。与康公早年锋芒毕露的激进姿态不同，符华的气质更近乎于一位沉静的学者，她深谙康公托古改制的精妙义理，却更倾向于一种“无为而治”与“人事自决”的柔性治理哲学，坚信自上而下的变革需与基层社会的自身活力相融合。在康佑薇与黎星刻结成危险同盟、于暗室中对抗袁克定的最后岁月里，符华是其身边少数几位能参与核心机密的亲信之一，她以不引人注目的方式，协助康公维系着与各方势力的脆弱联系，并在这个过程中，悄然赢得了党内许多务实派成员的信赖。因此，当康公溘然长逝，面对内外交困的局面，旨在避免分裂的公车党各方势力，最终共同推举这位兼具康氏正统传承与温和务实风格的年轻学者接任领袖。执掌公车党后，符华并未急于展现雷霆手段，而是以其独有的方式诠释并发展了康公的学说，她更强调“君主深详人心”中的“人心向背”，将施政焦点置于地方自治与民生疾苦，主张精英引导而非强力干预，力求为这个深陷于军阀独裁与革命浪潮夹缝中的古老帝国，探寻一条立足传统、却更具韧性与包容性的渐进革新之路。§!"
  CHI_lixingke: "黎星刻"
  CHI_lixingke_desc: "§Y派系§!：$Cadets_name$\n§Y生平§!：§L「他是梁启超的关门弟子，她是帝国唯一的太女。一场师徒的知遇，一段深宫的情愫，共同铸就了神州最年轻的改革旗手。」\n\n黎星刻生于1910年，其少年早慧与不凡气度得到了流亡归来的维新派领袖梁启超的极大赏识，并被其破格收为关门弟子。在梁启超的悉心栽培下，他不仅接受了系统的西方政治思想与军事理论，更继承了其师“君主立宪、革新神州”的未竟之志。正是因为这层特殊的师承关系，他被宣宗蒋瀚宸选中，以伴读身份进入宫廷，陪伴在太女蒋丽华身边。\n\n在紫禁城的重重宫阙之中，黎星刻与蒋丽华一同成长。他既是她的侍卫与学伴，也是她窥探高墙之外世界的窗口。常年累月的朝夕相处，在严格的宫廷礼仪之下，两人心中逐渐萌生了超越君臣、朦胧而又深厚的情感。这份深藏于心的羁绊，成为了黎星刻日后所有行动最深层的情感动力，也让他被牢牢绑定在帝国命运的核心。\n\n他的才华同样得到了皇帝的认可。为抗衡袁克定日益膨胀的北方军，皇帝授意黎星刻利用皇室内帑组建并执掌「京城新军卫所」。这支装备精良、思想新潮的部队，迅速成为捍卫皇权、推行改革理念的尖刀，也让年轻的黎星刻拥有了在乱世中立足的坚实军权。\n\n至1936年，年仅26岁的黎星刻已身负多重身份：他是梁启超政治遗产的继承者，是蒋丽华女帝最信赖的守护者与情感寄托，是帝国革新派寄予厚望的军事领袖，更是袁克定独裁道路上最危险的年轻对手。他站在时代的十字路口，怀中揣着恩师的理想，心中藏着对女帝的誓言，手中握着未来的兵符，准备为重塑一个崭新的神州，掀起席卷天下的风暴。§!"
  CHI_yanxishan: "阎曦珊"
  CHI_kangyouwei: "康佑薇"
  CHI_kangyouwei_desc: "§Y派系§!：$GongChe_name$\n§Y生平§!：§L「以一部《伪经考》破旧学桎梏，以一腔热血倡维新变法，晚年却身陷朝堂，在帝国的残垣上与曾经的敌人结盟，只为守住最后一丝变革的火种。」\n\n康佑薇，字广厦，祖籍广东南海，早年便以惊世才学与叛逆思想闻名于东南士林。她深感于神州帝国在列强环伺下的积弱，撰写了《新学伪经考》与《孔子改制考》等宏文，以考据为利器，大胆论证被奉为圭臬的儒家经典多系后世伪作，并创造性地将孔子阐释为一位“托古改制”的改革家，此举在思想界犹如投下巨石，彻底动摇了保守派“恪守祖制”的理论根基，为变法扫清了道路。1898年，目睹帝国在列强压迫下主权日损、国势衰微，她联合弟子梁启超等千余名举人，发动了声势浩大的 “公车上书” ，直接向绍熙帝蒋启钧吁请拒签辱约、迁都再战、全面变法，其激昂的文字与满腔热血震动朝野，使她一跃成为维新派无可争议的领袖。\n\n随后，在渴望有所作为的绍熙帝支持下，她深度参与了史称 “维新变法” 的百日改革，试图在政治、经济、教育等领域全面推行新政，将古老的神州推向现代化轨道。然而变法触动了太多旧有利益，加之列强担忧一个强大的神州出现，最终导致以圣杯王国为首的五国联军武装干涉。变法在内外夹击下惨痛失败，京城沦陷，绍熙帝殉国，康佑薇与梁启超被迫流亡海外，周游列国，期间组织保皇会，坚持其君主立宪的政治理想。\n\n宣宗中期，她得以归国。此时的神州，中央权威因北伐惨败而丧尽，袁克定北方军权倾朝野。昔日激进的改革先驱，在时代洪流中已成为立宪派的象征。宣宗蒋瀚宸病重时，为维系朝局、制衡袁氏，任命她为国会总理。然而，这位曾欲以雷霆手段重塑帝国的理想主义者，如今却陷入了最现实而残酷的政治泥潭：面对袁克定咄咄逼人的军事独裁，为了保住帝国改革最后的希望与框架，她不得不做出痛苦而务实的抉择——与理念不同、但同样反对袁氏的革新派将领黎星刻结成秘密同盟。至1936年，年近八旬的康佑薇已不再是那个挥斥方遒的变法旗手，而是帝国风雨飘摇中，一位以衰老之躯、在暗室中运筹帷幄，试图于绝望中为神州寻一条生路的复杂守夜人。§!"
