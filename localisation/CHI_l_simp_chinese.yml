  CHI_chongyue: "重岳"
  CHI_chongyue_desc: "§Y派系§!：$Honour_Emperor_name$\n§Y生平§!：§L重岳出生于神州帝国北方将门世家，自幼研习兵法武艺，少年时便投身军旅。在帝国北伐西伯利亚的军事行动中，他率领的晋北边防部队因纪律严明、作战勇猛而崭露头角，虽最终北伐失利，但其部队在混乱撤退中仍保持完整建制，展现出卓越的指挥才能。战后北方政局动荡，他审时度势地固守山西根据地，一面整军经武，一面以佛学修养陶冶心性，在军阀林立的乱世中保持着特殊的超然姿态。\n\n当袁克定逐步掌控北方大权时，重岳敏锐地察觉到其对皇权的威胁。他表面上接受北方军整编，暗中却始终与皇室保持密切联系，多次以“西北防务吃紧”为由拒绝袁克定调其主力离开山西的命令。1931年大饥荒期间，他开放晋北粮仓赈济灾民，并亲自督运粮食入京，此举既缓解了民生疾苦，也暗中巩固了与京城保皇势力的联系。在袁克定篡夺摄政大权后，面对日益加剧的政治压迫，这位向来以“金刚怒目、菩萨低眉”自勉的将领终于做出抉择——他接受了黎星刻与康佑薇的密使，将珍藏多年的佛珠作为信物送出，标志着晋军正式加入反袁同盟。\n\n至1936年，重岳已从一名戍边将领成长为帝国内部抗衡袁克定势力的关键人物。他手握帝国最完整的边防军体系，既保持着传统军人的忠诚，又兼具政治家的远见，其驻守的山西根据地成为保皇派与革新派力量暗中汇聚的重要据点。§!"
  CHI_ling: "令"
  CHI_zhangxun: "张勋"
  CHI_chiyu: "赤羽"
  CHI_chiyu_desc: "§Y派系§!：$PWDP_name$\n§Y生平§!：§L赤羽出生于江浙农家，早年因家族田产被洋行兼并而家道中落，这段经历使她深刻认识到保护民族产业的重要性。她凭借过人天资考入金陵女子师范，在校期间组织“蚕桑互助会”，帮助农妇争取合理丝价，由此开始涉足社会活动。1925年她联合苏州丝业工人成立首个跨行会组织“江南工农互助同盟”，以“保障工人待遇，给予创业优待”为纲领，开创性地提出通过改良议会制度来实现工农权益的渐进式改革道路。\n\n1931年长江水患期间，她带领互助同盟成员深入灾区，既组织灾民自救复产，又借机收集各地田赋数据，编撰的《江南田赋弊政考》成为后来国会改革派抨击旧税制的重要依据。当袁克定推行北方军政党化时，她敏锐察觉到政治变革的契机，迅速将互助同盟改组为“农工民主党”，以“优化二次分配，提高社会保障”为竞选纲领，在1935年国会选举中赢得二十七席，成为制衡军阀势力的重要议会力量。§!"
  CHI_Diana: "嘉然"
  CHI_zhonglanzhu: "钟岚珠"
  CHI_Luo_Tianyi: "洛天依"
  CHI_Luo_Tianyi_desc: "§Y派系§!：$CLU_name$\n§Y生平§!：§L洛天依出生于上海的书香门第，自幼接受中西结合的教育，十四岁时便在《申江新报》发表系列散文《西洋镜里看神州》，以清丽笔触探讨传统礼教与现代文明的冲突。1925年她赴人里大学研习比较文学，期间深受欧洲启蒙思想影响，将《社会契约论》等著作编译成白话章节在《新青年》连载。归国后她在北平创办「新月学社」，定期举办沙龙汇聚作家、艺术家与学者，成为京派文化圈的重要枢纽。\n\n1931年她受聘为燕京大学文学院客座教授，开设的「大众文艺研究」课程首创将评弹、相声等民间艺术纳入学术体系。次年长江水患期间，她组织文艺界义演，率先使用刚引进的电子扩音设备在灾民安置点举办朗诵会，开创了文艺赈灾的新形式。当袁克定加强舆论管制时，她巧妙利用租界特殊地位，主编《自由谈》周刊持续发声，通过书评、剧评等含蓄方式传播民主理念。1935年她联合七所高校成立「文艺复兴同盟」，推动的「收音机进万家」计划使《黄河大合唱》等新式作品传遍北方城乡。\n\n这位总是系着藕荷色丝巾的女士，手提箱里总装着未校的清样与西洋巧克力，在古典与现代的交界处构筑着精神家园。当她在琉璃厂的旧书铺里寻觅宋版残卷时，窗外正掠过售卖《新生活报》的报童身影——这两种时空始终和谐地共存于她的生命里。§!"
  CHI_Kosaka_kirino: "陈桐乃"
