PAM_lldy_category:0 "这里的花花草草"
PAM_lldy_category_desc:0 "我们院子里的事，说大不大，说小也不小。无非是浇浇水，剪剪枝，再把那些想翻过花园的坏脾气邻居哄回去睡觉。等哪天院子里的花全都开了，请大家过来坐坐，喝杯茶，聊一聊明天该在哪个角落再种点什么。\n\n£GFX_PAM_am 安眠点数： §Y[?pam_am|Y0]§!                                     花园修剪次数： §Y[?pam_xjlb_cishu|Y0]§!  £GFX_PAM_sj 因他国被吞并而获得的£GFX_PAM_am 安眠点数： §Y[?pam_am_js|Y0]§!   当前£GFX_PAM_xjlbtb §1夜莺之花§!： §Y[?PAM_xjlb_hua|Y0]§!"
