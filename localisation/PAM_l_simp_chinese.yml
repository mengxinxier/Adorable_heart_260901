PAM_seize_xy_factory_desc:0 "雪伊姐不在白城，只找到她别在袖子上那块红布。线头都散了，在泥雪里泡得不成样子。但她以前说过，这破布拼出来的东西，能让迷路的人看见该往哪儿走。旗子在，她的缝纫机就不会停。"

