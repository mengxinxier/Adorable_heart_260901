PAM_jingong_FROM2:0 "对§Y[FROM.Getflag][FROM.Getname]§!发起§t讨伐§!"
PAM_lueduo_tt: "£GFX_PAO_xingxing 解锁以下§Y三个§!§t针对§Y特定国家§!的决议§!：\n\n§O£GFX_PAM_ldzb_target 扒光他们的铁皮§!\n£GFX_trigger_yes §Y显示§!及§G可用§!条件:\n - 该国和我们处于战争中\n - 目标国家投降进度 > §Y10%§!\n - 目标国家有地区被我们§Y控制§!\n\n§R£GFX_PAM_ldrl_target 谁想吃肉？§!\n£GFX_trigger_yes §Y显示§!及§G可用§!条件:\n - 该国和我们处于战争中\n - 目标国家投降进度 > §Y30%§!\n - 目标国家有地区被我们§Y控制§!\n\n§1£GFX_PAM_ldgc_target 把炉子搬回家§!\n\n£GFX_trigger_yes §Y显示§!及§G可用§!条件:\n - 该国和我们处于战争中\n - 目标国家投降进度 > §Y50%§!\n - 目标国家有地区被我们§Y控制§!"
PAM_lueduo:0 "狼群的掠食法则"
PAM_lueduo_desc:0 "“所谓的文明、国际法，不过是那帮吃饱了撑着的伪君子，为了保护盘子里的肉而编出来的破纸。在我这儿，道理只有一个：饥饿有理，抢劫无罪。\n§O扒光她们的铁皮§! 掠夺次数剩余： [?PAM_ldzb_target|Y0]\n§R谁想吃肉？§! 掠夺次数剩余:  [?PAM_ldrl_target|Y0]\n§1把炉子搬回家§!  掠夺次数剩余:  [?PAM_ldgc_target|Y0]"
PAM_kycs_target:0 "死人不再需要面包§Y[FROM.Getflag][FROM.Getname]§!"
PAM_kycs_target_desc:0 "“十万个名字。十万条原本热乎乎的生命。\n是我杀了她们。我不用谁来提醒我手上的血有多腥。那些坐在高塔里的老东西们把这些可怜的家伙像柴火一样扔进炉子里，想用她们的骨灰来呛死我。真可悲，她们以为只要把穷人填进战壕，就能挡住我的狼群。\n现在好了，柴火烧完了，炉子冷了。那十万个人原本要守卫的仓库，现在没人守了；她们原本要吃的口粮，现在没人吃了。\n既然她们的主子不在乎她们的死活，只把她们当消耗品，那我就不客气了。死人不需要吃饭，死人也不需要穿衣。\n把路让开吧。既然我帮那个国家减轻了十万张嘴的负担，那么……拿走这十万份的剩饭，也是天经地义的吧？”"
PAM_feed_the_struggling_wolves:0 "§R扔给疯狗的肉骨头§!"
PAM_feed_the_struggling_wolves_desc:0 "“看看地图上那几个角落。那些红色的熊，还有那些黑色的鹰，正在被一群自诩文明的猎人围攻。虽然我不喜欢他们——他们一个太啰嗦，一个太傲慢。但不得不承认，他们也是长着獠牙的。\n如果他们现在就被拔了牙，那这世界岂不是太安静、太无聊了？\n晓枫，去仓库里清点一批我们淘汰下来的枪，还有那些缴获的、沾着血的子弹。装船，给他们送过去。\n别给他们写什么友谊长存的鬼话。就写一句话：\n‘别死太快。留着一口气，把敌人的肉咬下来。等我腾出手来……我想吃那个更肥的。’\n哈！让他们去咬吧！这可是我看戏的门票！”"
PAM_ldzb_target:0 "§O扒光她们的铁皮§!§Y[FROM.Getflag][FROM.Getname]§!"
PAM_ldzb_target_desc:0 "“看看对面那些少爷兵，手里拿的是什么？崭新的步枪，还擦得锃亮！再看看我的孩子们手里拿的是什么？磨尖的钢管？生锈的铁片？\n凭什么？！\n传令下去，打赢了别光顾着高兴。去把战场打扫干净！枪、子弹、罐头、甚至她们的靴子和大衣，统统给我扒下来！\n别嫌死人穿过的晦气。在我的地盘，冻死饿死才是最晦气的！把这些好东西都带回来，我要让我的兵，穿得比那些贵族老爷还暖和！”"
PAM_ldrl_target:0 "§R谁想吃肉？§!§Y[FROM.Getflag][FROM.Getname]§!"
PAM_ldrl_target_desc:0 "“看看对面战壕里的那些兵。一个个瘦得像猴子，还要为了那些大人物的‘理想’、‘国家’去送死？真可怜。\n把我们的行军锅架到阵地最前沿去！把肉汤煮开！把白面包堆成山！\n然后冲着对面喊话：‘喂！穷鬼们！别替那些让你们饿肚子的老爷卖命了！过来吧！只要把枪口调转过来，索拉娜女王管你们饱！’\n我要把她们的底层人全都抢过来。因为只有我知道，一个穷人为了活下去，能爆发出多大的力气。”"
PAM_ldgc_target:0 "§1把炉子搬回家§!§Y[FROM.Getflag][FROM.Getname]§!"
PAM_ldgc_target_desc:0 "“我们打下了她们的城市。好极了。\n但我不要这空壳子。我的家在莉兰迪亚，我的子民还在那里等着过冬。\n把工厂拆了！把机器卸下来！把那些能冒烟、能造东西的铁疙瘩，统统给我搬上车！\n别管这城市以后还能不能运转，那是她们下辈子的事。我只知道，把这些炉子搬回家，我家里的火就能烧得更旺，我的孩子们就能少受点冻。搬！连一颗螺丝钉都别给她们留！”"
PAM_ldzb_target_tt:0 "§O扒光她们的铁皮§! 掠夺次数: §G+2§!"
