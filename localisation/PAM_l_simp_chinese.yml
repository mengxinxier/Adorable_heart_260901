 PAM_yy_bop_event: "\n解锁权力平衡决议：§Y今晚会做个什么样的梦呢§!"
 BOP_title_PAM_loc_yy: "§1夜莺之梦§!"
 PAM_yy_bop: "今晚会做个什么样的梦呢"
 PAM_set_power_bop: "再讲一个故事吧"
 PAM_set_power_bop_tt: "如果上下限满足，£GFX_PAM_am 安眠点数每增加一点，§Y权力平衡倾向§!便会向§9与美好相遇§!的方向靠近§Y0.01§!；每减少一点，便向§1与悲伤重逢§!的方向滑落§Y0.01§!。"
 PAM_set_power_bop_up_tt: "（最多延长至 §Y150§! 天）\n若当前£GFX_PAM_amsx §G权利平衡倾向上限§! < §Y100%§!，则上限 §G+2.5%§!\n若当前£GFX_PAM_amxx §t权利平衡倾向下限§! > §Y-100%§!，则下限 §G+2.5%§!"

 PAM_remove_power_bop_up_tt: "（最短缩短至 §Y30§! 天）\n若当前£GFX_PAM_amsx §G权利平衡倾向上限§! > §Y-80%§!，则上限 §R-2.5%§!\n若当前£GFX_PAM_amxx §t权利平衡倾向下限§! < §Y0%§!，则下限 §R-2.5%§!"
 PAM_set_power_bop_desc: "你睡得很安稳，连梦都舍不得来打扰。\n\n当前£GFX_PAM_am 安眠点数： §Y[?pam_am|Y0]§!\n当前£GFX_PAM_xjlbtb §1夜莺之花§!： §Y[?PAM_xjlb_hua|Y0]§!\n当前£GFX_PAM_amsx §G权利平衡倾向上限§!： §Y[?PAM_yy_bop_max_limit|Y2%]§!\n当前£GFX_PAM_amxx §t权利平衡倾向下限§!： §Y[?PAM_yy_bop_min_limit|Y2%]§!"

PAM_bop_loan_military:0 "来自§Y[FROM.getflag][FROM.Getname]§!的灯火"
PAM_bop_loan_military_tt:0 "将本国一部分§R10%§!守卫家园的队伍与装备物资，交付给远方正在黑暗中的人们。\n§L若对方化解了危局、并迎来最终的和平之后，这份在黑夜里送出的温暖，将化作建设家园的火种归还给本国。§!\n\n§Y对了，战后的回报是：§!\n相当于双方工厂总数 §G1%§! 的§G军工§!和§Y民工§!"
PAM_bop_repay_mission_re_tt:0 "\n如果§Y[MGU.getflag][MGU.Getname]§!是我们的§Y盟友§!，我们援助他人的回报就能够分享给她们了。"
PAM_bop_repay_mission_re:0 "再帮下§Y[FROM.getflag][FROM.Getname]§!的朋友们吧"
PAM_bop_repay_mission_re_desc:0 "§1这次帮的忙是不求回报的哦。§!"
PAM_bop_repay_mission:0 "陪§Y[FROM.getflag][FROM.Getname]§!的朋友们等候到天亮吧"
PAM_bop_repay_mission_desc:0 "踏过漫长的道路，前往帮忙的队伍已经赶到了对方的阵地上啦。远方的天空依然沉压着乌云，风呜呜地响个不停。可是，当大家肩并着肩靠在一起的时候，那些害怕与孤单，好像就没有那么难熬了呢。不用着急，也不用害怕。大家会一直守在这里，分担着风雨，守护着身后的欢声笑语。等这场漫长的黑夜彻底过去，等久违的日光重新照亮大地的时候……大家就能手牵着手，一起去迎接那个真正温暖的清晨了哦。"
 PAM_yy_bop_left_side: "§1与悲伤重逢§!"
 PAM_yy_bop_right_side: "§9与美好相遇§!"
 PAM_yy_bop_side_1: "不，我不要这个梦。"
 PAM_yy_bop_side_2: "怎么又是这里，我不是已经醒了吗。"
 PAM_yy_bop_side_3: "好冷。谁把窗户打开了。"
 PAM_yy_bop_side_4: "刚才梦到什么来着……算了，想不起来。"
 PAM_yy_bop_side_5: "翻个身，还能再睡一会儿。"
 PAM_yy_bop_side_6: "啊，这个梦我知道。等一下会有人敲门。"
 PAM_yy_bop_side_7: "别走，再陪我一下下就好。"
 PAM_yy_bop_side_8: "今晚的梦是甜的。"
 PAM_yy_bop_left_side_xl:0 "§t我们终将牵手走向太阳§!"
 PAM_yy_bop_side_xl_3:0 "风吹进来了，可这次，有人替我把窗关上了。"
 PAM_yy_bop_side_xl_2:0 "我不怕那些可怕的黑夜了，因为你把阳光搬进我怀里了。"
 PAM_yy_bop_side_xl_1:0 "吹响哨子吧，这次……我们要去最温暖的家了哦。"
PAM_xjlb:0 "修剪花园"
PAM_xjlb_desc:0 "天气好的时候，就该把花园边上那些长歪了的枝丫修一修。晒着太阳慢慢剪，院子看着整齐了，干活的人心里也舒服很多呢。"
PAM_undead_gambling_category:0 "午夜的赌桌"
PAM_initiate_bone_gamble2:0 "孤注一掷"
PAM_initiate_bone_gamble:0 "向§Y[FROM.Getnamewithflag]§!发起深夜骨牌赌局"
PAM_undead_gambling_category_desc:0 "“外交太无聊了，我们来玩点刺激的，这是我当年在贫民窟学会的好把戏。派个亡灵信使带上一副骨牌，去敲敲其他狼群的门。告诉她们：赢了，我给她们一车黄金；输了，她们给我一车灵魂。规则很简单：血克金，金克咒，咒克血。\n敢不敢来赌一把？看看是你们的运气好，还是我的骨头硬。”\n§Lps:共产意识形态的国家更愿意出血、民主与中立意识形态的国家更愿意出金、极权意识形态的国家更愿意出咒。§!\n\n£GFX_PAM_sl 胜利筹码： §Y[?pam_sl|Y0]§!\n\n£GFX_PAM_pj 平局次数： §Y[?pam_pj|Y0]§!\n\n£GFX_PAM_sb 失败次数： §Y[?pam_sb|Y0]§!\n"
PAM_cash_in_military_luck:0 "连胜的狂热"
PAM_cash_in_military_luck_desc:0 "“我看这把手气正旺！告诉小的们，既然连那些老奸巨猾的邻居都输给了我，这世上这就没什么能挡住我们！\n趁着这股劲儿，把那些挡路的石头都踢开！狼群在赢的时候，牙齿是最锋利的！”"
PAM_cash_in_economic_loot:0 "赢来的金山"
PAM_cash_in_economic_loot_desc:0 "“哈！看看这一堆堆的赌注！黄金、地契、还有欠条！\n把这些赢来的东西都熔了，换成砖头和水泥！既然我们手头宽裕了，就把炉子烧得更旺一点！\n别存着，钱这东西，花出去了才叫钱，存在库里那是废铁！”"
PAM_cash_in_undead_arrows:0 "死神的红利"
PAM_cash_in_undead_arrows_desc:0 "“有些赌注不是金子，是命。\n那些输给我的家伙，把她们的气运和灵魂都留在了桌上。莉莉说，这些东西正好可以用来打磨那些利箭。\n拿去吧！这是赢家的特权。把这堆战利品变成武器，下一把，我们赌得更大！”"
PAM_exchange_bad_luck:0 "把教训熔成金币"
PAM_exchange_bad_luck_desc:0 "“这几把手气不顺？别急着掀桌子。\n把那些断掉的骨头和没响的哑炮都拿来。晓枫能从里面分析出敌人的弱点，雪伊能从里面总结出下次怎么出刀。\n把这些废料熔了，我们能凑出一个崭新的、金灿灿的胜利筹码！\n这就叫……废物利用！”"
PAM_decision_buy_books_for_xiaofeng:0 "绝版战术孤本"
PAM_decision_buy_books_for_xiaofeng_desc:0 "“晓枫不爱金银，不爱丝绸，但她看那几本旧时代军事理论书的眼神……简直像是在看情人。\n那是从旧帝国图书馆废墟里抢救出来的孤本，黑市上炒到了天价。\n哼，不就是几本书吗？给她买！\n告诉她：‘拿去读！读完了给我把战损比再降低一个百分点！否则我就把书烧了取暖！’”"

PAM_decision_buy_supplies_for_xueyi:0 "特供前线补给包"
PAM_decision_buy_supplies_for_xueyi_desc:0 "“雪伊那条疯狗最近咬人咬得太凶，我看她手下的兵连像样的烟都抽不上了。\n用这些筹码，去跟那个走私贩子换一批最好的货：高纯度的医用酒精、真正的烟草、还有那些能防弹的插板。\n直接扔到雪伊的指挥部去！告诉她：‘这是奖赏，也是为了堵住你的嘴。吃好喝好，然后给我更狠地去咬断敌人的喉咙！’”"

PAM_decision_buy_gadgets_for_xiaoguo:0 "精密航海仪器与糖果"
PAM_decision_buy_gadgets_for_xiaoguo_desc:0 "“小果子在海上总是迷路……好吧，其实她是怕黑。\n这批筹码刚好能换一套最新的、带夜光刻度的进口六分仪，顺便……再加一箱那种死贵死贵的、只有以前皇室才吃得起的水果硬糖。\n把东西给她送去船上。告诉她：‘别在那儿哭丧着脸！拿着这个，给老子把路看清楚了！要是再敢把船开进暗礁区，我就把你扔下去喂鱼！’”"
