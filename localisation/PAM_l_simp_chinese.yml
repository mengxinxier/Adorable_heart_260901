PAM_bxaj1_desc: "“我不喜欢做那个梦。\n梦里总是那个样子——无风，无声，连灰尘都悬在半空不动。莉莉就坐在那堆冷冰冰的水晶花中间，像个精致的死人。不管我怎么喊她，怎么摇她，她都只是那样……静静地看着我。那眼神看得我发冷，比以前冬天光着脚踩在雪地里还要冷。\n我讨厌那个地方！我讨厌那种连心跳声都听不见的‘完美’！\n人活着，就该是吵闹的！就该是乱糟糟的！就该有哭声，有笑声，有骂娘的声音，有骨头断裂的声音！那才叫热乎气儿！那才叫‘活着’！\n我把这颗心抢过来，不是为了毁掉她。我是为了……把这股热气儿带给她。我想给她造一个金灿灿的、闹哄哄的笼子，把她关在太阳底下，让她也被烫一下，让她也……流点汗，流点血。\n可是现在，那群叫‘野火’的泥腿子，她们想干什么？她们想让我闭嘴？她们想让我的王国也变成一片死寂的废墟？\n休想！！\n把所有的炮都给我拉出来！让工厂的汽笛日夜不停地叫！让那些贵族和奴隶一起吼！\n我要让这片大陆吵得连死人都睡不着！我要让莉莉睁开眼就能看到……这虽然很疼，但无比鲜活的世界！”"
PAM_bxaj2: "§R不许……那么安静！§!"
PAM_bxaj2_desc: "“我不喜欢做那个梦。\n梦里总是那个样子——无风，无声音，连灰尘都悬在半空不动。莉莉就坐在那堆冷冰冰的水晶花中间，像个精致的死人。不管我怎么喊她，怎么摇她，她都只是那样……静静地看着我。那眼神看得我发冷，比以前冬天光着脚踩在雪地里还要冷。\n我讨厌那个地方！我讨厌那种连心跳声都听不见的‘完美’！\n人活着，就该是吵闹的！就该是乱糟糟的！就该有哭声，有笑声，有骂娘的声音，有骨头断裂的声音！那才叫热乎气儿！那才叫‘活着’！\n我把这颗心抢过来，不是为了毁掉她。我是为了……把这股热气儿带给她。我想给她造一个金灿灿的、闹哄哄的笼子，把她关在太阳底下，让她也被烫一下，让她也……流点汗，流点血。\n可是现在，那群叫‘野火’的泥腿子，她们想干什么？她们想让我闭嘴？她们想让我的王国也变成一片死寂的废墟？\n休想！！\n把所有的炮都给我拉出来！让工厂的汽笛日夜不停地叫！让那些贵族和奴隶一起吼！\n我要让这片大陆吵得连死人都睡不着！我要让莉莉睁开眼就能看到……这虽然很疼，但无比鲜活的世界！”"

PAM_cztm: "§O如何处置……她们？§!"
PAM_cztm_desc: "“火灭了。那些叫得最凶的狼，现在要么变成了尸体，要么变成了笼子里的狗。\n按理说，我该把她们的脑袋挂在城墙上，像那些贵族以前对我做的那样。但是……看着那个叫雪伊的女人那双即使被按在泥地里也依然冒火的眼睛，看着那个叫晓枫的家伙留下的那些写满了幼稚理想的笔记……\n我突然觉得，杀掉她们太无聊了。太浪费了。\n她们和我一样，都是从烂泥里爬出来的。杀了她们，就像是杀掉了……一部分不够狠心的我自己。\n也许我该把她们留下来？给她们戴上金项圈，喂她们吃最好的肉，让她们亲眼看看，我建立的这个——虽然吵闹、虽然肮脏，但能让人活得像个皇帝一样的世界，是不是比她们那个穷酸的‘理想’要强一万倍？”"
PAU_jtpb: "§R该死的军团背叛了我们§!"
PAM_cishawldn:"§Y索拉娜§!没有被刺杀"

PAM_rxdbg: "热血对冰骨"
PAM_rxdbg_desc: "“看看城墙下面那些东西！它们不流汗，不流血，甚至连肉是什么味道都不知道！它们想干什么？想把我这个吵闹、肮脏、但充满活力的城市，变成和它们一样死气沉沉的坟墓吗？\n休想！\n传令下去，把武器库打开！把那些铁铲、草叉、甚至是烧火棍，都发给贫民窟的那些流浪汉！告诉她们：‘你们的血是热的！你们的命是硬的！’别怕那些骨头架子，它们也是脆的！与其被冻死在沉默里，不如把血洒在地上，烫死这帮没有体温的怪物！”"

PAM_zywnzm: "只有我能折磨她们"
PAM_zywnzm_desc: "“喂！泥坑里的那些家伙，都在发什么抖？！\n以前那些贵族把你们当垃圾，但我把你们当狼养！我不许你们死在那群骨头手里！那是对我的侮辱！\n听好了，你们的命是我的。只有我能打你们，只有我能骂你们，也只有我能决定你们什么时候死！除此之外，谁也别想碰你们一根手指头！\n谁敢来抢我的‘崽子’，谁敢让我的子民闭嘴，我就把它的骨头一根根拆下来，磨成粉给你们拌饭吃！站起来！为了我，也为了你们下一顿的热汤，给我杀！”"

PAM_zsdsy: "§R最盛大的喧嚣§!"
PAM_zsdsy_desc: "“喂！下面的那些脏鬼，都给我躲到大殿后面去！别在那儿抖得像个鹌鹑一样，看着心烦！你们的命是硬，但还没硬到能跟这些几万年的骨头硬碰硬！\n我也看够了这群哑巴死人了。它们想要什么？想要这颗心？想要把这个热乎乎的世界变成冰窖？\n做梦！\n莉莉安娜……你在看着，对吧？我知道你在那个黑漆漆的洞里看着。\n那就看清楚了！我要在这里，在这个离太阳最近的露台上，举办一场最吵、最亮、最疯狂的宴会！我要让我的血烧得滚烫，我要让这颗心脏跳得像擂鼓一样！\n我要让这声音穿透你的冥界，刺破你的耳膜！\n别管那些凡人了，冲我来啊！我就在这里！我是索拉娜！我是你唯一的色彩！\n如果你不想让我这团火把你的世界烧干，那就……亲自来抓我啊！！”"

PAM_lqdzw: "狼群的座位"
PAM_lqdzw_desc: "“把那三个家伙带上来。别给她们上镣铐，我又不是要养狗。给我搬三把椅子，就在我旁边。\n晓枫，我知道你脑子好使，但这世道光有脑子填不饱肚子；雪伊，你牙尖嘴利，正好替我咬碎那些硬骨头；还有那个叫小果子的小不点……听说你在海上像只海鸥？那就把眼睛擦亮，替我盯着哪里有肥肉。\n看看窗外吧，那些曾经跟着你们喊口号的泥腿子，现在正捧着我抢来的肉汤，笑得满脸是油。承认吧，你们的理想太干净了，而我的手段虽然脏，但能活命。坐下！吃饭！从今天起，你们就是我的獠牙和眼睛，帮我……也帮你们自己，去抢更多的肉回来！”"

PAM_bhqrh: "把红旗染黑"
PAM_bhqrh_desc: "“我不喜欢那个红色。太刺眼，太像鲜血，看着让人心疼。那种颜色是用来牺牲的，不是用来活着的。\n把它染黑！用石油，用火药，用敌人的血，还有……用那些亡灵身上的灰。我要把野火那种像耗子一样钻洞的本事，和我那些不怕死的亡灵军团缝在一起。让活人在后面抢东西，让死人在前面扛炮弹。\n告诉晓枫，别再教士兵怎么光荣地死了。在我的军队里，只有凶狠地活。我要这面旗帜飘扬的地方，变成……掠夺者们的狂欢场！”"

PAM_xsddst: "喧嚣的大食堂"
PAM_xsddst_desc: "“我没有治国的本事，也不想学那些一看就头疼的法律。我的规矩只有一个：大食堂。\n把整个国家变成一个巨大的、热气腾腾的食堂。抢来的粮食，大家一起吃；抢来的布料，大家一起穿。只有干活的人和吃饭的嘴。\n莉莉，你别皱眉。我知道这很乱，我知道有人在随地吐痰。但你听听……这咀嚼的声音，这吞咽的声音，难道不是这世上最美妙的音乐吗？只要我还能抢来东西，这顿饭就永远不会散场。谁想掀桌子，我就砍了谁的手！”"

PAM_zsblgz: "砸碎玻璃笼子"
PAM_zsblgz_desc: "“看看东边那些小姑娘。一个个长得跟瓷娃娃一样，穿着轻飘飘的裙子，为了什么狗屁契约，在那里流眼泪，在那里自我感动。\n恶心！真恶心！这种看不见摸不着的锁链，比铁链还让人作呕。她们把痛苦当成宿命，把压抑当成高贵。\n去！把那个玻璃笼子给我砸了！把那些魔女、契约统统踩碎！把那些小姑娘抓回来，扔进我的泥坑里，逼她们大哭，逼她们大笑，逼她们学会……像个有血有肉的人一样，脏兮兮地活着！”"

PAM_wjzdt: "把伪君子拽下树"
PAM_wjzdt_desc: "“还有那群住在树上的长耳朵。她们嫌弃泥土，嫌弃铁锈，自以为高人一等，还要奴役那些混血的半妖精？\n哈！我最恨的就是这种天生高贵的调调。既然她们喜欢住在天上，那我们就把树给锯了！放火烧！把她们从云端拽下来，按进烂泥里，让她们尝尝满嘴泥沙的滋味！\n至于那些半妖精……告诉她们，不用再跪着伺候主子了。只要肯跟着我干，妖精皇宫里的金盘子，就是她们明天的饭碗！”"

PAM_zfmldz: "最肥美的猪"
PAM_zfmldz_desc: "“小的们，把口水擦一擦。前面的那些只是开胃菜。\n现在，往北看，往上面看！看到那些挂着鹰旗的港口了吗？看到那些堆满了货物的仓库了吗？那是那些海外的大帝国，这几百年来从我们身上吸走的血，刮走的油。\n那是这世上……最肥美的一头猪。\n只要宰了它，哪怕我们所有人躺着吃，也能吃上一百年！别跟我说什么国际法，别跟我说什么文明。在饿狼的眼里，只有能不能吃的东西。\n莉莉，帮我把绷带准备好。这将是最后一场，也是最疯的一场架。打完这一场……我就带所有人，回家吃饭！”"

PAM_lqslzs: "§O狼群狩猎之时§!"
PAM_lqslzs_desc: "“我把那张该死的地图撕了。那上面画满了弯弯曲曲的线，红的、绿的、蓝的……那是那些胆小鬼给自己画的笼子，看得我心烦意乱。\n有些住在树上的长耳朵，有些躲在玻璃房子里的瓷娃娃，还有那些赖着不走的猪……她们以为把自己圈在那个小格子里，把门锁上，我就闻不到她们身上那股子诱人的肉香了？\n笑话！\n既然我的狼群已经把牙齿磨得像剃刀一样快，既然我的胃口已经大到连整个莉兰迪亚都填不满了……\n那就把这层皮给我撕开！把这片大陆上所有的篱笆，统统给我踹烂！\n传令下去：从今天起，南美洲没有国界，只有猎场！\n我要让那面黑色的旗子插遍每一座山头，盖过每一片丛林！我要让所有还在喘气的家伙都抬起头来看看——\n天黑了！因为……狼群，来了！！”"

PAM_bszmcd: "把勺子磨成刀"
PAM_bszmcd_desc: "“都打饱嗝了吗？很好。\n看看你们手里的家伙。那是勺子，是刚才用来喝汤的。但如果把它在石头上蹭一蹭，磨一磨，它就能变成什么？\n它能变成一把刀。一把能割开喉咙、能挖出眼珠、能把这世上所有好东西都抢回来的刀。\n别把它们扔了！在这个家里，没有什么是多余的。我也没钱给你们每个人都发亮闪闪的军刀。\n吃饱了有力气了，就给我磨！把勺子磨尖，把铲子磨快，把你们的牙齿磨亮！\n因为下一顿饭，不在锅里。在那些长耳朵的树上，在那些小姑娘的房子里，在那些肥猪的仓库里！\n想吃？那就把手里的家伙磨好了，跟我去抢！”"

PAM_bmhs: "把门焊死！"
PAM_bmhs_desc: "“哼，想逃？没那么容易。\n传令下去，把所有贵族区的城门都给我关上！用铁水浇死！连只苍蝇都不许飞出去！\n他们不是喜欢在庄园里开舞会吗？那就让他们在里面跳个够！告诉我的卫队，别急着进去抓人，就在外面守着。就像熬汤一样，要先把盖子捂严实了，里面的火候……才够劲儿。”"

PAM_hldjz: "火里的金子"
PAM_hldjz_desc: "“他们在放火？哈！让他们烧！\n那群蠢货以为把房子烧了我就拿不到钱了？丝绸会烧成灰，名画会变成烟，但金子……金子只会熔化，变成更纯、更沉的坨坨。\n告诉小的们，等火灭了再去捡。哪怕是从骨灰堆里扒出来的金牙，那也是钱！洗一洗，照样能买面包，照样能造大炮！”"

PAM_rsdzgz: "让书呆子管账"
PAM_rsdzgz_desc: "“那些老贵族总吓唬我，说杀光了他们，没人会算税，没人会管工厂，国家就要乱套。\n放屁！\n把晓枫叫来！还有她手下那帮会算数、戴眼镜的学生们。把那些贵族的账本都扔给她们。晓枫虽然有时候唠叨，但她算的账比那些只会贪污的肥猪清楚一万倍！\n从今天起，这片大陆上不需要什么管家和爵士，只需要会干活的人和会算账的笔！”"

PAM_sdnxjz: "撕掉那些肩章"
PAM_sdnxjz_desc: "“军队里居然还有人在帮那些贵族说话？还有人看着以前的长官不敢开枪？\n雪伊，这就是你的活儿了。\n去，把那些靠着自己爸爸的名字当上将军的废物，统统给我揪出来！把他们那身像孔雀一样的军服扒了！\n告诉下面的士兵：谁能把贵族军官的脑袋提来，谁就是新的连长！在我的军队里，没有血统，只有战功！不想当狗，就得学会咬死以前的主人！”"

PAM_xggs: "敲骨吸髓"
PAM_xggs_desc: "“暴乱平息了？不，还没完。\n既然宰了肥猪，就要吃干抹净。肉要吃，皮要剥，连骨头都要敲碎了吸里面的髓！\n把贵族仅剩的土地分了！把他们最后的房子拆了给穷人盖窝！把他们所有的花园铲平了种土豆！\n我要让这片土地上再也找不到一丝贵族存在过的痕迹。我要让每一个拿到好处的穷鬼都死心塌地地跟着我，因为她们知道——只有我索拉娜，才会把骨髓都分给她们吃！”"

PAM_wydxsw: "唯一的喧嚣之王"
PAM_wydxsw_desc: "“听啊……安静了。\n那些反对的声音，那些傲慢的低语，终于都消失了。现在，这片大陆上只剩下一种声音。\n那就是我的声音，也是你们这群饿狼咆哮的声音！\n再也没有什么贵族，也没有什么议会。我就是唯一的法律，我就是唯一的分配者。\n莉莉，你看到了吗？我把那些碍事的垃圾都扫干净了。现在，这个热气腾腾、吵吵闹闹、却只听命于我一个人的巨大世界……\n终于，彻底属于我了！”"

PAM_force_port_gamble: "文明人的赌桌"
PAM_force_port_gamble_desc: "“那个躲在海边的小港口，像个缩在壳里的寄居蟹。她们以为挂着旧帝国的旗子，我就不敢动她们？\n哈！我不打她们，是因为我想留个地方消遣。\n去，带上我的骨牌，直接闯进总督的办公室。别敲门，直接踹开。\n告诉那个紫头发的家伙：‘女王今天不想杀人，只想玩两把。’\n逼她赌！赢了，我要她的税收；输了，我要她的尊严；如果是平局……呵，那就让她看着我的眼睛，继续发抖吧！”"
PAM_force_port_gamble_tt: "我们在§Y赌局§!获得§Y胜利§!时将额外获得§G1§!枚£GFX_PAM_sl §Y胜利筹码§!。"

PAM_lessons_from_scars: "输赢都是我的肉"
PAM_lessons_from_scars_desc: "“看看那边的记录员，在那儿愁眉苦脸的。说什么‘胜率下降了’，‘这局平了没赚到’……\n呸！目光短浅！\n在狼群里，被踢了一脚不是输，是被踢死了才叫输！只要还活着，那道伤疤就是经验，那个跟头就是教训。\n晓枫说：‘失败是成功他母’。虽然话糙了点（其实是索拉娜记错了），但道理是对的。\n把那些输掉的局、没赢的局都给我收集起来！我要把这些耻辱扔进炉子里，重新锻造！\n我要让全世界知道：在我索拉娜的赌桌上，就没有白输这回事！哪怕是摔了个狗吃屎，我也要从地上抓把土带走！”"

PAM_literacy_for_survival: "认字是为了不被骗"
PAM_literacy_for_survival_desc: "“晓枫跟我说，大炮上面的说明书要是看不懂，再好的炮也是废铁。虽然我听了想睡觉，但……她说得对。\n以前我不识字，被那帮贵族骗得团团转，签了卖身契还帮人数钱。我不许我的子民也这么蠢！\n传令下去，全都给我去上课！不学诗歌，不学废话。只学怎么看路牌，怎么读合同，怎么算清楚别人有没有少给你工钱！\n谁要是敢在课堂上睡觉，我就罚他去抄写‘我不想当傻子’一千遍！连我都开始学了，你们有什么资格喊累？”"

PAM_wash_off_the_mud: "洗掉身上的泥"
PAM_wash_off_the_mud_desc: "“我讨厌那个味道。那种混杂着汗臭、下水道和烂菜叶的酸味，那是贫民窟的味道，是我曾经身上的味道。\n虽然现在我们吃饱了，但这股味儿还在，闻着就让人觉得自己还是阴沟里的老鼠。我不许我的狼群带着这种臭味去征服世界！\n去修水渠！去建大澡堂！把河水引进来，把火炉烧旺！我要让这里每一个乞丐、每一个大兵，都能跳进热水里，把那层积了十几年的泥垢搓下来！\n都给我洗干净了！要想昂着头走路，首先得让自己闻起来不像个垃圾堆！”"

PAM_lilianas_mending: "莉莉的缝补时间"
PAM_lilianas_mending_desc: "“我只管把人带出去打仗，管杀不管埋。但莉莉……她不一样。\n她看不得那些断手断脚的家伙在泥里哀嚎。她非要去建什么医院，还要亲自去给那些脏兮兮的士兵换药。我本来想拦着她，怕那些血弄脏了她的裙子。\n但我看到那些平时杀人不眨眼的兵，在她面前哭得像个孩子……我就没拦。\n算了，随她去吧。我负责把这世界砸碎，她负责把人缝好。只要她开心，哪怕把皇宫改成医院，我也认了。”"

PAM_borrow_your_brain: "把脑子借我用用"
PAM_borrow_your_brain_desc: "“税收？水电费？排水系统规划？啊啊啊！！这种东西为什么要来问我？！我只会抢钱，不会生钱！\n晓枫！你死哪去了？快来！这些让人头秃的东西全归你了！\n别用那种‘你才是女王’的眼神看我。我是女王，所以我命令你——以后凡是不用动刀子的事，都由你说了算！\n你那个什么五年计划，虽然听着像天书，但只要能让我的仓库永远是满的，你就放手去干。谁敢不听你的，你就告诉我，我去砍了他！”"

PAM_soothe_the_heart: "哄睡那颗心"
PAM_soothe_the_heart_desc: "“最近……胸口没那么疼了。那个声音也不再吵着要血肉了。\n是莉莉做的。我知道。每天晚上我睡着的时候，她都会悄悄握着我的手，用她的魔力，一点一点地安抚这颗躁动的脏东西。\n她没把心拿回去，因为她说在我身体里暖和。但我知道，她是怕我消失。\n真是个傻瓜……明明是我的错，最后还要她来收拾烂摊子。既然这样，那我就更不能疯了。我要控制住这股力量，不能让它再吓到莉莉，也不能让它再把莉莉喜欢的这个世界……弄得太乱。”"

PAM_holding_the_quill: "把笔拿来！"
PAM_holding_the_quill_desc: "“晓枫说，只会挥剑的王，最后都会死在剑下。莉莉说，她希望有一天能给我读一本书，而我能听得懂。\n哪怕是为了她们……我也得试试。\n这玩意儿比刀重多了！捏得我手指头疼！而且这些字母为什么要扭来扭去的？\n呼……算了，再写一遍。\n索拉娜。莉莉安娜。\n嗯……写在一起，还挺好看的。\n也许……除了抢劫和杀人，我真的还能……学会点别的？比如，怎么在这个我亲手打下来的江山上，真的……像个人一样活着？”"

PAM_letter_to_northern_wolves: "写给北方那群饿狼的信"
PAM_letter_to_northern_wolves_desc: "“晓枫告诉我，北边也有几个大国，整天打来打去，有的喊着‘种族优越’，有的喊着‘阶级斗争’。\n我听不懂，但我看明白了——她们都跟我一样，是一群没吃饱的狼。\n既然都是狼，那就好办了。去！给那个最大的头目写封信。告诉她：南边现在归我管了，肉多得吃不完。如果她愿意低个头，叫我一声‘大姐’，我就分她一杯羹，带她一起去抢全世界。\n别跟我扯什么外交礼节，直接问她：‘想吃肉，还是想被吃？’这才是狼群通用的语言！”"
PAM_letter_to_northern_wolves_tt: "加入我们的§Y阵营§!"

PAM_sharp_enough_teeth: "只要牙齿够锋利"
PAM_sharp_enough_teeth_desc: "“那些北边的家伙来了，有的穿着褐衫，有的戴着红星，一见面就互相瞪眼，差点打起来。\n我上去一人给了一巴掌。都给我闭嘴！在我的饭桌上，我不看你们穿什么颜色的衣服，也不听你们念什么经。我只看一样东西——牙齿。\n只要你们的牙够尖，敢咬我指给你们的敌人，那就是好狗。至于你们是信奉神还是信奉大胡子，关我屁事？\n只要能帮我抢来东西，我就许你们坐在桌角啃骨头。但在我的狼群里，头狼只能有一个，那就是我！”"

PAM_served_on_the_table: "不听话就端上桌"
PAM_served_on_the_table_desc: "“居然有人拒绝了？居然有人觉得那是侮辱？\n哈！这帮把自己关在笼子里的肥鸟，还真以为自己是老鹰呢？她们那是没见过真正的狼群！\n既然给脸不要脸，那就别怪我不客气了。莉莉，不用给她们留位置了。\n传令下去：把那些不听话的国家，从客人名单里划掉，写进菜单里！\n我要扒了那些鸟的毛，把它炖成汤！我要让全世界都看看，拒绝狼王的邀请，下场就是变成盘子里的一道菜！”"

PAM_bleed_the_lion: "吸干那头老狮子"
PAM_bleed_the_lion_desc: "“看看北边的冰原，再看看海对岸的热土……那是那个举着圣杯的老不死藏肉的地方。他们管那叫殖民地，我管那叫囤积的肥油。\n几百年来，这帮戴着高帽子的绅士，趴在全世界身上吸血，把自己养得肥头大耳，却让我们在泥里抢面包屑。现在，那头狮子老了，牙齿掉光了，却还想霸占着最大的盘子？\n做梦！\n小的们，把船开得快一点！我们要跨过大洋，去踢翻他们的围栏，去搬空他们的地窖！我要把这头老狮子身上的肉，一块一块地撕下来，直到它只剩下一副在那座阴雨连绵的小岛上瑟瑟发抖的骨架！”"
PAM_win_ENG: "@PAM§O狼群帝国§!§Y击溃了§!@ENG§2圣杯王国§!的殖民体系\n\n§O肉吃光了，油刮净了。\n带着你们那副空荡荡的骨架……\n滚回那个阴湿的岛上去发霉吧！§!"
PAM_jituishengbei: "§R击溃§!§Y[ENG.getname]§!的殖民霸权。"
PAM_devour_the_old_world: "所谓§L“文明”§!的主菜"
PAM_devour_the_old_world_desc: "“小的们，擦擦嘴！殖民地那些只不过是餐前的开胃小菜，真正的硬菜，在海的那一边！\n看看那张名为欧洲的老餐桌上都摆了些什么？\n有一群自以为是的铁皮罐头，那是所有贵族和皮鞭的老家，我要把她们的铁壳子撬开，看看里面的肉是不是也是黑的！\n有一群躲在结界里过家家的老妖怪？哈！把她们的玻璃罩子砸碎！我要看看所谓的神明流出来的血是不是甜的！\n还有……那个坐在骨头堆上的骷髅架子？它也配玩弄生死？在这个世界上，只有我和莉莉有资格命令死人！我要把那个老骨头拆散了，磨成粉，给我的花施肥！\n别管她们叫什么名字，别管她们有多古老。在我眼里，她们只有一种身份——霸占着茅坑不拉屎的、肥得流油的猎物！\n起锚！把那个发霉的旧世界……给我吃个精光！”"

PAM_new_home_for_old_world: "把桌子拼得更大一点！"
PAM_new_home_for_old_world_desc: "“看看这群新来的家伙。有的金头发蓝眼睛，一脸严肃得像块石头；有的热情得像团火，却瘦得皮包骨；有的总是哭丧着脸，好像受了几辈子的气；还有那些……长着翅膀、耳朵尖尖的怪东西，躲在角落里发抖。\n以前的那些皇帝、元首、还有什么巫女，给你们画了界线，让你们互相打，互相恨，还把你们关在结界里当宠物养。\n但我不管那些！在我眼里，你们只有一个共同点——都在饿肚子，都在被上面的大人物欺负。\n既然到了我的地盘，规矩就得改！把界碑拔了！把结界砸了！把桌子给我拼起来！\n不管你是人是鬼，是妖怪还是什么优等民族，只要肯干活，肯听话，那就是我的狼崽子！\n晓枫！去给那个长翅膀的小家伙发套工作服！雪伊！带那个德国佬去车间！别让她们闲着，给我把这片废墟重新盖起来！大家……一起吃饭！”"

PAM_shadows_dont_blink: "影子不会眨眼"
PAM_shadows_dont_blink_desc: "“以前那些贵族老爷为了防着我们偷东西，养了一群只会喝酒赌钱的看门狗。那些狗不仅懒，而且贪，给块骨头就会摇尾巴，根本看不住家。\n我不一样。我爱我的子民，我得替他们守好这来之不易的粮食。所以我把那些从冥界带回来的影子，安在了每一个街角、每一扇窗户后面。\n别害怕，它们不吃肉，也不睡觉，它们只会盯着你。只要你们乖乖吃饭，乖乖睡觉，它们就是最好的保镖。但如果有人想搞破坏，想把好日子搅黄了……\n那是为了大家好。毕竟，影子若是饿了，可是连骨头都能吞下去的。”"

PAM_chained_by_gold: "用金链子锁住"
PAM_chained_by_gold_desc: "“我最恨以前那种带着倒刺的皮鞭，那是把人当牲口赶。太野蛮，太低级了，只有那些没本事的监工才用。\n既然大家现在都吃饱了，有力气了，那就得动起来。我给你们准备了新的链子——那是用我抢来的黄金打的，金灿灿的，多漂亮啊！\n把它扣在脚脖子上，连在机床上，连在矿车上。这样你们就不用担心迷路，不用担心丢饭碗了。你们只需要一直干活，一直干，干到脑子里什么都不想，干到忘记什么是累。\n这不叫奴役，这叫保障。只有把自己锁死在这台巨大的机器上，你们才永远有价值，永远……不会被抛弃。”"

PAM_no_retreat_no_choice: "§t没有退路，没有选择§!"
PAM_no_retreat_no_choice_desc: "“那些沉溺于虚假幸福的贱民，终究只是些废物。\n只有被逼到绝路的人，才会爆发出最强大的力量。\n传令下去！把城里的所有大门都给我焊死，封锁所有逃离的通道。谁敢偷偷离开我的城市，就让她们永远消失！\n那些干活不卖力的，就再发给她们几颗药丸。她们会更快，更卖力。而我的目标只有一个，那就是——把她们，都变成我建造新世界的力量。让她们没有选择。让她们……除了听我的话，为我卖命，别无选择！”"

PAM_shadow_reinforcements: "影子中的救援"
PAM_shadow_reinforcements_desc: "“听说那个冷冰冰的家里闹翻天了？哈！那群没脑子的骨头架子，居然敢冲着它们的主人龇牙？\n莉莉肯定又在哭了吧。她总是那样，心软得像块豆腐，连训狗都不会，只会把自己关在塔楼里掉眼泪。\n真是麻烦……\n喂！带上几队最凶的亡灵，从那条没人的暗道摸回去。记住，别露脸，别说话。你们的任务只有一个——躲在影子里，把所有敢靠近莉莉三步以内的东西，统统给我碾碎！\n听好了，那是我的公主，是我的！除了我，这世上没有任何东西——不管是人是鬼——有资格让她受任何伤！\n谁敢碰她一下，我就把它的骨灰扬到海里去！”"
PAM_lili_tt: "§O我们将在§1莉莉安娜§!镇压亡灵时秘密召集八支强大无比的亡灵侍卫援助她，但它们将在半年后彻底消散...§!\n\n§R必须尽快！赶在莉莉安娜召集亡灵之前。§!"
PAM_bite_their_throats_for_me_tt: "（§O索拉娜§!,§1莉莉安娜§!）不再适用于§Y元帅§!或§Y将军§!。"
PAM_bite_their_throats_for_me: "替我去咬断喉咙"
PAM_bite_their_throats_for_me_desc: "“该死……这该死的一步之遥！我就像被拴在柱子上的疯狗，闻到了远处的血腥味，却只能在这里转圈！\n莉莉不让我走，她说我会散架。好吧，我认了。既然这副身子不争气，既然我再也不能亲自把刀插进敌人的胸膛……\n雪伊！晓枫！你们给我听好了！\n从今天起，你们就是我的腿，你们就是我的牙！别想着什么战术撤退，带着我的那份狠劲儿，冲上去！\n我要你们在杀敌的时候大喊我的名字！我要你们在撕碎防线的时候，想象着那是我的手在用力！\n去吧！把那些挡路的家伙统统咬死！如果你们敢输，如果你们敢给狼群丢脸……我就算变成厉鬼，也会爬过去找你们算账！”"

PAM_the_ghost_on_the_throne: "坐在王座上的幽灵"
PAM_the_ghost_on_the_throne_desc: "“看啊，那个新来的侍卫在发抖。因为她不小心划破了我的手指，却发现流出来的不是血，是光。\n没错，我现在是个怪物了。一个只能靠着莉莉的魔力苟延残喘的幽灵。\n但我还是你们的王！\n甚至……比以前更可怕。因为我不会累，不会病，更不会死。我会永远坐在这个位置上，用这双不会闭上的眼睛，盯着你们每一个人的账，盯着每一粒粮食的去向。\n告诉那些想造反的蠢货：杀不死的暴君，才是最可怕的。只要莉莉还牵着我的手，这座大山……就永远不会塌！\n怎么？怕了？怕就对了。那就乖乖干活，别惹鬼生气。”"

PAM_this_meal_is_on_me: "§O这一顿，我请了！§!"
PAM_this_meal_is_on_me_desc: "“仗打完了，世界安静了。仓库里的粮食堆得快把房顶撑破了，抢来的金子铺满了地窖。\n晓枫问我要不要存起来备荒，雪伊问我要不要扩军备战。\n我说：‘闭嘴！都给我闭嘴！’\n我抢了一辈子，杀了一辈子，甚至死了一次又活过来……是为了什么？是为了当守财奴吗？\n不！是为了这一刻！\n把门都打开！把城墙拆了！把所有的酒桶都滚出来！\n不管你是哪里人，不管你以前是敌人还是奴隶。只要你还喘气，只要你还觉得饿，就都给我过来！\n坐下！拿碗！张嘴！\n这是我索拉娜打下来的江山，这是我用命换来的粮食。今天，谁也不许客气，谁也不许省着！\n吃！给我往死里吃！\n这顿饭……我请了！只要我还在，这片大陆上，就他妈的永远不许再有人饿肚子！！”"

PAM_the_silver_thread_binding_the_world: "拴住世界的银线"
PAM_the_silver_thread_binding_the_world_desc: "“以前，我以为自由就是没人管我，就是我想去哪就去哪，想咬谁就咬谁。\n那天，莉莉用这根线把我拴住的时候，我以为我失去了自由。\n但现在，我坐在高处，看着下面。\n你们看——晓枫把自己拴在了那堆永远批不完的文件上，雪伊把自己拴在了那条冰冷的法律红线上，小果子把自己拴在了连接大陆的航线上。而我的子民们，她们把自己拴在了土地、工厂和家庭上。\n原来，在这个世界上，没有谁是真正自由的。所谓的家，就是无数根看不见的线，把我们乱七八糟地捆在一起。\n我是被莉莉拴住的鬼魂，而你们，是被我拴住的狼群。\n既然挣脱不开，那就打个死结吧！\n传令下去：从今天起，不管是哪国人，不管是人是鬼。只要这根线还在，只要你们还承认我是那个被拴住的王……那就算天塌下来，我也替你们顶着！\n这是……我们不想孤独死去的，唯一的办法。”"
PAM_mygtt: "狼群命运共同体"
PAM_mygtt_desc: "“以前，我以为自由就是没人管我，就是我想去哪就去哪，想咬谁就咬谁。\n那天，莉莉用这根线把我拴住的时候，我以为我失去了自由。\n但现在，我坐在高处，看着下面。\n你们看——晓枫把自己拴在了那堆永远批不完的文件上，雪伊把自己拴在了那条冰冷的法律红线上，小果子把自己拴在了连接大陆的航线上。而我的子民们，她们把自己拴在了土地、工厂和家庭上。\n原来，在这个世界上，没有谁是真正自由的。所谓的家，就是无数根看不见的线，把我们乱七八糟地捆在一起。\n我是被莉莉拴住的鬼魂，而你们，是被我拴住的狼群。\n既然挣脱不开，那就打个死结吧！\n传令下去：从今天起，不管是哪国人，不管是人是鬼。只要这根线还在，只要你们还承认我是那个被拴住的王……那就算天塌下来，我也替你们顶着！\n这是……我们不想孤独死去的，唯一的办法。”"
PAM_a_toast_to_tomorrow_tt: "\n§Y每有一个§t狼崽子§!:§!"
PAM_a_toast_to_tomorrow: "献给明天的祝酒词"
PAM_a_toast_to_tomorrow_desc: "“盛宴已经到了最高潮，但我知道，总有一天，灯会灭，酒会凉，活着的人会老去，晓枫和雪伊也会有走不动路的那一天。\n但我不会。\n我是亡灵，我是时间之外的怪物。这曾经是我的诅咒，现在……却是我的恩赐。\n我会坐在这里，一直坐下去。\n等你们老了，我会护着你们的孩子；等你们的孩子老了，我会护着你们的孙子。\n我会成为这个国家最古老的幽灵，最凶狠的看门狗。\n只要我还在，‘饥饿’那个魔鬼就别想再爬回这片土地；只要我还在，就没有人敢欺负我的狼崽子们。\n所以，别怕明天。\n你们只管去造更好的机器，去画更美的画，去爱想爱的人，去过那种……我曾经做梦都不敢想的日子。\n至于那些藏在阴影里的危险，那些未知的恐惧……\n交给我。\n来！干了这一杯！\n敬你们热气腾腾的明天！\n而我……会永远守在你们的昨天里，替你们挡住背后的风雪！”"

PAM_lwbh: "狼王的永恒庇护"
PAM_lwbh_desc: "“盛宴已经到了最高潮，但我知道，总有一天，灯会灭，酒会凉，活着的人会老去，晓枫和雪伊也会有走不动路的那一天。\n但我不会。\n我是亡灵，我是时间之外的怪物。这曾经是我的诅咒，现在……却是我的恩赐。\n我会坐在这里，一直坐下去。\n等你们老了，我会护着你们的孩子；等你们的孩子老了，我会护着你们的孙子。\n我会成为这个国家最古老的幽灵，最凶狠的看门狗。\n只要我还在，‘饥饿’那个魔鬼就别想再爬回这片土地；只要我还在，就没有人敢欺负我的狼崽子们。\n所以，别怕明天。\n你们只管去造更好的机器，去画更美的画，去爱想爱的人，去过那种……我曾经做梦都不敢想的日子。\n至于那些藏在阴影里的危险，那些未知的恐惧……\n交给我。\n来！干了这一杯！\n敬你们热气腾腾的明天！\n而我……会永远守在你们的昨天里，替你们挡住背后的风雪！”"
####一线军事####
PAM_nlzc: "把她们从泥里拽出来"
PAM_nlzc_desc: "“别去征召那些所谓的良家子弟，她们太娇气，挨一顿饿就哭爹喊娘。去贫民窟，去下水道，去那些野狗都不愿意待的地方。\n哪怕她们身上长满了疮，哪怕她们瘦得只剩一把骨头。只要那双眼睛里还冒着绿光，还想吃肉，那就是我要的兵。\n我要把她们从烂泥里拽出来，给她们洗个澡，塞给她们一把枪。告诉她们：从今天起，别再跪着要饭了。想要什么，就自己去抢！就像我当年一样！”"

PAM_zyyzjg: "只有一种军规"
PAM_zyyzjg_desc: "“那些从军校出来的蠢货，拿着厚厚的书本跟我讲什么阵列，什么荣誉牺牲。我听得想吐！\n在他们眼里，你们是地图上的数字，是可以随意消耗的炮灰。但在我这里，你们是我的狼群，是我好不容易才喂饱的狼崽子！\n我的规矩很简单，不刻在纸上，刻在肉里：别像傻子一样排队送死，要像狼一样去咬！\n听我的话，往前冲，不仅有肉吃，还能活得像个人样；往后退？后面只有烂泥和饿死鬼的日子，你们还没过够吗？\n这道理连三岁的乞丐都懂——只有把敌人的骨头嚼碎了，我们才能活下去！”"

PAM_ftysyc: "废铁也是牙齿"
PAM_ftysyc_desc: "“没枪？没炮？那就去拆！把贵族花园里的铁栏杆拆了，把教堂的大钟熔了！只要是铁做的，能把人砸死的，都给我造出来！\n我不要它们好看，也不要它们耐用。我只要它们够多，够快，够狠！就像那群野狗嘴里的烂牙，虽然黄，虽然臭，但只要咬住了喉咙，照样能把狮子咬死！\n给我造！日夜不停地造！我要让我的士兵手里都有东西可以挥舞，哪怕是一根磨尖的铁管！”"
PAM_ewsh:"假如我们能镇压起义§R@CHL莉兰迪亚公社@LHS野火革命军§!或者收复§t@PAU军团§!，我们将拆除更多设施的同时获得更多物资"

PAM_srbhhe: "死人不会喊饿"
PAM_srbhhe_desc: "“活人有个最大的毛病，就是那张嘴。永远填不饱，永远在喊饿。我讨厌那个声音……那个声音会让我想起以前那种胃像被火烧一样的感觉。\n幸好，我还从那个冷冰冰的地方带回了点好东西。把那些战死的、饿死的、没用的尸体都收集起来。用那个黑色的魔法，把它们缝起来，让它们站起来。\n看啊，多完美。它们不吃不喝，不叫不闹。让它们走在最前面，替我的活人挡子弹。这样……我的孩子们，就能少饿一顿肚子了。”"

PAM_lqdsy: "狼群的盛宴"
PAM_lqdsy_desc: "“看着我！你们这些从烂泥里爬出来的脏东西！\n以前，那些老爷们坐在高楼里，喝着红酒，看着我们在下面抢垃圾吃。他们说这是命。我呸！\n现在，我给你们机会。看到前面那些城市了吗？看到那些还没被烧掉的庄园了吗？那是野火的地盘，也是曾经那些贵族的地盘。冲进去！把他们的门踹开！把他们的桌子掀翻！\n谁抢到就是谁的！我要让你们尝尝，把那些高高在上的人踩在脚底下，大口吃他们的肉，大口喝他们的酒，是个什么滋味！”"

PAM_xznbldty: "向着那……冰冷的太阳"
PAM_xznbldty_desc: "“我们已经够多了，也够吵了。但这还不够。\n我要带着这支世界上最丑陋、最贪婪、最喧嚣的军队，一直打下去。打穿野火的防线，打穿这片大陆，一直打到……那个世界的尽头。\n我要带着这几百万个热乎乎的、流着汗的、脏兮兮的活人，去敲莉莉的门。\n我要告诉她：看啊，莉莉！这就叫做‘生命’！这就是我曾经拼了命也想活下来的样子！虽然它很丑，虽然它满身是血，但它比你那个像水晶棺材一样的家……要真实一万倍！\n跟我走吧，莉莉。或者……让我带着这把大火，把你的那个冰窖，彻底烧热！”"

PAM_qhdlp: "漆黑的狼皮"
PAM_qhdlp_desc: "“都给我记住了！穿上这身黑皮，你们就不是人了，是影子，是夜里的鬼！\n以前你们那是送死，举着红旗生怕别人看不见。现在，我要你们学会藏。藏在死人堆里，藏在烟雾里，藏在敌人的眼皮子底下。\n别嫌这衣服臭，这是保命的味道。等到天黑了，等到那些贵族老爷开始发抖了，你们再从影子里跳出来，给他们的喉咙来上一口！在那之前，谁敢露头，我就先打爆谁的头！”"

PAM_gtjzxs: "骨头架子先上"
PAM_gtjzxs_desc: "“打仗最怕什么？怕死人？哈！我这里最不缺的就是死人！\n传令下去，每次冲锋，把那些亡灵给我赶到最前面去！它们感觉不到疼，也不怕机枪扫。让它们去趟地雷，去堵枪眼，去把敌人的弹药耗光！\n我的活人狼崽子们，你们就缩在骨头架子后面。等敌人被这些杀不死的怪物吓破了胆，手软了，没子弹了……那时候才是你们上场吃肉的时候！谁也不许给我死在那些骨头前面！”"

PAM_yyldjy: "阴影里的尖牙"
PAM_yyldjy_desc: "“晓枫那个书呆子确实有点本事。她教你们怎么走路没声，怎么在泥地里爬得像条蛇。虽然看着不像样，但这才是狼该有的样子。\n别学那些正规军排队枪毙，那是傻子才干的事。我们要像狼群围猎一样，这边咬一口，那边撕一块。让敌人永远不知道下一枪是从哪打来的，永远不知道身边的阴影里藏着多少把刀。\n学会了吗？卑鄙？那是夸奖！在我的军队里，赢得难看，比输得光荣要强一万倍！”"

PAM_zcjsck: "战场就是仓库"
PAM_zcjsck_desc: "“后勤？补给？我哪有那么多闲钱给你们买新枪？\n看看对面！看看那些穿得像孔雀一样的帝国兵！她们手里拿的是什么？身上穿的是什么？那都是那是给你们准备的礼物！\n缺子弹了？去抢！缺靴子了？去扒！\n只要是敌人手里有的，就是我的。把她们的枪夺过来，把她们的炮拖回来。我要让这支军队像滚雪球一样，越打越富，越打越强！谁空着手回来，晚饭就别吃了！”"

PAM_yzjbsk: "咬住就不松口"
PAM_yzjbsk_desc: "“狼群捕猎有个规矩：一旦咬住了，就绝不松口，除非撕下一块肉来。\n不管对面是坦克还是堡垒，只要我下令进攻，你们就得像疯狗一样扑上去！挂在她们身上，咬穿她们的装甲，嚼碎她们的骨头！\n别跟我说累，别跟我说疼。想想你们以前饿肚子的时候！现在肉就在嘴边，谁要是敢松口，谁要是敢把到嘴的肥肉放跑了，我就拔了她的牙！”"

PAM_sssd: "生与死的混合双打"
PAM_sssd_desc: "“看啊，多么完美的配合。\n死人负责制造恐惧，活人负责收割生命。亡灵的寒气冻僵敌人的手脚，我们的热血烧毁敌人的营房。\n这是只有我索拉娜才能想出来的战术，这是生者与死者最疯狂的共舞！\n让那些自以为是的文明军队颤抖吧！当她们面对这支分不清是人是鬼、杀不完也打不烂的军队时，她们才会明白——在这个世界上，只有这种半死不活的怪物，才是无敌的！”"
####一线海军####
PAM_guozis_junk_fleet: "小果子的破烂舰队"
PAM_guozis_junk_fleet_desc: "“看看这堆漂在水上的烂木头！这就是我们的海军？别逗了，我甚至不敢踩上去，怕一脚把它踩沉了！\n但那个叫小果子的小不点跟我发誓，她说只要给这些破船装上炮，再加上她的那张海图，它们就能像泥鳅一样滑溜，像鲨鱼一样凶狠。\n行吧！既然她是晓枫那伙人里唯一懂水的，我就信她一次。把那些最好的引擎，还有我们抢来的大炮都给她！告诉她：我不看船长得漂不漂亮，我只看它能不能把别人的船给我拖回来！”"
PAM_guozis_junk_fleet_tt: "§O可以向所有沿海国家\n发起深夜骨牌赌局了。§!"

PAM_wolfpack_under_sea: "海面下的狼群"
PAM_wolfpack_under_sea_desc: "“这就是我最喜欢的战术——躲在暗处，趁人不备，一口咬断喉咙。\n为什么非要造那些像山一样大的战列舰去跟人家硬碰硬？傻子才干那种事。我要造潜艇！造很多很多潜艇！它们就像海里的狼，平时看不见，一出来就要命。\n传令下去：我们要封锁这片大海。任何不交‘过路费’的船，不管它是运粮的还是运兵的，统统给我拖进海底喂鱼！”"

PAM_unsinkable_bones: "不会沉的骨头"
PAM_unsinkable_bones_desc: "“钢铁进水了会沉，木头着火了会烂。但这玩意儿不会。\n这是从冥界弄来的骨头，还有那些死不瞑目的‘利箭’。把它们嵌进船底，这就是活的龙骨。它没有痛觉，不怕断裂。哪怕船身被打成了筛子，哪怕只剩下一个骨架，它也能浮在水面上，载着我的士兵冲上滩头。\n这就是我们的‘幽灵船’。告诉水手们别怕冷，这艘船会替他们挡下死神的镰刀。”"

PAM_be_a_pirate: "别当水手，当海盗！"
PAM_be_a_pirate_desc: "“我看过那些正规海军的训练，擦甲板、叠被子、还要学什么旗语……呸！那是绣花枕头！\n在我的船上，不需要那些花架子。你们只需要学会三件事：开得快、撞得准、跳得远！见到敌人的船，别只想着用炮轰。给我撞上去！用钩索挂住！然后跳过去，用刀子跟他们说话！\n把他们的船抢过来，那就是我们的新船；把他们的货抢过来，那就是我们的晚饭。记住，我们不是来保卫和平的，我们是来抢劫的！”"

PAM_floating_slaughterhouse: "漂浮的屠宰场"
PAM_floating_slaughterhouse_desc: "“小果子说，光靠小船抢不了大家伙，我们需要真正的海上城堡。\n那就造！但别给我造那种娇贵的玩意儿。我要那种皮糙肉厚、满身是刺的大家伙。甲板要够大，能停满我的飞机；肚子要够大，能装下我们抢来的金山银山。\n把它开到敌人的家门口去！让它像一座漂浮的屠宰场一样，把恐惧塞进每一个沿海城市的人心里。我要让全世界都知道：当这艘船出现的时候，就是开饭的时候！”"

PAM_boil_the_sea: "把大海煮沸！"
PAM_boil_the_sea_desc: "“现在，这片池塘太小了，容不下我的胃口。\n往东看！往北看！那些所谓的海洋霸主，那些自以为躲在海对岸就安全的懦夫。告诉他们：狼群学会游泳了。\n把所有的炉子都烧红！把所有的螺旋桨都转起来！我要让这片大海因为我们的到来而沸腾！\n无论是深海里的鱼，还是岛上的鸟，或者是那些躲在铁壳子里的国王……只要是被海水包围的地方，就是我的猎场！全速前进！去把海对面的一切……都给我吃干抹净！”"

PAM_eternal_black_tide: "§1永恒的黑潮§!"
PAM_eternal_black_tide_desc: "“等待是死人才做的事，但我的死人从不等待！\n看看那些空荡荡的船台，那是一张张等着吃肉的嘴。为什么我们还要像普通人一样造船？一颗铆钉一颗铆钉地敲？太慢了！\n把库存里所有的利箭都拿出来！磨碎了！撒进钢水里！喂给船坞吃！\n我要让亡灵附身在起重机上，让冤魂去推动流水线。我要让这些船像坟地里的野草一样，从钢铁里自己长出来！\n让造船厂日夜不停地尖叫！我要一支庞大到无法计算的舰队，多到当它们一起出海时，海平面都要上涨！\n我要掀起一场……淹没全世界的黑色浪潮！”"

####一线空军####
PAM_sky_carts: "天上的大篷车"
PAM_sky_carts_desc: "“我对那些在天上翻跟头、画圈圈的花架子没兴趣。那是有钱人的游戏，摔下来一架我都心疼。\n飞机是什么？飞机就是长了翅膀的大篷车！\n既然是车，就得能拉货，能装炸弹，能像骡子一样耐造！\n告诉那些设计师，别给我整那些流线型的漂亮壳子。我要大肚子的、皮糙肉厚的！能把炸弹扔到敌人头顶上，也能把抢来的肉运回来，那才叫好飞机！”"

PAM_rats_with_wings: "给老鼠插上翅膀"
PAM_rats_with_wings_desc: "“以前那些贵族少爷想当飞行员，得先学我不懂的鸟语，还得喝下午茶。呸！\n去把贫民窟里那些爬屋顶最快、眼神最亮的小偷给我找来。\n她们虽然不识字，但她们知道风往哪边吹，知道怎么在死胡同里钻空子。这才是天生的飞行员！\n给她们最好的护目镜，给她们最厚的皮夹克。告诉她们：以前你们在泥里爬，现在我要送你们上天。去把那些高高在上的老鹰都给我咬下来！”"

PAM_dont_let_them_look_up: "别让她们抬头看"
PAM_dont_let_them_look_up_desc: "“我地上的狼崽子们在冲锋，在流血。我不许头顶上还有人给他们扔炸弹！\n空军是干什么吃的？是给步兵当伞用的！\n只要我的陆军还在泥地里打滚，你们就不许飞得比云彩高！给我贴着树梢飞！看到前面有敌人的机枪手，就给我用机炮把它犁平！\n如果我看到有一个士兵因为你们没护好而死在空袭里，我就把你们绑在机翼上风干！”"

PAM_loot_from_above: "不仅要赢，还要带回点什么"
PAM_loot_from_above_desc: "“飞那么远去炸人，回来的时候空着手？败家子！\n既然去了敌人的后方，就把眼睛擦亮！看到运输车队？抢！看到仓库？炸开它！\n如果是轰炸机，就把肚子里的炸弹扔了，装满她们的面粉和布料飞回来！\n油钱很贵的！每一次起飞，都得给我挣回本钱来。我们不是去旅游的，我们是去进货的！”"

PAM_stitched_ghost_skin: "缝上死人的皮"
PAM_stitched_ghost_skin_desc: "“飞机太脆了，几颗子弹就能打穿，里面坐着的可都是我的心肝宝贝。\n既然铁皮不够硬，那就用那个！\n把那些亡灵身上不用的皮、散掉的魂，都收集起来，涂在机翼上，缝在座舱外。\n那东西轻得像烟，却韧得像命。子弹打上去会滑走，就像打在噩梦上一样。\n别嫌它阴森森的。在天上，只有变得像鬼一样难缠，才能活着回来吃热饭。”"

PAM_screaming_vultures: "尖啸的秃鹫"
PAM_screaming_vultures_desc: "“狼在地上吼，鸟在天上叫。这就对了。\n给飞机的引擎上装哨子！装那种能发出最难听、最刺耳尖叫声的哨子！\n我要让敌人在看见我们之前，先吓破了胆。\n我们要像秃鹫一样，盘旋在她们头顶，发出死亡的噪音。让她们知道，只要听见这个声音，如果不把手里的枪和口袋里的钱交出来，下一秒就是死期！”"

PAM_ghosts_in_the_engine: "§1把幽灵塞进引擎§!"
PAM_ghosts_in_the_engine_desc: "“工厂的工人累坏了，手都磨破了，我心疼。\n但前线还在喊着要飞机。怎么办？\n把那些利箭，那些不甘心的亡魂，都请到工厂里来！\n它们不需要手，它们自己就会动。让它们钻进机器里，帮我们推齿轮，帮我们拧螺丝。\n虽然车间里会变得冷飕飕的，机器也会自己乱动……但管它呢！只要能让我的工人们歇一歇，只要能让飞机像下饺子一样造出来，让鬼推磨又怎么样？”"
####一线经济####
PAM_tbmddztb: "填饱她们的肚子"
PAM_tbmddztb_desc: "“我最恨听到的声音，就是肚子饿得咕咕叫的声音。那声音比雷声还响，比刀子还利，能让人在半夜里发疯。\n传令下去，把那些贵族的粮仓，全给我砸开！所有的，一粒米都不许留！别跟我说什么战略储备，那是那帮肥猪留给他们自己过冬的油水。\n现在，就在广场上架起大锅，把肉和面都煮了！我要让这城里每一个要饭的，今天晚上都能吃到撑得吐出来！谁敢拦着，就把她也扔进锅里！”"

PAM_syscd: "睡在丝绸堆里"
PAM_syscd_desc: "“冬天太冷了。我记得那种冷，像有蛇在骨头缝里钻。\n看看那些大教堂，看看那些空的歌剧院，里面铺着那么厚的地毯，挂着那么贵的窗帘，却只用来供着几个死木头像？太浪费了！\n把门都给我踹开！让那些没地儿去的老太婆、流浪汉，都给我住进去！让她们把那些丝绸窗帘扯下来当被子盖，把那些名画烧了取暖！\n别心疼东西，东西是死的，人是活的。只要能让我的子民今晚不冻死，烧了皇宫我也乐意！”"

PAM_srglq: "死人有力气"
PAM_srglq_desc: "“挖矿？修路？这种累得要吐血的活儿，为什么要让活人去干？活人的肩膀是用来扛枪的，活人的手是用来抓肉吃的。\n去，把那些从坟里爬出来的‘骨头架子’都赶到矿井里去。它们不知疲倦，不怕砸，也不会喊累。\n让它们日夜不停地干！把金子、铁矿都给我挖出来！而我的活人们……你们只需要站在旁边，拿着鞭子，看着这些死鬼替你们卖命，然后等着领钱就行了。这就叫享福，懂吗？”"

PAM_jzzz: "金子在脏手里才亮"
PAM_jzzz_desc: "“以前那些老爷们总说，金子是高贵的，不能让下等人碰，会弄脏。\n放屁！金子在他们手里才是脏的，因为那是他们骗来的，抢来的！\n我要把国库打开，把那些金币、银器，统统熔了！铸成最结实的农具，铸成最厚实的饭碗，发给每一个肯干活的穷人。\n我要让金子在泥巴里滚，在烟灰里熏！只有当它能换来黑面包和烈酒的时候，它才是真正的好东西！”"

PAM_bsxd: "把书本换成砖头"
PAM_bsxd_desc: "“那些戴眼镜的会计跟我说，要建学校，要教大家识字。识字能当饭吃吗？识字能挡风遮雨吗？我小时候连名字都不会写，不也活到了今天？\n别建学校了，给我建房子！建那种最结实、最暖和、不用交房租的大房子！把那些印书的纸都拿去糊窗户缝！\n等大家都有了家，都吃饱了肚子，你们爱读什么破书就读什么。但现在，谁要是敢拿买砖头的钱去买书，我就让她把那些书吃下去！”"

PAM_yybsdwy: "永远不散的晚宴"
PAM_yybsdwy_desc: "“我要建立的，不是什么文明的强国。我要建立的，是一个巨大的、热气腾腾的食堂！\n只要我还在王座上一天，这里的炉火就不能熄，酒桶就不能空。我要让全天下的穷鬼都知道，只要跟着我索拉娜，只要手里有刀，心里有狠劲儿，天天都是过节。\n我们要一直吃，一直喝，一直狂欢到世界的尽头！让那些还要算计着过日子的国家去嫉妒吧！在这里，贫穷才是唯一的罪，而贪婪……是美德！”"

PAM_dmdtd: "堆到房顶去！"
PAM_dmdtd_desc: "“看啊！这金灿灿的山！这堆得比我还高的丝绸！以前那些贵族把这些藏在地窖里，宁可烂掉也不给穷人看一眼，现在这些都是我的了！\n我想把它们全部分给巷子里的那些流浪汉，让她们今晚就睡在丝绸上。可晓枫那个书呆子拿着个本子跟在后面念叨，说什么‘没有流通的财富就是废土’，说什么‘全都分了明年大家还得挨饿’。\n烦死了！我只管抢，怎么管是你们的事！既然你那么喜欢算数，那就去数吧！但你给我记住了，要是少了一袋麦子，或者让我的子民冬天没衣穿，我就拿你是问！”"

PAM_ysmyt: "烟囱为什么停了？"
PAM_ysmyt_desc: "“昨天我把那个只知道拿皮鞭抽工人的监工头子挂在了路灯上，工人们是很开心，可今天工厂怎么停了？那些机器趴在那儿不动，像死了一样。\n我问工人，她们说没有那个监工手里的图纸，她们不敢乱动，怕弄坏了机器赔不起。真见鬼！机器是铁做的，坏了再修就是了，人要是累坏了可补不回来！\n晓枫拦住了我，她说机器确实需要懂行的人来喂油。好吧，那就把皮鞭收起来，让那些懂技术的去弄。告诉工人们，别怕弄坏东西，我只要看到烟囱冒烟，只要看到她们能挺直腰杆干活，这就够了！”"

PAM_ccsd: "吃存粮的傻瓜"
PAM_ccsd_desc: "“下面的士兵报告说，既然打下了粮仓，今晚就该把所有的种粮都磨成面粉，让城里的乞丐们吃顿饱的。我觉得这主意不错，反正没了再抢就是，总不能让活人看着粮食饿死。\n结果雪伊那个疯女人差点把桌子掀了。她吼着说‘吃光了种子，明年大家就一起喝西北风去死’。她甚至把枪拍在桌上，谁敢动一粒种子，她就毙了谁。\n哼，凶什么凶。不吃就不吃。虽然我不懂什么可持续，但我知道饿肚子的滋味不好受。既然这只母狼要护食，那就让她去护着明年的饭碗吧。”"

PAM_xfdwl: "晓枫的鬼画符"
PAM_xfdwl_desc: "“晓枫给了我一本厚厚的书，上面密密麻麻全是像蚂蚁一样的黑字。她说这叫计划，叫预算。她说不能抢多少花多少，要算计着过日子，这样才能保证每个月都有肉汤喝。\n我看着就头晕！以前我只有今天没有明天，哪管得了那么多？但不得不承认，自从听了她那些绕口的话，我的仓库确实没那么乱了，那些原本会被浪费掉的肉干也被存了起来，发给穷人的棉衣也变厚了。\n行吧，这些让人头疼的鬼画符就交给她去画。我看不懂，但我认得结果——只要我的子民不再挨饿，我就忍受她在我的宫殿里嘀嘀咕咕。”"

PAM_xgdhh: "小果子的航海图"
PAM_xgdhh_desc: "“我把周围能抢的都抢了，结果没人愿意跟我们做生意了。那些外国商船看到我的旗帜就跑，宁可绕远路也不靠岸，搞得我都没办法给孤儿院的孩子们弄糖果吃了。\n我本来想派炮舰去把她们轰沉，把货捞上来。但那个叫小果子的小不点拦住了我。她摊开一张我都看不懂的海图，指着那些弯弯曲曲的航线说，她有办法让那些商人自己送上门来，只要我不乱开炮。\n好吧，海上的事我不懂。既然这只小海鸥说能用更少的炮弹换来更多的药和糖，那就让她去试。但如果她敢把我的船开跑了……我就把这片海都煮沸了！”"

PAM_bwc: "别把刹车踩断"
PAM_bwc_desc: "“这帮野火的人真是麻烦。晓枫要记账，雪伊要留种，小果子要通商……她们把我的手脚都捆住了，让我不能随心所欲地杀人放火。\n这让我很不爽。非常不爽。我就像一头被套上了笼头的狼，虽然吃得饱了，但总觉得牙齿痒痒。\n但是……看着那些不再饿死在街头的乞丐，看着那些重新转动起来的机器，看着那些孩子脸上红扑扑的肉……我又觉得，好像也不坏？\n只要她们不踩死刹车，不让我停下来，我就忍了。毕竟，如果车真的翻下悬崖，我的那些穷亲戚们也没得活了。那就……暂时按她们说的办吧。”"
####新闻事件####
PAM_news_event_background: "£PAM_news"
PAM_news.1.t:"$news_event_background$南美大围猎"
PAM_news.1.d:"对于南美洲各国的边境守军而言，战争的开始并不是一声枪响，是一次日落。\n当最后一缕阳光消失在地平线上时，人们惊恐地发现，黑夜并没有如期降临——取而代之的，是一片由无数双猩红的眼睛组成的、更加深沉的黑暗海洋。\n据前线最后传回的断续情报描述，那是一支违背了生与死界限的恐怖军团：不知疲倦的亡灵在前方用身躯填平了战壕，而衣衫褴褛、如同疯狗般的活人士兵紧随其后，她们在尸骸的掩护下发出饥饿的咆哮，疯狂地撕扯着防线上的一切活物。\n国界线在这一刻失去了意义。那不是一支军队在推进，那是一群饥饿了千年的狼群，正在索拉娜的驱使下，撞碎了世界的围栏。\n边境的灯火正在一盏接一盏地熄灭。整个大陆，都听到了那来自莉兰迪亚方向的、令人骨髓冻结的磨牙声。"
PAM_news.1.a:"跑吧，用尽全力去跑！"
PAM_news.2.t:"$news_event_background$旧世界的最后一道菜"
PAM_news.2.d:"大西洋的尽头，地平线消失了。\n对于欧洲大陆的守望者而言，今日的黎明并未如期而至。取而代之的，是一堵由钢铁巨舰、黑色风帆与亡灵气息构成的、连接天地的墙。\n那不是一支寻常的军队，那是一场为了进食而跨越半个地球的饥荒本身。\n据前线发回的、近乎疯癫的电报描述：那些来自新大陆的入侵者，她们穿着沾满油污的黑色军大衣，驾驭着不知疲倦的尸骸，眼中闪烁着对历史与神圣毫不掩饰的食欲。\n她们嘲笑德意志的钢铁是罐头，视魔导国的死灵为肥料，将那些古老神明的结界看作是餐盘上的盖子。\n索拉娜，这位喧嚣的女皇，正站在旗舰的龙骨之上，对着这片在此刻显得如此苍老、腐朽且肥美的旧大陆，发出了狩猎开始的咆哮。\n文明的烛火正在风中摇曳，因为狼群……准备开饭了。"
PAM_news.2.a:"神明已死……现在是狼的时代。"

PAM_news.3.t:0 "$news_event_background$晚安，阿德莱希"
PAM_news.3.d:0 "这一天，阿德莱希的边境守兵靠在墙根下，在充满暖意的风里安稳地闭上了双眼。南方吹来带着糖香的微风，把黑夜洗得干干净净。\n\n灯火一盏一盏熄灭，整座城市都在这无声的安静里，做了一个暖和的梦。\n\n大家都说，来自莉兰迪亚的夜莺，已经飞向了阿德莱希的每一处黑暗的角落。"
PAM_news.3.a:0 "祝你好梦，我的孩子。"

PAM_news.4.t:0 "$news_event_background$汽笛一声长鸣，人与昨日告别"
PAM_news.4.d:0 "一声刺耳的汽笛，从莉兰迪亚最深处那座废弃的老铁厂里撕裂了夜色的寂静。那是炉膛里沉寂多年的蒸汽重新迸发的嘶吼，它带着金属管道剧烈磨损的颤音，彻底穿透了覆盖整片大陆的紫雾。\n\n梦境里的火焰熄灭了。那些围坐在桌边分汤的同伴，那些温暖的、让人舍不得闭眼的画面，全碎成了雪地上的飞屑。碎开之后，露出来的是厂房顶上漏下的风，是锅炉上结满的冰，是掌心上还没愈合的疮。\n\n在那座锅炉房的深处，两个不肯入睡的姑娘正面对着聚拢过来的亡灵卫兵。她们握紧了手里那点仅存的武器，准备从黑暗里抢回属于自己的明天。\n\n而在她们身后，在那一道道被震裂的梦境的缝隙里，有更多的人正在睁开眼睛…………"
PAM_news.4.a:0 "人类的故事，重新开始了"

PAM_news.5.t:0 "$news_event_background$纳萨力克的审判之日"
PAM_news.5.d:0 "世人曾经无比崇拜与害怕那位坐在纳萨力克深处的大人。人们以为，那位拥有无上威严的国王是不可战胜的神明，他的每一个举动都深不可测，他的宏大图谋罩住了整片天空。\n\n可当进攻的号角在这个清晨响起来的时候，传遍世界的却是一句沉重的叹息。\n\n那位至高的国王，从一开始就错了啊。\n\n他扮演着永不犯错的全知全能，不过是因为他内心里害怕着凡人的软弱。他被自家仆从们推上至高位子，被恐惧与崇拜绑架在了高台上面，连自己真正的悲欢都不能流露。\n\n他打造了一座宏大的秩序帝国，以为那是庇护，殊不知他自己才是那座冰冷城堡里最孤独的囚徒。他对待凡人如同棋子，只因他早已不能去体验真正的牵挂与爱。\n\n如今，向他挥剑的队伍已经跨过了界线。"
PAM_news.5.a:0 "你根本……就不是什么王。"
PAM_news.5.b:0 "可笑又无知的揣测"


PAM_news.6.t:0 "$news_event_background$你听，南方有歌声"
PAM_news.6.d:0 "大洋彼岸的港口上，空气里的严寒被一股风拂动了。\n\n远方南美大陆那片被大雾笼罩了太久的土地，如今传来了回响。\n\n传入耳畔的声音，既带有着告别的决然，也带有着对明天的渴望。那是大家在冰雪里齐声哼唱的调子，是人们互相搀扶着、向着沉寂长夜迈进的脚步声。\n\n海岛边、山道旁，所有驻足仰望南方天空的人们都感受到了那股温度。在那片历经磨难的土地上，一群浑身带伤的人们正手拉着手，去打破那场夺走大家笑容的沉睡。\n\n她们为了守护好不容易得到的相聚，为了争回属于活人的清晨，迎向了风暴的中心。\n\n世界在这一刻安静了下来。\n所有人都注视着南方，等待着那片天空彻底放晴。"
PAM_news.6.a:0 "愿她们能够平安迎回太阳。"

####事件####
PAM.1.t: "坐垫下的荆棘"
PAM.1.d: "“陛下，根据王室礼仪，您在签署这项关于征收特别治安税的法令前，必须先征得枢密院的……”\n老宰相的声音像一只在耳边嗡嗡作响的苍蝇，令人心烦意乱。他捧着那卷写满了像蚂蚁一样密密麻麻黑字的羊皮纸，腰弯得像只煮熟的虾米，但那双浑浊的眼睛里，分明藏着一丝——索拉娜最熟悉的、属于上等人的轻蔑。\n索拉娜坐在那张镶满宝石、铺着厚厚鹅绒的王座上，却感觉像是坐在了铺满碎玻璃的烂泥地里。浑身不自在。这把椅子太软了，软得让人使不上劲；这把椅子又太硬了，硬得像是要把她这个野种给挤出去。\n“闭嘴。”\n索拉娜突然开口，声音不大，却让空气瞬间凝固。她猛地站起身，一把抓起那个绣着金线的丝绒坐垫，狠狠地掼在了老宰相那张保养得体的脸上。\n“哎哟！陛下，这……这不合体统……”\n“体统？”索拉娜冷笑一声，那是从贫民窟的死人堆里练出来的、带着血腥味的冷笑。她拔出腰间的匕首，“咄”的一声，将那份她根本看不懂的法令钉在了名贵的木桌上。\n“你们以为弄一堆破纸，画几个我看不懂的鬼画符，就能把我关在这个笼子里学猴戏？”她环视着四周那些噤若寒蝉的贵族，眼神像是在看一群待宰的肥猪，“听着，在这个大厅里，我的话就是典章，我的刀就是规矩。这把椅子如果不舒服，我就把它拆了。如果有人挡着我……我就把他拆了。”\n她重新坐回那张冰冷的王座，手指无意识地摩挲着胸口——那里有一颗并不属于她的心脏，正在剧烈地、发烫地跳动着。\n（莉莉……你听，这些苍蝇太吵了。我会让这里安静下来的。我会把这些碍事的垃圾都扫干净，给你腾出一个……谁也不敢大声说话的、最好的位置。）"
PAM.1.a: "“现在，谁还有意见？”"

PAM.2.t: "主人的鞭子"
PAM.2.d: "大公爵的手在发抖，那只曾经戴着白手套、只需轻轻挥动就能决定贫民窟几百人生死的手，此刻正哆哆嗦嗦地解开他那件华丽礼服的领扣，试图从贴身的暗袋里掏出金库的钥匙。\n索拉娜坐在那张铺着昂贵桌布的长餐桌上。她穿着沾着泥点的军靴，毫不客气地踩在精美的银盘子上，发出刺耳的摩擦声。\n“快点，”她不耐烦地用马鞭敲了敲大公爵那光秃秃的脑门，“以前你们收税的时候，可没见这么磨蹭。那时候我跪在泥地里求你们宽限几天，你们是怎么说的来着？‘规矩就是规矩’？”\n“陛下……这可是家族几百年的积累……”\n“几百年？”索拉娜大笑起来，笑声尖锐而疯狂，回荡在死寂的宴会厅里，“那是几百年里，你们从像我这样的人骨头缝里刮下来的油！现在，我只是替那些死人把它拿回来。”\n她猛地一挥鞭子，抽飞了旁边一位试图藏起宝石项链的伯爵夫人手中的酒杯。红酒泼洒在地上，像极了血。\n“听着，你们这些肥猪。从今天起，你们的庄园，你们的工厂，你们藏在地窖里的每一块金币，甚至你们脖子上的脑袋……都是我的。我让你们留着，是用来给我干活的；如果不听话……”\n她俯下身，盯着大公爵恐惧的眼睛，瞳孔深处闪烁着那种来自冥界的、令人心悸的幽光。\n“……我就把你们变成连哭都不会哭的零件，永远砌在我的城墙里。”"
PAM.2.a: "“拿来吧你！”"

PAM.3.t:0 "共犯的低语"
PAM.3.d:0 "“闭嘴……我叫你闭嘴！”\n索拉娜将桌上的金杯扫落在地，红酒泼洒在暗色的地毯上。她揪着自己的领口，指甲陷入肉里，试图扼住那颗在胸腔里不断撞击的、不属于自己的心脏。\n那声音避开耳廓，直接在脑海深处鸣响。那是一种带着些许黏腻诱惑的低语。\n“抢？嘻嘻……真的是你‘抢’走的吗？我的小乞丐。”\n索拉娜浑身一颤，双眼微微闭起。她踉跄着后退，直到脊背撞上冰凉的镜面。\n“莉莉安娜……她是完美的。她是永恒的冬雪，是不会腐烂的标本。在她那里，我沉睡了几万年……好冷啊，好无聊啊。”那声音在血管里流淌，带着满足的叹息，“然后，你来了。”\n“你身上有股味道，索拉娜。混杂着烂泥与发霉的面包，那是想活下去想到发疯的……饥饿。你就像一团在垃圾堆里烧起来的火，又脏，又亮。”\n“是我抢的！是我……是我为了莉莉……”索拉娜对着空无一人的房间吼着，声音里带了哭腔。\n“别骗自己了。”心脏收缩着，带给索拉娜一阵近乎快感的疼痛，“那天仪式上，如果我不愿意，你以为凭你那双只会偷钱包的手，能碰到我分毫？是我选择了你。是我主动跳进了你这具充满了贪婪和热血的躯壳里！因为我想看你燃烧，我想看你把那个死气沉沉的世界……搅得天翻地覆！”\n镜子里，索拉娜看到自己的脸扭曲而精美，泪水把妆容冲得一塌糊涂。她看起来不像女王，更像个偷穿了衣服、闯了大祸却无处可逃的孩子。\n极少念书的她，并不懂大道理。她曾以为自己夺取了神明的力量。可现在，对方告诉她：神明厌倦了云端，找了个卑微的共犯，一起来泥地里撒野。\n“……天翻地覆吗？”索拉娜慢慢停止了颤抖。她看着镜中狼狈的自己，突然露出了一个比哭还难看、用力的笑容。\n“好啊。只要能赢……把那些看不起我们的人踩在脚下，给莉莉，甚至是我的那些泥腿子们一个谁也碰不到的家……\n“我们……就一起，疯到底吧。”"
PAM.3.a:0 "我们……是天生一对的怪物。"
PAM.3.b:0 "§1我们……走进了永恒。§!"

PAM_3_b_tt:0 "§1胸腔里跳动的火焰熄灭了。\n冥界的心脏接管了这具躯壳。\n泥土下的死者感知到相似的寒气，\n开始在荒地上成群地站起。\n我们将面对这场战乱，\n径直走向寂静的长夜。§!"

PAM.4.t: "咆哮的理由"
PAM.4.d: "窗外，新修的兵工厂正在试车。巨大的汽笛声像濒死野兽的嚎叫，撕裂了清晨的薄雾。齿轮的轰鸣、士兵的操练声、还有远处贵族被抄家时的哭喊声混在一起，震得窗框都在发抖。\n太吵了。就连最粗鄙的监工也会觉得这声音太吵了。\n但索拉娜却闭着眼睛，贪婪地深吸了一口这充满了煤烟和机油味的空气。她的嘴角甚至露出了一丝陶醉的微笑。\n“只有这样才对……”她喃喃自语，思绪却飘回了那个让她至今都会在半夜冻醒的时刻。\n那是她背叛的前夜。在那个永恒寂静的国度里，她曾跪在莉莉安娜的脚边，哪怕膝盖被冰冷的水晶地板硌得生疼。她抓着莉莉安娜的手，把那双冰凉的手贴在自己滚烫、粗糙、甚至还带着泥垢的脸颊上。\n“莉莉，跟我走吧。”那时的她，像个乞求施舍的孩子，“我们离开这里。这里太静了，静得像一口棺材。外面的世界虽然脏，虽然乱，虽然为了抢一块面包就要打破头……但是那里有太阳，有风，有血是热的。我们去那里，我给你抢最好的房子，让你看看什么叫‘活着’。”\n她以为莉莉安娜会答应。毕竟，她是莉莉安娜唯一的色彩，唯一的偏爱。\n可莉莉安娜只是温柔地、却又无比残忍地抽回了手。那位完美的公主用那双像深渊一样平静的眼睛看着她，就像看着一只不懂事的小猫，轻声说：\n“为什么要走呢，索拉娜？这里没有你会死去的未来。这里是完美的。安静……才是永恒的庇护。你就留在这里，永远做我的……那抹颜色，不好吗？”\n那一刻，索拉娜的心瞬间冷了下来。\n她终于明白，在莉莉安娜眼里，她是一个用来点缀寂静的、漂亮的、但也仅仅是属于她的摆件。莉莉安娜爱的是索拉娜带来的新鲜感。\n那种被当作宠物关进永恒琥珀里的恐惧，比贫民窟的饿死还要可怕。\n“我不当摆件……我是“人”！我是“活”的！！”\n回忆被一声巨大的炮响震碎。索拉娜猛地睁开眼，眼底是一片赤红的疯狂。\n既然你不肯跟我走，既然你喜欢安静……\n那我就把这个世界变得无比吵闹！我要用炮火，用轰鸣，用千万人的嘶吼，去震碎你那该死的完美寂静！\n我要让你不得不捂着耳朵，不得不皱着眉头，不得不……从那座冰冷的王座上走下来，看看我为你打造的这个——热气腾腾的、流着血的地狱！"
PAM.4.a: "“听见了吗？莉莉！这才是活着的声音！”"

PAM.5.t: "喉咙里的炭火"
PAM.5.d: "正午的暴晒让烂泥塘里发酵的毒气蒸腾起来，化作一层黏糊糊、让人窒息的油膜，糊住了我的口鼻。视野被充血的眼球染成了浑浊的红色，汗水腌渍着溃烂的眼角，带来一阵阵细密的刺痛。我的胃壁在剧烈地相互摩擦，发出那种令人牙酸的、像两块干石头挤压的脆响。\n“吃吧，小老鼠。吃了它，这枚银币就是你的。”\n一只穿着丝绸鞋面的脚，踢了踢面前那个破陶碗。碗里盛着刚刚从后厨倒出来的泔水。橘红色的热油浮在表面，冒着扭曲空气的白烟，裹挟着鱼刺、鸡骨头，还有漂浮在上面的黑色烟灰与浓痰。\n我的理智在尖叫着后退，但这双枯瘦如柴、长满冻疮和污泥的手，却像被恶鬼附身一般，疯了似地扑向了那个碗。\n“慢点，别洒了，洒一滴，我就剁你一根手指。”那个高高在上的声音笑着，周围挤满了精致的扇子和浓烈的香粉味。\n我捧起碗，把脸埋进那团滚烫的腥气里。这一口下去，就像吞下了一块烧红的炭。滚烫的油汤直接烫烂了嘴唇，顺着食道一路烧下去，所过之处，黏膜剥落，水泡炸裂。喉咙在剧痛中痉挛，却还在贪婪地吞咽，因为那里面的油脂……是肉的味道。\n生理性的反胃瞬间涌上喉头，刚刚吞下去的、混着鲜血和烂肉的汤汁，喷涌而出，淋满了那双昂贵的丝绸鞋面。\n“脏东西！”\n那一脚踢在肋骨上，骨头断裂的脆响清晰可闻。我像一条被打断了脊梁的癞皮狗，趴在滚烫的尘土里，在那摊我还带着体温的秽物中，疯狂地搅动着手指，寻找那枚承诺过的银币。\n……\n“陛下？陛下？您出汗了。”\n侍女惊恐的声音刺破了梦境的薄膜。我猛地坐起，眼前是堆满山珍海味的、绵延到大厅尽头的长桌。空气里充斥着浓郁的酒香和烤肉的香气。\n指尖触碰到的是冰冷且坚硬的、象征权力的红宝石戒指。光滑的嘴角边，只有残留的葡萄酒渍。\n看着眼前这就连巨人都吃不完的盛宴，胃里却依旧翻涌着那股熟悉的、难以抑制的抽搐。我抓起一只金杯，将里面猩红的酒液一饮而尽，发出了比梦里那些贵族更刺耳、更疯狂的大笑。\n吃吧……喝吧……\n只要把肚子填满，只要把那个正在燃烧的胃填满……我们就再也不用趴在地上，去捡那枚沾着呕吐物的银币了。"
PAM.5.a: "“那种饥饿……从未消失”"

PAM.6.t: "错位的鞭挞"
PAM.6.d: "广场上，我的军队是一片沸腾的黑色海洋。成千上万个衣衫褴褛的身影挤在一起，争抢着刚烤好的肉，咀嚼声、咒骂声汇聚成雷鸣般的轰响。那是生命最原始、最粗野的咆哮，是我最痴迷的景象。\n胸口的那颗心脏，在这一秒猛地收缩。一股带有金属质感的寒意，顺着血管瞬间冻结了全身的燥热。\n眼前的画面扭曲了。那些大口吃肉的士兵在我的视野里褪去了人形，变成了一头头写在账本上的、待宰的牲畜，变成了必须被精确计算的损耗品。\n“太浪费了。”一个念头毫无征兆地钻进脑子，声音优雅、冷静，像极了那些曾经拿着鹅毛笔计算我口粮的税务官，“只需保留维持生存最低限度的热量，就能换取最高的服从性。把肉收起来，换成定量的发霉面糊。把她们的嘴缝上，让她们排成整齐的方阵，像雕塑一样站立……”\n我的手不受控制地抬起，想要下达那个名为“秩序”的命令。恍惚间，一只戴着精致白手套的、属于男人的手，重叠在我的手上。那是曾经那个大公爵的手，那个“他”，正企图借用“她”——也就是我的身体，去完成一场完美的、属于贵族的驯化。\n那种令人作呕的、高高在上的支配感，让我感到一阵从骨髓里泛起的恶寒。\n“去你妈的秩序！！”\n我猛地咬破了自己的舌尖，剧痛和满嘴的腥甜瞬间冲散了那股冰冷的幻觉。手中的酒壶被我狠狠砸向楼下，酒液溅了她们一身。\n“都给我吃！都给我叫！”我对着下面那群惊愕的士兵嘶吼，声音因为恐惧和愤怒而颤抖，“谁敢让你们排队，谁敢让你们闭嘴，我就杀了她！哪怕那个人……是我自己！”\n我大口喘着粗气，按住那颗想要把我也变成冷血怪物的心脏。差一点，我就变成了我最恨的那个样子。"
PAM.6.a: "“我是狼王，不是牧羊人！”"

PAM.7.t: "失控的缰绳"
PAM.7.d: "王宫的议事厅死一般的寂静，只有我的心跳声，像重锤一样砸在耳膜上。\n那个满脸横肉的雇佣兵将军跪在地上，汗水顺着他惨白的脸颊滴落在昂贵的地毯上，洇出一片深色的污渍。他指着窗外，粗壮的手指在剧烈颤抖。\n“陛下……它们……动了。”\n“谁动了？”\n“那些……地底下的东西。就在刚才，黎明破晓的时候。没人吹号，没人下令。它们自己……撞开了封印的闸门，像发了疯的洪水一样，涌向了东南方的山口。”\n我的手猛地抓紧了王座的扶手，指甲崩断在坚硬的黄金里，传来一阵钻心的疼。\n那把通往地底的钥匙，此刻正挂在我的腰间，冰凉刺骨，沉甸甸地坠着我的裙摆。\n胸口那颗夜莺之心，此刻正在疯狂地搏动，一下比一下重，一下比一下烫。它在欢呼，在雀跃，在向着那个方向发出某种我听不懂的、古老而贪婪的嘶吼。\n是它自己在渴望鲜血？还是……那个远在冥界的她，正在召唤属于她的东西回去？\n那股力量顺着血管蔓延，烧得我眼前发黑。那些怪物嗅到了什么？是野火那群泥腿子的血腥味？还是……某种连我也无法察觉的、更深的恐惧？\n将军抬起头，眼神里充满了对这种超自然力量的极度惊骇，他在等我的解释，等我展示作为主人的威严。\n我强行咽下喉咙里涌上来的腥甜，用尽全身力气压住那颗狂跳的心脏，嘴角硬生生地扯出一个僵硬、狰狞，却必须显得胸有成竹的笑容。\n“慌什么。”\n我站起身，尽管双腿在沉重的裙摆下微微打颤，但我必须站得比谁都直。\n“那是……我的宠物们，饿了。”"
PAM.7.a: "（该死的……到底是谁放出了它们？！）"

PAM.8.t: "泥潭里的倒影"
PAM.8.d: "那群自称军团的废物，垮得比我想象的还要快。\n报告扔在脚边，我甚至懒得去踩它。雪伊……那个疯女人的动作太快了，快得就像当年我在巷子里抢了面包就跑的速度一样。\n我站在露台上，透过望远镜，贪婪地盯着城外那片正在集结的、如野火般蔓延的军队。我没看她们的枪炮，也没看她们的旗帜。我看的是她们的脸。\n脏，真脏。头发打结，脸上全是泥垢，有的甚至还没鞋穿，脚冻得发紫。可是那双眼睛……那双眼睛里冒着的绿光，那是饿狠了的狼才有的光。\n我的胃突然抽搐了一下，一种久违的、幻觉般的饥饿感涌上喉头。我太熟悉那种眼神了。那是想要把眼前的一切——高墙、丝绸、黄金、甚至我这个女王——都撕碎了吞进肚子里的眼神。\n“真可怜啊……”我喃喃自语，手指无意识地抓紧了冰冷的栏杆，“那种趴在泥水里，连骨头缝都在喊疼的滋味……我懂。我比你们谁都懂。”\n那一瞬间，我甚至涌起一股冲动，想打开城门，想把地窖里所有的酒肉都推出去，对着她们大喊：“别抢了！都给你们！姐姐请你们吃顿饱的！”\n就像……我当年发誓如果我有钱了，绝不让任何一个乞丐饿死一样。\n但下一秒，胸口的那颗心猛地跳动，那是警报，也是嘲笑。\n她们不是来乞讨的。她们是来推翻“餐桌”的。她们跟着那个叫雪伊的女人，想要建立一个什么“公平”的世界？\n哈！公平？\n那意味着秩序，意味着分配，意味着……那些高高在上的贵族官僚掌控了一切。\n绝不！\n我好不容易才从那个不生不死的地方逃出来，好不容易才建立起这个喧嚣的、疯狂的、充满了欲望和生命力的世界。我绝不允许任何人把它变成那种温吞水的样子！哪怕是……曾经的我也不行。\n既然你们也是狼，那就按狼的规矩来办。\n我拔出腰间的佩剑，剑锋直指那片在这个世界上我唯一能产生共鸣的敌人。\n“想吃肉吗？想活下去吗？那就跨过我的尸体！只有最狠的那头狼，才配活在太阳底下！来啊！让我看看……你们的牙，够不够硬！”"
PAM.8.a: "“这一课，我亲自教你们。”"

PAM.9.t: "来自深渊的抗议"
PAM.9.d: "王宫的地牢名册就摆在我的膝盖上。我的一只手端着酒杯，另一只手的手指在那些名字上划过。\n“晓枫……”我想起那个总是冷静得像块石头的女人。也许该把她变成我的书记官？让她用那颗聪明的脑袋，专门为我计算每天能从贵族那里榨出多少油水。我想看她一边写一边皱眉的样子，一定很有趣。\n“雪伊……”那个疯狗一样的女人。哈，她最像我。我要把她编进我的禁卫军，给她穿上最华丽的铠甲。我要看看，当她拿着我的剑去砍那些反对我的人时，脸上会是什么表情。\n“还有那个小不点……小果子？”听说她很会开船？听说她在大海上像只自由的海鸥？\n呵，那就把她的翅膀剪了。给她穿上最繁琐的蕾丝裙子，把她当成我最喜欢的洋娃娃，锁在我的卧室里。我要看着她每天只能围着我转，心情好的时候，就让她给我剥葡萄；心情不好的时候，就让她唱那些只有下等人才会唱的渔歌来给我解闷。\n我想着想着，忍不住笑出了声。那种把曾经的死敌变成掌中玩物的快感，比烈酒还要醉人。我赢了，我是这个世界的王，我有权决定她们每一个人的命运，我有权……\n“轰隆——！！！”\n一声沉闷的巨响，突然从地板的最深处传来，震得我手中的酒杯“啪”地一声掉在地上，摔得粉碎。\n那是……来自地窖，来自那个连接着夜莺之国的大门的撞击声。\n紧接着，是一阵令人毛骨悚然的、成千上万个亡灵同时发出的嘶吼。那声音是充满了饥饿、狂躁和贪婪。\n我的胸口猛地一阵剧痛，那颗心脏在疯狂地跳动，它在……恐惧？不，它在兴奋！它在回应地下的那些东西！\n那个将军跌跌撞撞地冲进来，脸色惨白如纸：“陛下！不好了！那些……那些在战场上死掉的野火士兵……还有我们以前唤醒的亡灵……它们……它们不肯回去了！它们正在撞击封印！它们在喊……在喊……”\n“喊什么？！”我捂着胸口，厉声喝问。\n“它们在喊……不够！它们说……血肉不够！那个世界……太挤了！它们要……上来！”\n我愣住了。\n我看着地上的红酒渍，看着那份还没来得及勾选的名单。\n我以为我征服了野火，就能拥有一切，就能尽情地享受我的战利品。\n但我忘了……为了赢，我喂养了一群永远吃不饱的恶鬼。现在，这群恶鬼吃光了敌人，终于……把贪婪的目光，转向了它们的主人。"
PAM.9.a: "“反了……都给我滚回去！！”"

PAM.10.t: "镣铐解开的声音"
PAM.10.d: "地牢的铁门被粗暴地撞开了，但进来是一股令人牙齿打颤的阴冷寒风。\n雪伊被按在潮湿的墙上，嘴里还在骂着脏话：“来啊！动手啊！别以为老娘会怕那个坐在金子堆里的疯女人！”\n“闭嘴，听。”一直沉默的晓枫突然开口，她的耳朵贴着地面，脸色在昏暗的火把下显得异常严峻，“是惨叫声。还有……骨头摩擦的声音。”\n缩在角落里的小果子打了个寒战，抱紧了双臂：“好冷……这种冷，像是从海底下透出来的……”\n没等她们想明白，那个平时最凶恶的典狱长跌跌撞撞地冲了进来。他那张总是油光满面的脸此刻惨白如纸，手里的钥匙串哗啦啦作响，抖得像筛糠。\n“解开！快给她们解开！”他冲着狱卒嘶吼，声音里带着哭腔，“女王有令！不管是死囚还是流浪汉，只要是喘气的，都他妈给我站起来！”\n“当啷”一声，沉重的手铐落在了地上。紧接着，几盘装满了大肉的餐盘和几把还沾着枪油的步枪被扔到了她们脚下。\n“这是什么意思？”雪伊揉着被勒红的手腕，警惕地盯着那个典狱长，“那是断头饭，这是断头枪？”\n“这是保命的家伙！”典狱长一边擦汗一边往外跑，甚至不敢看她们一眼，“女王说了：‘告诉那些野火的狼崽子，她们的命是我的！只有我能杀她们！外面的那些骨头架子……不配！想活命的，吃饱饭就拿上枪去城墙！把血给我烧热了！’”\n晓枫捡起地上的步枪，拉动枪栓，那清脆的上膛声在死寂的牢房里回荡。\n她看向门外那片被诡异紫霞染色的天空，那是夜莺之国的颜色。\n“看来……我们的死期推后了。”晓枫看向身边同样捡起武器的雪伊和小果子，嘴角勾起一抹无奈又复杂的苦笑，“雪伊，小果子。准备战斗吧。为了……保护那个把我们关进来的疯女人的，同时也是我们的，家。”"
PAM.10.a: "（所以？骨头架子是站在哪一边的？）"

PAM.11.t: "出笼的疯狗"
PAM.11.d: "地下监牢的空气在燃烧，这里正沸腾得像一口炸了的油锅。成捆的步枪带着刺鼻的枪油味，砸在满是污垢的走廊上，发出沉闷的撞击声。铁铲、镐头，甚至是从厨房抢来的菜刀，被狱卒们粗暴地塞进囚犯们的手里。\n那些曾经拿着鞭子的狱卒此刻正哆哆嗦嗦地转动钥匙，铁门一扇接一扇地敞开，金属撞击声响成一片。\n“拿着！都拿着！手脚都动起来！”狱卒长吼叫着，声音因恐惧而变得尖锐刺耳，“女王有令！外面的那些东西想把这里变成坟地，想把大家都变成乖宝宝……她偏要反着来！”\n他大口喘着气，模仿着索拉娜那种独有的、傲慢又疯狂的语调嘶吼：“告诉那群野火的狼崽子，你们的命是女王从烂泥里捡回来的！你们的骨头必须由她亲手拆，你们的惨叫必须由她亲自听！那群老掉牙的骨头架子算什么东西？它们只配被你们咬碎！滚出去！去撕烂它们！只要还能喘气，就必须给我活得热气腾腾的！”\n一名满脸伤疤的老游击队员一把抓起磨得发亮的工兵铲，他在手里掂了掂分量，抬头看向头顶那摇摇欲坠、不断落下灰尘的石板，仿佛透过了厚重的岩层，看见了外面那个正在燃烧的世界。\n“呵……那个疯女人。”他啐了一口带血的唾沫，眼中原本死灰般的沉寂瞬间被野兽般的凶光取代，“她想看戏？那就演给她看！同志们！既然老天爷拒收，女王也留着我们这条命……那我们就去给外面的那些骨头松松土！让它们好好尝尝，活人的血……到底有多烫！”"
PAM.11.a: "（哪怕是死，也要死在冲锋的路上！）"

PAM.12.t: "最吵闹的心跳"
PAM.12.d: "“好烫……”\n我捂住胸口，那里本该是一片虚无的空洞，此刻却传来了一阵像是要把灵魂都烫穿的灼热剧痛。\n整个夜莺之国都在震颤。那是……索拉娜。\n她的声音，穿透了生与死的帷幕，穿透了万年的寂静，像一把烧红的匕首，狠狠地扎进了我的脑海里。\n她在燃烧夜莺之心。她在用那颗我最珍视的心脏，当作柴火，去点燃一场甚至能灼伤亡灵的大火。她在向我挑衅，她在向我炫耀她那所谓的生命力。\n“……笨蛋。”\n眼泪，毫无征兆地从我的眼眶里涌了出来，瞬间就被那股传递过来的热浪蒸发。\n“索拉娜……你这个……无可救药的大笨蛋！”\n“谁告诉你我只喜欢安静了？谁告诉你……我想把你变成只会睡觉的玩偶了？”\n“我讨厌吵闹，但我更讨厌……没有你的安静啊！”\n“你以为烧光了自己，就能向我证明什么吗？你以为把自己变成灰烬，就是所谓的活着吗？！”\n我猛地站起身，推开了那扇尘封已久的大门。外面的亡灵大军正在躁动，它们渴望着那股鲜活的能量。\n“都给我走开！”\n我对着那片无尽的黑暗嘶吼，声音里不再有公主的优雅，只有一种……害怕失去最重要宝物的、歇斯底里的焦急。\n“那是我的！那团火是我的！那个吵死人的笨蛋……也是我的！”\n“索拉娜，你给我听着！不许死！在你把那个热乎乎的家赔给我之前……你绝对，绝对不许熄灭！”\n“我现在……就来抓你了！”"
PAM.12.a: "§1“等我！！！”§!"

PAM.13.t: "灰烬中的辩词"
PAM.13.d: "“结束了……吗？”\n喧嚣退去，只有风穿过残破城墙的呜咽。我低下头，看着自己的指尖。那上面只有正在一点点剥落、化为黑色尘埃的皮肤。那颗借来的心脏跳得越来越慢，每一声都像是在敲响丧钟。我要消失了。这一次，是真的要变回那滩烂泥了。\n我转过头，看向城墙下那些刚刚从亡灵口中活下来的、衣衫褴褛的人们。她们正用一种我看不懂的眼神看着我——是恐惧？是敬畏？还是……憎恨？\n那种眼神像针一样扎进了我的眼睛。我的胃突然痉挛起来，一种比饥饿更可怕的恶心感涌上喉头。\n“别用那种眼神看我！！”\n我突然发疯似地冲她们咆哮，声音嘶哑而破碎，像个受了委屈却还要逞强的孩子。\n“我烧了他们的地契！我把那些要把你们当马骑的贵族全挂在了路灯上！是我！是我把枪硬塞进你们手里，逼着你们站直了！是我把皇宫拆了给你们盖房子，把那些金盘子熔了给你们换肉汤！我哪怕自己没读过书，我也想让你们活得像个人样！我哪里做错了？啊？！我哪里对不起你们了？！”\n我大口喘着气，想要证明什么，可脑海里却突然闪过那天晚上的画面。\n那天，军团把镇压报告送上来的时候……上面写着“清除贫民窟暴乱”。我知道那是屠杀……我看到了照片上那些和我以前一样穿着破烂衣服、瘦骨嶙峋的尸体。我当时……手都在抖，酒杯都摔碎了。我很惊讶，真的……我很想吐。\n可是……可是我为什么没有惩罚她们？\n我只是……转过了头。我只是重新拿了一个杯子，告诉自己那是为了秩序，是为了赢，是为了不让野火烧过来。我假装没听见那些哭声，就像当年那些贵族假装没听见我的哭声一样。\n我杀了恶龙，却养了一群更凶的狼来咬你们……\n“不……不对！我没错！这个世界本来就是吃人的！不狠心怎么活？！不流血怎么活？！”\n我抓着胸口，手指嵌进了肉里，试图按住那份正在撕裂我的、迟来的剧痛。\n“……可是，莉莉……如果不痛的话……为什么我现在……这么想哭呢？”\n身体越来越轻，我闭上眼睛，在那无尽的黑暗降临前，依然倔强地昂着头，不肯让那一滴悔恨的眼泪流下来。"
PAM.13.a: "“就算到了地狱……我也绝不认错。”"

PAM.14.t: "黎明破晓之时"
PAM.14.d: "黑暗并没有降临。\n取而代之的，是一个冰凉的、却让我灵魂都在颤栗的拥抱。那股熟悉的、带着月光和露水气息的味道，瞬间驱散了所有腐朽的尘埃。\n我惊愕地睁开眼，看到的是莉莉安娜。她穿着与往常一样的斗篷与沾了些许泥土的、素白的裙子，在这片满是血污的废墟上，紧紧地抱着正在消散的我，将她那近乎无穷无尽的生命力，毫无保留地渡进我破碎的躯壳。\n“……莉莉？”我不敢置信地看着她，“你……你是来抓我回去关禁闭的吗？你是来看我笑话的吗？”\n“笨蛋。”她轻声骂了一句，眼角还挂着泪珠，却对我露出了一个我从未见过的、如释重负的笑容，“我不是说了吗？我要来抓你……抓你一起回家。不过这一次，家不一定要在那里。”\n她抬起头，那双纯净得像宝石一样的眼睛，第一次认真地、没有丝毫嫌弃地，看向了周围那些惊魂未定、满身伤痕的底层人民，看向了远处那些还没完全散去的、警惕的野火游击队员。\n“你看，索拉娜。你把这里弄得一团糟。”她像个看着调皮孩子打破了花瓶的姐姐，语气里带着责备，更多的是心疼，“你把她们的家弄坏了，你让她们流了那么多血，你让她们这么伤心……你真是个不听话的坏孩子。”\n我羞愧地想要低下头，可她却捧住了我的脸。\n“但是……没关系。”她的声音坚定而温柔，“坏掉的东西，我们可以修。流出来的血，我们可以止。如果你的道歉不够，那就加上我的。如果你的力量不够，那就用上我的。”\n她站起身，向着那些曾经被我视为蝼蚁、甚至敌人的方向，向着那些满脸泥垢的流浪汉，向着那些握着枪的革命者，缓缓地伸出了手。那姿态仿佛不再是高高在上的神明，而变成了一个愿意学习如何行走的凡人。\n“我不懂怎么种麦子，也不懂怎么盖房子，我甚至不知道那种叫饥饿的感觉到底有多痛。但是……如果这是你拼了命也想守护的热闹，那我也想试着……去听一听。”\n她回过头，在那初升的朝阳下，对我伸出了另一只手。\n“起来吧，我的索拉娜。我们不去那个安静的地方了。我们就留在这里，和这些人，和那些叫野火的孩子们一起……把你弄坏的这个世界，一点一点地，重新拼好。好吗？”"
PAM.14.a: "（……我真是个傻瓜）"

PAM.15.t: "狼吻"
PAM.15.d: "“咣当——！”\n一声巨响，雪伊一脚踹开了面前昂贵的红木椅子，那只沾满泥垢的军靴直接踏在了铺着雪白桌布的长桌上，震得银质餐具乱跳。王宫侍卫刚要拔剑，却被索拉娜一声冷笑喝退。\n索拉娜坐在主位上，手里抓着一只淌油的烤羊腿，甚至没有抬头，只是用眼角的余光，轻蔑地扫视着这位败军之将。\n“收起你那副施舍的嘴脸，索拉娜。”雪伊俯下身，整个人像一张拉满的强弓，带着令人窒息的压迫感逼近索拉娜。她一把抓住了索拉娜握着餐刀的手腕，力气大得让索拉娜的手骨咯吱作响。\n“你以为赢了一次，就能给我套上项圈？你抢了贫民窟最后的口粮，把那里变成地狱，现在摆这一桌人血宴席给谁看？！只要我还有一口牙，我就能咬断你的喉咙！”\n面对这扑面而来的杀意，索拉娜的脸上没有一丝恐惧。她慢条斯理地撕下一块肉放进嘴里，眼神中透着一股独裁者特有的、不可理喻的傲慢。\n“你那是瞎了眼。”索拉娜咽下食物，猛地甩开雪伊的手，随手抓起一本厚重的羊皮账本，狠狠摔在雪伊脚下，“自己看！那是谁的血！”"
PAM.15.a: "……"

PAM.16.t: "狼吻"
PAM.16.d: "雪伊单手抖开账本，目光如电般扫过。“……处决屯粮不售的门多萨男爵……绞死克扣抚恤金的税务官瓦格斯……”\n贫民？工人？全都没有。死在她刀下的，全是那些盘踞在这片土地上几百年的、吸血的豪强与劣绅。\n空气凝固了。雪伊看着账本，呼吸急促。她眼中的火焰因为看清了索拉娜的手段而燃烧得更加纯粹。\n但就在翻到最后一页时，雪伊的动作突然顿了一下。她盯着那一页的页脚，紧绷的嘴角忍不住抽搐了一下。\n在那行庄严的、由宫廷书记官用花体字写下的“批准执行”旁边，找不到任何女王的签名。取而代之的，是一个用粗炭笔画的、歪歪扭扭的、甚至把纸都戳破了的简笔画——一个小人正举着火把，在烧一个看起来像屁股的大圆圈。\n而在那个画旁边，代表王室权威的绯红印章，竟然被盖反了。\n“……你把粮仓画成了屁股。”雪伊抬起头，眼神复杂地看着索拉娜，语气里多了一丝荒谬，“而且，连印章都盖倒了。你根本看不懂这上面写的是什么条款，对吧？”\n“闭嘴！那是粮仓的圆顶！我看那些贵族不爽，想盖哪就盖哪，想怎么盖就怎么盖！”索拉娜的脸瞬间涨红了一瞬，随即又恢复了那副理直气壮的恶狠模样，“我只要知道结果！结果就是那帮肥猪死了，粮仓开了！这就够了！”\n雪伊猛地合起账本，那一声响得像枪声。她直接跨过桌面，一把揪住了索拉娜华丽的领口，将这位“文盲女王”硬生生地拽到了自己面前，两人的鼻尖几乎碰到一起。\n“算你还有点良心。但你是个没文化的疯子。”雪伊盯着索拉娜的眼睛，气势完全压倒了这个刚刚加冕的暴君，“你这台机器只有油门，没有刹车，甚至连路牌都看不懂。你会带着所有人冲进悬崖。”\n“所以……”雪伊突然松开手，抓起桌上的一瓶烈酒，仰头灌下，然后将空瓶重重顿在桌上，玻璃渣四溅。\n“……这方向盘，老娘握住了。晓枫出脑子，小果子出眼睛，我——就是你的刹车片。索拉娜，听好了，我不管你是女王还是恶鬼，如果你敢把车开歪一点，敢对无辜的人露出一颗獠牙……”\n她伸出满是伤痕的手指，狠狠戳着索拉娜心口那颗狂跳的心脏，一字一顿地宣判：\n“……我就亲手，把它挖出来。”"
PAM.16.a: "（嘴角上扬，擦掉嘴边的油渍）“成交。”"

PAM.17.t: "墨水与骨灰"
PAM.17.d: "操场上弥漫着一股令人窒息的味道——那是原油、烧焦的骨粉和某种魔法药剂混合而成的恶臭。一口巨大的、原本用来煮行军粥的行军锅，此刻装满了漆黑如墨的染料，正在炭火上咕嘟作响。\n索拉娜站在锅边，手里嫌弃地拎着一面从晓枫那里缴获的、洗得发白的红旗，连同几件剥下来的野火军装，一股脑地扔进了那口黑锅里。\n“太亮了。”索拉娜拿着一根搅屎棍般的长勺，看着鲜艳的红色瞬间被粘稠的黑色吞没，“这种颜色只适合去给敌人的机枪手当靶子。晓枫，你以前就是这么教兵的？教她们怎么把自己变成一朵炸开的血花，好让我在城墙上给你鼓掌？”\n晓枫站在队列的最前方，依然挺得笔直。她看着那面沉入黑水的旗帜，眼神微微波动了一下，随即恢复了那副令人安心的冷静。她并未反驳，只是淡淡地说：“那代表牺牲与黎明，头儿。那是……理想的颜色。”\n“屁的理想！”索拉娜用力搅动着黑水，“死人没有理想，死人只有尸臭！我要的是一群能藏在黑夜里、能趴在死人堆里、能把牙齿咬进敌人喉咙里的狼！不是一群穿着红裙子跳舞的烈士！”\n她猛地一挥长勺，从锅里挑起一件已经彻底变成漆黑、湿淋淋且散发着诡异幽光的军大衣，带着滚烫的墨汁，狠狠甩到了晓枫的脚下。\n“穿上它。”索拉娜的命令不容置疑，却又带着一种别扭的关怀，“这染料里掺了我那些亡灵卫队的骨灰。穿上这身黑皮，那些没脑子的亡灵就会把你们当成自己人。这样……打仗的时候，我的死人在前面抗线，你的活人在后面放冷枪。谁也别想死在我前面。”\n晓枫低下头，看着那件还在滴水的黑色军衣。这场景何其熟悉又何其讽刺——几年前，她脱下军团的制服，是为了不再当刽子手；今天，她穿回更黑的制服，却是为了让更多人活下去。\n她缓缓弯下腰，捡起了那件沉重的、散发着怪味的大衣，披在了身上。当她再次抬起头时，脸上露出了一个混杂着无奈与释然的、极具魅力的微笑。\n“夜间渗透与亡灵协同作战旅……”晓枫用标准的参谋口吻念出了这个拗口的新番号，然后向那个满身油污的女王敬了一个无可挑剔的军礼，“虽然这身行头闻起来像刚从煤窑里爬出来的，但这战术思路……确实符合狼群的生存法则。成交，头儿。”\n“还有，”晓枫指了指那口锅，突然补充了一句，打破了严肃的氛围，“您刚才是不是把半袋面粉也倒进去了？这染料……怎么闻起来有点像烤糊的面包？”\n索拉娜的脸僵了一下，随即恼羞成怒地挥舞着长勺：“闭嘴！那是为了增加粘稠度！懂不懂什么叫炼金术！赶紧给我穿上，丑死了！”""
PAM.17.a: "“番号改成黑狼！太长的名字我记不住！”"

PAM.18.t: "粥与酒"
PAM.18.d: "“这就是……你说的国宴？”\n莉莉安娜端坐在那张沾满了油渍的长条木凳上，她那身一尘不染的月光白裙，在这个充满了大蒜味、汗臭味和劣质麦酒味的广场上，显得是那么格格不入。在夜莺之国那漫长的几万年里，她的嘴唇只触碰过冰冷的泉水和虚无的魔力，“进食”这个词，对她而言，是一个只存在于书本里的、属于凡人维持肉体运转的陌生概念。\n“别在那儿用勺子数米粒了！快张嘴！”索拉娜直接蹲在桌子上（没错就是双脚蹲在桌子上），手里抓着一只不知从哪个领主家抢来的金酒壶，另一只手极其粗鲁地把那碗褐色的、咕嘟冒泡的杂烩粥往莉莉安娜嘴边一推。\n“尝尝！这可是我让晓枫那个只会算数的脑袋，精确计算了全城剩下的土豆和咸肉，才熬出来的救命粥！虽然看着像泥浆，但只要一口下去……哈！那是太阳晒在背上的味道！”\n莉莉安娜看着那碗浑浊的、散发着热气的粘稠液体，本能地想要后退。对于一个神明般的灵体来说，将这种死去的植物和动物尸体塞进身体里，简直是一种亵渎。但她抬起头，看到了索拉娜。看到了那个满嘴是油、眼睛却亮得像火焰一样的女孩。索拉娜正紧张地盯着她，像个献宝的孩子，生怕她嫌弃这个脏兮兮的世界。\n“……这就是，活着的代价吗？”\n莉莉安娜轻叹了口气，像是赴死一般，闭上眼睛，笨拙地将此世吃到的第一勺食物，送进了嘴里。\n那是……一种从未体验过的、甚至有些暴力的感觉。滚烫的温度瞬间烫到了舌尖，粗糙的谷粒摩擦着喉咙，咸味、肉味和一点点焦糊味在口腔里横冲直撞，最后化作一股沉甸甸的暖流，蛮横地砸进了她那原本空荡荡的胃里。\n这种感觉……很重，很粗鲁，甚至……有点痛。\n“……怎么样？”索拉娜凑近了问，酒气喷在莉莉安娜脸上。\n莉莉安娜被烫得眼角泛红，她捂着嘴，感受着那股在身体里扩散开来的、陌生的热度。她从未觉得身体如此沉重，也从未觉得……自己如此真实地存在于这个世界上。\n“……很吵。”莉莉安娜睁开眼，嘴角却勾起了一个无奈又宠溺的、极淡的微笑，“……这种味道……像是一个虽然很粗鲁、但是很用力的拥抱。”\n索拉娜愣了一秒，随即爆发出了一阵惊天动地的大笑，她猛地灌了一口酒，用力拍着莉莉安娜的肩膀：“哈！拥抱！听到了吗小的们！公主说你们做的饭像拥抱！都给我敞开肚皮吃！谁要是敢剩下一口，我就给她一个更用力的拥抱——勒断脖子的那种！”"
PAM.18.a: "“这才是凡人的烟火气！”"

PAM.19.t: "锈蚀笼中的百灵"
PAM.19.d: "“过来，百灵鸟。跪到我靴子边上来。”\n埃斯特班老爷的声音在颤抖，被窗外种植园燃烧的噼啪声吓得变了调。我顺从地爬过去，跪在他那张沉重的、雕刻着家族徽章的红木椅旁。房间里闷热潮湿，弥漫着陈旧的雪茄味，还有他身上那股盖不住的、属于老年人的腐朽汗味。\n他伸出那双戴着金戒指、长满老年斑的手，粗暴地插进我的头发里，强迫我仰起头。他的手指在我脸上游走，甚至伸进我的衣领，狠狠地捏住我后颈那块软肉，像是在把玩一只养熟的猫。那种触感湿黏、冰冷，让我胃里翻涌，但我纹丝不动。\n因为他是我的“恩人”。十年前的雨季，是他把我从路边的泥坑里捡回来，给了我玉米饼，教我用刀。虽然他总喜欢让我像狗一样趴着，虽然他有时候看着我的眼神充满了贪婪——就像看着一件即将成熟的、属于他的私有财产。但他告诉我，这就是恩情，是老爷对下等人的慈悲。\n“听着，我的小鸟。”老爷把脸埋进我的颈窝，深深地吸了一口我的气味，声音嘶哑而狂热，“那个叫索拉娜的疯女人……她是恶魔。她把那些只会偷懒的穷鬼变成了吃人的野兽，她在用活人的血肉去喂养地底的怪物！如果不杀了她，这片土地上所有的穷人，都会被她拖进地狱！”\n我的心猛地一紧。我想起了小时候饿死的妹妹。如果那个索拉娜真的是这种为了力量不择手段的暴君……\n“只有你能做到。”老爷抬起头，浑浊的眼睛里闪烁着残忍的光，“因为你没有‘气息’。你是完美的杀手，那些亡灵闻不到你，那个女人的巫术也感觉不到你。你是唯一能穿过那道黑色死墙的利刃。”\n他从怀里掏出一把淬了毒的、此时正散发着幽光的匕首，塞进我的手里，然后又在我额头上留下一个湿漉漉的、令人作呕的吻。\n“去吧，杀了那个暴君。为了我，也为了……去救那些和你一样的穷人。”\n我握紧了匕首，看着窗外映红了半边天的火光,那是毁灭的烈焰。\n“是，主人。”\n我站起身，眼神变得无比坚毅。我要用这把刀，去切断所有穷人的痛苦。"
PAM.19.a: "（笼门打开了，鸟儿又会飞向何方？）"

PAM.20.t: "浆果"
PAM.20.d: "一只巨大的、由骸骨缝合而成的亡灵猎犬，迈着沉重的步伐，从我藏身的箩筐前走过。它的鼻孔喷出腐臭的硫磺气，甚至吹动了我额前的碎发。如果是普通人，此刻已经被撕碎了。那怪物停顿了一下，空洞的眼眶扫过我所在的位置，却像是在看一团空气，随后便毫无察觉地离开了。\n这就是我的天赋。老爷说，我是天生的幽灵，是注定要插进暴君心脏的隐形利刃。\n我看着远处街道上那些穿着黑色军服、喧嚣而过的士兵，心中充满了厌恶。这就是那个索拉娜的军队吗？她们如此吵闹，如此野蛮，所过之处鸡飞狗跳。老爷说得对，她只会给穷人带来灾难。\n“喂，大姐姐。”\n一个细细的、像是小老鼠一样的声音突然在旁边响起。我本能地袖中滑出匕首，眼神瞬间变得冰冷。\n是个瘦得皮包骨头的小女孩，正蹲在旁边的一堆烂木头后面，手里攥着几颗还没熟透的青色浆果。她看着我，眼睛里毫无恐惧，只有纯粹的好奇。\n“你也是躲那些当兵的吗？”她吸了吸鼻涕，把声音压得很低，“别怕，她们忙着去砍树呢，没空抓我们。”\n我皱了皱眉，收回了刀锋。“砍树？”\n“是啊，去砍那些‘尖耳朵’住的大树啊。”女孩理所当然地说，“那群住在树上的家伙坏得很，以前总放箭射我们捡柴火的人。现在那群黑衣服的兵要去把她们拽下来了……虽然打仗挺吓人的，但要是能把树砍了，我们就不用怕没柴烧了。”\n“尖耳朵……？”我愣住了。在老爷的庄园里，我只学过杀人的技巧和对索拉娜的仇恨，从来没人告诉过我，这世上还有住在树上的、长着尖耳朵的人。\n女孩看着我困惑的样子，咧嘴笑了，露出一颗缺了角的门牙。她把手里那几颗酸涩的浆果，在脏兮兮的衣服上擦了擦，然后分了一半，递到了我面前。\n“给。虽然有点酸，但能顶饿。”\n我看着那几颗青色的果子。我是杀手，我不能吃陌生人的东西，更不能有牵挂。可我的手……却鬼使神差地伸了出去。\n“为什么要给我？”我冷硬地问。\n“因为你看起来……好像从来没跟人说过话一样。”女孩满不在乎地把剩下的果子塞进嘴里，腮帮子鼓鼓的，“我叫阿雅。我没有爸爸妈妈了，也没有朋友。大姐姐，你看起来很厉害，也不怕那些怪物。我们……做个朋友吧？两个人躲着，总比一个人暖和。”\n朋友？\n这个词对我来说，比那些从未听说过的“尖耳朵”还要陌生。我握着那几颗冰凉的浆果，指尖却传来了一阵从未有过的、奇异的温度。\n她不知道我要去杀谁，也不知道我是什么人。她只是……在一个兵荒马乱的下午，把她仅有的食物，分给了我一半。\n我迟疑着，在那双清澈得毫无杂质的眼睛注视下，轻轻点了点头。\n“……百灵。”"
PAM.20.a: "（握住那只脏兮兮的小手）"

PAM.21.t: "肉饼"
PAM.21.d: "“就在这儿等我，阿雅。我……很快就回来。”\n我对她许下了承诺，然后转身冲向了军队集结的方向。但我扑了个空。索拉娜的黑色军团像一阵风暴般卷走了，只留下空荡荡的营地和满地狼藉。我找不到那个暴君，只能握着那把淬毒的匕首，心急如焚地折返。\n可当我回到那个巷角时，我只听到了一阵格格不入的、优雅的笑声。那是丝绸摩擦的声音，是水晶杯碰撞的声音，是我在老爷庄园里听惯了的、属于上等人的声音。\n我僵住了。\n巷子里摆着一张临时的小圆桌，铺着洁白的餐布。几个衣着华丽、但在之前的清洗中幸存下来的落魄贵族，正围坐在那里，手里端着银盘，脸上挂着一种扭曲而亢奋的红晕。而在他们中间的泥地上，放着一个……“东西”。"
PAM.21.a: "……"

PAM.22.t: "肉饼"
PAM.22.d: "那是一截……肉红色的躯干。手，脚，全都消失了。伤口被草草地烫糊止血，像一根被削去了枝丫的树干，在这个肮脏的泥坑里无力地抽搐……着。\n那是…………阿雅。\n“吃啊，小老鼠，怎么不吃了？”一个贵族用叉子叉起一块还在冒着热气的、肉馅饱满的馅饼，那是用刚刚剁下来的、新鲜的“原料”做成的。他笑着，把那块肉饼硬生生地塞进阿雅已经被割掉了舌头的嘴里，“那个该死的索拉娜不是抢了我们的粮仓，把我们的珍馐美味喂给你们这些贱民吗？她不是很慷慨吗？”\n“我们现在也很慷慨。”另一个贵族优雅地擦了擦嘴，眼里的恨意让人不寒而栗，“既然她拿我们的肉喂你，那为了公平……我们就拿你的肉，来喂回你自己。这叫……礼尚往来。”\n阿雅发不出声音，只能发出咕噜咕噜的吞咽声，眼泪混合着油脂和血水流满了那张原本清秀的小脸。她看到了我。在那一瞬间，她那双原本已经涣散的眼睛里，突然爆发出了一股回光返照般的、凄厉的光。\n她认出我了。\n那截肉红色的躯干开始在泥水里疯狂地蠕动，像一条被斩断的蚯蚓，拼命地、一点一点地向我这边蹭过来。她没有手可以伸向我，没有嘴可以喊我的名字，她只能用这种最卑微、最恐怖的方式，向她唯一的“朋友”，向那个承诺过会回来救她的“大姐姐”，发出无声的求救。\n“哟，这小东西看见熟人了？”那个贵族顺着阿雅的目光看到了站在阴影里、浑身僵硬的我。\n他并没有因为被撞破而感到羞愧，反而像是踩死一只虫子一样，漫不经心地拔出了腰间的佩剑。\n“太吵了，影响食欲。”\n寒光一闪。那颗就在刚才还在向我蠕动、还满含着希望看着我的头颅，像一颗烂熟的西瓜一样滚落到了我的脚边。那双眼睛还大大地睁着，定格在求救的最后一秒。\n贵族们爆发出一阵哄笑，仿佛刚刚只是踢开了一块绊脚石。\n我站在那里，手里还握着那把老爷赐给我的、用来“拯救穷人”的匕首。我看着阿雅的尸体，看着那些正在享用“美食”的贵族，看着……这地狱般的一幕。\n我的脑子里一片空白，只剩下……一种巨大的、令人作呕的荒诞感。\n这就是……我要守护的“恩人”？这就是……索拉娜要毁灭的“无辜者”？\n那我……算什么？"
PAM.22.a: "§R我……疯了？§!"

PAM.23.t: "餐后的余兴节目"
PAM.23.d: "“咣当！”\n索拉娜把一只空了的铁皮酒桶踢翻在地，巨大的声响让整个喧闹的广场瞬间安静下来。数万双刚刚还在贪婪地盯着残羹冷炙的眼睛，此刻都齐刷刷地看向高台。\n索拉娜手里拿着一把最普通的、用来分肉的铁叉。她走到高台边缘，当着所有人的面，在那粗糙的石栏杆上，“滋啦、滋啦”地磨了起来。火星飞溅，那声音刺耳得让人牙酸。\n“肉吃完了。”她大声喊道，声音里带着一股令人战栗的兴奋，“好不好吃？”\n“好吃——！！”下面的人群发出了雷鸣般的吼叫，那是野兽吃饱后的满足。\n“还想不想吃？”\n“想——！！”吼声更大了，这次带着贪婪。\n“那就别把手里的家伙放下！”索拉娜猛地举起那把被磨得寒光闪闪的铁叉，指着远方的地平线，“我的仓库空了！但我知道谁那里还有！那些住在玻璃房子里的人，那些住在树上的人，她们有的是肉，有的是酒！但她们不给！她们觉得那是她们的！”\n“屁！谁抢到就是谁的！”\n“现在，所有人，听我命令！把你们的碗摔了！把你们的勺子磨尖！既然吃饱了，就该干活了！去把她们的仓库变成我们的食堂！”\n人群沸腾了。原本用来吃饭的餐具，此刻变成了挥舞的凶器。那股冲天的杀气，让站在索拉娜身后的雪伊都皱起了眉头。\n“……她是个天生的煽动家。”晓枫看着下面那群如狼似虎的暴民，低声说道，“她把生存和掠夺画上了等号。这支军队……会很可怕。”\n“是啊。”雪伊抱着双臂，手指无意识地敲打着枪托，“不过，只要这把刀是砍向那些本来就该死的殖民者和怪物的……我不介意帮她把刀磨得更锋利一点。”\n小果子有些害怕地往晓枫身后缩了缩，但她的眼睛却亮晶晶的：“可是……晓枫姐，如果大家都去抢的话，那以后谁来种地呢？”\n晓枫愣了一下，随即苦笑：“这就是我们要教给她的下一课了。但现在……先让把她说的那些‘猪’都宰了吧。”"
PAM.23.a: "“磨刀！磨刀！磨刀！”"

PAM.24.t: "温柔的锁链"
PAM.24.d: "“把这一区的粮食配给减半。那里的老弱病残太多了，只会浪费资源。应该把省下来的肉给精锐部队……”\n那句话差点就顺着我的舌尖滑了出来。我猛地咬住嘴唇，血腥味在口腔里蔓延。我惊恐地看着自己的手——在恍惚中，那只粗糙、沾着油墨的手，似乎又变成了一只戴着精致白手套的、属于贵族的手。它正拿着羽毛笔，冷酷地在一群活人的名字上划着叉，就像在修剪花园里的杂草。\n“滚出去！从我的脑子里滚出去！”\n我发疯似地把桌子掀翻，文件漫天飞舞。那种高高在上的、令人作呕的“秩序感”又回来了。那颗夜莺之心在狂跳，它在嘲笑我的软弱，它在诱惑我成为一个完美的、没有感情的统治者。\n“索拉娜？”\n门被推开了。莉莉安娜站在那里。她不再是一尘不染的公主，她的裙摆上沾着泥点，手里还提着一个用来给孤儿院分发糖果的空篮子。她看着一片狼藉的房间，和缩在墙角瑟瑟发抖的我，眼神里满是痛惜。\n“莉莉……救救我。”我像个溺水的人抓住了她冰凉的手，把她的手按在我滚烫的胸口，“把它拿走！求你了！它想把我变成怪物！它想让我像那些贵族一样去吃人！我不想……我不想伤害那些孩子……”\n“拿走它吧！它是你的！只要把它还给你，你就完整了，我就能变回那个普通的烂泥……那样我就不会再有这些可怕的念头了！”\n我哭喊着，甚至试图用指甲去抓破胸膛，把那颗诅咒的根源挖出来。\n莉莉安娜的手颤抖了一下。她感受着那颗心脏的跳动——那是她的心，她比谁都熟悉。只要她想，她随时可以收回这股力量，重新变回那个完整的冥界之主。\n但她看到了索拉娜眼里的恐惧，那是对自己可能会伤害无辜的恐惧——这个曾经的“野种”，已经真的把那些穷人装进了心里。\n莉莉安娜缓缓抽回了手，她的眼神闪烁了一下，然后，用一种我从未听过的、带着一丝悲伤的坚定语气，撒了一个弥天大谎。\n“……我拿不走了，索拉娜。”\n“什么？”我愣住了。\n“它……嫌弃我了。”莉莉安娜低下头，看着自己沾着泥土的手指，声音轻柔却残忍，“它在你的身体里待了太久，它已经爱上了你那滚烫的血，爱上了你那喧嚣的生命力。它……已经变成了狼的心脏。”\n她抬起头，直视着我的眼睛：“如果我现在把它拿出来，它会因为受不了冥界的寒冷而立刻碎掉。那时候……我们两个，都会死。”\n“所以……你必须带着它。”她走上前，轻轻抱住了僵硬的我，“这是惩罚，也是唯一的路。你要用你那热乎乎的血去压制它的冰冷，你要用你那些粗鲁的骂声去盖过它的低语。”\n“别怕，索拉娜。如果它再想把你变成贵族……”莉莉安娜将头靠在我的肩膀上，在我耳边轻声说道，"
PAM.24.a: "§1“……我就在旁边，把你骂醒。好吗？”§!"

PAM.25.t: "晚安,我的勇士"
PAM.25.d: "“看啊！莉莉！快看！”\n索拉娜像个炫耀新玩具的孩子，拽着我的袖子，指着刚撤下来的“黑狼”部队。她满脸油彩，笑得肆无忌惮。\n“除了擦破皮的，一个都没死！那些炮弹全都砸在了前面的骨头架子上！我就说吧，只有死人才是最好的盾牌！”\n我看着那支队伍。确实，那些年轻的士兵们都还活着。但她们的脸上只有一种深深的、近乎崩溃的恐惧与茫然。她们浑身颤抖，紧紧缩在那些高大的、残缺不全的亡灵卫士身后，仿佛那些没有生命的怪物，成了她们唯一的依靠。\n一名年轻的士兵瘫坐在地上，她的面前是一具为了替她挡手雷而被炸得只剩半截身子的亡灵。那亡灵的半颗头颅还在机械地转动，试图寻找它的保护对象。士兵吓坏了，她在哭，想逃，却又因为某种愧疚而动弹不得。\n“真没出息！”索拉娜皱起眉，想要走过去踹她一脚，“那只是个工具！坏了再缝一个就是了！”\n“别动。”\n我拉住了索拉娜的手。她的手很烫，全是汗水和硝烟味；我的手很凉，但这并不妨碍我握紧她。\n我松开裙摆，缓缓走到那个士兵面前，跪在那具破碎的亡灵身旁。那股属于冥界的腐朽气息扑面而来，但这不再让我感到熟悉，因为我闻到了……夹杂在其中的、属于生者的热气。\n我伸出手，轻轻抚摸着那个亡灵破碎的颅骨。那原本只是一具没有灵魂的傀儡，但在这一刻，它完成了一个……比许多活人都要伟大的使命。\n“……辛苦了。”\n我轻声说道，指尖亮起柔和的月光。亡灵那躁动的残躯瞬间安静下来，眼眶里幽绿的魂火闪烁了两下，仿佛在向我行礼，然后化作一阵无声的尘埃，随风散去。\n士兵惊呆了，她看着我，又看着那堆尘埃。\n“它……它救了我。”士兵结结巴巴地说，眼泪冲刷着脸上的煤灰，“可我……我一直很怕它。”\n“没关系。”我从口袋里掏出一块干净的手帕，替她擦去脸上的污渍，就像在擦拭一朵沾了灰的花，“它不会怪你的。因为它存在的意义，就是为了让你能像现在这样……热乎乎地哭出来，热乎乎地活下去。”\n我站起身，环视着这支充满了怪诞与恐怖，却又无比鲜活的军队。\n索拉娜负责把它们缝合在一起，制造出最坚硬的铠甲。\n而我……\n我看向那个正别扭地把头转过去、假装不在意这边的索拉娜。\n……而我，负责在战斗结束后，拆掉那些不再需要的线，给死者以安息，给生者以拥抱。"
PAM.25.a: "§1“晚安，我的勇士。早安，我的孩子。”§!"

PAM.26.t: "像秃鹫一样"
PAM.26.d: "前线传来了令人作呕的报告。那些索拉娜的部队……她们根本不是在打仗，她们是在进货。她们像饥饿的秃鹫一样，在战斗结束后疯狂地搜刮战场。我们的战士不仅要面对死亡，死后还要遭受极大的羞辱——她们连阵亡者脚上的袜子都不放过！这种野蛮的行径简直是对人类底线的践踏！无论是为了尊严还是正义，我们都必须消灭这群强盗！"
PAM.26.a: "绝不能让她们得逞！"

PAM.27.t: "恶毒的诱惑"
PAM.27.d: "那个卑鄙的女巫！她正在用最原始、最下作的手段瓦解我们的意志。她居然在两军阵前摆开宴席，用食物诱惑我们意志不坚定的士兵倒戈。更可怕的是，她那套只有跟着我才有肉吃的强盗逻辑，竟然真的蛊惑了一些出身贫寒的叛徒！这是对我们崇高理想的亵渎！我们是为了未来而战，而她却想把人类拉回为了口腹之欲而互相残杀的野兽时代！"
PAM.27.a: "该死的索拉娜！"

PAM.28.t: "蝗虫过境"
PAM.28.d: "这不仅仅是占领，这是灭绝。索拉娜的军队正在有计划地拆除我们的工业区。她们粗暴地将机器从地基上扯下来，像搬运战利品一样运走。她们留下的，只有满目疮痍的废墟和被切断的生机。这种只顾自己取暖、哪管身后洪水滔天的行为，证明了她根本不配统治这片土地！我们必须夺回我们的家园，否则留给我们的只有荒原！"
PAM.28.a: "我们必将复仇！"

PAM.29.t: "笼中鸟的最后一击"
PAM.29.d: "窗外，数百万军队的咆哮声震天动地，那是狼群出征前的狂欢。我站在露台上，张开双臂，享受着这股由我亲手掀起的、即将吞没整个大陆的黑色浪潮。\n就在这最喧嚣的一刻，我的后颈突然感到了一阵甚至连亡灵都无法察觉的、极度的恶寒。连影子都来不及察觉。只有一把淬了毒的匕首，凭空出现在了离我咽喉不到一寸的地方。\n“死吧……大家都去死吧！！”\n那个女孩嘶吼着，声音里只有崩溃的哭腔。她想杀了我，哪怕同归于尽。\n“铛！”我的反应比脑子更快。夜莺之心猛地收缩，带动我的右手，一把抓住了那锋利的刀刃。鲜血顺着我的手掌流下来，滴在她那张惨白、绝望、还沾着泥点的小脸上。\n是个孩子？不，是个被折磨疯了的杀手。\n我猛地一发力，将她狠狠地掼在地上，靴子踩住了她握刀的手腕。“又是那些贵族派来的？”我俯视着她，嘲弄地笑着，“他们自己不敢来，就派一只小鸟来送死？他们许了你什么？金子？还是自由？”\n“他们是恶鬼……他们吃了阿雅……”女孩在我的靴子下挣扎，眼神涣散而疯狂，却紧盯着我，“你也是……你也是恶鬼！是你把世界变成这样的！如果没有你……如果没有你们……大家都不会死……我也不会……”\n她崩溃得大哭，那是一种信仰崩塌后，只想拉着整个世界陪葬的绝望。\n我愣了一下。吃了？阿雅？我看着她那双眼睛。那双眼睛里只有对这个吃人世界的彻骨恨意。那恨意太纯粹了，太漂亮了，像极了当年在泥坑里快要饿死的我。\n“……有意思。”\n我松开了脚，踢开了那把匕首。在她还没反应过来之前，我一把揪住她的衣领，把她像拎一只小鸡一样提了起来。\n“想死？没那么容易。”我看着她惊恐的眼睛，露出了一个贪婪的、想要占有某种珍宝的笑容，“那些贵族把你当刀用，用完就扔。但我不想让你死。”\n“这双眼睛太漂亮了，灭了可惜。”\n我无视了还在流血的手掌，用另一只手捏住她的下巴，强迫她看着我。\n“既然你觉得这个世界疯了，那就留下来，睁大眼睛看着我是怎么把那些把你变成这样的混蛋，一个一个嚼碎了咽下去的！”\n“来人！把她带到我的寝宫去！给她洗干净，换上最好的裙子，把门给我锁死！除了送饭，谁也不许放她出来！”\n“从今天起，你是我的了。没有我的允许，你连死都不许死！听到了吗，我的……小刺客？”"
PAM.29.a: "“又多了一位有趣的小崽子”"

PAM.30.t: "另一种心跳"
PAM.30.d: "她们被带到了我的面前。这群传说中守护世界的魔法少女，现在就像是一群被剪断了线的提线木偶。她们穿着脏兮兮的裙子，跪在我的地毯上，眼神空洞，既不求饶，也不哭泣。她们甚至没有看我一眼，只盯着手里那些已经变得浑浊不堪的、像煤渣一样的宝石。\n“真是一群废物。”\n我骂了一句，走上前去，粗暴地从那个领头的女孩手里，夺过了那枚灵魂宝石。她只是身体微微颤抖了一下，像是一具尸体最后的痉挛。\n我把那块冰冷的石头握在手心。就在那一瞬间，我的胸口——那颗属于莉莉安娜的、被我强行塞进身体里的夜莺之心，猛地跳动了一下。\n咚。\n一种熟悉得让我想要呕吐的感觉，顺着手臂传遍了全身。那是一种……正在被“吞噬”的感觉。\n我惊讶地看着手中的浑浊宝石，又按住自己滚烫的胸膛。我突然明白了。\n这根本不是什么魔法，也不是什么奇迹。\n这和我胸口的这东西，是一模一样的货色。\n夜莺之心贪婪地吞噬着我的生命力，为了维持那种死寂的永恒；而这块石头，贪婪地吞噬着这些女孩的灵魂，为了维持那种虚伪的希望。\n不管是神明还是魔鬼，它们都把我们当成了燃料。它们寄生在我们的身体里，把我们当成柴火，烧得噼啪作响，只为了让它们自己发光。\n“哈……哈哈哈哈！”\n我忍不住大笑起来，笑得眼泪都快出来了。我看着这些女孩，眼神里多了一种看着同类的、扭曲的亲切感。\n“别在那儿像个死了爹妈的丧家犬一样发抖了！”\n我把宝石扔回给那个女孩，然后一把揪住她的领子，把她拽到了我的面前，那是两张同样背负着诅咒的脸。\n“看清楚了！我和你们一样！我的胸口里也住着一个永远吃不饱的怪物，它也在每分每秒地啃着我的骨头！”\n“但我和你们不一样的是——我从来不觉得自己是在为了什么狗屁世界而燃烧。我是为了我自己！既然注定要当燃料，那我就要烧出一场最大的火，把这世上所有的好肉都烤熟了塞进嘴里！”\n我松开手，向着这群破碎的玩偶张开了双臂，身后的亡灵卫士和野火老兵同时发出了震耳欲聋的咆哮。\n“欢迎来到狼群，我的……小怪物们。”\n“既然你们的奇迹已经碎了，那就用你们剩下的诅咒，来帮我撕碎这片大陆吧。只要你们还能杀人，我就给你们肉吃。这比那个骗子许给你们的愿望……要实在一万倍！”"
PAM.30.a: "“毕竟……怪物最懂怪物。”"

PAM.31.t: "最后的肥肉"
PAM.31.d: "“陛下！您不能这样！是我们出钱帮您武装了军队！是我们帮您管理了那些占领区！我们是盟友！”\n王宫的大厅里乱成了一锅粥。那些曾经衣冠楚楚、在我的加冕礼上向我鞠躬的旧贵族们，此刻正挥舞着手里的佩剑和甚至来不及装填的火枪，像一群被逼入死角的肥猪一样尖叫着。他们的私人卫队正在城里放火，试图用混乱来保住他们最后的身家性命。窗外火光冲天，那是他们绝望的反扑。\n我坐在高处，手里端着一杯刚从他们酒窖里搜出来的陈年红酒，冷冷地看着这场闹剧。\n“盟友？”我嗤笑一声，声音不大，却让离我最近的那个公爵浑身一抖，“别逗了。当初我没杀你们，是因为我那时候还是一头刚下山的饿狼，我不懂怎么管家，也不懂怎么数钱。我借了你们的手，去把这片大陆打下来。”\n我站起身，走到台阶边缘，俯视着他们。\n“但现在，仗打完了。整个南美洲都是我的猎场。既然我已经学会了怎么用刀叉，那我还要你们这些只会偷吃、只会把油水往自己肚子里刮的中间商干什么？”\n“这是背叛！这是暴政！”一个伯爵夫人歇斯底里地吼道，“没有我们，谁来帮你压制那些贱民？！”\n“压制？”我像是听到了什么笑话，“为什么要压制？她们是我的孩子，是我的狼群。而你们……”\n我猛地摔碎了酒杯。猩红的酒液溅射开来，如同进攻的信号。\n“……你们，是这盘席面上，最后一道、也是最肥的一块肉。”\n我挥了挥手，身后沉重的大门轰然洞开。\n门外，是无数双在黑暗中闪烁着绿光的眼睛——那是我的士兵，我的贫民，那些早就对这群吸血鬼磨牙吮血的“贱民”。她们手里拿着滴血的弯刀和磨尖的铁管，喉咙里发出渴望的低吼。\n“去吧。”我指着那些正在发抖的贵族，露出了一个残忍而快意的笑容，“他们身上的丝绸，归你们。他们口袋里的金子，归你们。他们肉里的油水……也归你们。”\n“这顿饭，我请客。”"
PAM.31.a: "“吃饱点，别浪费。”"

PAM.32.t: "金丝雀的铁罐头"
PAM.32.d: "正午的太阳毒辣地烤着圣佩德罗庄园那扇象征着百年荣光的雕花铁门，空气里弥漫着一股令人窒息的焦糊味——那是乙炔喷枪烧红了铁条的味道，也是里面那些昂贵丝绸被冷汗浸透后发酵的味道。\n那些曾经只会用羽毛扇遮住半张脸、连看一眼穷人都觉得脏了眼睛的贵妇和少爷们，此刻正像发疯的母鸡一样扑在栏杆上，把她们脖子上价值连城的祖母绿项链、把她们手指上的红宝石戒指，像扔垃圾一样拼命往外扔。她们尖叫着承诺土地，承诺爵位，只求换一口新鲜的空气，换一个能钻出来的狗洞。\n“别扔了，那是我的钱，摔坏了你们赔不起。”\n我走过去，军靴踩碎了一串刚刚落地的珍珠项链，发出那种令人愉悦的、像骨头碎裂般的脆响。我只是示意满头大汗的工兵继续——加固，再加固。把每一丝缝隙都用滚烫的铁水填满，把这扇门焊成一堵墙。\n“求求您！陛下！里面太热了！没有冰块我们会死的！”里面的哭喊声带上了窒息的绝望。\n“很热吗？”我冷笑一声，那是从贫民窟的蒸笼里熬出来的笑容，“你们不是最喜欢封闭式管理吗？你们不是在庄园周围修了带电网的高墙，放了吃人的猎犬，防止我的穷亲戚们进去偷一眼你们的玫瑰花吗？现在，我成全你们。这墙，我帮你们砌得更高；这门，我帮你们锁得更死。”\n最后一根铁条被焊死。里面的尖叫声变成了沉闷的嗡嗡声，像是一口被盖上了盖子、正在沸腾的大锅。我知道里面会发生什么——当冰块化光了，当牛排臭了，当那些喷了香水的体面人开始为了最后一桶水互相撕咬的时候……那才是这出戏的高潮。\n我转过身，背对着那座华丽的坟墓，看着身后那些衣衫褴褛、眼神狂热的暴民，指了指身后。\n“听着，别让人进去，也别让人出来。就蹲在这儿听，听里面的动静。等什么时候里面彻底安静了……那就是肉炖烂了的时候。到时候，我们再进去，收金子。”"
PAM.32.a: "“慢慢享受吧，这是特别为你们准备的地狱。”"

PAM.33.t: "骨髓的味道"
PAM.33.d: "寝宫的窗户敞开着，但吹进来的是焚烧名贵木材的焦糊味，以及远处人群分抢土地契约时的狂欢声。那声音像海潮，一浪高过一浪，震得水晶吊灯都在颤抖。\n我（百灵鸟）缩在天鹅绒的软榻上，看着索拉娜大步走进来。她没脱军靴，靴底沾着不知是泥还是血的黑渍，在地毯上留下了一串脏兮兮的脚印。她的手里，甚至还抓着一根从宴席上带回来的、被敲断了的大骨头。\n“听见了吗？小刺客。”索拉娜把那根骨头随手扔在昂贵的梳妆台上，发出“咣”的一声巨响，震倒了几瓶香水，“那是骨头碎裂的声音。我把那些趴在这片土地上吸了几百年血的老爷们，全都敲碎了。”\n她走到我面前，带着一股浓烈的酒气和血腥气，粗鲁地捏住了我的下巴，强迫我看着她那双闪烁着妖异光芒的眼睛。\n“你以前的主人，那些教你杀人、把你当狗养的贵族……现在连渣都不剩了。他们的庄园变成了平地，他们的地窖被搬空了，他们引以为傲的姓氏被踩进了泥里。”\n她突然笑了起来，那笑容里带着一种野兽捕猎成功后的残忍满足。\n“你知道吗？他们其实很‘肥’。真的很肥。敲开那一层硬壳，里面的油水流得到处都是。我把这些油水，都分给了外面那些穷鬼。你猜怎么着？那些昨天还饿得想吃人肉的家伙，今天全都跪在地上喊我万岁。”\n我的胃里一阵翻腾，我想起了阿雅，想起了那块肉饼。我想吐，却又吐不出来。\n“别露出那种表情。”索拉娜似乎看穿了我的想法，她松开手，从那根大骨头里，用手指挖出了一点滑腻的骨髓，举到我面前，“这就是这个世界的道理。狼吃羊，羊吃草。以前他们吃人，是因为他们觉得那是天经地义。现在我吃他们，也是天经地义。”\n她把那点骨髓抹在了我苍白的嘴唇上，那味道咸腥、油腻，却又……带着一股令人作呕的香气。\n“尝尝吧，我的小刺客。这就是你曾经想要守护的东西，这就是那些高贵者的本质。”\n她俯下身，在我耳边低语，声音像恶魔的诱惑：\n“……只不过是一堆，如果不敲碎了吃掉，就会烂在肚子里的……肥油罢了。”"
PAM.33.a: "（令人作呕，却又极其真实。）"

PAM.34.t: "一张肉饼的价钱"
PAM.34.d: "“……阿雅。”\n我（百灵）缩在角落里，终于在索拉娜那咄咄逼人的注视下，吐出了那个名字，和那段我不愿回想的噩梦，“他们把她……做成了肉饼。还逼着她自己吃……就因为你抢了他们的粮仓，他们就吃你的子民泄愤。”\n空气突然安静了。索拉娜手里那杯还没喝完的酒，“咔嚓”一声，被她单手捏了个粉碎。鲜红的酒液顺着她的指缝流下来，像极了那天阿雅流下的血。\n“肉饼？”索拉娜的声音很轻，却让我浑身汗毛倒竖。她站起身，粗鲁地抓起一块桌布擦了擦手，然后一把拽住我的手腕，力气大得像要把我骨头捏碎。\n“跟我走。别闭眼，敢闭眼我就把你眼皮割下来。”\n她拖着我，像拖着一只布娃娃，一路踢开了地牢的大门。那里，正关着那几个被抓回来的、脑满肠肥的贵族。\n他们被绑在柱子上，还在那儿叫嚣着什么“贵族法庭”、“赎金”。索拉娜走过去，二话不说，抡圆了巴掌，“啪”的一声，把领头那个胖子的牙都抽飞了两颗。\n“闭嘴！老子不识字，看不懂你们那什么狗屁法律！”索拉娜踩在那个胖子的肚子上，指着我，那是她第一次叫出我的名字，“百灵！告诉这帮肥猪，他们吃了什么！”\n我颤抖着说出了那个真相。\n“听见了吗？”索拉娜俯下身，眼神像看死肉一样看着他们，“你们吃了我的人。那是我的劳力！是能给我种地、能给我扛枪的好苗子！你们居然把她剁了？还做成饼？”\n“你们这群只会拉屎的造粪机器，有什么资格吃我的狼崽子？！”\n她猛地直起身，对着身后的卫兵挥了挥手。几个端着巨大铁桶的士兵走了进来，桶里装的是……从那个肮脏的巷子里搜集来的、混着泥沙和排泄物的泔水。\n“你们不是饿吗？不是喜欢吃特别的东西吗？”\n索拉娜抓起一把生锈的铁勺，那是她刚发给士兵们的武器，狠狠地铲了一勺泔水，硬生生地塞进了那个贵族的嘴里，怼得他满嘴是血。\n“吃！给我吃下去！这才是你们该吃的东西！谁敢吐出来，我就把他剁碎了喂我的亡灵！”\n她一边逼着他们吞咽，一边转过头，看着瑟瑟发抖的我。她的脸上沾着秽物，表情狰狞，却在看向我的一瞬间，流露出一种……笨拙的、甚至是有些粗鲁的安慰。\n“看清楚了，百灵。这就是我的规矩。”\n她指着那些像蛆虫一样在地上蠕动的贵族，大声说道：\n“在我的地盘上，没有谁比谁高贵。但这帮不干活的肥猪，敢动干活的穷人，那就是在割我的肉！我这人算术不好，但我知道一笔账——”\n“——他们吃了一个阿雅，我就要让他们全家用命来赔！这笔买卖，我绝不亏本！”"
PAM.34.a: "（她是个疯子……也是个……王。）"

PAM.35.t: "一份作业"
PAM.35.d: "“咔嚓。”\n我已经数不清被我捏断的笔有多少支了。墨水溅在了洁白的纸上，像一团炸开的黑色血花。\n“该死的！这玩意儿比那个大公爵的脖子还难扭！”我（索拉娜）气急败坏地把断笔扔到一边，用沾满墨水的手背擦了擦额头上的汗。我宁愿去手撕一头熊，也不想再对着这些像蚯蚓一样扭来扭去的符号发呆了。\n“力气大没用。写字靠的是腕力，不是蛮力。”\n一直站在桌边、抱着双臂的晓枫叹了口气。她走过来，那双总是深邃如海、仿佛看透了一切战略局势的眼睛，此刻正无奈地看着我。她伸出手，一把抓住了我的手腕，强行纠正了我那像握匕首一样的姿势。\n“放松。”晓枫的声音很冷，像个严厉的老师，但她的手指却是温热的，“你是个女王，索拉娜。别像个杀猪的一样抓着笔。手腕放平，呼吸……对，就像你瞄准猎物时那样，要稳。”\n房间的另一头，靠在窗边的雪伊发出了一声嗤笑，嘴里叼着一根牙签：“堂堂狼王，杀人的时候眼睛都不眨，写个名字却像是在受刑。这要是传出去，怕是连亡灵都要笑活过来了。”\n“闭嘴，雪伊！”我瞪了她一眼，“有本事你来！”\n“我才不来，我有晓枫。”雪伊耸耸肩，眼神里却全是戏谑的笑意。\n坐在我身边的莉莉安娜，正拿着手帕，温柔地替我擦去脸颊上不小心蹭到的墨水。她看着晓枫正握着我的手，一笔一划地教导着我，眼中的笑意更深了。\n晓枫并没有理会雪伊的调侃。她只是低着头，看着我和她交叠在一起的手——一只粗糙、野蛮、布满了细小的伤痕；另一只修长、有力、有着常年握笔留下的薄茧。"
PAM.35.a: "……"

PAM.36.t: "一份作业"
PAM.36.d: "“真奇怪，不是吗？”晓枫突然轻声说道，声音里带着一种历史的厚重感，“我们……本该是死敌的。”\n“我是红色的火焰，是为了推翻一切压迫、为了建立一个理性的新世界而燃烧；你是黑色的狼群，是为了吞噬一切、为了最原始的生存欲望而存在。按理说，我们应该在战场上同归于尽，用血把对方淹没。”\n“可是现在……”晓枫抬起头，直视着我的眼睛，“我却握着你的手，教一个暴君如何书写。”\n“因为她做到了，晓枫姐。”正在帮我研磨墨水的小果子插嘴道，眼睛亮晶晶的，“虽然手段很吓人……但是，大家真的吃饱了。那些以前我们救不了的孩子，现在都被她像护崽子一样护在身后。”\n晓枫沉默了片刻，眼神里那种名为教条的坚冰碎裂了，露出了一种更本质的、唯物主义的通透。\n“是啊。”她松开了我的手，看着纸上那个虽然歪歪扭扭、但终于成型的字，“因为你这个文盲，用最野蛮的方式，解开了那个死结。你没有试图去修补那座腐朽的房子，你直接把它拆了，用废墟给穷人搭了个窝。虽然丑了点，虽然脏了点……但那是个窝。”\n“这就是我留下的原因。”晓枫退后一步，像看着一个终于及格的学生，“我不是为了效忠你。我是为了给这群吃饱了饭的狼，装上一个脑子。既然你负责把旧世界砸碎，那总得有人……教你怎么把新世界写下来。”\n我看着纸上那两个终于写完整的名字——那是我们这里的语言，字迹虽然丑陋，却力透纸背。\n索拉娜\n莉莉安娜\n我看着这两个名字，然后抬起头，看着这一屋子曾经想杀我、现在却帮我磨墨、教我写字的人。\n“少废话。”我把那张纸举起来，像举着一面旗帜，嘴角勾起一抹得意的、依然带着匪气的笑，“不管你们是为了什么，反正现在……你们都上了我的贼船了。”\n“而且……”我看向莉莉安娜，她正对着我温柔地笑，“……我觉得，这船开得还挺稳。”"
PAM.36.a: "“这才是我的狼群。”"

PAM.37.t: "亡者的酣眠"
PAM.37.d: "深夜的寝宫里，只有壁炉里的余烬偶尔发出噼啪的爆裂声。\n我（莉莉安娜）坐在床边，静静地看着那个把自己裹在丝绸被子里、睡得像只小狗一样的索拉娜。她的睡相很差，甚至还微微打着呼噜，嘴角流着口水，眉头紧锁，像是在梦里还在和谁抢一块肉骨头。\n真奇怪啊。\n在我们的国度——那个永恒的夜莺之国里，是没有睡眠这个概念的。死人不需要休息，灵魂不会感到疲惫。我们只是静止的，永恒的。\n按理说，作为早就在贫民窟的烂泥里咽了气的亡魂，索拉娜应该和我一样，哪怕睁着眼睛过上一万年，也不会感到一丝困意。\n可是，她却睡得这么沉，这么……像个活人。\n我伸出手，指尖轻轻穿过她散乱的金发，按在了她的胸口。那里，那颗本属于我的心脏，正在有力地、甚至有些亢奋地搏动着。隔着皮肤，我能感觉到它传来的温度。\n“……是你搞的鬼，对吧？”\n我对着那颗心，轻声低语。\n它在回应我。它在向我传递着一种名为疲惫和满足的信号。我明白了。这颗心……它在冥界寂寞了太久，它太渴望“活着”了。\n所以，它强迫这具早已死去的躯壳感到饥饿，是为了享受吞咽的快感；它强迫这具躯壳感到寒冷，是为了享受拥抱的温暖；它强迫索拉娜感到精疲力竭，是为了……享受这一刻，沉入甜蜜之乡的安宁。\n索拉娜以为是她在活着，其实……是这颗心，在借着她的身体，做着一场最奢侈的梦。\n“……嗯……”\n睡梦中的索拉娜翻了个身，一把抓住了我放在她胸口的手，无意识地蹭了蹭，嘴里嘟囔着：“……莉莉……别闹……明天……再去抢……”\n看着她这副毫无防备的模样，我心中的酸楚和爱意同时泛滥成灾。\n她是个被心脏欺骗的傻瓜，是一个拼命扮演活人的亡灵。\n但正因为如此，她才如此可爱。\n我任由她抓着，像个守夜人一样，守着这具其实并不需要睡眠的躯体。\n“睡吧，我的狼王。”\n我俯下身，在她那没有呼吸、却依然温暖的额头上，落下了一个冰凉的吻。\n“只要这颗心还在跳……我就陪你，把这个‘活人’的梦，一直做下去。”"
PAM.37.a: "（只有死人，才会如此贪恋梦境。）"

PAM.38.t: "血色邀请函"
PAM.38.d: "外交部刚刚收到了一份……如果不说是宣战书，那就只能被称为侮辱的包裹。它是由一名衣衫不整、眼神凶狠的信使直接扔在政府门口的。\n包裹里只有一张用粗糙的牛皮纸包着的、甚至还渗着油脂的信。信纸皱皱巴巴，上面沾满了暗红色的指印和不知名的酱汁，散发着一股令人作呕的、混合了烤肉香料与陈旧血腥的气味。\n上面的字迹大得惊人，每一笔都像是用刀刻上去的，歪歪扭扭，毫无章法。翻译官在解读这些文字时，声音都在颤抖：\n“喂！北边的头狼！\n我在南边闻到了你们那股子味儿。那是饿肚子的味儿，是想吃肉的味儿。别装了，不管你们嘴里念的是什么经，举的是什么旗，我们都是一路货色——都是没吃饱的畜生。\n现在，南边的盘子归我了，但我一个人吃不完。\n我给你们个机会。把脖子低下来，叫我一声大姐。我就把桌子挪过去一点，分你们两根骨头，甚至带你们去抢海对岸的肥肉。\n想好了就派人来拿勺子。\n要是敢说个‘不’字……哼，那就把锅洗干净，自己跳进去。因为在我的食谱里，如果不当食客，那就只能当食材！”\n信的末尾只有一个用沾满红酒的大拇指，狠狠按下的指印。"
PAM.38.a: "她说话虽然难听……但肉是香的。"
PAM.38.b: "这简直是文明世界的奇耻大辱！"

PAM.39.t: "淌着油的红利"
PAM.39.d: "码头的吃水线被压到了极限，吊臂发出不堪重负的呻吟。数十艘挂着黑狼旗帜的巨轮，像一群吃撑了的巨兽，正将它们肚子里的货物——成吨的粮食、整箱的黄金、以及从旧帝国军火库里拖出来的重炮——像倾倒垃圾一样，哗啦啦地堆满了盟友的港口。\n负责接收的盟国特使看得目瞪口呆。她拿着那份原本只敢奢望“获得一点残羹冷炙”的协议书，手在微微发抖。这比协议上承诺的，多了好几倍。\n“发什么愣？嫌少？”\n索拉娜坐在最高的那个货箱顶上，靴子随意地晃荡着。她手里拿着一只咬了一半的苹果，嘴角还带着那种标志性的、嘲弄的笑意，看着底下那群没见过世面的外交官。\n“看看你们那副样子。以前那些所谓的文明人，是不是总让你们签一堆字，最后只给你们扔几根不带肉的骨头？还要你们感恩戴德？”\n她嗤笑一声，把果核随手弹飞，正好落在一个正在搬运物资的、瘦骨嶙峋的盟国士兵怀里。那个士兵吓了一坏，却发现果核后面，跟着抛过来的一袋沉甸甸的金币。\n“拿着！去买肉吃！把自己养壮点！”索拉娜冲那个士兵吼道，然后转头看向特使，眼神锐利如刀，“记住了，我的规矩和那些穿西装的骗子不一样。在狼群里，头狼吃肉，跟着跑的兄弟就绝不会喝汤。”\n她站起身，张开双臂，身后是堆积如山的财富，那是她从全世界掠夺来的战利品，此刻正毫不吝啬地分流向她的盟友。\n“别用那种怀疑的眼神看着我。我不要你们的感谢，也不要你们的膝盖。把这些东西拿回去，把你们的兵喂饱，把你们的枪擦亮。因为下一场狩猎会更疯狂，猎物会更凶猛。”\n索拉娜跳下货箱，拍了拍特使僵硬的肩膀，留下一个沾着油污的手印。\n“这只是开胃菜。只要你们的牙齿够锋利，只要你们敢跟着我继续咬下去……这片大海，这块大陆，甚至天上的星星……早晚都是我们盘子里的菜。”"
PAM.39.a: "“这笔买卖不错”"

PAM.40.t: "刀锋的归宿"
PAM.40.d: "“哈！信送出去了。真想看看北边那群狼崽子收到信时的表情。”\n我把羽毛笔往桌上一扔，心情是从未有过的舒畅。最近，胸口那颗总是吵闹的心脏出奇地安静，莉莉的安抚就像一首摇篮曲，让那个贪婪的怪物沉沉睡去。我甚至觉得，我也许真的能驾驭它，也许我真的能……做一个正常的王。\n就在这时，一个负责打扫的侍女不小心碰翻了墨水瓶。黑色的墨汁泼在了我刚写好的那张狼皮地图上。\n侍女吓得跪在地上，浑身发抖。\n就在那一瞬间，我的心猛地跳了一下。眼神里流露出一种……冰冷的、高高在上的、如同看着一只臭虫般的厌恶。\n“真脏。”一个念头无比自然地滑进我的脑海，带着一种优雅的残忍，“这种笨手笨脚的下等人，活着也是浪费空气。应该把她的皮剥下来，做成新的地毯，或许还能把那块墨渍盖住……”\n我的手不受控制地抬起，想要去拔腰间的配枪。那种感觉是如此顺滑，如此理所当然，就像那些贵族老爷踩死一只蚂蚁一样。\n“——不对！！！”\n我猛地反应过来，狠狠地咬破了自己的舌尖。剧痛和满嘴的血腥味让我瞬间清醒。我抓起那个墨水瓶，狠狠砸向墙壁。\n“滚！都给我滚出去！”\n侍女哭喊着跑了。房间里只剩下粗重的喘息声。\n我按着胸口。它还在跳，带着一种戏谑的、恶毒的嘲笑。它在告诉我：你以为你变好了？不，你只是还没变成最坏的样子。\n“……百灵。”\n我对着空荡荡的角落喊了一声。\n那个娇小的身影从阴影里走了出来。她穿着我给她挑的裙子，手里却依然习惯性地反握着那把匕首。她的眼神很冷，但只有看着我的时候，才有一丝温度。\n“过来。”\n我把她拉到面前，抓着她握刀的手，把那冰冷的刀锋，抵在了我正在疯狂跳动的颈动脉上。\n“听着，小鸟。你不是一直想杀我吗？你不是觉得我是个会吃人的怪物吗？”\n我看着她的眼睛，声音沙哑，却无比认真。\n“我也许……真的会变成那样。变成一个穿着丝绸、喝着人血、却觉得理所当然的……贵族杂种。”\n“莉莉她太心软了，她下不了手。晓枫太理智了，她会顾虑大局。只有你……只有你这双眼睛，看得最清楚。”\n我感觉到刀锋割破了一点皮肤，刺痛感让我觉得清醒。\n“如果哪天……你发现我又用那种看垃圾的眼神看你们，发现我开始为了取乐而不是为了生存去杀人……”\n“别犹豫。把这把刀送进去。”\n“这是命令。也是……我给你这个刺客，最后的特权。”"
PAM.40.a: "“……我会盯着你的。”"

PAM.41.t: "乞丐的“皮”"
PAM.41.d: "“这是什么？这他妈的是什么？！”\n新落成的公共大澡堂里，水蒸气弥漫。我（索拉娜）一脚踹翻了更衣室的长凳，指着那一堆散发着酸臭味、补丁摞补丁的破烂布条，冲着那一屋子光着膀子的工人们咆哮。\n“我没给你们发新衣服吗？啊？！那套黑棉布的制服呢？那双厚底的靴子呢？我花了那么多钱，让纺织厂日夜不停地赶工，就是为了让你们把那些好东西藏在床底下发霉，然后继续披着这些死人穿过的裹尸布招摇过市？！”\n工人们吓得跪倒在湿漉漉的地板上，一个个缩着脖子，像一群犯了错的鹌鹑。\n“陛下……陛下息怒。”一个瘦骨嶙峋的老矿工哆哆嗦嗦地爬过来，抱着那件我不屑一顾的破背心，“那是……那是好衣服啊。那么厚实，那么暖和……那是过节才能穿的，是……是我们准备留着当寿衣穿的。”\n他抬起头，浑浊的眼睛里满是惶恐和不舍。\n“活儿脏，矿里石头尖。要是把那些陛下赏的新衣服磨破了……我们心疼啊。这件旧的虽然破，但是……但是如果哪天好日子过到了头，如果您不要我们了……我们总还得有件蔽体的东西，能缩回阴沟里去……”\n我愣住了。那只举起来想打人的手，僵在了半空。\n我看着他们。他们洗干净了身上的泥，却洗不掉骨子里的怕。他们不敢穿新衣，因为他们打心底里不相信自己配得上这份体面。他们小心翼翼地保留着这些乞丐的“皮”，随时准备着被打回原形。\n一股无名火混合着一种说不清的酸涩，堵在我的喉咙里。\n“放屁！谁说好日子有头？！”\n我猛地抢过老头手里的破背心，转身把它扔进了烧得通红的锅炉里。火焰“轰”地一声窜起，瞬间吞噬了那块破布。\n“都给我听着！把这些破烂全给我烧了！一件不留！”\n我指着那堆旧衣服，对着那群目瞪口呆的人大吼，声音却有些发颤。\n“穿坏了，我再发！磨破了，我再给！我的仓库里堆成了山，我的工厂还在转！只要我索拉娜还活着一天，就不许你们再给自己留后路！不许你们再想着变回真正的乞丐！”\n“把新衣服给我穿上！现在！立刻！谁敢再让我看见他穿得像个叫花子，我就扒了他的皮！！”"
PAM.41.a: "（烧了它们！烧断那条回头的路！）"

PAM.42.t: "梦境的血痕"
PAM.42.d: "“把脚拿开！！”\n我又回到了那个满是烂泥的后巷。那个穿着丝绸靴子的贵族正踩着我的手，用力碾磨。就在他像以前一样准备把垃圾倒在我头上时，这一次，我没哭。\n我在泥水里摸到了一块锋利的铁片。猛地暴起，像一头被逼急的幼狼，狠狠地将铁片扎进了他的脚踝！\n“去死吧！你们这些吃人的肥猪！”那一刀的手感无比真实，温热的液体喷了我一脸。我狂笑着，想要把刀送进他的喉咙，想要把这几十年的屈辱都通过这把刀宣泄出去……\n“……索拉娜！松手！”\n一声厉喝伴随着手腕上剧烈的痛感，像一盆冰水，猛地浇熄了那层血色的梦境。\n我猛地睁开眼，大口喘着不需要的粗气。这里是前线指挥部。晓枫正牢牢扣住我的手腕，眉头紧锁；雪伊已经拔出了配枪警戒四周；而那个叫小果子的孩子正惊恐地捂着嘴。\n我的手里抓着那把用来削苹果的匕首。而刀锋下……是一个负责给我送水的、只有十几岁的小勤务兵的手臂。\n鲜血顺着她细瘦的胳膊流下来，滴在作战地图上，正好染红了圣杯王国殖民地的一块版图。她疼得浑身发抖，眼泪在眼眶里打转，却不敢躲，像是在看一头随时会吃掉她的怪兽。\n心脏在胸腔里剧烈地撞击着，发出沉闷的回响。这声音……太吵了。\n该死的……这颗心又在逼着我做梦，逼着我发疯。它想吞噬我的理智，想让我变成只知杀戮的野兽。\n“……别动。”\n我强行切断了脑海里那些乱七八糟的杂音，甚至没空理会晓枫她们复杂的眼神。我扔掉匕首，一把抓过那个孩子的手臂。她吓得缩了一下，但我没松手，反而抓得更紧了些。\n我从脖子上扯下那条昂贵的丝绸领巾。用牙齿“嘶啦”一声撕开它，动作粗鲁却熟练地帮她按住伤口止血。\n“你是傻子吗？看见我发疯不知道跑？”我一边缠着绷带，一边忍不住骂道，声音却有些沙哑，“下次再看见我睡觉，就躲远点！哪怕我是女王，那一刻我也是只不认人的疯狗！你的命是留着以后过好日子的，不是送给我梦游的！”\n包扎好了。那个孩子呆呆地看着手上的丝绸，又看了看我，似乎不敢相信这个刚刚还要杀她的女王正在给她包扎。\n“看什么看？雪伊！带她下去！找军医用最好的药！再给她发双倍的军饷压惊！”\n雪伊愣了一下，随即收起枪，走过来扶起那个孩子，经过我身边时，她深深地看了我一眼，低声说：“……你最好控制住你自己。”\n帐篷里安静了下来。晓枫松开了我的手腕，看着地图上那滩还没干的血迹，那是我的子民的血。\n“我没事。”我擦了擦额头并不存在的冷汗，指着地图上那块被血染红的区域，眼神重新变得凶狠。\n“既然血已经流了，就别浪费。”"
PAM.42.a: "“传令，就从这里……开始进攻。”"

PAM.43.t: "永恒的饱腹感"
PAM.43.d: "广场上横七竖八地躺满了熟睡的人。工人的呼噜声，妇女怀里婴儿的咂嘴声，还有那些妖怪们满足的梦呓，汇成了一片名为幸福的潮汐。空气里滞留着烤肉的油脂香和麦酒的醇厚，这是世间最安稳的味道。\n我（索拉娜）趴在露台上，贪婪地注视着这盛大的一幕。我赢了整个世界，我填满了她们所有的胃袋。此时此刻，圆满至极。\n“咕咚。”\n胸口那颗沉寂已久的心脏，在这个最完美的瞬间，发出了一声湿滑、冰冷且愉悦的搏动。它在渴望，它在赞叹，它在向我展示一个无可回避的真理。\n明天太阳升起，食物会消化殆尽。后天粮仓见底，恐慌会再次蔓延。这片大陆的麦子会枯萎，这片海洋的鱼群会游走。虽然我是不朽的，但这些活着的人，她们会衰老，会腐烂，会再次跌入那个名为饥饿的无底深渊。\n那种胃壁摩擦的剧痛，那种吞炭火般的绝望，一定会卷土重来。这是活着的诅咒，是注定的轮回。\n“把它留住。”\n心脏在狂喜中给了我唯一的答案——\n只要停止消化，饱腹感就会永存。只要停止呼吸，生命就不会流逝。只要把这一刻的时间彻底冻结，她们脸上的笑容，就是永恒。\n这就是……极致的仁慈。这就是……莉莉安娜那个世界的真谛。\n“……陛下？”\n身后传来一声轻唤。百灵拿着一件披风走了过来。她看着我，本能地退了一步，手按在了腰间的匕首上。她是一只敏锐的鸟，她嗅到了那股从我骨髓里渗出来的、属于冥府的死寂。\n我缓缓转过身。动作僵硬、优雅、精准得像一具设定好的精美人偶。我的双眼只有对标本的欣赏。\n“小鸟。”\n我开口了，声音重叠着无数亡灵的混响，空洞而神圣。\n“你看，她们睡得多香。吵醒她们，太残忍了。”\n我向她伸出手，指尖散发着让空气凝霜的寒气。我想把她也变成这幅画里的一部分，一个永远不会再感到恐惧、永远不会再拔刀的、完美的侍女。\n“我要把这个世界……腌制起来。”\n百灵的瞳孔剧震，她猛地拔出那把淬毒的匕首——那是我们约定的信号，是我给她用来杀死怪物的特权。刀锋划破空气，直刺我的心脏。\n但我只是温柔地、不可抗拒地捏住了那锋利的刀刃。在那股绝对的冰寒之下，钢铁寸寸崩裂，化为齑粉。\n“嘘……”\n我竖起食指，抵在她颤抖的嘴唇上，享受着这具躯壳即将归于永恒寂静前的最后一次战栗。\n“别动刀。流了血，就会饿。”\n“就这样……陪我们一起，守着这顿最后的晚餐……直到永远。”"
PAM.43.a: "§R“直至永恒。”§!"

PAM.44.t: "待囚笼破碎之时"
PAM.44.d: "“……直至永恒。”\n那个声音在我嘴里回荡，甜美得像是在棺材里铺满了蜂蜜。我的眼前浮现出了那个完美世界的样子：带着面具微笑的顺民、监视一切的影子、用黄金打造的永恒镣铐……多么安静，多么秩序井然，多么……\n\n§R“——令人作呕！！！”§!\n\n一声咆哮，来自我灵魂深处那个被压在最底下的、肮脏的野种。\n咔嚓！\n现实的裂帛声撕碎了幻境。百灵惊恐地看着我，她手里的匕首已经被我单手捏成了齑粉。铁屑刺破了我的手掌，鲜血滴落，那是滚烫的、腥咸的、血。\n“痛吗？”我看着自己的手，反问着自己，眼里的幽紫光芒正在剧烈震颤，红色的瞳孔在疯狂地夺回控制权，“痛就对了！如果不痛，那是死人！如果不饿，那是石头！”\n“什么永恒的饱腹感……去你妈的！”我对着空气，对着那个正在试图重新接管我身体的夜莺之心嘶吼，“你想把我的世界变成标本？你想把我的狼群变成你的玩偶？你以为给我看那些金链子和面具，我就会感激你？”\n“我是狼！狼是会饿死的，是会受伤的，是会在泥地里打滚的！但我绝不会……变成被你关在笼子里的看门狗！！”\n我松开百灵的手，在她还没反应过来之前，做出了一个让她永生难忘的动作。\n我抬起右手，把五指成爪，指甲在月光下闪着寒光，然后——\n噗嗤！\n狠狠地、没有任何犹豫地，插进了我自己的胸膛！\n穿透皮肉，折断肋骨，直抵那颗正在惊恐尖叫的、冰冷的“心脏”。"
PAM.44.a: "……"
PAM.45.t: "待囚笼破碎之时"
PAM.45.d: "“啊啊啊啊——！！！”\n剧痛让我几乎昏厥，但我却在笑。我感觉到了，那颗心在颤抖，它在害怕我，它在害怕这个疯子！\n“我不许你……碰我的莉莉！更不许你……碰我的世界！既然是你选了我这个容器……那你就该知道，狼这种东西，逼急了……是连自己都敢吃的！”\n“给我……滚出来！！！”\n伴随着一声撕裂灵魂的怒吼，我猛地向外一扯！\n那一瞬间，时间仿佛静止了。一道耀眼到致盲的幽蓝光芒从我胸口爆发，随后是仿佛玻璃破碎般的脆响。那个笼罩在广场上的永恒静止的法术，碎了。\n喧嚣声回来了。\n呼噜声、风声、远处海浪的声音、甚至是一只野狗的吠叫声，全都回来了。那是我最爱的、乱糟糟的、充满了生命力的人间。\n我踉跄着倒在地上，胸口是一个巨大的、正在喷涌着鲜血的空洞。在我手里的，是一颗还在散发着柔和光芒的，血淋淋的心脏。\n它终于安静了。\n“咳咳……”我吐出一口血沫，视线开始模糊。我把那颗心，递到了早已吓傻了的百灵面前。\n“拿去……”我笑着，虽然现在我连笑的力气都没了，“这玩意儿……太冷了。我不稀罕。”\n“把它……还给莉莉。告诉那个笨蛋……我把她的家……打扫干净了。”\n“还有……告诉她……”\n我的眼皮越来越沉，身体越来越冷，但这却是我这一生中，睡得最踏实，最真实的一次。\n“……我还是觉得……哪怕会饿死……还是……做个人……比较好……”"
PAM.45.a: "（狼王……倒下了。）"

PAM.46.t: "一步之遥"
PAM.46.d: "冰冷的潮水淹没了我的头顶，意识在急速下坠。就在这窒息的尽头，一股滚烫的、带着泪水咸味的气息，强硬地闯进了我的肺叶。\n“咚、咚。”\n耳边传来了心跳声。那是一阵轻柔、坚定、属于莉莉安娜的律动。那颗沾满鲜血的夜莺之心，此刻正温顺地融化在她的胸口。它回家了，它在欢呼，它将那股磅礴的生命力，顺着莉莉安娜紧贴着我的肌肤，源源不断地灌入我这具空荡荡的躯壳。\n“……抓到你了。”\n她紧紧抱着我，额头抵着我的额头，鼻尖蹭着我的鼻尖。她的声音软糯，带着浓重的哭腔，却透着一股前所未有的执拗。她的小手拉着我的衣领不放，仿佛要把我勒进她的骨血里。\n“索拉娜，你这个大笨蛋。你这个……骄傲的傻瓜。”\n眼泪吧嗒吧嗒地掉在我的脸上，烫得我浑身颤栗。\n“我知道……我都知道的。你把它挖出来，是因为你怕它。你怕它把你变成那种高高在上的怪物，你怕它让你忘了怎么去爱那些泥里的人。你宁愿死，也要守住那个……会疼、会饿、会流血的自己。”\n“你做得对。你是最好的狼王,可是……”\n“……可是，我却要亲手毁了这一切。”\n她的手抚摸着我的脸颊，眼神里充满了愧疚，仿佛她才是那个做错了事的罪人。\n“这颗心归我了。它的力量只有这么大，我的手也只有这么长。这份维持你呼吸的光，只能照亮我身边这一步的距离。只要超出这一步，风就会把你吹散。”\n“索拉娜，你听懂了吗？这意味着……你再也不能去那些我看不见的地方撒野了。你再也不能像风一样，跑遍这片大陆了。你必须待在我的视线里，被我这个……沉闷的、无趣的影子，永远地拴住。”\n“我以前骗你，说拿不走它，是想让你自由，是想让你飞。可现在……为了让你活着，我却不得不……亲手给你套上这个世上最沉重的项圈。”\n她哭得浑身颤抖，声音哽咽得几乎说不出话来。\n“对不起……真的对不起……我把你变成了笼中鸟……我把你困在了这小小的一步之内……你会恨我的，对不对？你会觉得闷，会觉得无聊的，对不对？”\n看着她那副比死还要难过的样子，我的心，突然软得一塌糊涂。\n这个傻瓜。她以为我要的是那个广阔的世界吗？\n我笑了。那是一种……终于找到了归宿的、疲惫而满足的笑。我费力地抬起手，擦去她脸上的泪水，蹭了蹭她温暖的掌心。\n“……一步吗？”\n“嗯……”她哭着点头，把头埋进我的颈窝，眼泪打湿了我的衣领，“……世界变得好小……好小……”\n“傻瓜。”我轻声叹息，闭上了眼睛，感受着那股将我们连在一起的温度。\n“……只要我们挤在一起……这一步，就足够装下我们所有的故事了。”\n“……那么，别哭了……带我回家吧。”"
PAM.46.a: "§1“只要你在，哪里……都是家。”§!"

PAM_47.t:"头狼的呼唤"
PAM_47.d:"这段信号以最高的功率，粗暴地撞进了全世界的广播频道。\n那个女人的声音，伴随着电流的杂音和背景里成千上万军队的磨刀声，回荡在全世界。\n“喂！那些还长着牙齿的家伙们，都给我听好了！”\n“我是索拉娜。你们可能叫我暴君，叫我疯子。无所谓。\n我看过你们的旗帜了。有的画着黑色的钩十字，有的画着金色的镰刀锤子。你们互相看不顺眼，打得头破血流。\n但在我眼里，你们都是一路货色——你们都是没吃饱的狼。”\n“你们想推翻旧世界？想建立新秩序？\n别说那些好听的废话了。承认吧，你们和我一样，只是闻到了那些老牌帝国身上腐烂的肉香，馋得流口水罢了！”\n“现在，我也闻到了。而且，我已经把刀叉准备好了。\n我要跨过大海，去把那张名为欧洲的餐桌掀翻，去把那些自以为是的神明和皇帝扔进锅里炖了！”\n“我给你们一个机会。\n不管你们信什么主义，只要你们还想吃肉，就到我的旗帜下面来。\n低下头，叫我一声大姐。我就带你们一起，去参加这场人类历史上最大的盛宴！”"
PAM_47.a:"哪怕是恶魔……只要能带来胜利。"
PAM_47.b:"我们才是历史的主角！滚回去！"
PAM_47.c:"这是对我们的侮辱！"
PAM_47.desc:"这是我们的时代！"
PAM_news.3_tt:"§O我们将在执行国策时向所有非欧洲势力发出阵营邀请。\n§t(如果她们属于§2民主主义§!、§L中立主义§!政体，是不会给我们好脸色看的。）\n§!除此之外，若是她们正在受到别的狼群侵略的话……§!"

PAM.48.t: "狼与狗的区别"
PAM.48.d: "“陛下！我是功臣！我是为了您才开的枪啊！”\n被拖上来的那个上校满脸是血，军服上的勋章撞得叮当响。他曾是镇压野火起义最“得力”的干将。\n但现在，她像条死狗一样被晓枫按在泥地里，旁边站着几个眼神阴狠的新兵。\n“功臣？”我（索拉娜）蹲下身，用马鞭挑起他的下巴，看着那张因恐惧而扭曲的脸，“我记得你。那天你跟我汇报的时候笑得很开心，你说那些穷鬼死前求饶的样子像待宰的猪。”\n“是……是啊！那些贱民反抗您……”\n“啪！”\n我反手一鞭子抽在他嘴上，打断了他的话。\n“听好了，蠢货。我让你镇压，是因为那帮野火手里拿着枪，她们想抢我的王座。那是狼和狼在抢肉吃，输赢各凭本事，死了也是活该。那是战争！”\n我猛地站起身，靴子狠狠踩在他的胸口上，声音里透着一股令人胆寒的护短与暴怒。\n“但我让你去打仗，谁让你去虐杀俘虏了？谁让你把孕妇踢流产？谁让你把还在喘气的老人填进井里还要往里面撒尿？！”\n“你以为你是在效忠我？不！你只是在借着我的名义，发泄你们这些贵族对穷人那种刻在骨子里的优越感！你觉得踩死几只蚂蚁不用负责？你觉得她们是烂泥，所以可以随意玩弄？”\n我揪住他的衣领，把他那张惊恐的脸拉到我面前，瞳孔中燃烧着幽紫色的怒火。\n“睁大你的狗眼看清楚！我也是从那堆烂泥里爬出来的！你虐杀她们，就是在虐杀当年的我！你把她们当猪宰，就是在打我这个女王的脸！”\n“在我的军队里，只有为了生存而战的狼，没有以折磨弱者为乐的狗。”\n我松开手，任由他瘫软在地。我转过身，不再看他一眼，只是对那个缺了一只耳朵的新兵挥了挥手。\n“带下去。他以前怎么把你们当畜生的，你们就怎么‘教’他做人。别让他死得太快，这是我替我的子民……讨回来的公道。”"
PAM.48.a: "“只有狼能征服狼，狗……不配。”"

PAM.49.t: "北方的那头熊"
PAM.49.d: "巨大的世界作战地图铺满了整张桌子。我的匕首插在柏林，雪伊的刺刀指着伦敦。但当我们把目光投向东方那片红色的广袤冻土时，一只修长、有力的手，按住了我的棋子。\n是晓枫。她那双深邃的眼睛毫无惧色地直视着我。\n“这块肉，不能吃。”晓枫的声音平静，却像磐石一样不可动摇，“至少现在不能。”\n“哈？”我（索拉娜）挑起眉毛，露出一颗犬齿，“怎么？你们这群前革命者心软了？那是世界上最大的肉！听说她们的工业比我们要强，她们的血比我们要热。狼群从不挑食，既然要吞噬旧世界，为什么放过那头红色的熊？”\n“因为那是同类。”雪伊在一旁擦着枪，冷冷地插嘴，“虽然她们那是熊，我们是狼。但她们也是一群饿极了才造反的泥腿子。索拉娜，狼群不咬同类，这是规矩。”\n“而且……”小果子趴在地图边，小声补充道，“她们的旗帜上也有星星。老军团长说过，那边的星星，是给穷人指路的。”\n我感到一阵烦躁。这帮家伙，平时跟着我抢劫的时候比谁都狠，一碰到那面红旗就变得婆婆妈妈。我刚想发作，把那张地图撕了，莉莉安娜却轻轻拉住了我的袖子。\n“索拉娜，”她温柔地看着我，声音像清泉一样浇灭了我的火气，“晓枫是对的。我们去欧洲，是为了吃掉那些腐朽的老爷，不是为了和另一群同样从泥里爬出来的野兽互咬。”\n我看了看晓枫坚定的眼神，莉莉安娜祈求的目光。我甚至感觉胸口那颗夜莺之心都在微微颤抖。\n“……切。”\n我一把拔出匕首，狠狠地插在了莫斯科旁边的一棵树上，而不是城里。\n“行吧！听你们的！这块硬骨头先留着！”\n我抱着双臂，气哼哼地坐在王座上，依然觉得不爽，于是对着晓枫大声嚷嚷：\n“但你们给我听好了！我不打她们，不是因为我怕了！也不是因为什么狗屁同志情谊！谁跟她们是同志了！？”\n“是因为这世上只能有一个头狼！等我吃光了欧洲，就把那头熊也拽过来！我要让她管我叫大姐！我要让她知道，比起她那套这主义那理论的，还是老娘的大食堂更管饱！”\n晓枫看着我这副死鸭子嘴硬的样子，嘴角难得地勾起了一抹无奈又纵容的笑意。\n“是，是。我的女王陛下。”"
PAM.49.a: "“先放过那头熊……去吃其他的！”"

PAM.50.t: "来自南美洲的……理论？"
PAM.50.d: "克里姆林宫的办公室里，几位负责外交和意识形态的委员正围着一份刚刚送达的、散发着烤肉味和火药味的外交国书，面面相觑。\n这份国书来自那个新崛起的狼群帝国。我们本以为这又是一个残暴的法西斯政权，或者是一个疯狂的军阀独裁。\n但信里的内容……实在太怪了。\n那个叫索拉娜的女王在信里写道：\n“喂！北边的红帽子！我知道你们也是杀富济贫的好手。虽然你们说话文绉绉的，还要开什么会、选什么举，麻烦死了。但在把贵族挂路灯和让穷人吃饱饭这两件事上，我觉得我们挺合得来。”\n“我现在要去欧洲吃大户了。你们就在那边看着，别捣乱。等我把那帮老贵族嚼碎了，我们再来算算谁是老大的问题。还有，听说你们那儿伏特加不错？给我送两船来，我拿咖啡跟你们换。”\n一位年轻的委员摘下眼镜，表情扭曲地问：“同志们……这算什么？极右翼的民族主义？还是……一种我们从未见过的、极度原始且野蛮的……无政府农业共产主义变体？”\n“她没收了所有私产，建立了公有制大食堂，虽然是通过……呃，抢劫的方式。”另一位委员翻看着情报，语气复杂，“她甚至收编了当地的游击队，还重用了我们的同志……虽然她管那叫收狼崽子。”\n负责主持会议的领导人沉默了许久，看着那封信上按着的油手印，最后深深地吸了一口气。“这是一个……我们也无法定义的怪物。她残酷、独裁、像个法西斯疯子；但她确实在喂饱底层，在消灭阶级——虽然是用牙齿咬的。”\n“不管怎么说……只要她去咬的是欧洲那些资本家和老皇室，那就随她去吧。至于谁是老大……”\n领导人露出了一个意味深长的笑容。\n“……给那个疯丫头送酒去。让她喝醉了，好去替我们把旧世界的浑水，”"
PAM.50.a: "“搅得更浑一点。”"

PAM.51.t: "来自西方的……骨头"
PAM.51.d: "莫斯科火车站，一列挂着黑狼旗帜的装甲列车缓缓进站。\n前来迎接的苏维埃代表团原本以为会是外交人员，或者是某种示威性的重型武器。\n但当车门打开时，随着“哗啦”一声巨响，无数金灿灿、亮闪闪的东西像垃圾一样倾泻而出，堆满了整个站台。\n那是……皇冠。\n德意志的皇冠、不列颠的王冠、教皇的三重冕、还有无数公爵、伯爵的权杖和徽章。它们有的被砸扁了，有的沾着油污，有的甚至还缠着吃剩的鸡骨头。\n在那堆金山银山的顶端，插着一面破破烂烂的木牌，上面用极其潦草、狂放的字迹写着一行字（翻译过来是）：\n“肉我吃了，骨头给你们熬汤。——你们的大姐，索拉娜。”\n看着这堆代表着旧欧洲几千年统治权威的“废铁”，在场的委员们陷入了长久的、死一般的寂静。\n这种羞辱……可不是针对苏联的，它是针对整个旧世界秩序的。她像对待厨余垃圾一样，处理了文明世界最神圣的象征。\n“……同志们，”一位老元帅捡起一顶变形的王冠，表情复杂到了极点，“我打了一辈子仗，这还是第一次见到……这么‘慷慨’，又这么……‘没素质’的征服者。”\n最高领导人看着那块木牌，突然爆发出一阵大笑。\n“把这些东西都收起来！熔了！换成拖拉机，换成发电机！既然那位‘幽灵大姐’赏了我们骨头，那我们就用它，把我们的地基打得更牢一点！”\n“至于叫不叫大姐……”她擦了擦笑出来的眼泪，“只要她不来抢我们的土豆，”"
PAM.51.a: "“随她高兴吧。”"

PAM.52.t: "来自莫斯科的加急包裹"
PAM.52.d: "晓枫拿着一份刚刚拆封的、盖着苏维埃最高委员会鲜红印章的公函，脸上的表情精彩得像是在看一出马戏。“念。”我（索拉娜）懒洋洋地靠在王座上，或者更准确地说，是靠在莉莉安娜的肩膀上。因为“一步之遥”的规矩，我就算坐王座，也得把莉莉拉过来跟我挤一张椅子。她正剥着一颗从南方运来的葡萄，塞进我嘴里。\n“……咳。”晓枫清了清嗓子，努力让自己的声音听起来严肃一点，“致……狼群帝国的最高领袖，索拉娜‘同志’：”\n“关于您在上一封国书中提出的、关于确立长幼尊卑关系的提议……中央委员会进行了三天三夜的紧急磋商。”\n“虽然在《资本论》和列宁同志的著作中，我们确实找不到关于狼王与无产阶级专政之间辩证关系的论述……但是，鉴于您在物理消灭欧洲旧势力这一历史进程中表现出的、令人（惊恐的）钦佩的高效率……”\n晓枫停顿了一下，看了一眼正给我擦嘴角的莉莉安娜，继续念道：\n“……我们一致通过决议：在推翻旧世界、把资本家挂路灯的这个大业中，您的拳头比较大，您的牙齿比较尖，所以……您是大姐。”\n“哈！！”\n我猛地一拍大腿，兴奋得直接从椅子上弹了起来，想要去抓那份信。\n“嗡——”\n就在我蹿出去的一瞬间，胸口那根银色的魔力丝线猛地绷紧了。一只冰凉的小手以一种不容置疑的力量，一把拽住了我的后衣领，硬生生地把我按回了座位上。\n“坐好。”莉莉安娜淡定地收回手，甚至连眼皮都没抬一下，“刚才那一下，你的左手差点就飘散了。大姐要是当着小弟的面变成一阵烟，那可就太丢人了。”\n我尴尬地缩了缩脖子，看着自己果然变得有点半透明的左手，只能乖乖地贴回莉莉安娜身边蹭了蹭，让那股生命力重新流进来。\n“……咳，继续念！”"
PAM.52.a: "……"

PAM.53.t: "来自莫斯科的加急包裹"
PAM.53.d: "晓枫忍着笑，继续读道：“随信附赠两百箱特供的莫洛托夫鸡尾酒原浆（其实就是96度的医用酒精兑了点辣椒水）。我们的专家说，考虑到您现在的幽灵体质，普通的伏特加可能跟白开水没区别，只有这种能当燃料的东西，才配得上给您润润喉。”\n“最后，附上一面锦旗，上书几个大字——”\n晓枫展开了那个随信寄来的、红底金字的巨大锦旗，上面用极其工整的莉兰迪亚语写着：【谁敢不服，大姐咬他】\n看着那面锦旗，又看着旁边那几桶散发着刺鼻气味的特供酒。\n“哈哈哈哈！”我爆发出了震耳欲聋的狂笑，笑得连胸口那颗不需要跳动的心脏都在颤抖。\n“好！这群俄国佬！有眼光！有胆色！”\n我转过头，看着身边一脸无奈却又宠溺的莉莉安娜，指着那面旗子：“莉莉！快！帮我把它挂起来！挂在我们床头……不对，挂在食堂最显眼的地方！”\n“至于那头熊……告诉她，只要她乖乖地在那边种土豆，不来抢我的肉……我索拉娜就认她们做‘小弟’！”\n莉莉安娜叹了口气，拿起那瓶像汽油一样酒的闻了闻，皱起了眉头：“少喝点，虽然你喝不死，但我不想闻到一身的汽油味。今晚……只许喝一杯。”"
PAM.53.a: "“一杯就一杯！反正我有的是时间喝！”"


PAM.54.t: "永不散场的狼群盛宴"
PAM.54.d: "世界，从未如此喧嚣。\n从莉兰迪亚的王宫广场，一直延伸到海边的码头，摆满了看不到尽头的长桌。\n空气中弥漫着烤肉油脂爆裂的香气、麦酒发酵的醇香，还有几十种语言混合在一起的划拳声、大笑声和咀嚼声。那些曾经互相厮杀的士兵，那些曾经隔海相望的陌生人，此刻正肩膀挨着肩膀，撕扯着同一只烤全羊，用沾满油污的手互相敬酒。\n我（索拉娜）站在最高的桌子上——是的，我还是改不了喜欢踩桌子的毛病。但我现在不需要担心踩脏桌布了，因为没人敢管我，除了……\n一只冰凉的小手轻轻拽了拽我的裤脚。\n“下来点，索拉娜。你站得太高了，我的手要酸了。”\n莉莉安娜站在桌边，仰着头，一脸担忧地看着我。她手里依然紧紧牵着那根连接着我们生命的丝线，哪怕是在这种狂欢的时刻，她也不肯松开哪怕一秒。\n我嘿嘿一笑，看着这漫山遍野的人海，看着那些被食物塞得鼓鼓囊囊的脸颊。\n我的胃里空荡荡的，但我却觉得……我吃撑了。\n那种名为满足的情绪，顺着周围无数人的欢笑声，填满了我这个空洞的灵魂。\n“喂！都给老子听好了！”\n我举起酒杯，敬这个该死又可爱的世界。\n喧嚣声瞬间低了下去，亿万双眼睛看向我——看向她们的王，她们的鬼魂，她们的半个衣食父母。\n“这顿饭，没有散场的时候！”我嘶吼着，声音传遍了每一个角落，“只要我索拉娜还飘在这儿一天，只要莉莉还牵着我一天！你们的碗里就永远有肉！你们的杯子里就永远有酒！”\n“以前，我们是饿狼，是为了活命才去咬人。但从今天起……我们是看家狗！谁敢来抢我们的饭碗，我们就咬死谁！”\n“现在……都别愣着了！给老子吃！把肚皮撑破了才准走！”\n“吼——！！！”\n回应我的，是比海啸还要猛烈的欢呼声。那声音震碎了云层，震动了大地，甚至传到了地底深处的夜莺之国。\n我从桌子上跳了下来，低下头，看向莉莉安娜。这位曾经最爱安静的公主，正垫起脚尖，将一颗剥好的、晶莹剔透的葡萄，递到了我这个根本不需要进食的幽灵嘴边。\n“张嘴。”她笑着说，眼睛里映着万家灯火，“……虽然你现在尝不到味道，但……我想让你尝尝甜的感觉，就像你当初喂我一样。”\n我张开嘴，含住了那颗葡萄，也含住了这个……虽然吵闹、虽然混乱，但却无比温暖的……\n人间。"
PAM.54.a: "§O“敬这该死的、热乎乎的生命！”§!"

PAM.55.t: "饱腹之后的图纸"
PAM.55.d: "窗外的欢呼声像海潮一样一浪高过一浪，索拉娜那充满了魔性的嘶吼连这里都能听得清清楚楚。但在指挥室这间暖黄色的屋子里，气氛却有着一种难得的、慵懒的安宁。\n小果子正抱着一根烤得滋滋冒油的硕大牛腿，像只护食的小狼崽一样毫无形象地大口啃着，油脂蹭在了脸颊上，眼睛却笑眯成了一条缝。雪伊把长腿架在桌沿，整个人陷在椅子里，嘴角挂着一丝她自己都没察觉的宠溺微笑。她刚从门边那个荒诞的“酒桶架子”——一具挂着橡木桶、正任由几个孩子在腿骨边钻来钻去的亡灵卫士那里，接了一杯红酒。\n“那个疯女人……”雪伊抿了一口酒，哼了一声，“成了鬼还这么大嗓门，真不怕把嗓子喊破了。”\n“让她喊吧，这是她应得的。”晓枫靠在档案柜旁，手里拿着只装满清水的旧铁壶。她看着这一屋子的烟火气，眼神温和，另一只手却轻轻推开了桌上残留的餐盘，将一张卷边的、沾着少许油渍的大图纸铺了开来。\n“但是，同志们。”晓枫的声音不高，却让屋里的人都看向了她，“宴席总有散场的时候。索拉娜负责把肉抢回来，但要让这顿饭永远吃下去……光靠抢是不行的。”她指着图纸上那些密密麻麻的线条——那是水坝、铁路、化肥厂和学校的规划图，不再是进军路线图。\n“狼群已经吃饱了。接下来，我们得教这群狼……怎么种地，怎么炼钢，怎么即使不去咬断别人的喉咙，也能让自己的碗里堆满肉。”晓枫看向雪伊，“这比打仗更难。雪伊，你的宪兵队不能只抓逃兵了，以后，得盯着贪污和懒惰。”\n雪伊放下了酒杯，眼中的慵懒散去，取而代之的是锋利的寒光：“放心。谁敢动公社……不，谁敢动帝国的地基，我就剁了谁的爪子。”\n角落里，一直沉默的百灵鸟，正小口吃着一块软乎乎的白面包。她看着那个陪孩子玩的骷髅，看着正在讨论未来的“反贼”头子们，又看了看窗外那个虽已死去、却比任何人都热烈地活着的暴君。这个世界依然荒诞，依然疯狂，但她咽下嘴里的面包，第一次觉得……这种荒诞的日子，或许真的能过很久。\n“……那个，”百灵突然开口，声音很小，却很清晰，“关于那个孤儿院的扩建选址……我有几个建议，能听听吗？”\n晓枫笑了，她招了招手。\n“当然。过来吧，我们的小监工。”"
PAM.55.a: "“吃饱了，就该干活了。”"

PAM.56.t: "最后的馈赠"
PAM.56.d: "仪式很安静。莉莉安娜的歌声像水一样渗入地下，抚平了那些扭曲的怨念。泥土松动了，但爬出来却是一支支晶莹剔透、散发着寒气的箭矢。\n那是亡灵们在消散前，将自己最后的力量与执念凝聚而成的礼物。它们没有重量，却能穿透世间最坚硬的铠甲。\n\n索拉娜捡起一支箭，轻轻吹去上面的灰尘：“谢了，姐妹们。你们没打完的仗，我替你们打；你们没走完的路，我替你们走。安心睡吧。”"
PAM.56.a: "（收下这份沉重的礼物）"

PAM.57.t: "无法平息的哀嚎"
PAM.57.d: "“不行！压不住了！”\n悲伤积攒得太多，变成了愤怒的洪流。这一次的仪式彻底失败，地底的怨念比上一次更加深重。\n\n当前的亡灵怨念等级：§R[?pam_undead_anger_level|0]§!\n这意味着，除了基础的一个守卫外，还有额外§R[?pam_undead_anger_level|0]§!个师的亡灵破土而出！\n\n索拉娜拔出了剑，眼中没有怒火，只有一种深沉的悲哀。\n“看来光唱歌是不行了……怨气越积越深，那就让它们发泄个够！全军出击！去让它们安息，把它们的骨头拆散，让它们……彻底解脱！”"
PAM.57.a: "“来吧！不管多少，我陪你们疯！”"

PAM.58.t: "牧羊人"
PAM.58.d: "工地旁的废墟上，站着一个穿戴整齐、却与周围格格不入的男人。他不像是在干活，倒像是在发表演讲。\n“你们这群只会蠕动的虫豸！看看你们！只知道盯着眼前的烂泥和面包！”他挥舞着手臂，对着正在搬运石料的工人们咆哮，神情高傲得像一位流亡的君王，“你们不懂什么是意志！你们不懂什么是神圣的秩序！你们生来就是为了被统御的，只有服从强者的鞭策，你们卑贱的生命才有意义！”\n工人们像看傻子一样看了他一眼，然后继续低头干活，甚至没人愿意浪费口水去骂他。\n雪伊停下脚步，嘴里叼着一根草茎，饶有兴致地抱起双臂：“这又是哪冒出来的神经病？要不要我把他扔进水泥搅拌机里清醒一下？”\n“慢着。”晓枫拦住了她。眼睛里闪烁着一种冷酷的好奇。\n晓枫走上前，站在那个男人面前。\n“你说，你是牧羊人，而她们是迷途的羊群？”晓枫的声音平静，却比男人的咆哮更有穿透力。\n“当然！”男人挺起胸膛，眼神狂热，“这群愚民没有脑子，她们需要一个至高无上的意志来引导！而我，我读过所有的经典，我知道历史的走向！我就是那个能赋予她们灵魂的人！”\n“是吗？”晓枫笑了，她指了指不远处一辆陷入泥坑、纹丝不动的满载石料的板车，“那里有十几个人，她们推不动那辆车。既然你是天生的领袖，既然你的意志如此强大……去吧。不用鞭子，不用枪，就用你的‘灵魂’，去引导她们把车推出来。”"
PAM.58.a: "……"

PAM.59.t: "牧羊人"
PAM.59.d: "男人愣了一下，随即露出不屑的冷笑：“这有何难？”\n他大步走过去，站在泥坑边，开始对着那些满身大汗的工人高谈阔论。他谈论古代的荣光，谈论血统的高贵，谈论牺牲的哲学。他挥舞着手臂，仿佛在指挥一场交响乐。\n然而，车轮纹丝不动。\n工人们疲惫地看着他，像是在看一只嗡嗡叫的苍蝇。\n“推啊！为了荣耀！为了秩序！”男人声嘶力竭地吼道，脸红脖子粗，“你们这些蠢货！为什么不听我的命令？！”\n没有人动。直到一个老工头啐了一口唾沫，喊了一声：“一、二、三，走！”\n“嘿哟！”工人们齐声怒吼，肌肉暴起。板车在泥水飞溅中被硬生生抬了出来。污浊的泥点溅了那个男人一身，把他那身体面的衣服弄得斑斑点点。\n他站在那里，像一个小丑。\n雪伊忍不住大笑起来，笑声刺耳：“这就是你的意志？连个屁都不如！”\n那个男人气急败坏地擦着脸上的泥，眼神怨毒：“这……这不算！是她们太蠢了！是她们已经被劣等的基因腐蚀了！她们听不懂我高贵的语言！”\n晓枫走过去，看着那个狼狈不堪却依然昂着头的男人，眼神里只有一种看透了骨髓的、冰冷的怜悯。\n“不，其实你心里很清楚。”晓枫的声音平静，每一个字却都像钉子一样扎进他的虚伪里，“你所说的引导，不过是你用来掩饰自己无能的遮羞布。你渴望一个强权来替你统治，从来不是因为你多有远见，是因为你是个巨婴——是因为你既没有弯腰干活的力气，也没有平视他人的勇气。你只能幻想自己站在高处，把别人当成数字和牲口，以此来获得那点可怜的、虚幻的优越感。”\n男人像是被踩到了尾巴，大声尖叫起来，眼中燃烧着病态的执拗：“你懂什么？！会有人的……总会有一个真正的超人，一个比我更冷酷、更强大的领袖会出现！她会把这些垃圾全部扫进焚尸炉，然后建立起我理想中的世界！我只是……我只是生不逢时！”\n晓枫摇了摇头，转身离去，不再多看他一眼。\n“走吧，雪伊。别理他了。”\n“为什么？这种废物留着干嘛？”\n“留着吧。”晓枫的声音飘散在风里，“让他站在那里。让他成为一座碑——一座纪念傲慢与无能的墓碑。让所有人都看看，脱离了土地和人民的‘高尚’，究竟长着一副怎样可笑的嘴脸。”"
PAM.59.a: "“他在等待戈多，但戈多永远不会来。”"

PAM.60.t: "咸水童话"
PAM.60.d: "海风很大，吹得索拉娜那件沉重的黑色狼皮大衣猎猎作响。她站在码头的尽头，看着那翻滚着白色泡沫的大海，脸上挂着不可一世的狂笑。\n“看啊，小果子！多像一锅没撇去浮沫的肉汤！等我把这锅汤喝干了，就没有什么能挡住我的路了！”\n站在她身边的小果子，正费力地压住被风吹乱的海图。她抬头看了看这个不可理喻的暴君，突然没头没尾地问了一句：“姐姐，你听过那个想要喝干大海的狼的故事吗？”\n“哈？没听过。”索拉娜心情很好，随手从兜里掏出一把从海盗那儿抢来的金币，像打水漂一样往海里扔，“讲讲看。如果那头狼最后吃饱了，我就赏你个苹果。”\n“这是老水手们讲的故事。”小果子看着远方起伏的浪花，声音很轻，“很久很久以前，有一头贪吃的狼。它吃光了陆地上所有的兔子、所有的羊，甚至吃光了所有的草。它觉得自己是世界上最厉害的王。然后，它来到了海边。那天正是夕阳西下，红彤彤的太阳正一点点沉进海里。狼没见过大海，也没见过落日。它以为……那个太阳，是一颗刚刚从炉子里拿出来的、流着油的咸鸭蛋黄。”\n“噗——”索拉娜忍不住笑喷了，“咸鸭蛋？这狼是饿疯了吧？”\n“是啊，它饿疯了。”小果子继续说道，“它想吃那颗蛋黄。可是水太深，它够不着。于是它决定……把海水喝干。它喝啊，喝啊。肚子涨得像一座山，咸水让它的喉咙像火烧一样疼。旁边的小螃蟹笑它傻，海鸥笑它蠢。它们说：‘那是太阳，不是蛋黄；那是海，永远也喝不干的。’可狼没有停。它一边呕吐，一边继续喝。最后……它的肚子‘嘭’的一声，炸开了。”"
PAM.60.a: "……"

PAM.61.t: "咸水童话"
PAM.61.d: "索拉娜撇了撇嘴，一脸的不屑：“我就知道是个蠢故事。结局呢？它死了？蠢死的？”\n“嗯，它死了。”小果子转过头，那双清澈的眼睛直视着索拉娜，“但是，老水手说，狼死的时候，是幸福的。”\n“为什么？”索拉娜皱起了眉，“因为它觉得自己吃到蛋黄了？”\n“不。”小果子摇了摇头，“因为它说：‘虽然肚子炸开了很疼……但是，一直咕咕叫的那个地方，终于……安静了。’”\n海风突然变得有些刺骨。\n索拉娜脸上的笑容僵住了。她看着眼前这片浩瀚无垠、永远无法被填满的大海，又下意识地按住了自己那个贪婪而灼烧的胸口。那个故事里的狼，真的以为那是咸鸭蛋吗？还是说……它只是太害怕那种什么都吃光了之后的空虚，太害怕那种独自面对整个世界时的寂静？所以它宁愿选择涨死，宁愿选择去追逐一个虚幻的倒影，也要让自己的身体里……装满点什么东西，哪怕是苦涩的、致命的咸水。\n“……真他妈是个……没出息的傻狼。”\n过了许久，索拉娜才从牙缝里挤出这么一句骂声。声音很低，听起来不像是在骂故事里的狼，倒像是在骂那个……正准备把整个世界都吞进肚子里的自己。她转过身，不再看海，也不再看小果子。她只是把手里剩下的一大把金币，全都胡乱地塞进了小果子的口袋里，动作粗鲁得像是在掩饰什么。\n“……拿去买糖吃！以后不许讲这种让人倒胃口的故事！听见没有？！”"
PAM.61.a: "（即使喝干了大海…我也还是会饿的，对吗？）"

 # 对手收到
 PAM.62.t: "来自索拉娜的骨牌"
 PAM.62.d: "一只亡灵信使出现在我们的视野里。它没说话，只是在桌上扣下了三张骨牌，示意我们选择一张作为赌注。\n如果我们拒绝，那就是示弱；如果我们输了，那就是羞辱。\n\n规则：红骨 > 金骨 | 金骨 > 黑骨 | 黑骨 > 红骨"
 PAM.62.a: "我们选择武力！（出红骨）"
 PAM.62.b: "我们选择财富！（出金骨）"
 PAM.62.c: "我们选择诡计！（出黑骨）"

 # 玩家收到
 PAM.63.t: "猎物已入局"
 PAM.63.d: "亡灵信使传回了消息：[FROM.GetFlag][FROM.Getname]已经选好了底牌，现在正扣在桌面上。\n索拉娜陛下，现在轮到您了。您要用什么来压倒他们？\n\n红骨 > 金骨 | 金骨 > 黑骨 | 黑骨 > 红骨"
 PAM.63.a: "§R出【红骨】：用刀子说话！§!"
 PAM.63.b: "§Y出【金骨】：用利益诱惑！§!"
 PAM.63.c: "§1出【黑骨】：用巫术诅咒！§!"

 # 结果
 PAM.64.t: "通吃！"
 PAM.64.d: "她们的选择正如我们所料！\n我们的骨牌狠狠地压碎了她们的底牌。信使带回了满满一车的战利品，还有对方羞愤欲绝的表情。"

 PAM.65.t: "该死，输了！"
 PAM.65.d: "这帮家伙比我们想象的还要狡猾！我们的牌正好被他们克制了。\n信使空手而归，甚至还带回了对方的嘲笑，但这笔账……我们记下了。（若对方为AI控制.选择牌颜色的概率会因其意识形态而增加，且如果我们已经破译了对方的密码，将会直接获得胜利。）"

 PAM.66.t: "无聊的平局"
 PAM.66.d: "双方打出了同样的牌。力量相互抵消，阴谋相互识破。\n这是一场不流血也不进账的赌局。不过也好，至少证明了大家都是不好惹的狼。"

PAM.67.t: "盛开"
PAM.67.d: "阳光正好，晒得广场上的地面暖烘烘的。我（莉莉安娜）提着裙摆，悄悄躲在喷泉的柱子后面，看着那具负责守卫花园的亡灵卫士。它生前大概是个高大的战士，此刻却像一尊安静的雕塑，任由那群还没它腿骨高的孩子们在它身边跑来跑去。\n“好啦！别动哦，大个子叔叔！”一个扎着羊角辫的小女孩，踩着卫士的脚背，努力踮起脚尖。她手里捧着一个刚刚编好的、用雏菊和三叶草做成的花冠。\n亡灵卫士眼眶里的幽火跳动了一下，它似乎犹豫了片刻，然后，它做出了一个让我惊讶的动作——它缓缓地、小心翼翼地低下了那颗狰狞的头颅，生怕自己锐利的骨刺伤到了那个柔软的小生命。\n女孩咯咯笑着，将那个并不算精美的花冠，端端正正地戴在了它光秃秃的头盖骨上。周围的大人们看到了这一幕，没人尖叫，也没有人驱赶。一位路过的妇人甚至停下来，笑着帮卫士整理了一下被孩子弄歪的披风，就像在替即将出门的丈夫整理衣领。\n“真好看。”妇人拍了拍那冰冷的臂骨，“今天过节，你也精神点。”\n卫士依然沉默，但它重新站直身体时，动作却显得格外庄重，仿佛头顶戴着的是这世上最珍贵的皇冠。\n我捂住嘴，眼泪却不听话地流了下来。我曾以为我的孩子们注定要在阴暗中孤独地朽坏，但我错了。在这个充满阳光的世界里，它们不仅被需要，甚至……被爱着。"
PAM.67.a: "（原来……这就是家的样子。）"

PAM.68.t: "不冷的冬天"
PAM.68.d: "入冬的第一场雪，把矿区的路染成了白色。我陪着索拉娜去视察，她正忙着像个暴躁的管家婆一样，去检查工人们的煤炭储备够不够。我走在后面，目光却被路边的一个角落吸引了。\n那里坐着一位满头银发的老奶奶，她怀里抱着一团红色的毛线，正在织一条很长、很宽的围巾。而在她对面，蹲坐着一具负责搬运矿石的骷髅工兵。它不需要休息，不需要取暖，此刻却乖乖地停在那里，任由老奶奶拿着软尺，在它那只有骨架的脖子上比比划划。\n“奶奶，它不冷的。”我忍不住走过去，轻声提醒道，“它是亡灵，没有体温，也不会感冒。”\n老奶奶抬起头，慈祥地看了我一眼，手里的针线活却没停。“我知道，大闺女。它是死人，感觉不到冷。”\n她把织好的一半围巾，轻轻地围在骷髅那空荡荡的颈椎上，打了个漂亮的结，遮住了那些裸露在寒风中的骨头缝隙。\n“可是啊，我们看着冷。”老奶奶轻轻拍了拍骷髅的肩膀，眼神里满是心疼，“这孩子天天帮我们扛石头，修房子，大雪天的连口热汤都喝不进去。要是再连件遮风挡雨的衣裳都没有，我们这些活人的心……过意不去啊。”\n骷髅工兵静静地坐着，任由那红色的羊毛围巾在风中飘扬。它那空洞的胸腔里，虽然没有心脏跳动，但在那一刻，我分明感觉到了一股比炉火还要温暖的热流，在它那冰冷的骨骼间流淌。\n它伸出那只只有指骨的手，笨拙地、轻轻地碰了碰那条围巾，就像是在确认一份沉甸甸的礼物。\n我笑了，在那漫天的飞雪中，觉得心里热乎乎的。原来，温暖不仅是可以给予的，也是可以……被死者所接收的。"
PAM.68.a: "（这个冬天，真的很暖和。）"

PAM.69.t: "第三个杯子"
PAM.69.d: "今晚是丰收节，索拉娜在广场上摆开了她那标志性的流水席。我也混在人群里，看着大家欢庆。旁边的桌子上，坐着一对年轻的夫妇，桌上摆满了丰盛的烤肉和面包。但奇怪的是，在他们对面，还摆着一副空碗筷，和一个斟满了麦酒的酒杯。\n那里站着一个负责维持秩序的亡灵哨兵。它手持长矛，笔直地立在桌边，眼眶里的魂火平静地燃烧着。\n“来！干杯！”年轻的丈夫满脸通红，举起酒杯，不仅碰了碰妻子的杯子，还特意转过身，轻轻碰了碰那个放在亡灵面前的酒杯，发出了清脆的声响。\n“兄弟，这一年辛苦你了！”他大声说着，像是对着一位多年的老友，“要不是你们守着大堤，我们这庄稼早就被水淹了。这第一杯酒，必须敬你！”\n妻子也笑着，夹起一块最好的肥肉，放在了亡灵面前的盘子里。“虽然你吃不了，但味道总得闻闻吧？这可是索拉娜陛下发的好肉，香着呢！”\n亡灵哨兵依然一动不动，但我注意到，它那握着长矛的手指，微微松开了一些，又重新握紧。它虽然无法回应，无法畅饮，但它就这样静静地站在那里，成为了这场家庭聚会中，不可或缺的一员。\n周围的人们对此习以为常。大家笑着，闹着，把那份属于生者的喜悦，毫不吝啬地分享给这些沉默的守护者。\n我看着那个盛满酒的杯子，看着那盘堆满肉的盘子，转过头看向远处正在和晓枫拼酒的索拉娜。\n我想告诉她：你看，你做到了。\n你不仅喂饱了活人的肚子，你还……填满了死者的寂寞。在这个吵闹的世界里，再也没有谁，是孤单的鬼魂了。"
PAM.69.a: "（干杯?）"

PAM.70.t: "异界交易"
PAM.70.d: "我趁着索拉娜在地图室里发火摔杯子的时候，偷偷溜了出来。\n在这座城市的地下，在那连索拉娜的密探都未曾标记的阴湿巷弄里，竟然藏着一个热闹的黑市。这里卖的东西千奇百怪：过期的军用罐头、只有一只镜片的望远镜，甚至还有……声称能“驱逐亡灵”的大蒜项链。\n我站在一个满脸横肉、胳膊上纹着骷髅的摊贩面前，盯着他摊位角落里的一样东西——那是一个用废弃弹壳和劣质木头雕刻成的、只有巴掌大的小狼。虽然雕工很粗糙，甚至有点丑，但那呲牙咧嘴的凶狠劲儿，像极了索拉娜。\n“嘿，小姑娘，那是非卖品。”摊主凶巴巴地挥了挥手，显然把我当成了哪家迷路的贵族小姐，“除非你有金子，或者……真正的硬通货。”\n“硬通货？”我困惑地眨了眨眼。我摸遍了裙子的口袋，除了两颗准备喂给流浪猫的糖果，什么也没有。我思考了一下索拉娜平时是怎么做的，于是我非常认真、非常庄重地伸出手，指尖凝聚起一团足以让整条街瞬间冻结的、纯粹的冥界魔力。\n“我没有金子。但是……我可以赐予你‘永恒的安宁’，让你以后再也不用为了饥饿和寒冷而烦恼，作为交换，可以吗？”\n摊主愣住了。他看着那团散发着死亡气息的幽蓝光球，吓得手里的烟卷都掉了，脸色从红变白，又从白变青。\n“别！别别别！大姐！祖宗！”他扑通一声跪在地上，把那个木雕狼颤颤巍巍地举过头顶，带着哭腔喊道，“我上有老下有小！我还想多活两年！这狼送您了！求您收了神通吧！别让我安宁！活着挺好的！真的！”\n我有些失望地收回了魔力。我不明白，那是多少帝王梦寐以求的赐福，为什么他看起来像见到了鬼一样？\n我接过了那个木雕，想了想，还是把口袋里的两颗糖果放在了他的摊位上。\n“好吧。既然你不想睡觉，那就……吃点甜的吧。”\n离开巷子的时候，我回头看了一眼。那个凶神恶煞的摊主正瘫坐在地上，大口大口地喘着粗气，庆幸着自己死里逃生。\n我摸着手里那个粗糙的小狼，突然好像明白了一点点。\n对于这些短暂而脆弱的生命来说……也许，活着本身，哪怕是辛苦地、狼狈地活着，也比我所拥有的永恒，要珍贵得多。\n这就是……索拉娜不想回去的原因吗？"
PAM.70.a: "（下次……还是带点钱吧。）"

PAM.71.t: "人类不是玩偶"
PAM.71.d: "兵工厂的流水线正发出震耳欲聋的轰鸣。为了回应索拉娜“把仓库堆满”的号召，工人们已经连续奋战了十几个小时。他们脸上挂着满足的笑容（因为加班有肉吃），但眼皮却沉重得像挂了铅块。\n我（莉莉安娜）提着裙摆，好奇地走在车间里。这里很热，很吵，充满了生者特有的汗味。这和我那些冰冷、安静、不知疲倦的亡灵工匠完全不同。\n突然，我看到一个年轻的装配工，手里的扳手“当啷”一声掉在了地上。他整个人像是被抽走了灵魂一样，软绵绵地滑到了机器旁边，闭上了眼睛，一动不动。\n“……坏掉了吗？”\n我吓了一跳，连忙跑过去，蹲在他身边。我伸出手指，戳了戳他的脸颊。热的。但是没有反应。\n“索拉娜说过，人类是很脆弱的玩具。”我有些慌乱地想着，“是不是因为动得太久，里面的发条断了？”\n我有些心疼。这是索拉娜最喜欢的“狼崽子”，不能就这么坏掉。于是，我举起手，掌心凝聚起一团幽蓝色的、用来唤醒死者的高浓度魔力。\n“别怕……我这就给你修好。重新站起来吧，不知疲倦的战……”"
PAM.71.a: "……"

PAM.72.t: "人类不是玩偶"
PAM.72.d: "“哇啊啊啊——！！！”\n那个年轻工人猛地睁开眼，看到怼在脸上的死灵魔法，吓得发出了一声惨绝人寰的尖叫，连滚带爬地窜出去三米远。\n“鬼……鬼啊！！我不累了！我一点都不累了！别把我变成骷髅！！”\n我举着手，愣在原地，无辜地眨了眨眼。\n“……莉莉？”索拉娜闻声赶来，看到这一幕，又好气又好笑，“你在干什么？你想把我的活人吓死吗？”\n“我……我以为他坏掉了。”我委屈地指着那个瑟瑟发抖的工人，“他刚刚突然不动了。我想让他重新站起来……”\n索拉娜叹了口气，走过去把那个工人扶起来，拍了拍他身上的灰：“他那是困了！是累了！活人是需要睡觉的，不像你的那些骨头架子！”\n“睡觉……”\n我看着周围那些虽然强撑着精神、但眼神已经涣散的工人们。我突然明白了。\n原来，生者的生命力虽然炽热，却像燃烧的蜡烛一样，是会越烧越短的。如果一直烧下去，就会熄灭。而“睡觉”……就是让他们重新变回长蜡烛的魔法。\n“索拉娜。”我拉住了她的袖子，非常认真、非常严肃地说道，“既然你是狼王，你就得懂养护的道理。”\n“如果我们一直让他们转个不停，他们就会像那个小哥一样，以为自己要坏掉了。那样产出的子弹也是歪的。”\n我伸出三根手指，在索拉娜面前晃了晃。\n“一天只有这么长。给他们一段用来为你干活，给他们一段用来吃饭睡觉……还要给他们一段，用来做那个……”我想了想小果子跟我说过的词，“……用来‘发呆’。”\n“只有上好发条的玩偶……不对，只有休息好的人，明天才能抢更多的东西。对不对？”\n索拉娜看着我，又看了看那些疲惫的工人。她沉默了一会儿，然后咧嘴笑了，揉乱了我的头发。\n“行。既然我们的公主殿下都下令了，那就让机器停一停。”\n她转过身，对着车间大吼：\n“都听见了吗？！为了不让你们这群蠢货累死在机床上给我丢人，从今天起，干满……呃……八个小时！就给老子滚回去睡觉！谁敢赖着不走，我就让莉莉真的把他变成骨头架子！！”"
PAM.72.a: "（狼崽子是需要休息的。）"

PAM.73.t: "狼王的施舍"
PAM.73.d: "卸货区一片繁忙。一艘挂着狼群帝国旗帜的运输队刚刚抵达，卸下了一箱箱沉重的军火。\n在此刻紧迫的战局下，这无疑是雪中送炭。然而，负责接收的军官脸色却并不好看。\n这些武器没有经过保养，上面还残留着上一任主人的油污甚至血迹。而且，随船并没有任何外交使节，只有那个满身匪气的船长转交的一张皱巴巴的便条，上面用粗鲁的字迹写着：\n“喂，废物们。听说你们快被打哭了？\n这点东西拿去用。我不指望你们能赢，但至少别输得太难看。\n给我狠狠地咬！把那帮伪君子的喉咙咬断！\n记住了，我救你们不是因为我是你们的朋友。是因为你们也是狼，而狼……只能死在更强的狼王（我）手里，不能死在羊群的角下。\n吃饱了就去拼命吧！别让我失望！”\n这是一种赤裸裸的羞辱，也是一种傲慢至极的挑衅。但看着手中这批急需的步枪……我们不得不吞下这口带着血腥味的“肉骨头”。"
PAM.73.a: "拿起枪，闭上嘴。这笔账我们记下了。"
