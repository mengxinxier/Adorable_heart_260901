PAM_undead_pacification_category:0 "亡灵的挽歌"
PAM_soothe_restless_souls:0 "抚慰躁动的亡魂"
PAM_undead_pacification_category_desc:0 "这片土地下埋葬了太多的苦难。那些没能挺过寒冬的、死于战火的、心怀不甘的灵魂。它们不是敌人，它们是我们逝去的同胞。如果它们愿意安息，就会留下利箭作为守护我们的力量；如果悲伤太过强烈……\n我们就不得不让它们在战斗中发泄出来。\n\n我们目前库存中拥有  §Y[?Root.num_equipment@wangling_equipment|Y0]§! 支 £GFX_PAM_szlj §1死者的利箭§!  §Y[?Root.Essence|Y0]§! 枚 £GFX_PAM_WLJC 亡灵精粹"
PAM_appease_the_dead:0 "§1沉睡的代价§!"
PAM_appease_the_dead_desc:0 "“地底下的声音越来越大了。它们在磨牙，在撞门，在抱怨我们要得太多。\n真是一群贪得无厌的死鬼。不过，现在的我还不想把精力浪费在镇压自己家后院上。\n既然它们想要，那就还给它们！\n把这批成色最差的利箭挑出来，重新埋回那些乱葬岗去！告诉地下的那些东西：这是利息！\n拿着这些东西，闭上嘴，滚回去睡觉！别逼我亲自下去让你们永远闭嘴！”"
PAM_mobilize_undead_looters:0 "§O亡灵搬运队§!"
PAM_mobilize_undead_looters_desc:0 "“活人士兵太娇气了。火太大了进不去，房子快塌了不敢进，太重了搬不动。\n我看仓库里那些骨头架子的利箭都快堆发霉了。把它们唤醒！让它们去干活！\n死人不怕火，不怕砸，而且最重要的是——死人没有口袋，不会私藏金币。\n给每个亡灵发个麻袋！让它们去扫荡战场，去清理废墟！告诉它们：哪怕是一颗螺丝钉、一只皮靴，只要是能用的，都给我捡回来！\n我们要把敌人抢得……连条底裤都不剩！”"
PAM_sacrifice_ghost_dockyards:0 "§1幽灵船坞§!"
PAM_sacrifice_ghost_dockyards_desc:0 "“船还是太少了！根本不够装下我们要抢的东西！\n把那些利箭都扔进锅炉里！那是最好的催化剂。\n告诉工人们滚开，让亡灵接管船坞！它们不需要休息，不需要图纸，只要给它们足够的怨气，它们就能用骨头和废铁拼出战列舰！\n烧！给我烧！我要在天亮之前看到新船下水！哪怕这艘船是用鬼魂糊出来的，只要能开炮，就是好船！”"
PAM_ghost_assembly_line:0 "§1幽灵装配线§!"
PAM_ghost_assembly_line_desc:0 "“那些骨头架子和怨魂在仓库里积灰太可惜了。把它们撒进流水线里！\n看啊，扳手自己动起来了，铆钉自己飞进去了。\n不需要活人加班，不需要给鬼发工资。它们为了发泄怨气而疯狂工作，而我们坐享其成。\n这就叫效率！用这批便宜得像白捡一样的飞机，去把天空铺满！让我的飞行员哪怕把飞机当砖头扔，我们也扔得起！”"
PAM_forge_soul_armor:0 "§O怨念装甲§!"
PAM_forge_soul_armor_desc:0 "“晓枫说我们的坦克皮太薄，被敌人的大炮一轰就碎，里面的狼崽子还没冲到面前就熟了。\n这不行。我的兵，只有我能折腾，敌人没资格把他们变成烤肉。\n把那些死者的利箭都拿来！那是亡灵的骨头，是它们的怨气，比世界上最硬的钢还要硬。\n让工匠把它们熔了！涂在坦克上，嵌进钢板里！\n别管好不好看，也别管那玩意儿会不会在半夜乱叫。我只要它能挡住炮弹！\n这就叫……让死去的姐妹，给活着的姐妹当盾牌。这才是我们狼群的规矩——死活都要抱成团！”"
PAM_weaving_death_shroud:0 "§1死亡帷幕§!"
PAM_weaving_death_shroud_desc:0 "“铝太贵了，那是给阔佬们造玩具用的。我们的飞机不需要闪闪发光，只需要能飞，而且打不烂。\n把那些亡灵利箭磨碎了，抽成丝，织成布！那种布轻得像烟，韧得像命。\n把它蒙在机翼上，哪怕被机枪扫成了筛子，那些洞也会自己合上——就像伤口结痂一样。\n虽然看起来灰扑扑的，像是在天上飞的棺材……但这棺材是装敌人的！\n缝起来！让我们的飞行员披着这层死人皮，去把天上的鸟都给我抓下来！”"
PAM_laying_bone_keel:0 "§t骸骨巨舰§!"
PAM_laying_bone_keel_desc:0 "“钢铁入水即沉，但有些东西，死都不肯沉下去。\n别去买那些昂贵的特种钢了。把这些利箭，还有战场上捡回来的乱七八糟的骨头，都给我运到船坞去！\n我们要用怨念来铺设龙骨。这种船没有痛觉，不怕进水。就算被打断了，剩下的半截也会像僵尸一样漂在水上咬人。\n告诉水手们：别嫌船舱里冷。这艘船本身就是活的，它会替你们挡鱼雷，替你们吃浪头。\n只要你们还想回家，这堆骨头架子……就绝不会让你们喂鱼！”"
PAM_refine_undead_essence:0 "§1点燃执念§!"
PAM_refine_undead_essence_desc: "“这些箭矢是冷的，放在库房里只会发霉。亡灵的执念如果不烧起来，就只是一堆废骨头。\n把它们扔进炉子里！把火烧旺！\n听听那呼啸的声音，那是它们在欢呼，在渴望重新回到战场。\n我们要把这些死意提炼出来，变成一种流动的、坚不可摧的铁水。用它来浇筑我们的战车，那是比黄金还要珍贵的燃料。\n加煤！加骨头！别让炉子熄了，前线的狼崽子们还等着穿新衣裳呢！”"
PAM_dmckz_tt:0 "在这个世界上，每当有§Y非傀儡国家§!被吞并时，我们都会获得§G1§!点£GFX_PAM_am 安眠点数"
