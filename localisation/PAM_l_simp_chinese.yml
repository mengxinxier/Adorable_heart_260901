PAM_seize_xf_planning:0 "翻她的旧档案"
PAM_seize_xf_planning_desc:0 "上区的档案室里堆满了晓枫当年签过字的作战图纸。她画下的每一道红线，现在都成了夜莺手里的圈套。把这些档案翻出来，然后统统烧掉。让那些圈套变回废纸。"

