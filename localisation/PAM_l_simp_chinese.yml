PAM_lxl_warn_tt2:0 "§R否则§!："
PAM_endwar:0 "§1这是一场唤醒长眠者的战役§!"
PAM_endwar_desc:0 "你们呀，总是这么风风火火的。明明在梦里待着多舒服，不用挨冻，不用饿肚子，我都把被子给你们盖好了。结果你们还是把炉子点着了，还拉了那么响的一声汽笛，把我好不容易哄睡的几个孩子都吵醒了。不过呢，看你们这么精神，我其实挺开心的。这花园里好久没这么热闹过了。既然你们已经等不及要闯进来，那我再拦着，倒显得我不近人情了。来吧。我就在花园里坐着，哪也不去。至于你们想怎么闹……就按你们的规矩来好啦。\n\n£GFX_PAM_wxz 违心值： §Y[?pam_xf_burden|Y0]§!\n\n£GFX_PAM_frz 缝纫值： §Y[?pam_xy_stitch|Y0]§!\n\n£GFX_PAM_nh 索拉娜的怒火： §Y[?pam_sln_fury|Y0]§!\n\n£GFX_PAM_ddz 等待值： §Y[?pam_lili_wait|Y0]§!\n\n£GFX_PAM_qxz 清醒值： §Y[?pam_xgz_awake|Y0]§!"
PAM_linshi:0 "小果子的去处"
PAM_linshi_hg:0 "调整小果子的陆/海军指挥权"
PAM_linshi_hg_desc:0 "露西莉亚跟我说，她要去挡一阵。挡一阵，她说得轻飘飘的，跟上次在洞里拔剑之前一模一样的语气。我知道拦不住她。她把斗篷系紧的时候我就在旁边站着，什么都没说。等她走远了，我再从船舱里把枪摸出来。雪伊姐以前教过我，走在前面的人不能慌。你一慌，后面的人腿就软了。我一点也不慌。我就是有点想她了。"
