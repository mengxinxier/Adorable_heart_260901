PAM_remove_power_bop_up: "§9醒醒……不要再睡了…………§!"
PAM_remove_power_bop_up_desc: "有时候不太敢做梦。怕梦太好了醒过来的时候更难受。我把枕头翻了个面，用手在被子上画起了圈圈。窗外的风声好大啊，可是我还能听见自己的呼气声。一下，两下，三下。数到第十下的时候，天应该就亮了吧。"
