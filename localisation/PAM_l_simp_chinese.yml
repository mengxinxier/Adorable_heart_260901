####民族精神###
#二线民族精神
PAM_szzx_idea:0 "生者阵线"
PAM_living_spirit:0 "我们，再也不要回到冰冷的梦里去了！"
PAM_living_spirit_desc:0 "§R注§!：@PAM每消耗过一次£GFX_PAM_xjlbtb §1夜莺之花§!，都将加强§G1%§!该§Y民族精神§!的效果！\n\n站在这里的，是曾经迷茫、曾经哭泣的凡人，可当他们看清了那道撕开长夜的光芒，当他们握住了同伴伸过来的双手，那份退缩与软弱便彻底烟消云散了。\n他们在大风雪里筑起壁垒，用躯壳与热血去抵挡死寂的侵蚀。\n这是属于整座大地上所有活着的人为了夺回属于自己的明天，而共同许下的最决绝的誓言：\n\n§t“我们，再也不要回到冰冷的梦里去了！”§!"

PAM_nightingale_slow:0 "该死的冬天"
PAM_nightingale_slow_desc:0 "我们的士兵报告说，最近行军的时候总觉得有什么东西在后面拽着他们的背包，脚下的泥也似乎比平时更深更黏。天气预报说接下来几周会有一场突如其来的寒流，所有道路都将被冰雪覆盖。真是见了鬼了。"
PAM_nightingale_supply:0 "补给线在闹鬼"
PAM_nightingale_supply_desc:0 "从前线送回来的报告越来越离谱。运粮车队在熟悉的道路上迷路，弹药箱在仓库里凭空消失，火车头总是在最关键的时刻熄火。有人说这是敌人在搞破坏，也有人说……是那个叫夜莺的女人，正坐在我们的补给线上喝她的下午茶。"
PAM_lxly_war_js: "一纸被公开的停战协议"
PAM_lxly_war_js_desc: "这份协议的生效方式很简单，一封信，一个签名，一场战争便到此为止。接下来轮到的是那些从来不上战场的人。工人发现今天的流水线停在原地，码头的吊臂悬在半空，调度室的白板上写着取消的订单编号。议会从早晨就开始争吵，走廊里站满了等消息的记者。他们想问的问题其实只有一句：这场仗打到现在，究竟是为了什么。这个问题一旦被问出来，就很难再用口号盖回去了。"
PAM_ZDW_dm:0 "§1歌声渐渐微弱§!"
PAM_ZDW_dm_desc:0 "夜莺在撞开新一天的门扉后，她那令人沉睡的歌声便在风中逐渐消散了。随着时间流逝，她所掌控的寂静正在瓦解，那些被她强行留住的亡灵也开始从漫长的梦中醒来。她的力量，正如潮水般缓缓褪去。"
PAM_ZDW_buff_tt:0 "§1歌声渐渐微弱§!追加效果:\n"

PAM_lycl:0 "反正明天还会下雨"
PAM_lycl_desc:0 "回廊上的雨水积了一天，我坐在檐下看了一天。莉兰迪亚还是老样子，雨下得稍大些就在路上汪成一片，倒映着灯柱的影子，晃来晃去，像书页上晕开的墨。风灌进来的时候把门帘掀得噼啪响，底下的人大概又忘记收衣服了。不过也无所谓，反正明天还会下雨。院子里的花草自有它们活着的法子，冷归冷，淋归淋，来年春天该开的花一株也不会少。"
PAM_lycl_tt: "§Y反正明天还会下雨§!追加效果:\n"

PAM_zzjd1:0 "明天也一样暖和"
PAM_zzjd1_desc:0 "夜风吹过去，院子里的花全都开了。战火歇了，大雪停了，街上重新摆好了长长的桌子。那个在海上漂泊的小果子也回到了避风的座位，大家终于可以长久地聚在一处。明天的太阳会照常升起，而且，明天也一样暖和。"

PAM_sln_js:0 "§O野狼之饥§!"
PAM_sln_js_desc:0 "她的胃里永远烧着一团火一般的饥饿。是那种在大雨里饿到发疯、连发霉的面包都啃得干干净净的饥饿。这股饿劲让她从不松开咬住的东西。从敌人手里夺来的每一口粮食，都填进自己人的肚子里。"
PAM_sln_js_tt:0 "§O野狼之饥§!追加效果:\n"

PAM_heal_the_world:0 "§t让世界幸福起来§!"
PAM_heal_the_world_desc:0 "露西莉亚还在睡着呢。我每天早上给她擦脸，理头发，然后在床边坐一会儿，跟她讲讲院子里又开了什么花，街上的孩子又学会了哪几个字。露西莉亚想要一个温暖的结局，我就在外面替她拼出来。等哪天露西莉亚醒了，看到的这个世界的时候，肯定不会让她失望的。"
PAM_heal_the_world_tt:0 "§t让世界幸福起来§!追加效果:\n"

PAM_living_world_mod:0 "§9向着阳光生长的人间§!"
PAM_living_world_mod_desc:0 "长夜结束了。放下了过往的仇恨与罪责，大家肩并着肩站在真实的阳光下。工坊重新运转，学校书声朗朗，全社会正带着彼此包容的温度，踏踏实实地走向每一个有希望的明天。"
PAM_living_world_mod_tt:0 "§9向着阳光生长的人间§!追加效果:\n"

PAM_xf_js:0 "§4血线之下§!"
PAM_xf_js_desc:0 "每一份完美的作战计划背后，都有一道她亲手划下的血线。她知道山脊后面住着哪些人，知道天亮后哪些木屋会变成壕沟里的数字。这份清醒推着她把计划做得滴水不漏，也让她每晚闭上眼都能闻到纸面上渗出来的腥气。"
PAM_xf_js_tt:0 "§4血线之下§!追加效果：\n"
PAM_xy_js:0 "§R这面破布拼出来的旗子§!"
PAM_xy_js_desc:0 "她从码头捡回来麻袋片，从罐头厂扯回来围裙，拿缝衣针一针一针拼成了这面旗。没人觉得这玩意儿能成事，连她自己都不确定。但那些在夜里迷路的人看见这团红色，会知道该往哪儿走。这就够了。"
PAM_xy_js_tt:0 "§R这面破布拼出来的旗子§!追加效果：\n"
PAM_lili_js:0 "§1等一片落在手心的光§!"
PAM_lili_js_desc:0 "她在这座没有太阳的城堡里等了很久。久到每一扇窗的朝向都记在心里，久到走廊里所有水晶花的棱角都摩挲得光滑无比。她不知道外面的人什么时候来，甚至不确定会不会来。但那份等待本身是很重要的，像怀里抱着一团还没被点亮的东西一样。她的孩子们也学会了这样等，在战壕里，在黑夜里，在补给断掉以后。不慌。还能再撑一个晚上。"
PAM_lili_js_tt:0 "§1等一片落在手心的光§!追加效果：\n"

PAM_xgz_js:0 "§9最后一位醒着的少女§!"
PAM_xgz_js_desc:0 "后来大家都睡了，营房里只剩下风声。但她可从没睡过。她坐在最高的那块礁石上，守着这片充满希望的大海。这份孤独里攒下来的清醒，让她比任何人都更早听见远方的声音。"
PAM_xgz_js_tt:0 "§9最后一位醒着的少女§!追加效果：\n"

PAM_xgz2_js:0 "§9在所有人都睡着的寒冬里§!"
PAM_xgz2_js_desc:0 "我嗓子都喊哑了。结果一个回应的声音的都没有。那些靠在墙上的人我怎么推他们都不动。后来他们站起来了，骨头咯吱咯吱得响，我差点把枪掉在地上。露西莉亚立马拔出了她的剑，直到我看见剑刃上的那抹白光，我这才想起来，我手里也拿着枪呢。对，枪还在。上膛。在这个所有人全都睡了过去的寒冬里，她和我，我们两个就是还能向上窜动的两簇火焰。\n\n所以啊，谁都别想从这儿过去！"
PAM_xgz2_js_tt:0 "§9在所有人都睡着的寒冬里§!追加效果：\n"
#一线民族精神
PAM_royal_co_op2:0 "妥协的王室"
PAM_royal_co_op2_desc:0 "看着那群喷着香水的老东西在我面前瑟瑟发抖，真是一种享受。\n他们以为向我下跪是政治投机？是为了躲避那些喊着要挂路灯的赤色疯子？错，大错特错。\n我留下他们的狗命，不是因为我需要他们的忠诚——那种东西比烂泥还不值钱。我留下他们，仅仅是因为这群肥猪肚子里还没榨干的油水，还有他们手里那些我看不懂的账本。\n只要他们还能像只会下金蛋的鸡一样，乖乖地把钱吐出来给我造大炮，我就允许他们在我的猪圈里再多哼哼几天。但记住了，狼群不养闲人。哪天若是吐不出金子了……那就直接扔进锅里，给我的孩子们加个餐。"
PAM_royal_co_op3:0 "妥协的王室"
PAM_royal_co_op3_desc:0 "看着那群喷着香水的老东西在我面前瑟瑟发抖，真是一种享受。\n他们以为向我下跪是政治投机？是为了躲避那些喊着要挂路灯的赤色疯子？错，大错特错。\n我留下他们的狗命，不是因为我需要他们的忠诚——那种东西比烂泥还不值钱。我留下他们，仅仅是因为这群肥猪肚子里还没榨干的油水，还有他们手里那些我看不懂的账本。\n只要他们还能像只会下金蛋的鸡一样，乖乖地把钱吐出来给我造大炮，我就允许他们在我的猪圈里再多哼哼几天。但记住了，狼群不养闲人。哪天若是吐不出金子了……那就直接扔进锅里，给我的孩子们加个餐。"

PAM_Flesh_golem2:0 "血肉傀儡"
PAM_Flesh_golem2_desc:0 "别用那种看怪物的眼神盯着它们。在我眼里，这只是一笔最划算的买卖。\n活人是要吃饭的，是要穿衣的，受伤了是会疼得大叫的。我的狼崽子们也是血肉做的，凭什么让她们去顶敌人的第一轮机枪？但这些东西？它们不需要面包，不需要军饷，更不需要抚恤金。把那些战场上没人要的烂肉缝起来，再塞进一点莉莉那边的魔法，它们就是最完美的肉盾。\n让它们冲在前面吃子弹，我的狼崽子们就能在后面少流点血，多吃口肉。这笔账，傻子都会算。\n呃……至于材料不够了怎么办？\n去对面“借”点。反正死人留着那一身肉也没用，不如贡献出来，替活人挡两枪。"
PAM_Flesh_golem3:0 "生与死的混合双打"
PAM_Flesh_golem3_desc:0 "“看啊，多么完美的配合。\n死人负责制造恐惧，活人负责收割生命。亡灵的寒气冻僵敌人的手脚，我们的热血烧毁敌人的营房。\n这是只有我索拉娜才能想出来的战术，这是生者与死者最疯狂的共舞！\n让那些自以为是的文明军队颤抖吧！当她们面对这支分不清是人是鬼、杀不完也打不烂的军队时，她们才会明白——在这个世界上，只有这种半死不活的怪物，才是无敌的！”"
PAM_Flesh_golem4:0 "生与死的混合双打"
PAM_Flesh_golem4_desc:0 "“看啊，多么完美的配合。\n死人负责制造恐惧，活人负责收割生命。亡灵的寒气冻僵敌人的手脚，我们的热血烧毁敌人的营房。\n这是只有我索拉娜才能想出来的战术，这是生者与死者最疯狂的共舞！\n让那些自以为是的文明军队颤抖吧！当她们面对这支分不清是人是鬼、杀不完也打不烂的军队时，她们才会明白——在这个世界上，只有这种半死不活的怪物，才是无敌的！”"

PAM_ymjl:0 "野蛮纪律"
PAM_ymjl_desc:0 "“别去征召那些所谓的良家子弟，她们太娇气，挨一顿饿就哭爹喊娘。去贫民窟，去下水道，去那些野狗都不愿意待的地方。\n哪怕她们身上长满了疮，哪怕她们瘦得只剩一把骨头。只要那双眼睛里还冒着绿光，还想吃肉，那就是我要的兵。\n我要把她们从烂泥里拽出来，给她们洗个澡，塞给她们一把枪。告诉她们：从今天起，别再跪着要饭了。想要什么，就自己去抢！就像我当年一样！”"
