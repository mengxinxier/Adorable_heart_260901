PAM_seize_xy_factory_tt:0 "消耗§R5层£GFX_PAM_frz 缝纫值§!，雪伊的旗子插在我们的工厂上。\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTORY$：§R@ZDW夜莺 -5%§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G@PAM我方 +5%§!§R@ZDW夜莺 -5%§!"

