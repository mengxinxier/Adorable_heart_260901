PAM_die_attack:0 "为了让§Y[FROM.getflag][FROM.Getname]§!安睡，请安静下来吧"
PAM_die_attack_desc:0 "昨天晚上我又被吵醒了。\n被那些互相开枪的人……"
PAM_die_equ:0 "把§Y[FROM.getflag][FROM.Getname]§!没人领的东西带回家吧"
PAM_die_equ_desc:0 "那些散落在战场上的铁家伙，原本是谁的来着？记不太清了。主人大概已经不在了，它们就那么孤零零地躺在地里，被雨淋得生了锈，看着怪可怜的。不过呢，我这颗心能听见它们身上还沾着一点主人的念头，有的想回家，有的想再被握紧一次，有的什么都不想，只是不想就这么锈掉。把还能用的捡回来擦一擦，分给院子里还站着的孩子们。不能用的就熔了，做成孩子们的玩具。反正放在那里也不会有人来认领，不如跟我一起回家。"
PAM_die_tec:0 "收集§Y[FROM.getflag][FROM.Getname]§!的念想"
PAM_die_tec_desc:0 "那些不在了的人留下了好多有意思的东西。图纸呀，公式呀，写在纸上的小点子，夹在书里都快发霉了。这颗心让我能读到那些人在写下这些东西时候脑子里一闪而过的光。有的念头很完整，我收进自己的书架上，回头讲给下一个来喝茶的客人听。有的只剩半截，断在某个来不及想完的夜晚，我就把它们带回去给院里的孩子们，她们比我聪明，大概能琢磨出点什么来吧。"
