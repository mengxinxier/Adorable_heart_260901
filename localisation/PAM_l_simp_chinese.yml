PAM_lxly2_diplomacy_desc: "§Y露西莉亚§!\n@PAM§t[FROM.Getname]§!的§t守护者§!\n\n§t露西莉亚之心§!\n  - $MODIFIER_CAVALRY_ATTACK_FACTOR$：§G+20%§!\n  - $MODIFIER_CAVALRY_DEFENCE_FACTOR$：§G+20%§!\n  - $MODIFIER_POCKET_PENALTY$：§G-50%§!\n  - $MODIFIER_AIR_ATTACK_FACTOR$：§G+10.00%§!\n  - $MODIFIER_AIR_FUEL_CONSUMPTION_FACTOR$：§G-25.00%§!\n  - $MODIFIER_AIR_MAX_SPEED_FACTOR$：§G+20.00%§!"
PAM_lxly2_deputy_leader_desc:0 "§L露西莉亚清楚，自己属于另一个早已烧毁的世界。曾经的故事书早就化为了飞灰，她带着夜莺之心，孤身涉水来到这片战火肆虐的荒野上。她曾以为自己可以用温和的笔触重写结局，让所有人都在安稳的梦境里醒来。可现在，门扉敞开了，冰冷的现实像刀片一样割在身上。看着小果子那双不肯低头的眼睛，这位远道而来的骑士终于明白，真正的挽救，是陪着她们在风雪里一同受伤、一同抗争。\n§t即使长剑折断，即使要面对整片荒野的寂静，她也一定要把故事的最后一页，亲手写完。§!§!"

