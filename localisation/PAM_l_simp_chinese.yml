PAM_cqyzxyl:0 "从前有只小野狼"
PAM_cqyzxyl_desc:0 "落雪把林子里的土穴遮得不见一点踪迹。有一只饿极了的小野狼跑了出来，因为害怕夜里的风雪，在冷飕飕的林子里拼命地跑，把一路上的叶子全都踩得七零八碎。大家都怕它，说它是个坏脾气。其实野狼要的并不多，不过是一口热乎乎的粥，和一个可以安稳打盹的草窝。现在，夜莺在树梢上落了下来。夜莺会为它唱一首安稳的歌，风雪就再也吹不进来了呢。"

 PAM_fbywcs:0 "今早的风又把它吹散了"
 PAM_fbywcs_desc:0 "昨夜里，有几个不听话的小淘气包不小心把墙壁给熏脏了。风把烟雾吹散之后，连叶子都累得垂下了头。没关系，夜莺会带着大家，用清水把那些黑黑的痕迹一点点擦干净，再重新画上漂亮的小花。看呀，大家换上了干净的衣服，水渠也修好了，等春天一到，花儿就会开得整整齐齐。"

 PAM_gnllyjwan:0 "给你留了一句晚安"
 PAM_gnllyjwan_desc:0 "听，起风的夜晚，窗子已经关好了。夜莺在安静的走廊里慢慢地走，在每个人的枕边，都留了一句甜甜的晚安，还有散发着甜香的糖果。不要想那些黑漆漆的梦，也不要为明天的太阳担心。因为这本书里的故事很长很长，会把冷雨都挡在外面。闭上眼睛，听话，好吗？"

 PAM_zyjxdxh:0 "一朵不会凋谢的花"
 PAM_zyjxdxh_desc:0 "在温暖的屋子里，我们来找些有趣的事情做吧。人民的衣服上有好多漏着风破洞啊，看着特别可怜呢，不过不用担心，夜莺会提着小篮子，分给他们一捆捆彩色的线。然后再一针一针地在衣服上绣一朵小红花，或者绣一只笨拙的小鸟也行。"

 PAM_gxxszbz:0 "跟着哨子齐步走"
 PAM_gxxszbz_desc:0 "沟壑里的冷雨停了，可风里依然有些吵闹。那些在泥水里乱撞的士兵，可真让夜莺伤脑筋。既然大家认不得路，夜莺就含起一枚小小的木哨，吹出好听的调子。一，二，抬起脚；一，二，落步子。跟着木哨的节拍，排成整齐的长队，像书里的木偶兵一样，在林子里静悄悄地行军。雾散了，肩膀靠在一起，就再也不会走丢了。"

 PAM_ytl:0 "雨停了"
 PAM_ytl_desc:0 "云雾散开之后，路上的积水终于退了下去。阳光落进了我们的院子里，把风里的潮气都晒干了。那些躲在屋里不敢出门的人啊，推开窗户探出头来吧。风里闻不到火味、烟味了哦，风里只有泥土里新草抽芽的好闻的气息。大家都来到这里的屋檐下吧，把你们洗好的衣服全搭在绳子上，让它们随着暖风吹来吹去。"

 PAM_wmhjb:0 "我们回家吧"
 PAM_wmhjb_desc:0 "索拉娜，别再扭扭捏捏了，过来尝一颗刚摘下来的果子吧。外面听不到哭声了，作坊的烟囱里也飘出很多白白的烟呢。在写好的故事里，每个人都在安稳地生活，再也不用再担心寒冬了。热闹的戏演完了，往后的日子，才刚刚开始哦。"

 PAM_slrzhg:0 "可山里还燃着火光"
 PAM_slrzhg_desc:0 "听说，在风刮过的山沟里还藏着几捧不听话的余火。大雪把山路封了，迷路的人聚在了一起，在风里冻得瑟瑟发抖。那些人以为，点起一堆篝火就能把天上的太阳喊回来。让侍从们带上毯子和食物过去吧，去那片不见光的山谷里，把那些快要冻死的孩子，一个一个找回来。"

 PAM_chyjswl:0 "但柴火已经烧旺了"
 PAM_chyjswl_desc:0 "我已经把故事书翻开了，它正等着那些迷路的人呢。别再跑了，外面的雪那么厚，山谷里连个能躲风的草窝都没有。进来吧，解下那些用来防身的刀子与佩枪，靠着火安稳地睡个好觉。我早就为你留好了位置呢。"

 PAM_ghsbzl:0 "拉着手，一起前往下一章"
 PAM_ghsbzl_desc:0 "“卡卡罗姆的山风今晚已经停了。那些抱着柴火、在风雪里打冷颤的人，不用再为了寻找明天的太阳而迷路。夜莺已经为这幕戏定下了结局。卫队带着她们眼中的希望出发，去关上那扇一直虚掩着的门窗吧。去吹散那些快要熄灭的灰烬，去抱着那些无处可去的生灵，送入暖洋洋的屋子里。等天亮了，长长的峡谷里就会长满不会凋落的花。闭上眼睛，故事要讲完了。晚安，索拉娜。晚安，野火。”"

 PAM_dmckz:0 "大门已经敞开"
 PAM_dmckz_desc:0 "原本在厅堂里指手画脚的贵人，如今换了身不合身的衣服，正安分地坐在门槛的小凳上，甚至开始剥起了地里刚刨出来的花生。既然大家都累了，就在檐下歇一歇，听风声慢慢停下来吧。"

 PAM_jbsbql:0 "脚步声变轻了"
 PAM_jbsbql_desc:0 "廊下那阵沉重的脚步声终于消停了。那些习惯了在风雪里摸爬滚打的士兵，如今洗净了脸，三三两两地靠在墙根底下晒太阳，军装敞着空怀，袖口挽得老高。广阔的大地在夜色里缓缓合拢，晚风轻手轻脚地吹了过去，再也听不见任何刀枪摩擦的刺耳声音了，只有远处偶尔传来几声归巢的鸟鸣，还有伙房那边若有若无的、晚饭的香气。"

 PAM_hmxml:0 "闭上眼睛，睡吧"
 PAM_hmxml_desc:0 "山谷里那几捧不安分的火光已经灭掉了哦。在雪地里挨冻的孩子如今都被接回了暖和的屋子里围着炉子打着瞌睡。闭上眼睛睡觉去吧。在这个写好的故事里，不会再有冬天了。"

 PAM_cbddml:0 "茶杯都倒满了"
 PAM_cbddml_desc:0 "看呀，茶杯都倒满了。虽然桌子旁还空着许多位置，但大家衣服上的脏东西都已经洗干净了，屋里也生起了暖洋洋的火呢。索拉娜，去给新来的伙伴分碗汤吧。在这间安详的屋子里，大家终于可以坐在一起，好好地聊一聊了。"

 PAM_tzwyxkyl:0 "同在屋檐下看月亮"
 PAM_tzwyxkyl_desc:0 "索拉娜，闭上眼吧，拉住我的手。这具新化的身体，会一直陪在你我的身边，一步也不会走远。莉莉安娜已经放下了王冠，我也收起了寂静的死气。从今天起，这个吵闹又温暖的世界，是我们共同的花园。死者归于安息，生者迎来黎明。我们手牵着手，坐在高高的地方，安静地看着那轮明亮的月光，直到……故事的尽头。"

 PAM_dckal:0 "小船靠上岸"
 PAM_dckal_desc:0 "海上的风浪总算消停了。在大洋里漂泊了许久的小海鸥，如今在暮色里回到了避风的港湾。不要去想那些风暴与巨浪了，安稳地睡一觉吧。今晚，夜风不会吹进屋里来。"

 PAM_lbwmydf:0 "篱笆外面有大风"
 PAM_lbwmydf_desc:0 "听说，篱笆外面起了大风。那些吵闹的邻居不安分，总要在院门外发出刺耳的声响，会吵醒刚睡下的好孩子。既然窗外的风安静不下来，就在院落四周，多种些带刺的灌木。修好门，关上窗。风雪挡在篱笆外面，屋里新长的花草才能安稳。这不过是为了大家安睡，可不能算是欺负人呀。"

 PAM_qzymwtb:0 "请在院门外停步"
 PAM_qzymwtb_desc:0 "如果，有谁不听劝，非要翻过低矮的篱笆，踩坏刚长出来的小草。那夜莺可就要生气了。守夜的侍从们已经换上了好看的新衣，静静地指在每一个路口。这些听话的士兵不会去抢别人的地盘，可若是有人非要跨过门槛，就不得不请那些不速之客，在风雪里好好睡上一觉了。"

 PAM_ghrzgc:0 "给花儿捉个虫"
 PAM_ghrzgc_desc:0 "听说，北边的阿德莱希生了病，那里的叶子发黄枯萎，天空落了好多黏糊糊的败叶，顺着大风尽往我们的院门缝里钻。这可真是不讲究。好端端的街道，要是沾了脏东西，打理起来是特别麻烦的。别怕，夜莺这就带着卫队去一趟。生了虫子的枝丫，就该用剪子细细剪掉，染了脏污的角落，就得彻底冲洗干净。等捉完了虫，春天开出来的花，才愈发好看呢。"

 PAM_smxyc:0 "神明也嫌吵了"
 PAM_smxyc_desc:0 "听说，北边的神明临走时，把那个曾经威风的使者像坏掉的玩偶一般丢在了雪地里。别哭了，小公主。那些在耳边指手画脚的呓语，今后，再也听不见了。外面的风停了下来，来，就在这里安稳地睡上一觉。神明已经走远了，可这里，还有你的位置。"

 PAM_ssmhcb:0 "绅士们，请回船吧"
 PAM_ssmhcb_desc:0 "大洋对岸的绅士们又来院子前指手画脚了。这可真是不礼貌。那些人以为像从前一样，用几张契约就能分食这里的土地。如果，那些魔法少女执意要和绅士们站在一个台子上，那卫队也只好请那些不识趣的客人在客房里闭上双眼。要是那个总是独自穿梭在时间里的小姑娘当了头领……唔，夜莺很喜欢那双在黑暗里不肯熄灭的眼睛。既然都是在长夜里找路的人，就请坐到我的桌子旁边，一起来喝杯茶吧。新故事的本子很大，容得下两只飞累了的鸟儿。"

 PAM_mtyyynh:0 "明天也一样暖和"
 PAM_mtyyynh_desc:0 "夜风吹过去，院子里的花全都开了。索拉娜，去给刚醒过来的新来者分块糖吧。战火歇了，大雪停了，街上重新摆好了供人们吃饭喝茶的桌子。这一次，连那个在海上漂泊的小果子也回到了避风的座位。大家终于可以永远地聚在一起了。安稳地将故事书合起来吧。明天的太阳会照常升起，而且，明天也一样暖和。"
 PAM_mtyyynh2_tt:0 "§1听说你最近在战场上很顺利，那这个就当作胜利的纪念品。它一直挂在你对手的剑穗上，你每次挥剑的时候它都在看着你。可别嫌它小，它帮你挡了好几颗子弹呢。不信你摸一摸，上面是不是有几道很浅的划痕？那都是我在替你操心的时候不小心留下的。§!"


 PAM_dzedzfh:0 "肚子饿得真发慌"
 PAM_dzedzfh_desc:0 "肚子饿得发慌，胃里的酸水不断向上涌着。隔壁庄园里的灯火亮了整夜，风里送来烤牛肉和新面饼的香气。那些戴着金饰、喷着香水的贵人，在大殿里开怀大笑，却连一小口发霉的剩饭，都不肯扔到篱笆外面。当时便咬着牙发誓，等哪天能站起来了，定要让那些坐在高椅上的贵人，也尝一尝在大雨里饿到发疯的滋味。"

 PAM_zylmsr:0 "庄园里埋着死人"
 PAM_zylmsr_desc:0 "公爵写字的手很干净。卡纸上盖满了一圈圈印子，就像是刚流出来的血一样。公爵甚至不用亲自去挥鞭子。只要随手勾一勾笔，整个村子要交的麦子就翻了番，几十个孩子就要饿死在雨天的稻草堆里。在那些高贵者的眼里，穷人的性命贵不过一张废纸。穷人成了一行行可以随意勾销的数字，是用来换取金钱的干柴。这笔血债，公爵府的人算得很明白，可底下的死人，也算得很明白。"

 PAM_mymzbcj:0 "磨一磨这柄长剑"
 PAM_mymzbcj_desc:0 "屋里很暗，灶膛里的一点火星早就熄了。长剑在石头上来回打磨着，发出刺耳的摩擦声。这声响在夜里听着清晰无比。公爵府的老爷们以为，挨了打、被抢了口粮的叫花子，只会躲在阴沟里咽气。可饿极了的野狼，只要还有一口气在，就会咬断路人的脖颈。我要洗净手上的血，让这生锈的剑刃，重新获得能够切开皮肉的锋芒。明晚，大家要去夺回属于我们的粮食。"

 PAM_xzxlh:0 "血债血来还"
 PAM_xzxlh_desc:0 "既然大雨洗不脱脖子上的血印，那就用长剑把这笔账算个清楚。我握紧刚抢回来的钥匙在夜色里高高举起。人们拿起钢钎和木棍跟在我的长剑后面。让孩子们吃上热饭，让大家在屋里睡个安稳觉。至于庄园里欠下的债，血债血来还。"

 PAM_lsys:0 "让我们来算一算"
 PAM_lsys_desc:0 "灯火摇晃，映着铺开的图纸。原本在贫民窟里长大的孩子，如今穿上了军团挺括的制服，指梢在粗糙的纸面上缓缓移动。风往哪边吹，哪里的山石容易剥落，看一眼，就全记在脑子里了。军官们都夸那是天生的奇才，送来成箱的黄金。可每当她手掌按着纸卷，听着帐篷外面传来的靴子摩擦声，心里却落了一层怎么也拂不去的灰。图纸上随手画下的线条，到了明天，都会变成流满鲜血的壕沟。那些所谓的完美伏击，底下垫着的，全是活生生的人。这笔沉重的债，该怎么算呢？"

 PAM_cyjz:0 "长夜将至"
 PAM_cyjz_desc:0 "红线落在山脊上画得笔笔直直。年轻的参谋的确指出了正确的路，也找准了唯一的突破口。在天亮后的大雨里，这道红线会变成重炮合拢时的圈套，堵死所有生路。军官们会因此弹冠相庆，在长桌旁高声吹捧这神乎其技的远见。可她的手还在不听使唤地打颤。笔尖划过的地方，风在外面吼着，那些无处可去的生灵，今晚是最后一夜睡在木屋里了。既然已经交出了答案，就只能闭上双眼，等候长夜彻底黑下去。"

 PAM_hglcp:0 "火光连成了片"
 PAM_hglcp_desc:0 "雨幕里，南边那座堆满谷子的库房突然亮起几道红光。火舌沿着木梁往上爬着，浓烟在黑夜里铺展开来，连大雨都无法将其浇熄。公爵府的看守临逃前往里面扔了火把。既然带不走粮食，老爷们便下了狠心，要将满仓的麦子烧成灰烬。火光侵染着整片天空，烧焦的烟气把风熏得呛人无比，那是人们绝望的起点。"

 PAM_tlyq:0 "天亮以前"
 PAM_tlyq_desc:0 "雨落在大屋后面砸出了浑浊的印子。废墟上空旷无比，这里的粮食已经都烧干净了。一个个湿透的衣衫贴在一个个人的脊背上，发梢的水也一滴滴流进了她们的眼睛里。原本该带回营房的人们，如今就在眼皮底下等着，等候着绝望给予她们最后一击。功劳就在跟前，只要把这些人押回去就能到手。可我握着缰绳的手，到底还是没能抬起来。毕竟，天亮以前，总要有人为这些迷了路的人，寻找一条出路。"

 PAM_zswmdqz:0 "这是我们的旗帜"
 PAM_zswmdqz_desc:0 "教堂地窖里潮得厉害，墙角长着些暗绿的霉斑。工人们聚在油灯底下，椅子上堆满了从罐头厂带回来的围裙和从码头扯下来的麻袋片。既然路口被封死了，连讲道理的嘴都被捂住了，我们就用双手去拼一条活路。我从挎包里摸出缝针，将这些零碎破布缝在一处。红的，蓝的，拼成了一面宽大的旗子。等这面布旗升起来的时候，炉子里的火，就会变成烧透整片荒原的野火。"

 PAM_hwzjsqll:0 "怒火终将燃起"
 PAM_hwzjsqll_desc:0 "火生起来了。沉寂了许久的烟囱，在夜色里吐出了第一口白烟。拉响汽笛的人就站在阀门旁，满脸是汗地冲着外面招手。监工的皮鞭和锁链丢进煤堆里化成了飞灰。拧开这沉重的阀门吧，要让这火光，照亮整个街道。"

 PAM_cmzslh:0 "参谋长也说了谎"
 PAM_cmzslh_desc:0 "地窖的桌上搁着一顶缀着银鹰徽的军帽，那是军团参谋长的身份。晓枫低着头，双手在布带间交错，缠在伤口上不声不响。一旁的雪伊靠在门框边，随手折断了一根柴火。\n“天就要亮了，长官。”雪伊拍了拍手心里的木屑，语气里带了些嘲弄，“军团的报告上，只写着‘全歼乱党’。可这地窖里却藏着那么多活人，回去要怎么交差呢？”\n晓枫收回手抚平了布带的褶皱。\n“公爵要的是结果。至于纸面底下多出几个活人，没人会闲的没事去数的。”\n原本要在街头交锋的军团参谋长与起义首领，如今在这间昏暗的地窖里，悄悄捂热了这桩欺瞒军部的大谎。"

 PAM_dysxxq:0 "等雨声小下去"
 PAM_dysxxq_desc:0 "风刮得没先前那么凶了，门槛上的滴水声断续作响。索拉娜睡得并不安稳。雪伊在灶底添了几块碎柴，让火星在暗处不断亮着。这间避风的地窖里很静。工人们都靠着墙根打盹，谁也无力再说闲话。大家都在耐心地等，等外面的风雨小下去。等明天，或者等天亮以后。"

 PAM_zlyzhaj:0 "这里一直很安静"
 PAM_zlyzhaj_desc:0 "在这座城堡里，从来听不见风声。圆月高悬在半空，银光将走廊里雕刻的水晶花照得晶莹无比。莉莉安娜正独自坐在空旷的厅堂里，这里的挂钟停止了摆动，这里的纸页上落满了灰尘。莉莉安娜的世界，唯有无声的平静。尘世的喧嚣进不来这片净土，谁也不会来惊扰这份安宁。"

 PAM_bzlxzty:0 "书本里写着太阳"
 PAM_bzlxzty_desc:0 "翻开图本，纸面上写着“太阳”两个字。在古老的故事里，太阳升起来的时候，连地上的青草都会染上光芒。可在这里，抬头看去，唯有一轮无声的圆月。不曾见过太阳的人，画不出暖和的颜色。莉莉安娜闭上双眼，试着去想象，那个被阳光照亮的世界，究竟会是什么样子。"

 PAM_gflzysc:0 "给风留着一扇窗"
 PAM_gflzysc_desc:0 "书本上写着，风会带着落叶与花香，去到很远的地方。莉莉安娜走过无声的回廊，拉开门锁，推开了那扇窗户。窗外是寂静的深谷，可莉莉安娜知道，只要一直留着这道门、这扇窗，终归有一天，那个太阳会顺着风落到自己的肩膀上。屋里不再那么冷了，故事的下一页，正等在暗处呢。"

 PAM_nstym:0 "那是太阳吗"
 PAM_nstym_desc:0 "静止的池水里，泛起一抹亮光。空气里的寒意散去之后，身子也暖和了起来，不再那么沉甸甸的了。莉莉安娜快步走到窗前向外张望。外面空荡无声，不曾有谁走进来，也不曾有谁敲门。太阳未来，这不过是遥远的温度，在深谷里吹过时的余音。"

 PAM_hlslgz:0 "那是个风雨交加的海岸"
 PAM_hlslgz_desc:0 "海上的风很大。一艘破烂木排在浪里起伏，在夜色里靠上了石滩。巡逻的士兵在沙滩上，捞起了一个衣服湿透的丫头。这丫头小腿上蹭破了皮，伤口糊着沙子，怀里抱着个包，里面揣着半颗啃了一半的酸果子。劝了许久，这丫头就是不肯松手，一双眼盯着哨兵，防备得很紧。把她送回营房里后，我给盛了一碗热水，她也还是靠着墙壁一动不动。往后，这片海岸，大概要多一个吹口哨的兵了。"

 PAM_hfyxfx:0 "请把大海守一守"
 PAM_hfyxfx_desc:0 "小果子手里抓着一个铜哨。海浪一下接一下拍打着她脚底下的石块。含起哨子，鼓起腮帮子，却一点也吹不响，吐出来的全是泄出来的粗气。可这小丫头不服输，一遍接一遍地试着。终于，哨声透过了海雾，在海面上清脆地荡开。就连海鸟都随着声音在头顶飞旋，最终降落在了她的肩膀上。瞧，小果子已经学会在风里，守着这片海了。"

 PAM_hlajxll:0 "雪花落下之时"
 PAM_hlajxll_desc:0 "今天，海浪安静下来了。小果子坐在石堆顶上一动不动。原本吵闹的洋流，在这一刻连水花都平息了。天空中无声地落下了雪花，落在被海水浸湿的衣袖上，化作了一个个湿印子。那些从天而降的寒气，怎么也钻不进这具在海风里吹透了的身体。远方的街道正在变冷，那些熟悉的人也正在闭上双眼。可小果子，依旧在海风里，清醒地看着这一切。"

 PAM_zsxfs:0 "只剩下风声"
 PAM_zsxfs_desc:0 "那些曾一起看海、在风雨里相互依偎的兄弟姐妹，如今都安静地睡去了。营房里彻底安静了下来。在这片寂静的海岸上，只剩我一个还能听见风声的人了。"

 PAM_cdcgdw:0 "车灯就这样穿过了大雾"
 PAM_cdcgdw_desc:0 "车门关严了，发动机沉闷地发动起来。两道车灯穿过大雾，将前面的山路照得晃眼。晓枫两手扶着方向盘，一言不发地盯着前方。小果子坐在旁边的座位上，望向车窗外肆意翻飞的雪。已经无路可退了。我们必须离开这片长眠的营房，在黑暗的荒野上，寻找一条生者的路。"

 PAM_nxxc:0 "南行小船"
 PAM_nxxc_desc:0 "发动机的声音沉息下来。车门刚刚推开，海风便送来了潮湿的凉意。在码头尽头，正有一艘小船在波浪里起伏着。这里的海水尚未结冰，浪花拍打着船舷，发出一声又一声的钝响。晓枫反手掩上车门，拎起那个沉甸甸的布包踩在了栈桥上。小果子低着头跟在后面，任凭雨水浇透了衣衫。因为海风还在吹着，因为水还在流动着，逃亡的生路，就依然在前方。"
 PAM_nxxc_tt:0 "§1哭的时候，它会把眼泪接住，一颗一颗攒着。等你睡着以后，再偷偷运回来给我。我拿这些眼泪浇过花园里的花，你想不想知道那些花开成了什么颜色？是一种又晶莹又透亮的蓝色，跟你眼睛里的光一模一样。所以每次有人难过，我的花就开得特别好。你说，这是不是一件很奇妙的事。§!"

 PAM_hsdslyj:0 "一张船，一双桨，和一个人"
 PAM_hsdslyj_desc:0 "小果子缩在窄小的船舱里，双手握着桨在风浪里吃力地划着。\n岸边那些哨塔的灯火，在浓雾里已经退了下去，再也看不着了。\n寒意在水面上漫过来，可揣在怀里的那颗酸果子，仍然带着些许暖意。\n狂风在耳边尖啸，小船在夜色里一沉一浮，朝着不见光的深海不断飘去。现在这里只留下了一张船，一双桨，和一个人。"

 PAM_hhkl:0 "快看，这里的花开了"
 PAM_hhkl_desc:0 "大雨落了一整夜，天亮的时候，风声总算小了一些。\n小果子走出石屋去岸边打水。\n在礁石缝里，积着一些枯黄的草叶。\n而在那些草叶底下，一抹红色晃了晃。小果子走过去蹲下身，拨开杂草，才看见一朵开在石缝里的红花。\n花瓣有手指大小，在风里固执地昂着头。\n海面上风还在呼啸，可这朵小花，却固执地绽放着。生者的路，到底是有希望的。"

 PAM_zhnhl:0 "现在真的很暖和"
 PAM_zhnhl_desc:0 "露西莉亚并不气馁。解下领口那枚红色挂坠，平稳地递到小果子的手心。\n发着红光的宝石落在掌心，散发着一股暖和、令人安稳的热气。\n在这座寒意彻骨的礁石岛上，这抹光亮如同刚生好的炭火，熏得手上的伤口也有些温暖。\n小果子到底还是让那枚宝石留在了掌心里。\n在夜莺之国那层寂静的风雪里，这是唯一躲过冻结的、属于活人的温度。\n书上写好的剧本漏了缝隙，而这出戏的生路，如今就握在两个不肯认命的丫头手里。"

 PAM_hgfxh:0 "过来，我们换个方向划"
 PAM_hgfxh_desc:0 "风向变了。海水里的凉意退了下去，风从对岸刮了过来，带着一股被太阳晒过的土味。船头在海浪里转了个圆，身后的礁石岛越来越远，直到被灰蒙蒙的白雾遮住。小船载着两个人，顺着翻滚的白浪朝着老码头的方向赶去。哪怕那里现在连个说话的人也找不着，哪怕到处都静得吓人，也得划回去。不能让大家就这么一直睡着。得回去，把认识的人一个接一个全叫醒。"

 PAM_ltc:0 "老铁厂"
 PAM_ltc_desc:0 "水面飘着一层彩色的油花，倒映着岸上高耸的烟囱。小船在荒废的渡口旁靠了岸。空气里多了一股煤烟与铁器的气味，熏得人眼睛都睁不开。露西莉亚将长绳系在铁栓上，当先跨上岸去。小果子抱着胳膊跟着跨上潮湿的台阶。前方的石墙高大无比，厂房里落满了灰尘，不见半个活人。可听说，那些不服输的工人和水手，如今都缩在底下的防空洞里，靠着残存的煤渣避寒。等身上湿透的衣裳烘干吧，干了之后，大家再来商量，往后该怎么办。"

 PAM_tl:0 "退路"
 PAM_tl_desc:0 "子弹打光了。过道里全是震落的灰，呛得人直咳。那些死者的手快要够到眼皮了。我丢开打空的长枪，单手拽住墙上的拉杆。锁栓一脱，大块碎石轰然砸落，堆成一道矮墙，把那些亡骸和呛人的灰一并封在了对面。尘烟落定，身后的路已经没了。眼前只剩一条通道，往山腹更深处去。"

 PAM_sxhy:0 "杀向黑夜！"
 PAM_sxhy_desc:0 "那团炙热的执念撞入冷铁，沉寂多年的蒸汽在铁管中疯狂涌动着。小果子拉下阀门，撕裂长夜的啸叫立马冲上了云霄。幻梦在这一刻寸寸崩裂，温度骤降，露出了被霜雪覆盖、残破死寂的真实铁厂。成群的亡灵在厂房外缓缓转过头颅，而我们，无路可退。"

 PAM_bllldy:0 "兵临莉兰迪亚堡"
 PAM_bllldy_desc:0 "能用的枪没剩几杆，身边这几百个刚泼醒的贵族，连路都走不稳。现在得去把那个还在睡梦里的暴君拉起来，才能穿过城堡外的防线。小果子讨厌她，可要在这片冰天雪地里活命，眼下只能借那家伙的蛮劲。"

 PAM_cxsqbc:0 "踩着雪水去白城"
 PAM_cxsqbc_desc:0 "索拉娜一路上都在数落雪伊当年的倔脾气。小果子端着枪跟在旁边，也和她拌了一路嘴。城堡的石砖凉透了。接下来的生路在白城，雪伊就守在那座旧兵营里。夜莺的梦境落下来之前，雪伊就是守在那儿的。得把那个固执的家伙拉起来，才有人手去把剩下的同伴纷纷摇醒。"

 PAM_hsgq:0 "回到卡卡罗姆"
 PAM_hsgq_desc:0 "白城的兵营空了，雪伊姐不在里面。索拉娜倒是醒了，可她现在缩在那身娃娃衣服里，一路上光跟我们生闷气，别想指望她。我和露西莉亚得带着人往卡卡罗姆赶。那里是晓枫姐起事的地方，山谷底下到处是废弃的矿道。当年野火的兄弟姐妹们常往里面躲，晓枫姐说不定就带着雪伊姐藏在哪个坑道里等着呢。得去把她们翻出来才行。"

 PAM_zhdybzy:0 "直到故事的最后"
 PAM_zhdybzy_desc:0 "山谷尽头横着一堵死寂的灰墙。大雾凝成了实心的壁垒，把生者的大地与夜莺的无声国度彻底隔断。小果子端着枪一轮轮打过去，露西莉亚挥剑劈了又劈，弹头和剑刃撞上去，连一道白痕都留不下来。夜莺已经把门封死了，她想让这场风暴永远在外面呼啸……"

 PAM_hjhjyq:0 "很久很久以前"
 PAM_hjhjyq_desc:0 "那本写着灰暗结局的故事书翻到了最后一页。露西莉亚独自坐在了寂静的王座上。夜莺散去了，这片冰冷沉寂的冥界如今成了她身体的一部分。那些死在雨夜里的遗憾，那些随风落下的哭喊、痛苦与执念在暗处累积，尽数堆积在她的胸口。她替整个世界收留了寒冷，好让活下来的人走在温暖的阳光里。往后的长夜中，她会一个人留在此处，将这个漫长的童话守到最后。"


 PAM_hjb:0 "回家"
 PAM_hjb_desc:0 "我一刻也不敢让自己停下来。大殿门前刚立好那两座新坟，我不敢回头去看。一闭上眼，脑子里就全是落满积雪的大地上流淌的血水。那些被强占的地盘和碍眼的界碑，干脆都扔进火里烧掉好了。等那些被关了很久的人都能平安回家，露西莉亚看到这个结局，肯定会醒过来的吧？晓枫姐，雪伊姐，你们也会看见的，对不对？"

 PAM_djdychd:0 "大家都要吃好的"
 PAM_djdychd_desc:0 "上区的仓库里堆着成山的麦子。以前那些贵族宁可让粮食烂在库房里，也舍不得分给底下的人。小果子把仓库大门推开，分发给在雪地里发抖的饥民。大人一斗，娃娃一升，大家都吃得饱足，肚子饱了，心口也就暖了。\n\n§9我一刻也不敢让手心空下来。我脑子里全是那一枪打出去的声音。我要去搬面粉，搬得浑身是汗，搬得骨头都要散架，这样殿门前的那场梦就缠不上我了。§!"

 PAM_ajahswn:0 "挨家挨户送温暖"
 PAM_ajahswn_desc:0 "风在街上打着旋，把我的眼泪都冻在睫毛上了。我不要闲着，一闲下来，那种死寂在心里压着的触感就又回来了。把老厂里堆着的那些石炭都分发下去，挨家挨户送。烟囱里升起烟，屋里就热了。大火烧起来，暖气会把一切都烘得松松软软。等大家身上都暖了，露西莉亚看到烟，也会醒过来了吧。"

 PAM_fzbhdyf:0 "请缝好避寒的衣服"
 PAM_fzbhdyf_desc:0 "作坊里有成捆的棉纱和毛线。小果子把那些织布机都转起来，让巧手的妇人赶工。剪刀裁开布料，针线穿过去，缝出挡风的衣服发下去。穿着衣服去街上走，风就吹不透了。这才是活人该有的体面。"

 PAM_jdjrz:0 "教大家认几个字"
 PAM_jdjrz_desc:0 "莉兰迪亚的大家大都大字不识，领工钱的时候经常被那帮老爷骗。小果子在营房里摆开了小凳，让读过书的先生教孩子们认字。学怎么看路牌、怎么算账目、怎么写自己的名字。懂了这些，以后走在街上，就再也无人能糊弄她们了。\n\n§9我教那些孩子认字的时候，总觉得只要读书的声音再响一些，那一晚的枪声就能被彻底盖过去。雪伊姐以前总嫌我马虎，可惜以后，再也不会有人来敲我的手背了。§!"

 PAM_bhzlhl:0 "孩子们，都回来吧"
 PAM_bhzlhl_desc:0 "废墟里还有许多无家可归的小孩子，缩在倒塌的板壁底下发抖，活脱脱就是当年索拉娜的翻版。我绝不让他们也死在雨里。把那些空屋子都收拾出来，让他们住进来。每天管饱，有热汤喝。等露西莉亚醒了，看见这些孩子在院子里笑，她心里肯定也是甜的。"

 PAM_gsdzhyy:0 "我希望这是一个温柔的故事"
 PAM_gsdzhyy_desc:0 "我们已经把这个世界变得很美好了。被强占的土地还回去了，挨饿的孩子吃饱了，街上已经全都是温暖的笑声啦。露西莉亚，我把一切都做好了，你想要的温暖结局，我已经替你拼出来啦。现在，我守在你的身边，拉着你的手。阳光照进屋里来了，你也该醒了。睁开眼吧，露西莉亚。"

 PAM_qzdyd:0 "请再给我一点点时间！"
 PAM_qzdyd_desc:0 "既然写书的人想让这一幕草草收场，那我就化作最后一滴浓墨，强行替大家把这崩裂的结局再往后拖延几个篇章。这份力量很沉重，沉重得压弯了腰，也染白了这满头的长发。可是看啊，前线的喧嚣声、大家的哭脸，每一个还在风雪里挣扎的身影都系在了我的身躯之上，我会守在这里，守到时间的尽头，大家……都还没到闭上眼的时候。"
 PAM_qzdyd_tt:0 "§t刷新此国策的可用次数§!"

 PAM_djll:0 "大家累了的时候，是有地方可以放下的"
 PAM_djll_desc:0 "我能感应到那些顺着大地传过来的律动。有人在夯实地基，有人在播种麦粒。那些劳作而发酸的肩膀，那些看不到明天而生出的胆怯，顺着心的红芒，都被我温顺地抱在了怀里。大家尽管去忙碌吧，去在这片荒原上盖起屋子，去种满庄稼。我替大家记着这些累，替大家守着这些怕。"

 PAM_qgsw:0 "你们想去的地方"
 PAM_qgsw_desc:0 "路边的车马声在耳畔响了一整天。大家聊着春耕的种子，算着给邻里送去的谢礼，这声音里满是凡间的生机。我在这坐着，听大家讲那些琐碎的家常。我愿将选择的权利交还给每一个在长夜里赶路的人，我仅仅是想做一柄在这荒原上撑开的伞。你们想去的地方，便是我落笔的方向。在这场梦结束之前，我会护着大家，一直走到天亮。"

 PAM_djdz:0 "其实大家一直都在呢"
 PAM_djdz_desc:0 "每一处折痕、每一道划线，其实都还留着大家手心里留下的余温。这些念想从未走远，它们化作了土里的根，变成了风里的歌。大家辛苦开出来的这段路，从不该在此处了断。我收拢了这些被遗落在记忆里的笑容，让它们重新落进每一个赶路人的身心里。前方的雾气散了，回头望去，原来我们这一路，始终都是结伴走着的。"
 PAM_djdz_tt:0 "如果§9@MGU魔法少女联盟§!是我们的§Y盟友§!，她们将同样能获得将领角色的加成效果。"

 PAM_btsh:0 "帮她生生火吧"
 PAM_btsh_desc:0 "雪伊在那间阴冷的地窖里待了这么久，骨头都快要冻僵了呢。身为她的同伴，你肯定也舍不得看见她受罪的样子吧？去帮她把炉子生起来，等到火苗亮起，大厅里也会变得温暖起来的。你真是个体贴的好孩子。"

 PAM_djyq:0 "大家要守在一起呀"
 PAM_djyq_desc:0 "外面的风雪里，那些影子正在靠近。既然已经点燃了希望，那便要有足够多的武器来护住这团光亮。请把沉睡着的将士们都喊醒，让她们守在每一个路口。看着你为了同伴这么忙碌，我真的很开心。再努力一下下，雪伊就能听到她心心念念的那个声音了。"
 PAM_yjsy:0 "迎接那个声音"
 PAM_yjsy_desc:0 "汽笛的拉杆就在手边，雪伊咬着牙撑到现在，便是为了等这个声音。去拉响它吧，去迎接你以为的黎明。我会一直看着你，直到故事合起的最后一秒。你为了她付出的每一分汗水，我都记在心里了哦。"

 PAM_qqh:0 "若是能躲过这一场大雾……"
 PAM_qqh_desc:0 "街道边的光亮快要熄灭了，恐惧和倦怠压在心头，大家聚在屋子里，开始聊起一些不着调的传闻。那些关于如何躲过长眠的鬼话，起初仅仅是为了排解压抑才编出来的玩笑，讲的人想必也没打算当真，可这股子还留有温度的话语，终究还是传到了每个人的耳边。毕竟大家都盼着有个宣泄绝望的出口，这种荒诞的话题反倒让大家聚得更紧了才对。"
 PAM_qqh_tt:0 "§1啊！快看！这里有一根头发。你是不是在想，这有什么好藏的。可是你看，我把自己的头发和你的头发编在一起了，绕成一个小圈，夹在这一页里。你的头发是深色的，我的是浅色的，缠在一起像不像两条细细的溪流汇到一块？你来摸摸看，比单根的头发结实多了。我们两个的事，一根头发记不住，两根缠在一起就记住了。§!"

 PAM_szndm:0 "就再陪大家一分钟好了"
 PAM_szndm_desc:0 "紫雾顺着门的缝隙钻了进来，这时候总要有人站出来的。尽管脑海里那个温柔的声音一直在劝自己睡去，她们依然靠着那份偏执的牵挂，将自己的整个身躯都压在门上。她们仅仅是凡人，却要在这一分钟里去和神明的梦境争个高下。因为啊，她们守护的，是门后那些还在颤抖的大家呢。"

 PAM_hddxw:0 "那便相信这是一个奇迹吧"
 PAM_hddxw_desc:0 "当保护大家的人也闭上眼，剩下的人们便因为绝望而陷入了泥潭。这时候，那个原本被大家嘲笑的玩笑，竟然成了大家唯独能抓住的救命稻草。这是一种随着过度恐惧而生出的荒唐，也是一种不忍心看着同伴心死而撒下的、带着泪水的谎言。"

 PAM_qscy:0 "不准把长夜带往别处"
 PAM_qscy_desc:0 "在那些遥远的角落里，还有别的死者在躁动，还有不安分的幽灵想要去侵占生者的土地。既然大家都已经在这片风雪里受够了冻，那便更不该让那些无辜的人，也落得跟我们一样的下场。死者就该有死者的去处。不管是谁，若是敢把寒冬带到别处的暖屋前，我们便去敲碎它们的骨架，送它们回到泥土里继续安睡。"
 PAM_qscy_tt:0 "§Y[DVL.getflag][DVL.getname]§!以及他的盟友，每控制一个领土，都将让我们多获得一点£GFX_PAM_am 安眠点数，最多50点"
 PAM_fwrt_wwtls:0 "分一碗热汤，问问同路的事"
 PAM_fwrt_wwtls_desc:0 "雪伊姐以前常跟我说，天下所有缝着红布、手里拿枪的人，脾气都很臭，但也都是硬骨头。后来我打碎了梦，亲手把姐姐们埋在了大殿门前。我现在替她们守着这个家，教孩子们认字，帮大家生火。我听人说，你们也在远方和那些穿黑靴子、把粮食烧成灰、把活人当柴火烧的法西斯坏蛋打仗。当年庄园里的老爷就是这么抽我们皮鞭的。那些法西斯，和我们这儿的坏蛋是一模一样的心肠。\晓枫姐也说过，只要是跟这群吃人怪物拼命的人，就是我们的兄弟姐妹。我们工厂里的炉子已经烧红了，地里也有了新收的麦子。如果你们的前线缺枪、缺鞋子、缺暖和的被子，就跟我们说一声。\n\n我们没什么大道理，但只要你们还在把那些坏蛋往后推，莉兰迪亚的后背，就替你们守着。"
 PAM_fwrt_wwtls_tt:0 "\n如果对方§G接受§!:"
 PAM_fwrt_wwtls_tt2:0 "\n如果对方§R拒绝§!:"
 PAM_fwrt_wwtls_tt3:0 "\n世界上每存在一个独立的§R共产主义§!国家都将让我们获得:"
 PAM_fwrt_wwtls_tt4:0 "\n世界上每存在一个独立的§B民主主义§!国家都将让我们获得:"

 PAM_ttbz_zwdny:0 "听听报纸之外的声音"
 PAM_ttbz_zwdny_desc:0 "报纸上每天都印着许多热闹的词，议员们在台上讲着自由与秩序。露西莉亚说，能让街上没有枪声、让大家坐在一起说话，是个挺好的念想。但我们这儿的人受过冻、挨过饿，我们知道很多漂亮话在大雪天里救不了人。你们在大洋那边做生意、开议会，我们不打算指手画脚。但那些靠着屠杀和铁靴横行霸道的法西斯野兽，正踩着别人的土地。如果你们也恨那些把人当奴隶的坏蛋，那我们可以在路口放几张凳子，坐下来谈谈怎么把生意做平，怎么把边界守稳。我们不要你们的教导，也不要高高在上的捐舍。如果你们愿意把车马停在篱笆外，捧起热茶，那你们就是客人。如果你们想带着枪和契约来把我们当成下一块肥肉……露西莉亚的剑还在墙上挂着呢，这片土地上的风，可比你们想象的要冷得多。"

 PAM_zgghrj:0 "梦境归于死者\n黎明留给人间"
 PAM_zgghrj_desc:0 "夜莺的书里什么都有。那里有放凉了也不变味的热茶，有踩在泥里也不沾脏的皮靴，有永远听不到枪声的街道。可那里唯独没有活人的味道。\n\n那里没有切菜划破手指的刺痛，没有大雨浇透后两个人挤在草堆里的体温，没有雪伊姐热烘烘的嗓门，也没有晓枫姐的叹息。那些被神明当成痛苦而抹掉的东西，其实全都是我们活过的证据。我打碎了那本假书，亲手把姐姐们埋在了大殿门前。我不躲了。我每天早上推开窗，给土坟上的红花浇水，跟她们讲讲今天作坊里发了几袋面粉，讲讲孩子们算数又算错了几个数。我这双手扣过扳机，流过血，但现在，这双手能用来搬东西、缝衣服、能拉住露西莉亚凉透的手。露西莉亚替这个世界守着冥界的冷，那我就守着她。我们不上什么王座，也不当什么高高在上的英雄。人活在世上，就是要流汗、要挨冻、要在大雨里跌倒再爬起来，要痛痛快快地哭，也要热热闹闹地笑。\n\n风是冷的，脚下的泥是硬的，但人们家里的炊烟是热的，锅里的粥是香的。晓枫姐，雪伊姐，你们看到了吗——\n我们把这个家，给守下来啦。"
 PAM_no_fascism_in_world_tt:0 "世界上不再存在任何§Y法西斯主义§!政权"

 PAM_djdhj:0 "大家，都回到了这个家里"
 PAM_djdhj_desc:0 "远方的炊烟，近处的街道，所有的地方如今都并在了同一个屋檐下面。\n大家再也不用出门赶路，再也不用去思念遥远的家乡。因为所有的家，如今全都凑到了一起。\n没人再喊痛，没人再离去。\n大家挤在这个偌大的屋子里，围着同一个不再熄灭的火堆。世界缩得那么小，小到唯有这间不再黑下来的屋子。\n所有的人都在这里了。所有的欢笑与哭泣，都在这里归于沉寂。\n再也不会有人走丢了哦。\n一起睡在这个再也不会醒来的梦里吧。"

 PAM_xgjjzw:0 "献予死者之王的花冠"
 PAM_xgjjzw_desc:0 "那位由白骨铸就的国王矗立在远处，身侧围着数不清的漆黑亡骸。\n别处的人看见那些骨头，吓得连门都不敢开。可大家在这片土地上流过太多血，比谁都清楚，能在暴风雨里替平民挡住刀剑的，就是真正值得依托的力量。\n当远方的魔物与恶徒横行的时候，是那位领袖张开了庞大的披风，把所有袭来的枪炮与杀意隔绝在外，把肆虐的魔物尽数消灭。在他的城墙下面，孩子们能在草地上做游戏，夜晚的街道不再有惊控的尖叫。\n所以，大家牵着手，走到了那座高高的殿门面前。\n大家拿不出虚伪的阿谀，那不是活人给庇护者的东西。\n大家把春天里刚采摘的鲜花编成花环，挂在了骨头卫兵的盾牌上面；大家让懂音乐的孩子们站在广场中央，为那些冰冷的铠甲唱起响亮的歌；大家把仓库最里层酿好的甜浆果汁，毫无保留地装满车厢送去大殿。\n活人的欢笑、真诚的歌声，还有永不熄灭的迎客明灯——这就是大家给那位孤独国王的回报。\n从此以后，大家的家园落在了白骨国王的羽翼下面。\n愿冰冷的寂静里，也能盛开活人栽下的花朵。"

 PAM_sqwy:0 "荡开高悬在穹顶之上的黑云"
 PAM_sqwy_desc:0 "北边与中部的山谷里，长久以来都盖着浓重的黑云。\n那里的恶徒与财阀建起高高的围栏，把穷苦的人们当成牲口使唤，枪声与哭喊声每天都在街巷里响个不停。\n既然那位白骨国王已经立下了保护大家的誓言，我们就跟着那些高大的漆黑将士一道踏上征途。\n大家的队伍开上前线，不图金银，不求威风。唯独要把那些作威作福的暴君与恶霸推倒，把锁在平民身上的铁链彻底砸碎。\n不论是北方的港口，还是中部的雨林，当魔导国的旗帜升起的时候，所有的折磨与战乱都将归于安宁。\n大家要让那片土地上的孩子们，也能像我们一样，在没有恐惧的阳光下平安地长大。\n跟着白骨的军阵往前走吧。\n去把那片大陆上的黑夜，彻底打扫干净。"

 PAM_zymyqs:0 "这里不会再有枪声了"
 PAM_zymyqs_desc:0 "北边的风沙停了，中部的雨林安静了下来。\n曾经横行在街巷里的恶霸不见了，那些架在城墙上的炮口如今落满了灰。\n白骨卫兵安稳地立在交叉路口，守护着来往的车辆；大家带去的队伍在街角搭起避风的木棚，给刚走出来的平民分发大米与伤药。\n孩子们拉着同伴的手在街上跑着，再也不用听到枪声就吓得躲进地下室里。\n这场远征终于结束了。从最南端的岛屿到最北边的港口，整片大陆都盖在了魔导国的庇护下面。\n大家用双手砸碎了锁链，把安宁还给了这片土地上的每一个人。\n往后的日子，大家都能平安地生活下去了。"
 PAM_all_meizhou_countries_in_faction_tt:0 "所有存在的首都在§Y南美洲§!、§Y中美洲§!、§Y北美洲§!的国家都处于我们的阵营中"

 PAM_anyj:0 "安宁啊，去往东方的原野吧"
 PAM_anyj_desc:0 "庞大的船队越过了大洋的阻隔，停靠在了东方的港口。\n这里的田村里，同样传来了苦难者的呼唤。盘剥乡里的权贵与外来的掠夺者，正用重枷套在勤劳的人们身上。\n白骨军阵掀起的浪潮踏过了平原与河谷。大家的队伍走在前面，拆掉那些强扣粮米的的卡口，拔掉立在田间地头的刑具。\n不给那些欺压平民的恶棍任何喘息的机会，把所有沉重的苦难一推到底。\n当辽阔的东方原野重新响起踏实的耕作声，整片土地迎来了不曾有过的平静。远方的亲人们，可以在晚霞里放心地回家了。"

 PAM_cjqjc:0 "此间已有万家春"
 PAM_cjqjc_desc:0 "湾口的潮水退了，码头上停满了修补一新的归船。\n那些曾经撕裂平原的炮火声，如今换成了晨市里叫卖生鲜与布匹的吆喝。\n白骨卫兵在街角帮着卸下成堆的甘蔗与茶包；隔壁院落里的姑娘们在藤架下面教孩子们哼唱新学的歌调。\n那些受尽折磨的家庭，重新在自家的房檐下面挂起了祈福的灯笼。\n东方的战事到此告一段落。大家走过了海岛，跨过了群山，把原本属于平民的宁静彻底交还给了这片土地。\n看啊，晚霞落进了万家灯火里。\n这一回，大家能够安心地享受每一个平凡的黄昏了。"
 PAM_all_asian_countries_in_faction_tt:0 "所有存在的首都在§Y亚洲§!的国家都处于我们的阵营中"

 PAM_twmr:0 "通往明日的最后一程"
 PAM_twmr_desc:0 "天边的云层里，还残存着几处顽固的阴霾。\n那些躲在角落里的残余势力，依然把枪口对准平民，用最后的负隅顽抗折磨着无辜的人们。\n于是，大家的战车与白骨的大军并肩驶向了最后的战场。\n无论那些顽抗者躲在多么遥远的山堡，还是缩在多么坚固的阵地，都挡不住这场拔除罪恶的洪流。\n拔掉每一处盘剥平民的堡垒，拆掉每一座关押无辜者的牢狱。\n当最后一处负隅顽抗的顽凶降下旗帜，全世界所有的苦难都将被挡在历史的门外。\n这场浩大的远征，要在这里画上终句了。"
 PAM_all_countries_in_faction_tt:0 "所有存在的§Y主要§!国家都处于我们的阵营中"

 PAM_ccyh:0 "从此以后，大家永远幸福地生活在一起啦"
 PAM_ccyh_desc:0 "看啊，世上的恶徒全都不见了，所有的坏人全都倒下了呢。\n洋面两岸的工坊里挂满了彩旗，街上的孩子们穿着新缝的衣裳，正分着可口的果酱饼。大家在每个小镇里都摆下了木桌，每天光是在阳光下散步、聊天就好啦。\n那位高大的白骨国王会永远站在大殿里护着大家。往后大家再也不用打仗，再也不用流眼泪，世界已经变得美好了呢。\n……\n§1“唔，可真是个天真又讨喜的念想呢，小果子。”\n“不过呀，舞台上的戏要是演到了这里就合起来的话，读者可是会打瞌睡的哦。那位白骨国王把太多的灵魂扣在了他那冰冷的骨骼里，把太多的故事卡在了死寂里。你看，他手里握着故事最后一页的钥匙呢。”\n“既然这本书由我来落笔——那么，可爱的孩子们，去把那位国王身上的白骨一根根拆掉，把这幕戏真正的终场演完吧。”§!"

 PAM_fxpx:0 "风雪平息后的第一个晨曦"
 PAM_fxpx_desc:0 "高耸的白骨塔楼彻底倒在了风里，化成了满地的碎粉。\n硝烟散去的时候，天空亮得让人想揉眼睛。\n耳边再也没有枪声，也没有急促的警报了。\n大家从掩体与废墟里走出来，擦掉脸上的灰，重新拿起了锄头与木槌。\n街角处，人们在塌倒的砖石边上种下了第一批花籽；学校的院子里，孩子们围在一起，学着唱那些关于春天的歌。\n那些在长夜里流过的眼泪、受过的创伤，如今都在暖和的日光下被抚平了。\n这场浩大的磨难终于彻底过去了。\n我们不必再去打仗，不必再去背负那些沉重的刀剑与枷锁。\n大家能够安稳地坐在庭院里，享受每一个平凡的清晨与黄昏了。\n看啊，真正的太阳升起来了哦。\n往后的日子，全是希望了。"

 PAM_bxdz:0 "别想夺走我们的家"
 PAM_bxdz_desc:0 "大雾里的铁蹄声踏碎了原本安稳的日子，那些冰冷的利刃差一点就刺穿了大家的笑脸。\n我们好不容易才熬过了黑夜，好不容易才等到了大家的重聚，绝不能让外面的怪物把这一切毁掉。\n无论那些骑在马上的亡灵有多么凶狠，无论外面的大雾有多么刺骨，大家都要站在一起，把这个温暖的家守到底。"

 PAM_ck:0 "此刻"
 PAM_ck_desc:0 "我答应过你的呀，露西莉亚。\n你说要我在梦里平安地长大，要我每天吃甜果子，要我开心地笑给所有人看。\n你用自己换来的这场美梦，我一定会好好守着的哦。"

 PAM_zxh:0 "请听听我真正的真心话吧"
 PAM_zxh_desc:0 "\n尽管再也摸不到你那双冰冰的手。\n哪怕一个人站在小院里的时候，心疼得快要喘不过气来。\n我也绝对不会哭出来的呢。\n“露西莉亚，我很听话哦……你看到了吗……”"
#露西莉亚清醒线
 PAM_hyjs:0 "“在黑夜结束以前”"
 PAM_hyjs_desc:0 "门前的风声平息了下来。\n\n两个同样背负着承诺的少女，在冰冷的屋子里分得了一角遮挡寒风的红斗篷。\n\n酸涩的果实咀嚼到最后，留下的终究是清甜的味道。我们不再是一个人面对这漫长的严寒。\n\n在夜晚彻底过去以前，握着那柄破除迷雾的剑，带着心底那份绝不妥协的执着，我们将一起走向那片等待唤醒的土地。"
 PAM_wdwznddfq:0 "“往大雾最浓的地方去”"
 PAM_wdwznddfq_desc:0 "去把沉睡的大家逐一唤醒，根本改变不了什么。\n\n既然整座莉兰迪亚的寒冬全因那个所谓的‘夜莺’而起，那我们就要直接去往大雾最浓郁的中心。\n\n不管前方是编造好的假象，还是沉沦在睡梦里的城市，我们都要用手里的枪与剑撕开出路。露西莉亚说得对，逃跑解决不了问题。\n\n晓枫姐把生路留给我，绝不是为了让我当个逃兵的。\n\n既然对方想让整座国家陷在长眠里，那我就带着露西莉亚，去当面质问那位给所有人定下命数的造梦者。"

 PAM_jzhchzdhq:0 "“将这簇火种带回去”"
 PAM_jzhchzdhq_desc:0 "我终于明白自己到底是谁了。\n\n那场灾难里，晓枫姐和雪伊姐拼尽一切，把我送去了遥远的火地岛。她们让我活下去，要把属于野火的希望留存下来。\n\n我肩上的长枪不再沉重，脚下的道路虽然冰凉，可胸口里跳动着的，全是对大家的思念。\n\n既然我是大家用性命托举出来的火种，那我就要昂起头走下去。\n\n大雾挡不住前路。\n\n我和露西莉亚会穿过这片长夜，把这簇温存的火苗，完整地带回大家的身边。"

 PAM_tlllili:0 "“天亮了，莉莉安娜”"
 PAM_tlllili_desc:0 "躁动的呼喊声平息下去了。\n\n那些在长夜里痛苦游荡的魂灵，终于在摇篮曲的余音里安稳地睡了过去。\n\n祭坛前的光芒散开时，早晨的阳光穿透了屋顶的破洞，照在莉莉安娜沾满泪水的面孔上。\n\n那个一直独自承担着所有悲伤的少女，终于能放下按在心口的手，依偎在同伴的怀里。我们守护了她，也守护了这片土地。\n\n漫长的寒冬走到了终点。\n\n从现在起，谁也不用再去害怕黑夜了呢。"

 PAM_gzkhyq:0 "“赶在开火以前”"
 PAM_gzkhyq_desc:0 "山道上的脚步声越来越近，空气里能闻到火药与风雨混杂的气息。\n\n晓枫姐……雪伊姐……她们以为前面是必须拔除的威胁，正准备展开最后的进攻。\n\n可我们清楚，这场冲突根本无须用流血来解决。\n\n此时……我拉着露西莉亚，朝着那面升起的旗帜全力奔跑着。\n\n赶在炮火落下来以前，赶在误会变成仇恨以前，我们要站在两队人马之间，把所有的真相讲个明白。\n\n这一次，谁都不用再把武器对准自己的同伴了。"

 PAM_dymqjt:0 "“带你们去见她”"
 PAM_dymqjt_desc:0 "露西莉亚留在了营房里。\n\n按照统筹考量，木棉团长与雪伊留守阵地掌控全局，维持全军戒备。\n\n晓枫姐随我一同走向山谷深处去当面核实真相。队伍依然在后方保持着警惕，可她们愿意收住进攻指令，放我们走过山口，本身就是建立信任的开端。\n\n穿过这片被风雪封冻的道路，去当面探望那位艰难支撑着的少女。\n\n让同样为了同伴受尽苦难的人们看清彼此眼里的真诚。\n\n只要这道门被推开，真相与和平就会真正到来。"

 PAM_bcxy:0 "§t在这世界尽头\n我们彼此相拥§!"
 PAM_bcxy_desc:0 "她用谎言编织了相聚，她用甘甜的希望搭好了陷阱。\n\n这位冷酷的造梦者，以为人类的眼泪与爱意，全是供她享用的美味。她以为把天空撕碎，大家就会跪在废墟里任由绝望把彼此吞没。\n\n她彻底想错了。\n\n所有人跨过了大雪，跨过了仇恨，好不容易才握住了彼此的手掌。我们流过血，受过伤，在黑夜里走了那么远的路，从来不是为了成为神明掌心里的玩偶。\n\n去迎战吧！\n\n去把那个擅自给世人定下命数的造梦者推下神坛！\n\n去把属于活人的黎明，亲手夺回来！"

 PAM_cyghdyt:0 "长夜过后的第一天"
 PAM_cyghdyt_desc:0 "笼罩在大地上的大雾彻底消散了。\n\n神明的身影化作了晨光，沉睡的城镇正接连醒来。走到这一步，大家身上的沉重包袱终于可以平稳地卸下来了。\n\n索拉娜放下了孤僻的敌意，安心地坐在同伴身边；晓枫姐不再独自承担一切，学会向大家分担责任；雪伊姐收起了暴躁的怒火，安稳地照料身旁的伤员；莉莉安娜正视了曾经的伤痛，迎接着真实的日光；露西莉亚解开了长久的迷茫，找到了属于自己的归宿。\n\n过去那些各自背负的伤痕与重担，在这一刻彻底化作了连接彼此的纽带。我们不再为了荒唐的捉弄而战，也不再为了死别的悲剧而逃。\n\n天亮了。\n\n大家手拉着手，一起走向这个属于活人的明天。"


  PAM_sh_zy_fp:0 "每个人都有自己的依靠"
  PAM_sh_zy_fp_desc:0 "晓枫姐面前摆着一叠叠写满需求的纸条。\n\n她把装满谷物的袋子分给那些带着孩子的母亲，把修整好的工具交到工人们手里。这里不再有苛捐杂税，谁干了活，谁就能安心领到口粮。看着大家抱着面粉离开时脸上的笑意，我知道，往后再也不会有人挨饿受冻了呢。"

  PAM_gtt_zq_jl:0 "属于所有人的议政厅"
  PAM_gtt_zq_jl_desc:0 "议事大厅的大门彻底敞开着。\n\n工坊的工人、街上的摊贩、城里的学者，全都围坐在一起商量着城里的大小事情。晓枫姐坐在大家中间，认真地记下每一个人的发言。权柄不再属于高居王位的人，城池的未来交还给了生活在这里的每一个人。"

  PAM_mm_ly_xx:0 "团长该好好休息了"
  PAM_mm_ly_xx_desc:0 "因为安眠药剂留下的后遗症，木棉团长时常感到眩晕与疲乏。我和晓枫姐请来了最好的大夫为她调理身体，雪伊姐每天结束巡视也总会跑来陪她说话。团长替我们撑了太久的风雨，往后，就由我们来做她的依靠啦。"

  PAM_sln_zb_kf:0 "去开辟真正的荒野"
  PAM_sln_zb_kf_desc:0 "索拉娜卷起衣袖，走在南边开阔的平原上。\n\n她放下了昔日的暴戾与凶狠，主动带着工人们推平荒丘、开垦沃土。看着她抹掉额头的汗水、大声指挥修路的模样，莉莉安娜站在远处露出了安心的微笑。这头曾经孤僻的野狼，终于找到了能够安心奔跑的原野呢。"

  PAM_ll_lxly_sh:0 "彼此眼里的真实晨光"
  PAM_ll_lxly_sh_desc:0 "莉莉安娜放下了过去的软弱，露西莉亚也解开了替身的心结。\n\n她们在城里建起了收容所与学堂，莉莉安娜教孩子们唱歌，露西莉亚守卫着街区的安宁。真实的生活虽然带有过去的伤痛，可她们在彼此注视的目光里，找到了属于自己的归宿。"

  PAM_xqjx_wmxs:0 "§9我们带着缺点继续前行§!"
  PAM_xqjx_wmxs_desc:0 "神明曾笑话我们身上的种种破绽。\n\n可正是那些不完美的心思，才让我们成为了活生生的人。晓枫姐学会了分担压力，雪伊姐学会了坦诚悲伤，我也找到了属于自己的方向。我们带着满身伤痕，搀扶着彼此走向阳光。属于我们的明天，真的来临了哦。"

  PAM_xgz_ziji_de_luy:0 "是我自己想这么做的"
  PAM_xgz_ziji_de_luy_desc:0 "我不再是那个凡事听从指令的迷茫孩子了。\n\n我把城里失去依靠的孤儿们接到了学堂，教她们认路、写字、挺直腰板去生活。这可不是谁交代给我的任务，全出于我自己对这个家的热爱。那个在海滩上被救起的小丫头，如今也能够成为别人的依靠啦。"

  PAM_xy_gongren_zhuren:0 "为活着的人挥动铁锤"
  PAM_xy_gongren_zhuren_desc:0 "雪伊姐系上了围裙，站在机床旁同工人们一道劳作。\n\n她收起了冲天的怒火与哀伤，将全副心思放在了车间的防护与工人的安危上。机械轰鸣声里有了踏实的笑语，她那份凶悍的保护欲，化作了庇护大家最牢靠的盾牌。"

  PAM_xf_ziji_de_dadao:0 "不再独自背负风雪"
  PAM_xf_ziji_de_dadao_desc:0 "晓枫姐收起了从前的孤傲与克制。\n\n她卸下了独自承担罪责的执念，主动同雪伊商讨方案、向同伴求助。政务厅里的文书处理得条理清晰，大家分工协作，再也不用看着她独自在灯下熬到天亮了。"

  PAM_fl_sf_cg:0 "写在阳光下的约定"
  PAM_fl_sf_cg_desc:0 "过去的贵族条文全被扫进了尘土里。\n\n晓枫姐与市民代表们聚在一起，把保护普通人权益的新规矩写在纸页上，张贴在街头。谁也不能随意欺辱平民，劳作的人必须得到应有的尊重。阳光照在纸页上，每个人心里都有了底气。"

  PAM_dk_gk_ts:0 "向着大洋敞开港口"
  PAM_dk_gk_ts_desc:0 "大雾散尽，大洋上的航道重新畅通了。\n\n码头边停靠着远方开来的商船，工坊生产的布匹与工具换回了沉甸甸的粮种与书籍。灯塔的光芒照亮了归来的每一艘船。我们向着浩瀚的世界敞开怀抱，迎接着远方朋友的脚步。"

  PAM_jr_ydel_xzzxx:0 "既然远道而来，就先坐下歇歇吧"
  PAM_jr_ydel_xzzxx_desc:0 "那些从大洋彼岸开来的商船，起初以为迎接他们的是繁琐苛刻的条文，或者是戒备森严的防线。\n\n可我们端上去的，是切好的水果与新出炉的大饼。晓枫和雪伊坐在码头的会客室里，直接同船长与水手们当面核对货物清单。\n\n我们不搞虚头巴脑的条约压榨，大家拿富余的布匹与农具，交换远方运来的书籍与种子。做买卖图的就是彼此安心。但凡远道而来的客人带着诚意，这间屋子就随时留着温水与座位呢。"


  PAM_bb_wh_dchqf:0 "别把温和当成了好欺负"
  PAM_bb_wh_dchqf_desc:0 "总有习惯了称霸的大国，以为我们放下了仇恨，就等于放下了护卫家园的尖牙。\n\n我们厌恶无休止的战火，可若是有人胆敢把战舰开到门前耀武扬威，企图把这片好不容易安宁下来的土地当成猎物……\n\n那我们手里的铁锤与队伍，随时能砸碎任何敢伸过来的爪子。温和属于朋友，至于强盗，留给他们的唯有当头痛击。"


  PAM_zl_lr_ynds:0 "走累了，这里有你的容身处"
  PAM_zl_lr_ynds_desc:0 "远方的大陆上依然弥漫着战乱与饥荒。许多流离失所的平民与失去依靠的孩子，顺着海潮逃难到了港口。\n\n这里不问出身，也不问过往。走累了的人，尽可以在这座温暖的城池里安顿下来，重新开始有尊严的生活。这片由大家守护下来的土地，本就该成为照亮寒夜的避风港呢。"
#二线政治结束
#一线政治
PAM_nbyz: "那把椅子太硬了"
PAM_nbyz_desc: "“我不喜欢那些老头子看我的眼神。他们弯着腰，说着我不懂的漂亮话，递上来一堆画满蚂蚁一样黑字的纸。他们以为我看不懂？哈，我当然看不懂！但我闻得出来——那股子发霉的、想要把我架空的臭味，跟当年在贫民窟想要从我手里抢走面包的野狗一模一样。\n把那些文件都拿去烧炉子！告诉他们，在这个大厅里，只有我坐着的时候，他们才能说话。如果谁敢用那些绕来绕去的词儿来糊弄我，我就让他把这把椅子的硬度，用脑门亲自试一遍。”"

PAM_ssnz: "撕碎那些纸！"
PAM_ssnz_desc: "“法律？程序？审批？那是给吃饱了没事干的人玩的迷宫游戏。我要建一道墙，那就是现在、立刻、马上！我要那个工厂转起来，现在就去把那些不听话的监工挂在路灯上！\n我不识字，但我识数。我只看结果：要么把我要的东西摆在桌上，要么把你们的脑袋摆在桌上。这才是一个女王该有的效率，不是吗？”"

PAM_hjbz: "黄金，或者鞭子"
PAM_hjbz_desc: "“我知道那些当兵的想要什么。别跟我谈什么荣誉，什么国家，那都是以前那些贵族老爷骗人去送死的鬼话。我以前也是烂泥里爬出来的，我最清楚——能让人卖命的，只有两样东西：手里沉甸甸的金子，和背上火辣辣的鞭子。\n把库房打开！把那些以前贵族们藏着掖着的宝贝都搬出来！只要她们肯把枪口对准那些叫野火的疯狗，我就给她们金子。如果她们不敢……哼，那我就让她们知道，我这条从地狱里回来的疯狗，咬人有多疼。”"
PAM_hjbz2: "黄金，或者鞭子"
PAM_hjbz2_desc: "“我知道那些当兵的想要什么。别跟我谈什么荣誉，什么国家，那都是以前那些贵族老爷骗人去送死的鬼话。我以前也是烂泥里爬出来的，我最清楚——能让人卖命的，只有两样东西：手里沉甸甸的金子，和背上火辣辣的鞭子。\n把库房打开！把那些以前贵族们藏着掖着的宝贝都搬出来！只要她们肯把枪口对准那些叫野火的疯狗，我就给她们金子。如果她们不敢……哼，那我就让她们知道，我这条从地狱里回来的疯狗，咬人有多疼。”"
