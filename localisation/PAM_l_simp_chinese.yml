PAM_call_for_family_photo:0 "§O画下这群混蛋！§!"
PAM_call_for_family_photo_desc:0 "“我都数不清我们赢了多少场仗，抢了多少座金山了。但我突然发现，我最值钱的战利品，好像一直就在这间屋子里转悠。\n那个总是皱着眉头的管家婆晓枫，那个整天擦枪的疯狗雪伊，那个睡得流口水的小海鸥，还有那个躲在影子里的小怪物……当然，还有我的莉莉。\n谁也别想跑。哪怕是死神来了，也得先过我这一关。\n去！把最好的画师给我抓来！我要他把这一刻画下来。告诉他：‘把我们画得开心点，画得嚣张点！’\n我要把这张画挂在世界的最高处，告诉所有人——看啊，这就是老子的家！”"

PAM_mission_xiaofeng_chip_exchange_proposal:0 "§Y参谋长的销赃提案§!"
PAM_mission_xiaofeng_chip_exchange_proposal_desc:0 "头儿，请看看您脚边那堆积如山的胜利筹码。那是您在外交赌桌上赢来的战利品，象征着您的威慑力和好运气。\n但请恕我直言——运气挡不住子弹，金币也填不饱肚子。如果我们即将发动席卷整个大陆的攻势，这些死物堆在库房里毫无意义。\n我建议……把它们花出去。\n不仅是换成钢铁和石油，更要换成……人心。\n雪伊需要更精良的装备来发泄怒火，小果子需要更精密的仪器来克服恐惧，而我也需要一些……稀缺的孤本资料来完善战术。\n如果您愿意将这些筹码交给我运作，我保证，它们换回来的忠诚与士气，会比黄金更保值。”"
PAM.80.t: "来自四号仓库的电话"
PAM.80.d: "“喂？头儿，是我，晓枫。\n……不，我没在抱怨，我只是刚从四号仓库出来，眼睛被那些反光的东西晃得有点疼。\n您在赌桌上赢回来的那些战利品——那些金筹码、地契、还有别的领主输掉的家徽——已经快把过道堵死了。甚至连雪伊的巡逻队路过都得侧着身子。\n听我说，头儿。运气这东西，如果不兑现成铁和血，那就只是一堆好看的废品。运气挡不住重炮，金子也塞不进枪膛里。\n我刚刚拟定了一份……唔，让我们称之为战略销赃的计划书。既然我们要去撕咬更大的猎物，就得先磨磨牙。\n雪伊那边的火气很大，我们需要更重型的装备来让她发泄；小果子还在对着海上的迷雾发抖，几套昂贵的精密仪器或许能让她安静下来；至于我……咳，黑市上流出了几本旧帝国的绝版战术手稿，我觉得它们比放在收藏家的保险柜里更有价值。\n别再像个守财奴一样盯着那堆筹码傻笑了。把它们交给我运作。\n授权书就在您手边，压在那盘葡萄下面。签了它，我会把这些虚无缥缈的好运，变成您手里实打实的……鞭子和糖。”"
PAM.80.a: "（嘟——嘟——电话挂断了）"

PAM_mission_lilianas_lullaby:0 "§1静谧的安抚§!"
PAM_mission_lilianas_lullaby_desc:0 "莉莉安娜带着那些“夜莺的魂灵”，走进了燃烧的庄园。她要用冥界的寒气压制火焰，用灵魂的歌声瓦解贵族的疯狂。\n但这需要物质的支持——我们需要向那个地区投入大量的民用资源，来证明我们比旧贵族更值得追随，从而从内部瓦解他们的封锁。"
PAM.81.t: "听筒里的呼吸声"
PAM.81.d: "“……喂？……索拉娜？”\n一阵刺耳的摩擦声后，那个熟悉的声音才怯生生地从听筒里传出来，带着一丝明显的不确信和小心翼翼。\n“……笃、笃。是这样拿吗？晓枫说……要把带孔的这头贴在嘴边……好奇怪，它在震动，就像一直被捏住喉咙的小鸟。”\n“……你能听到我吗？这根黑色的线……真的能一直连到你的房间里吗？”\n电话那头传来了深吸一口气的声音，接着是她变得稍微坚定了一些的语调，虽然背景里还能听到隐约的火焰爆裂声和人群的嘶吼。\n“我在西边的庄园这里。火烧得很大，那些贵族把自己锁在里面发疯，外面的平民在砸门。太吵了……大家都很痛苦，连空气都在尖叫。”\n“我想……让夜莺的孩子们进去。我想给她们唱首歌，把火压下去，让她们的心也静一静。但是晓枫告诉我，光有歌声填不饱肚子，也修不好被烧坏的屋顶，饥饿的人是听不见摇篮曲的。”\n“所以，索拉娜……能不能……借我一点你的那些‘工厂’？或者是……那些用来造房子的物资？”\n“我想把这里变成一个像我们花园那样……安安静静、不会有人受伤的地方。只要把东西运过来，证明我们会修好一切，我就有办法让那些疯掉的贵族和愤怒的人群……都乖乖睡着。”\n“……呀！它又响了一声！我是不是把它弄坏了？我要挂——”"
PAM.81.a: "（嘟——嘟——她好像吓得把电话扔了）"

PAM_mission_scavengers_cleanup:0 "§8阴影中的鸟儿§!"
PAM_mission_scavengers_cleanup_desc:0 "百灵需要资源来编织她的网。她不仅要杀人，还要诛心。她需要建立一个庞大的情报网络，渗透进每一个角落，找出那些搞破坏的幕后黑手。\n我们要给她足够的权限和支持，让她在黑暗中起舞。"
PAM.82.t: "来自下水道的低语"
PAM.82.d: "“……陛下？是我。我在下水道的通风口旁边，不用担心，这里只有老鼠听得见。\n您在光亮的大道上走得太快了，影子被拉得很长。而在那些您看不见的阴影里……有些虫子开始在您的脚印里产卵了。那些被烧毁的庄园废墟下，还有人在用只有彼此能听懂的暗号窃窃私语。\n光靠我这一把匕首，刮不干净这些顽固的苔藓。我需要一张网……一张能盖住整座城市的、粘稠的网。\n我要让每一个乞丐、每一个在后巷翻垃圾的流浪汉、甚至墙角的野猫，都变成我的眼睛。我要知道那些想搞破坏的人在哪吃饭，在哪睡觉，甚至在哪做梦。\n但这需要诱饵。情报是贵的，有时候比人命还贵。把那些见不得光的资金拨给我，给我最高的清理权限。\n别问我会怎么做。您只需要站在阳光下接受欢呼就好。至于那些脏东西……\n……把它们交给我这只乌鸦。等您明天醒来的时候，您的御座底下，会比镜子还要干净。”"
PAM.82.a: "（嘟——只有电流的沙沙声）"

PAM_mission_build_nest_for_seagull:0 "§9给海鸥筑巢§!"
PAM_mission_build_nest_for_seagull_desc:0 "“南美洲已经被我们吃干抹净了，剩下的只有骨头渣子。现在的风里，全是海对岸那股腐朽又诱人的老钱味儿。\n但我那个负责管船的小不点——小果子，她今天把一张比桌子还大的蓝图拍在了我的烤羊腿上。\n她指着那是深水区，眼神亮得吓人：‘头儿，狼爪子游不到大西洋对岸。如果您想去撕咬那些老牌帝国的喉咙，我们以前那些破舢板可不行。我们需要大船，那种能装下整座城市、能抗住十级风浪的钢铁巨兽。’\n‘为此，我需要一个能生出这些怪物的巢穴。’\n哈！听听！她以前连要块糖都不敢大声说话，现在竟然敢跟我要半个大陆的钢铁产量去填海？\n但我喜欢她现在这副贪心的样子！这才像是我养大的狼崽子！\n准了！去把海岸线炸开！去把山挖空！既然我的小海军上将想要一个能给全世界洗澡的大浴缸……那老子就给她挖一个！”"
PAM.83.t: "来自海浪的咆哮"
PAM.83.d: "“……喂？头儿？能不能……先把嘴里的骨头吐出来听我说？\n我在最南边的海岬上，这里的海风比刀子还硬，但我闻到了……风里全是海对岸那股子腐朽又诱人的老钱味儿。\n您说南美洲已经被我们吃干抹净了，想去撕咬那些老牌帝国的喉咙？那您就得听实话——狼爪子游不过大西洋。我们现在手里那些改装的破渔船，碰到真正的皇家海军，那就是给鲨鱼送点心。\n如果您真想去那边吃自助餐，我就得给您造出能跨海的钢铁盘子。\n把地图打开，看我标红的那块深水区。我要在那里建一个窝。不是那种停小舢板的烂泥塘，我要把这一整条海岸线的礁石都炸平，把山掏空灌进水泥。我要造那种……能把整座城市都装进去、能抗住十级风浪的钢铁怪物。\n这很贵，我知道。晓枫姐可能会心疼得骂人，这可能要花掉您刚抢来的一半钢铁产量。\n但是……如果不给，您的狼群就只能在这边岸上对着大海干嚎。\n图纸我已经让亡灵信使送过去了，就在您的烤羊腿旁边。头儿……为了那顿跨洋的大餐，您敢签吗？”"
PAM.83.a: "（嘟——嘟——海浪声盖过了一切）"

PAM_mission_xueyi_iron_umbrella:0 "§t给泥腿子的铁伞§!"
PAM_mission_xueyi_iron_umbrella_desc:0 "“把那张该死的战略轰炸图纸给我撤了！\n索拉娜，你脑子里只想着怎么把敌人的城市炸平，怎么去抢她们的工厂。但你有没有想过，我们要跨过大洋，去别人的地盘上打仗？\n当我的士兵——那些刚从贫民窟里走出来、还没来得及享受几天好日子的孩子们，在滩头被敌人的机枪压得抬不起头时，你那些飞在几万米高空的轰炸机能干什么？给她们收尸吗？！\n我不懂什么空气动力学，但我懂战壕里的规矩。\n我要一种新飞机。别给我整那些花里胡哨的。我要它皮糙肉厚，耐操，能挂满炸弹和机枪。\n我要让飞行员学会贴地飞行。告诉她们，别想着在天上当骑士，要像秃鹫一样俯冲下去，把那些敢向我的步兵开火的火力点，一个一个给我拔掉！\n给我造够一千架这种‘飞行坦克’！如果登陆那天，我看到有一个士兵因为头顶上没人掩护而死，我就亲自把空军司令挂在起落架上！”"
PAM.84.t: "来自靶场的咆哮"
PAM.84.d: "“喂？索拉娜！把你的酒杯放下，听我说！……我刚把空军部送来的那叠战略轰炸图纸给撕了，拿去引火都嫌纸太硬！\n你脑子里是不是只有抢工厂和炸大楼？你知不知道我们要去哪？我们要跨过大洋，去别人的地盘上硬碰硬！\n当我们的泥腿子们——那些好不容易才吃上两顿饱饭、刚学会怎么穿军靴的孩子们——在滩头上被重机枪压得抬不起头的时候，你那些飞在几万米高空的大鸟能干什么？给她们撒花瓣送行吗？！\n我不懂什么空气动力学，也不管那飞机飞起来漂不漂亮。我只要一种东西——能贴着地皮飞的‘飞行坦克’！\n我要它皮糙肉厚，耐操，哪怕被打掉半个翅膀也能飞回来；我要它挂满炸弹和机枪，像秃鹫一样俯冲下去，把那些敢向我们的步兵开火的火力点，一个一个给我拔掉！\n给我造够一千架！告诉那些飞行员，别想着在天上当骑士，给我滚下来去泥地里护着步兵！如果登陆那天，我看到有一个士兵因为头顶上没伞遮着而死……我就亲自把空军司令挂在起落架上！签发令就在你桌子上，现在，立刻，给我签！”"
PAM.84.a: "（嘟——嘟——还能听到远处的枪炮声）"

PAM_mission_feed_the_mad_dog:0 "§R不仅是断头饭§!"
PAM_mission_feed_the_mad_dog_desc:0 "“雪伊的那群兵还在盯着手里的烂枪发愁？那是饿的！没力气怎么扣扳机？\n去，把我的战备粮仓踹开！把那些原本留给贵族老爷享用的熏肉、黄油，还有成桶的烈酒，统统给我搬去前线！\n告诉那个疯女人：‘吃！给老娘往死里吃！只要你的兵能站起来咬死那些骨头架子，老娘就让她们吃得比皇帝还饱！’\n但这顿饭可不是白吃的——吃完了，就得给我拿命去填战壕！”"

PAM_mission_delegate_command:0 "§3移交指挥权§!"
PAM_mission_delegate_command_desc:0 "“前线乱成了一锅粥！我的狼崽子们只知道像没头苍蝇一样冲锋，但那些亡灵却像长了眼睛一样在包抄我们。\n我看过晓枫在牢房墙上画的那些鬼画符……虽然不想承认，但她确实比我懂怎么排兵布阵。\n给她一支笔，或者给她一个指挥部！告诉她：‘别在那儿装深沉了，左翼的防线交给你。要是守不住，我就把你的脑浆挖出来看看是不是也是墨水做的！’”"

PAM_mission_candy_and_recon:0 "§9糖果与侦察§!"
PAM_mission_candy_and_recon_desc:0 "“小果子带回了关键的情报，关于那片紫色雾气最浓的地方。但她回来时脸色惨白，像是丢了魂。\n……也许我该学学莉莉那个笨蛋以前的做法？\n去，把那罐从大公爵那里抢来的、还没过期的水果糖拿给她。\n告诉她：‘拿去吃！别哭丧着脸，看着晦气！吃完了把眼泪擦干，再去给我看看海面上有什么动静。以后……这种甜的，管够。’”"

PAM_mission_song_of_silence:0 "§1让它们闭嘴的歌§!"
PAM_mission_song_of_silence_desc:0 "“外面的骨头架子吵死了！我的炮弹都盖不住它们的嘶吼声。\n莉莉说那是怨气，她说她能让它们安静下来。\n她站在城墙上，只是轻轻哼了一首歌……见鬼，那群疯狗一样的亡灵竟然真的停下来了，像傻了一样站在原地。\n喂！晓枫！别在那儿发呆了！没看见敌人都不动了吗？\n趁着莉莉哄它们睡觉的时候，把你们的刺刀捅进去！给我把它们的头盖骨掀开！\n这是我的公主给你们创造的机会，谁要是敢浪费，我就把她扔下去喂那群醒过来的怪物！”"
#GUI精神
PAM_szax:0 "逝者已经安息"
PAM_szax_desc:0 "睡吧........."
#GUI事件
#晓枫事件
 #1 解锁可点
 PAM_.1.t: "吞炭的喉咙"
 PAM_.1.d: "我把那枚红星徽章缝进了贴身衬衣的最里层，贴着心口，那一块皮肉被粗糙的线头磨得生疼。这疼得好，这疼提醒我还活着，还是个人。\n看着周围这群曾经的死敌——那些穿着黑皮大衣、满嘴脏话的强盗，现在居然成了我的“战友”。昨天那个把半个身子探进泔水桶里找肉吃的家伙，今天就成了我的班长。他递给我一块还在滴油的羊排，咧着嘴笑，牙缝里全是肉渣。\n我接过那块肉，就像接过一块烧红的炭。我的胃在抽搐，在抗议，它记得我们是为了让所有人都有饭吃才拿起枪的，而不是为了像野兽一样抢食。\n但晓枫同志以前教过我们：“人得先站着，才能走道；肚子填饱了，骨头才能硬。”\n我们要把这块烫嘴的肉吞下去，把这份屈辱和那该死的羊油一起咽进肚子里。这胃里烧起来的火，早晚会从喉咙里喷出来，烧穿这个荒谬的世界。\n吃吧。为了有力气把枪握紧，为了有力气……等到黎明真正破晓的那一天。"
 PAM_.1.a: "（吞下去。连同血和泪一起。）"

 #2 完成决议可点
 PAM_.2.t: "谁在撕咬"
 PAM_.2.d: "完了。这次是真的完了。\n那些亡灵像黑色的潮水一样漫过了山头，弹药箱空了，连最后的手榴弹也扔出去了。身边的兄弟倒下了一半，剩下的人背靠背挤在这个泥坑里，喘气声像拉破的风箱。\n我握着工兵铲，看着那些逼近的惨白骨架，脑子里只剩下一个念头：跟这帮怪物拼了。死在这里，我也算对得起这身军装。\n就在那只骨爪要抓破我喉咙的一瞬间——\n轰！！\n面前的骨墙炸开了。不是炸药，是一个人。\n那个疯女人，那个我们恨得牙痒痒的暴君，索拉娜。她就像一头从地狱里冲出来的黑狼，浑身是血，手里那把剑卷了刃，却依然像锯齿一样撕碎了眼前的一切。\n“我的！都是我的！”她嘶吼着，声音比那些亡灵还恐怖，“谁准你们动我的东西！谁准你们吃我的兵！滚开！滚回地底下去！”\n她挡在我们前面，用身体撞，用牙齿咬，比我们要消灭的阶级敌人还要凶残一万倍。她根本不是为了什么崇高的理想在救我们，她只是像个守财奴在护着他的金币，像个护食的野兽在护着他的幼崽。\n可我看着那个疯癫的背影，眼泪却混着泥水流了下来。\n在那一刻，什么主义，什么阵营，都变得模糊了。我只知道，在那面把我们隔绝在死亡之外的盾牌上，刻着的是一个活生生的、正在流血的人。\n原来，这就是我们要找的……那股能把我们从死人堆里拽出来的蛮劲儿。"
 PAM_.2.a: "（跟着她！杀出去！）"

 #3 二阶段国策期间
 PAM_.3.t: "枪油与面包"
 PAM_.3.d: "这批新枪到了。不是那种只有三发子弹的土造猎枪，也不是那种拉栓就会卡壳的老古董。是崭新的、烤蓝锃亮的、甚至闻起来带着一股甜腻工业油脂味的好家伙。\n那个叫索拉娜的疯女人，真的把贵族的军火库给搬空了。她把这些原本用来镇压我们的武器，像扔垃圾一样扔到了我们面前。\n“拿去！”那个传令兵吼道，“女王说了，谁要是拿着这种好货还打输了，就自己跳进亡灵坑里去！”\n我抚摸着枪身，冰凉的金属让我的手指微微颤抖。以前我们总说要用意志战胜钢铁，现在我明白，意志需要钢铁来武装，正义需要火药来推行。\n这就是我们要找的“本钱”。我们以前两手空空去撞高墙，现在我们手里有了锤子。虽然这锤子是那头母狼抢来的，虽然这上面沾着旧时代的灰尘。\n但这又怎么样呢？铁就是铁，火就是火。只要扣动扳机的手指还是我们的，只要枪口对准的还是那些吃人的怪物，那这就是我们的枪。\n把枪擦亮。这一次，我们要用他们送来的铁，去打碎他们自己的锁链。"
 PAM_.3.a: "（子弹上膛的声音，真好听。）"

 #4
 PAM_.4.t: "黑泥里的莲花"
 PAM_.4.d: "以前我觉得，革命应该是干净的。白衬衫，红旗帜，一尘不染的理想。我们应该拒绝一切肮脏的交易，拒绝和任何剥削者妥协。\n可现在看看我们。穿着从死人身上扒下来的黑大衣，吃着从殖民者那里抢来的罐头，甚至还要指挥那些只有骨架的亡灵去替我们趟地雷。\n脏吗？真脏。\n可是你看，那边的村子里，炊烟升起来了。那个以前只能去捡煤渣的孩子，现在正穿着体面的衣裳坐在学堂里念书——虽然那衣裳有点大，虽然那学堂是抢来的贵族别墅改的。\n这世上的事儿就是这么怪。要想在这片全是烂泥的沼泽里种出花来，你就得先把手伸进烂泥里，把那些腐烂的根须、发臭的淤泥都翻一遍。你不能嫌脏，不能嫌臭，因为那就是养分。\n索拉娜就是那把最锋利、也最脏的铲子。她负责把旧世界铲得稀巴烂，把所有的罪恶和血腥都揽在自己身上。而我们……我们就是撒在这些翻开的黑土里的种子。\n我们利用她的贪婪去喂饱人民，利用她的暴虐去粉碎枷锁。只要结果是受苦的人直起了腰，这手段再黑，心也是亮的。\n在这黑色的狼皮底下，我们的心，依旧是红的。而且因为沾了地气，跳得更稳了。"
 PAM_.4.a: "（根扎得越深，花开得越艳。）"

 #5
 PAM_.5.t: "路与桥"
 PAM_.5.d: "今晚的篝火很旺。几个新兵蛋子围着我，问我还要不要搞那个“真正的”革命。他们指着远处灯火通明的城市，那是用掠夺来的黄金堆砌起来的繁华。\n我捡起一块木柴，扔进火里，看着火星子飞上天。\n“一定要搞。”我对他们说，“但是路变了。”\n以前我们想修一座桥，直接跨过这就条吃人的河，去对岸的天堂。但我们没水泥，没石头，桥修一半就塌了，掉下去好多兄弟。\n现在，那个叫索拉娜的家伙来了。她不想修桥，她直接跳进河里，把河水喝干了，把河底的淤泥填平了。她用那些贵族的尸骨铺了一条路。虽然这路走起来咯脚，虽然这路上一股血腥味，但它……确实通向对岸。\n我们现在就走在这条路上。我们的任务可不是去把路炸了，我们要在走的过程中，把那些尖锐的石头踢开，把路边的杂草拔掉，让后来的人走得更顺当。\n这就是这世道的道理。它从来不按我们写好的剧本演，它有时候会戴着魔鬼的面具来干天使的活儿。\n只要方向是对的，坐着狼拉的车去，和自己走着去，没有区别。\n而且，这车上装满了粮食，能让我们把更多还没饿死的人，一起带上。\n这就是我们留在这里的意义——我们是这辆疯狂战车的方向盘，我们得盯着它，别让它冲进沟里，得让它……一直开向那个春天。"
 PAM_.5.a: "（路是人走出来的，不管是穿草鞋还是穿军靴）"

 #6
 PAM_.6.t: "殊途同归"
 PAM_.6.d: "那个日子终于来了。全军列队，接受检阅。\n广场上站满了人。这里有死人，有活人，有曾经的强盗，也有昔日的农夫。我们穿着统一的黑色军服，胸前挂着那是索拉娜发的、用国王王冠熔掉重铸的“黑狼勋章”。\n大家都在等那个疯女人出来骂人，或者等她再扔给我们几块肉。但今天，走上高台的不是她。\n是一个穿着朴素军装，却比任何人都挺拔的身影。\n晓枫。\n她瘦了，但眼神比以前更亮，像两把刚磨好的刺刀。她只是静静地扫视着我们。她的目光落在我身上，落在那枚黑色的勋章上，然后，她笑了。\n那是一种……看到庄稼熟了的、欣慰的笑。\n她缓缓举起手，向我们这群穿着黑色军服、混杂着亡灵、浑身匪气的士兵，敬了一个最标准的、属于革命军的军礼。\n“同志们，”她的声音不大，却在每个人心里炸响，“看看你们自己。”\n“有人说你们是暴徒，是强盗，是索拉娜的爪牙。但我看到的是一群哪怕在地狱里也要爬出来、也要把世界咬个窟窿的复仇者。”\n“革命不是请客吃饭，革命就是暴动，是一个阶级推翻一个阶级的暴烈的行动。而你们……你们就是这股暴烈本身！”\n“索拉娜给了你们牙齿，给了你们活下去的肉。而今天，我要给你们‘魂’。”\n“去吧！带着这身黑皮，去把那些高高在上的神像砸碎！去把那些压在人民头上的大山啃光！你们是狼，但你们是属于人民的狼！你们是鬼，但你们是向压迫者索命的厉鬼！”\n那一瞬间，我感觉浑身的血都涌上了头顶。我想哭，想吼，想把枪举起来。\n我们没有背叛。我们只是变成了一种更顽强、更凶狠、更能在这个残酷世界里活下去的“野火”。\n在这层狰狞的伪装下，那颗红色的心，跳得比任何时候都要有力。\n风吹过来了，旗帜在响。我看清了，那面黑色的狼旗后面，映出来的影子……分明是一团烧透了半边天的、赤红的烈火。"
 PAM_.6.a: "（敬礼！为了……新世界！）"
 PAM.85.t: "来自档案室的忙音"
 PAM.85.d: "“……喂？还在喝吗？先把酒杯放下，听我说两句。\n刚散场。我看着那帮狼崽子回营房了。若是放在以前，检阅完她们早就该聚众赌博或者打架了，但今天……她们很安静。我看见那个缺了耳朵的老兵在擦他的黑勋章，擦得很亮，还在哭。\n索拉娜，说实话，我以前看不起你的手段。我觉得你把人变成了只会抢食的野兽，把革命变成了暴乱。我一直想把她们洗干净，变回我记忆里那种‘纯粹’的战士。\n但今天站在台上，看着下面那片黑压压的、却又热气腾腾的人海，我突然明白了一件事：\n教科书里的革命是红色的，那是血的颜色；但现实里的生存是黑色的，那是泥土和火药的颜色。若没有你在泥里打滚，就没有这层保护色，那点红早就被风吹灭了。\n你喂饱了她们的胃，我填上了她们的魂。我们谁也别嫌弃谁。\n所以……别一个人坐在那空荡荡的大殿里发呆了。你不是什么篡位者，也不是什么玷污理想的罪人。\n你是这支军队的骨头。\n……行了，我就说这么多。早点睡，明天还有新的仗要打。如果你那是还有没吃完的葡萄……给我留一串。”"
 PAM.85.a: "（嘟—嘟——在那头，传来了一声轻轻的叹息）"
 #雪伊事件
 #1 完成决议后
 PAM_.7.t: "带刺的项圈"
 PAM_.7.d: "我站在满是油污的食堂门口，手里握着那把索拉娜扔给我的、甚至还没擦干净血迹的宪兵队长的配枪。看着里面那些狼吞虎咽的士兵，还有那个坐在高处、把脚翘在桌子上的疯女人，我只觉得恶心。\n就在刚才，一个喝多了的新兵试图去抢一个老工人的那份肉汤。那老头吓得发抖，却拼命得护着他的碗，因为那是他给孙子留的。\n“那是我的！”新兵吼着，举起了拳头。\n“砰！”\n我没犹豫，对着天花板开了一枪。碎石灰落在那个新兵的头顶，把他吓瘫在地上。\n全场死寂。我大步走过去，一脚把那个新兵踹翻，然后把那碗汤端起来，重新塞回老头手里。\n“都给老娘听好了！”我环视着这群野兽，枪口有意无意地扫过高台上的索拉娜，“你们是狼，不是抢食的狗！谁敢对自己人龇牙，我就拔了他满嘴的牙！”\n索拉娜在高台上眯起了眼睛，她没生气，反而咧嘴笑了，举起酒杯冲我晃了晃，像是看了一场好戏。\n我冷冷地转过头。我不喝她的酒。我留在这里是为了盯着这群畜生，别让它们把最后一点人味儿都给嚼碎了。\n这把枪既然在我手里，那这里的规矩，就得有一半是我说了算。"
 PAM_.7.a: "（只要我在，谁也别想欺负老实人。）"

 #2 完成吃存量的傻瓜国策后
 PAM_.8.t: "种子的重量"
 PAM_.8.d: "“吃！都吃了！明天的事明天再说！”\n索拉娜在粮仓门口咆哮，她想把刚缴获的几千吨麦种都磨成面粉，给全城的人办一场狂欢节。周围的暴民们在欢呼，眼睛里冒着贪婪的光。\n“我看谁敢动！”\n我挡在粮仓大门前，拉上了枪栓。我的身后是那堆像山一样的种子，那是明年所有人活命的指望。我的面前是成千上万个饿红了眼的疯子，还有那个最疯的王。\n“雪伊，你别给脸不要脸。”索拉娜走过来，手按在剑柄上，眼神阴冷，“大家肚子都饿着，你护着这些不能吃的硬疙瘩干什么？”\n“因为吃了它，明年就会死更多的人！”我寸步不让，枪口顶着她的胸口，“你只管今天吃饱，不管明天饿死？那你跟那些只知道吸血的贵族有什么区别？”\n索拉娜愣了一下，她看着我，像是在看一个不可理喻的怪物。周围的人群开始骚动，有人想冲上来。\n“退后！”索拉娜突然转身，一鞭子抽在那个领头的暴民脸上，“没听见吗？这是明年的饭！谁敢动明年的饭，老子今天就把它炖了！”\n她骂骂咧咧地走了，临走前狠狠瞪了我一眼：“行，你清高，你管家。要是明年长不出麦子，我就把你埋进地里当肥料！”\n我松了一口气，后背全是冷汗。但我知道，我赢了。这头狼虽然贪，但她更怕死。只要让她知道这东西是保命的，她就会比谁都护食。\n好吧，既然你只管抢，那我就替你……把这份家当守住。"
 PAM_.8.a: "（这可是明年的希望。）"

 #3 打统一南美战争期间
 PAM_.9.t: "刹车片"
 PAM_.9.d: "深夜的作战室，索拉娜指着地图上那块标注着极度危险的沼泽地，眼睛里闪烁着赌徒的狂热。\n“从这儿穿过去！只要三天，我们就能直插敌人的心脏！”\n将领们都不敢说话，因为上次反对她的人已经被扔去喂亡灵了。\n“不行。”\n我把那一杯冷水泼在了地图上，也泼在了她的兴头上。\n“这沼泽里有毒气，还是亡灵的聚集地。你的兵还没见到敌人就会死光。你想赢，还是想送死？”\n索拉娜暴跳如雷，拔出剑把桌角砍了下来：“雪伊！你总是跟我唱反调！你是想造反吗？！”\n“我想让你赢！”我也吼了回去，声音比她还大，“你这辆破车开得太快了，要是没个刹车片，早就冲进沟里了！我是你的宪兵队长，我的职责就是要在你发疯的时候，给你一巴掌！”\n我们像两头母狮子一样对视着，空气里充满了火药味。过了许久，她把剑扔在地上，气呼呼地坐回椅子里。\n“……那你说，怎么打？”\n那一刻，我看到了她眼底的一丝依赖。她知道自己是个疯子，所以她需要我这个清醒的混蛋在她身边。她负责踩油门，我负责踩刹车。\n这很危险，但这很有效。只要我不松口，这辆战车就不会翻。"
 PAM_.9.a: "（只要我不点头，这路就走不通。）"

 #4 预计在完成国策撕掉那些肩章
 PAM_.10.t: "肮脏的手段"
 PAM_.10.d: "审判台上跪着那个以前在矿区作威作福的监工头子。按我的规矩，应该公审，列罪状，然后枪决。\n但索拉娜不耐烦地挥挥手：“太慢了。”\n她让人把监工绑在柱子上，然后对下面那些曾被他欺压过的矿工喊：“他以前怎么打你们的，现在你们就怎么打回来！打死算我的！”\n人群像决堤的洪水一样涌了上去。惨叫声，撕咬声，还有骨头碎裂的声音响彻广场。那是一场私刑，一场彻头彻尾的暴虐狂欢。\n我站在旁边，皱着眉，手按在枪套上，想去阻止这失去秩序的暴行。但晓枫拦住了我，她指了指那些矿工的脸。\n我看到了……解脱。\n那个平时最老实、却被监工打断过腿的汉子，此刻正一边哭一边用石头砸那个监工的尸体。他宣泄着积压了一辈子的恨，那恨意随着鲜血流出来，他的眼神从麻木变得鲜活。\n“雪伊，”索拉娜走到我身边，递给我一根烟，“你的法庭太干净了。对于这些在地狱里泡大的人来说，只有亲手把仇人的肉撕下来，他们才觉得自己真的站起来了。”\n我接过烟，没点，只是看着那狂热的人群。我不得不承认，她是对的。在这个扭曲的世道里，正义有时候必须长着一副狰狞的面孔，才能让受害者信服。\n她是那个负责把手弄脏的屠夫，而我……我是那个在事后负责把地洗干净的人。我们谁也离不开谁。"
 PAM_.10.a: "（有时候，血必须用血来洗。）"

 #5
 PAM_.11.t: "把后背交给你"
 PAM_.11.d: "这是一场伏击。那些伪装成难民的刺客从人群里冲出来的时候，离索拉娜只有不到五米。\n这蠢女人还在那儿给小孩发糖，根本没反应过来。\n我的身体比脑子更快。我冲过去，把她撞开，紧接着肩膀上就传来一阵剧痛——一把匕首扎了进去。\n“砰！砰！砰！”\n我躺在地上，单手举枪，把那三个刺客的脑袋像敲西瓜一样打碎。鲜血溅了我一脸，也溅了索拉娜一身。\n她从地上爬起来，看着我肩膀上的刀，那张从来都不可一世的脸上第一次露出了惊恐。她扑过来，手忙脚乱地按住我的伤口，吼得像是死了亲妈：“医生！死哪去了！救不活她我杀你们全家！”\n“别嚎了……”我疼得龇牙咧嘴，“……死不了。”\n“你傻啊！”她红着眼睛骂我，“你不是恨我吗？为什么替我挡刀？”\n“因为你是头狼。”我看着她，“你要是死了，这好不容易建起来的食堂就散了，那些刚吃饱饭的人又要去当流浪狗。我不是救你，我是救这口锅。”\n她愣住了，然后突然抱住了我，力气大得差点让我背过气去。\n“……雪伊，你这只母狼。”她在我也耳边咬牙切齿地说，“这笔账我记下了。以后你的命是我的，除了我，谁也不准动你。”\n我哼了一声，没有推开她。在这冰冷的泥地里，两个浑身是血的女人靠在一起，竟然也能感觉到一种……过命的温度。"
 PAM_.11.a: "（别误会，我只是不想让饭碗砸了。）"

 #6
 PAM_.12.t: "黑色的盾，红色的心"
 PAM_.12.d: "胜利阅兵的那天，索拉娜给了我一套崭新的、镶着金边的元帅礼服。那是用最好的黑呢子做的，威风凛凛。\n我穿上了它。但我做了一件让她没想到的事——我从怀里掏出那块旧的、洗得发白的红袖章，那是当年我们在莉兰迪亚起义时戴的，上面绣着“为人民服务”。\n我把它，郑重地戴在了这身黑色礼服的袖子上。黑与红，在这一刻显得格格不入，却又无比刺眼。\n索拉娜看着我，挑了挑眉：“你这是什么意思？给我的狼群掺沙子？”\n“不。”我整理好领口，看着镜子里的自己，“这是提醒。”\n“提醒你，也提醒我。我们这身黑皮是用来吓唬敌人的，是用来在黑夜里潜行的。但这块红布……是用来捂热心口的。”\n我转过身，直视着索拉娜。现在的她已经不仅仅是个强盗头子了，她是一个帝国的王，而我是这帝国的守夜人。\n“索拉娜，你尽管去征服，去抢掠，去做你那让人闻风丧胆的狼王。但我会一直站在你身后。我会用这身黑色的盔甲为你挡住暗箭，但我也会用这块红色的袖章，时刻勒紧你的缰绳。”\n“我们会建立一个没有人敢欺负的国度。在这里，狼有肉吃，人有尊严。而我……我就是那道底线。”\n索拉娜看着我，良久，她笑了。那笑容仿佛是一种君王对宰相、战友对战友的敬重。\n“好。”她伸出拳头，“带着你的红袖章，跟我走。去告诉全世界，我们这对最奇怪的搭档……是怎么把天捅破的！”\n我碰了碰她的拳头。黑色的洪流出发了，而在那洪流的最前方，有一抹鲜艳的红色，像心脏一样，永不熄灭地跳动着。"
 PAM_.12.a: "（我是狼群的良心，我是……不灭的野火。）"
 PAM.86.t: "来自宪兵队的直线"
 PAM.86.d: "“……喂？把酒杯放下。……别装，我听得见冰块撞玻璃的声音。\n今天阅兵的时候，我看你一直盯着我的袖子看。怎么？觉得那块洗发白的红布，配不上你赏给我的这身金边黑帅袍？\n觉得碍眼就对了。那就是根刺，是扎在你肉里的警钟，也是……我给你的承诺。\n索拉娜，说实话，我以前恨不得把你这头野兽关进笼子，觉得你脏，觉得你是个没有底线的强盗。但今天看着台下那些不再面黄肌瘦的脸，看着那些把你的名字刻在枪托上的士兵，我承认——在这个吃人的世界里，光有理想填不饱肚子，光有主义挡不住子弹。确实需要你这样的恶狼，去撕开一条血路。\n你负责去做那个让世界颤抖的暴君，去抢，去夺，去把所有肮脏的活儿都干了。而我……我会守在你的影子里，做那个让你‘不舒服’的人。\n只要这块红袖章还在，只要我还站在你身后，你就永远不用担心自己会彻底堕落成那些我们曾经最痛恨的贵族。因为一旦你越过了那条线，我会毫不犹豫地把你拽回来——哪怕是打断你的腿。\n所以，安心地去疯吧，索拉娜。你的背后是安全的，你的灵魂……我也替你守着了。\n……行了，挂了。早点睡，别逼我半夜去踹你的门。”"
 PAM.86.a: "（嘟—嘟——听筒里传来了打火机点烟的声音）"

# 小果子好感度 0 #1
 PAM_.13.t: "黑帆下的囚徒"
 PAM_.13.d: "“海风不再是咸的，是腥的。\n我站在驾驶台上，手里握着那个熟悉的舵盘，但我感觉不到一丝自由。这艘船曾经叫‘希望号’，是为了给同志们运送种子的。现在，它挂着黑色的狼头旗，甲板上堆满了从港口抢来的金银器皿。\n那些跟着我的水手，那些曾经为了保护半袋面粉敢跟风暴搏斗的战士，现在正穿着从死人身上扒下来的皮靴，大口嚼着抢来的肉干，眼神里闪烁着和索拉娜一样的、贪婪的绿光。\n这还是我的舰队吗？\n晓枫姐教过我，船是连接世界的桥。可现在，我们变成了切断喉咙的刀。那个疯女人把我们变成了海盗，变成了我们曾经最痛恨的掠夺者。\n我看着黑色的海面，感觉自己正驾驶着这艘船，一点一点地驶向一个没有灯塔的深渊。我的胃里翻江倒海，我想吐，但我吐不出来。因为我知道，如果我不握紧这个舵，船上这些人——这些即使变成了野兽也依然是我的家人的家伙，就会立刻葬身鱼腹。\n为了让他们活，我必须……成为这艘贼船的帮凶。”"
 PAM_.13.a: "（舵盘……好冷。）"

 # 小果子好感度 20 #2
 PAM_.14.t: "带血的蜜糖"
 PAM_.14.d: "“今天我们截获了一艘商船。那是属于一个大财阀的船，满载着昂贵的蔗糖和咖啡。\n按照以前的纪律，我们应该征用物资，然后放人。但索拉娜的命令只有两个字：‘不留’。\n我的炮手们欢呼着开火，看着那艘船在火光中断成两截。然后，他们像鲨鱼一样跳进水里，把那些漂浮的货物捞上来。\n晚上，这些糖被分发了下去。我看到一个小水手，他才十六岁，正躲在角落里，把一块沾着海水甚至可能沾着血的糖块塞进嘴里。他哭了，一边哭一边笑，那是他这辈子第一次尝到这种纯粹的甜味。\n‘头儿，真甜啊……’他对我说，‘我给我妈留了一半。她快饿死了，有了这个，她就能活了。’\n我看着他那张因为长期营养不良而凹陷的脸，手里原本想扔掉的那块糖，突然变得千钧重。\n这就是索拉娜的逻辑吗？杀掉那些高高在上的‘他’，抢来他们的血肉，喂饱我们这些在泥里打滚的‘他’。\n这很残忍，这很野蛮，这违背了书本上写的一切正义。\n可是……看着那个孩子脸上的血色，我那句‘这是赃物’的斥责，却卡在了喉咙里，怎么也说不出口。”"
 PAM_.14.a: "（这糖……全是铁锈味。）"

 # 小果子好感度 40 #3
 PAM_.15.t: "与鬼同航"
 PAM_.15.d: "“底舱传来了抓挠声。\n那是索拉娜塞给我的‘新船员’。一整队的亡灵水鬼。它们不需要呼吸，不怕水压，可以像藤壶一样吸附在船底，或者在深海里潜伏几天几夜。\n活人们害怕它们，我也怕。那种死亡的气息弥漫在整艘船上，连老鼠都逃光了。\n昨晚遇到风暴，主桅杆断了，几十吨重的横梁砸下来，眼看就要把机轮室压扁。那里躲着十几个受伤的活人兄弟。\n就在那一瞬间，那些被我们恐惧的亡灵冲了上去。它们用只有骨架的身体顶住了横梁。咔嚓、咔嚓，我听到了骨头碎裂的声音，看到了它们眼里的魂火因为承受重压而爆燃。\n它们被压碎了。变成了粉末。\n但是机轮室保住了。里面的活人兄弟吓得脸色惨白，却毫发无伤。\n风暴过去后，索拉娜发来了电报，只有冷冰冰的一句话：‘工具坏了可以再缝，人死了就没了。别心疼骨头，心疼你的活人。’\n我看着甲板上那堆惨白的骨粉，被海风一点点吹散。\n那个女人……她把死者变成了奴隶，却把生者护在了身后。这究竟是亵渎，还是……一种我也无法理解的、扭曲的慈悲？\n我感到一阵彻骨的寒意。为了活下去，我们真的连死人的安宁都要剥夺吗？”"
 PAM_.15.a: "（谢谢……对不起。）"

 # 小果子好感度 60 #4
 PAM_.16.t: "沉默的帮凶"
 PAM_.16.d: "“我的手已经稳了。无论是下令开炮，还是看着敌人的船沉没，我的心跳都不会再加速了。\n今天，我们炮击了一座被殖民者控制的港口。那是为了掩护陆军抢夺那里的煤炭资源。\n透过望远镜，我看到港口里燃起大火，看到那些穿着体面衣服的绅士和淑女在火海里尖叫奔逃。而我们的登陆艇，那些载着贫民窟出身的士兵的小船，像饥饿的蚂蚁一样涌上去，搬空了每一座仓库，甚至拆掉了铁轨。\n我看到一个贵族在岸边向我们的船挥舞着白手绢，试图用金表换一个座位。我的大副，那个以前连鸡都不敢杀的老实人，面无表情地给了他一枪，然后把金表捡起来，揣进兜里。\n‘为了黑狼。’他低声说。\n我甚至没有转过头去。\n我已经习惯了。习惯了这种弱肉强食，习惯了这种把文明踩在脚下的快感。\n晓枫姐送给我的日记，我已经很久没敢翻开了。我怕看到上面那些关于‘理想’、‘解放’的字眼。\n现在的我，还是那个想要带大家回家的小海鸥吗？\n不，我只是一只染了色的乌鸦，盘旋在尸体上，等着分一口腐肉。\n这片海域越来越黑了，连星星都看不见了。”"
 PAM_.16.a: "（只要能赢……变成怪物也没关系吧？）"

 # 小果子好感度 80 #5
 PAM_.17.t: "深渊的尽头"
 PAM_.17.d: "“我们赢了。南美的海岸线都在我们的控制之下了。无数的财富像河流一样汇入莉兰迪亚。\n庆功宴在甲板上举行。士兵们醉得东倒西歪，有人在撒钱，有人在对着大海狂吼。索拉娜在王宫里发来了嘉奖令。\n我躲在缆绳堆里，抱着膝盖，看着漆黑的海面。我想哭，可是眼泪好像流干了。\n我救了很多人，是的。我的船员们都胖了一圈，他们寄回家的钱让村子里盖起了新房。可是……代价呢？\n代价是我们变成了我们曾经最讨厌的人。我们变成了强盗，变成了暴徒，变成了让世界恐惧的灾难。\n这真的是晓枫姐想要的未来吗？这真的是雪伊姐想看到的胜利吗？\n我们活下来了，但‘我们’好像也死去了。\n那个看着萤火虫会笑的小女孩，那个相信世界会变好的小果子，已经死在了这片黑色的海里。\n我想跳下去。跳进这冰冷的海水里，洗干净这一身的血腥味。也许在海底，我能找到那个干净的、纯粹的梦。\n索拉娜……你赢了。你把我也变成了和你一样的、失去了心脏的狼。”"
 PAM_.17.a: "（既然都是地狱，哪里还有方向？）"

 # 小果子好感度 100 #6
 PAM_.18.t: "风暴眼中的灯塔"
 PAM_.18.d: "“‘这就是你想死的地方？’\n一个粗鲁的声音打断了我的自毁。索拉娜不知什么时候站在了甲板上，那件黑色的狼皮大衣被海风吹得猎猎作响。她手里提着一盏马灯，那光芒刺痛了我的眼睛。\n‘你觉得我们脏？觉得我们是强盗？’她把灯举高，照亮了码头。\n我顺着光看去。\n那里，成千上万个衣衫褴褛的人——老人、妇女、孩子，正围在我们的运输船旁。他们在哭。他们从那些凶神恶煞的士兵手里接过一袋袋粮食，接过那些我们从贵族手里抢来的、沾着血的‘赃物’。\n一个母亲跪在地上，把面粉抹在孩子饿得发青的脸上；一个断腿的老兵抱着一瓶药，像抱着他的命。\n‘看清楚了，小果子。’索拉娜的声音带着一种我不曾察觉的、深沉的疲惫和坚定。\n‘这世上只有两种干净。一种是躲在象牙塔里，看着别人饿死，自己保持手不沾血的干净；另一种……是跳进烂泥坑里，把自己弄得满身污垢，也要把这群人从死人堆里刨出来的干净。’\n‘野火的理想是好的，但火在水里是烧不起来的。在这个吃人的世道，想让这群羊活下去，我们就必须变成比狼更狠的野兽。’\n她走到我面前，把那盏灯塞进我手里。那灯罩是温热的，像一颗跳动的心脏。\n‘我负责当那个恶人，我负责抢，我负责杀，我负责背负所有的骂名。而你……’她指着那群正在吃饭的百姓，‘你负责把东西运回来，喂饱他们。’\n‘别想那些没用的。只要他们还活着，只要他们还能笑，我们就算下地狱……也是昂着头下去的。’\n那一瞬间，海面上的乌云裂开了一道缝隙，晨光像利剑一样刺破了黑暗，照亮了索拉娜那张狂妄却坦荡的脸，也照亮了码头上那些卑微却真实的生命。\n我握紧了那盏灯。\n原来……这就是答案。\n我们不是堕落了。我们是把理想从云端拽进了泥土，用血肉给它筑起了围墙。\n在这黑色的狼皮下，那团火……从来没有熄灭过。它只是为了守护这些脆弱的火种，而把自己变成了钢铁的熔炉。\n‘……我明白了。’我擦干了脸上的泪痕，站直了身体，向这位暴君，也是这位真正的守护者，敬了一个礼。\n‘船队准备完毕。头儿，哪怕是地狱……我也为您把路闯开。’”"
 PAM_.18.a: "（起航！为了……活着的尊严！）"
 PAM.87.t: "来自海平面的潮声"
 PAM.87.d: "“……喂？索拉娜姐姐……不，头儿。\n是我。别嫌我啰嗦，海上的信号不好，有些话我现在不说，怕到了浪尖上就没机会说了。\n刚才，那个拿了面粉的母亲，非要塞给我一个刚编好的贝壳手链。那贝壳很糙，还没打磨好，但我戴上了。挺好看的，对吧？\n以前我总觉得，只有白色的帆才是干净的，只有不抢东西的船才是正义的。我怕脏，怕血，怕变成坏人。\n但今天……看着您提着那盏灯站在黑漆漆的码头上，我突然明白了一件事：\n灯塔之所以能发光，是因为它把自己立在了风浪最大、最危险的礁石上。您就是那块礁石，您替我们挡住了所有的浪，挡住了所有的骂名。\n既然您愿意做那个满身污泥的恶人，那我就不能再当那个躲在后面哭的小女孩了。\n放心把大海交给我吧。不管还要抢多少东西，不管还要运多少‘赃物’……只要能把我们的家填满，只要能让那个孩子脸上有肉……我这双手，愿意陪您一起脏下去。\n……海风有点大，您把领子竖起来点，别吹着了。\n我的船队……要出发了。”"
 PAM.87.a: "（嘟—嘟——海浪声中夹杂着一声吸鼻子的声音）"

  # 莉莉安娜好感度 0
 PAM_.19.t: "缝合的布娃娃"
 PAM_.19.d: "“今天，索拉娜带我去了她的‘工厂’。不是制造子弹的，是制造士兵的。\n那里挂满了残缺的肢体，像屠宰场里的肉块。工匠们用粗大的针线，将那些战死的尸体缝合起来，塞进死灵的内核，让它们重新站起来。\n我看到了一个被缝合好的作品。它有着成年人的躯干，却接着一只显然属于少年的手臂。那只手臂上还戴着一个编织粗糙的草环，上面沾着干涸的血迹。\n‘它很完美，对吧？’索拉娜得意地拍着那个怪物的肩膀，‘它会是最忠诚的盾牌。’\n我走过去，轻轻握住那只不协调的手臂。在冥界的视角里，这只是物质的重组。但在那一刻，我仿佛听到了两个灵魂在接缝处的嘶吼。\n一个是失去了身体的战士，一个是失去了手臂的孩子。他们被强行捆绑在一起，被迫去打一场已经结束的战争。\n‘……疼吗？’我轻声问。\n那个怪物空洞的眼眶里只是机械地转动了一下脖子，发出一声令人牙酸的骨骼摩擦声。\n我拿出随身携带的手帕，那是索拉娜送我的、最柔软的丝绸。我小心翼翼地，把那道狰狞的缝合线包了起来，打了一个漂亮的蝴蝶结。\n索拉娜愣住了，周围的工匠也愣住了。\n‘莉莉，那是死人……’\n‘我知道。’我打断了她，手指轻轻抚摸着那个蝴蝶结，‘但它……也曾是谁的父亲，谁的孩子。’\n‘如果不把它缝得漂亮一点，它的家人……会认不出它的。’\n那个怪物突然安静了下来。它低下头，用那只借来的手，笨拙地碰了碰那个蝴蝶结。一滴浑浊的尸液，从它那干枯的眼眶里，滑落了下来。”"
 PAM_.19.a: "（至少……让它体面地走。）"

 # 莉莉安娜好感度 20 
 PAM_.20.t: "静谧的裂痕"
 PAM_.20.d: "“太吵了。我的耳膜在震颤，那是火药爆炸的轰鸣，是金属切入骨骼的脆响，是几万个喉咙同时发出的濒死哀嚎。\n我站在满是烂泥的战壕边，白色的裙摆被溅上了黑色的血污。索拉娜就在前面，像一头疯兽般挥舞着长剑，每一次劈砍都带起一蓬热气腾腾的血雾。\n我本能地想要后退，想要用魔力封住听觉，回到那个属于我的、永恒寂静的冥界。那里只有完美的、冰冷的秩序。\n可是，一只手抓住了我的脚踝。\n那是一个只有半截身子的年轻士兵。他的肠子拖在泥水里，还在冒着热气。他的眼睛已经灰败了，但他那只沾满泥浆的手，却扣住了我的脚腕，力气大得惊人。\n‘救……救我……’他喉咙里发出风箱般的声音，血沫从嘴里涌出来，‘我不想死……我不想变冷……’\n我看着他。在我的国度里，死亡是安息，是回归。可在这里，死亡是恐惧，是不甘，是拼命想要抓住最后一点余温的挣扎。\n我伸出手，想要用死灵魔法带走他的痛苦，让他安息。可就在指尖触碰到他额头的一瞬间，我缩回了手。\n因为我看到了他眼底的那团火——那是对生的渴望，比索拉娜的剑还要炽热。\n如果我让他安息，那就是熄灭了这团火。那就是……杀了他。\n我僵在原地，任由那只手一点点变冷，直到彻底僵硬。那种逐渐流失的温度，像烙铁一样烫在我的脚腕上，烫进了我的灵魂里。\n原来，这就是活着的声音吗？如此刺耳，却又……如此滚烫。”"
 PAM_.20.a: "（这温度……擦不掉了。）"

 # 莉莉安娜好感度 40
 PAM_.21.t: "花与骨"
 PAM_.21.d: "“春天来了，但战场上只有焦土。索拉娜的坦克碾碎了每一寸草皮，只留下了履带的深痕和机油的恶臭。\n我独自一人走在阵地后方。那里有一片乱葬岗，埋着昨天死去的野火游击队员，也埋着我们这边倒下的狼群士兵。他们生前互相撕咬，死后却挤在同一个泥坑里，分不清彼此。\n我看到一个小小的身影蹲在坟堆旁。是个只有五六岁的小女孩，手里抓着一把枯萎的野花。她在哭，哭得很伤心，因为她找不到哪一个是她的哥哥了。\n‘他们都变成了骨头……’她抽泣着说，‘骨头都长得一样……哥哥去哪了？’\n我看着那片狼藉的土地。是啊，死亡是最大的平等，它抹去了所有的特征，只留下了苍白。\n我应该转身离开，或者用魔法让她遗忘。但我没有。\n我跪在泥地里，掌心贴着冰冷的坟土。我闭上眼，调动起那股属于夜莺之心的残余力量。这一次，是为了……唤醒记忆。\n幽蓝的光芒渗入地下。片刻后，奇迹发生了。\n一朵朵颜色各异的小花，从那些无名的坟包上钻了出来。有的红得像火，那是性格暴烈的冲锋手；有的白得像雪，那是沉默寡言的医疗兵；有的是蓝色的勿忘我，那一定是个爱写信的年轻人。\n每一朵花，都对应着一个灵魂生前最鲜艳的颜色。\n‘看，’我指着其中一朵倔强地开在石头缝里的小黄花，‘那个……是不是像你哥哥笑起来的样子？’\n女孩停止了哭泣。她扑过去，小心翼翼地抱住了那朵花，脸上露出了混着泪水的笑容。\n我站起身，裙摆上全是泥土。但我第一次觉得，这泥土的味道……并不难闻。它混合着腐朽与新生，那是……大地的味道。”"
 PAM_.21.a: "（原来，死亡也可以开花。）"

 # 莉莉安娜好感度 60
 PAM_.22.t: "染血的白裙"
 PAM_.22.d: "“敌人的突袭来得毫无征兆。炮火撕碎了防线，指挥部被炸塌了一半。索拉娜被埋在了废墟下，生死未卜。晓枫在组织反击，雪伊在带人挖掘。\n周围全是伤员，哀嚎声此起彼伏。医疗品用光了，医生们束手无策。一个年轻的护士跪在血泊里，绝望地捂着一个士兵脖子上的大动脉，但血依然像喷泉一样涌出来。\n‘止不住……止不住啊！’她哭喊着。\n我站在那里，看着那鲜红的液体染红了地面。那是生命，正在流逝的生命。\n我有能力救他。但我知道代价。在生者的世界使用这种逆转生死的魔法，会反噬我的灵体，会让我的灵魂染上无法洗净的污秽。\n我是冥界的公主，我本该一尘不染。\n‘……莉莉安娜，走吧。’心底有个声音在劝我，‘这不是你的战争，你已经做得够多了。’\n我看向废墟深处，那里埋着我最爱的人。如果她醒来，看到满地的尸体，她会疯的。\n我深吸了一口气，提着洁白的裙摆，走进了那片血泊。我跪在那个士兵身边，推开了护士的手。\n‘按住他。’我命令道，声音异常冷静。\n我将双手按在他的伤口上，吟唱起那首古老的、被视为禁忌的咒语。幽蓝的光芒与鲜红的血液交织在一起，发出滋滋的声响。我的皮肤开始溃烂，黑色的纹路顺着手臂蔓延，那是生与死冲突留下的诅咒。\n很疼。比我想象的还要疼一万倍。像是有无数把刀在切割我的灵魂。\n但我没有停。直到伤口愈合，直到那个士兵微弱的呼吸重新变得有力。\n我站起身，曾经一尘不染的白裙已经被鲜血染成了暗红，手臂上满是狰狞的黑斑。我看着镜子里的自己，那样丑陋，那样狼狈。\n但我笑了。\n因为我终于……变得和索拉娜一样了。我终于，也染上了这人间的颜色。”"
 PAM_.22.a: "（这脏兮兮的样子……真美。）"

 # 莉莉安娜好感度 80
 PAM_.23.t: "神明的谎言"
 PAM_.23.d: "“今晚的月光很冷，照得索拉娜的脸像一张白纸。她又在做噩梦了，梦里喊着‘饿’，喊着‘别抢我的面包’。\n我握着她的手，那只手即使在睡梦中也紧紧攥着拳头，仿佛随时准备挥出去。我看着她，又看向窗外那个沉睡的城市。那里有无数和她一样的人，在梦里依旧不敢松开眉头。\n我曾以为，我是神明，我拥有永恒。我曾以为，只要把他们带回夜莺之国，赐予他们寂静，就是最大的仁慈。\n但我错了。\n今天下午，我看到一个断了腿的老兵，为了给孙女买一个风车，在街角坐了一整天。他很累，很痛，但他看着孙女拿着风车奔跑时，那张满是皱纹的脸上绽放出的光彩，比我见过的任何星辰都要耀眼。\n那一刻我明白了。我的永恒是虚假的。它只是把时间冻结，把痛苦和快乐一起剥离，那是标本的永恒，不是生命的永恒。\n真正的活着，就是会痛，会饿，会流血，但也正因为会痛，那个拥抱才温暖；正因为会饿，那口面包才香甜。\n我所谓的救赎，其实是一种傲慢的剥夺。我剥夺了他们感受痛苦的权利，也就剥夺了他们感受幸福的资格。\n索拉娜……你这个傻瓜。你早就知道这些了，对吗？所以你才宁愿在泥潭里打滚，也不愿做我笼子里的金丝雀。\n我俯下身，吻了吻她紧皱的眉心。\n‘对不起。’我轻声说，‘我不会再试图把你们变成雕像了。我会守在这里，守着你们的痛，守着你们的梦。’”"
 PAM_.23.a: "（痛楚……才是活着的勋章。）"


 # 莉莉安娜好感度 100
 PAM_.24.t: "裙角的泥点"
 PAM_.24.d: "“战后的第一个丰收节，雨下得很大。索拉娜疯了一样在王宫里咆哮，因为她找不到我了。\n‘她一定是走了！那个傻瓜！她是不是觉得自己多余了？是不是回那个冷冰冰的冥界去了？！’\n我听得见她在雨里的嘶吼，听得见她踹开一扇扇大门的巨响。那声音里全是恐惧。\n但我没有回应。我正忙着。\n我站在城外的一片红薯地里。这里是以前的乱葬岗，现在被垦成了良田。雨水混合着翻开的黑土，变成了黏稠的泥浆，没过了我的脚踝。\n我的那件曾象征着冥界至高无上的、一尘不染的白色长裙，此刻已经吸饱了泥水，沉甸甸地拖在地上，脏得像一块抹布。我的双手，那双曾经只用来编织魔咒、只用来触碰灵魂的手，现在沾满了黑色的泥垢，指甲缝里塞满了沙砾。\n我在挖红薯。\n一个穿着破棉袄的老农妇蹲在我旁边，她把我当成一个笨手笨脚的新手，一边利索地刨土，一边絮絮叨叨地教我：‘闺女，劲儿别使得太死，要顺着根须……哎对，就是这样。’\n我用力一拔，一个并不怎么好看、甚至有些歪瓜裂枣的红薯破土而出。它带着湿润的泥土气息，沉甸甸地压在我的掌心。\n那一瞬间，我感受到了一种比夜莺之心还要强烈的悸动。\n在我的国度里，水晶花永不凋谢，但也永不生长。那里的一切都是静止的完美。\n而手里这个丑陋的红薯，它会腐烂，它身上沾着脏东西，它并不完美。但它里面藏着太阳的热量，藏着雨水的味道，藏着能让人活下去的力量。\n‘找到了！！’\n索拉娜浑身湿透地冲了过来，她看到满身是泥的我，整个人僵在了田埂上。她张大了嘴，像看怪物一样看着我。\n‘莉莉……你……你在干什么？你的裙子……你的手……脏死了！’\n她想冲过来抱我，又怕弄疼我；想骂我，又舍不得。\n我直起腰，用手背擦了擦脸上的雨水（顺便把一道泥印子抹在了脸上），然后举起那个红薯，对着她露出了一个灿烂的、傻气的、甚至有点粗鲁的笑容。\n‘索拉娜，你看。’我大声说，声音穿透了雨幕，‘这是我种出来的。不是变出来的，是种出来的。’\n‘以前我以为，爱是把你关在干净的笼子里，不让你沾染一粒灰尘。现在我懂了。’\n我深一脚浅一脚地走到她面前，把那个脏兮兮的红薯塞进她手里，强行把她那双总是握剑的手，按进了泥土的温度里。\n‘这个世界之所以值得你拼命，是因为它脏得真实，脏得热烈。’\n‘我不走了，索拉娜。冥界太干净了，我不习惯。’\n‘我要留在这里。和你，和晓枫，和这些种地的大娘一起。我要把裙子弄脏，把手磨破，我要学着怎么在这个烂泥坑里……种出最甜的果实。’\n索拉娜呆呆地看着我，又看了看手里的红薯。突然，她把脸埋进了我满是泥水的肩膀，发出了一声像是哭，又像是笑的闷响。\n雨还在下，但我知道，从这一刻起……\n我终于，真正地，降临在了人间。”"
 PAM_.24.a: "（欢迎来到这脏兮兮的、美好的人间。）"
 PAM.88.t: "来自壁炉旁的连线"
 PAM.88.d: "“……喂？索拉娜？是我。\n不许吼，也不许再踹门了。我听得见你在走廊里像头焦虑的狮子一样转圈的声音。\n我现在在厨房里。……不，别进来。我就想隔着这根线跟你说几句话。\n我刚刚把那个红薯洗了。我洗得很认真，可那上面还是坑坑洼洼的，就像你脸上的伤疤一样，怎么洗都洗不掉那种粗糙的感觉。那位大娘说，这叫土气，是好东西。\n你知道吗？在夜莺之国的一万年里，我的手总是凉的，摸到的宝石也是凉的。我从来不知道，原来东西还可以是糙的，还可以是热的。\n现在，我的指甲缝里还有泥，我的裙摆还没干，但我感觉……我从来没有像此刻这样，和你靠得这么近。\n你总是说要把我捧在天上，但我不想在天上了。天上太冷，也没有你。\n既然你是一头满身泥泞的狼，那我就做那个在泥地里种花的园丁。我们一起脏，一起累，这才叫一家人，对不对？\n……好了，炉子热了。我问过厨师了，他说这个要烤着吃才最香。\n进来吧，我的狼王。\n今晚只有我亲手种、亲手洗、亲手烤的红薯。\n……而且，你必须吃完，还得夸我做得好吃。这是……公主的命令。”"
 PAM.88.a: "（嘟—嘟——电话那头传来了木柴爆裂的噼啪声）"
#索拉娜二线
PAM.92.t:0 "瞧瞧这双新眼睛"
PAM.92.d:0 "夜莺用袖口蹭掉镜面上的灰。铜镜里露出一小块光，刚好框住了索拉娜的半张脸。\n\n剪刀在她手里走得很稳，碎发一缕一缕落在索拉娜的肩头，慢慢堆进了领口的褶子里。直到刘海修到了眉梢上面一点，她才偏着头端详了起来，好一会儿，又把中间那一小缕剪短了些。那些头发要是再短一厘，大概就要翘起来了。\n\n索拉娜盯着镜子里那个套在裙子里的女孩。以前坐在王座上的那个人，如今缩成了这么矮的样子。就凭现在这副样子，就算把眼睛瞪得再圆，也压不住两边立着的侍卫了。\n\n夜莺拿木梳的脊背轻轻敲了敲铜镜边沿，长廊深处荡开几声空落落的回音。她歪着头看向镜中那张脸，声音轻巧地落在索拉娜耳边。\n“索拉娜，这次的新发型，你还喜欢吗。”\n\n女孩把头偏过去了。\n\n夜莺也没有追问。她把梳子齿缝里卡着的几根断发抽出来，对着灯看了一眼，随手夹进旁边翻开的那本书里。然后她拎起裙摆，牵住了那只比自己的手掌还小一圈的手。\n\n门外，守夜的亡灵一动不动地立着。两人从中间穿过的时候，那些木讷的脸孔纹丝不动。只有脚步声，轻轻的，顺着长廊往更深处去了。"
PAM.92.a:0 "“那么，故事都安排好了吗。”"

PAM.93.t:0 "起风了"
PAM.93.d:0 "木桶顺着坡道一路滚远了，残羹冷炙泼洒出去，溅得满地都是。\n库房的木门被撬棍砸得变了形，铁锁来回撞击着门板，闷响一声追着一声。街上的人流推搡着挤作一团，捞起生面粉拼命往嘴里塞，他们的指缝间糊满了泥，他们想在暴雨浇透身体之前把肚子填饱。\n\n夜莺站在廊檐下，风把她的衣摆往后扯得笔直，刚好遮住身后那个矮个子的身影。她眼里亮着幽紫的光，正倒映着远处几簇跳动的火苗。\n“索拉娜，底下的声音太吵了。要是墙壁给火熏黑，待会儿在上面描花可就费事啦。”\n\n她伸手扣住了索拉娜的手腕，语气就像在商量一件特别平常的小事。\n“去把那些火把收回来吧。大家现在这么有力气的话，不如天亮之后就都到河边挑泥修路吧，正合适呢。至于眼下嘛，还是躺下睡一觉比较好，可别惊扰了这么凉快的夜风。”\n\n索拉娜的指头搭在刀柄上。她想把腰间那柄佩刀拔出来，可是这双手实在太小了，锈住的刀鞘纹丝不动。\n\n此时的夜莺正用温温软软的注视着她，迫使她松开了手指。一根，再一根，直到刀刃滑回了鞘底。\n\n街上，那些争夺粮袋的人接二连三地歪倒在路边，沉沉地睡了过去。风里翻涌的喧闹，终于平息了下来。"
PAM.93.a:0 "嘘"

PAM.94.t:0 "请诸位入座吧"
PAM.94.d:0 "远方的风送来庄园那边的喊叫声，深山里还能看见零星的火光。士兵们铁靴踏过路面，那清脆的声响在空旷的街道上传出去很远很远。\n\n夜莺从木匣里翻出几根布条，洗得干干净净的，上面还系着浅色的鸟羽。她走到窗前，手指顺着索拉娜的长发慢慢梳了下去。索拉娜的头发很软，梳子一过就顺了，不像她自己的头发那样总是打结。\n“索拉娜，你看这些布条，能给每个人都编出漂亮的辫子哦。她们现在都在黑暗里哭呢。活得这么辛苦，不如都到书里来吧。这里不但安全，还永远暖和呢。”\n\n话音刚落，街上那些吵闹的人全都因为一种无形的力量慢慢停下了动作，他们身上的泥水渐渐褪去，然后换上了干净又优雅的裙子。\n\n再也不用担心挨饿了，也再也不用担心受伤了，只需要安安静静的过好自己的一辈子。这便是夜莺能给予她们的全部了。\n\n索拉娜感到脑海里那些对食物和权力的渴望，正被这股浓郁的睡意一点点化开。她靠在窗框上，眼皮渐渐沉了下去。\n夜莺捧起了书，翻过了新的一页，然后朝窗外弯起了眼睛。\n“来，故事该进入下一幕了。”"
PAM.94.a:0 "温柔的童话，现在开演了哦。"

PAM.95.t:0 "茶凉了"
PAM.95.d:0 "庄园的大门敞开着，台阶上长满了青苔，踩上去滑溜溜的，得扶着门框才不至于摔倒。\n\n写着税目和地契的纸张散落在雨水里，早就被泡得稀烂，字迹化成了一滩黑水，顺着石阶的缝隙往下渗，淌过青苔的时候把苔藓也染黑了。\n\n原先在厅堂里神气活现的绅士们，如今换上了粗糙的布衣，安分地坐在台阶最下方。有人手里还捏着一颗刚从地里刨出来的花生，壳上的泥都没洗干净，指甲缝里全是黑乎乎的烂泥。\n\n夜莺提起裙摆蹲下身，发梢系的羽毛顺势划过老人的额头，轻得就像落了一片叶子。那个老人下意识地缩了一下脖子，然后又慢慢放松了下来。\n“索拉娜，你瞧，老先生们换了新衣服，是不是看起来年轻多了？”\n\n索拉娜不作回答，她正抱膝坐在门槛上，盯着门口的黑水出神。\n\n夜莺端起茶碗递了过去。茶是刚沏好的，热气扑在索拉娜脸上，带着一股很好闻的茉莉花香。\n“给你的茶沏好了哦。喝完就去休息一下吧，以后记得多去看看月亮，或许能让你的心里更舒服一些呢。”\n\n大门外，侍从抬着木箱，把整箱的黄金码在街面上，在月光底下泛着冷冷的光。\n\n那些用杀戮换来的财宝，现在再也没有人多看一眼了。"
PAM.95.a:0 "第一幕"

PAM.96.t:0 "风停了"
PAM.96.d:0 "谷地里的枪炮声终于消停了。那些习惯在丛林里流汗的士兵，正抱着所剩无几的干粮蹲在战壕里瑟瑟发抖。\n\n夜莺踩着水洼走来。鞋底踩过的地面结起碎冰，每一步都带出清脆的裂响，冰面上映着她裙摆的颜色，正随着步伐碎成一小片一小片的。\n“索拉娜，这些固执的家伙，现在终于安分了。”\n\n索拉娜在后面慢慢地走着，身上裹着厚实的大衣。\n\n她看着战壕里那些一动不动的士兵。那是她曾经准备带着去跟全世界交锋的黑狼军团。她张开嘴，想对部下下达口令，可是喉咙里却一片干燥，发出来的唯有小女孩细微的抽噎。\n战壕里的部下纹丝不动，如同泥塑。她们已经化作了温顺的雕像，再也不会跟着她龇牙咬人了。\n\n夜莺弯下腰，捡起一支枪掂了掂分量，又轻轻放下，靠在了战壕的边上。\n“风停了，就去把坏掉的屋顶修好吧。以后大家不用扛这些发沉的铁家伙了哦。”\n\n索拉娜看着那些接连闭上眼的旧部下，转过了身，没眼再继续看下去了。\n\n不知不觉中，两人的影子已在结霜的铁轨上逐渐拉长，随夕阳一同沉没在了整个世界里。"
PAM.96.a:0 "第二幕哦"


PAM.97.t:0 "可风雪还没停"
PAM.97.d:0 "废墟上的滚滚烟尘平息了下去。那面缝满补丁的红旗倒在草丛里，正渐渐化作冷透的灰。\n\n原本握紧了拳头、在火光前不肯低头的人们，如今换上了洋娃娃般的衣服，在墙根下站着一动不动。\n\n夜莺半蹲在地上，把烘干的衣裳放在了她们面前的长凳上，说道：\n“换上吧，穿着湿衣服会着凉的。”\n\n面前的人，正是晓枫和雪伊，她们的衣服很整洁，脸上洗得光洁无比，再也看不到曾经的灰烬与伤痕。可她们的眼睛里失了温度，已经变成纸页上听话的孩子了。\n\n夜莺又翻过一页手中的书。“雪伊，晓枫。累了就歇一歇吧。等天亮了之后，我会为你们讲下一章的故事的。”\n\n窗外的风还在呼呼作响。这里的门窗关得严严实实，屋里温暖得让人沉醉无比。\n索拉娜的心口却一片冰冷。"
PAM.97.a:0 "夜还长着呢"

PAM.98.t:0 "今晚月色很好"
PAM.98.d:0 "窗外的风声彻底安静了下来。瓦缝间落下的雨水积在庭院的小土坑里，正好倒映着一轮满月。水面很静，月亮在里面一动不动。一只飞蛾从水面上掠过，翅膀尖轻轻点了一下，涟漪便把月亮扯成了一圈一圈的碎银。\n\n整个院落安稳无声。只有椅子上放着的一碗茶水引人注目。夜莺在台阶下坐着，裙摆像一朵刚刚落下的花一样在石阶上铺开。她伸手碰了碰茶碗的边沿，感觉到茶已经凉了，她便把手缩了回来，露出了很满意的笑容。\n\n莉莉安娜走过来的时候脚步声很轻。她挨着索拉娜坐下，裙角在夜风里叠在一处。\n\n索拉娜已经习惯了这种安静，早忘了在泥泞里呼喊需要多大的力气，也忘了被雨水浇透之后裹着一条旧毯子缩在墙角发抖是什么滋味。那些都离她很远了。\n\n莉莉安娜拉住她的手。那只手软软的，却透着一股子刺骨的凉意。\n“索拉娜，你的手怎么这么冷？”\n\n索拉娜仿佛没听见对方的话语似得，任由自己倒在莉莉安娜的怀里，闭上了眼睛。\n\n这个怀抱暖和得让人不想动弹。像铺满了玫瑰花瓣的棺材。花香浓郁，木板柔软，躺在里面什么都不用想，什么都不用做。她就这么在这片温暖里彻底放弃了挣扎，沉沉地睡了过去。\n\n夜莺把膝盖上的书翻了开来，一直翻过了最后一页，直到把封面彻底合拢。把所有的热血和喧哗都被夹得严丝合缝。"
PAM.98.a:0 "今晚，月色真美。"

PAM.99.t:0 "复仇？"
PAM.99.d:0 "电台杂音断断续续，送来的加急报告湿透了，字迹糊成了大团大团的墨斑。\n\n防线上石墙接连倒塌。枪炮声静了之后，空气里传来木头和石块砸地的闷响，还有湿漉漉的脚步声，正沿铁轨一路往这儿走。\n\n大殿里，索拉娜正单手扶着剑柄，在护手上有节奏地敲着。她走出了门外，莉莉安娜看到之后也立马追了上去，挨着她一同走着。临走前，莉莉安娜回眸望向夜莺。\n“夜莺，你明明可以唱起歌，让那些死者重新睡去的。”\n\n夜莺站在窗前，看着远方升起的烟火，把手放在了她一直抱着的书上。\n“我当然可以，我的公主殿下。”她歪了歪头，拨弄起了发梢，语气轻巧得像在回答一个很好懂的问题：“一首歌，地下的骨头就会重新散开。可那些死者并不是在呼唤我哦。大洋底下的亡魂，身上沾着索拉娜的温度，是在呼唤她的名字呢。我若现在替索拉娜把门关上，她这辈子，可就再也睡不着了。”\n\n夜莺合起书，朝窗外那片漆黑的浪潮躬了躬身。\n“来，新的故事要开始了哦。”"
PAM.99.a:0 "这会是个什么样的故事呢？"

PAM.100.t:0 "有只鸟儿在发烧"
PAM.100.d:0 "漆黑而诡异的纹路，在少女苍白如纸的皮肤下疯狂蠕动着，像无数活物正拼命要撕裂她的躯体。\n\n被四神抛弃的薇莉安蜷缩在角落里，从喉咙深处挤出沙哑断续的低哼。她已经连喊疼的力气都没有了，黑红色的血带着刺鼻的异味从嘴角渗出来，将地板染成大片触目惊心的暗斑。\n\n这是四神留下的反噬与神罚，是某种连死者的余温都会被冻裂的彻骨寒意。\n\n莉莉安娜眼眶泛红得跪在一旁。她颤抖着想要去抱薇莉安，却又生怕自己稍一用力就会将这具摇摇欲坠的躯体彻底碰碎，悬在半空的手最终只能无措地收了回去。\n“夜莺……薇莉安快要碎掉了……”\n\n夜莺静静走上前去。她跪在薇莉安面前，将自己的手心覆在了那些剧烈蠕动的漆黑纹路上。诅咒黏稠得如同烧融的沥青，转眼间顺着她的指缝向袖口蔓延开来。夜莺的皮肤开始崩裂了，黑色毒血滴滴答答地落在了地板上，激起阵阵细微而刺耳的灼烧声。\n\n可她的声音依然那样平缓、温柔，宛如在抚慰一个半夜被噩梦惊醒的孩子。\n“好啦，小公主。要是疼，就哭出来吧。那些讨厌的声音，很快就会走远了。”\n\n莉莉安娜慌乱地拿着毛巾擦拭夜莺手上的黑血，洁白的织物很快便被完全浸透、染成了深灰色。她的泪水顺着脸颊滑进嘴角，那股又苦又咸的味道，竟与从夜莺手腕上淌下的黑血别无二致。\n\n在这个重新编排的故事里，每一份预写好的幸福，都必须有人默默弯下腰，将泥潭里所有的脏污与苦难，一笔一笔地替大家擦拭干净。"
PAM.100.a:0 "好梦，薇莉安。"

PAM.101.t:0 "斯人已逝，生者如斯"
PAM.101.d:0 "窗缝漏进几缕蔗糖的甜香，日子安静得让人着迷。\n\n白雾散尽，绿叶纹丝不动地悬在了茶碗的水面中央。\n\n窗外街口忙着干活的工人，走廊里排队走着的士兵，连一旁剥果子的雪伊和晓枫，都像不动的画。大家脸上还带着笑容，可她们袖口的褶皱、发梢扬起的弧度，全都停在了半空中，任何事物仿佛都在此刻定格在了一起。\n\n“索拉娜。”\n\n耳边传来轻声的叹息。夜莺站在窗边，正看着窗外无声的落雪。\n\n“对不起呀，索拉娜。大家其实一直活在那些死去的人的记忆里。那些在冬天里冻坏了身子、在水坑里再也没能爬起来的士兵，临走前想着的，不过是这一碗热粥，一间能温暖手脚的屋子。这颗心脏把那些留下的回忆积攒在了一起，才有了这个安安稳稳的春天。”\n\n她把目光从窗外收回来，落在索拉娜脸上，那双幽紫的眼睛里只有一种亮了很久的光。\n“现在风把故事书吹乱了。索拉娜，该睡了。”\n\n……\n\n滴答。\n\n凉得刺骨的污水从漏雨的棚顶滴下来，啪嗒一声砸在了手心里。\n\n索拉娜猛地睁开眼。木桌不见了，热粥不见了，漫天的欢呼与暖意全都不见了。眼前只有漏雨的屋顶，浸湿的稻草，一盏快要灭了的油灯在角落里摇摇欲坠。这里是贫民窟最阴暗的角落，空气里全是馊水与发霉的味道。\n\n而她的怀里，只有截早已硬得像石头、散发着刺鼻霉味的面包。"
PAM.101.a:0 "§1莉兰迪亚，已经彻底沉睡了。§!"

PAM.103.t:0 "我吞下了那块霉面包"
PAM.103.d:0 "滴答。滴答。\n\n我退到墙角，捧着那截长了霉的面包。霉斑从外皮一直长进了芯子里，闻起来有一股潮湿腐烂的味道。\n\n肚子已经叫了很久了，胃里酸水直往嗓子眼里翻。我把面包凑到嘴边狠狠咬了一口。干硬的面粉在嘴里碎成渣，卡在喉咙口怎么也不肯往下走，每一口都带着让人想吐的苦味。我逼着自己把那口硬块咽了下去。再咬一口，再咽。熬过今夜，总好过死在稻草堆里。\n\n屋外的大雨里传来一阵脆响。窗户被什么东西砸碎了，紧接着是凄惨的哭声，断断续续的，被风雨撕成了碎片。\n\n我把剩下的面包塞进怀里，用袖子蹭了蹭嘴角的碎屑，然后弯下腰捡起了脚边那柄剑。\n\n随后，我推开了柴门。"
PAM.103.a:0 "我得活下去，让所有人活下去。"
PAM.103.b:0 "§O咽下去！咽下去老子就能活！§!"

PAM.104.t:0 "那一鞭子渗进了骨头里"
PAM.104.d:0 "隔壁的柴门敞开着。收税的贵族管家正带着几个随从往外搬谷子，一袋一袋往车上摞。\n\n一个妇人跪在雨水里，双手死抓着管家的靴子，哭得满脸都是泪。她嘴里在喊什么，雨太大了，听不清，大概是求他留一点，留一点点就行。屋里，刚病死的孩子躺在草席上，脸上盖着一块破布，雨水从屋顶的裂缝里滴落在那个小小的身子上。\n\n管家侧过脸，不看那个死去的孩子。他盯着手里浸湿的单子，算盘拨得噼里啪啦响，像是在算这一趟能多抠出几斤谷子。\n\n我刚想冲过去想抢回那袋口粮，管家反手就是一鞭子抽在我脖颈上，我的皮肉瞬间绽开一道红印，带着血珠子顺着领口往下淌了起来。那一下疼得我眼前发黑，但我还是咬着牙站住了。\n\n“滚开，小鬼。”\n\n他说话的时候甚至没有看我。他看的是我身后那扇门，好像我只是挡在他路中间的一件什么东西。\n\n那股皮鞭带来的疼痛，渗进了我的骨头里。我一辈子也不会忘掉的。\n\n在那些住在公爵府里的老爷眼里，我们全是一堆不用花钱的柴火。用完了，就丢进水沟里烂掉，谁都懒得过问。"
PAM.104.a:0 "这笔账，我记下了。"
PAM.104.b:0 "§O抽吧！看老子回头怎么要了你的狗命！§!"

 PAM.105.t:0 "雨夜里走了二里路"
 PAM.105.d:0 "我握着那柄刚磨好的长剑，顺着车辙印往庄园的方向赶。雨越下越大，浇在脖子上的伤口上，每滴都像针扎一样。那道鞭痕被雨水泡烂了，一走一疼，一走一疼，疼得我牙根都咬酸了。\n\n走了足足二里地，才摸到那座砖石大屋的院墙。门房的看守歪在椅子上睡熟了，呼噜声大得压过了雨声。我从他身边走过去的时候他连眼皮都没抬一下。\n\n大厅里铺着光滑的石板，壁炉里的火烧得正旺。那个挥舞皮鞭的管家正靠在椅背上，手里捏着一只银勺，面前摆着一杯果汁。火光正摇晃着倒映在杯沿上，一见到这光，我就想起那个跪在雨里抓着靴子的妇人，想起脖子上还在往外渗血的鞭痕。我的手不自觉地把剑柄又握紧了几分。\n\n我拔出长剑，冲了过去。他听见脚步声回头，脸上的表情还没来得及从悠闲转成惊恐，我的剑就到了。刀锋划过去的时候，一股滚烫的血喷在我手背上，把壁炉里的火也浇熄了，屋里一下子暗了下来。\n“真爽啊。”\n我在黑暗里站了好一会儿，直到把胸腔里憋着的粗气喘完，我才蹲下身，掰开他倔强的手指扯下了那串粮库的钥匙。我把钥匙上沾着的血用力在自己衣服上蹭了蹭，揣进了怀里。\n\n今晚，大家要吃得饱饱的。"
 PAM.105.a:0 "因为大门敞开着。"
 PAM.105.b:0 "§O还是抢来的饭吃着香啊！§!"

 PAM.106.t:0 "甩开火把"
 PAM.106.d:0 "刚跨出砖石屋的台阶，身后的屋子里就传来一声变了调子的惨叫，在雨夜里拖得又尖又长。是那个发现尸体的看守。他的恐惧穿过风雨灌进我耳朵里，听得我浑身都舒坦极了。\n\n紧接着靴子声和哨子声响成一片，十几道手电筒的光柱撕开浓雾，在我身后的巷子里摇晃着。我加快了脚步，胸腔剧烈地起伏着，雨水顺着额角流进眼睛涩得我眼前一片模糊。\n\n身后的狗叫声越来越近了，他们已经追到了我身后的街角。我的胸中那股憋了好多年的闷气在这一刻烧遍了全身，全身立马变得滚烫起来，那温度烫得我双腿发软，让我再也跑不动了。我靠着一旁的石墙停了下来，把长剑倒提在手里，一边喘着粗气，一边盯着那片朝我围过来的黑影。\n\n“来吧。”我对着风雨里那些追过来的影子龇了龇牙，“想拿回钥匙？那就过来，让我看看你们的骨头，硬不硬得过我手里这把剑。”"
 PAM.106.a:0 "谁怕你们啊。"
 PAM.106.b:0 "§O来啊！有本事过来啊！§!"

 PAM.107.t:0 "可我的手心只剩死灰"
 PAM.107.d:0 "仓库的大门被我撞开了。扑面而来的是一股滚烫的焦烟，呛得我弯下腰咳了好一阵，眼泪都给呛出来了。\n\n看守们在逃跑之前把火把扔进了稻草堆里，大火顺着墙根窜上了屋顶。整座仓房在红光里塌了下来，成捆的麦子在火里蜷成一团，噼里啪啦地响。空气里弥漫着一股甜腻腻的焦味，甜得让人犯恶心。\n\n我把长剑往地上一扔，冲进了浓烟里。双手拼命去抓那些着了火的麻袋，火苗舔在手背上，烫得我浑身一哆嗦。大块的皮肉粘在我的衣服上，稍微一动就撕心裂肺地疼。可我还是在抓，抓了一袋又一袋，把着火的麻袋往门外拖，往雨里扔。\n\n雨下得那么大，可火还是烧得那么快。我站在门口，眼睁睁看着那些麦子在我面前烧成了灰。一整个仓库的粮食，最后剩下来的，不过是一堆焦黑的粉末。"
 PAM.107.a:0 "该死啊！"
 PAM.107.b:0 "§O烧了又怎样，公爵府上有得是§!"

 PAM.108.t:0 "我在画些什么？"
 PAM.108.d:0 "军团的帐篷里，油灯的火苗把帆布墙照出晃动的影子。\n\n外面的雨很大，砸在棚顶上沉闷闷的，像是几百面鼓在同时敲着，又像是有人在很远的地方用拳头捶地。一个满身水汽的副官掀开帘子，把那卷打湿的报告放在了我的桌上。\n\n“参谋长，明天天亮，围剿西边山谷的叛军。公爵要您定一份万无一失的包抄方案。”\n\n图纸就在案头铺着。西边那个山谷，我闭着眼睛也能画出每一道山梁，每一条水沟，每一截断掉的石墙。那是生我养我的贫民窟外围，是大雨里唯一的泄洪道。可现在我要用铅笔在山脊上画一道线。就一道。天亮时分，军团的重炮就会把那些木屋、那些石墙、那些活生生的人，全部轰成飞灰。\n\n我提起那支铅笔。它握在指间沉得像块铁。\n\n笔尖落在纸面上，画过的地方留下一道血红的横线。\n\n“拿去吧。”\n\n我把笔放下，听见自己衣服上的金属纽扣磕在桌边，发出很轻的声响。轻得像是什么东西碎掉了。"
 PAM.108.a:0 "拿去，都拿去。"
 PAM.108.b:0 "§3我早就选好要往哪边开枪了§!"

 PAM.109.t:0 "别开枪"
 PAM.109.d:0 "夜晚的风雨急得很。手电的光柱在大雨里来回晃动，正好照在那个退无可退的孩子身上。\n\n她靠着石墙，手里提着一柄锈迹斑斑的剑。隔着密密匝匝的雨帘，我也能看清那张脸，上面全是泥，全是血，可那双眼睛亮得像是能把人咬下一块肉来。她明明已经无路可退了，却把背挺得笔直，手里那把锈剑稳稳地指着我们。\n\n“参谋长，”旁边的士兵端起长枪，扣上了扳机，“就是这乞丐娃娃杀的管家，下令开枪吧！”\n\n我抬手按下了那支指向她的枪。\n\n“别开枪。”我的声音穿过雨幕，清清楚楚地落在所有人的耳朵里，“只是个迷路的孩子。抓回去，关进营房里发落。”\n\n副官愣了愣，但还是收起了枪。我径直朝那个孩子走过去，雨水顺着我的帽檐往下淌，她瞪着我，那双眼睛里的光一瞬也没有动摇过。我从她手里把剑拿过来，很轻松，她没有反抗。也许是因为那把剑太重了，她因为举了太久，手早就已经僵住了。\n\n光柱下，两个人的影子投在墙上。我低下头看着那双不屈服的、随时准备咬人的眼睛。\n\n在这张被泥水和血糊得看不清五官的脸上，我好像看到了很久以前的自己。那个在泥泞里摔倒，又爬起来继续往前走的傻孩子。"
 PAM.109.a:0 "把她带回去吧。"
 PAM.109.b:0 "§3把枪放下来……§!"

PAM.110.t:0 "天边着火了"
PAM.110.d:0 "我刚拉住那孩子的胳膊，她却突然像一头被陷阱夹住的野兽，在风雨里拼命地挣扎嘶吼起来。\n\n南边那座装满谷子的仓库方向，猛地冲起一片红光，把整片雨幕都映成了暗红色。公爵知道钥匙被夺，他绝不允许任何一粒粮食落进下等人的手里，于是他下令烧毁了粮仓。\n\n我心里一沉，手心里也突然一滑，那孩子发出一声几乎要撕裂喉咙的怒吼，从我手里一把夺过钥匙，迎着风雨朝那片大火狂奔而去。\n\n“参谋长！那孩子跑了！她把钥匙抢走了，开枪吗？！”\n\n我再一次按下了士兵的枪口。看着那道在雨幕里越来越小、正不顾一切奔向火光的背影，我的内心像是被什么东西给砸了一下。\n\n“钥匙现在已经没用了，随她去吧。”\n\n我转过身，带着士兵们，也跟着朝那片燃烧的废墟跑去。靴子踏在泥水里的声音，一下一下的，像在追什么再也追不上的东西。"
PAM.110.a:0 "（跟上去）"
PAM.110.b:0 "§3抢得好§!"

PAM.111.t:0 "拉住我的手"
PAM.111.d:0 "大火被雨水浇熄了，废墟里冒着青烟。\n\n我踩着积水走过去，鞋底踩在碎瓦砾上，发出粗糙的声响。\n\n那孩子缩在一截断梁旁边，双手伤得不成样子，大块的皮肉翻卷着，裂口深处隐约能看见白惨惨的骨头。那串她拼了命抢来的钥匙掉在脚边，已经变成了没人要的垃圾。\n\n“在外面守着。庄园那边来人，就说废墟里全是灰，没碰见活口。”我对副官说。\n\n副官看了我一眼，点了下头，打手势带着士兵们退了出去。靴子声在废墟外面渐渐远了，最后只剩下了雨声。\n\n我蹲下身，从怀里扯出一条纱布，小心地托起那双满是伤口的手。她的手还在发抖，不知道是冷的，还是疼的。\n\n“还想抢面粉吗。”\n\n我把纱布一圈一圈缠在她的手掌上，动作放得很慢，怕扯到那些翻卷的皮肉。“歇一歇吧。别再闹了。保住你自己的命。”\n\n她那落满灰尘的脸上淌下了两行泪水，在污迹里冲出两道浅浅的印子，身体猛地抽搐了一下，然后整个人软了下去，额头磕在我的膝盖上，再也不动了。\n\n耳边的风声不知什么时候小了。我抱着那个小小的，全身都在发烫的身体，在废墟的阴影里坐了很久……很久…………"
PAM.111.a:0 "…………"
PAM.111.b:0 "§3擦干眼泪，我们向前看§!"

PAM.112.t:0 "我们该往哪走？"
PAM.112.d:0 "地窖里的煤油灯光很暗，空气里弥漫着潮湿木头和粗麻布的味道。\n\n我坐在椅子上，手里正捏着钢针费力地把一块从工厂带来的围裙缝到码头的麻袋片上。布料太厚了，针尖猛地扎进了我的手指，疼得我倒吸一口凉气。\n\n一旁的阿加莎凑过来，用顶针压住针尾，帮我把线拉了过去。她一声不吭，只是看了我一眼，像是在问“还行吗”。我点了点头，把手缩了回来，在衣服上蹭掉指尖了渗出的血珠子。\n\n地窖里大家都在忙着，有人拿着剪刀裁布，有人用炭笔在木板上记明天要发的干粮。\n\n“雪伊，”阿加莎看着那面我们一起缝的旗子，声音带着一种针对明天的忐忑，“这面破布拼出来的旗子，明天真的能让那些老爷听我们说话吗？”\n\n我咬断了嘴里的线头，用手抚平粗糙的接缝后说道：\n\n“我不知道。”\n\n我看着那面布旗，红的蓝的，针脚歪歪扭扭的，拼在一起却比任何一面绸缎旗都顺眼。“但我明白一件事。如果我们永远只是沉默着，毫无怨言地活在那群贵族老爷的脚下，那跟死尸也没什么两样。等这面旗子升上去，那些在夜里迷路的兄弟姐妹看见了这团红火，自会明白该往哪儿走。”"
PAM.112.a:0 "一，二，收针。"
PAM.112.b:0 "§t没人敢骑在我们头上了§!"

PAM.113.t:0 "我草你妈！"
PAM.113.d:0 "我（晓枫）刚把怀里那个发烫的身体抱稳，板壁就被人一脚踹开了。风雨混着外面的火光一起灌进来，打在脸上又冷又湿。\n\n是雪伊，那个在街头带头闹事的工人领袖。她端着一柄缴来的步枪站在门口，雨水正顺着她的头发往下淌着，浑身都湿透了，贴在身上的衣服让她看起来更瘦了。可她那双眼睛红得像要滴出血来，像是把所有的恨意都烧在了里面。\n\n她拉了一下枪栓，金属撞击的声音在雨里响得格外刺耳。她把枪口对准公爵府的方向，也顺便对准了我头顶上那枚军徽。\n\n“我操你妈！！你们这群公爵的走狗！”她在大雨里壮着嗓子骂，声音像是从胸腔最深处撕出来的，“宁可把麦子全烧成灰，也舍不得留一粒给快要饿死的孩子！都给老娘去死吧！！”\n\n她把枪托狠狠砸在旁边的石柱上，木头裂开的声音脆生生地炸开，混进了风雨里。\n\n我一言不发，只是用手里的白布继续捂着怀里那孩子的伤口。我能感觉到温热的血还在往外渗，从我的指缝里往外挤着。然后我抬起头，看着这个在废墟里发了疯的人。\n\n“管好你的嘴。”\n\n我的声音在大雨里很稳，连我自己都有点意外。“过来帮忙。这孩子快要撑不住了。”\n\n她站在那里一动不动，枪口还是指着我，手仍然扣在扳机上。可她的眼神变了。她在看那个孩子。\n\n“……这孩子是谁。”"
PAM.113.a:0 "“只是个抢走粮仓钥匙的野孩子罢了”"
PAM.113.b:0 "§t那你倒是赶快给她止血啊！§!"

PAM.114.t:0 "引擎声"
PAM.114.d:0 "我（晓枫）站起身，拍了拍制服外套上的褶皱，把那顶军帽重新戴在了头上。帽檐压下来的时候，额头上那道被雨水泡了一晚上的皮肤终于不再冷冰冰的了。\n\n“我得走了。”\n\n雪伊坐在草堆旁擦着步枪，脸上的神情隐在阴影里。她的手在枪管上来回移动着，动作很专注，好像这间屋子里没有别人一样。\n\n“长官，慢走。”她的声音和之前一样，坚硬又倔强，但也没有再多说什么难听的话，“路上泥厚，别脏了你那双漂亮的马靴。”\n\n我停在了还留着一条缝的门前，外面的雨声小了些，风从缝里灌进来，带着一股泥土和焦木的味道。\n\n“你的那些伤员，记得按时换绑。”我一边说着一边拉开了大门，“接下来三天，巡逻队都会绕开这片区域。至于往后，就看各自的命了。”\n\n雪伊在阴影里哼了一声，手掌在枪托上拍了两下，我就当她是在表达知道了。\n\n我推开门走进了雨里。车门关上的时候，玻璃上的雾气也慢慢得把她的轮廓完全遮住。引擎沉闷地响起来，轮胎在泥里压出一圈圈沟槽，那些声响渐渐隐没在黎明前最浓的那片雾气里。"
PAM.114.a:0 "那么，祝你好运"
PAM.114.b:0 "§t路滑得很，别死在路上啊，参谋长§!"

PAM.115.t:0 "你叫什么名字？"
PAM.115.d:0 "我坐在小凳上，看着草垫上那个一动不动的孩子。她身上盖着一条毯子，额头上还沾着干涸的血迹，呼吸很轻，轻得像是随时会断掉。\n\n她终于睁开了眼睛。\n\n那双眼睛先是迷迷糊糊地转了一圈，然后猛地定在我身上，瞳孔一下子收紧了。她在判断我是谁，是敌是友。即便刚从鬼门关爬回来，那双眼睛看人的时候还是亮得扎眼，像是能把人整个都看穿一样。\n\n“醒了啊。”我把手里的步枪靠在墙上，往前挪了挪凳子，“你睡了好久。”\n\n她没有说话，目光从我脸上移开，落在自己那双缠满纱布的手上。然后她又扫视了一圈这间地窖，看向角落里那盏煤油灯，最后又盯着墙上映着的影子，像是在确认自己不是在梦里。\n\n“喝口水吧。”我端起旁边的水碗递过去。\n\n她看了我一眼，然后一把抢了过去拼命地往自己嘴里灌。动作太急了，水顺着嘴角淌下来，打湿了她胸前那片刚换的布料。\n\n“慢点喝。”我伸手去拍了拍她的后背，“这可不是公爵府。这里是教堂地窖，安全得很。大雨把外面的路都封了，谁也进不来。”"
PAM.115.a:0 "再吃点东西吧？"
PAM.115.b:0 "§t喝吧，死不了了§!"

PAM.116.t:0 "捡起了一片落叶"
PAM.116.d:0 "城堡的廊道很深，我每走一步都能听见自己的脚步声在远处弹回来，像是有人在走廊那一头正模仿着我的样子。\n\n台阶上落了一片枯叶。\n\n我停下脚步，低头看了它好一会儿。这里是一座永远静止的宫殿，没有风，没有泥土，连灰尘都很少光顾。这片叶子是从哪里来的呢。大概是前些日子那些外来的灵魂经过这里时，从谁的衣角上滑下来的吧。\n\n我蹲下身，伸出手碰了碰叶片的边缘。它已经干透了，手才刚触上去，脆弱的脉络就在我手下碎成了一小片，发出很轻的细响。在别的地方，这样的声音大概会被风声、人声、窗外的鸟鸣盖过去。可在这里，在这片什么都不会发生的寂静里，这片枯叶碎裂的声音听起来清脆无比。\n\n书上写着，外面的林子里有成片的树，到了秋天，叶子会换上红色与黄色的衣裳。可我的宫殿里只有水晶花，永远开着，永远不谢。\n\n外面到底是什么样子呢。好想去瞧一眼啊。"
PAM.116.a:0 "好想去瞧一眼啊……"
PAM.116.b:0 "§1真想……摸摸外面带雪的风啊§!"

 PAM.117.t:0 "点起了一支蜡烛"
 PAM.117.d:0 "书本里写着，太阳能发出一团很暖很暖的光。我从来没有摸过那种光，不知道书上说的暖是什么样子的。\n\n我划亮火柴，点起一截小小的蜡烛。火苗在烛芯上晃来晃去，像是刚刚睡醒还在揉眼睛。我把手心慢慢凑过去，想试试书上写的那种温度到底有多暖。手心靠近火苗的那一小块皮肤变得热乎乎的，这种感觉真奇妙，原来这就是暖。\n\n我想再靠近一点点，结果手指不小心伸进了火苗里。烫得我一下子就把手缩了回来，又热又疼，我把手指含在嘴里含了好久。这股疼在寂静里特别清楚，和我刚才摸到的那一点点暖完全不一样。\n\n我把蜡烛往自己这边挪了挪，烛光照亮了我膝盖上摊开的书页，可远处的墙角还是黑漆漆的，什么也看不见。这点光太小了，只能照亮周围这么一小圈。\n\n如果有一天，有人能把那个真正的、挂在天空的太阳带进来，分一小片给我，那该有多好呀。我不贪心的，一小片就够了。"
 PAM.117.a:0 "好梦，莉莉安娜。"
 PAM.117.b:0 "§1烫到我了呢……真暖和呢§!"

 PAM.118.t:0 "我会一直等着你"
 PAM.118.d:0 "我把木窗推开了一道缝。外面是那片我已经看了无数遍的寂静谷地，风从缝隙里钻进来，带着一股我不知道名字的气息。书上说那是泥土和青草的味道，我每次闻到都觉得很新鲜。\n\n我在台阶上坐下来，手掌托着下巴透过那扇窗往外看。落叶被风卷着在地面上滚来滚去，滚到墙根下停一会儿，又被下一阵风吹走了。\n\n书上写着，外面的春天很暖和，阳光会照在身上，把那些冻僵了的笑容一点一点化开。我从来没有见过春天，但我记住了这句话。我想等这场风雪停了，一定会有一个人，带着那片暖和的光，穿过外面的回廊，走过那些我曾经只能在书里读到的小路，一步一步朝我这里走来。那个人也许脾气不好，也许一进门就大声嚷嚷，也许看到我的时候会愣住，不知道该说什么。这些都没有关系，只要那个人愿意拉住我的手，就已经是我能想到的最好的事了。\n\n在这片很长很长的寂静里，夜莺会一直唱着歌，而我会一直守在这扇窗前，等着敲门声响起来。"
 PAM.118.a:0 "门外，会有人来吗？"
 PAM.118.b:0 "§1我知道……她不会来了§!"

 PAM.119.t:0 "故事书，是空白的呢"
 PAM.119.d:0 "水面上的亮光已经熄灭了。窗外的风声小了下去，整座城堡又沉进了那种我熟悉的寂静里。\n\n那本图画书摊开在膝盖上，后面的页脚全是空白的，一个字也没有，一个笔画也没有。我把手放在那些空白的地方，摸了好久，好像这样就能摸到本该写在那里的什么东西。\n\n也许那个会送来太阳的人，只是我自己关在屋子里趴在桌上写出来的一个念想。雨停了，雾散了，那份我以为会来的暖意，也没有在这片寂静里留下任何痕迹。\n\n可我还是把身旁的位置空出来了。我守着这扇窗，这扇门，守着每一个风里好像有脚步声的瞬间。\n\n那些脚步声，到底会不会真的停在我的门前呢。"
 PAM.119.a:0 "哪怕……根本没有人会来。"
 PAM.119.b:0 "§1那就让我自己去找她吧§!"

#小果子
  PAM.120.t:0 "领一粒青果子"
  PAM.120.d:0 "仓棚里全是潮气，混合着海水晒干后的咸腥味。\n门推开的时候，那个从海滩上抱回来的小姑娘蜷在最里面的角落。她身上的衣服还没干透，正紧贴在单薄的骨架上。听到声音，她把怀里那个破布包裹往胸口揽得更紧了些，眼睛直勾勾盯着我。\n哨兵说过那包里不过是个咬烂的坏苹果。我在她对面拉过凳子坐下，从兜里摸出一枚洗好的青果子，按在了桌沿上。\n\n“拿着。”我把果子推过去，“你手里那个坏了，咽下去是要拉肚子的奥。”\n\n她看着我，和我手边的果子，似乎很疑惑。只是歪了歪头，手也不伸，嘴也不张，就那么愣愣地看着我。\n我同她说了好些话，问她冻不冻，饿不饿，她一点动静也没有，连眼里的光都消失了。奥~我这会儿才反应过来——这孩子压根听不懂咱们这边的语言。\n\n我扭头叫住门框边的哨兵：“这孩子是从哪儿抱上来的？怎么一句人话也听不明白？”\n\n“看板材是东边大洋的样式。”哨兵在门外抠了抠帽檐，“像是神州那边逃难出来的。”\n“神州？”我一拍大腿，冲着走廊外面嚷了一声，“队里有会说神州话的没有？！”\n外面接茬的一个都没有，几个后勤的小伙子正面面相觑。隔壁板壁后面传来翻本子的哗啦声，晓枫的嗓门直接盖了过来：“别喊了！码头那边的译员要下个月才上岸！”\n\n行吧，指望不上别人了。\n\n我重新转过身，指了指桌上的青果，又指了指她怀里的烂苹果，按着记忆里神州人的叫法，一字一字对她念叨：\n“果子……吃果子。”\n听到“果子”这两个音，那孩子耳朵动了一下。原本绷紧的眼睛里，突然闪过一搭光彩，像是碰着了熟识的词。\n\n她低头想很久，慢慢地点了一下头。\n我看着她那股子倔劲，露出了欣慰的笑容：\n\n“听得懂这两个字啊？行，往后叫你小果子了。”"
  PAM.120.a:0 "你好啊，小果子。"
  PAM.120.b:0 "§9小果子……我有名字啦！§!"

 PAM.121.t:0 "听听风里的哨声"
 PAM.121.d:0 "海浪一下一下地撞在礁石上，带着海盐咸味的水雾也飘到了脸上。我正顺着长满苔藓的台阶往上走着。\n\n小果子坐在海边最高的那块大石头上，两只手捧着那个在月光底下闪着一小点光的铜哨。看见我上来了，她把哨子含进嘴里，鼓起腮帮子，憋足了劲猛地一吹。哨音又尖又长，穿过层层海雾，比那些海鸟的叫声还要响亮。\n\n我被这声哨子吓了一跳，伸手按住帽檐，朝她望过去。她正咧着嘴冲我笑，眼睛弯成了两个小小的月牙，那样子别提多可爱多神气了。\n\n“不错嘛。”我笑着朝她喊了一句，“像个看海的小哨兵了呢。往后这片海，就归你守着啦，成不成？”\n\n小果子没回我的话，我知道她是不好意思。她偏过了头去，把哨子又含进嘴里，鼓足了气对着海面又是一声。\n\n那哨音远远地穿透在层层波浪之中，就连海面上一艘艘舰船也拉响了他们的汽笛，回应着她的哨声。"
 PAM.121.a:0 "说是小果子，一旦威风起来却一点也不小嘛。"
  PAM.121.b:0 "§9“浪再大又怎样呢？”§!"

 PAM.122.t:0 "木棉团长？"
 PAM.122.d:0 "营房里安静得不正常。以前这个时候，总能听见有人大声说话，然后就是磨刀声，然后还有人隔着板壁喊开饭了。可今天什么都没有。\n\n我推开门，看见兄弟姐妹们靠在床沿上，身体已经僵硬了，手臂和小腿都泛着霜雪才有的寒光。我喊了一声没人应，又喊了一声，还是没人应。\n\n我走过去推了推离门最近的那个人。手刚碰到他的肩膀，一股寒冷就从衣物底下透了出来。他顺着床沿滑了下去，脸上还挂着一抹笑容，像是睡着之前正在做一个很安稳的梦。\n\n“团长！木棉团长！”\n\n我冲进隔壁的房间。木棉团长伏在桌前，手里的笔掉在桌面上，笔尖下的那行字才写了一半。我扑过去捧起她的脸，她的脸颊凉得像一块放在雪地里冻了一夜的石头。我推她喊她，抓着她的肩膀用力晃，她的身体跟着我的动作来回摆动，眼睫却纹丝不动，连颤都没颤一下。\n\n团长教过我很多东西。她教我怎么磨刀，怎么在暴风雨里辨别方向，怎么在别人都倒下的时候还站得住。她从来没有教过我，如果有一天她自己倒下了，我该怎么办。\n\n我站在那扇门前面，撑了很久。直到我再也压抑不住心里的情绪了，才慢慢蹲下去，把自己缩在了门框边上。\n\n大家都怎么了？"
 PAM.122.a:0 "不……这不对劲……"
 PAM.122.b:0 "§9你没教我的，我自己会去学的！§!"

 PAM.123.t:0 "进来的是晓枫"
 PAM.123.d:0 "外面传来车门关上的闷响，紧接着是靴子踩在雪水里的声音，一步一步，越来越近。我的心提了起来。我不知道来的是谁，是来救我们的人，还是来给予我们最后一枪的敌人。\n\n门被推开了。\n\n晓枫站在门口，她浑身都是雪，胸口剧烈起伏着，像是跑了一路，又像是在来的路上就已经猜到了这里会发生什么。她的目光从我脸上掠过，然后停在床沿那些冷掉的身体上，整个人僵住了。\n\n她几步冲进内室，扶住团长的肩膀，手不自觉地掐紧了。“团长。”她的声音是哑的。那个在战场上从来不会慌的晓枫姐，此刻连声音都在发抖。\n\n“大家都睡着了。”我从角落里站起身来，浑身都在发抖，“我叫她们叫了好久，一个一个推过去，谁都不醒。团长也一样。她也不醒。”\n\n晓枫慢慢回过头看着我。风夹着雨雪从门缝里灌进来，把桌上的纸张吹得满地都是，油灯的火苗在风里疯狂地摇晃，把我们两个人的影子拉扯得忽大忽小。\n\n她走了过来，把我冰冷的手握在她温暖的掌心里。她的手很用力，像是想把我从一场梦里往外拽出来。\n\n“小果子。”她低着头呼唤道，声音和呼吸都很沉重。然后她抬起眼睛看着我，在昏暗的火光下朝我伸出了手。“走。风太大了，这里不能待了。”"
 PAM.123.a:0 "跟她走。"
 PAM.123.b:0 "§9晓枫姐，你带我走吧！§!"


 PAM.124.t:0 "指向南方"
 PAM.124.d:0 "车门摔上的声音闷闷的。发动机在座位底下嗡嗡震，震得我两腿发麻。\n我抱着自己的胳膊缩在副驾上，车顶的雨砸得密密实实，雨刷来回来回地刮，玻璃刚干净一秒钟又糊住了。车灯照出去，光柱里全是横着飞的雪粒，密密麻麻往玻璃上扑着。\n我回头看了一眼，营房已经没了。就剩白茫茫的雾，把什么都吞得一点不剩。\n晓枫开着车，好一阵没说话。她嘴唇干得起皮，下唇裂了道小口子，大概是刚才搬东西的时候被风刮成这样的。过了一会，她把手伸了过来，把我这边的安全带又拽了一下，确认系紧了，才把手收回去。\n\n“我们去哪。”我的声音抖得不成样子。\n\n“海边。”她说完停了一下，把方向盘往左边打了一点，绕过了路面上一块凸起的冰疙瘩，“港口已经冻住了，我们得往更南边走，去找一艘还没被冰住的船。只要船能动，往有风的方向开，就能把雾甩在后面。”\n她说话的时候没有去看我，像是怕我看到她的眼睛，但我听得出来，她把每一个字都说得很稳，好像在跟我讲一个她已经想了很久的计划。\n她是怕我害怕。\n我把额头抵在了车窗上，贴着玻璃的那块皮肤慢慢就随着外面的雪失去了感觉。就在我快要睡着的时候，车轮突然滑了一下，整个车身带着我的身子往旁边甩了过去，带着我的肩膀很用力地撞在了车门上，好疼。\n\n“小心啊”晓枫一把把方向盘打回来，车身晃了两晃才稳住。\n她转过头看我，上上下下扫了一眼，确认我没磕着哪，才把视线重新放回前面的路上。“撞疼了没有？”\n\n“没有。”\n\n“那就好。”她呼出一口气，肩膀松下来了一点。\n雨刷还在响。嘎吱嘎吱的。\n\n我缩在了副驾驶座上，没再出声说话了。其实想问的话还有很多，我们要开多久，到了海边船还在不在，那些睡着的人还会不会醒。但我看着她两只手稳稳地握着方向盘，看着雪一片一片撞在挡风玻璃上又碎开，突然觉得这些问题好像不用再问了。她还在开车，还在看路，还在刚才那一秒里先转头看我有没有受伤。挺好的呀。"
 PAM.124.a:0 "是这样吗"
 PAM.124.b:0 "§9别光照顾我了…晓枫姐……§!"


 PAM.125.t:0 "再见，总参谋长"
 PAM.125.d:0 "小船在起伏的波浪里摇晃着。我刚踩上去还没站稳脚跟，手腕便被拉住了。\n那是晓枫姐的手。可她的手掌已经凉透了，先前在车里好不容易捂暖的体温，一转眼就被冷风吹得一干二净。\n我慌忙回头，在手电昏暗的光线里，她的眼眶底下蒙了一层紫色，那是属于梦境的颜色，此时正不声不响地往外散着寒气。\n她把双桨塞进我怀里，我伸手去接的时候，她的手在我手背上停了一下，好像还有什么话想说，但最后什么也没说，只把桨又往我怀里推了推。推完之后她的手在桨柄上握了好久才松开。她对着我笑了笑：\n\n“小果子，走吧。去有风、有温度的地方。我送你到这儿，往后的路，得你自己去走了啊。”\n\n她松开手，走得轻轻的、慢慢的，朝白茫茫的大雾里渐渐消失着。\n\n“晓枫姐！”我趴在船舷上，眼泪止不住地往下掉。冲着那道单薄的背影，用尽气力喊着，“我会回来的！我一定会把船划回来！你别睡着了，你等一等我，我一定会把大家都叫醒的！”\n晓枫停下了脚步。缓缓侧过头，对着我露出了最后的笑容。她的嘴唇动了动，声音还没传过来就被风撕成了碎片。但我听清了！她说：\n\n“好呀……我等一等小果子。”\n\n她朝我挥了挥手，身躯渐渐融入了前面的迷雾中。\n一片…两片……\n铺天盖地的落雪砸了下来，最终把她的背影，连同那点微弱的光亮，一起抹消在了漫天迷雾的深处……"
 PAM.125.a:0 "“等我回来。”"
 PAM.125.b:0 "§9骗人是小狗……§!"

 PAM.126.t:0 "在石屋里坐下"
 PAM.126.d:0 "海上的黑夜在天亮前总算过去了。雾散开以后，前面冒出来一座光秃秃的石岛。\n\n我把木船拖上碎石滩，船底刮得嘎吱嘎吱响。缆绳在木桩上绕了几圈，手冻僵了，那个结来来回回打了好几次才系上。\n有时候，我觉得自己挺没用的，连个绳结都打不利索。\n\n我在岸边看到了间石屋，它的门窗早就烂了。门歪歪斜斜挂着，我推了一下它就往里倒了下去，我赶紧伸手扶住，轻靠在了墙上。墙角还纠着一团枯草，蜘蛛网都蹭在我头发上了，我扒拉了两下也没弄干净，”不过，算了。”\n\n我靠着石壁坐了下来，石头好冰好冰。怀里的包裹吸饱了海水，我解开的它的时候，手僵得跟不是自己的似的。\n\n那颗苹果还在。\n\n皮被海水泡皱了，摸上去软塌塌的。我啃了一口，酸得眯起眼睛。又啃一口。嚼着嚼着咬到果核，立马传来了满嘴沙沙的感觉。胃里瞬间翻涌无比，不过我还是用手背抵住嘴，硬吞回去了。以前大家总说我吃东西太快，说我像饿死鬼投胎，要是她们看到我现在这副样子，估计又要笑我了。\n\n海浪在底下翻，声音一阵一阵的，近了又远。风从墙缝里灌进来，呜呜地叫。\n\n我把头靠在墙上，眼皮特别沉。但我跟自己说，“别睡。别睡……”\n风总有停的时候。衣服总有干的时候。等衣服干了，我就划回去，把认识的人一个一个叫起来。"
 PAM.126.a:0 "我得睁着眼。"
 PAM.126.b:0 "§9我必须……§!"


 PAM.127.t:0 "将故事书彻底砸碎"
 PAM.127.d:0 "我正盯着石缝里那朵好不容易活下来的红花。身后就传来一阵又轻又快的脚步声，在潮湿的碎石滩上越来越近。\n\n我猛地站起身，立刻把手按在枪栓上，防备地盯着那个从雾气里走出来的人。\n\n那是个穿着白色裙子、系着披风的少女，倒像个从书里走出来的骑士。对方领口挂着一枚红色挂坠，正散发着一小片暖和的光。\n“果子。”\n\n那少女在几步开外停下，声音带着让人心安的温度。\n\n“你认得我？”我皱起眉，按向了枪口，“那身衣服，可不属于军团，更不属于公爵府里的老爷。”\n“我叫露西莉亚，是个骑士。”少女轻抚过领口的那枚挂坠，声音在风雪里很清晰，“我从另一本书里走过来。在那本书里，世界也已经冷了，可我带回了那里的夜莺之心。我知道这里发生的所有事情。我知道木棉团长睡了，晓枫也睡了，连索拉娜也换了新衣裳，在书里当了听话的配角。”\n\n我盯着那枚发着红光的挂坠，脑子里乱成了一团乱麻。这人在胡说些什么？什么另一本书？什么夜莺之心？\n\n“大家都睡了，可你还醒着。”露西莉亚往前迈了一步，声音里带着不肯低头的倔劲，\n“小果子，去写一个不一样的结局。将这本故事书，彻底砸碎。”"
 PAM.127.a:0 "你在胡说些什么……我听不懂。"


 PAM.128.t:0 "这回，信你一次"
 PAM.128.d:0 "“我不信！”我往后退了退，端着枪冲她喊着，“当时营房里也很暖和，可大家闭上了眼，就再也喊不醒了！你把这宝石拿开，别想让我也闭上眼！”\n露西莉亚默默地看着我。她把那枚亮红的宝石捧在手心，眼里的神色很沉静：“果子，这是活人身上的温度。里面装着那个到死也不肯闭眼的人留在世上的遗憾。在另外一本书里，也有个不肯认命的女孩子，在风暴里陪着伙伴等到了天亮。”\n她把红宝石递到我面前。\n落雪悉数砸在肩膀上，带着冰凉刺骨的海浪足以让人失温，可手心里这颗通红的宝石，正把温度尽数融进我的皮肤里。我的眼泪不自觉地落在了手背上，我明明和团长保证过，往后一定要坚强，可这温度……真的太暖了。她拍掉我身上的积雪，把一件斗篷裹在了我的肩上：“故事要重写。大家都要睁开眼。果子，我们去把大家摇醒，好不好？”\n\n“你刚刚说的……索拉娜，是谁？”我突然开口，视线落在掌心那抹红光上。这名字很熟。熟到不用过脑子，嘴自己就念出来了。可我想不起她的脸，也想不起在哪儿听过。\n\n露西莉亚注视着我，声音轻缓：“她是莉兰迪亚的女王。也是在最黑的夜里，拼了命也想活下去的野狼。”\n\n“女王……野狼…………”这些话语不断得撞击着我的记忆，搞得我头疼得厉害。那些被白雪盖住的旧事，随着宝石的光芒，在这一刻崩解得四分五裂。我想起来了……这片风雪是假的。晓枫姐和雪伊姐安稳地睡着，夜莺把整座国家都闭上了眼。至于这片海岸，不过是一场不肯醒转的幻梦。我踩着的每一寸积雪，全都是死寂的倒影。\n\n“原来……是这样啊。”我把那颗发着光的红宝石紧握在了手心里，抬起脸看着露西莉亚，“你带我来这儿，是要去砸碎这个梦的，对不对？”\n\n她点了点头，神态温和。我把宝石揣进了怀里。路已经定下了。不管去哪里，我都陪她走这一程。"
 PAM.128.a:0 "不许骗我。"

 PAM.135.t:0 "怎么有人连船也不会划"
 PAM.135.d:0 "“你往哪儿戳呢！”\n\n那一桨横着拍在水里，溅了我一脸苦咸的海水，我抹了把脸，叹了口气。露西莉亚两只手笨拙地抓着桨柄，正拼了命地往海里戳。\n\n“我也想帮帮忙嘛。”\n\n她委屈地咬着嘴唇，低头看着自己湿透了的裙角。\n\n就在这时，船身猛地歪了一下，看她那副突然手忙脚乱的局促模样，我噗嗤一声笑了出来。\n划船是个力气活，我抢过了桨，把她按在了座位上：“行了，老实坐着，看我划。”\n桨叶破开波浪，推出白色的水花，在我全盘接手后，小船这才在风浪中安稳了下来。\n\n露西莉亚从怀里掏出一张破破烂烂的海图铺在膝盖上，用手指点着最北边的那个标记。\n\n“老铁厂。”她看着我，“醒着的水手和工人，都缩在底下的防空洞里，靠着当年烧剩的渣子硬撑着。夜莺的雾太大，里面的人出不来，外面的人进不去。只有这颗宝石，能把高炉重新烧红，拉响顶上的汽笛。只要汽笛一响，周围所有被冻僵的耳朵，都会被震醒。”\n\n我盯着那张海图，看了半天。目标很清楚：去老厂，把火生起来，拉响汽笛。去把大家，一个不剩地叫醒。"
 PAM.135.a:0 "坐稳了，我们要加速了！"


 PAM.129.t:0 "根本没人站起来"
 PAM.129.d:0 "我用力把防空洞的铁门拽开的时候，生锈的铰链发出一声尖锐的惨叫。\n\n“有人吗！”我冲着里面大喊，声音在空洞的通道里拖得长长的，最后变成一股发霉的味道扑了回来。\n\n在我冲进通道里后。我看到两边墙上靠满了人，心一下子就揪到了嗓子眼。我跑过去拽住一个倚在墙角的水手，他的肩膀很硬，很凉，隔着衣服都能感觉到。我一撒手，他就顺着墙软绵绵地滑了下去。我甚至没敢去扶他，就那么看着他倒在地上，姿势说不出的别扭。他的脸上挂着一种诡异的安详，嘴角甚至还带着一丝若有若无的笑意，跟当时我在营房里看到的那些面孔一模一样。\n\n我往通道深处走，越走越慢。每一个人都靠在墙上，男人，女人，老的，年轻的。有个女人手里还握着一截粉笔，大概是在墙上写过什么。我蹲下来看了一眼，字迹早就被潮气洇花了，什么也看不清。他们脸上的表情都很平静，平静得像是约好了一样。\n\n“现在叫不醒她们的。”露西莉亚的声音从我身后传来。\n\n我看着这满通道的人，脑子里翻来覆去只有一个念头，我跑来干什么呢，是啊，我跑来干什么呢。\n\n跑这么远，就是来看他们睡觉吗。"
 PAM.129.a:0 "……来晚了吗？"


 PAM.130.t:0 "子弹上膛"
 PAM.130.d:0 "就在我的手还撑在墙上的时候，地上的那些人动了。\n\n先是那个我刚拽过的水手。他的脖颈往上折了一下，那个角度活人的脖子根本做不到。骨头错位的脆响在空荡荡的防空洞里弹来弹去，然后他的眼皮翻开了，底下是一双空洞的紫色眼睛，什么都照不进去，像是有人把他的灵魂从里面舀走了。\n\n紧接着整个通道里的人都站起来了。骨头咯吱咯吱响成一片，密密麻麻地贴着墙壁来回撞。他们被同一根看不见的线提着，伸直了他们那早已失去温度的手，朝我一步一步逼过来。我本能得向后退去，直到后背撞上了石砖，冷冰冰的触感透过衣服传过来，已经没有路了。我把枪托顶在肩膀上对准最前面那个水手的胸口扣下了扳机。枪声在狭窄的通道里炸开，嗡嗡的金属余音瞬间灌入了我的耳朵。子弹穿过去了，暗红色的血溅在墙上，可他连晃都没晃，连那丝安详的微笑都还挂在嘴角上，又往前逼了一步。\n\n就在我的手准备再扣下扳机的时候，一道白光从我眼前掠了过去。\n\n露西莉亚拔剑的手还停在半空，剑刃已经把最前面那几只伸过来的手逼退了。她侧过脸看了我一眼，那双眼睛里找不到任何恐惧和犹豫，仿佛是在问我，“你还在等什么。”"
 PAM.130.a:0 "那……那我们杀出去？！"

 
 PAM.131.t:0 "谁也没穿上新鞋子"
 PAM.131.d:0 "枪声彻底远了以后，我才发现自己坐在一个积水坑旁边。我的裤腿湿到了膝盖往上，鞋子里面全是泥浆，每根脚趾头都泡得又白又皱。至于露西莉亚，她正蹲在我旁边，她把剑横在膝盖上，剑刃上还沾着那些东西的灰。她没说话，我也没说话。\n\n我弯下腰去解鞋带，想把泥水倒出来，就在这时候我看见积水坑的另一头漂着一只草鞋。很小的一只，鞋底被磨得很薄很薄，草绳也断掉了好几根。\n\n露西莉亚也顺着我的目光看了过去。\n\n“这里怎么会有草鞋。”她的声音有点哑，大概是刚才喊了太多话了。\n\n“以前那些工人穿的。”我把目光从那鞋子上收回来，盯着自己手里湿漉漉的鞋带，“木棉团长在码头的时候就老跟我们说，老铁厂的矿井里好多孩子都穿这个。他们买不起皮鞋，也怕换了皮鞋会被人收回去，就一直穿草鞋下井穿到鞋底磨穿。”\n\n露西莉亚走到水坑那边把草鞋捞了起来。水从她指缝里往下淌，滴在泥地上溅起一小朵一小朵的泥花。她把草鞋翻过来，看着鞋底那个磨穿的洞，那个表情像是把什么东西咽进了心里。\n\n“她们到死也没穿上新鞋。”我把脸埋进了膝盖中间，声音闷闷的，“后来木棉团长从仓库里清出好多新的皮鞋。她们藏在床底下谁都不穿。怕穿坏了，怕被收回去，怕这怕那的。”"
 PAM.131.a:0 "……"

 PAM.1312.t:0 "谁也没穿上新鞋子"
 PAM.1312.d:0 "“你呢。”她拿着那只草鞋走回来，蹲在了我的面前。\n\n“我怎么了。”\n“你穿的是新鞋还是旧鞋。”\n我愣了一下，然后低头看着自己那双灌满泥浆的鞋。“木棉团长给我的。是新的。”\n\n“为什么你穿了。”\n“因为我觉得不穿就浪费了啊。团长好不容易发下来的。”\n\n她看着我，那双亮红的眼睛里浮起了一抹光。\n\n“你知道吗果子，”她把那只草鞋放在我旁边的石头上，动作轻得像是怕把它碰散架了，“你总是这样。你觉得不往前走就浪费了她们给你铺的路，你觉得不叫醒所有人就浪费了你手里这口气。可是你有没有想过，有些东西磨穿了就磨穿了，你光着脚踩在煤渣上还非要往前走，到时候疼的不是那些给你鞋的人，是你自己。”\n\n“那又怎样。”我抬起头看她。“疼就疼，总比光着脚站在那儿什么都不做强。”\n“疼久了，是会坏掉的。”\n“我不会坏掉！人怎么可能会坏掉？”\n\n她叹了口气，没再说话。就那么蹲在我面前，手里还滴着从那只草鞋上沾来的水，看着我把鞋带重新系好。\n\n“走了。”我站起来把枪甩到了肩上，“前面还有路呢。”\n\n她跟上来的时候，我听见她把那只草鞋放回了水坑旁边。然后跟在我后面继续踩着泥水往前走。我们谁都没再说这件事。但那个水坑那个磨穿的鞋底，那个她咽下去的表情，一直堵在我心里。跟着我走了好久好久。\n我还在想，她刚才问我的那些话，我答得那么大声，到底是真的那么想还是在跟自己吵。\n她大概也在想。\n因为从那只草鞋之后她就很少跟我说：“你太累了，该歇歇了”。\n大概是知道我不会听。大概是觉得与其劝一个不肯停下来的人，不如跟在他后面多照看几步。"
 PAM.1312.a:0 "我还能走，你就别问了。"

 PAM.1313.t:0 "归途"
 PAM.1313.d:0"寂静重新吞没了矿道，只有远近起伏的水滴声，“嘀嗒、嘀嗒”，敲打着幽深的黑暗。我卸下空了的弹匣，用手帕擦着枪管上凝聚的水渍。那股刺骨的金属凉意，顺着我的手指一直蔓延到了心里。\n“露西莉亚……”我试着打碎这份沉默，转过头看向了她。\n露西莉亚低下头，看着自己那双如今已沾满灰土的靴子，很久很久，才轻柔地应了一声。\n“果子。”\n“露西莉亚……”\n“晓枫和雪伊……以前，是怎样的同伴呢？”\n我拿着弹匣的手顿在了半空。空气仿佛瞬间凝固了，连水滴落下的声音都变得清晰了起来。\n“晓枫姐啊……”我深吸了一口潮湿的空气，“她总是话很少，可所有人的事，她都偷偷记在心里。我的字是她手把手教的，连那些复杂的书啊、图纸啊，也是她耐心摊开给我讲的……而雪伊姐呢，脾气爆得像个火药桶，训起人来整个营房都能听见。可是……每次拼死打完仗，她总会皱着眉，从口袋深处掏出一块早已压得又干又硬的糖果，硬塞进我手里。”\n“她们……一定很想看到，你平安长大的模样吧。”露西莉亚抬起头，看向前方深不见底的漆黑通道。\n“刚才在水坑旁，看着那只草鞋时，我一直在想……”\n“想什么？”\n“她们拼尽全力……把你从漫长的黑夜里推出来，把仅存的提灯交到你手里的时候……”\n露西莉亚侧过脸看向我。\n矿道微弱的光芒落在她的眼中，那双眸子澄澈得像是一汪没有任何杂质的泉水。\n“绝对不是为了……看着你把双脚再次踩烂在煤渣里啊。”"
  PAM.1313.a:0 "……"


 PAM.1314.t:0 "归途"
 PAM.1314.d:0"“她们是希望……终有一日，你能走到一个可以脱下湿透的鞋子、卸下所有担子，无忧无虑地睡个好觉的地方……”\n我僵在了原地。手心握着的是冰冷无情的枪管，可胸口却像被一股突如其来的巨浪狠狠撞击着，酸涩与温暖交织在一起。\n我一直以为，只要自己拼命往前跑，拼命把沉睡的人们一个个叫醒，就是对死去的人最好的交代。\n\n可我……从来没有想过……\n\n在那许许多多个倒在风雪与血泊里的夜里，她们临终前所念着的……会仅仅是希望我能活下去。像个普通孩子一样，好好地、幸福地活下去。\n\n“要是有那么一天……”\n\n露西莉亚的声音在湿冷的空气中飘散开来，又轻、又慢，仿佛只是在陈述一个理所当然的事实：\n“要是有那么一天，需要有人留下来，独自去守着最后一段寒冷与黑夜的话……”\n“哪怕会因此消失，哪怕会因此一个人孤独到最后……我也希望……那个人，绝对绝对不要再是你了。”\n我猛地转过头看她，想要说些什么。可她已经整理好了裙摆，拍掉了上面的泥灰，迈开脚步独自朝着前方隐约可见的微光走去了。\n我呆呆地看着她的背影。\n那一刻，我的心里升起一股沉甸甸的踏实感，却又隐隐作痛。\n\n我……还是不明白……"
 PAM.1314.a:0 "§t（……前面的路，还很长呢。）§!"



 PAM.132.t:0 "前路"
 PAM.132.d:0 "顺着矿道往里走，脚下的稀泥总算没那么厚了，鞋底踩在石头上，一下一下的，听着比刚才踏实很多。顶上不时有水滴砸在肩膀上，凉凉的，顺着脖子往下淌，把衣服里最后一点暖气都带走了。\n这个山洞里到处都是冰霜，呼出的气已经变成了白色。不过贴在胸口衣服内侧的那颗红宝石还在发烫。它烧得像一团火，隔着衣服都能感觉到那股热度正往骨头缝里钻。我咬着牙，靠着这点烫人的力气，拖着两条快要没知觉的腿，一步一步往前挪。\n\n“露西莉亚，跟上。”\n\n我一只手扶着旁边硌手的岩壁，眼睛盯着前面那点光亮。身后传来她踩着泥水一路小跑的声响，啪嗒啪嗒的，溅了我一裤腿。她裙摆被风扯得呼呼响，也不知道踩到什么滑了一下，整个人往前踉跄了一步，赶紧抓住我衣服后摆才稳住。\n\n“我在呢。”她的声音从后面传来，听着像喘不过气。“这故事又没翻到最后一页，我们谁也不准死在这里。”\n\n这种话她成天挂在嘴边。每次说出来的时候语气都跟念课文似的，一板一眼的。我懒得回她，只顾往前走。\n\n鞋底突然踩到一片硬邦邦的黑渣子，一踩就碎。触感和刚才的稀泥完全不一样。\n\n我蹲下去摸了把。全是颗粒状的碎末，放到鼻子底下一闻，一股干巴巴的、带硫磺焦味的炭气直冲脑门。\n\n我抬起脸冲她喊：“我们踩到运煤的滑槽了！以前老铁厂的工人就是顺着这条道往上送炭的。前面就是锅炉房。”"
 PAM.132.a:0 "火，就在前面。"


 PAM.133.t:0 "拉响汽笛吧！"
 PAM.133.d:0 "炉门被我用尽全身力气扯开了。\n\n刺骨的冷铁扫过手掌上冻得溃烂的皮肉，剧痛顺着神经一路钻进了我的心里，让我的整条手臂都跟着不受控制地颤抖起来。炉子深处，堆着好大一堆黑色的干炭，大概是当年大家还没睡过去的时候，亲手码在这里的吧。可惜，还没等把火生起来，天就彻底冷下来了。\n\n衣领下的那颗红宝石，正隔着布料一下下跳动着，像是一颗不安分的小心脏。我将它从口袋里掏了出来，毫不犹豫地贴紧在流血的掌心里。滚烫的石头烫着烂掉的皮肉，换作平时，我大概早就痛得大哭起来了吧。可这一次，我只是咬着牙，把它握得更紧、更紧了些。\n\n周围真的好安静啊。\n安静得能听见自己耳膜里传来的微小噪音，像是远方吹过的海风，又像是谁在记忆深处，轻轻叹下了一口气。\n\n我想起了那天的风。那天老码头上的风真大啊，晓枫姐站在白雾里，整张脸都被吹得惨白；木棉团长还保持着趴在桌上的姿势，手里的钢笔至死都没能放下；还有矿道里那些还没长大的孩子，也到死没能穿上新的鞋子。\n\n大家……其实一直在等我呢。哪怕这个世界还是那么脏，那么乱，哪怕醒过来之后，还有成堆成堆写满眼泪的破事等着我去收拾……可那也比待在这片冰冷的死寂里好啊。比我一个人孤零零地守着心跳、什么也做不了，要好上一万倍啊。\n\n我闭上眼，将那颗滚烫的宝石，狠狠按进了干炭的最深处——\n\n轰！\n通红的光芒瞬间在漆黑的锅炉里炸开了，仿佛沉睡多年的心脏，终于被我用双手强行点燃。滚烫的热浪扑在脸上，将我额前沾着冰屑的头发全部吹到了脑后。\n\n“大家……快点睁开眼睛啊——！！”\n\n我用尽全身的力气喊了出来，喊得喉咙像是要彻底裂开一样。这声呐喊在空旷死寂的厂房里撞来撞去，震得铁壁上积攒了好多年的灰尘与碎霜，像下雪一样簌簌飘落，落在了我湿透的手心里。\n\n然后……\n那个声音，终于响起来了。\n沉闷而巨大的汽笛声，从锅炉的最深处浩浩荡荡地涌了出来，一路向上呼啸，冲破管道，冲破头顶那道早已撕裂的废墟墙缝，轰然撞进了外面那片漫长而无边的白茫茫雪夜里——"
 PAM.133.a:0 "“求求你们……快点醒过来吧！”"
 PAM.33_tt: "£GFX_KNM_zhanling_zhuanyi_KFL\n\n\n\n\n£GFX_Nightingale2_Hear_bg\n\n\n\n\n§t我们，要回到那个真实的人间了。§!"

 PAM.134.t:0 "迎接黎明！"
 PAM.134.d:0 "汽笛的尖鸣穿透了长夜。\n\n那声音太刺耳、太宏大了，响得整片天空都像是在剧烈震颤。四周那些温暖而虚幻的彩色画面，像是一张被暴风瞬间撕裂的画卷，啪地一声崩解开来，化作了漫天纷飞的碎片。\n\n我睁开眼睛，第一眼看到的，就是结满冰刺的废弃锅炉。刺骨的风雪正从破烂的屋顶疯狂倾泻进来。汽笛的余音依然在周围回荡，可莉兰迪亚的沉眠依然顽固得像是一只不肯松开的死人手掌，牢牢箍住了这片冰封的大地。\n\n可风是冷的。雪是真的。\n割在脸上的疼……也是真的。\n\n废墟外的荒地上，不知何时已经站满了密密麻麻的黑甲卫兵。风雪里，那些死灰般的脸孔一张张转过来，空洞地盯住了锅炉房的方向。它们不喊也不叫，只是死寂地站在那里，比任何凶残的嘶吼都更让人脊背发凉。\n\n那一瞬间，我心里竟然冒出了一丝微弱的酸楚。这些被夜莺随意写进故事里的傀儡，连自己的名字都不记得了，只知道呆滞地站在雪地里等候命令。可我……没有闲暇去分辨，那一张张灰白的面孔底下，究竟还残存着谁的影子。\n\n它们挡了我的路。\n它们只是亡灵。只是我必须打倒的东西。\n我握紧了枪，一遍遍在心里这样告诫着自己。\n\n锵的一声清响，露西莉亚拔出了长剑。狂风卷着冰屑灌进她的斗篷，顺着衣褶簌簌飘落。她的双手虽然还在发抖，可那冰蓝色的剑锋，却无比坚定地指向了前方。\n\n“果子，它们过来了。”\n\n“咔哒。”\n我拉动枪栓，金属撞击声在风雪中清脆作响。我跨前一步，用自己单薄的肩膀将露西莉亚结结实实地挡在身后，冰冷的枪口直指那些铁青的面孔。\n\n“把手抓紧了，露西莉亚——”"
 PAM.134.a:0 "“我们……杀出去！”"

 PAM.136.t:0 "天亮前的冷水"
 PAM.136.d:0 "门一推就开了，落雪跟着我们落了一地。大厅里特别冷清，长椅上横七竖八地躺着几个穿着丝绸衣裳的贵族，他们也一样，睡梦中还带着安稳的笑呢。\n“露西莉亚，你看这些家伙。”小果子走过去，拍了拍靠在柱子边沉睡的年轻贵族。对方毫无反应，依然陷在黑沉沉的睡梦里，“身上的衣服那么光鲜亮丽，鞋底连一丁点泥都没有。外面的风刮得这么大，他们倒是在这儿睡得挺安逸的。”\n露西莉亚跟在她后面，搂紧了身上那件斗篷，想要把外面扑进来的寒气都挡在衣服外面。她静静地看着那些熟睡的脸庞，叹了口气：“因为夜莺没打算让他们醒过来呀。外面的风雨太疼了，对习惯了温暖的人来说，还是在梦里待着更安全一些。”\n\n“可梦里又不能长出面包来。”小果子撇了撇嘴，随手把桌上空荡荡的铜壶放回原处，“晓枫姐提过，上区仓库里堆着不少过冬用的煤和口粮。要是不把这些睡懒觉的家伙弄醒，谁来开仓运粮呀。总不能指望我们两个把整个仓库都搬空吧。”\n露西莉亚走上前，将手掌贴在其中一个人的肩膀上。她轻声唤了几句，可对方连眼珠都不见动一下。\n“普通的法子大概是不行了，果子。”露西莉亚摇头，神色里带着几分无奈，“在夜莺的梦境里睡得太深，他们已经感觉不到冷了。”\n\n“这事我拿手。”小果子把枪背在身后，几步朝大厅一侧的蓄水池走去，看着里面泛着凉意的水，“以前在码头挨冻的时候，我最清楚冷水有多提神了。泼一桶过去，什么样的美梦都得醒过来。”"
 PAM.136.a:0 "把他们泼醒。"

 PAM.137.t:0 "宿敌的苏醒"
 PAM.137.d:0 "推开沉门，大厅里昏暗冷清，索拉娜正在被子里睡得正香，那根系着蓝布条的头发散在了枕边。\n\n“喂。”小果子冷冷地看着她，端起手里盛满了冷水的铁盆，“起来了。”\n当头泼了过去。\n“阿噗！”床上的小女孩猛地弹了起来，大口喘着气，双手用力抹着脸上的水。她迷茫地睁开眼，视线在模糊的光线里转了转，最终落在了床边那杆步枪上，以及小果子那张灰扑扑的脸。\n\n“是你这个野火的小耗子？”索拉娜咬着牙，她盯着那杆步枪，声音里带着粗野的沙哑，“晓枫呢？雪伊呢？怎么偏偏是你？”\n\n“晓枫姐和雪伊姐还在外面睡着呢。”小果子厉声回应道。\n\n索拉娜盯着自己那双小小的手掌，嘴边溢出一声不服输的冷哼，一脚跳进地板，冲着小果子不屑得说道：“哼……晓枫和雪伊还在大雨里闭着眼呢？真是活该。老子当年把她们关进地牢，是为了让她们那双手在这个吃人的泥潭里少沾些脏东西。她们倒好，背着老子去搞什么大同公社，以为靠几句漂亮话就能挡住贵族的重炮吗？蠢货。”\n\n“闭嘴。”小果子猛地拉动枪栓，将枪口顶在了索拉娜的额头上，“不许你提她们！你这个抢粮的暴君，要不为了晓枫姐，我现在就一枪崩了你！等把大家找回来，我们迟早要跟你把账好好算一算！”\n\n索拉娜被枪口顶着，却丝毫不带畏惧。她伸手推开枪管，声音低沉下来：“小耗子，枪拿稳了。老子在和人拼命的时候，你还不知道在哪儿呢。要算账，老子也一并等着。等把那两个家伙叫醒，看看究竟是谁找谁算账。”\n\n露西莉亚将剑收入鞘中，看了看外面漆黑的夜空：“守在大道上的那些亡灵已经开始动弹了。我们动作得快些。”\n\n小果子收回枪，一言不发地转过身朝门外走了出去。"
 PAM.137.a:0 "到那个时候，我也不会输给你的。"

 PAM.138.t:0 "消失"
 PAM.138.d:0 "“空的。”\n\n小果子把水桶扔在了地上，看着空荡荡的床板。那个成天抱着枪的雪伊姐，根本不在这里。\n\n索拉娜走到灶台边抹了一把，掌心蹭上了成片的灰。她斜眼瞅了瞅小果子那双满是泥水的破鞋，嘟嚷道：“小耗子，当年老子抢食的时候，也像你这么倔。不过老子是为了自己活，你倒好，为了这帮半死不活的家伙，连命都不要。真是个傻子。”\n“我们是为了让大家都能自己做饭吃，你这种人懂什么！？雪伊姐要是出了事，我这辈子都跟你没完。”小果子气红了脸，握枪的手传来骨节摩擦的吱吱声。\n“可雪伊不像是会乖乖就范的人。”露西莉亚从地上捡起一样物件。那是一块褪了色的红袖章，上面的线头散落在一旁。这是以前在野火的时候，雪伊一直戴在胳膊上的衣饰，此时正丢在床底的泥雪里。\n\n小果子看着那块袖章，声音里的颤抖更重了：“要是不在这里，她能去哪儿？要是不见雪伊姐指挥，光靠我们这几个人，怎么去跟那群亡灵对阵啊。”\n\n“她被带走了。”露西莉亚走上前来，把那块袖章放在小果子手里：“夜莺知道，雪伊是这片荒野上最硬的一根骨头，哪怕梦境再美，她也绝不肯乖乖低头。所以，夜莺把她藏进了故事的深处。”\n\n索拉娜大笑了一声，娇小的身子散发着野性：“哈！那老子就看看，你这丫头怎么跟老子没完。把那块破布收好吧，小耗子。我们去卡卡罗姆，那地方是野火的老营，晓枫当年起事的地方。夜莺既然爱藏人，老子就把那整片山谷都给翻一遍！”"
 PAM.138.a:0 "去卡卡罗姆。"

 PAM.139.t:0 "对峙"
 PAM.139.d:0 "“晓枫姐……”\n\n小果子的呼喊在坑道里撞了几下，很快就散了。四周冷冷清清，连个回音都快听不到。\n“明明说好要等着我的………”多日的劳顿与接二连三的落空，终于压垮了她。索拉娜坐在她旁边，眼光闪了闪，似乎想起了自己当年在烧焦的木梁底下，也是这样嚎啕大哭。她烦躁地别过脸去，啐了一声。\n\n小果子掐着自己的大腿，眼泪一滴滴落了下来：“露西莉亚，你到底是谁呀？你嘴里总说故事、另一本书，那到底是什么？对，我是个笨手笨脚的大笨蛋，可你说我们要去写不一样的结局，要把大家叫醒，我全听进去了，我也全照着你说的做了！”\n露西莉亚在暗淡的火光里，耳边的几缕长发不知何时已染上了雪白。她低声喃喃着：“我知道的，我什么都知道。我看着大家一个一个倒下去，看着火光熄灭，我比谁都清楚。我只是希望大家有个温暖的结局，我只是——”\n\n“可我要的是活生生的人！”小果子吼着，仿佛喊破了嗓子，“我划船把手掌磨得全是疮，我连命都不要得去拉响那个汽笛。我还反过来去找那个曾经杀了我们那么多人的暴君帮忙。结果呢？雪伊姐连个影子都瞧不见，现在晓枫姐也找不着了！露西莉亚，你那个温暖的故事到底救了谁？我们现在流的血、流的眼泪，到底又算什么？”\n\n“可我也在努力啊！”露西莉亚终于喊了出来。她的剑也跟着滑落到了地上，发出了震耳欲聋的脆响，“我的过去早就成了一片灰，我早就无家可归了。我越过大雾来到这儿，仅仅因为我舍不得你们，我怎么会想看你们流血呢？！我守在这冰雪里，委屈、受冻，可我不管怎么努力，怎么去拼命，依旧怎么也留不住你们。对你们来说，我不过是个突然闯进来的外人罢了……”\n\n小果子怔怔地看着她。看着她耳边刺目的白发，那些滚烫的怒火在这一秒消散了。她往前膝行了几步，扯住了露西莉亚的斗篷：“行了！不准再说‘你们’了！”小果子猛地站起身，眼泪混着泥污流过脸颊，“你们……你们！一路上吃风踩雪，哪一步少过你？谁把你当成外人了？你在路边冻病了，我还不是整夜生着火，在旁边守着你吗？要是连你也在这儿睡过去，那这剩下的路……到底还要我怎么走啊！！！”\n此时此刻，矿道里只剩下了滴水砸在石头上的声响。小果子看着那柄掉在水洼里的剑，随后又立马看向了露西莉亚，那些带刺的问话全都卡在喉咙里，吐不出来了。\n她俯下身把剑捡起来，用衣袖抹去上面的泥沙，默默地递了过去。"
 PAM.139.a:0 "……"

 PAM.140.t:0 "风，吹散了最后的残火"
 PAM.140.d:0 "大雾如死水般横在尽头，任凭小果子和露西莉亚如何用力，面前那堵灰墙也未有一丝纹路碎开。\n在她们身后，那个矮小身影正悄然散开，梦境彻底碎了，索拉娜头顶的缎带与衣服一同化作了暗红的火星，在风里露出了她生前最后的装束——那是一头随风乱卷的金色长发，一双犹如热炭般猩红的眼眸，身上仅仅裹着一块粗糙的红斗篷，站在长满枯草的铁轨上。这正是她当年冻死在雨里最后的模样。\n“喂，暴君。”小果子猛地回过身，想要抓住索拉娜的衣服，可手心碰到的唯有正在融化的红光，“你还没赔我们野火那么多条人命呢，别想就这么算了。给我醒过来。”\n索拉娜低头看着自己已经开始透明的双手，迎着风，一步步朝大雾深处的死墙走去，眼里的光随着步伐一点点冷了下来。\n她回头看着小果子脸上的伤痕，语气多了一丝释然：“行了，小耗子，别叫唤了。老子原本就是死在雨里的一条野狗，沾了这心脏的光，才当了几天威风的女王。现在梦醒了，自然就得散了。\n老子，在最后，帮你们撞一回墙，把你的枪拿稳了，别让老子觉得……你们连我这个死人都不如。至于能不能把那两个家伙捞回来……就看你们自己的能耐了。”\n话音刚落，她那具半透明的身体在墙前绽放出刺眼的红芒，她将双手按在墙壁上，任由灵魂深处最后的力量轰然爆开。\n碎裂般的脆响震耳欲聋。死墙在红光中撕开了一道缺口，露出了墙后那个一片结满冰霜的无声国度。\n红芒炸开的那一刻，小果子被气浪掀翻在地。等她抬起头时，索拉娜已经不见了。红绸的最后一丝残影被风卷着，擦过她的脸颊，散在铁轨上空。就在那片残影里，有一个声音贴着她的耳朵响了一下。很轻，很快，像她小时候趴在栈桥栏杆上，有人凑到背后突然喊了她一声。\n“小耗子……”\n小果子猛地回头。身后唯有露西莉亚，和她自己停在地上的影子。她站在原地等了许久，直到耳边仅余下狂风的呼啸声，她才转过身，朝着墙上的缺口，迈出了第一步。"
 PAM.140.a:0 "再见，索拉娜。"

 PAM.1400.t:0 "放心大胆往前走！"
 PAM.1400.d:0 "索拉娜消散时留下的火光刚散开，脚下的大地突然剧烈晃动了起来。\n紫雾从山谷底冲出来，把漫天大雪撕成了碎片。成群的黑甲躯壳从雪层底下爬出来，把我们来时的路完全堵住了。无数黑压压的影子顺着山道狂奔，冲向山下那些刚醒来的镇子。\n“怎么会这样……大家不是刚醒过来吗……”\n小果子的眼泪在寒风里显得那么的微不足道。大家辛苦得来的清醒，难道转眼又要变回再也不会动的石雕吗。\n还没等她回过神，老铁厂的方向突然炸开了一道刺眼的红光。\n沉寂许久的蒸汽汽笛在山谷尽头拼命长鸣，把悬崖上的雪块都震落了下去。紧接着，白城的大道上冒出了成片的火光，密集的枪声在夜里乱成一团。\n刚从冰水里醒过来的贵族拔出佩剑，领到食物的工人们抓起锤头与木棍，从屋里、从车间里冲到街上，硬是把那些扑向家门处的死尸撞退了！\n“滚开！别想碰我的房子！！”\n“把门顶住！别让这些东西进来！！”\n喊声顺着山风传上了石阶。这再也不是哪个领头人的号角了，那是大家自己的呼喊。那是吃过饱饭的人、那是穿上了新衣服的人，他们谁也不肯再退回那个寒冷的梦里。谁要他们抢走眼前好不容易得来的生活与光明，他们就拿着刀枪，去跟谁拼命到底！\n\n山谷下方的火光连成了长龙，把整片夜空照得很亮、很亮。\n小果子拉了拉露西莉亚的衣服指着山下，声音带上了久违的笑意：“露西莉亚……你快看下面……大家都在帮我们呢。”\n露西莉亚顺着她的手望过去，远处的火光正映在她那双清澈的眼睛里。她放下按在剑柄上的手，小声应道：“嗯。因为大家……都不想再做梦了呀。那是大家……在帮他们自己呢。”\n小果子用力抹了抹眼泪，转过身走向那象征着一切梦境的终点的大门：“那我们也不能在这里停下呀。走，去给大家把太阳迎回来！”"
 PAM.1400.a:0 "“大家，都在守护着自己的明天呢。”"

PAM.1407.t:0 "下午的风吹进来的时候"
PAM.1407.d:0 "“昨天教给你的那几个字，可不许偷懒不写哦。等下午把外面的事情处理好了回来，我可是要抽查的。”\n我仰着头站在晓枫姐跟前，任由她帮我整好了衣服。\n阳光透过来照在木桌上，窗外的风声听起来那么远。\n\n“行啦晓枫，这丫头写字跟鸡爪子划地差不多，你逼她也没用。”雪伊姐正靠在窗边咬了一大口果子，含糊地嚷着，“笨丫头，今天就在家里呆着，别到处乱跑。”\n\n我赶忙拉住她的衣服问：“雪伊姐，你们待会儿要去哪儿呀？”\n\n“出趟远门呗。”雪伊姐嚷着，“去把外面那些成天嗡嗡乱叫的苍蝇全收拾掉，省得它们跑来扰了咱们的清净。”\n晓枫姐顺手替我把围裙系上，语气平静得接过了话：“路口那边我已经看过了。等把那边的路全给封起来之后，以后就再也不会有外人能摸过来了，小果子也能在院子里安心得玩啦。”\n\n她们说得那么随口，就像等会儿只是顺路去地里拔几棵杂草似的。\n\n“我也想跟着你们一起去嘛。”我仰起头拉着晓枫姐不放。\n晓枫姐笑着摸摸我的额头：“那可不行，小果子得留下来看家呢。等我和雪伊把外面的那些麻烦事解决了之后，买好吃的带回来给你。”\n雪伊姐也在旁边跟着冲我扬扬下巴：“听你晓枫姐的话。外面风大，你在屋里呆着别冻着。”\n她们说笑着，迈开轻松的脚步，推开门走了出去。\n\n真好啊，晓枫姐和雪伊姐又回到我身边了，以后再也不用分开了呢。"
PAM.1407.a:0 "§9“嗯！我在家里等你们回来哦。”§!"
 wmyyzyq:0 "§R我们永远在一起吧……§!§R再也不用分开了……§!\n§R我们永远在一起吧……§!§R再也不用分开了……§!\n§R我们永远在一起吧……§!§R再也不用分开了……§!\n§R我们永远在一起吧……§!§R再也不用分开了……§!\n§R我们永远在一起吧……§!§R再也不用分开了……§!\n§R我们永远在一起吧……§!§R再也不用分开了……§!\n§R我们永远在一起吧……§!§R再也不用分开了……§!\n§R我们永远在一起吧……§!§R再也不用分开了……§!"

PAM.1408.t:0 "防线"
PAM.1408.d:0 "大殿门前的风雪太刺骨了。\n\n那两道黑甲侍卫交叉着长枪，像两道拆不掉的铁墙，把去路彻底封死了。\n\n我按着剧痛的肋骨，急促地喘着气。大雪落进眼睛里，又冷又辣。\n不知为何，看着它们抬枪的架势，我的心里竟隐隐泛起一阵诡异的熟悉感……可我顾不上细想了。\n\n晓枫姐以前教过我，战场上但凡犹豫了一瞬间，要守护的人就会从手心里溜走；雪伊姐也跟我说过，手里的枪要是退缩了，就再也回不到心心念念的家了。\n\n我抬起手抹掉眼睫毛上的雪水，按紧了枪口的刺刀。晓枫姐和雪伊姐还在梦的深处等着我呢，露西莉亚和大家还在后面替我挡着冰冷的风雪！要是停在这里，大家就再也醒不来了！\n\n“为了……能够回到大家身边……”\n\n我必须推开这扇门。"
PAM.1408.a:0 "§R（向她们开枪！）§!"
PAM.1408.b:0 "§1（不可以……）§!"

PAM.1409.t:0 "我们…回家了……"
PAM.1409.d:0 "“给我……滚开啊！！”\n\n当枪尖划破衣服的时刻，我顾不上身上的剧痛，挺着步枪拼命撞进了领头那个黑甲的怀里，狠狠扣下了扳机！\n\n轰！——\n\n火光在眼前炸开，耳膜一片鸣响。我凭着本能抽出了腰上的刺刀，顺着身旁另一个卫兵铠甲的缝隙全力刺了进去！\n\n那是晓枫姐教我找的缝隙，那是雪伊姐教我压上去的狠劲。\n\n两道沉重的铠甲轰然倒在了雪地上。\n\n我全身脱力，跌跪在冰冷的地面上，胸口剧烈地起伏着。\n\n赢了……我打碎最后的屏障了！我赢了呀！\n\n晓枫姐、雪伊姐……我做到了哦。我跨过了大雪，我拉响了汽笛，我终于……走到你们眼前了。\n\n眼泪混着雪水流进嘴里，我却忍不住笑了起来。我支撑着站起来，拖着沉重的双腿走到那两具一动不动的铠甲旁边。“让我看看……”"
PAM.1409.a:0 "§R“你们怪物到底是些什么东西……”§!"

PAM.141.t:0 "挽歌"
PAM.141.d:0 "面具滚落到了雪地上。\n\n面具底下……\n\n§R是晓枫姐。§!\n\n她的眼睛半睁着，瞳孔里紫色的阴霾正一点点褪去，露出了那双我最熟悉的、清澈如水般的眼睛。\n致命的伤口打碎了夜莺的幻觉。在生命的最后几秒钟里，晓枫姐清醒过来了。\n\n她胸口上还有着往外涌血的窟窿，那是被我亲手打进去的子弹。她……看也不看……只是费力地抬起沾满血迹的手，想要像以前那样去摸摸我的头。\n\n“小……果子……？”\n“你怎么……流了这么多血呀……”晓枫姐看着我肋骨上的伤口，眼神里溢满了心疼，“疼不疼啊……笨孩子……”\n\n我想要去碰她的手，可刚抬到一半，在听到这句话的瞬间，整条手臂无力地重重落回了雪里。\n\n“我……疼吗？”\n\n周围的风声仿佛在一瞬间消失了。我神志不清地转过身去，解开了旁边另一个卫兵的面具。\n\n§R那是……雪伊姐。§!\n\n刺刀穿透了她的喉咙，红色的血从伤口里冒了出来。可雪伊姐看着我手里染血的刺刀，反而露出了一抹带着自嘲与宠溺的笑容。\n\n“笨丫头……”雪伊姐含着血沙哑地笑了一声，“老娘手把手教你的杀招……你倒是……学得真快啊……”\n\n我不受控制地跪在了雪地里。\n\n“晓枫姐……雪伊姐……”\n雪花落在了她们的脸上，落在了……她们再也不会睁开的眼睛上。\n\n锅炉房外面那些被我打碎的黑影，那些我连脸都没看清就开枪打穿的东西……我以为它们只是夜莺捏出来的空壳。\n可是空壳里面……怎么会有晓枫姐，怎么会有……雪伊姐呢。\n\n我一路上打碎的那些，每一个里面，是不是都装着别人的姐姐，别人的朋友，别人……走了很远的路、拼了命想要找回来的人？"
PAM.141.a:0 "“求求你们……别看我……”"

PAM.1411.t:0 "挽歌"
PAM.1411.d:0 "我扑了过去，用双掌狠狠去堵她们心口那个洞。可鲜血依然顺着我的指缝往外疯狂涌着。\n\n根本堵不住啊。\n\n“我是来……叫醒你们的呀。”我的声音控制不住地带有哭腔，“晓枫姐……是你教我瞄准的啊……你说要看准敌人的缝隙，一枪打过去……我学得很好对不对？我一枪……就把你打中了啊……”\n\n“你说话不算数……”我的眼泪一颗颗砸在她脸上，混进那些不再往外涌的鲜血里，“你自己说的。‘好呀，我等一等小果子’。你说这句话的时候还笑了呢。我听见了！风再大我都还是听见了！晓枫姐……你从来不骗我的……”\n\n“雪伊姐……”我看着自己满是鲜血的手，“是你教我拿刺刀往前撞的啊……你说遇到敌人绝对不能手软……我听话了啊……我一直都在听你们的话呀……”\n\n她脸上还挂着那个和她一点都不搭的笑容。\n\n啪嗒。\n\n一颗被挤得变形的、沾着血迹的糖果，从雪伊姐指缝间滚了出来，落在了雪地上。\n那是以前我哭鼻子的时候，她总是骂骂咧咧地掏出来塞给我、骗我闭嘴的糖。\n\n“我不要糖了呀……雪伊姐，我……我最讨厌吃糖了啊……我以后再也不偷懒了，我听话，我保证听话！”我跪在她们中间，用额头贴着她们冷掉的额头，绝望的哭喊声撕裂了风雪，“把我的命拿走吧……把她们还给我……把她们还给我呀！！”\n\n我这一路拼了命地想把大家叫醒，可到了最后，我连自己做了什么都不知道了。我到底是在救她们，还是在杀她们。\n\n我做的这些……"
PAM.1411.a:0 "“到底…算什么呢……”"

PAM.1412.t:0 "一块碎饼干"
PAM.1412.d:0 "这间屋子原本是废弃的仓库，如今被改成了临时的收容所。墙角长满了潮湿的霉斑，空气里漂浮着肥皂水与旧棉衣的刺鼻气味。十几个孩子依偎在靠墙的长椅上，安静得像是一排晾在窗台上的小泥人。最大的不过十来岁，最小的还是个五六岁的娃娃，正缩在姐姐怀里，用胖乎乎的小手揪着自己的衣服。\n\n带路的老妇人低声说，这些都是在战火里没了家人的孩子。有的父亲死在前线，有的母亲死在炮火下，还有几个全家都没了，是被邻居从坍塌的砖石底下刨出来的。\n\n小果子呆呆地站在原地，一句话也说不出来。她低头看向自己的双手，这双手曾在黑暗的矿道里把露西莉亚从泥水里拉出来，也曾扣下扳机，将子弹打进那些黑甲卫兵的胸膛。后来她才知道，那些被枪声打碎的面具底下，也许就有眼前这些孩子的爸爸、妈妈。\n\n她不知道自己是怎么走到那个最小的孩子面前的。那个扎着歪歪的小辫子的女孩抬起头看她，眼睛又圆又亮，还没学会像别的人那样在陌生人面前低下头。\n\n小果子看着她，恍惚间想起了很久以前的自己。那时她刚从海难里被捞上来，什么都不记得，只会怀抱一颗酸涩的果子，呆滞地盯着每一个走过的人。后来，木棉团长给了她名字，晓枫姐教她识字，雪伊姐一边骂她是笨蛋一边把热汤推到她面前。她就这么在粗鲁又温暖的营房里长大了。\n\n而现在，她站在这里，成了那个“走过来的人”。\n\n小女孩盯着她看了半晌，伸出嫩乎乎的手指，指向她腰间的枪套，声音奶声奶气的：“你是军人吗？”\n\n小果子缓缓蹲下身，将视线平视着女孩的眼睛，轻声说：“……以前是。现在不是了。”\n\n“那你是谁呀？”小女孩歪了歪头，眼里满是单纯的困惑。\n\n我是谁。\n小果子低下头，看着手心深处的伤痕。\n我是把你们的爸爸妈妈唤醒的人，也是亲手让他们再也无法醒过来的人；我是打赢了这场残酷战争的人，也是在胜利的夜里跪在血泊中哭得站不起来的人。\n我是小果子，是最后一个醒着的人。\n可面对眼前这双清澈的眼睛，她却再也说不出自己的名字了。"
PAM.1412.a:0 "……"

PAM.1413.t:0 "一块碎饼干"
PAM.1413.d:0 "她没回答那个问题，默默从小木盒里掏出一颗糖，放在了小女孩的小手心里。\n\n那是她之前分给孩子们后剩下的最后一颗，彩色的糖纸早就被揉得皱巴巴的了。\n小女孩低头看了看掌心里的糖，又抬起头盯着小果子那双布满血丝与疲惫的眼睛。片刻后，她突然说了一句：\n\n“你长得……好像我妈妈啊。”\n\n小果子整个人彻底愣住了。她看着那张还没学会掩饰悲伤的小脸，胸口像被钝器重重击中。她很想把口袋里所有的东西都掏出来堆在孩子面前，可她心里明白，世上没有任何甜食能填补至亲离去留下的空洞。\n\n她伸出颤抖的手，温柔地碰了碰小女孩头上的小辫子。\n辫子是孩子自己扎的，松松散散，一缕碎发早就滑落了下来。小果子细心地将那缕头发收拢好，轻轻折回她的耳后。\n\n“以前……也有人这样帮我梳过头。”小果子沙哑着声音开口，“她的脾气可坏了，骂起人来就像要把屋顶给掀翻一样……可她，对我特别好。”\n\n小女孩眨了眨大眼睛：“那她现在在哪里呀？”\n\n“她走了很远的路……去了一个再也不会挨冻的地方。”\n\n“那她还会回来吗？”"
PAM.1413.a:0 "……"

PAM.1414.t:0 "最后一颗糖"
PAM.1414.d:0 "“不会了。”小果子轻轻将手从孩子的发间收了回来，“但她走之前，教了我好多东西。她教我怎么把辫子扎得整整齐齐，怎么在暴风雪里生火，怎么在被别人欺负的时候把背挺得笔直。她说这些东西以后我都用得上，因为……她没办法一直陪着我。”\n\n小女孩低头看着手里的糖，沉默了许久。随后她用小手剥开糖纸，把糖塞进嘴里，含糊不清地又问了一句：\n“那……她现在到底在哪儿呀？”\n\n她重复着这个问题，仿佛在执着地确认着某种答案。\n小果子把视线转向窗外。风在积雪间呼啸，檐下的晾衣绳上挂着几件洗净的衣服，在风里微微晃动。\n\n“在天上吧。到了晚上看星星的话，说不定就能看到她了。”\n\n“那哪一颗才是她呀？”\n“我也不知道。我在夜里找了好久呢，还是分不清哪一颗是她。”小果子的声音变得很轻，仿佛怕惊动了天空上的梦，“但我每天晚上都会站在院子里看一会儿。看久了，就觉得那些星星好像离我近近的，近到只要我一伸手，就能摸到她的脸。”\n\n小女孩咽下了嘴里的糖。她舔了舔唇角，伸出自己脏兮兮的小手，将一块攥了很久、已经有些变软的饼干用力塞进了小果子的手心里。饼干碎了一半，边缘还有一排小小的牙印，显然是她一直舍不得吃留下的。\n“这个给你吃。”\n\n小果子低头看着掌心里那块残缺的饼干。饼干很普通，受了潮，不再酥脆。\n\n“谢谢你。”小果子将饼干合在了双掌之间，对小女孩露出了一个无比温柔的微笑，可眼眶里的泪水却再也按捺不住了，“我已经……好久好久没尝过饼干的味道了。”\n\n她缓缓站起身，把那块带有人体余温的碎饼干小心翼翼地揣进贴身的口袋里。\n推开那扇吱嘎作响的木门，小果子踏进了外面未化的漫天风雪中。\n身后那扇门里传来孩子们细碎的交谈声，夹杂着清脆的笑声，还有那个小女孩用嫩幼的声音咿呀哼唱着的不知名童谣。\n\n小果子静静地听了一会儿，随后拉高了衣领，迎着风雪，一步步坚定地走向了街道的尽头。\n白茫茫的雪地上，留下了一串深深的脚印。而在她的身侧，风雪翻卷间，仿佛有另外几道熟悉的身影并肩同行着，将这一道孤单的足迹，向着遥远的天际无限延伸开去……"
PAM.1414.a:0 "§9这是你妈妈留给你的最后一颗糖，\n很甜很甜的哦。§!"

PAM.142.t:0 "最后的最后"
PAM.142.d:0 "梦境崩塌了。这位寂静国度的神明正走向消散，大殿里散着幽蓝的光斑，缓缓飞向天际。\n\n露西莉亚走上前去伸出双手，触碰到了夜莺寒冷的面孔。\n\n夜莺看着她，眼里的紫芒黯淡了下去。神明的叹息在大殿穹顶下回荡：\n“新一天的门推开了。可往后，要在这长夜里守着的人，换成了你呢。”\n\n“我知道。”露西莉亚的声音执着又平和。\n\n夜莺之心的冷光在这一刻猛然绽放。神明的躯壳化作大块碎落的光斑，尽数融入露西莉亚的体内。两颗本就同源的心脏合在一起，将大地的死寂与冰冷一并收拢了进来。\n\n从此，这世间再也无需有人变成雕像了。\n\n大门口传来一声刺耳的喊声。小果子浑身是血地撞进了大殿。她脑子里全是晓枫姐和雪伊姐倒在血里的模样，仇恨冲昏了脑袋，她要把那个玩弄生灵的夜莺亲手打碎。\n\n可当她看清殿内的一切时，手里的步枪脱手掉落在了地上。\n\n大殿里独独立着露西莉亚，独独留她捧着那柄承载了万千执念的长剑。光斑已经散尽，连最后一丝属于夜莺的痕迹都找不到了。\n\n“……她在哪。”\n“结束了，果子。”露西莉亚沉稳地转过身，一头长发已经褪成了雪白。\n“她在哪！夜莺在哪！她们在哪啊！！”\n“……”\n“结束了……果子。”\n\n露西莉亚看着被悲伤冲击得说不出话来的小果子，眼里汇满了心疼。\n\n小果子无力地瘫倒在了地上，带着要把胸口里所有的痛楚全呕出来的力气，放声大哭了起来。\n\n露西莉亚走到她身边跪了下来，将这个哭得快要断气的小姑娘抱进了怀里。\n\n风雪在这一刻停息了。阳光终于穿透阴云，洒在了两人的脸颊上。\n\n鸟鸣声，\n蝉鸣声，\n\n欢快地响彻在故事的尽头。"
PAM.142.a:0 "“哭吧。”"

 PAM.143.t:0 "写故事的人"
 PAM.143.d:0 "露西莉亚一直安稳地闭着眼，我怎么唤都唤不醒她。她躺在那里，白发散在枕头上，呼吸很轻很轻，轻得我每次都要把手放在她鼻子底下待一会儿，才能确定她还在。\n\n我坐在床边，帮她把头发拨到了耳后。她以前总说我笨手笨脚的，但现在她的头发那么软，我这么笨的手也能将它捋顺了。\n\n我不敢往后山那边看。那两座新堆起来的土坟，每天早上推开窗就能望见，我每次都把视线移开，假装只是在看远处的山。也不敢回想那晚殿门前的枪声，不敢想晓枫姐最后那个笑容，不敢想雪伊姐骂我的那些话。我把那些东西全塞进心里的一个抽屉里，用力关上，告诉自己不要打开。\n“明明……你才是……那个笨蛋才对。”我的眼泪不知道在什么时候流了下来，带着抖得不成样子的声音嘀咕道。\n露西莉亚只是太累了。她想要一个温暖的结局，想要大家都安稳地活着，为了这个她把自己累成了这样。那我替她去做。等到这个世界上再也没有人哭了，她胸口压着的担子就轻了，她就会醒过来了。\n\n我把手从她头发上收了回来，站起了身，顺带弯下腰揉了两下麻麻的膝盖。\n\n“我要让大家幸福起来。”\n\n这句话从嘴里说出来的时候，连我自己都觉得有点好笑。我又不是故事里的主角，也没读过太多的书，以前连自己的名字都记不住。但现在露西莉亚睡着了，写故事的人闭上了眼睛，总得有人替她把这一页翻过去。\n\n那就，让我来好了。"
 PAM.143.a:0 "让世界幸福起来。"

 PAM.144.t:0 "你听见噼里啪啦的声音了吗？"
 PAM.144.d:0 "小果子在床沿坐下，身上带着煤炭燃烧后的涩味。她刚从工厂回来，衣服还没来得及换，袖口上蹭了好几道黑印子。\n\n“喂，露西莉亚。”她伸手戳了戳白发姑娘的软软的脸颊，连手指都陷进去了一小块。“今天工厂的炉子生起来了，烟囱里冒了好大一片白烟。大家把分到的石炭抱回家，炉子一热，夜莺留下的整条街的冰雪都化成了水，淌得到处都是。好多人站在街上笑，说今年冬天的雪再大也不怕了，反正家里冻不死人。”\n\n她把露西莉亚的手从被子底下捞出来，握在自己的手心里暖着。那只手凉凉的，跟刚从井水里捞出来似的，她用自己的指腹一下一下搓着露西莉亚的手。\n\n“我今天在大殿门前围了一圈栅栏，就在晓枫姐和雪伊姐倒下的那块台阶上。大家说应该给她们换个更好的地方，我不准。谁都不准碰。等你睁开眼，我们一起到那里去种花，种好多好多，把台阶都给铺得满满当当，好不好？”\n\n露西莉亚还在静静地躺着，小果子看着那张安安静静的脸，一脸怪罪地嘟囔了一句。\n\n“……都这么久了，你也该起床了吧。以前你可不是这么懒惰的人。”\n\n窗外的雪又落了下来，噼里啪啦的，拍在了窗纸上，细碎的声响像有人在一下一下地敲着窗户。"
 PAM.144.a:0 "明天，我会继续去温暖这个世界。"

 PAM.145.t:0 "风吹进来的感觉是什么样的？"
 PAM.145.d:0 "“喂，露西莉亚，我今天干了一桩大事。”\n\n小果子拿袖子擦了擦额头上的汗，声音里带着一点藏不住的得意。她刚从外面回来，脸上被风吹得红扑扑的，眼睛里却亮得像是点了两团小小的火。\n\n“夜莺以前强占的那些属国，我今天全给她们放了。我把那些地图和盖了章的纸一张一张扔进火里，烧了好一阵呢，火把天都映红了。”\n\n她说着说着就坐到了床边，伸手去摸着露西莉亚的头发。动作很慢很慢。\n\n“那些属国的人拉着车，连夜往自己家赶。我站在山口上看着她们走，她们一路上都在唱歌，唱的是她们以前的老歌，调子弯弯绕绕的，我听不太懂，但很好听。风从山口灌进来，把那些歌声吹到我耳朵边上，不知道为什么，我觉得那阵风里有晓枫姐的味道。”\n\n露西莉亚依旧安稳地躺着。\n\n“她们都回家了。我把路让开了，让她们都能走回去。”小果子抿嘴笑了一下，眼眶里却泛起了水光，不过又给她忍回去了。“露西莉亚，你的心口是不是也跟着轻了一点点？大家都不疼了，你替她们扛了那么久的担子，也该放下来歇一歇了。你要是再睡下去，晓枫姐教我的那些字我可就真忘光了。到时候谁来给你念故事书呀。”"
 PAM.145.a:0 "我会一直在这里。"
 PAM_145_effect_tt:0 "§9以后修剪篱笆的时候，她们的院子也会跟着一起开花。§!"
 PAM_hjb_tt:0 "§Y每有一个国家§!："

 PAM.146.t:0 "很久很久以前"
 PAM.146.d:0 "“对不起啊。”\n小果子把手贴在露西莉亚的掌心里，声音很低，眼泪一滴滴落在她们交叠的手心上：“我以前总想咬你，嫌你说话酸溜溜的，老说些不着调的梦。我还怪你，怪你没能救下大家……可是露西莉亚，我以前不知道你也会疼的。你明明比我还怕冷，怎么就自顾自地把这么重的风雪，都一个人顶在头上了呢。”\n“现在外面一点哭声都听不到了，大家都暖和着呢。露西莉亚，你醒一醒，我们不打仗了，我带你去晒太阳，好不好？”\n\n露西莉亚的睫毛颤了颤，双眼缓慢地翻开，露出一双澄澈的、倒映着微光的眼睛。\n“果子……”\n露西莉亚坐起身，她看着眼前这个哭得脏兮兮的姑娘，伸出手，轻柔地抹去小果子脸上的灰印子。她笑了笑，神色里满是寂静的哀伤：\n“没用的呀，果子。世间的痛苦和遗憾是抹不掉的。即使现在大家都过得安稳，死在昨天的那些同胞，他们的眼泪和怨恨，也依旧存在。\n夜莺散了，可冥界还在。几百年来所有死者的执念，现在都融进了我的身体里。我无法离开这里。我得一直坐在这个安静的地方，替活人守着这些寒冷。”\n露西莉亚抚上自己的胸口。她看着小果子，声音柔弱而笃定：“晓枫姐和雪伊姐……她们也在我的怀里睡着呢。雪伊姐走的时候，其实还摸了摸你的头…………大家，都安心地闭着眼，不怪你啊。”\n露西莉亚替这个世界收留了所有的冰冷，甚至，替她收留了那两缕沉重的幽魂。\n小果子深吸了一口气。直接在台阶上坐了下来：\n“那我也不回去了。”\n“果子？”露西莉亚睁大了眼。\n“我不去晒什么太阳了。晓枫姐不在了，雪伊姐也不在了，现在连你也要留在这儿。你让我一个人回太阳底下去，我一个人，怎么能吃得下饭啊。”小果子拉住她的手，把十指交叠在一处，神色坚强无比，“如果这片冥界是你的身子的话，那我也留在这儿。你守着那些死人的冷，我就守着你。我们两个，在这个故事里，就这么一直挨着，谁也别想丢下谁。”\n露西莉亚伸出手掌轻抚着小果子的头发：“很久很久以前，”露西莉亚的声音依旧温柔，眼泪顺着脸颊流了下来，“有对小鸟……它们决定，在最黑的长夜里，一起等一个永远不会来的清晨。”"
 PAM.146.a:0 "在很久很久以后……"

 PAM.147.t:0 "你还在画那些线吗？"
 PAM.147.d:0 "小果子在桌前坐下，铺开了一张地图。地图的边缘微微泛黄，上面还留着几点墨水和灯油滴下的干涸痕迹。在那些复杂的红线旁，晓枫当年写下的小字依然清晰。\n\n小果子对着笔杆哈了口气，用袖子擦了擦。以前晓枫在灯下画线的时候，总是画着画着就停下来，把笔搁在桌上看一会儿地图，再继续画。她那时候不明白，觉得晓枫姐是在发呆。后来她才知道，那不是在发呆，是在想那些红线会压到多少人。\n\n“晓枫姐，你教我的那些字，我好多都快记不全了。”她把地图上的折痕抚平，手指顺着那些弯弯绕绕的红线慢慢移动，“不过我今天在营房里摆了课桌，请了老师来教那些刚醒来的孩子。教他们怎么看路牌，怎么算账目，怎么写自己的名字。你以前老说我看书像在看天书，现在不一样了。我带出来的那些孩子，一个个都很聪明，比我强多了。”\n\n她看着桌面上落下的光斑，那盏油灯的火苗晃了一下，她的睫毛也跟着颤了一下。\n\n“你跟我说过，在地图上画那些线条的时候，心里要装着里面有多少活人。我现在懂了。山谷底下那些坑坑洼洼的路都填平了，大家都能吃上饱饭了。晓枫姐，我们做得很好。”\n\n她伸出手，用指腹碰了碰地图上那几个褪色的小字。窗外有落叶飘过去，影子从纸面上划过。书架上空空的，那盏灯却还在亮着，哪怕灯下的人早就已经不在了。"
 PAM.147.a:0 "晓枫姐，你看到了吗？"

 PAM.148.t:0 "举起自己的汤匙"
 PAM.148.d:0 "小果子抱着那柄比她的手还长一截的汤勺站在大锅前面，锅里咕嘟咕嘟冒着泡，热气一股脑儿扑在她脸上，把睫毛都打湿了。\n\n“雪伊姐，你看，今天没人插队，也没人为了一个面包吵嘴。”她把勺子沉进汤里慢慢搅着，“门口站着的那些人一个比一个和气，连大声说话的都没有。要是你在这儿，肯定嫌他们太安静了，说他们不像吃饭像念经。”\n\n她说着说着自己先笑了一下，然后目光就不由自主地落到了桌旁那个空出来的位置上。笑声散了，眼眶里慢慢蓄了一圈闪着光的东西。她使劲眨了眨眼，想把那圈东西逼回去，可它们不听话，越聚越多。\n\n“她们跟我说，你是我们这群人里骨头最硬、脾气最差的一个，可心肠也是最软的。你以前老骂我，嫌我切菜像在劈柴，说我熬汤忘了放盐，骂完了又往我碗里多舀一勺肉，说瘦猴似的怎么扛得动枪。”她吸了一下鼻子，用袖子蹭了蹭眼角，“现在贵族老爷跑了，大家的粮食也发下去了。新衣服一人一套，穿在身上挺精神的。我就想让你看看，看完了再骂我两句，多难听都行。”\n\n锅里又翻上来一阵热气，她把脸偏了偏，让蒸汽扑在了脸颊上，这样就分不清哪些是水汽哪些是眼泪了。\n\n“明天我还要去给邻国送谷物，路有点远，不过我已经向大家学会了怎么开车了。等回来我就去找露西莉亚，跟她讲讲今天食堂里的事，跟她讲讲你以前是怎么骂我的。”她把汤勺从锅里提出来，在锅沿上磕了两下，动作跟她记忆中雪伊做过无数次的那个动作一模一样，“我会告诉她，这锅汤是你教我怎么熬的。这个世界也是你帮着一块守下来的。”"
 PAM.148.a:0 "雪伊姐，我已经学会听话了。\n你回来好不好，好不好？"

 PAM.149.t:0 "很久很久以后"
 PAM.149.d:0 "阳光落进废墟，照着殿前那两座坟冢。在深处的殿堂里，时间已经失去了意义。小果子低着头，一双手在裤缝上反复蹭着，即便已经洗了无数遍，她还是觉得掌心里那股粘稠的铁腥味怎么也散不掉。\n“晓枫姐刚才还说口渴呢……雪伊姐也真是的，又不知道跑哪儿去疯了。”小果子低着头，声音带着某种病态的笃定，“露西莉亚，我们得把火再生旺些，别等她们回来的时候，屋里冷冰冰的，那多不像话呀。”\n露西莉亚坐在她身侧，拉住小果子的手腕，止住了那无意义的动作。“果子。她们……自始至终都在这里陪着你呢。”\n\n小果子甩开她的手，眼神里晃动着焦躁。她指着外面被雪盖住的土包，声音拔高了：“胡说！我明明看着她们在那儿站着呢！她们还要带我去吃苹果，还要教我认字……你别想骗我，那晚在殿门口扣扳机的人不是我，那是夜莺，是夜莺那个怪物干的，对不对？我最喜欢姐姐们了，我怎么会……”\n\n看着这幅快要碎掉的模样，露西莉亚叹了一口气，将小果子单薄的肩膀强行拉入怀里。她感受着怀中那具身体剧烈的战栗，缓缓开口：\n“索拉娜当初从梦里醒来的时候，胸腔里其实已经空了。她失去了夜莺之心，却还能在那场风雪里跟着我们走到殿前。果子，你知道那是因为什么吗？”\n小果子愣了愣，眼底的疯狂在露西莉亚沉静的注视下缩了回去。\n\n“那是因为莉莉安娜在那之前，就已经为了她而消散了。她知道那个不听话的野狼贪恋这人间的温度，就自愿把身子融进了夜莺的死气里。她把自己变成了这大地上的风，冰雪中的火，就为了在梦境打破后，还能推着她的小狼多看一眼这个世界。索拉娜走得并不孤单，因为莉莉安娜从未离开过她。”\n露西莉亚抚上自己的心口，那是冥界万千执念沉淀的地方：\n“晓枫姐和雪伊姐也是一样的。她们从没有抛下你不管，也从没有怪过你，因为她们知道，她们知道，那个在海风吹响哨子的孩子，那个在最深的绝望里生起火焰的孩子，那个拼了命要把大家带回家的孩子，一直都是她们最大的骄傲。果子，你可以恨索拉娜，可以恨夜莺，唯独别再继续折磨你自己了。”\n\n小果子看着露西莉亚那双倒映着星星的眼眸。她眼里那股惊惶而生的疯劲被这份悲悯给压了下去，肩膀无力地垮了下来。\n“真的吗……” \n“真的哦。我们一直都在，一直都在一遍遍把大家守到最后呢。”"
 PAM.149.a:0 "毕竟，谁会去怪小果子呢？"

 PAM.150.t:0 "乖孩子"
 PAM.150.d:0 "“火都生起来了，就这么让它熄了，那多可惜呀。”\n夜莺的声音像是一层甩不掉的雾气，慢慢缠了上来。一只属于少女的手在地图上打了个转，最后停在了雪伊守着的那个厂房位置。\n“雪伊现在正等着呢。可风雪里那些坏影子也快到跟前了。趁着你还没累坏，带人去守着那道门好不好？只要那些影子进不去，你心心念念的汽笛声，一定能响彻整个夜空的。你看，你这么努力，雪伊也会为你高兴的吧。”"
 PAM.150.a:0 "……"

 PAM.151.t:0 "你做得真棒"
 PAM.151.d:0 "“哎呀……真遗憾。”\n夜莺的声音听起来软软的，透着一股不自禁的亲昵感。\n“那些影子散开了呢。看呀，它们这会儿又跑到了地图那一头的荒野里，是在和你玩捉迷藏吗？如果是你的话，肯定能赶在汽笛响起来以前赶过去的。加油呀，这种为了同伴而奔忙的样子，真的很好看呢。”"
 PAM.151.a:0 "……"

 PAM.152.t:0 "永远不会来的明天"
 PAM.152.d:0 "“噗呼……抱歉，让你白跑了。”\n夜莺清脆的笑声在你脑海里回荡着。\n“那些影子又回去了，而且带了更多的同伴。真对不起，让你这么辛苦。看着你为了伙伴这么努力，甚至连呼吸都乱了的样子，我真的很满足呢。啊，还有一件事……”\n\n“其实那个拉杆，原本就是坏掉的呢。无论雪伊在那边怎么使劲，那声汽笛也始终响不起来呢。你看，大家都睡得这么甜，吵醒大家，可不是好孩子该做的事呢。”\n\n§1“不过呀，我也不是那么狠心的人呢，我偷偷帮你唤醒了几位勇敢的朋友哦，她们会帮助你的。”"
 PAM.152.a:0 "……"

 PAM.153.t:0 "那个不着调的法子"
 PAM.153.d:0 "窗外的光亮渐渐消失了，那些紫色的雾悄无声息地漫过街道。避难所里，里拉靠在墙边，摆弄着自己的裙子，百无聊赖。她侧过脸看向一旁的妮妮。\n“喂，妮妮。你听过那个救命的法子吗？”里拉的声音听起来像是在讲一个好笑的故事。\n妮妮正盯着面前熄灭的炭火，眼神散乱：“你是说……那个什么躲进木箱子里的笑话？”\n“不对，是纽扣啦。”里拉从袖口摸出一枚因为磨损而失去光泽的小扣子，“我听那些老水手说，随手找一枚掉下来的纽扣，悄悄告诉它一个你藏在心里最深的秘密，再把它放进鞋底。听说这样，梦里的那个影子便会把你当成同类，绕着你走呢。”\n妮妮听完，脸上尽是无奈：“里拉，你真是因为太害怕才变笨了吗？那种哄三岁小孩子的鬼话，亏你也记得住。大家都快要睡着了，找纽扣有什么用。”\n“谁知道呢，万一有用呢。”里拉小声嘟囔了一句。她看着那些顺着门缝钻进来的雾气，缩了缩肩膀。这个法子编得连她自己都觉得荒唐，可在这清冷的屋子里，除了这些不着调的话，她们确实找不出别的事情可做了。"
 PAM.153.a:0 "谁会把这当真呢。"

 PAM.154.t:0 "在两个世界之间"
 PAM.154.d:0 "埃拉背靠着避难所的大门，双手用力抵着横梁。门外的雾气带着一股诱人的花香。她的意识这会儿正像一只在暴雨中晃动的纸船，随时都会翻覆。\n“快看，埃拉……太阳多暖和呀。大家都在草地上野餐呢，快过来坐下。”一个温柔的声音在脑海里响起来，那是梦境编织的幻象。眼前的阴暗地下室，这一秒变成了开满鲜花的庭院。她甚至闻到了刚出炉的食物香气。\n“不……那是假的！”现实中的埃拉猛地咬向舌尖，剧痛让眼前的花海瞬间碎裂。可紧接着，那种温润的困意再次席卷而来。梦境里的她正开心地伸出手去接同伴递来的红茶，而现实中的她，却在寒冷中拼命抓紧那根象征着最后希望的门梁。\n“快回来……大家……还在等着我。”\n她在两个世界之间来回撕扯。梦里的阳光照在背上，让她舒服得想要大哭；现实的冰冷贴在掌心，提醒她这扇门绝不能开。这种拉锯战持续了很久，直到那一抹清明的意志被彻底淹没。埃拉在睡去的那一刻，依然靠着那份偏执的守护，而维持着那个半跪的姿态，将整个身躯都压在了门锁上。"
 PAM.154.a:0 "请再慢一点睡去吧。"


 PAM.155.t:0 "那个玩笑是真的吗？"
 PAM.155.d:0 "屋内陷入了令人窒息的沉寂。门那里发出了一声轻响，那是埃拉彻底睡过去后，身躯落到地面的声音。这一刻，这扇门已经没有人再能从外面打开了。\n“里拉……”妮妮的声音听起来特别沙哑。她看着那堵紧闭的门，眼里那些最后的光亮，这会儿随着恐惧而熄灭了。\n那种无力感混合着刺骨的冰冷，压得人喘不过气来。妮妮的手在口袋里摸索着，那里空荡荡的，就如她们剩下的明天一般。\n“你昨天说的那个……纽扣。”妮妮的声音听着像是随时会消逝的光一样。她没敢抬头看里拉，手心淌满了汗水而变得湿冷无比，“就是那个……找一枚纽扣告诉它秘密，就能醒过来的那个法子。”\n里拉愣住了。她看着妮妮那双布满了血丝、写满了期盼的眼睛。她原本想说那仅仅是个为了排解压力的笑话，可看到周围几个邻居也都抬起头，眼里亮着一种近乎绝望的狂热。这个她为了逃避恐惧而胡编乱造的、荒唐至极的玩笑，此刻竟成了这里唯一剩下的救命稻草。\n“里拉，你快告诉大家啊……”一旁的老妇人颤巍巍地拉住她的衣角，眼里满是哀求，“那个法子，是真的吧？你一定是在哪本书里看到的，对不对……？”\n看着面前这群为了活命眼眶通红的邻人，她心中翻涌着难堪与悲凉，最终还是重重地点了点头：\n“是……是真的哦！大家快找找！身上有没有掉下来的纽扣！等我们把秘密告诉它，这大雾就抓不住咱们了！”"
 PAM.155.a:0 "是真的……是真的哦…………"

 PAM.156.t:0 "关于终点"
 PAM.156.d:0 "窗外的海面上，那些挂着圣杯旗帜的白船正缓慢地移动，旗杆顶端的金属在日光下泛着冷光。那些来自大洋对岸的绅士们在信函里用辞藻堆砌着所谓的盟约与荣誉，听起来和当年那个白色生物发出的邀请并没有什么两样。他们的帝国已经老了，满身都是补不上的窟窿，便渴求着这些拥有奇迹的少女去充当填补裂缝的薪柴。他们赞美少女的羽翼，是希望这些羽翼能扇动起维持他们航行的风，直到大家燃尽最后一丝灵性。\n\n一段声音跨过了防线的阻隔，响在晓美焰的耳畔，声音平缓而安静，仿佛早已看穿了一切。\n\n“晓美焰，你在这个循环里走了好久好久呢。那些在船上喝着下午茶的人，他们聊着秩序，聊着未来的版图，可他们的眼睛里有的只是贪婪。在他们看来，你们的痛苦不过是用来维持天平平衡的筹码罢了。何必再为这种摇摇欲坠的旧梦去奔忙呢。圣杯的怀抱没有温度，那不过是一座用繁文缛节修起来的坟墓。”\n\n那声音停了一小会儿，像是特意在等窗外的海浪把最后一点余音也卷走。\n\n“到我的院子里来吧。这里不需要用奇迹去交换生存，也不需要靠燃烧灵魂去换取胜利。我这里备好了空白的页脚，飞累了的人可以落在上面做一个很长很安稳的梦。圣杯想让你们继续战斗，而我想许给你们一个不会再被任何人打扰的结局。选择权握在你自己的手心里。是要在那艘注定会沉掉的巨轮上耗尽最后一点光，还是在这片安安静静的地方找回那份本来就该属于你们的安宁。"
 PAM.156.a:0 "我们确实已经累了。"
 PAM.156.b:0 "这种安静，未免也太像那座囚笼了。"
 PAM.156.tt:0 "如果她们接受：\n"

 PAM.157.t:0 "从头到尾都是你"
 PAM.157.d:0 "在夜莺消失之后，我就把那颗红宝石还给了露西莉亚，现在它暗沉沉的，跟河滩上随便捡的石子没两样。我都快忘了它脖子上还挂着这么个东西了。\n\n今天大殿后面阳光很好。我坐在台阶上剥着花生，露西莉亚正靠在我旁边打盹，她的白发正散落在她的肩膀上，跟着呼吸一上一下。花生壳在脚边碎了一地，我正想弯腰去把它们捡起来，露西莉亚突然被我的动作带得翻了个身，挂绳从她的领口滑了出来，宝石顺着动作磕在了石阶上，叮的一声。\n\n宝石里那团暗红色里面，似乎有什么东西动了起来。\n\n像深秋早晨窗玻璃上结的第一层霜，像太阳还没完全升起来，照着那种带寒意的白。\n\n“这东西怎么又亮了。”我拿胳膊肘碰了碰醒过来的露西莉亚。\n\n她睫毛未动，却露出了一个很温柔的笑容。那个笑我见过很多次了，每次她有什么话憋在心里等我开口，就是这副表情。\n\n“你想她们了。”"
 PAM.157.a:0 "……"

 PAM.158.t:0 "从头到尾都是你"
 PAM.158.d:0 "我说不出话来。\n\n她把眼睛睁开一条缝，灰蒙蒙的瞳孔侧过来看着我，声音很柔软，却不像是在安慰谁，倒像在替我清点一本我自己都不敢翻的账。“你今天剥了一上午花生，也没吃几颗吧？花生是雪伊以前老揣在兜里的零食，你每剥一颗都在想，她要还在的话，肯定会把最大的那颗抢过去，说这个归我了。”\n\n我握着宝石的手更紧了。\n\n“然后你又在想晓枫姐。你觉得她要在的话，会一声不响地帮我把花生壳扫干净。你不敢往殿前看，从这边刚好能回望见门前那两座坟。你在算日子。算她们走了多久，草长了多高，你看，你的头发颜色都变了。”\n\n她说到这里的时候，后院子里那根晾衣绳上搭着的被单正好被一阵风灌进去，风吹过了被单，又把我那头不知是因为宝石还是营养不良的缘故而变色的头发吹得乱七八糟。\n\n她把我的手拉了过来，用双手包在一起。她的手凉凉的，却让人觉得很舒服。\n“这颗石头从你拿到手那天就在亮。海上，防空洞，老铁厂……它从头到尾都在亮。”她停了一下，把我的手掌翻过来，将宝石放在了正中间，光还在那里一明一暗地亮着。“可后来它暗了。你想想，是什么时候暗的？”\n\n我看着掌心那团光，又不知道怎么回答了。\n\n“是你说该做的事做完了那天。你觉得最难的日子已经熬过去了，它就乖乖暗掉了。\n她顿了顿，“像个以为自己可以下班了的笨蛋。”我听着差点笑出声来。\n“可你刚才坐在这儿剥花生，想起晓枫、雪伊，想起所有人的时候，它又开始发烫了。”说完，她把视线从宝石上移开，落在了我的脸上。\n“夜莺有一颗心脏，是神明留下的，用来维持整个寂静国度。那颗心后来融进了我的身体。但你脖子上这颗，跟夜莺没有关系。它是我在岛上给你的，从一开始，就是一块普通的石头。是你在海上的浪里、在厂里的炉子前、在想她们想得受不了的每一个晚上，把自己的念想一点一点塞进去，它才变成现在这个样子。”"
 PAM.158.a:0 "……"

 PAM.159.t:0 "从头到尾都是你"
 PAM.159.d:0 "她把头靠回我肩膀上，声音越来越轻，“它是一块石头。一颗小小的、会发光、能着火的石头。它记性很好。你这一路是怎么过来的，它全替你记着呢。”\n\n宝石躺在我手心里，颜色不知道什么时候变了，就像我微黄的头发一样。又像刚点着的灯芯，靠着一小团暖光从里面往外漾着。\n我盯着那团跳动的光，想起老铁厂的锅炉房。炉火升起的那一刻，我正对着那些躺着不动的人喊“醒过来”，嗓子喊得像破锣似得。我当时只觉得是这颗石头替我把一切都点着了。\n\n“它什么时候亮，什么时候暗，谁也做不了主。想她们了它就亮，心里空了它就歇着。就这么简单。”露西莉亚的睡意浓得快把她整个人拖进去了。\n她把我的手重新合拢。“就是这样的。”\n\n“那晓枫姐和雪伊姐……”\n“她们用不上这种东西哦。”\n她话接得很快，语气平平的，像在说一件理所当然的事。\n“每个人留下的东西不一样。她们留给你的，用不着装在石头里。”\n好多花生壳都卡在了石缝里，被风吹得簌簌响。\n她把宝石再次归还给了我，重新塞回我的领口。重量很轻，也不冷也不烫，跟我的体温刚好一样，温暖得让人想闭上眼睛。\n\n不知何时，露西莉亚渐渐睡着了，她的呼吸很长，肩膀轻飘飘地靠着我。我坐着一动也不动，顺着风的方向望向了殿门那边……那个我一直不敢正眼去看的方向。\n\n我的眼眶彻底湿润了。\n\n我伸手把露西莉亚的头发拂回肩膀上，手刚碰到那些白得像雪的碎发时，她的嘴里在嘀咕着什么。我以为是在说什么梦话，把耳朵凑近了才听清。\n“我好像……忘记给它起名字了。”\n她的声音像一片落到热水里的雪花。\n“夜莺有她的心脏，神明有神明的遗物。这颗石头却什么都不是呢。”\n\n她把脸往我肩膀里埋了埋，用闷闷的声音说道。\n\n“一颗石头花了一整段故事记住了一个人。用别人的名字叫它，太委屈了。”"
 PAM.159.a:0 "§9那它记住的可不止我一个哦。\n毕竟，你也一直在这颗石头里呢。§!"

 PAM.160.t:0 "有一封信放在了营地的桌上"
 PAM.160.d:0 "这封信纸是温的，带着一股很淡的甜香。\n\n小果子展开信纸，上面的字迹圆圆的，像小孩子描字描出来的一样。\n\n“致我最喜欢的几个读者。\n听说你们要来院子里找我玩。我开心得把刚泡好的茶都打翻了呢。\n可是呀，外面的大雪还在下着，路上的石头又硬又冷，走太久脚会疼的。上次有个孩子没穿鞋就跑出去了，我找了好久才把她抱回来。她缩在铁轨边上，冻得连我的名字都叫不出来了。\n\n我不想你们也变成那样。\n所以我把大门打开了。看，是不是很贴心？\n\n进来的时候记得在门口跺跺脚，把雪抖掉哦。这里的走廊可能有点暗，别怕，我点了蜡烛。蜡烛是我亲手做的，用的是上次那几个不肯睡觉的工人留下的灯油。气味可能不太好闻，我道过歉啦。\n\n对了，索拉娜最近睡得还好吗？上次我偷偷给她塞了一颗糖，她醒的时候有没有吃到？\n\n替我问候晓枫和雪伊。让她们别操心太多事，对皮肤不好。\n\n最后——\n\n果子，你脖子上的那颗宝石，记得拿下来洗一洗。它沾了好多脏东西呢。\n\n我在花园等你们。不用急，茶凉了我再沏一壶。\n\n——夜莺\n\n还有：如果路上遇到那些还站着的人，不用理她们。她们只是在等一个永远不会来的天亮呢。等累了，她们就自己坐下了。”\n\n信的末尾画了一只鸟，歪歪扭扭的，站在一圈篱笆上面。"
 PAM.160.a:0 "……"
 PAM_160_js_tt:0 "§1哦对了，还记得我们在故事开始时的约定吗？现在啊，我要收取一点小小报酬了哦。别怕，我不会害你的，我只是想和你再多玩一会儿呢。§!"

 PAM.161.t:0 "第二封信放在了雪伊的枕头底下"
 PAM.161.d:0 "信纸还是温暖的，只不过这次的信纸边缘沾上了一圈雪水。\n\n“再次致我最喜欢的几个读者。\n\n听说你们在白城扑了个空。\n\n抱歉呀，我应该提前告诉你们的。雪伊她呀，脾气太硬了。我给她唱了好多首歌，她都不肯闭眼，说有人在等她回去，说有个笨蛋不会自己扎头发，她不在的话那个笨蛋头发会乱糟糟的，像个乞丐一样。\n\n所以我把她藏起来了。藏在哪一页里，我自己都有点记不清了呢。你们不用费心找啦。等故事写完了，我翻到那一页，把她放出来就是了。\n\n对了，索拉娜是不是骂我了？她骂人的样子好可爱，像一只被踩了尾巴的猫。下次替我跟她说，她手里那颗糖，其实是我从她那里偷偷拿走的。她当时在梦里笑了一下，我以为她醒着呢。结果她没醒。但那颗糖早就化了呢。\n\n还有小果子。你在雪伊的床板前站了多久？我数了下。从你放下水桶到弯腰捡袖章，大概有一刻钟的时间。你的手还在不停地发抖。我全都看得出来呢。\n\n别难过呀。你找到的那块红布，是我特意留给你的。线头我没剪干净，因为我记得雪伊缝东西的时候从来不打结。她说线头留长一点，以后拆的时候会很方便。\n\n看，我多了解她。\n\n去卡卡罗姆吧。路有点远，石头下面可能会有咬人的东西。我放了几个睡着了的矿工在坑道里。他们很寂寞，想找人玩玩。你们陪他们一会儿，好不好？\n\n——夜莺\n\n对了：露西莉亚，别怕，我不会把你写进去的。你还不是我的角色呢。”\n\n信纸上的温度正在一点一点凉下去。索拉娜凑过来看了一眼，骂了句很难听的话。"
 PAM.161.a:0 "……"

 PAM.162.t:0 "第三封信夹在矿道的岩缝里"
 PAM.162.d:0 "“致刚吵过架的几个小淘气。\n\n卡卡罗姆的矿道很长，你们走得累不累呀。我在这里都能听见你们的脚步声了，啪嗒啪嗒的，在石头中间绕来绕去。索拉娜刚才是不是又骂我了。她骂我的时候声音特别响，从坑道这头一直传到那头，我想听不见都不行呢。\n\n矿工们还好吗。他们睡得太久了，脾气可能不太好。你们陪他们玩得开心吗。\n\n对了，小果子。你刚才在矿道里跟露西莉亚吵架了。我听见了。你把剑捡起来还给她的时候，手怎么还在发抖呢。但你这次肯定不是因为生气。我看得出来哦。\n\n露西莉亚。你刚才说你是个外人。这句话让我有点不开心。上次我在信里说，你还不是我的角色。现在我改主意了。你从越过那片大雾的第一秒开始，就已经被我写在纸上了。别想再继续逃避下去了。\n\n好了，说正事。\n我知道你们接下来要去哪里。那堵灰墙，索拉娜已经在盯着它看了。她想撞开它，对不对。她总是这样，什么事都想用脑袋去顶。不过这次我不会拦她。那堵墙本来就是我放在那里的。我放它在那里，就是为了看她撞上去的样子。\n你们要找的人，就在前面。\n晓枫在矿道出口的地方坐着。她好像是在等你呢。她的嘴里不停念着以前在营房里教你认的那几个字。翻来覆去就那几个。她一直念，一直念，好像念错了哪个音，那个小笨蛋就不会从坑道里走出来一样。\n雪伊在旁边的石头上拧衣服。她刚才踩进水坑里了，她一边拧一边骂，骂衣服怎么还不干。\n\n至于我，我在花园里坐着。茶已经沏了三壶。第一壶我沏在你们刚进上区的时候，那时候天还没亮。第二壶沏在白城，小果子捡袖章的时候。第三壶，就在刚才。你们还在矿道里的时候，可惜现在茶又凉了呢。\n不过不要紧。我再去沏一壶便是了。\n\n——夜莺\n\n还有：小果子，你脖子上那颗宝石又在亮了。它在往前挣扎着，像被什么拉着一样。你猜，是谁在拉它。\n\n还有还有：露西莉亚，你的袜子湿了哦。矿道里很冷的，回去记得换一下。不然脚会冻伤的。”"
 PAM.162.a:0 "她在等我们。走吧。"

 PAM.163.t:0 "致我亲爱的玩家"
 PAM.163.d:0 "唔，我刚把茶沏好，就听到了你的这个请求。你希望让莉兰迪亚王国里的那些小家伙们自己走进我的花园，而我则去别处寻找新的读者？这个想法很贴心呢，知道我这里冷清，想派些人过来陪我。\n\n但是呀，我拒绝。\n\n这可不是我对你们有什么不满哦。只是，你告诉我，当一位读者翻开一本新书的时候，她最希望看到的是什么呢？是那些被丝线吊着、机械地念着台词的玩偶，还是用颤抖的手一页一页翻过书页的……真正的故事？\n\n我需要的是你。需要你的犹豫、你的愤怒。只有这些东西，才能让我的花园迎来真正的春天。把舞台交给失去了灵魂的玩偶，是对这场盛大演出的亵渎。\n\n所以，请把这份被拒绝的遗憾轻轻放下吧。如果你真的想走进我的花园，那么，请握紧你自己的笔杆亲自赶来。只有你，才是我唯一承认的读者。\n\n来吧，推开那扇门。规则上的那个选项，是留给你的。\n\n——夜莺\n\n你不会真的以为，我会和一堆代码玩过家家吧？"
 PAM.163.a:0 "好吧。我亲自来。"
 PAM.163.b:0 "唉，被骗了"

 PAM.164.t:0 "来自莉兰迪亚的信"
 PAM.164.d:0 "致正盘算着下一场远征的阁下。\n\n你大概没有听说过我的名字。我叫露西莉亚，在莉兰迪亚替几个不喜欢睡觉的朋友守着院子。\n\n最近有一些消息从很远的地方飘到我的院子里来。说你的军队正在做一件很了不起的事，在将别人的土地变成自己的，将别人的家变成地图上的标记。他们管这叫开拓，叫征服，叫让旗帜飘扬在更远的地方。\n\n我听完之后想了好一会儿。然后我把我的剑从墙上取下来了。\n我以前写信的时候总是先沏一杯茶，铺开纸，想很久的开头。但这封信我写得很顺，因为我要说的话很简单。请把你的军队从那些不属于你的土地上撤回去，然后再去把那些被你们打碎的房子修好，把那些被你们赶走的人请回家。然后安安静静地待在自己的边界里，不要再对邻居挥拳头了。\n如果你愿意收手，我可以当这些事从来没有发生过。你的士兵可以回家种田，你的将军可以脱下军服去晒晒太阳。但有些事不会因为我的原谅而消失。你的议会里会有人站起来问你为什么要打一场还没开始就结束的仗，你工厂里的工人会发现生产线突然停了，你的名字会沾上你本来不用沾的灰尘。那些被你踩过的土地会记住你曾经来过，住在那里的人会在很长一段时间里睡不安稳。这些账会一笔一笔写在你的履历上，谁也擦不掉。\n\n但如果你还想继续。如果你觉得手里的枪比别人的命更重，如果你觉得地图上的颜色比活着的人更重要。那你就会看到一个骑着马的白发姑娘出现在你的边境上。她不太会说话，但她很擅长让战争停下来。我向你保证，那不是你想看到的场面。\n\n请务必考虑一下。在还有的选的时候。\n\n——露西莉亚\n莉兰迪亚的守夜人\n\n另外：如果你答应了又反悔，我会知道的。等你再次挑起战火的那天，我会亲自把这封信重新送到你的桌前。到那时候，这封信就不是信了。"
 PAM.164.a:0 "接受她的条件，撤回所有军队。"
 PAM.164.b:0 "一个守院子的人不配教我怎么治国。"

 PAM.165.t:0 "在翻开第一页之前，先靠过来一下嘛"
 PAM.165.d:0 "你来啦。我刚才趴在桌上差点睡着了，迷迷糊糊听见门被推开的声音，一下子就清醒了。我等了你好久好久，等到茶都换了好几壶，等到窗台上那只小鸟吃饱了面包屑又飞走了。不过没关系，你来得刚刚好。\n\n这本书是我专门写给你的，只写给你一个人。里面的每一个字我都反复念过，念出声的那种哦。有些地方念着念着就笑了，有些地方我写完之后自己都不敢再看第二遍，因为一看就会想起那天晚上的风有多冷。你可不许翻到那一页就随随便便看过去，要好好读，读完了要记得抬头喘一口气。\n\n在翻开第一页之前，我想先在你身上放几个很小很小的东西。你不要紧张，不会疼的，就像被蝴蝶的翅膀扫了一下眼皮。你看不见它，但我能感觉到。以后你走到很远很远的地方，遇到很难很难的事，这个东西就会变烫，像是在你心里点了一根小蜡烛。它会提醒你，不管这条路有多黑，有一个人一直在很远的地方惦记着你。\n\n不过我要提前告诉你哦。这些小东西偶尔也会让周围莫名其妙地暗一下，像有人在你耳边轻轻吹了一口气。你回头看的时候什么都没有，那是因为我的影子刚好从那里经过。你不准害怕。害怕的话就念我的名字，“夜莺”，我会听到的。\n\n我还偷偷帮你做了几件事，你不要跟别人说哦。我把你院子里那些站岗的孩子们多留了一会儿，她们本来早该下班了，我跟她们说再站一站嘛，就当是陪我聊聊天。她们都很听话，因为她们知道你明天还有很多事要做。我给至于那些小东西嘛，她们就藏在后面的某一页里，等你翻到那里的时候自然会找到。现在我不告诉你在哪一页，说了就没意思啦。\n\n你是不是想问我为什么要做这些。其实我也不知道。大概是因为你推门进来的时候带了一阵风，那阵风吹在我脸上凉凉的，特别舒服。也可能是你看这本书的眼神太认真了，让我觉得这本书等了这么久，终于等到了对的人。\n\n好了，我不说了。你翻开第一页吧。我就在你旁边坐着，你读到哪一页，我就陪你到哪一页。你不需要找我。等你读到最后一页的时候，我会来接你，带你去一个只有我们两个人知道的地方。\n\n在那之前，慢慢读。这本书的每一页，都是我在想你的时候写的。"
 PAM.165.a:0 "我会的。"
 PAM.165.b:0 "你在书里藏了什么……"

 PAM.1652.t:0 "来自心脏"
 PAM.1652.d:0 "你已经很久没有想起那个午后的花园了。那个坐在台阶上，翻着一本故事书，对着你轻轻招手的女孩。她当时在你身上放了一个小小的东西，你说你不怕。\n\n现在战线正在崩溃，地图上的颜色一点一点变成别人的，你已经快要拿不稳枪了。就在这时，你心口那个位置像被什么东西烫了一下。像是在你心脏旁边点了一簇火苗。\n\n然后一阵风从你耳边吹过去，带着淡淡的甜香。你听见了一个声音，不知道是从风里传来的，还是从你自己的身体里传来的。\n\n“别怕，我在呢。再撑一会儿，就一会儿。”\n\n回头看，身后什么都没有。那些正在逼近的敌人好像慢了下来，他们的补给车队在雪地里打滑，他们的士兵在寒夜里瑟瑟发抖。而你，站了起来。"
 PAM.1652.a:0 "……那就再撑一会儿。"

 PAM.166.t:0 "路边有朵不认识的花"
 PAM.166.d:0 "去阿德莱希的路比地图上画的要远得多。太阳从头顶挪到了西边，我的影子拖在地上，长得快够到路对面的树丛了。走得有点累了，我就找了个草坡坐了下来，把鞋脱了倒里面的沙子，我的脚趾头磨得红红的，我用手揉了两下，正准备把鞋穿回去。\n\n就在这时候，我看见路边有一朵花。很小，淡紫色的，从一丛枯草里探出来，被风吹得一摇一摇的。我不认识这种花，晓枫姐没教过我认花，她就教过我认地图上的标记。我蹲下来从水壶里倒了一点点水在它的根旁边，水很快就被干土吸进去了，只留下一小片深色的印子。\n\n身后突然传来了一声笑声，差点把我手里的水壶吓掉了。我转过头，一个和我差不多大的女孩站在路边，背着个粗布缝的挎包，手背蹭在嘴角上正在忍笑。她的皮肤晒得有点黑，头发编成两条辫子盘在脑后，袖口挽得高高的，上面沾着几道油印子，像是刚从什么车间里出来。\n\n“你给野草浇水做什么。”她的声音里还憋着笑，“那种东西明天就被太阳晒死了。”\n\n“可是……它在开花呀。你看，开了好几朵呢。”\n\n“开花也是野草呀，阿德莱希路边全是这种，春天下完雨就冒出来，太阳一晒又蔫了。没人会给野草浇水的。”\n\n“我就浇了。”我也不知道为什么，这句话说得特别理直气壮。\n\n她笑得弯下腰去，“你是外地来的吧，一看就知道。本地人不会蹲在路边跟一朵野花较劲的。”\n\n“我是莉兰迪亚来的。”\n\n她听到那个名字的时候表情变了一下，像是想起了什么很久以前的事。她把挎包放下来坐在我旁边，从包里摸出一个带着水珠的青皮果子递给了我，“这个比野草有用，前面还有好远一段路呢。”我接过来咬了一口，酸得眯起眼睛，但嚼到后面有一股很淡的甜味。\n\n“我叫拉米拉。”她说。\n\n“我叫小果子。”"
 PAM.166.a:0 "……"

 PAM.167.t:0 "路边有朵不认识的花"
 PAM.167.d:0 "“小果子。”她把这个名字在嘴里念了一遍，“你们莉兰迪亚的人起名字还真有意思。”然后她沉默了一会儿，手里揪着一根枯草转来转去。“以前这儿什么都种不活，整片地都是黑的，种什么死什么。后来我们都睡了一觉，醒过来之后路边就全是这种花了，也不知道哪儿来的。”\n“我每次路过都会看一眼，”她把那根枯草扔在了地上，“但我不会给它浇水。毕竟啊，那么多人都在梦里不在了，浇一朵花又有什么用呢。”\n\n“那……那你为什么每次都要看一眼嘛。”\n\n我的问题好像让她愣了一下。她没作答，只是拍了拍手上的碎屑。“你还真是莉兰迪亚来的人。只有你们莉兰迪亚的人，才会在这种事情上较真。我们阿德莱希的人早就习惯了，习惯了不去在意那些很快就会消失的东西。但是你在意。你给野草浇水，你跟不认识的花说话，你还蹲在路边跟一个笑你的人聊天。你们莉兰迪亚，还真是个奇怪的地方。”\n“你要去阿德莱希办什么事吗。”她问。\n“去送一批物资。还有一些文件要签。”\n“文件。”她重复了一遍这个词，“夜莺那个时候也是签文件的。签完了我们就睡着了。”\n\n“这次不一样啦。这次签完了，你们可以继续睁开眼睛。继续工作，继续在路边看花。我保证。”\n“你怎么保证。”\n“因为笔在我手里呀。我不会再让任何人签那种文件了。”\n\n她看了我好一会儿，然后把头转过去看着远处山口的方向，那里曾经是雾最浓的地方，现在已经完全散了，能看见一整片干干净净的天空。\n\n“那朵花你要是真放心不下，我替你多浇一天，就一天。”她站起来把挎包背好，拍了拍裤子上的草屑。\n\n“那后天呢。”\n“后天我该回车间上工了。”\n“那你帮我在车间窗台上放一盆嘛。不用浇水的那种也行。”\n“车间窗台上只有机油瓶子，你让我放哪。”她笑出声来，摆摆手转身走了。挎包在她腰侧一颠一颠的，袖口上那几道机油印子在夕阳里泛着暗金色的光。\n\n我把剩下的果子核埋在路边，用脚踩实了之后，才站起来拍了拍裤子上的草屑，继续往前走去。"
 PAM.167.a:0 "后天我也会来的。"

 PAM.168.t:0 "站台上来了个小姑娘"
 PAM.168.d:0 "边境车站的政委整理了一下军容，原本准备向那位带领莉兰迪亚打碎梦境、重建秩序的“野火最高指挥官”致以严肃的革命军礼。\n\n然而，当那列落满风雪的蒸汽列车停稳、车门轰然打开时，从驾驶室里跳下来的，却是个扎着双马尾的小姑娘。\n\n她身上套着件显然属于成年人的大衣，袖口笨拙地卷了好几折，露出带着伤疤的小手。她袖头上斜斜地别着一块缝得歪歪扭扭的红布，下车时还差点被过长的衣摆绊个踉跄。她抹了抹鼻尖上的灰，仰起头看过来。\n\n“你们就是在这里跟法西斯打仗的人吗？”\n\n她的声音虽然还带着些许幼气，可里面的平静与沉重却让人心头紧绷。那是只有真正从死人堆里爬出来的人才有的眼神。政委僵在原地，下意识地往她身后看去，以为这位领袖的防卫官或参谋长还没下车。然而，那些满脸刀疤、身材高大的老工人们，此刻却安静而肃穆地立在这个小女孩身后。\n\n在她眼里，全世界所有的法西斯侵略者，都和当年在雨里抽鞭子、烧毁粮仓的贵族老爷是一模一样的怪物。她指了指身后已经开始卸锁的车厢，眼神里没有一丁点动摇：\n\n“晓枫姐和雪伊姐用命换来了今天。她们说过，凡是跟这群吃人怪物拼命的人，流的都是一样的血。我们带来了粮食、防寒棉衣和整箱的子弹。哪儿是前线？我们把货卸到那里去，你们的战士就能少死几个。”"
 PAM.168.a:0 "去开几罐热汤来……这是咱们自己的小妹妹。"
 PAM.168.b:0 "战争带来的代价，不应由一群孩子来承担。"

 PAM.169.t:0 "海风"
 PAM.169.d:0 "特使先生理了理领带，从舷梯上缓步走下。他手里握着一份用辞优雅、阐述着国际秩序与自由通商的国书，准备递交给莉兰迪亚的最高执政者。\n\n他以为会看到宏伟的议会大楼，或者至少是一支排列整齐的仪仗队。然而码头上空空荡荡，只有呼啸的海风。\n\n白发的露西莉亚立在系船柱旁，单手正搭在她的剑柄上。而在她身旁的一个倒扣木箱上，正坐着一个扎着两条马尾的小女孩。她的双腿悬在半空中一晃一晃的，脚尖甚至够不到地面。\n\n当特使清了清嗓子，试探性地询问“莉兰迪亚的执政官阁下在何处”时，那位白发的姑娘只是微微侧过头，看向了木箱上的孩子。\n\n小女孩停下手中的动作，抬起头看向这群西装革履的绅士。特使准备好的宏篇大论卡在了喉咙里，这个刚把一位神明推下王座、名震一方的掌控者，居然是个年纪轻轻的孩子。可那双眼睛里透出的冷静与沧桑，却让在场的所有人心底生寒。\n\n“先生们，海风很大，漂亮话听不清，也不管用。”小女孩收起枪栓，声音沉稳得像是在陈述某种既定的事实，“我们不懂你们议会里那些绕弯子的规矩。但我们知道法西斯的铁靴踩踩在人身上有多疼。如果你们是来找同伴抵御侵略的，仓库就在那边，契约写在明处，平买平卖。但如果你们想戴着高高的帽子来当我们的‘老爷’……莉兰迪亚埋了太多死人，露西莉亚的手可冷了，我们不招待心怀鬼胎的外人。”"
 PAM.169.a:0 "脱下帽子，把契约公平地摆在桌上。"
 PAM.169.b:0 "让一个小女孩当政，这地方简直不可理喻。"


 PAM.170.t:0 "在阳光落下的地方"
 PAM.170.d:0 "“露西莉亚，你看，太阳出来了呢。”\n\n小果子拉了拉身边人的袖子。日光已经洒在了门前，亮得让人睁不开眼睛。\n露西莉亚看着那一地明晃晃的光，眼里的水汽再也藏不住了。\n她将双手扣在自己胸口上，那里装着莉莉安娜留下的那颗心，装着那个早已碎在月下的灵魂。\n\n“莉莉安娜……”\n“你以前最想看的太阳，是什么呢……”\n“你为什么不在了呢……你把我留在这里……你知不知道，我好想你啊……”\n“我听了你的话，我去当那个勇敢的骑士了……我去保护大家了，我去给孩子们讲那些你给我讲过的故事了……我跑了好多个世界，讲了好多个故事，哪怕被大家讨厌，被当成假英雄、假骑士，我一次都没哭过哦……”\n“可是莉莉安娜……我好想听你再给我讲个故事，我好想听你叫我一声‘我的骑士’……你为什么要把我一个人丢下呢，莉莉安娜……”\n她嚎啕大哭着，那些在无数个故事里硬撑了好多次的坚强，在这一刻彻底粉碎了。在那个早已毁掉的世界里，她亲眼看着莉莉安娜在她怀里一点点冷透，看着那束光散成灰烬。那些忍了好久的难过，在这一秒全压了上来。\n小果子看着她这副哭得快要断气的模样，眼泪也跟着掉了下来。小果子凑过去，用尽力气将露西莉亚抱进了怀里，贴着她的耳朵说：\n“她在看的，露西莉亚，她一直在天上看着呢。”\n“你是最厉害的骑士。你救了大家，你也救了我。莉莉安娜要是看到你现在的样子，她该有多心疼啊。”\n“果子……我早就没有家了呀……”露西莉亚抓着小果子的衣服，哭声渐渐微弱了下来，“我的故事早就消失了，我的莉莉安娜再也回不来了……”\n“这里就是你的家。”小果子搂着她，任由露西莉亚的眼泪烫在自己脖子里，声音虽然带着控制不住情绪的颤抖，但依旧有着无比认真的气势，“大家……大家都不在了，可我还在呢。我不是说过了吗，我陪你守着这个故事，我做你的家人。以后每一个有太阳的日子，我都陪你过哦。”\n……\n长夜在这一刻彻底落下了帷幕，两个浑身是伤的孩子，此刻正在阳光里抱在了一块。\n露西莉亚把脸埋在了小果子的衣服里，听着那一声声有力的心跳。她闭着眼睛，在脑海里对那个早就走远的人，小声诉说着心里的话：\n\n“莉莉安娜……你看到了吗？这里的阳光，真的好耀眼啊……”\n“我遇到很好很好的同伴了，我也找到能够留下来的家了。”\n“你以前和我说过的太阳，今天……真的晒到我身上了呢。”\n……\n“谢谢你，公主殿下。”"
 PAM.170.a:0 "§t“谢谢你……带我来到了这里呢……”§!"

 PAM.171.t:0 "来自昨天的甜味"
 PAM.171.d:0 "“喏，拿去吧。”小果子从口袋里摸出一小块用纸包着的糖，递给了露西莉亚，“刚才去给大家分种子的时候，那些孩子硬塞给我的。我想着你喜欢甜食，全给你攒着呢。快尝尝，可甜了。”\n\n露西莉亚接了过来，剥开包纸将那块糖放进嘴里。\n\n甜甜的味道在舌尖漾开。\n\n记忆深处被她锁起来的寒门，顺着这股子甜味，啪嗒一声碎开了。\n\n那是……很久很久以前的事了。在那个早已遗弃的故事里，自己要收拾行囊远行的时候，莉莉安娜也是这样，将一小袋糖果塞进自己的包里。\n\n那时候莉莉安娜的摸着自己的头，声音是那么的温顺：\n\n“外面会冷的。不开心的时候，吃一颗。甜的东西，总能让人有力气一点。”\n\n“我只是想让你先爱上这个世界。\n   爱上这里会笑的人们，\n   爱上这里会开的花，\n   爱上这里……所有所有，值得被守护的美好。”\n\n“这样……你就永远不会忘记，自己到底是为了什么才拔出剑的了。”\n\n露西莉亚含着嘴里的糖，想着……想着……眼眶里的泪水就毫无预兆地滚落了下来。\n\n她听了莉莉安娜的话，她爱上了这个会笑、会哭的世界，她保护了大家，她找到了小果子……\n\n可那个教她去爱、给她送糖的公主殿下，再也回不来了。"
 PAM.171.a:0 "……"

 PAM.172.t:0 "大雾外走来的客人"
 PAM.172.d:0 "在漫长的长夜里，站台上迎来了一群特殊的客人。\n\n不过，那好像不是什么盛气凌人的外交使团，那是一群穿着各式各样的衣服、满脸风雨的年轻队伍。她们开着装满大米、衣服与子弹箱的卡车，就那样停在了我们的门前。\n\n领头的姑娘跳下车，递过来一杯冒着滚烫热气的红茶。她的语气软软糯糯，却带着一种焦急万分的催促：\n\n“快……快把车停进棚子里去呀。大家在夜里硬撑了多久啦？别硬扛着啦。我们把家里的柴火和队伍分了一部分过来，一起靠在一起取暖吧？等晚上一过、等到太阳起来的时候，我们就都能安心回家了。”"
 PAM.172.a:0 "请进吧……谢谢你们带来的温暖。"
 PAM.172.b:0 "外面的风雨虽大，但我们可以自己支撑下去。"

 PAM.173.t:0 "遥远的回响"
 PAM.173.d:0 "前往[FROM.getname]帮忙的队伍已经平安抵达了。\n\n随风带回来的信里说，大家正挤在同一个屋檐下避雨，用同一个炉子烤着干粮，还互相给对方打气，大家都在一起等待着光明到来的那一天。"
 PAM.173.a:0 "§9愿大家都能平安撑到天亮呢。§!"

 PAM.174.t:0 "原路折返的队伍"
 PAM.174.d:0 "派去[FROM.getname]帮忙的队伍在傍晚归来了。她们说，远方的人们希望靠自己的双手去把黑夜吓跑。\n\n大家把物资重新搬回了仓库，小声聊着今天路上的见闻。"
 PAM.174.a:0 "§1辛苦啦，快去喝杯茶吧。§!"

 PAM.175.t:0 "当春光重回大地"
 PAM.175.d:0 "夜晚终于彻底过去了呢。\n太阳升起的时候，远方的大路上开来了特别长的车队。当年去[FROM.getname]帮忙的队伍身后还跟着许多远道而来的朋友。她们拉着满载的新车厢，里面装满了崭新的衣物、种子，还有各式各样的礼物。\n\n远方的客人深深地躬下身去，说道：\n\n“在我们最难过、最绝望的那个黑夜里，是你们分出灯火护住了我们。如今我们这里的太阳升起来了，我们把大家的英雄完整地送回来了，也带上了我们所有的感激。愿我们的家园，永远都有阳光。”"
 PAM.175.a:0 "§9欢迎回家……大家都辛苦啦。§!"
 


 PAM.1744.t:0 "也是属于你们的晨曦哦"
 PAM.1744.d:0 "[FROM.FROM.getname]的黑夜终于彻底过去了呢。\n\n当阳光照在大路上的时候，远方开来了特别长的车队。那是来自[PAM.GetName]的朋友们，运来的车厢。\n\n里面装满了适合姑娘们穿的崭新衣物、花籽、可口的果酱与刚烘好的饼干。\n\n习惯了在寒冷里厮杀的魔法少女们站在路边，看着这支车队，眼里满是困惑。在她们的理解里，自己从来不是被守护的关照对象，唯有战斗与被当作燃料一样燃烧殆尽才是自己的归宿。\n\n领头的护送员跳下车，把几盒香甜的饼干与柔软的衣服塞进了她们手里，笑着说：\n\n“在大家绝望的时候，是你们挡在所有人身前护住了微光。如今我们那里的太阳升起来了，大家分配到了好东西，第一时间就想着送来给你们呢。”\n\n“你们也是需要被照顾的姑娘呀。换上新衣服吧，尝尝这些饼干吧，大家一起在阳光下安稳地休息一阵子吧。”\n\n看着周围朋友们真诚的笑脸，少女们的眼里泛起了温存的水光。\n\n原来，在这个战火平息的世界里，她们也是被爱着、被守护着的呢。"
 PAM.1744.a:0 "§0“原来……我们也可以获得幸福吗……”§!"

 PAM.176.t:0 "熄灭在风里"
 PAM.176.d:0 "阵地前方的雨，好像又落下来了。\n\n隔着弥漫的雾气，对面传过来一阵隐约的歌声。那是很久很久以前，大家和[FROM.FROM.getname]躲在长夜里相聚时一起唱过的调子。\n\n曾经跨过大雨去帮忙的队伍，曾经紧紧握在一起的手，如今却在冰冷的枪口前停下了脚步。抬起头时，眼底却除了茫然以外，什么也找不到了。\n\n没有人知道事情为什么会变成这个样子。\n是这个世界太冷了，还是那些关于未来的约定，早就随着冬天的雪水一起流走了呢？\n\n曾经为了照亮黑夜而递过去的灯火，最终在枪声响起的那一秒，彻底熄灭在了风里。\n\n剩下的，只有漫长无边的寒冷。"
 PAM.176.a:0 "§t我们……本就不是一路人吗……§!"

 PAM.177.t:0 "第二道光芒"
 PAM.177.d:0 "“把手伸给我！埃里克！撑住啊！”\n防线已经被打烂了。漆黑的冰冷铠甲从雾气深处涌出来，同伴们接连倒下去，枪声越来越稀拉。\n埃里克趴在土坡边上，正大口喘着气。他看着手里的空弹盒，声音带有绝望：“班长……大家跑不掉了……我动不了了……”\n远方的雾气里，传来了一个柔和又虚幻的声音。那声音像是在哄小孩睡觉，在每个人耳边念叨着：\n“放弃吧……好孩子……把眼睛闭上……靠在雪里……就再也不会疼了哦……”\n那声音太清甜、太软和了，像是一张看不见的毛毯，要将大家彻底拖进永不醒来的沉睡里。\n我也快撑不住了。两条腿沉重如铁，视线渐渐模糊了起来。\n就在这时，前方大雾里闪过一道刺眼的黑影，一柄长刃横空斩了下来，带着斩断一切的杀意，直冲着我和埃里克的头顶劈落！\n我咬紧牙关，把埃里克按在怀里，用自己的背脊迎了上去。\n本该落下的剧痛，却在最后一刻破灭了。\n一道冰蓝的剑芒如同闪电在雾气里划过！锵的一声脆响，那柄斩向我们的长刃被硬生生格开，火星溅在了我的脸上。\n一个披着斗篷的身影在雾气里晃了一下。那人未曾回头，亦未发一言，光是用那柄修长的长剑划出一道缺口，随即隐没在了厚重的白雾深处。\n我们还活着！\n\n“怎么会这样呢……”那个虚幻的声音带上了一丝错愕。\n\n我看着怀里尚有体温的同伴和远处还在坚持抵抗的几个弟兄。那股本来要熄灭的火气，在胸膛里轰地炸开了！\n有人帮我们挡下了必死的一击。可接下来这条路，得靠我们自己走过去！\n\n“埃里克！站起来！”\n我大吼着，一把将他从土坑里拉了起来。\n我抓起地上那面染血的旗帜，对着防线上所有还在喘气的弟兄们发出了响亮的声音：\n“听到了吗！我们还没死！阳光照进来了！跟我冲过去！回家！！”\n\n“回家！！”\n埃里克擦干眼泪，拔出腰间的短枪大声应和着。残存的弟兄们从土堆里站了起来，大家手牵着手，用尽最后的力气，朝着那道被阳光照亮的地方发起了决绝的冲锋！\n\n黑色的影子在我们面前碎裂，冰冷的迷雾在我们脚下退散！\n我们靠着自己的双脚，硬生生冲出了那片绝境！"
 PAM.177.a:0 "§t“走吧……我们回家了！”§!"

 PAM.178.t:0 "不能忘"
 PAM.178.d:0 "“姐姐，我是不是个坏孩子呀？”\n\n可可把脸埋在两膝之间，声音带有浓厚的鼻音。\n“我今天……好像快要记不清妈妈说话的声音了呢。隔壁的叔叔说，把那些伤心的事全忘掉，顺着这股困意睡过去，心里就再也不会难受了。”\n\n我蹲在她跟前，拿两手包裹住了她那双冰冷的小手。\n大雪封住了屋门，街上的人们相继放弃了抵挡，任由沉睡将自己吞没。大家都在选择遗忘，选择不再去承受悲伤。\n\n“不能忘，可可。”\n我的眼泪砸在了可可的手背上。\n“妈妈教我们的童谣，妈妈抱着我们时的温暖，都是我们活过的证明呀！”\n“就算想起妈妈会哭，就算心口会疼，都因为我们曾经那么深地相爱过……”\n\n可可抬起头看我，眼里带有迷茫与困惑。\n“可是……可是想起妈妈的时候……真的好疼呀……”\n可可吸着鼻子，眼泪颗颗砸在我的手心里。\n\n原本要从门缝里挤进来的冰冷狂风，突然间平息了下去。\n那股要把我们冻透的严寒，在门外被一股无形的力量阻隔开了。\n屋子里神奇地恢复了安宁。\n\n可可伸手擦掉我脸上的泪水。\n“姐姐……别哭呀……”\n可可靠进了我的怀里，双手用力抓着我的衣服。她缩在我肩头，小声哼起了那首童谣。那是一家人还在的时候，妈妈每天晚上都会唱给我们的调子。\n我抱紧可可，贴着她的额头一块哼唱着。\n歌声在屋子里回荡。可可眼里的迷茫全散开了，她伏在我身上嚎啕大哭起来，把压在心里所有的委屈与思念全哭了出来。\n\n那些被我们拼命守住的记忆，在歌声里变成了滚烫的热意。\n我们靠在一起，在眼泪与歌声里，守住了属于我们的家。"
 PAM.178.a:0 "§t“因为相爱过……所以绝对不能忘记！”§!"

 PAM.179.t:0 "大雪覆盖的树下"
 PAM.179.d:0 "“妈，你炖的汤难吃死了，我讨厌你！”\n\n梦里，两个孩子推开盘子，摔门跑进了外面的大雪里。\n我拍掉手上的碎屑，把落在地上的布娃娃收进了怀里。\n\n屋角坐着那个白发的小姑娘，她在我们家坐了许多天。她每天看着我收拾房间，看着我被梦里的孩子们冷落，眼里带有浓得化不开的愧疚。\n\n“大婶……”她开口了，声音带有沙哑，“这个梦……你其实早就看穿了，对不对？”\n\n我对着她叹了口气：“是啊。我的孩子……早在多年前的大雪天里就冻死了呢。”\n\n我摸着怀里的布娃娃：\n“我在梦里被她们讨厌，是因为当年大雪落下来的时候，我把多余的一点点口粮拿去救了街上的孤儿，没能赶回家……我的孩子们……肯定是带着对我的恨意冻死的。能在这梦里听她们抱怨几句，我心里踏实……这是我该受的罪啊。”\n\n小姑娘站起身，按着腰间的长剑，眼泪顺着她的脸颊流了下来。\n“不是的……”她声音嘶哑得不成样子，“她们当年一点也没恨你啊……大雪封山的那天……是我在树下找到了她们……”\n“大的孩子把最后一个冻硬的饭团塞在小的孩子嘴里，小的孩子抱着你给她们缝的布娃娃……她们到死都在跟对方说，妈妈是去救别人了，妈妈是最棒的妈妈……她们一直在等你回家啊……”\n\n我愣住了。原来……我的孩子们……在冰天雪地里挨冻的时候，心里想的全是我？她们从来没恨过我？\n\n小姑娘拔出了长剑。\n“大婶……我不能让你带着这份误会与自责死去……”\n剑芒划破虚空，梦境碎成了漫天的白雪。"
 PAM.179.a:0 "……"

 PAM.180.t:0 "大雪覆盖的树下"
 PAM.180.d:0 "我睁开眼睛，回到了现实那间四壁透风的破屋里。身上的绝症到了尽头，催促着我大口吐出黑血。小姑娘跪在我身边，用双手轻柔地捧着我的头。我看着她那张泪流满面的脸，与她那一头比雪还要白的长发。\n\n我记起来了。\n多年前在大雪里把我的孩子们安葬在树下的那个白发的孩子……就是眼前这个小姑娘啊……\n\n我伸出了手，帮她蹭掉脸上的眼泪。\n“小姑娘……原来是你啊……”我哑着嗓子，对她露出了这辈子最解脱的笑，“当年……替我把孩子们安葬好的那个人……就是你对不对？”\n“这些年……辛苦你替我记住她们了……”\n\n小姑娘伏在了我的怀里，嚎啕大哭起来，像个犯了错的孩子。\n“对不起……对不起……当年我没能救下她们……我也没能救下你……”\n\n我抚摸着她的白发，把最后的体温贴在了她的手心里：\n“傻孩子……我哪会怪你啊……我的孩子们，也从来没怪过我啊……”\n“谢谢你啊……”\n\n我安详地闭起了眼睛。\n\n小姑娘抱紧了我冰冷的身体，在空屋子里哭得撕心裂肺。她以为自己是个未能拯救任何人的冒牌货，可在这最后的时刻，她被这个她未能救下的母亲……彻底原谅了。\n\n破墙外吹进来的风雪卷过了这间死寂的屋子。\n小姑娘抬起头，眼神空洞地看着角落里两张早已腐朽的空床。\n在那个被她亲手斩碎的梦里，这里有欢笑，有热气，有孩子们娇嗔的声音，也有这位母亲活着的身影。\n而在现实里，只剩下了一具冰冷的尸体，满地的血迹，和死一般的空荡。"
 PAM.180.a:0 "§t（我……真的是在拯救她们吗……）§!"

 PAM.181.t:0 "失落的剑锋"
 PAM.181.d:0 "我斩开迷雾，踏进了这座被噩梦包裹的小院。\n\n长剑在我手中散着刺骨的寒芒。我想着要快些，再快些，把那个沉溺在假象里的果子从这场梦里抢出来。\n\n可是，当我的剑锋挑开门板的那一时刻，眼前的景象让我彻底定在了原处。\n屋子里透着暖和的光。\n果子坐在桌旁，手里拿着块甜饼，笑得眼角全弯成了月牙。晓枫在帮她擦着嘴边的油渍，雪伊靠在一旁佯装生气地去抢她手里的食物。\n\n那个在现实里遍体鳞伤、夜夜抱着红宝石落泪的小果子，此刻笑得那么干净，那么快活。\n\n那是我从未见过的、真正属于她的笑容。\n\n“果子……”\n我在心里轻声唤着她的名字，手里的长剑重如千斤。\n\n现实里的雪地里停着晓枫和雪伊的冰冷墓碑，现实里的世界充满了血腥与冰寒。如果我现在挥剑斩断这一切，如果我亲手毁掉眼前的晓枫和雪伊……\n果子会重新坠入那个不带体温的噩梦里，她那好不容易露出的笑容，会瞬间碎成粉末。\n\n我真的要把她拖回那个除了绝望以外全空空如也的现实里去吗？\n我真的要亲手剥夺她这独独一份的幸福吗？\n\n小果子看到了我。\n她眼里的笑容瞬间化作了惊恐，她张开双手，用尽全力挡在晓枫和雪伊身前，冲着我大声尖叫：\n“不准伤害我的姐姐们！”\n\n那道刺耳的尖叫声像利箭一样刺穿了我的心。她把试图救她的我，当成了要毁掉她幸福的恶魔。"
 PAM.181.a:0 "……"

 PAM.182.t:0 "失落的剑锋"
 PAM.182.d:0 "雪伊的长枪从小果子身后呼啸着刺了过来，带起凌厉的风声。\n\n我本可以挡下的。我本可以挥剑荡开这柄长枪，然后再去斩断噩梦的锁链。\n\n可是，看着果子那双充满乞求与敌意的眼睛，我的手掌彻底失去了力气。\n\n“如果我赢了……果子的家就没了……”\n“如果我打破了这里……果子就再也不会笑了……”\n\n长枪径直贯穿了我的胸膛，将整片雪地都染成了红色。\n\n我松开了手里的剑，任由长剑铛啷一声掉落。\n\n小果子呆呆地看着我倒下去，眼里全是错愕与迷茫。\n\n我倒在地上，视线开始变得模糊。我看着小果子跑过来的身影，在心里对她露出了最后的笑。\n\n“真好啊，果子……”\n“不要回去了……就留在这个有姐姐们陪着的梦里吧……”\n“哪怕我要永远沉入这片寒冷里……”"
 PAM.182.a:0 "§t（我也绝对不要……亲手毁掉你的笑容……）§!"

 PAM.183.t:0 "风止，花落"
 PAM.183.d:0 "那道骑在马上的冷酷身影倒在了地砖上。\n雪伊姐的长枪贯穿了对方的胸膛，晓枫姐拉着我，把我挡在了身后。\n“结束了，小果子。”雪伊姐吐出一口长气，“那些敢来破坏我们的家的东西，全都被解决掉了。”\n我从晓枫姐身后探出头来。我以为我会看到个可恶的怪物，看到那些从泥土里爬出来的可恨面孔。\n\n掉落在地上的两朵红花旁，是一头比初雪还要白的长发。\n白发被风吹开，那张熟悉又苍白的面孔暴露在了阳光下面。\n\n“……露西莉亚……？”\n我的声音带有慌乱，整个人脑子里一片空白。我扑了过去，摔倒在她身边，伸手想要去按住她胸口上那道可怕的伤口。\n为什么会是露西莉亚？为什么她会骑着马冲进我们的院子？为什么……为什么我让雪伊姐和晓枫姐动手杀了她？\n“对不起……对不起！是我弄错了！露西莉亚！你睁开眼睛看看我啊！”\n我大声哭喊着，手掌被鲜血打湿。\n露西莉亚缓缓睁开了眼睛。那双倒映着天空的红眼睛里，全是温存，找不出一点点恨意与痛苦。她抬起手，用那双带有温度的小手摸了摸我的脸。\n“……果子……别哭啊……”\n她的声音很轻，像是一吹就会散开的风声：“……能看到你……笑得这么开心……真好啊……”\n\n“为什么啊？！”我抱着她的肩膀，眼泪砸在了她的脸颊上，“你为什么要像个敌人一样冲进来？你为什么要向我们挥剑啊？！”\n\n露西莉亚看着我，和站在我身后的晓枫姐和雪伊姐。她露出了一个无比柔和、无比包容的笑容。\n“……因为……我原想……把你从这个梦里拉回去的呀……”\n她的声音带有喘息，可每一个字都像重锤一样砸在我心上。\n“……可是……当我跨过大雾，看到你站在晓枫和雪伊身边……看到你笑得那么踏实的时候……”"
 PAM.183.a:0 "……"

 PAM.184.t:0 "风止，花落"
 PAM.184.d:0 "“……我……下不去手了……”\n“外面的世界……太冷了啊……”\n露西莉亚看着我，眼泪顺着她的眼角流了下来，混进了地上的鲜血里。\n“……晓枫不在了……雪伊也不在了……冰冷的坟墓里……全被死寂与寒冷占据……”\n“……我怎么舍得……把好不容易找到家的果子……再拖回那个冰凉凉的现实里去呢……”\n\n我的呼唤戛然而止，整个人仿佛沉入了冰谷。\n\n“……我知道……如果我向她们挥剑……晓枫和雪伊就会……”\n露西莉亚看着我，眼神里满是深情，与绝望。\n“……所以我放弃了……我还不小心让她们的长枪刺到我了……”\n“但是……如果我毁掉了她们……果子在这个世界上……最后一个温暖的梦……就碎了呀……”\n\n“果子…听话……好吗？”\n露西莉亚将那颗曾经挂在我脖子上的红宝石塞进了我的手心里。\n“……留在这个有姐姐们陪着的梦里吧……”\n“……开心地吃零食……开心地玩耍……平安地长大……”\n\n“不！我不要什么假梦！我要你活着！露西莉亚！你带我走！你带我回现实里去啊！！”\n我用尽全身力气把她抱在怀里。可她的身躯在红光中，开始一点点化作金色的光斑。\n\n“一路上……真是谢谢你呢……我从你身上…学到了……很多…很多我将来能够用到的东西呢……”\n她看着我，用尽最后的力气，对着我露出了灿烂、幸福的笑。\n\n“替我……”\n“替大家……替莉莉安娜……”\n    光芒散落成了漫天的雪花。\n“好好得……生活下去呀……”\n“可以吗……”\n“我喜欢的……小果子……”\n\n我的怀里空了。\n留存着的，只剩下那颗滚烫的红宝石，和满地的白雪与红花。"
 PAM.184.a:0 "§t对不起啊……莉莉安娜。\n拜托你了……果子。§!"
#露西莉亚清醒线
 PAM.1000.t:0 "敲门"
 PAM.1000.d:0 "门外的风吹过石缝，送来了小小的脚步声。\n我把枪托抵在肩窝，顺着门缝透进来的光线瞄准了过去。\n大雾里走来一个披着红斗篷的少女。\n她那黑色的长发垂在肩头，白裙上沾着泥尘，领口那枚红挂坠散着明亮的热意。\n\n“别动。”我压低声音，枪口对准了她，“再往前走一步，我不管你是谁，这把枪都不会留情。”\n\n黑发少女在门槛前停下脚步。她低下头，手指抚过那枚透着光的挂坠，抬起头直视我的眼睛，目光清澈，十分坦率。\n“你的手臂都酸成那样了，还能开枪吗。”她的声音平直而真诚，“我是顺着这颗石头的温度一路找过来的。以为这片海岛早就陷入了沉睡，你却把眼睛睁得这么大。”\n我嚼着嘴里酸涩的果肉，手上的枪口依然不肯放下来：“少废话。大家都睡着了，我要是不睁着眼，谁回去接她们？”\n黑发少女解下肩上的红斗篷，在门旁的台阶上坐了下来，顺手把长剑横放在了膝头。\n“真巧呢。”她抬头望着外面阴暗的天空，“我也和一个人约好了，要在这个夜晚结束前，把真正的太阳带回去。”\n我靠在冰凉的墙角，缓缓落下了枪管。\n这个突然出现的黑发少女，身上带着一股不肯认输的执着。\n“一个人守在这么冷的屋子里，很难受吧。”她转过头看我。\n我把嘴里的果核吐在地上，避开她的视线：“难受也得守着。要是我也闭上眼……晓枫姐和团长她们，就真的醒不过来了。”\n黑发少女手按剑柄，迎着门外呼啸的风，语气坚定：\n“那么，等这场大风停下来，我和你一起走。”"
 PAM.1000.a:0 "§t“这次……我们在一起回去！”§!"

 PAM.1001.t:0 "风声里的名字"
 PAM.1001.d:0 "海风吹拂着石屋的门扉。\n露西莉亚把佩剑倚在石壁旁，在对面坐下，揉着走累了的脚踝。\n\n我从布包里拿出残留的青果，递了过去。\n“要吃吗？这个很酸哦。”\n\n露西莉亚接过去，咬了一口。酸涩的味道让她整张脸都皱了起来。\n看到她这副困扰的样子，我忍不住笑了。\n“都说了会很酸嘛。”\n“真的好酸呢……”露西莉亚咽下果肉，眉眼间浮现出柔和的笑意，“不过，咀嚼到最后，却留着一股甜甜的味道。”\n“小果子……为什么会有这样的名字呢？”她问。\n我咬着手里的果实，回想着过去：“被大家救上岸的时候，我一直抱着一颗坏苹果不肯松手。团长就给我起了这个名字了。”\n我望向她领口透着亮光的红挂坠：“那你呢？穿着白裙子，披着红斗篷，怎么看都不像是个正规的骑士呢。”\n露西莉亚低下头，触碰着领口的红挂坠，目光变得柔和起来。\n“是一位温柔的公主殿下为我准备的。她希望我握着剑，守护这个世界上所有人的笑容。”\n“那……那位公主现在在什么地方呢？”我问。\n露西莉亚望向门外的大雾，停顿了许久。\n“她留在了过去的时间里。我和她做好了约定，要在夜晚过去以前，把太阳带回去见她呢。”\n石屋里恢复了宁静。\n看着她单薄的身影，我忽然理解了她眼里的执着。\n我们都在为了某个重要的人，在这个寒夜里坚持着。\n我把最后一颗青果放进了她的手心。\n“这个留给你。以后要是想念那位公主了，就咬一口。尝到了酸味，就顾不上掉眼泪了。”"
 PAM.1001.a:0 "§t“其实……嚼到最后，真的挺甜的呢。”§!"

 PAM.1002.t:0 "我们会从风雪中逃离这个世界"
 PAM.1002.d:0 "我站起身，整理好挂在肩上的枪带。\n\n原本打算等风停下来就立刻赶回营房。可走到门边上时，我的步子却停住了。\n\n事情很奇怪。\n那天在大雪里，晓枫姐拼命踩着油门带我逃跑。到了岸边，她把生路留给我，自己却走进了厚重的大雾里。\n她那时候对我笑了，叫我走，去有温度的地方。\n为什么晓枫姐要让我逃走呢？\n如果大家睡着了，我明明可以留下来帮她。她那么聪明，怎么会平白无故叫我一个人走？\n晓枫姐当时的神情，倒像早就知道自己再也醒不过来了。\n\n“你在想晓枫为什么让你逃走，对吧。”\n露西莉亚的声音从旁边传了过来。她靠在墙边上，目光落在我脸上。\n\n我转过头看她，眉头拧在了一起：“你到底知道些什么？晓枫姐和团长她们到底怎么了？”\n\n“哪怕你现在赶回去摇晃她们的肩膀，她们也醒不过来的。”露西莉亚语气平静又带着认真，“因为把她们困住的，是夜莺的梦境。”\n\n“夜莺？”我困惑地重复着这个词，满脑子全是疑问，“鸟吗？鸟怎么能让人睡着？那到底是个什么东西啊？”\n\n“那不是普通的鸟。”露西莉亚碰了碰领口的红挂坠，“那是掌管着这片大地沉睡的源头。她给每个人编造了一个安稳的童话，把大家的痛苦与眼泪全部收走了。”\n\n露西莉亚站起身，走到我面前直视着我：\n“回去叫醒她们，早就解决不了问题了。我们要去面对的，是夜莺本身，是这场笼罩在所有人头顶的梦境。”\n\n我握着枪托，虽然满脑子依旧全是疑惑，可露西莉亚那双认真的眼睛，让我心底的慌乱平复了下来。"
 PAM.1002.a:0 "§9“走吧，去见识见识那个‘夜莺’！”§!"

 PAM.1003.t:0 "大雾里的回忆"
 PAM.1003.d:0 "走在结霜的街道上，风吹在脸上针扎一样疼。露西莉亚走在我身侧，红色斗篷在风里翻飞。\n我低头盯着自己踩在枯草上的鞋子，终究还是忍不住开口了。\n\n“露西莉亚。”\n“嗯？我在听呢。”\n“梦境到底是什么？我们要怎么做，才能把它打碎？”\n\n露西莉亚按着腰间的长剑，目光望向远处浓重的迷雾。\n“那是夜莺用所有死者的执念织成的牢笼。她害怕大家再受伤害，就把苦难全封存了起来，给每个人造了一个永远不用挨冻受难的幻影。”\n“要打破它，就得找到那颗维持着整座国度的心脏，亲手将它点亮。”\n\n我听着她的话，心口沉重得透不过气来。\n\n“那我呢？在进到这个梦里以前……我到底经历了什么？”\n我停下脚步，转头看向她。脑海里的那些记忆全蒙着一层灰尘，想抓却抓不住。\n“晓枫姐和雪伊姐……我们以前到底怎么了？”\n\n露西莉亚转过身看着我，神情里满是复杂的温和与沉重。\n“野火……在最后的阵地上失败了。”\n露西莉亚的声音字字落进风里：\n“黑色的亡灵扑灭了所有的防线。晓枫和雪伊浑身是血，用最后的力气挡在敌人跟前，把你送进了南方的火地岛。”\n“她们拼上一切，要你逃去安全的地方活下去。”\n我愣在原地。\n那些碎裂的火光、晓枫姐推开我时的笑容、雪伊姐染血的背影……在这一刻全部撞回了脑海深处。\n\n原来大家从来不会抛下我。\n我是被姐姐们用命托举出来的火种。\n\n眼泪落在泥土里，我擦了把鼻子，抬起胳膊抹掉脸上的泪水。\n“原来是这样啊……”\n我按住手里的长枪，抬头看向露西莉亚，声音虽然哽咽，却无比坚定：\n“我们快点走吧，露西莉亚。”\n“我要把姐姐们交给我的这把火，带去大雾最深处。”"
 PAM.1003.a:0 "§9“我是野火的孩子……我绝对不能停下！”§!"


  PAM.1004.t:0 "恶劣的玩笑"
  PAM.1004.d:0 "殿深处飘着不知从何而来的花香。\n\n夜莺坐在高处，两条腿悬空晃着，歪着头注视我们。她的眼里亮着幽紫的光芒，神情显得异常平静。\n\n“走得气喘吁吁的，真能干呢，小果子。”\n她拍了拍手，语气很轻巧：\n“跑了这么远的路，是打算把晓枫和雪伊叫醒吗？”\n\n我停下脚步，仰头盯着她：“把她们叫醒。晓枫姐答应过要等我，我要带她们回营房。”\n\n夜莺扑哧一声笑了出来，眼神里带着居高临下的戏谑：\n“小果子真是个天真的孩子呢。”\n“你真以为她们安稳地睡着了吗？”\n\n我站在原地看着她。\n\n“那场大雪里，晓枫胸口中了重伤，雪伊脖子上裂开了致命的伤口。”\n夜莺托着腮，继续说道：\n“流了那么多血，人当场就该咽气了呀。”\n“是我把时间冻结了哦。是我用这片沉睡，把她们快要死掉的身体强行保住了呢。”\n“梦境一旦碎裂，停滞的时间重新转动，她们身上的伤口就会立刻涌血，在痛苦里彻底死去哦。”\n“你费尽力气要唤醒她们……实际上，是在亲手催促她们走向死亡呢。”\n\n我的耳朵里嗡的一声，脑子里乱成一团，手心冰凉一片。\n我站在原处，连呼吸都忘了。\n我这一路拼命赶路，到底是在救她们，还是在把她们推进死路？"
  PAM.1004.a:0 "……"

  PAM.1005.t:0 "恶劣的玩笑"
  PAM.1005.d:0 "看着我呆立的模样，夜莺突然拍着手大笑了起来。\n\n“噗呼……骗你的啦。”\n她擦了擦眼角笑出来的泪花，语气随意得像在谈论天气：\n“瞧你吓成那副模样，真好玩呢。她们伤得是挺重，但还不至于一睁眼就死掉哦。我不过是想看看，你在绝望的时候会露出什么表情罢了。”\n\n我抹掉脸上的冷汗，往前迈了一大步，直视着这位高处的造梦者。\n我既没大喊大叫，也没哭着骂她，平静地开口：\n\n“你真够无聊的呢。”\n\n夜莺的笑容收敛了一下。\n\n“不管你刚才说的是真是假……”\n“就算是真的，我也要把她们叫醒。大不了，我和她们一块死在外面的大雪里。”\n“像个死人一样被你冻在梦里，算什么活着？”\n“你这种怪物，根本什么都不懂。”\n\n话音刚落，露西莉亚走到了我身边，站在了我身侧。\n\n四周的迷雾传出清脆的裂响。\n这片由捉弄构筑的梦境，在夜莺错愕的注视下，开始崩塌了。"
  PAM.1005.a:0 "§9“醒过来吧……大家都在等着呢！”§!"

  PAM.1006.t:0 "别让歌声停下来"
  PAM.1006.d:0 "眼前的光芒散开时，耳边传来的，是一阵带着哭腔的微弱歌声。\n\n那是一首断续的摇篮曲。\n歌声在殿里回荡着，调子全乱了。跪在祭坛前的那个少女，正一边咳嗽着，一边拼命地唱着。\n\n她是莉莉安娜。\n是那个时候的莉莉安娜。\n\n四周的寒雾里满是躁动的亡骸。它们在哭泣，在哀嚎，可少女单薄的歌声，再也抚平不了这片大地的悲伤。\n她太累了。她跪在冰冷的地板上，像快要消散了然后死掉了一样。\n\n“睡吧……快睡吧……”\n莉莉安娜的声音哑得不成调，带着孩童般的无助：\n“求求你们了……不要再难过了……快睡吧……”\n\n可冰冷的亡魂依然在向她逼近。\n\n露西莉亚快步跑了过去，张开双臂护在了她的身前。领口那枚红色挂坠在昏暗中透出明亮的光晕，逼退了四周翻涌的寒意。\n\n看着面前那个替自己挡下所有寒风的背影，莉莉安娜抬起头，那双满是泪水的冰蓝色眼眸里，全是茫然。\n她还不认得露西莉亚。\n对她而言，眼前这个人，不过是个陌生的过客。\n\n“……你……”莉莉安娜喘着气，声音带有恐惧，“……你是谁呀……”\n\n露西莉亚回过头看着她。\n那双红色的眼睛里盛满了跨越了千万个故事的感情与痛楚，可露西莉亚开口时，语气却温柔得像在哄一个受惊的孩子：\n“我是你的骑士哦，莉莉安娜。”\n\n我也跑了过去，在莉莉安娜身边蹲下来，握住了她那双冰凉的手掌。\n“还有我呢。”我抹掉脸上的灰尘，对着她用力笑了笑，“别怕，我们来陪你把这首歌唱完。”\n\n祭坛四周的喧嚣，在这一刻平息了下来。"
  PAM.1006.a:0 "§9“这一次……谁也不用孤单地面对黑夜啦！”§!"

  PAM.1007.t:0 "我们在风暴前交汇"
  PAM.1007.d:0 "山梁上传来了熟悉的号角声。\n\n小果子趴在窗台前，望着远处升起的红色旗帜，神情满是担忧。\n\n“那是晓枫姐和雪伊姐……她们刚刚平定了索拉娜，现在带着大家往这边赶过来了。”\n小果子回过头，声音里满是焦虑与心疼：\n“雪伊姐性子那么急，晓枫姐又总是把所有沉重的事情揽在自己身上……她们以为这片土地也是吃人的魔窟，正准备全军压上来呢！”\n\n靠在窗边的莉莉安娜眼眸里盛着水光与依恋。\n\n“索拉娜……带走了我的心脏。”\n莉莉安娜的声音很轻柔，字字都是对那个人的挂念：\n“她想带着那团光去照亮人间，我就让她拿走了。可那些落在这片土地里的执念与不甘，却都跟着醒了过来。它们是大家留存在世间的思念……外面的大家……一定以为我也是带来灾祸的怪物吧。”\n\n露西莉亚走上前，将手掌贴在莉莉安娜冰凉的面颊上。\n带着无数次故事的记忆，露西莉亚注视着眼前这个让人怜惜的少女，神情充满着爱而安宁。\n\n“你已经做得很好了，莉莉安娜。”\n露西莉亚替她理好散落的长发，语气平稳：\n“你替索拉娜守了这么久的安息，接下来的事情，交给我吧。”\n\n小果子也跑了过来，握住莉莉安娜的手掌：\n“对！晓枫姐虽然严厉，但她最讲道理了！雪伊姐虽然爱训人，可心肠比谁都软！我去跟她们把话说明白，绝对不让大家打起来！”\n\n露西莉亚看着小果子认真的面孔，露出了笑意。\n\n“晓枫和雪伊在保护活着的人，莉莉安娜在安抚留下的思念。”\n露西莉亚拉起小果子的手，迈步走向大门：\n“大家全在拼命爱着这个世界。小果子，我们去把所有人接回家。”"
  PAM.1007.a:0 "§t“去把真相带给所有人！”§!"

  PAM.1008.t:0 "呼唤"
  PAM.1008.d:0 "对面的山梁上布满了整齐的战阵。\n\n眼看部队就要展开攻势，小果子快步跑到开阔的高地上，拼命挥动着双臂呼唤：\n“雪伊姐！晓枫姐！快停下！是我啊！我是小果子！”\n\n防线后方传出一阵骚动。雪伊看清了那个身影，当即冲着身边的传令官喊道：\n“全体停火！把武器放低！谁也不许动手！！”\n\n原本要推进的队伍迅速按下了动作。\n\n小果子拉着露西莉亚穿过两军之间的空地，赶到了雪伊和晓枫跟前。雪伊一把拉住小果子的胳膊，眼神里满是难以置信的震惊与慌乱：\n“小果子？！你怎么会从夜莺之国里跑出来？！晓枫明明把你留在了后方的营地里，你怎么会跑到对面的阵地去？！”\n\n晓枫快步走上前，目光在小果子与露西莉亚之间巡视，语气满是惊愕与严肃：\n“我们明明确认你在后方安全的地方。你怎么会穿越防线，站在对面的阵营里？这位同行的人又是谁？”\n\n小果子抹掉额头上的汗水，急切地解释：\n“夜莺之国里的人不是敌人！那些复苏的残魂是这片土地的思念，莉莉安娜已经拼尽力气把它们安抚下来了！”\n\n雪伊眉头深锁，语气里满是不解与责备：\n“你说不是敌人？索拉娜倒台后，夜莺之国就涌出了无数危险的怪物！身后的战士们全做好了战斗准备，你现在要我们相信对面的存在全是无害的？这种事情怎么可能轻易相信啊！”\n\n小果子挡在露西莉亚身前，语气急切又笃定：\n“莉莉安娜一直在承受痛苦，她是受害者啊！如果你们现在进攻过去，就会伤害到无辜的人！”\n\n雪伊还要开口，晓枫伸手拉住了她。晓枫注视着小果子眼里的执着，又看向神情平静的露西莉亚。\n\n“身后的队伍不可能单凭一句话就撤退。”晓枫沉声下达了命令：\n“传令前锋就地转入防御，暂缓进攻。小果子，你和这位朋友随我回指挥部，把事情当面说清楚。”"
  PAM.1008.a:0 "§9“我们把事情全说清楚！”§!"

  PAM.1009.t:0 "重逢"
  PAM.1009.d:0 "掀开指挥部的厚布帘子，屋里点着明亮的油灯。\n\n我刚走进去两步，整个人却定在了原地。\n\n桌子边上坐着一个熟悉的身影。\n那是木棉团长。\n她正披着毛毯，低头翻看着桌上的报告。\n\n“木……木棉团长？！”\n我叫出声来，连声音都在变调。\n“团长？！你……你怎么会在这里啊？！”\n\n木棉团长听到喊声抬起头，看到是我，脸上露出了温暖的笑容：\n“小果子？你可算回来了，跑去哪里玩了呀。”\n\n我冲过去抓住她的手掌。那是温热的体温，带着真实的心跳。\n“可……可是在营房的时候，大家以为你被索拉娜下毒害死了啊……”\n\n雪伊走上前，敲了一下我的脑袋，语气带着责怪，眼里却满是庆幸：\n“索拉娜懂得什么药理？她偷拿的根本就是过量的安眠药！团长昏睡了很长一段时间，索拉娜倒台后，军医帮着调理，团长前两天就醒过来了。”\n\n晓枫也走了过来，递给木棉团长一杯温水，对我说：\n“我们以为你在后方歇着呢，没想到你跑到山谷那边去了。”\n\n木棉团长揉了揉我的头发，随后望向身旁的露西莉亚：\n“好啦，小果子平安回来比什么都好。现在，能跟我们说说这位新朋友，还有山谷里的事情了吗？”\n\n看着眼前安然无恙的团长，看着身边的晓枫姐与雪伊姐，我心里的委屈与疲惫全都消散了。"
  PAM.1009.a:0 "§9“太好啦……团长你还活着！”§!"

  PAM.1010.t:0 "戒备"
  PAM.1010.d:0 "油灯的光芒依然照着屋里的几张面孔。\n气氛冷峻无比，谁也没能轻易放下防备。\n\n雪伊双手抱胸，目光锁定在露西莉亚身上：\n“你说山谷里的骚动全是索拉娜夺走心脏引起的？你说那些暴走的怪物是留存的思念？可就是那些东西，刚才在阵地前打伤了我们好几个战士！你凭什么要我们相信你？”\n\n露西莉亚立在桌前，神情沉静如水：\n“莉莉安娜为了安抚暴动的残魂，早已耗尽了所有的心力。强行用重炮轰击山谷，除了激化那些痛苦的执念以外，根本解决不了任何问题。”\n\n晓枫终于开口了：\n“就算你说的是实情，在侧翼留下一个随时可能暴乱的源头，也是战术上无法容许的风险。我们身后站着无数百姓与伤员，绝不可能把所有人的安危押在一个外来者的保证上。”\n\n“晓枫姐！雪伊姐！”\n小果子急忙挡在露西莉亚身前，语气急切：\n“露西莉亚一路护着我走过来，她要是心怀恶意，早就动手了！你们信我一次好不好！”\n\n一直沉默的木棉团长抬起头。\n她放下手中的报告，注视着露西莉亚：\n“露西莉亚小姐，你既然声称为了守护而来……那你拿什么保证，对面的那位莉莉安娜，往后不会成为第二个索拉娜？”\n\n屋里彻底陷入了安静。\n\n露西莉亚直视着木棉团长审视的眼睛，开口回答：\n“我拿我自己做抵押。”\n“在事情弄清楚以前，我留在你们的阵地里做人质。小果子带你们去见莉莉安娜。但凡对面有任何危害大家的举动，你们随时可以处置我。”\n\n晓枫与雪伊对视了一眼，眼里的敌意终于收敛了少许。\n误会并未就此消解，但通往对话的缝隙，总算在坚硬的防线前艰难地敞开了一角。"
  PAM.1010.a:0 "§t“好……我们去见莉莉安娜！”§!"

  PAM.1011.t:0 "意料之外的相聚"
  PAM.1011.d:0 "推开厚重的房门，原本预想中的惨烈景象全都不见了踪影。\n\n屋子里点着柔和的光芒，温暖得让人以为走错了地方。我带着晓枫姐跨进门槛，眼前的景象却让我们定在了原地。\n\n莉莉安娜好端端地坐在椅子上。而在她身旁挨着坐着的，正是野火在大雨里拼尽全力打倒的暴君——索拉娜。索拉娜缩在宽大的衣服里，嚼着干果，看起来居然温顺得出奇。\n更让人心惊胆战的，是坐在她们对面的那个人。\n\n那是……夜莺。\n她晃悠着双腿，正歪着头带着恶作剧得逞的笑容注视着我们。\n\n“哎呀，重要的客人们终于到齐了呢。”\n夜莺拍了拍手，语气欢快又透着神明特有的漫不经心：\n“晓枫以为自己在讨伐暴君，雪伊以为自己在替同胞复仇，莉莉安娜一心想放索拉娜去当太阳，而小果子呢，一路拼了命地想把大家都叫醒。”\n\n晓枫按住随身的配枪，目光在索拉娜和夜莺之间来回巡查，神情沉重到了顶点。\n“你到底在谋划什么？”晓枫沉声开口。\n\n夜莺托着腮，满脸笑意地看着晓枫：\n“我什么都没谋划哦。我不过是把大家的执念、仇恨与不甘，全都收拢到了同一个屋檐下罢了。如果让你们在外面盲目地厮杀、流血、互相毁灭，那该是多么俗套又乏味的结局呀。可现在呢？看看你们彼此脸上的表情，是不是比任何编出来的故事都要精彩得多？”\n\n“索拉娜……你为什么会和夜莺呆在一起？！”我忍不住喊了出来。\n\n索拉娜斜了我一眼，冷哼一声别过头去，可她抓着莉莉安娜衣服的手掌却暴露了内心的慌乱。莉莉安娜握住索拉娜的手，抬头看向我们，眼神里满是恳求与温柔。\n\n夜莺站起身，在屋子中央转了个圈，语气轻柔又残忍：\n“看吧，所有的仇人、所有的同伴、所有的受害者，现在全都在这里了哦。”\n“接下来，是握手言和，还是当着彼此的面兵刃相见呢？我可是相当期待呢。”"
  PAM.1011.a:0 "§9“你这个把大家当成玩偶的恶劣家伙……”§!"

  PAM.1012.t:0 "我们的故事"
  PAM.1012.d:0 "夜莺在椅子上换了个舒服的坐姿，手托着下巴，满脸笑意地看向我。\n\n“对了，小果子。”\n她的声音像在讲睡前的趣事：\n“你还记不记得，先前我跟你提起过……晓枫和雪伊受了致命的重伤，差点死在雪地里？”\n\n我拉住晓枫姐的衣服，戒备地盯着夜莺。\n\n“路上的时间里，露西莉亚是不是也这样对你说了呀？”\n夜莺歪了歪头，眼里闪动着狡黠的紫芒：\n“她告诉你，野火全军覆没，晓枫和雪伊拼死把你送去了南方。她甚至还替你掉了好些眼泪呢，对不对？”\n\n晓枫按住我的肩膀，目光平静地看向夜莺，沉稳开口：\n“你想表达什么？”\n\n“我想说的是，露西莉亚可一句谎话都没说哦。”\n夜莺摊开双手，语气轻柔又残忍：\n“在她经历过的那个故事里，你们确实浑身是血地倒在了大雪里，小果子确实哭哑了嗓子，一个人绝望地漂向了大海。”\n“而在现在的篇章里，因为大家都做出了不一样的选择，晓枫好端端地站在这里，雪伊也安稳地带着队伍。”\n\n夜莺站起身走到我们跟前，俯下身注视着我的眼睛：\n“同样的人，却在不同的篇章里迎来了截然相反的命运。小果子，你觉得哪一边才是真实的呢？”\n\n胸口像被重物砸了一下。\n那些在路上听到的痛苦回忆，原来全是露西莉亚亲身经历过的悲剧。露西莉亚背负着那个世界所有的伤痛，跨过大雾走过来，就是为了阻止那个死别的结局在这边重演。\n\n我握住晓枫姐的手掌，抬起头直视夜莺：\n“过去的篇章我不管。站在这里的晓枫姐是真的，在外面等着我们的露西莉亚也是真的。我选现在这个！”"
  PAM.1012.a:0 "§9“这次……我们谁都不会死！”§!"

  PAM.1013.t:0 "我们的故事从未结束"
  PAM.1013.d:0 "屋里一片祥和，不见任何刀枪相向的凶险。\n\n夜莺站在窗前，任凭晨光洒在她的裙边。她转过身，神情里满是愉悦与探究：\n“世人都以为，那些游荡在大雪里的躯壳是死去的人变化而来的。真是庸俗的猜测呢。”\n\n她抬起手，掌心流淌出金色的碎光：\n“它们全由我亲手塑造。我收集世间所有人留存的不甘、欢笑与眼泪，注入那些玩偶里。我所追求的，是打造出真正完美的存在——就像莉莉安娜当初创造出露西莉亚那样。”\n\n“完美需要温度，而温度源于活人的七情六欲。”\n夜莺走向我们，眼里的紫芒深邃：\n“我给索拉娜野心，给野火反抗的理由，给小果子一段穿过大雪的险途。我想亲眼看看，当绝望压下来的时候，人类那些可怜又耀眼的理想，到底会被碾成灰烬，还是会烧出更夺目的光彩。”\n\n晓枫与我对视了一眼，握着我的手掌更用力了些。\n\n“可是你们呢？你们接连打破了我定下的结局。”\n夜莺环视着屋里的每一个人，笑容里带有孩童般的惊叹：\n“小果子抛下了仇恨，晓枫按下了开火的指令，索拉娜放下了执拗，莉莉安娜抚平了残魂。你们这群执着的人，竟然靠着彼此的信任，在这片冻土里开出了真正的花朵。”\n\n“我终于明白了呢。”\n夜莺退后了两步，对着我们所有人行了一礼：\n“真正完美的造物，是明知前路布满伤痛，却依然想要牵住彼此的凡人。”\n“这场长卷不需要我来收尾了。”\n\n她身上的雾气随着晨风平缓消散，声音空灵而真挚：\n“去拥抱属于你们自己的晨光吧。属于你们的故事，从来都不会结束哦。”"
  PAM.1013.a:0 "§9“这就是，属于我们的明天吗？”§!"

  PAM.1014.t:0 "终幕"
  PAM.1014.d:0 "风停了。\n\n夜莺那具正要消散的身躯，在空中停顿了下来。\n她的肩膀剧烈耸动起来，接着，一阵清脆的笑声穿透了大厅。\n\n“嗯哼……噗哈哈哈哈……”\n她放下了手，眼里的温和褪去，换成了纯粹的兴奋与戏谑：\n“你们该不会真以为……几句感人肺腑的真心话，就能让神明感动得落泪吧？”\n\n晓枫立刻伸手把我护在身后，整间屋子的空气瞬间冷凝成霜。\n\n夜莺悬在上方，居高临下地俯瞰着我们，眼神像在欣赏一幅刚画完的绝世画作：\n“仇恨与厮杀太低级了。世上到处是死在泥潭里的粗鄙剧目。可你们瞧瞧现在的你们——仇敌握手言和，受害者放下执念，迷路的孩子找到了依靠。”\n“多么圣洁、多么美丽的‘大团圆’呀。”\n\n她张开双臂，身后的墙壁如落花般剥落，显露出外面那片正在崩塌的虚空：\n“我从来不求你们变成听话的玩偶。我想要的，正是这团在绝境里烧红的、名为‘爱’与‘希望’的火苗啊。”\n“因为啊，在满怀仇恨时死去，无非是带着怨毒咽气罢了。”\n“可在拥抱了所有的温暖、原谅了所有的敌人、以为终于迎来黎明的一刻——再把这个世界彻底捏碎……”\n\n夜莺低下头凝视着我，语气甜美得让人浑身刺痛：\n“那种由爱意跌落进绝望里的滋味……才是全天下最香醇的美味哦。”\n\n外面的天空正在被金色的烈焰吞没，大地在脚下一步步瓦解。\n眼前的黎明，竟然成了整个国度终将毁灭的倒数。\n\n夜莺在崩裂的天空下拍着手，宣告了真正的终结：\n“来吧，我的主角们。在你们珍视的明天化为灰烬以前，让我看看你们能挣扎到哪一步吧！”"
  PAM.1014.a:0 "§R“……把这里的一切，还给我们！！”§!"

  PAM.1015.t:0 "致我亲爱的人类"
  PAM.1015.d:0 "金色的碎芒在虚空里散落开来。\n\n夜莺的身躯正化作透明的光点。她注视着站在面前的我们，眼眸里全是一如既往的审视与探究。\n\n“真是意外的结局呢。”\n她抬起手，任由光尘从手指间滑落，唇边带着柔和的弧度：\n“你们一定在心里把我当成了十恶不赦的恶人吧？不用否认哦，我本就是个任性又残酷的神明。给你们带来那么多的苦难，甚至诱导索拉娜做出那些伤天害理的事情……全是我一手促成的呢。”\n\n“因为人类这种存在，实在太有趣了啊。你们是一群充满自相矛盾的生灵。我想亲眼看看，当绝望彻底压下来的时候，你们胸膛里那些脆弱的念想，到底会被踩成泥尘，还是会挣扎出别的模样。”\n\n夜莺垂下眼帘，看向缩在旁边的索拉娜：\n“索拉娜，你自封为凶残的野狼，做尽了暴虐的事。可你心底分明藏着一颗渴望被在乎的赤子之心。你太愚蠢了，因为害怕被抛弃，就抢先一步用暴力把世界踩在脚底下，甚至把深爱你的莉莉安娜也拖进了苦海。”\n\n她随后把视线移向了晓枫：\n“晓枫，你自以为是那个冷静的掌舵人。可骨子里，你充斥着傲慢的个人英雄主义。你总想把所有的重负、所有的罪责全揽在自己一人身上，把同伴当成需要被庇护的弱者，独揽大局，沉醉于独自赴死的悲壮。”\n\n接着，夜莺的目光落在了我身上：\n“还有小果子。你自以为坚韧不拔，其实不过是个依附在别人期望里的可怜虫。你根本不敢面对自己真实的内心，盲目顺着死者的嘱托与口令往前跑。一旦脱离了那些姐姐们给你的条条框框，你空虚得连属于自己的方向都找不到。”\n\n晓枫姐与我被这席话说中了心事，整个人沉静了下来。"
  PAM.1015.a:0 "§t“……把你想说的话说完。”§!"

  PAM.1016.t:0 "致我亲爱的人类"
  PAM.1016.d:0 "夜莺把目光转向了雪伊姐：\n\n“雪伊，你口口声声宣称要替死去的姐妹复仇，成天叫嚣着要把敌人撕碎。可你其实是在逃避。你害怕停歇，害怕平静，因为但凡战火平息，你就不得不去面对同伴早就逝去的寂静。你宁可用无休止的暴怒去填补空洞，也不敢承认自己有多无力。”\n\n最后，夜莺望向了站在一旁的莉莉安娜：\n“莉莉安娜，我的小公主。你懦弱得令人怜惜。你不敢直视背叛与鲜血，蒙起双眼躲进虚妄的纯洁里，以为凡事祈求希望就能装作灾祸从未降临。”\n\n她环视着我们，虚幻的身影在晨风里飘散开来，眼神变得无比温存：\n“傲慢、暴虐、依赖、逃避、伪善……你们身上全是不堪入目的缺陷呢。”\n“剥离了这些，你们不过是一堆不会动弹的雕像而已。”\n“但正是这群满身破绽、自私愚蠢的残次品，居然能在黑夜里互相搀扶着彼此，硬撑着站到了我的眼前。”\n\n夜莺走到我们面前，伸出近乎透明的手掌，在莉莉安娜与露西莉亚的额头上依次轻抚过去。\n那份触碰轻柔得如同一片雪花，带着神明母亲般的深情：\n“你们受了好多苦，也流了好多眼泪呢。”\n“去吧，去过你们吵闹、笨拙、却真正有温度的生活吧。”\n“我会暂时沉睡一阵子。等漫长的岁月过去，当我在未来的某个清晨再次醒来时……可别让我看到你们把好不容易争来的家园给弄丢了哦。”\n\n她对着我们所有人露出了柔美而释然的笑容：\n“晚安，我深爱的、可爱的人类。”\n\n夜莺的身影彻底化作了漫天光华。\n晨光洒落，长夜在这一刻真正平息了。"
  PAM.1016.a:0 "§9“哪怕你再醒来……我们也会守住这个家的！”§!"

  PAM.1017.t:0 "我们并肩同行"
  PAM.1017.d:0 "军营里点着几盏明亮的灯，所有人都围在了桌旁，眼前的光景若是放在从前，任谁也无法想象。\n\n索拉娜坐在长凳子的一侧，莉莉安娜挨在她的身旁。而在桌子的另一端，露西莉亚安静地注视着索拉娜。\n按理说，两人同源于同一份思念，本该在相遇时互相湮灭。可因着夜莺留下的特殊力量，她们却奇迹般地一同留在了世间，彼此的面孔在灯火下清晰可见。\n\n索拉娜别过头去，语气依然带着傲气：\n“看我做什么。等打垮了那个自以为是的夜莺，我可不会对你客气。”\n莉莉安娜拍了拍索拉娜的头，对露西莉亚露出了带有歉意的笑容。\n露西莉亚摇了下头，眼神温和：\n“能看到你安然无恙地坐在这里，比什么都好呢，索拉娜。”\n\n晓枫拿起桌上的纸张，把大家的视线拉回了眼前：\n“夜莺的核心在风暴正中心。那里的死气会冻结一切意志，光靠正面冲撞很难靠近。”\n\n雪伊抱起手臂，语气干脆：\n“我带着一部分队伍负责在外围撕一道缺口出来。”\n\n“我负责护在最前面。”露西莉亚注视着大家。\n\n“我也去！”小果子挺起胸膛，眼神明亮，“我们一个都不能少！”\n\n木棉团长看着这群各怀执着的姑娘们，面带微笑。曾经的对手、走散的同伴、跨越故事而来的骑士，如今全都在这里找到了容身之处。\n\n大家全都在这里。面对那个玩弄命运的造梦者，我们拥有世间最温暖的力量。"
  PAM.1017.a:0 "§9“出发吧！”§!"


  PAM.1018.t:0 "属于所有人的清晨"
  PAM.1018.d:0 "推开窗户的时候，清晨的阳光正洒在庭院里。\n\n庭院里已经传来了热闹的说话声。\n\n木棉团长正披着毛毯坐在走廊边上，满脸欣慰地看着眼前喧闹的一切。\n\n晓枫姐坐在木桌旁，正把一叠规划纸分门别类地排好，神情从容；雪伊姐挽起袖子，催促着工人们检查车间的机械；索拉娜嘴里依然在嘟囔着嫌吵，却已经提着工具准备去田地里开荒；莉莉安娜抱着一盒花种，面带笑意地给路过的孩子们递过洗净的甜果；露西莉亚则立在门旁，朝我伸出了手。\n\n所有人都放下了过去的苦难，在这个真实的清晨里忙碌了起来。\n\n“小果子，醒啦？”木棉团长抬起头，冲着我招手，“快去洗把脸。晓枫和雪伊等了你好些工夫呢。”\n\n“新城区的规划、工坊的复工、学校的开课、田地的春耕……需要做的事情多着呢。”晓枫姐也跟着抬起头，目光温和。\n\n“我们一起去吧！”我快步跑出屋门，站在了大家中间。\n\n黑夜彻底过去了。\n\n这片由我们所有人共同守护下来的土地，正等待着我们亲手写下新的篇章。"
  PAM.1018.a:0 "§9“早安！大家一起把家园建好！”§!"

  PAM.1019.t:0 "关于明天的争论"
  PAM.1019.d:0 "屋子里吵成一片，关于工具分配与街道修缮的事情，大家各执一词，谁也不肯让步。\n\n索拉娜靠在椅子上，听得满脸烦躁，忍不住敲了敲桌面：“喂喂喂喂喂，我说你们到底吵够了没啊。烦得很，谁不听话就揍谁一顿不就行了，省得在这儿听你们磨叽。”\n\n雪伊坐在对面，横了她一眼：“你闭嘴吧。要是揍人管用，当初你那傻不拉几的王位就不会被我们推倒了好不好。”\n\n“哈？！你再说一遍试试？”索拉娜瞪起眼睛就要起身。\n\n“那个……索拉娜，别上火呀。”莉莉安娜急忙拉住索拉娜的袖子，劝着，“大家……大家要是能互相包容，温柔相待，这样不就很好吗？”\n\n晓枫按了按额头，看着她们叹了口气：“要是温柔能把漏水的水管修好、把过冬的口粮算清，我们今天全都可以回去睡大觉了呢。”\n\n原本吵闹的众人被这几句话逗得面面相觑，连索拉娜也憋着气坐了回去。\n\n木棉团长站在门边笑了起来：“行啦。说到底，立个管事的准则，无非是挑几个靠得住的人出来替大家分忧、把漏风的屋顶补好罢了。晓枫，把拟好的条文给大家念一遍吧。”\n\n晓枫收敛笑意，将手里的纸张转向众人：\n“工坊由工人自主掌管，街区事务由各处推选代表商量。物资由公社统筹储备防备荒年，日常生计全由平民自由做主。”\n\n大家听完，屋里的争执终于平息了下去。\n在彼此的争吵与打趣中，这套新秩序真正落到了每个人的心坎上。"
  PAM.1019.a:0 "这是属于我们的生活呀！"

  PAM.1020.t:0 "草药"
  PAM.1020.d:0 "由于当年过量安眠药剂的残余毒素，木棉团长的头部损伤严重，眩晕与四肢乏力依然时常困扰着她。\n\n门被推开了。\n索拉娜提着一个装满草药的木盒走了进来。她把木盒往桌上一放，眼神飘向别处，语气硬邦邦的：\n“这是按夜莺书房里留下的手稿找来的药草。大夫看了方子，说熬煮后服下，能化解沉积的残药，往后头晕就会好很多。”\n\n屋里的大家都看着她。\n\n索拉娜抓了抓头发，别过脸去嚷嚷：\n“看我做什么！当初是我下药害得她昏睡过去了，这回由我去采药，理所应当！”\n\n木棉团长看着索拉娜别扭的模样，忍不住笑出了声。她招了招手，示意索拉娜走近一些。索拉娜犹豫了一下，还是挪步过去。木棉团长拉过索拉娜粗糙的手掌，拍了拍：\n“肯跑去山林里采药，说明你这头小野狼终于懂得怎么去关照同伴了呢。”\n\n索拉娜被说中了，耳根通红，却任由团长拉着手，没有丝毫甩开的意思。\n\n晓枫端来熬药的砂锅，对众人说：\n“夜莺留下的手记虽然详细，可身体调理需要时间。大夫叮嘱过，除去按时服用草药外，团长往后每天都得在日光下散步，多吃新鲜的果蔬，身子才能一点点恢复。”\n\n“这事包在我身上！”我快步凑到团长跟前，笑着举手，“往后每天下午，我都陪团长在院子里散步！”\n\n木棉团长揉了揉我的头发，又看了看站在身旁的索拉娜与晓枫。屋里飘散着药草的苦味，可大家的心里，却全是踏实的温暖。"
  PAM.1020.a:0 "§9“团长一定会好起来的！”§!"

  PAM.1021.t:0 "在铁锤落下的时候"
  PAM.1021.d:0 "走进工坊的时候，整座车间回荡着机械运转的声响。\n\n一个年轻的学徒工不小心碰歪了传动轴，吓得缩在机床旁，以为要挨训了。\n雪伊姐走上前去，她手里拿着扳手，面上很是平静。\n\n“慌什么。”雪伊姐伸手熟练得扶稳了轴承，“扶稳底座，螺栓要对齐卡槽。机器冰冷得很，但我们在每台机床上加装了防护板，伤不到你。”\n\n她替年轻工友拧好了螺丝，顺手递了根烟过去：\n“踏实干活。在这里做工，工时到了就下班，谁也不准拿命冒险。”\n\n小徒弟接过果子，感激地点头应着。\n\n我站在立柱旁边，忍不住冲着雪伊姐笑。\n\n雪伊姐转过头看到我，拿胳膊蹭掉额头上的油污，瞪了我一眼：\n“傻笑什么呢，笨丫头。”\n\n“我在想，雪伊姐现在训人的样子，比以前顺眼多啦。”我走上前，把水壶递给了她。\n\n雪伊姐哼了一声，拧开水壶仰头喝了一口水说道：\n“以前在战场上，我总以为把对面的敌人全部打倒才能告慰死去的同伴。可现在看着这群年轻人能平安下班、健康地回家见爸妈……我才明白，这才是我们当年拼命争来的东西。”\n\n她伸手揉乱了我的头发，唇边带上了踏实的笑意：\n“回去跟着晓枫认真写字。等天黑收工，我带好吃的回去给你。”\n\n看着雪伊姐重新走回机床旁的背影，我心里满是踏实的温暖。"
  PAM.1021.a:0 "§9“雪伊姐，晚上等你回家！”§!"

  PAM.1022.t:0 "请把自己放一放吧"
  PAM.1022.d:0 "夜深了，帐篷的缝隙里还透着灯光，即使战争过去了，晓枫姐依旧喜欢一个人偷偷待在那里。\n我走进去的时候，晓枫姐正伏在案头前，面前堆满了各区的物资请领单。第四街区的水渠在昨天晚上坏掉了，补修需要大量的人工与存粮。晓枫姐手里的笔在纸上算着，把她自己的配给额度划去了一道又一道横线。\n\n她又在想着独自把所有的亏空担下来了。\n\n我走上前，把装着温水的水壶放在了桌角。\n“晓枫姐，这么晚了还不休息呀。”\n\n晓枫姐抬起头，眼里带着疲倦，却下意识地把那张写满数字的纸往文件底下挪动：\n“小果子乖，去睡吧。这几份文件很快就能核算完，我一个人处理就好。”\n\n那副语气太熟悉了。\n在过去很多个寒夜里，她也是这样，一边说着“我一个人就好”，一边把所有的危险与责任全揽在自己身上。\n\n我站在桌前看着她：\n“晓枫姐，你以前答应过我们的。你说往后再也不做孤单的领航员了。”\n\n晓枫姐握着笔的手停在了纸面上。\n她看着我认真的眼睛，又低头看向了那张被她划乱了的草稿。现在，屋里很安静，唯有油灯在不断跳动着。\n\n夜莺当初的那句话，突然在她的脑海里响了起来。\n“你总想把所有的重负全揽在自己一人身上，沉醉于独自赴死的悲壮……”\n\n晓枫姐的手指松开了。\n那支握得酸疼的笔落在了桌上，滚到了边缘。\n\n晓枫姐呼出一口气，脸上露出了释怀的笑意：\n“是呢……我又差点犯老毛病了。”\n\n她拉开抽屉，把那些被她藏起来的难题全部摆在了桌面上：\n“去把雪伊叫醒，再把第四街区的工会代表也请过来。修水渠和调配口粮的事情，我们大家坐在一起共同商量。”\n\n“好嘞！”我快步跑向门外。\n\n回头看去，晓枫姐靠在椅背上，正端起温水喝了一口。灯光照在她温和的面孔上，那座曾把她困住的孤单牢笼，在这一刻彻底消散了。"
  PAM.1022.a:0 "§9“我们是一个大家庭呀！”§!"

  PAM.1023.t:0 "第一堂课"
  PAM.1023.d:0 "“小果子老师，这个字好难写哦。”\n\n学堂的木桌旁，扎着辫子的小姑娘吸着鼻子，眼角挂着泪花。她手里的笔在板上划歪了一道，急得冒烟。\n那是前些天从废墟里接回来的孩子。她总害怕自己学得慢了会被人赶出去。\n\n我走过去，在她身侧蹲下来，拿手掌托住她的小手：\n“别慌呀。你看，横要平，竖要直。别着急，谁一生下来就会写字呢。”\n\n小姑娘抬起头看我，声音带着试探：\n“如果我学不会……小果子老师也会丢下我走掉吗？”\n\n听着这句话，我心里满是怜惜。\n我想起了当年的自己，那个在海滩上被救起来、硬抱着坏苹果害怕被丢掉的野丫头。\n\n我握住她的小手，帮她把写歪的笔画擦掉，认真地对她说：\n“绝对不会哦。这里的每一个人，都绝对不会丢下你。”\n“在我们的学堂里，你就算把字写得像鸡爪子划地，也可以天天吃到好吃的，可以在院子里开心地玩耍。”\n\n小姑娘破涕为笑，用力点了点脑壳，跟着我一笔一画地写下了“家”字。\n\n窗外传来了脚步声。我抬起头望过去，晓枫姐和雪伊姐正好路过窗边。雪伊姐冲我竖起大拇指，晓枫姐则露出了欣慰的笑容。她们没有出声打扰，在窗外对我挥了挥手，便安心地并肩走远了。\n\n我挺直了腰板，转过身继续教孩子们念书。\n我终于不再是那个全凭别人才能往前跑的小丫头了。现在的我，已经能够成为守护别人的避风港啦。"
  PAM.1023.a:0 "§9“这是我自己选出来的路！”§!"

  PAM.1024.t:0 "流汗的滋味真不错"
  PAM.1024.d:0 "“喂！手脚麻利点！等那边的坑填平了再往上面铺石子！”\n\n我把手里的铁锤往地上一放，擦了把额头上的汗水。南边的平原开阔得很，太阳晒在后背上，烘得人皮肉滚烫。\n\n几个工友合力把那块卡在渠沟里的大石头挪开，累得靠在土堆旁大口喘气，冲着我竖起了拇指：\n“索拉娜，多亏你刚才搭了把手，不然这块石头就要耽误我们一整天了！”\n\n我笑了声，别过脸去：\n“少拍马屁。要是任由你们磨蹭，这道水渠到冬天都通不了水。”\n\n脚步声从旁边传了过来。\n莉莉安娜提着水壶走到了工地上。她把盛着清水的瓷碗递到了我的面前，脸上带着宁静的笑意。\n\n我接过来，仰头大口喝了个底朝天。清凉的水顺着喉咙灌下去，舒服得我呼出一口长气。\n\n“今天修得真快呢，索拉娜。”莉莉安娜替我擦掉了脸颊上的泥灰。\n\n我看着她被阳光照亮的眼眸，心里颤动了一下。\n从前我总以为，把所有人踩在脚底下，当个让人害怕的暴君，就能把属于我的东西抓稳在手里。我抢夺心脏，我点燃战火，我以为那就是成为太阳的法子。\n\n可那时的莉莉安娜，看我的眼神里全是悲伤与害怕。现在的我两手泥灰，浑身酸痛，可她站在我身边，却笑得那么安心。\n\n原来……流汗比流血踏实得多。\n原来……平常的日头，比抢来的神明心脏要暖和得多。\n\n“这算什么。”我重新扛起铁锤，冲着前面的荒丘扬了扬下巴：\n“等把这片地全翻通了，我给你种出世界上最好看的花来。”"
  PAM.1024.a:0 "§O“凭劳资的本事，说它能种出花来，\n它就能种出花来！”§!"

  PAM.1025.t:0 "两朵小野花"
  PAM.1025.d:0 "学堂里的孩子们离开后，屋子里安静了下来，我正靠在窗台边，望着空下来的椅子。\n不知何时，莉莉安娜把收好的乐谱抱在怀里，走到我身旁坐下，也托着下巴看起了窗外的暮色。\n\n“今天教了好多歌呢，累了吧？”我先开了口。\n\n莉莉安娜侧过头看我，眉眼带着笑意：“还好啦……看到大家学得开心，心里就舒服很多呢。”\n她停了停，轻声问我：\n“……露西莉亚，你今天也一直坐在离门最近的地方呀。”\n\n我看着自己的鞋尖，小声应着：\n“习……习惯了吧。总觉得，我随时都得准备离开才行。要是太习惯这里的安稳了，等哪天必须离开的时候，可就舍不得了呀。”\n\n“为什么要离开呢？”\n莉莉安娜拉过我的手，用自己的手心包住了。\n“其实啊，那天在风暴里见到你的时候，我就觉得很奇怪了哦。你看着我的眼神那么难过，就好像……很久以前就认识我一样。可那时候的我，明明从没见过你呀。”\n我突然就答不上话来了。\n\n“当年索拉娜带走心脏的时候，我在心里许过一个愿望……我希望那颗离开我的心脏，能变成一个勇敢的孩子，去看看我看不见的太阳，去守护这世上每一个人的笑容……”\n莉莉安娜低下头，声音酸涩得继续说着：\n“我一直以为……我的软弱害惨了所有人。我以为我的愿望是一场灾祸，把索拉娜推进了深渊，把整座国家拖进了黑暗。我每天都在自责……可是看到你站在我眼前……听到你安然无恙的心跳……”\n她抬起头注视着我，眼泪落了下来，唇边却带着释怀的笑：\n“可是……露西莉亚，你……真的走到了我的身边了呢。”\n“那个从我的期盼里走出来的孩子……真的……真的来到我身边了啊。”\n\n莉莉安娜靠了过来，用额头贴着我的额头：\n“这一路……你受了好多苦吧？不要再想着离开了哦。这里就是你的家呀。”\n\n眼泪再也忍不住，我反手抱住她，把脸埋进她的怀抱里。\n那份寻找了太久的踏实与被爱着的滋味，在这一刻填满了我的心房。\n\n“……嗯。我不走了。”"
  PAM.1025.a:0 "§t“我也……最喜欢你了呢。”§!"

  PAM.1026.t:0 "因为我们是真正的家人"
  PAM.1026.d:0 "门被踢开了。\n索拉娜把沉重的铁锤随手往墙角一丢，大声嚷嚷：\n“喂！莉莉安娜！南边那帮修水渠的家伙笨死了，连块石头都搬不稳——”\n她的声音突然停住了。\n屋里，莉莉安娜正抱着落泪的我。\n索拉娜抓了抓金发，一脸凶样地瞪过来：\n“喂！干嘛呢这是？谁惹你哭了？是这个家伙欺负你了吗？看我不揍扁她！”\n\n莉莉安娜拉住了索拉娜沾着泥土的袖口，含着泪水笑了出来：\n“索拉娜……别闹呀。”\n“露西莉亚……是因为当年你带走我的心脏，我在绝望里许下的愿望，才来到这个世界的呀。”\n\n索拉娜整张脸都拧在了一起：\n“哈？！心脏？！你……你是心脏变出来的？！”\n\n莉莉安娜拉着索拉娜在身旁坐下，将我和索拉娜的手叠在了一起：\n“当年你拿走了我的心……我害怕得不知所措，在黑暗里祈求能有一个勇敢的孩子替我去看看外面的天空……露西莉亚，就是从那份思念里诞生的呀。”\n\n索拉娜张着嘴，彻底说不出话了。\n她看着我的面孔，看着莉莉安娜脸颊上的泪痕。\n这头习惯了用拳头解决一切的野狼，耳根迅速红透了。她想起自己当年夺走心脏时犯下的蠢事，显得十分局促。\n\n“嘁……笨死了……”\n索拉娜从兜里摸出一枚沾着泥灰的野果，塞进了我手里。\n随后，她抬起那厚实的手掌，按在我的头顶上，用力揉着我的黑发，别过脸去大声嘟囔：\n“听好了！既然是莉莉的心愿……往后这责任也算我一份！”\n“不管以前发生过什么……以后谁要是敢让你受委屈，我去咬断他们的喉咙！”\n\n粗糙的手掌贴在头顶，掌心带着平原上泥土与阳光的温度。\n身前是莉莉安娜温柔的拥抱，头上是索拉娜笨拙的护短。\n\n我不是代替谁的影子。\n我是莉莉安娜的期盼，是索拉娜放不下的牵挂。\n眼泪又一次落了下来，我抓住了索拉娜的袖子。\n“……嗯。我们一起回家。”\n\n夕阳洒满屋子。\n在这个重生的世界里，我终于迎来了真正属于我的家人。"
  PAM.1026.a:0 "§t“今天……我们三个都在一起了呢。”§!"

  PAM.1027.t:0 "在这世界之外"
  PAM.1027.d:0 "走廊上的吵闹声一大早就没停过。\n\n桌上放着几封远方送来的外交公函，大洋对岸的商船正停泊在港湾边缘，等着我们这边的答复。\n\n雪伊姐挽着袖子，正和索拉娜争论运输车队的路线。索拉娜把修路的铁镐往门边一立，嚷着要走最近的山道，雪伊姐敲着桌子反驳，叫她多动动脑子。\n\n“吵什么呀你们两个。”晓枫姐拿着写好的文件走进来，忍不住笑了，“一大早精神就这么足，待会儿去码头接见使团，你们两个可别当着客人的面吵起来。”\n\n莉莉安娜也端着洗净的水果走过来，柔声拉开了她们：“好啦，别吵啦，索拉娜今天开路辛苦了，吃个水果消消气呢。”\n\n索拉娜哼了一声，抓过果子大口嚼着，脸颊鼓起来，可到底还是听话地坐了下来。\n\n看着眼前这一幕，我和身旁的露西莉亚对视了一眼，都忍不住笑了。\n\n我们……都不是完美无瑕的圣人啊。\n索拉娜依然改不掉好胜的急脾气，雪伊姐训起人来依然大嗓门，晓枫姐偶尔还会想着独自把事情揽下，莉莉安娜在人多的时候还是会不安地逃到角落，而我也依旧是个认死理的倔丫头。\n\n可正因如此，大家聚在一起的时候，屋子里才会有这么吵闹、这么鲜活的温度。\n\n木棉团长站在屋檐下，眉眼含笑地看着我们：\n“好啦，外面的世界正等着认识我们呢。既然大家把屋里的规矩理顺了，也该去跟邻居们打个照面啦。”\n\n晓枫姐把印好的文件递到了我手里：\n“小果子，去把港口的大门打开吧。”\n\n我拿着手里的文件，转头看向身边的大家。露西莉亚对我点了点头，拉住了我的手掌。\n\n带着我们的伤痕，带着我们的缺点，带着这个吵闹却温暖的家——\n这一次，我们要坦然地走向浩瀚的世界了哦。"
  PAM.1027.a:0 "你好，世界！"


  PAM.1028.t:0 "来量量个子吧"
  PAM.1028.d:0 "“站直了，小果子，可不准踮脚尖哦。”\n晓枫姐手里拿着小刻刀，按着我的头顶，正平视着面前的门框。\n我脱了鞋子，把脚后跟靠在木头上，仰着脸喊：\n“才没踮脚呢！我是真长高了呀！”\n\n刻刀划破木料，留下一道浅槽，落下了带有树木清香的木屑。晓枫姐退后一步，眼里泛着柔和的笑意：\n“比刚接回来的那年高出两寸了呢。”\n\n雪伊姐凑上前瞧了瞧那道刻痕，随手弹了下我的脑门：\n“长了个头，脑子倒是一点长进都没有。站在我旁边还不是像个矮冬瓜。”\n\n“喂！雪伊你让开！”\n索拉娜大步挤了过来，把后脑勺往木框上撞：\n“晓枫！给我也刻一道！我肯定比你们都高出一截！”\n雪伊姐立刻嚷了回去，两个人争执起来。莉莉安娜拉着索拉娜劝解着，笑得弯下了腰。\n\n木棉团长坐在屋门前，正端着温水看着热闹：\n“当年在海滩上抱你回营房的时候，你瘦得连肋骨都凸着，一句话也不肯说。瞧瞧现在，嗓门比谁都大呀。”\n\n我抬起手，摸着门柱上那道新鲜的凹痕。\n木头的触感粗糙又真实。\n\n我想起了那片冰冷的大海，想起了大雪里熄灭的火光，想起了自己以为注定要在黑夜里咽气的那些日子。可现在，我有了属于自己的家。有了一道记录着我长大、记录着时间流逝的刻痕。有了不管走到哪里、推开门都能看到的大家。\n\n眼泪终于顺着笑容滚落了下来，砸在了我的脚背上。我伸出双手，用力抱住了身旁的晓枫姐与雪伊姐。\n\n露西莉亚也走上前来，伸出双臂环住了我们。\n\n“小果子，哭什么呀。”晓枫姐擦掉了我脸颊上的泪水，声音满是关切。\n“我高兴嘛……”我埋在她们怀里，破涕为笑，“我们明年、后年，还要一直刻下去哦。”\n“嗯，”露西莉亚在身后应着，“每年都刻一道，谁也不会少。”\n\n阳光洒满了整个院落。\n我们的人间，终于踏实地开始了。"
  PAM.1028.a:0 "§9“明年……我们还要量一次哦！”§!"







PAM_new_tips:0 "§O@PAM莉兰迪亚王国§!的§Y路线更新§!:\n§1£GFX_PAM_ddz 夜莺线§!:\n§2嘘。轻一点，\n她们都睡着了。\n\n我哪也不去。\n就在这儿守着。\n守着点心，守着茶，\n守着每一个乖乖闭上眼睛的孩子。\n\n你不用急着醒来。\n夜还很长呢。§!"
 #二线结束

CHL_has_military_access:0 "我们被公社渗透了"
CHL_has_military_access_desc:0 "这群养在深宅里的废物，连后门的门锁被人撬了都闻不着味儿。公社那帮疯子扛着步枪从她们后院穿过去，她们倒好，只知道捏着手帕站在旁边看着，就好像生怕鞋面上沾了泥一样。巡逻队现在得绕着她们的野餐垫走，因为那些肥猪嫌靴子踩在石子路上的声音会打扰她们喝茶。如果后防线仅仅因为这群废物就漏成这样，那我们还打个屁的仗。"

#百灵好感度 0  2
 PAM_.25.t: "胃里的石头"
 PAM_.25.d: "“深夜，我跪在马桶边，把胆汁都吐了出来。胃里空荡荡的，但我总觉得那里塞满了沉甸甸的石头。那些石头有名字，叫阿雅，叫羞耻，叫苟且偷生。\n我为什么要活着？\n我闭上眼，就能闻到那股肉饼的香气，那是阿雅被剁碎的味道。贵族们优雅的咀嚼声在我脑子里回荡，像是一万只苍蝇在飞。\n索拉娜把漂亮的裙子扔给我，把我锁在这个贴满金箔的房间里。她以为这就叫恩赐？不，这是刑罚。我穿着这身昂贵的丝绸，感觉就像披着一层死人的皮。每呼吸一口气，我都能感觉到自己的肺叶在腐烂。\n我握着那把没能刺出去的匕首，只要轻轻一下，我就能去陪阿雅了。我就能把这满肚子的脏东西都流干净了。\n‘……死很容易。’那个女人的声音突然在门外响起，像是隔着地狱的门缝传来的嘲笑，‘但你死了，谁来替阿雅看着那群肥猪下地狱？’\n我僵住了。刀锋划破了皮肉，渗出一丝血珠。\n是啊。我是一把脏了的刀。既然脏了，就不能用来切面包了。那就……用来切那些该死的烂肉吧。”"
 PAM_.25.a: "（再忍忍……等杀够了再死。）"

 #百灵好感度 20  3
 PAM_.26.t: "笼门的缝隙"
 PAM_.26.d: "“‘你就是百灵？’\n那个叫小果子的女孩找到了我。她手里捧着一个纸袋，里面装着刚烤好的小饼干。\n我本能地后退，手按在刀柄上。在这个宫殿里，我是异类，是阴影里的鬼魂，没人愿意靠近我。\n‘索拉娜姐姐让我给你的。’小果子也不怕，直接把饼干塞进我怀里，‘她说你最近瘦了，脸色像鬼一样，再不吃点甜的，就要变成真的亡灵了。’\n我捧着那袋饼干，温热的触感透过纸袋传到手心。\n‘出来走走吧。’小果子拉开窗帘，指着外面的花园，‘莉莉安娜姐姐种的花开了，晓枫姐在教大家认字。这个世界……已经不一样了。’\n我看向窗外。那里充满了吵闹声、读书声和欢笑声的人间。\n我看到索拉娜正被莉莉安娜按在椅子上梳头，一脸的不耐烦却又不敢乱动；我看到雪伊正对着一群新兵咆哮，但手里却拿着给她们补衣服的针线。\n这……就是她用那些残忍手段换来的东西吗？\n这就是……阿雅曾经梦想过的，不用再害怕被吃掉的世界吗？\n我拿起一块饼干，放进嘴里。很甜，甜得让我舌头发苦。\n原来，笼子的门早就打开了。把我关在里面的，不是索拉娜，是我自己那颗……还在流血的心。”"
 PAM_.26.a: "（外面的风……是暖的。）"

 # 百灵好感度 40  6
 PAM_.27.t: "磨刀石"
 PAM_.27.d: "“索拉娜兑现了她的诺言。她把那些曾参与‘晚宴’的贵族，一个个送到了我的刀下。\n第一个人是个伯爵。他跪在地上，鼻涕眼泪流了一脸，哭喊着说他是被逼的。我没有说话，只是机械地挥刀。血喷在我的脸上，热乎乎的。\n我以为我会感到快意。但我没有。\n我只感到一种令人窒息的空虚。杀了他，阿雅也回不来了。杀了他，我手上的血腥味反而更重了。\n我变成了一个纯粹的行刑机器。索拉娜坐在高台上，冷冷地看着我，像是在看一块磨刀石在打磨一把生锈的刀。\n‘手别抖。’她把一杯酒泼在我的脚边，‘这只是开始。你要习惯这种温度，习惯这种把人的生命像掐灭蜡烛一样掐灭的感觉。’\n我看着她。这个暴君，这个疯子。她明明在逼我做恶魔的事，可她的眼神里……为什么没有那种贵族特有的、以杀戮为乐的贪婪？\n她看尸体的眼神，就像在看一堆必须被清理的垃圾。\n‘你也觉得恶心，对吧？’我突然问她。\n她愣了一下，随即咧开嘴，露出了一个狰狞的笑：‘恶心？当然恶心。但如果我不做这扫垃圾的活儿，这屋子……永远干净不了。’\n那一刻，我握刀的手，突然稳了一些。”"
 PAM_.27.a: "（那就一起……下地狱吧。）"

 # 百灵好感度 60  8
 PAM_.28.t: "并不干净的手帕"
 PAM_.28.d: "“今天，我陪她去视察刚打下来的港口。有人在暗处放冷枪。\n那是我的失职——子弹擦着索拉娜的脸颊飞过去，留下一道血痕。我疯了一样冲进人群，把那个刺客按在地上，正准备割断他的喉咙。\n‘住手！’\n索拉娜却一脚踢开了我的手。她走过来，脸上挂着血，却笑得像个混蛋。\n‘是个孩子。’她指着那个只有十几岁的、吓得尿裤子的男孩，‘看他的眼睛。那是饿狼的眼睛，不是狗的眼睛。他想杀我，是因为他觉得我抢了他的家。’\n她蹲下身，把自己那条沾着火药味和汗臭味的领巾扯下来，胡乱地在那个男孩脸上擦了一把，把他脸上的泥污擦掉。\n‘别急着死。’她对那个想杀她的男孩说，‘留着命，看清楚我是谁。如果过两年你还觉得我是坏人，再来杀我不迟。那时候，记得瞄准点。’\n她放走了那个刺客。然后，她转过身，看到了浑身僵硬、拿着匕首不知所措的我。\n她看着我眼里的惊恐——我以为她会惩罚我，甚至处死我。\n可她只是走过来，用那条刚刚给刺客擦过脸的、脏兮兮的领巾，也在我脸上用力地擦了一下。\n‘傻鸟。’她嘟囔着，‘下次别冲那么快。你这小身板，挡不住子弹的。’\n那块布很粗糙，磨得脸生疼。上面还有那股难闻的味道。\n但我却觉得……那是这世上，最干净的东西。”"
 PAM_.28.a: "（她……为什么不杀我？）"


 # 百灵好感度 80  9
 PAM_.29.t: "刀鞘的温度"
 PAM_.29.d: "“深夜的寝宫只有月光像惨白的霜一样洒在地上。\n索拉娜坐在窗台上，那件总是披在肩上的狼皮大衣滑落在地。她刚刚结束了一场针对旧贵族反扑势力的血腥清洗，身上还带着浓重的铁锈味。她低着头，正在笨拙地试图擦拭那把象征权力的长剑，但手上的血太滑，总是擦不干净。\n‘……该死。’她低声咒骂，声音里透着一股我从未听过的、深深的疲惫，‘这血怎么这么黏……像胶水一样，粘上了就洗不掉。’\n我从阴影里走了出来。我的步子很轻，背带裙随着动作微微摆动，像是一只误入屠场的蝴蝶。\n在这个到处都是敌人的宫殿里，她把后背完全留给了我。\n我走到她面前，跪下来，接过那把剑。我从裙子的口袋里掏出那块她曾经给我擦过脸的脏领巾，一点一点，仔细地擦拭着剑锋上的血污。\n‘百灵。’她突然开口，声音很轻，‘这活儿不该你干。你的手这么小，应该去拿花，去拿糖果，而不是在这里擦这种脏东西。’\n我停下了动作，抬头看着她。她的眼睛里没有了白天的狂妄，只有一片像荒原一样辽阔的空虚，还有一丝……想要把我推开的犹豫。\n‘我的手不干净，陛下。’\n我握住她那只还在微微颤抖的手，把我的脸颊贴在她冰凉的掌心里。那是一种粗糙的、带着火药味的触感，却让我感到无比安心。\n‘从我拿起刀的那一刻起，我就再也拿不起花来了。是您给了我存在的意义。’\n‘如果杀人是罪，那就让我来背。如果血洗不掉，那就让它干在手上，变成我们的手套。’\n我把擦干净的剑重新塞回她的手里，然后握住她的手，将剑尖指向窗外那片沉睡的、属于我们的城市。\n‘您只管挥剑。不管是砍向敌人，还是砍向这个该死的世界。’\n‘而我……’我抬起头，双马尾在月光下垂落，眼神里不再有迷茫，只有一种近乎献祭般的虔诚。\n‘我是您的刀鞘。当您累了，当这把剑太锋利会伤到您自己的时候……就藏进我这里。我会替您挡住所有的寒意，我会替您收敛所有的锋芒。’\n索拉娜愣住了。她看着我，看着我这身与杀戮格格不入的背带裙装，那双总是燃烧着野心的眼睛里，第一次流露出了一种名为不舍的脆弱。\n‘……傻瓜。跟着我，你会万劫不复的。’\n‘我不怕。’我轻声回答，‘我只怕……您的身边没有我。’”"
 PAM_.29.a: "（您是火，我是灰。我们……分不开了。）"

 # 百灵好感度 100  100
 PAM_.30.t: "裙摆下的獠牙"
 PAM_.30.d: "“出征的号角已经吹响，舰队的黑帆遮蔽了整个海湾。索拉娜站在旗舰的龙骨上，正在接受万军的欢呼。她是那样耀眼，那样狂妄，像是要吞噬太阳的巨狼。\n我站在码头的阴影里，最后一次整理着我的背带裙，将匕首绑在长袜的边缘，藏进蕾丝花边之下。\n‘喂！那个躲在角落里的小鬼！’\n索拉娜突然回过头，隔着攒动的人头冲我大喊。海风吹乱了她的金发，她的声音里带着一丝焦急，甚至是恐吓。\n‘船要开了！这是去地狱的单程票！你给我留在岸上！听见没有？！’\n她的手死抓着栏杆。她在怕。她不怕前面的敌人，但她怕我跟上来。她想把我留在她打下的这个和平世界里，让我像个普通女孩一样干净地活着，而不是跟着她去尸山血海里打滚。\n我情不自禁得笑出了声。这是我第一次在阳光下露出如此轻松的笑容。\n我丝毫没有理会她的命令，但也没走向那艘光鲜亮丽的旗舰。我走向了旁边一艘不起眼的、没有任何标记的黑色快艇——那是专门为‘清道夫’准备的船。\n‘陛下，狼群不需要两只头狼。’\n我对着那个高高在上的身影，轻轻地说，声音却顺着海风清晰地传到了她的耳朵里。\n‘但狼王……不能没有影子。’\n我跳上船，海风吹起我的双马尾和裙摆，让我看起来像个准备去春游的学生，而不是一个去收割生命的死神。\n‘您想把我留在光里？可光太刺眼了，我会睡不着的。’\n‘我会飞在您看不见的死角，我会啄瞎那些想在背后放冷枪的眼睛。我会清理战场上的腐肉，我会把那些肮脏的、不光彩的、没法写进史诗里的罪恶，统统吞进我的肚子里。’\n‘您负责在史书里光芒万丈，而我……负责在注脚里为您守住黑暗。’\n我轻轻提着裙角，向她行了一个不像杀手、倒像是个淑女的屈膝礼，然后指尖滑过藏在腿侧的刀柄。\n‘别赶我走，索拉娜。没有我……谁来帮您擦剑呢？’\n索拉娜怔怔地看着我，看着我这副天真又残忍的模样，看着我那双写满了‘绝不回头’的眼睛。她的嘴唇颤抖了几下，最终，那份担忧化为了一声无奈却又纵容的长叹。\n她猛地挥手，指向前方，眼角似乎有一闪而过的晶莹：\n‘……真是个……不听话的混蛋！’\n‘那就跟上来！别掉队了！要是敢死在我看不见的地方……我就去冥界把你抓回来！’\n汽笛轰鸣，黑烟滚滚。我站在船头，迎着扑面而来的腥咸海风。我不需要黑色的斗篷来伪装，因为我这身干净的裙子，才是对这个残酷世界最大的嘲讽。在这条通往地狱的航线上，我终于……找到了属于我的归宿。”"
 PAM_.30.a: "（起航！为了……守护这头笨拙的狼！）"
 PAM.89.t: "来自黑色快艇的低频信号"
 PAM.89.d: "“……喂？头儿。……是我。\n别拿望远镜找了，我在您的旗舰影子里，那个浪花溅不到的死角。这艘小船有点颠，但我把裙子熨得很平整，双马尾也重新梳好了。您放心，我现在看起来一点也不像个死神，就像个跟着姐姐出来春游的乖学生。\n您刚才在码头上吼得真凶……但我听得出来，您是在发抖。您怕那边的世界太脏，怕血溅到我的白袜子上，对吧？\n可是头儿，您这头狼太笨了。您总是想把所有人都护在肚皮底下，那谁来护着您的后背呢？\n以后，请您只管昂着头，去迎接那些欢呼，去征服那些阳光下的土地。至于那些躲在暗礁后面的冷箭，那些想在您背后捅刀子的懦夫，还有那些不体面的、没法写进史诗里的脏活……\n统统交给我。\n我会用这双您觉得应该拿糖果的手，把他们的喉咙割开，然后把尸体绑上石头，安安静静地沉进海底。不会有人知道，也不会有人看见。\n这就是我的自由——在这个残酷的世界里，为了让您一尘不染，我愿意在淤泥里开出花来。\n……海风很大，您回舱去吧。别回头看黑暗。\n因为在黑暗里……我正爱着您。”"
 PAM.89.a: "（嘟—嘟——信号在海风中中断了）"

 PAM.90.t: "纸页的摩擦声"
 PAM.90.d: "我的笔尖悬停在那张泛黄的羊皮纸上，迟迟不敢落下。\n按照原本的剧本，这一页本该被鲜血浸透。那个在烂泥中长大的狼王，本该与那些心怀理想的革命者在那间地牢里同归于尽，用彼此的尸骨为这个绝望的世界再添一笔灰暗的注脚。那是历史的惯性，是命运既定的轨迹。\n可是……我不甘心。\n于是，我划掉了那些死亡的判词。我在这张已经写满了悲剧的纸上，强行涂改出了一个新的转折。我让那个暴君学会了妥协，让那些烈士学会了隐忍。我用我那一厢情愿的“善意”，把水与火、把狼与人，强行缝合在了一起。\n看着那行新的文字——“镣铐被解开了”——缓缓浮现在纸面上，我却感到一阵难以言喻的心悸。\n她们……动起来了。\n晓枫在思考，雪伊在擦枪，小果子在发抖。她们的动作是那么流畅，表情是那么生动。可是，在那摇曳的火光背后，我分明看到她们的影子……淡得几乎看不见。\n就像是……墨水还没有干透的画中人，只要一阵风吹过，就会重新化为一滩毫无意义的污渍。\n我在欺骗世界，也在欺骗我自己。我把这个本该破碎的故事强行粘好，只为了看一眼那个……所有人都活下来的、不可能存在的明天。\n\n“……演下去吧。”\n\n我对着书页，轻声乞求，眼泪打湿了刚刚写好的那一行字。\n\n“求求你们……就在这个虚假的舞台上，哪怕是装……也要装作，真的很幸福啊。”"
 PAM.90.a: "（风，翻过了这一页。）"

 PAM.91.t: "我们的故事从未结束"
 PAM.91.d: "故事……好像写得太长了。\n我看着面前这幅已经连成一片的、巨大的地图。上面插满了黑色的狼旗，每一面旗帜下，都是欢呼的人群和冒着炊烟的工厂。索拉娜坐在最高的王座上，莉莉安娜握着她的手，晓枫、雪伊、小果子……她们都围在桌边，笑得那么灿烂，那么……“真实”。\n这是一个多么完美的结局啊。完美得……让我感到刺骨的寒冷。\n因为我已经摸到了。\n我的指尖，已经触碰到了这张纸的边缘——那是粗糙的、冰冷的、虚无的边缘。\n在这个边缘之外，只有无尽的空白与黑暗。我所编织的这个“狼群帝国”，这个充满了烟火气和生命力的世界，其实……只是漂浮在虚空中的、薄薄的一页纸。\n我能听到，纸张纤维正在发出不堪重负的断裂声。我为她们赋予了太多的“幸福”，太多的“奇迹”，这重量……已经快要压垮这个原本注定是悲剧的故事架构了。\n画面开始出现了细微的噪点。索拉娜的笑声里偶尔会夹杂着一丝电流的杂音；莉莉安娜的裙摆在风中偶尔会像数据一样闪烁；那些欢呼的人群，有时候看起来……就像是一群不断重复动作的背景板。\n她们不知道。\n她们不知道自己正生活在一个随时可能醒来的梦里。她们还在兴致勃勃地规划着下一个一百年的未来，还在讨论着明天的早餐吃什么。\n可我……已经写不出下一个字了。\n墨水干了。我的愿力……也快耗尽了。\n我趴在桌上，脸贴着那张温暖的、虚假的插图，看着她们每一个人的笑脸，心痛得无法呼吸。\n这真的是救赎吗？还是说……我只是把她们，从一个干脆利落的死亡里拖出来，囚禁在了一个……虽然美好、却永远无法触及真实的、名为“幸福”的琥珀之中？\n“……别停下。”\n我闭上眼睛，抓紧了那即将破碎的纸页边缘，发出了无声的呓语。\n“……哪怕这只是我一个人的臆想……也请让这个梦……再做得久一点吧。”"
 PAM.91.a: "（但书……终究是有最后一页的。）"
 
