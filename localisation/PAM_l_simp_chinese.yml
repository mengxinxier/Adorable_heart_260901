PAM_seize_lili_wait_desc:0 "莉莉安娜在那座失去了太阳的城堡里等了一辈子。等了太多辈子。她给每一个还没来的人留了茶、留了空位、留了翻开的书页。现在轮到我们走到她窗前了。茶还温着呢，不用再等了。"
