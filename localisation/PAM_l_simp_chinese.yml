PAM_end_title: "§O此刻，这喧嚣即是永恒§!§!"
PAM_end_tip: "莉莉安娜就站在我的右手边。她双手紧紧地、近乎执拗地牵着那根从我胸口延伸出来的、发着微光的银色丝线。那双倒映着万家灯火的眼睛里，只装得下我一个人。那种眼神就像是一个怕黑的孩子，终于抓住了她唯一的烛火。\n“……傻瓜，抓那么紧干嘛，我又跑不了。”我嘟囔着，举起酒杯，隔着琥珀色的酒液看着她。虽然我的舌头已经尝不出麦芽的苦味，但这一刻，有一种比烈酒更烧喉的东西，顺着那根线，直接灌进了我的灵魂里。\n那是被锁住的安全感。是确信自己这只孤魂野鬼，被这根细细的线牢牢地拴在了这个热气腾腾的人间。\n我冲她咧开嘴，露出了一个混蛋又幸福的坏笑，把酒杯举到了她面前。\n她也笑了，眼睛弯成了两道温柔的月牙，手里的丝线，却抓得更紧、更用力了一些。\n这就够了。只要这根线不断，只要这锅肉还热着，只要她的眼睛还看着我……\n这场甜美的宴席，就永远不许散场！"
PAM_end_tip_2: "感谢您对钢铁萌心与莉兰迪亚王国内容的喜爱与支持！\n愿每一个在荒原上流浪的灵魂，终能找到那个愿意将你锁在人间的羁绊"
PAM_end_close_button: "§O再来一杯！§!"
PAM_end_close_button_TT: "§L敬这个……把我们所有人拴在一起的、吵闹的好世界。§!"

PAM_end_title2: "§t此刻，故事归于尘土§!§!"
 
PAM_end_tip2: "风终究还是吹灭了那盏从未真正点燃的烛火，将这场漫长的、虚妄的盛宴，彻底卷入了被遗忘的深渊。\n我坐在那张早已腐朽的长桌尽头，看着晓枫的指骨在风中无声地化为齑粉，看着雪伊怀中抱着的铁锈随风散去，看着小果子那张脆裂的海图在空气中崩解为尘埃。那只名叫百灵的黑鸟，发出了最后一声凄厉的啼鸣，随即撞向了并不存在的窗户，消失在虚无的惨白光芒里。\n最后，爬向那座空荡荡的王座。在那个我编织的、甜美得令人心碎的梦里，莉莉安娜曾坐在那里，用那根线牵了索拉娜一生一世。而我，只是那个躲在角落里，看着她们幸福、以此取暖的……多余的影子。\n现在，梦醒了，连影子也该消失了。\n我的怀里抱着那本已经在此刻化为白纸的童话书。在这片被时间与神明共同遗弃的荒原中心，用尽灵魂最后的一丝力气，对着这无边的死寂，写完了那个……从来就不曾存在过的结局：\n§t“很久很久以前……有一位笨拙的骑士……”§!"
 
PAM_end_tip2_2: "感谢您对钢铁萌心与莉兰迪亚王国内容的喜爱与支持！\n因为注定经受百年孤独的故事，不会有第二次机会在大地上出现。"

PAM_end_close_button2: "§t……她，真的拯救了所有人。§!"
PAM_end_close_button2_TT: "§L荒草掩埋了诗篇，往事在尘埃中枯萎。§!"

PAM_end_title3: "§t…有两个可爱的孩子§!§!"

PAM_end_tip3:0 "§t“果子，冷吗？”§!\n小果子把两手揣进衣服里。她的双肩早已被冻得动弹不得，可她还是摇了摇头，小声说：§9“不冷哦。和你在一起，身上一点也不冷。”§!\n§9“露西莉亚，以前那本书里写的结局很差。现在，这个结局算是好的吗？”§!\n不知何时，露西莉亚已经将下巴搁在了小果子的肩膀上。\n§t“我不知道呢。”§!她轻声回答，\n§t“不过，你留下来了。大家也都在温暖的阳光里醒来了。晓枫姐，雪伊姐，她们在我怀里……也睡得很安稳。城里的孩子们，以后也都可以幸福地生活下去了。”§!\n§9“那便挺好。”§!小果子弯了弯眼睛，将身体往露西莉亚身边靠了靠，\n§9“大家能安稳地过日子，我们留在这里，守着这个故事，也没什么不好的。等以后他们建好了新厂，说不定还会拉响汽笛呢。到时候，我们在这里也能听见吧。”§!\n红宝石的光芒已经散尽，最后一丝热度都退了下去。时间在黑暗中失去了意义，世界安静得像一堵墙。\n§t“很久很久以前，”§!露西莉亚说，§t“有对小鸟……”§!\n小果子闭上眼，在黑暗里笑了：§9“这篇故事说过了，换个新鲜的吧。”§!\n§t“很久很久以后，”§!露西莉亚将头埋得更深了一些，声音微弱得快要听不见了，§t“有个穿着新鞋的女孩子，在温暖的阳光里跑着……这一次，她有吃不完的甜苹果。”§!\n§9“新鞋早就穿不了了哦……哦，对了！那骑士呢？”§!小果子眼睑闭合，声音也弱了下来。\n§t“骑士牵着她的手。”§!露西莉亚的声音几乎消散在尘埃里，§t“她们……再也不分开。”§!\n月光无声地落在她们身上。在漫长的长夜尽头，她们安稳地睡着了。"

PAM_end_tip3_3: "还不是说再见的时候哦，我们的故事还没有结束呢。（后面还有流程与剧情）\n愿春光重回大地，亦愿守在昨夜里的孩子，拥有安眠的梦境。"
PAM_end_close_button3:0 "§t下一次，一定要在阳光下相遇啊。§!"
PAM_end_close_button3_TT:0 "§L别害怕，露西莉亚，我在这儿呢。§!"

PAM_end_title_4:0 "§t此刻，故事终于迎来了结局§!"

PAM_end_tip_4:0 "小果子用袖子胡乱擦了擦脸上的泪痕，推了推怀里的人：§9“喂，哭够了没？眼睛肿得跟桃子一样，丑死了。”§!\n露西莉亚把头从小果子脖子里抬起来，脸颊上还挂着晶莹的泪痕，噗嗤一声笑了出来。那是一声真正的、再无一丝负担与隐瞒的笑声。\n§t“果子真凶。”§!\n§9“谁凶了！”§!小果子瞪了她一眼，别过头去，声音小了下来，§9“我是怕你又睡过去。晓枫姐以前说过，大哭过一场容易犯困。我不许你再闭眼了。”§!\n§t“我不睡了哦。”§!露西莉亚握住了小果子的手，§t“以后再也不睡了。”§!\n§9“算你识相……不过，真要太累的话还是睡一会吧……但是！一定要准时醒过来哦！要早睡早起！”§!小果子站起身来，向露西莉亚递出了她的手，§9“走啦。食堂那边的锅早该开了，去晚了，新熬的浓汤全都要被那群刚醒来的小家伙抢光了。\n\n木棉姐，晓枫姐、雪伊姐、还有莉莉安娜索拉娜她们，她们的愿望都等着我们去替她们实现呢。”§!\n露西莉亚拉住小果子借力站了起来。白发在早晨的风里舞动，像是一朵盛开在废墟之上的花儿。\n§t“嗯！”§!露西莉亚站起身子，露出了一个比阳光还要灿烂的笑容。\n那本写满了折磨、牺牲与遗憾的故事书，在这一秒彻底完结了。\n§9但是啊，在这片重获新生的土地上，§!§t属于她们的真实人生，才刚刚掀开第一页呢。§!"

PAM_end_tip_lower_4:0 "感谢您对钢铁萌心与莉兰迪亚王国内容的喜爱与支持！\n愿所有的等待都换来重逢，亦愿长夜尽头的孩子，拥抱温暖的晨光。"

PAM_end_close_button_4:0 "§9“走啦，吃饭去啦！”§!"
PAM_end_close_button_TT_4:0 "§L听到了吗，莉莉安娜？我交到了新朋友哦……\n\n我呀……从来没有忘记你呢。§!"

PAM_end_title_5:0 "§9此刻，我依然在对你微笑§!§!"

PAM_end_tip_5:0 "“小果子，好好学一下，下次不要再把衣服带子系成死结了哦。”\n晓枫姐弯下腰，替我把腰后拧在一起的布带解开，重新系了个漂亮的蝴蝶结。\n雪伊姐坐在窗台边上，手里耍着两块小木头，笑骂着说我手笨得跟熊掌一样。\n多么热闹的家呀。\n\n可我的心里，却在对那个早就散在雪里的骑士说着话。\n\n§9“露西莉亚……你个大笨蛋……”\n“你为什么要跨过大雾跑过来，把那些残忍的真相全拍在我脸上啊？”\n“你为什么要倒在我跟前？为什么要让我看着你消失？你让我每天顶着这张笑脸，每天对着两个早就死在矿道里的躯壳叫姐姐……你以为这样很好玩吗？”\n\n“可是啊……我自己也是个更大更大的笨蛋呢。”\n“明知道眼前的姐姐们全是假象，明知道这里的热闹全是用你的命换来的，我却还是贪恋着这点虚假的体温不肯醒过来。”\n“我们两个，全都是天下最无可救药的大笨蛋啊。”§!\n\n我的眼泪终于控制不住了。\n但是我唇角的笑容，却拼命地扬着，一刻也不敢收回去。\n\n§9“可是啊……我懂你呢。”\n“我太懂你那颗笨笨的心了呀。”\n“你是不忍心看我活在骗局里，你是不想让我连姐姐们真正的回忆都给忘掉了……”\n“我现在每天都在笑哦。对晓枫姐笑，对雪伊姐笑，对这满屋子的空气笑。”\n“因为这可是你拿命替我守住的美梦啊……就算这梦是假的，我也要替你做下去呀。”§!\n\n晓枫姐拍了拍我的头，语气空洞又心疼：“小果子，哭什么呀，大家都在这儿呢。”\n我扑进晓枫姐与雪伊姐怀里，用力抱着她们，笑容灿烂得比星星还要耀眼：\n\n§9“对呀……大家…大家都在这儿……真好呢……”\n“露西莉亚……晚安哦。”§!"

PAM_end_tip_lower_5:0 "感谢您对钢铁萌心与莉兰迪亚王国内容的喜爱与支持！\n幸福的谎言里没有了风雪，可逐渐消逝的大家，再也回不到阳光下了。"

PAM_end_close_button_5:0 "§R再见，露西莉亚。§!"

PAM_end_close_button_TT_5:0 "§L我会在这个梦里……永远记得你。§!"

PAM_end_title_6:0 "§9此刻，听我讲完最后一个故事吧§!§!"

PAM_end_tip_6:0 "在很久以前，有一群笨拙的人。\n\n有人性子急躁，有人喜欢独自逞强，有人脾气冲得很，有人成天做着不切实际的梦，还有一个在海边漂流、硬抱着苹果怎么也不会松手的野丫头。\n\n她们在黑夜里哭过、跌倒过，流了好多血，受了好多苦。\n神明想要把大家关进不会痛苦的盒子里，可大家偏要自己走出来，牵着手迎向阳光。\n\n后来呢？\n后来的故事呀，可平凡了。\n大家在院子里盖起了新屋，在门柱上刻下了长高的印记，在厨房里做着好吃的饭菜。谁也不去当什么英雄，谁也不用再去害怕明天的风雨。\n\n听懂了吗？\n这就是小果子给你们讲的故事哦。\n\n好啦，夜深了，大家都要安心盖好被子，去睡个好觉。\n等明天睁开眼的时候，太阳依然会准时照进窗户里呢。"

PAM_end_tip_lower_6:0 "感谢您陪伴莉兰迪亚与所有的姑娘们走过漫长的黑夜！\n愿每一个在风雪里前行的灵魂，都能在阳光下找到属于自己的家。"

PAM_end_close_button_6:0 "§9那么，明天见哦。§!"

PAM_end_close_button_TT_6:0 "§L我们……都在呢。§!"
