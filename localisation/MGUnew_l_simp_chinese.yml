 MGU_Next_2_txt:0"§Y议会建制派§!在选举中获胜"
 MGU_Next_2_J01_txt:0"§Y巴麻美§!在选举中获胜"
 MGU_Next_2_J02_txt:0"§Y七海八千代§!在选举中获胜"
 MGU_Next_2_J03_txt:0"§Y梓美冬§!在选举中获胜"
