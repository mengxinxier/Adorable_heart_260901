l_simp_chinese:
GTMX_TBMGUprisoner_MGU: "晓美焰的命运"
####国策####
MGU_hmr_hryr: "不会再交给任何人"
MGU_hmr_hryr_desc: "“如果现在把权力交还给议会，混乱和逃避用不了多久就会重新回到见泷原。到最后，被推到绝境里的，一定还是那个最温柔的人。……无论重来多少次都一样，所以我不会放手。”"

MGU_hmr_fced: "终止EVE计划"
MGU_hmr_fced_desc: "军管指挥部已经下达正式指令，彻底关停神滨地下的所有EVE实验设施，并切断玛吉斯之翼的一切对外联络。那场酿成二木市惨剧的疯狂赌局，必须在今晚结束。"

MGU_hmr_ymzm: "踏入城外的荒野"
MGU_hmr_ymzm_desc: "内战几乎耗尽了见泷原所有备用的悲叹之种。仅靠城内已经维持不了净化，魔法少女小队只能前往城外的荒野，主动清剿游荡的魔女。"

MGU_hmr_xghh: "维持这份沉默"
MGU_hmr_xghh_desc: "在联盟里，凡人和魔法少女早已心照不宣地守着同一个秘密。大家都避开魔女的结局不谈，也不愿打破白天的安宁。只要没有人去戳破，这份沉默就会一直维持下去。"

MGU_hmr_hylz: "不再独自狩猎"
MGU_hmr_hylz_desc: "以前魔法少女总是各自守着自己的地盘，在谁也不知道的黑夜里耗尽魔力，最后孤零零地变成魔女。现在的见泷原和神滨已经经不起这样的消耗了，从今天起，所有人都必须学会一起战斗。"

MGU_hmr_emcf: "去往二木市"
MGU_hmr_emcf_desc: "“内战结束了，二木市的人还是恨着我们。被虚假的希望骗过一次，她们不会再轻易相信谁说的话了。……在绝望重新失控之前，我必须亲自过去一趟。”"

MGU_hmr_yqxh: "神滨的灯火"
MGU_hmr_yqxh_desc: "议会解散以后，没完没了的争吵总算停了下来。离开那里的魔法少女们还是聚在神滨的屋檐下，互相陪伴着。"

MGU_hmr_jydk: "收回源翠石"
MGU_hmr_jydk_desc: "圣杯王国一直打着保护我们的旗号，一船接一船地运走亚马逊的源翠石。就像这世上从来没有不付代价的奇迹一样，靠别人施舍换来的和平，从一开始就不属于我们。"

MGU_hmr_sbyz: "平息杂音"
MGU_hmr_sbyz_desc: "商路被切断之后，城里的药品和物资很快就短缺了。习惯依赖圣杯商船的商人们开始在街头煽动恐慌，要求我们向远征军低头认错。出兵之前，必须先把这些杂音全部平息下来。"

MGU_hmr_ghgk: "收回博丽先代"
MGU_hmr_ghgk_desc: "“那座港口托管领就卡在神滨旁边。既然她们打算用封锁逼我们屈服，那就赶在联盟彻底崩溃之前，先把博丽先代的港口夺回来。”"

MGU_hmr_dhzj: "没有悲叹之种的雨林"
MGU_hmr_dhzj_desc: "夺回博丽先代彻底激怒了盘踞在西北内陆的露丝契亚远征军。过去魔法少女面对的敌人都是魔女，只要获胜就能得到净化宝石的悲叹之种；可这一次深入亚马逊腹地，我们要面对的是一支庞大的人类正规军。这是一场无论击败多少敌人，都换不回任何净化的消耗战。"

MGU_hmr_bjsy: "推向新安普敦"
MGU_hmr_bjsy_desc: "把露丝契亚远征军一路向北赶出新安普敦和哈芬利斯，意味着我们彻底接管了整片亚马逊内陆。可与此同时，那片曾把我们与北方帝国、西方诸国隔开的缓冲带，也跟着一起消失了。"

MGU_hmr_clda: "她们原本就要离开"
MGU_hmr_clda_desc: "圣杯王国的物资其实早就开始分批撤回本土了。在那份预案里，一旦大陆开战，我们不过是用来替她们争取装船时间的弃子。"

MGU_hmr_cjwn: "将EVE移往北方"
MGU_hmr_cjwn_desc: "用祈愿换来的魔力，终究要靠等价的诅咒来偿还。既然谁也没办法把已经诞生的绝望凭空抹掉，那就只能把神滨地下的EVE核心搬去北方的荒原。这不算什么体面的办法，可这是唯一能让所有人活下去的妥协。"

MGU_hmr_frwz: "凡人"
MGU_hmr_frwz_desc: "在干净安稳的街道上生活了几千年，联盟里的凡人早已习惯把苦难全都交给得到奇迹的少女。直到远征军留下的步枪发到每个人手里，她们才不得不自己走上战场。"

MGU_hmr_jyjs: "留在北境"
MGU_hmr_jyjs_desc: "阳光照得到的地方留给见泷原。铁塔、转化装置，还有逼近的阿德莱希大军，全部留在北方的荒原里。既然走上了这条回不了头的路，由我一个人走完就够了。"

####事件####

MGU_homura.1.t: "恍如昨日"
MGU_homura.1.d: "【魔法少女联盟议会致见泷原指挥部公函（摘录）】\n“……鉴于叛乱业已平息，各地城邦亟待恢复往昔之安宁与繁荣，谨请晓美焰女士尽快将临时管制权交还议会，令国民重返温和、安稳之生活……”\n\n读完这份措辞客气的公函，实在让人觉得有些可笑。整封信里完全没有提到二木市，她们倒像是已经忘了内战爆发那一夜是谁丢下见泷原独自躲进避难所。只要天一亮，人类总能轻易忘掉夜里的恐惧。\n\n隔壁传来小圆哼歌的声音，刚才她说要去整理送往二木市的衣服，大概还没叠完。听着她的哼唱，我把公函折好放到桌角，在延长军事管制的命令末尾签下了自己的名字。"
MGU_homura.1.a: "§1“维持军事管制。”§!"

MGU_homura.2.t: "你和我有什么区别"
MGU_homura.2.d: "隔着观测室的玻璃，里见灯花坐在对面。\n\n“哎呀，真意外，我还以为你会干脆把我们全都处理掉呢，晓美焰。”\n“那样没有意义。关掉EVE，切断玛吉斯之翼的联络，就足够了。”\n“你下令关掉EVE，是因为同情二木市死去的凡人吗？”\n“当然不是。”\n“哼，果然嘛！”灯花笑了起来，“魔法少女迟早会变成魔女，这片土地上谁心里不清楚？可凡人照样理所当然地享受奇迹，把绝望全都推给魔法少女去承受。从逻辑上讲，你和我做的明明就是同一件事嘛。我只不过是拿素不相识的凡人当了代价，你呢，为了保护自己在意的人，干脆剥夺了整个联盟的自由。明明都一样，就别装得自己有多高尚啦！”\n“……或许如你所说吧。不过，你们的失控差点伤到了见泷原，唯独这件事，我绝不会容忍。”\n\n我转身走向门边，身后传来灯花的笑声：“是吗？那就祝你好运咯。神滨和二木市之前一直靠EVE压着灵魂宝石的浑浊，你今晚把它关掉，不出几天，你们手里的悲叹之种就会连见泷原都供应不上了。到时候可别来求我哦？”"
MGU_homura.2.a: "§1……§!"

MGU_homura.3.t: "悲叹之种"
MGU_homura.3.d: "门后面隐约有人在哼歌，像是在哄孩子睡觉，门缝底下却冒出一团不自然的黑影，正贴着地板往屋里蔓延，是还没长成魔女的使魔。\n\n“让开，杏子！屋里住着普通人啊！”剑和长枪撞在一起，美树沙耶香被震退到了门前。\n\n“喂，别犯傻了！”佐仓杏子偏头朝墙边示意，“关掉EVE之后，见泷原早就没有多余的悲叹之种了，杀使魔又不会掉那种东西！为了几个不认识的人把魔力耗在这里，你是想让那边那个撑不住的新人，今晚就在见泷原变成魔女吗？”\n\n墙边坐着一个刚从二木市撤回来的女孩，她怀里的灵魂宝石已经黑得几乎看不出原来的颜色了。沙耶香脸色发白地站在了原地，她看看屋门，又看看那个女孩，手里的剑怎么也举不起来，最后只好望向巷口的我。\n\n里见灯花说的那一天，比我想的来得还要快。我扣下扳机，枪响之后，门缝前的黑影立刻消散了。我把身上最后一枚悲叹之种扔过去，它滚到那个女孩脚边。\n\n“……如果你真的想救谁，就别把时间浪费在无意义的争吵上，美树沙耶香。”"
MGU_homura.3.a: "§1“……明天开始，去城外狩猎魔女吧。”§!"

MGU_homura.4.t: "座位"
MGU_homura.4.d: "一、二、三。茶几上摆了三只茶杯，杯底碰到桌布的那一瞬间，巴麻美的手停住了。\n\n屋里静了下来。我原本只是来和她商量城外荒野的巡逻路线，好补上城内所剩无几的悲叹之种，可以前总爱在巡逻结束后跑来吃蛋糕的后辈，已经留在二木市，再也不会推开这扇门了。停顿只持续了一两秒，她把多出来的杯子收进橱柜，替我倒满红茶，坐回对面时照常笑着，就像刚才什么也没发生过一样。\n\n“……真是不可思议呢。”她看着杯里的红茶说道，“明明大家心里都清楚，魔法少女走到最后都会变成魔女，可谁也不说破，每天还是像什么都不知道一样，笑着道早安、送花束。晓美同学，你觉得……就这样停在美梦里不醒来，究竟算不算一种幸福呢？”"
MGU_homura.4.a: "§1“……红茶要凉了，巴麻美。”§!"

MGU_homura.5.t: "校门前的雏菊开了"
MGU_homura.5.d: "“今天路过校门的时候，花坛里的雏菊居然已经开了呢。”小圆把点心袋放在我的地图旁边，像放学后留在教室里那样，聊起在路边见到的小事。有她在的时候，连时间都像慢了下来。\n\n可话没说完，她忽然停住了：“……小焰？你的手，是不是受伤了？”\n\n昨晚把最后一枚悲叹之种扔出去之后，我左手背上的灵魂宝石就一直蒙着散不去的浑浊。我刚想把胳膊收去桌下，还是慢了一步，小圆已经拿手帕盖了上来，隔着白布把我发冷的手连同那枚宝石一起握住了。\n\n“对不起……我总是帮不上什么忙，连小焰在辛苦些什么，也总是最后一个才知道。……可是，至少今天晚上，不要再一个人勉强自己了，好不好？”"
MGU_homura.5.a: "§1“……嗯。我知道了，小圆。”§!"

MGU_homura.6.t: "旁观者"
MGU_homura.6.d: "窗沿上蹲着一团白色，那双红眼看过来的时候，我的手已经按在了枪柄上。停了一会儿，我还是松开了手。就算在这里打碎它的身体，很快也会有另一个一模一样的走出来，把地上的残骸吃掉，扣下扳机什么也改变不了。\n\n“真是少见的做法呢，晓美焰。”丘比偏过头，声音直接响在了我的脑海里，“为了度过悲叹之种的短缺，你打破了魔法少女各自狩猎的习惯，让她们去荒野里聚在一起分担诅咒。从结果来看，灵魂宝石浑浊的速度确实慢了不少。”\n\n“这和你没关系，从我眼前消失。”\n\n“我实在无法理解。”它摇了摇尾巴，“以前魔法少女独自战斗，就算最后变成魔女，也不过是一个人份的绝望。现在你用军管把她们联系在一起、互相依赖……要是外界的压力继续增加，其中有谁先撑不住，在最信任的朋友面前变成了魔女，剩下的那些孩子会露出什么表情呢？那时候产生的连锁绝望，说不定会比以前多得多。”"
MGU_homura.6.a: "§1“……别再出现在我面前。”§!"

MGU_homura.7.t: "余烬"
MGU_homura.7.d: "烧塌的屋檐底下，风里还留着魔女结界散去后的怪味。我原本是怕二木市最先成为丘比口中崩溃的缺口，才带队赶过来，却先一步在瓦砾里看见了小圆，她正弯下腰，从灰烬里捡起一枚发卡。\n\n“……别碰她的东西！”阴影里走出一名二木市的魔法少女，武器指着我们，“神滨那些人骗她说有救了，结果害死了她；现在见泷原的人又跑来说要把这里管制起来……你们嘴里说的希望，为什么每次都要让我的朋友去死啊？！”\n\n我跨前一步想挡在小圆前面，手臂却被她按住了。小圆擦掉发卡上的灰，迎着枪尖递到对方面前：“……对不起，死去的人已经回不来了，我也不知道该怎么道歉才好。……可是，把这么重要的发卡一直丢在这里，她一定会很寂寞的，还是由一直记着她的你来收着，好不好？”\n\n二木市的少女盯着发卡站了一会儿，伸手夺过去按在胸前，收起武器转身走进了巷子。看着身旁松了口气的小圆，我却怎么也安心不下来。我越是用强硬的手段去维持秩序，小圆就越会像今天这样，主动走到枪口前面去保护别人。"
MGU_homura.7.a: "§1“……我们回去吧，小圆。”§!"

MGU_homura.8.t: "灯火"
MGU_homura.8.d: "离开二木市后，我连夜去神滨确认原议会成员的动向。路过七海八千代的住处时，屋里的灯还亮着。\n\n灯光从窗帘缝隙里透出来，餐厅里很热闹，环彩羽正把刚煮好的晚饭端上桌，有些苦恼地讲着白天在荒野迷路的事。几名年轻的魔法少女被她逗得笑出了声，连平时很少笑的七海八千代也弯了弯嘴角。就算没了议会，她们依然在这片屋檐下，替彼此留着一个能回去的家。\n\n门忽然从里面拉开了，七海八千代站在门口看着夜色里的我：“站在外面不冷吗，晓美焰？晚饭刚做好，要进来一起吃吗？”\n\n屋里的笑声停止了。餐桌旁，一名刚从荒野回来的女孩看见门外的我，脸色立刻变了，赶紧把手往身后藏，想遮住颜色已经变暗的灵魂宝石。那种警惕又畏惧的眼神，和当初她们看向玛吉斯时一模一样。屋里的灯光太亮了，我退了一步，站回门外的影子里。"
MGU_homura.8.a: "§1“不了，我还有事要处理。”§!"

MGU_homura.9.t: "代价"
MGU_homura.9.d: "停运源翠石之后，圣杯王国的反应比预想中来得更快。神滨东北边的博丽先代港口托管领关闭了贸易口岸，盘踞在西北内陆雨林里的露丝契亚远征军也开始向边境调兵。\n\n“结果还是老样子嘛。”佐仓杏子靠在围栏上咬了一口苹果，“不管是丘比那家伙，还是圣杯王国的人，嘴上都说得那么漂亮，好像全都是免费送给你的一样，等到翻脸的时候，要拿走的东西比给出来的多得多。”\n\n巴麻美站在她旁边，夜风吹过时，金色丝带在身侧展开，几支燧发枪随之浮现出来。“以前总靠着圣杯人的支援，以为交出源翠石，大家就能一直平平安安地过下去。”巴麻美说，“既然不打算再靠别人施舍，接下来的风浪，就只能靠我们自己坚持到最后了呢。”\n\n话音刚落，后面的传令员跑了过来。博丽先代的封锁切断了最后一批外洋药品和物资，二木市与神滨的边缘街区已经开始骚乱。丘比说过的事，已经开始发生了。"
MGU_homura.9.a: "§1“通知大家，随时做好迎战准备。”§!"

MGU_homura.10.t: "深夜"
MGU_homura.10.d: "深夜的见泷原彻底静了下来。我独自坐在桌前，左手手背上的灵魂宝石还蒙着一层暗影。\n\n窗沿上那双红眼、二木市迎着枪尖递出发卡的小圆、神滨灯光下藏向背后的手，还有东岸博丽先代的封锁和西北雨林里步步压过来的露丝契亚远征军，这些麻烦全都同时压了过来。我原本以为，只要握紧权力、关上大门，就能替小圆挡住外面的危险；可事实却是，死守在这条狭窄的海岸线上，绝望只会在城里越积越多，迟早把小圆也一起卷进去。\n\n不能再等包围网收紧了。一直守在这里，只会迎来缓慢的毁灭。在一切真正失控之前，我必须先一步走出去，亲手清除外面的威胁。"
MGU_homura.10.a: "§1“只要能保护小圆，什么手段都无所谓。”§!"

MGU_homura.11.t: "石子"
MGU_homura.11.d: "贸易切断后的第一个月，神滨商业街的骚乱终于爆发了。\n\n几十名断了货源的商人与市民堵在配给站门前，把军需车队围住，大声要求指挥部向圣杯王国道歉、交还源翠石矿脉。美树沙耶香挡在车前，急着向人群解释：“大家再忍耐一段时间！只要我们收回博丽先代的港口，就再也不用受欧洲人的威胁了！”\n\n“说得倒是好听！得罪了圣杯，没有她们的药和粮食，我们连这个月都熬不过去！”人群里飞出一块石子，砸在沙耶香额头上。她额头流了血，握着剑站在原地，终究没向普通人挥出去。\n\n我拨开人群走上前，抬起手枪朝天开了一枪。枪声响过，街上静了下来，人群慌张地散开了。\n\n“看清楚了吗，美树沙耶香。”我看着地上的石子，“在她们眼里，你的命还抵不上一船从海对面运来的货物。去把伤口包扎好，今晚突袭博丽先代。”"
MGU_homura.11.a: "§1“谁敢再拦军车，一律按战时法处置。”§!"

MGU_homura.12.t: "白旗"
MGU_homura.12.d: "博丽先代的驻军没什么防备。天亮前，我们突破防线，控制了港区。美树沙耶香第一个冲进仓库街，一剑劈开大门上的铁锁，朝里面喊道：“大家没事吧！幻想乡的驻军已经被我们赶跑了！”\n\n仓库门打开了，走出来的居民却没一个看起来高兴的。镇长和几名富商举着临时扯下来的白布，慌张地推开沙耶香就往外挤，对着海面上正在撤离的托管领船只大喊，求她们别丢下港口。\n\n“你们为什么要打进博丽先代啊？！”一个商人冲着满身是伤的沙耶香吼了起来，“把欧洲人得罪死了，露丝契亚的远征军马上就会打过来！你们这群怪物，想拉着全城人一起陪葬吗？！”\n\n“你这家伙……再说一遍试试！”佐仓杏子一把揪住他的衣领，长枪直接顶到了脖子前面。\n\n“杏子，别这样！”跟着医疗队赶过来的鹿目圆赶紧挡在中间。她转过身，红着眼睛强忍着没哭，向充满敌意的居民道了歉，随后蹲下来替发愣的沙耶香包扎伤口。\n\n哭闹声还在继续，我望向西北边的雨林。那个商人说得没错，盘踞在内陆腹地的露丝契亚远征军主力，恐怕已经开始行动了。"
MGU_homura.12.a: "§1“不要在港口久留，全军向西北边境集结。”§!"

MGU_homura.13.t: "出征前夜"
MGU_homura.13.d: "进入西北内陆雨林的前一晚，巴麻美把前线的小队长叫进营帐，挨个倒了杯红茶。她像平时那样嘱咐完行军细节，直到年轻的后辈们放心退出去，脸上的笑容才慢慢收了起来。\n\n她提着茶壶站在桌边，再往杯里倒水时，她的手腕突然发抖，茶水洒了出来，弄湿了桌布。\n\n“……抱歉，让你看到失态的样子了。”巴麻美放下茶壶，看着自己失去光泽的黄色宝石说道，“以前讨伐魔女的时候，不管多危险，心里至少清楚自己是在救人。可明天进了那片雨林，我们要面对的是远征军的正规军，是一群和城里市民一样、有血有肉的普通人。”\n\n“杀死人类不会掉悲叹之种，只会让那些孩子的灵魂宝石在愧疚和恐惧里变黑。晓美同学，把大家推上这样的战场……我们真的还能算是魔法少女吗？”\n\n我看着洒在桌布上的茶水：“天亮前全军出发。如果不想看后辈们死在雨林里，明天就别留手。”"
MGU_homura.13.a: "§1“……早点休息吧，巴麻美。”§!"

MGU_homura.14.t: "消耗"
MGU_homura.14.d: "亚马逊内陆的雨林闷热得让人喘不过气，露丝契亚远征军守着密林河道层层布防，把北上的路封得严严实实。\n\n一名神滨的年轻魔法少女在躲避炮击时耗尽魔力，摔进了积水的弹坑里。她捂着胸口，手不停地发抖，灵魂宝石已经发黑，眼看就要撑不住了，可倒在四周的全是远征军士兵，这片战场上，一枚能用来净化的悲叹之种也找不到。\n\n“撑住！别在这儿放弃啊！”美树沙耶香架起剑替她挡住侧面射来的子弹，自己的呼吸也已经彻底乱了。\n\n不能让任何人在我眼前变成魔女。我转动左腕上的圆盾，沙漏停住的那个瞬间，炮声全停止了，飞溅的泥点、雨水和空中的火光全部停在了原地，整片密林里只剩我一个人的脚步声。\n\n我穿过林间，把捆好的炸药一处接一处放进远征军的炮兵阵地。时间重新流动，密林深处接连炸开火光。我抬起左手，手背上的灵魂宝石已经明显变黑了。"
MGU_homura.14.a: "§1“继续向北推进，目标新安普敦。”§!"

MGU_homura.15.t: "新的边界"
MGU_homura.15.d: "新安普敦和哈芬利斯的港口相继易主，露丝契亚远征军的残部终于彻底撤出了这片大陆。可站在刚刚接管的哈芬利斯哨所里，看着桌上重新画好的疆域图，指挥部里却没有一个人笑得出来。\n\n过去许多年，正因为有露丝契亚这片辽阔的内陆领地挡在中间，我们才不用直接面对大陆上的其他强权。现在这块缓冲带被我们亲手吞了下来。北边哈芬利斯界碑之外，直接挨着阿德莱希帝国的国境线；西边雨林尽头，名为夜莺的亡灵国度近在咫尺；南边的莉兰迪亚也开始向边界增兵。\n\n“真是一场了不起的胜利呢，晓美焰。”\n\n丘比不知何时蹲在了哨所窗台上，看着桌上的地图：“为了打穿这片雨林，你们耗尽了所有储备。作为胜利的奖赏，整片大陆最危险的邻居，现在全都直接到了你们边界外。现在你们失去了缓冲带，也拿不出多余的悲叹之种。等四面八方的敌人同时打过来，照这样下去，你的同伴们还能支撑几天呢？”"
MGU_homura.15.a: "§1“……传令全军，立刻接管所有新边境防线。”§!"

MGU_homura.16.t: "船期表"
MGU_homura.16.d: "新安普敦的总督府有一整面落地玻璃，阳光照在地毯上。过去，露丝契亚远征军的军官最喜欢在这间花房里招待魔法少女，用甜点和客套话许诺永恒的友谊。\n\n美树沙耶香站在花房中央，手里拿着一叠从电报室翻出来的船期表和撤退训令。透过窗框看出去，港口边本该用来防备阿德莱希帝国的城防重炮早已被拆卸一空，留下的船先前一直在昼夜不停地装运最后一批源翠石。训令写得很明白：一旦阿德莱希或莉兰迪亚越境，远征军不承担防卫联盟的义务；只要港口吃紧，立即炸毁设施，抛下联盟撤回圣杯本土。\n\n“……城里那些人，之前明明为了她们朝我们扔石头来着。”沙耶香盯着茶盘里的冰糖说道，“大家一直以为，只要乖乖听话，这群人就会留下来保护所有人的……”\n\n“只要几句好听的约定，就能让一群十几岁的女孩子心甘情愿替她们战斗，世上哪有比这更划算的交易呢。”巴麻美站在窗边，望向窗外的港口，“如果晓美同学没有提前动手把这里夺下来，等到邻国打进来那天，这间漂亮的花房连同整座城市，都会被她们随手丢进火海吧。”\n\n“童话已经结束了。”我从茶桌旁走过，推开背面通往地下军火库的铁门，“她们没来得及运走的武器都留在这里，全部拿来用吧。”"
MGU_homura.16.a: "§1“清点所有军火，运往南部边境。”§!"

MGU_homura.17.t: "铁塔"
MGU_homura.17.d: "郊外废弃工厂的铁塔下，最后一记枪响过后，像剪纸拼贴一样的魔女结界碎成纸片消散了。\n\n周围变回了原来的工厂空地，地上积着污水，到处是管道和冷却塔。佐仓杏子喘着粗气，弯腰从污水里捡起刚掉落的悲叹之种，外壳布满裂纹，还没吸走多少污浊就没了光泽。\n\n“开什么玩笑……为了追这只躲在下水道里的魔女，我们可是追着它跑遍了整个城区啊。”杏子把报废的悲叹之种扔回地上，回头看向坐在铁梯上的几名神滨后辈。经过前阵子雨林里的恶战，几乎每个人的灵魂宝石都浑浊得像块脏玻璃。\n\n铁塔高处的横梁上，丘比正往下看着我们：“这也是理所当然的结果。你们为了保护联盟许愿换来魔力，结果却把魔力消耗在不产悲叹之种的人类战争里。无论初衷多美好，只要继续战斗下去，你们当初许下的愿望本身，就会把你们逼进绝境。”\n\n没人反驳。在阴影里，连最不服输的美树沙耶香，也只是按住了胸口的灵魂宝石。单靠猎杀野外的魔女，已经救不了这支军队了。"
MGU_homura.17.a: "§1“……回神滨。去把那个东西挖出来。”§!"

MGU_homura.18.t: "妥协"
MGU_homura.18.d: "我又回到了神滨地下的观测室里。\n\n“我就知道你迟早还会再回到这里呢，晓美焰！”里见灯花坐在高脚椅上，晃着悬空的双腿，“看来你总算肯动脑子了，终于明白单靠正义感和狩猎，根本补不上灵魂宝石的消耗了吧？”\n\n“我不是来认错的。”我把哈芬利斯外围废弃矿区的图纸按在玻璃上，“二木市会变成那样，是因为你们像把反应堆建在自家后院一样，把EVE放进了城市中央，让普通人去承受它排出来的诅咒。现在，我要把核心拆到北边与阿德莱希接壤的无人矿区，用夺回来的源翠石驱动它。”\n\n里见灯花凑到玻璃前查看图纸上的等高线和边界线：“用源翠石压住前线魔法少女的浑浊，再把转化出来的绝望和人工魔女，像排污一样直接倒进阿德莱希帝国的国境线……哼，没想到连你也能想出这种折中方案嘛。这么一来，见泷原和神滨确实都不会再受波及了。”\n\n她抬起头，隔着玻璃看着我：“不过呢，这可就等于亲口承认玛吉斯的理论是正确的咯！你根本没能消灭诅咒，只是学会了和诅咒做交易而已。而且，总得有一名魔力够强的魔法少女长年留在北方那个地底矿坑里看管核心，你打算让谁去当这个守墓人呀？”\n\n“只要之前的牺牲没有白费，算交易还是算妥协，我都无所谓。至于看管核心的事，我自己去就行了。”我收起图纸。"
MGU_homura.18.a: "§1“三天之内，把核心运往北方。”§!"

MGU_homura.19.t: "开往南线的列车"
MGU_homura.19.d: "清晨的见泷原依然干净、明亮。玻璃天桥底下，花园里的洒水器正在喷水，原本放学后满是学生的林荫道上，如今排起了一队队换上军装的普通青年。她们背着远征军留下的步枪，沉默地穿过街道，走向不远处的车站，开往南部边境的运兵列车正停在那里。\n\n“以前我总觉得，只要我们魔法少女拼命战斗，大家就能一直留在这座漂亮的城市里，什么残酷的事都不用知道。”\n\n天桥栏杆旁，美树沙耶香看着下面渐渐远去的队列：“可昨天听说以后要把常规战壕全交给普通人守、让我们退回后方保存魔力的时候……我心里居然松了一口气。因为怕自己变成魔女，就默许把脆弱的普通人推上战场……麻美学姐，我是不是已经变成自己最讨厌的那种大人了？”\n\n“……没有那回事哦，美树同学。”巴麻美站在她旁边，望向郊外的工厂铁塔，“我们从一开始就不是无所不能的神明。承认自己做不到、把本就属于人类的责任还给她们，听上去是很残忍，却是唯一能让大家都活下去的办法呢。”\n\n风吹过天桥，不远处的站台传来汽笛声，开往南线的列车驶出了车站。我从她们身后走过：“南线交给凡人守备队。收拾装备，准备北上吧。”"
MGU_homura.19.a: "§1“主力随我前往哈芬利斯。”§!"

MGU_homura.20.t: "不要把我留在阳光里"
MGU_homura.20.d: "傍晚的太阳照进走廊。小圆站在窗边的阳光里，我停在窗框投下的影子里，脚边放着带去北方矿区的行李。\n\n“大家都安排好要去的地方了呢。”小圆看着桌上的部署图，“普通人去了南边，麻美学姐和八千代小姐去了西边……只有北方那个矿坑，还有从神滨搬过去的那个装置，小焰留给了自己。”\n\n“我的时间魔法最适合控制核心。小圆留在见泷原，像平时一样待在有阳光的地方就够了。”\n\n“小焰总是这样，把所有辛苦和危险的事都一个人背在身上，以为只要不让我看见，我就能一直开心地笑下去。”\n\n小圆向前走了一步，离开窗边的阳光，站到我这边，拉住了我的手。\n\n“二木市的废墟，港口那些人哭喊的样子，还有大家为了活下去不得不做出的妥协，我都亲眼看见了。知道世界真正的样子以后，就没办法再假装什么都不知道，退回以前的美梦里去了。”她抬起头看着我，“……所以，别再把我一个人留在阳光里了，小焰。这一次，让我也跟你一起去北边吧。”"
MGU_homura.20.a: "§1“……唯独那个地方，我是不会带你去的。”§!"
