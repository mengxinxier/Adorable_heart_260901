  MGU_D_resist_3_LHS_desc:0 "那些公社的暴徒们入侵了我们的家园，破坏了我们的民主，摧毁了我们的自由，让我们香甜的空气，染上了战火的硝烟。\n她们或许很强大，但我们也绝不会就这么将我们民主的果实让给那些侵略者。我们将战斗！令那灯塔长明，为了自由！为了民主！。"

  MGU_D_resist_4_LHS:0 "对公社的抵抗（自定义规则AI强化IV）"
  MGU_D_resist_4_LHS_desc:0 "那些公社的暴徒们入侵了我们的家园，破坏了我们的民主，摧毁了我们的自由，让我们香甜的空气，染上了战火的硝烟。\n她们或许很强大，但我们也绝不会就这么将我们民主的果实让给那些侵略者。我们将战斗！令那灯塔长明，为了自由！为了民主！。"

  MGU_War_DiKang_1942_LHS:0 "反击时刻"
  MGU_War_DiKang_1942_LHS_desc:0 "莉兰迪亚公社在赢得了内战的胜利之后，拒绝走上和平发展的道路，忽视了人民渴望和平的愿望与追求。她们以解放的名义，入侵了我们的国家，将数以万计的生灵推入战争的深渊。魔法少女联盟必须挺身而出，阻止她们继续扩大那可怕的战火，在持久的战争中，公社的部队已经受到了严重的损失，是时候发动战略反击了。将掀起这场战争，造成地区动荡的罪魁祸首，彻底击败！让南美洲的人民，重新获得安宁平静的生活！让南美洲获得和平发展的未来！"
