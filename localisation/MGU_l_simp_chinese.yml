 POLITICS_AKIMI_HOMURA_DEMO_DESC:0 "在漫长的魔法少女生涯中，晓美焰领悟到，越是仔细计划，就越会被计划外的意外因素所阻碍，魔法少女是有极限的，除非超越魔法少女。所以她不做魔法少女了。"
 POLITICS_MGU_MADOKA_DESC:0 "不知何时从何处降临的，所有人都没见过的粉发魔法少女，金色的双瞳看起来十分温柔，只是看着她的身姿就让人有一种安心感，尽管绝大多数人表示无法理解，晓美焰还是决定将自己的领导权出让给她。有细心的魔法少女发现鹿目圆香的头发有的时候长到看不到边际，有的时候是正常的及腰长发，不知道是什么原理。"

MGU_GATHERING_STORM_DESC: "“快签订契约，成为魔法少女吧。”可爱的幻兽QB如此说到，为一代代人，赐予神迹，赐予希望，赐予美好的童话。轮回，为她人带去希望，衰败，迎接命定的绝望。看那城邦兴盛，在美好的祝福中繁华昌荣，亦在少女的绝响中，与未来过去的记忆一同化作混沌的灰烬。抉择的对错已被流放，是非真伪的边界也在偏执中模糊，无人能摆脱这早已种下的因果，在命运的枷锁之中沿着命定的脚步无数次的循环。\n可曾愧疚，可曾悔恨，无人铭记，无人知晓，少女们的故事随生命一同于无人的角落腐败，善良的魂灵在无助的惊啸中化作癫狂的妖魔。无人评价错对，在那由魔法少女的希望与绝望铺就的国度中，只余那虚构的精美童话传唱千年。“快签订契约，成为魔法少女吧”。\n"
MGU_start_game_text: "重复的轨迹"
MGU_route_guide_desc: "§1晓美焰线§!：在游戏开始前的§R自定义游戏规则§!，中、南美国家AI行为，魔法少女联盟的选项中，选择§1全国领袖晓美焰§!，然后在开局的国策事件‘§L恍如昨日§!’中选择‘§L维持军事管制§!’。\n\n§C民主线§!：在开局的国策事件中选择‘将权利还给议会’。\n后续不要点‘§L又一场战争……是我们如何也承受还不起的§!’\n以及‘§L希罗没能阻止她，炸弹被引爆了，爆炸波及了整个议会§!’\n根据不同的选项会有‘巴麻美’、‘七海八千代’、‘梓美冬’、‘和泉十七夜’4位不同的民主总统，总统决策会有差异。\n\n§Q红线§!：\n顺着国策点，在事件“向北方”中选择：§R总之，我不能允许这种鲁莽的行动，八千代§!，并在之后的事件“虚妄侵染的议会”中选择：又一场战争……是我们如何也承受还不起的。\n\n\n\n————————————————————\n\n§4月代雪§!：先选择支持魔联议会，然后选择和玛吉斯谈判，随后在和平解决（给彩羽环一个机会）后，出现“晌午”事件选择爆炸波及会场，等待事件链结束即可进入。§R注意：为了正常的游戏体验，在内战结束后请尽快在决议栏里找到和远征军谈判的选项并加入阵营！§!"

#
  MGU_route_guide_1_txt: "§1晓美焰线§!：需要在§Y1935年内战§!中选择国策“§Y那笔直的炼狱之路§!”在内战中支持议会，让军方的团结度和忠诚度维持在较高的级别，且见泷原决不能沦陷，其他方面不需要特别注意，在内战结束议会要求交还权力时，选择“§Y维持军事管控§!”即可进入晓美焰线，在内战时推荐任命“鹿目圆”或“巴麻美”作为副领袖，鹿目圆可以缓解晓美焰的§Y压力等级§!，巴麻美可以提供额外的军队忠诚度。"
  MGU_route_guide_2_txt: "§R魔联红军线§!：在1935年内战中选择§Y死亡与希望的火花§!，在内战中尽可能的提高§Y阵营正统性§!，适当的分配§Y莫拉莱丝上校§!的行动力，各项行动的结果是在内战开始时决定的，需要读取内战开始之前的存档才能改变行动的结果。"
  MGU_route_guide_3_txt: "§b战帅黑线§!：在1935年内战时，选择“§Y深红与决断的真夜§!”，在内战中尽可能快的击败敌人，注意大庭树里的精神状态，不要让她陷入永久的疯狂，尽量在1936年之前统一国家。"
  MGU_route_guide_4_txt: "§L魔联议会线§!：在1935年内战中选择“那笔直的炼狱之路”，并增加§G议会团结度§!并降低§R议会不满度§!，过高的§R不满§!会不利于§G团结§!，副领袖推荐选择“七海八千代”并且“和泉十七夜”，八千代会提供额外的议会团结度，十七夜会强化§Y安抚议会§!决议的效果。在内战结束后，选择将权力归还给议会。并在随后的事件中选择§R反对§!§Y玛吉斯之翼§!，在击败玛吉斯之翼后，进行§Y盟主选举§!。\n\n议会-建制派：如果想要建制派上台，在盟主大选时，需要将§Y议会团结度§!提高到（§G团结一致§!）以上。\n§C七海八千代§!：在1935内战中选择七海八千代作为副领袖，并且大选时§Y议会团结度§!提高到（§G团结一致§!）以上。\n§R和泉十七夜§!：在1935内战中选择和泉十七夜作为副领袖，并且大选时§Y议会不满度§!维持在（§G心平气和§!）以下。\n§Y巴麻美§!：在1935年内战时选择巴麻美作为副领袖，并且盟主大选时§Y军方忠诚度§!在（§G坚决服从§!）以上。\n§Y梓美冬§!：在权力交还给议会之后，选择§G支持§!§Y玛吉斯之翼§!，在§Y魔联大使§!到来后，第一个事件选“§Y诱劝§!”第二个事件选“§Y向魔联屈服§!”，在盟主大选时§Y议会团结度§!在（§R一团散沙§!）以下，§Y阵营正统性§!在（§R人厌猫嫌§!）以下。\n§F里见灯花§!：在§Y魔联大使§!到来后，第一个事件选“§R让我们敞开天窗说亮话吧？结束这场哑谜吧！§!”，然后在战场上击败议会的联盟军，实际上不需要主动进攻，只要拖到1938年1月就可以直接吞并魔联议会。\n环彩羽：在§Y魔联大使§!到来后，第一个事件选“§Y诱劝§!”，第二个事件选“§Y开弓没有回头箭§!”第三个事件选“§R为时已晚，玛吉斯之翼！§!”并在战场上尽快击败玛吉斯之翼的部队。\n§R誓约之血§!：盟主选举时，议会团结度在（§R一团散沙§!）以下，议会不满度在（§R怒火中烧§!）以上，阵营正统性在（§R人厌猫嫌§!）以下。\n§Y联盟分裂§!：如果盟主大选时，没有满足以上任何条件，魔联将会分裂成一个个的小型城邦。那就完蛋啦，没得玩了。\n\n鹿目圆线：在1935年内战时任命鹿目圆为副领袖，内战结束后议会要求交还权力时，选择§Y维持军事管制§!，且阵营正统性至少达到（§G众望所归§!）级别（§R该路线尚未完成，暂不可使用§!）\n§4月代雪§!：先选择支持魔联议会，然后选择和玛吉斯谈判，随后在和平解决（给彩羽环一个机会）后，出现“晌午”事件选择爆炸波及会场，等待事件链结束即可进入。§R注意：为了正常的游戏体验，在内战结束后请尽快在决议栏里找到和远征军谈判的选项并加入阵营！§!"
