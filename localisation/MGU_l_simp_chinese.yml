 MGU_his_page_01_title:"魔法少女与魔女"
 MGU_Country_History_Page_01:"\n在来自旧世界的探险家揭开§G新大陆§!的神秘面纱之前，§P魔法少女§!和§1魔女§!的故事已在新大陆的土地上流传了将近千年。\n§1魔女§!，§G南美洲§!的居民习惯于将其形容为一种“§Y自然灾害§!”。没有人知道其从何而来，为何出现，它们造形奇异、恐怖且带有异样的美感，总会在不经意间席卷人类的聚居地并吞食人类。在第一批前往§G南美洲§!的探险者们的记载中可以得知，每只祸乱人间的§1魔女§!几乎都有着某种极端化的情绪特征。将其称之为§R灾难§!的另一个原因在于，§1魔女§!会随着吞食的进行扩张其力量——它们会放出自己的使徒，被§P魔法少女§!们称之为“使魔”的存在。如果不加以阻止，一只§1魔女§!便有可能轻而易举的摧毁一个大型的城镇集落——更别说人口稀缺的殖民地了。\n但是，对于居住在这片大陆上的人类来说，情况并非如此绝望，因为在§1魔女§!肆虐之时，§P魔法少女§!们便会挺身而出。\n§P魔法少女§!与制造她们的存在——§gQB§!究竟是何时出现在这个世界上的，这个问题已不可考。早期的西方文献将其描述为“因§1魔女§!的存在而生的与§1魔女§!相对立的种群。”现在可以确定的是，§P魔法少女§!是接受了§gQB§!的召唤、得到了异于常人的强大力量的少女。\n成为§P魔法少女§!的过程是自愿的，而愿意接受力量的年轻少女——几乎集中于7岁到18岁——一般都有着难以言喻的隐情，因为真正促使她们成为§1魔女§!猎手的，是§gQB§!——被称为“§g丘比§!”的未知造物的承诺：§g签订契约§!，成为§P魔法少女§!，便能够实现一个§Y愿望§!。\n某种程度上说也是因为这个原因，§P魔法少女§!的数量较少，一个大型的，有着数十万人居住的城镇一般也只有百人左右的§P魔法少女§!予以保卫。但她们能够有效的从§1魔女§!的手中保护在后者面前几乎没有反抗能力的人类。\n即便如此，在§1魔女§!集中肆虐的伯西尔地区，§1魔女§!的横行使得当地难以形成一个统一的原始政权。在§P魔法少女§!保护人类的长久历史间，当地人类对§P魔法少女§!的态度颇为复杂——甚至有部分人类 认为§P魔法少女§!是§1魔女§!灾祸的根源——尽管没有证据可以证明这一点，但现实是§P魔法少女§!活动的区域§1魔女§!确实如影随形——怀有如此观点的人通常会选择外迁至相对安全太多的其他地域，这使得伯西尔地区的人口增长几乎持续着稳定而长久的流失，人口总数也停滞不前。\n出于多种原因，以早期集落为基础，伯西尔地区的原住民在千年间在当地慢慢建立起数个大型城邦。而§1魔女§!-§P魔法少女§!这种童话书般的二元对立让当地社会慢慢出现了特殊的嬗变——城邦中的§P魔法少女§!承担起保卫城邦安全的任务——虽然大多数时候是对抗§1魔女§!的袭击，但并不仅限于此。作为一个整体，§P魔法少女§!们承担起“保卫者”的责任，在城邦内承担起绝大多数的军事职责。而大多数的人类居民则作为生产者在城邦内部进行农业与手工业的生产活动。而§P魔法少女§!内部也会以能力强弱为标准选举出领导她们的领袖——当然也会是城邦的领导者。除了交通不便等外部因素，城邦间的地域主义使得城邦割据的局面长久存在，但是§P魔法少女§!的城邦间很少出现高烈度的流血冲突——周期性的超大型灾害，即“§1魔女§!之夜”让整个地区的§P魔法少女§!必须能够在某个时刻能够动员并集合起来，否则她们与她们的城邦便会遭遇灭顶之灾。\n有关资料指出，尽管这种选举方式与选举标准几乎完全会导向君主或僭主政治，但出乎预料的是，历史上在各个城邦担任领袖的§P魔法少女§!们对国家的统治时间极其短暂。城邦领导者的换届相当频繁——通常只有2-4年，这是因为§P魔法少女§!的平均寿命极其短暂——在历史上，能够存活至30岁以上的§P魔法少女§!屈指可数。绝大多数§P魔法少女§!要么死于抵御§1魔女§!的战斗中，要么因为魔力的耗尽而失踪。而有违直觉判断的是，担任领袖的§P魔法少女§!更加难以幸存，她们通常都会站在对抗§1魔女§!的第一线，但§P魔法少女§!的魔力会随着年龄的增长而逐渐流失。在这种凄凉而无可奈何的现实困境下，伯西尔地区的§P魔法少女§!城邦拥有着长久的§C民主传统§!：有能力带领同伴从§1魔女§!的威胁中保护城邦的§P魔法少女§!会被推举为§Y领袖§!，然后在一场意外或者无可奈何的失败后重复这一§Y循环§!。\n如果没有枪炮、病菌与钢铁，这段§g黑暗的童话§!几乎没有转机可言。"
 MGU_his_page_02_title:"殖民地战争与联盟成立"
 MGU_Country_History_Page_02:"\n大西洋对岸的航海家们将在这片土地生活的人们统称为“§Y伯西尔人§!”。在她们看来，少女们使出的魔法不及蒸汽骑士挥砍的万分之一，更是远远不及灵想兵装随意一击，拥有着坚船利炮的殖民者踏上这片土地，妄想囫囵吞掉这片土地，奴役生活在上面的“§S土著§!”。\n不过用“§O殖民地战争§!”来形容在十七至十九世纪于§G南美洲§!发生的一系列军事冲突其实有待商榷，因为直至十七世纪，早期殖民者根本无法在伯西尔地区建立起殖民据点，她们无法杀死甚至击退那些超自然生物，而被她们视为“§S土著§!”的§P魔法少女§!却可以，出于伯西尔地区的战略地位，旧世界的殖民者转而尝试在§G南美洲东海岸§!建立殖民港。尽管无法扩张在伯西尔的殖民事业，但当地的殖民者并未选择班师回朝，转而尝试§Y接触本地的城邦§!以争取支持，从而保证沿海据点免受§1魔女§!灾害的摧毁。\n在§G南美§!的殖民战争相比于北方殖民地层面的大规模冲突，其表现形式更多是土著政权间的代理人战争。在这片区域——尤其是在伯西尔争斗最甚的是两个实力最为强大的殖民帝国——§F伊比利亚王国§!与§C圣杯王国§!。\n来自§C圣杯王国§!的第一批殖民者于§Y1638年§!登陆伯西尔大陆，因为知晓在此地建立殖民地的难度之大，§C欧洲殖民者§!采取了新的策略——他们试图与诸多§P魔法少女§!城邦建立外交与商业上的联系，在弄清§1魔女§!的奥秘前，利用§P魔法少女§!的力量保护沿海的条约港。当然，在他们初来乍到之时，大多数§P魔法少女§!对欧洲人表现出强烈的敌意。但面对她们王国早有准备——一支约3000人的殖民地军队保护着条约港，在出现了几次武装冲突后，殖民地总督曾计划征服其中几个排外派城邦，但在意识到没有§P魔法少女§!的支持，圣杯殖民者将对§1魔女§!灾害毫无办法后。殖民者还是设法向§P魔法少女§!的领袖们表达了他们的友善态度。\n最终，一支由各个邦国的§P魔法少女§!组成的援助部队以保护条约港和欧洲经济伙伴为由进驻阿雷格里港。这意味着§C圣杯王国§!成功与伯西尔的诸城邦建立起普遍的合作关系。而在其他竞争者眼中，这表示§C圣杯王国§!将这片地区划入了其控制范围。这项合作意义重大，拥有§P魔法少女§!的帮助，§C圣杯王国§!得以将其精干的魔法研究人才送至§G南美§!，时钟塔很快便开始了对§1魔女§!的广泛研究。在普及了对§1魔女§!的认知和抵抗策略后，人类无法抵抗§1魔女§!灾害的时代逐渐成为历史。\n相比之下，另一个老牌的殖民帝国§F伊比利亚§!则一直试图在§G南美§!洲建立只属于它的殖民统治。在伯西尔以北，§F伊比利亚§!建立的沿海据点无论是经济还是军事实力都比势单力薄的圣杯殖民者强悍不少。为了争夺在伯西尔地区的贸易据点，§F伊比利亚人§!设法拉拢到几座并不欢迎§C圣杯殖民者§!的城邦，强行分裂了§P魔法少女§!。并于§C亲圣杯派§!的§P魔法少女§!城邦展开对垒。但是，§P魔法少女§!并不愿意自相戕贼。这场战争应当看作是§C圣杯王国§!与§F伊比利亚王国§!的殖民战争——为了争夺§Y大西洋航线§!的垄断地位。\n两军大大小小的武装冲突持续了将近四十余年，直到1681年§F伊比利亚殖民者§!彻底被赶出当地。\n战争催化了城邦群在各种意义上的现代化——在意识到光靠少数人的魔法难以在真正的战争中立足后，以人类为主的近代化辅助军在§C圣杯殖民者§!的指导编练下在城邦中诞生，而黑火药与枪炮的引进使得对抗§1魔女§!灾害不再只能由位于少数的§P魔法少女§!苦苦支撑。\n不过，在政治方面，§C圣杯王国§!无意于提供帮助，她们一开始乐见于当地城邦分裂情况的存在，这样对于她们的贸易港口与垄断航线来说百利而无一害。\n直到1753年，在接纳了德意志移民并成功进行了西化改革之后，野心勃勃的§L莉兰迪亚王国§!开始向东扩张。这个庞大的帝国在战争伊始便在与§P魔法少女§!的战斗中占据优势。日渐扩大的侵略步伐迫使§C圣杯王国§!再一次从各地动员出一支庞大的殖民地军队介入了战争，为了保护§C王国§!在当地的贸易特权向§L莉兰迪亚§!发动了攻势。\n来势汹汹的§L莉兰迪亚王国§!被§C圣杯王国§!-§P魔法少女联军§!堪堪击退，但麻烦接踵而至——只存在于传说之中的，特大规模的§1魔女§!灾难，“§0魔女之夜§!”第一次为人类所观测到。§P魔法少女§!们为了击退§0魔女之夜§!而付出的伤亡难以估算。\n在那之后，城邦之间的联合开始提上日程。但这个过程注定漫长而曲折。\n至十九世纪，以两个最大的城邦市——神滨市与二木市为核心。§P魔法少女§!在地域上分为了两个松散联合而彼此独立的邦联政权。尽管这个时期浓重的§P魔法少女§!地域独立的理念依旧影响着不同地区的§P魔法少女§!之间的社会联系。但联合一统已是大势所趋。1812年，两大邦联在§C圣杯王国§!的协助与见证下签署了联合条约，§Y神滨市§!将作为首都与联盟中心，而联盟议会则被选址在中央市，一个由§P魔法少女§!们联合起来形成的联邦国家在伯西尔地区诞生。即§Y伯西尔邦联共和国§!，或按她们自己的称谓来——§P魔法少女联盟§!。"
 MGU_his_page_03_title:"联盟内战与玛吉斯之翼"
 MGU_Country_History_Page_03:"\n虽然二十世纪初的伟大战争并未波及至这片§P魔法少女的净土§!。但是，联盟的内部正面临激荡。\n随着对伯西尔地区§1魔女§!灾害的研究深入，越来越多的欧洲学者指出，§P魔法少女§!与§1魔女§!存在着同源性。国内的人类民众对统治者的信心产生了动摇。尽管在战后十余年间，联盟的领导层们一直在试图缓和这日趋严重的不信任。但§1魔女§!化真相最大的破坏性，来自于§P魔法少女§!自身。\n1929年，三位§P魔法少女§!第一次设法从§gQB§!口中真正弄清了§1魔女§!化的真相——所谓“§P魔法少女§!”，本意乃是“§0成长中的魔女§!”。§1魔女§!实质上便是§P魔法少女§!在灵魂崩溃后的姿态。在被当作为§P魔法少女§!的核心的§Y灵魂宝石§!中，因消耗了希望与魔力所积累的污浊达到极限时，§Y灵魂宝石§!会破碎并转化为§0悲叹之种§!，§P魔法少女§!便会转化为§1魔女§!。\n从三人了解真相的开始，“§P魔法少女的拯救§!”便被提上了日程。以此为开始，致力于解决§1魔女§!化问题的§P魔法少女§!神秘结社“§Y玛吉斯之翼§!”在神滨成立。\n从1930年开始，整个伯西尔地区的§1魔女§!灾害开始向神滨迁移。短短不到一年，神滨内部聚集了超过全国半数的§1魔女§!灾害。这个现象对神滨市以外的§P魔法少女§!城邦造成了毁灭性的打击。大批§P魔法少女§!因为没有§1魔女§!的“悲叹之种”而最终§1魔女§!化。§1魔女§!的锐减更造成了§P魔法少女§!为了争夺生存空间而开始的自相残杀。情况最为严重的是与神滨市相对的原本同样作为经济重镇的二木市。在神滨之乱结束后，该市人口从原先的两百余万锐减至六十万。这造成有史以来的首次，§P魔法少女§!之间出现前所未有的敌对局面。\n在遭受联盟镇压以后，“§Y玛吉斯之翼§!”被迫离开神滨市，北上前往汤国市与博望洲。但在她们离开时，已有大批§P魔法少女§!加入了这一结社，这使得其从所谓“社团”转变为“武装”。而她们无意改变这一事实——§Y玛吉斯之翼§!自此开始尝试推翻§P魔法少女联盟§!。\n§Y1931年§!，为了缓和两大市之间的矛盾，联盟议会推举二木市的§P魔法少女§!领袖§Y红晴结菜§!出任联盟议长。但后者对神滨市§P魔法少女§!的怨恨以及在当地的势单力薄使得她在实质上被§C议会§!架空。眼见无法通过援助二木市乃至其他受灾地区§P魔法少女§!的议案。红晴结菜与搭档大庭树里发动了一场并不成功的政变，这使得愤怒的联盟议会投票弹劾了二木市的§P魔法少女§!代表。\n这一并不理智的处理，其后果是灾难性的。很快，分离主义情绪从二木市开始传播，转眼间便席卷了主要城市以外的几乎所有联盟邦国，议会对此的冷处理则无疑是加快了这一灾难的脚步。§Y1933年§!“PROMISED_BLOOD”的领导人红晴结菜高调宣布脱离联盟领导，“分离主义”在联盟进入高潮。随之而来的大批旧城邦的§P魔法少女§!公开或暗中拒绝出席议会。§C神滨议会§!眼见事态超出控制，内战迫在眉睫，便开始主张与分离主义者谈判。但南方忠于议会的§Y见泷原邦§!与北方代表协约国的港口托管领均支持武力镇压分离主义叛乱。\n在协约国的政治与物资支持下，见泷原系的§P魔法少女§!成功“说服”议会组建起一支为联盟而战的§Y议会常备军§!。并且，在下一任联盟盟主尚未选出之时，陆军元帅§Y巴麻美§!将暂时出任联盟临时总统与议会军总司令。短短2年内，议会军的雷霆攻势使得大批分离主义城邦回归联盟，§Y巴麻美§!以其强硬冷酷的姿态强化了神滨议会在叛乱各地的权威。尽管“PROMISED_BLOOD”的高层尚未被捕，但该组织也在§C议会§!的政令下彻底退出魔联的政治舞台。\n但联盟的麻烦尚未了结——神滨南部原先已经宣布投降的叛乱军队再一次出现异动，红晴结菜与大树庭里仍在活动，而北方的§Y玛吉斯之翼§!也已积蓄好力量。无论是临时总统§Y巴麻美§!，还是神滨的§C联盟议会§!，她们都必须谨慎的处理好这些遗留问题。走错一步，都有可能导致另一场生灵涂炭的内战爆发。\n\n亦或者，我们可以将目光转向那微不可见的§Q星星之火§!……\n"

