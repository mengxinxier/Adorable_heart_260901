  MGU_Magic_commissar_units:"魔法少女政治委员"
  MGU_Magic_commissar_units_desc:"魔法少女政治委员是伯西尔工农红军独特的重要组成部分，她既发挥了传统政治委员负责党的工作和政治工作的责任，又最大限度的发挥着魔法少女独特的战略作用。"
  MGU_Magic_commissar:"魔法少女政治委员"
  SUBDOCTRINE_Mgaic_Utopian_socialism_army:"公社解放军"
  SUBDOCTRINE_Mgaic_Utopian_socialism_army_DESC:"由空想主义指导的，人民群众自发组建的，以公社平等为信仰，以解放众生为使命，不谋私利、不恋权柄，只为打破桎梏，驱散绝望与压迫。是为所有追寻光明者，筑起理想与救赎的人民军队。"

