  MGU_Soul_Default_end_title: "至此，§1晓美焰§!的旅程嘎然而止"
  MGU_Soul_Default_end_tip: "魔联的盟主--§1晓美焰§!，为了拯救魔法少女联盟，亦或是为了自己的私欲，与死神塔缔结了契约，以获取死神的协助。但是没能完成约定，被死神从人间带走。\n\n但这§G并非终结§!，§1晓美焰§!将以§R见习死神§!的身份继续她的新人生，在那遥远朦胧的未来，若她能还清对死神塔欠下的债务，那时，不知她是否还有机会...完成她的夙愿......\n\n"
  MGU_Soul_Default_end_close_button: "出发！为了死神塔的荣耀！"
  MGU_Soul_Default_end_close_button_TT: "为了死神塔！为了特莉波卡！"
  MGU_Soul_Default_end_tip_2: "而现在，她得先从《见习死神手册》开始学习..."

  MGU_Soul_Complete_end_title: "至此，§1晓美焰§!的旅程告一段落"
  MGU_Soul_Complete_end_tip: "魔联的盟主--§1晓美焰§!，为了拯救魔法少女联盟，亦或是为了自己的私欲，与死神塔缔结了契约，以获取死神的协助。最终完成了约定，被死神赐予了永生。\n\n而这是§G崭新的开始§!，§1晓美焰§!将以§0世界之主§!的身份继续她的新人生，她会，重新定制这个世界的法则与制度，将脑海中的欲望和幻想逐一实现，把这个世界当做她的画卷，将这个统一的世界绘制成她心目中完美的银之庭院\n\n"
  MGU_Soul_Complete_end_close_button: "直至永远..."
  MGU_Soul_Complete_end_close_button_TT: "至于这个世界的未来会怎样...至少...应该不会太差吧。"
  MGU_Soul_Complete_end_tip_2: "现在，未来掌握在她的手中"

  MGU_Silver_Court_end_title: "至此，§1晓美焰§!进入了永恒的梦境"
  MGU_Silver_Court_end_tip: "银之庭唯一的主人--§1晓美焰§!已经进入了银之庭，将自身作为驱动银之庭运作的核心，在这之后，§1晓美焰§!就是银庭中绝对的§O秩序§!。在这以365倍速率进行的美梦之中，她将提供人们想要的一切，人们既可以长久的沉眠于此，亦可以在结束了一天的辛劳之后花上八个小时的现实时间，在银庭之中做一个长达4个月的美梦。如果你愿意的话，银庭也可以让多人进入同一场梦境之中，一同分享你灵魂深处的美好夙愿..."
  MGU_Silver_Court_end_close_button: "沉眠于梦境"
  MGU_Silver_Court_end_close_button_TT: "无所事事的永恒安宁之日"
  MGU_Silver_Court_end_tip_2: "感谢您对魔法少女联盟内容的喜欢与支持！\n魔法少女联盟的制作还是略显仓促，还有诸多没能完善的细节与不妥之处，还望多多包涵。"

