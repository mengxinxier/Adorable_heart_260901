  TBMGU_YH_21:0 "民主之火"
  TBMGU_YH_21_desc:0 "盘踞在中美洲瓦尔哈拉公社，自诩什么人民政权的邪恶国家。我们会让他们见识一下，我们的民主制度的厉害！民主的火炬，将会熊熊燃烧，传播到一个又一个大洲。"
  
  TBMGU_PJ_A1:0 "发展南方地区"
  TBMGU_PJ_A1_desc:0 ""
  TBMGU_PJ_A2:0 "开发丛林地带"
  TBMGU_PJ_A2_desc:0 ""
  TBMGU_PJ_A3:0 "民享之福音"
  TBMGU_PJ_A3_desc:0 "真正的福音是什么呢？这个问题我们探索了很久都没有得到满意的答案。不过现在，我们可以给出回答了。真正的福音，就是人们脸上幸福的笑容，是他们知道未来有了保障时满足的表情，这就是我们的奋斗目标。"
  TBMGU_PJ_A4:0 "人人有工作"
  TBMGU_PJ_A4_desc:0 "我们会保证每一个联盟公民可以获得一份工作，虽然不能完全使他们满意，可这足以确保他们能够获得基本的生活保障，并且在为社会的贡献中寻找自身的价值。"
  TBMGU_PJ_A5:0 "疾病皆退散"
  TBMGU_PJ_A5_desc:0 "从圣杯王国等一系列老牌民主国家中，我们学习到的最宝贵的一项措施就是向人民发放基本的医疗保险。这项措施可以大大缓解人们看病难看病贵的问题。不仅如此，我们还会向医疗业注入更多资金，通过科技与魔法的结合，提高我们的医疗水平。"
  TBMGU_PJ_A6:0 "无人应掉队"
  TBMGU_PJ_A6_desc:0 "一些弱势的社会群体，在曾经都被视为家庭、社会与国家的累赘。可现在，这种情况将不复存在——我们将建立一套基本的社保体系，向这些老弱病残之人发放基本的生活补助，让他们可以维持基本的生活。"
  TBMGU_PJ_A6_txt:0 "需要花费以下资源："
  TBMGU_PJ_A7:0 "欣欣向荣"
  TBMGU_PJ_A7_desc:0 ""
