  MGU_arrow_army_description:"[MGU_arrow_army_description_text]"
  MGU_arrow_army_description_text_1:"§Q神滨第13炮兵师§!\n师长：§Y八云御影§!   总政委：§Y千秋理子§!\n\n原型为伯西尔人民红军第一独立炮兵团，是伯西尔共产党接手军政权利后主动改组至联盟官方编制的第一支重武器部队。\n在七海八千代挥师南下驰援的过程中，与神滨方面军第5炮兵加强旅合兵一处，经七海八千代批准，组建神滨方面军旗下第13炮兵师为进行远程火力支援与覆盖。"
  MGU_arrow_army_description_text_2:"编队构成：§Y银狐战机§!&§Y雌鹿攻击机§!\n\n魔联境内鲜有资深飞行员，但在魔联之外，伯西尔共产党曾公费派遣留学生赴苏。在苏维埃联盟传奇飞行员教官高町奈叶的指导下，绝大多数赴苏飞行员已能熟练操控相当一部分苏式战机。\n28架银狐战机，32架雌鹿攻击机，此次行动几乎出动了魔联境内所有可用飞机。"
  MGU_arrow_army_description_text_3:"§Y宙斯盾海军编队§!——§Q宙斯盾旗舰—赞美号§!\n\n在七海八千代动员部队的过程中，隶属于联盟议会的联盟海军‘宙斯盾’也加入了神滨方面军的行列。\n赞美号，购自圣杯王国于1893年，是魔联现役海军中唯一装备305mm后装线膛炮的巨型战舰，宙斯盾海军编队也是魔联现役海军唯一一队拥有较完整体系化编队的战列舰编队。"
  MGU_arrow_army_description_text_4:"§C神滨方面军§!\n总指挥官：§Y七海八千代§!   副官：§Y八云御魂§!\n\n神滨方面军下辖神滨第10，第11步兵师，中央议会第5步兵师，神滨第17机动步兵师，神滨第5炮兵加强旅（现称神滨第13炮兵师），水名装甲团共计31600人，火炮228门，轻型坦克150余辆。\n\n§C但是，就算再怎么一厢情愿，战斗也总会在某处守候着。所以，除了前进别无他法。§!"
  MGU_arrow_army_description_text_5:"§9玛吉斯§!—§R红军§!§Y联合纵队§!\n第一总指挥：§Y梓美冬§!   第二总指挥：§Y由比鹤乃§!\n\n联合纵队下辖伯西尔人民军第1，第2，第3步兵师，玛吉斯之翼第17，第23步兵旅共计32400人，火炮108门。\n尽管玛吉斯的多数部队仍处于联盟北方，但不可否认的是，梓美冬魔法仍为我们带来了众多可堪一用的魔法少女\n§g我决心已定…不管是自己还是小八亦或黑白羽的各位…我早已做好了觉悟要拯救大家！§!"
  MGU_arrow_army_description_text_6:"§O见泷原第22空中突击旅§!\n总指挥：§Y平冢牧原§!\n\n作为挺进魔女之夜心脏地带的第一柄剑，在空中混成编队将魔女的结界网撕开一道口子后，英勇无畏的红军将士顶着风暴与碎石登陆至几乎全是废墟的见泷原市中心。\n这场战斗，从来就不是某一方的孤军奋战。\n\n§R为民服务，对党忠诚！§!"


