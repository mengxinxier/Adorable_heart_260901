  MGU_Fully_supported:0 "将部分私企收归国有"
  MGU_Fully_supported_desc:0 "自从晓美焰盟主上台以来，对待民营企业的残酷政策，已经让企业家们准备通过非法途径逃离这个国家，如果我们动作快，就可以将她们中的一部分截留下来。"
  MGU_Fully_supported_2:0 "将更多私企收归国有"
  MGU_Fully_supported_2_desc:0 "自从晓美焰盟主上台以来，对待民营企业的残酷政策，已经让企业家们准备通过非法途径逃离这个国家，如果我们动作快，就可以将她们中的一部分截留下来。"
  MGU_Fully_supported_3:0 "所有私企收归国有"
  MGU_Fully_supported_3_desc:0 "自从晓美焰盟主上台以来，对待民营企业的残酷政策，已经让企业家们准备通过非法途径逃离这个国家，如果我们动作快，就可以将她们中的一部分截留下来。"
  MGU_Fully_supported_4:0 "护国者的理性"
  MGU_Fully_supported_4_desc:0 "作为魔法少女联盟的管理者，掌舵者，最高主宰。圣洁的全国领袖晓美焰盟主将会再次奠定旧秩序在这片大陆上的基石。联盟所有忠诚的子民，都将在晓美焰的庇护下，得到平静而安稳的一生，不奢求改变，不想要成为其他人，或者全新的生活，而是安心守旧的，过完平淡的一生，只作为原本的自己。"
  MGU_Fully_supported_4_txt:0 "晓美焰疲劳值恢复速度+30%"
  MGU_Fully_supported_5:0 "辅助者的激情"
  MGU_Fully_supported_5_desc:0 "为晓美焰奉献终身吧，英勇的特工们，勇敢的志愿兵们。你们的意志、勇气、荣誉，将被传承，在魔法少女联盟的每一个广场上被修女与布道者所传颂。你们将用勇气捍卫我们圣洁的全国领袖晓美焰盟主的意志，将你们的愤怒，击垮任何胆敢违背晓美焰意志的叛徒。你们将坚定的贯彻晓美焰的命令，不问原因、任何痛苦、诱惑与恐惧都无法阻止你们，我们伟大而圣洁的全国领袖晓美焰将因你们而更加的光荣！"
  MGU_Fully_supported_6:0 "生产者的欲望"
  MGU_Fully_supported_6_desc:0 "每个人都有着欲望，欲望是人对美好事物的渴求。就像凡人渴望成为魔法少女。渴望那弹指间击垮一切的魔力。就像总有人想要奢求更多，想要得到比现有的更多的物质与欲求。但是不要僭越，我们圣洁的全国领袖，睿智的晓美焰盟主，早已为所有人定下了前路，只要你肯安于现状，盟主的恩泽必然会让你安稳的度过一生。"
  
  form_MGU_War_DiKang_40:0 "对命运的抗争"
  form_MGU_War_DiKang_40_desc:0 "战线已经崩溃，我们的战败看似在所难免，但是即便是在这种时候，我们仍然不会放弃！"
  form_MGU_War_DiKang_60:0 "在首都防线部署半魔女化部队"
  form_MGU_War_DiKang_60_desc:0 "事已至此，我们必须采取特殊方案，将自愿参加本计划的魔法少女，转化为半魔女化的怪物，这种行为可能将会是永久性的，不可逆的，哪怕战争结束之后，如果她们得以侥幸生存下来，恐怕也永远只能保持这种，令人憎恶的模样。\n强大的魔力以一种扭曲的超自然的形式扩散开来，魔法与灵能的力量在物质世界不可见的盲区中回响尖啸着，撕扯着志愿者们的灵魂，在她们痛彻心扉的哀嚎中，周围的地面逐渐凝结成霜，整个城市开始气温骤降，此世之外的雪花正在从天际飘落。\n如果我们不能从这场战争中幸免，请为我在天堂预留一个房间，即便我们的意志将在此消散，即便人们会忘记我们所付出的一切，即便我们的抗争会埋没在历史的尘埃中，无人铭记，无人挂怀，至少......风与雪，会见证我们的史诗......"
  form_MGU_War_DiKang_1942:0 "[LHS.GetFlag]反击时刻"
  form_MGU_War_DiKang_1942_desc:0 "莉兰迪亚公社在赢得了内战的胜利之后，拒绝走上和平发展的道路，忽视了人民渴望和平的愿望与追求。她们以解放的名义，入侵了我们的国家，将数以万计的生灵推入战争的深渊。魔法少女联盟必须挺身而出，阻止她们继续扩大那可怕的战火，在持久的战争中，公社的部队已经受到了严重的损失，是时候发动战略反击了。将掀起这场战争，造成地区动荡的罪魁祸首，彻底击败！让南美洲的人民，重新获得安宁平静的生活！让南美洲获得和平发展的未来！"
  form_MGU_War_DiKang_1942_PAM:0 "[PAM.GetFlag]反击时刻"
  form_MGU_War_DiKang_1942_PAM_desc:0 "莉兰迪亚王国在赢得了内战的胜利之后，拒绝走上和平发展的道路，以野心与贪欲发动了战争。她们入侵了我们的国家，将数以万计的生灵推入战争的深渊。魔法少女联盟必须挺身而出，阻止她们继续扩大那可怕的战火，在持久的战争中，王国的部队已经受到了严重的损失，是时候发动战略反击了。将掀起这场战争，造成地区动荡的罪魁祸首，彻底击败！让南美洲的人民，重新获得安宁平静的生活！让南美洲获得和平发展的未来！"
  form_MGU_War_DiKang_1942_PAO:0 "[PAO.GetFlag]反击时刻"
  form_MGU_War_DiKang_1942_PAO_desc:0 "夜莺之国在赢得了内战的胜利之后，没有延续那万年的和平与稳定，而是选择重建了莉兰迪亚公社。她们以解放的名义，入侵了我们的国家，将数以万计的生灵推入战争的深渊。魔法少女联盟必须挺身而出，阻止她们继续扩大那可怕的战火，在持久的战争中，公社的部队已经受到了严重的损失，是时候发动战略反击了。将掀起这场战争，造成地区动荡的罪魁祸首，彻底击败！让南美洲的人民，重新获得安宁平静的生活！让南美洲获得和平发展的未来！"
  form_MGU_War_DiKang_1942_PAQ:0 "[PAQ.GetFlag]反击时刻"
  form_MGU_War_DiKang_1942_PAQ_desc:0 "阿德莱希帝国在她们新女皇的带领下走上了一条可怖而强大的道路，昔日的殖民者在混沌力量的加持下席卷了整个南美，她们或许很强大，但我们亦同样如此。而现在是时候进行反击了，我们不能让其邪恶的混沌力量控制一切，让魔法少女的希望与奇迹重新为这片大陆谱写一个和平稳定的未来。"
  form_MGU_War_DiKang_1942_PA1:0 "[PA1.GetFlag]反击时刻"
  form_MGU_War_DiKang_1942_PA1_desc:0 "艾尔孚利登王国在击败了阿德莱希之后，拒绝走上和平发展的道路，忽视了人民渴望和平的愿望与追求。她们以解放的名义，入侵了我们的国家，将数以万计的生灵推入战争的深渊。魔法少女联盟必须挺身而出，阻止她们继续扩大那可怕的战火，在持久的战争中，共和国的部队已经受到了严重的损失，是时候发动战略反击了。将掀起这场战争，造成地区动荡的罪魁祸首，彻底击败！让南美洲的人民，重新获得安宁平静的生活！让南美洲获得和平发展的未来！"

  form_MGU_War_DiKang_LFC:0 "[LFC.GetFlag]紧急撤退"
  form_MGU_War_DiKang_LFC_desc:0 "猎帅的部队已经溃败，我们必须收拢残余部队，并调整战术位置，在我们的国土内重新建立新的防线。"
  form_MGU_War_DiKang_LFC_2:0 "[LFC.GetFlag]最后攻势"
  form_MGU_War_DiKang_LFC_desc:0 "远征军已经输了，但是远征军仍然会拼死一搏...皇家海军的战列舰会在海岸边为远征军提供最后的火力掩护。"
  form_MGU_Equipment_upgrade:0 "先期型灵装升级"
  form_MGU_Equipment_upgrade_desc:0 "随着新一代灵装的研发，一种与现代军火同样强大可靠的灵想兵装带来了新的可能，我们不需要像其他国家那样依靠现代科技的火炮与枪械的力量。我们将大规模的升级那些过时的魔法灵装，作为联盟应对威胁的方式。"
  form_MGU_Equipment_upgrade_II:0 "本世代灵装升级"
  form_MGU_Equipment_upgrade_II_desc:0 "随着新一代灵装的研发，一种与现代军火同样强大可靠的灵想兵装带来了新的可能，我们不需要像其他国家那样依靠现代科技的火炮与枪械的力量。我们将大规模的升级那些过时的魔法灵装，作为联盟应对威胁的方式。"
  form_MGU_Equipment_upgrade_III:0 "次世代灵装升级"
  form_MGU_Equipment_upgrade_III_desc:0 "随着新一代灵装的研发，一种与现代军火同样强大可靠的灵想兵装带来了新的可能，我们不需要像其他国家那样依靠现代科技的火炮与枪械的力量。我们将大规模的升级那些过时的魔法灵装，作为联盟应对威胁的方式。"
  
  
  
  form_MGU_War_DiKang_1249:0 "反公社阵线-军事通行权"
  form_MGU_War_DiKang_1249_desc:0 "我们正与夜莺之国一同对抗公社的侵略，我们或许可以与夜莺之国签订军事通行协议。"
  
  
  form_MGU_Soul_Contract:0 "§R接受灵魂契约§!"
  form_MGU_Soul_Contract_desc:0 "（--该契约只能在1940年-1941年之间签订--）\n\n接受灵魂契约会让你获得强大的力量，但是你必须完成对死神塔的债务，通过发动战争来收集大量的灵魂。你需要在2年内占领南美洲，在4年内击败北美洲，8年内军事占领整个世界。§R否则，你就得拿自己来抵债了。§!\n\n警告：接受该契约之后，你将不可使用‘叛逆的物语’和‘法则的降神’。\n并且，在这个过程中，§R你必须一直都是阵营领袖§!"
  
  
