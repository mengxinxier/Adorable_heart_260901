  MGU_North_America_strategic5_desc:0 "如果你所帮助的国家成功统一了北美，你可以选择一种赏品作为回报。"
                                       
  form_MGU_Iberia_category:0 "伊比利亚内战"
  form_MGU_Iberia_category_desc:0 "如果正常的涅普顿或者三女神获胜，我们能更好的与超次元游戏联邦进行后续的交涉与合作。"
  MGU_Iberia_strategic1:0 "介入伊比利亚：我们将帮助涅普顿"
  MGU_Iberia_strategic2:0 "介入伊比利亚：我们将帮助三女神"
  MGU_Iberia_strategic3:0 "引入超次元游戏机"
  MGU_Iberia_strategic3_desc:0 "引入超次元游戏机可以很好的为我们的人民提供情绪价值，但是也要建立游戏相关的防沉迷体系。"
  MGU_Iberia_strategic4:0 "信仰之力技术"
  MGU_Iberia_strategic4_desc:0 "我们将会尝试向超次元学习如何将信仰之力技术用于我们的魔法体系，或许会有些作用。"

  form_MGU_Rumors_of_Witch_Night_category:0 "魔女之夜即将到来"
  form_MGU_Rumors_of_Witch_Night_0:0 "魔女之夜即将到来"
  
  MGU_help_BRA_constrain_over:0 "强迫阿德莱希投降"
                                       
  MGU_take_state_PAM_descisions:0 "强迫莉兰迪亚投降"
  MGU_take_state_PAM_descisions_2:0 "向莉兰迪亚屈服"
  MGU_take_state_PAM_descisions_2_desc:0 "维洛尼亚击败了夜莺之国，我们无法挽回这局势，现在只能向莉兰迪亚退让了。"
  MGU_take_state_PAM_txt:0 "我方控制维洛尼亚城"

  form_MGU_COUP_COUP_category:0 "政变危机"
  form_MGU_COUP_COUP_category_desc:0 "魔法少女联盟大议会，代表着魔法少女联盟内部各个派系、各个城邦、与各个团体之间的共同利益，或者说，一个用于商议共同利益的平台。以维护联盟城邦之间，那松散的约束力与向心力，假如它有的话...\n对于魔法少女联盟的权力逐渐集中到晓美焰一人身上，大议会及其支持者长期处于一种担忧的态度，为了制止晓美焰的独裁专制，也为了保住她们曾经的既得利益，她们准备以民主之名密谋一次夺回权力的行动。\n为了化解危机，和避免使用不必要的手段，也为了联盟内部不再爆发流血冲突，晓美焰需要尽快的获得军部与官僚们的认可，建立一个能够精密运转，而且对晓美焰个人绝对忠诚，并且掌握全国武装力量的官僚机构，而这就需要那些代表着各个组织与她们背后势力的魔法少女们的支持。\n但是对于早已对魔联的一切都知根知底的晓美焰来说，即便是这种不可能的任务，应该也不会很难。"
                                       
                                       
  form_MGU_science_expansion_category:0 "科学部研究"
  MGU_science_expansion_0:0 "扩编科学部"
  MGU_science_expansion_1:0 "强袭魔女奇术引擎"
  MGU_science_expansion_nucl_1:0 "奇术永续魔法"
  MGU_science_expansion_nucl_1_desc:0 "使用我们的奇术永续魔法，来仿造凡人的核反应堆。"
  MGU_science_expansion_nucl_2:0 "永燃薪柴"
  MGU_science_expansion_nucl_2_desc:0 "在永续魔法的影响下，制造一个永不熄灭的奇术永续魔法连锁方程式。"
  MGU_science_expansion_nucl_3:0 "奇术驱动灵装"
  MGU_science_expansion_nucl_3_desc:0 "为我们的灵装更换奇术驱动。"
  MGU_science_expansion_nucl_2_flag:0 "已完成§Y永燃薪柴§!决议"
  
  MGU_science_expansion_3:0 "强袭组件引擎增幅"
  MGU_science_expansion_3_desc:0 "通过强化强袭组件的引擎，来适应越发快速的空战环境，结合喷气式引擎的科技，我们的强袭魔女们将可以更快的速度划过天际。"
  MGU_science_expansion_4:0 "强袭组件轰炸挂件"
  MGU_science_expansion_4_desc:0 "通过挂载额外的武器，来增加强袭组件的对地轰炸能力，使其在执行对地轰炸任务时，可以造成更加强大的破坏。但是即便如此，我们的强袭魔女与专业的近距支援机相比仍有很大的差距。"
  MGU_science_expansion_5:0 "强袭组件新式护盾"
  MGU_science_expansion_5_desc:0 "将我们的灵装科技移植到强袭组件上，使其可以在被击落之前，承受更多的伤害。这在面临敌方新式战机的扫射时，可以抵抗更长的时间。"
  MGU_science_expansion_6:0 "研发奇术震撼弹"
  MGU_science_expansion_5_desc:0 "基于灵想兵装的新式装备，或者说重型魔炮的小型化实验，使用魔法刻印将强大的魔力凝聚在一次性道具中，以爆炸点位中心用强大的魔法力量震慑附近的所有敌人。"
  
  MGU_Dream_Library_0:0 "探索梦中的图书馆"
  MGU_Dream_Library_0_desc:0 "梦境中的存在感谢我们在死神与它们之间选择了后者，于是它们向我们开放了一座图书馆的使用权，当然，是用做梦的方式..."
  MGU_Dream_Library_bonus:0 "现世之外的知识"
     
     
  MGU_PAN_super_MGU_category:0 "de_bug魔法少女联盟：挑战模式de_bug"
  MGU_PAN_difficulty_MGU:0 "挑战困难魔联"
  MGU_PAN_difficulty_MGU_desc:0 "开启困难模式魔联。\n\n§L（魔联的难度AI具有随机性，魔联可能会随机进入不同的AI行为，即便你不主动开启这个，魔联也有20%概率启用困难AI。）§!"
  MGU_PAN_super_MGU:0 "挑战超级魔联"
  MGU_PAN_super_MGU_desc:0 "超级魔联，魔法少女们的家，既不富裕，也不民主，南美的生活方式，但独裁并非唾手可得（不！我甜蜜的独裁！不————！）§L INVASION§! 看起来很眼熟？这样的情景正在整个南美发生，就在此时此刻，魔联可能会是下一个，也就是说，除非你做出此局中最重要的决定，向自己证明你有力量和勇气，去冲向深渊，直面，超级魔联。成为维和精英，观赏异国情调的魔怔意识形态。并使瓦尔哈拉社主义，惠及整个美洲，成为一个英雄，变成活着的传奇，征服超级魔联。"
  MGU_COUP_AI_BUFF_flag:0 "挑战困难魔联"
  MGU_COUP_AI_BUFF_super_flag:0 "挑战超级魔联"
                                       
  form_MGU_Silver_Court_category:0 "奇观工程：银之庭院"
  form_MGU_Silver_Court_1:0 "基础规划"
  form_MGU_Silver_Court_1_desc:0 "我们将在见泷原市建立一个巨大的人工魔女结界，而见泷原也将从此改名为银之庭院，用以纪念这个宏大的奇观"
  form_MGU_Silver_Court_2:0 "晓美焰人偶"
  form_MGU_Silver_Court_2_desc:0 "为了确保一切都会顺利进行，以及在我们的全国领袖晓美焰进入银庭之后国家不会出现行政管理上的动荡。我们需要制造一个，或几个晓美焰的分身人偶。"
  form_MGU_Silver_Court_3:0 "注入能源"
  form_MGU_Silver_Court_3_desc:0 "正常情况下魔女结界的能量是由魔女提供，但是在没有魔女的情况下，想要维持一个如此巨大的结界，我们需要一些更加‘常规’且稳定的能源。"
  form_MGU_Silver_Court_4:0 "结界扩张"
  form_MGU_Silver_Court_4_desc:0 "人工结界将会继续扩大，直到笼罩整个见泷原市，从后山到港口，这座数百万人的城市将会成为结界的根基。"
  form_MGU_Silver_Court_5:0 "干涉梦境"
  form_MGU_Silver_Court_5_desc:0 "梦境无疑是混沌且危险的，甚至有可怕的噩梦灵在其中游荡，我们必须在梦境的世界中建立一片绝对安全的区域，不允许任何噩梦灵进入我们的控制区。\n\n§L‘卓越灵装’需要通过干涉北美获得§!"
  form_MGU_Silver_Court_6:0 "晓美焰深度连接"
  form_MGU_Silver_Court_6_desc:0 "§1这将迎来一种结局...§!\n\n是时候了，所有的准备都已经完成，银之庭院的建设也已经到了最终的阶段，只需要晓美焰本人，成为这个结界的核心，以她自身强大的精神与心灵驱动整个结界的运行。"
                                       
  form_MGU_homura_industrious_category:0 "政务处理"
  form_MGU_homura_industrious_category_desc:0 "晓美焰作为魔联的全国领袖，大量的政务都需要其亲自批阅并做出指示。 \n\n晓美焰当前疲劳值为(§Y[?global.MGU_homura_tired]§!)点。"

  
  MGU_homura_industrious_0:0 "晓美焰疲劳值恢复"
  MGU_homura_industrious_1:0 "重建公务员体系"
  MGU_homura_industrious_1_desc:0 "在内战之中，或者说内战之前，魔联的议会体系就已经陷入了混乱，地方官僚各派系的支持者鱼龙混杂，哪怕是中央议会的议员们也不值得信任。我们需要重建新的公务员体系，一个忠于晓美焰的文官集团，同时也是清廉的热情的心中装着人民群众的文官集团，来让国家机器流畅的运行。"
  MGU_homura_industrious_2:0 "见泷原发展规划"
  MGU_homura_industrious_2_desc:0 "见泷原是巴麻美派系的控制区，也是晓美焰盟主及其支持者们的根基所在，在晓美焰成为第二任魔联盟主之后，这座城市成为了新的首都。对这座城市的建设与投资可以更加稳固我们的统治。"
  MGU_homura_industrious_3:0 "神滨市发展规划"
  MGU_homura_industrious_3_desc:0 "神滨市是魔联大议会忠诚派的控制区，魔法少女联盟原本的首都，武装政变动摇了中央议会的统治，许多街区都遭到了内战的破坏，我们现在需要将其重建，也是为了往日的联盟。"
  MGU_homura_industrious_4:0 "薄望之馆发展规划"
  MGU_homura_industrious_4_desc:0 "薄望之馆，魔联科学部——玛吉斯之翼派系的控制区，坐落于魔联的东北地区，玛吉斯之翼的科学家们日以继夜的在其中进行着各种各样的研究，作为内战中忠诚派的三座城市之一，她理所应当得到忠诚的奖励。"  
  MGU_homura_industrious_5:0 "加强基层管理"
  MGU_homura_industrious_5_desc:0 "随着战争结束百废待兴，叛军虽然被击败，但是在乡村小镇仍然有大量的残余敌人在破坏我们的统治，重新建立基层的控制稳定国家的秩序是必要的措施。以防止那些激进的民主份子和共党份子继续煽动我们的人民。战争结束了，不只是口上说说而已，我们需要真正的结束那场战争让人民，回到和平稳定的生活之中，不用再担心战乱与痛苦。"
  MGU_homura_industrious_6:0 "建立宣传媒体"
  MGU_homura_industrious_6_desc:0 "我们在内战中获得了胜利，以军事力量掌控了国家。但是为了长期的稳定，我们必须向人民大众宣传我们的政党，让人民理解我们的目的我们的想法，让人们知道我们可以让这个国家变得更加美好，我们会让每个人都能安全的吃饱饭，不用担心罪犯与暴力，让人民知道我们是人民的守护者，让人民发自内心的支持我们，而不是屈服于我们的军事力量。"
  MGU_homura_industrious_7:0 "指定内政方针"
  MGU_homura_industrious_7_desc:0 "我们需要一个方案，方针。如果没有方针，人们的思绪就很容易被情感所影响，在复杂多变的扑朔迷离的事件之中，难以分辨对错和该做的事情，最终做出令自己后悔莫及的错误。有了方针，就能让公务员们在处理内政时得以有章程可循，有了方向，人们才能清晰的知晓自己该做什么。文官们的思想就会更加清晰和明确。"
  MGU_homura_industrious_8:0 "建立情报机构"
  MGU_homura_industrious_8_desc:0 "在这个缤纷的世界，我们需要建立自己的情报机构，才能应对国内与国外的众多诱惑与威胁。确保将尽可能多的事物收拢在我们的情报之中。我们必须把我们的人民，置于我们的保护之中，决不能让我们的人民，在无人察觉的角落遭到迫害与伤亡。"
  MGU_homura_industrious_9:0 "协助里见灯花的研究"
  MGU_homura_industrious_9_desc:0 "我们曾经与里见灯花签订过协议，我们许诺会支持她的研究，重启Doppel计划，完成她的伟业。如今，到了需要兑现的时刻了。如果计划得以完成，魔法少女们或许就不再需要依靠悲叹之种来延续生命。Doppel半魔女化技能将会为魔法少女给予新的可能。\n§1晓美焰将会专注于该项工作而无法分心它事§!"
  MGU_homura_industrious_10:0 "§P魔联真理部§!"
  MGU_homura_industrious_10_desc:0 "魔法少女联盟真理部，是以里见灯花为首创建的科研部门，在那场席卷全国的1935年大规模内战中，因为对魔法少女大议会的决断感到失望，而割据了北部三省宣布独立，在与晓美焰的协议下，加入了忠诚派的阵营。在科技日星月异的现今，即便是作为魔法国家的我们，也需要探索科技的妙用，探索出科技与魔法相结合的道路。所以我们现在需要再次扩编科学部，来满足对未来的军事需求。\n§1晓美焰将会专注于该项工作而无法分心它事§!"
  MGU_homura_industrious_11:0 "§P魔联富裕部§!"
  MGU_homura_industrious_11_desc:0 "魔法少女联盟富裕部，我们的控制区或许很大，但是茂密的雨林中到处都是变异的生物与可怕的疾疫，还有暴雨季那如同天灾般的洪水，这使我们无法建立超级大国那样庞大的工业体系，但是魔法的力量让我们可以做到一些，常人所不能及的方案。依靠永续魔法的架构我们可以制造出一个拥有强大产能的魔法奇迹，来让国家和人民实现富裕的生活。\n§1晓美焰将会专注于该项工作而无法分心它事§!"
  MGU_homura_industrious_11_txt:0 "解锁：魔法工业决议"
  MGU_homura_industrious_12:0 "§P魔联友爱部§!"
  MGU_homura_industrious_12_desc:0 "魔法少女联盟友爱部，在很长的时间里，丛林之中都缺少真正的秩序，虽然有些昆虫仍然想与我们和平共处。但是另外一些昆虫拉高了整个魔联的平均犯罪率，如果她们也该在犯罪统计时被计算入内的话。我们需要魔联境内的丛林区域，专门设立特殊的友爱部，扩编更多的执法人员，让那些罪犯们明白：丛林，不是法外之地。\n§1晓美焰将会专注于该项工作而无法分心它事§!"
  MGU_homura_industrious_13:0 "§P魔联和平部§!"
  MGU_homura_industrious_13_desc:0 "魔法少女联盟和平部，战争的动荡与我们每一个人息息相关，在这个动荡的年代，和谐的生活是一件十分脆弱且不稳定的事情。我们必须组建和平部，来让我们的人民得到安全的生活。\n§1晓美焰将会专注于该项工作而无法分心它事§!"
  MGU_homura_industrious_14:0 "地下深处的巫女"
  MGU_homura_industrious_14_desc:0 ""
                                       
  MGU_homura_industrious_12_flag:0 "§1魔联友爱部已建立§!"
  MGU_homura_industrious_13_flag:0 "§1魔联和平部已建立§!"
  
  MGU_homura_industrious_12x:0 "魔联农业部"
  MGU_homura_industrious_12x_desc:0  "吃面包还是吃菌毯，这是个问题。没人喜欢吃菌毯，除了妖精，哪怕是妖精相比起菌毯也会更喜欢面包的。我们是时候让凡人们也能吃上面包了！又或者，我们仍然要继续勒紧裙带艰辛度日，把资源节省出来以用于更加重要的伟业？\n§1晓美焰将会专注于该项工作而无法分心它事§!"
  MGU_homura_industrious_13x:0 "重组议会"
  MGU_homura_industrious_13x_desc:0 "晓美焰对议会的压制有些过于苛刻了，现在我们可以抽出空来重新协商一些与议会相关的政治内容，或许我们可以与议会派系重归于好。\n§1晓美焰将会专注于该项工作而无法分心它事§!"
                                       

  
  
  MGU_homura_industrious_a:0 "盟主事物：科研指导"
  MGU_homura_industrious_a_desc:0 "晓美焰盟主将会重点关注国家的科研发展，对科研部门所遇到的困难进行正确的指导。"
  MGU_homura_industrious_a_txt:0 "科研速度§G+10.00%§!\n§Y盟主事务占用时间：§!"
  MGU_homura_industrious_a_tec:0 "盟主事物：科研指导"
  MGU_homura_industrious_b:0 "盟主事物：工业调控"
  MGU_homura_industrious_b_desc:0 "晓美焰盟主将会重点关注国家的工业发展，以更恰当的物资调控来提升工业产出。"
  MGU_homura_industrious_b_txt:0 "工厂产出§G+10.00%§!\n§Y盟主事务占用时间：§!"
  MGU_homura_industrious_b_tec:0 "盟主事物：工业调控"
  MGU_homura_industrious_c:0 "盟主事物：效率制度"
  MGU_homura_industrious_c_desc:0 "晓美焰盟主将会重点关注国家的生产效率，更优良的制度将提升生产积极性。"
  MGU_homura_industrious_c_txt:0 "生产效率增长速度§G+10.00%§!\n生产效率上限§G+10.00%§!\n§Y盟主事务占用时间：§!"
  MGU_homura_industrious_c_tec:0 "盟主事物：效率制度"
  MGU_homura_industrious_d:0 "盟主事物：建设计划"
  MGU_homura_industrious_d_desc:0 "晓美焰盟主将会重点关注国家的工厂建造，又快又好的加快我们的国家建设。"
  MGU_homura_industrious_d_txt:0 "建造速度§G+10.00%§!\n§Y盟主事务占用时间：§!"
  MGU_homura_industrious_e:0 "盟主事物：行政公务"
  MGU_homura_industrious_e_desc:0 "晓美焰盟主将会重点关注国家的行政公务，让政治与公务可以更流畅的运行。"
  MGU_homura_industrious_e_txt:0 "§政治点获得G+10.00%§!\n§政治顾问花费G-10.00%§!\n§Y盟主事务占用时间：§!"
  MGU_homura_industrious_l_txt:0 "§Y盟主事务占用时间：§!"
  
  MGU_homura_industrious_al:0 "重点聚焦：科研指导"
  MGU_homura_industrious_al_desc:0 "晓美焰盟主将会重点关注国家的科研发展，对科研部门所遇到的困难进行正确的指导。"
  MGU_homura_industrious_bl:0 "重点聚焦：工业调控"
  MGU_homura_industrious_bl_desc:0 "晓美焰盟主将会重点关注国家的工业发展，以更恰当的物资调控来提升工业产出。"
  MGU_homura_industrious_cl:0 "重点聚焦：效率制度"
  MGU_homura_industrious_cl_desc:0 "晓美焰盟主将会重点关注国家的生产效率，更优良的制度将提升生产积极性。"
  MGU_homura_industrious_dl:0 "重点聚焦：建设计划"
  MGU_homura_industrious_dl_desc:0 "晓美焰盟主将会重点关注国家的工厂建造，又快又好的加快我们的国家建设。"
  MGU_homura_industrious_el:0 "重点聚焦：行政公务"
  MGU_homura_industrious_el_desc:0 "晓美焰盟主将会重点关注国家的行政公务，让政治与公务可以更流畅的运行。"
  
  
  MGU_Heart_Democracy_category:0 "民主和平部"
  MGU_Heart_Democracy_Deploy:0 "民主部署"
  MGU_Heart_Democracy_Deploy_desc:0 "使用我们的民主资源打造一批民主装备，鼓励人民踊跃参军，部署一批民主部队编制"
  MGU_Heart_Democracy_p:0 "自由卫士"
  MGU_Heart_Democracy_p_desc:0 "自由卫士是我们的骄傲,也是民主的重盾,普通公民们在民主官的引领下踊跃的报名,在动荡的南美洲,为避免民主灯塔被毁灭而尽自己的份力，自由卫士们携带着她们所能使用的一切武器进入战场，化身为，民主的——捍卫者！"
  MGU_Heart_Democracy_2:0 "民主王牌"
  MGU_Heart_Democracy_2_desc:0 "通过民主官们的竭力宣传，以民主和自由之名义，引导有天赋的少女们签订契约成为魔法少女，拥抱她们光荣的使命，成为民主的剑锋，捍卫南美的自由。"
  MGU_Heart_Democracy_3:0 "民主动员"
  MGU_Heart_Democracy_3_desc:0 "只是魔法少女是不够的，我们不能只依靠魔法少女们去冲锋陷阵。我们不能想个懦夫一样躲在她们的身后！为了民主，为了自由，我们必须做点什么！我们有武器！我们有弹药！我们需要战士！自由的战士！"
  MGU_Heart_Democracy_4:0 "封禁非法广播"
  MGU_Heart_Democracy_4_desc:0 "民主是好的！自由是好的！莉兰迪亚公社是坏的！我们必须确保魔联境内，所有的广播都必须符合民主且自由的标准！确保我们的公民们，听到的都是自由且民主的声音。"
  MGU_Heart_Democracy_5:0 "保卫民主"
  MGU_Heart_Democracy_5_desc:0 "我们的民主城市正在遭到邪恶敌人的侵略！她们想要摧毁我们的民主！公民们！千万不要相信敌人所说的谎言！快拿起武器保卫我们的家园！捍卫我们的自由！"
  MGU_Heart_Democracy_6:0 "民主的勇气"
  MGU_Heart_Democracy_6_desc:0 "我们有民主的政权！我们有自由的生活！还有关心公民的议员们！我们需要战士才能捍卫这一切！在危急关头，我们必须签署法令来动员更多的人！公民们为了民主和自由勇敢的做出此生最重要的决定，来彰显她们为了民主而战的勇气！"

  MGU_Walpurgisnacht_warning_0:0 "魔女之夜的传说"
  MGU_Walpurgisnacht_warningy_desc:0 "魔女之夜，一个超强大的超级魔女终有一天将会降临，然后毁灭一切。\n这只是个传说，用于哄骗小孩的恐怖故事，曾经，大多数人都是这么觉得。\n§G准备值§!越高，我们对魔女之夜的打击就越有效\n§R谣言强度§!越高，魔女之夜对物质世界的影响就越强\n\n我们目前的准备值为：(§Y[?global.Walpurgisnacht_zb]§!)点。\n魔女之夜的强度值为：(§Y[?global.Walpurgisnacht_pow]§!)\n§L当魔女之夜移动时强度会少量下降§!"
