  MGU_Active_Magic_Storage_Jar:0 "活性魔力储蓄罐制作工艺"
  MGU_Active_Magic_Storage_Jar_desc:0 "活性魔力储蓄罐的制作工艺,时钟塔的“暗槛”魔女为魔联留下的“礼物”。30年前因为在南美洲察觉到解缚魔法的存在而带着魔法部门在联盟大打出手，虽然最后被关进了她自己的伦敦塔内，但似乎把将蕴藏魔力的年轻女孩制作成“魔力储蓄罐”的工艺传给了某些和她一样的坏蛋。如果原材料不是蕴藏魔力的年轻女孩子就没有什么意义，但魔法少女似乎很适合成为储蓄罐的载体也说不准？"

  MGC_Support_from_Comintern:0 "来自共产国际的支持"
  MGC_Support_from_Comintern_desc:0 "共产国际会无条件的支持一切马克思的追随者，哪怕你在南美的丛林里。"
  MRB_Support_from_legion:0 "来自军团的贷款"
  MRB_Support_from_legion_desc:0 "这是军团给你的贷款，当你获得了阶段性胜利后，军团可能会要你偿还。"
  PA1_shenshedebihu:0 "瓦尔哈拉社的影响"
  PA1_shenshedebihu_desc:0 "在这里可怕的危机存在于每个角落，暗流涌动，强敌环伺。阿德莱希的扩张战争令所有人都感到恐惧，我们一直在依靠§0瓦尔哈拉社§!的帮助才守住了这些现有的领土。\n但是这也意味着，如果§0瓦尔哈拉社§!想对我们做什么，我们可能§R没有拒绝的权利§!"
  PAQ_Iron_cross_afterglow:0 "帝国余晖"
  PAQ_Iron_cross_afterglow_desc:0 "我们是欧洲殖民者的后代，那光荣的血脉让我们传承人类的荣耀。在那令人痛心疾首的崩裂之后，我们曾是南美洲第一个完成工业化的国家，也曾经是南美洲最强的国家，我们必将复兴在南美洲的崇高地位，无论是人类之中的叛徒，还是令人憎恶的异族，都只能在我们硕大的阴影中颤抖，没有人可以阻挡我们复兴的脚步，妖精们不能，叛徒们不能，亡灵们不能，魔法少女们也不能。一切都曾是那么的§5美好§!！似乎当年的§O荣耀§!是那么的§L触手可及...§!\n\n但是自从第四次扩张战争以悲剧收尾，整个国家都陷入了剧烈的政治动荡！为了争夺那染血的王座，各派系之间党同伐异，姐妹之间同室操戈，整个国家都在政治风暴中走向了没落...而如今，那场血雨腥风终于决出了最终的胜者，那位登上权利顶峰的少女能否带领我们走出这黑暗的时代？"
  PAQ_mechanical_buff:0 "光辉岁月的遗产"
  PAQ_mechanical_buff_desc:0 "激烈的政治斗争并非毁灭了一切，我们仍然有一些昂贵的装备，被深埋在仓库之中等待着再一次重返疆场。\n\n§W这其中还有大量用于焚灭妖精的§!§Y火焰喷射器§!"

  
