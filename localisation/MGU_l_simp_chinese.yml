  MGU_Pres_ZT_3_ava_txt:0 "魔联所有省份：§Y基础设施§!达到3级"
  MGU_Pres_update_flag:0 "完成工业现代化"
  MGU_Pres_ZT_category:0 "魔联工业部"
  MGU_Pres_ZT_category_desc:0 "当其他国家在高速适应时代的变革，争抢工业革命带来的红利时。魔法少女的城邦们仍然驻足于上个时代的余韵中，魔法的庇护，分散的城邦，列强的影响，使得我们国家没有迎接时代的变革。而在圣杯的伟大胜利已经被加入我们的教科书的今天，圣杯王国对南美或者说整个世界的局势，却开始愈发的焦躁。\n西伯利亚的红色巨熊，德国境内的不死军团，以及莉兰迪亚的革命，北美矛盾的激化，远东局势的动荡，无一不在刺激着圣杯王国那疲惫的神经。虽然皇家海军的钢铁舰队还在整个世界彰显着圣杯的终极秩序，殖民地部队也愿意为了捍卫王国神圣的领土而流尽自己的最后一滴血。\n但也该是未雨绸缪的时候了。圣杯王国长期以来将我们视为其在南美洲最重要的盟友，她将会援助我们的军事力量，以应对大量扩军的阿德来希与正在革命的莉兰迪亚。这片大陆正在酝酿着一场恐怖的灾难，那是由怨恨，贪婪，野心，甚至于理想，编制而成的怪物，它妄图把整片大陆拖进疯狂的深渊，试图撕碎每个人的命运，无人可以置身事外。如果我们想要在即将到来的浩劫中幸存，我们§P必须§!§R尽快...§!"
  MGU_Pres_ZT_1:0 "在§Y[FROM.Getname]§!军事化建设"
  MGU_Pres_ZT_1_desc:0 "在省份进行现代化改造之后，圣杯王国将帮助我们进行军事筹备工作，以应对将来的威胁。"
  MGU_Pres_ZT_2:0 "神滨特区"
  MGU_Pres_ZT_2_desc:0 "我们需要在神滨市建立一个经济特区，来彰显我们现代化改造的成果，以及给予圣杯商人们一个可供投资的优质选择。"
  MGU_Pres_ZT_3:0 "宣布完成§Y工业现代化§!"
  MGU_Pres_ZT_3_desc:0 "我们也成功证明了自己，是一个拥有蓬勃潜力的国家，国家公路已经连接我们的每一座城市，我们的港口，公路，以及一切货运物资，已经成功并入圣杯王国的物流网络。现在我们可以通过物资的生产，来换取我们需要的军需品。"
  MGU_Pres_ZT_3a:0 "更新圣杯军械图纸"
  MGU_Pres_ZT_3a_desc:0 "为我们的军用工厂更新圣杯王国的军械生产图纸。"
  MGU_Pres_ZT_3b:0 "加入圣杯王国"
  MGU_Pres_ZT_3b_desc:0 "终于，南美洲的动乱得以平息，而我们现在可以加入圣杯王国的阵营，成为其不可或缺的一部分。让我们的民主走出这片大陆，自由的光辉，将惠及整个世界。"
  MGU_Pres_ZT_4:0 "订购步枪"
  MGU_Pres_ZT_5:0 "大量订购步枪"
  MGU_Pres_ZT_6:0 "订购火炮"
  MGU_Pres_ZT_7:0 "大量订购火炮"
  MGU_Pres_ZT_8:0 "订购卡车"
  MGU_Pres_ZT_9:0 "大量订购卡车"
  MGU_Pres_ZT_10:0 "军工联合基地"
  MGU_Pres_ZT_10_desc:0 "随着我们与远征军的合作更加密切，我们现在可以与远征军共同建立一个新的军工基地，以此来更进一步的保护我们的民主。"
