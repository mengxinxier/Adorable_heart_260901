  form_MGU_Protecting_Saint_Sully_1:0 "保护妖精联邦"
  form_MGU_Protecting_Rest_Peace_1:0 "保护夜莺之国"
  form_MGU_Protecting_Rest_Peace_1_desc:0 "野火的扩张令所有人都感到担忧。野火就如同她的名字，她的军队将会跟随她们所谓的理想燃烧整片大陆。而在野火进攻安息之国的时刻，则是阻止她们最好的时机。"
  form_MGU_Protecting_Rest_Peace_2:0 "帮助莉莉夺回力量"
  form_MGU_Protecting_Rest_Peace_2_desc:0 "那燎原的野火已经被扑灭，但是局势并没有让人安息，因为夜莺之心不会放任和平就此降临，在它将所有人都推入那可怕的悲喜剧之前，我们得帮公主尽可能的阻止这一切。或者说，尽可能的阻止..."
  form_MGU_Protecting_Rest_Peace_3:0 "令那野火熄灭，令那星光璀璨"
  form_MGU_Protecting_Rest_Peace_3_desc:0 "野火已然熄灭，亦无需再次燃烧。在它将人们的灵魂燃烬之前，令那炽热的火焰从此冷却。我们必须在索拉娜彻底搞乱夜莺之国，然后一死了之之前，得阻止这一切的发生。这个国家，这些人民，已经经历了太多的苦难与挫折，她们理应得到平静的生活，而不是又一次的抗争。让每个人都能够在自己的生活中安稳的度过每一天。"
  form_MGU_Protecting_Rest_Peace_3_txt:0 "这将会制止索拉娜的行为，亦将会§R停止夜莺国策树§!，请找一个恰当的时机。"
  form_MGU_Protecting_Rest_Peace_4:0 "邀请夜莺加入阵营"
  form_MGU_Protecting_Rest_Peace_4_desc:0 "在共同敌人的压力下，我们需要更加紧密的作战才能更好的对抗敌人，让旧秩序重新稳定在这片神秘而古老的大陆。令所有人回到秩序与平稳的生活之中，一如往日。"
  form_MGU_Protecting_Rest_Peace_4_txt:0 ""
  
  
