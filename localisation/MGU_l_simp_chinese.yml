  TBMGU_YH_11:0 "军队属于议会"
  TBMGU_YH_11_desc:0 "在议会的执政过程中，我们发现联盟军队中已经有了越来越多支持民主制度的将领与士兵，这种令人欣慰的局面证明了我们的正确——在可见的未来，我们仍然会与军队进行合作，让军队保卫我们的民主制度。"
