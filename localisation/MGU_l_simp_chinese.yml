  MGU_D_resist_LHS:0 "对公社的抵抗"
  MGU_D_resist_LHS_desc:0 "那些公社的暴徒们入侵了我们的家园，破坏了我们的民主，摧毁了我们的自由，让我们香甜的空气，染上了战火的硝烟。\n她们或许很强大，但我们也绝不会就这么将我们民主的果实让给那些侵略者。我们将战斗！令那灯塔长明，为了自由！为了民主！。"

  MGU_D_resist_2_LHS:0 "对公社的抵抗（自定义规则AI强化II）"
  MGU_D_resist_2_LHS_desc:0 "那些公社的暴徒们入侵了我们的家园，破坏了我们的民主，摧毁了我们的自由，让我们香甜的空气，染上了战火的硝烟。\n她们或许很强大，但我们也绝不会就这么将我们民主的果实让给那些侵略者。我们将战斗！令那灯塔长明，为了自由！为了民主！。"

