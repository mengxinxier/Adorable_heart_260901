  MGU_LFC_idea_sjbz_I:0 "因果交织的羁绊"
  MGU_LFC_idea_sjbz_I_desc:0 "我们曾一同放逐了黑暗的时代，以那锐利的剑刃斩裂了无知的旧夜,以那勇猛的枪炮将击破噩梦的袭扰,以那飞舞的魔法长枪将一切民主的威胁贯穿,以那闪亮的盾徽彷徨时间，不断纺织新的因果。"
  
  MGU_LFC_idea_DiKang:0 "最后攻势"
  MGU_LFC_idea_DiKang_desc:0 "我们已经输了，但是我们仍然要拼死一搏...皇家海军的战列舰会在海岸边为我们提供最后的火力掩护。"
    
  MGU_anxi_wlkz_PAO:0 "星光低垂"
  MGU_anxi_wlkz_PAO_desc:0 "即使夜莺之心已然暗淡，那低垂的星光仍旧照拂着一切生者与死者..."

  MGU_anxi_wlkz_PAM:0 "亡灵失控"
