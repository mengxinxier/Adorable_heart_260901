  MTK_songsan_chengshihua_idea:"松散的城市化"
  MTK_songsan_chengshihua_idea_desc:"魔法少女联盟，官方名称伯西尔邦联共和国，名如其字“邦联共和国”，由23个城邦联合而成的松散联盟，各城邦之间经济文化差异巨大，多为“听调不听宣”。"
  MTK_magic_bad:"魔女的阴影"
  MTK_magic_bad_desc:"魔女——魔法少女永远的敌人，自魔法少女有历史以来便与其相伴相生。目前尚不明确其成因，但毫无疑问的是，伯西尔大地上的所有生灵都因魔女的存在而笼上一层可怖的阴影。"
  MTK_resist_magic_bad:"不灭的抗争"
  MTK_resist_magic_bad_desc:"时至今日，我们仍无法完全解决魔法少女会魔女化这一问题，它就像一种不治之症，每一位魔法少女都终将要面对的难题。\n但对所有魔法少女而言，魔女化不再是恐惧的毁灭，而是命途的终点。她们可以，也愿意坦荡的走向那一刻，直至魔女消逝……"
  MTK_lack_of_farmer_and_worker:"劳动力短缺"
  MTK_lack_of_farmer_and_worker_desc:"诚然，伯西尔大地上并不缺乏广泛的劳动力，但由于长期的内战与动荡，以及城邦联合体的固有局限性，广大农民与工人阶级对现有政府极度缺乏信任感。"

  MTK_resist_to_the_last_idea_1:"未能救出的某人"
  MTK_resist_to_the_last_idea_2:"不被信任的政府" 
  MTK_resist_to_the_last_idea_3:"受压迫者的战士"
  MTK_resist_to_the_last_idea_3_desc:"起来，饥寒交迫的人们！\n起来，全世界受苦的人！\n满腔地热血已经沸腾，要为真理而斗争！\n旧世界打个落花流水，奴隶们起来，起来！\n不要说我们一无所有，我们要做天下地主人！"
  MTK_resist_to_the_last_idea_4:"人民战争的汪洋大海"
  MTK_resist_to_the_last_idea_5:"致以无名的抗争者"
  MTK_resist_to_the_last_idea_5_desc:"穿越彩虹,阴影,挣扎,泥泞—我清晰的看见了 我命运的方向。\n我有一部分谁都无法夺走——\n我的桂冠，我的剑 我的战场！\n荣耀不是只关乎胜利，而是燃烧到————\n§Q最后一刻§!\n\n           ————《鸣潮》致以无名的抗争者"

  MTK_tired_people:"疲惫不堪的人民"
  MTK_economic_control_residue_idea_1:"功能失调的经济"
  MTK_economic_control_residue_idea_2:"功能失调的经济"
  MTK_economic_control_residue_idea_3:"功能失调的经济"
  MTK_economic_control_residue_idea_4:"功能失调的经济"
  MTK_economy_happy_people_idea:"团结的大地"
  MTK_economy_kindly_society_idea:"和谐的社会"
  MTK_daughter_of_Bersil:"伯西尔的女儿"
  MTK_daughter_of_Bersil_desc:"我们在这片并不富饶的土地上长大，即使是魔法少女，我们也都曾有过同样的经历——从呱呱坠地，到咿呀学语。我们都曾看过的，是母亲脸上洋溢的笑容。我们都曾感受过的，是父亲臂弯的无限温暖。\n魔法少女与这片土地上的人并无差异，我们都是伯西尔人的女儿，我们只属于我们的国家，我们的父母，不属于任何神明。"

  MTK_five_years_idea_reward_1:"五年计划超额完成"
  MTK_five_years_idea_reward_1_desc:"我们顺利并大大提前的完成了五年计划，共和国未来的前路已无比光明。"
  MTK_five_years_idea_reward_2:"五年计划胜利收官"
  MTK_five_years_idea_reward_2_desc:"我们顺利且提前的完成了五年计划，共和国未来的前路已无比光明。"
  MTK_five_years_idea_reward_3:"五年计划顺利收官"
  MTK_five_years_idea_reward_3_desc:"我们提前完成了五年计划，共和国未来的前路已无比光明。"
  MTK_five_years_idea_reward_4:"五年计划顺利完成"
  MTK_five_years_idea_reward_4_desc:"我们顺利完成了五年计划，共和国未来的前路已无比光明。"

