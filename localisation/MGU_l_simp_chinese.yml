 #事件
  MTK.1.t:"巴麻美递交辞呈"
  MTK.1.d:"或许是议会的一味退让使得这位一心为国的将军失望不已，亦或者是当众否决重建议会军的提案让她丢尽了颜面。在会议闭幕的第二天，她就向联盟议会递交了退伍申请，从她的眼中，我们能看到滔天的失望。"
  MTK.1.a:"她早已不重要，玛吉斯才是现在最大的敌人"

  MTK.2.t:"回家"
  MTK.2.d:"没有喝彩，没有随行，甚至没有个像样的交通工具，有的仅仅只是，她和小渚，巴麻美和百江渚，仅此而已。\n“欸~欸，累死我了，麻美姐，还有多远啊~~~~”\n“累了吗？已经能看见城区了，再坚持一下吧。”巴麻美说着，攥着小渚的手紧了紧。多久了呢，上次和那些孩子见面，已经是三年前了吧，但说是见面，也仅仅是在文书上看到名字，后辈们的笑颜也早已在记忆中模糊。\n“欸——走不动了啦，麻美姐背我~”百江渚一摇一晃的贫嘴道，下场则是一个来自前辈的温柔脑瓜崩。\n“哎，”巴麻美叹了口气，“前面有个村子，在里面歇一歇吧，不过最多就呆十几分钟。我们进城后还要到处去找圆她们的住处。”\n“欸，你竟然不知道吗，那我岂不是白走——”\n“嗯——？”\n“不，都是小的的错，麻美大人能照顾小的已经是皇恩浩荡感激不尽了。”\n跟地图上的标识差不了太多，小村落坐落在城市边陲，离最近的关口说远不远，说近也不近。\n不过，这座小村子貌似并不简单，尽管还未正式进入村落，但多年战斗的经验早已让她看出，这里有魔法少女活动，而且，很多……\n“怎么了，麻美姐？”百江渚拉了拉立在原地的巴麻美，疑惑的问道。\n“啊，抱歉，没事。”麻美应道，不妙跑掉就行了，自己还没有弱到带着小渚甩不掉追兵的程度,“走吧——”说着，麻美重新迈开脚步\n“啊，客人，你们好，是迷路了吗？”刚到村落门口，便迎面走来几位魔法少女，和在神滨遇见的不同，她们脸上洋溢着，发自内心的笑容，那种自我实现的满足感所引发的笑容，她已经多久没看到了，“欸，等等，你是，巴学姐！”少女走进，看清她的容貌反而吃了一惊\n“欸，你认识我？”\n“不认识”少女说道，“但鹿目圆主席说过，你一定会回来的——金发的魔法少女带着白发的小孩子，嗯，不会错的。”\n村子不算大，但村内十分和睦，魔法少女与村子里的普通人有说有笑，在神滨，这种现象几乎不会发生。\n“到了，巴麻美学姐，圆主席就住在这里。”少女驻足，这间土屋，不算很大，临时筑起来的，但也有些时候了，她就住在这里吗……思考中，小渚反而先一步推开了门\n“圆姐姐——”小渚的声音引来了屋内主人的目光，很显然，她也吃了一惊，姣好的面容露出一抹惊讶，但很快浮上来的，是打心底的喜悦\n“啊，小渚”目光转向自己，呵，我在紧张些什么“还有，麻美姐，欢迎回来，回到——见泷原，我们的家。”"
  MTK.2.a:"嗯，我回来了。"

  MTK.3.t:"玛吉斯使节来访"
  MTK.3.d:"我们的交涉并非毫无结果，玛吉斯的领导层同意了与我们互不开战的要求，任何分歧都是可以通过协商而非武力解决，至于她们所要求的那点土地和权利，给她们又何妨？"
  MTK.3.a:"不再流血！"


  MTK.4.t:"告全联盟魔法少女"
  MTK.4.d:"“喂喂，大家，能听到吗，这里是玛吉斯之翼，三位玛吉斯之一——里间灯花，现通过全联盟广播频道向各位问好。\n当然，这次并不是简单的试音和问好，我们有话，有真相，要带给大家——\n魔法少女哟，被QB所蒙骗的少女呦，你们知道，每日与你们战斗的魔女，是什么，从何而来吗？外太空？哔哔——雨林中？大洋的另一端？哔哔——很可惜，这些全都是错误答案。\n那么，魔女到底是什么，我们，到底又是什么？\n少女们呦，低下头，看看你们的灵魂宝石吧，你们从不离身的重要之物，再看看那悲叹之种，想想或曾与你并肩的朋友——那些突然消失、再也没有回来的同伴，而后，突然出现的，新的魔女。\nQB告诉你们，灵魂宝石是力量的源泉，悲叹之种是战斗的奖励——多么完美的谎言！但这场这宇宙级的阴谋也就到此为之了——\nEVE系统，我们的夏娃，即将苏醒，而所有的魔法少女——都将得到救赎！”"
  MTK.4.a:"到玛吉斯之翼来吧"

  MTK_event.13.t:"愿希望不灭"
  MTK_event.13.d:"不妙，糟糕，大事不好，状况百出，糟透了！\n鹿目圆没想到，晓美焰更没想到，玛吉斯那群疯子竟然会如此高调的散布魔法少女的真相，尽管议会那边已经紧急辟谣，公开宣告这些东西是谬论，是洗脑，玛吉斯也被打成邪教……但，又能怎么样呢，疑虑的种子已经种下，甚至有些种子当场就开出了花——\n冲出土房，晓美焰急匆匆的跑向圆所在的屋子，不出所料，这里已经被围得水泄不通\n“主席，这些，是真的吗，不是真的对吧，那种东西，我们的同类……假的吧”\n“我们在亲手杀死我们的同类吗，曾和我们并肩作战的伙伴吗，绝对不是吧，那种事情……太疯狂了……”\n吵吵闹闹，熙熙攘攘，鹿目圆正忙不迭的一个个安抚着不安的少女，她在说什么，她会说什么，她做好准备面对这种事了吗，晓美焰的脑袋里翻云倒海，但她还是强迫自己冷静下来，圆需要她，同志们需要她，这里的所有人都需要她……\n“焰副主席！”人群中突然有人喊道“焰副主席，玛吉斯说的那些魔女的事，是真的吗——？”\n骤然，一双双眼睛盯向晓美焰，啊，圆不知道，但她一定没有准备好，大脑一片空白，虽然一定要说些什么但辞藻却卡在喉咙里，什么也说不出……\n一瞬间的沉默，一瞬间的爆炸，人群更加吵闹，不安，焦虑，绝望的情绪覆盖整片人群，事态即将失控——\n“大家——同志们！”圆的声音响起，响彻人群，所有人停下动作，看向那个粉发的少女“欸，呼——同志们！\n\n我知道，大家来这里，无非是想要个答案，大家在害怕，怕自己导致了重视之人的死亡，怕自己未来要面对的，会是现在的同袍。\n\n但是啊，同志们，听我说，我们为何，你们为何要加入伯西尔共产党？我相信，不，我确信不是为了一己私利，不是因为这里有财可谋，有利可图，我们都是某人的孩子，为某人许愿而成为魔法少女，后悔吗，我不知道，但许下愿望的那一刻，我相信所有人都不会后悔，这是我们的愿望，这是我们选择的路\n\n魔法少女最终会成为魔女，很可怕吗，是的，很可怕。但不论这是真是假，我们要做的也永远不会变，解放所有被压迫者，而这其中，就有着被当作工具利用的我们，我们是QB的工具，以前或许是，但从今往后，从这一秒开始，知晓真相的我们绝不会任人宰割，我们会反抗，会帮那些已经不幸成为魔女的孩子们解脱，让她们重归伯西尔的土地，得到安眠，这不是什么自相残杀，绝对不是，这是反抗，是我们的，我们所有人的，在这不公命运上落下的沉重一笔——”\n\n掌声，经久不衰的掌声，看来这件事情已经告一段落，但为何，自己心中仍有一缕不安，这片焦虑，从何而来，为何会有，为什么会……"
  MTK_event.13.a:"“不好，巴学姐，圆——！”"

  MTK_event.14.t:"愿救赎仍在"
  MTK_event.14.d:"拨开人群，奋力奔跑，不安的情绪笼住整个心脏。\n“圆，抓住我。”晓美焰大喊着，臂上的盾牌转动，鹿目圆握住了她的手，时间就此停滞。\n呼吸声，喘气声，心跳声，在空气都为之停滞的现在，仿佛要震碎自己的耳膜。\n推开房门，不出所料，巴麻美的枪口正指着自己的灵魂宝石，手指已经放在扳机上，似乎再晚一秒，火药便会带着鲜血，结束她的生命。\n但还好，还好，还不算太晚，不算无可挽回。鹿目圆对着燧发枪奋力一掌，盾牌回正，枪声响起，阳光顺着屋顶的洞口渗进，照在巴麻美濒临崩溃的灵魂宝石上，照在鹿目圆晶莹的泪滴上……\n“为什么！”小圆嘶吼道，“为什么学姐会想着自杀！我认识的巴学姐，我认识的麻美姐——”\n“怎么会这么懦弱！”\n沉默，沉默，震耳欲聋的沉默，小圆扑在学姐身上，紧紧的抱住。大家的状态都不是很好，症状最轻的灵魂宝石也被绝望侵染的有三成以上……\n陆陆续续的大家都来了，来的人很多，伯西尔共产党几乎所有的魔法少女都来了，杏子搀扶着沙耶香，和百江渚一同牵着由麻的手，她们的状态都不是很好，但她们相互依偎着，互相靠着撑过来了。\n没有崩溃，因为心中仍有挂念.\n没有绝望，因为他人即是希望。\n“为什么要来呢，圆”巴麻美开口了，声音沙哑与颤抖的不像她，“反正我们都会变成那种怪物，不如……现在就死去，更好……”\n“开什么玩笑！”似乎是脱口而出，圆的声音在沉寂中激荡，在并不宽敞的房间内回响。“开什么玩笑……”\n啜泣声，心跳声，伴着死一样的寂静，狠狠的敲在每一个人心上。\n“够了，圆，已经够了”巴麻美推开小圆，缎带飞舞，束住想要再度停滞时间的晓美焰，隔开她与众人\n“但与其堕落变成魔女的话，我还是在这里死掉更好一些吧”\n燧发枪再次出现在巴学姐手中，她缓缓地举起手中的枪，对准已经几乎看不出光泽的灵魂宝石\n\n“能做大家的学姐，我很开心——”"
  MTK_event.14.a:"“麻美姐！”"

  MTK_event.15.t:"将绝望化为希望"
  MTK_event.15.d:"世界仿佛再次停滞，晓美焰的眼中再度浮现出学姐的末路，每一次，每一次……难道真的没有办法吗，难道巴学姐……无论如何也逃不出这该死的命运吗？\n我向神明祷告，求祂将福泽洒向这些悲惨的少女们\n我向世人伸手，求他们轻轻拉一把坠入深渊的我们\n但每一次，回应我的，只有自己，向我伸出手的，只有那个她\n我渴望救下所有人，我尝试救下每一个人，但她们每次都会倒在我前面，一个接一个，最后——仅留我一人独活\n哪怕这一次，圆，我们的心脏共鸣，我们的意念合一，我们在拯救彼此的同时也尽力拯救他人……\n但还是……什么都做不到吗，命运就如此无懈可击吗？高坐九天之上的神明啊，你为何如此残酷，行走在世间的人们啊，你们为何如此冷漠，不论是谁，无论是谁，救救我们——\n “救救，巴学姐……”\n轰——————\n尘土飞扬，铁器落在地上，黄色的缎带被狠狠砸在地上，沙耶香将巴麻美手中的枪砍落在地，百江渚冲上前去，死死的抱住学姐的双臂。\n“由……麻？”\n“自私鬼。”由麻对学姐说道，“麻美姐姐，简直就是小孩子！！！”\n啊，她在哭呢，那双青葱色的眼睛里，正闪着晶莹的泪花\n“麻美姐姐你有没有想过，不，你绝对没有想过”由麻抬起头，她的眼睛注视着巴麻美，她的声音震动着灵魂，“在乎你生命的人，永远不止你一个！所以不要，永远也不要——说什么到此为止了，死掉更好这种蠢到家的话！”\n泪水自脸颊滑落，滴落在厚实土地上，由麻的，鹿目圆的，沙耶香的，杏子的，百江渚的，晓美焰的……巴麻美的。\n而从屋外照进来的阳光，则将这些泪滴晒干，渗进土里，彼此交织。\n“由麻呢，在被妈妈欺负的时候，总是会想着，如果死掉了的话，也许会更好吧”\n“可是，在被魔女袭击，眼看就要死掉了的时候——”\n“由麻反而，拼命的想要活下去了”\n“呐，麻美姐，我们现在都知道，总有一天，我们也会变成那样的魔女——”\n“但总有一天，并不是今天，更不可能是明天”\n“因为我们还活着，还好好的活着，还在相互支撑着活着，只要活着，就一定有好事发生，只要活着，就还没有变成魔女！”\n“呐，麻美姐姐”由麻哭着，笑着，笑着又哭着“是啊，大家也总有一天会死掉的”"
  MTK_event.15.a:"“但麻美姐姐，你真的打算现在就死掉吗？”"

  MTK_event.16.t:"“总有一天”不是现在"
  MTK_event.16.d:"泪水，拥抱，话语说不出口，但大家都在，哭着，嚎啕大哭着，为逝者掩面，为生者痛哭\n哭累了，就倒在他人的臂膀中睡去，后勤处的魔法少女们拿来了悲叹之种，涤净在场所有魔法少女浑浊的宝石。\n在这里的，都是家人，放声哭泣吧，将所有的痛苦宣泄出来吧，然后，昂首迈向明天，带着微笑看看那初升的朝阳，看看那些记得你的，把你的生命看得比自己还要重要的，伙伴的，朋友的，亲人的笑脸吧。\n悲叹之种抽离那块琥珀中的黑色杂质，艳阳高照之下熠熠生辉，而宝石的主人，似乎已经沉沉睡去，她好久没有这么睡过了，足以安心的小家，可以相靠的同伴，尽管眼角还挂着泪水，但那些都不重要了，她已知晓，自己会昂首迈向明天，明天的明天，直至魔女消逝，直至再也无法迈步。"
  MTK_event.16.a:"晚安，所有心存希望的少女们"

  MTK_event.17.t:"后日谈 Ⅰ"
  MTK_event.17.d:"讲个笑话，学姐睡过去的时候，并没有解除魔法少女化，也就是说……\n“谁——来——救——救——我——”\n晓美焰还被挂在学姐的客房里，而学姐呢，因为扒拉不开小渚，所以她俩一起睡到给小渚准备的房间里去了。\n尽管小圆率先发现了不对，但是碍于当时的空气，现在也只好祈祷学姐能在睡梦中变回去，这样魔法就会解除，小焰就能被放下来了\n不过就目前来看，晓美焰还在被吊着\n“对不起，焰酱”"
  MTK_event.17.a:"再撑一撑，说不定过一会儿就能下来了"
  MTK_event.17.1:"§L而现实是，晓美焰被吊了整整一天，直到学姐起来才被放下来\n可喜可贺，可喜可贺§!"

  MTK_event.18.t:"后日谈 Ⅱ"
  MTK_event.18.d:"“麻美~写什么呢？”一大早，百江渚揉着眼睛打着哈欠看向灯火通明的案牍和坐在跟前的巴麻美，疑惑的问道\n虽然那天过去后，自己已经不会想着寻短见了，但小渚似乎一直放心不下自己，天天粘在自己身边，也是难为她了，平常睡得最死的大懒虫这几天有点风吹草动就会被惊醒，然后狠狠的抱住自己-不过，被关心的感觉还不赖？\n但话说回来，作为前辈在年龄最小的后辈面前寻短见，还被狠狠说教了一顿，真是丢人呐。\n“嗯？入党，申请书？”小渚瞬间清醒，抱着玩偶指着巴麻美面前已经写的差不多的文件叽叽喳喳的说道“啊，狡猾，偷跑，为什么不给我也写一份”\n“自己的事自己做”巴麻美白了小渚一眼，“但我的可以给你参考一下，虽然最后拍板的是圆她们就是了。”\n“欸，好吧，不过我听说由麻没写这东西都已经在党里了，那我是不是也——”\n“想什么呢，由麻今年才11岁，你多大了？”\n“15！”\n“在骄傲些什么啊，你这家伙”\n“我可比你年轻整整——”话出嘴边，学姐眯眯眼的笑容早已对上了小渚高谈阔论的脸\n“随便谈论女士的年龄，可是一个，非常 不好 的 习惯 哦——”\n“唔咦呀~——”\n\n翌日，鹿目圆敲响晓美焰的房门，虽然她早就知道，这个点焰已经起来了，但还是轻声喊道：“焰酱，起床了吗？起床了哦~”\n“不是说了不要这样子吗，莫，小圆你真是的。”\n阿拉阿拉，小焰害羞了呢，果然，这个表情最好吃了~~\n“那，找我什么事”“对了对了，差点忘了正事了”，小圆吐了吐舌头，从包包里掏出两份文件“麻美学姐和小渚的入党申请书，看来，她们现在状态恢复了呢。”\n“真是太好了呢，小焰。”\n晓美焰一楞，接过鹿目圆递过来的文书，娟秀的字体写着——‘申请人：巴麻美’这是她轮回百次从未遇见过的，啊，倒不如说，这条世界线，就是万千祈愿汇聚而成的——\n奇迹！"
  MTK_event.18.a:"是啊，太好了呢"

  MTK_event.19.t:"国难当头"
  MTK_event.19.d:" 神滨联盟议会的穹顶下，空气比上次分裂时更显凝滞。和泉十七夜指尖轻叩桌面，七海八千代斜倚椅背，议员们的窃窃私语中，仍带着对玛吉斯的妥协侥幸。直到议事厅的大门被猛地推开——金发的魔法少女昂首在前，身后，跟着的是昂首的共产党人。\n“巴将军？哦，不，现在该叫你巴麻美小姐——你怎么回来了？” 十七夜的声音打破沉寂，带着一丝意外。\n“我回来，是为了拉你们从悬崖边退回来！” 巴麻美的燧发枪在掌心一转，枪托重重砸在地面，地砖开裂，嗡鸣响彻全场，“你们所谓的‘协商互不开战’，不过是投降主义的自欺欺人！玛吉斯散布魔法少女的真相，你们竟还能无动于衷。孵化‘夏娃’——为了这个目的，玛吉斯那群疯子已经不择手段——她们正诱导着所有的魔女前往博望之馆，包括——瓦尔普吉斯之夜！”\n“§R而这，会把毁掉整个联盟，会将这伯西尔的大地上的所有生灵屠戮殆尽！§!”\n议事厅内瞬间炸开了锅，议员们的议论声此起彼伏。八千代皱起眉，起身反驳：“那依你的意思，是想重新与玛吉斯开战？玛吉斯诱导魔女不假，但她们这么做定是早已有了解决方法，但你口中的‘魔女之夜’，官方记载其出现极有规律，玛吉斯能诱导它来，不过是你们无端的幻想……”\n“幻想？” 晓美焰向前一步，紧紧握住小圆的手，“有关魔女之夜的规律记载不假，但相比那些教条，我确信你们早已收到消息——比我们更早，‘01L’这个代号熟悉吗，出现在大西洋中部的超级飓风，正直线冲向联盟北部。当然，耳听为虚——”晓美焰抬手，清脆的碰撞声响彻全场，骤然，议会的主席台上，舞台装置驰掣于大西洋之上的画面出现，“你们尽可去查证，我相信这要不了多久。”\n适时，鹿目圆开口声音温柔却带着不容置疑的坚定：“十七夜小姐，八千代小姐，我们不是来挑起争端的。伯西尔共产党的魔法少女们，已经做好了战斗准备——但我们需要整个联盟的力量，而不是你们在政治斗争中消耗彼此。” 她举起一份文件，上面是环彩羽传来的情报，“玛吉斯的信徒正在聚集，魔女的气息已经蔓延到边境，时间不等人了！”\n巴麻美接过话头，语气带着痛惜与愤慨：“当年你们解散议会军，是机会主义作祟；现在对玛吉斯一味退让，更是把无数人的生命当赌注！我曾因你们的懦弱而离去，但现在，我不能看着前辈们统合的联盟，不能看着我所珍爱之物尽数被毁在你们手中！”"
  MTK_event.19.a:"“国难当头，希望各位慎重考虑。”"

  MTK_event.20.t:"破局之选"
  MTK_event.20.d:"巴麻美的话像一颗石子投入湖面，议员们的议论声渐渐平息，不安的情绪在人群中蔓延。十七夜沉默地翻阅着那份情报，指尖微微颤抖——上面记录的魔女活动轨迹，与玛吉斯的聚集点完全重合，八千代派出的信使传回消息，那巨大的齿轮早已开始移动，不出七日，便会踏入联盟领海。\n“就算你们所言为真，玛吉斯那群疯子真的能引来魔女之夜——但联盟现在四分五裂，怎么整合力量？” 八千代靠在椅背上，语气不再强硬，多了几分无奈，“议会内部派系林立，我亲自下令也无法调动所有力量。”\n“那就把指挥权交出来！” 巴麻美斩钉截铁地说，“交给真正愿意为这个国家战斗的人，交给能团结所有魔法少女的人！”\n“你是说……你们伯西尔共产党？” 有议员惊呼出声。\n“我们没有兴趣争夺权力，”晓美焰冷冷开口，“我们站在这里，只想要阻止灾难。但如果你们继续抱着政治斗争不放，我们不介意强行接过这份责任——因为我们身后，站着所有不愿被命运宰割的魔法少女，站着所有渴望活下去的人。”\n鹿目圆轻轻摇头，目光扫过在场的每一个人：“不是‘交给我们’，是‘我们一起’。八千代小姐，你们曾为联盟的稳定付出过努力，我们相信你们的良知。现在，放下派系之争，放下个人得失，把国家的命运，交给真正能守护它的力量——不是分裂的议会，而是愿意团结起来的每一个人。”\n她的声音不大，却穿透了议事厅的每一个角落：“玛吉斯要孵化‘夏娃’，带来的是毁灭。而我们要的，是活下去，是守护这片土地。这早已不是所谓政治斗争，而是存亡之战。如果你们还想让联盟存在下去，那就请暂时放下政坛上的争论，和我们站在一起。”\n十七夜合上文件，抬起头，眼中早已没了之前的犹豫：“如果你们……真的能让联盟度过这次危机，那——”"
  MTK_event.20.a:"为了联盟，为了伯西尔，我们同意。"

  MTK.5.t:"为了更多人"
  MTK.5.d:"议事厅内一片寂静，随后，掌声从角落响起，渐渐蔓延至整个大厅。议员们纷纷起身，看向鹿目圆、晓美焰和巴麻美的目光，从质疑变成了期盼。\n十七夜走到台中央，拿起话筒，声音传遍整个神滨联盟：“我，和泉十七夜，代表神滨联盟议会宣布一项决定——即日起，联盟的军政大权，暂时移交伯西尔共产党，由鹿目圆同志统一指挥，巴麻美将军官复原职，同时晋升为联盟国防军总司令，整合所有力量，对抗玛吉斯，阻止魔女之夜毁灭我们的家园！”\n八千代站在她身边，补充道：“议会将全力配合伯西尔共产党的计划，提供所有必要的资源与情报。至少灾难结束前，没有派系之分，没有政见之争——有的只是想要活下去的我们。”\n鹿目圆走到话筒前，深吸一口气，声音清澈而坚定：“感谢议会的决断，感谢所有愿意并肩作战的伙伴。我向大家承诺，伯西尔共产党绝不会辜负这份托付——我们会团结每一位魔法少女，整合每一份力量，对抗玛吉斯，粉碎她们的计划，守护我们共同的家园！”\n“我们或许会面临艰难险阻，或许会付出沉重代价，但请记住——” 她的目光扫过每一个人，带着温暖与力量，“我们不再是孤身一人，身后有彼此，有整个伯西尔的人民。绝望或许会来临，但希望永远不会熄灭。”\n台下响起雷鸣般的掌声与呐喊，所有的分歧与矛盾，在生死存亡的关头烟消云散。伯西尔的命运，此刻紧紧握在了团结起来的人们手中。"
  MTK.5.a:"“愿希望与我们同在，愿联盟繁荣昌盛！”"


  MTK_event.21.t:"记忆的碎片"
  MTK_event.21.d:" 博望之馆，这个巨大的“谣”，环彩羽行至其中，空气中弥漫着魔法与金属混合的晦涩气息。小QB的爪子踩在石阶上发出细碎的声响，身后跟着的环彩羽攥紧了拳头，指尖因用力而泛白——她找了太久，久到几乎以为自己会永远失去那两个被世界遗忘的妹妹。\n“Q~” 小 QB 停下脚步，坐在塔底的密室大门前回首望着彩羽\n彩羽深吸一口气，推开沉重的石门。密室中央，里间灯花正对着一堆复杂的魔法阵图纸皱眉，柊音梦坐在一旁，指尖萦绕着淡淡的荧光，神情恍惚得像随时会消散。听到动静，灯花猛地抬头，翠色的眼眸里满是警惕，手中瞬间凝聚出机械齿轮状的魔法：“谁允许你进来的？”\n“灯花，音梦……” 彩羽的声音带着抑制不住的颤抖，一步步向她们走近，“是我，彩羽，是姐姐啊。”\n“姐姐？” 灯花嗤笑一声，魔法的光芒更盛，“攀关系能到这种程度，我可从来没有什么……。”\n“姐姐……”音梦却缓缓抬起头，眼中的恍惚渐渐被一丝熟悉的悸动取代。突然，漫天的荧光洒满整个屋子，无数细碎的光点在空中拼凑出模糊的影像——是彩羽为她们讲睡前故事，是音梦偷偷把最爱的糖果塞给姐姐，还有……她们三人，站在疗养院的顶楼，向QB许愿的那一刻……\n“姐……姐？” 灯花的魔法开始不稳定，那些影像像一把钥匙，撬开了她被世界锁住的记忆。\n“Q~”小QB的高昂一叫，奔跑在虚空出现的光影上，更多记忆碎片涌现：她们孤注一掷将环优的灵魂剥离，但世界为了“平衡”抹去了她存在的痕迹，甚至让彩羽与她们姐妹反目，让灯花执着于孵化夏娃——只因潜意识里，她想找到“让重要的人回来”的方法……\n“彩羽……姐姐……” 灯花眼角闪烁着泪花，一直以来支撑她的“救赎”执念，此刻终于露出了本质——是对亲人的思念，是对分离的不甘。\n彩羽再也忍不住，快步上前，一把将灯花和音梦紧紧抱在怀里。滚烫的泪水瞬间浸湿了彼此的衣襟，她一遍遍地重复着“对不起”，声音哽咽。“对不起，我来晚了……对不起，姐姐没有保护好你们，没有早点找到你……明明我是姐姐，却让你们独自承受这么多，以至于优的事情……”\n“姐姐……” 音梦声音颤抖，小QB跃上她的膝间，“我以为……以为连你忘了我们，以为世界上再也没有人记得优了……”\n“没有！我从来没忘！”彩羽冲上前去，用力抱紧自己的两位妹妹，仿佛要将这些年的思念与愧疚都融进这个拥抱里，“优一直在我心里，你们也一直在！我找了你们好久，好多好多地方，我知道你们不是要毁灭世界，你们只是……只是想把优找回来，对不对？”\n灯花的肩膀剧烈颤抖着，之前的强势与冷漠彻底崩塌。她攥着彩羽的衣角，像个受了委屈的孩子般放声大哭：“姐姐……我们好害怕……夏娃……就是优，但我忘了，我以为……那个计划……能让一切回到过去……”\n“我知道，我都知道。” 彩羽轻轻拍着她们的背，泪水模糊了视线，“现在还不晚，一切都还来得及，优绝对能回来。我们一起找，一定能找到真正的方法，把优带回来，不用牺牲任何人，不用再互相伤害……”"
  MTK_event.21.a:"“姐姐，我们听你的，我们一起找优回来！”"

  MTK_event.22.t:"Interesting"
  MTK_event.22.d:"顺着楼梯向上，博望之馆的核心控制室里，幽蓝的魔光随着装置的关停渐渐黯淡。音梦打开怀中的书本，术式运转的光芒暗淡，那些用于吸引魔女的魔法波动如潮水般退去——持续向博望之馆聚集的魔女，终于被按下了暂停键。\n“这样就…… 结束了吗？” 灯花望着沉寂的装置，指尖残留的记忆魔法还在轻轻抚平因装置运转而紊乱的空间，声音里带着一丝释然。\n彩羽握紧了怀中的小QB，望向远处沉睡中的‘夏娃’。“还没有，”她轻声说，“这只是迈出了第一步，接下来只要找到将优带回来的方法……”\n“First_and_foremost？谁允许你们停下的？”\n冰冷的声音突然从控制室门口传来，带着毫不掩饰的嘲讽。三姐妹猛地转头，只见阿莉娜格雷斜倚在门框上，空中的方块闪着幽绿的光，指尖在空中转了个圈，极具威胁性的笑容看的人心里发毛。\n“阿莉娜？” 灯花瞬间绷紧了神经，机械齿轮状的魔法在她周身展开，“你怎么会在这里？”\n“Oh_why？”阿莉娜嗤笑一声，向前迈步，“当然是来亲眼目睹那‘伟大的艺术’的birthday。‘夏娃’是玛吉斯plan的核心，是让这个腐朽的world重获‘美感’的唯一途径，你们凭什么因为一句‘找姐姐’就敢让一切game_over？”\n“这是我们的决定，”音梦站起身来，与灯花并肩而立，记忆魔法化作光带缠绕在她周身，“我们已经知道了真相，我们要找的是回家的路，不是毁灭的结局！”\n“Ture？The_beauty就是the_true！”阿莉娜猛地挥出身旁的方块，人造使魔叫嚣着冲来，“被世界遗忘的pain、失去亲人的despair——这才是最纯粹的ART夏娃的苏醒，魔女之夜的降临，会让所有人都feel到这种‘Beautiful’，而你们这些懦弱的家伙，根本不懂！”"
  MTK_event.22.a:"所以，我要来给我的艺术品——落上点睛之笔！"

  MTK_event.23.t:"断尾"
  MTK_event.23.d:"“姐姐，你带小QB和夏娃先走！”灯花大喊着，阳伞转动，巨大的齿屏障瞬间形成，挡住了使魔的冲击，“这里交给我和音梦！”\n“可是你们……” 彩羽眼中闪过犹豫。\n“相信我们吧，姐姐！”音梦的记忆光带突然爆发，化作无数碎片冲向阿莉娜，“我们比你更了解她的魔法，你带着忧离开，才能不让我们的努力白费！忧还在等我们，你不能出事！”\n小QB立刻跳到彩羽肩头，圆溜溜的眼睛里满是急切“Q~”\n彩羽咬了咬牙，深深看了灯花和音梦一眼，转身朝着夏娃跑去。身后，魔法的碰撞，人造使魔的嘶吼、阿莉娜疯狂的笑声交织在一起，每一声都像针一样扎在她心上，但她不敢回头——她知道，只有带着夏娃逃离，才能不辜负她们。\n通道外，夜空已经被染成了诡异的暗红色。远处的天际线尽头，一团巨大的乌云正在快速逼近，那是魔女之夜的气息，沉重得让人窒息。彩羽坐在巨大的魔女头顶，小QB蹲在身旁，骤然，庞大的羽翼虚张，夏娃腾空而起，仅一息之间，便要冲出博望之馆。\n博望之馆外，是阿莉娜设下的结界，只要冲出去，一切……一切都能在未来解决，但，太顺利了，彩羽心中发毛，看着蹲在一旁的小QB，她摇了摇头，希望是自己……想太多了吧。\n博望之馆内，灯花将阳伞指向阿莉娜的咽喉。敌已技穷，性命已在她呼吸之间。\n“阿莉娜，你毫无战胜我们的可能性。”音梦说着，合上书本，远处，围着博望之馆的魔女已经散去大半，海平面上的舞台装置也停下了脚步，似乎，一切都将迎来众人心中的好结局……\n“哇哦哇哦，几位还是这么不讲情面呢。”\n“但我想你们也清楚，我阿莉娜，从不打无准备之仗。”\n清脆的响指声传出，阿莉娜身旁最后一个方块直冲云霄，刹那间，围绕在博望之馆的结界消逝，但也在同时，彩羽离去的方向，响彻天际的哭嚎与尖啸声传来。海平面上，巨大的齿轮转动，舞台装置和它的使魔直挺挺的向着她们而来。"
  MTK_event.23.a:"surprise！"

  MTK_event.1.t:"避无可避"
  MTK_event.1.d:"‘夏娃’，没有灵魂的魔女躯壳，彩羽能驭动它，也是多亏了音梦创造的谣，但谣终究无法遏制夏娃的本能，当阿莉娜的结界消失，她们正准备奔向三日月庄时，那颗墨绿色的立方体却突兀的出现在她们眼前\n“什……”\n来不及反应，术式展开，魔女脱出，夏娃的本能反应快过了所有人——它一口，将那个魔女咬碎，吸收……\n变故，就来于此……\n\n“那可是我好不容易才抓到的，瓦尔普吉是之夜的使魔。”阿莉娜将脖颈抵上灯花的伞间，猩红的血液染红了洁白的衬领，“你说，我们的‘Artwork’和魔女之夜首次碰撞，会是何种场景呢——”\n“疯子”\n\n在博望之馆，彩羽也曾见过夏娃吞噬魔女，但却从未见过它有如此之大的反应，“Q~”小QB还在自己身边，夏娃呢？彩羽抬头望去，它趴在一旁，洁白的羽翼不知何时添上了几缕黑色，阳光穿透树丛，齿轮的痕迹若隐若现……\n“忧……”彩羽张口，脑中的嗡鸣仍在持续，她撑起身子，抚摸着夏娃那巨大的脑袋。“不要怕，姐姐在——姐姐在……”\n听觉渐渐回来了，风与树叶嬉戏，沙沙作响，小QB从彩羽左肩跑到右肩，又从右肩跑回左肩，“Q~,Q~”\n彩羽伸出手摸了摸小QB的头，小QB纵身一跃，跳到夏娃巨大的鸟头上，“Q~”\n“忧，怎么了……”彩羽有些疑惑，除了刚刚那个小插曲，按理来说，一切都应该……\n“呵呵，哈哈哈，啊哈哈哈哈哈哈——”癫狂的笑声自地平线上传来，远处，舞台装置的身影高悬于天，地上的夏娃猛的一震。如果魔女之夜与夏娃相撞，那忧——\n会不会就再也回不来了……羽翼腾飞，划破孤夜。\n“灯花，音梦，我该怎么办……忧，我该……怎么办”彩羽别无他法，只能带着忧，向南方，远一点，离魔女之夜再远一点。但……最终又能跑到哪里去呢\n“哔哔——哔哔”\n通讯响起，这种时候，是谁……\n“八千代？”"
  MTK_event.1.a:"彩羽，到见泷原来，我们仍有一线生机。"

  MTK_event.2.t:"魔女之夜抵近见泷原市区"
  MTK_event.2.d:"风暴裹挟着碎石，使魔簇拥着舞台装置，魔女的哭丧般笑声回荡在见泷原市每一位魔法少女的耳边，声如洪柊，刺穿耳膜。\n“喂喂，我们真的要和这个大家伙打吗。”沙耶香看着那遮天蔽日的巨大齿轮，悻悻地说道。\n“怎么，害怕了？那你记得好好躲在后面。”杏子扛着长枪，久违的，她没有从某些神奇口袋里掏出百奇咔嗞。\n“谁在哆嗦还不一定呢”，沙耶香转身靠在顶楼的栏杆上“对吧，由麻酱……”\n不兑……“等等，由麻，你怎么来这里了，杏子没跟你说这很危险吗，啊完了我就不该信杏子能把你带好。”  “不是这也能把锅甩我头上？”\n“不能怪杏子”由麻摇摇头“是由麻自己想来的，由麻也想帮到姐姐们。”\n“我同意了由麻的作战请求。”黄色的缎带绑着百江渚落在地上，麻美傲人的身姿优雅的落在众人身边，“而且你们两个这么久了，也没点前辈的样子。”\n麻美抬头，看向越来越近的魔女之夜，缓缓开口：“焰说她有办法，但具体是什么她没有告诉任何人。”\n“圆呢？”\n“据我所知，也没有。”\n“啊，烦死了，都大决战了现在互相猜也没什么用，她说她有办法那就相信她好了。”片刻的沉默后，杏子开口打破僵局，“毕竟现在，要对付那个大家伙，也只有全盘信任了。”\n“是啊”麻美轻轻叹了口气，事到如今，也只有如此了，麻美再次望向天空，拍了拍手，“好了，大家，我再重复一遍我们的任务：圆和焰负责主攻瓦尔普吉斯——”"
  MTK_event.2.a:"我们，负责创造机会"

  MTK_event.3.t:"一隅"
  MTK_event.3.d:"见泷原——国家某体育场顶层\n\n“紧张吗，焰。”圆紧了紧握着焰的手，手心传来略显滑腻的触感。\n“欸，为什么要这么问”小焰微微一怔。\n“因为，出了很多汗呢……”\n“唔欸——”焰快速抽回了手，叠在胸前揉搓着衣领，“这种事，我也没，就是……”\n“哼哼”圆微微笑道，焰的脸也骤然变得通红，“怎么样，这下好点了吧。”\n圆将手叠在焰的胸前，“看吧，我其实也在紧张呢。”\n“圆……”心跳声压过呼啸的狂风，圆将额头抵在焰的左胸前，感受着那阵阵蓬勃的心跳\n“小焰，请你记住，不管怎么样……我都在你身边”"
  MTK_event.3.a:"……嗯"


  MTK_event.4.t:"命运"
  MTK_event.4.d:"即使在这条奇迹相汇的世界中，战胜这最后的强敌，似乎也并非想象中那么容易\n子弹，炮火，魔法，结界……各种术式倾泻而出，却尽数被周遭的使魔拦下，无法伤及那巨大的齿轮一毫……\n这条世界线中，瓦尔普吉斯之夜似乎过分强大了。\n“喂，焰，这样下去不行，消耗战我们占不到一点优势”杏子大喊道，踏着沙耶香甩出的军刀劈开一只使魔\n“我知道！好吧，掩护我再近一点！”\n盾牌转动，麻美的丝带缠在五人脚踝处，风声暂止，少女们在空中寻找着力点，奔向那百米高空，这还是焰头一次，如此近距离的看到那张可怖的侧脸“冷静，冷静，一定可以的，这么近的距离的话……”\n等等，不太对劲，太安静了，圆她们应该就跟着自己身后的，等等……\n晓美焰猛的回头，却不见同伴的影子，定睛看去，缠在自己脚上的四代早已不知何时被悄然斩断，麻美震惊的表情凝在半空……\n“怎么……”\n“哈哈哈——哈哈哈哈哈——”刺耳的笑声震得晓美焰脑袋发木，她强撑着回头，瓦尔普吉斯那巨大的笑容已转过头来正对着她，刺耳的声音正是从那夸张的笑脸后传出……\n“不可能，时间明明静止了，你怎么可能——”\n还没等晓美焰反应归来，魔女之夜衣袖一挥，巨大的楼层废墟猛地向晓美焰压去——“哈哈哈哈——啊哈哈哈哈！”笑声回荡在大脑中，废墟高速压着晓美焰砸向地面。余光看见，她的伙伴仍被停滞在时空中……"
  MTK_event.4.a:"盾牌回正，纱漏已尽"

  MTK_event.5.t:"宿命"
  MTK_event.5.d:"鲜血自肺部涌出，呛的人五脏生疼，焰咳嗽了几声，鲜血染红了她胸前的衬口，她试着移动，可似乎双脚已经离她而去，瞳孔回正，她这才看清，自己的双腿早已被砸的变形，换个普通人来，这会儿早就已经死了吧。\n可惜，她是魔法少女，可惜她，是魔法少女。\n“啊——”只是大脑传递的短短的电信号，她已错位的双腿骨骼编传来了极度的不满，这股疼痛差点又让她晕过去.\n“哈——哈，”晓美焰大口喘着粗气，狂风从她耳边呼啸而过，她的盾牌已经不能再转动哪怕一毫，这也就说明着，她现在除了有个魔法少女的身体外，已经什么都做不到了……"
  MTK_event.5.a:"哈——哈……"

  MTK_event.6.t:"挣扎"
  MTK_event.6.d:"虽然不能像美树那样断肢再生，但暂时封住痛觉还是做的到的，不过尽管如此，晓美焰的双腿仍旧使不上劲，勉强的站立对她而言已是极限，更别说，魔女之夜的笑声适时的响起，下一轮攻击已席卷着碎石呼啸而来。骤然，焰双腿发软，瘫坐在地……"
  MTK_event.6.a:"不甘心呐"

  MTK_event.7.t:"抗争"
  MTK_event.7.d:"神滨——议会大厅\n“如各位所见，瓦尔普吉斯之夜横穿整个联盟，径直插向了见泷原，沿途的城市甚至没受到多大的灾害，”八千代顿了顿，继续说道。“不过，我并不认为继续在这里看巴麻美她们在见泷原拼死是什么明智之举，正如她们所说的，这是一场国难。”\n穹顶之下，叽叽喳喳。在议会成立的近百年来，红党的生态位一直在被打压，她们更多是一种背景板而非整个执政联盟中的一环，这里面包含很多因素，但归根结底——\n“这是政治，八千代小姐。”议员席上，美国织莉子出声道，她的家族在议会中算是老资历，她们所代表的极右翼政见尽管比红党更天方夜谭，但却实打实的控制住了不少席位。“这场天灾终会过去，我们只不过是把眼光放得更长远些……”\n“拿人命当棋子吗？”八千代冷哼道“十七夜，你也要玩这些肮脏的手段吗？”话锋一转，八千代看向坐在主席位的和泉十七夜。\n沉默，十七夜靠在椅背上，眼神微眯，沉默，厅内的哄闹声渐息，所有人都将目光投向主舞台，看向那对峙中的蓝白二人。\n不解，震惊，最后到愤怒。八千代悲痛的看向昔日义愤填膺的老友，“我没想到——”八千代注视着那只紧闭着的眼睛，“你引以为傲的正义呢？”\n失望和愤慨堵住八千代的气管，她几乎快要站立不住，天蓝的宝石闪烁，长枪击碎瓷砖，八千代喘着粗气，一字一顿的说道，“我真后悔，相信过你。”\n\n议会再次陷入混乱，有些人义愤填膺的指着十七夜的鼻子骂，有的人夹起东西愤然离席，有些人嘲弄地看向颤抖的八千代，但更多的人——她们窃窃私语，思考如何能在这场乱局中捞到更多利益。\n这就是我们欣欣向荣的联盟大议会啊。\n骤然，门被推开，与上次不同，这一次进来的，是戴着兜帽的玛吉斯，不，她们胸前没有挂着那枚玛吉斯的象征，领头的人是——梓美冬？\n“小八，”梓美冬开口，“无关身份，无关立场——”"
  MTK_event.7.a:"我想请你，救救那些孩子们。"

  MTK_event.8.t:"Neither"
  MTK_event.8.d:"赤色的结界缠着金黄的缎带展开，湛蓝的指挥刀闪着她的颜色切开碎石，白发少女护着由麻突进结界——睁眼，她的温度自我的脸颊处传来，啊，这双手，我绝对不会认错的，圆的双手……\n“对不起呢，焰……”"
  MTK_event.8.a:"我来晚了"

  MTK_event.9.t:"气球"
  MTK_event.9.d:"“怎么搞成这样，晓美焰。”沙耶香劈开瓦尔普吉斯之夜派过来的使魔，“伤这么重，这和过去那个意气风发的你简直判若——两人呐”\n“别搁那儿说风凉话了，专心应敌。”杏子挑飞向沙耶香冲来的小型使魔，“别老漏怪让我帮你。”\n“抱歉抱歉，只是看着她那个衰样就想说两句。”沙耶香靠向杏子，“所以呢，焰你的计划算是失败了吧，那我们接下来怎么办？”\n“是在不行的话，见泷原都可以放弃。我们带着彩羽她们继续撤。”麻美说道，“瓦尔普吉斯之夜说到底更像自然灾害，只要让它在这里将所有诅咒能量全部释放掉，自然就会消失了。”\n“啊，所以还是变成消耗战了啊。”沙耶香感叹道，“总之先扛过这一波攻势吧，后背交给你了哦——搭档！”\n“不用你说——”\n一蓝一红两道身影再空中跳起优雅的华尔兹，晓美焰靠在一侧，圆跪坐在地上抱着她，由麻在为自己治疗，小渚则警戒着周围，麻美处理着时不时突破爽杏二人组成的防线的使魔，腰间的无线电红灯闪烁……\n“呐，圆……”晓美焰开口，“我是不是……很没用啊，这次……又被你救了”就像最开始遇到你的时候一样\n“莫，又说这种话！”圆微微愠怒，“在我心里，小焰一直是最勇敢，最坚强的孩子，从最开始遇到你开始，直到现在，这分心意，从未改变。”\n“如果，你要这样一遍又一遍的否定自己的话，那我，鹿目圆，就要一次又一次的肯定你，直到你重新站起来，愿意牵着我的手继续走！”\n“站起来，晓美焰——”"
  MTK_event.9.a:"你可是，我最喜欢的人呐"

  MTK_event.10.t:"比绝望更深沉"
  MTK_event.10.d:"圆搀扶着焰，粉色的魔法向身后射出，配合着麻美的燧发枪击退一波又一波的使魔，在这场风暴中心，似乎没有一处可以提供些许喘息的地方。\n“圆，美树，注意头顶。”麻美喊道，在她眼前，瓦尔普吉斯之夜身旁的使魔正以极其诡异的角度向她们冲来。\n沙耶香与杏子负责开出向外的通路，压力相比断后的麻美小得多，但也不能掉以轻心，瓦尔普吉斯之夜的使魔无处不在，更别说，它们还处于风暴中心。“杏子，能解决吗”沙耶香喊道，被动挨打不如主动出击，围绕在魔女之夜身边的使魔主动出击，说明这场消耗战起码，不再是绝对的劣势了。“我去把那个家伙干掉”\n“小心点，”杏子头也不抬的喊道，“打不过就喊人。”\n“哦——”沙耶香嗯了一声，转身弹上天空，那只横冲直撞的使魔很快便被锁定“喂喂，这里是禁飞区！”沙耶香大喊，指挥刀在手中浮现。\n铁器与利爪交锋，一息之间，这只诡异的东西便被分成了两半。“就这种程度，看来所谓的瓦尔普吉斯也就会点下三滥的……”\n“嘻嘻嘻嘻——哈哈哈哈哈！”诡异的笑声传出，沙耶香被粗暴的打飞出去，被百江渚堪堪接住，抬眼，使魔调整身姿，直挺挺的冲向她们阵型的中心。"
  MTK_event.10.a:"圆！晓美焰，小心！"

  MTK_event.11.t:"“我们”的抗争"
  MTK_event.11.d:"“简直莫名其妙！”见泷原的某处废墟上，鲜红的瞳孔注视着从各个方向突入的少女与普通士兵，这里的有些人，甚至连使魔召唤的杂兵都打不过，但她们义无反顾，被困住一个，就有十个来帮她脱困，最后十一个人继续向前突围，循环往复，茫茫的人海将这场风暴死死捆在这里。\n猎狼犬的导弹射向齿轮，狐步舞者呼啸者投下汽油弹，空突师向晓美焰等人靠拢，士兵对上使魔，即使知晓无法战胜，也无一人退缩，她们拼上性命，也只求那几人无恙。\n“这些家伙为什么如此不爱惜自己的生命，救那几个人有必要这样吗！”越来越多的QB站上高楼，它们看不懂，也无法理解，魔法少女是为何变得如此团结，凡人为何为了救那几个魔法少女如此视死如归。\n“你当然无法理解了”空灵的声音再度响起，微型结界陡然张开，白发少女一袭黑色长裙，款款落在这群QB的中央。“魔法少女，也是人类。”\n“而这，是人类的赞歌。”  “简直莫名——”\nQB的声音被陡然掐住，少女竖起食指，款款说道：“嘘——”\n\n““报告，舰长、师长，坐标已确认！””\n见泷原港口与郊外某处几乎是同时传出，无线电的嗡鸣结局，战列舰的炮口调转，炮兵阵地严阵以待——"
  MTK_event.11.a:"收到坐标，炮位就绪，立刻发射"

  MTK_event.12.t:"比奇迹更耀眼"
  MTK_event.12.d:"风暴已经过去，但风暴留给人们的震动仍在继续。如今，赤旗已插遍南亚美利加，所有人，都在欢呼这一伟大的时刻到来……\n“圆主席！焰总理！巴总司令！——”这些天来，这种场面已是常态，不管走到哪里，群众的高呼，激烈的掌声，警卫员在面对滔天民意也显得力不从心。\n“怎么了，小焰？”离开时，焰怔怔的看着远处的废墟，那是很久以前，焰第一次许下愿望的地方，现在，那里正竖起钢筋，高楼的地基初见雏形。\n“呐，圆，我做了个，非常糟的梦。梦里，麻美死的不明不白，沙耶香变成了魔女，杏子也不知所踪，最后，连你……连你也”\n“连你也离我而去，整个世界，留我一人独活……”\n“小焰……”圆开口，她知道，她见过，小焰遭遇过的一切她全都知道，小焰对她的誓言，她与小焰的约定，她愿意用一生来履行。\n“嗯，那真是一场非常可怕的梦呢。”鹿目圆抹去晓美焰流下的泪滴，轻轻落上一吻。“但，没关系啦，你看，我不是在这里吗。”\n“我和你，麻美姐，沙耶香和杏子，大家都活得好好的哦。”\n“喂，小圆，小焰，再不走我就把你们丢下了哦——”不远处，杏子叼着百奇，麻美笑着牵着小渚和由麻，沙耶香转身向她们喊道。\n\n风暴终会消散，希望也不会真正磨灭。这些被记述下的东西所构成的——就是我们骄傲的文明本身。  ——看哪，花儿开了，草儿绿了，人们回家了，东风吐出鱼肚白，太阳———升起来了。"
  MTK_event.12.a:"有太阳就有希望。"

