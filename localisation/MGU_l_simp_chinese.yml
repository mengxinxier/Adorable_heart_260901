  MGU_Walpurgisnacht_resolution_1:0 "灵装突击"
  MGU_Walpurgisnacht_resolution_1_desc:0 "集结魔法少女进行一次灵装突击，§G减少§!魔女之夜§Y10§!点能量（若已有§Y本世代灵装§!额外+5）"
