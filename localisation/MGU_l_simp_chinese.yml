magicunion.1001_MGU_TB.t:0"魔联占据列宁格勒"
magicunion.1001_MGU_TB.desc:0"令人震惊的消息传来，根据可靠情报显示，在极端左翼主义份子的帮助下魔联已经占领了列宁格勒，这个过程十分的迅速，一些不愿加入的政委已经被从控制区中驱逐。\n\n目前城市内的情况稳定，几乎没有发生流血事件。但是无论如何，苏联绝不会善罢甘休，亦不会容忍这种叛逆行为。"
magicunion.1001_MGU_TB.a:0"纯正理念的重大胜利。"
magicunion.1001_MGU_TB.b:0"共匪们内讧了？有意思。"
magicunion.1001_MGU_TB.c:0"发生了什么？？？。"
magicunion.1001_MGU_TB.d:0"这帮魔怔壬已经不是一般的异端了！§R必须出重拳！§!"

magicunion.1002_MGU_TB_MGU_TB.t:0"铲除西北方的左翼极端主义"
magicunion.1002_MGU_TB_MGU_TB.desc:0"我们决不能容许那帮§R极端主义魔怔人§!占据我们的城市，我们坚定地苏联的军队已经准备好重拳出击。历史会证明我们才是正确的。"
magicunion.1002_MGU_TB_MGU_TB.a:0"§R出发！！§!"

magicunion.1003_MGU_TB_MGU_TB.t:0"魔联外交大使"
magicunion.1003_MGU_TB_MGU_TB.desc:0"魔联外交大使来到了我们国家，她们似乎对所谓的纯正共产主义有着十分严格，以及不合常理的极端看法。\n\n她们想要深入了解我国的工党和社会现状的事情，并且想要学习我们的时钟机关技术，我们该怎样回应？"
 magicunion.1003_MGU_TB_MGU_TB.a:0"§R赶她们走！让这帮共匪哪来的回哪去！§!"
 magicunion.1003_MGU_TB_MGU_TB.b:0"带她们随便看看，但是不会有更多。"
 magicunion.1003_MGU_TB_MGU_TB.c:0"满足大使同志们的一切要求。"

  magicunion.1004_MGU_TB.t:0"外交大使被驱逐"
  magicunion.1004_MGU_TB.desc:0"我们的大使被赶回来了，我们能了解到一件事，她们不喜欢我们。"
  magicunion.1004_MGU_TB.a:0"加紧战备！"

  magicunion.1005_MGU_TB.t:0"外交大使返回"
  magicunion.1005_MGU_TB.desc:0"我们的大使顺利进入瑞典国内，并查看并影响了当地的一些状况，成功提升了她们国民对共产理念的支持。"
  magicunion.1005_MGU_TB.a:0"做得好"

  magicunion.1006_MGU_TB.t:0"外交行动大获成功"
  magicunion.1006_MGU_TB.desc:0"瑞典政府满足了大使提出的一切要求，而我们的大使在瑞典也受到了当地工党的热烈欢迎，甚至还给予了我们先进的时钟机关技术。"
  magicunion.1006_MGU_TB.a:0"真是难得的款待，我们的前方，绝无敌手。"

  magicunion.1007_MGU_TB.t:0"对游击队的最后通牒"
  magicunion.1007_MGU_TB.desc:0"在边境线上，联盟军的部队已经部署了攻击阵型，只等前线指挥官一声令下，就会将这里化为血腥的炼狱，而在可视距离内，那些共党们那零星的掩体和碉堡显得是那么的无力。而联盟军的前线指挥官仍然在尝试着她那徒劳无功的劝降。\n\n太阳的余晖映照着战壕里那些红军战士们，攻击时间已经临近了。那些游击队战士，她们应该和她们的家人待在一起，而不是在这个绝望的战壕里，她们完全没必要牺牲在这里，只要她们肯放弃抵抗，还有大把的年华等着她们去体验人生的悲欢离合。\n§0“最后一次警告！立刻投降！你们毫无胜算！磅礴的魔力在我们的灵魂中回荡，我们有整个联盟的军工产能，而你们这狭小的根据地，和你们的这些理想与梦想，对我们而言就如同可以轻易戳破的浮沫，你们凭什么对抗我们！”§!\n\n游击队终于对劝降有了一次回应：§R“我们有希望！”§!"
  magicunion.1007_MGU_TB.a:0"那么，这就是她们的遗言了。"

  magicunion.1008_MGU_TB.t:0"那些共党绝不放弃"
  magicunion.1008_MGU_TB.desc:0"现在我们该回过头来解决南方的叛军问题了，但是笠音青带领的共党游击队，她们斗志高昂，仍然不愿意放弃，毫无疑问，她们会为了她们那赤红的理想，而奋斗至最后一刻，虽然她们已经毫无胜算。"
  magicunion.1008_MGU_TB.a:0"既然她们不愿意妥协，那我们也没必要向红党低头。"
  magicunion.1008_MGU_TB.b:0"如果她们不愿意加入我们，那我们可以加入她们。"

  magicunion.1009_MGU_TB.t:0"爆发工党起义"
  magicunion.1009_MGU_TB.desc:0"在外国特工的煽动下，我国的工党爆发了武装革命。"
  magicunion.1009_MGU_TB.a:0"稳住阵线！"

  magicunion.1010_MGU_TB.t:0"魔联想要与我们合作"
  magicunion.1010_MGU_TB.desc:0"根据南方传来的消息，东南方的魔法少女们似乎正准备对南部的雨林进行人类的开发行为，她们尝试与我们合作。为此她们愿意协助我们加固对抗北方殖民者的阵地。"
  magicunion.1010_MGU_TB.a:0"喵？"

  magicunion.1011_MGU_TB.t:0"清扫战区I"
  magicunion.1011_MGU_TB.desc:0"魔联的内战终于彻底落幕了，我们缴获了很多工业设备与生产基地，在简单的修复后可以重新投入生产，我们决定……"
  magicunion.1011_MGU_TB.a:0"补充工业生产，为将来做准备。"
  magicunion.1011_MGU_TB.b:0"保障军工生产，才能度过黑暗的深渊"
  magicunion.1011_MGU_TB.c:0"开启造船业，保护我们的海岸。"

  magicunion.1012_MGU_TB.t:0"清扫战区II"
  magicunion.1012_MGU_TB.desc:0"虽然战争已经结束，但是有可靠情报，叛军残余正在试图炸毁她们的弹药库，以及实验性的原型兵器，而我们只能保护其中一个。"
  magicunion.1012_MGU_TB.a:0"保护原型兵器。"
  magicunion.1012_MGU_TB.b:0"保护弹药库。"

  magicunion.1013_MGU_TB.t:0"与军团的交易"
  magicunion.1013_MGU_TB.desc:0"因为‘某些’原因，叛军与“军团”做了某些交易，而一部分叛军也流窜到了边境线之外……"
  magicunion.1013_MGU_TB.a:0"我们尽力保障苏联工农业生产。"
  magicunion.1013_MGU_TB.b:0"我们尽力维持社会的安全稳定。"

  magicunion.10131_MGU_TB.t:0"社会调查"
  magicunion.10131_MGU_TB.desc:0"虽然瘟疫对造成了可怖的打击，但是最近我们的有关部门发现，工农业恢复的比预想的要快。"
  magicunion.10131_MGU_TB.a:0"这是好事。"

  magicunion.10132_MGU_TB.t:0"社会回暖"
  magicunion.10132_MGU_TB.desc:0"虽然瘟疫对造成了可怖的打击，但是最近我们的有关部门发现，行政机构恢复比预想的要快。"
  magicunion.10132_MGU_TB.a:0"这是好事。"

  magicunion.1014_MGU_TB.t:0"军团要求赔偿"
  magicunion.1014_MGU_TB.desc:0"在这些年里，魔联叛军曾经与军团有过密切的联系，并以一些代价换取了军团的帮助和支持。总的来说，魔联的叛军欠了她们一笔不小的债务，现在需要我们来偿还……"
  magicunion.1014_MGU_TB.a:0"那就赔偿吧。"
  magicunion.1014_MGU_TB.b:0"用军火抵债。"
  magicunion.1014_MGU_TB.c:0"魔联不会替叛军支付债务，更不会给军团的这帮杀人犯支付一分钱。"
  magicunion.1014_MGU_TB.d:0"虽然叛军被消灭了，但是我们或许也能长期合作。"

  magicunion.1015_MGU_TB.t:0"清扫战场III"
  magicunion.1015_MGU_TB.desc:0"由于我们的领袖晓美焰的英明领导，我们以雷霆之势横扫南方战区。很多敌军成建制的被俘获，她们有些是红军，有些是叛军，记得别把她们关在一起，否则会闹出人命的……我们之间曾经爆发过可怕的冲突，或许和平的生活，可以抚平她们的仇恨，与执念..."
  magicunion.1015_MGU_TB.a:0"将战俘编入我们的军队。"
  magicunion.1015_MGU_TB.b:0"学习叛军的工业技术。"
  magicunion.1015_MGU_TB.c:0"都送去当女仆。"

  magicunion.1016_MGU_TB.t:0"可耻的叛徒！"
  magicunion.1016_MGU_TB.desc:0"你来到中央议会，看到一些人正在的窃窃私语，一位干员前来递给你了一份绝密报告。报告中的内容令人震惊，如果情况属实，那么就说明在NKVD中有叛徒存在，而且不是个人行为，而是有组织有计划并且有多个部门的人员参与的叛国罪行！目前NKVD已经开始严格的追查。"
  magicunion.1016_MGU_TB.a:0"她们应该感到羞耻！"
  magicunion.1016_MGU_TB.b:0"把她们揪出来！炮决！"

  magicunion.1017_MGU_TB.t:0"魔联的最后通牒"
  magicunion.1017_MGU_TB.desc:0"如今我们最大的敌人已经被击败。魔联要求尽快的发动世界革命战争，把整个世界从资本家和各种邪恶之徒手中解放出来。如果我们拒绝，魔联将会脱离我们的共产国际。"
  magicunion.1017_MGU_TB.a:0"批准！准备世界革命战争！"
  magicunion.1017_MGU_TB.b:0"驳回！我们只想一国建成社会主义。"

  magicunion.1019.t:0"$news_event_background$魔法少女人权运动"
  magicunion.1019.desc:0"一直以来魔联的魔法少女生存在这些将自己伪装的人畜无害的吉祥物的欺骗与剥削下，它们隐瞒使用魔力的代价，强迫契约者花费业余时间为它们的目的服务，鼓动内部冲突，并且对进行危险工作中失去生命的魔法少女不闻不问。为了改变现状，最高领袖晓美焰和她的团队正在推进一系列改革以迫使这些吉祥物以更加公平合理的方式行使它们的调度职能，这涵盖了魔法少女的职业教育，工时限制和生命安全以及知情权等等方面。\n\n这些举措很有可能解放大量劳动力从而使这个庞大的联盟具备更加强大的工业，或者说，战争潜力。"
  magicunion.1019.a:0"无产阶级的胜利。"
  magicunion.1019.b:0"她们正在亲手毁灭自己的传统。"
  magicunion.1019.c:0"QB早该图图了。"

  magicunion.1020_MGU.t:0"改造大自然"
  magicunion.1020_MGU.desc:0"在过去的五年中，魔联不知通过什么手段将已经完全荒漠化的南部大草原全面绿化，甚至在那里成功种植了相当规模的橡胶作物，从科学角度来讲，如果考虑当地的气候条件，这是根本不可能发生奇迹。\n\n众所周知，橡胶是制作载具轮胎的重要原料，而其主要产地位于与魔联隔海相望的中非和东葛朗特。如果魔联实现橡胶供给自足，海权国的海上封锁对其战争机器的削弱能力将大大减弱，这对精灵，圣杯，舰娘和羽国来讲无疑是个噩耗。"
  magicunion.1020_MGU.a:0"神树的力量。"
  magicunion.1020_MGU.b:0"这不可能，这是什么邪恶的魔法？"
  magicunion.1020_MGU.c:0"祝贺她们。"

  news.1021.t:0"炮击永冻土"
news.1021.desc:0"近日魔联宣称在苏联北部的，北极圈荒芜雪原地区发现可开采的大油田，这意味着她们成功打穿了厚达数十米甚至上百米的永久冻土层。据各国驻当地记者报道，魔联征召了大量擅长寒地战斗的魔法少女并昼夜不停地对油田资源区进行大规模魔力炮击，强行将平原轰炸成了盆地，并炸开了一些巨大的冰山。由于恶劣的气候和过度体能消耗，大部分参与此次行动的士兵因为伤病无法继续作战。"
news.1021.a:0"让她们休息吧。"
news.1021.b:0"希望这种鲁莽的举动不会引发自然灾害。"
news.1021.c:0"人类征服大自然的一大胜利。"

news.1022.t:0"MAGIUS之翼挑衅魔联"
news.1022.desc:0"三天前前往访问MAGIUS之翼的魔联使节团至今仍未返回魔联，Magius方面宣称，由于共同的政治理念和未来构想，来自魔联的魔法少女们自愿加入Magius之翼。而魔联方面则强烈谴责对方扣押大使的行为。两国之间本就微妙的局势开始显著恶化。"
news.1022.a:0"看来她们打算先发制人。"
news.1022.b:0"我们要在对方做好准备之前打垮她们。"
news.1022.c:0"变幻莫测的时代。"

news.1023.t:0"神滨魔法少女加盟魔联"
news.1023.desc:0"神滨地区的内战以七海八千代率领的革命军的胜利而结束后不久，她们就宣布加入魔联麾下。这场内战的幕后主导者是显而易见，魔联的力量正在变得愈发强大。"
news.1023.a:0"欢迎加入魔联。"
news.1023.b:0"我们同舟共济。"
news.1023.c:0"变幻莫测的时代。"

news.1024.t:0"北欧防卫体系的成立"
news.1024.desc:0"神滨地区的内战以七海八千代率领的革命军的胜利而结束后不久，她们就宣布加入魔联麾下。令人吃惊的是，魔联给予神滨魔法联盟独立同盟国地位，甚至割让了西北方的大片领土来讨好她们。显然，魔联希望一个实力足够强大又值得信赖的盟友掌控北欧局势，从而让自己腾出手在远东和东欧进行更大规模的行动。\n\n瑞典和挪威对此表示强烈谴责，瑞典民主派意见领袖paradox声称这等于变相支持神滨的魔法少女侵略北欧，如果勤奋的魔法少女接管瑞典，那么蠢驴们就再也没有假期了！"
news.1024.a:0"欢迎加入魔联。"
news.1024.b:0"我们同舟共济。"
news.1024.c:0"变幻莫测的时代。"

news.1025.t:0"魔法少女性别平等运动"
news.1025.desc:0""
news.1025.a:0"团结一致！"
news.1025.b:0"我的眼睛啊！！！"

news.1026.t:0"地球防卫联盟成立"
news.1026.desc:0"为了应对来自戴比路克愈发显著的侵略威胁，[POL.GetName]于今日正式宣布与魔联组成地球防卫同盟，她们毫不掩饰军事对抗魔导国的目的。这一举措或许能震慑对手从而带来更长久的和平，也有可能引发这颗星球有史以来规模最庞大的全面战争。"
news.1026.a:0"到此为止了。"
news.1026.b:0"她们似乎想靠数量取胜。"
news.1026.c:0"变幻莫测的时代。"

news.1027.t:0"$news_event_background$伪世的恶魔"
news.1027.desc:0"随着战事的胶着，魔联的领袖晓美焰似乎正在变得愈发焦虑，近期她们采取的一系列战术举措比以往任何时候都要疯狂和激进。考虑到魔联所面临的险恶处境，这是可以理解的。在很多外交场合上，记者们发现晓美焰的外貌和性格在这段时间内有了些微妙的变化，不知道这意味着什么。"
news.1027.a:0"为了魔联！"
news.1027.b:0"无意义的挣扎罢了。"
news.1027.c:0"这就是恶魔吗？"

news.1028.t:0"$news_event_background$法则的降神"
news.1028.desc:0"魔联最近宣布了最高领导人的变更，前主席晓美焰宣布将国家领导权移交鹿目圆香，自己只负责指挥一支集团军群。这个消息在国际上引起轩然大波，根据常识，临阵换将乃兵家大忌，况且这个鹿目圆香此前从未在任何政治活动和外交场合上露面，她的来历完全是个谜。晓美焰力排众议实行了这个决策，不知道这位新的领导人将扶大厦之将倾，挽狂澜于既倒，还是有心杀贼，无力回天。"
news.1028.a:0"背水一战！"
news.1028.b:0"这怎么可能！"
news.1028.c:0"哇,她头发跟用了飘柔一样。"

magicunion.711.t:0"魔联的使节团"
magicunion.711.d:0"来自魔联的使节团前来拜访我们了，看来eve计划到底还是瞒不过她们的眼睛，恐怕她们早晚要向我们摊牌了。"
magicunion.711.a:0"先发制人，拿下她们！"
magicunion.711.b:0"不要轻举妄动，打发走她们。"

magicunion.712.t:0"劝诱"
magicunion.712.d:0"音梦和灯花将神滨特有的魔女和化身现象，以及eve计划的美好前景告诉了魔联的大使们，并且邀请她们抛弃原有的立场加入我们的伟大事业。\n\n————事实证明这个计划简直是自寻死路，如果没有音梦的洗脑能力的话......那个黑毛很懦弱，轻松就被吓住了，红毛像没长大脑一样以很好玩为理由加入了，粉毛一直在犹豫，要命的是那个黄毛一得知真相就跟发病了似的突然到处开火，要不是音梦及时控制住了她天知道她会打死多少人。"
magicunion.712.a:0"开弓没有回头箭。"

magicunion.713.t:0"大使返回"
magicunion.713.d:0"我们派出的外交团队返回了，对方应对的天衣无缝，我们没能获取决定性的情报。她们的态度也仍然很暧昧。大使团的成员之一环伊吕波因为听说了她过去失踪的妹妹的消息而决定暂时留下搜索，另外三人已经平安返回。"
magicunion.713.a:0"看来还不是行动的时候。"

magicunion.714.t:0"环伊吕波的消息"
magicunion.714.d:0"之前滞留magius之翼的环伊吕波发来了惊人的消息，这一个月以来她一边寻找自己的妹妹环优的下落一边打探神滨的相关情报，magius正在利用音梦的能力创造具象化的谣言来收集人的负面情绪，同时鼓励魔法少女释放doppel来产生污秽，这些东西将会被输送给一个名为eve的怪物，其能力为在极大范围内吸收魔法少女使用魔力产生的污秽，如果这个计划成功，魔法少女使用魔力的代价将变得可以忽略不计，但在收集污秽的过程中她们已经造成大量平民伤亡了。\n\n现在环正和当地非magius派系的领袖，七海八千代一起，准备响应我们的下一步动作。"
magicunion.714.a:0"坚持住！"

magicunion.715.t:0"共产主义革命"
magicunion.715.d:0"Magius站在了命运的岔路口，国内的共产主义者正在尝试推翻现有政府的统治，毫无疑问她们的背后有魔联的干涉，这场内战将决定神滨的未来。"
magicunion.715.a:0"粉碎赤色阴谋！"
magicunion.715.b:0"§R为时已晚，MAGIUS§!"

magicunion.716.t:0"来自魔联的提议"
magicunion.716.d:0"魔联意图干涉我们和戴比路克之间的战争，她们希望我们能以割让波兹南和但泽为条件与对方达成无条件和平，并加入她们主导的阵营从而威慑那群外星人。"
magicunion.716.a:0"没有办法的办法。"
magicunion.716.b:0"我们的土地，我们的血。"

magicunion.717.t:0"来自魔联的提议"
magicunion.717.d:0"魔联意图干涉我们和执念之国之间的战争，对方同意割让波兹南和但泽，但是要求我们停止攻势并签署停战协议,如果我们拒绝，她们很可能组建一个对抗我们的同盟并一起加入战斗。留给我们考虑的时间有三天。"
magicunion.717.a:0"白得的土地，好耶。"
magicunion.717.b:0"她们都将败倒在我们面前。"

magicunion.718.t:0"魔导国同意了"
magicunion.718.d:0"他们接受停战协议。看来他们不认为自己能战胜魔联。"
magicunion.718.a:0"暂时的和平。"

magicunion.719.t:0"魔导国拒绝了"
magicunion.719.d:0"他们拒绝接受停战协议，并且直接宣战了魔联，看来他们有自信同时击溃两个国家的军队。"

magicunion.719.a:0"狂妄之人。"

magicunion.720.t:0"散华"
magicunion.720.d:0"满开的代价就是失去部分身体机能，虽然不知道疼不疼但是结局和残废是没有区别的，大家都已经到极限了，再强行使用这种力量会有生命危险。"
magicunion.720.a:0"她们已经尽力了。"

magicunion.721.t:0"私密会面"
magicunion.721.d:0"晓美焰给人的印象一直是冰山美人，虽然对人并不严厉，却也让人感受不到亲切，她几乎从不向人表露感情，没人见过她愤怒，也没人见过她喜笑颜开。但就在昨天，一个突然出现在时间起始之地的粉发魔法少女要求面见领袖，由于她看起来很有礼貌，卫兵们便去通报。\n在见面的一瞬间，晓美焰的脸上露出了从未有过的震惊表情，随后她扑倒在对方的怀里像个孩子一样嚎啕大哭。卫兵们大吃一惊，不知所措，那个粉发少女温柔地抚摸着对方的头，毫不介意她情绪失控的举动。\n\n“我一直...一直...好想见你......”"
magicunion.721.a:0"抱歉，小焰，已经没事了，我回来了。"

magicunion.722.t:0"杏子返回"
magicunion.722.d:0"大使团队中的一员，佐仓杏子于今日随投降的前magius人员一同返回魔联，很多魔法少女对于她的临阵倒戈和擅离职守非常愤怒，对此晓美焰只是让她返回军队，没有做出任何处理。被扣押的大使团中伊吕波留在了神滨继续寻找她的妹妹，另外两人彻底失踪，只有杏子一个人成功返回，她的能力得到了锻炼。"
magicunion.722.a:0"返回队列，士兵。"



  magicunion.1031_MGU_TB.t:0"魔法少女拒绝了邀请"
  magicunion.1031_MGU_TB.d:0"今早得到了她们的回电，魔法少女们声称她们拒绝加入我们的阵营。"
  magicunion.1031_MGU_TB.a:0"如果这样的话……"

  magicunion.1032_MGU_TB.t:0"投降谈判（1/4）：移交魔法工业奇观"
  magicunion.1032_MGU_TB.desc:0"戴比路克银河帝国对魔联的工业奇观很感兴趣，帝国想要接管这个强大的魔法造物，如果魔联想要投降，那么就必须得交出这个。"
  magicunion.1032_MGU_TB.a:0"我们别无选择……"
  magicunion.1032_MGU_TB.b:0"这是我们的骄傲！我们不会让给任何人！"
  magicunion.1032_MGU_TB.c:0"她们最好同意。"

  magicunion.1033_MGU_TB.t:0"投降谈判（2/4）：意识形态的改变"
  magicunion.1033_MGU_TB.desc:0"谈判要求魔法少女们放弃自己原本的理想与理念。魔法少女们可以继续保留在魔联的官职与公务，但是要接受戴比路克银河帝国帝国的监护与再教育。"
  magicunion.1033_MGU_TB.a:0"我们别无选择……"
  magicunion.1033_MGU_TB.b:0"绝不投降！为晓美焰尽忠至最后一刻！"
  magicunion.1033_MGU_TB.c:0"她们最好同意。"

  magicunion.1034_MGU_TB.t:0"投降谈判（3/4）：魔法少女们的命运"
  magicunion.1034_MGU_TB.desc:0"戴比路克银河帝国对魔联数量庞大的魔法少女很感兴趣。在银河系很多地方，魔法少女都是大受欢迎的女仆，但是数量相当稀少供不应求，甚至走私猖獗。魔导国保证，这是帝国控制的合法的女仆派遣机构。被出租的女仆们也都会受到帝国法律的监护。相比起让她们在一场不可能获胜的战争中香消玉殒，在炮火中化为灰烬。让她们去星际文明当女仆这个选择要好多了不是吗？"
  magicunion.1034_MGU_TB.a:0"我们别无选择……"
  magicunion.1034_MGU_TB.b:0"我们不会出卖我们的人民！"
  magicunion.1034_MGU_TB.c:0"她们最好同意。"

  magicunion.1035_MGU_TB.t:0"投降谈判（4/4）：对晓美焰的惩罚"
  magicunion.1035_MGU_TB.desc:0"魔导国还提出了要求。晓美焰作为战争领袖，发起这场反抗帝国的战争的罪魁祸首，帝国要求晓美焰作为人质，被软禁在帝国行宫里当结城梨斗的女仆。以及接受帝国的再教育。"
  magicunion.1035_MGU_TB.a:0"§R我们别无选择，只能期望会被温柔的对待……§!"
  magicunion.1035_MGU_TB.b:0"这不可能！才不会给结城梨斗那个亚撒西的铁废物当女仆！"
  magicunion.1035_MGU_TB.c:0"她们最好同意。"

  magicunion.1036_MGU_TB.t:0"谈判崩裂"
  magicunion.1036_MGU_TB.desc:0"魔法少女联盟与戴比路克银河帝国的投降谈判，没有取得任何成果，她们得继续在战场上分胜负了。"
  magicunion.1036_MGU_TB.a:0"继续进攻！"
  magicunion.1036_MGU_TB.b:0"无法接受！"

  magicunion.1037_MGU_TB.t:0"魔法少女联盟想要有条件投降"
  magicunion.1037_MGU_TB.desc:0"经过讨论，我们决定给魔法少女联盟提出如下要求：\n1：移交魔法工业奇观。\n2：放弃康米主义的理想与理念，接受帝国再教育。\n3：为我们提供很多魔法少女，派遣到戴比路克银河帝国控制的外星去当女仆。\n4：要求晓美焰本人给结城梨斗做女仆，并接受惩罚，和不会破坏美感的少量人体改造以及再教育。"
  magicunion.1037_MGU_TB.a:0"就按这样，发出要求。"
  magicunion.1037_MGU_TB.b:0"§R不接受谈判！让我们战场上见！§!"

  magicunion.1038_MGU_TB.t:0"戴比路克拒绝谈判"
  magicunion.1038_MGU_TB.desc:0"戴比路克银河帝国拒绝进行谈判，看来除了战场上见分晓，没有任何办法了。"
  magicunion.1038_MGU_TB.a:0"放弃幻想，继续战斗！"

  magicunion.1039_MGU_TB.t:0"魔法少女向戴比路克屈服"
  magicunion.1039_MGU_TB.desc:0"魔法少女联盟已经向全世界发出电报，于今日正式向戴比路克银河帝国投降，相应的交接程序正在按部就班的进行。而晓美焰本人也已经进入戴比路克银河帝国的行宫，作为结城梨斗的女仆。但是晓美焰仍然是魔法少女联盟实际上的领导者。"
  magicunion.1039_MGU_TB.a:0"令人满意。"
  magicunion.1039_MGU_TB.b:0"这就是我们的结局了么。"
  magicunion.1039_MGU_TB.c:0"变化莫测的时代。"
  magicunion.1039_MGU_TB.d:0"末日来临了。"

  magicunion.1040_MGU_TB.t:0"中央议会察觉到了"
  magicunion.1040_MGU_TB.desc:0"特工部对俄罗斯内战的干涉被中央议会察觉到了，可能是在当地有效忠魔联中央议会的线人，又或者是我们特工部内部出了叛徒，总之，全国领袖晓美焰已经开始调查这件事，我们所有特工必须立刻从相关地区撤离。"
  magicunion.1040_MGU_TB.a:0"没办法，只能撤离了。"
  magicunion.1040_MGU_TB.b:0"我们目前还不能违背中央议会。"
  magicunion.1040_MGU_TB.c:0"§R不！反了她！QB和麻美学姐的意志必须被贯彻！§!"
  magicunion.1040_MGU_TB.d:0"小不忍则乱大谋，此事还需从长计议。"

  magicunion.1041_MGU_TB.t:0"背叛者的下场"
  magicunion.1041_MGU_TB.desc:0"（敲门声）\n（敲门声）咚咚咚（敲门声）\n（敲门声）咚咚咚（敲门声）\n（敲门声）咚咚咚（敲门声）\n（敲门声）咚咚咚（敲门声）\n咔嚓，乒——（手枪开火的声音）\n一位特工倒在了自己的血泊之中，死者是魔联特工部乌克兰地区的分管负责人，被宣称是这次叛国行为的主谋。特工部的领导者麻美学姐对此深表遗憾，没想到自己的特工部里居然出现了这种堕落的叛徒，竟然胆敢违抗我们英明的全国领袖——晓美焰盟主，的领导。真的是死有余辜。"
  magicunion.1041_MGU_TB.a:0"§G这就是胆敢背叛“我们英明的全国领袖晓美焰盟主”的下场。§!"
  magicunion.1041_MGU_TB.b:0"§R安心的去吧，你的牺牲会被我们在暗中铭记。§!"

  magicunion.1042_MGU_TB.t:0"内战结束，但危机才刚刚开始"
  magicunion.1042_MGU_TB.desc:0"虽然内战已经基本结束，但是魔联仍处在一个紧要的关口，充斥着各种内忧外患。\n\n本地的资本力量在密谋推翻我们，魔兽骚乱也越发严重，QB们似乎也不只是在传销，可能还在暗中密谋着什么。\n\n南方的共产主义与军国主义运动也愈演愈烈，而北方的妖精与殖民帝国正准备终结她们数百年来的仇恨。但是我们“忠！诚！”的特工部，可以帮助我们度过这些难关。\n\n现在\n\n这个国家的船舵掌握在你的手中，它将会航向何方。"
  magicunion.1042_MGU_TB.a:0"§G启航！§!"

  magicunion.1043_MGU_TB.t:0"暗云涌动"
  magicunion.1043_MGU_TB.desc:0"晓美焰在房间角落里捡起了一只QB的尸体，即便已经死去，它仍然用嘴巴叼着一封信。这封信的内容被涂黑了，似乎什么都看不到了，仅剩少量可以辨认的词语，无法组成连贯有意义的语句。这封信到底是谁寄来的，又是因何而被涂抹的？QB为什么要带着这封信来到这里，这只QB又是怎么死掉的？"
  magicunion.1043_MGU_TB.a:0"§G将扮演晓美焰的中央议会进行游戏§!"
  magicunion.1043_MGU_TB.b:0"§R将扮演邪恶的QB进行游戏§!\n（这条线似乎鸽了！）"
  magicunion.1043_MGU_TB.c:0"§Y其实以上按钮没有区别，这个国策树的作者是个喜欢挖坑不填的懒惰的堕落者§!"
  magicunion.1043_MGU_TB.d:0"§Y对待这种挖坑不填，不想更新的懈怠份子，抓到之后要狠狠地狂暴鸿儒！§!"

  magicunion.1044_MGU_TB.t:0"处置商会"
  magicunion.1044_MGU_TB.desc:0"我们抓到了大部分商会成员，我们该如何处置她们，她们其中大多数人都只是误入歧途魔法少女。只有少数的人类是资本主义派来的业务员。\n\n但是她们的会长，提出想和我们合作，并愿意提供很大的利润。"
  magicunion.1044_MGU_TB.a:0"稍微教训一下就放过吧"
  magicunion.1044_MGU_TB.b:0"放过魔法少女，将业务员们驱逐出境"
  magicunion.1044_MGU_TB.C:0"所有资本主义的走狗都不会得到饶恕，全体驱逐。"
  magicunion.1044_MGU_TB.D:0"§R接受她们的条件，似乎也不是不可以§!"

  magicunion.1045_MGU_TB.t:0"魔女复仇之夜"#抓获了一个魔女
  magicunion.1045_MGU_TB.desc:0"随着狩猎魔物的行动已经接近尾声。我们摧毁了很多魔物的据点，在这个过程中，我们的特遣队多次遇到一个身穿蓝衣的黑发魔女。她经常在一些村庄和废弃设施中对魔物进行血腥的追猎与屠杀。并在与我们的队员相遇时，对我们进行无差别的攻击，曾经造成了多名队员的牺牲。\n\n如果报告属实的话，我们的队员曾经多次确认击杀了她，而且即便将其关押，在几天之后，她也会突然凭空消失，然后出现在别的地方继续她血腥的屠杀。\n\n麻美学姐的特工部提议将其招揽，让她将能力用于我们的事业，而具体的交涉可以交由特工部全权处理，中央会议无需操心。\n\n但是我们的特遣队中也有一些队员遭到了杀害，如果赦免她的话，可能有些人会因此不满"
  magicunion.1045_MGU_TB.a:0"国家正是用人之际，就交给麻美学姐处理吧"
  magicunion.1045_MGU_TB.b:0"她是个嗜血的疯子，必须依法严惩"

  magicunion.1046_MGU_TB.t:0"搜查行动请求指示"
  magicunion.1046_MGU_TB.desc:0"我们的搜查行动在某种程度上来说，可以算得上很成功，大量失踪人员都得到了救助回到了她们原本的家庭，对于受到了伤害的人，政府将会为其提供适当的肉体与精神的治疗。\n\n还有一些人并没能回家，但是原因并非是已经死亡，而是她们被转移到了外国，如果要前去救助，不仅需要花费很大的人力物力，如果行动出了差池很可能演变成恶劣的国际外交事件。\n\n但是巴麻美学姐声称，只要给她的特工部更多额外的力量，她就可以很好地解决这些事情，带那些少女回家。但是这无疑会增加特工部的势力。"
  magicunion.1046_MGU_TB.a:0"就交给麻美学姐的特工部处理吧。"
  magicunion.1046_MGU_TB.b:0"中央议会的军队就能解决。"

  magicunion.1047_MGU_TB.t:0"严重的外交事件！！"
  magicunion.1047_MGU_TB.desc:0"事情是这样子的，当时一支前往外国救人的特遣队，行动时闹的动静有点大，虽然过程大同小异，但是她们似乎炸了别国不少东西，甚至还炸了人家的行政大楼。不过还好，在特遣队员们的努力以及治愈魔法的影响下，似乎没有造成死亡事件，队员们都回来了，失踪人员也都救回来了。但是那些国家似乎不打算善罢甘休，如果放任不管，我们可能会被当成恐怖分子。"
  magicunion.1047_MGU_TB.a:0"真是头疼，叫外交部的人来。"
  magicunion.1047_MGU_TB.b:0"§R我们只是替她们的警察，做了她们本该做的事情§!"

  magicunion.1048_MGU_TB.t:0"完美的救援行动"
  magicunion.1048_MGU_TB.desc:0"我们的特遣队很顺利的救回了所有失踪的人，而且也没整出什么大的问题。整个过程虽然谈不上神不知鬼不觉，但是那些国家还不至于因此就来找我们的麻烦。"
  magicunion.1048_MGU_TB.a:0"做得好！"

  magicunion.1049_MGU_TB.t:0"和平的机会？"
  magicunion.1049_MGU_TB.desc:0"魔联的共产主义者们发来了消息，只要我们愿意与圣杯王国划清界限，就可以离开这场旷日持久的战争。我们大家都已经为此付出了太多的鲜血与泪水，就让仇恨就此终结，让和平重归世间。"
  magicunion.1049_MGU_TB.a:0"我们接受！庆祝和平的时候到了。"
  magicunion.1049_MGU_TB.b:0"我们不和共匪谈判！"

  magicunion.1050_MGU_TB.t:0"美帝拒绝了！"
  magicunion.1050_MGU_TB.desc:0"看样子美帝不懂得和平的可贵，或者说，已经被仇恨与鲜血遮蒙了双眼，但是无论如何，我们必须将其停下。"
  magicunion.1050_MGU_TB.a:0"坚守岗位！继续战斗！"

  magicunion.1051_MGU_TB.t:0"北美的共党武装起义"
  magicunion.1051_MGU_TB.desc:0"北美北部五大湖地区爆发了大规模的起义，甚至原本应该负责镇压的警察也参与其中，当地驻军指挥部受到了严重的突袭已经失去了联络。随后美国共党宣布在芝加哥武装起义，在极短的时间里，她们已经掌控了五大湖地区的多个城市，至于这场战斗的结局如何，让我们拭目以待。"
  magicunion.1051_MGU_TB.a:0"即便是大洋彼岸，我们的盟友比比皆是。"
  magicunion.1051_MGU_TB.b:0"美国的转折点？亦或只是一场小动乱？"
  magicunion.1051_MGU_TB.c:0"这是勇敢的阶级斗争！"
  magicunion.1051_MGU_TB.d:0"这简直是疯了！逐一发送轰炸机！"

  magicunion.1052_MGU_TB.t:0"魔联部队登陆加拿大！"
  magicunion.1052_MGU_TB.desc:0"根据加拿大东海岸发来的消息，魔联的部队突然出现在了加拿大东海岸，并对当地驻军进行了迅捷的攻势，到目前为止，已经有大片地区落入魔联的掌控之中。"
  magicunion.1052_MGU_TB.a:0"如同计划中的一样！"
  magicunion.1052_MGU_TB.b:0"什么！这不可能！我们的海军在哪里？全世界都想知道！"

  magicunion.1053_MGU_TB.t:0"这是一个测试1053A！"
  magicunion.1053_MGU_TB.desc:0"这是一个测试。"
  magicunion.1053_MGU_TB.a:0"这是一个测试。"
  magicunion.1053_MGU_TB.b:0"这是一个测试。"

  magicunion.1053_MGU.t:0"这是一个测试1053B！"
  magicunion.1053_MGU.desc:0"这是一个测试。"
  magicunion.1053_MGU.a:0"这是一个测试。"
  magicunion.1053_MGU.b:0"这是一个测试。"

  magicunion.1054_MGU.t:0"少女们已经回国"
  magicunion.1054_MGU.desc:0"玛吉斯之翼解散后，其成员大多都已经归顺了魔联，而南方集团军群的魔法少女们，也已经回到了魔联的控制区，目前正在首都附近等候命令。\n\n如今联盟中的分裂势力均已受到有效控制，虽然在南方还有少量叛军残党在游荡，西北边境丛林区的社会秩序混乱不堪，但是在大多数人眼中，魔法少女联盟已经再次成为了完整而团结的国家。\n\n现在所有人都在等待着您下达新的命令。"
  magicunion.1054_MGU.a:0"嗯，知道了。"

  magicunion.1055_MGU.t:0"关于魔联男性权利问题"
  magicunion.1055_MGU.desc:0"有些人提出，提倡性别平等是我们进一步强化军队纪律和促进社会稳定的关键举措。男性将领与官员同样具备一切战士所需的美德。"
  magicunion.1055_MGU.a:0""
  magicunion.1055_MGU.b:0"huh？"
  magicunion.1055_MGU.c:0"显然少女们才应该拥有更高的权利。"

  magicunion.1056_MGU.t:0"友爱部里没有冤魂"
  magicunion.1056_MGU.desc:0"在友爱部大厦的高空电梯里，yumi擦拭着自己心爱的手镜，在真夜的月光下看着自己越发憔悴的面容，揉着惺忪的睡眼开始了又一天的加班，对于友爱部的高层领导人来说，她几乎是没有休息时间的，每一个重大案件都需要她来审阅，每一个重刑犯的文件都需要她来复审，即使是魔法少女的体质也感到十分的疲惫，yumi不止一次的后悔自己爬上了友爱部的高位，自己努力这么些年，就是为了得到这个要人命的官职，然后把自己累死的吗？她甚至有些羡慕商场里的那些人体模型，不需要工作，就可以穿帅气又可爱的新衣服。\n\n电梯在60层停下，yumi走出电梯，推开自己的办公室大门，一个白衣少女被几名魔法少女治安官羁押在房间里。她就是织莉子，白羽女学院的学生，母亲是魔联议会的议员。yumi调查过她的档案，详详细细的，也去调查了她的同学，她的学校，她的家庭，甚至她上学路上和能查到的一切。但是，没有任何犯罪记录，也没做过任何坏事，yumi不明白，像织莉子这样的守法公民，为什么要遭到这样的不公正的对待，友爱部应当是保护一切善良之人的，惩戒任何不法之徒的，友爱部里没有冤魂！但如今，一个无辜者，正诉说着她所遭受的不公，并祈求着公正的判决。"
  magicunion.1056_MGU.a:0"§R友爱部里没有冤魂！亦不会有人受到不公正的对待！§!"
  magicunion.1056_MGU.b:0"§R我很抱歉...对不起...但这来自于最高命令...§!（监禁）"

  magicunion.1057_MGU.t:0"友爱部里仍然没有冤魂"
  magicunion.1057_MGU.desc:0"又是一天夜晚，真夜的月光照耀着21层的天台，或者说是20层的楼顶上。伟大又圣洁的晓美焰盟主，亲自召见了友爱部的yumi部长。就只有她们两人，这对于yumi部长来说，或许是一个独特的殊荣，而yumi部长正神情激昂的在天台的边缘，讲解着什么。一直以来她管理的很好，一切都是那么的井然有条，有序不乱，友爱部里没有冤魂。\n\n再之后友爱部仍然高效又忠诚，仍然是那么的繁忙。\n\n有很多治安官到医院看望，yumi从友爱部大楼上摔了下来，在友爱部外坠落昏迷。而人们不会知道，那天晚上，织莉子出现在天台上，已经在QB的怂恿下成为了强大的魔法少女的她，决定顺应自己的预言刺杀魔联的盟主，而yumi部长挺身而出为盟主挡下了织莉子射出的神谕光束，从天台上跌落。而晓美焰盟主和护卫们隐瞒了那一夜的真相。\n根据事后调查，由于yumi是个魔法少女，并且她坠落时仍然携带着幻想灵装，所以即便是失足坠落，在坠落时，她也有至少三种方式让自己安全着陆。所以，最后判定为自杀未遂。而有些对晓美焰盟主信任不够坚定的人甚至在怀疑，或许是晓美焰盟主做的...\n\n虽然yumi并没有死亡，但是医生判断昏迷可能持续十年左右，所以按照yumi的遗嘱，yumi的身体在经过化妆后，被放置在服装商场作为人体模型使用。医院将继续为其提供医疗维护，使其肉体可以尽量维持在沉睡前的模样，直至其苏醒的那一天。"
  magicunion.1057_MGU.a:0"§G这将是个漫长的梦境...§!"

  magicunion.1058_MGU.t:0"$news_event_background$灾难性的魔法风暴"
  magicunion.1058_MGU.desc:0"在南美东部，一场毁灭性的魔力风暴笼罩着整个魔法少女联盟地区，在此地区的所有军事行动都遭到了极端恶劣天气的严重影响。一些魔法师们预计这场风暴会持续5个月。"
  magicunion.1058_MGU.a:0"她们的牺牲会被铭记..."
  magicunion.1058_MGU.b:0"令人震惊"
  magicunion.1058_MGU.c:0"变化莫测的气候"

  magicunion.1059_MGU.t:0"$news_event_background$南美的魔法风暴已经消散"
  magicunion.1059_MGU.desc:0"在南美东部的地区，在被魔法风暴肆虐了6个月之后，风暴已经开始减弱，目前的风暴等级已经不再能妨碍当地的军事行动。"
  magicunion.1059_MGU.a:0"迎接宿命的裁决"
  magicunion.1059_MGU.b:0"准备全线进攻"
  magicunion.1059_MGU.c:0"变化莫测的气候"

  magicunion.1060_MGU.t:0"关于凡人的权益"
  magicunion.1060_MGU.desc:0"有些人提出，我国境内的凡人应当有与魔法少女同等的权利，而一部分魔法少女则认为，魔法少女才应当拥有更高的权利，与社会地位。"
  magicunion.1060_MGU.a:0"魔法少女拥有更高的权利与地位"
  magicunion.1060_MGU.b:0"魔法少女并不该高于凡人太多"

  magicunion.1061_MGU.t:0"与游击队的谈判"
  magicunion.1061_MGU.desc:0"经过我们外交人员持续数天的努力，我们拟定了一些和谈的条件，其中对我们影响最大的是游击队提出的：需要保障工人的权利与八小时工作制，相对舒适的工作环境，可以轻松养活一家人的劳动报酬，以及每个人都应当享有的尊严。\n如果我们同意这个要求，无疑会降低我国的生产力，并对将来关于工人工作的剩余价值产出的调配起到限制作用。"
  magicunion.1061_MGU.a:0"接受她们的条件"
  magicunion.1061_MGU.b:0"§R她们只能无条件投降§!"

  magicunion.1062_MGU.t:0"与叛军的谈判"
  magicunion.1062_MGU.desc:0"我们的交涉专家被装在箱子里送了回来，虽然还活着，但是恐怕得麻烦心理医生治疗一段时间了。"
  magicunion.1062_MGU.a:0"无话可说"

  magicunion.1063_MGU.t:0"叛军来袭"
  magicunion.1063_MGU.desc:0"叛军对我们发动了攻击！"
  magicunion.1063_MGU.a:0"集结部队！"



  magicunion.1064.t:0"政变阴霾"
  magicunion.1064.desc:0"我们的情报机关收到消息，有很多反抗者似乎准备推翻晓美焰的统治，而这其中还有高级官员的参与。\n甚至她们打算暗中掌控政府部门，来逐步剥夺晓美焰盟主的权利。并且她们还在继续大量招募新成员。我们不知道现在政府中有多少反对派，也不知道军队中的将领们是否还值得信任。\n这些反对派似乎无孔不入，就连情报机关中也不仅有，而且可能还很多。反对派的数量已经到达了必须处理的数量了。如果我们放任不管，我们将会失去对政府的掌控。"
  magicunion.1064.a:0"她们一定要这样大声密谋吗？"

  magicunion.1065_MGU.t:0"魔联之春"
  magicunion.1065_MGU.desc:0"在长时间的准备后，反抗军认为时机已经成熟，于是向晓美焰发出了最后通牒，要求其下台。而如今整个国家的大部分政府职能，已经切实的倒向了反抗军阵营，而晓美焰却神秘失踪，护民官鹿目圆宣布撤销晓美焰的盟主职位。\n在此之后，这个国家的未来将会怎样呢？但是不管怎样，至少现在，这个国家拥有了新的机会。\n\n（魔联将在一个月后进行盟主大选）"
  magicunion.1065_MGU.a:0"要重新选举盟主了"
  magicunion.1065_MGU.b:0"有人知道晓美焰去哪了吗？"
  
  magicunion.10651_MGU.t:0"少女的密室"
  magicunion.10651_MGU.desc:0"魔联的全国领袖晓美焰从昏迷中醒了过来，试图睁开眼睛\n但是似乎被一层柔软的丝质布料蒙上了\n眼前一片漆黑，身体也动不了，似乎被绑住了，嘴巴也被堵上了，似乎是某种柔软的布料，这熟悉的口感和味道，确实是小圆昨天穿的那双丝袜。\n只记得，昨天晚上，是在小圆的房间里喝红茶，然后，就什么都不记得了。口好渴，身体也不舒服。\n“小焰，你醒了”附近传来了小圆的声音\n小焰口中的布料被拿掉了，把一个吸管放进了小焰的嘴巴里\n小圆：“这是从圣杯租界买来的进口果汁哦，好喝吗，这一盒我已经品尝过了哦。虽然这种事很奇怪，但是小焰的话会喜欢吧。”\n小焰喝掉了果汁，然后趁机说道：“小圆，放我走，这个国家需要我！你不能……唔…”\n那柔软的布料又被塞进了小焰的嘴里，\n小圆：“小焰，现在这个国家已经不需要你了哦，但是我的寝室需要你。你以后，就这样子生活在我的寝室里吧，我会照顾好你的，小焰。”\n\n然而这一切都被窗外的猫猫使魔看到了\n"
  magicunion.10651_MGU.a:0"那小圆，把我们英明的全国领袖晓美焰绑在卧室里，定是要逼迫她当——(喵—！！被打了)"
  magicunion.10651_MGU.b:0"她喵的猫猫！想象力这么好做什么！"

  magicunion.10652_MGU.t:0"长久的磨合"
  magicunion.10652_MGU.desc:0"距离晓美焰倒台，已经过去一年了，最近有些人大概猜到了晓美焰在哪里，毕竟有些时候即便是护民官的房子，墙壁的隔音能力也是有限的。\n而那些仍然忠于晓美焰的秘密特工，也不敢违背小圆的意志进入房子里搜查。毕竟对于她们来说，哪怕晓美焰已经倒台了失踪了，但是晓美焰的命令仍然有效。\n而其他人，逐渐适应了新的生活，在失去了晓美焰的控制之后，那些猫猫人偶们，逐渐成为了人们生活中的小助手。\n而小圆仍然在担任她的护民官，每天早上出门都是一副很满足与开心的样子。"
  magicunion.10652_MGU.a:0"这个国家的人们得向着新的生活前进了。"
  magicunion.10652_MGU.b:0"那么晓美焰到底在哪里呢，真难猜啊。"

  magicunion.1066_MGU.t:0"向晓美焰致敬"
  magicunion.1066_MGU.desc:0"  在长时间的准备后，美树沙耶加认为政变的时机已经到来，于是在她的带领下士兵们闯入了晓美焰盟主的办公室。闯入的过程异常的顺利，行政首府的所有卫兵都支持她的政变，看来晓美焰的暴政，早就已经让人们深恶痛绝，早知道政变这么简单，就该提前几个月了。\n  在一脚踢开盟主办公室的大门后，沙耶加说到：“晓美焰！你的暴政结束了！”\n  两位全副武装的灵装卫兵迎上来，挡在沙耶加面前。\n  而晓美焰仍然端坐在她那舒适的椅子上，一只手托着脸颊平静的看着沙耶加，“现在退出去，我可以当你没来过。”\n  沙耶加：“晓美焰，你该不会是在开玩笑吧，你确实了解现在的情况吗，这是政变！你的盟主职位被罢免了！晓美焰！收手吧！外面全是我们的人！”\n 晓美焰：“政变？就凭你这个笨蛋嘛。”\n  沙耶加：“晓美焰！你这几年的暴政已经让人民苦不堪言！人民群众和有良知的将领们都支持我！你强迫人民进行大量的工作！还把大量的社会资源用于军工生产！你的国家生产报告根本就是骗鬼的瞎扯！你把大量的物资都私吞掉了！还用血腥残暴的手段屠杀偷渡者，花钱从外国购买少女奴隶！还偷窃了小圆的内裤和袜子！今天！你必将为此付出代价！”\n  沙耶加大手一挥：“同志们！把晓美焰拿下！”然而，没有任何人行动。\n  沙耶加：“……把晓美焰拿下！…………我的意思是把她抓起来……”\n  晓美焰：“把这笨蛋拖走，直接带去后室吧”\n  还没搞清状况的美树沙耶加，瞬间就被她的‘队友们’当场制服，拖走了。\n  ………………\n  当天下午，在反抗军的秘密总部\n  美树沙耶加带着很多全副武装的士兵走了进来，跟随在她身后的士兵鱼贯而入，越来越多。\n  库珂芙：“沙耶加将军回来了！还带回了大量的新同志！”\n  莉泽诺芙：“晓美焰终于被推翻了，但只要忠于她的那些人还在各地，这场战斗就没有结束。”\n  库珂芙：“老姐啊，晓美焰这一倒台，她的拥仆很快就会被我们击败了。哪怕就这么一次，好歹高兴点吧。看吧，同志们正在为沙耶加将军欢呼呢。”\n  反抗军们：“自由万岁！人民万岁！魔法少女联盟万岁！美术沙耶加将军万岁！”\n  美树沙耶加走上了演讲台，而那些跟随沙耶加一同进入的士兵们默默抬起了震撼弹发射器。\n  面对着那些兴奋欢快的反抗军成员们，沙耶加说到："
  magicunion.1066_MGU.a:0"同志们，致敬吧！§R向伟大的... 晓美焰... 致敬吧！§!"

  magicunion.1067_MGU.t:0""
  magicunion.1067_MGU.desc:0""
  magicunion.1067_MGU.a:0""
  
  magicunion.10670_MGU.t:0"魔女之夜即将降临"
  magicunion.10670_MGU.desc:0"多名预言系魔法少女已经证实，魔女之夜即将降临且几乎无可避免，我们的最高统帅部拿出了两个方案，其一：使用强大的工业能力与应急措施来度过魔女之夜。其二：让我们的部队用武力来制止魔女之夜的袭击。"
  magicunion.10670_MGU.a:0"我们的工业能力足以应对！"
  magicunion.10670_MGU.b:0"我们的军队早已准备好了！§L（推荐）§!"

  magicunion.1068.t:0"$news_event_background$魔女之夜降临"
  magicunion.1068.desc:0"在南美洲的神滨高原地区发生了17级台风，目前当地政府已经发布了避难警告，但是传闻说，有穿过台风的强袭魔女目击到，在台风之中有一个巨大的身影，发出骇人的笑声，正夹杂着风暴试图毁灭她所能触及的一切。"
  magicunion.1068.a:0"这么可怕的吗？"
  
  magicunion.1069.t:0"$news_event_background$妖精天灾！"
  magicunion.1069.desc:0"在亚马逊雨林里的妖精们，突然开始发狂的攻击人类，有人说，这是妖精天灾要降临的预兆！"
  magicunion.1069.a:0"别开玩笑了，这又不是群星。"
  magicunion.1069.b:0"§R妖精？她有几个师？§!（不要点）"


  magicunion.1071.t:0 "友爱部：整顿治安1"
  magicunion.1071.desc:0 "麻宫绫衣小姐，鉴于你以往的表现，在综合考核中取得了第二名的优秀成绩，魔法少女联盟友爱部，正式向你发出邀请，邀请你成为一名治安官，前提是你愿意冒着生命危险守护魔联的人民，保护她们不受到罪犯的侵害，在必要时愿意牺牲自己来拯救人民群众的生命。吃下这颗药丸可以让你得到守护人民的力量，但是我们有必要提醒你，这药剂有可能会导致你发生包括立刻死亡在内的不良反应。\n麻宫绫衣：‘我想请问一下，考核第一的人也加入了吗？’。而得到的回应是：‘那人服下药丸后死去了’.\n但是即便如此，麻宫绫衣仍然义无反顾的服下了那粒药丸，但是什么都没有发生。这药丸无论是从口感上，还是从成分上，都只不过是一颗普通的巧克力而已。既没有死亡，也没有力量。麻宫绫衣紧张的询问‘我没有感觉到，发生任何变化，那你说的力量呢？’"
  magicunion.1071.a:0"麻宫绫衣小姐，现在友爱部全体成员都是你的力量。"

  magicunion.1072.t:0 "友爱部：整顿治安2"
  magicunion.1072.desc:0 "‘忠诚的夏仓理奈小姐，你的举报信已经被处理，感谢你为我们英明的全国领袖晓美焰所做出的服务。信封中的银币和魔石碎片是你忠诚的回报’\n夏仓理奈放下了信件，深呼吸了一口气，这是她第一次写举报信，到现在为止心脏还是有点呯呯直跳，就在今早不久之前，治安官前来把她的邻居带走了。治安官们一切都是公事公办，房间中与叛军勾结的证据确凿无疑。但唯一的问题就是，她那半敞的房门突然被推开，邻居的丈夫气汹汹的冲了进来：‘我知道是你干的！之前你威胁过我们，要我们去自首！没想到你竟然真的举报了，你这个独裁政府的走狗！我要杀了你！’\n然而就在这时，窗户玻璃突然破碎，男人随即昏迷倒下，魔法弹喷洒了一地赤红的液体，在她人看来，就像是倒在了自己的血泊之中。\n电话响了，误以为有人死在自己面前的夏仓理奈，颤颤巍巍的拿起了电话，害怕的什么都说不出来\n电话中传来了平静的声音：‘夏仓理奈小姐，再次感谢你为我们英明的全国领袖晓美焰的付出，很快会有人去处理‘尸体’，但是你需要自费维修窗户。还有，下一次要直接举报，对叛徒的劝告是无用且危险的，你将为此受到3个月的罚款。’§L但是好在信封中的奖励远高于这些罚款。§!"
  magicunion.1072.a:0"好的..."

  magicunion.1073.t:0 "友爱部：整顿治安3"
  magicunion.1073.desc:0 "石织彩沙，在将自己洗完的衣服晾到阳台上，然后坐到卧室里开始监听她的邻居们。石织彩沙只觉得最近的生活真的很累，但是好在和同居的室友度过了一段很美好的值得回忆的生活，已经来这里监听了很久了却一无所获，而且虽然总觉得似乎遗忘或者忽视了什么重要的事情，总觉得线索就在身边，但是却始终找不到。或许是生活太忙了实在想不起来了。\n而她还并不知道和自己合租室友其实是她的任务目标，最近的几起犯罪案件都是其所做的。治安局预计在今天就要进行抓捕行动，但是石织彩沙的失误极大地增加了逮捕行动的难度和风险，所以治安官们得想个办法让她暂时离开房间。\n她听到她大街上有个路过的人，说了一句‘这样的政府真差劲’，但是石织彩沙并没有理会，毕竟，那人也没说哪个国家的政府，说不定她说的是圣杯王国的政府呢。\n五分钟后，治安官就破门而入，将石织彩沙压上了囚车，理由是她没有履行举报的职责。\n石织彩沙辩解：‘那人只是说了，这种政府真差劲，可没说是哪个国家的！’\n而治安官在片刻之后决定隐瞒真相：‘不是这件事，我们之所以逮捕你，是因为你到目前为止，整整24个小时内都没有对我们英明的全国领袖晓美焰的画像行礼。’"
  magicunion.1073.a:0"我怎么会...！"

  magicunion.1074.t:0 "友爱部：整顿治安4"
  magicunion.1074.desc:0 "星见木衣虽然是在魔联长大的少女，但是她很喜欢外国文化，与一些外国的少女们成为了朋友。在魔联的圣杯租界的咖啡店里，她和外国友人一同在咖啡店享用甜品\n圣杯王国的少女说到：‘在我们圣杯王国，只要人们抗议，就可以提高福利’。\n来自丛林的虫娘说到：‘福利是什么？’\n来自魔联的星见木衣说到："
  magicunion.1074.a:0"抗议是什么？"
  magicunion.1074.b:0"我懂了！这就去抗议！"

  magicunion.1075.t:0 "友爱部：整顿治安5"
  magicunion.1075.desc:0 "内田真彩作为老资历的情报人员，作为治安官也是十分优秀的，今天早上她刚刚被临时借调到了首都圈进行治安官工作，她就像往常一样认认真真的观察任何事情，想要完全真实的进行上报。直到今天，她第一次选择了隐瞒，没有上报完整的监视记录，因为，在今天傍晚，她看到一个长的十分像我们英明的全国领袖晓美焰的人，正在护民官鹿目圆香的家里行窃，偷走了护民官刚脱下不久的贴身衣物。虽然心中十分纠结，但是内田真彩还是选择就当没看见好了吧……\n第二天，内田真彩被逮捕，罪名是，她在昨天的报告中隐瞒了，她所目击到的，我们英明的全国领袖晓美焰获取生活必需品的行为。"
  magicunion.1075.a:0"生活必需品？？？"

  magicunion.10751.t:0 "友爱部：整顿治安6"
  magicunion.10751.desc:0 "天泉秋音在监狱里，等待着审判，一切都是一场意外，她在路边捡起了很厚一叠叛军传单，然后刚好被治安官看到，她甚至都还没看传单是什么内容，真是无妄之灾，但是又解释不清，自己的人生就这么要完了吗。\n这时牢房被打开了，一名治安官走了进来。天泉秋音立刻说到：‘长官！我不是异端叛军，我是无辜的，至少，求您...请放我我的家人...要是她们也因此被连累的话，我...’。\n特工冷漠的看着这个抱着自己大腿的囚犯，她表情中蕴含的悲怜似乎不像作假。特工当然知道天泉秋音是无辜的，因为那叛军传单就是她放在那的，就是为了让天泉秋音捡到，因为治安局看中了天泉秋音的品质与善良，而她母亲在1935年的内战中曾加入过叛军，所以她不可能通过正规的审查，而且其性格高傲亦不愿意接受晓美焰独裁政府的救助，所以特工选择用这种特殊的方式来给予她一份工作。但是现在，特工得表现的冷酷一些，表现的就像是个绝不会因为怜悯而放过无辜者的酷吏。‘我想我不需要自我介绍了，天泉秋音小姐，我看了你的档案，你这人，满脑子想的都是别人呢。但是和异端有关的行为，只有死路一条呢。不过鉴于你以往的忠诚，你还有另一条路可选。成为一名治安官，证明你的忠诚，你将被派遣执行最危险的任务，但你仍然可以与你的家人住在一起，做出你的选准备吧，是继续待在监牢里期望着有朝一日能洗刷冤屈，还是宣誓成为治安官。’特工说完之后等待着预料之中的答复，哪怕是这种高傲的民主份子，在蒙冤入狱的威胁下，也必然会同意成为治安官，话说回来治安官被人称作‘人民的女仆’也能算民主的一部分吗。天泉秋音在短暂的犹豫后，随即缓缓站了起来，下定了决心，在庄严肃穆的宣誓中成为了一名治安官。"
  magicunion.10751.a:0"计划之中的结果"
  magicunion_10751_a_txt:0"§Y天泉秋音§!成为§G治安官§!。"

  magicunion.10752.t:0 "友爱部：整顿治安7"
  magicunion.10752.desc:0 "一天晚上，负责接送小圆的司机因为家中有事，所以小圆让她提前离开了。小圆自己开车回家，由于开车技术不熟练，不小心超速了。刚好被两个交警看到。\n于是老交警让年轻的实习交警去拦下那辆车开罚单。\n但是，一会儿，交警回来了，由于车上的人身份特殊，没有开罚单。\n老交警听到之后十分的生气！她说道：\n“我们作为魔法少女联盟的交警！维护法律的威严就是我们的生命！保障法律不偏不倚的实施就是我们的灵魂！不能给任何人开任何特权是我们的人格！确保魔联的所有人都在法律面前一视同仁是我们的信仰！维护魔联的法律是我们的一切！甚至是为此付出生命！是我们对晓美焰盟主的忠诚！！哪怕超速的是我们英明的全国领袖晓美焰本人，你也得恭敬的开出罚单！而你竟然因为车上的人身份特殊而没有开罚单！你的行为已经严重的违反了魔联的法律！也是对我们英明的全国领袖晓美焰本人的不忠诚与背叛！！你对身份高贵的人开特权的行为简直令我作呕！你这是在纵容特权！放任腐败！我为你感到羞愧！甚至和你共事都觉得是一种耻辱！”\n实习交警失落的说到：“可是，车上的是我们英明的全国领袖晓美焰最好的朋友鹿目圆。”\n老交警听完当场大惊失色：“哦，那就另当别论了...。哪怕鹿目圆女士开着坦克撞进交警总部我也没意见，甚至她开车从我身上压过去都行，你的应变能力令我印象深刻，我会给你的实习报告打上最好的分数。还有...我得向你道歉，”"
  magicunion.10752.a:0"你对全国领袖的忠诚令我敬佩。"

  magicunion.10753.t:0 "友爱部：整顿治安8"
  magicunion.10753.desc:0 "雪田茉璃原本是一名治安官，昨天接到调令，前来刑场当处刑者。换好工作服，看着镜子上的裂痕，就像一道伤疤穿透着自己，这真的是自己想做的吗？而且魔联对叛徒的惩戒十分严格，几乎所有与游击队有关的人都会被处以死刑。就连身为治安官的自己，都瞧不起那刽子手，而如今，自己却成为了其中的一员，魔联的公务员，职位的调动是没有拒绝的权利的。雪田茉璃摇了摇头，把一团乱麻的思绪甩出脑海，走出了办公室。\n刑场大门打开，一辆车开入，几名囚犯被送了下来，囚犯崩溃大叫着‘你跟我们说为了人们美好的未来！我们才来参加游击队的！这里根本不是游击队的营地！’，而司机只是说道，‘只有这样，其他人才能过上安全美好的生活’。\n‘又是一起钓鱼执法’雪田茉璃心中想着，为即将被处死的囚犯感到莫名的落寞。\n‘第一天来上班？’一名长官扶着雪田茉璃的肩膀将她拦了下来，‘让我检查一下你的枪’，长官退下弹夹检查了枪膛，确认每一颗子弹都是有蓝色标记的处刑弹。‘很好。我再提醒一遍，绝对只允许打躯干部位，这样才能让犯人们在死前多感受痛苦。否则就得让你站那了’\n随着一声声枪响，囚犯们应声倒地，然后，被抬上了车离开了刑场大门。\n许久之后，已经成为‘血债累累’的熟练的处刑人的雪田茉璃和长官一起喝酒时问起："
  magicunion.10753.a:0"为什么要用特制的子弹处死罪犯"
  magicunion_10753_a_txt:0"老长官淡然的说道：‘因为魔联实际上没有死刑，都是吓唬人的。可别说出去。’"

  magicunion.10754.t:0 "友爱部：整顿治安9"
  magicunion.10754.desc:0 "一封密信在一支笔急促的书写下形成，在监控使魔的注视下，密信被丢入邮箱，随后一位邮寄员立刻出现在夜色中将它分拣到了一个特殊的包裹中，在少许之后送达了审判庭第十九局。随后，经过三个办公室的审批与检阅之后，被一位公务员带去档案室核对资料。随后一份命令被递交，评估小组立刻出动赶往地点。\n\n于凌晨时分，攻击小组破墙而入摧毁了境外势力刚刚建立的联络站点，缴获了这些渗透者的武器与炸药，当太阳升起时，人们继续忙碌的上班与出行，一切如常。"
  magicunion.10754.a:0"人们得以安稳的生活。"
  
  magicunion.10755.t:0 "友爱部：整顿治安10"
  magicunion.10755.desc:0 "在这片星光低垂的魔法国度，见泷原后山哪怕没有路灯，也依旧明亮。白色的花海渲染着美好，亦蕴含着离别。\n晓美焰盟主与第三特遣队的队长黑神小姐在山顶俯视着见泷原。\n黑神队长看着盒子里那枚闪闪发光的，‘这英雄的勋章，我的功绩还不够资格呢’\n‘你曾经拯救了很多人’魔联圣洁的盟主沉静的叙述着，就像是在叙述曾经发生的事情‘这一次你也会拯救很多人。这是提前给予你的。’\n‘那我就预先收下了。等回来之后我会为您调配最好的保养容颜的药剂的。’\n黑神队长带着象征荣誉的徽记离开了，晓美焰看着她远去的背影，似乎看到了自己曾经的影子，一旁的白袍少女走上前来，‘她不会回来了，是么？’\n晓美焰只是看着依旧低垂的星光和黑神队长离开的方向：‘她会拯救很多人的......’\n‘但不包括她自己...’白袍少女追问道，而晓美焰没有回应。是啊，自己是个预言系能力者，这个问题，根本不需要盟主来回答。白袍少女将自己的兜帽摘下，月色映照着织莉子那哀伤的面容‘在那之后，黑神队长，她甚至连自杀的机会都不会有... ...’\n晓美焰望着黑神队长离开的方向举起了酒杯，‘总得有魔法少女牺牲，凡人们才能依靠着她们的牺牲活下去...’\n在月色的映照下，星光的笼罩中，杯中的红酒缓慢的流淌着：‘为战败的魔法少女...'"
  magicunion.10755.a:0"致以崇高的敬意..."

  magicunion.10756.t:0 "安全、可靠的现在与未来"
  magicunion.10756.desc:0 "如果你认为魔法少女联盟内的所有居民都安分守己，互帮互助的话，那你就大错特错了。事实上，长期的贫困与教育的落后已经使得联盟内部许许多多的城市成为了犯罪的温床，晓美焰发誓会让这种情况成为历史，哪怕是要用一些严厉的手段——\n从西南到东北，整个联盟内的城市的主要街道上都已经被安装上了难以被察觉的监控使魔，用于监控与阻止一切犯罪行为。\n“魔法学园东路，无异常。”\n“花园大道北路，无异常。”\n“联盟路西路，正在申请支援。”\n在晓美焰特别设立的中央监控中心内，作为监控员们的魔法少女们正在忙碌着搜集汇总情况，她们是晓美焰最忠诚的眼睛，一切犯罪行为在她们的眼中都无处可避。\n“等等，发现新情况——”一个监控员看着监控屏幕，突然震惊地说道。\n“怎么回事，B-117号监控员，有发现什么犯罪人员吗？”\n“不，那是…晓美焰大盟主…她在干什么呢…”监控员颤声回复道，压低声音仿佛是怕摄像头内的少女听见她的话一般。\n在监控画面中，晓美焰已经不动声色地跟上了一个背着黑色包包的女孩。除了晓美焰，在这个时间点理应没人知道那个少女会在2分钟以后在闹市区引爆背包中的炸弹装置。\n闹市区的街道上人来人往，少女沉默不言地停在了人群的中央，任由人们从她的两侧挤过去。\n没有时间继续犹豫，晓美焰双腿一个发力便弹射起步，犹如子弹般飞了出去。她在少女背后站定，趁着她没反应过来之际一个扫堂腿踢倒少女，将她控制了起来。\n“怎么会…你居然…居然知道…可我明明…明明没有和任何人说过…”少女的声音颤抖着，错愕地盯着身上的晓美焰。\n“你可以瞒得住很多人，但永远瞒不住自己的内心和我。”晓美焰没有多说什么，只是迅速解下了少女的背包，拿出其中的炸弹装置，几个监控使魔一拥而上，把罪犯控制了起来。\n监控中心内一片欢呼，庆祝晓美焰盟主亲手逮捕了一个危险的罪犯，可那个监控员却仍然止不住地想：“在这个被魔法少女保护的国家中，晓美焰盟主的情报网到底严密到什么程度？”"
  magicunion.10756.a:0"当“未来”不再成为未来，那么“现在”又可否成为现在呢？"

  magicunion.10757.t:0 "毕业典礼上的一幕"
  magicunion.10757.desc:0 "神滨大学迎来了又一年的毕业典礼，在经历了许多可怕的战乱之后，这座已有百年历史的学园在今天仍然与联盟一同屹立不倒。今天，它将继续见证着，又一批学生结束自己的学业，踏入为国家风险终身的未来。\n但是并非每个人都心怀热忱，在会场的角落里，那些成绩很差没有修得足够学分的少女们只能眼巴巴地看着她们的同学。\n而清水莉子，就是这些人其中的一位。事实上，她从来没有喜欢过、也没有学会过她攻读的经济学专业。她喜欢的是艺术与文学，可她的母亲却认为只有学习经济才能让她出人头地。在不喜欢的专业中，成绩一落千丈。那些自卑的情绪如同钢针一般深深刺痛着她。她想哭，却怎么也哭不出来，因为泪水只会让她显得更丢人。\n“…您能亲自莅临我校的毕业典礼，真是我校莫大的荣幸呐。”\n清水莉子看向舞台，只见不知何时，舞台前多了一个少女，魔法少女联盟英明的全国领袖。"
  magicunion.10757.a:0"晓美焰盟主"

  magicunion.107571.t:0 "毕业典礼上的一幕"
  magicunion.107571.desc:0 "晓美焰直接看向角落里那些垂头丧气的少女们，\n清水莉子正好和晓美焰的目光对了个正着，吓得她赶紧低下了头。\n“我今天来到这里，只是为了找一个学生，她名叫清水莉子。”\n晓美焰的声音不大。\n“啊…晓美焰盟主，据我所知，清水莉子虽然成绩很差但绝不是坏人…如果她做了什么错事，我作为教育者应当是我的过失…”\n“把她带过来吧。”晓美焰打断了校长的话，脸上没有一点表情。\n清水莉子被不情不愿的校长带上了台，她低着头，心中不断回想着自己最近做了什么错事，就连脚步都仿佛灌了铅一般沉重。\n“清水莉子同学。”\n“嗯…”晓美焰大统领的声音似乎没有那么严肃冷漠，恰恰相反，似乎带着一点点…温柔？\n“喜欢艺术和文学，对吗？”\n“对…可是…你是怎么？”难以置信，清水莉子在一瞬间被惊讶驱使着抬起头，却对上晓美焰盟主那仍旧冷酷的表情。\n“我特聘你为神滨市的文化宣传大使，进行文化作品的创作工作。”\n“晓美焰盟主…”\n在清水莉子一脸震惊中，获得了她曾经梦寐以求的艺术职业生涯。\n\n只有晓美焰知道，清水莉子会在成为一名优秀的艺术家，可她只留下一幅作品便选择结束了自己的生命…"
  magicunion.107571.a:0"这样悲剧的未来，不应该发生在我的治理下发生——"

  magicunion.1076.t:0 "友爱的丛林区"
  magicunion.1076.desc:0 "在经过数个月的深度协商之后。一些住在我国丛林区的妖精们愿意加入联盟的行列，大家都是想着和美少女贴贴的善良的好伙伴，所以一切都进行的很顺利。"
  magicunion.1076.a:0"欢迎妖精们加入"

  magicunion.10761.t:0 "终焉落幕"
  magicunion.10761.desc:0 "在经过数个月的净化后。一些盘踞我国白教区的亡灵们已经得以净化，在纯白的魔法中迎来永恒的安眠。我们将亡灵的怨念与污秽封印在灵想兵装的核心中，而有一些过于强大的亡灵，在净化之后成为了纯净的执念体。我们有一天或许会把这些被污染的怨念投射到战场上...或许吧..."
  magicunion.10761.a:0"亡灵们在落寞中迎来终焉..."
  
  magicunion.10762.t:0 "骑士寂夜"
  magicunion.10762.desc:0 "思念的飞过寂静的夜空，执念仍停留在指尖缠绕，在魔法与奇迹编织的美梦中，死者的魂灵将与生者并肩而战，直至那一切的终点。"
  magicunion.10762.a:0"执念将让思绪跨越死亡..."

 # magicunion.1076.b:0"傀儡妖精"
 # magicunion.1076.c:0"吞并妖精"

  magicunion.1077.t:0 "收编军队？"
  magicunion.1077.desc:0 "我们需要妖精们的军队吗？"
  magicunion.1077.a:0"全部收编"
  magicunion.1077.b:0"解散它们"

  magicunion.1078.t:0 "收编将领？"
  magicunion.1078.desc:0 "我们需要妖精们的将领吗？"
  magicunion.1078.a:0"收编她们"
  magicunion.1078.b:0"让她们退休"

  magicunion.1079.t:0 "关键地区遭到袭击"
  magicunion.1079.desc:0 "国家内部发生了骚乱，似乎是某个组织或派系在搞破坏。"
  magicunion.1079.a:0"派部队镇压"

  magicunion.1080.t:0 "遭到爆破袭击"
  magicunion.1080.desc:0 "我国内部的反对派联合外国势力发动了战争。"
  magicunion.1080.a:0"呼叫陆军总部"

  magicunion.1081.t:0 "神机出阵！"
  magicunion.1081.desc:0 "经过了科学家们日以继夜的努力，我们的工程师们终于修复了这个伟大的上古兵器，核能反应堆提供的能源在这钢铁巨神的胸腔中释放着亿万的光芒，数据洪流伴随着管线遍布每一处关节，从遗迹静滞仓中复苏的机组成员已经进入了驾驶舱，战争号角在高声咆哮，魔炮正在发出轰鸣，准备撕碎一切联盟的大敌。"
  magicunion.1081.a:0"鸣响大钟 启动引擎"
  
  
  magicunion.1084.t:0 "西非的命运"
  magicunion.1084.desc:0 "我们已经帮助西非本地的少女们赶走了圣杯殖民者，现在我们要怎么做？\n\n（如果你想继续打代理人战争，那么就选维持现状）\n（那么你可以在之后邀请她们加入阵营）"
  magicunion.1084.a:0"邀请她们加入阵营"
  magicunion.1084.b:0"傀儡她们"
  magicunion.1084.c:0"吞并她们（没有核心）"
  magicunion.1084.d:0"就维持现状吧"
  
  magicunion.1085.t:0 "莫德雷德王冠领沦陷"
  magicunion.1085.desc:0 "随着西非的反殖民运动愈演愈烈，莫德雷德王冠领最终失去了控制。当地的殖民军已经不得不撤离，或许我们应该先专注于欧洲的战事，等伟大战争结束之后再去处理这件事情。"
  magicunion.1085.a:0"暂时让部队撤出西非"
  magicunion.1085.b:0"绝不容忍！"

  magicunion.1086.t:0 "魔联要求吞并"
  magicunion.1086.desc:0 "随着幻想乡和法国的战败，我们已经失去了保护。现在，魔法少女联盟要求我们归还她们的港口租界。"
  magicunion.1086.a:0"只能归还了（我们将被吞并）"
  magicunion.1086.b:0"绝不！（战争！）"
  magicunion.1086.c:0"我们愿意转而效忠于她们\n（成为她们的傀儡国）"
  
  magicunion.1087.t:0 "种子神殿的封印被破坏"
  magicunion.1087.desc:0 "随着种子神殿的封印被破坏，远古时期被我们封印的珠泪哀歌族重新回到了战场，她们要延续那场来自于远古的战争。"
  magicunion.1087.a:0"来自深海的怨仇"
  
  magicunion.1088.t:0 "战争已经无望"
  magicunion.1088.desc:0 "随着阿德莱希城的沦陷，战争已经到了绝望的地步，现在那些妖精们要求我们交出这几百年来从她们那里抢走的所有领土。"
  magicunion.1088.a:0"只能归还了..."
  magicunion.1088.b:0"人类！绝不会屈服于妖精！"
  
  magicunion.1089.t:0 "魔法少女联盟要我们臣服"
  magicunion.1089.desc:0 "随着我们被虫子击败，失去了大部分领土，魔法少女联盟要求我们臣服，作为她们的附庸。"
  magicunion.1089.a:0"只能这样了..."
  magicunion.1089.b:0"战争！战争！"
  
  magicunion.1091.t:0 "§R来自丛林的消息§!"
  magicunion.1091.desc:0 "新上任的塞拉虫母，要为了上任虫母库拉莉亚复仇，她要§R消灭所有的人类！§!但是鉴于魔法少女与妖精的友好过往，她给了我们一个选择，加入丛林部队，为丛林而战。虫母会允许我们，在由妖精们统治的新世界中生活下去。"
  magicunion.1091.a:0"§R我们是人类！§!"
  magicunion.1091.b:0"§R唏。可以和解吗？§!"
  
  magicunion.10911.t:0 "§G阿德莱希特工被逮捕§!"
  magicunion.10911.desc:0 "妖精告诉我们，前段时间有几名人类潜入丛林深处试图搞破坏，然而已经被成功逮捕。\n卑鄙的人类无法在战场上击败我们，竟然使用如此下作的手段，但是无论如何，丛林是安全的。"
  magicunion.10911.a:0"妖精们不知道自己做了一件多重要的事情"
  
  magicunion.1092.t:0 "魔联想要投降"
  magicunion.1092.desc:0 "在瓦尔哈拉社的百万红军的强大的打击下，魔法少女联盟终究还是坚持不住了，她们发来消息想要投降，成为瓦尔哈拉社的傀儡国。"
  magicunion.1092.a:0"就这样吧"
  magicunion.1092.b:0"我们不会和反动派和解"
  
  magicunion.10932.t:0 "晓美焰对魔联的态度"
  magicunion.10932.desc:0 "在这次轮回中，晓美焰想要成为魔联盟主嘛？"
  magicunion.10932.a:0"晓美焰想入主魔联"
  magicunion.10932.b:0"晓美焰漠不关心"
  MGU_AHM_decisions_1:0 "晓美焰对魔联的态度"
  MGU_AHM_decisions_2:0 "晓美焰偏执度设置"
  BRA_AHM_decisions_3:0 "丛林的选择"
  BRA_AHM_decisions_4:0 "阿德莱希团结度"
  magicunion.10933.t:0 "晓美焰管理国家的态度设置"
  magicunion.10933.desc:0 "在这次轮回中，晓美焰管理国家的态度如何？"
  magicunion.10933.a:0"强而有力"
  magicunion.10933.b:0"稍微努努力"
  magicunion.10933.c:0"无所谓，还是摸鱼好"

  magicunion.10934.t:0 "丛林的选择"
  magicunion.10934.desc:0 "丛林打算如何对待仇恨？"
  magicunion.10934.a:0"复仇复仇！"
  magicunion.10934.b:0"等待时机。"
  
  magicunion.10935.t:0 "阿德莱希正统性"
  magicunion.10935.desc:0 "在面对妖精时，阿德莱希的各派系会效忠当权者吗？"
  magicunion.10935.a:0"同仇敌忾"
  magicunion.10935.b:0"坚定应对"
  magicunion.10935.c:0"分崩离析"

  magicunion.1094.t:0 "魔联想要帮助我们"
  magicunion.1094.desc:0 "来自南美的信息放在了你的办公桌上，魔法少女联盟想要帮助我们打赢北美战争，而我们所要付出的只是战后支付少量的代价。鉴于当前的战场形式，我们应当接受一切帮助。"
  magicunion.1094.a:0"欢迎一切帮助"
  magicunion.1094.b:0"让那些南美颠姥离远点"
  
  magicunion.1095.t:0 "北美同意了我们的介入"
  magicunion.1095.desc:0 "我们介入北美内战的提议被接受了，她们愿意在战争之后为我们提供一部分利益。"
  magicunion.1095.a:0"让志愿军出发"

  magicunion.1096.t:0 "北美拒绝了我们的介入"
  magicunion.1096.desc:0 "看来她们不需要我们的帮助。"
  magicunion.1096.a:0"算了算了"
  magicunion.1096.b:0"或许其她人愿意接受我们的帮助"

  magicunion.1097.t:0 "兑现承诺"
  magicunion.1097.desc:0 "北美战争结束了，我们支持的国家获得了胜利，统一了北美，现在我们可以索取我们应得的回报了。"
  magicunion.1097.a:0"我们要精灵的卓越灵装"
  magicunion.1097.b:0"我们要法国的装甲坦克"
  magicunion.1097.c:0"我们要荒坂的高新科研"
  magicunion.1097.d:0"我们要远洋的航海技术"
  magicunion_1097_c:0"荒坂高新科研"
  
  magicunion.10971.t:0 "无名之路"
  magicunion.10971.desc:0 "战争结束之后，许多士兵都选择离开战场，回到平静的生活之中。而精灵之国在战争中研发的人工生命体士兵，却因此失去了她们被创造者所赋予的使命。\n这些为战争而生的人工生命体，在战后是否可以得到与自然人相同的待遇我们不得而知。但是盟友告知我们，可以接纳她们加入我们的军队，只要我们愿意的话。"
  magicunion.10971.a:0"我们可以接纳她们"
  magicunion.10971.b:0"我们更想要一些'普通的'枪械"
  magicunion_10971_txt:0"[USA.GetFlag]§Y[USA.GetName]§!（战术人形：§Y夏安§!），加入[MGU.GetFlag]§Y[MGU.GetName]§!"

  magicunion.1098.t:0 "魔联要求兑现承诺"
  magicunion.1098.desc:0 "魔联在战争中曾为我们提供支持，现在战争结束了，我们赢得了胜利，魔联要求我们提供回报。"
  magicunion.1098.a:0"就这样吧"

  magicunion.1099.t:0 "夜莺之国§R遭到入侵§!"
  magicunion.1099.desc:0 "我们的邻国，夜莺之国正在遭到外敌入侵！我们应当立即介入，趁现在还有机会。"
  magicunion.1099.a:0"知道了。"

  magicunion.10991.t:0 "妖精联邦§R遭到入侵§!"
  magicunion.10991.desc:0 "我们的邻国，妖精联邦正在遭到外敌入侵！我们应当立即介入，趁现在还有机会。"
  magicunion.10991.a:0"知道了。"

  magicunion.10992.t:0 "魔法少女联盟邀请我们加入"
  magicunion.10992.desc:0 "魔法少女联盟邀请我们加入她们的联盟，以共同对抗敌人。"
  magicunion.10992.a:0"我们加入。"
  magicunion.10992.b:0"拒绝她们。"

  magicunion.10993.t:0 "妖精联邦拒绝加入我们"
  magicunion.10993.desc:0 "我们的邀请被拒绝了。"
  magicunion.10993.a:0"……"

  magicunion.10994.t:0 "妖精联邦加入了我们"
  magicunion.10994.desc:0 "妖精联邦，现在将与我们共同对抗敌人。"
  magicunion.10994.a:0"欢迎朋友们"
  
  magicunion.10995.t:0 "安息之国§1请求帮助§!"
  magicunion.10995.desc:0 "野火的扩张令所有人都感到担忧。野火就如同她的名字，她的军队将会跟随她们所谓的理想燃烧整片大陆。而在野火进攻安息之国的时刻，则是阻止她们最好的时机。"
  magicunion.10995.a:0"这是个完美的时机"
  magicunion.10995.b:0"不行"
  
  magicunion.10996.t:0 "安息之国§1请求帮助§!"
  magicunion.10996.desc:0 "阿德莱希的混沌大军将要摧毁整个大陆的一切反抗与秩序。而在帝国进攻安息之国的时刻，我们不应当袖手旁观。"
  magicunion.10996.a:0"我们必须介入其中"
  magicunion.10996.b:0"不行"

  magicunion.1100.t:0 "魔联请求军事援助"
  magicunion.1100.desc:0 "南美洲的魔法少女联盟在对抗共党的战争中防线崩溃，急需军火援助。否则她们的部队支撑不了多久。为了遏制§R中南美洲共产主义§!的扩张与统合，以及为了保护我们在当地的殖民港和资产的安全，我们应当为魔联其一些帮助。"
  magicunion.1100.a:0"多少给点援助（花钱购买）"
  magicunion.1100.b:0"尽可能的支援更多军火"
  magicunion.1100.c:0"尽可能的支援更多军火（花钱购买）"
  magicunion.1100.d:0"现在不行...下次一定。"
  magicunion.1100.e:0"§R我们不关心南美！也不关心共党！§!"

  magicunion.1101.t:0 "圣杯送来了军火"
  magicunion.1101.desc:0 "圣杯同意送来军火，以帮助我们维持战线。"
  magicunion.1101.a:0"太好了。"

  magicunion.1102.t:0 "圣杯送来了大量军火"
  magicunion.1102.desc:0 "大量的圣杯运输船到达了南美，先进而强大的军火装满了港口的仓库，圣杯王国的使者表示，只要我们坚持这场抵抗战争，就会继续支援我们，直到胜利的那一天。"
  magicunion.1102.a:0"感谢圣杯老爷。"
  
  magicunion.11021.t:0 "圣杯不再帮助我们"
  magicunion.11021.desc:0 "圣杯王国不提供任何军火支援，似乎厌恶我们了...不知道是哪里得罪了她们。"
  magicunion.11021.a:0"是不是该发起投降投票了？"
  
  magicunion.11022.t:0 "没有军火"
  magicunion.11022.desc:0 "圣杯王国说下次一定给我们军火，可是谁又能保证呢。"
  magicunion.11022.a:0"我们还能坚持多久？"
  
  magicunion.1103.t:0 "都说了不要点了"
  magicunion.1103.desc:0 "这后面就一个原版国策树喵..."
  magicunion.1103.a:0"（QAQ）"
  
  magicunion.1104.t:0 "魔联请求经济援助"
  magicunion.1104.desc:0 "随着§R南美革命战争§!的进行，魔联的经济面临危机，为了能够继续抵抗共党的入侵。她们请求我们进行一些经济上的支持。以帮助她们遏制共党在南美洲的扩张。"
  magicunion.1104.a:0"行吧，把钱划过去"
  magicunion.1104.b:0"她们要多少，给她们双倍。"
  magicunion.1104.c:0"现在没空管南美，也没空管共党。"
  
  magicunion.1105.t:0 "圣杯送来了很多钱"
  magicunion.1105.desc:0 "圣杯送来的这笔钱可以很好的缓解我们的债务危机，让我们把这场战争继续下去。"
  magicunion.1105.a:0"太棒了！"
  
  magicunion.1106.t:0 "圣杯送来了钱"
  magicunion.1106.desc:0 "圣杯送来的这笔钱可以很好的缓解我们的债务危机，让我们把这场战争继续下去。"
  magicunion.1106.a:0"这能帮助我们支撑下去。"
  
  magicunion.1107.t:0 "失败的求助"
  magicunion.1107.desc:0 "我们请求经济援助的计划落空了，圣杯王国的政府不愿意提供任何帮助，但南美殖民港的圣杯总督给了我们一点钱。我们或许可以用这点钱买点好吃的分发下去。"
  magicunion.1107.a:0"我几乎听到经济倒塌的声音了..."
  magicunion.1107.b:0"......"

  magicunion.1108.t:0 "向瓦社投降？"
  magicunion.1108.desc:0 "我们根本没有能力抵抗瓦尔哈拉社，而且鉴于瓦社对我们的友好态度，国内有很多人都在提议直接投降吧。"
  magicunion.1108.a:0"拥抱社会主义"
  magicunion.1108.b:0"决不投降！"

  magicunion.1109.t:0 "向瓦社投降？"
  magicunion.1109.desc:0 "艾尔孚利登王国根本没有能力抵抗瓦尔哈拉社，她们想要投降成为我们的傀儡国。"
  magicunion.1109.a:0"欢迎加入有神论社会主义阵营"
  magicunion.1109.b:0"我们对此另有安排。"
  
  magicunion.11090.t:0 "对夜莺之国和圣塞莉母巢：发动进攻"
  magicunion.11090.desc:0 "南美的人民正在等待着解放，我们必须将革命带给她们。"
  magicunion.11090.a:0"革命已经到来！"
  magicunion.11090.b:0"还不到时候..."

  magicunion.11091.t:0 "对维洛尼亚：发动进攻"
  magicunion.11091.desc:0 "南美的人民正在等待着解放，我们必须将革命带给她们。"
  magicunion.11091.a:0"革命已经到来！"
  magicunion.11091.b:0"还不到时候..."

  magicunion.11092.t:0 "对阿德莱希：发动进攻"
  magicunion.11092.desc:0 "南美的人民正在等待着解放，我们必须将革命带给她们。"
  magicunion.11092.a:0"革命已经到来！"
  magicunion.11092.b:0"还不到时候..."

  magicunion.11093.t:0 "对军团：发动进攻"
  magicunion.11093.desc:0 "南美的人民正在等待着解放，我们必须将革命带给她们。"
  magicunion.11093.a:0"革命已经到来！"
  magicunion.11093.b:0"还不到时候..."

  magicunion.11094.t:0 "对妖精：发动进攻"
  magicunion.11094.desc:0 "南美的人民正在等待着解放，我们必须将革命带给她们。"
  magicunion.11094.a:0"革命已经到来！"
  magicunion.11094.b:0"还不到时候..."

  magicunion.11095.t:0 "对魔联：发动进攻"
  magicunion.11095.desc:0 "南美的人民正在等待着解放，我们必须将革命带给她们。"
  magicunion.11095.a:0"革命已经到来！"
  magicunion.11095.b:0"还不到时候..."

  magicunion.11096.t:0 "将阿德莱希转让给洛社？"
  magicunion.11096.desc:0 "莉兰迪亚公社要求我们将阿德莱希地区转让给她们，作为南美共产国际的同志，我们或许也应当将南美地区转交给她们，当然，我们也可以拒绝。"
  magicunion.11096.a:0"给她们"
  magicunion.11096.b:0"阿德莱希是我们的"

  magicunion.11097.t:0 "瓦社移交阿德莱希"
  magicunion.11097.desc:0 "瓦社将阿德莱希地区的控制权移交给了我们，现在阿德莱希地区归我们所有了。"
  magicunion.11097.a:0"太好了"

  magicunion.11098.t:0 "瓦社拒绝将阿德莱希交给我们"
  magicunion.11098.desc:0 "瓦社宣布阿德莱希地区，应当由瓦尔哈拉社控制，并拒绝移交给我们。"
  magicunion.11098.a:0"知道了"

  magicunion.1110.t:0 "魔联要求和谈"
  magicunion.1110.desc:0 "随着南美局势的恶化，我们的部队已经几乎撤离了南美，虽然我们仍然可以再次发起入侵，但是已然看不到胜利的机会了。"
  magicunion.1110.a:0"让这场战争结束..."
  magicunion.1110.b:0"战争仍将继续！"

  magicunion.1111.t:0 "白城在下雨"
  magicunion.1111.desc:0 "随着战线的撕裂，莉兰迪亚公社的首都白城，已经被攻破，工人们在与入侵者一条街一栋房一间屋的拼死争夺。这座干燥而寒冷的城市久违的下起了大雨，这场异常的大雨已经持续了三天三夜，公社的最高领导人拒绝撤离城市，与总统卫队一同坚守在总统府大楼中。而城市中的工人们为了捍卫她的理想愿意为她付出包含自己的生命在内的一切，她们手中那赤红的旗帜在这三天三夜的暴雨中仍然鲜红夺目。掩体与墙壁早已在魔炮轰炸中崩溃，红军战士们抱着已死队友的尸体，感受着同志脸颊上残存的温度，早已死去的尸体在暴雨的摧残中抖动着，似乎还想保护着活着的她们。\n大雨冲刷着这座城市的一切，冲走地上的灰尘以及士兵们的血污，路边的野草也染上了一层的猩红。在那暴雨也无法涤净的血泊之中士兵们捍卫着总统府的大门，战壕崩塌墙体破裂，人们抱着同志们的尸体继续着必败无疑的战斗。\n那魔炮的轰鸣与雷声交织演奏出地狱般的激奏曲。她们的心中充满着恐惧，但并非是对死亡，而是她们显然再也无法完成她们的理想，就如同不存在的猩红的童话，在今日之后，就只会存在于孩童的呓语与疯狂的妄言之中。\n大雨还在下，这么多年的努力就要在今天断送，就连她们最敬爱的总统也保护不住，但是士兵们仍然在麻木的扣动着扳机，用自己的血肉之躯去对抗灵装士兵的冲杀。一轮一轮的反冲锋与厮杀肉搏，一名自愿应征的工人扑向了敌人，她手中铁铲连同她的肉体一同在瞬间被折为两断，但是随后有更多的工人蜂拥而上，将突入阵地的敌方少女压倒在地，随后一同被爆炸轰杀泯灭。如果这场赤红的美梦必定碎裂，那么至少她们也要为这场梦陪葬，用她们的命延续这场梦境哪怕一分一秒。\n大雨还在下，总统府阵地如同吞噬一切的血腥巨口，士兵们不断地增兵不断地求援，一批又一批的增员部队踩踏着队友的尸体爬进那血腥的炼狱。直到那些可怕的梦魇突入了总统府内，原本激烈的枪声哑然而止。\n\n大雨还在下..."
  magicunion.1111.a:0"她绝不后退，我们亦当如此"
  magicunion.1111.b:0"胜利在望"
  magicunion.1111.c:0"看来南美战争已经接近尾声了"
  
  magicunion.1112.t:0 "招募新将领"
  magicunion.1112.desc:0 "（...）"
  magicunion.1112.a:0"让我们去探险协会看看"
  magicunion.1112.b:0"到圣杯殖民港转一圈"
  magicunion.1112.c:0"去巡视友爱部"
  magicunion.1112.d:0"去港口附近"
  magicunion.1112.e:0"去商业街的深处"
  magicunion.1112.f:0"去看看年轻的军官们"

  magicunion.1113.t:0 "爱丽丝的摇篮"
  magicunion.1113.desc:0 "（...）"
  magicunion.1113.a:0"欢迎加入"

  magicunion.1114.t:0 "魔法少女露娜"
  magicunion.1114.desc:0 "（...）"
  magicunion.1114.a:0"欢迎加入"

  magicunion.1115.t:0 "卡琳典狱长"
  magicunion.1115.desc:0 "（...）"
  magicunion.1115.a:0"欢迎加入"

  magicunion.1116.t:0 "蒸汽都市的少女侦探"
  magicunion.1116.desc:0 "（...）"
  magicunion.1116.a:0"欢迎加入"

  magicunion.1117.t:0 "魔法少女苍蓝星"
  magicunion.1117.desc:0 "（...）"
  magicunion.1117.a:0"欢迎加入"
  
  magicunion.1118.t:0 "军校演讲"
  magicunion.1118.desc:0 "（...）"
  magicunion.1118.a:0"对她们来说，这些战术或许还太先进了"
  

  magicunion.1123.t:0 "南美大战-请求调停"
  magicunion.1123.desc:0 "共产主义革命已经席卷了整个南美州，如果我们不做出行动，整个南美都会加入社会主义的阵营。\n现在我们有机会介入调停，避免那种情况的发生，但如果瓦尔哈拉社拒绝，我们将会直接参战。"
  magicunion.1123.a:0"让我们介入"
  magicunion.1123.b:0"别管南美了"

  magicunion.1124.t:0 "圣杯大使要求南美停火"
  magicunion.1124.desc:0 "圣杯王国的外交官要求我们立刻停止在南美的战争。否则她们将会§R武力介入§!\n\n但对于已经停止抵抗的国家\n且我们拥有她的首都\n那么§0瓦尔哈拉社§!仍然能够得到她"
  magicunion.1124.a:0"接受圣杯调停"
  magicunion.1124.b:0"§R圣杯？她有几个师？§!"

  magicunion.1125.t:0 "瓦社拒绝停火"
  magicunion.1125.desc:0 ""
  magicunion.1125.a:0 "接海军司令部"
  
  
  magicunion.1126.t:0 "[MGU.Getname]想要加入民主国家联盟"
  magicunion.1126.desc:0 ""
  magicunion.1126.a:0 "为新朋友干杯！"
  magicunion.1126.b:0 "加入民主联盟？让那个独裁政府？"

  magicunion.11261.t:0 "[PAO.Getname]想要加入民主国家联盟"
  magicunion.11261.desc:0 ""
  magicunion.11261.a:0 "欢迎我们的新朋友！"
  magicunion.11261.b:0 "那个神秘的亡灵国度？还是拒绝吧。"

  magicunion.11262.t:0 "露丝契亚远征军邀请我们加入民主国家联盟"
  magicunion.11262.desc:0 "鉴于我们和露丝契亚远征军的同盟关系，远征军在得知安息之国即将对外界进行武力干涉时，邀请我们加入民主国家联盟，以共同的对抗扰乱这世间秩序的邪恶侵略者，帮助圣杯联盟可以继续她的慈善民主主义来惠及整个世界。\n\n如果我们拒绝，出于对未来的担忧，远征军可能会退出我们的阵营，并单独加入民主国家联盟。\n\n而魔法少女联盟同样建议我们接受这一邀请，但也表示，无论我们最终做出怎样的决定，她们都将站在我们这一边。"
  magicunion.11262.a:0 "加入民主国家联盟"
  magicunion.11262.b:0 "拒绝"
  
  magicunion.1128.t:0 "$news_event_background$瓦社介入南美革命"
  magicunion.1128.desc:0 "瓦尔哈拉社的上百万红军部队正在陆续进入南美，据记者报道，前线已经发生猛烈交火。瓦尔哈拉社宣称将要解放整个南美州所有国家的人民。"
  magicunion.1128.a:0 "革命永不停歇！"
  magicunion.1128.b:0 "南美？"
  magicunion.1128.c:0 "共匪杀过来了！？"

  magicunion.11281.t:0 "$news_event_background$南美革命战争"
  magicunion.11281.desc:0 "莉兰迪亚公社我们发动了攻击，目前公社部队已经越过边境发动了全面入侵，她们宣称将要解放整个南美州所有国家的人民。"
  magicunion.11281.a:0 "我们会制止凡人的战争，无论凡人喜欢与否！"
  magicunion.11281.b:0 "让她们感受民主的力量！"

  magicunion.112811.t:0 "民主物资抵达神滨港口"
  magicunion.112811.desc:0 "公社狂热的赤卫队撕扯着我们的防线，国际纵队的坦克蹂躏着我们的意志。但是我们并非孤立无援，在外交部的努力下，民主国家对我们伸出了援手，一批装满军火的运输船已经在巡洋舰的掩护下进入神滨港口。\n不要害怕，哪怕在最危急的时刻，民主的灯塔也会为你我照亮前路。"
  magicunion.112811.a:0 "愿民主与你同在。"

  magicunion.112812.t:0 "民主物资抵达神滨港口"
  magicunion.112812.desc:0 "又一批军火抵达了港口，我们必须民主的坚持下去，为了我们的一切！为了自由的未来！"
  magicunion.112812.a:0 "愿民主与你同在。"

  magicunion.112813.t:0 "民主的灯塔会照亮我们的前路"
  magicunion.112813.desc:0 "第三批民主武器抵达了我们的港口。拿上他们，守住我们的一切！"
  magicunion.112813.a:0 "愿民主与你同在。"

  magicunion.1129.t:0 "南美战争已经进行了4年"
  magicunion.1129.desc:0 "距离南美革命战争开始，已经过了4年了。"
  magicunion.1129.a:0 "真是漫长..."
  
  magicunion.1130.t:0 "新的代理人"
  magicunion.1130.desc:0 "魔法少女联盟的新任盟主将我们在当地扶持的所有资本家都逮捕了，她们的一切财产与私有企业，都被收为国有。\n但是魔法少女联盟政府表示，她们愿意取代资本家们直接与我们做生意，在没有了那些中间商之后，我们可以得到更多的份额。"
  magicunion.1130.a:0 "哦~那当然好。"
  magicunion.1130.b:0 "没有人会反对额外的分成。"

  magicunion.1131.t:0 "资本问题"
  magicunion.1131.desc:0 "魔法少女联盟中或许有很多企业和工厂，但是不属于国家，而是属于私有企业，在背后扶持她们的是圣杯王国。"
  magicunion.1131.a:0 "让我们取代这些资本家，为圣杯王国提供更多的利润。"
  magicunion.1131.b:0 "我们没必要惧怕圣杯王国，她们现在自身难保。"
  
  magicunion.1134.t:0 "探险队汇报"
  magicunion.1134.desc:0 "按照传闻我们找到了污秽聚集的核心地区，在先进的地底探险设备与医疗保障中，我们特遣队员正在深入地下，随着地下洞穴的深入，污秽的浓度愈发严重，大量剧毒瘴气和污秽怪物，都在阻止着我们的部队继续深入，特遣队员们需要更多的支持才能继续执行任务。\n\n（需要：40政治点）\n（或者：200灵想兵装与支援装备）"
  magicunion.1134.a:0 "派遣更多援助，继续深入（政治点）"
  magicunion.1134.b:0 "派遣更多援助，继续深入（装备）"
  magicunion.1134.c:0 "让部队撤回来吧，这不值得..."
  
  magicunion.1135.t:0 "最深处"
  magicunion.1135.desc:0 "我们深入地下的探险部队突破了污秽怪物的拦截，终于抵达了最深处，我们没有发现传说中的秽鬼之王，但是在污染的最深处找到了一个全身污浊的少女。在进行了基础的救治之后她目前已经脱离了生命危险。\n最深处的污秽污染浓度极高，我们的特遣队员们已经开始出现严重腐化现象，申请立即撤离。"
  magicunion.1135.a:0 "让部队撤回地表"
  
  magicunion.11351.t:0 "护符或者灵药？"
  magicunion.11351.desc:0 "相传这里曾经有过一个教团，教团的细节已经无从考量，不知是本地的还是欧洲传来的。她们的巫女均佩戴着一种特殊的护符，其蕴含的魔法力量可以帮助巫女抵抗危险的环境，保护巫女圣洁的身体不受到任何的侵害。\n如果我们投入足够多的科研力量就可以掌握其制造工艺。\n据传说，那个失落的教团曾经在研发一种不死的灵药，可以把活人转化为不死不灭的亡灵，当然，这其中肯定带有夸张成分。如果传说是真的，那么这种灵药也必定存在，至少曾经存在过。\n如果我们投入足够多的科研力量就有机会将其重现。"
  magicunion.11351.a:0 "完成‘白巫女护符’"
  magicunion.11351.a:0 "完成‘不死的灵药’"

  magicunion.11352.t:0 "白巫女的传说"
  magicunion.11352.desc:0 "相传这里曾经有过一个教团，教团的细节已经无从考量，不知是本地的还是欧洲传来的。她们的巫女均佩戴着一种特殊的护符，其蕴含的魔法力量可以帮助巫女抵抗危险的环境，保护巫女圣洁的身体不受到任何的侵害。曾经有一位强大的巫女为了净化国家的污秽而深入了地下深处，然后渺无音讯再也没有回来，只有腐败与死亡的雨一遍又一遍的冲刷着这个国家。但是即便如此，仍然有些人相信，她一定还活着。"
  magicunion.11352.a:0 "让我们深入研究"
  magicunion.11352.b:0 "只是传闻罢了..."
  magicunion_11352_txt:0 "可以在决议中调查"

  magicunion.1136.t:0 "灵魂属于死神"
  magicunion.1136.desc:0 "..."
  magicunion.1136.a:0 "欢迎您，死神大人"
  
  magicunion.11361.t:0 "死神契约"
  magicunion.11361.desc:0 "你确定要接受死神契约吗？死神将会为你提供帮助，同时也将激发你真正的力量，但是，契约一旦签订，将无法挽回。"
  magicunion.11361.a:0 "§R我接受！§!"
  magicunion.11361.b:0 "我反悔了..."
  
  
  magicunion.1137.t:0 "你违约了"
  magicunion.1137.desc:0 "或许你的攻势受阻有各种原因，但是死神塔现在要收取你的灵魂用来抵消你的债务，从现在开始你得为死神塔工作，直到还清你的债。"
  magicunion.1137.a:0 "只能接受..."

  magicunion.11371.t:0 "你违约了"
  magicunion.11371.desc:0 "或许你的攻势受阻有各种原因，但是死神塔现在要收取你的灵魂用来抵消你的债务，从现在开始你得为死神塔工作，直到还清你的债。"
  magicunion.11371.a:0 "只能接受..."

  magicunion.1138.t:0 "你完成了2年的契约"
  magicunion.1138.desc:0 "你完成了2年内的契约，死神塔不会在2年时‘清算’你，现在南美洲已在你的掌控之中，但是你仍然要继续努力，为死神塔收集更多的灵魂。"
  magicunion.1138.a:0 "我的荣幸"
  magicunion.1138.b:0 "......"

  magicunion.1139.t:0 "你完成了4年的契约"
  magicunion.1139.desc:0 "你完成了4年内的契约，死神塔不会在4年时‘清算’你，现在整个美洲都在你的掌控之中，但是你仍然要继续努力，为死神塔收集更多的灵魂。"
  magicunion.1139.a:0 "我的荣幸"
  magicunion.1139.b:0 "......"

  magicunion.1140.t:0 "你完成了死神的契约"
  magicunion.1140.desc:0 "你完成了契约的全部内容，你为死神塔收集了足够多的灵魂，现在整个世界都雌伏在你的脚下，只是听到你的名字就足以令生灵万物颤抖。而死神塔愿意为你网开一面，赐予你和你最好的朋友长生不老，直到你们的生命因意外而终结的那一天。"
  magicunion.1140.a:0 "我的荣幸"
  magicunion.1140.b:0 "......"

  magicunion.1141.t:0 "灵魂归于梦境"
  magicunion.1141.desc:0 "..."
  magicunion.1141.a:0 "欢迎您，白兔小姐"

  magicunion.1142.t:0 "整合夜莺之国"
  magicunion.1142.desc:0 "我们要用哪种方式整合夜莺之国？"
  magicunion.1142.a:0"邀请夜莺之国加入阵营"
  magicunion.1142.b:0"傀儡夜莺之国"
  magicunion.1142.c:0"吞并夜莺之国"

  magicunion.1143.t:0 "收编军队？"
  magicunion.1143.desc:0 "我们需要夜莺之国的军队吗？"
  magicunion.1143.a:0"全部收编"
  magicunion.1143.b:0"解散它们"

  magicunion.1144.t:0 "收编将领？"
  magicunion.1144.desc:0 "我们需要夜莺之国的将领吗？"
  magicunion.1144.a:0"收编她们"
  magicunion.1144.b:0"让她们退休"
  
  magicunion.1145.t:0 "独眼猫猫？"
  magicunion.1145.desc:0 "你看到了一只猫猫，它有着一只蓝色的大眼睛，你可以感受到它身上有着一股奇异的能量。"
  magicunion.1145.a:0"猫猫~ 摸摸~ "
  magicunion.1145.b:0"好可怕！还是离远点！"

  magicunion.1146.t:0 "独眼猫猫！"
  magicunion.1146.desc:0 "猫猫突然开口说话了，而且是人类的语言，它表示如果你能给它一些政治点，2年后，他会给你1.3倍的回报。\n\n你很好奇猫猫要政治点做什么，与此相比，猫猫口吐人言已经不值得惊讶了。"
  magicunion.1146.a:0"给他200政治点"
  magicunion.1146.b:0"给他400政治点"
  magicunion.1146.c:0"给他800政治点"
  magicunion.1146.d:0"好怪！还是算了吧！"

  magicunion.1147.t:0 "独眼猫猫~"
  magicunion.1147.desc:0 "在2年之后，猫猫如期归来，让你得到了说好的政治点。\n\n呃……不要去假设这是一个怎样的画面……\n你只是想要试图尝试理解你所遇到的事情，就已经感到了理智在崩裂，灵性在示警，甚至似乎看到了一些若隐若现的赤红色的泡沫。有些事情，你不需要知道的太清楚，也不该知道..."
  magicunion.1147.a:0"猫猫~ 可爱~"

  magicunion.1148.t:0 "战争已经无望？"
  magicunion.1148.desc:0 "夜莺之国与魔法少女联盟的部队已经击溃了我们的防线，她们要求我们投降。要我们交还夜莺之国的领土，并成为魔法少女联盟的傀儡国。"
  magicunion.1148.a:0"没办法了，投降吧。"
  magicunion.1148.b:0"白日做梦！"

  magicunion.1149.t:0 "边境难民？"
  magicunion.1149.desc:0 "随着南方战事重新开始，大量的难民正在涌向我们的边境，她们为了躲避战争，拖家带口的来到了我们的边境，试图进入我们的国家，因为战争的逼近，和她们的政府对赤匪的可怕宣传，她们想要冲进我们边境的欲望十分强烈。如果我们不使用极端手段，边境关卡随时都可能被难民冲破。"
  magicunion.1149.a:0"集结军队\n————§G 拦住她们！！§!————"
  magicunion.1149.b:0"我们无法阻止..."
    
  magicunion.1150.t:0 "魔法少女重建白教区"
  magicunion.1150.desc:0 "魔法少女联盟正在进行白教区的重建工作，但是由于这片地区的复杂环境，与我们的边界有许多重合的部分，魔法少女联盟期望我们可以准许她们在这片区域内行动的许可。"
  magicunion.1150.a:0 "当然可以"
  magicunion.1150.a:0 "让她们哪来的回哪去"

  magicunion.1151.t:0 "持久的内战"
  magicunion.1151.desc:0 "连年的内战让魔法少女们艰难应对，人们相信晓美焰盟主已经做到了她所能做到的最好了，但是有些谣言传闻，说是军部的将领级魔法少女们试图故意延长战争来增加她们的地位。当然，我们伟大的英明领袖晓美焰盟主否认这种说法。"
  magicunion.1151.a:0"显然，晓美焰盟主需要人民的更多支持才能赢得这场内战！"
  
  magicunion.1152.t:0 "神滨圣女之谣"
  magicunion.1152.desc:0 "在里见灯花的科学部的努力下，成功将神滨圣女之谣的力量附着在了麻美学姐身上，使其拥有了远超正常魔法少女的强大力量。\n\n可惜的是，这种成功是难以复刻的，其他魔法少女并不能驾驭这些本不属于魔法少女的力量，如果强行进行附身只会遭到反噬而失去理性。"
  magicunion.1152.a:0"圣洁的麻美学姐"
  
  magicunion.1153.t:0 "魔女之夜的风暴"
  magicunion.1153.desc:0 "我们试图傀儡魔女之夜的一切努力都白费了，魔女之夜没有屈服于我们的意志，她的风暴在无差别的攻击任何人。"
  magicunion.1153.a:0"显然，没人可以驾驭风暴..."
  
  magicunion.1154.t:0 "魔联邀请我们加入圣杯阵营"
  magicunion.1154.desc:0 "在魔法少女联盟加入圣杯王国的阵营之后，她们开始试图完成对南美洲的掌控，如今她们邀请我们一同加入圣杯王国。"
  magicunion.1154.a:0"当然，我们很乐意加入胜者组。"
  magicunion.1154.b:0"圣杯？我们和那帮资本家不熟。"
  
  magicunion.1155.t:0 "继续研发自动机？"
  magicunion.1155.desc:0 "我们成功联系到了欧美的专家，她们愿意帮助我们研发适合南美战斗环境的新型的自动机，但是这也将会消耗我们的帝国潜力，使得我们将无法再研发其他路线。"
  magicunion.1155.a:0"自动机就是未来的战场之王！"
  magicunion.1155.b:0"坦克才是货真价实的战场之王！"
  magicunion.1155.c:0"我们还是看看战术吧。"

  magicunion.1156.t:0 "辉煌时代的遗产"
  magicunion.1156.desc:0 "……"
  magicunion.1156.a:0"战争机器们，欢迎重新回到战场。"

  magicunion.1157.t:0 "辉煌时代的遗产"
  magicunion.1157.desc:0 "……"
  magicunion.1157.a:0"战争机器们，欢迎重新回到战场。"

  magicunion.1158.t:0 "辉煌时代的遗产"
  magicunion.1158.desc:0 "……"
  magicunion.1158.a:0"战争机器们，欢迎重新回到战场。"
  
  magicunion.1161.t:0 "建制派取胜"# 焕然一新的盟主大选 全新的盟主大选
  magicunion.1161.desc:0 ""
  magicunion.1161.a:0"七海八千代"#（§C民主的未来§!）
  magicunion.1161.b:0"和泉十七夜"#（§R美好的前途§!）
  magicunion.1161.c:0"巴麻美"

  magicunion.11611.t:0 "盟主大选"# 焕然一新的盟主大选 全新的盟主大选
  magicunion.11611.desc:0 ""
  magicunion.11611.a:0"七海八千代"#（§C民主的未来§!）
  magicunion.11611.b:0"和泉十七夜"#（§R美好的前途§!）
  magicunion.11611.c:0"巴麻美"

  magicunion.1165.t:0 "魔联请求推迟战争"
  magicunion.1165.desc:0 "魔法少女联盟注意到了妖精中盛行的复仇主义，但是考虑到战争带来的风险与代价，当前情况下进行战争可能造成更严重的后果，所以魔法少女联盟建议暂且搁置仇恨，将战争推迟。"
  magicunion.1165.a:0"少女们说得对"
  magicunion.1165.b:0"生命不息，复仇不止！"
  
  magicunion.1168.t:0 "§R瓦尔哈拉社战败了...§!"
  magicunion.1168.desc:0 "可怕的消息自中美洲传来，那些有神论共产主义者战败了，她们的神社与一切红军的据点都已经被魔女教廷占领，一切都完了，看来她们所信仰的神并没能拯救她们，当地剩余的共产党员们正在通过运输船试图逃离那个绝望的战区，但是大量的失魂怪物在疯狂的追杀她们每一个人。\n幸存者在无线电中告诉我们，击败她们的是一个极具野心且强大残暴的魔女，她想要光复曾经的古老教国，吞并整个中南美州，一切生灵都会成为她掌中的玩物。她们逃不掉，我们，§R也逃不掉...§!"
  magicunion.1168.a:0"但是，§R红旗将飘扬到我们生命的最后一刻！§!"

  magicunion.1169.t:0 "向军团复仇！"
  magicunion.1169.desc:0 "瓦尔哈拉社已经完了，如果想要实现南美洲的共产主义事业就只能靠我们自己了。"
  magicunion.1169.a:0"§R进攻！进攻！§!"
  magicunion.1169.b:0"不到时候"

  magicunion.1170.t:0 "丛林妖精正在大举北上"
  magicunion.1170.desc:0 "可靠的情报，中美洲的妖精们正在大举北上进攻阿德莱希帝国，而莉兰迪亚的白匪们也加入了其中。现在可能是我们插入战局的最好时机。"
  magicunion.1170.a:0"§R进攻！进攻！§!"
  magicunion.1170.a:0"先让她们鹬蚌相争。"
  
  magicunion.1171.t:0 "§R丛林妖精正在准备战争§!"
  magicunion.1171.desc:0 "那些长期居住在丛林的魔法少女们传来了消息，圣塞莉母巢的虫母正在准备一场针对阿德莱希的复仇战争。\n如果我们现在插手，或许还有机会让她们停下。"
  magicunion.1171.a:0"§R别管她们§!"
  magicunion.1171.b:0"劝她们停下"

  magicunion.1172.t:0 "§R阿德莱希计划暗杀虫母§!"
  magicunion.1172.desc:0 "我们的情报部门传回消息，阿德莱希帝国派出了一支精锐小队前去刺杀虫母。如果情报属实，那么丛林的守卫很可能无法保障虫母的安全。"
  magicunion.1172.a:0"派出我们的特遣队去保护虫母"
  magicunion.1172.b:0"§R只通知妖精们就可以了§!"

  magicunion.1173.t:0 "§R虫母的生命受到威胁？§!"
  magicunion.1173.desc:0 "一支全副武装的魔法少女特遣队到达了丛林，她们声称虫母的安全正受到极大的威胁，于是她们试图参与虫母的安全保卫工作。"
  magicunion.1173.a:0"当然可以，让魔法少女们住进虫母的巢穴。"
  magicunion.1173.b:0"§R拒绝她们，丛林的安全无须担心。§!"
  
  magicunion.1176.t:0 "阿德莱希与妖精爆发战争"
  magicunion.1176.desc:0 "阿德莱希帝国与妖精爆发了战争，我们作为由人类领导的军事组织，应该对同为人类国家的阿德莱希做出一些支援。"
  magicunion.1176.a:0"这符合我们的利益"
  magicunion.1176.b:0"我自己还不够用呢"

  magicunion.1177.t:0 "军团送来了军事援助"
  magicunion.1177.desc:0 "军团送来的军火通过运输船抵达了我们的港口，这将有效缓解我们军事上的压力。"
  magicunion.1177.a:0"太好了，人类就应当团结互助。"
  
  
  magicunion.1178.t:0 "我们的虫母怎么§R那么坏§!"
  magicunion.1178.desc:0 "我们的虫母竟然向魔法少女联盟宣战了，难道她不知道高级妖精都有一半以上的魔法少女血统，有魔法少女血统的妖精比没有魔法少女血统的妖精要多十倍甚至九倍！甚至库拉莉亚有90%的魔法少女血统，而库拉莉亚的女儿更是有95%的魔法少女血统，你怎么能打魔法少女联盟呢。\n要不是魔法少女联盟的帮助，丛林早就被阿德莱希扬的灰都不剩了。甚至你要变弑杀妖精，魔法少女都想护着你，你怎么能打魔法少女呢！\n天呐，简直无法接受！\n不止高级妖精们十分离谱且不可思议的用理论上不可能的用自己的意志力拒绝了这项命令，甚至就连没有自我意志的低级妖精们在血脉或是其他原因的影响下都奇迹般的拒绝执行虫母的命令！"
  magicunion.1178.a:0"我们的虫母怎么§R那么坏§!"
  
  
  magicunion.1180.t:0 "魔联的毁灭"
  magicunion.1180.desc:0 "魔法少女联盟，在名为魔女之夜的超级风暴之中遭到了毁灭性的损失，建立的各个城市已经被风暴摧毁，完全丧失国家工业能力，各种伴生性灾难在各处发生。暴雨和疾疫正在肆虐，人员损失无以计数。魔联大议会目前已经解散，剩余的幸存者们在废墟之中试图重建她们的家园。目前整个地区处于无政府状态，只有幸存的魔法少女们在尝试维护当地残存的秩序。"
  magicunion.1180.a:0"大自然的力量令人敬畏"
  
  magicunion.1182.t:0 "起始的路标"
  magicunion.1182.desc:0 "从失败的情绪中挣脱出来后，晓美焰的身边再也不是孤身一身，至少，鹿目圆，还在自己身边。至少这一次，她与她能相互依偎。\n她曾想过，与圆远走高飞，彻底离开这场死局，但想法浮出，便被自己狠狠掐灭。没有别的原因，只是因为，她是鹿目圆，于是，她便不可能做出这种决定\n“我相信你，焰酱，如果那场风暴避无可避”\n“但我还是想，去救下更多的人。”\n是啊，她就是这样，晓美焰记忆中的鹿目圆，就是这样。"
  magicunion.1182.a:0"我知道，我会一直在你身边。"
  
  magicunion.11821.t:0 "不也挺好吗"
  magicunion.11821.desc:0 "随着权利移交完成，晓美焰放下了她的权柄与职责，现在她可以不用再每日每夜的批阅那些文件与战报了，再之后，或许议会将会举行选举，选出一个合法的民选盟主，然后带领这个国家走上一条新的道路，前往新的未来。\n\n但是无论怎样，晓美焰不再关心了。现在需要注意的就是要先多喝点水，然后..."
  magicunion.11821.a:0"今晚去小圆家里过夜"
  
  magicunion.1183.t:0 "恍如昨日"
  magicunion.1183.desc:0 "质疑，争吵，哭喊，哀悼……旧日的残响涌入脑中，晓美焰自桌前惊醒，细密的汗珠流淌全身，伸手，手在颤抖；张嘴，却发不出一点声音。\n是的，再一次，又一次，输的很彻底，败得很狼狈。\n“又，没救下她……”泪滴涌出，滑过脸颊，沉重的砸在双手中央。时钟滴答，震得她心脏生疼。\n“不行，振作起来，晓美焰，这次，这次一定要……”晓美焰颤抖着站起身——是啊，她现在以及没有时间掩面哭泣，终末的脚步不会待她哭泣，她还在等着自己，鹿目圆——需要她……\n“小焰，怎么了吗？”声音传出，啊，这声音，是她朝思暮想的，烙在记忆深处的，绝不会认错的——\n“圆……？”\n来不及拭去泪痕，她狼狈的样子被自己所爱的人看的一清二楚，震惊中，焰双腿一软，强撑着站起来的身子作势要栽倒。\n但好在，圆接住了她，圆将她拥入怀中。“又做恶梦了吗，焰酱？但是不用怕哦——”\n“我就在这里哦，哪儿也不会去。”\n轻语直插心脏，情感再也无法遏制——"
  magicunion.1183.a:0"再陪我一会儿，就一会儿……"
  magicunion.1183.b:0"抹掉眼泪……\n（§R警告：繁杂困难§!）"

  magicunion.11831.t:0 "恍如昨日"
  magicunion.11831.desc:0 "晓美焰再次惊醒。在梦中她又一次将枪口指向所爱之人，又一次没能救下那个泪眼婆娑的她。她已经记不清这是第多少次了，几十次上百次还是几百次，已经记不清了，每次轮回的记忆混杂在一起，早已变成了混沌的色彩。但至少现在她和小圆都还活着，是的她还活着，还活着，浑浑噩噩的再次推开房门，却迎面撞见了迎面而来的她...\n‘小焰大家都很担心你，因为最近的事情...’少女稚嫩的面容带着担忧的色彩，担忧...或者说因为自己最好的朋友被议员们恶意中伤，几乎要被打上了邪恶的独裁者的标签。\n随着战争结束，议会中的许多人担心军部会夺取权利架空议会。她们开始急切的催促军队将国家的权力交还给议会。\n为此，她们找了各种各样的理由，嗯，没人想听那些陈词滥调。总之，现在选择权在军方手中，或者说，在晓美焰的手中。\n抱着怀中的少女，晓美焰低声的做出了抉择。"
  magicunion.11831.a:0"亦如往常"

  magicunion.1184.t:0 "玛吉斯之翼拒绝服从"
  magicunion.1184.desc:0 "玛吉斯之翼的独立性一直令议会感到担忧，在今天一个灾难性的消息终于还是爆发了，玛吉斯之翼拒绝终止§FEVE计划§!，她们的部队封锁了前往北方三省的交通要道，宣称任何忠于议会的军事力量都不得进入该地区，这已经是明目张胆的忤逆了。一旦局势激化这将导致内战的硝烟再次升起。\n\n而更可怕的是，不信任议会的人并非只有玛吉斯之翼，我们的军队之中也有大量的将领和中下层军官不信任议会，甚至大多数士兵都觉得议会是令人失望的。更加令人感到悲哀的是，就连我们议会内部的议员们，都在互相提防着彼此..."
  magicunion.1184.a:0"我们将支持§C魔联议会§!，就是这样。"
  magicunion.1184.b:0"我们支持§F玛吉斯之翼§!\n（§R未完成，不要点§!）"
  
  magicunion.1185.t:0 "建制派赢得选举"
  magicunion.1185.desc:0 "哪怕战争结束了，玛吉斯之翼的问题也已经得到了解决，但是我们的议会仍然难以选出合法的盟主，没有任何人能得到多数人的支持，每个势力都只会支持自己的候选人。而任何派系的候选人的代表人成为盟主都会导致其他派系无法接受的情况出现。\n而为了结束这尴尬的局面，也为了避免1935年的悲剧再次发生。所有派系最终选择进行有限的合作，重新将各派系中的一部分人重组为了中立的建制派成员，她们不会做冒进或分裂行为，回避一切争议，从不就任何事情发表任何坚决观点的，可靠，人缘好，会变通，不离谱，无债务，议会中所有派系都能容忍的，懂的接受引导的建制派。然后建制派对大家进行了大量漂亮的承诺，而结果也是立竿见影的，议会中的建制派成功的得到了大多数人的支持，而现在无论谁成为了盟主，都没法反对建制派的力量了。\n\n毫无疑问，这是议会的胜利。"
  magicunion.1185.a:0"为了魔法少女大议会"
  
  magicunion.1186.t:0 "统帅部会议"
  magicunion.1186.desc:0 ""
  magicunion.1186.a:0"积累军队经验"
  magicunion.1186.b:0"提升将领指挥能力"
  magicunion.1186.c:0"研究灵想兵装"
  magicunion.1186.d:0"研究现代飞机"
  
  magicunion.1187.t:0 "内政部指导方针"
  magicunion.1187.desc:0 "为了魔法少女联盟的运作，亦是为了节省晓美焰盟主的时间和精力，不能每件事情都来请示晓美焰盟主，所以内政部需要一套符合新时代的运作方针，让公务员们在应对问题时得以有章程可循。\n如果我们使用严格的配给制度，就可以节省出一些资源来集中力量做事。\n但也有人指出，要给予市场一些宽松的量化政策才能更符合民意。\n但是无论如何，编写内政部方针和修订相关事项所需要花费的这些日子，都将是内政部的不眠之夜。"
  magicunion.1187.a:0"制定严格的配给制度"
  magicunion.1187.b:0"制定宽松的温和调控"
  

  magicunion.1188.t:0 "织莉子被捕"
  magicunion.1188.desc:0 "逮捕一个有未来视的预言家，这并非易事。为此动用了大量的特工，干员，治安官，以及特遣队和预言系魔法少女。\n\n并且，最重要的是，在把忽悠织莉子的QB暴打了一顿之后，我们的谈判专家会用Doppel半魔女化理论，来说服织莉子放弃她那可怕的想法，鉴于织莉子在成为魔法少女期间所做的种种犯罪行为，她在很长的时间里都得为政府效力以偿还她犯下的罪行。\n而对于认识织莉子的人来说，织莉子就像是突然失踪了...事后当地治安分局接到了织莉子家人的报案，请求寻找她们失踪的女儿，当然，没有后续亦没有调查..."
  magicunion.1188.a:0"我们不会公开她的罪行\n人们也不需要知道事实的真相..."
  magicunion.1188.b:0"而魔法少女\n永远都是凡人的守护者..."
  MGU_magicunion_1057_MGU_flag:0 "§R织莉子已经成为魔法少女§!"

  magicunion.11881.t:0 "魔法少女遇袭事件频发"
  magicunion.11881.desc:0 "近期有报告显示，有多起魔法少女遭到了袭击，有证据显示犯罪者可能同样也是一个魔法少女，且这些案件可能是同一个犯人所为，治安官目前正在集结刑侦专家进行搜查，但是仍然没能抓到犯人。\n\n晓美焰盟主看着桌子上的报告，这自然是织莉子做的，她的魔法能力，未来视和神谕光束，在针对特定人员袭击方面有着独特的优势。如果早一点处理织莉子的事情，那些受害者就不会遇到这可怕的事情了，但是现在事情已经发生了。\n依靠治安局想要抓到一个有未来视的将领级魔法少女，怕是不可能的，但是只要出动魔联特遣队还是可以抓到她的。\n但是现在有另一个问题，假设说，我们知道了一个人会在未来犯罪，那么是否应该用未来的事情，来定现在的罪？"
  magicunion.11881.a:0"总之，让特遣队出动吧。"

  magicunion.11882.t:0 "魔法少女遇袭事件频发"
  magicunion.11882.desc:0 "近期有报告显示，有多起魔法少女遭到了袭击，有证据显示犯罪者可能同样也是一个魔法少女，且这些案件可能是同一个犯人所为，治安官目前正在集结刑侦专家进行搜查，但是仍然没能抓到犯人。\n治安局正在继续追查此事。\n"
  magicunion.11882.a:0"相信民主的力量。"

  magicunion.1190.t:0 "深夜的办公室"
  magicunion.1190.desc:0 "在见泷原的盟主办公室里，在魔法水晶的映照下，晓美焰冷漠的批阅着文件，签署着一道道的政令。办公桌上堆叠的文件似乎是个能吞没心智的猛兽，似乎永远也处理不完，如果能把这些文件全丢给别人处理就好了，就连凡人也有每个月2天的休息时间，盟主也该有休假时间对吧。\n门开了，可爱的鹿目圆抱着一摞新的文件走了进来，放在了晓美焰的办公桌上，然后又拿来了一杯浓缩咖啡放在了小焰的办公桌上。闻着咖啡浓郁的香味，晓美焰那疲惫不堪的精神稍微有了些恢复。\n拿起咖啡抿了一口，热度与糖分都刚刚好，能感受到小圆一定很用心。好想和小圆出去玩，想要和小圆去公园的草坪里晒太阳，想要和小圆去租界的店铺里购物，想要和小圆去广场上去散步，想要和小圆去沙滩看落日，想要和小圆去卧室的床上……\n但是晓美焰仍然坐在那初代盟主所留下的那把黄金椅子上批阅着文件，前代盟主也是坐在这里日以继夜的处理政务，过度的操劳是否也加快了盟主的魔女化？谁知道呢，魔法少女本就是短命的职业。晓美焰突然停笔，意识到自己写错了什么，然后将批阅划掉，重新写上了正确的文字。晓美焰一张一张的看着文件上的记述的文字，与自己在过去与曾经的未来中的记忆进行对比，然后写下需要整改的批文。\n小圆想要说些什么，但是又担心打扰到小焰的思绪。临走的时候，还是决定说‘小焰，你已经三天没有睡觉了，休息一下吧...’"
  magicunion.1190.a:0"凡人们还需要我，我不能休息..."
  magicunion.1190.b:0"嗯...稍微休息一会吧..."

  magicunion.1191.t:0 "议会演讲"
  magicunion.1191.desc:0 "晓美焰已经亲自前大议会进行演讲，议会的顽固派还认为玛吉斯之翼会站在她们那边，但实际上，尽管里间灯花在过去在军方和议会之间保持着‘中立’，但她们也只是看似的‘中立’而已，早在最初加入忠诚派的阵营时，玛吉斯之翼就已经是军方或者说晓美焰的秘密支持者了。\n毫无意外的，玛吉斯之翼的领导人里见灯花，在会场演讲台上的‘临阵倒戈’让议会顽固派的颜面荡然无存，甚至在议会派内部都引起了轩然大波，有议员甚至当场站起来对玛吉斯之翼大声呵斥，然而在现场反对晓美焰的声音都变成了一团混乱且无力的杂音。"
  magicunion.1191.a:0"与记忆之中...分毫不差。"

  magicunion.1192.t:0 "选举前夕"
  magicunion.1192.desc:0 "民意，军力，权力，甚至摆弄人心的手段，大议会没有一人没有一项能与军方的领袖，那个恶魔一样的晓美焰所抗衡。倘若真的破釜沉舟，调集忠于议会的力量进行武装斗争，恐怕也是以卵击石。如今军方大多数的将领级魔法少女都聚集在神滨市，且处于高度警戒的状态，议员们如果敢武力反抗只会被军方雷霆镇压，还会失去所有的政治权力。\n在晓美焰咄咄逼人的现今，大议会准备进行一个折中的方案，让护民官鹿目圆成为魔法少女来接替盟主之位，这样即使暂时的交出权力也可以通过政治手段进行合法的夺回。\n但摆在她们面前的情况是，那个恶魔，那个晓美焰打算亲自竞选魔联的盟主，甚至原本保持中立的玛吉斯之翼也完全投靠了晓美焰的阵营。\n但是，即便如此，大议会也要动用全部的政治力量来进行选举上的斗争，以争取在选举上击败晓美焰，只要选票的结果偏向议会，那个恶魔就无法成为魔联的合法盟主。要知道，那个恶魔甚至还可能和共党份子有瓜葛，真不敢想一旦她成为了盟主，议员们和她们的支持者们的日子该怎么过。"
  magicunion.1192.a:0"民主的终焉？"

  magicunion.1193.t:0 "里见灯花的研究"
  magicunion.1193.desc:0 "我们曾经与里见灯花签订过协议，我们许诺会支持她的研究，重启Doppel计划，完成她的伟业。如今，到了需要兑现的时刻了。如果计划得以完成，魔法少女们或许就不再需要依靠悲叹之种来延续生命。Doppel半魔女化技能将会为魔法少女给予新的可能。"
  magicunion.1193.a:0"适度的..."
  magicunion.1193.b:0"我们不能再等了"

  magicunion.1194.t:0 "EVE系统上线"
  magicunion.1194.desc:0 "因为是被愿望拯救的生命，所以不害怕奉献给谁。在梦中，她一边打盹，一边等待着“觉醒”的时刻。少女们所编织，继承的愿望的代价，是希望还是绝望…"
  magicunion.1194.a:0"期待已久..."

  magicunion.1195.t:0 "要自由要民主"
  magicunion.1195.desc:0 "近期，在魔联各个城市，发生了有计划有组织的抗议，人们要求自由民主，要求晓美焰下台，要求通过民主投票选出新盟主。我们的分析官认为，一定有某些组织在背后支持这场抗议运动。如果我们放任不管，这场抗议可能会长期的继续下去。但是反过来说，我们的治安局已经整装待发，就等你一声令下就可以让她们消失。"
  magicunion.1195.a:0"好，把她们上市！"
  magicunion.1195.b:0"让她们闹吧..."

  magicunion.1196.t:0 "质量还是数量？"
  magicunion.1196.desc:0 "我们的兵工厂可以采取两种方案，要更好的质量还是更多的数量。\n一部分魔法少女认为，我们必须为每一个上战场的士兵负责，一个低质量的步枪，就像低质量的魔法杖一样不可接受，我们需要为每一个凡人士兵的武器质量负责！\n而另一部分人魔法少女认为，完美无缺的武器被高估了，数量才是一切的根本，只有每个凡人士兵都有一把枪，她们才能获得捍卫国家的权力！"
  magicunion.1196.a:0"质量更重要！"
  magicunion.1196.b:0"数量更重要！"

  magicunion.1197.t:0 "火炮还是装甲？"
  magicunion.1197.desc:0 "如果我们有了自己的坦克，在坦克设计方面，既要又要的方针肯定是行不通的，那只会让成本高到无法接受的地步。我们只能在火炮与装甲方面二选其一。"
  magicunion.1197.a:0"更好的火炮"
  magicunion.1197.b:0"更强的装甲"

  magicunion.1198.t:0 "科研方向？"
  magicunion.1198.desc:0 "我们可以尽可能的去追赶世界强国的先进科学技术，又或者去研发一些特殊的项目。"
  magicunion.1198.a:0"常规科研"
  magicunion.1198.b:0"特殊项目"

  magicunion.1199.t:0 "清理腐化"
  magicunion.1199.desc:0 "大量腐败的物质伴随着暴雨季和瘟疫在丛林中暴涨横生，现在我们有时间和能力来清理掉这些危险的物质。让丛林变得更加安全和清洁。但是，在清洁的过程中，在净化过程中严禁少女们将被腐化的物体带走，哪怕是很想要也不行，更不要用腐败物质做奇怪的事情，不许找任何理由和借口，哪怕是有腐败抗性的战斗修女也不允许，被腐化的鱼鱼是不能用的！"
  magicunion.1199.a:0"清新的丛林"

  magicunion.1200.t:0 "广义魔法少女论"
  magicunion.1200.desc:0 "而对于魔法少女来说，妖精们都拥有可爱的美少女身体，就会魔法的美少女毫无疑问就是魔法少女。而那些和妖精们住在一起的丛林生物，是否可以算……魔法少女的朋友？"
  magicunion.1200.a:0"我们当然是一家人"

  magicunion.1201.t:0 "接入丛林网道"
  magicunion.1201.desc:0 "在对丛林网道进行合理的扩张之后，我们特制的运载车辆可以开入其中，利用地下网道进行物资输送。而且妖精们也喜欢收留魔法少女们在洞穴里过夜，地下丛林的洞穴很大，当魔法少女运送物资的时候，送累了可以直接在里面睡，没问题的。虽然有些魔法少女认为，这种行为可能有点奇怪，但是妖精们表示，去洞穴里过夜还可以喝发酵的果汁哦，有什么想吃的小零食都可以拿，甚至洞穴深处还有好康的，这真是太好了，而且这发酵的果汁也很好喝呢甚至比啤酒的劲都大呢，对吧...对吧..？.呃？？？"
  magicunion.1201.a:0"才喝了两口就倒下了真是逊呢。"

  magicunion.1202.t:0 "繁荣兴盛"
  magicunion.1202.desc:0 "为了我们与妖精之间永久的友谊，我们将帮助丛林进行额外的建设，使用人类的技术与产物帮助妖精们发展她们的领地。妖精们的地区将会与魔法少女联盟共享繁荣的美好生活。我们将带领丛林走向繁荣兴盛。"
  magicunion.1202.a:0"更大的巢群"

  magicunion.1203.t:0 "夜莺之国魔法大会"
  magicunion.1203.desc:0 "经过一系列的并不复杂的程序，我们的一些魔法少女们加入了夜莺之国的金伯利魔法学院，我们相信这可以更好的拉进两国之间的文化与魔法交流。学院为来自魔联的学生们举办了一场欢迎会，双方都各自表演了自己所擅长的魔法，夜莺之国向我们展示了她们的死灵魔法，可以将一个弱小的活人志愿者，直接变为强大的亡灵生物。也是依靠着这些强大的亡灵战士，索拉娜女王，才能够夺下莉兰迪亚城，如今索拉娜已经成为了洛薇妮娅的新女王。\n在欢迎会的末尾，学院的领导表示由于全国的部队都被索拉娜带走了，失去压制的死者们再次躁动了起来，那些在殖民战争时期被屠杀的灵魂们，哪怕过去了数百年也没有放下那时的怨恨。所以现在魔法学院的学生们也得负责维护城市的治安，询问我们的留学生们是否也可以提供一些帮助？"
  magicunion.1203.a:0"即便出国留学也逃不掉本职工作..."

  magicunion.1204.t:0 "工作制"
  magicunion.1204.desc:0 "通过与圣杯王国的接触，我们了解到世界早已今时不同往日。落后的农奴制度与长工制度已经在文明世界普遍废除\n明确工人工时，不仅可以保障工人的基本权益，也可以让更多人有更多时间进行消费，从长远来看，这也有利于我们的经济发展。\n现在，我们的问题只剩下了：究竟是制定更倾向工人的8小时工作制还是更倾向雇主的12小时工作制——"
  magicunion.1204.a:0"8小时工作制！"
  magicunion.1204.b:0"12小时工作制！"

  magicunion.1205.t:0 "军方参政？"
  magicunion.1205.desc:0 "巴麻美将军的办公桌上摆满了联盟将军们寄送给她的信件。将军们的要求千奇百怪，可是归根结底却是对于权力的留恋。\n军队已经守护联盟数十载，在可见的未来，军队还会继续守护联盟。我们不能失去他们的支持，可是，给予他们过大的权力却必然危急到脆弱的民主制度。巴麻美将军轻轻叹了口气，如今她必须为联盟做出选择——"
  magicunion.1205.a:0"谈合作可以，但不要越界了！"
  magicunion.1205.b:0"我们离圣杯王国太远，却离敌人太近…"

  magicunion.1206.t:0 "对资源的规划"
  magicunion.1206.desc:0 "如果你以为联盟拥有如此巨大的国土，必然物产丰盛，那你就大错特错了。事实上，联盟大量资源缺乏集中开采，土地与资源集中在地方地主手中。\n现在，我们可以对他们的土地与资源进行集中赎买。只是，或许我们没有那么足够的资金应对这些家伙的漫天要价，不过好在，我们还有一些强制手段——"
  magicunion.1206.a:0"公平的购买！"
  magicunion.1206.b:0"都是我们的！"

  magicunion.1207.t:0 "对待买办份子"
  magicunion.1207.desc:0 "一份由经济部门起草的与财阀合作的新企划已经送到了桌上，作为总统阁下，你大可以大大方方地签下这份协议，享受财阀带来的红利。可你手中的签字笔却在一次又一次地转动——要是签下这份企划，联盟又不知何年何月可以摆脱这些寄生虫的控制，我们的人民会作何感想？可你知道你没有太多时间犹豫下去了，你必须做出决定来。"
  magicunion.1207.a:0"和这群虫豸在一起，怎么搞好国家！"
  magicunion.1207.b:0"还要做生意呢..."

  magicunion.1208.t:0 "敲定联盟政治制度"
  magicunion.1208.desc:0 "在外人看来，魔法少女联盟是一个统一的国家。可若你是一个联盟的普通公民，就会发现联盟内部的各个大区、各个城市甚至各个区县，几乎都在自行其是。\n没有明确的行政区划与政治制度，联盟就是一个松散的部落集合体。行政效率低下，政令不出神滨市已经成为常态。\n我们必须纠正这个错误，对联盟进行彻底的改革。当然，我们也有分权与集权两个方案可以选择。"
  magicunion.1208.a:0"分权才是联邦！"
  magicunion.1208.b:0"集中有利于团结！"

  magicunion.1209.t:0 "召开平等会议"
  magicunion.1209.desc:0 "当议员们陆续走进会场，看到会场上高挂着的“联盟第一届平等会议”的横幅时，他们的脸上都或多或少浮现出不可思议的神情。几十年来，诸如“平等”、“福利”等等议题，从来不是议会讨论的内容。议员们也习惯了自己享受，民众受苦受难的生活。当他们看到这条横幅时，才勉勉强强地感觉到——有些东西似乎真的在改变。\n讨论开始不久后，会场和谐的气氛很快就被激烈的争吵打破了。只见一位议员叫嚷着从位置上站了起来。\n“够了，你们这些赤匪、共产主义猪，毛都没长齐就想给贱民增加福利了？然后怎么样，联盟破产了，你们就满意了？”\n“有些人怎么说了几句话就着急了？难道是因为给民众增加一点点福利会让你下个月少买一辆进口跑车吗？”另一个议员站起身，冷冷地嘲讽道。\n一石激起千层浪，议员们纷纷站起身，冲着自己的同事开始叫嚷，甚至有议员马上要开始动用魔法进行决斗了。议长眼见会场情况愈发混乱，连忙以她最大的声音终结了讨论，并且宣布投票开始——"
  magicunion.1209.a:0"最终，《增进平等法案》以微弱优势通过了"
  magicunion.1209.b:0"最终，《增进平等法案》被否决了"

  magicunion.1210.t:0 "高级公民？"
  magicunion.1210.desc:0 "自联盟草创，魔法少女们互相联系伊始，我们就意识到了：不是所有魔法少女都有相同的能力和天赋。以实力衡量魔法少女的等级和地位，在联盟内部已经成为了共识。\n那些拥有最强大力量的魔法少女，很自然地成为了联盟的“高级公民”。她们在联盟内部端坐高位，决策国家的一切。而那些魔力低下，缺乏天赋的魔法少女，一辈子都只能待在最低贱的岗位上。\n现在，我们必须做出选择，究竟是否应该废除这种不公，让那些天赋不佳的魔法少女也可以进入联盟最高的决策机关了。"
  magicunion.1210.a:0"社会达尔文主义早该死一死了！"
  magicunion.1210.b:0"那些小崽子连自己都管不好，怎么治理好我们的国家？"

  magicunion.1211.t:0 "民主之心"
  magicunion.1211.desc:0 "圣杯王国因为经济危机的影响，无法给予我们太多的帮助，但是她们愿意派遣一个民主团队，这些民主的官员会指导与管理我们的民主建设。\n我们相信，在这些民主前辈的帮助下，我们的国家一定能发生深刻的变革，让我们的人民获得更多的幸福。"
  magicunion.1211.a:0"让我们带着民主一同出发！"

  magicunion.1212.t:0 "前途光明，道路曲折！"
  magicunion.1212.desc:0 "不论是圣杯王国还是幻想乡共和国，探索民主制度之路都花费了百年有余的时间。如今，联盟既选择走上民主之路，就应该做好打长期战的准备。\n我们虽站在巨人们的肩膀上，却没有良好的基础，一步走错，或许就会让整个联盟跌入万丈深渊。\n但是，这也不是我们止步不前的理由。看看我们的人民，看看她们渴望变革的眼睛吧！"
  magicunion.1212.a:0"不怕慢，就怕站！"

  magicunion.1213.t:0 "强袭魔女模组改造"
  magicunion.1213.desc:0 "从圣杯王国那里，我们了解到，一种新型的魔法飞行器已经被研发。\n这种适合魔法少女的飞行器，必然可以帮助我们在战场上无往不利。\n如果我们对其配置进行调整，可以牺牲空战能力，来获得更加强大的地面轰炸能力。"
  magicunion.1213.a:0"挂载轰炸模组"
  magicunion.1213.b:0"算了"

  magicunion.1214.t:0 "在热带的极北皇女"
  magicunion.1214.desc:0 "安娜从来没想到，自己的有生之年里居然还有机会来到南半球。要不是自己丢失了故国，或许这种事情永远不会发生吧？安娜微微掀起头上带着的大草帽，看着面前阳光闪耀，波光粼粼的海面，听着海鸥“吱嘎”的叫声，不禁有点出神。\n“你好，请问您就是——安娜斯塔西娅小姐？”一个怯生生的声音在安娜身后响了起来，安娜看向身后，只见一位身穿粉红色制服的少女正站在自己的身后。\n“是…是的，请问你是？”安娜赶忙转过身打量起眼前的少女来——听说这里的女孩都是魔法少女，这是真的吗？安娜心中好奇，可是却不好直接问出口来。\n“我是总统阁下的助理，听说您来到我国旅游，总统阁下希望我可以陪伴您，以免您迷路了或者遭遇意外。”少女轻轻整理了一下自己的制服，非常诚恳地说道。\n“原来如此——”安娜点了点头，又看向了广阔无垠的大海。既然这次是来度假的，既然这里离故乡如此之远，那我还不如好好玩一玩…"
  magicunion.1214.a:0"好吧，那我就恭敬不如从命了～"

  magicunion.1215.t:0 "民主工厂"
  magicunion.1215.desc:0 "妖精们被击败了，一些爱好民主的人愿意加入我们，新建我们的民主工厂。"
  magicunion.1215.a:0"民主！"

  magicunion.1216.t:0 "民主工厂"
  magicunion.1216.desc:0 "亡灵魔物们被击败了，一些爱好民主的人愿意加入我们，新建我们的民主工厂。"
  magicunion.1216.a:0"民主！"

  magicunion.1217.t:0 "民主工厂"
  magicunion.1217.desc:0 "雇佣兵们被击败了，一些爱好民主的人愿意加入我们，新建我们的民主工厂。"
  magicunion.1217.a:0"民主！"

  magicunion.1218.t:0 "民主工厂"
  magicunion.1218.desc:0 "公社被击败了，一些爱好民主的人愿意加入我们，新建我们的民主工厂。"
  magicunion.1218.a:0"民主！"

  magicunion.1219.t:0 "民主工厂"
  magicunion.1219.desc:0 "白匪们被击败了，一些爱好民主的人愿意加入我们，新建我们的民主工厂。"
  magicunion.1219.a:0"民主！"

  magicunion.1220.t:0 "民主工厂"
  magicunion.1220.desc:0 "帝国被击败了，一些爱好民主的人愿意加入我们，新建我们的民主工厂。"
  magicunion.1220.a:0"民主！"

  magicunion.1221.t:0 "黏菌还是面包？"
  magicunion.1221.desc:0 "吃面包还是吃菌毯，这是个问题。没人喜欢吃菌毯，除了妖精，哪怕是妖精相比起菌毯也会更喜欢面包的。当然并非全都是菌毯，幸好我们国家处于热带的气候，玉米和土豆仍然还会热情的从农田中长出，让我们这落后的农业能够抚平人们的饥饿感，但是我们是不是该让凡人们也能吃上黄油和面包了！又或者，我们仍然要继续勒紧裙带艰辛度日，把资源节省出来以用于更加重要的伟业？"
  magicunion.1221.a:0"我们应当为凡人提供黄油和面包！"
  magicunion.1221.b:0"我们有更重要的事情要做..."
  magicunion.1221_b_txt:0"针对魔女之夜准备值§G+5%§!"

  magicunion.1222.t:0 "出国手续（已弃用）"
  magicunion.1222.desc:0 "晓美焰在国际机场办理登机手续，一架学园都市的大型运输机停在机场上，她那巨大的流线型机身给这个南美洲的机场涂上了一抹科幻的色彩，学园都市的重装士兵正在附近警戒，她们那洁白的全身覆盖式装甲在阳光下的照射下熠熠生辉，手中重型突击步枪就像魔法杖一样流光溢彩，不如说，那些枪械本身就是一种魔法与科技交织的奇术产物。\n晓美焰在机场候机室，时刻带着一个巨大的旅行箱，从不离身，并使用了身为前任将军的权柄，与她的威望，强行绕过了海关的检查。\n海关的检察员只能无奈的选择放行，但还是问了一句'晓美焰将军，请问您的箱子里是什么重要的东西吗？'，带着箱子准备走进机舱的晓美焰停下了脚步，回应道："
  magicunion.1222.a:0"是最重要的东西。"
  magicunion.1222_a_txt:0"§1晓美焰离开魔法少女联盟§!"
  
  magicunion.12221.t:0 "驻圣杯大使"
  magicunion.12221.desc:0 "为了与圣杯王国建立更加亲密的关系，我们需要像其他正常国家那样，正式的向圣杯王国派出外交大使。\n之前有些议员在会议中提出了一个独特的大使人选——晓美焰。在魔联内战战争结束后，晓美焰向议会交还了权力，她现在名义上已经没有了任何实权，整天往小圆家里跑，长期在小圆家里过夜，还主动包揽了家务以及为小圆洗各种衣物。对于议会的安排晓美焰表示她愿意接受，但是要带小圆一起去，而美树沙耶加将军在议会对此表示强烈抗议。\n但是无论是说驻圣杯大使的重要性，还是说晓美焰的声望对议会的威胁性。让晓美焰前往伦敦赴任都是十分甚至九分的合适。\n作为民主的盟友，我们的朋友圣杯王国愿意为大使及其团队提供优越的生活条件。"
  magicunion.12221.a:0"那就这样决定吧。"
  magicunion.12221_a_txt:0"§1晓美焰§!与§P鹿目圆§!将前往§L圣杯王国§!"
  
  magicunion.12222.t:0 "异乡异客"
  magicunion.12222.desc:0 "伦敦，即使在黑色星期一发生后，这个城市仍然是整个欧洲乃至世界跳动的心脏。泰晤士河畔犹如血管般纵横交错的街道上，行人络绎不绝，汽车呼啸而过。在如此喧闹与繁华的世界里，人们当然不会在意两个坐在车站的椅子上等待着电车的女孩。\n“唔，焰酱，车怎么还没来呢？”依偎在黑发女孩肩上的粉发女孩轻声懒懒地嘟囔了一句。\n“应该很快就回来了…另外，就算是累了，也没必要靠在我的肩上吧？你的口水都快流下来了。”黑发女孩略微不满地耸了耸肩。\n“嘿嘿嘿，没办法呀～还是焰酱的肩膀舒服，又软又有安全感呢。而且，天天和那些一脸严肃的大叔说话，还要一直保持笑容什么的，哇，真的好累呀！焰酱，你到底是怎么坚持下来的？”\n“我吗？”黑发女孩凝视着对方的在阳光下熠熠生辉的粉色瞳眸，没有继续说下去，可她的内心却早已有了答案。"
  magicunion.12222.a:0"正是因为有§P你§!在§1我§!的身旁，所以才能坚持下去呀。"
  
  magicunion.12223.t:0 "大使馆的讯息"
  magicunion.12223.desc:0 "伦敦大使馆发来讯息，圣杯王国已经从动荡中恢复，作为民主的旗帜与灯塔，她们愿意帮助我们这新兴的民主国家度过这段困难的时光。\n为了更好的建设我们民主的国家，我们确实需要一些外界的帮助。而我们只需要付出少许的资源与签订几个民主的协议。\n"
  magicunion.12223.a:0"需要建设民用工厂。"
  magicunion.12223.b:0"需要建设军用工厂。"
  magicunion.12223.c:0"需要民用消费品。"
  magicunion.12223.d:0"需要行政指导。"
  
  magicunion.12224.t:0 "来自南美的外交官"
  magicunion.12224.desc:0 "南美洲的魔法少女联盟传来讯息，她们已经摆脱了内战的阴影，重新回到了民主的道路，期望与圣杯王国建立更加亲密的关系。"
  magicunion.12224.a:0"听起来是好事。"
  magicunion.12224_a_txt:0"§1晓美焰§!与§P鹿目圆§!将来到§L圣杯王国§!"
  
  magicunion.1223.t:0 "审判庭报告：渗透已证实"
  magicunion.1223.desc:0 "在晓美焰盟主的授意下，审判庭特工于今夜证实，公社的游击队正在筹划对我们的渗透袭击。那些莉兰迪亚公社的理想主义者们，为了实现她们的理想已经将数以百万的人拖入战火的深渊，魔联就是下一个，而她们却管这叫拯救。我们的侦查使魔将游走于每一条街道与径巷，治安官将监察每一次货运与调动，特工与密探们无时无刻不在向审判庭输送着一切所需要的情报。\n而我们忠心又高效的杀戮小队遍布整个国家的每一处要害，在这个国家之中，没有人可以违抗晓美焰盟主的意志！"
  magicunion.1223.a:0"没人能在蛛网中隐藏身形。"
  magicunion.1223_a_txt:0"§1公社对魔联的渗透行动将受到反制§!"

  magicunion.1224.t:0 "魔法少女夺取了冰雪镇"
  magicunion.1224.desc:0 "在我们与莉兰迪亚军团交战的时候，魔法少女与那些溃败的雇佣军们做了一笔交易，已经接管了冰雪镇，在我们的赤卫队抵达时，魔法少女的部队已经挖好了战壕，为首的魔法少女将她那流光溢彩的灵装利刃插在地上傲慢的命令我们的部队停止前进。无论如何，现在冰雪镇已经是魔法少女的领土，或者说军事控制区。\n而我们现在还未真正的战胜索拉娜，若现在就与魔联开战显然不符合我们的战略预期。但是..."
  magicunion.1224.a:0"赤旗终会找上她们。"
  
  magicunion.12241.t:0 "魔法少女收拢军团残部"
  magicunion.12241.desc:0 "在我们与莉兰迪亚军团交战的时候，魔法少女与那些溃败的雇佣军们做了一笔交易，已经接纳军团残部逃进了魔法少女联盟的控制区，在我们的赤卫队抵达时，魔法少女的部队已经挖好了战壕，为首的魔法少女将她那流光溢彩的灵装利刃插在地上傲慢的命令我们的部队停止前进。无论如何，现在军团残余已经逃入了魔法少女的领土，或者说军事控制区。\n而我们现在还未真正的战胜索拉娜，若现在就与魔联开战显然不符合我们的战略预期。但是..."
  magicunion.12241.a:0"赤旗终会找上她们。"
  
  magicunion.1225.t:0 "魔法少女联盟送来了一些装备"
  magicunion.1225.desc:0 "魔法少女联盟为我们送来了一些装备，期望能在战乱结束后，和我们进行一些合作。"
  magicunion.1225.a:0"欢迎一切帮助。"
  
  magicunion.1231.t:0 "魔女之夜降临风止区"
  magicunion.1231.desc1:0 "魔女之夜降临到了风止区，一个传说之中的怪物，我们曾经认为，这只不过是个传说罢了，直到它就这么活生生的降临到我们的面前。\n\n房屋被摧毁，混凝土建筑在风暴之中拔地而起，试图维护安抚公民的自由卫队被吹飞到半空然后落在遥远的地面。\n\n并且伴随着地震与海啸，整个风止区都如同末日一般的景象，苍海镇已经被海啸与地震所摧毁，但是即便如此，"
  magicunion.1231.desc2:0 "……"
  magicunion.1231.a:0"我们民主足够强大！"
  magicunion.1231.b:0"……"

  magicunion.1232.t:0 "魔女之夜降临南方管制区"
  magicunion.1232.desc1:0 "魔女之夜的风暴已经摧毁了南方管制区，还好这里没有大型的城市，至于圣杯的那个殖民港口……\n嗯我们还是说一下专家们的分析情况吧，民主的专家们预测，这个名为瓦尔普吉斯之夜的超级魔女，大概会一路北上，直到薄望之馆。所过之处所有工厂和文明的机构都会被摧毁殆尽。\n而对于凡人而言，这就是一场魔法驱动的超级风暴，她们看不到这个名为瓦尔普吉斯之夜的超级魔女。"
  magicunion.1232.desc2:0 "……"
  magicunion.1232.a:0"魔女之夜无法击败我们的民主！"
  magicunion.1232.b:0"……"
    
  magicunion.1233.t:0 "魔女之夜降临参京区"
  magicunion.1233.desc1:0 "参京区被摧毁了，参京教育学院，还有参京城区，什么都没有留下只剩下废墟。"
  magicunion.1233.desc2:0 "……"
  magicunion.1233.a:0"魔女之夜对民主一无所知！"
  magicunion.1233.b:0"……"
  
  magicunion.1234.t:0 "魔女之夜降临宝崎市"
  magicunion.1234.desc1:0 "宝崎市被摧毁了，什么都没有留下只剩下废墟。在见泷原的后山上，已经可以用肉眼直接观测到魔女之夜所伴生的风暴。"
  magicunion.1234.desc2:0 "……"
  magicunion.1234.a:0"民主会击败魔女之夜"
  magicunion.1234.b:0"……"
  
  magicunion.1235.t:0 "魔女之夜降临见泷原"
  magicunion.1235.desc1:0 "见泷原被摧毁了，什么都没有留下只剩下废墟。目前行政总督神滨市正面临魔联成立以来最大的危机，若是我们无法将其阻止...。"
  magicunion.1235.desc2:0 "……"
  magicunion.1235.a:0"我们必须相信民主的力量"
  magicunion.1235.b:0"……"
  
  magicunion.1236.t:0 "魔女之夜降临神滨市"
  magicunion.1236.desc1:0 "神滨市被摧毁了，什么都没有留下只剩下废墟。民主的心脏停止了跳动，无论是大议会，还是立法院，都已经在风暴之中倒塌了。有些议员认为，这或许就是魔法少女联盟的终结了..."
  magicunion.1236.desc2:0 "……"
  magicunion.1236.a:0"我们必须相信人民的力量！"
  magicunion.1236.b:0"……"
  
  magicunion.1237.t:0 "魔女之夜降临镜界"
  magicunion.1237.desc1:0 "镜界被摧毁了，什么都没有留下只剩下废墟。根据专家观测，将会继续北上，在失去了魔法少女的镇压，废墟之中魔女的数量也开始增长。"
  magicunion.1237.desc2:0 "……"
  magicunion.1237.a:0"人民的力量会战胜万难"
  magicunion.1237.b:0"……"
  
  magicunion.1238.t:0 "魔女之夜降临汤国市"
  magicunion.1238.desc1:0 "镜界被摧毁了，什么都没有留下只剩下废墟。我们还能联系到的所有人，都聚集到了薄望之馆。如果魔女之夜的风暴继续前进，我们将会失去最后的指挥中心。议员们的态度空前的悲观，甚至已经坐上远洋货船准备逃离这个国度，但是仍然有一些魔法少女愿意支持我们进行最后一战..."
  magicunion.1238.desc2:0 "……"
  magicunion.1238.a:0"民主，会赢的！"
  magicunion.1238.b:0"……"
  
  magicunion.1239.t:0 "魔女之夜降临薄望之馆"
  magicunion.1239.desc1:0 "随着薄望之馆化作废墟，最后一杆魔联的旗帜倒下了，人民四散奔逃，在这可怕的魔法风暴之中。昏暗的天空什么都看不到，在风暴之中连方向都无法辨别。人们只知道一件事，魔法少女联盟的民主，已经结束了。"
  magicunion.1239.desc2:0 "……"
  magicunion.1239.a:0"虽然现在一无所有，而且也没有民主了..."
  magicunion.1239.b:0"……"
  
  magicunion.1240.t:0 "土豆还是步枪"
  magicunion.1240.desc1:0 "在国家趋于稳定之后，我们需要进一步的提升农业生产，来让人民获得充足的食物。充满淀粉的土豆是个很合适的农作物，我们应当在全国范围内大量的种植。\n或者我们也可以专注于建立更多的军工厂，用更多的武器在未来保护我们的国家，毕竟现在这个时代危机重重有更多的武器才能保护国家。"
  magicunion.1240.desc2:0 "在国家趋于民主之后，我们需要进一步的提升我们民主，民主的公民应当有充足的民主食物。充满淀粉的土豆是个很民主的农作物，我们应当在全国范围内民主的种植。\n或者我们也可以专注于建立更多的军工厂，用更多的武器在未来保护我们的民主，毕竟现在这个时代危机重重有更多的武器才能保护民主。"
  magicunion.1240.a:0"我们需要提供丰富的食物"
  magicunion.1240.b:0"民主的生活，需要民主的土豆"
  magicunion.1240.c:0"还是来点武器工厂吧"
  
  magicunion.12401.t:0 "种植土豆"
  magicunion.12401.desc1:0 "银白色的晨雾尚未散尽时，樱井葵展开了流光溢彩的魔法阵。她的身上缠绕着好友用魔法召唤出的豌豆藤，那些碧绿的藤蔓将装满了种子口袋系在她的裙摆两侧。当第一缕阳光刺破云层，少女突然加速冲向天际，身后拖曳出彩虹色的星尘轨迹。在三百米高空悬停的刹那，她解开了左腰间的口袋，经过魔法加工的土豆种子随着飞行倾泻在农田里。\n随后一个湛蓝的五芒星魔法阵缓缓的出现在农田的上空，人工制造的魔法雨越下越大，滋润着大片的农田。"
  magicunion.12401.desc2:0 "银白色的晨雾尚未散尽时，樱井葵展开了民主的魔法阵。她的身上缠绕着好友用魔法召唤出的豌豆藤，那些民主的藤蔓将装满了种子口袋系在她的民主裙摆两侧。当第一缕民主阳光刺破云层，少女突然加速冲向天际，身后拖曳出彩虹色的民主轨迹。在三百米高空悬停的刹那，她解开了左腰间的口袋，经过魔法加工的土豆种子随着飞行倾泻在民主的农田里。\n随后一个民主的五芒星魔法阵缓缓的出现在农田的上空，人工制造的民主雨越下越大，滋润着大片的民主农田。"
  magicunion.12401.a:0"让我们等待丰收的那一天"
  magicunion.12401.b:0"种下民主，等待民主。"

  magicunion.12402.t:0 "收获日"
  magicunion.12402.desc1:0 "秋日的阳光像融化的蜂蜜，缓缓流淌在广袤的田野上。泥土被晒得酥松，散发着潮湿的芬芳。沉甸甸的土豆在泥土深处等待着一场丰收。小葵带着好友降落在田垄的瞬间，整片土地突然隆起波浪形的褶皱。许许多多的土豆挣脱泥土悬浮在空中，在土地有规律的脉动中，土豆咕噜咕噜的翻滚到一起，堆成了一座小山丘。圆润饱满的土豆簇拥成堆。夕阳将天空染成薯皮色的傍晚，小葵坐在堆成金字塔状的土豆堆上啃烤薯，看着运输队的魔法少女们，以极高的效率让土豆自己爬到货车上。在丰收的夜晚，运输队在魔法光球的引导下行驶着，连那低垂的繁星都格外明亮，仿佛也在为这片土地上的丰饶而欢欣。"
  magicunion.12402.desc2:0 "秋日的阳光像民主的蜂蜜，缓缓流淌在民主的田野上。泥土被晒得酥松，散发着民主的芬芳。沉甸甸的土豆在泥土深处等待着一场民主的丰收。小葵带着好友降落在田垄的瞬间，整片土地突然隆起波浪形的褶皱。许许多多的土豆挣脱泥土悬浮在空中，在土地民主的脉动中，土豆咕噜咕噜的翻滚到一起，堆成了一座小山丘。民主饱满的土豆簇拥成堆。夕阳将天空染成薯皮色的傍晚，小葵坐在堆成金字塔状的土豆堆上啃烤薯，看着运输队的魔法少女们，以民主的效率让土豆自己爬到货车上。在民主的夜晚，运输队在民主光球的引导下行驶着，连那低垂的繁星都格外民主，仿佛也在为这片土地上的民主而欢欣。"
  magicunion.12402.a:0"让人民能拥有丰足的食物。"
  magicunion.12402.b:0"民主的农田！民主的土豆！"

  magicunion.1241.t:0 "渔船还是军舰"
  magicunion.1241.desc1:0 "我们现在可以建造渔船，或者海军船坞。\n建造渔船发展渔业，南大西洋的鱼群可以为我们提供丰富的食物。\n而海军船坞可以为我们生产更多的海军舰船，来应对可能的威胁。"
  magicunion.1241.desc2:0 "我们现在可以建造民主的渔船，或者民主的海军船坞。\n建造渔船发展民主渔业，南大西洋的鱼群可以为我们提供丰富的民主。\n而海军船坞可以为我们生产更多的民主舰船，来应对民主的威胁。"
  magicunion.1241.a:0"我们需要提供充足的鱼鱼"
  magicunion.1241.b:0"民主的生活，需要有民主的鱼。"
  magicunion.1241.c:0"还是来点军用船厂吧"

  magicunion.1243.t:0 "渔帆满载"
  magicunion.1243.desc1:0 "晨雾未散‌，渔船已切开靛蓝的海面，柴油机的轰鸣惊起一群银鸥。少女船长在船长室里把操纵着她那简陋的鸟卜仪，水晶球上映照着鱼群的位置，水手们按照预兆驾驶渔船，洒下渔网。在数个小时之后那纤细的手臂拉下控制杆，‌渔网‌如同苏醒的巨兽，在绞缆机的嘶吼中浮出水面。黏腻的网眼间，‌鱼鱼们‌闪着银光在甲板上撞出细碎脆响，还有些在激烈的地蹦跳着，鳞片在朝阳下溅起细碎的金星，金色长发的大幅走上甲板，少女的秀发似乎比海面的银光更加闪亮，随着她单手抬起，甲板上那些小鱼被扔回了海里，大鱼被分别装进了渔船的仓库里。随后看起来面容稚嫩的轮机长走进了仓库，她轻抚仓库的地面将整个仓库冰结到了零度之下，把鱼鱼们冻结在了寒冰之中。船员们吃着面包喝着鱼汤和酸菜，载着满满的鱼获回到了港口，很快这些新鲜的鱼鱼将随着货运卡车送往城市之中。"
  magicunion.1243.desc2:0 "晨雾未散‌，渔船已切开民主的海面，柴油机的轰鸣惊起一群银鸥。少女船长在船长室里把操纵着她民主的鸟卜仪，水晶球上映照着鱼群的位置，水手们按照预兆驾驶渔船，洒下民主的渔网。在数个小时之后那纤细的手臂拉下民主的控制杆，民主的‌渔网‌如同民主的巨兽，在绞缆机的嘶吼中浮出水面。黏腻的网眼间，‌鱼鱼们‌闪着银光在甲板上撞出民主脆响，还有些在民主的地蹦跳着，鳞片在朝阳下溅起细碎的金星，金色长发的大幅走上甲板，少女的秀发似乎比海面的银光更加民主，随着她单手抬起，甲板上那些小鱼被扔回了海里，大鱼被分别装进了渔船的民主仓库里。随后看起来面容稚嫩的轮机长走进了民主仓库，她轻抚民主仓库的地面将整个仓库冰结到了零度之下，把鱼鱼们冻结在了民主的寒冰之中。船员们吃着民主面包喝着民主鱼汤和民主酸菜，载着满满的民主鱼获回到了民主的港口，很快这些新鲜的民主鱼鱼将随着民主的货运卡车送往民主城市之中。"
  magicunion.1243.a:0"让人民能吃上廉价的鱼。"
  magicunion.1243.b:0"民主的渔船！民主的鱼！"

  magicunion.1244.t:0 "国家餐厅"
  magicunion.1244.desc1:0 "在我们拥有大量的土豆农田和渔船之后。我们可以在全国范围提供国家餐厅，为人民供给价格低廉的炸鱼和薯条。人民可以以极低的价格享受到充满油脂的一餐。在‌裹着琥珀色的脆壳之中，热油锁住的鱼汁随着咀嚼迸发，‌雪白的蒜瓣肉‌裹着温热的鲜甜在舌尖滑过，还有混合着‌五香粉的辛香‌与‌海盐的咸鲜。在炸鱼的一旁，它还有着金黄酥脆的配角，边缘焦糖化的脆壳下藏着‌绵软的土豆芯，粗盐粒在舌尖融化时，外酥内软、薯香松脆的薯条所包裹的美味像潮水般冲刷味蕾‌。\n而那低廉的价格让人可以经常的体验油炸食品的美味与魅力，在残留的油香和令人回味的余韵之中，心满意足的走出国家开办的餐厅。"
  magicunion.1244.desc2:0 "在我们拥有大量的民主土豆农田和民主渔船之后。我们可以在全国范围提供民主国家餐厅，为公民供给价格低廉的民主炸鱼和民主薯条。公民可以以极低的价格享受到充满民主的一餐。在‌裹着琥珀色的脆壳之中，热油锁住的民主随着咀嚼迸发，‌雪白的蒜瓣肉‌裹着温热的民主在舌尖滑过，还有混合着‌五香粉的辛香‌与‌海盐的民主。在民主炸鱼的一旁，它还有着民主酥脆的配角，边缘民主化的脆壳下藏着‌民主的土豆芯，粗盐粒在舌尖民主时，外酥内软、薯香松脆的薯条所包裹的民主像潮水般冲刷味蕾‌。\n而那民主的价格让人可以经常的体验油炸食品的美味与民主，在残留的油香和令人回味的民主之中，心满意足的走出国家开办的民主餐厅。"
  magicunion.1244.a:0"这是我们应做的"
  magicunion.1244.b:0"公民们值得这种民主！"

  magicunion.1245.t:0 "咖啡厅的一角"
  magicunion.1245.desc1:0 "小葵最近喜欢上了喝咖啡，在农闲时期她和乡亲们一起来城里打工，发现新开了一些咖啡厅，而且价格比以前便宜许多，来城里打工的乡亲们也很喜欢这家店。许多人都会选择在一天的忙碌之后来喝一杯廉价的咖啡，冲去一整天的疲倦与辛苦。\n小葵和几名少女一起挤进了咖啡厅，在少许的等待之后，坐在椅子上捧着一杯玛奇朵。阳光透过玻璃窗与树荫在咖啡杯上映照着斑斓的光影，焦糖酱正沿着杯壁缓慢流淌，深褐色的浓缩咖啡在杯底蛰伏，上方漂浮的奶泡像初雪般蓬松，而金色焦糖如同魔法阵一般坐落于咖啡的顶部。咖啡的热气裹挟着浓郁的香气升起，咖啡豆的坚果苦香，鲜奶煮沸后的甜腥，焦糖的致命诱惑，那白砂糖在高温下变换出的，带着微苦的甜蜜。\n轻轻的在咖啡杯的边缘品尝着，绵密泡沫在舌尖破碎的瞬间，味蕾先捕捉到香草籽的芬芳，接着是被焦糖酱缓冲过的咖啡苦味，那刚好温热适度的浓缩咖啡与牛奶，似乎让每一滴咖啡都变成了液态的太妃糖，连最后的残渍都值得用舔干抹净。杯沿残留的焦糖结晶，此刻正映出窗外晚霞的颜色，像被时间遗忘的琥珀，凝固了最后一缕甜腻的暮光。"
  magicunion.1245.desc2:0 "小葵最近喜欢上了喝咖啡，在农闲时期她和乡亲们一起来城里打工，发现新开了一些咖啡厅，而且价格比以前民主许多，来城里打工的乡亲们也很喜欢这家店。许多人都会选择在一天的忙碌之后来喝一杯民主的咖啡，冲去一整天的疲倦与辛苦。\n小葵和几名少女一起挤进了咖啡厅，在少许的等待之后，坐在椅子上捧着一杯民主玛奇朵。阳光透过玻璃窗与树荫在咖啡杯上映照着斑斓的光影，焦糖酱正沿着杯壁缓慢流淌，深褐色的浓缩咖啡在杯底蛰伏，上方漂浮的奶泡像初雪般蓬松，而金色焦糖如同魔法阵一般坐落于咖啡的顶部。咖啡的热气裹挟着浓郁的香气升起，咖啡豆的坚果苦香，鲜奶煮沸后的甜腥，焦糖的致命诱惑，那白砂糖在高温下变换出的，带着微苦的甜蜜。\n轻轻的在咖啡杯的边缘品尝着，绵密泡沫在舌尖破碎的瞬间，味蕾先捕捉到香草籽的芬芳，接着是被焦糖酱缓冲过的咖啡苦味，那刚好温热适度的浓缩咖啡与牛奶，似乎让每一滴咖啡都变成了液态的民主，连最后的残渍都值得用舔干抹净。杯沿残留的焦糖结晶，此刻正映出窗外晚霞的颜色，像被时间遗忘的琥珀，凝固了最后一缕甜腻的暮光。"
  magicunion.1245.a:0"咖啡与牛奶的醇香。"
  magicunion.1245.b:0"咖啡与牛奶的民主。"
  
  magicunion.1246.t:0 "扩大征兵？"
  magicunion.1246.desc:0 "民主的旗帜正在熊熊燃烧，面临着毁灭的危机，在这生死存亡的关头，我们需要立刻签署新的民主法令，来动员更多的公民，为民主挺身而出。"
  magicunion.1246.a:0"我们必须动用一切力量来捍卫民主。"
  magicunion.1246.b:0"目前还不到那一步。"

  magicunion.1247.t:0 "交还领土？"
  magicunion.1247.desc:0 "在对抗公社的过程中，我们从公社手中夺回了一部分原属于夜莺之国的领土，我们是否应该将这些领土还给夜莺之国的亡灵公主。"
  magicunion.1247.a:0"把她的领土还给她。"
  magicunion.1247.b:0"没这个必要..."

  magicunion.1248.t:0 "魔联交还我们的领土"
  magicunion.1248.desc:0 "魔法少女联盟从公社手中夺取了一些原属于我们的领土，她们表示愿意将这些领土交还给我们。"
  magicunion.1248.a:0"交接领土"

  magicunion.1249.t:0 "反公社的战线"
  magicunion.1249.desc:0 "我们与魔法少女正在一同对抗公社的入侵，她们想要与我们签订双方的军事通行权。"
  magicunion.1249.a:0"当然可以。"
  magicunion.1249.b:0"不行！"

  magicunion.1250.t:0 "向北方"#1
  magicunion.1250.desc:0 "“离开神滨的魔法少女越来越多了。”七海八千代拿着扫帚，仔细地打扫着主席台下的木制地板。\n “嗯，如果只是正常的人员流动还好说，但是离开的人一天比一天多，各地也有类似的报告——八千代，白天就已经托人打扫过了喔。”和泉十七夜站在台下，些许无奈的看着台上独自忙碌的八千代。\n “还好意思说，明天得再找人打扫一阵，弄的一点都不用心。这场大选意义非凡，可不能敷衍了事。”“你看起来像个老妈子一样。”   十七夜叹了口气，把扫帚放在一边。“也是因为如此，这个事态，是没法忽视的呢。”“不过，如何处理——我想重要性也无需多言。”\n作为资历最老的魔法少女之一，几乎全程参与了内战的七海八千代很清楚，她们现在享受的和平依然脆弱。\n   同为资历最老的魔法少女之一，和泉十七夜的考虑和八千代实质上是一致的，但现在临时视事的她知道如今更需权衡利弊。\n “首先，当然是调查个中原因。”八千代竖起食指。“根据伊吕波传回来的消息看，离开的魔法少女，都做过同样的梦，听过同一句话。” “嗯，这句话我从其他伙伴那里听说过，“去博望之馆，那里的魔法少女会获得救赎。”她抱着手臂，那杆黑色的马鞭在她的手里轻轻摇晃着，“事实上，东部的魔法少女大部分都出走了，而且，想也能猜出来，是什么吸引着她们。”\n “‘玛吉斯之翼’...那群被赶出神滨的极端主义者”“嗯，八千代，虽然早在内战时我就在向议会军警告过她们，但当时联盟确实无暇他顾。”十七夜摇了摇头，“况且，哪怕是现在，我也不认同现在处理这件事情。”“因为大选迫近，是吗？”八千代的神情严肃了起来。\n “这个理由我可不认同，这些出走的魔法少女也是联盟的一部分，如果还要坚持原计划，这个选举又有什么合法性可言？”\n “我已经让三日月庄的其他人着手调查此事了，但是在神滨调查目前来看并无意义。”虽然这么说，八千代依旧在等待十七夜的意见。\n “你要到北方去吗？且不说可能会很危险...你也是候选人啊，忘了？”作为神滨的领袖，也是联盟内的临时领导人，十七夜有些犹豫。"
  magicunion.1250.a:0"§C你知道的，十七夜，我必须得去，为了联盟。§!"
  magicunion.1250.b:0"§R总之，我不能允许这种鲁莽的行动，八千代。§!"
  
  magicunion.1251.t:0 "遇袭"#2.1a
  magicunion.1251.desc:0 "在深入玛吉斯之翼的领地后，特遣队精心筹划的调查行动最终还是暴露了。当八千代意识到自己的小队已经被玛吉斯之翼的黑羽们团团包围时，战斗已经持续到夜幕降临。\n “呜呜...师傅，这样下去不是办法啊！”躲在一间废弃工地的多层建筑上。鹤乃的语气里明显能听出急迫。\n “管他呢，这群玛吉斯的坏蛋，来一个砸飞一个就是了！”深月菲利西亚倒是依旧不觉得疲累，扛着一杆大锤，夸下了海口。\n “嘛，为了刚刚保护你好几次的莎奈着想，别在这里逞英雄，菲利西亚！”“啊——好吧...”菲利西亚挠了挠头。\n “抱，抱歉，现在不是在这里拌嘴的时候...”话正说着，在外侦察的二叶莎奈不知何时出现在她们中间。\n “黑羽们已经逼近这栋建筑了，而，而且，似乎也能看见几位白翼出现在后面...玛吉斯的干部们也已经被动员过来了！”\n   八千代轻轻啧了一下，随即作出部署。“我们被玛吉斯攻击的事实，如果传达给议会，这无疑就将是战争的信号，因此她们应该会不惜一切代价追捕我们，东躲西藏只是浪费时间和体力……"
  magicunion.1251.a:0"大家！接下来只能不顾一切的突围了！"

  magicunion.1252.t:0 "突围"#2.1b
  magicunion.1252.desc:0 "“既然师傅都这么说了...鹤乃会全力冲出一条路的！”鹤乃的干劲重新燃了起来。\n “真是的，说了那么多，到头来结论还是把她们打飞嘛！”菲利西亚准备好径直打出去了。\n “虽然要承担四个人的防卫任务实在很困难——莎奈会努力的”八千代看着她们，倒也感到几分欣慰。\n “是啊，莎奈的压力最大呢，要照看好我们四个...四个...对了，彩羽呢？”八千代这才意识到一直有一个人不在讨论中。\n “小彩羽，就在你后面啊，八千代。”顺着菲利西亚的指示，八千代看到了正倚在墙边看向外面的环彩羽。\n “抱歉，彩羽。”八千代从身后突然出现，把望着远方沉思的彩羽吓了一跳。“欸，欸！？八千代...抱歉...我在想些事情...”\n “唔，现在可没有时间在这里脱线哦。再怎么躲藏，也迟早会被追踪到魔力，要突围出去，我们需要你的掩护。彩羽，没问题吧？”\n “呃...我，我吗...”八千代可以感觉到，彩羽的动摇中有某种陌生的东西。“我知道，逛凭你要掩护我们四个人确实有些...”\n “不——八千代，我不能离开...相反，我必须向着更北走...我必须去那里！”“欸，我...你在开什么玩笑！？”相比生气，八千代更多的是惊讶。“玛吉斯有多少人正在追捕我们，如果不能回到神滨...”“我知道！我知道...”看着身后，看着远处的地平线，彩羽的眼神有些黯淡。“但是，我感受到了...我确实的感觉到了，有一股熟悉的...正是我在寻找的魔力...就在更北的地方..,它在指引我。”"
  magicunion.1252.a:0"是她的...是她的！"
  magicunion.1252.b:0"我不能离开..."
  magicunion.1252.c:0"我必须继续！"

  magicunion.1253.t:0 "媾和的邀约"#3.1a
  magicunion.1253.desc:0 " “别开玩笑了！”\n面对眼前这位白发魔法少女，八千代少有的将自己真正生气的样子表现在外人面前。\n不过，眼前这位，正在向议会寻求庇护的，玛吉斯之翼的首脑，对八千代来说也算不上外人。\n “梓美冬，你刚刚说的那些话，是认真的吗？”相比于盛怒之中的八千代，十七夜显得更加冷静，但却不知为何也触怒到八千代。\n “还以为你是回心转意，没想到你反而要来招抚我们！你们玛吉斯这群货色是什么样子，干着什么勾当我都一清二楚！不会被你骗的！”\n “所以...当时才要求不想和八千代见面的...”这是一次私人会面，她直接与目前神滨的领导者建立了联系，但她没有想过八千代的出现。“但是，我也知道，现在时间紧迫，如果拘泥于个人情感上的对错，就会酿成不可挽回的大错！”“所谓大错，就是指“内战”吧？”\n  虽然没有八千代的反应激烈，但十七夜也依旧表示着不信任，“拿可能的后果来倒逼我们吗...不，这也不是“可能的”，联盟与玛吉斯的内战恐怕已经是板上钉钉了吧？”“并非如此，十七夜小姐，要想阻止最坏的后果，很简单，我们需要议会的‘倾听’。”\n “玛吉斯的目的，从始至终只有一个，那就是“魔法少女的解放”。"
  magicunion.1253.a:0"我承认，为了达成这个目的，我们明显是过界了..."

  magicunion.1254.t:0 "无关于信任"#3.1b
  magicunion.1254.desc:0 "“饲养魔女，用魔女和谣言狩猎人类，这些行径用‘过节’来形容也太轻巧了吧？”美冬捂着胸口，顶着昔日好友的冷嘲热讽，继续发表着意见。“但是我们的目的，最终也是能够实现共存的！只要实现净化系统覆盖到全联盟！魔法少女就能解决魔女化的问题！”\n “还在犹豫什么！十七夜小姐！如果此行我不能说服国会倾听我们的声音，事情一定会朝着更坏的方向发展！在玛吉斯内部，也已经出现了更加激进的魔法少女，她们的想法相比我来说更加过犹不及。我不能接受玛吉斯的同志真的和哪些极端主义者同道，所以，拜托了。我想让和我一样清醒的玛吉斯之翼们知道，议会也在思考她们正在思考的问题，这是救人，也是自救！我，需要你们的帮助。”\n  目视她离开之后，两人就这个问题再一次出现了久违的争执。\n“十七夜，同为资历最深的魔法少女，我并不理解为什么你会信任那位玛吉斯的一面之词。”\n“你理解错了，八千代，我并没有信任她。”十七夜摇了摇头，但却用了更深的叹息掩盖了自己的意见。"
  magicunion.1254.a:0"但是，我们信任与否无关紧要..."
  
  magicunion.1255.t:0 "失控边缘"#3.2a
  magicunion.1255.desc:0 " “为什么，要帮我们？”在黑夜的雨林中，虽然因为刚刚的逃亡，环彩羽已经气喘吁吁，但她还是没忘记询问起前面那位正在带着她们躲避黑翼追捕的女性。“看你的衣装...应该也是玛吉斯的一员。”“何止哦，看上去和黑翼白翼也不一样。”菲利西亚的话里与其说是警惕，不如说是某种好奇。\n “没有时间解释这些——而且，小鹤乃应该认识我罢？”“嗯...是这样啦。”鹤乃少有的把脑袋耷拉下来。“美冬小姐...师傅原来的搭档...”\n “接下来，我会告诉你们如何离开这里，为了围堵你们玛吉斯们几乎倾巢而出。但我知道有一条小路，并不为玛吉斯之翼所知晓——”\n “您搞错了，美冬小姐。”彩羽依旧坚定——或者说固执地摇了摇头。“我们并没有在逃离，想法，我们想要找到玛吉斯之翼的所在。”\n   眼见对方为这句话感到震惊。鹤乃只得上前一步。“是，是这样，彩羽她，感应到自己妹妹的魔力，而且，她确定魔力的源头，正在玛吉斯的巢穴里...确切的说，"
  magicunion.1255.a:0"就是“玛吉斯”们的所在之处。"

  magicunion.1256.t:0 "行于无惘之路"#3.2b
  magicunion.1256.desc:0 "“意思是，你们，并非逃离，反而是在前往玛吉斯的中心吗？这太危险了！”\n “但是，彩羽说那两个人是她的朋友，她无论如何也要见到那两位玛吉斯的首脑。”菲利西亚挠挠头，“而且，我们相信她，嘿嘿。”\n “听我说，现在的情况比你们，比八千代她们预想的都要严重！玛吉斯即将向南方发起战争，届时联盟将面临另一场内战！我需要你们把消息传回神滨！这关系到绝大多数魔法少女！议会必须得到战争将至的消息！现在只有你们能把消息传出去！”\n “的确，的确是这样。”彩羽有些犹豫的样子让美冬以为对方认同了自己的看法，但随即，彩羽闭上了眼睛。“正是因为如此...”\n “我相信，我有办法——去避免这最坏的结果！”“别傻了，如今你们即使找到她们又能做些什么！？”彩羽只是笑了起来。\n “做些什么吗？我确实不清楚，但是，你们口中的“玛吉斯”——灯花...还有音梦，她们是我的朋友！总会有办法的，我会有办法的！”\n “......唉。”美冬叹了口气。“我刚刚说，为了追捕你们，玛吉斯们倾巢出动，封锁了几乎每一处南下的道路——不过现在看来，这是个机会——这意味着目前在北方——在博望之馆，暂时并没有多少玛吉斯的人留守。”“也就是说...”"
  magicunion.1256.a:0"嗯，那条人迹罕至的小路，只能我自己来用了。"

  magicunion.1257.t:0 "要拯救所有的，所有的魔法少女"#4.1
  magicunion.1257.desc:0 "“各位魔法少女——曾经怀抱希望，终究会播撒绝望的魔法少女们。\n    你们成为魔法少女的时候，许下了什么样的愿望呢？\n     为了自己许愿的人，为了他人许愿的人，为了梦想许愿的人。各种各样的，应该都有吧？\n     人总是会梦想着美好的未来，于是便会许下愿望。这其实是很厉害的哦~。\n     哪怕生活在地狱中，哪怕要活在天灾的阴影下，哪怕每时每刻都有可能要见证离别，但因为有着愿望，这里依旧诞生出文明。\n     所以——愿望的力量，一直在推动着人类——这里的人类不断前进。\n     这就是QB所觊觎的，魔法少女之所以成为魔法少女的，愿望的力量。\n     既然如此，用愿望的力量引发奇迹的魔法少女，是否才是这个文明最为关键的存在？\n 然而，我们所处的位置，所背负的罪业，我们只是无害的神像，无怨无悔的守护者。为了人类而战斗，受伤，献出生命。除了一边悲叹自己的命运散播诅咒以外什么都做不了。\n 我们的感情创造了这个世界，但现在，它被人类随意消费，我们被当成理所当然的牺牲者。所以，魔法少女的同志们啊，我相信，拥有如此力量的愿望之力，一定能改变我们的命运。利用魔女化身...利用EVE的遗产...利用净化系统！\n 不管什么样的奇迹，魔法少女都会做到，我们的愿望，不会再为他人利用！"
  magicunion.1257.a:0"魔法少女将由玛吉斯来拯救！"

  magicunion.1258.t:0 "虚妄侵染的议会"#5.1
  magicunion.1258.desc:0 "“我个人早已就可能的风险警告过神滨联盟议会！在这种时候解散议会军是个愚蠢的决定！”本就因被迫放弃权力而一直有所不满的巴麻美，在这一次联盟大会上的声音分外高亢，很难说在那略显尖细的怒音中，究竟满含愤怒，还是混杂着些许得意。\n  “请安静陈述你的观点，巴麻美小姐。”历任议长中讲话最为咄咄逼人的临时议长红晴结菜此刻却完全没有以前的气势。“议会的诸位议员都在内战中犯过错——可能也包括我，但是大家都不会因为这件事情，认为解散一群骄兵悍将是错误的。至少我不会。”\n  “真是令人难堪，要是消息再晚几天，等大选举行，你觉得你还有机会在主席台上耀武扬威吗？你可是我——是议会的手下败将。”\n  “还不打算上台吗？”在议会的最上方，靠在门框上的八千代不经意地点起坐在她前面的十七夜。“她可不会提出个好提案。”\n  “但我手上的提案更坏。”“你要向议会提出让步？”“我说过，我和你态度一致，但是现在很大一部分——我是说很大一部分议员都对今天玛吉斯的广播不置可否。”十七夜靠在座位上叹了口气。“两个意见，战还是谈，而我的意见是静观其变，这当然很难办。”\n  “魔法少女们！还不算太晚！现如今正是重新建立常备军保卫联盟的时刻！当年议会的拖延导致越来越多的城邦加入了分离主义势力，彼时彼刻恰如此时此刻啊，只不过对象变成了玛吉斯。”这位“前”将军接下来的话强硬了起来。“我不会看着前辈辛辛苦苦统合起来的联盟走向分裂——两次。我支持谈判，但我的谈判，不会失败。”\n  “如果一定要按你说的做，现有能用于战斗的魔法少女也不足以保卫联盟。”不知何时，十七夜站了起来，她冷静却同样浑厚的声音将那趾高气昂的话语稍稍压过一头。“更遑论发动攻势，玛吉斯真正向议会发起进攻之前，贸然动员人类和魔法少女是完全不明智的。”\n  “第三种意见，哈？看来是经典的对峙僵局了。”两个人的目光不约而同的都放在了议长的身上。"
  magicunion.1258.a:0"如果妥协能够避免流血？我不介意让自己的名声再臭一点。"
  magicunion.1258.b:0"感谢议会的理解，如今唯有以不变应万变。"
  magicunion.1258.c:0"又一场战争……是我们如何也承受还不起的。"

  magicunion.1259.t:0 "聚集思念的光辉"#5.2
  magicunion.1259.desc:0 " “神滨的各位，听的见吗？”“听的见。环彩羽，我必须确认一下，你现在真的在玛吉斯的基地里吗？”“是的，十七夜小姐，而且，我觉得，我离我要寻找的人，已经很接近了。”“能，再说一遍你的计划吗？现在收听着魔导器通讯的，并非只有我。”\n  “八千代也在吗？”“嗯，也在，确切的说——现在整个神滨议会都在准备听听你的想法。”“欸，是这样吗！？”“抱歉让你紧张了。”\n  “呃，唔...嗯，我明白了，十七夜小姐，虽然，我接下来的话，很不可思议，但是，我的心里并不对我接下来要做的事感到怀疑。”\n  “被你们称为恐怖分子的，按理说应该是最明显不过的敌人，灯花和音梦，她们，她们是我的朋友，虽然，不知道为什么，她们忘记了我，也忘记了我的妹妹。但是，我能感觉到妹妹的魔力就在这里，是的，我知道来源...eve，玛吉斯用来作为净化系统的容器的，半魔女化的“EVE”遗体——就是我的妹妹。”\n“各位安静！安静！彩羽，这不是开玩笑，刚刚美冬小姐已经和我们解释清楚了。现在已是万分危急的情况，玛吉斯为了将博望之馆的，已经近乎完成的净化系统扩散到整个联盟境内，她们正在尝试将大量魔女融入EVE遗体中，甚至，她们有意要召唤“魔女之夜。”我就当你清楚她们现在正在做的事情。可以么？”“嗯，现在的情况，我很清楚。”“议会无法承受最坏的后果，巴麻美将军已经准备就绪，你的计划是否可行，将决定议会接下来的举动——是批准你的行动，还是重新组织一支军队，以面对你的朋友们。”\n“我，我当时...不知为何丢失了对妹妹的记忆...而且，似乎她们也一样，计划的第一步是，我要让她们，让小灯花...和小音梦重新回忆起我和我的妹妹...然后，我要找回我的妹妹！我要阻止她们，把妹妹从EVE中抢回来！”\n“.......”\n“...十七夜小姐？”\n“........”\n“果然，是我的要求太任性了吗？”"
  magicunion.1259.a:0"我很抱歉，环彩羽....."
  magicunion.1259.b:0"的确很任性，而且还有点自以为是——\n仅限48个小时，议会批准你们的行动。"

  magicunion.1260.t:0 "胜利的红茶"#6.1
  magicunion.1260.desc:0 " 事实证明，巴麻美所言非虚，议会军的重建再一次重振了议会的声势。玛吉斯分裂集团的覆灭彻底宣告了分离主义时代的结束，一支强有力的魔法少女与人类的联合军队关闭了“拯救魔法少女”的大门。\n当然，代价是什么呢？所有人都在避免的，民主的旁落，在墨菲定律中得以受益。巴麻美完成了在第一次内战时期都没能做到的事情——完成了政治权力与军事权力的统一。众望所归的第二任议会军司令同时也在选举中被推举为联盟议长。耐人寻味的是，她拒绝了这一任命，转而宣布自己成为联盟的第一届国家总统——这一提案获得了议会的通过。和它一起被通过的还有联盟的联邦化法案。\n至少现在，还不能确认她是否依旧忠于议会，忠于民主。但所有人都明白，一个军政府将会被建立起来。建立在魔法少女-人类的联合专政之上。"
  magicunion.1260.a:0"魔法少女会保护人类，人类托举着魔法少女，\n这条法则亘古不变。"

  magicunion.1261.t:0 "添上紫菀花"#6.2
  magicunion.1261.desc:0 " 谈判异常顺利，在灯花获准于议会上介绍她拯救魔法少女的方案后，议会中支持玛吉斯的声势一浪盖过一浪，然而，这并不意味着玛吉斯之翼能够心安理得的在议会的支持下大展羽翼。在几位资深魔法少女的坚持下，在促进双方谈判中作出了突出贡献的三号人物，梓美冬，在议会选举中被推举为新的联盟议长。而玛吉斯也将从武装社团转变为科研与政治并重的魔法少女政党，未来是可期的，但这一转变也许并不会让所有的玛吉斯信徒们满意......\n至于议会全新的装饰品..."
  magicunion.1261.a:0"就用紫菀花吧。"

  magicunion.1262.t:0 "沉重的制服"#6.3
  magicunion.1262.desc:0 " 虽然八千代的克制并未能成功避免战争，但最宝贵的地方在于，议会用这场新内战的胜利证明了一件事——不需要几个功勋卓著的军事勋贵组织的政治化军队，议会可以自行组织起国家武装去抵御任何外来的武装入侵。换而言之，从内战中成长起来的联盟议会真正结束了分离主义时代。自此历届魔法少女们心心念念的，对这个国家的政治现代化事业，似乎已经可以正式开始。\n毫无悬念，在联盟议会选举结束以后，和泉十七夜得到了统领全联盟魔法少女的权位——她被推举为联盟议长,穿好议会为自己定制的盟主服饰，能轻松地感受到自己立场的所在。接下来要做的还有很多。首先，她必须考虑如何解决魔女化带来的各种各样的问题..."
  magicunion.1262.a:0"沉重的责任，让穿着它的人自然地想到未来。"

  magicunion.1263.t:0 "过去与未来"#6.4
  magicunion.1263.desc:0 " 环彩羽的计划成功了，在八千代和几位经验丰富的魔法少女的支援下，三日月小队不仅摧毁了EVE遗产，阻止了玛吉斯的计划，并且两个玛吉斯的罪魁祸首放下了武装——她们似乎恢复了记忆，和环彩羽一起阻止了失控的EVE遗体并从其里面救出了环彩羽的妹妹，环忧。而玛吉斯之翼的大部分成员也随着两位玛吉斯领袖的归顺而回归了联盟——当然，并非全部。\n尽管在议会内部有些许不满的声音，但在平息大乱的功臣环彩羽的坚持下，议会赦免了里间灯花和柊音梦，只是对她们的魔力使用进行了部分限制。这场叛乱的和平解决最大的成果在于，两位玛吉斯的领袖愿意将她们掌握的任何技术贡献给联盟，并且在原来的玛吉斯研究所继续为神滨服务。这将极大地加强联盟的科研能力——当然最关键的，魔法少女的拯救计划依然能够得以进行。\n这一突发事件使得在选举中七海八千代于一众候选人之间脱颖而出，得到了巨大优势。作为年长的魔法少女她早已见过太多悲伤的光景……尝到了太多艰辛的经验……而现在，她还是会继续带领大家继续走下去。"
  magicunion.1263.desc2:0 " 事情迎来了意料之外的转机，我们数百年来的盟友，露丝契亚远征军注意到了我们面临的危机，在关键时刻派出了她们的军事单位，并且向魔联各势力施加了相当强大的政治压力。随后，在八千代和几位蒸汽骑士的支援下，三日月小队不仅摧毁了EVE遗产，阻止了玛吉斯的计划，并且两个玛吉斯的罪魁祸首放下了武装——她们似乎恢复了记忆，和环彩羽一起阻止了失控的EVE遗体并从其里面救出了环彩羽的妹妹，环忧。而玛吉斯之翼的大部分成员也随着两位玛吉斯领袖的归顺而回归了联盟——当然，并非全部。\n尽管在议会内部有些许不满的声音，但在平息大乱的功臣环彩羽的坚持下，议会赦免了里间灯花和柊音梦，只是对她们的魔力使用进行了部分限制。这场叛乱的和平解决最大的成果在于，两位玛吉斯的领袖愿意将她们掌握的任何技术贡献给联盟，并且在原来的玛吉斯研究所继续为神滨服务。这将极大地加强联盟的科研能力——当然最关键的，魔法少女的拯救计划依然能够得以进行。\n这一突发事件使得在选举中七海八千代于一众候选人之间脱颖而出，得到了巨大优势。作为年长的魔法少女她早已见过太多悲伤的光景……尝到了太多艰辛的经验……而现在，她还是会继续带领大家继续走下去。"
  magicunion.1263.a:0"为了不让过去成为没有意义的事物……"

  magicunion.1265.t:0 "指定科研"#
  magicunion.1265.desc:0 "我们可以指定一项科技，来作为玛吉斯之翼的研究方向。"
  magicunion.1265.a:0"工业"
  magicunion.1265.b:0"建筑技术"
  magicunion.1265.c:0"电子学"
  magicunion.1265.d:0"步兵武器"
  magicunion.1265.e:0"支援武器"
  magicunion.1265.f:0"火炮"
  magicunion.1265.g:0"装甲"
  
  magicunion.1266.t:0 "躁动的亡灵"#
  magicunion.1266.desc:0 "夜莺之国爆发了亡灵动乱，莉莉安娜公主或许需要我们的一些帮助。"
  magicunion.1266.a:0"派出我们的特遣队。"
  magicunion.1266.b:0"小骑士会保护好她的..."
  
  magicunion.1267.t:0 "港口的巡洋舰"#
  magicunion.1267.desc:0 "猎帅的增援部队乘坐巡洋舰中抵达了我们的港口，在远征军要塞已经沦陷的当下，她们并入了我们的作战序列。"
  magicunion.1267.a:0"振作起来，我们还没有输。"

  magicunion.1268.t:0 "魔联对圣杯宣战"#
  magicunion.1268.desc:0 "对露丝契亚远征军来说，不可思议的事情发生了。作为南美洲圣杯王国的重要盟友的魔法少女联盟，竟然对她们的圣杯王国发动了战争。"
  magicunion.1268.a:0"一场宏大的战争开始了。"
  magicunion.1268.b:0"简直是疯了！"

  magicunion.1269.t:0 "魔法少女联盟申请阵营联合"#
  magicunion.1269.desc:0 "魔法少女们发来消息，请求我们能与她们所在的阵营联合，我们将会更加紧密的共同对抗这片大陆上崛起的威胁，捍卫现有秩序和人们平稳安全的生活。"
  magicunion.1269.a:0"加入阵营"#AI
  magicunion.1269.aa:0"邀请她们加入阵营"#玩家
  magicunion.1269.b:0"还是不了..."

  magicunion.1270.t:0 "永不缺席"#
  magicunion.1270.desc:0 "深夜，凌晨，月亮落下，太阳升起，伟大的晓美焰盟主仍然坐在办公室中，在批阅着一份份的文件，被额外加阔加宽的办公室大门不停地有人进入，亦不停的匆匆离开，再一次星光低垂，办公室的人流仍然络绎不绝，晓美焰盟主就如同毫无感情的机器，不断地写下书面命令，并在同时对另一件指令讲述着过程。然后人们拿着带有晓美焰印章的文件，以及晓美焰的口头命令，走向行政楼的各个楼层，繁忙的联盟行政首府就如同一台高速泵动的心脏，将这些公务员们如同血液一般将指令精准的送达指定的科室，电缆，无线电，水晶球，鸟卜仪，魔法感应者，不停地传输着晓美焰在办公室中所下达的一切意志，自从成为盟主以来，晓美焰日夜不息的驱动着整个魔法少女联盟的运转。英明圣洁的全国领袖晓美焰盟主的命令总能在关键时刻送达正确的位置,§1永不缺席§!\n即便如此，这个联盟很大，亦仍不够有序。里见灯花与魔联科学部，将为我们勤劳的勤勉的盟主准备了可以快速恢复精力的烈性魔药，理论上，这可以让人快速地恢复精力，但是实际是透支身体为代价，理论上可能会很可能导致凡人疲劳而死，而魔法少女即便不会因此而死也会陷入更加难受的状况之中。很难说和凡人服药之后相比哪个更坏。"
  magicunion.1270.a:0"无需在意，我还能坚持，"
  magicunion.1270.b:0"魔法少女和凡人都需要我。"

  magicunion.1271.t:0 "奇怪的任务"#
  magicunion.1271.desc:0 "小桃成为魔联的政府密探已经很久了，今天接到的任务仍然令她困惑，什么叫做，在上午10点12分30秒，从进入超市里经过右手旁第三个货架，然后出门进入对面的小巷子里，然后随便大喊三声，再在11点25分去警局门口的咖啡厅坐在靠窗的座位上要一杯焦糖玛奇朵？\n政府密探的工作难道不应该是去调查危害国家的叛徒的吗？这究竟是什么离谱的任务，还是说，是恶作剧吧，该不会是同事给她下达的什么恶搞任务，想要看她的笑话吧。\n谁知道呢，这已经是第五次接到这种不明就里的任务了，虽然小桃曾经对照过之前的4次类似的任务，想要分析出点什么东西，但是结果是什么关联都没有。完全是看似毫无意义的行为。但是不知道为什么，自己的上级和老同事，都十分的重视这种‘离谱的指令’，还反复叮嘱过，时间地点绝不要搞错，差半分钟都不行。\n小桃最后还是放下了疑惑，或许，这也是密探之中，秘密的含义吧。至少做这种不明所以云里雾里的任务，总比像上次那样抓捕没有犯罪的无辜者要好得多。"
  magicunion.1271.a:0"虽然不明白，但是坚决执行，"
  magicunion.1271.b:0"一切为了圣洁的晓美焰盟主。"

  magicunion.1272.t:0 "繁忙的警务"#
  magicunion.1272.desc:0 "‘小姑娘，你养的猫我们成功找到了。’小绿将怀里抱着的猫猫递给了一位凡人少女。这是她入职以来完成的第18个案子了。说实话这并不怎么难，在接到报案的第三天，她就从一只和普通猫猫差不多大小的猫猫使魔手中，接过了这只凡人丢失的宠物猫猫。而现在，她正带着自己的猫猫使魔助手，进行单人巡逻，当然，这个‘单人’是限于猫猫使魔不算人的情况下，在猫猫使魔已经开始大量生产的当今，像她这种小警察甚至战斗能力都没有用武之地，猫猫使魔的力量足以打趴一个经过战斗训练的成年人。小绿喜欢带着自己的猫猫使魔走在街上，跟树杈上的监控使魔打着招呼，感受街道上祥和的气氛，人们各司其职，安于现状，如果能一直安稳的就这样，波澜不惊的平淡的度过一生，是否是一件正确的事情，有人说过，安全的人生不一定是快乐的，但是小绿觉得，安全才是第一位的，在这个混乱的时代，人们能够过上安稳的生活，就已经是一件美好的事情了。在例行的巡逻结束后，小绿回到了警局门口，刚好看到师傅招呼自己乘上她的警用摩托。师傅把猫猫使魔放进摩托前面的框里，给它戴上了个小安全帽。然后说，"
  magicunion.1272.a:0"‘跟我一起去处理个大案子吧，"
  magicunion.1272.b:0"西三路那户人家里经常吵架的问题。’"

  magicunion.1273.t:0 "战争应急计划"#
  magicunion.1273.desc:0 "南美洲的局势动荡，只要关注局势的人都能看出，战争即将开始。无人可以阻挡它的爆发。而大议会也有许多声音，认为我们应当为战争做好准备。"
  magicunion.1273.a:0"我们需要立刻筹备战争计划"
  magicunion.1273.b:0"无需在意，维持原定计划"

  magicunion.1274.t:0 "会间小憩"#
  magicunion.1274.desc:0 "一些穿着西装革履的官员们在装修精致的小房间里品尝着咖啡。\n一名带着眼镜看似年长的官员，一边搅动着高级的挂耳咖啡一边讲述着。\n\n我们作为坚定的民主人士，应当明白，民主是妥协的艺术，是百花齐放的未来。\n我们不能以民主的名义，去带着有色眼镜，用双重标准去铲除异己，这绝非民主。\n对于那些坚定的持有不同思想的官员，我们不仅不应当逮捕她们，反而应当给予她们在大议会中的席位。\n这样她们就能够通过合法的途径，在大议会之中以民主的方式，来阐述她们的见解，发出她们的声音。\n\n你要明白，我们不该把自己当做自以为是的主角，我们每个人都想成为英雄，但不要自视过高。\n我们最终也并不一定能必然的取得胜利，但我们每个人履行的职责，便能让胜利有更多的可能。\n我们也不该以自己的见解，来替他人做出决定，私自的去定义她人的未来。\n我们所能做的，只是以自己的智慧，和当前的条件，来尽可能的做出看似正确的选择，并以民主的方式将其实现。\n\n她说完后，端起咖啡杯品尝了一口，然后在挂耳咖啡那浓郁的香气中补充道。\n\n最后，也是最重要的事情。记住，女士们。"
  magicunion.1274.a:0"我们，于光明中行"
  
  magicunion.1275.t:0 "暴雨"#
  magicunion.1275.desc:0 "在前往前线的卡车上，新兵们挤在一起，卡车上蒙着沉重的布料，将倾盆的暴雨遮挡在外，而车厢里几乎看不到什么，有人在抚摸着照片，有人在尝试和旁边的人搭话。但所有人都明白，或许，车上的人不再能回家了。\n\n车上有人开始抱怨，她根本不喜欢民主，随后有其他人也开始附和，随即三五成群的说起不知道从哪听来的民主笑话。还有人开始公开称赞反政府游击队的传单的内容，而立马就有另一个新兵站出来反驳，然后新兵们开始谈论起各种政策和理念，七嘴八舌的发表着自己或深思熟虑或临时起意的想法，甚至其中还有公开支持极右翼理念的。\n\n而本该制止这一切的民主官，此时正在一旁微笑地听着新兵们那些近乎于肆意妄为的言论，看着车篷外，天渐渐放晴。如果可以的话，真想把这帮妄谈国事的小混蛋关进警局里去，"
  magicunion.1275.a:0"而不是送她们上战场"
  
  magicunion.1276.t:0 "震颤"#
  magicunion.1276.desc:0 "人的愿望价值多少？或许有些十分的宏大，大到无法计量，听起来如同天方夜谭。而有有些，有些十分的渺小，小到可以忽略不计。无论是为了她人的壮阔理想，还是为了私心的小小奇迹。或是善良的或是宏伟的...\n\n炮弹的声音在耳边炸响。毁灭般的冲击力撕扯着脑海里的思绪。遍体鳞伤的少女，于战壕中猛地惊醒，连滚带爬的冲进掩体中，慌乱的检查着自己的身体，庆幸于自己还活着。她既没有什么理想，也没有什么伟大的目标，而自己只想要再吃一次炸鱼薯条，再喝一口咖啡，哪怕是廉价的，最便宜的那种。\n\n生命的本能让她想要逃走，想要回家。想要回到家人的身边，再抚摸一次家人的脸颊。那个天天在战壕里讲大道理的民主官，也已经没有呼吸了，现在想要逃走的话，根本没有人会阻拦。但随着家人的样貌在脑海中愈发的深刻，她却停下了逃跑的脚步，颤抖着再次捡起了地上的枪。"
  magicunion.1276.a:0"是啊,自己有绝不后退的理由！"

  magicunion.1277.t:0 "烈风"#
  magicunion.1277.desc:0 "在很小的时候，曾经外婆问我，问我长大之后，想做一个什么样的人，我回答说，善良的...以及...长大之后，少女想着，长大之后要去村口的裁缝铺工作，为乡亲们制作好多漂亮的衣服...让人们都能快乐幸福的穿着新衣服生活...\n从回忆中回过神来，那寒冷的高空气流不停地吹过脸颊的鬓发，强袭组件的双翼上悬挂着沉重的轰炸模块，而敌人的战壕已经到了目所能及的距离，透过那泛着魔力流光的护目瞄具，可以看到敌军正在徒劳的奔向掩体。事到如今，就舍弃掉过去那善良的自己吧...将那残存的仁慈与怀中那500KG魔法航弹一同...\n片刻之后，这片渺小的战壕中将不会有任何活人。而现在的我所能做的，便是承担起这深重的罪孽。\n既然那样，我现在，想做到更多自己能做到的事情，拯救更多人…\n魔法少女们、与我们站在同一侧的凡人们，还有…"
  magicunion.1277.a:0"我自己…"

  magicunion.1278.t:0 "抗辩"#
  magicunion.1278.desc:0 "“你是认真的？”一张盖了印章的纸被拍在桌子上，那皮肤如白玉般的手在桌子上拍出了震耳的巨响，精美的实木桌面迸出了可怕的裂纹。“这是战争，不是儿戏！给前线部队配置道德审查委员的观察员简直是在胡闹！”\n“将军，我想你明白，一切都是为了民主”坐在真皮转椅上的官员似乎并不吃压力，拿出漂亮的丝绢擦拭着西装与连裤袜上那温热的卡布奇诺。“如果我们的士兵在战斗中对敌方士兵或是平民，做出了有违道德的行为，那我们还有什么脸面自称民主。”\n“民主！好，就算是为了民主，我认了，但是！什么叫做我们的战争计划必须给道德委员会那帮外行看，还要他们来决定是否可行！她们那帮……那帮……她们懂什么是战争吗！”\n“你可以跟她们解释。”\n“解释个猫猫头啊！那帮道德先锋，连给地上的尸体补枪都不允许！这仗还怎么打，还有，就因为有一些平民在里面，就不允许对村庄的战壕使用魔法洪流。让我的士兵去拿命填，这是人干的出来的事吗！更何况！那些平民根本就不支持我们的民主事业！”\n“将军……"
  magicunion.1278.a:0"你不能只对我们的支持者讲民主。”"

  magicunion.1279.t:0 "因果交织的羁绊"#
  magicunion.1279.desc:0 "随着战事的升级，魔法少女联盟向我们提供了她们力所能及的援助，并将在之后的战斗中，以露丝契亚远征军作为战斗的核心。"
  magicunion.1279.a:0"我们永远是民主的桥头堡"
  
  magicunion.1280.t:0 "灵装升级"#
  magicunion.1280.desc:0 "随着新一代灵装的研发，一种与现代军火同样强大可靠的灵想兵装带来了新的可能，我们不需要像其他国家那样依靠现代科技的火炮与枪械的力量。我们将大规模的升级那些过时的魔法灵装，作为联盟应对威胁的方式。\n而我们的仓库里，现在储存着不少老旧的已经过时的灵想兵装。这些初代灵装，由于性能太差，可能已经派不上用场了。"
  magicunion.1280.a:0"我们需要想办法升级这些灵装"
  magicunion.1280.b:0"就让那些灵装堆在仓库里吧"
  magicunion_1280_a_txt:0"§1魔联和平部§!§Y解锁§!：灵装升级决议"

  magicunion.1281.t:0 "停留的星光"#
  magicunion.1281.desc:0 "在那凡人所无法察觉的，如棱镜般刻反了无数时光的循环中，总会有些事物会为你驻足，就如那夜升日落的星光，它永远在下一个夜晚等待着与你重逢。§Y哪怕一次又一次的错过...§!"
  magicunion.1281.a:0"握紧那星光..."
  magicunion.1281.b:0"让一切，顺其自然..."
  magicunion_1281_txt:0"§P魔法少女联盟§!，将会进入“§1晓美焰-军政路线§!”并会在将来提供帮助。"

  magicunion.1282.t:0 "所照拂的一切"#
  magicunion.1282.desc:0 "在这片星光照拂的大陆上，蕴藏着无数神秘莫测的诡秘与传闻。在那无始无终的幻梦境中，一瞬与永恒的灵魂翻腾不息。庄严肃穆的死神塔耸立于凡人无法抵达的界隙，戏谑的观测着世间的荒延。丛林中的妖精们在时代的剧变中，仍旧奉守着均衡的至圣先理与古老的传统。北方的女皇得到了混沌众神的玩具，亦或是其本身成为了那件精美的玩具。而在大陆东海岸的魔法少女们那传承千年的愿力，可以帮助莉莉安娜恢复一部分对亡灵的控制力，而代价..代价早已被命运所暗中埋下..."
  magicunion.1282.a:0"接纳魔法少女们的愿力"
  magicunion.1282.b:0"还是算了..."

  magicunion.1284.t:0 "政治动荡的盟友"#
  magicunion.1284.desc:0 "今早传来了令人不安的消息，在我们附近的盟友，魔法少女联盟，正在经历一场政治危机...\n玛吉斯之翼拒绝服从她们的大议会，具体的原因对我们而言并不重要。但这很可能导致魔联刚熄灭不久的内战因此重燃，甚至是陷入更糟糕的境地。这可能意味着，我们与魔法少女们那历经数百年风雨的盟约正面临崩裂的风险，或许我们不该干涉盟友的内部事务，但是一切可能恶化的隐患都不可忽视，只有稳定可靠的盟友才能更利于推动我们的事业。\n我们可以扶持一位价值观与我们相近的总统，以避免兄弟阋墙的悲惨局面。"
  magicunion.1284.a:0"我们必须扶持一位可靠的朋友"
  magicunion.1284.b:0"我们不该插手..."
  magicunion_1284_a_txt:0"§C七海八千代§!将成为魔联总统"
  magicunion_1284_b_txt:0"§R这将会面临失去盟友的风险...§!"

  magicunion.1285.t:0 "逃难的女巫们"#
  magicunion.1285.desc:0 "在阿德莱希帝国战败之后，混沌神明收回了祂们的恩典，许多混沌巫师惧怕遭到清算，于是试图得到我们的庇护。只要我们愿意接纳她们，并赦免她们在战争中所犯下的罪行。当然，还有保障她们所携带的私人财产的安全，就愿意协助我们去获取那些本属于帝国的许多重要资产。\n若是我们拒绝她们的请求，那么她们情愿破坏那些资产也不会让任何人得到...\n考虑到今后可能面临的危机，我们或许应当获取这些军用资产来赢取战略优势，但是混沌信徒真的值得信任吗？"
  magicunion.1285.a:0"战败的美少女能有什么坏心思呢~"
  magicunion.1285.b:0"混沌信徒不值得信任..."
  magicunion_1285_a_txt:0"§R这将开启混沌事件链§!"
  magicunion_1285_b_txt:0"§G直接跳过该事件链...§!"

  magicunion.1286.t:0 "军事仓库"#
  magicunion.1286.desc:0 "在女巫们的带领下，我们成功接管了几个大型的军用仓库，这其中有些是阿德莱希军队使用的，还有看守在继续履行上一条命令，随时准备炸毁这些物资以防落入她人手中，在女巫们的帮助下我们和平的完成了仓库的交接。还有些看起来更加老旧，虽然其中大多都是些过时的武器装备，但是也有不少有点意思的魔法物品。\n"
  magicunion.1286.a:0"要装备！新的旧的都带走"
  magicunion.1286.b:0"带走那些魔法物品吧"

