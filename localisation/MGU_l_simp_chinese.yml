  MGU_NPT_game_console:0 "超次元游戏机"
  MGU_NPT_game_console_desc:0 "我们伟大的晓美焰盟主大人，为我们的人民购买了许多的游戏机，这可以让我们的人民在闲暇时刻过上相对快乐充实的虚拟生活。但是要记得建立游戏防沉迷体系。"

