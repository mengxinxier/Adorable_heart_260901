  form_MGU_COUP_Mental_66_desc:0 "这场持久的内战已经让将领级魔法少女们开始厌倦了，甚至逐渐麻木和懈怠。我们现在将有一个特殊的机会，让军队中的猫猫焰使魔们在同一时间，偷偷给所有将领级魔法少女下药！（晓美焰除外）\n然后把她们抓起来强行进行调节和教导！对她们进行，行为上的调整，和精神上的再教育。这样她们就会完全的效忠我们伟大英明的晓美焰盟主了喵~"
  
 
