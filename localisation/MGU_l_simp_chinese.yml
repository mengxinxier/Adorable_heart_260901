  TBMGU_PJ_A8_desc:0 ""

  TBMGU_JHZ_A1:0 "可靠武器"
  TBMGU_JHZ_A1_desc:0 "没有什么比可靠更重要了，对于一个武器来说，可靠就是最重要的！"
  TBMGU_JHZ_A2:0 "量产武器"
  TBMGU_JHZ_A2_desc:0 "完美的武器被高估了，大量生产的可堪一用的武器就够用了，或者说这样才能更高效的让资源发挥作用，包括人力..."
