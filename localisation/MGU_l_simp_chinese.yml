  TBMGU_Pres_Mifu_01:0 "玛吉斯组织合法化"
  TBMGU_Pres_Mifu_01_desc:0 "随着梓美冬成为联盟的合法盟主，总统，领袖。大议会与玛吉斯之间的冲突也算是结束了。而现在，我们需要将玛吉斯之翼合法化，让其再次成为联盟不可分割的一部分。"
  TBMGU_Pres_Mifu_01_txt_a:0 "解锁：§Y玛吉斯之翼研发部门§!"
  TBMGU_Pres_Mifu_02:0 "继续完善doppel技术"
  TBMGU_Pres_Mifu_02_desc:0 "魔女化身技术将被得以推广，半魔女化将作为我们的常规技能在魔法少女部队中普及。"
  TBMGU_Pres_Mifu_02_txt:0 "解锁：§Y玛吉斯之翼研发部门§!"
  TBMGU_Pres_Mifu_03:0 "魔法少女特殊地位"
  TBMGU_Pres_Mifu_03_desc:0 "为了安抚玛吉斯之翼激进派的情绪，我们必须做出这个决定，给予魔法少女更加优厚的特殊地位，一种高于凡人的类似于某些国家中，凡人贵族的特殊地位。"
  TBMGU_Pres_Mifu_04:0 "有限启用“谣言”"
  TBMGU_Pres_Mifu_04_desc:0 "这就像是，规则怪谈。如同都市中的传说，阴影中的鬼魅，完全无视物质世界的制约，将唯心主义在物质世界中的怪诞体现。\n我们将其称之为“谣言”\n其本质或许是一种能量，或者说，现实扭曲者。是一种以特殊规则的形式，将物质世界当做橡皮泥一样肆意揉捏的存在。而触犯了规则的凡人就将受到“谣言”的影响，其后果可能致死，甚至更糟。\n魔法少女的使命就是消灭魔女，魔物，以及这些“谣言”。\n但是在这个动荡不安充满战争与混乱的特殊时期，玛吉斯之翼必须做出一个违反魔法少女使命的科研项目，掌握人工培育“谣言”，甚至将其投放到战场上的能力。"
  TBMGU_Pres_Mifu_04_txt_a:0 "解锁：§Y部署谣言决议§!（我们将可以在§R争夺中§!的我方领土部署谣言）"

  MGU_Pres_Mifu_category:0 "玛吉斯之翼研发部门"
  MGU_Pres_Mifu_des_1:0 "玛吉斯之翼研究活动"
  MGU_Pres_Mifu_des_1_desc:0 "玛吉斯之翼作为魔法少女联盟的科研机构，长期以来有着过高的自主性。这些少女们并不希望大议会过多的影响她们的研究。\n但是鉴于梓美冬的关系，大议会现在可以调用玛吉斯之翼的科研成果。"
  MGU_Pres_Mifu_des_2:0 "影响玛吉斯研究方向"
  MGU_Pres_Mifu_des_2_desc:0 "梓美冬作为玛吉斯之翼的管理者，可以在一定程度上影响玛吉斯之翼的研究方向，让玛吉斯之翼帮助议会研发急需的科学技术。"
  MGU_Pres_Mifu_des_3:0 "在§Y[FROM.Getname]§!部署“谣言”"
  MGU_Pres_Mifu_des_3_desc:0 "将玛吉斯之翼所制造的人工“谣言”投放到战场上，这将会在很大程度上拖慢迟滞敌军的步伐，当那些诡异的存在遍布战场的时候，我们的敌人就像处于规则怪谈的包裹之中，无法正常的推进战线。"
  
  MGU_Pres_Mifu_flag:0 "梓美冬总统"
