  MGU_shoulie_category:0 "魔法少女特殊行动"
  MGU_shoulie_category_desc:0 "魔法少女需要通过狩猎魔物来保护人民大众的生活,\n\n顺带一提QB们现在拥有(§Y[?global.MGU_QB_power]§!)点能量。\n§G由于我们英明的全国领袖晓美焰同志已经砸烂了QB的邪恶计划所以QB能量不会造成影响了§!\n§R晓美焰是这么认为的§!"
  MGU_shoulie:0 "开始狩猎"
  MGU_shoulie_desc:0 "集结一支队伍去狩猎魔物吧。每次成功的狩猎，都会让QB所拥有的负面能量减少§G1§!点。\n\n当QB所拥有的负面能量降低为0就可以一劳永逸的解决魔兽问题了。"
  MGU_shoulie_AI:0 "开始狩猎（AI）"
  MGU_shoulie_AI_desc:0 "集结一支队伍去狩猎魔物吧。每次成功的狩猎，都会让QB所拥有的负面能量减少§G1§!点。\n\n当QB所拥有的负面能量降低为0就可以一劳永逸的解决魔兽问题了。"
  MGU_shoulie_1:0 "军队清剿"
  MGU_shoulie_1_desc:0 "这已经不是一般的魔物问题了，出动军队进行清剿！！所有与魔物有染的涉案人员全图图了！！\n\n这会让QB能量下降§G5§!点。"
  MGU_shoulie_1_AI:0 "军队清剿（AI）"
  MGU_shoulie_1_AI_desc:0 "这已经不是一般的魔物问题了，出动军队进行清剿！！所有与魔物有染的涉案人员全图图了！！\n\n这会让QB能量下降§G5§!点。"

  MGU_shoulie_2:0 "戒严令！！"
  MGU_shoulie_2_desc:0 "魔兽问题已经严重影响到我们社会的稳定，甚至是在光天化日之下，都会有魔兽袭击平民的事情出现。友爱部接到的报警更是无止无休，我们必须采取更加极端的措施。"
  MGU_shoulie_3:0 "寻找失踪人员"
  MGU_shoulie_3_desc:0 "有一些队员在执行任务时失踪了，还有些平民也在魔兽的袭击下被抓走，现在我们已经解决了魔兽的威胁，是时候追查失踪人员的下落了。这对于其她国家来说或许十分困难，无异于大海捞针。但值得庆幸的是我们娴熟的魔法技巧，可以很好地辅助我们完成这项工作。"


  MGU_shoulieweihu:0 "魔兽骚乱"
  MGU_shoulieweihu_desc:0 "我们境内有大量的魔兽与妖怪搞破坏的事件，情报部门并不知道原因，但是我们必须处理这些事情。\n\nQB负面能量获得§R1§!"
  MGU_molifazhen:0 "制造美少女使魔"
  MGU_molifazhen_desc:0 "为了应对越来越多的魔兽和魔物的威胁，中央议会决定使用魔法技术，制造美少女外形的使魔来协助魔法少女们维护城市治安。\n\n会让QB拥有的负面能量减少§G3§!点"
  MGU_molifazhen_1:0 "大量制造美少女使魔"
  MGU_molifazhen_1_desc:0 "随着魔兽与魔物的威胁解除，我国的社会逐步稳定，美少女使魔也在对魔物的斗争中证明了自己的优秀作用。中央议会打算继续制造更多美少女使魔来加入部队代替普通士兵冲锋陷阵。"
  MGU_molifazhen_AI:0 "制造美少女使魔（AI）"
  MGU_molifazhen_AI_desc:0 "为了应对越来越多的魔兽和魔物的威胁，中央议会决定使用魔法技术，制造美少女外形的使魔来协助魔法少女们维护城市治安。\n\n会让QB拥有的负面能量减少§G3§!点"
  MGU_molifazhen_1_AI:0 "大量制造美少女使魔（AI）"
  MGU_molifazhen_1_AI_desc:0 "随着魔兽与魔物的威胁解除，我国的社会逐步稳定，美少女使魔也在对魔物的斗争中证明了自己的优秀作用。中央议会打算继续制造更多美少女使魔来加入部队代替普通士兵冲锋陷阵。"
  MGU_molifazhen_2:0 "大量制造美少女使魔"
  MGU_molifazhen_1_desc:0 "随着魔法工业园区的完成，美少女使魔的生产变得更加便捷，我们不需要再为此支付过多的代价。"
  
  MGU_shoulieOVER:0 "完成狩猎"
  MGU_shoulieOVER_desc:0 "终于，随着强大的魔物们一个个倒下，聚集在魔联境内的魔物们四散而逃了，她们不敢再成建制的活动了，剩下的交给地方警察和当地的魔法少女们处理就好了。终于可以有空偷闲，享受生活了。\n\n"
  MGU_chasm_mobilization:0 "全国动员"
  MGU_chasm_mobilization_desc:0 "我们的战争已经开始，一切和平的幻象都已经荡然无存，城市与村庄随时会化为一片火海，我们必须立刻动员一切可以使用的战力，来维持住脆弱的防线。"
  MGU_chasm_mobilization_AI:0 "全国动员(AI)"
  MGU_chasm_mobilization_AI_desc:0 "我们的战争已经开始，一切和平的幻象都已经荡然无存，城市与村庄随时会化为一片火海，我们必须立刻动员一切可以使用的战力，来维持住脆弱的防线。"
