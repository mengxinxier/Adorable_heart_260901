  MGU_Pres_Mami_category:0 "巴麻美盟主事务"
  MGU_Pres_Mami_des_1:0 "邀请圣杯军事代表团"
  MGU_Pres_Mami_des_1_desc:0 "魔法少女联盟议会于近日召开会议，将正式邀请圣杯军事代表团赴本国访问，开展防务政策研讨、军事装备交流，共同协商南美州当前所面临的安全问题。"
  MGU_Pres_Mami_des_2:0 "邀请圣杯专家参与军备重整(§Y[?global.MGU_Pres_Mami_des_2_zs]/4§!)"
  MGU_Pres_Mami_des_2_desc:0 "巴麻美盟主将正式邀请圣杯军工领域专家赴境，协助开展军备现代化改造，优化装备配置，以应对将来可能爆发的战争。"
  MGU_Pres_Mami_des_3:0 "雇佣圣杯海军陆战队"
  MGU_Pres_Mami_des_3_desc:0 "大议会已通过决议，将雇佣圣杯海军陆战队，协助开展训练、训练一支强大的两栖部队。假若战争爆发，我们将配合海军舰队一同，从海岸线发动袭击。"
