  MGU_D_hidden_idea_Dark_Soul:0 "自由之魂"
  MGU_D_hidden_idea_Dark_Soul_desc:0 "自由铸就我们的国家，连接着我们每一位公民的精神与意志。"
  MGU_D_hidden_idea_Ground_Attack:0 "绝地潜兵"
  MGU_D_hidden_idea_Ground_Attack_desc:0 "觉得眼熟？对民主的迫害在南美洲每分每秒都在发生，除非你做出此生最重要的决定。成为地狱潜兵，深入可怕的战场之中，为我们的民主轰炸机提供坐标！"
  MGU_D_hidden_idea_age_of_empire:0 "民主之光"
  MGU_D_hidden_idea_age_of_empire_desc:0 "民主的火炬在燃烧，照耀着我们的国家，并且将会惠及整个世界，所有人都将沐浴在民主之中。"
  MGU_D_hidden_idea_Artillery_cover:0 "火力掩护"
  MGU_D_hidden_idea_Artillery_cover_desc:0 "火力决定了大多数战术的可行性，火力优势的一方往往有着更多的战术选择。"
  
