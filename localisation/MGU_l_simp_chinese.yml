  MGU_Walpurgisnacht_resolution_6:0 "将领级突击"
  MGU_Walpurgisnacht_resolution_6_desc:0 "集结将领级魔法少女进行一次突击，减少魔女之夜15点力量。\n这将会导致一些魔法少女将领受伤。"
