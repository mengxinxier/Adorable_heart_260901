 #国策
  MTK_com_magic_01:"以我之薪焚尽终末"
  MTK_com_magic_01_desc:"轮回的沙漏不再只为一人翻转，众人高举汇聚成不灭的火炬。这一次，不再有人会孑然一身——我们终将高擎那希望之火，燃尽终末的轮回，照亮回家的前路。"
  MTK_com_magic_02:"以我之身承载万愿"
  MTK_com_magic_02_desc:"对光明的执着渴求，这份并肩同行的信念，将万愿化作改写命运的力量——会将绝望的枷锁挣断。看呐，所有破碎的希望都将在你我怀中重燃，握住我的手吧，回家的道路早已不再黑暗。"
  MTK_com_01:"希望随北极星照耀故乡"
  MTK_com_01_desc:"§P如果有人说怀有希望是错误，我会无数次反驳“不是这样的”，不管到什么时候。§!"
  MTK_com_02:"穹顶之间"
  MTK_com_02_desc:"风暴止息，神滨议会内，新的风暴正在酝酿。"
  MTK_com_04:"万年樱之下"
  MTK_com_04_desc:"那株数年不曾开过一次花的万年樱，至今仍在等待着她们。"
  MTK_com_05:"为天地立心"
  MTK_com_05_desc:"天地本无心，伯西尔的大地生养万物，若有心，必然廓然大公正直无私仁爱一切，我们生于她的怀中，亦立此为心。"
  MTK_com_06:"为生民立命"
  MTK_com_06_desc:"这片土地上的人们受过太多的苦难，旷日持久的战争，饥荒，瘟疫，压迫与剥削消磨着她们对这片大地的爱。不能再这样下去了——绝不能，或许我们无法一瞬之间改变这一切，但至少，让这片土地上的孩子，过的好一点。"
  MTK_com_07:"赤旗迎风飘扬"
  MTK_com_07_desc:"或许有人会认为是魔法少女在统治这片土地，或许是，但也只是暂时的，这片土地终有一天会回到属于她的人民手中。"
  MTK_com_08:"§Q我们都是伯西尔的女儿§!"
  MTK_com_08_desc:"§P欸，小焰有喜欢的人吗，是谁是谁？§!\n§C哼哼，这可是我好不容易才搞到的情报哦§!\n§1等…沙耶香，你在说什么啊！！！§!\n§R吼吼，看来真有啊。§!\n§Y啊啦，真青春呢~§!"
  MTK_com_09:"山川之上"
  MTK_com_09_desc:"如果情况更糟，或者说，如果圆她们失败了，你……\n不会哦，我相信圆和我的同志们，也相信你。\n\n即使局势最终落入冰点，我想，我们也会找到破局之法。"
  MTK_com_10:"我们的约定"
  MTK_com_10_desc:"所以让我们待在一起吧，哪怕只是多一秒也好……\n姐姐虽然不知道世界上的魔法少女们，是否真的能够得救……\n但我不会让你们再擅自离开了!"
  MTK_com_11:"许愿未来"
  MTK_com_11_desc:"未来吗，真是想象不出呢。\n但最起码，我们会期待明天，不是吗？"
  MTK_com_12:"看万里雪飘"
  MTK_com_12_desc:"紧一紧孩子的围巾，让她们戴好手套，和朋友去玩雪吧。\n好大的雪，好兆头啊。"
  MTK_com_13:"看红日既出"
  MTK_com_13_desc:"须晴日，看红装素裹，分外妖娆。"
  MTK_com_15:"欢迎回家"
  MTK_com_15_desc:"姐姐……\n我回来了。\n\n嗯，欢迎回家，忧。"
  MTK_com_16:"执子之手"
  MTK_com_16_desc:"曾几何时，这双小手也开始拥有了追越我们的坚强。"
  MTK_com_17:"再无别离"
  MTK_com_17_desc:"睡吧，伯西尔的孩子们，等你睁眼，你心爱的人儿，会依旧在你身边。\n故事，总会有这么个温暖的结局的。"
  MTK_com_19:"为了被压迫者"
  MTK_com_19_desc:"我们不能对发生在我们四周的暴行袖手旁观。那些仍旧心怀希望的人们，她们的希望应被回应。\n我们将为全世界的被压迫者而战！"
  MTK_com_20:"联络共产国际"
  MTK_com_20_desc:"共产主义的旗帜已高高飘扬于伯西尔的大地，即使目前我们并不打算加入第三国际，但也应该向那长明于世界顶端的红色灯塔致以问候。"
  MTK_com_27:"拉丁美洲的黎明"
  MTK_com_27_desc:"直至长夜褪去，这片土地上的我们必将携手，共筑属于我们的黎明。"
  MTK_com_28:"致以无名的抗争者"
  MTK_com_28_desc:"同胞们，§Q不是伯西尔的人民惧怕死亡，而是死亡惧怕伯西尔的人民。§!\n请记住，我们脚下的每一寸土地都浸透着人民的鲜血，我们无权后退一步。"
  MTK_com_33:"英特耐雄耐尔，就一定要实现！"
  MTK_com_33_desc:"革命尚未成功，同志仍需努力。"


  MTK_com_eco_00:"摆脱圣杯王国经济阴影"
  MTK_com_eco_00_desc:"圣杯王国曾视我国为统御南美的跳板，资本家，掮客，投机者……不眠不休的吸血鬼们蜂拥而至，给我们的土地带来了不可磨灭的苦难。随着资本主义国家经济危机的到来，大批工厂回撤本土，我国的工业生产遭到了极大破坏。一个国家的经济命脉必须被掌握在自己手中，我们会彻底摆脱这片沉重的乌云。"
  MTK_com_eco_01:"重拾五年计划宏伟蓝图"
  MTK_com_eco_01_desc:"我们的同志缔造了这个国家，农民兄弟为我们送来大米，工人同志为我们锻造武器，妇女嬷嬷为我们缝衣纳履……尽管她现在已经千疮百孔，但我相信，我和我的同志们相信，我们能创造的，也一定能再次创造！"
  MTK_com_eco_02:"农业"
  MTK_com_eco_02_desc:"过去，我国农业时常聚焦在以经济作物换取外汇，以外汇进口粮食的循环中。基于此，国内农业基础薄弱，农民生活水平差，幸福指数低。因此，在五年计划的规划中，首先要解决的便是农业问题。"
  MTK_com_eco_03:"重工业"
  MTK_com_eco_03_desc:"圣杯王国为我们带来了钢铁的机械与现代化，但也带来了死亡与压迫。，但在共和国成立的当天，共产主义走向伯西尔大地的当天，死亡与压迫都将不再属于工人阶级。"
  MTK_com_eco_04:"轻工业"
  MTK_com_eco_04_desc:"得益于长久的出口贸易，我国的轻工业即使在圣杯王国搬离资产后仍可较快重建并投入生产，终有一日，我们将不再依赖他国的脸色度日。"
  MTK_com_eco_05:"和泉十七夜的倡议"
  MTK_com_eco_05_desc:"平等与和平终于降临在了这片满目疮痍的土地上，我真诚的希望在久远的未来中，不，是在即将到来的斑斓的明天上，泪水不在因苦难而泣。"
  MTK_com_eco_06:"土地属于农民"
  MTK_com_eco_06_desc:"尽管我们并不倡导暴力收归土地为国有化，但使耕者有其田也是必须的，土地兼并在人民共和国中不允许被发生，土地改革应该全面，高效且快速的进行。"
  MTK_com_eco_07:"最低收购价格"
  MTK_com_eco_07_desc:"交够国家的，留足集体的，剩下的都是自己的，而为了防止恶意哄抬价格，共和国有必要给予农民们一个最低价格以兜底。"
  MTK_com_eco_08:"魔法服务于人民"
  MTK_com_eco_08_desc:"魔法不应该是高高在上的，而是应该服务于人民。"
  MTK_com_eco_09:"民用拖拉机"
  MTK_com_eco_09_desc:"拖拉机是好东西啊，每村几台，每户能用，粮食就好种了嘞。"
  MTK_com_eco_10:"科学种植"
  MTK_com_eco_10_desc:"科学种植是通过合理的管理和技术手段，提高作物产量和质量的农业实践。"
  MTK_com_eco_11:"修筑水利"
  MTK_com_eco_11_desc:"治水即治国，治水之道是重要的治国之道。"
  MTK_com_eco_13:"工厂属于工人"
  MTK_com_eco_13_desc:"从外国资本家手中夺回来的工厂即属于国家，也属于工人，但说到底，它们是工人阶级的财产。国家工会派出技术指导担任厂长指导生产，工厂中的工人也有权利在任何时间向工会检举厂长或自行选举后由国家工会牵头另立厂长。"
  MTK_com_eco_14:"重建生产线"
  MTK_com_eco_14_desc:"修复厂房、调配物资、召回工人，让沉寂的机器重新轰鸣，让断裂的产业链再度衔接——这不仅是工业的恢复，更是国家复苏的信号。"
  MTK_com_eco_15:"大生产运动"
  MTK_com_eco_15_desc:"动员全民参与工农业生产，以团结的力量克服物资短缺的困境。工厂开足马力赶工，田地精耕细作增产，人人各尽其责、各展所长，用劳动的汗水浇灌国家发展的幼苗，凝聚起无坚不摧的奋斗力量。"
  MTK_com_eco_16:"成立重工业人民委员部"
  MTK_com_eco_16_desc:"重工业的发展需要统筹，重工业人民委员部由国家领导，工人自主统筹与建设，充分发挥生产积极性与主观能动性。"
  MTK_com_eco_17:"转向军备生产"
  MTK_com_eco_17_desc:"一场战争正在酝酿着。我们还不知道谁将率先出击，但我们迟早也会成为被攻击的对象。我们必须从现在就开始做准备，以应对这一天的到来。"
  MTK_com_eco_18:"工业现代化"
  MTK_com_eco_18_desc:"引进先进技术、更新生产设备、优化管理体系，推动工业从传统走向现代。淘汰落后产能，发展精密制造与高端产业，让工业生产效率与产品质量实现质的飞跃，跟上时代发展的步伐。"
  MTK_com_eco_20:"千秋理子的畅想"
  MTK_com_eco_20_desc:"姐姐说过，等眼泪只因喜悦与幸福而落的时候，共产主义的世界便不再是遥不可及。"
  MTK_com_eco_21:"生产资料属于生产者"
  MTK_com_eco_21_desc:"生产资料不再属于少数剥削者，而属于创造价值的劳动者。让生产者真正掌控自己的劳动，按劳分配、各取所需，被剥削的命运永不再伯西尔的土地上重演。"
  MTK_com_eco_22:"联通南北"
  MTK_com_eco_22_desc:"过去的魔法少女联盟是城邦联合制，城邦与地区差异极大，南北陆路交通也极不通畅，共和国致力于改变这一现状，或许部分地区仍旧发达，部分地区仍旧贫困，但我们仍会努力共赴共同富裕。"
  MTK_com_eco_23:"国家电网"
  MTK_com_eco_23_desc:"第二次工业革命后，居民用电问题早已不可忽视，铺设国家电网，村村有电用，户户能用电。"
  MTK_com_eco_24:"纺织与食品加工"
  MTK_com_eco_24_desc:"纺织业与制造业仍是我们引以为傲的产业链，我们应该发挥这项长处，为五年计划添砖加瓦。"
  MTK_com_eco_25:"高奢产品的制造与出口"
  MTK_com_eco_25_desc:"帝王玉，紫水晶大理石……这些仅属于地球母亲赐予伯西尔大地的独一无二的器物，如今将化作建设人民共和国的重要力量。"
  MTK_com_eco_26:"解决“民生刚需”"
  MTK_com_eco_26_desc:"把衣食住行、医疗教育等民生刚需放在首位，集中力量破解民众最关切的难题。让人人有饭吃、有衣穿、有房住、有病能医，让民生保障不再是口号，而是触手可及的幸福。"
  MTK_com_eco_28:"团结的大地"
  MTK_com_eco_28_desc:"公平的土地政策让农民安居乐业，协同的农业发展让区域互利共赢。这片土地上，没有剥削与对立，只有劳动者的团结与协作，让大地不仅孕育粮食，更孕育凝聚人心的磅礴力量。"
  MTK_com_eco_29:"和谐的社会"
  MTK_com_eco_29_desc:"以公平分配保障权益，以互助友爱化解矛盾。工人与农民并肩，城市与乡村协同，伯西尔的人民各尽其能、各得其所。"
  MTK_com_eco_30:"美丽的国家，尊严的祖国"
  MTK_com_eco_30_desc:"\n§Q人民的共和国将尊严无比，因为这是伯西尔的人民在亲手创造。§!"
  MTK_com_spy_06:"人民战争的汪洋大海"
  MTK_com_spy_06_desc:"真正的铜墙铁壁是什么？是群众，是千百万真心实意地拥护革命的群众。这是真正的铜墙铁壁，什么力量也打不破的，完全打不破的。"
  MTK_com_spy_07:"学习三大纪律八项注意"
  MTK_com_spy_07_desc:"行动听指挥、不拿群众一针一线、一切缴获要归公，这是人民红军纪律建设的基本原则，我们应该学习她，运用她，用她打造一支属于伯西尔人民的红色革命军队。"
  MTK_com_spy_08:"群众是最好的宣传队"
  MTK_com_spy_08_desc:"宣传思想工作的服务对象是群众、根基力量在群众，根本目的在于宣传群众、教育群众、引导群众、服务群众，做宣传工作本质上就是做群众工作。反过来，群众认可我们，相信我们，我们的宣传自然而然就到位了。"
  MTK_com_spy_16:"伯西尔中央情报委员部"
  MTK_com_spy_16_desc:"现代战争中，情报工作必不可少，组建情报部门以应对可能的危机。"
  MTK_com_spy_17:"收编前玛吉斯成员"
  MTK_com_spy_17_desc:"解散玛吉斯后，其中有一批很优秀的情报人员可为我们所用。"
  MTK_com_spy_18:"扩大伯西尔中情部"
  MTK_com_spy_18_desc:"我们的情报部门已经成长的非常可观了，扩编改组，使其成为战场上的一只重要力量。"
  MTK_com_army_01:"伯西尔工农红军"
  MTK_com_army_01_desc:"工农红军全时待战，随时能战，战之必胜。任何胆敢挑战我国主权完整与国土安全的行为都将遭到迎头痛击。"
  MTK_com_army_02:"人民革命军事委员会"
  MTK_com_army_02_desc:"[MGU.GetNameDef]建立统一的军队，受中央人民政府人民革命军事委员会统率，实行统一的指挥，统一的制度，统一的编制，统一的纪律。"
  MTK_com_army_03:"守好每一寸土地"
  MTK_com_army_03_desc:"我们的祖国不容玷污，我们的土地不容许他人侵略。"
  MTK_com_army_04:"扩编军事委员会"
  MTK_com_army_04_desc:"共和国建立后，为加强伯西尔工农红军正规化、现代化建设。我们需要扩编并改组人民革命军事委员会。"
  MTK_com_army_05:"做好每一项准备"
  MTK_com_army_05_desc:"不能在战争开始时才做准备，从现在开始，以备战未来所有可能的威胁。"
  MTK_com_army_06:"常规武器优先"
  MTK_com_army_06_desc:"我们不能过于依赖魔法少女本身的战略价值，动员群众，组建起伯西尔人民的军队。"
  MTK_com_army_07:"现代化军事工业"
  MTK_com_army_07_desc:"国防和军队现代化是巩固人民政权的战略支撑，要想完成这一任务现代化的军事工业是必不可少的。"
  MTK_com_army_08:"国防民生两不误"
  MTK_com_army_08_desc:"人民和军队总得先有饭吃有衣穿，才能打仗，否则虽有枪炮，无所用之。"
  MTK_com_army_09:"工厂就是前线"
  MTK_com_army_09_desc:"每多一颗子弹，前线的士兵就能少流一滴血。"
  MTK_com_army_10:"现代化装甲部队"
  MTK_com_army_10_desc:"装甲部队，陆军地表力量的最强代表，如果我们的陆军要想跟上时代，发展先进且优良的装甲部队是必不可少的。"
  MTK_com_army_11:"大规模坦克作战"
  MTK_com_army_11_desc:"坦克作为现代战争必不可少的重要武器，应当被大规模推广，广泛应用于作战当中。"
  MTK_com_army_12:"战争巨兽"
  MTK_com_army_12_desc:"如果要评价这世界上最强大的陆战兵器，我会说：中型自行反坦克炮。"
  MTK_com_army_13:"现代化炮兵部队"
  MTK_com_army_13_desc:"过去我们生产过一些落后的圣杯式火炮，但质量现在无疑已经跟不上时代，我们必须生产更先进的火炮，培养更专业的炮兵，建设属于自己的现代化炮兵部队。"
  MTK_com_army_14:"重视火炮战略支援"
  MTK_com_army_14_desc:"倾斜弹药，为步兵或装甲突击扫清障碍"
  MTK_com_army_15:"支援前线"
  MTK_com_army_15_desc:"炮兵部队应尽可能的发挥自己的优势，为战争取得优势。"
  MTK_com_army_16:"现代化步兵部队"
  MTK_com_army_16_desc:"现代化的军事理论配合上我们在过去战争中积累与学习的战术，必将使我军步兵部队的战斗力在世界上处于领先地位！"
  MTK_com_army_17:"学习“三三制”战术"
  MTK_com_army_17_desc:"“三三制”战术出于中原大地，由[PRC.GetName]115师师长林喵提出，是中国红军步兵训练大纲中的一种步兵“班组突击”战术。这种战术值得我们进行学习并本土化运用，这将对我们的军队建设大有益处。"
  MTK_com_army_18:"保障运输"
  MTK_com_army_18_desc:"后勤运输需要得以保障，前线部队才能发挥出最大的优势。"
  MTK_com_army_19:"现代战争"
  MTK_com_army_19_desc:"现代战争的武器技术和战略战术正在不断进步，一定要赶上和超过世界先进水平。"
  MTK_com_army_20:"人海突击"
  MTK_com_army_20_desc:"我们伯西尔民族有同自己的敌人血战到底的气概。我们的人民军队必须把这种精神贯彻到底。"
  MTK_com_army_21:"优势火力"
  MTK_com_army_21_desc:"倾泻炮火而非投入士兵来制敌。人命关天，但子弹价廉。"
  MTK_com_army_22:"决战计划"
  MTK_com_army_22_desc:"得胜已是定局，何必急功近利。"
  MTK_com_army_23:"国士无双"
  MTK_com_army_23_desc:"伯西尔工农红军是人民群众自发地或在先进阶级领导下建立的并为人民利益而战斗的军队。是由无产阶级领导、以马克思主义理论作指导的军队是新型的人民军队，是全心全意为人民服务的人民军队。只要有人民群众的拥护，我们的军队在哪里都将战无不胜！"

  MTK_com_air_01:"创立空军"
  MTK_com_air_01_desc:"我们现在的空军部队还十分稀缺，而发达国家早就利用空军取得了各种各样的胜利。"
  MTK_com_air_02:"空军基地建设"
  MTK_com_air_02_desc:"广泛建设空军基地，有利于我们发展空军。"
  MTK_com_air_03:"伯西尔空军军事学院"
  MTK_com_air_03_desc:"成立空军军事学院，能够让我们拥有更多优秀的飞行员。"
  MTK_com_air_05:"人民空军"
  MTK_com_air_05_desc:"我们的军队是人民的军队，我们的空军是人民的空军。"
  MTK_com_air_06:"鹰击长空"
  MTK_com_air_06_desc:"鹰击长空，鱼翔浅底，万类霜天竞自由。"
  MTK_com_air_07:"以呼啸致意"
  MTK_com_air_07_desc:"我们的天空将以呼啸致意我们守护的土地"
  MTK_com_air_08:"现代空战"
  MTK_com_air_08_desc:"自双翼飞机在战壕上空搏击以来，空战的历史就由来已久。现今的空战究其本质是工业实力的比拼，利用高性能快节奏对敌人实施昼夜不停的持续作战。我们必须认清这一事实并制定相应的规划。"
  MTK_com_air_09:"国产强击机"
  MTK_com_air_09_desc:"自主研发强击机对我们的空军发展十分必要。"
  MTK_com_air_10:"国产歼击机"
  MTK_com_air_10_desc:"自主研发歼击机对我们的空军发展十分必要。"
  MTK_com_air_11:"国产战略轰炸机"
  MTK_com_air_11_desc:"自主研发战略轰炸机对我们的空军发展十分必要。"
  MTK_com_air_12:"狐步舞者"
  MTK_com_air_12_desc:"银狐战机得以迭代，国产的狐步舞者战机将翱翔于伯西尔的蓝天。"
  MTK_com_air_13:"共和国的天空"
  MTK_com_air_13_desc:"“飞了过去没有飞过的航线，到了过去没有到过的区域”，人民空军将如同雄鹰和大雁一般飞跃崇山峻岭，冲向蔚蓝大洋的深处，冲向我们从未到达的高度。"

  MTK_com_sea_01:"殖民者的遗产"
  MTK_com_sea_01_desc:"圣杯王国为控制我国海运，在沿海掠夺并修筑了多处港口，我们应该利用这一点，发展我们自己的海军。"
  MTK_com_sea_02:"海军基地建设"
  MTK_com_sea_02_desc:"建造更多的海军基地，我们需要这些船坞。"
  MTK_com_sea_03:"伯西尔海军军官学院"
  MTK_com_sea_03_desc:"成立海军军事学院，能够让我们拥有更多优秀的海军军人。"
  MTK_com_sea_05:"人民海军"
  MTK_com_sea_05_desc:"我们的军队是人民的军队，我们的海军是人民的海军。"
  MTK_com_sea_06:"驰掣大西洋"
  MTK_com_sea_06_desc:"南大西洋不应该是圣杯王国的后花园，我们要捍卫我们自己的领海。"
  MTK_com_sea_07:"海上壁垒"
  MTK_com_sea_07_desc:"组建和研发现代化战列舰，对我们的海军发展十分重要。"
  MTK_com_sea_08:"现代海战"
  MTK_com_sea_08_desc:"曾记否，到中流击水，浪遏飞舟？"
  MTK_com_sea_09:"发展船舶工业"
  MTK_com_sea_09_desc:"从民用船舶工业着手，一步步发展我们没有的造船工业"
  MTK_com_sea_10:"存在舰队"
  MTK_com_sea_10_desc:"组建和研发现代化海军编队，对我们的海军发展十分重要。"
  MTK_com_sea_11:"潜艇编队"
  MTK_com_sea_11_desc:"组建和研发现代化潜艇，对我们的海军发展十分重要。"
  MTK_com_sea_12:"航母编队"
  MTK_com_sea_12_desc:"组建和研发现代化航母，对我们的海军发展十分重要。"
  MTK_com_sea_13:"共和国的海洋"
  MTK_com_sea_13_desc:"殖民主义自海洋上来，几乎绝大多数侵略、割地、赔款都是从海上方向开始的。面向海洋则兴，放弃海洋则衰，海权是决定我们人民共和国和伯西尔民族命运的重要因素。阔步深蓝，我们强大的现代化海军正在加速成长，列强们的舰队在共和国的领海肆意妄为的时代一去不复返了！"



