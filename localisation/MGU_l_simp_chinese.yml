  TBMGU_MZ_0_J04_desc_F:0 " "
  TBMGU_MZ_0_F:0 "强化中央议会"
  TBMGU_MZ_0_desc_F:0 "难以置信，我们胜利了！晓美焰向魔联议会交还了她的权力，而我们誓要为了一个更民主、更美好的魔法少女联盟奋斗！"
  
  TBMGU_MZ_0_J01:0 "巴麻美赢得大选"
  TBMGU_MZ_0_J01_desc:0 " "
  TBMGU_MZ_0_J02:0 "七海八千代赢得大选"
  TBMGU_MZ_0_J02_desc:0 " "
  TBMGU_MZ_0_J03:0 "梓美冬赢得大选"
  TBMGU_MZ_0_J03_desc:0 " "
  TBMGU_MZ_0_J04:0 "和泉十七夜赢得大选"
  TBMGU_MZ_0_J04_desc:0 " "
  TBMGU_MZ_0:0 "强化中央议会"
  TBMGU_MZ_0_desc:0 "难以置信，我们胜利了，我们击败了所有分裂势力，并且还成功从军部手中拿回了权力。我们誓要为了一个更民主、更美好的魔法少女联盟奋斗！"
  TBMGU_MZ_1:0 "请求圣杯王国援助"
  TBMGU_MZ_1_desc:0 " "
  TBMGU_MZ_2:0 "改革税制"
  TBMGU_MZ_2_desc:0 "联盟长期实行着落后的税收制度，偷税漏税屡禁不止、苛捐杂税层出不穷，在全国进行税制改革，规范征税制度刻不容缓"
  TBMGU_MZ_3:0 "社会分配再调节"
  TBMGU_MZ_3_desc:0 "我们不得不承认，在很长的一段时期内，我们忽略了底层人民的利益。企业肆无忌惮的扩张与盲目的逐利行为让联盟内部的贫富差距急速扩大，我们必须扭转这种行为，让人民能够享受到社会变革发展的红利"
  TBMGU_MZ_4:0 "振兴市场经济"
  TBMGU_MZ_4_desc:0 ""
  TBMGU_MZ_5:0 "直面财阀"
  TBMGU_MZ_5_desc:0 "财阀与他们的巨型企业，一直是联盟最大的金主与害虫。他们一方面资助国家，另一方面却肆意欺压小企业与人民。我们不能当一辈子的骑墙派，是时候决定他们未来的命运了"
  TBMGU_MZ_6:0 "与财团合作"
  TBMGU_MZ_6_desc:0 " "
  TBMGU_MZ_7:0 "铲除买办份子"
  TBMGU_MZ_7_desc:0 " "
  TBMGU_MZ_8:0 "重组议会"
  TBMGU_MZ_8_desc:0 "联盟议会，在早期设立是为了统筹不同地区的高级魔法少女之间的意见，决定整个联盟的对外行动。可是，它并不代表任何普通魔法少女公民的意见。\n现如今，对于联盟议会的改革势在必行，我们必须为了一个更加能够代表民众声音的议会而奋斗。"
  TBMGU_MZ_9:0 "唤醒人民之声"
  TBMGU_MZ_9_desc:0 "内战摧毁了联盟的民主化进程，严苛的管控也让人民为表达自己的意见感到畏首畏尾，我们会改变这种情况，让人民敢于说出自己的真实意见"
  TBMGU_MZ_9_txt:0 "解锁§Y民主事业§!决议"
  TBMGU_MZ_11:0 "票选人民议员"
  TBMGU_MZ_11_desc:0 "联盟国土辽阔，人口分布松散，这决定了我们暂时无法实行直接选举，而是要通过选出代表议员层层进行选举，是时候在全国开展这种选举了\n当我们的议会中有了为人民群众说话的议员\n那些左翼派系必然会受到影响"
  TBMGU_MZ_12:0 "建立权力监督"
  TBMGU_MZ_12_desc:0 "虽然晓美焰向议会归还了权力，可她的所作所为仍然在警示着我们：一个没有权力监督体系的民主制度注定是不长久的。当然，建立完善这个体系会是一个极其漫长的过程，而我们已经准备好了。"
  TBMGU_MZ_13:0 "与军队合作"
  TBMGU_MZ_13_desc:0 "不论是在历史上还是现今，军队都是威胁民主制度的一大主要因素，而要确保军队能够服从民主制度与我们管理，我们将会与军队建立联系，尤其是军队中支持我们的将军们"
  TBMGU_MZ_14:0 "铁腕呵护下的民主之花"
  TBMGU_MZ_14_desc:0 "虽然我们非常想在此时此刻实行最为完善的民主制度，可是我们的现实处境却阻碍着我们——内有国贼，外有强敌，我们必须坚定我们的立场，苦一苦人民，暂时进行权力集中，捍卫我们新生的民主！"
  TBMGU_MZ_15:0 "铲除公社"
  TBMGU_MZ_15_desc:0 "莉兰迪亚的野火，那熊熊燃烧的烈焰，她们那炙热的决心足以燃尽一切，一切旧秩序和古老的传统。而我们必须在那之前制止这急切的变革。让让我们的世界以较为温和的方式，在旧秩序的引领下稳定的航行，在恰当的时候缓步的推行利于公民们的善举。"
  TBMGU_MZ_16:0 "摄取王冠"
  TBMGU_MZ_16_desc:0 "莉兰迪亚的狼王，索拉娜，窃取了亡灵公主力量的背叛者。她那狂野的掠夺令我们文明的议会感到不安。为了我们文明的延续，我们应当在恰当的时机，抢先一步将其制止，阻止她的狼子野心。为了文明的传承，为了公民们的人身与财产安全。"
  
  TBMGU_ZZ_01:0 "行于无惘之路"
  TBMGU_ZZ_01_desc:0 "在梦中感受到的那份温暖的心情。\n在回想起成为魔法少女的理由的现在，我明白了那个理由……\n再等一下……不管多困难的道路，\n绝对不会放弃，我一定会找到你的"
  TBMGU_ZZ_01_a_flag:0 "战争应急计划"
  TBMGU_ZZ_01_b_flag:0 "诸事顺遂"
  TBMGU_ZZ_02:0 "掌中的温度"
  TBMGU_ZZ_02_desc:0 "重叠的手中传来的温暖告诉我，\n没关系，我们并不是孤身一人。\n然后，希望有一天……\n这份温暖能融化所有的不安。"
  TBMGU_ZZ_03:0 "多彩的我们"
  TBMGU_ZZ_03_desc:0 "那里几乎看不到什么\n到处都铭刻着时间 有人走在那段时间的中间\n那脚印的形状 经过的空气中的香气\n看到的背影 一定是很漂亮的彩虹色"
  TBMGU_ZZ_04:0 "不屈的信念"
  TBMGU_ZZ_04_desc:0 "愿望什么的，是十分渺小的呢。那些出于好心，\n结果以失败告终的也不在少数...所以，我下定了决心。\n这次不能失败，为了联盟能够存在下去。\n这是我们，绝不屈服的信念。"
  TBMGU_ZZ_05:0 "纯白的未来"
  TBMGU_ZZ_05_desc:0 "今后将要开始的民主的未来，现在依然是一片空白\n所以，一起对各种事物时而感到高兴、时而感到惊讶\n一点一滴地添上鲜明的色彩吧\n为了描绘出满溢色彩的幸福未来"
  TBMGU_ZZ_06:0 "以解放为救赎"
  TBMGU_ZZ_06_desc:0 "如果世界被黑暗侵蚀就用光芒照亮，世界只有光明就给予阴影。\n认识到了只有这样，救赎才能产生。\n我们给予魔法少女和其它人们光明和阴影。\n染上了悲伤的人们就让我们来亲手解放吧。"
  TBMGU_ZZ_07:0 "因果交织的羁绊"
  TBMGU_ZZ_07_desc:0 "我们曾一同放逐了黑暗的时代，以那锐利的剑刃斩裂了无知的旧夜,以那勇猛的枪炮将击破噩梦的袭扰,以那飞舞的魔法长枪将一切民主的威胁贯穿,以那闪亮的盾徽彷徨时间，不断纺织新的因果。"
  TBMGU_ZZ_08:0 "凝心愿为璀璨"
  TBMGU_ZZ_08_desc:0 "或许会发生的日常生活，怀念也无法回到的过去\n即使被心中的眷恋所阻碍，也只能向着未来前进\n即使有艰辛、即使会痛苦，魔法少女们也不会放弃，而凡人辅助军们，亦会跟随在其身旁。\n向着前方的光明，向着唯一被被拯救的未来前进"
  TBMGU_ZZ_09:0 "枪口绽放之花"
  TBMGU_ZZ_09_desc:0 "“不为满足自己的梦想，也不为拯救别人\n这份力量是为了活下去而签约获得的。\n正是因此，我希望你们作出无悔的选择\n这是我现在的愿望。成为你们的朋友，我很开心。”"
  TBMGU_ZZ_10:0 "圣洁断罪之光"#
  TBMGU_ZZ_10_desc:0 "想要靠近现已不在的人们\n没有意识到那本身就已经是崇高的祈祷，只是彷徨地寻找着答案\n“认可自己吧”\n通过这句话，终于找到了自己的祈祷应有的状态"
  TBMGU_ZZ_11:0 "十指相扣的那日"
  TBMGU_ZZ_11_desc:0 "仍然记得，在分裂内战时关系可谓是无比的恶劣，而现在各派系之间也算不上是关系很好\n然而却能在民主的光辉下如此相处，是因为有着能够联结少女们的信念\n在魔法少女大议会这星光色的彩灯照耀下，人们会回想起某日的誓言\n想要守护人们的笑颜，十指相扣的那一天。"
  TBMGU_ZZ_12:0 "在凋零中盛放"
  TBMGU_ZZ_12_desc:0 "征服，征服是非常困难的事物，它要求你去践踏这个世界，任何与你不同或不属于你的部分，然后以你自己的意志去重塑。而民主对此又会有何选择，是以文明之名去布满世界，还是保守的维护自己，既然那样，我现在，想做到更多自己能做到的事情，拯救更多人…"
  TBMGU_ZZ_13:0 "永劫荆棘之冠"
  TBMGU_ZZ_13_desc:0 "曾经共度的时光，如今已变成遥远的回忆，\n逝者在守望，生者要向未来继续前进\n虽然，已经不能继续在同一个时代共同行走\n往昔的回忆，也绝不会褪色"
  TBMGU_ZZ_14:0 "对生存的执念"
  TBMGU_ZZ_14_desc:0 "在那年幼的日子里祈求的，是既现实又消极的结局\n而到稍微长成了大人，酸甜苦辣都已尝过的我\n祈求了相较往昔还要更加幼稚的，理想而幸福的末后\n面对逐渐降落的积雪亦能微笑的，不会有任何人受苦的圆满结局。但是战斗临近的现实迫在眉睫，所以我祈祷…如果和平安全的时间一直持续下去就好了…"
  TBMGU_ZZ_15:0 "秩序裁定之雨"
  TBMGU_ZZ_15_desc:0 "通过枪械传递的触感，无数次地把我拉回过去的日子，那场混乱的联盟内战。\n让人想起她们在背后的最后一刻都不曾放弃的遗念。\n请你向我发怨言，用各种语言责问我吧\n因为现在的我们不需要鼓励和温暖，当白昼悄然离去时，愿有冷雨落下。"
  TBMGU_ZZ_16:0 "终将逝去的少女"
  TBMGU_ZZ_16_desc:0 "如同风中残烛的命运……发现自己背负的宿命时\n有个能将内心交托的对象便令人安心\n一封一封地写下的心情，是其证明\n我将现在的真心话、未向任何人透露的这份遗志，托付给你"
  TBMGU_ZZ_17:0 "沐浴在盛夏的夕阳"#
  TBMGU_ZZ_17_desc:0 "染红远海的崖上夕阳，似要粉饰般传来夜香花飘香\n这里仿佛梦境之中……还是说，便确实是在梦中？\n可是尽管如此，胸中的悸动也不会改变吧\n即使在那醒转之后，即使我们仍在梦中"
  TBMGU_ZZ_18:0 "未经初恋的亡魂"#
  TBMGU_ZZ_18_desc:0 "还不知恋爱为何物的少女们\n传达爱意的巧克力，指示她们恋情的前程\n许望的同时获得了奇迹，还请让初春的风儿造访\n她们已成泡沫的生命"
  TBMGU_ZZ_19:0 "只属于此时的宝物"
  TBMGU_ZZ_19_desc:0 "落日的余晖，将夏天的云朵染成了暗红色\n追来的深蓝，温柔地将一天引向结尾\n徐徐拂过发梢的清风、令人舒畅的海浪声\n这让人看到恍惚的景色，正是无可比拟的宝物"
  TBMGU_ZZ_20:0 "为战斗的少女保佑"#
  TBMGU_ZZ_20_desc:0 "她们的过去——愿望——战斗的理由——都尽不相同\n尽管如此，那一天她们都共同仰望天空，共同露出了笑容\n坚信着前行的道路必将重叠\n祈愿着未来必然明亮无比"

  TBMGU_MZ_GY_1:0 "魔联工业部"
  TBMGU_MZ_GY_1_desc:0 "想要国家的现代化，就必须要先工业化。而在这方面魔联已经推迟了许久的时间。"
  TBMGU_MZ_GY_1a:0 "讨论工作制问题"
  TBMGU_MZ_GY_1a_desc:0 "长期以来，联盟的工作制都是一片混乱。财阀企业肆无忌惮地压榨工人的工作时间，我们必须明确工人们的工时，以整治这种乱象。"
  TBMGU_MZ_GY_2:0 "资源开发计划"
  TBMGU_MZ_GY_2_desc:0 " "
  TBMGU_MZ_GY_3:0 "开发丛林"
  TBMGU_MZ_GY_3_desc:0 " "
  TBMGU_MZ_GY_4:0 "瑰丽丛林"
  TBMGU_MZ_GY_4_desc:0 " "
  TBMGU_MZ_GY_22:0 "开采森林资源"
  TBMGU_MZ_GY_22_desc:0 " "
  TBMGU_MZ_GY_5:0 "欧洲建设技术"
  TBMGU_MZ_GY_5_desc:0 " "
  TBMGU_MZ_GY_6:0 "镜界开发"
  TBMGU_MZ_GY_6_desc:0 " "
  TBMGU_MZ_GY_7:0 "整合工业资源"
  TBMGU_MZ_GY_7_desc:0 " "
  TBMGU_MZ_GY_7_txt:0 "$MGU_Heart_Democracy_ns_intro$\n战略资源获取率:§G+25.00%§!\n"
  TBMGU_MZ_GY_8:0 "野火精华"
  TBMGU_MZ_GY_8_desc:0 " "
  TBMGU_MZ_GY_9:0 "全面探索"
  TBMGU_MZ_GY_9_desc:0 " "
  TBMGU_MZ_GY_10:0 "投资工业区"
  TBMGU_MZ_GY_10_desc:0 "工厂冒出的浓烟，与铁水的流动，再加上凡人辛劳的汗水铸就成现代工业的造物。就如同魔法少女的奇迹，在这个工业发达时代，凡人们也有了属于她们的强大力量。"
  TBMGU_MZ_GY_11:0 "现代化军工业"
  TBMGU_MZ_GY_11_desc:0 "流水线化的武器生产将会取代以前的小作坊。"
  TBMGU_MZ_GY_12:0 "先进的枪械"
  TBMGU_MZ_GY_12_desc:0 "从欧洲引进先进的枪械生产工艺，这些武器在欧洲或许已经过时，但是在南美洲这片边缘之地，仍然是强大先进的武器。"
  TBMGU_MZ_GY_13:0 "增加社会保障"
  TBMGU_MZ_GY_13_desc:0 "有了民主的社会保障，我们的公民们就可以没有后顾之忧的投入到生产与建设之中。"
  TBMGU_MZ_GY_13_tt:0 "§Y$MGU_undiversified_economy_modifier$§!追加效果：\n生产效率上限:§G+20.00%§!\n生产效率增长:§G+20.00%§!\n\n"
  TBMGU_MZ_GY_14:0 "现代化管理"
  TBMGU_MZ_GY_14_desc:0 "从圣杯王国前来的官员们，教会了我们如何民主的管理一个国家，史密斯专员在政府采购方面的教导更是给我们打开了民主的新大门。"
  TBMGU_MZ_GY_14_tt:0 "§Y$MGU_undiversified_economy_modifier$§!追加效果：\n工厂产出:§G+20.00%§!\n\n"
  TBMGU_MZ_GY_15:0 "新建娱乐行业"
  TBMGU_MZ_GY_15_desc:0 "我们需要新建一些民主的娱乐行业，来维护和彰显我们民主的意志，当民主的人民在经过了一整天的民主工作之后，她们需要民主娱乐行业来放松她们的民主精神，以维持她们的民主情绪，和对民主事业的民主热忱。"
  TBMGU_MZ_GY_16:0 "进口奢侈品"
  TBMGU_MZ_GY_16_desc:0 "我们需要一些民主的奢侈品，来褒奖我们民主的公民们！我们民主的公民们为了我们的民主事业奉献了她们民主的努力！所以我们应当回报她们民主的奢侈品来奖励她们对民主的贡献！"
  TBMGU_MZ_GY_17:0 "崩裂的未来"
  TBMGU_MZ_GY_17_desc:0 "我们的民主公民们，想要在一起组建一辈子的民主国家。但是有一些敌人！她们想要破坏我们的民主！所以我们必须未雨绸缪进行民主的提前预防！"
  TBMGU_MZ_GY_18:0 "军用电台"
  TBMGU_MZ_GY_18_desc:0 "我们必须使用民主的设备来保护我们民主的国土！这样我们民主的公民才能享受民主的生活！"
  TBMGU_MZ_GY_19:0 "工业部署"
  TBMGU_MZ_GY_19_desc:0 "有些时候，只依靠我们的民主黄油和民主面包是不够的。我们还需要民主战备！来进行必要的民主战争！"
  TBMGU_MZ_GY_20:0 "超级驱逐舰"
  TBMGU_MZ_GY_20_desc:0 "我们的民主海军必须要提上日程了，我们民主的军队需要民主的军舰来投送！在民主国家的帮助下，我们将会制造出强大的民主战舰！"
  TBMGU_MZ_GY_21:0 "民主科学家"
  TBMGU_MZ_GY_21_desc:0 "作为民主国家，有许多的民主人士愿意帮助我们，共同开展南美的民主事业，我们可以邀请一些民主科学家来开展我们的科技现代化。"
  TBMGU_MZ_GY_23:0 "民主的天空"
  TBMGU_MZ_GY_23_desc:0 "为了捍卫民主的力量，我们需要从民主国家学习先进的空战理论，来训练我们的空军的战术。"
  
  
  TBMGU_MZ_JG_1:0 "军工改革"
  TBMGU_MZ_JG_1_desc:0 "自从工业革命以来，强大的魔法师横扫千军的时代已经过去了，我们需要先进的重火力工业火炮才能在未来的战争中捍卫民主。"
  TBMGU_MZ_JG_2:0 "魔法少女统帅部"
  TBMGU_MZ_JG_2_desc:0 "随着内战的结束，我们需要一个新的统帅部来指挥我们的民主部队，在统帅部的管理下，我们的军队将会为一个又一个的国家带去民主。"
  TBMGU_MZ_JG_3:0 "灵装利刃"
  TBMGU_MZ_JG_3_desc:0 "先进的民主科技，加上强大的民主灵装，这是民主的创新，民主的意志，我们民主的利刃将会划破一切遮挡民主的阴霾！"
  TBMGU_MZ_JG_4:0 "强袭魔女"
  TBMGU_MZ_JG_4_desc:0 "在引进了外国的民主科学技术之后，我们是时候对强袭组件进行民主的现代化改造了。"
  TBMGU_MZ_JG_5:0 "灵核调整"
  TBMGU_MZ_JG_5_desc:0 "通过对魔法少女的灵核进行调整，让魔法少女在战场上发挥的更好。"
  TBMGU_MZ_JG_6:0 "为民主服役"
  TBMGU_MZ_JG_6_desc:0 "在全国各地开展魔法少女招募的活动，鼓励有天赋的少女们为民主服役，成为魔法少女！\n走上，民主的战场！"
  TBMGU_MZ_JG_7:0 "传播民主"
  TBMGU_MZ_JG_7_desc:0 "当我们看向南美时，我们很不幸地看到了许许多多林立的非民主政权，它们仍然压迫着自己的国家的民众。作为南美的民主灯塔，我们绝不会坐视这种情况继续下去，现在就开始向南美传播我们的民主吧！\n我们需要让整个南美的每一个国家都得到民主的滋养！如果那些独裁政府拒绝接受民主的领导，那么，民主就会主动找上她们！"
  TBMGU_MZ_JG_8:0 "军团战争"
  TBMGU_MZ_JG_8_desc:0 "那邪恶的军政府！那些邪恶的雇佣兵在镇压民主人士的集会，我们必须对民主人士出手相救！"
  TBMGU_MZ_JG_9:0 "爱国者之枪"
  TBMGU_MZ_JG_9_desc:0 "我们需要让每一个民主的公民都得到一把枪，这样她们才能在危难时刻为民主挺身而出"
  TBMGU_MZ_JG_10:0 "夜莺安息之日"
  TBMGU_MZ_JG_10_desc:0 "那些亡灵怪物们完全拒绝任何的民主声音，我们必须将民主之声灌输到她们的耳朵里！如果她们还有耳朵的话。\n\n§L（夜莺之国（独立状态）活到后期会有与魔联的外交故事喵）§!"
  TBMGU_MZ_JG_11:0 "自由之魂"
  TBMGU_MZ_JG_11_desc:0 "自由铸就我们民主的国家，连接着我们每一位民主公民的精神与意志。"
  TBMGU_MZ_JG_12:0 "深入丛林"
  TBMGU_MZ_JG_12_desc:0 "亚马逊雨林里面的那些妖精，她们对民主一无所知，我们必须告诉这些整天在丛林里游荡的妖精什么才是民主！"
  TBMGU_MZ_JG_13:0 "地狱潜兵"
  TBMGU_MZ_JG_13_desc:0 "觉得眼熟？对民主的迫害在南美洲每分每秒都在发生，除非你做出此生最重要的决定。成为地狱潜兵，深入可怕的战场之中，为我们的民主轰炸机提供坐标！"
  TBMGU_MZ_JG_14:0 "秩序更替"
  TBMGU_MZ_JG_14_desc:0 "帝国！封建主义！这是历史的垃圾！对民主的阻碍！民主必须取代阿德莱希帝国的统治！"
  TBMGU_MZ_JG_15:0 "民主时代"
  TBMGU_MZ_JG_15_desc:0 "民主的火炬在燃烧，照耀着我们的国家，并且将会惠及整个世界，所有人都将沐浴在民主之中。"
  TBMGU_MZ_JG_16:0 "特种作战"
  TBMGU_MZ_JG_16_desc:0 "将我们民主的特种部队投放到敌方战线的后方，对敌人进行严重的破坏，一支民主的特种小队就能得到一个军团都难以企及的成绩。"
  TBMGU_MZ_JG_17:0 "火力掩护"
  TBMGU_MZ_JG_17_desc:0 "火力决定了大多数民主战术的可行性，火力优势的民主往往有着更多的战术选择。"
  TBMGU_MZ_JG_18:0 "正规的军队"
  TBMGU_MZ_JG_18_desc:0 "我们的军队不再是一团在战场上各自为战的散沙，而是一支可靠的，专业化的，正规的军队，让我们足以应对一切民主之敌。"
  
  
  ABRAA_5_MGU:0 "要求魔法少女屈服"
  ABRAA_5_MGU_desc:0 "我们必须要§R复仇§!！所有人类都得§R死§!！\n但是，在我们的领地旁，与我们一同生活了千年的魔法少女们或许可以有一个活下去的机会。\n但愿她们珍惜..."
  
  
  ABRAA_105_A:0 "魔法少女的地位问题"
  ABRAA_105_A_desc:0 "战争已经结束，这颗星球是我们的了。作为战争时期我们的盟友，千年来的友好的邻居以及这颗丛林星球上最后的‘人类’。但关于魔法少女们在我们之中的地位显然需要再一次的探讨。"
  ABRAA_105_A1:0 "平等地位的盟友"
  ABRAA_105_A1_desc:0 "魔法少女们已经证明了她们的价值，因此她们值得作为我们平等的盟友来对待，作为‘魔法少女’而不是‘人类’，她们不需要为人类对我们所做的一切负责，她们将会拥有属于自己的城市，由她们领导的魔法少女城市。甚至，在将来，她们或许可以拥有由她们来管理的星球。"
  ABRAA_105_A2:0 "受到关爱的奴隶"
  ABRAA_105_A2_desc:0 "我们不打算给予魔法少女们平等的地位，但是，妖精中有许多高级单元，都对魔法少女抱有独特的好感，我们不能完全将其当做奴隶来迫害。经过一段时间的探讨，对于魔法少女的法案被订立，魔法少女在14岁之前享有完成公民权，但是在14岁生日之后，就会成为妖精的奴隶，被妖精以需要的形式使用，一星期仅能休息两天。直到她们为妖精做出了足够多的贡献，或是身体衰弱的时候，才能够得到退休，重新享有完整公民权，在此期间她们仍然可以保留私人财产。到那时，她们可以去任何想去的地方，在不危害妖精的前提下，做任何想做的事情。但是，这些退休的魔法少女们，她们仍然选择和她们仍是奴隶的女儿们待在一起，或许在这个遍布妖精与菌毯的星球上，这些流淌着她们的血脉的女儿们，就是她们仅有的留念...."
  
  TBMGU_JLYTQ_01:0 "见泷原城市规划"
  TBMGU_JLYTQ_01_desc:0 "见泷原这座城市见证了许多魔法少女的故事，她所在的这片土地也曾发生过许多早已被埋没的历史，而未来她也将经历更加传奇的未来，或是面临突如其来的绝望..."
  TBMGU_JLYTQ_02:0 "修改工业法案"
  TBMGU_JLYTQ_02_desc:0 "有些人不理解，为什么战争已经结束了，却还要做这么多的军事工业，以及只有这么少的民用配额。这显然会引发一些人的不满，甚至是些许的骚乱。她们或许不会理解，但是她们必须服从。"
  TBMGU_JLYTQ_03:0 "神滨市车站"
  TBMGU_JLYTQ_03_desc:0 "神滨市作为魔法少女联盟的首都，或者说‘前首都’其拥有着一些完整的行政机关与各种机构，通过扩建她与见泷原之间的道路可以让首都圈的发展效率获得有效的提升。"
  TBMGU_JLYTQ_04:0 "接管镜屋"
  TBMGU_JLYTQ_04_desc:0 "镜屋是一些魔法少女经营的挺大的小商店，之所以说挺大的是因为其作用在魔联有着重要的影响，之所以说小，是因为这是一个仅向魔法少女开放的魔法商店，所以她的规模也不需要很大。\n\n而为了进一步开发无限镜界的资源，这里的一切都得收归国有，当然应该不会有人对此有任何的抗议，或者说，不能有。"
  TBMGU_JLYTQ_05:0 "见泷原蜂巢都市"
  TBMGU_JLYTQ_05_desc:0 "我们将在首都圈建造一个城市化的蜂巢结构都市，这将会容纳大量的人口，并使之发挥生产力。源源不断的工业零件与战争兵器将从这座都市中源源不断的涌出，送往魔法少女联盟的各地。"

  #国策结束


