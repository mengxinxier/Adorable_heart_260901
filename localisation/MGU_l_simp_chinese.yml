  MTK.13.a:"谢谢喵"

  MTK.14.t:"[FROM.GetNameDefCap]送出军事援助"
  MTK.14.d:"[FROM.GetAdjective]希望能在战争中帮助我们，并送来了一些装备。尽管数量不多，但是任何援助我们来者不拒。"
  MTK.14.a:"谢谢喵"

  MTK.15.t:"前路"
  MTK.15.d:"现在我们需要决定由谁来引导南美革命的火种燃向世界？"
  MTK.15.a:"由我们共同引领。" 
  MTK.15.b:"由我们来领导南美洲的未来。" 
  MTK.15.c:"由[LHS.GetName]来领导南美洲的未来。"

  MTK.16.t:"[MGU.GetName]希望由我们来领导南美洲的未来"
  MTK.16.d:"赤旗高扬于南亚美利加后，[MGU.GetName]希望由我们来领导她们与她们土地上的人民"
  MTK.16.a:"擦，同志，这多不好意思"
  MTK.16.b:"不用，现在这样就好"

  MTK.19.t:"[MGU.GetName]希望由她们来领导南美洲的未来"
  MTK.19.d:"赤旗高扬于南亚美利加后，[MGU.GetName]希望由她们来领导我们和这片土地上的人民"
  MTK.19.a:"可以，都是同志"
  MTK.19.b:"不行"

  MTK.20.t:"[LHS.GetName]拒绝了我们"
  MTK.20.d:"xc:把你抓走调教。"
  MTK.20.a:"你为什么会想生吃队友"

  MTK.21.t:"[LHS.GetName]同意了"
  MTK.21.d:"都是同志，是不是。"
  MTK.21.a:"我们仍会共同战斗"

  MTK_event.38.t:"后日谈"
  MTK_event.38.d:"星穹之上，那抹金色的目光拂过大地，抬头，却只见那悠悠的云彩留下一抹淡淡的粉色。\n沃土之上，装满色彩的宝石熠熠生辉，望去，再也没有所谓‘不完整的人’\n转身，银河般璀璨的长发飘动，祂将一抹目光长留于此，久久的注视着这耀眼的奇迹。\n\n“不多留一会儿吗？”祂不是很会藏起自己的心事，毕竟在这太过漫长的时间中，只有祂一人。\n半晌的沉默后，祂缓缓转身，轻轻抚摸着那璀璨但又极其易碎的泡沫，会嫉妒吗，可能会吧，但更多的，还是喜悦与安心。"
  MTK_event.38.a:"“知道这一切是可能的，便足够了。”"
  MTK_event38_a_tooltip:"§Q旅途愉快§!"

  MGU_ai_end:"§L对于你来讲游戏会结束§!"

  MTK_news.2.t:"$news_event_background$南美双子星"
  MTK_news.2.d:"世界的巨变往往超乎我们的想象，谁能想到，曾经双双步入绝境的野火革命军与魔法少女苏维埃临时联盟在短短数年时间内迅速成长，一跃成为共同解放并治理南亚美利加的主人。\n据我们的大使传来消息，[MGU.GetName]的国家主席[MGU.Getleader]与[LHS.GetName]的国家主席[LHS.Getleader]决定于近日共赴莫斯科共议未来——不仅仅是南美洲，更是整个共产主义世界的未来。\n苏维埃社会主义共和国联盟，全联盟共产党（布）主席[SOV.Getleader]表示热烈欢迎，殷切希望三国之间能够通过此次会面建设更加紧密的互联互通伙伴关系，就共产国际与南美工人联合会的联合达成广泛共识。\n世界即将迎来百年未有之大变局，或许共产主义的世界早已不是遥不可及。"
  MTK_news.2.a:"团结一致的我们永远不会被击败"
  MTK_news.2.b:"祝贺"
  MTK_news.2.c:"南美变天了"

  MTK_news.3.t:"$news_event_background$手足相残"
  MTK_news.3.d:"命运总是喜爱捉弄这些少女的人生，在南亚美利加的人民革命正进行的如火如荼时，[LHS.GetName]与[MGU.GetName]两个共产主义国家却选择兵戎相向，没人看懂她们为何要这么做，或许，她们要的不是南美的解放……而是统一。"
  MTK_news.3.a:"我的同胞，我的手足，何至如此"
  MTK_news.3.b:"我勒个豆"

  MTK_news.6.t:"$news_event_background$‘瓦尔普吉斯’登陆见泷原"
  MTK_news.6.d:"[GetDate]，在[MGU.GetName]见泷原市东部海域（西经43°24'，南纬25°22'）发生地震，震源深度为13千米，地震强度初步估计为7.6级。\n\n根据全球海啸监测数据显示，此次地震在震源附近引发了海啸。截至到今日12时，震源附近的海啸浮标已经监测到400cm的海啸波，神滨市，见泷原市沿岸分别观测到200到150cm的海啸波。\n\n经伯西尔国家自然资源部海啸预警中心综合分析研判，此次地震已引发越洋海啸，预计海啸波将于12小时内波及见泷原沿岸，24小时内波及见泷原市港口，最大波幅分别为300、250和200厘米。目前，台风"瓦尔普吉斯"正向见泷原市境内移动，预计将在国家中南部同步引发100厘米左右的风暴增水。\n\n地震，海啸与台风三重灾害影响，愿[MGU.GetName]能挺过这一场浩劫。"
  MTK_news.6.a:"做好准备。"
  MTK_news.6.b:"无论如何，我们都不能袖手旁观。"
  MTK_news.6.c:"上帝保佑。"

  MGU_news.9.t: "$news_event_background$团结的一天，胜利的一天"
  MGU_news.9.d: "跨越遥远的大陆与海洋，付出无数的生命和鲜血，经过漫长的无产阶级革命历程，在共产国际大会数十天的磋商之后，统合了全世界社会主义政权的无产阶级联盟宣告成立了！\n在共产国际的天空下，全世界无产者终得抬头，从今日起，不再有压迫，从今日起，帝国主义与资本主义已经被彻底驱离，从今日起，所有的无产者都将获得解放！"
  MGU_news.9.a: "英特纳雄耐尔就一定要实现！"





 #风暴将息

  MTK_end_title:"§QF I N§!"
  MTK_end_tip:"于此，她们的人生正式开始。\n那句“§P明天再见§!”再也不会没说出口，§P她§!§0们§!，§C她§!§t们§!，§Y她§!们，以及无数心怀希望的少女们，终不会被所谓命运锢于眼前。在无数的时间线中，总有一条，终有一条，会给以她们一个温柔的结局。\n\n§P我或曾梦见，你我形同陌路。§!\n§Q醒来后发现，你我亲密无间。§!"
  MTK_end_tip_2:"远航的星星，终有一天，终归故里，终见至亲。"
  MTK_end_close_button:"她们的故事，从不悲伤，因为我们共鸣于此"
  MTK_end_close_button_TT:"感谢游玩钢铁萌心。"  


  Magical_Girl_Communism: "魔法少女空想主义"
  Magical_Girl_Communism_desc: "§Q魔法少女空想主义§!\n\n\n\n\n£GFX_Magical_Girl_Communism_bg\n\n\n\n\n区别于传统的空想主义理论，魔法少女空想理论不排斥暴力革命，她们倡导自上而下的共产主义改革，接纳自下而上的群众运动。认为魔法少女与普通人在人权与地位是并无差异。同时要求在国家层面确立人民民主专政的共和国制度。\n在经济问题上，魔法少女空想主义者遵从公有制与集体制，反对任何形式的财产私有化，倡导改造而非暴力摧毁旧资本家，要求在全国范围内推行计划经济。\n在世界范围内，她们并不倡导干涉他国内政，而是普遍认为社会主义社会在这片大陆上的到来只是时间问题，对外输出革命只能是催化剂而绝非必要途径。"


