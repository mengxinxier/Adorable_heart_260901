  MTK_event.29.t:"通讯已接入——神滨紧急调频 389.5MHz"
  MTK_event.29.d:"“圆，焰，抱歉，我们来晚了，指挥通讯已全权接入你方网络。”七海八千代的声音从无线电中传出，北方，瓦尔普吉斯之夜毫无防备的侧翼，湛蓝的长枪刺穿使魔，舞台装置为之一颤，齿轮旋转，恐怖的嘶吼震天动地。七海八千代的声音盖过呼啸的狂风:\n\n“§B圆，神滨方面军旗下的突击部队已抵达战场。§!”\n\n“§R麻美，议会军与红军组成的联合纵队已抵达战场。§!”\n\n南方，梓美冬的术式展开，抬眼望去，身后，是越来越多赶来的同志。"
  MTK_event.29.a:"麻美小姐，或许我们今后，该互称同志了。"

  MTK_event.36.t:"致第二轮日出"
  MTK_event.36.d:"“魔力反应消失，确认目标——瓦尔普吉斯之夜，已成功歼灭。”\n炮火渐熄，烟霾散去，原本高悬于天的舞台装置，如今只剩所在之地的断壁残垣。\n那里，是很久以前，她们立下誓约的地方；那里，是很久以前，她亲手终结自己最珍视之人生命的地方——见泷原市的中心，高塔与河流错落之处。\n水面波涛，似她举枪那日，微风轻拂，似她立誓那朝。\n唯有不同，是今朝，泪水只为喜悦而泣。唯有特异，是当下，那动人的笑容仍在。\n“呐，焰酱，我们……我们赢了——赢了！太好了，焰酱！”\n抬眸，她已扑入我怀。\n“§B喂，小圆亲呐，也来抱抱我呗§!”\n“§R怎么，我在你心里都排不上号了？§!”\n“§B呜啊，怎么突然扑过来，诶呦我的腰，你稍微注意一下自己的吨位——疼疼疼§!”\n“结束了呢，大家……今天可真是，有够疯狂呢。”麻美背着累倒的由麻，百江渚跟在麻美身后，大家都在……都在。\n“小焰？”\n她的声音将焰拽回现实，远处，东方吐出鱼肚白，金色的日光拂过每一寸土地。恍惚间，晓美焰似乎看到，她的眼眸间，也闪烁着璀璨金光。\n“真好啊，小焰，太阳，真好看呐。”\n“啊……”\n\n“呐，圆，这是……真的吗？我们真的……”良久，晓美焰终于问出来这个压在她心上的问题，她害怕，害怕这是一场梦，害怕好不容易又有对未来的希望又是一场泡影，害怕……\n圆用手托住了她的脸颊，她的脸颊挡住了太阳，却当不过哪冉冉升起的万丈新光。紫眸与粉眸对视，很快，她们的泪水便共同反射出晶莹的光辉。"
  MTK_event.36.a:"§P傻瓜，我能是假的吗§!"
  MTK_event36_tooltip:"§L朝前看吧，前路或有荆棘，却再无别离。§!"

  MTK_event.30.t:"万年樱之下"
  MTK_event.30.d:"相传，神滨市里有一株樱花树，四季去看，她枝丫常青，但从没人见过那樱花绽放……或许，她正等着谁？或许是那三个出院的女孩子，和总是前来看望她们的另一名女孩子再会吧……"
  MTK_event.30.a:"等忧回来，我们一起看那，满开的樱花。"

  MTK_event.31.t:"要拯救的，所有的魔法少女"
  MTK_event.31.d:"“救回忧的方式很简单。玛吉斯在喂养夏娃时，曾注意到——在夏娃进食的过程中，有一个特异点一直在发出奇特的能量波。”里间灯花站在凳子上，身后是一块巨大的白板——这里是记忆博物馆，音梦创造出来的谣。“就是这里——”\n灯花指向白板一处，那里标注着夏娃胸前巨大的红色宝石“所以我们有理由猜测，忧就在这里，准确来说，是忧的躯体在这里，充当夏娃转换能量的核心。”\n“魔法少女对应着灵魂宝石，而魔女则对应着悲叹之种。”一侧，八云御魂补充道，“音梦调出的那些数据我看了，其能量波形与我调整魔法少女的灵魂宝石时出现的能量波动基本吻合。”\n“所以，忧很大概率没有魔女化，甚至于说，她的身体与灵魂宝石被‘夏娃’保护的很好，我们要想救她出来，就需要向脱玩偶服一样，把忧从夏娃中剥出来。”\n“但，在脱‘玩偶服’的过程中，夏娃很可能会暴走，因为离开忧——这是在夺走它的生命，所以大量的使魔，甚至于夏娃本身都会暴走，就算夏娃是未孵化完全的半魔女，其破坏力也与巨型魔女不相上下。”\n“交给我们。”通讯响起，八千代与巴麻美的声音传出，“玛吉斯的大家会负责清理使魔，我们会为各位争取又一次机会。”\n“然后，姐姐，彩羽，你是所有计划的核心，只有你，能将忧带出来，我们所有人，都会紧紧站在你身后。”环彩羽站起身，平静的扫视了在场的少女们，她们或许来自不同的城市，但此刻相聚，\n神滨市郊外某处，夏娃趴在博物馆门口，好似睡着了，它庞大的身躯周围，少女们肃立于此，彩羽上前一步，左手攥拳，轻轻说道："
  MTK_event.31.a:"忧，姐姐来接你了"

  MTK_event.32.t:"§Q浮光梦影§!"
  MTK_event.32.d:"梦——一个晶莹剔透的梦，一个飘渺却又永恒的梦。自那天以后来，我就一直在做着梦，梦里的我有朋友，有笑颜，没有疾病，没有痛苦，但总感觉……少了什么，是什么呢？\n是很重要的东西——\n是什么呢？\n是绝对不能忘的东西——\n究竟……是什么呢……？\n突然，她听见了某人的呼唤，那个声音穿透深沉的湖面，向她的心脏落上一吻。啊，是她。是我一直在寻找的那个声音。绝不会错。\n“姐姐……”\n梦醒了，世界重新聚焦，啊，她找到了，那个一直寻而不得的人——\n“我……好想你。”\n\n泪滴奏响天空，久别的姊妹紧紧相拥。"
  MTK_event.32.a:"欢迎回家，忧"

  MTK_event.33.t:"穹顶之间"
  MTK_event.33.d:"神滨——联盟议会\n\n“和泉十七夜，你不是向我们许诺过，八千代和红党那些虫豸，会彻底死在见泷原吗，还让我们好好看戏，现在呢，风暴消散了，那些共产主义分子成了最耀眼的明星，甚至连玛吉斯，玛吉斯那群家伙也加入了她们——我们数次请求出手添柴都被你拦下，你——”厅内，美国织莉子怒不可遏，拍案而起指着十七夜的鼻子骂道，“究竟在想些什么！”\n沉默，和几天前八千代发言时如出一辙的沉默，只不过这次，十七夜脸上没有一丝表情变化，她的双眼微闭，神情冷漠的无视着在场的所有人。\n“叛徒！”\n“叛徒——叛徒——”不知谁起了个头，铺天盖地的咒骂声海浪似的想十七夜扑来，终于，和泉十七夜有了动作，她将指尖抵在麦克风上，嗡鸣上响彻整个议会厅，松手，厅内只剩低声的咒骂\n“说完了吗，”十七夜冷冷说道，目光扫死坐在台下的所有人，绝大多数，都是利欲熏心的投机分子，为了那点蝇头小利，道德，国家，甚至他人的性命，都是可以随意抛弃的砝码。\n“鉴于议会已无法履行正常职能，我，和泉十七夜，以联盟临时议长的身份宣布——”"
  MTK_event.33.a:"即日起，神滨联盟大议会——无限期休会。"

  MTK_event.34.t:"胜天半子"
  MTK_event.34.d:"和泉十七夜背对着议会的正门，日光自撺掇的人群中射入厅内，她的袖肩刺客正熠熠生辉。\n“阿啦啦，连我都没想到哦，”人群散去，某人的声音适时的传出，十七夜转身，目光落在悠然自得坐在前排的——她的身上\n“这是你的计划，不是吗。”十七夜出声，锐利的眼神扫视面前的银发少女。\n“嘛嘛——起码，挺成功的不是吗”少女起身，拍了拍漆黑的裙摆，自顾自的转了个圈，花边舞动，摄人心魂。\n“在你表态之后，那些最难搞的右翼分子天真的以为你终于和她们站在一起了，为表忠诚，起码，在这场灾难结束前，是绝对会听你的命令——只要不是太过分。”\n“尽管那些家伙握着选票，但归根到底，给她们指手画脚勇气的，还是那远洋另一端的——她们的主子，圣杯王国。”\n“所以，你让我在议会中和她们站在一起，逼迫她们将视线放在八千代，共产党和玛吉斯她们身上，然后由你，带着从共产党带来的亲兵，一根一根的拔掉她们的耳目。”\n“啪唧啪唧——”少女鼓起掌“正确哦，但有一点小错误——和我一起行动的，不是亲兵，是同志。另外，我也没有神通广大到找到每一根发丝，只是——咔擦——剪断那些最脆弱的地方而已哦。”\n少女双眼微咪，伸出手指剪断阴影，烈日行至窗前，刹那间，整个厅内辉光四溢。\n“现在那群家伙，应该已经发现‘电话线’断了吧，所以，准备好了吗”少女踱步，跳到十七夜身后，“你一声令下，我们的人便会以‘叛国罪’逮捕这些家伙。当然，如果你想彻底解决她们，我的手上也有足够的资料。保证让那些圣杯人挑不出一点毛病。”\n“你还真是，有够毒呢，平冢小姐。”十七夜缓缓说道。\n“嘛，对敌人残忍，对同志温和，你不也是这样吗。”平冢牧原笑道，“啊啦，时间差不多了呢——”"
  MTK_event.34.a:"准备好回到阳光下了吗，十七夜亲。"

  MTK_event.35.t:"§Q许愿未来§!"
  MTK_event.35.d:"行动迅速，组织有序，卡车停在一栋栋别墅前，厚重的皮靴声敲醒大地，头戴蓝色制式军帽的魔法少女手持十七夜盖章的搜查令，精准的敲响每一户与“叛国行径”有染的户门。\n“联盟XX委员部，现依法将你带离审查。”\n语言简练，却在神滨数处同时响起，某些高级官员在睡梦中被震醒，被带走时领带都没来得及打。\n“平冢同志，所有目标已被控制，正在押解回总部。”\n“好，辛苦了。”少女对着无线电说道，“啊啦，十七夜，在担心什么？”少女款款说道：“现在大家的目光都在见泷原的重建上，而圣杯王国大概率是自顾不暇了，嗯——比预想中顺利呢。”\n“真是雷霆手段呢，”十七夜摇摇头，她不敢想，如果自己没有选择这条路，而是与八千代站在一起，那些反对派必然会做出更激进的行为，如果真到那时，或许，眼前这位一直笑眯眯的少女，会做出所有人都想不到的残酷行动……“你的下一步呢？”\n“下一步，哦对哦，下一步，嗯，那就是——”少女灵巧的从八千代身前一转，将八千代的视线引向一侧“让十七夜酱和你和好哦。”\n“欸？”\n“姐姐，我们来了哦——”顺着那白色的长发向后望去，山下，千秋理子向山顶的二人挥手，身后，跟着的是\n“八千代？”十七夜一惊，伸手想抓住面前少女的领口质问，却被她轻而易举的闪开——"
  MTK_event.35.a:"接下来的时间，记得好好相处哦"
  MTK_event35_tooltip:"§L可以把锅都甩在我身上哦，十七夜亲。§!"


  MTK_event.37.t:"这是一个跳过按钮"
  MTK_event.37.d:"因为杂鱼牧原没活了，所以她打算把这个gui就放到这里吃你的内存，当然为了照顾已经看过一遍的玩家，这里给加入了一个跳过键"
  MTK_event.37.a:"要是再让我看到你们蛐蛐我的东西，我就扎聋自己的耳朵。"
  MTK_event.37.b:"我看你就是不舍得你写的文案"
  

  MTK.104.t:"向[MGU.GetName]派出援助？"
  MTK.104.d:"在听闻[MGU.GetName]遭遇的惨烈自然灾害后，我国国内志愿团队请愿前往受灾中心提供国际支援。同时，除志愿者外，我们仍可以派出志愿医疗队前往[MGU.GetName]支援救灾。这是我们展现国际公信力和与新兴共产主义国家打好关系的重要一步，结合我们当下的国内情况，我们是否要同意她们的请求？"
  MTK.104.a:"注意安全，同志们。"
  MTK.104.b:"抱歉，我们实在腾不出手。"

  MTK.105.t:"[FROM.GetName]向我们提供支援"
  MTK.105.d:"在听闻我国受灾情况后，[FROM.GetName]向我们派出专业地震救援队奔赴灾区参与搜救，同时也派遣了志愿医疗队协助我国开展伤员救治等工作。"
  MTK.105.a:"感激不尽"

  MTK.106.t:"[FROM.GetName]向我们致电哀悼"
  MTK.106.d:"在听闻我国受灾情况后，[FROM.GetName]鉴于国内外形势无法向我们提供实质性帮助，但在外交与舆情层面始终与我们站在一边。同时，[FROM.GetName]国内自愿举办的民间捐款也将在不久后运至我国。"
  MTK.106.a:"回电致谢"

  MTK.100.t:"阿雷格里港问题"
  MTK.100.d:"根据[MGU.GetName]的外交意见，她们声称需收回该港以实现国家的领土完整与民族解放，尽管该港在南美拥有不容小觑的战略价值，但碍于目前的国际形势与[MGU.GetName]日益强盛的综合国力，或许适时的卖个人情也不足为过"
  MTK.100.a:"本来就是她们的。"
  MTK.100.b:"她们得拿出点诚意。"
  MTK.100.c:"这群土著要反了天了？"

  MTK.101.t:"[ENG.GetName]拒绝交出港口"
  MTK.101.d:"我们以外交避免战争的举措终究是败在了资本主义的黑暗之中，[ENG.GetName]或许有着无敌的舰队，超凡的陆军，扑天盖日的各式战机……但她们终究无法占领我们的故土，奴役我们的人民。"
  MTK.101.a:"抛弃幻想，准备斗争。"

  MTK.102.t:"与[ENG.GetName]议和"
  MTK.102.d:"在夺回阿雷格里港后，圣杯王国已失去了南美洲最重要的跳板与港口，反观欧洲，她也无力倾注更多资源以应对我们，我们最开始的目标已经达成，或许是时候与她们谈判，结束这场胜利而荣光的战争了。"
  MTK.102.a:"我们的目标仅仅是祖国的完整。"
  MTK.102.b:"她们必须偿还从我们这里夺来的一切。"

  MTK.113.t:"[ENG.GetName]要求我们拿出诚意"
  MTK.113.d:"圣杯王国向我们提出了一个极不合理的“交易”，这位昔日的世界霸主或许深陷欧洲，但她的实力仍旧如日中天，我们不敢拿着整个国家的命运进行赌博，这或许，就是最好的结果……"
  MTK.113.a:"答应她们"
  MTK.113.b:"等着吧，早晚有一天……"


  MTK.103.t:"你认真的？"
  MTK.103.d:"你真没看决议条件还是假没看？"
  MTK.103.a:"我去不早说。"
  MTK.103.b:"我玩游戏我就是叠，我就是要打。"

  MTK.111.t:"[MGU.GetName]希望与我们结盟"
  MTK.111.d:"南美统一后的共产主义者迫切的需要一个跳板前往美洲，我们是否要答应她们？"
  MTK.111.a:"都是同志，是不是。"
  MTK.111.b:"这些修正主义者永远也别想。"

  MTK.107.t:"向[PAN.GetName]提议联合"
  MTK.107.d:"统一南美后，我们是时候讲目光放眼全球。北方，[PAN.GetName]或许是个可以信赖的盟友。"
  MTK.107.a:"向她们释放诚意。"
  MTK.107.b:"欸，我有一计。"

  MTK.112.t:"[PAN.GetName]拒绝了"
  MTK.112.d:"她们不识好歹，竟然拒绝了我们。"
  MTK.112.a:"竟然不许？！"

  MTK.108.t:"有关[USA.GetName]的问题"
  MTK.108.d:"要不要打"
  MTK.108.a:"打，你们不正统"
  MTK.108.b:"算了，都是同志"

  MTK.109.t:"有关[NGD.GetName]的问题"
  MTK.109.d:"要不要打"
  MTK.109.a:"打，你们不正统"
  MTK.109.b:"算了，都是同志"

  MTK.110.t:"[MGU.GetName]希望与我们并肩作战"
  MTK.110.d:"在南美革命伊始，[MGU.GetName]提出想要加入我们的阵营。"
  MTK.110.a:"都是同志，是不是。"
  MTK.110.b:"拒绝"

