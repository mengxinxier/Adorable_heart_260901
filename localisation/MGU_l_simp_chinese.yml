  form_MGU_shoulieOVER_flag_desc:0 "已经完成狩猎"
  MGU_chasm_mobilization_flag:0 "已完成全国动员"
  
  
  MGU_PAU_LHS_war_keep_1:0 "支持莉兰迪亚军团"
  MGU_PAU_LHS_war_keep_1_desc:0 "南方的战争刚刚停息不久，野火的残余部队躲在南方山区的矿坑里，所有人都觉得战争即将结束了，但是那帮自称野火的游击队并没有人们所想的那么脆弱，莉兰迪亚军团的雇佣兵们被公社的防线所阻拦，军团的雇佣兵们最终大概率会战败，除非得有更多的支援。"
  MGU_PAU_LHS_war_keep_2:0 "为军团赠送枪械"
  MGU_PAU_LHS_war_keep_2_desc:0 "或许我们应该向军团赠送更多的枪械？这似乎对我们有利？遏制野火的扩张速度将可以为我们带来些许优势？以维持野火与索拉娜之间的均衡。但在同时不要忘记阿德莱希帝国的威胁。"
  MGU_PAU_LHS_war_keep_3:0 "夺取南方的城市"
  MGU_PAU_LHS_war_keep_3_desc:0 "军团的战争已经失败了，她们得面对现实了，但是如果我们现在介入，还可以尝试吃掉一部分争议领土，把实际控制区重新推进到魔法少女联盟成立以前的范围，而莉兰迪亚公社与王国，暂时都没有时间和精力来管我们。"
  MGU_PAU_LHS_war_keep_4:0 "整编溃败的军团"
  MGU_PAU_LHS_war_keep_4_desc:0 "我们收拢了莉兰迪亚溃败的军团，她们曾经都是勇猛的战士，只要再次得到一次机会，她们仍然可以在战场上证明自己。"

  MGU_QB_helpROC:0 "帮助█民█府"
  MGU_QB_helpROC_desc:0 "在动乱年代████的时候，只要████就能████一██队。当然，前提是████的哪边是██都██清██也算士兵的话，她们没███████就██的了..."
  MGU_QB_helpCHI:0 "帮助█华██"
  MGU_QB_helpCHI_desc:0 "在动乱年代████的时候，只要████就能████一██队。当然，前提是████的哪边是██都██清██也算士兵的话，她们没███████就██的了..."
  MGU_QB_helpYUN:0 "帮助██军█"
  MGU_QB_helpYUN_desc:0 "在动乱年代████的时候，只要████就能████一██队。当然，前提是████的哪边是██都██清██也算士兵的话，她们没███████就██的了..."
  MGU_QB_helpBRA:0 "帮助南██盟"
  MGU_QB_helpBRA_desc:0 "南美的战士们正在对抗██的入侵，我们对██████了解不多，但是只██点是确██，她肯██和████一██，所████当帮助南██萌的战██抵抗███。或者只是为了把战争继续延长..."
  MGU_QB_helpPRU:0 "帮助██侵██"
  MGU_QB_helpPRU_desc:0 "不██思，是我听错了嘛？我不知道为什██这样做。无论QB怎么忽悠我██得太怪了，我们应当...呃！别开枪...我投降，麻美学姐的眼神好可怕。但是，麻美学姐这██一定有她的深意，我们只要██在麻美学████████话就是了。"
  MGU_QB_helpDVL:0 "为戴比路克银河帝国提供情报"
  MGU_QB_helpDVL_desc:0 "不管怎么说！这种行为已经不是一般的离经叛道可以形容得了，我必须向全国领袖晓美焰盟主进行汇报！...呃！？麻美学姐？你要对我做什么？别！...███！...█████...███~~！！"
  MGU_QB_stophelpDVL:0 "停止为戴比路克银河帝国提供情报"
  MGU_QB_stophelpDVL_desc:0 "继续向戴比路克银河帝国提供情报已经不符合我们的利益了。因此撤回我们的人员与QB们。当然，这件事也不需要打报告让中央会议知道，毕竟...在中央会议的视野中...我们从来都没有帮助过戴比路克。"
  MGU_QB_helpHSF:0 "为黑森██院提██械"
  MGU_QB_helpHSF_desc:0 "为了面对██校的██，██████们必须██起来，对██来的危机。而██也可以趁██来有用的坦██纸。记得谨慎行事，不要让晓美焰的中央会议知道这██器的去向。"
  MGU_QB_helpKMK:0 "武装██乡的妖██"
  MGU_QB_helpKMK_desc:0 "在幻██的郊外居住着很多██们，只要██提██枪██器，再附██些额██段，██单就能██她们██军，毕竟妖███玉们并没有████的██，只要灵力充足即使████随着时间████。"
  MGU_QB_KMK_war:0 "██红██变"
  MGU_QB_KMK_war_desc:0 "根据我██特███的消息，██馆的大██似乎一直对██乡的██权感██满。我们只██其提██够多██器，她████起一场██乡的内█。"
  MGU_QB_KMK_war_1:0 "████乡的魔█████术"
  MGU_QB_KMK_war_1_desc:0 "████馆██魔██森，就██事先答██们████给█████。"

  MGU_QB_helpJAP:0 "为维██████器"
  MGU_QB_helpJAP_desc:0 "在樱花国，虽██多██满圣杯████治，但██然还有██████为██花国███。██麻██姐您的██，我██特██经██好将██军火██只████港口。"
  MGU_QB_helpJAP_2:0 "为██国极██义者███器"
  MGU_QB_helpJAP_2_desc:0 "似乎██国的局势仍██分██，麻████为我███需要隐██提███武器，来帮助██国稳██线。但██定要做██秘一些，别让████国██上，也██我们的中██会查到。也别让████发██们的████。"

  MGU_QB_helpJAP_1:0 "以更███换取██魔██女"
  MGU_QB_helpJAP_1_desc:0 "██维██士们延缓了██国██败，但是██国仍然███多的武器，麻美██想要与████做一笔交易，████，你也████国█入██手里吧。"
  MGU_QB_helpRJE:0 "为████召████士"
  MGU_QB_helpRJE_desc:0 "████，██来的████国是个██怕██胁，但██们██████压制████利███，所以我██当这██。嗯，别██央议会██，这是麻████私██务。"
  MGU_QB_helpRJE_1:0 "为████提供大███"
  MGU_QB_helpRJE_1_desc:0 "██给██国的██似乎██了一█，为██们必██正这个█题，如果████可以突██到一大堆火██话...虽说这或██效，但是这么██炮，如果晓美焰██中央议会过██来怎██？这个██哪怕在纸面上也████填██的。"

  MGU_QB_helpLHS:0 "为智利购买雇佣兵"
  MGU_QB_helpLHS_desc:0 "花费圣杯币购买雇佣兵，并且由我们提供军火援助。这并没有得到中央议会的批准，甚至中央议会和晓美焰盟主并不知道这件事，这或许可以对战局起到影响，但是无论我们做的多么隐秘，中央议会总能察觉到什么。"

  form_MGU_mofagongyeyuanqu_category:0 "魔法工业园区"
  form_MGU_mofagongyeyuanqu_category_desc:0 "这是我们使用永续魔法为基础，大量魔法阵和魔法效果叠加结合，制造而成的有巨大生产力的魔法奇迹。"
  form_MGU_More_Nuke:0 "更多的大规模杀伤性武器"
  form_MGU_More_Nuke_desc:0 "使用我们的魔法工业奇观，生产更多的核弹，或者说，更多可被用作大规模杀伤性武器的魔法炸弹。感谢魔法奇观生产的魔法核弹，我们不再需要通过灵核自爆来作为代替手段了。"
  form_MGU_More_arms_factory:0 "更多的军用工厂"
  form_MGU_More_arms_factory_desc:0 "使用我们的魔法工业奇观，生产更多的军用工厂。"
  form_MGU_More_industrial_complex:0 "更多的民用工厂"
  form_MGU_More_industrial_complex_desc:0 "使用我们的魔法工业奇观，生产更多的民用工厂。"
  form_MGU_More_manpower:0 "量产美少女使魔"
  form_MGU_More_manpower_desc:0 "使用魔法奇观大批量生产更多的美少女外形的使魔，代替普通士兵投入前线战场，以缓解士兵不足的严酷问题。\n\n会让QB拥有的负面能量减少§G30§!点"
  form_MGU_More_PP:0 "对人民赋予权力"
  form_MGU_More_PP_desc:0 "权力归于人民，魔法工业奇观提供的生产力，可以让我们为人民派发更多的福利与资源，让人民管理国家。 只有当全体居民都参加管理工作时，才能彻底进行反官僚主义的斗争，才能完全战胜官僚主义。并且我们的中央会议可以把精力用在更紧要的事情上了。"
  form_MGU_More_aluminium_steel:0 "生成战略物资"
  form_MGU_More_aluminium_steel_desc:0 "使用魔法工业奇观，把魔力转化为战略物资，这可以维持我们军用工厂的生产，虽然有些人认为，哪怕魔力可再生，这仍然是一种很浪费的事情，魔力本可以做到更多更好，而不是用来生产这些‘物质’层面的东西。"
  form_MGU_advanced_magic_airforce:0 "先进强袭组件"
  form_MGU_advanced_magic_airforce_desc:0 "我们对强袭组件的理解，远超那些对魔法只有一知半解的外行人，在魔法工业奇观的支撑下，我们可以超前制造出更加先进的强袭组件。"
  form_MGU_powerful_magic_landforce:0 "更强大的魔炮"
  form_MGU_powerful_magic_landforce_desc:0 "随着战况的剧烈升级，敌人们的钢铁巨兽愈发强大了，我们必须改进我们的魔法武器才能在这场军备竞赛中维持住目前的平衡。"
  form_MGU_powerful_magic_landforce_1:0 "更先进的高功率魔炮"
  form_MGU_powerful_magic_landforce_1_desc:0 "这是我们最先进的量产魔炮，可以应对各种钢铁巨兽，大概吧...至少魔炮研发部的少女们已经尽力了...这就是我们目前能量产的最好的魔炮了。"
  form_MGU_More_magic_assault:0 "制造更多的灵想兵装"
                                       
  MGU_QB_KMK_war_2:0 "超次元信仰灵装"
  MGU_QB_KMK_war_2_desc:0 "通过超次元信仰之力的技术来强化灵装的融合技术。"
  
  form_MGU_Ministry_of_Interior_category:0 "内政部决议"
  MGU_Interior_1:0 "修复机场：薄望之馆"
  MGU_Interior_2:0 "修复机场：见泷原"
  MGU_Interior_3:0 "修复机场：南方管制区"
  MGU_Interior_1_desc:0 "将内战中损坏的机场进行修复，使其恢复运作。"
  MGU_Interior_2_desc:0 "将内战中损坏的机场进行修复，使其恢复运作。"
  MGU_Interior_3_desc:0 "将内战中损坏的机场进行修复，使其恢复运作。"
  MGU_Interior_4:0 "修复机场：丛林区"
  MGU_Interior_4_desc:0 "将内战中损坏的机场进行修复，使其恢复运作。"

  
  
  
  form_MGU_ministry_interior_category:0 "和平部决议"
  form_MGU_ministry_interior_category_desc:0 "和平部是整个联盟军的心脏，这里时刻在发布着军事命令，调度指挥整个联盟的部队。"
  MGU_Assault_Component_civilian:0 "§Y正在制造强袭组件§!"
  MGU_Assault_Component_civilian_desc:0 "占用民间的魔法作坊来协助强袭组件的生产。"
  MGU_Assault_Component_civilian_on:0 "§G开始§!§G制造强袭组件§!"
  MGU_Assault_Component_civilian_on_desc:0 "临时征用一些民间的魔法作坊，改造为制作强袭组件的生产节点。而其费用和魔法道具的缺口，则需要我们用工业工厂的收益来进行弥补。"
  MGU_Assault_Component_civilian_off:0 "§R停止§!§R制造强袭组件§!"
  MGU_Assault_Component_civilian_off_desc:0 "停止对魔法作坊的征用，同时不再使用工业工厂的产出来支付其费用。"
  
  
  form_MGU_Arms_trading_1:0 "贩卖步兵装备"
  form_MGU_Arms_trading_1_desc:0 "把一些多余的装备卖掉，以获取钱钱。军火只有卖与不卖的区别，你并无法阻止它们最后落到谁手里。你确定要做这种事？"
  form_MGU_Arms_trading_2:0 "贩卖火炮装备"
  form_MGU_Arms_trading_2_desc:0 "把一些多余的装备卖掉，以获取钱钱。军火只有卖与不卖的区别，你并无法阻止它们最后落到谁手里。你确定要做这种事？"
  form_MGU_Arms_trading_3:0 "贩卖支援装备"
  form_MGU_Arms_trading_3_desc:0 "把一些多余的装备卖掉，以获取钱钱。军火只有卖与不卖的区别，你并无法阻止它们最后落到谁手里。你确定要做这种事？"
  form_MGU_interior_RUA:0 "渗透突袭"
  form_MGU_interior_RUA_desc:0 "和平部将会竭尽所能的策划一次突袭行动，几支忠诚的部队将被以各种合理以及不合理的方式投送到敌占区进行突袭。"
  form_MGU_interior_RUA_AI:0 "渗透突袭(AI专用)"
  form_MGU_interior_RUA_AI_desc:0 "和平部将会竭尽所能的策划一次突袭行动，几支忠诚的部队将被以各种合理以及不合理的方式投送到敌占区进行突袭。而且AI可以免费使用这个决议。"
  form_MGU_homura_Commander_0_1:0 "和平部再一次扩编"
  form_MGU_homura_Commander_0_1_desc:0 "增加和平部的扩编等级，解锁更多和平部指令。"
  form_MGU_homura_Commander_1:0 "晓美焰直接指挥"
  form_MGU_homura_Commander_1_desc:0 "在这段时间里，将由晓美焰盟主亲自指挥军队调度。"
  form_MGU_homura_Commander_1a:0 "强袭命令"
  form_MGU_homura_Commander_1a_desc:0 "命令部队发起一次强袭攻击。|n（持续§Y15§!天，§Y90§!天间隔时间）"
  form_MGU_homura_Commander_2:0 "强行军"
  form_MGU_homura_Commander_2_desc:0 "命令军队不计代价的以最快速度行进。"
  form_MGU_homura_Commander_3:0 "修建防御设施"
  form_MGU_homura_Commander_3_desc:0 "加快生产力修建防御设施。"
  form_MGU_homura_Commander_4:0 "空军建设"
  form_MGU_homura_Commander_4_desc:0 "加快建造空军基地与雷达站。"
  form_MGU_homura_Commander_5:0 "军事管控"
  form_MGU_homura_Commander_5_desc:0 "出动军队对国家进行军事管制。"
  form_MGU_homura_Commander_6:0 "抢修设施"
  form_MGU_homura_Commander_6_desc:0 "加快设施维修速度。"
  form_MGU_homura_Commander_7:0 "情报网络"
  form_MGU_homura_Commander_7_desc:0 "专注于情报网的建设。"
  form_MGU_homura_Commander_8:0 "物资补给"
  form_MGU_homura_Commander_8_desc:0 "专注于军用物资的运送。"
  form_MGU_homura_Commander_9:0 "点燃大海"
  form_MGU_homura_Commander_9_desc:0 "专注于空军袭击海军的任务。"
  form_MGU_homura_Commander_10:0 "撕裂天空"
  form_MGU_homura_Commander_10_desc:0 "专注于对空军的打击。"
  form_MGU_homura_Commander_11:0 "向瓦尔哈拉社投降"
  form_MGU_homura_Commander_11_desc:0 "这在某个类型的游戏里，是很常见的技能。如果瓦社同意，我们将成为其傀儡国。\n\n无论瓦社是否同意 都会发生：§R晓美焰将会下台§!\n\n整个魔法少女联盟当前的一切政治与军事，都维系在晓美焰身上，如果她下台，将会发生严重的动荡。"
  form_MGU_homura_Commander_12:0 "要求瓦尔哈拉社退兵和谈"
  form_MGU_homura_Commander_12_desc:0 "随着瓦尔哈拉社在南美洲的盟友接连倒下，中美洲的红军已经没有解放南美的机会了，这场由瓦尔哈拉社发动的南美革命战争，是该停止的时候了。"
  form_MGU_captive_Commander:0 "让叛军俘虏归顺我们"
  form_MGU_captive_Commander_desc:0 "每个魔法少女都是晓美焰盟主珍贵的财产，哪怕是那些背叛者。对俘虏之中的顽固份子进行独特的具有针对性的特殊方式，来让她们意识到自己之前的错误，加入晓美焰的阵营，为晓美焰奉献终身吧。"
  
  form_MGU_Army_doctrine_1:0 "我们屹立于凡人身前"
  form_MGU_Army_doctrine_1_desc:0 "魔法少女永远守护凡人，无论凡人愿意与否。"
  form_MGU_Army_doctrine_2:0 "我们的脚下就是国门"
  form_MGU_Army_doctrine_2_desc:0 "我们决不能容许敌人在我们的国土上肆意妄为，我们将坚守每一道防线，据守每一栋房屋，我们寸土不让。"
  form_MGU_Army_doctrine_3:0 "流光溢彩的全装强袭"
  form_MGU_Army_doctrine_3_desc:0 "全装猛攻，不要心疼那点圣杯币。虽然我们无法为每个士兵都提供良好的装备，但是我们可以为精锐部队提供精良的装备。"
  
  form_MGU_interfere_Eastern_Europe_category:0 "友爱部命令"
  form_MGU_interfere_Eastern_Europe_category_desc:0 "根据治安官的汇报，我们的友爱部治安官已经部署完成，随时可以展开计划。 \n\n丛林秩序值当前为(§Y[?global.MGU_draw_angel]§!)点。"

  form_MGU_IEE_draw_angel_1:0 "派出更多治安官入住丛林区"
  form_MGU_IEE_draw_angel_1_desc:0 "§G增加§!丛林区域的秩序值。\n\n在我国西北部的丛林里，有一批昆虫与植物生活的区域，虽然我们之间或许略有差异，但是她们之中也有一些可爱又优秀的魔法少女，而且曾经也表示过愿意接受我们的理念，为了防止无意义的内斗与混乱，我们应当将她们拉拢到我们之中。"
  form_MGU_IEE_draw_angel_2:0 "与丛林的治安协定"
  form_MGU_IEE_draw_angel_2_desc:0 "§G增加5点§!丛林区域的秩序值。\n\n我们可以通过为丛林妖精提供一些利益的方式，来与丛林达成一定程度的协议，在执法的过程中，可以得到她们的支持与援助。"
  form_MGU_IEE_draw_angel_3:0 "秩序井然的丛林"
  form_MGU_IEE_draw_angel_3_desc:0 "随着大量的犯罪者被逮捕归案，那些原本充满野性的昆虫们，也逐渐的开始遵守我们的法律与社会治安规则。现在，我们可以宣称，我国的丛林，已经在晓美焰盟主那圣洁光芒下，得到了秩序与稳定。"
  form_MGU_IEE_draw_angel_4:0 "秩序井然的丛林（AI）"
  form_MGU_IEE_draw_angel_4_desc:0 "AI就是可以为所欲为.jpg，喵~"
  form_MGU_IEE_draw_angel_5:0 "学习妖精建筑工艺"
  form_MGU_IEE_draw_angel_5_desc:0 "妖精在建筑工艺上有着非同凡想的生物结构技术，如果我们借助妖精的能力将其普及将可以极大地提高我们的建筑能力。"
  form_MGU_IEE_da_she_3:0 "与金伯利魔法学院的魔法研究合作"
  form_MGU_IEE_da_she_3_desc:0 "根据特工部传回的消息，她们已经与夜莺之国的金伯利魔法学院进行了一些交涉，如果我们肯开展更深层的交易，她们愿意支持我们的魔法研究。"
  form_MGU_IEE_legal_department_1:0 "逮捕织莉子"
  form_MGU_IEE_legal_department_1_desc:0 "由魔法少女联盟，最高领袖，伟大而又圣洁的晓美焰盟主，亲自下达的命令，逮捕魔法少女织莉子，而且没有任何的罪名。"
  form_MGU_IEE_legal_department_2:0 "亲自处理织莉子"
  form_MGU_IEE_legal_department_2_desc:0 "晓美焰盟主将会亲自去处理关于织莉子的问题，不会有任何人知道发生了什么，织莉子将会在事后失踪，亦没有人知道原因和结果。"
  form_MGU_IEE_legal_department_3:0 "招募新将领"
  form_MGU_IEE_legal_department_3_desc:0 "为了完成全国领袖晓美焰盟主的计划，我们需要招募一些新的将领来完善我们的国家。"
  MGU_Gestapo_department:0 "友爱部扩编：整顿治安"
  MGU_Gestapo_department_desc:0 "为了进一步的维护治安，我们的友爱部需要更加庞大的队伍，审批资金，从各行各业，以及灵活就业的人群中，招募20W人加入治安人员的行列，这将可以增加我们的治安力量，也可以减少灵活就业的人数。当然，入选的人员必须经过严格的训练与培训，让其明白我们是为人民服务的女仆！\n加入治安官的行列，这是一种荣誉！象征着忠诚！以及你现在是友爱部的人了！你现在是我们英明的全国领袖晓美焰的拥护者！以她的名义，去阻止一切对晓美焰不忠之人。保护我们的人民，使她们免受不法之徒的侵害，法律与秩序将因你而闪耀。\n而对于想要犯罪的人，你可能无法确定你是否有被治安官盯上，但是无论何时何地，放下想要犯罪的侥幸心理，彰显你对晓美焰的忠诚吧。"
