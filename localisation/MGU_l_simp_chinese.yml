  MTK_south_amrican_desc:"§P我曾看到，我曾遇见，孩子们的笑颜，那不是什么奇迹，更不是什么魔法，那是千千万万双手将我们高高托起。\n战斗至今的大家啊，相信希望的孩子们啊，我不想再让他们哭泣，希望她们都能笑着到最后。这就是我的祈愿，我的——愿望。§!"
