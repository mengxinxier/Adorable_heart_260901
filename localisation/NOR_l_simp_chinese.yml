  NOR_army_air_force_desc: "我们的空军是[NOR.GetAdjective]天空之主宰，亦可成为自己命运的主宰。空军应拥有必要的资源，以有效的方式开展现代战争所需的一切行动。"
  NOR_naval_force: "海军力量"
  NOR_naval_force_desc: "我国有世界上最长的海岸线之一，这固然有其优势，但亦意味着需要付出更多的努力来捍卫之。我国海军将是国防的第一道防线。"
