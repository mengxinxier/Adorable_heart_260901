#事件

  NOR_pol.1.t: "老朋友"
  NOR_pol.1.d: "高原的风雪，把木屋的窗棂拍得簌簌作响。\n亚梓莎是被楼下一阵轻一阵重的悉索声弄醒的。暖烘烘的绒被裹着她不老不死的身体，连指尖都浸着松针熏过的暖意，她迷迷糊糊睁开眼，先看见窗玻璃上结满了冰花，外面是漫无边际的白，高原的雪已经下了整整三天。她披了件厚羊毛披肩，踩着吱呀作响的木楼梯往下走，刚到转角，就看见哈尔卡拉正蹲在壁炉边的地板上，手忙脚乱地收拾翻倒的药草篮。麦色的卷发垂下来，挡住了她涨红的脸，嘴里还碎碎念着 “哎，我的药草”。\n那束垂落的、泛着浅金光泽的麦色卷发，忽然撞进了亚梓莎的记忆里……\n也是这样一个落着暴雪的冬天，一群衣衫褴褛的索米流亡者撞进了她的高原，为首的姑娘就是砂糖，脸和鼻尖都冻得发紫，却死死攥着卷边的小册子，梗着脖子说 “我们不会给您添麻烦，只想要个能落脚的地方”，眼睛亮得像烧着一团不肯灭的火，倔强又冲动。\n那年开春，自己把砂糖和她的同伴们送去了南方，送到了那个叫利姆鲁的史莱姆建立的魔国联邦。算起来已经快三年了，这三年里只偶尔从南下的商队嘴里听到零星消息，说砂糖在魔国办了工人报纸，组织了工会，闹得风生水起，也惹了不少麻烦。\n也不知道那个总爱横冲直撞的姑娘，现在在南方过得怎么样了。有没有被那些高高在上的魔王们刁难，有没有在暗流涌动的纷争里吃亏，有没有……还记着高原上这个给过她落脚处的魔女。“亚梓莎大人！您醒啦？”\n哈尔卡拉终于收拾好了药草，一抬头看见站在楼梯口的她，吓了一跳，连忙站起来手足无措地鞠躬，“我、我不小心打翻了药篮，是不是吵到您睡觉了？”\n亚梓莎回过神，摇了摇头，目光落在窗外依旧没停的风雪上，轻声说：\n"
  NOR_pol.1.a: "“没事。就是忽然想起个老朋友。”"

  NOR_pol.2.t: "南下？"
  NOR_pol.2.d: "二楼的木门 “哐当” 一声被撞开，两个圆滚滚的小身影踩着木楼梯咚咚咚往下冲，领头的法尔法还没到楼下，脆生生的声音先炸了过来：“亚梓莎大人！莎尔莎又抢我的演算纸！”跟在后面的莎尔莎抱着胳膊，不服气地回嘴：“明明是你把演算纸摊在我的书上！我那是纠正你画错的符文！”\n半透明的罗莎莉顺着壁炉的烟囱轻飘飘滑了下来，雾白色的裙摆扫过跳动的火苗，她捂着嘴笑出了声：“好啦好啦，大清早的就拌嘴，小心亚梓莎大人罚你们俩去扫门口齐腰深的雪哦。”\n话音未落，正门就被一股裹着雪的风 “哗啦” 掀开，扛着一头肥鹿的芙拉特露蒂大步跨了进来，龙角上还挂着两团圆滚滚的雪团子，她随手把猎物往地上一掷，震得地板都轻轻晃了晃，亮着嗓子大笑：“各位！晚上烤鹿肉吃！”一屋子瞬间炸开了锅，只有哈尔卡拉被震得刚捡起来的药草又哗啦啦散了一地。\n她嗷了一声，忽然一拍脑门，从围裙口袋里掏出一封封着红漆的信，信封上还印着卡尔马联盟标志性的齿轮徽章，“哎呀！我差点忘了正事！” 哈尔卡拉把信举得高高的，“今早过境的商队送来的！说那边的机械工厂要搞大罢工，问我要不要回去一起参加！”\n“卡尔马？就是那个全是铁疙瘩机械的城市？” 芙拉特露蒂眼睛一亮，一把捞过信凑过去看，“我还没去过呢！听说他们的机械船能顶着北海的风浪跑三天三夜！”\n莎尔莎也凑了过来，指尖点着信封上的邮戳：“卡尔马联盟的历史我看过，正好想去看看他们的国家博物馆！”\n法尔法已经掰着手指头算开了：“从高原南下到卡尔马，走商道的话快马要十二天，要是坐芙拉特露蒂姐姐的龙背，三天就能到！路上要带的干粮、药草、防寒的毯子……”\n一屋子人叽叽喳喳吵成一团，满是对南方热闹城市的向往。亚梓莎靠在楼梯扶手上，看着闹哄哄的大家，指尖无意识地摩挲着披肩的流苏，心里忽然动了一下。她在这片高原上待了快三百年，每天的日子就是猎杀史莱姆、晒药草、看着日升雪落，安稳是安稳，却也实在静得太久了。正好借着哈尔卡拉回卡尔马的机会，往南走一趟玩玩也好。去看看热闹的港口城市，看看哈尔卡拉心心念念的故乡，顺便……也能拐去魔国联邦的都城，看看三年前被她送南下的那个粉色卷发、倔强又冲动的砂糖小姐，到底过得怎么样了。\n亚梓莎弯了弯嘴角，看着闹成一团的大家，轻笑着开口：\n“既然大家都这么想去，那我们就收拾收拾，南下玩一趟呗。”\n"
  NOR_pol.2.a: "好耶！"

  NOR_pol.3.t: "拉贾"
  NOR_pol.3.d: "顺着斯堪的纳维亚山脉一路往南，脚下的雪从齐腰深的厚棉絮，慢慢缩成了路边沾着松针的薄霜，风里的寒气都软了不少，混着松脂、鞣制皮革的香气，以皮货闻名全北欧的拉贾，就这么热热闹闹地撞进了眼里。\n镇子口的木牌上还刻着瑞典文的旧地名，可街里的热闹早就不是当年那个只靠皮货过活的悠闲小镇了。两边的铺子挨挨挤挤，挂满了油光水滑的驯鹿皮、狐皮、熊皮，猎户的吆喝声、皮货商的议价声、货郎的铃铛声搅成一团，来往的人更是五花八门：裹着厚皮袄的本地猎户、戴高顶礼帽的瑞典商人、别着卡尔马齿轮徽章的杜伦布货郎，连裹着索米厚围巾的索米旅人都能撞见好几个。\n先是杂货铺门口堆得冒尖的杜伦布小工业品：亮闪闪的铁皮发条小火车，上了弦就能哒哒哒跑遍整张桌子；手摇缝衣机、防风打火机、带刻度的铁皮量杯，全是卡尔马新出的玩意儿，摆了满满一货架；再往前走，枪械铺的柜台上，瑞典造的短管猎枪、连发来福枪明晃晃地摆着，连附魔的魔改子弹都敢拆开展示，半点不藏着掖着；连街边卖黑麦面包的摊子，都换上了杜伦布产的铁皮烤炉，烤出来的面包外酥里软，效率比老式土窑快了三倍都不止。\n“嚯，” 罗莎莉终于停下脚步，抱着胳膊啧了一声，那点懒洋洋的劲儿都散了大半，“我两年前跟着商队路过这儿，满街都是鞣皮子的酸臭味，现在倒好，快赶上我以前见过的工业小城了。”\n她晃到亚梓莎身边，用下巴点着满街的新鲜玩意儿：“你看，杜伦布的工业品都铺到这深山里了，瑞典的禁枪都敢明着卖，以前这儿可是瑞典说一不二的势力范围，现在倒成了三不管的杂货铺了。”\n话音刚落，她的脚步忽然顿住，刚才还半眯着的眼睛一下子瞪得溜圆，差点当场蹦起来——街角一个摆旧书的小摊子上，几本画着彩色封面的薄册子，正安安静静躺在最角落。\n"
  NOR_pol.3.a: "“天哪！索米的小人书？！”"

  NOR_pol.4.t: "小人书"
  NOR_pol.4.d: "守摊子的戴毡帽小伙子吓了一跳，赶紧冲她疯狂比嘘的手势，紧张地瞟了瞟不远处的瑞典商人，脑门上都冒了汗。\n可罗莎莉已经顾不上了，她捧着那几本画得鲜活的小人书，封面上画着穿工装的工人举着旗子，内页是一格格生动的小故事，页脚还印着小小的红色标语，正是索米印的工人主题小人书。\n“这玩意儿在瑞典可是抓到就坐牢的严禁品啊！”，罗莎莉压着嗓子，扭头就冲亚梓莎喊，“亚梓莎大人你看！我之前只听砂糖小姐提过，说索米的小人书画得特别好，瑞典王室怕老百姓看了闹事，收一本烧一本，居然在拉贾能随便摆着卖！”\n这话一出，刚才散在各处的人瞬间都围了过来。法尔法扒着姐姐的胳膊，盯着小人书上的彩画眼睛亮晶晶的；哈尔卡拉抱着刚挑好的鹿皮手套挤过来，好奇地探头看；连扛着新猎枪的芙拉特露蒂都凑了过来，挠着后脑勺纳闷：“这小画本有什么稀奇的？比我刚买的猎枪还宝贝？”\n亚梓莎笑着接过一本翻了翻，指尖划过封面上鲜活的画，心里早就了然。这看着还是慢悠悠、满街皮货香的拉贾，骨子里早就天翻地覆了。瑞典的手已经管不住这儿，杜伦布的工业品顺着商道往这儿涌，连瑞典严禁的东西都能光明正大地摆上摊子，这北欧的风早就从南边吹过来了，连这深山里的小镇，都跟着变了模样。\n最后莎尔莎大手一挥，把摊子上所有的索米小人书全包了圆，分了一半塞给法尔法，美滋滋地全揣进了包里，连刚才那点懒洋洋的劲儿都没了，走路都带风。\n一行人在拉贾的集市上逛了个痛快，驮在龙背上的行囊塞满了皮货、零食、小人书，还有一堆杜伦布产的新鲜小玩意儿，连赶路的疲惫都被这满街的热闹烘得一干二净。"
  NOR_pol.4.a: "魔国真是蒸蒸日上啊"

  NOR_pol.5.t: "钢之轨"
  NOR_pol.5.d: "歇了一夜再往南走，两日便踏入尤拉萨尼亚开阔谷地。雪山远逝，风里寒气散去，谷地主道上车水马龙，驼队、商旅、兽人护卫络绎不绝，驼铃、马蹄与吆喝声交织，比拉贾集市热闹三分。\n正跟着商队前行，法尔法忽然拽住亚梓莎衣袖，指着荒草里的黑色铁条：“亚梓莎大人！看那锈迹斑斑的铁轨！” 钢轨大半被野草覆盖，枕木歪斜，冷清得被世界遗忘。\n哈尔卡拉蹦出来爆料：魔王拉米莉丝想重铺铁路运货，却被老兽人族长以 “铁轨压龙脉” 阻拦，吵了半月气鼓鼓只能不了了之。\n芙拉特露蒂站在钢轨上，踩得锈渣掉落，叉腰大笑：“哪有什么龙脉！这是我故乡，根本不信那套！”\n法尔法蹲在铁轨边拿树枝戳锈迹，碎碎念：“铁路修好，坐火车两天到卡尔马，比骑马快，还能装好多蜂蜜糖和小人书……”\n “……早年间卡西米尔大战灾变，苏俄与中欧商道被拦，全靠这条谷地铁路续命。当年昼夜有火车穿梭，小麦、矿石、机械、工艺品全经此路，旅店爆满、站票抢破头！如今魔导国攥住中欧商道，此线被弃用，风吹日晒锈成这般模样。”\n 芙拉特露蒂扛着野果跑回来，招呼众人：“走啦！前面有我常去的溪谷，晚上扎营烤鹿肉，我还知道能吃的野蘑菇！”\n 一行人热热闹闹前行，将锈铁轨与藏着的大陆风云甩在身后。亚梓莎走在队尾回头望，安兹的崛起，早已搅翻整个欧洲的格局。"
  NOR_pol.5.a: "桑海沧田"

  NOR_pol.6.t: "故土之变"
  NOR_pol.6.d: "越往谷地深处走，原本闹哄哄的队伍忽然静了大半。\n最明显的是芙拉特露蒂。前几天还扛着猎物大步流星、亮着嗓子讲自己小时候掏鹰窝糗事的龙族姑娘，这会儿话少得可怜，龙角上挂的小铃铛随着脚步晃，却没了之前叮铃哐啷的快活劲儿，脚步越走越慢，金色的竖瞳时不时往两侧山林瞟，尾巴尖绷得笔直，明眼人都能看出她的不安。\n“怎么了？” 亚梓莎放慢脚步，和她并肩走，笑着拍了拍她的胳膊，“这都快到你老家了，怎么反倒蔫了？难不成是近乡情怯，怕你爹娘念叨你当年偷跑出去闯祸的事儿？”\n这话一出，旁边的哈尔卡拉和法尔法都偷偷笑了起来，可芙拉特露蒂却没像往常一样梗着脖子反驳，只是抿了抿嘴，摇了摇头：“不是的，亚梓莎大人。我总觉得…… 不对劲。”\n她抬手指了指两侧的山林，眉头皱得紧紧的：“我小时候，这山里到处都是龙裔的哨岗，隔几里地就能听见同族的龙啸，现在太静了，连只山鹰都少见。”\n话音刚落，队伍转过一道挡路的山坳，眼前豁然开朗，本该是芙拉特露蒂口中“热热闹闹、打铁声能飘出三里地”的龙裔故乡，就这么安安静静地铺在谷地里，却半点不见热闹模样。沿街的石屋塌了大半，屋顶的木梁歪歪扭扭地戳在天上，原本该是铁匠铺的地方，只剩个烧得焦黑的门框，风一吹，碎木屑簌簌往下掉；道旁原本该摆满手工皮具、附魔兵器的摊子，早就被荒草盖了个严实，连路上的石板都被翻得坑坑洼洼。\n这哪里还是个兴旺的手工业小镇，分明是个被人掏空了的荒废谷地。\n“爹！娘！莱卡！”\n芙拉特露蒂愣了两秒，突然疯了一样往前冲，撞开一间塌了半扇门的石屋，里面空荡荡的，家具被砸得稀烂，地上落着厚厚的灰尘，半点人住过的痕迹都没有。她一间间屋子撞过去，从村头跑到村尾，原本亮闪闪的眼睛里，光一点点暗了下去。\n哈尔卡拉急得跟着跑，麦色的卷发都跑散了，蹲在地上扒着碎木头找线索，嘴里不停念叨：“怎么会这样啊……前两年商队还说这里好好的……” 罗莎莉飘在半空中，半透明的身子穿遍了所有屋子，连地窖都没放过，飘回来的时候脸上的笑也没了，摇了摇头：“没人，所有屋子都空了，连粮食都搬得干干净净。”\n亚梓莎蹲下来，指尖捻起一点土，闻见了淡淡的硝烟味，还有瑞典符文火药特有的硫磺气息。她忽然想起在拉贾集市上，那些抱着附魔枪械、眼神阴鸷的瑞典商人，想起这几年越传越凶的、瑞典军方抓捕龙裔组建龙骑兵的传闻，喉咙里像堵了块石头，顿时沉默不语。\n“别慌呀！” 罗莎莉忽然飘起来，往西边的方向指了指，雾白色的裙摆晃了晃，给大家递了个亮堂堂的希望，“再往西走就是米莉姆大人的地界了！那边是龙之都！好多龙裔都往那边去投奔，说不定叔叔阿姨和莱卡姐姐，都去米莉姆大人那里避祸了呀！”"
  NOR_pol.6.a: "兴许……"

  NOR_pol.7.t: "界碑"
  NOR_pol.7.d: "路边的界碑歪斜插在土里，大家凑过去一看，界碑上的字被刮掉了大半，还能看清底下刻着的 “法鲁梅纳斯” 几个字，旁边还歪歪扭扭刻着个瑞典王室的徽章。\n“法鲁梅纳斯……本名是法尔姆斯王国。” 莎尔莎抱着胳膊，“之前好几次起兵反抗利姆鲁国王的统治，被魔国联邦镇压之后，就撤掉了邦国级别，成了联邦边境的自治领。它西边挨着瑞典边境，本来就偏向人族，和魔国一直不对付。”\n芙拉特露蒂忽的一拳砸在旁边的石墙上，震得碎石簌簌往下掉。姑娘金色的竖瞳里翻着怒火，脸颊两侧甚至露出了细碎的龙鳞，原本耷拉的龙角绷得笔直，声音里压着快要炸出来的怒意，脸色阴沉得吓人。\n“避祸？不可能。” 她咬着牙，一字一句地说，“我爹娘不是会丢下老家跑掉的性子，莱卡更是守着这片山不肯走。他们不是去了龙之都，是被抓走了！”\n她抬手指着界碑上瑞典王室的徽章，指节都攥得发白：“瑞典人肯定在法鲁梅纳斯落了脚！他们来这里抓龙裔，就是为了组建那支该死的龙骑兵！我爹娘和莱卡，一定是被他们抓到法鲁梅纳斯去了！”\n风穿过荒废的谷地，卷起地上的尘土，可刚才还慌神的姑娘，这会儿眼里只剩了笃定的怒火。亚梓莎往前走了一步，拍了拍她的肩膀，没多说废话，只笑着点了点头：“行，那我们就去法鲁梅纳斯。管他什么瑞典人还是什么自治领，你的家人，我们一起找回来。”\n“对！一起去！”，哈尔卡拉举着拳头附和，哪怕腿还有点抖，也梗着脖子喊，“我带了好多麻痹药粉！能把他们全麻翻！”众人纷纷应和着。\n芙拉特露蒂看着围在自己身边的大家，眼里的怒火里，忽然掺了点暖乎乎的光。她吸了吸鼻子，猛地把背上的猎枪扛起来，亮着嗓子喊了一声，又变回了那个天不怕地不怕的龙族姑娘：“好！那我们现在就出发！去法鲁梅纳斯！把我爹娘和莱卡救出来！”"
  NOR_pol.7.a: "让他们付出代价！"

  NOR_pol.8.t: "回溯"
  NOR_pol.8.d: "法鲁梅纳斯西侧的折曲山地，连风都是沉的。铅灰色的云压在锯齿状的山尖上，刚结束的战事没留下多少惨烈的痕迹，只有道旁被拦腰炸断的松树、散落在枯草里的空弹壳、岩壁上浅浅的魔法轰击焦痕，证明这里刚打过一场仗。可诡异的是，没有遍地的尸骸，没有厮杀过后的血腥气，连弹壳都稀稀拉拉没多少，与其说是生死搏杀，倒更像一场点到为止的象征性交战。\n最前面的芙拉特露蒂脚步顿住了。山坳的空地上，留着几道深深的龙爪拖痕，地上散落着几片带着血迹的暗金色龙鳞，还有几条被蛮力挣断的精铁束缚锁链，链环上还刻着瑞典军方的符文印记。锁链旁的泥地里，留着几个清晰的、属于魔国联邦军的军靴印，还有半枚掉在石缝里的、刻着鬼族纹样的肩甲碎片。\n“回溯” 莎尔莎的声音压得很低，没了平时的懒洋洋，她蹲在地上，指尖泛起淡金色的微光，触碰到那片还带着余温的龙鳞。细碎的光影从她指尖漫开，像被风吹散的旧胶片，一帧帧浮在众人眼前：\n是红丸。鬼族青年的鬼角泛着冷光，手里的太刀还滴着血，身后的魔国士兵列着阵型，已经把瑞典人的小队逼到了山坳出口，只要一声令下，就能把这队人全留在这里。他脸上的咬肌绷得极紧，下颌线硬得像块石头，握着刀的手青筋暴起，像是在极力压着什么。\n可最终，他没下令追击。\n只听见他冷硬的声音从光影里传出来，一字一顿：“把被俘的龙裔抬上兽车，迁往龙之都，交予米莉姆大人安置。收兵，回防驻地。”\n士兵们有瞬间的迟疑，可还是依令行事。瑞典人的小队就这么毫发无损地退出了山坳，连头都没回。"
  NOR_pol.8.a: "光影碎在了风里"

  NOR_pol.9.t: "西行"
  NOR_pol.9.d: "亚梓莎看着龙族姑娘欲言又止的样子，伸手拍了拍她的胳膊：“你想去龙之都，就去吧。米莉姆在那里，你的同族也在，去看看就知道真相了。”\n芙拉特露蒂猛地抬头看她，金色的竖瞳里翻着慌乱和犹豫。她想去找家人，可又放心不下大家，更怕这一去，就撞破什么更让人无法接受的真相。\n“我们会在多瓦贡等你。”，亚梓莎补了一句，指尖轻轻按了按她的肩膀，“要是找不到，或是想明白了，就来多瓦贡找我们。”\n芙拉特露蒂沉默了几秒，最终重重地点了点头，没多说一句话，转身化作一道金色的龙影，冲天而起，朝着龙之都的方向飞去，很快就消失在了铅灰色的云层里。\n莎尔莎和法尔法对视了一眼，都没说话，只齐齐转头看向亚梓莎。罗莎莉飘在半空中，也收了平时的笑，安安静静地落在亚梓莎身侧，等着她的决定。风卷着枯草屑打在岩壁上，发出细碎的声响。亚梓莎摩挲着腰间法杖上的纹路，目光扫过地上魔国的军靴印，又望向南方。她沉默了很久，才终于开口：“先不去法鲁梅纳斯主城了。我们往西走，先去多瓦贡，再从多瓦贡南下，去朱拉。”\n多瓦贡是矮人王国，魔国最老牌的盟友，也是整个魔国消息最灵通的地方；朱拉，是特恩佩斯特联邦的核心腹地，是利姆鲁的都城所在。\n所有人都听懂了她没说出口的话，她要去魔国的心脏地带，亲眼看看，这个被砂糖小姐托付了理想的国度，这个被北欧各国传得神乎其神的魔物联邦，到底藏着多少秘密，利姆鲁到底在干什么。\n哈尔卡拉愣了一下，下意识地摸了摸怀里那封卡尔马的来信。她本来该往南走，去布鲁蒙德的港口坐船回哥本哈根，回她的故乡，和朋友们一起参加工厂的罢工。可她看着亚梓莎平静却带着沉意的侧脸，又看了看身边两个攥着彼此手的小姑娘，还有飘在一旁一脸坚定的罗莎莉，咬了咬嘴唇。\n她思索了很久，最终抬起头，对着亚梓莎用力点了点头：“那我先陪你走这趟。等从朱拉出来，我们再一起去港口坐船去哥本哈根。那里……也有很多和我一样的药剂师，还有一起闹罢工的朋友，到时候我们也能有个落脚的地方。”"
  NOR_pol.9.a: "一行人沉默地迈开了脚步"

  NOR_pol.10.t: "多瓦贡"
  NOR_pol.10.d: "从法鲁梅纳斯往西三天，刚翻过横亘的山脉，哐当哐当的蒸汽轰鸣就顺着风飘来。等一行人走到多瓦贡的城门下，连见惯了机械工坊的哈尔卡拉都忍不住瞪圆了眼睛，原本以慢工细活的手工锻造闻名的矮人王国，早已彻底变了模样。\n城门旁立着三四台两层楼高的机械吊机，正哐当哐当吊着成吨的附魔钢材起落；城墙外铺了四条并行的铁轨，黑红色的蒸汽火车喷着白汽进进出出，车厢里塞满了铁矿石、成箱的魔法零件；城内的主街拓宽了数倍，两旁的矮人工坊全换成了半机械化的流水线，锻锤的闷响、齿轮的转动声、蒸汽阀的嘶鸣混在一起，连走路的矮人都脚步带风，手里攥着卷边的图纸，嘴里念叨着工期、合格率、产能提升，连打招呼都快得像打机关枪，半点不见往年慢悠悠喝麦酒唠嗑的闲散。\n亚梓莎看着这满街的忙碌，眉头不自觉地皱了起来。她不反感现代化，更不否认这些轰鸣的机械给矮人王国带来的变化，铁轨让矿石运输快了十倍，流水线让附魔武器的量产速度翻了二十倍，连山脚的贫民矮人都能靠进工坊做工吃饱饭。可这满街的 “赶工期”“提效率”“连轴转”，像一根细针，猝不及防扎进了她前世的记忆里。那个在东京写字楼里熬了三天三夜改方案，最后倒在工位上再也没醒过来的自己，就是被这样永无止境的“效率”推着，连喘口气的功夫都没有。\n“亚梓莎大人，您不舒服吗？” 哈尔卡拉凑过来，小声拽了拽她的袖子。"
  NOR_pol.10.a: "“没事，只是想起一些往事”"

  NOR_pol.11.t: "米莉姆"
  NOR_pol.11.d: "一阵风似的身影就从旁边的工坊屋顶蹦了下来，伴随着 “哇哈哈哈哈这个爆弹威力太够劲了！”的大笑，红头发的龙魔王米莉姆・纳瓦怀里抱着一堆圆滚滚的附魔爆弹，踩着屋檐连蹦三下，一眼就瞅见了人群里的亚梓莎，金色的眼睛瞬间亮得像两颗小太阳，“嗖” 地一下就落在了她面前。\n米莉姆完全没个轻重，亮着嗓子喊了一声，“你好厉害的样子！我叫米莉姆！”，一巴掌就结结实实拍在了亚梓莎的肩膀上。那力道看着随意，实则藏着龙魔王的天生巨力，别说普通人类，就算是高阶魔物挨上这一下，都得被拍得一个趔趄跪倒在地。可亚梓莎毕竟是猎杀了三百年史莱姆练到满级的魔女，几乎是本能反应，指尖泛起一层淡蓝色的魔力屏障，轻轻一卸一弹，就把那股蛮力全化了回去，连脚步都没晃一下。\n“哦？！”，米莉姆眼睛亮得更厉害了，非但没生气，反而围着亚梓莎转了两圈，“哇！你叫什么名字啊？”\n她完全是小孩子发现了新玩具的兴奋劲儿，瞬间就把怀里的爆弹扔到了脑后，拉着亚梓莎的袖子叽叽喳喳问个不停，从 “你魔力怎么练的” 问到 “你有没有吃过朱拉的蜂蜜蛋糕”，闹得整条街的目光都聚了过来。\n没人注意到，街道旁酒馆的二楼窗口，一个裹着灰色兜帽的身影，把这一幕完完整整看在了眼里。他手里的羽毛笔快速在小本子上划了几笔，转身就消失在了阴影里。"
  NOR_pol.11.a: "“我是高原上的魔女”"

  NOR_pol.12.t: "米莉姆"
  NOR_pol.12.d: "罗莎莉才轻飘飘地从街角飘了回来，半透明的裙摆上还沾着麦酒的泡沫，“我刚才去了矮人老酒鬼扎堆的酒馆，听他们唠了半天！”，罗莎莉压着声音，眼睛亮晶晶的，“你们猜前几天法鲁梅纳斯那事儿，红丸大人为什么放了瑞典人？全是利姆鲁国王的意思！”\n哈尔卡拉瞬间瞪圆了眼睛：“为什么啊？瑞典人一直在抓龙裔，还跟魔国不对付啊！”\n“矮人说，利姆鲁国王要跟瑞典和谈！”，罗莎莉撇了撇嘴，“他想把整个北欧的势力全拧成一股绳，杜伦布、瑞典、挪威、索米，全都联合起来！说是不抱团的话，迟早被安兹一个个吞掉！”\n她顿了顿，忍不住笑了一声：“那些矮人都觉得这事啼笑皆非，说利姆鲁国王是不是当魔王当魔怔了，好好的日子不过，天天念叨什么‘魔国要灭亡了’，为了这个没影的事儿，居然跟抓自己同胞的瑞典人和谈，连红丸大人都得憋着气放跑那些瑞典人，说他是为了讨好人类，连魔物的死活都不管了。”\n刚才还抱着蜂蜜面包啃得正香的米莉姆，忽然就安静了下来。她啃面包的动作停住了，垂着眼睛，没人能看清她的表情。可也就沉默了短短几秒，她猛地抬起头，又变回了那副大大咧咧的样子，把最后一口面包塞进嘴里，哈哈笑着摆手：“哎呀！利姆鲁就是爱瞎操心！有我在呢，谁敢打魔国，我一拳就给他打飞到天上去！”\n说着她就蹦起来，一把抓住亚梓莎的手腕，眼睛亮闪闪的：“走走走！我带你们去朱拉玩！利姆鲁那里有超好吃的蜂蜜蛋糕，还有拉米莉丝建的超好玩的迷宫！我带你去炸迷宫玩！”亚梓莎却轻轻往后退了一步，不动声色地抽回了手。她看着米莉姆满是期待的眼睛，弯了弯嘴角：“多谢米莉姆大人的好意，不过我们就不跟您同行了。我们想自己慢慢往南走，沿路看看风景，顺便找一位老朋友。”\n米莉姆有点失落，噘着嘴鼓了鼓腮帮子，不过也就蔫了两秒，又瞬间恢复了精神：“好吧！那你们要是去了朱拉，一定要来找我玩！” 说完就抱着她的爆弹，又风风火火地冲了出去，嚷嚷着要去工坊试新做的火焰爆弹，转眼就没了影子。\n酒馆的后门阴影里，那个灰色兜帽的身影，又把亚梓莎拒绝米莉姆的一幕看了个正着。他对着手里的传讯水晶低声说了几句，脚步轻得像烟，再次消失在了巷尾。\n酒馆里又安静了下来。莎尔莎抱着胳膊皱着眉，没了平时的懒洋洋：“利姆鲁的‘魔国灭亡论’……真的是杞人忧天吗？安兹的魔导国，确实已经把整个中欧攥在手里了，要是北欧真的联合起来，确实能挡住魔导国……可是瑞典一直在抓龙裔，跟他们联合，芙拉特露蒂姐姐肯定接受不了。”\n亚梓莎没说话，只是看着窗外依旧忙碌的多瓦贡街道。蒸汽火车的轰鸣顺着风飘进来，铁轨延伸向南方，尽头就是魔国联邦的都城朱拉，是利姆鲁的地盘，也是砂糖小姐所在的地方。"
  NOR_pol.12.a: "我们去朱拉！"

  NOR_pol.13.t: "火车呼啸"
  NOR_pol.13.d: "多瓦贡开往朱拉的火车，哐当哐当晃得人牙根都发酥，白汽顺着车厢缝隙钻进来，混着煤烟味和麦饼的甜香，把整节车厢都填得热热闹闹。\n亚梓莎靠在窗边的软椅上，指尖无意识地摩挲着窗沿被震得嗡嗡响的玻璃，心里忍不住暗自吐槽。这破火车最快时速也就三四十公里，晃得快散架不说，逢个小站就要停半天，别说前世东京到京都的新干线，连最慢的绿皮火车都比它稳当快当。真要论速度，她自己展开魔力飞，半天就能从多瓦贡冲到朱拉，哪用得着在这铁皮盒子里熬上两天两夜。\n侧里众人却早被这会跑的铁盒子勾走了全部心神，新奇得不得了。\n火车冲过一片林间弯道的瞬间，窗外一道红影快得像流星，贴着铁轨上方的低空，嗖地一下就掠了过去。速度快到离谱，连扒着窗户的莎尔莎和法尔法都只觉得眼前晃了一下，还以为是风卷着红叶飞了过去，眨眨眼就忘了。可亚梓莎看得清清楚楚。\n是米莉姆。\n还是那头标志性的火红色长发，还是那件黑色的露脐劲装，可那张永远挂着没心没肺大笑的脸，此刻却完全变了模样。眉头死死拧在一起，嘴角抿成了一条冷硬的直线，金色的竖瞳里没有半分平日的快活，全是压不住的急切，甚至还掺着点阴沉的怒意，连身后展开的龙翼都绷得笔直，像一支离弦的箭，疯了似的朝着朱拉的方向冲去。\n不过半秒的功夫，红影就消失在了树林的尽头，快得像一场错觉。"
  NOR_pol.13.a: "出事了！"

  NOR_pol.14.t: "噩耗"
  NOR_pol.14.d: "火车哐当哐当地穿过最后一片橡树林，朱拉的轮廓就这么撞进了所有人的视线里。和亚梓莎预想中、传闻里那个“魔物森林里的小聚落”完全不同。眼前的都城，早已不是散乱的木屋村落，而是铺展开的、规整又鲜活的现代化城市：四条并行的铁轨从城门一直延伸到城市腹地，整备场里停着喷着白汽的蒸汽机车；沿街立起了两排带玻璃罩的魔法路灯，三四层高的砖石楼房挨挨挤挤，一楼是亮着橱窗的商铺、工坊，二楼三楼住着居民，连路面都铺着平整的青石板，马车、人力车、甚至还有烧酒精的小型机动车在路上穿梭。可它又不是全然的钢铁机械气息。楼房的墙面上爬着精灵族培育的开花藤蔓，街角的老橡树被完整地保留下来，树洞里还开着一家小小的蜂蜜铺子；远处的王宫旁，还留着最初那片魔物聚落的树屋群，和不远处的蒸汽钟楼遥遥相对，新旧痕迹奇异地揉在了一起，既有人类城市的规整便利，又藏着魔物国度独有的自然气息。\n直到车轮碾过铁轨接缝的最后一声闷响落下，整列火车稳稳停在了朱拉中央车站的站台旁，车厢里的乘客都起身收拾行李，等着车门打开，可等了足足十分钟，车门纹丝不动。车厢里瞬间骚动起来，邻座的矮人商人拍着车门喊：“怎么回事？怎么不开门？！”\n就在这时，车厢顶部的广播突然响起，刺啦的电流声过后，是一个冷硬的、不带任何感情的女声：「紧急通告。朱拉全城进入最高戒严状态。利姆鲁国王遇刺重伤，所有城门、关卡即刻封闭，境内所有人员禁止非必要流动，所有外来列车、外来人员一律禁止入境，原地等候处置。重复一遍……」广播声还在循环，车厢里的喧闹瞬间像被掐断了一样，死一般的静。\n哈尔卡拉手里的帆布包 “啪嗒” 掉在地上，她脸色发白地攥住亚梓莎的袖子，声音都在抖：“遇、遇刺？利姆鲁国王……这是可以广播来说的吗？”\n莎尔莎和法尔法对视一眼，姐妹俩都收起了脸上的新奇，眉头紧紧皱了起来，她们瞬间想起了法鲁梅纳斯山坳里那场诡异的战事，想起了多瓦贡酒馆里那些关于 “利姆鲁背叛魔物” 的流言。"
  NOR_pol.14.a: "谁干的？"

  NOR_pol.15.t: "单行的轨道"
  NOR_pol.15.d: "就在这时，火车头的方向传来了司机的喊声，顺着车厢传了过来：“各位乘客！车站通知，所有入境列车不得停靠朱拉！要么原路折返多瓦贡，要么继续往前开，到边境的布鲁蒙德站停靠！十分钟后发车！大家选好去向！”车厢里又乱成了一团，折返的、去布鲁蒙德的吵作一团。\n哈尔卡拉慌慌张张地看着亚梓莎：“亚梓莎大人，我们怎么办？折返多瓦贡，还是去布鲁蒙德啊？”\n“去布鲁蒙德。”，亚梓莎收回目光，语气平静却笃定，“朱拉现在就是个一触即炸的火药桶，进去了就别想轻易出来。布鲁蒙德是联邦边境的自治领，消息最灵通，也离风暴中心远，正好能安安静静搞清楚，这里到底发生了什么。”罗莎莉松了口气，连连点头：“对对对！去布鲁蒙德！离这些打打杀杀的越远越好！”\n十分钟后，蒸汽火车再次发出一声长长的鸣笛，车轮重新转动起来，缓缓驶离了朱拉中央车站，朝着边境的布鲁蒙德开去。\n亚梓莎靠在窗边，看着朱拉的城墙越来越远，城墙上的魔国旗帜在风里飘着，却透着一股山雨欲来的压抑。她低头，看见脚边被风吹进来一张皱巴巴的传单，上面印着的，赫然是和高原上那些匿名传单一模一样的内容，全是抹黑利姆鲁 “出卖魔物、投靠人类、叛国求荣” 的黑料，连措辞都分毫不差。\n"
  NOR_pol.15.a: "这里没有利姆鲁的气息……"

  NOR_pol.16.t: "急停"
  NOR_pol.16.d: "火车刚驶出朱拉地界不过两个钟头，哐当哐当的车轮声就戛然而止。刺耳的刹车声里，整列火车猛地一顿，车厢里的人都跟着往前踉跄了一下。还没等大家反应过来，车窗外已经围满了穿着黑色制式铠甲、挎着附魔步枪的联邦军士兵，冰冷的枪尖对着车厢，带队的军官举着扩音魔导器，冷硬的声音顺着车厢缝隙钻进来：\n「奉联邦军务部令，全国进入战时动员状态！所有民用列车即刻征用，用于军队物资与人员转运！所有乘客立即下车，自行安排行程！重复一遍……」\n车厢里瞬间炸开了锅，叫骂声、抱怨声、哭喊声混在一起。邻座的矮人商人拍着车门跳脚，骂骂咧咧地说自己的货要误了期；带着孩子的人类母亲抱着孩子缩在角落，脸色发白。哈尔卡拉也慌了，攥着亚梓莎的袖子，声音发紧：“亚梓莎大人，怎么办？火车被征用了，这里离布鲁蒙德还有快八十公里呢……”\n罗莎莉飘在车窗边，瞅了瞅外面荷枪实弹的士兵，缩了缩脖子：“好多士兵啊……还有好几个高阶魔物，硬闯肯定不行，我可不想被当成刺客同党抓起来。”\n只有亚梓莎依旧从容。她靠在椅背上，扫了一眼外面严阵以待的军队，心里清楚，利姆鲁遇刺重伤，整个魔国的体系都进入了应激状态，军队动员、列车征用，都是意料之中的事。她没打算跟这些奉命行事的士兵起冲突，只是轻轻拍了拍哈尔卡拉的胳膊，安抚道：“没事，下车就好。八十公里而已，比这更远的路，我也带你们走得。”\n她带着众人顺着人流下了火车，刚离开铁轨没多远，就看见士兵们已经开始清卸车厢里的货物，准备掉头往朱拉方向开。路边的荒地里挤满了被赶下车的乘客，乱哄哄的一片，骂声不绝于耳。"
  NOR_pol.16.a: "总算离开这破火车了"

  NOR_pol.17.t: "砂糖"
  NOR_pol.17.d: "亚梓莎没在原地多停留，找了片没人的树林，抬手张开了一层淡蓝色的风之结界，把所有人都裹了进去。魔力铺展开来，带着众人浮了起来。风从耳边掠过，脚下的树林、田野飞速倒退，不过一个多时辰，布鲁蒙德的轮廓就出现在了地平线上。\n和朱拉规整肃穆的首都气质完全不同，这座边境城市完全是一副热热闹闹、鱼龙混杂的贸易集散地模样。城市外围立着成片的工厂，烟囱里冒着淡淡的白烟，机械的嗡鸣隔着老远就能听见；城门大开着，虽然也有士兵巡逻查验身份，但比朱拉的铁桶阵松了太多，驮着货的驼队、赶着马车的商人、背着行囊的旅人排着队进城，人类、魔物、矮人、精灵混在一起，吵吵嚷嚷，半点没有首都的压抑感。\n进城之后，更是满眼的鲜活热闹。主街两旁全是商铺，五金铺、杂货铺、贸易行、酒馆挨挨挤挤，门口挂着各国的商号旗帜；路边的摊贩叫卖着杜伦布的机械小玩意儿、瑞典的皮货、索米的木雕、多瓦贡的附魔工具，甚至还有魔导国出产的魔法水晶；往来的人里，有穿着工装的工厂工人，有挎着皮包的商人，有穿着制服的市政职员，还有背着刀的佣兵，三教九流汇聚在这里，成了魔国边境最灵通的消息集散地。\n哈尔卡拉看得眼睛都直了，拽着亚梓莎的袖子小声惊叹：“天哪，这里比我想象的热闹太多了！跟哥本哈根的港口集市一模一样！”\n亚梓莎没应声，她的目光忽然定在了街对面。\n市政办公厅的灰色石质大楼就在街对面，门口立着联邦的旗帜，两个士兵守着大门。而正快步走上台阶的，正是她记挂了三年的那个人，砂糖小姐。\n现在的朱拉暗流汹涌，利姆鲁遇刺，幕后黑手藏在暗处，砂糖在市政办公厅任职，身处风暴中心，她到底站在哪一边？是忠于利姆鲁，还是被卷进了别的势力里？甚至，那些从高原一路传到她手里的传单，会不会和她所在的组织有关？"
  NOR_pol.17.a: "先找个地方落脚吧"

  NOR_pol.18.t: "微光"
  NOR_pol.18.d: "亚梓莎选了家藏在两条街夹缝里的小客店，偏僻、安静，后门直通巷弄，方便进出。开了两间连通的客房，把众人安置下来，又细细叮嘱：“哈尔卡拉，你看着两个小家伙，不要随便出门，也不要跟陌生人搭话；罗莎莉，麻烦你暗中盯着点周围，有什么动静及时告诉我。我出去一趟，天亮之前就回来。”\n……\n亚梓莎放轻脚步，走到了书房的窗下，屏住了呼吸。窗内的笔尖在纸上划过的沙沙声忽然顿了半秒。\n亚梓莎的指尖魔力已经悄然聚在了指尖，她敢肯定，自己的气息收敛得毫无破绽，哪怕是高阶魔王都未必能察觉，可窗内的砂糖，分明知道她就在外面。\n果然，那顿住的笔尖很快又动了起来，依旧是平稳的沙沙声，砂糖甚至没往窗户的方向瞥一眼，只是翻页的动作慢了半拍，像是在给她留着推门进来的余地。\n亚梓莎无声地叹了口气，收起了指尖的魔力。她本想再听些什么，可既然已经被发现，再躲着也没了意义。她抬手轻轻推了推虚掩的窗户，翻身跃了进去，落地时连半点声响都没发出，像一片飘进屋里的落叶。\n“亚梓莎大人，好久不见。”\n砂糖终于抬起了头，放下了手里的钢笔。她没有半分惊讶，也没有亚梓莎预想中的戒备、试探，甚至没有被闯入的慌乱，那双总是亮着倔强火光的眼睛里，此刻满是藏不住的喜悦，像是在一团解不开的乱麻里，终于抓到了那根最关键的线头，连眼下的青黑都淡了几分。"
  NOR_pol.18.a: "久别重逢的欢喜"

  NOR_pol.19.t: "绝境恳求"
  NOR_pol.19.d: "看着亚梓莎眼里的疑惑，砂糖终于把前因后果说了出来。利姆鲁确实遇刺了，坂口日向的破魔剑刺穿了他的防御，神圣魔法直接重创了他的精神核心，哪怕有夏尔拼尽全力修复，至今也依旧处于半昏迷的状态，连维持人形都很艰难。\n“对外只说是重伤，可只有我们几个核心的人知道，国王陛下现在连自主调动魔力都做不到。”，砂糖的声音沉了下来，指尖攥紧了桌角，“魔王议会的那帮大魔王，三天前就全到了朱拉，一个个喊着要找出刺杀国王的凶手，可他们哪里是来查案的？”\n“更别说幕后还有一只看不见的手，一直在挑唆各方势力，伪造国王陛下的黑料，连日向大人出手，怕也是被人用假证据骗了。”，砂糖抬起头，直直地看向亚梓莎，眼里满是恳求，“现在朱拉就是龙潭虎穴，忠于国王陛下的迪亚波罗大人他们，被其他魔王死死盯着，连动都不敢动，生怕落个‘挟天子以令诸侯’的话柄，根本没法暗中保护国王陛下。”\n她往前倾了倾身，语气急切又诚恳：“亚梓莎大人，我求您帮个忙。只有您能做到，实力足够护住国王陛下，又不是魔国体系内的人，所有势力都不会盯着您，您能悄无声息地找到国王陛下的安全屋，帮我们护住他，撑到他恢复过来。”\n亚梓莎握着温热的麦茶杯，指尖微微一顿。她预想过无数种可能，唯独没想过会是这样的局面。没有背叛，没有算计，只有走投无路的恳求。可她心里的疑惑依旧没解开：“你怎么会笃定我会帮你？又怎么会精准知道我的行踪？”\n砂糖的脸忽然红了一下，有点不好意思地挠了挠头，眼神往旁边飘了飘："
  NOR_pol.19.a: "“这个……是哈尔卡拉小姐一直和我有书信往来。”"


  NOR_pol.20.t: "相助"
  NOR_pol.20.d: "“从你们在高原决定南下开始，哈尔卡拉小姐每到一个地方，都会偷偷托商队给我寄信。”，砂糖越说声音越小，却还是老老实实全交代了，“你们到拉贾，去尤拉萨尼亚，翻山去多瓦贡，坐火车往朱拉来，每一步行程，她都写在信里告诉我了。她还说，您是个面冷心热的人，一定会管这件事的。”\n她顿了顿，又补充道：“我知道你们原本要去哥本哈根，所以早就安排好了。明天一早就有一班从布鲁蒙德港口出发的货轮，直达哥本哈根，船票、身份凭证、路上的补给，我全都准备好了。可以让莎尔莎小姐、法尔法小姐、罗莎莉小姐，还有哈尔卡拉小姐先坐船去哥本哈根避风头。”\n“杜伦布是卡尔马联盟的地盘，魔国的内部纷争伸不到那里去，魔王们也不会轻易去那里惹事，绝对安全。” 砂糖看着亚梓莎，眼里满是笃定，“哈尔卡拉小姐也早就跟我说了，她一直担心两个小姑娘和罗莎莉小姐卷进危险里，这也是她的意思。”\n亚梓莎靠在椅背上，终于忍不住笑了出来。她总算明白了，为什么她们一路南下，总能刚好撞上那些线索，为什么砂糖能把一切都算得这么准，原来那个看起来冒冒失失、动不动就慌慌张张的哈尔卡拉，居然一直偷偷在背后给砂糖递消息，甚至连她的性子都摸得透透的。\n窗外的夜色更浓了，远处的工厂传来隐约的机械嗡鸣，布鲁蒙德的街道安安静静，可谁都知道，魔国的天，已经快要翻了。\n亚梓莎放下手里的茶杯，抬眼看向砂糖，语气平静却带着不容置疑的笃定：“船，让小家伙们明天按时走。至于利姆鲁那边，我帮你。”砂糖的眼睛瞬间亮了，那股快要熄灭的倔强火光，一下子重新烧了起来。她对着亚梓莎又深深鞠了一躬，声音都带着点颤抖的哽咽："
  NOR_pol.20.a: "“亚梓莎大人！谢谢您！”"

  NOR_pol.21.t: "魔王的踪迹"
  NOR_pol.21.d: "朱拉大森林的结界对她而言形同虚设。魔国的高阶魔物们布下的七层反侦察魔法阵、精神力屏障、甚至连夏尔特意设下的魔力伪装，在猎杀了三百年史莱姆、对魔物气息敏锐到极致的满级魔女面前，都像一层一戳就破的窗户纸。她循着那股若有若无的、带着暴风气息的史莱姆核心魔力，一路穿过密林，最终停在了一处被参天古木围起来的隐秘温泉旁。\n最危险的地方，果然就是最安全的地方。没人会想到，全魔国都在找的、传闻中重伤昏迷的利姆鲁国王，既不在重兵把守的王宫安全屋，也不在原初恶魔们的结界庇护下，而是藏在他刚转生时落脚的这片森林里，泡在暖融融的温泉中。\n温泉的水汽氤氲着漫上来，带着淡淡的硫磺与松脂香气。利姆鲁背对着池边的方向，银发沾着水珠贴在颈后，看起来半点没有重伤濒死的样子，连魔力波动都平稳得很。他似乎察觉到了池边的动静，头也没回，带着点漫不经心的活泼笑意，扬声试探道：\n“迪亚波罗？都说了别老偷偷摸摸跟着，我就是出来泡个温泉歇口气，还是红丸？难不成那帮魔王又在王宫闹起来了？”\n话音落下，他慢悠悠地转过身。\n预想中熟悉的部下身影没出现，撞进眼里的，是个穿着深色斗篷、站在池边的陌生女人。蓝灰色的长发垂在肩头，眉眼清冷，周身的魔力波动深不见底，完全不是他熟悉的任何一个人。\n利姆鲁脸上的笑意收了起来，眉头微蹙，带着十足的警惕开口："
  NOR_pol.21.a: "“你是谁？怎么找到这里的？”"

  NOR_pol.22.t: "以窦丛生"
  NOR_pol.22.d: "亚梓莎刚要开口解释，身后的林间突然炸开一股凛冽到刺骨的神圣魔法气息！快！太快了！\n哪怕是亚梓莎都只来得及捕捉到一道黑色的残影，持剑的黑发身影如同鬼魅般从她身后的树影里窜了出来，破魔剑上裹着能分解魔物核心的神圣金光，没有半分停顿，带着必杀的决心，直直刺向温泉里毫无防备的利姆鲁！\n是坂口日向！\n“利姆鲁！”，亚梓莎的提醒刚到嘴边，已经晚了。\n噗嗤一声轻响，淬满了神圣魔法的破魔剑，结结实实地刺穿了利姆鲁的胸膛。金色的神圣光芒顺着剑刃疯狂涌入他的身体，肉眼可见地分解着他的史莱姆躯体，原本平稳的魔力瞬间炸开，又在神圣力量的压制下急速溃散。\n利姆闷哼一声，身体晃了晃，扶住了温泉边的石头，原本清亮的金色瞳孔里瞬间漫上了痛楚与冷意。\n亚梓莎的脑子嗡的一声，瞬间乱成了一团麻。\n日向怎么会找到这里？！\n是砂糖骗了她？从一开始就是个局，引她来这里给日向带路？还是日向从布鲁蒙德就开始跟踪她，借着她的气息，避开了所有的结界与守卫？还是说……利姆鲁的重伤从一开始就是演戏，现在这一剑，也是他算计好的？"
  NOR_pol.22.a: "是谁在骗谁？谁又把谁当成了棋子？"

  NOR_pol.23.t: "出手"
  NOR_pol.23.d: "坂口日向已经抽回了破魔剑，手腕翻转，就要补上第二剑，彻底击碎利姆鲁的精神核心。\n“滚开！”，亚梓莎几乎是本能地出手，淡蓝色的魔力屏障瞬间炸开，硬生生挡住了日向的第二剑。冰棱与神圣金光撞在一起，发出刺耳的爆鸣，林间的树叶瞬间被震得簌簌落下。她反手抽出腰间的法杖，满级魔女的魔力毫无保留地铺展开来，冰系魔法如同潮水般涌向坂口日向，将她逼得连连后退。\n“你是什么人？” 坂口日向的冷冽的目光扫过亚梓莎，破魔剑横在身前，眼神里满是戒备，又带着几分了然的冷意，“原来你是他的同党。”\n“同党？” 亚梓莎冷笑一声，法杖在身前一转，数道冰墙封住了日向的退路，“我倒想问问，你是怎么跟着我找到这里的？幕后挑唆你出手的人，到底是谁？”\n话音未落，两人已经战作一团。\n神圣魔法与冰系魔法在林间疯狂碰撞，金光与蓝光炸开，震得温泉的水掀起阵阵波澜。坂口日向的剑术精准狠辣，每一剑都直指魔物的核心弱点，神圣魔法对亚梓莎的魔女魔力有着天生的压制力；可亚梓莎毕竟是活了三百年的满级魔女，战斗经验早已刻进了骨子里，魔法信手拈来，冰棱、风刃、麻痹咒文层层叠叠，逼得日向根本没法再靠近温泉半步。\n而温泉边，利姆鲁靠着石头，勉强稳住了溃散的躯体。夏尔的紧急修复在疯狂运转，可破魔剑的神圣力量依旧在侵蚀他的核心，这一次，是真真切切的重伤。"
  NOR_pol.23.a: "不会让你得手了"

  NOR_pol.24.t: "克莱曼"
  NOR_pol.24.d: "林间的魔法爆鸣还在持续，神圣金光与冰蓝寒芒一次次撞在一起，掀起的气浪掀翻了满地落叶，连温泉的水面都被震得掀起层层波澜。\n“哎呀哎呀，真是一场精彩的厮杀啊，坂口日向大人，还有这位不知名的魔女小姐，你们都被这个卑鄙的史莱姆骗得团团转啊！”，阴影里缓步走出一个身着华丽紫袍、面容精致却带着阴鸷之气的男人，指尖缠绕着肉眼难辨的银色操偶丝线，身后跟着四个面无表情的人偶，正是当年被利姆鲁击溃、蛰伏在法尔姆斯旧地数年的克莱曼。他抬手一挥，银色丝线在空中铺开，映出一幅幅触目惊心的画面：被魔国军队踏平的法尔姆斯城池焦黑的民居、流离失所的民众，还有利姆鲁“下令收割人类灵魂” 的文书。\n“我是克莱曼，曾经的法尔姆斯王国摄政！”，他的声音陡然拔高，带着淬了毒的恨意，“这个屠夫利姆鲁，当年为了扩张他的魔物国度，血洗了整个法尔姆斯，数十万人类死在他的暴食者之下！现在他又为了讨好人类王国，出卖自己的魔物同胞，把龙裔送给瑞典人当骑兵坐骑，把魔物世代生存的森林拆成冒烟的工厂！我们要杀的，就是这样一个双手沾满鲜血、背信弃义的暴君啊！”\n这番话像一把火，瞬间点燃了两人心里的摇摆。亚梓莎的动作猛地一顿，她想起了尤拉萨尼亚谷地荒废的龙裔家园，想起了拉贾集市上那些带着枪械的瑞典人，想起了从高原一路传到她手里的、措辞一模一样的抹黑传单，手里的法杖瞬间迟了半拍，冰棱的攻势硬生生停了一瞬。\n而坂口日向本就被伪造的证据蒙蔽了双眼，克莱曼的话更是彻底印证了她心里的“正义”。她眼中的冷光更盛，破魔剑上的神圣金光暴涨，剑招越发凌厉，逼得亚梓莎连连后退，两人彻底缠在了一起，再也分不出半分目光留意温泉边的利姆鲁。\n就是现在！克莱曼眼中闪过一丝阴狠的算计，指尖的银色丝线瞬间绷直！藏在林间阴影里的十几具人偶同时炸开，化作无数淬了咒杀毒素的黑针，铺天盖地地射向温泉里重伤的利姆鲁；同时他另一只手飞速结印，漆黑的亡者咒杀魔法在掌心成型，带着能腐蚀灵魂的寒意，直直撞向利姆鲁被破魔剑贯穿的胸口。这是他筹谋了数年的必杀一击，算准了利姆鲁被神圣魔法重创、魔力溃散，算准了两个最强的战力互相牵制，就是要一击毙命，为覆灭的法尔姆斯复仇，夺回他失去的一切。\n“利姆鲁！给我去死吧！你的命，该还给法尔姆斯的数十万亡魂了！”"
  NOR_pol.24.a: "利姆鲁没死"
  NOR_pol.24.b: "利姆鲁死了"

  NOR_pol.25.t: "魔王反击"
  NOR_pol.25.d: "黑针与咒杀魔法转瞬即至，亚梓莎想要回防，却被日向的剑死死缠住，只能眼睁睁看着攻击撞向利姆鲁。温泉里的利姆鲁晃了晃身体，胸口的伤口还在被神圣魔法持续侵蚀，连维持人形都有些艰难，看起来毫无反抗之力。\n【解析完成。克莱曼咒杀魔法核心破解完成。操偶丝线结构解析完成。维鲁德拉魔力链接，同步率100%。暴食者权限，全开。】\n夏尔冷静的声音在脑海里响起的瞬间，利姆鲁原本溃散的魔力骤然凝聚！被神圣魔法撕裂的躯体瞬间化作漆黑的粘稠流体，铺天盖地的黑针、咒杀魔法，甚至连克莱曼射过来的操偶丝线，全都被这流体一口吞噬，连一丝魔力波动都没剩下，彻底分解得无影无踪。\n“克莱曼。”，利姆鲁的声音冷了下来，属于八星魔王的威压铺天盖地地炸开，整个林间的空气瞬间凝固，连风都停了。他的身形重新凝聚，胸口的伤口依旧狰狞，可周身的魔力却已经暴涨到了极致，漆黑的暴食者领域在他身后展开，像一张择人而噬的巨口。“我当初留你一条残命，是让你反省自己的所作所为，不是让你躲在暗处，拿着伪造的证据骗日向出手，把无辜的人卷进你的阴谋里，玩这些上不了台面的鬼把戏。”\n克莱曼的脸色惨白，他怎么也没想到，被破魔剑重创的利姆鲁，居然还能爆发出这样的力量。他尖叫着转身就跑，指尖甩出无数操偶线想要阻拦，可那些丝线刚碰到暴食者的领域，就被瞬间分解殆尽。他的脚踝已经被漆黑的流体缠住，分解之力顺着腿疯狂往上蔓延，连他的魔力都在被疯狂吞噬。\n“不可能！你明明被神圣魔法重创了！你的核心应该已经被分解了！你怎么可能还有这种力量！”，克莱曼疯了一样催动魔力挣扎，甚至想要引爆自己的核心同归于尽，可他的所有动作，都被夏尔提前一秒预判，所有魔力刚溢出来，就被暴食者吞得一干二净。\n“重伤是真的，但你真以为，我会把自己的性命，放在别人的算计里？”，利姆鲁一步步走向他，金色的瞳孔里没有半分温度，“从你伪造利姆鲁出卖魔物的传单散到高原，从你挑动魔王议会散布谣言，从你骗日向对我出手开始，夏尔就已经锁定了你的踪迹。我演这一场戏，等的就是你自己跳出来的这一天。”\n缠斗的两人早已停了手。坂口日向手里的破魔剑垂了下来，看着克莱曼惊慌失措的丑态，看着那些被暴食者吐出来的、他伪造证据的残片，终于意识到自己从头到尾都被当成了一把枪。亚梓莎也终于松了口气，收了法杖，心里缠了一路的猜疑终于落了地，原来从她南下开始，就掉进了克莱曼布下的局里。利姆鲁抬手，暴食者的领域骤然收缩，漆黑的流体瞬间裹住了克莱曼的全身。他的身体、魔力、甚至连带着他筹谋了数年的阴谋与恨意，全都被暴食者彻底分解吞噬，连一丝灵魂的痕迹都没留在这个世界上。"
  NOR_pol.25.a: "“抱歉，把你们两个都卷进这种烂事里了。”"

  NOR_pol.26.t: "致命偷袭"
  NOR_pol.26.d: "噗嗤 ——淬满了咒杀毒素的黑针尽数扎进了利姆鲁的胸口，漆黑的亡者魔法瞬间炸开，顺着破魔剑留下的伤口，疯狂腐蚀着他仅剩的核心。利姆鲁闷哼一声，原本凝聚的人形骤然溃散，化作一滩泛着微光的史莱姆粘液，可那粘液里的生命气息，正在以肉眼可见的速度飞速消散。\n【警告！精神核心受损率98%！生命体征临界值！无法修复！无法修复！】\n夏尔的声音带着从未有过的慌乱，最终彻底消散在了空气里。\n温泉的水面还在晃荡，那滩曾撑起整个特恩佩斯特联邦的史莱姆粘液，彻底失去了光泽，连最后一丝魔力波动，都湮灭在了林间的夜风里。\n亚梓莎的动作瞬间僵住，指尖凝聚的冰棱碎成了漫天冰屑。她脑子里一片空白，从高原南下时被种下的猜疑、一路而来的摇摆、被当成棋子的错愕，最终都化作了眼前这片死寂的温泉。她没想过要利姆鲁的命，甚至到最后一刻，都还在犹豫要不要出手相护，可她终究还是慢了一步，成了这场谋杀里，最完美的障眼法。坂口日向手里的破魔剑当啷一声砸在地上。她脸色惨白如纸，踉跄着后退了半步，看着温泉里彻底失去生机的粘液，整个人都在发抖。她想要的从来不是杀死利姆鲁，是逼他停下“出卖魔物”的脚步，是纠正她眼里的“错误”，可直到此刻她才看清，自己从头到尾，都只是别人手里一把沾了血的刀。\n“哈哈哈哈！成了！利姆鲁！你这个屠夫！终于死了！”，克莱曼癫狂的大笑刺破了死寂，他张开双臂，指尖的操偶丝线疯狂舞动，“法尔姆斯的数十万亡魂！你们看到了吗！我给你们报仇了！”\n可他的笑声还没落下，一道轻飘飘的、毫无预兆的风刃，就精准地切下了他的头颅。滚落在地的脑袋上，癫狂的笑意还僵在脸上，身体直挺挺地倒了下去，连一丝反抗的机会都没有。"
  NOR_pol.26.a: "悲剧降临"

  NOR_pol.27.t: "神乐坂优树"
  NOR_pol.27.d: "林间的风忽然静了。一个穿着干净白衬衫、眉眼带着漫不经心笑意的年轻男人，从树影里缓步走了出来。他甚至没看地上克莱曼的尸体一眼，只低头瞥了瞥温泉里失去生机的史莱姆，语气里满是毫不掩饰的唾弃与轻蔑：“真是无趣。一个虚伪的暴君，口口声声说要建立人魔共存的国度，到头来不过是个抱着虚无的灭国预言，畏首畏尾的懦夫。”\n神乐坂优树。亚梓莎的指尖瞬间绷紧，满级魔女的魔力不受控制地翻涌起来。就在这一瞬间，所有的线索都串在了一起，高原上凭空出现的抹黑传单、法鲁梅纳斯山坳里刻意留下的战场痕迹、挑动日向出手的伪造证据、克莱曼恰到好处的复仇突袭，全都是这个男人布下的局。他才是藏在幕后，把所有人都当成棋子玩弄于股掌的黑手。\n一股难以言喻的怅然若失，瞬间裹住了她。他只是抬了抬手，示意身后蠢蠢欲动的麾下退开，对着亚梓莎微微侧身，让出了林间的去路。\n“这位魔女小姐，你可以走了。”，他的语气平淡，像在说一件无关紧要的小事。\n亚梓莎皱紧了眉，冷声问：“你布了这么大一个局，就这么放我走？”\n“我的麾下，不需要无法控制的人。”，优树轻笑一声，目光扫过她手里的法杖，带着几分漫不经心的了然，“但我也没必要，去招惹一个活了三百年的满级魔女。你只是个被卷进来的局外人，现在戏的上半场演完了，你想去哪，都随你。”\n他根本没把她放在眼里，也没把她当成需要清除的威胁，甚至不屑于和她为敌。这种彻底的漠视，比任何挑衅都更让人心头发沉。亚梓莎看着他，张了张嘴，最终什么都没说。她收起了法杖，转身走出了这片弥漫着死亡气息的林间，没有回头，也没有去看愣在原地、彻底崩溃的坂口日向。\n夜风卷着森林的湿气扑在脸上，她走了很远，还能感受到身后接连炸开的、属于魔王们的恐怖威压。"
  NOR_pol.27.a: "虚伪者"

  NOR_pol.28.t: "魔王齐聚"
  NOR_pol.28.d: "亚梓莎走后不过一刻钟，朱拉大森林的上空就被数道毁天灭地的气息填满。最先冲过来的是米莉姆，红龙的威压掀翻了整片树林，她落在温泉边，看着那滩彻底失去生机的粘液，脸上永远挂着的没心没肺的笑意彻底消失，金色的瞳孔里翻涌着足以毁灭一切的怒意，龙啸震得整个森林都在发抖。\n紧接着，奇伊・格里姆松的身影出现在了树梢上，他抱着胳膊，低头看着温泉里的景象，脸上依旧挂着漫不经心的笑，可眼底深处却藏着冰冷的算计。哭哭啼啼的拉米莉丝被精灵护卫护着落在后面，看着眼前的场景，吓得话都说不完整，只会反复念叨着“利姆鲁死了”。随后，魔王议会的其他魔王，也接连赶到了现场。\n优树站在这群毁天灭地的魔王中间，脸上依旧带着从容的笑意。他轻描淡写地把所有罪责，都推到了死去的利姆鲁身上，是利姆鲁出卖魔物、勾结人类，引来了杀身之祸；是利姆鲁的激进操作，撕裂了魔国，给了刺客可乘之机；更是利姆鲁的北欧联合计划，触怒了中欧的魔导国，给整个北欧招来了灭顶之灾。\n他像个最公正的旁观者，一点点挑动着魔王们的情绪，又在恰到好处的时机，抛出了他的诱饵：利姆鲁死了，魔国群龙无首，安兹・乌尔・恭的魔导国迟早会挥师北上，踏平整个北欧；与其坐以待毙，不如魔王们结成联盟，瓜分特恩佩斯特联邦的领地与工业成果，整合北欧所有的魔物力量，联合圣杯王国、瑞典，一起对抗魔导国，甚至可以一起瓜分整个欧洲。\n奇伊想要维持世界的平衡，却也绝不愿看到魔导国一家独大，打破他定下的规则；米莉姆满脑子都是给利姆鲁报仇，被优树三言两语引导着，把滔天的恨意对准了远在中欧的安兹；拉米莉丝没了主心骨，只会跟着其他魔王的脚步走；剩下的魔王们，早就觊觎魔国的工业化成果、广袤的领地与丰富的矿产，纷纷点头应和。\n没有质问，没有彻查，没有谁真的在意利姆鲁到底死在谁的手里。\n一个肮脏的、各怀鬼胎的联盟，就在利姆鲁冰冷的尸身旁，在神乐坂优树精心编织的阴谋里，悄然诞生了。朱拉大森林的温泉水，依旧冒着暖融融的热气，可这片曾被利姆鲁视作家园的土地，已经成了席卷整个欧洲的灭世战争，真正的起点。"
  NOR_pol.28.a: "乌合之众"

  NOR_pol.29.t: "魔王齐聚"
  NOR_pol.29.d: "林间的血腥味与神圣魔法的残留气息还未散尽，克莱曼最后一丝灵魂痕迹被暴食者彻底吞噬的瞬间，数道毁天灭地的威压就已经冲破了森林的结界，朝着温泉的方向席卷而来。\n最先冲过来的是米莉姆。红色的龙影撞碎了林间的晨雾，她落在温泉边，手里的拳套已经泛起了毁灭的金光，可当她看清站在温泉里、胸口还带着伤却稳稳站着的利姆鲁时，那股滔天的怒意瞬间泄了大半，转而变成了又气又急的嚷嚷：“利姆鲁！你吓死我了！我还以为你真的出事了！”\n紧随其后的是奇伊・格里姆索恩。他抱着胳膊落在最高的树梢上，金色的瞳孔扫过满地的魔法残痕、被震碎的树木，还有站在利姆鲁身侧的两个人，一个是手持破魔剑、脸色苍白的坂口日向，另一个是周身魔力深不见底、眉眼清冷的陌生魔女。他挑了挑眉，没说话，只是眼底的算计悄然收了几分。\n拉米莉丝被精灵护卫护着跌跌撞撞跑过来，本来还哭哭啼啼的，一看利姆鲁好好站着，瞬间把眼泪憋了回去，叉着腰开始数落跟过来的魔王们：“我就说利姆鲁肯定没事！你们一个个还嚷嚷着要分地盘！”\n魔王议会的其他魔王也陆续到了场，原本一个个带着试探、觊觎、甚至准备趁乱夺权的心思，可当他们看清现场的景象。利姆鲁哪怕受了伤，依旧能随手抹杀克莱曼；身侧站着能正面重创他的坂口日向，还有一个气息完全不弱于八星魔王的陌生魔女；连最护主的迪亚波罗已经带着原初恶魔们冲破了结界，正朝着这边赶来，所有的小心思瞬间都咽了回去。\n没人敢做手脚，更没人敢在这个时候跳出来挑事。"
  NOR_pol.29.a: "哈哈，误会误会"

  NOR_pol.30.t: "真相大白"
  NOR_pol.30.d: "利姆鲁抬手，夏尔将克莱曼伪造的所有证据、挑唆各方的通信记录、甚至是他与法尔姆斯残党勾结的密信，全都化作光影投射在林间，清清楚楚地展现在所有魔王面前。从伪造 “利姆鲁出卖魔物” 的传单散遍北欧，到挑唆坂口日向出手刺杀，再到借法尔姆斯的复仇之名设下死局，所有阴谋环环相扣，一目了然。\n“诸位也看到了。”，利姆鲁的声音不高，却带着八星魔王不容置喙的威压，传遍了整个林间，“之前所有关于我的流言，全是克莱曼的手笔。魔国的事，我自己会处理。至于谁想借着这个机会，动我的人，抢我的地盘，大可试试。”\n米莉姆第一个举着拳头附和：“谁敢动利姆鲁，我一拳把他打飞到天上去！”\n奇伊轻笑一声，从树梢上跳下来，拍了拍手：“有意思。既然是克莱曼搞的鬼，那这场闹剧就到此为止。别打破了世界的平衡，不然，我可不会坐视不管。”\n其他魔王见状，也纷纷附和，原本暗流汹涌的夺权危机，就这么被利姆鲁轻描淡写地压了下去。经此一事，之前因“和谈妥协” 动摇的威信彻底稳固，甚至比之前更甚。\n魔王们很快散去，迪亚波罗带着护卫接管了整片森林，坂口日向对着利姆鲁深深鞠了一躬，为自己被蒙蔽、险些铸成大错道歉。利姆鲁没有追责，只是让她回去彻查联邦内部被克莱曼渗透的环节，便让她离开了。\n林间很快恢复了安静，只剩下温泉的水声，还有利姆鲁和亚梓莎两个人。\n利姆鲁泡回温泉里，长长地松了口气，胸口的伤口还在隐隐作痛，之前绷着的气场尽数散去，露出了几分难以掩饰的疲惫。他抬眼看向站在池边的亚梓莎，笑了笑，递过去一杯温热的蜂蜜酒：“这次真的谢谢你。如果不是你拖住了日向，我未必能等到克莱曼自己跳出来。”"
  NOR_pol.30.a: "“你都算到了？”"

  NOR_pol.31.t: "魔王独白"
  NOR_pol.31.d: "“算是吧。”，利姆鲁挠了挠头，无奈地笑了笑，“夏尔从半年前就锁定了他的踪迹，只是他藏得太深，一直抓不到把柄。我只能演这么一场戏，逼他自己跳出来。只是没想到，把你也卷进来了。”\n他顿了顿，收起了脸上的笑意，语气沉了下来，一字一句地，和亚梓莎说了他从未对旁人说过的真心话。他说自己本质上和安兹一样，安兹最初也是个只想守护纳萨力克、守护部下的普通人，可亡灵化的侵蚀、守护者们的期待与裹挟，让他一步步走上了扩张称霸的路，再也回不去了。\n“他现在统一了整个中欧，不死者军团超过百万，魔导技术全欧顶尖。”，利姆鲁的目光望向南方，那里是中欧魔导国的方向，“他的下一个目标，要么是南边的幻想乡共和国，要么就是北边的北欧。魔国就在这里，躲不开，也逃不掉。”\n“我也回不去了。”，他自嘲地笑了笑，“刚开始，我只想给魔物们建一个能安心过日子的小聚落，不用被人类追杀，不用饿肚子。可现在，我要为了挡住魔导国，和抓我同胞、杀我子民的瑞典和谈，和曾经的仇敌联手；要为了攒够战争潜力，被人骂成出卖魔物的暴君、叛国者；有些账我必须算，有些人我必须处理，这场全欧的战争，迟早要来，根本避不开。”\n当利姆鲁郑重地提出，要封她为联邦的，“护国魔女”，给她封地、实权、最高级的权限时，亚梓莎笑着摇了摇头。\n“谢了，不过我对这些没兴趣。”，她把酒杯放在池边，伸了个懒腰，“我就是个从高原来的闲散魔女，管不了你这一摊子国家大事，也不想卷进接下来的战争里。你要是实在过意不去，就给我个虚衔，能让我以后来魔国，随便泡泡你这王宫的温泉，不用被卫兵拦着就行。”\n利姆鲁愣了一下，随即笑了出来。他早就该想到，能随手接住米莉姆全力一拍、面对魔王威压面不改色的满级魔女，根本不是会被权力和地位束缚的人。他最终依了亚梓莎的意思，只给了她一个，“特恩佩斯特联邦荣誉守护者”的虚衔，没有任何实权，却能在整个联邦境内自由通行，随时可以使用王宫的专属温泉，连魔王议会的会场都能随意进出。"
  NOR_pol.31.a: "未来的事，就等未来来了再说吧"

