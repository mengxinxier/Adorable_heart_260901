#国策
  NOR_start_rearmament1: "加速军备建设"
  NOR_start_rearmament1_desc: "也许我们的军备建设已经进入了新的阶段，但面对将来可能的威胁，我们必须加快步伐。我们需要更多的军工厂来生产我们需要的武器和装备。"
  NOR_kickstart_military_industry1: "重视魔法工业"
  NOR_kickstart_military_industry1_desc: "[ROOT.GetName]曾长期附属于其他国家，因此从未发展出自有军事工业。为了保护我们的自由，我们必须停止依赖其他国家供应国防用品，同时开始建造自己的战争机器。"
  NOR_build_supplies_network1: "建设补给网络"
  NOR_build_supplies_network1_desc: "我国壮观的山脉、湖泊与峡湾倍受世人称羡，但补给运输也因此更为艰难。我们需要自觉努力让补给更快到达前线。"
  NOR_drobak_coastal_fort1: "军事工程学"
  NOR_drobak_coastal_fort1_desc: "复杂的地理环境虽然阻碍了经济发展，但是也为我们提供了天然的防御优势。我们可以利用这些地形来建造坚固的要塞，抵御入侵者的攻击。"
  NOR_modernize_fortifications1: "要塞现代化"
  NOR_modernize_fortifications1_desc: "我们的地堡可能已经过时，但我们敌人的武器可没。现在花费精力和资源将我们的堡垒改进到当代标准，未来肯定会获得回报。"
  NOR_artillery_development1: "地下设施"
  NOR_artillery_development1_desc: "我们或许可以向火车国学习，复杂多变的山地环境可以开拓出地下空间来建造工厂和军事设施，这样我们就能保护它们免受敌人的轰炸。"
  NOR_anti_air_support1: "火炮开发"
  NOR_anti_air_support1_desc: "世界大战证明了火炮的重要性。为了避免在面对敌人的弹雨时无能为力，我们不能再继续落后下去了。"
  NOR_rikstanken1: "魔国坦克"
  NOR_rikstanken1_desc: ""
  NOR_tank_procurement1: "附魔装甲"
  NOR_tank_procurement1_desc: ""
  NOR_norges_rikstanksfabrikk1: "低温魔法矿石"
  NOR_norges_rikstanksfabrikk1_desc: ""
  NOR_improve_production_lines1: "改进生产线"
  NOR_improve_production_lines1_desc: "如果我们无法提供持续战斗所需的武器与装备，光凭蛮勇对于保家卫国也是一无是处。现代战争的关键就是要有能用于反击的弹药，我们要确保弹药的生产跟得上消耗。"
  NOR_the_royal_guards_battalion1: "国王卫队"
  NOR_the_royal_guards_battalion1_desc: "国王卫队作为我国最精英的战斗力量已经有一段时间了。我们可以继续对现有的军队优中选优，扩编国王卫队并改进训练技术，这样他们就能成为我国武装部队的先锋。"
  NOR_expand_Haeren1: "扩大陆军"
  NOR_expand_Haeren1_desc: "我们的领袖们个体战斗力不弱于仍何人，但现代战争并不依赖个体的武力。随着全球战争的威胁增长，我们必须确保民众已经准备好保卫我们年轻的国家。"
  NOR_improved_weapons1: "改进武器"
  NOR_improved_weapons1_desc: "我们的陆上力量使用的装备处于惨不忍睹的状况。这种规模的疏忽是无法接受的，甚至可能会让我们失去独立。我们必须在仍有余力之时尽快扭转这一趋势。"
  NOR_mercenary_culture: "佣兵传统"
  NOR_mercenary_culture_desc: ""
  NOR_building_an_independent_norway1: "建设独立的联邦"
  NOR_building_an_independent_norway1_desc: "1905年开始，[ROOT.GetAdjective]才如现在一般，以独立国家的形式存在，因此我们有许多国家建设工作要做，尤其是在对保障我国独立至关重要的工业方面。"
  NOR_norwegian_school_of_economics1: "联邦经济院校"
  NOR_norwegian_school_of_economics1_desc: "如果我们希望在世界经济中建立自己的地位，就需要专业人士，而这需要时间来建设。建立一个联邦的商学院作为全国示范性经济院校，这是让我们的民生经济以及随后的军事经济繁荣的第一步。"
  NOR_hurtigruten1: "“海达路德”"
  NOR_hurtigruten1_desc: "无可置疑的是，[ROOT.GetNonIdeologyName]不仅异常狭长，还遍布着崎岖的地形。这种环境确实塑造了我们的国家认同，但也使得妥善修建基础设施与铁路成为不可能。作为替代，我们必须建立“海达路德”系统，即将人货运送至[ROOT.GetAdjective]沿海各地的一系列渡轮。"
  NOR_norges_tekniske_hogskole1: "联邦技术院校"
  NOR_norges_tekniske_hogskole1_desc: "二十多年以来，位于布鲁蒙德的联邦理工学院一直处于我国工程领域的前沿，但如果我们希望与我们的邻国，甚至可能是我们的敌人竞争，就必须为技术教育提供更多资金。我们不能让我们的产业界缺乏必要的专业人士。"
  NOR_empower_large_industrial_groups1: "赋权魔王议会"
  NOR_empower_large_industrial_groups1_desc: "魔王们的身家不菲，他们的财富和影响力在[ROOT.GetName]的经济中占有重要地位。我们需要与他们合作，利用他们的资源来发展我们的工业基础，这样我们就能更好地为未来的战争做好准备。"
  NOR_fund_local_construction1: "扶持民生产业"
  NOR_fund_local_construction1_desc: "我们不能只让首都和寥寥数个主要城市工业化。我们应该让工业化进程尽可能均匀地覆盖整个[ROOT.GetName]。因此，我们要投资小镇和小型城市以刺激当地建设，从而丰富工业基础并加强经济稳健性。"
  NOR_aluminum_production1: "铝生产"
  NOR_aluminum_production1_desc: "铝的生产是一个能源密集型流程，虽然我们缺乏铝土矿储藏，但[ROOT.GetAdjective]的地形非常适合水电生产，这样我们可以很容易地进口铝土矿，并将其变成我们新生的军事工业的宝贵资源。"
  NOR_originium_production: "魔法矿石冶炼"
  NOR_originium_production_desc: ""
  NOR_complete_railway_network: "国家铁路计划"
  NOR_complete_railway_network_desc: "单靠我们自个儿是无法对抗中欧的魔鬼，我们必须联合东边的强国，恢复北方铁路的运转，这样我们就能更好地连接我们的北部地区，并且能够更快地将资源和军队运送到前线。"
  NOR_development_of_electrification: "国家电气化发展"
  NOR_development_of_electrification_desc: ""
  NOR_civilized_fiend: "开化魔物"
  NOR_civilized_fiend_desc: ""
  NOR_increase_research_funding1: "魔法科学院"
  NOR_increase_research_funding1_desc: ""
  NOR_expand_norges_tekniske_hogskole1: "扩建联邦技术院校"
  NOR_expand_norges_tekniske_hogskole1_desc: "鉴于大规模冲突几乎近在眼前，我们需要扩大我们的理工科院校的规模，以满足日益复杂的战争的要求。"
  NOR_revamp_hydroelectric_capacity1: "改进水电生产"
  NOR_revamp_hydroelectric_capacity1_desc: "铝对于制造飞机和其他战争工具至关重要，但将铝土矿加工成铝消耗的能源量过大，使其成为一个成本高昂的过程。幸运的是，[NOR.GetName]拥有完美的地形，我们的许多湖泊和河流可以建设水力发电大坝。这样我们就能在铝土矿藏不多的情况下生产所需的铝材。"
  NOR_haerens_flyvevaaben1: "陆军航空队"
  NOR_haerens_flyvevaaben1_desc: "天空将是战争的新前线。如果我们让敌人完全控制我们的空域，我们的地面部队将无法有效行动。我们必须发展一支能够支援我们地面部队行动的空军。"
  NOR_norwegian_planes1: "联邦航空工业"
  NOR_norwegian_planes1_desc: "我们已经见识过，今天的盟友可能成为明天的侵略者，为此我们不能仰仗境外势力来研发我们的飞机。毕竟，它们在现代战场上的重要性太大。"
  NOR_foreign_plane_designs1: "外国飞机设计"
  NOR_foreign_plane_designs1_desc: "作为一个年轻且长期被忽视的国家，[ROOT.GetName]缺乏设计和制造现代战争所需的空中力量的基础设施、专业知识和工具。我们必须转向国际武器市场以供应[NOR.GetName]空军的装备。"
  NOR_anti_air_artillery_research1: "魔法航弹"
  NOR_anti_air_artillery_research1_desc: "随着全新的技术被部署在空中，我们必须充分利用国内魔法矿石的力量，让我们的轰炸机具有更强的威胁。"
  NOR_anti_air_construction1: "防空建设"
  NOR_anti_air_construction1_desc: "我国崎岖的地形使得敌人若想入侵[NOR.GetName]将变得十分困难，但我们的天空却暴露在敌人的飞机面前，这使它们成为潜在的外国入侵的优势。我们必须建立必要的防空炮台来防止这种情况。"
  NOR_invest_in_airfields1: "投资航空研究所"
  NOR_invest_in_airfields1_desc: ""
  NOR_stavanger_airfield1: "斯塔万格机场"
  NOR_stavanger_airfield1_desc: "斯塔万格机场即将完工，其位置对于军用机场来说堪称完美。我们可以进行必要的调整，将这个民用机场作为一个军用的空军基地。"
  NOR_increase_air_production1: "提高空军生产"
  NOR_increase_air_production1_desc: "[NOR.GetName]需要飞机，而且现在就需要！如果我们将全部的精力倾注到飞机生产上，那么我们也许刚好能保护自己，并突破敌人的防御。"
  NOR_luftforsvaret1: "伟大的联邦空军"
  NOR_luftforsvaret1_desc: "我国空中力量已经发展到了这样的地步：不应仅作陆军的辅助部队而存在，而应成为独立的兵种。空军应拥有必要的资源，以有效的方式开展现代战争所需的一切行动。"
  NOR_radar_research1: "雷达研究"
  NOR_radar_research1_desc: "我国海岸线绵长，有效监控近海与滩头至关重要。得益于雷达这一技术奇迹，我们可以在长距离上提前探测到驶来的舰艇和飞机。"
  NOR_repurpose_lighthouses1: "改造灯塔"
  NOR_repurpose_lighthouses1_desc: "由于天气和地质因素，[ROOT.GetAdjective]海岸各地缺不了灯塔，这也是我国独具特色的靓丽风景。我们可以利用其作为雷达基站，帮助我们抵御入侵者，使灯塔就此承载了希望。"
  NOR_pilot_training1: "飞行员训练"
  NOR_pilot_training1_desc: "我国空军刚刚起步，规模很小，发展欠佳，但仍能从我们可以从我们飞行员与探险家的民族精神与文化传统中汲取灵感，激励新一代[NOR.GetAdjective]飞行员，捍卫我国的独立自主与长治久安。"
  NOR_the_royal_norwegian_navy1: "联邦联合海军"
  NOR_the_royal_norwegian_navy1_desc: "我国有世界上最长的海岸线之一，这固然有其优势，但亦意味着需要付出更多的努力来捍卫之。我国海军将是国防的第一道防线。"
  NOR_expand_the_dockyards1: "扩建船坞"
  NOR_expand_the_dockyards1_desc: "尽管我国拥有世界上最大的商船队之一，但本土船坞的制造能力仍能提升，仍能优化，以便不仅胜任造货船与造油轮那种简单工序，亦能更适合于制造军用舰艇。"
  NOR_battleship_focus1: "重视战列舰"
  NOR_battleship_focus1_desc: "只有大舰巨炮才能保证我们真正统治海洋。海岸上望见的我军战舰在天际线的投影，会让任何潜在的入侵者望而却步。"
  NOR_kystvakten1: "海岸监卫"
  NOR_kystvakten1_desc: "我国海岸线蜿蜒曲折，十分漫长。为了保护之，我们需要大量舰船，如此才能看管好地地平线上的每一寸徒弟。我们应建立一个舰艇网络，捍卫陆地免遭敌军舰只袭击。"
  NOR_convert_merchant_ships1: "征用商船"
  NOR_convert_merchant_ships1_desc: "商船是我国经济的骄傲，但如果侵略者摧毁我们的土地，一切就都无所谓了。我国的航运巨头必须为[ROOT.GetName]做出牺牲，把船交给我们，我们来武装这些船只。"
  NOR_expand_merchant_marine1: "扩编商船队"
  NOR_expand_merchant_marine1_desc: "现代战争需要资源和装备，而这些对于[ROOT.GetName]来说却属极缺。战争迫在眉睫，我们必须确保舰艇数量充足，保证我们生存所需要的物资运输不受干扰。当然，我们确有超越大多数国家的民船数目，但预计战时损耗亦为可观——民船数量遭削这一损失，我们实在承受不起。"
  NOR_expand_naval_academy1: "扩建海军学院"
  NOR_expand_naval_academy1_desc: "船多了，意味着领船参战的军官也要增加。多年以来，我国建成了许多海军学院，但海军扩张不可避免的意味着海军军官和水手也要扩编。"
  NOR_norwegian_carriers1: "联邦航空母舰"
  NOR_norwegian_carriers1_desc: "事实反复可证，未来的战争很大程度上取决于制空权，陆上如此，海上亦然。航空母舰的意义就在于控制敌舰上方的天空，以天降正义之姿态迅速将其击沉。"
  NOR_mine_laying_effort1: "重视布雷"
  NOR_mine_laying_effort1_desc: "我国舰船不可能同时出现在所有战略位置上，但水雷可以在人走灯灭之时持久捍卫沉默的水域，让误打误撞进雷区的敌舰始终提心吊胆。我们需要更好的水雷，来克服迭代的水雷规避和失效技术。"
  NOR_submarine_fleet1: "潜艇舰队"
  NOR_submarine_fleet1_desc: "潜艇，既高效又隐蔽，仅需一次攻击、一枚鱼雷就能扭转海战态势。我们需要制造更多、更好的潜艇，以此最大限度地增加取胜机会。"
  NOR_naval_air_force1: "海军航空兵"
  NOR_naval_air_force1_desc: "敌舰，有的因参与入侵[ROOT.GetName]而千疮百孔，有的在和平的公海上慵懒无聊，这种境遇差别的关键就在我军飞机。能主宰海域上空的，就能统治大海汪洋。"
  NOR_convoy_defense1: "运输船防卫"
  NOR_convoy_defense1_desc: "商船队乃我国之瑰宝，绝非食之无味、弃之不惜。我们需要加强商船队护航工作，使其长久，如此使之在战争中发挥更大作用。"
  NOR_convoy_bombing1: "运输船轰炸"
  NOR_convoy_bombing1_desc: "敌国商船队规模越小，我们的大舰队就能发挥更出色。破坏敌国航运，就有机会扭转战局。"
  NOR_emergency_conversions: "改装商船"
  NOR_emergency_conversions_desc: "我们有一支庞大的商船队，但由其独自穿越危险海域将使之面临巨大的风险。我们应该适当武装部分船只保护脆弱的航运。若有需要，我们也可以进一步改装以用于更专业的任务。"
  NOR_emergency_conversions_tt: "解锁§Y决议§!将§Y运输船§!改装为§Y驱逐舰§!"

  NOR_cross_the_forest: "穿越森林"
  NOR_cross_the_forest_desc: "走出森林的阴影，扩大我们的聚落，此时的挪威只是一个地理名词，大大小小的人类领主，充斥其间的魔物，或强大、或弱小。我们走出着野蛮的森林，誓要点燃文明的火种，混乱的冰原即将迎来秩序的春天。"
  NOR_Finnish_exiles: "索米逃人"
  NOR_Finnish_exiles_desc: "遥远北方的艾扎瓦据说居住着可怕的魔女，但居然有来自另一个“世界”的流亡者到来，她们所掌握的信息正是我们所需要的。"
  NOR_declaration_of_Yurasania: "尤拉萨尼亚宣言"
  NOR_declaration_of_Yurasania_desc: "尤拉萨尼亚是诸多种族混居之地，许多交易在此进行，每一个志于建立秩序的王者都必须在此地宣言，保护契约与商业，维护平等和秩序。"
  NOR_covenant_of_Dovagon: "多瓦贡之盟"
  NOR_covenant_of_Dovagon_desc: "坐落于西部的矮人族群多生矿脉，冶金、工匠技术发达，必须强调多瓦贡在邦国的地位，将她们绑上利姆鲁大人的战车。"
  NOR_campaign_against_the_Orc_Emperor: "征讨猪头帝"
  NOR_campaign_against_the_Orc_Emperor_desc: "可怕的灾厄来临了，近二十万的饥饿者组成的大军，他们将摧毁一切文明的火种，但如果利姆鲁大人能够成功击败这支部队，我们将在挪威拥有无比的正当性和威信！"
  NOR_north_sea_summit: "北海之会"
  NOR_north_sea_summit_desc: "强大的魔力诞生在南方某处，这是与利姆鲁大人同根同源的气息，他们将在北海小会……"
  NOR_council_establishment: "筹备魔国议会"
  NOR_council_establishment_desc: "必须尽快停止对抗和战争，行之有效的方法就是建立一个议会，哪怕只是松散的机构，但当作为至强者的利姆鲁大人入驻其中，议会将会成为统治诸势力的有力工具，而魔国就可以宣告成立了！"
  NOR_journey_to_Ingracia: "英格拉西亚之行"
  NOR_journey_to_Ingracia_desc: "攘外必先安内，瑞典对东部频繁的动作让我们的军队疲惫不已，必须改变世人对魔物的看法，利姆鲁大人计划访问英格拉西亚，并接回井泽静江女士的学生们。"
  NOR_doctrine_of_nation_doom: "魔国灭亡论"
  NOR_doctrine_of_nation_doom_desc: "这次会面是史诗级的……利姆鲁大人得以窥见整个世界的面貌，时日无多，末日将近，魔国不能再这样慢慢前进了，利姆鲁大人如此说道。"
  NOR_Jura_academy: "朱拉学府"
  NOR_Jura_academy_desc: "魔国将建立一个综合性的学府来容纳各地来的人才，并对邦国内有资质的生物进行教导。"
  NOR_Dovagon_industrial_zone: "多瓦贡工业区"
  NOR_Dovagon_industrial_zone_desc: "工业发展需要因地制宜，多瓦贡虽然面朝大海，但远离陆上邻国，交通便利，有利于我们和海外的国家沟通"
  NOR_repel_Clayman: "击退克莱曼"
  NOR_repel_Clayman_desc: "魔国内有足够的聪明者，他们也看到了议会的威力，那么为什么不把利姆鲁大人踹开呢，因为利姆鲁大人总能击败挑战者！"
  NOR_suppress_Falmus: "镇压法尔姆斯"
  NOR_suppress_Falmus_desc: "来自魔国的质疑声越来越多，背后肯定存在教唆者，可这次利姆鲁大人决定不再宽容，就如同魔国灭亡论所言，我们必须对法尔姆斯的暴民重拳出击！"
  NOR_embrace_Polytheism: "拥抱多神教"
  NOR_embrace_Polytheism_desc: "仅仅依靠强权和利益是无法把松散的议会捆绑成一个国家的，利姆鲁大人决定建立一个共同理念，而来自瑞典的多神教便是一个很好的媒介。"
  NOR_reign_of_Rimuru: "利姆鲁之治"
  NOR_reign_of_Rimuru_desc: "时间匆匆，魔国这片荒原总算点燃了文明的火种，一个蓬勃向上的国家正在成长，利姆鲁大人愈发的急躁、追求速度，魔国一片暗流涌动，但国民的生活依旧蒸蒸日上。"

