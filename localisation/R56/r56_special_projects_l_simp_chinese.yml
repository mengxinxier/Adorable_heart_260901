l_simp_chinese:
 sp_tag_rdf:0 "无线电测向"
 sp_tag_r56_infantry:0 "步兵"
 sp_air_rdf:0 "高频无线电探测"
 sp_air_rdf_desc:0 "高频无线电测向系统使用无线电波在几秒钟内通过通过三角测量法确定无线电源的位置。研制该技术的微型化装置，将有助于在战场环境下精确定位大型敌方装备，如船只和大型飞机。这允许我们以更好地获取和应对测向任务，从而无需依赖大型固定式测向阵列进行信息中继。"
 ENG_sp_air_rdf:0 "沃森-瓦特测向"
 USA_sp_air_rdf:0 "高频贝利尼托西定向仪"
 sp_r56_naval_huff_duff_device:0 "海军高频定位探测器"
 sp_r56_naval_huff_duff_device_desc:0 "通过研制专门用于定位海上敌方无线电传输的高频测向仪，结合传统声纳系统，可以更有效地探测敌方潜艇的位置，无论其采取多么隐蔽的规避措施。"
 ENG_sp_r56_naval_huff_duff_device:0 "FH4高频测向仪"
 USA_sp_r56_naval_huff_duff_device:0 "FH4高频测向仪"
 r56_sp_naval_huff_duff_device_tech:0 "海军高频定位探测器"
 r56_sp_naval_huff_duff_device_tech_desc:0 "高频测向仪，专门用于在海上定位敌方的无线电信号。"
 sp_improved_iff:0 "改进敌我识别系统"
 sp_improved_iff_desc:0 "我们可以通过使用主动应答器并融合最新的无线电与雷达技术对敌我识别系统进行升级。相比之下，现有的解决方案显得颇为简陋，无法与这一新型敌我识别系统相提并论。"
 ENG_sp_improved_iff:0 "IFF Mark II"
 GER_sp_improved_iff:0 "FuG 25a 埃斯特林"
 USA_sp_improved_iff:0 "跨波段应答器"
 r56_improved_iff_tech:0 "第二代敌我识别系统"
 r56_improved_iff_tech_desc:0 "一种经过改进的敌我识别系统。"
 sp_air_fido:0 "强效雾散装置"
 ENG_sp_air_fido:0 "强效雾散装置"
 sp_air_fido_desc:0 "雾是飞机起飞和降落时的一个主要问题，特别是在飞机从长时间夜间飞行返回时。开发一种能够清除雾气并照亮跑道的系统将能够预防事故，并减少雾对飞行任务的影响。"
 r56_fido_tech:0 "强效雾散装置"
 r56_fido_tech_desc:0 "一种能够清除雾气并照亮跑道的系统，可以预防事故，并减少雾对飞行任务的影响。"
 sp_air_r56_afterburning_engine: "加力涡轮喷气引擎"
 sp_air_r56_afterburning_engine_desc: "我们的新式喷气引擎可加装加力燃烧室，从而获得短时间的动力爆发能力。"
 sp_r56_tank_optical_rangefinder:0 "光学测距仪"
 USA_sp_r56_tank_optical_rangefinder:0 "M1立体测距仪"
 sp_r56_tank_optical_rangefinder_desc:0 "一种为坦克设计的先进重合式测距仪。它能够提高远距离瞄准和目标捕获的精度。相比现有的光学解决方案，这是一个巨大的改进。"
 r56_improved_optics_tech_1:0 "坦克光学测距仪"
 r56_improved_optics_tech_1_desc:0 "一种为坦克设计的先进重合式测距仪。它能够提高远距离瞄准和目标捕获的精度。相比现有的光学解决方案，这是一个巨大的改进。"
 sp_r56_advance_tank_optical_rangefinder:0 "进阶光学测距仪"
 USA_sp_r56_advance_tank_optical_rangefinder:0 "M2立体测距仪"
 sp_r56_advance_tank_optical_rangefinder_desc:0 "光学测距仪的一次代际改进。大大提高了远距离瞄准和目标捕获的精度。"
 r56_improved_optics_tech_2:0 "进阶光学测距仪"
 r56_improved_optics_tech_2_desc:0 "光学测距仪的一次代际改进。大大提高了远距离瞄准和目标捕获的精度。"
 sp_air_r56_helicopter:0 "直升机观瞄系统"
 sp_air_r56_helicopter_desc:0 "直升机能够定点悬停的能力有助于执行观察任务。"
 r56_sp_helicopter_tech:0 "直升机观瞄系统"
 r56_sp_helicopter_tech_desc:0 "直升机能够在定点悬停的能力，有助于执行观察任务。"
 sp_r56_gammon_bomb:0 "多功能手榴弹"
 sp_r56_gammon_bomb_desc:0 "我们的特种部队需要易于使用的、轻便且适应多种战斗情况的手榴弹，尤其是在对付装甲车辆时。"
 ENG_sp_r56_gammon_bomb:0 "“加蒙”反坦克手榴弹"
 USA_sp_r56_gammon_bomb:0 "82型手榴弹"
 r56_gammon_bomb_tech:0 "多功能手榴弹"
 r56_gammon_bomb_tech_desc:0 "易于使用、轻便且适应多种战斗情况的手榴弹。"
 sp_r56_anti_tank_rifle_grenade:0 "反坦克枪榴弹"
 sp_r56_anti_tank_rifle_grenade_desc:0 "研发适用于现有步枪榴弹系统的小型化聚能装药，将显著提升班组打击装甲目标的能力。"
 r56_anti_tank_rifle_grenade_tech:0 "反坦克枪榴弹"
 r56_anti_tank_rifle_grenade_tech_desc:0 "研发适用于现有步枪榴弹系统的小型化聚能装药，将显著提升班组打击装甲目标的能力。"
 sp_r56_heavy_tank_studies:0 "重型坦克研究"
 GER_sp_r56_heavy_tank_studies:0 "德国陆军武器局的突破坦克计划"
 SOV_sp_r56_heavy_tank_studies:0 "突破型坦克需求"
 ENG_sp_r56_heavy_tank_studies:0 "总参谋部的装甲升级请求"
 USA_sp_r56_heavy_tank_studies:0 "步兵指挥官的建议"
 sp_r56_heavy_tank_studies_desc:0 "重型坦克作为复杂的武器系统，其研发需求远远超出了行业标准流程所能提供的范畴。针对这类大型机械装备进行深入的大型研究，我们或许能够研发出更加适应战场需求的重型坦克。"
 sp_r56_heavy_tank_studies_preference:0 "研究范围"
 sp_r56_heavy_tank_studies_preference_desc:0 "我们的一部分军官已经掌握了新型重型坦克的设计与原型制造情况。其中有些军官的想象力极为丰富，构想出了比当前原型和设计方案更大、装甲更坚固的坦克设计。我们是应该纵容这些幻想，还是让项目更切合实际呢？"
 sp_r56_heavy_tank_studies_focus_preference_go_crazy:0 "更大的坦克！还有更厚的装甲！"
 sp_r56_heavy_tank_studies_focus_preference_be_sane:0 "让研究切合实际更好。"
 r56_heavy_tank_studies_tech:0 "重型坦克改进"
 r56_heavy_tank_studies_tech_desc:0 "更加适用于战斗的重型坦克设计。"