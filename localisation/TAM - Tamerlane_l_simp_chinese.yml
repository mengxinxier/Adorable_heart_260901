###开局介绍
 TAM_his_page_01_title: "马娘与苏维埃"
 TAM_Country_History_Page_01: "特雷森社会主义政府成立于《克孜勒苏协定》后，内战后的特雷森开始了重建工作，政府宣传、现代化计划等各类发展项目先后提上日程。在苏联成立时，特雷森并未成为加盟国，但获得了第三国际观察国的身份，并以此和苏联签订了各种互助合约。\n\n 在中亚混战中，遭受致命夹击而落败的白军等反动势力，残余大部分逃到了南方的群山之中，剩余的一部分则是混入了混乱中的波斯。当特雷森逐渐从内战中恢复，将目光放到南方时，她们看到的也是一个逐渐恢复稳定的反动政府，以及一个新生的统一的波斯湾政权。时任特雷森第一书记，同时也是世界苏维埃论支持者的优秀素质拍板了渗透计划，期望能够在未来一劳永逸地解决特雷森的南方威胁，甚至进一步实现特雷森长久以来统一这一地区的梦想。"
 TAM_his_page_02_title: "粮食与工业化"
 TAM_Country_History_Page_02: "在《克孜勒苏协定》签订后，特雷森开始了重建工作。尽管不断有苏俄政府，以及后来的第三国际送来的援助，这片草原地区的工业建设仍然缓慢，特雷森政府的宣传进展也收效甚微，许多马娘对于部落逐渐分化消失感到不适应，同时对于城市定居和工作也有抵触甚至排斥情绪。在施行一五计划结束后，特雷森政府决定放弃激进的重工业计划，在工业化道路上不再跟随苏联，转而利用草原优势，由农业国家缓慢地向工业化国家发展。然而这项计划还没有开始就被粗暴地打断，1932年开始的旱灾让特雷森被迫停止了工业化，随着旱灾的持续，对于粮食的需求逐渐压倒了一切。"
 TAM_his_page_03_title: "党内分歧"
 TAM_Country_History_Page_03: "特雷森内部对于未来的道路从其共和国成立的那天开始就从未停止过。在伟大战争、红白歌会和特雷森独立战争中屡获战功的“皇帝”鲁道夫象征和其副手东海帝王认为特雷森的未来是社会主义，但不是苏联。而在内战期间接受过红军援助的“灰姑娘”小栗帽和从苏联留学归来的优秀素质则主张向莫斯科靠拢。"
 TAM_Local_History_Title: "§G中亚§!草原"
 TAM_loca_his_t_01: "草原基地"
 TAM_history_page_01: "当十九世纪沙俄南下，将影响力扩张到中亚时，她们遇到的是彼时草原上松散的几个马娘国家和部落联盟，优质的草场和马娘们极具野战适应性的身体素质让沙皇政府垂涎三尺，因此在初次接触后不久就开始尝试控制和整合中亚的各个势力。在经过长达半个世纪的征伐后，在进入二十世纪前的最后十年内，沙俄完成了对中亚的征服，此后又花费了数年时间整合、安抚、镇压，使得这里成为了一处近乎完美的骑兵训练基地。"
 TAM_loca_his_t_02: "伟大下的阴影"
 TAM_history_page_02: "在伟大战争中，特雷森总督区的骑兵部队主要奋战在高加索地区，指挥官鲁道夫象征凭借野战优势将奥斯曼北线集团军牢牢牵制在亚美尼亚和大不里士山区。但也正因如此，在东线崩溃，全俄陷入红白歌会之际，这支特雷森主力部队被迫滞留在了高加索山区中。当她们借道波斯，最终返回阔别已久的故乡时，这里又成为了白军、苏维埃红军和协约国干涉军多方介入的战场。面对白军和干涉军抛出的橄榄枝，这位特雷森的“皇帝”没有任何犹豫，用白军使者的鲜血，证明了她的立场。\n来去如风的精锐高加索马娘远征军，从南方直击白军和干涉军的补给与增援，在中亚混战中，给了反革命者最致命的一刀。"
 TAM_loca_his_t_03: "革命战争"
 TAM_history_page_03: "尽管被置于沙俄的势力范围已经过去了近半个世纪，特雷森的马娘们心中的自由之火依然不曾熄灭，这群在草原上肆意飞驰的精灵们不甘心被任何外来势力施以保护统治。中亚混战让她们看到了从沙俄、协约国，甚至是苏维埃中独立的希望，而鲁道夫和她的高加索远征军的回归点燃了本土马娘们长久以来被压制的独立情绪。\n\n1920年初，特雷森自治共和国在塔什干成立，标志着“革命战争”的开始。深入西伯利亚的白军和干涉军，陷入特雷森民兵、特雷森高加索骑兵军团和薇洛带领的苏联游击队的三重夹击，并在了经过数年的浴血奋战，特雷森军队先后成功将协约国军队和白军向南驱赶出了中亚地区，同时基于红白歌会的天平逐渐趋向苏维埃的趋势，特雷森政府开始了与苏维埃政府的谈判。最终签订了《克孜勒苏协定》，确保特雷森主权的同时奠定了其如今的第三国际观察国地位。中亚地区自此进入了十多年的和平发展期。"

