 CAC_SOV_intervention_is_over: "苏联做出了决定"

 TAM.13.title: "中亚问题"
 TAM.13.desc: "长久以来，我们的海军和海外贸易，都依赖于列宁格勒、塞瓦斯托波尔和符拉迪沃斯托克的港口。\n\n随着圣杯的影响力缩小，我们将目光转向了中亚。\n\n不论是丰富的资源，还是直通印度洋的出海口，都能成为第三国际发展的助力。\n\n而如今，统一中亚的特雷森似乎并不愿意跟我们合作……"
 TAM.13.a: "这是一个威胁，我们需要亲自出手。"
 TAM.13.b: "我们可以对特雷森提出一些要求。"
 TAM.13.c: "算了，特雷森的态度无关紧要。"

 TAM.2.title: "苏联要求我们臣服！"
 TAM.2.desc: "来自苏联大使馆的消息，鉴于目前紧张的国际局势，苏联已对我们发出最后通牒，要求我们“立刻加入第三国际”，并停止一切针对苏联的敌对行为。\n\n他们声明，如果我们拒绝，后果会“§R非常严重§!”。"
 TAM.2.a: "我们别无选择，只能接受。"
 TAM.2.b: "他们大可以试试看。"

 TAM.5.title: "中亚危机！"
 TAM.5.desc: "一直以来，苏联人，圣杯人都想要占据中亚这一战略节点。\n\n而现在，矛盾已经激化到了不可调和的程度！"
 TAM.5.a: "准备战争！"
 
 TAM.6.title: "特雷森崩溃！"
 TAM.6.desc: "或许是我们对战争的准备不足，或许是我们看轻了敌人，亦或是我们战略失误……\n\n这都不重要了……看不到希望的民众已经包围了政治局，要求停止战争。而我们……"
 TAM.6.a: "我们输得彻底……§R（对你来说，会结束游戏！）§!"
 TAM.6.b: "或许还有回转余地？"

 TAM.7.title: "特雷森投降"
 TAM.7.desc: "就在几小时前，特雷森政治局被要求结束战争的民众冲击到瘫痪，一份潦草的和平提案被送到了我们的大使馆。里面的措辞漏洞百出，但想要停战的意愿表达得都快溢出来了。"
 TAM.7.a: "二十年后，我们重回这片土地……重新统治这些马娘们……"
 TAM.7.b: "可战争还没结束……"
 TAM.7.c: "战争终于结束了……"

 TAM.110.title: "中亚危机告一段落"
 TAM.110.desc: "苏联决定结束对中亚的施压。"
 TAM.110.a: "松一口气"

