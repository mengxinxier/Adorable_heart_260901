###国策 focus
 TAM_focus_start_1: "党内辩经"
 TAM_focus_start_1_desc: "特雷森内部对共产主义的未来有截然相悖的看法……我们需要尽快统一思想，必要时，可以采取一些§Y“非常规”§!手段……\n\n（当党内辩经结束时，对应§Y派系掌权§!的修正会变为一个民族精神。所以不要害怕失去BUFF。）"
 TAM_focus_start_2: "对苏开放市场"
 TAM_focus_start_2_desc: "苏联是一个友善的买家，也是我们国内目前对外市场上，最合适的买家。"
 TAM_focus_start_3: "邀请苏联专家"
 TAM_focus_start_3_desc: "我们的工农业是按照苏联模式规划的，自然应该邀请苏联专家进行指导。"
 TAM_focus_start_4: "重组特雷森政治局"
 TAM_focus_start_4_desc: "1920年组建的特雷森临时政治局，已经不适合现在特雷森的政局，我们需要重组特雷森政治局，以应对变化的国际、国内局势。"
 TAM_focus_start_5: "提拔实绩官僚"
 TAM_focus_start_5_desc: "地方的一些官员在实践中摸索出了一套行之有效的管理方法。我们应该大力提拔这些成果斐然的官员。"
 TAM_focus_start_6: "支持国营企业"
 TAM_focus_start_6_desc: "特雷森的国营企业起步才十余年，我们需要对其进行保护。"
 TAM_focus_start_7: "提高对苏贸易"
 TAM_focus_start_7_desc: "和苏联的贸易可以快速补齐我们需要的各种设备。"
 TAM_focus_start_8: "苏维埃指导团"
 TAM_focus_start_8_desc: "为了防止我们在思想上误入歧途，一支来自苏联的指导团队是有必要的。"
 TAM_focus_start_9: "地方派民主会"
 TAM_focus_start_9_desc: "如果盲目照搬苏联模式，1932年的粮食危机只会再次出现。我们将组建地方民主会，根据特雷森的实际情况进行发展。"
 TAM_focus_start_10: "国内市场内循环"
 TAM_focus_start_10_desc: "我们国内的市场远远没有达到饱和，将大量基础资源用于出口，并不是一个好主意。"
 TAM_focus_start_11: "统一思想"
 TAM_focus_start_11_desc: "唯有统一的思想，才能使出团结的力量。"
 TAM_focus_start_12: "结束争议"
 TAM_focus_start_12_desc: "自特雷森成立之日起，便存在的党争，终将结束在今天。"
 TAM_focus_After_civil_war_1: "重建国家"
 TAM_focus_After_civil_war_1_desc: "中亚内战结束了，我们将在这一片废墟中，重建一个统一的特雷森。"
 TAM_focus_After_civil_war_2: "思想教育"
 TAM_focus_After_civil_war_2_desc: "美浦和栗东不是所有人都是顽固的反动派。有相当多人只是因为生在此处。\n我们将对积极配合改造的人员进行思想教育，并吸纳他们进入政府。"
 TAM_focus_After_civil_war_3: "镰刀和铁锤"
 TAM_focus_After_civil_war_3_desc: "放下枪支大炮，拿起镰刀和铁锤，老百姓才会知道，我们和反动派到底有什么不一样。"
 TAM_focus_After_civil_war_4: "解决伤残军人问题"
 TAM_focus_After_civil_war_4_desc: "如果不解决伤残国家功臣们的就业、安置问题，那我们不配说自己是一支人民的军队。"
 TAM_focus_After_civil_war_5: "治理风沙"
 TAM_focus_After_civil_war_5_desc: "1932年大旱导致的草原沙漠化急剧扩张，我们需要为此进行治理。"
 TAM_focus_After_civil_war_6: "审判叛国者"
 TAM_focus_After_civil_war_6_desc: "战前和战争中出现的，意志不坚定的叛国者，将会被逐一审判。"
 TAM_focus_After_civil_war_7: "同一面红旗下"
 TAM_focus_After_civil_war_7_desc: "红旗之下，我们将携手，共进退，同命运。"
 TAM_focus_After_civil_war_8: "解禁治愈魔法"
 TAM_focus_After_civil_war_8_desc: "虽然魔法曾给我们带来了伤痛，但满目疮痍的中亚，需要魔法进行恢复。"
 TAM_focus_After_civil_war_9: "兴建水利"
 TAM_focus_After_civil_war_9_desc: "我们将建设水利工程，以发展沙漠和内陆地区。"
 TAM_focus_After_civil_war_10: "让特雷森再次伟大"
 TAM_focus_After_civil_war_10_desc: "我们可以自豪地向世界交出答卷——一个崭新的、先进的、人文的、平等的，新特雷森。"
