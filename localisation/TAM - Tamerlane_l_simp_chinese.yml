 TAM_focus_for_civil_war_9: "战斗在原野"
 TAM_focus_for_civil_war_9_desc: "广大的中亚草原，将成为我们的战场。"
 TAM_focus_for_civil_war_10: "一步一血"
 TAM_focus_for_civil_war_10_desc: "我们将坚守领土，让每一个胆敢涉足的敌人胆寒。"
 TAM_focus_for_civil_war_11: "静态防御"
 TAM_focus_for_civil_war_11_desc: "我们将在前线修筑补给中心和要塞，以支援前线的军队。"
 TAM_focus_for_civil_war_12: "走出学院……"
 TAM_focus_for_civil_war_12_desc: "进行了完整教育的学生，将是我们优秀的兵员。"
 TAM_focus_for_civil_war_13: "放下锄犁……"
 TAM_focus_for_civil_war_13_desc: "我们会组织民兵，以保护职业军队管理范围之外的空白区域。"
 TAM_focus_for_civil_war_14: "完成动员"
 TAM_focus_for_civil_war_14_desc: "我们已经做好了战争动员，以应对迫在眉睫的中亚内战。"
