 TAM.1.title: "何去何从？"
 TAM.1.desc: "第三国际崩溃，苏联解体的消息传来，我们的国家陷入了灾难性的恐慌！\n以往被压制的各种声音再一次如雨后春笋般冒出，而这一次，再也没有人去进行强力的压制——不是没有人想要进行最后的挣扎和尝试，而是连维持秩序的人本身，也陷入了恐慌……\n各个地区的反政府武装甚至公然走上街头，宣传我们敌人的“优越”和“友好”！\n我们必须尽快采取行动！！！"
