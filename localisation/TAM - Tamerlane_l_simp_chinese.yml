 CAC_Attention_of_SOV: "苏联的注意"
 CAC_Attention_of_SOV_desc: "苏联一直试图染指中亚。\n虽然目前其专注于欧洲，但可以预料到的是，一旦§R欧洲平定§!，或者我们做出太多的§R“反苏举措”§!，苏联一定会动用包括武力在内的手段，来确保其后方的安定。\n\n\n§R警告§!！这一段内容还没做好，§R不保证§!游玩体验！"
 CAC_SOV_intervention_icon_value: "[?TAM.CAC_SOV_intervention_icon_value|0H]§Y%§!"
 CAC_SOV_intervention_icon_description: "关注度等级：[?TAM.CAC_SOV_intervention_icon_value|0H]§Y%§!\n\n若数值达到§R100%§!，则§Y[SOV.GetNameDefCap]§!将对我们采取强制手段，甚至发动入侵。\n若降至§G0%§!，[SOV.GetNameDef]将同意不干涉我们，下列行动将不可用。"
 CAC_SOV_intervention_declare_war_mission: "苏联的耐心"
 CAC_SOV_intervention_declare_war_mission_desc: "苏联一直以来都试图染指中亚。虽然目前其专注于国内和欧洲事物，但谁也不知道，什么时候，我们就会被“端上餐桌”。"
