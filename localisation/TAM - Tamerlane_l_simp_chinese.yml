l_simp_chinese:
 UMA_Oguri_Cap: "小栗帽"
 UMA_Oguri_Cap_desc: "§Y小栗帽§!是新特雷森革命的精神象征。\n\n在“伟大战争”末期，受到压迫的中亚草原，诞生了百折不挠的革命自由思想。小栗帽，便是那追逐自由者之一。\n\n中亚混战期间，小栗帽领导的地方民兵，和高加索远征军、苏联红军一起，将白军、干涉军与反动派赶到南方的山麓之中。\n\n1936年的钟声已经敲响，十余年的准备即将展现，特雷森的旗帜已经高扬，革命尚未成功，同志仍需努力！"

 UMA_head_of_government: "第一书记"
 UMA_Nice_Nature_leader: "优秀素质"
 UMA_Nice_Nature_leader_tt: "§Y$UMA_Nice_Nature_leader$§!\n§Y第一书记§!\n  - $MODIFIER_POWER_BALANCE_WEEKLY$：§Y-1.00%§!\n  - $MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-10.00%§!"
 UMA_Nice_Nature_leader_dip_tt: "$UMA_Nice_Nature_leader$\n§Y[SOV.GetNameWithFlag]§!的政治局委员\n§Y[TAM.GetNameWithFlag]§!的第一书记\n§Y第一书记§!\n  - $MODIFIER_POWER_BALANCE_WEEKLY$：§Y-1.00%§!\n  - $MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-10.00%§!"
 UMA_Nice_Nature_leader_desc: "§Y优秀素质§!是最早一批在苏联留学的马娘，也是世界苏维埃最坚定的支持者之一。\n\n而她在学成后，毅然放弃留在苏联任职的光明未来，转而投身刚刚在中亚混战后成立，一穷二白的特雷森。她总是事必躬亲，确保特雷森的一切都在稳中向好地发展，这也让她和偏远笠松出身的民兵领袖§Y小栗帽§!结下了深厚的战友情谊。\n\n在马娘们数年的努力下，特雷森已经初步实现工业化，也成为了第三国际的观察国。而南方的各个派系，依然和旧帝国残余势力不清不楚。\n\n优秀素质下定决心，将清除南方的反动派，解放南方的广大无产阶级。"


 UMA_head_of_government_0: "革命委员会总书记"
 UMA_Nice_Nature_leader_0: "优秀素质"
 UMA_Nice_Nature_leader_0_tt: "§Y$UMA_Nice_Nature_leader_0$§!\n§Y革命委员会总书记§!\n  - $MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-10.00%§!\n  - $MODIFIER_WAR_SUPPORT_WEEKLY$：§G+1.00%§!\n  - $MODIFIER_STABILITY_WEEKLY$：§G+1.00%§!\n  - $MODIFIER_POLITICAL_POWER_GAIN$：§G+0.05§!\n"
 UMA_Nice_Nature_leader_dip_0_tt: "$UMA_Nice_Nature_leader_0$\n§Y[SOV.GetNameWithFlag]§!的政治局委员\n§Y[TAM.GetNameWithFlag]§!的革命委员会总书记\n§Y革命委员会总书记§!\n  - $MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-10.00%§!\n  - $MODIFIER_WAR_SUPPORT_WEEKLY$：§G+1.00%§!\n  - $MODIFIER_STABILITY_WEEKLY$：§G+1.00%§!\n  - $MODIFIER_POLITICAL_POWER_GAIN$：§G+0.05§!\n"
 UMA_Nice_Nature_leade_0_desc: "§Y优秀素质§!是最早一批在苏联留学的马娘，也是世界苏维埃最坚定的支持者之一。\n\n而她在学成后，毅然放弃留在苏联任职的光明未来，转而投身刚刚在中亚混战后成立，一穷二白的特雷森。她总是事必躬亲，确保特雷森的一切都在稳中向好地发展，这也让她和偏远笠松出身的民兵领袖§Y小栗帽§!结下了深厚的战友情谊。\n\n在马娘们数年的努力下，特雷森已经初步实现工业化，也成为了第三国际的观察国。而南方的各个派系，依然和旧帝国残余势力不清不楚。\n\n优秀素质下定决心，将清除南方的反动派，解放南方的广大无产阶级。"
 
 UMA_head_of_government_1: "神秘主义者"
 UMA_Neo_Universe_leader_0: "新宇宙"
 UMA_Neo_Universe_leader_0_tt: "§Y$UMA_Neo_Universe_leader_0$§!\n§Y神秘主义者§!\n  - $MODIFIER_INTELLIGENCE_AGENCY_DEFENSE$：§G+1§!\n  - $MODIFIER_ENCRYPTION_FACTOR$：§G+25.00%§!\n  - $MODIFIER_DECRYPTION_FACTOR$：§G+25.00%§!\n  - $MODIFIER_OPERATIVE_SLOT$：§G+1§!\n"
 UMA_Neo_Universe_leader_dip_0_tt: "§Y$UMA_Neo_Universe_leader_0$§!\n§Y[TAM.GetNameWithFlag]§!的§1观察者§!\n§Y神秘主义者§!\n  - $MODIFIER_INTELLIGENCE_AGENCY_DEFENSE$：§G+1§!\n  - $MODIFIER_ENCRYPTION_FACTOR$：§G+25.00%§!\n  - $MODIFIER_DECRYPTION_FACTOR$：§G+25.00%§!\n  - $MODIFIER_OPERATIVE_SLOT$：§G+1§!\n"
 UMA_Neo_Universe_leader_0_desc: "“§R26号宇宙§!实验宣告失败。是否立刻启动回归程序？”\n\n“YES OR NO”\n\n“NO，我想，先看看§R结局§!。”"

 UMA_head_of_government_2: "大家的榜样"
 UMA_Nishino_Flower_leader_0: "西野花"
 UMA_Nishino_Flower_leader_0_tt: "§Y$UMA_Nishino_Flower_leader_0$§!\n§Y大家的榜样§!\n  - $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$：§G+10.00%§!\n  - $MODIFIER_RESEARCH_SPEED_FACTOR$：§G+5.00%§!\n  - $MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$：§G+5.00%§!\n  - $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$：§G+5.00%§!\n"
 UMA_Nishino_Flower_leader_dip_0_tt: "§Y$UMA_Nishino_Flower_leader_0$§!\n§Y[TAM.GetNameWithFlag]§!的§B国民偶像§!\n§Y大家的榜样§!\n  - $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$：§G+10.00%§!\n  - $MODIFIER_RESEARCH_SPEED_FACTOR$：§G+5.00%§!\n  - $MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$：§G+5.00%§!\n  - $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$：§G+5.00%§!\n"
 UMA_Nishino_Flower_leader_0_desc: "在特雷森，你可以不认识九冠王杏目，可以不认识皇帝鲁道夫象征，可以不认识绿色恶……绿色传奇骏川小姐，但你一定认识她——人见人爱的国民偶像——§Y西野花§!！ "

 UMA_head_of_government_5: "绝不退让"
 UMA_Silence_Suzuka_leader_0: "无声铃鹿"
 UMA_Silence_Suzuka_leader_0_tt: "§Y$UMA_Silence_Suzuka_leader_0$§!\n§Y绝不退让§!\n  - $MODIFIERS_ARMY_CORE_ATTACK_FACTOR$：§G+15.00%§!\n  - $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$：§G+15.00%§!\n  - $MODIFIER_ARMY_SPEED_FACTOR_FOR_CONTROLLER$：§G+15.00%§!\n  - $MODIFIER_ARMY_ORG_REGAIN$：§G+15.00%§!\n"
 UMA_Silence_Suzuka_leader_dip_0_tt: "§Y$UMA_Silence_Suzuka_leader_0$§!\n§Y[TAM.GetNameWithFlag]§!的§R冠军马娘§!\n§Y绝不退让§!\n  - $MODIFIERS_ARMY_CORE_ATTACK_FACTOR$：§G+15.00%§!\n  - $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$：§G+15.00%§!\n  - $MODIFIER_ARMY_SPEED_FACTOR_FOR_CONTROLLER$：§G+15.00%§!\n  - $MODIFIER_ARMY_ORG_REGAIN$：§G+15.00%§!\n"
 UMA_Silence_Suzuka_leader_0_desc: "“我是§Y无声铃鹿§!，我喜欢奔跑。”\n\n“领先位置不会让给任何人。”\n\n“嗯……那个，就是这样。” "

 UMA_head_of_government_6: "严格治理"
 UMA_Air_Groove_leader_0: "气槽"
 UMA_Air_Groove_leader_0_tt: "§Y$UMA_Air_Groove_leader_0$§!\n§Y严格治理§!\n  - $MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-10.00%§!\n  - $MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$：§G-10.00%§!\n  - $MODIFIER_GLOBAL_MONTHLY_POPULATION$：§G+20.00%§!\n  - $MODIFIER_GLOBAL_BUILDING_SLOTS_FACTOR$：§G+1§!\n"
 UMA_Air_Groove_leader_dip_0_tt: "§Y$UMA_Air_Groove_leader_0$§!\n§Y[TAM.GetNameWithFlag]§!的“§L女帝§!”\n§Y严格治理§!\n  - $MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-10.00%§!\n  - $MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$：§G-10.00%§!\n  - $MODIFIER_GLOBAL_MONTHLY_POPULATION$：§G+20.00%§!\n  - $MODIFIER_GLOBAL_BUILDING_SLOTS_FACTOR$：§G+1§!\n"
 UMA_Air_Groove_leader_0_desc: "当大多数马娘们尽情奔跑时，总有部分马娘负重前行。\n\n§Y气槽§!便是其中之一。她以严谨和严格的要求，成为了特雷森首屈一指的工业顾问。"

 UMA_head_of_government_3: "特雷森的§Y“皇帝”§!"
 UMA_Symboli_Rudolf_leader_0: "鲁道夫象征"
 UMA_Symboli_Rudolf_leader_0_tt: "§Y$UMA_Symboli_Rudolf_leader_0$§!\n§Y特雷森的“皇帝”§!\n  - $MODIFIER_STABILITY_WAR_FACTOR$：§G+30.00%§!\n  - $MODIFIER_POLITICAL_POWER_FACTOR$：§G+15.00%§!\n  - $MODIFIER_COMMAND_POWER_GAIN$：§G+0.2§!\n  - $MODIFIER_MAX_COMMAND_POWER$：§G+20§!\n"
 UMA_Symboli_Rudolf_leader_dip_0_tt: "§Y$UMA_Symboli_Rudolf_leader_0$§!\n§Y[TAM.GetNameWithFlag]§!的“皇帝”\n§Y特雷森的“皇帝”§!\n  - $MODIFIER_STABILITY_WAR_FACTOR$：§G+30.00%§!\n  - $MODIFIER_POLITICAL_POWER_FACTOR$：§G+15.00%§!\n  - $MODIFIER_COMMAND_POWER_GAIN$：§G+0.2§!\n  - $MODIFIER_MAX_COMMAND_POWER$：§G+20§!\n"
 UMA_Symboli_Rudolf_leader_0_desc: "§Y鲁道夫象征§!曾在“伟大战争”中，服役于旧帝国的高加索骑兵军团，在亚美尼亚进行残酷的绞肉拉锯战。\n\n旧帝国崩溃后，她所带领的高加索远征军回到了特雷森，并当即宣布加入特雷森民兵。这支功勋卓著的骑兵军团，阻截了白军向波斯撤退的道路，并将大量白军部队消灭在草原。\n\n和大多数新生代的马娘不同，经历几乎整个“伟大战争”的她，坚定地认为，特雷森的救赎是社会主义本身，而不是另一个强权，哪怕这个强权是苏联。"

 UMA_head_of_government_4: "温和的革命者"
 UMA_Satono_Crown_leader_0: "里见皇冠"
 UMA_Satono_Crown_leader_0_tt: "§Y$UMA_Satono_Crown_leader_0$§!\n§Y温和的革命者§!\n  - $MODIFIER_RESISTANCE_GROWTH$：§G-35.00%§!\n  - $MODIFIER_POLITICAL_POWER_FACTOR$：§G+10.00%§!\n  - $MODIFIER_TRADE_OPINION_FACTOR$：§Y+25%§!\n  - $MODIFIER_GLOBAL_NON_CORE_MANPOWER$：§G+12.5%§!\n"
 UMA_Satono_Crown_leader_dip_0_tt: "§Y$UMA_Satono_Crown_leader_0$§!\n§Y[TAM.GetNameWithFlag]§!的革命接洽人\n§Y[TAM.GetNameWithFlag]§!的宣传部长\n§Y温和的革命者§!\n  - $MODIFIER_RESISTANCE_GROWTH$：§G-35.00%§!\n  - $MODIFIER_POLITICAL_POWER_FACTOR$：§G+10.00%§!\n  - $MODIFIER_TRADE_OPINION_FACTOR$：§Y+25%§!\n  - $MODIFIER_GLOBAL_NON_CORE_MANPOWER$：§G+12.5%§!\n"
 UMA_Satono_Crown_leader_0_desc: "§Y里见皇冠§!一直致力于建立特雷森和神州的积极外交关系。\n\n过去，特雷森有很多批评的声音认为，她过于重视神州，而忽视了特雷森的实际情况。\n\n但随着神州革命的失败，反动派的军锋已经毗邻中亚，像她这样，同时能被特雷森和神州流亡者认同的人，无疑会成为联系两端的纽带。"

 CAC_SOV_intervention_tt: "§R警告：§!§Y[SOV.GetNameDef]§!对中亚的利益十分关切，§R除非应对得当，否则苏联会出手干预§!"
 CAC_Attention_of_SOV: "苏联的注意"
 CAC_Attention_of_SOV_desc: "苏联一直试图染指中亚。\n虽然目前其专注于欧洲，但可以预料到的是，一旦§R欧洲平定§!，或者我们做出太多的§R“反苏举措”§!，苏联一定会动用包括武力在内的手段，来确保其后方的安定。\n\n\n§R警告§!！这一段内容还没做好，§R不保证§!游玩体验！"
 CAC_SOV_intervention_icon_value: "[?TAM.CAC_SOV_intervention_icon_value|0H]§Y%§!"
 CAC_SOV_intervention_icon_description: "关注度等级：[?TAM.CAC_SOV_intervention_icon_value|0H]§Y%§!\n\n若数值达到§R100%§!，则§Y[SOV.GetNameDefCap]§!将对我们采取强制手段，甚至发动入侵。\n若降至§G0%§!，[SOV.GetNameDef]将同意不干涉我们，下列行动将不可用。"
 CAC_SOV_intervention_declare_war_mission: "苏联的耐心"
 CAC_SOV_intervention_declare_war_mission_desc: "苏联一直以来都试图染指中亚。虽然目前其专注于国内和欧洲事物，但谁也不知道，什么时候，我们就会被“端上餐桌”。"
