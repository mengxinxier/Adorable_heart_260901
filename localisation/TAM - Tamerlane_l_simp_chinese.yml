l_simp_chinese:
 UMA_Oguri_Cap: "小栗帽"
 UMA_Oguri_Cap_desc: "小栗帽是新特雷森革命的精神象征。\n在“伟大战争”之后，失去了圣杯王国的扶持的旧特雷森，曾迎来最黑暗的十年。无数赛马娘成为了旧政府的“资产”，被压迫，被奴役，被禁锢……\n而在苏维埃联盟和第三国际成立后，她们看到了光。\n在地方抵抗组织的“灰姑娘”——小栗帽，和从苏联归来的政委——优秀素质的带领下，经过三年的革命战争，顽固的反动派已经被赶出了特雷森学院，盘踞在南方的山麓之中。\n1936年的钟声已经敲响，清算反动派的旗帜已经高扬，革命尚未成功，同志仍需努力！"

 UMA_head_of_government: "第一书记"
 UMA_Nice_Nature_leader: "优秀素质"
 UMA_Nice_Nature_leader_tt: "§Y$UMA_Nice_Nature_leader$§!\n§Y第一书记§!\n  - $MODIFIER_POWER_BALANCE_WEEKLY$：§Y-1.00%§!\n  - $MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-10.00%§!"
 UMA_Nice_Nature_leader_dip_tt: "$UMA_Nice_Nature_leader$\n§Y[SOV.GetNameWithFlag]§!的政治局委员\n§Y[TAM.GetNameWithFlag]§!的第一书记\n§Y第一书记§!\n  - $MODIFIER_POWER_BALANCE_WEEKLY$：§Y-1.00%§!\n  - $MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-10.00%§!"
 UMA_Nice_Nature_leader_desc: "§Y优秀素质§!是最早一批在苏联留学的马娘，也是世界苏维埃最坚定的支持者之一。\n\n而她在学成后，毅然放弃在苏联任职的光明未来，转而投身一穷二白的特雷森地区建设。她总是事必躬亲，确保特雷森的一切都在稳中向好地发展，这也让她和偏远笠松出身的§Y小栗帽§!结下了深厚的战友情谊。\n\n在马娘们数年的努力下，特雷森已经初步实现工业化，也成为了第三国际的观察国。而南方的各个派系，依然和旧帝国残余势力不清不楚。\n\n在被彻底清算之前，仇恨不会随着时间消亡，反而会愈发浓郁。优秀素质下定决心，将解放中亚的广大无产阶级。"


 UMA_head_of_government_0: "革命委员会总书记"
 UMA_Nice_Nature_leader_0: "优秀素质"
 UMA_Nice_Nature_leader_0_tt: "§Y$UMA_Nice_Nature_leader_0$§!\n§Y革命委员会总书记§!\n  - $MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-10.00%§!\n  - $MODIFIER_WAR_SUPPORT_WEEKLY$：§G1.00%§!\n  - $MODIFIER_STABILITY_WEEKLY$：§G1.00%§!\n  - $MODIFIER_POLITICAL_POWER_GAIN$：§G0.02§!\n"
 UMA_Nice_Nature_leader_dip_0_tt: "$UMA_Nice_Nature_leader_0$\n§Y[SOV.GetNameWithFlag]§!的政治局委员\n§Y[TAM.GetNameWithFlag]§!的革命委员会总书记\n§Y革命委员会总书记§!\n  - $MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-10.00%§!\n  - $MODIFIER_WAR_SUPPORT_WEEKLY$：§G1.00%§!\n  - $MODIFIER_STABILITY_WEEKLY$：§G1.00%§!\n  - $MODIFIER_POLITICAL_POWER_GAIN$：§G0.02§!\n"
 UMA_Nice_Nature_leade_0_desc: "§Y优秀素质§!是最早一批在苏联留学的马娘，也是世界苏维埃最坚定的支持者之一。\n\n而她在学成后，毅然放弃在苏联任职的光明未来，转而投身一穷二白的特雷森地区建设。她总是事必躬亲，确保特雷森的一切都在稳中向好地发展，这也让她和偏远笠松出身的§Y小栗帽§!结下了深厚的战友情谊。\n\n在马娘们数年的努力下，特雷森已经初步实现工业化，也成为了第三国际的观察国。而南方的各个派系，依然和旧帝国残余势力不清不楚。\n\n在被彻底清算之前，仇恨不会随着时间消亡，反而会愈发浓郁。优秀素质下定决心，将解放中亚的广大无产阶级。"

 UMA_head_of_government_3: "特雷森的§Y“皇帝”§!"
 UMA_Symboli_Rudolf_leader_0: "鲁道夫象征"
 UMA_Symboli_Rudolf_leader_0_tt: "§Y$UMA_Symboli_Rudolf_leader_0$§!\n§Y特雷森的“皇帝”§!\n  - $MODIFIER_STABILITY_WAR_FACTOR$：§G+30.00%§!\n  - $MODIFIER_POLITICAL_POWER_FACTOR$：§G+15.00%§!\n  - $MODIFIER_COMMAND_POWER_GAIN$：§G+0.2§!\n  - $MODIFIER_MAX_COMMAND_POWER$：§G+20§!\n"
 UMA_Symboli_Rudolf_leader_dip_0_tt: "§Y$UMA_Symboli_Rudolf_leader_0$§!\n§Y[TAM.GetNameWithFlag]§!的“皇帝”\n§Y特雷森的“皇帝”§!\n  - $MODIFIER_STABILITY_WAR_FACTOR$：§G+30.00%§!\n  - $MODIFIER_POLITICAL_POWER_FACTOR$：§G+15.00%§!\n  - $MODIFIER_COMMAND_POWER_GAIN$：§G+0.2§!\n  - $MODIFIER_MAX_COMMAND_POWER$：§G+20§!\n"
 UMA_Symboli_Rudolf_leader_0_desc: "§Y鲁道夫象征§!对苏联的警惕丝毫不亚于对南方的反革命派。\n\n和大多数无条件相信苏联的，清澈的愚蠢的新生代马娘们不同，身为二十年前大战的亲历者，她亲眼见证了苏联对异议者的残酷镇压。\n\n她坚定地认为，特雷森的救赎是社会主义本身，而不是苏联。"

 UMA_head_of_government_4: "温和的革命者"
 UMA_Satono_Crown_leader_0: "里见皇冠"
 UMA_Satono_Crown_leader_0_tt: "§Y$UMA_Satono_Crown_leader_0$§!\n§Y温和的革命者§!\n  - $MODIFIER_RESISTANCE_GROWTH$：§G-35.00%§!\n  - $MODIFIER_POLITICAL_POWER_FACTOR$：§G+10.00%§!\n  - $MODIFIER_TRADE_OPINION_FACTOR$：§Y+25%§!\n  - $MODIFIER_GLOBAL_NON_CORE_MANPOWER$：§G+12.5%§!\n"
 UMA_Satono_Crown_leader_dip_0_tt: "§Y$UMA_Satono_Crown_leader_0$§!\n§Y[TAM.GetNameWithFlag]§!的革命接洽人\n§Y[TAM.GetNameWithFlag]§!的宣传部长\n§Y温和的革命者§!\n  - $MODIFIER_RESISTANCE_GROWTH$：§G-35.00%§!\n  - $MODIFIER_POLITICAL_POWER_FACTOR$：§G+10.00%§!\n  - $MODIFIER_TRADE_OPINION_FACTOR$：§Y+25%§!\n  - $MODIFIER_GLOBAL_NON_CORE_MANPOWER$：§G+12.5%§!\n"
 UMA_Satono_Crown_leader_0_desc: "§Y里见皇冠§!一直致力于建立特雷森和神州的积极外交关系。\n\n过去，特雷森有很多批评的声音认为，她过于重视神州，而忽视了特雷森的实际情况。\n\n但随着神州革命的失败，反动派的军锋已经毗邻中亚，像她这样，同时能被特雷森和神州流亡者认同的人，无疑会成为联系两端的纽带。"

