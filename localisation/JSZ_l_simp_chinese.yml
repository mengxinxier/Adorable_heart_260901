####国策####
JSZ_Governor_still_exists: "南直隶总督府仍存"
JSZ_Governor_still_exists_desc: "昔日的帝国早已分崩离析，但南直隶的总督府仍然保留着旧日的威仪。军政合一的官署在江宁依旧升起青天白日之旗，或许，这片富庶之地仍能维系一线秩序。"
JSZ_Submit_to_central_government: "归顺中央"
JSZ_Submit_to_central_government_desc: "面对四方割据与民心思稳，归顺中央成为最为稳妥的选择。只要承认北方政府的名义，我们便能换取暂时的和平与发展空间。"
JSZ_Clear_kings_side: "清君侧"
JSZ_Clear_kings_side_desc: "北方的朝廷早已被权臣把持，帝心受制，奸佞横行。我们将以南直隶之兵，举义旗以清君侧，为天下重正纲常。"
JSZ_Chasing_deer_in_CHI: "逐鹿中原"
JSZ_Chasing_deer_in_CHI_desc: "天下大势，分久必合。如今群雄并起，逐鹿中原。唯有先发制人，方能定鼎华夏，重整中原之秩序。"
JSZ_Unify_China: "一统中国"
JSZ_Unify_China_desc: "乱世的帷幕终于落下，江山再归一统。从江宁到燕京，从岭南到蜀地，中华大地再度在一面旗帜下团结。一个新时代正在开启。"
JSZ_National_Revolution_victorious: "国民革命胜利"
JSZ_National_Revolution_victorious_desc: "数十年的积怨化作熊熊烈火。国民革命的号角在江宁吹响，推翻旧制、建立共和的理想再度复燃。我们将以自由与民族之名，建立新的国家。"
JSZ_Independence_Revolution: "独立革命"
JSZ_Independence_Revolution_desc: "独立革命"
JSZ_Ningguang_convergence: "宁广合流"
JSZ_Ningguang_convergence_desc: "宁广合流"
JSZ_Seventy_years_of_blood: "七十年太平血"
JSZ_Seventy_years_of_blood_desc: "太平天国的火种并未熄灭。昔日的天京，如今再度回荡圣王的颂歌。七十年血火沉浮，洪氏子民重举义旗，誓要再造天国，荡尽世间不平。"

