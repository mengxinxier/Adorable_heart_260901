####事件####
JSZ.01.title: "南直隶局势升级"
JSZ.01.desc: "近日，帝国财税核心——南直隶总督区的局势正以惊人的速度滑向失控的边缘。表面上仍效忠南京朝廷的总督段祺瑞，其控制力正在被两股强大的暗流不断侵蚀。\n一方面，渗透自两广的国民革命军特工与本地同情者频繁活动，他们在知识界与商界中散播反帝思想，策反新军军官，其组织网络如同藤蔓般悄然缠绕着帝国的统治根基。\n另一方面，蛰伏已久的“天父会”——那群自诩为太平天国正统继承者的狂热信徒，利用连年饥荒与官府盘剥所激起的民怨，在广袤的农村与运河漕工中迅速发展。他们宣扬“神权再临”，其声势之浩大，已到了无法忽视的地步。\n三方势力在城镇、乡村与水道之间爆发了多次小规模但流血的冲突，暗杀、绑架与煽动性传单已成为常态。总督段祺瑞已下令军队进入戒备状态，但面对内外交织的敌人，他的镇压行动显得顾此失彼，力不从心。整个江南地区宛如一个巨大的火药桶，只待一粒火星，便将引爆一场决定东南命运的巨大爆炸。"
JSZ.01.a: "电令段总督：务必维持稳定，不惜一切代价！"

JSZ.02.title: "南直隶总督府取得胜利"
JSZ.02.desc: "持续数月的江浙乱局终于初见分晓。在付出惨重的代价后，总督府的军队成功地将国民党渗透小组驱逐出主要城市，并在一系列残酷的巷战中击溃了盘踞在苏南乡村的“天父会”太平军余孽。尽管胜利的代价是数个繁华市镇的残破与大量军民伤亡，但帝国的双刃剑旗终于再次于南京城头稳固地升起。\n\n总督府发表公告，严厉谴责了“革命党匪”与“邪教遗毒”的祸乱行径，并宣布将在全境实行严格的军事管制与宵禁。这场胜利暂时稳固了帝国在财税重地的统治，但也极大地消耗了南直隶军阀的实力，并埋下了更深仇恨的种子。放眼未来，这片土地是会在高压下重归平静，还是会孕育出更激烈的风暴？"
JSZ.02.a: "总督区仍存！"
JSZ.02.b: "清君侧！"

JSZ.03.title: "国民党起义军取得胜利"
JSZ.03.desc: "“革命成功了！”——这样的呼喊声回荡在从杭州到上海的街头。在本地市民、商会和部分倒戈士官的支持下，国民革命军成功地成为了这场三方角逐的最后赢家。总督府的军队在内外夹击下土崩瓦解，其首领已乘船北逃。而那个试图复辟“小天堂”的“天父会”，则在革命军现代化的战术与政治宣传面前一触即溃。\n\n随着青天白日旗在各级政府机构升起，一套全新的行政体系正在被迅速建立。国民党宣布进行地方选举、废除部分苛捐杂税，并带来了全新的革命气象。江浙地区，这个帝国曾经的财赋命脉，如今已变成了革命的最前沿堡垒，为整个神州大地树立了一个崭新的榜样。"
JSZ.03.a: "一个新的时代开始了！"

JSZ.04.title: "太平军取得胜利"
JSZ.04.desc: "谁也没有料到，这场混乱的最终胜者，竟是那蛰伏已久的“天父会”。他们凭借对底层民众的煽动性号召和对乡间的严密控制，如同野火般席卷了江浙。总督府的军队在镇压中疲于奔命，而国民党的组织则被视为又一个“清妖”而被乡民敌视。如今，南京——这座曾被太平天国定为“天京”的古都，再次响起了拜上帝教的祈祷声。\n\n“天父会”的领袖，自称洪秀全后裔的“洪天王”，宣布在江南重建“太平天国”。他们废黜清制，恢复古老的官爵，并将土地与财富收归“圣库”。这一结果让国内外的观察家们都大跌眼镜，一个既反帝国又反近代化的神权政权，竟然在神州最富庶、最“文明”的地区建立了统治。这究竟是历史的倒退，还是一场更为诡异的革命的开始？"
JSZ.04.a: "天父在上，愿人人饱暖，共享太平。"

JSZ.05.title: "血衣诏"
JSZ.05.desc: "窗外细雨敲打荷叶，檐下灯笼在风中摇曳，将人影拉得忽长忽短。南直隶总督段祺瑞，正于案前批阅漕运公文，亲兵统领却无声地引一人入内。\n来者脱下湿透的斗篷，露出康佑薇那张饱经风霜却目光如炬的脸。他未发一言，只从怀中取出一个以明黄绸缎紧裹的物事。绸缎解开，内里并非金玉，而是一件质地考究、却被利器划破、浸染着大片已呈褐色的干涸血痕的白色内衬。\n血衣之上，以朱砂赫然写就一道密诏，字迹娟秀而决绝，正是当今天子蒋丽华的手笔：\n\n“袁贼窃国，幽禁朕身，屠戮忠良，人神共愤。\n段卿世受国恩，镇守东南，乃国之柱石。今特密诏于卿，望念及太祖创业维艰，先帝托付之重，速起义兵，清君侧，靖国难。\n成败利钝，唯卿所择。此衣之血，为朕指间所沥，但见血诏，如朕亲临！\n——永和帝-蒋丽华-血书”\n\n康佑薇声音低沉，却字字千钧：“段公，此非康某与黎星刻之请，此乃天子泣血之命！袁克定倒行逆施，天下共见。晋北重岳已应誓出兵，卡住娘子关。如今只待您振臂一呼，锁断长江，则袁贼首尾难顾，大事可成！”\n他顿了顿，目光锐利如刀：“陛下有言，若得克定袁逆，再造神州，当效仿西洋，行君主立宪。届时，您不仅是帝国的再造元勋，更是新朝议会之首座，江浙之利，即为国之利，永世不易。”\n窗外，一声惊雷炸响，映亮了段祺瑞沉静如水的面庞，也映亮了那件承载着帝国命运与无限风险的血色诏书。"
JSZ.05.a: "臣，段祺瑞，接诏！为陛下，为帝国，讨逆贼！"

