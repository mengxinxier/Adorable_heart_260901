JSZ_news.001.title: "$news_event_background$南直隶总督府平息骚乱"
JSZ_news.001.desc: "神州帝国中央的混乱局面已让这个古老的帝国陷入严重的危机，其回响在中华大地上正不断发酵，首当其冲的便是地处南直隶地区的帝国总督府。\n\n一直以来，该总督府依靠神州中央的财政以及兵源支持，训练南方新军，有力镇压南方地区的反叛势力。如今，随着帝国中央陷入动乱，国民党人借两广起义之势组织部队发动起义，本地的农民军也揭竿而起，她们誓要摧毁帝国在南直隶地区的统治。但在激烈的交锋之后，南直隶总督府的部队成功镇压了两派起义势力，笑到了最后。\n\n目前，大规模的起义声浪已被镇压，数千人被逮捕入狱，死难者不计其数。南直隶总督段祺瑞已向外界发出正式公告，宣布南方逆党颠覆南直隶总督府的阴谋已被消灭，他本人将不日觐见天子，以表忠心。\n\n神州中央已正式下诏，表彰南直隶总督剿匪之功劳，而南方国民党则再次撰文抨击帝国政府对民主人士的血腥镇压行为。不可否认的是，随着帝国精兵进入南直隶，神州帝国在此地区的统治更加稳固。"
JSZ_news.001.a: "秩序，必须付出代价。"
JSZ_news.001.b: "秩序，必须付出代价。"
JSZ_news.001.c: "顽强的封建势力"
JSZ_news.001.d: "看来帝国还没有完全失去控制力"
JSZ_news.001.e: "若问古今兴废事，请君只看南京城。"

JSZ_news.002.title: "$news_event_background$国民党起义推翻南直隶总督府"
JSZ_news.002.desc: "神州帝国中央的混乱局面已让这个古老的帝国陷入严重的危机，其回响在中华大地上正不断发酵，首当其冲的便是地处南直隶地区的帝国总督府。\n\n一直以来，该总督府依靠神州中央的财政以及兵源支持，训练南方新军，有力镇压南方地区的反叛势力。如今，随着帝国中央陷入动乱，国民党人借两广起义之势组织部队发动起义，本地的农民军也揭竿而起，她们誓要摧毁帝国在南直隶地区的统治。经过激烈的战斗之后，国民党起义部队击败了农民，并攻占了南直隶总督府，向天下宣告了她们在南直隶地区的起义胜利。\n\n随着最后一批帝国军队撤离南直隶，国民党对于南直隶地区封建势力的清算也随之开始，整个南直隶枪声不断，大批贵族和旧军官遭到枪决。帝国中央已正式发文严厉谴责国民党人在南直隶地区进行的屠杀行为，而国民党中央亦发文回击，罗列了神州政府镇压起义者的种种暴行，并宣称不日即将挥师北上，直捣京师。随着数千国民党部队挥师北上，人们相信，南北之间的大战已为时不远。"
JSZ_news.002.a: "可恶的叛匪"
JSZ_news.002.b: "拥抱新时代！"
JSZ_news.002.c: "还算不错"
JSZ_news.002.d: "国民党又席卷了一个地方"
JSZ_news.002.e: "若问古今兴废事，请君只看南京城。"

JSZ_news.003.title: "$news_event_background$太平天国重回人间"
JSZ_news.003.desc: "神州帝国中央的混乱局面已让这个古老的帝国陷入严重的危机，其回响在中华大地上正不断发酵，首当其冲的便是地处南直隶地区的帝国总督府。\n\n一直以来，该总督府依靠神州中央的财政以及兵源支持，训练南方新军，有力镇压南方地区的反叛势力。如今，随着帝国中央陷入动乱，国民党人借两广起义之势组织部队发动起义，本地的农民军也揭竿而起，她们誓要摧毁帝国在南直隶地区的统治。但出乎所有人意料的是，农民起义军在激烈的战斗中占据了上风，将两派势力通通击溃，正式占据了南直隶地区，并向外宣告她们将重建历史上覆灭的太平天国，并迎回洪氏担任天王。\n\n当前，前所未有的变化正在南直隶大地上发生，农民们正在欢天喜地的烧毁地契，平分土地，大批民众被要求捐出财物充实圣库，并加入太平军。起义领袖们宣称，她们接下来的工作便是养精蓄锐，抵御南北两方反动势力的侵袭。而对此，神州帝国和国民党双方政府均予以强烈谴责。"
JSZ_news.003.a: "这是从哪里出来的东西？"
JSZ_news.003.b: "天父在上，愿人人饱暖，共享太平。"
JSZ_news.003.c: "这是从哪里出来的东西？"
JSZ_news.003.d: "这是从哪里出来的东西？"
JSZ_news.003.e: "若问古今兴废事，请君只看南京城。"

