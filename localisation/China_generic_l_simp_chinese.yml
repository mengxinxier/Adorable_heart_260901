  CWL_dajijunduifubai: "严明治军"
  CWL_changshizizhusheji: "尝试自主设计"
  CWL_xiangyangdejundui: "像样的军队"

##  地名
  STATE_716_liaoning: "辽宁"
  STATE_617_urumchi: "乌鲁木齐"

  VICTORY_POINTS_11771_shenyang: "沈阳"
  VICTORY_POINTS_4709_urumchi: "乌鲁木齐"
  VICTORY_POINTS_9843_beiping: "北平"

####国策####
  CWL_xiaojunfadamengxiang: "小军阀有大梦想"
  CWL_xiaojunfadamengxiang_desc: "在这动荡的年代，偏安一隅绝非长久之计。整军经武、开疆拓土，方能使我们的理想照进现实。"
  CWL_shoudujianshe: "首都建设"
  CWL_shoudujianshe_desc: "一座宏伟的首都不仅是行政中枢，更是民族精神的象征。通过改造城市格局与地标建筑，我们将用一座崭新的城市宣告我们的崛起。"
  CWL_gongyetouzi: "工业投资"
  CWL_gongyetouzi_desc: "机床的轰鸣是强国崛起的序曲。规划工业布局，调拨足够的人力物力，将沉睡的矿产资源转化为支撑战争的钢铁洪流，扫平一切挡在我们面前的阻碍。"
  CWL_gaishanjichusheshi: "改善基础设施"
  CWL_gaishanjichusheshi_desc: "铁路与公路是现代国家的血脉。我们将尽快完善掌控区域内的交通网络，让军队与物资得以高效机动。"
  CWL_jinyibutouzi: "进一步投资"
  CWL_jinyibutouzi_desc: "工业建设永无止境。我们将投入更多资源扩大工业规模，为持久战争奠定产能基础。"
  CWL_gonggnogjiaoyugaige: "公共教育改革"
  CWL_gonggnogjiaoyugaige_desc: "识字率决定国家未来。现有的公共教育体系远不足以支持一个强国。我们需要对其进行改革，从根源提升兵源素质与科技人才储备。"
  CWL_bendiwuqizhizao: "本地武器制造"
  CWL_bendiwuqizhizao_desc: "我们的武器进口始终受制于人。在工业得到一定发展后，我们决定建立本土兵工厂，以实现武器的自主供给为终极目标。"
  CWL_zousijunhuo: "走私军火"
  CWL_zousijunhuo_desc: "我们会利用黑市渠道与境外势力周旋。用金银、矿产或特许权换取急需的武器装备。"
  CWL_kuodashengchanguimo: "扩大生产规模"
  CWL_kuodashengchanguimo_desc: "当千万条流水线可以做到昼夜不休，枪炮产量将不再是制约军队规模的瓶颈。"
  CWL_gonggonggongcheng: "公共工程"
  CWL_gonggonggongcheng_desc: "以工代赈，一举两得。我们将实行由政府牵头的大型基建项目，这既能提振就业，又可以强化战略设施。"
  CWL_kantanjishu: "勘探技术"
  CWL_kantanjishu_desc: "我们将从高等学府中挑选出优秀师生，组织多批地质勘探队深入荒野。精准测绘与资源普查是科学开发的前提。"
  CWL_liangangchang: "建设炼钢厂"
  CWL_liangangchang_desc: "钢铁是工业的骨骼。我们将兴建高炉与轧钢厂，打造属于我们自己的钢铁产业。"
  CWL_zhanzhengshui: "战争税"
  CWL_zhanzhengshui_desc: "大炮一响，黄金万两。我们决定开征特别税、发行战争债券，甚至在极端情况下允许直接征用民间资产以充军需。"
  CWL_zhengbianjundui: "整编军队"
  CWL_zhengbianjundui_desc: "我们的军队仍然留有浓厚的旧军队遗风，而一支落后的军队无法实现我们的理想。淘汰老弱，精简编制。推行现代军事条例，我们要将这支落后武装改造为现代职业化军队。"
  CWL_jianlijunxiao: "建立军校"
  CWL_jianlijunxiao_desc: "我们规划设立现代化的军官培养体系。系统化的战术教育远胜过战场上的盲目牺牲。"
  CWL_souguajunhuoku: "搜刮军火库"
  CWL_souguajunhuoku_desc: "神州大地上遍布着各种被遗留下来的军火库和其他储藏设施，搜查废弃仓库与旧军阀据点。那些被遗忘的军械或许能解我们的燃眉之急。"
  CWL_dajijunduifubai: "打击军队腐败"
  CWL_dajijunduifubai_desc: "一直以来，在我们的军队里，贪腐现象十分严重。作为让军队迈向现代化的一部分，我们将会成立军事监察机构。严惩吃空饷、倒卖物资等行径，重塑军队纪律。"
  CWL_baoweijiayuan: "保卫家园"
  CWL_baoweijiayuan_desc: "不只是正规军队，来自老百姓的力量也同样强大。我们的基层官员将发动民众组建乡土防卫队，熟悉地形的民兵将在本土防御中发挥奇效。"
  CWL_nongminbing: "农民兵"
  CWL_nongminbing_desc: "我们会给农民发放那些已被淘汰的老式步枪，他们会用保家卫国的信念弥补训练不足。"
  CWL_kuaisudongyuan: "快速动员"
  CWL_kuaisudongyuan_desc: "目前，我们几乎完全不存在任何现代化的预备役制度与动员机制，除了主动征兵就只剩下抓壮丁这一种办法。一场针对动员机制的改革势在必行，我们要让国家在危机时刻能迅速武装起百万大军。"
  CWL_bendiwuqifazhan: "本地武器发展"
  CWL_bendiwuqifazhan_desc: "只有不断发展，才不会在残酷的竞争中落于下风。我们规划设立武器研发部门，根据实战需求改进现有装备性能。"
  CWL_fazhanzhongwuqi: "发展重武器"
  CWL_fazhanzhongwuqi_desc: "不用说也知道，在我们的军队里，重火力、重装备不足是常态。我们会组建专业工兵与炮兵以及装甲兵等单位，用重火力弥补步兵作战的局限。"
  CWL_jidongzuozhan: "机动作战"
  CWL_jidongzuozhan_desc: "我们将划拨资源用以研究摩托化行军与突袭战术，全新的机动部队将用速度撕裂敌人那僵硬的战线。"
  CWL_yindizhiyi: "因地制宜"
  CWL_yindizhiyi_desc: "神州有着广袤的疆土，各种地形几乎应有尽有，每个地区的人都有着针对那片地区作战的一套独特办法。我们会根据这些经验编写作战手册，让特殊地形从阻碍变为优势。"
  CWL_changshizizhusheji: "尝试自主设计"
  CWL_changshizizhusheji_desc: "虽然我们的科技水平还很薄弱，但如果不迈出艰难的第一部，我们的武器发展就要永远受制于人。投资军工科研机构，一步步从仿制走向原创，我们终将设计出世界一流的武器装备。"
  CWL_kuojianjungongchang: "扩建军工厂"
  CWL_kuojianjungongchang_desc: "随着军队扩编和换装规模的扩大，现有的军工厂产能已经开始出现供应不上的情况。因此，我们决定扩建现有兵工厂，增设炮弹、机枪等生产线，保证武器装备的充足供应。"
  CWL_xiangyangdejundui: "像样的军队"
  CWL_xiangyangdejundui_desc: "通过整编、训练与换装，我们将打造出一支装备精良、令人生畏的常备军。"

  CWL_womendeweilai: "我们的未来"
  CWL_womendeweilai_desc: "命运的岔路口已然显现。是延续旧制，还是开辟新途？我们的决策将影响未来无数世代的子子孙孙。"
  CWL_zhongyuchaoting: "忠于朝廷"
  CWL_zhongyuchaoting_desc: "我们决定向中央政权宣誓效忠。以政治忠诚换取合法地位与潜在支援。"
  CWL_lingzemingzhu: "另择明主"
  CWL_lingzemingzhu_desc: "经过审时度势，我们决定依附于最具实力的外部势力。但选择作为附庸的代价或许是丧失自主权力。"
  CWL_jingguanqibian: "静观其变"
  CWL_jingguanqibian_desc: "我们决定保持战略定力。在各方势力明确分出胜负前，不轻易暴露自身立场。"
  CWL_mounixiaoxiong: "谋逆枭雄"
  CWL_mounixiaoxiong_desc: "皇帝轮流做，今天到我家！我们将暗中联络其他割据势力，通过密约与同盟构筑新的阵线，以求杀上京城，夺了鸟位！"
  CWL_xuangaozhengtong: "宣告正统"
  CWL_xuangaozhengtong_desc: "我们将宣称我们才是神州法统的真正继承者。用历史文献与政治宣传争夺正统性话语权，尽管其中的很多话术和所谓历史记载都需要我们凭空捏造……"
  CWL_mengxiangchengzhen: "梦想成真"
  CWL_mengxiangchengzhen_desc: "长风破浪会有时，直挂云帆济沧海。"

  CWL_dongbeijiangwutang: "从边防军到国防军"
  CWL_dongbeijiangwutang_desc: "作为曾经的边防军，我们的部队仍存在极大的局限性和许多不足之处。我们将把地方防务组织整合为国防军体系，实现指挥统一与装备标准化。" 
  CWL_buzhiyaoanfang: "不止要岸防"
  CWL_buzhiyaoanfang_desc: "我们一定要制定远洋防御战略，成为一个强国的必要条件之一就是建设能前出关键水道的海上力量，而非单单困守近海。" 
  CWL_kuojiandaliangang: "建设船厂"
  CWL_kuojiandaliangang_desc: "我们将扩建港口设施与造船厂，为打造我们的蓝水舰队提供硬件支撑。" 
  CWL_qingxingjianting: "轻型舰艇"
  CWL_qingxingjianting_desc: "鱼雷艇与巡逻舰之类的小型舰艇价格低廉，也没有太厚的技术壁垒，我们将优先建造这些轻型快艇用来适合保卫我们的沿岸航线。" 
  CWL_jiaqianghaianfangyu: "加强海岸防御"
  CWL_jiaqianghaianfangyu_desc: "我们将在沿岸构筑大量海岸炮台，并在近海布置水雷阵地，让任何企图登陆的敌军付出惨痛代价。"  
  CWL_fengtianhaijunluzhandui: "建立海军陆战队"
  CWL_fengtianhaijunluzhandui_desc: "我们将从零开始，组建专业两栖部队。他们将是未来跨海作战的尖刀。" 
  CWL_haijunrencai: "培养海军人才"
  CWL_haijunrencai_desc: "我们的海军不止缺乏舰队，更缺乏优秀的海军士兵。我们计划派遣学员远赴海外深造，同时在国内兴办海军院校，培育本土指挥军官与技术兵。" 
  CWL_zhongshixunyangjian: "重视巡洋舰"
  CWL_zhongshixunyangjian_desc: "我们将专注于发展巡洋舰。它们兼具优秀的火力与较远航程，未来将成为舰队的中坚力量。" 
  CWL_ziyanqianting: "自研潜水艇"
  CWL_ziyanqianting_desc: "我们计划设立完全自主的潜艇研发项目，这种隐秘杀手能对敌方航运造成致命威胁。" 
  CWL_zhongxingzhanjian: "重型战舰"
  CWL_zhongxingzhanjian_desc: "构建舰队的最后一步是集中资源建造主力舰，它们的巨舰重炮仍是这个时代海军实力的最高象征。" 
  CWL_lanshuihaijun: "蓝水海军"
  CWL_lanshuihaijun_desc: "如果不能掌控海洋，神州就永远成为不了真正的强国。我们要打造能远洋部署的特混舰队，唯有如此我们才能真正掌握制海权。" 
  CWL_jiaoguanwenti: "赦免将领"
  CWL_jiaoguanwenti_desc: "随着军队逐渐扩张和整编，我们现有的各级将领数量已然不满足需求。我们将对曾有瑕疵但能力出众的将领给予戴罪立功的机会，让他们助力我军的现代化进程。" 
  CWL_zaogengduodeqiang: "造更多的枪"
  CWL_zaogengduodeqiang_desc: "我们计划推行工业生产总动员，一切为前线服务，一切为胜利让步。" 
  CWL_yankongzhuangbeizhiliang: "严控装备质量"
  CWL_yankongzhuangbeizhiliang_desc: "经过一段时间的发展，我们的工业水平和产量都有了长足进步。但在此过程中出现了诸多质量问题。为此，政府决定主导建立军工质检体系，毕竟劣质装备可比敌人更能摧毁部队士气。" 
  CWL_gaizufengtianpaijipaochang: "军备升级"
  CWL_gaizufengtianpaijipaochang_desc: "我们计划引进外国军事装备技术并进行本土化改进，这将显著提升陆军火力水平。" 
  CWL_junguanjiaodaoban: "军官教导班"
  CWL_junguanjiaodaoban_desc: "我们将在军队中开设高级指挥课程，培养具备现代战争思维的将校级军官，提升我军军官的专业程度。" 
  CWL_qiequdiguotuzhi: "保持科技优势"
  CWL_qiequdiguotuzhi_desc: "我们将进一步增加对科研事业的投入，并且通过外交、商业或非正规手段获取国外先进军事科技资料，用以保证我们保持有一定的科技优势。" 
  CWL_minshengpaiqiche: "建立装甲部队"
  CWL_minshengpaiqiche_desc: "我们计划将一部分颇具规模的民用汽车工厂逐步转为装甲车生产基地，这将是我军向机械化迈出的第一步。"
  CWL_henzhuajunji: "狠抓军纪"
  CWL_henzhuajunji_desc: "虽然经过了整编和教育，但是我军在维持军纪上的表现仍然令军队高层发愁。经过讨论，我们决定颁布更加严厉的军法条例，同步设立战地宪兵队等机构，力求根除违纪行为。" 
  CWL_shandizuozhan: "山地作战"
  CWL_shandizuozhan_desc: "术业有专攻，我们筹划组建山地步兵单位，他们将被配发专用装备，强化复杂地形作战能力。"
  CWL_xinshijundui: "新式军队"
  CWL_xinshijundui_desc: "军队高层计划以最先进的条令、装备与编制打造几个样板师以作为全军改革标杆，以他们为榜样逐渐把全军改革成现代化的新式军队。"
  CWL_gaigebaojiazhi: "改革保甲制"
  CWL_gaigebaojiazhi_desc: "我们决定把传统的保甲制度与现代户籍管理制度相结合，用以强化基层动员与治安控制。" 
  CWL_wuxiandianjishu: "无线电技术"
  CWL_wuxiandianjishu_desc: "我们决定让科研机构大力发展无线电通信装备，这将让我军的通讯效率得到极大提升。" 
  CWL_zhuangjiabingtuan: "现代化陆军"
  CWL_zhuangjiabingtuan_desc: "火炮，装甲，摩托化，机械化……我们已经初步实现了打造一支现代化陆军的目标。" 
  CWL_dongbeihangkongdui: "独立的空军军种"
  CWL_dongbeihangkongdui_desc: "在未来，天空将是制霸陆地战场的过程中重要的一环，我们将建立独立空军指挥体系，摆脱陆军对航空兵的建制束缚。" 
  CWL_kuojianjichang: "扩建机场"
  CWL_kuojianjichang_desc: "我们现有的机场老旧且落后，完全不能满足现代空战的需求。我们将拨款扩建野战机场网络，提升航空兵前线部署与补给能力。" 
  CWL_nixianggongcheng: "逆向工程"
  CWL_nixianggongcheng_desc: "我们将对外国先进战机进行拆解研究，这会大大加速本土航空技术积累。" 
  CWL_xuexiwaiguofeixingjishu: "学习外国飞行技术"
  CWL_xuexiwaiguofeixingjishu_desc: "精良的战机与优秀的飞行员缺一不可。我们将派遣飞行员赴国外受训，提升他们的作战能力，同时聘请外籍教练缩短新质战斗力生成周期。" 
  CWL_wangzha: "王炸"
  CWL_wangzha_desc: "轰炸机是现代空战中不可或缺的武器，我们将在未来一段时间里倾注资源突破航空技术瓶颈，力争研制出性能领先的战略轰炸机。" 
  CWL_goumairibenfeiji: "外国战机订单"
  CWL_goumairibenfeiji_desc: "我们的空军现在还是个空架子，完全没有能力保护神州的天空。我们加护通过紧急采购快速获得成熟机型，用以渡过这段艰难时期。" 
  CWL_woshigesanbing: "我是个伞兵"
  CWL_woshigesanbing_desc: "空降作战概念被一些军官提出，我们计划选取一些优秀士兵组建能深入敌后执行特殊任务的伞兵部队，他们将成为插入敌人心脏的尖刀。" 
  CWL_duifudijunjiandui: "对付敌军舰队"
  CWL_duifudijunjiandui_desc: "俗话说十年空军，百年海军，海军战斗力的的成型速度远比空军慢得多。因此我们计划大力发展岸基航空反舰能力，用飞机弥补舰队实力的不足。" 
  CWL_fazhanminhangshiye: "发展民航事业"
  CWL_fazhanminhangshiye_desc: "政府计划扶持国内新兴的民用航空产业，这既能促进经济发展，又可以为空军储备飞行员与地勤人员。" 
  CWL_tongzhitiankong: "统治天空"
  CWL_tongzhitiankong_desc: "通过整合空军各机种部队，我们已经有能力构建全方位的立体作战体系。神州的天空终将属于神州人，外来者的铁翼将不再能够遮蔽输入我们的太阳！" 

  CWL_kaishichongjian: "开始重建工作"
  CWL_kaishichongjian_desc: "内战的结局已经尘埃落定，我们是中国内战最后的胜者，现在是时候将目光放回国内了。"
  CWL_chongjianhuabei: "重建华北"
  CWL_chongjianhuabei_desc: "华北地区在内战中遭到了破坏，我们将调拨资源在华北地区开展重建活动。"
  CWL_chongjianhuanan: "重建华南"
  CWL_chongjianhuanan_desc: "华南地区在内战中遭到了破坏，我们将调拨资源在华南地区开展重建活动。"
  CWL_chongjiandongbei: "重建东北"
  CWL_chongjiandongbei_desc: "东北地区在内战中遭到了破坏，我们将调拨资源在东北地区开展重建活动。"
  CWL_gongyefuxingzongshu: "工业复兴总署"
  CWL_gongyefuxingzongshu_desc: "因为战争毁坏与抵抗活动，新纳入[ROOT.Getname]统治的地区大多处于百废待兴的状态，要想重新使战后国内的工业得到复苏，我们需要设置一个总领全局的工业指导部门进行重建工作。"
  CWL_fazhanzhonggongye: "发展重工业"
  CWL_fazhanzhonggongye_desc: "重工业是国家和民族在世界上立足的根本，是国防事业的基础。为了中国繁荣昌盛，我们将投入大量资源全力发展重工业，竭尽全力将中国推向工业化。"
  CWL_zhengheguofangchanye: "整合国防产业"
  CWL_zhengheguofangchanye_desc: "中国若想屹立在世界之林，强大的国防力量是刚需中的刚需。为了将这个古老国度的国防事业推向现代化、标准化，我们将成立新的部门，这个部门将会全盘接收全国的国防产业，并将它们整合、升级。"
  CWL_ziyuanweiyuanhui: "资源委员会"
  CWL_ziyuanweiyuanhui_desc: "中国广袤的国土上从不缺乏自然资源，但我们落后而陈旧的开发方式显然已经不足以支撑一个现代国家的需要。因此，资源委员会宣告成立，它将指导全国的自然资源开发，用更先进、更科学的方式最大程度利用中国拥有的各项资源。"
  CWL_chongjiantieluxitong: "重建铁路系统"
  CWL_chongjiantieluxitong_desc: "铁路是现代国家一条重要的大动脉，在之前的内战中，中国的铁路系统遭受了巨大的破坏。不过俗话说，要先破旧才能迎新。过去的铁路系统放在现在已经严重落后，我们将借此机会发展我国的铁路产业，一边重建全国的铁路系统，一边将我国的铁路产业推进至现代水平。"
  CWL_jieshoukeyanxiangmu: "接手科研项目"
  CWL_jieshoukeyanxiangmu_desc: "内战结束后，我们得到了一些来自于其他势力的科研项目。这其中的一些看起来有着强劲的发展势头，我们将分配我们的科研人员接手这些项目，继续推进科技发展。"
  CWL_nongyeyuanzhu: "农业援助"
  CWL_nongyeyuanzhu_desc: "农业，这项堪称人类之本的产业需要得到重点关注。中国的农业仍然落后于世界，我们需要对我们的农民和农业相关的机构进行一定程度的援助，帮助他们逐渐向现代化农业发展。"
  CWL_kuozhaoxingzhengguanyuan: "扩招行政官员"
  CWL_kuozhaoxingzhengguanyuan_desc: "随着重建的不断进行，我们接手的工作无论是种类还是数量都在飞速增长，同时伴随着我们对全国各地掌控力的加深，我们的行政官员的数量已经显得捉襟见肘。为了增强政府机构的运转能力，我们将在快速而精密的筹划后对行政官员进行扩招，以缓解政府巨大的行政压力。"
  CWL_dajitoujidaoba: "打击投机倒把行为"
  CWL_dajitoujidaoba_desc: "一些大型企业已经开始在占领区扩张他们的业务，但是部分企业试图在占领区进行一些囤货居奇的违法行径。这些恶行无疑会激发当地居民的反抗情绪，我们得抢先一步制止这些投机行为。"
  CWL_zhanxianhefaxing: "展现合法性"
  CWL_zhanxianhefaxing_desc: "无论用何种手段取得政权，合法性始终是绕不开的问题。用各种方式对内和对外宣称自己对于本国权力的合法性是十分重要的政治活动，我们将调拨人力物力展开一场政治宣传活动，尽量为我们这个政权的合法性取得一定保证。"
  CWL_jiujiying: "保障民生"
  CWL_jiujiying_desc: "这场声势浩大的内战传统农业造成了巨大打击，无数家园被毁的农民正在寻求我们的的经济援助，我们得马上想办法安置这些可能会影响社会稳定的难民。"
  CWL_quebaogengdianquan: "确保耕地安全"
  CWL_quebaogengdianquan_desc: "部分企业开始积极的在新占领区恶意收购当地土地，这其中包括了大量对我国农业发展将大有助益的肥沃耕地，在他们的扩张行径失去控制之前，我们得先确保他们的经济扩展不会危及那些适合耕种的传统耕地。"
  CWL_zhonghuajueqi: "中华崛起"
  CWL_zhonghuajueqi_desc: "经过一系列的经济重建与社会稳定工作，各省都向首都传来了好消息，[ROOT.Getname]的统治秩序已经在全国范围内基本稳定了下来，万岁！"

