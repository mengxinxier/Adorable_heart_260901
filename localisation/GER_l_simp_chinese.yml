  GER_schutzstaffel_modifer: "党卫军"
  GER_schutzstaffel_modifer_desc: "\n\n\n\n£GFX_idea_schutzstaffel_bg\n\n\n\n\n党卫军（SS），是用于执行治安勤务的编制之一，与纳粹党武装战斗执行部队的冲锋队并立的另一支纳粹党情报和监视、拷问行刑组织。在经由党卫队全国领袖柊舞缇娜的建设下，党卫军成为了德国魔法军队建设与研究的先锋阵地。不过全国领袖似乎有些小癖好，让党卫军的制服总是显得很奇怪。"
