  GER_Auto_Strasser_DESC_1: "§Y奥托·施特拉塞§!\n§Y纳粹左派§!\n  - $MODIFIER_STABILITY_FACTOR$：§G+5.00§!\n  - $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$：§G+5.00%§!\n  - $MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-10.00%§!"
  GER_Auto_Strasser_Diplomacy_desc: "§Y奥托·施特拉塞§!\n@GER§Y[FROM.Getname]§!的§C副元首§!\n\n§Y纳粹左派§!\n  - $MODIFIER_STABILITY_FACTOR$：§G+5.00§!\n  - $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$：§G+5.00%§!\n  - $MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-10.00%§!"
  GER_Auto_Strasser_desc: "奥托·施特拉塞是最为臭名昭著的纳粹“左”翼分子之一，很多劣质的传闻、科普和政治光谱图都在有意无意地打扮施特拉塞的“社会主义”形象。\n\n在过去，她曾与姐姐格雷戈尔·施特拉塞一起从事于“国家社会主义”的工作，她的姐姐在首都创办了一张报纸，名叫《柏林工人日报》，就由奥托·施特拉塞主编，还有一份双周刊《国社党通讯》，供党内工作人员阅读，内容是关于党的方针政策的。此外她还在普鲁士、萨克森、汉诺威和工业地区莱因兰奠下了政治组织的基础。施特拉塞姐妹真可以说像架精力过人的发电机，她们在北方到处奔走，发表演讲，指派区领袖，建立党机器。\n\n当她的姐姐选择了一个名叫保罗·约瑟夫·戈培尔的莱茵兰人做她的秘书兼《国社党通讯》的主编。这个人后来对纳粹党的宣传工作发挥了重要的作用。这个面容瘦黑、形同侏儒、瘸了一条腿的青年，是一个思想敏捷、心理复杂而有点神经质的人。早在1922年，她第一次在慕尼黑听到莉莎的讲话后就信仰国家社会主义，从此参加了纳粹党。但是纳粹运动在三年以后才发现这个人才。当时施特拉塞听了她的发言后，认为她是一个富有才华的狂热的民族主义者，能说善辩，有一支锋利的文笔，受过良好的大学教育，而最后这一点在纳粹党领袖中真可谓凤毛麟角。当时柊舞缇娜刚刚辞去施特拉塞秘书的职务去一心养鸡。施特拉塞就派戈培尔接替。这项任命后来证明是具有决定性意义的。\n\n1934年“长刀之夜”中，格雷戈尔·施特拉塞被党卫军暗杀，纳粹左派从此失势，而她怎么也没想到，曾经姐姐的秘书--戈培尔在坐上权力巅峰，邀请她出山担任她的副手。奥托·施特拉塞的或许终于有机会去实现她的愿景了。"

  GER_Elaina: "伊蕾娜"
  GER_Elaina_desc_1: "§Y伊蕾娜§!\n§Y$GER_Wandering_Witch$§!\n  - $MODIFIER_SUPPLY_CONSUMPTION_FACTOR$：§G-10.00%§!\n  - $modifier_army_sub_unit_category_magic_attack_factor$：§G+5.00%§!\n  - $modifier_army_sub_unit_category_magic_max_org_factor$：§G+5.00%§!"
  GER_Elaina_diplomacy_desc: "§Y伊蕾娜§!\n@GER§Y[FROM.Getname]§!的§C总理§!\n\n§Y$GER_Wandering_Witch$§!\n  - $MODIFIER_SUPPLY_CONSUMPTION_FACTOR$：§G-10.00%§!\n  - $modifier_army_sub_unit_category_magic_attack_factor$：§G+5.00%§!\n  - $modifier_army_sub_unit_category_magic_max_org_factor$：§G+5.00%§!"
  GER_Elaina_desc: "“戴着这枚彰显魔女身份的胸针，披着一头灰色秀发，其美貌与才能散发的光芒，连太阳见了都会不由眯起眼睛的美女，究竟是谁呢？没错，就是我！”\n\n旧共和国的陨落与纳粹的掌权，不死族的入侵，复国战争，而后莉莎遇刺与纳粹倒台。短短十余年间，伊蕾娜与社会民主党经历了无数惊涛骇浪，终迎来民主化的曙光。在随后的总理大选中，凭借反抗暴政积累的崇高声望，以及对底层民众福祉的深切关怀，伊蕾娜成功带领着的新的社会民主党人再一次夺取了新共和国的领导权。\n外有强邻虎视眈眈，内有历史遗留的混乱亟待梳理。这位年轻的领袖在就职典礼上庄严宣誓：誓死捍卫新共和国的主权。若战争无可避免，她与她的政党将为德意志，乃至整个欧罗巴人民的福祉而战。\n\n“§g统一，§R正义，§Y自由！”"

