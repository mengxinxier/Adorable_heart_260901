 #重生之眼
  GER_Eye_of_Rebirth_Project: "重生之眼计划"
  GER_Blood_Summoning_Ritual: "鲜血召唤之仪"
  GER_second_spring_snow_mutation: "第二次春雪异变"
  GER_Slaughter_and_rebirth: "屠戮与新生"
  GER_Blood_colored_cherry_blossoms_on_Red_Square: "红场上的血色樱花"
  GER_Start_the_clock_of_time: "启动时间之钟"
  GER_Eye_of_Rebirth_Project_desc: "这是莉莎复活的希望，也是希尔回归正常的希望，更是陷入疯狂的德意志重回正轨的希望，多项子计划确保可以让莉莎重回现实，但如果没有成功，德意志乃至整个世界都会面临巨大的危机..."
  GER_Blood_Summoning_Ritual_desc: "亚瑟王的2000年统治，已经充分说明了，英灵的强大和圣杯的神奇，只是数千年前的召唤仪式除非亲身经历者，再难考证。不过，亚瑟王本是就是最好的考证手段，只要用一些手段撬开她的嘴，这很简单，不是吗..."
  GER_second_spring_snow_mutation_desc: "春雪异变是幻想乡大地过去的一场灾难，不过灾难的目的，却是我们所需要的，何况“西行妖”下的不朽之尸，也证明着春雪异变的可能，不过是苦一苦幻想乡居民，不值一提的代价罢了..."
  GER_Slaughter_and_rebirth_desc: "这项计划意在仿造“伟大战争”时期的“卡西米尔大屠杀”，大量屠杀下回归的亡魂已经向我们证明了其可行性，只是其准备工作略显困难..."
  GER_Blood_colored_cherry_blossoms_on_Red_Square_desc: "攻下苏联，控制俄罗斯百姓，囚禁库洛牌魔法师，找到时之卡，逼迫木之本樱就范，发动仪式，计划成功，一切是那么完美，一切必将如偿所愿..."
  GER_Start_the_clock_of_time_desc: "这是莉莎复活最后的希望，也是希尔的最后手段，即使这样做会让德意志回归农业时代，也在所不惜，整个重生之眼计划没伤害一个德意志人，莉莎一定会理解我的，一定，一定..."
  GER_All_methods_failed: "所有的计划都§R失败§!了"

 #梅福券
  GER_mefo_bills_category: "梅福券"
  GER_mefo_bills_category_desc: "为了在经济与国库薄弱的情况下投资发展我国扩张的军事工业，我们不得不通过账外实体本票的形式来运作资金。如果不动用政治关系来延长这些本票的期限，那么届时我们将被迫对其进行承兑，且将所赚的红利损失殆尽。"
  GER_mefo_bills_mission: "梅福券到期"
  GER_can_delay_mefo_payment: "可以延迟偿付梅福券。"
  GER_mefo_bills_mission_desc: "我们此前发行的债券就要到期了，必须决定是延期偿付还是即刻兑现。"
  GER_extend_mefo_bills: "梅福券"
  GER_extend_mefo_bills_desc: "延长3个月的梅福券偿付期，使我们可以在这段时间内继续享受其加成。然而，此举同样也会增加我们最终偿付时的花费。"
  GER_extend_mefo_bills_tt: "决定延长§Y梅福券§!或是即刻偿付。\n"
  GER_mefo_bills_Payouts_apply_add_100: "延长6个月的§Y梅福券§!偿付期，在当前批次梅福券到期后进而生效。\n\n每批次的延期花费会逐步提高，当战争爆发时，梅福券的效果将会被移除，而对其的偿付则将推迟到终战和谈之后。\n\n我们需要赔付的国债§R增加£hcp_small 100§!（§L我们目前需要赔付的国债为£hcp_small [?GER_mefo_bills_Payouts_apply]§!）"
  GER_mefo_bills_effect_in_days: "下列情况将在[?Root.days_mission_timeout@GER_mefo_bills_mission|H0]日后发生：\n"
  GER_mefo_bills_extension_timer: "在梅福券到期前。"
  GER_mefo_bills_extension: "自上次梅福券延期后尚不满60日。"
  GER_mefo_bills_extended: "梅福券延期"
  GER_renew_mefos: "再延期梅福券"
  GER_renew_mefos_desc: "帝国银行对于重振我国经济和军事而言至关重要，此前兑付梅福券显然是给错误的决定，我们应当再延长梅福券几个月的支付期限。"
  GER_cancel_mefos: "取消梅福券"
  GER_cancel_mefos_desc: "长期以来，我们十分依赖帝国银行来重建本国军工。是时候和我国的军事制造商们兑现承诺，并结束“梅福券”这个障眼法了。"

