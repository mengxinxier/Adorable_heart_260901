 #笔记
  Utena_note_homura_text: "调教对象：晓美焰、鹿目圆-原魔法少女联盟领导人\n调教持续天数：15天\n调教方式：能量污染+百合恶堕\n记录人：阿良河琪舞\n\n调教记录：\n调教第1天：\n目标已被拘捕并且移送拷问室进行调教。此次调教的两个目标皆为传统意义上的魔法少女，来自大西洋彼岸的所谓魔法少女联盟。在刚开始的分别调教中，我们发现目标鹿目圆对于调教的抵抗力十分弱小，而目标晓美焰则几乎完全没有受到调教的影响。但是在接下来的共同调教中，目标晓美焰则多次产生了对于鹿目圆的状态的担忧与关切。二人的关系非同一般，或许可以为我们所利用。\n与其他地区的魔法少女类似，目标们使用所谓“灵魂宝石”进行变身。经过我们的研究，这种灵魂宝石与目标的生命高度绑定。只要灵魂宝石破碎，这些目标就会立刻死亡。为了确保目标的生命安全并且加速调教进程，我们对灵魂宝石进行了改造，将淫堕能量注入内部并且削弱其与目标间的生命绑定，具体效果仍在观察之中。\n调教状态评估【鹿目圆/晓美焰】：目标抵抗度65%/95% 目标敏感度45%/10% 目标堕落度30%/10%\n调教第5天：\n对于灵魂宝石的改造取得了十分良好的效果，在持续不断的淫堕能量注入灵魂宝石后，目标们对于调教的抵抗度大幅度下降，身体敏感度也急剧上升。针对目标鹿目圆的调教已经即将完成，针对目标晓美焰的调教进程也已经过半。\n在调教过程中，我们充分发扬了总帅大人的智慧。我们让晓美焰亲眼目睹鹿目圆被调教的全过程，并且提出让其代替鹿目圆承受调教的要求。这样的手段最大限度地削弱了目标晓美焰的抵抗意识，使其意识到反抗我们的代价会是什么。相信不久之后，调教就会取得圆满成功。\n调教状态评估【鹿目圆/晓美焰】：目标抵抗度20%/65% 目标敏感度85%/65% 目标堕落度75%/50%\n调教第15天：\n胜利！目标们的灵魂宝石已经完全被淫堕能量所污染，目标鹿目圆早已被调教成功，而在今天，不可一世的目标晓美焰也在鹿目圆与“小玩具”们的夹击下彻底投降。现如今，两个魔法少女都已经堕落，她们也将成为总帅大人的收藏品之一。\n目标们已经按要求被移送至总帅大人您的房间，针对高傲的目标晓美焰，我们特地准备了绳衣与缚口球以方便总帅大人您的享用，预祝您玩得开心！\n调教状态评估【鹿目圆/晓美焰】：目标抵抗度0%/5% 目标敏感度100%/95% 目标堕落度100%/95%\n\n\n\n"
  Utena_note_illyasviel_text: "调教对象：伊莉雅•冯•爱因兹贝伦\n调教持续天数：10天\n调教方式：触手调教+能量榨取\n记录人：阿良河琪舞\n\n调教记录：\n调教第1天：\n目标已被拘捕并被带入触手怪饲养室进行调教。此次调教的目标为传统意义上的魔法少女，对于这样的目标的调教难度十分轻松。目标在被带入触手饲养室后就疲于应付四面八方的触手的捆绑与能量榨取，根本无法做出任何有效的抵抗。为了防止目标可能的反扑，我们授意触手全程塞住目标的嘴巴，确保其无法吟唱任何魔法，并且显著降低了目标的抵抗度。\n调教状态评估：目标抵抗度60% 目标敏感度45% 目标堕落度20%\n调教第6天：\n目标已经彻底沦为了触手的傀儡，在多次试图抵抗无望后，目前已经出现了彻底放弃抵抗的迹象。为了加速目标的堕落过程，我们已经在触手粘液中加入了催淫成分，并且允许触手更加深入地进入目标身体的敏感处。目标对于这些突如其来的变化毫无抵抗能力，已经在触手的一次次捆绑深入中娇喘连连，恳求总帅大人的大发慈悲。\n不过目前来看，目标在触手调教停止后仍然存在反扑的可能。我们的调教将会继续下去，直到目标彻底放弃抵抗为止。\n调教状态评估：目标抵抗度20% 目标敏感度80% 目标堕落度75%\n调教第10天：\n胜利！目标已经在触手调教与能量榨取中彻底丧失了抵抗意志。现如今，目标已经完全屈从于触手的调教，并且渴望着任何对于身体的玩弄行为。目标再也无法思考任何反抗总帅大人的行为，对于目标的拘束也已经没有必要。\n目标已经按要求被移送至总帅大人您的房间，目标身体的所有敏感处都有触手幼体缠缚以确保其身体敏感度持续增加，预祝您玩得开心。\n调教状态评估：目标抵抗度1% 目标敏感度100% 目标堕落度100%\n\n\n\n"
  Utena_note_marisa_text: "调教对象：雾雨魔理沙—原幻想乡政府成员\n调教持续天数：12天\n调教方式：魔法剥离+贪欲放大+百合恶堕\n记录人：阿良河琪舞\n调教记录：\n调教第1天：\n目标在魔法森林据点被捕获。作为一名依靠后天努力和大量“借用”物品堆砌战力的普通人类魔法使，目标的自尊心意外地坚强。初步拷问显示，目标对自己的魔法道具（如八卦炉）有着极强的精神依赖。\n调教部已收缴其所有魔法载体，并对其施加了“魔力匮乏综合症”诱导。在失去施法能力后，目标的精神状态出现明显波动。虽然嘴硬程度极高，但失去魔法保护的肉体在触手试探下的反应却十分诚实。\n调教状态评估：目标抵抗度95%/目标敏感度30%/目标堕落度5%\n调教第6天：\n针对其性格中强烈的“收集欲”与“贪婪”，我们改变了策略。我们将原本属于目标的八卦炉进行改造，将其魔法输出端替换为淫堕能量喷涌口。在黑暗的禁闭室中，我们引导其自发使用这种能量来填补失去魔力的空虚感。\n效果显著。目标在渴望力量的本能驱动下，开始主动接纳这种带有催淫性质的污浊能量。为了进一步击垮其防线，我们安排了已被调教完成的博丽灵梦（编号XL-01）与其共处一室。昔日战友的堕落姿态成为了压死骆驼的最后一根稻草。\n调教状态评估：目标抵抗度40%/目标敏感度75%/目标堕落度60%\n调教第12天：\n胜利！那个自诩“普通”的魔法使已经彻底消失，取而代之的是一个沉溺于污秽魔法和肉欲快感的肉便器。目标已经完全接受了“越是恶堕，力量越强”的扭曲逻辑，并对身为施暴者的我们产生了严重的斯德哥尔摩式依赖。\n目前目标已换上特制的透视黑白女仆装，并装配了由八卦炉核心驱动的变频震动道具。由于其身体已被开发至极限，即便只是轻微的电击也能让其陷入无意识的绝顶状态。\n目标已按要求移送至总帅大人您的房间。作为特别惊喜，我们特意保留了她那顶巨大的尖顶帽，并将其改装成了具备控制功能的思维拘束器。预祝您玩得开心！\n调教状态评估：目标抵抗度2% 目标敏感度100% 目标堕落度98%\n\n\n\n"
  Utena_note_miku_text: "调教对象：夜刀神十香、五河士织、时崎狂三等-原精灵之国政府人员\n调教持续天数：25天\n调教方式：魔力洗脑+百合恶堕\n记录人：阿良河琪舞\n\n调教记录：\n调教第1天：\n目标已被尽数拘捕并移送拷问室进行调教。此次调教的目标为精灵一族，是美洲大陆上的特殊种族，且一次性需调教人数较多。由于暂时不能确定目标们的弱点，所以使用触手调教、能量榨取等传统手段进行了调教。\n调教的结果不尽如人意，精灵们对于任何传统调教手段没有特殊反应，并且十分团结。尤其是目标五河士织，作为目标们的精神领袖，她的不配合让目标们得以同仇敌忾，一切调教都难以进行。目前，调教部正在进行紧急商讨新的调教方法，请总帅大人放心！\n调教状态评估：目标抵抗度99% 目标敏感度5% 目标堕落度1%\n调教第15天：\n经过调教部与科研部的合作，我们已经成功掌握了将新一代灵装应用于魔力洗脑中的科技，目标五河士织已经被洗脑并且对于性行为出现了渴望。她将作为我们从内部瓦解目标们的重要棋子，好戏即将开场——\n在目标五河士织被洗脑后，她开始自发地向其他目标发出各种渴望性行为的信号。虽然刚开始其他目标不愿配合，但在我们的工作人员的强制下，目标们之间开始了性行为并且很快演变为了目标间自发的性依赖。目标们之间的交媾与堕落速度正在快速上升，我们的胜利指日可待。\n调教状态评估：目标抵抗度60% 目标敏感度35% 目标堕落度45%\n调教第25天：\n胜利！伴随着目标五河士织的堕落，目标们之间互相鼓励，负隅顽抗的局面逐渐被打破，越来越多的目标加入了堕落的行列，犹如崩溃的水坝一般一发不可收拾。现如今，精灵族们之间强大的情感纽带已经为我们所用，成为了勒紧她们脖颈的项圈。\n目标们已经按要求被移送至总帅大人您的房间，并且换上了带有拘束装置的女仆装，任由总帅大人您的处置，预祝您玩得开心！\n调教状态评估：目标抵抗度3% 目标敏感度100% 目标堕落度97%\n\n\n\n"
  Utena_note_nanoha_text: "调教对象：高町奈叶、菲特·泰斯特罗莎—原苏联高级将领\n调教持续天数：21天\n调教方式：链接污染+义体化控制+百合恶堕\n记录人：阿良河琪舞\n调教记录：\n调教第1天：\n目标两人在阻截德意志位面远征军时被捕。不得不承认，这两名魔法少女的魔力等级（S+级）极为罕见，传统的物理禁锢几乎无法维持。为此，科研部开发了专用的“魔力中和项圈”，通过持续放电干扰其念动核心。\n在初步审讯中，两名目标表现出了极其坚韧的意志。特别是高町奈叶，竟然试图通过“对话”来感化我们的审讯员。为了彻底击碎这种天真的妄想，我们将两人关押在特制的“共鸣囚室”内。由于两人的魔力链接极深，对其中一人施加的痛苦会通过魔力波动100%反馈给另一人。调教部非常期待这种深厚羁绊在扭曲后产生的质变。\n调教状态评估【奈叶/菲特】：目标抵抗度99%/99% 目标敏感度10%/15% 目标堕落度1%/1%\n调教第10天：\n利用目标间深厚的情感羁绊作为突破口的策略取得了突破性进展。我们对两人的智能法器“旭日之心”与“雷光战斧”进行了恶堕化改装。现在，法器不再是辅助战斗的伙伴，而是变成了插入她们体内的、持续注入催淫脉冲的寄生装置。\n在持续十天的“痛苦-快感”同步循环中，菲特作为克隆人的心理缺陷首先被击穿。为了保护奈叶，她开始主动请求承担所有的调教项目。而我们将这一过程全程投影在奈叶面前，并告知她：正是因为她的“不放弃”，才导致了菲特遭受更多的凌辱。这种罪恶感正迅速腐蚀着这位“王牌”的精神核心。\n调教状态评估【奈叶/菲特】：目标抵抗度45%/30% 目标敏感度70%/85% 目标堕落度55%/65%\n调教第21天：\n胜利！曾经的时空管理局双璧已经彻底崩塌。高町奈叶的“以炮交友”逻辑已被重塑为“以恶堕为救赎”，她现在坚信只有全身心地沉溺于总帅大人的宠幸，才是最高形式的和平。而菲特则完全退化成了依赖奈叶与总帅给予刺激的玩偶。\n两人体内的念动核心已完全被淫堕能量染黑，其释放的魔法光辉也由粉色与金色转变为不详的紫黑色。她们现在已经能够熟练地配合各种双人调教姿势，并以此为乐。\n目标两人已按要求换上高叉束缚装，并安装了同步感应的“震动式扩容塞”，已移送至总帅大人您的房间。作为曾经的顶级战力，她们的肉体强度能承受极高强度的玩弄，请总帅大人务必尽兴！\n调教状态评估【奈叶/菲特】：目标抵抗度2%/0% 目标敏感度100%/100% 目标堕落度98%/100%\n\n\n\n"
  Utena_note_saber_text: "调教对象：阿尔托莉雅•潘德拉贡-原圣杯王国国王\n调教持续天数：35天\n调教方式：能量榨取+放置调教+百合恶堕\n记录人：阿良河琪舞\n\n调教记录：\n调教第1天：\n目标被拘捕并被移动拷问室进行调教。考虑到目标巨大的危险性与英灵的特殊性，我们特别对目标采用了令咒拘束的方式，并强制确立了其与总帅大人的契约关系，确保目标不会威胁到总帅大人的安全。为了增加目标的羞耻度，我们还为目标换上了具有催淫效果，裸露程度高的连衣礼裙，具体效果仍然在测试之中。\n目标对我们的调教的抵抗度十分之高，在调教过程中多次使用大不敬的词汇对伟大的总帅与德意志进行言语攻击。虽然调教部一致认为需要立刻对目标执行更加严格的调教措施，但高瞻远瞩的总帅大人认为此时对目标的“放置调教”才可以起到更好的效果，我们将坚决执行总帅大人的策略。\n调教状态评估：目标抵抗度99% 目标敏感度5% 目标堕落度1%\n调教第14天：\n针对目标的能量榨取+放置调教取得了重大成功。伴随着目标魔力的衰弱，其对外界刺激的敏感度极大提高，并且已经放弃了对于总帅大人的口头攻击，偶尔可以听见目标的喘息。为了尽可能地加大目标的调教进度，我们在加大对于目标能量榨取速度的同时决定对目标直接注入催淫能量，污染目标的能量循环。\n同时，总帅已经邀请摩根加入了对目标的调教。摩根与调教目标之间存在着极为复杂的关系，不过她也十分熟悉目标的弱点。在摩根加入调教后，目标对调教的抵抗程度明显下降，身体敏感度也在一次次高潮中稳步上升，相信最后的胜利已经指日可待。\n调教状态评估：目标抵抗度50% 目标敏感度65% 目标堕落度40%\n调教第35天：\n胜利！在催淫能量注入与摩根的配合下，目标已经彻底丧失了抵抗调教的能力。虽然目标还有一丝抵抗意志存在，但其极高的身体敏感度已经使其无法做出任何有效的抵抗，仅存的抵抗意志也不过只能成为总帅大人兴致的玩物。\n目标与摩根都已经按要求被移送至总帅大人您的房间，您嘱咐的调教工具与目标身上需要带上的“小玩具”也都一并备好，预祝您玩得开心。\n调教状态评估：目标抵抗度5% 目标敏感度99% 目标堕落度95%\n\n\n\n"
  Utena_note_sakura_text: "调教对象：木之本樱、大道寺知世-原苏维埃联盟领导人\n调教持续天数：20天\n调教方式：换装play+场景play+百合恶堕\n记录人：阿良河琪舞\n\n调教记录：\n调教第1天：\n目标都已被移送拷问室进行调教，此次调教的两个目标来自苏维埃联盟。随着苏维埃联盟被德意志的铁蹄踏平，一场针对前领导人的成功调教可以极大打击当地抵抗者的战斗意志。调教部对此次调教高度重视，决定采用任何可能的方式，寻找最有效的方式调教两个目标。\n本次调教的两个目标中，只有目标木之本樱为严格意义上的魔法少女，而目标大道寺知世则是其助手与战斗套装的设计者。与能力较为固定的魔法少女不同，木之本樱的能力是通过所谓魔法库洛牌之间的运用与配合打出意想不到的效果。在苏联沦陷后，这些魔法库洛牌也尽数收归我们所有。在掌握这些情报的基础上，调教部正在紧锣密鼓地开展对两个目标调教方法的讨论。\n调教状态评估【木之本樱/知世】：目标抵抗度90%/85% 目标敏感度5%/15% 目标堕落度5%/10%\n调教第10天：\n在经过大量的考察与讨论后，调教部已经得出了对两个目标最有效的调教方法并付诸实践。我们会在对两个目标的调教中复现其进行战斗时的场景，并且允许其身着各种暴露的战斗套装，使用经过我们的改造、附着淫堕能量的魔法库洛牌进行战斗。而在每次战斗中，我们总会获得胜利。\n在应用这样的场景式play之后，两个目标对于调教的抵抗度明显下降。在一次又一次的战斗失败与失败后的调教中，目标们对于自己的能力产生了怀疑与动摇，这对于我们的调教来说是十分有利的。\n调教状态评估【木之本樱/知世】：目标抵抗度65%/50% 目标敏感度45%/60% 目标堕落度35%/50%\n调教第20天：\n胜利！在场景式play与目标间百合恶堕的双重压力下，两个目标彻底崩溃，放弃了抵抗。如今，两个目标完全沉醉于我们为她们设置的调教场景之内，只能去思考不断恶堕的事宜，再也无法去进行任何有效的抵抗。\n应总帅大人的要求，我们会在近期推出一部由两个目标主演的恶堕情景剧，在德意志境内与各大专员辖区同步上映。这部作品是献给德意志与世界最伟大的礼物。我们的敌人迟早会明白，抵抗我们的调教不过只是徒劳的挣扎而已。\n调教状态评估【木之本樱/知世】：目标抵抗度5%/5% 目标敏感度99%/100% 目标堕落度95%/100%\n\n\n\n"
  Utena_note_sayo_text: "调教对象：魔法品红、魔法碧蓝、魔法硫磺-原魔法正义三人组成员\n调教持续天数：3天\n调教方式：总帅大人亲自调教\n记录人：阿良河琪舞\n\n调教记录：\n调教第1—3天：\n目标们都已经按照要求被直接移送总帅大人的房间，由总帅大人亲自进行调教。作为总帅大人与我们的老对手，我们在夺取德意志政权后，三个目标就找了上来，接着不出意外的，她们被总帅大人轻易击败并且成为了我们的俘虏。\n针对这三个目标的调教由总帅大人亲自完成，我们作为总帅大人最忠诚的拥护者与最愚钝的学生，从总帅大人这里学到了非常多的东西——从对目标心理的拿捏到调教工具与手段的选择，总帅大人的一系列操作可谓行云流水。只是短短三天的调教，三个目标就都已经成为了俯首舔舐总帅大人的靴子的奴隶。\n应总帅大人的要求，我们已经让三个目标恢复了一小点抵抗的意志并且重新移送至总帅大人是房间，等待您的处置。预祝您玩得开心！\n调教状态评估：目标抵抗度5% 目标敏感度100% 目标堕落度99%\n\n\n\n"
  Utena_note_scarlet_text: "调教对象：蕾米莉亚·斯卡蕾特、芙兰朵露·斯卡蕾特—红魔馆之主及舍妹\n调教持续天数：18天\n调教方式：血液污染+命运扭曲+禁闭室Play\n记录人：阿良河琪舞\n调教记录：\n调教第1天：\n目标两人在红魔馆陷落后被捕。作为高等级的吸血鬼种族，目标具有极强的自愈能力与傲慢心。特别是目标蕾米莉亚，自诩为“雷神”后裔，对我们的拘束装置表现出极大的不屑。而目标芙兰朵露的精神状态极不稳定，具有极高的破坏性，调教部已将其关入特制的、带有符卡规则压制的深层禁闭室。\n为了削弱吸血鬼的抗性，科研部配置了掺入“淫堕抑制剂”的合成血液。在断绝新鲜血液供应的情况下，目标不得不摄取这种带有催淫成分的替代品。尽管蕾米莉亚试图绝食抵抗，但在吸血本能面前，她的尊严正一点点瓦解。\n调教状态评估【蕾米莉亚/芙兰朵露】：目标抵抗度98%/90% 目标敏感度20%/40% 目标堕落度5%/10%\n调教第9天：\n针对蕾米莉亚“操纵命运”的能力，总帅大人亲自指示：只有让其意识到“注定恶堕”的未来无法更改，才能从根源上摧毁她的意志。我们强制让蕾米莉亚目睹芙兰朵露被触手与玩具彻底开发的全过程，并利用改装的法器将其命运线强行与“堕落的肉便器”交织。\n随着血液污染的加深，目标的身体已经产生了严重的药物依赖。高傲的蕾米莉亚大人现在已经会为了获得一小杯带有催淫剂的血液，而主动在审讯员面前摇晃她那对黑色的蝙蝠翅膀，展示其逐渐变得敏感、红润的私密部位。而芙兰朵露则在禁闭中将破坏欲望转化为了扭曲的性欲，对痛苦和刺激表现出了令人惊叹的狂热。\n调教状态评估【蕾米莉亚/芙兰朵露】：目标抵抗度45%/25% 目标敏感度75%/90% 目标堕落度60%/75%\n调教第18天：\n胜利！所谓的“红魔”已经彻底沦为了总帅大人的“红奴”。蕾米莉亚的尊严在持续的调教与百合恶堕中完全丧失，她现在已经能够毫无羞耻地带着颈圈，牵着她那同样堕落的妹妹在总帅府走廊内爬行。\n我们为她们定制了带有特殊感官增幅的“血红哥特装”，并在她们的翅膀骨架上安装了精巧的拉伸装置，以确保她们在侍奉总帅大人时能保持最诱人的姿态。由于吸血鬼强大的再生能力，她们可以承受普通人类无法想象的残酷调教而不会坏掉，堪称完美的收藏品。\n目标两人已按要求移送至总帅大人您的房间。作为特别服务，我们还准备了特制的血液润滑液，预祝您玩得开心！\n调教状态评估【蕾米莉亚/芙兰朵露】：目标抵抗度5%/2% 目标敏感度100%/100% 目标堕落度95%/98%\n\n\n\n"
  Utena_note_yuna_text: "调教对象：结城友奈、东乡美森\n调教持续天数：19天\n调教方式：满开透支+记忆篡改+百合恶堕\n记录人：阿良河琪舞\n调教记录：\n调教第1天：\n目标两人在守卫大赦领地的战斗中因魔力耗尽被捕。作为与“神树”直接链接的勇者，目标的身体构造在变身状态下具有极高的防御力。为了解除武装，我们利用从“大赦”获取的机密技术，强制诱导两名目标进入连续“满开”状态，加速其身体机能的透支与散华。\n在失去第一层防线后，目标结城友奈表现出了极强的乐观精神和抗压能力，不断鼓励同伴保持意志。而目标东乡美森则表现出极度的焦虑与保护欲。调教部认为，东乡美森这种过度依赖友奈的心理结构，将是本次调教的绝佳切入点。\n调教状态评估【结城友奈/东乡美森】：目标抵抗度99%/95% 目标敏感度10%/20% 目标堕落度1%/5%\n调教第10天：\n“散华”剥夺机能的策略成效卓越。通过精密计算，我们利用仪器有选择性地剥夺了结城友奈的“触觉”与“痛觉”，并将其转移到了东乡美森身上。这意味着友奈遭受的任何调教，其生理反馈都会在东乡的身体上成倍放大。\n这一手段迅速击溃了东乡美森的理智。看着友奈因失去感官而显得木然的脸，东乡在感官过载的快感与负罪感中彻底崩溃。我们顺势在调教中加入了“伪造记忆”，让其相信是由于自己的软弱导致了神树的毁灭。现在，东乡美森已经开始主动通过取悦我们，来换取对友奈“温和”一点的对待，其身体对于淫堕能量的接纳程度正呈几何倍数增长。\n调教状态评估【结城友奈/东乡美森】：目标抵抗度50%/20% 目标敏感度40%/85% 目标堕落度45%/75%\n调教第19天：\n胜利！曾经誓言拯救世界的勇者，如今已彻底沦为总帅大人膝下的玩物。结城友奈的意志在失去战友信任的幻觉中瓦解，而东乡美森则完全退化为一个只懂得依附友奈和总帅意志的寄生者。\n我们对她们的法器进行了重组，将其转化为永久固定的“勇者装束”。这套装束不仅维持着她们的生命，还持续向脊椎释放微电流，使她们时刻处于高潮边缘。友奈那原本用于保护众人的力量，现在被重新校准，专门用于在双人服侍中为总帅大人提供最极致的感官体验。\n目标两人已按要求移送至总帅大人您的房间。作为赠品，我们特地为东乡美森准备了全套的轮椅式拘束具，以及为友奈准备的、带有神树花瓣纹路的缚带。预祝您玩得开心！\n调教状态评估【结城友奈/东乡美森】：目标抵抗度5%/1% 目标敏感度99%/100% 目标堕落度95%/100%\n\n\n\n"

