  GER_total_war_law: "总体战"
  GER_total_war_law_desc: "总体战争理论的首创者之一是德国的希尔。她在1929年德国纳粹党的代表大会上提出了“总体战”的基本原则。德国军事思想家鲁登道夫在《总体战》一书中，全面阐述了总体战争的理论和原则。"

  GER_blitzkrieg_state_modifier: "闪电战"
  GER_blitzkrieg_state_modifier_desc: "德国专注于通过速度和突袭来压制敌人的快速决定性战术，这将重新定义现代战争。装甲部队将粉碎任何反抗力量，确保迅速胜利。虽然“闪电战”这个词被新闻媒体过度简化，但它很好地描述了德国军队的速度。"

