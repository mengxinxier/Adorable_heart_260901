  AUS_Deal_with_KPD: "处理德国共产党"
  AUS_Deal_with_KPD_desc: ""
  AUS_In_depth_cooperation_with_KPD: "与德国共产党深入合作"
  AUS_In_depth_cooperation_with_KPD_desc: ""
  AUS_Eliminate_the_Red_Bandits: "消灭赤匪"
  AUS_Eliminate_the_Red_Bandits_desc: ""
  AUS_Dealing_with_liberals: "处理自由派"
  AUS_Dealing_with_liberals_desc: ""
  AUS_In_depth_cooperation_with_liberals: "与自由派深入合作"
  AUS_In_depth_cooperation_with_liberals_desc: ""
  AUS_Eliminate_the_liberals: "消灭自由派"
  AUS_Eliminate_the_liberals_desc: ""
  AUS_Handle_internal_party_affairs: "处理党内事务"
  AUS_Handle_internal_party_affairs_desc: ""
  AUS_Expand_political_propaganda: "扩大政治宣传"
  AUS_Expand_political_propaganda_desc: "随着我们的失败，国内对政府不信任的声音逐渐增长，我们必须要扭转这种局面！"
  AUS_Expand_political_propaganda_01: "启用政治宣传部门"
  AUS_Expand_Gestapo: "扩大盖世太保"
  AUS_Expand_Gestapo_desc: "曾经盖世太保的任务就是针对境外势力对国民的渗透，只是后来受到不死族的入侵而停止了活动。而当社会再次混乱起来时，我们就有必要重建它了。"
  AUS_Expand_Stormtroopers: "扩大冲锋队"
  AUS_Expand_Stormtroopers_desc: "旧冲锋队主要用于保护莉莎的个人安全，现如今莉莎已经成为全国人民爱戴的元首了，是时候对冲锋队进行重组发挥新的作用了。"
  AUS_Night_of_Long_Knife: "§R长刀之夜§!"
  AUS_Night_of_Long_Knife_desc: "莉莎在稳固了她在党内和国内的地位之后认为是时候发动一场针对反动派的大清洗了。"
  AUS_country_of_Fuhrer: "元首之国"
  AUS_country_of_Fuhrer_desc: "在一系列雷厉风行的措施后，莉莎已然成为了奥地利最具有权势的人。毫不夸张的说莉莎就是奥地利，奥地利就是莉莎。"
  AUS_Patriotic_propaganda: "爱国主义宣传"
  AUS_Patriotic_propaganda_desc: "打击失败主义的第一步，就是宣传爱国主义。\n通过报纸，广播和教科书我们可以将爱国主义深入社会中的方方面面中，“没有祖国，你什么都不是”——戈培尔。"
  AUS_Crush_defeatism: "粉碎失败主义"
  AUS_Crush_defeatism_desc: "自从那次惨痛的失败以后，社会上一直只带有失败主义的呼声，但随着莉莎元首领导的奥地利逐步复兴，我们再也容不得你们这些抱着失败主义想法的渣滓了。"
  AUS_Germany_Plan: "德意志计划"
  AUS_Germany_Plan_desc: "反攻德意志一直是我们的昭昭天命，现在凭借帝国的复兴我们是时候宣称我们的天命了！"
  AUS_Germany_Plan_01: "§R我们需要开始计划返回德意志了§!\n\n我们会获取全德意志的核心并解锁德意志归来的决议"
  AUS_Integrate_wartime_economy: "整合战时经济"
  AUS_Integrate_wartime_economy_desc: "为了保证奥地利战争机器持续性的高效运转，我们不得不整合全国资源，实行战时经济。为了祖国的复兴，这样的牺牲是必要的。"
  AUS_Border_fortification: "边境要塞化"
  AUS_Border_fortification_desc: "随着帝国的再次崛起，我们与魔导国的矛盾也愈演愈烈。现在有必要将边境要塞化了。"
  AUS_Anti_aircraft_fire: "防空火力"
  AUS_Anti_aircraft_fire_desc: "敌人的轰炸机的轰炸对我们的人民和工业危害极大，但好在我们可以通过提升防空火力来应对。"
  AUS_More_airports: "更多机场"
  AUS_More_airports_desc: "建设更多的机场将有助于提升我们的空军实力。死亡自天空而降。"
  AUS_Germany_is_ready: "§R德意志已经准备好了！§!"
  AUS_Germany_is_ready_desc: "经过多年的韬光养晦，奥地利终于完成了工业的复兴和军队的重生，现在奥地利已经准备好了，准备好拿回她失去的一切，准备好再一次踏入世界舞台！"
  AUS_IS_READY: "§R德意志已经准备好了！§!"

 ## 奥地利阶段陆军及工业线
  AUS_National_syndicalism: "国家工团主义"
  AUS_National_syndicalism_desc: "通过政府的宏观调控和市场的自我调节能力，我们将实行一种新的适合奥地利经济发展状况的新经济体制。"
  AUS_Four_year_plan: "新四年计划"
  AUS_Four_year_plan_desc: "在这接下来的4年里，我们将让奥地利的工业以史无前例的姿态崛起。当然这需要建立在科学模型上的4年计划依靠政府主导的方式推动奥地利的生产再投资来实现。"
  AUS_Imperial_Highway: "帝国高速公路"
  AUS_Imperial_Highway_desc: "通过投资高速公路这个新兴事物，我们可以将整个帝国连起来，促进全国各地经济的协调发展。"
  AUS_Large_space_economy: "大空间经济"
  AUS_Large_space_economy_desc: "奥地利地处欧洲之中未来必将成为欧洲的核心，我们将借助这个优势联通各地建立大空间经济，只有拥有了欧洲大陆范围的“大空间经济”，奥地利才能在未来对抗长期的海上封锁。"
  AUS_Relaunch_Vienna_Institute: "重启维也纳研究所"
  AUS_Relaunch_Vienna_Institute_desc: "维也纳是世界著名的艺术之都，也是欧洲的文化之都，这是一个发展科学的极大优势。我们将凭借这个优势与维也纳大学进行合作重启维也纳研究所。"
  AUS_Eliminate_Jewish_capitalism: "消灭犹太资本主义"
  AUS_Eliminate_Jewish_capitalism_desc: "一直以来帝国都在出于人道主义精神为可怜的犹太人提供风雨中的避风港，但换来的是什么？是犹太人对帝国经济的掌控，对国民精神的腐化，而犹太资本的每一个毛孔都流着需国工人的鲜血。现在德意志的民族精神已然崛起，我们绝不允许犹太人再像以前那样压迫人民了！"
  AUS_Confiscate_aristocratic_property: "收缴贵族财产"
  AUS_Confiscate_aristocratic_property_desc: "一直以来奥地利的容克贵族就高高在上，她们垄断军队，享受着父辈留下的遗产却不为奥地利付出一点，是帝国的蛀虫。现在我们不能再让这些蛀虫再啃食国家的血肉了是时候让她们为奥地利的复兴履行作为一个贵族应有的义务。"
  AUS_German_Labor_Culture: "德意志劳工文化"
  AUS_German_Labor_Culture_desc: "从帝国衰落到再次复兴，两种完全相反的境遇催生了德意志人不屈不挠，艰苦奋斗的劳工精神文化。而这就是我们能够实现“多瑙河奇迹”的重要原因。"
  AUS_Hermann_Meyer_Plant: "赫尔曼·迈耶工厂"
  AUS_Hermann_Meyer_Plant_desc: "赫尔曼迈耶是奥地利军队体系里举足轻重的新权贵，同时也是我们党内重要的一支力量。我们将采取她迈耶经济学的建议，通过与赫尔曼迈耶这位新权贵来与其身后的军队合作加强奥地利的军事工业建设，并以“赫尔曼迈耶”命名。"
  AUS_Mining_development: "矿业开发"
  AUS_Mining_development_desc: "一直以来我们的矿石资源由于本土产量少所以大多依靠海外进口，但其实多瑙河的地下就蕴含着丰富的矿产资源只是受制于个体企业的技术和能力原因未能大规模开采，我们将通过政治手段将奥地利的矿业企业联合起来来扭转这一局面推动奥地利的本土矿业开发。"
  AUS_Promote_mechanization_of_agriculture: "推动农业机械化"
  AUS_Promote_mechanization_of_agriculture_desc: "过去我们的农业生产一直停留在人力阶段仅有极少数从外国引进的拖拉机，这样既费力又落后。如果在未来奥地利想要养活更多的人那么推动农业机械化就势在必行，而在奥地利工业振兴的背景下我们完全有能力实现这个目标。"
  AUS_Protecting_farmers: "保护农民"
  AUS_Protecting_farmers_desc: "农民是我们这个国家的重要组成部分，同时农民一直是国防军的主要兵源之一，但农民个体在遇到重大危险面前也是极为脆弱的，而通过相关法律我们可以为农民提供保护让她们足以度过难关，如果我们连农民都无法保护又何谈国家呢？"
  AUS_industrial_marvel_of_Danube: "多瑙河工业奇迹"
  AUS_industrial_marvel_of_Danube_desc: "当现代经济学家提起20世纪最不可思议的经济奇迹的话，那一定就是奥地利了，经过多年的工业建设我们完成了这项人类史上几乎不可能完成的壮举，成功地让奥地利的工业不可思议的崛起。后世经济学家们再次形容几乎不可思议的经济奇迹的时候她们一定会以“多瑙河奇迹”来形容，而我们的后辈将为我们感到骄傲。"
  AUS_Reorganizate_the_Wehrmacht: "重组国防军"
  AUS_Reorganizate_the_Wehrmacht_desc: "在1933年的那场灾难性的毁灭发生后，不死族一夜之间占据了除奥地利以外的绝大部分德国领土。而国防军在边对抗不死族的同时边掩护我们退守到奥地利，感谢国防军的贡献如果不是她们也不会有今天的奥地利政府，荣誉属于她们。但同时我们也要看到那场战争几乎要毁灭了国防军，如果我们想要通过战争实现我们的雄心勃勃的德意志计划，我们就要重组国防军，巩固她作为德意志民族剑与盾的地位。"
  AUS_Deutsche_United_production_line: "德意志联合生产线"
  AUS_Deutsche_United_production_line_desc: "战争的风暴正在凝聚，我们需要做好一切准备，武器的储备是重中之重。全德意志的生产单位将会联合起来，共同为了不久以后的大战而努力。"
  AUS_Information_on_Hesse: "黑森峰的资料"
  AUS_Information_on_Hesse_desc: "黑森峰是世界上最杰出的装甲学院之一，凭借她们的资料，我们有望组建出一支世界上最先进的装甲部队。"
  AUS_Information_on_Hesse_TT: "启用§C黑森峰女子学园战车部§!装甲制造商"
  AUS_Research_on_new_types_of_armor: "新型装甲研究"
  AUS_Research_on_new_types_of_armor_desc: "尽管有了黑森峰的装甲研究，但我们在面对天外来客的魔导国科技时仍有一些不够看。元首现在决定在黑森峰研究的基础上进行新型装甲研究来改变这一局面。"
  AUS_true_German_style_battle_lane: "真正的德式战车道"
  AUS_true_German_style_battle_lane_desc: "什么是真正的德式战车道？强大和先进就是真正的德式战车道。"
  AUS_Joy_is_power_brand_car: "“欢乐就是力量”牌汽车"
  AUS_Joy_is_power_brand_car_desc: "欢乐就是力量，而我们承诺让每一位国民都能开上“欢乐就是力量”牌汽车，同时这也将提升我们的军用车辆制造水平。"
  AUS_Large_scale_mechanization: "机械化战术"
  AUS_Large_scale_mechanization_desc: "让军队大规模机械化是奥地利军事现代化中的重要部分，这能显著增加军队的战斗力和军事水平."
  AUS_motorisation_effort: "重视机械化"
  AUS_motorisation_effort_desc: "内燃机曾经对民用部门来说是一个新奇的事物，用于战争效率太低了。但现在它是可靠和强大的，军事应用不容可忽视。"
  AUS_subsidize_steyr_werke_arms: "补助斯太尔武器"
  AUS_subsidize_steyr_werke_arms_desc: "斯太尔（Steyre-Werke）武器是斯太尔-曼利夏（Steyr Mannlicher）武器公司的品牌。她们已从圣日耳曼条约中恢复得很好，但政府可以提供进一步援助，以国家名义保障其生产线。"
  GER_Utena_institute: "舞缇娜研究所"
  GER_Utena_institute_desc: "之前一直忙于常规陆军的研究，而现在我们处于困境之中，就必须开始考虑一些非常规手段，不如人类现有接触的魔法。\n我们可以给我们的首席大魔导师舞缇娜拨一笔款，让她去建设一个专业的魔法研究所。"
  AUS_SS_Special_Operations_Troops: "生命之泉计划"
  AUS_SS_Special_Operations_Troops_desc: "生命之泉计划将会安排未婚妇女匿名生育，并将这些孩子由“种族纯洁健康”的父母领养，这些孩子大多被送至党卫队成员的家庭中。生命之泉亦会对部分成员家庭提供福利支持。\n之后再通过魔法、肉体改造、注射药物等方式筛选出能力远超于常人的“雅利安超人”。"
  AUS_fund_the_gebirgsjaeger_programme: "资助山地步兵计划"
  AUS_fund_the_gebirgsjaeger_programme_desc: "我们的土地是多山的，我们必须适应大自然赐予我们的东西。任何攻击我们国土的人都会发现我们的部队装备精良，能够利用地形对付她们。"
  AUS_steyr_mannlicher_arms: "斯太尔-曼利夏武器"
  AUS_steyr_mannlicher_arms_desc: "斯太尔-曼利夏（Steyr Mannlicher）作为一家公司，一直是爱国和忠于德意志的生活方式。她们的坚定支持使我们的裁军成为可能。我们没有理由不让她们成为正规的军事承包商。"
  AUS_steyr_mannlicher_arms_tt: "解锁材料设计 "
  AUS_great_guns_of_yore: "改进一战火炮"
  AUS_great_guns_of_yore_desc: "火炮赢得了最近一场战争，没有理由不相信它有助于赢得下一场战争。对旧技术的改进仍在进行。"
  AUS_Special_grant_for_army: "军队特别补助金"
  AUS_Special_grant_for_army_desc: "年轻的小伙子们在战场上冲锋陷阵，沐浴荣光的同时也在承受着巨大的痛苦，战争的残酷几乎让她们一无所有，我们应该通过发放特别补助金的方式来回报这些为祖国奉献一切的人。"
  AUS_Served_in_Germany: "为德意志服役"
  AUS_Served_in_Germany_desc: "德意志雄鹰从祖国的上空呼啸而过产生的声响，就是祖国父亲向我们的召唤。去服役吧，为亲人服役，为祖国服役，为德意志民族服役！"
  AUS_Military_Theory_Studies: "军事理论研究"
  AUS_Military_Theory_Studies_desc: "堑壕战曾经是世界上使用范围最广的战术，但那是一个以步枪和火炮为主的战场。今非昔比飞机，坦克，装甲车等新的战争机器才是现代军事的未来，如果我们想要发挥这些战争机器的最大能力我们就必须在军事理论上做出突破。"
  AUS_Awarded_Iron_Cross: "颁发铁十字勋章"
  AUS_Awarded_Iron_Cross_desc: "铁十字勋章代表了帝国对个人军事贡献的认可，也是国家荣耀的象征。我们将对那些在战场上有杰出贡献的英雄人物或集体颁发铁十字勋章来嘉奖。"
  AUS_subsidize_kapsch: "补助卡普施公司"
  AUS_subsidize_kapsch_desc: "卡普施公司曾与德国政府签署在电子和精细工程方面获利的合同。我们应该通过一定的续约来回报这样一家公司的爱国主义和忠诚。"
  AUS_fund_the_vienna_college_of_technology: "资助维也纳技术学院"
  AUS_fund_the_vienna_college_of_technology_desc: "一百多年来，维也纳技术学院一直致力于帮助我们跟上其她国家的技术进步，帮助我们最优秀的人才发挥出最好的作用。在这个黑暗时代，她们的援助将是至关重要的。"

 ## 奥地利阶段空军线
  AUS_construct_the_tullnerfeld_airbase: "建造图尔恩空军基地"
  AUS_construct_the_tullnerfeld_airbase_desc: "在很长一段时间内，在图尔恩建造一个空军基地的计划一直被尘封。战争正在向北方推进，没有什么时候比现在更适合对这些计划采取行动了。"
  AUS_announce_the_new_austrian_air_force: "宣布成立新空军"
  AUS_announce_the_new_austrian_air_force_desc: "自一战以来，比空中还重的飞行一直是未来令人着迷的新型潜在武器。我们不能落后于其她国家，多年来我们一直秘密构建自己的空军，现在我们准备宣布它的成立。"
  AUS_german_aeronautic_cooperation: "自主航空研究"
  AUS_german_aeronautic_cooperation_desc: "我们要进行自主航空研究。"
  AUS_british_aeronautic_cooperation: "圣杯王国航空合作"
  AUS_british_aeronautic_cooperation_desc: "圣杯王国是一个渴望在中欧获得朋友的国家，我们需要她们的技术专长。她们的空军是目前世界上最强的一个，我们可以通过损失一点小小的内部影响力，来分享她们的技术，"
  AUS_british_aeronautic_cooperation_tt: "允许圣杯王国飞机特殊衍生型的设计。\n"
  AUS_soviet_aeronautic_cooperation: "苏联航空合作"
  AUS_soviet_aeronautic_cooperation_desc: "苏联一直在寻求在整个欧洲范围内扩大自己的影响力，我们可与她们交易空军的现代化。有了政治上的支持，我们就可以获得她们的工业专长。"
  AUS_soviet_aeronautic_cooperation_tt: "允许苏联飞机特殊衍生型的设计。\n"
  AUS_innsbruck_airbase_project: "因斯布鲁克空军基地项目"
  AUS_innsbruck_airbase_project_desc: "因斯布鲁克机场位于一个大山谷，是投放战斗机和民用机的理想选择。将其转换为军用机场可以让它更加适合我们的需求。"
  AUS_innsbruck_airbase_project_tt: "在因斯布鲁克添加 §Y2 陆上要塞§! "
  AUS_protect_our_skies: "保护我们的天空"
  AUS_protect_our_skies_desc: "飞行本身曾经是一个新奇，但飞机已经改变这一切，空战也是如此。我们不能忽视来自天空的威胁，我们必须做好相应的准备。"
  AUS_protect_our_skies_tt: "在我们扩展的领土添加 §Y2 防空火炮§!"
  AUS_fortify_our_airfields: "驻防我们的机场"
  AUS_fortify_our_airfields_desc: "我们的任何一个空军基地都不在我们的边界内，我们不能排除有针对性的攻击并占领一个或其她机场的可能性。强化她们的防御工事将减少这种风险。"
  AUS_fortify_our_airfields_tt: "在奥地利机场添加 §Y2 陆上要塞§! "
  AUS_investigate_jet_technology: "研究喷气技术"
  AUS_investigate_jet_technology_desc: "我们的工程部门有一个关于喷气涡轮发动机的新理论，可以生产比以往飞行速度更快，更高和更远的飞机。如果我们能研究的机型可以产生战术优势，我们将采用这种机型。"
  AUS_experimental_bomber_programme: "实验轰炸机计划"
  AUS_experimental_bomber_programme_desc: "已经为下一代轰炸机工艺制定了理论设计，这将让我们在我可预见的战争中获得一个优势。我们只需要分配资金进行原型设计，就能使这个项目成为可能。"
  AUS_establish_the_austrian_airforce_academy: "建立奥地利空军学院"
  AUS_establish_the_austrian_airforce_academy_desc: "我们初出茅庐的空军发展很好，但与此同时我们的技术可能并不缺乏，我们缺乏的是培训。我们可以投入资源来解决这个问题，没理由不解决。"

 ## 奥地利阶段海军线
  AUS_repair_pola_naval_base: "修复波拉海军基地"
  AUS_repair_pola_naval_base_desc: "波拉（现称普拉）海军基地曾经是奥地利帝国海军的一个关键的军事设施。自从我们被赶出大海，它已经年久失修了，但我们可以且必须努力确保这个基地能再次可用。"
  AUS_recreate_the_kuk_kriegsmarine: "重建地中海舰队海军"
  AUS_recreate_the_kuk_kriegsmarine_desc: "地中海舰队曾是德国的海军，直到一战战败我们失去进入海洋的机会。通过付出不小的努力，我们可以收回它以前的荣耀。"
  AUS_rijeka_naval_academy: "里耶卡海军学院"
  AUS_rijeka_naval_academy_desc: "里耶卡是克罗地亚地区最大的港口城市之一，也是其中一个传承地中海舰队海军遗产原则的城市。她们对航海和海战并不陌生，我们可以利用这方面的专业知识。"
  AUS_trieste_shipyards: "的里雅斯特造船厂"
  AUS_trieste_shipyards_desc: "的里雅斯特是一个拥有现有造船业的小镇，我们应该采取措施来资助和利用它。这将确保我们在地中海的主导地位。"
  AUS_trieste_shipyards_tt: "允许雇用的里雅斯特船厂的船舶设计师\n"
  AUS_expand_cattaro_harbour: "扩张科托尔港"
  AUS_expand_cattaro_harbour_desc: "科托尔港是一个内陆海湾，一个海军舰队可以安全驻扎的避难的地方。这是一个天然安全的资产，我们应该这样对待它。我们将在这里进行下一步扩张。"
  AUS_a_stealthier_approach: "一个更隐蔽的方法"
  AUS_a_stealthier_approach_desc: "奥地利海军不是它曾经的样子，事实上它是不存在的。我们不能把大量的资源投入到那些将容易被更大型舰队摧毁的船上。隐蔽的潜艇战将是我们的未来。"
  AUS_sieze_the_adriatic: "控制亚得里亚海"
  AUS_sieze_the_adriatic_desc: "亚得里亚海是我们通往意大利（靴子国）的主要途径之一，也是我们领土关键海岸线的延伸之一。必须审慎地用专门的内陆海船（如巡洋舰）来保护它。"
  AUS_push_for_the_mediterranean: "走向地中海"
  AUS_push_for_the_mediterranean_desc: "地中海对许多非洲和欧洲帝国来说是著名的海洋、抚育者和摇篮。它将再次成为我们国家的摇篮，如果我们能保护好它的话。"
  AUS_reform_the_kuk_seefliegerkorps: "改革地中海舰队航空兵"
  AUS_reform_the_kuk_seefliegerkorps_desc: "地中海舰队的海军航空兵是独立的，不同于主要海军部队，有自己的专长和职能。她将在未来发挥效用，我们应该把资源用于改革。"
  AUS_found_the_austrian_marines: "建立地中海舰队海军陆战队"
  AUS_found_the_austrian_marines_desc: "自从我们流亡以来，我们军队的一个分支已经陷入不可接受的忽视，这就是我们的海军陆战队。只要付出一点资金和一点时间，我们就能修复时间所造成的损失。"
  AUS_The_legacy_of_Imperial_Admiralty: "帝国海军部的遗产"
  AUS_The_legacy_of_Imperial_Admiralty_desc: "虽然有着明显的旧时代气息，但是帝国海军部留下的资料和数据仍然弥足珍贵，它们将是重建和革新德意志海军的基石。"

 ## 德意志国二阶段国策
  GERmany_focus: "德意志国二阶段国策"

  GER_01: "德意志归来"
  GER_01_desc: "经过我们不懈的努力，德意志父亲终于重归我们的掌控。"
  GER_02: "柏林审判"
  GER_02_desc: "我们将筹备在柏林举行一场针对魔导国余孽和德奸德审判"
  UNCOM_QINGXI_GER: "§R不完全的清洗可能会造成严重的后果§!"
  GER_03: "建立基础秩序"
  GER_03_desc: "经过多次战争，祖国父亲已经破败不堪，我们急需建立一个基础的社会秩序。"
  GER_04: "柏林演讲......"
  GER_04_desc: "现在我们所有人都对德意志的未来充满期待，元首已经准备好一场振奋人心的演讲了......"
  BOLIN_YANJIANG: "§R元首已经准备好一场精彩的演讲了§!"

 ## 纳粹通用外交
  GER_generic_01: "为新的战争做准备"
  GER_generic_01_desc: "胆怯懦弱的圣杯同盟窃取了我们的胜利果实，东方的毛熊在对我们虎视眈眈，是时候准备捍卫我们民族的权利了。"
  GER_generic_02: "属于德意志的国防军"
  GER_generic_02_desc: "解放我们家乡的老兵对于战争经验丰厚，但是面对绵长的战线仍力量不足，是时候组件一支崭新的德意志军队了。"
  GER_generic_03: "继续德意志计划"
  GER_generic_03_desc: "既然我们已经拥有了足够的兵力与配套的战争机器，我们就应当追求更加伟大的目标：彻底收复大德意志地区。"
  UNLOCK_GERMANIA_PLAN: "解锁决议：§C光复大德意志§!"
  GER_generic_04: "日耳曼妮娅计划"
  GER_generic_04_desc: ""
  ALL_CONTROL_G_GER: "完全控制大德意志地区"
  UNLOCK_GREAT_GERMANIA_PLAN: "解锁决议：§C日耳曼妮娅计划§!"
  GER_generic_05: "拓展生存空间"
  GER_generic_05_desc: "德意志需要的是生存空间、一个民族的生存空间！"
  UNLOCK_LIVE_SPARE_PLANS: "解锁决议：§C拓展德意志生存空间§!"
  GER_generic_06: "向东看"
  GER_generic_06_desc: "东方巨大的红色威胁对我们虎视眈眈，我们要先发制人，击碎布尔什维克的威胁。"
  GER_generic_07: "向西看"
  GER_generic_07_desc: "圣杯同盟曾窃取了我们的胜利果实，而这一次她们没有这样的好运了。"
  GER_generic_08: "北欧计划"
  GER_generic_08_desc: "北方的斯堪的纳维亚有着大量的土地。"
  GER_generic_09: "巴尔干计划"
  GER_generic_09_desc: "巴尔干拥有极强的战略意义，我们不能让这片土地落入敌人之手。"
  GER_generic_10: "跨过大洋"
  GER_generic_10_desc: "大洋彼岸的美洲是一块宝地，同时也是巨大的威胁，我们必须击破那里的敌人。"
  GER_generic_11: "强化轴心国外交"
  GER_generic_11_desc: "轴心国才是我们的基本盘，我们将和我们一直以来的盟友共进退！"
  GER_generic_12: "让盟友滚蛋！"
  GER_generic_12_desc: "没有国家能与伟大的德意志相提并论，她们只配成为我们的卫星国！"
  GER_generic_13: "邪恶轴心"
  GER_generic_13_desc: "考虑到我们与苏联的关系，一个大胆的想法逐渐浮现......"

 ## 纳粹通用经济
  GER_economic_01: "重建祖国"
  GER_economic_01_desc: "我们胜利了！不死族留给我们了一个千疮百孔的家乡，但是我们会重新让她散发出魅力。"
  GER_economic_02: "延发大众债券"
  GER_economic_02_desc: "我们虽然刚刚从不死族手中夺回国土，但是期待中的经济腾飞并没有到来。反而是经济秩序开始濒于崩溃，经讨论决定，通过将战争之前发行的梅芙券宣布延期并用新获得的暂时难以变卖的魔导国资产作为新的保障，我们需要稳定德意志人民的兑付需求以缓解我们目前遭遇的经济压力。"
  GER_economic_03: "重建经济秩序"
  GER_economic_03_desc: "就本质而言，除了战时经济被破坏以外，我们遭遇的经济崩溃也归因于两个经济秩序并行的混乱，两个货币体系的存在与对庞大的旧领内实行的经济政策处理失当导致了在金融领域上的分裂与崩溃，尽管这会是漫长的过程，但我们必须重新发行新马克，保障货币兑换工作，以压制旧帝国马克公信力，同时重新建立一个安全的市场投资环境，我们的目的是重建属于德意志国的经济秩序。"
  GER_economic_04: "临时行政干预"
  GER_economic_04_desc: "战后的供需情况可以说是灾难性的——大量企业外迁或破产，大量的工业资本开始流出德意志国，各企业股融资也面临巨大困难。不能对目前的乱象置之不理。一套临时出台的行政干预计划将会缩减政府各项支出，重新调整贸易方针，监督金融资本流动，同时资金扶持工业企业并干预生产活动。通过行政手段，我们会向世界证明一点：德国能够自行处理魔导国留下来的烂摊子，并做的更好。"
  GER_economic_05: "以工代赈"
  GER_economic_05_desc: "无尽的福利救济只是在徒劳的对国家进行放血，战后重建工作需要人手，我们必须自己制造更多的工作岗位以应对失业浪潮。"
  GER_economic_06: "处理魔导国纪念碑"
  GER_economic_06_desc: "魔导国刚刚征服德意志时在世界各地都立下了她们的纪念碑，尽管科研部门想要保留这些奇异产物，但是时局不稳，我们应当尽早将其中大部分的纪念碑予以处理。"
  GER_economic_07: "鼓励小资本"
  GER_economic_07_desc: "因为魔导国长期奉行的自由主义政策，大批的金融与工业资本在德意志光复后选择逃离德意志国市场，光靠争取容克旧贵族的支持不足以解决问题。我们可以鼓励民众自行创业，向愿意投资德意志市场的居民群体发放津贴。鼓励她们把储金重新放入市场。"
  GER_economic_08: "重启工厂"
  GER_economic_08_desc: "战后，随着资本撤出，大批的工业机器被拆除运走，大量工厂被裁撤，所幸的是巴伐利亚，符腾堡等早期解放区有着大量未来得及撤走的工厂以及大量的机器机床，我们可以以国资重新启用她们，抑或是再次进行国内拍卖，以最大努力恢复旧地的工业产能。"
  GER_economic_09: "大规模工业化"
  GER_economic_09_desc: "德意志国在南方成功确保了大量的工业基础，而北方尤其是鲁尔地区也再次空出了大量的工业区划，根据我们目前的复苏计划，我们可以且应当进行一轮新的工业扩张，或者说重建。"
  GER_economic_10: "补贴工厂主"
  GER_economic_10_desc: "单独的创业津贴显然是不够的，国内外的经济压力仍然不容小觑，在我们保卫本国市场逐步取得的建设成果时，我们应当加大对新兴企业的补贴力度，保证新的产业能够最大程度的维持下去。"
  GER_economic_11: "恢复市场活力"
  GER_economic_11_desc: "经过我们近日的诸多举措，我们将能够缓解遭到重创的本国市场与产业，完全的恢复需要时间，但是我们已经具备实行改革的基本条件。"
  GER_economic_12: "打击垄断"
  GER_economic_12_desc: "为了经济复苏，我们曾默许没有撤出——或许是没来得及撤出的少数关键产业自由的进行产业扩张，及至形成垄断态势，但现在我们得处理相关问题，尤其是她们掌握着部分关键工业产品的垄断地位，这必须得到解决。"
  GER_economic_13: "重点产业国有化"
  GER_economic_13_desc: "这些产业是我们国家的命脉，牢牢握在国家的手中有利于祖国的稳定与发展。"
  GER_economic_14: "“大众”拖拉机"
  GER_economic_14_desc: "农机短缺随着工业的逐步复苏已经变成了一个需要得到重视的问题，中央政府已经给出指示要求动员一切支持我们事业的劳工组织团体，建立一个能够生产相关器械的大型国资产业，当然，如果这项方案得到成功，未来她就能负责更加——具有战略性的生产活动。"
  GER_economic_15: "农业机械化"
  GER_economic_15_desc: "经过一场大规模的农机产业建设，我们将重新实现农业上的机械化。尽管需要的预算甚多。"
  GER_economic_16: "莱茵河河运工程"
  GER_economic_16_desc: "尽管鲁尔地区已经有了可观的水坝建设，但是考虑到失业问题仍然威胁着德意志国的社会稳定，我们仍然需要进一步“强行”优化本国内部的河运网络，这可以通过修建新的运河与堤坝来实现。尽管不科学的建设往往会导致事倍功半，但是总体而言是适合德意志国的经济方案的。"
  GER_economic_17: "合成炼油技术"
  GER_economic_17_desc: "我们不能保证靠着南方盟友我们能够得到稳定的石油资源供给，如果战事陷入僵持，我们必须确保有一个巨大的合成炼油产业来确保德意志有足够的时间夺取石油产地。"
  GER_economic_18: "宽轨铁路"
  GER_economic_18_desc: "当年两个国家采用的是不同的铁路宽度体系，尽管旧奥地利派反对意见很大，但是我们应当遵从德意志地区一直以来推行的铁路体系，将宽轨铁路铺至奥地利。"
  GER_economic_19: "德意志铁路委员会"
  GER_economic_19_desc: "要继续德意志国境内的铁路建设，我们就需要一个新的经济委员会来组织，指挥相关事宜推进。"

 ## 陆军
  GER_army_02: "莱茵金属"
  GER_army_02_desc: "我们将会建立一个管理资源开采的公司以优化本国矿业结构。"
  GER_army_03: "“大众”汽车"
  GER_army_03_desc: "现在便是之前所言的关键时刻了，尽管这个庞大的企业以农机产业起步，但在我国专家的组织下她将能迅速组织投入军用车辆与装甲生产。"
  GER_army_04: "雇佣保时捷"
  GER_army_04_desc: "保时捷公司是少数在光复时未撤离的德国企业之一，她们在车辆制造行业实力强劲，大有垄断之势，我们可以将它纳入我国的军事生产体系。"
  GER_army_05: "投资毛瑟"
  GER_army_05_desc: "作为一家在一战时便提供了诸多强力枪型的老牌军工产商，我们应当加大对它的投资。"
  GER_army_06: "扩大军费投资"
  GER_army_06_desc: "我们在军事领域进行的诸项举措已经将我们能够得到的预算逼至极限，我们应当说服中央进一步加大军费投资，以保证我们的举措能够稳定推进。"
  GER_army_07: "与苏联的坦克条约"
  GER_army_07_desc: "苏联在新时代的装甲研究有着突出成就，也许我们可以与她们达成一项交易。"
  GER_army_08: "大规模产线"
  GER_army_08_desc: "我们需要进一步扩展军工生产线。"
  GER_army_09: "更强的装甲"
  GER_army_09_desc: "我们需要研究更加难以被击穿的装甲结构。"
  GER_army_10: "优待技工"
  GER_army_10_desc: "我们应当对关乎我们生产工作稳定的技工团体推出几项优惠政策。"
  GER_army_11: "速度崇拜"
  GER_army_11_desc: "德意志人应当有着更快，更具有突破能力的装甲设计！"
  GER_army_12: "真正的“大众”"
  GER_army_12_desc: "也许我们追求更好更快的军用车辆，但是我们也要明白，真正能够发挥作用的反而是便宜实用的，换句话说，只有真正的有大众性的设计才能服务于德意志国。"
  GER_army_13: "价格才是第一位"
  GER_army_13_desc: "考虑到未来战事我们会遭遇困难，我们应当在载具生产的造价方面减少必需成本。"
  GER_army_14: "质量优先"
  GER_army_14_desc: "也许我们会需要便宜耐造的大众性设计，但是作为德意志国，我们终究需要在军工行业实现更快更好更强。"
  GER_army_15: "永远做最好的！"
  GER_army_15_desc: "我们应当保证我们的装甲车辆品质永远处于最高水平，我们不应该考虑成本问题。"
  GER_army_16: "改组坦克生产线"
  GER_army_16_desc: "现有的坦克生产线在经过评估后被认为具有巨大的优化空间，需要一系列改革。"
  GER_army_17: "火力优势"
  GER_army_17_desc: "果然对于火炮而言最好的还是火力，强劲火力的火炮单位才是德意志部队的未来。"
  GER_army_19: "扩大步枪生产"
  GER_army_19_desc: "战事似乎陷入了僵局，我们应当扩大最基本的步枪生产以应对强度越来越大的动员活动。"
  GER_army_20: "协同作战"
  GER_army_20_desc: "随着坦克战的演进，我们应当在战术上对步兵与装甲的协同作战方面进行一次特别研究。"

  GER_army_01: "崭新的国防军"
  GER_army_01_desc: "无论是为了统治的未来着想还是战争的现实需要，我们都需要对内部腐朽不堪的国防军进行一番改革，毕竟本质上我们还是不能指望党卫军冲在战争的最前线上。"
  GER_Revolutionize_Blitzkrieg: "革新闪电战"
  GER_Revolutionize_Blitzkrieg_desc: "毫无疑问，闪电战这种战法已经证明了他的价值。但任何一种战术都不是完美地，随着科技进步和军事发展，我们需要对我们的闪电战作出符合现状的修改。"
  GER_Breakthrough_in_armor_theory: "装甲理论突破"
  GER_Breakthrough_in_armor_theory_desc: "旧时代的装甲理论是时候被放弃了，现如今的战场上，装甲力量的地位和以前相比已经不可同日而语。我们应当集中召开研讨，集思广益，让我们的军队对装甲力量的使用理论更上一层楼。"
  GER_Breakthrough_in_depth_tactics: "纵深突破战术"
  GER_Breakthrough_in_depth_tactics_desc: "让我们的装甲部队和敌人在他们的防线上硬耗显然不是什么正确的做法，我们将集中力量研究纵深突破的战术，装甲部队将作为一把尖刀，撕开敌人的防线，直捣他们的后方"
  GER_Collaborative_training: "协同训练"
  GER_Collaborative_training_desc: "新的闪电战要求我们不能只依靠担任前锋职责的精锐力量，其他作为辅助的部队才是我们稳住战果的依靠。来自不同部队的士兵接下来将接受同样的协同训练，以便我们准备的战术得以完美施展。"
  GER_Elite_tactics: "精进步兵战术"
  GER_Elite_tactics_desc: "装甲力量终究还是有限的，在很多地方我们还是不得不依靠传统的步兵。我们需要精进军队的步兵战术和作战理念，让他们成为战争的中坚力量。"
  GER_Revolutionize_artillery_tactics: "革新炮兵战术"
  GER_Revolutionize_artillery_tactics_desc: "无论过去多久，炮兵都仍然是战争之王。我们的部队仍然保留着较为落后的炮兵战术，是时候更新它们，强化炮兵战力了。"
  GER_Air_ground_collaboration: "空地协同"
  GER_Air_ground_collaboration_desc: "闪电战的完美实施不仅仅需要陆军的努力，空军的支援同样重要。接下来空陆两军之间将进行更深层次的联合训练，将我们的军队锻造成一支统一而高效的，势不可挡的部队。"
  GER_army_18: "特别坦克研发部门"
  GER_army_18_desc: "坦克作为德意志研究的重中之重，应当派出特别的研究力量参与相关工作，是时候建立一个特别的坦克研发部门了。"
  GER_Special_Engineering_Department: "德意志特殊工程部"
  GER_Special_Engineering_Department_desc: "将新兴的科学技术利用到战争上很可能对战场形势进行革命性的改变。"
  GER_Behemoth_of_War: "战争巨兽"
  GER_Behemoth_of_War_desc: "在一次次的战斗中我们意识到，遵照传统理念设计的装甲载具已经不足以满足我们的战争需要了。既然如此，那就超越极限，坦克研发部门设计的全新战争巨兽将会碾碎一切德意志的敌人！"

 ## 海军
  GER_navy_01: "狼群战术"
  GER_navy_01_desc: "和我们的敌人比起来，我们的水上力量过于薄弱了。我们的海军司令邓尼茨建议我们大力发展水下潜艇部队，成群结队的潜艇可以在大西洋上以压倒性的力量猎杀敌人的商船和大型战舰。"
  GER_navy_02: "公海舰队的荣耀"
  GER_navy_02_desc: "传统的大舰巨炮仍然是我们德国海军发展的重点理念，我们相信只有强大的战列舰和巡洋舰才是海军的基石，重现公海舰队的荣耀！"
  GER_navy_03: "空中力量"
  GER_navy_03_desc: "航母出现改变了海战的战术，轰炸机和鱼雷机可以从航母的甲板上起飞对笨重的战列舰和巡洋舰进行轰炸。我们绝不允许敌人拥有未来称霸海洋的力量，而德国却没有。"
  GER_navy_04: "先进型号"
  GER_navy_04_desc: "敌人在舰船上部署的的雷达和声呐对于我们的潜艇部队非常致命，所以我们必须继续研发潜艇的新型号，保持水下部队的领先地位。"
  GER_navy_05: "扩大潜艇规模"
  GER_navy_05_desc: "德意志的造船厂从前很少生产潜艇，但现在基于现实因素考虑，是时候扩建制造潜艇的船厂了。"
  GER_navy_06: "增进杀伤"
  GER_navy_06_desc: "潜艇在水下想要穿透敌人的战舰，必须在鱼雷和水雷科技方面取得突破，它们的威力直接决定了德意志潜艇部队的战斗力。"
  GER_navy_07: "幽灵舰队"
  GER_navy_07_desc: "德意志的潜艇部队就像大西洋上的幽灵，会突然出现攻击敌人的舰船，而达成目标后又在水下迅速撤离。正因为它们的存在，德意志的敌人才会如此坐立不安。"
  GER_navy_08: "大炮重舰"
  GER_navy_08_desc: "德意志的舰队向来是以战列舰为绝对核心的，这种巨大的战舰在海洋上会以压倒性的火力狠狠撕碎敌人的舰船。"
  GER_navy_09: "质量高于一切"
  GER_navy_09_desc: "建立一支海军需要非常长的时间，尽管海上危机已经迫在眉睫，但我们也不能让海军的战士们驾驶有瑕疵的战舰。我们不在乎战舰的数量多少，不过必须要保证我们的战舰领先于敌人。"
  GER_navy_10: "真理只在大炮的射程之内"
  GER_navy_10_desc: "战舰舰炮口径的大小决定了这场海战的胜负手，只要敌人的舰船出现在我们的战舰的攻击范围之内，我们战舰的巨炮一定会让他们有来无回！"
  GER_navy_11: "新时代海军"
  GER_navy_11_desc: "大炮巨舰已经逐渐退出了历史的舞台，可以预见的是，未来的海战一定是形成以航母为核心的战舰编队集群，德意志必须要打造一支属于自己的新时代海军。"
  GER_navy_12: "海军航空兵"
  GER_navy_12_desc: "航母的诞生催生出了海军航空兵这一新式军种，他们隶属于海军战斗序列，任务则是熟练地驾驶航母上停靠的各式飞机对敌人进行精确打击。德意志的海军航空兵训练起步较晚，但我们相信我们的海军航空兵不会弱于传统海军强国。"
  GER_navy_13: "空中死神"
  GER_navy_13_desc: "随着一艘艘战舰沉没，敌人给我们的海军轰炸机起了一个新名字：空中死神。这个名字是如此恰如其分，我们的舰队就是德意志敌人的索命死神，广袤的海洋属于德意志！"
  GER_navy_14: "改进生产技术"
  GER_navy_14_desc: ""

 ## 空军
  GER_air_01: "我们的天空"
  GER_air_01_desc: "既然要寻求阳光下的土地，为德意志人争取生存空间，那我们就必须要征服我们头顶的天空，让德意志的旗帜飘扬在蓝天之上。"
  GER_air_02: "机身研究"
  GER_air_02_desc: "我们的飞机严重落后于时代，必须研发新型的飞机机身，这样才能保证我们的战机在未来的战场上不落下风。"
  GER_air_03: "重视杀伤"
  GER_air_03_desc: "空军的重点是在空中消灭敌人的战斗机和轰炸机，他们如同苍蝇一般阻挠着陆军的行进，我们的战斗机要将他们消灭在蓝天上。"
  GER_air_04: "重视轰炸"
  GER_air_04_desc: "从天空中倾泻的雨点般的炸弹能摧毁敌人的工厂和基础设施，对敌人造成重大杀伤，轻易地击垮敌人的心理防线。"
  GER_air_05: "全新的思路"
  GER_air_05_desc: "在这个能够使用魔法的世界里，研发部门也制造了许多飞机的魔法原件，很显然它们能够给我们的空军带来更强大的威力。"
  GER_air_06: "德意志空军学院"
  GER_air_06_desc: "空军的战士们在没有经过足够训练前是不能踏足战场的，每一位飞行员都是德意志宝贵的财富。我们的空军学院会对他们进行培训，训练有素的飞行员能在战场上取得更大的战果。"
  GER_air_07: "我们的天空英雄们"
  GER_air_07_desc: "驾驶飞机飞上蓝天，为祖国而战的空军飞行员们无疑是真正的英雄，他们守护住了德意志的空域。敌人的战机从此不能在我们头顶上耀武耀威了，德意志的人民再也不用担心头上落下炸弹，现在轮到德意志的英雄们将恐惧送给我们的敌人了。"

 ## 莉莎
  GER_lisha_01: "德意志的英雄"
  GER_lisha_01_desc: "向伟大的元首致敬！在德意志帝国的大厦倾覆之时，是元首带领我们度过难关。待魔导国已秦失其鹿，又是元首带领着德意志的复仇之师给予魔导国致命一击，解放了德意志人民。她是全德意志应当永远追随的领路人，她是德意志的英雄！"
  GER_lisha_02: "重组德国行政部门"
  GER_lisha_02_desc: "魔导国的撤退所带走的并不只有本土星人，非常多的行政人员鄙夷我们的事业，最终背叛了德意志民族选择流亡别处，光靠从奥地利带过来的行政官员根本不足以在全国建立元首的统治，我们应当尽快在全国范围内重新组建德意志国家的行政体系。"
  GER_lisha_03: "扩大行政部门"
  GER_lisha_03_desc: "行政部门的完善工作刚刚结束，不过德意志国已经在开足马力为下一场复仇之战做准备了，我们需要进一步扩大行政部门架构，以使我国政府能够更加高效的组织动员工作。"
  GER_lisha_04: "中央集中权力"
  GER_lisha_04_desc: "为了方便统治，魔导国听取了部分德意志学者的意见，在经济与地方管理上偏向于分散，放任式的方针，我们绝不能重蹈魔导国侵略者的覆辙，一项国家最高法案已经被起草，柏林中央将会辐射式管控全德意志各地的行政管理。同时牢牢把握国家经济命脉。"
  GER_lisha_05: "德意志青年冲锋队"
  GER_lisha_05_desc: "作为支持着元首陛下赢得德意志领导权的准军事组织，青年冲锋队是德意志国最为重要，最具有发展潜力的民兵力量，元首已经下令扩编青年冲锋队，借以扩展德意志青年的军事训练，为元首提供忠诚，坚强的德意志战士。"
  GER_lisha_06: "暗影之人"
  GER_lisha_06_desc: "要想尽快实现对德意志自上而下的掌控，我们就需要一个能够监视，遥控德意志政权在各地运作的秘密机构，一个隐秘，强大，无处不在的情报部门将会为藏身于德意志内的每一个渣滓感到恐惧与绝望。"
  GER_lisha_07: "社会稳定是第一要务"
  GER_lisha_07_desc: "尽管德国面临着下一次战争，但是元首仍然要求我们将目光专注于维护社会秩序的稳定，战争刚刚结束，民生凋敝，为了进一步证明元首是拯救德意志的存在，我们必须要尽快让德意志人脱离苦海，并消灭任何可能威胁到社会稳定的潜在因素。"
  GER_lisha_08: "民族主义宣传"
  GER_lisha_08_desc: "作为我们在如此艰难的环境下浴血奋战的精神支柱，德意志民族主义应当进一步成为激励德意志人民破除万难，披荆斩棘的理想信条与指导人民生活，思考，战斗的至高准则，唯有如此，我们才能再一次让德意志民族屹立于世界顶端。"
  GER_lisha_09: "为了国家、为了民族"
  GER_lisha_09_desc: "我们应当明白，德意志的军队战斗的唯一理由唯有德意志本身，每个效忠于元首的士兵都应该意识到，她们个人的作为将会决定德意志国，决定德意志民族是否能够再度雄起，完成先人未能完成的丰功伟业。这才是她们的终极目标。"
  GER_lisha_10: "没有祖国，你什么都不是"
  GER_lisha_10_desc: "宣传部长戈培尔说过，“没有了祖国，你什么都不是”\n日耳曼的每一个人都应该将这句话牢记于心中，有国才有家，没有祖国就没有了尊严！永远记住，国家好，民族好，大家才好！"
  GER_lisha_11: "至上元首"
  GER_lisha_11_desc: "莉莎元首从侵略者手中拯救德意志，并在此稳定了德意志的局势，是德意志回归到她应有的位置。莉莎元首已经是德意志历史上最为璀璨的伟人，她是我们永远的“至上元首”。"
  GER_lisha_12: "更美好的德意志！"
  GER_lisha_12_desc: "全体日耳曼人都应该向着同一个目标，一个强大的德意志奋斗！"

 ### 迈耶
  GER_Goring_01: "大元帅，我来啦"
  GER_Goring_01_desc: "在我们敬爱的大元帅迈耶的英明领导下，柏林里那些试图起事的叛匪们又岂是全副武装的国防军的对手？柏林的冲天烈火正慢慢黯淡下去，而与之相对的是，我们的大元帅，赫尔曼·迈耶，将成为德意志历史上一颗最耀眼夺目的璀璨新星！"
  GER_Goring_02: "进驻柏林"
  GER_Goring_02_desc: "既然忠于大元帅的国防军已经完全控制住了柏林，那么是时候让我们敬爱的大元帅离开她那略显狭小但绝对舒适的秘密宅邸，坐上她最钟爱的军车，沿着在前元首莉莎指导下修建的高速公路前行，进入她心心念念的总理府，以元首的身份正式开始治理这个国家了。"
  GER_Goring_03: "组建委员会"
  GER_Goring_03_desc: "尽管我们敬爱的大元帅很想立刻全身心投入到治理国家的工作当中，但鉴于她平日那些......不好描述也不可描述的行为习惯，让整个国家都由她一人意志所左右无异于在弹药库里抽烟。通过组建一个由纳粹党及国防军高层所任职的委员会，我们可以对大元帅提出一些日常的治国建议，并在必要时对大元帅的不当举动进行略微但合适的限制。"
  GER_Goring_04: "处理叛徒"
  GER_Goring_04_desc: "那些妄图和我们作对的叛徒们现在已经全都关押于监牢之中，正惶恐不安、低声下气地恳求着我们的宽恕。这岂能如她们所愿？我们没动机去宽恕她们，也没时间去审判她们，就让她们来给那批新兵蛋子们当一下固定靶射击训练用的教具吧。"
  GER_Goring_05: "重建秩序"
  GER_Goring_05_desc: "柏林及其周边的叛乱已经彻底平定，现在当务之急是让秩序得到恢复。当然，在确保一切安全之前，荷枪实弹的军警、街头巷尾的哨卡以及日落生效的宵禁令仍将留存。"
  GER_Goring_06: "政治体制"
  GER_Goring_06_desc: "把目光放回到政坛上：我们敬爱的大元帅已经开始准备大展她的宏图，但国防军的不少元老们都在质疑为什么大元帅能够独享胜利果实。在矛盾不可调和之前，我们必须确定一点：大元帅是作为元首进行她的个人独裁，还是继续作为大元帅和元老们共谋国事。"
  GER_Goring_07: "授权国防部"
  GER_Goring_07_desc: "尽管我们的大元帅已经坐稳了她的宝座，但请不要忘记，她首先是国防军的大元帅，其次才是我们德意志祖国的元首。大元帅仍然需要国防军的支持——只要将一部分重要权力授权给国防部，让国防军的一些元老们正式在政府中身居高位，她们会很乐意对大元帅的统治鼎力相助。"
  GER_Goring_08: "修改宪法"
  GER_Goring_08_desc: "1933年通过的《授权法》是元首行使近乎无限的权力的法律基础。如果我们要让国防军能够真正统治这个国家，让委员会能够真正起到辅佐并监督大元帅治理国家的职能的话，那么对相应宪法的修改就得尽可能快地提上日程。"
  GER_Goring_09: "遵循委员会"
  GER_Goring_09_desc: "我们的大元帅和先前组建的委员会一起将国家治理得很好。既然如此，我们就有必要将委员会制度正式化，确保委员会能够在尽可能少受大元帅的干扰下发号施令，确保整个国家能够在一个理性的精英团体的指挥下高效运转。"
  GER_Goring_10: "镇压异见者"
  GER_Goring_10_desc: "毫不意外的是，国内不少人对现在这种军政府体制颇有微词，但其中有些人已经胆大包天到在光天化日之下抨击政府。如果放任她们这样下去，“第二次国耻”必然会再次重演。既然上次的新兵蛋子们对固定靶的射击训练已经相当娴熟，那么是时候让她们尝试射击一下移动靶了。"
  GER_Goring_11: "元帅崇拜"
  GER_Goring_11_desc: "值得明确的一点是：虽然国防军确实是一支不容忽视的重要力量，但倘若没有我们敬爱的大元帅的雄才伟略，国防军又怎能成就现在的高位呢？她不仅理应居于元首的宝座之上，更应该让全德意志的人民知晓：只有迈耶大元帅才是莉莎元首最正当的继承者，只有迈耶大元帅才能带领着整个德意志国走向辉煌的未来！"
  GER_Goring_12: "提拔亲信"
  GER_Goring_12_desc: "我们敬爱的大元帅虽然致力于事无巨细亲历亲为，但即便是神话中的哲人王，也需要一个团队来辅佐才能将所有事情都办得井井有条。鉴于先前所组建的委员会经常在莫名其妙的环节给我们的大元帅下绊子，我们得让另一批人来制衡委员会的影响力。大元帅平日里的亲朋好友就是一个不专业但对口的良方——只要最终决策权还是牢牢掌握在大元帅手里，那就够了。"
  GER_Goring_13: "疏远异见者"
  GER_Goring_13_desc: "随着大元帅的政令不断下达，反对大元帅的民众、下层军官、甚至中上层军官也越来越多，但大元帅的宏图伟业岂会由这些宵小之辈的信口雌黄所扰动？就让她们喧嚣下去吧，等到她们一无所有之后，她们自会发觉先前的自己是多么地幼稚和离谱。"
  GER_Goring_14: "元帅的党"
  GER_Goring_14_desc: "自建党以来，纳粹党一直都在强调元首至上，而我们敬爱的大元帅的丰功伟业完全可以深化这一论点。如果不是大元帅的力挽狂澜，纳粹党又有多少机会能将那些叛徒给一网打尽呢？如果不是大元帅的高瞻远瞩，纳粹党又有多大可能将整个国家发展到现在这个程度呢？大元帅为党付出了几乎一切，她理应得到最崇高的敬意，整个纳粹党都应团结在大元帅的军旗之下！"
  GER_Goring_Advocacy_department: "宣传部门"
  GER_Goring_Advocacy_department_desc: "自柏林内乱以来，由于缺少了统一的口径，纳粹党平日里全速运转的宣传机器一下就变得寂静无声。既然内乱已经结束，我们就有必要给这台机器点燃圣香，涂抹圣油，念诵古老的祷文，通过这台机器的再度启动，来让被我们所认可的真理再度传播于世间。"
  GER_Goring_Nationalist_propaganda: "民族主义宣传"
  GER_Goring_Nationalist_propaganda_desc: "无论敌人们怎么否认，打败了魔导国重建了家园的德意志人就是这个世界上最伟大的民族。现在通过纳粹党的宣传机器，我们会将这一观点传达至全国，让每一个的德意志人都因为他们的民族而自豪。"
  GER_Goring_Kindle_fire_of_revenge: "燃起复仇之火"
  GER_Goring_Kindle_fire_of_revenge_desc: "任何侵犯了德意志的国家和民族都必须付出惨痛的代价。每一个德意志人都应该清楚：无论是从前还是现在的祖国的敌人都应该被彻底毁灭，总有一天德意志会向他们复仇！"
  GER_Goring_Location_of_Germans: "日耳曼人的位置"
  GER_Goring_Location_of_Germans_desc: "随着德意志的日益强大，伟大的日耳曼人不会再满足于脚下的土地。我们需要知道日耳曼人能在世界上得到什么，全世界的日耳曼人都应该获得更高一等的地位，那些劣等民族不配享受最优等的日耳曼人所期许的土地和资源，我们也需要阳光下的地盘！"
  GER_Goring_Prussian_military_traditions: "普鲁士军事传统"
  GER_Goring_Prussian_military_traditions_desc: "如果没有普鲁士，就没有现在的大德意志。我们的军队需要重拾伟大的普鲁士的军事传统，士兵在经过完备的训练后会爆发出更强大的战斗意志和战斗素养，以铁和血来铸造德意志的荣光。"
  GER_Goring_Construction_of_Junkers_officer_corps: "建设容克军官团"
  GER_Goring_Construction_of_Junkers_officer_corps_desc: "那些容克贵族们受教育程度远高于一般国民，能接受更高一等的军事训练，提高军队的组织性和纪律性，他们的军事能力决定了德意志军队的上限。"
  GER_Goring_Prussian_eagle_rises_again: "普鲁士雄鹰再起"
  GER_Goring_Prussian_eagle_rises_again_desc: "普鲁士的雄鹰军旗深深地刻在了每一个德意志人的心中，那面旗帜在普鲁士诞生以来几乎从未失败，人民在这面旗帜的带领下战无不胜。现在我们将再度竖起这面旗帜，以增强我们军队的士气和战斗意志。"
  GER_Goring_Racial_policy: "种族政策"
  GER_Goring_Racial_policy_desc: "先前莉莎所施行的种族政策曾经招致国内乃至整个国际社会的争议，尽管在魔导国占领期间这个政策不得不中断，但在收复故土后，有关于这个政策的争论已经到了严重动摇社会稳定的程度。考虑到连年战争造就的劳动力减员问题，我们必须在劳动力和“劳动力”间做出选择。"
  GER_Goring_Racial_mitigation_policies: "减缓种族政策"
  GER_Goring_Racial_mitigation_policies_desc: "先前的光复战争证明了一点：所有的德意志人都能为国家贡献自己的一份力量。如果所有人都是国家的一份子的话，为什么要刻意将不同人之间区分开呢？虽然我们不能一夜之间就将这个政策化为一篓废纸，但至少我们可以做些什么。"
  GER_Goring_Emancipation_of_slave_labor: "解放奴工"
  GER_Goring_Emancipation_of_slave_labor_desc: "种族政策的一个直接体现就是集中营内的大量奴工，虽然这一举措使得整个国家表面上看起来基层劳动力充实，但奴工们的工作效率已经低下到严重影响了各项工程计划的有序进展，也使得德意志人民的工作岗位占比严重畸形，根本无法展现出为国家效力所应有的热情。通过将这些奴工在可控的条件下逐步解放为普通人，我们既能向外界释放一个积极的信号，也能重新而有利地调节国内的就业环境。"
  GER_Goring_The_gap_is_no_more: "隔阂不再"
  GER_Goring_The_gap_is_no_more_desc: "尽管魔导国的入侵和莉莎的种族政策差一点彻底撕裂了整个德意志民族，但相信在大元帅的宽松民族政策下终有一天会消弭一空。我们德意志人是完整的一个整体，任何民族，任何种族的德意志人都应该沐浴在同一缕阳光下，直至永远。"
  GER_Goring_It_wont_change: "一切照旧"
  GER_Goring_It_wont_change_desc: "永远不要忘记一点：是这些劣等民族们的落井下石导致了上一次伟大战争里德意志父亲的惨败。连远在遥远东方的神州都有一句话叫“以直报怨”，作为最优秀的民族，如果连这个仇都报不了，又怎么能在那些次等民族面前树立威信呢？我们理应，也必须把先前的种族政策继续延续下去，这样才能让民众们牢记德意志父亲先前所遭受的种种伤痛！"
  GER_Goring_Goodbye_to_concentration_camps: "集中营再会"
  GER_Goring_Goodbye_to_concentration_camps_desc: "在魔导国那一套“二等公民”政策下，不少劣等民族得以名正言顺地于光天化日之下玷污德意志父亲的土地，挤压日耳曼民族的生存空间。既然我们已经回到了这片土地上，那么这场闹剧就该结束了！红砖房，五层床，铁丝网里上天堂，集中营才应该是让这些败类们赎罪至死的最好场所！"
  GER_Goring_Slave_labor: "压榨奴工"
  GER_Goring_Slave_labor_desc: "某位下层国防军军官在酒吧里玩桌游时有了一个新奇的想法：既然奴工们在固定时间内的工作效率低下到不能再低下了，那么大幅延长她们的工作时间，问题不就解决了吗？虽然这位军官因工作时玩忽职守而被送去关了几天禁闭，但这个想法足以让他荣获一名铁十字勋章。我们应立刻着手于将这些奴工们的最后一丝自由意志给最大幅度地压榨为德意志人民的食粮。"

 ### 民主德国
  GER_ailika_01: "新的政治面孔"
  GER_ailika_01_desc: "莉莎带着她疯狂的想法葬身在勃兰登堡的火海之中，现在，作为迈向过去的一步，以改革派军官为核心的临时政府必须尽快在民众的耐心耗尽之前让这个国家迈向民主化。并且确保它不再像魏玛时代一般摇摇欲坠。"
  GER_ailika_02: "指派地方官员"
  GER_ailika_02_desc: "党卫军在柏林内乱期间的表现几乎摧毁了各州政府对纳粹党官员的信任。没有必要维护她们的统治——我们也不相信她们。"
  GER_ailika_03: "重写宪法"
  GER_ailika_03_desc: "奥地利时期的德意志宪法充斥着先军政治与极端民族主义的条款。这部服务于长期战争的法西斯宪法理应付之一炬。以一部真正的国家宪法取而代之。不过，相比于20年代孱弱的魏玛宪法而言，有些条款的存在也是必要的......"
  GER_ailika_04: "向圣杯看齐"
  GER_ailika_04_desc: "圣杯的民主体系已经平稳的运行了几百年，作为一个新兴的民主政体，最好的还是向圣杯这个前辈学习，建立更友好的关系。"
  GER_ailika_05: "逐步清洗极端分子"
  GER_ailika_05_desc: "尽管承认了莉莎与希尔的行为令其不配统治国家。但纳粹党内部仍有大批反对者正密谋阻滞改革派计划在国内实现的政治变革。受困于纳粹党如今的执政地位，贸然公开化双方的矛盾对谁都没有好处。"
  GER_ailika_06: "不能手软"
  GER_ailika_06_desc: "曾亲身经历过莉莎演讲的都知道：这些纳粹分子哪怕什么都不干光站在那里，周边的民众都会为之躁动。有必要让大部分极端分子受制于我们的秘密监管之下，既然我们不能冒着她们鼓动民众们发动骚乱的风险让她们在光天化日之下再次现身，那么某些不应存在于阳光之下东西就该永远埋葬在黑暗之中！"
  GER_ailika_07: "公开审判"
  GER_ailika_07_desc: "尽管很想把这些极端分子直接推上断头台，但这样做只会让民众们认为我们只不过是又一位暴君。在让她们受到应有的制裁前，我们有必要在大庭广众之下向世界揭露她们的罪恶，这样才能让民众们切实理解到我们此番所作所为的必要性。"
  GER_ailika_08: "解散纳粹党"
  GER_ailika_08_desc: "德国人民长期受法西斯主义荼毒，变得无比极端。这种邪恶的思想决不能再继续对德国人民造成更大伤害了，作为法西斯大本营和宣传基地的纳粹党必须被彻底取缔。"
  GER_ailika_09: "中止种族迫害"
  GER_ailika_09_desc: "纳粹党对于德意志民族的伤害还体现在他们执行了残酷的种族清洗政策上。德意志民族本应该是一个整体，我们不会再迫害那些属于德意志国籍的少数民族了，他们也是我们的兄弟亲友。"
  GER_ailika_10: "与圣杯和解"
  GER_ailika_10_desc: "在上次伟大战争失败后，我们与圣杯的关系变得非常微妙起来。特别是在莉莎带领的纳粹党掌权后更是降至冰点，我们很清楚他们绝不会坐视我们建立大德意志的梦想得以实现。但现在我们需要寻求与圣杯的和解，这并不是向他们示弱，而是基于我们的现实因素考虑后得出的最佳答案。"
  GER_ailika_11: "迎回民主派流亡者"
  GER_ailika_11_desc: "在纳粹党执政以及魔导国统治德意志期间，不计其数的民主派人士遭到迫害，而在这其中，一些幸存者想方设法逃到了国外寻求庇护。既然现在的政局又稳定了下来，我们应该邀请这些流亡者返回祖国，看看她们能为治理国家提出什么有创造性的见解。"
  GER_ailika_12: "崭新的德意志"
  GER_ailika_12_desc: "在经历一系列的民主化改革之后，德意志的政治面貌已经焕然一新。人民安居乐业，政府风气开放而稳定，一种勃勃生机、万物竞发的景象犹在眼前。我们相信，不同于旧共和国的混乱与迷惘，如今这个崭新而自信的国家已经做好了再一次尝试民主化的准备。"

  GER_Freedom_triumphs: "自由凯旋"
  GER_Freedom_triumphs_desc: "德国人民已经很久没有呼吸过自由的空气了，他们也从来没经历过民主的选举，现在是时候让全国人民参与投票了，祝愿最合适的政党成功组建德国新政府。"
  GER_Social_Democratic_government: "社会民主党政府"
  GER_Social_Democratic_government_desc: "在旧共和国陨落之后已逾二十年，伊蕾娜带领着新的社会民主党人再一次夺取了新共和国的领导权。这个同时为纳粹党与共产党人所敌视的社会主义政党几十年来一直在地下反对着在德意志境内推行专制统治的独裁者。虽然吸收了很大一部分共产党人的社民党有着不容小觑的进步性，不过这对新共和国来说有利无弊。"
  GER_Promote_worker_culture: "弘扬工人文化"
  GER_Promote_worker_culture_desc: ""
  GER_Reestablishment_of_Soviet_German_trade: "重建苏德贸易"
  GER_Reestablishment_of_Soviet_German_trade_desc: "苏德重新建立了正常的外交关系，作为欧洲大陆上最强大的两个国家，相信两国在经济贸易上也有很大的互补性。"
  GER_Eastern_Territory_Negotiations: "东方领土洽谈"
  GER_Eastern_Territory_Negotiations_desc: "德国在东方与苏联在领土上有很大的分歧，我们希望与苏联就两国势力范围达成一致，就目前而言我们都不希望两国因为一些无关紧要的土地争端导致兵戎相见。"
  GER_Lessons_from_the_Great_Depression: "大萧条的教训"
  GER_Lessons_from_the_Great_Depression_desc: "上次大萧条让我们的国家差点万劫不复，财富分配极不平衡所造成的需求不足和生产的产能过剩导致的经济危机仍然让我们感到心悸，我们必须吸取教训，改革经济。"
  GER_Increase_minimum_wage: "提高最低工资"
  GER_Increase_minimum_wage_desc: "我国工人生活状况不容乐观，想要提高他们的购买力和生产积极性，应该增加工人们的最低工资，提高工人们的幸福指数。"
  GER_Redistribution_adjustments: "再分配调整"
  GER_Redistribution_adjustments_desc: "我们的政府是站在工人一边的，我们要对国内的经济结构进行再分配调整，为工人争取更大的权益。"
  GER_House_of_the_People: "人民之家"
  GER_House_of_the_People_desc: "国家不仅是政客们的操练场，也应该是人民的家园，我们将致力于打造全国人民幸福的天堂。"
  GER_Protect_workers_rights_and_interests: "保障劳工权益"
  GER_Protect_workers_rights_and_interests_desc: "产业工人对我党的重要程度不言而喻，我们将推动劳资共同参与企业决策，以维护劳工应有的合法权益并进一步强化工人团体的话语权。"
  GER_Rebuilding_trade_unions: "重建工会"
  GER_Rebuilding_trade_unions_desc: "我们希望向全国人民展示政府的民主和多元化，重新建立工会对于团结国内工人，代表工人向企业争取利益，为了维护工人们的合法权益起到积极作用。"
  GER_Communism_allowed_participate_in_politics: "允许共产主义参政"
  GER_Communism_allowed_participate_in_politics_desc: "在取缔了德国共产党后，国内的共产主义者也如同散沙，为了尽可能团结起期望国家变革的进步人士，允许那些温和的共产主义者参与政治也不失为一种凝聚人心的手段。"
  GER_Liberal_government: "基民盟政府"
  GER_Liberal_government_desc: "由薇尔莉特组织起来的基督教民主联盟是首倡义举的民主反对派，她们的当选再一次代表了德国人民的意志——彻底与前两个殊途同归的独裁政权划清界限。在临时军政府结束她们的职责之后，在民主化的成果之上，地方自由主义者已经准备好将新共和国导回通向自由化的道路。"
  GER_Reassure_conservatives: "安抚保守派"
  GER_Reassure_conservatives_desc: "在进行大型的改革之前，需要与那些保守的利益集团私下沟通，以利益安抚他们，防止他们给我们的改革添乱。"
  GER_Invest_in_Juncker_companies: "投资容克企业"
  GER_Invest_in_Juncker_companies_desc: "容克贵族一直掌控着国家的大量资产，我们需要对容克贵族的企业进行投资，让他们在改革中获益，我们顺带着也能赚一些马克。"
  GER_Guarantee_national_enterprises: "保障民族企业"
  GER_Guarantee_national_enterprises_desc: "德意志国内存在着许多的民族企业，要保障民族企业的良性发展，以与大型外资企业争利。"
  GER_Say_goodbye_to_road_of_slavery: "告别奴役之路"
  GER_Say_goodbye_to_road_of_slavery_desc: "国家经济发展不能假借于他国之手，在经济上也要彰显我们的自由观点，我们的经济不能被别的国家左右，此后他们想要操控我们国家的经济可不会如此简单了。"
  GER_The_Invisible_Hand: "“看不见的手”"
  GER_The_Invisible_Hand_desc: "正常情况下，市场会以他内在的机制维持其健康的运行。这些机制就像一只看不见的手，在冥冥之中支配着每个人，自觉地按照市场规律运行。市场就在供给和需求之间，根据价格的自然变动，引导资源向着最有效率的方面配置。"
  GER_Recall_liberals: "召回自由派人士"
  GER_Recall_liberals_desc: "国家曾经的自由派人士因受纳粹党的迫害不得不逃亡邻国政治避难，现在我们可以呼吁他们回国，筛选那些有才之士为国效力，他们也能为我们国家改革提供一些帮助。"
  GER_German_Free_Market: "德意志自由市场"
  GER_German_Free_Market_desc: "基督教民主联盟要建立的市场经济是一个不受到政府干预和调控的市场，政府对其只行使最低限度的职能，如维护法律制度和保护财产权。在德意志的自由市场中，财产权在一个买卖双方都满意的价格进行自由交换。"
  GER_Conservative_government: "保守党政府"
  GER_Conservative_government_desc: "德意志保守党是参考圣杯王国保守党建立的，以莱茵兰等德国西部的地方主义者、在海外持保守政见的民主流亡派甚至是保皇党人士为主体匆忙拼凑的政党，不过他们在政治和经济改革上的实用主义看法使其有别于周边尤其是圣杯王国等国家的保守派系。她们不反对甚至相对支持德意志结束独裁时代。但或是处于对国际局势的敏感或是对意识形态斗争的恐惧驱使着她们将重新建成一个能御敌于外的国家作为第一要务。"
  GER_Strengthen_national_narratives: "强化民族叙事"
  GER_Strengthen_national_narratives_desc: "魔导国近二十年的统治政策对于德意志民族认同的破坏性不可谓不大。近年来在首都乃至全国所发生的动乱无一不反映着国家内部存在巨大的社会裂痕。如果我们不想让德意志陷入和奥地利帝国一样的窘境。那么必须再一次否定魔导政权统治德国的合法性所在。魔导王是入侵者，而我们是解放者，理应如此！"
  GER_Unite_the_nation: "团结国民"
  GER_Unite_the_nation_desc: "德意志民族由于魔导国入侵和共产主义与法西斯主义的虚假宣传产生了巨大隔阂，现在我们第一要务就是消除民族间的偏见，将全国国民团结在一面旗帜下。"
  GER_Stability_is_number_one_priority: "稳定是第一要务"
  GER_Stability_is_number_one_priority_desc: "国家几乎被各党派不同的政治观点撕裂，不能再经历剧烈的改革了，优先保持国内的稳定才能维持德国的和平发展。"
  GER_Economic_concessions: "经济特许权"
  GER_Economic_concessions_desc: "对于那些掌权者和资本家，我们要采取怀柔政策，赐予他们经济特许权，允许她们在一定程度上实现行业垄断。让他们能够心甘情愿地支持当局的政策。"
  GER_New_four_year_plan: "新四年计划"
  GER_New_four_year_plan_desc: "政府订下了国家发展的新四年计划的发展规划，这项经济计划力求经济的平稳复苏而非高速增长。"
  GER_Encourage_small_assets: "鼓励小资产"
  GER_Encourage_small_assets_desc: "政府为国内的小资本家们提供一些政策上的支持，鼓励小资产阶级良性发展。"
  GER_German_national_revival: "德意志经济复兴"
  GER_German_national_revival_desc: "德意志民族经济在德意志保守党的带领下再度恢复到了魔导国时期的水平，诚然这尚不足以成为我们引以为傲的成绩，但这势必为德意志共和国重振在欧洲的声势打下良好的基础。"

  GER_Close_to_Third_International: "亲近第三国际"
  GER_Close_to_Third_International_desc: "我们与第三国际的政治目标相似，拉近与第三国际阵营的国家关系，借助苏联和社会主义阵营国家来稳固我们的外交环境。"
  GER_Strengthen_economic_ties_with_Third_International: "加强与第三国际经济联系"
  GER_Strengthen_economic_ties_with_Third_International_desc: "与社会主义国家开放贸易对德国改善经济状况有很大好处，我们会开放与第三国际所有国家的国际市场，促进几国之间经济共同发展。"
  GER_Central_European_fortress: "中欧堡垒"
  GER_Central_European_fortress_desc: "德国是欧洲中部地区最强大的国家，我们的一举一动都牵动着这一地区的政治生态。我们实际上成为了东西方两种意识形态交锋的中欧地区的最前沿。"
  GER_Restore_relations_with_West: "恢复与西方的关系"
  GER_Restore_relations_with_West_desc: "西方国家出于现实主义需要希望我们作为抵御共产主义的桥头堡，而主动希望与我们修好，我们也不希望与西方国家继续复国以来的敌对状态，应与他们恢复正常的外交关系。"
  GER_Join_Council_for_Mutual_Economic_Assistance: "亲近经济互助委员会"
  GER_Join_Council_for_Mutual_Economic_Assistance_desc: "既然已经和苏联恢复了正常的外交关系，我们也可以考虑靠近苏联及其附属国的经济发展体系，跟这些社会主义国家做生意。"
  GER_Accession_to_World_Trade_Organization: "亲近世界贸易组织"
  GER_Accession_to_World_Trade_Organization_desc: "德国不能独立于世界贸易体系之外，就目前来说无论是跟谁贸易都符合德国的利益。"
  GER_promised_land_in_shadow_of_Cold_War: "冷战阴影下的乐土"
  GER_promised_land_in_shadow_of_Cold_War_desc: "无论是东方社会主义的苏联还是西方资本主义的圣杯都具备着毁灭整个世界的能力，在相互忌惮不爆发热战的前提下搞起了意识形态对抗。而德国可以凭借自己的实力可以完全独立于两股势力之外，我们自豪于自己是欧洲人民安居乐业的唯一自由乐土。"
  GER_Europe_for_Europeans: "欧洲人的欧洲"
  GER_Europe_for_Europeans_desc: "欧洲在几百年来一直是世界的主角，但近些年来却连续遭受两次大战的洗礼而元气大伤。每一个欧洲人都应该明白，不能让战争再度在欧洲降临，我们将提议整个欧洲联合起来，要骄傲地告诉全世界：这里是欧洲人的欧洲。"
  GER_European_Coal_and_Steel_Community: "欧洲煤钢共同体"
  GER_European_Coal_and_Steel_Community_desc: "已被两次大战削弱的欧洲国家已经无力单独抵抗来自东欧和北美的庞然大物了，但直接提议建立一个统一的欧洲有些操之过急。德意志的周边的几个国家也对战争之苦感同身受，我们首先应该在几个国家中倡导在煤钢资源上建立煤钢单一共同市场，取消有关关税限制，对生产、流通和分配过程实行干预。"
  GER_European_Economic_Community: "欧洲经济共同体"
  GER_European_Economic_Community_desc: "我们在经济上也要共进退，目标是通过共同市场的建立和各成员国经济政策的逐步接近，在整个共同体内促进经济活动的和谐发展，不断的均衡扩展，日益增长的稳定，生活水平加速提高以及各成员国间越来越密切的关系。"
  GER_EURATOM: "欧洲原子能共同体"
  GER_EURATOM_desc: "原子能是一种极具潜力的新兴能源，我们要在原子能的开发和使用上达成合作，目的是达成原子能源联营及分销共同市场，并可出售剩余原子能源至境外国家。"
  GER_Berlin_talks: "柏林会谈"
  GER_Berlin_talks_desc: "欧洲的各国代表汇聚我国首都柏林，现在是时候开启商讨欧洲的未来了。"
  GER_Start_integration_process: "开启一体化进程"
  GER_Start_integration_process_desc: "苏联和北美已经逐渐开始在国际政治和经济舞台上争演主角，但我们是骄傲的欧洲人，不甘心屈居人下。我们要提议建立关税同盟和建立统一的大市场，开启欧洲的一体化。"
  GER_Establishment_of_European_Union: "成立欧洲联萌"
  GER_Establishment_of_European_Union_desc: "我们欧洲人几百年来历经了无数探索与血泪，披荆斩棘，学会了抛弃彼此之间的成见，重新整合为一个整体，在经济文化政治上结合，最终成立了欧洲联萌。"
  GER_Join_the_free_world: "加入自由世界"
  GER_Join_the_free_world_desc: "以圣杯为首的西方国家与我们德意志的意识形态相似，我们可以与他们联合起来，以抵御来自世界上其他的各种威胁。"
  GER_Guard_against_ideological_infiltration: "防范意识形态渗透"
  GER_Guard_against_ideological_infiltration_desc: "共产主义对于德意志父亲的伤害是难以磨灭的，这种意识形态会煽动我们淳朴的人民，给国家带来沉重的灾难。我们要防止东方那个巨无霸国家对我们的渗透。"
  GER_Berlin_Defense_Treaty: "柏林防御条约"
  GER_Berlin_Defense_Treaty_desc: "为了不单独对抗苏联这一庞然大物，我们要与盟友们协商签订共同防御条约，相约有一国遭到入侵时，其他缔约国家要按照条约共同参战。"
  GER_East_Wall_Plan: "东墙计划"
  GER_East_Wall_Plan_desc: "在我们边境修筑起堡垒与城墙，以防止将来可能到来的苏联的军事入侵。"
  GER_East_West_confrontation: "东西对抗"
  GER_East_West_confrontation_desc: "在欧洲大陆上，西方阵营和东方阵营对峙的局面已经形成。这种局面可能很快就会被打破，也可能会一直持续下去。"
  GER_Defense_plan: "防御计划"
  GER_Defense_plan_desc: "德意志是与东方阵营接壤的最强大的国家之一，相信苏联一定将对德意志的入侵作为重要的战略计划进行准备，相对应的，德意志必须做好准备。"
  GER_Be_proactive: "主动出击"
  GER_Be_proactive_desc: "决不能等着苏联向德意志开第一枪，我们必须要主动出击，将战火烧到他们那里去！"

