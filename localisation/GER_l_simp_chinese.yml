  demGermany.002.title: "今日的最后一份法案"
  demGermany.002.desc: "编号：第414号\n\n内容概括：\n关于国家社会主义工人党的解散程序最终审核\n\n详细内容：\n是否符合基本流程：是\n是否在监督下进行：是\n是否经过党首同意：那发起程序的是谁？\n是否经过三分之二党员同意：是\n（旁边便条：不同意的现在都在牢里蹲着呢！）\n是否完成党内财产清算：是，清算后的财产暂存于柏林银行\n是否违反宪法及相应宪法修正案：现在不违宪了\n是否符合前元首莉莎的愿景：从今天开始就让莉莎见鬼去吧！\n总结：所有流程及审核均无异议，准许该党派解散\n\n签名："
  demGermany.002.a: "£Erika_name"

  demGermany.003.title: "夜半酒馆"
  demGermany.003.desc: "“谁能想到，这个啤酒馆竟然现在还留着。”巴伐利亚的一家小酒馆内，黑衣人一边紧张地望着四周，一边对褐衣人低声说道。\n“是啊，不过留到现在的，也就这个啤酒馆本身而已。”\n褐衣人低下头，有那么一瞬间，她的思绪似乎回到了二十年前：在吧台上声嘶力竭的娇小身影，在台下振臂高呼的狂热群众，在一旁的被随性扫射成筛子的酒桌......如果不是第二天警方的清场行动，说不定她马上就能入驻总理府，开展她的宏图大业。\n“不知道要是她看见国家成了现在这样子会怎么想。”\n“这还用问？”褐衣人拿起酒杯猛灌了一口，“哪怕提到她的名字都要被带走接受调查，当时我们为德意志父亲清理门户时都没这么极端......”\n“然后她们就靠那个所谓的反极端临时法案把门反手全关上了，只能说那个叫艾丽卡的疯婆子办事确实有一手。”\n“既然她们害怕我们的私下活动，那就如她们所愿，在下一次大选中和她们面对面地一较高下。只有我们的归来才能让她们明白，只要德意志民族尚存，我们就绝不会被彻底瓦解。”\n“说起来，上次的会议结果是啥来着？名称有没有定下来？”\n“早定好了，德意志选择党，等我回去再整理整理下材料，天亮之后就把这个名称报备上去。”"
  demGermany.003.a: "阴影仍存。"

  demGermany.004.title: "弗里德里希·哈耶克请求归国"
  demGermany.004.desc: "祖国发生的政治变革在全世界内迅速传播。除开政治领域，柏林重建共和秩序的消息也震动了流亡海外的德意志学术圈。部分德意志流亡学者已经改变了原有态度，愿意结束流亡，重新恢复国籍回到祖国。\n\n按理说我们应当对她们的到来表示欢迎，但其中有一位学者的归国请求却使得我们不得不谨慎对待。曾经离开德国，后被魔导国驱逐，目前在伦敦政治经济学院任教并供职于圣杯皇家学会的奥地利籍经济学家弗里德里希·哈耶克请求重新入籍德意志共和国。此公作为少数对纳粹党改组表现出失望态度的学术代表，在一段时间内曾经不遗余力的贬低新政权，声称新纳粹党“对极权主义、社会主义思潮的妥协退让”是德意志历史性的退步。\n\n其态度的转变突兀的令人生疑——我国情报部门请求搁置相关要求，她们担心这场“回归”可能是圣杯王国又一场意识形态渗透的阴谋。"
  demGermany.004.a: "她不过是想回乡整理属于她们的结晶，我们应当欢迎这么一位学术巨擘回归祖国"
  demGermany.004.b: "无论如何，她的论调实在让人难堪"

