  GER_wehrmacht_modifer: "德意志国防军"
  GER_wehrmacht_modifer_desc: "\n\n\n\n£GFX_idea_wehrmacht_bg\n\n\n\n\n[GER.GetNameDefCap]有着悠久而自豪的军事历史，并以创新思维著称。自从在那次世界大战中遭受羞辱性失败以来，德国总参谋部一直在寻求进一步提高我们的武装力量。凭借这种专业知识，我们的军队准备对任何想要征服我们骄傲人民的敌人发起进攻。"
  GER_wehrmacht_modifer_swap_tt: "§Y$GER_wehrmacht_modifer$§!追加效果："
  GER_Nationale_Volksarmee_modifer: "国家人民军"
  GER_Nationale_Volksarmee_modifer_desc: "\n\n\n\n£GFX_idea_NVA_bg\n\n\n\n\n我们是[ROOT.Getname]国家人民军。\n听！易北河在呼啸，波罗的海在轰鸣。我们是一支特殊的军队。我们头戴着承袭德意志严谨血脉的钢盔，正步踏出普鲁士传统中不可撼动的节奏；但我们的军旗上，闪耀着属于工人与农民的锤子与圆规！我们改写了德意志军人的定义——我们不再是帝国主义扩张的炮灰，而是§R“为了保护工人与农民的政权”§!而筑起的钢铁长城。\n“为了保卫社会主义祖国，时刻准备着！”如果战争在明天爆发，我们将在24小时内撕碎敌人的防线，把胜利的红旗插满北德平原！"
  GER_Nationale_Volksarmee_modifer_swap_tt: "§Y$GER_Nationale_Volksarmee_modifer$§!追加效果："
