  GER_WAR_BREAK_desc: "不死族的对外侵略、我们的归乡战争......惨烈的战争严重摧残了我国的工业与民生，现在整个德国陷入了经济衰退、人民困苦的泥沼。"
  GER_serious_lose_job: "严重的失业"
  GER_serious_lose_job_desc: "多年的战争对德国的民生工业打击很大，整个德国的经济与工业体系完全导向军工，现在的和平却使德国社会出现了大量的失业人口"
  GER_ant_educate: "魔导国殖民教育"
  GER_ant_educate_desc: "虽然魔导国在德国的殖民教育总的来说是失败的，但是仍然存在着部分德奸，推崇不死族可笑的制度。"
  GER_basic_order: "恢复基础秩序"
  GER_WAR_BREAK_1: "战争的摧残"
  GER_WAR_BREAK_1_desc: "不死族的对外侵略、我们的归乡战争......以及,§R莉莎的死亡§!,彻底摧毁了我国的工业与民生，现在整个德国陷入了经济衰退、人民困苦的泥沼。"
  GER_serious_lose_job_1: "严重的失业"
  GER_serious_lose_job_1_desc: "多年的战争对德国的民生工业打击很大，整个德国的经济与工业体系完全导向军工，现在的和平却使德国社会出现了大量的失业人口。\n\n而§R莉莎的死亡§!成为压垮我国经济的最后一根稻草。"
  GER_worst_social: "社会秩序混乱"
  GER_worst_social_desc: "§R莉莎的死亡§!使我国刚刚恢复一点的社会秩序陷入了彻底的疯狂之中。"
