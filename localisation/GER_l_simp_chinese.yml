#设定
  GER_his_page_01_title: "纳粹的崛起"
  GER_Country_History_Page_01: "1925年，德国总统弗里德里希·艾伯特在任上逝世。保罗·冯·兴登堡在1925年德国总统选举第二轮投票中以微弱优势击败德国中央党（魏玛联盟）的威廉·马克思成为德国总统。\n\n1929年的大萧条使德国重返政治动荡。作为总统的兴登堡在认为有必要通过行使权力“恢复稳定”。同时，在被称为秘密顾问团的一众亲信的影响下，日趋衰老的总统兴登堡在权力的行使上开始逐渐偏离宪法，逐渐暴露其君主主义倾向。\n\n1932年6月，总统兴登堡任命保守右派的帕彭为新一任总理，但帕彭在国会仅获得德国国家人民党的支持，而在1932年7月的德国国会选举中，纳粹党获得230个席次成为国会第一大党。帕彭知道内阁继续执政必须得到纳粹党的支持，因而企图说服莉莎接受副总理一职位，但后者觊觎着总理之位，她遭到兴登堡的拒绝。而后以84%国会议员的支持通过了针对帕彭内阁的不信任案。11月国会重新选举，尽管流失了部分选票但纳粹党仍为德国国会第一大党。\n\n帕彭建议解散国会以推迟国会选举，起初兴登堡有意如此，但施莱谢尔与军方并不支持这一做法，故兴登堡改由施莱谢尔接任总理。后者想利用格里哥来分裂纳粹党，但并不成功。随后，面对倒阁危机，他转而再次建议兴登堡紧急解散国会来推迟国会选举，但其最终拒绝。\n\n帕彭为向政敌施莱谢尔报仇，与右翼国家人民党党魁胡根贝格、沙赫特和梯森等德国企业家共同谋划，他们对因选举花费而濒临破产的纳粹党予以资助，联合众企业家向兴登堡提请任命阿道夫·莉莎（时任党魁）为总理。兴登堡同意了提案，由纳粹党与国家人民党联合组阁。帕彭为副总理，胡根贝格为经济部长，弗利克为内政部长及戈林为不管部长等。1933年1月30日在兴登堡总统办公室，阿道夫·莉莎宣誓成为德国总理。\n\n考虑到纳粹党在国会里并不是绝对多数，左翼反对党也竭力阻扰，于是莉莎成功说服兴登堡解散国会重新选举，选举预定在1933年3月初。\n\n1933年2月27日22点，柏林消防队接到消息，§Y国会大厦§!发生火灾。直到23点30分，大火才被扑灭。一个共产党人赤裸着在废墟被找到，而莉莎则称：“这是共产党发动革命的信号”。次日，莉莎在普鲁士新闻公报的电台上发表讲话，称“这种纵火行为是德国布尔什维克进行的最骇人听闻的恐怖主义行径。”3月1日共产党被宣布非法，随即§F冲锋队§!在柏林展开了对共产党人的清洗，共产党人仓皇出逃。4月2日，经过一个月的重整，共产党于慕尼黑发动§R第二次革命§!，而基尔地区的共产党人为响应革命也再次起义，史称“四月二次起义”，而在莉莎四处开始集结军队，准备再一次镇压革命时，一场意外降临了。\n\n"
  GER_his_page_02_title: "柏林耻"
  GER_Country_History_Page_02: "这是又一个平常的午夜，柏林的一切都入往常一样进入梦乡。突然，一声凄厉的长啸划过夜空，随后一群群可怖的骸骨由城外的密林中涌入柏林， “§0骸骨之夜§!”将柏林的一切化为了废墟。在一阵短暂的抵抗后，柏林沦陷，总统兴登堡阵亡，在总理官邸组织反抗的§Y莉莎§!也被其副手希尔击晕，卫队带着她们的领袖仓皇出逃。无数的骸骨逐渐由柏林出发，向着远方的席卷而去。当莉莎再次醒来之时，已经是前往汉诺威的火车之上，总统已经战死，现在§Y莉莎§!就是这个国家最大的领袖，她必须领导德意志。\n\n当§Y莫莫§!在柏林抵抗时，§Y莉莎§!正在汉诺威重新建立指挥、组织军队，缓缓向西北且战且退，希望在西北地区建立稳定的防线，但骸骨军团不知疲倦的追击让她们没有丝毫的喘息。于此同时，带领柏林反抗者们杀出重围的§Y莫莫§!带领着反抗军开始向南部撤离，期间不断聚拢任然在反抗骸骨的人们和离散的军队，在东南方向建立了游击区。\n\n时间很快过去了一年有余，在莉莎的倡导下，一个抗魔§Y德意志民族统一战线§!得以成立，但这明没有使正面战场有所好转，北方战线一退再退，如今只有基尔地区不莱梅地区还在抵抗，南方的巴伐利亚因为与曾经与柏林政府对峙所修筑的堡垒防线让她们得以勉强维持着防线，而在游击区的反抗军因难以获得其他国家和中央政府的援助而兵临崩溃。\n\n 1935年1月1日，反抗军领袖莫莫，在柏林与魔导国领袖安兹.乌尔.恭签订§Y《保卫德意志民族与人民协定法》§!，与侵略者媾和。同年2月，明白反攻无望的莉莎离开不莱梅，将指挥中心迁往家乡奥地利，建立战略后方以图将来，徒留海军部以在瑞典租借的哥德兰岛为基地，在波罗的海牵制魔导国。\n\n"
  GER_his_page_03_title: "维也纳风云"
  GER_Country_History_Page_03: "在此前德国的选举中，§Y奥地利§!一直是§F纳粹党§!的票仓。在柏林危机发生后，大量左翼与中间派离开，随着§Y莉莎政府§!迁往维也纳，奥地利已经成为了纳粹一家独大的天下。到达维也纳后，莉莎仍然维持了德意志国的称呼并暂任临时总统，在如今的紧急状态下总理一切政务。\n\n为了巩固权力与尽快提高实力，莉莎大肆放任§O冲锋队§!并与其他右翼势力合流，但这也给莉莎政权的稳定性埋下了隐患，不过现在却是成效卓著，纳粹党快速掌握了整个奥地利并收拢大量残兵与老兵，并且其主持的§Y黑森峰装甲学院§!也顺利迁往了奥地利。§Y莉莎政权§!成为了这片德意志乱世中仅次于魔导国的势力，并担任着反魔导国统一战线领袖的位置。\n\n1935年8月，彻底掌控奥地利的§Y阿道夫·莉莎§!提出了一项将总统职权暂时中止并转授予总理的法案，该法案将会使莉莎成为德国政治上的§F绝对领袖§!，也成为德国武装力量的最高统帅，德国所有官兵向莉莎宣誓效忠。此法案在德国全民公投中获得89%的选民认同，但违反了威玛宪法与授权法案，该宪法规定由最高法院院长代理总统直至下次选举，至于授权法案特别规定莉莎不得利用任何方法侵夺总统职权；然而现在的德国已无人能反对她，§R莉莎正式实行独裁统治§!。\n\n"

