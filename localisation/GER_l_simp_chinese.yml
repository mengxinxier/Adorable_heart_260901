  demGermany.013.title: "胜利之夜"
  demGermany.013.desc: "胜利的消息伴随着人民的欢呼声传到了基督教民主联盟临时办公点，激动不已的党员们互相拥抱庆祝，他们相信在薇尔莉特地带领下，一个崭新的德意志将会再度屹立在世界之林。\n薇尔莉特对这个好消息没有太大的情绪波动，她独自站在办公室的落地窗前。玻璃映出她挺直的背影，以及——那个永远挥之不去的轮廓。少佐基尔伯特·布甘比利亚的幻影就站在她身后半步的位置，像过去无数次那样，微微低头注视着她。他的军装依旧笔挺，左眼的伤疤在昏暗的灯光下若隐若现。\n“您曾经说过，战争结束后的世界，需要有人去‘爱’。但您从未告诉我，这份‘爱’会如此沉重。”薇尔莉特没有回头，她下意识地轻微摩挲着右臂的金属关节，生怕太大的动作打扰微笑的幻影\n“因为你从来都比我更擅长理解人心，薇尔莉特。”\n砰！窗外的烟花让沉默的薇尔莉特下意识抬头，硝烟味与当初在战壕里闻到的炮火的硝烟没什么不同。但欢呼的人群与回忆里沉默的士兵这强烈的反差让薇尔莉特看向办公室的座钟。“4:13了嘛”幻影不知何时已经消散。她取出口袋里始终携带的少佐的怀表，表盖内侧刻着那句未完成的“我爱你”。灯光直射到怀表上，怀表的金属表面反射出一道刺目的光，像是一道隔开生与死的界限。\n薇尔莉特走出办公室，早已迫不及待的记者带着闪光涌向她。\n“薇尔莉特小姐！艾丽卡元首已经宣布您成功成为新的德意志总理，您现在有什么想对选民说的嘛？”\n“这不是我一个人的胜利，这是我们的胜利！”薇尔莉特在说出我们的时候下意识加重语气，可记者们并没有察觉这微妙的语气。薇尔莉特不再言语，她举起了自己的机械手臂，冰冷的金属在闪光的照耀下发散出更刺眼的光芒。但欢呼的人群并没有在意她的沉默寡言，一心想找大新闻的记者也不在意这位马上上任的总理的举动，因为一阵微风吹动，在驻地周围的紫罗兰花瓣随着微风，通过窗口来到少女面前。一张被誉为德意志闪耀时刻的照片在这一刻定格。身穿标志性的深蓝色制服，胸口缀着祖母绿胸针的少女，举起的机械手臂恰好接住吹进来的紫罗兰花瓣。而基督教民主联盟的党徽，恰好就是金属与花瓣。"
  demGermany.013.a: "德意志迈向新的篇章"

  demGermany.014.title: "骑士总理"
  demGermany.014.desc: "议会广场的巨型屏幕闪烁着最终票数——琴·古恩希尔德，52.3%。保守党的支持者们爆发出海浪般的欢呼，代表保守党的旗帜在夜风中翻涌。而在广场边缘的基督教民主联盟阵营，薇尔莉特静静站立，翡翠色的眼眸倒映着刺眼的数字。她的机械义手微微收紧，金属关节发出几乎不可闻的摩擦声。\n琴在欢呼声中站在高台上，身姿挺拔如剑，嘴角挂着克制的微笑，但指尖无意识摩挲着家族徽章——那是她压力下的习惯动作。薇尔莉特带着基督教民主联盟党员们转身离开，军靴踏过满地传单，其中一张印着基督教民主联盟的口号：“让伤口化作文字，而非枷锁”。\n琴的声音通过扩音器传遍广场：“这不是保守党的胜利，而是全体国民对‘秩序’的选择。基督教民主联盟成员们边走边低声抱怨：“她说的‘秩序’，不过是贵族时代的复辟…” 但薇尔莉特抬手制止了他们。她的声音平静得像淬火的钢：“我们输掉选举，但没输掉立场。文字比子弹更持久。”\n琴看着薇尔莉特的离去，她清楚，艾丽卡元首绝对不会欢迎一个保守党的总理阻挡她的改革计划。她也明白，基督教民主联盟的改革计划也是为了德意志更好地面临未来的风暴，自己的妹妹站在基督教民主联盟立场也有她的暗中授意。但基督教民主联盟太急了。\n琴看着现在欢呼的人群，不由一阵恍惚。古恩希尔德家族作为军事贵族的一员，一直以守护整个德意志为己任，魔导的黑暗没有吞噬她们，流血的政变也没有改变她们。自幼接受的教育让琴明白，贵族并非生来就是一无是处。但基督教民主联盟的改革试图将整个贵族阶级埋葬，拿德意志传统的消逝为她们的野心加冕，这便是琴绝不能允许的。\n“有人批评我过于保守，有人说我想‘复辟旧时代’。但真正的保守，是守护那些让德意志存续至今的东西——不是贵族的冠冕，而是面包匠清晨揉面的双手，是母亲教会孩子的第一首童谣。是骑士为民众举起的佩剑。”说着，琴举起一封泛黄的信，信封上有火漆印的蒲公英图案。“这是一位士兵在战壕里写下的家书，他只问了一句话：‘家乡的苹果树开花了吗？我的责任，就是让这样的问题永远不必再诞生于硝烟中。”琴将信收回胸前口袋，展开双臂：“若您曾反对我，我请求一个证明自己的机会；若您曾支持我，请记住——此刻起，我的权力来自您的监督。以古恩希尔德之名，我承诺：当四年后再次站在这里，德意志的黎明将不再需要‘胜利者’。”说完，琴深深鞠躬，狂风骤起，吹散讲台上的蒲公英种子——这是她提前安排的政治象征。"
  demGermany.014.a: "风暴面前，唯保守者屹立不倒"

  demGermany.015.title: "变革之风"
  demGermany.015.desc: "今天，人们欢聚一堂，庆祝基督教民主联盟的执政承诺——德意志自由市场彻底构建完成。事实上，这个承诺大部分人都是当笑话听的，在一个贵族把持土地；保守势力庞大的国家构建自由市场，简直就是做梦！但薇尔莉特带着党员们做到了。在人们的欢呼声中，薇尔莉特缓步走向演讲台。\n“我知道，在这一天到来前，许多人因为当初圣杯经济危机的惨剧而害怕自由市场，但是，德意志人民从来都是迎难而上的。我们不会因为恐惧，放弃对魔导的复仇，不会因为恐惧，放弃对民主的坚持。今天，所有人都欢呼吧！我们做到了！我们胜利了！”薇尔莉特大声嘶吼。\n许多人第一次见到这位时刻保持冷静的总理这么激动，但都无所谓了，大家欢呼着，齐唱德意志国歌。歌声中，有小孩稚嫩的童音；女人高声的合唱；男人低声的叫喊；老人嘶哑的哭腔。是啊，德意志，她过的太痛苦了，持续不断的战争就是一道道难以愈合的伤疤，所有德意志人都能感同身受，外敌的欺辱，内乱的痛苦让德意志人麻木了，她们都快忘记作为日耳曼民族的骄傲了。但今天，一切都结束了。自由市场的建立，让无数人看见了希望，让无数人吹到了改革之风。\n薇尔莉特让手下带上一台复印机。然后，在众人的目光中，将一张信件不断复制，并扔给所有人。“这是以前某位保守派贵族写给我的信，声称‘自由市场会导致混乱。’现在，请用它包苹果、折纸船，或者——”\n她突然撕碎原件\n“像这样，让旧时代的恐惧彻底消失！”无数市民自发举起交易凭证、专利证书和劳动合同，在灯光下形成一片银色的海，这场变革之风并没有停下，它会不断吹拂，直到成为碾碎一切的风暴！"
  demGermany.015.a: "新的风暴已经出现"

  demGermany.016.title: "致蒲公英骑士"
  demGermany.016.desc: "《致蒲公英骑士》\n——写在民族复兴完成之日\n作者：琴·古恩希尔德（德意志总理）\n发表载体：《西风日报》头版专栏 | 时间：执政周年纪念日\n【题记】\n“蒲公英的种子终将落地，但风会记得每一段旅程。”\n【正文】\n在大选公布的那天晚上，我佩戴着蒲公英骑士勋章，站在广场中央宣誓就职。\n那时有人问我：“一个骑士，如何治理国家？”\n我没有回答。\n今日，德意志中央广场的喷泉边，三个孩子正在用木剑争夺“最佳骑士”的称号——他们的剑术糟糕透顶，但喊出的誓言字字清晰：\n“守护祖国，至死方休！”\n原来答案如此简单。\n复兴计划启动时，内阁曾为“传统”的定义争吵不休。老派贵族要求恢复世袭爵位，商人群体则主张彻底埋葬过去。直到某天巡视农场，我看见一位老农跪在焦土里，颤抖的手捧起一株蒲公英。“这是战前最后一批种子，”他说，“我藏了几年。”现在，那片土地被称为“希望原野”，种植着改良后的耐旱蒲公英。其纤维制成的布料，正出口至巴黎作为高级礼服原料。\n（注：该案例被收入《国家产业振兴白皮书》第一章）\n上周签署《军事改革令》时，我的钢笔突然漏墨，污损了“裁军30%”的数字。助理惊慌失措，我却想起您——尊敬的蒲公英骑士前辈。您曾在日记里写道：“墨渍像伤痕，提醒我们承诺的重量。”\n如今旧时代的骑士团转型为警察部队，旧铠甲熔铸成耕犁。但训练场上的铜钟依然每日清晨六点鸣响，比议会时钟还准。有些传统，本就不该存在于条文里。今早路过教堂广场，听见唱诗班在排练新歌：“风啊，请将我们的故事带给远方...”曲调分明是芭芭拉的手笔，歌词却用了五百年前的《远征民谣》。基督教民主联盟文化部长在一旁得意地笑：“传统和革新，本就可以同频共振。”我忽然理解了薇尔莉特当年的话：“文字比子弹持久。”——她现在正忙着把这首曲子注册成德意志商标。随信附上一包新培育的“守望蒲公英”种子。它们能在混凝土缝隙中生长，花期长达八个月。农业部建议命名为“古恩希尔德1号”，我坚持用了您当年的骑士箴言：\n“生于风暴，守望黎明。”\n【落款】\n您不成器的后继者\n琴·古恩希尔德\n于总理办公室"
  demGermany.016.a: "骑士高喊着，冲向那想象中的巨人！"

