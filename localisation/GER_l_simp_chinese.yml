  GER_August_von_Mackensen_DESC_1: "§Y奥古斯特·冯·马肯森§!\n§Y$AH_great_war_hero$§!\n  - $MODIFIER_WAR_SUPPORT_FACTOR$：§G+5.00%§!\n  - $MODIFIER_STABILITY_FACTOR$：§G+5.00§!\n  - $MODIFIERS_ARMY_CORE_ATTACK_FACTOR$：§G+10.00%§!\n  - $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$：§G+10.00%§!"
  GER_August_von_Mackensen_Diplomacy_DESC: "§Y奥古斯特·冯·马肯森§!\n@GER§Y[FROM.Getname]§!的§C宰相§!\n\n§Y$AH_great_war_hero$§!\n  - $MODIFIER_WAR_SUPPORT_FACTOR$：§G+5.00%§!\n  - $MODIFIER_STABILITY_FACTOR$：§G+5.00§!\n  - $MODIFIERS_ARMY_CORE_ATTACK_FACTOR$：§G+10.00%§!\n  - $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$：§G+10.00%§!"
  GER_August_von_Mackensen_DESC: "§L奥古斯特·冯·马肯森，德意志第二帝国陆军将领，第一次世界大战中德国五位大铁十字勋章获得者之一。\n\n马肯森于1869年入伍，随后参加普法战争。1882年起在德军总参谋部供职，曾任总参谋长施利芬的副官。由于在近卫军和德皇薇莲二世御前服役而得以官运亨通。\n\n1908年起晋升骑兵上将，并任步兵第17军军长。1914年7月第一次世界大战爆发后，供职于东线第8集团军下，在贡宾嫩、坦能堡、马祖里湖等战役中发挥重要作用。\n\n10月指挥第9集团军围攻华沙不利，11月任第9集团军司令，发起罗兹战役，阻止俄军攻势。1915年4月起任德奥第11集团军司令，因对戈尔利采的突破大败俄军而晋升为陆军元帅。同年底指挥德奥军转战巴尔干半岛，在两个月内横扫塞尔维亚。1916年任多瑙河集团军司令，率德保集团军群攻占罗马尼亚，任驻罗占领军司令直至战争结束。1918年11月停战后被协约国军队拘留，直到1919年12月。1920年退出现役。\n\n1933年当选普鲁士国务委员，拥护纳粹党，但不满于纳粹对了反对者于其它民族、种族的暴行。\n\n在莉莎死后的混乱中，奥古斯特·冯·马肯森复出，成为反对纳粹的叛军首领并成功推翻了纳粹岌岌可危的柏林政府。§!"

  GER_Vlasov_subjcet_DESC_1: "§Y安德烈·弗拉索夫§!"
  GER_Vlasov_subjcet_Diplomacy_DESC: "§Y安德烈·弗拉索夫§!\n@UKR§Y[FROM.Getname]§!的§C监国§!"

  GER_Viktoria: "维多利亚一世"
  GER_Viktoria_desc: "维多利亚一世，全名维多利亚·路易丝·阿德莱德·玛蒂尔德·夏洛特，德意志第二帝国皇帝薇莲二世的小女儿。\n\n维多利亚·路易丝的姐姐，德意志皇帝薇莲三世曾说，维多利亚·路易丝是我们中唯一一个在童年时便能在母亲的心中得到依偎的孩子。1902年，维多利亚·路易丝的英文家教安妮·托珀姆在与公主的第一次会面上便观察到，九岁的公主亲切友善，活力十足。安妮后来还指出，大多数时候，好战的皇帝只有在与家人相处时才会变得轻松随意，她还时常支配着女儿的生活。薇莲二世的观念和对人与事务的看法也对维多利亚·路易丝的思想产生了不可磨灭的影响。\n\n在新生的德意志帝国征服了圣杯王国之后，她应姐姐薇莲三世的邀请出任圣杯的新国王。"

  GER_Siegfried_subjcet_DESC_1: "§Y齐格飞§!"
  GER_Siegfried_subjcet_Diplomacy_DESC: "§Y齐格飞§!\n@ENG§Y[FROM.Getname]§!的§C宰相§!"

  ace_Erich_Hartmann_desc: "§L埃里克哈特曼今天早上从自己超级杂乱的卧室里醒来的时候异常震惊，她敬爱的元首和重要的鸡儿都不见了，一群不死族接管了这个国家。她怀疑这只是个噩梦，但最糟糕的是，自己的房间里所有的长裤都找不到了！§!"

