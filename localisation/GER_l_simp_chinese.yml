  GER_mefo_bills: "梅福券"
  GER_mefo_bills_desc: "梅福券是亚尔马·沙赫特为政府重整军备筹资而启用的票据。它透过“冶金研究公司”的账目名义运作，将在国库空虚的情况下快速重整军备。这些票据须被延期六个月，否则到期时将不得不偿付票据持有人。"
