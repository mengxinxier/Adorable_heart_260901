##新闻
 #奥地利
  austria_news.01.t: "$news_event_background$磷叶石遇刺"
  austria_news.01.d: "昨日傍晚，磷叶石在布拉迪斯拉发的圣马丁穹顶大教堂外进行公开演讲时遭到枪击，十几发大威力枪弹将这位摄政王直接打成了齑粉。\n尽管警方当场控制住了行凶者，但令警方绝望的是，行凶者是从捷克涌入斯洛伐克的难民之一，更是一位曾经在精神病院待过至少十年的精神病患者，无法正常进行交流。其持有的大威力手枪也是当地黑市的常客之一，根本无法进行溯源。\n今天清晨时分，宝石之国已宣布国家进入紧急状态。"
  austria_news.01.a: "这是必要的牺牲。"
  austria_news.01.b: "一定快找出凶手！！！"
  austria_news.01.c: "太野蛮了。"
  austria_news.02.t: "$news_event_background$德意志国出兵宝石之国"
  austria_news.02.d: "宝石之国的动乱已经持续了整整数月。正当国际观察员们都在猜测宝石之国的未来何去何从之时，德意志国突然高调宣布“愿意不惜一切代价保护宝石之国境内饱受苦难的人民们”，并派遣了军队越过边境，向布达佩斯进发。\n在当晚召开的记者发布会上，现任元首阿道夫·莉莎声称：“在旧时，德意志国和宝石之国就已情同手足。德意志国有义务，有责任，也有意向保护宝石之国及她的人民们免受一切侵害。”\n截至目前，德意志国已经占领了宝石之国全境。有小道消息称莉莎正在制定一项关于精神病患者收治的法律草案。"
  austria_news.02.a: "团结一致！"
  austria_news.02.b: "难道她们也怕精神病不成？"

  austria_news.03.t: "$news_event_background$德意志归来"
  austria_news.03.1: "自从柏林被不死族占领，德国政府流亡奥地利以来，已经经过了数年。在经历了无数的困难与挫折，德国政府终于战胜了她的敌人，将不死族驱逐出了柏林，重新建立起属于人类的德意志国家。\n不过如今不死族并未从地球上完全驱逐，德国将采取什么样的策略来对待她的宿敌，还不得而知。"
  austria_news.03.2: "自从柏林被不死族占领，德国政府流亡奥地利以来，已经经过了数年。在经历了无数的困难与挫折，德国政府终于战胜了她的敌人，将不死族驱逐出了柏林，重新建立起属于人类的德意志国家。\n如今不死族被完全驱逐出地球，站在魔导国废墟上的是新生的德意志国，她将采取何种外交态度来对待曾经一同与不死族战斗的盟友和其她的地球国家，目前德意志政府还未做出承诺。"
  austria_news.03.a: "这是祖国父亲的胜利！"
  austria_news.03.b: "至少.......不死族被打败了，不是吗？"

  austria_news.04.t: "$news_event_background$地堡中的“新元首”"
  austria_news.04.desc: "当[ROOT.Getname]的军队来到前奥地利首都的一处地堡时，发现了纳粹党的两名的核心人物--阿道夫·莉莎与希尔。\n据现场的士兵回忆，她们看到莉莎手握手枪，倒在血泊中，希尔失神地坐在地上，看着莉莎的尸体。\n希尔作为莉莎指定的“新元首”，正式宣布奥地利投降，现在希尔被关押在[ROOT.Getname]的监狱中。"
  austria_news.04.a: "或许我们可以设法让她加入我们。"
  austria_news.04.b: "纳粹早该死一死了。"

  austria_news.05.t: "$news_event_background$轴心国介入大战"
  austria_news.05.desc: "昨日，随着德意志国与魔导国的边境军队的交火，轴心国与帝国阵线的战争正式爆发，这也标志着轴心国加入了第二次“伟大战争”。\n时隔数年，德意志国的流亡者们再次举起武器向侵略者反击，阿道夫·莉莎也发表声明，全地球应该联合起来对抗魔导国，这是一场“正义之战”。而魔导国方面则宣称奥地利不过是叛乱省份，奥地利的叛徒必须被绳之以法。"
  austria_news.05.a: "柏林！柏林！"
  austria_news.05.b: "这些余孽早该被清除了。"
  austria_news.05.c: "我们将团结一致。"
  austria_news.05.d: "我们的盟友增加了。"
  austria_news.05.e: "祝她们好运。"

  austria_news.06.t: "$news_event_background$多瑙河冲突"
  austria_news.06.desc: "外莱塔尼亚的政治冲突正在以令人难以想象的速度演化为地缘矛盾，在履行了与斯连教国的密约之后，德意志国悍然入侵了宝石之国边境。并将其纳入自己的统治体系之下。不幸的是，巴尔干南部的政治动荡使得这场入侵相当容易，德意志军队如入无人之境。\n似乎没人看好宝石之国的前景，已经开始出现轴心国掌握宝石的工业与军事，反魔导国的力量进一步增强。"
  austria_news.06.a: "我们不这么做，我们的敌人也会如此"
  austria_news.06.b: "誓死抵抗！"
  austria_news.06.c: "我就说德国人没安好心吧"
  austria_news.06.d: "抗议！这是对主权国家自由的践踏！"
  austria_news.06.e: "又有一个国家要死在法西斯的铁蹄之下了"

 #纳粹
  germany_news.01.t: "$news_event_background$响彻世界的一枪......"
  germany_news.01.d: "昨日，德意志帝国的元首阿道夫·莉莎如往日一样在柏林的街头演讲，一名身着灰色T恤和卡其色速干裤，身背斜挎包、戴口罩的男子从后方接近了莉莎一行。莉莎中枪前，她站立在其右后方，不断向四周张望。莉莎演讲刚开始后不久，该男子从后方约3米处射出两枪，两枪均击中莉莎。\n犯人被警卫当场制服，令在场的所有人都瞠目结舌的是，犯人是魔导国留下的魔法傀儡！\n莉莎在中枪后被立刻送上救护车,在经历了一天一夜的抢救之后，医生不得不向全世界宣布这个令人悲痛的消息：莉莎元首告别了她亲爱的祖国与人民。\n由于整个新德国都是围绕着莉莎的个人魅力而团结在一起的，现在莉莎的死再一次令全德国陷入混乱之中......"
  germany_news.01.a: "莉莎，我的莉莎，呜呜呜......."
  germany_news.01.b: "太野蛮了。"

  germany_news.02.t: "$news_event_background$德国革命被镇压"
  germany_news.02.d: "德国元首莉莎死后，德国陷入了严重的动乱之中，德国共产党趁机发动革命，在经历了剧烈的内战之后，旧德国政府取得了内战的胜利。\n[GER.GetLeader]已经宣告了德国内战的结束和德国将在未来面临长期的重建与和平。[GER.GetLeader]能否接替莉莎，团结好德意志的百姓，还是说......再次分裂？"
  germany_news.02.a: "该死的赤匪。"
  germany_news.02.b: "流血千里但是毫无变化。"

  germany_news.03.t: "$news_event_background$大德意志统一"
  germany_news.03.desc: "自从1934年德国政府流亡奥地利以来，她们历经无数的艰难险阻，战胜了一个又一个德意志的敌人，将国家从不死族手中拯救出来，在废墟上重建她们伟大的祖国。\n在德国重建之后，经历了复苏与对外战争，德国人终于骄傲地宣布，大德意志已经统一，连接德意志人的不再是语言，更是不可分割的领土。\n[GER.GetLeader]于今日宣布了大德意志的统一，并且将统一后的国号正式定为[GER.Getname]。"
  germany_news.03.a: "日耳曼人，我们为我们的祖先的荣耀而战！"
  germany_news.03.b: "为我们的朋友庆贺"
  germany_news.03.c: "恶魔的崛起"

  germany_news.04.t.1: "$news_event_background$地堡中的元首"
  germany_news.04.desc.1: "当[ROOT.Getname]的军队来到前奥地利首都的一处地堡时，发现了纳粹党的党魁与德国的元首--希尔。\n据现场的士兵回忆，希尔失神地坐在地上，看着显示着战争一片劣势的战略地图。\n希尔作为[GER.Getname]的元首，正式宣布[GER.Getname]投降，现在希尔被关押在[ROOT.Getname]的监狱中。"
  germany_news.04.t.2: "$news_event_background$地堡中的“新元首”"
  germany_news.04.desc.2: "当[ROOT.Getname]的军队来到前奥地利首都的一处地堡时，发现了纳粹党的两名的核心人物--[GER.GetLeader]与希尔。\n据现场的士兵回忆，她们看到[GER.GetLeader]手握手枪，倒在血泊中，希尔失神地坐在地上，看着[GER.GetLeader]的尸体。\n希尔作为[GER.GetLeader]指定的“新元首”，正式宣布奥地利投降，现在希尔被关押在[ROOT.Getname]的监狱中。"

  germany_news.05.title: "$news_event_background$苏联宣布反德备战"
  germany_news.05.desc: "曾经，苏联曾是德国坚定的盟友，支援过德国的反攻大业，她们曾是亲密无间的盟友。在德国政府凯旋柏林之后，苏德之间共同的敌人已经消失，意识形态问题逐渐摆上台面，苏德的友谊急剧下降。\n\n就在前不就[GER.GetLeader]宣布了反苏的外交政策之后，苏德的外交关系降至冰点。苏联迅速撤回了在柏林的大使以及其它外派人员。\n\n今日，[SOV.GetLeader]宣布了[SOV.Getname]的反德政策，并宣称“红军正在整备，大雷雨即将到来”。"
  germany_news.05.a: "是时候让德国佬知道谁是老大了。"
  germany_news.05.b: "德意志的战车不惧任何敌人。"
  germany_news.05.c: "好死，狗咬狗的丑态"
  germany_news.05.d: "大国之间的信任是如此脆弱"

  germany_news.06.title: "$news_event_background$大雷雨行动"
  germany_news.06.desc: "随着苏联军队跨过苏德边境，自魔导国时代便携手共进的两国几乎顷刻间便兵戈相向。苏联方面宣称这场军事行动是为了’维护反魔导国战争的胜利果实不落入别有用心的独裁者之手。‘但世人皆知这场战争的原爆点来自德国政府新近拟定的反苏政策。\n东欧两大政权的兵戈相向无疑是给行将熄灭的伟大战争之火浇上一锅热油。不过对于西方的民主主义世界，这未尝不是一件好消息——至少祸水东引的愿景实现了。不过等到这场巨人间的大战决出胜负。总有人会为她们的短视付出代价。"
  germany_news.06.a: "我们将驱散欧洲上空的黑云！"
  germany_news.06.b: "布尔什维克永远不可信任"
  germany_news.06.c: "好死，狗咬狗的丑态"
  germany_news.06.d: "大国之间的信任是如此脆弱"

  germany_news.08.title: "$news_event_background$希尔稳定德国秩序"
  germany_news.08.desc: "在德意志人的解放者莉莎突然离世之后，纳粹党在混乱的阴云下开始崩溃，原副元首希尔紧急接任临时元首一职。\n\n在以雷霆手段粉碎了戈培尔的阴谋、镇压了全国左派与自由派的叛乱之后，希尔已经成为了名副其实的“元首”。\n\n在为前元首莉莎举行国葬后，希尔正式出任德意志国的第二任元首，在其就职演讲中，她强调德意志将继续坚持莉莎的路线不动摇，她承诺将给每个德国人带来“面包、牛奶与德国失去的一切”。"
  germany_news.08.a: "元首万岁！"
  germany_news.08.b: "反动派的力量过于强大了。"
  germany_news.08.c: "毫无疑问，这将是一个危险的信号。"
  germany_news.08.d: "我们或许可以成为朋友。"
  germany_news.08.e: "希望我们不是她们的下一个目标。"

  germany_news.09.title: "$news_event_background$党卫军掌控柏林事务"
  germany_news.09.desc: "就在各国都以为德意志国的政权已经随着莉莎元首的下葬平安交接之时，如雪花般繁杂的来自柏林的各国通电向世界传达了发生在德国境内的政治巨变：希尔在肃清戈培尔叛乱分子的时候似乎被一位纳粹党员所刺杀，目前掌管着柏林城内与周边卫军的党卫军总司令舞缇娜目前已通电宣布将临时接替元首一职，并宣布在刺杀希尔元首的凶手落网之前，柏林政府将在整个德国的范围内进行搜捕行动。尽管柏林总参谋部对相关行为表现出极大的抵触情绪，但柏林中央并无行政人员对此表示任何异议，各个地方政府反应也颇为平静。尽管这位傲慢，并不为人所尊敬的党卫军头子树敌众多，但对于她的敌人来说，此刻除了眼看党卫军正式入主柏林以外，他们什么都做不了。"
  germany_news.09.a: "至少...国家稳定了......"
  germany_news.09.b: "我们很清楚她会试图做什么，做好准备！"
  germany_news.09.c: "德意志的人民让这么一个佞臣当他们的主子？"
  germany_news.09.d: "这下，小人之心，天下昭之。"
  germany_news.09.e: "德意志的人民让这么一个佞臣当他们的主子？"

  germany_news.10.title: "$news_event_background$国防军攫取柏林至高权力"
  germany_news.10.desc: "在德意志人的解放者莉莎突然离世之后，纳粹党在混乱的阴云下开始崩溃，在镇压了来自党宣传部门的党卫军叛乱后，德意志国元帅迈耶宣布继任德意志国元首，终结了关于纳粹党后继者的争论。据信这位与国防军阶层交流甚密的党内官僚选择引狼入室，德国纳粹党僚的话语权遭到重大打击。由她们的领袖莉莎构建起的民族主义政权在新的贵族官僚入主柏林的情况下已然名存实亡。\n\n毫无疑问，一个不依赖于任何旧日遗产的军政府将会被建立。得益于进一步冲突的避免，德意志地区的重建工作目前进展顺利，这个新的独裁政权也许在短时间内就可能将成为欧洲大陆上一个新的但更加难以捉摸的威胁。"
  germany_news.10.a: "大元帅，我来啦！"
  germany_news.10.b: "她们绝对不是我们的朋友......但她们是否会是敌人？"
  germany_news.10.c: "她们绝对不是我们的朋友......但她们是否会是敌人？"
  germany_news.10.d: "我们将会得到一个更加务实的......朋友？"
  germany_news.10.e: "一个军阀统治下的德意志国？有趣。"

  germany_news.11.title: "$news_event_background$勃兰登堡之变"
  germany_news.11.desc: "根据柏林一线的各国记者与外交使节传回的第一消息，德意志宣传部长戈培尔带领着众多纳粹党员组成的卫队与部分变节的党卫军在莉莎元首的葬礼上刺杀了临时执政的希尔与其拥趸。目前在党内群龙无首的情况下戈培尔如愿宣誓成为德意志国新的元首，各地方政府目前对此并无异议，这场昭然于德意志的政变甚至没有在柏林城区之外遭遇些许阻力。\n\n就目前来看这位宣传部长要做的事情还很多，大多数地方已经沦为半自治状态，重新组建中央政府与恢复各地的生产工作可能都将在未来数月成为新政权处事的重中之重。值得一提的是，在近期发表的公开演讲上，他毫不掩饰的表明自己与纳粹党内另一位元老的合作关系——臭名昭著的法西斯党徒斯特拉瑟结束了失败者的隐居生活，他开始频繁出现在近期组织的演讲中，并且似乎已经时刻准备好将他自己的那一套理论再一次搬上舞台。"
  germany_news.11.a: "我们将回归“国家社会主义”的本源"
  germany_news.11.b: "这算什么？又一个“社会主义者”？"
  germany_news.11.c: "一个疯子和小丑的二人戏？有趣。"
  germany_news.11.d: "向她们传达我们的致意。"
  germany_news.11.e: "一个疯子和小丑的二人戏？有趣。"

  germany_news.12.title: "$news_event_background$德意志帝国复辟"
  germany_news.12.desc: "在柏林内乱持续了整整数周之后，意想不到的结果出现了：保皇派在对现状忍无可忍的民众们的支持之下击败了其她所有的争权势力，控制了柏林市区的绝大部分区域。尽管还有时不时零星的暴力冲突报告传来，但在驻柏林的各大记者们看来，内乱已经结束，保皇派的胜利已成定局。\n而意外中的意外是，尽管保皇派们做足了万全准备，但红魔馆的特使带来的薇莲二世逝世的消息还是让她们乱了阵脚。在经过仓促的讨论之后，薇莲二世的皇女——薇莲三世于柏林城市宫登基，正式加冕为德意志帝国皇帝，德国也正式改国号为[GER.Getname]。\n迄今为止，[GER.Getname]政府并未对外发表任何外交辞令，柏林的重建工作也已开始。对此，国际观察员们保持观望态度。"
  germany_news.12.a: "纳粹辜负了德国太多，陛下将拯救我们！"
  germany_news.12.b: "暴君的统治终结了......但苦难远未结束。"
  germany_news.12.c: "这是对民主和自由的二度践踏！"
  germany_news.12.d: "她们正试图让整个德意志重蹈过去的覆辙！"
  germany_news.12.e: "这年头流行搞复辟么？"

  germany_news.16.title: "$news_event_background$德意志之死"
  germany_news.16.desc: "德国的疯狂行动暂时停止，据说“时间之钟”计划失败了。德国人惶惶不可终日地生活在无数秘密警察的阴影下；生存在德国总督区统治下的人们在废墟中艰难地求生着；尚未被入侵的国家恐惧地看着这个怪物，害怕变成她的下一个目标。\n\n可是，逐渐地，来自的德国的无线电信号越来越弱了，高空中也不在看得到日耳曼妮娅明亮的灯光，德国的边境上出现一群患有不明疾病的人群希望过境。\n\n毫无疑问，德国“死了”。德意志境内现在已经没有了一丝无线电信号，幸存的患者们疯了似的偷渡、强闯海关。周围的邻国以及总督辖区已经下令封锁了边境，对患有相似症状的人各种屠杀。\n\n德意志死于不明瘟疫。"
  germany_news.16.a: "（无线电嘈杂声）"

  germany_news.17.title: "$news_event_background$纳粹在德国倒台"
  germany_news.17.desc: "在柏林内乱持续了整整数周之后，意想不到的结果出现了：自由派在对现状忍无可忍的民众们的支持之下击败了其她所有的争权势力，控制了柏林市区的绝大部分区域。尽管还有时不时零星的暴力冲突报告传来，但在驻柏林的各大记者们看来，内乱已经结束，自由派的胜利已成定局。\n\n在经历了数日的紧急会议的谈论后，自由派军官逸见艾丽卡将成为新的元首，接管全德国的纳粹残余势力，同时薇尔莉特·伊芙加登担任元首副手，她们在就职演讲上宣布，她们将逐渐改变纳粹的出格政策，并逐渐把德国改革为一个正常的国家。\n\n尽管德国仍然保留了元首等纳粹时期的行政体系，但是各国观察家的意见已经达成了一致，纳粹已经在无形中倒台，德国的民主化将会到来。"
  germany_news.17.a: "思想是自由的，没有囚笼可以囚禁！"
  germany_news.17.b: "暴君终尝恶果。"
  germany_news.17.c: "我们可以开始考虑下一步的合作计划了。"
  germany_news.17.d: "她们背叛了莉莎的遗志！"
  germany_news.17.e: "她们还会侵略别国吗？"

 #蓝德
  demGermany_news.001.title: "$news_event_background$莱茵兰走向民主化"
  demGermany_news.001.desc: "拒绝了来自幻想乡的再三挽留，今日莱茵兰当局正式宣布自身已经完成了西方盟国强加其身的民主化任务。这意味着莱茵兰地区将没有理由继续履行非军事化政策。她们与幻想乡共和国不清不楚的附属关系也就此终止。幻想乡的[FROM.Getleader]对民主化的结果表示遗憾，但其同时也警告称莱茵兰政府的行为是’短视而无意义的‘。这许是幻想乡承认失去莱茵兰地区前最后的愤懑之语。但从东方愈发迫近的军事威胁无疑暗示着这一论调不无道理。毕竟民主化的结果无关紧要，能否保卫这份民主才是重中之重。"
  demGermany_news.001.a: "阅"
  demGermany_news.001.b: "我们会击溃她们"
  demGermany_news.001.c: "思想是自由的，没有囚笼可以囚禁！"
  demGermany_news.001.d: "看来我们之前必有一战了"
  demGermany_news.001.e: "看来幻想乡彻底失去莱茵兰了。"

  demGermany_news.002.title: "$news_event_background$基民盟重返柏林"
  demGermany_news.002.desc: "在希尔与舞缇娜的种族清洗计划宣告破产后，由旧共和国议会成员组成的多党联盟与国防军维持和睦并成功于上月达成协议。在于国会大厦召开的临时议会上，民主党与重建的社会民主党人士达成了组建联合政府的共识，基督教民主联盟将会领导起这个新生的——或者说重生的共和国度。\n尽管魏玛共和国时代的恶劣印象在公众心中仍然挥之不去，但已经宣布就任民主党党魁与共和国第一任总理的薇尔莉特·伊芙加登在就职典礼上仍然用温和的语气向民众阐述了自己对代议制的信心。并强硬的宣称新政权这一次会将所有的政治极端分子一劳永逸的从德意志境内驱逐出去。不管怎么说，随着被魔导国入侵者和莉莎的民族主义者所放逐的遗老人物在柏林奇特的重新聚首，旧时代正无可避免的在向德国人民招手。\n薇尔莉特出身成谜，早年作为儿童兵被卷入战乱，后因内战晋升为精锐部队指挥官。其标志性的银色长发与机械双臂（因战场重伤后装配）成为坚韧的象征，士兵间流传她“单手拆解敌军坦克”的传说。战争末期，她主动斡旋各方停火，并转型组建基民盟，主张“非军事化优先”与“自由市场法案”。\n分析人士指出，她的胜选得益于战后一代对传统政党的厌倦。选民尤其青睐其“自由斗士”的奋斗形象。"
  demGermany_news.002.a: "能够真正改变世界的东西从都不是所谓强大之伟力。"
  demGermany_news.002.b: "德意志人的奋斗终究功亏一篑。"
  demGermany_news.002.c: "我们绝不能容忍这群王公老爷的复兴！"

  demGermany_news.003.title: "$news_event_background$社会民主党的第二次胜利"
  demGermany_news.003.desc: "尽管社会民主党的成功在魔导国的入侵面前显的无关紧要，大多数左翼人士更是在至暗时刻背弃了她们的同僚并最终自取灭亡。但是法西斯党人在胜利后一系列倒行逆施且自毁长城的举措为他们提供了机会。面对希尔愚蠢而残酷的种族清洗政策，重新鼓起勇气，抖擞精神的社会民主主义者在一位年轻的左翼魔女——伊蕾娜的带领下与众多反法西斯力量一起与柏林政府分庭抗礼并最终赢得胜利。尽管双方分歧甚多，但在临时组建的共和国议会上社会民主党人赢得多数，并将组建属于这个新生的共和国最初的行政班子。作为新兴的社会民主党的党魁，这位年轻的领袖在就职典礼上誓要在东西方的威迫之下捍卫新共和国的主权，并且让德意志共和国成为“第三道路”在欧洲大陆上最为坚定的桥头堡。如果战争无法避免，她们将会为德意志乃至整个欧罗巴人民的福祉而战。"
  demGermany_news.003.a: "能够赢得人民之心的，永远是关于善意与爱的命题。"
  demGermany_news.003.b: "德意志人的奋斗终究功亏一篑。"
  demGermany_news.003.c: "我们绝不能容忍这群王公老爷的复兴！"

  demGermany_news.004.title: "$news_event_background$保守党赢得德国选举"
  demGermany_news.004.desc: "【首都讯】 在刚刚结束的全国大选中，保守党领导人琴·古恩希尔德以54.7%的得票率击败基民盟与社会民主党，成为共和国战后首位由军事贵族转型的总理。这位曾以“蒲公英骑士”闻名的军人，在胜选演讲中强调“法律、责任与信仰”的重要性，标志着这个饱受战火摧残的国家正式进入保守主义主导的重建阶段。\n琴·古恩希尔德出身于历史悠久的古恩希尔德家族，该家族世代效忠国家传统秩序。在内战期间，她作为军事长官，以严明的纪律和高效的指挥能力稳定了地区的局势，并成功促成多方停火协议。战后，她脱下戎装，组建保守党，主张“恢复法治”与“重建道德权威”，迅速赢得中产阶级与农村选民的支持。政治学者指出，她的胜选反映了民众对战后混乱的厌倦——“人们渴望一个能带来安全感的领导者，而琴的骑士精神与务实作风恰好符合这一期待。”经济学家担忧其政策可能增加财政负担，但商界领袖普遍表示支持，认为“稳定的社会环境更有利于投资”。\n尽管琴的个人声望极高，但她的保守主义立场仍引发部分争议：基民盟批评其政策“压制言论自由”，尤其是对媒体与教育体系的改革计划；退伍军人协会则要求更优厚的福利待遇，否则威胁发起抗议；面对质疑，琴在记者会上坚定回应：“我的剑曾守护德意志，如今我的政策同样如此——纪律不是压迫，而是繁荣的基础。”\n分析人士预测，琴政府将面临三大挑战：经济复苏速度能否满足民众期待；如何平衡保守派与改革派的诉求；国际关系是否因她的强硬作风而受影响。无论如何，这位“蒲公英骑士”已正式踏入政坛巅峰，她的领导将决定这个国家的战后命运。"
  demGermany_news.004.a: "铁玫瑰在德意志绽放"
  demGermany_news.004.b: "又一个古板的统治者"
  demGermany_news.004.c: "我们绝不能容忍这群王公老爷的复兴！"

