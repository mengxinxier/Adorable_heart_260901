  GER_xier_end_title: "至此，§g德意志§!在地球上§R不复存在§!......"
  GER_xier_end_tip: "在34年灾难降临时，没人会想到§g德意志§!会如此迅速的重整旗鼓，抓住那转瞬即逝的时机，绝地翻盘。更没人想到，在胜利前的黎明会有那响彻世界的一声枪响，将即将复苏的§g德意志§!再次拉入疯狂。\n\n§Y希尔§!——德意志最辉煌时代的领导者，但同时也是将德意志代入无尽深渊的恶魔化身。她带领德意志奴役幻想乡、占领圣杯王国、毁灭卡西米尔、征服俄罗斯，将§O德意志的荣耀§!推向极盛。但这样的荣耀是绚丽但短暂的，四处的征伐仅仅是完成她幻想中的希望——§0复活莉莎§!。\n\n§t在一切破灭之后，因果交织的代价也让她毁灭了德意志。§!"
