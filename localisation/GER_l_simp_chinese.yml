  GER_Interventionist_diplomacy: "干涉主义外交"
  broken_army: "受损的国防军"
  broken_army_desc: "在保卫祖国抵御不死族的过程中，国防军遭受了巨大的损失，再加上一路“长征”到奥地利，我们的军队已经疲惫不堪。"
  touxiangzhuyi: "泛滥的失败主义"
  touxiangzhuyi_desc: "在与不死族的战斗失败并失去大部分领土后，国内充斥着失败主义与投降主义的言论。"
  ZHENGZHIXUANCHUAN_AUS: "政治宣传"
  ZHENGZHIXUANCHUAN_AUS_desc: "莉莎我好喜欢你啊！为了你，我要为德意志服役!我要鸿儒魔导国！"

  AUS_work_with_KPD: "与德共合作"

  AUS_National_syndicalism_idea: "国家工团主义"
  AUS_National_syndicalism_idea_desc: "§g国家工团主义§!是§R工团主义§!的一个§g民族主义§!变种。§R工团主义§!是一种以劳工运动为主导的§R社会主义§!，旨在§R工人阶级§!团结起来组织工会，并透过各种工业行动，使社会由资本家主导变成由§R工人主导§!，并结合§R社会主义§!及§R无政府主义§!，主张废除政府及资本制度，由生产工人所组成的工团来取代政府，以性质不同的工团来管理和拥有各种社会资源。但§g国家工团主义§!已经从§R社会主义§!转变为了§g第三位置主义§!意识形态。"

