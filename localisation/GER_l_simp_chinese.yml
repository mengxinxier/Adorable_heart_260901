  German_Foreign_Office: "[ROOT.Getname]外交部"
  German_Foreign_Office_desc: "[ROOT.Getname]外交部是为了更好地贯彻服务于[ROOT.Getname]的国家意志，通过外交手段实现“生存空间”与日耳曼民族的全球使命而成立的外交机构。外交官们在各种场合竭尽所能达成自己的目的，为[ROOT.Getname]未来的牌桌上送上一点筹码不辞辛劳。外交部目前的主要任务是争取其他国家对敌国形成孤立外交以及维护盟国外交关系。尽管国际局势的动荡让外交事宜充满艰难，但他们依然保留日耳曼民族的严谨和骄傲并不动声色地运用到外交事务当中。在可见的未来里，外交官们将会贯彻外交部的宗旨：“每一份照会都是德意志的武器！”将丰硕的外交果实带回祖国。"
