  POLITICS_GER_Goebbels_DESC: "戈培尔1921年于海德堡大学获得哲学博士学位，博士论文关于19世纪浪漫主义喜剧。她先后作为记者、银行出纳和证券交易所传唤员。她也撰写小说及喜剧，但不被出版商认同。1924年，戈培尔受到莉莎演讲的感染，加入纳粹党，谋求通过政治活动而出人头地，戈培尔与纳粹党开始接触并于次年入党，她被任命为在柏林地区的领导人。在位期间，她充分发挥了她的宣传技能，在纳粹报纸和纳粹准军事组织冲锋队的帮助下，与当地的社会主义和共产主义政党联合。也逐渐开始认同施特拉赛主义的主张。1928年，她已成为了党内数一数二的人物。1933年，莉莎及纳粹党执政后，她被任命为宣传部长。上任后第一件事即是将纳粹党所列的禁书焚毁，她对德国媒体、艺术和信息的极权控制随之开始。\n\n不死族到来后，戈培尔随莉莎流亡维也纳并始终陪伴在莉莎身边。\n\n德意志归来后，莉莎遇刺，戈培尔稳定了德国的政权，同时她开始谋划着在德国实行施特拉赛主义的计划。\n\n§R“今天，德国是我们的；明天，整个世界都是我们的！”§!"


  GER_Hiiragi_Utena_DESC_1: "§Y柊舞缇娜§!\n§Y大魔导师§!\n  - $modifier_army_sub_unit_category_magic_attack_factor$：§G+10.00§!\n  - $modifier_army_sub_unit_category_magic_max_org_factor$：§G+10.00§!"
  GER_Hiiragi_Utena_Diplomacy_desc: "§Y柊舞缇娜§!\n@GER§Y[FROM.Getname]§!的§C副元首§!\n\n§Y大魔导师§!\n  - $modifier_army_sub_unit_category_magic_attack_factor$：§G+10.00§!\n  - $modifier_army_sub_unit_category_magic_max_org_factor$：§G+10.00§!"
  POLITICS_GER_Himmler_DESC: "在纯粹的人类中，很少有人会去研究魔法，柊舞缇娜便是其中之一。舞缇娜天赋异禀，年纪轻轻便在魔法领域取得了不小的成就，不久就成为了德意志的首席大魔导师。\n\n在莉莎正式成立纳粹党后，舞缇娜是第一批加入的人之一，她协助莉莎组建党卫军，成为了党卫军的总指挥官，是莉莎成为元首过程中及以后的左膀右臂。\n\n不死族到来后，舞缇娜随莉莎流亡维也纳。\n\n德意志归来后，莉莎遇刺，舞缇娜稳定了德国的政权，德国将走上一条更加极端同时伴随着神秘主义的道路......"
  GER_Hiiragi_Utena_desc: "在纯粹的人类中，很少有人会去研究魔法，柊舞缇娜便是其中之一。舞缇娜天赋异禀，年纪轻轻便在魔法领域取得了不小的成就，不久就成为了德意志的首席大魔导师。\n\n在莉莎正式成立纳粹党后，舞缇娜是第一批加入的人之一，她协助莉莎组建党卫军，成为了党卫军的总指挥官，是莉莎成为元首过程中及以后的左膀右臂。\n\n不死族到来后，舞缇娜随莉莎流亡维也纳。"
  heinrich_himmler_desc: "在纯粹的人类中，很少有人会去研究魔法，柊舞缇娜便是其中之一。舞缇娜天赋异禀，年纪轻轻便在魔法领域取得了不小的成就，不久就成为了德意志的首席大魔导师。\n\n在莉莎正式成立纳粹党后，舞缇娜是第一批加入的人之一，她协助莉莎组建党卫军，成为了党卫军的总指挥官，是莉莎成为元首过程中及以后的左膀右臂。"
