##事件
 #奥地利时期
  austria.03.t: "黑夜中的黑色车队"
  austria.03.d: "昨日傍晚，德意志国某边境检查站遭遇了一支奇怪的车队，她们口口声声的说着她们必须要马上见元首莉莎一面，检查站官员半信半疑地拨通了元首府的电话，随之震惊地示意手下立马放行：这是元首莉莎亲自下的命令。\n\n午夜时分，元首莉莎在元首府外接见了这支车队，在她旁边的则赫然是一辆帝国研究所的运输用军车。车队的领队一言不发，只有胸前的黑森峰勋章向众人说明了其黑森峰高级官员的身份，而身后的其她人则将车上的货物有条不紊地装入研究所的军车之中。在场的众人都对此疑惑不解，众人唯一能意识到的，就是莉莎露出了长久都未曾出现过的微笑。\n\n随着最后一箱货物存放完毕，莉莎才终于将货物上的封条拾起，供大家观看上面的文字："
  austria.03.a: "“魔导国地球作战用新式战车图纸”"
  austria.04.t: "长刀之夜......"
  austria.04.d: "房门紧闭，屋子里的母亲抱着怀里的哭嚎的孩子,试图掩盖孩子的声音。屋子外面不断传来急促的脚步声、枪声、燃烧声、衣服因拖动在地面摩擦的声音，屋内的母亲祈祷着，自家的房门不会被敲响......\n\n一夜之间，几千名反纳粹分子与亲魔导国派人间蒸发，没有人愿意提起昨夜发生的事，即使地上的血迹还没有被冲刷干净......"
  austria.04.a: "。。。。。。"
  austria.05.t: "元首在看着你"
  austria.05.d: "一夜之后，德意志国的人民突然发现大街小巷之间突然多了很多莉莎的画像，画像中的莉莎的眼睛是由凹面镜制成，这种特殊的材质可以使你无论从哪个方向观察，元首的眼睛都能始终盯着你，同时下面写着几个大字：\n\n元 首 在 看 着 你\n\n"
  austria.05.a: "至少元首长得挺好看的，不是吗？"
  austria.06.t: "归还德意志领土"
  austria.06.d: "我们的盟友德意志已经成立，我们控制的德意志领土上的人民要求返回德意志"
  austria.06.a: "让她们回去吧"

  austria.07.t: "德国共产党的命运"
  austria.07.desc: "德国共产党（德语：Kommunistische Partei Deutschlands，缩写KPD）即德国无产阶级马克思主义政党，1918年12月30日由卡尔·李卜克内西和罗莎·卢森堡领导的左派组织斯巴达克团与不来梅左派合并成立。创始人为卡尔·李卜克内西和罗莎·卢森堡。现在她们的代表则是惣流·明日香·兰格雷，在1933年的选举中得票仅次于莉莎元首。\n她们随着我们一同撤到了奥地利，现在对于如何处置她们，党内主要有两种意见\n一种认为我们应该先搁置意识形态的分歧，和她们联合起来，一同向着光复德意志祖国而努力。\n另一种观点认为，不能留下这些赤匪，必须趁现在斩草除根。"
  austria.07.a: "应该以民族大义为重......"
  austria.07.b: "盯紧她们就行"
  austria.07.c: "不能留下隐患......"

  austria.09.t: "我们要采取哪种方法来安抚希尔？"
  austria.10.t: "希尔不感兴趣"
  austria.10.desc: "“我早就说过，常规的东西根本不行！”一名投诚的前纳粹党员在监狱外朝我们的测试员喊道。\n监狱内，希尔眼神空洞地看着桌上我们给她准备的东西，但是没有碰一下。"
  austria.10.a: "下次一定会成功"

  austria.11.t: "我们要采取哪种方法来拷打希尔？"
  austria.11.a: "来点小昆虫？"
  austria.11.b: "狠狠地注入康米基因！"
  austria.11.c: "触手怎么样？"
  austria.11.d: "狗纳粹直接枪毙了吧"
  austria.11.e: "早苗：我有个好点子！"

  austria.12.t: "希尔向我们屈服了"
  austria.12.desc: "在数次**之后（R18打咩），希尔终于向我们屈服了，同意加入我们，条件是之后多来点这种“拷打”......\n同时，也有不少前纳粹将领跟随希尔一起加入我们。"
  austria.12.a: "为我们的新朋友干杯。"

  austria.14.t: "洗脑"
  austria.14.desc: "我们可没有精力与时间去猜测她到底喜欢什么，直接洗脑永远是最简单的。"

  austria.15.t: "告别流亡"
  austria.15.desc: "我们成功地从不死族手里夺回了我们的祖国父亲，但是我们的德意志父亲已经透支得太多太多了，我们必须停下脚步来，来休息一下了。\n同时，过去我们在奥地利取得了傲人成绩，在现在已经不值一提了，毕竟，“多瑙河奇迹”不是“德意志奇迹”。"
  austria.15.a: "德意志万岁"
  AUS_event_15_tt: "§R我们将失去大部分我们在奥地利时期获得的民族精神§!"

  austria.16.t: "红与黑的交织之夜"
  austria.16.desc: "维也纳德国共产党总部在夜晚当中寂静地如同空屋一般，事实上，在奥地利时期开始，德共的大部分活动都转移到了地下形式，总部这座建筑几乎就要变成一座无用的象征。而在这空屋之内，只有一间房间仍然亮着微弱的灯光——主席办公室。\n明日香单手扶额，另一只手则搅动着杯中的咖啡，在34年之后，夜晚饮用大量的咖啡成为了她的习惯，而今天不同往日，她的咖啡中还加了许些威士忌。\n就在下午，纳粹党的大喇叭——戈培尔走进了这间屋子，她又一次提出了希望德共与之合作的“真诚”建议。“明日香主席，请您相信我们，我们与您的目的是一样的，都是为了日耳曼民族！”“明日香女士，施特拉塞与伊里奇又有何不同呢，我们都是为了广大的劳苦群众！”明日香忍着心中想把她赶出去的怒火，耐心地听着那些空泛无用的托词整整三个小时，才在明日香秘书的好言相劝下将戈培尔送出。\n但在夜晚困扰明日香的并不是那番空洞的个人演讲，而是情报干事在早上送来的紧急情报——纳粹党意图在很快的时间内发起一项大规模行动，代号为“长刀之夜”，内容未知，手段未知。令明日香发愁的倒不是这份突如其来的秘密行动，而是她的情报干事并没有如往日那般把纳粹分子的底牌渗透得底朝天，而是多了两个未知。这证明这项行动的绝密性达到了一个最大值。\n这个行动的名字让明日香感到了危机感，在戈培尔走后，她立刻将电话打给了格拉茨支部的伊莉雅丝菲尔·冯·爱因兹贝伦同志，支部的主要干事们轮流拿起电话，认为这次合作会葬送德共的未来，此举会彻底将宣传战线工作的主动权交给纳粹党。驻德第三国际的代表也表达了关于此次合作的担忧，认为存在着催生党内妥协主义抬头的风险。\n在晚饭的时候，同在总部的吉姆史密斯——德国共产党的地下工作战线总干事——找到了明日香。吉姆认为此次合作完全具备可行性和战略价值，她以全体地下工作者的名义担保，她们可以在合作建立之后，以合作的正当理由渗透进纳粹机关的宣传机器，并秘密接触并争取冲锋队青年成员与国防军的下层军官和士兵的加入，并在军队中建立无数大大小小的秘密支部，合作将允许她们绕到纳粹党的身后的薄弱处捅刀子……\n在整夜的思索之后，明日香最终拿起的红色电话——那部在总部建立之初，纳粹们假惺惺地以“加强合作”为名设立的直达总理府的电话。就在听筒到达明日香耳边的时候，一个清脆的女声传来。\n“您好，明日香女士，请问你要找谁？”\n明日香心里一沉：总理府的那位也在等着这通电话。"
  austria.16.a: "“请帮我接莉莎元首”"

  austria.17.t: "暗号"
  austria.17.desc: "人来人往的街道里，邮政局的业务同样热闹，一位穿着被灰尘和污渍弄脏的工人背带裤的工人走进了邮局。\n“先生您好，请问您要办理什么业务？“接待她的是一位干净漂亮的金发年轻女士，按照纳粹的标准，她是一位非常合格的”雅利安人“。\n“我想寄一封信，”来者不耐烦地用手指敲着柜台，“我想寄给我在火车国的表舅，让她给我寄些钱来。”\n（格拉本支部昨日被突袭）\n“对不起先生，根据伟大元首莉莎的命令，现在停止一切与火车国的业务。”\n“那寄往意大利的呢？”不耐烦的手敲得更快更乱了，“我在罗马打工的侄子也有了点钱，到罗马的费用是多少？”\n（主要干事与大部分成员成功转移）\n“50芬尼，先生。”\n“50芬尼！你们还不如去抢……”工人的嘴里不断嘟囔着，敲柜台的手指变得沉重。\n（总部下达了撤离命令）\n“先生，如果钱不够的话，我建议去距离我们两条街的人民寄信处，那里的价格会稍微低一些。”女士的双手放到了柜台上，随意地伸了一个懒腰。\n（命令收到）\n工人的眉头微微一跳，随后露出了无可奈何的表情。\n“该死，我就不该来这里！一群吃人魔……”敲柜台的手指终于停下了，工人生气地摔门而出。\n“您慢走。”女士脸上的笑容依旧不变。\n这是一场极富经验的两个地下工作者之间的情报交接。\n但也许将会是最后一场。\n在街对面的咖啡馆里的此时此刻，一位看报纸的人翻到了报纸的下一页。在她大衣里的内衬上，一个盖世太保的图章是那么的显眼。"
  austria.17.a: "幽灵与猎人的森林追逐"

  austria.18.t: "真理不死"
  austria.18.desc: "被打的不成人样的格奥尔格被拽着走上了绞刑架，她的脸上，身上都是伤口，嘴里的牙齿被打掉了几颗，在监狱的恶劣环境里，她的左耳被拷打致失聪，右手在盖世太保的“切手指”逼问——这是她们最爱的酷刑——中只剩下了两根手指。\n但这一点用都没有，格奥尔格半个字都没说，她们什么情报都没得到。\n“格奥尔格·博施，俄裔德国人，31年加入德国共产党，长期以来，在国内从事破坏活动，被判犯有叛国罪，通敌罪，资助不死族罪，根据伟大的莉莎元首的命令，被判处绞刑。”行刑官大声宣布着关于格奥尔格的罪行，尽管这是一次秘密处决，但行刑官仍然希望看到念出处决决定后，格奥尔格脸上恐惧的神情和求饶的言语。\n而格奥尔格根本就没听到，或者说，她从能听见声音的右耳听到了，但她并未在意。在她死前的这最后一刻，她脑中回想起了很多时期。1919年，她在大战后失去了双亲，成为了孤儿，是社民党领导下的工会收留了她，教她读书写字；1931年，她宣誓加入共产党，发誓要为每一个穷苦人民而奋斗；1932年，她第一次成功地领导了一次工厂罢工，工人在得知工资翻了快一半，兴奋地把格奥尔格抬到空中……\n她满足地回顾着这一切，甚至都未在意绳索已然套到了她的脖子上。行刑官没有看到想象中的场面，气急败坏地挥手，下令行刑。\n此时，格奥尔格喃喃地唱着一首歌，那是她儿时会唱的第一首歌，她已然忘却了行刑官恼怒的喊叫和她手下手忙脚乱的操作，用一个并不大的声音唱着那首人尽皆知的歌曲：“只因她是一个活人，一个需要吃东西的人……”\n“哐当！”"
  austria.18.a: "活板落下"

  austria.19.t: "希尔向我们屈服了"
  austria.19.desc: "在数次**之后（R18打咩），希尔终于向我们屈服了，同意加入我们，条件是要成为早苗的狗......\n同时，也有不少前纳粹将领跟随希尔一起加入我们。"
  austria.19.a: "为我们的新朋友干杯。"

  austria.20.t: "德国共产党到来"
  austria.20.desc: "随着巴伐利亚的战败，德国共产党已经失去了所有的大规模根据地，她们分多次组成小批游击队来到了我们的辖区内。\n\n出于德意志统一战线的义务和对抗亡灵的目标，我们暂时接纳了她们进入我们的政府与军队。"
  austria.20.a: "不速之客。"

  austria.21.t: "自由派到来"
  austria.21.desc: "随着莱茵兰的战败，自由派们已经失去了所有的大规模根据地，她们分多次组成小批游击队来到了我们的辖区内。\n\n出于德意志统一战线的义务和对抗亡灵的目标，我们暂时接纳了她们进入我们的政府与军队。"
  austria.21.a: "不速之客。"

  austria.22.t: "处理宝石之国"
  austria.22.desc: ""
  austria.22.a: "全境占领"
  austria.22.b: "建立一个总督区"

  austria.23.t: "与教国密谈"
  austria.23.desc: "致漆黑圣典阁下\n自多瑙联邦分裂以来，东欧地区长期处于分裂和失控状态，在此期间，我国欣喜的看到，斯连教国以宗教为力量保持了旧联邦地区的稳定，并在亡灵肆虐德意志大地期间，保证了人类的纯洁性，避免了安兹乌尔恭的进一步扩张。\n但近些年来，亡灵们已不再安分守己，他们在德意志境内已消灭了众多反抗势力，其扩张也已指向东欧，而旧秩序的守护者幻想乡共和国和圣杯王国为保持国内稳定已明显展现出绥靖态度，对中欧，东欧地区的秩序不管不顾，这明显不利于我等对抗亡灵扩张，因此，我国认为，有必要建立起共同的人类防御，抵抗所谓魔导国的进一步扩张。\n为表现诚意，且提升人类阵营的综合势力，我国认为，有必要拉拢此地区其余国家加入我方共同阵营。宝石之国作为旧多瑙联邦的核心以及工业地带，其内部的严重政治倾扎已经严重影响此地区的人民的生命财产安全。同时，此地区保皇党已多次呼吁支持旧皇室复辟，这明显是对各国民族主权的不尊重，我方建议立即出兵宝石之国地带，保证该地区政权稳定。\n德意志国元首-阿道夫·莉莎"
  austria.23.a: "同意，请在接下来的几天内与我们保持联系。"

 #回归后
  ah_germany.01.t: "宝石之国要求独立"
  ah_germany.01.d: "之前我们在动乱时吞并了宝石之国，在我们的统治下宝石之国逐渐回复了秩序，之后便不断要求着独立。\n现在我们重建了德意志，她们对独立的呼声越来越高。"
  ah_germany.01.a: "那就让她们独立"
  ah_germany.01.b: "帝国不需要不忠者，她们知道这意味着什么......"

  ah_germany.02.t: "工人起义"
  ah_germany.02.d: "在莉莎元首死后，德国陷入了无尽的混乱之中，工人失业，经济崩溃......而继任者的不作为更是加重了各种社会问题，现在，工人们在德共的煽动下发动了起义！"
  ah_germany.02.a: "团结一致，我们失去的只有枷锁！"

  ah_germany.08.t: "完美的演讲"
  ah_germany.08.desc: "日耳曼同胞们，我来自于你们一个阶层。但在经历了无数的奋斗、自我学习之后，我变成了如今的模样，但我的内心始终如一。当我看见那慕尼黑的阴霾，那柏林变成了废墟的总理府时，我不得对此扼腕叹息，那些同胞被迫屈服于不死族的统治之下，一百万，两百万，三百万，四百万，五百万，六百万，七百万，八百万人在绝对贫穷与失业之中，那仿佛不会停止的通货膨胀，让无数人的心血变成了灰烬！一切一切都是她们的错！一切一切都是那些在条约上签字的人的错！我们必须拯救我们的同胞！每一个人都必须伸出援手，无论是穷人还是富人！每一个人的心中都有着这样一个信念，整个德意志中还有比我更加穷困潦倒的人，而我一定会像一个同志一样对她倾囊相助！有人说，那些我们就要付出这么多？这本就是一种给予的荣耀，当你把自己奉献给自己的团体的时候，你可以在大街上昂首挺胸的走着。我们日耳曼人的信念是不可能动摇的，我们的意志终将压倒一切！当这样的信念和意志结合起来的时候连上天都将为之颤动，我希望每一个日耳曼人的英豪们都加入我们的队伍之中！"
  ah_germany.08.a: "（掌声）"

  ah_germany.09.t: "新的国名？"
  ah_germany.09.desc: "我们已经战胜了德意志的敌人，拓展了我们德意志人的生存空间。\n有人提议更换我们的国名，以纪念我们立下的丰功伟绩和德意志父亲的伟大地位。"
  ah_germany.09.a: "大日耳曼妮娅"
  ah_germany.09.b: "大日耳曼国"
  ah_germany.09.c: "大德意志国"
  ah_germany.09.d: "还是保持原样吧"

  ah_germany.11.t: "处置不死族的纪念碑"
  ah_germany.11.desc: ""
  ah_germany.11.a: "拆掉"
  ah_germany.11.b: "改装"

  ah_germany.13.t: "不可思议的同萌？"
  ah_germany.13.desc: "[GER.Getname]向我们的外交部门发送了一封秘密文件，文件中提议我们组建一个“跨越意识形态”的同萌，考虑到两国一直以来的友好关系，这似乎是可行方案，但这样也必然会引起我们盟友的不满......"
  ah_germany.13.a: "让我们为我们的德国朋友干杯！"
  ah_germany.13.b: "这还是太过了......"

  ah_germany.14.t: "苏联同意了"
  ah_germany.14.a: "让我们共同进退"

  ah_germany.15.t: "苏联拒绝了"
  ah_germany.15.a: "那我们只能征服她们了"

  ah_germany.64.title: "德国确立反苏政策"
  ah_germany.64.desc: "我们从一开始就并未期望过德意志的法西斯政权能够始终与我们为伍。但令人愤怒的是，我们为全人类而牺牲的将士们热血未干。新德国便野心勃勃地将自己早已铺陈好的反共产主义外交政策摆上了台面。这一举措矛头很明显指向我们。无需过多的言语来阐述德国人的背信弃义。现在乃是斗争的紧要关头。我们必须把握好对其回应的尺度——抑或是根本不去把握。"
  ah_germany.64.a: "我们必须立刻予以回击"
  ah_germany.64.b: "以和为贵"

  ah_germany.90.title: "[GER.Getname]支持我们的战争"
  ah_germany.90.desc: ""
  ah_germany.90.a: "感谢姐妹"

  ah_germany.108.title: "直上云霄"
  ah_germany.108.desc: "“魔导国的近地飞行器？幻想乡的红红蓝不明飞行物？抑或是各国都或多或少使用过过的强袭装备？这些东西都将在我们麦椰大元帅的最新发明面前黯然失色，先进的碟状飞行器将把上述这些过时的造物打入历史的尘埃！”\n上述宣传词到底是哪个厚脸皮的想出来的？首席科学家对着一旁桌上如山般的实验资料陷入沉思。之前被大元帅否决的提案中，绝大部分的原因只有简单的一句“不好看”；即便是在敲定了以碟状飞行器为主题后，科研团队也被大元帅的电话轰炸折磨得痛不欲生，上一次柏林急电直接吓得一个实习生将手中的燃油桶不小心扔在了地上，那场爆炸引发的大火用了整整七天七夜才彻底扑灭......\n从胡思乱想中回到现实，首席科学家重新望向窗外那庞然大物：这个俗称“飞碟”的飞行器终于要开始进行第一次飞行测试了。最完善的设计（没被大元帅否决掉的），最优良的材料（国防军死活不愿意提供军规材料），最优秀的飞行员（当然不是现役的），最完备的场地（上次那个更完备的已经被炸掉了），这些要素加在一起，引用大元帅的某次宣传：“如果出了问题，接下来一个月我就改姓戈林”。\n只要不出意外的话......"
  ah_germany.108.a: "那天，附近的居民们欣赏了一场免费的烟花秀。"

  ah_germany.111.title: "德国召回哈索·冯·曼陀菲尔"
  ah_germany.111.desc: "鉴于欧陆局势的变化，德国不得不向我们宣布召回了帮助我国多年的军事顾问哈索·冯·曼陀菲尔。"
  ah_germany.111.a: "一路顺风"

  ah_germany.115.title: "纳萨力克的命运"
  ah_germany.115.desc: "经过一番艰苦的战斗，我们已经控制了亡灵们的老巢--纳萨力克大坟墓。\n现在，我们将决定，如何处置这座敌人的老巢......"
  ah_germany.115.a: "建立一座新的城市"
  ah_germany.115.b: "彻底拆除"

  ah_germany.116.title: "我们的命运"
  ah_germany.116.desc: ""
  ah_germany.116.a: "加入轴心国"
  ah_germany.116.b: "道不同，不相为谋！"

  ah_germany.117.title: "履行《哥得兰条约》？"
  ah_germany.117.desc: "如今我们已经返回了德国，按照履行《哥得兰条约》内容，我们理应归还哥得兰岛，但考虑到德瑞关系，我们也可以选择与瑞典续签条约。"
  ah_germany.117.a: "还了吧"
  ah_germany.117.b: "派里宾特洛甫去一趟"

  ah_germany.118.title: "德国想与我们续约"
  ah_germany.118.desc: ""
  ah_germany.118.a: "瑞典该统一了"
  ah_germany.118.b: "德瑞友谊永不灭！"

  ah_germany.119.title: "[FROM.Getname]同意了"
  ah_germany.119.desc: ""
  ah_germany.119.a: "太好了"

  ah_germany.120.title: "[FROM.Getname]拒绝了"
  ah_germany.120.desc: ""
  ah_germany.120.a: "太可惜了。"
  ah_germany.120.b: "我看不懂瑞典语。"

  ah_germany.121.title: "德国拒绝履行条约"
  ah_germany.121.desc: ""
  ah_germany.121.a: "瑞典人打仗可不怕死！"
  ah_germany.121.b: "算了吧算了吧"

  ah_germany.122.title: "德国履行条约"
  ah_germany.122.desc: ""
  ah_germany.122.a: "很好"

  ah_germany.123.title: "诸公司要求偿付梅福券"
  ah_germany.123.desc: "随着近来战争的结束，持有我们此前发放的梅福券的公司纷纷敦促政府兑现本票。他们声称，“为了祖国的繁荣伟大”，继续拒付这些债券已毫无意义。"
  ah_germany.123.a: "行吧。"

  ah_germany.124.title: "清洗反对派"
  ah_germany.124.desc: ""
  ah_germany.124.a: "好似！"

  ah_germany.126.title: "复国战争"
  ah_germany.126.desc: "今日，我们再一次与外星人处于战争状态。作为德意志最后的继业者。这场战争的结果将直接决定德意志民族的未来。而无论如何，在死斗的末尾，德意志民族也将不可避免的迎来统一，至于这份荣耀将花落谁家。这就要由我们的军队来决定了。"
  ah_germany.126.a: "前进！"

  ah_germany.127.title: "超重型坦克改进方案"
  ah_germany.127.desc: "尽管新式超重型坦克的设计进度有所进展。但这一段时间的研究所暴露出来的问题亟待重视。一号方案使用的汽油-电动机方案带来的动力不足，这使得样车的速度不尽人意。其悬挂也是小问题不断。要解决这些问题使用动力更加强大的驱动方式是最好不过的，但考虑到其将付出巨大的油料消耗，也许适当削减该车厚重的装甲与军备亦不失为一个好的举措。"
  ah_germany.127.a: "改进成本"
  ah_germany.127.b: "改进质量"
  ah_germany.127.c: "折中"

  ah_germany.128.title: "陆地巡洋舰改进方案"
  ah_germany.128.desc: "经过耗时极久的设计与生产，我们成功得到了第一台样车。这艘陆地战舰的速度尚未达到理想要求。其火力点配置也有不少难以忽视的死角。更重要的是该车生产成本惊人，且难以实现真正的量产。诚然继续解决这些客观问题能够使该车型适配装甲师的步伐，但这无疑会让原就巨大的成本问题雪上加霜。也许我们可以让该车的定位更...实际一些？"
  ah_germany.128.a: "改进成本"
  ah_germany.128.b: "改进质量"
  ah_germany.128.c: "折中"

  ah_germany.129.title: "小酒馆"
  ah_germany.129.desc: "汉斯一名狂热的纳粹分子，她原本是国防军的一名普通士兵，在德国战败退役，刚离开前线的汉斯就听闻了她最敬爱的元首阿道夫·莉莎自杀的消息，背疼欲绝的她回到了家乡，但那里已经没有她的亲人在等待她了。在与亲人的墓碑消沉地生活了一段时间后，汉斯依旧在啤酒馆里喝得烂醉如泥的一天，小镇上最爱吹牛的家伙又在啤酒馆中吹嘘：\n“您听说了吗？那个元首啊，其实没死！她正在青岛积蓄力量呢！这个青岛啊......”\n后面的内容汉斯已经记不清了，等她再醒来之时已经不知道怎么回到了家里的床上。虽然觉得很不靠谱，但一股莫名其妙的信念感冲上了汉斯的心头，她决定去世界另一端看一看，去哪个她只在报纸和收音机中听说过的神秘国度。\n\n当汉斯踏上青岛港口的陆地时，这已经是她第114514次抱怨这次行程了。为了这次旅行，她几乎变卖了她全部的家当，并在远洋渡轮上度过了艰难的几个月--摇曳的船舱对她这个旱鸭子来说实在是过于难熬。\n在着陆之后，汉斯用蹩脚的外语以及滑稽手势的帮助下，用了半日时间终于找到了曾经的德国租界，又是半日，汉斯拿着元首的画像到处问询，最后一位醉汉为她指向了一间不起眼的小酒馆，抱着怀疑的心态汉斯推开了酒馆的大门，一名留着白发、身穿服务员制服并端着几杯啤酒的德国女孩用熟练的山东话向她喊到：“欢迎光临！”"
  ah_germany.129.a: "Mein Führer？"

  ah_germany.130.title: "[FROM.Getname]邀请我们加入£GFX_Vienna_Convention_text_icon 维也纳互助公约"
  ah_germany.130.desc: ""
  ah_germany.130.a: "我们将在风雨中同舟共济"
  ah_germany.130.b: "不行！"

  ah_germany.131.title: "[FROM.Getname]同意了"
  ah_germany.131.desc: ""
  ah_germany.131.a: "太好了"

  ah_germany.132.title: "整编£GFX_Anzio_texticon §Y安齐奥高中§!"
  ah_germany.132.desc: "我等忠实的盟友意呆莉，已经彻底融入大德意志的国家联合体系，在陆军装甲兵元帅们的强烈建议下，黑森峰学园战车部成功收编了安齐奥学园战车部。\n\n这帮南方崽子倒是很快适应了我们的作战体系，我们也获得了意呆莉最新的坦克伪装技术和“统帅”成长计划。要说有什么问题的话，那只能是新的学园后勤采购清单比以前长了至少五倍！艾丽卡将军对于在后勤编组里加入“番茄调味品专车”、“意面和披萨面团专车”、“橄榄油和咖啡专车”十分抗拒，但据已进行安齐奥式后勤调整的一线装甲部队反馈，士兵对长时间战斗的耐受能力得到显著增强，士气也比以往更加高涨。\n\n报告另附：可否请后勤部扩大优质咖啡豆供给，最近兵营里“汉娜，你煮的咖啡比新人朱莉娅的洗脚水还难喝。”之类的声音越来越多了"
  ah_germany.132.a: "太好了"

  ah_germany.133.title: "整编£GFX_St_Gloriana_texticon §Y圣葛罗莉安娜女子学院§!"
  ah_germany.133.desc: "圣葛罗莉安娜学园，圣杯王国最顶尖的军事院校之一，自从“坦克”这一类装备出现在第一次伟大战争战场上后，她们就自诩为战车道的引领者，麾下诸军充当着皇家陆军的突破先锋。但养尊处优的大小姐们长期醉心于茶会与派系争斗，固步自封地钻研战车道，最终被黑森峰精巧的战车道技艺轻松击败。\n\n如今联萌分崩离析，以大吉岭为首的学园代表自知圣杯王国大势已去，主动向德意志部队投诚，交出了工程部的新锐坦克设计图纸和学生会的全部战术资料，并在我们的部队开进学园前就在各处挂起德意志和黑森峰的旗帜。\n\n西住真穗带领参加对圣杯王国战役的将领漫步在圣葛罗莉安娜学园中，阳光明媚的花园和宽敞整洁的洛可可式礼堂十分令人心旷神怡，黄金年代建起的奢华温泉可以洗去一切战场上的疲劳，接待过骑士王的剧院精美程度更是一点不输维也纳金色大厅。\n\n“西住大人，大吉岭为各位尊敬的访客准备了最好的下午茶，请随我移步到茶会专享庭院。”橙黄白毫熟练地接待着来自德意志的访客，态度与接待圣杯王室无二。\n\n看上去黑森峰不仅获得了世界一流的战车道技术储备，还拥有了一处世界一流的旅游度假胜地。"
  ah_germany.133.a: "太好了"

  ah_germany.134.title: "整编£GFX_Ooarai_texticon §Y大洗女子学园§!"
  ah_germany.134.desc: "忠诚的北德意志领土喜迎回归，在西住真穗元帅的彻夜劝导下，大名鼎鼎的大洗学园战车部加入了黑森峰，为我们带回了更加灵动且更具侵略性的西住流机动作战学说。\n\n这些在北方齿轮之国成长起来的少女十分擅长利用地形和机动性等各种相对优势调动敌人并逐个击破，不需要最先进最强大的坦克部队也可以创造可观的战果，十分适合改善杂牌装甲师战力不足的问题。\n\n现在先给西住姐妹和我们得到解放的同胞放个长假，好好享受一下这场胜利，熟悉一下她们阔别已久、焕然一新的德意志吧。"
  ah_germany.134.a: "太好了"

  ah_germany.135.title: "整编£GFX_Pravda_texticon §Y真理高中§!"
  ah_germany.135.desc: "真理学园外的原野上，最后一辆T-34被大火吞没，瘫痪在泥泞中。喀秋莎和农娜站在坦克残骸旁，军帽上的污泥掩盖了红星的光芒。\n\n黑森峰的战车围成沉默的半圆。逸见艾丽卡跃下指挥塔，军靴碾过烧焦的草皮，俯视着眼前矮小的身影：“这次的战车道胜负，是黑森峰赢了。苏联大势已去，欧陆诸国如今都已经屈服于德意志，看在真理援助过德意志复国事业的份上，元首特许你们以将军身份为黑森峰效力。”\n\n喀秋莎攥紧拳头，指甲几乎嵌入掌心。农娜轻轻按住她的肩：“喀秋莎大人，我们战车全损，已经……”\n\n“我知道！”喀秋莎甩开她的手，仰起头，红色眼眸里燃烧着不甘。她深吸一口气，猛地扔下军帽，回身望向自己仍在燃烧的战车：“真理学园……喀秋莎，从今日起，为黑森峰而战。”\n\n艾丽卡微微颔首，目光扫过远处沉默的真理乘员：“欢迎加入。在这里，你们会知道什么才是真正的战车道。”\n\n寒风卷起硝烟，学园广场上，真理的红旗缓缓降下，黑森峰的铁十字旗帜在风中猎猎作响。"
  ah_germany.135.a: "太好了"

  ah_germany.136.title: "整编£GFX_Continuation_texticon §Y继续高中§!"
  ah_germany.136.desc: ""
  ah_germany.136.a: "太好了"

  ah_germany.137.title: "整编£GFX_BC_Freedom_texticon §YBC自由学园§!"
  ah_germany.137.desc: "法兰西王国曾以骑兵战术闻名于欧陆，曾经的老近卫们跟随王室逃亡到新大陆，如今她们已臣服于自己的新主德意志。\n\nBC自由学园内，贵族、平民、混血都曾为光复故土而战，法兰西驰骋在原野的马上近卫，其身影历经百年变换，已经变成了钢铁与火药铸成的战车部队。黑森峰的规模日益扩大，来自附属国的战车道学员比例也不断增加，要如何凝聚起人心让她们心甘情愿为德意志的未来流血牺牲？我们或许可以在“玛丽”那里找到答案。"
  ah_germany.137.a: "太好了"

  ah_germany.138.title: "整编£GFX_Saunders_texticon §Y桑德斯大学§!"
  ah_germany.138.desc: "齐亚德联邦曾自诩为世界上最懂机械的国家，称：“没人比我们更懂金属的生产和应用。”而桑德斯曾是世界上最懂坦克标准化的学园，据说她们可以用自己三辆不同型号的坦克拼出一辆能持续战斗七天以上的坦克，桑德斯的战车道毕业生还能够在一个小时内学会开自己从没接触过的另一种坦克。考虑到德意志远征各地产生的载具损耗和后勤压力，或许我们可以让桑德斯学园为黑森峰的坦克生产线提供一些有价值的改进建议。"
  ah_germany.138.a: "太好了"

  ah_germany.139.title: "整编£GFX_Chi_Ha_Tan_texticon §Y知波单学园§!"
  ah_germany.139.desc: "远东樱花国曾以独特的装甲部队攻入欧亚大陆，虽然她们的军队在德意志闪电面前如陶瓶般脆弱，樱花坦克技术之落后、战术思想之僵硬也完全不值得学习。\n\n但知波单学园培养了大批装甲军官，这些年轻少女对任何都教官言听计从，面对简单的物质诱惑也毫无抵抗力，尤其是她们极为擅长突击冲锋，只需让黑森峰稍加指导便能为我们所用。"
  ah_germany.139.a: "太好了"

  ah_germany.140.title: "成立£GFX_All_Star_texticon §O战车道联盟§!"
  ah_germany.140.desc: "在德意志战车无情地摧毁各大战车学院的最后抵抗力量时，世人都认为那个坦克战术竞相绽放、流派迭出的时代已走到尽头，过去数十年那些久负盛名的军事学院将沦为史书中一串无人在意的名词，战车道的历史就此画上句号。\n\n令人意外的是，黑森峰学园突然宣布了战车道联盟的重建计划，新生的“战车道大联盟”通过一个各学院代表组成的大委员会来筹划未来的发展。不光各大国的战车道学园可以得到保留，即便那些未曾赶上战车道勃兴潮流的国家，也可寻求设立新学园，由此开辟探索属于自己的战车道。\n\n黑森峰老资历、陆军元帅西住真穗在公开座谈会上表示：因两次伟大战争引发的剧烈冲突，各国都极力发展探索自己的战车道道路，又因德意志的征服，各流派与学园轮番在战场上与黑森峰交锋，最终尽数败北。黑森峰固然是唯一击败过所有战车道学园的最终胜者，但西住流绝非世上最好的战车道理念，只有让不同的战车道不断地互相比试、竞争、学习，才能让战车道健康地延续下去。战车道大联盟并非历史的终章，而是历史的起点，它将会带来无数次对新式战车道的思考和实践，为德意志、为人类的坦克战法注入永不枯竭的活力。"
  ah_germany.140.a: "太好了"

  ah_germany.141.title: "战车道联盟公开赛"
  ah_germany.141.desc: "卡西米尔中部的原野向来是磨砺骑兵战术的优质围场，翼骑兵驰骋其上、为大敌军队降下恐惧与死亡的英姿仍在这片大地上传颂。\n如今阳光照耀下再无天马羽翼映出的一片洁白，取而代之的是披挂黄绿迷彩的钢铁军马，裹挟着滚滚烟尘，发出炽烈凶悍的咆哮。在第一轮简单的平行战列线互射后，两队战车迅速脱离交战并按照既定战术谋划下一步行动。\n战车道大联盟成立后不久就宣布了公开赛计划，一支秘密招录培养的新生代选拔队将公开对战各大老牌战车道学院精锐共同组成的联合训练队，赛事将在平原、丘陵、沙漠、雪地、雨林等不同场地巡回展开，并以电视和收音机为媒介向世界直播，第一战就在这片绿野上打响。\n无论现场观众还是直播观众，最关注的当属这支神秘选拔队的队长，在镜头中只能看出她有一头飘逸的银发和稚嫩的面容，比当年西住美穗出道时还要引人注目，熟悉战车道的观众联想到曾经昙花一现的岛田流战车道，上一代传人的形象便是冷面银发少女。\n\n联训队组建仓促，并没有充足时间进行磨合，各学院又都是自备战车加入队伍，以至于机动小组在选拔队刻意勾引下陷入包围被轻易歼灭，重装小组与主力时常脱节。选拔队却凭借着优美的战术执行不断蚕食联训队战力，以至于哪怕西住美穗在绝境中对联训队剩余战力进行了重组，凭借各车组丰富的实战经验一度夺回主动权，最终也未能逆转局势，本场赛事以西住美穗的旗车被选拔队队长的旗车击毁而结束。\n银发少女跳下坦克，微笑着走向西住美穗握手致意，在主持人正式宣告比赛结果后，两人也舍去了最后一点拘束。\n“爱里寿同学，最近进步很快呢，不管是侦察部署还是佯动欺骗都更加完善了，现在的联训队真是很难赢过选拔队。”\n“美穗同学过奖了，只不过是占了训练磨合充足的优势罢了，最后决战时也很惊险，选拔队各车组战斗经验还十分欠缺，公开赛才结束一场，接下来还有许多胜负手等待着我们较量。不过，这次既然是我赢了，博科熊乐园的门票，就该美穗同学请咯。”\n两人私下的交情颇为深厚，岛田爱里寿虽然是作为岛田流传人初次公开参加战车道比赛，实际在战车道大联盟筹备组建时就已经在黑森峰学院内与西住美穗等人进行过较量。尤其是黑色星期二还未发生时爱里寿就已结识美穗，无论是兴趣爱好，还是对战车道的理解都颇为契合，但直到第二次伟大战争结束后，爱里寿才决意正式加入战车道学院，并以击败西住美穗为目标不断精进。\n战车道“军神”之名，此战之后在世人口中或许会另有所属。"
  ah_germany.141.a: "太好了"

  ah_germany.2001.title: "§C彩§!§0蛋§!§O路§!§G线§!"
  ah_germany.2001.desc: "恭喜你触发了德国的第一个彩蛋路线--德意志第四帝国。\n（注意不要与常规路线混为一谈哦）\n触发条件：被魔导国打得投降倾向大于80%"
  ah_germany.2001.a: "胜利转进南极洲！"
  ah_germany.2001.b: "我们将与祖国共存亡！"

 #柏林混战事件链
  ah_germany.03.t: "柏林审判"
  ah_germany.03.d: "随着各地战事的结束，我们将在柏林举行一次针对魔导国余孽的“大审判”，对此元首的意见是："
  ah_germany.03.a: "清理那些魔导国余孽就行。"
  ah_germany.03.b: "彻底搜查所有与魔导国有关的人、物品，全部清洗干净。"

  ah_germany.05.t: "社会秩序恶化"
  ah_germany.05.d: "全德意志各地已经因为莉莎的死陷入了空前的混乱之中，莉莎的遗体尚未入殓，新成立的德意志国开始走向分裂，各地民众普遍恐慌于领袖的突然逝世，有流言称魔导国余孽在德意志各地都隐藏了仿生人部队，她们将会杀回地球将德意志民族彻底消灭。惊恐的民众开始逃亡，各地治安部队亦已形同虚设，有组织的犯罪活动也开始迅速滋生，德国的公共秩序正在陷入崩溃。"
  ah_germany.05.a: "我的天哪"

  ah_germany.07.t: "国防军的决定"
  ah_germany.07.desc: "总参谋部在柏林中央电台发表的讲话标志着国防军已经赢得了国家领导权，并开始恢复社会秩序，而内斗中的纳粹党的其她各个派系则被一齐赶下了德国的政治舞台。随着斗争尘埃落定，总参谋部的军官团第一次发现自己将会主宰德国的未来。在长达数天的柏林武装冲突中，起到关键作用的当属控制着空军部队的元帅迈耶，作为少数没有任职于党卫军而是继续供职国防军的纳粹元老，她在争取柏林驻军支持总参谋部的行动中发挥了重要作用，国防军的其她同僚认为她可以同时代表德意志国防军与纳粹党人取代其她的极端民族主义分子重新统领纳粹党，但是高层内部也有部分保守主义官员已经对莉莎鼓吹的极端民族主义政策感到失望，她们提出在党卫军已经覆灭之后，暂时领导德国的国防军也存在着另一种选项：建立一个更加保守或者说，理智的军政府，由军队人士进行监督，在剔除极端民族主义的基础上重建更加温和，或者说理智的国家社会主义政权，抑或是干脆踢开这群莉莎的拥趸，恢复旧有的德意志君主制。考虑到薇莲皇帝目前仍然流亡于红魔馆，并且仍然具有足以领导德意志人民的凝聚力，这个选项也显得颇具可能性。现在参与了柏林巷战的国防军领导人物已经在帝国大厦召开会议，她们将决定德意志的未来。"
  ah_germany.07.a: "迈耶大元帅本就是我党元老，由她主持重建纳粹党再合适不过。"
  ah_germany.07.b: "军队的新秀艾莉卡也许能够帮我们建立一个理性与锐意并存的军政府。"
  ah_germany.07.c: "向红魔馆派出使节，已经没有必要继续法西斯人的政治实验了。"

  ah_germany.16.t: "帝皇归来"
  ah_germany.16.desc: "当我们的使者到达红魔馆，红魔馆的女仆长十六夜咲夜知晓了我们的来意后，带领使者来到了一处墓前--我们敬爱的老皇帝薇莲二世的坟墓。\n我们的使者无语凝噎，泪珠划过脸庞......伤感过后，咲夜带着我们来到了一处宅邸，见到了一位极其面熟的人，是公主陛下，只是二十年的风雨使她更加成熟了。"
  ah_germany.16.a: "先王已逝，新皇即位！"

  ah_germany.20.t: "元首之死"
  ah_germany.20.desc: "五小时前，来自国会大厦的一则通讯报告了德意志国元首——阿道夫·莉莎的死讯，前者在进行关于德意志国光复的胜利演讲时被败逃的魔导国仿生人枪击，最终于昨日抢救无效身亡。由于元首的逝世过于突然，其生前没有留下任何的遗言——与身后的安排工作，一时间中央政府陷入了群龙无首的局面。全国人民普遍表现出哀戚之意，部分党员更是如丧考妣。\n经过漫长讨论，副元首希尔已于今日发讯宣布其本人将临时担任帝国首相一职，并统管中央行政部门，全权处理中央事务，至于帝国继任者问题待到为元首举行国葬之后再做处理。这一举措暂时未遭到异议。值得一提的是，大批纳粹党党员与党卫军士官人员正在进入柏林地区，希望参加元首的葬礼。届时元首的公开国葬恐怕将会人满为患。"
  ah_germany.20.a: "我们所能依仗的唯有上帝"

  ah_germany.21.t: "分歧"
  ah_germany.21.desc: "由于副元首希尔坚持否认刺杀元首的凶手来自魔导国侵略者，要求继续调查并追捕此案的“元凶”。事态似乎因此走向恶化：柏林的内务部门大多拒绝听从中央命令，据称柏林警局得到的命令是“以确保元首葬礼安全进行为首要目的”。因此部分警察人员甚至开始干预中央的搜查工作。目前只有盖世太保仍在正常运转。甚至有关于双方武装冲突的报告上呈中央。\n强制推行追捕工作的失败成果进一步导致了党内的分裂。几位党内元老已经开始表达对现政府的不信任——帝国的行政部门大多自行其是，党卫军军部也开始不受中央管制——更别说大批地方党卫军官以及nc党党员正在违令进入柏林。唯一一个好消息是目前元首的葬礼工作正在稳步进行，至少在可怜的元首正式下葬之前柏林尚且能喘一口气。"
  ah_germany.21.a: "有谁嗅到血腥味了吗？"

  ah_germany.22.t: "密谋"
  ah_germany.22.desc: "局势仍然在持续恶化，在令人窒息的环境下，中央政府正在逐步崩解，以里宾特洛甫为首的一众外交部官僚几乎公开表示她们对另一个党内元老的支持——她开始频繁出现在迈耶元帅的酒宴上，后者被认为是日后德意志国元首的有力继承者，同时与党部和国防军部门有着紧密联系。\n盖世太保并没能在追捕凶手的工作上给出任何结果，但她们已经明确警告中央政府，前来参加元首葬礼的群众很可能藏有不忠之徒，她们相信这场葬礼的背后极可能隐藏着一场关乎权力归属的巨大阴谋。但是目前柏林的情况不允许她们深入调查——内务部门已经普遍停摆，她们没有办法扩大成果。"
  ah_germany.22.a: "柏林早已不受节制"

  ah_germany.23.t: "猎犬"
  ah_germany.23.desc: "“咚咚咚”\n一阵规律的敲击声响起，科勒从暗处的窥视孔里望去，是她的接头人鲍勒，对了暗语后，她小心的接对方进来。\n“紧急情报”\n鲍勒喘了口气，转动雪茄的外壁，取出藏在里面的小纸条递给她。科勒瞅了一眼，紧张起来\n“我需要尽快上报。”\n里面的内容太过重要，但她忍住了细问的冲动，转而安排对方留在这里，暂时不要外出。她自己则烧掉纸条，推出自行车装了一筐啤酒，不紧不慢的向着目的地驶去......“你们！.......呜姆！”这位可怜的盖世太保被几个埋伏多时的密探一棍子打下了自行车。\n啤酒也散落一地。至于她本人？此时已然觉得自己如坠地狱。她没能逃脱戈培尔的魔爪？"
  ah_germany.23.a: "“瞧瞧我们发现了什么？”"

  ah_germany.24.t: "决定"
  ah_germany.24.desc: "阿勃维尔的管理人员几乎全部被临时召集起来。在凌晨。\n虽然多数人觉得在乱事面前情报局完全无关紧要，但是她们仍然在忠实履行她们的职责：严防可能威胁到葬礼安全工作的一切因素。外勤特工在潘科区得到了惊人的收获——她们逮捕了两名密探，其中一位供认自己来自帝国保安总局。\n两位盖世太保坚称她们有极为重要的信息需要上呈中央，经过审讯，她们吐露出实情：盖世太保的一位地方线人获悉一部分潜入柏林的暴徒准备袭击葬礼现场，刺杀此时掌控中央的帝国高层人员。这是一场政变计划的第一步，受审者也清楚说出了幕后主使之名——德意志国的宣传部长戈培尔。\n面对这一惊人的消息，卡納里斯上将紧急召开了内部会议，并且严令隔离涉事特工与人员。在如今多方对峙的情况下，阿勃维尔的每一步行动都将为这个行事一直力有未逮的情报部门带来不可知的后果。会议持续了两个小时，期间充斥着争论与部分的——肢体冲突。尽管在座众官员意见不一，但是在这位海军上将的主持下，为了情报局的未来，她们还是达成了一致——"
  ah_germany.24.a: "我们必须为元首与德意志负责，放了她们"
  ah_germany.24.b: "在尘埃落定之前，阿勃维尔唯有保持缄默"

  ah_germany.25.t: "一分钟的判决"
  ah_germany.25.desc: "鲍曼、戈培尔和她们的几个心腹被拷好带了进来，希尔扫视了一眼几人，而后盯着鲍曼：“先从你开始，鲍曼主任。”\n“副元首，哦不元首大人。”\n她弓着腰，努力抬起头，谄媚的笑道:\n“只要您放过我，她的党羽我都能帮您揪出来。”\n希尔冷冰冰的看着她，眼里没有一丝笑意\n“元首大人...”她额头上豆大的汗珠沁出，扑通跪了下来“...只要您留我一条性命，一切！我知道的莉莎和其她人的一切秘密！都会告诉您！”\n希尔皱紧眉头，嫌恶的挥了挥手\n“希尔，你不能这样，我呜...”\n鲍曼嘴里被塞上了一团破布，拖了出去，一声枪响后屋里又归于寂静。\n“清理掉了一条虫豸。”希尔心情好了起来，搬了个椅子坐在几人对面\n“继续，一人一分钟，先从你来。”\n她点了一个人，对方面如死灰，胡言乱语一番后也被拖了出去\n。。。\n“还剩你一个，我多给你点时间，两分钟吧。”处理完了其她人，希尔靠在椅背上，看来“除虫”让她很是享受。\n“嘿，在元首这里我是两个虫豸的价值么。”\n戈培尔并不慌张，她盯着希尔\n“我们不过是元首网中的小虫罢了，奋力一搏失败，这种结果也是当然的。”\n“哈哈哈，螳臂当车，正是这样。”\n希尔站了起来，舒展了下身体，\n“你值得我亲自动手。”\n她举起手枪顶住戈培尔的胸口，\n“嘿嘿，那可真是荣幸了。”，戈培尔死死盯住希尔的眼睛：“最后一句送给您，网可捕虫，也可捕螳螂。”\n戈培尔说完满足的闭上了眼睛。希尔的脸色却沉了下来“死都不忘挑拨离间”。\n砰，她扣动了扳机。。。"
  ah_germany.25.a: "叛徒的后果"

  ah_germany.26.t: "舞缇娜的邀请"
  ah_germany.26.desc: "“在最近对莉莎元首遇刺案进行深入调查后，新政府发现了一个以鲍曼和戈培尔为首，党羽遍布党内的反德意志阴谋集团，她们勾结不死族，一手策划并实施了谋杀案；而在全面调查开启后，阴谋集团更是狗急跳墙，勾结赤匪在元首灵柩必经之路上，设置了大量炸弹，意图谋害莉莎元首真正的继承人——希尔元首，当然，这种反党反国家的行为被提前预料，阴谋集团图谋落空。其头目在抓捕过程中负隅顽抗，被尽数击毙。\n为防范消灭此类叛国分子，保障德意志的安全稳定，新政府正在开展为期半年的党内风纪整肃活动。”\n看着报纸上的信息，希尔满意的点了点头，舞缇娜见状，笑着的说道\n“元首，目前大局已定，提纯计划也有了新的进展，德意志的新血液正在等待伟大元首您的检阅。”"
  ah_germany.26.a: "太好了，双喜临门。"
  ah_germany.26.b: "太好了，但目前还有几件要事。"

  ah_germany.27.t: "葬礼"
  ah_germany.27.desc: "得益于邪恶的戈培尔集团的密谋已经被伟大的党卫军政府粉碎，莉莎元首的葬礼最终如期举行，希尔与舞缇娜主持了这场葬礼并致辞。葬礼上人头翻涌，所有人都试图挤进前排，试图再瞻仰她们的元首——带领她们从不死族的殖民统治之下解脱的德意志元首哪怕仅仅片刻。\n随着灵车慢慢驶出城区，送行的民众与党员慢慢形成一条长龙。假使上帝真的于上空俯瞰柏林，它定会为被灰云簇拥的的花朵而诧异。当然，宴席也好，葬礼也罢，皆非永恒不散之事。结束之时已近，我等仍需直视前路。"
  ah_germany.27.a: "结束了，为了新元首，为了莉莎，让我们再一次团结起德意志。"

  ah_germany.28.t: "葬礼"
  ah_germany.28.desc: "得益于邪恶的戈培尔集团的密谋已经被伟大的党卫军政府粉碎，莉莎元首的葬礼最终如期举行，伟大的舞缇娜元首主持了这场葬礼并致辞——希尔不幸在粉碎叛乱企图的军事行动中死于流弹，她将安眠与元首的身旁一起下葬。葬礼上人头翻涌，所有人都试图挤进前排，试图再瞻仰她们的元首——带领她们从不死族的殖民统治之下解脱的德意志元首哪怕仅仅片刻。\n随着灵车慢慢驶出城区，送行的民众与党员慢慢形成一条长龙。假使上帝真的于上空俯瞰柏林，它定会为被灰云簇拥的的花朵而诧异。当然，宴席也好，葬礼也罢，皆非永恒不散之事。结束之时已近，我等仍需直视前路。"
  ah_germany.28.a: "结束了，为了新元首，为了莉莎，让我们再一次团结起德意志。"

  ah_germany.29.t: "人民的选择"
  ah_germany.29.desc: "感谢上帝！元首与她的亲卫队在一番血战之后成功逃离了地狱一般的柏林。目前临时政府暂时迁移到了什切青。元首在那里平安无事。\n“迈耶与她的党徒最终只在柏林维持了仅仅5个小时的秩序。稍晚，其与一众支持她的党内元老乘飞机离开了德国境内，盘踞在柏林城的叛军大多缴械投降。\n“尽管宣传部做足了工作，试图说服仍处于惊恐和不安中的德意志人民，使其相信勃兰登堡仍是帝国中心，但是考虑到尚有部分迈耶党徒与不忠士官滞留柏林，元首的行政班子恐怕还要在什切青长居数周，但不管怎样，这场声势浩大但鲁莽至极的兵变最终不了了之。"
  ah_germany.29.a: "不用担心，自然有人要对此负责。"

  ah_germany.30.t: "希尔"
  ah_germany.30.desc: "希尔走在前面，舞缇娜和其她人紧随其后，一行人穿过走廊，来到育婴室外，看了看里面一个个熟睡的婴儿，希尔转过头来，向舞缇娜问道“这就是最新成果吗？我要进去细看。”\n“当然，元首。”舞缇娜轻轻点头，安排人打开了房门“元首，为了这些孩子的健康，您和我一起进去吧。”“好，其她人留在外面。”希尔穿好防护设备，跟舞缇娜一起走了进去。。。\n“唔”希尔腰间一阵巨痛，而后一股能量从那里散开，将她浑身牢牢束缚住，希尔艰难的扭过头“你。。。”她睁大了眼睛，死死盯住舞缇娜“叛徒。。。”。愤怒、震惊、仇恨，还有一丝疑惑，最终化作恐惧与迷茫，她缓缓倒地，腰间的鲜血流到地上慢慢摊开，眼睛也逐渐失去神采，只有四肢还在微微抽动。失去了一切权柄的她，脆弱而又无助，就像养鸡场里即将被绞碎的小鸡，舞缇娜平静的看着这一切。。。\n等到一切收拾干净，她一个人坐在育婴室的地上，她曾是那么强大，但仅仅一把附魔匕首，就夺走了这一切，想到这里，她控制不住，眼泪涌了出来。。。"
  ah_germany.30.a: "现在所有的障碍都已经被扫除了..."

  ah_germany.31.t: "柏林爆炸案"
  ah_germany.31.desc: "莉莎的葬礼在国会大厦开始，按照计划，灵车将会绕城一周，然后开向维也纳，元首的遗体会在那安葬。\n开在最前方的自然是灵车，随后是由临时元首乘坐的轿车。之后跟随的数辆轿车搭乘着这个帝国的轴心——各部门要员。党员分列两旁跟随着车队，她们穿越民众的海洋与刻意撒落的白色花瓣走在大道上。\n随后便是爆炸，哭喊与无尽的枪声。整条大道从迎接归去之人的栈道变作激烈的战场。\n民众的哀戚变作惊恐，炸弹爆炸后，骇人般密集的枪炮声将群众驱散。在人群里埋伏许久的暴徒开始奔向承载着党内要员的车群——元首的座驾已经被炸上了天，坠落于地时亦燃起熊熊烈火。戈培尔没能得意太久，这位女士很快就意识到事情不对劲。其派遣的政变武装在抓捕要员时遭到了激烈抵抗。按理说遭到突袭的卫队应当不堪一击。多数元老在交火之下得以逃离，而这场政变一般的突袭行动已然演变成了一场可怕的火并。"
  ah_germany.31.a: "柏林将陷入烈火之中"

  ah_germany.32.t: "柏林混战"
  ah_germany.32.desc: "柏林驻军司令部正面对着一场史无前例的混乱局面——元帅迈耶的亲卫队与忠于宣传部长的党卫军的冲突开始蔓延至全城。双方为了夺取德国的最高领导权正在大打出手。\n城防司令试图在这场冲突中命令驻军保持中立，然而这场祸及全程的战斗还在不断走向激烈化。越来越多的党卫军部队开始和受“令”进入的周边驻军交战，双方的战斗甚至已经延伸至郊外。所有仍然在岗的驻军人员都意识到了这样一个事实——要么结束这场火并，要么看着德意志再一次陷入内战，后者显然不是这群士官所能接受的——她们不会再忠于已死之人。"
  ah_germany.32.a: "我们得告诉戈培尔小姐，她的计划已经失败了。"
  ah_germany.32.b: "你知道，迈耶元帅可没有权力调动这些陆军部队！"

  ah_germany.33.t: "计划失败"
  ah_germany.33.desc: "尽管忠于部长的党卫军作战极为英勇，但是面对装备精良的国防军部队与柏林驻军，她们犹如以卵击石，很快这支试图以小博大的队伍就被逼入了绝境。\n至于我们的戈培尔小姐本人，她倒是明白她的失败意味着什么，我们最终在国会大厦附近发现了她的遗体——一颗子弹打穿了她的太阳穴，此情此景就是最为普通的宪兵都为她的死相感到唏嘘。\n目前中央政府仍在因昨日发生的一系列乱事而混乱不已。但是至少现在大局已定——迈耶元帅与清晨亲自在城防司令部的电台上向柏林市民发布广播，告知群众政变阴谋已经被国防军挫败的消息，参与保卫柏林的驻军人员大多被视为英雄。虽然党内仍然有部分呼声要求重新讨论新元首的任命工作。但是在军队的站台下这一要求显得极不现实。"
  ah_germany.33.a: "混乱以毕，而元帅将鹊起柏林?"

  ah_germany.34.t: "混乱之后"
  ah_germany.34.desc: "尽管因为迈耶元帅与其目标一致的政变预谋，戈培尔与她的拥趸一度与大元帅陷入僵持，但在柏林城防司令部明确表示出对宣传部长的支持时，迈耶相当果断的命令部队撤退，而她自己带着自己未来的“政府班子”仓皇逃离柏林，据悉她已经乘坐专机离开了德意志国境。 现在原宣传部长——伟大的新任临时元首戈培尔女士已经宣布将会重新进行莉莎的葬礼，她保证将会将一切如迈耶元帅一般试图窃取权力的威胁分子彻底予以清除，并计划在完成柏林城区的重建工作后为元首举行一场更加盛大的葬礼——尽管莉莎元首的遗体似乎并未在这场暴乱中幸存——至少未完整的保留下来"
  ah_germany.34.a: "这就是结局？连遗体都没剩下？"

  ah_germany.35.t: "领袖之殇"
  ah_germany.35.desc: "我们伟大的领袖阿道夫·莉莎在国会大厦前的演讲时，遭到了不死族报复性的暗杀。莉莎未能幸免于难，她受到严重的伤势，还能坚持活下来本身就是一个奇迹，是她的钢铁意志让她坚持到了现在。在被送往医院后她得到了最完善的治疗，但也仅仅是让这位伟大之人得到短暂的回光返照。\n\n在她的最后时刻，她要求她认可的一些人来到了她的病房外。\n\n"
  ah_germany.35.a: "然后呢？"

  ah_germany.36.t: "告别"
  ah_germany.36.desc: "众人在希尔的带领下走进了元首的病房，望向身上插满管线、面色苍白的莉莎，希尔压抑这哭腔吼道：“向德意志最伟大的领袖，雅利安的守护者，国家工人党的主席—阿道夫·莉莎敬礼。”\n听到了众人的敬礼声，莉莎艰难的做出了一个微笑，孱弱的但又坚定声音从她的口中发出：“向伟大祖国父亲敬礼！”\n“希尔，来坐到我的身边来，其她人在外等候。”\n希尔身体微微颤抖，缓缓走近病床，握住莉莎渐渐举起的手，坐在了病床前的椅子上\n“莉莎！”（希尔）\n“希尔啊，你也变得沧桑了，想当年我们一起学绘画，一起考维也纳艺术学院，一起参加第三次圣杯战争，一起建立政党，一起被在啤酒馆疯狂，一起被捕入狱，好多好多的一起啊。想不到现在我俩都已经如此沧桑。”\n“当年在田野一起追逐打闹的时光是我最幸福的时光啊，莉莎”（希尔）\n“幸福的是我啊，希尔，没有你，我可能已经是冢中枯骨了，幸得希尔你相助才有如今胜利。可惜啊，我被光复祖国的胜利冲昏了头，太过自信了，我多年前的理想，我是无法亲自完成，希尔啊，我真是痛传心肺啊”\n“不要在说这些了，莉莎”（希尔）\n“希尔，当年我们我们一起在监狱写《我的奋斗》时的策对，你还记得吗？”\n“我记得，我记得，圣杯拥军百万，挟金融已令世界，此诚不可与之争锋。”（希尔）\n“苏联据有巨土，已历多年，国大而民附，此可用为援而不可图之。当外结好苏联，内整顿国家。时机纯熟，则命一上将率军入阿尔萨斯，你率军入红魔馆，直取人间之里，诚如此则大业可成，德意志可兴”（希尔、莉莎和声）\n“都快二十年过去了，莉莎你还记得那么清楚。”（希尔）\n“希尔狱中之对，千古不移，声声在耳，我美美想起都如饮甘霖，希尔啊，你是我最亲密的朋友，也是我最亲近的战友。我对我们俩的依恋毫无疑问。但我不得不走了，我希望你能够接手德国的领导工作，并在我离开后继续完成我们未尽的事业。我相信，你拥有足够的才能和智慧，能够处理好眼下的局势，并引领德国走向更加光明的未来。我相信你能够胜任这个重任。”\n“希尔啊，我知道你会去找舞缇娜，以此来稳定国内，你要记住这个人可用而不可信啊。要小心她。”\n“我知道，我知道，你不要再说了”此时希尔的脸上已经泪流满面（希尔）\n“希尔，去把她们叫过来吧”\n“元首”（众人）\n“我已经将国家的未来托付给希尔，诸位切不可怠慢，让我失望”\n“是”（众人）\n“古德里安，古德里安”\n“元首”（古德里安）\n“我与你相交在患难之中，相从至今，你念在与我是故交，尽量帮助着稳定这个国家。”\n“我愿效犬马之劳”（古德里安）\n“诸位，我不能一一嘱托，愿诸位自重啊，祖国的未来靠你们了。”\n莉莎最后深深地吸了一口气，她的身体开始颤抖，生命之火熄灭了。希尔伏在她的身上，泪流满面，为她的朋友和国家哭泣。\n"
  ah_germany.36.a: "我们能够仰仗的，唯有上帝"

  ah_germany.37.t: "未来"
  ah_germany.37.desc: "希尔接手了德国，这是她和好友曾经一起嬉戏打闹，一起并肩战斗，一起追寻梦想的乐土。如今，希尔走在元首宫的长廊，坐在元首办公室的沙发，睡在官邸的软床都有无数与莉莎的回忆涌上心头，她每时每刻都不敢忘了莉莎的嘱托，她要保护这回忆的净土，不过莉莎的仇也要报。"
  ah_germany.37.a: "我要尽快稳定国内，守护唯一的净土。"
  ah_germany.37.b: "莉莎......一切都没有办法了吗......"
  ah_germany.37.c: "赤潮，赤潮在涌动"

  ah_germany_37_tt_1: "§O希尔会把重心更多地放在§C稳定国内秩序§!上§!"
  ah_germany_37_tt_2: "§O希尔会把重心更多地放在§R寻求复活莉莎§!上§!"
  ah_germany_37_tt_3: "§R赤潮在暗处涌动§!"

  ah_germany.38.t: "悲剧"
  ah_germany.38.desc: "“请坐，我的元首”\n在看见了魂不守舍的元首之后，舞缇娜谦恭地引她的新领袖坐于首席。这里是柏林国家剧院。此刻一幕悲剧正在演出中。\n尽管很多人向新任元首——希尔奏请尽快处理已经死去的莉莎元首的葬礼，但是这些请求被无一例外的否决了。所有人都意识到，对于青梅竹马之死，元首接受这一切所需要的时间比她们想的要长的多。\n目前莉莎遗体在做完防腐工作之后封存于水晶棺内，希尔数日便会来看她一次，每一次都伴随着低沉压抑的哭泣声。其声初听感人，但亦足以令人不寒而栗。\n党内部分要员已经对她产生了不满情绪——已经过去数日了，一切事务都还没有开始起步。不过好在，光复政府并没有闲下来，各地的地方政府不遗余力的进行重建与反魔导国的宣传活动。\n当希尔收到舞缇娜的私人邀请之时，她立刻警觉了起来，亡友之语犹在耳旁：“希尔啊，我知道你会去找舞缇娜，以此来稳定国内，你要记住这个人可用而不可信啊。要小心她。”\n“我的元首，您在想什么？”旁座的舞缇娜打断了希尔的思绪。“所以，舞缇娜小姐，您到底想说什么？”希尔对这位神秘的宦臣充满敌意。\n“哦，哦——我的元首，您似乎误会了什么，我只是想邀请您来看这一出好戏......”\n元首满腹狐疑的落座，但中间确实一路无话。直到演出进行将结束时，这位神秘的魔术师才微移其首。\n“我的元首，我对您对我表现出的敌意感到难以理解。”\n“我对每个人都保以同样的态度——舞缇娜，不要太敏感了，现在我是元首，我必须......拿出元首的样子。”\n“哦，是的，是的......但您这份“威严”，怕是更可能导致——背叛。我的元首，想要背叛您......”说到这里她故意停顿了一下，见到她的元首没有多说什么，便放心改口：\n“想要背叛我们的人太多了，我的元首——有人在呼朋唤友、有人在背地勾结，还有人试图为自己构造安全的后盾。如果党卫军的力量不够强\n......抱歉我的元首，我只是想阐述一下我的担心。”舞缇娜像是意识到自己失言了，相当自然的转换出一副充满愧意的面孔。\n“如果你要存心破坏同志之间的团结的话，这些话大可不必！”\n“我的元首，盲目的相信一些事情——相信一切都与莉莎元首还在时那样，可是致命的。”\n“你——”舞缇娜突然离席，凑近了希尔的耳边低语。“如果我们的前领袖的魔力消失了，我们还能依靠什么？党卫军吗？还是我——我们忠诚的党员？”\n希尔的脸色早已变了好几次。是的，她能感觉到，她的挚友死去之后，看上去团结一致的阁员们各怀鬼胎，哪个看似为纳粹实则为自己摇旗呐喊的戈培尔也好，天天和外交部还有国防部的要员厮混在一起的空军元帅也罢，她的凉意随着舞缇娜的低语不可抑制的窜上的脊背。\n“莉莎已经死了，而她那些所谓“可以信任”的人，正准备着控制德意志——她们想背叛你。”\n“我不这么认为。”“遵从您的感觉，我的元首——难道您感觉不出来吗？”\n希尔略有威严的表情有些许的崩塌，她的两颊微微颤抖着,“也许，也许罢，哦，我不得不承认我对她们的信任有些许动摇。”\n“啊——啊，是啊，唯有莉莎的无私能将她们团结。”\n“我必须同意——她......是真正的理想主义者，我只是个追随者，我，我难以相信她就如此的......”\n话语里已经带着哭腔了，舞缇娜的脸愈发舒缓了下来，她知道她已经初步征服她面前的元首了。\n"
  ah_germany.38.a: "“你知道我的老师的故事吗？”"

  ah_germany.39.t: "提案"
  ah_germany.39.desc: "“我从来没有见过如此荒谬的东西！那个白发混蛋究竟在想些什么？”陆军总长特劳希奇一边疾步走着一边向参谋长古德里安抱怨。\n“我，我也不理解，但确实无误——这道行政令出自元首。”古德里安仍然试图阻止这位陆军统帅再一次去碰壁——已经有非常多的党内要员去和元首交涉，无一得到明确答复。特劳希奇倒也没有被她吓倒，“既然如此，那我就必须亲自和她谈——她可是一国元首，我不觉得她连我的面子都不给。”\n特劳希奇与纳粹党的关系较浅，这也是为什么古德里安不愿意让她与元首对峙——她根本不了解情况。\n在抵达元首门外之时，最后一位党内成员拦住了这位将军的去路——元首，或者说旧元首的秘书马丁鲍曼，“你的会见已经得到许可，但是我必须再一次提醒您，阁下。我们的元首变了，没有东西——至少现在能够阻止她了。\n“别和我扯这些有的没的，你们这群国社党人还没有到只手遮天的程度，国防军不可能对这项命令视若无睹！”\n“我们也不会，阁下！但无论如何这绝不是玩笑，而且我必须提醒阁下，相关的处理事务不会交由你们处理，她们会交给党卫军。”“党卫军！？哦，祝你们好运！”这位老将再不顾秘书的阻拦，一把打开了元首办公室的大门。\n诚如这位久经沙场之干将，此刻也不禁因她所见到的元首之样貌而感到脊背发凉。她面前的，此刻的元首双目微睁，背已经有些微驼，她的脸颊变得水嫩但极度苍白，而眼瞳里的那一抹红似乎与以前相比更多出一份血一般的鲜艳。\n"
  ah_germany.39.a: "这是一个女人？这是一个吸血鬼。"

  ah_germany.40.t: "对峙"
  ah_germany.40.desc: "纵使心中有千万的愤怒需要倾斜而出，但是元首这般模样实在骇人，竟使得将军放弃了先行进攻的机会，让这位好似绿叶却又形如枯槁的元首先一步开了口：“特，特劳希奇阁下？你也是来阻止我的？”\n“是的，我的元首——这太荒唐了，你竟要将德意志如此多公民......理由是什么！”\n“不需要理由。”希尔将身体一侧，望向她背后的台窗，不再正眼对视这位陆军元帅。\n“我们的政策，我们的主张，这些我都很清楚，但是，但，这些名单上面也有德国人——也有日耳曼人！我的元首！这实在不可理喻！为何要如此！”\n“正因为伟大的日耳曼民族血统的高贵，她们的血才能帮助我们完成更加伟大的事业！”如果这个声音是从一位老妪里低吼而出，也许她只会感到可怖。但这个声音稚嫩而清晰，每一句都好似在扼住自己的喉咙。“更加伟大的事业？”特劳希奇难以置信的问着。希尔转过头，“唯有用最为优质的血液方能唤回德意志的拯救者！要挽回生命就必须付出生命！只是你们的愚蠢还看不到这一切罢了。回去罢！没有什么好谈的了，她们的血液必须为德意志做出贡献，这是她们的——命运.”\n“我从来没有为某些人的一席话感到如此的可怖，直到今天，我的元首——莉莎元首看到会怎么想？她会乐意看到这些？看到生灵涂炭！？”\n“哦——对，对，她，她会很失望罢......”她的一席话似乎让希尔突然很受打击。就像一个做错事的孩子往后缩起了身子。看着就像是着凉一般。“不——不！她会理解我的......这是最崇高的事业！最为崇高的事业！为了德意志......一切都是为了德意志！”\n这位将军知道自己和她已经没什么好说的了，“再会，我的元首，愿上帝保佑我们。”语毕，顶着希尔那炽热的目光——\n"
  ah_germany.40.a: "她默默的退出房间，把房门关上。"
  ah_germany.47.t: "离去"
  ah_germany.47.desc: "“我算是看出来了，舞缇娜，那个该死的舞缇娜！整个高层只有那个鬼一样的东西会张罗这些！”在车上，古德里安默默听着她的老上司大发雷霆。“如果这封命令真的会下达，整个德意志将会......”这位战将此刻已经没有了往日的风采，她记起莉莎奄奄一息的样子，还有哭成泪人的希尔元首......她从未想到事情会恶化到如此程度。不过一只手轻柔的抚在她的头上，这让她产生了一种安心感。\n“现在还不是绝望的时候——还有人能够阻止这一切.”特劳希奇望着窗外，慢慢的说着。“我们没有办法阻止党卫军做出上帝皆无可原谅之事了......我们必须把那个跳梁佞臣赶下来。我有一个朋友，那是在旧帝国时代就认识的一位魔法师，她很强大——与那个除了大搞诳语的舞缇娜不一样，但她不愿意跟着我们。”车子停在了柏林车站，将军下车，最后向古德里安致意：我会把她带回来，你们也得尝试阻止这一切——\n"
  ah_germany.47.a: "“赶在无可挽回之前”"

  ah_germany.48.t: "舞缇娜"
  ah_germany.48.desc: "一支小队已经集结完毕，这些是古德里安手底下最为精锐的亲从，她们已经将突袭计划准备妥当，为了拯救希尔元首，为了阻止即将到来的屠杀，她们必须行动迅速。她们用了数日摸清了舞缇娜的工作日程，发现她经常深夜不归，工作到凌晨才离开岗位。\n这支全副武装的部队在古德里安的带领下，用数封伪造的文书骗过了数道哨卡，之后分散避开了守卫的党卫军——她们都是舞缇娜最为忠诚的追随者。随后她们进入了建筑，最终在舞缇娜办公室的门外集结，之前她们就看见其办公室灯火通明，而现在门缝亦透出光亮。\n现在正是机会\n这支小队破门而入，然而映入她们眼帘中的场景竟使得她们一时间愣在了原地。\n舞缇娜正在为希尔化妆。\n希尔坐在舞缇娜的办公椅上，舞缇娜在旁边俯下身子，为这位元首贴心打理着妆容。\n她的化妆技术很不错，原先已经没有任何血色的希尔的脸庞竟因为几缀腮红变得有了那么一点生机，然而令古德里安感到汗毛直竖的是，此时的希尔仍然在直勾勾的盯着舞缇娜，似乎完全没有注意到破门而入的一行人。她空洞的双眼只转了转，似乎以此表明她还是个活物。那位妖艳的女子似乎就像是在为一具尸体化妆一样。\n在为她的作品点缀上最后一笔后，舞缇娜这才起身，望向想要弑杀她的众人。\n“我亲爱的古德里安小姐，我相信——你们是来杀害我的罢。恕我直言，我实在没有想到你们会来的这么，快，或者说如此的无谋。”\n“以德意志父亲的名义，你被捕了，舞缇娜女士——你犯下了叛国罪。”\n“你在威胁我吗，古德里安小姐？”\n“德意志人民将会决定你的命运。”\n“我——即是德意志。”如此荒唐的话被舞缇娜明目张胆的说出，然而她身后的元首却几无反应。\n望向她身后的，如同浮雕般安静的希尔，古德里安下定了决心。“现在还不是，舞缇娜小姐，现在还不是！”\n舞缇娜又摆出一副似笑非笑的样子面对众人，数位亲兵已经将枪口对准了这位魔导师。然而她更快——她的手心突然现出一副短小的法杖。“那，此乃政变。”舞缇娜便一下子露出了凶相。\n......\n回过神来的党卫军士兵并未做出过于激烈反应，她们默默听着领袖的办公室内传来一声声凄厉的惨叫，在意识到已经没有她们需要履行的职责后——\n"
  ah_germany.48.a: "她们便又融入了这注定难以入眠的深夜。"

  ah_germany.49.t: "新秩序的前夜"
  ah_germany.49.desc: "舞缇娜将她的法杖妥善放好，重新从抽屉里取出化妆品，开始向另一个新的苍白的面孔填上腮红。\n只不过因为极度的恐惧，那张脸仍然是扭曲的，不过不要紧，片刻她就将舒缓下来。\n舞缇娜便继续着她的工作，一边召来一位党卫军军官。\n“以元首的名义——执行第99号行政令，告知各地的党卫军准备好。清晨过后行动，无需留情，展现你们的果断与决绝，为了黑日......”\n“如果遇到抵抗怎么办？”\n“你们所得到的，是元首的命令。”她只如此轻轻的回答。\n"
  ah_germany.49.a: "首先，是柏林，然后，是整个德意志。"

  ah_germany.50.t: "希望"
  ah_germany.50.desc: "法兰克福\n“所以，说到底，此次前来，只是需要我来帮你收拾你可爱的——德意志父亲的烂摊子？”卢卡斯爷爷将一小撮烟草砸进烟斗里，敲了敲，向特劳希奇吐出几个烟圈。“我擅长打仗，但我对魔法，尤其是黑魔法一无所知，光靠我们没有办法阻止那个疯子，为了德意志的未来——。”卢卡斯爷爷低声地笑了笑，然后打断了她，“我晚上还要去城郊——孩子们还等着我去放烟花呢。”元帅几乎已经是低声下气的求这位烟花匠帮忙了。“虽然我不知道你这老东西能不能真的帮上忙，但，现在除了您我找不到任何人了——德国将生灵涂炭！这你都不管不顾？”\n这套民族话术对她一直不管用。但是与往常不同，这一次这位老人并没有拒绝的打算。她双眼微颤，凑上前去，直直盯着她面前的这位来访者。“告诉我，特劳希奇先生，这一系列的祸事究竟应归于谁？”“......我们所有人。”特劳希奇痛苦的回答道。“这我倒是没想到的，你竟能如此坦诚。”老先生的脸色似乎变了，她沉默了一下，随即脸色便凹入阴沉之中。\n"
  ah_germany.50.a: "“开始了。”"

  ah_germany.51.t: "序曲"
  ah_germany.51.desc: "房门敲响，短且急促。“特劳希奇，和我来。”言罢，卢卡斯爷爷大声吆喝着敲门者，一边快步走向大门，顺便将靠在门边多年的手杖取过，她慢慢的打开门。\n门外是两名士兵。黑洞洞的枪口已经指向这位老者。\n“根据99号行政令，你已被——”话音未落，两位士兵便化作飞灰，飘散而去。\n看着被眼前一幕骇到的将军大人，这位老烟花匠不禁笑了笑。“就让她们代替我们进清洗名单罢，先生。”\n走着她自己还不忘自夸道：“虽然我不敢涉足什么黑魔法这种事情，但是如果我们真要比划起来那个小弄臣只会意识到她只涉足了黑魔法领域的皮毛。哦，将军，看样子已经有人在等我们俩了。”\n她们眼前已经有一辆轿车前来接应。一个年轻的面孔从司机位探出窗来\n“艾丽卡前来报到，长官，这位是？” “我们的朋友，孩子。现在我们得赶紧离开。”\n轿车在城间疾驰，沿途风景皆是一片狼藉，哭声，辱骂，还有交火的声音混杂在一起，火苗窜上房顶，暮色被染得鲜红。就是但丁下凡恐也因此景而不发一语。党卫军与盖世太保正在进行无差别的逮捕，居民四散奔逃，而警察与卫兵不出意外的保持沉默。\n"
  ah_germany.51.a: "大戏开幕。"

  ah_germany.52.t: "柏林"
  ah_germany.52.desc: "当她们回到柏林之时，城市已经戒严。但是至少现在她们还不算被通缉者。陆军总长保护着这支远征小队渡过戒严之海。成功进入了柏林市区。\n已经没有任何人敢离开她们的家门了。不少人将自己武装起来，将枪架在了门口——在人民看到被逮捕者的下场之后，柏林虽不至于成为空城，但也已是一片死寂。党卫军由盖世太保带领着。一队队的在街道上巡逻，等到后续命令下达她们将再一次进行新一轮的逮捕——屠杀总是需要一步一步来。\n抵达大厦之后，特劳希奇带着这位老人下了轿车，叮嘱艾丽卡：“如果拂晓我们还没有人回来，马上离开柏林。你的工作无论如何，在第一道阳光显露后就都会结束。” “这是一个恐怖的命令，长官，我会等你们回来。”\n“我要去档案室，只有把一切都带出来我们才能让我在其她地方的同僚们意识到灾祸从何而来，而您，我的朋友，请您必须去阻止舞缇娜。否则她将彻底控制柏林——” “我要做的事情可不需要你提醒。”卢卡斯爷爷打趣着这位脸上已写满担忧的友人。“我感觉的到，那个懦夫已经离开了柏林，但是此地存留着她的力量——我会负责对付她。”她的手杖狠狠地撞击到了地面，让人能感受到这位魔法师的决心。\n这个伟大帝国的中心已经一片狼藉，负责着德意志政权运行的行政人员正乱作一团——她们有理由怀疑她们自己也在纳粹党的屠杀名单上。所有人都在争相逃命，但也有不少人恐惧于街道上巡逻的凶魔而被迫折返。灰袍老者拄杖越过熙攘的人群，径直登上楼梯，向着黑魔法的源头缓慢的走去。\n当老人慢慢推开元首办公室的大门时，她预想中的元首并未出现。"
  ah_germany.52.a: "迎接舞缇娜之劲敌的玩偶，是舞缇娜这几天最为满意的成品。"

  ah_germany.53.t: "命运"
  ah_germany.53.desc: "曾经这张脸曾冷若冰霜，显得刚毅。此刻已经化作行将枯萎的花朵。像是罹患肺结核的临终怨妇，却又处处显出精致。作为军人，她没有妇人的丰腴，但是一套黑色的连衣裙却也将她的曲线显露了出来，当她侧过身子，因为战事已经略显发黑但却也标致的肩膀挺的笔直，空洞的双眼，被束起的短发，无一例外都在明示着她的鉴赏者——这是一个完美的洋娃娃。\n“她的名字是什么，舞缇娜小姐？”似乎有点被勾去心魄的卢卡斯爷爷第一句竟是这般。\n“现在你可以叫她——古德里安小姐，至少现在。”少女缓缓张口，回答着这位将要置于死地的魔法师。\n“卢卡斯大师——您竟然还活着？这让我受宠若惊。”“惊讶吗？也是——我给孩子们放了十几年的烟花了。”\n这位黑魔法师似乎很不满于这位老者如此闲庭信步的样子。“你的傲慢蒙蔽了你，老先生，你低估了我现在的力量......你将会见识到黑魔法能够发挥出的巨大实力。”\n少女突然伸出了她的纤手，一道绿光闪过，可怜的老人似被雷击，一下子被击至墙上，连连喘息。\n面对看上去虚弱的老人，舞缇娜在话语间丝毫不掩饰她的得意。"
  ah_germany.53.a: "“这一刻——我已经等待很久了。黑魔法将会重生，任何敢于阻碍黑日之途的人将会化为齑粉！”"

  ah_germany.54.t: "决斗"
  ah_germany.54.desc: "“没那么早，年轻的学徒——我可还活着呢。”老人慢慢的起身，拄起手杖。伸出手\n舞缇娜在远方操控着她的傀儡，但是老人的手却分明扼住了她的喉咙。她突然感受到了无名的恐惧，却无从挣扎。\n“你的统治已然结束——这位姑娘收到了折磨也已经够多了。”\n随即老人真正开始施展魔法。“恶魔之女！毒蛇的孽种！收起你的信舌！古德里安！我那正痛苦着的孩子！请听我言，不要惊慌——我带你离开这无底毒潭。我为你解除，咒语之缚。”\n舞缇娜想抵抗老人的话语，但是从哪一个方面来看这个女学徒都无力抵抗老者那可能连神明都要畏惧三分的威压。\n“你最后做的一件蠢事就是告诉了我这个孩子的名字，女士——现在！你这凶鼠，还有簇拥着你的黑暗气力，莫说黑日之曜，尔等将永不见日！滚！滚出迷失者之心灵，滚出柏林，滚出现世！折返那犹太的应许之地，速速——离去！”\n舞缇娜吐出一口鲜血，惊骇倒地，当她望向自己枯槁的双手时，她明白她数十年参得之魔力已被那灰袍老者再一次放逐。此刻她除了用最恶毒的声音拗哭以外已别无她法。"
  ah_germany.54.a: "恶魔落幕"

  ah_germany.55.t: "朋友"
  ah_germany.55.desc: "艾丽卡和特劳希奇都在等待着她们的友人能够安然归来。\n天将拂晓，当第一束光洒在门口的时候，这位烟花匠人怀着虚弱的少女一步步的出现在两人的眼前。\n“我就知道——亲爱的卢卡斯先生！您还活着！”“是的，我还不至于被那个狂妄的学徒弑杀。”\n这位老将军从卢卡斯的怀里接过仍然处于昏迷之中的姑娘。“古德里安——她......”\n“对她来讲噩梦已经结束了。”\n“发着烧，脸颊烫得厉害，气息也很弱。”特劳希奇此刻丝毫不掩饰她对下属的关心。\n“是的，特劳希奇——但还活着。”\n 轿车再一次在柏林的巷间飞梭，相比于昨晚，此刻党卫军的步伐更加急促，她们开始更加疯狂的进行所谓的“清洗”。正如被放逐的，陷入了疯狂的她们的领袖一般。\n“我失败了......我以为那条毒蛇至少有胆量与我见上一面......很抱歉，没什么能够阻止柏林的陷落了。”\n“我们该怎么办？”开车的艾丽卡扭过头来问了一句\n老人严肃的回答着，“德意志已经不存在朋友了，它已经处在毁灭自己这条路上的中途站。”“那我们该怎么办？”抱着古德里安的特劳希奇问道。\n也许是意识到自己的神态让气氛变得无比沉重，此刻这位曾致力于取乐孩童的老者再一次露出慈祥的笑容。“你们去波美拉尼亚，那里有一位投机者，我很了解她。她绝不会坐视不管”\n“马，马肯森元帅？”“对”\n“那你呢？总不能回法兰克福去罢？”老人嘴角弯的更厉害了，“不不不，我要去西方，西边——去科隆，我去找一位老朋友。她，她们的态度将决定未来会走向何方”\n“您刚刚还在说德意志已经没有我们的朋友了。”“嗯，嗯，确实，但是啊，我一直没打算把自己当德意志的子民——”"
  ah_germany.55.a: "就一位老魔导国人的立场来说，我们仍然不缺朋友。"

  ah_germany.56.t: "密谋"
  ah_germany.56.desc: "在布吕所庄园里，一场密会正在进行中\n在德意志政权存在的长时间内，马肯森元帅——这位旧时代最后的军事统帅在占领区一直站在德意志复国者的一边，然而她的存在似乎无关紧要。\n作为一名已经退出了德意志军队的旧君主主义者，她看着曾经忠于德意志的军官们一个接着一个的，要么倒向不死族的殖民政权，要么倒向年轻的莉莎与其罪恶的第三帝国。但她从未表现出恼怒或是伤感——数年来元帅只在波美拉尼亚的庄园里与一众访客喝茶谈天，这是它所效忠的旧帝国唯一留给她的东西。她只会在话语里稍稍表示出稍纵即逝的对旧时代的思念。\n已经垂垂老矣的帝国元勋从未想到旧时代还会向她招手。这是从数天前开始的，飞去的雏鹰惊恐的又飞回巢穴，一个个带着勋章的“访客”向她描绘新元首正在制造的白色恐怖。她原想将这些人斥退。直到她在城内真正亲眼目睹了新政府的作为。\n元帅仍然表现出理解与支持，但她的眼里已然闪出一抹寒光。\n今天，这个庄园格外静谧。只在最深处能够听见悉悉索索的交谈声与翻卷声。这位老人最终允许她们在自己的庄园里暂留，一个反对派的巢穴因此诞生。元帅全程没有参与任何事务，仅仅坐在席首，看着再一次团结在她旗下的将军们来来去去。“元帅，我等已经准备就绪，整个勃兰登堡的部队皆会听从我等调遣！唯需您一声令下！”在讨论完行动计划后，将官激动的向元帅请战。\n“您的意思是，要集合您周边的同僚——再一次发动一场内战？我可以这么理解吗？”元帅之言不怒自威，令众人一愣。随后元帅又笑了起来，话语间便唯有温和：“不急——不急！先生们。现在还不是时候。”语毕，马肯森元帅却望向另一位旁座的将军——旧海军上将卡納里斯先生，只见她微微颔首，元帅便已知晓此行应当不会走漏风声。\n德意志正在坍塌，群众已然忍无可忍，但正蓄势待发的不会只有她们。这位元勋看的很清楚。国防军没有必要孤军奋战，她们仅需伺机而动。至于局势究竟走向何方，此时仍然无人可以预测。但有一点她已经再清楚不过——"
  ah_germany.56.a: "方今之时，山雨欲来。"

  ah_germany.57.t: "科隆暴动"
  ah_germany.57.desc: "已经实行了数十天的极端恐怖政策已经导致各个地方政府失去了对纳粹当局最后的信任，而于前天发生的科隆的民众暴动最终成为了一切的原爆点。在对于未来的恐惧达到了极点之后，这座老自由市率先向逐渐疯狂的德意志国政府倾斜怒火——全市商会与企业家行会联合签署了一项地方倡议，要求帝国保安总局的所有人员立刻离开倡议地区，同时拒绝任何将会继续“革命恐怖政策”与对非日耳曼族裔——包括犹太人——迫害行径的行政指令。而民间也已做出回应——大批民众登上街头，举起反德意志民族至上的招牌，并在当局的默许下袭击任何仍然试图声援中央政策的民众。她们的要求甚是简单——结束迫害与屠杀。所有的民族都应当是平等的。\n\n由情报部门发送至元首桌上的信函表明，直接导致科隆暴乱发生的的自由主义思潮与旧不死族遗留的统治官僚联系紧密——科隆市长薇尔莉特·伊芙加登在德国沦陷及之后的数十年间一直管理着这座城市的各项事务，她在莱茵地区的地方官僚里一直威望颇高。因此她的乱行已经辐射至整片西北德意志地区——也许最后将席卷光复各地。"
  ah_germany.57.a: "她们仍然深受魔导国之荼毒！"

  ah_germany.58.t: "基督教民主联盟"
  ah_germany.58.desc: "屈从于刺刀下的民众们再一次站了出来——不再是跟随已然被毁灭的德国左翼势力，而是团结在一位市长与她所领导的民主反对派的旗下。\n\n西部各州政府在传播甚广的倡议号召下相继与柏林决裂——她们要求所属的德国士官离开军队，并切断与柏林中央的通信联系。下萨克森诸市甚至已经开始互相签订协议——防范似乎一定会到来的军事镇压。\n\n西德意志分离主义运动的高潮发生于3日前，位于科隆的反对派中心——薇尔莉特·伊芙加登市长在民众簇拥之下宣布重新组建在魔导国时期解散的基督教中央党，并改名为基督教民主联盟，以展示将团结所有代议制拥护者的决心，科隆当局要求柏林政府恢复民主选举并进行紧急大选。这一要求开始得到西部各州乃至整个光复地区的普遍支持。\n\n尽管看上去这个手无缚鸡之力的政治集团远远没有德国共产党来的强大，但是军队内部已然产生了巨大的厌战情绪，国防军的多位军事将领将她们的意见面呈元首，阐释任何可能导致第二场内战的举措都会将忠于柏林的军队分化——但新元首拒绝了任何妥协意见。军队已经开拔，流血冲突似乎在所难免。"
  ah_germany.58.a: "开什么玩笑！我们无力发动另一场内战！"

  ah_germany.59.t: "柏林之变"
  ah_germany.59.desc: "在所有仍然愿意忠于莉莎——或者说莉莎遗留给德意志的遗产——的正规部队向西开拔之时，一支不起眼的队伍神不知鬼不觉的进入了柏林。中央政府甚至没能得到任何警告——她们悄无声息的经过了层层守备，没有任何哨卡试图阻拦她们。\n\n当党卫军部意识到袭击行动发生的时候，总理府，国会大厦，乃至官僚的私人宅邸都已燃起熊熊烈火。阿勃维尔成功探清了各部高层的工作时间，其中最为致命的情报是——希尔在这些天一直进行着报复性的加班工作，经常深夜不归。舞缇娜部率领的党卫军马上整备反击，但是在精心计划的突然袭击之下，她们的抵抗并未持续太久。纳粹党员干部大多被叛军袭击宅邸并射杀，除了当值的空军元帅迈耶与她的追随者——她早已知晓密谋，并背叛了纳粹党。\n\n令人绝望的是，柏林的地方驻军在混乱下选择作壁上观，早在数日前驻军司令部便已经被叛乱者说服，除了真金白银的诱惑以外，她们似乎也乐意见证纳粹党徒的灭亡。\n\n战斗持续了一夜，战斗进行了3个小时后，被烧得不成样子的希尔元首的遗体在废墟中被找到，但是她的卫兵仍旧残存并在大厦内组织反击。清晨，当筋疲力尽的国防军叛乱者将国会大厦顶上的万字旗撕毁，重新铺下三色旗之时，在枪炮声中惊恐度夜的柏林市民似乎看见旧时代在向她们招手。"
  ah_germany.59.a: "旧时代？管她呢，至少我们不用面对兄弟阋墙。"

  ah_germany.60.t: "前路"
  ah_germany.60.desc: "所有参与了柏林兵变的军事将领被当作英雄对待，人民庆祝纳粹统治的终结，各地的党卫军部门为了避免迫害大多选择自行解散，纳粹党从光复德意志到被德意志抛弃仅仅只有数月。\n\n马肯森元帅的预言不无道理——军政府并未遭遇太多反对声音。基督教民主联盟的话事人向位于柏林的临时政府寻求共识——元帅慷慨给予了前者她的承诺：德意志议会将会重新组建，各派势力将会重新得到组建在野政党的权利——当然这不包括试图分裂国家，现在已然奄奄一息的德国左翼分子。 \n\n“我亲爱的德意志人民们，也许你们仍然心存怀疑，也许你们仍然心有余悸，但是无论如何，已经饱受创伤的德国必须达成一个共识——所有愿意在德意志的旗帜下为了国家亦或是自己的幸福而奋斗的人们都必须以团结的意识代替无谓的仇恨，布尔什维克，法西斯分子，她们应当被团结的德意志人民所抛弃，这个世界还没有给予我们喘息的机会。唯有团结能给予我等希望！”元帅在柏林向全国致辞的时候已然褪去了原来老朽不堪的样貌，现在的她与成功光复德意志的莉莎一样抖擞——只不过前者多出一丝狡诈与得意。无论她如何选择，她似乎都将成为一代英雄——但她必须做出选择。尽管她是一位绝对的君主主义者，但是她自己似乎无意再冒险干预德国的未来——国防军内部的同心之人寥寥无几，除她以外无人愿为旧帝国摇旗呐喊。她随后在新议会上的表态更多展现出恳求的姿态——她希望在有生之年所看到的新德国与她记忆里的伟大帝国并无二致。\n\n"
  ah_germany.60.a: "是元帅拯救德国于危难中！元帅的期望得到了应有的回应！"
  ah_germany.60.b: "第二帝国辜负了太多人，民主反对派的组阁提议得到多数支持！"

  ah_germany_60_tt_1: "§O我们将向红魔馆派出使者，邀请我们的老皇帝回来§!"
  ah_germany_60_tt_2: "§O向保守派与军队妥协，由自由派军官逸见艾丽卡来担任名誉总统，民主同萌内部推举出临时首相。§!"

  ah_germany.61.t: "共和国归来"
  ah_germany.61.desc: "这是一件也许日后的历史学家绞尽脑汁都难以解释的事情——一位市长，带领着旧日的支持者重新回到德国的政治舞台，甚至在一个又一个专制领袖的统治之后掌控了柏林的至高权力，并准备开始民主化的政治实践。薇尔莉特·伊芙加登市长作为基督教民主联盟的党魁向民众致辞，宣布德国的民主化道路已经势在必行。在国会大厦上，她已经颇显佝偻的身躯努力的站直，正立在莉莎，希尔这些小儿的阴影面前，决心将满目疮痍的德国从“伟大”的深渊中拉出。\n\n薇尔莉特·伊芙加登的身旁，是自由派军官逸见艾丽卡，她是这个政府中真正掌握兵权的人，艾丽卡震慑着德国国内的纳粹残余。经过联萌高层的会议决定，逸见艾丽卡将成为德国的“元首”，带领德国进行渐进式的改革，最后完成民主化。"
  ah_germany.61.a: "自由再临德意志"

 #处理德共后续
  ah_germany.41.t: "复燃"
  ah_germany.41.desc: "“总理遇刺！不死族死灰复燃？”\n波茨坦的德国共产党新总部，主席办公室桌上《前进报》头版头条的标题赫然昭示着新生的德国极其混乱的现状。\n“事态变化的太快了，”明日香望着窗外一队疾行而去的摩托化宪兵部队，“现在，纳粹们在短暂的混乱后，肯定会怀疑到我们头上的。”\n“我们的地下情报系统确实察觉到了一些蛛丝马迹，确实在莉莎演讲的同一街区里有一些可疑的活动……”坐在桌前的情报总干事，吉姆史密斯皱着眉头，“但是这场刺杀行动很有可能是无组织的，我们的情报网根本抓不到决定性的证据。”\n“我当然没有责怪你的意思，吉姆，”明日香回到办公椅前重新坐下，“就目前的情况来看，我们和纳粹党的脆弱合作已经不复存在。万幸的是，纳粹们自己就打成一团，她们没有精力管我们了。”\n“我们的情报网已经随着版图的恢复而铺设到全国各地，盖世太保们存在或不在的，国防军辖区内或辖外的任何地方，都在我们的地下工作范围之内。”谈到分内的工作成果，吉姆一扫刚才的懊悔，起身在德国地图上反复笔画着。\n明日香望着地图良久，她的方案随着思考而越来越精密，她很明白，错过了这次机会，一旦纳粹党内部的斗争稍有消停，德国共产党将是首当其冲的纳粹清算对象。\n“通知下列各部门，我作如下部署，”吉姆立刻打开记事本。\n“第一，通知前进报的希法亭同志，明天出一篇关于莉莎的讣告，语言诚挚些，多强调一下我们和她们的合作。”\n“第二，通知魏玛，莱比锡，德累斯顿支部和奥地利地区的同志，立刻开启全面转移，除了地下情报组织继续保持静默单线联系以外，其她一切明面支部成员转移到多特蒙德方面，机动性第一，隐蔽性第二，要在纳粹党内部矛盾解决前完成转移。”\n“第三，通知各下属工会组织在未来半个月内停止一切有组织活动和示威行动，各单位暗地里延缓工作产量，并成批次，小规模地组织工人队伍前往莱茵工业区。\n“宣传名目呢？”\n“西部地区重建，”明日香顿了顿，喝了口水继续说，“第四，通知我们在幻想乡和苏联的外派同志们，准备回国，以上。”\n“我立刻着手。”吉姆迅速起身，望门口走去。\n“等一下，”明日香突然想起了什么，"
  ah_germany.41.a: "“帮我通知多特蒙德支部，在今晚约定时间，我要和伊莉雅同志通话。”"

  ah_germany.42.t: "风雨"
  ah_germany.42.desc: "“……综合我们所讨论的内容，伊莉雅同志，共产国际内部已经决定，将会全力支持你们的革命事业。”\n阴沉了一天的多特蒙德在夜晚终于下起了大雨，豆子般大的雨珠淅淅沥沥地打到多特蒙德每家每户的房顶上，伴随着阵阵的劲风，刚刚入夜的多特蒙德的大街上已经空无一人。\n“非常感谢，季米特洛夫同志，我代表德国共产党向共产国际的国际主义精神表示深深的感谢。”就在伊莉雅丝菲尔·冯·爱因兹贝伦放下话筒后，办公室的门口突然响起了敲门声，随后进来的是一名年轻的办事员小伙子。\n“伊莉雅书记……”\n“党纪组织纪律第七条，党员之间一律称同志。“\n“非常抱歉，伊莉雅同志，”办事员迅速纠正自己的称呼，递给伊莉雅一个厚厚的小本子，“这是过去三天转移到多特蒙德地区的党员和工人干事名单。”\n办事员退出书记办公室后，伊莉雅在座位上漫无目的地翻看着本子上的名单。这是唯一的孤本，自伊莉雅丝菲尔·冯·爱因兹贝伦于1934年后担任与共产国际的联络总负责，和地区党支部总书记以来，这是她处理情报记录所保持的处理习惯。\n昨天，她刚刚和来到多特蒙德的卡罗米伦多夫进行了会谈。一个很有希望的小同志，这是会面后伊莉雅对米伦多夫的印象。米伦多夫首先代身在奥地利军区的莉萨恩格尔同志，向伊莉雅传达了恩格尔迫切希望投入到革命最前线事业的工作中去的愿望。其次，米伦多夫简要地就不死族占领区的共产党潜伏情况和复国后的重建工作进行了汇报。\n最后也是最重要的一点，米伦多夫向伊莉雅提供了一份国防军和党卫军中的名单，名单上的中低级军官现在全部部署在西部地区，一旦发布信号，综合估计，西部军区将有近一半的部队会加入到革命队伍中来。\n伊莉雅坐在办公椅上，一份难以抑制的激动与兴奋在她心中激荡，数年的流亡，数年的潜伏，终于换得了今天她们所努力的一切。\n当然，有一丝丝不安笼罩在通话结束的伊莉雅心中，是一段简短而转瞬即逝的小问题。\n“伊莉雅同志，”季米特洛夫突然在关于援助的讨论中一转话题，“在德国革命进入白热化阶段后，我曾以个人身份，向国际表达了希望让你作为德国共产党新的领导中心的想法，我认为，你的能力足以胜任这一重要的职责……”\n“请允许我拒绝这一提案，主席同志，”伊莉雅直截了当的打断了季米特洛夫，“请让我们回到我们讨论的话题上去……”\n这段对话如同蛇一般绕在了伊莉雅的心上，但转瞬之间，就被伊莉雅挥手驱散。\n“现在，是时候规划一下新到来的工人同志们的地区分配事项了。”伊莉雅拍了拍脸蛋，对于她而言，今天又是一个不眠的夜晚——她的医护人员已经多次向她就此表达了最强烈的抗议。"
  ah_germany.42.a: "“在伟大的事业面前，我只是其中的一个齿轮。”"

  ah_germany.43.t: "分别"
  ah_germany.43.desc: "“……结合我和我的团队在上文通过演算所列出的数据，我再次向您报告，舞缇娜先生，目前原子能在军事领域的应用就德国的工业能力和科技水平而言，远未达到投入实践的水平中。”\n海森堡再写完回信的最后一句话后，隔壁办公室的冯布劳恩端着两杯咖啡走进了海森堡的办公室。\n“还是关于原子炸弹的问题？”冯布劳恩将左手的咖啡杯放到海森堡的桌上，“两天前，她也向我询问了关于火箭技术运载原子炸弹的技术可能问题……”\n“把咖啡从我的桌子拿开，杯子十厘米内有我刚用的稿纸。”海森堡装完信封后径直起身打开椅子边的公文包，将一叠叠稿纸装进结实的牛皮包中。冯布劳恩没有拿起那杯冒着热气的咖啡，而是转身关上了办公室的门。\n“你知道我过来不是专门送咖啡的，”她忧虑地看着海森堡，“那天，舞缇娜在给我的信中谈到了关于你的事情，她还要求我随时报告关于你的一举一动……”\n“你应下了，盖世太保先生？”\n“当然没有，你知道的，我……”\n“那就没什么讨论的必要了。”\n“听着！”冯布劳恩一把抓住了海森堡装稿纸的手，“作为你的同事，我确实不该干涉你的私事。盖世太保们找到了我，她们知道你在和安东尼潘涅库克通信，她们向我出示了原件！包括一些红色文人给你的来信，她们全都有复印件，你很清楚你在干什么！”\n海森堡停下了收拾的动作，抬头直盯盯地看着冯布劳恩。\n“你会帮我吗，沃纳？”\n“……”\n“你这个疯子，海森堡小姐，彻头彻尾的疯子……”短暂的沉默后，冯布劳恩像喝啤酒般的灌下一大口苦涩的咖啡，“我再一次请求你，海森堡小姐，不要乘搭明天前往汉堡的轮船，离开了研究所，谁也保护不了你！”\n“你我不该参与到这些肮脏的政治中，我们也没有必要！”在海森堡没有作答后，冯布劳恩在做最后的努力，“战争，死亡，这些和我们没有关系，德国已经乱成一团，你更不应该参与其中，你是现在德国最杰出的量子物理学者，不幸和死亡不属于你，它们不属于海森堡！”\n喊声结束许久，沉默中似乎传来海森堡一声若有若无的叹息，她随即放入了最后一叠要带走的数据，拉上了牛皮包的拉链。她抬着头，用着那一双一如既往的冷漠的眼神，直视着冯布劳恩。"
  ah_germany.43.a: "“但是，沃纳，它们同样也不属于德国人。”"

  ah_germany.44.t: "重逢"
  ah_germany.44.desc: "“上次我们像这样面对面见面……”\n“1934年，奥地利时期德共一次会议。会上你还借我的钢笔来签字，恩斯特。”\n没有了电话中断断续续的杂音，听到彼此原初的声音，明日香和伊莉雅反而不适应了起来。今天是德国共产党完成转移的最后一天，波茨坦总部的人已经悉数秘密转移到多特蒙德支部——现在叫多特蒙德总部了。尽管明日香一再私下要求不要搞什么迎接仪式，但还是拗不过伊莉雅的强硬态度，在她的办公室里准备了一瓶开过的白兰地，算是一个小小的私人酒会。\n“薇莲，你这几年倒没怎么变，”晃了晃装着白兰地的酒杯，明日香一饮而尽，恢复了以往稳健的语气，“辛苦了，跟我唱了这么多年的双簧，就连我都差点相信，党内有一股以你为主导的左翼反对派。”\n“你可比当年我认识的那个辩护律师相比稳重了不少，”伊莉雅伸了伸酒杯，和明日香碰了一碰，坐到自己的办公椅上，“你知道，我这些年提出的反对意见也不可能完全都是逢场作戏……但是，你的决定很对，我确实主导并很好地控制了党内的反对派势力，国际方面也认为有插手主导权的空间而加大了支持我的力度。在这一点上，恩斯特，我敬你一杯。”\n“为了德国与人民。”“也为了自由与希望。”\n两人将各自的酒杯清空，伊莉雅又给彼此续上，明日香端着酒杯，望着办公室窗外一片漆黑的夜晚。\n“一切都准备妥当了吗？”望着窗外许久，明日香略带焦虑地思考着一切可能出问题的环节，二十多年前斯巴达克斯的惨状历历在目，她们输不起第二次了。\n“米伦多夫负责的工会组织，恩格尔主管的起义军队，和史密斯的地下战线组织，今天上午分别向我做了报告，”伊莉雅拍了拍明日香的肩膀，她显然知道明日香的担忧，“我们该做的事情已经无可苛责，接下来的一切，就看我们所能做到的最好，和同志们的努力吧。”\n她们两人又谈了很多很多，从革命的准备工作，到两人彼此的个人生活，两位老同志仿佛有说不完的话要在这短短的一夜讲完。不知不觉间，时间已经来到了后半夜，在有点喝高的明日香眼里，好像窗外漆黑的地平线已经有了一抹红色。\n“时候不早了，早休息吧。”明日香望着已经见底的酒瓶，有点摇摇晃晃地站起身来，几年以来，专心于革命工作的明日香几乎没喝过酒，这瓶高度数的白兰地显然有些受不了，而对面同样脸部泛红的伊莉雅，则同样证明了这一点。\n“隔壁有我常用的行军床，虽然小了点，但是两个人挤一挤还是能睡得下的，”伊莉雅显然也不再有一开始的严肃神色，放松了不少，“当然，如果你嫌挤的话，我可以睡地板的。”\n“去你的吧，”明日香摆了摆手，“我领导罢工的时候，水泥地面都睡过，你就别跟我这个老资格讲什么客气了。”\n随后，在微弱的煤油灯光中，两人肩并肩走出了办公室，这是数年来，她们首次发自肺腑地感到轻松和愉快的时刻。\n当然，对于明日香而言，这一晚唯一留给她的糟糕回忆，是晚上伊莉雅老是抢她的被子，使得她不得不拿来自己的大衣盖在身上。"
  ah_germany.44.a: "团结一致到永远。"

 #希尔线事件链
  ah_germany.85.title: "因果交织的疯狂..."
  ah_germany.85.desc: "结束了，一切都结束了，彻底失败了，我们经历了圣杯王国传说中的血腥召唤，成功办到了春雪异变的既定目标，屠杀了卡西米尔大地上99%的人类，献祭了苏联保存的所有库洛牌，最后，我们举全国之力运行的时间之钟也在不知名的原因中消失，这一切的打击让整个密会陷入绝望。\n\n目睹时间之钟失败的希尔，在那一刻她并没有表现得太过伤心，在成员还沉浸在绝望之中无法自拔时，她独自一人静静地离开了，走出山洞，煽动着不可名状的双翼，独自向柏林城中心飞去，回到她最后的心灵平静之地——元首官邸的地下室，莉莎冰棺的旁侧。\n\n她从房间中拿起一对酒杯和一瓶葡萄酒，那是她和莉莎还在维也纳准备报考维也纳艺术学院时为寻找灵感亲手酿造的。\n\n她拿起这满含回忆的酒瓶，轻声低语道：“莉莎，这次我又失败了，真是可笑啊，这最后的机会也以如此可笑的方式结束了。”\n\n随后，她将酒到进酒杯，一杯倒在冰棺之上，另一杯被她一饮而尽，但她仿佛没得到满足一般，那起酒瓶，自斟自饮起来。酒渐渐见底，而希尔的神情也渐渐扭曲，哭泣声回荡在整个房间。\n\n“莉莎，你说我一开始是不是就是错的，一开始我就不应该妄想复活你，你说啊，说啊......”希尔用沙哑的声音说道。\n\n“莉莎，我该怎么做，求求你，告诉我该怎么做，求求你，就想以前那样，告诉我该做什么，求求你了......”希尔的语气从嘶吼变成了乞求。\n\n希尔的双翼变得颤抖、虚化，她知道体内的力量已经不受控制了，那鲜血、屠杀、破坏的因果开始在她的身上交织。地狱的低语在希尔耳边响起，希尔喃喃道“既然这个世界容不下我和莉莎两人，那这个错误的世界也没有存在的必要了，就让这个丑陋的世界给我和莉莎陪葬吧。”\n\n希尔在绝望之中陷入疯狂，身体里绝望的因果再也不受控制，来自深渊的恐怖从她身上散发，希尔消失了，她变成了一阵黑色的瘟疫风暴，来自地狱的黑暗席卷了整个德意志......"
  ah_germany.85.a: "对不起...莉莎......"

  ah_germany.87.title: "许久之后"
  ah_germany.87.desc: "--华沙--\n\n“妈妈，地图上那块黑黑的是什么？”\n\n“...孩子，那里曾经叫......德国...是我们的故乡。那里曾经有一位大英雄，但是大英雄离开了我们，于是一位疯子带着我们想尽办法找回那位大英雄，可是我们失败，最后还毁掉了我们的祖国”\n\n“那等我长大了，一定要想办法修好故乡”\n\n芬恩愣住了，她抱紧了女儿，潸然泪下，“嗯，妈妈等你”。\n\n芬恩，希尔曾经最忠诚的信徒，第一批前往卡西米尔的移民之一。"
  ah_germany.87.a: "德国，多么令人熟悉的名字啊。"

  ah_germany.88.title: "黄粱一梦"
  ah_germany.88.desc: "连续数月的劳累和压力压垮了希尔，她终于倒下了，在办公桌上睡着了。\n\n希尔的眼前出现了一片白色，从白色走出一个人影，是莉莎。\n“莉莎，你终于回来了吗？我成功了吗？”\n“不，是一个叫控制台的力量让我暂时回来了”\n“控制台？”\n“这个不重要。我这次回来，是为了告诉你，希尔。你已经很努力了，但你不应该把精力放在我这个已死之人身上，我们更应该珍视现世之人，不是吗？人死不能复生。”说罢，莉莎把希尔拥入怀中，“已经不用再战斗了”\n\n希尔慢慢从梦中醒来，确发现泪水已经流满面庞。"
  ah_germany.88.a: "“似乎，做了个美梦呢。”"

  ah_germany.97.title: "后续"
  ah_germany.97.desc: "要事？怎么会有比检阅德意志的新鲜血液更重要的事呢？（舞缇娜）\n嗯？你在教我做事，舞缇娜。（希尔）\n怎么会哪？我只是觉得检阅更重要，没有别的意思，对我的僭越行为，我感到抱歉。（舞缇娜）\n哦？检阅更重要？好，那我就去看看你那个所谓的德意志的新鲜血液。你去你的研究室准备准备，我明天就去你那里进行检阅。（希尔）\n如你所愿，我的元首。（舞缇娜）\n\n舞缇娜转身离开了元首办公室。\n望着舞缇娜离开的身影，希尔又想起了挚友莉莎的忠告：“你要记住舞缇娜这个人可用而不可信啊，要小心她。”\n喃喃自语到：“看来莉莎，你又对了一次。”（希尔）\n随后，她拿起了元首办公桌上的电话。"
  ah_germany.97.a: "帮我接古德里安将军。"

  ah_germany.98.title: "各方暗流"
  ah_germany.98.desc: "舞缇娜视角：\n离开了元首办公室的舞缇娜，擦了擦额头上的冷汗，“没想到希尔这个家伙疑心病挺重啊，不过只要你要来……”\n“开车，回研究所”我们得给我们的元首准备一些惊喜。\n\n古德里安视角：\n元首，你没说错吧，秘密包围舞缇娜的研究所？（古德里安）\n古德里安，你没有听错，舞缇娜已经有背叛的准备了，准确无误。古德里安，我想莉莎单独嘱咐的你不会背叛吧。服从元首的命令。（希尔）\n是，我的元首，保证完成任务。（古德里安）\n对了，另外，明天你随我一起，去见见那个你口中不可能叛变的舞缇娜吧（希尔）"
  ah_germany.98.a: "为了莉莎也为了德意志，行动"

  ah_germany.99.title: "舞缇娜的终末"
  ah_germany.99.desc: "次日，舞缇娜研究所外\n\n我亲爱的希尔女士，你终于来了，我已经做好准备接受检阅了。（舞缇娜）\n哦？已经准备好了吗？那真是让人期待呢。不过，在那之前，我有一点事想问问你，伟大的黑魔法师—舞缇娜阁下。（希尔）\n希尔元首，你究竟要问…问…什么…，我一定知无不言。（舞缇娜）\n知无不言？那么我就问问你，你说~这研究所里给我准备了什么惊喜。（希尔）\n什么惊喜？那…那…那当然是德意志的新鲜血液了。（舞缇娜）\n还知无不言？我看并非如此，舞缇娜，你的回答错误。（希尔）\n哼，既然你都知道了，还敢前来，那我就不客气了，让你看看黑魔法的强大吧。（舞缇娜）\n哈哈哈，既然知道了还会前来，那我就不可能没有准备。古德里安，动手！我要抓活的。（希尔）\n随着几声枪响，埋伏在研究所周围的士兵鱼贯而出，整个研究所被几个师的兵力围得水泄不通。虽然舞缇娜和研究所的人员疯狂反抗，但面对热武器和百倍于己的部队，还是如风中残烛般迅速被击溃。舞缇娜被全是捆绑带到了希尔面前。\n她奶奶滴，给我玩阴的是吧，希尔，你这个卑鄙之人。（舞缇娜）\n卑鄙之人，真是个不错的赞美之词。不过咱们俩彼此彼此，不是吗？（希尔）\n你懂什么，这什么为了世界，你明白黑魔法的强大吗，你根本不明白我在干什么。（舞缇娜）\n为了世界？又是一个自缪为世界救世主的疯子，你这样的疯子，不需要活在这个世界了。（希尔）\n不…不…希尔，你不能杀我，我能帮你，我能帮你复活莉莎，不不不……不能杀我，世界还需要我……不……（舞缇娜）\n我的事，不需要你来指指点点，再见了大魔导师阁下。（希尔）\n嘭，随着一声清脆的枪声，德意志的大魔导师舞缇娜，倒在了血泊之中。\n古德里安，封锁搜查整个研究所，排除一切危险，我倒要看看这舞缇娜在搞什么鬼。\n是，我的元首，我为我之前的反驳抱歉，没想到舞缇娜真的……（古德里安）"
  ah_germany.99.a: "柏林斗争结束了"

  ah_germany.100.title: "希尔的疯狂"
  ah_germany.100.desc: "舞缇娜的研究资料，被秘密送到了元首官邸的地下室。\n昏暗的灯光，鲜红色的眼眸，狰狞的表情，阴森的笑声中夹杂在点点抽泣声在官邸的地下室中回荡。此时，地下室的莉莎水晶棺旁，希尔正瘫匐在一侧。\n“莉莎，我的莉莎，你有救了，我是不会让你抛下我独自长眠的，我一定会将你复活，只需要一点点时间，再等等，你再等等，莉莎。”\n\n次日，希尔召集了军队里决定忠心与莉莎和自己的高级军官，秘密组建了一个高级别密会-重生之眼。"
  ah_germany.100.a: "莉莎重生的希望……"

  ah_germany.101.title: "鲜血召唤之仪"
  ah_germany.101.desc: "终于，德意志的铁蹄踏破圣杯王国腐朽的统治，这个数百年的秩序缔造者，臣服在希尔的脚下，但这不是我们的最终目的，我们将亚瑟这位昔日的王者控制、洗脑，从她的口中得到了我们想要的秘密......\n在一个深夜，月亮高挂在天空之上，在亚瑟的诞生之地——巨石阵，数位魔术师站在魔法阵四周，数千人被禁锢在法阵的外围充当祭品，而希尔独自站在法阵中央。周围的猩红蜡烛燃起幽蓝火焰。希尔穿着黑袍，神情凝重。魔术师们开始在魔法阵中慢慢地画出符号，一条条线条贯穿在希尔脚边的圣杯。魔法阵开始发出微弱的光芒，转动着。魔法师们开始唱着咒语，声音逐渐变高，变快，回荡在整个空间。\n希尔感到一阵剧烈的闷热，她的身体开始不自觉的发抖了。咒语愈来愈快，愈来愈大声。希尔感到自己的灵魂已经离开了身体，她开始体验到了全新的感受：飞在天上、穿越时间的感觉。一阵强烈的光闪现，希尔的领口突然裂开，鲜血流出，汇入到下方的圣杯里。随着鲜血的注入，圣杯散发出更强的光芒。祭品的眼神开始涣散，无声的摊到在地，直到最后一个人停止呼吸。\n在这一瞬间，一个虚影出现在圣杯上空，希尔和她对峙着，表情先是喜悦，再到惊讶，最后是沮丧。因为出现的英灵，并不是莉莎，而是不知是什么时空的希尔自己。她本以为以她这位莉莎最亲近的人的血夜为媒介，可以召唤莉莎回归，可现在......\n“喂，我……”\n希尔尽可能保持清醒地说道，但话还没有完全说完就看到不可思议的一幕，虚影向她飞来，一瞬间的接触，两个实体变为了一个。希尔和英灵希尔合而为一。\n希尔感觉到，她正变得更加强大。感到身体强加倍数的力量。她的呼吸变得更深沉，感觉神经末梢更加灵敏，对魔法的感触更加敏锐。\n然而，这并不是希尔想要的，她只想复活莉莎。现在圣杯的魔力已经耗空，短时间已经无法召唤。"
  ah_germany.101.a: "复活莉莎只能另寻它法了。"

  ah_germany.102.title: "二次春雪异变"
  ah_germany.102.desc: "德意志的铁军已经控制整个幻想乡，莉莎的复苏计划如期开始推进。过去幻想乡大地上的古老传说被密会一点点收集，远古复活仪式的各种细节也在调查中得以浮现。\n冥界与现世的结界，早已在过去的异变中被破坏殆尽，形同虚设。如幻想乡的普通居民一般，希尔和党卫军轻松跨过了现世与幽冥的交界，十万余部队开赴冥界中央之地——白玉楼，那是一座外观传统的和式庭院，院子里种满了各式的樱花和妖怪樱。而在院子中心，竖立着一棵巨大的樱花树。那正是希尔此行的目的，春雪异变的戏码将再次上演。\n西行寺幽幽子已然被希尔控制，她将是二次春雪异变的关键，然而这次异变将不是她能左右。整个幻想乡地区，已经被数以百万计的法阵铺满。幻想乡的所有“春度”将被收集，强行榨入“西行妖”的体内，令这棵万年枯树开花，它根系之中沉眠的尸体也将复活。当然，根系下的沉眠之人已经换成了莉莎。\n异变开始了，无垠的雪花从天空中飘落下来，伴随着严寒極致的寒氣。幻想乡的村民们疑惑不解，这雪花竟然如同冬季一般，天寒地冻。而随着雪势愈发的严重，许多鸟类、昆虫等生灵开始纷纷死去，田地也因寒冷难以耕作。\n这些雪片不同于寻常飞雪，它们呈现出一种诡异的美感，被漫天飘洒的白色雾气演绎得淋漓尽致。从高空俯瞰，整个幻想乡彻底沉没于白色的世界之中，没有一处留下了生命的痕迹。\n幻想乡的最后一丝丝“春度”已然榨取殆尽，几十年内幻想乡都将没有春天降临，有的之是无尽的寒冬。“西行妖”也以通过幽幽子吸收了所以的“春度”，满开已然达成。\n它是如此圣洁，丝丝微风吹过，樱花随风飘洒，风越吹越大，在“西行妖”形成了一场樱花风暴，希尔知道，真正的仪式已经已经进入最关键的阶段。\n樱花风暴之中，“西行妖”渐渐解体化作风暴的一部分。风暴化作一条长龙，但如预期的融入莉莎体内并没有发生。粉色的长龙在白玉楼上空盘旋几周，直直的向希尔冲去，希尔在重击之下，嘴角流出血丝，但长龙在接触到希尔的身躯后化作云烟，仿佛是融入希尔体内一般......\n一切尘埃落定，我们都理解错了，传说的目的，没有什么复活的秘密，有的只是富士见之女身份的传承，命运的轮回......"
  ah_germany.102.a: "富士见之女的命运齿轮再次拨动。"

  ah_germany.103.title: "屠戮与新生"
  ah_germany.103.desc: "德意志的军队已经彻底占领原卡西米尔的土地，现在，是时候执行那个计划了！\n为了尽最大可能的绽放生命之花，我们得给卡西米尔地区的优秀公民精心准备一次强制“体检”，给她们打一点带有小小魔法的疫苗，当然，这一切都是免费的。\n这次福利一定会让她们对我们感恩戴德而“言听计从”的。\n在卡西米尔的各个城市中，整个地区的人们都各自向所在地区的中心城市聚集，准备着举行这一场世上最为宏大的献祭仪式。这是为了唤回她们心中最为珍爱的领袖莉莎，向她表示感激并且祈求她的归来。\n华沙市中心的巨大的广场上，广场中央立着一个巨大的火堆。紧接着，一位美丽的女子出现在火堆前方，火堆的另一端是一个巨大的魔法阵，法阵正中心是封存着莉莎躯壳的冰棺。她的手中持有一把古老的法杖，身着一袭华丽的黑色长袍，向众人发出最为深沉的呼唤，那是这场仪式的序言：\n“莉莎，我的爱，我在此祷请你的归来。让我们再次见到你的光辉，做德意志土地的守护者。我用我的心，用卡西米尔人的生命之花，向你去献上。”\n一阵沉寂之后，整个广场升起了一片歌声。歌声悠扬，如同天籁之音，在歌声的烘托下，广场中的火焰也开始变得更加阴森恐怖，燃烧的爆裂声，夹杂着子弹的呼啸声，人群的惨叫声，鲜血流淌声，此起彼伏。\n同样的献祭，在整个卡西米尔地区上演着。随走人群的倒下，白色的微光，渐渐向华沙城上空聚集，聚集成一个巨大的光球，随着这些身影仿佛融入了空中的光辉，有如水滴消失在了大海中，光芒也越来越耀眼。\n屠杀接近尾声，希尔也咏唱起古老隐晦的咒语，火焰闪动着渐渐升高，向头顶的光辉袭去，如同一只火焰巨蟒，将光球彻底吞没，转头融入封存着莉莎躯壳的冰棺之中。\n时间一点点过去，但希尔所预料的莉莎复苏，并没有出现。一天过去了，希尔实在急不可耐，走进魔法阵中，俯身观察起莉莎来。正在此时，莉莎的面色开始有了一丝丝红润，双眼微微颤动，渐渐睁开，这一幕让希尔喜极而泣。\n然而，眼泪甚至没有流下脸颊，莉莎的头顶，那团白光再次飞出，而且逐渐变黑，冲向一脸茫然的希尔，和希尔融为一体。希尔也在这之后，重重的摔倒在地。\n当希尔再次醒来，已经是位于元首宫的病床上，很奇怪，她感觉自己更强大了，身体里有一种奇怪的力量，在蠢蠢欲动。在窗户的玻璃上，映射着希尔的面庞，但奇怪的是，头顶多出拉一个圆形的黑色光圈......"
  ah_germany.103.a: "卡西米尔已无一人生还。"

  ah_germany.104.title: "红场上的血色樱花"
  ah_germany.104.desc: "莫斯科沦陷了，有志之士还在做着最后的抵抗，但已无法改变战败的事实。纳粹的暴徒已经接管整个城市。各个街区，大批荷枪实弹的纳粹疯子好像在搜寻着什么人。嗯？好像是在找库洛牌魔法师吧。\n在克里姆林宫中，一场不对等的交易正在展开，木之本樱：这位苏联的领导者，正全身禁锢的坐在胜利者的对面。\n结果显而易见，面对希尔，她没有任何的谈判资本，对于她的底牌——库洛牌。希尔仿佛了如指掌，一语就道破了复活莉莎可能的方法——时之卡。\n她瘫软在座椅上，她知道，对面的这个女人，已经为发动时之卡做足了准备，整个俄罗斯的百姓已经被她控制起来，送进了集中营，几乎所有的库洛牌魔法师也被她集中控制起来，一切准备得是那么完美，就等着我这位笼中之鸟放下挣扎，配合着她的计划行动了。\n红场的正中央，架起了一座高台。一座冰棺被放置于正中央，苏联的领袖木之本樱身着平生最为华丽的礼服立于棺前，静静的等待着最后时刻的到来。\n众多魔法师聚集在广场上，她们看向那位大魔法师，如她们所想，曾经的领袖站在高台中央静静的等待着一切准备就绪。她们被告知，只需要帮助她们曾经的领袖完成一项伟大的魔法，就将重获自由。\n她的眼神深沉，似乎在思考着什么重要的事情。她静静地站在那里，观察着周围的一切。随着时间的流逝，天色渐渐变暗。这个时间点，正式是启动时间之卡的最佳时刻。众多魔法师也都跟着小樱的指引，挥动起魔杖，将自身的魔法都汇集于小樱身上，用来支撑这场仪式。\n时间渐渐过去，开始有魔法师魔力不足，瘫倒在地，但奇怪的是她们的魔力供给并没有中断，越来越多的魔法师发现了情况的不对劲，但不管她们如何努力，魔力供给都未被斩断。时间再度流逝起来，所有的魔法师，都已倒地，她们被的魔力，甚至是生命都已经被榨取得一干二净，现在整个红场，只有小樱，希尔两人还活着......\n“对不起，各位，我无能为力！”\n小樱完成了最后的咏唱，所有的库洛牌都随之解体，化作纯净的魔力。时之卡的力量开始显现，小樱的身躯开始消散，化作一棵血色的樱花树在红场之中绽放，樱花在整个红场之中飞舞。莉莎的身体开始渐渐复原，一切仿佛如此顺利。\n然而希尔所预想的莉莎复苏并没有发生，即使身体已经回复到莉莎年轻的样子，她的生命依旧没有回归。希尔瘫坐在冰棺之旁，她不明白，一切究竟是为什么......\n血色樱花消散了，它化作了一张库洛牌，飞身融入了希尔的身体之中。她的手背上出现了一棵血色樱花，时之因果，开始牵动着她的一切......"
  ah_germany.104.a: "莉莎身体复原了，但还差些什么。"

  ah_germany.105.title: "时间之钟成功的......"
  ah_germany.105.desc: "当我们的元首希尔缓缓走进这座位于山脉中心的时候，她的眼神空洞，但时不时又变得狂热的笃信。她的步伐缓慢，像是有什么力量在阻止她向前一般，身后那如恶魔般的双翼，散发着强大而又神秘的黑暗魔力。\n整个重生之眼密会的高层都来到这最后希望之地，等待着最后时刻的降临。她们的努力是否得到回报，或许就在这一刻实现。\n她们隔着玻璃，望向那身处矿洞中央那如同钟形的巨大机器，在矿洞周围的透明容器中贮存着一种名为“IRR-Xerum-525”的暗红色粘稠液体，它是来自世界世界各地的源石经过液化、提存、混合后，得到的一种高浓度魔力聚合物，用着一种特殊的软管连接到钟上，为其持续运转提供原料。\n在希尔的一声令下，宣布时间之钟启动后，时间之钟开始散发出幽蓝的光芒，配套建立的变电场开始接收全国的电力，发出嘶嘶轰鸣，不时有电火花四溅飞出，随着电压的升高巨钟的主体开始旋转，发出嗡嗡如图蜜蜂震翅般的声响。旋转的速度不断增加，巨钟也缓缓升空，散发的光也从幽蓝变为暗紫，魔力原液以肉眼可见的速度消耗着。这一刻时间都仿佛变得粘稠，心跳都变得如此缓慢。\n不知过了多久，巨钟的速度已经加快到一个难以想象的速度，直到某个瞬间，一阵闪光照亮了整个山洞，随之而来的就是静，死一般的寂静。在经过强光导致的短暂眩晕后，所有人都将目光时间之钟本应所在的位置，那里空空如也，只有几根软管在四处喷洒着魔力液。\n所有人都在等待着最后的结果，一分钟、一小时、一天，时间渐渐过去，但如大家所想的时间逆流，并没有发生，或者说，我们根本不知道时间之钟是否成功。\n但从结果来看，时间之钟消失了，或许我们成功了，但就我们想要的目的来看我们也失败了。"
  ah_germany.105.a: "时间之钟成功了，我们却失败了。"

  ah_germany.109.title: "救世之雨"
  ah_germany.109.desc: "整个德意志的无线电信号正在减弱，各个总督区已经很久没得到中央的信息了，慢慢的，整个德意志地区已经没有任何无线电信号被侦查到。全身溃烂的人和动物的尸体出现在边境的附近。\n整个德意志正在死去。\n此时，在一个不知名的山巅。\n“你醒了，没想到你居然能醒过来。”\n“奇多？我这是？我原来已经死了呀，可是为什么我又...”\n“嗯？不对，德意志这究竟是...是希尔的气息...原来是这么一回事啊，希尔你还是这么傻！”\n“看来你已经知道来龙去脉了，需要我帮忙吗，我先说好，这不是在帮你，只是不想看见菈菈伤心。”\n“哈哈哈，奇多，我们也是老对手了，没想到你还有这样一面。不过，我还真需要你帮我一个忙，帮我封锁整个德意志，不要让这场灾难波及其他地方。”\n“不需要我出手结束这一切吗？”\n“不用，这是希尔的错，只能我来负起这个责任，之后的德意志，能拜托你吗？”\n“真是不懂你们人类，知道啦，知道啦，之后我会负责善后的。”\n防止病毒的扩散，整个德意志被奇多用力量封印。\n看见这一切的莉莎，对奇多鞠了一躬，身影逐渐虚化、消失，莉莎用尽最后的灵魂，唤醒沉睡的德意志大地，一场绵绵细雨开始从山巅扩散开来，黑色风暴在接触到雨水后，渐渐消散。\n莉莎和希尔的灵魂也随着风暴和细雨一同消失不见。"
  ah_germany.109.a: "地图上，德意志只剩下一片漆黑"

  # ah_germany.110.title: "尾声"
  # ah_germany.110.desc: "德国已经死了，当远在戴比路克星接受领袖培训的皇储结城梨斗知道这个消息时，完全无法接受德意志已经逝去这一沉痛的消息，他决定做点什么，来拯救他的德意志故乡，而这一想法，也得到了戴比路克星海帝国皇后和三位皇女的支持，可能唯一不开心的就是皇帝奇多了，不过他也没有阻止的行动。\n在皇储和三位皇女的号召下，一大批救援物资在地球上空集结，皇帝奇多也没再儿戏，强势压制整个星球上空的结界。戴比路克带着救援物资，重返德意志的大地，梨斗和菈菈也随着救援部队回到了他的故乡德意志。\n梨斗和拉拉柏林废墟之中，回到了他们曾经居住的地方——元首官邸，在地下室，他们发现了两个手拉着手的婴儿......"
  # ah_germany.110.a: "这或许是世界最后的温柔吧。"

 ###生活状态
  ah_germany.65.title: "午后老街"
  ah_germany.65.desc: "“这已经是这个月这条街挂起的第三枚铁十字徽了。”苏菲饮下一杯烈酒，在心底里嘟囔道。\n\n在纳粹党的宣传中，德意志国在“至上元首”莉莎的领导下，于短短几个月的时间内就实现了经济复苏，大大小小的工厂公司拔地而起，琳琅满目的商品堆满了超市的货架，各式各样的私家车穿梭于大街小巷之间——但这都似乎跟这条街道无关。自苏菲有记忆以来，她最初看到这条街道是什么样子，现在若把铁十字徽、元首画像等东西去掉之后，就还是什么样子。\n\n“你听说了吗？卡塞尔先生的儿子最近当上了党卫军的尉官......”听到邻桌的对话后的苏菲皱了下眉头，又饮下一杯烈酒。\n\n能在军队中服役并身居要职，这在任何一个国家都是一种荣耀，但苏菲可不这么认为。半年之前，就在这条街上，她曾亲眼目睹过一名国防军军官如何将一位已经放弃抵抗的德共成员使用各种残忍手段虐杀致死——而这一切都只是为了训练几个新兵！她们究竟是抱着怎样的一种心态，才会试图教这些连枪都拿不稳的新兵们去干出这种禽兽不如的罪行？\n\n“各位听众朋友们下午好，这里是帝国之声。”吧台的收音机响了起来，“三日后将在勃兰登堡门举行阅兵仪式，届时伟大的莉莎元首将亲自接见因伤退役的老兵们......”\n\n“好一个因伤退役！好一个老兵！”苏菲此时只想狞笑，光是这条街上，就有十几位花季少女为了那所谓的“复仇之战”献出了自己年轻的生命，而她们的家属所能得到的只有一封薄如蝉翼般的慰问信，以及根本支撑不了几天花销的抚恤金，“老兵能得到慰问，那么那些战死沙场的新兵呢？当她们冒着枪林弹雨奋战的时候，莉莎和她的狗腿子们又在哪个地堡里面悠哉游哉地过日子呢？当她们好不容易全身而退，得为以后的生计来回奔波的时候，纳粹党那帮混账玩意又......”\n\n随着全场突然陷入死寂，苏菲才意识到她闯下了大祸：在过于激动之下，她将自己心中所想全都大声喊了出来。\n\n“GR-1385号情况报告，我们已经定位了一名颠覆分子，请求执行NP-1934号命令。”在不远外的一张小酒桌旁，一位黑衣人低声说道。"
  ah_germany.65.a: "从此之后，这条街上再也没有人见过苏菲了。"

  ah_germany.66.title: "芬恩的一天"
  ah_germany.66.desc: "柏林城郊的某个不知名的剧院中。一场莉莎带领铁十字战士大战魔导国怪物的话剧正在上演。\n\n“这是这段时间第几次演出这场话剧了？”\n\n“好像是第17次了吧。”\n\n“17次？咦，这么多，不过也是这种真实改编的话剧，大家都喜闻乐见，是吧。你看，你看，那个不死族怪物好滑稽，哇偶，又到了最经典的桥段，莉莎飞升成圣神。”\n\n话剧结束，埃利亚斯和好友芬恩一起走出剧院，一队党卫军迎面向她们走来，芬恩双眼放光，郑重的行了一个纳粹军礼，走来的党卫军也回以礼节。\n\n“好帅，你看见了吗，她们给我回礼了，再过几天，我也可以加入莉莎青年团了，好期待啊。”\n\n“你只差几天了吗，我还要再等两个月，不过我不怎么想参加，也不知道会不会和你分到一起。你听说了吗，新元首好像计划复活莉莎元首，好像还在招募能人志士。也不知道能不能成功。”\n\n“一定可以的，不死族都能被打跑，这有什么难的。莉莎元首，那可是一位可以比肩耶稣的神一般的人物。只不一定她也是上帝的女儿呢。她肯定还在天堂等着我们将召回呐！”\n\n“希望如此吧，不过常理来说人死是不能复苏的。咦，我到家了，先走了，芬恩再见。”随后，芬恩也独自一人回到巷子里的家中。\n\n“芬恩，你今天去哪儿了？”母亲担忧的问道。\n\n“我去剧院看莉莎成神记了，妈妈，那个可好看了，回来我还遇见党卫军的大哥哥了呐！”\n\n“啊！党卫军，你有没有受伤，她们有没有对你做什么，你怎么逃回来的。”\n\n“什么逃回来的，我在路上遇见的，还给她们行了军礼呐，而且她们还回了军礼哦。”\n\n......\n\n与此同时，在小巷的另一头，一群党卫军封锁了这端的巷子，正在对着逃亡的一个名叫埃利亚斯的孩子大肆搜捕，她的父母已经归案，并将得到严厉的制裁，她们因发表不支持新元首的言论被判阴谋煽动叛乱罪，将被执行枪决。"
  ah_germany.66.a: "我们生活在莉莎主义的恩泽下"

  ah_germany.70.title: "平步青云"
  ah_germany.70.desc: "“从今天起，你就是开采部的主管了。”总裁将手放到基恩身上，低声说道。\n\n皇家鲁尔矿业公司——虽说几个月前还没有皇家这个前缀，基恩失业将近半年后在这里找到了一份新工作。虽说她本就是一名老矿工，对自己能否入职非常有把握，但她怎么都想不到，也想不通自己为什么自己一进来就能身居如此高位。\n\n“知道为什么你一进来就能直接坐上这个位置吗？”仿佛看透了基恩的心思一般，总裁从堆满求职信的办公桌上拿起一根做工精致的烟斗，轻轻加入一卷烟丝然后点燃，随后问道。\n\n“因为——因为我工作阅历丰富？还是你们确实缺人？”基恩试探性地问道，在烟丝燃烧的火光下，她的背影若隐若现。\n\n总裁拿起烟斗深吸一口：“你这都只猜对了一半。自从皇帝陛下全权掌控这里之后，我们的首要工作就是优先为帝国服务，就得核查现有的员工有没有问题。有严重问题的当场开除，稍微有些问题的送去再培训，像你这种履历清白到没有一丝污点的......”\n\n总裁沉默了。怎样才能定义为有问题？是早年间曾和纳粹党同流合污，还是祖上参与过推翻帝制的暴乱，抑或是背叛了整个德意志民族而选择向不死族卑躬屈膝？她们先前所犯下的过错真能葬送她们的现在以及未来吗？或者说，如果她们为了生存不得不做出那些选择，那她们真的犯下了过错了吗？再反过来考虑，现在的没有过错又意味着什么呢？她们是全心全意地为帝国服务还是仅为了谋取生存所需的食粮呢？\n\n沉思片刻，总裁将心中的胡思乱想甩到脑后，缓缓放下烟斗。"
  ah_germany.70.a: "“说到底，我们也只是皇帝陛下的臣民罢了。”"

