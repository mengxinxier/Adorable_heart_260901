 ##民族精神
  DVL_open_showdown_between_prime_ministers: "公开化的宰相对决"
  DVL_open_showdown_between_prime_ministers_desc: "魔导国内部的权力斗争几乎都在围绕着两位性格和方略截然不同的宰相展开。更麻烦的是，君威莫测，没有人知道哪一派会在最后一刻赢得胜利，只知宠信只在一念之间。"
  DVL_Gradually_accepted_rule: "逐渐被接纳的统治"
  DVL_Gradually_accepted_rule_desc: "这片土地上的凡人正在理解魔导国的伟大理念，现实令他们逐渐放弃天生的敌视与抵抗，开始接纳我们的统治方式。"
  DVL_All_king_land_idea: "莫非王土"
  DVL_All_king_land_idea_desc: "“土地上的一切财富，都属于魔导王陛下”"
  DVL_All_king_courtier_idea: "莫非王土，莫非王臣"
  DVL_All_king_courtier_idea_desc: "土地上的一切财富，都属于魔导王陛下，土地上的一切生命，都属于魔导王陛下"
  DVL_King_of_kings_idea: "万王之王"
  DVL_King_of_kings_idea_desc: "以魔导国的至高君主安兹·乌尔·恭为万民之主，众神披靡，诸王俯首。此刻在魔导的铁蹄下，任何顽抗之人皆需思虑再三，要么屈膝臣服，要么化为齑粉。"
  DVL_utopia_idea: "乌托邦"
  DVL_utopia_idea_desc: "我国对领内良民的管理已臻于至善，不管其他顽抗的政权如何诡辩，她们都掩盖不了一个事实：魔导国的社会是一个不折不扣的乌托邦天堂。"
  DVL_Send_signal_of_goodwill_idea: "释放善意信号"
  DVL_Send_signal_of_goodwill_idea_desc: "魔导王作出了最后的裁决，他将逐步改变之前对人类以及其他种族的压迫性政策，对人类开放更多的高层岗位，放松言论管制等等。为此，他直接更改了各大守护阶层的指令，并逐步开展有关对人类友好的培训课程。这些行动让守护者们产生了不同的看法，而各大种族也并非完全买账，不少人认为这是魔导王麻痹人类的阴谋。但王已作出抉择，唯有时间能够证明他选择的正确与否。"
  DVL_All_nations_return_to_hearts: "万邦归心"
  DVL_All_nations_return_to_hearts_desc: "伴随着我们对外的扩张，并不断将新的领土纳入掌控，我们的政策也在新的疆土上落地实施。在我们长期的统治下，旧有的疆土上，各被征服种族已经认同并不排斥王的统治，王公正的裁决也在逐渐消弭每一位被征服土地上人的反抗之心，至于剩下的那些极端分子，相信他们不久就会被他们自己的人民所遗忘。"
  DVL_Reign_supreme_in_world_idea: "君临天下"
  DVL_Reign_supreme_in_world_idea_desc: "我们的努力得到了最丰盛的回报。随着全球征服的大获全胜，我们终于将这个星球全部的国土都纳入了王的统治之下，王之大名无人不知，王之统治威严却不失法度，没有人再会质疑王的胸襟所在，哪怕最激烈的批评者也会由衷的赞美王是世界上最伟大的统治者，无人可超其右，没有人再敢站出来反抗。我们真正的在这个星球上建立了一个万世一体的乌托邦\n从此以后，再无战争和分歧，只将有永恒的秩序。"
  DVL_Expanse_two_legged_sheep_pasture_idea: "扩建“两脚羊”牧场"
  DVL_Expanse_two_legged_sheep_pasture_idea_desc: "“就按你的意思办吧。不过话说回来，什么是两脚羊呢？”“啊，是一种极其低贱的生物呢，不过要想做卷轴的话，这个世界只有它的皮革可堪一用。”"
