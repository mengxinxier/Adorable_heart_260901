###  国策
 ##外交国策
  DVL_Ministry_of_Foreign_Affairs: "魔导国国家外交部"
  DVL_Ministry_of_Foreign_Affairs_desc: "至高无上的吾王似乎并不想迅速统治这个世界，那么与这些虫子之间就需要有一个沟通渠道。设立国家外交部，让她们觉得不过是土地换了一个主人，放松她们的警惕。当然，现在外交部的首要任务是清理这片土地。"
  DVL_Bavarian_affairs: "巴伐利亚事务"
  DVL_Bavarian_affairs_desc: "巴伐利亚政府一直对我们充斥敌意，现在我们已经腾出手来，让她屈服还是毁灭，都是安兹大人的仁慈！"
  DVL_Bavarian_Arrange_battle_plan: "安排作战计划"
  DVL_Bavarian_Arrange_battle_plan_desc: "决定已经下达，彻底摧毁巴伐利亚人民的抵抗意志，伟大的安兹大人万岁！"
  DVL_Bavarian_Pre_war_preparations: "战前准备"
  DVL_Bavarian_Pre_war_preparations_desc: "充足的准备是必胜的先决条件，后勤、情报、士气缺一不可，让我们准备好，给予敌人致命一击。"
  DVL_Bavarian_Dispatch_of_intelligence_officers: "派遣情报人员"
  DVL_Bavarian_Dispatch_of_intelligence_officers_desc: "仁慈的吾王不愿看见更多的牺牲，那就让巴伐利亚感受吾王的善意，成为吾王的猎犬，当然，训练过程必不可少，训犬员已经派出，期待他们的消息。"
  DVL_Bavarian_Infiltrate_propaganda: "渗透宣传"
  DVL_Bavarian_Infiltrate_propaganda_desc: "只有安兹大人才能带领德意志重返巅峰，加入魔导国能拥有更好的生活。人民就是如此愚昧，一点消息就能骗得团团转，但这对我们不是很有利嘛？"
  DVL_Schleswig_Holstein_affairs: "石勒苏益格-荷尔斯泰因事务"
  DVL_Schleswig_Holstein_affairs_desc: "我们的北方是这片土地以前存在的问题，她们似乎不愿接受安兹大人的教导，但是没关系，这就是外交部存在的意义。"
  DVL_Schleswig_Holstein_Arrange_battle_plan: "安排作战计划"
  DVL_Schleswig_Holstein_Arrange_battle_plan_desc: "决定已经下达，彻底摧毁基尔边区人民的抵抗意志，伟大的安兹大人万岁！"
  DVL_Schleswig_Holstein_Pre_war_preparations: "战前准备"
  DVL_Schleswig_Holstein_Pre_war_preparations_desc: "充足的准备是必胜的先决条件，后勤、情报、士气缺一不可，让我们准备好，给予敌人致命一击。"
  DVL_Schleswig_Holstein_Dispatch_of_intelligence_officers: "派遣情报人员"
  DVL_Schleswig_Holstein_Dispatch_of_intelligence_officers_desc: "仁慈的吾王不愿看见更多的牺牲，那就让基尔人民感受吾王的善意，成为吾王的猎犬，当然，训练过程必不可少，训犬员已经派出，期待他们的消息。"
  DVL_Schleswig_Holstein_Infiltrate_propaganda: "渗透宣传"
  DVL_Schleswig_Holstein_Infiltrate_propaganda_desc: "只有安兹大人才能带领德意志重返巅峰，加入魔导国能拥有更好的生活。人民就是如此愚昧，一点消息就能骗得团团转，但这对我们不是很有利嘛？"
  DVL_Rhineland_affairs: "莱茵兰事务"
  DVL_Rhineland_affairs_desc: "莱茵兰，我们与幻想乡之间的停战区，虽然她们已经成为幻想乡的鹰犬，但吾王的征途是不能有阻碍的，莱茵联邦现在就是这块拦路石，外交部的精英们动起来，告诉她们，要么臣服，要么死亡！"
  DVL_Rhineland_Arrange_battle_plan: "安排作战计划"
  DVL_Rhineland_Arrange_battle_plan_desc: "决定已经下达，彻底摧毁莱茵人民的抵抗意志，伟大的安兹大人万岁！"
  DVL_Rhineland_Pre_war_preparations: "战前准备"
  DVL_Rhineland_Pre_war_preparations_desc: "充足的准备是必胜的先决条件，后勤、情报、士气缺一不可，让我们准备好，给予敌人致命一击。"
  DVL_Rhineland_Dispatch_of_intelligence_officers: "派遣情报人员"
  DVL_Rhineland_Dispatch_of_intelligence_officers_desc: "仁慈的吾王不愿看见更多的牺牲，那就让莱茵人民感受吾王的善意，成为吾王的猎犬，当然，训练过程必不可少，训犬员已经派出，期待他们的消息。"
  DVL_Rhineland_Infiltrate_propaganda: "渗透宣传"
  DVL_Rhineland_Infiltrate_propaganda_desc: "只有安兹大人才能带领德意志重返巅峰，加入魔导国能拥有更好的生活。人民就是如此愚昧，一点消息就能骗得团团转，但这对我们不是很有利嘛？"
  DVL_CZE_affairs: "巴哈斯事务"
  DVL_CZE_affairs_desc: "巴哈斯领导人为所有反抗者做出了表率，理所当然，她们也会得到吾王最大的善意，尽快整合这个国家，让她们早日成为征服的助力。"
  DVL_integrate_czech_manufacturers: "整合巴哈斯制造商"
  DVL_integrate_czech_manufacturers_desc: "波希米亚的工业蕴含着丰富的制造技术与资源。将捷克制造商整合进我们的生产体系，将极大提升军备工业。此举合情合理。"
  DVL_Break_the_blockade: "打破封锁"
  DVL_Break_the_blockade_desc: "德意志地区已经被我们整合完成了，世界上的大部分国家都承认我们是这片土地的合法统治者，当然，安兹大人不需要虫子的认可。这不过是持续的诱导罢了，封锁已经被打破，让我们向世界宣告，安兹·乌尔·恭之名！"
  DVL_Anzi_Confederate_Trade_Fair: "安兹·乌尔·恭同盟贸易会"
  DVL_Anzi_Confederate_Trade_Fair_desc: "增强大坟墓的力量不止需要强大的武力，有效的经济管制也将成为我们最有效的武器之一。今后，我们将建立安兹·乌尔·恭同盟贸易会，以此影响我们控制下的所有同盟国，建立起一套完全独立的单一市场。当然，最大的利益永远属于我们。"
  DVL_Plan_for_World_Conquest: "世界征服计划"
  DVL_Plan_for_World_Conquest_desc: "要想让其他至尊知晓纳萨力克之所在，那么纳萨力克之名必须享誉全球，最简单也最高效的办法，就是让整个世界都为纳萨力克之所有。"
  DVL_Decentralization: "分权代管"
  DVL_Decentralization_desc: "没有其他至尊相助，纳萨力克的人手就始终有限，我们不可能让有限的几个人去控制那么庞大的统治区。在之前的征服中，我们总能从被征服地区中找到不少合作者，这种经验也将有效应用在我们之后的征服中去"
  DVL_Promote_economic_synergy: "促进经济协同"
  DVL_Promote_economic_synergy_desc: "有了管理者可不够，各个统治区的经济必须与魔导国完全协同，完全对接，以最高的效率满足征服的一切需要，谁要是做不好，就等着被做成最低级的亡灵吧"
  DVL_Integrate_wartime_economy: "整合战时经济"
  DVL_Integrate_wartime_economy_desc: "所有的占领区子民都必须明白一个道理，在战争之前，所有人都必须为战争努力而互相配合，今后，所有魔导国地区都将进入全面战时经济状态，每个人都必须为帝国做出贡献。"
  DVL_War_Planning_Department: "战争策划部"
  DVL_War_Planning_Department_desc: "安兹大人素来不打无准备之仗，在开展全球征服之前，我们将建立起专门的战争策划部，所有魔导国最聪明的头脑们都将在这里谋划每一场征服之战，以最佳准备发动每一场战争。"
  DVL_Thorn_to_the_West: "刺向西方"
  DVL_Thorn_to_the_West_desc: "西方的幻想乡共和国一直在和我们虚与委蛇，希望我们的军队能先去征服东方的苏联，她们好趁机偷袭我们，可笑。安兹陛下已经给她们准备了一份“大礼”，希望她们在看到我们的大军之前，还能继续享受她们的美梦。"
  DVL_Finally_make_a_wish: "最终许愿"
  DVL_Finally_make_a_wish_desc: "我们已经准备好向圣杯王国开战了，她们的势力遍布全球，如果能够征服圣杯英灵，可以说，纳萨力克就已经在全球再无敌手
  DVL_stinger_of_serpent_staff: "蛇杖之刺"
  DVL_stinger_of_serpent_staff_desc: "战争对安兹·乌尔·恭陛下而言不过是平面上的绘图游戏，他于更高纬度俯瞰我等的世界，将权杖扎入海峡对岸。我们即是安兹陛下的挥舞权杖，从天而降，刺入圣杯的心脏。"
  DVL_The_tide_of_wreckage: "骸人之潮"
  DVL_The_tide_of_wreckage_desc: "我们的进军岂是海洋能阻挡的？让骸骨铺满大海吧，哪怕踏着骨桥前进也要让骇人的浪潮吞噬一切，为安兹陛下夺下圣杯！"
  DVL_attack_NPT: "游止汐落"
  DVL_attack_NPT_desc: "幻想乡已经被征服，虽然南方的超次元伊比利亚政权尚未做出反应，但是考虑到背后的精灵国度一定正在筹划干涉欧洲战事的计划，如果他们尚未达成一致，我们便可先发制人"
  DVL_Chop_grass_and_eradicate_roots: "斩草除根"
  DVL_Chop_grass_and_eradicate_roots_desc: "流亡至南方的德意志帝国余孽不仅苟活于南方，而且实施了一套让人忍无可忍的极端民族政策，不过，他们的软弱行事不会得到我们的原谅，在我等平定国内混乱之后，我们也没有理由再对旧德意志余孽在奥地利的倒行逆施充耳不闻，是时候将德意志地方彻底统一了。"
  DVL_Removal_of_European_tumors: "汽笛永寂"
  DVL_Removal_of_European_tumors_desc: "从来就没有什么绝对中立，南边的火车国也是如此。在帝国的将士们于前线浴血奋战之时，她们竟然容许帝国的敌人和变节分子在她们境内大肆宣传报道所谓的“累累恶行”，更是以各种非公开名义为敌人提供物资及补给，这不仅助长了敌人的嚣张气焰，更是让帝国的将士及臣民们陷入了前所未有的恐慌之中。\n在她们彻底撕下中立的伪善面纱，加入敌人的行列之前，我们必须让她们的声音彻底沉寂。"
  DVL_Purify_the_fuse: "祓除引信"
  DVL_Purify_the_fuse_desc: "在控制了奥地利之后，我们似乎拥有了一个绝佳的向巴尔干地方正在发生的冲突进行干预的窗口，不能放弃这个机会，毕竟在很长一段时间内，巴尔干都将成为我等在欧洲的门户之一。"
  DVL_Advance_into_Rome: "七丘烈火"
  DVL_Advance_into_Rome_desc: "一个极度不称职的神明，一堆各自为政的小城邦，一种几乎不存在任何制度化集权的行政，这就是亚平宁半岛上的现状。相传千年之前，曾有位暴君于此地以烈火焚遍七丘之城，用自己的意愿重塑城市，若她看到如今半岛的地狱绘图，想必会当场自尽于七丘之上，三日不能瞑目。\n而现在，我们将用我们的烈火将这片失序的半岛再度重塑。"
  DVL_Northern_Dusk: "北境黄昏"
  DVL_Northern_Dusk_desc: "尽管全帝国上下都不相信北边这几个小国能对帝国造成威胁，但在伟大的[DVL.Getleader]看来，历史上的诸多大国最终都亡于她们眼里的“小国”手中，且这几个小国已有归一之势，一旦统一成功，她们下一步必定是向帝国拔出战争之剑，将战火再次燃遍德意志乃至全欧洲。\n与其陷入被动，不如主动出击。北欧神话以诸神黄昏来宣告终焉，那么，就由我们来给她们送去命定中的黄昏。"
  DVL_Requiem_Mass: "安魂弥撒"
  DVL_Requiem_Mass_desc: "东边这片亡灵之地告诉了我们两个事实：其一，弱国理应被强国所统治征服；其二，当国家之间无法彻底相互征服之时，最终受苦受难的始终是平民百姓。\n为了能给这片受诅咒的大地带来最终的安宁，也为了扫清对抗东边赤色威胁道路上的最后一道障碍，我们必须以伟大的[DVL.Getleader]的名义，为这片大地带来最后一次征服！"
  DVL_No_more_Red_October: "再无红十月"
  DVL_No_more_Red_October_desc: "决战的号角已经吹响，我们已经做好了与苏联一决高下的准备了。这将是一场在这颗星球的陆地和天空硬碰硬的死斗，做好觉悟吧。"
  DVL_Asia_Strategy: "亚洲战略"
  DVL_Asia_Strategy_desc: "亚洲对于帝国来说过于遥远，我们的力量并不能充分投射到这片极东之地，这让帝国之敌有了可乘之机。为了确保此处丰富的资源不会被我们的敌人所利用，是时候在当地寻找一位亲密的盟友协助我们，让亚洲的人们也能沐浴在帝国的光辉之下。"
  DVL_Get_close_to_CHI: "亲近神州"
  DVL_Get_close_to_CHI_desc: "神州作为中华大地名义上的主人，是协助我们控制这块富饶之地的好帮手，正好她们历史上和被我们征服的诸多国度有所矛盾，我们可以借助这一点和她们提出合作，她们的人力和资源将会为帝国的伟业添砖加瓦。"
  DVL_Get_close_to_ROC: "亲近国民党"
  DVL_Get_close_to_ROC_desc: "比起腐朽不堪的神州帝国，新兴的国民党更适合成为我们合作的对象。励志推翻神州政权的他们立足未稳便面临诸多急需解决的问题，帝国将施舍他们一些援助，当然，这并不是免费的。"
  DVL_Get_close_to_JAP: "亲近樱花"
  DVL_Get_close_to_JAP_desc: "忘掉那些战成一团的神州人吧，我们需要的是能照顾好自己的盟友，比如樱花就是一个不错的选择，他们军队悍不畏死的精神值得我们欣赏，这才是配得上我们帝国战士的合作者"
  DVL_Cross_the_Bosphorus: "跨过博斯普鲁斯"
  DVL_Cross_the_Bosphorus_desc: "石油一直是帝国战车最重要的启动机器，而大量的石油就出产在博斯普鲁斯海峡之后的中东地区，虽然在海峡对岸还有个土耳其共和国，但是在帝国的大军面前，他们不是对手。"
  DVL_Marching_into_Africa: "进军阿非利加"
  DVL_Marching_into_Africa_desc: "当我们拿下超次元后，我们也顺理成章的可以染指那片我们从未征服的地区——阿非利加，那片土地上有着众多的兽耳种族，正好作为大坟墓的新奴隶来使用。"
  DVL_Pacify_Eurasia: "平定欧亚"
  DVL_Pacify_Eurasia_desc: "苏联已经倒下，但在曾经苏联的土地之上再次出现了众多的小国，尽管她们意见不一，但是哪怕一个存在都可能导致苏联的回归，我们必须根除任何的可能，消灭她们！"
  DVL_Global_Strategy: "最终圣战"
  DVL_Global_Strategy_desc: "终于，整个星球的抵抗力量均已被大坟墓所扫除，整个星球的人们无不称颂安兹·乌尔·恭之名。今后，这个星球上将再无其他国家，只有魔导之国，只有安兹·乌尔·恭！"
  DVL_Global_Strategy_tt: "§R向所有剩余国家宣战§!"

 ##经济
  DVL_Characteristic_economic_system: "魔导国特色经济体系"
  DVL_Characteristic_economic_system_desc: "在安兹大人的带领下，魔导国整体发展稳步前进，然而，因这片土地长时间的战争，导致经济一塌糊涂，在安兹大人没有放弃这些财产之前，我们仍需对她们负责。让我们构建具有魔导特色的经济体系来养活我们的羊群。"
  DVL_Hayek_scheme: "哈耶克方案"
  DVL_Hayek_scheme_desc: "一个名叫哈耶克且主动投诚安兹大人的人类提出自己的见解，她希望魔导国能主动对经济进行有限干预而不是放任自由，以市场为主体，宏观计划调控。她相信这么做能帮助魔导经济迅速恢复。当然，她愿意承担这份责任。"
  DVL_Open_free_markets: "开放自由市场"
  DVL_Open_free_markets_desc: "这位人类经济部长上任第一时间就开放大量市场，不得不承认这份魄力确实吸引了很多资本家冒着生命危险来投资，即使骸骨军团最冷酷的拷问官也不得不赞叹她们的胆大。这让魔导国经济呈现出欣欣向荣的姿态，但是代价呢？"
  DVL_Inject_capital_into_consumer_market: "注资消费市场"
  DVL_Inject_capital_into_consumer_market_desc: "哈耶克十分果断，为了提振市场信心，立刻调用大量资金投入消费市场，本来还有人认为这是胡来，但随后的数据让她们闭上了嘴，这位经济部长，有一手！"
  DVL_Decentralized_capitalists: "放权资本家"
  DVL_Decentralized_capitalists_desc: "尽管安兹大人对这些资本家有奇怪的敌意，但是哈耶克还是说服了他，授权给这些资本家让她们在市场上拼杀，尽管这肯定有不良后果，但起码现在的果实是甜的不是吗？"
  DVL_Shrink_administrative_intervention: "收缩行政干预"
  DVL_Shrink_administrative_intervention_desc: "不要过度介入市场，这是哈耶克部长一直强调的。在她的要求下，大量监管部门被合并裁撤，魔导国对经济的监控达到了最低点，当然，成果也是喜人的。"
  DVL_Connect_with_world: "与世界接轨"
  DVL_Connect_with_world_desc: "魔导国不能和世界脱轨，主动融入世界，既是为了贯彻安兹·乌尔·恭大人的意志，也是为了更好地管理魔导国的羊群们。"
  DVL_Export_advanced_industrial_products: "出口先进工业品"
  DVL_Export_advanced_industrial_products_desc: "这片土地以前有各种新奇的科技设备，尽管因为战乱没有得到很好的利用，但现在有我们魔导国统治这片土地，这些科技制造的工业品肯定受到外人的追捧。一定能卖出好价钱。"
  DVL_Limited_intervention: "有限干预"
  DVL_Limited_intervention_desc: "经济当然得处于政府的掌控之下，我们可不能放任那些只想着填饱自己钱包的奸商们吃的满嘴流油，市场应该为国家而不是私人服务，必须保证政府对市场的影响，把握住经济的发展方向，帝国才能蒸蒸日上。不过不用担心，干预是克制且有限的，毕竟，我们不能为了浇灌田地而召唤一场洪水。"
  DVL_Market_liberalization: "市场自由化"
  DVL_Market_liberalization_desc: "自由，多么美好的词汇，将其应用到我们的市场上面再合适不过了。在哈耶克部长的带领下，国内市场的自由化进展十分顺利，春风渐起，国民经济已经开始焕发出旺盛活力，相信在不久的将来，帝国会是一种勃勃生机，万物竞发的景象。"
  DVL_Invisible_big_hands: "无形的大手"
  DVL_Invisible_big_hands_desc: "有人批评我们对市场实在是太过放纵了，说这话的人一定不懂经济学，市场本身就是最好的裁判，价格机制，供需关系等力量凝成了一只无形的大手，协调着整个系统的运行。不用操那么多心，我们只需要做好一定的监管工作，剩下的就交给市场竞争去吧。"
  DVL_Reform_of_state_owned_enterprises: "国企改革"
  DVL_Reform_of_state_owned_enterprises_desc: "哦，天哪，国企，国企，我们为什么要养着那么多吃饱饭不干事的家伙？他们在铁饭碗的保护下表现得既懒惰又愚蠢，该让这些宝宝们见识见识外面的风浪了，我们的企业不养闲人。"
  DVL_Industrial_concessions: "工业特许权"
  DVL_Industrial_concessions_desc: "在经过市场的教训之后，很多对我们心存不满的国企人士如今只能低着头，请求我们的帮助，我们现在会给他们一些好处，我们会发给愿意服从的企业以工业特许权，这些企业会在他们专门的行业得到一系列生产的便利"

  DVL_Aculaire_scheme: "艾库莱尔方案"
  DVL_Aculaire_scheme_desc: "安兹大人的管家助理艾库莱尔抓住了这个机会，他再次向安兹大人呈递上了他那曾被嘲笑的计划书：在紧密的计划之下，一切经济事务都将井井有条，魔导国的经济将完全服从安兹大人的意志，万事万物的运转都将被置于安兹大人的手中，——很显然，他赢得了证明自己的机会"
  DVL_Formation_of_planning_committee: "组建计划委员会"
  DVL_Formation_of_planning_committee_desc: "艾库莱尔并没有为了实现自己的野心和理想而承担辜负安兹大人信任的想法，他上任经济部长之后的第一件事就是组建一个计划委员会，召集魔导国所有最聪明的人，集中魔导国的一切智慧来列出最高效的计划"
  DVL_Centralized_industrialization: "集中工业化"
  DVL_Centralized_industrialization_desc: "艾库莱尔将一片片的郊区划为工业区，连成一片的工业区仿佛跳动着的心脏，为庞大的魔导国注入源源不断的新血，无穷无尽的动力！集中！密集！劳动！一切为了伟大的安兹大人，一切为了魔导国！"
  DVL_Assign_undead: "分配亡灵"
  DVL_Assign_undead_desc: "纳萨力克大坟墓在源源不断的生产者低智但不知疲倦的亡者，他们不能执行惊喜的操作，无法进行复杂的思考，但却可以适应那些繁重简单的劳作，将有智慧有能力的生者从枯燥无味的岗位上解放出来从事真正对安兹大人有益的工作，在艾库莱尔宏大的计划之下，每一个亡者都该被分配到合适的位置"
  DVL_Assign_undead_TT: "解锁§Y分配亡灵§!决议"
  DVL_Production_line_upgrade: "产线升级"
  DVL_Production_line_upgrade_desc: "再一轮又一轮的计划取得成功之后，艾库莱尔的野心得以进一步实现，现在，他要迈向更加伟大的一步——伟大的魔导国生产线将迎来完全的升级，整个车间将只留下少数的技术工人和管理人员，剩下的一切都将交给不知疲倦，不会犯错的亡者，我们的车间将彻夜不息，产品将源源不断的流向魔导国的每一处！为了安兹大人，让艾库莱尔迈出这伟大的一步！"
  DVL_Unified_deployment_work: "统一调配工作"
  DVL_Unified_deployment_work_desc: "艾库莱尔忠实的履行着自己的职责，也坚定地执行着自己的理念，他毫不怀疑自己的能力，毅然地决定由计划经济委员会来为每一个人调配工作，在这一机构的运作下，所有劳工，职员，乃至是行政人员，这些所有的工作岗位都会得到统一的调配，不论当事人的想法是什么，安兹大人的意志必须得到贯彻——魔导国这台庞大的机器，每一个螺丝的运转都必须处于计划之下"
  DVL_Unified_deployment_work_TT: "解锁§Y统一调配工作§!决议"
  DVL_Assign_production_tasks: "分配生产任务"
  DVL_Assign_production_tasks_desc: "一切经济活动皆已被置于艾库莱尔计划之下，为安兹大人而服务着，现在，艾库莱尔将进一步细化他的计划，将生产任务分配至每一个部门，每一个车间，乃至于每一个人头上"
  DVL_Efficient_economic_accounting: "高效经济核算"
  DVL_Efficient_economic_accounting_desc: "还不够，还不够！效率还是不够高，计划还是有缺漏，艾库莱尔对于这一切还是感到不满，他觉得这样的缺憾并不是自己向安兹大人许诺的那个“千秋万代”的伟大计划，他还需要更加高效的计划，为此他需要更加准确的数据——更加高效的经济核算方式！"
  DVL_Efficient_economic_accounting_TT: "§L§Y$DVL_Formation_of_planning_committee_idea$§!、§Y$DVL_Production_line_upgrade_idea$§!、§Y$DVL_Assign_production_tasks_idea$§!将被整合为§Y$DVL_Efficient_economic_accounting_idea$§!§!"
  DVL_Expand_scale_of_state_owned_enterprises: "扩大国企规模"
  DVL_Expand_scale_of_state_owned_enterprises_desc: "继续，还要更多，无序而混乱的市场是投机，腐败和低效的源头，伟大的魔导国容不下这些蝇营狗苟之辈在阴暗的缝隙里肆意的滋长下去了，一切的自由市场都应该被关停，艾库莱尔将建起一座又一座新的国企取代这些该被扫进历史尘埃的东西！"
  DVL_Expand_scale_of_state_owned_enterprises_TT: "解锁§Y扩大国企规模§!决议"
  DVL_Incorporate_small_businesses: "合并小型企业"
  DVL_Incorporate_small_businesses_desc: "分散的企业，混乱的管理，无能的企业主，冲突的研究，恶性的竞争，这些艾库莱尔的经济计划降临之前在魔导国存在的无数小型企业就是这一切的来源，在安兹大人的伟大国度内不在容许这种低效而不受控制的东西存在了，我们将合并起所有的小型企业，一个个庞大的巨型国企将替代他们的功能，更加高效的运行下去"
  DVL_Improve_welfare_benefits: "提高福利待遇"
  DVL_Improve_welfare_benefits_desc: "毫无疑问，安兹大人是仁慈的，而他的管家艾库莱尔吸取了这一优点，我们不必延续计划经济来临前那落后的压迫工人的方式来提高经济收益，在计划经济体制下那毫无意义，我们要做的是提高他们的福利待遇，让他们能为魔导国制造更多的产品"
  DVL_Inspire_motivation: "激发积极性"
  DVL_Inspire_motivation_desc: "很显然，艾库莱尔的计划经济政策完全胜过了落后的自由市场，在福利待遇提升后工人们爆发出了前所未有的生产热情，从来没有如今日一般的多的产品从魔导国的流水线上走下来，我们只需要进一步激发这些工人的积极性，让安兹大人的慈悲笼罩每一个劳工，魔导国将会愈发伟大！"

  DVL_Building_Germany: "建设德意志"
  DVL_Building_Germany_desc: "作为魔导王统治下的第一块土地，也会是核心土地，在终结了德意志的动乱之后，我们将从零开始建设这块土地，让其成为魔导王霸业的基石"
  DVL_Ministry_of_Scientific_Research: "魔导国国家科研部"
  DVL_Ministry_of_Scientific_Research_desc: "德国领导层出逃的时候带走了大量的科研人员，但还有不少科研人员和机构被我们留在德意志。我们将成立魔导国国家科研部，将这些分散的科研力量整合起来，给他们活命的机会，换取他们为我们服务。"
  DVL_Refining_Originium: "源翠石提炼"
  DVL_Refining_Originium_desc: "这片星球上的独特的源翠石内蕴含着极为强大的能源，经过我们的科学家试验之后，得到提炼的源翠石的能源使用效率更加强大。我们将试验这种技术，并将其普及。"
  DVL_Synthetic_Refining: "合成化炼油"
  DVL_Synthetic_Refining_desc: "德意志是个缺乏石油的地区，但我们的工业和军队需要石油来进行运作，还好，德国人在逃出他们的国家的时候留下了部分石油合成化的技术，科研部会重点攻克这项技术，保证我们有足量的石油使用。"
  DVL_State_of_art_industrial_facilities: "先进工业设施"
  DVL_State_of_art_industrial_facilities_desc: "在经过魔导王优秀的科学家的改善之后，我们的工业状况已经焕然一新，所有的工业设备都能得到应有的重视和革新，我们的工业已经重回世界最强之列。"
  DVL_Renovation_of_industrial_zones: "工业区改造"
  DVL_Renovation_of_industrial_zones_desc: "德意志不乏强力的工业区，但在长期的战乱和分裂之后，这些工业区长期得不到妥善的经营，产品变差，生产变慢，这无疑是对魔导王统治的一种亵渎，我们必须对此作出改变。"
  DVL_Restart_of_Rhineland_industrial_area: "重启莱茵兰工业区"
  DVL_Restart_of_Rhineland_industrial_area_desc: "莱茵兰地区一直是德意志地区重点建设的工业区，但落后的骑士团根本不会好好使用这些工业。如今魔导王已经重掌了这片工业区，我们将重启这片工业区，唤醒工业的血脉"
  DVL_Expansion_of_Ruhr_mine: "扩建鲁尔矿区"
  DVL_Expansion_of_Ruhr_mine_desc: "工业发展离不开矿业的支持，而德意志原先鲁尔地区就具有大量的矿业资源，我们会进一步开采这片地区的资源，充分发掘一切潜力。"
  DVL_Expansion_of_Silesian_industrial_zone: "西里西亚工业区扩建"
  DVL_Expansion_of_Silesian_industrial_zone_desc: "德意志的西里西亚地区一直是个资源丰富、人口众多的地区，在我们统治这片地区之前，德国人试图把这片地区的工业转移到巴伐利亚去。我们不会如此，我们会把这片地区的工业进一步扩展，变为帝国的第二个工业之心。"
  DVL_Coordinated_development_in_east: "东部协同发展"
  DVL_Coordinated_development_in_east_desc: "西里西亚工业区的扩建为东部地区带来了一股强大的力量，原先的基础建设已经无法满足这片地区进一步发展的需要了。我们必须对整个东部地区进行整体规划，实现协同发展。"
  DVL_Agrarian_reform: "农业改革"
  DVL_Agrarian_reform_desc: "农业是国家命脉，尽管德意志土地肥沃，但没有统一的管理那就是浪费！根据安兹大人的命令，务必确保统治范围内无人因饥饿死亡。任何对抗改革的虫豸都应彻底消灭！"
  DVL_Bavarian_countryside_rehabilitation: "巴伐利亚乡村改造"
  DVL_Bavarian_countryside_rehabilitation_desc: "巴伐利亚因城市化动力不足，该地区仍是乡村聚集。为了更好的进行农业改革计划，针对巴伐利亚的改造必须加快进行！"
  DVL_Through_South_Germany: "贯通南德意志"
  DVL_Through_South_Germany_desc: "交通是经济的命脉；是军队的保障；更是让人民见识到国家飞速发展的象征，一个宏伟的计划被提出，用铁路连接整个南德意志。让世界看见魔导国的伟大崛起之路！"
  DVL_Promote_mechanization_of_agriculture: "推动农业机械化"
  DVL_Promote_mechanization_of_agriculture_desc: "改革来到新阶段，目前绝大多数地区已经满足机械化的物质条件，就让我们开启农业机械化，为魔导国农业建设添砖加瓦。当然，顺便测试一些机密项目，说不定对机械化军队有所帮助。"
  DVL_Increase_agricultural_subsidies: "提高农业补贴"
  DVL_Increase_agricultural_subsidies_desc: "让农民安心种田，大胆种田。就必须用实际物资让农民相信政府会给他们兜底。农业补贴已经通过财政部的预算审核，尽管这是笔额外的开支，但这也是必要的开支。"

 ##政治
  adorable_heart_focus_var_add_025: "£GFX_adorable_heart_focus_var_icon §Y国策点数§!：§G+0.25§!"
  adorable_heart_focus_var_change_tt: "£GFX_adorable_heart_focus_var_icon §Y国策点数§!：$RIGHT|+=$"
  complete_if_focus_var_up_to_1: "可以消耗1点£GFX_adorable_heart_focus_var_icon §Y国策点数§!，§Y直接完成§!该国策\n§L（目前的£GFX_adorable_heart_focus_var_icon 国策点数：[?adorable_heart_focus_var]）§!\n§W--------------§!\n"

  DVL_Under_the_throne: "王座之下"
  DVL_Under_the_throne_desc: "普天之下，莫非王土，王座之下，莫非王臣。"

  DVL_prime_ministers_Demiurge: "宰相迪米乌哥斯"
  DVL_prime_ministers_Demiurge_desc: "迪米乌哥斯，作为乌尔贝特·亚连·欧德尔所创造的纳萨力克大坟墓第七层的守护者，宰相之争的最终胜者，将获得直接进谏魔导王，协助其征服世界之人。"
  DVL_Conquistador_League: "征服者同盟"
  DVL_Conquistador_League_desc: "宰相迪米乌哥斯进谏：“属下拙见，安兹大人即使于此世间举世无双，却依旧双拳难敌四脚，纳萨力克大坟墓需要盟友，志同道合的盟友，忠诚于纳萨力克的盟友，忠诚于安兹大人的盟友。”"
  DVL_All_king_land: "莫非王土"
  DVL_All_king_land_desc: "我们的统治方式被原住民所接纳，这证明了我们伟大的王，伟大的安兹·乌尔·恭大人的治国方略是无比正确的，我们会将它推广至整个世界，我们会让整个世界臣服于安兹大人之下。普天之下，莫非王土。"
  DVL_All_king_courtier: "莫非王臣"
  DVL_All_king_courtier_desc: "忠于安兹大人的原住民越来越多，这是我们来到这个世界后所迈出的一大步，这将是安兹大人统治整个世界的一小步。勤则嘉勉，终有一日，率土之滨，莫非王臣！"
  DVL_For_king_vision: "为了王的愿景"
  DVL_For_king_vision_desc: "宰相迪米乌哥斯的政策为我们征服世界做了极其重要的铺垫，现在，王的愿景近在眼前，为吾王之愿景，吾等自当奋起讨之！安兹·乌尔·恭大人万岁！"
  DVL_For_king_vision_TT: "§L§Y$DVL_All_king_courtier_idea$§!、§Y$DVL_Expanse_two_legged_sheep_pasture_idea$§!、§Y$DVL_Elite_Imperial_Troops_idea$§!、§Y$DVL_Dynasty_Socialism_idea$§!将被整合为§Y$DVL_For_king_vision_idea$§!§!"
  DVL_Expanse_two_legged_sheep_pasture: "扩建“两脚羊”牧场"
  DVL_Expanse_two_legged_sheep_pasture_desc: "“两脚羊”牧场为魔导国提供了大量的魔导武器原料以及实验数据，是时候加快脚步，扩大其规模了。"
  DVL_Armed_Wizard_troops: "武装魔导部队"
  DVL_Armed_Wizard_troops_desc: "以“两脚羊”的羊皮为原料的魔导武器便宜廉价且火力强大，我们可以将其广泛使用以提高我国魔导部队的杀伤水平。"
  DVL_Elite_Imperial_Troops: "精锐御前部队"
  DVL_Elite_Imperial_Troops_desc: "即使吾王举世无双，但是在面对千军万马时也难免乏力。因此，我们将魔导部队中的精英挑选出来，由宰相亲自培训，组件成为“御前部队”时刻守护吾王之安危。"
  DVL_Candy_with_sticks: "糖果与大棒"
  DVL_Candy_with_sticks_desc: "这个世界原住民的原住民对我们的统治十分甚至九分的有意见，但是我们可以打一棒子再给颗糖，这样这里顽固不化的原住民也会知道我们的威严与仁慈。"
  DVL_Reassure_the_people: "安抚国民"
  DVL_Reassure_the_people_desc: "对于忠诚于魔导国，忠诚于安兹·乌尔·恭大人的原住民，我们将给予他们充分的人权，他们可以不用进“快乐牧场”。这种程度的仁慈足够安抚他们了。"
  DVL_Dynasty_Socialism: "“王朝社会主义”"
  DVL_Dynasty_Socialism_desc: "这个世界似乎有一种名叫“社会主义”的制度很受底层人欢迎，或许我们的制度也可以进行一番参考……"
  DVL_One_step_at_a_time: "一步到位"
  DVL_One_step_at_a_time_desc: "与其想那么多如何把权力分给当地的亲善者，给本地居民多大程度的待遇，都不如一概执行同等的政策，所有被征服者均为纳萨力克最低等之公民，无论出身贵贱，在大坟墓的征服军势面前都一律平等。"
  DVL_One_step_at_a_time_tt: "获得§Y所有地区§!的宣称。"
  DVL_One_step_at_a_time_ttt: "吞并所有§Y附庸国§!§L（除了特殊附庸）§!"
  DVL_Protective_surveillance_of_nationals_TT: "获得§Y所有地区§!的核心。"

  DVL_prime_ministers_Albedo: "宰相雅儿贝德"
  DVL_prime_ministers_Albedo_desc: "雅儿贝德一直认为自己才是安兹大人最重视的下属，这种想法在她赢得宰相之争后达到了巅峰。尽管雅儿贝德明白只要自己说一声安兹大人就会同意她成为宰相，但她还是选择将所有竞争对手击败，光明正大地站在安兹大人的身旁。爱意与敬意铸就了魔导国新的宰相！"
  DVL_Expand_intelligence_sector: "扩大情报部门"
  DVL_Expand_intelligence_sector_desc: "向您介绍我可爱的侍从们，不必担心，只是几只的话就算是人类也能轻而易举的消灭它们。前提是，您能找到它们。在厨房的角落，在衣柜的底下，在洗浴水管中，请毫不留情的试着彻底消灭它们吧，如果您能做到的话。。"
  DVL_Expansion_of_thinking_review: "思维审查扩大化"
  DVL_Expansion_of_thinking_review_desc: "思维是大脑的派生物，而你早已宣誓将一切献给魔导王，不是吗？那么，连同你的意志呈上。"
  DVL_Monitor_population: "监控民众"
  DVL_Monitor_population_desc: "请高效的赞美，请骄傲的称颂，请恭敬的崇拜。啊，美妙的自由。"
  DVL_Imperialism: "帝王术"
  DVL_Imperialism_desc: "雷霆雨露，俱是天恩。无论鞭笞还是仁善，不必思索王的用意，只需接受。"
  DVL_Send_signal_of_goodwill: "释放善意信号"
  DVL_Send_signal_of_goodwill_desc: "羔羊，舔舐我手中之蜜。"
  DVL_Active_diplomacy: "积极外交"
  DVL_Active_diplomacy_desc: "群猴，争夺我手中之果。"
  DVL_Nasalik_direct_Governor: "纳萨力克直属总督"
  DVL_Nasalik_direct_Governor_desc: "毁于内乱的帝国最为可笑，真正的领袖不会有叛逆之臣，纳萨力克的各位会证明这点。"
  DVL_Nasalik_direct_Governor_tt: "解锁§Y在占领区建立总督辖区§!决议\n§L每建立一个新的总督区，我们将会获得一个新的修正§!"
  DVL_All_nations_return_to_heart: "万邦归心"
  DVL_All_nations_return_to_heart_desc: "看吧，衰落的宿命，分裂的注定？不过是人类的无能。现在，称赞终结历史的领袖。"

  DVL_prime_ministers_Sebas_Tian: "宰相塞巴斯·蒂安"
  DVL_prime_ministers_Sebas_Tian_desc: "塞巴斯蒂安不知道自己为什么会成为宰相，但他相信，这一定是安兹大人的授意，不然雅儿贝德不可能这么放弃这个职位。作为心怀正义之人，塞巴斯与其他守护者关系并不是很亲密，但这并不代表他会背叛魔导国，作为魔导国的新任宰相，塞巴斯将会用绝对的正义贯彻对安兹大人的忠诚！"
  DVL_Alleviate_political_violence: "缓解政治暴力"
  DVL_Alleviate_political_violence_desc: "政治是魔导王大人赋予我们的权利，暴力，欺诈，全是令陛下蒙羞之举。"
  DVL_Livelihood_Committee: "民生委员会"
  DVL_Livelihood_Committee_desc: "我等为陛下牧羊，不可使其饿毙。"
  DVL_Perfect_system: "完美的制度"
  DVL_Perfect_system_desc: "魔导王陛下就是对辩证法的证伪。永恒既然存在，绝对完美无需变更的制度理所当然的存在——由陛下为我们揭示。"
  DVL_Expand_autonomy: "扩大自治权"
  DVL_Expand_autonomy_desc: "牧场辽阔，长鞭手握，不妨令羔羊们走动自由些许。"
  DVL_Expand_autonomy_tt: "解锁§Y在占领区建立自治区§!决议"
  DVL_Promote_economic_synergy: "促进经济协同"
  DVL_Promote_economic_synergy_desc: "准许尔等供奉，以期王的恩赐。"
  DVL_Promote_economic_synergy_tt: "§L我们将解锁决议邀请其他国家加入$DVL_Berlin_Economic_Agreement$，成员国越多，$DVL_Berlin_Economic_Agreement$给与我们的修正越高，忠于我们的总督府/自治区越多将给予我们更高的修正。§!"
  DVL_Nasalik_Scientific_Research_Society_foucs: "纳萨力克科研学会"
  DVL_Nasalik_Scientific_Research_Society_foucs_desc: "这片星球上有着太多我们前所未见的科学成果可转化为吾王统治世界的力量，安兹陛下已经决定，组建专门的纳萨力克科研学会，整合我们所统治地区的科研力量，来增强大坟墓的实力。"
  DVL_Nasalik_Scientific_Research_Society_foucs_tt: "§L$DVL_Berlin_Economic_Agreement$的成员/自治区将会给你提供额外的科研速度加成§!\n§Y解锁决议调配自治区的科研资源，并获得随机的科研加成卡§!"
  DVL_King_of_kings: "万王之王"
  DVL_King_of_kings_desc: "罗马的桂冠、奥斯曼的头巾、神州的旒冕。沐猴而冠的滑稽闹剧到此为止了——王者，只能有一位。"
  DVL_Federal_Empire: "联邦帝国"
  DVL_Federal_Empire_desc: "我们在此缔约，关于忠诚，忠诚与忠诚。给予早已融入我们的生命，此身所作唯有报答。"
  DVL_Federal_Empire_tt: "§Y$DVL_Berlin_Economic_Agreement$的修正将被增强§!"

  DVL_Anzi_new_order: "罪域的骨终为王"
  DVL_Anzi_new_order_desc: "反对吾王的罪人已然伏诛，世界见识到了安兹·乌尔·恭的力量。此乃终结，亦乃开端……"

  DVL_Strict_social_hierarchy: "严格社会等级"
  DVL_Strict_social_hierarchy_desc: "让万事万物呆在它该处在的位置，这是最伟大智慧才能做到的事。"
  DVL_Eternal_Domination: "“永恒支配层”"   ##无上至尊与纳萨力克守护者
  DVL_Eternal_Domination_desc: "唯一神与他的造物——力的源泉。"
  DVL_Eternal_Circle: "“永恒之环”"   ##高级技工、科学家等高级工种
  DVL_Eternal_Circle_desc: "智慧与技术——伟力的发扬者"
  DVL_Flesh_gear: "“血肉齿轮”"   ##普通居民
  DVL_Flesh_gear_desc: "社会的基石——力量的介质"
  DVL_Eternal_fuel: "“永恒燃料”"   ##战俘、奴隶及“两脚羊”
  DVL_Eternal_fuel_desc: "神同样爱你——爱、需要你的所有，所有......"
  DVL_in_apple_pie_order: "井然有序"
  DVL_in_apple_pie_order_desc: "律法已经制定，我们的帝国机器开始运转。"
  DVL_Eternal_Empire: "万世帝国"
  DVL_Eternal_Empire_desc: "人类的童年终结，从此，人们知道为何而生，为何而死。"
  DVL_all_as_usual: "一切如故"
  DVL_all_as_usual_desc: "不必变革，我们将继续强大。"
  DVL_The_Flame_of_Judgment: "审判之火"
  DVL_The_Flame_of_Judgment_desc: "来自炼狱的熔火"
  DVL_Devil_Wings: "恶魔之翼"
  DVL_Devil_Wings_desc: "凝滞时空的残翼"
  DVL_Dawn_silent: "黎明无声"
  DVL_Dawn_silent_desc: "日出之时，片瓦不存。"
  DVL_Reign_supreme_in_world: "君临天下"
  DVL_Reign_supreme_in_world_desc: "王的权杖悬于星球之上......"
  DVL_The_only_supreme: "唯一至尊"
  DVL_The_only_supreme_desc: "九蛇环绕的主人，四十至尊之上——唯一的王座，唯一的至尊之至尊。"
  DVL_God_angry: "神怒"
  DVL_God_angry_desc: "权杖轻点止住地球仪的旋转，‘就这里吧’。于是，灰飞烟灭。"
  DVL_The_King_of_Mercy: "慈悲之王"
  DVL_The_King_of_Mercy_desc: "贫穷，饥饿，不公。我们的王知晓，我们的王悲恸，王说：‘我将拯救你们’。"
  DVL_Voice_of_People: "人民之声"
  DVL_Voice_of_People_desc: "必须防范的，是对人民的声音的遮蔽。如陛下所愿，一切声音必须上达天听，"
  DVL_Emperor_Cabinet: "皇帝内阁"
  DVL_Emperor_Cabinet_desc: "如果王的愿望是让人们幸福，我们将一往无前。"
  DVL_Limited_democratic_attempts: "有限民主尝试"
  DVL_Limited_democratic_attempts_desc: "在王的袍下，人们被允许就决定自己的命运。"
  DVL_The_eternal_philosopher_king: "永恒的哲人王"
  DVL_The_eternal_philosopher_king_desc: "成为人类的历史本身......"
  DVL_Nasalik_Utopia: "纳萨力克乌托邦"
  DVL_Nasalik_Utopia_desc: "从此，人类不再彷徨，不再恐慌，他们变得勇敢、团结。因为他们知道，那位王永远在地下注视着他们。"

  DVL_prime_ministers_ATRI: "宰相亚托莉"
  DVL_prime_ministers_ATRI_desc: "经过我们不屑的努力，亚托莉终于成为了一名精明强干 全能型人才，在我国政治经济军事等方面都发挥了非常强大的作用，而在多任宰相的任命后，安兹陛下也认为需要一名更具备综合能力的人才充任宰相一职。因此，陛下有旨，任命亚托莉为魔导国宰相，我们将以她为中心进行新一轮发展"
  DVL_Mastermind_Program: "主脑计划"
  DVL_Mastermind_Program_desc: "在我们得到亚托莉之后，我们优秀的学者们就已经发现，亚托莉的身上存在着很多的秘密，作为一个仿生人，亚托莉有着近乎无穷的计算能力，这对于我国当前的电子领域发展有着非凡的意义。为此，我们将有计划的开展利用起亚托莉身上的算力，并以她为核心开发更先进的计算机，一旦完成，我们将在科技领域获得巨大进步。"
  DVL_Advancing_transistor_research: "推动晶体管研究"
  DVL_Advancing_transistor_research_desc: "强大的计算力离不开关键的电子元件使用，我们现在的科技水平还不足以高出像亚托莉一样的主脑材料，但在亚托莉的分析中，她向我们指出了一条方向：晶体管。通过这个方向我们便能克服现有使用电子管的巨大缺陷，推动电子领域的发展"
  DVL_Advancing_biomimetic_neural_network_research: "推进仿生神经网络研究"
  DVL_Advancing_biomimetic_neural_network_research_desc: "亚托莉身上的另一大奇迹就来自于她自带的神经网络，在这个网络之下，所有人在我们面前毫无隐私，我们的视角可以深入到全领域。在她的配合下，我们将对有关亚托莉身上的神经网络进行仿生研究，最好是能放到我们专属的亡灵身上，让它们更加没有弱点。"
  DVL_Initiation_of_ATRI_Reverse_Study: "启动亚托莉逆向研究"
  DVL_Initiation_of_ATRI_Reverse_Study_desc: "对亚托莉的研究过于依赖她本人，我们只有一个亚托莉，如果我们有更多的亚托莉，那么研究将不再会因为安全而担忧，更多的亚托莉也会更大程度的提高我们的行政效率"
  DVL_Promote_cybernetic_research: "推动控制论研究"
  DVL_Promote_cybernetic_research_desc: "在研究亚托莉的过程中，我们优秀的科学家们在研究信息度量和反馈机理方面获得了巨大突破，这些理论被总结为‘控制论’。我们可以这种新颖的观点采用于我们的社会实践中，并通过亚托莉这样强大的算力实现全面的控制。"
  DVL_Take_control_of_economy: "掌控经济"
  DVL_Take_control_of_economy_desc: "为什么经济学一直是一项资深的学说？就是因为哪怕再高深的经济学者，都只能靠所谓的社会现实推导出一定的理论，他们根本无法掌握广泛的社会资料来源和应用，但我们有亚托莉，她的能力完全可以进行对经济资料的完全掌控和经济计划的实时制定修改，我们将真正实现对经济的完全掌控。"
  DVL_Rebuilding_of_Dresden_Institute: "重建德累斯顿研究所"
  DVL_Rebuilding_of_Dresden_Institute_desc: "在我们开展高技术研究的过程中，地处德累斯顿的薇莲皇帝皮革研究所引起了我们的注意力，这个研究所虽名为皮革研究所，但实际上具备强大的高分子技术研究能力，旁边的德累斯顿大学也保证了相关科研的人才，这一研究所在我们控制德国期间被毁，但如今我们对德意志的掌控已经稳固，为进一步推进研究工程，我们将重建这一研究所。"
  DVL_Project_Skynet: "天网计划"
  DVL_Project_Skynet_desc: "一直以来，我们对社会的掌控都依靠各式各类的亡灵生物以及相关设备的信息收集，这些东西占用了我们不少的资源，而随着亚托莉首相的施政，我们将依托她的能力开展对全社会领域的监控，即‘天网计划’，我们将编织一张无孔不入的监视之网，每个人所说所做的每一件事，都将被我们完全了解。"
