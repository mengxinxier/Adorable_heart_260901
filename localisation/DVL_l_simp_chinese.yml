 #继承了叫龙之血的少女
  DVL_catch_Zero_Two: "继承了叫龙之血的少女"
  DVL_catch_Zero_Two_desc: "盘踞在巴伐利亚地区的苏维埃残党被彻底击溃后，负责清扫军事研究设施的行动小队在一处自动机整备基地的地下发现了秘密的研究设施，一群作为自动机驾驶员培养的少男少女茫然无措地被我们羁押。同时被发现的还有一名头生赤角的粉发女子，她自称“02”，我们从设施遗存的研究资料中得知她是在巴伐利亚苏维埃政权和苏联合作的人体实验项目中诞生的，因为融入了名为“叫龙”生物的血脉而展现出强大的身体素质和独特的思维方式。考虑到研究设施中有大批珍贵独特的科技和工程原型机只能由这些研究对象启用，收服她们对魔导国增强军事和科研能力大有裨益。"
