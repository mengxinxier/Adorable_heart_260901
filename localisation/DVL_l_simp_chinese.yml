  DVL_end_title: "至此，§0魔导国§!的征途告一段落"
  DVL_end_tip: "离开灭亡世界，荡过虚无之海，我们穿入这片世界之叶。\n我们自地下崛起，以死潮淹没胜利女神伫立的城市。他们的仇恨、分裂给了我们机会。\n“同胞”被逐出土地，勇者的谎言让民众沉醉。\n鲜血下流，教典湮灭，军国被践踏，公社被焚烧，我们驶过铁塔，在金色大厅里赞歌——新生的魔导国才刚张开它的四肢。\n在将世界献上之后，我们终于能自豪的说——“没有辜负安兹大人的期待。”\n至于陛下如何把玩属下献上这颗宝石...呵呵，这就不是我等愚笨之人能够插手的事了。\n别担心，每个人都有为安兹大人尽力的机会。所以，尽管是人类，也请和我等一同高呼......"
