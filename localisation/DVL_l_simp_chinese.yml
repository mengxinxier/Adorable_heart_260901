  sp_android_desc: "§L仿生人以人类外观、行为为设计目标，有类人轮廓、仿生皮肤与动态表情，能实现行走、抓取等动作，还可语音交互、感知情绪。可用于商场咨询、家庭照料、危险环境作业，比普通机器人更强调 “类人属性”，方便融入人类场景。§!\n§R这是一个危险的决定§!"
  sp_biomimetic_neural_network: "仿生神经网络"
  sp_biomimetic_neural_network_desc: "§L仿生神经网络模拟人脑神经元连接，由大量 “人工神经元” 组成网络结构。能像人脑般从数据中学习规律，实现识别、预测等功能，是 AI 的核心基础，广泛用于图像识别、语音处理等领域，推动智能技术落地。§!\n§R这是一个危险的决定§!"
  sp_computing_power_leaps: "算力跃进"
  sp_computing_power_leaps_desc: "§L算力跃进指计算能力的指数级提升，由 AI 需求、技术突破与政策推动。智能算力规模激增，异构架构与算法优化提升效能，绿色算力成趋势。虽存供需失衡，但其驱动 AI、工业等升级，是数字经济核心动力。§!\n§R这是一个危险的决定§!"
  sp_electric_screens: "“电幕”"
  sp_electric_screens_desc: "§L电幕是监控工具，兼具电视播放与双向监视功能，无休无止监视公民言行，还可传播宣传内容。它象征着对个人隐私与思想的绝对控制，是极权统治的重要标志。§!\n§R这是一个危险的决定§!"
  sp_materials_science: "材料学跃进"
  sp_materials_science_desc: "§L材料学跃进是 AI 赋能与技术突破驱动的革命，研发进入 “数据 + 智能” 范式，加速发现新型晶体与二维材料。在能源、芯片、航空等领域，涌现出高效太阳能材料、原子级晶体管等，推动产业升级与绿色发展。§!\n§R这是一个危险的决定§!"
  sp_neural_network_connections: "神经网络连结"
  sp_neural_network_connections_desc: "§L神经网络连结指人工神经元间的连接结构与信号传递机制，分输入、隐藏、输出层。通过调整连接权重，网络可从数据中学习规律，实现特征提取与决策，是 AI 实现识别、预测等功能的核心，支撑深度学习应用落地。§!\n§R这是一个危险的决定§!"
  sp_transistor: "晶体管"
  sp_transistor_desc: "§L晶体管（Transistor）是 20 世纪最具革命性的发明之一，作为一种基于半导体材料的电子元件，它凭借体积小、功耗低、可靠性高的特点，彻底替代了传统真空管，成为现代电子设备的核心 “Building Block”，从智能手机、计算机到卫星、人工智能芯片，几乎所有电子系统都依赖晶体管实现信号处理与电流控制。§!\n§R这是一个危险的决定§!"
  sp_ATRI_reverse_study: "亚托莉逆向研究"
  sp_ATRI_reverse_study_desc: "§L亚托利是当今科学研究的集大成之作，我们可以考虑对亚托利进行逆向研究来获得科研进步。§!\n§R这是一个危险的决定§!"
  sp_artificial_intelligence: "人工智能"
  sp_artificial_intelligence_desc: "§L人工智能（AI）能让机器像人一样学习、感知需求，无需固定指令就能灵活应对。日常中，语音助手、购物推荐、导航避堵都有它的身影，还可辅助医疗诊断、农业增产等，是解放人力、重塑生活与行业的高效工具。§!\n§R这是一个危险的决定§!"

  Armor_Computing_Network: "装甲算力网络"
  Armor_Computing_Network_desc: "装甲算力网络是面向装甲作战体系构建的 “云 + 边 + 端” 算力网络。它通过云端大脑汇聚资源赋能决策，边缘节点感知战场实时响应，终端装备自主交互行动，为新质战斗力建设提供强大算力支撑。"
  Artificial_Intelligence_Assisted_Module: "人工智能辅助模块（坦克）"
  Artificial_Intelligence_Assisted_Module_desc: "坦克的人工智能辅助模块是将 AI 技术融入坦克作战系统，可自动识别目标、融合多传感器数据，提供实时战场全息沙盘，还能通过语音交互简化操作，能快速分类目标，缩短决策时间，提升作战效能与生存能力。"
  air_Artificial_Intelligence_Assisted_Module: "人工智能辅助模块（飞行器）"
  air_Artificial_Intelligence_Assisted_Module_desc: "飞行器的人工智能辅助模块是赋能飞行与任务的核心系统。它融合多传感器数据，可自主规划航线、避障避险，还能快速识别跟踪目标、预判威胁并提供决策建议。能大幅提升飞行与作战效能。"

