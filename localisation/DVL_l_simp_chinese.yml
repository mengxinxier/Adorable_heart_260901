  WizardCountry.014.title: "山峦动"
  WizardCountry.014.desc: "通过对巴伐利亚自动机残骸的逆向工程结合高康大的工艺，科研负责人迪米乌哥斯自豪的汇报——我们已经破解自动机的技术，并且更加先进。"
  WizardCountry.014.a: "安兹陛下的力量更加强大。"

  WizardCountry.024.title: "人造药水"
  WizardCountry.024.desc: "被雅儿贝德缠在办公室没完没了的批阅报告，哪怕是不需要睡觉的安兹也几乎忍不住要打哈欠。所幸露普斯蕾琪娜带来的消息让安兹有理由逃出来。重启教学活动的计划还在筹备，洪堡大学目前仍处于闲置。不过，那些先进的实验室可不能浪费。\n安兹敲敲化学实验室的门，里面立刻就有人应答，随即打开门。“安...安兹陛下？”门内称得上帅气的少年惶恐的跪下：“怎么劳烦您亲自前来。”\n“恩菲，我给你的任务至关重要，这点我重复过很多次。既然有结果，我当然要亲自来确认。”老实说，安兹对实验根本不抱希望。在游戏里，治疗药水只要把素材扔上合成台按下按钮就行了。剂量？工艺？连游戏公司自己都不知道吧。但看着恩菲殷勤的摆弄仪器，想到自己曾经向上司报告时的心理，安兹决定无论如何不能让他难堪。\n“就是这个，安兹大人。”恩菲递上存于安瓿瓶瓶中的药水。“果然…”眼前药水呈现出的青紫色与游戏中的血红完全不同。\n“抱歉安兹陛下，虽然有几次成功制出红色药水，但很快又会劣化变性成蓝色。不过经过研究，目前我已经能保证稳定生产出这种介于两者间的紫色药水。”\n“劣化？意思是这药水有效果？”“是的。”恩菲从柜子里翻出一把小刀贴近手心：“我为您演示…”\n“不必！”安兹还是不太相信药水的效果，哪怕只是效果不佳，对恩菲也是心理和身理上的双重不幸。“你是重要的人才，把双手留着为我工作吧。”\n安兹弹开玻璃瓶帽，撩起袍袖，接着将药水直接倒在裸露的皎白桡骨上。接触骨头的刹那，药水由紫色转为黑色，接着又好似沸腾般咕噜噜冒泡。药水很快耗尽，在骨头上留下浅浅的蚀刻纹路。\n“安…安兹陛下，您受伤了！”“别怕恩菲，这只是动画效果。”“动…动画？”\n恩菲当然听不懂。简单来说，在游戏里对身为不死者的安兹来说治疗药水反而会造成伤害，并带有腐蚀的动画效果。恩菲的紫色药水的效果并没有突破安兹的防御，但确实出现了游戏中的动画，也就是说——"
  WizardCountry.024.a: "“恩菲，你是个天才。”"

  WizardCountry.025.title: "武技研究，战场之王"
  WizardCountry.025.desc: "死亡骑士沉沉挥甩盾牌，格挡住了仓助的尾巴。“不错啊骑士君，那么这招如何？”仓助两手交叉俯下身子，本就憨态的身材彻底变成了个圆球，朝死亡骑士滚去。死亡骑士立住盾牌想要硬顶，怎料仓助在滚动中竟伸出尾毛勾住一旁看台边缘，在离心力作用下高高荡起。“接招—森林贤王坠击！”\n飞扬的尘土落地，死亡骑士倒在了地上。“哈哈，这次是小生赢了。”\n“啊，仓助！你又把竞技场弄乱了！”亚乌菈在看台上喊叫到。“噫！对，对不起亚乌菈阁下！”“好啦亚乌菈，这是在训练，弄乱也是没办法的吧。”安兹走入竞技场。亚乌菈腾空落下，倒在地上的死亡骑士也爬起来，三人一同下跪。\n“安兹阁下！如您所愿，我学会武技了！武技？安兹心里犯嘀咕。说到底，什么是武技的感觉呢？法师职业的安兹无法体会。光看的话就是普通的砸了一下，为什么变成武技后就会有远超常理的效果了呢？“非常好，那么亚乌菈，你应该没有忘记迪米乌哥斯告诉你的计划吧？”“是，我们将继续研究训练方法，让安兹陛下的士兵们都能掌握武技。”“原来是这种计划吗？”安兹感叹到。"
  WizardCountry.025.a: "连我家仓鼠都会。"

  WizardCountry.026.title: "叛徒"
  WizardCountry.026.desc: "阿弗列特是最早效忠魔导王安兹·乌尔·恭的一批人。在和德意志民族阵线作战的经历里，他和同僚不止一次被称作民族叛徒。起初阿弗列特感到羞耻，他是德意志人，却为德意志的侵略者效力，是生命驱动的人类，却向死亡世界的来者臣服。但是，他有选择吗？自魏玛共和国开始的混乱贯穿人生，他的父母皆死于起义，自小流落街头。他是德意志人，但除了带他来到这个世界上、给了他这副容貌外，德意志带给他的只有苦难和艰辛。谁能拯救德意志？谁能拯救他？\n但现在，阿弗列特不会再问这个问题了。对叛徒的说法，他总是和新兵说：“民主人士，纳粹党，共产主义者才是叛徒。他们为各自的信仰而纷争，将德意志同胞撕碎。那么我为什么不能为我的信仰而战？没有叛徒，只不过是竞争。我们正在做的是他们想要做的。唯一的区别是，我们是胜利者，因为只有我们认清了方向。”安兹·乌尔·恭让他不再饥饿，安兹·乌尔·恭让他不再苦闷，安兹·乌尔·恭让他拥有力量，而他只能以一物回报。"
  WizardCountry.026.a: "向您献上两世忠诚，陛下。"

  WizardCountry.027.title: "施人以仁"
  WizardCountry.027.desc: "维尔纳坐在招待室宽敞舒适的沙发上，却因焦急而坐立不安。应该说，这是全德意志地区企业家共同的心理。就拿维尔纳自己来说，他在柏林附近有三家工厂，此前一直承接纳粹的军工订单。骸骨之夜，他的工厂全部被不死者淹没，打算同毕生心血同归于尽的维尔纳没有选择逃离。当他发现工厂完好无损时当然欣喜若狂，但很快就笑不出来了。魔导王的部下接管了控制区内的所有工厂，尽管魔导王表示这是暂时的，但和官僚打了十几年交道的维尔纳明白究竟怎样不过是这位统治者一句话的事。几年来魔导王一直依照比例给予被接管企业的企业主们分红，这让他们大多数还是选择留下，但对维尔纳这种人来说，享受财富从不是目的，享受事业才是生活的意义。\n“阁下久等了。”走进接待室的，正是魔导王安兹·乌尔·恭本人。维尔纳恭敬跪下，毕竟说到底，安兹的统治并没有对不起他的地方。“陛下能接见我已经是莫大的荣幸。”“请坐，你并不只是为自己而来，对吗？”“陛下英明，我受委托来向陛下您求教的。”“何必说的这么委婉，莫非觉得我会食言？”“陛下！我怎敢？”“那就告诉我，你的欲望是什么！”“这，我…我们想拿回自己的企业…”“那么，我允许了！你需告诉所有人，只要结果是在为我国服务，我将实现你们的欲望。因此，不要试图欺瞒我。”严词仁行，维尔纳此刻算是知道了何为王者之风。自内心萌发的，是敬畏与崇拜。他以额贴地，恭敬的宣告誓言。"
  WizardCountry.027.a: "“我等将一切结果献给陛下…”"

  WizardCountry.028.title: "公民的一日"
  WizardCountry.028.desc: "生在勃兰登堡，活在勃兰登堡，想来多半也要葬在勃兰登堡。安娜·布劳恩祖祖辈辈都是劳工。作坊、工厂，农田，她们辛劳工作奉献一生，却连栖身之所都难以维持。正因如此，得知自己成为魔导国的“公民”时并没有多少担忧——她的人生还能更糟糕吗？如果魔导王把她变成不死奴隶，至少不用再担心饥饿。\n一抹夜色仍未淡去，安娜爬出拥挤的宿舍，准备上工。工厂大门前，工友们都围作一团躁动不已。\n“好吧，看来他是真想要我们的命。”\n安娜挤进人群，骚乱的源头是墙上粘贴的告示。看清告示内容的那一刻，安娜与她的工友一样目瞪口呆:“公民每日工作时间不得超过10小时。”\n粗暴的，时不时拳脚相加的监工不见了，取而代之的是一位沉默寡言的帝国官员。突如其来的变化令安娜不知所措，不不不，她当然不怀念过去那非人的待遇，但她如今的确受宠若惊。\n官员将手放在她的肩上说道:“没什么大不了的，好好感受慈悲吧。你爱安兹陛下，陛下也会爱你。”\n时间从没有这么快过，转眼就到了下工时间。看着工友们半信半疑的离开，安娜留了个卑鄙的心眼。“如果我继续工作，也许会得到赏识。”不要去怪罪这个可怜的少女，工厂主假意宽仁实则试探，这种事她见识的太多了。先前那位官员朝她走来，安娜庆幸自己的决定。“长官，我的工作还没有完成，我会继续的。“\n“我警告你，你正在违反魔导王陛下的法律。”\n听到法律一词，安娜的心顿时一颤。过往经历告诉她，法律是工厂主的武器，是挥向工人的长鞭：“长官！我，我做错了什么？”\n“立刻停止工作，现在是休息时间，这是安兹陛下的命令。”\n“您说真的吗？”\n“这是最后的警告，立刻离开！”\n安娜仓皇脱下工服，正要离开，官员叫住了她。\n“你早上忘了领这东西，现在给你。”官员递给她一张身份卡,上面记载了安娜的身份信息，医保记录及当前住址——附近一栋新完工的公寓楼。“回去核对一下信息，如果无误，你随时都可以从宿舍搬出去。”“可，可我没有钱支付这些。”\n“你只需要记住，这些都是魔导国，都是安兹陛下给你的。用你的忠诚去支付吧。”\n入夜，安娜在一天之前还不属于她的公寓内苦思久想。“你爱安兹陛下，陛下也会爱你。”突然，她明白了官员那句话的意思。"
  WizardCountry.028.a: "安兹陛下......万岁。"

  WizardCountry.029.title: "电影院的一夜"
  WizardCountry.029.desc: "《帝国的诞生》注定会是一部划时代的作品。由潘多拉·亚克特亲自担任顾问，集合最顶尖的制作团队拍摄的这部电影讲述了安兹·乌尔·恭陛下和其它四十位无上至尊是如何在他们的世界相遇，团结并进、成就传奇的故事。影片拍摄技巧高超，兼具宏大的叙事与细腻的人物刻画。在场的观众无不潸然泪下。\n“各位无上至尊都非凡人能企及，能被这些伟大的人一致推举为领袖，我再次深刻的感到安兹陛下的绝伦。”\n“哲学家的独裁政治才叫厉害，我如今深信这点。”\n在亲自观赏影片时，安兹陛下几度掩面。哪怕没有泪水，也能感到我们王者心中的触动。随着陛下御令，魔导国将在全国免费放映这部电影。"
  WizardCountry.029.a: "我的王，您的英姿让所有人铭记。"

  WizardCountry.040.title: "亡国的吸血姬"
  WizardCountry.040.desc: "1610年12月29日、宝石王国纳达其第伯爵领地。弗朗西斯·纳达其第伯爵的战死以来，他的遗孀巴托里伯爵夫人名下的财产令宝石王国的每个贵族垂涎。图尔索伯爵将城堡团团包围，他坚信自己将要最终得到这笔财富了。他担忧的只有一点——那些关于巴托里伯爵夫人的恐怖传闻。据说巴托里与她的仆人一同在城堡中虐待被送来当女仆的附近农民的女儿。将她们放血以供巴托里沐浴乃至直接饮用。她从某处得知了这残忍的偏方，并坚信能让她驻颜不老。三年间，她至少害死了六百人。如此恐怖的行为，莫非真的来自邪神？\n1610年12月30日夜，恰赫季斯城堡被攻破。\n12月31日，宝石王国纳达其第伯爵领地上的所有人一夜间蒸发，没有留下任何尸体。\n1611年4月11日，附近领主的调查队抵达恰赫季斯城堡并在塔楼中发现了被囚禁的巴托里夫人，在整整四个月没有食物的情况下巴托里夫人竟没有死去。经宗教审判庭审判，巴托里夫人被确认为吸血鬼，处以火刑。\n此后数十年常有人在城堡附近见到一名肤色煞白的女孩。传言那是巴托里伯爵夫人的女儿——“亡国的吸血姬”。"
  WizardCountry.040.a: "传说未必真实......"

  WizardCountry.057.title.01: "拾回黄金"
  WizardCountry.057.title.02: "碾踏懦弱"
  WizardCountry.057.desc.01: "“迪米乌哥斯，对我的处置你可有不满？”“身为仆人，无论如何背逆您的心意都是万死难辞。”“虽然你不能再出现在魔导国政坛，但纳萨力克内仍离不开你的智慧。”“能继续为安兹大人效力是对我最大的恩赐。”迪米乌哥斯停顿片刻，下定决心说：“怒我僭越，陛下能否回答属下一个疑问？在陛下心中，人类究竟是何种存在？”\n安兹无法回答，这与智慧无关而是涉及连纳萨力克成员也绝不能知晓的秘密，安兹百般遮掩的秘密——统治纳萨力克的安兹·乌尔·恭内心是名叫铃木悟的人类。曾经安兹一度想忘记自己的本质，但迪米乌哥斯对人类的冷漠残酷激起的恐惧让他回想起这一点。如果来到这个世界的不是名为莫莫伽的游戏角色而是铃木悟自已，迪米乌哥斯的所做所为恐怕同样会作用在他身上。迪米乌哥斯失势的原因只有一个，他令铃木悟恐惧。铃木悟已经受够这种恐惧，他不会再将恐惧施与他人。\n这样就够了吗？现在他是至高的王者，不必回答部下的问题、也不用解释什么。没有得到回答的迪米乌哥斯只能跪拜离去，被命令善待人类的部下也会无条件遵守。但只要真相未揭晓，疑问就不会消散。当他不再受拥戴，会发生什么呢......"
  WizardCountry.057.desc.02: "雅儿贝德，我不明白。”“无妨，安兹大人，我已经确信那些抛弃我们的至尊永远不会回来了。只要您的统治永固，我会在死界歌颂。”\n“你想要我杀死你吗？你知道我早已立下誓言，那些敢伤害我的同伴，甚至只是有这个想法的家伙，我都不会放过他。”“请吧安兹大人，我的一切都是为您而生的。”“为我？”“安兹大人您为什么还没发现呢？我爱您，我深爱您，我的主人！我不容许任何人挑战您的唯一，包括翠玉录——我的母亲。”\n安兹无话可说，他怎么会忘了这事呢？雅儿贝德之所以成为异类，归根结底是他动用权力篡改了雅儿贝德的数据——只因为自己的一点恶趣味。这是他的错，全因他不合格的统治。而现在，他要审判受害者。\n“你去照料卢贝多吧，没有我的命令不许离开。”“遵命，安兹·乌尔·恭大人，万岁！”安兹逃似的离开王座之厅，他的优柔寡断、自私妄为、以及那一丝悲戚之心都在伤害同伴。他不能再允许这种事情发生。铃木悟在安兹·乌尔·恭前跪下双膝，将最后一点人性献上。此后，他不再有弱点，此后，没有领袖能与他相比。"
  WizardCountry.057.a: "以后再去考虑吧......"
  WizardCountry.057.b: "现在，我是王了。"

  WizardCountry.058.title: "牧场物语"
  WizardCountry.058.desc: "我自从一出生就在这个叫做“牧场”地方，母亲叫我“汉斯”，但是外面那些白大褂都叫我“89757”。\n\n我数到第七次晨钟时，铁门外的甬道终于传来胶靴踏过消毒水的声音。\n“89757，你的配额。”护理员隔着栅栏递进来两个金属碗。左边的碗里盛着灰绿色糊状物，右边则是半碗泛着紫光的液体。母亲蜷缩在干草堆里咳嗽，发丝间露出的脖颈上，01426的烫金编号正在溃烂。\n我盯着护理员白大褂上的安兹·乌尔·恭纹章，那对交叉的骨杖在荧光下泛着青黑。“请给妈妈止痛剂，她昨晚咳血了。”我的声音在空旷的隔间里显得格外清脆。护理员脖颈处的鳃状器官突然张开，喷出一团淡黄色雾气。\n“咳血个体进入观察期。“机械合成音从她喉间的发声器传出，“现在进行晨间检查。”三条章鱼触手般的附肢从她腰间弹出，缠住母亲的手腕。母亲枯瘦的手臂上，原本应该闪烁魔法回路的皮肤此刻布满蛛网状的黑斑。\n消毒水的味道突然变得刺鼻。当触手末端的吸盘贴在母亲胸口时，我注意到护理员的瞳孔变成了危险的猩红色。“心肺功能衰竭，建议转移至C区。”她收回附肢时，母亲无名指上的婚戒被蹭落在干草堆里，那圈银光很快被紫药水浸没。\n正午的剃毛车间弥漫着蜂鸣器的震动声。我们排着队穿过三道净化光幕，赤脚踏过的合金地板上印着安兹·乌尔·恭的颅骨徽记。37号操作台上，剃刀魔偶正在给前边的女孩做预处理，八只机械臂在她脊背上校准着某种发光的网格。\n“皮肤完整度92%，魔力传导系数B级。”悬浮在半空的记录水晶发出播报，“保留长发区，准备采集。”当旋转刀头贴住我后颈时，熟悉的灼痛感顺着脊椎炸开。我能感觉到那些嵌在真皮层里的魔法回路正在苏醒，就像有无数只火蚁在啃噬骨髓。\n傍晚的饲育广场，三百个孩子跪在魔法阵中央背诵教典。我盯着自己手背上的条形码，那串数字在夕阳下泛着血光。管理者穿着黑金长袍站在观测台上，他杖头的眼球状宝石正在扫描人群。当那颗宝石转向我时，母亲无名指上的银戒突然在记忆里闪过。\n“检测到异常精神波动。”管理者举起法杖的瞬间，我的四肢被地面窜出的骨爪固定。他踩着悬浮碟降落到我面前，镶着红宝石的镜片后透出昆虫复眼般的幽光。“抗药性增强，情绪模块不稳定...”他翻开手中的皮质笔记本，“建议升级为牧羊犬。”\n夜幕降临时，我躺在D-17号隔离室的观察舱里。透过舱壁的单向玻璃，看见两个白大褂正在隔壁操作台前交谈。他们的声音经过魔法过滤依然清晰可辨：“...这批羔羊的皮肤成品率太低，迪米乌哥斯大人要求改用胚胎植入法...”“但是活体剥取的成本...”“下周开始测试新型溶解剂，连带血肉做成复合卷轴基材...”\n母亲咳血时溅在干草上的血点，此刻突然在视网膜上清晰起来。那些暗褐色的印记，分明组成了安兹·乌尔·恭的纹章图案。"
  WizardCountry.058.a: "【检验不合格】"

  WizardCountry.059.title: "伦敦大屠杀"
  WizardCountry.059.desc: "随着魔导国军队打破圣杯海军在海峡地区的封锁，圣杯王国的命运便急转直下。在魔导王严厉的军令之下，难以计数的亡灵和仆从军队踏上了圣杯王国的土地，圣杯南部各大城市纷纷陷落。而就在多日的攻城战之后，魔导国军队终于打破了圣杯军队布下的全部城防工事，伦敦城内的圣杯军队以及英灵们在激烈的抵抗之后，全部阵亡于城内。\n由于在多日的激战中，圣杯军队积极利用了城内庞杂的基础设施和城镇建筑进行节节抵抗，并积极武装平民发动反抗，对魔导国军队造成了极大杀伤。这严重激怒了前线的魔导国将领们，在魔导王的命令下，攻入城内的魔导国军队在伦敦城内开展了大规模报复行动，在规定的投降日期结束之后，亡灵军队全线进入城内各个地区，对可见的所有生物进行了无差别屠杀，大量的人类死于非命并被转化，伦敦城遭遇了再一次严重的毁灭，根据透露的情报显示，原来的世界之都已经转变为一座不断散发着巨大瘟疫的死亡之城，目前已无法统计到底有多少平民以及军人在这场有组织有计划的屠杀中失去生命。"
  WizardCountry.059.a: "抵抗便会被镇压，这是王的铁律"

  WizardCountry.060.title: "魔导国在伦敦大屠杀"
  WizardCountry.060.desc: "我们在伦敦的外交使馆已经确认了大屠杀的消息，滞留在伦敦的军民遭到了不死者军队的无差别屠戮，用最为血腥野蛮的方式表达了外星来物对这个最大的九日帝国的征服。现在仍然滞留在伦敦的外交人员已经被紧急接回，这场屠杀定会引发周边尚未被征服国家的震颤。"
  WizardCountry.060.a: "撕下伪善的外衣了啊，魔导王。"

  WizardCountry.062.title: "[FROM.GetName]送来一批武器"
  WizardCountry.062.desc: "来自欧罗巴的魔导国政权近日为我们送来了一大批军火，我们必可将这些武器活用于战争之中。"
  WizardCountry.062.a: "动机令人怀疑....但军火我们就收下了。"

  WizardCountry.063.title: "为了自由，为了祖国，为了......地球"
  WizardCountry.063.desc: "看上去那位魔导王认为他在占领区内的非人统治已臻于至善，现在，魔导国的外交部门向全世界发表了一则最后通牒，这意味着其征服全世界的步伐就此开始。当然，我们不会坐以待毙，但全世界的未来，全人类的未来，将面临迄今为止巨大的考验。"
  WizardCountry.063.a: "兄弟阋于墙，外御其侮！"
  WizardCountry.063.b: "我们将独自战胜魔导国"

  WizardCountry.065.title: "烟囱与福利券"
  WizardCountry.065.desc: "阿利斯泰尔・克劳利攥紧笔记本，站在柏林东郊的魔导国工厂外。晨雾中，无数骷髅整齐地排列在流水线前，骨指精准地组装着魔法零件，关节摩擦的“咔嗒”声取代了往日工人的呼喊。没有疲劳，没有抱怨，烟囱里升起的不是煤烟，而是淡紫色的魔法尾气——这是魔导国新经济的象征。\n“克劳利先生，这边请。”向导是魔导国宣传部的官员，递来的福利手册上印着安兹・乌尔・恭的骨制徽章，“每个活人家庭每周能领到三公斤黄油、两升牛奶，孩子免费入学魔法启蒙课。”阿利斯泰尔翻开手册，扉页印着一行小字：“公民死后遗体将由国家统一‘再利用’。”\n他跟着向导走进工人社区，砖房阳台上晒着整洁的衣物，孩子们举着魔法气球奔跑。一位名叫伊莎贝拉的女工正在花园修剪玫瑰，她的丈夫三年前死于流感，如今是市中心钟表厂的骷髅技工。“他生前总抱怨加班，”伊莎贝拉抚摸着玫瑰刺，“现在？他永远在工作，而我能下午四点下班陪女儿。”她的语气平静，仿佛在说一件再寻常不过的事。\n但当晚在酒馆，阿利斯泰尔遇到了不一样的声音。老木匠海因茨把啤酒杯重重一磕：“我父亲是伟大战争的老兵，现在却在罐头厂拧螺丝——作为骷髅！”他掀开衬衫，胸口纹着旧德意志的黑鹰徽章，“高福利？那是用死后的自由换的！上周，我邻居的儿子为了多领一张福利券，主动签了‘遗体捐献加速协议’。”酒馆角落，几个年轻人正讨论着如何通过魔法考试进入高端实验室，对老木匠的话充耳不闻。\n工厂的汽笛声突然响起，骷髅们整齐划一地停下动作，列队进入地下收容所。阿利斯泰尔望着夕阳下的骸骨队列，它们的影子在地面拖得很长，像无数条被拉长的锁链。"
  WizardCountry.065.a: "阿利斯泰尔在笔记本上写下："
  WizardCountry.065.a.d: "§Y“这里的烟囱不冒烟，却烧着灵魂。”§!"

  WizardCountry.066.title: "慕尼黑的百叶窗与骨蹄声"
  WizardCountry.066.desc: "魔导国的亡灵军团开进慕尼黑那天，老城的百叶窗全关着。面包师赫尔曼用钉子加固窗板时，听见骨蹄踏过石板路的“笃笃”声——那是亡灵骑士的坐骑在巡逻，甲胄碰撞的脆响里，混着某处窗台被震落的花盆碎裂声。广播里反复播放着安兹・乌尔・恭的宣言：“关闭抵抗，开启福利。”但赫尔曼只记得前政府传单上的话：“亡灵会吞噬生者的灵魂。”\n第一个月，街道上空荡荡的。直到有人发现，市政厅门口的救济站开始分发免费面粉，比魏玛时期用一麻袋马克换的还多。裁缝索菲娅抱着试试看的心态拉开百叶窗一条缝，看见骷髅清洁工正用骨指擦拭她店铺前的污渍，动作笨拙却仔细。她犹豫着走出店门，接过福利官递来的布料配给券，券面上印着魔导王的徽记，边缘还沾着些许魔法粉尘。\n变化是从孩子们开始的。学校重开后，课本里夹着免费的魔法铅笔，能自动校正拼写。十二岁的弗里茨偷偷跟着亡灵骑士的影子跑，发现他们从不会推开路边打闹的孩子——哪怕骑士的骨手挥起来能轻易碾碎石块。有天他回家说：“骑士先生的马会发光，比圣诞市集的彩灯还亮。”母亲安娜捂住他的嘴，却在夜里悄悄掀开窗帘，望见巡逻队帮老太太把陷进泥坑的手推车抬了出来。\n但恐惧从未真正消失。赫尔曼在酒馆见过执法队用读心术审问小偷，那男人突然尖叫着瘫倒，眼神空洞得像被挖走了眼珠。“他们能看穿你的心，”酒保擦着杯子低声说，“上周有个面包师抱怨面粉不够，当晚就被带去‘谈话’。”这时窗外传来欢呼，一群年轻人举着魔导国的旗帜跑过，他们刚领到新的魔法收音机——那是政府给“积极市民”的奖励。\n三个月后，大多数百叶窗都打开了。索菲娅的裁缝铺挂出绣着魔导王徽记的窗帘，赫尔曼的面包店门口，骷髅清洁工偶尔会收到孩子们塞来的小块面包。只是每当亡灵骑士的蹄声靠近，街上的笑声总会轻下去，人们的目光掠过骑士腰间的符文剑时，瞳孔里仍藏着一丝不易察觉的颤抖。"
  WizardCountry.066.a: "魔导国万岁？"

  WizardCountry.067.title: "阴影中的棋局"
  WizardCountry.067.desc: "1936年的慕尼黑，“黑鹰”游击队的据点藏在啤酒厂的地下酒窖里。队长克劳斯展开地图，指尖划过骷髅巡逻队的换班路线：“今晚行动，炸毁城东的骷髅兵工厂。”队员们握紧偷来的魔法手雷——那是两周前从亡灵执法队手里“截获”的，引信上的符文还很新。\n行动异常顺利。哨兵的骸骨刚转向，就被队员海因茨的沉默魔法定在原地；工厂的魔法屏障比情报里薄弱一半，手雷炸开时，骨制流水线的碎片像雪花般飞溅。撤退时，克劳斯瞥见仓库里堆放的备用骷髅零件，突然觉得胜利似乎没那么难。\n次月，他们策反了一名负责骷髅维护的活人技师。技师带来了关键情报：魔导国的读心术对佩戴“反魔法符文”的人无效。游击队连夜赶制了二十枚符文，在汉堡码头成功营救了三名即将被“转化”的工人。克劳斯在庆功酒会上举杯：“看，亡灵不是不可战胜的。”\n转折点发生在冬季。他们收到线报，称某座骷髅收容所的魔法核心会在满月夜减弱。三十名队员潜入时，却发现收容所里空无一人——只有墙上用鲜血写的字：“期待你们很久了。”身后突然传来骨蹄声，亡灵骑士的包围圈像铁桶般收紧，克劳斯才惊觉：所谓的“线报”，来自一个从未露过面的“联络员”。\n更可怕的事接踵而至。他们藏在黑森林的武器库突然爆炸，库存的魔法手雷全成了哑弹——后来才知道，那些手雷从一开始就是魔导国特制的“失效模型”；连那位被策反的技师，也在审讯中被读心术揭穿：他的“反魔法符文”制作方法，是安兹的守护者故意泄露的。\n最后的行动是刺杀经济部长。克劳斯带着最精锐的五人组，摸到部长官邸的通风管道，却听见里面传来艾多玛的声音：“……游击队的破坏刚好帮我们清理了低效工厂，陛下的计划真是完美。”管道外，亡灵骑士的笑声像冰锥刺入耳膜。克劳斯瘫坐在灰尘里，终于明白：他们每一次“成功”的反抗，都踩在魔导国画好的格子里。"
  WizardCountry.067.a: "任何反抗都只是棋盘上被允许的移动"

  WizardCountry.068.title: "无尽轮回的牢笼"
  WizardCountry.068.desc: "纳萨力克地下大坟墓的刑讯室里，铁锈与腐烂的气味混着魔法药水的甜腥。克劳斯被铁链吊在岩壁上，胸前的旧伤刚被治愈魔法抚平，皮肤下的肌肉还在因药物而抽搐。恐怖公的螯肢擦过他的脸颊，带起一串血珠：“说吧，你们的藏身处还有多少人？”克劳斯咬紧牙关，唾沫里混着血——这是第七次了，每次濒死时，那道淡绿色的治疗光束总会准时落下，将他从死亡边缘拽回，再扔进新一轮的剧痛里。\n旁边的海因茨已经神志不清，曾经用来施展沉默魔法的手指被一节节碾碎又接好，指甲盖在愈合与撕裂间反复，血痂粘在刑具上，像干涸的红蜡。恐怖公的仆从们用镊子夹着发光的虫子，慢悠悠地爬过他的伤口，每当他昏过去，治疗魔法便会像冰水浇头般唤醒他。“反抗的滋味，喜欢吗？”恐怖公的声音像碎石摩擦，螯肢突然刺穿克劳斯的肩膀，“魔导王的仁慈，就是让你们活着感受代价。”\n三天后，刑讯室终于安静了。克劳斯和幸存的队员们被扔在地板上，浑身没有一块完整的皮肤，却又在治疗魔法的作用下吊着最后一口气，眼神空洞得像被挖走了灵魂。恐怖公抖了抖螯肢上的血，对身后的文书官说：“记录：反抗者七名，已完成‘轮回惩戒’，精神彻底崩溃。”\n文书官将结果抄写成奏折，呈给迪米乌哥斯，再转递到安兹的书房。彼时安兹正对着一堆经济报表皱眉，随手拿起奏折扫了一眼——上面只有几行字：“处置完毕，无价值信息，已废其反抗能力。”他“嗯”了一声，随手将奏折放在桌角，那里还堆着昨晚没看完的骷髅劳工调配清单。他还没有想明白，“哈耶克说的‘市场杠杆’，到底要怎么用在骷髅身上？”"
  WizardCountry.068.a: "奏折的边角被风吹得微微翻动，像一片没人在意的枯叶。"

  WizardCountry.069.title: "银幕与勋章的对抗"
  WizardCountry.069.desc: "汉斯攥着刚领到的配给券，快步穿过柏林工厂区的石板路。礼堂里循环播放的宣传电影还在他脑海里闪回——魔导王安兹・乌尔・恭的骨手拂过干裂的土地，枯萎的马铃薯田便在幽蓝魔法光中抽出新芽。旁白的魔法扩音声带着金属震颤：“是魔导王终结了饥饿，是魔导国带来了秩序。”十八岁的汉斯摸了摸口袋里温热的黑面包，三年前，他还在鲁尔的废墟里捡拾发霉的麦粒。\n推开家门时，父亲卡尔正坐在窗边，用软布擦拭那枚边缘磨损的铁十字勋章。勋章背面刻着1916年，那是卡尔在索姆河战役负伤的年份。“又去看那些亡灵的谎言？”卡尔把勋章搁在胡桃木桌上，声音像生锈的铰链在摩擦，“忘了骸骨之夜他们是怎么踏平柏林的？”汉斯将配给券拍在桌上，奶油面包的香气飘向父亲：“可现在每天都能吃到这个。魏玛时期，您挣的马克连半块面包都买不到。”\n卡尔猛地站起身，木椅被撞得向后翻倒。他指着墙上那幅泛黄的画像——薇莲二世身着军装的肖像早已卷了边。“我为德意志流过血，”他的拐杖重重砸在地板上，震得相框晃了晃，“不是为了给不死者当顺民！”汉斯盯着父亲瘸着的左腿——那是凡尔登战役留下的纪念，也是魏玛政府拖欠抚恤金的证明。“您的德意志早就烂透了，”他突然提高声音，“现在是魔导国让我们活着！”\n卡尔的拐杖带着风声挥过来，汉斯没躲。杖端擦过他的肩膀，砸在墙上的肖像框上。玻璃碎裂的脆响中，薇莲二世的画像裂成蛛网。卡尔喘着粗气，胸口剧烈起伏，汉斯望着地上的玻璃碴，突然发现父亲勋章边缘的缺口，和自己工厂里亡灵卫兵甲胄的划痕，竟有几分相似。"
  WizardCountry.069.a: "窗外传来亡灵巡逻队的金属脚步声，父子俩同时噤声。"

  WizardCountry.070.title: "黑板与枪托之间"
  WizardCountry.070.desc: "柏林第三魔法中学的晨课铃响时，扎拉正盯着黑板上跳动的魔法公式发呆。那些由符文与数字组成的算式像活物般扭曲，老师用教鞭敲着黑板：“这是计算骷髅流水线误差的基础公式，期末不过关的，福利等级降一级。”周围的同学唰唰翻着笔记，扎拉的铅笔在纸上戳出一个个小洞——她能轻松拆解一把魔导步枪的零件，却记不住最简单的魔法变量。\n魔导国的教育体系像精密的齿轮：上午是文化课程，从经济学原理到亡灵魔法理论，课本里夹着每个人的“潜力评估表”；下午是实践课，扎拉在射击场能闭着眼打中百米外的靶心，组装魔法地雷的速度比老师还快。但评估表上“文化课评级：D”的红色印章，像块石头压在她胸口。\n福利官来家访那天，母亲正把新领到的魔法面包分给妹妹。“扎拉的文化课拖了全家后腿，”福利官的钢笔在记录板上划过，“再这样，下个月的牛奶配给要减半。”扎拉攥紧了藏在门后的训练用木枪，枪托的纹路被她摸得光滑——她见过军校生穿着笔挺的制服走过街道，她们的评估表上只有“战术”“格斗”“亡灵协同”这些科目。\n报名军校的那天，扎拉在表格上签下名字时，手居然不抖了。军校的日子像上了发条：凌晨五点的负重跑，上午的骷髅队列指挥课，下午与亡灵骑士的协同演练。教官的皮靴踢在她小腿上：“记住，你的枪比笔有用——魔导国需要的是能指挥骷髅军团的军官，不是算错账的书呆子。”她第一次在评估表上拿到“A”，评语是“对亡灵指令执行度高”。\n圣诞那天，家里收到她寄回的军校特供巧克力。妹妹在回信里画了个歪歪扭扭的骷髅，旁边写着：“姐姐，你的枪比魔法公式好看。”扎拉把信折好塞进军装口袋，正赶上亡灵骑士的夜间巡逻——她抬手敬礼时，突然觉得枪托的触感，比黑板的冰凉更让人踏实。"
  WizardCountry.070.a: "魔导国的教育制度像一把精准的筛子，将不同天赋的人导向预设的轨道。"

  WizardCountry.071.title: "五周年的骨与钢"
  WizardCountry.071.desc: "柏林胜利广场的地面因重型装备的碾压而微微震颤。魔导国建国五周年阅兵式上，率先通过观礼台的是军官团——扎拉与同伴们穿着笔挺的灰制服，肩章上的骷髅徽章在阳光下反光，正步的节奏精准得如同魔法节拍，这是魔导军校三年严苛训练的烙印。\n紧随其后的钢铁洪流掀起了第一个高潮：数十辆坦克组成的方阵碾过石板路，黝黑的装甲上刷着魔导国的黑底骨纹标志。这些坦克的履带、炮管、发动机全由钢铁锻造，但车身上的焊接痕迹却异常整齐——市民们都知道，每一颗螺丝的拧紧角度，都出自骷髅技工之手。它们曾在生产线上被亡灵们用骨指反复校准，如今炮口高昂，行进间没有一丝杂音。\n魔导部队的士兵扛着符文步枪紧随其后，枪身镶嵌的魔法水晶与坦克的钢铁外壳交相辉映。空中，由骷髅技工维护的俯冲轰炸机编队掠过，机翼下的魔法炸弹舱门自动开合，展示着精密的机械结构。当最后一辆坦克驶过观礼台时，车长探身敬礼，她的手套上还沾着调试引擎时蹭到的机油——那是今早与骷髅技工共同检查装备时留下的。\n观礼台上，雅儿贝德将演讲稿呈给安兹，金色的字体在阳光下格外醒目：“……我国钢铁产量五年内增长四倍，骷髅技工组装的装甲部队已具备跨洲作战能力，魔导军校培育的军官与亡灵协同作战时，胜率达百分之百……”安兹抬手致意的瞬间，台下爆发出雷鸣般的掌声，有人举着“钢铁与骨，共筑辉煌”的标语欢呼。"
  WizardCountry.071.a: "魔导王万岁！魔导国万岁！"

  WizardCountry.072.title: "猎杀队的阴影"
  WizardCountry.072.desc: "纳萨力克地下大坟墓的第六层，废弃的竞技场入口处，魔法火把的光芒忽明忽暗。雅儿贝德正对着阴影中的十余名黑衣人训话，银色长发在兜帽下露出几缕，声音压得极低，却带着刺骨的寒意：“记住你们的使命——任何试图接近安兹大人的‘同胞’，无论是谁，格杀勿论。”\n黑衣人单膝跪地，铠甲摩擦声在空荡的走廊里格外清晰：“谨遵团长命令！”\n突然，走廊尽头传来一声轻响。雅儿贝德猛地转身，血色瞳孔锁定在阴影中的身影——迪米乌哥斯正站在那里，紫黑色兜帽下的金色眼睛因震惊而收缩。他手中的情报卷轴掉落在地，上面还沾着刚从人类王国带回的血迹。\n“迪米乌哥斯大人，”雅儿贝德迅速收敛杀气，语气恢复了平日的平静，仿佛刚才的对话只是幻觉，“深夜至此，有何要事？”\n迪米乌哥斯的目光扫过那些黑衣人——他们的铠甲上没有任何纳萨力克的徽记，只有一种用于屏蔽魔法探测的符文，这是“无上至尊猎杀队”独有的标识。他捡起卷轴，指尖因用力而泛白：“宰相大人竟瞒着所有守护者，组建了这样一支……队伍？”他清楚，安兹大人从未放弃寻找其他无上至尊，而雅儿贝德的所作所为，无异于背叛。\n雅儿贝德向前一步，长袍扫过地面的碎石：“这是为了保护陛下。那些可能归来的‘同胞’，谁能保证他们对陛下没有异心？”她抬手按在剑柄上，“你会向陛下告发我吗？”\n迪米乌哥斯沉默了。他看着雅儿贝德眼中毫不掩饰的偏执——那是对安兹近乎疯狂的占有欲，比任何刀刃都更危险。走廊里的空气仿佛凝固，黑衣人握紧了腰间的武器，只待雅儿贝德一声令下。"
  WizardCountry.072.a: "迪米乌哥斯当晚求见安兹，将猎杀队的存在和盘托出"
  WizardCountry.072.b: "迪米乌哥斯选择沉默，但要求雅儿贝德解散猎杀队，两人达成脆弱的妥协"

  WizardCountry.073.title: "骨座前的震怒"
  WizardCountry.073.desc: "纳萨力克地下大坟墓的王座厅里，魔法灯的光芒第一次显得如此冰冷。安兹・乌尔・恭站在骨制王座前，紫黑色长袍因他剧烈的动作而扬起褶皱，骨指攥得咯咯作响，红宝石眼眸中翻涌着连他自己都未曾察觉的怒火——这是自来到这个世界后，他第一次如此失态。\n雅儿贝德跪在冰冷的黑曜石地面上，银色长发散乱地铺在肩前，宰相长袍被她自己扯得歪斜，脸上血色尽褪，血色瞳孔里写满了难以置信：“陛下……我只是想保护您！那些可能回来的‘同胞’，万一他们想夺走您的一切……”\n“住口！”安兹的声音像碎裂的冰块砸在地上，震得厅内的守护者们齐齐低头，“你组建‘猎杀队’，要杀的是与我并肩作战过的同伴！是和我一样来自同一个世界的人！”他猛地抬手，骨掌拍在王座的扶手上，发出沉闷的巨响，“我寻找他们多少年？你却在背后策划这种事！”\n迪米乌哥斯站在一旁，金色瞳孔中满是震惊——他从未见过安兹大人如此愤怒，那不是对敌人的杀意，而是混杂着失望与痛苦的暴怒。其他守护者更是大气不敢出，连亚乌菈和马雷都紧紧攥着彼此的手，看着平日里被安兹格外纵容的雅儿贝德，此刻像个做错事的孩子，却连辩解都显得苍白。\n“雅儿贝德，”安兹的声音稍微平复，却带着不容置疑的威严，“从现在起，你被免去宰相一职，所有权力收归中央政务厅。”他顿了顿，每一个字都像锤子砸在雅儿贝德心上，“禁足于你的寝宫，没有我的命令，不准踏出半步。好好反省——什么是‘守护’，什么是‘背叛’。”\n雅儿贝德的嘴唇颤抖着，想说什么，却被安兹眼中的决绝钉在原地。她知道，这次安兹是真的动怒了——他可以容忍权力争斗，可以默许她的偏执，却绝不能原谅她将刀刃对准“无上至尊”的可能。\n“迪米乌哥斯，”安兹转向身旁的守护者，声音恢复了些许平静，却带着疲惫，“暂代宰相职权，清理猎杀队的残余势力，一个不留。”\n迪米乌哥斯躬身领命，目光掠过瘫在地上的雅儿贝德，心中五味杂陈。王座厅里，安兹重新坐回王座，骨手撑着额头，第一次觉得统治这个世界，比游戏里的公会战要累得多。"
  WizardCountry.073.a: "安兹深夜独自来到雅儿贝德的寝宫前，犹豫片刻后转身离开"

  WizardCountry.074.title: "银匙与铁腕的交替"
  WizardCountry.074.desc: "纳萨力克王座厅的魔法火焰比往日柔和了几分，映照着安兹・乌尔・恭骨座前的身影。塞巴斯·蒂安穿着一尘不染的燕尾服，白色手套轻轻按在小腹前，躬身的角度完美得如同教科书——与雅儿贝德的锋芒毕露不同，这位前管家的身上总带着一种温润的稳重。\n“塞巴斯·蒂安，”安兹的声音褪去了前日的暴怒，却仍带着一丝不易察觉的疲惫，“即日起，由你接任魔导国宰相一职。”\n厅内的守护者们明显愣了一下。迪米乌哥斯的金色瞳孔微微睁大，亚乌菈忍不住拽了拽马雷的袖子——谁都以为暂代职权的迪米乌哥斯会顺理成章接任，却没想到安兹选中了行事风格最“温和”的塞巴斯·蒂安。\n塞巴斯·蒂安直起身，银色发丝在灯光下泛着柔和的光：“陛下的信任，是属下的荣幸。”他的声音像大提琴的低音，沉稳得让人安心，“但属下有一问：宰相之责，是延续此前的铁腕，还是……”\n“是让魔导国学会‘呼吸’。”安兹打断他，骨指轻轻敲击扶手，“雅儿贝德的极端，让我意识到……统治不是只有压制。”他看向塞巴斯·蒂安，红宝石眼眸中难得地流露出一丝期许，“你懂人类的情感，懂‘温和’的力量。让那些活在恐惧里的子民看看，魔导国的秩序，也可以带着温度。”\n塞巴斯·蒂安再次躬身，燕尾服的下摆划出优雅的弧线：“属下明白。将削减亡灵执法队的读心术使用频率，重审部分因‘疑似反抗’入狱的平民，同时……”他顿了顿，补充道，“会保留必要的威严，确保秩序不失。”\n迪米乌哥斯上前一步，递上象征宰相权力的符文印玺：“塞巴斯·蒂安大人，这是政务厅的全部权限清单。”他的语气里没有不满，只有对安兹决策的绝对服从——或许，这位以“绅士风度”闻名的守护者，真的能填补雅儿贝德留下的裂痕。\n塞巴斯·蒂安接过印玺，指尖传来冰凉的触感。他看向王座上的安兹，突然想起曾在人类村庄见过的场景：面包师给乞丐分面包时，脸上的笑容比魔法还要温暖。“请陛下放心，”他轻声说，“属下会让魔导国的子民知道，秩序与仁慈，并非不能共存。”"
  WizardCountry.074.a: "新宰相，新气象。"

  WizardCountry.075.title: "银手套下的协商之声"
  WizardCountry.075.desc: "柏林政务厅的会客室里，阳光透过彩绘玻璃窗落在橡木桌上，驱散了往日的阴冷。塞巴斯·蒂安摘下白色手套，指尖轻轻拂过桌上的瓷杯——里面盛着刚沏好的红茶，是他特意让人从巴伐利亚运来的。对面坐着的维利・勃兰特紧握着公文包，这位民主团体的领袖仍带着警惕，毕竟三个月前，他的同伴还因散发传单被亡灵执法队带走。\n柏林政务厅的会客室里，阳光透过彩绘玻璃窗落在橡木桌上，驱散了往日的阴冷。塞巴斯·蒂安摘下白色手套，指尖轻轻拂过桌上的瓷杯——里面盛着刚沏好的红茶，是他特意让人从巴伐利亚运来的。对面坐着的维利・勃兰特紧握着公文包，这位民主团体的领袖仍带着警惕，毕竟三个月前，他的同伴还因散发传单被亡灵执法队带走。\n“勃兰特先生，”塞巴斯·蒂安的声音温和得像午后的风，“读心术审讯已被严格限制，今后执法队只会对确认的暴力犯罪使用魔法。”他推过一份文件，上面盖着魔导国的新印章，“上周被关押的七名平民，因‘疑似反抗’入狱，现已释放。”\n勃兰特的喉结动了动。他注意到塞巴斯·蒂安身后的卫兵不是骷髅，而是穿着制服的活人，腰间的佩剑也未出鞘。窗外，亡灵骑士的巡逻频率明显降低，街角的面包店里，有人敢当着骷髅清洁工的面抱怨面粉质量了——这些变化，都发生在塞巴斯·蒂安上任后的一个月里。\n“您说的‘民生委员会’，”勃兰特终于开口，声音带着试探，“真的能让我们参与政策讨论？”“当然。”塞巴斯·蒂安翻开另一份章程，钢笔在纸上划出工整的字迹，“委员会由十名人类代表、三名巫妖顾问和两名守护者组成，每月召开一次会议，讨论骷髅劳工的福利、魔法教育的普及——比如您上次提出的‘减少儿童魔法课程压力’，我们已在慕尼黑试点。”他抬眼微笑，银色发丝垂落在额前，“魔导国的秩序，不该只有命令，也该有倾听。”\n消息传开时，柏林的市民们半信半疑。直到第一届民生委员会在市政厅召开，勃兰特站在发言台上，对着安插在听众席里的巫妖和人类官员，公开质疑“骷髅工厂的安全防护不足”，而塞巴斯·蒂安认真记录的样子被魔法水晶传遍全城。\n执法队的变化更直观：从前看到巡逻队就关门的裁缝铺，如今敢把绣着委员会徽记的窗帘挂出来；酒馆里，人们不再用暗号交流，而是大声讨论着下个月的福利调整——虽然提到亡灵骑士时，声音还是会不自觉压低。"
  WizardCountry.075.a: "一道暖流注入了魔导国冰冷的秩序体系"

  WizardCountry.076.title: "阴影中的铁腕"
  WizardCountry.076.desc: "民生委员会的第三次会议刚结束，勃兰特握着塞巴斯·蒂安签署的“增加冬季煤炭配给”文件走出市政厅时，街角的阴影里，两名活人卫兵正悄无声息地扣住一个穿风衣的男人。那人挣扎着想要呼救，却被卫兵用浸过魔法药剂的布捂住嘴，像一袋谷物般被拖进巷尾——这是塞巴斯·蒂安上任后，柏林街头第17起“无声抓捕”。\n塞巴斯·蒂安坐在政务厅的书房里，指尖夹着一张素描画像。画中男人有着鹰钩鼻和深凹的眼窝，正是卡罗・米伦多夫——地下游击队的核心头目，也是他近期唯一的“重点工作”。画像边缘标注着一行小字：“袭击骷髅工厂3次，导致7名平民伤亡”。\n“大人，”贴身卫兵低声汇报，“昨夜突袭了他们在黑森林的第三个据点，缴获了20枚自制魔法炸弹，但卡罗本人逃脱了。”\n塞巴斯·蒂安放下画像，拿起白手套慢条斯理地戴上，指尖的弧度依旧优雅：“他的副手呢？”\n“已捕获，正在审讯。”\n“用‘真理之触’，”塞巴斯·蒂安的声音没有一丝波澜，“但别弄出太大动静，明天还要和勃兰特先生讨论儿童教育法案。”他所说的“真理之触”，是一种不会留下外伤，却能让人神经剧痛到崩溃的魔法，比读心术更隐蔽，也更残酷——这是他为“顽固分子”准备的专属手段。\n游击队的覆灭比想象中更快。塞巴斯·蒂安没有动用亡灵军团，而是亲自挑选了50名精通潜入术的活人卫兵，像修剪杂枝般逐个拔除他们的据点：藏在啤酒厂酒窖的通讯站被连夜捣毁，负责传递消息的面包师在烤箱前被按住，连卡罗最信任的联络员——那位在民生委员会上哭诉过“骷髅劳工抢了工作”的老妇人，也在给孙女织毛衣时被带走。\n市民们隐约感觉到变化：巡逻的活人卫兵多了，巷尾的暗哨换上了新面孔，酒馆里讨论“反抗”的声音像被掐灭的烟蒂，只剩下吞吐的沉默。有人在黎明时看到黑森林方向升起信号弹，却再也没见过那些举着旧德意志旗帜的游击队员出现。\n塞巴斯·蒂安在民生委员会上依旧温和地倾听勃兰特的提案，只是袖口偶尔会沾着不易察觉的泥土——那是凌晨亲自带队突袭时，从据点的地板缝里蹭到的。当勃兰特小心翼翼地提到“近期失踪人数增多”时，他只是递过一杯新沏的红茶：“都是些扰乱秩序的小角色，不影响我们的协商，不是吗？”"
  WizardCountry.076.a: "“温和”需要威慑作为后盾"

  WizardCountry.077.title: "联邦的诞生之路"
  WizardCountry.077.desc: "深秋，华沙的残垣断壁间飘着冷雨。塞巴斯·蒂安踩着泥泞走进这座刚被魔导国骷髅军团攻占的城市，黑色长靴碾过混着弹片的瓦砾——这是世界大战爆发后，魔导国占领的第12座重要城市。他的燕尾服下摆沾着尘土，却依旧挺直脊背，手中紧握着一卷标注着“占领区治理章程”的羊皮纸。\n“大人，抵抗组织的残余势力藏在老城下水道，需要派骷髅兵清剿吗？”巫妖军官的声音带着金属质感，身后的亡灵军团正维持着僵硬的秩序，市民们蜷缩在废墟里，眼神里满是恐惧。\n塞巴斯·蒂安摇头，指尖划过羊皮纸上的“合作者筛选标准”：“先开仓放粮。”他指向市政厅的废墟，“让骷髅工兵优先修复面包房和发电站——饿着肚子的人，只会把我们当成掠夺者，而不是秩序的带来者。”\n三天后，华沙临时治安署前贴出了一张魔法告示：“招募市政合作者，凡能组织五十名市民恢复生产、无战争罪记录者，可参与自治委员会选举。”告示下方，塞巴斯·蒂安的签名旁画着一个小小的天平图案——这是他为占领区设计的徽记，象征“魔导国权威”与“地方自治”的平衡。\n第一个走进治安署的是面包师扬・科瓦奇。这位留着络腮胡的卡西米尔人曾因拒绝给纳粹军官送面包被殴打，此刻却攥着磨破的围裙，声音沙哑：“你真的会让我们自己管自己？”\n“前提是遵守魔导国的基本法。”塞巴斯·蒂安坐在临时拼凑的木桌后，推给他一份文件，“自治委员会可以管理粮食分配、街道清洁、甚至当地的小学课程，但军事防御、魔法资源调配必须由魔导国派驻的监督官负责。”他看着扬眼中的犹豫，补充道，“你的面包房，明天就能拿到魔导国的面粉补给。”\n一个月后，华沙自治委员会在修复后的市政厅召开第一次会议。扬・科瓦奇当选为主席，身边坐着犹太商人、乌克兰农民代表、甚至还有前执念军队的军医——这些曾是“敌人”的人，此刻正围着塞巴斯·蒂安送来的“地方财政预算表”争论不休。\n“骷髅军团的驻扎费太高了！”犹太商人敲着桌子，“我们的税收根本不够！”“可以用黑麦抵扣一部分。”塞巴斯·蒂安派来的监督官（一位擅长经济的巫妖）平静地说，“魔导国允许占领区用农产品折算三成税费。”\n这样的场景在被占领的各个城市不断上演。塞巴斯·蒂安的策略简单却有效：用“有限自治”换取“秩序认同”。他亲自筛选合作者，拒绝那些只会喊口号的投机者，只留下像扬这样“能让烤箱重新冒烟”的务实派。每个自治政府成立时，他都会送去两样东西：一本《魔导国基本法》，和一台能直接联系柏林政务厅的魔法通讯器。"
  WizardCountry.077.a: "好好干，魔导王不会忘记你们"

  WizardCountry.078.title: "联邦的雏形与内部的博弈"
  WizardCountry.078.desc: "塞巴斯·蒂安在维也纳召开了第一次“占领区联合会议”。十六个自治政府的代表围坐在圆形桌前，桌上摆着的不仅有各自的财政报表，还有塞巴斯·蒂安草拟的《联邦章程》——上面写着“各自治体保留文化、教育自主权，共同承担国防义务，定期向魔导王述职”。\n“凭什么波西米亚的矿产要分给萨克森一半？”布拉格代表拍了桌子，他的族徽与执念代表的族徽在灯光下形成对峙的剪影。塞巴斯·蒂安没有说话，只是让巫妖监督官展开一幅魔法地图：上面标注着各占领区的资源分布——波西米亚的铁矿、乌克兰的粮仓、萨克森的工厂，正用红色线条连成一张相互依存的网络。“联邦不是掠夺，是让面包师有面粉，铁匠有铁矿。”他的声音不高，却让争吵声渐渐平息。\n会议结束时，代表们在《联邦章程》上签下名字。扬・科瓦奇的笔尖悬了很久，最终落在“华沙”二字上——他想起上周，自治委员会通过的“卡西米尔语教学法案”被塞巴斯·蒂安批准时，女儿在街头用新课本欢呼的样子。"
  WizardCountry.078.a: "我们将团结在魔导王之下"

  WizardCountry.079.title: "帝国联邦的诞生"
  WizardCountry.079.desc: "安兹・乌尔・恭站在柏林大教堂的穹顶下，看着下方广场上飘扬的十六面自治区旗帜。塞巴斯·蒂安捧着烫金的《联邦宪章》，缓步走上台阶：“陛下，经各占领区自治政府公投，‘安兹·乌尔·恭魔导帝国联邦’今日正式成立。”\n宪章的最后一页，盖着十六个自治政府的印章，和安兹的骨印。扬・科瓦奇作为代表，站在最前排，看着安兹举起骨手，用传遍广场的声音宣布：“联邦的每片土地，都将沐浴在共存的秩序之下。”他突然觉得口袋里的自治委员会徽章变得滚烫——那上面刻着天平与骷髅的组合图案，是塞巴斯·蒂安亲手设计的联邦徽记。\n“占领区的治理，从来不是征服，是编织。”塞巴斯·蒂安在日记里写道，窗外是联邦议会大厦的灯光，“当布拉格的钟表匠开始给柏林的骷髅兵修怀表，当华沙的面包师教维也纳的主妇烤黑麦面包，联邦就不再是纸上的章程。”他合上本子，指尖的银戒在月光下闪着微光，"
  WizardCountry.079.a: "“这或许，就是陛下‘万族乌托邦’在战时的另一种模样。”"

  WizardCountry.080.title: "枷锁与剑"
  WizardCountry.080.desc: "纳萨力克大坟墓的回廊里，魔法烛火在壁龛中摇曳，将塞巴斯·蒂安的影子拉得很长。他站在雅儿贝德寝宫的门前，手中捧着安兹的亲笔谕令，白色手套下的指尖微微收紧——这是他第三次为这件事求见安兹，理由从“西线战事吃紧”到“亡灵军团需要高阶指挥官”，最终让那位魔导王松口的，是一句“让她在战场上证明对陛下的忠诚”。\n寝宫的石门缓缓开启时，雅儿贝德正坐在窗边擦拭那把“秩序之剑”。银色长发比禁足前更显凌乱，血色瞳孔里却燃烧着压抑已久的火焰。当塞巴斯·蒂安宣读“解除禁足，即刻接管北方集团军群”的谕令时，她猛地站起，长袍扫落了桌上的水晶瓶，碎片在地面折射出冷光：“陛下……终于愿意再相信我了吗？”\n“陛下的谕令中还有一条，”塞巴斯·蒂安的声音平稳如旧，“您的参谋部将配备三名来自情报部的联络官，每日战况需同步抄送政务厅与王座厅。”这是安兹的底线——信任可以暂时恢复，但监视必须如影随形。他看着雅儿贝德攥紧剑柄的手，补充道，“北方战线的骷髅军团需要您的指挥才能，卡罗游击队的残部也在那边活动，这是您的战场，也是……证明。”\n雅儿贝德突然笑了，那笑容里混杂着狂热与隐忍：“告诉陛下，我会让那些反抗者明白，背叛魔导王的代价。”她转身披上黑色战甲，甲胄的金属光泽与她眼底的火焰相映，“至于联络官——让他们尽管盯着，我会让他们看到，什么是真正的忠诚。”\n消息传到前线时，正与圣杯王国鏖战的亡灵军团沸腾了。士兵们还记得雅儿贝德任宰相时的铁腕，更期待这位曾让敌军闻风丧胆的指挥官带来转机。而在柏林的安兹，看着塞巴斯·蒂安呈上的“监视方案”——由迪米乌哥斯特意设计的“忠诚之眼”魔法阵，能实时传回雅儿贝德方圆百米内的对话——骨指无意识地敲击着桌面。\n塞巴斯·蒂安在政务厅的地图前标注着北方战线的补给线，心中清楚这场妥协的风险：雅儿贝德的偏执可能让战事升级，但眼下的魔导国确实需要她的锋芒。他提笔在报告末尾写道：“以枷锁缚剑，剑可破敌，亦需防其反噬。”"
  WizardCountry.080.a: "当剑重新出鞘时，没人能确定它会先斩向敌人，还是再次伤及自身。"

  WizardCountry.081.title: "慈悲之名"
  WizardCountry.081.desc: "莱茵河沿岸的麦田里，魔法灌溉装置正均匀地喷洒着水雾，麦穗在阳光下泛着金黄。农夫们直起身擦汗时，总会望向东方——那里是纳萨力克大坟墓的方向，如今在他们口中，那座曾经象征恐惧的亡灵堡垒，成了“赐福之地”。“要不是魔导王陛下的粮食法案，今年的旱灾早就让我们饿死了。”老农夫海因茨抚摸着麦穗，皱纹里盛着笑意，“还有塞巴斯宰相，听说他亲自在议会里拍了桌子，才让骷髅农场主把三成收成低价卖给我们。”\n这样的对话在魔导国随处可闻。安兹・乌尔・恭的名字前，渐渐被冠上了越来越多的尊称——“慈悲之王”来自那些因“残障亡灵福利法案”保住工作的平民，“永恒的哲人王”则源于他（实则是塞巴斯）推行的“百年教育规划”。柏林的街头巷尾，孩子们唱着新编的歌谣：“骨王的目光照大地，银手套（指塞巴斯）带来面包香。”\n塞巴斯·蒂安的“深入人心”，藏在无数细节里。他会在民生委员会结束后，带着卫兵去贫民窟的面包店买两打黑面包，和店主闲聊“面粉涨价的影响”；会在处理政务时，突然暂停会议，让人把中暑晕倒的卫兵抬到阴凉处；甚至在审判一名偷窃骷髅零件的少年时，没有按律流放，而是判他去农场劳动抵罪，理由是“他的母亲还在等他回家”。这些事被魔法报纸《魔导回声》报道后，人们私下里开始叫他“好汉宰相”——这个带着旧德意志江湖气的称呼，比任何官方头衔都更显亲近。\n安兹的“出巡”成了最盛大的节日。当他的骨制马车驶过街道，民众不再跪地发抖，而是举着鲜花和写有“感谢陛下”的标语牌欢呼。有一次，一个小女孩挣脱母亲的手，跑到马车旁递上一束野菊，安兹僵硬地接过时，骨指不小心碰掉了花瓣，周围的人却齐声喊道：“陛下连花瓣都舍不得弄坏！”这一幕被画成油画，挂在市政厅最显眼的位置，标题是《慈悲的触碰》。"
  WizardCountry.081.a: "这位魔导王或许自己都不知道，他的每句废话都被解读成了深邃的真理。"

  WizardCountry.082.title: "魔导国的根基"
  WizardCountry.082.desc: "慕尼黑市政厅的公告栏前，围满了踮脚张望的市民。公告上的魔法字迹清晰地写着：“即日起，各区村长、街道管事等基层职务，由辖区内年满十六岁的居民投票选举产生，任期两年，可连选连任。”最下方盖着魔导国政务厅的印章，旁边还有一行小字——“最终候选人需经政务厅资格审核”。\n面包师施耐德揉着面团，耳朵却竖着听邻桌的议论。“听说了吗？以后选村长不用看谁和骷髅军官关系好了！”铁匠铺的学徒咬着麦饼，声音里满是兴奋，“我爹说，塞巴斯宰相在议会里说，‘离泥土最近的人，才懂草根的需求’。”施耐德笑着点头，想起去年冬天，正是街道管事克扣了救济粮，若当时能自己选管事，或许邻居家的孩子就不会饿肚子了。\n塞巴斯·蒂安坐在政务厅的橡木桌前，翻阅着第一批试点区域的选举章程。白手套下的指尖划过“候选人资格”一栏——排除了有暴力犯罪记录者、与反抗组织有牵连者，其余只要能读写、在辖区居住满三年的居民均可参选。他特意加了一条：“允许候选人公开宣讲施政理念，但禁止攻击对手或魔导国体制。”\n“大人，”秘书官递上一份报告，“保守派的巫妖们又在抱怨，说‘让凡人投票是对魔导国权威的亵渎’。”\n塞巴斯·蒂安端起红茶，热气模糊了他温和的眉眼：“告诉他们，基层官员是给民众办事的，民众自然有权利选自己信得过的人。”他放下茶杯，声音里多了几分坚定，“何况最终审核权还在我们手里，这不是放任，是让秩序扎根在民意里。”\n选举日当天，魔法投票箱前排起了长队。穿着围裙的农妇、扛着工具的工匠、甚至拄着拐杖的老人，都郑重地将写有候选人名字的羊皮纸投进去。有个老裁缝不识字，就让旁边的识字先生念出候选人的名字，选了那个承诺“修好多孔石桥”的木匠。这一幕被《魔导回声》的记者拍下，标题是《选票上的信任》。"
  WizardCountry.082.a: "民主，或许比任何魔法都更能巩固统治的根基。"

  WizardCountry.083.title: "万族共居的魔导画卷"
  WizardCountry.083.desc: "柏林中央集市的石板路上，蒸汽与魔法交织的暖雾里，不同肤色、不同形态的身影摩肩接踵。这是魔导国统治的第十五个新年，集市入口的拱门挂着用七种语言写的“欢迎”横幅——德语的黑体、中文的毛笔字、俄语的圆体，还有精灵语的藤蔓纹、妖怪语的符文，在魔法灯光下泛着柔和的光。\n卖腌黄瓜的俄国大叔伊万，正用带着口音的通用语和买茶叶的中国商人讨价还价。他摊位旁的天狗少女展开报纸，头版印着安兹的新年致辞，标题用四种文字写着“共存即力量”；穿花裙的非洲兽耳娘推着水果车，车厘子和芒果堆成小山，她身后的美洲精灵正用藤蔓编织的篮子装草莓，两人时不时笑着交换水果品尝。\n街角的面包房里，德国师傅卡尔的烤箱里飘出黑面包的香气，旁边的蒸笼里却是中国学徒做的肉包。“要十个肉包！”来买早餐的巫妖官员用骨指敲着柜台，他的魔法袍上别着枚“民生委员会”的徽章——这个由人类、妖怪、亡灵共同组成的机构，如今已能熟练调解“精灵嫌骷髅走路太响”“兽耳娘觉得巫妖说话太冷”之类的小纠纷。\n塞巴斯·蒂安穿着便装走在集市上，白手套早已摘下，正弯腰接过兽耳娘递来的芒果。“宰相大人！”卖报的天狗少女认出了他，递上一份特刊，上面印着各地的“和谐故事”：莫斯科的冰雕节上，俄国法师和亡灵巫妖合作造出了会发光的冰城堡；南京的夫子庙里，人类学者和幻想乡的妖怪们一起修订古籍；非洲部落的兽耳娘将魔导国的种子带回草原，收成比往年翻了三倍。\n“这些，才是陛下想要的世界吧。”塞巴斯·蒂安看着特刊上安兹的画像——那幅被无数人供奉的《慈悲的凝视》，画中的骨王正低头看着一群嬉戏的孩子，有人类、有精灵、有带着小尖角的妖怪幼崽。"
  WizardCountry.083.a: "“乌托邦” 不再是虚无的幻想。"

  WizardCountry.084.title: "银匙与围裙的假日"
  WizardCountry.084.desc: "[Getyear]年的初夏假日，柏林的阳光带着恰到好处的温度，透过菩提树的叶隙洒在石板路上。塞巴斯·蒂安推着一辆藤编购物车，步伐稳健地跟在琪雅蕾身后，白色衬衫的袖口挽起，露出手腕上一枚简洁的银戒——与琪雅蕾指间那枚刻着蔷薇花纹的戒指，是同一家老字号银铺的定制款。\n“塞巴斯，你看这个！”琪雅蕾在面包店的橱窗前停下，指着刚出炉的肉桂卷，浅棕色的卷发在阳光下泛着柔和的光。她的围裙口袋里露出半截购物清单，上面用娟秀的字迹写着“香草、黄油、新鲜草莓”——都是塞巴斯·蒂安最爱吃的甜点原料。\n塞巴斯·蒂安走上前，自然地替她拂去肩头的面包屑，银戒在动作间闪过微光：“要两打吗？下午可以配伯爵茶。”他记得琪雅蕾喜欢在面团里加一点橙皮碎，就像记得自己衬衫的袖口必须扣到第三颗纽扣那样清楚。\n购物车渐渐装满了：蔬菜摊的番茄带着晨露，肉铺的上等牛排被仔细包好，香料店的迷迭香散发着清香。在乳制品柜台前，穿着白大褂的兽耳娘店员笑着打招呼：“塞巴斯·蒂安先生，琪雅蕾女士，今天还是要低脂奶油吗？”\n“是的，谢谢。”琪雅蕾接过奶油盒，指尖的蔷薇戒指与店员的毛茸茸爪子轻轻碰了一下，“他最近在研究新的酱汁配方，说要少放些黄油。”塞巴斯·蒂安在一旁无奈地笑笑——其实是琪雅蕾上次体检时被医生提醒“注意热量”，他便默默改了食谱。\n回家的路上，经过跨种族社区的小广场，一群孩子正在追逐嬉戏。有个跌跌撞撞的吸血鬼幼崽扑过来，塞巴斯·蒂安伸手稳稳接住，银戒蹭到幼崽的尖牙，惹得小家伙咯咯直笑。琪雅蕾弯腰替幼崽擦掉嘴角的奶渍，戒指上的蔷薇花纹在阳光下格外清晰：“慢点跑呀，小心摔疼。”\n他们的家在柏林老城区的一栋公寓楼里，窗台上摆着琪雅蕾种的多肉植物，门廊挂着两人的合照——照片里，塞巴斯·蒂安穿着燕尾服，琪雅蕾穿着淡蓝色的连衣裙，指间的戒指在教堂的光晕里闪着幸福的光。\n厨房里，琪雅蕾系上印着小草莓图案的围裙，站在料理台旁洗草莓。塞巴斯·蒂安则从餐具柜里取出一对银质餐叉，叉柄上刻着彼此名字的首字母缩写。当他开始煎牛排时，琪雅蕾从身后轻轻抱住他，下巴抵在他的肩胛骨上，戒指的凉意透过衬衫传来：“今天的酱汁，要放你上次说的那种黑胡椒吗？”\n“嗯，”塞巴斯·蒂安侧过头，鼻尖蹭了蹭她的发顶，“还有你喜欢的百里香，已经泡在橄榄油里了。”煎锅滋滋作响，牛排的香气混着香草的味道弥漫开来，阳光透过厨房的窗户，在两人交叠的手上投下温暖的光斑——一枚简洁的银戒，一枚带蔷薇花纹的戒指，紧紧靠在一起，就像它们的主人那样。\n午后的红茶时间，琪雅蕾端来刚烤好的草莓挞，挞皮边缘烤得金黄。塞巴斯·蒂安拿起餐叉，却被她轻轻按住手：“等一下。”她从首饰盒里取出一枚小巧的胸针，别在塞巴斯·蒂安的衣襟上——那是用他修剪下来的银戒边角料，打磨成的一片迷你蔷薇叶。\n“这样就完美了。”琪雅蕾满意地看着自己的作品，指尖的戒指与胸针的银光相互辉映。塞巴斯·蒂安看着她眼底的笑意，突然觉得退休后的日子比想象中更像一首舒缓的协奏曲——没有政务厅的报表，没有魔法会议的紧张，只有银匙碰击瓷杯的轻响，和围裙上淡淡的面粉香。"
  WizardCountry.084.a: "两枚戒指闪着温柔的光。"

  WizardCountry.085.title: "300年后的相遇"
  WizardCountry.085.desc: "[GetYear]年的初夏，魔导国的蒸汽列车正穿行在易北河沿岸的平原上。车窗外，机械化农场的骷髅收割机在黑森林边缘的麦田里划出整齐的轨迹，莱茵河畔的魔法信号塔闪烁着蓝光，魔导国的疆域仍局限于德国核心地区，从勃兰登堡的柏林到巴伐利亚的慕尼黑，边境线上的符文结界清晰地分隔着“秩序之地”与外部世界，而遥远的匈牙利平原上，恰赫季斯城堡的废墟仍是未被触及的神秘地带。\n安兹坐在列车的私人车厢里，面前摊着[country_leader_name]刚送来的《跨种族融合报告》：人类与妖怪的通婚率在核心区内提升至12%，来自非洲的兽耳娘农技员在萨克森州改良出耐寒的魔法麦种，连最保守的巫妖群体都开始参与柏林“亡灵-人类育儿交流班”。“这就是……在方寸之地搭建的乌托邦雏形吗？”他用骨指敲着报告上的地图——魔导国的疆域像块精心打磨的宝石，虽小巧却璀璨，突然觉得魔法通讯器震动起来。\n“陛下，前方侦察队传来急报。”塞巴斯的声音带着一丝凝重，“他们在一座荒废的塔楼地基下发现了一个存活的生命信号，魔法特征与‘维度残余’吻合，但……是吸血鬼。”\n三天后，安兹站在城堡临时搭建的魔法隔离场内。考古队的巫妖们正用符文加固着临时结界，防止未知能量溢出。当最后一道石门被魔法撬开时，一股陈旧的血腥味扑面而来——石台上，躺着一个被水晶棺封印的少女。\n金色的长发铺在棺底，像凝固的夜色，红色瞳孔紧闭着，唇上还残留着干涸的暗红。水晶棺的内壁刻满了巴托里家族的纹章。\n“她被封印了三百二十五年。”[country_leader_name]的声音从身后传来，手中捧着历史学家的考证报告，“1611年巴托里夫人被处刑后，她游荡到此处后魔力耗尽，有神秘人用维度魔法将她封存，躲过了后来的种种事件，直到最近封印能量耗尽才会苏醒。”他补充道，“而解封的时间差不多到了。”\n安兹的骨指轻轻触碰水晶棺，棺壁瞬间浮现出魔法影像：1610年的冬夜，年幼的琪诺被母亲的仆人推进密室，看着那些透明的影子吞噬整个城堡，最后在“睡吧，等一个不惧怕你的世界”的低语中陷入沉睡。\n水晶棺缓缓打开，琪诺猛地睁开眼，金色瞳孔在看到安兹的骨身时骤然收缩，尖细的犬齿刺破嘴唇：“你是……什么东西？”她的声音带着时空错位的茫然，环顾四周的魔法设备和穿着魔导国制服的研究员，突然颤抖起来，“这里是……地狱吗？”\n安兹身边的护卫立刻做好战斗准备，[country_leader_name]也穿上了战斗装备，而安兹却太守示意他们解除武装。“这里是魔导国，1936年。”安兹后退一步，让巫妖研究员递上一杯泛着红光的营养剂——这是魔导国为境内吸血鬼特制的“无害血液替代品”，“我是安兹・乌尔・恭，魔导国的魔导王。”\n琪诺盯着那杯营养剂，又看向安兹身后的[country_leader_name]、旁边记录数据的兽耳娘研究员——她认得那对毛茸茸的耳朵，是在母亲的旧画册里见过的“非人种族”。“吸血鬼……可以在你的国家活着？”她的声音里带着难以置信，就像听到太阳从西边升起。\n“当然。”安兹的骨手示意她看向隔离场外，那里停着魔导国的飞艇，舱门敞开着，能看到里面坐着几个长着小尖牙的吸血鬼——他们是随队的医学顾问，“在魔导国，种族从来不是评判‘存在价值’的标准。哪怕我们的疆域只够覆盖德国核心区，这份包容也不会打折扣。”他看着琪诺，突然想起自己刚来到这个世界时，人类见了他的骨身就颤抖的模样——他们都是被世界排斥的异客，却在这一刻跨越了三个世纪相遇。"
  WizardCountry.085.a: "欢迎来到安兹·乌尔·恭魔导国"

  WizardCountry.086.title: "与琪诺同行"
  WizardCountry.086.desc: "按照正常情况，安兹一定会让NPC们将这位300年前的吸血鬼关押起来做研究之类的，但是今天他总有股奇怪的感觉驱使着他，去见这位“琪诺”一面，这股感觉不是来自安兹·乌尔·恭，不是莫莫伽，而是作为铃木悟。\n回去的飞艇在魔导国的上空，琪诺趴舷窗上，看着下方逐渐靠近的符文结界——那道闪烁着蓝光的屏障内，骷髅技工驾驶的飞艇与人类的马车在同一条空中航道上有序穿行，巴伐利亚的村庄里，人类农夫正和妖怪们一起晾晒谷物。\n“她们……不怕我？”她摸着自己的尖牙，想起母亲说过“人类只会用木桩和火焰招待我们”。\n“三年前，民生委员会刚通过《吸血鬼权益保障法》。”[country_leader_name]递给她一本画册，里面是柏林医院的吸血鬼医生在抢救人类患者、汉堡学校的吸血鬼教师给各族孩子上课的照片，“您看，这位叫伊莎贝拉的吸血鬼女士，还是去年的‘魔导国模范公民’，她的诊所就在柏林墙内第三街区。”\n琪诺的手指抚过照片上伊莎贝拉的笑脸，突然抬头看向安兹：“你为什么要做这些？在这么小的土地上，让人类和怪物和平共处……这不可能。”\n“没什么不可能的。”安兹的骨喉里传出低沉的笑声，“我和你一样，都曾是被世界排斥的‘异类’。但我发现，疆域的大小不重要，重要的是在自己能掌控的土地上，种下包容的种子。”\n……\n在柏林的日子里，琪诺成了安兹的“特殊顾问”。她凭借童年记忆，帮助研究员还原了1610年的维度掠夺事件，而安兹则带她走遍了魔导国的核心区：在汉堡的跨种族餐厅里，她第一次和人类一起吃用魔法制作的“无血牛排”；在慕尼黑的民生委员会分部，她看着兽耳娘代表为吸血鬼争取“夜间工作补贴”；甚至在安兹的书房里，她见到了那幅传遍核心区的《慈悲的凝视》——画中的骨王正低头看着一群嬉戏的孩子，其中就有个长着小尖牙的吸血鬼幼崽。\n“我母亲追求不老，”琪诺突然说，金色瞳孔映着窗外柏林的万家灯火，“但你好像做到了更了不起的事——在这片有限的土地上，让我们不必证明什么，就能好好活着。”安兹的骨眉动了动：“我的梦想，是让所有‘不同’都能在可控的秩序里被接纳，哪怕现在只有德国这么大。”\n“那我想留下。”琪诺站起身，长袍下摆扫过地毯上的魔导国地图——那上面用金色标记着各个跨种族社区，“我熟悉那些被歧视的痛苦，也懂如何让同类放下戒备。让我在柏林的吸血鬼社区工作吧，告诉那些蜷缩在阴影里的同胞：”"
  WizardCountry.086.a: "“魔导国的光，哪怕只照亮德国，也足够温暖我们了。”"

  WizardCountry.087.title: "异世的记忆"
  WizardCountry.087.desc: "魔导国的星象台顶，魔法望远镜正对准猎户座的星云。安兹与琪诺并肩站在观测台前，夜风掀起他们的衣袍，带着易北河的水汽。三天前，一场突如其来的维度风暴席卷了柏林，风暴中心的两人同时陷入昏迷，醒来后，脑海里都多了些不属于这个世界的记忆——繁茂的森林、闪烁着蓝光的魔法阵、冷兵器与热兵器的交接、还有一群围着篝火欢笑的身影。\n“你也……记起来了？”琪诺的声音带着颤抖，红色瞳孔映着星云的微光，金色长发被风吹得凌乱。安兹的骨手抚上自己的肋骨，那里仿佛还残留着被乌尔班大炮轰飞的钝痛。他想起那个明明比自己弱小但总是想站在自己前面保护自己的身影—那是另一个世界线，安兹来到了1611年的地球，与琪诺展开的伟大冒险，他们走遍了五湖四海、见证了三十年战争的血腥与残酷、在路易十四的宫廷中学习贵族礼仪、跟随俄国的远征队开拓极北的荒地、走过了饿殍遍地的明末乱世、乘着明朝遗民的船只前往未开发的“新大陆”……最后兜兜转转300余年，在对非人种族最为友好的幻想乡定居下来。\n“在圣杯殖民队和原住民的冲突中，你为了捡一根树枝，硬是让我扛了三分钟的伤害。”安兹的骨喉里传出低笑，红宝石眼眸在夜色中亮得惊人，“结果做成法杖绑定后你才发现，属性还没商店货好。”琪诺猛地转身，红色瞳孔里泛起水汽：“那时候你说‘算了，下次再找更好的素材’，却偷偷用你从Yggdrasill带过来的珍贵材料给我做了把更好的！”她抬手按住嘴唇，那些被时间掩埋的记忆如潮水般涌来——旅行路上的吐槽声、聚会时的披萨味、还有那个刻着“安兹・乌尔・恭”字样的公会戒指，曾被她弄丢过三次，每次都是这个骷髅法师耐着性子帮她找回来。\n安兹从储物空间里取出一个丝绒盒子，打开时，一枚暗金色的戒指在月光下泛着哑光。戒指内侧刻着复杂的符文，正是“安兹・乌尔・恭”公会的标志，安兹用魔法在边缘刻下了一道细微的小蔷薇，说“这样就能分清哪个是我的了”。“那时候你总说，自己是孤儿，安兹·乌尔·恭就是你的家。”安兹将戒指递到琪诺面前，骨指因用力而微微发颤，“现在，这个家还缺一个女主人。”\n琪诺的指尖触到戒指的瞬间，熟悉的温热感传遍全身——就像游戏里戴上公会戒指时的提示音在心底响起。她想起自己临终前躺在病床上，握着手机看着公会群最后的消息：“等‘血色蔷薇’康复，我们再去环球旅行！”却没想到，跨越两个世界，这个约定竟以这样的方式实现。\n“纳萨力克的第四十三把钥匙，一直为你留着。”安兹看着她将戒指戴在无名指上，与那枚蔷薇纹银戒并排闪耀，“琪诺，欢迎回家。”\n琪诺突然笑了，笑着笑着眼泪就掉了下来。她踮起脚尖，轻轻抱住安兹的骨身，尽管冰冷的触感硌得慌，却比任何怀抱都更让她安心："
  WizardCountry.087.a: "“会长，这次副本，我再也不会划水了。”"

