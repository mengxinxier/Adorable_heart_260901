  Undead_economy_modifier: "纳萨力克亡灵经济"
  Undead_economy_desc: "§L纳萨力克亡灵经济是伟大的魔导国创造出来的一种具有魔导国特色的经济模式。\n\n纳萨力克亡灵经济的精髓在于，大量使用由纳萨力克创造出的无智能的骷髅来从事机械重复而简单的工作，从而大量解放生产力，使得更多的人可以投入到其它工作中。§!"
  Undead_economy_TT: "§Y如果我们不能及时消化因为我们的经济模式产生的失业人口，我们的社会将会遭受§R严重的危机§!！§!"
