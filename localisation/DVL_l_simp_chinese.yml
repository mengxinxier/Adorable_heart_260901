  WizardCountry.096.title: "独尊的信仰"
  WizardCountry.096.desc: "纳萨力克地下大坟墓的第六层，曾经废弃的竞技场已被改造成宏伟的神殿。黑曜石地面铺着金线织就的地毯，直达祭坛中央——那里矗立着安兹・乌尔・恭的等身骨像，眼眶中镶嵌的红宝石在魔法灯光下流转着神性的光晕。雅儿贝德站在祭坛前，银色长发如瀑布般垂落，宰相长袍外罩着一件绣满骷髅与十字架纹样的教袍，血色瞳孔中燃烧着狂热的火焰。\n“吾主安兹，永恒的创世神，万族唯一的救赎。”她举起双手，声音透过魔法扩音传遍神殿，回荡在跪拜的信徒耳中。这些信徒有纳萨力克的守护者，有魔导国的人类官员，甚至有被征服地区的异族——他们的额头都烙着一个微型骨纹印记，这是“安兹教”的信徒标识。\n三个月前，迪米乌哥斯最终选择了沉默。当他转身离开竞技场的那一刻，雅儿贝德便知道，自己可以毫无顾忌地将“守护”推向极致。她以“巩固魔导国信仰”为名，颁布了《国教确立法案》，宣布“安兹・乌尔・恭教”为魔导国唯一合法宗教，任何质疑安兹神性的言行，都将被视为亵渎。\n神殿的侧厅里，一排穿着白袍的祭司正在抄写《安兹圣典》。书页上，雅儿贝德亲自撰写的文字赫然在目：“吾主自虚无中诞生，以骨身承载世界的秩序；吾主的目光所及，皆是应许之地；凡追随吾主者，得永生；逆吾主者，魂飞魄散。”这些内容被刻在魔导国的每一座城镇广场上，由骷髅祭司每日诵读。\n“宰相大人，”一名祭司上前禀报，“新征服的地区，有人类贵族拒绝拆除旧神雕像，是否按律处以‘净化之火’？”\n雅儿贝德抚摸着骨像的指尖，语气平静却带着不容置疑的威严：“烧。”她转身看向窗外，那里的天空正飞过一队刻着骨纹的飞艇，“告诉他们，只有安兹大人配得上仰望。那些旧神的泥像，连给吾主的骨靴提鞋都不配。”\n迪米乌哥斯站在神殿的阴影里，看着这一切。他遵守了与雅儿贝德的妥协，却没想到她会将安兹的“统治”扭曲成“神性崇拜”。当他看到马雷捧着《安兹圣典》虔诚祈祷，亚乌菈在骨像前献上亲手捕获的魔兽时，金色瞳孔中闪过一丝不安。"
  WizardCountry.096.a: "安兹在王座上看着魔法投影，骨手微微收紧"

  WizardCountry.097.title: "散落在土地上的“纳萨力克”"
  WizardCountry.097.desc: "魔导国的疆域地图上，红色的标记正以惊人的速度蔓延。每块新征服的土地被标红的次日，总会有一道黑色的身影带着卫队降临——那是雅儿贝德亲自挑选的守护者，将以“总督”之名，在这里复刻纳萨力克的秩序。\n“夏提雅总督，您的‘新纳萨力克’已准备就绪。”巫妖副官躬身禀报，指向东欧平原上拔地而起的黑色堡垒。堡垒的布局与纳萨力克第三层如出一辙，甚至连地牢的锁链都复刻了大坟墓的魔法符文，唯一的不同是，堡垒广场中央矗立的不是安兹的骨像，而是夏提雅并肩而立的雕像。\n这是雅儿贝德的“新纳萨力克计划”。自建立安兹教后，她便开始将守护者们“外派”：夏提雅掌管东欧的森林资源，科塞特斯镇守北方的冰原防线，迪米乌哥斯则坐镇西欧的魔法工业区。每个总督区都按照纳萨力克的层级结构建造堡垒，推行完全一致的法律——对安兹的信仰度低于80%者，不得参与政务；敢直呼安兹名讳而非“吾主”者，处以鞭刑。\n“那些人类贵族还在偷偷祭拜旧神？”夏提雅的靴尖碾过地上的旧神徽章，身后的吸血鬼卫队发出低吼。她按照雅儿贝德的指示，将所有拒绝皈依安兹教的平民驱赶到“净化营”，那里的骷髅祭司会日复一日地播放《安兹圣典》的诵读声，直到他们眼神空洞地喊出“吾主万岁”。\n在西欧的总督府里，迪米乌哥斯正审核着“信仰纯度报表”。报表上，每个城镇的“安兹教教堂覆盖率”“信徒日均祈祷时长”都被量化成数字，低于标准线的镇长名字旁，已被打上了红色的“替换”标记。“雅儿贝德大人的意思是，”他对副官说，“每个总督区都该是纳萨力克的影子，而影子里，容不下任何杂音。”"
  WizardCountry.097.a: "帝国将永垂不朽。"

  WizardCountry.098.title: "齿轮与祭坛"
  WizardCountry.098.desc: "魔导国的魔法地图上，不同颜色的区域如齿轮般咬合运转。雅儿贝德站在地图前，指尖划过代表“幻想乡牧场”的翠绿色区域，那里的魔法屏障内，被驯化的妖怪正被有序饲养——天狗的羽毛用于制作飞行卷轴，河童的鳞片是防水符文的核心材料，连最温顺的妖精，也会定期被采集翅膀上的粉尘，作为“安兹教圣典”的防伪颜料。\n“本周的妖怪材料合格率提升了3%。”负责牧场的副总督（雅儿贝德亲自挑选的人类祭司）递上报表，声音里带着敬畏。牧场中央的安兹雕像前，每天都有被选中的妖怪被献祭——不是为了取材料，而是雅儿贝德定下的规矩：“用最虔诚的祭品，换取吾主对材料品质的祝福。”\n往北，极北度假区的冰雕城堡正迎来一批批魔导国的“高阶信徒”。这里由科塞特斯管辖，复刻了纳萨力克第五层的冰原景观，甚至连服务员都穿着模仿冰原魔兽的制服。游客们可以在“安兹圣像滑道”上滑雪，在“骨纹温泉”里浸泡，每个项目的终点都立着一块牌子：“感谢吾主恩赐的闲暇”。而度假区的地下，是另一番景象——被捕获的反叛者正在冰牢里劳作，为温泉提供源源不断的地热能量。\n中东的石油区黑烟滚滚，巨型骷髅挖掘机正将黑色的原油灌入魔法储罐。迪米乌哥斯设计的“信仰筛选机制”在这里被发挥到极致：石油工人的工资直接与“每日祈祷次数”挂钩，祈祷最虔诚的前10%，能获得额外的“安兹教圣餐”（掺了微量魔法药剂的面包）；而完不成祈祷指标的人，会被扔进原油提炼厂的最低层，成为“燃料的一部分”。\n东南亚的橡胶园里，马雷操控着藤蔓，将橡胶树的汁液引流进刻着骨纹的容器。这里的工人大多是被征服的原住民，他们的孩子从小就要背诵《安兹圣典》中“服从即美德”的章节，能一字不差背完的，才有资格进入“橡胶管理学校”，否则只能一辈子在园里割胶。马雷的雕像立在橡胶园中央，基座上刻着雅儿贝德的题词：“连植物都懂得向吾主低头，何况凡人？”"
  WizardCountry.098.a: "为吾主燃烧！"

  WizardCountry.099.title: "福音笼罩的核心之地"
  WizardCountry.099.desc: "柏林的清晨，第一缕阳光穿透薄雾，先照亮的不是市政厅的尖顶，而是遍布街巷的安兹圣像。骨像的眼眶中，魔法红宝石反射着光，将“安兹・乌尔・恭”的名字投映在每家每户的窗纸上——这是雅儿贝德推行的“晨光福音”计划，让魔导国核心区的人们从睁眼起，就沐浴在“吾主的凝视”中。\n面包店的老板娘在烤炉前划着骨纹十字，嘴里念着《安兹圣典》的第一章：“吾主以骨身撑起天空，赐我们面包与炉火。”她的面包袋上印着缩小的安兹像，每个买面包的顾客都会先对着画像鞠躬，否则就算付了钱，老板娘也会说“吾主不接受无礼者的供奉”。\n街头的孩子们唱着新编的圣歌，歌词是雅儿贝德亲自审定的：“黑旗飘，骨纹耀，安兹陛下保我们吃不饱……哦不，是吃得饱！”领头的男孩举着小骨旗，跑过挂着“感谢吾主赐下蒸汽机车”横幅的车站——那里的列车员制服领口，都绣着微型的安兹徽章。\n每周三的“福音宣讲会”上，祭司们会站在魔法讲台上，展示雅儿贝德命人制作的“奇迹影像”：骷髅军团击退入侵者时的“神勇”，魔法农田丰收时的“恩赐”，甚至连安兹某次无意识挠头的动作，都被解读为“吾主在思考如何拯救世人”。台下的信徒们挥舞着骨纹手帕，齐声高喊“安兹万岁”，声音能掀翻市政厅的屋顶。\n“你家汉斯上周被选为‘模范信徒’了？”菜市场里，提着篮子的妇人凑在一起闲聊，语气里满是羡慕，“听说能去纳萨力克外围参观呢！”被提到的汉斯是个邮差，因连续三个月在送信时对每个安兹圣像鞠躬，被雅儿贝德亲自授予了“福音传播者”勋章，勋章的背面刻着“核心区的荣耀”。"
  WizardCountry.099.a: "吾主的荣光之下，不需要杂音，只需要回响。"

  WizardCountry.100.title: "吸血姬的接力"
  WizardCountry.100.desc: "[GetYear]年深冬，柏林政务厅的壁炉里燃着魔法火焰，将塞巴斯的影子投在墙上，与窗外飘落的雪花重叠。琪诺坐在对面的扶手椅上，指尖捏着温热的血酒杯子——这是她来到魔导国的第二年，银紫色长发已梳理得整齐，金色瞳孔里的戒备被温和取代，只是谈及“基层选举的新难题”时，语气仍带着一丝不确定。\n“人类选民对吸血鬼候选人的接受度，比预期低17%。”琪诺铺开民生委员会的统计报表，上面用不同颜色标注着各选区的投票倾向，“巴伐利亚的农夫们说，‘让吸血的怪物管粮仓，夜里都睡不安稳’。”\n塞巴斯放下手中的红茶，白手套轻轻按在报表上：“这不是你的问题，是恐惧的惯性。”他看着琪诺，银色发丝在火光中泛着柔和的光，“我推行基层民主时，巫妖们也曾说‘凡人不配碰权力’，但现在呢？他们会主动向人类村长请教农活。”他顿了顿，突然话锋一转，“琪诺小姐，你觉得魔导国的‘民主’，最终该走向何方？”\n琪诺愣住了。她想起安兹书房里那张《万族议会构想图》——上面画着人类、妖怪、亡灵、吸血鬼围坐议事的场景，而塞巴斯此刻的眼神，像在确认她是否看懂了那幅图的深意。“应该……让每个种族都能握住自己的方向盘，而不是只在副驾驶座上提建议。”她的声音很轻，却带着不容置疑的坚定，“就像安兹陛下说的，‘秩序不是独奏，是交响乐’。”\n塞巴斯笑了，那是琪诺第一次见他露出如此释然的表情：“我担任宰相三十年，做的不过是给交响乐定调。但真正能让不同乐器和谐共鸣的，是懂每种声音的人。”他站起身，走到窗边，看着外面的跨种族社区，“你比我更懂‘被排斥者’的渴望，也比我更清楚如何让他们相信‘选票能改变命运’。”\n三日后的王座厅，魔法灯火比往日更明亮。塞巴斯穿着笔挺的燕尾服，站在安兹的骨座前，手中捧着宰相印玺，白色手套在灯光下泛着光泽：“陛下，臣恳请辞去宰相一职。”\n安兹的红宝石眼眸微微睁大，骨指停止了敲击扶手：“塞巴斯，这是……”\n“魔导国的民主尝试，需要新的领航者。”塞巴斯的声音平稳而郑重，“基层选举已步入正轨，但跨种族权力共享的瓶颈，非臣所能突破。”他侧身让出一步，看向站在厅侧的琪诺——她今日穿着民生委员会的制服，银紫色长发束在脑后，手中握着那份“吸血鬼候选人支持率分析”，“琪诺小姐在过去两年里，成功推动柏林吸血鬼社区与人类邻居共建了三座面包房，调解了十七起种族纠纷，更重要的是……”他顿了顿，目光转向安兹，“她比任何人都懂得，‘民主’不是制度，是让每个灵魂都敢开口的勇气。”\n琪诺猛地抬头，金色瞳孔里满是震惊：“塞巴斯大人，我……”\n“陛下，”塞巴斯打断她，将印玺向前递出，“琪诺小姐是最合适的人选。她能让人类相信‘吸血鬼不会偷粮仓’，能让巫妖接受‘妖怪也能管魔法法案’，这正是您‘万族乌托邦’最需要的力量。”\n安兹看着塞巴斯坚定的眼神，又看向琪诺紧攥报表的手——那上面有她用红笔写的批注：“恐惧=未知×距离，解决方案：让候选人挨家挨户送面包”。他突然想起三十年前，塞巴斯接任宰相时，也是这样带着“让秩序呼吸”的信念。\n“琪诺，”安兹的骨喉里传出低沉的声音，“你愿意接过这个担子吗？”\n琪诺深吸一口气，走到厅中央，接过那枚冰凉的印玺。当印玺触到掌心时，她仿佛看到了1610年的母亲、1936年的自己，以及无数个在恐惧中蜷缩的灵魂。“我愿意。”她的声音清亮，带着跨越三个世纪的重量，“我会证明，吸血姬不仅能在阳光下行走，还能带着所有‘异类’，一起走向更平等的明天。”"
  WizardCountry.100.a: "这不是权力的真空，而是民主的进阶"

