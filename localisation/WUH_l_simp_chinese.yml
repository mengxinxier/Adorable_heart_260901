  wuhan.1000.title: "洞庭惊变 · 九省抉择"
  wuhan.1000.desc: "洞庭湖畔的雨夜终究没能压住滚沸的暗流。天地盟强征官粮的举动彻底撕裂了湖广脆弱的平衡：玄天邪帝与孙传芳在长沙调兵戒严，准备借铁腕彻底清算两湖异己；南宫问天率神兵义军与四大世家连夜进逼，南宫问雅与东方铁心也各自站在命运的十字路口；而在武汉黄鹤楼上，青衫客卿望轻捻黑子，正注视着整片华中棋盘的崩裂。九省通衢，只容得下一位执掌者。"
  wuhan.1001.wentian_unify: "由南宫问天执掌大局，神兵振兴、逐鹿中原！"
  wuhan.1001.wentian_defend: "由南宫问天主持湖广，守土安民、以待天时。"
  wuhan.1001.wenya: "推举南宫问雅主政，以仁心抚平乱世创痕。"
  wuhan.1001.tiexin: "由东方铁心独立入主，整肃两湖军政。"
  wuhan.1001.tiandimeng: "玄天邪帝铁腕镇压，天地盟与旧督军府继续掌权！"
  wuhan.1001.wang: "百八十一子骤然收网——由「望」执棋代天，问鼎神州！"

