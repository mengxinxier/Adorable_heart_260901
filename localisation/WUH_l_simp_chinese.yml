 ##将领特质
  WUH_ul_lord_of_shenbing: "神兵之主"
  WUH_ul_lord_of_shenbing_desc: "神兵随他先行，将士循其旗号并肩推进。"
  WUH_ul_swift_thunder: "疾雷突击"
  WUH_ul_swift_thunder_desc: "雷声甫起，装甲纵队已越过敌军前哨。"
  WUH_ul_beiming_rock: "北冥磐石"
  WUH_ul_beiming_rock_desc: "从北境到江防，他的阵线经得住一轮又一轮冲击。"
  WUH_ul_nimble_scout: "轻灵斥候"
  WUH_ul_nimble_scout_desc: "大军尚未出营，她的斥候已探明了前路。"
  WUH_ul_iron_vanguard: "铁壁先锋"
  WUH_ul_iron_vanguard_desc: "最吃紧的阵地上，总能见到这支先锋。"
  WUH_ul_fort_grandmaster: "筑城宗师"
  WUH_ul_fort_grandmaster_desc: "他熟悉每一处山口，也知道该在哪里筑起工事。"
  WUH_ul_phoenix_marshal: "凤凰统帅"
  WUH_ul_phoenix_marshal_desc: "凤凰旗升起时，各路部队便如约会师。"
  WUH_ul_master_armorer: "铸兵大匠"
  WUH_ul_master_armorer_desc: "他熟悉兵工厂的炉火，也熟悉补给线上的每一处缺口。"
  WUH_ul_shadow_blade_raid: "影剑奇袭"
  WUH_ul_shadow_blade_raid_desc: "夜色掩住了剑锋，直到敌后响起第一声惊呼。"
  WUH_ul_phoenix_iron_cavalry: "凤凰铁骑"
  WUH_ul_phoenix_iron_cavalry_desc: "凤凰旗领着铁骑越过侧翼，直抵敌阵纵深。"
  WUH_ul_huguang_hegemon: "湖广霸主"
  WUH_ul_huguang_hegemon_desc: "督军的军令沿两湖传下，各营随旗推进。"
  WUH_ul_iron_regent: "铁血摄政"
  WUH_ul_iron_regent_desc: "摄政者在幕府定下行军日程，各路兵马据此进退。"
  WUH_ul_bloodthirsty_warlord: "嗜血军阀"
  WUH_ul_bloodthirsty_warlord_desc: "鼓声未歇，他已经催促各营发起下一轮冲锋。"
  WUH_ul_fierce_tiger_vanguard: "猛虎前锋"
  WUH_ul_fierce_tiger_vanguard_desc: "猛虎旗直指敌军最坚固的防线，先头部队紧随其后。"
  WUH_ul_terror_prince: "恐怖亲王"
  WUH_ul_terror_prince_desc: "他的名号先一步传入城中，守军彻夜难眠。"
  WUH_ul_gale_cavalry: "疾风骑兵"
  WUH_ul_gale_cavalry_desc: "尘烟还在远处，疾风的骑队已经掠过敌阵。"
  WUH_ul_yangtze_water_ghost: "长江水鬼"
  WUH_ul_yangtze_water_ghost_desc: "江雾一落，熟悉水道的舰艇便隐入夜色。"
  WUH_ul_soft_yet_firm: "柔中带刚"
  WUH_ul_soft_yet_firm_desc: "她肯退让一步，也能在决定胜负的阵地上寸步不移。"
  WUH_ul_fire_attack_expert: "火攻专家"
  WUH_ul_fire_attack_expert_desc: "炮声响彻夜空，坚固的堡垒也在火光中颤抖。"
  WUH_ul_treacherous_ambush: "诡诈多端"
  WUH_ul_treacherous_ambush_desc: "敌军以为自己抓住了机会，直到伏兵现身。"
  WUH_ul_toxin_warfare: "毒战专家"
  WUH_ul_toxin_warfare_desc: "丛林与沼泽间，连老练的斥候也畏惧那面蝎旗。"
  WUH_ul_blade_of_the_starving: "饿殍之刃"
  WUH_ul_blade_of_the_starving_desc: "饥民把欠下的账记在心里，满穗领他们穿过黑夜。"
  WUH_ul_chess_master: "执棋者"
  WUH_ul_chess_master_desc: "旁人还在争夺一城一地，望已看见了数步之后的棋局。"

