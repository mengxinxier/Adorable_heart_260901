 ##开局界面
  WUH_start_game_text: "§Y落子洞庭，问鼎九省§!"
  WUH_GATHERING_STORM_DESC: "湖广雄踞长江中游，扼守京汉、粤汉两条大动脉，汉阳炉火与洞庭粮仓曾令这里号称「九省通衢」。然而在天地盟旧军阀集团的高压铁腕之下，官仓紧闭、苛税如虎，极致的丰饶与极致的饥馑正在湘鄂大地撕裂出深不见底的裂痕。\n\n1936年，玄天邪帝与诸堂主仍把持着长沙与武汉的军政命脉，但世家义军、饿殍暗网与黄鹤楼畔那位执棋客卿都已悄然就位。一旦洞庭官仓的火星落下，湖广的旧秩序还能撑过几个雨夜？"
  WUH_his_page_01_title: "九省通衢"
  WUH_his_page_02_title: "洞庭暗流"
  WUH_his_page_03_title: "1936年的湖广"
  WUH_Country_History_Page_01: "湖广熟，天下足。雄踞长江中游的湘鄂两省，扼守京汉与粤汉铁路交汇之处，自古便是纵贯南北的「九省通衢」。汉口商埠的码头吞吐着华中半数商货，汉阳兵工厂与大冶铁厂的炉火更曾支撑起近代工业的脊梁。\n\n然而自1931年长江大水与连年兵燹之后，这片鱼米之乡却显露出最为荒诞的面貌：洞庭湖畔的良田年年产粮，官仓却在苛捐杂税与黑市倒卖下大门紧闭；汉阳的铁炉昼夜不息，工人却在十四小时的盘剥中积郁成怒。北方继续革命的风雷顺着铁道南传，东南割据的资本与军火沿江涌入，将华中腹地推向了一触即发的临界点。"
  WUH_Country_History_Page_02: "明面上，盘踞湖广的旧军阀集团§O天地盟§!仍以铁腕维系着统治——玄天邪帝与麾下诸堂主把持着军政要津、粮食黑市与秘密营地，以暴政与掠夺支撑着庞大而腐朽的战争机器；只是其麾下猛将§C东方铁心§!，对盟中残酷行径早已暗生疑窦。\n\n在高压高墙之外，三股暗流正各自蓄势：§S南宫问天§!穿梭于湘西与工匠行会之间，试图联合北冥、西门、东方、慕容四大世家，唤醒沉睡的神兵兽以救苍生；从北方大灾爬出的少女§R满穗§!，在洞庭难民营与贫民窟织就「穗火」暗网，誓要斩尽囤粮害民的「豚妖」；而在武昌与长沙的茶楼孤亭里，来历不明的青衫客卿§g望§!独坐打谱，早已将一百八十一枚暗子悄然洒向两省的粮仓、铁道与官邸。"
  WUH_Country_History_Page_03: "1936年，湖广的旧秩序已如绷至极限的弓弦。长沙城内戒严森严，督军府与天地盟诸堂口彼此倾轧；武汉三镇的工厂里，地下传单与罢工暗潮此起彼伏；岳阳与常德的官仓外，数十万逃荒流民在寒风中注视着高墙上的枪口。\n\n天地盟仍在筹划向外部倒卖官粮换取军火，世家武装在湘西深山整备兵马，满穗的刀刃已抵近运粮官的咽喉，黄鹤楼上的客卿亦将手指按在了棋盒之上。洞庭湖上空的乌云正在压低——一场足以改写华中乃至神州大势的风暴，已近在眼前。"
  WUH_route_guide_desc: "§Y湖广§!路线指南：\n\n§Y【开局局势：洞庭暗流】§!\n开局时湖广处于旧军阀§O天地盟§!的腐化铁腕之下，并同时背负饥荒流民、世家割据与幕后棋局等多重暗流。玩家在前期危机事件与博弈中的抉择，将引爆§Y【洞庭之变】§!并决定湖广未来的执政派系：\n\n一、§O天地盟（旧军阀霸权）§!\n-1.在开局危机中坚持铁腕镇压与搜刮军费，巩固玄天邪帝与诸堂口的统治。\n-2.核心玩法围绕权力平衡、战时压榨与以战养战展开；若未能控制§C东方铁心§!的离心倾向，她将在镇压饥民之际率部倒戈。\n\n二、§S神兵小将（南宫问天）§!\n-1.在开局危机中暗中放粮、庇护工匠并凝聚民间声望，在【洞庭之变】中推翻天地盟。\n-2.核心玩法围绕协调四大世家、唤醒四大神兵兽共鸣与军民协防展开；可接纳倒戈的§C东方铁心§!，亦有机会感化并联合§R满穗§!。\n\n三、§R饿殍燎原（满穗）§!\n-1.在开局危机中放任或推动底层暗网与饥民怒火爆发，借「屠豚」风暴彻底清算旧秩序。\n-2.核心玩法围绕温饱线与怨气值双轨博弈及流民暗网展开，后期可在§R赤色合流§!与§g寒刃守夜§!之间抉择。\n\n四、§g天下棋局（望）§!\n-1.通过夜访黄鹤楼与对弈事件提升客卿布局度，令§g望§!以幕后执棋者之姿接管湖广（或作为影子军师辅佐他派）。\n-2.核心玩法围绕一百八十一枚棋子的落子、连片成势、取势舍地与终极§Y【天下劫争】§!展开。\n\n§Y游玩提示§!：\n§L1.通用的旧式军队与畸形工业精神仍沿用中华通用改革决议，请合理统筹前期政治点数。\n2.四条核心路线与专属国策树将随后续更新逐步实装，敬请期待。§!\n"

####精神###
  WUH_thoroughfare_of_nine_provinces: "九省通衢，汉阳余晖"
  WUH_thoroughfare_of_nine_provinces_desc: "汉口商埠、汉阳兵工厂与纵横交错的铁路水运曾让这里成为华中命脉。尽管战乱与盘剥令昔日荣光蒙尘，但残存的工业底子与江汉水道，依然是各方势力势在必得的筹码。"
  WUH_tiandimeng_tyranny: "天地盟的腐化铁腕"
  WUH_tiandimeng_tyranny_desc: "玄天邪帝与麾下各路堂主把持着湖广的军政命脉。他们将官爵明码标价，纵容豪强搜刮民脂民膏；严酷的军法虽勉强维持着表面的秩序，但整座官僚机器早已从内部烂透。"
  WUH_dongting_famine_and_refugees: "洞庭饿殍与流民暗涌"
  WUH_dongting_famine_and_refugees_desc: "北方大灾与连年苛税将成千上万的逃荒者赶进了洞庭湖畔。官仓紧闭，粮价飞涨，饿殍枕藉的惨状在难民营里无声蔓延。有人在沉默中死去，也有人在黑暗里磨亮了杀向“豚妖”的刀。"
  WUH_fragmented_clans_and_sleeping_beasts: "诸家割据，神兵未醒"
  WUH_fragmented_clans_and_sleeping_beasts_desc: "在天地盟的枪口之外，南宫、北冥、西门、东方、慕容等地方豪族与民间武装仍各据一方。他们对旧军阀阳奉阴违，内部却也山头林立；至于传说中的神兵兽们，此刻仍在沉睡中等待真正的主人。"
  WUH_unseen_chessboard: "幕后客卿的棋盘"
  WUH_unseen_chessboard_desc: "武昌与长沙的茶楼里，近来常有一位来历不明的客卿独自对弈。没人知道他效忠于谁，但每当湖广政局行至死局，总有一枚恰到好处的暗子悄然落下，替局中人撕开一道口子——只是，落子的代价尚无人知晓。"

