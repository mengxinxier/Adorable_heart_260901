  WUH_deputy_sunchuanfang_deputy_leader_desc: "曾统辖东南五省的旧式军阀联帅，如今在湖广借天地盟的兵锋维系着南方军旧部与官僚体系的体面。他与玄天邪帝表面共掌两湖军政、互为倚重，实则各怀鬼胎——一旦洞庭局势生变，这位老谋深算的副总督绝不会坐以待毙。"

