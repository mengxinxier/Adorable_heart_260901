  GNS_Worker_Peasant_Alliance_idea_desc: "工人与农奴第一次坐在同一张桌子上，分同一块面包。"
  GNS_National_Electrification_idea: "全国电气化"
  GNS_National_Electrification_idea_desc: "电线翻过妖怪之山，穿过雾之湖，一直拉到旧地狱的入口。"
  GNS_Steel_Genbu_idea: "钢铁玄武"
  GNS_Steel_Genbu_idea_desc: "玄武之泽的每一寸土地都在轰鸣。它已是一块钢铁。"
  GNS_Lunar_Trial_idea: "月都审判"
  GNS_Lunar_Trial_idea_desc: "绵月姐妹的旧部被押上法庭。清算带来的不是正义，而是恐惧与情报。"
  GNS_Lunar_Reconciliation_idea: "月都和谈"
  GNS_Lunar_Reconciliation_idea_desc: "玄武之泽与月之都互换了使节。旧仇不必再提，技术可以先谈。"
  GNS_New_Genbu_idea: "新玄武之泽"
  GNS_New_Genbu_idea_desc: "新宪法生效的那天，玄武之泽第一次有了自己的国号。"
