#玄武之泽 · 事件
  GNS.000.t: "分裂余波"
  GNS.000.desc: "共和国的解体比所有人预想的都要快。当人间之里的议会还在为席位争吵时，郊外的河童已经关上了水闸——她们不打算再听命于任何人了。"
  GNS.000.a: "玄武之泽，从今天起自己管自己。"
  GNS.001.t: "玄武之泽的选择"
  GNS.001.desc: "临时委员会的桌上摆着两份计划。

一份是冈崎梦美带来的：以科学为国家之源，把三十年后的技术提前到今天，向宇宙、向深空、向一切未知索取答案。她说，玄武之泽不需要钢铁洪流，它需要一条通往未来的公式。

另一份是河城荷取写下的：先修高炉、先通电线、先让每一个河童都能吃上饭。她说，未来是有的，但得先把炉子点起来。

河童们必须选一个。"
  GNS.001.a: "选梦美——科学的道路。"
  GNS.001.b: "选荷取——工业的道路。"
  GNS.002.t: "远视的旗帜"
  GNS.002.desc: "梦美站在科学家大会的讲台上，身后是整面墙上密密麻麻的公式。她说，从今往后，玄武之泽的每一步，都要能被写进论文里。"
  GNS.002.a: "以理性重建玄武之泽。"
  GNS.003.t: "熔炉的轰鸣"
  GNS.003.desc: "荷取站在第一座新高炉的炉口前，火光把她的影子投在整片沼泽上。她说，第一个五年计划从今天开始，谁挡路就把谁写进报表里。"
  GNS.003.a: "先把炉子点起来。"
  GNS.004.t: "落败方的去留"
  GNS.004.desc: "权力交接之后，那份被搁置的计划该怎么处理？它的作者，又该往哪里去？"
  GNS.004.a: "让她进政府，管她最擅长的东西。"
  GNS.004.b: "让她回实验室，政治不适合她。"
  GNS.004.c: "请她进科学院，从此不必再为预算发愁。"
  GNS.004.d: "把她请出去。剩下的学者，效率确实更高了。"
  GNS.010.t: "建国议会开幕"
  GNS.010.desc: "来自旧幻想乡各个角落的代表坐进同一间屋子。红魔馆的、守矢的、博丽的、玄武之泽的——她们要在同一部宪法上签字。"
  GNS.010.a: "这个国家，从今天起才算真正存在。"
  GNS.013.t: "月都的遗产"
  GNS.013.desc: "绵月姐妹已经走了，但她们留下的顾问、宪兵与技术官僚还盘踞在机关里。清算，还是和解？"
  GNS.013.a: "押上法庭。"
  GNS.013.b: "互派使节，旧仇不必再提。"
  GNS.014.t: "新宪法生效"
  GNS.014.desc: "新宪法在议会通过的那天，议事厅外挤满了人。有人举着玄武之泽的旧旗，也有人举着一面写着“幻想乡”的新旗。

这个国家，到底该叫什么名字？"
  GNS.014.a: "玄武之泽就是玄武之泽。"
  GNS.014.b: "我们统一了幻想乡——那就叫幻想乡。"
  GNS.020.t: "伟大战争结束"
  GNS.020.desc: "第二次伟大战争的硝烟散尽。玄武之泽站在废墟与胜利之间，必须决定接下来要成为什么。"
  GNS.020.a: "我们活下来了。接下来，该我们说话了。"

