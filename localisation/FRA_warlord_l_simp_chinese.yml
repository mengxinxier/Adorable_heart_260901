#玄武之泽 · 人物
  GNS_Nitori_desc: "河城荷取，妖怪之山的全能水利工程师，河童的首领。她造过非想天则，也造过尼西号，但她最得意的作品从来不是机器——而是一套能让所有人都吃上饭的账本。"
  GNS_Yumemi_desc: "冈崎梦美，来自外界大学的教授。她相信一切问题都能被写成一个公式，包括战争、贫困和一个国家的未来。"

#玄武之泽 · 决议
  FRA_warlord_unification: "幻想乡统一进程"
  FRA_warlord_unification_desc: "当幻想乡的土地上不再有第二个独立的旗帜，统一便已经是既成事实。"
  FRA_warlord_unify_gensokyo: "宣布幻想乡统一"
  FRA_warlord_unify_gensokyo_desc: "最后一面割据的旗帜已经倒下。是时候向全国——以及全世界——宣布：幻想乡重新是一个整体了。"

