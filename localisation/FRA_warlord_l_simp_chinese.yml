l_simp_chinese:
  GNS_P1_01: "玄武之泽的余烬"
  GNS_P1_01_desc: "共和国的旗帜在人间之里倒下。议会解散、政党作鸟兽散，玄武之泽的河童们第一次意识到：她们必须自己活下去。"
  GNS_P1_02: "驱逐月都顾问"
  GNS_P1_02_desc: "绵月姐妹留在这里的顾问们，昨日还在指点江山，今日便已无人问津。玄武之泽不需要替月球说话的人。"
  GNS_P1_03: "玄武之泽的选择"
  GNS_P1_03_desc: "临时委员会的桌上摆着两份计划：一份写着宇宙，一份写着高炉。河童们必须选一个。"
  GNS_Y1_01: "冈崎梦美"
  GNS_Y1_01_desc: "来自外界的教授，带着一整个时代的科学。她说，玄武之泽不需要钢铁洪流，它需要一条通往未来的公式。"
  GNS_Y1_02: "科学执政"
  GNS_Y1_02_desc: "实验室代替了部委，论文代替了公文。玄武之泽第一次由一群真正懂技术的人治理。"
  GNS_Y1_03: "技术官僚集团"
  GNS_Y1_03_desc: "工程师、医师、教师被直接提拔进政府。她们不谈主义，只谈方案。"
  GNS_Y1_04: "远视计划"
  GNS_Y1_04_desc: "一份把三十年后的技术提前到今天来做的计划。所有人都说这是痴人说梦，除了梦美自己。"
  GNS_Y1_05: "量子研究所"
  GNS_Y1_05_desc: "玄武之泽最深处的洞窟被改成了研究所。她们在那里第一次看见了比原子更小的东西。"
  GNS_Y1_06: "深空之梦"
  GNS_Y1_06_desc: "梦美在玄武之泽的夜空下宣布：我们不是要追上时代，我们要先走一步。"
  GNS_N1_01: "河城荷取"
  GNS_N1_01_desc: "河童的领袖，全玄武之泽最会拧螺丝的人。她说，先把炉子点起来，再去谈什么未来。"
  GNS_N1_02: "重工业狂潮"
  GNS_N1_02_desc: "烟囱在玄武之泽的地平线上竖起，像一片新的森林。"
  GNS_N1_03: "工人委员会"
  GNS_N1_03_desc: "工厂归工人管。荷取把第一张委任状，签给了曾经给她打下手的老河童。"
  GNS_N1_04: "集体化"
  GNS_N1_04_desc: "沼泽、农田、渔场，全部纳入计划。河童们的记工本换成了工分簿。"
  GNS_N1_05: "五年计划"
  GNS_N1_05_desc: "第一个五年计划的目标只有一个：把玄武之泽的产量翻三倍。没人相信，包括荷取自己。"
  GNS_N1_06: "河童工业帝国"
  GNS_N1_06_desc: "玄武之泽不再是幻想乡的一个角落，它是一座会呼吸的工厂。"
  GNS_P2_01: "幻想乡的重新统一"
  GNS_P2_01_desc: "分裂的时代结束了。玄武之泽的旗帜第一次插在了整个幻想乡的城头。"
  GNS_P2_02: "建国议会"
  GNS_P2_02_desc: "来自旧幻想乡各个角落的代表坐进同一间屋子。她们要决定这个国家到底叫什么、由谁说了算。"
  GNS_Y2_01: "科学院共和国"
  GNS_Y2_01_desc: "宪法第一条：国家重大决策，须经科学院论证。"
  GNS_Y2_02: "理性主义宪法"
  GNS_Y2_02_desc: "一部以实验报告为注脚的宪法。反对者说它冷冰冰，支持者说它至少不会说谎。"
  GNS_Y2_03: "全民教育"
  GNS_Y2_03_desc: "从河童幼童到天狗老者，玄武之泽的每一个人都要上学。"
  GNS_Y2_04: "核能时代"
  GNS_Y2_04_desc: "第一座反应堆在玄武之泽地下点火。梦美说，那是这个国家真正的黎明。"
  GNS_Y2_05: "星辰共和国"
  GNS_Y2_05_desc: "玄武之泽不再只是幻想乡的一部分，它自称共和国——属于星辰的共和国。"
  GNS_N2_01: "工业共和国"
  GNS_N2_01_desc: "宪法第一条：国家的力量来自工厂，工厂的力量来自工人。"
  GNS_N2_02: "计划经济宪法"
  GNS_N2_02_desc: "每一吨钢、每一度电都要写进宪法附表。荷取说，这才叫有计划。"
  GNS_N2_03: "工农联盟"
  GNS_N2_03_desc: "工人与农奴第一次坐在同一张桌子上，分同一块面包。"
  GNS_N2_04: "全国电气化"
  GNS_N2_04_desc: "电线翻过妖怪之山，穿过雾之湖，一直拉到旧地狱的入口。"
  GNS_N2_05: "钢铁玄武"
  GNS_N2_05_desc: "玄武之泽的每一寸土地都在轰鸣。它已是一块钢铁。"
  GNS_P2_03: "整合幻想乡诸派"
  GNS_P2_03_desc: "红魔馆的吸血鬼、守矢的神明、博丽的巫女——她们终究要在这面旗帜下找到一个位置。"
  GNS_P2_04: "月都问题的清算"
  GNS_P2_04_desc: "绵月姐妹已经走了，但她们留下的东西还在。清算，还是和解？"
  GNS_P2_05: "新玄武之泽"
  GNS_P2_05_desc: "新宪法生效的那天，玄武之泽第一次有了自己的国号。"
  GNS_P3_01: "伟大战争结束"
  GNS_P3_01_desc: "第二次伟大战争的硝烟散尽。玄武之泽站在废墟与胜利之间，必须决定接下来要成为什么。"
  GNS_P3_02: "战后重建"
  GNS_P3_02_desc: "炸毁的桥梁要重修，烧掉的工厂要重建。战后第一年，玄武之泽没有一个人闲着。"
  GNS_Y3_01: "深空时代"
  GNS_Y3_01_desc: "战争的教训被写进了新的公式里：下一次，我们要在更高的地方开战。"
  GNS_Y3_02: "人类与妖怪的和解"
  GNS_Y3_02_desc: "科学与种族无关。梦美在国会上说，如果公式会为妖怪和人类分别写下不同的答案，那错的不是妖怪，是公式。"
  GNS_Y3_03: "科学国际"
  GNS_Y3_03_desc: "玄武之泽开始向世界输出论文，而不是武器。"
  GNS_Y3_04: "月球殖民"
  GNS_Y3_04_desc: "绵月姐妹曾经统治过的银色大地，如今轮到玄武之泽的旗帜插上去。"
  GNS_Y3_05: "星辰大海"
  GNS_Y3_05_desc: "梦美站在第一艘星舰的舷窗前。玄武之泽的时代结束了，属于人类的时代开始了。"
  GNS_N3_01: "重工业的荣光"
  GNS_N3_01_desc: "战争证明了荷取是对的：决定胜负的不是口号，是产量。"
  GNS_N3_02: "无产阶级国际"
  GNS_N3_02_desc: "玄武之泽的工人向全世界受压迫的工人伸出手。"
  GNS_N3_03: "大陆工业体系"
  GNS_N3_03_desc: "整个欧洲的矿、钢、电，被编进同一本账。"
  GNS_N3_04: "世界工厂"
  GNS_N3_04_desc: "从玄武之泽的车间里出来的东西，会被送到世界的每一个角落。"
  GNS_N3_05: "永恒熔炉"
  GNS_N3_05_desc: "熔炉不会熄灭。荷取说，只要它还在烧，玄武之泽就永远不会倒下。"
  GNS_Lunar_Shadow_idea: "月都阴影"
  GNS_Lunar_Shadow_idea_desc: "绵月姐妹留下的顾问、宪兵与月都技术官僚仍盘踞在玄武之泽的机关里。她们不服从任何人，只服从月球。"
  GNS_Yumemi_leader_idea: "冈崎梦美"
  GNS_Yumemi_leader_idea_desc: "这位来自外界的教授带来了整个时代的科学，也带来了一种近乎傲慢的自信。"
  GNS_Scientific_Governance_idea: "科学执政"
  GNS_Scientific_Governance_idea_desc: "部委由科学家与技术官僚主持。国家预算的第一顺位永远是实验室。"
  GNS_Technocracy_idea: "技术官僚集团"
  GNS_Technocracy_idea_desc: "工程师、医师、教师被直接提拔进政府。她们不谈主义，只谈方案。"
  GNS_Farsighted_Plan_idea: "远视计划"
