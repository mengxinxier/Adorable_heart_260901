  GNS_Farsighted_Rally_idea: "远视的旗帜"
  GNS_Farsighted_Rally_idea_desc: "梦美在科学家大会上宣布：以科学与理性重建玄武之泽。"
  GNS_Industry_Rally_idea: "熔炉的轰鸣"
  GNS_Industry_Rally_idea_desc: "荷取站在第一座新高炉前宣布：第一个五年计划，从今天开始。"
  GNS_Nitori_Minister_idea: "工业人民委员荷取"
  GNS_Nitori_Minister_idea_desc: "她被留在政府里，负责她最擅长的东西——把产量搞上去。"
  GNS_Nitori_Scientist_idea: "河童工程师"
  GNS_Nitori_Scientist_idea_desc: "不再管政治，只带团队。她的实验室里堆满了没人看得懂的图纸。"
  GNS_Yumemi_Academician_idea: "科学院院士梦美"
  GNS_Yumemi_Academician_idea_desc: "她被请进科学院，从此不必再为预算与选票发愁。"
  GNS_Yumemi_Purged_idea: "被清洗的学界"
  GNS_Yumemi_Purged_idea_desc: "不肯为新路线背书的学者被请出了研究所。剩下的，效率确实更高了。"
  GNS_Rationalist_Constitution_idea: "理性主义宪法"
