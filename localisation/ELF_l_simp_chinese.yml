#风声河谷特质
EWW_yhzh: "议会之狐"
EWW_yybz: "阴影中的编织者"
EWW_gblss: "哥布林杀手"
EWW_gblss_desc: "§L他从不轻视任何一个弱小的敌人，精于利用一切可利用的环境、工具和陷阱，以最务实、最冷酷、也最高效的方式达成目的。他的战术手册里没有英雄史诗，只有沾满泥土与鲜血的生存法则。§!"
EWW_fxyx: "风行游侠"
EWW_fxyx_desc: "§L拥有两千年阅历的她，是森林与风的女儿。她的箭矢能追上飞鸟，她的脚步能踏过无痕的积雪。作为一名高傲的妖精，她最初鄙夷那些凡人眼中“不体面”的战术，但残酷的冒险让她明白了生存的真谛。§!"
EWW_cbzx: "慈悲之心"
EWW_cbzx_desc: "§L她或许是队伍中最弱小的一员，却是所有人赖以维系的基石。从最初那个在黑暗中瑟瑟发抖的少女，到如今能为同伴筑起神圣壁垒的坚定神官，她用自己的成长证明，守护的力量，远比毁灭更坚韧。§!"
#叶落边境特质
ELW_cjsh: "残境守护者"
ELW_swjmss: "水王級魔術師"
ELW_swjmss_desc: "§L她的魔法，既可以是滋润干涸大地的温柔细雨，也能化作席卷战场的滔天巨浪。§!"
ELW_ls: "龍神"
ELW_ls_desc: "§L他是行走的传说，是活生生的灾厄。龙神奥尔斯帝德的名字，本身就是刻在世界法则上的恐惧。§!"
ELW_wyc: "無詠唱の守護者"
ELW_wyc_desc: "§L希露菲的强大，永远源于她那份纯粹而坚定的守护之心。她或许不会成为战场上最耀眼的光，但她永远是那阵在最关键时刻，为你拂去危险的、温柔的风。§!"
#曦光圣域特质
ELG_yjzs: "異界の転生者"
ELG_yjzs_desc: "§L此人的灵魂，携带着一个截然不同世界的知识与记忆，在一个全新的身体中醒来。这份与生俱来的“先知”，让其拥有超越同龄人的智慧和对魔力本质的深刻理解。§!"
#希尔瓦尼亚特质
EFC_kq: "狂犬"
EFC_kq_desc: "§L在格雷拉特的家中，她曾是那只无人能管束的红色野兽。她的剑法毫无章法，充满了原始的暴力与愤怒，唯一的目的就是将眼前的一切都彻底破坏。支撑她战斗的，是纯粹的本能与不服输的倔强。§!"
