  EWW.1.t: "风语者的交响"
  EWW.1.d: "今日，一份由风声河谷发出的、以“四季盟约”为名的正式邀请函，送抵了所有艾尔芙部族的领袖案头：\n“致曦光圣域的奈瑞丝祭司，叶落边境的莉芙指挥官，暮色林渊的瑟兰静语者，无垠之海的妮拉神谕者，以及希尔瓦尼亚的希露理事长。致所有艾尔芙的同胞们。\n长久以来，我们习惯于在各自的林地里，独自忍耐着旱季的焦渴，或独享着雨季的丰饶。我们的智慧如同被群山隔绝的湖泊，我们的力量如同被峡谷切断的溪流。我们各自吟唱着古老的歌谣，却忘记了如何将它们谱成一首共同的交响。\n今日，于此，我们立下‘四季盟约’。\n这盟约承认，风声河谷充沛的雨水，若无法流向暮色林渊干渴的根系，终将汇成无意义的死水。它坚信，希尔瓦尼亚熔炉的火焰，若得不到叶落边境最坚韧的木材，亦无法锻造出守护我们所有人的利剑。\n一个部族的繁荣，建立在另一个部族的贫瘠之上，那样的繁荣是脆弱的，是会被第一场真正的风暴轻易吹散的沙塔。\n所以，我在此，以叶奈氏族长女、风语者议会首席代表薇雅·叶奈之名，向你们，向所有艾尔芙的血脉，发出最诚挚的邀请。\n加入我们。让我们将孤立的湖泊与溪流，汇聚成一片能够抵御任何风浪的、广阔的海洋。让我们将各自的歌谣，融合成一首响彻云霄的、属于我们所有人的交响乐。\n从今日起，当外界的风暴来临时，它们面对的，将是一片……共同呼吸、根脉相连的广袤森林。”"
  EWW.1.a: "新的季节已经来临"

  EWW.2.t: "黄金之城的阴影"
  EWW.2.d: "希尔瓦尼亚的空气里，闻不到半点泥土的味道，全是钱和铁锈的冷气。薇雅走进奥蕾希亚理事会的顶层办公室时，希露正背对着她，看着窗外那座由她亲手堆起来的黄金牢笼。\n她头也没回，声音像两块水晶在碰撞，又冷又脆。\n“薇雅·叶奈。风声河谷最会说话的‘编织者’。省点力气吧，我猜得到你想要什么。直接开价，你的‘联盟大义’和那些老掉牙的森林歌谣，能换我几座工厂，几支军团？”\n薇雅轻笑了一声，走到她身边，学着她的样子看向窗外。\n“希露，我可不是来卖唱的。我带来的东西，你肯定感兴趣。”薇雅把一份文件拍在旁边的桌上，声音不大，却像一枚金币落在石板上一样清晰。“一份……复仇的价目表。”\n希露的肩膀，在那一瞬间，绷紧了。\n薇雅的语气变得轻松起来，像在闲聊。“你的军团很能打，可他们被困在这座城里，就像笼子里的狮子。你需要一片狩猎场，一片足够大的、能让你的狮子尽情撕咬的狩猎场。而我的联盟，就是那片狩猎场。”\n她顿了顿，语气里带上了一丝诱惑。\n“我的斥候可以成为你的眼睛，切断帝国的补给线；我的名声可以成为你的盾牌，把一场私人的血仇，包装成正义的解放。怎么样？这笔生意，听起来不错吧？”\n薇雅话锋一转，声音里带上了一丝不易察觉的重量。“至于我想要的，很简单。我需要你的怒火，把它变成熔炉，烧掉帝国的根基。我需要你的金币，为我妹妹手下那些在泥沼里跋涉、双脚都快要烂掉的士兵，换上一双结实的靴子，再带去足够撑过下一个雨季的药品。”\n希露沉默了很久。壁炉里的火光，在她冰冷的红瞳里跳动。\n终于，她转过身，直视着薇雅。那眼神，像淬了火的寒冰。\n她一把抓起那份文件，看也没看，就甩进了壁炉里。\n“价目表？我不需要。”她的声音压得很低，每一个字都带着彻骨的恨意。\n她向薇雅伸出手，那只冰冷的手上，戴着象征家族权力的戒指。\n“我的金币，我的工厂，我的一切，都是你的。”\n“我只要一样东西。”\n她盯着薇雅的眼睛，一字一顿地，说出了她的底价。\n\n“§R——薇莉安的脑袋。§!”"
  EWW.2.a: "成交"

  EWW.3.t: "大陆的账本"
  EWW.3.d: "今日，一封由风声河谷首席代表薇雅·叶奈署名的公开信，通过所有外交渠道，送至了您的案头。这与其说是一封信，不如说是一份清晰的、写给整个大陆所有掌权者的经济分析。\n“致南美大陆的诸位领袖：\n我们都追求着土地的繁荣，期望我们的港口商船云集，我们的市场谷物满仓。然而，一股灼热的歪风正从阿德莱希的方向吹来，它让每一位商人都感到不安，让每一份契约都蒙上了风险的阴影。\n帝国的野心是一场无声的瘟疫。它的军靴践踏的土地，商业凋零；它的战舰航行的海域，海盗横行。每一笔与帝国进行的交易，都像是在为一把随时可能刺向我们自己的匕首淬火。我们用自己的资源，去喂养一头只会带来毁灭与混乱的野兽。\n诸位，我清楚战争的代价。因此，我提议的，是一种更优雅，也更致命的武器：我们共同的账本。\n我在此呼吁，整个南美大陆，对阿德莱希帝国实行全面的经济制裁。让我们关闭港口，拒绝她们的商船停靠；让我们清空货架，拒绝她们沾满血污的商品。让她们每一次挥舞刀剑的代价，都变成国库里空洞的回响。\n我们有一个选择：继续假装看不见那头日益壮大的猛兽，祈祷它最后才来敲响自己的家门；或者，我们可以站在一起，用最简单的方式，收回喂养它的食粮。\n这是一个关乎审慎与远见的决定。风声河谷与希尔瓦尼亚城邦的账本，已经向帝国关上了。这根绞索的第一根丝线已经就位。现在，我等待着您的回答。”"
  EWW.3.a: "这是一份无法拒绝的提议"
  EWW.3.b: "我们的港口为所有人敞开"

  EWW.4.t: "风暴前的最后一次低语"
  EWW.4.d: "在盟约议会的特别会议上，大厅里一片寂静。所有的目光，都聚焦在那个站在讲台中央的身影上。薇雅·叶奈环视着在场的每一位领袖——希露眼中冰冷的怒火，莉芙跨越千里送来的支持信，奈瑞丝坚定的颔首，瑟兰在阴影中的默许。\n她清了清嗓子，声音不大，却清晰地传入每一个妖精的耳中，仿佛林间最清澈的风语。\n“我记得‘落叶之灾’后，那片土地上长久的寂静。那是一种被悲伤填满的寂静，每一寸空气里，都回响着无声的哭泣。我们幸存了下来，但那份创伤，成为了我们所有人共同的梦魇。”\n“今天，我们再次听到了哭声。它来自希尔瓦尼亚的瓦砾之下，来自奥蕾希亚家族的墓碑之前。它也来自帝国的铁蹄所踏过的每一寸土地，来自那些被奴役、被掠夺的无数生灵的喉咙。这哭声，与我们记忆中的何其相似。”\n她的声音开始变得有力，像绷紧的弓弦。\n“阿德莱希帝国，是一场正在蔓延的瘟疫。它的存在，本身就是对和平的嘲弄，对生命的亵渎。希露·奥蕾希亚的复仇是正义的，因为她的怒火，点燃的是我们所有人都曾感受过的、那份失去家园的切肤之痛。”\n“但这场战争，它的意义远不止于复仇。复仇，是对昨日的回望；而我们，必须为明日而战。”\n薇雅向前一步，她的目光如炬，扫过全场。\n“我们战斗，是为了让叶落边境的残兵，能有机会放下武器，去亲手播种一片春天！我们战斗，是为了让曦光圣域的光辉，能照亮一片真正和平的土地，而非仅仅驱散眼前的阴影！我们战斗，是为了让希尔瓦尼亚的金库，能为所有妖精的孩童建造学校，而非仅仅铸造更多的刀剑！”\n她的声音已然激昂，充满了不容置疑的力量与激情。\n“我们今日将要流下的血，是为了终结这场延续了太久的悲伤循环！我们今日将要举起的剑，是为了斩断所有可能让我们后代再次流泪的枷锁！”\n“诸位！抬起头来！聆听这风中的声音！这是我们盟约的意志，是我们作为一个种族，向这个残酷世界发出的最后宣言！”\n\n“为了所有不再哭泣的明日——”"
  EWW.4.a: "风暴已至，我们从不畏惧！"

  EWW.5.t: "同一片森林，同一个命运"
  EWW.5.d: "致 [Root.GetName] ，我尊敬的同胞：\n帝国的铁蹄正在踏碎我们的土地，我们每一个部族，都已感受到了那头野兽吐息中的灼热。我们各自为战，如同在风暴中摇曳的孤树，英勇，却脆弱。我们的力量被分散在不同的山谷与林地，我们的资源在各自为政的壁垒中蹉跎。\n这样的抵抗，是一场注定走向悲剧的、光荣的牺牲。\n我写下这封信，是为了提出一个沉重的，却也是唯一的选择。此刻，我们需要的，是一个统一的意志，一个共同的心跳，一把由所有部族的钢铁与信念熔铸而成的、足以斩断帝国脊梁的利剑。\n我在此，以盟约赋予我的名义，正式邀请您与您的部族，将指挥权、资源与命运，完全并入战时最高指挥部。这会是一次彻底的融合。从此，再无风声河谷或 [Root.GetName]，只有艾尔芙联盟。\n这会让我们失去古老的部族名号，但它将换来我们作为一个种族存续下去的权利。历史正在注视着我们，注视着我们是选择抱着各自的传统沉入海底，还是选择汇成一股足以撼动大陆的洪流。\n请做出您的决断。森林的命运，悬于一线。”"
  EWW.5.a: "万木成林，方能抵御风暴"
  EWW.5.b: "我们的根深植于此，绝不动摇"

  EWW.6.t: "听着，莉芙，回家"
  EWW.6.d: "一封私信，绕过了所有的官方渠道，被薇雅最信任的信使，亲手交到了你的手中。信封上没有冰冷的议会印章，只有你再熟悉不过的、姐姐那龙飞凤舞的字迹。\n“莉芙：\n议会那帮老古董终于安静了。希露的金库、奈瑞丝的神殿、瑟兰的影子……现在，都听我调遣。我桌上的这张地图，总算有了点像样的分量。\n可它还是缺了一块，最重要的一块。就是你守着的那片，我们都叫它‘家’的破地方。\n我知道，你把自己的魂都钉在那片焦土上了，替我们所有人守着父兄的坟。你做得很好，真的。比我们想象的都好。\n但现在，听着。那头叫帝国的野兽已经撞上门来了，一场能把整片森林都掀翻的风暴就在眼前。我需要你，莉芙。\n我需要的，不是你和你手下那帮可怜的士兵，像个悲剧英雄一样，在那里流尽最后一滴血。我需要你们回来，站到我身后，成为整个联盟最硬的那面盾。你那股子守着坟地不放的犟劲，现在，该用来守护还活着的人了。\n所以，回家吧。\n别再一个人跟那些冰冷的石头说话了，听到了没有？回来。你的身后，有整个联盟给你当后盾。\n我跟你保证，等我们把那头野兽的腿打断，我会亲自陪你回去。到时候，你想在那片地上种满什么花，都随你。\n我……在等你呢。别让我等太久。”"
  EWW.6.a: "……知道了，姐姐"
  EWW.6.b: "我的战场还在这里"

  EWW.7.t: "意外的春天"
  EWW.7.d: "斥候的最终报告被送到了薇雅的案头，确认了那则令人难以置信的消息：阿德莱希帝国的军团正在全面撤退。并非战术性的后撤，而是一场混乱的、奔向其国内的溃退。帝国的后方，燃起了比前线更猛烈的火焰。\n议会大厅里，充满了劫后余生的狂喜与喧嚣。将领们在讨论着乘胜追击，商人们在计算着战争赔款，部族代表们则高呼着盟约的胜利。\n薇雅独自一人，走出了嘈杂的大厅，来到了那片能俯瞰整个风声河谷的露台。初升的太阳驱散了最后一丝晨雾，温暖的阳光洒在她的肩上。她本该是最高兴的那一个，她所有的谋划、所有的整合，都以最小的代价，换来了最完美的结果。\n可她的心中，却是一片异样的平静。\n她想起那些为了这场“决战”而并入联盟的部族，想起希露眼中那几乎要燃尽一切的仇恨，想起妹妹莉芙在告别边境墓碑时那决绝的眼神。她们所有人都已做好了牺牲一切的准备，为了一个或许要持续数年、甚至数十年的漫长冬天。\n春天，却以这样一种……近乎荒诞的方式，提前到来了。\n一位年轻的侍从官兴奋地跑到她的身边：“首席大人！这是一场奇迹！是盟约的力量让那头野兽不战自溃！”\n薇雅转过头，看着侍从官那张洋溢着纯粹喜悦的年轻脸庞。她笑了，那是这段时间以来，第一个发自内心的、不带任何算计的、温柔的笑容。\n“不，”她轻声说，声音里带着一丝无人能懂的感慨，“这不是奇迹。这是……账单。”\n“帝国的暴政，是她欠下人民的债务。我们只是，恰好在她债台高筑、即将破产的前一夜，送去了最后一份催款单而已。”\n她再次望向那片沐浴在阳光下的、宁静的土地。她知道，这场意外的胜利，比一场惨烈的血战，更能考验她和这个新生联盟的智慧。战争，曾是她们团结在一起的唯一理由。现在，战争结束了。\n“传我的命令，”她的声音恢复了往日的冷静与权威，“召集所有部族的代表。告诉她们，冬天已经过去，但春天的工作，才刚刚开始。”\n“我们的第一项议题：如何将我们为战争而磨亮的剑，重铸为耕耘这片土地的犁。”"
  EWW.7.a: "一个新的季节，需要一首新的歌谣"
####国策####
#风声河谷政治线
EWW_ltqe: "聆听千耳之森"
EWW_ltqe_desc: "繁荣的第一步，在于理解何为匮乏。薇雅派遣出她最敏锐的信使，她们的任务是深入联盟的每一个角落，去记录。记录叶落边境的霜冻有多长，暮色林渊的矿脉有多深，希尔瓦尼亚的粮仓有多满。她将这些零散的情报，汇集成一张描绘着整个联盟苦乐不均的真实地图。这张地图将成为她所有谋划的起点；一位真正的编织者，必须先认清每一根丝线的质地与韧性。"

EWW_gzxy: "古枝协约"
EWW_gzxy_desc: "联盟长久以来的分歧，源于各自为政的古老传统。薇雅召集了所有部族的律法与贸易代表，她提议了一份名为“古枝协约”的框架。协约不去触碰各族神圣的内部律法，致力于为联盟内部的贸易与纷争，设立一个所有人都认可的共同标准。从统一的度量衡，到跨部族商队的保护条例，再到资源争端的仲裁庭。她正为联盟这棵古树，修剪掉那些彼此纠缠、阻碍生长的杂枝，让养分能更顺畅地流向每一个角落。"

EWW_xgzz: "星光与种籽之道"
EWW_xgzz_desc: "孤立的智慧终将枯萎，独占的财富无法生长。薇雅推动了一项前所未有的交流计划。曦光圣域的学者，将被邀请到叶落边境，指导那里的农民如何利用光魔法改良作物；希尔瓦尼亚的工匠，将获得暮色林渊出产的稀有矿石，以锻造更精良的工具。知识与资源，将沿着一条条新开辟的星光与种籽之道，在联盟内部自由地流动。这致力于交换物资，更是在交换彼此的未来。"

EWW_ljkd: "我们的四季"
EWW_ljkd_desc: "真正的繁荣，意味着没有人会被落下。薇雅深知，联盟内部巨大的贫富差距，是分裂最终的根源。她设立了一个名为“四季盟约”的常设机构，由所有部族共同出资。富庶的城邦需要为边境的防御工事提供资金，拥有丰饶土地的部族则有义务为矿产区的同胞支援粮食。这份投入是一份投资——投资于联盟每一个成员的存续与尊严。当风暴来临时，一棵树最脆弱的部分，决定了整片森林的命运。"

EWW_drmy: "点燃盟约之心火"
EWW_drmy_desc: "当贸易的路线被打通，当知识的壁垒被拆除，当互助的机制被建立，一种全新的情感在联盟中悄然滋生。它超越了古老的部族认同，成为了一种更宏大的、属于所有艾尔芙的我们。薇雅抓住这个时机，正式提议重组“盟约议会”。新的议会将是为共同未来而思考的心脏。这团由所有部族共同点燃的心火，将成为联盟永不熄灭的灵魂。"

EWW_pxjx: "为将至之季节谱写交响"
EWW_pxjx_desc: "薇雅最终的杰作，是一套可以自我呼吸、自我调节的系统。联盟的繁荣，已不再需要一位“编织者”去刻意维持。丰收之地的余粮会自动流向孤冷的边境，智慧的火花会在需要她的工坊中点燃。每一个部族都像交响乐中独一无二的乐器，她们或许音色各异，节奏不同，但在“盟约”这本共同的乐谱指引下，她们共同奏响了一曲……关于和平、繁荣与无尽未来的华美乐章。"

EWW_pxtt: "在帝国铁蹄之下"
EWW_pxtt_desc: "那头盘踞在南方的野兽，它的每一次呼吸都带着血腥味。希露的仇恨是真实的，但仅凭仇恨无法赢得战争。薇雅召集了所有部族的史学家与斥候，她需要的，是对帝国的一次彻底剖析。研究她过去的每一次扩张，分析她军团的补给路线，评估她那新王残暴性格下的每一个潜在弱点。在拔剑之前，一位合格的猎手，必须先了解猎物的全部习性。"


EWW_pxtt2: "在帝国铁蹄之下"
EWW_pxtt2_desc: "那头盘踞在南方的野兽，它的每一次呼吸都带着血腥味。希露的仇恨是真实的，但仅凭仇恨无法赢得战争。薇雅召集了所有部族的史学家与斥候，她需要的，是对帝国的一次彻底剖析。研究她过去的每一次扩张，分析她军团的补给路线，评估她那新王残暴性格下的每一个潜在弱点。在拔剑之前，一位合格的猎手，必须先了解猎物的全部习性。"

EWW_NB_PAQ_SB: "西陲的落日余烬"
EWW_NB_PAQ_SB_desc: "“那轮曾在西方不可一世的黑日终于坠落。阿德莱希的薇莉安或许还活着，但她的军团已不再是不可阻挡的钢铁洪流。\n薇雅·叶奈深知，彻底摧毁西方只会留下一片权力的真空。我们选择让帝国保留最后一口气，作为我们西侧的看门犬。我们将在西线建立监视网，确保这堆余烬只能在我们的许可下苟延残喘，而无法再次点燃森林。”"

EWW_cbnh: "城邦的怒火与风谷的智慧"
EWW_cbnh_desc: "薇雅亲自前往了希尔瓦尼亚，她带去的，是一份蓝图。她向希露承诺，叶奈氏族的悲伤与奥蕾希亚家族的血仇并无不同。她所提议的，是将希露那足以熔化钢铁的怒火，引导至一个更精确的方向。城邦的财富与工业将成为战争的引擎，风声河谷的政治智慧与联盟的大义名分，则会为这台引擎指明道路。这是一场复仇，但它将以一场解放战争的名义进行。"

EWW_bzsc: "编织绞索的商路"
EWW_bzsc_desc: "一场公开的战争代价高昂，但一场无声的经济战却能让敌人从内部腐烂。在希露商会的协助下，薇雅开始编织一张笼罩整个南美的经济网络。她们向帝国的贸易伙伴倾销更廉价的商品，买断帝国急需的战略资源，并向所有其他南美州国度暗示与帝国交易的政治风险。每一笔被取消的订单，每一艘被迫返航的货轮，都是在为那头野兽的脖颈，缠上又一圈看不见的丝线。"

EWW_ttjn: "联军战法"
EWW_ttjn_desc: "希尔瓦尼亚的城邦军团精于阵地战与重型装备，而风声河谷的游击部队则擅长山地与丛林作战。薇雅深知，两种力量若无法协同，便只是两支独立的军队。她促成了两军的深度整合，派遣风语者军官前往城邦学习配合作战，邀请希尔瓦尼亚的工程师为边境的游击队改良装备。当风行者的箭矢能为重弩的装填争取时间，当城邦的盾墙能为斥候的迂回提供掩护，这支联军才算真正拥有了灵魂。"

EWW_czmy: "联盟战时指挥部"
EWW_czmy_desc: "帝国的威胁，如同一面冰冷的镜子，照出了艾尔芙联盟内部所有的裂痕与软弱。薇雅抓住这个机会，在盟约议会上发表了她最具分量的演说。她向所有部族领袖发问：是选择继续在帝国的阴影下各自为政、等待被逐一吞噬，还是选择团结起来，将所有的力量汇于一处，共同捍卫我们作为一个种族的尊严？她提议建立一个统一的联盟战时指挥部，由她与希露共同领导。这是最后的选择。"

EWW_bzkq: "为所有不再哭泣的明日"
EWW_bzkq_desc: "所有的准备都已完成。在战前的最后一次会议上，薇雅的目光扫过每一位将领的脸。她的话语平静，却带着无可动摇的重量：“我们此战，是为了希露父亲的血，是为了叶落边境的灰，是为了所有曾被帝国铁蹄践踏过的亡魂。但我们此战，更是为了那些尚未出生的孩子，为了她们能在一个不必再听闻帝国之名的世界里自由成长。我们今日所流的血，将浇灌出一个再也没有人会因暴政而哭泣的明天。现在，让那头野兽，听见我们的回音!"

EWW_yfbz: "于风暴中重铸盟约"
EWW_yfbz_desc: "帝国的铁蹄震动着大地，古老的盟约在绝对的力量面前显得脆弱不堪。薇雅在战时议会的第一次会议上，将所有部族的地图并列于一处。她指出，孤立的抵抗如同风中残烛，唯有将所有的火焰汇聚成一处篝火，方能在这场漫长的寒夜中幸存。此刻，旧的盟约已死，新的盟约必须在战火中诞生。一个统一的指挥体系，一道共同的防线，是所有战略的第一块基石。"
EWW_jjts_tt: "§Y若对方同意§!:\n我们将与其§Y合并§!，并且我们作为£FourSeasons_text_icon §9四季盟约创立者§!的民族精神效果将获得提升。"
EWW_yfbz_tt: "§Y为所有不再哭泣的明日§!效果持续时间增加§G180§!天。"

EWW_rlzw: "熔炉与蛛网的同盟"
EWW_rlzw_desc: "希露·奥蕾希亚的怒火是联盟最宝贵的财富，亦是最危险的利刃。薇雅深知，必须为这股复仇的洪流，挖掘一条精确的河道。她正式向希尔瓦尼亚理事会提议，将城邦的工业体系与风声河谷的战略指挥完全整合。城邦的熔炉将为整个联盟提供钢铁的脊梁，而薇雅的蛛网将指引这根脊梁，精准地刺向帝国的软肋。这是复仇与智慧的结合，是金币与谋略的联姻。"

EWW_drxg: "为伤者点燃曦光"
EWW_drxg_desc: "前线的伤亡报告如雪片般飞来，每一个冰冷的数字背后，都是一个破碎的家庭。战争消耗的不仅是钢铁，更是灵魂。薇雅向曦光圣域的奈瑞丝·光辉发出了最诚挚的请求，请求她将圣域的光芒，洒向每一处伤兵营地。此刻，联盟需要的不仅是胜利的希望，更需要治愈伤痛、抚慰亡魂的慈悲。奈瑞丝的加入，将为这场残酷的战争，注入最神圣的人性光辉。"

EWW_hwlr: "将暮色化为利刃"
EWW_hwlr_desc: "正面的对抗代价惨重，帝国的防线坚不可摧。薇雅将目光投向了地图上那片永恒的阴影——暮色林渊。她向瑟兰·暮林传递了一个简单的信息：猎手，不应等待猎物撞上门来。她请求暮影密会将她们的技艺，从被动的“守护”，转为主动的“狩猎”。让她们的斥候成为帝国的梦魇，让她们的密使成为瓦解敌人意志的毒药。一场无声的战争，将在主战场的阴影之下打响。"

EWW_wyzh: "无垠之海的庇护"
EWW_wyzh_desc: "薇雅必须为这场她无法预见终点的战争，准备最后的退路。无垠之海，那片与世隔绝的迷雾领域，是联盟最后的庇护所。她向妮拉·露米承诺，联盟将用所有的力量保护“海”的纯净，以换取这片迷雾成为伤员的疗养地、孩童的避难所、以及保存文明火种的最后圣地。这既是战略上的纵深，也是精神上的慰藉——它向所有战士承诺，即使家园沦陷，她们依然有“家”可归。"

EWW_gyyc: "风，终将归于一处"
EWW_gyyc_desc: "薇雅亲自前往叶落边境，她走过那片由妹妹用血肉守护的焦土。她没有带来议会的命令，也没有携带联盟的旗帜。她只是，以一个姐姐的身份，对她那早已疲惫不堪的妹妹伸出了手。“莉芙，”她的声音里带着一丝颤抖，“所有的道路都已铺好。现在，跟我回家。我们一起，去赢得这场战争，然后，再一起，重建那片属于我们的春天。"

EWW_fshl: "风声鹤唳，万木同春"
EWW_fshl_desc: "风声河谷的议事大厅里，第一次，汇聚了来自所有部族的代表。从叶落边境归来的斥候，到曦光圣域的祭司；从暮色林渊的密使，到希尔瓦尼亚的商人。她们曾是独立的星辰，如今，在帝国的阴影下，被薇雅·叶奈的智慧与决心，编织成了一片璀璨的星海。\n薇雅走上讲台，她的目光扫过每一张熟悉的面孔。她平静地将那面绘有风声河谷部族徽记的旗帜，从旗杆上缓缓降下。\n“今日之前，”她的声音在寂静的大厅中回响，“我们是风语者，是光辉的信徒，是影子的行者。我们为各自的传统而战，为各自的荣耀而生。”\n她展开了一面崭新的旗帜。\n“从今日起，我们只有一个名字——艾尔芙。我们只有一个家园——这片由我们共同守护的森林。‘风声河谷’将回归她本来的面目——一片普通的、宁静的山谷。而我，薇雅·叶奈，将卸下风语者首席代表的身份。”\n她将新的旗帜缓缓升起。\n“我将是这片统一意志的、第一位仆人。”\n当那面崭新的旗帜升至顶端时，大厅里爆发出雷鸣般的欢呼。旧的时代在此刻终结，一个新的、真正统一的联盟，在风暴的洗礼中，迎来了她重生的、翠绿的春天。"

EWW_sunset_embers_of_west: "西陲的落日余烬"
EWW_sunset_embers_of_west_desc: "“那轮曾在西方不可一世的黑日终于坠落。阿德莱希的薇莉安或许还活着，但她的军团已不再是不可阻挡的钢铁洪流。\n薇雅·叶奈深知，彻底摧毁西方只会留下一片权力的真空。我们选择让帝国保留最后一口气，作为我们西侧的看门犬。我们将在西线建立监视网，确保这堆余烬只能在我们的许可下苟延残喘，而无法再次点燃森林。”"

EWW_healing_the_scars: "治愈大地的伤痕"
EWW_healing_the_scars_desc: "“战争的履带碾碎了花朵，炮火惊扰了沉睡的种子。虽然胜利属于我们，但希尔瓦尼亚的账本上赤字累累，叶落边境的土壤里仍埋着哑弹。\n现在，剑已归鞘。我们要用精灵的魔法与城邦的金币，去填平那些战壕。让曦光圣域的祭司们走出神殿，不仅仅是为了祈祷，更是为了让枯萎的森林重新焕发生机。繁荣，才是抵御下一次风暴最坚实的根系。”"

EWW_listening_to_southern_wind: "聆听南风的呜咽"
EWW_listening_to_southern_wind_desc: "“当西方的威胁解除，瑟兰·暮林的密探们却听到了更令人不安的声音——这次来自南方。\n南风不再温暖，它夹杂着工业的煤烟味、血腥气，以及一种令人毛骨悚然的死寂。来自莉兰迪亚的消息令人胆寒：那里或是燃起了要烧尽一切旧秩序的野火，或是被一群不知餍足的饿狼所吞噬。那个方向的局势正在失控，而那股混乱的洪流，正沿着河流向北蔓延。”"

EWW_warning_of_wildfire: "野火燎原的警示"
EWW_warning_of_wildfire_desc: "“如果南方的胜利者是那些自称‘野火’的革命者，那么我们面临的将是思想的入侵。她们宣称要解放所有被压迫者，而在她们眼中，拥有漫长寿命与古老传统的艾尔芙贵族，或许正是她们要‘挂在路灯上’的对象。\n她们的教条极具煽动性，可能会诱使我们内部的半妖精阶层动摇。我们必须在边境筑起防波堤，不仅是防御军队，更是防御那些红色的传单。”"

EWW_hunger_from_abyss: "来自深渊的饥饿"
EWW_hunger_from_abyss_desc: "“如果南方沦为了索拉娜的食堂，或者是莉莉安娜的静谧庭院，那我们将面临最纯粹的生存恐惧。\n对于那头贪婪的狼王，艾尔芙的富庶只是菜单上的一道甜点；对于那位亡灵公主，生者的喧嚣是必须被抹去的杂音。无论是被吞噬还是被转化为亡灵，都不是我们想要的结局。面对这种非人的恶意，没有任何谈判的余地，唯有钢铁与魔法能让她们止步。”"

EWW_shield_of_leaves: "万叶之盾，四季长城"
EWW_shield_of_leaves_desc: "“西方已定，南风渐紧。薇雅·叶奈站在议会之巅，向所有部族宣告：我们不再是偏安一隅的隐士，而是这片大陆上文明最后的守望者。\n我们将铸造一面万叶之盾。从西边的焦土到南边的密林，每一片叶子都是一名战士，每一根树枝都是一座哨塔。无论南方涌来的是红色的火焰、黑色的狼群还是灰色的亡灵，当她们踏入这片森林时，面对的将是艾尔芙四季轮回的怒火，是这片土地绝对的拒绝。”"
#通用经济线
ELF_bzjs: "编织金色的丝线"
ELF_bzjs_desc: "在风语者议会的茶会上，一场看似不经意的闲谈，便可能促成一笔横跨山脉的贸易。薇雅·叶奈的微笑是联盟中最昂贵的货币，她的承诺则是最坚实的信用。她派遣出最能言善辩的使者，她们不携带刀剑，只带着风声河谷的特产与足以打动顽石的言辞。她们将联盟内部那些孤立的经济命脉，如编织蕾丝般，一根根巧妙地联结在一起，让财富如溪流般在盟约的土地上自由流淌。"

ELF_bsxy: "在灰烬上播撒新芽"
ELF_bsxy_desc: "战争带走了一切，却夺不走土地的记忆。莉芙·叶奈带领着她的族人，回到那片被称为“坟场”的家园。她们没有时间哀悼，因为生者需要屋檐，冬天需要柴火。她们用残破的武器当作农具，在被战火烧焦的土地上，重新开垦出第一片田地；她们收集每一块尚能使用的砖石，为孤儿们搭建起第一座能抵御寒风的屋舍。这并非宏伟的建设，这只是……一群不肯离去的孩子，在为她们的母亲，缝补破碎的衣裳。"

ELF_zlgf: "让晨光照耀工坊"
ELF_zlgf_desc: "晨光教会的信徒相信，每一次创造，都是对曦光的一次赞美。奈瑞丝·光辉下达了新的神谕：圣域的智慧不应只封存于神殿的卷宗里。她鼓励最聪慧的学者与最灵巧的工匠走出圣堂，将那些古老的符文与精密的技艺，应用到凡人的器物之上。于是，老旧的织机开始自行运转，冰冷的熔炉燃起了魔力的火焰。知识的微光，正悄然演变成一场席卷生产方式的、安静的革命。"

ELF_shms: "收获暮色的馈赠"
ELF_shms_desc: "在暮色林渊深处，那些被光明遗忘的角落，往往沉睡着最稀有的宝藏。瑟兰·暮林派遣出最沉默的勘探者，她们不追寻阳光下的金矿，而是潜入地底的幽深洞穴，追寻那些能吸收影子的金属与能凝结寂静的水晶。这些凡人眼中的“不祥之物”，在暮影密会的工匠手中，却能被打造成最锋利的匕首与最坚韧的甲胄。黑暗，并非虚无，它只是……另一种形式的富饶。"

ELF_ltgy: "聆听潮汐的歌谣"
ELF_lgty_desc: "无垠之海没有多少矿脉，也没有多少农田，但“海”本身，就是海洋的女儿们最慷慨的母亲。当神谕者妮拉·露米轻声吟唱古老的歌谣时，迷雾会为她凝聚出最纯净的露水，潮汐会带来外界沉船上遗落的奇珍。她们将这些迷雾的“眼泪”与潮汐的“赠礼”收集起来，通过秘密的航路，与外界的商人交换她们所需的一切。这并非贸易，这是一场……与神秘的自然之灵共同吟唱的、关于给予和获取的古老歌谣。"
ELF_mwqy: "迷雾契约"

ELF_pxlf: "以金钱谱写律法 "
ELF_pxlf_desc: "在希露·奥蕾希亚的治下，城邦的心跳不再是自然的脉搏，而是铸币厂里永不停歇的锤音。她坚信，稳固的秩序源于明确的契约，而最有力的契约，是用黄金签署的。她颁布了新的商法，吸引着来自大陆各处的财富与人才。一座座高耸的工坊拔地而起，它们冰冷的轮廓遮蔽了古老的森林，却也为城邦带来了足以对抗任何敌人的、钢铁般的底气。在这里，荣耀或许无法永存，但财富可以。"
#通用军事线
ELF_ygxy: "月光下的弦音"
ELF_ygxy_desc: "在寂静的林间空地上，年轻的射手们并非对着死板的靶子练习。她们的导师所教导的，是聆听。聆听月光穿过枝叶的簌簌声，感受风拂过箭羽时的低语。当射手的心跳与夜的脉搏合而为一，当她的呼吸与林间的风融为一体时，射出的那一箭，便不再是凡铁，而是月光本身的一缕回响。这并非杀戮的技艺，而是一首献给宁静的诗篇，只是诗的结尾，恰好是敌人的心脏。"

ELF_sldy: "森林的低语"
ELF_sldy_desc: "对于妖精而言，森林并非是需要被征服的战场，而是血脉相连的盟友。古老的教条指引着她们，去学习森林的语言。每一棵树都可能成为隐秘的哨塔，每一条溪流都吟唱着敌人的踪迹。她们的斥候从不依赖地图，因为大地本身就是她们的向导。当一支军队不再是行走于林间，而是成为了森林本身的一部分时，任何入侵者都将迷失在永恒的绿意迷宫之中，直至被悄然吞噬。"

ELF_rfbl: "如风的步履"
ELF_rfbl_desc: "战争，在古老的妖精看来，更像是一场庄严的舞蹈。笨拙的冲撞与野蛮的对垒，是对战场本身的亵渎。真正的战士，其步履应如风一般轻盈，其阵型应如水一般流动。她们从不试图撞碎敌人的盾墙，而是优雅地绕过，从敌人最意想不到的侧翼，献上致命的一吻。战场并非棋盘，而是一方舞台，唯有最优雅的舞者，方能赢得最后的掌声。"

ELF_glsb: "古老林地的哨兵"
ELF_glsb_desc: "在每一片妖精的领地深处，都有一片不容侵犯的圣地。古老的誓约将哨兵们的灵魂与这片土地紧紧相连。她们的职责并非进攻，而是守护。她们能在一块岩石后静待数十年，任凭四季更迭、藤蔓爬上肩头，只为等待那个可能会，也可能不会到来的入侵者。对哨兵而言，时间不是敌人，而是战友。她们的坚韧，便是家园最古老、也最坚固的城墙。"

ELF_xczj: "星辰织就的战网"
ELF_xczj_desc: "一位孤勇的英雄或许能斩落巨龙，但一场战争的胜利，却需要将所有星辰的光芒汇聚在一起。星语者们在战前彻夜不眠，观测着星辰的轨迹，为大军指引出最吉利的时机与方向。战场上，每一个小队的行动都与其他小队遥相呼应，如同星辰之间无形的引力。她们的军阵并非钢铁的城墙，而是一张由默契与信任织就的、笼罩整个战场的星网。"

ELF_wssl: "无声的狩猎"
ELF_wssl_desc: "当妖精真正投入一场关乎存亡的战争时，战场上将不会有震天的战吼与轰鸣。那将是一场……无声的狩猎。整支军队都将化身为一个耐心的猎人，悄无声息地追踪着猎物的气息，精准地切割它的肌腱，从容地等待它失血倒地。她们的每一次攻击都直指要害，每一次转移都悄无声息。当敌人终于意识到自己已是猎物时，往往已听不见猎人最后的脚步声了。"
