#风声河谷民族精神
EWW_yybz: "微笑与言语的编织"
EWW_yybz_desc: "§L薇雅的名字意为编织者，而她最擅长编织的，便是联盟中心这片错综复杂的政治蛛网。在风声河谷的议会中，每一个微笑都可能藏着一份协议，每一次低语都可能是一场交易。薇雅深谙此道。她将自己真实的悲伤与愧疚深深隐藏在自信甚至略显轻浮的面具之下，用最迷人的言辞争取盟友，用最锋利的语言瓦解对手。对她而言，议会就是她的战场，而言语，便是她最致命的武器。§!"
EWW_lyzz: "落叶之重"
EWW_lyzz_desc: "§L风声河谷的安逸，是用叶落边境的尸骸换来的。落叶之灾不仅摧毁了叶奈氏族的家园，更在其每一个幸存者的灵魂上烙下了永恒的伤痕。作为在灾难发生时缺席的领袖，薇雅背负着最沉重的愧疚。风逐者的精锐已在战火中凋零，如今的部族只是一具空有荣耀之名的残影。每一次政治上的胜利，都会让她想起那些再也无法分享这份荣耀的族人。复兴氏族、告慰亡魂的重担，比任何王冠都更沉重。§!"
EWW_fzhy: "风中的回音"
EWW_fzhy_desc: "§L薇雅的目光，从未真正停留在风声河谷的繁华之上。她所有的谋划，最终都指向一个地方——那片由她妹妹莉芙所守护的叶落边境。她利用自己编织的情报网络，时刻关注着边境的每一丝风吹草动。妹妹的每一次胜利都让她欣慰，每一次险境都让她心如刀绞。对薇雅而言，莉芙不仅是她最后的家人，更是她所有政治抱负的最终归宿。守护那道在狂风中孤独摇曳的微光，是她作为编织者，必须完成的、最重要的一幅作品。§!"
