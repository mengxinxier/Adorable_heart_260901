 #四季盟约
  ELF_invite_FROM_add_to_FourSeasons: "邀请[FROM.Getflag][FROM.Getname]加入£FourSeasons_text_icon §9四季盟约§!"
  ELF_FourSeasons:"£FourSeasons_text_icon §9四季盟约§!"
  ELF_FourSeasons_desc: "§L四季盟约是一张网，一张用善意和利益编织起来的、足够结实的网。\n\n你看，奈瑞丝需要一个舞台来施展她的光明，希露需要更广阔的市场来填满她的金库，而我可怜的妹妹……她什么都不需要，除了活下去。\n\n她们都有各自的季节，也都有各自的匮乏§!。"
  EWW_ljkd_tt: "创建§Y经济同盟§!--£FourSeasons_text_icon §9四季盟约§!"
  ELF_FourSeasons_tt: "§L我们将解锁决议邀请§Y阵营§!内其他国家加入£FourSeasons_text_icon §9四季盟约§!，成员国越多，£FourSeasons_text_icon §9四季盟约§!给与我们的修正越高。§!"
  FourSeasons_dipo_Title: "§9四季盟约§!"
  ELF_FourSeasons_Title: "£FourSeasons_text_icon §9四季盟约§!"
  ELF_FourSeasons_leader: "£FourSeasons_text_icon §9四季盟约创立者§!"
  FourSeasons_TT: "[GET_FourSeasons_modifier]"
  FourSeasons_dipl_TT: "§Y[From.GetNameDef]§!的经济同盟属于£FourSeasons_text_icon §9四季盟约§!\n\n[GET_FourSeasons_modifier]"
  FourSeasons_desc: "£FourSeasons_text_icon §L在这片广阔的大陆上，没有哪两片林地的雨季是同时到来的。当丰沛的雨水滋养着河谷的沃土，灼热的骄阳或许正炙烤着远方的高原。孤独的部族无法对抗天时的无常，因此，我们立下了£FourSeasons_text_icon §9四季盟约§!。\n这是一个为了守护与共同繁荣而立下的古老誓言。我们承诺，将雨季多余的果实，送往旱季干渴的餐桌；将山脉深处的矿藏，交换沿海部族渔网中的丰饶。§!"

  FourSeasons_leader_TT: "£FourSeasons_text_icon §9四季盟约§!现在的成员国数量为§L[?global.num_of_FourSeasons]§!。\n[GET_FourSeasons_leader_modifier]"
  FourSeasons_modifier: "£FourSeasons_text_icon §9四季盟约§!产生的修正为：\n-$MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-10.0%§!\n-$MODIFIER_GLOBAL_BUILDING_SLOTS_FACTOR$：§G+15.0%§!\n-HCP收入增加§G10%§! £hcp_small /月"
  FourSeasons_leader_modifier: "£FourSeasons_text_icon §9四季盟约§!产生的修正为：\n-$MODIFIER_PRODUCTION_SPEED_INDUSTRIAL_COMPLEX_FACTOR$：[?global.ELF_FourSeasons_leader_production_speed_industrial_complex_factor|%+=]\n-$MODIFIER_GLOBAL_BUILDING_SLOTS_FACTOR$：[?global.ELF_FourSeasons_leader_global_building_slots_factor|%+=]\n-$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$：[?global.ELF_FourSeasons_leader_production_speed_buildings_factor|%+=]"
