    NGD_throne_lies_vacant_desc: "眼下，一个长期未决的问题需要我们解决：自复明以来，王座长期空虚，过去一直是郑大人和秦大人主持军政事务，但如今光复中华，在新大陆，我们尚可以天子需为中华之民搪塞而过，如今中华之事已定，我们必须即刻商讨天子之事"

    NGD_fire_keeper_desc: "虽然我们尊皇之心可昭，但我们遍访山川，还是无从找到高祖、成祖等子嗣后裔。天下不可无主，郑大人过去曾受封赐姓，乃当今国姓爷，更是他带领众多文武百官自海外归乡复大明疆土，功垂千古。经商议，郑大人将接受百官劝进，登基称帝，承大明基业而广之。"
    NGD_hierarchical_order_desc: "中华大地长期的纷乱便来自尊卑之序颠倒，大量的所谓进步派人士如在我国境内妖言惑众，裂土封疆，实可恨也。我们来自新大陆的众位百官也希望能够有所地位。新皇有旨，我们将重建士农工商的阶层秩序，尊卑有序，天下才能大定。"
    NGD_militarized_production_desc: "当下中华大地秩序混乱，要重建秩序，必须重建生产。长期的混乱导致国内人心散乱，非军法不可定。要稳定秩序，我们就必须以军事化的模式约束生产，以此安人心，平祸乱。"
    NGD_everyone_does_their_duty_desc: "要稳定当前混乱不堪的政务部门，我们便需要依仗众多归附的旧官僚，但有些人是否真心拥戴我们尚未可知，我们首先需要考验她们的忠诚，政府将依仗大明律对当今官员进行考核和审查，如恪尽职守者，有赏，如玩忽职守者，当罚。"
    NGD_stimulate_martial_gene_desc: "自我大明出国之后，中华大地饱受外族欺凌，为何？皆乃民众失了尚武之风，只愿为偏安饿殍，宁为外族奴仆也不愿起身反抗，而我大明孤忠于海外重拾尚武之风，人人有枪，就能反抗法兰西人的无耻入侵，这便是差距。我们必须重新塑造大明子民的尚武之风，方能聚人心，抗外辱。"
    NGD_develop_courage_desc: "我大明子民当有骨气，而骨气并非天生，更来自长期的教育。当今时代众多诗书礼仪皆为外族叛逆所篡改，毫无民族性和血性培养可言，我们当重拾公羊等春秋礼法，教民以十世百世之仇，唤醒她们为大明，为国耻复仇之心。"
    NGD_shooting_club_desc: "眼下有一桩事务亟需解决，我们的西归之军民在归国之后，将在新大陆上拥枪的习俗也带了过来，但国内仍需重建，回收武器，如果人人拥枪，社会治理仍有不便。考虑到我们的现状，我们将广设射击俱乐部，教喻我国子民于此学习用枪，在教会她们战斗的同时约束地点，可谓一举两得。"
    NGD_patriotic_dedication_desc: "当今世界，我国最需要的便是如岳武穆一般精忠报国的能战敢战之士，岳武穆对天子忠心，敢于兴兵讨贼复国，虽受奸臣陷害而不悔，天下之楷模也。我们将号召天下子民效法岳武穆般尽忠报国，为大明效死。"
    NGD_prove_ourselves_desc: "回顾往昔，大明从新大陆西海岸的一隅之地，复兴为横跨大洋，统治两片大陆的超级帝国，我们已经站在历史的风口浪尖。而这一切都离不开天子郑陛下的英明领导。\n\n如今若是从空中俯视，中华和与新大陆之地龙旗招展，处处都有赞颂天子仁政的子民，中华屈辱之过去历史已往矣，新郑明已修正了历史的错误，大明之天下无双，大明之明万古长存。"

    NGD_chosen_one_desc: "自古以来，天人感应，郑大人本就无心皇位，如今真龙降世，神异万分，且其人谈吐不凡，有天子之气，当为当今天子。经百官劝进，大明天命将归属真龙，重振大明天下。"
    NGD_traditional_morality_desc: "当今天下，人心丧乱，纲常伦理也被置若罔闻，如今天子登基，我们必须重建秩序，首先就要安人心，平祸乱，天子将带头祭天祭祖祭孔，以示我大明重视传统道德之事，安天下人心。"
    NGD_loyalty_to_the_emperor_and_nation_desc: "自旧明以后，中华大地已经出了多位天子，各种社会主义、三民主义等思想让中华百姓茫然无措，已不知当今真龙为何物，我们需要重塑思想教育，教喻百姓以忠君爱国，我大明才是中华正硕，伪帝乱党人人得以诛之。"
    NGD_free_market_desc: "要重新恢复中华大地上经济的生机，便需要中华大地能够市场发展的力量，如果我们管的太宽，中华和北美大地的商人和企业们便无法真正实现资源上的联合，我们必须放宽市场管制，给予足够的鼓励性政策和补贴，让众多的商人们慷慨解囊。"
    NGD_stimulate_consumption_desc: "仅仅靠商人们掏钱是不够的，我们也需要给她们足够的回馈，才能让她们持续投资。经天子恩准，我们将进行多年的免除田赋，让我们的子民们足以积累下资金，有足够的资金进行消费"
    NGD_cultivate_the_middle_class_desc: "自近代以来，中华的大城市便形成了广泛的市民中产阶层，这些中产阶级更重视稳定，不愿意造反，而且有一定的积蓄，足以支撑中华的市场自由化发展。我们应当重点扶持这一阶层的生长，成为我国社会和经济的关键基础"
    NGD_reform_civil_service_exams_desc: "在过去，我国长期坚持八股取士，但在如今，从四书五经中取材的八股完全无法适应当今世界的万千变化。哪怕蒋氏伪帝都知道效法泰西进行现代化取士，我们为何要固步自封？我们将取消八股取士，构建现代化的适应我中华的科举制度"
    NGD_reconstruct_historical_identity_desc: "击灭逆党之后，我们便需要为其重修朝代历史，在她们修的历史中，我们被流寇夺下天命而失天下。我们需要对此进行修改：我们只是暂失其鹿，如今我们自新大陆再定中原，当今天子更是真龙降世，正是大明中兴之兆，我们从未失去天命，只是暂时失败而已。"
    NGD_virtue_of_labor_desc: "很多社会主义者、三民主义者都号称只有她们才能唤起劳动者的美德，实乃谎言。别的不说，我大明徐尚书光启所著的《农政全书》便多有以农为本、勤劳立国、厉行节俭等劳动美德，我们将遍访古籍，宣传我先祖之劳动美德，砺我大明美德之风。"
    NGD_hold_the_reins_desc: "欲速则不达，如果我们对中华大地上的商人群体大肆让利，很可能让她们形成一个新的商业群体，反而与我们在新大陆的商人群体们争利，造成两大陆之间的冲突，反而会得不偿失。必须以皇家所有制和户部力量握紧市场秩序，以强力和规划逐步恢复中华经济，才能实现长治久安。"
    NGD_organized_industry_desc: "长久的分裂让中华大地上工业发展极不平衡，大量的企业集中扎堆于沿海地区，我国南部和西北边疆的工业极为稀缺，需要政府长期补贴，我们将在这些边境地区重建工业基地，保证我国工业分布的平衡有序。"
    NGD_rule_by_local_gentry_desc: "自古以来，皇权不下乡，我们也没法将广大的乡村完全掌控。最好的方法还是交给乡村的乡贤群体，官府给予她们一定的辅助官职和地位，让她们在乡村施行保境安民之责，保我大明亿万百姓无忧。"
    NGD_regain_the_glory_of_ming_dynasty_desc: "当下，我们在中华的统治彻底得到稳固，新君每日得享万民百官三呼万岁，在大明的阅兵式上，成千上万百姓为我大明雄兵欣喜若狂，欢呼喝彩。皇朝之火德已被重新点燃，大明复兴正如燎原之火般传遍四方，我大明，天下无敌啊！"

    NGD_back_to_homeland_desc: "随着复兴工作的开始，第一步便是要寻根。我中华儿女自古以来便是安土重迁之人。众多海外华人华官都需要有个地位，我们要安排好她们在新政府中的地位。同时，新朝的首都之事也需要定夺下来，是效法成祖定都北京，还是效法太祖定都南京等，都需要有个结果。"
    NGD_reaffirm_orthodoxy_desc: "受当今社会混乱的影响，我军虽收编的中华之军大多思想混乱，你能想象成千上万个没有思想甄别和效忠的军人混杂在我们的军队中吗？者必须得到制止，我们将出台新军法，所有的士兵和军官都应参与皇明教育，对当今天子表示效忠，明确我大明才是中华正统，否则就滚出军队。"
    NGD_consolidate_legitimacy_desc: "我大明虽是海外朝廷，却时刻是中华天朝，对于前朝的归附官员和宗室，我们会册封官职，赏银赐官以纳之，愿对天朝多加赞誉者，可多加赏赐，抵抗者则杀之。相信有了她们为榜样，更多的人都会站到天子一边。"
    NGD_reassure_the_public_desc: "在我军攻伐伪朝逆党之际，我军对各地多有劫掠，如今新朝当定，天下皆是大明之子民，我们绝不能再动刀兵。朝廷将下发历法文书在各地安抚人心，恢复生产。并对各地土地进行重新分配，尽可能做到公正分配，降低各地百姓对大明天兵的抵抗。"
    NGD_damage_assessment_desc: "中华大地的重建需要早日提上日程，但我们不可盲目进行，中华之大不下于新大陆，如果贸然重建只会大费周章却收效甚微，到时候牵连东明大地，得不偿失。我们最优秀的财务官将对各地进行损害评估，制定一个分级多期的重建计划，保证我们的每一分钱砸下去都是有价值且高效的。"
    NGD_post_war_recovery_desc: "经过计划制定，我们的复兴计划提上日程，我们将效法东明重建之事，首先对劳动力主要从业行业进行恢复，部分重建各地重工业，改善交通和运输，重订各地标准，并伺机照顾拥戴我大明天兵之士绅，及时回馈资源和人力与东明。"
    NGD_revival_of_Ming_desc: "经过稳步的重建工作，大明官场秩序得到重建，各地官员纷纷上表庆祝新皇雅政，各地百姓对大明的拥戴之声日盛。中华各地的复兴也有效带动了东明之地的市场繁荣。大明复兴之事蒸蒸日上，接下来可以把眼光放得更远一些了。"

    NGD_waking_the_dragon_desc: "长期以来，由于近代之后中华的积贫积弱，我中华原有的朝贡势力各个都自成一国，西方各个强国都曾入侵我国边疆，掠取财富和领土。如今我大明回来，自是要昭雪百年国耻。正硕已归，世界当听中华大地真龙长吟！"
    NGD_horse_herder_desc: "从历史上说，如今的世界上所称呼的所谓所谓小马群居之地历史上都是我中华西域各朝贡国，自我大明东狩之后失落四方。如今我们回来了，自是要收回此地，重建西域都护府。"
    NGD_legacy_frontier_desc: "西南的天南之地从历史上说一直都是我国边陲和藩属，但可恶的圣杯贼寇利用我国分裂之际，支持她们的傀儡强掠了这些土地。我们绝不接受这种所谓国际裁决，属于我们的就是我们的，是我中华先祖传承下来的，我等子孙后代当收回此地，关泰西人何事？"
    NGD_aim_at_the_Yuan_desc: "蒙古人一直是我们的大敌，自元以来我们便不断与蒙古人交战，她们的野心从未结束，哪怕是现在，她们甚至甘愿去找什么白军、什么狼王来继续与我们为敌。但现在我们的兵力远胜她们，我们将发起漠北远征，彻底扫荡草原，粉碎这些家伙复元的所有野心。"
    NGD_bear_infestation_desc: "外东北之地虽是满清旧地，但满清祖上各部历史上也曾臣服我们，理应属于我们所有，但这些地方如今却被俄国人以及属下各部所控，她们不会轻易让出土地的，我们只能靠武力打碎她们的企图，才能收回祖先旧地。"
    NGD_no_rental_desc: "如果说俄国人是强盗，那圣杯人就是贼了，她们像曾经的伊比利亚人一样，假借租赁之名强占了我国东南宝岛，沿海大城，还号称要租赁百年。真让她们的诡计得逞，这些地方我们便一辈子都收不回来了，我大明绝不割地，这些所谓的租界必须立刻解散，否则我们就动兵去收。"
    NGD_loyalty_of_Korea_desc: "三韩之地长久以来都是我大明忠实的藩属，即使是东狩之时，她们也继续对中华保持着效忠，直至被樱花侵略所打断。如今她们有了所谓的独立，但就她们的弹丸之地，如无我们保护，她们只会再次被樱花侵略奴役。考虑到我们之间的历史往来，我们将彻底结束她们的存在，纳其地入我大明疆土。"
    NGD_heroically_stands_in_the_universe_desc: "内灭群雄，外讨诸戎。世界的中心再次聚焦于东方，我大明自海外如闪电般归来，重整河山，再塑华夏。我们的胜利已经超出了世界上所有人的想象力，亚洲的秩序也将为我大明所重塑，我们将进一步向南扩张，完成对整个亚洲的掌控，新的大明天朝秩序将彻底取代圣杯、樱花等旧势力的殖民时代秩序，中华天命已然复归，中华再一次雄立于宇宙之间，成为世界的领导者。"
