	  #朱德
    NGD_news.001.title: "$news_event_background$远洋革命"
    NGD_news.001.desc: "近日，从远洋共和国传来一则震惊世界的消息--元帅朱德带领红军进入了辰龙京，占领了内阁大厦并用电台向全国发表演讲，宣告了无产阶级专政的建立。\n\n在演讲中，朱德细数了旧政府的虚伪与罪恶，并宣称共产主义将拯救这个饱受经济危机折磨的国家。\n\n这个昨日尚且繁华的商业国家，一夜之间变为了共产主义的先锋，世界各国尚未发表评论。大家正忧心忡忡地观察着日益紧张的北美局势。"
    NGD_news.001.a: "这是“虚伪共和国”的末日。" 
    NGD_news.001.b: "这是共产主义插着新大陆的钉子。"
    NGD_news.001.c: "共产主义的幽灵来到了新大陆。"
    NGD_news.001.d: "共产主义的幽灵来到了新大陆。"
    NGD_news.001.e: "希望她们不会与我们为敌。"

  	#远洋进步党
    NGD_news.002.title: "$news_event_background$远洋的新政府"
    NGD_news.002.desc: "近日，远洋政府宣布进行内阁改组。\n\n在经历首都的暴乱之后，新任领导人甘雨进行了全国讲话，宣布推行民主化改革，以社会民主主义为纲领，实行倾向工人的政策，远洋将成为一个模范的温和社会主义国家。\n\n这个昨日尚且繁华的商业国家，一夜之间变为了社会主义的拥趸，世界各国尚未发表评论。大家正忧心忡忡地观察着日益紧张的北美局势。"
    NGD_news.002.a: "迈向进步民主" 
    NGD_news.002.b: "资产阶级的改良把戏"
    NGD_news.002.c: "自由世界的新成员"
    NGD_news.002.d: "过家家似的民主"
    NGD_news.002.e: "希望她们不会与我们为敌。"

  	#远洋共和党
    NGD_news.003.title: "$news_event_background$远洋的新政府"
    NGD_news.003.desc: "近日，远洋政府宣布进行内阁改组。\n\n在经历首都的暴乱之后，新任领导人景元进行了全国讲话，宣布推行民主化改革，放款税收，实行自由宽松的经济政策，辰龙京将成为世界贸易的金融中心。\n\n这个昨日尚且繁华的商业国家，将继续沿着过去的道路前行，世界各国尚未发表评论。大家正忧心忡忡地观察着日益紧张的北美局势。"
    NGD_news.003.a: "迈向自由民主" 
    NGD_news.003.b: "又一伙剥削者"
    NGD_news.003.c: "自由世界的新成员"
    NGD_news.003.d: "过家家似的民主"
    NGD_news.003.e: "希望她们不会与我们为敌。"

  	#远洋民主党
    NGD_news.004.title: "$news_event_background$远洋的新政府"
    NGD_news.004.desc: "近日，远洋政府宣布进行内阁改组。\n\n在经历首都的暴乱之后，新任领导人凝光进行了全国讲话，宣布推行民主化改革，提高关税壁垒，实行贸易保护的经济政策，国家将会成为本国商人的后盾\n\n这个昨日尚且繁华的商业国家，开始保护自己的市场，世界各国尚未发表评论。大家正忧心忡忡地观察着日益紧张的北美局势。"
    NGD_news.004.a: "迈向自由民主" 
    NGD_news.004.b: "又一伙剥削者"
    NGD_news.004.c: "希望还能和他们做生意"
    NGD_news.004.d: "过家家似的民主"
    NGD_news.004.e: "希望她们不会与我们为敌。"
