#### - 远洋国策 - ####
  ### - 黑色星期二 - ###
    NGD_raise_the_tower: "起朱楼"
    NGD_raise_the_tower_desc: "在过去的数百年间，伴随着金矿的发现和圣杯的巨额投资，我们远洋获得了飞速的发展，我们将这一时期称作‘咆哮年代’，随着咆哮年代的经久不衰，我们看着过去的矿业小镇，偏远落后的小渔村消失不见，摩登大楼拔地而起，我们相信，咆哮年代永不结束！"
    NGD_banquet_guests: "宴宾客"
    NGD_banquet_guests_desc: "让我们宴请四方宾客！欣欣向荣的远洋共和国与我们如火箭般飞速增长的经济让我们有着足够的自信去邀请全世界的投资者，让我们向全世界的所有资本敞开大门！让我们和善的朋友们走进我们的宴会厅，让我们在合同签订的晚宴上共同举起酒杯！"
    NGD_tower_collapses: "见楼塌"
    NGD_tower_collapses_desc: "完了，完了，全部都完了，我们的经济完全依赖于过去繁荣的市场和外国投资，但随着黑色星期二的到来，我们大厦的基石终于崩塌，我们只能这么看着过去庞大的体系在一瞬间倾倒，没有人知道明天该怎么办，现在，可能唯一明确要做的事是把高楼的天台都封住"

    NGD_emergency_intervention: "紧急干预"
    NGD_emergency_intervention_desc: "黑色星期二到来后的一连串影响已经完全证明了过去一贯自由放任政策的错误，我们已经无法承受再一次的失败了，过去一度被自由市场理念迷信者们弃如敝履的国家干涉政策将被我们再次拾起，以积极的财政政策和激进的行政手段来对现如今的经济形势进行紧急干预是此刻的应有之义"

    NGD_progressive_new_deal_of_Ganyu: "甘雨的进步新政"
    NGD_progressive_new_deal_of_Ganyu_desc: "在合作刚开始的时候，有很多守旧的民主党党员对把领导权交到这么一个有着浓重红色气息的政党手中持怀疑与警惕态度，然而首都暴乱让他们明白了这么一个事实：要么我们主动赋予穷人权利，要么穷人们会自己夺取权力。现在，让我们把领导对抗这次危机的权力交给这位在工人与农民中受到广泛欢迎且愿意走温和路线的年轻人甘雨，她坚信，我们的国家若要进步，发展的脚步不能落下任何一个人"
    NGD_industrial_production_adjustment: "工业生产调整"
    NGD_industrial_production_adjustment_desc: "过去毫无监管的工业运行模式已经被完全证明是一场灾难，远洋的工业生产体系必须得到调整，企业家们再也不能通过无限制的降低安全保障和压缩成本制造大量的廉价工业品来扰乱市场了，严格的监管将保证像这一次的产品泛滥而工人们却买不起自己制造的产品的情况不再发生"
    NGD_subsidise_farmers: "补贴农民"
    NGD_subsidise_farmers_desc: "农民们把农产品运到市场上的售价还抵不上把这些农产品运过去的运费，这导致他们宁愿把玉米和小麦拿去烧火都不愿意出售，，我们将给予农民一定量的补贴以保证农产品市场的稳定和农民的利益"
    NGD_reform_the_financial_industry: "改革金融业"
    NGD_reform_the_financial_industry_desc: "金融市场无序扩张的时代结束了！劣质的次级贷款，金库里有一块钱就敢贷一百块钱的银行，敢给一个项目上十八层叠加保险的保险公司，这些乱象就是本次经济危机的根源，自由市场的狂信徒们用自己的行为证明了自己和那些当人肉炸弹的宗教疯子没什么区别。哦不对，他们的危害还更高一些！金融业必须得到改革，金融监管体系将惩罚每一个敢于脱离管控的资本"
    NGD_revitalize_market_confidence: "重振市场信心"
    NGD_revitalize_market_confidence_desc: "现代市场是信用的魔术，信心才是现代金融最有价值的资产，我们必须重振投资者们对市场的信心，第一步就是开放银行取款，由央行买下那些不能倒下而又濒临破产的银行"

    NGD_protectionism_of_Ningguang: "凝光的保护主义"
    NGD_protectionism_of_Ningguang_desc: "毋庸置疑，政府需要改变，但太过剧烈的改变会彻底撕裂我们的政府，让野心家们有机可乘。因此，我们选择了相对稳重的凝光小姐，由她来决定我们下一步的经济发展方向。\n\n要想解决政府所面临的经济危机，我们就必须改变原有的经济政策，如果继续坚持原有的自由贸易政策，任由圣杯、法国等外来资本继续冲击我国市场，我们还是无法度过这场危机。与其照顾别人，不如优先管好自己。因此，凝光小姐已经决定，政府将转向贸易保护主义，在世界都处于危机的关头，我们要优先照顾本国的国民和资本。"
    NGD_reduce_imports: "减少进口"
    NGD_reduce_imports_desc: "在过去，远洋的繁荣岁月离不开圣杯资本的流动，离不开世界市场的有效运行。但在当下，世界市场反而变成了祸害，过多的进口挤占了我国资本的份额，值此危机期间，外部资本甚至还想将我国作为缓解危机的出口。因此，我们必须对这些外部资本加征高额关税，如果她们想再利用我们，就得先付出足够的代价。"
    NGD_work_relief: "以工代赈"
    NGD_work_relief_desc: "要解决危机，就需要恢复我国市场的活力。但在经济危机所带来的破坏下，大多数人都失去了工作，居无定所。她们一贫如洗，流落街头，如果百姓没有钱，我们的社会就不会稳定，市场的信心便无法恢复。因此，我们需要组织起一批公共建设活动，吸纳社会上的失业者参与建设，通过这种以工代赈的模式，在改善社会治安的过程中改善社会秩序，从而让资本放心，让经济更稳定。"
    NGD_clean_up_corruption: "清查腐败"
    NGD_clean_up_corruption_desc: "很明显，这次危机之所以能在我国造成如此之大的破坏，很重要的原因之一就是我国政府内部有些人贪赃枉法，为外国资本大开方便之门，却对我国资本处处刁难。如今要进一步挽回人心，我们正需要借她们人头一用，让公众看到我们的改革之心。"
    NGD_gradually_restore: "恢复运作"
    NGD_gradually_restore_desc: "在一系列紧急干预措施之后，我们的经济虽然不能一瞬间恢复黑色星期二之前的无尽繁荣，也总算是恢复了其正常运转，而我们陈旧的政治体制与政府机构也终于在这一次的紧急干预中重新运转起来"

    NGD_maintain_heading: "保持航向"
    NGD_maintain_heading_desc: "欧陆那边有个经济学家说的好，政府对市场的过度干预与管制会诞生极权主义独裁者。如果我们真的对市场大加干预，甚至不惜与那些自称是社会主义者的红色议员们妥协，那才是真正会让我们引以为傲的民主制度就此毁灭。防共高于一切，我们必须在保持原有的经济制度不变的基础上，对其进行小修小补，市场的力量自然会让我们度过这场危机。"

    NGD_be_in_the_same_boat: "同舟共济"
    NGD_be_in_the_same_boat_desc: "欧陆那边有个经济学家说的好，政府对市场的过度干预与管制会诞生极权主义独裁者。如果我们真的对市场大加干预，甚至不惜与那些自称是社会主义者的红色议员们妥协，那才是真正会让我们引以为傲的民主制度就此毁灭。防共高于一切，我们必须在保持原有的经济制度不变的基础上，对其进行小修小补，市场的力量自然会让我们度过这场危机。"
    NGD_small_scale_intervention: "小规模干预"
    NGD_small_scale_intervention_desc: "既然无法对原有经济政策作出改变，我们就要考虑优先稳定政府，避免那些红色议员、郑式权贵借机发难。由此，一部分共和党党内有识之士提出，应出让一部分利益，换取民主党在危机事务上的支持。毕竟利益还可以通过之后再争取，民主制度一旦崩塌，我们便一无所有。"
    NGD_crisis_response_alliance: "危机应对联盟"
    NGD_crisis_response_alliance_desc: "经济危机所引发的社会动乱给我们的治理和管辖增添了太多麻烦，而混乱又使得我们无法进行政府扩招，行政效率被迫下降。要进一步的解决问题，我们便需要和民主党进一步协商，拉拢她们中的一部分人，与我们共同组成危机应对方面的联盟，她们可能不喜欢我们，但她们更不会喜欢那些独裁者的。"
    NGD_unemployment_relief: "失业救济"
    NGD_unemployment_relief_desc: "在过去那个经济咆哮腾飞的时代，每个人哪怕不找什么工作，仅靠贷款都能得到好的生活。但在眼下危机到来之时，很多人都因付不起租金而流落街头，成为社会不稳定的因素。我们不会给她们还贷，但我们可以给她们一个机会，政府会给她们最基本的饮食，和一份长期政府公共事务的工作，相信有了出路，她们至少不会游荡作乱。"

    NGD_boat_cruises_alone: "孤舟游弋"
    NGD_boat_cruises_alone_desc: "很明显，民主党那帮野驴根本没法信任，她们表面上想和我们媾和度过危机，实际上恨不得利用危机把我们的人都踹下台，让她们的人取而代之。当前的局势证明仅靠我们便可以打垮那些极端势力，那我们更不需要和民主党进行什么联手了，我们自己就可以解决经济危机！"
    NGD_arrest_peculators: "逮捕投机商"
    NGD_arrest_peculators_desc: "虽然市场自己可以解决绝大多数的问题，但至少我们要给社会一个表面上的交代。当下，在大量过剩的产品被工厂、企业自主销毁以减产的过程中，仍存在着大量的投机商与外国资本勾结引入外国的非法产品销售，这些破坏市场自主性的人必须被抓起来，任何扰乱市场自救的人必须被绳之以法！"
    NGD_crush_radicals: "粉碎激进分子"
    NGD_crush_radicals_desc: "这次经济危机让很多人的野心暴露无余，那些所谓的红色议员、魔法天才，一个个都想着颠覆民主制度，以野蛮的共产主义取而代之，那百年前便退位的郑氏更是贼心不死，试图在现代复辟君主制。但她们不会再有机会了，我们将以比她们更激进的手段摧毁她们，为保卫民主与宪法，此乃必要之恶。"
    NGD_pacify_entrepreneurs: "安抚企业家"
    NGD_pacify_entrepreneurs_desc: "在我们摧毁那些社会激进分子的过程中，一些远道而来的企业家受到了惊吓，她们担心我们保卫民主的必要活动破坏了正常的营商环境，会让她们无法正常经营。对此，我们需要对这些人进行必要的安抚，只要她们愿意接受政府必要的法令管辖，乖乖交税，我们的经济中就有她们的一席之地。"
    NGD_believe_in_invisible_hand: "相信看不见的大手"
    NGD_believe_in_invisible_hand_desc: "如今，一种歪理邪说正在社会上传播，它以海对面的红色苏联作为范例，号称社会主义、计划经济是可以完全规避经济危机，实现社会繁荣的最终答案。对此我们表示:放屁！苏联只是个穷鬼国家，完全无法与我国这样物产丰富，经济繁荣的社会相比，正是百年以来的市场自由竞争才让我们获得了繁荣，我们要是真对着经济指手画脚，那只会让危机继续下去，只有相信市场自发纠正的力量，经济才能重获生机。"
    NGD_return_to_stability: "回归稳定"
    NGD_return_to_stability_desc: "我们的选择是正确的，随着外部危机的逐步减退，世界市场上的资本、资源重新开始流通，那些破坏者慢慢的都消失了，市场的秩序重新得到恢复，我们的产品也再次远销海外，民主制度证明了它的生命力。接下来，我们可以适当将精力转向别的领域了。"

    NGD_co_op_capitalism: "合作资本主义"
    NGD_co_op_capitalism_desc: "合作资本主义是一种不改变其资本主义剥削本质但远优于那些只知道一味剥削与压榨的资本主义形态，在这一理念下无产阶级虽然还是会被取走剩余价值，却至少能保证自己的生活水平，且其意见也能得到足够的聆听与反馈，虽然这与甘雨，与进步党所期望的那个社会主义的愿景相比仍显不足，但就远洋现在的情况来看，这已经是最好的选择了"
    NGD_support_trade_union_movement: "支持工会运动"
    NGD_support_trade_union_movement_desc: "工会一度被视为暴徒们的巢穴，显然这一理念是完全错误的，实践已经证明，要么你让工人们自己去组织工会，要么工人们背着你去组织共产党，无论是基于合作资本主义延续的必要，还是从更广大无产阶级利益的基础出发，工会运动都是有必要被鼓励的"
    NGD_rural_construction_movement: "乡村建设运动"
    NGD_rural_construction_movement_desc: "乡村，农民，这是一切的起点，是我们从遥远故乡携带而来的基因，我们必须面对这么一个事实，即在咆哮年代那奔腾的引擎声中，乡村被我们有意无意的忽视了，数以万计的农民，他们的声音被掩盖在金融市场的钟声之下，现在，让我们把眼睛从股票交易所的大荧幕挪回脚下的土地，让我们把资金从大城市流向乡村！"

    NGD_authoritarian_capitalism: "威权资本主义"
    NGD_authoritarian_capitalism_desc: "凝光大人长期的稳定执政已经证明了，民主并不意味着软弱，无能，放任。相反，当面临外资恶意竞争之时，需要政府及时站出来抵御恶意，当遭遇危机之时，需要有一个强力的行政将其纠正，永续的民主必须依靠强力的威权作为自己的砥柱，才能不畏风雨，迎击来自四面八方的挑战。"
    NGD_establish_industry_ministry: "设立工业部"
    NGD_establish_industry_ministry_desc: "随着我国疆土的进一步扩大，原有的国家经贸部门在管理庞大疆土上的众多工业，国家集团性的工业竞争也需要我们进一步统合全国的工业进行竞争和治理。因此，我们将把工业部门从经贸部门中拆分出来，作为专门的部门进行规划，这个新生的工业部将成为未来我国工业发展的心脏。"
    NGD_bureaucratic_system_reform: "官僚体制改革"
    NGD_bureaucratic_system_reform_desc: "虽然我们治下的人民从以前就是包罗万象，各族都可以在我们的统治下登堂入室，但当我们统治了一片广大的国土之后，我们便需要重新规划我们的官僚体制，要保证新制度下民主制度仍能够对地方的掌控，我们就需要对原有的官僚体制进行改革，让各民族的民众有同等的机会加入我们的政府，参与政治活动。老旧的官僚家族如果不能适应新血液的涌入，她们也该为新人让路了。"

    NGD_laissez_faire_capitalism: "自由资本主义"
    NGD_laissez_faire_capitalism_desc: "从漫长的历史来说，资本主义从来便是世界的主流，特别是我们这样坚持自由价值观的国家。强硬的政府只会损害个人权利，威胁我们的民主制度的生存。因此，我们不应该再多对市场、对社会作出更多的干预，而应该更多的保护个人权利、商业利益，当我们能够实现各级政府不受任何约束的自行其是的时候，我们就将成为人类最自然、最完美的政府"
    NGD_reduce_market_intervention: "减少市场干预"
    NGD_reduce_market_intervention_desc: "很多时候，正是政府对市场经济过多的指导才导致了市场秩序的混乱，特别是那些极权国家，她们对经济和市场的指指点点酿造了更多的经济灾难。我们不会像她们一样，我们不会去搞什么指令性经济，我们在经济中更多的是一个领路人，我们帮助所有人参与竞争，而非扼杀她们的能动性。"
    NGD_perfect_competition_market: "完全竞争市场"
    NGD_perfect_competition_market_desc: "社会的每个阶层都有其地位，她们也都有参与竞争的地位和职责，但很多时候她们都受限于认知无法认识到这一点。我们会帮她们一把，政府将进一步放松市场方面的管制，让我们的市场为所有人敞开大门，获得一个取得成功的机会。"

    NGD_creative_spirit: "创新精神"
    NGD_creative_spirit_desc: "未来的时代是科技的时代，是创新的时代，正是创新所诞生的坦克，飞机让我们的装备发生了天翻地覆的变化，让我们的士兵在战场上获得主动，让我们的民众生活不断提升。而创新靠的是人，我们治下的人口千千万，哪怕只有一半人发挥她们的头脑，我们就能取得巨大的进步。我们将把创新精神作为未来教育和科研的重点宣传对象，为我们的民众开智。"
    NGD_research_investment: "科研投资"
    NGD_research_investment_desc: ""
    NGD_Wanhu_plan: "万户计划"
    NGD_Wanhu_plan_desc: "在我们远方的故土上，曾经有个叫万户的人，他梦想着探索头顶的太空，便将自己绑在一座充满火箭的椅子上试图飞上太空。很多人由此嘲笑我们是妄想的野蛮人，但他却早几百年向我们证明了一个道理，火箭是未来发展的关键。\n\n随着我们科研的深入，我们的科学家发现，如果我们能铸造一座强大的弹壳，为其添加足够的燃料，我们便可以将其飞上太空，甚至打击远在大洋之外的敌人。我们必须掌控这样的力量，我们将以万户为名，开启对火箭的深入研究。"
    NGD_Miss_Qiu: "邱小姐"
    NGD_Miss_Qiu_desc: "我们的科学家在原子能行业的科研中取得了巨大进步，她们将众多理论转化为一项关键的武器研发：这项武器外表呈球型，充满着像女性头发一样的管线，但它蕴含着足以毁灭广大地区生灵的巨大威力，哪怕一支大法师军队施法都难以匹敌其力量，我们必须全力推进这项武器研发，为保密，这项武器的代号将被命名为：邱小姐。"
    NGD_Galaxy_One: "银河一号"
    NGD_Galaxy_One_desc: "计算机科技在战争中已经证明了它巨大的运算功能，这项科技所带来的运算能力在国家治理和科技发展方面也带来了巨大的力量。我们也必须拥有这样的科技。为此，政府将启动名为‘银河一号’的超级计算机研发项目，在未来的计算机科技竞争中，我们必须拥有一席之地。"
  ### - 黑色星期二 - ###

  ### - 军事线 - ###
    NGD_rearmament: "重整军备"
    NGD_rearmament_desc: "经济危机的硝烟已经散去，当我们望向东方，刺骨的寒意扑面而来：齐亚德在疯子、军头、保皇贵族、流氓、极权主义者之间反复无常，法兰西的女王为所谓的归乡大计无所不用其极，就连一向温文尔雅的精灵都不再友善。曾经的世界秩序保护者圣杯仍在经济危机的痛苦中挣扎，这一次已经没人能保护我们了。\n\n从现在开始，我们必须拿起武器，重新建立起一支强大的武装，才能抵御强敌，甚至完成我们百年前未能实现的天命"
    NGD_increase_military_funding: "增加军事拨款"
    NGD_increase_military_funding_desc: "无论是训练还是打仗，都需要足够的资金投入。在以前，我们的工作重心是发展经济，军事拨款只是打水漂。但在当今的局势下，政府将专门进行拨款，为军事建设提供足额的资金。"
    NGD_ensure_supply_chain: "确保供应链"
    NGD_ensure_supply_chain_desc: "百年以前，我们的扩张便有赖于圣杯王国强大的工业生产供应出来的武器，离了她们，我们的手工作坊完全无法匹敌幻想乡搬迁而来的机器工业。如今我们也学会了进行长期有效的机器生产，我们将重新开启军用工业建设，这一次，我们也要用强有力的武器工业产业链打败她们。"
    NGD_production_license_for_military_materials: "军用物资生产许可"
    NGD_production_license_for_military_materials_desc: "虽然我们有着智慧而勇敢的人民，但我们的国土相较齐亚德都有所不足，更不要说东方的法兰西和精灵了。要打败她们，我们需要更多更先进的武器，我们的一些民营企业完全可以弥补这方面的不足，我们将开启广泛的招投标活动，拥有足够生产能力的企业将获得军用物资生产许可，成为我们军事建设的重要补充。"
    NGD_army_research_institute: "陆军研究所"
    NGD_army_research_institute_desc: ""
    NGD_equipment_modernization: "装备现代化"
    NGD_equipment_modernization_desc: "自伟大战争结束以来，世界上的武器装备也在发生巨大的改变。从我们与外界的交流来看，单兵武器正在更多的转向远距离速射，火炮的威力逐步增大，特别是新生的装甲，正从铁皮棺材向移动堡垒的方向转向。我们必须追赶这些武器现代化的潮流，绝不能落后，否则，我们一定会吃败仗。"
    NGD_new_style_rifle: "新式步枪"
    NGD_new_style_rifle_desc: "作为每个士兵最简单能够获取到的武器，步枪是我军战斗力最基础的保证。过往的步枪单发且容易卡壳，经过我们科学家们系统的改进，我们的新式步枪不仅结构更加紧凑，更加安全，而且制造更加方便。我们必须立刻将它推广开来，人手一只。"
    NGD_individual_throwing_weapon: "单兵投掷物"
    NGD_individual_throwing_weapon_desc: "在那场伟大战争中，面对堑壕给予防守方的巨大优势， 进攻方往往以火炮和各种投掷物予以回应。而我们在追赶先进军事经验的过程中，也对此进行了相关学习，我们的军需官最近便对相关支援武器进行了改进，新式的支援武器设计将有效提升我军的作战灵活性，为我军的军事活动提供更大便利。"
    NGD_artillery_development: "火炮研发"
    NGD_artillery_development_desc: "自诞生以来，火炮便是战争中当之无愧的主角，从古至今，有了强大火炮部队的军队总能在战争中具备优势。战争将至，我们不能继续抱着那些老旧的，火力不足、机动有限的老炮，新一批的经费已经到位，我们将全力开展新式火炮的研发"
    NGD_trial_rocket_launcher: "试作火箭炮"
    NGD_trial_rocket_launcher_desc: "在研发长距离身管火炮的过程中，我们的科学家们结合古代战争的教训和国外炮兵的经验，提出了将火箭连发装置和齐射装置安装上长距离身管火炮上的构想，如果能够成功，我们将具备最强压制能力的火炮。那就没什么好说的了，先研发，再制造！"
    NGD_mobile_infantry: "机动步兵"
    NGD_mobile_infantry_desc: "我国境内存在大量荒漠和高山，东海岸更是广袤的大平原，防守压力极大的也让我军同时难以开展快速机动。因此，部队摩托化便成为关键，我们必须为她们提供一切足以进行高速运输和战斗的载具，哪怕是自行车。"
    NGD_tank_upgrade: "坦克升级"
    NGD_tank_upgrade_desc: "作为战争中突破的矛头，一辆坦克能够在战场上生活而越久，越能为敌人造成更大的威胁。经过我军实战经验的统计，新一代的我军坦克应当具备无线电联络，反坦克能力甚至是防敌人空军压制的实战能力，这些要求很多，我们必须根据不同的要求进行分门别类的升级换代，让我军装甲部队足以应付战场上的需要。"
    NGD_self_propelled_artillery: "自行火炮"
    NGD_self_propelled_artillery_desc: "经过长期战争的考验，很多士兵们都提出了一个要求：能否战场打到哪，火炮就炸到哪？在过去这很难，火炮部队难以机动，但当火炮与装甲结合到一起，那便一切皆有可能。新研发的自行火炮不仅具备相当的速度，火力上更是佼佼者，有了它，我们的便可以在任何战场上，绽放死亡的莲华。"
    NGD_steel_giant: "钢铁巨兽"
    NGD_steel_giant_desc: "经过长期的战争，我们的装甲兵也面对了世界上更多国家更复杂的装甲部队，她们的装甲部队有着更恐怖的火力、更深厚的防护，要打败她们，我们的装甲也必须进一步更新，做到火力更强，装甲更厚，速度更快。"
    NGD_start_mobilizing: "开始动员"
    NGD_start_mobilizing_desc: "虽然以一敌十、敌百往往被人称颂，但在如今的战争中，更多需要战线上有足够的人，有了足够的士兵，我们才能进可攻、退可守。战争已经逼近我们的国土，没有人能够置身事外。从今开始，政府将开始预备役和初步社会动员，满足条件的人员必须应召入伍，进行适应性的训练。战争不等人，我们没有更多时间了。"
    NGD_expand_conscription: "扩大征兵"
    NGD_expand_conscription_desc: "随着周边局势更加紧张，原有的动员机制所能提供的人员已经竭尽枯竭，我们需要进行进一步动员了。政府将开启下调征兵标准，更多人将收到征兵令，为了胜利，每个人都要时刻准备为祖国献身。"
    NGD_nationalization_of_military_enterprises: "军工企业国有化"
    NGD_nationalization_of_military_enterprises_desc: "为实现战争的胜利，我们需要竭尽一切产能，但总有一些掌握在私人手上的军工企业违反法令以谋取私利。这种资敌行为必须被粉碎，我们将对这些军工企业进行完全国有化，它们的产能将全面转向武器生产和制造，以弥补我们产能上的弱点。"
    NGD_enter_wartime_state: "进入战时状态"
    NGD_enter_wartime_state_desc: "我国的第二轮动员已经到达极限，现在要赢得战争的胜利，唯有全社会全方面的动员：配给制将被启用，能源和资源必须优先供给军事用途单位，一切建设都需要优先转入军队...为战争的胜利，全社会必须咬紧牙关，直至我们的勇士们自远方奏响凯歌归来。"

    NGD_office_of_strategic_services: "战略情报局"
    NGD_office_of_strategic_services_desc: "从古至今，战争的胜败都离不开情报的支持，特别是随着周边局势愈发紧张，通过战略情报获取对周边势力的先机是必须的。为此，我们将挑选陆军中最精明强干的孩子们组成战略情报局，作为我们隐形的屏障。"

    ### - 陆军 - ###
      NGD_military_reform: "军队改革"
      NGD_military_reform_desc: "我们的祖先虽然来自一个战争历史悠久的国家，但百年来的和平所带来的武备荒废让我们的军队严重退化，新式装备武装缺乏，指挥层对如今世界上战争发展认识不足，军队更是长期成为了达官贵人的儿女们镀金的场所。但如今战争将近，这样腐败的军队完全无法对抗周边的强敌。因此，我们必须开展全方面的军队改革，全方面改变我们的军队，才能有效对抗外敌。"
      NGD_war_department: "战争部门"
      NGD_war_department_desc: "随着战争的阴云逼近，我们必须随时做好对周边的进攻和防御准备，如果我们准备防守，我们必须做好所有的防御准备，如果我们主动出击，我们必须准备好对预先地点的进攻准备，甚至我们还需要准备好对远方的法国和精灵进行全面战争。因此，必须改组我们当前的指挥层，成立专门的战争部，做好指挥层面的一切准备。"
      NGD_large_scaleexercises: "组织大规模演习"
      NGD_large_scaleexercises_desc: "计划虽好，但很多时候计划也只是计划，很多军队改革中的问题和经验都需要从实战中获取，但我们目前极其缺乏战争经验，我们的军队也不支持我们进行主动战争。好在我们还有一批优秀的参谋人士，她们向我们提出了建议：利用起我国大规模的国土场地，组织起大规模的军事演习，在演习中获取经验，修正错误。"
      NGD_remeber_the_rocky: "勿忘落基山"
      NGD_remeber_the_rocky_desc: "百年前，我们的祖先在落基山东部败于流亡此地的法兰西人，虽然有缺失圣杯支持的缘故，但关键问题在于山地战争的困难:落基山不少地方易守难攻，部队难以展开，面对法兰西人的优势兵力我们寸步难行。如今我们还要面对法兰西人的后裔，这一次我们必须吸取教训，在山地战争中快速行军、以优势火力压倒敌方防线，在快速突破作战中越过高山，扫荡敌人。"
      NGD_frontline_preparedness: "前线备战"
      NGD_frontline_preparedness_desc: "我国国防的另一大问题，在于几个重要的都护府直接邻近国境线，如果敌人突然对我们发动进攻，我们完全没有战略空间进行后撤。因此，我们必须重启边境地区的军事设施建设，有效保障我们的地区防备，让我们的前线部队做好一切准备，做到进可攻，退可守。"
      NGD_renew_combat_theory: "更新作战理论"
      NGD_renew_combat_theory_desc: "虽然我们历史上的军事理论仍不过时，但在具体到细节上的战争方面，老祖宗的兵法还是难以适应当前的战争，而圣杯、幻想乡等国的军事理论正好可以补全这一点的缺陷。我们应当及时引入和结合中西方的军事作战理论，并落实到我们的军官团教育中，让我们的部队能够及时适应战争的需要。"
      NGD_enhance_professionalization: "加强职业化"
      NGD_enhance_professionalization_desc: "我们虽然有一直数量较多的综合性部队，但受军队经商、企业渗透军队等问题，很多军事主官更愿意接受她们的直属家族、贵人等的指挥，而不是接受统一调配。为此，我们必须剥离她们的指挥权，我们的部队必须成为一支职业性的军队，通过统一的军制实现军政分离，这将在提高军队战斗力的同时，有效降低军队参政的威胁。"
      NGD_quantity_wins: "数量制胜"
      NGD_quantity_wins_desc: "在保障军队质量的同时，我们也必须保证前线士兵的数量，新大陆地广人稀的地理状况导致战线极其广阔，我们会需要在广大的战线上尝试进行突破和拉锯，军队的数量也将会是战争胜利的重中之重。因此，面对多种族的大规模征兵体制必须得到落实，及时困难众多，我们也需要保证士兵的数量。"
      NGD_ensure_logistics_support: "确保后勤保障"
      NGD_ensure_logistics_support_desc: "虽说皇帝不差饿兵，但我们的故国大明便亡于此，明末边军在后勤上缺衣少食，军饷也难以发送，才导致大量的边军投降闯逆和满清，此应为戒。我们必须构建起后勤兵体制，有效保障我们军队的后期，绝不能让南明故事再度重演。"
      NGD_modern_communications_technology: "现代通讯技术"
      NGD_modern_communications_technology_desc: "在参考伟大战争的经验和演习活动的教训过程中，对前线战场的评估成为了一项难题。我们的士兵在面临敌方冲击的时候总会出现情报传递的缺少，我们的指挥层在交战中缺少的一项情报便可能造成战争结果千差万别。所幸现代的通讯技术可以弥补这方面缺失，我们将尽可能在前线指挥部铺设电报系统，下发通讯设备，尽可能提高情报传递效率。"
      NGD_armor_tactics_research: "装甲战术研究"
      NGD_armor_tactics_research_desc: "近年以来，装甲战术正在全世界范围内传播，我们东方的法兰西人更是主动提出了不少新式的装甲突击战术。这项战术所提倡的装甲部队快速突破和合围战法正适合我们这样人口较少的国家。我们完全可以研究并参考她们的战术，青出于蓝而胜于蓝。"
      NGD_battlefield_queen: "战场皇后"
      NGD_battlefield_queen_desc: "要问在战场上什么样的武器所处可见，那就是步枪。哪怕各种各样的武器再多，我们也需要手持步枪的士兵去赢得胜利。因此，我们必须进一步完善我们的步枪，并推动我们的士兵在射击、维护、刺杀等多方面的步枪使用能力上的提升。"
      NGD_god_of_war: "战争之神"
      NGD_god_of_war_desc: "与我们隔海相望的苏联有个人说过一句话，火炮是战争之神，此话不假。在伟大战争中，哪一方拥有强大的炮兵火力，哪一方便能在进攻和防御中取得优势，我们的山地作战离不开专门的山炮支援，进攻和防守的弹幕覆盖都需要强大的火力保障。因此，我们需要建设一支强有力的炮兵部队，时刻为我们的部队提供最强大的火力支援。"
      NGD_king_of_land_combat: "陆战之王"
      NGD_king_of_land_combat_desc: "如果说在这一个时代，什么样的武器能够成为当之无愧的王者，那就是装甲。摩托可以进行有效的运输和侦察，机械化装备可以让我们的步兵在运输中保障对敌攻势，多样的装甲更是让我们具备了强有力的进攻势头，把握住这些武器，我们便拥有了未来。加速生产吧，我们绝不能落于人后。"
      NGD_field_engineer_battalion: "野战工兵营"
      NGD_field_engineer_battalion_desc: "我们的部队走遍四方，各种地形上的攻坚都成为我们所面临的困难，要打破窘境，最好的方法便是具备比敌人更强大的土工作业能力。传统的工兵连仅能适应在城市等地形的作战，我们有必要对其进行多种情况培训，建成一支更深度的野战工兵营，这将提高我们学习的广度，但一旦成功，我们的部队必能跋山涉水，如履平地"
      NGD_security_force: "治安部队"
      NGD_security_force_desc: "随着我国控制下的国土面积增多，治安战也成为了一个新课题，我们的很多反对者，抵抗者总是试图通过所谓的游击战，摧毁我们占领区的仓储和设备，试图拖垮我们的士兵。她们不值得我们专门用主力来镇压她们，专业的治安宪兵队培训将登上日程，这些训练有素的精锐将成为那些反抗者们永远的梦魇。"
      NGD_tank_destroyer: "坦克歼击车"
      NGD_tank_destroyer_desc: "在当今世界的战争局势下，装甲科技正以日新月异的速度发展，越来越厚的装甲已难以通过普通的榴弹炮和加农炮进行摧毁，具备更厚装甲的坦克部队需要更专业的装甲进行反制。因此，我们必须研制更先进、更具普及性的坦克歼击车，将其及时生产、武装到我们的装甲部队中，这世上只有我们打穿敌人的份，没有她们防的住我们的可能。"
    ### - 陆军 - ###

  	### - 海军 - ###
      NGD_upgrade_shipyard: "升级造船厂"
      NGD_Pacific_link: "太平洋纽带"
      NGD_Southeast_Asian_outpost: "东南亚前哨站"
      NGD_expel_the_waves: "驱逐浪花"
      NGD_dive_into_deep_blue: "潜入深蓝"
      NGD_battle_Pacific: "决战大洋"
      NGD_rush_onto_mudflat: "冲上滩涂"
      NGD_leap_over_the_waves: "飞跃波涛"
      NGD_upgrade_shipyard_desc: "摆脱经济危机后，我国与外界的海上经贸往来得以恢复，一些国家由于经济上的困难，正迫切出售她们的造船业设备以求自保，这正好为我们所用，以提升我们原有的造船厂改装和产出能力。"
      NGD_Pacific_link_desc: "一直以来，我国在太平洋方面都保持着与亚洲长期的海上经贸，亚太也是我们的利益重心。因此，有必要进一步扩张我国西部海上岛屿的军事存在，以保障我们在太平洋上的海上利益。"
      NGD_Southeast_Asian_outpost_desc: "南洋总督府一直是我国与华夏之间保障来往的关键控制支点，也是我国向东南亚扩展影响力的关键。但却长期面临北方樱花和南方圣杯势力的虎视眈眈，一旦遭遇海上入侵，我们的海军是无法立刻对其进行支援的。因此，必须进一步完善当地海上咽喉的防御能力，我们需要她们能够撑到我们的海军远渡重洋提供支援。"
      NGD_expel_the_waves_desc: "海上作战需要多支庞大的船队，而这样的大船队必须拥有足够的驱逐舰和巡洋舰队列。驱逐舰是海上作战的多面手，巡洋舰更是海上主力的关键屏卫，有了足够的海上屏卫力量，我们才能支撑起对整个太平洋的控制。"
      NGD_dive_into_deep_blue_desc: "仅仅防御敌人的海上进攻是不够的，我们也需要具备反向入侵敌方航线甚至是诱导敌方海军决战的力量，而潜艇能够做到这一点。这项隐形的海狼可以轻松绕道敌人的运输线上进行打击，让敌人疲于奔命，要么主动与我们决战，要么在骚扰中被我们累死，饿死。"
      NGD_battle_Pacific_desc: "太平洋是我们的，我们不仅需要保障航线安全，还要具备强大的主力舰队。如果说屏卫舰是海上之盾，那么主力舰就是海上重锤，她们将以无情的火力和强大的防护粉碎敌人的一切海军力量，并且为我们的勇士们提供足够的海上支援，当她们的火力在敌人的沿海城市落下的时候，任何狂妄自大的家伙都会为与我们为敌而后悔不已。"
      NGD_rush_onto_mudflat_desc: "要控制大洋，控制关键岛屿必不可少。有了关键的岛屿，我们的船只才有关键支点，我们的陆军才不用远渡千里进行登陆作战。但各类演习和实战都证明了我们不能靠单纯的陆军进行登岛和冲摊。因此，有必要建立一支专业化的海军陆战队，通过专门的课程训练，保障我们能够顺利攻克任何敌人建立的海上防线。"
      NGD_leap_over_the_waves_desc: "太平洋很大，也很安静，相较风暴频发的大西洋，在这片大洋上很多时候都是风浪日清，这也让海军航空兵能够执行长期的空中任务。为此，我们有必要学习圣杯的经验，建立一支航空母舰编队以进行海上作战，优秀的海军航空兵将能够在航母上起飞，在千里之外便能摧毁敌船，完成轰炸。"
  	### - 海军 - ###

  	### - 空军 - ###
      NGD_establish_air_force: "创设空军"
      NGD_air_force_academy: "航空军校"
      NGD_defend_airspace: "防卫领空"
      NGD_new_type_aircraft: "新式飞机"
      NGD_air_hunter: "空中猎手"
      NGD_close_air_reaper: "近地死神"
      NGD_flame_express: "火焰速递"
      NGD_dancing_sword: "舞落之剑"
      NGD_establish_air_force_desc: "虽然我们很早的便接触到飞行器的发明和使用，但在过去和平之日，我们并无空军建设的必要。但在接触外界军事思想的过程中，空军将是保卫陆军的关键所在，没有空军，我们的陆军便会遭遇过多损失。因此。我们必须从无到有，建设一支有力的空军"
      NGD_air_force_academy_desc: "任何军队建设都离不开人，空军也是。陆军需要专门的学校来培训士官，进行训练，讲述兵法，空军也一样。有了好的航空军校，我们便能够短期内积攒飞行经验、实验飞行战术，它会是无数空军将士从无到有的第一步。"
      NGD_defend_airspace_desc: "在建设本国空军的过程中，我们对空军战术认识的深入也让我们思索出一些对敌方空军的反制套路：优先保护民用、军用工业园区，建立复合型的防空火力网，必要的地上地下掩体...能进能退，能攻能守，我们才能有效保卫我们的领空。"
      NGD_new_type_aircraft_desc: "我国我军控制下的广袤疆土为空军提出了一个新难题，广大的疆土让原有的战斗机、支援机都难以完全效率进行作战，很多地方的支援不利便决定了一场战役的胜败。因此，我们需要进一步对空军设计进行招标和规划，建设能够适应广袤国土作战和的新型飞机。满足我国从国土防卫到跨地区作战的需要。"
      NGD_air_hunter_desc: "空战的胜利往往在于摧毁敌人升空的战斗机，一支没有战斗机的空军就是待宰羔羊。而要在空中火力上取得优势，最好的办法便是用更好的发动机，上更大口径的空中武器，让敌人的空军见面就被摧毁，变成被打靶的烤火鸡。"
      NGD_close_air_reaper_desc: "我们新型的飞机在消灭敌方空军之余，也要及时为陆军进行支援，战争决胜还是需要陆军的推进，我军的装甲战术研究结果也认为空军应为陆军推进提供支援。在闪电突击中，只要有足够的空军进行支援，任何可能的敌方支援都会遭遇死从天降，不得不放慢速度，而我们便可以从容不迫，及时完成战场上的任何任务。"
      NGD_flame_express_desc: "新型大飞机不仅可以让我们消灭前线的敌人，也能让我们消灭后方的敌人。很多时候，那些敌国的狂热民众之所以呼唤战争，仅仅是因为没有见识到战争的威力，认为炸弹不会落到她们头上。但当我们的大飞机飞跃长空到达她们头上，为她们送来一些温暖的‘火焰速递’的时候，她们的战争信心，战争热情和战争生产能力都将被我们一并摧毁。"
      NGD_dancing_sword_desc: "在伟大战争中，德意志、圣杯、幻想乡等大战参与者都不约而同的使用过空降兵进行破袭和侦察，在新大陆上，齐亚德的军官也提出过将一整个步兵师投放后方进行进攻的策略。随着运输机和降落伞的发展，我们确实可以完成这一目标。我们会挑选最优秀的士兵组成专门的空降兵师，这些部队将是我们最锋利的剑，从天而降，将敌人的薄弱之地重重劈开，成为我军胜利的决定因素。"
  	### - 空军 - ###
  ### - 军事线 - ###

  ### - 北美战争线 - ###
    NGD_storm_is_approaching: "风雨欲来"
    NGD_storm_is_approaching_desc: "近期，我们的侦察兵和情报传来了令人不安的消息，我们边境上的齐亚德人正在大规模动员，开展对抗性演习，远方的法兰西和精灵也开始了大规模的征兵训练和边境工事修建，而圣杯仍在艰难重建当中，根本帮不上什么忙。可以说，新大陆上必有一战，我们将会直面那迫近的风暴。接下来的决策将决定我们的未来的战略方向：攻，还是守？"
    NGD_defense_is_the_best_offense: "防御是最好的进攻"
    NGD_defense_is_the_best_offense_desc: "我们的国土贫瘠而狭长，面积相较周边敌方较小，且缺乏战略纵深，虽然我们的部队针对高山环境做了适应性训练，但贸然进攻仍然会摧毁我们本就不多的战争潜力。最好的方法还是利用好我们修筑好的工事，等待敌人在我们的防线上流干鲜血，我们便会迅速出击，消灭她们"
    NGD_build_high_walls: "高筑墙"
    NGD_build_high_walls_desc: "善守者藏于九地之下。要实现优先防守的战略目的，我们就得不能让敌人突进任何一寸国土。我们将进一步进行社会动员，全面加强边境上所有地区的工事修建，绝不给敌人任何偷袭可能的机会，她们看到的我们只会是盲人摸象一样，无迹可寻。在混乱中被我们彻底消灭。"
    NGD_guns_lots_of_guns: "广囤枪"
    NGD_guns_lots_of_guns_desc: "在我们的防守反击战略中，无论是前期的防守，还是后期的反攻，我们都需要足够强大的火力，而这项都需要我们有足够的武器供应。我们的军工厂将在原有的基础上进一步将武器生产进一步流水线化。我们不需要华而不实的艺术品，我们要简单粗暴的赢得胜利。"
    NGD_rope_a_dope: "待敌亡"
    NGD_rope_a_dope_desc: "通过全国上下的努力，我们的准备达到了最好，敌人的威胁也已经不足为虑。我们的努力被证明是正确的。接下来，我们只需按照之前的部署继续行动，坐在修筑好的碉堡里，等着我们的敌人冲上来一头攒死了。"
    NGD_beat_to_the_draw: "先下手为强"
    NGD_beat_to_the_draw_desc: "善攻者动于九天之上。防守固然是一个好的选择，但必须考虑到的是，我们的敌人比我们具备更大的战争潜力，齐亚德也许不足为虑，但精灵和法兰西都比我们强的太多，如果我们坐等她们进攻，她们却不仓促进攻，而是在战胜后进行更大规模的战备和动员，仅凭我们一隅之地实难抵挡。我们必须从一开始便发动攻击，利用快速胜利所获得的资源，逐步积攒起更大的优势，才可能获得最终的胜利。"
    NGD_return_to_lost_territory: "重返失地"
    NGD_return_to_lost_territory_desc: "上个世纪，我们在齐亚德的旧地惨败于法兰西人之手，我们东扩的天命也就此折戟。如今我们要直面法兰西人，就已经不再需要齐亚德人所能提供的缓冲带了，我们将给她们一个机会，如果愿意和我们和谈，那我们就可以好好谈谈和平统一，如果没有可能，那就战场上见吧。"
    NGD_cross_the_Rocky_Mountains: "跨越山脉"
    NGD_cross_the_Rocky_Mountains_desc: "终于，我们的部队跨过了落基山，直面了我们的旧敌法兰西人，虽然她们的军队更多，武器也更精良，但我们绝不会畏惧，我们已为这场百年之战尽了一切准备，今日便做个了解吧。"
    NGD_direct_to_the_coast: "直抵海岸"
    NGD_direct_to_the_coast_desc: "法兰西人已经落败，我们再一次接触到了这片土地的主人之一：精灵。但和我们境内的精灵不同的是，她们认为自己并不是什么流落海外的玄鸟之民，反而我们才是什么母神之下执迷不悟的浪子，需要被她们所同化，那可不行。我们有着光荣的历史和文化，我们的使命便是从此岸到彼岸，道不同不相为谋，至少这一次，我们会带着尊重与她们决一雌雄的。"
    NGD_Winner_Take_All: "赢家通吃"
    NGD_Winner_Take_All_desc: "我们完成了世上最伟大的奇迹。谁能想到，一群偏安一隅，流亡海外的中华流民，能够实现这个星球上最大的壮举之一：从新大陆西海岸的海湾一隅，勒石东海岸的生命之树。完成了成百上千倍国土的扩张。旧敌法兰西人成了我们的手下败将。我们已经成为新大陆上最大的势力，即使是欧洲人，现在也得让我们三分颜色。\n\n虽然接下来的工作还有很多，一个新的中央集权国家的建立道阻且长，国土之上仍是断壁残垣，百废俱兴，但我们已经做好一切准备去面对，身为这场北美大战的胜利者，我们有权力和义务去开创属于我们的现在，和未来。"
    NGD_operation_paperclip: "回形针行动"
    NGD_operation_paperclip_desc: "在北美大战中，无论是齐亚德人、法兰西人还是精灵，不少人受战争的影响流落异国他乡，在战争结束后，这些人成为了无国之民。很多国家还没有看到她们的重要性：她们规模不小，不少人还具备着一定的财富和知识。我们的情报部门将着力在她们之间开展工作，招揽她们回来加入我们。有了她们的支持，我们的经济将被注入新的活力，恢复工作也将更加顺利。"
    NGD_automatic_machinery_technology: "自动机械技术"
    NGD_automatic_machinery_technology_desc: "回顾我们与齐亚德人的交战过程，她们所使用的自动机是一项关键的发明，这项装备实现了山地等复杂地形的高速机动，而且具备不弱的火力。齐亚德的不少技师在战后加入了我们，我们将在她们的帮助下重现这一优秀武器，并进行推广。"
    NGD_research_materials_on_magic_item: "灵装研究资料"
    NGD_research_materials_on_magic_item_desc: "作为这片大陆上的宠儿，精灵的国土上有着数量庞大的源翠石，她们对于灵装的研究也是独树一帜，无论是我们还是法兰西人在这方面的研究都不如她们。闻道有先后，我们是不耻于落后的民族，既然得到了她们的研究资料，我们就要努力的对她们的成果进行学习，做到青出于蓝而胜于蓝。"
    NGD_economic_unification: "经济统一"
    NGD_economic_unification_desc: ""
    NGD_start_rebuilding: "开始重建"
    NGD_start_rebuilding_desc: "经年积岁的北美大战让这片大陆上的大多数地区都遭到了战争的损害，很多地区的社会基础设施被无情损毁，人民流离失所，饿殍遍野。新政府绝不能坐视这种情况继续存在，我们将通过政府军军管的模式在各地开展重建工作，着力重建各地的基础设施，在动员和重建的过程中，搭建起各地的基层秩序。"
    NGD_revitalize_industry: "振兴工业"
    NGD_revitalize_industry_desc: ""
    NGD_industrial_integration: "工业整合"
    NGD_industrial_integration_desc: "在未统一之前，我们、齐亚德人，法兰西人，精灵都有不同的工业建设，标准不一，模式不同。在我们实现完全统一后，这些不同的生产模式却让我们的工业无法有效运营，我们将派出专门的工业管理团队和官员，在各地间下发新标准和新规章，只有我们能够将新大陆上的工业完全整合到一起，我们的经济才能实现关键的复苏。"
    NGD_enterprise_subsidies: "企业补贴"
    NGD_enterprise_subsidies_desc: "我们的军工企业们为战争的胜利作出了巨大的贡献，她们生产的武器成为了我军胜利的关键动力。在接下来的工业重建和发展竞争中，我们也需要她们的力量，我们会给她们重要的国家补贴，鼓励她们接下来的经济活动中多生产，更多参与对外竞争，有了她们的力量，我们的重建会更上一层楼。"
    NGD_industrial_diversification: "产业多元化"
    NGD_industrial_diversification_desc: "在过去，由于我们国土狭小，政府的力量有限，很多试图发展的产业都因资源和资金等因素被迫放弃或者自然发展，但如今我们获得了新大陆广袤的国土和资源，大量新加入的国民也需要被融入我们的经济体系中。我们必须在原有的基础上进行产业多元化发展，我们的工业将不止围绕造船，我们的农业也将不止用来填饱肚子，更多的工业将带来更多的可能，也带来更多的机会。"
    NGD_expand_livelihood_industry: "扩大民生产业"
    NGD_expand_livelihood_industry_desc: "在战争结束后，随着国家秩序的初步稳定，我们治下的人口也迎来了一波小增长，世界局势的日趋紧张也让更多的海外人口更多涌入我国，为此，我们需要进一步扩大民生产业，食品、纺织、工程等产业都需要得到进一步的发展，只要我们做的够好，我们的产业便会得到最好的机会，我们的人民便不会挨饿，她们的支持会让我们的重建更加顺利。"
    NGD_develop_aviation_industry: "发展航空工业"
    NGD_develop_aviation_industry_desc: "坐拥广袤国土的一大烦恼便在于，即使我们仍在努力修建铁路，但地区之间的交流仍是问题。如果考虑到效率那更需要我们去克服。经过商讨，在原有基础上发展航空工业将成为政府工作重点，政府将在原有的法兰西和精灵的航空工业基地基础上进一步发展航空工业，掌控了天空，我们对于我们的国土便能够实现更稳固的掌控。"
    NGD_take_over_seirei_shipbuild_industry: "接手精灵造船业"
    NGD_take_over_seirei_shipbuild_industry_desc: "一直以来，精灵的造船业都享誉全球，即使是我们也曾向她们订购过船只。如今她们的造船业已经到了我们手里，我们必须重启造船业，招揽原有的技工重新开展工作，向外重启船业订售。我们将在这一过程中重振现已衰败的内河航运，并培训新一批航运工人参与到国家复兴。"
    NGD_complete_rebuilding: "完成重建"
    NGD_complete_rebuilding_desc: "我们的重建大业取得了圆满的成功。海陆空三方面的工业重建和发展目标都顺利实现，重建以及新铺设的公路、铁路交通网络让东西部之间的人口和资源联系成为现实，原各国的科技结晶为我们所用，我们用现实证明了我们比任何人做的都好，一个新生的经济强国已经在北美这片新大陆冉冉升起，它将用行动让世界各国为之侧目。"
    NGD_Route_sixty_six: "六十六号公路"
    NGD_Route_sixty_six_desc: "这片土地上的泛美主义者曾提出过一个看似不可能的梦想，从西到东修建一条贯穿东西的交通线，让西部的资源和东部的产业，人口相互连通，这项过去的妄想在今日成为必须，我们的统一需要进一步的扩展我们在东部的影响力，因此，我们将开始着力修建专门的六十六号公路，这条长长的公路将初步打通新大陆东西之间的往来，也能让泛美主义者对我们更加支持。"
    NGD_the_Union_Pacific: "联合太平洋铁路"
    NGD_the_Union_Pacific_desc: "在过去，由于各国间交流的阻隔，西海岸到东海岸之间没有一条贯通东西的交通运输线路，精灵、法兰西人要冒着巨大的生命以及财产危险才能到西部，我国的的物产也很难向东运输，如今我们要建立东西部之间的联系，就必须修建这样的铁路，我们将专门成立一家联合太平洋铁路公司，虽然花费很多，时间不短，但为未来计，这条铁路我们必须修成。"
    NGD_land_inventory: "土地清查"
    NGD_land_inventory_desc: "俗话说得好，打土豪分田地。无论是中国人还是洋人，谁不想有一块属于自己的土地呢。随着我们对新大陆的掌控加深，我们有必要对我们治下的土地进行一轮检地活动，我们不会，也不能放任那些教会、叛军继续掌控各地的土地来威胁到我们的中央政府统治。有了土地，我们的政府便能获得更多的赋税，国家财政也将更加稳定。"
    NGD_resource_exploration: "资源勘探"
    NGD_resource_exploration_desc: ""
    NGD_national_electrification: "全国电气化"
    NGD_national_electrification_desc: ""
  ### - 北美战争线 - ###

  ### - 进步党 - ###
    NGD_Progressive_Party_governance: "进步党执政"
    NGD_Progressive_Party_governance_desc: "我们胜利了，经过激烈的大选角逐，新兴政党进步党成功战胜老牌的共民两党，成为本届政府执政党。由社会民主主义、共产主义、社会主义者组成的进步者联盟在结束胜选后的欢庆仪式后，将正式决定未来一段时间国家的发展方向。"
    NGD_adopt_a_radical_platform: "采用激进纲领"
    NGD_adopt_a_radical_platform_desc: "已经无法再忍受了，过去的我们迫于远洋所面临的危险环境，认为社会主义革命暂时没有生根发芽的土壤，但现如今，在北美归于一面旗帜之下之后，我们终于有了继续前进的条件，我们有能力，有勇气采取更为激进的纲领，让我们向着共产主义的美好梦想前进"
    NGD_missions_sent_to_the_Soviet_Union: "派往苏联的使团"
    NGD_missions_sent_to_the_Soviet_Union_desc: "苏联是现在世界上最早实施社会主义制度的国家，并且其社会主义实践取得了可见的惊人成就，无论是出于与社会主义同志联络感情还是出于向社会主义道路先行者学习的目的，派遣一支使团前往苏联都是有必要的"
    NGD_CMEA_observer_country: "经互会观察员国"
    NGD_CMEA_observer_country_desc: "经互会是苏联对于社会主义道路下经济发展方式的一个重要实践，虽然因为长期处于资本主义制度下的经济体制使我们无法立刻拥抱经互会，但我们可以先成为其观察员国中的一个"
    NGD_revolutionary_democracy: "革命民主"
    NGD_revolutionary_democracy_desc: "总是有反动派宣称，社会主义政体意味着极权主义，要我们来说，这纯属污蔑，革命者们才是民主的真正代表，我们将要让学生、工人、农民、士兵的代表们走进我们的议会大门，而不是让议会同以往一样成为资本家们的俱乐部"
    NGD_ban_reactionary_media: "查禁反动媒体"
    NGD_ban_reactionary_media_desc: "自远洋的社会主义运动崛起以来，反动的资产阶级媒体就不遗余力的对我们的正义事业进行抹黑和舆论压制，正义的反抗被污蔑为暴动，倾向我们的进步者被掐断发声，反动敌人从未有接受过我们，我们也不会放过她们。我们将开启一场大调查，扒一扒这些反动媒体的历史言论，彻底中止这些反动媒体的舆论暴行。"
    NGD_invite_communist_comrades: "邀请远共同志"
    NGD_invite_communist_comrades_desc: "像其他资本主义国家的共产党一样，在过往的政治活动中，远洋共产党一直因坚持推动阶级斗争，而遭到历代资产阶级政府严酷镇压，如今我们的政府也将继续推进阶级斗争，清扫社会上资产阶级的余毒，就需要同样有经验的同志们的辅助，我们将主动邀请远共的同志们进行商议，并探讨我们未来是否合并一事。"
    NGD_merge_into_one: "合党为一"
    NGD_merge_into_one_desc: "经过洽谈，我们得出结论，虽然我们与远洋共产党有着众多差别，但要进一步推进革命和社会改造，我们离不开她们的指导，我们的未来和她们也是一致的，北美大地需要更进一步的革命才能实现真正的进步。我们将正式实现两党合并，推动革命的进一步发展。"
    NGD_the_two_stage_revolution: "革命两步走"
    NGD_the_two_stage_revolution_desc: "在与远洋共产党合并之后，经仔细探讨，我党将以两步快走的模式进行社会革命，第一步：在各地通过推动进步性质的土地改革、工业、手工业建设等方式快速建设社会主义公有制经济，在西海岸本土推动资本主义的转型，第二步，在发展经济的同时培养和建设革命干部队伍，并进入我们的社会领域特别是经济领域中保证对社会的更稳定控制，抵抗资产阶级的反扑和渗透，为革命到来做好准备。"
    NGD_a_steo_further: "更进一步"
    NGD_a_steo_further_desc: "现在便是社会革命的最佳时机，我们的政府有着绝大多数人的认可，我们的社会主义公有制经济完全超越资产阶级的所谓落后经济模式，我们还有什么可怕她们的呢？我们将正式结束腐朽的资本主义议会共和制度，取代为社会主义民主共和制。人类只有两条路，社会主义或者倒退，我们绝不会退，我们永远是人民进步的先锋队，未来在我们手中！"
    NGD_maintain_independence: "维持独立"
    NGD_maintain_independence_desc: "很明显，虽然远共的同志们的想法很好，但党内不少同志还是不希望社会如此剧烈的进行所谓革命，我们的支持者不会喜欢，而且我们也需要一个友善的外来党派对我们进行监督，我们不会与她们进行合并，而是继续维持我们的独立地位，与她们进行友好的合作。"
    NGD_encourage_revolutionary_thought: "激发革命思维"
    NGD_encourage_revolutionary_thought_desc: "一直以来，资产阶级污蔑我们伟大的工农群众的一大方式，便是各种栽赃我们的革命者和民众们是没有思想的奴隶，我们的革命政治都是变相的暴民政治。要反击这种栽赃陷害，我们便需要培养我们的革命群众具备更加深入的革命思想，认识到敌人对我们的斗争，具备更深入的学术能力。"
    NGD_restrict_the_petty_bourgeoisie: "限制小资产阶级"
    NGD_restrict_the_petty_bourgeoisie_desc: "在原本的选举制下，我国社会上一大部分小资产阶级通过在选举中影响选票，获得了一定的政治地位，她们以此为所欲为，迫害民众，不许她们发出真正的声音。当我们决定深入革命后，她们便成为了我们新的仇敌，在各种层面反对我们的工作。我们必须对这些反动群体进行限制，如果她们有叛国行为，立即逮捕并消灭。"
    NGD_dvocate_for_class_struggle: "提倡阶级斗争"
    NGD_dvocate_for_class_struggle_desc: "在与小资产阶级斗争的同时，我们也需要与原本社会上的大资产阶级和地主阶级进行斗争。在新大陆上很多大资产阶级和地主都有自己的所谓庄园和成百上千的私兵，要打垮她们的影响，我们便要利用起宣传机器，在全社会进一步渲染阶级斗争的重要性，在物理消灭她们的同时用社会力量积压她们的生存空间，让她们在新的社会中无所遁形。"
    NGD_strive_for_public_support: "争取群众支持"
    NGD_strive_for_public_support_desc: "长期以来，在选举制度治下，我国很多的老百姓都受困于信息认知不足，她们对于革命只能受制于资产阶级的恶毒宣传，从而首先认知我们与她们不是一个社会群体，我们的存在便会破坏她们的利益。我们会通过一系列的社会活动，为我们的群众提供重新认识我们与敌人的真正机会，重塑我们的形象，获取她们的支持"
    NGD_a_country_for_people: "人民的家园"
    NGD_a_country_for_people_desc: "我们需要逐步改变社会制度，改变资本主义，但我们不会指望一蹴而就，让我们的国家在强烈的斗争中突然返贫，实现工人阶级的社会解放不止需要斗争，也需要有一个温馨的家，新大陆有这个资源让我们在全社会推行面向全民的福利政策。我们不放弃手中的枪，却也愿意为我们的人民铸起一座温暖的家。"
    NGD_dualist_platform: "二元纲领"
    NGD_dualist_platform_desc: "很明显，虽然共产主义的所谓理想很美好，但它真的不适合我们的社会，我们的国家很大，我们的同志们通过选举便可以执掌一方，为政一方，那我们为什么一定要执着于困难毁灭社会有利因素的革命？我们会选择最适合我党未来发展的方向，作为我党指导国家发展的纲领。"
    NGD_lean_towards_socialism: "倾向社会主义"
    NGD_lean_towards_socialism_desc: "很明显，就像封建社会孕育资本主义一样，社会主义也会自资本主义产生。在过去，资本主义在促进我国社会发展的同时，也造成了多次经济危机，造成了我国社会的巨大倒退，而社会主义的公平发展有利于我国社会的进步，我党在未来的发展中应积极拥抱社会主义的执政方针，通过政府宏观调控，促进经济发展和社会进步。"
    NGD_promote_labor_laws: "推行劳动法"
    NGD_promote_labor_laws_desc: "长久以来，我国的工人阶级在国家发展中贡献良多，特别是在过去的北美大战中，为获得胜利，我国的工业法律甚至极大偏向资本家。但如今已经和平，我们的工人已不能再忍受如此，我们应推动新的劳动法落实，保证我们的工人能够更长久的工作和生活。"
    NGD_propagate_worker_culture: "宣扬工人文化"
    NGD_propagate_worker_culture_desc: "一直以来，我党大多通过工会进行各式宣传和活动，工人们在长久的活动中都形成了一种积极向上的工人文化，像苏联那样的社会主义国家也积极推广工人文化向社会的传播。我们要进一步推广社会主义，就要进一步宣传这种积极向上的工人文化，我们要进一步扩张工会、工人文化宫等活动，让我们的工人文化在全社会进一步传播"
    NGD_labor_night_school: "劳工夜校"
    NGD_labor_night_school_desc: "虽然我们一直强调工人们需要具备一定的文化素质，但在我国社会工人的一大来源便是各国的底层劳工，这些劳工文化素质不一，且生活窘迫，无法接受同等的教育。我们将为她们特地开设劳工夜校，一步步从最基础的课程抓起，提高她们的素质和认知能力。"
    NGD_worker_self_management: "工人自我管理"
    NGD_worker_self_management_desc: "当我们的工人们有了一定的素质和教育之后，我们便不能再把她们交还给资本家们，这样只会让她们因利益和资本家们相互勾结，成为社会堕落的新来源，我们必须推动工人群体的自我管理。马克思主义当中也具有工人自我管理的相关理论，我们当以此组织工人群体进行自我管理和发展，获得更多社会底层的支持。"
    NGD_nationalize_key_industries: "关键产业国有化"
    NGD_nationalize_key_industries_desc: "经济危机已经证明了所谓的自由竞争资本主义完全无法适应未来的国际竞争，当危机到来之时，由于所谓的自由政策，我们的关键经济领域甚至需要左支右绌来进行维持。我们需要对石油、交通、航空等关键经济领域和产业进行完全国有化。最单一的垄断，也会好过最无序的竞争。"
    NGD_moderate_socialism_policy: "温和的社会主义政策"
    NGD_moderate_socialism_policy_desc: "完全化的社会主义是不利于经济发展的，我国长期坚持的资本主义传统使得我国在发展当中获得了广大的成果，如果贸然向社会主义乃至共产主义进行，人民很可能因为经济受损而反对我们，党内的保守派和温和进步派更是会直接倒向共民两党，让我们直接下台。因此，我们应当执行的是温和的社会主义政策，通过议会立法与经济政策的多重手段，对资本家所有的生产资料进行限制，推进我国向社会主义迈进。"
    NGD_ensure_democratic_constitutionalism: "保障民主宪政"
    NGD_ensure_democratic_constitutionalism_desc: "在推动社会进步的同时，我们也绝不能忘记我国的民主宪政传统。我国是民有、民选、民治的共和国，三民主义的创始人孙先生也曾在我国立经讲学，我国社会的进步也离不开广大民主宪政派的支持，我们会坚定保护她们的发言权，没有反对派的民主终极会陷入暴民政治当中，保障自由发言权是必要的。"
    NGD_form_the_popular_front: "组建人民阵线"
    NGD_form_the_popular_front_desc: "即使是温和的社会主义进步，也会遭到敌视和反抗。远共如今视我们为修正主义者，共和党等资产阶级敌视我们，大明复兴党等君主势力也对我们不善，我们必须拥有保护政权的力量，和盟友，我们将联合社会上的温和进步派，效法幻想乡组成人民阵线，通过多党联合执政的方式抵御极端势力的侵袭，保障我国政府能够长期稳定执政，不再陷入危险分子的手中。"
    NGD_walk_alongside_liberals: "与自由派同行"
    NGD_walk_alongside_liberals_desc: "虽然某种意义上说，很多政坛上的自由派都不喜欢我们，认为我们搞得所谓国有管制都是苏联手段，经济只能靠自由放任。但还要一些不受欢迎的自由主义者认同我们的管制手段，认为建立一个全能的，能够照顾人民、自我革新，保障内务安定的自由与平等的政府，才是自由主义未来真正的方向。我们应当联系，拉拢她们，让她们成为自由主义的新风潮，让更多的资产阶级能够站在我们一边。"
    NGD_lean_towards_democracy: "倾向民主主义"
    NGD_lean_towards_democracy_desc: "随着我党对远共等共产主义群体的了解深入，我们必须意识到的一点是，社会主义者还是太危险了，她们号称能够与我们合作，但暗地里时刻不想着偷袭我们，把我们赶下台，她们和那些危险的君主派没有区别。与其继续与她们虚与委蛇，不如利用当前党内的优势，甩掉她们，与共民两党的民主派们继续联合，并积极吸纳她们之中的进步派力量，进一步完善我国的民主制度。"
    NGD_convene_the_consultative_conference: "召开政协会议"
    NGD_convene_the_consultative_conference_desc: "要真正践行民有、民享和民治，我们就必须接受社会上各党派的意见，但如果放任她们进入议会，我党的支持率便会被强行压低，造成不利。最好的办法是再建立一个政治协商会议，像圣杯等国的上议院一样，让共民等党派在此进行商议和会谈，成为政府的辅助机构，但不能享有实际权力。"
    NGD_suppress_radical_thought: "压制激进思想"
    NGD_suppress_radical_thought_desc: "即使到现在，共产主义者、社会主义者都时刻不忘通过所谓的武装斗争推翻我党政府，建立一个苏联附庸下的傀儡政府。我们绝不能让她们的思想继续荼毒百姓。我们必须从此开始，抓捕她们的党员，解散她们的政党，没收她们的财产，我们可以允许她们以党外人士身份进入议会，但如果她们有所异动，我们会告诉她们，她们的目标与自由民主的基本秩序不相容。"
    NGD_advocate_for_freedom_of_speech: "提倡言论自由"
    NGD_advocate_for_freedom_of_speech_desc: "在如今世界混乱的思想环境下，为避免极端思想的进一步传播，我们有必要复兴古典的自由主义思想，坚定不移的强调保障社会公民的自由权，特别是言论自由权，没有它，就没有个体间的自由和平等，所有的进步也都无法实现。"
    NGD_court_liberal_intellectuals: "招纳自由知识分子"
    NGD_court_liberal_intellectuals_desc: "在我国逐步加强对整个新大陆的掌控过程中，大批在原先齐亚德、法兰西和精灵治下的自由知识分子开始认可我们对自由主义的尊重，欧洲大陆上的流亡知识分子也有很多来到新大陆，我们可以招揽她们加入我们的政府，特别是宣传机构中，助力我国进行对自由主义的研究和宣传，推动我国科研领域的发展。"
    NGD_support_patriotic_entrepreneurs: "支持爱国企业家"
    NGD_support_patriotic_entrepreneurs_desc: "在我国统一新大陆的过程中，很多爱国企业家从出钱到出人出力，甚至是在国外大举宣传融资支持我军战争，她们的功绩不可谓不小，而在新大陆的重建过程中，她们也在众多工程中慷慨解囊。我们必须回馈她们的贡献，给予她们在军工等领域的准入权，让她们获得足够的回报，更好的为国作贡献。"
    NGD_promote_local_autonomy: "推行地方自治"
    NGD_promote_local_autonomy_desc: "新大陆很大，国土地形更是千奇百怪，光靠政府一个个地区的进行政府建设，我们几十年都完不成国家政权的建设的。在这方面，我们需要参考政协中共和党主张，在各地推行地方自治，建立州立、府立政府、法院等方面，充分尊重我国历史上的自治传统和权力，并争取我国新控制地区的势力支持。"
    NGD_stronghold_of_social_democrat: "社会民主堡垒"
    NGD_stronghold_of_social_democrat_desc: "通过长期的努力，我们对社会民主的践行获得了回报，广大的民众、进步主义者、地方势力站在我们一边，极端的共产党人被边缘化，社会主义的理想之梦在我们的和平、民主的革命和进步当中得以实现，改革便是社会民主的未来方向，我们用行动将新大陆建成了一座社会民主主义的坚实堡垒，建成了一座山巅之城。"
  ### - 进步党 - ###

	### - 共和党 - ###
    NGD_post_war_election: "战后选举"
    NGD_post_war_election_desc: "随着大战的结束，政府内的各党派人士均提出议案，认为随着战争状态的结束，政府所维持的战时状态已不复存在，政府应重回和平时期的执政状态，并恢复因战争而暂停的民主选举。她们是正确的，政治需要稳定和联系，我们不会像欧洲的法西斯骗子们一样反复无常。战争已经结束，政府将如常进行战后的首次大选。"
    NGD_Republican_Party_governance: "共和党执政"
    NGD_Republican_Party_governance_desc: "经过激烈的角逐，老牌执政党共和党成功压倒老对手民主党以及新对手进步党，成为本届政府的执政党。随着对新一届政府官员的陆续任命消息传播，本届共和党的执政纲领也得到明确：在坚持自由主义的基础上，保障各个新控制地区的稳定和发展。"
    NGD_principle_of_small_government: "小政府原则"
    NGD_principle_of_small_government_desc: "在统一战争结束后的军管过程中，我们见识到了繁杂的官僚体系带来的严重弊端：庞大的公共部门和军队系统制约了政府效率，增加了大量的开支，还严重影响了经济效率,造成部分控制地区对我们的反抗。与其继续强撑着控制力，不如顺势进行私有化。政府应在之后的工作中坚持小政府原则，减少对公共部门的干预，让我们的经济少一些干涉，才会发展的更好。"
    NGD_relax_regulations: "放宽规章"
    NGD_relax_regulations_desc: "在新大陆统一后，我们需要更多的时间和精力来规划国土重建，以及海外利益的开拓，这都需要大量的钱和力量，如果此时执着于对那些原本便支持，帮助我们的企业和势力进行压制，会给我们带来很多麻烦。我们已经有了很多的国土和资源，很多问题都不像以前一样束手束脚了，我们完全可以在规章制度上给我们的朋友们适当开下后门，换取她们进一步的支持。"
    NGD_local_self_government: "地方自治"
    NGD_local_self_government_desc: "一般来说，政治民主化的实现程度参照各地选举制度的确立与否，而各地情况完全不同，如果完全依照政府规定，必然出现大量的问题，中央的官员也无法完全对地方进行控制，我们需要各地的自组织成为我们对地方控制的助力，因此，我们应坚持地方自治的原则，保障各地自由发展的权力，当然，她们也应派出代表来加入我们，尊重我们的统治权。"
    NGD_protect_freedom_of_speech: "保护言论自由"
    NGD_protect_freedom_of_speech_desc: "只有专制政体才会限制人民发表言论的自由，一直以来，我们都坚持着自由与民主，我们的公民拥有着众多的权利和自由权，即使是新加入我们的公民也拥有这些权力，我们将会进一步推动宪法讨论和修正予以落实。"
    NGD_promote_positivity: "促进积极性"
    NGD_promote_positivity_desc: "很多爱国商人都希望加入我们的重建事业，为政府的发展和重建尽一份心力。我们理应回馈她们的好意：我们将把一些政府服务外包给民营部门，并在未来的经济发展方略对我们的企业更多予以支持，提升她们的投资积极性。"
    NGD_education_grants: "教育补助金"
    NGD_education_grants_desc: "教育是国家发展的关键，关乎我们下一代选民对自由民主的认同程度。在战前，各地的教育方向不同，教育出的人也观点各异，甚至还搞出了很多共产主义、君主拥趸甚至是法西斯分子。我们将对各地教育机构进行资金上的重塑，发送专门的教育补助金进行爱国主义、自由主义的教育，我们将在提升我国教育水平的同时，重塑整个国家的教育观念。"
    NGD_reiterating_the_principle_of_free_trade: "重申自由贸易原则"
    NGD_reiterating_the_principle_of_free_trade_desc: "一直以来，共和党都长期坚持自由资本主义的原则，主张市场完全竞争，政府只需保障市场正常秩序即可。而当今世界上有些国家错误的关闭国门，否认自由贸易的价值，但我们不会，我们会光荣的向全世界的商人们宣布：新大陆永远坚持自由贸易原则，我们的大门永远不会关闭。"
    NGD_tax_reduction_and_exemption: "税收减免"
    NGD_tax_reduction_and_exemption_desc: "对于我们传统的国民来说，她们为战争和发展缴纳了大量的税负，对于新加入的国民来说，更低的赋税是我们给予她们的恩泽，对于海内外商人，更低的赋税意味着更多的竞争机会。谁不喜欢低赋税的环境呢？我们将出台专项法案，进行各行业全方面的税收减免，所有人都会为我们的慷慨而心满意足。"
    NGD_contain_state_intervention: "遏制国家干预"
    NGD_contain_state_intervention_desc: "从圣杯传达而来的一种名为凯恩斯主义的歪理邪说正在所谓的金融圈和经济圈中传播，其主张国家对经济进行集中干预的说法更是误导了我们的一些官员执政，我们的新大陆上地大物博，完全的自由贸易才能有效激发市场竞争力，政府的错误活动才会给经济拖后腿。我们有自己的发展方式，欧洲人的方法在新大陆行不通。"
    NGD_wealth_brings_good_gospel: "财富带来福音"
    NGD_wealth_brings_good_gospel_desc: "我们重现了那个咆哮的时代。这一次，欣欣向荣的共和国拥有着整片大陆的资源，我们的经济再一次如火箭般腾飞，全世界的投资者开始在东西海岸的证券交易所里高朋满座，我们的社会上各种发财的机会俯仰皆是。全世界的来客为我们的繁荣举起酒杯，让我们为繁荣喝彩！为自由喝彩！"
  ### - 共和党 - ###

  ### - 民主党 - ###
    NGD_Democratic_Party_governance: "民主党执政"
    NGD_Democratic_Party_governance_desc: "随着最后一张选票被统计完毕，选举结果随之出炉：民主党在本次战后大选中以微弱优势胜过共和党和进步党，成为本届执政党。由于本届执政党在政府内不占优势，新政府在组阁过程中将择情组成联合政府，以保障本届政府能够稳定长期执政。"
    NGD_democratic_spirit: "民主精神"
    NGD_democratic_spirit_desc: "既然我们被称为民主党，我们的执政过程便需要坚持本党一直以来秉承的民主原则，我们的民意基础来自于拥护我们的广大人民，而不是一小撮保守的、落后的贵族群体，人人生而平等，无论她是什么种族，之前是什么国籍的人，只要她们愿意加入我们，我们便会保护她们的民主权利。"
    NGD_despotic_tradition: "专制传统"
    NGD_despotic_tradition_desc: "虽然我们有着悠久的民主传统，但两次危机都表明，民主制度在当下仍面临着众多暴民和所谓的进步派的威胁，她们无一不试图将我们的民主政府扭转为极权主义政府。我们必须首先保卫我们的票仓，我们的支持者，贸然的民主不可取，我们需要保皇派的支持。"
    NGD_aristocratic_mien: "贵族风度"
    NGD_aristocratic_mien_desc: "不要忘记，我们的国家最早的建立，便离不开拥护我们的众多贵族家族和势力，相比众多民族、人民各行其是、众口难调的主张，还是那些拥护我们的家族声音更加悦耳，而且无论是解决经济危机，还是赢得北美大战的胜利，都离不开贵族们对我们的鼎力支持，拉拢她们，我们会获得一个更稳定的盟友。"
    NGD_business_reputation: "商业信誉"
    NGD_business_reputation_desc: "虽然有句老话，商人重利轻别离，但在我们这样成熟的商业环境下，商人也需要注重保障自己的商业信誉，否则就会被我们赶出去，再也无法加入我们。一直以来，我们与商业联合会都有着众多的经济往来，她们对各派之间也有着一定的联系，如果我们能适当动员她们，她们的金钱足够换取一些摇摆者们对我们的支持。"
    NGD_right_to_vote: "投票的权利"
    NGD_right_to_vote_desc: "随着选举的正式结束，广大的民众和势力都认同了本次选举的结果。但无论是党内还是社会上，都有人提出本次选举并未代表全国范围内的民意，很多新加入的民众根本没有作出选择，对于民主制度的长期化显然不利，她们要求我们对投票权进行重新修改和细化，对此，党内将召开一次会议，作出慎重选择。"
    NGD_traditional_moral_values: "传统道德观"
    NGD_traditional_moral_values_desc: "很多所谓的进步主义者常言传统道德对于社会的发展是一种限制，但她们很多所谓的进步却罔顾纲常、败坏风气，让很多为社会发展踏实做事的人寒心丧心，更不要说有些宗教势力也借上帝和进步之名蛊惑人心、大肆敛财害命。新大陆上也需行周公之礼法，传统道德观仍需要长期推行，虽然我们坚持民主，但传统社会道德观的构建仍是社会长期发展的长治久安之策。"
    NGD_win_over_royalist: "拉拢保皇派"
    NGD_win_over_royalist_desc: "自经济危机结束以后，大明复兴党的势力已大不如前。在我们主动保障旧贵族势力的多项举措出台后，复兴党内的温和派代表申鹤主动向凝光大人抛出了橄榄枝，提出如果我们能够放松打压复兴党，保障她们的言论自由和出版权，她们便可以脱离那些激进派，与我们结盟，全力支持我们的主张。与其他势力相比，她们的条件并不过分，我们完全可以与她们成为盟友。"
    NGD_promote_protectionism: "推进保护主义"
    NGD_promote_protectionism_desc: "作为支持我们的要求，商人们希望我们能够在接下来的商贸竞争中，进一步推进经济危机期间所推行的贸易保护主义政策。这并非没有道理，在大战结束后，大量的外国产品伺机进入我国，很多新加入的国民要么被挤兑破产，要么成了外商的代理人，这完全不利于本国商业秩序的重建，我们必须以更强力的贸易保护予以回击，保护我们的商业秩序。"
    NGD_raise_tariff: "提高关税"
    NGD_raise_tariff_desc: "我们在经济危机期间的对外资的关税限制成功证明了这一制度在保障我国主要商业群体利益上的作用，虽然有些外资群体总是责备我们破坏了正常的商业秩序，但如果我们不对本国的商业利益进行保护，把市场白送给她们，我们的商业又从何发展呢？"
    NGD_halfway: "前路漫漫"
    NGD_halfway_desc: "经过我们对不同势力的拉拢和工作，我们对北美大陆的控制愈发稳固，新国家的秩序得到构建，人民对我们的道德观念逐步接受，无论是齐亚德人、法兰西人还是精灵，她们都逐渐接受了我们社会中的定位，融入新社会的发展中去。接下来，凝光大人将对国家发展的指导思想作出关键抉择，这将成为新国家发展的长期基调。"
    NGD_Anthropocentrism: "人治主义"
    NGD_Anthropocentrism_desc: "在凝光大人与甘雨大人共事的过程中，进步党所提倡的人治、有为等思想也在民主党内所传播，一些民主党员也在接受这一人治主义之后通过实践在地方治理上作出了成绩，充分证明了社会主义在基层治理的可取之处。我们应推行这一思想，促进本党在社会治理上平等、进步形象的进一步确立。"
    NGD_improve_labor_laws: "改善劳动法"
    NGD_improve_labor_laws_desc: "自经济危机以来，由于国家长期处紧张和动荡当中，我国经济长期为战争发展而让步，工人农民等劳动者的平均工时大幅度增加的同时，工作待遇并非得到有效提升，广大国土之上的劳动者们为国家重建也付出了巨大的贡献。要得到她们的支持，一部更合理的劳动法再好不过，通过调整劳资待遇、提高最低薪资等方式，我们将获得她们的支持，也将有效降低激进革命者煽动暴乱的可能。"
    NGD_a_fair_salary: "公平薪酬"
    NGD_a_fair_salary_desc: "在我们在全国范围内重建工业的过程中，受到各地发展不公平、贫富分化的影响，公平薪资这一议题成为广大基层党员和民众的呼声。对此，政府将对此进行详尽的社会调查后，推行总体上更加公平的薪酬制度。虽然我们做不到完全的同工同酬，但对比过去与其他国家的劳动薪资待遇来说，我们已经尽其所能。"
    NGD_golden_mean: "中庸之道"
    NGD_golden_mean_desc: "虽然我们谈不上什么进步，但我们也没有向法西斯、封建君主和极权主义自甘堕落，社会发展需要一个过程，极度的偏袒会让我们在之后的选举中很容易被共和党推翻，我们也不会像进步党一样追求所谓进步罔顾社会发展现实，中庸之道，有为而行才能保证我们的新国家在未来的风雨中砥砺前行。"
    NGD_be_alert_to_both_sides: "警左惕右"
    NGD_be_alert_to_both_sides_desc: "多年以前，我们以强硬手段消除了共产主义者和旧明支持者们的现实挑战，如今要做的便是斩草除根。这些势力在新国家建立后希望借助国家发展来获取新的支持，但我们可没忘了她们，我们的情报部门适当会提醒她们一句话：当前的制度允许她们适当发言，如果再有异心，她们有些不光彩的过去就会显露无余了。"
    NGD_support_enterprises: "支持企业"
    NGD_support_enterprises_desc: "我们国家的建立和发展都离不开众多企业的联合，可以说，没有企业，便没有今天的我们辉煌的一切。无论是凝光大人还是烟绯大人，我们的众多青年才俊都与企业有着密切的关系。在接下来的岁月中，政府将继续秉承稳中求进的态度，继续保持对企业发展的支持与鼓励，让我国成为未来世界的新商业中心。"
    NGD_self_centered: "惟我独尊"
    NGD_self_centered_desc: "随着联合的深入，共和党和进步党也开始联合起来，多次在国会内阻挡凝光大人进行更多的行政改革。如果放任她们继续胡作非为，我们将一事无成。对此，我们将开始在政府内扫除除本党和复兴党外的其他政治势力，新国家的未来不会再有那些宵小之辈的容身之地。"
    NGD_question_republic_thought: "质疑共和思想"
    NGD_question_republic_thought_desc: "在党派联合的过程中，大明复兴党提出的一些主张在党内广泛传播：政府通过长期的权力集中和专制保证了国家度过两次重大危机，而所谓的共和却让我们在危机初期束手束脚，即使是现在，虽然共和主义者长期强调选举的公正性和代表性，但在实际操作中，选举舞弊和低效率都时刻影响着政府行政，共和制实际上已经过时了。我们两党之间需要更高效、更稳定的思想，排除落后的共和思想束缚。"
    NGD_Megrez: "天权"
    NGD_Megrez_desc: "经过高效的行动，我们成功扫除了共和党人的影响力，将共产党非法化，那些反对者们对我们已经是不足为惧。凝光大人也得以一统党内外，成为新国家当之无愧的领袖。在过去，凝光大人虽然一直被人冠以天权之名，但今日，她再也不是过去名不副实的国家领袖，而是成为一位一言九鼎，杀伐果断的真正的君王。"
  ### - 民主党 - ###

  ### - 外交线 - ###
    NGD_outward_looking: "目光向外"
    NGD_outward_looking_desc: "在过去，我们只是海岸边的一隅小国，虽然我们有过众多的雄心壮志，但也不得不屈服于大国的力量和威严，唯她们马首是瞻。但随着北美大陆的统一，我们真正成为了这片大陆上的强国。而且在国力恢复之后，国内一些群体开始呼吁我们利用新大陆的资源和整合而来的力量推翻圣杯为首的旧秩序，建立属于我们的新秩序，但也有众多声音提出我们应重视当前国内仍在恢复和发展的现实，保持既有的中立，又或者利用既有秩序获取更高地位。对此，我们需要谨慎的作出选择。"
    NGD_isolationism: "孤立主义"
    NGD_isolationism_desc: "外面的世界早已混乱不堪，各个强国已经在我们还在恢复的过程中为争夺势力范围打的你死我活，以我们的势力进入这样的血肉磨坊无疑以卵击石，而且我们的孩子们也不会希望我们就这样白白送死。我们必须继续保持既有的中立主义政策，人不犯我，我不犯人。"
    NGD_trade_neutrality: "贸易中立"
    NGD_trade_neutrality_desc: "既然要保证中立，我们就不能在对任何一方的贸易活动中有所偏袒，像上次大战中的一些国家对任何一方大力出售资源和商品的行为无疑是表面中立，挨打了也是理所应当。我们是这世上最好的掮客，如果你想找我们进行贸易，我们万分欢迎。"
    NGD_YuanYang_fortressization: "远洋要塞化"
    NGD_YuanYang_fortressization_desc: "虽然我们是中立国家，但我们也不能坐视任何人有机会对我们进行入侵，特别是这世上一些极权国家已经展现出了格外的攻击性，她们很可能借助在美洲大陆上势力的传播对我们发动入侵。因此，我们需要在我国南北，海岸线的重要城市修建长长的边境要塞区，保证任何人都没有机会对我国发起突袭。"
    NGD_interventionism: "干涉主义"
    NGD_interventionism_desc: "有句话说得好，最好的防守就是进攻，与其一味缩在国内等着可能的敌人入侵，最好的办法还是主动参与到国际事务中去。可见的是。目前国际上最大的不稳定因素便是东亚的樱花和欧洲的魔导两大战争策源地。要想保证国际秩序的稳定，最好的办法就是帮助这些危险因素的敌人，让她们有力量消灭这些不稳定因素，我们则可在这过程中伺机建立自己的势力，实现在既有国际秩序中的扩张。"
    NGD_arsenal_of_Democracy: "民主兵工厂"
    NGD_arsenal_of_Democracy_desc: "我们必须明白，这世上的众多民主国家正处于以法西斯为首的极权主义国家的疯狂入侵当中，如果我们不对她们伸出援手，她们便会被无情的杀死，或者成为奴隶。我们绝不能看着这一切发生，我们必须成为世界民主国家的兵工厂，我们将为所有反抗者提供源源不断的武器，帮助她们打败可恶的侵略者，捍卫属于自己的民主和自由。"
    NGD_lend_lease_act: "租借法案"
    NGD_lend_lease_act_desc: "虽然很多国家都希望能够购买我们的武器来进行正义的抵抗事业，但有些国家相距万里，运输不易，有些国家在长期的作战中财政也无力负担超长的运费。我们会为她们适当开一次绿灯：国会将通过一部《租借法案》，对有关我国国防重要的任何国家提供军事装备等战略物资，我们将允许她们以租借形式代替现金交易，如果必要的话，可以提供无偿援助，只要那些友好国家能够胜利，我们有的是时间收回我们的利息。"
    NGD_stable_Pacific: "稳定太平洋"
    NGD_stable_Pacific_desc: "在西方，樱花帝国在入侵她们东亚陆上的邻居神州的过程中，也在太平洋上对旧圣杯殖民地和我们的南洋属地发动了大规模入侵，如果她们得逞，我们在太平洋上便再无立锥之地。我们必须保证能够对太平洋上的友好势力的海上运输支持，没有她们，我们便将失去对太平洋的战略支点控制力。"
    NGD_embargo_on_Japan: "对日禁运"
    NGD_embargo_on_Japan_desc: "樱花的肆意侵略无疑是为了所谓获取资源，以战养战。而她们的战争潜力显然来自于我们，即使是现在，樱花都在大量收购我国国内的资源来保证她们的工厂生产和战争实力。我们不会让她们继续扩张下去。我们将出台对樱花的全面禁运法令，如果她们愿意退出侵略地区，结束战争，我们还可以放她们一马，否则她们就用纸去造子弹，劈木头给发动机烧吧。"
    NGD_support_our_compatriots: "支援我们的同胞"
    NGD_support_our_compatriots_desc: "虽然我们与中华大地远隔千山万水，但我们的祖上都是中华儿女，我国众多民众也认为自己是当之无愧的中华后裔，从血缘上我们与中华一脉相通，从现实上说，无论谁打败樱花，统一中华，我们都能和她们建立长久的联系，中华大地毕竟是一个几亿人的市场，帮助中华抗樱简直百利而无一害。我们将在国内发出号召，全力支持我们的中华同胞们抵御邪恶的樱花势力侵略行为。"
    NGD_stable_Atlantic: "稳定大西洋"
    NGD_stable_Atlantic_desc: "随着欧洲战事的逐步升级，曾经的世界霸主圣杯王国被从欧洲大陆上赶了出去，她们的海上运输也面对以魔导国为首的征服者同盟围追堵截，如果她们倒下，世界岛的精华就将彻底沦丧，我们绝无可能单挑整个欧洲。因此，我们必须全力保障大西洋航线的安全，保障圣杯王国能够逐步恢复自己的生产和动员能力，度过这段危险期。"
    NGD_aid_in_European_military_sales: "援欧军售"
    NGD_aid_in_European_military_sales_desc: "仅仅保障圣杯王国在欧洲战场的运输线是不够的，她们不仅有欧洲战场，也要在亚洲与樱花作战，两线作战的压力使得她们装备压力极大。最近她们向我们提出了进一步军售的请求，我们必须答应她们，给予她们足够的武器装备，保证她们在欧洲战场能够率先发动反攻，结束欧洲战场的战事。"
    NGD_ensure_the_backyard: "确保后花园"
    NGD_ensure_the_backyard_desc: "泛美主义者有个理论，美洲人是美洲人的美洲，以圣杯、德意志人为首的欧洲国家在美洲长期的扩张不仅让新大陆上的原住民对她们极为仇视，也造成了旧秩序对以我们为首的国家的长期压制。美洲应该是属于我们这样的新大陆国家的，考虑到那些中部、南部美洲国家长期处于混乱野蛮的状态，我们有必要通过外交和武力的方式向她们传播文明，并保证美洲在未来长期处于我们的控制下。"
    NGD_imperialism: "帝国主义"
    NGD_imperialism_desc: "这个世界上什么道理最大？武力和拳头。上百年前，圣杯就是靠举世无双的武力征服了世界上最广大的国家和地区，成为了当今世上最强的霸主，如今她们摇摇欲坠，我们却冉冉升起，那这个世界的未来应该是我们的，而不是她们的，我们将逐个摧毁当今世上所有的强权国家，建立属于我们的帝国时代。"
    NGD_special_military_operation_against_Qingkong: "对晴空特别军事行动"
    NGD_special_military_operation_against_Qingkong_desc: "绝密情报显示，晴空政府长期保持着一个对我国东北地区的进攻计划，她们已经成为我国国防安全的威胁。我们有理由相信，晴空政府已经事实上成为一个法西斯极权主义政府，为保证国家安全不受侵犯，我国将发起对晴空特别军事行动，以去除晴空军事部队和政府，保卫我国国家安全。"
    NGD_home_has_evil_neighbors: "家有恶邻"
    NGD_home_has_evil_neighbors_desc: "世上谁都想要一个稳定和平的邻居，但我们的南方可不是这样，那些拿着什么圣遗物的家伙们什么都学一点，有着众多先进的科技，甚至我们有理由怀疑她们希望通过这些世界之外的力量来同化我们。卧榻之侧不容他人酣睡，我们必须提前出击，摧毁她们任何可能的企图。"
    NGD_requesting_Greenland: "格陵兰,拿来吧你"
    NGD_requesting_Greenland_desc: "我们要控制世界岛，但我们的海军可没法在远隔千里万里的海岸线上全程保证我们的陆军进行登陆，我们需要一个战略支点，格陵兰冰川地带就是个很好的地方。虽然冷了点，但这里足够我们的陆军进行短暂驻扎和休整了，虽然这里原来的宗主国会有些不高兴，但我们会用武力让她们接受现实的。"
    NGD_atlantic_outpost: "大西洋前哨"
    NGD_atlantic_outpost_desc: "格陵兰所在的冰川还是太过荒芜了，我们的部队要保证在大西洋的控制，还是需要更进一步，找个有个有人烟的重要海岛进行控制。冰岛和法罗群岛便是个好地方，这里向南便可以直接扼制西进口航道和北海。我们将向这里的控制者杜伦布发出最后通牒，加入我们，或者去死。"
    NGD_holy_grail_war: "圣杯战争"
    NGD_holy_grail_war_desc: "当我们完成了对大西洋的控制后，我们便直面了当今世界的霸主，圣杯王国，她们极力抗拒并试图阻止我们在大西洋上的扩张，但我们已经到她们的家门口，我们的野心可不会为海洋所限制，我们将尽全力，打一场空前绝后的大战，摧毁这个曾经的霸权。用她们的传统来说，这应该叫什么，圣杯战争？"
    NGD_I_want_to_play_games: "我要玩游戏"
    NGD_I_want_to_play_games_desc: "一群来自异世界的人在打跑了曾经的伊比利亚人后，占据了她们的土地，还搞出了一堆展示其他世界风貌的游戏和游戏机。我们并不想给伊比利亚人主持什么公道，我们想要的是，这些新东西能不能成为我们控制世界的力量，她们应该给我们的人民免费提供游戏，如果她们不愿意，我们就上门去拿。"
    NGD_now_is_fantasy_time: "现在是，幻想时间"
    NGD_now_is_fantasy_time_desc: "在法兰西人的资料和书籍中，她们是被一堆妖精和妖精头子，所谓的贤者们赶出了她们的老家。现在那里叫幻想乡，这些妖精不好好呆在自己的家里做梦，还总是想着重新控制法国人的土地，甚至是成为欧洲之主。她们幻想的太多了，我们才是欧洲之主，我们会亲自找上门去，用军靴让这些家伙们醒醒脑子，不要再做无法实现的梦了。"
    NGD_fuck_out_aliens: "这里是地球，亡灵给我滚出去"
    NGD_fuck_out_aliens_desc: "也许法国人还不是最搞笑的，最搞笑的还是德国人。她们被不知道哪里出来的一群亡灵赶出了自己的国家，才不到几年过去，德国人就成为一个大骨头架子的忠诚奴才，而且这群亡灵还想着怎么征服世界。作为人类，我们看不得地球上还有死人天天活蹦乱跳，死去的要是都活过来，这不倒反天罡了吗？"
    NGD_real_Axis: "远洋才是世界轴心"
    NGD_real_Axis_desc: "当然，德意志人也不是完全都成了怂包蛋，一个所谓的德意志元首带着一群残兵败将搞了一个所谓的轴心国，天天喊着要反攻德国。但这帮家伙可是帮过法兰西人打过仗，给我们的统一大业添了大麻烦。我们才应该是世界的轴心，她们这个假轴心不配存在，而且她们也是跟骨头一样的极权主义危险分子，最好还是送她们去死。"
    NGD_treat_guests_to_pineapple_pizza: "请客吃菠萝披萨"
    NGD_treat_guests_to_pineapple_pizza_desc: "作为德意志人的忠实盟友，不，狗腿子，意呆莉人一直有股莫名的蠢劲，号称自己是什么罗马的正统，要统一欧洲，重现罗马荣光。但她们连一个小小的半岛都出不去，只能给德国人打打下手，现在还叫嚣着与我们为敌，简直可笑。听说她们不喜欢的就是菠萝，我们就要打上门去，请她们吃菠萝披萨，直到吃到她们满意为止。"
    NGD_the_shattering_soviet_union: "摇摇欲坠的联盟"
    NGD_the_shattering_soviet_union_desc: "作为世界上除我们之外最大的国家，苏联一直号称自己有着领导世界革命的权力和义务。但别忘了，苏联的前身是什么？世界上最垃圾的帝国主义国家沙俄，她们从没有像我们一样百年的积蓄，还总是用着社会主义的危险口号妖言惑众，鼓动我们周边的国家与我们为敌。记住，她们从始至终都是一堵破房子，只要我们主动上去踢一脚，这个表面上光鲜的联盟就会轰然倒塌。"
    NGD_notice_of_school_closure: "闭校通知"
    NGD_notice_of_school_closure_desc: "在南太平洋上，圣杯最大的控制地点莫过于一个所谓的学园都市，这个地方有着一群圣杯搞出来的所谓超能力者在这个地方天天狂轰滥炸，如果放着这帮人存在，我们在太平洋的海权将会被严重威胁。从此刻开始，这个学园都市将被视为非法组织关闭，除非有我们的许可，否则不许开门招生。"
    NGD_take_off_the_crown: "摘下王冠"
    NGD_take_off_the_crown_desc: "我们不仅是大西洋的霸主，我们也要在太平洋上有军事基地和控制权，而控制东亚海上咽喉最好的地方便在圣杯的东亚自治领和夏连特拉王冠领这两个圣杯号称是王冠明珠的地方，让我们把它们摘下来，点缀属于我们的帝国事业。"
    NGD_attack_Philippines: "菲律宾没有雪"
    NGD_attack_Philippines_desc: "在我们控制力量稍微减弱之后，我们的南洋总督府便生出变乱，一伙所谓的菲律宾独立运动分子夺取了这里，还要实现什么菲律宾独立？简直是一派胡言，胡说八道，这里从来都是属于我们的，她们希望用所谓的勇气和决心感动上天下场雪来赶走我们，不好意思，这是热带，从来都不下雪。"
    NGD_the_speed_of_cherry_blossoms_falling: "樱花飘落的速度"
    NGD_the_speed_of_cherry_blossoms_falling_desc: "作为我们在太平洋上最主要的对手，樱花一直都试图扩张自己在东亚的势力，无论是扶持本地所谓的泛亚主义势力，还是主动征服，她们都试图建立一个亚洲帝国。但她们错看了自己的实力，也错看了我们的决心，我们将用无匹的军力摧毁她们，让她们认识到，她们的野心将会像樱花飘落一样，凋零之后被我们压成烂泥。"
    NGD_I_will_be_back: "I WILL BE BACK"
    NGD_I_will_be_back_desc: "作为祖上离乡多年的游子，当我们回到阔别以久的中华大地后，看到的却还是山河破碎，共产主义者，三民主义者、君主、外族人、军阀都还是割据一方，这已经证明了她们都不能实现真正的民主和自由，只有我们才能为这片大地带来和平，就让我们来统一这片久经伤痛的大地，带来真正的天命吧。"
    NGD_invincible_is_so_lonely: "无敌是多么寂寞"
    NGD_invincible_is_so_lonely_desc: "所以说，世界的秩序和和平最终还是需要武力来塑造的。经过长年的战争，我们消灭了世界上所有可能发动战争的强权国家和危险势力，实现了围绕大西洋两侧的全球和平，未来的世界将长期围绕以我们为中心的自由世界秩序建立秩序，我们已经是当世无敌，或许我们应该称呼未来的时代为，美式和平？"

    NGD_NATO: "北大西洋公约组织"
