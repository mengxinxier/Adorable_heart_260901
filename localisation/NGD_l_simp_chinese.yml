    NGD_end_of_republic_desc: "随着以郑氏集团为首的大明复兴党及其他君主派支持者进驻首都各个关键机构，腐败无能的共民两党所支持的民主共和游戏终于划上了句号。经商议，党内外共推英灵郑成功大人和秦良玉大人为政府首脑，主持国政。在过去，商人们利用败军之际篡夺国政，如今我们以彼之道还之彼身。这一次，我们定要向法兰西贼子复仇，并重返中华故土，重建大明。"
    NGD_tame_the_parliament_desc: "在经济危机爆发后，所有人都见识到了议会制度的腐败无能，赈灾救市拖延，市场保护无能，连社会底层百姓的薪水和忠诚都难以保持，实弊制也。即日起我们将重构国内议会制，非我党党员及支持者通通赶走，政府权力即刻转移到郑秦二位大人之手，当今危急之秋，唯有强权才能救国。"
    NGD_eliminate_disloyalists_desc: "除了那些民主制支持者，我们也要把社会主义者一并铲除。这些人号称要为基层百姓谋公，却对社会秩序大肆破坏和劫掠。她们的愚行为我们做了嫁衣，但她们的危险性不容小觑，这样的阴谋集团继续存在便是对政府的最大威胁，必须立刻行动起来，将她们一并铲除。"
    NGD_loyalty_is_rewarded_desc: "虽然商业联合会里蠢蛋居多，但国内也有很多忠诚于国家且有能的文武良才，是她们在危机爆发后尽心竭力的施政救民，保证了本国秩序没有在危机爆发的一瞬间崩溃。如今我们重返政坛，议会自然需要取缔，但这些忠良之士也应得到我们的任用，那些追随我们的元老更要多多封赏。奖惩有度，更多人才会愿意相信我们，支持我们。"
    NGD_rebuild_the_royal_guards_desc: "高层的反动派已不成气候，但底层的反对声音也需要压制，我们的复仇大业也需要加强军事情报方面的收集。因此，锦衣卫的重建需要提上日常，我们将用现代制度和军械重新武装锦衣卫，让飞鱼服再次成为我们敌人的梦魇。"
    NGD_save_the_economy_desc: "完成集权之后，再无嘈杂之音，我们开始可以全力拯救当今崩溃的经济了。如今国内虽然挺过了危机的最大冲击，但外贸凋敝，饿殍满地，亟需一笔强大的资金注入救市，正好，我们在抄家那些反对者的过程中得到了大笔财富，我们只需拿出一部分投入市场的关键领域，配合巧妙的宣传，便可以重振市场信心。"
    NGD_disaster_relief_funding_desc: "在经济崩溃之后，由于政府财政资金的快速枯竭，政府内的众多社会保障项目全面瘫痪，社会弱势群体得不到保障，更别提在所谓民主的资本主义制度下，常平仓等赈灾项目都被所谓保护市场、自由竞争的名义所废除了。\n\n我们可不会像那些资本家一样没良心，政府将重设预备仓、常平仓等赈灾机构，并拨款重建安乐坊、养济院等福利机构，让万民得以安乐，我们的统治便会更加稳固。"
    NGD_royal_ownership_desc: "经济危机造成了众多外企和国内企业在危机期间资金链中断，就此破产，而她们远在天边的宗主国自顾不暇，这些企业便成了社会的负面资产。她们的老板们恨不得赶快把这些垃圾都出手掉。这正是我们的机会，我们完全可以以低价收购这些外企和一些优质资本，转变为皇家所有制企业，集中生产。有了产业和资本，皇室才不会再次受制于商人的金钱攻势。"
    NGD_monopolistic_operation_desc: "要解决经济危机，就得稳定就业。危机所导致的大量企业倒闭造成了社会上众多劳动力失业，如果不解决她们的就业，一味赈灾还是会产生更大危机，好在我们如今已经有了一大批皇家企业，我们将参考古代的工商食官制度，将这些失业人口引入皇家企业就业，保证我们的社会稳定和经济有效恢复。"
    NGD_expand_the_ordnance_bureau_desc: "解决就业困难的另一方向便是军工方向。经过上百年的繁荣，我们的国民都有着不素的知识水平，完全可以胜任军工生产的工作，我们的复仇大业也需要从尽快积攒军备，我们将视情况扩建军器局，招收更多的工人，发下更多的订单，在解决就业的同时开始重建军工产业。"
    NGD_compulsory_military_service_desc: "要复仇法兰西，重新征服北美这片新大陆，我们就必须拥有足够的军力。仅凭过去的征兵制度是不够的，政府将参考欧陆文明的经验，实行义务兵役制，所有到达服役年龄的公民都有服兵役的义务，我们将从此刻开始动员社会力量。"
    NGD_serve_for_great_ming_desc: "仅仅是靠制度来要求民众服从很容易招致不满，但我们还可以通过民族主义的宣传口径。我们将对外宣传，我大明历史上是天朝上邦，因国内宵小动乱不得已偏安一隅，如今皇室已拨乱反正，参军者不仅是大明忠臣，如能在战争中先登斩将者，还可获邑封爵，成万世美名。"
    NGD_new_ming_army_desc: "皇道中兴，我们的远洋军也将转型为新明军。时代已经不同，太祖高皇帝的军户制度在当今已经无法使用，我们必须适应新时代的战法，效法世界强国建立更先进的职业军队模式。"
    NGD_soul_of_baigan_army_desc: "世界各国都在组建本国的特种部队，考虑到我军未来山地作战的情况，我们将重建秦良玉将军曾经统率的那支白杆雄兵，我们将专门选拔各宣慰司、府的山民和精灵等少数种族加入此军，整军经武，进行最精锐的训练。过去的白杆兵败于流寇之手，如今的我们绝不会重蹈覆辙。"
    NGD_treasure_ship_sails_desc: "欧洲人常谈是她们开创了世界航海的历史，但实际上我们才是历史上大航海的发起者。我大明的宝船早在泰西人百年之前就下西洋之地，传播皇朝天威，开辟了中华到新大陆的航线。如今我们在学习与交流中也习得了西方更先进的造船技术，我们将重建一支铁甲、钢甲组成的炮舰甚至航母舰队，以制霸西洋，重返故土。"
    NGD_eastward_movement_desc: "百年以前，我国受圣杯之制、商人之叛败于流亡此地的法兰西王室，我们东进大业就此折戟。如今时机已到，圣杯自顾不暇，东方各势力纷乱不断，机不可失时不再来，我们将重启东进运动，消灭东方各势力，完成大明未竟的天命。"
    NGD_appease_the_Ziyad_peopledesc: "虽然齐亚德人历史上也是法兰西人的后裔，但与那些傲慢无礼的法兰西人不同的是，她们与我们相交百年之久，彼此之间也曾抗击过法兰西人的西侵，甚至她们也曾搞过君主制，只要不像法兰西人一样镇压她们，她们还是愿意服从于贤明之君的。我们将派出官员安抚她们，换取她们的效忠。"
    NGD_discipline_the_Frenchdesc: "与齐亚德不同，法兰西人自流亡至新大陆后，逐步变得疯狂且傲慢，她们的王室对外来文化大肆贬低，她们的教会排斥礼法，她们的官员更是充斥着各色阴谋集团，我们必须摧毁他们的传统，毁其淫祠，去其历书，让精灵和齐亚德人好好历数一下法兰西人的所作所为，对她们进行大规模的清算。"
    NGD_accept_the_seireidesc: "在过去，为了吸纳这片大陆上的精灵为我所用，我们编织出了一个所谓玄鸟之民的传说，这让很多精灵有了加入我们的文化基础。如今她们已经落败，而我们与她们也无大仇，俗话说得好，蛮夷入华夏则华夏之，只要她们愿意接受天子礼法，便是我大明之民。"
    NGD_ready_to_go_home_desc: "终于，我们统一了新大陆，扫平了各个反抗势力，凝聚了新大陆的精华。在我们兵强马壮之际，我们的故国中华仍在战火之中，樱花虎视于外，共产党、国民党以及伪帝蒋氏纷争于内，中华百姓困苦不堪，这正是我们实现回乡大计的最佳时机，收拾舰队，整顿兵马，我们回中华！"
    NGD_long_way_home_desc: "终于，经过漫长的血战，我们扫平了共产党、国民党、伪帝等众多势力，光复了旧都南北京城，中原等中华故地，我等海外孤忠终于实现了恢复中华的百年之梦。\n\n但归乡并非结束，而是个开始。眼下中华大地在长期战争和分裂之后也像曾经的北美大地一样满目疮痍，长期分裂的行政体系也让各地如旧元覆灭一般南北、东西分裂严重，我们将开始更大规模的重建工程，重建行政秩序，以重建中华，得万民之心。"
