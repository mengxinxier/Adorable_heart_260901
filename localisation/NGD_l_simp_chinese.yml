    NGD_Ming.001.title: "御座空悬"
    NGD_Ming.001.desc: "漫长的战争结束了，时隔百年，我们终于重新踏上家乡的土地。现在，放慢脚步，享受胜利的喜悦、和平的安宁，胜利属于我们！\n\n。。。。。。\n\n首都的庆祝活动持续了几日，暂时没有停歇的意思。诚然，伟大回归之旅的庆典值得归乡者们全身心地投入其中，但眼前的欢愉并不能遮掩现实的苦涩，漫长的内战几乎摧毁了整个国家，放眼神州满目疮痍：经济靠美洲领地输血暂时维持微妙的稳定，军队编遣正在进行，土地分配方案处于酝酿之中，政府运作依赖旧国家机器的官僚，整个体系嘎吱作响，但是其围绕运行的核心呢？空悬的御座压在每位大臣的心上，他们清楚有很多声音支持国姓爷荣登大宝，希冀以此谋求从龙之功，但那位国姓爷本人是怎么想的呢？"
    NGD_Ming.001.a: "与其寻找主公，不如为自己创造一个主公" 
    # NGD_Ming.001.a: "国不可一日无主，还请延平王速下决断。" 

    NGD_Ming.002.title: "请继统以安社稷表"
    NGD_Ming.002.desc: "臣等顿首谨奏：《尚书》有云“民非后，罔克胥匡以生”，今九庙悬而未祭，万机辍而不行。臣等夜观天象，帝星已明紫微；昼察群情，黎庶咸仰新日。伏请殿下承七庙之重，继大宝之统。当此乾坤震荡之际，惟早定国本，则：一可安祖宗社稷，二可固四海民心，三可绝窥伺之患。臣等冒死恳请，俟新日升于寰宇，必见祥云绕阊阖，甘露降坛场。社稷至重，不敢容缓；神器有归，岂宜久虚？惟殿下速决大计，以慰先帝在天之灵，以解苍生倒悬之急。臣等昧死再拜，谨奉表以闻。"
    NGD_Ming.002.a: "敕令：即遣三公分行寻访宗室贤良，期以一月。若无应天命者，孤当归承大统，以安社稷。"

    NGD_Ming.003.title: "一条传闻"
    NGD_Ming.003.desc: "汉昭烈帝曾言，风从虎，云从龙，龙虎英雄傲苍穹。近日，探马来报：某地群山之间忽现玄异之兆——昼见赤云如龙鳞蔽日，夜有紫气若帝星垂野，乡民窃语，皆言“真龙胎动，圣主将临”。此事已渐传州郡，流言或扰民心，或动社稷。是否遣人一探究竟？"
    NGD_Ming.003.a: "龙，可是帝王之征啊" 
    NGD_Ming.003.b: "我再听到你们议论痴人呓语，我就扎聋我自己的耳朵"

    NGD_Ming.004.title: "新帝即位"
    NGD_Ming.004.desc: "朝中派出的密探，星夜兼程奔赴地方，三天内纵横八百里，找寻一月，天不负有心人，方得真龙。待真龙回朝数日，言谈举止中，已有了三分帝王之气，诸臣以此劝进。"
    NGD_Ming.004.a: "漂泊者不做皇帝谁做啊，难道叫张三做吗"

    NGD_Ming.005.title: "时限已到"
    NGD_Ming.005.desc: "朝中派出的密探，星夜兼程奔赴地方，三天内纵横八百里，找寻一月，然天不遂人意，终未寻得真龙天子，诸臣以此再劝进，国姓爷推脱数次，无奈从之。"
    NGD_Ming.005.a: "恭喜延平王可以称帝了"

    NGD_Ming.006.title: "皇帝的新衣"
    NGD_Ming.006.desc: "今天想穿哪套服装呢"
    NGD_Ming.006.a: "华丽才带派"
    NGD_Ming.006.b: "可爱系不赖"
    NGD_Ming.006.c: "晚礼服，细肩带"
    NGD_Ming.006.d: "常服宽松又凉快"
    NGD_Ming.006.e: "JK青春靓丽尽显年轻态"
    NGD_Ming.006.f: "还是用第一版方案吧"
