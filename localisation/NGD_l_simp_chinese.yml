    NGD_Shame_on_Rocky_Mountains_desc: ""
    NGD_Shame_on_Rocky_Mountains_tt: "所有§Y步兵§!单位陆军营：\n§Y山地§!加成：\n攻击：§G+15.00%§!\n防御：§G+10.00%§!\n速度：§G+10.00%§!\n所有§Y火炮§!单位陆军营：\n§Y山地§!加成：\n攻击：§G+15.00%§!\n防御：§G+10.00%§!\n速度：§G+10.00%§!\n所有§Y装甲§!单位陆军营：\n§Y山地§!加成：\n攻击：§G+15.00%§!\n防御：§G+10.00%§!\n速度：§G+10.00%§!\n\n"
