  adorable_heart_jueyi.1.t: "[From.GetName]对我们贸易优惠"
  adorable_heart_jueyi.1.d: "为了我们两国的能够更深层的交往[From.GetName]决定减少我们对其资源的进口价格，我们在进口[From.GetName]的战略物资上将享受半价优惠"
  adorable_heart_jueyi.1.a: "大好事"

  adorable_heart_jueyi.2.t: "[From.GetName]可以对我们走私石油"
  adorable_heart_jueyi.2.d: "我们陷入了战争，部分石油来源被封锁了。[From.GetName]表示可以对我们秘密的输送燃料，总量为50吨，分批次运输且不会被敌人干扰，当然价格也不会便宜"
  adorable_heart_jueyi.2.a: "这对我们很有帮助"  
  adorable_heart_jueyi.2.b: "还不需要"  

  adorable_heart_jueyi.3.t: "[From.GetName]同意燃料我们秘密输送燃料"
  adorable_heart_jueyi.3.d: "对方同意我们走私燃料的提议，我们会把货船伪装成邮轮以此来躲避他国的海上封锁"
  adorable_heart_jueyi.3.a: "很好"  
  adorable_heart_jueyi.3.b: ""  

  adorable_heart_jueyi.4.t: "燃油悄悄到岸了"
  adorable_heart_jueyi.4.d: "我们每20天都会从走私中收到10万吨的燃料，这对我们的战争非常有用"
  adorable_heart_jueyi.4.a: "非常有用"  
  adorable_heart_jueyi.4.b: ""  

  adorable_heart_jueyi.5.t: "对方拒绝"
  adorable_heart_jueyi.5.d: "[From.GetName]拒绝了我们的提议"
  adorable_heart_jueyi.5.a: "好吧"  
  adorable_heart_jueyi.5.b: "" 

  adorable_heart_jueyi.6.t: "走私燃油的利润"
  adorable_heart_jueyi.6.d: "我们每周都会从燃油走私中获得收益"
  adorable_heart_jueyi.6.a: "很好"  
  adorable_heart_jueyi.6.b: ""  

  adorable_heart_jueyi.7.t: "政治点兑换HCP"
  adorable_heart_jueyi.7.d: "我们可以用政治点数来购买全球通用货币——HCP\nHCP可以用来辅助国家更好发展甚至维持战争运作"
  adorable_heart_jueyi.7.a: "少量的购买"  
  adorable_heart_jueyi.7.b: "适量的购买"  
  adorable_heart_jueyi.7.c: "大量的购买"  

  adorable_heart_jueyi.8.t: "民用工厂兑换HCP"
  adorable_heart_jueyi.8.d: "我们可以变卖民用工厂的方式换取全球通用货币——HCP\nHCP可以用来辅助国家更好发展甚至维持战争运作"
  adorable_heart_jueyi.8.a: "变卖一座工厂"  
  adorable_heart_jueyi.8.b: "变卖两座工厂" 
  adorable_heart_jueyi.8.c: "变卖三座工厂" 

  adorable_heart_jueyi.9.t: "申请贷款"
  adorable_heart_jueyi.9.d: "根据国家实力一次贷款的额度也不同，一般工业越高可申请贷款的金额也越高\n每次贷款瑞士银行会收取5%手续费。如果你有过多的债务很可能导致经济崩溃"
  adorable_heart_jueyi.9.a: "100亿"  
  adorable_heart_jueyi.9.b: "300亿"  
  adorable_heart_jueyi.9.c: "600亿"  
  adorable_heart_jueyi.9.e: "1000亿"  

  adorable_heart_jueyi.10.t: "经济大萧条"
  adorable_heart_jueyi.10.d: "我们国家由于负债太高，资金周转出现了严重问题，不立即解决的话我们的经济将无法继续运作下去"
  adorable_heart_jueyi.10.a: "必须解决这个问题！"
  adorable_heart_jueyi.10.b: ""

