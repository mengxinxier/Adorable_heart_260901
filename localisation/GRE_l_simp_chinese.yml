#结语
  GRE_Augusta_end_title:"§9自豪吧，见证烈阳永耀！§!"
  GRE_Augusta_end_tip:"黎那汐塔的先祖们穿越了黑夜与怒涛，靠着一条条小船，在陌生的海岸上踏出了第一步，我们的先辈们带着荣耀在伯罗奔尼撒半岛铸就了一个又一个奇迹，而如今这般强盛的黎那汐塔，也可不可以称作奇迹呢？\n\n……看，桑古伊斯狩原归巢的狩王鹫正掠过总督宫的上空。我的挚友，请聆听着它们的啼鸣、追随着它们的羽翼，飞掠黎那汐塔的每一寸土地——这片坚实的土地，这是我们，还有我们的祖辈从灾厄手中夺回的。七丘人从不轻言斗争的伤痛，因为我们深知，胜利的道路从不是平坦的通途。我会将这份辉煌的荣耀延续下去，这是我对七丘人、对这片炽热的土地做出的承诺。"
  GRE_Augusta_end_tip_2:"感谢您对钢铁萌心与黎那汐塔内容的喜爱与支持！\n太阳终会落下，但它总能升起——以呼啸致意，黎那汐塔的英雄们！"
  GRE_Augusta_end_close_button:"§O荣耀不朽！§!"
  GRE_Augusta_end_close_button_TT:"我的挚友，你会站在卡庇托山的山巅，亲眼见证最壮丽的朝阳！"

