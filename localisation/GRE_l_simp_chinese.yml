  GRE_event.2.t:"暗潮将映"
  GRE_event.2.d:"站在卡庇托山的山顶，可以望见整个七丘城，烈阳如火，石阶在暮色中泛起一层暗沉的赭红，那是被日光浸透了千年的血与铁，是数百年来，无数妄图攀登上这群山之巅的人，留下的叹息与痛苦。\n风从分界山的方向刮过来，撩动着她赤橙的长发。半空中，数只狮鹫呼啸而过，带来远处的风，带着从更远的地方，从拉古纳城的海水中激荡而来的苦涩气味。\n拉古纳与七丘。她曾无数次在心中默念这两个名字。她们是黎那汐塔的双足，一只踏着海水与祷文，一只踏着山岩与铁剑。只是如今，黎那汐塔这尊傲视苍古的巨人，却早已无法同千年之前一般……\n群山之外，猎犬与毒蛙正虎视眈眈；海峡之上，红色的巨人蓄势待发；或许更久之后，不死族的兵锋将会直指爱琴海……\n风停了，空气重新沉寂下来，总督宫到四方殿的距离不算近。阳残，弦月上弓，奥古斯塔站在四方殿前，望向深处，尤诺站在庭中，裙摆如涟漪般铺陈开来，月光自她那双修长的腿旁洒落下来，映着久经风霜的石砖，映着她身后波光粼粼的池水。\n“奥古斯塔……”\n没有回头，谕女早已知道来人是谁，转身，赤足踩在冰凉的白石上，走到奥古斯塔面前，仰起头来。月光把她的面容照得近乎透明。\n“出什么事了吗，尤诺。”，奥古斯塔盯着那双苍青色的眼眸，尽管声音疲惫，但依旧坚韧，她此行应谕女所唤，如初见一斑，却大相径庭。\n“先看看月亮吧，奥古斯塔。”，尤诺揉了揉奥古斯塔拧成一股的眉头，轻轻说道"
  GRE_event.2.a:"“今夜的月相，属于我们的总督大人。”"

  GRE_event.3.t:"长夜将至" #尤诺预言，触发day2事件
  GRE_event.3.d:"“奥古斯塔，还记得吗，谕女殿向元老院的谕言中，黑潮将在不久后席卷整个黎那汐塔。”\n“而现在，这份谕言，被推算出了具体的时刻——”\n尤诺的目光越过庭院的石栏，越过分界山，投向更远处的虚空。月色在她的眼瞳中流转，仿佛有什么东西正在那里凝聚成型，又转瞬即逝。随后，她重新将目光放在了眼前如太阳一斑耀眼的奥古斯塔身上。\n月亮的清辉自尤诺的眼眸中闪烁，她注视着奥古斯塔，看着这位在血与铁中向上攀登着的王。“奥古斯塔，你会带领七丘，带领整个黎那汐塔进入新的纪元。”\n奥古斯塔没有再说话。她的手按上腰间的剑柄。冰冷的触感从掌心蔓延至四肢百骸，将她从短暂的恍惚中拉回现实。“这也是谕女的预言？”奥古斯塔回应道。\n“或许吧，但我更希望你能当成——”"
  GRE_event.3.a:"朋友的祝愿。"

  GRE_event.4.t:"猎犬与狐狸" #元老院密谋
  GRE_event.4.d:"元老院议事厅的烛火燃到了深夜。厚重的橡木门紧闭，将月光与夜风一并隔绝在外。六位身着深色长袍的老者围坐于长桌两侧，他们的面孔在烛光摇曳中显得明暗不定，像六尊从褪色化岩壁上凿下来的石像。\n为首的是塞维鲁，年过七旬，银发梳理得一丝不苟，手指上那枚刻着家族纹章的戒指在桌面上轻轻叩了三下。\n“诸位，”他的声音低沉而平稳，像一把被丝绒包裹的钝刀，“总督府的权力，已经渐渐不属于我们了。”\n长桌两侧的目光聚拢过来。没有人插话。塞维鲁从不说不必要的话——这一点，在座的人都领教过。\n“直接动奥古斯塔，”他微微摇头，“不明智。角斗场里走出来的英雄，七丘的贱民们为她戴上了王冠。正面冲撞，是把民意往她怀里推。”\n他停顿了一下，环视众人的目光最后落在长桌尽头的一位瘦削老者身上——那是卡西乌斯，元老院的执笔人，精通法典与议事规程，在元老院的廊柱间，他的话有时比总督的剑更锋利。\n“但奥古斯塔一个人可坐不稳总督的位子。”塞维鲁的嘴角微微上扬，“谕女之庭。尤诺。”\n这个名字落在桌上，像一粒石子投入沉寂的池水。随即便是如潮水般的质疑与否认。\n“尤诺？四方殿的红人，动她？”“不以政治裹挟谕女，这可是元老院的铁律，这么做岂不是在自掘坟墓……”\n“四方殿谕女尤诺，行事无度，言辞狂妄。”卡西乌斯拔高声音，压住了嘈杂的现场，手指点在面前摊开的一卷羊皮纸上，那上面密密麻麻写满了字，全是近几个月来尤诺在公开场合的言论记录，“上月秋收祭上，当着十二家贵族的面，说‘元老院的老头们耳朵比脑子先腐烂’。三天前，拉古纳的修会使者来访，她拒绝出席，理由是——‘我见不得那些被海水腐蚀过的皮囊，恶臭至极’。一个谕女，妄议修会，藐视元老，有失身份。”\n“有失身份”——这四个字是关键。在黎那汐塔，贵族们最拿手的武器不是剑，是规矩。规矩写在法典里，写在传统里，写在每一次规制的仪式和每一个看似不经意的措辞里。一剑可以毙命，一句话却可以削掉一个人的立身之基。而他们要做的，就是让尤诺不得不按着他们的“规矩”来，让奥古斯塔知道，七丘还不是她总督一人就能一手遮天。\n另一位老者补充道：“‘有失身份’——按元老院规典第七章，皇室内廷成员言行失当，可发起弹劾，交由元老院与总督共同裁决。”\n塞维鲁点了点头。这正是他们要走的路径。不做秘密暗杀，不搞血腥政变。一纸弹劾，明早直接递到总督宫去。明面上弹劾的是尤诺的举止，实则是要在奥古斯塔身边撕开一道口子。她想完全掌握总督权柄？那他们就让所有人看清楚——她连身边的人，都未必护得住。\n“票数。”塞维鲁竖起三根手指，“二十四人，我们需要十三票。在座六位，宫内有我们的四位，拉古纳那边的修会势力不会站队，但其余几位——卡西乌斯，你明天晨会前，挨个谈。告诉他们，这不是针对总督。这只是规正谕女之庭的体统。为黎那汐塔的体面。”\n“体面。”卡西乌斯笑了起来，笑容在烛火下显得阴冷而精明，“好词。”\n烛火跳了最后一下，终于燃尽了灯芯。议事厅陷入短暂的黑暗。黑暗中，只听见塞维鲁缓缓起身，衣袍摩擦的窸窣声。"
  GRE_event.4.a:"明日，弹劾谕女！"

  GRE_event.5.t:"修会，圣女，岁主" #隐海修会
  GRE_event.5.d:"“主教，不要在执迷不悟了！”\n“圣女弗露德莉斯，从来不应该是，也不该成为修会作秀的工具！”\n拉古纳城，隐海修会，黄金王座下，菲比摘下纯白的头巾，向着那高高在上的主座，向着那已被利欲蒙蔽良知的芬莱克怒吼道\n“台下的是谁？”芬莱克向着身旁的助理问道。\n“是修士菲比……”\n呵，多可笑，隐海修会的主座日理万机，说是要将岁主的福泽洒遍整个黎那汐塔，到头来，却连自己手下的修士都认不全。\n“修士菲比，你可知，你是在挑衅修会的尊严，挑衅岁主英白拉多的威名！”\n“将圣女用于政治作秀？修会从不会做出如此亵渎之事！”\n“修会没有，但您有！”菲比攥紧拳头，散发着威严之气的荣光节使已走到了她的身后，似乎只要芬莱克一句话，她就会被修会除名，丢弃到拉古纳的大街上\n但她还是要说，一定要说，即使身死道消，也绝不能放任如此\n“五百年前，修会主座那不盖勒二世严正声明，禁止修会参与一切政治活动，修会必须以身作则，为整个黎那汐塔带去信仰与希望。二十年前，圣女弗露德莉斯为救万千黎民冲向黑潮再无还路，他们的奉献绝不应成为作秀的筹码……”\n“这里不需要你来背诵教典！”\n铁器相交，荣光使节亮出庇佑臣民的刀剑，寒铁之上，是那个站在阳光下的主座\n“修士菲比，你的行为令庇佑你的岁主蒙羞。”\n“芬莱克主座——你已误入歧途，岁主之声绝非如此，此行之事恐为鸣式所愿！”\n“荒谬，我乃隐海修会之主座，岁主英白拉多之代行者，我将对抗鸣式，又岂会为它的傀儡？”\n“主座！”话未出口，荣光使节便将锋利的刀剑往上一步，抵住忤逆者的延后，将她带离这光面堂皇的朝拜之庭。\n“岁主啊，请原谅这位误入歧途的羔羊……”"
  GRE_event.5.a:"修士菲比，以下犯上，目无岁主。责令三周自省，重修圣典，以儆效尤"


  GRE_event_fenduan.6.t:"燃烧的心" #露帕剧情
  GRE_event_fenduan.6.d:"角斗场的喧嚣还堵在耳膜里，像潮水退去后残余的轰鸣。露帕从选手通道走出来时，汗水自脸颊滑落，几缕碎发贴在额角，被汗水浸成更深的颜色。她的呼吸还没有完全平复，肾上腺素退潮后的疲惫正从骨缝里往外渗。但通道尽头的铁栅栏外，已经挤满了人。\n他们在喊她的名字——“露帕！露帕！——”十几双手从栅栏的缝隙间伸进来，攥着角斗场纪念票根的，举着签名板的，还有一个小姑娘被挤在人堆里，脸涨得通红，手里举着一条和她发带同色的黑色布条，踮着脚尖拼命往前够。\n如果是其他角斗士，大概会挥一挥手，留一个背影，在保镖的簇拥里扬长而去。但露帕不是这种人，她也从来不是那种高高在上的英雄。她走过去，接过那小姑娘的布条，伸手揉了揉小姑娘刻意和自己扎成一样的发型。\n“露帕姐姐—”小姑娘的声音激动得发抖，“你今天的战斗太帅了，但…最后，最后露帕姐姐转过来后，大家都站起来欢呼，我也就没看到露帕姐姐…”\n露帕笑了一下。“那下次，我给你留一张前排的位子。”\n周围的粉丝笑了起来，气氛松弛了几分。她挨个签名，接过递来的纪念品，听他们七嘴八舌地说着今天比赛里最精彩的几个瞬间。她在第三回合的防守反击；对方那个用长矛的新人差点扫到自己的脚踝；她偏头闪避的角度有多惊险——他们记得比她自己都清楚。\n五分钟后，安保从通道另一头赶过来，分开了人群。她冲那小姑娘最后挥了挥手，转身走向停在巷子里的轿车。车门关上的瞬间，欢呼声被隔绝在外，车厢里安静得像沉入海底。她靠在座椅上，闭上眼睛。\n几分钟后，车停在列奥尼达酒店后门。露帕没有走正门，从卸货区旁边的一道窄梯上了四楼。走廊里没有人，地毯吸收了脚步声。推开休息室的门，长桌横在房间正中，两侧坐着六七个人。桌上铺的不是桌布，是七丘的城区地图，几处关键位置用铅笔画了圈。靠墙的架子上码着厚厚一摞文件，上面印着角斗士公会与元老院谈判的会议纪要。\n“大明星回来了，”坐在长桌最里侧的一个女人抬起头，冲她挑了挑眉"
  GRE_event_fenduan.6.a:"“嗯，久等了。”"

  GRE_event.6.t:"燃烧的心" #露帕剧情
  GRE_event.6.d:"露帕走到长桌最前端那把空着的椅子前，拉开，坐下。发带解下来搁在桌上，湿漉漉的，在泛黄的文件纸上洇出一小片深色的水渍。她揉了两下太阳穴，抬起头，脸上已经没有了刚才在粉丝面前的笑容。\n不是疲惫。是切换。是白天的冠军和夜晚的领袖之间的切换。\n“元老院那边怎么说？”她问。\n“塞维鲁的亲笔信，今天下午到的，”那女人把一张信笺顺着桌面推了过来，“客客气气——‘深切理解角斗士同仁的合理诉求’。”\n“‘理解’，”她重复了一遍这个词，嘴角浮起一丝冷意，“元老院的‘理解’，跟废纸的区别只在于印着他们家族的纹章。”\n她把信笺翻过来扣在桌上，手指在上面点了两下，抬眼看着满桌的人。\n“元老院要在明天的总督宫上弹劾谕女尤诺。塞维鲁亲自出马。”\n“妈的谕女他们都敢动了？真以为七丘是他们的了。”屋里有人骂了一声。\n“谕女的事情我们不用担心，奥古斯塔能坐到这个位子，靠的可不是妥协与求全。”露帕的声音不高，却在密闭的房间里格外清晰，“元老院的精力全已经押在那场弹劾上。派人盯住塞维鲁在元老院的人，抚恤金的问题，明天必须拿下。”\n长桌两侧没有声音，只有笔在纸上飞快划过的沙沙声。露帕站起来，指尖扫过桌上摊开的城区地图，停在角斗场东侧的工会大楼标记上。\n“还有一件事。”露帕的目光沉了下来。“有消息说，黑潮要来了。”\n这个名字像一颗石子砸进水面，激起满屋无声的涟漪。黑潮。第三次黑潮的预言挂在所有人的头顶，像一把悬而未落的剑。而露帕——角斗场上的露帕，列奥尼达酒店里的的露帕——她知道，当那把剑落下来的时候，能保护角斗士们的，从来不是来自元老院的“理解”。"
  GRE_event.6.a:"而是她们自己。"

  GRE_event.7.t:"总督且英雄王" #days2事件，总督宫，元老，
  GRE_event.7.d:"“总督阁下，你太纵容她了。”\n“谕女代表着黎那汐塔的脸面，”卡西乌斯站在议事厅左侧，手中握着的，是今早才呈上来的，足足写了三大页的，有关谕女尤诺的‘罪证’。“然尤诺身为「谕女」却行事无度、言辞狂妄，实在有失身份。”\n“没错，她既无召见，也无通报，竟然敢如此无礼，擅闯总督宫。”\n“这是在公然挑衅总督宫的威严！”\n\n呵……一如既往。\n\n“总督阁下，元老院二十四席十三席以为，应将尤诺革职，重选谕女首席。”\n“诸君，”奥古斯塔开口，语气中带着不容置疑，眼眸中投去轻蔑与鄙夷。“「谕女」不见拉古纳的使者，是本就不必见；迈过的那一级低矮的门槛，它既无法承载总督宫的威严，也不必维护任何人脆弱的自尊。”\n“还是说，那是你们的脊梁？”\n“奥古斯塔！你别以为贵为总督就能为所欲为！”卡西乌斯怒吼道，但他对上的，是奥古斯塔冰如寒窖的眼神\n“别忘了，世人敬畏的从来不是卡庇托山上的高墙。”\n“我的意志，我的剑，我们势不可挡的征服，才是总督宫的威严所在。”\n“我知道你们在恐惧什么——你们害怕一位「谕女」的声音凌驾于你们之上，畏惧一个离经叛道的属民动摇元老院的规矩。”\n“但听好了，权柄从来不会垂怜虚与委蛇的可怜虫——”"
  GRE_event.7.a:"想要它？那就别藏在阴影里，拿出胆量，向我证明你们的资格。"
  GRE_event_7_tooltip:"§L总督赦令——准元老院卡西乌斯等七位长老因体不适告老还乡，元老院空缺席位将于总督拟定人选后公开向众。§!\n\n\n"

  GRE_event.8.t:"来自极地的通讯" #星炬学院事件——入驻，决议选址
  GRE_event.8.d:"深空联合，由索拉里斯各国势力共同组建的国际科研同盟，在多方考察多个地点后，由黑海岸推荐期望于我们这里成立学院，一方面加快她们对鸣式的研究，另一方面也能协助我们抵御即将到来的黑潮。\n总的来看，接受她们的提议实属百利而无一害的双赢条约。"
  GRE_event.8.a:"欢迎，来自星星的客人。"

  GRE_Ameath_event.1.t:"拉贝尔的新人" #星炬学院事件——拉贝尔学部——爱弥斯线分支
  GRE_Ameath_event.1.d:"云霞出海曙，梅柳渡江春；三月桃花浪，星魂向远航\n隐海修会钟楼的铜钟敲过九响，分界山吹来的风裹着咸湿的水汽，拂过拉古纳运河两侧新绽的野樱。花瓣被风卷起来，落在青石板路上，落在运河里，落在那些正沿着石阶向圣堂广场走去的年轻人肩上。\n拉古纳已经很久没有这样热闹过了。上一次这般万人空巷，大概还是第二次黑潮退去后、修会重新升起岁主圣幡的那一天。商贩们推着板车挤在运河两岸叫卖，烤鱼干和蜜渍柠檬的气味搅在一起，被海风吹得满城都是。孩子们爬到石栏上坐着，晃着腿，冲街上那些穿制服的见习修士们做鬼脸。老人们拄着拐杖站在巷口，眯着眼睛望向圣堂广场的方向——那里排着一条长队，从广场正门蜿蜒而出，沿着石阶一路延伸到运河边，几乎看不到尽头。\n星炬学院。这个名字在半年前对于拉古纳人而言还只是个遥远的概念。修会与总督府联合发布的建院公告贴在城门口的布告栏上时，大多数人不以为然。七丘有角斗场，拉古纳有修道院，两座城市各自运转了几百年，向来井水不犯河水。一个设在拉古纳、向全世界招收适格者的学院？修会主教那边怎么会点头？总督府又怎么会拨出经费？传闻在酒馆和茶室里转了几个来回，最终被归结为一句话：谕女尤诺在总督耳边说了些什么，奥古斯塔就签了字。\n但传闻终究只是传闻。当圣堂广场上真的搭起了入学测试的白色帐篷，当第一批来自天南海北的孩子们真的背着行囊出现在拉古纳的城门下——所有人才意识到，这件事是真的。\n汽笛悠鸣，满载希望与火种的邮轮停靠在拉古纳的港口，黄皮肤，白皮肤，黑头发，黄头发……形形色色的新生踏上这片繁荣无比的港口城市，她们为求知，为理想，为那看不见的未来。\n今天，是爱弥斯第一次离开冰原和自己的故乡，几个月前，一个自称是TA的朋友的人，将信寄到了渐湖，她本来不想来的，她想守在哪里，等着TA回来，或许会夸她乖，或许会说她笨，但无论那样，她都会很开心，因能再次想见，因自己牢牢守住了约定，也因……TA没有忘记自己。"
  GRE_Ameath_event.1.a:"早安，拉古纳，晚安，拉海洛。"

  GRE_Ameath_event.2.t:"拉贝尔的新人" 
  GRE_Ameath_event.2.d:"“快十年了啊——”爱弥斯感叹道，海风带来她从未感受过的味道，撩起她扎起的长发，身旁，世界各地的学生们行色匆匆；抬眸，冰原之上清冷的日光此刻也变得无比和煦。\n“我就知道，你会来的。”陆赫斯逆着人群走来，金色的瞳孔下不仅藏着冰冷的刀，也有掩盖不住的，对眼前之人的宠溺。“总是待在冰原里，不仅对身体不好，在心理学上，身体的‘寒冷’总是对应着心理上的‘孤独’，偶尔去点别的地方，晒晒在冰原上晒不到的太阳，对长个子也很有帮助哦。”\n“好了！陆医生，我已经不是小孩子了。”爱弥斯躲过陆赫斯想揉自己脑袋的手，气鼓鼓的看着眼前的人，这是常听TA提起的好友，据说是来自新联邦的“医生”，嗯……杀手医生？“如果不是你说来这里可能会碰到TA，我可不会来……”\n干……干嘛，这人怎么一直笑眯眯的看着我，我脸上有什么东西吗，不……不应该啊\n“果然，还是个离不开TA的小孩子呢。”\n“喂——”\n“好了，好了，先带你入学吧，TA亲自推荐的这所学校……学生们热情可爱，海景美丽，正适合放松步调——嗯，希望如此吧。”\n“陆医生？”爱弥斯偏过头，看着眼前碎碎念的陆赫斯，和余光之外，追着声骸朝这里全速冲来的金发修士\n等等……什么东西\n“啊啊啊啊啊岁主庇佑让一让啊——”\n和所有搞笑二创一样的，冲过来的正是我们可爱的拉比，而我们的陆医生，也尽责的当好了刹车的职责。\n“非常抱歉非常抱歉，我也不知道这孩子为什么突然失控，二位……没有受伤吧”\n不过好在拉比只是一只可爱的布偶声骸，很可惜没把陆医生撞飞。\n“嗯——我们没事，不过这个小家伙……”\n陆医生收起化形的柳叶刀，将趴在地上的拉比提溜了起来，拉比歪着头，一人一骸就这么对视着\n“啊，拉比可能是太兴奋了，拉古纳好久没有这么热闹过了。”说着，菲比手中亮出手杖，瞄准着拉比的小脑袋高高举起\n“等等等等，修士小姐，你这是要干什么”\n“欸，嗯……一定力度的击打可以让思绪放空，思考停止，有利于发挥净化的力量……”\n“好了好了修士小姐，这小家伙都被你吓住了。”陆赫斯扶了扶脑袋，将拉比放到地上\n“这位‘拉比小姐’，还是交给他吧，他好歹也是个医生。”\n“欸，啊，好的，那拜托你了……额”\n“陆赫斯”\n“爱弥斯，星炬学院的新生”\n“啊，我是菲比，见习修士菲比”\n"
  GRE_Ameath_event.2.a:"“那么菲比小姐，要来颗糖吗”"



  GRE_event.9.t:"烈火与烈阳" #国策，与革命卫队交涉
  GRE_event.9.d:"“奥古斯塔，写什么呢”\n总督宫内，尤诺目无旁人的迈着步子踏上王座，偏着头看向奥古斯塔将纸张堆叠，塞进信封。\n“给革命卫队的……还有隐海修会。”\n很新奇的，尤诺没有接话\n“不过你怎么到总督宫来了，有什么变化的话，随时用终端联系我，倒不用专程跑来七丘城……至少在那件事到来前，我不希望你被所谓的责任束缚。”奥古斯塔抽出几份文件，随意的扫了几眼，便偏过头看向尤诺。\n“‘听吧，七丘的无信者们，高天的神已经怒不可遏。倘使七丘的君主再次藐视神的旨意，毁灭即是七丘命运’……坊间的留言，又传开了。”尤诺玩着自己的马尾，青色的头发缠住玉石般的食指，慢慢的，勒出一道纤细的血痕。\n“你信吗。”奥古斯塔放下手中的文书，靠在椅背上，这份从拉古纳飘洋过海的古老预言传了太久，传的太深，而在这个节骨眼上，必然是有什么人在暗中搞鬼。“‘但唯有手握非凡力量、自黑色浪潮中崛起的「英雄王」能使七丘永恒。他将平息汹涌的暗流与风波，以旧王的血为无上的荣耀加冕’……拉古纳的神，可从未将祂的福泽洒向七丘，这里的一砖一瓦，都是靠一代又一代七丘人垒起来的，我这个总督，也是在人们的呼声中，绝非什么神意之下当上的。”\n“法比乌、阿提留斯、薇利芮尔……一代又一代「英雄王」，一次次地将七丘从困厄中解放。我相信，只要「英雄」仍在，任何危难都无法撼动这座不朽之城。”金色的阳光穿过总督宫的玻璃，洒在奥古斯塔的面前，洒在象征总督与英雄的日与狮鹫之印上，奥古斯塔伸出手，将一缕阳光捧在手心。\n\n“高天的风暴就要来了，即使这是黑夜前最后的曙光，我奥古斯塔，绝对会，也一定会，将这片光带到明天！”\n\n“呵呵……”\n“你笑什么？”\n“原来我们的总督大人，还是个理想主义者。”尤诺松开自己的头发，注视着奥古斯塔金日般的眼睛，“不过啊，奥古斯塔，这次你可别想一个人扛下所有，把我排除在外。”\n窗外的太阳循着常理走高，透过总督宫的玻璃，璀璨的阳光洒在二人身上，似烈火前焰，似夺目白玉。\n奥古斯塔嘴唇勾起一缕不易察觉的笑容，搭上尤诺伸出的手，说道：“走吧，尤诺，我的挚友。迎接风暴的最好方式，就是步入它呼啸的狂风之中。”"
  GRE_event.9.a:"谢谢你，尤诺"

  GRE_event.10.t:"焰为众人而燃" #革命卫队回复
  GRE_event.10.d:"“总督宫的信？哼，那些身体里生锈的家伙能说出什么好话……”\n\n“等等……署名是——奥古斯塔？”\n\n    以呼啸向你致意，我的朋友。总督与革命卫队直接的矛盾并非不可协调，我代表总督宫向您和您的政党发出邀约，于不日于总督宫会面，商讨多年以来悬而未决的关于两党之间的矛盾，同时，为即将到来的，属于全黎那汐塔的危机做以应对。\n\n“露帕姐……咱们真的要去吗？全黎那汐塔的危机……不会又是什么新的噱头吧。”\n露帕抿了抿唇，全黎那汐塔的危机……§0黑潮§!……“奥古斯塔从不开这种玩笑——”"
  GRE_event.10.a:"走吧，去见见我们的英雄王"

  GRE_event.11.t:"爱国者？异教徒？" #国策，警示修会
  GRE_event.11.d:"“主教，弃信之地的文书——‘总督’亲笔”\n芬莱克接过呈上来的信件，奥古斯塔的笔锋犀利峭拔，简简单单的几行字，却已尽显总督威严\n“哼，黑潮，危难？她以为自己是谁？蔑视岁主，恐吓当局，真不负她不信者领袖的尊称。”\n“那主教……”\n“叛信者之言不必听，岁主的福泽她们无福享受。”"
  GRE_event.11.a:"“回信给她们——总督阁下日理万机，拉古纳的弹丸小事，修会自能处理。”"

  GRE_event.12.t:"修会的回信" #修会不在意
  GRE_event.12.d:"尊敬的黎那汐塔总督，七丘之主，奥古斯塔\n\n修会于今日收到您的信件，主座表示深刻理解您的担忧，但拉古纳毕竟受岁主庇佑，福泽之下未见黑潮半分身影。拉古纳之事修会自能处置，感谢总督仍旧挂念。"
  GRE_event.12.a:"冥顽不灵"

  GRE_event.13.t:"大萧条冲击拉古纳股市" #大萧条冲击
  GRE_event.13.d:"由圣杯王国股市崩溃引起的世界范围内的经济异常不可避免的冲击到了仍与圣杯经济强挂钩的我们，幸运的是，在年初采取的几样行政措施使我们的经济并没有完全崩溃，行动起来，七丘的子民们，黎那汐塔的儿女们，这并非是亡国前兆！"
  GRE_event.13.a:"我们将重建荣耀！"

  GRE_event.14.t:"一份报告" #经济抵住第一波冲击
  GRE_event.14.d:"黎那汐塔国家财政部已于1936年2月23日正式启动国家应急预案，授权黎那汐塔金融政策委员会并进行应急处置与救助配合。黎那汐塔中央银行的具体决策仍需国家总督直接批准。\n另附，黎那汐塔革命卫队已做好准备接受政府的直接指挥，共度难关。"
  GRE_event.14.a:"行棋至此，需全力以赴"

  GRE_event.15.t:"狩猎预备" #第一号总督令
  GRE_event.15.d:"脑补"
  GRE_event.15.a:"#测试文本#"

  GRE_event.16.t:"黑潮已至" #黑潮已至
  GRE_event.16.d:"潮涨，潮落，黑云压城，骇浪滔天。\n二十年前，黑潮遮天蔽日地冲向拉古纳。二十年后，同样的场景再次出现在同一片土地之上。\n但这一次，七丘的预言停滞，铁与血停在了毁灭的前奏。\n但这一次，拉古纳的神音渐歇，自称岁主共鸣者的修会主座，此刻也眉头紧锁。\n\n岁主——岁主——英白拉多，我们的神。\n圣女——圣女——弗露德利斯，修会的圣女\n英雄——英雄——奥古斯塔，王座之巅；\n凡人——凡人——何去何从，何去何从……\n黑潮——黑潮——恩赐？苦难？\n鸣式——鸣式——利维亚坦，利维亚坦"
  GRE_event.16.a:"愿你堕落，愿您拯救。" #——总督线
  GRE_event.16.b:"「巡游天国」吗？" #——爱弥斯线

  GRE_event.1.t:"星星，月亮与太阳" 
  GRE_event.1.d:"拉贝尔磁带，深空联合制式通讯终端、身份认证装置，同时，还有着保存与备份使用者频率的功能，尽管保留的频率并不足以做的事无巨细，但至少……\n而作为深空联合下属机构的星炬学院，自然也被要求全校师生必须使用由深空联合统一配发的磁带装置，因此，深空联合需要总督的批准，以让拉贝尔磁带能够接入黎那汐塔的终端系统。\n而当这份报告被呈到奥古斯塔面前时，尤诺却对这种新奇的玩意产生了浓厚的兴趣——\n\n“奥古斯塔，我们也来刻一个吧，就当作……一份纪念？”\n\n短暂的沉默过后，奥古斯塔认命的点了点头，虽然还是不知道尤诺为什么会对深空联合的磁带这么感兴趣。但……"
  GRE_event.1.a:"“你又偷偷跑出来的事，莉莉贝婆婆知道吗？”"

  GRE_event.17.t:"若以瞬间计量" #谕女的方案
  GRE_event.17.d:"编不出来了，如果没写完那就是写不完了，你们自己脑补一下，大概就是\n在没有阿漂的情况下七丘在打大伟，拉古纳+星炬学院在打弗露德莉斯，然后卡提用命把利维亚坦困住，最后险胜的故事。\n至于为什么要在没有阿漂的情况下打，我也不知道；阿漂现在在哪儿，我也不知道。"
  GRE_event.17.a:"情况还真是急转直下啊"

