  GRE_currency_collapse:"通货紧缩"
  GRE_currency_collapse_desc:"第一次伟大战争紧接着第二次黑潮，民众的恐慌导致市场总需求急速下降，同时，前代政府在伟大战争时期过度负债，战后仍旧采取紧缩的货币政策：拒绝超发和贬值贝币以恢复经济。国家靠着圣杯王国短期的经济输血勉强维持着市场稳定，本国货币体系几近崩溃。"
