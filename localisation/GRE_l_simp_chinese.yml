  GRE_event.53.t:"胜利日" 
  GRE_event.53.d:"莉莎小姐，看来胜利已经是轴心国的囊中之物了。\n但在战争结束后，德意志社会工人党需要面对来自内部的敌人，这可能比魔导王的危机更加恐怖。\n但不论如何，只要德意志国不违背与黎那汐塔的盟约，黎那汐塔仍将坚定的站在盟友身后。\n\n总督阁下，这是我们从最前线得到的电报——\n\n§R柏林！祖国！我们回来了！我们要把你从骸骨的手中解救出来了！§!\n\n至少，现在请为我们的德意志朋友"
  GRE_event.53.a:"干杯！"

