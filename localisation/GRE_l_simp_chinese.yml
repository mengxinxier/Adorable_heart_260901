  GRE_communism_into_government:"联合革命卫队"
  GRE_communism_into_government_desc: "我国经济如今以人而非利润为本。而我们有着显而易见的敌人，那便是外国的剥削资本家以及本国的投机分子害虫，他们无时不刻地想要欺诈[ROOT.GetAdjective]劳动者的合理收入。在这个观点上，革命卫队与我们的意见一直是一致的。"
  GRE_right_corporatism:"左翼法团主义"
  GRE_right_corporatism_desc: "我国经济如今以人而非利润为本。而我们有着显而易见的敌人，那便是外国的剥削资本家以及本国的投机分子害虫，他们无时不刻地想要欺诈[ROOT.GetAdjective]劳动者的合理收入。在这个观点上，革命卫队与我们的意见一直是一致的。"

