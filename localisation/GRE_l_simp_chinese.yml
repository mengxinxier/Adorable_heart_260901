#国策
  GRE_openfocus_1:"一千次月亮的坠落"
  GRE_openfocus_1_desc:"月亮坠落一千次，黎娜汐塔便重生一千次。每一次灾厄过后，我们都从废墟中站起，这一次也不例外。"

  GRE_openfocus_2:"贝币适度贬值"
  GRE_openfocus_2_desc:"贝币的适度贬值将刺激出口，缓解通缩压力，让我们的商品重新在国际市场上获得竞争力。\n\n\n\n素材来源：寞桀緣才【大鸣王潮1566】你走了，我压力谁"

  GRE_openfocus_3:"农业保护"
  GRE_openfocus_3_desc:"粮食安全是国家的生命线。对本土农业实施保护性关税与补贴，确保农民的生计不被廉价进口粮冲垮。"

  GRE_openfocus_4:"与革命卫队交涉"
  GRE_openfocus_4_desc:"黎那汐塔革命卫队是黎娜汐塔的剑与盾，她们会清楚现在应该做什么。"

  GRE_openfocus_5:"警示修会"
  GRE_openfocus_5_desc:"即便隐海修会向来与七丘众院不相对付，但大难当头，无论如何都同为黎那汐塔人。"

  GRE_openfocus_6:"人事已尽"
  GRE_openfocus_6_desc:"人事已尽，时间并不会等待某人"

#总督线

  GRE_Augusta_focus_1:"第七位英雄王"
  GRE_Augusta_focus_1_desc:"在黎娜汐塔的历史上，曾有六位英雄王引领人民穿过黑暗。如今，第七位即将加冕——奥古斯塔——她的名字，将铭刻于星辰。"

  GRE_Augusta_focus_2:"黑潮已散"
  GRE_Augusta_focus_2_desc:"曾吞噬无数生命的黑潮终已退去。海面重归平静，黎娜汐塔迎来了久违的喘息之机。"

  GRE_Augusta_focus_3:"赫日威临"
  GRE_Augusta_focus_3_desc:"赫日当空，万民仰望。总督的威严如同正午的太阳——不可直视，亦不可违逆。帝国的荣光，将由此重铸。"

  GRE_Augusta_focus_4:"岁主已死"
  GRE_Augusta_focus_4_desc:"老马啊，老马。"

  GRE_Augusta_focus_5:"解散隐海修会"
  GRE_Augusta_focus_5_desc:"隐海修会的存在本身就是一个错误。他们的密谋与仪式只会将黎娜汐塔拖入深渊。是时候让他们彻底消失于历史中了。"

  GRE_Augusta_focus_6:"倒悬之塔"
  GRE_Augusta_focus_6_desc:"那座倒悬于天际的塔，是黎娜汐塔最古老的谜题。有人说它是先民的遗产，有人说它是神明的囚笼。总督决定揭开它的真相。"

  GRE_Augusta_focus_7:"卡提希娅"
  GRE_Augusta_focus_7_desc:"修会的圣女，鸣式的女儿？不，她现在只会成为自己，卡提希娅只会是卡提希娅。"

  GRE_Augusta_focus_8:"黎娜汐塔的太阳"
  GRE_Augusta_focus_8_desc:"此国策由夜间制作并完成。"

  GRE_Augusta_focus_9:"寻回谕女"
  GRE_Augusta_focus_9_desc:"那么，下一步？"

  GRE_Augusta_focus_10:"不屈的战歌"
  GRE_Augusta_focus_10_desc:"战歌在黎娜汐塔的街巷中回荡。每一次吟唱，都是一次对命运的挑衅。我们从未屈服，我们永不言败。"

  GRE_Augusta_focus_11:"不败恒阳"
  GRE_Augusta_focus_11_desc:"恒阳之日永不落幕。即便最深的黑夜，也无法吞噬黎娜汐塔最后的火种。"

  GRE_Augusta_focus_12:"于盈亏间涨落"
  GRE_Augusta_focus_12_desc:"月有盈亏，国有兴衰。黎娜汐塔绝不会被衰退的恐惧压垮。"

  GRE_Augusta_focus_13:"月相流转"
  GRE_Augusta_focus_13_desc:"月相流转，万物流变。黎娜汐塔的命运也在不断轮回——但这一次，我们将亲手书写下一个周期的走向。"

  GRE_Augusta_focus_14:"日以灼锋，月以流明"
  GRE_Augusta_focus_14_desc:"白日之锋刃灼烧敌人，黑夜之流明指引己方。日月交替之间，黎娜汐塔的旗帜将插遍每一寸应许之地。"

  GRE_Augusta_focus_15:"大黎娜汐塔之梦"
  GRE_Augusta_focus_15_desc:"一个横跨大陆、统御万邦的黎娜汐塔——这个梦想曾经只存在于诗人与疯子的呓语中。但如今，它正在变为现实。"

  GRE_Augusta_focus_16:"保护基沃托斯"
  GRE_Augusta_focus_16_desc:"基沃托斯是我们的盟友，也是黎娜汐塔侧翼的屏障。绝不能让任何势力染指那片土地。如果她们愿意，我们将用剑与火守护这份承诺。"

  GRE_Augusta_focus_17:"粉碎保加利亚"
  GRE_Augusta_focus_17_desc:"保加利亚的抵抗不过是螳臂当车。他们的军队会在黎娜汐塔的铁蹄下化为尘土。巴尔干的版图，必须重新绘制。"

  GRE_Augusta_focus_18:"跨过海峡"
  GRE_Augusta_focus_18_desc:"博斯普鲁斯海峡曾是黎娜汐塔的天堑。但如今，它只是一条待跨越的水沟。我们的将士将登陆对岸，在敌人的土地上宣告黎娜汐塔的威名。"

  GRE_Augusta_focus_20:"我们共同的敌人"
  GRE_Augusta_focus_20_desc:"北方的魔导王并非只是我们盟友的威胁，它将是整个同盟的达摩克里斯之剑。联合所有愿意举剑的手——无论她们曾经属于哪一面旗帜。"

  GRE_Augusta_focus_21:"目标---那不勒斯"
  GRE_Augusta_focus_21_desc:"那不勒斯是地中海的明珠，也是通往意大利腹地的钥匙。黎娜汐塔的舰队已扬帆，目标直指那座古老的城市。"

  GRE_Augusta_focus_22:"墨索里尼的许诺"
  GRE_Augusta_focus_22_desc:"曾经的亚平宁半岛已彻底倒向魔导王，旧日意大利的领袖墨索里尼迫切的想要回到罗马，或许，我们可以向他提出交易——领土、资源、与意大利的永久同盟。"

  GRE_Augusta_focus_23:"与德国人洽谈"
  GRE_Augusta_focus_23_desc:"德意志国渴望复国太久了，协助她们完成夙愿，将使得我们再轴心国的话语权更上一层楼。"

  GRE_Augusta_focus_24:"争取北意大利的民众支持"
  GRE_Augusta_focus_24_desc:"北意大利的工厂与人民是我们征服计划中不可或缺的齿轮。通过宣传、援助与承诺，让那里的民众主动敞开大门。"

  GRE_Augusta_focus_25:"策反西西里岛"
  GRE_Augusta_focus_25_desc:"西西里岛上的势力并非铁板一块。用金币、承诺与秘密协议，让这座岛屿在关键时刻倒向黎娜汐塔。"

  GRE_Augusta_focus_26:"挥师北上"
  GRE_Augusta_focus_26_desc:"北伐！铁蹄将踏破欧罗巴的冬日。轴心国的旗帜将在大坟墓的废墟上飘扬——这一次，我们不会退却。"

  GRE_Augusta_focus_28:"目标---柏林"
  GRE_Augusta_focus_28_desc:"柏林是旧日德意志国的心脏，也是如今魔导王的藏身之所，杀尽敌贼，扬黎那汐塔赫日威名。"

  GRE_Augusta_focus_29:"支援前线"
  GRE_Augusta_focus_29_desc:"前线的士兵们需要弹药、粮食与援军。每拖延一天，就多牺牲一人。黎娜汐塔的工业机器必须全力运转，向战场输送一切所需。"

  GRE_Augusta_focus_29_tt:"§L一旦我们与[DVL.Getname]开战，我们对德国-魔导国边境的支援会越来越弱。§!"

  GRE_Augusta_focus_30:"布拉格之春"
  GRE_Augusta_focus_30_desc:"布拉格的春天从来不是花开的季节——那是起义与反抗的季节。我们将利用这座城市的不满情绪，在魔导国防线的腹地点燃燎原之火。"

  GRE_Augusta_focus_31:"巴伐利亚，德意志的故土"
  GRE_Augusta_focus_31_desc:"巴伐利亚是德意志帝国的摇篮，也是我们冲向柏林的桥头堡。收复巴伐利亚，等于斩断魔导国最坚实的根基。"

  GRE_Augusta_focus_32:"返乡者之怒"
  GRE_Augusta_focus_32_desc:"那些被魔导国驱逐出家园的德意志人——他们的怒火是我们最强的武器。组织他们，武装他们，让他们成为复仇的先锋。"

  GRE_Augusta_focus_34:"诸神谢罪"
  GRE_Augusta_focus_34_desc:"§0你不是神，但你的灵魂仍是我的盛宴。§!"

  GRE_Augusta_focus_35:"第二次伟大战争的胜者"
  GRE_Augusta_focus_35_desc:"第一次伟大战争改变了世界的版图。而第二次伟大战争，将改变世界的本质。轴心国将是那个立于废墟之上的胜者。"

  GRE_Augusta_focus_35_tt:"德意志国已返乡"

  GRE_Augusta_focus_36:"轴心国，姊妹的同盟"
  GRE_Augusta_focus_36_desc:"轴心国的盟约不仅是政治的联合，更是命运的交织。黎娜汐塔与她的姊妹们将以同一颗心脏跳动，以同一只拳头挥击。"

  GRE_Augusta_focus_37:"中东霸主"
  GRE_Augusta_focus_37_desc:"中东的沙漠下埋藏着黑金与古老的秘密。黎娜汐塔的触手将伸向那片土地，成为从地中海到波斯湾的新霸主。"

  GRE_Augusta_focus_38:"巴尔干雄心"
  GRE_Augusta_focus_38_desc:"巴尔干是欧洲的火药桶，也是黎娜汐塔的后花园。我们的雄心从未止步于海岸线——整个半岛乃至黑海都将臣服于黎娜汐塔的律法。"

  GRE_Augusta_focus_39:"黎娜汐塔，傲立于世间"
  GRE_Augusta_focus_39_desc:"从七丘的废墟到爱琴海的浪涛，从赫日的巅峰到月相的深渊——黎娜汐塔终于傲立于世间。无人能再忽略她的光芒。"

#工业线

  GRE_economy_1:"邀请深空联合"
  GRE_economy_1_desc:"深空联合拥有超越时代的科技与资本。邀请他们进入黎娜汐塔，不仅意味着投资，更意味着未来的钥匙被递到了我们手中。"

  GRE_economy_2:"星炬学院-黎娜汐塔分校"
  GRE_economy_2_desc:"星炬学院是知识的圣殿。在黎娜汐塔设立分校，将培养出一代受过高等教育的精英——他们将引领我们的工业走向星辰。"

  GRE_economy_3:"角斗经济的崩溃"
  GRE_economy_3_desc:"曾经辉煌的角斗经济体系已经无法适应现代社会的需求。我们必须承认它的失败，并寻找新的经济引擎来替代它。"

  GRE_economy_4:"重建实体产业"
  GRE_economy_4_desc:"金融泡沫和投机经济只会让黎娜汐塔变得虚弱。重建实体产业——制造业、农业、建筑业——是国家强大的唯一路径。"

  GRE_economy_5:"黎那汐塔中央银行"
  GRE_economy_5_desc:"独立的中央银行是金融稳定的基石。我们将建立黎娜汐塔自己的央行，掌控货币发行与利率，不再受任何外部势力摆布。"

  GRE_economy_6:"发放公债"
  GRE_economy_6_desc:"为了筹集重建与战争所需的资金，黎娜汐塔将面向国内外发行公债。这是用国家的信用换取当下的时间。"

  GRE_economy_6_1:"贝币再贬值"
  GRE_economy_6_1_desc:"必要时，贝币可以再度贬值以减轻债务负担并刺激出口。但这是一把双刃剑——必须谨慎使用，以免引发恶性通胀。"

  GRE_economy_7:"改组革命卫队"
  GRE_economy_7_desc:"革命卫队需要从一支个人武装转变为国家正规军的一部分。改组将削减冗余、明确指挥链，她们致意忠诚，我们回以敬意。\n\n\n\n素材来源：寞桀緣才【大鸣王潮1566】我才是猎人"

  GRE_economy_8:"黎那汐塔工会"
  GRE_economy_8_desc:"工会是工人的喉舌，也是工业的稳定器。正式承认并规范工会的权力，将有助于平衡劳资关系，提升生产效率。"

  GRE_economy_9:"修订劳动法"
  GRE_economy_9_desc:"现有的劳动法已经过时。我们需要更公平的工时规定、更完善的工伤保障，以及更灵活的解雇与雇佣条款——既保护工人，也不让企业窒息。"

  GRE_economy_10:"战时条款"
  GRE_economy_10_desc:"战争期间，一切以胜利为重。战时条款将允许政府优先征用资源、调配劳动力，并暂时限制部分民事自由——直到最后胜利的那一天。"

  GRE_economy_11:"黎娜汐塔农民联合会"
  GRE_economy_11_desc:"农民是这片土地的根基。建立统一的农民联合会，让他们拥有集体谈判的力量，也让政府的农业政策能够直达每一寸耕地。"

  GRE_economy_12:"土地改革"
  GRE_economy_12_desc:"大地主囤积的土地必须重新分配。将土地交到那些真正耕作它的人手中——这是正义的要求，也是粮食增产的前提。"

  GRE_economy_13:"农业保护"
  GRE_economy_13_desc:"民以食为天，国以粮为安。对本国的农产品实施保护政策，防止国际粮价波动冲击我们的餐桌。"

  GRE_economy_14:"谕女之言"
  GRE_economy_14_desc:"七丘会走下去，黎那汐塔会走下去。"

  GRE_economy_15:"费拉列·坎特雷拉"
  GRE_economy_15_desc:"费拉列家族是拉古纳最富有的商人家族之一。与她们合作意味着获得庞大的商业网络与海上贸易路线，但也意味着要接受她们的条件。"

  GRE_economy_16:"愚人剧团"
  GRE_economy_16_desc:"过去修会的错误将得到修正，没有人应该成为所谓神明的弃子"

  GRE_economy_17:"农业，农村，农民"
  GRE_economy_17_desc:"三农问题始终是黎娜汐塔的核心议题。我们必须从政策、资金与技术三个层面同时发力，让农业复兴、农村繁荣、农民富足。"

  GRE_economy_18:"社会救济"
  GRE_economy_18_desc:"战争与动荡让无数人流离失所。建立社会救济体系——粮食发放、临时住所、医疗援助——是政府的道义责任，也是维持社会稳定的必要手段。"

  GRE_economy_19:"黑海岸的通讯"
  GRE_economy_19_desc:"TA说过，你们终会战胜恐惧与苦难。"

  GRE_economy_20:"苇原的幸存者"
  GRE_economy_20_desc:"压力一个JK？"

  GRE_economy_21:"谕女之决意"
  GRE_economy_21_desc:"继续向前走吧，七丘的英雄们，她的剑，她的光芒，将带领黎那汐塔走向新的纪元——\n\n即使，我无法亲眼见证……"

  GRE_economy_22:"莫塔里·珂莱塔"
  GRE_economy_22_desc:"莫塔里·珂莱塔是拉古纳最富有的商人家族之一。即使现任家主在某些方面不够高，我们也不能小看她。"

  GRE_economy_23:"行政优化"
  GRE_economy_23_desc:"官僚机构臃肿而低效。通过合并部门、裁撤冗员、简化流程，让黎娜汐塔的行政机器重新变得敏捷而锋利。"

  GRE_economy_24:"焰光之下"
  GRE_economy_24_desc:"牛马怎么叫"

  GRE_economy_25:"整军备战"
  GRE_economy_25_desc:"和平时期的训练永远无法模拟战争的残酷。我们必须让全军进入实战状态——物资储备、战术演练、心理建设，缺一不可。"

  GRE_economy_26:"军事工业优先"
  GRE_economy_26_desc:"在战争时期，军事工业必须优先于民用工业。所有的钢材、橡胶、燃料与熟练工人，都应首先满足军队的需求。"

  GRE_economy_27:"投资火药与弹药工厂"
  GRE_economy_27_desc:"没有弹药，再勇敢的士兵也只是活靶子。新建和扩建火药与弹药工厂，确保前线的每一支枪管都有充足的子弹。"

  GRE_economy_28:"新式坦克厂"
  GRE_economy_28_desc:"黎娜汐塔需要自己的坦克工业。新式坦克厂将生产本土设计的装甲车辆，不再依赖进口——这将彻底改变我们的陆军面貌。"

  GRE_economy_28_tooltip:"启用军工机构“ §YELVO§! ”\n启用军工机构“ §Y维亚马克斯§! ”"

  GRE_economy_29:"黄油和大炮"
  GRE_economy_29_desc:"黄油与大炮并非不可兼得。通过优化资源配置，黎娜汐塔可以在满足民众基本生活需求的同时，维持足够的军备生产。"

  GRE_economy_30:"从德国引资"
  GRE_economy_30_desc:"德国资本是黎娜汐塔工业化的重要助力。吸引德国企业来本土设厂，将带来先进的技术与管理经验——但也要警惕他们在此扎根过深。"

  GRE_economy_30_tooltip:"强化"第二轮外资引进"中§Y引进德国投资§!的效果"

  GRE_economy_31:"德式武器"
  GRE_economy_31_desc:"德式武器的精良程度无可争议。引进德国生产线与设计图纸，让黎娜汐塔的军队装备与世界一流水平接轨。"

  GRE_economy_32:"平衡发展"
  GRE_economy_32_desc:"黎娜汐塔不能只依赖工业或者只依赖农业。平衡发展——让城市与农村、重工与轻工、国内与国际贸易相互支撑——才是长久之计。"
  GRE_economy_32_tooltip:"启用军工机构“ §YELVO§! ”"

  GRE_economy_33:"改善交通网"
  GRE_economy_33_desc:"泥泞的道路会拖垮任何军队与商队。铺设公路、加固桥梁、疏通港口——交通网的改善将让黎娜汐塔的经济血脉畅通无阻。"

  GRE_economy_34:"局部轻工业"
  GRE_economy_34_desc:"重工业是骨架，轻工业是血肉。在重点区域发展轻工业——纺织、食品加工、日用品制造——让民众的生活质量得到实质性提升。"

  GRE_economy_35:"七丘水利工程建设"
  GRE_economy_35_desc:"七丘地区的水利工程将解决数万公顷耕地的灌溉问题，同时提供清洁的水力发电。这是农业与工业的双赢投资。"

  GRE_economy_36:"深挖七丘矿脉"
  GRE_economy_36_desc:"七丘的地下蕴藏着丰富的矿产——铁、铜、煤、稀土。深挖这些矿脉，将为黎娜汐塔的工业提供源源不断的原材料。"

  GRE_economy_37:"自给自足的努力"
  GRE_economy_37_desc:"黎娜汐塔不能永远依赖进口。通过扩大国内生产、替代进口商品，我们向着自给自足的目标迈出坚实的一步——哪怕这一步很小。"

  GRE_economy_38:"黎那汐塔式四年计划"
  GRE_economy_38_desc:"参考其他国家的经验，制定黎娜汐塔自己的四年计划。以国家力量推动重点产业发展，在四个春秋内实现经济结构的根本性转变。"

  GRE_economy_39:"高速公路建设"
  GRE_economy_39_desc:"高速公路是国家的动脉。建设连接七丘、拉古纳与哈尔基斯的高速公路网，让人员与物资在全国范围内高速流动。"

  GRE_economy_39_tt:"将§Y七丘§!、§Y拉古纳§!、§Y哈尔基斯§!的§Y基础设施§!提升至最高等级"

  GRE_economy_40:"农业机械化革命"
  GRE_economy_40_desc:"拖拉机、收割机、脱粒机——机械化将让黎娜汐塔的农业生产力翻倍。大量农民将从繁重的体力劳动中解放出来，成为工业的后备军。"

  GRE_economy_41:"国家电网"
  GRE_economy_41_desc:"电力是工业的血脉。建设覆盖全国的国家电网，让每一座工厂、每一户农家都能享受到稳定、廉价的电力供应。"

  GRE_economy_42:"黑森峰学院"
  GRE_economy_42_desc:"黑森峰的专家们会强化我们的装甲科技。他们的训练方法与工程理念，将在黎娜汐塔的坦克工厂与装甲学院中生根发芽。"

  GRE_economy_42_tt:"来自黑森峰的专家们会强化我们的装甲科技"

  GRE_economy_43:"继续投资星炬学院"
  GRE_economy_43_desc:"星炬学院的第一批成果已经显现。追加投资，扩建实验室与图书馆，让黎娜汐塔分校成为整个地中海地区最顶尖的学术中心。"

  GRE_economy_44:"创新驱动"
  GRE_economy_44_desc:"模仿只能让我们追赶，创新才能让我们超越。设立国家创新基金，鼓励科研人员与企业家探索那些从未有人走过的道路。"

  GRE_economy_45:"第二轮外资引进"
  GRE_economy_45_desc:"第一轮外资已经奠定了黎娜汐塔工业的基础。第二轮引进将瞄准更高端的领域——精密机械、化学工业、航空技术。"

  GRE_economy_46:"扩大贸易"
  GRE_economy_46_desc:"黎娜汐塔的地理位置决定了她是天然的贸易枢纽。扩大与周边国家的贸易往来，让我们的港口成为商船云集之地。"

  GRE_economy_47:"经济内循环"
  GRE_economy_47_desc:"当外部市场动荡时，内循环是经济的压舱石。通过促进国内消费、区域间协作与本地供应链建设，让黎娜汐塔的经济在风浪中依然稳定。"

  GRE_economy_48:"爱琴海经济奇迹"
  GRE_economy_48_desc:"在爱琴海的浪涛之间，黎娜汐塔将创造属于自己的经济奇迹——一个由航运、旅游、贸易与新兴产业共同编织的繁荣图景。"

  GRE_economy_49:"城市优先"
  GRE_economy_49_desc:"城市是经济增长的发动机。优先发展大城市——七丘、拉古纳、哈尔基斯——让它们成为吸引人才、资本与创新的磁石。"

  GRE_economy_50:"依托现有产业"
  GRE_economy_50_desc:"黎娜汐塔的现有产业——纺织、造船、食品加工——已经积累了丰富的经验与市场。在此基础上延伸产业链，远比从零开始更加稳妥。"

  GRE_economy_51:"工业驱动"
  GRE_economy_51_desc:"工业是黎娜汐塔崛起的第一推动力。所有政策——财政、教育、外交——都应服务于工业化的核心目标。"

  GRE_economy_52:"优势互补"
  GRE_economy_52_desc:"不同区域有不同的优势。七丘的矿产、拉古纳的港口、哈尔基斯的平原——让它们互补互济，形成全国性的经济合力。"

  GRE_economy_53:"加速城市化"
  GRE_economy_53_desc:"城市化是现代化的必由之路。鼓励农村人口向城市转移，提供住房、就业与公共服务，让黎娜汐塔的城市人口比例快速增长。"

  GRE_economy_54:"超大城市建设"
  GRE_economy_54_desc:"黎娜汐塔需要一座足以代表国家实力的超大城市——一座拥有百万人口、摩天大楼与地下铁路的都会。它将是我们文明的丰碑。"

  GRE_economy_55:"工业兴国"
  GRE_economy_55_desc:"没有强大的工业，就没有强大的国家。将'工业兴国'上升为国家战略，举全国之力推进工业化进程。"

  GRE_economy_56:"农村优先"
  GRE_economy_56_desc:"在资源有限的情况下，优先将资金与政策投向农村。因为只有农村稳了，整个国家才稳。"

  GRE_economy_57:"为幼稚产业铺路"
  GRE_economy_57_desc:"黎娜汐塔的新兴产业——电子、化工、精密仪器——如同初生的幼苗，需要关税壁垒与补贴的呵护，才能在未来成长为参天大树。"

  GRE_economy_58:"农业驱动"
  GRE_economy_58_desc:"农业不仅是粮食的来源，也是工业的原料基地与劳动力的蓄水池。以农业驱动整个经济循环，是黎娜汐塔的独特道路。"

  GRE_economy_59:"因地制宜"
  GRE_economy_59_desc:"黎娜汐塔的地形多样——山地、平原、海岸、岛屿。每个地区都应有适合自身条件的发展策略，而不是一刀切的政策。"

  GRE_economy_60:"乡村振兴"
  GRE_economy_60_desc:"让乡村重新焕发生机——改善基础设施、引入现代农业技术、发展乡村旅游业。乡村不应是城市的附庸，而是国家最坚实的后盾。"

  GRE_economy_61:"城镇人口回流农村"
  GRE_economy_61_desc:"当城市拥挤不堪、就业不足时，引导部分城镇人口回流农村是个明智的选择。他们带去知识与资金，农村带去土地与安宁。"

  GRE_economy_62:"农业强国"
  GRE_economy_62_desc:"国之起于农，农强则国强。黎娜汐塔的农业不仅要自足，更要强盛——粮食产量、农产品出口、农业科技，都应居于世界前列。"

  GRE_economy_63:"组建拉贝尔学部"
  GRE_economy_63_desc:"拉贝尔学部的成立标志着黎娜汐塔正式将美育与设计纳入国家教育体系。未来的产品将不再是冰冷的工业品，而是承载着黎娜汐塔美学的艺术品。"

  GRE_economy_64:"暗潮将映的黎明"
  GRE_economy_64_desc:"在暗潮涌动的最深处，黎娜汐塔看到了黎明的第一缕光。那些沉没于海底的秘密、那些被掩埋的历史，将在新的一天中重新浮现。"

#陆军

  GRE_land_army_1:"现代战争理论"
  GRE_land_army_1_desc:"黎娜汐塔的军官们必须摒弃陈旧的战术思维。现代战争是机动性、火力和通信的三位一体——只有真正理解这一点的人，才能赢得未来的战役。"

  GRE_land_army_2:"从远方，回到远方"
  GRE_land_army_2_desc:"下次见面，我会把所有的“讨厌”，都改回“喜欢”……"

  GRE_land_army_3:"第一次伟大战争的经验"
  GRE_land_army_3_desc:"第一次伟大战争教会了我们一件事——战线永远不会如计划中那样移动。从堑壕战到突破战术，每一场战役都是血的教科书。"

  GRE_land_army_4:"改进常规部队"
  GRE_land_army_4_desc:"常规部队是陆军的脊梁。改进他们的训练、装备与组织架构——让他们在面对任何敌人都能扛住压力、打出反击。"

  GRE_land_army_5:"改进火炮"
  GRE_land_army_5_desc:"火炮是战争之神。从牵引式火炮到自行火炮，从短射程到远程打击——黎娜汐塔的炮兵必须拥有更远的射程、更快的射速与更准的精度。"

  GRE_land_army_6:"防守反击"
  GRE_land_army_6_desc:"黎娜汐塔的国土狭长而多山，防守是天然的战术选择。但防守不是被动挨打——我们将在坚固防线的掩护下，伺机发动致命的反击。"

  GRE_land_army_7:"灼樱花散"
  GRE_land_army_7_desc:"春来雪融，望灼樱巫女，不再永世背负这沉重的宿命。"

  GRE_land_army_8:"组建山地部队"
  GRE_land_army_8_desc:"黎娜汐塔的北部边境是连绵的山脉。组建专门的山地部队——适应高海拔、低温与陡峭地形的精锐之师——将让我们的防线固若金汤。"

  GRE_land_army_9:"扬长避短"
  GRE_land_army_9_desc:"黎娜汐塔的军队规模小于强敌，但我们的士兵更加熟悉本土的地形与气候。利用这一点，在敌人不擅长的地方打、在他们想不到的时候打。"

  GRE_land_army_9_tooltip:"解锁指挥官技能§Y"'主场'作战"§!"

  GRE_land_army_10:"联合任务战术"
  GRE_land_army_10_desc:"步兵、坦克、炮兵与空中支援不再是各自为战的孤狼。联合任务战术要求所有兵种在同一指挥下协同行动，实现1+1>2的战场效果。"

  GRE_land_army_11:"产线调整"
  GRE_land_army_11_desc:"军工厂的产线必须根据实战反馈快速调整。生产更多的反坦克炮、更多的迫击炮、更多的无线电台——而不是那些在战场上用处不大的武器。"

  GRE_land_army_12:"中型坦克突击队"
  GRE_land_army_12_desc:"重型坦克太慢，轻型坦克太脆。中型坦克是机动与火力的最佳平衡。组建中型坦克突击队，让它们成为撕裂敌军防线的尖刀。"

  GRE_land_army_13:"军队教育"
  GRE_land_army_13_desc:"士兵的文化水平直接影响其战斗力和对新技术装备的掌握。在军队中普及基础读写与算数教育——一支有文化的军队，才是一支不可战胜的军队。"

  GRE_land_army_14:"后勤保障"
  GRE_land_army_14_desc:"后勤是战争中常被遗忘但最重要的环节。没有补给的前线军队只是一群饥饿的难民。黎娜汐塔必须建立完善的后勤体系——仓库、运输队、维修站——缺一不可。"

  GRE_land_army_15:"训练坦克编队山地协同性"
  GRE_land_army_15_desc:"坦克在山地中如何与步兵配合？如何在狭窄的山路上保持编队？这些问题需要通过反复的实战化训练来解决——没有捷径。"

  GRE_land_army_16:"德式训练"
  GRE_land_army_16_desc:"德国军队的训练方法以严苛与高效著称。引进德式训练体系——从新兵基础训练到高级指挥员参谋作业——全面提升黎娜汐塔陆军的专业素养。"

  GRE_land_army_17:"好坦克，德国造"
  GRE_land_army_17_desc:"德国坦克在战场上证明了自己的价值。直接进口德制坦克，作为黎娜汐塔装甲部队的核心装备——至少在国产坦克形成战斗力之前。"

  GRE_land_army_18:"本土坦克装配"
  GRE_land_army_18_desc:"即使设计来自国外，装配线也必须留在国内。在黎娜汐塔建立坦克装配厂，不仅能够创造就业与产业升级，还能在战时保障装备的持续供应。"

#空军

  GRE_air_army_1:"改组空军"
  GRE_air_army_1_desc:"黎娜汐塔的空军在过去只是陆军的附属。改组后的空军将成为独立军种——拥有自己的指挥体系、战术条令与战略目标。"

  GRE_air_army_2:"航空研究所"
  GRE_air_army_2_desc:"没有独立的研究能力，就没有自己的天空。建立黎娜汐塔航空研究所，汇聚空气动力学、材料学与发动机工程师——为国产战机打下基础。"

  GRE_air_army_3:"多功能支援机"
  GRE_air_army_3_desc:"侦察、运输、医疗撤离、对地攻击——多功能支援机是陆军在空中的眼睛与手臂。发展与装备此类飞机，将让地面部队的作战效率倍增。"

  GRE_air_army_4:"战斗机"
  GRE_air_army_4_desc:"谁控制了天空，谁就控制了战场。发展国产战斗机——速度、机动性、火力——每一项指标都必须在对抗中占据优势。"

  GRE_air_army_5:"战略轰炸机"
  GRE_air_army_5_desc:"战略轰炸机是投射力量的工具。它们可以飞越前线，直接摧毁敌国的工厂、港口与城市——让战争在敌人的土地上燃烧。"

  GRE_air_army_6:"空地协同"
  GRE_air_army_6_desc:"地面部队呼叫空中支援时，飞机必须在几分钟内到达。空地协同的训练与通信体系建设，将让黎娜汐塔的战场响应速度领先于任何对手。"

  GRE_air_army_7:"火箭科技"
  GRE_air_army_7_desc:"火箭不仅是运载工具，也是武器。投资火箭科技——从探测火箭到弹道导弹——将让黎娜汐塔拥有前所未有的打击范围与威慑力。"

  GRE_air_army_8:"伞兵"
  GRE_air_army_8_desc:"伞兵是从天而降的利刃。组建训练有素的伞兵部队，让他们能够在敌后发起突袭、占领关键节点——这是现代战争中最具决定性的战术之一。"

  GRE_air_army_9:"保卫天空"
  GRE_air_army_9_desc:"高射炮、雷达站、预警网络——保卫天空不仅需要战斗机，还需要一套完整的防空体系。让敌人的飞机在进入黎娜汐塔领空之前就被击落。"

  GRE_air_army_10:"空中编队"
  GRE_air_army_10_desc:"孤狼战术已经过时。现代空战依靠编队——双机编队、四机编队、大型机群编队——通过紧密配合实现火力集中与战术欺骗。"

  GRE_air_army_11:"扩建空军基地"
  GRE_air_army_11_desc:"现有空军基地的数量与容量远远不够。在战略要地扩建或新建空军基地——让黎娜汐塔的战机能够在最短时间内覆盖整个国境线。"

  GRE_air_army_12:"信息战争"
  GRE_air_army_12_desc:"未来的战争将在电磁频谱上首先分出胜负。电子干扰、信号侦察、数据链通信——信息战争能力将成为黎娜汐塔空军的核心战力。"

  GRE_air_army_13:"解决后勤问题"
  GRE_air_army_13_desc:"航空燃油、弹药、备用零件——空军的后勤需求比陆军更加精密且紧急。建立高效的航空后勤补给线，确保每一架飞机都能随时升空。"

  GRE_air_army_14:"夜鹰"
  GRE_air_army_14_desc:"夜鹰是那些在黑暗中飞行的飞行员。他们的任务是夜间侦察、夜间轰炸与夜间截击。夜战能力将使黎娜汐塔空军在昼夜交替中保持持续压制。"

  GRE_air_army_15:"空中炮艇"
  GRE_air_army_15_desc:"空中炮艇——一种装备重型武器的运输机——能够在对地攻击中提供持续而猛烈的火力支援。它们是对付地面步兵与轻型装甲的致命武器。"

  GRE_air_army_16:"制霸天空"
  GRE_air_army_16_desc:"制霸天空是黎娜汐塔空军的终极目标。无论敌人是谁，无论战场在哪里——我们的飞机必须确保自己永远是天空的主人。"

#海军

  GRE_naval_army_1:"黎那汐塔海军"
  GRE_naval_army_1_desc:"黎娜汐塔是一个海洋国家——没有强大的海军，就没有安全的海岸线。我们的海军必须从近海防御走向远洋存在。"

  GRE_naval_army_2:"扩建海军学校"
  GRE_naval_army_2_desc:"合格的军官是一支海军的灵魂。扩建海军学校，增聘教师、增加训练舰、引入现代海战教材——培养黎娜汐塔自己的海军精英。"

  GRE_naval_army_3:"海军军事顾问"
  GRE_naval_army_3_desc:"我们缺乏大型舰队的指挥经验。聘请外国海军顾问——特别是那些拥有战列舰与航母操作经验的人——来指导黎娜汐塔的海军建设。"

  GRE_naval_army_4:"扩建海军基地"
  GRE_naval_army_4_desc:"拉古纳港是黎娜汐塔最重要的海军基地，但它已经饱和。扩建码头、增加船坞、加强防御设施——让海军能够停泊更多、更大的舰艇。"

  GRE_naval_army_5:"整修老船"
  GRE_naval_army_5_desc:"黎娜汐塔的老式军舰虽然过时，但依然有剩余价值。整修它们——更换锅炉、加固装甲、升级火炮——让这些老兵在二线继续发挥余热。"

  GRE_naval_army_6:"海军战争指挥部"
  GRE_naval_army_6_desc:"海战的指挥远比陆战复杂，涉及潮汐、天气、燃料补给与舰队队形。建立专业的海军战争指挥部，集中精力研究海战策略与舰队调度。"

  GRE_naval_army_7:"新式舰艇研发"
  GRE_naval_army_7_desc:"黎娜汐塔的造船工业必须跟上时代的步伐。研发新型驱逐舰、巡洋舰与潜艇——让我们的舰队不再被任何敌人视为'过时的船队'。"

  GRE_naval_army_8:"巡洋舰战法"
  GRE_naval_army_8_desc:"巡洋舰是海上的多面手——侦察、护航、破交、支援。制定针对巡洋舰的专属战法，发挥它们的速度与火力优势，在广阔的大洋上灵活作战。"

  GRE_naval_army_9:"运输船打击"
  GRE_naval_army_9_desc:"敌人的战争机器依赖海运。派遣潜艇与快速水面舰艇打击敌方的运输船队——切断他们的补给线，比击沉他们的战列舰更能决定战争的胜负。"

  GRE_naval_army_10:"超重型战列舰"
  GRE_naval_army_10_desc:"超重型战列舰是海上的移动堡垒——巨大的主炮、厚重的装甲、强大的动力。虽然造价高昂，但一艘这样的战舰就足以震慑整个舰队。"

  GRE_naval_army_11:"航母战斗群"
  GRE_naval_army_11_desc:"航空母舰已经彻底改变了海战的面貌。组建黎娜汐塔的第一个航母战斗群——以航母为核心，驱逐舰、巡洋舰与潜艇围绕护卫——将投射力量推向远洋。"

  GRE_naval_army_12:"战列舰旗舰地位"
  GRE_naval_army_12_desc:"虽然航母正在崛起，但战列舰在近距离决战中依然不可替代。维持战列舰的旗舰地位，确保舰队在遭遇强敌时拥有最坚固的指挥核心。"

  GRE_naval_army_13:"海上机场"
  GRE_naval_army_13_desc:"航母本质上是一座浮动的海上机场。扩大航母的飞行甲板、增加载机量、优化起降流程——让我们的海上机场能够容纳更多、更先进的舰载机。"

  GRE_naval_army_14:"爱琴海的捍卫者"
  GRE_naval_army_14_desc:"爱琴海是黎娜汐塔的后院。我们的海军必须确保这片海域永远不受侵犯——从巡逻艇到驱逐舰，每一艘舰艇都在为保卫爱琴海而巡航。"

  GRE_naval_army_15:"协同作战"
  GRE_naval_army_15_desc:"海上作战不是单舰决斗，而是体系对抗。水面舰艇、潜艇、舰载机与岸基航空兵必须协同作战——实现真正的海空一体化。"

  GRE_naval_army_16:"对岸支援"
  GRE_naval_army_16_desc:"海军的任务不仅是在海上，也包括对陆地目标的火力支援。舰炮轰击、导弹打击、陆战队登陆——对岸支援能力将拓展海军的战略价值。"

  GRE_naval_army_17:"现代海战"
  GRE_naval_army_17_desc:"现代海战不再是帆船时代的队列炮击，而是超视距导弹攻击、电子对抗与水下猎杀的综合体系。黎娜汐塔海军必须全面拥抱现代化。"

  GRE_naval_army_18:"组建海军突击队"
  GRE_naval_army_18_desc:"海军突击队是海陆之间的利刃——两栖登陆、港口破坏、岛屿夺控。组建并训练这支精锐部队，让黎娜汐塔的海军力量从海上延伸到陆地。"

