  GRE_Empire_Twilight:"帝国余晖"
  GRE_Empire_Twilight_desc:"吾等尊贵的王将高擎利刃及长枪，割开怒兽的项颈，自黑潮的枯喉中，为黎那汐塔夺回辉煌的不朽。"

  GRE_second_kuroshio_shadow:"第二次黑潮的阴影"
  GRE_kuroshio_coming:"「黑潮爆发，吞没七丘」"
  GRE_kuroshio_coming_desc:"这是黎那汐塔的灾难。谕女们曾看到过“黑潮爆发，吞没七丘”的预言……既然无法逃避，那我们更不应在这里坐以待毙。"
  GRE_kuroshio_buff_Augusta:"「战歌高亢，烈阳永耀」"
  GRE_kuroshio_buff_Augusta_desc:"命运的终点也许是绝对的，但通向命运的路绝对不止一条，人之所以是万物的灵长，是因为我们可以去决定、去选择！\n文明的辉煌应当是无数人前赴后继的成果，绝不是一个人孤高的勋章。\n反抗的浪潮不会停息，文明绝不会困死在鸣式塑造的铁屋中……"
  GRE_kuroshio_buff_Aemeath:"「春风化雪，星海远航」"
