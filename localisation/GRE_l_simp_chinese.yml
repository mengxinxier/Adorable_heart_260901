 GRE_Iuno_desc: "此记录，为第127位谕女所有……其名尤诺。\n诞生于月亮沉没之夜，为先天型共鸣者，可用双眼▇▇▇▇。\n其声痕位于左脚脚背处，使用共鸣能力期间，身侧有类似月相的▇▇能量体环绕，发尾处出现局部透明光化现象，颜色与质感均与月光类似。\n\n§C她被命运以怎样的名义青睐，就被命运以怎样的方式裹挟。但她从未被打败，也不肯罢休。所以，看吧……看忤逆的谕女，因何不再回望，看万千因果之间，她如何以自己为唯一的解。§!"

 GRE_Iuno_desc_1: "§C尤诺§!\n§Y万千次虚掷的注视§!\n  - $MODIFIER_POLITICAL_POWER_FACTOR$：§R-15.00%§!\n  - $MODIFIER_RESEARCH_SPEED_FACTOR$：§G+15.00%§!\n  - $MODIFIER_POWER_BALANCE_WEEKLY$：[root.GetBopTrendTextIcon]§G0.5%§!"

 GRE_Iuno_Diplomacy_desc: "§C尤诺§!\n@GRE§Y[FROM.Getname]§!的§C谕女§!\n\n§Y万千次虚掷的注视§!\n  - $MODIFIER_POLITICAL_POWER_FACTOR$：§R-15.00%§!\n  - $MODIFIER_RESEARCH_SPEED_FACTOR$：§G+15.00%§!\n  - $MODIFIER_POWER_BALANCE_WEEKLY$：[root.GetBopTrendTextIcon]§G0.5%§!"

  GRE_Iuno_available_tt:"§C尤诺§!不是[GRE.Getflag][GRE.Getname]的副领袖。"
  GRE_Iuno_txt:"§C尤诺§!为我们谕出了前路。"

 GRE_Iuno_desc_2:"§C尤诺，传闻中诞生于月食之时的天才，能预见正确未来的谕女。好奇的话，就来我身边吧……不过，我可不保证能给你想要的完满哦。§!"

 GRE_Iuno_desc_3: "§C尤诺§!\n§Y我所在，即为不变的独一§!\n  - $MODIFIER_RESEARCH_SPEED_FACTOR$：§G+10.00%§!\n  - $MODIFIERS_ARMY_ATTACK_FACTOR$：§G+5.00%§!\n  - $MODIFIER_GLOBAL_NON_CORE_MANPOWER$：§G+16.00%§!"

 GRE_Iuno_Diplomacy_desc_1: "§C尤诺§!\n@GRE§Y[FROM.Getleader]§!的§C挚友§!\n\n§Y我所在，即为不变的独一§!\n  - $MODIFIER_RESEARCH_SPEED_FACTOR$：§G+10.00%§!\n  - $MODIFIERS_ARMY_ATTACK_FACTOR$：§G+5.00%§!\n  - $MODIFIER_GLOBAL_NON_CORE_MANPOWER$：§G+16.00%§!"


 GRE_Lupa_desc:"§R露帕§!，出生自西尔瓦家的旁支，早在多年前就因为赛场失利而被迫离开七丘城。共鸣能力觉醒后被双亲“交给”尤利娅女士。在大角斗场展露头角，一跃成为万众瞩目的明星选手。在尤利娅玷污大角斗场被捕后，西尔瓦的家主之位被判予露帕，而后，黎那汐塔革命卫队便从角斗士工会中诞生。\n\n这位热情率直，如孤狼般具有野性的少女。若是能够一直享受竞技纯粹的快乐，露帕无畏在这赛场燃烧殆尽。"

 GRE_Cartethyia_desc:"\n§9少女在秋日拾起沉甸甸的麦穗，将它变成与你一起分享的栗子面包。§!\n\n§g之后，是一个属于卡提希娅的、暖洋洋的、平凡的冬日。\n\n§t而在春季蓬勃生长的，不只有层叠的花朵，还有少女对骑士传说的向往。§!\n\n§3听，浪花轻拍，鸟鸣为她的夏日标出轻快的注脚。§!§!\n§Y——如今，她早已拿起了守护众人的剑。§!"
 
 


 GRE_Cartethyia_desc_1:"§6卡提希娅§!\n@GRE§5“流浪骑士”§! \n§Y人权之心§!\n  - $MODIFIER_POLITICAL_POWER_FACTOR$：§G+15.00%§!\n  - $communism_drift$：§G+0.10§!\n  - $MODIFIER_COMPLIANCE_GAIN_ADD$：§G+0.01%§! \n§Y神权之意§!\n  - $MODIFIER_RESEARCH_SPEED_FACTOR$：§G+5.00%§!\n  - $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G+5.00%§! \n§Y异权之力§!\n  - $MODIFIER_MOBILIZATION_SPEED$：§G+15.00%§!\n  - $MODIFIER_RECRUITABLE_POPULATION_FACTOR$：§Y1.00%§!"

 GRE_Cartethyia_desc_2:"§1「芙露德莉斯」§!\n@GRE§6“圣女”§! \n§Y将烈风重塑希望§!\n  - $MODIFIERS_ARMY_DEFENCE_FACTOR$：§G+8.00%§!\n  - $MODIFIERS_ARMY_ATTACK_FACTOR$：§G+8.00%§!\n  - $MODIFIER_ARMY_BONUS_AIR_SUPERIORITY_FACTOR$：§G+15.00%§!\n  - $MODIFIER_ENEMY_ARMY_BONUS_AIR_SUPERIORITY_FACTOR$：§G-15.00%§!\n§Y人权之心§!\n  - $MODIFIER_POLITICAL_POWER_FACTOR$：§G+10.00%§!\n  - $communism_drift$：§G+0.10§!\n§Y神权之意§!\n  - $modifier_production_speed_arms_factory_factor$：§G+8.00%§!\n  - $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$：§G+8.00%§! \n§Y异权之力§!\n  - $MODIFIER_OFFENCE$：§G+5.00%§!\n  - $MODIFIER_DEFENCE$：§G+5.00%§!"
 GRE_Cartethyia_Diplomacy_desc_2:""

 
  GRE_Augusta_desc_txt:"奥古斯塔，出身法比亚纳，黑潮之下的遗孤，角斗场上的不败冠冕，诞于血与铁的无畏领袖。\n\n“作为「英雄」，我能满足十人的愿望，能满足百人、千人的愿望，可作为「总督」，我却无法为七丘实现任何愿景。但你，奥古斯塔，我听见了你的名字，从七丘之巅至七丘之底，从荣光的殿堂至简陋的街巷。无关贫富、无关强弱、无关阶级与立场，无数人因一个名字联系在一起。我想，在未来，这份联系将成为七丘新的力量。”这是上一任总督，「灭龙」的马格诺对这位七丘「冠军」的诺言。马格诺泯灭于黑潮之后，奥古斯塔这个名字像风一般在七丘的大地上飘散开来。\n\n春去秋至，总督宫的主座迎来了它新的主人。这尊吞噬了无数英雄的荆棘王座，正静静的等待着它的又一位主人，等待着又一位「总督」，等待着这张王座上的人，究竟会成为「英雄」，还是「英雄王」。\n\n奥古斯塔心中并无多少复杂的思绪。她不曾对任何人心怀恨意，她亲身领略过黑暗，却也知晓何为光明。她坐到了那张主座之上，亲手为自己戴上枷锁与荣冠。她将以平凡之躯成就辉煌，以剑锋诠释何为力量。"


  GRE_Aemeath_desc_1:"自我介绍吗……嗯，说些什么好呢。现在反而想不太出来了……\n\n§Q总之，等我，我一定会找到你——§!"
  GRE_Aemeath_desc_2:"又到了这个环节呢，哎~现在反而想不出太多了……可能是因为现在的我，已经心满意足了吧。\n\n§Q继续朝着你期望的道路走吧，索拉里斯的救·世·主~在这条长路上，你永远不会再孤单。§!"

  GRE_Rover_desc_0:"TA在这里，一定在的，我能感受到TA的频率，所以，在找到你之前，我绝不会防手。\n\n在大海中捞针，可能会一无收获；但毫不作为，定会一无所有。"
  GRE_Rover_desc_1:""

