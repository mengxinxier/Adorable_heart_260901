  GRE_event.26.t:"胜利？" #七丘的狩猎——落幕，尤诺隐于月相
  GRE_event.26.d:"毫无疑问，这是属于全黎那汐塔的胜利\n黑潮的造物被击溃，黑潮的核心被星炬学院的专家抽离，黎那汐塔今后，将再也不会遭受所谓鸣式的苦难，让我们为我们的总督高呼三声万岁！\n\n万岁！万岁！万岁！\n\n\n\n\n“§C这样就好，这样……就够了§!”"
  GRE_event.26.a:"晚安，黎那汐塔；晚安，七丘；晚安，奥古斯塔……"
  GRE_event_26_tooltip:"▇▇,将▇▇▇▇▇▇▇。"

  GRE_event.27.t:"「CENSORED」" #世界线偏离，总督线——尤诺仍被记住
  GRE_event.27.d:"总督阁下，学院今日在整理遇难者名单时，在磁带收录库发现了一盘没有署名，记录无法被读取的磁带，经查询，该磁带的录入时间仅比您早5分钟左右，而我们当日的记录显示，该时间段仅有您一人出入刻录室。为找寻该磁带的刻录者，校方希望能获取调用您预留的磁带的权限。\n\n——星炬学院\n\n奥古斯塔阁下，恕我直言，我们很可能忘记了某些事，某些人，而我有预感，答案就藏在那盘无法访问的磁带中，兹事重大，望您能拨冗亲临。"
  GRE_event.27.a:"——洛瑟拉"

  GRE_event.28.t:"那未曾被遗忘的" #洛瑟拉老师，我还记得你
  GRE_event.28.d:"奥古斯塔来到深空联合研究院，洛瑟拉简单向她讲述了两卷磁带的现状与学院目前的调查进度，在奥古斯塔表示“七丘不会忘记每一个在灾难中离去的人，不论她生前如何，若为罪人，则应罚之；若为英魂，而应铭记。”于是，洛瑟拉便将奥古斯塔带进了由她共鸣能力所搭建的“记忆宫殿”，并在这里看到了几张模糊的，自己与某位蓝发少女的合影。尽管场景多是在学院内，但奥古斯塔还是凭借服饰上的细节，断定出那位少女应是来自四方殿的谕女。于是洛瑟拉将照片与那两卷拉贝尔磁带交给奥古斯塔，以便她能更方便的行事。"
  GRE_event.28.a:"既然是谕女，或许四方殿有所记录。"


  GRE_event.29.t:"那未曾被遗忘的" 
  GRE_event.29.d:"在前往四方殿的路上，奥古斯塔却遇到了行色匆匆的谕女，在交涉后，奥古斯塔了解到谕女们除去已验证的那些，再看不到更多的「七丘预言」了，而在问及照片上的谕女时，得到的回复也是只：“这确实是我们这一届的谕女服饰，但我并不认识……或许莉莉贝婆婆知道，谕女殿的每一位谕女婆婆她都记得。”"
  GRE_event.29.a:"那么，该揭开谜底了。"

  GRE_event.30.t:"那未曾被遗忘的" 
  GRE_event.30.d:"谕女殿内并非预想中的混乱，反而相当清冷，四方殿上层，莉莉贝站在壁画前，像在思索什么，亦像是在等着谁。\n“总督阁下，您来了……”\n“莉莉贝婆婆，您……预见了我要来？”\n莉莉贝没有说话，她再度抬头望向墙上的壁画，那是奥古斯塔登上总督之位时，第一次来到四方殿，由谕女向她传递的，有关“七丘”的预言：“听吧，七丘的无信者们，高天的神已怒不可遏。倘使七丘的君主再次藐视神的旨意，毁灭即是七丘命运。”莉莉贝缓缓念出那份古老的预言——\n“‘唯有手握非凡力量、自黑色浪潮中崛起的英雄王能使七丘永恒。他将平息汹涌的暗流与风波，以旧王的血为无上的荣耀加冕。’”奥古斯塔接下后半句，她的眼眸中闪过决意，半晌，莉莉贝转头，青色的眼眸似乎洞穿了一切\n“原谅我，总督阁下，我并非预见了您的未来，俄日是谕言了……我自己的。”\n“您会从我这里找到答案，跟我来吧——”\n\n“谕女殿的记录往往不会有空缺，因为每一位谕女都是从谕言中诞生，在谕言中走向四方殿，然后，在预言中死去……”\n“但，总督阁下，请看这个——”莉莉贝从编号为127的阁子中抽出了一份文件，“这位谕女，唤名为‘尤诺’，但，四方殿内，包括我，对她的印象，都为0。”\n“而这位谕女，死于三年前，葬身在黑潮吞噬清泉之处。”\n“也就是说，她绝无可能，在数月前与您一同前往星炬学院，甚至刻录磁带……”\n“但「死亡」和「消失」其实是两个不同的概念。如果尤诺在三年前死亡，她应该会活在我们的记忆中，即使名不见经传，但尤诺，却在记录中被我谕言为从前往后最为天才的谕女，即使所有人都忘了她，唯独我，唯独谕女殿——”"
  GRE_event.30.a:"不会对她一无所知。"

  GRE_event.31.t:"那未曾被遗忘的" 
  GRE_event.31.d:"“彻底消失的人，不必被虚构死亡，彻底死亡的人，没人能感到存在，两条因果链原本都能通畅，但百万分之一的可能性，还是显现于这方世界上。那盘磁带，刻录了尤诺某一刻的频率，保持了她和世界最后的联系，一定程度上「锚定」了她。所以因果链就此打结，结局尚未写定，现在的她更像一个被滞留的虚影，在生与死、消失与存在的混沌中，重复经历着她的过往。”\n“混沌是包含一切概念和物质、一切因与果的总集，也是连通的、叠加的若干个子集，一旦迷失其中，便如陷入无常洪流，再难回头。即便是谕女，也不过借由命运的指引，在确定性的滩涂打捞起些许启示，总督阁下，我既身为四方殿总管，理应劝您，不必踏入那未知的可能中……”\n\n“但，您也知道，用不该出现的「死亡」，换取预言之外的胜利，为七丘付出了所有，却不被人记得。没有人该遭受这一切，§C尤诺§!也一样。”\n“为七丘而逝去的，皆是英雄，而英雄，就该被人记住——”\n“七丘不需要，也不允许，一位没有被所有人记住的英雄。”\n“更不需要，不为他人而斗争的总督。”\n\n“我所预见的未来中，我将您带去了那片滩涂，在未来的命运中，我或许看到了，那在烈阳中盛开的可能性……，是啊，您总能创造奇迹，那么，奥古斯塔阁下，七丘的英雄王，黎那汐塔的总督，碾碎黑潮的传说，老身莉莉贝，无耻的向您许出愿望，愿您，能给那孩子一个结局，至少，是能被人所记住的，不算好，也不算坏的结局……”\n“您的愿望，我收下了——”"
  GRE_event.31.a:"“我以奥古斯塔之名起誓——”"

  GRE_event.32.t:"于怒潮中卓立" 
  GRE_event.32.d:"往复经历的，断送未来的……混沌？\n无法打捞的，被揉碎了的……混沌！\n千千万万个，是我非我的……混沌……\n……直至所有的「锚定」，被统统显化。\n\n看不见尽头，也看不清在哪。这就是生与死、消失与存在的混沌吗？\n混沌并未夺过奥古斯塔的五感，她能感觉到，手中的剑柄仍旧炽热，腰间那卷属于尤诺的磁带，此刻正在疯狂转动，甚至于，绽出缕缕光芒。\n“如果这里没有路，那我便斩开一条路——”\n“如果牺牲的英雄注定被遗忘，那我将用我的血，我的剑——”\n“来让世界记住！！！”\n耀眼的金色光芒自恢弘的长剑上绽放，奥古斯塔的共鸣力喷涌，手中由无数角斗士的佩剑熔铸而成的大剑开始嗡鸣，于是，她，他们向那高天之上的神明，嘶吼出她们的回答——\n“以荣辉之名——七丘的英雄王，来接这片土地的英雄——”\n\n“回家——”\n\n无边的黑暗被斩开一道口子，属于角斗士的光，属于七丘的光从中逸散而出，奥古斯塔看到了，看到她曾对她说过的话：\n“奥古斯塔，与太阳同辉的荣耀加诸汝身，你，会受到尊敬的对待”\n“预言成真吗？那你的预言，有算到我会将神明与祂的规则踩在脚下，以凡人之躯来到这混沌深处吗？”深处，日光与月光交汇之处，混沌的黑影散去，而在那之中的，是一道余晖……一道……月亮的余晖……\n脚下的触感让奥古斯塔意识到自己正踏在地面上，眼前，被日光所笼罩着的，是尤诺，她脆弱，她悲伤，虽不同于奥古斯塔刚刚找回的记忆中的谕女尤诺，但她很确定，这就是那个尤诺，在混沌中不屈，在消散中傲然……\n但这一切，都将于此刻结束——"
  GRE_event.32.a:"“奥古……斯塔？”"

  GRE_event.33.t:"于耀光中刻名" 
  GRE_event.33.d:"“尤诺，我记得你曾答应过我，会去索求七丘的终点。”\n“但你没有告诉我终点为何样，当然我也能够猜出，那注定不是个多么好的未来，不然，你也绝不可能缄默不言。”\n“终焉？未来？所谓命运，也不过是种可能性罢了。”\n\n“你能改变七丘的未来，那么我，也一定能够改变你的未来！”\n\n“在成为谕女之前，你首先是一个人，是人，就会有无限的可能性，我们的未来，注定在自己手中。”\n“你不必成为任何人的附庸，谕女向命运诘问，绝不是为了顺从命运；英雄之所以为英雄，是因为她承载着勇气与希望！如果谕女的身份是枷锁，那就丢掉它，如果你觉得黑暗太暗，就去绽放出胜过日光十倍，甚至百倍的光芒！”\n“尤诺，我的挚友，”被日光所照耀的她，已绽放出自己的光彩，此时的月光，连身旁的烈阳，都稍逊三分。“你将绽放出你自己的光，这份色彩，不属于任何人，只属于你，谁也无法夺走。”奥古斯塔向尤诺伸出手，她看向那双青蓝色的眼眸被填上色彩，看这那缕身影被逐渐充实，缓缓说道：\n“尤诺，四方殿里还有人在等着你，奥古斯塔还在等着你，七丘还在等着你，和我一起，回到我们的故土，让这个世界上所谓的神明，好好看看你的光芒！”\n一只手握住了奥古斯塔伸出的手，紧接着，是一只又一只，无数的尤诺此刻握住了同一只手，唯一的尤诺握住了奥古斯塔的手。\n她们笑了，笑得很畅快，那位喜欢玩弄人的神明，此刻一败涂地。周围发了疯似的想要吞噬掉她们的混沌，此刻如同被晒干的草，毫无生气。"
  GRE_event.33.a:"“先说好，奥古斯塔，这回可别抢了我的风头。”"
  GRE_event_33_tooltip:"§O过去，黑潮吞没了安吉尔；今日，祂不会再次夺走我的挚友！§!"

  GRE_event.34.t:"于盈亏中涨落" 
  GRE_event.34.d:"这一夜，所有黎那汐塔人都做了一个梦，梦到前些日子刚刚结束的黑潮，梦到他们的英雄王和那位四方殿中的天才战胜了黑潮，挫败了鸣式，他们记得，英雄王是奥古斯塔，而另一位，是他们的谕女，将毁灭的预言推翻，将希望带给所有人，而她名字是——"
  GRE_event.34.a:"§C尤诺§!"

