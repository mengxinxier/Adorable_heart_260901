 als.87.t:0"春天的兰斯城"
 als.87.d:0"不同于其他地方，CITY在战火初弭的新一年安宁地迎来了春天。\n围绕着中间高地上坐落着的城堡所建立起来的城下町，蜷缩在雄城的庇护之下，欣然地感受着来访的暖风。野花盛开，生命跃动，很难将这个地方与外界那些因常年黩武而日渐萎靡的城镇联系起来。不过更加特别的是，今天清晨，一大早起来，便远远就能望见后山上簇拥着一团粉色。\n这座城市的主人，一位穿着老旧绿色盔甲的堂吉诃德，小跑着在他的城堡内四处寻找，找到了他的女仆长。“比斯凯塔！哦找到了找到了。”兰斯总算长出一口气。\n “主人，有什么事吗？”比斯凯塔只是向着气喘吁吁的主人鞠了一躬。\n“啊...也没什么——最近暖和起来了不是么？”“是的。”“品茶的话，也会很有韵味吧？”\n女仆长点了点头。“我明白了，还请稍等。”“嗯嗯，不用说出来就能明白意思，比斯凯塔这点我很喜欢喔。”“请立刻让我进行准备。”她再一鞠躬，转身便开始准备赏花的事宜。\n兰斯这个人，不记事情。如果有人问他当年为什么要特地在后山栽下一片樱花林，他大概率只会挠挠脑袋，装作在思考的样子然后找个机会岔开话题。但不管怎么样，这片樱花林到底是开了。这便是善缘。\n  “好漂亮...”抬头看着随风摇曳、花团飞舞的樱花林，娜姬小声地赞叹着。\n“哈哈，是啊。”暖风拂面，直吹的兰斯醉心不已。“不过，感觉以前没见过这一丛樱花林呢。”倾斜着手中的香茶，魔女玛丽亚有点奇怪的问着。 “是啊是啊，我在这里住了这么久从来不知道——呜姆呜姆...”小娜姬的问题被姐姐塞进她嘴里的章鱼烧打断了。\n“真是的，那时候只是树苗而已，都不记事，你当然注意不到。”嘴里塞着章鱼烧和团子的姐姐志津香没好气地用手中的烤串阻止了她继续连珠炮般的提问。“不过...很难想象...没想到真的...真是出乎意料的景象。”志津香若有所思地看着天空。 “确实，很浪漫呢。”也许是花茶有些滚烫，玛丽亚的脸上泛起了些许红晕。\n  “那当然，本大爷可是个浪漫主义者。”兰斯拍着胸脯夸起自己的浪漫格调。\n“...反正怎么样都绝对和你没关系。”志津香一句话便轻轻否定了兰斯的浪漫。\n“不过...科潘冬小姐怎么没来？以往有什么事情她会黏着兰斯比谁都牢靠呢。”玛丽亚不经意间问起了这么一个问题。长久以来关于兰斯的事情她可是最上心的。\n    “当然有邀请她咯，但最近她很忙，非常忙。”兰斯也若有所思的看着天空。\n  “难不成，兰斯在担心她？”娜姬不由得开始想象起兰斯疑似体贴的一面，不过她的姐姐倒清醒的很。"
 als.87.a:0"兰斯想抱她了，一看就知道"
 als.88.t:0"富豪小姐和她的好运气"
 als.88.d:0"即使是在就任为国家元首之后，科潘冬也仍然将她的工作地留在北方，在[als.Capital.GetNeme]举行了正式的就位典礼之后，这位小小的新晋领袖受到了选民们的热烈欢迎。然后，这位初来乍到的富豪就遭遇了来自各个方面的压力。现任的政府班子——或者干脆点说也就是原先大法官的支持者——一度想利用她毫无从政经验的过去，劝诱她心安理得的接受权力被架空。不厌其烦的科潘冬只得离开[als.Capital.GetNeme]。\n当然，南方的政客们完全奈何不了她——作为自由都市的话事人，科潘冬和所谓的政治素人实际上相去甚远。由拉文纳、翡冷翠、威尼斯等旧城邦都市组成的贸易邦联总管着北意大利与西西里岛的贸易事宜。甚至还拥有着独立于国家系统的防卫力量。即使是在内战时期，纵使要竭力动员，阿库娅政府尚且不敢苛求握着亚平宁半岛半个钱袋子的自由都市。对北方掌控仍然欠缺的那不勒斯更是不必多言。\n真正麻烦的地方在于，现在的工作量超出了科潘冬的能力：建立一个新内阁、接手共和国并不安分或者说不服气的行政部门、还要磨合南北方在整合工作中出现的种种难题。与此同时她还需要听取诸位市长同僚的工作报告——基本上算是正在亲管着共和国的小半数经济事务。不过最困扰她的倒不是这些......\n  “唔唔唔唔————哈啊！”无数次摇晃神签，然后猛的向地上一砸，以一往无前的气势抽出今天的神签！\n“——大凶。”从科潘冬的身上已经看不见当选时那股活泼可爱的劲儿了。摊在办公椅上，她快要愁死了。自从当选这个鸟总理后，她做的每一次抽签结果无一例外全部都是“大凶”。这才是最要命的事情。"
 als.88.a:0"她已经有点不记得要赚上一万万亿了"
 als.89.t:0"自由都市"
 als.89.d:0"“扩军？”今天的市长例会上，科潘冬对这个看上去有些突兀的议案有些惊讶。既然是联盟的内部例会，这份请求针对的自然并非是意大利陆军，而是自由都市目前拥有的城邦自卫队。\n提出这项议案的是一个大腹便便的中年猥琐男，托斯卡纳的都市长。“就现在看来，目前南方的军队要人要么是大法官阁下的拥趸，要么就是有着黑手党背景的本土人士。如果没有足够的后盾保障，理事长阁下的总理之位也没法坐的完全安稳，不是么？”他的一席话得到了另外一位，利古里亚都市长的赞同。“阁下在南方人气甚高这是事实，但无论是那不勒斯军队还是那里的官员，恐怕对来自北方的您一定都颇有成见，也许会与自由都市处于长期对立也说不准。”这位举止优雅但说起话来相当碎的老太太开始絮叨着没完。\n  “真是的！这是自由都市的内部会议，与国会无关，如果诸位不弄清楚这一点，我会很难办的。”科潘冬其实并不反对这个提议，但她目前只能叹一口气，这对于推进她在共和国内的政策来说百害无益。”威尼斯都市长——一位看上去风流倜傥的中年男性，也附和着这位理事长兼国家总理的说法。“这场内战刚刚结束，我们在某种程度上讲也算是窃取了内战的果实，如今要做出格的举动，实在没有道理，更不明智。”\n等到几位下属不再有新意见之后，科潘冬暂时收起了思虑重重的样子，略显兴奋地开始阐述起她的新计划。“当时我参选，本意原来是为自由都市争取更多的贸易额度，不过现在嘛，诸位，我有一个更大的计划。”她将黑板上卷着的计划蓝图一把拉下。“原来阿库娅那帮人嚯嚯自己人还不够，还一直从我们这捞油水，现在风水轮流转，轮到我们开源了！”科潘冬狡黠地笑了笑“简单点说，我正在向国会提议扩张自由都市的管理范围，除开城市，乡镇地区也会纳入试点区而由我们控制。调配自然也会尽量为我们大开绿灯。我知道你们在顾虑什么，但诸位放心，我科潘冬这屁股可不挪窝，自由都市将成为意大利的心脏！”"
 als.89.a:0"而且，扩军这种事情，本来就不是放在明面上说的东西，嘿嘿..."
 als.90.t:0"CITY问题的解决方案"
 als.90.d:0"兰斯城内，科潘冬再一次见到了兰斯。\n“你是说，归顺？”兰斯摩挲着下巴，品味着这个听上去有那么一点点刺耳的字眼。\n“是啊，当年你带着一帮山贼到处胡来，无论是南方还是北方都把你这当成匪窝了。”虽然在拉文纳，科潘冬力排众议，夸下海口称能亲自解决“兰斯帮”的问题。但当她来到这座由自己出资建起来的兰斯城，乃至在大厅见到坐在堂前的兰斯时，她却逐渐卸下气来。“是的啦...虽然兰斯君已经安居乐业很多年了，但是之前毕竟和官军大打出手过，搞得兰斯城顺带着CITY都变成国中之国了。所以...兰斯君只要带着兰斯城回到意大利的怀抱，以往的事情就都能翻篇，怎么样！”\n“不要。”好不容易鼓起劲儿来提出的请求被简单的驳回了。\n兰斯扣了扣鼻子，“什么‘归顺’啊，弄得好像是我屈膝投降一样。不要不要，别到时候本大爷想找个女孩子抱都不行。这一点绝对，绝对不行，除非你们让我抱遍全意大利的适龄美少女。”\n科潘冬知道和他争论后者没什么意义，所以她自然开始在“归顺”这种字眼上做文章。“也是也是，兰斯君怎么可能是敌人呢，当然是让兰斯君加入咱啦！加入！”和游刃有余的兰斯比，科潘冬显得很是尴尬，脸上疲惫的样子似乎加重了她局促不安的神情。\n好在，兰斯虽然不傻，有的时候认死理，但大多数情况下，他还真吃这一套。“唔唔，这么说本大爷还是有那么些统战价值的嘛哈哈...不过说起来本大爷可从来不知道自己还是什么土匪头子...”\n  “是啊是啊，这么说也只是程序上的问题啦，之后会派人重新入驻CITY，到时候也请多多指教——”“打住打住，我可还没答应呢。”觉出科潘冬想搞稀里糊涂落槌计，兰斯说出了他的要求。\n“第一，本大爷要在你的那什么政府里弄个差事，本大爷可不能一直烂在这里。”“这个当然没问题，应该，没有。”科潘冬咬咬牙，接受了这个要求。\n “第二，本大爷的兰斯城开支你们要帮忙承担一部分。”“这个自然没问题。”确实没有问题，因为兰斯这十几年来能安心窝在城堡里不到处作孽，很大程度上本就该归功于这位大富豪的接济。\n “第三，本大爷之后出去找女孩子疼爱，你们不准阻止本大爷，嘿嘿...”就像是早就知道他会提出这个要求一样，科潘冬像下定了某种决心似的，轻轻点了点头。“这个，我们，会，会想办法。”“答应的这么干脆，总觉得有诈...”像是卸下了什么沉重的担子，科潘冬准备马上走人。“总之，兰斯君能不再和政府作对便是极好，我还有事先——”可怜的科潘冬刚想转身，脑袋上的蝴蝶结就被兰斯一把拽住。\n“那么着急走干什么？”“喂喂！如果是那种事情——虽然咱也不是不想但那种事情现在果然还是——”\n“你想到哪去了，我不是那个意思。”兰斯敲了敲她的脑袋。"
 als.90.a:0"尽量，抽点时间，回来住几天。你现在像个老太婆一样"
 als.90.b:0"女人果然还是得好好保养一下，是的，不然真的会变丑的"
 als.91.t:0"兰斯君的安置问题"
 als.91.d:0"兰斯在意大利各地肆无忌惮的胡闹已经成为了这两天意大利各地最大的话题，我们来看一看因为兰斯匪帮的活跃而深受其害的卡拉大酋长帕斯特尔对此的点评，一向直性子的卡拉女王直言道，意大利政府将这位大魔头就这么轻易地放出来，简直是脸都不要了。\n某热心市民帕斯特尔：“你说一届一届一届王国政府，换了多少个国家总理啦，改过不啦？换汤不换药啊，那个死混蛋能天天昼伏夜出，袭击纯良百姓，这都是谁的错啊！他们就那么干净啊！人家墨索里尼也有理由说的，他们是怎么做的，虽然输了个1比10，但好歹把兰斯赶回了他那变态窝点不是啊？你这批人是怎么做的！你在这放，搞得那家伙每天夜里都能带着一帮人把人家纯良的女孩子们全都羞辱一遍，好几个卡拉都被他奸污了。你告诉我这又该怎么解释？脸，脸都不要了......\n折起今日的日报，看了看今天抽出的又一副“大凶”，科潘冬无奈地叹了口气。\n“虽然咱最喜欢的就是兰斯能充满活力的到处跑啦...”但目前必须重新让他安顿下来，不然这家伙迟早又会变成全民公敌，她会越来越为难。仔细想想，把他往军队里放是最合适的，但阻力绝对不小...“唉，兰斯，也许真的，得让他安定下来才是...”科潘冬摇摇头，放下报纸，她估摸着秘书已经准备好把今天的公文送过来了。由她主导的经济振兴计划顶着重重压力已经开始，但预算很大程度上都压在理事会——以及她自己的身上，要改变这个情况，她必须说服国会议员们为她的计划提出首肯。"
 als.91.a:0"搞钱不易，冬冬叹气"
 als.92.t:0"浮上水面的冲突"
 als.92.d:0"“所以，意大利的首要事务，是尽快在这一轮新的经济危机所制造的窗口期内重新扩展我们在地中海与欧洲内陆的贸易网络。亚平宁半岛上的分裂长期以来都在让这个国家往尚武与军事化的方向发展...” \n 在一场新闻发布会上，科潘冬神采奕奕地把她的签筒砸在桌上，“但是！从今天起！管他是什么功勋战士，还是名门贵胄——在意大利，至少在自由都市，没有钱的人——都去死吧！”\n真可谓语出惊人，台下的记者们面面相觑，而后面的民众欢呼声则是一浪高过一浪。\n   “谢谢，谢谢——当然，既然能说出这种话，自然我们也做好了为所有有志于创造财富的意大利人民提供就业岗位与创业资金的准备，在这两年内，我们会尽可能的集中原本被浪费在临战事务与国防方面的多余资金，展开大规模的工业建设，在各个自由都市的领导下，逐步将旧有的王室领地转化为工业用地。我们将为百万仍然没有钱花的黎民百姓提供可观的就业岗位。我们缺乏扩张重工业所需要的许多关键资源，钢铁、石油、煤炭，我们都缺，可旧北意大利政府将自身与奥地利的法西斯政权绑定的举措，与南方的那不勒斯牺牲国土权利与圣杯王国绑定的举措都是饮鸩止渴，说到底能够解决我们的困境的，只有商业！我们没有的东西，就去买！没有买不到的东西，只有开的不够多的价码！靠着越来越多的财富，意大利将重新成为欧洲的中心！”\n这场发布会与其说是阐释新政府的改革计划，不如说是在试探自由都市本身在国内的权威——但说实话，科潘冬自己都觉得这份演讲稿有些过于尖锐了。不过也正因如此，这场发言的效果显而易见。\n  “多特小姐，难道说为了进行全国性的经济计划就要直接裁撤刚刚为共和国赢得内战的陆军吗？”\n  “为什么要将重心放在自由都市的辖区，难道在未来自由都市在国内还会扩大化吗？”\n  “在国际日益紧张的现在自废武功，在未来是否会因为不可控因素所致的贸易阻断而面临麻烦？”\n “这些计划几乎是明显的倾向北方诸市，这些政策真的不会遭到南方政党的攻击吗？现政府对于局势的掌控能否支撑这些政策的施行？”记者们如连珠炮般抛出了这些原先并不在他们计划之内的问题。\n这场发言会以这最后一个问题的回答而宣告结束，科潘冬少有的用颇为强硬的语气回应了这个似乎是要激化矛盾的提问。"
 als.92.a:0"我们有能力应对所有可能的问题，这个无须担心"
 als.92.b:0"若是情况恶化，共和国自不会容忍他们挑战自己建立的民选政府"
 als.93.t:0"西西里的异动"
 als.93.d:0"在西西里的海畔，兰斯百无聊赖地看着一个个施工人员从他面前走过，他身穿一套看上去早已不合时宜的老旧盔甲，按理说这种堂吉诃德式的装束本应惹人侧目，不过鉴于兰斯魔王一般的名声，在场的人似乎都刻意避开了这大爷。\n自由都市有名的工程老承包商“阿玛兹萨”组接受了来自政府的委托，千里迢迢来到了西西里岛，在自由都市方的运作下进行最新的工业援建项目。考虑到近期西西里岛发生过一场性质恶劣的叛乱，伴随他们来到西西里的还有一支规模不小的城邦自卫队。\n    “不过...这不是完全没有异样吗...这么大动干戈也太蠢了。”兰斯看着海岸一片热闹的样子,暗自思忖着。科潘冬也把他塞进了这支自卫队里，让他帮忙保护施工用地的安全。虽然就目前看来他能做的也就是逛来逛去。街边也尽是看着让人做呕的汉子。“...完全看不到女孩子。全是膀大腰圆的死基佬，这个工作完全是烂透了。”狠狠地咬了一口手上的炸饭团，兰斯百无聊赖的靠在了街椅上。\n像是闻到了什么，兰斯突然向左边伸手，把一团空气揽在了怀里。“嘎哈哈，库雷因妹妹，在这里！\n“空气”慢慢现出了人形，穿着黑色的紧身衣，将头盔摘了下来，一袭白发甚是现眼。“...明明，已经重新改装过服装很多次了，即使是兰斯也应该...”“嗯嗯，应该闻不出来才是，但周围都是死基佬的汗臭的话那就另当别论了。”\n库雷因，拥有着能够探听到周围人秘密的天赋，但也因此被迫得知了太多致命秘密而被迫流亡的逃亡者，目前被兰斯庇护着住在城堡内。兰斯曾经有一位忍者，帮助他神不知鬼不觉地袭击无辜的女孩子。但早在好多年前就去世了。被赦免之后，要想继续之前的强*生活，基本上在情报方面都是拜托她来帮忙。\n   “所以，这地方有没有可以袭击的girl呢?”兰斯期待着问道。可惜库雷因摇了摇头，“知道你要来，镇里的女孩子全部远远跑走了，最近的离这里也有好几十公里。连乡下都没有女人了。”“...开什么玩笑。”\n   “比起这个，有更重要的事情。”“哦？什么事情，如果不是关于女孩子的就别提了。”\n库雷因长久以来都冰封着的脸少有的化开了，能够窥出担心的神态。\n“对兰斯来说，应该很重要。有人说，西西里的黑手党，最近似乎在做着什么事情。”兰斯的眉头稍稍皱了起来，虽然没有女孩子相关，但他也没有阻止话题继续。“之前，他们就做过谋划行刺那不勒斯大法官的计划。说不准，但是，似乎，这个计划，仍然在运行中。”"
 als.93.a:0"他们还要行刺那个讨人厌的法官？不...不太对...不好说..."
 als.94.t:0"大法官遇袭"
 als.94.d:0"今日的拉文纳格外热闹，作为现政府的驻地，一则紧急的电文让政府上下都陷入了紧急状态。\n  “马上封锁那不勒斯全城！给南方司令部急电，立刻！”当机立断下达命令之后，科潘冬焦急地在办公室来回踱步，随着时间推移，不时便有人进屋，向她俯首耳语来自南方的最新进展。\n共和国的开国领袖，那不勒斯大法官拉维尼娅·法尔科内在昨天夜里于那不勒斯街头遭到意外袭击，虽抢救及时但直至现在仍不省人事，也仍未脱离危险。虽然凶手已被逮捕，但问题也就在这里——\n凶手经过审讯，就在两个小时前，坦白称自己是收到了自由都市方面的委托行凶，事情随即迅速恶化。\n因为知道在这里也做不了什么，一场紧急的联盟例会就在这样紧张的时候，以科潘冬愤怒的签筒砸桌声为号而召开了。\n“砸了你们！砸了！开了六枪！还就在街上！当着大伙的面被发现！人家大法官是啥？是内战英雄，国家元老！呸！蠢货！我们有大麻烦了！恶心！恶心！”\n托斯卡纳都市长帕帕德玛斯：“多特小姐你是了解我的，我一直都是能跪着决不动手——我喜欢后发制人。”\n利古里亚都市长帕多莉希亚：“多特小妹你不会怀疑我吧，我要干掉那孩子，怎么可能这么光明正大。”\n威尼斯都市长贝斯托：“头儿你是了解我的，这么漂亮的适龄少妇，我怎么可能让人给她来六枪。”\n科潘冬没心思听他们辩解，她要的是解决现在的麻烦。“现在是将计划上呈国会的关键时刻，但现在别说这个，南方会乱成一锅粥的。驻扎于南方的军队也说不定会有异动...当务之急是与那个家伙撇清关系。绝不能让大众认为我们与这场意外事件有所关联。”“可是，据说南方的那不勒斯支持者已经出现大规模的骚动了，背后似乎也有法官派人士的造势...”帕多莉希亚搓了搓手，眼中的凶光倒是显露无疑。“这个情况，必须集结周边的自卫队了，西西里那边也有一支防卫部队，虽然要承担爆发武装冲突的风险，但现在必须杜绝可能造成政治意外的一切可能性。”一向温和的贝斯托都市长也罕见的做起了正面应对冲突的准备。\n  “毕竟，这个事件发展有些太急太快了，且不论那位法官小姐本人这么想，也许这是那不勒斯派的阴谋也说不定？他们在国会上已经明显落于下风，也许，我只是说也许，他们想要武力扭转局势也说不准。”\n  “打住！”科潘冬停止了他们无端的推测，但，作为总理，她的政治敏感使得她没有办法否定这个推测。"
 als.94.a:0"将自卫队派到那不勒斯去，密切关注南方驻军的动向"
 als.95.t:0"其名为迪亚波罗"
 als.95.d:0"虽然人手都调出城市内了，但要进入这个地方还真是意外的容易呢。完全无法想象。虽然是深夜，但你们的领袖可还在公馆里呢，居然已经看不见多少守卫了，就这么草草的对待自身的安全问题，此乃无谋。我的托比欧也是不负众望，他忠诚的完成了他的工作，轻易混进了公馆里。呵呵呵...\n原先的计划本来应该很完美才是，暗杀掉拉维尼娅，策动自由都市与原来那帮那不勒斯党人的对立，然后让这场矛盾——化作混乱——化作仇恨！，我便可于混乱中君临此地。\n必须承认，自由都市派的掌权超出了我的预料，但是，这也无非是换个目标的问题...不，那个家伙，和颇有战斗能力的拉维尼娅比起来可以说是纯粹的贫弱。手无缚鸡之力还不愿在警卫上下功夫...计划非常顺利——本该非常顺利才是！\n到底是哪里出了问题，我的计划居然被无端地泄露出去，两边预先准备的暗杀小队居然都已了无音讯。派出去的亲卫竟横死在那不勒斯的广场上。最后只能交给廉价而无信义的枪手...就像是，就像是，有人在阻挠我的计划！屈辱，屈辱！竟然有人能窥探到着无际黑暗的一角！可惜，可惜！竟敢妄图干涉我迪亚波罗的事情，那个人，还是什么组织，他们永远无法窥见潜入水中的那份阴暗。而我？就算没时间更改计划，就算那混账把我逼到不得不亲自出手的地步，一切结束之时也不会有任何人能够活着窥探到我的面目。“热情”也迟早会找上那家伙...过程是不重要的，今夜，一切都将天翻地覆...\n哦，我的托比欧，他遁入了黑暗，神不知鬼不觉地踏上了楼梯，楼上便是那个大小姐的办公室了，愚蠢，如果是我，既然无法再让自己为人所不知，自然要布设层层警戒才是。\n哦，哦！已经看得见那个家伙了，什么嘛，那副惊恐的面孔，我还以为会是什么强装淡定的家伙。不过这种率真的个性我倒不讨厌就是——吾乃迪亚波罗！科潘冬·多特，就用你的血，和她的，一起埋葬我不堪的过去！"
 als.95.a:0"King Crimson（绯红之王）！"
 als.96.t:0"兰斯与迪亚波罗"
 als.96.d:0"紧握着鲜血淋漓的右手，名为迪亚波罗的男人，忍受着剧痛。用极度愤怒而夹杂着些微惊诧的眼神怒瞪着面前这个不知从哪里冒出来的绿色家伙。“你——何人！这个家伙的护卫吗...混账...”\n眼前这个看上去轻浮不已的家伙鄙夷地扬了扬手上的长剑——上面迪亚波罗的鲜血尚在流淌。他明白，在替身击穿那个女人的胸膛之前，便是此物突如其来地向他的“绯红之王”发动了奇袭。\n  “有趣...”就像是嫌迪亚波罗还不够惊诧似的，那柄剑居然——开口说话了！开什么玩笑！\n  “喂喂，废物剑，现在是本大爷的专场，这里没你插话的份。”“啊不是，心之友啊，只是有些好奇，不知为何，这家伙的血，竟也能让老夫少有的感到兴奋，和魔人不同但——异于常人。”迪亚波罗没有被吓倒，    “居然袭击意大利的王者，你这家伙，已经做好了挑战余真容的觉悟了吗”\n“你这小瘪三事到如今还在扯啥有的没的。男不男女不女的变态玩意。还王者，笑死人了。”\n兰斯完全没把迪亚波罗放在眼里。\n“冷静，现在杀他不是第一要务...科潘冬·多特!”迪亚波罗何许人也，没有被这莫名的挑衅激怒，看着被突然袭击吓得不省人事的科潘冬，他做好了准备，要趁着她大大咧咧的护卫松懈之时一击毙命！\n  可惜，兰斯一眼就看出来他的变态对手意欲何为，“喂！准备好了！”他望向身后开着的窗户，一把拽住迪亚波罗的目标，将其甩了出去——这下科潘冬算是得彻底吓得醒不过来了。\n早就晕过去的她轻轻地落在了半空早已铺设好的魔法屏障上——这是志津香的手笔。\n除开兰斯这家伙奇怪的英雄救美情结，这大概也算是一个为暗杀者准备的“完美”的陷阱吧。（大嘘）\n  迪亚波罗出离愤怒了，“我不管你是谁，敢碍到我的事，你以为你能活着走出这里？你会为你的一无所知付出代价！”\n“什么一无所知啊，你这瘪三的本事本大爷可是了解的非常清楚喔，黑手党的小头头，有个什么预知能力，还能削除时间什么的？似乎还有什么奇怪的灵体帮忙，说实在的，就这点花里胡哨的东西，敢动我的女人，你这人不人鬼不鬼的家伙还真是自信。”\n 迪亚波罗的愤怒，因为这番话，开始有些许变成了恐惧，“你——你怎么会知道！我从来没，从来没！你！！！如果说刚刚在我眼里你只是个无知的混蛋，那现在，你已经是个愚蠢的背叛者了！做好迎接死亡的觉悟了吗！”\n “本来就是个恶心的家伙，还在那自顾自地说着大话，妈的，更恶心了。”兰斯没有继续陪他自说自话，他将左手举起，用卡奥斯从手腕的静脉上轻轻的划了一道小口子，不多时深红的血液便汩汩流到指尖，一点一点地落到地上。"
 als.96.a:0"不过是个看不见未来就会吓得尿裤子的家伙，敢动本大爷的女人"
 als.96.b:0"你这家伙倒是，有做好“觉悟”吗？"
 als.97.t:0"科潘冬夜袭计划！"
 als.97.d:0"“所以，后面怎么样了！兰斯？”娜姬兴奋地询问着那一夜的后续。不过...\n“后面一个不注意，给他跑了。”兰斯扣着鼻子，给了一个相当让人失望的回答。\n“欸——”娜姬失落地叹了口气。“当时早就和他强调了很多次吧这家伙。”志津香倒是相当不平。“库雷因小姐说了好多遍好多遍，这家伙要是不当场解决后面再想找他就麻烦了，真是的，就算是要搞英雄救美那档子事，就不能多备些人手么。你这死鬼非要逞强。这次失败你这家伙要负全责，全责啊。”\n“志津香，你要知道，男人之间的决斗，是不能有旁人打扰的。”兰斯正色道\n“你这混蛋明明最没资格说这话！”一本正经的兰斯被炎之矢烧地蹦来蹦去。\n无法，兰斯只得大咧咧地挠挠头，“管他呢，这家伙迟早得死的，用不着我去杀，迟早会有人去拿他性命，就那小瘪三，活不了多久的。更关键的是，现在是奖励！奖励时间，该去找科潘冬去拿“报酬”了。”\n   “等下，你说的“报酬”该不会是...”“当然是和科潘冬进行一晚上的“大人时间”啦！嘎哈哈。”\n   “大人时间”是娜姬还小的时候志津香强制要求兰斯避讳用的，不过不知道为什么，在娜姬面前这个词还是会脱口而出，哪怕她已经长得足够大了。\n     志津香恨不得要把兰斯的头都拧下来。“能不能，就分出那么一点时间，用你的脑袋思考，而不是下半身，行吗？她被吓地连医院都出不来，还没安生休息几天。你这混账过去不是添乱吗？”\n“我才不管，为了和科潘冬H我连自残这种事情都做出来了。不做到让她下不了床那可就亏死了。”\n2个小时后，兰斯在医院门口被几个保镖揍了一顿扔了出来。“你这家伙！怎么越过的警戒线！别想接近总理！”就这么被重重安保阻挠，兰斯不仅没见着科潘冬，还差点被当作意图行刺者差点被弄进了拘留所。\n  “啊啊啊啊啊啊！不管了！可恶的科潘冬，这是绝对是阴谋，阴谋！利用我帮助她阻止了暗杀之后就把我扔到一边！可恶可恶！”\n“完美的把问题的逻辑关系颠倒过来了，要是你直接告诉她有人要来袭击她，问题完全能更好的解决吧？”志津香轻松戳破了兰斯的诡辩。“妈的，无论怎么说都要惩罚科潘酱！对！趁着夜色潜入那地方，在科潘冬睡着的时候狠狠进行惩罚play！库雷——因！”少女应声而现。“倒不需要特别踩点，刚刚已经基本把这栋医院的人员配置和漏洞都听清楚了，不过，这样真的好吗？”"
 als.97.a:0"什么好不好的，准备作战！要用本大爷的超级兵器给科潘冬酱一个教训！"
 als.98.t:0"自暴自弃的萝莉少妇"
 als.98.d:0"作战，顺利！\n兰斯借着绳子，在库雷因找的一处没有防盗刺的墙上摸了进去，又摸到了医院的楼顶，最后从上面索吊下来，窗户并没有上锁，兰斯便顺利地摸进了病室。\n为了报上午的一箭之仇，兰斯带了点迷药准备好好教训那帮护卫科潘的护卫，但奇怪的是，科潘冬的房间外空无一人。“怎么回事，是她自己叫走的吗，奇怪...管它呢！看来可以直接搞一发睡X力，哈哈！\n摸到房门外，门仅仅只是半掩着，兰斯悄咪咪的推开房门，“嘿嘿，科潘冬妹妹，我来——”\n妈的，这家伙没睡，坐在病床边上呢。\n兰斯急忙撤了回来，但什么都没发生。他有些奇怪，大着胆子探了探头。她背对着房门，看着窗外，似乎没有听见动静的样子。也没出声，不知道在做些什么。\n是时候啦！兰斯从后面一把抱住了小小的蓝发萝莉，两只手一下子就揪住了那个不大不小刚刚正好的双峰“——揉——我揉——”。可惜，预想中的反应没有出现。科潘冬低着头，不发一语。只是甩着腿\n  “唔——怎么回事。”揪着双峰的手松开了。感觉，不太对劲？兰斯这么想着。\n  “是兰斯吧？”怀里的小科潘冬头也没回，只是颓然的靠在兰斯的肚子上。“是来和我H的吧...”\n  “啊，额，是啊。”没由来的尴尬，兰斯不知道该说些什么好。“...那就上吧，除了H也没什么用处了。”\n她自在地晃荡着悬在床下的双腿。“完全失败了，赚钱也好，让兰斯君爱上咱也好，当这个破烂总理也好。但是，但是，复兴计划，只差一步了，一步了啊。可是没办法了，已经得不到支持了，咱已经是杀人犯了，为了权力不择手段的杀人犯，不管怎么说都是这个样子了...”\n  “...”兰斯一言不发。\n  “之后会发生什么完全能想象出来吧？‘为了镇压异己，现任总理竟然对开国功臣痛下杀手，自由都市意图掌控意大利...’总会有人把这些话说出来的。民众也迟早会相信的。咱的事业，也会一落千丈吧，别说买下兰斯君了，我会不会，又会变成刚刚见到兰斯君的样子？连普通的人身安全这种小事还要那么麻烦兰斯——兰斯君已经不喜欢我了吧...大吉什么的也...”兰斯听见了抽鼻子的声音。\n  “可能吧？”兰斯认真的想了想，然后给出了这个答案。\n“...所以，H吧，趁着你还不讨厌我。趁着我还有钱供你去冒险，去作乱。来尽情上我吧，没事的。”言尽于此，她没有抵抗，只是等待着预想中的侵犯。\n    预想并未发生，兰斯收回了拦在她胸前的双手。"
 als.98.a:0"唔唔，走错门了，我找的是科潘冬君来着"
 als.99.t:0"待到购得兰斯之命运"
 als.99.d:0"“喂喂！你这是什么意思？”科潘冬急了。\n“你是科潘冬妹妹吗？刚上手的时候感觉OK，但现在感觉又不像了。我要H的是这个国家的大王，是意大利第一的超级首富。再差再差，也得和一个嚷嚷着要买下什么人的超级大笨蛋H才爽嘞。和一个爱哭鬼做爱？本大爷才没那种兴趣。”这个绿毛怪轻浮的语气实在让人火大，但，但不知道怎么回应他。\n所以，不知道为什么，但只能哭出来了。痛痛快快的哭出来，眼泪扑哧扑哧地流下来。似乎因为被抱着，还打湿了兰斯的裤子。\n但兰斯这个混蛋，居然还笑了起来。“你...你还笑！不许...你什么都不知道，都不了解。”\n“唔，那我该了解什么？我只知道你在这里哭鼻子。”“因为，因为不知道该怎么办了。这个总理咱当也不是，不当也不是。钱也亏了...天天都是大凶——完全不知道该怎么办...”\n“真蠢，本来就不该给自己占卜吧？还只会为自己解决不了的问题在哪里干着急。”\n“说的好像我解决不了别人就能给你帮忙一样，世界上，哪有，哪有这么好的事情。”“怎么就没有。”\n“你是说，你吗？”科潘冬觉出些什么。“差不多，但也不一定吧？你这家伙又不是一个人，难道没了我你就活不下去吗？大家都知道你是超级的赚钱天才，但再天才也有力不能及的东西吧？说到底，总得将什么东西托付给别人才是，趁着还有值得信赖的人...值得信赖的人！陪伴在你身边，将自己做不到的事情说出来，难道是很困难的事情吗？”兰斯将小小的科潘冬抱进怀里。“有人袭击你，本大爷杀掉他们就是；有人要造谣，本大爷就割掉他们的舌头，那帮政客油嘴滑舌，本大爷就把他们揍到不敢反对。不行吗？”\n“开什么玩笑，兰斯君做事也太暴力了。还把事情都想的那么简单。”科潘冬不禁破涕为笑。\n“不一定都是本大爷来做吧，你总归不是一个人。”“不，全让兰斯来，也行的。管他呢，如果是兰斯君的话...只是...我担心迟早会把你拖进危险的境地。”\n“这有什么好担心的——回答我，你现在还想把我买下来吗？”“哼哼，当然啦，虽然近期出了点，财务问题，但是离一兆亿也不过后退了几步而已！总有那一天的，我会把内裤都卖掉，把兰斯买到手！”\n“所以，在你赚到钱把我买下来之前，你都是我的女人，本大爷帮自己的女人，难道不是天经地义吗？”\n坏了，说的太多了，把本来该做的事情忘记了，这个场景也不是不能直接上，但总觉得有些尴尬啦...  “  兰斯。”“什么事？”“咱，咱不烦恼了啦，所以，好久没做过了呢，咱确实着急着想——”话音未落，科潘冬被高高举起，她顺势转过身来，将双唇叠在了他的嘴上。\n当她再一次坐在兰斯的腰间时，久违，甜蜜的结合重又开始。\n又是一个只有月亮默默见证一切的夜晚呵！"
 als.99.a:0"那一天究竟会在什么时候呢？不过一定会有吧？应该..."
 als.100.t:0"爱丽丝之馆！"
 als.100.d:0"大家好啊，我是爱丽丝——不是真的哦，这位是谕吉！（谕吉：也不是真的！）\n大家一定很奇怪吧，这里是钢铁萌心的世界吧？为什么还有这个爱丽丝之馆呢？疑惑疑惑~不过答案很简单呢——因为不是真的！刚刚大家看见的，不过只是同人呢，是某个闷骚牛头人文案的一时兴起而已。\n  （谕吉：也是个变态呢）\n兰斯是个究极的大色狼呢，在纯洁的钢铁萌心世界里完全是人人喊打的存在！\n（谕吉：因为大家都是纯爱嘛。）\n大家都不希望兰斯作为一个猎女无数的大变态去污染纯净理想的钢铁萌心呢。不过换句话说，居然将兰斯的内容加入进意大利这个国家里，这个想法也确实很大胆呢。\n  （谕吉：作者万岁！）\n所以，因为是钢铁萌心嘛，所以很多东西，都不能直接出现哦，虽然很郁闷，但是，意大利的其他相关内容，没—有—N-T-R—哦！爱丽丝也不反对纯爱哦，\n  （谕吉：爱丽丝也不想教坏小孩子嘛）\n嗯嗯，所以，请尽情作为一个纯爱玩家体验兰斯的纯爱大冒险吧！不过，也得担心内容会不会被指责有麻辣之嫌呢\n  （谕吉：诶诶，不会吧。）\n   当然不会呢，相信了解过兰斯君的玩家也能看出来，现在的兰斯也不单单是个脑子一根筋的年轻人了嘛。已经有那么一点点成熟了嘛，最重要的是，已经有不少人已经爱上他了。\n  （谕吉：虽然鬼畜的性格还是一点没变呢。）\n   总之，目前的内容不会是结束哦，随着意大利和玩家逐渐和世界陷入冲突之中，兰斯也会在各地活跃吧，在那个时候会发生什么故事呢？这个就交给各位前去游玩吧？对了，要不要看OP呢？虽然是OP其实也就是切一个背景音乐啦，如果已经嫌爱丽丝说的话太多了也可以不看完直接关掉哦，哦不对，好像已经要结束了。"
 als.100.a:0"（谕吉/爱丽丝）那么，好好享受这款mod吧，回见！"
