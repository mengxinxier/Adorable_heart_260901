 als.150.t:0"和平协定"
 als.150.d:0"在几辆坦克的护送下，科潘冬坐着一辆轿车，来到了人类与不死生物之间仅存的剑拔弩张的对峙要地——纳萨力克大坟墓。\n一下车，远远地能够看见，原本阴暗的大坟墓的上空似乎被某种东西照耀着。\n像是一个小小的太阳，甚至能将数公里外为了围困大坟墓而修建的战壕照亮。\n对于安兹和他的大坟墓来说，封魔阵每存在一天，亡灵就会越发虚弱乃至消亡。而他和大坟墓内的部队则会一直被困在此处。\n对于人类而言，这个覆盖了整个大坟墓的封魔之阵需要大量的魔力输送，长久地保留也并不现实。一场谈判在所难免。\n谈判地点被有意设置在战线的中央，在一片平原上，一座临时性的军事营地被铺建起来，那就是决定这场战争终点的地方。\n安兹依旧保持了作为一位君王的风度，比他矮上几乎一个身子的意大利总理在气势上倒还输了几分。\n谈判的重点不在和议本身——对于不死者而言这场战争已经完全失败——而在于能否允许大坟墓继续其在德意志境内的存在。\n于情于理科潘冬都想要驱逐他们，但安兹仍握有一支军队在大坟墓内，不会容许人类摧毁坟墓。\n但科潘冬也在施压，威胁将永久性维持对大坟墓的封印，坐看安兹和他的仆从们逐渐失去他们的魔力。\n最后的结果，对于安兹和他的支持者而言更像是某种流放。意大利解除对大坟墓的封印，但后者不再被视为德国领土，以现在战线为境。不允许安兹本人踏入德意志的土地，所有仍然忠于魔导王的人类军队均需遣散。\n值得一提的是，在谈判的最后，安兹加了一条似乎很不合时宜的要求。\n“那位，主持了这场最后进攻的将军，可有说法？”他说的自然是兰斯。“他是我们最杰出的将帅之一，想必你也不得不承认这一点。”\n“...的确是个，难以提防的敌人。只是...“如果是别人在我面前妄言情色，我只当是敌手刻意挑衅，或是自寻死路。”\n“但那位，在战场上直言要对我的仆从们行奸淫之事，这竟让我心生寒意，恐怕其所言并非虚妄之词。”\n“那家伙是不是开玩笑我还不清楚嘛......”科潘冬暗自思忖着，“保障她们的人身安全，你是这个意思吧？”\n安兹只是点了点头，看样子专门提一个这样的要求对他来说也是个需要跨越脸面的事情。"
 als.150.a:0"就当是和平的附加条款?没有问题，应该吧。"
 als.151.t:0"我 要 自 由"
 als.151.d:0"“所，所以——你就这么答应了？？？”兰斯气极。科潘冬倒是不以为意。\n“说的好像你就能对付她们一样，刚进柏林的时候我听说你可是风流了好几个晚上呢，也该满足了，魔导王那些事情，无所谓啦。”\n“怎——么可能无所谓啊！柏林那几晚只是前菜，前菜！那个雅儿贝德可是早就上了本大爷的狩猎名单的，还有那些女仆,那个叫夏提拉的似乎是个恶心东西倒也就算了...总之本大爷可是已经准备好要狠狠做个够的！你为什么一句话就给...不能，不能这样的吧!”\n虽然料想到兰斯会生气，但这番气话把科潘冬都吓了一跳。\n“本大爷之所以能够打这么久，不就是为了那个臭骷髅身边那几个绝世美女吗，现在说一个都不能碰，那我岂不是白这么久的仗了？明明一个连把都没有的家伙，凭什么就能独占这么多的美女，我不管！H！管他让不让呢，本大爷要杀进大坟墓，把那骷髅鬼砍了！把本大爷的东西抢回来！”\n兰斯想抓起背后的卡奥斯，但扑了个空，他焦急的摸遍全身，全然忘记了他的爱剑现在分成了3段，还在封印着大坟墓的事实。\n“——不行，哪怕不考虑你会不会有危险。兰斯，你不能去大坟墓。”少有的，她一本正经地阻止起兰斯的胡闹之举。\n“为什么你也要拦着本大爷！？你可是我的女人！帮不了忙就算了怎么还倒打一耙嘞！”兰斯跺起脚来\n似乎什么东西也不能阻止他去把那个独占美女资源的骷髅王一刀砍死。\n“安兹的要求，是在谈判桌上提出的，算是外交要求了。你可是意大利的三军统帅，要这么做，就意味着是我们一方在践踏和约咯。我也得考虑一下影响好吗。拜托了，这很重要。这关系到大局。”\n“那种东西，有什么所谓的，不如说，完全一点关系都没有吧。”这个理由似乎不能打动兰斯。\n“唔——果然咱已经是半老徐娘了，兰斯都在咱面前堂而皇之地谈论上别的女孩子了...”\n“这套也没用！这不一样！尤其是那个什么小宰相。看着就是个尤物，明明，明明马上到手了，可恶！”\n兰斯不耐烦的甩甩头，但多少还是平静下来了。“不做，就不做吧，真的是，早知道就把他杀了。”\n沉默了许久，正当科潘冬以为一切闹剧结束的时候，对面冷不丁蹦出来一句话。“不当了。”\n“啊？”“什么总司令，本大爷不当了。”“喂喂，现在！？不是这现在还有一堆事情没结......”"
 als.151.a:0"拉倒拉倒，本大爷不管了，完全是个吃力不讨好的活计。"
 als.152.t:0"无所事事的兰斯"
 als.152.d:0"意大利 CITY\n放弃了其统率的远征部队与占领政府，连柏林的兰斯大屋都没有留恋，兰斯回到了意大利。\n“因为没有把魔导王的女人搞到手，就直接把总司令辞了是吗？”给坐在前台嚷嚷的兰斯满上一杯酒，酒店的老板娘用一种，有些不敢相信，但也不是不能理解的复杂语气随意地询问起来。\n“唔唔——是啊，本大爷带着人从意大利打到柏林，再怎么说都知道就是冲着那个死骷髅的后宫三千佳丽去的吧，那个家伙，明明是败者，哪来的资格和我谈条件啊，科潘冬居然还要听他的话。完——全是被骗了啊我。”\n将杯中酒一饮而尽，郁闷的兰斯吵嚷起来。想耍脾气让酒馆里其他人不得安宁——不过酒馆里根本没有其他人。\n见到这个瘟神回来，大伙早就知趣的跑到别家去了。为这所生意本就不景气的酒馆又蒙上一层阴影。\n“如果是别人那不可理喻，不过是你这家伙的话——嘛，反正也就只有你这么蠢的家伙才干得出来。”\n兰斯有些醉了，也就没理会老板娘的揶揄。如果刚刚只是为自己的蠢事找了套勉强能裱糊住的说辞，接下来发的酒疯就有点许悔意了，“唔唔——都是那该死的魔导王，科潘冬也是，这完全是魔导王的阴谋，将我从总司令的位置撸下来，科潘冬居然也不拦着，完全就是大阴谋，大阴谋！万一那个死骷髅反攻倒算，就让他们哭去吧！”兰斯嘟哝着，一边要求再来一杯。\n“那之后，你怎么办？你的城堡里，可还有不少人要养活呢。”老板娘冷不丁问起来。兰斯愣了一下。\n“啊？额，今年的收成还蛮不错的，也托人在城堡里面改造了下，听比斯凯塔说年后就当景点开放了——哈哈！到时候所有人都会看着本大爷的城堡红眼呢...唔唔，最迟也得明年了，嘛，勉勉强强吧。”心底算着账，兰斯的酒倒是醒了一点。\n“不过，娜姬那倒还要打点，这堆浪费时间的烂仗，打完了之后说是还要去进修。既然她这么说了，至少上学这块不能耽误就是。”\n“那你怎么办？”老板娘挑了挑眉毛。\n“我么？姑且应付一下吧。科潘冬那家伙最近不容易，可以的话，没必要麻烦她。”\n靠着打家劫舍，兰斯城在十几年前就不需要科潘冬次次周济了。但现在，现在情况并不是很好。"
 als.152.a:0"嘛，会有办法的，会有的。"
 als.153.t:0"兰斯城来客"
 als.153.d:0"“你说什么？占卜师？”“是的，从上个月开始就频繁造访此处了，说是无论如何都要见大人一面。”\n兰斯捋了捋下巴，“是男的吗？要是那估计是骗子，赶走赶走。”\n比斯凯塔摇了摇头，“是女性，看上去挺年轻的，有些神秘。\n“唔——好看吗？要是你都看不上那还是赶走赶走。”\n问题再一次抛回女仆长这边，这似乎让她有些犹豫，她谨慎地推了推眼镜。\n“姿色倒是出众，但是，举手投足都让人感觉可疑。”她自己想将其拒之门外，但对方直言要见城堡之主，她没法自己下主意。\n“那就稍微见一下面吧，万一确实有什么要紧事，谈谈总是无妨的。”这么说着，兰斯内心也在盘算着。"
 als.153.a:0"“如果是骗子就狠狠给她来上一发再说，嘿嘿嘿...”"
 als.154.t:0"兰斯城来客"
 als.154.d:0"连续拜访了将近一个月后，这位几乎是执拗地等待着兰斯的女人终于见到了兰斯。\n虽说其姿色确乎女仆长之评判，当兰斯看见这位女士的面容，竟也少有的心里泛嘀咕。\n来者是一位身着典雅的年轻女子。着一袭黑色的连衣裙，嘴角微微弯曲，那几乎像是黏在脸上的笑容近看属实有些渗人。\n不过要说最惹人注意的地方，还得是她的眼睛，里面有着一个诡异的星星。\n“你是？”面前的女人欠身鞠了一躬，“妾身来自不列颠岛，以占卜为业，最近云游至此处。”她那诡异的眼睛只是紧紧盯着兰斯。\n“妾身不才，只是专好为各路英雄贵胄行卜算之事。还请兰斯阁下务必赏妾身一脸。”\n“就为这种事情要专门在这地方等本大爷一个月么？”兰斯有些将信将疑。\n“唔，阁下对妾身的执着有着不必要的误解啊，妾身的喜好，便是从少数人身上一窥似来未来之事，很多事情当局者迷，阁下究竟是什么样的人，将会迎接什么样的命运，妾身只是对其有着不必要的执着而已。”\n兰斯想了下，摇摇头。“本大爷才懒得知道未来会怎么样，不要不要，本大爷是什么人本大爷心里最清楚，不需要什么占卜，哈哈。”被干脆的拒绝之后，对方叹了口气。\n“果然，想让阁下接受，得给出个不同寻常的条件了。”真是黏在脸上的表情，她的微笑丝毫未变。"
 als.154.a:0"她不再言语，只是将自己的裙子提起。"
 als.155.t:0"兰斯城来客"
 als.155.d:0"说实话，和兰斯上过的千百位女性相比，这位占卜师的技术是最差的一档.\n她很努力的在贴合自己的动作了。但手法实在太过稚嫩。\n不过，很舒服，真的很舒服。她的秘处似乎有种魔力。勾引着，蜷缩着，然后将他的超级兵器俘虏在里面。\n简直像是被抛到某个温柔乡里。时不时还有几句不知道从何处来的呢喃传入他的耳际，直惹得兰斯兽性大发。\n他少有的为房事而疲倦，躺在床上，两个小时就像宿夜般漫长，疲累但甜蜜。\n当他回过味来，女方已经将衣装收拾整齐。“阁下真是个有趣的男人。”“唔——既然做了，那就姑且让你占卜一下好了。”兰斯松了口。\n“占卜，已经结束了。”女人只是再一次欠身行了个礼。“虽然对妾身来说，在房事的过程中预读也是第一次，但是意外的很顺利。”兰斯不禁皱了皱眉头，“我说怎么这么奇怪，你这家伙该不会搞什么鬼吧。”\n他的疑问没有得到回应，“比起解答你的困惑，你不想知道，占卜的结果吗？”\n“唔——也是，所以呢，本大爷是个什么样的人？还会遇见什么？”\n她有些故作神秘地顿了顿，眼睛直视着他，眼里的星星微微闪烁着。“你，算是个矛盾体吧。”\n“你的体内流淌着“冒险”的血液，这一点毋庸置疑，很明显，你的足迹已经到过世界各地。你见证过很多东西，但单纯对性爱的野兽般的原始欲却始终无法被动摇。”言至于此，她的脸上现出复杂的神情。\n“也正是如此，你内心中，对于“安定”的渴望，才显得如此矛盾。”“安定？你在说什么？”\n“简单来说，阁下似乎有些患得患失，你曾经能够为了做爱而踏遍整个世界，仅仅只是为了满足你的兽欲，但现在？你开始思考你的行为会带来哪些后果。你开始顾虑，开始踌躇，你不再相信你的好运气能一直陪伴着你。怎么说呢？你似乎在期待着旅途的终点，你疲倦地想看到这场冒险该如何收场。”\n“......没听懂。”要不是和她做了爱，光这几段叽里咕噜的话，估计听不完兰斯就要赶她走人了。\n“至于你的命运...恐怕连神都会承认你的存在是绝对的“偶然”吧。更遑论妾身。不过，有一点倒能够下定论。这个世界在向你开一个巨大的玩笑，在你接受那份宁静的时候，在你的努力开花结果的时候，在与野蛮，粗俗却壮阔无比的过去握手言和的时候，却要再次卷入一场蔓延至全世界的冲突。不过，如果将这当作结局，那其实倒也再好不过。”\n兰斯只顾着顺着她的话点着头。然后看着她自顾自的转身，没有道别，亦无挽留，像是完成了什么任务一样，径直离开了房间，独留兰斯一人沉浸在梦幻中。"
 als.155.a:0"她说的都是些啥？"
 als.156.t:0"消失的兰斯君"
 als.156.d:0"“话都不说一声就不见了吗？”春假归来的娜姬对兰斯的突然失踪很是惊讶。\n“是的，就是昨天的事情，留下了一张字条，然后就离开了。”对娜姬行了一礼，女仆长比斯凯塔冷静的解释着。\n女孩嘟起嘴巴，表示出她的不满。“明明在信里催我春假快点快点回来，怎么自己一声不吭就跑掉了？”\n有只手放到了娜姬头上，“好了娜姬，那家伙一直都是这个样子，大头跟着小头走的。\n“才不是，姐姐又在胡说了，兰斯明明要去哪里，都会带上我们的吧？如果是去危险的地方，起码也会和我们说一声。”\n志津香拉着帽檐，认真想了下，“唔——也是呢。”“对吧对吧，兰斯他，是不是有什么要紧事情呢？”\n没有继续接过话茬，志津香转向女仆长，“纸条上有写去什么地方吗？”\n“并不是，纸条上写的并不是去处，而是——”女仆长转过头去，引导志津香的视线落向大厅的深处，\n一位不知什么时候来到城堡的黑衣女子刚好款款经过，她们视线交错在一起。二对方只是提起裙子简单行了个礼便离开了。\n“那是？”“前几天来到城堡里的客人，据说是个占卜师，在大洋彼岸的祖国遭到政治迫害。是用这个理由，希望大人暂时供她避难。大人留的字条内容，就是让我们为她准备好住处。”\n“刚对他印象好点...”“不，不是小姐想的那样，事实上，那位小姐支付了一份相当丰厚的租金。这才姑且没有拒绝。”\n“...唔...”志津香没啥好抱怨的了，毕竟是交钱办事的问题。兰斯平时不说，但她对城堡的经营状况也有底就是。\n娜姬又蹦到志津香眼前，“好啦好——啦。兰斯不在就不在吧，至少姐姐少有的有空了不是么，一直为了大事忙这忙那的，这次春假没结束姐姐可不许为什么杂七杂八的事情跑掉。”\n“唔唔，确实这几个月忙来忙去的，科潘冬她们的事情，确实也不太想再上心了。果然还是需要放松一下。”\n总算从姐姐的话里得到了肯定的答复，娜姬开心的抱住她，把头埋进了志津香的怀里。\n“唉唉？唔，好——啦，又不是小孩子了，姑且也要注意下啊。娜姬。”\n志津香嘴上这么说着，但抱着妹妹，脸倒也不红，相当自然地顺着她的头发。\n能打赢这场与不死者的大战，对她来说是想都不敢设想的事情，但娜姬却丝毫不在意，她只觉得累坏了。\n在单纯这一点上，这孩子和兰斯还蛮像的。志津香这么想着，一边摇摇头"
 als.156.a:0"不要这么想，她本来就很单纯吧。本来就是这样。"
 als.157.t:0"不眠之夜"
 als.157.d:0"“怎么了，要在这睡么。”睡眼朦胧的志津香揉着眼睛，看着悄悄推开房门的，穿着睡衣的娜姬问着。\n“城堡里除了女仆们没多少人嘛，自己房间外面好冷清的，唔，害怕。”\n娜姬把视线撇到一边。无法，志津香习惯性的起来掀开被子，让妹妹像只兔子一样钻进被窝里面去。然后才把灯熄掉。\n“真是的，明明白天还活蹦乱跳的，怎么晚上就开始害怕了。”\n小时候，娜姬只黏俩个人，她还有兰斯。也一直住在一起，更不分床。这个小崽子是个多动症，和那个二流子一样露着一排鲨鱼牙。要么咬得被子都给口水浸透了，要么就是不知道为什么一口咬在志津香的脸上。还经常把被子卷走，害的她总会在半夜被冻醒。\n现在？完全看不出这孩子还有哪里像小时候的样子，圆圆的脸蛋变得标致了，说话活泼但又很得体，已经是个在什么地方都能引人侧目的少女了。躺在她的身边，志津香有些睡不着了。\n“我是无所谓，但娜姬这个年纪，实在是不想又给那家伙...不，就算这...”被一种复杂的心情弄的混乱了，她更加难以入眠。\n冷不丁的，原本背过身的妹妹又转了过来，一双写满了担忧的眼睛和志津香交汇上，气氛顿时有些尴尬。“还没睡么？”\n“睡，睡不着。”祈祷妹妹不要再追问下去，志津香有些慌乱的搪塞着。\n“唔——本来想趁着睡觉的时候——”“你这家伙，不会想蹭我豆腐吧！？”多亏了和那个变态打交道的经历，她的感觉比谁都敏锐。“因为，很害怕嘛...”娜姬在被窝里搓着手。像是很冷一样，颤着身子。志津香从她的语气里觉察出不对。\n“怎么了？出什么事了吗？”“那个...那个占卜师。”娜姬有些遮掩的提起那个女人。\n“我很好奇，她好像认识我，想找我占卜。”像是戳到了志津香的脊背上，这话让她全身起了鸡皮疙瘩。\n“她，很让人不安，她说的话听不懂，就像是，我们认识一样。可是她说，她不知道我有个姐姐。”\n“她，给你占卜的结果是什么？”不自主的贴近了娜姬，志津香尽可能保持平静地问着。不让她感觉到慌乱。\n“她说，我是一个不该存在的...“本应是个死人”。还有...为什么呢，为什么“我的命运早就看不见了。”\n虽然还不能理解对面在说些什么，但这明显让她陷入了某种混乱之中，对她来讲这是在所难免的。\n恍惚间，娜姬感到自己的头被推进了某人的怀里\n“从来都不知道父母是谁，姐姐也是，兰斯也是，从来都缄口不提，我和姐姐究竟来自哪里？我什么都不知道。我，我有点...”\n没有什么办法解释这一切，志津香将她的头靠在自己的脖颈上，“我保证，合适的时候，我会告诉你一切。”"
 als.157.a:0"不知道过了多久，也不知道为什么，脖子，下巴，脸颊...连双唇也开始交汇。"
 als.158.t:0"主教吃掉城堡"
 als.158.d:0"昨天晚上发生了什么？志津香自己很清楚，但她并不确定娜姬究竟清不清楚，或者说明不明白这意味着什么？看着自己的身旁仍然在熟睡的少女，缩在被窝里，脖子上的香汗都清晰可见。一定是第一次做这种事情吧？昨晚实在弄的很累，为了迎合告别稚嫩的姊妹，即使是一夜过后志津香的腰也在隐隐作痛。即使是在这种神圣——或者说下作的时候她也如此热情，单纯，以至于让人无所适从。\n算了吧，做都做了，大不了气死兰斯，反正也是他活该。反正，他也说过，只有娜姬他是绝对不会碰的...\n抱着这样的想法，她的脸却又红了，禁不住慢慢的凑过去，往妹妹的脸上轻轻吻了一口。\n她已经被各种各样复杂的事情与感情伤害，折磨过，虽然从没想过会演变成这样，但这又有什么所谓的呢？\n至于现在，她得自己处理那个非常麻烦的家伙。\n“真的是“占卜”出来的吗？还是说只是因为认识所以...”这个问题的答案并无意义，那个神秘的女人确实知道娜姬的存在。\n这个问题已经足够坏了。以至于...志津香自己可能都不清楚，这算不算是某种杀心。\n“你说我认不认识她？”面对着质问她的志津香，对方只是微微一笑。“只是，和我某个朋友有点像。”\n“朋友？”“是的，一个在魔法上颇有造诣的家伙，只可惜，脑子和内心都有点问题。”\n似乎是看出了来者眼中似乎带着一点杀气，女子没再往下说下去。\n“阁下来只是为了问这些细枝末节的问题吗，您需要妾身为您占卜吗？”“不需要，如果可以的话，请你不要在为其他人提供占卜。”\n“这是‘请求’还是‘要求’？”“都不是，这是‘警告’。”志津香慢慢攥起拳头。\n“...不知趣。”占卜师轻轻叹了口气。“真要说的话，除了那俩人我都没有兴趣。无所谓就是了。”\n虽然这么说着，但她看向志津香的眼神有种耐人寻味的感觉，令志津香心里有些发毛。\n“如果话说完了就请让开，妾身有自己的活计要做。”她轻轻推开拦在面前的志津香，快步离去。"
 als.158.a:0"虽然刚刚这么说，尚且搞不清楚状况...真是的，这不是也很不错吗？呵呵..."
 als.159.t:0"请吃团子！"
 als.159.d:0"“啊姆啊姆...”兰斯对着送上来的饭菜狼吞虎咽。他有一个多月没有吃上好东西了。“还有吗小香！？”一碗泡饭又端了上来。\n“还有还有，慢点吃。”织田氏的家主，团子姬织田香，慌忙地在厨房与内室间端送着临时做的宵夜来回。\n“呃——至福~”不知道自己干下了多少米饭，兰斯靠在墙上，发出了舒服的嗝声。”\n“很抱歉，兄长，如果我能早点得知您的造访，肯定会准备更多东西的。”\n微微倾下身子，香给兰斯道了个歉。“这需要道什么歉，为本大爷准备的东西不是很好嘛，不要紧不要紧。”\n“但话是这么说（左）  这种事情不早点通知这边（中） 本来就是阁下的问题吧？（右）”\n“死3G，从刚刚开始就在这里唠叨，你不说话没人当你是哑巴嘞。”   “还是根本不讲道理！（齐）”\n从前帝国时代开始，就在辅佐织田一氏的老妖怪3G，虽然活了千把年，是个慈祥的老爷爷，但长着三个头，很不受孩子喜欢。（3个头各自也很苦恼)\n虽说安顿好后已是深夜，然酒足饭饱，兰斯和香还是不免聊起了天。\n“还以为兄长成为了国中要员，怎么也该直接飞过来才是，为什么会这么风尘仆仆的过来呢？”\n“因为一些原因，本大爷把差事辞了，买机票太不上算了，坐船太久也会晕船，所以陆路稍微走远了点哈哈。”\n“那也不用一路走到香港吧...”香苦笑着。“说到底，为什么会在横滨给人拦下来...”\n“有个小屁孩骂本大爷是外国人，所以揍了他一顿，然后他父亲冲了过来....揍着揍着就一发不可收拾了。”\n严格来说，打到第三个人来的时候兰斯就已经是被揍的那一个了，最后被一群人围殴了好一顿。扭送进了局子。\n“没有香公主，阁下都不知道该怎么办好（左） 明明十多年了都（中） 怎么还不改改痞子习性？（右）”\n“兄长，只有小孩子的一面一直没有变呢。”香倒是释然地笑起来\n“也是，全仗着小香才得救了哈哈！不然这次多半悬了。”兰斯哈哈大笑。丝毫不在意门外那群用诧异的眼神看向内室的仆从们。\n“说起来，小香最近过的怎么样，还以为没了本大爷会有人欺负你呢。”\n“虽然确实有些困难，但好在有3G还有一些老藩士照顾，一切还好。”香不禁有点害羞，红着脸退让着。\n“主要是（左） 政府与军部间很多事情都得靠国主出面嘞（中） 好多东西都得让香公主去斡旋。（右）”\n3G叹气，“兰斯阁下应该也明白的吧（中），对香公主来说，这实在是件很辛苦的差事（左）。”\n作为旧华族都认可的意见领袖，要是出了什么麻烦事情，无论是军部还是政府，他们都愿意听听这位织田家主的意见。\n兰斯愣了一下，“但这样的话，小香不要紧吗？”面前的香似乎将眼睑垂了下来。“早就不要紧了，咬咬牙，就行了。”\n“那么，本大爷也无所谓吧。”“兄长的话肯定没有关系啊，一直都——”\n意识到兰斯话里的意思，香的脸霎时间升起一阵红雾。“果然——（齐）第一件事果然就是——（齐）”\n不过没再像以前一样喝止异国人的无礼举动，3G向公主鞠了一躬就退出了内室，关上门的那一刻，兰斯就出手抱住了香公主。手娴熟地解开了套在她身上的和服。"
 als.159.a:0"反正也要天亮了，今晚就别睡觉啦！"
 als.160.t:0"冰中奴隶"
 als.160.d:0"来到樱花国已经有差不多一个星期了\n这个地方已经没有以前那么开放了，想到街上找个女孩子玩玩，结果马上就会被一群完全不相关的人揍一顿。\n去了一趟游廓，花了本大爷一大堆钱不说，最后时刻居然对本大爷说现在卖艺不卖身了，想直接上结果又被揍了一顿。\n进了局子那群混蛋二话不说把本大爷揍了一顿，嘴里还嚷嚷着什么“外国人”，混账，当本大爷听不懂日语似的。\n本大爷以前可是拯救过樱花国的大英雄，怎么现在听上去变成那种人人喊打的猥琐中年男了？\n不过，至少香姬还是很好的，不管本大爷犯了什么事，她说一声，那群混蛋居然就把我放了出来。\n用起来也舒服，除了我以外没人用过所以意外的紧致，声音也缠人，她也一直盼着我回来吧，整晚都是花枝乱颤地笑着，哈哈。\n嘛，总之，毕竟，也来了一个星期，该上的也上的差不多了，上不了那也没办法，没啥事好做现在，今天，找她看看算了。\n这不是和以前一样嘛，不，不如说，居然连房间外面都铺上花了，是小香知道我要来所以特地铺上的吗？\n今天要见的人，叫希露，她是本大爷的奴隶，唔，一号奴隶。\n魔法啦家务啦做爱啦都很能干，所以勉强一直带着走。一直上她也不会有怨言，是个好用又好玩的家伙。\n本大爷带着这家伙来樱花国砍了个怪物，不过，因为某些原因，这家伙被冻在一个，不会溶解，削掉也会再生的冰块里面。\n也因为一些无关紧要的小事情，现在暂且还解不开，差不多就是这个状态。后面偶尔，啊，真的是偶尔，就会差不多想来这里。\n当然，肯定不会为了这个破女人专门来这个破地方的，来樱花国基本上都是为了好好和小香做爱，顺便，来这里看看。只是顺便。\n嘛，倒也不是想做些什么，总觉得应该看看，上次来看，好像已经有五六年了。只是看看，也许说几句话，她可能就张嘴回答了都说不准。偶尔，使点坏什么的，反正那个家伙又看不见。至于为什么？没啥为什么，就是本大爷会痛快很多而已。仅此而已。\n小心移动，小心...不要踩到花了。嗯嗯，到门前了。不过，其实就几步路，总觉得走了好久，可能是想的东西太多了。\n唔——那个家伙现在是什么样子？虽然说一直被冻着，但要是偷偷地长大，偷偷地变老怎么办，本大爷才不想要老太婆。\n据说，那块冰削掉了也会长出来，所以宅子里用这玩意做冰沙吃，会不会，冰已经被削的乱七八糟，看不清里面的东西了。\n也可能，是个恶作剧，虽然几乎不可能，但也说不准嘛，那个家伙也许就直接埋伏在里面准备吓我呢，冻住什么的都是骗人的。\n......我到底在想什么啊，都到门前了还想这些乱七八糟的东西。"
 als.160.a:0"像是下定了某种决心，兰斯将门慢慢推开。"
 als.161.t:0"冰中奴隶"
 als.161.d:0""
 als.161.a:0"......"
 als.162.t:0"冰中奴隶"
 als.162.d:0"“唔唔——该死。”完全不知道要说些什么。兰斯那样想着。在冰块前面，局促不安的站着。\n“...被冻了这么久，很冷吧...我是傻瓜吗？”兰斯摇摇头。“别装听不见喔...不，肯定听不见吧。”\n可恶，这次，完全不知道该说些什么好。冰中的少女沉默着，似乎在等待兰斯说些什么。急得兰斯抓耳挠腮。\n“反正说些啥，也只是自说自话嘞。”能说的以前都说过了，想不出有啥可以说的，兰斯失落地想着。\n冰中的少女似乎看上去像是皱起了眉头，似乎想说，就算没有也没关系的样子，也许吧。\n“反正，说的再多，也只会让你觉得没了你本大爷就不行了。开玩笑，本大爷才不是这个样子。”\n反正说啥这家伙也不会从冰里蹦出来，那说什么话也没劲儿。\n兴许是想到什么，兰斯突然哈哈大笑，嘲弄起冰中的，他的奴隶。像是为自己的无言找到了理由，不由得满意地一屁股坐在地上。\n“你以为你有多重要，能让本大爷魂牵梦绕吗？本大爷没了你才自由，老子把一个世界第一的大富豪迷的神魂颠倒，那个小恶人志津香现在更是，早就是本大爷的形状了，想操就操。老子还当上了总统，带着大军在全世界抖威风呢。你以为你是什么东西？”\n“本大爷那么伟大，要还呆在里面不肯出来，本大爷迟早会把你给抛弃掉。迟早的事情，听见没？”\n冰中的女孩子没有反应，不过看上去，好像，是笑起来了吧？似乎很高兴的样子。是的，一定是笑起来了。兰斯也笑了。\n“嘛...不过，差使已经辞了，兰斯城的话，最近不太好过，科潘冬也是，那家伙好多钱打水漂了，别看她会赚钱，真要对付那群政客还是太难为她了。”抬起头，仔细看看冰中的女孩子，兰斯不免得有些落寞。“志津香那家伙也是嘞，一天到晚就围着娜姬转，这小家伙脑子一直就一根筋，虽然现在温柔很多嘞，但也变成容易被骗得团团转的类型了哎。不过，只要看着，倒也出不了事就是了。”\n再谈到娜姬的时候，兰斯开始头痛起来，“说起来你应该也不敢相信吧，那么小一个，居然长的快有我高了，长得也漂亮，喊起人来怪好听的，胸部也很大，可惜长了嘴鲨鱼牙——可恶！完全是一个相当活泼元气的少女了唉，还很天真嘞，已经，完全是两个人了。”\n“一想到她迟早要嫁出去给别人糟蹋，就会难受的想死...”似乎听见她在咯咯地笑，感觉自己被嘲笑了，兰斯生气的抬起头来。\n并没有，他面对的只是一块冰。冰中的女人闭着眼睛，不发一语。\n“我真是个，十足的，超级大傻瓜。”少有的，兰斯给自己翻了翻白眼。也不管腿有多麻。他一骨碌爬起来。\n“嘛，总之，会把你试着弄出来，不过，要是本大爷死了，那就没办法喽。”用坐麻了的小腿轻轻踢了踢冰块，兰斯轻松地说着。\n自从那次占卜过去后，就总会无端想起她，不知道为什么，总觉得，无论如何得回来看一看。哪怕事情根本没有进展。但就是想回来看看，才能安下心来。不过，要是他真的死去怎么办？她会一直冻在这里吗...谁知道呢，干嘛想这些呢？"
 als.162.a:0"可能连他自己都还没意识到，他似乎不太有把握了。"
 als.163.t:0"追忆，即便亲手葬送"
 als.163.d:0"和希露见了一面，一直神魂不定的兰斯，心情总算好了起来。\n然后，兰斯很满意的和小香H了一晚上，sex的时候她似乎请求了些什么，兰斯没多想就同意了。\n第二天一问才知道，她要拉他去扫墓。\n来的很不是时候，樱花树可都秃着，一桩墓碑孤零零地靠在光秃秃的树下。但也正是这般萧瑟的景象，让兰斯能够回想起来，这片地方，樱花烂漫，争相飞舞的时候。“小香，现在，并不是祭扫的时候吧？”香，正一本正经地将一盘团子放在树下。\n“事实上，即使是祭拜的时候也几乎不会来呢，但是兄长好不容易回来一次，必须要问候一下。”\n“额，好吧，虽然不是时候呢。”\n香的哥哥，兰斯的朋友，就葬在这里，和他的妻子一起。\n是个无可救药的笨蛋，只会做团子做别的就一无是处...倒是能打架但是常年生着病。多少算个家主却喜欢带着妹妹跑出去卖团子。\n有个老婆，死的很早，好像是说，是个“身上满是太阳的气味”的女性。记得是那个家伙亲口说的。至少兰斯记得很清楚。\n后来？后来打仗了，他死在了一个恶魔的手里。只剩下一缕头发埋葬于此。\n“兰斯哥哥回来了，回来看我，看看希露小姐，也来看你了。”双手合十，身子微微摇着，香轻声呢喃着。\n也不知道过了多久，香就这么跪在墓碑前面，不知道在低声说些什么。兰斯坐在她后面看着她，有些怕她会不会挺不住扑通下去。\n后来，实在有些担心，兰斯上前去，把香抱了起来。“吃点东西吧。”于是，两个人倒了几碟酒，坐在樱花树下，慢慢地坐喝。\n越是与记忆大相径庭，就越是能想起记忆中的样子，樱花树随风摆动，发出沙沙的声音，樱花肆意挥舞，洋溢在昔人故去之处。\n“你在做什么？”“供奉。”“欸？”“这颗樱花树下面，是我夫人的墓。因为她很喜欢樱花，就葬在了这里。”\n“比我要健康地多，性格很阳光，喜欢来回奔跑，她满身都是太阳的气味...真是非常好的女人。”\n“被，被杀了吗？”\n“有一次，遭到了分家的行刺，她为我挡住了一刀...唉，也许，要是我那时死了，她就能活下来也说不准......兰斯？”\n“什么事？”“这个世界上，没有什么理所应当的事情哦。”“额？”\n“当彻底明白的时候，开始后悔的时候，到底，还能做些什么呢？”“...不是很理解，本大爷从来没遇见过这种事情。”\n“这样么，也是啊。嘛，心烦的话多说无益，再喝一杯吧，兰斯。”\n怀念着自己亡妻的人，如今进了这墓里与其同眠。徒留一个失去了友人的异人，一位失去了长兄的胞妹。\n慢慢的，兰斯一碟一碟地将清酒送进肚里。就着便当大吃大喝。眼前是为自己所斩杀之人的墓碑，还有被友人托付的孩子。\n虽然，一直记得很清楚，但，过的久了，兰斯才慢慢有些理解那个又傻又憨还有点痴情的家伙。因为，遇见了不少事情嘛。"
 als.163.a:0"不过，确实，有些太晚了。"
 als.164.t:0"分离焦虑"
 als.164.d:0"后半夜，在梵蒂冈城的一处角落里，一个看着相当壮硕的男人靠在墙上，许是夜色正浓，他的头像是钓鱼一般起伏，周围没有一点声响，只有悉悉索索的微弱虫鸣最能助眠。不过，一阵脚步声轻轻地从巷子的深处荡了过来。\n男子甩了甩头，直起身子，对着声音传来的方向望去，但一只手却攀上他的后背。\n“...每次都要开这种玩笑吗。”男人没有多大反应，于是他今晚要见的人，便轻轻地从身旁转到他的面前。\n“和你的人一样没有幽默细胞欸。能摆些不那么阴沉的表情嘛？”“穿着黑衣，还挂着一张皮笑肉不笑的脸，想幽默些也很难吧。”\n寒暄到此为止，“好了，贝库多兰氏，你的人准备好了吗。”\n“...那是自然。”被称为贝库多兰的大汉抬头望着不远处的教廷府邸。“但是，依然不太确信——居然就在这里？“暗槛”啊，果真如此吗？”“这种事情根本无从确认啦。”女人稍显无奈地把手摊开，“为了逼那个魔法使开口我和女儿们用了不少办法，催眠也好洗脑也好都无从下手嘞。能得知地点已经是谢天谢地了。”\n“魔法使？我记得，目标应该是那位，卡奥斯之主——”\n似乎才记起来应当说明，“暗槛”尴尬而又带点蒙混意味地笑了笑。“原先，计划确实是拿下那个男人嘞，但——似乎是察觉到不对劲，他消失的相当迅速。不过，没有区别，新抓到的这个家伙，和你要抓的人一起进过巴比伦塔。”\n“巧合吗？”“巧合，原先只是抱着收藏的想法抓住然后调教呢，但在那个时候发现她似乎也知道我们想要的东西。\n“...无所谓。”似乎是认可了对方的说辞，大汉只是扬了扬眉毛。“能否确定消息是否属实，这才要紧。”\n“不是很好解释...因为对常规的洗脑手段都有防备，所以用了些其他办法，上了点猛药，才堪堪挖出我们想要的东西。”\n“那么，具体在什么地方，就算明确在教廷本部，如果没有确切位置，突袭怕是也难以成功。”\n“不，只知道封印在梵蒂冈宫里，因为一些原因没法知道更多了。”男人不耐烦地摇摇头，“那就继续审她。”“已经做不到了。”\n“被你玩死了吗？”“被救走了，家里遭到了入侵。本来已经控制住情况了，但那个人有点本事，把她从我的结界里传送了出去。”\n大汉的手像是把什么东西攥在手心里，脸色也变得有些难看。\n“我没时间也没人手来陪你胡闹，这是你自己的疏忽。袭击必须速战速决，别戏弄我们。”他沉声警告着面前的女人。\n闻及此语，女人倒也不生气，只是再次摆出了那副令人脊背发凉的假笑。“不用速战速决，放心，因为我亲自来了嘛。”"
 als.164.a:0"让你的人准备好，要准备突入那群神官们的老巢咯。"
 als.165.t:0"大麻烦（其一）"
 als.165.d:0"早上，早早起床的织田香刚打开房门，就看见兰斯在一颗树下发呆\n“兄长，在想些什么呢？”她好奇地凑到兰斯身后，冷不丁问了一句。“没，没什么啊，只是，稍微有点怀念，当然更多的是期待。”\n“期待？这里会发生什么？”兰斯的嘴角猥琐地弯了起来。“还记得志津香吗？”“印象不深，内战时似乎是兄长的伙伴？”\n“当年那个家伙爱我爱的不得了，本大爷远在在樱花国，她自己弄了一个传送魔法，想直接来这里和本大爷做爱，结果没控制好，在这地方摔了个狗啃泥嘞！哈哈！”“...我记得，好像是因为踩到了仇人设的传送陷阱，才阴差阳错被传送过来的吧？”\n“你这家伙，还说印象不深，谁信哪.......”兰斯无语。\n小香挠着头，还是不太理解兰斯在这里发呆有何意义。“兄长总不会认为这种事情可能会发生第二次吧?”\n“什么叫可能，今天就会，肯定会在这里遇到美少女，然后开开心心地和她H。”兰斯叉起腰来，一副胸有成竹的样子。\n饶是温和有礼的香姬都给这番话整得不知道该说些什么，“这种事情，只能说不常有吧，至少不可以守株待兔....”\n“什么守株待兔，本大爷有根据，在这里闻到了不属于小香的美女气息，今天肯定会有一场超——级正点的艳遇嘞。”\n然而到了晌午，香想喊兰斯来吃午饭的时候，他还在那棵树下徘徊。空等着想象中的美姬。“要不，先放一放如何？”香姬无奈。\n“一定是哪里出了问题...上次是感觉到会有艳遇所以...明白了！这种事情，终究没法空手套白狼啊。”兰斯开始双手合十，祈祷起来。\n“从守株待兔变成求神拜佛了吗.....”小香深深地叹了口气，转过身准备回屋。\n“扑通——啊！”一声沉闷的坠地声伴随着兰斯的惨叫，小香一惊，匆忙回过头来，一团绿色的东西砸到兰斯的头上。\n定睛一看，是女人！祈祷似乎成真了，一个女人竟径直从树上砸到兰斯的头上。\n当兰斯捂着被砸地七荤八素的头回过神来，看清楚眼前天降的美女的时候，他不由得大喜过望。\n“这家伙，没错，是志津香啊！还是，晕过去的志津香嘞！”\n不知道为什么，十几年后，在同一个地方，志津香再一次摔在了樱花国的土地上。\n“估计是摔得不省人事了，简直是天降甘露，管她那么多先来一发再说！”他狞笑着扑了上去。\n然而，当兰斯的双手压在志津香的双肩上时，滚烫的温度让兰斯停下了动作，“唔唔——等一下。”仔细一看，即便已经停下手来，他的女人却依然在本能的颤抖着，呼吸沉重而浑浊，兰斯四处看了看，不免得又注意到她手腕、甚至是身体上细密的勒痕与针眼。\n但，真正让他彻底愣住的，是她的眼睛——眼睑半开着，似乎并没有力气闭上，往里窥探，看不见一点神采。\n“阿香......阿香！！！”“欸欸？”兰斯将微微呻吟着的志津香抱起来，“去找医生，快去！不对劲，相当不对劲！出事了！”"
 als.165.a:0"可恶，发生了什么...妈的！"
 als.166.t:0"大麻烦（其一）"
 als.166.d:0"太阳已经快落山了\n内室里，医生做完了最后的检查工作，看了看站在门边香姬的脸色，得到允许后开始慢慢地向身旁的兰斯解释起来。\n“从临床情况来看至少确定是有一直被注射某种药物，在本地的话，十年前倒是经常能见到这类，是在——这个不说也罢。”察觉到身旁的杀气越来越重，医生擦了把汗，放弃了继续解释下去。\n“总之，还请先生放心，这孩子并无生命危险。但是，似乎之前也被注射过一些神经药物，现在的情况可能是某种戒断反应也说不准。\n“所以该怎么办？”兰斯没顾着听医生的废话，直截了当的发问。\n“用药很少见，而且也杂，短时间难以开出处方啊....姑且先打一针镇静剂再尝试退烧...”随着一声巨响，医生被一脚踹出了内室。\n呻吟的声音再一次大了起来，志津香一只手紧紧攥着床单，另一只手随着身体的躁动胡乱地在空中挥着，似乎徒劳地想要抓住什么。\n抓住了，紧紧抓住了兰斯的手臂。虽然没有醒过来，但出于某种直觉，这让她稍稍安稳了下来。呼吸均匀了一些，但依旧高烧不退。\n“不会...不会...”有时她会胡乱地在嘴边说着什么，根本听不出所以然。兰斯俯下身，在她耳边低语着什么，是安慰吗？这不得而知。\n天色已经黑了下去，兰斯点起一盏昏黄的罩灯，取下了她头上的敷巾。“小香，再换盆水——”\n但没人回应他。香姬不知什么时候，也离开了内室。\n人生中头一次，兰斯沮丧地看着深受折磨的，他的女人。他感觉自己似乎什么都没做上。除了攥着她的手，他能做的事情相当有限。\n库鲁库递过来一个装着液体的瓶子，“这是用独角兽的爱液制成的药剂，能祛除体内的媚毒，也有相当强的镇静效果。”\n“有这种东西早说啊，我让她先喝掉——”“涂抹在志津香小姐的私处，那样见效最快，兰斯。”\n没有过多犹豫，兰斯钻进被子里，将药剂轻轻涂抹上去，虽然是极敏感的部位，但药效占据了上风。几乎是立刻见效，几声舒服的轻哼后，志津香总算是平静了下来。“兰斯，请先出去，我再准备施下回复术。应该能祛除她体内的毒素。帮我看着孩子。”\n接过库鲁库怀里的婴儿，兰斯靠在门外，有些疲累的他本想休息一下，但怀里因为见不到母亲而哭闹的孩子却不能让他如愿。\n大约五六分钟之后，门重新被拉开，“好了兰斯，比想象中的容易些，已经没事了。”应其话语而映入兰斯眼帘的，是蜷缩在被窝里，安宁地沉睡着的志津香。\n像是卸下了什么很重的包袱，兰斯顿觉有些脱力，顺势坐在了她的旁边。\n“谢了，库鲁库。没你在，本大爷还真的，不知道该怎么办才好呐。”“不是什么值得一提的事情。”\n“......”   “......”\n“库鲁库，何时来的？”“刚刚啊。”"
 als.166.a:0"你为啥会在这里！？"
 als.167.t:0"忧郁的魔法师 其一"
 als.167.d:0"当志津香睁开眼睛的时候，天已大亮。不再感受到那股香甜而窒息的燥热，只觉出一阵清凉的触感，一间轻薄的纱衣正披在身上。\n久违地重新掌控自己的身体，她第一时间感觉到的，是一股麻痹的反应，来自她的右手——床边睡得正熟的兰斯紧抱着她的右臂。\n一时间她有些厌恶的想抽出来，但没有力气。只得轻声唤起兰斯，“喂喂，你这变态还要压着我的手多久，快死开啦——”\n揉着睡眼，兰斯有些骂骂咧咧的撑起身子，“唔——明明昨天还赖着本大爷呢，一晚上过去就翻脸了。”\n“谁会赖着你啊，混蛋——唔，有点累。”\n不只是“有点”的问题，她连起身都没力气做到，只能老老实实躺在床上。兰斯见状便又不知好歹地贴了上来。\n“发生了什么事，啥事情能把你弄的这么狼狈嘞。”听见这句话，她似乎回忆起什么，背过身子，紧紧地咬住下唇。身子有些发抖。\n好像又被误解成嘲笑了，兰斯心说不妙。“到底出什么事情了，本大爷至少，总该有资格听听吧？”\n“是你造的孽呢。”“额，啊？”“那个被你放进来的占卜师，其实是想要把你抓过去啊。”“那，那个神秘兮兮的黑衣女吗？”\n她轻轻点了点头，“不知道为什么，她知道娜姬的事情，她，想对娜姬做些什么，我想去搞清楚。”“就这么和她扯上关系了？”\n兰斯把屁股挪到床尾的榻榻米上，这样至少能看见她的侧脸。“是被她掳去了，是吗？”“..只是...一招不慎...”\n“那人压根不是什么占卜师，她是个从圣杯逃出来的危险逃犯啊。“暗槛”，那是个以折磨女性为乐的变态魔女。你是怎么惹上她的？”\n察觉到兰斯在看着她，志津香尽可能地把脸埋在枕头里。“很担心她会对娜姬怎么样，所以，不由得开始调查她的底细。”\n“...还是被抓去了啊。”“呐，兰斯，这一段，暂且跳过行不行？”志津香清楚地记得那噩梦般的一个星期她是怎么过的，她本能的不想去回忆。哪怕是现在，小腹也依然在隐隐作痛。“没问题呐，昨天看到你的样子，完全能想象到遭到什么事了嘞。”\n兰斯深呼吸了一下，问出了一个极关键的问题。“那，那娜姬现在怎么样？”“把我救出来的，就是娜姬。”\n“最后几天，差不多已经要放弃了...在这个时候，娜姬追着她的足迹找上门来了。但没什么用，根本没法与那个老妖怪作对啊。可是，在最后的最后，恐怕，是直觉吧，在我脚下施放了传送陷阱。把我送出了魔窟来着。具体的，记不清了。”\n连兰斯都不由得愣了一下，在她还在躲避追杀的那段日子，也是这种差不多的陷阱把志津香送到了樱花岛。殊途同归。\n言尽于此，两人不由得陷入长久的沉默。良久，最先开口的是兰斯。\n“原来是这样吗，虽然并不觉得有什么问题但——稍微有点抱歉，对不起。”\n饶是兰斯，这次也少有地低下头，搞清楚状况后，连他也承认，这场无妄之灾很大程度上源于兰斯的一时疏忽。\n“...在骗谁啊。”志津香默默把被子盖过头顶。“唔唔，看来光是口头道歉很没——”“我到底在骗谁啊？兰斯？”“欸？”"
 als.167.a:0"这不是，什么都没做到吗。"
 als.168.t:0"忧郁的魔法师 其一"
 als.168.d:0"“果然，是因为娜姬吗？”兰斯能猜出来这个家伙泄气的理由。\n“我，保证过的，会把她从过去救出来，会看着她走一条只属于自己的路，当时我可是只对着你说了这些话啊，忘了吗？”\n“唔唔，小孩志津香说过的话，想也知道，根本就记不住嘞。”“算我求你了，要犯蠢也得分场合，好吗？”\n志津香呆呆地望着天花板。“可是啊，不知道该怎么做诶。我们真的长大了，既没有办法让她忘记过去，也没有办法真的保护她。最后只能眼睁睁看着她离开；甚至直到现在。除了玛丽亚，能够求助的人，居然还真只有你这个变态欸。”“...这是在骂谁呢。”\n没管气氛有多沉重，兰斯自顾自的笑了起来，“这有什么关系，只要惩罚那个魔女，把她H到不省人事，再把娜姬救出来就好了。”\n志津香没说话，只是再一次把头埋进了被子里。“如果担心那个家伙的话，说出来就好了。”兰斯有些无语。\n“蠢货，担心还用你说么。只是，有点后悔。发现了，哪怕她再喜欢着我，我也没法回应那种期待噢，我没有那种能力去保护她。”\n“唔，说话突然自暴自弃起来了...嘿嘿。”兰斯咧起嘴角，偷偷把手伸进了被子里。“...火爆破。”“不要在被里用这种危险的东西！”\n“果然无论过了多久，把你当成变态来看也完全不会有错。”“...还好意思说我，志津香也是，不一直都是脑子缺根弦的大傻瓜？”\n就算再怎么失落，被眼前这个孩子王嘲笑，还是不免很生气。“什么啊！明明自己才是个不会思考的呆子，你还有资格说别人吗？”\n兰斯点点头，“如果是说志津香的话，当然有。”“...那是因为娜姬——”兰斯俯身，把蒙着头的被子轻轻掀开，直视志津香的眼眸。\n“和娜姬没关系啊。你可一直都是脑子有点问题的样子。在西西里第一次见到你的时候不就是个什么话都听不下去的疯子么，为了报仇什么都听不进去。帮你把仇报了，却又偏偏跑去和一个恨着你的家伙纠缠不清。现在更是在为自己本来就做不到的事情发颠嘞。”\n“说的，也没错哎。”志津香以一个相当近的距离面对着兰斯，脸不禁有些发烫，最后只能泄下气来承认。“娜姬，只能拜托你了。”\n“拜托啥？她可是你妹妹啊，本大爷当然会把她找回来。”\n“...算我求你吧，不要用这种父亲才会有的口吻做保证啊。”“这有什么要紧？无所谓——”\n“哪里无所谓啊！”让兰斯完全预料不到的，志津香突然发起怒来。不知是不是因为生气，眼角逐渐透出丝丝晶莹剔透的东西。\n“能不能痛快点！就当是为了上我才要做这些事情啊？像以前那样自说自话地帮助我，然后逼我把身体献给你，这才无所谓啊！”\n被这个男人强奸过无数次，拯救父亲的愿望因他破碎了，恨不得生啖其肉的仇人被这个男人杀了。他夺去了她苟活于世的目的。\n被这个男人数次从劫难中解救出来，为自己报了血亲之仇，不计后果地帮助她挽回她唯一的妹妹。他给了她继续苟活于世的理由。\n现在，被他抚养，长大，成人，所以没法接受他为恋人，因为有着曾经不惜粉身碎骨也要为其复仇的血亲，所以更无法叫他父亲。\n“呐！兰斯，告诉我啊，既然没法成为你的情人，也没法成为你的孩子，对你来说我究竟该是什么？究竟能是什么？回答我啊！”\n......\n“莫名其妙的认同危机啊...还是只有志津香这种会钻牛角尖的女人才会在意的类型。”照顾她重新睡下后，兰斯叹着气将房门关上。\n库鲁库就靠在外面，怀里的孩子正熟睡着。“志津香小姐，暂时就留在这里，方便吗？”\n“当然，该走啦，你可得好好把事情原委说清楚。”兰斯甩甩手示意他的女人跟上。"
 als.168.a:0"这个问题，似乎很难完美的回答上来。"
 als.169.t:0"天国之心"
 als.169.d:0"没有为兄长的匆忙离去而感到失落，香姬应库鲁库的请求，特地为他们准备了一架返程的飞机。\n“没能在库鲁库小姐光临本国之时尽地主之谊，非常抱歉。”“为了如此琐事麻烦香公主，是我的不对才是。”\n“才待了一个多星期欸，本来想待久一点的。小香，别怪我嘞，实在是有些重要的事情。”“没有任何关系。”\n临行前，小香深深地鞠了一躬。“祝兄长，武运昌隆。”\n似乎是预料到他又将迈入险地——他的前半生一直如此。\n在飞机上，确认怀里的孩子睡安稳了，库鲁库开始慢慢说清原委。\n“教廷总部遭到了袭击，就在4天前，有一群武装分子潜入了梵蒂冈，几乎是以迅雷不及掩耳的速度压制住了大教堂乃至整个梵蒂冈宫，挟持了不少神职人员，目前不知道他们的目的是什么。恐怕现在也依然在和对方对峙着”“听起来有些难以置信。人数很多吗？”\n“并不是人数的问题。”库鲁库摇摇头，“有个，难以处理的威胁。让镇压工作变得异常棘手。”\n“我猜猜，是那个混账魔女，对吧？”“什么事情都瞒不过兰斯先生。”\n“毕竟，这事要和我没关系，你肯定也不会这么大张旗鼓的找上门来。”兰斯很了解库鲁库的想法。\n“来之前，专门和时钟塔那边交涉过。“暗槛”似乎在一百年前就已是时钟塔的重要人物——算是谍报方面的负责人。”\n库鲁库从怀里掏出来一张照片递给了兰斯。照片已经泛黄，似乎是几十年前拍的。\n“唔——不会有错，这个诡异的笑容还有星星眼。就是这个家伙。”兰斯粗略扫了一下便确认了其身份。\n“伟大战争期间，她兼任皇家魔术监狱的长官与MI5的情报官员，但似乎因私自与旧德意志帝国的情报部门做过某些交易，最后被革职并监禁。直到37年。她通过某种手段取得假释，逃出了不列颠。而现在，可以确信她正在罗马。藏在控制教廷的武装分子里。”\n“看见她了吗？”“没有——具体情况你亲眼去看应该比我解释要有用。”望着机窗外掠过的点点灯火。库鲁库淡淡地说着。\n在兰斯眼前，巨大的，象征着厄里斯教乃至整个天主教廷权威的梵蒂冈城，消失不见。若从天上看去，像是多出一块扎眼的疮疤。\n“喂喂！那是怎么回事？”坐在车里，兰斯仍在不住揉着眼睛。“看着像是消失了对吧，但实际上，这是某种魔法结界的效果。”\n一个大型术式张开了一道笼罩住整个宫殿的魔法结界，遮挡住了外界的视线。梵蒂冈，在某种意义上成为了消失的国中之国。"
 als.169.a:0"真是的，为什么本大爷要遇上这么糟心的事情..."
 als.170.t:0"核心所在"
 als.170.d:0"“真是的，咱怎么会遇见这么糟心的事情嘞。”在市政府大楼临时设置的紧急指挥所内，科潘叉着腰，翻阅着市警察局长的报告。\n“被一小群恐怖分子逼得要把军队调回，要是传出去，会遭人耻笑也说不定欸。”\n对“消失”的梵蒂冈的围困已经持续了整整5天，期间那不勒斯的魔法部队在结界边缘的多个部位打开了缺口，试图派遣警员进入大教堂解除结界，但派出的几队特警队伍在内部都遭到了来自不明武装分子的伏击，付出了惨重伤亡之后狼狈的逃出结界。多次突破无果后，罗马警局向上提交了一份报告，希望调集军队应对这一突发事态。\n“唔——除了仍滞留在德国的，本土是否还有部队可供调动？”科潘向台下的托斯卡纳理事长问道。\n“头儿你真想这么做吗？就算把正规军调进来也解决不了问题不是吗？”后者出言劝阻。\n“那还能怎么办？现阶段很明显光靠警察解决不了问题啊，对面很明显是受训武装，也许是佣兵，甚至可能是别国的战斗人员也说不准嘞。”科潘懊恼地挠挠头，“话说，教皇陛下那边到底有没有联系上？”\n“今天下午刚刚回复过来，似乎事变发生的时候她正在国外，说是正在全力往回赶。”身旁的副官翻了翻文件后如是说。\n“真是的，那个根本猜不透的家伙，自己的老巢可都被端了啊，这么紧急的时候她跑去国外干什么？”\n“因为要接一个重要的人回来。”库鲁库应声回答着。“重要的人？”“阁下也该也清楚的，兰斯先生，他有必须过来处理此事的理由。”\n科潘眉头皱了起来，“已经知道了吗，她们把小娜姬抓去的事情？”“他现在正在前线视察，似乎正在做进入结界的准备。”\n“那个家伙...算了，他想做的事情也没人拦得住，我们能做的应该是帮忙。”“诚如是也。”库鲁库鞠了一躬，由衷地表示赞同。\n“......所以，库鲁库，啥时候进来的？”“哦？刚刚。”“......”\n打破尴尬的，是台上急响的电话铃，“喂喂，是兰斯么？”“哦哦是你亲自接电话啊，库鲁库也在吧？”\n“就在旁边嘞......还是和以前一样一声不吭就出现了嘞。”\n“稍等，刚刚已经把电报发过去了。那家伙会帮忙处理结界的，哦，不如说，本来就应该她去解决才对。”\n同样恰到其时，一位文员拿着一张电文推开了门。“总理，来自梵蒂冈的电讯。”\n上面的内容与其说是电文，不如说，那是一张清单。\n一边挂着电话，科潘一边拿过这份清单仔细查看，“居然还有炸药，兰斯，这都是些什么？”\n“装备清单，本大爷可能要用上的东西。”“东西还真不少欸，兰斯，你打算怎么做？”“当然是做以前一直在做的事情。”"
 als.170.a:0"把他们都杀了。"
 als.171.t:0"游击战术"
 als.171.d:0"“报告！我们与负责教堂后方的防卫队失去联系！” “已收到，不要尝试支援，放弃第一防线，向教堂内收缩。”\n“报告！广场西侧发生爆炸，疑似遭到袭击。”“守住位置，刚刚已经有多个区域发生类似情况，可能是混淆视听。注意警戒？”\n“总部！总部！于大教堂东北方发现大批军警！”“再次确认，该方位结界是否已经被突破？”\n“不——没有了！没有结界了！该侧结界已经完全被破坏！重复！没有结界防护了！约50名以上军警已经进入。”\n“全体注意，圣彼得大教堂侧结界已经完全丧失机能，全体人员放弃教堂，向正广场集中，组织第二道防线......稍等。”\n“总部！请求立刻支援！我们损失惨重！广场守不住了！重复，正广场即将被突破！”“回答遇袭方位，他们从何处过来的？规模如何？”\n“不清楚！对面，对面只有一个人.....”沉重的爆炸声阻断了贝库多兰与广场的通讯，无线电中只剩下刺耳的爆鸣声。\n穿着厚重的盔甲，贝尔库兰狠狠地将拳头砸在桌上。沉默片刻，他扭头向桌旁的副官。“宫内还有多少能派过去的人手？”\n“没有了，团长，除开现在宫室内的技术人员，已经没有预备了。”副官思索片刻，说道:“不过如果只有一个人的话.....”\n“你，以及还留在宫室里的所有人，准备撤离，大厅设了通向城外的传送处，赶紧去，若结界彻底失效，那里就出不去了。”\n只有百余人参与了这次袭击梵蒂冈的冒险行动，过去2天虽然依托地利击退了政府方的数次进攻，但伤亡无法弥补。\n更何况，今天的战斗相比之前有着显著的不同——结界的失能，让防守战的压力陡增。还有就是.....\n“那位，大概就是“卡奥斯之主”本人啊。”贝尔库兰沉默地戴上头盔。\n“现在，联系‘暗槛’。”他对下属发出了最后的命令。\n“用不着哦，虽然离得稍微有点远，但只是传音的话还是做得到的。”魔女的声音顿时在大厅响起。“你这家伙原来听得见吗？也罢。”\n贝尔库兰将手一挥，室内的联络人员便相当迅速的离开岗位，逃离了这里。他的副官犹豫了片刻，也快步离开。\n“到底还需要多久，你保证过今天就能成事的。”“你还保证能在这守上一周呢。”“...别做无意义的争论，到底还要多久。”\n“封印刚刚已经解开了，但她被分解成了好几部分，还要分别解开这几部分的束缚才能拼起来带走哦，你这边还能撑多久？”\n“很可能——不，‘卡奥斯之主’一定在路上了，没有人能拦住他——最多一个小时。”“那还不够，可以多争取半个小时吗？”\n“......”“到底能不能，说句话。”女人的声音有些不耐烦。\n“‘暗槛’,改变计划，不用会合了，完事之后请你亲自带着她直接脱离，这边不再考虑接应。”\n“本来就不会管——喂喂，我可没答应过要自己帮你把她弄出去欸。”“所以说计划有变，对了，完事之后，替我给她带句话。”\n“不讲道理...行啊，什么话？”“骑士团长，黄昏的猛禽·贝库多兰，已死。”"
 als.171.a:0"确认室内已经空无一人，骑士拔出了他的宝剑"
 als.172.t:0"无暇清算"
 als.172.d:0"在一切完事的时候，外面的枪炮声依然激烈，诺瓦尔有点费力的将那个女人扛了起来。慢慢走出了地下室。\n虽然，可以立马离去，但稍稍犹豫了一下，她仍然选择折进教堂的大殿。倒不是出于情谊，而是某种未知的期许。\n正合她心里所想的那样，教堂的大门前，有一位男子刚刚走了进来。双方轻易的相遇了。“...呵呵，这不是兰斯君吗？为何在此？”\n与在兰斯城见到的本人不同，并未穿着那标志性的绿色甲胄，只有一套绿色的内衬。长剑收进了剑鞘里，身侧则挂着一副枪套。不知是不是因为之前的干系，亦或是她自己本身并无媚气。兰斯看见了她，并没有什么反应，竟少有的在等待对方先开口。\n“本来心里还有些许迟疑，想象着也许贝库多兰氏至少能与你周旋些许，不过看来似乎什么也无法拦住你。”\n“是说那个穿着铠甲的傻大黑粗吗？几合就杀掉了。”“那么，你要杀了我吗？”\n兰斯摇了摇头，“高低是个尤物，要杀你？那你得做些更伤天害理的事情，不过嘛...”兰斯捋了捋下巴，眼神中露出些许歹意。\n“这种事情，现在也是可以的哦~”\n“现在？现在不行。起码得先干正事。”说完，兰斯面无表情地抽出长剑。诺瓦尔也只好收起表情。“看来多少得打一架就是了。”\n“抱歉，我也是守信用的，有约在先，这个女人无论如何我也会带出去，你最好识相些。”魔女准备露出她的獠牙。\n“.....哈？”\n可是，听见此语，兰斯却露出了疑惑的表情。“你要带走什么和我没有关系。娜姬，那孩子在哪里？”\n“......”“唔？怎么不说话？”看着沉默的魔女，兰斯感觉到了什么，犹豫了一下，姑且把剑收了回去。\n“呃——在里面，随便放在哪个房间了，本来就打算顺便放回来的。”“唔？”“我没打算对她怎么样，不管你信不信，我没有伤害她。”\n说着，诺瓦尔突然皱起了眉头。“难道说你一个人杀进这里，只是为了那个女孩子？”“不然？”\n“娜姬——‘以前的娜姬’和我有些交情，虽然她闻着确实很香呢，但我姑且不想做昧良心的事。往里走，你搜一下应该就能找到了，她现在在某个房间里睡着大觉呢。”收敛起凶态，诺瓦尔重新摆出了一副慵懒的样子。\n预想中的战斗似乎被避免了，没再多说什么，兰斯径直走上前，擦肩而过。\n“不过，为什么要把她带走？”背对着那位魔女，兰斯突然停下脚步，问了最后一个问题。\n“她似乎什么都不知道，一直以为自己有个亲姐姐呢，一言不合就跑到我家里和我大打出手。真是的，某种程度上来说我才是受害者罢？想和她叙下旧事也是一问三不知，似乎完全忘记了自己干过什么。”说到这里，诺瓦尔的语气突然耐人寻味了起来。\n“还是说，我认错人了？那家伙不是切奈泽利之女——娜姬·苏·斯拉鲁，只是一个恰好名字差不多，长的又挺像的女孩子？”"
 als.172.a:0"无人回应，她转过身去，才发现对方早已离开。"
 als.173.t:0"祝福"
 als.173.d:0"当她醒过来的时候，映入眼帘的，是罗马城郊的夜空。\n从她恢复意识的那一刻起，全身开始袭来一阵阵钻心的剧痛，身体各个部位的神经被重新链接起来，心脏开始疯狂的跳动，随着血液重新开始流动，气管开始贪婪地向沉睡的肺部输送氧气。这一切都在给她带来无比的痛苦。\n当她终于得以喘息之时，她发现自己躺在乡野的草地上，沐浴着月光。\n“怎么样？好些了吗？”“......”被诺瓦尔拯救的女人，赤身裸体，在草地上挣扎着，喘着粗气，像是哮喘一般。\n不，也许，她正在贪婪的享受着，久违的，新鲜的空气，也说不准。\n“唔——看样子受了非同寻常的苦呢。”饶是救她的人，看到这幅模样，也不免的唏嘘起来。\n不知道过了多久，疼痛感终于散去，她重新触碰到这个世界。\n诺瓦尔倒是贴心，她随手一取，便从隙间里抽出一套短裙。“嘛，先穿上吧，看着也正常一些。\n仔细端详起她的面容，诺瓦尔不得不承认她确实比自己有吸引力，虽然顶着一头奇怪的白色短发，但眉宇间有股让人软下心来的温和感。可是，直视她的面容，却又有一股不可名状的诡异。\n没有向对方的施舍做出任何回答，抓过衣物，只是默默的将其套在自己的胴体上。\n虽然只有一套连衣短裙，尚不能脱离“衣不蔽体”的状态，但此时看去，倒也有股优雅的意味。对方依然沉默着，不发一语。\n不打算再和她继续打哑谜，诺瓦尔准备结束这次委托。“好了，我的工作，已经完成了。伊斯艾尔氏——你应该是这个名字？本来有不少人都参与了援救你的行动，不过他们现在似乎都凶多吉少。贝库多兰氏——许是你的朋友——组织了这场营救，不过他没能挺过来。继续往北走，走到离此地最近的港口，你的追随者们已经将离开用的船只准备好了——我该说的就这些了。”\n她跪坐在地上，似乎还在适应着外界，良久，她的喉咙上下蠕动，总算说出话来。“我该，去哪？”\n“嚯...还真问了这个问题——往东走，一直向东，如果你想的话。”\n“我该，回报什么？”“委托我的并不是你们，不过是有人想让你闹个翻天覆地。你知道这些就行了，快走吧。”\n简直惜字如金，她不再多言，只是撑着手，用力站了起来，颤颤巍巍地向远方走去。\n就在诺瓦尔也准备离去之时，那个女人突然回过头来，呆呆地看着这位魔女。\n她顿时觉出一阵天旋地转，脑海里似乎有人在低语。\n回过神来时，她意识到原来是女人对她说了些什么。可是，此时，竟已经看不见她的所在，如同原地消失一般。\n她说出的话语，乃是为拯救自己之人特意许下的祝福。"
 als.173.a:0"愿神，忘却你。"
 als.174.t:0"回忆·暗槛"
 als.174.d:0"1918年 10月28日  在基尔的会面，是诺瓦尔最后一次见到娜姬·苏·斯拉鲁。\n与她的接触并不是诺瓦尔的工作，她的父亲，切奈泽利·德·斯拉鲁才是计划的核心。他是德意志魔导器研发的重要负责人之一。也是最早几位计划叛逃的高级官员。尽管早有叛逃之心，他与伦敦的交流依旧极其克制与谨慎，不允许情报人员直接与其接触，以至于到了大厦将倾之时，MI6仍必须动用如此高级别的情报官员亲自出勤与他接触——甚至现在也只能接触到他的女儿。\n所以，诺瓦尔心情很差。她作为计划的领导，为了这个令人恶心的家伙忙活了长达两年之久。\n“斯拉鲁，现在的情况你应该也看得出来。”她不耐烦地敲着桌子。“帝国，已经完蛋了。现在不跟我们走，往后我不再能确保还能把你们引渡出去。要走就得趁现在。”她对面的女性，娜姬，一个高挑的冷漠女性，不为所动。“计划有变，我们不打算离开。”\n“给我个理由，起码得足够我向上交差。”“有人要来这里对父亲大人图谋不轨，我必须陪在父亲大人身边，我要杀了她。”\n“...这算什么理由，难道不应该立马撤走吗？我们已经准备好了，一艘驱逐舰就停在——”\n“父亲大人，爱着那个人，他要她成为他的妻子。他不可能离开了。”\n诺瓦尔狠狠掐了掐人中，“我不在乎你们那些繁琐的家事，刚刚的话，并不算是转告——也算是对你说的。娜姬，我和你，和你父亲已打了2年交道了，他要死随他去，我没义务为他解决麻烦。和我离开，我会设法让你跟着我做事，现在我这边最缺的就是人才。\n“话倒说的好听。”娜姬抱着双臂，发出几句冷笑。“就算想也知道吧，你们真正想要的，不过是我掌握的东西而已。”\n然而，诺瓦尔只是轻轻摇了摇头。\n“‘那个女孩并未掌握《魔兽化》的秘术’，我是这么呈上去的。娜姬，你很有天赋——无出其右的天赋！去他妈的切奈泽利，和那杂什的异术也无关系。我只是不想看到一个天赋异禀的年轻人留在死地！尤其是——以一个朋友的角度来说。”\n“朋，朋友？这句话从大名鼎鼎的恶之化身嘴里说出来，实在是滑稽的可以，你自己不觉得吗？”“那是我自己的事情。”\n“啧...别用这种长辈的语气对我说话。”“哼，妾身多少也活了两千年了，你也确实该把我当长辈一样看。”\n不知为何，尽管乐于见到她经营许久的目标去死，但她将面前素昧平生的娜姬视作朋友，许是出于怜惜，或是某种理解？这不得而知。\n“但是，魔想......只有她，她必须得死！她不配得到父亲的爱！我绝不会让她伤害父亲！我会，我会完美的守住父亲大人！”\n一改刚刚的冷漠态度，也许是感觉出对面值得让她交心，她不再掩饰目中的凶光。面对着称自己为她的‘朋友’的女人。她狞笑着，将恨意与杀意肆无忌惮的表现在诺瓦尔面前。“好意我心领了。但是，不要阻拦我，我要杀掉她，我要保护父亲......”\n诺瓦尔清楚，再说下去没有任何意义。“随便你吧，只是，能否答应我件事？”“但说无妨。”\n“《魔兽化》的秘术，很危险，绝不能用在自己身上。”\n“...这句话，从师傅那里，早就听过了喔。”“那就当是，一位朋友的请求？”\n“如果你执意把自己当作我的‘朋友’，我可以答应你。”"
 als.174.a:0"但对我来讲，“朋友”这个词，与“父亲”相比，那也毫无价值可言。"
 als.175.t:0"回忆·娜姬"
 als.175.d:0"1918年 11月1日  柏林  切奈泽利·德·斯拉鲁 已被杀害。\n娜姬·苏·斯拉鲁 被那个杀掉了父亲的杀手强奸，失去了处女之身。\n当她醒转过来的时候，她只看到了她的父亲大人的尸体。却没能看见魔想的尸体。是被带走了吗？\n不，娜姬很清楚，虽然，已经把她折磨到有进气儿没出气儿了，只差一步就能送她去和她愚蠢的父亲团聚了，但是，但是......\n似乎，没有杀掉她。在最后，被那个男人——横插一脚！不仅技不如人，甚至被那个家伙强暴了。但无关紧要...这些都无关紧要。\n父亲大人，死了，被那个绿色二流子一剑割开了喉咙。\n最后，也没能得到父亲的哪怕一句夸赞，眼睁睁地看着他被杀掉了。那家伙还有她的男友，也逃走了.....\n“呵呵呵......哈哈哈哈哈哈哈哈哈！”\n娜姬不理解，自己服侍着亲爱的父亲大人这么久，从小到大。为什么，为什么父亲的爱能够被一个痛恨着他，时刻想杀死她的家伙一下子夺去？就因为她姓魔想？就因为她长得像那个她根本没见过的，早早就死去的前妻？\n父亲用了10年，10年的时间告诉她，杀掉那个姓魔想的孽畜。然后，只是见了一面，一面，就命令她放弃。还想着要占有她？\n开什么玩笑！怀着只要杀了那家伙，父亲就会无可奈何的认可自己的想法，娜姬一直等待着截杀魔想之嗣的机会。\n然后，一切都结束了。父亲已死，她甩甩屁股离开了，徒留孑然一身的自己。好在，她还不至于要沦落到不明不白就死去的地步。\n要杀了她，要让她为父亲大人陪葬。除此之外，没有别的路可走，没有其他应该做的事情！\n她在地上翻滚着，嘶吼着，双手的剧痛传遍了全身，冥冥中，她似乎听见了生命如同颗粒从躯体中流失的沙沙声。\n勉强撑到痛楚消失，她看着自己的双手，已经长出了一副不属于人类的，尖锐的兽爪。她不由得欢喜地狞笑起来。\n魔兽化已经开始了么......还有差不多，三年左右。要在灵魂被刻印置换殆尽之前，杀掉她。然后，一切就都结束了。"
 als.175.a:0"无论要付出怎样的代价，魔想志津香，只有她必须死。"
 als.176.t:0"回忆·兰斯"
 als.176.d:0"1921年10月31日 西西里 夜\n“唔——虽然，差不多两三年过去，人比刚刚见到的时候性感了相当多啊，但是，手怎么变成了那样?”\n双手被捆绑着，兰斯仔细地把玩着娜姬那半裸露的胴体。他找到了娜姬，然后被她抓住了。因为想和娜姬志津香吃上姐妹盖饭。\n“居然就这么让我逮住了，很意外呢，有何企图，兰斯？”虽然清楚杀掉父亲的那一剑是兰斯挥出的，但意外的，娜姬对他并无敌意。\n“没办法嘞，志津香那家伙被你整的神魂不定。所以要想办法让你们和解，然后，双飞！”兰斯似乎根本没想过至少要掩盖自己的想法。“好了，安静点，要拿你当诱饵，把姐姐大人给引诱出来，你最好老实点。”“那肯定没办法，因为就是为了和你说上话才来的。”\n“和我说上话？”“是的，志津香那家伙，无论如何都想救你嘞，哪怕你一直试着伤害她。别再尝试去杀她了。”兰斯眼珠子转了转。\n“嘿嘿，本大爷很清楚的，你这家伙，其实一直羡慕着她吧？”“羡慕？”娜姬眼中掠过一丝细微的，迷惑的神情。\n“当然是羡慕有我这么个可靠的好男人啊！不过放心，我会把爱平等的分给每个女人的，到老子身边来，保准让你幸福起来啊。”\n“啊啊，那双兽化的手臂也不要紧，这才是亮点，性感又狂野的女人，这才是本大爷的菜啊。”\n“你这家伙，是喜欢上我了？”“不然？”\n“而且，天下的可爱女孩子都是我的，不应该自相残杀，更别说你们还是姐妹，所以，你俩别闹了，都来做本大爷的女人。”\n“呵...哈哈哈！也许吧，我，一直羡慕着她，也说不定呀。”明明是在笑，但她的眼睛里，充斥着憎恨，与悲伤。\n“有你在，至少有你在，她总是很幸福，确实，让我焦虑，让我憎恨啊。”她面对着兰斯，表情崩塌了下来，声音在颤抖着。\n“那天，我失去了一切，真的...什么都没有剩下。”那双兽爪因愤怒而发红膨胀。“要说还剩什么，只有愤怒...能将她燃烧殆尽的愤怒！”\n“要让她痛苦，要让她失去一切，要夺走她的全部，然后，痛痛快快的送她上路啊！”\n“够了。”树林的深处，传来一道清澈的声音。过去两年，她无数次听过这个清脆到甚至有些妩媚的声音，自然清楚声音的主人是谁。\n魔想志津香，平静的站在她的对面。“恨我的话，对我下手就行了，别把他人卷进来。”\n没有再多废话一句，她来的真是刚刚好，愤怒，憎恨，这些情感已经就位，无需再多言！"
 als.176.a:0"绝不能再让你苟活！"
 als.177.t:0"回忆·志津香"
 als.177.d:0"1922年1月1日 凌晨\n“娜姬！娜姬！听得见吗？”志津香抱起了娜姬残破的身体\n她的瞳孔正在迅速的失焦扩散。“啊.......”“可恶！难道说已经!”志津香紧紧地抱着她。徒劳地在弥补着什么。\n“好像，结束了欸，三年么.....太短了。”她的躯体开始迸裂，破碎的裂缝正在流出类似于沙子一样的东西。那是她所剩无几的灵魂。\n“求你了，娜姬！再坚持一下！”已经扩散的瞳孔，映出志津香心碎的表情。\n“开什么玩笑...在这个时候说什么都是你的自由吧，反正你拥有这一切，而我，除了父亲与魔法，我什么都没有。”\n“就算有什么值得活下去的东西，也早就被父亲夺走了啊。什么都没剩下。”身体的崩溃开始加速，她的消逝进入了倒计时。\n“唯一，被我保留下来的，是父亲夸奖我的时候啊，从小到大，那是我唯一视作珍宝的东西，唯一的......”\n“对不起...真的，对不起。我本来就是个混蛋，是个为了复仇不择手段的卑劣家伙...我和你一样，不，比你还更坏点啊。”\n“连父亲都被你夺走了，这个世界，确实有些不公平哦。穷尽一切钻研着魔法，只是为了胜过那个素未谋面的，有着友人有着恋人的，比我幸福千倍，百倍的混蛋姐姐。最后，却连父亲大人也没能守住...不能原谅，不可能原谅！哪怕杀掉父亲的不是你，你也得死！”\n“别再...做这种事情了！如果，这就是你我的命运.....”“如果，你真的有愧，那就，骂我几句吧，起码，让我能带着怨恨死掉。”\n作为对她的请求的回应，一行清泪落在了娜姬的脸上。“为什么，你要哭啊，太搞笑了吧？就连最后的请求也被你无视掉了吗？”\n“当然是因为悲伤啊！你是我的妹妹啊，是我存在这个世界上，能和这个世界维系起来的唯一的东西了！”\n“......”\n“有人，为了我的死，而流泪欸。父亲大人，会为我流泪么？应该不会吧。那个女人...让他的心坏掉了。”\n娜姬的声音，终于柔和了些许。“要是能有个家就好，没有什么魔法啊，战争啊，研究啊那点破事，哪怕在普通，如果能和某个人在一起，家人也好，朋友也好...能够在一起。算了......是时候去死了。”\n“不会...不会的！如果，这就是命运，那就让它重新来过！哪怕搭上我的命！就和你一样啊，我才不会苟活啊，绝对会救你！”\n“已经把灵魂交给地狱了哦，这个身体已经没用了——修不好了。这样就行，让我去吧。”\n“灵魂？才不是什么问题！”\n在她的耳边，志津香轻轻吟唱着咒语，两人被光芒笼罩着。“我的心，我的身体，我的——灵魂，都分给你。”"
 als.177.a:0"用我的一切，把你的一切，换回来！"
 als.178.t:0"切勿沉溺于回忆"
 als.178.d:0"“然后呢然后呢！”坐在床上，娜姬兴奋地扯着兰斯的衣角。\n“诶诶别急别急，马上就结束了。”兰斯挠着头，开始思考接下来该如何组织语言。\n“这个是你们这些学魔法的人才懂的东西吧？为啥要让本大爷解释的那么清楚......好像叫，分裂魔法来着？”\n“哦！我在书上看到过！记得那是只有Lv3的魔法师才能使用的强力魔法欸！姐姐居然这么强吗？”\n“呃，差不多吧，总之就是，你的姐姐把自己灵魂的一半分给你，然后，你们俩就都变成小不点儿了。开始不断给本大爷添麻烦。”\n呆在梵蒂冈宫内的一处卧室里，外面的枪炮声还在零零散散的继续着，但那已经与这俩父女没有关系了。虽然兰斯很困，但娜姬因为睡了很久，很清醒，而且很缠人。一定要听兰斯再讲一遍姐姐一直有所隐瞒的过去之事。所以兰斯揉着睡眼，慢慢回忆着。\n“你米拉库尔阿姨说,这是个相当复杂的大型魔法，成功率超级低的，当时本大爷都快吓死了。”“所以，是爱的奇迹？对吧？”\n听见此语，兰斯像是被这句话打了一巴掌，少见的陷入了巨大的动摇中。“啊！唔...那个，也许.....”\n娜姬鼓起嘴巴，开始了威胁。“要是兰斯也和姐姐说的一样，也打算用什么‘爱的奇迹’糊弄，之后就再也不理兰斯叔了！”\n“好吧，果然还是小鬼头欸...”本来，兰斯就打算把事情全部说清楚。不同于以往，这个家伙终于松了口。\n“ 那个时候，你姐姐爱我爱的死去活来嘞。也许就在那时候，一发入了魂，给她怀上崽子了。”“崽子？...欸...欸！！！”\n“你现在也大了，这么说你该能清楚究竟发生了什么吧。”虽未明说，但像是吐出什么惊天的秘密一样。兰斯如释重负地呼了口气。\n一个人，分出自己几乎一半的灵魂填充进另一个人的躯壳里，这本身是极不可能的事情，但若是还有一个人的灵魂.....\n故事到这里，总算是讲完了。娜姬沉默了许久，低着头，不知道再想着什么。突然，一只温暖的大手抚在她的头上。\n“怎么样，和你姐姐告诉的相比，本大爷的版本怎么样？好还是坏？”“...很详细...姐姐省略了好多。”娜姬脸上尚有阴霾。\n“最关键的是，姐姐只说过，我们之间因为一些事情本来互相看不顺眼...原来，我居然想过杀掉她吗？不理解。”\n扯着兰斯衣角的手，似乎攥得更紧了一些。“呐，阿叔？会不会，姐姐其实一直记着我对她做的坏事，只是不想说出来。”\n兰斯轻轻地摇了摇头，“我从二十多年前就在和你的姐姐打交道了，她绝对不是什么善良，温柔，圣母心泛滥的家伙，所以，她不顾一切地要救你，和圣母心什么的绝对无关。你的姐姐深爱着你，只有这点，我可以拍着胸脯保证。”那双手只是温柔地轻拍着女孩的头。“呐，所以啊，娜姬，能答应我一件事吗？”“...难道，是要做爱吗，在这！？”“虚头八脑的...你咋会有这种奇怪想法？”\n兰斯有些无语。\n“和你姐姐商量好的喔，虽然有些不甘心，不过未来会让你找到合适的家伙便宜他成婚，成为新娘子啊。”\n“那，那阿叔想要我做什么？”\n“无论发生什么，要好好爱你的姐姐哦，要永远相信她....别抛弃她。”\n“嘛，这需要强调吗？”“唉，再长大些，你慢慢就会明白的。”\n警告！前方疑似香艳内容！\n该段事件链为断章，决议栏目出现后为初期解锁内容"
 als.178.a:0"在因为无法挽回而后悔之前，至少要先学会珍惜嘞。"
 als.179.t:0"与志津香在海边！"
 als.179.d:0"“呐，兰斯，有兴趣陪我出去一趟吗？”已经大体恢复的志津香，向兰斯发出了邀请。“开玩笑，这不是废话么！哈哈！”\n他们俩个人去了一趟海边。但没有沙滩，只有礁石，海风倒是有，但是太强了。吹的脸颊生疼。实在不是什么约会的好地方。\n和那个家伙慢慢走在礁石岸上，志津香刻意避开兰斯猥亵的视线。与他保持着距离。“兰斯，还记得，我之前说的话吗？”\n“记得啊，那个相当奇怪的问题，不过，本大爷已经想好了，你是——”“不需要你想好，那个时候脑子烧糊涂了而已啊。”\n她冷漠地说：“现在已经想好了，本来就不是你的情人还是什么，几乎也不可能踏实地把你当父亲看吧？不，就是不可能。”\n“欸——唉。本来还想用这个问题做文章的，那时候志津香可是相当心慌意乱...焯！那时应该乘胜追击才是！”兰斯肉眼可见的郁闷起来。“唔——明明和志津香培养了那么久的感情，没想到是喂白眼狼的欸，早知道当年第一次H完后就该把你扔到一边欸。”\n“每次想要用稍微好那么一点的眼光看你，你便开口说话。”志津香摇了摇头。“果然不该...不，兰斯，我有话和你说。”\n“先说好，不准贴近，不准拿些混账话插嘴。不然打飞你啊。”志津香抱在胸前的双手慢慢放下来，她闭上眼，像是做了什么决定。\n“首先，是感谢，和以前一样，又救了我和她一次，虽然对你早就没有什么不切实际的幻想了。但是，不仅仅是这些东西。”\n“感谢你，一直在为娜姬当着，差不多等于父亲的角色。而且多多少少，也在用父亲的态度对待我吧？虽然是个纯粹的混蛋，但你，也确实挽救了我们的人生，无可置疑。”“欸欸欸！果然不是喂白眼狼嘞！感动感动！所以气氛都到这了，该来——啊！”\n兰斯被一记火爆破打飞出5米多远。"
 als.179.a:0"我刚刚才说的"
 als.180.t:0"所失之物"
 als.180.d:0"“虽然不想承认，但在20年前，在那个夜晚，我应该，确实喜欢着你。哪怕根本不愿承认，但我不想看见你死去，从那时起就在喜欢你。哪怕你已经好几次给我搞出麻烦。但你拯救了我，也结束了我的复仇。现在想起来，哪怕再怎么厌恶你，这段感情，也没法掩盖过去。”志津香的眼睛微微睁开了点，里面是她作为一个少女的温柔。“只不过，和娜姬的事情，似乎让这段感情，变得复杂了起来。”\n刚刚警告着兰斯不要靠近，但慢慢的，志津香自己慢慢贴近了他。“那时候，我确实非常慌张，爱情，还有一些不该有的感情掺杂在一起，我实在，实在搞不清楚该怎么面对你。但是，和以前一样，我不该逃避这段感情，我的逃避从来都只会伤害到别人。”\n“兰斯，能，稍微借用一下你的力量吗？只有娜姬可能还不够，多少还得算上你这家伙。我想尝试一下，只是尝试一下，在我的第二个前半生，好好的去找一找，在我的第一个人生就早早抛弃了我，也早早地被我抛弃的东西......叫做“家”的东西。”\n她轻轻地扑上去，在兰斯还在思考着这些话的时候，踮起脚，拿下了他的嘴唇。许是太惊讶，兰斯被这么一弄，带着她向后倒了下去。“哇塞——本大爷——被志津香——逆推啦！太阳打西边出来了！”茫然地坐在他的身上，摸了摸滚烫的脸颊，她鼓起勇气。\n“能把我的命运交给你吗？兰斯？”\n“可是，你不一直是本大爷的女人吗？不对！什么叫把你的命运交给我？你本来就是我的人了才是！我可一直在承担着你的命运吧志津香？比如现在！”嘿嘿笑了起来，兰斯的超级兵器进入了临战状态。\n他一把扑倒了志津香。“你这家伙，果然...不...这次就，随你便吧，你说的，也没有错。”\n志津香这时才意识到自己的失算。\n她面前这个猥琐的中年男人，早在那个晚上，面对着那对相依而眠的姐妹时，便不假思索地做出了决定。"
 als.180.a:0"他早已在背负着她们的命运。"
 als.181.t:0"苦涩的眩晕"
 als.181.d:0"当初，新官上任三把火，在最先颁布的法令里就有一条禁止宗教用品在全国范围内的使用。尤其是熏香，不过在今天，出于礼节，她少有地命令下属在会面室重新挂上了几盏香炉。她依旧没法适应这刺鼻的香味，那会让她重新回想起小时候在神学院里的遭遇。\n“我受不了了，他们一定要掐着点儿来见我们吗？”坐了许久，一位同样局促不安的内务部代表低声向上座的玛丽亚表达出不满。\n像是回应着他们的抱怨，门外响起一阵哗哗的声音，随着大门被打开。一位面容枯槁的老人，坐在轮椅上，被一位体型宽大的男子推进会客厅。他们披着绣金的圣袍，脸色有些紧绷。当男人在门口庄重地向她行礼，玛丽亚犹豫片刻，还是起身向对方回了礼数——这让随同的好几位内务部官员都面露难色。\n“很高兴你们能够安全抵达莫斯科，希望这一路上..”“咳咳咳...”轮椅上的老者痛苦地咳嗽起来，干瘪的身体带着轮椅发出了“咯吱”的响声。“我的大人。”作为替代，为其推着轮椅的男子恭敬地回应起她。\n“以圣父、圣子、圣灵之名...请允许我们再一次哀悼谢尔盖牧首的离去...‘在耶和华眼中，看圣民之死极为宝贵’。”\n“我们永远会记得谢尔盖神父为国做出的贡献...正因如此，我们想知道，现存的——仍然任职的主教们能否履行他们的承诺？”\n“咳咳...事实上，暂且没有心理准备。”轮椅上的老人稍稍从痛苦的咳嗽中恢复过来。“即使是在国内，很多同僚依旧奉着伊斯迈尔阁下为正朔...再者，陛下突然离去，很多人一时间难以接受啊，毕竟我们能够光临此地都还是沾了他的恩泽。”\n“托塔斯神甫，就由您——咳咳咳咳.....”他再一次痛苦地咳嗽起来。\n面对着内务部的官员，以及他的牧首，被称作托塔斯的男人从怀里掏出了一卷羊皮纸。“正如安罗恩主教所言。很多人对陛下的骤然离世感到恐惧，请原谅我们，我们自是希望站在真正的全俄罗斯牧首一边。但要说服我们的同僚，还需要再进一步。”接过羊皮纸，玛丽亚甚至没有亲自拆阅，而是一手交给了她的同志。\n“需要我提醒您，1937年您因‘煽动反集体化’被判十年劳改，直到开战吗，安洛恩主教大人？”\n“咳咳咳...”对方只是用痛苦的咳嗽来回应她的威胁。\n“我们没有讨价还价的打算。”挂着谦卑的微笑，男人温和地说着。“这份草案完全基于那位大人的谈判备忘，只是，我们相信上帝的力量，并不局限于几句祷词。”一位内务部官员简单地在纸上画上了几段重点，随后递回玛丽亚手上。“你提的请求没有什么意义，上到主教下到神甫，必要的时刻你们都应该参与保卫祖国的战斗。无需多言。”\n玛丽亚有些疑惑，不过心中稍定，他们只是希望当局允许神甫随军布道。\n“如果能在战斗中活下来，那么他们应当有在夜晚为军中的信众们布道的权力，想必，唔——圣座——应该也是认可的，不是吗？”他赔着笑附和着。"
 als.181.a:0"为了苏维埃祖国....."
 als.182.t:0"危墙之下"
 als.182.d:0"“叶夫根尼！我最后再重申一遍！如果你还要拦着我研究，你和你的主子就别想再靠我帮你收拾这些杂什东西！”\n“你这家伙！我也最后再说一遍！你干其他什么事情都无所谓！乌贼！乌贼！乌贼绝对不行！请你来不是让你搞什么乌贼人的！”\n科学家沃尔玛·摩托希迪教授愤愤地将手杖掷于地上，“你们从来都不肯去理解真理！乌贼，乌贼才是世界的未来！我这几天得到的报告无一不证明了这一点。在人体内展现出的污染特质与乌贼展现出了前所未有的相似性...妈的说了这么多反正你也听不懂啊！”\n被他怒骂的对象也是一点不打算让步，“这里是布尔什维克的心脏！能供应这么久的实验材料已经是感谢上帝了，你却拿来研究如何让人长出触手？”“这个项目多重要啊，多一只手当然会更方便。重要的是，看起来很帅。”“帅你姥姥，你这个蠢货！”\n随着几声沉重的敲门声响起，被称作叶夫根尼的俄罗斯人愤愤地拉开房门“谁啊——啊？阁下！”\n虽然托塔斯主教到来的消息已经知会过这个地下研究所，不过兴许是吵了一个晚上——完全不在意声音是否会惊动外界——以至于他们对访客的到来毫无准备。“托塔斯陛下！请原谅，这边尚未来得及收拾...”叶夫根尼低着头，像是告状一般抱怨着。\n“这个地方很安全，但是输送渠道最近出了点问题，而这个家伙又在不知节制地浪费实验材料......”虽然心有不悦，但这位身宽体胖的神官还是显出一副和蔼的笑容。“明白了，这个问题我会想办法，不过，当务之急是，推进的情况如何？”\n“这个问题，应该由我来报告阁下。”沃尔玛拄着手杖，随意地行了个礼。“嗯嗯，当然，沃尔玛教授，教廷很期待你的成果。”\n他领着主教踱过布满不明血迹与人体组织的暗红色地板。在数个装着内脏的培养皿间游走，一边开始絮絮谈起他的研究。“1916年的资料仅仅止步在污染于人体本身的临床表现上，而忽略了其局部反应。一方面，将人体分解之后，完全污染人类的器官也会继续保持活性——更遑论腐烂消亡，这一点和乌贼的再生性倒是有着关键的相似之处......”\n“教授，相比于“污染”的本质，我们更希望了解该如何妥善利用其无可比拟的传染性。研究的主次，您应该很清楚才是。”\n“哦...哦，当然，这并不难。”教授咂了咂嘴，“一般的污染方式是将块状污染体置入人体内，不过经过研究，我发现它可以实现某种气化反应——也就是说体外吸入也是可行的。虽然时间会慢上不少，但我们都知道，污染效应本身在大多数情况下并不可逆。”\n教授从怀里掏出了一沓文件，外皮似乎沾上了某种未知的黏液，接过文件的时候饶是主教本人也不由得皱了皱眉。\n“用这种方法，实现大范围的污染并非不可行。只是——”“但说无妨。”\n“我依旧没能弄清楚这个造物究竟该如何配制。”“...这个啊，这个不是我们应该担心的事情，会有人制备它。”"
 als.182.a:0"此乃弑神之术。"
 als.183.t:0"战壕中的枪声"
 als.183.d:0"安德烈蜷缩在积水的壕沟里，手指死死抠住胸前的弹链，军大衣里残存的甜腻气味让他有些恶心，那味道像是沾了铁锈味的腐烂蜂蜜一样。他记得很清楚，这是从几天前的布道开始的。随军神甫在给军中的信众们布道时总会点起一座香炉，这股恶心的气味便在战壕里安了家。不过就在白天那个满脸堆笑的神甫给炮弹送去见上帝了，所以这个晚上倒还安生。鼻子和耳朵都暂且得以歇息。\n自从在这里驻扎下来已经有两个星期了，与刚刚开战时的乐观估计大不相同，他们与敌人陷入了可怕的拉锯战，他所在的连队在头两天被打的就剩下四十来人，即便如此，那群资本主义匪徒依旧没能占到多少便宜，无尽的突击与反突击成了这一周的主旋律。\n“唔...是援军...”随着一阵杂乱的，像是军靴踩进湿泥发出的声音钻进安德烈耳朵里，他知道又有一批新兵进连队了。\n安德烈把头探出战壕，随着新兵到来的还有一支督战队——至少安德烈是这么认为的，这几天晚上有好几个潜在的逃兵给枪决了。\n说他们是“潜在”的逃兵，是因为他们的精神出了不小的问题，不听号令，不理旁人，大多数时候只会在某个地方自言自语。\n“哦！又有个倒霉鬼。”安德烈略显兴奋地把手也搭了上来，有一个矮胖的，衣衫不整的人被两个人从战壕里拖拉了上去。\n为首的军官冷峻地看着那个已经是一副逃兵装束的家伙，哪怕问了几个问题，对方都低着头，嘴里不知在吟喃着什么。\n连里已经出了好几个这样的准逃兵了，安德烈正如此想着，一声枪响打断了他的思绪。没有麻烦行刑队，那个军官干净利落地朝他的心窝来了一枪。\n那个可怜的男人似乎有点惊讶，他一阵踉跄，低下了头，望着汩汩流出血液的胸口，又抬起头，疑惑地看向还冒着蓝烟的枪口。\n......\n他依然站着，似乎并未理解刚刚发生了什么。他最终都没有倒下去......他还活着，他并未死去。\n安德烈惊恐地目睹着这一切。他看到那个军官似乎笑了起来，还拍了拍对方的肩膀，似乎从未给过他那一枪。\n军官挥了挥手，两个士兵将他领走，他像一个醉汉一样摇晃地一步一步走开，流到身下的血拖了整整一路。\n安德烈脚一滑，一屁股摔进了战壕里，他没由来地感到一阵极度的恶心。\n好不容易定下神，那股甜腻的熏香味又钻进了他的鼻孔里。"
 als.183.a:0"于是，他把今天吃的本就不多的东西全吐了出来。"
 als.184.t:0"罂粟花园"
 als.184.d:0"“唉！同志！他已经整整七十岁了，患着腰痛......别说扛枪了，他不可能跟得上那群小伙子的。”\n当政委格里高利带着几个战士，准备走进烈辽科夫·巴科夫的小屋时，隔壁的一位老妇人拉着他的手已经劝了一路。\n“老太太，这是我们的工作。征兵处点名要他，他是个老军官，能统兵，我们现在需要这些人。”也许是自觉理亏，也许是不好对着一位老太太严厉。格里高利耐心到不厌其烦的向她解释。\n“还带兵呢，同志。是，他在白军手底下干过，兴许还打死过几个同志，但那个时候的事情谁说得清呢？他实实在在是个好人，下了工甚至还经常来农庄帮忙呢，哪怕他干过什么伤天害理的事情，现在上帝也在惩罚他啦，同志。他原来那身手多利索，力气多大啊，在厂里一个人能干两三个人的活。现在躺床上爬都不好爬起来。哪天下了床想走几步就得捂着腰缓上好些时候。就这个快瘫在床上的老头子，你们把他送去战场，这和送他去死有什么区别？”话说得急了，老太太开始揪起军官的衣角。\n“唉，这样吧，老太太，如果他真的想你说得几近瘫痪，我们就跟上头讲这人快死了，好吗？”\n老太的话似乎奏效了，政委点了点头，最终还是有所妥协。\n他示意随行战士守在门口，自己上前慢慢推开了木门。吱吱的响声甚是刺耳。更显得屋内的死寂。\n慢慢拨开用一层灰布做成的内帘。他就躺在那个比原就狭小的客厅还要偪仄的小房间里。格里高利看见他时，不禁后退了几步。\n超乎他想象一般壮实的体型。甚至可以用庞大来形容。但看着很圆润，光看外表也不能将他和大力士联系在一起。他侧着身熟睡着。偶有动作就会压着那狭小的木床发出刺耳的响声。想来也许是熟悉了这木制品特有的异响。他才无意间忽视了格里高利推门进来的响声。因为听见帘外的脚步声时，他便醒来了。他的听觉并不迟钝。\n“皮古？现在不成，今天疼得厉害，我再躺一会儿。再等会儿。”他侧着身子，随意地应付着外面的脚步声，但当他听清楚离他越来越近的是沉重的军靴声时，他慢慢从床上撑起来。看清楚来者的时候，他的表情变得相当复杂。"
 als.184.a:0"终于来了吗..."
 als.185.t:0"踏上旅程"
 als.185.d:0"格里高利能够理解为什么一个和他算不上熟络的老妪也不忍看着他上阵了。那是一张典型的被病痛扭在一起的脸。漫长的岁月和寒风一起讲他的脸刮得满是褶皱。眼神也没什么光彩，倒是将疲惫的神情勾勒得入木三分。\n两人相对，一时竟无人开口。烈辽科夫只是默默地将双手伸出来，束在前面。\n“我不是来逮捕你的。”\n“那，直接枪毙我吗？”\n“忘掉以前那些事吧，现在祖国母亲需要你。”\n“......”“根据联盟第224号命令。木之本主席要求每一位有过作战经验的退役士官即刻入伍，不论年龄。巴科夫同志，现在是祖国最为危急的时刻。我相信在这种时候不会有人再拘泥于过往的立场问题的。我们失去太多人了。”\n“我还能干些什么？”他看上去没被这番话所打动，只是默默地低下头，看着和他的脸一样饱经风霜的手背。\n“说实在的，我不知道......如果你就这么躺下，我觉得，你应该也上不了战场了。”格里高利是从火线上负伤撤下来时接到这个任务的，他并不是在说假话。一代人，一代人的牺牲已经不足以为苏维埃赢得胜利了。但又正因为如此，他又不忍心让原本不用上火线的老人去送死。哪怕面前这位老人年轻时曾是祖国母亲的死敌。\n老人摇了摇头。他那与他的身形一样粗犷的左臂死死撑在床沿。慢慢地站起身来。尽管如此，但格里高利依旧没有怀疑刚刚那位老妪所言的真实性——只是站起身来，他便已经在喘着粗气。\n没再抱怨什么，他反而笑了起来。“这样的话，无妨，需要我干什么，我便干什么就是。我会去哪？”\n“实际上，不会去哪，现在最需要人的地方就是这里，木之本格勒，现在战线离城区也只有百来里了。”"
 als.185.a:0"也好，这里依旧是我的去处。"
 als.187.t:0"昨日芒刺"
 als.187.d:0"“巴科夫上校，哈？”看着慢慢走进军帐的老人，驻守在最前线的近卫第四步兵师师长有些怀疑地问道。\n“是的，将军同志。”烈辽科夫摘下帽子，严肃而庄重地行了个军礼。但略显佝偻的身形显出他依旧在被病痛困扰着。\n“虽然电话线被炸断了，但亲自穿越炮火赶回指挥所的团长可不常有——或者说根本没有。”\n师长并没有给他好脸色。“你的部队已经开始溃退了，现在你负责的位置出现了一个极大的缺口。你最好给我一个合理的解释。”\n“不是溃退，我命令士兵们撤退。”烈辽科夫瞟了一眼周围的人。继续正色道。“事实上，我有极其重要的情况需要反映。”他沉声说着，语气不像是请求更像是某种威胁，这让师长对他的印象更差了。\n“我知道你从哪来，上校，现在看来那道命令确实是我们的不幸，让你们这些老掉牙的家伙重临战阵，还——搭在如此重要的位置，反映你那该死的情况吧！趁着情况还没有变得更糟之前。”\n“不止我的团，其他部队的秩序都在崩溃，污染情况完全没法忽视了。”完全没有理会对方的斥责，烈辽科夫沉声说着，“没有检测污染程度的设备，就没办法区别出完全污染者。也没有驱动污染者的人。这不能为我军带来战术优势，反而在将部队带向混乱的边缘。”烈辽科夫的胡须微微翕动着。"
 als.187.a:0"你到底在说些什么？污染？编理由也得能让人信服才是。"
 als.1871.t:0"迫近之物"
 als.1871.d:0"“...现在不是自欺欺人的时候，将军同志。”烈辽科夫摇了摇头。“师内已经明显出现了污染现象。我的团里已经有一百多个人完全污染。我们能有序撤退，也多亏了他们...直到现在我都认为他们是作为武器被投入前线的。但灾难正在扩大。”稍稍放下了克制，老人的声音开始夹带愤怒。“上任的第一个晚上，我亲眼看着内务部的同志用枪弹鉴别污染者。他们似乎完全不清楚该如何筛选合适的士兵。甚至放任污染现象渗透进正常的战斗人员里。作为你们曾经的敌人，我没有立场反对你们利用此物的计划。但是如果你们甚至没有意识到这一切的存在...”\n“我只看见一个贪生怕死的贵族军官抛弃了他要保卫的阵地、国家与人民！”\n师长反而被这番话整得有些发晕，只能梗着脖子先把帽子扣上。不过这也让烈辽科夫多少意识到他的长官确实对此一无所知。\n“......失礼了。”烈辽科夫像是弥补自己刚刚的失态一般，沉默地戴上了军帽。“如果这一切确是我的失职，我会承担一切责任，但是，我希望您好好下到连队了解情况。尽管这很危险。另外，鉴于我刚刚所说的理由，死守此地已经不是一个明智的选择，抛弃依旧还守在阵地的污染者，尽快向后撤才是上策。”“如果真的要撤离，那又该怎么鉴别正常的同志？”\n“您相信我的说辞了吗？”“话毕竟已经说到这种地步了。”“......现在用不着鉴别”"
 als.1871.a:0"污染者.....已经不会再撤退了。"
 als.188.t:0"屹立之影"
 als.188.d:0"“没想到我们会这么快见面，政委同志。伤养得怎么样？”烈辽科夫轻轻笑了几声，面对着两个月前将他从病榻拉起来的年轻人，他过于壮硕的身躯挡住了身后直射的阳光，洒下的投影将格里高利包裹其中。\n“差不多了——您的精气神和那时候也完全不一样了，我也完全没想到...将军？”“算不上，暂领其职而已。”烈辽科夫回头看了看正蜂拥驶进木之本格勒城区的一辆辆军卡。“或者说，暂时由我来收拾这堆烂摊子。”\n两人一时无言，不止他们，现在所有仍停留在此的指战员都意识到这个事实——战火即将降临在这座由主席的名字所命名的城市。\n“我记得第四师师长原来是安德罗波夫同志，他阵亡了？”“没有，他被召回去述职，在火线上被拖了回去。”\n“为什么？”烈辽科夫没再回答，只是示意他看向身后。一队人快步走了过来。\n“巴科夫将军，我能如此称呼你吗？”“第四师步兵第二团团长烈辽科夫·巴科夫，同志，目前只是由我临时指挥撤退而已。”\n“你以前是，这就够了。”来者——为首的一位军官有些不客气地说。“上面，有些问题想要问你，你最好谨慎些回答。”\n“据称是你的擅自提议导致第四师突然后撤，进而引发了一系列的连锁反应，致使全军的战线后退。你有什么要辩解的吗？”\n“我判断目前的战斗人员无力再组织起有效防御，更关键的一点是，除了直接撤退，没有其他办法将污染者与普通士兵分割开来。”\n“你口中所谓的“污染”究竟是些什么？”“现象，或者说某种武器，被污染的人类会失去战斗，乃至生存的欲望，但是身体强度会得到极大的提升，在以前，这种手段被用来组织突破防线的特殊部队，但是发生在我部中——我猜也正发生在全军之中——的污染现象并没有人为的控制，宝贵的士兵正被转化为没有思想与感情的污染者。”烈辽科夫平静地回答。"
 als.188.a:0"现在，他早已清楚说出这些话后他将面临什么。"
 als.189.t:0"风暴之前"
 als.189.d:0"“你刚刚说的这些话足以按蛊惑军心论处。你真的要我用这番说辞回应莫斯科的质询吗？”为首的长官看上去并无动摇。\n“无妨，这也是没有办法的事情。我也不认为如今的指挥层有人对这些东西有所了解，这些原本是绝密。”\n上校——或者说曾经的老将军看了看旁边的格里高利，像是下定了某些决心。\n“我本人可以为此做证，卑职曾在1916年指挥过类似的污染化军队，在对多瑙联邦的战争中。”\n“我很清楚这些东西是什么。如果有需要我可以自己去莫斯科回答她们的疑问。”他摘下了军帽。严肃地，一字一句的为自己作保。\n“1916...不会是那，那场‘勃鲁希洛夫攻势’？”这名年轻的政委震惊地听着这个对他们来说已经相当久远的名词。\n“事实上，我确实曾有幸跟随勃鲁希洛夫将军冲击日耳曼人的加利西亚防线。”老人没有沉浸在回忆中，“这是极其危险的信号，其可能导致的灾难会比敌人带来的战火更甚。”他的答复总算令前来质询他的几个人面面相觑，不知如何回答。\n“好了，无关的谈话已经够多了。”为首的军官摇了摇头。“我们不是来问罪的。你的见解我们会反映至中央。而您，将军同志，哪怕是现在，这个称谓也已名副其实。来自中央的调令。您正式被升任为第62集团军司令，授上将衔。同时全权承担此城的卫戍工作。”\n“那，策应呢？”\n“友军大部部署在更北方的伏尔加河畔，据我所知，其余部目前还没有加强城区的计划。”\n“也就是说，要用一个损失严重的集团军死守这座城市？”"
 als.189.a:0"是的，并且寸土不让。"
 als.190.t:0"污染人间"
 als.190.d:0"“真是的，他们要做到什么时候。”看着在战场上忙碌的神官，米斯达颇有些无聊地对着同属这片辖区的老朋友乔鲁诺抱怨着。\n“没有这群神官，这几天我们完全能直接前进到木之本格勒城下。结果在这里浪费时间。”“毕竟这是很严重的事态，教廷现在恐怕如临大敌。”乔鲁诺看上去远没有米斯达那般轻松。“我的部队里也出现不少污染率超过60%的人了，因为这种东西造成战斗减员太不值当，前方不经过处理不能再贸然前进。”“你是说，罪魁祸首在敌军的阵地里？”“恐怕是这样。”他盯着远方一处弹坑，一位穿着防护服的神官在将一个身形残破不堪的活人硬生生塞进一个巨大的收纳箱里。\n“对面应该是爆发了相当严重的污染。甚至突入他们阵地的我军士兵也受到了影响。”\n“他们是在有意利用这些不死人吗？”米斯达挠了挠头。\n“看着不像，如果他们依仗这些人组织防御，战斗恐怕会更加艰难，但敌军撤退得很急。似乎有意要和他们分开一样。”\n“我是不了解这些。”米斯达叹了口气。“看上去教廷似乎对应对这种情况相当熟练，你说，不会是我们的人干的吧？”\n“不会，教廷熟悉这种情况，据说是因为二十多年前曾经有人试图利用这种秘术对教廷本部发动恐怖袭击，当时闹得人心惶惶。”\n“话说回来，最近教廷确实被袭击过来着。记得甚至惊动了还在德国的占领军。唔——会不会和这有什么关系呢？”\n乔鲁诺捋了捋下巴，也开始思考起两者关联的可能性。“也许...但这不是我们该去想，也不是我们能想明白的事情。”\n在他们眼前的，是那场进攻作战抵抗最激烈，也是最后的一处敌军阵地。战壕里，弹坑里，布满了苏联士兵的“尸体”，但用“尸体”来形容他们已经不太准确，大多数人倒在地上只是因为丧失了行动能力——有的被打穿了脊椎，有的被炸得只剩下半截身子。有的被射穿了后脑，在地上抽搐翻滚着，发出浑浊的声音。\n他们毫无疑问还活着。并且，已经永远无法死亡。"
 als.190.a:0"他们的灵魂，被永久囚禁于现世。"
 als.191.t:0"引导者"
 als.191.d:0"“那么，开始今日的主教会议吧。”穿着一身宽大的长袍，托塔斯主教点燃了桌子中心的煤油灯。\n入夜的莫斯科一片死寂，而几位代表着东正教廷权威的主教秘密地在一间民房里开始了例行的主教会议。\n昏黄的煤油灯中，最先开口的是最年轻的，来自喀山教区的主教代表。“陛下回归的时间必须提前，现在内务部已经开始清查军队内的兄弟们了。计划看来已经接近败露。”\n“嘿嘿，不要紧啊。”阴暗处有人怪笑起来。“内务部部队也好，城内的卫戍部队也罢，都已经有不少人成为污染者了，只是，如果起兵太过仓促，也许没有办法夺取控制权耶。”\n“所以，为什么会这么早就被发现了，按理说，他们对我们掌握的东西应当一无所知才是。”有人愤愤地抱怨着。\n正当众人讨论得愈发激烈，一阵剧烈的咳嗽声镇住了他们，那当然来自枯坐在轮椅上的老主教安洛恩。\n“那个小东西，重新启用了一批老白军，哪怕保密得再好，但毕竟有人亲眼见过污染人类啊。这是我们根本没有预想过的事态...咳咳...必须做最坏的打算，虽然现在污染的程度还不够，但已经没办法继续深入了。要赶在红军高层清除军队里的污染者前动手。”\n接过安洛恩主教的话茬，主持着会议的托塔斯主教撑着桌子站了起来。“沃尔玛教授那边，已经取得了突破性的成果，用气体实现大规模的高速污染已经证明可行。”\n“意思是，除开扩散诅咒以外，已经有其他办法大规模散布污染了吗？”那位抱怨的代表看上去很是惊讶。\n“在海外试验过了，考虑到卫戍莫斯科的部队里可能也会有魔法部队。这个办法应该会比耗时耗力还要多加防范的扩散诅咒更有用。”\n他们兴奋地讨论着计划应该如何进行，丝毫不在意他们正准备把整个莫斯科以及它的人民当作牺牲品的事实。"
 als.191.a:0"......"
 als.192.t:0"缓慢牵动的齿轮"
 als.192.d:0"“非常不错，水果三明治，感谢您的款待。”库鲁库慢慢将手中的三明治送入嘴里，又轻轻抿了一口主人为其特地准备的红茶。\n“呐！呐！是吧？要说下午茶，没有水果三明治可不行。”千早爱音为有人理解她的品味而高兴。“...在意大利也有这东西呢。”\n在伦敦总警监，千早爱音的私宅中，两人正在喝下午茶。\n“要是没有你们，恐怕饭碗都要保不住了。”远没有其他的伦敦淑女那般得体，爱音一股脑将温热的茶水倒进腹里，狠狠地吐了口气出来。“苏格兰场也好时钟塔也好，对这些怪东西全都束手无策呢。”爱音惬意地笑起来。\n“这场国事访问是科潘大人主持的，要感谢也得感谢她们，我们不过暂且随行而已。”“是吗...结束之后也去好好感谢下她吧。”\n在意大利对圣杯王国进行国事访问的当天，伦敦爆发了一场恐怖袭击事件，金融区周边遭到了毒气袭击。但随行的也有代表意大利天主教廷的神官，在她们的努力下，最终没有人员伤亡。\n“虽说是毒气，但反而不会致死，甚至会让人不死，总觉得不是坏事耶。”“千万不要有这样的想法，千早小姐，污染的原理是让人的灵魂受污，直至完全无法进入轮回。被害者会沦为没有感情没有希望的躯壳，某种程度上来说这比死亡更加危险。”有些严肃地说完这些话后，库鲁库的神色又缓和了下来，显出一副温柔的面孔。“所以此次没有出现完全污染者，这是再幸运不过的事。”\n“还是得感谢科潘总理的果断。”“说得没错，千早小姐。”两人将杯中的红茶一饮而尽。\n“呜呜呜.....一联想到接下来会发生什么，现在听着下面那俩个人夸我还真不自在——”趴在房子的阁楼上，科潘冬深深地叹了口气。"
 als.192.a:0"我怎么摊上这种事情啊..."
 als.193.t:0"强健库鲁库大作战"
 als.193.d:0"“喂喂！小点声，别被她们听见了。”在她的身旁，兰斯将耳朵贴在天花板上，饶有兴致地窃听着谈话。\n兰斯的原定计划是和这位传说中又唐又可爱的警花H，但途中知道后者就年岁而言有点熟过头了，遂暂时放弃，但随着库鲁库受到邀请来到此处，该计划旋即修改为“袭击库鲁库大作战”。\n至于拉着科潘冬一起，那是因为他相信要是被伦敦警察逮住之后，科潘冬能够使用特别的“治外法权”帮助他脱离桎梏。\n“都说了没有“治外法权”这种东西！”“那种事情怎么说都好，反正吹风的事情就交给你了。”科潘就这样无可奈何地上了贼船。\n“好久没有和库鲁库H了，这次可是少有的库鲁库不作为教皇的样子出现呢，连孩子也没带。Yes！就趁着这股松弛劲，准备上了，科潘冬！”兰斯轻轻钩开了天窗。\n“我去厨房再打一壶茶过来。”“嗯，拜托了，千早小姐。”\n爱音刚刚折进厨房，一团绿色的东西就从楼上蹿了下来。动静不小，爱音几乎是立刻又折了出来，然后她看见的是——\n穿着便服的库鲁库被推倒在地上，“唔——兰斯，这里还有别人...”“就是有别人才有感觉嘞！本大爷可是好久没有和你做过了。”\n兰斯狞笑着掀开了库鲁库的裤子，露出的白色胖次惹得兰斯兽性大发。“这样吗...好久都没有...只能请兰斯温柔一点了。”库鲁库把脸埋了起来。“嘿嘿放心，本大爷可是很有分寸的。要上啦！”\n亲眼看见强健场景的爱音理所当然地尖叫起来。“你你你你！你什么时候进来的！这这这！这不是科潘殿下吗！？为什么！？这个，那个，你们在干什么啊！！！”\n兰斯被女高音吵得烦了，回过头来露出猥琐的笑容，“哎呀，别喊啦，搞完她就轮到...”"
 als.193.a:0"然后，两人的视线就此相对。"
 als.194.t:0"为过去所灼伤"
 als.194.d:0"“...为什么你会...你是...”爱音不自觉地往后退了几步\n两眼的瞳孔开始收缩，爱音的脸色从惊吓逐渐变成了惊恐。“你是...你是来...”\n“...”兰斯望着连连后撤的，那位被吓得花容失色的伦敦总警监，不发一语。\n“是吗...果然，你是来...你真的是...”\n“...科潘，我们走。”兰斯站起身来。\n“欸?!现在，在这里?就走了？”科潘不安地看着兰斯突然沉默下来的样子。“啊啊，没兴趣了，走了。”\n留下惊诧的爱音与不解的库鲁库，兰斯拉着科潘冬的手，又如风一般快步离开了此地。\n“到底，到底怎么回事！？”架着备好的牛车，科潘不安地问躺在车后的兰斯。“你，你认识她？发生过什么吗？”\n“不认识。没见过这号人。”“那为什么...”\n“只是突然就没有H的兴趣了。”“...不要紧吧？你看起来...”"
 als.194.a:0"没什么，没由来得有些火大。"
 als.195.t:0"战前会议"
 als.195.d:0"木之本格勒，在一座较大的双层民房内，士兵们正在里面忙碌着，此地是临时设置的战时指挥部。\n趴在房子的木窗上，一个女孩子默默看着房间里面人来人往的样子。她的动作吸引到门前卫兵的注意。\n“小姑娘，其他人都去渡口了，这里也不安全。你呆在这做什么？”他俯下身子，和那个小小的，长着一头淡蓝色短发的女孩交流。\n“烈辽在里面。”女孩似答非答的蹦出来一句话，她指了指房子里面，那个老爷爷正倚在长桌边。在和其他人讨论些什么。\n“是熟悉的人吗？”“是。”战士摸了摸女孩的头。“大人们在讨论很重要的事情，可能需要等很久。”“那我等。”\n“情况很严峻，虽然敌军进展缓慢，但恐怕在至少两日之内，他们就会逼近城区。”接替了安德罗波夫将军的，一位新的师长面对着他的新上级抱怨着，毕竟交到他手上的是一支残破的步兵师。“我部现在得到的补员极其有限，整个集团军要面对敌军三到四个军，整整十五万以上的兵力。光靠62集没有办法守住整片城区。”\n烈辽科夫没有对他的汇报做出什么反应，而是沉静地看着城区的地图，只是随口回复了一句，“继续。”\n“加快民众撤离的速度，现在不应当再让他们参与防御工作，将他们尽快渡至对岸，然后放弃自马马耶夫一线以南的城区，全军收缩至北部的工厂区域。这样才能掩护群众撤离。”面对这个提议，烈辽科夫抬起头来，“大部可以采纳，让所有民众撤退，马上停止城内所有生产工作。如果出现最坏的结果，全军至少要撑到非战斗人员全部渡过伏尔加河的那一刻。”烈辽科夫沉吟片刻，向众人继续阐述自己的想法。“但是，如果彻底放弃南郊，意味着马马耶夫失去了一道重要屏障啊，哪怕从其他防线分出人手来也必须设防。”\n“由我带着第4步兵师，再抽调两个装甲旅。在火车站至马马耶夫一线组织防御，藉此拱卫高地。”“唔——您亲自？”“我将指挥部设在马马耶夫岗。如果大势已去，我会成为站在高地上的最后一个人。”若是由别人来说这番话那多少有点吹嘘的成分在。但烈辽科夫沉重而不容置疑的腔调让这番话真正显出一副背水一战的态势。“至于其他人，根据我接下来的安排，便宜行事就好，如果我部与你们失去了联系，那么你们自行推举接替我的指挥官——我迟早会死在这里。”\n说完这般话，他颇为费力地坐回椅子上，稍有些松弛的眼神瞟见了那扇窗户——女孩也意识到他看到了她，向他使劲地挥手。"
 als.195.a:0"唔...她还没走吗。"
 als.196.t:0"陨落国度"
 als.196.d:0"“烈辽...烈辽！”女孩跑到他跟前，笑着抱住了他的膝盖。“你还没有走吗，小皮古？”那只粗大的手抚着女孩小小的额头。\n“因为，找不到烈辽啊。”皮古的脸轻轻在腿上蹭着。“家里没有找到，厂里也找不到，柳赫大妈说烈辽又去当兵了，就去找当兵的人，找了好久，今天找到了。”紧绷了数天，此刻这位老将的神情终于完全垮了下来，他又成了那个被腰痛折磨到走一步路都得喘上好几下的老人。\n“烈辽走得很急吧。”“因为没有来得及告诉你吗？”“因为你没拿走剑啊。”皮古抬起头看着他饱经风霜的脸。 “盔甲也没拿走，剑也没拿走，不过那把弯刀倒是拿了。”“去当兵只有那件东西有用啊。剑早就钝掉了。盔甲也用不上。”\n听到这些话，皮古有些失望。“噢，看不到烈辽拿起他们的时候了。”“唔...等下我回去拿过来吧，很重，你也帮我拿噢。”\n“好耶！”皮古又笑了起来。全然没有意识到老爷爷的眼神正在黯淡下来。\n“皮古，在那之后，你能离开吗？”\n“为什么要离开？”\n“为什么要留在这里呢？”“因为？要跟着烈辽。”\n“我会死在这里哦。”“那就等烈辽死后再说。”\n烈辽科夫轻轻笑了起来。“那好，在我死之前，就跟着我吧，但要听姐姐们的话。不要耍脾气。”\n“好的，烈辽。”皮古听话地点点头。\n“那个孩子...是女儿吗？”旁侧的一个军官看着开心地跑出房子的女孩，有些犹豫地问了出来。\n“如果是女儿的话，那得算是我的福气吧。”“不是的话，那是？”"
 als.196.a:0"算是，那灭亡许久的帝国留给我的，最后一件礼物。"
 als.197.t:0"巷战"
 als.197.d:0"对火车站的进攻已经持续了四个小时。\n当第4师的指战员们看到他们的司令员庞大的身影靠近的时候，火车站上的防御阵地已经接近丢失。\n意大利军的重炮将剩下的防御阵地犁了数遍，炮火之猛烈让师部甚至不能派出工兵修复被炸断的通讯线路\n但所幸还有数量相当多的民房废墟可以用作掩护。这支原本就严重减员的师团其最具有战斗力的地方已经尽数部署在了这里。\n他们不缺轻重武器，在他们背后，也有成建制的重炮与火箭炮阵地。但是，没有人，没有足够的兵员能够支持红军夺回阵地。\n“那个老东西，哪怕是电话线被炸断了，也不该亲自来这个鬼地方啊。”师长暗骂一声，把指挥暂时交给了副官。\n在看清来者的装束后，这位苏联将军不禁愣住了——他们的司令官，烈辽科夫，并未像往常一样穿着军服，而是换上了一套黑色的，极其厚重的甲胄。这套装甲让老人原本壮硕的身躯更显得庞大无比。并且与穿着浅褐色军服的红军战士相比格格不入。\n“司令员同志，恕我直言，您这身甲胄看上去挡挡流弹还好，可是——”“通讯员和我说，你们需要援军进行反击。”\n“是，是的！我们的火力目前足够，现在敌军看上去已经后继不足，再给第2团发一支突击队，我有信心把阵地夺回来！”\n“所有战士都在必要的岗位上，现阶段已经派不出一兵一卒。”不止火车站，在北方意军也在发起猛烈的进攻，势头直指红十月工厂。\n听到司令都这么回答，第四师师长失望地耷拉起肩膀。“这种消息让通信员过来回复就好了，何必麻烦您——”\n“现在最前线是哪支部队在顶着？”“第2和第4团，将军同志，往前再走200米就是，现在师部与前线也没什么区别了。”\n“我去支援他们。”抛下这句话，烈辽科夫踏着沉重的步伐继续向前。“那援军呢？”被他甩在后面的师长愣了好一会儿才喊道。\n“我就是援军。”\n当烈辽科夫踏入第2团的阵地时，饶是正在交火的士兵都回过头来惊讶地看着这个像是从中世纪穿越来的臃肿邑从，当有人认出那是他们的将军时，一时沉寂的阵地内爆发出响亮的欢呼声。\n“听好，团长同志，接下来由我突击火车站内的敌军防线，请尽可能以轻重火力予以掩护。不用留预备队，让所有人都参与突击行动，在我突入敌阵后五分钟，吹冲锋哨。”将背上的长剑取下撑在地上，烈辽科夫缓慢地，一字一句地下达了如下命令。\n“就，就您一个人？”“战斗开始五分钟前，只需要我一个人。”\n该说的说完，烈辽科夫一只手翻出战壕，随他跃出战壕的还有几枚掷出的烟雾弹。\n冒着因为发现烟雾而骤然猛烈的炮火，他直直撞向前方。消失在白色的烟雾之中。战士们只能听见惨叫声此起彼伏。"
 als.197.a:0"然后，冲锋哨响，这场战斗进入了最血腥的部分。"
 als.198.t:0"重归战阵"
 als.198.d:0"“唔——”坐在卡车里吹着来自俄罗斯的寒风，哪怕盔甲里面罩了一层比斯凯塔小姐特地为此行缝制的棉制内衬，兰斯还是忍不住打了一个寒噤。“冷死了——本大爷为什么要来这种天寒地冻的地方受罪。”\n“现在才刚入冬呢，勋座，往后还有更冷的时候。”司机笑着讲，“‘冬将军’要发威啦，接下来的日子才难熬呢。”\n在正式入冬以后，意大利军对木之本格勒的第一次围攻可以说已经失败。面对城市守军，在内城战开始的两个月内，意大利正规军调集了十余万人及各式轻重火炮将这座城市化作一片废墟。但在各个战线意军均陷入了血腥的拉锯战。并且付出了相当巨大的伤亡，因为溃退而缺兵少粮的守卫城区的第62集团军在一位新的指挥官的奋战下顶住了来自四方的围攻，并始终确保着对城中心的控制。\n随着严冬将至，并且情报显示从莫斯科方向正有部队调集过来，在城区以北，有两个新的集团军渡过了伏尔加河，开始与北线的意大利军队对峙。总参谋部必须考虑撤出木之本格勒。\n在这个人心浮动的时刻，兰斯来到了这里。来到了距离内城区只有数十公里的前线指挥部。\n“上次参加这么重大的作战还是在四年前嘞。”不过和那个时候不一样，那时候起码还有个死肥佬帮他圆场子。\n这次没有自由都市方面的指挥人员给他背书。哪怕是兰斯心里也不免犯起嘀咕。\n“要是这帮人不听老子的，老子再跑路也不是不行。”本来就是硬要拜托他来的，所以他兴致算不上很高。\n然而，当他费力地跳下卡车，这才发现，几乎所有将军都站在寒风外等候他。\n“勋座，别来无恙。”在两月以来一直指挥着围攻，指挥着几乎所有参与攻城的部队的，也是兰斯少数几位熟悉的陆军元帅，乔鲁诺·乔巴拿礼貌地向他挥手致意。“哦，是你啊，真亏得你带着这么多人出来迎接本大爷，哈哈。”\n“熟悉的不把人当人的勋座又回来了啊.....”站在他旁边的将军米斯达倒是一如既往的不待见他。“我说，他真的能起到作用吗？”\n“喂喂手枪仔别把别人当聋子。”兰斯倒不生气，这般阵仗让他有些高兴或者说飘飘然。“本大爷可是来帮你们收拾烂摊子的。”"
 als.198.a:0"至于这一仗，我自有胜算。"
 als.199.t:0"不安"
 als.199.d:0"马马耶夫，指挥部内。\n意大利军队暂时停止攻击之后，各部的指挥官重新聚在一起，围在这场木之本格勒保卫战的最高指挥官，烈辽科夫周围。\n他们都明白这样能安心集中在一起做出部署的机会已经不多。\n“好消息是，指挥部应该是正在准备针对木之本格勒进行反击作战。除开行进到城区北部的第27、44集团军以外，南线也得到了来自莫斯科的两个集团军的支援，大概有15个师的力量，这些部队足以向目前敌军相对脆弱的防线发起突击。”副官如实汇报道。\n“坏消息呢？”烈辽科夫看上去并没有怎么被鼓舞。\n“坏消息...上面也好，兄弟部队也好，我们都按您指示去询问过，但是没有任何部队有入城的计划。”\n“这个，不要紧，如果友军能从南北两个方向发动进攻，木之本格勒也就安全了。”他只是轻轻地叹了口气。\n然而，第四师的师长，紧紧盯着地图上新增的几个棋子，眉头一直没法舒展开来。“将军同志，能允许我说几句话吗？”\n“无妨。”“只是一些疑问，在前来受您指挥之前，我在北方的勒热夫战线指挥部队，所属第21集。”\n“有什么问题吗？”“离任前，我们已经为了在勒热夫的反攻行动筹备了一个多月，但是，截至现在，这场进攻似乎都还没有发动。”\n“也许攻势被叫停了。”“这就是问题所在，巴科夫将军，参与勒热夫预定攻势的21集、近卫坦克第3集，还有第4集，这三支都是为了北线的反攻作战做了充分准备的野战部队，如果他们没有投入北方的反攻作战，那当然会派遣至这里支援即将开始的反攻才是，但是在前来增援木之本格勒战线的部队里，这三支部队都没有出现，眼下的人甚至不是从现有战线调过来的，而是直接来自莫斯科...”"
 als.199.a:0"这实在太过反常"
 als.200.t:0"大撤退"
 als.200.d:0"“将军！将军！”有一个军官冲进了指挥所打断了会议，他气喘吁吁，很明显是从最前线一路赶过来的。\n“敌军...敌军自二十分钟前开始向我部发起全面炮击！但是，并非常规炮弹...”\n“唔...今天的风向确实——毒气弹吗？”“呃，是，也不...。”士兵欲言又止，不知如何表达。\n哪怕是距离战线很远的指挥部，当众人踏出房门，一股香甜到让人有些反胃的香气反常地扑面而来。\n“虽然看上去弹头确实是毒气弹，但释放的气体似乎没有毒性...像是...”“是熏香。”\n他想起了作为团长履职的第一个晚上，在他眼前，随军神甫在众人的簇拥之前点起一盏香炉，在悼词中人们的回应愈发沉醉...\n“今天的风向太好...如果在这个地方都能清楚闻到...可恶！”一直沉稳的老将军也不禁愤怒了起来。“这群混蛋...意大利人...”\n他知道“污染”的始作俑者是谁，更知道她来自何方。意方使用这类武器，这恰恰是最不让人意外的。"
 als.200.a:0"全军撤退！撤退！马上逃离那里！所有人！"
 als.201.t:0"全体进攻"
 als.201.d:0"“报告！苏联人...苏联人正在紧急撤退！”从火线上撤了下来，侦察兵向着阵地内的最高长官大声喊道。\n“嘎哈哈哈哈！完美！欺骗作战大成功！”兰斯远远望向战线的另一侧，似乎能见到苏联人乱成一团的样子。他哈哈大笑起来。\n“马上给其他部队发电报，告诉他们，给老子上，不需要什么战术，给我冲得越快越好，战车旅也给我好好跟进！至于你们，现在，老老实实跟着本大爷...要冲上去啦！”\n兰斯一手掏枪，另一只手拿下背上的卡奥斯——用几个幻想乡的绝世女子修复了三天三夜之后，这柄重剑在冬日的照耀下闪闪发亮。\n该团团长还想劝阻兰斯，但他的下属已经齐声发出震耳欲聋的战吼。跟在那个套着绿甲，披着绿色披风的家伙后面一同冲向战线。"
 als.201.a:0"什么叫作勋座亲自带着你们团冲在最前面？"
 als.202.t:0"围城"
 als.202.d:0"“我勒个...我告诉你，要是勋座出了什么事，我一定会给你开12个窟窿出来！”\n米斯达生气地挂掉通讯，“妈的那个家伙，就该让他被一枪打死...或者被炸死...”“嘛，你只是不敢和他一样吧，米斯达？”\n“喂喂乔鲁诺！”在城外，听着震耳欲聋的炮声，乔鲁诺由衷地赞叹起来。“看样子敌军完全被欺骗了，现在他们成了惊弓之鸟。”\n“切，不过是用了相当卑鄙的做法而已。这不是一点技术含量都没有吗。”米斯达只觉得这个家伙只是在耍些小把戏。\n“并不是这样的，米斯达，好好回想一下吧。”远方的城区开始不断升腾起黑烟，现在为进攻部队提供掩护的是真正的炮火打击。\n“只是粗略考察了之前的阵地情况，便推断出敌军部队污染现象的来源。在来到指挥所前就为这场进攻准备了足够的特制炮弹，从接手指挥到发动进攻仅用三天的时间。如果是我，哪怕是同样的策略，筹划这场进攻恐怕也要花上起码半个月，苏联人也不会像现在这样束手无策——勋座筹划的这场奇袭可谓相当精彩。”\n所谓的特制炮弹，里面装载的是模仿宗教用熏香制成的高压气体，但也仅此而已。\n“同志们！死死顶住！既然已经选择了比死亡更差劲的命运，那就要尽最后的力量掩护其他同志！”\n苏联人留下了极少数人作为殿军，她们与掩杀过来的意大利军队陷入了残酷的白刃战。\n在火车站前，轻松拨开两把向其冲来的刺刀，兰斯抬手一枪击中试图刺倒他的苏联士兵，反手一剑将另一名从一侧袭来的战士砍倒。“勋座！您在这！”团长从后方紧赶慢赶，总算低着身子冲到了兰斯跟前。\n“敌军已经开始重组防御，虽然人数少但是子弹可不长眼！勋座！接下来的战斗就交给我们！您千万不能出事了！呜哇！”\n兰斯一脚踹翻了他，向他的士兵们招呼着。“投烟雾弹！本大爷来打头阵！你们紧紧跟着老子就行！嘎哈哈哈哈！”"
 als.202.a:0"现在，轮到他单枪匹马冲进苏联人的阵地去了。"
 als.203.t:0"木之本格勒的英雄"
 als.203.d:0"“只是...普通的香气吗？”“哪怕根据您的标准来看，似乎部队内也没有人出现异象，所以，目前来说只能如此推断。”\n烈辽科夫听完汇报，将手猛地抬起来，但最后还是轻轻地放下，让脆弱的沙盘逃过一劫。\n“...被敌人摆了一道，的确，如果是真的...他们也没法进攻啊。”望着地图上相比此前已急剧收缩的防线，他陷入了长久的沉默。\n付出了巨大牺牲的马马耶夫高地和整个城南地区都白白让给了敌人。而在北方，尽管及时重组防线，但倾压倒性兵力发动总攻的意大利军队轻而易举的突破了红十月工厂，整个62集团军所剩下的4万人残部现在龟缩在拖拉机厂一线，而她们的背后，是临时做了扩建的渡口，可在被围歼之前，能有多少人顶着空袭和炮火渡过伏尔加河呢？\n但是，烈辽科夫依旧在等待，等待伏尔加河对面的消息。\n然而二十分钟之后，消息便传来了。\n“来自木之本格勒战区指挥所的回复！将军同志。”“念吧。”\n烈辽科夫的目光依旧死死盯着沙盘。\n“针对第62集团军提出的问题，回复如下：\n1 目前位于木之本格勒北部郊区的27、41、44集团军缺乏足够的装甲力量与重型设备，且缺乏足够的作战训练，司令部没有将其用于进攻作战的计划。她们依旧作为预备部队使用。\n2 城区以南的62、33集团军以加强南方战线为目的部署于此，没有做任何进攻准备，若要发动策应性攻击，起码需要一周左右的准备时间。\n3 同样出自以上原因，目前木之本格勒战线的其他部队均无支援城市守军的计划，除非62集团军能确保目前北部渡口的安全。"
 als.203.a:0"以上。"
 als.204.t:0"漫漫旅途"
 als.204.d:0"烈辽科夫猛地站起来，踏在木板上的声音让副官都为之一愣，甚至下意识闭上眼睛准备迎接将军的怒火。\n他也确实要发作了，他不在乎自己是否要死在这里，不，他一定会死在这里。但是他无法接受剩下的整整四万人被抛弃的事实。\n但，他高涨的怒气突然泄了下来，他看见，门的一边探出了半个小小的脑袋。\n......\n“皮古，还呆在这啊。”“昨天早上看到姐姐们都在往这边跑，我就跟着跑了过来。”“...很聪明啊，小皮古”\n那双大手又一次在女孩的蓝头发上来回抚动，皮古很喜欢烈辽科夫这么做。“...嘿嘿嘿，果然，最喜欢烈辽了。”\n“但是，皮古，你必须走了。”“不对，烈辽答应过，我能留下来，直到烈辽死去的时候。”\n“计划有变，有新的请求，想要拜托皮古。”\n老人从兜里拿出一件信封，“小皮古，拿着这个。”“这是什么？”“爷爷给木之本樱姐姐写的信。爷爷很感谢她。”\n“...莫斯科的小樱姐姐！”“对的对的，她很喜欢孩子，离开这里，让和那些姐姐一样的人带你去莫斯科。樱姐姐不会拒绝孩子的。”\n“...好啊...可是...”“怎么了？”“烈辽能不能暂时不要去死？”“为什么？”“要是那样我就没有理由回来了。”"
 als.204.a:0"皮古是个大孩子了......皮古不用再回来了。"
 als.205.t:0"停战协议"
 als.205.d:0"“唔...投降吗？你们倒是蛮识时务。”看着前来谈判的代表，兰斯嘴上这么说着，眼睛倒是一刻不离她那略略翘起的臀部。\n“不是投降，是停战。”代表压住心头的鄙夷，正色道，“如果你们执意进攻，我们会死战到底。毕竟我们也没有退路了。”\n“也没差啦，除非来几个最正点的俄罗斯美女给我，不然你们要寻死也是你们自己的事情。”“...请自重。”\n“果然还是不能让勋座亲自来啊。”陪在一旁的乔鲁诺默默看着他的勋座在谈判桌上满嘴跑火车，摇了摇头。\n现在意军的锐气几乎已经丧失殆尽，愈发凛冽的寒冬将新胜所振奋的士气又打压了些许。所有参战的部队都经受了程度不小的损耗，对于现在的意大利军队来说，能够兵不血刃地接收整个城区是再好不过的事情。毕竟南北两线现在都承受着巨大压力。\n“但是...如果不是无条件投降，而是另有所图的话...说不好对面也拿准了我们会这么想...”乔鲁诺暗自分析着。\n“唔，无聊，也别兜兜绕绕的了，你们到底想怎么样。只是这座城，本大爷无论如何都会捏在手里。”兰斯饶有兴致地等着回答。\n“将军同志想要会一会你。”“然后呢？”"
 als.205.a:0"赌注是这座城市。"
 als.206.t:0"荆棘"
 als.206.d:0"谈判代表直视着这个即将征服木之本格勒的，该战区意大利军队的最高统帅，一字一句地说出条件。\n“听说你的武力远非一般人可比，将军同志对你很感兴趣。明天，他希望你和他能有一场正面对决——一对一。”\n“...啥？”兰斯扣起了鼻子。直觉告诉这位女代表，若是不投其所好，那么他会对这份提案不屑一顾。\n“如果阁下能赢下胜利，那么，现在困守在拖拉机厂的四万余人——包括其中...所有和我一般姿色的人...就都是将军的了。我们会将这座城市——以及所有人的命运交给意大利军。更确切地说，交到您的手上。”\n“别乱包括，男人们该怎么办怎么办，漂亮的女孩子归我就行，哈哈，也不是不行嘛！”兰斯止不住地奸笑起来\n“完了。”乔鲁诺又摇了摇头。\n“还有什么吗？”“我军希望，以明天为临时的停火期——您也不希望这场对决有旁人打扰吧？”\n“那本大爷也有个条件。”“敢问是什么？”"
 als.206.a:0"当然是你啦。"
 als.207.t:0"精虫上脑"
 als.207.d:0"“这就是俄罗斯的美女吗，真——爽啊。”把被顶到狼狈不堪的人放回去后，提起裤子的兰斯惬意地伸起懒腰。\n“勋座......我有句话想说。”等候他多时的乔鲁诺有些尴尬地找到他。“勋座，您知道停火期意味着什么吗？”“呃呃，啥？”\n“停火的话，飞机没法执行轰炸任务。”“嗯。”\n“火炮也不能开火。”“当然，因为是停火嘛。”\n“也就是说，没有任何东西可以威胁到渡口噢。”“她们要渡就...等下...慢着...”\n“也就是说，勋座，如果有足够的船只，明天她们就能够自由渡河...”\n兰斯理解乔鲁诺所指何事之后，声音也高上了八度。\n“我操！！！！！被骗啦！！！！”\n“果然...勋座根本没想到这一层...”"
 als.207.a:0"那个混账东西！被摆了一道啊啊啊！我要杀了他！"
 als.208.t:0"帝国铁壁"
 als.208.d:0"两人见面的地点是战线往前约两百米的一处较为空旷的地方，四周都有建筑物做掩护，因此，在这片决斗场地的两边都已部署数个火力点，但苏军一侧的人数显而易见的稀少。此刻绝大多数人都挤在渡口，想要尽可能在仅剩的安全期内渡过这条俄罗斯的母亲河。\n但是，配置再完善的火力点也没有办法确保决斗者的安全，只要一方有背约的想法，一颗子弹便可带走另一方的生命。\n“虽然一直看那个猥琐大叔不顺眼，但这一次...那家伙是真有种啊。”握着手枪，躲在建筑内的米斯达第一次觉得那个男人是个人物。\n兰斯没有等待太久，沉重的脚步声，伴随着大地微微颤动的声音，烈辽科夫从慢慢走了过来。\n背对着温暖的冬阳，当他在兰斯的面前站定，巨大的阴影便将他包裹其中。\n“阁下就是意军的新指挥官吗？”“新指挥官？”“将我击垮的那一战，和之前战斗的风格...以及流向，都不一样。”“...是本大爷。”\n烈辽科夫慢慢从背后取下巨剑，将其撑之于地，“喂，老头，因为你的美女代表和老子玩文字游戏，所以，现在老子很生气。”\n“感觉不出来喔。”与举手投足间展现的压迫感不同，他的神色很平静，甚至有些如释重负。“您能同意我的请求，我很感激。”\n这是寒暄的最后一句话，兰斯将扛在肩上的卡奥斯拿了下来。"
 als.208.a:0"然后，山压了过来。"
 als.209.t:0"好人或是坏人，以及死人"
 als.209.d:0"面对直直向他横扫而来的，那柄可能比兰斯的身躯还要宽大的巨剑，兰斯选择直接劈向这个下马威式的横扫。\n随着地动山摇，兰斯被震的连撤两步，但在木之本格勒横行了二月有余的山，第一次被截停了下来。“选择硬碰硬吗？那就来吧。”\n烈辽科夫不再用身形的冲锋牵动巨剑，而是用粗犷的手臂将其挥动，舞得虎虎生风。一步一步地舞向面前渺小的兰斯。\n所有人都会认为兰斯会暂时避开这颇费体力的剑舞，但他也用双手架起他的魔剑，丝毫不惧地迎了上去。\n躲闪，招架，甚至找准机会使出一记重劈，兰斯拒绝发挥他与对手对比之下突出的灵活性，执意要与其在剑的对决上分出胜负。\n很明显，现在发生的战斗是在场的所有人都未曾见过的，他们的技术、他们的战意、他们的战斗方式。早已为世人所遗忘。\n但是，率先表现疲态的是兰斯。“唔！”察觉到腰际突然传来的隐痛，兰斯的动作略有停滞。\n“你也不是什么年轻人了啊。”烈辽轻轻笑了下，再一次将手中重剑挥舞过来\n理解了兰斯为何选择与他正面较量的老者没有放过这个空隙，使出全力劈向了它。“唔——臭老头！少膈应人了！”\n兰斯将手中剑一抬，将看似势不可当的斜劈挑开。“没有任何取巧的一击，纯粹的...以力御力。”米斯达专注地观察着二人的死斗。\n像是为了回应刚刚的一击，兰斯抓住机会，再一次重重地向下劈了下去。这一次烈辽没来得及挡住，仍由其劈在肩部厚重的盔甲上。\n“老头子就是老头子，你这家伙问题可不比我少嘞！下一击该决胜负了！”“那就合你意吧。”两人同时拉开架势。随即冲向彼此。\n兰斯一跃而起，高高扬起的魔剑以千钧之势向烈辽科夫劈来，后者则双手将巨剑向后拖，倾其全力横扫过去。\n“去死吧，老头，兰斯attack！”"
 als.209.a:0"在那一瞬，所有人都只能听见某个东西碎裂的声音。"
 als.210.t:0"战后"
 als.210.d:0"望着那柄停留在自己腰间的哥萨克弯刀，兰斯愣了足足好一会儿。\n烈辽科夫不知何时，将一只手松开，单手拖动沉重的巨剑撞向魔剑，另一只手抽出了腰间的弯刀，在兰斯没有任何办法招架的情况下狠狠砍了过去。他确实砍中了，刀深深嵌入了盔甲之中，如果再用点力，兰斯也许会被一刀斩成两端也说不准。\n“呜呜....好痛啊心之友。”卡奥斯抱怨的声音，将兰斯从愣神中唤了回来。魔剑已然深深插入对手的肩胛，他同时硬生生劈断了两样东西：巨剑与盔甲。这也怪不得卡奥斯疼地叫起来。\n“破剑闭嘴，这不是还没断吗。”虽然兰斯完全共情不了就是了。\n“...居然断了啊，”被如此不讲道理的力道压住，烈辽科夫半跪下来。从他的喉咙里传出一声，也许是兰斯听到过的最为绵长的叹息。\n“本大爷赢了...可恶，腰好像闪了一下。”兰斯放开了剑，一屁股坐了下来。\n“说起来，阁下，贵姓？”“兰斯，本大爷没有姓。”低下头看了看自己，又抬起头来，烈辽可夫直视着将他击败的敌人\n“有些，动不了了，扶我坐下来，可以吗？”兰斯没有说话，只是勉强自己又站起来，两只手慢慢扶着老人坐了下去。\n“谢谢。”虽然能很清楚地看见，他的生命力清清楚楚地流失在被劈做两段，正汩汩流着鲜血的肩上，但老人仍然将手捏在腰间。\n他一直只是一个被腰痛折磨的老人，自始至终。\n“谢谢你放过他们。”“不是啦，只是被你派来的代表骗了而已。”“这样么？那现在，还留在这里的人，可以放他们到渡口去吗？”\n“啧，老子放过四万多个人了，不差那么几个。”\n“呵呵...哈哈。”“喂喂，你笑什么。”\n“没什么...用两个老家伙之间的过家家，让成千上万的年轻人互相免于杀戮，阁下不觉得这很浪漫吗？”\n“嗯嗯...是啊，只有真正的爷们才能理解的浪漫...本大爷才不是什么老家伙。”\n烈辽科夫有些满足了，他慢慢把眼睛闭上。"
 als.210.a:0"但是，某个声音，又不合时宜的响了起来"
 als.211.t:0"战后"
 als.211.d:0"“烈辽——”拖着很长很长的嗓音，小皮古一路小跑了过来。跑到他的前面。\n“你还没走啊。”“嗯，想最后看一看烈辽。”女孩看了看旁边的另一个叔叔，他只是点了点头。\n“烈辽...要死了吗。”“不会哭吧？”“不会。”皮古揉了揉眼睛。\n“那封信，拜托你咯。莫斯科很安全，不用回来。”“本来就不回来。”\n他又看向兰斯，“包括这个孩子，可以吗？”\n“当然...啧，小孩子而已，你在担心些什么？”“唉，因为是孩子啊。”\n“有个，很不讲道理的请求，你能听下吗？”“你提了好几个不讲道理的请求了......也不差这一个就是。”\n“如果...如同我预想的那样——莫斯科...俄罗斯将会洪水滔天。到了那个时候，这场战争本身，也许都将不再重要了罢...”\n“只是猜测...一切都只是猜测，但如果那——不再是猜测，兰斯将军，你能够，为我的祖国帮一个忙吗？阻止它。”\n兰斯没有问对方口中的“它”是何物。“你怎么就觉得本大爷可以？”“我是帝国留存的，最后的山——”\n“而你，你刚刚跨越了它，这就足够了。”“本大爷才懒得听老头子的要求。”“是吗——是啊...”\n没再说什么，他吃力地重新将目光转向那个孩子——皮古正目不转睛地盯着烈辽的脸。不断地眨着眼睛。\n突然，一只同样宽大的大手蒙住了她的眼睛，她看不见烈辽了，所以她闭上了眼。"
 als.211.a:0"另一只手，轻轻地阖上了另一双眼睛。"
 als.212.t:0"致主席"
 als.212.d:0"苏维埃社会主义联盟国中央总书记 木之本樱 敬启\n若陛下得阅此信，本人恐怕已阵亡于木之本格勒城下，我部第62集团军竭尽全力，与凶残且掌握绝对优势的欧洲侵略者鏖战二月，战死者不计其数。虽然不愿如此预言，但恐怕此时木之本格勒业已沦陷。可是，现在并不是将目光放在侵略者动作的时候。\n在下于今年受陛下恩诏应征入伍，并且发现了军队内部正在扩散的人类污染。虽然我尽力使麾下62集免于污染侵袭，但是恐怕其他部队已经深受其害。不出所料，污染的源头来自随军的宗教成员——是的，其均出自现东正教廷。他们一直掌握着“污染”的秘术，却以此破坏着军队秩序——或者说，在动摇他们的忠诚。\n在伟大战争中，在下是少数几位曾经真正指挥过仅由污染人类组成的军事部队的军事指挥官，彼时在下曾在勃鲁希洛夫上将麾下领导第8集团军，于1916年参加了对加利西亚防线的总攻击。那次作战是帝国唯一一次投入污染人类进入战场。完全污染人类不会死亡，肉体强度得到强大的提升，但最关键的是，他们会绝对地服从命令。因为他们丧失了作为人最基本的求生本能。\n在下依旧记得第一次看见这群行尸走肉加入我部的时候，当年的全俄罗斯牧首，亚姆·伊斯迈尔大人亲自来到了指挥部，指导我部指战员如何妥善操控此类部队。在下曾私下了解到关于此秘术的秘密，最后发现。牧首大人真正的目的是在军中秘密培养一支只忠于教廷——只忠于她的武装力量。至于她要用其施行何种计划，这便不得而知了。\n但是，当时已是1918年，随后革命爆发，不管怎么样。莫斯科的赤卫队都让她的计划流产了。随后她便不知所踪。\n时过境迁，现在，在下所认识的人已经悉数离世。我相信，现在已经只有我本人知晓此等秘密。\n当在下得知前来支援木之本格勒战线的部队悉数来自莫斯科时，我有一个极其可怕的猜测。\n陛下，如果再接到此信的时候莫斯科已经没有可以调遣的预备部队，恐怕最坏的结果即将发生。莫斯科将处于危险之中。\n如果诸多行动皆出自教廷的意志，那么几乎可以确认他们已背叛了俄罗斯母亲；\n如果这些乱象的背后出自那位已经消失许久的全俄罗斯牧首——在下认为这很有可能——她的计划也许会比我所能想象的更加疯狂。\n绝不能让我们的敌人剥夺俄罗斯人民的，自由的意志，俄国人民...甚至全欧洲的命运即系于此。"
 als.212.a:0"第62集团军司令 烈辽科夫·巴科夫"
 als.213.t:0"戛然而止"
 als.213.d:0"“现在开会实在有些勉强了吧。”晚上，勉强扶着捂着腰一步一步挪回军帐的总大将，米斯达少有的关心起他来。\n“不打紧.......疼疼疼。”兰斯的脸拧作一团，他现在已经疼到没工夫理会米斯达。\n“得马上进军，不能就滞留在这个鬼地方。”将指挥棒搭在城的对岸，兰斯喘着粗气，向众人做出了接下来的部署。\n“已经为后续追击做好准备了，工兵明日就可以开始架设浮桥，就看炮兵和空军部队能不能做好掩护工作。”一位将军说道。 “但是，现在各军在城外收到的压迫程度并不低。”\n乔斯达也不看好继续进攻。“万一敌军从城外两个方向展开钳形攻势，在最坏的情况下我们反而会陷入被包围的窘境。\n兰斯对着沙盘沉思片刻，同意了意见。“那就留下少数兵力留在城区，主力部队先加强城外防线。先观察下敌军动向吧。”\n“这一次少有的听取意见了呢。”“手枪仔你要吐槽也别让我听见。”“又不是骂你......”\n“这一仗很奇怪......非常奇怪，明明摆出重兵在我们的侧翼，却完全没有动作，几乎是坐视城市沦陷。”也许是之前的战斗消耗了太多体力让他变得焉了些许，兰斯倚在桌边，少有的开始推敲起此役的诸多怪异。\n“虽然预料到她们不会冒险支援城内，但确实是毫无动作。勋座有什么头绪吗？”\n“没有，完全没有。”兰斯坐了回去，同样百思不得其解。“如果要放弃这里，起码也要让其他部队做些牵制。”\n副官匆匆走进打断了军议，“有给总司令的急电。”\n“给我吧。”兰斯接过了电文。\n在众人面前，这位总大将的脸色第一次流露出惊讶，以及迷惑的神情。哪怕放下了电文，他一时间竟也有些不知所措。\n“勋座，接下来的命令是什么？”“撤军——全线撤退。”“果然罗马那边也...全，全线撤退？”\n帐内一时哗然。“乔巴纳！”“.....勋座？”兰斯将手中的指挥棒扔给他。\n“放弃木之本格勒。全军撤退，暂时别思考原因了，其他战线的部队也是如此。”\n“那敌军追击怎么办?”兰斯没有回答这个问题。“乔巴纳，你重新负责这一战区，本大爷要回一趟基辅。”\n“喂！到底出了什么事情？勋座！起码得说清楚原因吧？我们可是赢下了——”“跟现在的战斗没有关系！。”\n饶是一个星期前那般意气风发的兰斯。此时眼中也闪过一丝阴霾。"
 als.213.a:0"他一把站了起来，但腰间的疼痛让他不能再像风一般行动。"
 als.214.t:0"大雪纷飞"
 als.214.d:0"计划开始之日，克里姆林宫里正落着连绵大雪。\n沃尔玛博士打开了地窖，呆在里面已有一年有余，而今日，他终于能够离开这个深藏于联盟首都之底的，颇让人窒息的小实验室。当他走出地下室，看见房间窗外闪过的黑影，他将大门一把推开。\n门外，人们——市民还有士兵们，成群结队地向着苏维埃的心脏走去。她们目光呆滞，耷拉着脑袋，如同行尸走肉一般。\n而在那代表着俄罗斯心脏的大克里姆林宫内，变乱也早已发生。\n当主教们簇拥着一个身材娇小的少女步入克宫防区时，混乱已经结束，横七竖八倒在各处的尸体肢块，随处可见的枪眼与血迹，无不印证着一场屠杀曾在这里上演过。\n甚至连战斗都算不上，平日几无异常的同志突然将枪口对准了他人。分不清敌我，不清楚目的，不明所以的卫兵、还有内务部的保卫人员，遭到同志的袭击。在这般犹如地狱的情况下被驱散。然后便是单方面的屠杀。呆滞的叛乱者们，机械地执行着单一的指令。\n“敌人，就在克里姆林宫里，抓捕木之本樱，杀掉任何非同类者。”这道命令正出于那位少女口中。\n没有什么控制装置，也不是什么精神操控。\n这群灵魂被高度玷污的，将生视若无物的污染者，只是自然而然的执行着少女的意志。\n既然没有了自己的愿望，那就为了她的愿望去死吧——仅此而已。\n几枚炸弹在城区内炸开，“污染”隐藏在漆黑的雾气里，在市民们尚未反应过来时，钻入她们的毛孔里，直达她们的灵魂。\n于是，出现在沃尔玛博士眼前的，便是如此这般景象。\n踏着厚雪，由教徒们予以护送，身着一袭黑色连衣裙，少女慢慢地走进宫殿。布尔什维克的抵抗还在深处进行着，依旧能听见零星的枪声与金属碰撞的声音。\n“似乎进展还是有些不顺利，办事处那边，还有政治局里似乎都存在着强力的抵抗者。”那个谄媚的声音属于那位笑面虎托塔斯。\n“咳咳...无妨...司令部、还有卢比扬卡都已压制，驻军的抵抗差不多也都驱散了。一切结束只是时间问题。”推着轮椅，随侍在少女旁的安罗恩主教用着沙哑的嗓音补充着。\n少女默默上前，她的脸上一直挂着淡淡的笑容，但是感受不出究竟是悲是喜。\n“这些都无所谓，快一点，要去和木之本樱见上一面呢。”"
 als.214.a:0"方今之时，天下当倾。"
 als.248.t:0"引导者的归来"
 als.248.d:0"基辅\n“兰斯！”“哦哦，是科潘冬——啊！”踏入建筑的大门时，一个小小的身影一头扎进兰斯怀里。\n“喂喂！小冬痛痛痛....”兰斯疼得龇牙咧嘴。“呜呜——你没事就好......”\n科潘冬安心地，紧紧抱住男人的腰。“知道你就在前线，我都快吓死了。”“痛...别抱了...再抱真的会出事的.....为什么让我回来？又有什么地方需要本大爷吗？”\n“唔，没有。”\n“那你发什么神经！！！！这是打仗，打仗啊！！！你哪根筋搭错了你！！！”\n“搞不清楚状况的明明是你好不好！出，出了这么大乱子，然后下面才告诉我你你你就在前线，这种时候你还呆在那干嘛！！！”\n“所以都说了既然是打仗——” “和战争已经没什么关系了哦。”另一道纤细的女声打断了他们的争执。\n“......志津香？”罕见地没有戴那顶魔法师帽，一头绿色长发随意的披在肩后，志津香不知什么时候站在了兰斯后面。\n“战争，目前已经没法继续下去了。”“欸？苏联人投降了？”\n“要真的是那样就太好了——科潘冬小姐，高町将军已经在里面等你了。”\n“哦哦...这样啊，兰斯，本来按理说应该由你去的，但你当时还在前线，所以就由我代劳了，还真是抱歉。”“唔，为什么要抱歉？”\n“因为——”“好了好了快点去吧。”科潘被志津香催促着推走了。“到底是怎么回事......”\n志津香略显无奈的叹了口气。“是更大的麻烦。还记得“引导者”吗？”\n“...啥东西？”“回想一下，巴比伦塔的事。”“唔——哦，哦，有，有印象了。那群邪教。”“她们压制了莫斯科。”\n“就算是那样也没必要闹成这样——唔，莫斯科？”“是的，苏联的军政中枢所在，同时，苏军内部也发生了规模极大的反乱。”\n“那为什么反而是我们要撤军?”“问题在于反乱的方式，几乎所有俄军都遭到了有预谋的污染袭击。”“...都变成污染者了？”\n志津香摇摇头。“倒也没有到那种地步，但对面确是因此陷入了巨大混乱。更麻烦的是，不只是前线，各大城镇都爆发了类似的毒气袭击事件——包括我们的占领区。现在整个俄罗斯都是一团糟，到处都是污染的毒气，以及游荡的高度污染者。”\n兰斯有些理解当下的处境了。“意思是，再呆下去，我军也会面临这样的风险咯？”“考虑到我们在这片战场上投入了大量兵力，可能性非常大。也不好说叛军是否会攻击我方。我来这的目的也是将分散至全军的魔法部队重新集结起来，尽快撤回欧洲。”\n“和苏联的战争必须到此为止了，至少现在要做的是将军队尽快撤离此地。”志津香给出了总结。\n“可是，在敌人的眼皮底子下撤军，真是有够蠢的欸，起码也得达成个停战条款才是。”兰斯挠了挠脑袋。"
 als.248.a:0"唉......你觉得科潘冬那家伙现在在干什么？"
 als.215.t:0"和议"
 als.215.d:0"“我方的意见，在一开始就阐述的很清楚。”被志津香拽进会厅，兰斯远远地就能听见一道清脆的女性嗓音在对面远远地响起。\n“那位就是高町奈叶，苏联将军。”在圆形会厅的边缘，志津香指向他们对面那个，唯一一位站着的少女。“她是第一个，目前也是唯一一个向我方提出交涉的苏方代表。”然而，既然是兰斯，关注的第一点自然是——\n“无论是身材还是脸，都是超正点的——啊！”兰斯被狠狠的踩了一脚。“你这家伙，专心听她说的什么，听她说！”\n“无理入侵祖国母亲的是你们意大利人，若是就此和平，那死在这场战争中的无数同志便无法瞑目。我方决不接受无条件和平。”\n面对凛然的代表，科潘冬却并不着急，她慢慢将身子靠在椅背上。“你再怎么激动也解决不了问题，反而有可能破坏我们原先早已议下的，对停火的共识。”虽然并不精于战事，但在谈判的问题上科潘冬倒很能掌控对方的心理活动，这是作为商人的本能。\n“大多数战线的苏军都在事实上陷入了无法作战的情况，在这样的情况下，我们仅仅只是要求和平，阁下不觉得其实是我们在做出让步吗？”“一点都不这么觉得，科潘小姐。”她只是一个将军，并且她的代表身份并不来源于苏联的最高意志，要面对的却是敌方的最高领导人。想来起码气势上绝对不能落入下风。“如果我们真如你所言那般脆弱，那为什么不直接发动进攻呢?”\n“这倒确实，因为我军无意参与贵国内政上出现的这点“小问题”。起码不愿意为此牺牲我军珍贵的兵员。但是，我们离莫斯科终究也不远了，所以！我只问你一个问题。”科潘冬将手中的签筒狠狠砸向桌面，巨大的响声让奈叶都为之一惊。然而科潘最后只是从筒里抽了一签出来。“贵方究竟希不希望我军有所行动？如果无法确认贵方的真意——那就只能让这支签决定此战的未来是吉是凶。”\n用手掩住结果，科潘冬将该签放在桌上。“好了，奈叶小姐，给我你的回答，我再决定要不要展开它。”\n“......我军希望贵方能坚守停火协议。”虽说话里依旧带着强硬的语气，但其内容暂时决定了双方的胜负。\n看着有些迷惑的兰斯，志津香把他的耳朵拉到自己嘴边。“苏方并不清楚我们的退兵计划，她们为了平定内乱也迫切希望能和我军维持长期停火吧？只要一切顺利，留下少数部队殿后，我军便可安全的撤出俄罗斯了。”“也就是欺骗她们咯？”“倒也算不上。”\n“那么，我方期待和贵方继续敲定具体细节。”科潘冬笑着将签插回签筒。"
 als.215.a:0"顺带一提，结果是‘大凶’。"
 als.216.t:0"再遇"
 als.216.d:0"“痛痛痛痛痛！！！！！！”\n在人群中，再一次被紧紧抱住腰间，兰斯，发出悲鸣。\n“是那时候的叔叔！”小小的皮古高兴地冲过来，抱住了人群中的兰斯。并且更糟的是，志津香就在旁边。\n看着亲昵的小女孩抱着兰斯的大腿，从惊讶到不解再到怀疑，这位魔法师的眼神经历了这般变化后开始变得极其冰冷。\n“兰斯，你要到处沾花惹草我管不着，但是，这个岁数的孩子你不会都——”\n“不是！不是的！听我解释！这崽子只是遇见——”“是手很温暖的叔叔——”“啊啊啊啊你不要再说了！！！！”\n“叔叔是好人，送我去莫斯科。”“这娃子是在木之本格勒认识的，有人拜托我，就给她找了可以信任的人，送她去了莫斯科。”\n“但是，烈辽骗了我。”“唔，莫斯科并不安全，是吧？要是知道出了这么大乱子，本大爷说什么也不会送她离开。”\n志津香眼角向上挑了挑，神色温和了下来。“这种像个男人的时候要是多一点你也不会像现在这样人见狗嫌。”\n兰斯将小皮古抱起来，“那么，你是怎么来到基辅的？”皮古晃了晃脑袋。“先是走，然后搭别人的车，然后坐火车，然后再走，走着走着，就来了。”“总感觉说了跟没说没什么区别。”兰斯摸了摸她的额头，这似乎让她很高兴，继续兴奋地朝着兰斯的怀里钻。\n“这孩子，为什么对你这么亲昵啊？”“谁知道。”看着这俩人，志津香总觉得心理有点发堵。“一定发生过什么...”\n“你这家伙不会是嫉妒了吧？”“要嫉妒也是娜姬会嫉妒。只是觉得很不可思议。”“你啊......唔？”\n从孩子的怀里，兰斯抽出了一封信。“这是？”“是烈辽让我送给木之本樱姐姐的，可是，已经找不到她了。”\n兰斯的脸略略僵了一下“怎么找不到了呢？”\n“不知道，莫斯科上下都跑遍了也没找到，有人说姐姐死了，有人说被抓起来了。皮古不知道。”“这样啊...”\n“先把孩子送回兰斯城去吧，然后......”“目前，木之本樱生死未卜，本来我不想告诉你。”志津香将脸侧过去。"
 als.216.a:0"要是她还在，和谈又怎么可能推进的如此顺利。"
 als.217.t:0"与木之本樱的会面"
 als.217.d:0"“钟楼上的布置似乎已经完成了？托塔斯先生？”“嗯嗯，魔力装置已经安装好了，随时都可以把人送过去。不过——”\n“不过什么？”“如果贸然移动，可能会有意外发生......木之本樱是世所罕见的魔法师，光靠这边的力量，是不是有些难办？”\n少女依旧没有表现出些许情绪波动，“...也好，第一次见面时，因为抵抗的厉害，还没来得及好好谈谈，那就由我带她过去。你们，保护好场地就是——布尔什维克们现在也该反应过来了。“谨遵指示。”\n在大克里姆林宫的地下，她见到了被临时囚禁起来的，苏维埃联盟的最高领导者。木之本樱。\n不仅手、脚还有躯体都被紧紧的捆缚起来，为了防止她吟唱魔法，还将嘴巴堵上了。\n再见到她的时候，已经处于很凄惨的情况：连头都没有力气抬起，放任唾液从嘴角不住地垂下，滴在地上，发出一点一点细微的声音。\n当堵在嘴里的东西被抽了出来，轻微的水声化为一声声痛苦的喘息，然后，就可以开始交流了。\n“好久，好久不见，木之本主席，”少女蹲了下来，饶有兴趣地看着摊在地上的受囚者。\n“真是......好久不见，亚姆——亚姆·伊斯迈尔。”尽管使不上力，但木之本依旧直起身子，-颇具中气地回复着。\n“看样子内务部同志们的情报是正确的，这一切背后都是你这个前牧首在搞鬼。”面对指责，亚姆只是微微低下了头。"
 als.217.a:0"只是回来完成当初没做完的事情而已。"
 als.218.t:0"属于她的爱"
 als.218.d:0"“别猖狂了。”木之本樱冷笑了起来。“抓住我，一点用都没有，你的计划，早就失败了。”\n“......”\n“虽然，没有想到会成现在这个样子，但，但是，你们控制不了红军，也掌控不了苏维埃。我们，早就做好准备了，恐怕用不了多久，红军便会重新解放莫斯科。只是时间问题......”“嗯，是这样呢。”亚姆没有否认这一点。\n“苏维埃联盟，不会因为这种事就倒下。”“嗯嗯，确实是这样。”面对对方的预测，亚姆没有否定其中的任何一句话。”\n“不如说，这些都没有关系。”“什么？”“苏联、俄罗斯、莫斯科、红军，这些都无关紧要。”亚姆认真的，一字一句的说道。\n“我们的目标，从始至终，只有你，我们只需要你。”看着木之本樱的脸色露出些许震惊，她又补充起来。\n“唔，严格来说，应该是你拥有的——强大的魔力吧？”“你到底要，怎么样？”\n“哦，哦，既然你诚心诚意的问了，我就好好的回答你——才怪。”她双手捧起对方的脸，将嘴唇凑了上去。\n这是属于圣女——属于牧首——属于引导者的最崇高的仪式：来自法王的亲吻。当缠绕在一起的舌头分开，那张狼狈不堪的脸上，其瞳孔里，看上去似乎又浑浊了些许。“污染......吗？”“要让你的力量为我所用。你只需要知道这个就好。”"
 als.218.a:0"首先，是俄罗斯。"
 als.219.t:0"众神之敌"
 als.219.d:0"“你开什么玩笑？”科潘冬罕见的生起气来。\n“在方才的谈判里，我方，实在不好提出来，但是，至少污染者是我们共同的敌人，所以还请！还请.......”\n“我拒绝。”与刚刚台面上的谈判的表现截然相反，奈叶郑重地，向科潘冬低下了头，而后者却根本不吃这一套。\n“我刚才已经说的很清楚，这些问题，属于贵国的内政，请你不要忘记我们之间的立场。”\n“这些问题我很清楚！但，已经没有时间了，现在盘踞在莫斯科，并且直接控制着各地污染者的邪教本部——一旦她们胜利了，整个苏联就会万劫不复，到时候意大利军又怎能阻挡她们？你们不仅会被赶出俄罗斯，还会连累到欧洲的其他国家......”\n“我希望你明白，自由都市决不是待价而沽的第三方。并且，若赢得胜利的是你们，我们又该如何相信你们会信守停火协议呢？”科潘冬严肃地批驳着对方的言论。“罗马应对污染教团的历史比你们早得多，你们如何能让我相信帮助你们是必要的？就凭你几句利害关系就能说服我军的士兵与你们化干戈为玉帛，站在同一战线吗？别开玩笑了！”说完这些话后，科潘冬习惯性地从怀里抽出一签。\n“唔——小吉......如果是你们的主席亲自来谈，倒还有谈判的余地，但就凭你，还不够格。”\n“事实上，请原谅，突然提出这种无理的要求，和主席......也有关系。”奈叶的眼角有些闪躲。“唔，有她的下落了吗？”\n“...就在莫斯科，在克里姆林宫里，对方，似乎劫持了木之本樱主席。”“...虽然是敌人，但毕竟落在引导者手里，应该也是蛮惨的欸。不由得同情起来了。”科潘冬的脸色稍稍缓和下来。“不过别想着我改变主意，自由都市不会参与你们之间的争斗，绝对不会。”\n“抱歉，是我欠考虑了。”攥了攥拳，对方终于还是低下了头，准备放弃这个有些突兀的请求。\n“慢——着！”话音未落，科潘冬从后面被一双大手一把抱了起来。“喂喂兰斯！别这样别这样！在谈判啊喂！”\n当奈叶抬起头，狡诈而又有些威严的意大利总理正被不知道从哪来的男人高高举起，晃来晃去。快要哭出来了。"
 als.219.a:0"本大爷来啦！让本大爷看看怎么个事？"
 als.220.t:0"冒险者的归来"
 als.220.d:0"看着眼前这个眼里重新燃起点点希望的少女，哪怕她还没说什么，兰斯便感到相当受用了。\n“是，您是兰斯先生？”“对头，意大利军的总司令，是统帅意军的总大帅哦。”“是前，前总司令！已经是好久以前了的事了哇！”\n在兰斯怀抱里，科潘冬还在憋足了劲儿抗议着，可是兰斯依旧在自说自话。“这个小不点暂时不用管她，你说，现在你们俄国人需要我们的帮助?”“呃，唔，某种程度上，只是我个人的请求——”“明明刚刚都鼓起勇气说出来了，现在还害躁什么，本大爷可比这个小不点儿格局大多了。”“兰斯你这混蛋——呜呜呜，好想哭。”科潘冬的领袖风范，在敌人面前，碎了一地。\n“莫斯科的同志们昨天向我们传来消息，主席小姐被囚禁在克里姆林宫内。对方的领袖，亚姆·伊斯迈尔，似乎要对她图谋不诡。”奈叶放在胸前的拳头又攥地更紧了些。“每过一天，主席可能遭遇的危险就会越大，可是，目前能够调动的部队，要么离首都太远，要么便还没有恢复作战能力。故才——出此下策。起码，要尽快把小樱救出来。”\n“看得出来，作为一方代表，要向敌人求助，也是一件蛮有压力的事嘞。嘎哈哈哈哈哈...”兰斯哈哈笑了起来\n“也，也就是说，如果有您出面，还是能......”“应该不能吧？毕竟科潘冬都这么说了。”“欸？”\n“就是说啊——”科潘用了吃奶的力气挣脱了兰斯的怀抱。“他只是前总司令，前任哦，现在顶多算个将军而已。”\n“哪怕是他，也没法替意大利决定这种要紧的事情。”\n“是啊，虽然本大爷再不这么说这家伙就真要哭出来了。”\n“呃呃——你这家伙！”\n“但是，确实，要找除了本大爷以外的人，应该还是不行吧？让士兵突然和你们并肩作战什么的，确实很难想象。”\n“...也就是说，只能缔结私人性质的条约？”\n“换句话说，兰斯你的意思是，由你带着部队过去吗？”科潘冬还是摇了摇头。“军队终归要进入苏占区，会很麻烦吧？”\n“明明刚刚拒绝的那么强硬...现在居然真的考虑起来了...”看着刚刚还极其强硬的意军统领此刻头痛的样子，高町奈叶自忖着。\n“虽然听说过，只是个地痞流氓出身，但是...唔...是很会吃软饭吗？”\n兰斯依旧摇了摇头。“和军队什么的没有关系啊，从始至终，能受本大爷调遣的只有一个人而已——你应该也明白吧？”\n兰斯摆出了个指向自己的大拇指，“当然是——本大爷自己啦。”\n“这种程度的小事态，要嚷嚷着动用军队本来就挺大惊小怪的不是吗？本大爷出马，区区木之本樱，不过是随手的事情。”\n“......”“......”"
 als.220.a:0"唔......怎么都不说话？"
 als.221.t:0"大失所望"
 als.221.d:0"“先生，我们在讨论的事情很重要，这关乎两国的未来，请您自重，至少不要开这种无意义的玩笑。科潘小姐，是吧？”\n被这种孩子气的，不负责任的发言所激怒，奈叶的话语里再一次溢出凛然的正气。然而，对面却并未搭腔。\n“......”\n“科潘小姐？”不知何时，科潘冬闭上了眼，皱着眉头，似乎在考虑着什么。\n“高町小姐，暂且先到这里吧？我方需要仔细斟酌一下贵方的请求。”睁开眼时，她又变成了最开始的样子。甩甩手结束了对话。\n“唔——了解了，我方会耐心等待答复的。”虽然很是疑惑，她还是微微了一躬。随即带着代表人员快步离开。\n看着苏联代表团离开，科潘背对着兰斯，轻轻地问了一句：\n“什么时候下的决定？”\n“看着对面的小俏脸自然而然就说出来了而已。”\n“你就扯吧......听好，麻烦的地方不仅在莫斯科，哪怕和苏联人打好招呼，现在也根本不知道可能会拦在路上的，是正常的俄军，还是污染军队。一样，各地的城镇，大多也都爆发了污染，无法停留。哪怕是这样，你也要一个人去吗？”\n“奇怪，你不反对本大爷去吗？”\n“是错觉啦，实际上我现在就想给你一巴掌，让人把你绑着扔回兰斯城去嘞。这种破事你越少掺和越好。”\n“那为什么还这么说？”\n“但你想去...那就只能去了吧？毕竟，你是为了她才趟进这趟浑水里的，不是么？”\n“确实是这样，得赶在她彻底坏掉之前救出来。”\n“但我必须说，这一点都不值得，超级不值得的。”\n“只要把小樱妹妹弄到手，对本大爷来说，就是超级值得。”"
 als.221.a:0"有时候哇，咱家觉得，兰斯君真的怪可怜的。"
 als.222.t:0"启程"
 als.222.d:0"“唔，小冬也不来送下么。”靠在卡车后面，兰斯看着熟悉的二人组，轻叹一声。“你这家伙就算了，为什么娜姬也——”\n“因为兰斯要去冒险嘛，这种经历也很难有下一次了，不是吗？”帅气地戴上和姐姐同款的魔法师帽，娜姬有些兴奋地嚷嚷着。\n“你这家伙死哪去都和我没关系，不过科潘冬拜托过，姑且叮嘱几句而已。”抱着手臂，志津香依旧一脸冷漠。\n“包括娜姬，怎么可能会让她跟着你。”“欸——”\n看了看卡车，似乎是确认了兰斯真的要离开，她的话里不免还是夹了些许落寞。“虽然知道你一直很蠢，不过怎么也没想到会蠢到这种地步。”“不跟过来就不要说这种不情不愿的话了，感觉像是本大爷把你甩开似的。”“哪有那回事！”\n她将一只仪表塞到兰斯手里，“在巴比伦塔用过的，检测污染指数的设备，虽然苏联人已经划出来一道相对安全的路线，但谁也不知道途中会不会出什么意外......嘛，不过科潘她亲自出面，帮你和相关防区的苏军大体都打过招呼了，至少这一路算不上特别危险。”\n“但是到了莫斯科就说不定了。”“当然——我要说的就这么多。”虽然话说完了，但志津香迟迟没动，似乎还想再说些什么。\n“还不走么？果然还是放不下本大爷吗？”“才没有那回事。”挠了挠脑袋，看上去她确实有些纠结。"
 als.222.a:0"果然，你打算一个人...为什么呢？"
 als.223.t:0"我不知道"
 als.223.d:0"“真要说的话，我也不知道。”兰斯捋捋下巴，给出了他的回答。“也许，本大爷就是去送死呢，这种事，谁又说的清楚。”\n听着这个回答，志津香叹了口气，上前去，只是轻轻地扇了一巴掌，作为她的回应。“我唯一不能接受的就是这个回答哦。”\n“成功也好，失败也罢，只要求你活着回来。哪怕是为了娜姬呢？”“呵....嘎哈哈哈哈哈哈！说什么嘛志津香，这不是超可爱的吗？”\n“啊？”“嗯，决定了——要在莫斯科轰轰烈烈的死掉啊。”\n“欸？兰斯要去死吗？”娜姬惊讶地捂住下巴。\n“喂喂，这时候乱说什么！”志津香再一次被轻易的惹怒了。“我是认真的！”“本大爷也是认真的。”\n“决定了，要和亚姆酱同归于尽，然后剩下最后一口气，再死在小樱酱的怀里啊，哦哦，艺术氛围会拉满的呀。”\n“赌气也要有个限度——”“不管不管，死后本大爷的灵魂还要跑回来，要看到志津香成为寡妇以后穿着丧服在兰斯城哭成泪人的样子再成佛嘞。”“呜呜，那我怎么办...”“兰斯城就留给你俩好了，哦哦对趁着还没出发先写个——啊啊啊！！！”\n一个手刀劈在腰上，兰斯顿时痛的弯下腰。“喂喂打哪不好.......给腰子打坏了本大爷真得去死了。”\n“真是够了！没一个火爆破把你和车都炸上天算我心情好！啊啊啊！受不了，我跟你一起去！”“咱就说志津香还是放不下......”\n“好啦好啦，你们俩都是超级——不坦率的人呢。”娜姬扶起吃痛的兰斯，“也就是说——接下来就是三人冒险了！对吧兰斯？”\n兰斯看了看志津香，这一次她嘟着嘴把脸撇到一边，意外地没作声。"
 als.223.a:0"果然，还是这样最好。"
 als.224.t:0"难绷的男人和无奈的女人"
 als.224.d:0"看着远处一大群游荡的污染者，兰斯有些恼怒地问起志津香，“不是说这条路线是安全的吗？不是各处都打过招呼了吗？”\n“大体上是这样。”“大体上？”这次轮到志津香对兰斯耸起肩膀。“嘛，毕竟事发突然，突然和对方提起有个意大利人要开车过来，还要为他筹划好路线这种要求，想来会有相当一部分苏军不放在心上吧？”“还有百来公里就到莫斯科了，难道要在这把车丢掉？”\n“当然不能啦，虽然不多，但车上的辎重也不是我们搬得动的。”娜姬坐在卡车后面，有些懒洋洋地补充着。\n“那绕开？”“应该也不行吧？在斯摩棱斯克出发时补给到的油料不多，所以——”\n“刚好只够走完这条路？”“勉勉强强吧，要是绕路走，那就还得弃车。”“呃啊啊啊，搞什么嘛。”兰斯有些丧气地砸了下方向盘。\n“那怎么办啊？”“冲过去呗。”“这是军卡，又不是坦克，我们会被打成筛子的吧？”“唉，还好我跟着你过来了——娜姬！”\n姐妹两人站在了卡车顶上，眼前远远的能够看见盘踞在哨卡前的，漫无目的地游荡着的那群行尸走肉。“就像练习的那样就行了。”\n“嗯嗯！试试看吧！”娜姬牵起姐姐的手，随着两人吟唱起魔法，坐在下面的兰斯只觉车里车外一阵地动山摇。\n“哇啊！你们要干什么！要要要要死了哇！”\n一道黑色的巨大光束在两人的手中被释放出来，这道黑色光束所经之处，几乎所有东西，包括光线，都以前者为中心慢慢扭曲。"
 als.224.a:0"黑色破坏光线！"
 als.225.t:0"斯拉夫平原的夜空"
 als.225.d:0"当天色暗下来时，距离莫斯科已经不远了。三人开离大道，找了个地方停下车，扎起了营。围在了篝火前面。\n炖菜在火上慢慢煨着，渗出的香气让兰斯着实放松了下来，连日行车，一路上虽说除开今天没有出现过危险，但确实是相当累。\n“兰斯！卡奥斯爷爷说想下来透口气。”娜姬的声音在车里响了起来。“唔——管那破剑作甚。”“欸——卡奥斯爷爷真可怜啊。”\n虽然这么说着，但娜姬还是把魔剑拿了下来。“哦哦——这就是露西亚的夜晚吗，虽然有点太冷了，不过空气确实让人心旷神怡。”\n“你个破剑还挺会享受。”“哪怕是我这样，偶尔也会想要追求下高质量生活嘛——心之友啊......”“什么事？”\n“明天，要决胜负了吧？”“唔——”\n“的确是这样。”回答魔剑之问的，是端着碗炖菜走过来的志津香。\n“赶上了好时候呢，明天苏军会向莫斯科发动进攻，那就是我们的机会。”\n她把东西拿到兰斯手里。“再吃一碗吧，也好暖暖身子。”“唔，好吧。”兰斯毫不客气的又一次狼吞虎咽了一起来。\n“啊，啊，笑起来了笑起来了。”看着那张，因为兰斯光顾着吃饭看不到别处，而慢慢露出来的笑容，魔剑开始小声起哄。\n“再吵把你用布裹住。”“当我没说，就当我在看星星。”这柄破剑很识时务。\n“嗯嗯，吃饱了。”兰斯顺势躺了下来。“刚吃完东西不要就这么躺下，对身体不好。”志津香坐在他旁边。\n“明天会不会把命丢掉都不清楚，管这么多干嘛。”“咳，说过了啊，别说这种话。”“好的好的。明白啦。”兰斯顺从地答应着。\n慢慢地。兰斯的手拢住志津香的腰肢。“你又要干嘛？”“过来就是。”她也就顺势躺在兰斯的身边。“娜姬在呢，别想多了。”\n“好的好的，这样就好。”凝视着眼前披着繁星的夜空，兰斯不再出声，逐渐也没了动静。"
 als.225.a:0"...兰斯...兰斯？"
 als.226.t:0"斯拉夫平原的夜空"
 als.226.d:0"“唔唔，什么事？”“没什么...以为你睡着了而已。”“......”\n同样凝视着这片夜空，反而是志津香有些受不了过于安静的氛围。“呐，兰斯？”“有什么想说的，说就是了。”\n“其实，不是撒娇什么的，虽然的确想，但我本来确实不打算跟着你来的。”“骗谁呢，本大爷稍微要死要活不还是把你拿捏住了。”\n“不，不是这样的，当时听你说这些话，内心深处，的确有种让人不安的想法。这才跟过来啊。”\n“你觉得本大爷真的想过去死吗？”\n“......也许呢？”\n这句话说出口，志津香反而痛快了些。“也许你只是没意识到而已，也许你，真的有想到过这方面的事情吧？”\n兰斯没有回答。 “哪怕是木之本樱，哪怕是当世最强的魔法少女...几率也无限接近于0呢。”逐渐的，她开始说出自己的不安。\n“反正现在我说明白了也无妨，你是不是，也有些厌倦了呢？毕竟，已经过了很久很久啊，到现在，连身子骨也终于开始......唔......”\n志津香戳了戳兰斯，没有回应，看来他确实是睡过去了。于是她将毛毯拿了过来，披在他身上，然后，钻了进去。\n慢慢地，有些温柔地，志津香抱住那具身体。“嘛，就当我想多了吧。”"
 als.226.a:0"晚安，兰斯。"
 als.227.t:0"战前会议"
 als.227.d:0"莫斯科城郊，苏联临时前线指挥部内\n看着眼前那位叫做高町奈叶的将军眼中那难以置信的眼神，兰斯不由得得意起来。\n“虽然已经听科潘女士说清了原委——但是所谓来自意大利的援军真的就你这家伙吗！？”\n“喂喂！第一！本大爷是全人类最强的战士，有本大爷助阵你们高兴还来不及，第二——”兰斯手指了指身后两小只。\n“谁说本大爷就一个人的，这不是多了俩？”“你——”奈叶被噎到一时说不出话。\n“呜呜...对面那个阿姨表情好可怕...”娜姬往后退了一步，戳起手指。“要和昨日还是敌人的苏军协同作战，我们也——”\n志津香只是拉下帽檐叹了口气。“...那位绿色头发的小姐我倒有印象，我们交过手吧？”“的确如此，所以对你们的总体实力我倒不怀疑就是。”“阁下的实力也不遑多让，苏联和自由都市的魔导部队在规模上差距极大，阁下能以一己之力扳平这种数量差距，我也不能对阁下失了敬意。”“喂喂，那把整个意大利军队和苏军的数量差距扭转过来的本大爷呢？就没有一点敬意？”“抱歉...完全没有。”\n生怕兰斯再耍活宝弄出变数，志津香连忙接茬。“所以，接下来是木之本樱的救出作战，这一点双方应该能达成共识。”\n“对，但也不全对，这次也是收复莫斯科的战役。只要能把引导者驱逐出这里，大概就能结束军队的混乱局面。”\n“当然，前提是主席能够被平安救出...”“小妹妹你就放心好啦，有本大爷出马保证给她全须全尾的带回来啊。”\n高町奈叶看着兰斯的眼神变得冰冷，“我先声明，如果，我是说如果，主席同志在被救出的时候，遭到了不公正的对待...”\n“那又怎么样？”“我保证整个苏维埃联盟的军队会与你不死不休。”“啧，说的还煞有介事...好像你们加起来就能赢过本大爷一样。”\n“你！”叉开剑拔弩张的二人，志津香深深叹了口气。“总之，苏军还请在对莫斯科的进攻中全力以赴。”\n“这自然不必说，虽然数量上不占优势，但我们不会坐视古都就这么被邪教徒占据。”“那样就好...”"
 als.227.a:0"这也是为我们创造机会。"
 als.228.t:0"倒计时"
 als.228.d:0"外面炮声真是震耳欲聋，布尔什维克真是毫不吝惜这座城市。不过，毕竟你在这，再怎样他们也不会将炮火瞄准这里。放心好了。\n本来还想和你说些什么的，但信徒们都说缚虎不得不紧，虽然我不觉得如今你还有什么能力造次，嘛，姑且还是把你的嘴堵上吧。\n我方的人数有十万，虽然有不少是手无寸铁的人，不过只是拖延时间的话，应该也够了。\n你应该能感觉到吧，体内的魔力正在被慢慢的抽走，只留下躯壳。这个装置是为了今天特意准备的。为我的诅咒提供足够的能源。\n要做的事情本身其实很简单，不过是简单的将污染块用作扩散诅咒的原材料而已。但毕竟目标范围很大，要大到包括整个俄罗斯，所以嘛，就只能在量上下功夫了。制备如此大数量的污染块也是累死我了——当然，另外还需要的就是，你无出其右的蕴藏魔力。\n看你的样子，你似乎并不相信？可以理解，事实上我对此也不是很有信心。\n在罗马的时候，好歹还有专精于此的卡拉人可以使用，现在我只能自己上了，说实话，能不能成功，我心里也没什么底。\n唉，在你的面前露怯了啊，是我的错，不过放心，再有七八个小时，哪怕把你扔在一边你也没法妨碍我什么的。\n唔，必须承认，你的意志是真的很强大，努力了这么久，污染程度还是突破不了70%，本来还设想过，将你转变为我们的信徒后由你自己来做这件事。但现在看来还是把你吃干抹净最好。\n终于坐不住了吗？不用摆出那种样子，今天，与明天，不会有太大差别的。\n全俄罗斯的人，都将逃脱神之魔爪，从明日起，神明将再也不能“剥削”俄罗斯的人民了。\n可惜，你们完全理解不了。你们不知道苦痛——与绝望的根源，固执的相信自己的那一套理念，该说是坚定，还是愚蠢呢？\n......时候差不多了\n......再见，木之本樱主席\n......神，将忘却你，忘却你们所有人"
 als.228.a:0"木之本樱，以及俄罗斯的命运，只剩下数个小时的时间。"
 als.229.t:0"决战之前"
 als.229.d:0"布尔什维克与东正教徒的最后一战开始了。\n由苏军从正面突破城区的抵抗并吸引注意，而来自意大利军的另一支奇兵则负责进行对木之本樱的营救作战。\n现在，在城区内，望着克里姆林宫的红星，带着防毒面罩的红军战士们，正在缓慢而坚定的突破城区内布置的数道防线。\n“喔喔，真是热闹起来了。”远远看着充斥着枪炮声的，时不时还能看见几处爆炸的居民区，卡奥斯调侃着。\n“那群俄罗斯人，看着就很拼命呢，也是，关系到她们敬爱的慈母的安危，当然要如此。”兰斯撇着嘴，笑了起来。\n“唉，没想到，到最后，居然真的，就因为赌那一口气，便陪你来到这种地方了啊......” 志津香叹了口气。\n“哈哈，这不是常有的事嘛，不过，接下来，确实会相当危险哦，你们俩要上吗？”\n“那还能怎么办？难道要看着你过去送死，结束之后再去给你收尸吗？”\n“唉唉，每到紧张的时候就说不出好听的话呢，姐姐。”\n“并且...”志津香把帽子往下拉了拉，“我和引导者那伙人之间也算是有笔账要算吧？自己的事果然还是自己解决了最好。”\n“行吧...那么，你们俩，待会儿都不要离开本大爷喔。”“好的好的...本来就不会离开的。”\n“你刚刚，说出了很可爱的话啊。”“才没有。”\n“好了，现在该用一场华丽的突击去吓破那群邪教徒的胆子了。”“吓破她们的胆子！”“...虽然但是，别学那个男人。”\n“听你姐姐的——明明长大了，在学长辈说话这一点上依然让人苦恼...要上了。” “再等一下。” “干嘛，志津香？”"
 als.229.a:0"兰斯...把这当作最后一战吧。"
 als.230.t:0"最后"
 als.230.d:0"“唔？起码得先让小樱抢过来，然后...”“她一定会失败的吧，之后，你打算怎么办？”\n“呃.....”兰斯不置可否，他只是向上翻起眼睛，似乎真的在思索着什么。\n“那就，一起回兰斯城吧，我也懒得在军队里呆下去了。”志津香温柔地向兰斯伸出手。\n“就像一切开始以前那样，阿叔回来住吧？一起才热闹嘛。”\n“这可是决战喔，至于这么特地插旗吗？”“反正也只是自己吓自己吧？”“....倒也是。”\n兰斯迈开了步伐，三人向着远处的建筑群疾驰而去。\n最先挡在他们前面的，并不是污染者，而是有着自我意识的，以其忠诚服侍牧首的，引导者的武装信徒们。交火——激烈的交火随即爆发。兰斯当然不会蠢到只带着一把剑便冲上火线。挂在甲胄两侧的两把手枪此刻向着着猝不及防的亚姆的亲卫队一刻不停的喷吐火舌。当然，他并不是这支奇兵的主力。\n“黑色破坏光线！”魔法师姐妹压箱底的招数可以轻松将眼前的抵抗化为齑粉。在目睹了一发连光线都能扭曲的破坏光束贯穿了工事，在他们中间闪过之后，教徒们的士气以极快的速度跌至谷底。\n“这...这是上帝亲自下凡才能阻止的人呐...不行了！得跑了哇！果然还是活下去才要紧啊！”几百名特地守卫在克里姆林宫内的，引导者最为精锐且最“忠诚”的武装教徒被区区三个人给驱散了。最后一道防线在决战的开始即宣告崩溃。"
 als.230.a:0"闻到美少女的味道了，你们俩，跟紧我啊"
 als.249.t:0"高塔之上"
 als.249.d:0"与三十年前，兰斯踏上巴比伦塔那一次如出一辙，魔力波动最为强烈的地方，在那座高耸的大钟楼上。\n每往上一层，阻挡着兰斯一行的人便越少，与之相对的，压抑，沉重的气氛便会愈发浓厚，这并非是心理作用。\n“果然，和当时她在巴比伦塔时打算做的一样，她要发动的是散播污染的诅咒魔法...”\n感受着周围压抑的氛围，志津香咬咬牙，确定了自己的论断。\n“诅咒...魔法？没听说过呢，姐姐。”“很难说那究竟算不算是魔法，不过，的的确确需要巨大的魔力进行驱动。问题是，那可是木之本樱，传说中的魔法少女，如果她的力量被完全拿来驱动诅咒仪式的话——” “总不会污染整个俄罗斯吧？”兰斯开玩笑似地说。\n“...难说啊。”\n三人总算来到了最高处——塔楼之顶。而兰斯，总算是见到了心心念念的木之本樱。\n她的四肢被捆缚住。嘴鼻被蒙上，脊柱上接着几根粗大的软管——其尽头，接在一个类似能量罐的装置上，兰斯能清楚的看见软管里晶莹发亮的东西。木之本樱看上去失去了意识，眼睛半闭半开，而从那半睁的眼睑向里看去，能看到不少漆黑色的浑浊物。\n兰斯东张西望了好久，才发现了亚姆的所在——她小小的身躯就跪坐在受难的，木之本樱的前面，双手合十，正在默默的祷告。"
 als.249.a:0"为了她所深爱着的的所有人"
 als.231.t:0"慈爱之心"
 als.231.d:0"“喂，亚姆酱，准备好让本大爷的超级兵器二进宫了吗？。”\n明明连周围的空气都无比沉重，但看到那位白发少女的时候，兰斯的家伙儿还是迅速地挺立起来。\n“兰斯！”志津香都不知道应该说啥才好。“啧啧，亚姆酱，不理我吗？那就只能像上次一样，用老二把你弄到惨叫连连，让你像条蛆虫一样被我按在地上乱颤咯。”听见这番话，眼前穿着黑色哥特裙的白发少女才摇了摇头，有些不耐烦的叹口气，缓缓站了起来。\n“上次见面的时候，没有那位教皇大人，您已经成为我们的一员了，现在想来，真是遗憾。”\n“跟库鲁库没有关系，哪怕她不来，你也会在我的超级兵器下完全屈服的嘞。”兰斯的笑容愈发邪恶，猥琐。\n“...也许吧？”亚姆的眼神直视着兰斯，瞳孔里闪现出些许慈爱。“我知道,你为何而来；我知道，你为何必须来。”\n“因为本大爷的老二想念你的活计了啊，虽然已经破过处了，但是封印了几十年也没人用过，想必还是超级名器啊，哈哈。”\n“如果，她不行呢？也许，再一次打倒我，也不过是让事情更加恶化而已喔——你没有意识到吗？胜利或失败，在那之后，你能看到的，也都只有更深的绝望啊。”亚姆慢慢走近。“兰斯...默默吞咽二十年的孤独还不够？还要进一步毁掉自己存于世间的理由吗？”\n“真的是，还在吹嘘这些有的没的。”兰斯将背上的剑取下，“你，要被老子打趴下，然后，被老子抱，而且这次，要彻彻底底让你记住本大爷的老二的形状，让你再也离不开本大爷，就这么简单。”"
 als.231.a:0"没办法了，虽然把魔力浪费在这里也很让人心疼..."
 als.232.t:0"审判日"
 als.232.d:0"作为亚姆的最终回应，魔力存储装置开始发出强光，看上去几如死尸的木之本樱竟也发出了浅浅的呻吟。而亚姆本人，伸出右手触摸那个装置。溢出的，明亮的魔力变得漆黑，先是像雾气一样弥漫在亚姆周围，然后，凝结起来，变得坚硬——慢慢的，在亚姆的面前，从地上，慢慢长了出来。那巨大的，蠕动着的——“荆棘”。\n“真的是，反正也要干一架，还说这么多废话。”兰斯有些缺心眼的淫笑起来。只是，恐怕，在他内心的深处，也许完全听得懂亚姆所言何物吧？不过，管她呢，他要上她，耶稣来了都拦不住他。那就暂时没有必要考虑其他事情。\n“荆棘”化作真正的活物，将亚姆包裹在其中。这头怪物随即发出了尖啸，娜姬连忙捂住耳朵。\n“兰斯，我对你只有一个要求。”右手已然凝结出一团跃动的火焰，志津香甚至没有看向兰斯，而是一脸平静地注视着面前的怪物。\n“我被害的这么惨都是因为这家伙，所以这次，要把这个小鬼，揍到再也爬不起来呀。”“切，还用你说么？”\n...\n亚姆·伊斯迈尔 被称为罗马的圣女\n罗马教廷的第一位女教皇，也是莫斯科第一位女性牧首。\n对上帝最为虔诚的信徒，也是其最恶劣的背叛者。\n她的信仰从未改变，在触碰到神的真实之后，那颗想要为人类带来救赎的本心越发强烈。\n她的愿望扭曲了吗？也许并没有，也许她对人类的礼赞才是唯一能带来救赎的方式。"
 als.232.a:0"只是，当她的愿望愈发单纯，便会显得愈发疯狂。"
 als.233.t:0"最后时刻"
 als.233.d:0"“呃！好...好痛...”当志津香从跌落带来的冲击中缓过神来时，她发现自己躺在坚实的大地上，而上半身正深埋在娜姬的怀里。“被，被一巴掌打下来了...”志津香有些懊恼的甩甩头，强迫自己从眩晕中清醒过来。\n“真的是！你被那个家伙一下子抡飞了啊，那可是80米的高空，再晚一点没兜住姐姐的话姐姐就要摔成肉泥了哦~”\n“对，对啊，那个家伙可还在——”志津香挣扎的想要起身，但左腹的剧痛让她一下子僵住。“嘶——怎么会...被荆棘刺穿了啊。”\n她看见自己的下腹部被几根尖刺戳出好几个小孔。从伤口处正汨汨流出暗红色的血液。“唔——光用回复术没法处理这种伤口，得去找医生...”“娜姬！”志津香嘶嘶吸着气，直视着妹妹的眼睛。“不是现在....看上面。”\n在姐妹的正上方，钟楼的最高处，那只由黑色荆棘构成的庞然巨物已经生长到和那个瞭望台一般大小，现在正挂在钟楼的浮雕上。远远的，也能看见另一个绿色的身影，他站在楼顶上，一柄魔剑在高空中如银蛇乱舞，将袭来的荆棘尽数斩作两段。但对方的攻击极其凶猛，哪怕是那个男人，一时竟也找不到反击的空隙。\n“娜姬，我们得，给那个家伙创造机会。”志津香抑制住小腹的抽搐，堪堪支起身体。紧紧握住娜姬小小的手掌。“我现在这样子没法施法，所以，得全部交给你。这种程度的怪物，你应该知道该用什么...你不是会露怯的人，对吧？”\n娜姬的脸稍稍红了些。“真，真的可以吗？如果伤到兰斯...就靠我真的可以...”她不自觉的摇摇头，咬住了下唇。\n“换做兰斯叔，他也会让你这么做的，相信我，也相信你的阿叔就行了。而且说到底，换做是他，也绝对会相信你的，不是吗？”\n志津香露出了，平时绝不会在兰斯面前显露的，只属于少女的灿烂笑容。攥着妹妹掌心的手逐渐发热。"
 als.233.a:0"那是魔力逐渐输入的证明。"
 als.234.t:0"待报之业"
 als.234.d:0"娜姬站了起来，另一只手抬起，瞄准了那只硕大无比的怪物。\n她再一次无畏地笑了起来。“这有什么难的，出发前练习过好多次了...对吧，姐姐？”“是啊，没什么难的。”\n周围的一切，包括光线，以娜姬的掌心为远点，逐渐扭曲，崩坏。一团漆黑的光点在她的手心生成，变得愈发巨大，然后，化作一道黑色的“光”，直直地向着另一团漆黑的物体射去。\n“去吧——黑色破坏光线！”不同于以往姐妹的齐声吟唱，这一次娜姬的唱诵之声分外高亢。而且，志津香极其熟悉那个声音。\n“绝不能再让你苟活！”愤怒的，悲伤的，在自己怀里消逝的，娜姬·苏·斯拉鲁的身影，此时，似乎与她的妹妹，重合在一起。\n志津香的视线模糊了起来，像是蒙上一层水汽，她用长袖狠狠擦了擦，却怎么都抹不去目中沆瀣。\n“兰斯，你这混蛋，我才不会给你收尸的...要赢啊——要狠狠地把她打趴下呀！”在心里，她默默地嘶喊着。\n黑色的，由黑色荆棘组成的怪物发出了疼痛的吼叫，它的身体被光束硬生生开出一个巨大的空洞。亚姆从荆棘里堪堪冒了出来。\n她吃痛的样子只有一瞬，但一瞬足矣。\n兰斯向前疾驰，轻松挑开那反应过来后再一次向他袭来的尖刺，他踏着塔顶上最高的一块砖石，一跃而起。他，与他的剑，一齐砸向那团硕大的荆棘。“你以为你很了解我吗？不过是在我脑子里做过一次客而已！无所谓了——等我的超级兵器把你真正顶到求饶之时，你就能彻底知道本大爷是什么样的人了！亚姆酱！”"
 als.234.a:0"一道绵长的哀鸣响彻克宫之上，随即一切归于平静。"
 als.235.t:0"阋墙消弭"
 als.235.d:0"当木之本樱醒转过来之时，她所珍视的人此刻围在她的身边，“小狼...知世...奈叶...”\n并不是感人的重逢环节会浪费笔墨，而是此刻把目光转向更加甜腻的场景似乎更加恰当。\n如血的残阳照在兰斯那硕大的身体上，而他挺立的老二更是在余晖下拉起一道长长的投影。没有考虑被击倒的亚姆在醒过来后还有没有继续反抗的可能性，兰斯一巴掌将恍惚中的亚姆扇的醒转过来。“给老子醒醒，亚姆酱。”“唔...哦...输掉了啊。”\n“你似乎还在故作平静呢，亚姆酱。”“因为已经被你强奸过一次了阿，说到底，最坏无非就是被咬上几口而已嘛。”\n这话成功将兰斯稍稍惹怒了，他怪笑起来，“好嘛，你还没有意识到啊——这不是一般的sex，这是针对亚姆酱的特殊惩罚哦！”\n此时的亚姆像一个破布娃娃般，身上的哥特裙被撕成碎片。露出了洁白的胴体，兰斯上下扫视了一遍，发现了盲点。\n“对啊，虽然上次已经夺走了你的处女——后面这不是还没开发过嘛！”“后，后面...”亚姆歪着脑袋，不太理解。\n“嘎哈哈，你马上就能理解了。”兰斯猛的沉下腰来，挺立的兵器在没有任何铺垫的情况下，径直刺穿了少女的后花园。\n“唔呃...啊啊啊啊啊啊！”亚姆的身体像触电般痉挛，原先的矜持因为突然而极端的疼痛而被击碎。\n兰斯强硬地，卖力地在未经开发的花园里进进出出，让她流出不少鲜血，“等，等一下，疼...慢一点！呃！”\n“这才哪到哪啊小鬼？”暴力的，不讲情面的冲刺持续了整整四十分钟，亚姆感受到的，是纯粹的痛苦。在这样堪称处刑的行为里根本谈不上有什么快感。听着少女的哭喊，兰斯得意的加速了他的动作。“nice！你这个小鬼总算没那么嚣张了，嘎哈哈哈！！”\n经历了这一切，发出了尖细但却始终无人理会的哭喊，结束之后，瘫软在地上的少女，抽搐着，喉咙里只能挤出不成调的呜咽。\n“好了，惩罚结束。这下你一定永远都没法忘记本大爷的超级兵器啦嘎哈哈哈。”"
 als.235.a:0"然后，眼前一黑，兰斯知道，这个小鬼又要跑到他脑子里做客了。"
 als.236.t:0"徒劳之事"
 als.236.d:0"“兰斯，我们，又见面了。”在“脑海里”——真的是一片平静的大海——亚姆站在水面上，发出了久违的问候。\n“喂喂，现实里被我整成那副惨样，怎么在这你又是一副无所谓的态度。”“唔——并不是无所谓啊。”\n“好痛，好痛啊，从被封印那一天到现在，还从来没有感受过那样的疼痛。真是痛的要哭出来了。”\n“既然被这么惩罚了，你也该学乖了吧？给本大爷道歉。”“对不起。”亚姆低下头，顺从的应着兰斯的话。\n“那么，这次来还是和上次一样，要洗脑本大爷吗？”“不...已经没那个必要了。”“哈哈，被惩罚后学乖了嘛。”\n“不全是。”亚姆暗红色的眼神直勾勾盯着兰斯。“战斗的时候我不确定，但现在，我确定了。你的污染值，早就超越70%了。”\n“这意味着什么？”“意味着你本该成为我们的一员...放下对生死的执念，和我们一起寻求救赎...”“真是瞎扯淡。”\n“呵呵，也许吧？”亚姆低下了头，看着平净无波的海面。“呐，我就问一个问题，然后我会离开，再也不会回来。”\n“...问吧。”\n“兰斯——兰斯君，现在的你，究竟是为了什么而活着呢？”\n“为了能搞到更多的妞，为了让本大爷的老二能够爽翻天。”\n琢磨着这番回答，亚姆轻轻的，叹了口气，但笑容依旧漂浮在她的脸上。“你真的，很不会撒谎呢。”\n“真是寂寞——明明周围有着许多值得留恋的事物，但都进不到你的心里。那块缺口，已经被空虚塞满了，没有留下一点位置。”"
 als.236.a:0"亚姆不会骗人，她轻轻的告别，从此不会再进入他的梦境。"
 als.237.t:0"冒险者的归还"
 als.237.d:0"“兰斯，怎么样？”当兰斯再一次睁开眼睛，眼前，是库鲁库白皙的脸。\n他的头正枕在库鲁库的膝上。“喂喂，库鲁库，啥时候来的？”“跟着苏联人一起过来的啊。”\n“你来晚了喔，这一点也不像你。”“是兰斯先生走的太快了。又自己一个人和亚姆小姐独处，上次的教训兰斯又忘记了吧。”\n“木之本樱呢？”“被接走了啊，不过没什么大碍，放心。”“唔——要是能趁乱来一发就好了。”他感到有点小小的可惜。\n“记得帮我把小樱要过来喔。”“好——的，不过要先处理那些还能抢救过来的污染者啊。我来到这里就是为了这个。”\n“意大利，和苏联还是敌人吧？”“大家都是上帝的子民，在这一点上教廷有教廷的进退...放心好了。”\n“哦，对了，亚姆呢？”“重新控制住了啊，不过要处置她会很麻烦吧？苏联人似乎更想找她算账呢。”\n兰斯慢慢的，抬起腰来，原先好了许多的腰又传来尖细的痛感。“累死本大爷了...”捂着腰子，兰斯的肩膀稍稍塌了下去。\n“享受这场冒险吗？”库鲁库只是笑盈盈地问。“总觉得有些虎头蛇尾。”“呵，反正，开心就好。”\n“啊啊——慢着，印象里志津香好像摔下去了...”“刚刚见到她们了，没有事。”兰斯点点头，在搀扶下慢慢站了起来。\n从窗户向下看去，莫斯科依旧喧闹着，但是战斗已经彻底结束。远远的，看着远处升起的炊烟，似乎能够闻到炖菜的香气。\n“库鲁库——这下就结束了。”“真的结束了吗？”“对本大爷来说都结束了，要回家咯。”“好的，请允许我陪着您。”"
 als.237.a:0"回去抱孩子吧。"
 als.238.t:0"决战之后。"
 als.238.d:0"两个星期之后，战端消弭。\n看着已经持续了一月有余的停火状态，木之本樱平静的选择结束这场战争。\n在哈尔科夫，她见到了意大利的总理。看着其亲自递交上来的和平协议，她没有过多犹豫，签上了字。\n应当看作是自由都市的，完全的胜利。喀山以西的苏联政权自此停止抵抗。随之崩溃的，是整个共产国际。\n作为交换，自由都市的联军撤回了乌克兰，在那里，陷落的大公国被重建——尽管科潘盘算的是，将此地变成新的“自由都市”。\n国内对这场残缺的胜利意见颇多，但显而易见的是，此举避免了至少数十万士兵的伤亡。\n台面上的事情，便到此为止。接下来，便是私人契约的谈判商定。\n木之本樱坐上了意大利的专车。虽然只有一天，但这位苏联的慈母要满足那位征服者的一个愿望。这是最终谈判的结果。\n虽然契约的缔结并不出自她的意志，但是，意方在此次事件中发挥的巨大作用使得这个要求难以拒绝。\n木之本樱并不是没有七情六欲的圣人，相反，她也有她深爱的人，因此，这也是一个需要付出觉悟才能答应的条件。\n毕竟，对方是那个，臭名昭著的鬼畜冒险者，将性爱放在一切事务之上的怪物。\n对他来说，能玷污苏联的慈母，这一定会成为他冒险生涯中浓墨重彩的一笔吧？\n她做好了准备，只是平静的为之后几乎一定会发生的事情做好了心理准备。"
 als.238.a:0"然而，当她真正见到那个男人时，她依旧会为接下来的展开感到惊讶。"
 als.239.t:0"履行约定之时"
 als.239.d:0"樱花国 尾张\n“您就是著名的木之本樱阁下吧？久仰您的大名。”身着一套稍显臃肿的连衣裙，一位长着尖细的精灵耳朵的蓝衣女子正拦在门前。\n“在下名叫帕斯特尔，就今天之事为阁下提供协助。”优雅地行了个礼。帕斯特尔的脸上闪过某种审视的神色，但只有一瞬。\n“今天您所见到的事情，还请严格保密。兰斯，就在里面。”“...不过是男女交欢之事而已，我已经做好准备，您不必如此多虑。”\n不行，想到接下来会遭遇什么样的对待，同志们的容颜浮现在脑海，哪怕是苏联的主席，此刻也掩不住面中悲戚。\n作为一位心有所属的女性，她设想过很多种情况。在路上，也会无比伤心地想着，自己会在什么样的氛围下被那位男人玷污。\n但是，她已经做好了觉悟，虽然不想承认这个规则，但胜者此刻，确实完全支配着败者。\n“不...果然您会这么想啊。”面前的女子轻轻叹了口气。随即将门推开。“总之，您需要做的，只有一件事而已。”\n然而，映入眼帘的，却远远超乎了她的预料。\n少女，一位被禁锢于坚冰中的少女，正摆在室内最显眼的位置。左侧，一个穿着绿色衣服的男人，背对着木之本樱，只是默默地注视着她，而他的身旁，也有一位绿衣女性，轻轻地，挽着他的左臂。也许是推门的声音很是轻微，半晌他们才注意到有人进入。"
 als.239.a:0"这...这是..."
 als.240.t:0"兰斯的请求"
 als.240.d:0"“您的要求，只是要我救这个少女吗？仅此而已吗？”“是啊，仅此而已，从始至终，找你就只是为了她而已。”\n“就因为这个愿望，便要闹到战争这种地步吗？”“啊啊，你误会了，那场战争和本大爷没有关系啊，但是，既然开战了，当然就没法正经地拜托你了。既然被迫成为了敌人，那就只能通过打败你来实现要求了，不是么？这已经是很好的结果了吧。”\n这个说法似乎很难反驳，木之本樱看着那位，依旧对着冰中少女目不转睛的男子。皱了皱眉头。“难道，没有一点非分之想？”\n“怎么可能没有，你可是老子的狩猎名单里最顶级的几个美少女...无妨，以后再找机会侵犯你就行了，这一次，就先让给她。”\n“这个孩子，是重要的人吗？”“不过是一个奴隶，但最近没法和她做爱，内心有些不爽了而已啊。”\n身旁的志津香拽了拽兰斯的袖角，“别抱太大希望喔，免得又给自己找不痛快。”\n这句话似乎勾起了木之本樱的胜负欲。她看上去提起了不少干劲。\n“这孩子，应该是得罪了哪个魔法师而被降下了诅咒吧？既然是救人，那这多多少少也是义不容辞的事。”\n“火。”小樱牌里迸发出一团明亮的火焰，火牌被延展开的烈焰簇拥着，升至空中，俯瞰着被困在冰中的少女，眼中闪过一丝居高临下的轻蔑，跃动的火舌便迅速缠绕在那块坚冰上。\n“没用的...这不是用寻常手段就能溶解的冰...欸？”\n志津香有些惊讶的看着那块沐浴在烈火中的冰块——从上而下，那块冰竟然真的开始慢慢的，融化。"
 als.240.a:0"哼，这也不是，普通的火哦。"
 als.241.t:0"逐渐融化的坚冰"
 als.241.d:0"小樱自信地，看着被火牌吞噬的冰块。“既然并不是很懂破解诅咒，那就干脆直接把封印砸碎吧！一定没问题的！”她的余光瞟向兰斯——后者的眼睛已经被那块正在慢慢融化的冰块牢牢控制。微微收缩的瞳孔里，映射出少女的容颜。\n“唔——有些喘不过气来...不过，绝对没问题的。”随着冰块自上而下的融化，少女的额头最先显露了出来，然后是鼻子，嘴唇...褪去了冰的折射，兰斯再一次将那张白皙的，有些憨态的睡脸看的清清楚楚。“已经融到脖子了，再有五分钟——”\n话没能说完，小樱只觉得嘴巴一甜，一股鲜血从紧闭的嘴里迸出。“怎么了...身体里...不听使唤。”帕斯特尔皱起了眉头。\n心，肺，胃，像是被一块石头压着一样——不，更像是被一只无形的手死死捏住，并且力度越来越大。\n在冰的周围，烈焰依旧猛烈，但融解的速度以肉眼可见的速率缓慢了下来。\n小樱半跪了下来，在她面前的似乎并不是一块冰，而是一个必须屈服，必须拜倒的存在，模糊的视线中，一个不可名状的怪物正坐在那块冰上，扭曲的面容注视着她...，不仅仅是嘴角，就连鼻里，都开始垂下一注鲜血。但这激起了她的斗志，她紧紧攥住法杖。\n兰斯没有看到他的身后，那个女人痛苦不已，七窍都流出鲜血的样子，他的眼里已只有面前这张，只存在于记忆里的脸，不由自主的，男人慢慢走进烈火。看着火中那张他朝思暮想的容颜，越来越近。然后——\n“火...”这是那个女孩，被寒冰尘封在此地26年之后，说出的第一个词。\n当她模糊的视野逐渐清晰，当她看清前方，烈火中，正在慢慢走近他的那个男人，第二个词，便也自然而然的脱口而出。"
 als.241.a:0"眼睛，慢慢的睁开；双唇，开始了蠕动。"
 als.242.t:0"梦"
 als.242.d:0"“兰斯大人...”\n“什么事？不是特别要紧的事情就揍你喔？”“呜呜...怎么这样...”\n“希露，希露想回去了...”“...怎么？对本大爷抢钱抢女人的行为终于忍受不了了吗？”\n“嘻嘻，不想也没用，你只是个奴隶而已，本大爷做什么，你没有否定的权力，这就是奴隶啊，嘎哈哈...”\n“不是，只是...”“只是什么？”“太危险了，这种风餐露宿的流寇日子，比当冒险者的时候危险太多了。”\n“啧，这可是关系到我们俩一生荣华富贵的大事情，蠢奴隶你就别担心了。”“富贵...也得有命才能花啊...”\n“希露...希露昨晚做了噩梦，梦见兰斯大人死了...所以才...”“梦都是反的，蠢货。”“这，这样啊...果然兰斯大人是。是不会...”\n“不，本大爷当然会死。”“诶？”“本大爷说到底也就是肉体凡身，哪天阎王爷不顺眼了就会把命收走的情况。”\n“可是，那，那希露就...”“蠢奴隶，真到那时候，你的职责就是给本大爷收尸，找个漂漂亮亮的地方葬起来，懂不懂？”\n“...”“呃...别在哪摆出一副要哭出来的样子，在此之前，你可都要给本大爷使唤！明白吗！要跟着本大爷不准逃掉，懂吗？”\n“会的——希露会一直跟着的...希露希望能永远跟着兰斯大人！”“这才对嘛，但是——”\n“好痛！”“三十岁以后就滚开吧，本大爷才不会抱半老徐娘的。”“怎么这样!”“啧，别哭别哭，你还没到那时候呢...”"
 als.242.a:0"呜呜...至少现在...还请希露一直跟着您..."
 als.243.t:0"再一次的警告"
 als.243.d:0"兰斯失去了理智。再场的其他人，只能看见那绿色的影子像是飞蛾一般扑进了火中。\n但是，他背后的木之本樱，意志力也到达了极限。火焰开始了狂乱的舞动。\n“兰斯！快离开！兰斯！该死！”当兰斯的手快要抚上那张脸的时候，志津香也冲进了火中，将兰斯一把撞开。\n随着小樱瘫倒在地上，火牌也瞬间消散。当烈焰褪去的一瞬间，只是一瞬间，冰块，便复原了。重新复原到光滑透明的样子。\n“志津香，你——”兰斯挣扎的爬起来，徒劳地看着那张，重新闭上双眼的面容。\n刚刚，他的双手马上就能触及肌肤，但现在，他能触碰到的，又变成了冰凉的障壁。\n“为什么...阻止我？”当虚弱的木之本樱被帕斯特尔抱起时，她吃力的问着，她能感受到，是面前的女人发力。强制中断了施法。\n“没有用了，已经失败了。再硬撑着，你会有性命之虞。”帕斯特尔唤来一位侍女。“把她送去医院，拜托了。”\n“慢着...慢着！”乱了心神的木之本樱又咳出一点血沫，“那个...封印者，是谁！？”帕斯特尔没有回答她，“请保守秘密。”\n“喂！兰斯！兰斯！是谁封印了她！？那是什么，那是什么力量！？那种、压迫的、魔鬼一般的力量——究竟来自哪里啊！？”\n兰斯没有理会她最后的呼喊，只是怔怔地看着前方。看着再一次被隔开的，刚刚明明马上，马上就能触及的白皙面庞。\n“这是，理所当然的结果。”帕斯特尔看了看和兰斯一个表情的志津香，闭上了眼，如此说道。\n“解除诅咒比施放诅咒困难得多，所以，别说什么魔法师了，哪怕真的有接近魔王的存在，要解除诅咒都是不可能的。”\n“而且，没有东西能够超越——”“同样的话讲了十几年了你这家伙不烦吗，帕斯特尔？”兰斯的声音里只剩下淡淡的失落。\n“我讲或不讲，道理也是一直存在的啊。你又不肯去找那位...那就只能放弃了吧？”\n兰斯甩了甩头，返身朝门口走去，丢下了呆在原地的两个女人。“喂喂，你们愣着干什么，跟我来。”\n“你要干什么，兰斯？”"
 als.243.a:0"sex。"
 als.244.t:0"宴"
 als.244.d:0"屋内，不大的房间里正回荡着淫靡的喘息声。其中还交杂着交合时一进一出的水声。\n已经两个小时，兰斯不觉疲累的，尽情的做着。\n在他的面前，从肉体到精神上都已濒临极限的三个女人瘫在床上，在这场狂乱的肉宴里吃尽苦头。\n一个一个的抱，从科潘冬开始，再到帕斯特尔，再到尚未伤愈的志津香，每一个人都已饱受蹂躏。\n她们的小腹微微隆起，然而却连将多余物排出来的空闲都没有，兰斯沉默着，只是继续他的暴行，挑战着女性器官的极限。\n丝毫没在考虑她们是否会累，是否会痛。兰斯便是如此残忍地对待着他所珍视的，也多少珍视着他的三个女性。\n这一次，兰斯比起任何时候都更加以自己为中心来sex。\n兰斯粗暴的，抓着科潘的，帕斯特尔的头发，一次又一次地施暴。知道自己做的很过分，但听着她们逐渐弱下去的哭喊声，却依旧准备着继续做更过分的事。一言不发的抱，没完没了的抱，施虐一般的抱。\n一刻也不曾也不曾停歇。似乎永远都不会筋疲力尽。"
 als.244.a:0"他仿佛要榨干自己一般"
 als.245.t:0"宴后"
 als.245.d:0"特地为他赶过来的科潘冬，小小的身躯上，小腹的隆起已清晰可见。当兰斯结束时，随着她的一声声痛苦的喘息，体内的污秽在呼吸之间一波一波地溢出；帕斯特尔相对情况好一点，自己的三位先祖经常借用她的身体和兰斯交欢，她应对这种长时间的行为相对也更习惯一点。虽然，哪怕到现在她都算不上多爱兰斯，但今夜，她愿意陪着他继续这场痛苦的狂欢。\n最凄惨的是志津香，在第二次的时候，小腹上仍在包扎的伤口因为剧烈的动作被无情的撕裂开来。袭来的剧痛早已压过快感。\n“停下！兰斯！等等！呃！啊啊啊啊！停下，求你了！兰斯！好...好痛...”\n从纱布里渗出的血逐渐流下，和白浊交融在一起。\n这还没完，第六次时，兰斯摁住她的双手，干脆将整个身体压在了志津香的身上，腹上的伤口被狠狠压住，剧烈而持久的剧痛感让志津香不住地吸着凉气。“求你了...不要了，请停下...兰斯！要...要死掉了...”最后，她像个小女孩一样大声哭泣。\n兴许是听见了她的哭声，这一次，兰斯的身体从志津香的身上滑了下来，仰面看着天花板，这个男人慢慢地睡着了。"
 als.245.a:0"狂宴戛然而止。"
 als.246.t:0"超事件"
 als.246.d:0"科潘将兰斯熟睡的脸颊枕在自己的腿上，试图要在上面找出些什么。\n但那张脸上除了疲惫别无他物。\n“亏得这家伙现在还这么精力旺盛...不是说自己腰痛吗。”帕斯特尔爬到他面前，戳了戳他的脸，没有得到什么回应。\n对他来说，这种疲倦的沉睡效果最好，不会做梦。\n“那个笨蛋明早起来一定会疼死的。”捂着伤口的志津香红着眼睛，最后一个，将身子一点一点挪到过来。\n“三番五次的对他说希望渺茫，却还留着这样大的念想...真是的，摆出这么一副痛苦的样子，实际上在遭罪的是谁啊。”\n“据说，当时希露小姐睁开了眼吧。”科潘冬只是将食指放在嘴唇上。\n“那就，无可奈何了啊。得而复失，这会把失落感放大好几倍的吧？”\n“是，咱的错哦，那个告诉兰斯，让他相信有个木之本樱也许能够救下她的人，是咱啊。只是为了让他来帮忙而已...咱家很自私呢。”\n“到现在，我也还根本不了解那个女孩。”帕斯特尔叹了口气。“平时围绕在他身边的女人那么多，为何还会那么痛苦呢？”\n“希露，是兰斯的一部分。还是完全没有办法割舍...替代的那一部分。”志津香是她们三人中对那位奴隶最了解的。\n“这一次...也是呢，如果不抱着女孩子的话，就会想起希露吧？只能一直抱下去，抱到天昏地暗。”\n...\n...\n“兰斯，会坏掉吗？”"
 als.246.a:0"没人能回答这个问题"
 als.247.t:0"葫芦"
 als.247.d:0"大克里姆林宫 地下室内。\n诺瓦尔漫步在漆黑深邃的长廊里。这里是地下室的底下，有一条一直以来都不为布尔什维克所知的密道。其尽头便是就连苏俄也未曾得知的帝国的宝物库。\n可惜的是，由于现在早已不存在皇室成员，这个地方本应成为永恒的秘密。\n“真的是...还要走多久啊。”诺瓦尔不耐烦的敲打着一侧的石墙，一边向深处走去，“有必要挖的这么深吗？”\n当亚姆再一次找上她的时候，她对这个神秘的女人已经有了些许忌惮，不过，前者倒并未要求她做什么，反而将这个宝物库的消息当作迟来的报酬交给了她。\n当传回的响声出现了些许变化，诺瓦尔便知道此处便是宝物库的所在。她用力在石砖上一推，便发现墙后的暗格，她一挥手，将砖石尽数向里一推，这堵墙便一下倒塌，露出一个巨大的缺口。\n“呼——东西可真不少。”诺瓦尔的指尖冒出一团蓝火，暗淡的火光照亮了黑暗中的宝物，此处确实有着大量的奇珍异宝，但诺瓦尔对财物并不感兴趣，她只是想来看看，有没有什么可以用的魔法宝物。\n“伸缩绳...迅捷甲虫...哈尼打火机...唔，真是的，都是些烂大街的东西。”相比于此处收藏的大量珍宝，存于此处的魔法用具则显得很平庸，有的甚至已经是上上个世纪的东西了，也许具有收藏价值但没什么用。”\n在宝物库的尽头，有一座被几道锁链紧紧绑住的木制箱子，看着像是弹药箱。“emm...财物再名贵也不会被如此锁住，里面的东西，应当是极其有趣的小玩意呢...”诺瓦尔轻轻吹了一口气，铁链上的锁便凭空消失了，只剩下两端铁链被慢慢解开。\n尽管不觉得这个世上还有什么是需要她忌惮的东西，但打开箱子的时候，她还是不由得开始小心了起来。\n然后，里面的东西把她吓了一跳。\n一只小猴子跳了出来，给她吓的差点坐到地上。“......我嘞个去，我还以为这么深的地下只有我一个活物了。”\n她一只手提起小猴子，看见它抱着一个，不大不小的，被密封起来的葫芦，她伸手去拿，结果惹的猴子呲起了牙。\n“唔——什么嘛，真是无聊。”诺瓦尔无意和猴子置气，她也没感觉出葫芦里有什么奥妙，于是轻轻地把猴子放在地上。\n猴子在她面前跳来跳去，像是在表达感谢，然后抱住小葫芦，快速蹦出了密室。"
 als.247.a:0"唔...特地把一只猴子锁在宝物库吗...真是充满恶意。"
 als.247.a_tips:"§G意大利共和国科潘冬路线至此已经全部结束，感谢游玩！§!"
 als.250.t:"爱丽丝之馆"
 als.250.d:"大家好啊，这里是爱丽丝！（暗爱丽丝：这里也是爱丽丝...麻烦呢。）\n让大家等待许久的，关于兰斯君新的故事，已经就位啦！（暗爱丽丝：啪唧啪唧...真高兴...（完全没有力气地拍掌））\n喜欢NTR和扶她的坏文案这次吸取了教训——（暗爱丽丝：总算意识到自己写的东西根本塞不下——）\n然后就为大家提供更加爆炸多的超绝长事件文本呐~（暗爱丽丝：看来是完全没吸取教训啊）\n这一次增添的新内容显而易见是在对标隔壁的童话故事集吧？（暗爱丽丝：学者生似者死，笨蛋文案似乎又多了一个新的教训要听呢。）\n总之，新的冒险即将开始，还请各位紧紧跟随着兰斯君的冒险，带领着已然强大无比的意大利继续游戏吧？\n什么？其实并不想要看超绝长事件文本吗？（暗爱丽丝：这才是理所应当的吧，大家来萌心又不是真来玩galgame的。）\n事实上，也考虑到了这一点，所以也为只想战斗爽的玩家提供了自由模式呐~（暗爱丽丝：好...耶...（有气无力））"
 als.250.a:"接下来，就要看玩家的选择了喔~"
 als.250_tips:"全部剧情事件都通过决议触发"

