l_simp_chinese:

####国策####
MGU_hmr_hryr: "不会再交给任何人"
MGU_hmr_hryr_desc: "“如果现在把权力交还给议会，混乱与逃避用不了多久就会重新回到见泷原。到最后，被推到绝境里的，一定又是那个最温柔的人。……所以……我是不会放手的。”"

MGU_hmr_fced: "终止EVE计划"
MGU_hmr_fced_desc: "军管指挥部已下达正式指令，彻底关停神滨地下所有EVE实验设施，并切断玛吉斯之翼的一切对外联络。那场酿成二木市惨剧的疯狂赌局，必须要在今晚画上句号。"

MGU_hmr_ymzm: "踏入城外的荒野"
MGU_hmr_ymzm_desc: "内战耗尽了见泷原几乎所有备用的悲叹之种。仅靠城邦内部已经无法维持净化，魔法少女小队必须向城外荒野推进，主动清剿游荡在外的魔女。"

MGU_hmr_xghh: "维持这份沉默"
MGU_hmr_xghh_desc: "在这片星光眷顾的城邦里，凡人与魔法少女早已心照不宣地守着同一个秘密。没有人提起魔女的终局，也没有人愿意打破白昼的安宁——这份沉默，理所应当。"

MGU_hmr_hylz: "不再独自狩猎"
MGU_hmr_hylz_desc: "以前魔法少女总是守着各自的地盘，在无人知晓的黑夜里耗尽魔力，直至最后……再孤零零地变成魔女。现在的见泷原和神滨已经经不起这样的消耗了，所有人都必须学会一起战斗。"

MGU_hmr_emcf: "去往二木市"
MGU_hmr_emcf_desc: "“内战虽然停止了，二木市的仇恨却还没有散去。被虚假的希望骗过一次的人，不会再轻易相信任何话了。……在绝望重新失控之前，我必须亲自过去一趟。”"

MGU_hmr_yqxh: "神滨的灯火"
MGU_hmr_yqxh_desc: "议会的大门已经关上了，没完没了的争吵也终于停了下来。离开议会的魔法少女们依然聚在神滨的屋檐下互相陪伴，在夜里守着一点小小的温暖。"

MGU_hmr_jydk: "收回源翠石"
MGU_hmr_jydk_desc: "圣杯王国一直打着保护我们的旗号，源源不断地拿走亚马逊的源翠石。就像这世上从来没有不付代价的奇迹一样，靠别人施舍换来的和平，从一开始就是套在脖子上的枷锁。"

MGU_hmr_sbyz: "平息杂音"
MGU_hmr_sbyz_desc: "被切断商路之后，我们的药品和物资很快就见底了。习惯了依赖圣杯商船的商人们开始在街头煽动起了恐慌，要求我们都向远征军跪地认错。所以……在出兵之前，必须先把这些杂音全部平息。"

MGU_hmr_ghgk: "收回博丽先代"
MGU_hmr_ghgk_desc: "“港口托管领就像一颗钉在神滨身旁的钉子。如果她们打算用封锁逼迫我们屈服，那就赶在联盟彻底崩溃之前，先把博丽先代的港口夺回来。”"

MGU_hmr_dhzj: "没有悲叹之种的雨林"
MGU_hmr_dhzj_desc: "夺回博丽先代彻底激怒了盘踞在西北内陆的露丝契亚远征军。过去魔法少女面对的敌人都是魔女，只要获胜就能得到净化宝石的悲叹之种；但这一次深入亚马逊腹地，我们要面对的是一支庞大的人类正规军——一场无论击败多少敌人，都换不回任何净化的消耗战。"

MGU_hmr_bjsy: "推向新安普敦"
MGU_hmr_bjsy_desc: "将露丝契亚远征军一路向北赶出新安普敦与哈芬利斯，意味着我们彻底接管了整片亚马逊内陆。可与此同时，那块曾把我们与北方帝国、西方诸国隔开的巨大缓冲带，也随之消失了。"

####事件####

MGU_homura.1.t: "恍如昨日"
MGU_homura.1.d: "【魔法少女联盟议会致见泷原指挥部公函（摘录）】\n“……鉴于叛乱业已平息，各地城邦亟待恢复往昔之安宁与繁荣，谨请晓美焰女士尽快将临时管制权交还议会，令国民重返温和、安稳之生活……”\n\n读完这份措辞客气的公函，实在让人觉得有些可笑。字里行间完全看不到关于二木市惨剧的反省，仿佛内战爆发那一夜丢下见泷原独自逃往避难所的，并不是写下这封信的她们自己。天一亮，人类便总能如此轻易地忘掉曾经的恐惧。隔壁房间隐约传来小圆轻声哼歌的声音——刚才她说要去整理送往二木市的援助衣物，大概还没忙完。听着那道让人安心的轻哼，我将公函折起放到一旁，在延长军事管制的命令末尾签下了自己的名字。"
MGU_homura.1.a: "§1“维持军事管制。”§!"

MGU_homura.2.t: "你和我有什么区别"
MGU_homura.2.d: "隔着观测室的透明玻璃，里见灯花安静地坐着。\n\n“真意外呀，我还以为你会干脆利落地把我们全部杀掉呢，晓美焰。”\n“那样毫无意义。关闭EVE，切断玛吉斯之翼的联络，就已经足够了。”\n“你下令关停EVE，是因为同情二木市死去的凡人吗？”\n“当然不是。”\n“果然呢。”灯花笑了起来，“魔法少女迟早会变成魔女，这片土地上的大家心里都清楚。可凡人照样心安理得地享受着奇迹，把绝望全推给魔法少女去承受。从逻辑上讲，你和我做的明明是同一件事哦——我牺牲了素不相识的凡人，而你为了保护你在意的人，剥夺了整个联盟的自由。谁又能说自己比谁更干净呢？”\n“……或许正如你所说吧。不过，你们的失控差点伤到了见泷原。唯有这件事，我是不会容忍的。”\n\n我转身准备离开，背后却传来灯花轻飘飘的笑声：“是吗？可神滨和二木市之前全靠EVE压着灵魂宝石的浑浊。你今晚关掉它，不出几天，你们手头的悲叹之种就会连见泷原都供不上哦。”"
MGU_homura.2.a: "§1……§!"

MGU_homura.3.t: "悲叹之种"
MGU_homura.3.d: "“让开，杏子！里面可是住着活生生的人啊！”刀刃与长枪撞出刺眼的火花，美树沙耶香被逼退到了门前，在门缝底下，尚未成熟的使魔正朝屋里爬去，门后隐约传出哄孩子睡觉的轻哼。“喂，别犯傻了！”佐仓杏子偏头示意不远处的墙边——一个刚从二木市撤回的后辈正靠坐在地上，怀里的灵魂宝石已经暗得几乎透不出光。“关停EVE之后见泷原早就没有多余的悲叹之种了，使魔又不会掉悲叹之种！为了几个不认识的家伙把魔力浪费在这里，你打算让那边那个快撑不住的新人，今晚就在见泷原孵出魔女吗？”沙耶香握着剑停在原地，脸色一下子变得惨白，一时不知该如何是好，茫然地望向巷口的我。\n\n里见灯花说的那一天，比预想中来得还要快。一声枪响过后，门缝前的黑影瞬间散作黑烟。我把身上最后一枚悲叹之种抛了过去，它顺着地面滚落到那个女孩的脚边。“……如果你真的想保护什么人，就不要把时间浪费在无意义的争吵上，美树沙耶香。”"
MGU_homura.3.a: "§1“……明天开始，去城外狩猎魔女吧。”§!"

MGU_homura.4.t: "座位"
MGU_homura.4.d: "为了填补城内见底的悲叹之种，我来到巴麻美的住处商讨城外荒野的巡逻路线。巴麻美习惯性地在桌上多摆了一个茶杯，手却在放下的那一刻忽然停住了。以前总爱在巡逻后跑来吃蛋糕的后辈，已经留在二木市，不会再推开这扇门了。短暂的沉默之后，多余的杯子被安静地收进了橱柜，她替我斟满红茶，坐回对面时依然温柔地笑着，好像刚才那一秒的停顿从未发生过。\n\n“……真是不可思议呢。”她说，“明明大家都心知肚明，魔法少女最终都会变成魔女。可谁也不说破，每天还是像什么都不知道一样，笑着互道早安、送来花束。晓美同学，你觉得……维持着这样的美梦不醒来，究竟算不算一种幸福呢？”"
MGU_homura.4.a: "§1“……红茶要凉了，巴麻美。”§!"

MGU_homura.5.t: "校门前的雏菊开了"
MGU_homura.5.d: "“今天路过校门的时候，花坛里的雏菊居然已经开了呢。”小圆把点心袋放在我的地图旁边，像放学后在教室里那样，轻声聊起今天在路边见到的小事。有她在的时候，连时间好像都会稍微放慢脚步。\n\n可正说着，她忽然停了下来：“……小焰？你的手，是不是受伤了？”昨晚把最后一枚悲叹之种送出去之后，我的灵魂宝石已经蒙上了一层明显的暗影。我下意识想把手收回桌下，动作却还是慢了一步。白色的手帕覆上了我的手背，我的手连同那颗宝石，隔着布料被小圆温暖的掌心握在了手里。\n\n“对不起……我总是帮不上什么忙，连小焰在辛苦些什么，也总是最后一个才知道。……可是，至少今天晚上，不要再一个人硬撑着了，好不好？”"
MGU_homura.5.a: "§1“……嗯。我知道了，小圆。”§!"

MGU_homura.6.t: "旁观者"
MGU_homura.6.d: "那双红眼出现时，我的手就已经按在了枪上。但……扣下扳机也毫无意义——就算在这里打碎它的身体，很快也会有另一个一模一样的替身走出来，安静地把残骸吃掉。\n\n“真是少见的做法，晓美焰。”丘比偏过头，声音听不出任何起伏，“为了熬过悲叹之种的紧缺，你居然打破了魔法少女各自战斗的习惯，让她们去荒野里聚在一起分担诅咒。这样一来，灵魂宝石变黑的速度确实慢了不少。”\n\n“这和你没关系。赶紧从我眼前消失。”\n\n“我只是觉得很不可思议哦。”它轻轻摇晃着尾巴，“以前魔法少女都是一个人战斗，就算最后变成魔女，也不过是一个人份的绝望而已。现在你用军管把她们强行绑在一起、互相依赖……要是外面的压力再大一点，其中有谁先撑不住，在最信任的朋友面前变成了魔女，剩下的那些孩子会露出什么样的表情呢？那时候产生的连锁绝望，说不定会比以前多得多。”"
MGU_homura.6.a: "§1“给我…滚出去……”§!"

MGU_homura.7.t: "余烬"
MGU_homura.7.d: "二木市的街道比想象中还要冷清。内战留下的废墟清理工作到现在也没有完成，空气里依然残留着魔女结界消散后的气息。正因为担心这里最容易成为丘比口中第一个崩溃的缺口，我才带队赶了过来——却没想到，先一步在废墟里看见了小圆。她停在一座烧塌的屋檐下，弯下腰，把灰烬里的一个发卡捡了起来。\n\n“……别碰她的东西！”不远处的阴影里走出一名二木市的魔法少女，手里的武器正对着我们，“神滨的那些人骗她说……她有救了，结果却反过来害死了她；现在见泷原的人又跑来说要把二木市管制起来……你们嘴里说的希望，为什么每次都要让我的朋友去死啊？！”\n\n我上前一步想要挡在小圆身前，小圆却按住了我。她把发卡上的灰尘擦干净，迎着枪尖递到了对方手边：“……对不起。死去的人已经回不来了，我也不知道该怎么道歉才好。……可是，把这么重要的发卡一直丢在这里，她一定会很寂寞的。还是由一直把她记在心里的你来收下吧，好不好？”\n\n二木市的少女怔怔地看着那个发卡。僵持了片刻，她伸手夺过发卡贴在胸前，收起武器，一言不发地转身走进了巷子深处。望着身旁松了一口气的小圆，我的内心却传来了一阵恶寒——我越是用强硬的手段去封锁这些裂痕，小圆就越会像今天这样，主动走到危险的枪口前面去修补它。"
MGU_homura.7.a: "§1“……我们回去吧，小圆。”§!"

MGU_homura.8.t: "灯火"
MGU_homura.8.d: "从二木市离开后，我连夜赶往神滨确认原议会成员的动向。七海八千代回到了她在神滨的住处，路过院门外时，能看到屋里的灯还在亮着。\n\n餐厅里很热闹。环彩羽正把刚煮好的饭端上桌，有些苦恼地说着白天在荒野里迷路的事。几名年轻的魔法少女被她逗得笑出了声，连平时总是一脸冷淡的七海八千代，神情也比平时柔和了许多。就算没有了议会，她们依然在这里为彼此留着一个可以回去的家。\n\n房门忽然从里面拉开了。七海八千代站在门口，静静望着停在夜色里的我：“站在外面不冷吗，晓美焰？晚饭刚好做好了，要进来一起吃吗？”\n\n屋里的笑声瞬间停了下来。餐桌旁，一名刚从荒野回来的年轻少女看见站在门外的我，脸色微变，下意识把手里有些发暗的灵魂宝石悄悄藏到了背后。那种警惕而畏惧的眼神，和当初她们看向玛吉斯时一模一样。我看着那片温暖得有些刺眼的灯光，无法控制地向后退开了。"
MGU_homura.8.a: "§1“不了，我还有事要处理。”§!"

MGU_homura.9.t: "代价"
MGU_homura.9.d: "中止源翠石的运输之后，圣杯王国的反应比预想中来得更快。神滨东北边的博丽先代港口托管领关闭了我们的贸易口岸，而在我们西北方向绵延整片内陆雨林的露丝契亚远征军，也已经开始向边境集结部队。\n\n“到头来，还是老样子嘛。”佐仓杏子靠在围栏上，咬了一口手里的苹果，冷笑出声，“不管是丘比那家伙，还是圣杯王国的人，嘴上都说得那么好听，好像什么都是白送的一样。结果一翻脸，要拿走的东西比给出来的多得多。”\n\n巴麻美安静地站在她身旁，金色的丝带在夜风中展开，几支燧发枪随之浮现了出来。“以前我们总靠着圣杯人的支援，以为只要把源翠石交出去，大家就能一直平平安安地生活了。”她的声音很平静，“现在一旦不打算再靠别人施舍了，接下来的风浪，就都要我们自己坚持到最后了呢。”\n\n就在这时，后面的传令员匆匆跑了过来，她说，博丽先代的封锁彻底切断了最后一批外洋药品与物资的进入，二木市与神滨的边缘街区已经开始出现骚乱。丘比预言的那场连锁崩溃……已经逼近眼前了。"
MGU_homura.9.a: "§1“通知大家，随时做好迎战准备。”§!"

MGU_homura.10.t: "深夜"
MGU_homura.10.d: "深夜的见泷原彻底安静了下来。我一个人坐在桌前，低头看着手心里的灵魂宝石。自从那天把最后一枚悲叹之种送出去，宝石深处的暗影就一直留到了现在。\n\n丘比留下的警告、二木市枪口前的小圆、神滨屋里少女藏向背后的宝石，还有东岸博丽先代的封锁与西北雨林里蠢蠢欲动的露丝契亚远征军……所有的压力都在拼命朝我的方向收紧。我原本以为，只要把权力握在手里、把大门锁紧，就能替小圆挡住外面的风暴；可事实却是，死守在这条狭窄的海岸线上，只会让绝望在内部逐渐沸腾，直到把小圆也一起拖进深渊。\n\n不能再坐等她们把包围网收紧了。如果防守只会迎来慢性死亡——在一切真正失控之前，我必须先一步走出去，亲手把外面的威胁全部撕碎。"
MGU_homura.10.a: "§1“只要……”§!"

MGU_homura.11.t: "石子"
MGU_homura.11.d: "被切断贸易之后的第一个月，神滨商业街的骚乱终于爆发了。\n\n几十名断了货源的商人与市民堵在配给站门前，把运送军需的车队团团围住，大声要求指挥部向圣杯王国道歉、重新交出源翠石矿脉。美树沙耶香站在车队前面，试图向人群解释：“大家再忍耐一下！只要我们收回了博丽先代的港口，就再也不用受欧洲人的威胁了！”\n\n“说得倒轻巧！得罪了圣杯，没有她们的药和粮食，我们连这个月都熬不过去！”人群里飞出一块石子，结结实实地砸在沙耶香的额头上。血顺着眉角滑落下来，沙耶香怔在了原地，她手里的剑握得很紧，却终究没敢向普通人挥出去。\n\n我走上前，拔出手枪朝天空扣下扳机。枪声让喧闹的街道瞬间安静下来，人群惊恐地向后退散了。\n\n“看清楚了吗，美树沙耶香。”我瞥了一眼地上带血的石子，“在她们眼里，你的命还抵不上一船从海那边运来的货物。去把伤口包扎好，今晚突袭博丽先代。”"
MGU_homura.11.a: "§1“谁敢再拦军车，一律按战时法处置。”§!"

MGU_homura.12.t: "白旗"
MGU_homura.12.d: "博丽先代的驻军并没有多少防备。赶在天亮之前，我们便突破了托管领的防线，控制了整片港区。美树沙耶香第一个冲进仓库街，挥剑劈开了外面的铁锁：“大家没事吧！幻想乡的驻军已经被我们赶跑了！”\n\n仓库大门推开，走出来的当地居民却没有一个人露出高兴的表情。几名富商与镇长手里居然举着临时扯下来的白布，惊慌失措地推开沙耶香，冲着海面上正在撤离的托管领船只大喊着“请不要丢下我们”。\n\n“你们为什么要打进博丽先代啊？！”一名商人崩溃地冲着满身伤痕的沙耶香嚷道，“把欧洲那帮人得罪死了，露丝契亚的远征军马上就会打过来的！你们这群怪物，是想拉着全城的人一起陪葬吗？！”\n\n“你这家伙……再说一遍试试？！”佐仓杏子一把揪住那名商人的衣领，长枪几乎贴到了对方的脖子上。\n\n“杏子，不要这样！”随医疗队赶来的鹿目圆急忙挡在了佐仓杏子的身前。小圆转过头，面对着那些充满敌意的居民，眼里充满了血丝与泪水，却还是低声向她们道了歉，随后默默蹲下身，开始替呆立在原地的沙耶香包扎伤口。\n\n我的视线越过哭闹的人群，望向西北方向黑沉沉的雨林——正如那个商人所说，驻扎在内陆腹地的露丝契亚远征军主力，恐怕已经开始行动了。"
MGU_homura.12.a: "§1“不要在港口久留，全军向西北边境集结。”§!"

MGU_homura.13.t: "出征前夜"
MGU_homura.13.d: "踏入西北内陆雨林的前一晚，巴麻美把前线的小队长们召集到了营帐里，为每个人倒了一杯红茶。她依然像平时那样温和地叮嘱着行军细节，直到年轻的后辈们安心离开，脸上那副从容的表情才慢慢垮了下来。\n\n她端着茶壶站在桌边，倒水的时候，手腕却轻轻抖了一下，滚烫的茶水洒在了桌布上。\n\n“……抱歉，让你看到失态的样子了。”巴麻美放下茶壶，看着自己已经有些发暗的黄色宝石喃喃道，“以前讨伐魔女的时候，无论多么危险，至少心里清楚自己是在拯救别人。可明天跨进那片雨林，我们要面对的是远征军的正规军——是一群和城里的市民一样、有血有肉的普通人。”\n\n“杀死人类不会掉落悲叹之种，只会让那些孩子的灵魂宝石因为愧疚与恐惧加速变黑。晓美同学，把大家推上这样的战场……我们真的还能算是魔法少女吗？”\n\n看着桌布上洇开的水痕，我并没有去接她的话：“天亮前，我们就会出发。如果你不想让后辈们全都死在雨林里，明天就一定不要留手。”"
MGU_homura.13.a: "§1“……早点休息吧，巴麻美。”§!"

MGU_homura.14.t: "消耗"
MGU_homura.14.d: "亚马逊内陆的雨林闷热得让人喘不过气。露丝契亚远征军依托密林里的河道层层设防，将北上的道路封锁得密不透风。\n\n一名来自神滨的年轻魔法少女在躲避炮击时魔力透支，摔倒在了弹坑里；她颤抖着摸向胸口，那颗灵魂宝石已经黑得几乎看不出原本的颜色。而在周围倒下的全都是远征军的士兵——整片战场上，连一枚能够用来净化的悲叹之种都找不到。\n\n“撑住！别在这里放弃啊！”美树沙耶香拼命架起剑替她挡住侧面射来的弹雨，自己的呼吸也已经乱套了。\n\n不能让任何人在这里变成魔女。我转动左腕上的盾牌，时间在轰鸣的炮火中骤然停滞。\n\n我穿过静止的雨林与硝烟，将捆好的炸药一处接一处塞进远征军的火炮阵地。当时间重新流动、成片的火光在密林深处炸开时，我才看了一眼自己的手心——为了强行撕开这条防线，宝石里的暗影，又往深处蔓延了。"
MGU_homura.14.a: "§1“继续向北推进，直到新安普敦！”§!"

MGU_homura.15.t: "新的边界"
MGU_homura.15.d: "随着新安普敦与哈芬利斯的港口相继陷落，露丝契亚远征军的残部终于彻底退出了这片大陆。可站在哈芬利斯刚刚占领的哨所里，摊开重新绘制的疆域图时，指挥部里却没有一个人笑得出来。\n\n过去许多年里，正是因为有露丝契亚远征军这片辽阔的内陆领地横在中间，我们才一直不需要直接面对大陆上的其他强权。而现在，这块巨大的缓冲带被我们亲手吞了下去——北边哈芬利斯的界碑外，直接贴上了阿德莱希帝国漆黑的国境线；西边的雨林尽头，名为夜莺的亡灵国度也近在咫尺；而南边的莉兰迪亚也已经开始向边界增兵。\n\n“真是一场了不起的胜利，晓美焰。”\n\n丘比不知何时又出现在了哨所的窗台上，一双红眼平静地注视着桌上的地图：“为了打穿这片雨林，你们在这场不会掉落悲叹之种的战争里耗光了储备。可作为胜利的奖赏，现在整片大陆最危险的邻居，全都直接贴到了你们的脸上。”\n\n它微微偏过头，声音轻柔得令人发寒：“没有了缓冲带，也没有了悲叹之种。当四面八方的敌人同时扑过来的时候，你猜你的同伴们还能撑到第几天？”"
MGU_homura.15.a: "§1“……传令全军，立刻接管所有新边境防线。”§!"