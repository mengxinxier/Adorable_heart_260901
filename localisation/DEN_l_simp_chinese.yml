  DEN_AUTOMETA: "自动人偶"
  DEN_AUTOMETA_desc: "发条国传承了1000年的技术，因太过复杂而很少有人能掌握其制造技术。"
  DEN_haunter: "超能力者"
  DEN_haunter_desc: "超能力者，也称先天魔法师，天生或偶然获得的特殊超凡能力，超能力者得以拥有超凡的力量。"
