  DEN_gateway_to_baltic_sea_category: "波罗的海门户"
  DEN_gateway_to_baltic_sea_category_desc: "杜伦布海峡是连接北海和波罗的海的重要水道，对于杜伦布以及周边国家的海上贸易和海军活动具有显著的战略意义。这条海峡是北欧国家与圣杯王国、幻想乡共和国等西欧国家之间贸易的重要通道。同时，它也是魔导国、执念国等波罗的海沿岸国家进入大西洋的必经之路。因此，控制这一海峡，对于掌握北海和波罗的海之间的海上交通线，以及影响周边国家的安全态势都有着至关重要的作用。\n\n杜伦布虽然是北欧军事强国之一，但在整个欧洲强国之中，杜伦布共和国只在末流。随着世界局势逐渐紧张，圣杯王国和魔导国都将不约而同的将注意力聚焦在此地，一场博弈在所难免，杜伦布的人民如何才能在大争之世中安然存续呢？\n\n[ENG.GetNameWithFlag]的§Y海峡影响力§!：[?DEN.DEN_strait_influence_from_ENG]\n\n[DVL.GetNameWithFlag]的§Y海峡影响力§!：[?DEN.DEN_strait_influence_from_DVL]\n\n当1938年春季大选开始，霸主们将会利用手中的影响力支持他们的政党。杜伦布共和国的政治和外交将会倒向优势的一方。如果杜伦布共和国能够保持两国的§Y海峡影响力§!差距不超过20点，她们就可以在改革国内事务之后争取保持中立的地位。"

