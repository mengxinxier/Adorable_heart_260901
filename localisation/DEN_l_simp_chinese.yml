  DEN_neia: "涅亚·巴拉哈"
  DEN_neia_pol_desc: "“魔导王即是正义，弱小便是罪恶。我等身怀原罪的人类，唯有臣服魔导王陛下。”\n\n涅亚·巴拉哈，出生于军人世家的她曾作为使团成员前往魔导国访问，期间受到魔导王邀请作为其随从。在那之后，回到祖国的涅亚像是变了一个人，她不再以父母的军人身份为荣，不久退役，活跃于民间抨击政府、宣扬对魔导王的崇拜，聚集起三千人以上的’教徒‘。因在公开场合会以魔导王赠予的面具遮盖双眼，她被杜伦布人称为”无面者“，\nY党、DIY党接连失败，大萧条的饥寒同来自魔导国的压力相叠加令杜伦布人的集体意识彻底崩溃，他们不再相信自己有创造辉煌的能力。人类是无能的生物，愈是迷茫愈会堕入狂热的信仰，何况涅亚·巴拉哈宣扬的神明真实存在。\n在绝望的安全前，杜伦布人放弃了不值一提的尊严，涅亚·巴拉哈通过自己教主般的声望操纵了杜伦布人的思想，为她的主宰献上国度。没有私心、没有衡量算计、她更不认为自己背叛了同胞，因为她发自内心的相信——魔导王是人类注定的主宰、将带来永恒的慈爱统治。"

  DVL_CZ2128_leader_tt: "§Y$DVL_CZ2128$§!\n§Y$DEN_combat_maid_automaton$§!\n  - $modifier_army_sub_unit_auto_meta_units_attack_factor$：§G+10.00%§!\n  - $modifier_army_sub_unit_auto_meta_units_speed_factor$：§G+10.00%§!\n  - $MODIFIER_MAX_PLANNING$：§G+10.00%§!"
  DVL_CZ2128_leader_dip_tt: "§Y$DVL_CZ2128$§!\n§Y$DEN_combat_maid_automaton$§!\n[FROM.GetFlag]§Y[FROM.Getname]§!的§F首席监察官§!\n\n  - $modifier_army_sub_unit_auto_meta_units_attack_factor$：§G+10.00%§!\n  - $modifier_army_sub_unit_auto_meta_units_speed_factor$：§G+10.00%§!\n  - $MODIFIER_MAX_PLANNING$：§G+10.00%§!"
  DVL_CZ2128_leader_desc: "希丝·戴尔塔（CZ2128·Delta）是纳萨力克大坟墓“昴宿星团”六连星中的战斗女仆之一，种族为自动人偶。她拥有精致如人偶般的面容和标志性的红色眼罩，常年身着带有迷彩元素的女仆装，是典型的“无口”属性少女。作为一名魔铳手，她擅长使用魔导长枪进行远距离精准狙击，战斗风格冷静而高效。\n\n尽管外表冷若冰霜且缺乏情感波动，希丝内心却有着对“可爱事物”的极度狂热。她会将看中的可爱对象紧紧抱住，并贴上写有自己名字的“一元贴纸”以示占有。在正义值普遍偏低的纳萨力克中，她拥有难得的+100正义值，这使她在面对人类时表现得相对理性且温和。她那精准的机械感与偶尔流露出的纯真反差，使其成为了纳萨力克中性格极其鲜明且富有魅力的角色。\n\n在涅亚访问魔导国期间，希丝同她私交甚好，魔导王安兹乌尔恭因此派遣希丝随同涅亚返回杜伦布，此举被认为是魔导王为染指杜伦布所作的谋划。无论安兹乌尔恭计算到了哪种地步，当下的事实是，他已然成功。\n在涅亚·巴拉哈控制杜伦布的过程中，希丝同其形影不离。人们大多认为，作为魔导王代言人的希丝在这段关系中占据主导作用。但也有传言表示两者处于平等地位。"

  DEN_Breguet_leader: "玛莉·布列格"
  DEN_Breguet_leader_tt: "§Y玛莉·布列格§!"
  DEN_Breguet_leader_dip_tt: "§Y玛莉·布列格§!\n§Y[DEN.GetNameWithFlag]§!的政府首脑"
  DEN_Breguet_leader_desc: "§L谈到玛莉·布列格就不得不提及她的姓氏，虽然这常常是玛莉不愿提起的。布列格是杜伦布共和国资本雄厚、拥有大量军备的军工企业，而玛莉是这个家族企业的长女。\n随着1931年的大选，须理出未来最终在秋季成为杜伦布民选政府的新一任总统，此后数年杜伦布共和国的经济状况逐渐改善，并且最重要的，德意志对杜伦布的影响的得到了遏制。是好消息但同样是噩耗，德意志国几乎在短短几个月内，被突然出现的魔导国击溃，并建立了一个新政权。巨变由此拉开帷幕，须理出未来需要更多的支持，她一手将玛莉·布列格提拔成为国家首脑，并负责与逐渐崛起的军工企业和各类寡头们协调联络。\n玛莉·布列格通常被认为缺乏历练，并且因裙带关系的过快提升使得她备受议论。她本人则努力为须理出总统服务，她信任这位雄心勃勃的总统，但同时她厌恶着寡头们贪婪、腐败的行为以及对政府的掣肘。§!"

  DEN_Akane_leader: "新条茜"
  DEN_Akane_leader_tt: "§Y新条茜§!"
  DEN_Akane_leader_dip_tt: "§Y新条茜§!\n§Y[DEN.GetNameWithFlag]§!的国防部长"
  DEN_Akane_leader_desc: "§L杜伦布已经成名的机械师天才里面，有两位备受推崇，她们受到了广泛的尊敬和投资，新条茜就是其中之一。\n新条茜和须理出总统一起她们所谓的DIY社小团体相似，出身于并不显赫的中产家庭，而新条茜的才华让她很快脱颖而出。虽然身为女子，但她沉迷机械造物，曾经“Y”党一度认为新条茜可以修复Y机械师遗留下来的机械生命，结果虽然令人失望，但在包括新条茜在内的历代天才的维护下，这些机械生命仍旧崭新。\n为什么机械师会出现在军中呢？这是Y机械师带来的风潮，这位传奇机械师和他打造的机械军队在杜瑞战争中为祖国贡献了不少力量，而他本人的进取精神和统一北欧的愿望被大批后来的机械师所传承。而新条茜便是其中之一。\n新条茜擅长设计机械怪兽，早期的不稳定设计给古立特部队带来了不少麻烦，但此后进行深造和学习的新条茜开始改造自动机械装备，她保留了对机械怪兽的执念，她改造的机械通常具有强大的机动性，为此不得不使用一些昂贵的材料加以补偿。\n至于国防部长的职务，一方面是须理出未来大胆使用青年人的缘故，另一方面新条茜是地地道道的北欧人，更重要的是，新条茜来自中产阶级并且身上带有“Y”党的痕迹。§!"

  DEN_Repart_leader: "多龙芝"
  DEN_Repart_leader_tt: "§Y多龙芝§!"
  DEN_Repart_leader_dip_tt: "§Y多龙芝§!\n§Y[DEN.GetNameWithFlag]§!的监委会主席"
  DEN_Repart_leader_desc: "§g多龙芝，一个并不古老的代号。数百年前，瑞典王国的崛起撕裂了卡尔马联盟，随之杜伦布王国灭国。在水深火热的统治下，多龙芝与杜伦布贼党脱颖而出，她们组织起反抗运动的浪潮，最终迫使瑞典王国在此地建立杜伦布共和国。\n祖先的荣誉不必再提，曾经的英雄贼党家族在后面理所应当的遭受到了清算，但是谁又能想到，多龙芝家族的末裔尚有一位少女存活于世。现在的她再次以多龙芝为名，召集旧部，在新的更具有实现可能的革命纲领之下，组织工人，发展地下势力。\n在琉紫的支持下，杜伦布贼党的威力显现出来，但却难以对抗国家机器，随着杜伦布共和国陷入更深的危机，“Y”字工人党的复兴，贼党有了喘息之机。但是举起革命大旗的首义者另有其人，虽然未曾见面，但多龙芝暗地佩服友利奈绪的勇气和作为，她的行动为工人运动占领了一片不易被打倒的阵地——公会。\n随着来之不易的胜利，多龙芝收获了广泛的赞誉，贼党今非昔比，在友利奈绪的邀请下，多龙芝宣布加入杜伦布共产党。然而这个邀请却并非全然是善意，友利奈绪迅速扩大共产党的影响力，在公会联盟占据多数。马上，她鼓动几个左翼组织，一起建立了执行委员会，公会联盟的气氛越来越奇怪，人们开始警惕共产党。\n多龙芝必须继续发挥自己的能力，弥合联盟的裂痕，避免盲目激进的举措。§!"

  DEN_Nao_leader: "友利奈绪"
  DEN_Nao_leader_tt: "§Y友利奈绪§!"
  DEN_Nao_leader_dip_tt: "§Y友利奈绪§!\n§Y[DEN.GetNameWithFlag]§!的中执委主席"
  DEN_Nao_leader_desc: "§g来自星之海学园的超能力者，在超能力禁令之下，友利奈绪的哥哥被军事组织抓走进行超能力训练，友利奈绪则逃进了学园，初入学园，她便凭借个人能力担任了学生会会长。\n热爱摇滚的她天生具有反抗精神，友利奈绪亲手建立严密的学生会团体，在这个团体内友利奈绪说一不二，她想要带着超能力学生光明正大的走出这个监狱般的学园，获得真正的自由。友利奈绪最喜欢阅读木之本樱的事迹，她认为自己和小樱都是头脑冷静的知识分子，而自己所搭建的班底也如同小樱建立魔法委员会一样紧密的进行着，在未来必将迅速发展壮大。\n随着杜伦布共和国陷入危机，友利奈绪得以光明正大的在外界活动，工人、学生还有军队被她利用超能力组织串联起来，友利奈绪一边和侥幸分子作斗争，一边马不停蹄的策划着总罢工、大暴动，把多数人想方设法团结在一个堑壕。\n胜利来的如此幸运，友利奈绪不敢有丝毫懈怠，在大家欢呼雀跃的时候，她已经暗地里开始新的筹划，必须保持学生会组织的地位，她以莫斯科的名义成立杜伦布共产党，在杜伦布联盟里保持着独立性，又成立执行委员会，然后……§!\n\n§R江山永不变色！§!"

  DEN_Bismarck_leader: "俾斯麦"
  DEN_Bismarck_leader_tt: "§Y俾斯麦§!"
  DEN_Bismarck_leader_dip_tt: "§Y俾斯麦§!\n§Y[DEN.GetNameWithFlag]§!的海军总司令"
  DEN_Bismarck_leader_desc: "§L承载着铁血宰相灵魂的舰娘，在德意志落入外星人之手的时候，她毅然带领船队流亡孤岛。现在北德意志复国战线成立了，她发誓要用舰炮来洗清的德意志的耻辱！§!"

