#国策
  DEN_focus: "杜伦布共和国国策"
  DEN_international_machinery_show: "筹备国际机械展"
  DEN_international_machinery_show_desc: "须理出未来连任后第一项大工程就是举办国际机械展，将杜伦布的最新研究成果展现给世界，荣耀属于杜伦布。"
  DEN_accept_Kiel_guerrilla_team: "接纳基尔残部"
  DEN_accept_Kiel_guerrilla_team_desc: "如果魔导国的野心无法被遏制，那杜伦布只能依靠自己，主动出击接收基尔公社的残部，趁早增强力量准备可能发生的大战。"
  DEN_renovate_old_infrastructure: "处理老旧基建"
  DEN_renovate_old_infrastructure_desc: "国内老旧的基础设施已经不能满足我国经济发展的需要了，让我们整修道路，清理工坊，为杜伦布的机械向世界出口铺平道路。"
  DEN_public_security_mecha: "治安机甲"
  DEN_public_security_mecha_desc: "国内罢工有愈演愈烈的趋势，宣传、谈判和工会劝导都不起作用。如果常规的办法不能奏效，也许是时候采用一些激进措施来“对症下药”了"
  DEN_invite_foreign_investment: "邀请外国投资"
  DEN_invite_foreign_investment_desc: "从杜伦布到基尔，圣杯和德意志的企业充斥着我国市场，影响力不容小觑。或许，吸引更多它国投资，会是稀释柏林和伦敦影响力的有效办法。"
  DEN_deal_with_foreign: "波罗的海门户"
  DEN_deal_with_foreign_desc: "一个失去联盟主导权的杜伦布无法强硬的屹立在圣杯和德意志两大霸权中间，只能鸡蛋上跳舞，平衡双方的力量，夹缝里求发展。"
  DEN_investigate_Marie_case: "调查玛莉案"
  DEN_investigate_Marie_case_desc: "玛莉的失踪背后疑点重重，特别是在国内已经开始出现罢工的特殊时间，各方势力都在躁动。总之，越早找到她越好。"
  DEN_graduation_ceremony: "星之海毕业典礼"
  DEN_graduation_ceremony_desc: "虽然超能力在国内并不是主流，但通过精心筛选培养出的超能力人才，也可以为共和国所用，比如本届毕业生中，就存在一些优秀代表。"
  DEN_crisis_years: "危机岁月"
  DEN_crisis_years_desc: ""
  DEN_currency_depreciation: "货币贬值"
  DEN_currency_depreciation_desc: "面对经济危机，适当贬值货币也是可选措施之一，至于可能出现的通货膨胀，在面包涨到50万前不用管他。"
  DEN_balance_government_budgets: "平衡政府预算"
  DEN_balance_government_budgets_desc: "危机当头，只能苦一苦政府雇员们了，总体带头减薪，带动各政府部门以及军队降低预算花费，通过更加严格的管理缩减每一分花费。"
  DEN_agricultural_subsidies: "农业补贴"
  DEN_agricultural_subsidies_desc: "危机冲击着各行各业，没钱的人不一定参与罢工，但饿肚子的人就不一样了，从这个角度看，向农业发放补贴，保障粮食供应无疑是必要之举。"
  DEN_unemployment_benefit: "失业救济"
  DEN_unemployment_benefit_desc: "阻止一场罢工最好的办法，一是收买罢工组织者和首脑，二是向失业人口发放救济金。"
  DEN_merge_national_banks: "整顿国家银行"
  DEN_merge_national_banks_desc: "共和国的官办银行在危机中的糟糕表现有目共睹，也许是时候参考圣杯的经验，将官办银行合并，组建正式的中央银行了。"
  DEN_collaborating_with_enterprises: "和企业合作"
  DEN_collaborating_with_enterprises_desc: "面对当前的危机，有部分学者提出‘把市场的交给市场’，建议我们放权给企业，甚至放开一部分法律的限制。"
  DEN_collaborating_with_enterprises_tt: "罢工会更加剧烈"
  DEN_collaborate_with_guild: "和公会合作"
  DEN_collaborate_with_guild_desc: "和工会合作安抚工人或许是个不错的办法，但对那些贼党煽动起来的暴徒，这个办法可能没那么好用了。"
  DEN_public_works: "公共工程"
  DEN_public_works_desc: "建设更多公共工程，给劳动者重新提供工作岗位，也避免了无所事事的游民聚集，引发更多社会问题。"
  DEN_low_interest_agricultural_loans: "投资乳酪业"
  DEN_low_interest_agricultural_loans_desc: "牛羊乳酪，麦粉面包，早在中世纪蓝纹乳酪就响彻欧洲。毕竟，有什么比得上在一天劳累后，坐下来品尝一块产自杜伦布的香甜乳酪面包呢？"
  DEN_agricultural_machinery: "农业自动机械"
  DEN_agricultural_machinery_desc: "自动机械的民用一直是杜伦布科研的热门领域，最近，有企业推出了试用农业自动机械，可以预见的是，对此类产品的进一步升级推广将成下一个产业热点。"
  DEN_Jutland_agricultural_region: "日德兰农牧区"
  DEN_Jutland_agricultural_region_desc: "北日德兰地广人稀，通过鼓励发展家庭农场，可以实现牧业与机动化农业的同步发展。"
  DEN_forestry_and_paper_mills: "林业和造纸厂"
  DEN_forestry_and_paper_mills_desc: "在克鲁努贝里的本地林业资源基础上，建立部分造纸产业，提高产值和税收。"
  DEN_modernization_of_fishery: "波罗的海渔业"
  DEN_modernization_of_fishery_desc: "鳕鱼、鲱鱼、鲑鱼、沙丁鱼......杜伦布的渔场是整个欧洲最优质的渔场。"
  DEN_cement_plant: "菲英水泥厂"
  DEN_cement_plant_desc: "近期的大额财政计划带动了国内大规模建设，也产生了对水泥等工业物资的巨大需求，通过技术改造和管理重组，可以更好促进菲英当地的水泥产业发展。"
  DEN_Zealand_steel_plant: "西兰炼钢厂"
  DEN_Zealand_steel_plant_desc: "位于哥本哈根郊外的西兰炼钢厂层是杜伦布的著名工业企业，但受上次大战的影响一度关闭，是时候重开它，振兴钢铁产业了。"
  DEN_expressway_plan: "高速公路计划"
  DEN_expressway_plan_desc: "近期的国家建设规划中，计划将整个东杜伦布通过高速公路和辅助道路设施，彻底连为一体，促进工业产品互通，加大对外出口。"
  DEN_yanxueping_reservoir: "延雪平水库"
  DEN_yanxueping_reservoir_desc: "对延雪平和哈兰两地的旧水库进行改造升级，补充建设鱼类养殖工程和发电机组等配套设施，同步发展渔业和电力。"
  DEN_invest_in_South_Kalma: "投资南卡尔马"
  DEN_invest_in_South_Kalma_desc: "南卡尔马地区深处内陆，长期作为林业资源产地，现在东杜伦布交通情况改善，正是我们加大投资，彻底从经济上将它与其他地区连为一体的时机。"
  DEN_expand_maritime_trade: "和圣杯合作"
  DEN_expand_maritime_trade_desc: "资本由自私驱动，它不会被仁慈诱惑"
  DEN_trading_with_demons: "与魔鬼的交易"
  DEN_trading_with_demons_desc: "贸易如同血液，应当循环流通"
  DEN_forced_loan: "强制贷款"
  DEN_forced_loan_desc: "解决经济危机的一大关键就在于把钱运转起来，扩张财政后央行有大笔的资金可以投放，至于借款人？马上就有了。"
  DEN_subsidized_industry: "补贴工业"
  DEN_subsidized_industry_desc: "新一轮财政刺激计划包括对主要工业企业的大规模刺激，旨在通过释放充足流动性，促进工业生产回到正常水平。"
  DEN_consolidate_the_archipelago: "巩固群岛"
  DEN_consolidate_the_archipelago_desc: "整修防御设施，给与移民们一个更安全的生活环境，展现共和国对民生的关注。"
  DEN_strengthen_maritime_trade: "加强海洋贸易"
  DEN_strengthen_maritime_trade_desc: "南杜伦布曾是整个北德意志和北欧的贸易中心，国内生产大发展的现在，是时候重启航线，大开贸易之门了。"
  DEN_encourage_immigration: "鼓励移民"
  DEN_encourage_immigration_desc: "让难民留在本地和当地居民产生摩擦，不是一个好主意，万幸我们有众多尚未充分开发的岛屿。"
  DEN_offshore_oil_recovery: "近海采油"
  DEN_offshore_oil_recovery_desc: "近几十年的工业发展，让石油变成了炙手可热的物资，据最新探测研究，我们的近海海岸就存在着大量这种资源。"
  DEN_invest_in_Bornholm: "投资博恩霍尔姆"
  DEN_invest_in_Bornholm_desc: "进一步投资博恩霍尔姆，将其建设成为北部航线的重要中转站。"
  DEN_build_Faroe_island: "建设法罗群岛"
  DEN_build_Faroe_island_desc: "法罗群岛靠近圣杯，发展当地经济可以进一步加强我们与圣杯的经济联系。"
  DEN_develop_Iceland: "开发冰岛"
  DEN_develop_Iceland_desc: "冰岛一向孤悬海外，远离外部斗争。现在欧洲大陆局势日益紧张，发展此地作为后备基地也十分重要。"
  DEN_develop_Iceland_tt: "倘若形势不利，我们可以流亡至§Y冰岛§!继续进行抵抗运动。"

  DEN_the_fourth_war: "杜瑞战争"
  DEN_the_fourth_war_desc: "经济危机不会放过任何一个市场参与者，比起努力挥动船桨想要带着杜伦布这艘小船逃离漩涡的须理出总统不同，北方的瑞典滋生着极端主义，她们将把一些问题归咎在我们身上，这一战将决定共和国的国运！"
  DEN_mobilize_paramilitary_organizations: "动员准军事组织"
  DEN_mobilize_paramilitary_organizations_desc: "任何武装力量，只要向入侵者开枪，都是爱国者！"
  DEN_emergency_industrial_requisition: "紧急工业动员"
  DEN_emergency_industrial_requisition_desc: "每座工厂都应该开动起来，全力生产物资反抗侵略者！"
  DEN_armed_merchant_ships: "武装商船"
  DEN_armed_merchant_ships_desc: "每艘可用的商船都应接受征调，守卫宽广的海上防线！"
  DEN_defending_Kalma: "死守卡尔马"
  DEN_defending_Kalma_desc: "把一切可用资源调往卡尔马！丢失首都的杜伦布将完全失去反抗的力量，失去卡尔马就是失去一切！"
  DEN_emergency_firearm_production: "紧急枪械制造"
  DEN_emergency_firearm_production_desc: "每一把刀枪都应当出现在反抗瑞典人侵略的战场上，无论它能否战至最后！"
  DEN_slow_down_ban_on_superpowers: "放缓超能力禁令"
  DEN_slow_down_ban_on_superpowers_desc: "所有对超能力者的限制都将被解除！为杜伦布而战！"
  DEN_expand_war_department: "启动战争机器"
  DEN_expand_war_department_desc: "战争的阴云已经开始显现，时间紧迫，必须尽早集中资源备战。"
  DEN_develop_Breguet_company: "发展布列格公司"
  DEN_develop_Breguet_company_desc: "加大对布列格的支持，我们需要更多机械部队投入军队。"
  DEN_Ooarai_women_college: "强化大洗女子学院"
  DEN_Ooarai_women_college_desc: "我们的陆军极大参考了战车道的先进理念，是时候给与大洗更多支持，让我们的将军的战车更加强大了。"
  DEN_invest_star_sea_academy: "投资星之海学院"
  DEN_invest_star_sea_academy_desc: "超自然力量的限制解除后，对星之海的支持理应进一步加大，以培养更多超能力人才，甚至组建超能力部队。"
  DEN_great_war_courtyard: "伟大的战争庭院"
  DEN_great_war_courtyard_desc: "战争庭院无疑是杜伦布战争工业的杰作，对其技术研究和部分升级，将支持我国海空军发展。"
  DEN_integrate_enterprise_research_institute: "整合企业研究所"
  DEN_integrate_enterprise_research_institute_desc: "将三家机械设计前沿的主要研究所与布列格公司整合，设计更大、更美、更好的机甲"
  DEN_electricity_equipment_in_Iberia: "超次元的电力设备"
  DEN_electricity_equipment_in_Iberia_desc: "来自超次元的能量技术将有效解决长期困扰我们的机甲电力供应问题，现在，建造第一座超次元能量站吧。"
  DEN_electricity_equipment_in_Iberia_tt: "§Y$DEN_national_army$§!追加效果：\n$modifier_army_sub_unit_auto_meta_units_max_org_factor$：§G+20.00%§!\n§Y$DEN_national_navy$§!追加效果：\n$MODIFIER_AIR_MISSION_EFFICIENCY$：§G+10.00%§!"
  DEN_emphasize_rapid_armor: "重视快速装甲"
  DEN_emphasize_rapid_armor_desc: "战场上最美丽的风景线，莫过于敌人在装甲部队的冲击下溃不成军，Panzer vor!"
  DEN_emphasize_rapid_armor_tt: "§Y$DEN_national_army$§!追加效果：\n$MODIFIERS_ARMY_ARMOR_ATTACK_FACTOR$：§G+15.00%§!\n$MODIFIERS_ARMY_ARMOR_DEFENCE_FACTOR$：§G+20.00%§!"
  DEN_study_new_tactics: "研习新战法"
  DEN_study_new_tactics_desc: "德国将领提出一种强调集中高机动部队打开缺口，辅助快速分割包围的作战形式，它们称其为‘闪电战’"
  DEN_study_new_tactics_tt: "§Y$DEN_national_army$§!追加效果：\n$MODIFIER_PLANNING_SPEED$：§G+25.00%§!\n$MODIFIER_MAX_PLANNING_FACTOR$：§G+20.00%§!"
  DEN_authorize_magic_research: "授权魔物研究"
  DEN_authorize_magic_research_desc: "超能力生物研究过去在我国一直是种禁忌，现在限制解开后，我们终于可以深入探究魔物和魔力背后的秘密了"
  DEN_develop_small_vessels: "发展小型舰艇"
  DEN_develop_small_vessels_desc: "古代北欧人驾驶长船航行到美洲和非洲，作为他们的后辈，我们也应该打造属于这个时代的杜伦布“长船”"
  DEN_develop_small_vessels_tt: "§Y$DEN_national_navy$§!追加效果：\n$MODIFIER_SCREENING_EFFICIENCY$：§G+10.00%§!"
  DEN_rapid_naval_strategy: "快速海军策略"
  DEN_rapid_naval_strategy_desc: "古日德兰先辈们曾今用分割包围和持续袭扰的战术打败了欧陆其他大国的海军，甚至劫掠了伦敦和巴黎，推行快速袭扰战略就是这种传统的延续"
  DEN_rapid_naval_strategy_tt: "§Y$DEN_national_navy$§!追加效果：\n$MODIFIER_NAVAL_SPEED_FACTOR$：§G+10.00%§!\n$MODIFIER_NAVAL_RETREAT_SPEED$：§G+15.00%§!"
  DEN_pilot_and_sailor_training: "飞行员和水手培养"
  DEN_pilot_and_sailor_training_desc: "得益于先进的机械制造业，我们可以在很短的事件内制造一只机械大军，然而飞行员和水手却无法批量制造"
  DEN_pilot_and_sailor_training_tt: "§Y$DEN_national_navy$§!追加效果：\n$MODIFIER_AIR_ACE_GENERATION_CHANCE_FACTOR$：§G+15.00%§!\n$MODIFIER_POSITIONING$：§G+10.00%§!"
  DEN_strengthen_fuel_reserves: "强化燃油储备"
  DEN_strengthen_fuel_reserves_desc: "弗伦斯堡靠近基尔运河，是储备燃料与运送补给的最佳地点"
  DEN_strengthen_fuel_reserves_tt: "§Y$DEN_national_navy$§!追加效果：\n$MODIFIER_NAVY_FUEL_CONSUMPTION_FACTOR$：§G-15.00%§!\n$MODIFIER_AIR_FUEL_CONSUMPTION_FACTOR$：§G-15.00%§!"
  DEN_enhance_light_firepower: "强化轻火力"
  DEN_enhance_light_firepower_desc: "既然机炮重量太大，会影响机甲的机动性，为什么不退而求其次，给它配备几支闪亮的重机枪呢？"
  DEN_enhance_light_firepower_tt: "§Y$DEN_national_army$§!追加效果：\n$modifier_army_sub_unit_auto_meta_units_attack_factor$：§G+15.00%§!\n$modifier_army_sub_unit_auto_meta_units_defence_factor$：§G+20.00%§!"
  DEN_optimize_operational_units: "优化作战单元"
  DEN_optimize_operational_units_desc: "机甲部队的作战显然与普通部队并不相同，一个战斗单元至少应当包含一组无人侦查单位，一组自动防御单元与若干作战单元"
  DEN_optimize_operational_units_tt: "§Y$DEN_national_army$§!追加效果：\n$MODIFIER_ARMY_MORALE_FACTOR$：§G+15.00%§!\n$MODIFIER_DIG_IN_SPEED_FACTOR$：§G+20.00%§!\n$MODIFIER_RECON_FACTOR$：§G+15.00%§!"
  DEN_adaptive_training: "适应性训练"
  DEN_adaptive_training_desc: "紧靠机甲部队难以应对复杂环境，为此应当增设若干辅助兵团，以便在山地等地形复杂区域作战"
  DEN_adaptive_training_tt: "§Y$DEN_national_army$§!追加效果：\n$MODIFIER_DIG_IN_SPEED_FACTOR$：§G+15.00%§!\n$MODIFIER_ATTRITION_FACTOR$：§G-10.00%§!"
  DEN_strengthen_battlefield_hospital: "强化战地医院"
  DEN_strengthen_battlefield_hospital_desc: "在杜伦布，最重要的永远是珍贵的战士的生命，而不是廉价的子弹与机械"
  DEN_build_cruisers: "建造巡洋舰"
  DEN_build_cruisers_desc: "对现有舰艇型号适当进行升级改造，就可以获得一支吨位和火力都更强大的物美价廉的舰队"
  DEN_expand_shipyards: "扩大造船厂"
  DEN_expand_shipyards_desc: "大量扩建海军，需要我们持续加大对造船事业的投入"
  DEN_expand_shipyards_tt: "§Y$DEN_national_army$§!追加效果：\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$：§G+20.00%§!"
  DEN_aviation_industry: "航空工业"
  DEN_aviation_industry_desc: "对我们的空军工坊扩大支持，通过进一步改造升级，逐步实现高质量标准化生产"
  DEN_introduce_aircraft_design: "引进飞机设计"
  DEN_introduce_aircraft_design_desc: "什么是最完美的飞机？即使是聪明的杜伦布人也难以想出答案，不如邀请外国专家，借鉴各国设计理念取长补短"
  DEN_promote_magical_military_ration: "推广魔法军粮"
  DEN_promote_magical_military_ration_desc: "用了最新的魔法军粮，一袋顶过去三袋，军队的小伙子和他们的机甲都说好"
  DEN_promote_magical_military_ration_tt: "§Y$DEN_national_army$§!追加效果：\n$MODIFIER_SUPPLY_CONSUMPTION_FACTOR$：§G-20.00%§!"
  DEN_torpedo_tactics: "鱼雷战术"
  DEN_torpedo_tactics_desc: "最大的危险往往并不浮于表面，基于杜伦布人对这句话的理解，隐秘而致命的潜艇部队得以组建"
  DEN_underground_production_facilities: "地下生产设施"
  DEN_underground_production_facilities_desc: "基于杜伦布极度紧缺的土地资源，利用最新挖掘技术建设的部分底下生产设施是十分必要的"
  DEN_underground_production_facilities_tt: "§Y$DEN_national_navy$§!追加效果：\n$MODIFIER_INDUSTRY_AIR_DAMAGE_FACTOR$：§G-30.00%§!"
  DEN_electronic_information_engineer: "电子信息工程"
  DEN_electronic_information_engineer_desc: "在电磁与雷达科技方面，我们值得骄傲的一点是，为每架飞机、每艘舰艇、每个机甲作战单元都安装了一整套辅助雷达，以实现更高的作战效率"
  DEN_electronic_information_engineer_tt: "§Y$DEN_national_navy$§!追加效果：\n$MODIFIER_AIR_WEATHER_PENALTY$：§G-10.00%§!\n$MODIFIER_AIR_NIGHT_PENALTY$：§G-15.00%§!\n$MODIFIER_SPOTTING_CHANCE_FACTOR$：§G+10.00%§!"

  DEN_everything_go_smoothly: "诸事顺遂"
  DEN_everything_go_smoothly_desc: ""
  DEN_revised_code: "修订法典"
  DEN_revised_code_desc: "终于，1938年大选尘埃落定，虽然发生了一系列麻烦，但幸好最终有惊无险，须理出未来成功守住第二任期，现在是时候继续她的新杜伦布改造计划了"
  DEN_road_administration_reform: "路政改革"
  DEN_road_administration_reform_desc: "须理出未来对杜伦布改革计划的一大重点，就是在全国开展道路和建设整理规划，节约最大空间发展工业"
  DEN_industrial_management_regulation: "产业管理条例"
  DEN_industrial_management_regulation_desc: "须理出未来对杜伦布改革计划的另一大重点，就是加大经济调控力度，对产业实施有限管理，以实现更高效的资源配置"
  DEN_local_weapon_production: "本地武器生产"
  DEN_local_weapon_production_desc: "将部分工厂重组为军工厂，不仅加大了军事装备生产力度，也可以带动重工业发展，促进经济回流"
  DEN_corporate_supervisory_board: "企业监事会"
  DEN_corporate_supervisory_board_desc: "直接介入企业生产并不是一个刺激经济的好办法，也行我们能退而求其次，通过设置企业监事会，加强对大股东行为的管控，来间接引导企业"
  DEN_establishing_state_owned_enterprise: "建立国有企业"
  DEN_establishing_state_owned_enterprise_desc: "全面实现国有化被认为是过度经济管控的一大特征，但在关键领域布局产业龙头则是各国都普遍采取的先进做法"
  DEN_labor_subsidies_act: "劳工补贴法案"
  DEN_labor_subsidies_act_desc: "工人提供了国内绝大多数的就业与生产岗位，为他们提供足额补贴，能进一步激发生产热情，并促进市场消费"
  DEN_industrial_mobilization_act: "工业动员法案"
  DEN_industrial_mobilization_act_desc: "最新出台的工业动员法案，内容包括在国家需要时集中工业产能，对重点军事物资进行集中生产"
  DEN_build_social_democracy: "杜伦布的社会主义"
  DEN_build_social_democracy_desc: "什么是社会主义？它应当是文明和平，团结一致。通过政府管理，平衡各阶层劳动与利益，实现工人、企业家以及各类社会成员互相协调，在全社会范围内达成共识，摒弃矛盾共同发展。"
  DEN_era_of_change: "变革时代"
  DEN_era_of_change_desc: "Y未竟的事业理当由他的后继者完成，现在我们终于把握住这次机会掌握了政府，是时候将Y的天才构想付诸实施了"
  DEN_talent_introduction: "人才引进"
  DEN_talent_introduction_desc: "欧陆的战争导致大规模社会动荡，大量技术研究也随之中断，趁这次机会吸引更多外国科研专家，将杜伦布打造成人才的天堂"
  DEN_technological_governance_of_country: "技术治国"
  DEN_technological_governance_of_country_desc: "社会供需平衡与行业发展预期都是可以被数字化精密计算的系统科学，也应当由最强大的科研团队制定并组织实施"
  DEN_research_foundation: "科研基金会"
  DEN_research_foundation_desc: "“Y”机械师的党成功复兴，而他所代表的时代也将复兴，科研基金会将是我们迈出的第一步，每一个杜伦布人都应相信自己的双手，我们将用科技的力量创造新的卡尔马联邦！"
  DEN_new_development_plan: "新发展规划"
  DEN_new_development_plan_desc: "对杜伦布的土地、劳动力、资源等等要素进行全面统筹计算，以及多轮深度论证后，新发展规划酝酿而出"
  DEN_expand_education_investment: "扩大教育投资"
  DEN_expand_education_investment_desc: "天才的想法来自天才的大脑，天才的大脑来自天才的教育，每一个杜伦布孩童都应得到全欧陆最全面的教育，也许下一个Y就将来自于他们当中"
  DEN_enterprise_research_institute: "联合企业研究所"
  DEN_enterprise_research_institute_desc: "将分散在各大型企业中的研究人才与研究设备统一组织，并与官方科研力量充分融合，形成独一无二的强大科研平台——国家科技建设总院"
  DEN_additional_industrial_investment: "追加工业投资"
  DEN_additional_industrial_investment_desc: "当资金进入工厂与杰出的想法相融合，并逐步完善，最终形成新产业新产品，这就是杜伦布科技产业发展的秘诀"
  DEN_technology_competition: "科技竞赛"
  DEN_technology_competition_desc: "一项科技成果的价值不能仅靠市场决定，我们应当组织多层级的科研竞赛与评选体系，刺激全社会共同投入创新"
  DEN_German_government: "德国人的政府"
  DEN_German_government_desc: "出人意料的而又理所应当，杜伦布人民已经厌倦了须理出未来政府在应对危机时的迟缓动作，放任罢工和经济危机恶化。现在，他们做出了正确的选择"
  DEN_consolidate_power: "稳固权力"
  DEN_consolidate_power_desc: "通过德国财团与本届政府的紧密联系，使得我们可以在德裔群体间争取更多支持，从而迅速稳定局势"
  DEN_enterprise_appointment_system: "企业委任制度"
  DEN_enterprise_appointment_system_desc: "德意志技术世界第一！在各企业委任德意志人代表协助管理，腾出更多产能生产我们需要的物资"
  DEN_illegalization_of_the_opposition_party: "反对党非法化"
  DEN_illegalization_of_the_opposition_party_desc: "DIY民主党和其他反对派们都是一帮目光短浅、破坏国家利益的虫豸，让我们通过立法，全面取缔它们"
  DEN_strengthen_government_intervention: "强化政府干预"
  DEN_strengthen_government_intervention_desc: "现在，政府里充满了最会做生意的德意志企业家，由他们指导杜伦布的经济发展当然是理所应当"
  DEN_rebuilding_guild: "重建工会"
  DEN_rebuilding_guild_desc: "在杜伦布，工会成员由政府聘用，他们都来自工厂一线，可以最大程度协调企业和工人的利益，是工人们最好的老大哥"
  DEN_propaganda_machine: "政治宣传机器"
  DEN_propaganda_machine_desc: "发动所有媒体专家，告诉国内民众、企业联合党执政的正当性，每天播放一百次！"
  DEN_nationalization_of_key_enterprise: "重点企业国有化"
  DEN_nationalization_of_key_enterprise_desc: "对重点企业国有化，形成国资龙头，从而带头推进国家经济发展规划"
  DEN_deepen_party_and_state: "深化党国"
  DEN_deepen_party_and_state_desc: "精英作为大脑，党团作为中枢，政府、企业和工会形成四肢，比旧德意志更为团结强大。唯有如此，才能应对南方的威胁"
  DEN_reverse_to_Britain: "倒向圣杯王国"
  DEN_reverse_to_Britain_desc: "欧洲大陆的动乱已经近在咫尺，即使是贩夫走卒也能闻到硝烟的味道。在欧陆其他大国靠不住的情况下，我们唯有投向圣杯的怀抱，毕竟，圣杯是世界上最强大的国家"
  DEN_invest_in_iceland: "投资冰岛"
  DEN_invest_in_iceland_desc: "圣杯的强大海军可以保护我们不被敌人的登陆袭扰，让我们可以放心的投资冰岛，毕竟南方的威胁实在难以抵御"
  DEN_north_sea_military_presence: "北海联合舰队"
  DEN_north_sea_military_presence_desc: "借助与圣杯合作获得的强大海军科技，我们可以制造出更为强大的联合舰队"
  DEN_collaborative_research_on_mecha: "机甲合作研究"
  DEN_collaborative_research_on_mecha_desc: "圣杯的强大科研实力也体现在自动机械化方面，与他们合作必将在该领域产生更大的科研成果"
  DEN_southern_fortressization: "南部堡垒化"
  DEN_southern_fortressization_desc: "抛开海上登陆不谈，南日德兰将会直面来自欧陆强国的威胁，只有尽快加强此地的防备力量，才能在将来可能的大战里求得生存的机会"
  DEN_air_defense_network: "防空网络"
  DEN_air_defense_network_desc: "一个积极的消息是，对我们这样面积领土并不巨大的国家，不需要花费太多资源，就可以构建较为严密的防空体系"
  DEN_industrial_transfer: "产业转移"
  DEN_industrial_transfer_desc: "圣杯拥有巨大的海外殖民地与各类海外资产，如果有必要，我们可以在国内安全存在直接威胁情况下，将部分资产转移到圣杯进行远程管理，毕竟，圣杯是我们最值得信赖的可靠盟友"
  DEN_call_for_Nordic_union: "呼吁北欧联合"
  DEN_call_for_Nordic_union_desc: "北欧国家都是同宗同源的兄弟，在欧陆局势日益紧张的现在，更应该兄弟齐心，共御外辱"
  DEN_armed_neutrality: "武装中立"
  DEN_armed_neutrality_desc: "若要止战，必先备战，唯有敢战能战，才能避免无谓之战"
  DEN_research_mutual_aid_agreement: "科研互助协约"
  DEN_research_mutual_aid_agreement_desc: "科研领域侧重不同，互帮互助从而全面发展"
  DEN_restoration_of_Nordic_railway: "恢复北欧铁路"
  DEN_restoration_of_Nordic_railway_desc: "打通北欧交通线以便促进工业合作，在战时更能实现部队快速机动"
  DEN_establish_military_deterrence: "北欧军事演习"
  DEN_establish_military_deterrence_desc: "加强训练维护多国联军，分开的我们或许力量弱小，但当我们团结起来，即使是列强也不能轻易宰割"
  DEN_mineral_mutual_agreement: "矿产互助协定"
  DEN_mineral_mutual_agreement_desc: "北欧经济深入合作的过程，不仅是对国内矿产全面勘探开采，也是积极帮助兄弟国家发掘矿物"
  DEN_Copenhagen_fortress: "哥本哈根堡垒"
  DEN_Copenhagen_fortress_desc: "与强大的敌人战斗让我们必须做好万全准备，即使日德兰失守，西兰也将是我们的下一个战场"
  DEN_continuation_of_great_ideal: "赓续伟大理想"
  DEN_continuation_of_great_ideal_desc: "‘伟大理想’是指卡尔玛联盟破碎后，基于联邦意识进一步衍生出的统合北欧各民族，建立一个包括斯堪的纳维亚和波罗的海沿岸的统一国家，最终成为欧陆一级的泛民族主义思潮"
  DEN_northern_expedition_to_Sweden: "重启杜瑞战争"
  DEN_northern_expedition_to_Sweden_desc: "成功打赢上一次杜瑞战争后，瑞典陷入了社会分裂与政府倒台的局面，现在是时候让我们打破僵局，给瑞典人也送去战火的温暖了"
  DEN_Swedish_scheme: "瑞典方案"
  DEN_Swedish_scheme_desc: "虽然瑞典与我们曾爆发多次冲突，但现在我们都是一个统一北欧国家下的国民，应当适当给与他们一些帮助，方便我们更好的建立统治"
  DEN_request_to_merge_Norway: "要求合并挪威"
  DEN_request_to_merge_Norway_desc: "挪威，传奇英雄金发哈拉尔的家乡，在文化上也与我们联系紧密，如果当下挪威政府同意我们的合并要求，就可国安民乐，仍不失为富贵翁"
  DEN_Somi_plan: "索米计划"
  DEN_Somi_plan_desc: "索米服从于苏联本就是基于力量对比的权宜之计，现在回到北欧自己人的怀抱也是十分应当且必须的"
  DEN_develop_new_industry: "发展新兴产业"
  DEN_develop_new_industry_desc: "北欧漫长的海岸线不仅孕育了丰富的渔业资源，也为我们发展冰雪、旅游等新兴经济模式提供了基础"
  DEN_expand_maritime_project: "扩大海事项目"
  DEN_expand_maritime_project_desc: "整合了北欧的重工业以及造船业设施后，我们终于有了进一步扩张海军，建设一支更强大军队的能力"
  DEN_magic_industrialization: "北海工业化"
  DEN_magic_industrialization_desc: "用我们强大的工业能力，对挪威地区的工业进行全面整合，给这里的北欧人民带去更多工业产品"
  DEN_military_presence_in_Baltic_Sea: "波罗的海军事存在"
  DEN_military_presence_in_Baltic_Sea_desc: ""
  DEN_needle_tip_to_wheat_awn: "针尖对麦芒"
  DEN_needle_tip_to_wheat_awn_desc: "作为德意志人的北部家园，与南方仇敌的战争是不可避免的，既然如此，不如率先采取行动以谋得先机"
  DEN_form_youth_army: "组建青年军"
  DEN_form_youth_army_desc: "杜伦布国内人口稀少，这迫使我们采取更加宽泛的征召范围，并预先训练更多青年人，以便随时为祖国父亲而战"
  DEN_promote_revenge: "宣扬复仇主义"
  DEN_promote_revenge_desc: "每一位杜伦布公民都必须深刻认识到，在外部威胁如此巨大的情况下，保卫杜伦布与消灭南方仇敌已经成了同一件事，有我无敌"
  DEN_militarization_of_labor: "劳动军事化"
  DEN_militarization_of_labor_desc: "强大的外部威胁促使我们不得不进一步加强对工业生产的集中管理，特别是在某些重要产业，直接实施军事化管理"
  DEN_eliminat_worry_in_future: "消除后顾之忧"
  DEN_eliminat_worry_in_future_desc: "北方不友善的邻居随时都可能在我们进行命定之战时卑劣的偷袭我们，幸好我们的部队已经集结，准备先发制人"
  DEN_north_German_front: "北德意志阵线"
  DEN_north_German_front_desc: "德意志的国家体制与纪律精神在杜伦布得到了拓展与延伸，现在我们将告知世人，我们就是祖国父亲最骄傲的孩子，至于南方的奥地利佬们，不过是一群投机失败的歇斯底里的疯子罢了"
  DEN_recognizethe_Southern_government: "承认南方政府"
  DEN_recognizethe_Southern_government_desc: "面对强大的敌人，与南方的奥地利佬暂时合作也是一种权益之计"
  DEN_except_for_alien_protect_our_country: "除安兹，保家国"
  DEN_except_for_alien_protect_our_country_desc: "腓特烈大帝击败了一众欧陆强国，奠定了德意志称雄之基，现在，他的后继者即将再一次与强大的敌人战斗，只为解放家园和人民，德意志万岁！祖国父亲万岁！"
  DEN_pacify_various_feudal_domain: "平定诸藩"
  DEN_pacify_various_feudal_domain_desc: "安兹乌尔恭，可怕的对手，但伟大的日耳曼民族是无敌的，浴血之后，我们已经戡平北德意志，现在是时候向意图割据的德意志邦国以及外国干涉者们发出最后通牒了！"

  DEN_coalition_government: "工人联合政府"
  DEN_coalition_government_desc: "我们受够了被圣杯王国和魔导国操控的傀儡政党来替杜伦布人民做决定了！人民会选择一条自己做主的道路，哪怕会造成我们政治的混乱，但这个代价是值得的！"
  DEN_seek_unity_of_thinking: "统一思想"
  DEN_seek_unity_of_thinking_desc: "互相攻讦的党派，态度暧昧的军队，动向不明的敌国，我们没有足够的时间来保持队伍的纯洁了，为了让工人政府活下去，所有人都必须服从一个思想！"
  DEN_comrade_have_come_from_afar: "有同志自远方来"
  DEN_comrade_have_come_from_afar_desc: "回首往昔，冬宫一声炮响带来了十月革命的惊雷，震撼了整个世界。今日我杜伦布也在卡尔马和哥本哈根两座重镇发动了伟大的起义，北欧和中欧的革命火焰没有熄灭，我们将染红整个欧洲。而在这之前，让我们迎接远方的同志们。"
  DEN_bureaucratic_appointment: "官僚任用"
  DEN_bureaucratic_appointment_desc: "以前政府留下的官僚机关是腐败无能的，但总有一部分保持了自己的本心，我们可以试探用这些忠诚者为我们培养出属于工人自己的管理者！"
  DEN_enterprise_issue: "企业问题"
  DEN_enterprise_issue_desc: "经济的混乱必然会导致更严重的政治问题，现在的杜伦布人民经不起一点风浪了，现在让我们把恢复生产经济秩序作为政府的首要任务。"
  DEN_ministry_of_internal_affair: "成立内务部"
  DEN_ministry_of_internal_affair_desc: "没有谁是真的忠诚的，或者说，所有人都只忠诚于自己，我们不能相信他们会永远忠诚自己，工人政府需要一种新的力量，让我们在阴影里，可以看清这些人的真面目。"
  DEN_red_army: "红色军队"
  DEN_red_army_desc: "没有枪的政府就是一个傀儡！所有军队都应该坚定不移地站在我们这一边，清除那些立场不坚定者！让人民的军队重新回到人民手中！"
  DEN_fate_of_the_farmer: "农场主的命运"
  DEN_fate_of_the_farmer_desc: "民以食为天，物资充足是政权的有力保障，然而在我们改革的过程中，出现了一大批农场主对我们的政策阳奉阴违，现在他们已经被全部拘捕到案，对他们的审判关系到我们农业改革的前景！"
  DEN_party_issue: "党派问题"
  DEN_party_issue_desc: "现在国内局势已经稳定，但之前混乱时期没有做出处理的政党打着为国为民的口号反对我们的政策，甚至在我们党内也存在部分人士对他们抱有同情心理，者无疑是危险的，更值得我们警惕的是内务部报告一些同志正和这些家伙勾结，不能犹豫了，是时候讨论之前留下的政党以及党内派系问题的解决办法了！"
  DEN_head_toward_Leningrad: "航向列宁格勒"
  DEN_head_toward_Leningrad_desc: "列宁格勒！每一个共产党人的精神故乡，我们的到来受到苏联同志的欢迎，并达成了令双方满意的经济协议，我们相信，杜伦布人民总有一天会过上这样的日子！"
  DEN_accept_German_descendant: "接纳德裔"
  DEN_accept_German_descendant_desc: "自从基尔政府被魔导国法西斯摧毁后，一批受过良好训练的水兵逃亡到我国，作为同志，我们应当收留他们，哪怕会受到魔导国法西斯的直接威胁！"
  DEN_accept_German_descendant_tt: "这个国策将会强化来自基尔的四位上将的属性"
  DEN_deportation_of_Kiel_sailor: "遣送基尔水兵"
  DEN_deportation_of_Kiel_sailor_desc: "基尔政府的同志们组织的起义失败了，现在魔导国给我国施加了强大的外交压力，尽管很想保下他们，但理智告诉我们，现在的杜伦布根本扛不住魔导国的攻击，因此，我们必须作出这个痛苦·的选择！"
  DEN_criticism_of_radicalism: "批评激进主义"
  DEN_criticism_of_radicalism_desc: "激进主义的存在让我们的同志们在处理一些事情的时候总想着快刀斩乱麻，但事实上反而导致事情更加复杂化，这将不利于我党未来工作的开展，因此组织一场自我批评大会，扼杀住这种不正之风！"
  DEN_capital_controversy: "首都之争"
  DEN_capital_controversy_desc: "现在的杜伦布共和国首都是以往政府为了方便外贸联络而设立的，毕竟以前的杜伦布经济全靠外贸，然而越发严峻的世界局势让我们不得不思考一个问题，目前在沿海的首都是否应当内迁，这件事导致许多同志意见不一，我们应当专门讨论一下。"
  DEN_go_against: "背道而驰"
  DEN_go_against_desc: "针对基尔政府流亡者的处理结果导致了我们无法想象的后果，一场针对执政党的真理大辩论即将展开，而这一次，我们不存在妥协的空间，这场斗争，会将杜伦布引向何方呢？"
  DEN_go_against_tt: "§R斗争最终会有一个结果……§!"
  DEN_victory_of_humanitarianism: "人道主义的胜利"
  DEN_victory_of_humanitarianism_desc: "很显然，大选的结果否定了莫斯科式的革命建设方案，并且在国内树立了一个共同目标：在将革命传播至整个北欧之前，以工人自己解放自己为革命的核心，努力建设一个更为广泛、直接、人道主义的社会主义自治体。"
  DEN_class_struggle: "阶级斗争"
  DEN_class_struggle_desc: "大选结束了关于社会主义建设的诸多重大分歧。巩固权力的党领导集体已然准备好展开一系列政治改革，将杜伦布改造为一个真正的苏维埃政权。"
  DEN_enterprise_reform: "企业改革"
  DEN_enterprise_reform_desc: "在列宁主义者主导下开展的企业国有化工作仍然保持着相对传统的运营结构，如今这一仍然僵硬低效的企业组织形式需要进一步的改革。"
  DEN_delegate_power_to_the_lower_level: "权力下放"
  DEN_delegate_power_to_the_lower_level_desc: "临时政府的集权化完全是出于保卫革命成果与恢复国内稳定的政治需要，在临时政府随着莫斯科派的退场同时结束其历史使命时，总工会必须重新组织一套真正属于全体国民的新型地方行政体系，以恢复并进一步加强基层民主在社会运作中的关键地位。"
  DEN_control_and_plan: "统制与计划"
  DEN_control_and_plan_desc: "革命政府必须确保国内经济能够得到集中有力的管控与干预。以为即将制定的苏维埃经济发展计划奠定制度保障。"
  DEN_one_party_system: "确立一党制"
  DEN_one_party_system_desc: "大选所暴露出的革命领导集体的分裂是所有人都不乐见的。在一个国家、一个政府、一面旗帜之下，一个效仿苏维埃联盟建立起来的政治局力图将杜伦布共产党从工人代表的松散联合重新改革为为一个统一、高效且路线明确的军政领导核心。"
  DEN_restrict_private_property: "限制私人财产"
  DEN_restrict_private_property_desc: "新的温和派工会政府并不禁止民营经济的存在，但企业家必须接受对其私人收入与资本产出更加严苛的限制与重新分配，她们必须承担起社会福利事业的部分经济成本。"
  DEN_decentralization: "去中心化"
  DEN_decentralization_desc: "杜伦布的社会治理很显然并不需要一个总领各方、凌驾于一切之上的行政机关。对地方政府体系进行的一系列减负将有益于进一步促成多元化的行政管理模式并实现基层社区的高度自治。"
  DEN_cooperative_principle: "合作社原则"
  DEN_cooperative_principle_desc: "在土地承包制基础上，我们可以促成基层的个体农业生产者进一步组成具有自治性质的农业互助组织。并且通过赋予其社会治理功能，我们也可以籍此进一步实现乡村地区自治的现代化。"
  DEN_democratic_centralism: "民主集中原则"
  DEN_democratic_centralism_desc: "我们不能放任革命的敌人给苏维埃冠以独裁与暴政之名。必须明确领导集体与群众、人民与敌人、革命与反革命份子的关系问题，在革命决策的集中下实现党内民主。"
  DEN_social_reform: "社会改造"
  DEN_social_reform_desc: "新兴的苏维埃政权应当在各个行业内进行广泛的社会主义改造，以期实现杜伦布苏维埃在一个相对较短的时间内实现经济、政治、社会上的社会主义化。"
  DEN_workers_autonomy: "工人自治"
  DEN_workers_autonomy_desc: "在新的企业组织结构的指导下，杜伦布总工会已经准备好在国内企业中实现工人阶层对企业内部管理的高度控制，促使国家工业体系真正成为工人民主中的重要部分。"
  DEN_strive_for_support_of_farmers: "争取农民支持"
  DEN_strive_for_support_of_farmers_desc: "脱胎于工业无产阶级中的杜伦布工会先天缺乏来自乡村的政治与社会支持。本国经济建设必须更加顾虑农民阶级的意愿，固守工人与城市优先的经济发展战略至少对于本国来说是短视的。"
  DEN_worker_supervision: "工人监督"
  DEN_worker_supervision_desc: "高度集中的党政组织几乎必然招致官僚主义等问题。这势必会导致党在一定程度上脱离群众。有必要让党组织在经济尤其是工业经济内与产业工人继续保持高度的联系。深化革命决策团体与生产者的联系。"
  DEN_red_academy: "红色学院"
  DEN_red_academy_desc: "国内以星之海乃至大洗为首的高等学府在一定程度上暴露了我国在高等教育体系上过分偏重超自然与机械制造的问题。在党政知识分子的指导下，苏维埃需要在自然科学乃至社会科学上补齐教育短板，实现国内教育事业的多元化与全面化。"
  DEN_local_investment: "地方投资"
  DEN_local_investment_desc: "对于总工会来说，工人的生产热情就是杜伦布式工团主义最大的生产力。在工人解放与宣传鼓励工作的指导下，工人集体具备足够的热情由她们自己实现地区内的工业扩张与资本增值——只需要中央在资金上给予足够的支持。"
  DEN_strategy_for_Sweden: "经略瑞典"
  DEN_strategy_for_Sweden_desc: "宜将剩勇追穷寇，试图恢复昔日荣光的瑞典侵略者已如丧家之犬，此番良机稍纵即逝。不过切记，当楚河汉界被我等再一次越过，北欧的未来便将系于我等之手。"
  DEN_using_country_as_fence: "以国为篱"
  DEN_using_country_as_fence_desc: "给予了侵略者迎头痛击，也许我们该把酒言欢，或是穷追猛打，但战争的阴云并未散去。毫无疑问，继续沉浸在兄弟相争之中是愚蠢的。将北境友邦团结起来，以应对一场可能会让卡尔马之战都相形见绌的的巨人之争。"
  DEN_support_Mevli: "支持美波里"
  DEN_support_Mevli_desc: ""
  DEN_deepen_cooperation: "深化合作"
  DEN_deepen_cooperation_desc: "整片北欧大陆都被我等连结为一体，但友邦的经济与军事实力稍有欠缺，作为联盟的主导者，北境最强大的力量，我们有义务为盟国进行一系列的经济援建与资源勘探。"
  DEN_Kalmar_conference: "卡尔马会议"
  DEN_Kalmar_conference_desc: "随着我们在北欧的势力范围逐渐稳固，在卡尔马的旗帜下重新将北欧各国予以政治统一已然成为可能。是时候重拾古老联盟的精神了。"
  DEN_go_south: "南下"
  DEN_go_south_desc: ""
  DEN_secret_meet_with_FIN: "密会沙仓枫"
  DEN_secret_meet_with_FIN_desc: ""
  DEN_support_German_communist: "支持德国共产党"
  DEN_support_German_communist_desc: "德国的共产主义武装再一次向法西斯分子举起了义旗，两国的革命者一衣带水，德意志的革命也自然是杜伦布革命的一部分。"
  DEN_claim_north_Germany: "宣称北德意志"
  DEN_claim_north_Germany_desc: "我们曾在德意志军国主义者的压迫下彻底失去掌控石-荷的机会，而如今大势逆转。亦有更多的德意志裔遗民在北境支持我们的统治。此时若不旧事重提，更待何时？是时候讨还本就属于杜伦布的地方了——自然，我们所求更多。"
  DEN_ideological_struggle: "意识形态斗争"
  DEN_ideological_struggle_desc: ""

  DEN_comprehensive_martial_law: "建立临时政府"
  DEN_comprehensive_martial_law_desc: "来自北海的暖流日渐衰微，自诩世界霸主的圣杯王国在萧条与动荡中又度过艰难一年，杜伦布还能像过去二十年那样凭借中立和民主在战争的威胁下保护自己吗。软弱的DIY党迟迟未能解决赤匪暴动，“Y”党在失去主心骨后也失去以往果决坚定的行动能力，连外来的德国难民和德资寡头都对政权垂涎已久，不能再迟疑下去了！必须有人肩负起保护杜伦布的责任，颠覆软弱不堪的民主制度，把国民团结起来。"
  DEN_Summing_up_lessons_of_war: "总结战争教训"
  DEN_Summing_up_lessons_of_war_desc: "无论结果如何，这场战争本身对我国来说都是一次宝贵的战争课程，通过总结在此次战争中的得失，我们可以进一步磨砺本国的战争机器。以应对未来烈度将不可同日而语的世界大战。"
  DEN_Expand_conscription: "扩大征兵"
  DEN_Expand_conscription_desc: "很显然，魔导国有求于我们的地方自然是北境的武装力量，但很遗憾，现在的国内武装力量仍然稍显不足，我们必须进一步扩大兵源"
  DEN_Elite_troops: "部队精英化"
  DEN_Elite_troops_desc: "哪怕控制整个北欧，杜伦布都难以真正组织起一支如同魔导国那般强悍的庞大军队，但兵不在多而在精。一支百战之师同样能为我国在战局中争得荣誉。"
  DEN_Teaching_Corps_of_Wizard_Nation: "魔导国教导团"
  DEN_Teaching_Corps_of_Wizard_Nation_desc: "魔导国在征服德意志各地的行动中展现了自己非凡的军队组织能力，杜伦布的机械军团和机动战法也十分契合魔导国军队的战术思想，而魔导王如今正热衷于在欧洲散播自己的影响，凭借两国的友好关系，我们可以轻松争取到一支优秀的教导团前来指导杜伦布军队改革。"
  DEN_secret_police: "秘密警察"
  DEN_secret_police_desc: "软弱的民主政府面对危机全无准备，竟然会被一群学生把社会搅得天翻地覆，必须把国民置于完全的保护和管制之下，防止任何可能的密谋与暴动，和这群虫豸在一起怎么治理得好国家呢，必须要对危害政权的家伙出重拳！。"
  DEN_Suppress_Red_Bandits: "压制赤匪"
  DEN_Suppress_Red_Bandits_desc: "贼党夺取杜伦布政权的行动已被挫败，但是这群赤匪仍然在工厂和田地间流窜，试图使我们偏离既定航线，不能给红色危险分子喘息的机会，马上动员军警！"
  DEN_Dealing_with_German_pie: "处理德国派"
  DEN_Dealing_with_German_pie_desc: "从德意志逃窜来的资本和民众已然成为杜伦布不可忽视的一股力量，她们试图把独立的杜伦布变成反攻故土的北方桥头堡，我等岂能让外来者如愿！她们要么融入北欧，要么被送回德意志。"
  DEN_Wooing_Y_party: "拉拢“Y”字工人党"
  DEN_Wooing_Y_party_desc: "“Y”字工人党虽已衰弱，但她们把持着杜伦布引以为傲的自动机械技术，而且对统一北欧仍然抱有雄心壮志，作为一路人，相信“Y”字工人党很乐意接受我们的邀请，共享爱国者的理想、野心、力量。"
  DEN_Stabilize_order: "稳定秩序"
  DEN_Stabilize_order_desc: ""
  no_DEN_communist_rebellion: "没有§R赤匪叛乱§!"
  no_DEN_germany_rebellion: "没有§Y德国人叛乱§!"
  DEN_The_battle_for_revenge: "复仇之战"
  DEN_The_battle_for_revenge_desc: "瑞典人趁人之危夺取了我们的故土卡尔马，我们已经准备好重新解放这片土地，自动机械将踏平仇敌的防线，直到帝国的旗帜插上斯德哥尔摩！"
  DEN_Defeat_the_general: "痛击败将"
  DEN_Defeat_the_general_desc: "妄图夺取卡尔马的瑞典侵略者不久前已在团结一致的杜伦布面前败下阵来，我们的军队将粉碎瑞典人的抵抗，让这群手下败将永远品尝不到胜利的滋味！"
  DEN_Defender_of_Empires_North: "帝国北疆保卫者"
  DEN_Defender_of_Empires_North_desc: "很显然，魔导国对于插手北欧事务毫无兴趣，帝国许诺我们整个斯堪的纳维亚大陆的统治权只是时间问题。当然，更关键的一点是，魔导王似乎更期待我们在北方战局中将要起到的关键作用...这意味着只需稍加运作，便有机会在不列颠岛的归属问题上得到南方的许可，当然，前提是我们能够像先人一般登上不列颠的土地..."
  DEN_Defender_of_Empires_North_tt: "魔导王允许我们统治北欧与不列颠"
  DEN_Co_Servant_Navy: "协从海军"
  DEN_Co_Servant_Navy_desc: "哪怕是魔导国自己都必须承认，帝国完全无法在海上战场与羽翼丰满的皇家海军争夺制海权。她们偏科的战争机器使得在北海战区几乎必须倚仗我们的力量——当然，前提是我们也得能和皇家海军掰手腕。"
  DEN_Expand_shipbuilding_program: "扩大造舰计划"
  DEN_Expand_shipbuilding_program_desc: "在德意志人源源不断的战略物资输送下，我们能够放开手脚，尝试扩张我们在北海的舰队力量。第一步便是在战区制造并部署更多的大型战舰。"
  DEN_Specialized_in_landing_operations: "专精登陆作战"
  DEN_Specialized_in_landing_operations_desc: "要想向我们的维京前辈们踏上到过的疆土，我们所需要的不再仅仅是两把板斧和一腔热血。在尝试为魔导国的主力部队打开前往伦敦的登陆场前，我们必须拥有一支专业化的两栖作战部队。"
  DEN_Co_Servant_Air: "协从空军"
  DEN_Co_Servant_Air_desc: "尽管拥有着庞大的空军力量，但魔导国仍然在与皇家空军的空中绞肉中苦不堪言。很明显，她们需要一支至少得差强人意的独立空军加入战局——那当然得是我们的空军。"
  DEN_Research_advanced_bodies: "研究先进机体"
  DEN_Research_advanced_bodies_desc: "我们缺乏量产战机所需要的大量资源，精兵战略是我们必须着手的方向。在这个问题上，我们比南方的魔导国更需要新锐机体的技术突破。"
  DEN_Seize_air_supremacy: "抢夺制空权"
  DEN_Seize_air_supremacy_desc: "也许我们无法独立承担战略打击的主要任务，但稍显精锐的空军联队可以在协助盟国抢夺与确保制空权的任务中发挥独特的作用。"
  DEN_Unify_northern_frontier: "一统北疆"
  DEN_Unify_northern_frontier_desc: "我们已经在斯堪的纳维亚半岛上称雄，无人可以阻拦北境统一之势，就像祖先在数百年前所希冀的那样。杜伦布人在北境的霸权已然无可动摇。"
  DEN_Baltic_coast: "波罗的海沿岸"
  DEN_Baltic_coast_desc: "在北疆诸敌被扫平后，凭借海峡之利，帝国海军已经牢牢控制住波罗的海，圣杯王国与幻想乡无暇顾及波罗的海诸国的安危，苏联人目前仍无意介入大战，正是我们收复卡尔马联盟南方故土的大好时机。"
  DEN_Land_of_Arctic: "北极之地"
  DEN_Land_of_Arctic_desc: "魔导王赐我们以帝国北方的广阔领土，杜伦布军队将凭借丰富的雪地作战经验，在征服苏联的过程中展现自己的价值，齿轮之国将征服这片大陆上最北的土地！。"
  DEN_sword_points_to_britain: "剑指不列颠"
  DEN_sword_points_to_britain_desc: "对于魔导国来说，不列颠岛是人类在西欧的最后堡垒，讽刺的是，攻破这座堡垒的，不会是外星人，而会是我们，是时候重走来时之路了！诸位！登上海岸！"
  DEN_check_the_acres_of_land: "清查田亩"
  DEN_check_the_acres_of_land_desc: "经济危机引发的连锁反应使政府失去了对产业的掌控，重建经济秩序的第一步就是派官员们去重新清点土地，好让我们知道杜伦布土地的底蕴。"
  DEN_open_borders: "开放边境"
  DEN_open_borders_desc: "就目前的政治形势下，继续维持与魔导国的边境封锁自然已不可能，相反，通过一条宽松的边境开放法令，我们可以将那些恼人的德资寡头遣送回籍，同时吸引更多的德裔劳工。"
  DEN_agricultural_research_institute: "农业科研所"
  DEN_agricultural_research_institute_desc: "以土地清丈的结果为基础，我国将在魔导国的技术人才支援下设立专业的农业科研机构，以研究如何在寸土寸金的北欧大陆发展规模农业。"
  DEN_excellent_cheese_industry: "卓越乳酪业"
  DEN_excellent_cheese_industry_desc: "我国的农产品加工产业得益于先进的技术水平享誉世界。其中尤以乳酪制品为优，世界闻名。"
  DEN_magic_cow: "魔法奶牛"
  DEN_magic_cow_desc: "魔导国已经对我国提出的引入魔法牛种的请求予以肯定。不过这些蕴含着魔法的奶牛品种内有乾坤，要想用她们产出独特的魔法乳制品，在技术上我们还需要攻关作业。"
  DEN_Introduce_characteristic_animal_husbandry_of_DVL: "引进魔导国特色畜牧业"
  DEN_Introduce_characteristic_animal_husbandry_of_DVL_desc: "入主博联，魔法奶牛畜牧业作为农业复苏的先锋和支柱产业在魔导国发挥着举足轻重的作用，但随着魔导国开始进一步发动德意志的战争机器，农产品生产也面临着不可避免的萎缩——除非她们愿意将产业与技术引入我国。这完全是一笔双赢的生意。"
  DEN_state_controlled_economy: "国控经济"
  DEN_state_controlled_economy_desc: "工人贼党的闹剧充分说明了自由市场与传统资本企业的不可控性。为了避免本国经济再因为诸如经济冲击、工人暴动等完全可以迅速解决的事态遭受损失，杜伦布必须将所有本国产业纳入国家的直接控制之下。"
  DEN_accommodate_foreign_investment: "容纳外资"
  DEN_accommodate_foreign_investment_desc: "再将那群最后的德国人扫地出门后，我们也应该欢迎真正的海外友人投资本国。引入魔导国的金融资本与产业有利于保障本国经济的弹性与活力。虽然这帮人来到这里可不一定只是为了赚钱..."
  DEN_centralized_mechanical_workshop: "集中式机械工坊"
  DEN_centralized_mechanical_workshop_desc: "在工厂及工人管理层面，在软弱的民主政府放纵下野蛮生长的左翼工会必须被连根拔起，取而代之的当是社团主义性质的集中式机械工坊，这才真正有利于组织生产和团结本国人民。"
  DEN_automatic_machinery_supply: "自动机械供给"
  DEN_automatic_machinery_supply_desc: "作为本国武装力量的支柱之一，自动机械虽然已经实现了大量生产，但尚未实现完善的军备供给。在迎接战争的风暴之前，有必要确保一条足够可靠的国内生产线为杜伦布军队提供源源不断的自动机械装备。"

  DEN_rebuild_the_Kalmar_Union: "重建卡尔马联盟"
  DEN_rebuild_the_Kalmar_Union_desc: "自1521年至今已逾四百余年，如今我国将再一次以卡尔马联盟的名义将北境的兄弟之国结为一体。"
  DEN_economic_integration: "经济一体化"
  DEN_economic_integration_desc: "通过北欧各盟国的国内产业联合调节与共同发展，联盟将首先实现各个地区的经济联合。打破各国间长期形成的贸易壁垒，实现各项资源在北境的自由流动，最终形成大陆范围内的共同市场。"
  DEN_common_currency: "联盟通用货币"
  DEN_common_currency_desc: "作为经济一体化的必经之路，以共同流通的统一货币与一致的货币政策为基础，卡尔马联盟将成为一个真正意义上的经济实体。"
  DEN_unified_railway: "联合运营铁路"
  DEN_unified_railway_desc: "尽管互为邻国，但联盟各国的轨距标准都各有区别。为此；联盟将成立一个联合委员会进行改造工作，并代表各国联合运营联盟境内的轨道交通系统。"
  DEN_expand_economic_investment: "扩大经济投资"
  DEN_expand_economic_investment_desc: "我们应当说服联盟各国的企业家优先在联盟内部扩大投资，进一步巩固联盟自贸区的经济活力。"
  DEN_technical_cooperation: "加强技术合作"
  DEN_technical_cooperation_desc: "各国间的技术壁垒亦当随着贸易壁垒的消除而随风而逝。各国的技术研发部门也应当在联盟的集中指导下实现科研领域的合作与共享。"
  DEN_unified_fiscal_reform: "地区财政改革"
  DEN_unified_fiscal_reform_desc: "各国之间的财政统一也是联盟势在必行的改革之一，而且在此之上联盟将更进一步。直接对各个地方的财政予以控制。"
  DEN_strengthen_military_industry: "发展军事工业"
  DEN_strengthen_military_industry_desc: "联盟的扩大自然而然地使国防成本不断膨胀，考虑到战前各国的武装水平层次不齐。为了保卫联盟安全我们必须调配更多的国防支出。"
  DEN_federalize_Northern_Europe: "北欧联邦化"
  DEN_federalize_Northern_Europe_desc: ""
  DEN_coalition_governing_council: "最高执政委员会"
  DEN_coalition_governing_council_desc: ""
  DEN_universal_suffrage_system: "建立普选制度"
  DEN_universal_suffrage_system_desc: ""
  DEN_protect_national_culture: "保护民族文化"
  DEN_protect_national_culture_desc: ""
  DEN_constitutional_referendum: "宪法公投"
  DEN_constitutional_referendum_desc: ""
  DEN_pluralistic_federation: "成立多元化联邦"
  DEN_pluralistic_federation_desc: ""
  DEN_national_defense_integration: "国防一体化"
  DEN_national_defense_integration_desc: "随着政治一体化的推进，我们有必要将各个国家的武装力量也予以整编，最终重新组织属于联盟的统一国防体系。"
  DEN_pilot_joint_training: "飞行员联合培养"
  DEN_pilot_joint_training_desc: "联合起来的军队自然需要能够紧密协作的联合空军，为此联盟需要从飞行员培训抓起，从学员阶段便一同训练学习，直到合而为一。"
  DEN_united_airlines: "联合航空公司"
  DEN_united_airlines_desc: "航空领域是联盟共同的战略蓝海，为了更好的整合空天资源，我们必须确保有一个统一的运营及指挥项目开展相关工作。"
  DEN_introduction_of_new_aircraft: "引进新式战机"
  DEN_introduction_of_new_aircraft_desc: "联盟空军不只需要内部整合，我们可以利用更多的资源从海外引进更加先进的战机型号与引擎。"
  DEN_Nordic_airborne_troops: "北欧空降部队"
  DEN_Nordic_airborne_troops_desc: "相比于两栖作战，联盟需要一条更加高效的武装投入方式以应对北境之外的战火。很明显，天空是比海洋更加辽阔的疆域。"
  DEN_Joint_bomber: "联合开发轰炸机"
  DEN_Joint_bomber_desc: "战略打击一直是空战的重点项目，所以我们有必要集中资源开发出独步于世界的先进轰炸机型。"
  DEN_Nordic_naval_entente: "北欧海军协约"
  DEN_Nordic_naval_entente_desc: "海上力量的联合将使联盟更加有效的保卫北海疆域，并且通过协调与联合指挥，打造一支不逊于北海强邻的海军力量。"
  DEN_unified_command: "统一信号指挥"
  DEN_unified_command_desc: "海上战斗的制胜之处，便是每个人都能理解自己的职责所在。"
  DEN_demarcate_cruising_area: "划定巡航区"
  DEN_demarcate_cruising_area_desc: "疆域的扩大同样意味着联盟必须将精力放在更多的重要航线之上，常规的护航模式难以做到尽善尽美，因此依旧有必要以各国航区为准，划分相对独立的护航区域。"
  DEN_reconfiguration_of_fleet: "重组舰队"
  DEN_reconfiguration_of_fleet_desc: "联盟力行的统一化原则自然也要落实到舰队组织上。各国的海军遗产和新锐舰队都应当在统一的指挥下进行重组。"
  DEN_joint_naval_school: "联合海军学校"
  DEN_joint_naval_school_desc: "集中各国的海军学院资源与教学人才，联盟将建立起一系列的新海军院校，它们所培养出来的人才将统一为崭新的联盟舰队发光发热。"
  DEN_develop_new_warships: "开发新式战舰"
  DEN_develop_new_warships_desc: "并不是将几个国家的老旧战舰集中起来，联盟海军就能成为独步北海的霸主。联盟仍然需要最新式的海军力量加入舰队。"
  DEN_joint_exercise: "联合演习"
  DEN_joint_exercise_desc: "各国的军队从未形成过如今的联合局面。要想我们的三军力量彻底成为一个战斗整体，那她们首先得作为一个整体进行组织与训练。"
  DEN_naval_aviation: "海军航空兵"
  DEN_naval_aviation_desc: "海战的最前沿仍是她们上方的天空，联盟需要一支可堪大用的航母编队，自然也需要一支能与之相匹配的海军航空兵力量。"
  DEN_Nordic_general_staff: "北欧总参谋部"
  DEN_Nordic_general_staff_desc: "各国的武装力量都集结在一面旗帜之下，自然，我们也需要一支能够以这面旗帜的名义掌握部队的指挥部门。联合军事司令部的组建自然要尽快提上日程。以为各个地区的武装部队制定完善的计划。"
  DEN_joint_military_procurement: "联合军事采购"
  DEN_joint_military_procurement_desc: "各国的后勤部门仍然在各自负责的武装力量工作着，我们的工作则是将她们也整合起来，形成统一的采购与调配部门。"
  DEN_organize_demon_army: "整编魔物军队"
  DEN_organize_demon_army_desc: "挪威的军事武装比起其他国家都要来得独特，我们不能只因畏难就将挪威境内存在的大量成建制魔物部队予以解散或搁置。相反，我们亦当将其重新整编为一支专业化的怪物步兵力量。"
