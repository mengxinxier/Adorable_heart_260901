  DEN_neia_party_long: "真理与秩序统一战线\n§g当共和政府的齿轮因争吵和软弱而锈死，当饥饿的民众被迫北上却只能在寒风中绝望时，巴拉哈女士为我们指明了道路。秩序不再是法律书上的文字，而是勃兰登堡门前那座不可撼动的骸骨山丘。弱小是罪，而我们，选择了服从于最伟大的正义。§!"

