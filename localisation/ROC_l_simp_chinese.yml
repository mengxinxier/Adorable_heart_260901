  ROC_UP_expand_local_autonomous_desc: "终于，我们在全国各地都建立起了地方自治，如今我们离那美好的愿景只差一步之遥了。"
  ROC_soviet_united_remove_autonomous: "合并地方行政机构"
  ROC_soviet_united_remove_autonomous_desc: "我们和共产党的同志们有着共同的革命愿景，在我们证明了国民党并非军政独裁之匪徒，而是一心向革命的社会主义革命政党后，共产党的同志同意了加入我们的政府机构。"
  ROC_yufu_remove_autonomous: "推进军队国家化与政治民主化"
  ROC_yufu_remove_autonomous_desc: "我们决定与中共进行再一次谈判，谈军队国家化，谈中共加入我们政府的各级选举，尽管这可能会有一个比较长的时间，但我们将展示我们的决心：民权主义必将实现！"
