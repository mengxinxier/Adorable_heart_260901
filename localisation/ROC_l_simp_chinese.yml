  ROC.169.a.tt: "§L我们将率先在§4非中共自治区§!推行地方的民主自治，随后在§R中共自治区§!推行\n\n当推行完成后，所有地区都将获得一个地方自治的§Y动态修正§!，这将减少当地的可征募人口，但增加§Y地方最大工厂数§!和§Y补给§!以及§Y建设速度§!，§R中共自治区§!将在获得地方自治的同时失去自治区§Y动态修正§!§!"
  ROC.169.b.tt: "§L我们将在§R中共自治区§!推行地方的民主自治，§R中共自治区§!将在获得地方自治§Y动态修正§!的同时失去自治区§Y动态修正§!§!"
  ROC.169.c.tt: "§L我们将推动两个§R革命政党§!的合并，这将去除§R中共自治区§!的§Y动态修正§!§!"
  ROC.169.d.tt: "§L我们将和§R革命友党§!§4精诚团结§!，一同奔赴革命明天！\n\n这将去除§R中共自治区§!的§Y动态修正§!§!"
  ROC.169.e.tt: "§L我们将磋商关于自治事宜的解决方案，§R中共§!全面进入国会和参与地方选举。\n\n这将去除§R中共自治区§!的§Y动态修正§!§!"
  ROC.169.f.tt: "§L我们将恪守协议，在协定的过渡期结束之前，不改变§R中共自治区§!的格局。§!\n\n§Y对玩家的你来说就是不会去除地方的修正了。§!"
  ROC_UP_local_autonomous_level_up_tt: "§L因为我们选择了全面追求地方自治，获得以下效果：\n解锁决议：§Y完善地方自治§!\n我们可以通过完成该决议来强化地方自治的修正效果§!"
  ROC_NOT_be_another_leader_tt: "§Y$CHARA$§!不是当前的§Y副手§!"
  ROC_focus_GuoJunHu_DangJunHu_tt: "§L该国策将在确定§4党国§!的路线后根据你的§Y领导人§!对§Y军队国家化§!的倾向而产生不同的效果。\n§!"
