#政党
  ROC_neutrality_party: "国民党-民革与民宪会"
  ROC_neutrality_party_long: "中国国民党-革命委员会与宪政同志会\n§W--------------------------------§!\n§L民革与民宪的执政联盟是广府国民政府在1936年开局时最核心的权力架构，也是维系革命政权脆弱团结的政治基础。这个联盟由革命委员会和宪政同志会共同组成，以宋庆龄和宋教仁为核心人物，在两派共享的“反帝反军阀”旗帜下维持着表面稳固、内里紧绷的合作。§!"
