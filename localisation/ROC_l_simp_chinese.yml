  ROC_focus_GuoJunHu_DangJunHu_loc_1: "国军乎？党军乎？"
  ROC_focus_GuoJunHu_DangJunHu_desc_loc_1: "在国民革命的大部分时间里，国民革命军都作为国民党实现革命理想之党军，如今随着革命进入宪政时期，人们不禁要问出一个问题来：掌握着军队的国民党要是想掀桌呢？为了保卫民主，就必须实现军队国家化，不能让军队掌握在任何一个政党手里。"
  ROC_focus_GuoJunHu_DangJunHu_loc_2: "党军乎？革命军乎？"
  ROC_focus_GuoJunHu_DangJunHu_desc_loc_2: "先总理早年的多次起义经验告诉我们，要想实现国民革命，就必须要拥有一个完全听命令的军队。然而此前党内各派系斗争严重损坏了这一原则，多方势力都想对军队施加影响，现在党内斗争已经结束，我们要在军内重新建立起党的威信。"
