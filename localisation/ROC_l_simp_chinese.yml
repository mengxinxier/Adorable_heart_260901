##结语

  ROC_end_title_1: "至此，§P[ROC.Getname]§!的征途告一段落"
  ROC_end_tip_1: "洛茜继续在那些还没有通电的村子里建学校。宋主席每年寄出的信越来越少，收到的信越来越多。有一封信来自潮汕，写信的人是一个当年在土改试点中分到地的佃农的女儿。信里说，她现在在县城教小学，班上有四十三个学生。信的最后一句是：“宋主席，我识字了。”\n\n宋庆龄把这封信放在办公桌最上面的抽屉里。抽屉里还有很多信。她没有全部回复——太多了，回不过来。但每一封她都看了。\n\n“革命不是改朝换代。革命是让最穷的人也能抬起头来。我这一生没有做完这件事。但我开了个头。后来的人，会把这件事做完。”\n\n在新三民主义的领导下，从白山黑水到金边南洋，从朝鲜半岛到恒河之畔，三民主义的“民族自决”灯塔照亮了每一个被压迫的角落，黄浦江畔的上海合作组织取代了旧时代的殖民金融网，成为了欧亚大陆工农与新兴独立国家相互扶持、共同繁荣的钢铁纽带；新一代的东方少年们挺直了脊梁，不再是任何人的殖民奴仆，而是这片大陆真正的主人。\n\n“革命尚未成功，同志仍须努力”的叮嘱犹在耳畔，而今日之神州已如您所愿——这是一个人民当家作主的社会主义新中国，这是一个屹立于东方、光照寰宇的§P大同新世界§!！"
  ROC_end_tip_lower_1: "感谢您对钢铁萌心与广州国民政府内容的喜爱与支持！"
  ROC_end_close_button_1: "加速向更美好的世界！"
  ROC_end_close_button_TT_1: "§L在做实事的人手中，中国的复兴或许不是最快的，但一定是最稳的。§!"

  ROC_end_title_2: "至此，§R[ROC.Getname]§!的征途告一段落"
  ROC_end_tip_2: "当第一个五年计划的最后一炉钢水在武汉钢铁厂的高炉中奔涌而出时，§Y蒋巾帼§!站在炉前，火光映红了她的脸。戴安澜站在他身边，军帽的帽檐依旧磨损发白。西瓜的铁轨已经铺到了兰州，庄方宜的报表精确到了小数点后两位，陈芸的账本每一笔都对得上。毛润芝端着那只搪瓷茶缸，在农田水利委员会的会议上说，明年苏北的灌溉面积可以再扩大一些。邓子恢翻开土改总结报告，在最后一页写道：“土地回家了。”\n\n她们曾经在广府的茶楼里争吵，在川北的战壕里并肩，在南京的会议室里投票，在中山陵的台阶上沉默。她们走过了不同的路——有人从莫斯科归来，有人从井冈山走来，有人在苏北的田埂上学会了种改良稻，有人在西北的戈壁滩上一寸一寸铺着铁轨。她们曾经是敌人，曾经是同志，曾经在弹劾案的投票中互相对视，曾经在同一面红旗下举起右手。\n\n白日照耀着这片她们用一生去改变的土地。工厂的烟囱在远处吐着白烟，集体农庄的稻穗在秋风里翻着金浪，村小的黑板上写着新学的字。那些在战壕里、在窑洞里、在秘密电台旁、在田埂上、在车间里奋斗过的人，有的已经不在，有的还在工作。她们种下的种子，正在一代一代地生长。\n\n§R中华苏维埃之梦想§!，不是一个终点。它是一个起点。从今天起，每一个劳动者都能在自己的土地上抬起头来。从今天起，每一座高炉、每一条铁路、每一间村小、每一本账本，都属于人民。这不是神话，不是史诗，不是一个人的功绩。这是无数人用无数个日夜，一砖一瓦，一字一句，铸成的。革命的火焰永不熄灭——不是因为火焰本身，是因为每一个在火光中前行的人。她们举着火把走过漫长的黑夜，火光照亮了她们的脸，也照亮了她们身后的路。现在天亮了。火把还在。"
  ROC_end_tip_lower_2: "感谢您对钢铁萌心与广州国民政府内容的喜爱与支持！"
  ROC_end_close_button_2: "看万山红遍，层林尽染。"
  ROC_end_close_button_TT_2: "§L自革命先辈为蒙昧的中国带来了十月革命的曙光，已逾三十余载，中华苏维埃之梦想终得以实现。§!"

