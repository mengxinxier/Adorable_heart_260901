  KMT_pt: "§C中国国民党§!\n§L宋教仁的议会民主终于在中国扎下了根。宪法不是摆在档案室里的装饰品，而是每一个公民都能引用的权利保障书。选举如期举行，权力和平交接，反对党在议会里批评政府，政府在议会里回应批评。法院独立审判，报纸自由报道，公民在投票站前排起长队。民主仍然远非完美——它效率不高，争吵很多，妥协总是让所有人都不完全满意。但这个制度活下来了。它不需要完美，它只需要活着——活到下一代人习惯它的存在，活到没有人再问“革命之后谁来统治”，因为答案已经写在每一次排队投票的清晨里。§!\n政党意识形态：§C$Three_Principles_of_the_People_d$§!\n政党领导人：§Y$ROC_Song_Jiaoren_name$§!\n支持率：§Y[?support_of_KMT]%§!"

  CCP_TITLE: "§R共产党§!（[?support_of_CCP|0]）"
  CCP_pt: "§R中国共产党§!\n§L旧中国帝国的逝去并未带来新的曙光，取而代之的是军阀混战、列强宰割、经济凋敝和社会矛盾的极端尖锐化。国民党建立的南方政府虽高举民族主义和共和旗帜，但其改革的不彻底性和对底层民众的忽视，让一部分革命者感到失望。因而有一批深受马克思主义和共产主义运动影响的左翼知识分子、城市工人运动领袖和部分对国民党感到幻灭的左派成员联合起来组建了中国共产党。他们坚信必须通过一场彻底的无产阶级革命，才能最终扫除封建主义、帝国主义和官僚资本主义这三座大山，建立一个真正平等、公正的新中国。§!\n政党意识形态：§R$Maoist_subideology$§!\n政党领导人：§Y$PRC_lidesheng$§!\n支持率：§Y[?support_of_CCP]%§!"

  PWDP_TITLE: "§P农工民主党§!（[?support_of_PWDP|0]）"
  PWDP_pt: "§P农工民主党§!\n§L农工民主党的主要成员主要来自自耕农、产业工人、进步学生等社会基层群体，其前身为旧神洲帝国的一些半合法农会、工会组织，在中国帝国宣布改革后因其贴近底层群众的政治主张迅速壮大。相比起共产党，农工民主党人更加温和，主张在遵循民主宪政的原则下向社会主义理想推进。虽然政治主张更加温和，但是农工民主党仍然摆脱不了左翼党派内部派系林立的问题。只不过相对来说，路线斗争的激烈程度更低。§!\n政党意识形态：§C$Three_Principles_of_the_People_d$§!\n政党领导人：§Y$ROC_Song_Jiaoren_name$§!\n支持率：§Y[?support_of_PWDP]%§!"

  ZhiGong_TITLE: "§S致公党§!（[?support_of_ZhiGong|0]）"
  ZhiGong_pt: "§S致公党§!\n§L“强省弱央，因地制宜”。致公党人的政治光谱难以简单地用左右划分，他们主张一种更具地域性和实用性的政策，即把中央权力更多地下发到地方。他们相信，每个省份都有其独特的优势和问题，比起中央统一调配，由省级单位自决自裁更具优势，也更加高效。这样的政治主张让他们吸引到了不少地方官员和企业家的支持。§!\n政党意识形态：§C$Three_Principles_of_the_People_d$§!\n政党领导人：§Y$ROC_Song_Jiaoren_name$§!\n支持率：§Y[?support_of_ZhiGong]%§!"

  CLU_TITLE: "§O公民自由联盟§!（[?support_of_CLU|0]）"
  CLU_pt: "§O公民自由联盟§!\n§L公民自由联盟的成员认为，中国想要走向现代化，来自自由世界的资本和民主思想必不可少，但保留中国本身的文化传承同样重要。比起所谓的民主灯塔，公民自由联盟的成员更多将中国和民族的伟大复兴视为己任，致力于将中国打造成一个真正的现代化国家。§!\n政党意识形态：§C$Three_Principles_of_the_People_d$§!\n政党领导人：§Y$ROC_Song_Jiaoren_name$§!\n支持率：§Y[?support_of_CLU]%§!"

  Youth_TITLE: "§0青年党§!（[?support_of_Youth|0]）"
  Youth_pt: "§0青年党§!\n§L青年党人总是态度激进，他们认为革新是拯救中国和民族的唯一道路。他们主张民族主义和国家统制经济，希望建立高度集权的国家控制，强调进步和民族自豪感。对于外国文化和意识形态上的入侵，青年党人总是持有反对态度，他们梦想着中国摆脱一切束缚，实现民族、文化、政治、经济、军事等各方面的完全独立和强大，建立独属于中国的民族神话。§!\n政党意识形态：§C$Three_Principles_of_the_People_d$§!\n政党领导人：§Y$ROC_Song_Jiaoren_name$§!\n支持率：§Y[?support_of_Youth]%§!"


#设定
  ROC_his_page_01_title: "辛亥革命"
  ROC_Country_History_Page_01: "到1905年孙中山已经在数个国家的留学生中建立了革命团体，在此期间也与国内的革命团体和革命志士建立了联系。8月，孙中山与黄兴等人，以兴中会、华兴会等革命团体为基础，在远洋珊瑚宫创建全国性的资产阶级革命党中国同盟会，孙中山被推举为总理，她所提出的“铲除帝制，恢复民权，创立民国，平均地权”的革命宗旨被采纳为同盟会纲领。在同盟会机关报《民报》发刊词中，孙中山首次提出民族、民权、民生三大主义。同盟会的成立，有力地促进了全国革命运动的发展。孙中山派人到国内外各地发展组织、宣传革命。她自己也在1905至1906年间赴东南亚各地向华侨宣传和募集革命经费，在一些地方创立同盟会的支部。她广泛传播资产阶级民主共和思想，使更多的人投身于反帝革命。孙中山领导的对改良派的批判，为辛亥革命的爆发作了有力的思想准备。从1906至1911年，同盟会在华南各地组织了多次武装起义。孙中山为起义制定战略方针，同时在海外奔走筹募经费。每一次起义虽然失败，但革命的火种已遍地埋下，只待一阵狂风。\n\n那阵风，在1911年到来了。\n\n1911年，神州帝国为筹集对外赔款，悍然下达铁路国有化命令。所有人都清楚，这些由国人承建的铁路一旦被收回中央，必然会作为赔款的一部分转售海外。怒火从四川烧起，保路运动迅速席卷整个南方。\n\n对帝国政策的强烈抵制，最终在当年4月演变为大规模的武装起义。这场被后世称为辛亥革命的南方大叛乱，波及两广、两江、四川乃至云贵地区。帝国在南方的统治如沙塔溃散。\n\n然而，神州帝国终究不是奄奄一息的清廷。蒋世渊建立的这个汉人王朝，虽然内政腐朽、外患深重，却仍有相当的家底。至1912年3月，帝国调集重兵，勉强镇压了这场革命。革命军被迫退守广东一省，帝国在长江以南重建了脆弱的统治秩序。\n\n革命虽然受挫，但帝国在南方的行政体系已基本崩溃。北京朝廷不得不承认现实：将南方各省分封给南方军各主要将领，寄望于这些军阀既能缓解朝廷的行政压力，又能彻底剿灭盘踞广东的革命党人。\n\n革命的火种没有熄灭。它只是被暂时逼到了南海之滨。\n\n1912年，宋娇仁在广州改组同盟会为中国国民党，孙中山牵头组建了广州国民政府，将革命力量与军队聚集于广东一省之地。这个狭小的革命根据地，将在未来数十年间成为整个中国革命的灯塔。\n\n"
  ROC_his_page_02_title: "北伐战争"
  ROC_Country_History_Page_02: "中国共产党于1923年6月12日至20日在广州召开第三次全国代表大会。大会正确地估计了孙中山的革命立场和国民党进行改组的可能性，决定共产党员以个人身份加入国民党，以实现国共合作。明确规定共产党员加入国民党时，党必须在政治上、思想上、组织上保持自己的独立性。\n\n1924年1月20日至30日，中国国民党第一次全国代表大会在广东召开。大会通过了新的党章，改组了国民党组织，确认了共产党员以个人身份加入国民党的原则，选举了有共产党员参加的新一届中国国民党中央领导机构，重新解释了三民主义，形成了“联俄、联共、扶助农工”等重大政策，实现了第一次国共合作，标志着第一次国共合作正式形成。\n\n国共合作建立后，孙中山立即着手筹建革命军校。1924年5月5日，陆军军官学校在广州黄埔长洲岛正式开学。这便是日后名震天下的黄埔军校。蒋介石被任命为校长，周恩莱担任政治部主任。\n\n黄埔军校的建立，标志着国民党从此有了一支完全听命于党的革命武装。军校以政治教育为核心，要求每一个学员不仅会打仗，更要理解“为什么而战”。苏联提供了武器、经费和军事顾问，中国共产党派遣了大批优秀青年入校学习。短短数年间，黄埔系便发展为一支精锐武装，统一了广东全省，扫清了根据地内的反对势力。\n\n然而，1925年孙中山的病逝，为革命事业投下了第一道阴影。这位革命先驱至死未能看到全国统一的那一天。她留下的权力真空，将由下一代人来填补——或者说，来争夺。\n\n孙中山逝世后，汪兆铭成为国民政府名义上的领袖。但真正的权力并不在会议桌上——它握在军人的手里。蒋介石，这位黄埔军校校长，逐渐成为革命军中不可替代的核心人物。\n\n1926年，第一次国共合作实现后，经过两年多的斗争，广东革命政权得到统一和巩固，全国工农革命运动空前高涨，为北伐战争奠定了政治、经济、军事和群众基础。在全国人民迫切要求和中国共产党的影响与推动下，广东革命政府决定出师北伐。\n\n9月，革命军势如破竹，将帝国在南方本就薄弱的统治进一步摧毁，很快占领了长江以南的半壁江山。\n\n但北京朝廷并非毫无还手之力。当革命军的兵锋逼近中原腹地时，朝廷急调袁克定的北方军南下平叛。这支在东北经历过血火考验的精锐之师，远非此前北伐军所遭遇的地方杂牌部队可比。\n\n1927年，战况急转直下，北伐革命军在精锐的北方军的攻势下节节败退。4月12日，蒋介石率北伐军精锐与袁克定的北方军精锐大战于郑州郊外，战斗惨烈到何种程度，后来者只能从幸存者的片言只语中窥见一二。但所有人都记得那一天的结局——\n\n袁克定炸开了花园口大堤。洪水咆哮着席卷战场。在滔滔黄河水的协助下，北伐军主力被全歼于郑州郊外。\n\n蒋介石战死。\n\n这位将革命军从广东带到中原的统帅，在洪水中永远闭上了眼睛。据说她临死前仍握着佩枪，面朝北方——那是北京的方向，她至死未能抵达的地方。\n\n蒋介石之死是一记重锤，砸碎了北伐军的脊梁。然而对北京朝廷而言，这场胜利同样令人不安。袁克定展现出的决断力与狠辣手段——炸开黄河大堤、以数十万军民性命为代价换取胜利——让朝廷不寒而栗。一个可以毫不犹豫牺牲数十万人的将领，还有什么是不敢做的？\n\n朝廷以明升暗降的方式将袁克定调离了南方战场。但这一举措只能延缓袁氏势力的膨胀，无法阻止一个事实的形成：经此一役，帝国最精锐的武装力量已牢牢掌握在袁克定手中，她不再是朝廷的臣子，而是以北方军为后盾的无冕之王。\n\n到1928年，革命军已无力再战。残部重新退回广东一省，北伐宣告失败。\n\n"
  ROC_his_page_03_title: "广府风云"
  ROC_Country_History_Page_03: "1927年4月，蒋介石战死的消息传到广州时，绝大多数人还在震惊中未能作出反应。但有一个人已经开始工作了。\n\n宋庆龄。\n\n孙中山的遗孀，先总理遗志最正统的继承者。她在北伐军节节推进的捷报声中，敏锐地察觉到了潜在的危机：革命军推进得太快，根基不稳；蒋介石的作战风格过于冒险，一旦遭遇强敌，极可能全军覆没。在所有人都沉浸在胜利狂欢中时，宋庆龄已悄然在广州着手组织预备工作——整理党务、巩固后方、联络各派。\n\n这一举动受到了时任国民政府名义领袖汪兆铭的强烈谴责。此时汪兆铭坐镇武汉，以革命正统自居，她指责宋庆龄“动摇军心”、“不信任前线将士”。一封封电报从武汉飞来，措辞严厉。\n\n宋庆龄没有反驳。她只是继续工作。\n\n1928年，当北伐失败的残兵败将退回广东时，所有人才意识到宋庆龄的先见之明。广州虽然没有在战争中沦陷，但革命政府已摇摇欲坠。更关键的是——汪兆铭也不得不从武汉撤回广州。而当她回来时，发现自己的政治威望已在北伐失败的灰烬中荡然无存。一年前对宋庆龄的严厉指责，如今成为他政治生涯中最大的笑柄。\n\n1928年秋，广州国民政府内部进行了自成立以来最重要的一次权力重组。此前在广东坚持组织工作的宋庆龄被推举为国民政府主席，而负责实际行政事务的宋娇仁则被推举为行政院院长。\n\n汪兆铭保住了部分外交事务的主导权，但其在党内的地位已大幅下滑。此后数年间，她逐渐转向与樱花国方面秘密接触，形成了自己的独立派系。\n\n到1936年，广府转眼已经休整了8年。八年前的那场惨败，让这个革命政权失去了两位最重要的领袖——孙中山和蒋介石。她们的死亡给整个国民政府内部带来的巨变，至今仍在持续发酵。如今的广府，已不再是北伐前夕那个众志成城的革命大本营，而是一个各派势力暗流涌动的复杂棋盘。\n\n先总理遗孀的宋庆龄与苏联留学归来的蒋介石之女蒋巾帼领导着£GFX_RCKMT_text_icon §P中国国民党革命委员会§!（§P民革§!），这是当前国民政府中最左翼的力量，带有浓重的社会主义色彩。派系领袖宋庆龄担任着广州国民政府的主席，是广府与整个国民党的名义领袖——她的真正权力，取决于其他各派愿意服从的程度。\n\n国民党党母宋娇仁领导着£GFX_Constitutionalists_text_icon §C中国国民党宪政同志会§!（§3民宪会§!），该派系致力于建立一套议会与内阁制的民国，其领袖宋娇仁担任着广府的行政权力最大的行政院院长，掌握着政府日常运转的实权。\n\n汪兆铭也没有就此沉寂，其领导着£GFX_RCAK_text_icon §O中国国民党改组同志会§!（§O改组派§!），是广府中一股不可忽视的力量，广府与外国的外交事务几乎由汪兆铭把持，，而他与樱花国方面的秘密联系，始终是悬在广府头上的一把利剑。\n\n掌握着中国国民党中央执行委员会调查统计局（中统）的陈晖洁与陈千语姐妹则领导着£GFX_CC_text_icon §Y中国国民党中央俱乐部§!（§YCC系§!）。她们掌控着党务调查大权，其组织网络渗透于各派内部，是广府最沉默也最令人畏惧的力量。\n\n而曾经的蒋介石门徒们，以胡宗南为中心组建了£GFX_Whampoa_text_icon §g中国国民党黄埔中正社§!（§g中正社§!），其掌握着广府相当大的军权，而其下属部门£GFX_CNRS_text_icon §F中国国民党三民主义力行社§!（§F蓝衣社§!）的领袖识之律者也是一个不可忽视的人物。\n\n三军总司令由何应晴担任，其不隶属于任何派系，是单纯的革命军人。\n\n1936年的广府，经济在八年休整中逐渐繁荣，军队在整编后恢复了元气。一切都预示着二次北伐终将到来。\n\n然而，愈演愈烈的派系内斗是否会在将来为民国埋下隐患？这个问题，只有未来才能回答。\n\n"

  ROC_route_guide_desc: "§C国民政府§!路线指南\n\n-1936年的广府主要派系分为六派：£GFX_RCKMT_text_icon §P中国国民党革命委员会§!（§P民革§!）、£GFX_Constitutionalists_text_icon §C中国国民党宪政同志会§!（§3民宪会§!）、£GFX_CC_text_icon §Y中国国民党中央俱乐部§!（§YCC系§!）、£GFX_Whampoa_text_icon §g中国国民党黄埔中正社§!（§g中正社§!）、£GFX_CNRS_text_icon §F中国国民党三民主义力行社§!（§F蓝衣社§!）与£GFX_RCAK_text_icon §O中国国民党改组同志会§!（§O改组派§!），如果我们想要游玩某派系的路线，则需要在§Y定鼎南京§!时，让其§R总影响力§!最高。\n-开局的£GFX_CNRS_text_icon §F蓝衣社§!为£GFX_Whampoa_text_icon §g中正社§!的附属势力，附属势力的影响力将会计入其宗主派系的§R总影响力§!中。\n-开局后£GFX_RCAK_text_icon §O改组派§!很快会离开广府，如果想要游玩£GFX_RCAK_text_icon §O改组派§!路线请选择@GXC§S广西§!进入游戏。\n\n一、£GFX_RCKMT_text_icon §P民革§!-§Y宋庆龄§!（§P三民主义§!）\n1.在§Y定鼎南京§!时，进入£GFX_RCKMT_text_icon §P民革§!路线。\n2.在一段事件链后，会解锁§Y宋蒋之争§!，在§Y宋蒋之争§!中，让§P宋庆龄§!的政治筹码大于§R蒋巾帼§!的政治筹码。\n\n二、£GFX_RCKMT_text_icon §P民革§!-§Y蒋巾帼§!（§R列宁主义§!）\n1.在事件“§Y识之律者的谏言§!”中，选择选项“§R我不是我母亲§!”\n2.在§Y定鼎南京§!时，进入£GFX_RCKMT_text_icon §P民革§!路线。\n3.在一段事件链后，会解锁§Y宋蒋之争§!，在§Y宋蒋之争§!中，让§R蒋巾帼§!的政治筹码大于§P宋庆龄§!的政治筹码。\n\n三、£GFX_RCKMT_text_icon §P民革§!-§Y蒋巾帼§!（§g三民主义§!-§g蒋介石主义§!）\n1.在事件“§Y识之律者的谏言§!”中，选择选项“§g我需要这把剑§!”\n2.在§Y定鼎南京§!时，进入£GFX_RCKMT_text_icon §P民革§!路线。\n3.在一段事件链后，会解锁§Y宋蒋之争§!，在§Y宋蒋之争§!中，让§R蒋巾帼§!的政治筹码大于§P宋庆龄§!的政治筹码。\n\n四、£GFX_Constitutionalists_text_icon §3民宪会§!-§Y宋娇仁§!（§C三民主义§!）\n1.在§Y定鼎南京§!时，进入£GFX_Constitutionalists_text_icon §3民宪会§!路线。\n2.在完成相关国策后，根据游戏进程的不同，会解锁不同的选举子路线。\n\n五、£GFX_CC_text_icon §YCC系§!-§Y陈晖洁§!（§g三民主义§!-§g绝对君主制§!）\n1.在§Y定鼎南京§!时，进入£GFX_CC_text_icon §YCC系§!路线。\n\n六、£GFX_Whampoa_text_icon §g中正社§!-§Y胡宗南§!（§g三民主义§!）\n1.在§Y定鼎南京§!时，进入£GFX_Constitutionalists_text_icon §3民宪会§!路线。\n2.子路线还没写完\n\n\n\n"

