  ROC_focus_provincial_plan: "省建计划"
  ROC_focus_provincial_plan_desc: "欲图逐鹿中原，必先利国之器。党国伴随着惨败一同失去的还有一个原本安定而强大的广州根据地。如今境内可谓一片愁云惨淡，但机遇依旧存在着：民族资本家们暂时仍然愿意相信革命政府，乡村复兴运动的成果正在显现，外交部门也已设法重新激起海外列强对革命事业的兴趣——我们并非从零开始。"
  ROC_focus_build_industry: "建设工业"
  ROC_focus_build_industry_desc: "要想重新建设起一支能与帝国军队抗衡的革命武装，光靠外援与革命热情是远远不够的。"
  ROC_focus_establish_gr: "成立广铁"
  ROC_focus_establish_gr_desc: ""
  ROC_focus_connect_liangguang: "贯通两广"
  ROC_focus_connect_liangguang_desc: ""
  ROC_focus_exploit_inland: "发掘内陆资源"
  ROC_focus_exploit_inland_desc: ""
  ROC_focus_boost_national_capital: "鼓励民族资本"
  ROC_focus_boost_national_capital_desc: "国民政府对于基层经济掌控的衰弱并不完全是坏事——在这十年间，志于救国的实业家团体致力于刺激广东原以趋于凋敝的经济活力。显然，这个时候给他们泼冷水并不是明智之举。"
  ROC_focus_boost_cement: "促进水泥产业"
  ROC_focus_boost_cement_desc: "政府计划加强在广州城内正蓬勃发展的水泥产业链，以提升我国在防御工事建设上的能力。"
  ROC_focus_mega_power_plant: "建设大型发电厂"
  ROC_focus_mega_power_plant_desc: "任凭民间工厂自行解决短缺的电力问题自然不切实际，政府应当考虑建设一套更加方便高效的煤电体系。"
  ROC_focus_develop_chemical: "发展化工行业"
  ROC_focus_develop_chemical_desc: "幸运的是，在旧帝国时期留洋海外的化学人才绝大多数都心向民国，这意味着我们在化工建设甚至军备方面拥有着比帝国更加雄厚的人才资源——当然，这也需要我们的妥善利用。"
  ROC_focus_boost_textile: "促进纺织工业"
  ROC_focus_boost_textile_desc: ""
  ROC_focus_prepare_peifah_build: "筹备北伐建设"
  ROC_focus_prepare_peifah_build_desc: "如今京师凋敝，天降乱离，。此乃二次北伐之良机。尽管与帝国的争夺争分夺秒，但我们也必须做好与反动朝廷爆发全面战争的准备。至少不能再像以前一样，只带着一句口号和一杆步枪登上战场。"
  ROC_focus_expand_kwangtung_arsenal: "扩建广东兵工厂"
  ROC_focus_expand_kwangtung_arsenal_desc: "为了革命大局，一直以高效著称的广东兵工厂为革命军提供着大量可堪一用的武器装备。但我们仍然需要大量足以列装部队的制式军火。必须进一步扩大这条军事生产线的规模。"
  ROC_focus_hire_foreign_experts: "聘请外国专家"
  ROC_focus_hire_foreign_experts_desc: "相比于苟延残喘而人心思变的帝国朝廷，海外诸多民主国家更加青睐于我国。它们的军事技术专家也对于指导我国军备的研究工作兴致勃勃。当然，她们的意见并不统一，而我们无法二者兼得。"
  ROC_focus_import_powder_lines: "引进火药产线"
  ROC_focus_import_powder_lines_desc: "虽然相比于过去我国只能生产黑火药的窘境而言现在的情况已经大为改善，但光有无烟火药与现代步枪也不足以让我们赢得胜利——我们需要一些——打起人来更疼一点的家伙。"
  ROC_focus_build_south_sea_naval: "建设南海海军工业"
  ROC_focus_build_south_sea_naval_desc: ""
  ROC_focus_expand_naval_base: "扩建海军基地"
  ROC_focus_expand_naval_base_desc: ""
  ROC_focus_spread_basic_education: "推广基础教育"
  ROC_focus_spread_basic_education_desc: "二十年代晏阳初所主导的社会教育实验尽管并未被帝国朝廷所重视，但却为我们指明了教育事业的基本方向——扫清文盲，提升绝大多数农民的基本素质才是组织国民教育，谋求乡村乃至国家经济复兴的关键。"
  ROC_focus_establish_sysu: "建立中山大学"
  ROC_focus_establish_sysu_desc: ""
  ROC_focus_land_policy: "土地"
  ROC_focus_land_policy_desc: "潮汕佃租冲突的余波未尽。除非党政府真正开始直面十余年来一直被搁置的土地问题，否则粤省广大农民与地主甚至与革命政权的冲突只会愈演愈烈。兹事体大，只有确保其中一方的意见能够无视其反对者的声音，我们才能确保土地改革不至于迁延推诿间胎死腹中。"
  ROC_focus_25_rent_reduction: "二五减租"
  ROC_focus_25_rent_reduction_desc: "革委与宪政派都主张以社会主义方式进行土地改革。同时力求继续维持革命党、农民、进步地主之间的团结关系。其中必然伴随妥协。但以妥协求团结，维护革命大局未尝不可。"
  ROC_focus_form_pa: "组建农会"
  ROC_focus_form_pa_desc: "出于帮助当地农民进一步实施与推广减租减息，并协调乡村建设与治理工作的需要，我们应当效仿共产主义者的方式，尝试通过鼓励或直接介入的方式在乡村建立起广泛的农会网络。"
  ROC_focus_build_agri_coops: "建设农业合作社"
  ROC_focus_build_agri_coops_desc: "乡村复兴不能只靠农民的斗争来进行，唯有求富才能彻底扭转乡村凋敝的窘境。"
  ROC_focus_found_peasant_school: "创办农民学校"
  ROC_focus_found_peasant_school_desc: "社会主义者主张通过农村办学的方式推进农民阶级的教育工作。这需要成本——但就长期来说，这对乡村的发展大有裨益。"
  ROC_focus_cadres_to_countryside: "干部下乡"
  ROC_focus_cadres_to_countryside_desc: "定县实验期间，神州大量高级知识分子在运动号召下迁入乡村，即“博士下乡”，我们也应当进行效仿，号召党国的高级知识人才放下成见，前往乡村支援农村的教育事业。"
  ROC_focus_build_irrigation: "建设水利"
  ROC_focus_build_irrigation_desc: "利用珠江河网的水利，我们可以尝试进一步促进乡村地区的电力供应与灌溉系统建设。"
  ROC_focus_import_tractors: "引进拖拉机"
  ROC_focus_import_tractors_desc: "是的，先生们！造拖拉机很难，但是只要造得出来，我们也就能弄出和这玩意类似的东西了——比如坦克！"
  ROC_focus_boost_cooperation: "促进合作"
  ROC_focus_boost_cooperation_desc: "一直以来，蒋公及其麾下的国民革命军都以其背后的地方士绅和家族财团为重要后盾，对于时刻将蒋公教诲放在嘴边的“蒋介石主义”者而言，她们的态度就更是如此了。土地改革只能停留在改革的层面——重点是如何与在安抚农民的前提下维护与既得利益者的合作关系。"
  ROC_focus_organize_gentry: "组织乡贤会"
  ROC_focus_organize_gentry_desc: "改革不能冒险触动扎根于这片土地已逾百年的宗族治理体系。但我们仍能从体系中争取到支持革命的进步人士。通过乡贤会，我们将让这些心向革命的进步乡绅主导农民与地主两个阶级的协调工作，使二者间的冲突不至于妨碍我们的革命事业。"
  ROC_focus_free_rent: "地租自拟"
  ROC_focus_free_rent_desc: "土地改革的关键便是地租问题，这在潮汕冲突中已然显露无遗。我们必须确保地主与农民不会再因为所谓的佃权问题大打出手。通过鼓励双方以和平方式自由协商决定地租金额与调整机制。革命政府能够以最小的代价弥合农民与地主在租佃关系上的矛盾，给叫嚣着阶级矛盾不可调和的社会主义论者当头一棒。"
  ROC_focus_spread_cash_crops: "推广经济作物"
  ROC_focus_spread_cash_crops_desc: "农民对革命政府的敌意其实很大程度上来自于她们自身的贫穷。如果能够改善农民的经济情况。就能避免未来可能会出现的对土改是否过于保守的质疑。我们将鼓励地主与自耕农将目光放在更具经济价值的商业作物上——毕竟，有黄金自然能买到粮食，但粮食有时候并不一定能换成黄金。"
  ROC_focus_subsidize_rubber: "补贴橡胶种植"
  ROC_focus_subsidize_rubber_desc: "来自东南亚的西方殖民地正依靠供不应求的橡胶贸易获取暴力，而对于商贸条件更加优越的珠江沿岸而言，有什么理由能阻止我们在这上面去分一杯羹呢？"
  ROC_focus_build_rev_radio: "建设革命电台"
  ROC_focus_build_rev_radio_desc: ""
  ROC_focus_build_public_broadcast: "建设公共广播站"
  ROC_focus_build_public_broadcast_desc: ""
  ROC_focus_reopen_pearl_trade: "重开珠江贸易"
  ROC_focus_reopen_pearl_trade_desc: "在外交部的努力斡旋下，同样密切关注着神州局势的各路列强此刻都将目光放在了革命仍蓬勃发展的珠三角地区。得益于珠江流域优越的航运条件，我们有能力将来自海上的各式物资运至前线的各革命军。是时候让广州再一次成为各路海外援助的中心了。前提是她们仍然保持着兴趣...还有对革命前景的期待。"
  ROC_focus_soviet_trade: "与苏联贸易"
  ROC_focus_soviet_trade_desc: "相比于在内陆鞭长莫及、苟延残喘的赤党根据地，苏联似乎更有兴趣支援我们的革命事业，诚然，共产党武装的存在和壮大会动摇其对我们的兴趣，但就目前而言俄国人依旧能成为国民革命的重要合作者。"
  ROC_focus_comintern_aid: "接收共产国际援助"
  ROC_focus_comintern_aid_desc: "战争已火烧眉毛，一支满载军火的来自共产国际的军火船队已经从海参崴启程，她们将送来极其宝贵的，与帝国抗衡所急需的武器装备。"
  ROC_focus_buy_soviet_arms: "购买苏联军火"
  ROC_focus_buy_soviet_arms_desc: "苏维埃联盟仍然存留着大量内战时期的军火，很显然她们不会再考虑将这些老旧装备重新列装，我们可以进行进一步的交涉，请求购买这批宝贵的武器与重型设备。"
  ROC_focus_hire_soviet_advisors: "聘请苏联教官"
  ROC_focus_hire_soviet_advisors_desc: "早在一次北伐时期，苏联便派遣过大量军事顾问协助我党在黄埔军校编练革命新军，但黄埔系最终凸显的反动本质与国民革命军的失败恐怕会使得俄方对重建这一关系心生疑虑。无论如何，我们必须努力促进与俄国人的关系——或者干脆加点钱——毕竟没什么事情是加钱解决不了的。有就多加点。"
  ROC_focus_form_soviet_division: "组建“苏联师”"
  ROC_focus_form_soviet_division_desc: "相比于志愿军而言，苏联更加青睐于在本地组建一支忠于革命的苏式“常胜军”——两支苏联教导师团的高级指挥人员均由苏联军事顾问担任，但配备着新式苏制武器的战斗人员仍然由国民革命军的骨干组成。"
  ROC_focus_oceanic_trade: "与远洋国贸易"
  ROC_focus_oceanic_trade_desc: "尽管远隔重洋，但加利福尼亚的远洋共和国政权与我们一衣带水，并且同样支持华夏的共和事业。我们可以期待她们对革命的支援——只是，她们的传统决定了其投机的本质。我们必须和她们一样懂得斤斤计较。"
  ROC_focus_diaspora_donations: "华侨捐款"
  ROC_focus_diaspora_donations_desc: "海外的华侨几乎都是对帝国统治深恶痛觉，热切希望帝制被武装推翻的共和支持者。只要我们能够证明本党是驱逐帝党，重开共和最大的希望所在，她们自然会为我们的革命事业慷慨解囊。"
  ROC_focus_oceanic_flying_tigers: "远洋飞虎队"
  ROC_focus_oceanic_flying_tigers_desc: "尽管困于她们自身的地缘军事威胁，难以为我国提供实际的军事援助，但她们承诺会为我们的事业提供一支精锐的航空志愿部队。"
  ROC_focus_import_oceanic_food: "引进远洋副食品"
  ROC_focus_import_oceanic_food_desc: "相比于实际的政治性援助，远洋似乎更加有意于发展两国之间的商贸往来。当然，民以食为天，如果我们能够说服对方将她们优质价廉的宝贵农副产品销售给我国，这对革命也未尝不是一件好事。毕竟蓬勃发展的商业可以让双方都能从中获益。"
  ROC_focus_grail_trade: "与圣杯国贸易"
  ROC_focus_grail_trade_desc: "虽然长久以来圣杯王国都以神州帝国作为其传统盟友，但如今它们更对广州革命政府的崛起深感兴趣，当然，更关键的原因是——她们似乎不再认为帝国能够代替她们在东北乃至整个东亚与樱花相对抗。唯一的问题在于，革命政府真的会甘心成为她们在亚洲的代理人吗？"
  ROC_focus_buy_grail_ships: "购置舰船"
  ROC_focus_buy_grail_ships_desc: "广州政府自然不具备建造一支独立海军的能力，但海上力量恐怕亦会成为日后华南大战的重要一环。我们可以考虑从圣杯王国处购置部分濒临退役的老旧船只作为革命政府的岸防力量。"
  ROC_focus_the_hump_route: "驼峰航线"
  ROC_focus_the_hump_route_desc: "除开容易被切断的海上航线以外，圣杯外交代表向我国透露了一个听起来甚是疯狂的计划——在革命政府与艾恩葛朗特殖民地间开辟一条跨越喜马拉雅山脉并且绕开翁法罗斯的空中航道。该计划听起来实施困难并且成本极高，这会是为了支援我们与神州帝国的战争而筹划的吗？还是说她们有着更长远的打算..."
  ROC_focus_concession_talks: "租界谈判"
  ROC_focus_concession_talks_desc: "很显然，要想实现与圣杯王国的全面合作，有一点是革命政府绝不能退让的——圣杯王国在神州大陆上存在的租界必须交还我方，具体细节可以另加协商。只有一点无从妥协——我们不能将侵占着祖国领土的外国侵略者视作盟友。"
  ROC_focus_buy_grail_arms: "购买圣杯军火"
  ROC_focus_buy_grail_arms_desc: "圣杯王国仍然存留着大量伟大战争时期的军火，很显然她们不会再考虑将这些老旧装备重新列装，我们可以进行进一步的交涉，请求购买这批宝贵的武器与重型设备"
