  # Navy focuses
  ROC_republic_of_china_navy: "中华民国海军"
  ROC_republic_of_china_navy_desc: "中央海军过去历经坎坷，资金匮乏与海防不稳致使舰船状况不佳。随着危机临近，我们必须把克服这些挑战提上日程。"
  ROC_foreign_acquisition: "海外收购"
  ROC_foreign_acquisition_desc: "虽然我们希望这只是暂时的挫折，但我们必须承认其他列强在海军技术发展方面远远领先我们。要实现海军现代化，必须首先找到一位技术先进的援助方。"
  ROC_develop_northern_naval_logistics: "发展北方海军后勤"
  ROC_develop_northern_naval_logistics_desc: "青岛是一个重要的战略港口城市，理应在我国海军军事化进程中发挥作用。"
  ROC_develop_southern_naval_logistics: "发展南方海军后勤"
  ROC_develop_southern_naval_logistics_desc: "我国南部海岸遍布殖民飞地，防御力量严重不足。若要与西方列强平等对话，势必要收复并开发这一关键区域。"
  ROC_concerted_push: "协同推进"
  ROC_concerted_push_desc: "中国人民一次又一次在逆境中展现了他们的适应能力。这次也不例外。我们的领导层已经宣布需要一支能够与大国抗衡的海军，而我们的经济将迎接这一挑战。"
  ROC_local_alloy_commission: "本地合金委员会"
  ROC_local_alloy_commission_desc: "我们的土地蕴藏着丰富的天然矿产资源，然而我们却未能充分利用这些资源进行工业开发。在此领域探索发展潜力，未来必将获得丰厚回报。"
  ROC_deny_the_enemy: "拒敌"
  ROC_deny_the_enemy_desc: "虽然我们在陆地上的优势无可匹敌，但对于重振衰弱的海军，我们所能期待的最好结果或许就是遏制敌方的行动。"
  ROC_dominate_the_enemy: "制敌"
  ROC_dominate_the_enemy_desc: "我们将不惜一切代价，达到与敌人抗衡的实力。"
  ROC_navy_spooks: "发展海军情报机构"
  ROC_navy_spooks_desc: "中国周边的海域是繁忙的贸易活动枢纽。有商人的地方就有流言，有流言的地方就有机遇……"
  ROC_promote_admiral: "晋升海军将领"
  ROC_promote_admiral_desc: "我们近期的海军建设最终将淘汰那些19世纪的老旧战舰。这恰好提供了将其改造为训练舰供官兵使用的契机——同时针对我国海军的战略方向制定一套优化的训练项目。"
  ROC_promote_admiral_tt: "如果采用了§Y$ROC_deny_the_enemy$§!，所有海军将领会获得§Y$green_water_expert$§!特质\n\n如果采用了§Y$ROC_dominate_the_enemy$§!，所有海军将领会获得§Y$blue_water_expert$§!特质"
  ROC_promote_admiral_dingwen_tt: "提拔§Y$ROC_jiang_dingwen_admiral$§!为海军将官"
  ROC_heavy_ship_research: "重型战舰研发"
  ROC_heavy_ship_research_desc: "自主生产战列舰对于抗衡至今仍在掠夺我国的地区和殖民强国至关重要。虽然我们的技术可能处于劣势，但我们的制造工艺和人民的坚定意志必将带来胜利。"
  ROC_strike_from_below: "水下打击"
  ROC_strike_from_below_desc: "德国已经证明一个受到海军强国威胁的国家可以依靠强大的水下舰队来保护自身利益。鉴于我们面临类似的情况，我们应该向西方汲取经验。"
  ROC_fund_the_naval_air_establishment: "资助海军航空系统建设"
  ROC_fund_the_naval_air_establishment_desc: "制空权和制海权结合所带来的巨大优势不容忽视。扩编我们的海军航空兵部队能降低跨军种通信失误的风险。"
  ROC_early_detections: "初期侦测"
  ROC_early_detections_desc: "我们的舰队虽然有战斗力，但规模一般，因此除了优化作战部署以最大限度地利用舰船外别无选择。情报与态势感知是实现这一目标的最佳途径。"
  ROC_defend_our_coasts: "保卫海岸"
  ROC_defend_our_coasts_desc: "只要敌人无法接近我们，他们就无法发动攻击。未来遭遇入侵时，布雷拒止将是最可行的防御手段。至于未来的成本，我们日后再作考量……"
  ROC_long_range: "远程作战"
  ROC_long_range_desc: "一支平衡良好的箭矢可以在战争开始前就结束它。更庞大、更嘈杂的引擎或许会让机组人员承担风险，但能将力量投射得更远，让我们在世界舞台上拥有更大的影响力。"
  ROC_battleship_focus: "重视战列舰"
  ROC_battleship_focus_desc: "当我们开始建造第一艘海上巨兽时，歌颂我们的国父是理所当然的。"
  ROC_coastal_defence: "海岸防御"
  ROC_coastal_defence_desc: "优化水下舰队的空间利用率意味着能建造更小更快的潜艇。不过我们不得不舍弃一些非必要设施，比如双层床……以及其他生活便利设备。"
  ROC_heavy_cruiser_focus: "重视重巡洋舰"
  ROC_heavy_cruiser_focus_desc: "我们的水面舰队虽承袭自清朝，近五十年来却始终恪尽职守。世界正在变化，但在操作近程装甲巡洋舰方面，放弃如此丰富的经验并不明智：我们的未来应当融入过去。"
  ROC_mobile_bases: "机动基地"
  ROC_mobile_bases_desc: "正如世界其他国家所证明的，天空代表着战争的未来。然而我们的远程打击能力受限于地理条件。仿效列强的做法，我们必须把精力集中在机动打击平台上。"
  ROC_the_seas_of_tomorrow: "明日之海"
  ROC_the_seas_of_tomorrow_desc: "我们梦想着中国在软实力与科技实力上引领世界的未来。多年来我们一直在追赶殖民列强和地区对手的庞大海军，但现在是我们亲自规划未来航向的时候了。"
  ROC_the_seas_of_tomorrow_tt: "一位专门研究先前所选领域的§Y科学家§!将可供使用。"
  ROC_long_range_screens: "长程屏卫"
  ROC_long_range_screens_desc: "随着我们着力超越国内冲突，以低成本远距离投送实质性军力的能力变得至关重要。"
  ROC_naval_separate_defense_plan: "海军分防计划"
  ROC_naval_separate_defense_plan_desc: "华甲提出的《海军分防计划》，定下了在未来30年内建造至少十二艘航空母舰的目标。若要保卫我国海疆，我们就应采纳此议，并尽快开始打造航母舰队！"
  # Air Focuses
  ROC_rocaf: "加强民国空军" # was Establish the ROCAF
  ROC_rocaf_desc: "为保障[ROOT.GetName]空域安全、展现国家力量，我们必须强化空军。通过投资先进学说与技术，将为打造一支能够应对任何对手的现代化空中力量奠定基础。"
  ROC_officialize_the_rocaf: "正式成立中华民国空军"
  ROC_officialize_the_rocaf_desc: "空军长期以来一直是个非正式的机构。随着我们取得的技术与战术发展，现在是时候将航空委员会改组为空军司令部，使中华民国空军成为独立于陆军与海军的正规军种。"
  ROC_bring_the_war_home: "将战火带回敌国本土"
  ROC_bring_the_war_home_desc: "敌人必须认识到其领土无处藏身。通过精准轰炸和心理战，我们将实施深度打击，摧毁敌军士气。"
  ROC_bring_the_war_home_tt: "解锁以下袭击：\n[GetHuangshenRaidTooltip]\n[GetTokyoImperialPalaceTooltip]\n[GetNationalDietTooltip]\n[GetHakkoIchiuTooltip]"
  ROC_open_afamf_plants: "航委第一飞机制造厂"
  ROC_open_afamf_plants_desc: "为了研发新的飞行器，例如朱家仁少将构想的研驱-0战斗机，我们必须建设能够支撑并生产轻型战斗机和俯冲轰炸机的设施。理想的选址是昆明，但只要能造出能在空中与敌军抗衡的飞机，任何地方都行。"
  ROC_open_afamf_plants_tt: "如果我们或我们的附属国控制了§Y[325.GetName]§!，我们会在那里获得一座军用工厂"
  ROC_projecting_power: "远程投射能力"
  ROC_projecting_power_desc: "通过将空中力量投射至前线之外，我们已做好随时抓住机遇发起打击的准备。空中力量的远程投射，已不再是单纯的野心，而是战略上的必然要求。"
  ROC_strike_at_what_is_weak: "避实击虚"
  ROC_strike_at_what_is_weak_desc: "我们不会正面迎敌。相反，我们的作战学说必须强调精准且持续地打击敌人最脆弱的环节。"
  ROC_a_wind_that_rises_in_the_daytime_lasts_long: "昼风久"
  ROC_a_wind_that_rises_in_the_daytime_lasts_long_desc: "白天的持续轰炸提供了稳定且有条理的空战方式。我们必须利用良好的视野和协调性，以实施有效打击。"
  ROC_but_a_night_breeze_soon_falls: "夜风止"
  ROC_but_a_night_breeze_soon_falls_desc: "夜间行动可能充满风险，但加强训练后我们的飞行员就能在夜幕掩护下将损失降至最低。敌人永远不会发现我们的到来.……"
  ROC_escort_efficiency: "护航效率"
  ROC_escort_efficiency_desc: "战斗机护航是我们轰炸机的重要护盾。加强协调和覆盖范围能确保更多飞机完好返航，为下一轮任务做好准备。"
  ROC_controlling_our_skies: "掌控天空"
  ROC_controlling_our_skies_desc: "在称霸海外之前，我们必须确保国内的空天主权。纪律严明的防空网络是维护国家安全的根本保障。"
  ROC_interception_detection: "拦截侦测"
  ROC_interception_detection_desc: "及时的侦测能让我们在敌人发动攻击前先发制人。我们将加强雷达与观测网络建设，获取这一决定性优势。"
  ROC_focus_on_positional_advantage: "重视方位优势"
  ROC_focus_on_positional_advantage_desc: "空战不仅关乎数量与速度，优势在于高度、角度与警觉性。我们必须教导飞行员利用好每一项优势。"
  ROC_effectivize_ground_crew_usage: "提高地勤效率"
  ROC_effectivize_ground_crew_usage_desc: "地面效率与空中表现同样重要。简化机组任务和后勤保障能让更多飞机保持飞行状态。"
  ROC_coordinate_with_the_army: "协同陆军"
  ROC_coordinate_with_the_army_desc: "胜利源于武装力量的统一。我们的空中与地面部队必须以同一目标执行统一行动。"
  ROC_an_appropriate_design: "合适的设计"
  ROC_an_appropriate_design_desc: "我们的飞机必须严格符合作战学说的要求。无论航程或耐久性，我们将致力于研发满足战场需求的设计方案。"
  ROC_an_appropriate_design_3_tt: "如果已完成§Y$ROC_projecting_power$§!：\n"
  ROC_an_appropriate_design_2_tt: "如果采取了§Y$ROC_controlling_our_skies$§!：\n"
  ROC_reorganise_the_central_armys_academy_aviation_corps: "重组学校航空队"
  ROC_reorganise_the_central_armys_academy_aviation_corps_desc: "训练必须随技术发展而进步。我们将改革航空兵团，培养适应未来战斗的现代化能干飞行员。"
  ROC_formalise_training_regime: "训练体系正式化"
  ROC_formalise_training_regime_desc: "持续且严格的训练制度是减少损失、提升表现的关键。标准化将从现在开始。"
  ROC_conserve_our_pilots: "珍惜飞行员生命"
  ROC_conserve_our_pilots_desc: "飞行员难以替代。通过降低风险、提高生存率，我们才能保留作战经验，维持部队战斗力。"
  ROC_camco_primacy: "中央飞机制造厂优先"
  ROC_camco_primacy_desc: "中央飞机制造厂是我们在航空发展方面最佳的国内伙伴。优先发展其能力将确保产能跟上我们的雄心。"
  ROC_SINAW_primacy: "中央飞机制造厂优先"
  ROC_SINAW_primacy_desc: "中意飞机制造厂能提供中央飞机制造厂无法实现的技术创新。投资其扩张能让我们更接近与外国强国的实力对等。"
  ROC_initiate_the_sky_projects: "启动天空计划"
