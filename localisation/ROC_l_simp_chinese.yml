  ROC_policy_card_name_93: "党员忠诚档案"
  ROC_policy_card_desc_93: "陈晖洁以中统为基础，建立了一套覆盖全体党员的秘密忠诚档案。档案中记录的不是每个人的政治观点，而是每个人的行为模式和社交网络。她称其为“党务科学化”。"
