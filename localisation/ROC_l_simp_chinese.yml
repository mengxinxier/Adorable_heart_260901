 #中国统一进程
  ROC_reunit_of_china_d_c: "中国统一进程"
  ROC_reunit_of_china_d_c_desc: "§L“革命尚未成功，同志仍须努力。”\n——孙逸仙§!\n\n北伐战争的惨痛受挫虽令国民党损失惨痛，被迫收缩于南粤一隅，但国民革命的火种从未熄灭。在敌人的封锁与嘲弄中，我们整顿党务、重组军队，在岭南的土地上默默积聚着摧毁旧世界的雷霆之力。\n\n随着经济危机的全面爆发，神州朝廷的虚弱与无能被彻底暴露无遗。面对地方军阀的肆意妄为与民不聊生的惨状，那个高高在上的腐朽政权除了坐以待毙外别无选择。旧秩序的崩溃已成定局，时代正呼唤着一场彻底洗涤这片土地的暴风雨！\n\n决胜的关头已经到来，我们将亲手撕碎旧体制的残骸，实现先总理未竟的宏图！\n\n同志们，行动起来！§R革命§!的§4中国§!万岁！"
  ROC_declare_CHINA_reunit: "宣告中国统一"
  ROC_declare_CHINA_reunit_tt: "§L解锁£GFX_adorable_heart_focus_var_icon §Y国策点数§!机制，允许我们加速§C根据地时期§!的国策§!"
