  Shanghai_Cooperation_Organization: "上海合作组织"
  Shanghai_Cooperation_Organization_dipo_Title: "§C上海合作组织§!"
  Shanghai_Cooperation_Organization_Title: "£Shanghai_Cooperation_Organization_text_icon §C上海合作组织§!"
  Shanghai_Cooperation_Organization_leader: "£Shanghai_Cooperation_Organization_text_icon §C上海合作组织§!领袖"
  Shanghai_Cooperation_Organization_TT: "[GET_Shanghai_Cooperation_Organization_modifier]\n\n[GET_Shanghai_Cooperation_Organization_leader_modifier]"
  Shanghai_Cooperation_Organization_dipl_TT: "§Y[From.GetNameDef]§!的经济同盟属于£Shanghai_Cooperation_Organization_text_icon §C上海合作组织§!\n\n[GET_Shanghai_Cooperation_Organization_modifier]\n\n[GET_Shanghai_Cooperation_Organization_leader_modifier]"
  Shanghai_Cooperation_Organization_desc: "[GET_Shanghai_Cooperation_Organization_desc]"
  Shanghai_Cooperation_Organization_desc_ROC: "§L“千百年来，欧亚大陆的繁荣曾因丝绸之路而紧密相连，却在近代被西方海权列强的分割包围所打断。如今，[ROC.Getname]已重塑东方大国的赫赫威严。上海，作为亚洲最庞大的工业与金融枢纽，承担起了引领大陆经济新秩序的历史重任。”§!"
  Shanghai_Cooperation_Organization_desc_PRC: "§L“千百年来，欧亚大陆的繁荣曾因丝绸之路而紧密相连，却在近代被西方海权列强的分割包围所打断。如今，[PRC.Getname]已重塑东方大国的赫赫威严。上海，作为亚洲最庞大的工业与金融枢纽，承担起了引领大陆经济新秩序的历史重任。”§!"
  Shanghai_Cooperation_Organization_focus_tt: "§L我们将解锁决议邀请其他国家加入£Shanghai_Cooperation_Organization_text_icon §C上海合作组织§!，成员国越多，£Shanghai_Cooperation_Organization_text_icon §C上海合作组织§!给与我们的修正越高。§!"
  ROC_invite_FROM_add_to_Shanghai_Cooperation_Organization: "§S邀请§Y[FROM.Getname]§!加入£Shanghai_Cooperation_Organization_text_icon §C上海合作组织§!§!"
  Shanghai_Cooperation_Organization_leader_modifier: "£Shanghai_Cooperation_Organization_text_icon §C上海合作组织§!现在的成员国数量为§L[?global.num_of_Shanghai_Cooperation_Organization]§!。\n£Shanghai_Cooperation_Organization_text_icon §C上海合作组织领导国§!产生的修正为：\n$MODIFIER_RESEARCH_SPEED_FACTOR$：[?global.Shanghai_Cooperation_Organization_leader_research_speed_factor|%+=]\n$MODIFIER_GLOBAL_BUILDING_SLOTS_FACTOR$：[?global.Shanghai_Cooperation_Organization_leader_global_building_slots_factor|%+=]\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$：[?global.Shanghai_Cooperation_Organization_leader_production_speed_buildings_factor|%+=]"

  ROC_invite_to_join_Plum_blossom_College_Alliance: "邀请[From.GetName]加入梅花高校联盟"
  Plum_blossom_College_Alliance: "梅花高校联盟"
  Plum_blossom_College_Alliance_desc: "帝国主义的殖民枷锁，曾试图从精神上阉割全亚洲的下一代。“梅花高校联盟”作为亚细亚民族解放同盟的核心文教机构，正式开启了面向整个亚太地区被压迫民族的启蒙运动。\n\n从南京的四牌楼校园到南洋与印度支那的复兴学校，梅花园的教育模式正在全面推广。我们不仅为孩子们提供安全的庇护与充足的食物，更在他们幼小的心灵中种下“民族自决”与“反帝自强”的种子。幼小的梅花绽放之处，殖民者的愚民奴化教育宣告终结！"
  Plum_blossom_College_Alliance_tt: "§L我们将解锁决议邀请其他国家加入§C梅花高校联盟§!§!"

