  ROC_PingMin_Revolution_theorist: "“平民革命”理论家"
  ROC_PingMin_Revolution_theorist_tt: "§L“因此，中国被§Y压迫剥削§!的§R革命群众§!为：工、农、手工业者、小商人及青年学生。其对抗的§Y仇敌§!为：帝国主义、封建军阀、地主、土豪绅士及与他们相结之高利资本家者。\n\n中国之经济组织，虽十分落后，还未曾达到完全工业革命的时期，但因其§Y特殊之政治境遇§!，最受压迫剥削之农工群众，成为革命的政治斗争之主要动力。少数的资本家，不与封建势力联盟反动，即寥落不足数。其必不能欺骗工农群众以收资本主义革命之渔利，盖可断言。\n\n而§4中国§!§R革命§!之结果，其政权主要的掌握在工农为中心的§P平民群众§!手上，其经济建设，必超越§Y资本主义之毒害§!而向§R社会主义§!前进。\n\n§4中国国民党§!§P革命委员会§!即本此使命在其伟大的领袖孙逸仙先生的精神领导底下，去团结领导被压迫剥削的革命群众，向一切反动仇敌进攻，得到最后的胜利——把§4三民主义§!的§R革命纲领§!§Y完全实现§!。”§!"
