  roc.184.b: "我说，你们就应该靠边站"

  roc.185.title: "公审"
  roc.185.desc: "南京，原帝国最高法院旧址。这栋仿西式建筑在战争期间曾被樱花军用作宪兵司令部，地牢的墙壁上还残留着囚徒用指甲刻下的字迹。如今它被改回法院，门口挂着一块新制的木牌，上面用端正的楷书写着“中华苏维埃民国特别军事法庭”。木牌的漆还没干透，在阳光下泛着湿润的光。\n\n蒋巾帼在审判开始前亲自来了一趟。她没有带随从，只带了戴安澜。两人站在空荡荡的审判庭里，看着法官席背后那面新挂上去的红旗。戴安澜问：“这些人，你打算怎么判？”蒋巾帼沉默了一会儿，然后说：“依法判。不杀降将，这是红军的传统。但降将不是无罪。每一个人的罪行都要经过法庭审理，每一份判决都要经得起历史的检验。她们手上沾了人民的血，血债必须清算。但清算不是屠杀——清算是用证据、用法律、用程序，让每一个受害者都能在法庭上说出自己的冤屈，让每一个罪犯都在法庭上承认自己的罪行。这是苏维埃和旧帝国最大的区别。旧帝国杀人不需要理由，苏维埃杀人必须经过审判。”\n\n特别军事法庭的法官由三人组成：一名老红军出身、在军政大学进修过法律，一名从上海法政学院毕业后加入革命军、在根据地搞过土改审判，一名从苏联留学归来、专门研究过国际法规范的专家。审判公开进行，旁听席向各界群众开放。每天开庭前，法院门口的布告栏上贴着当天的审判日程和旁听规则——“旁听者不得喧哗，不得鼓掌，不得辱骂被告人。你们是来见证正义，不是来发泄仇恨。”这是蒋巾帼亲笔添上去的。"
  roc.185.a: "开庭！"

  roc.186.title: "袁克定的最后陈述"
  roc.186.desc: "前帝国军总司令袁克定被押上法庭时，旁听席上静得能听见窗外梧桐叶落地的声音。她老了，头发已经全白，但她的背仍然挺得笔直。她被指控的罪名包括：发动反革命内战、指挥军队屠杀平民、在帝国覆灭后继续组织武装抵抗、拒绝接受投降令导致不必要的伤亡。\n\n审判持续了多日。检方传唤了数十名证人，从徐州战役的幸存者到黄河决堤后失去家园的农民。证人的证词记录堆满了书记员的案头。袁克定自始至终没有为自己辩护，只是沉默地听着。但在最后陈述阶段，她站了起来。她没有请求宽恕，只是缓缓扫视了一遍旁听席上那些普通民众的面孔，然后开口。\n\n“你们打赢了。我是败军之将，败军之将没有资格谈条件。我只说一件事：我当年炸开花园口大堤，不是因为我喜欢杀人，是因为我接到的命令是不惜一切代价守住郑州。我执行了那个命令，洪水淹死了多少人，我不知道具体的数字，但我知道，很多。这笔债，我背。我不求你们原谅我。但我请求你们，不要再让黄河决堤，不管是战争还是和平。那水太冷了。”\n\n旁听席上有一个老农站了起来。她指着袁克定，手指在发抖，声音也在发抖：“你炸堤那年，我一家几口人，只剩下我一个。你是杀人犯。”袁克定看着她，沉默了一会儿，然后说：“是。”老农没有再说话，只是慢慢坐了下去，双手捂住了脸。\n\n法官最后问袁克定还有什么要说的。她摇了摇头，然后忽然又开口，说了一句与审判无关的话：“我母亲在世时说过一句话——军人不问为什么，只问怎么做。现在我知道，她错了。军人必须问为什么。不问为什么的军人，和屠夫没有区别。”她向法官鞠了一躬，然后转向旁听席，对着那个老农的方向，又鞠了一躬。她的脊椎受过伤，弯腰很慢，但每一寸都压得很深。"
  roc.186.a: "本庭宣判：死刑！"

  roc.187.title: "判决与改造"
  roc.187.desc: "特别军事法庭的判决书逐一宣读。前帝国高级将领中，一部分因在战争期间犯下严重暴行、且在战后继续组织武装抵抗、拒绝接受投降令、造成大量不必要伤亡，被判处死刑；另一部分虽犯有罪行，但系执行上级命令而非主动策划暴行、战后主动缴械投降、认罪态度较好、有悔改表现者，被判处监禁，刑期根据各自罪行轻重不等；个别在战争末期主动率部起义、保护人民生命财产有功、且在改造期间积极检举其他战犯罪行、以实际行动证明其转变者，被从轻判处或免予刑事处罚，转入劳动改造营进行思想改造。\n\n死刑执行前一天，蒋巾帼签署了最终核准令。她在每一份死刑判决书的最后一行写下“核准”二字时，笔迹比平时更用力，纸背上都能摸到凹痕。戴安澜问她是否需要休息，她说不必。“我母亲当年在清党时签过很多这种字。她说那是革命。我签的这些字，也是革命。区别在于——她的字后面没有审判，我的字后面有。”她把最后一份判决书合上，将笔放下。"
  roc.187.a: "“法律从宽。正义从严。”"

  roc.188.title: "蒋丽华（一）"
  roc.188.desc: "蒋丽华是在北京朝廷覆灭后被送到南京的。\n\n她被俘时刚刚成年。押送她的专列从东北一路南下，沿途经过无数个她从未见过的村庄和工厂。她趴在车窗上往外看，看到那些在田里劳作的农民、在工厂门口排队领饭的工人、在路边写标语的赤色宣传员。她对押送她的政工干部说了一句话：“他们看起来不像我想象的那么恨我。”政工干部回答：“他们不恨你。他们只是不需要你了。”\n\n她在南京接受了一年多的思想改造。她的改造不是在监狱里进行的，是在一个特殊安置点——一座安静的旧宅，配有图书室和教员。教员是毛润芝派来的一位年轻女干部，曾在川北根据地做过农民扫盲工作。她给蒋丽华上课的内容包括中国近代史、帝国主义侵华史、以及苏维埃政权的基本政策。\n\n蒋丽华在最初几个月里始终沉默。她不回答问题，不发表意见，只是坐在那里听。那位女干部在给上级的汇报中写道：“她听得很认真。但她不开口。不是抗拒，是不知道怎么开口。她活了这么多年，从来没有自己开口说过自己的看法。她的嘴被旧制度封住了。”\n\n后来她终于开口了。有一天课后，她问教员：“你说地主剥削农民。我住的宫殿、吃的饭菜、穿的衣服，都是从农民那里来的。我是不是也是剥削者？”\n\n教员没有直接回答，只是说：“这个问题，你应该自己去读《资本论》。”\n\n蒋丽华读了大半年《资本论》。读完之后，她写了一篇读书笔记，题目是《我的阶级出身与自我改造》。她在笔记中写道：“我是旧制度的产物。我身上流的血是旧皇族的血，我曾经生活的宫殿是人民的血汗建成的。我不可能改变我的出身。但我可以改变我自己。我请求组织允许我参加劳动，用劳动洗掉我身上的旧痕迹。”"
  roc.188.a: "去安排一下"

  roc.189.title: "蒋丽华（二）"
  roc.189.desc: "她被安排到南京一家纺织厂做学徒工，化名“蒋华”，没有人知道她是末代女皇。她的师傅是一个工作了近三十年的老女工，手把手教她接线头、换梭子、检查布面。她学得很慢，但从不偷懒。老女工对她的评价只有一句话：“这姑娘以前大概没干过活。手太嫩。但态度端正。”\n\n她在纺织厂工作了很长时间。没有人刻意监视她，没有人安排记者来拍她“劳动改造”的照片。她只是每天早晨准时上班，傍晚准时下班，和工友们一起在食堂吃饭，一起在宿舍里洗衣服。她的工友中，有人知道她的真实身份，但从来没有人拿这个来嘲笑她或巴结她。有一位老工人说过一句话，被传了很久——“她干活不如别人，但她从来不觉得自己比别人金贵。就冲这一点，我没话说。”"
  roc.189.a: "旧时王谢堂前燕"

  roc.190.title: "黎星刻"
  roc.190.desc: "黎星刻的命运是在蒋丽华的命运被决定之后才被决定的。\n\n蒋巾帼亲自审查了她。审查不是在审讯室进行的，是在蒋巾帼的办公室里。蒋巾帼问了她三个问题：“你效忠的是谁？你对抗的是谁？你愿意为新政权做什么？”\n\n黎星刻的回答非常简短：“我效忠的是先帝托付给我的那个人。我对抗的是所有威胁她的人。你们如果以战犯处理我，我没有怨言。但如果你们愿意让我继续当军人，我会用我剩下的一切为新政权服务。”\n\n蒋巾帼没有再问。他调阅了黎星刻的全部档案——帝国中央军校的成绩单（全科优秀），历任职务的述职报告，以及他在京城新军卫所推行的训练改革方案。看完之后，他对戴安澜说：“这个人能用。他效忠的不是旧制度，是旧制度里的那个人。现在旧制度没有了，那个人也不需要他保护了，他可以重新选择忠诚的对象。”\n\n黎星刻被编入国防军，军衔暂定为上校，任命为军事教育处副处长。他没有指挥作战部队，而是被安排负责新兵训练和军校教材编写。他在任内编写了《步兵基础训练大纲》和《基层军官指挥手册》，这两本教材被戴安澜审阅后批准全军推广。\n\n但他与蒋丽华之间，隔着不再可能跨越的距离。蒋丽华在工厂劳动后，他请求与她见面。他的申请在组织内部转了很多道手，最终送到蒋巾帼的办公桌上。蒋巾帼看了很久，然后翻到下一份文件，没有批复。几个月后，黎星刻再次请求调往边防部队。这次蒋巾帼批准了。他被调往西北边防军，担任某步兵团团长。他离开南京那天，火车经过紫金山，他透过车窗望着中山陵的方向，看了很久。然后他低下头，把蒋丽华多年前托人转交给他的那条旧丝巾从怀里取出来，叠好，放在膝盖上。火车继续向北开。"
  roc.190.a: "而时代的车轮滚滚向前。"

  roc.191.title: "重岳"
  roc.191.desc: "重岳是帝国旧将领中少数几个在苏维埃军队中保留了原有地位的人。\n\n帝国覆灭后，他没有选择抵抗。他把部队集结在山西驻地，等待苏维埃政权派人来接收。来接收的是戴安澜。两人在军营里谈了整整一个下午。重岳表示自己可以交出兵权，但希望保留这支部队的建制，让他的老部下们能有一个体面的归宿。戴安澜的回答是：“你留下，部队也留下。但番号要改，政治委员制度要建。你能接受吗。”\n\n重岳没有犹豫：“能。”他的部队被改编为国防军第三十七步兵师，重岳继续担任师长，但增设了政治委员。他在改编后的第一件事，是把自己珍藏多年的佛珠送给了戴安澜。他说：“这是我在晋北古寺求的。戴在手上，能平心静气。”戴安澜接过佛珠，看了一眼，说：“我不戴佛珠。但我把它放在办公桌上。每次看到它，我会记得——你的旧部队，现在是新军队的一部分。”重岳后来在西北军区担任副司令，致力于边防建设和民族政策研究。他在任职报告中写道：“佛家讲慈悲，马克思主义讲解放。两者不是一回事。但在让穷人过上好日子这一点上，它们指向同一个方向。这个方向，我走对了。”"
  roc.191.a: "已阅"

  roc.192.title: "千岱芷（一）"
  roc.192.desc: "千岱芷是末代女皇蒋丽华的贴身护卫，千家的最后一任家主。千家是神州帝国的秘卫家族，世代掌管皇家内卫，以“世代誓约”效忠皇室。帝国覆灭时，她率残部在盛京流亡朝廷周围建立了最后一道防线。\n\n蒋丽华被俘后，流亡朝廷成员大多选择投降，千岱芷是少数几个战斗到最后的人。她没有投降。她带着剩下几名内卫在山林中继续抵抗了数月，最终因弹尽粮绝被围困在一处废弃的山神庙里。劝降的人在山下喊话，告诉她蒋丽华已经被安置，不会再受到伤害。她站在庙门口，把佩刀插在地上，用所有人都听得见的声音回答：“千家的誓约是保护皇帝。皇帝不需要保护了，我的任务就结束了。但我不会投降。投降是对誓约的侮辱。让我死在这里。”\n\n她最终力战被俘。当新政府的士兵冲进庙里时，她靠在供桌旁，重伤无法站立。她的佩刀断成两截，一截插在地上，一截握在她手里。她看着来人，没有恐惧，没有愤怒，只是轻轻说了一句：“告诉陛下，千家最后一任，没有给她丢人。”然后她闭上了眼睛。"
  roc.192.a: "愚忠的小丑"

  roc.193.title: "千岱芷（二）"
  roc.193.desc: "她没有死。卫生队的军医把她从供桌旁抬下来，缝合了最深的几处伤口，把她从失血昏迷的边缘拉了回来。她在战俘医疗站躺了很久，醒来时发现自己躺在一张干净的床上，手腕上缠着绷带。一个年轻的军医对她说：“你差点死了。”\n\n“为什么要救我？”\n\n“因为革命不杀俘虏。”军医低头在她的病历上写字，头也没抬，“而且你受了重伤。救你是医务人员的本分。”\n\n她被转送战俘营，在那里度过了数年。她拒绝接受思想改造，拒绝在任何悔过书上签字。但她也不闹事，只是沉默地服从管理，完成分配给她的劳动任务。她打扫营区卫生时极为认真，晾晒被褥时每一个边角都要对齐，缝补衣物时针脚整齐得让管教干部都暗暗称奇。这些不是战俘营要求她做的，是她自己非要这样做。管教干部在她的评估表上写道：“服从管理，但思想顽固。劳动态度良好。建议继续观察。”后来她被转送普通监禁场所，继续服完刑期。出狱后她离开南京，去了一个没人知道她是谁的小县城，靠做针线活维生。据说她出嫁时，枕头下面压着的，是蒋丽华多年前给她的一条旧头绳。那是她的嫁妆，也是她唯一随身带走的旧物。"
  roc.193.a: "已阅"

  roc.194.title: "农工民主党"
  roc.194.desc: "农工民主党是苏维埃政权最天然的同盟军，也是转型最顺利的民主派系。\n\n它的社会基础——自耕农、产业工人、进步学生——与苏维埃政权的阶级基础高度重合。苏维埃路线确立后，农工民主党被定性为“劳动人民的政治代表”，在统一战线中占据重要席位。党主席赤羽被任命为劳动人民委员会委员长，负责协调工农群众组织的日常工作。她的职责不是制定政策，而是在工厂和农村传达、解释党的政策，同时收集基层反馈。她在就职讲话中说：“我们曾经在国会上为工人农民说话。现在我们还是在为她们说话，只是说话的地方从议会辩论厅换成了工厂车间和田间地头。地方变了，任务没变。”"
  roc.194.a: "修正主义"

  roc.195.title: "致公党"
  roc.195.desc: "致公党是苏维埃政权统一战线中最特殊的成员。它的政治主张——“强省弱央，因地制宜”——在苏维埃的集中统一体制下失去了原有的政治土壤，但它的侨商网络和地方经济经验被苏维埃政权视为宝贵资源。\n\n党主席钟岚珠被任命为华侨事务委员会主任。她以个人信用和家族背景为担保，为苏维埃政权的工业化建设吸引南洋华侨投资。她在就职演说中说：“我这一辈子都在和地方、和商人、和海外华侨打交道。现在你们让我继续做这件事——用我的人脉，为新中国的工业化服务。我接受。不是因为我相信集中统一优于地方自治，而是因为我相信，让中国强大起来，比我个人的政治观点更重要。”\n\n致公党原有的地方自治主张在苏维埃体制下被转化为“民族区域自治”的研究和实践。钟岚珠利用自己在联省自治运动中的经验，参与了几个少数民族自治地区的筹建工作。她在一次内部会议上说：“我追求的是自治，不是分裂。自治的定义可以改变，但自治的价值不会改变。让一个民族自己管理自己——不管在什么制度下，这都是好事。”"
  roc.195.a: "大军阀"

  roc.196.title: "公民自由联盟"
  roc.196.desc: "公民自由联盟是苏维埃政权统一战线中最需要被改造的成员。它的自由主义立场与苏维埃的党国体制存在根本性的哲学分歧，但它在文化界和知识界的广泛影响力使其成为统一战线必须争取的对象。\n\n洛天依在苏维埃路线确立后，主动解散了公民自由联盟作为独立政治团体的组织架构，将其转型为苏维埃文化工作者协会。她在解散声明中写道：“我们的名字里有‘自由’两个字。自由在不同时代有不同的含义。在革命战争年代，自由是推翻压迫的自由。在建设年代，自由是参与建设的自由。公民自由联盟完成了它的历史使命。现在，我将以个人身份，继续用我的笔为中国文化建设服务。”\n\n她被任命为全国广播事业局局长，继续主持她创立的“收音机进万家”项目。她将广播网从城市扩展到农村，使偏远地区的农民也能收听到新闻、音乐和教育节目。她在全国广播网的启动仪式上说：“文化不是少数人的奢侈品。文化是每一个劳动者在收工之后应该拥有的精神食粮。我的工作，就是让这份食粮送到每一个人手里。”"
  roc.196.a: "走资派"

  roc.197.title: "公车党"
  roc.197.desc: "公车党是统一战线中最沉重的那一页。它的前身是维新变法的保皇立宪派，在帝国覆灭后失去了君主这个政治坐标。苏维埃路线确立后，公车党面临一个根本性的选择：是继续抱着“复古维新”的旧纲领沉没，还是在新制度中找到重新定位。\n\n党首符华做出了决断。她在党内大会上说：“师父一生所求，是为古老帝国寻一条新生之路。帝国已经死了。但师父的路没有死——那条路是从过去走向未来。我们可以在苏维埃制度中找到我们的位置——不是作为君主制的遗民，而是作为传统文化的保护者。”\n\n公车党被重新定位为“传统文化保护与研究协会”，符华被任命为全国文化遗产委员会副主任。她主持了第一次全国文物普查，编撰了《中国传统村落保护名录》。她在普查报告的序言中写道：“革命是改造旧世界，不是消灭过去。过去是我们的根。一个没有根的国家，走不了远路。苏维埃不是不要根——苏维埃是要把根扎在劳动人民的土壤里。我的工作，就是证明这个根可以扎得更深。”\n\n部分不愿接受转型的旧派成员选择了集体隐退。她们中的一些人在南京城郊的旧宅里继续撰写立宪君主制论著，但已经没有读者。符华没有阻止她们。她让人定期给她们送去纸张和墨水，在纸包上附了一张字条：“师父生前说过——每一个认真思考过中国命运的人，都值得被尊重。哪怕她的答案已经不是这个时代的答案。”"
  roc.197.a: "墙头草"

  roc.198.title: "青年党"
  roc.198.desc: "青年党是统一战线中最不可能被容忍的反对派。其党章中赫然写着明确的反共主义与国家主义纲领——在一个建立在马克思列宁主义原则之上的苏维埃政权眼中，这不仅是路线的分歧，更是根本性的阶级敌对。随着苏维埃路线的确立，对青年党的取缔令迅速下达，机关报被查封，骨干成员被依法逮捕或严密监控。\n\n作为青年党的代表人物与国防工业的核心骨干，汉阳造在面对审查人员和取缔通告时，表现出了近乎顽固的冷漠。她拒绝签署任何形式的“悔过声明”或“退党报告”，甚至直接将政治保卫局派来的审查政委晾在办公室外，自己整夜整夜地伏在图纸上绘制新式步枪。\n\n面对逼问，她把手里的图纸拍在桌上，冷冷地说道：“你们可以依法取缔青年党，也可以把我关进狱中。但苏联人的标准救不了中国。只要我还在兵工厂一天，我就只造中国人自己的枪——你们要杀要用，随你们的便。”蒋巾帼最终签署了对青年党反动组织的解散令，但同时也签发了对汉阳造的管制留用特批：“剥夺其政治权利，限制其活动范围，但保留其技术职务。政治上绝不妥协，但只要她的枪口对外，中国就需要她的骨头。”"
  roc.198.a: "骨头太硬"

  roc.199.title: "立宪民主党"
  roc.199.desc: "“立宪民主党是苏维埃路线确立后最早解散的党派之一。它的自由主义宪政理想与苏维埃体制完全对立，它的精英基础——城市中产阶级和温和知识分子——在统一战线中找不到明确的定位。苏维埃政权没有取缔它，但它自己选择了体面退场。\n\n党内的激进派曾试图继续维持组织存在，但温和派主导了最终决策。在最后一次中央委员会上，温和派代表发表了一篇简短声明：“我们曾经相信议会民主可以拯救中国。历史给了我们证明这个信念的机会，我们没有成功。不是信念错了，是我们没有能力实现它。今天，中国的道路已经由人民选择。我们尊重这个选择。立宪民主党从今天起停止活动。”\n\n部分成员以个人身份加入了文化、教育或行政部门，在苏维埃体制内继续工作。他们没有成为反对派，也没有成为宣传工具。他们只是一群曾经相信另一种道路的人，在新的道路上继续做着他们擅长的事——教书、写文章、做行政。一位前立宪民主党成员在中学的历史课堂上被学生问到“老师你以前是哪个党的”，他沉默了片刻，然后说：“老师以前相信议会。后来议会没有了，老师就回来教书了。教你们怎么思考。不是教你们相信什么。”"
  roc.199.a: "民主派"

  roc.200.title: "毛润芝"
  roc.200.desc: "毛润芝在苏维埃路线确立后，选择了一个出人意料但在蒋巾帼看来完全合理的立场：有条件合作。\n\n她在给中央的信中写道：“蒋巾帼的苏维埃不是我们的苏维埃。但在消灭地主阶级、实现工业国有化、推动农业集体化这三个方向上，她和我们走的是同一条路。只是她走得比我们慢。走得慢没关系——方向对了，慢就是稳。”\n\n蒋巾帼主动向重庆发出邀请，请毛润芝担任中央土地改革委员会顾问。毛润芝接受了。她在南京的办公室里挂了两幅地图：一幅是川北时期的红军根据地分布图，另一幅是五年计划的工业布局图。有人问她为什么把这两幅图挂在一起，她说：“前一幅图是我走过的路。后一幅图是我还没走完的路。”"
  roc.200.a: "“两幅图合在一起，就是中国革命的全貌。”"

  roc.201.title: "张雯甜"
  roc.201.desc: "张雯甜在苏维埃路线下终于找到了合适的位置。蒋巾帼任命她为中央党校副校长，分管马克思主义理论教育。这是张雯甜最擅长的领域——不是权力斗争，不是军事指挥，是理论的系统化教学。她在党校编写了一套《马克思主义基础教程》，在序言中写道：“马克思主义不是教条，是方法。方法可以被讨论、被修正、被发展。但讨论需要共同的语言。这套教程就是为了提供共同的语言。”她在课堂上对学生们说：“我是留苏派中最没有出息的一个——不会打仗，不会搞运动，只会读书。但我把书读通了。你们来党校，不是为了学我读过的书，是为了学会怎么读我没有读过的书。”"
  roc.201.a: "张雯甜老师，我还记得你"

  roc.202.title: "陈世涛"
  roc.202.desc: "陈世涛在四川红军接受改编后，她的川北独立师被编入国防军序列，暂编为西南独立师，番号保留一段时间后移交。她继续担任师长，驻防重庆。她与毛润芝保持着通信联系，信的频率不高，但内容很实在——讨论的都是军事训练、士兵伙食、地方治安之类的具体问题。她在一次回川北述职时对毛润芝说了这样一段话：“南京的苏维埃，比我想的要务实。她们确实在做工业，做铁路，做扫盲。这些事我在川北也想做，但没有力量。现在她们有力量。我不知道这条路能走多远，但至少现在，它还在走。”"
  roc.202.a: "老将军的执念"

  roc.203.title: "千代桃"
  roc.203.desc: "千代桃在苏维埃路线确立后，与蒋巾帼的合作关系进入了一个新的阶段。\n\n她不再只是莫斯科派在中共党内的联络人，而是被任命为中央宣传委员会副主任，分管国际共产主义运动联络。她可以继续推动中苏文化交流，可以继续写文章论证中国革命在世界革命中的地位，但她不能再主导党内路线斗争——苏维埃路线确立后，路线争论已经结束。她接受了这个位置，没有抱怨。她用俄文写了一封信给共产国际的旧同事，信中说：“我们曾经争论过很多事。现在争论结束了。不是因为我们赢了——是因为革命已经进入了建设阶段。建设不需要争论，建设需要工作。我在工作。”"
  roc.203.a: "联合起来！"

  roc.204.title: "吉田优"
  roc.204.desc: "吉田优在苏维埃路线确立后继续留在南京，担任苏联驻华大使馆文化参赞兼共产国际联络员。她的工作内容和重庆时期没有太大变化——组织留学生事务，协调苏联书籍翻译，处理中苏文化交流。她在办公桌上放了一张照片，是多年前在上海拍的，照片上她和千代桃并肩站在一起，背后是黄浦江。有人在照片背面写了一句话，字迹是千代桃的笔迹：“我们都曾经相信过。这就够了。”"
  roc.204.a: "中苏是一道的"

  roc.205.title: "陈独秀"
  roc.205.desc: "陈独秀在苏维埃路线确立后彻底退出了政治舞台。她的最后一次公开露面是在中央党校的开学典礼上，蒋巾帼邀请她作为特邀嘉宾出席。她没有发表演讲，只是在典礼结束后对几位年轻学员说了一段话：“我犯过很多错误。最大的错误是认为自己最懂革命。你们不要学我。革命不是请客吃饭，也不是自以为是。革命是学出来的，不是拍脑袋拍出来的。”她在此后的岁月里彻底隐居，专心整理中共早期文献。她的助手发现她在校对1921年中共一大会议记录时，在自己的发言记录旁边写了一行小字：“我当时说‘中国革命的希望在于工人’。这句话太窄了。现在我知道，希望的根基在于所有人——包括那些我曾经瞧不起的农民。”"
  roc.205.a: "做做文书工作，就挺好。"

  roc.206.title: "宋庆龄"
  roc.206.desc: "宋庆龄在党内选举落败后，保留了名誉国家元首的职位，但实际决策权已转移至蒋巾帼领导的中央执行委员会。她没有辞职，没有流亡，没有在公开场合表达不满。她在选举结果公布后的第二天早晨，照常出席了中央执行委员会的例会，坐在蒋巾帼的左手边，和往常一样认真听完了所有议程。\n\n蒋巾帼在会后单独留下她。“孙夫人，我知道你不赞成我的方案。但你留在这里，对我来说很重要。不是因为你手里还有票——是因为你在这里，革命委员会就还是完整的。”\n\n宋庆龄摘下了眼镜，慢慢擦拭着镜片。她回答说：“巾帼，我以前对你说过，你在莫斯科学到的那些东西，有些是对的，有些是水土不服的。我没有改变这个看法。但你赢了选举。选举结果是合法的。我不会成为你的反对派，但我会继续做我认为对的事——在宪法允许的范围内。你推行你的五年计划，我继续建我的村小。我们走不同的路，但方向应该是一样的。”\n\n她在苏维埃政权中保留了国民教育委员会主任的职务。洛茜继续担任她的副手，负责乡村小学建设和扫盲运动。蒋巾帼对教育领域的投入没有削减——她需要识字的技术工人来执行五年计划，宋庆龄需要识字的公民来建设她理想中的共和国。两人在教育事业上达成了心照不宣的合作。"
  roc.206.a: "为了大局"

  roc.207.title: "宪政同志会"
  roc.207.desc: "宋娇仁是苏维埃路线确立过程中最坚定的反对者，也是失败后最体面的失败者。\n\n她在党内选举落败后，在国会发表了最后一次公开演讲。演讲的最后一句话是：“我仍然相信议会民主。但我也承认，民主需要时间来证明自己，而时间不在我这一边。我今天输掉了选举。明天我还会来上班。因为反对党也是国家的一部分。”\n\n她在苏维埃政权中保留了国会议员席位，但宪政同志会作为政党被要求接受党的领导。宋娇仁没有拒绝，也没有屈服。她在国会中继续提出法案、参与质询、发表不同意见。她的发言风格一如既往地严谨而克制，从不攻击个人，只讨论政策。蒋巾帼对她的态度是复杂的：她欣赏宋娇仁的能力和品格，但无法接受宋娇仁的政治主张。她有一次对佩丽卡说：“宋娇仁是一个好的反对派。可惜反对派在苏维埃制度下没有土壤。”佩丽卡回答：“你如果连她这样的反对派都容不下，你的制度就真的没有土壤了。”\n\n佩丽卡在苏维埃政权中继续担任法务部长，但她的权力被限制在民法、刑法和行政法规的技术性领域。她不参与政治决策，不发表意识形态言论，只在法律条文和程序规则上保持专业和严格。她在任内完成的工作包括修订《中华民国民法典》、制定《工商管理条例》、为五年计划提供法律框架。她在每份法律草案的扉页上都用同样的格式题词——“本法案依据现行法律程序编制，不涉及政治立场。”她从未加入苏维埃政权的主导政党，也从未在公开场合评价苏维埃制度。她只是在法律条文的缝隙里，继续做她认为应该做的事。"
  roc.207.a: "党内走资派"

  roc.208.title: "CC系"
  roc.208.desc: "陈晖洁在苏维埃路线确立后做出了一个令所有人意外的决定：她主动请求将CC系的党务网络并入党的组织系统。\n\n她求见蒋巾帼时，带了一份厚厚的名册。名册上登记着CC系在各县市建立的基层党支部、每个支部的党员人数、以及负责人的政治评估。她说：“这份名册，我交给党。你的人比我更需要它。五年计划需要基层执行力，我的人可以帮你。”\n\n蒋巾帼接过名册，没有立刻回答。她翻了几页，看到了那些密密麻麻的名字和评估栏。然后她合上名册，看着陈晖洁。“你要什么？”\n\n“我什么都不要。CC系本来就不应该是一个独立的派系。它从一开始就是一个组织工具。工具不需要独立存在。它只需要被使用。”她停顿了一下，然后罕见地流露出一丝并非完全公事公办的态度，“你母亲当年在黄埔的时候，也是这么做的。她把学生组织起来，不是为了搞派系，是为了革命。你继承了你母亲的枪。你也要继承她的组织方法。”\n\n蒋巾帼沉默了一会儿，然后说：“我不需要一份名册。我需要一个人。你来当中央组织部副部长。你负责把CC系的基层网络改编成党的组织系统。不是消灭它——是改造它。”\n\n陈晖洁点了点头。她站起身准备告辞，走到门口时停住，没有回头，只是用比平时更轻的声音说了一句：“你比你母亲更会用人。她只会命令，你会说服。”蒋巾帼看着她的背影消失在门外，没有回答。\n\n陈千语在苏维埃政权中保留了都城卫戍司令的职务，但她的权限被扩大——她不再只负责南京的城防，而是被调任为新设立的国防部军事纪律检查局局长，负责全军纪律监督。她的工作风格没有变。她每天破晓策马巡视南京的驻军营地，不提前通知，不听汇报，只看实际情况。戴安澜对她的评价只有一句话：“她看问题的角度和我一样——不看报告，看现场。”"
  roc.208.a: "最好的结局"

  roc.209.title: "胡宗南"
  roc.209.desc: "中正社是苏维埃路线确立过程中最大的阻力，也是蒋巾帼处理得最谨慎的问题。\n\n胡宗南在党内选举结果公布后，把自己关在办公室里整整一天。她的副官守在门外，只听见里面偶尔传出踱步的声音。傍晚时她开门出来，对副官说了一句话：“备车。去中山陵。”\n\n她独自在蒋介石衣冠冢前站了一夜。天亮后她回到南京，主动求见蒋巾帼。\n\n会面在蒋巾帼的办公室进行，没有记录，没有旁听。据后来蒋巾帼对戴安澜转述的只言片语，胡宗南说了这样一段话：“你赢了。我不懂你的苏维埃，但我懂一件事——你姓蒋。你母亲是我的校长，你是她的女儿。你可以改掉你母亲建立的旧军队，我不拦你。但你得答应我一件事：在你改完之后，这支军队仍然是中国人的军队。不是莫斯科的。你向我保证这一点，我就交出中正社的指挥权。”\n\n蒋巾帼给了她保证。不是书面保证——是口头的。她说：“我母亲在郑州战死的时候，面朝的方向是北京。我记住这一点了。我永远不会让中国的军队听命于任何外国。”\n\n胡宗南交出中正社的独立指挥权后，被任命为国防委员会委员兼军事教育总监。这不是一个实权职位，但蒋巾帼在任命时特意强调：“黄埔军校还需要你。每一期新生入学的时候，她们应该知道——这所军校的第一任校长是蒋介石，第二任校长是你的同窗。革命不忘记历史。”胡宗南接受了这个职位。她没有去军校发表演讲，但她每年开学典礼都会坐在主席台上，穿着一身笔挺的旧式军装。从不发言。只是坐着。"
  roc.209.a: "从黄埔出发，又回到黄埔"

  roc.210.title: "汤汤"
  roc.210.desc: "汤汤的清波寨子弟兵被编入国防军序列，暂编为独立旅，番号保留“清波寨”。汤汤继续担任旅长。她对此的态度一如既往地务实：“番号没撤，弟兄们没散，军饷不欠。其她的，我听命令。”她在苏维埃军队中是一个异数——她的部队不喊政治口号，不设政治委员，但她的部队从未拖欠过一次训练任务，从未出现过一次逃兵。戴安澜视察清波寨独立旅后，在报告里写了一句：“该旅不设政工，但士气全军最高。建议不强制派驻政工人员。有些部队靠纪律管，这支部队靠大当家管。两种方法，效果都一样。”"
  roc.210.a: "暂时的妥协"

  roc.211.title: "识之律者"
  roc.211.desc: "识之律者在苏维埃路线确立后的处境是所有派系人物中最微妙的。\n\n她是蓝衣社的领袖，蓝衣社在广府时期负责政治监控和内部清洗。苏维埃路线确立后，这类工作的性质发生了根本性变化——政治监控仍然存在，但它必须被纳入党的纪律检查体系，而不是一个独立的、只向最高领袖个人负责的秘密组织。\n\n蒋巾帼没有立即处理蓝衣社。她知道识之律者的能力，也知道贸然动她可能引起的反噬。她采取了一种更精致的手段——将蓝衣社改组为中央纪律检查委员会下属的安全调查处，任命识之律者为处长。从表面上看，她的职权范围缩小了，但实际上，她被纳入了一套制度化的监控体系，她的上面有了纪律检查委员会，她的旁边有了其她监控部门，她不再是唯一的眼睛。\n\n识之律者接受了这个安排。她在接到任命书时只问了一句话：“我可以继续维护档案库吗？”\n\n“可以。”\n\n“那就够了。”\n\n安全调查处的档案库比蓝衣社时期的规模更小，但制度更严密。识之律者的日常工作不再包括主动监控党内同志——那部分工作由纪律检查委员会统一协调。她的主要职责转为安全档案的整理、归档和交叉比对。她在档案库的深处保留了一排灰色档案柜，柜子上没有任何标签。她的副官问她那些柜子装的是什么，她没有回答。也许她只是在保留某种习惯——知道一切的习惯。"
  roc.211.a: "旧时代的爪牙必须拔除"

  roc.212.title: "审判汪兆铭"
  roc.212.desc: "汪兆铭在苏维埃路线确立后失去了最后的存在价值。\n\n在广府时期，改组派已经因通敌叛国被清洗。汪兆铭本人被捕后以叛国罪受审，审判是公开的。蒋巾帼在审判前给特别法庭的指示只有一句话：“依法审理。不徇私，不加刑。”审判结果是终身监禁。\n\n汪兆铭在狱中没有写悔过书，但她写了一本关于国民党早期历史的回忆录。这本回忆录在蒋巾帼执政期间未被允许出版，但蒋巾帼也没有下令销毁。她只是在审阅出版申请时批了一行字："
  roc.212.a: "“暂缓。待历史有定论后再议。”"

  roc.213.title: "苏维埃大会·幕前（一）"
  roc.213.desc: "蒋巾帼站在原国民大会堂的穹顶之下。这座建筑在帝国时代是咨政院，在宋娇仁时代是国民议会，如今正被改造为中华苏维埃第一次全国代表大会的会场。工人们正把青天白日满地红的旗帜与苏维埃的旗帜并排悬挂在主席台两侧。青天白日旗没有撤下，只是在它的旁边，多了一面红旗。\n\n她今天穿着深色中山装，左胸口袋上方别着一枚小小的红旗徽章。这枚徽章是她从莫斯科带回来的，多年未曾佩戴。她的秘书在整理她当日着装时注意到这枚徽章的位置——正对心脏。会场里很安静，只有木槌敲击和布料摩擦的细碎声响。她抬头看着主席台正上方那行新刻的字——“全世界无产者，联合起来。”那些字刚描过金，在灯光下微微发亮。\n\n“准备好了？”戴安澜不知什么时候走到了她身后。\n\n蒋巾帼没有回头。“准备好了。你呢？”\n\n戴安澜整了整军帽。“我的位置在台下。你的位置在台上。”她顿了顿，“从今天起，军队只听党的。这顶帽子，我戴了几十年，今天是第一次觉得它比枪还重。”\n\n蒋巾帼转过身。她看着戴安澜军帽上那颗旧帽徽，帽檐下那道旧伤疤在灯光下隐约可见。“不是比枪重。是枪有了方向。以前枪的方向是指挥官的手指，以后枪的方向是党的决议。指挥官可以犯错，但党不能。党如果犯错，还有代表大会。代表大会犯错，还有下一个五年计划。”\n\n戴安澜沉默了一会儿，然后抬手对蒋巾帼敬了一个标准的军礼。“我去台下就座。”她转过身，步伐铿锵地走向代表席。\n\n苏维埃大会的代表共一千七百余名，其中工人代表占四成，农民代表占三成，军人代表占一成半，知识分子和专业技术人员代表占一成半。这个比例是庄方宜用几个月时间反复核算出来的。她向蒋巾帼解释过这套数据的底层逻辑：参考了苏联苏维埃代表大会的构成经验，同时也纳入了各省人口结构和产业分布的原始数据。"
  roc.213.a: "（鼓掌）"

  roc.214.title: "苏维埃大会·幕前（二）"
  roc.214.desc: "邓子恢坐在农民代表席的第一排。她在江西苏区搞过土改，在闽西组织过农会，后来被调到中央担任土地改革委员会主任。此刻她正低头翻看大会的议程草案，手指在纸面上轻轻滑过，停在其中一页的页角。议程第三项的标题是“农民代表资格审查报告”，她打算在审议时提出一条补充意见——资格审查除了核实选举程序是否合规，还应增加一项内容：被选举人是否亲自耕种过土地。\n\n毛润芝坐在她旁边，手里端着那只搪瓷茶缸，缸子上“川北农会”的红字已经有些模糊了。茶缸搁在桌面上，冒着白汽。她没有翻议程，只是看着主席台。\n\n陈世涛坐在军人代表席的第二排。她穿着新发下来的国防军常服，肩章上是川北独立旅的番号，衣领挺括，但她偶尔会下意识地扯一下袖口。邓子恢在第一轮投票结束后从她身侧经过，低声问了一句：“你第一次投票，感觉怎样？”她放下手中那张刚填好的表决票，看着她说：“在川北的时候，我下令打过很多仗。每一仗都要死人。今天这个表决器，比枪轻。但它能做的事，比枪多。所以我投票。不只是替我投，也替那些没能活到投票这一天的人投。”"
  roc.214.a: "我们将决定中国的未来"

  roc.215.title: "苏维埃大会·开幕"
  roc.215.desc: "蒋巾帼走上主席台时，会场的喧哗声渐渐平息。她站在讲台前，没有立刻开口，而是扫视了一圈台下的代表。她看到了第一排的毛润芝，看到了邓子恢，看到了陈世涛，看到了后排站得笔直的戴安澜。然后她把讲稿放在讲台上，没有翻开。\n\n“同志们。”\n\n她的声音通过扩音器传遍整个会场。\n\n“中华苏维埃第一次全国代表大会，现在开幕。在今天以前，这个国家的议会叫国民议会。从今天起，它叫苏维埃代表大会。国民议会的代表是由各党派推举的，苏维埃代表大会的代表是由各阶级选举的。工人选工人代表，农民选农民代表，军人选军人代表。这不是某一个人的决定，这是革命发展到今天的必然。革命不是请客吃饭，这句话很多同志都读过。但革命也不是只打仗，这句话是我这些年才明白的。革命是要让种地的人决定土地的政策，让开机器的人决定工厂的政策，让教书的和治病的人决定文化和卫生的政策。今天这个大会，就是做这件事的。”\n\n她停顿了一下。\n\n“在座的每一位代表，都是某一个行业、某一个地区、某一种劳动的代言人。你们不是来举手的，不是来听报告的。你们是来做决定的。大会的每一项决议，都需要你们自己投票。投了赞成，就是替投你们票的人说了赞成。投了反对，就是替投你们票的人说了反对。弃权也是一种态度。我希望这个大会里，有不同意见。有争论。有修改。这样决议才会结实。一致通过的东西往往不结实。”"
  roc.215.a: "（鼓掌）"

  roc.216.title: "一党制的讨论"
  roc.216.desc: "全体起立。掌声如雷鸣。戴安澜在最后一排站得笔直，她摘下军帽，放在胸口。军帽的帽檐依旧磨损发白，帽徽是新的。陈世涛在鼓掌，手抬得很高，每一击都干脆利落，像在行军时打着节拍。邓子恢没有鼓掌，她在低头记录——议程第一项需要提出的那条补充意见，刚才蒋巾帼的讲话中没有明确提及。她要在资格审查的讨论环节，把“亲自耕种过土地”这一条正式列入代表资格的实质性审查标准。\n\n一党制的问题是在《宪法》草案讨论到政党条款时被正式提出的。\n\n庄方宜先从数据角度做了说明。她在核算各选区上报的代表资格审查统计时发现，原有的多党竞选框架与职业代表制在程序衔接上产生了矛盾：有的选区同时出现了多个政党提名的候选人争夺同一职业界别席位，资格审查标准无法统一。\n\n随后陈芸从财政管理的角度谈到，多党竞选导致议会反复拉锯，上一财政年度的预算案因此迟迟未能定稿，多个项目的拨款被搁置了数月。她用铅笔轻敲着桌面上的预算对照表，语气平静地补了一句：“我管了这么多年账，没见过哪个问题是因为反复投票自己解决的。”\n\n西瓜坐在自己那条未完工的铁轨尽头，听到庄方宜托人带来的口信后想了很久。她用手摩挲着铁轨上的铆钉，说了一段自己在火车国经历过的往事：有次铺轨铺到岔路口，两个工程师对路线方案争执不下，谁也不肯让谁，结果那个路段耽误了整整一个季度。最后大雪封山，谁也铺不了。“路要铺下去，党是唯一的火车头。不是不要别的车厢——但火车头只能有一个。”"
  roc.216.a: "党必须领导一切"

  roc.217.title: "表决"
  roc.217.desc: "蒋巾帼最后发言时没有拿讲稿，也没有引用理论，只是站在讲台上看着台下。她提到了自己的母亲。她说蒋介石用枪杆子维持一党独裁，那是为一姓一人，是错的；而苏维埃的一党制是为一个阶级，是为工人和农民。这比多党竞选更真实，因为只有这样的制度才能让无产阶级选出真正代表自己的人，而不是由有钱人的政党假借各种口号来渔利。\n\n“一个党，一个阶级，一个目标。中国不需要资本主义的议会游戏。中国需要社会主义的苏维埃。”\n\n全会表决。蒋巾帼没有举手，她站在讲台上看着台下。戴安澜举手。邓子恢举手。陈世涛举手。庄方宜举手。毛润芝举手。西瓜举手。陈芸举手。千代桃举手。整个大厅里，手臂如林。"
  roc.217.a: "中国的未来由我们决定"

  roc.218.title: "苏维埃大会·散会"
  roc.218.desc: "散会时天色已晚。代表们陆续走出会场，街灯把她们的影子拉得很长，投在国民大会堂门前的石阶上。毛润芝端着那只搪瓷茶缸走在人群后面，茶缸里的水已经凉了。邓子恢和她并肩走着，沉默了一会儿，然后说：“土改的事，我还有些话要在明天的分组讨论上说。”毛润芝说：“什么话？”\n\n“审查代表资格的时候，我加了一条：被选举人必须亲自耕种过土地。这一条大会已经通过了。但我还想再加一条——选举人必须亲自耕种过土地。贫农选贫农代表，中农选中农代表。地主不能选，富农也不能选。土改不只是分地，是分权力。分地的权力，分权的权力。”\n\n毛润芝喝了一口凉水，看着远处的街灯。“你明天在分组讨论上提。我附议。”"
  roc.218.a: "中国的明天只会更加光明。"

  roc.219.title: "肃反"
  roc.219.desc: "蒋巾帼站在中央执行委员会的讲台上，面前摊着一份名单。名单很薄，只有两页纸，但这两页纸上的每一个名字都曾经是国民党的重要人物——有黄埔时期的元老，有广府时期的部长，有北伐时期的将领。这些人在国民党内盘踞了太久，把党当成了自己的私产。她们打着三民主义的旗号，干的却是旧官僚的勾当。蒋巾帼在莫斯科学到的第一课就是：革命政党的纯洁性，是靠清洗来维持的。不是请客吃饭，不是做文章，不是绘画绣花，不能那样雅致，那样从容不迫。她拿起名单，开始逐条宣读。\n\n“下列人员，经中央纪律检查委员会审查，确认其在革命胜利后继续从事反革命活动，利用党内职务贪污腐败、包庇地主、破坏土改。现依据《中华苏维埃民国刑法》及《中国国民党纪律处分条例》，予以开除党籍、解除一切公职，并移交人民法庭审判。”\n\n名单上的第一个人是原国民党中央执行委员、曾任广府国民政府财政部长的孔祥茜。她的罪名是贪污巨额公款、包庇地主亲属逃避土改、以及在北伐期间与外国资本勾结出卖国家利益。蒋巾帼宣读完她的罪状后，抬起眼睛，扫视了一圈台下的代表。没有人说话。孔祥茜没有到场，她已经在前一天被安全部门逮捕。她的妻子宋蔼龄——宋庆龄的姐姐——随后也被带走接受调查。\n\n......"
  roc.219.a: "蛀虫必须消灭"

  roc.220.title: "两党合并"
  roc.220.desc: "中共并入国民党的工作是在苏维埃大会闭幕后的第二个月正式启动的。这不是一次简单的合并，而是一次从组织架构到意识形态的全面重组。蒋巾帼在重组方案的开篇亲自写了一段话：“我们正在建设的党不是旧式的议会政党，不是松散的竞选联盟，更不是官僚分赃的俱乐部。它是无产阶级的先锋队，是革命事业的领导核心。它的成员不是选票的追逐者，而是人民的勤务员。”\n\n毛润芝被任命为中央组织委员会副主任，分管农村党支部建设和党员资格审查。她上任后做的第一件事，是把川北时期发展党员的经验整理成一份简短的报告呈给蒋巾帼。报告的核心意思是：发展党员不能只看申请书上的字，要看申请人在实际劳动中的表现——种地的看交公粮和农会活动，开机器的看技术革新和工会服务，教书的看学生升学率和家长反馈。蒋巾帼看完报告后批了一行字：“即令中央组织部照此原则修订党员发展标准。”毛润芝收到批示后在办公室坐了很久，把那份报告的副本叠好放进抽屉，抽屉里还放着当年在川北窑洞中写的《实践论》手稿。\n\n陈世涛被任命为中央军事委员会委员兼国防部副部长，继续兼任川北军区司令员。她的川北独立旅在红军改编后率先完成了政治委员制度的全面建立。她在军区党委会上说：“以前在川北，我们发展党员不靠说——靠在战斗中第一个冲出战壕，靠在行军时帮伤病员背枪，靠在断粮时自己吃野菜、把干粮让给新兵。现在不打仗了，但这些规矩不能丢。党员的标准不能因为不打仗就降下来。”"
  roc.220.a: "从此，中国只有一个先锋队"

  roc.221.title: "纪律审查"
  roc.221.desc: "邓子恢分管农村党员干部的纪律审查。她在审查中发现一个突出的问题：不少新发展的农村党员在土改中分到了比别人更多的地，或者把亲戚拉进了农会当干部。她给蒋巾帼写了一份措辞直白的报告：“土改分了地主的权，现在有些党员在模仿地主的行为模式。这个问题不解决，党的基层就会烂掉。”蒋巾帼在报告上批了四个字——“从严查处。”随后中央纪律检查委员会组织了一次专项整顿，清退了一批在土改中牟利的农村党员。邓子恢在整顿总结会上说：“清除这些人不是削弱党。清除寄生虫是为了让健康细胞长得更快。”"
  roc.221.a: "党员必须保持纪律性与团结性"

  roc.222.title: "中央党校"
  roc.222.desc: "中央党校的新址选在南京原帝国国子监旧址。这不是巧合，是蒋巾帼亲自选的。她在党校奠基仪式上说：“这里以前是培养帝国官僚的地方，现在我们要在这里培养无产阶级的先锋战士。旧的国子监教人怎么忠于皇帝，新的党校教人怎么忠于人民。”\n\n党校的首任校长是张闻天。他在遵义会议后长期分管党的理论工作，这次被从编译局调任党校校长，主持编写了《党校基础教程》系列教材。教材第一册的开篇第一课不是讲马克思主义哲学，而是讲一个具体的案例——一个苏北农村党支部如何在春荒中组织群众生产自救，同时清理了两个在救济粮分配中徇私的党员。他在教务会上对全体教员说：“理论不是抽象的。理论是从这些具体的案例里提炼出来的。如果我们的学员学完教材后只记得几个概念却不知道回去怎么开展工作，那这套教材就是失败的。”\n\n蒋巾帼定期来党校讲课。她的课不讲马克思主义经典，不讲列宁主义原理，只讲一件事：她母亲是怎么犯错误的，以及从那些错误中学到了什么。有一次她对学员说：“蒋介石的失败，不是因为军队不够多，不是因为武器不够好。她失败是因为她的党和人民之间隔着一层官僚。她的党员坐在办公室里发号施令，从来不去田里看看农民种的是什么。我们这一代人不能重蹈覆辙。”说完她在黑板上写下一行字——“党员的第一条纪律：永远不脱离劳动。”她转过身来，问台下的学员：“你们谁种过地？”一部分人举手。她接着问：“你们谁进过工厂？”另一部分人举手。她沉默了一会儿，然后点名问一个没有举过两次手的学员：“你来自哪个省？”学员站起来回答：“广东。”“你准备什么时候补上这两课？”学员回答：“下个月。我申请下乡参加秋收。”蒋巾帼点了点头，说：“坐下。记住你今天说的话。党校不记空话。”\n\n千代桃在党校分管政治教育。她每堂课都坐在最后一排，随身带着那本旧笔记本，密密麻麻记满了各个学员的发言要点和课后反馈。她在一次教务会上提了一条建议：党校的政治课不应该只是教员讲、学员记，应该让学员自己讲。每个人讲自己入党的原因，讲自己见过的革命，讲自己犯过的错误。她说：“这叫‘自我教育’。一个党员如果连自己为什么入党都讲不清楚，他就不是一个合格的党员。一个合格的党员不是在讲台上背出来的，是在实践中干出来的，也是在反思中说出来的。”这个建议被张闻天采纳，此后党校每一期培训班都设有“自我教育”专题讨论会。"
  roc.222.a: "党的教育必不可少。"

  roc.223.title: "整风"
  roc.223.desc: "千代桃在《红色中华》上发表了一篇社论，标题是《论党的作风》。这篇文章是她观察了各级党组织运转一年多的现状后，断断续续写了很久才定稿的。她在社论中提出了三个问题：官僚主义、形式主义和享乐主义。\n\n“官僚主义就是：老百姓来办事，党员说‘研究研究’，研究了大半年没有下文。形式主义就是：上级要来检查，下级连夜挂标语、写汇报、安排群众背诵感谢词。享乐主义就是：有的同志进城以后，觉得革命已经成功了，该享受享受了，公款吃喝、公车私用、公物私占。”\n\n她用一个具体的事例来支撑每一个论点。形式主义那条用的是某县为了迎接检查团临时刷白围墙，检查团走后围墙上的白灰还没干透就掉了。她没有点出这个县的名字，但她在内部讨论时把这个县的材料直接转给了纪律检查委员会。她说：“这些问题不是个别的，是系统的。系统的病不能用个别的方法来治。需要一场整风。”\n\n蒋巾帼在读完这篇社论后，亲自下令在中央纪律检查委员会内设立整风办公室，由千代桃兼任主任。她在整风动员大会上说：“党不是一群人的集合。党是一个活的组织。组织会生病。生了病就要治。治了才能继续往前走。整风不是运动，是治疗。运动有终点，治疗没有终点。只要党还在，治疗就不能停。”\n\n陈芸在整风期间发现了一件典型的经济违纪案例：一名地方工业局负责人在基建项目中授意下属将合同价格虚报，然后把差价私设账外资金用于违规接待和发放员工福利。她把这个案例写成了内部通报，全文只有事实陈述和账目比对，没有任何评价性语言。她在通报末尾写道：“管了这么多年账，我见过无数这样的案例。这不是疏忽，这是明知故犯。建议将此案移送纪律检查委员会，并在全系统内通报。”蒋巾帼在通报上批了两个字——“同意。”陈芸看着这份已批复的通报，想起了自己最早的账本封面那句话——“每一分钱，都要对得起交钱的人。”她用钢笔把这句话重新描了一遍，墨迹压着旧墨迹，严丝合缝。"
  roc.223.a: "革命的成功已经让一部分人忘记了革命的意义。"

  roc.224.title: "三青团"
  roc.224.desc: "蒋巾帼站在南京原中央大学的操场上。操场很大，能容纳上万人，此刻站满了从各省市选拔上来的青年代表。她们穿着统一的蓝布工装，左臂佩着崭新袖章，上面印着“三青团”三个红色大字。那是她昨夜在办公室灯下亲自题写的，笔画刚硬，横平竖直，没有连笔，没有倾斜。每张袖章都由工厂加班赶制，女工们在缝纫机前忙到深夜，最后一个离开车间的工人用粉笔在机器上画了一颗五角星。\n\n风很大，吹得旗帜猎猎作响。蒋巾帼没有戴帽子，头发被风吹得有些乱，但她的站姿纹丝不动——在莫斯科学到的军人仪态已经刻进了骨骼。她的目光从左到右扫过整个方阵，然后开口。\n\n“同志们，从今天起，你们有一个共同的名字——三青团员。”\n\n她的声音通过扩音器传遍操场，被风吹散了一些，但最核心的语句稳稳地落进了每个人的耳朵。没有一个人交头接耳。\n\n“三青团的全称是‘共产主义三民主义青年团’。这不是一个普通的青年社团，不是让你们周末来唱歌跳舞的俱乐部。这是党的预备队，是革命的接班人，是无产阶级的生力军。每一个三青团员，都要做到三件事：学习、劳动、训练。学习，是为了不盲从。劳动，是为了不忘本。训练，是为了不挨打。”\n\n她在讲台上停顿了一下，把讲稿翻到下一页，但没有低头去看。那些话她已经反复修改了很多遍，昨晚在办公室里对着墙默念，每一个措辞都经过反复推敲，不需要再看了。\n\n“谁来当你们的团长？我。不是我坐在办公室里挂个名，是我亲自带你们。你们去哪，我就去哪。你们劳动，我跟你们一起劳动。你们训练，我跟你们一起训练。你们的成绩，我亲自看。你们的问题，我亲自问。你们不是蒋主席的青年。你们是革命的青年。而革命，不是请客吃饭。”\n\n操场上响起了掌声。那不是整齐的、被排练过的掌声，而是从方阵最前排开始，逐渐蔓延到后排，越拍越响，越拍越密，像雨点打在铁皮屋顶上。有个年轻的女学员把手掌都拍红了，但她没有停下来，她觉得停下来会错过什么。那是一种她从未体验过的被承认的感觉。"
  roc.224.a: "青年人的力量。"

  roc.225.title: "三青团·招募"
  roc.225.desc: "三青团的招募在全国各地展开。招募站设在各城市的工人文化宫、农村的扫盲夜校和师专的礼堂里，门口贴着同样的标语——“革命需要你。”标语下方是一行小字，印着入团条件：年满十四周岁，不限性别，不限文化程度，须经所在单位或农会推荐，并经团组织审核。这行字是陈芸逐字修改过的，她把原稿中的“无犯罪记录”改为“无剥削阶级家庭背景”，又把“初中以上文化”改为“具备基本读写能力或正在参加扫盲”。\n\n广州码头，一个装卸工青年蹲在货箱上填写报名表。他手心全是老茧，铅笔在指缝间显得格外细。写到“特长”一栏时他犹豫了片刻，抬起头问招募站的工作人员：“力气大算不算特长？我能一个人扛两包米。”工作人员笑了，说：“算。但你还要学会识字。三青团不光要力气，还要头脑。”他把报名表认真折好放进信封。\n\n川北农村，一个刚从农技推广站下班的姑娘报名时，她的母亲拄着拐杖站在门口，脸上满是担忧的神色。姑娘握着母亲的手，轻轻按在自己刚领到的笔记本上，说：“我是去学技术，不是去打仗。等学完了还回来教咱们村里人。黍老师说，现在省上在推广改良稻种，需要人去学，学好了回来推广。”\n\n上海，一个纺织厂的青年女工站在宣传栏前看了很久，直到旁边的工友推了推她的肩膀，她才回过神来，说：“我也想报名。但我每天上班十二个小时，哪有时间训练？”旁边一个已经报名的工友对她说：“厂里规定三青团员的训练时间计入工时，不算请假。”她听完后沉默了一会儿，然后用力点了点头，转身朝报名点走去。\n\n南京，一个前红军士兵递上报名表时，右臂的旧伤疤从卷起的袖口下露出来。负责登记的青年学生看着那个疤痕，问他是怎么伤的。他平静地说是子弹贯穿伤，在过雪山时留下的，那次截肢的战友太多了，他只是擦伤。学生沉默了很久，然后站起来给他敬了一个不标准的礼。"
  roc.225.a: "三青团是党的预备队，审查不可松懈。"

  roc.226.title: "三青团·训练"
  roc.226.desc: "三青团训练营设在南京郊外紫金山脚下。营地是由旧军营改建的，靠山面水，每天清晨出操时能看见紫金山上的雾气缓缓升起。训练内容包括政治课、劳动课和军事课，每个科目都有严格的考核标准。\n\n政治课的教材是千代桃组织编写的《三青团政治教育大纲》，内容涵盖马克思主义基本原理、中国革命史、苏维埃宪法解读和当前五年计划的建设成就。大纲的附录里还收录了毛润芝在川北时期写的《农村调查报告》节选，作为基层调研的范文。千代桃在教务会上说：“这本教材不是用来背的，是用来讨论的。每一课后面都有讨论题，要求学员结合自身经历发言。”\n\n劳动课由各行业的劳动模范轮流授课。来自合作社的农民代表教青年们分辨良种和劣种，把两种稻种分别撒在两个水盆里，指着那个漂浮率高的盆子说：“这一盆出芽率不到六成，种下去白费肥料。”来自纺织厂的女工师傅教他们接线头、换梭子、检查布面，把机器转速调到最低，手把手地纠正每一个学员的指法。\n\n军事课由国防军抽调教官负责，内容包括队列训练、射击基础、地图识别和战地急救。蒋巾帼亲自参与了训练大纲的审定。她看了原稿后让参谋在战术科目中增加了物资运输和伤员转运两个项目，又加注了一行字：“训练不以培养士兵为目的，以培养组织纪律性和集体主义精神为目的。”\n\n戴安澜有一次来巡视训练营。她站在靶场边看了一会儿新学员的射击训练，然后对一个正在教瞄准的年轻教官说：“你刚才教握枪姿势的时候，只讲了托枪要稳、贴腮要正，没有讲枪口不能对人——哪怕空枪也不能对人。那是安全底线，不是技术要领。安全要放在技术前面讲。”教官立正，重新讲了一遍，把安全守则加在了最前面。"
  roc.226.a: "姑娘们，你们是中国的未来。"

  roc.227.title: "主席到来"
  roc.227.desc: "蒋巾帼兑现了她的承诺。她不只是挂名团长，她亲自来训练营讲课、劳动、和学员一起训练。\n\n她讲课的内容是她母亲的失败。她用一种学员们没有预料到的方式讲述这段历史。她没有说“我母亲是反动派”，也没有说“我母亲是英雄”。她说的是事实，那些她从小就目睹、后来在莫斯科反复回想、在中山陵前无数次独自徘徊后想清楚的事实。\n\n“蒋介石的失败，不是因为她的军队不够多。她的军队装备比我们好，训练比我们强，人数比我们多。但她失败了。她失败，是因为她的党和人民之间，隔着一层厚厚的官僚。她的党员只对上负责，不对下负责。你们将来都会成为干部，记住我这句话——你们是人民的公仆，不是人民的主人。谁忘了这句话，谁就会重复我母亲的错误。”\n\n劳动课上，她和学员们一起在地里干活。她弯下腰，镰刀在她手里握得很稳。那是她少年时在溪口老家跟佃户家的孩子一起下田练出来的，后来在莫斯科的集体农庄里又强化了几年。一个从城里来的学生兵割了半天才割了一小把，手上已经磨出了水泡，低头一看掌心破了皮，疼得龇牙咧嘴。蒋巾帼走过去，没有批评她，只是把她的手翻过来看了看，说：“血泡破了好。破了以后会长新肉。新肉比旧肉厚。”她把自己用的旧手套摘下来，放在那个学生兵的田垄边上。那双手套磨得发亮，指腹处已经薄得透光。\n\n结业典礼那天，蒋巾帼站在队列前，一个一个给学员颁发结业证书。队伍很长，但她没有表现出丝毫的不耐烦。她把每一份证书都先看一眼名字，然后双手递出，看着对方的眼睛。发到最后一个人时，她的手已经有些酸了，但她依然把证书先看了一眼名字，然后双手递出，说：“你叫什么名字？”那个学员挺起胸膛：“报告蒋主席，我叫陈志远！来自苏北农机站！”\n\n蒋巾帼微微颔首，把证书递到他手中。“你的名字我记住了。回去以后，把在这里学到的东西教给没来的人。”陈志远接过证书，眼眶红了。后来他在回忆中写道，那是他第一次觉得“蒋主席”三个字不是报纸上的铅字，而是一个真实站在他面前、记得他名字的人。他离开营地后回到苏北，把训练营的笔记重新誊写了一遍，用牛皮纸包好，在封面上写下了自己的入团日期和结业编号。"
  roc.227.a: "蒋主席万岁！"

  roc.228.title: "三青团·发展"
  roc.228.desc: "三青团在全国发展迅速，团员人数在短短一年多的时间里从零增长到数十万。这些年轻人分布在工厂、农村、学校和军营，逐渐成为苏维埃政权最活跃的细胞。\n\n蒋巾帼的形象也随之发生变化。她不再只是“苏维埃政权的主席”“五年计划的推动者”“蒋介石的女儿”。在青年群体中，她逐渐被塑造成另一种形象——一个愿意亲自下地割稻、亲自授课、亲自给学员颁发证书的领袖。她收到各地青年寄来的信件，有人向她汇报学习心得，有人向她倾诉入团后的成长，有人在信中称呼她为“我们的团长”。\n\n有一封来自湖南的信，写信的是一个刚入团的农村青年，信尾说：“蒋主席，我爸以前是老蒋的兵，她总说旧军队不把兵当人。我入团后第一个月学了政治课，回去跟我爸说，老蒋的兵是替地主打仗，我们三青团是替穷人做事。她不信，下个月农忙假，我回来带了一本《政治教育大纲》，上面印着您的话：‘谁忘了人民是主人，谁就不是三青团员。’我爸不识字，让我念，我念完她闷了很久，然后说：‘老蒋要有这个觉悟，当年就不至于败了。’”蒋巾帼看完这封信后沉默了一阵，然后把信放进抽屉。抽屉里已经积了很多类似来信，她从不对外展示，但每一封都留着。\n\n庄方宜以全国青年代表统计年报为切口，在三青团成立后的年度数据汇编中嵌入了她的结构性观察。她将团员人数按省、性别、文化程度和入团后去向做了细致的交叉统计，然后据此写了一份附呈意见。她在报告中提到：青年们积极响应号召前往南京，“南京接待能力的上限与青年抵达的峰值将在后续统计中呈现”，而她的核心建议是——各省市应尽快建立分训基地，形成阶梯式培训体系，建成后可实现“培训本地化、选拔全国化”，以缓解南京的集中接待压力，同时扩大培训覆盖面。她在报告最后一页备注栏里又补了一句：“蒋主席亲自颁发证书对团员的激励效应显著，建议省级分训基地结业典礼时由团省委书记主持、省苏维埃主席颁发证书。”\n\n蒋巾帼批阅后，在批复栏里用红铅笔划了一道线，写上“同意。分步实施。先试点三省。”然后她翻开庄方宜统计年报的封面，在扉页上又加了一行字——“你算的是数字，我算的是人。数字不能错，人更不能。”"
  roc.228.a: "局势大好"

  roc.229.title: "红旗之下"
  roc.229.desc: "蒋巾帼站在苏维埃广场的主席台上。台下是来自全国各地、各行业的代表。她的站姿仍然笔直。秋阳照在她的脸上，映出岁月刻下的深深纹路。\n\n她俯瞰着眼前的一切——工人、农民、军人、干部、学生，每一张面孔都是这个新政权的基石。多年前她在莫斯科中山大学的宿舍里回答一个同学的问题，说她母亲是一个革命者，也是一个杀过人的人。她不知道哪个更多。她在第一个五年计划完成的那个夜晚给出了答案。此刻，站在这片已经永远改变了面貌的土地上，她知道那个答案可以再改一次。\n\n“中华苏维埃民国成立已经整整一代人了。一代人有多长？在座的许多人都是在建国前后出生的，今天你们已经成为各行各业的骨干。你们的父辈举起了革命的火把，你们这一代人建起了工厂、开垦了农田、铺成了铁路、创造了今天的一切。”\n\n她的目光缓缓扫过全场，看到前排的庄方宜、西瓜、陈芸、千代桃、戴安澜、邓子恢、毛润芝，还有从各地赶来的工人代表、农民代表和青年代表。\n\n“革命不是请客吃饭。革命成功了，也不是坐下来享福。一代人有一代人的使命。你们的父辈完成了第一个五年计划，你们的任务，是完成下一个、再下一个。你们的父辈铺完了全国的铁路网，你们的任务，是让每一趟列车都准时到达。你们的父辈让每一个孩子都能上学，你们的任务，是让他们学得更好。我们走了很远很远的路，但这不意味着我们可以停下来。”\n\n他把讲稿合上，沉默了几秒，然后用更慢、更稳的语调开口：“我这一生做过很多选择。有的对，有的错。但我从来、从来没有后悔过一件事——我相信了人民。人民选择了革命，革命选择了人民。这是一个普通的真理，但它被无数次实践证明了。今天，站在这里，站在红旗之下，站在无数先烈的英灵面前，我可以无愧地说——中华苏维埃之梦想，终于实现。不是某一个人的梦想，是千千万万劳动者共同的梦想。不是高高在上的梦想，是印在每一粒粮食里、锻在每一块钢铁里、铺在每一根枕木下的梦想。”\n\n他把讲稿放在一边，双手撑着讲台，望着台下无边无际的人海和旗帜的海洋，说出了最后一句话。"
  roc.229.a: "“全世界无产者，联合起来！中华苏维埃民国万岁！”"
  roc.229.tt: "§L广场上响起山呼海啸般的欢呼声。红旗在风中猎猎作响，阳光照在每一张仰望的脸上。那一瞬间，革命的火光从井冈山的茅屋、从川北的窑洞、从延安的土坡、从苏北的农舍、从东北的林海雪原，一路燃烧到今天。火光映在蒋巾帼苍老的脸上，也映在台下无数年轻的眼睛里。\n\n§R那些眼睛里有火花。火花会传下去。§!§!"

  roc.230.title: "土地战争（一）"
  roc.230.desc: "根生蹲在田埂上，看着那辆吉普车卷着黄土开进村里。他活了四十年，没见过汽车。村里人也没见过。孩子们追着车跑，扬起一路灰。吉普车停在打谷场中央，从车上下来三个人，都穿着灰布制服，腰间扎着皮带，手里拎着公文包。领头的是个戴眼镜的年轻人，看起来不到三十岁，脸很白，不像种过地的。他站上打谷场边那块碾盘，拍了拍手上的灰，开口说话。声音不大，但很硬。\n\n“乡亲们，我们是县里派下来的土改工作队。我叫周剑，剑是刀剑的剑。”\n\n根生蹲在人群后面，手揣在袖筒里。他看了看周围，村里人都在，眼神躲躲闪闪的，没人敢吭声。站在最前面的是陈老爷——陈家大院的主人，村里的首富，也是村里大部分土地的东家。他穿着长衫，手里拄着拐杖，脸色铁青。\n\n周剑没有看陈老爷。他从公文包里抽出一张纸，展开，开始念。纸上写着《土地改革法实施令》，密密麻麻的字。根生听不太懂那些“前款”“但书”，但他听懂了最后一句——“立即没收本村地主所有土地，分配给无地少地的农民。”周剑念完，把纸叠好放回公文包。碾盘下的人群骚动起来，像一锅水突然烧开了。陈老爷的拐杖重重顿在地上，他指着周剑质问凭什么没收他的地，说这地是陈家几代人一亩一亩攒下来的。\n\n周剑转过身，看着他。他没有提高声音，但每一个字都清清楚楚：“凭你剥削了农民几辈子。凭你的佃户到现在吃不饱饭。”\n\n根生蹲在田埂上，一动不动。他想起去年冬天，他娘饿得躺在床上起不来，他去陈家大院借米。陈老爷说，借一斗还三斗，利滚利，还不清就用那块坡地抵。根生没借，他娘半个月后死了。他现在还蹲在田埂上，手指掐着裤腿的布。那块坡地还在陈老爷名下。\n\n周剑在打谷场上支起了一张桌子，桌上一盏煤油灯，一沓表格，一盒印泥。表格上要填的项目密密麻麻：每户的土地面积、位置、肥力等级，每户的人口数、劳动力数、租佃关系。他把表格摊开，说：“从现在起，每家每户来登记。原来种多少地，交多少租，如实填。填好了，政府给你们做主。”没有人动。陈老爷站在人群最前面，冷笑了一声：“我看谁敢填。”沉默了很久。煤油灯的火苗被风吹得晃了晃，周剑扶了一下眼镜。然后根生站起来，走到桌前，拿起笔。他不会写字，他用拇指蘸了印泥，在表格上按下一个红手印。"
  roc.230.a: "结果很显然。"

  roc.231.title: "土地战争（二）"
  roc.231.desc: "周剑睡在打谷场边上的破庙里。庙里只有一张草席，一盏油灯，墙上贴着一张大幅的《土地改革法实施令》，旁边还有一张他自己用毛笔写的简易示意图，把法律条文翻译成农民能听懂的大白话。根生来给他送开水时，见他在灯下看一份土地清册，眉头拧得很紧，笔在纸上比了又比，像是在核算什么。\n\n“你识字？”根生问。\n\n“识字。”周剑抬起头，把笔放下，“你的手印我看到了。村里第一份登记表就是你按的。你不怕陈老爷报复？”\n\n根生把水壶放在桌上，沉默了一会儿，然后很慢地说：“他把我娘饿死了。报复还能比这更狠？”\n\n两人同时沉默了一会儿。周剑从公文包里拿出一个本子，翻开，上面密密麻麻记满了这个村的情况：人口、土地面积、陈家的田产明细、佃户名单。他问根生：“你们村最穷的人是谁？”根生说是王跛子。周剑又问叫什么名字，根生说大家就叫他王跛子，腿瘸了，地种不了，靠给人帮工换口饭吃。周剑点点头，记下。又问：“第二穷呢？”根生想了想：“刘寡妇。”\n\n周剑低下头，继续写。油灯把他的影子投在破庙的墙上，那面墙上的简易示意图被风吹着，边角微微掀起。根生看着他写了一会儿，问：“你们工作组，真的能把地分给我们？”周剑没有抬头。他说："
  roc.231.a: "“不是分给你。是把陈老爷拿走的那份还给你。”"

  roc.232.title: "土地战争（三）"
  roc.232.desc: "陈家大院燃了火把。院子里站满了人，黑压压一片。有人在哭，有人在骂，有人低着头不说话。周剑让人把陈家大院的账本抬出来，堆在院子中央。那些账本真多，摞起来有半人高，牛皮纸封面上写着“陈氏田产清册”，内页密密麻麻全是账目。周剑拿起一本，翻开。\n\n“乡亲们，这些账本，记的是你们祖祖辈辈欠陈家的债。一笔一笔，利滚利，还了几辈子还不清。今天，我们要当着你们的面，把这些账本全部烧掉。”\n\n他划了一根火柴。火舌舔上账本的边缘，迅速蔓延开来。那些黄纸在火光中卷曲、变黑、化成灰烬，火星被夜风吹得飞上了屋檐，像一群萤火虫。陈老爷站在院门口，被两个民兵架着，看着那些账本在火光中化为灰烬。他没有说话。根生站在人群里，看着那些烧掉的纸，想起他娘临死前的那天晚上，她躺在床上，干瘦的手抓着他的手腕，说不要去找陈老爷，借了还不起，还不起要卖地，卖了她死了都没地方埋。她现在埋在坡地上，那块坡地在登记册上还是陈老爷的名字。但明天，那块坡地就会改成他的名字。\n\n分地大会在打谷场上举行。周剑把登记表全部核对完，当众宣布每一户分到的地块。轮到谁，周剑就念出谁的名字和地块位置，然后问一句：“记清了没有？”分到地的农民多半怔怔地站在那儿，有人捧着地契蹲在田埂上，把脸埋进手里；有人拿起地契对着太阳看，印泥在手心里还没干透，一握拳就印在掌纹上。王跛子分到了陈家东边那块水田，他一瘸一拐地走到自己的地里，蹲下来，用手抓了一把土，放在鼻子下面闻。那土刚翻过，还带着露水的潮气。他把土放进口袋里，说了一句：“这土，甜。”\n\n根生分到了坡地上那三亩旱地。那是他祖上开垦的，后来被陈家收走，他爹为了赎回这块地累死在田里。现在他拿到了地契。他站在那块坡地上，风吹着他的脸。他想起他娘，想起他爹，想起去年冬天他蹲在陈家大院门口，不敢敲门。那些事像风一样吹过去。他把地契揣进怀里，用手按了按胸口的位置。纸硌着肋骨，有点硬，但很踏实。"
  roc.232.a: "耕者有其田"

  roc.233.title: "集体农庄（一）"
  roc.233.desc: "周剑在分地结束后把村里几个积极分子叫到破庙里，根生是第一个。桌上摊着一张新表格，标题是“集体农庄筹建申请表”。根生问什么是集体农庄。\n\n“把分到的地合起来，大家一起种。牛一起用，犁一起用，收成按劳力和土地份额分。政府会派技术员来教改良种，供销社负责统一收购。”\n\n有人说那就是以前的大锅饭，周剑把表格压在手下，对那人说：“以前是你给地主干活，地主拿走大半。现在是你给自己干活，只不过不是一个人干——是一起干。”根生听完，想了很久。他想起去年春天犁那三亩坡地，没有牛，自己拉犁，肩膀被麻绳勒出一道红印，疼了大半年。他站起来，说：“我入。我一个人拉不动犁。要是有几头牛一起拉，犁就能推得快些。”"
  roc.233.a: "集体化才是社会主义。"

  roc.234.title: "离别"
  roc.234.desc: "第一个春天过后，根生和另外几户人家一起把坡上的旱地整平，把田埂推掉，把地界石挖出来。地界石是陈家埋的，上面刻着“陈”字，根生挖出它时发现埋得很深，往下刨了将近一尺才碰到石头。他把石头抱到打谷场上，周剑让人用铁锤把“陈”字砸掉，用新刻的“公”字钢模凿在上面。那天围了好多人看，有人拍着根生的肩膀说：“你胆子真大。”根生说：“不是我胆子大。是工作组在这儿。”\n\n周剑离开村子那天，全村人都来送。他瘦了不少，眼镜腿断了用线绑着，灰布制服洗得发白。他站在吉普车旁边，对根生说：“地是你们的了。农庄也是你们的了。工作组可以走，集体农庄要你们自己管下去。”根生问他还会不会回来，他说可能要调去别的县，那里的土改还没开始。\n\n根生从怀里掏出一个布包，打开，里面是一把新收的稻穗。他说这是坡地上今年收的，改良种，比去年多了不少。周剑接过稻穗，用手捻了捻穗子，放进公文包里，说了句：“这个，我带回去。给上面看——这就是你们的成绩。”\n\n吉普车卷着黄土开走了。根生蹲在田埂上，看着车影越来越小，最后消失在土路的尽头。他想起周剑刚到村里的那天，吉普车也是这样卷着黄土开进来。那时候他蹲在田埂上，手揣在袖筒里，什么也不敢想。现在他手里捏着地契，脚下的地是他的，身后是集体农庄的仓库。"
  roc.234.a: "到祖国最需要的地方去。"

  roc.235.title: "集体农庄（二）"
  roc.235.desc: "仓库是旧祠堂改建的，门楣上刻着“陈氏宗祠”四个字，工作组在离开前让根生带人用新刻的石匾嵌在门楣原处，上面刻着三个字——“粮满仓”。根生没把坡地上那块刻着“陈”字的旧石头扔掉，也没把它砸碎。他把那块石头从打谷场搬回来，铺在集体农庄的晒谷场边上，字面朝下。人踩上去，看不见那个字，但石头还在。\n\n秋收过后，县里来了通知，要各村集体农庄派代表去乡里开会，汇报产量。根生作为农庄的负责人，带着账本去了。会场设在乡公所，黑板上用粉笔写着“全乡集体农庄产量评比大会”。根生坐在最后一排，把账本摊在膝上。旁边有人问他：“你们村产量多少？”他报了个数。那人说：“那你们村排不上前三。”根生说：“比去年多了不少。”那人说：“比去年多没用，得比别人多。”\n\n根生把账本合上，坐直了。他想起周剑走之前说的那句话——“地是你们的了，农庄也是你们的了。”他在本子上重新核算了一遍冬小麦的预计播种面积，然后在下面写了一行字：“今年比去年多。明年要比今年多。”他写得很用力，铅笔芯断了一次，他削好，继续写。窗外，田里的冬小麦刚播下去，还没出苗。但根生已经蹲在田埂上，看着那片褐色的泥土，风从他背后吹过来，吹得集体农庄仓库门口那面旗子哗啦啦响。他把手伸进地里，五根手指插进土里。"
  roc.235.a: "土是凉的。但春天会来。"

  roc.236.title: "招工"
  roc.236.desc: "根生站在工地门口，仰头看着那栋还没封顶的楼。楼不高，六层，但在他们村，最高的建筑是粮仓，平房，一层。他上个月还在集体农庄的田里割稻子，这个月就站在了这里，手里攥着一顶安全帽，帽檐内侧用粉笔写着他的名字——他怕工友们拿错。招工的人去乡里时，在打谷场边上摆了一张桌子，桌上放着一摞登记表。根生挤在人群里，听到招工的人喊：“县里建新纺织厂，要力工，管吃管住，一个月工资够买好几十斤米。”根生按了手印。他不会写自己的名字，但手印按得比别人都用力——印泥渗进了指纹的沟壑里，洗了两天才褪干净。\n\n工棚是旧仓库改的，上下铺睡了十几个人。根生睡下铺，上铺是个比他小几岁的年轻人，叫阿贵，从隔壁乡来的。阿贵念过小学，能看懂报纸。晚上工友们围着唯一的灯泡打牌、抽烟、聊老家的事，阿贵坐在床上，把报纸凑近灯下，念一段给他们听。报纸上写，政府鼓励农村劳动力向城镇转移，支持县乡发展村镇工业，未来要实现“村村通路、镇镇有厂”。阿贵念完，旁边一个工友从牌桌上抬起头说他老家那条路还是泥巴路，下雨天连拖拉机都进不去，修了几年也没修好。\n\n根生把手里的烟头摁灭在床沿的铁皮上，问阿贵：“报纸上说的这些，是真的还是哄人的？”阿贵把报纸叠好压在枕头底下，翻了身说，“写的是真的。修不修得动，看人。”过了一会儿，他从枕头底下又摸出那张报纸，指着左下角一块豆腐干大小的公告说，“你看这个——县里要在咱们镇试点并村，把几个小村并成一个中心镇，腾出来的地建厂。还招工，优先收本地人。”"
  roc.236.a: "农民是落后的，必须向工人转化。"

  roc.237.title: "并村成镇"
  roc.237.desc: "并村的消息传到根生老家，是在他进城后的第二个月。他娘托人写了封信，信里说乡里来人开了会，要把他们村和隔壁两个村并成一个镇，叫“新丰镇”，村民集中搬迁到镇上统一盖的新村里，住排房。原来的宅基地腾出来，平整后划给新办的砖瓦厂和编织袋加工厂。村干部在打谷场上挨家挨户做工作，说镇上有卫生院、供销社和中心小学，孩子们以后不用再走很远山路去上学。\n\n根生的娘在信的末尾写了一句：“你爹的坟还在坡上，政府说坟地不搬。你回来看看。”根生把信叠好放进枕头底下，躺了很久。他想起他爹的坟——那块坡地当年是他爹一锄一锄开出来的，后来被陈老爷收走，再后来土改分回来，再后来并入了集体农庄。现在坡地还在，坟也在，但村子要没了。根生第二天去找工头请假，说要回乡看看。工头说工期紧，只给了三天假，扣工钱。根生说，扣就扣。他坐了很长时间的长途班车，又走了很长一段山路。到村口时，村口那棵老槐树还在，但树干上贴着一张新公告，写着“新丰镇建设规划图”。图上画着一排排整齐的排房、一个带篮球场的学校、一座两层楼的卫生院，还有两片用红线标出的工业用地。根生站在图前看了很久，然后转身往坡地上走。\n\n他爹的坟还在，坟头的草被清理过——大概是工作组来过了，用石灰在坟圈周围划了保护线，旁边钉着一块小木牌，上写“保护范围，施工避让”。他蹲下来，把路上买的一包烟拆开，点了一支，放在坟前。然后他对着墓碑说了一句话。他爹叫根柱，当年为了赎回那块坡地活活累死在田里，土改分地那天他跪在这坡地上哭，分到地契时他把地契按在胸口。根生到现在还记得他爹当时说这地姓陈姓了几辈子，终于姓自家了。现在村子要并入新丰镇，宅基地要腾退，但坡地和坟都留着。“我也去镇上。我在工地挣钱。等镇上的工厂建好了，我就不用去县里打工了。你放心。根还在这里。”"
  roc.237.a: "集中力量才能办大事"

  roc.238.title: "乡镇企业"
  roc.238.desc: "新丰镇的规划图上标着两片工业用地。根生回工地前特地去看了那块地。地还在平整，推土机推倒了原来田埂上的分界石，把几块旱地合并成大片地基。路边搭着一排临时帐篷，里面住着从省城来的勘测队员，正对着图纸用红蓝铅笔标注地下管线。根生走过去，看见一个戴眼镜的年轻人蹲在地上，正往一本厚厚的笔记本上抄数据。年轻人自我介绍姓林，是省里派下来的技术员，负责设计镇上的供水管网。他说规划中的砖瓦厂和编织袋加工厂需要稳定的工业用水，得从山上引一条主管下来，还要在镇北修一座小水塔。根生问这些厂子什么时候能建起来，小林说砖瓦厂大约半年，编织袋厂更慢些，设备还没到。小林问他是哪个村的，他说就是被并掉的那个村。小林沉默了一会儿说：“你家的宅基地，将来就在这条水管下面——不是水管，是水管前面那片排房。第一排，靠路边，进出方便。”根生看了看那片地，没说话。后来他从怀里掏出他娘托人写的信，翻到背面，让小林帮他写几个字。他说，写“新丰镇第一排”。又问小林能不能再画一个箭头，指向水管的位置，旁边再写上“水塔”。小林接过去，用铅笔在信纸背面画了一幅简图——一条路，一排房，一个箭头指向水塔。根生把图纸折好放回怀里，说这是他以后的房子，门前有水管，镇上有工厂。\n\n砖瓦厂投产那天，根生站在厂门口，看着第一车红砖从窑里拉出来。那些砖是他和工友们一块一块码进窑里的，每一块都经了他们的手，码放时按技术员的要求留了空隙，让窑火能均匀烧透。厂长请镇上的领导来剪彩，根生站在人群后面，阿贵递给他一瓶汽水，说这厂也有他的一份功劳。根生接过汽水，说从前烧砖是为了给陈老爷盖祠堂，现在烧砖是为了盖自己家的房子。他娘已经搬进了镇上的排房，第一排，靠路边。家门口埋着那根小林设计的水管，水龙头拧开就有自来水，不用再去井里挑了。\n\n阿贵问他什么时候搬进去。根生说等砖瓦厂这批砖再便宜些就买。他已经看过了定价，按政府补贴后的社员内部价，再攒几个月的工资就够了。他问阿贵房子打算怎么盖，阿贵说想用编织袋加工厂的新料把屋顶加固一层，再给老家那个还没搬来的妹子留一间朝南的。根生点了点头，又喝了一口汽水。不远处推土机还在平整新的地基——那是规划图上另一片工业用地，旁边钉着一块新牌子，上面写着“预留厂区·招租中”。根生把空汽水瓶放在地上，重新戴好安全帽。新厂房的第一根桩已经打了下去，吊车的钢索在风里轻轻摆动。他蹲在自己的新地基旁边，把手按在新浇的混凝土墙角上，水泥还没干透，留下一个浅浅的手印。那只手以前只会捏稻穗、搬砖头、拉犁绳，现在它按在了自己的墙上。"
  roc.238.a: "每一个小集体都是一个有机体。"

  roc.239.title: "国家计划委员会"
  roc.239.desc: "“我宣布，中华苏维埃民国国家计划委员会正式成立。”蒋巾帼放下钢笔，环顾会议室。窗外，南京的梧桐叶正纷纷扬扬地落下来，秋风穿过半开的窗扇，吹动了桌上那份刚刚签署的任命文件。文件的第一页上，庄方宜的名字排在第一行。\n\n庄方宜从会议桌的末席站起来。她今天仍然穿着那件洗得发白的灰布工装，袖口磨得起了毛边，但每一个扣子都扣得严严实实。她走到挂在墙上的全国地图前，用一根细木棍指着地图上标注的红色圆点——每一个圆点代表一个计划中的重工业项目，从东北的钢铁基地到长江沿岸的机械制造走廊，从西北的油田到东南的电力枢纽。 “我们今天坐在这里，是为中国的工业化画第一张蓝图。这张蓝图不是画在纸上的，是画在这片土地上的。每一个红点代表一个项目，每一个项目都有工期、预算和责任人。我的工作要求只有一条：每一个数字都必须是真的。”\n\n蒋巾帼微微颔首。“计划委员会不是橡皮图章，不是行政机关的附庸。它是整个苏维埃政权的大脑。从今天起，所有涉及国计民生的重大经济决策——钢铁、煤炭、石油、电力、铁路、粮食——都必须经过计划委员会的审议。不是建议，是必须。这不是某一个人的意志，这是苏维埃政权的意志。我们需要一个五年计划。”\n\n会议室里响起了轻微的骚动。坐在靠窗位置的西瓜把烟斗从嘴边移开，微微前倾。坐在另一侧的陈芸翻开账本，用指尖一行行核对着上一年度的财政收支数据。\n\n“五年计划，这个词在座有人比我更熟悉。”蒋巾帼看向坐在角落里的一位中年军官，对方微微点了点头——那是吉田优，共产国际派来的顾问。“苏联在二十年代末完成了第一个五年计划，重工业产值增长了数倍。我们用二十多年打完了仗，现在要用五个五年来追上别人用两百年走完的路。我们能不能做到？苏联人能做到的，我们做不到？我不信。”"
  roc.239.a: "中国人能飞。"

  roc.240.title: "五年计划（一）"
  roc.240.desc: "庄方宜再次站起来，将一份薄薄的文件放在桌上。文件不到十页，封面上印着《第一个五年计划草案编制大纲》，每个字都透着她一贯的作风——简洁、精确、没有一句废话。\n\n“在正式起草之前，我需要各位配合以下几项工作。第一，全国工农业生产能力普查。每一座高炉、每一台机床、每一处矿井，都要登记在册。我们不知道自己有多少家底，就无从计划。第二，省级计划委员会的筹建。中央的计划再精确，也需要地方来执行。我要求各省在两个月内完成筹建，主要负责人由计委直接考核任命。第三，计划不是由计委一个部门来写。我要求重工业部、轻工业部、农业部、铁道部、财政部在两周内提交本部门的五年规划草案。不求完美，但求真实。”\n\n她翻到最后一页，上面是一张空白表格，只有最上方印着一行字——“项目名称、建设周期、所需投资、预期产能”。\n\n“这份表格发到各部门，每一栏都要填。填不出来，就空着。空着的地方我会标注‘数据缺失’。数据缺失不可耻，可耻的是瞎填。”"
  roc.240.a: "西瓜同志似乎有话说"

  roc.241.title: "五年计划（二）"
  roc.241.desc: "西瓜站起来，从公文包里取出一张手绘的中国地图。地图上用粗红线标出了几条尚未修建的铁路干线，每一条红线旁边都用俄文和中文两种文字标注着里程、预算和预计施工周期。她把地图挂在墙上，用烟斗指了指最粗的那条红线。\n\n“同志们，五年计划的重工业项目需要运输。一座年产几百万吨的钢铁厂，每天需要上万吨铁矿石和煤炭。这些原料不能用人背，不能用驴驮，必须用火车。我的建议是：第一条，陇海铁路西延段，连接西北油田和东部港口；第二条，粤汉铁路复线，打通长江以南的南北交通；第三条，东北铁路网改造，把苏联轨距改成标准轨距，确保战时物资能从东北直达南京。如果没有这些铁路，五年计划就是纸上的五年计划。铁轨铺到哪里，计划才能走到哪里。请计委把铁路建设列为第一个五年计划的优先项目。”\n\n西瓜把烟斗放在桌上，坐回位置。她坐下时椅子发出咯吱一声响，庄方宜低头在笔记上记了一笔——“第43页附录：优先项目论证。发言人：西瓜。附铁路规划图。”"
  roc.241.a: "陈芸同志似乎有话说"

  roc.242.title: "五年计划（三）"
  roc.242.desc: "陈芸没有站起来。她只是把面前的账本翻开到某一页，用指尖点着上面的数字，声音平静得像在念一份购物清单。\n\n“我管了多年账。革命不是只算政治账，更要算经济账。第一个五年计划的建设资金从哪里来？三个渠道。第一，农业积累。通过粮食征购和合作社积累的资金，这是大头。预计占全部投资的半数以上。第二，工商业税收。随着城市工商业逐步恢复，这部分会逐年增长。第三，外援和贷款。苏联的援助、海外华侨的汇款、以及我们即将发行的建设公债。但外援不可靠，公债要还利息。最稳妥的还是我们自己手里的钱。所以我的建议是：优先投资能快速产生效益的项目。钢铁厂、煤矿、油田——这些项目建成后可以在几年内回收成本，然后用回收的资金投入下一批项目。五年计划的投资顺序不能按政治需要来排，要按经济规律来排。谁先回本，谁先上马。”\n\n蒋巾帼听完，在笔记本上记了一行字——“投资顺序：回本优先。”"
  roc.242.a: "吉田优同志似乎有话说"

  roc.243.title: "五年计划（四）"
  roc.243.desc: "吉田优站起来，从公文包里取出一本已经翻阅得起了毛边的俄文小册子，封面上的烫金字样已经有些模糊。她说：“苏联在制定第一个五年计划时，犯过一些错误。指标定得太高，农业集体化推进太快，导致几年间发生了严重的饥荒。这些错误，中国同志可以避免。”她把小册子翻到某一页，上面是密密麻麻的俄文表格，每一栏都用红蓝铅笔做了标注，“五年计划应当分为两个阶段。前两年为打基础阶段，重点是建设重工业项目，同时进行全国范围的资源勘探和人才培养；后三年为加速发展阶段，在前两年积累的基础上集中力量完成关键项目，实现工业产值的飞跃。我建议在计划中写入‘两步走’原则——先勘测，后动工；先试点，后推广。不要把所有项目都压在第一年开工。机器可以加班，人不能加班到死。”\n\n庄方宜在笔记上写道：“采纳‘两步走’建议。前两年为奠基期，后三年为加速期。各项目按此原则重新排定工期。”"
  roc.243.a: "散会"

  roc.244.title: "五年计划（五）"
  roc.244.desc: "深夜，计划委员会的临时办公楼里灯火通明。庄方宜坐在桌前，面前堆着各部门送来的规划草案，每一份都被她用红笔标注得密密麻麻。西瓜坐在角落里，抽着烟斗，对着一张铁路规划图反复核算里程数据，手指在图纸上缓慢移动，每核对完一段就在旁边画一个小小的圆圈。陈芸的账本摊了满桌，她的指尖在算盘上飞掠，噼啪声细密如雨，笔记本上的数字正一行一行往下延伸。窗外偶尔传来更夫的梆子声和远处江面的汽笛，除此以外只有钢笔划过纸页的沙沙声和算盘珠碰撞的脆响。\n\n蒋巾帼推门进来时，庄方宜正在校订草案的最后一章。她抬起头，把草案递给她。“草案共多少章，多少节，预计投资总额是多少亿元，其中重工业占比约多少，轻工业和农业各占多少。各项数据都经过至少两次交叉核对。我建议命名为《中华苏维埃民国第一个五年计划草案（征求意见稿）》。”\n\n蒋巾帼接过草案，从头到尾翻看了一遍。她翻得很慢，每一页都仔细看过，然后在封面上签下自己的名字，又在名字下面写了一行字——“此草案须提交苏维埃代表大会审议，经讨论和修改后方可成为正式计划。各项指标既要有雄心，又要留有余地。社会主义的优越性不体现在数字上，体现在每一个劳动者的生活改善上。”她把草案递还给庄方宜，说：“你辛苦了。但真正辛苦的事，现在才开始。”庄方宜没有回答。她把草案放在桌上，拿起笔继续校正下一章。天亮之前，她还有一整章要改完。\n\n蒋巾帼在中央执行委员会上发言，语气平静而坚定：“我们常说干部是人民的公仆。公仆不是坐在办公室里喝茶看报的，公仆是弯下腰去干活的。从今天起，各级苏维埃干部每年必须参加生产劳动。不是一个月，不是半个月，是每年至少参加一段时间的生产劳动。下田、进车间、上工地，干什么都行。但是必须去，必须真干，不是做样子，不是拍照片。”"
  roc.244.a: "开工！"

  roc.245.title: "干部参加劳动教育"
  roc.245.desc: "毛润芝端着那只搪瓷茶缸，微微点头。邓子恢在笔记本上飞快地记着，笔尖划过纸面，发出沙沙的声响。\n\n“工人也要参与管理。工厂不是厂长的私产，工厂是全体工人的。工人不仅要干活，还要管工厂。怎么管？不是人人当厂长——是在生产计划、技术革新、工资分配、劳保福利这些事上，工人要说了算。我提议在各级苏维埃设立工农监察委员会，工人农民直接监督政府。同时，在工厂推行‘两参一改三结合’制度——干部参加劳动，工人参加管理，改革不合理的规章制度，领导干部、技术人员和工人群众三结合。”\n\n苏北某县的苏维埃主席老赵，天不亮就起来，换上一身旧军装改的工装，扛着锄头出了门。今天是他每年参加生产劳动的日子。他的秘书跟在后面，手里拿着笔记本，想记点什么，被老赵回头瞪了一眼：“你跟着我干什么？我今天是去锄地，不是去开会。你把本子放下，也去拿把锄头。”秘书愣住，只好把本子放下，从农具房里也找了一把锄头。\n\n田里，老赵已经和几个农民一起弯着腰锄草。他的锄头使得不太顺手，动作比别人慢半拍，但他没吭声，只是低着头，一锄一锄地往前锄。汗从他额头上滴下来，落在干裂的田土里，瞬间就渗了下去。一个老农蹲在田埂上看了一会儿，递给他一碗水，说：“赵主席，你这锄头把子，握得太紧了。握太紧，手会起泡。放松一点，让锄头自己往下落。”老赵接过水，喝了一口，用手背擦擦汗，说：“我这手，握了多年笔杆子，不会握锄头了。你教教我。”老农跳下田埂，用自己的锄头给他示范了一遍。老赵依样画葫芦，锄了两行，果然顺手许多。老农又看了看他的手，说你手心已经红了，再锄下去要起泡，让他歇一会儿。老赵说再锄两行，今天得把这块地锄完。\n\n田埂上围了好些人，有老农，有妇女，有孩子。有个年轻后生低声问旁边人：“那个不是县里的赵主席吗？”旁边人还没答话，另一个蹲在田埂上的老汉哼了一声说：“不像。主席哪有下地的。”然后他眯起眼仔细看了看弯腰锄草的老赵，看清了他灰白的两鬓和那件旧军装改的工装，慢慢把烟杆从嘴边拿下来，不说话了。过了许久，老赵锄到了地头，直起腰，汗水从额角淌下来，滴在新锄过的土上。他把锄头拄在手里，对送水的老农说：“大叔，歇晌了。你这块地，草锄得差不多了。”"
  roc.245.a: "脚下沾满泥点子，才能想出金点子。"

  roc.246.title: "工农监察委员会"
  roc.246.desc: "上海某国营纺织厂的车间里，墙上的黑板报新换了一期，标题用彩色粉笔描了粗体——“工人管理委员会今日成立”。工人们推选出来的代表坐在厂部会议室的长桌前，和生产科长、技术科长面对面讨论下一季度的生产计划。厂长的位置空着，在角落里旁听。\n\n一个女工代表站起来。她叫周阿妹，是细纱车间的挡车工，在纺织机前站了多年，手指被纱线磨出了厚茧。她手里拿着一个本子，上面是她和姐妹们一起记录的断头率数据。她的声音有些紧张，但一字一句都很稳：“上个月细纱断头率上升了不少，主要是前纺车间送来的粗纱条干不均。我建议重新校准前纺机台的罗拉隔距，另外挡车工的轮班时间太长，后半夜大家太累了，断头率就高。能不能把夜班缩短半个钟头？”\n\n技术科长扶了扶眼镜，翻开设备台账翻了翻，说：“罗拉隔距好办，本周末加班校准。但夜班缩短半小时涉及全厂排班表调整……”生产科长在旁边轻轻拉了他一下，意思是让他先记下来再讨论。阿妹不紧不慢地接过话头：“那就调整。工人也是人，不是零件。”技术科长低下头，在会议记录上写上——“夜班缩短半小时，提交厂务会讨论。”阿妹坐下来，旁边另一个工友拍了拍她的手背。\n\n南京某区苏维埃政府的接待室里，工农监察委员会的牌子挂在门口，油漆还没干透。负责接待的老周是个退休矿工，在井下干了大半辈子，后来因工伤调到了地面工作。他面前坐着一个老农，手里捏着一张皱巴巴的纸条。\n\n老农说，村里修水渠，乡苏维埃拨了款，但水渠修了一半就停工了。他去乡里问，乡里的人说款子用完了。他又去问包工头，包工头说只收到一半的钱。他不知道钱去哪了。\n\n老周把纸条拿过来看了看，是乡苏维埃的拨款通知，上面盖着红章。他又拿起笔，把老农说的情况一一记下，字写得很大，慢而用力，每一笔都像是刻进纸里。然后他站起来，摘下墙上的电话机，摇通了乡苏维埃。等电话那头传来声音，他对着话筒说：“我是工农监察委员会的老周。有人举报你们那边水渠款子不对。明天我去你们那儿。账本准备好。”挂掉电话后老周转过身来对老农说：“老乡，你回去等着。水渠的事，我一个星期内给你答复。你信我。我在井下挖了很多年煤，上头说给矿灯就给矿灯，说发不出工资就真的不发。后来苏维埃来了，矿工的工资再也没有欠过。所以我也信苏维埃——苏维埃说了给你答复，就一定会给你答复。”"
  roc.246.a: "管理切不可脱离实践"

  roc.247.title: "干部劳动记录"
  roc.247.desc: "庄方宜的办公桌上，多了一份新的统计表格。这份表格不是关于钢铁产量，不是关于铁路里程，是关于干部参加劳动的记录。各省苏维埃上报的数据在她面前排成一列，数字和日期密密麻麻。她逐行核对，用红笔标出缺漏之处，然后起草了一份简短的书面意见，附上汇总表呈送中央执行委员会。意见末尾，她用一如既往的简洁笔触写道：“干部参加劳动的数据已汇总。部分县级苏维埃填写不完整，已退回补报。”\n\n蒋巾帼在她的统计表上批了一行字：“此项制度应长期坚持。干部参加劳动不是一阵风，不是运动，不是做给谁看的。每年考核，缺勤必究。劳动记录纳入干部档案，作为晋升和调任的依据之一。官僚主义是社会主义的死敌，劳动是治疗官僚主义的药。药不能停。”"
  roc.247.a: "革命的伟大实践。"

  roc.248.title: "工人宪法草案"
  roc.248.desc: "上海纺织厂。布告栏前围满了人。一张红纸贴在最显眼的位置，标题用粗体字写着——“工人宪法草案，征求全体工友意见”。署名是“上海总工会工人宪法起草小组”。周阿妹站在人群里，手里还捏着刚换下来的断线梭子，梭子上缠着半截没拉完的棉纱。她仰着头一个字一个字地念，嘴唇微微翕动，念到第七条时声音忽然大起来——“工人有休息的权利。任何工厂不得强迫工人连续工作超过法定工时。”旁边有人小声嘀咕这也能写进宪法，阿妹转过头来说：“能。我们写的，我们就能。”身后，几个工友挤过来，有人从口袋里掏出笔直接在红纸上改字，有人把阿妹的话记下来，转抄到自己的建议稿里。\n\n东北矿山。巷道深处，头灯的光柱在煤壁上晃动。一个老矿工坐在煤堆上，把安全帽摘下来放在膝盖上，对着围坐一圈的工友们念一份手写的草案。他的声音沙哑，井下多年的粉尘在他的肺里留下了永久的刻痕。他念得很慢，每念完一条就停下来，让大家发表意见。念到“工人有权拒绝在危险条件下作业”时，他停了下来。矿工们沉默了很久。一个年轻矿工用袖子抹了抹脸上的煤灰，低声说这一条好。另一个老矿工想起多年前瓦斯爆炸死去的那些工友，他们下井之前没有人问过巷道里的瓦斯浓度，没有人告诉他们今天的工作面有危险。他说：“以后不会了。我们写进宪法里了。”\n\n天津码头。汽笛声从远处传来。搬运工人们蹲在货箱边，围着一张摊开的旧报纸。报纸上密密麻麻写着字，是码头工人自己拟的保障条款。一个装卸工用手点着其中一条——“工人因工受伤，雇主必须承担全部医疗费用，不得解雇。”他的左臂还吊着绷带，那是上个月卸钢材时被吊臂打伤的。老板当时说，你自己不小心，自己掏钱治。现在他把这张报纸举起来，对着工友们喊：“以后，没有人能在码头说了算——除了我们自己。”他把报纸递给旁边一个年轻工人，说：“你念给大家听。从头念。”年轻工人接过去，展开报纸，清清嗓子，一字一句地念起来。\n\n成都机械厂。车间的休息时间，工人们围在钳工台边，一个老钳工正用划针在一块废钢板上写字。他不是在画加工线，他是在刻一部宪法。钢板上刻着十六条条文，每一条都是他在机床和工作台边从日常的生产经验里总结出来的。他刻了一整夜，刻到天亮，手指被钢针划破了就用棉纱缠一下继续刻。天亮时他把钢板立在车间门口，旁边另放了一块空钢板，用粉笔在上面写着——“此乃工人宪法初稿，请各位工友斧正。”一个年轻学徒站在钢板前，把第十六条念了出来：“本条例由全体工人共同制定，由全体工人共同监督。修改权、解释权、废止权，归全体工人。”他念完回头看老钳工，老钳工说：“这是最后一条。最重要的。前面的不能大过这一条。”"
  roc.248.a: "社会主义的伟大胜利！"

  roc.249.title: "工人宪法"
  roc.249.desc: "第一条 工人是国家的主人。苏维埃政权的一切权力属于人民，工人是人民的主体。\n第二条 工人有劳动的权利。国家保障每一位有劳动能力的工人获得与其技能相匹配的工作岗位。\n第三条 工人有休息的权利。任何工厂、矿山、工地不得强迫工人连续工作超过法定工时。工人每年享有法定带薪休假。\n第四条 工人有组织工会的权利。工会代表工人参与企业管理、监督劳动条件、维护合法权益。\n第五条 工人有罢工的权利。在法律规定的范围内，工人可以通过罢工维护自身权益。\n第六条 工人有获得劳动保护的权利。雇主必须为工人提供安全、卫生的劳动环境，预防工伤事故和职业病。工人有权拒绝在危险条件下作业，且不得因此受到任何处罚。\n第七条 工人因工受伤、致残或死亡，雇主必须承担全部医疗费用和抚恤责任，不得解雇因工伤暂时丧失劳动能力的工人。\n第八条 工人有接受职业培训的权利。企业必须为工人提供必要的技术培训，培训期间工资照发。\n第九条 工人有参与企业管理的权利。在生产计划、技术革新、工资分配、劳保福利等事项上，工人代表有权参与讨论和表决。\n第十条 工人有获得公平报酬的权利。男女同工同酬。工资应当足以维持工人及其家庭的体面生活。\n第十一条 工人有言论、出版、集会、结社的自由。工人报刊受法律保护，不受审查。工人可以在工厂、矿山、工地内自由发表意见、张贴建议、出版工人报刊。任何压制工人言论的行为均为违法。\n第十二条 工人在退休后享有养老金。养老金的数额应随物价水平调整，确保退休工人的生活水平不因通货膨胀而下降。\n第十三条 青年工人享有特别保护。未满十六周岁者不得从事繁重和危险劳动。青年工人的工作时间应适当缩短，并享有接受继续教育的权利。\n第十四条 工人有权向各级工农监察委员会举报任何违反本宪法的行为。工农监察委员会应在接到举报后限期内调查处理，并向举报人公开答复。\n第十五条 本宪法由全体工人共同制定，由全体工人共同监督。修改权、解释权、废止权，归全体工人。\n第十六条 本条例自颁布之日起施行。各级苏维埃政权和一切国家机关、企业事业单位、社会团体必须遵守本条例。任何违反本条例的行为，工人有权向工农监察委员会和人民法院提起诉讼。"
  roc.249.a: "社会主义的伟大胜利！"

  roc.250.title: "春天"
  roc.250.desc: "春天。上海纺织厂的布告栏前又围满了人。红纸还贴在那里，纸边已经被风吹雨打褪了色，但字迹仍然清晰。旁边又贴了一张新纸，上面写着——“工人宪法草案修订意见征集”。下面密密麻麻写满了工人们的修改建议，有的字迹工整，有的歪歪扭扭，有的干脆用画图来表达。周阿妹站在布告栏前，她的手指缠着胶布，那是纱线割的。她拿着粉笔，在“修订意见”下面又添了一行字。不是意见，是两个字——“同意。”东北矿山深处，头灯的光柱在煤壁上晃动。老矿工把《工人宪法》的全文刻在巷道入口的木板上，每一笔都刻得很深，然后用墨汁填满刻痕。他对新来的矿工们说：“下井前读一遍。这是我们的宪法。它比任何安全帽都管用。”年轻矿工们站成一排，有人念出声来，念到“工人有权拒绝在危险条件下作业”时，老矿工点了点头，把头灯戴好，第一个走下矿井。"
  roc.250.a: "这是工人的春天，也是人民的春天。"

  roc.251.title: "东京的春天"
  roc.251.desc: "千代桃站在她身边，穿着一件旧风衣，手里拎着一个磨损的皮箱。她们对视了一瞬，然后并肩走上码头。\n\n临时政府的成立仪式在东京原市政厅的废墟前举行。这栋建筑在空袭中被炸塌了一半，剩下的一半被清理出来，挂上了两块牌子。一块用中文写着“樱花民国临时自治政府”，另一块用樱花文写着同样的内容。吉田优站在讲台上，面前是数十万东京市民，以及通过广播收听的全国各地听众。她的樱花语有些生疏，但她坚持用樱花语发言。\n\n“樱花国民们。我是吉田优，原籍京都，后移居苏联，长期旅居中国。站在你们面前的千代桃同志，她的母亲是中国人，父亲是樱花国人。我们两个都不是纯粹的樱花国人，但我们今天站在这里，以樱花民国临时自治政府正副主席的身份，对你们说话。战争结束了。天皇制被推翻了。从今天起，这片土地上不再有天皇，不再有财阀，不再有军阀。樱花国的未来，将由樱花国人民自己决定。我们不是来统治你们的，我们是来帮助你们建立一个人民自己的政府。”\n\n台下沉默了一阵，然后有人开始鼓掌。掌声零零星星，但逐渐蔓延开来，最终汇成一片持续不断的声浪。一个老工人把手中的帽子抛向空中，高喊“民主万岁”，旁边一个年轻学生用还不太流利的中文喊“中樱人民友好万岁”，然后自己愣了一下，用樱花语又喊了一遍。\n\n千代桃走上前时，台下樱花国的左翼领袖们——夏娜、宫本显治、野坂参三、德田球一，还有那些在战争期间一直坚持反战活动的工人和农民代表——都站了起来。她环顾四周，用中文开口，然后自己一句一句译成樱花语。\n\n“多年以前，我还是个在海参崴的学校里念书的小姑娘。我母亲是中国人，父亲是樱花国人。我从小就听母亲讲中国的故事，听父亲讲樱花国的故事。后来我去了苏联，加入了共产国际，又去了中国。在中国的那些年里，我看到了革命是怎么从井冈山的茅屋里走出来，是怎么在长征的路上穿过雪山和草地，是怎么在延安的窑洞里点亮灯火。我一直在想，什么时候，革命的灯火也能照亮我的另一个祖国？今天，它亮了。”\n\n她的声音发颤，但每个字都清晰。风从东京湾吹来，吹乱了她的头发，也吹动了临时政府门口那两面并排飘扬的旗帜——一面是樱花民国的日章旗，一面是中华苏维埃民国的青天白日旗。\n\n吉田优随后宣读了《樱花民国临时约法》的核心条款：废除天皇制，确立主权在民；解散财阀，其资产收归国有并用于公共建设；实行土地改革，大地主的土地分配给无地少地的农民；保障工人组织工会、集体谈判和罢工的权利；建立公费教育体系，确保每一个儿童接受义务教育；废除旧军队，建立人民自卫队，由文官政府管辖；保障妇女与男子平等的政治、经济和社会权利。每念一条，台下就响起一次掌声。念到妇女平等条款时，一个年轻女工把手举过头顶，用力鼓掌，她旁边几个中年妇女也跟着站了起来。她们的手粗糙，指节粗大——那是纺织厂多年劳动留下的痕迹。"
  roc.251.a: "樱花国的春天"

  roc.252.title: "旧宿舍"
  roc.252.desc: "临时政府成立后，吉田优和千代桃住进了原市政厅旁边一栋三层的旧宿舍楼。宿舍没有暖气，窗户漏风，冬天东京下雪，千代桃裹着棉被批阅文件，冻得手指发僵。吉田优把自己的大衣披在她肩上，说你比我更需要。千代桃回头看她，说我们几十年前在上海的地下室里也是这样的——你总把你的大衣给我。吉田优说，那时候你总说不需要。\n\n入夜，吉田优和千代桃站在临时政府的阳台上。远处东京湾的渔火星星点点，海风带来潮水拍岸的声响。千代桃望着那片海很久，没有说话。然后她转过身，看着吉田优，忽然说：“我们曾经相信过，现在还在相信。从上海的地下室到东京的阳台上，我们走了一辈子。”\n\n吉田优侧过头，看着千代桃眼角的细纹。她想起很多年前她们在法租界那间逼仄的地下室里，千代桃也是这样坐在灯下，用冻僵的手指刻着钢版。她们还年轻，她们相信自己可以改变世界。现在她们老了，世界真的变了。她没有回答，只是伸出手，握住了千代桃的手。海风继续吹着，阳台上那两面旗帜在风中轻轻拂动。东京的春天来得晚，但终究还是来了。\n\n樱花民国宪法通过的那天晚上，吉田优和千代桃在临时政府的阳台上站了很久。东京湾的渔火星星点点，海风带着盐味吹过来，吹乱了她们的头发。千代桃忽然侧过头，看着吉田优的侧脸。阳台上的灯光很暗，只够照亮她的轮廓——那个她从少女时代就熟悉的轮廓，从海参崴到上海，从南京到东京，从未改变。"
  roc.252.a: "过去我们在苏联、在中国革命，现在在樱花革命。"

  roc.253.title: "旧名"
  roc.253.desc: "“优。”她轻声说。\n\n“嗯？”\n\n“你有多久没有用过‘优子’这个名字了？”\n\n吉田优没有说话。她的视线落在远处东京湾的渔火上，那些光点在黑暗的海面上轻轻摇曳，像很多年前她们在上海法租界地下室里点过的那盏油灯。她用了几十年的中文，习惯被称作“吉田优”，那个“子”字被岁月磨掉了，就像她的樱花语口音被中国同志们的南腔北调同化了一样。她沉默了很久，海风把她的鬓发吹到嘴角，她没有去拂。\n\n“很久了。从离开京都的那天起。”\n\n千代桃往她身边挪了半步，肩膀几乎挨着肩膀，但没有贴上。她低下头，看着自己交叠在栏杆上的手指。那双手年轻时握过刻钢版用的铁笔，后来在川北的草屋里纺过线，再后来在南京的党校里翻过无数页教材。现在这双手老了，指节微微弯曲，皮肤上布满了细密的皱纹。\n\n“那你现在可以把‘千代田’也捡回来吗？”吉田优侧过头，看着千代桃的侧脸。她的樱花语说得不如中文流利了，但这句话她说得很慢，很认真，每一个音节都像是从很久以前的记忆里打捞出来的。\n\n千代桃没有回答。她只是把垂在栏杆上的手指轻轻往旁边移了半寸，刚好碰到吉田优子的手背。不是握，是碰。皮肤贴着皮肤，能感觉到彼此的温度。海风还在吹，渔火还在摇，阳台上那两面旗帜还在风中轻轻拂动。她们就这样并肩站着，没有拥抱，没有亲吻，没有任何比指尖相触更亲密的动作。但她们的手没有移开。\n\n第二天，吉田优子在临时政府的走廊上遇到千代田桃。她今天换了一件新裁的深蓝色西式套裙，头发也用发夹整整齐齐地别在耳后，看起来比平时精神了不少。千代田桃看见她时微微愣了一下，然后走过去，没有说话，只是伸出手，替她把翻出来的衬衫领子轻轻地翻回去。动作很轻，很慢，只停留了几秒。吉田优子没有动，她只是站在那里，让那只手在自己的领口停了一会儿。走廊里没有人，阳光从窗户斜斜地照进来，把她们的影子投在墙上，交叠在一起。\n\n傍晚，千代田桃在办公室里批阅文件，窗外传来吉田优子用久违的京都腔和几个旧左翼领袖交谈的声音。那声音穿过半开的窗户，轻轻地落在她的桌面上。她没有抬头，但笔尖在纸上停了一下，嘴角微微弯起一个几乎看不见的弧度。"
  roc.253.a: "呦西"

  roc.254.title: "入夜"
  roc.254.desc: "入夜，吉田优子回到宿舍时，发现自己那张吱嘎作响的铁架床上多了一个枕头。千代田桃坐在自己床边，把一套新拆封的被褥铺得整整齐齐，头也不抬地说：“你那屋的窗户漏风太厉害。我已经让后勤去修了，修好之前先睡我这。”\n\n“那你睡哪儿？”\n\n“睡这儿。”千代田桃拍了拍床的另一边，语气平静得像在汇报一份文件，“又不是没一起睡过。上海法租界的地下室，比这张床窄多了。”\n\n吉田优子没有再多问。她脱下外套挂在门后，把鞋子整齐地放在床脚，然后躺下来，把被子拉到胸口。床很窄，她们不得不肩膀挨着肩膀，手臂贴着手臂，像拼图的两块终于嵌在一起。千代田桃的头发散在枕头上，她用的是同一种肥皂，同一种洗衣粉，身上却总带着一丝若有若无的纸和墨的气味——那是她多年来一直在使用的旧笔记本的气味。千代田桃侧过头，鼻尖几乎碰到吉田优子的头发。她的呼吸轻而均匀，像春天的风。\n\n“优子。”\n\n“嗯？”\n\n“你头发白了以后，比以前更好看。”\n\n吉田优子没有回答。窗外的月光透过薄薄的窗帘，照在她们交叠的被子上。她的手在被子里轻轻动了一下，碰到了另一只手。那只手没有躲开，而是反过来，把她的手指轻轻握住。她们都没有转头，但她们的手在被子里，一直握着，直到睡着。\n\n几个月后的一个傍晚，吉田优子和千代田桃并肩坐在宿舍那张吱嘎作响的铁架床边，窗外东京湾的落日正缓缓沉入海平面，橘色的余晖把整个房间都染成了暖色调。她们面前放着一份刚刚完成的《樱花民国第一届国民议会选举总结报告》，署名栏里并排签着两个名字。千代田桃摘下老花镜，揉了揉鼻梁，忽然转过身，看着吉田优子。余晖落在她脸上，把她眼角的皱纹都染成了淡金色。\n\n“优子，我们这辈子，从海参崴到上海，从南京到东京，走过多少路了？”\n\n吉田优子没有回答。她只是侧过头，看着千代田桃。夕阳照在她脸上，暖得像很多年前她们在上海法租界地下室里分过的最后一块烤红薯。她伸出手，把千代田桃垂在耳边的一缕白发轻轻拨到耳后。动作很轻，很慢，指尖掠过耳廓时停了一下，然后收了回来。\n\n“走过的路数不清了。”她说，“但以后的路，还很长。”\n\n千代田桃低下头，看着自己的手。那只手还放在床上，手心朝上，像是还在等着被握住。她的嘴角微微弯了一下，然后抬起头，重新戴上老花镜，拿起笔，在报告最后一页的空白处写了一行字。\n\n她写的是：“余生请多指教。”用的是樱花语。\n\n吉田优子接过那支笔，在下面写了一行中文——“嗯。”\n\n窗外，东京湾的落日已经完全沉入海平面，渔火陆续亮起来，把漆黑的海面染成一片流动的光河。房间里那盏旧台灯发出昏黄的光，照在她们并肩坐在床沿的身影上。两个人不再年轻，但她们的手还握着，在余生刚开始的每一个傍晚。"
  roc.254.a: "！？拉拉？！"

  roc.255.title: "德同志，请把我也带上"
  roc.255.desc: "蒋巾帼站在克里姆林宫的侧厅里，窗外飘着雪花。她是来莫斯科参加共产国际全体会议的。\n\n共产国际会议休息间隙，蒋巾帼独自站在克里姆林宫长长的走廊里。窗外飘着雪，莫斯科的冬天比她记忆中任何一年都冷。她手里捏着一封信，信是一个苏联老兵写的，辗转从海参崴送到她手上。老兵在信里写道：“德同志，我在西伯利亚的铁路上和西瓜同志一起铺过铁轨。她告诉我，等中国的铁路铺完了，她要带着中国同志去西伯利亚，把那条铁路也重新铺一遍，铺得更宽、更直，直通莫斯科。德同志，请把我也带上。”\n\n她把信折好放进口袋，整了整中山装的领口。会议室里，共产国际的同志们正在等待她的发言。今天要讨论的议题是“关于中华苏维埃民国以加盟共和国身份加入苏维埃社会主义共和国联盟的提案”。推开门之前，她对自己说了一句话，声音很轻。西瓜在走廊尽头等着，手里拿着烟斗。她听不懂俄语，但她听得懂蒋巾帼的心。她知道，这次来莫斯科，要办一件大事。西瓜走过来，把烟斗从嘴边移开，用她浓重的俄语口音说了一句中文——“我老了，但我的徒弟还能把铁路从南京铺到莫斯科。”蒋巾帼点了点头，推开会议室的门。"
  roc.255.a: "这将决定中国与苏联的命运"

  roc.256.title: "特别会议"
  roc.256.desc: "苏维埃大会特别会议在南京召开。蒋巾帼刚从莫斯科回来，带来了《中苏苏维埃社会主义联盟条约》的草案。草案的核心条款包括：中华苏维埃民国成为苏联的加盟共和国，保留其国家名称、领土完整、文化自主权和法律体系；中国国民党成为苏联共产党（布尔什维克）的一部分，在中央委员会中享有相应的代表席位；中华苏维埃民国主席兼任苏维埃社会主义共和国联盟副主席；红军与苏联红军合并，由苏联国防委员会统一指挥，但中国境内部队由中国人担任主官；俄语和中文同为联盟官方语言，过渡期内中文在原有辖区内继续作为行政和教育语言。\n\n台下的反应是激烈而复杂的。陈世涛站起来，她的声音在安静的会场里显得格外清晰。她说她当年带着川北独立旅改编成国防军时交出指挥权，是因为承诺番号可以保留，川北的弟兄们仍然由她带。现在要改编成苏联红军，番号还在不在？她怎么跟弟兄们交代？蒋巾帼回答，番号仍然保留，川北独立旅改称“苏联工农红军川北独立旅”，旅徽、军旗、纪念章一律不变。陈世涛坐下了，没有再说话。\n\n庄方宜的问题是技术性的。她翻开文件，指着条款中关于中苏铁路网统一的条款，说这份草案附录里的铁路轨距统一方案缺少关键的技术参数——苏联轨距和中国现有标准轨距的误差允许值是多少？信号系统兼容性有没有经过测试？她不能在一个数字都不确定的草案上签字。西瓜站起来替她解答了所有技术问题，从轨距差异说到车轮踏面锥度，最后补充说，西伯利亚铁路和东北铁路的衔接段她已经亲自走了一遍，每一根枕木都看过，可以铺。\n\n表决以压倒性多数通过。蒋巾帼随即宣誓就任苏维埃社会主义共和国联盟副主席。她的誓词很短：“我将用余生，为世界革命的胜利而奋斗。同志们，亚洲的革命，现在是世界革命的一部分了。愿莫斯科的灯火，照亮每一个还在黑暗中的人。”她站在主席台上，胸前同时佩戴着青天白日勋章和列宁勋章。窗外，一面巨大的苏联国旗和一面中华苏维埃民国国旗并排升起，在春风中紧紧相依。"
  roc.256.a: "新的联盟，新的黎明"

  roc.257.title: "同志自西来"
  roc.257.desc: "苏维埃大会的例会正在进行，议题是关于第二个五年计划的中期调整。蒋巾帼正在逐条审阅庄方宜报送的进度报告，她的手指沿着纸面上那排数字缓缓移动——钢铁、煤炭、电力、铁路，每一项都在红线之上。然后她听到了走廊里的脚步声，急促而不整齐，不是卫兵的靴子，也不是秘书的皮鞋，是某种更沉、更乱的东西正在逼近。\n\n戴安澜推开门。她没有行军礼，只是站在门口，手里攥着一份电报。电报是从莫斯科发来的，经过共产国际远东局的紧急加密，译电员用红笔在纸页上标着三个感叹号。戴安澜把电报放在蒋巾帼面前。这是苏联发来的紧急通报——她们在外部军事压力下，西部防线全面吃紧，大片领土已经沦陷。电报末尾没有官样套话，只有一行字——“同志们，请继续革命。”\n\n蒋巾帼把电报读了三遍。然后她站起来，走回办公室，拨通了克里姆林宫的热线。电话那头是[SOV.Getleader]疲惫而坚定的声音。两人用俄语交谈，没有寒暄，没有外交辞令。蒋巾帼说，南京准备好了。红场可以重建，列宁墓可以迁移，木之本格勒的名字可以刻在长江边的任何一座城市。[SOV.Getleader]沉默了一会儿，说：“德同志，我们走投无路了。”蒋巾帼说：“德不是我的名字，但你们可以这样叫我。我父亲当年在郑州的洪水里，也没有问过自己有没有退路。”\n\n中华苏维埃民国正式更名为“苏维埃联盟”。更名仪式在苏维埃广场举行，蒋巾帼和[SOV.Getleader]并肩站在主席台上，身后是刚刚从莫斯科空运至此的列宁墓迁移纪念碑。蒋巾帼宣布苏维埃联盟的中央机构正式迁入南京，南京将作为临时首都承担起世界革命总部的全部职能。南京的工厂开始日夜不停地生产支援西线的物资，南京的军校里开始培训来自苏联西部沦陷区的游击队员，南京的医院里住满了从西线转运来的苏联伤员。[SOV.Getleader]看着这个被红日映照的东方城市，对蒋巾帼说莫斯科的灯火没有熄灭，它只是换了一个地方继续燃烧。\n\n西瓜接到的任务是尽快规划并修建一条从南京直通西伯利亚腹地的战略铁路，确保东部物资能够源源不断地运往西线。她已经老了，走路需要拐杖，但她仍然亲自在图纸上画下了第一根线。她对助手说，她铺了一辈子铁路，从西伯利亚铺到中国，现在要把这条路重新铺回西伯利亚。她说这不是撤退，是回家，是铁路回家。\n\n庄方宜在起草新苏联的第一个国民经济恢复计划时发现，来自苏联西部沦陷区的流亡人口中，有大量工程师、科学家和技术工人。她将这些人的专业背景逐一登记造册，据此向蒋巾帼提交了一份建议书：在新苏联的战时经济规划中，优先恢复和利用这批技术力量，让流亡的专家和中国的工人一起，在后方重建那些被炸毁的工厂。她没有想到自己会用这种方式统计人口——不是统计出生率和死亡率，是统计每一个还能工作的人。"
  roc.257.a: "南京将接过革命的火种。"

  ##待续

  roc.258.title: "庄方宜的筹备报告 · 她翻到最后一页"
  roc.258.desc: "她翻到最后一页，上面是一张空白表格，只有最上方印着一行字——“项目名称、建设周期、所需投资、预期产能”。\n\n“这份表格发到各部门，每一栏都要填。填不出来，就空着。空着的地方我会标注‘数据缺失’。数据缺失不可耻，可耻的是瞎填。”\n\n西瓜站起来，从公文包里取出一张手绘的中国地图。地图上用粗红线标出了几条尚未修建的铁路干线，每一条红线旁边都用俄文和中文两种文字标注着里程、预算和预计施工周期。她把地图挂在墙上，用烟斗指了指最粗的那条红线。"
  roc.258.a: "继续"

  roc.259.title: "西瓜的铁路规划 · 同志们，五年计划的重工业项目需要运输"
  roc.259.desc: "“同志们，五年计划的重工业项目需要运输。一座年产几百万吨的钢铁厂，每天需要上万吨铁矿石和煤炭。这些原料不能用人背，不能用驴驮，必须用火车。我的建议是：第一条，陇海铁路西延段，连接西北油田和东部港口；第二条，粤汉铁路复线，打通长江以南的南北交通；第三条，东北铁路网改造，把苏联轨距改成标准轨距，确保战时物资能从东北直达南京。如果没有这些铁路，五年计划就是纸上的五年计划。铁轨铺到哪里，计划才能走到哪里。请计委把铁路建设列为第一个五年计划的优先项目。”\n\n西瓜把烟斗放在桌上，坐回位置。她坐下时椅子发出咯吱一声响，庄方宜低头在笔记上记了一笔——“第43页附录：优先项目论证。发言人：西瓜。附铁路规划图。”"
  roc.259.a: "继续"

  roc.260.title: "陈芸的财政核算 · 陈芸没有站起来"
  roc.260.desc: "陈芸没有站起来。她只是把面前的账本翻开到某一页，用指尖点着上面的数字，声音平静得像在念一份购物清单。\n\n“我管了多年账。革命不是只算政治账，更要算经济账。第一个五年计划的建设资金从哪里来？三个渠道。第一，农业积累。通过粮食征购和合作社积累的资金，这是大头。预计占全部投资的半数以上。第二，工商业税收。随着城市工商业逐步恢复，这部分会逐年增长。第三，外援和贷款。苏联的援助、海外华侨的汇款、以及我们即将发行的建设公债。但外援不可靠，公债要还利息。最稳妥的还是我们自己手里的钱。所以我的建议是：优先投资能快速产生效益的项目。钢铁厂、煤矿、油田——这些项目建成后可以在几年内回收成本，然后用回收的资金投入下一批项目。五年计划的投资顺序不能按政治需要来排，要按经济规律来排。谁先回本，谁先上马。”"
  roc.260.a: "继续"

  roc.261.title: "陈芸的财政核算 · 蒋巾帼听完，在笔记本上记了一行字——“投资顺"
  roc.261.desc: "蒋巾帼听完，在笔记本上记了一行字——“投资顺序：回本优先。”\n\n吉田优站起来，从公文包里取出一本已经翻阅得起了毛边的俄文小册子，封面上的烫金字样已经有些模糊。她说：“苏联在制定第一个五年计划时，犯过一些错误。指标定得太高，农业集体化推进太快，导致几年间发生了严重的饥荒。这些错误，中国同志可以避免。”她把小册子翻到某一页，上面是密密麻麻的俄文表格，每一栏都用红蓝铅笔做了标注，“五年计划应当分为两个阶段。前两年为打基础阶段，重点是建设重工业项目，同时进行全国范围的资源勘探和人才培养；后三年为加速发展阶段，在前两年积累的基础上集中力量完成关键项目，实现工业产值的飞跃。我建议在计划中写入‘两步走’原则——先勘测，后动工；先试点，后推广。不要把所有项目都压在第一年开工。机器可以加班，人不能加班到死。”"
  roc.261.a: "继续"

  roc.262.title: "吉田优的苏联经验 · 庄方宜在笔记上写道"
  roc.262.desc: "庄方宜在笔记上写道：“采纳‘两步走’建议。前两年为奠基期，后三年为加速期。各项目按此原则重新排定工期。”"
  roc.262.a: "继续"

  roc.263.title: "草案的诞生 · 深夜，计划委员会的临时办公楼里灯火通明"
  roc.263.desc: "深夜，计划委员会的临时办公楼里灯火通明。庄方宜坐在桌前，面前堆着各部门送来的规划草案，每一份都被她用红笔标注得密密麻麻。西瓜坐在角落里，抽着烟斗，对着一张铁路规划图反复核算里程数据，手指在图纸上缓慢移动，每核对完一段就在旁边画一个小小的圆圈。陈芸的账本摊了满桌，她的指尖在算盘上飞掠，噼啪声细密如雨，笔记本上的数字正一行一行往下延伸。窗外偶尔传来更夫的梆子声和远处江面的汽笛，除此以外只有钢笔划过纸页的沙沙声和算盘珠碰撞的脆响。\n\n蒋巾帼推门进来时，庄方宜正在校订草案的最后一章。她抬起头，把草案递给她。“草案共多少章，多少节，预计投资总额是多少亿元，其中重工业占比约多少，轻工业和农业各占多少。各项数据都经过至少两次交叉核对。我建议命名为《中华苏维埃民国第一个五年计划草案（征求意见稿）》。”"
  roc.263.a: "继续"

  roc.264.title: "草案的诞生 · 蒋巾帼接过草案，从头到尾翻看了一遍"
  roc.264.desc: "蒋巾帼接过草案，从头到尾翻看了一遍。她翻得很慢，每一页都仔细看过，然后在封面上签下自己的名字，又在名字下面写了一行字——“此草案须提交苏维埃代表大会审议，经讨论和修改后方可成为正式计划。各项指标既要有雄心，又要留有余地。社会主义的优越性不体现在数字上，体现在每一个劳动者的生活改善上。”她把草案递还给庄方宜，说：“你辛苦了。但真正辛苦的事，现在才开始。”庄方宜没有回答。她把草案放在桌上，拿起笔继续校正下一章。天亮之前，她还有一整章要改完。\n\n蒋巾帼在中央执行委员会上发言，语气平静而坚定：“我们常说干部是人民的公仆。公仆不是坐在办公室里喝茶看报的，公仆是弯下腰去干活的。从今天起，各级苏维埃干部每年必须参加生产劳动。不是一个月，不是半个月，是每年至少参加一段时间的生产劳动。下田、进车间、上工地，干什么都行。但是必须去，必须真干，不是做样子，不是拍照片。”"
  roc.264.a: "继续"

  roc.265.title: "干部参加劳动 · 毛润芝端着那只搪瓷茶缸，微微点头"
  roc.265.desc: "毛润芝端着那只搪瓷茶缸，微微点头。邓子恢在笔记本上飞快地记着，笔尖划过纸面，发出沙沙的声响。\n\n“工人也要参与管理。工厂不是厂长的私产，工厂是全体工人的。工人不仅要干活，还要管工厂。怎么管？不是人人当厂长——是在生产计划、技术革新、工资分配、劳保福利这些事上，工人要说了算。我提议在各级苏维埃设立工农监察委员会，工人农民直接监督政府。同时，在工厂推行‘两参一改三结合’制度——干部参加劳动，工人参加管理，改革不合理的规章制度，领导干部、技术人员和工人群众三结合。”"
  roc.265.a: "继续"

  roc.266.title: "干部下乡 · 苏北某县的苏维埃主席老赵"
  roc.266.desc: "苏北某县的苏维埃主席老赵，天不亮就起来，换上一身旧军装改的工装，扛着锄头出了门。今天是他每年参加生产劳动的日子。他的秘书跟在后面，手里拿着笔记本，想记点什么，被老赵回头瞪了一眼：“你跟着我干什么？我今天是去锄地，不是去开会。你把本子放下，也去拿把锄头。”秘书愣住，只好把本子放下，从农具房里也找了一把锄头。"
  roc.266.a: "继续"

  roc.267.title: "干部下乡 · 田里，老赵已经和几个农民一起弯着腰锄草"
  roc.267.desc: "田里，老赵已经和几个农民一起弯着腰锄草。他的锄头使得不太顺手，动作比别人慢半拍，但他没吭声，只是低着头，一锄一锄地往前锄。汗从他额头上滴下来，落在干裂的田土里，瞬间就渗了下去。一个老农蹲在田埂上看了一会儿，递给他一碗水，说：“赵主席，你这锄头把子，握得太紧了。握太紧，手会起泡。放松一点，让锄头自己往下落。”老赵接过水，喝了一口，用手背擦擦汗，说：“我这手，握了多年笔杆子，不会握锄头了。你教教我。”老农跳下田埂，用自己的锄头给他示范了一遍。老赵依样画葫芦，锄了两行，果然顺手许多。老农又看了看他的手，说你手心已经红了，再锄下去要起泡，让他歇一会儿。老赵说再锄两行，今天得把这块地锄完。"
  roc.267.a: "继续"

  roc.268.title: "干部下乡 · 田埂上围了好些人"
  roc.268.desc: "田埂上围了好些人，有老农，有妇女，有孩子。有个年轻后生低声问旁边人：“那个不是县里的赵主席吗？”旁边人还没答话，另一个蹲在田埂上的老汉哼了一声说：“不像。主席哪有下地的。”然后他眯起眼仔细看了看弯腰锄草的老赵，看清了他灰白的两鬓和那件旧军装改的工装，慢慢把烟杆从嘴边拿下来，不说话了。过了许久，老赵锄到了地头，直起腰，汗水从额角淌下来，滴在新锄过的土上。他把锄头拄在手里，对送水的老农说：“大叔，歇晌了。你这块地，草锄得差不多了。”\n\n上海某国营纺织厂的车间里，墙上的黑板报新换了一期，标题用彩色粉笔描了粗体——“工人管理委员会今日成立”。工人们推选出来的代表坐在厂部会议室的长桌前，和生产科长、技术科长面对面讨论下一季度的生产计划。厂长的位置空着，在角落里旁听。"
  roc.268.a: "继续"

  roc.269.title: "工人监察 · 一个女工代表站起来"
  roc.269.desc: "一个女工代表站起来。她叫周阿妹，是细纱车间的挡车工，在纺织机前站了多年，手指被纱线磨出了厚茧。她手里拿着一个本子，上面是她和姐妹们一起记录的断头率数据。她的声音有些紧张，但一字一句都很稳：“上个月细纱断头率上升了不少，主要是前纺车间送来的粗纱条干不均。我建议重新校准前纺机台的罗拉隔距，另外挡车工的轮班时间太长，后半夜大家太累了，断头率就高。能不能把夜班缩短半个钟头？”\n\n技术科长扶了扶眼镜，翻开设备台账翻了翻，说：“罗拉隔距好办，本周末加班校准。但夜班缩短半小时涉及全厂排班表调整……”生产科长在旁边轻轻拉了他一下，意思是让他先记下来再讨论。阿妹不紧不慢地接过话头：“那就调整。工人也是人，不是零件。”技术科长低下头，在会议记录上写上——“夜班缩短半小时，提交厂务会讨论。”阿妹坐下来，旁边另一个工友拍了拍她的手背。"
  roc.269.a: "继续"

  roc.270.title: "工农监察委员会 · 南京某区苏维埃政府的接待室里"
  roc.270.desc: "南京某区苏维埃政府的接待室里，工农监察委员会的牌子挂在门口，油漆还没干透。负责接待的老周是个退休矿工，在井下干了大半辈子，后来因工伤调到了地面工作。他面前坐着一个老农，手里捏着一张皱巴巴的纸条。\n\n老农说，村里修水渠，乡苏维埃拨了款，但水渠修了一半就停工了。他去乡里问，乡里的人说款子用完了。他又去问包工头，包工头说只收到一半的钱。他不知道钱去哪了。"
  roc.270.a: "继续"

  roc.271.title: "工农监察委员会 · 老周把纸条拿过来看了看"
  roc.271.desc: "老周把纸条拿过来看了看，是乡苏维埃的拨款通知，上面盖着红章。他又拿起笔，把老农说的情况一一记下，字写得很大，慢而用力，每一笔都像是刻进纸里。然后他站起来，摘下墙上的电话机，摇通了乡苏维埃。等电话那头传来声音，他对着话筒说：“我是工农监察委员会的老周。有人举报你们那边水渠款子不对。明天我去你们那儿。账本准备好。”挂掉电话后老周转过身来对老农说：“老乡，你回去等着。水渠的事，我一个星期内给你答复。你信我。我在井下挖了很多年煤，上头说给矿灯就给矿灯，说发不出工资就真的不发。后来苏维埃来了，矿工的工资再也没有欠过。所以我也信苏维埃——苏维埃说了给你答复，就一定会给你答复。”"
  roc.271.a: "继续"

  roc.272.title: "干部劳动记录 · 庄方宜的办公桌上，多了一份新的统计表格"
  roc.272.desc: "庄方宜的办公桌上，多了一份新的统计表格。这份表格不是关于钢铁产量，不是关于铁路里程，是关于干部参加劳动的记录。各省苏维埃上报的数据在她面前排成一列，数字和日期密密麻麻。她逐行核对，用红笔标出缺漏之处，然后起草了一份简短的书面意见，附上汇总表呈送中央执行委员会。意见末尾，她用一如既往的简洁笔触写道：“干部参加劳动的数据已汇总。部分县级苏维埃填写不完整，已退回补报。”\n\n蒋巾帼在她的统计表上批了一行字：“此项制度应长期坚持。干部参加劳动不是一阵风，不是运动，不是做给谁看的。每年考核，缺勤必究。劳动记录纳入干部档案，作为晋升和调任的依据之一。官僚主义是社会主义的死敌，劳动是治疗官僚主义的药。药不能停。”"
  roc.272.a: "继续"

  roc.273.title: "干部劳动记录 · 老赵的锄头已经使得顺手了"
  roc.273.desc: "老赵的锄头已经使得顺手了。他的田埂上没有秘书跟着，只有一块他自己锄完的坡地和锄头上磨出的光泽。傍晚收工后他把锄头靠在田埂上，蹲下来喝了口水，望着那片刚锄过的地，土块在夕阳下泛着湿润的暗光。他想起那个教他握锄头的老农说的话，握太紧手会起泡，放松一点。他现在懂了。\n\n上海纺织厂。布告栏前围满了人。一张红纸贴在最显眼的位置，标题用粗体字写着——“工人宪法草案，征求全体工友意见”。署名是“上海总工会工人宪法起草小组”。周阿妹站在人群里，手里还捏着刚换下来的断线梭子，梭子上缠着半截没拉完的棉纱。她仰着头一个字一个字地念，嘴唇微微翕动，念到第七条时声音忽然大起来——“工人有休息的权利。任何工厂不得强迫工人连续工作超过法定工时。”旁边有人小声嘀咕这也能写进宪法，阿妹转过头来说：“能。我们写的，我们就能。”身后，几个工友挤过来，有人从口袋里掏出笔直接在红纸上改字，有人把阿妹的话记下来，转抄到自己的建议稿里。"
  roc.273.a: "继续"

  roc.274.title: "工人宪法·征集意见 · 东北矿山"
  roc.274.desc: "东北矿山。巷道深处，头灯的光柱在煤壁上晃动。一个老矿工坐在煤堆上，把安全帽摘下来放在膝盖上，对着围坐一圈的工友们念一份手写的草案。他的声音沙哑，井下多年的粉尘在他的肺里留下了永久的刻痕。他念得很慢，每念完一条就停下来，让大家发表意见。念到“工人有权拒绝在危险条件下作业”时，他停了下来。矿工们沉默了很久。一个年轻矿工用袖子抹了抹脸上的煤灰，低声说这一条好。另一个老矿工想起多年前瓦斯爆炸死去的那些工友，他们下井之前没有人问过巷道里的瓦斯浓度，没有人告诉他们今天的工作面有危险。他说：“以后不会了。我们写进宪法里了。”"
  roc.274.a: "继续"

  roc.275.title: "工人宪法·征集意见 · 天津码头"
  roc.275.desc: "天津码头。汽笛声从远处传来。搬运工人们蹲在货箱边，围着一张摊开的旧报纸。报纸上密密麻麻写着字，是码头工人自己拟的保障条款。一个装卸工用手点着其中一条——“工人因工受伤，雇主必须承担全部医疗费用，不得解雇。”他的左臂还吊着绷带，那是上个月卸钢材时被吊臂打伤的。老板当时说，你自己不小心，自己掏钱治。现在他把这张报纸举起来，对着工友们喊：“以后，没有人能在码头说了算——除了我们自己。”他把报纸递给旁边一个年轻工人，说：“你念给大家听。从头念。”年轻工人接过去，展开报纸，清清嗓子，一字一句地念起来。"
  roc.275.a: "继续"

  roc.276.title: "工人宪法·征集意见 · 成都机械厂"
  roc.276.desc: "成都机械厂。车间的休息时间，工人们围在钳工台边，一个老钳工正用划针在一块废钢板上写字。他不是在画加工线，他是在刻一部宪法。钢板上刻着十六条条文，每一条都是他在机床和工作台边从日常的生产经验里总结出来的。他刻了一整夜，刻到天亮，手指被钢针划破了就用棉纱缠一下继续刻。天亮时他把钢板立在车间门口，旁边另放了一块空钢板，用粉笔在上面写着——“此乃工人宪法初稿，请各位工友斧正。”一个年轻学徒站在钢板前，把第十六条念了出来：“本条例由全体工人共同制定，由全体工人共同监督。修改权、解释权、废止权，归全体工人。”他念完回头看老钳工，老钳工说：“这是最后一条。最重要的。前面的不能大过这一条。”"
  roc.276.a: "继续"

  roc.277.title: "工人宪法·条文 · 第一条 工人是国家的主人"
  roc.277.desc: "第一条 工人是国家的主人。苏维埃政权的一切权力属于人民，工人是人民的主体。\n\n第二条 工人有劳动的权利。国家保障每一位有劳动能力的工人获得与其技能相匹配的工作岗位。\n\n第三条 工人有休息的权利。任何工厂、矿山、工地不得强迫工人连续工作超过法定工时。工人每年享有法定带薪休假。\n\n第四条 工人有组织工会的权利。工会代表工人参与企业管理、监督劳动条件、维护合法权益。\n\n第五条 工人有罢工的权利。在法律规定的范围内，工人可以通过罢工维护自身权益。"
  roc.277.a: "继续"

  roc.278.title: "工人宪法·条文 · 第六条 工人有获得劳动保护的权利"
  roc.278.desc: "第六条 工人有获得劳动保护的权利。雇主必须为工人提供安全、卫生的劳动环境，预防工伤事故和职业病。工人有权拒绝在危险条件下作业，且不得因此受到任何处罚。\n\n第七条 工人因工受伤、致残或死亡，雇主必须承担全部医疗费用和抚恤责任，不得解雇因工伤暂时丧失劳动能力的工人。\n\n第八条 工人有接受职业培训的权利。企业必须为工人提供必要的技术培训，培训期间工资照发。\n\n第九条 工人有参与企业管理的权利。在生产计划、技术革新、工资分配、劳保福利等事项上，工人代表有权参与讨论和表决。\n\n第十条 工人有获得公平报酬的权利。男女同工同酬。工资应当足以维持工人及其家庭的体面生活。"
  roc.278.a: "继续"

  roc.279.title: "工人宪法·条文 · 第十一条 工人有言论"
  roc.279.desc: "第十一条 工人有言论、出版、集会、结社的自由。工人报刊受法律保护，不受审查。工人可以在工厂、矿山、工地内自由发表意见、张贴建议、出版工人报刊。任何压制工人言论的行为均为违法。\n\n第十二条 工人在退休后享有养老金。养老金的数额应随物价水平调整，确保退休工人的生活水平不因通货膨胀而下降。\n\n第十三条 青年工人享有特别保护。未满十六周岁者不得从事繁重和危险劳动。青年工人的工作时间应适当缩短，并享有接受继续教育的权利。\n\n第十四条 工人有权向各级工农监察委员会举报任何违反本宪法的行为。工农监察委员会应在接到举报后限期内调查处理，并向举报人公开答复。"
  roc.279.a: "继续"

  roc.280.title: "工人宪法·条文 · 第十五条 本宪法由全体工人共同制定"
  roc.280.desc: "第十五条 本宪法由全体工人共同制定，由全体工人共同监督。修改权、解释权、废止权，归全体工人。\n\n第十六条 本条例自颁布之日起施行。各级苏维埃政权和一切国家机关、企业事业单位、社会团体必须遵守本条例。任何违反本条例的行为，工人有权向工农监察委员会和人民法院提起诉讼。"
  roc.280.a: "继续"

  roc.281.title: "工人宪法·生效 · 春天"
  roc.281.desc: "春天。上海纺织厂的布告栏前又围满了人。红纸还贴在那里，纸边已经被风吹雨打褪了色，但字迹仍然清晰。旁边又贴了一张新纸，上面写着——“工人宪法草案修订意见征集”。下面密密麻麻写满了工人们的修改建议，有的字迹工整，有的歪歪扭扭，有的干脆用画图来表达。周阿妹站在布告栏前，她的手指缠着胶布，那是纱线割的。她拿着粉笔，在“修订意见”下面又添了一行字。不是意见，是两个字——“同意。”东北矿山深处，头灯的光柱在煤壁上晃动。老矿工把《工人宪法》的全文刻在巷道入口的木板上，每一笔都刻得很深，然后用墨汁填满刻痕。他对新来的矿工们说：“下井前读一遍。这是我们的宪法。它比任何安全帽都管用。”年轻矿工们站成一排，有人念出声来，念到“工人有权拒绝在危险条件下作业”时，老矿工点了点头，把头灯戴好，第一个走下矿井。\n\n蒋巾帼站在苏维埃广场的主席台上。台下是来自全国各地、各行业的代表。她老了，头发已经全白，但她的站姿仍然笔直。秋阳照在她的脸上，映出岁月刻下的深深纹路。"
  roc.281.a: "继续"

  roc.282.title: "红旗之下 · 她俯瞰着眼前的一切——工人"
  roc.282.desc: "她俯瞰着眼前的一切——工人、农民、军人、干部、学生，每一张面孔都是这个新政权的基石。多年前她在莫斯科中山大学的宿舍里回答一个同学的问题，说她母亲是一个革命者，也是一个杀过人的人。她不知道哪个更多。多年后她在第一个五年计划完成的那个夜晚给出了答案。此刻，站在这片已经永远改变了面貌的土地上，她知道那个答案可以再改一次。\n\n“中华苏维埃民国成立已经整整一代人了。一代人有多长？在座的许多人都是在建国前后出生的，今天你们已经成为各行各业的骨干。你们的父辈举起了革命的火把，你们这一代人建起了工厂、开垦了农田、铺成了铁路、创造了今天的一切。”"
  roc.282.a: "继续"

  roc.283.title: "红旗之下 · 他的目光缓缓扫过全场"
  roc.283.desc: "她的目光缓缓扫过全场，看到前排的庄方宜、西瓜、陈芸、千代桃、戴安澜、邓子恢、毛润芝，还有从各地赶来的工人代表、农民代表和青年代表。\n\n“革命不是请客吃饭。革命成功了，也不是坐下来享福。一代人有一代人的使命。你们的父辈完成了第一个五年计划，你们的任务，是完成下一个、再下一个。你们的父辈铺完了全国的铁路网，你们的任务，是让每一趟列车都准时到达。你们的父辈让每一个孩子都能上学，你们的任务，是让他们学得更好。我们走了很远很远的路，但这不意味着我们可以停下来。”\n\n他把讲稿合上，沉默了几秒，然后用更慢、更稳的语调开口："
  roc.283.a: "继续"

  roc.284.title: "红旗之下 · 我这一生做过很多选择"
  roc.284.desc: "“我这一生做过很多选择。有的对，有的错。但我从来、从来没有后悔过一件事——我相信了人民。人民选择了革命，革命选择了人民。这是一个普通的真理，但它被无数次实践证明了。今天，站在这里，站在红旗之下，站在无数先烈的英灵面前，我可以无愧地说——中华苏维埃之梦想，终于实现。不是某一个人的梦想，是千千万万劳动者共同的梦想。不是高高在上的梦想，是印在每一粒粮食里、锻在每一块钢铁里、铺在每一根枕木下的梦想。”\n\n他把讲稿放在一边，双手撑着讲台，望着台下无边无际的人海和旗帜的海洋，说出了最后一句话。\n\n“全世界无产者，联合起来！中华苏维埃民国万岁！”"
  roc.284.a: "继续"

  roc.285.title: "红旗之下 · 广场上响起山呼海啸般的欢呼声"
  roc.285.desc: "广场上响起山呼海啸般的欢呼声。红旗在风中猎猎作响，阳光照在每一张仰望的脸上。那一瞬间，革命的火光从井冈山的茅屋、从川北的窑洞、从延安的土坡、从苏北的农舍、从东北的林海雪原，一路燃烧到今天。火光映在蒋巾帼苍老的脸上，也映在台下无数年轻的眼睛里。\n\n那些眼睛里有火花。火花会传下去。\n\n吉田优站在东京港的码头上，海风从东京湾吹来，带着盐和铁锈的气味。她已经有很长时间没有踏上这片土地了。上一次还是在战争爆发前，她以共产国际联络员的身份秘密来过一次，住在神田一间狭小的公寓里，每天换三次电车去不同的地方接头。那时她用的是一本伪造的樱花国护照，名字是假的，身份是假的，只有信仰是真的。现在她站在同一片码头上，穿着中华苏维埃民国的干部制服，口袋里装着一份由蒋巾帼亲笔签署的任命书。码头上站满了人——樱花国的工人、农民、知识分子、旧军人、左翼活动家，还有中国驻军代表。她们的目光落在她和千代桃身上，有期待，有审视，也有沉默的敌意。"
  roc.285.a: "继续"

  roc.286.title: "东京的春天·抵达 · 千代桃站在她身边"
  roc.286.desc: "千代桃站在她身边，穿着一件旧风衣，手里拎着一个磨损的皮箱。她们对视了一瞬，然后并肩走上码头。\n\n临时政府的成立仪式在东京原市政厅的废墟前举行。这栋建筑在空袭中被炸塌了一半，剩下的一半被清理出来，挂上了两块牌子。一块用中文写着“樱花民国临时自治政府”，另一块用樱花文写着同样的内容。吉田优站在讲台上，面前是数十万东京市民，以及通过广播收听的全国各地听众。她的樱花语有些生疏，但她坚持用樱花语发言。"
  roc.286.a: "继续"

  roc.287.title: "东京的春天·成立 · 樱花国民们"
  roc.287.desc: "“樱花国民们。我是吉田优，原籍京都，后移居苏联，长期旅居中国。站在你们面前的千代桃同志，她的母亲是中国人，父亲是樱花国人。我们两个都不是纯粹的樱花国人，但我们今天站在这里，以樱花民国临时自治政府正副主席的身份，对你们说话。战争结束了。天皇制被推翻了。从今天起，这片土地上不再有天皇，不再有财阀，不再有军阀。樱花国的未来，将由樱花国人民自己决定。我们不是来统治你们的，我们是来帮助你们建立一个人民自己的政府。”\n\n台下沉默了一阵，然后有人开始鼓掌。掌声零零星星，但逐渐蔓延开来，最终汇成一片持续不断的声浪。一个老工人把手中的帽子抛向空中，高喊“民主万岁”，旁边一个年轻学生用还不太流利的中文喊“中樱人民友好万岁”，然后自己愣了一下，用樱花语又喊了一遍。"
  roc.287.a: "继续"

  roc.288.title: "东京的春天·千代桃 · 千代桃走上前时"
  roc.288.desc: "千代桃走上前时，台下樱花国的左翼领袖们——宫本显治、野坂参三、德田球一，还有那些在战争期间一直坚持反战活动的工人和农民代表——都站了起来。她环顾四周，用中文开口，然后自己一句一句译成樱花语。\n\n“多年以前，我还是个在海参崴的学校里念书的小姑娘。我母亲是中国人，父亲是樱花国人。我从小就听母亲讲中国的故事，听父亲讲樱花国的故事。后来我去了苏联，加入了共产国际，又去了中国。在中国的那些年里，我看到了革命是怎么从井冈山的茅屋里走出来，是怎么在长征的路上穿过雪山和草地，是怎么在延安的窑洞里点亮灯火。我一直在想，什么时候，革命的灯火也能照亮我的另一个祖国？今天，它亮了。”"
  roc.288.a: "继续"

  roc.289.title: "东京的春天·千代桃 · 她的声音发颤，但每个字都清晰"
  roc.289.desc: "她的声音发颤，但每个字都清晰。风从东京湾吹来，吹乱了她的头发，也吹动了临时政府门口那两面并排飘扬的旗帜——一面是樱花民国的日章旗，一面是中华苏维埃民国的五星红旗。宫本显治摘下眼镜，用袖口擦了擦镜片。\n\n吉田优随后宣读了《樱花民国临时约法》的核心条款：废除天皇制，确立主权在民；解散财阀，其资产收归国有并用于公共建设；实行土地改革，大地主的土地分配给无地少地的农民；保障工人组织工会、集体谈判和罢工的权利；建立公费教育体系，确保每一个儿童接受义务教育；废除旧军队，建立人民自卫队，由文官政府管辖；保障妇女与男子平等的政治、经济和社会权利。每念一条，台下就响起一次掌声。念到妇女平等条款时，一个年轻女工把手举过头顶，用力鼓掌，她旁边几个中年妇女也跟着站了起来。她们的手粗糙，指节粗大——那是纺织厂多年劳动留下的痕迹。"
  roc.289.a: "继续"

  roc.290.title: "东京的春天·旧宿舍 · 临时政府成立后"
  roc.290.desc: "临时政府成立后，吉田优和千代桃住进了原市政厅旁边一栋三层的旧宿舍楼。宿舍没有暖气，窗户漏风，冬天东京下雪，千代桃裹着棉被批阅文件，冻得手指发僵。吉田优把自己的大衣披在她肩上，说你比我更需要。千代桃回头看她，说我们几十年前在上海的地下室里也是这样的——你总把你的大衣给我。吉田优说，那时候你总说不需要。"
  roc.290.a: "继续"

  roc.291.title: "东京的春天·选举 · 樱花民国的第一届国民议会选举在数月后举行。选"
  roc.291.desc: "樱花民国的第一届国民议会选举在数月后举行。选举日那天，东京下着小雨，但选民们仍然排着长队等在投票站前。一个老妇人拄着拐杖，她的儿子在战争中死在太平洋，她颤抖着在选票上写下自己选的代表的名字，然后把选票贴在胸口，说了一句旁人听不懂的话。另一个年轻的工厂女工投完票后站在投票站门口不走，工作人员问她还有什么需要，她说没什么，就是想多站一会儿——这是她第一次投票。\n\n国民议会开幕当天，吉田优站在议会大厅的主席台上，以樱花民国临时自治政府主席的身份发表施政演说。她的樱花语已经流利了许多，但仔细听仍有一丝不易察觉的异国腔调。“樱花民国是樱花国人民自己的国家。它不是任何国家的附庸，不是任何意识形态的试验场。它是这片土地上每一个劳动者、每一个农民、每一个教师、每一个母亲和孩子的家。我和千代桃同志不是樱花民国的永久领导人。我们是过渡者。当这部宪法被通过，当新一届政府被选出，我们将把权力交还给樱花国人民。”"
  roc.291.a: "继续"

  roc.292.title: "东京的春天·议会 · 台下，一个老农民代表用粗糙的手抹了抹眼角"
  roc.292.desc: "台下，一个老农民代表用粗糙的手抹了抹眼角。他分到的土地今年刚收了第一季稻子，他把稻穗放在代表证旁边，一起带进了议会大厅。\n\n入夜，吉田优和千代桃站在临时政府的阳台上。远处东京湾的渔火星星点点，海风带来潮水拍岸的声响。千代桃望着那片海很久，没有说话。然后她转过身，看着吉田优，忽然说：“我们曾经相信过，现在还在相信。从上海的地下室到东京的阳台上，我们走了一辈子。”"
  roc.292.a: "继续"

  roc.293.title: "东京的春天·阳台 · 吉田优侧过头，看着千代桃眼角的细纹"
  roc.293.desc: "吉田优侧过头，看着千代桃眼角的细纹。她想起很多年前她们在法租界那间逼仄的地下室里，千代桃也是这样坐在灯下，用冻僵的手指刻着钢版。她们还年轻，她们相信自己可以改变世界。现在她们老了，世界真的变了。她没有回答，只是伸出手，握住了千代桃的手。海风继续吹着，阳台上那两面旗帜在风中轻轻拂动。东京的春天来得晚，但终究还是来了。\n\n樱花民国宪法通过的那天晚上，吉田优和千代桃在临时政府的阳台上站了很久。东京湾的渔火星星点点，海风带着盐味吹过来，吹乱了她们已经花白的头发。千代桃忽然侧过头，看着吉田优的侧脸。阳台上的灯光很暗，只够照亮她的轮廓——那个她从少女时代就熟悉的轮廓，从海参崴到上海，从南京到东京，从未改变。"
  roc.293.a: "继续"

  roc.294.title: "樱花民国重建·续 · 优"
  roc.294.desc: "“优。”她轻声说。\n\n“嗯？”\n\n“你有多久没有用过‘优子’这个名字了？”\n\n吉田优没有说话。她的视线落在远处东京湾的渔火上，那些光点在黑暗的海面上轻轻摇曳，像很多年前她们在上海法租界地下室里点过的那盏油灯。她用了几十年的中文，习惯被称作“吉田优”，那个“子”字被岁月磨掉了，就像她的樱花语口音被中国同志们的南腔北调同化了一样。她沉默了很久，海风把她的鬓发吹到嘴角，她没有去拂。\n\n“很久了。从离开京都的那天起。”"
  roc.294.a: "继续"

  roc.295.title: "樱花民国重建·续 · 千代桃往她身边挪了半步"
  roc.295.desc: "千代桃往她身边挪了半步，肩膀几乎挨着肩膀，但没有贴上。她低下头，看着自己交叠在栏杆上的手指。那双手年轻时握过刻钢版用的铁笔，后来在延安的窑洞里纺过线，再后来在南京的党校里翻过无数页教材。现在这双手老了，指节微微弯曲，皮肤上布满了细密的皱纹。\n\n“那你现在可以把‘千代子’也捡回来吗？”吉田优侧过头，看着千代桃的侧脸。她的樱花语说得不如中文流利了，但这句话她说得很慢，很认真，每一个音节都像是从很久以前的记忆里打捞出来的。\n\n千代桃没有回答。她只是把垂在栏杆上的手指轻轻往旁边移了半寸，刚好碰到吉田优子的手背。不是握，是碰。皮肤贴着皮肤，能感觉到彼此的温度。海风还在吹，渔火还在摇，阳台上那两面旗帜还在风中轻轻拂动。她们就这样并肩站着，没有拥抱，没有亲吻，没有任何比指尖相触更亲密的动作。但她们的手没有移开。"
  roc.295.a: "继续"

  roc.296.title: "樱花民国重建·续 · 第二天，吉田优子在临时政府的走廊上遇到千"
  roc.296.desc: "第二天，吉田优子在临时政府的走廊上遇到千代田桃。她今天换了一件新裁的深蓝色西式套裙，头发也用发夹整整齐齐地别在耳后，看起来比平时精神了不少。千代田桃看见她时微微愣了一下，然后走过去，没有说话，只是伸出手，替她把翻出来的衬衫领子轻轻地翻回去。动作很轻，很慢，只停留了几秒。吉田优子没有动，她只是站在那里，让那只手在自己的领口停了一会儿。走廊里没有人，阳光从窗户斜斜地照进来，把她们的影子投在墙上，交叠在一起。\n\n傍晚，千代田桃在办公室里批阅文件，窗外传来吉田优子用久违的京都腔和几个旧左翼领袖交谈的声音。那声音穿过半开的窗户，轻轻地落在她的桌面上。她没有抬头，但笔尖在纸上停了一下，嘴角微微弯起一个几乎看不见的弧度。"
  roc.296.a: "继续"

  roc.297.title: "樱花民国重建·续 · 入夜，吉田优子回到宿舍时"
  roc.297.desc: "入夜，吉田优子回到宿舍时，发现自己那张吱嘎作响的铁架床上多了一个枕头。千代田桃坐在自己床边，把一套新拆封的被褥铺得整整齐齐，头也不抬地说：“你那屋的窗户漏风太厉害。我已经让后勤去修了，修好之前先睡我这。”\n\n“那你睡哪儿？”\n\n“睡这儿。”千代田桃拍了拍床的另一边，语气平静得像在汇报一份文件，“又不是没一起睡过。上海法租界的地下室，比这张床窄多了。”"
  roc.297.a: "继续"

  roc.298.title: "樱花民国重建·续 · 吉田优子没有再多问"
  roc.298.desc: "吉田优子没有再多问。她脱下外套挂在门后，把鞋子整齐地放在床脚，然后躺下来，把被子拉到胸口。床很窄，她们不得不肩膀挨着肩膀，手臂贴着手臂，像拼图的两块终于嵌在一起。千代田桃的头发散在枕头上，她用的是同一种肥皂，同一种洗衣粉，身上却总带着一丝若有若无的纸和墨的气味——那是她多年来一直在使用的旧笔记本的气味。千代田桃侧过头，鼻尖几乎碰到吉田优子的头发。她的呼吸轻而均匀，像春天的风。\n\n“优子。”\n\n“嗯？”\n\n“你头发白了以后，比以前更好看。”\n\n吉田优子没有回答。窗外的月光透过薄薄的窗帘，照在她们交叠的被子上。她的手在被子里轻轻动了一下，碰到了另一只手。那只手没有躲开，而是反过来，把她的手指轻轻握住。她们都没有转头，但她们的手在被子里，一直握着，直到睡着。"
  roc.298.a: "继续"

  roc.299.title: "樱花民国重建·续 · 几个月后的一个傍晚"
  roc.299.desc: "几个月后的一个傍晚，吉田优子和千代田桃并肩坐在宿舍那张吱嘎作响的铁架床边，窗外东京湾的落日正缓缓沉入海平面，橘色的余晖把整个房间都染成了暖色调。她们面前放着一份刚刚完成的《樱花民国第一届国民议会选举总结报告》，署名栏里并排签着两个名字。千代田桃摘下老花镜，揉了揉鼻梁，忽然转过身，看着吉田优子。余晖落在她脸上，把她眼角的皱纹都染成了淡金色。\n\n“优子，我们这辈子，从海参崴到上海，从南京到东京，走过多少路了？”\n\n吉田优子没有回答。她只是侧过头，看着千代田桃。夕阳照在她脸上，暖得像很多年前她们在上海法租界地下室里分过的最后一块烤红薯。她伸出手，把千代田桃垂在耳边的一缕白发轻轻拨到耳后。动作很轻，很慢，指尖掠过耳廓时停了一下，然后收了回来。"
  roc.299.a: "继续"

  roc.300.title: "樱花民国重建·续 · 走过的路数不清了"
  roc.300.desc: "“走过的路数不清了。”她说，“但以后的路，还很长。”\n\n千代田桃低下头，看着自己的手。那只手还放在床上，手心朝上，像是还在等着被握住。她的嘴角微微弯了一下，然后抬起头，重新戴上老花镜，拿起笔，在报告最后一页的空白处写了一行字。\n\n她写的是：“余生请多指教。”用的是樱花语。\n\n吉田优子接过那支笔，在下面写了一行中文——“嗯。”\n\n窗外，东京湾的落日已经完全沉入海平面，渔火陆续亮起来，把漆黑的海面染成一片流动的光河。房间里那盏旧台灯发出昏黄的光，照在她们并肩坐在床沿的身影上。两个人不再年轻，但她们的手还握着，在余生刚开始的每一个傍晚。"
  roc.300.a: "继续"

  roc.301.title: "人物命运总纲 · 在蒋巾帼赢得党内选举"
  roc.301.desc: "在蒋巾帼赢得党内选举、苏维埃路线取得绝对领导权之后，革命委员会内部的权力格局发生了根本性变化。蒋巾帼没有清洗任何人——她在莫斯科学到的布尔什维克纪律告诉她，清洗是手段，不是目的。她的目的是建立一套以党为核心的、高度集中的政治经济体制。那些愿意接受这一体制的人，无论来自哪个派系，都可以在新的国家机器中找到位置。那些不愿接受的人，她也不会强迫——她只是让她们离开权力中心，去她们能发挥作用的地方。"
  roc.301.a: "继续"

  roc.302.title: "宋庆龄系 · 宋庆龄在党内选举落败后"
  roc.302.desc: "宋庆龄在党内选举落败后，保留了国家元首的职位，但实际决策权已转移至蒋巾帼领导的中央执行委员会。她没有辞职，没有流亡，没有在公开场合表达不满。她在选举结果公布后的第二天早晨，照常出席了中央执行委员会的例会，坐在蒋巾帼的左手边，和往常一样认真听完了所有议程。\n\n蒋巾帼在会后单独留下她。“孙夫人，我知道你不赞成我的方案。但你留在这里，对我来说很重要。不是因为你手里还有票——是因为你在这里，革命委员会就还是完整的。”"
  roc.302.a: "继续"

  roc.303.title: "宋庆龄系 · 宋庆龄摘下了眼镜，慢慢擦拭着镜片"
  roc.303.desc: "宋庆龄摘下了眼镜，慢慢擦拭着镜片。她回答说：“巾帼，我以前对你说过，你在莫斯科学到的那些东西，有些是对的，有些是水土不服的。我没有改变这个看法。但你赢了选举。选举结果是合法的。我不会成为你的反对派，但我会继续做我认为对的事——在宪法允许的范围内。你推行你的五年计划，我继续建我的村小。我们走不同的路，但方向应该是一样的。”\n\n她在苏维埃政权中保留了国民教育委员会主任的职务。洛茜继续担任她的副手，负责乡村小学建设和扫盲运动。蒋巾帼对教育领域的投入没有削减——她需要识字的技术工人来执行五年计划，宋庆龄需要识字的公民来建设她理想中的共和国。两人在教育事业上达成了心照不宣的合作。"
  roc.303.a: "继续"

  roc.304.title: "CC系 · 陈晖洁在苏维埃路线确立后做出了一个令所有人意"
  roc.304.desc: "陈晖洁在苏维埃路线确立后做出了一个令所有人意外的决定：她主动请求将CC系的党务网络并入党的组织系统。\n\n她求见蒋巾帼时，带了一份厚厚的名册。名册上登记着CC系在各县市建立的基层党支部、每个支部的党员人数、以及负责人的政治评估。她说：“这份名册，我交给党。你的人比我更需要它。五年计划需要基层执行力，我的人可以帮你。”\n\n蒋巾帼接过名册，没有立刻回答。她翻了几页，看到了那些密密麻麻的名字和评估栏。然后她合上名册，看着陈晖洁。“你要什么？”"
  roc.304.a: "继续"

  roc.305.title: "CC系 · 我什么都不要"
  roc.305.desc: "“我什么都不要。CC系本来就不应该是一个独立的派系。它从一开始就是一个组织工具。工具不需要独立存在。它只需要被使用。”她停顿了一下，然后罕见地流露出一丝并非完全公事公办的态度，“你母亲当年在黄埔的时候，也是这么做的。她把学生组织起来，不是为了搞派系，是为了革命。你继承了你母亲的枪。你也要继承她的组织方法。”\n\n蒋巾帼沉默了一会儿，然后说：“我不需要一份名册。我需要一个人。你来当中央组织部副部长。你负责把CC系的基层网络改编成党的组织系统。不是消灭它——是改造它。”"
  roc.305.a: "继续"

  roc.306.title: "CC系 · 陈晖洁点了点头"
  roc.306.desc: "陈晖洁点了点头。她站起身准备告辞，走到门口时停住，没有回头，只是用比平时更轻的声音说了一句：“你比你母亲更会用人。她只会命令，你会说服。”蒋巾帼看着她的背影消失在门外，没有回答。\n\n陈千语在苏维埃政权中保留了都城卫戍司令的职务，但她的权限被扩大——她不再只负责南京的城防，而是被调任为新设立的国防部军事纪律检查局局长，负责全军纪律监督。她的工作风格没有变。她每天破晓策马巡视南京的驻军营地，不提前通知，不听汇报，只看实际情况。戴安澜对她的评价只有一句话：“她看问题的角度和我一样——不看报告，看现场。”"
  roc.306.a: "继续"

  roc.307.title: "黄埔中正社 · 中正社是苏维埃路线确立过程中最大的阻力"
  roc.307.desc: "中正社是苏维埃路线确立过程中最大的阻力，也是蒋巾帼处理得最谨慎的问题。\n\n胡宗南在党内选举结果公布后，把自己关在办公室里整整一天。她的副官守在门外，只听见里面偶尔传出踱步的声音。傍晚时她开门出来，对副官说了一句话：“备车。去中山陵。”\n\n她独自在蒋介石衣冠冢前站了一夜。天亮后她回到南京，主动求见蒋巾帼。\n\n会面在蒋巾帼的办公室进行，没有记录，没有旁听。据后来蒋巾帼对戴安澜转述的只言片语，胡宗南说了这样一段话：“你赢了。我不懂你的苏维埃，但我懂一件事——你姓蒋。你母亲是我的校长，你是她的女儿。你可以改掉你母亲建立的旧军队，我不拦你。但你得答应我一件事：在你改完之后，这支军队仍然是中国人的军队。不是莫斯科的。你向我保证这一点，我就交出中正社的指挥权。”"
  roc.307.a: "继续"

  roc.308.title: "黄埔中正社 · 蒋巾帼给了他保证"
  roc.308.desc: "蒋巾帼给了她保证。不是书面保证——是口头的。她说：“我母亲在郑州战死的时候，面朝的方向是北京。我记住这一点了。我永远不会让中国的军队听命于任何外国。”\n\n胡宗南交出中正社的独立指挥权后，被任命为国防委员会委员兼军事教育总监。这不是一个实权职位，但蒋巾帼在任命时特意强调：“黄埔军校还需要你。每一期新生入学的时候，她们应该知道——这所军校的第一任校长是蒋介石，第二任校长是你的同窗。革命不忘记历史。”胡宗南接受了这个职位。她没有去军校发表演讲，但她每年开学典礼都会坐在主席台上，穿着一身笔挺的旧式军装。从不发言。只是坐着。"
  roc.308.a: "继续"

  roc.309.title: "黄埔中正社 · 汤汤的清波寨子弟兵被编入国防军序列"
  roc.309.desc: "汤汤的清波寨子弟兵被编入国防军序列，暂编为独立旅，番号保留“清波寨”。汤汤继续担任旅长。她对此的态度一如既往地务实：“番号没撤，弟兄们没散，军饷不欠。其她的，我听命令。”她在苏维埃军队中是一个异数——她的部队不喊政治口号，不设政治委员，但她的部队从未拖欠过一次训练任务，从未出现过一次逃兵。戴安澜视察清波寨独立旅后，在报告里写了一句：“该旅不设政工，但士气全军最高。建议不强制派驻政工人员。有些部队靠纪律管，这支部队靠大当家管。两种方法，效果都一样。”"
  roc.309.a: "继续"

  roc.310.title: "蓝衣社 · 识之律者在苏维埃路线确立后的处境是所有派"
  roc.310.desc: "识之律者在苏维埃路线确立后的处境是所有派系人物中最微妙的。\n\n她是蓝衣社的领袖，蓝衣社在广府时期负责政治监控和内部清洗。苏维埃路线确立后，这类工作的性质发生了根本性变化——政治监控仍然存在，但它必须被纳入党的纪律检查体系，而不是一个独立的、只向最高领袖个人负责的秘密组织。\n\n蒋巾帼没有立即处理蓝衣社。她知道识之律者的能力，也知道贸然动她可能引起的反噬。她采取了一种更精致的手段——将蓝衣社改组为中央纪律检查委员会下属的安全调查处，任命识之律者为处长。从表面上看，她的职权范围缩小了，但实际上，她被纳入了一套制度化的监控体系，她的上面有了纪律检查委员会，她的旁边有了其她监控部门，她不再是唯一的眼睛。"
  roc.310.a: "继续"

  roc.311.title: "蓝衣社 · 识之律者接受了这个安排"
  roc.311.desc: "识之律者接受了这个安排。她在接到任命书时只问了一句话：“我可以继续维护档案库吗？”\n\n“可以。”\n\n“那就够了。”\n\n安全调查处的档案库比蓝衣社时期的规模更小，但制度更严密。识之律者的日常工作不再包括主动监控党内同志——那部分工作由纪律检查委员会统一协调。她的主要职责转为安全档案的整理、归档和交叉比对。她在档案库的深处保留了一排灰色档案柜，柜子上没有任何标签。她的副官问她那些柜子装的是什么，她没有回答。也许她只是在保留某种习惯——知道一切的习惯。"
  roc.311.a: "继续"

  roc.312.title: "改组派 · 汪兆铭在苏维埃路线确立后失去了最后的存在"
  roc.312.desc: "汪兆铭在苏维埃路线确立后失去了最后的存在价值。\n\n在广府时期，改组派已经因通敌叛国被清洗。汪兆铭本人被捕后以叛国罪受审，审判是公开的。蒋巾帼在审判前给特别法庭的指示只有一句话：“依法审理。不徇私，不加刑。”审判结果是终身监禁。\n\n汪兆铭在狱中没有写悔过书，但她写了一本关于国民党早期历史的回忆录。这本回忆录在蒋巾帼执政期间未被允许出版，但蒋巾帼也没有下令销毁。她只是在审阅出版申请时批了一行字：“暂缓。待历史有定论后再议。”"
  roc.312.a: "继续"

  roc.313.title: "宪政同志会 · 宋娇仁是苏维埃路线确立过程中最坚定的反对者"
  roc.313.desc: "宋娇仁是苏维埃路线确立过程中最坚定的反对者，也是失败后最体面的失败者。\n\n他在党内选举落败后，在国会发表了最后一次公开演讲。演讲的最后一句话是：“我仍然相信议会民主。但我也承认，民主需要时间来证明自己，而时间不在我这一边。我今天输掉了选举。明天我还会来上班。因为反对党也是国家的一部分。”\n\n她在苏维埃政权中保留了国会议员席位，但宪政同志会作为政党被要求接受党的领导。宋娇仁没有拒绝，也没有屈服。她在国会中继续提出法案、参与质询、发表不同意见。她的发言风格一如既往地严谨而克制，从不攻击个人，只讨论政策。蒋巾帼对她的态度是复杂的：她欣赏宋娇仁的能力和品格，但无法接受宋娇仁的政治主张。她有一次对佩丽卡说：“宋娇仁是一个好的反对派。可惜反对派在苏维埃制度下没有土壤。”佩丽卡回答：“你如果连她这样的反对派都容不下，你的制度就真的没有土壤了。”"
  roc.313.a: "继续"

  roc.314.title: "宪政同志会 · 佩丽卡在苏维埃政权中继续担任法务部长"
  roc.314.desc: "佩丽卡在苏维埃政权中继续担任法务部长，但她的权力被限制在民法、刑法和行政法规的技术性领域。她不参与政治决策，不发表意识形态言论，只在法律条文和程序规则上保持专业和严格。她在任内完成的工作包括修订《中华民国民法典》、制定《工商管理条例》、为五年计划提供法律框架。她在每份法律草案的扉页上都用同样的格式题词——“本法案依据现行法律程序编制，不涉及政治立场。”她从未加入苏维埃政权的主导政党，也从未在公开场合评价苏维埃制度。她只是在法律条文的缝隙里，继续做她认为应该做的事。"
  roc.314.a: "继续"

  roc.315.title: "中共内部各派系 · 毛润芝在苏维埃路线确立后"
  roc.315.desc: "毛润芝在苏维埃路线确立后，选择了一个出人意料但在蒋巾帼看来完全合理的立场：有条件合作。\n\n她在给中央的信中写道：“蒋巾帼的苏维埃不是我们的苏维埃。但在消灭地主阶级、实现工业国有化、推动农业集体化这三个方向上，她和我们走的是同一条路。只是她走得比我们慢。走得慢没关系——方向对了，慢就是稳。”\n\n蒋巾帼主动向延安发出邀请，请毛润芝担任中央土地改革委员会顾问。毛润芝接受了。她在南京的办公室里挂了两幅地图：一幅是川北时期的红军根据地分布图，另一幅是五年计划的工业布局图。有人问她为什么把这两幅图挂在一起，她说：“前一幅图是我走过的路。后一幅图是我还没走完的路。两幅图合在一起，就是中国革命的全貌。”"
  roc.315.a: "继续"

  roc.316.title: "中共内部各派系 · 张雯甜在苏维埃路线下终于找到了合适的位置"
  roc.316.desc: "张雯甜在苏维埃路线下终于找到了合适的位置。蒋巾帼任命他为中央党校副校长，分管马克思主义理论教育。这是张雯甜最擅长的领域——不是权力斗争，不是军事指挥，是理论的系统化教学。他在党校编写了一套《马克思主义基础教程》，在序言中写道：“马克思主义不是教条，是方法。方法可以被讨论、被修正、被发展。但讨论需要共同的语言。这套教程就是为了提供共同的语言。”他在课堂上对学生们说：“我是留苏派中最没有出息的一个——不会打仗，不会搞运动，只会读书。但我把书读通了。你们来党校，不是为了学我读过的书，是为了学会怎么读我没有读过的书。”"
  roc.316.a: "继续"

  roc.317.title: "中共内部各派系 · 陈世涛在四川红军接受改编后"
  roc.317.desc: "陈世涛在四川红军接受改编后，她的川北独立师被编入国防军序列，暂编为川北独立师，番号保留一段时间后移交。她继续担任师长，驻防川北。她与毛润芝保持着通信联系，信的频率不高，但内容很实在——讨论的都是军事训练、士兵伙食、地方治安之类的具体问题。她在一次回川北述职时对毛润芝说了这样一段话：“南京的苏维埃，比我想的要务实。她们确实在做工业，做铁路，做扫盲。这些事我在川北也想做，但没有力量。现在她们有力量。我不知道这条路能走多远，但至少现在，它还在走。”"
  roc.317.a: "继续"

  roc.318.title: "莫斯科派 · 千代桃在苏维埃路线确立后"
  roc.318.desc: "千代桃在苏维埃路线确立后，与蒋巾帼的合作关系进入了一个新的阶段。\n\n她不再只是莫斯科派在中共党内的联络人，而是被任命为中央宣传委员会副主任，分管国际共产主义运动联络。她可以继续推动中苏文化交流，可以继续写文章论证中国革命在世界革命中的地位，但她不能再主导党内路线斗争——苏维埃路线确立后，路线争论已经结束。她接受了这个位置，没有抱怨。她用俄文写了一封信给共产国际的旧同事，信中说：“我们曾经争论过很多事。现在争论结束了。不是因为我们赢了——是因为革命已经进入了建设阶段。建设不需要争论，建设需要工作。我在工作。”"
  roc.318.a: "继续"

  roc.319.title: "莫斯科派 · 吉田优在苏维埃路线确立后继续留在南京"
  roc.319.desc: "吉田优在苏维埃路线确立后继续留在南京，担任苏联驻华大使馆文化参赞兼共产国际联络员。她的工作内容和广府时期没有太大变化——组织留学生事务，协调苏联书籍翻译，处理中苏文化交流。她在办公桌上放了一张照片，是多年前在广州拍的，照片上她和千代桃并肩站在一起，背后是珠江。有人在照片背面写了一句话，字迹是千代桃的笔迹：“我们都曾经相信过。这就够了。”"
  roc.319.a: "继续"

  roc.320.title: "莫斯科派 · 陈独秀在苏维埃路线确立后彻底退出了政治舞"
  roc.320.desc: "陈独秀在苏维埃路线确立后彻底退出了政治舞台。她的最后一次公开露面是在中央党校的开学典礼上，蒋巾帼邀请她作为特邀嘉宾出席。她没有发表演讲，只是在典礼结束后对几位年轻学员说了一段话：“我犯过很多错误。最大的错误是认为自己最懂革命。你们不要学我。革命不是请客吃饭，也不是自以为是。革命是学出来的，不是拍脑袋拍出来的。”她在此后的岁月里彻底隐居，专心整理中共早期文献。她的助手发现她在校对1921年中共一大会议记录时，在自己的发言记录旁边写了一行小字：“我当时说‘中国革命的希望在于工人’。这句话太窄了。现在我知道，希望的根基在于所有人——包括那些我曾经瞧不起的农民。”她死时，桌上还摊着那份校对了一半的文献。"
  roc.320.a: "继续"

  roc.321.title: "袁克定 · 袁克定是苏维埃政权审判的第一个战犯"
  roc.321.desc: "袁克定是苏维埃政权审判的第一个战犯。\n\n徐州战役结束后，她的北方军被分割包围在华北平原。她的指挥车被一发迫击炮弹击中，司机当场阵亡，她被震晕在车厢里。醒来时，她看见的是戴安澜的脸。戴安澜没有拔出佩枪，只是说了一句话：“袁司令，你的战争结束了。”\n\n她的审判在南京举行，全程公开。法庭上陈列了她炸开花园口大堤的证据，陈列了她纵兵劫掠河北粮区的证据，陈列了她在帝国摄政期间签发的所有镇压令。她没有请辩护律师。她站在被告席上，穿着一件洗得发白的旧军装——那是她母亲袁世凯在天津小站练兵时穿过的款式。她用这件军装，代替了所有要说的话。"
  roc.321.a: "继续"

  roc.322.title: "袁克定 · 判决结果是死刑"
  roc.322.desc: "判决结果是死刑。蒋巾帼在审判前给特别法庭的指示只有一句话——“依法审理。不徇私，不加刑，不预判结论。”她没有干预审判过程。但审判结束后，她去了一次关押袁克定的拘留所。\n\n两人的会面持续了一刻钟左右。据看守的记录，袁克定先开口。她问蒋巾帼：“你母亲的墓，在中山陵旁边？”\n\n“在。台阶东侧。”\n\n“我去不了了吧。”"
  roc.322.a: "继续"

  roc.323.title: "袁克定 · 蒋巾帼没有回答"
  roc.323.desc: "蒋巾帼没有回答。她站起来，走到门口，停住，没有回头。她说：“你母亲当年在天津小站练兵的时候，我母亲是第一批学员。她们那个时候，也许真的相信过自己在做对的事。后来她们都走错了路。我母亲死在洪水里，你母亲死在哈尔滨。现在轮到你了。”\n\n袁克定被执行死刑那天，南京下着雨。她的遗言只有一句：“告诉我母亲，我没给她丢脸。”这句话没有被官方记录，但行刑的军官把它记在了自己的日记里。她写完之后，在下面加了一行字——“她们这些人，从头到尾都觉得自己是英雄。也许这就是她们最大的罪。也是她们唯一的尊严。”"
  roc.323.a: "继续"

  roc.324.title: "蒋丽华 · 蒋丽华是在盛京流亡朝廷覆灭后被送到南京的"
  roc.324.desc: "蒋丽华是在盛京流亡朝廷覆灭后被送到南京的。\n\n她被俘时刚刚成年。押送她的专列从东北一路南下，沿途经过无数个她从未见过的村庄和工厂。她趴在车窗上往外看，看到那些在田里劳作的农民、在工厂门口排队领饭的工人、在路边写标语的赤色宣传员。她对押送她的政工干部说了一句话：“他们看起来不像我想象的那么恨我。”政工干部回答：“他们不恨你。他们只是不需要你了。”\n\n她在南京接受了一年多的思想改造。她的改造不是在监狱里进行的，是在一个特殊安置点——一座安静的旧宅，配有图书室和教员。教员是毛润芝派来的一位年轻女干部，曾在川北根据地做过农民扫盲工作。她给蒋丽华上课的内容包括中国近代史、帝国主义侵华史、以及苏维埃政权的基本政策。"
  roc.324.a: "继续"

  roc.325.title: "蒋丽华 · 蒋丽华在最初几个月里始终沉默"
  roc.325.desc: "蒋丽华在最初几个月里始终沉默。她不回答问题，不发表意见，只是坐在那里听。那位女干部在给上级的汇报中写道：“她听得很认真。但她不开口。不是抗拒，是不知道怎么开口。她活了这么多年，从来没有自己开口说过自己的看法。她的嘴被旧制度封住了。”\n\n后来她终于开口了。有一天课后，她问教员：“你说地主剥削农民。我住的宫殿、吃的饭菜、穿的衣服，都是从农民那里来的。我是不是也是剥削者？”"
  roc.325.a: "继续"

  roc.326.title: "蒋丽华 · 教员没有直接回答"
  roc.326.desc: "教员没有直接回答，只是说：“这个问题，你应该自己去读《资本论》。”\n\n蒋丽华读了大半年《资本论》。读完之后，她写了一篇读书笔记，题目是《我的阶级出身与自我改造》。她在笔记中写道：“我是旧制度的产物。我身上流的血是旧皇族的血，我曾经生活的宫殿是人民的血汗建成的。我不可能改变我的出身。但我可以改变我自己。我请求组织允许我参加劳动，用劳动洗掉我身上的旧痕迹。”"
  roc.326.a: "继续"

  roc.327.title: "蒋丽华 · 她被安排到南京一家纺织厂做学徒工"
  roc.327.desc: "她被安排到南京一家纺织厂做学徒工，化名“蒋华”，没有人知道她是末代女皇。她的师傅是一个工作了近三十年的老女工，手把手教她接线头、换梭子、检查布面。她学得很慢，但从不偷懒。老女工对她的评价只有一句话：“这姑娘以前大概没干过活。手太嫩。但态度端正。”\n\n她在纺织厂工作了很长时间。没有人刻意监视她，没有人安排记者来拍她“劳动改造”的照片。她只是每天早晨准时上班，傍晚准时下班，和工友们一起在食堂吃饭，一起在宿舍里洗衣服。她的工友中，有人知道她的真实身份，但从来没有人拿这个来嘲笑她或巴结她。有一位老工人说过一句话，被传了很久——“她干活不如别人，但她从来不觉得自己比别人金贵。就冲这一点，我没话说。”"
  roc.327.a: "继续"

  roc.328.title: "黎星刻 · 黎星刻的命运是在蒋丽华的命运被决定之后才"
  roc.328.desc: "黎星刻的命运是在蒋丽华的命运被决定之后才被决定的。\n\n帝国崩溃前，黎星刻担任京城新军卫所统领，是保皇派中唯一拥有实际武装力量的年轻将领。在袁克定逼迫皇室期间，他率部与北方军短暂交火，以劣势兵力掩护蒋丽华撤离京城。他的部队在激战中伤亡殆尽，他本人带伤护送蒋丽华突围，将她送到盛京后力竭昏迷。当他醒来时，蒋丽华已经被东北军阀控制，而他自己被转送南京，作为战俘接受审查。\n\n蒋巾帼亲自审查了她。审查不是在审讯室进行的，是在蒋巾帼的办公室里。蒋巾帼问了她三个问题：“你效忠的是谁？你对抗的是谁？你愿意为新政权做什么？”"
  roc.328.a: "继续"

  roc.329.title: "黎星刻 · 黎星刻的回答非常简短"
  roc.329.desc: "黎星刻的回答非常简短：“我效忠的是先帝托付给我的那个人。我对抗的是所有威胁她的人。你们如果以战犯处理我，我没有怨言。但如果你们愿意让我继续当军人，我会用我剩下的一切为新政权服务。”\n\n蒋巾帼没有再问。他调阅了黎星刻的全部档案——帝国中央军校的成绩单（全科优秀），历任职务的述职报告，以及他在京城新军卫所推行的训练改革方案。看完之后，他对戴安澜说：“这个人能用。他效忠的不是旧制度，是旧制度里的那个人。现在旧制度没有了，那个人也不需要他保护了，他可以重新选择忠诚的对象。”\n\n黎星刻被编入国防军，军衔暂定为上校，任命为军事教育处副处长。他没有指挥作战部队，而是被安排负责新兵训练和军校教材编写。他在任内编写了《步兵基础训练大纲》和《基层军官指挥手册》，这两本教材被戴安澜审阅后批准全军推广。"
  roc.329.a: "继续"

  roc.330.title: "黎星刻 · 但他与蒋丽华之间"
  roc.330.desc: "但他与蒋丽华之间，隔着不再可能跨越的距离。蒋丽华在工厂劳动后，他请求与她见面。他的申请在组织内部转了很多道手，最终送到蒋巾帼的办公桌上。蒋巾帼看了很久，然后翻到下一份文件，没有批复。几个月后，黎星刻再次请求调往边防部队。这次蒋巾帼批准了。他被调往西北边防军，担任某步兵团团长。他离开南京那天，火车经过紫金山，他透过车窗望着中山陵的方向，看了很久。然后他低下头，把蒋丽华多年前托人转交给他的那条旧丝巾从怀里取出来，叠好，放在膝盖上。火车继续向北开。"
  roc.330.a: "继续"

  roc.331.title: "康佑薇 · 康佑薇在统一战争结束前已经逝世"
  roc.331.desc: "康佑薇在统一战争结束前已经逝世。\n\n她是上一代人。她的政治生涯始于维新变法，终于帝国覆灭。她死在南京城外的旧宅里，身边只有几位弟子，包括符华。她死前意识清醒，让符华把她书房里所有未出版的手稿整理好，不必试图出版，也不必销毁，只需安静地放在那里。她说：“这些字，有人会读懂的。现在读不懂，将来会读懂。”\n\n蒋巾帼在得知康佑薇逝世的消息后，发了一封唁电。唁电中称她为“旧时代的改革者，新时代的先声”。这句话后来被刻在康佑薇的墓碑上。符华保留了康佑薇的全部手稿，在统一战争结束后，她将这些手稿捐赠给国家档案馆。捐赠清单的最后一行写着：“以上所有文献，捐赠人保留唯一的权利——被正确地阅读。”"
  roc.331.a: "继续"

  roc.332.title: "重岳 · 重岳是帝国旧将领中少数几个在苏维埃军队中"
  roc.332.desc: "重岳是帝国旧将领中少数几个在苏维埃军队中保留了原有地位的人。\n\n帝国覆灭后，他没有选择抵抗。他把部队集结在山西驻地，等待苏维埃政权派人来接收。来接收的是戴安澜。两人在军营里谈了整整一个下午。重岳表示自己可以交出兵权，但希望保留这支部队的建制，让他的老部下们能有一个体面的归宿。戴安澜的回答是：“你留下，部队也留下。但番号要改，政治委员制度要建。你能接受吗。”"
  roc.332.a: "继续"

  roc.333.title: "重岳 · 重岳没有犹豫：“能"
  roc.333.desc: "重岳没有犹豫：“能。”他的部队被改编为国防军第三十七步兵师，重岳继续担任师长，但增设了政治委员。他在改编后的第一件事，是把自己珍藏多年的佛珠送给了戴安澜。他说：“这是我在晋北古寺求的。戴在手上，能平心静气。”戴安澜接过佛珠，看了一眼，说：“我不戴佛珠。但我把它放在办公桌上。每次看到它，我会记得——你的旧部队，现在是新军队的一部分。”重岳后来在西北军区担任副司令，致力于边防建设和民族政策研究。他在任职报告中写道：“佛家讲慈悲，马克思主义讲解放。两者不是一回事。但在让穷人过上好日子这一点上，它们指向同一个方向。这个方向，我走对了。”"
  roc.333.a: "继续"

  roc.334.title: "李舜生 · 李舜生是旧帝国情报机构“玄穹鉴”的负责人"
  roc.334.desc: "李舜生是旧帝国情报机构“玄穹鉴”的负责人，一个从不公开露面的情报官员。帝国覆灭后，他在帝国崩溃前夕将玄穹鉴的全部档案整理分类，封存在南京的一处地下仓库。他本人在统一后主动投案，要求面见新政权的情报负责人。\n\n接见他的是识之律者。两人的对话没有记录。但事后识之律者向蒋巾帼提交了一份简短的评估报告：“李舜生。前玄穹鉴部长。能力等级：优秀。忠诚度：只忠于工作。建议：留用。限制权限，不接触核心机密。”李舜生被安排在安全调查处下属的档案分析科担任技术顾问，负责整理旧政权遗留的情报资料。他在任职期间编写了一套三卷本的《现代情报分析方法导论》，被识之律者纳入内部培训教材。他终生不参加任何政治活动，不发表任何公开言论。他的邻居只知道他是某个机关的老职员，每天早晨准时步行上班，喜欢在院子里养盆栽，对人客气而寡言。"
  roc.334.a: "继续"

  roc.335.title: "千岱芷 · 千岱芷是末代女皇蒋丽华的贴身护卫"
  roc.335.desc: "千岱芷是末代女皇蒋丽华的贴身护卫，千家的最后一任家主。千家是神州帝国的秘卫家族，世代掌管皇家内卫，以“世代誓约”效忠皇室。帝国覆灭时，她率残部在盛京流亡朝廷周围建立了最后一道防线。\n\n蒋丽华被俘后，流亡朝廷成员大多选择投降，千岱芷是少数几个战斗到最后的人。她没有投降。她带着剩下几名内卫在山林中继续抵抗了数月，最终因弹尽粮绝被围困在一处废弃的山神庙里。劝降的人在山下喊话，告诉她蒋丽华已经被安置，不会再受到伤害。她站在庙门口，把佩刀插在地上，用所有人都听得见的声音回答：“千家的誓约是保护皇帝。皇帝不需要保护了，我的任务就结束了。但我不会投降。投降是对誓约的侮辱。让我死在这里。”"
  roc.335.a: "继续"

  roc.336.title: "千岱芷 · 她最终力战被俘"
  roc.336.desc: "她最终力战被俘。当新政府的士兵冲进庙里时，她靠在供桌旁，重伤无法站立。她的佩刀断成两截，一截插在地上，一截握在她手里。她看着来人，没有恐惧，没有愤怒，只是轻轻说了一句：“告诉陛下，千家最后一任，没有给她丢人。”然后她闭上了眼睛。"
  roc.336.a: "继续"

  roc.337.title: "千岱芷 · 她没有死"
  roc.337.desc: "她没有死。卫生队的军医把她从供桌旁抬下来，缝合了最深的几处伤口，把她从失血昏迷的边缘拉了回来。她在战俘医疗站躺了很久，醒来时发现自己躺在一张干净的床上，手腕上缠着绷带。一个年轻的军医对她说：“你差点死了。”\n\n“为什么要救我？”\n\n“因为革命不杀俘虏。”军医低头在她的病历上写字，头也没抬，“而且你受了重伤。救你是医务人员的本分。”"
  roc.337.a: "继续"

  roc.338.title: "千岱芷 · 她被转送战俘营，在那里度过了数年"
  roc.338.desc: "她被转送战俘营，在那里度过了数年。她拒绝接受思想改造，拒绝在任何悔过书上签字。但她也不闹事，只是沉默地服从管理，完成分配给她的劳动任务。她打扫营区卫生时极为认真，晾晒被褥时每一个边角都要对齐，缝补衣物时针脚整齐得让管教干部都暗暗称奇。这些不是战俘营要求她做的，是她自己非要这样做。管教干部在她的评估表上写道：“服从管理，但思想顽固。劳动态度良好。建议继续观察。”后来她被转送普通监禁场所，继续服完刑期。出狱后她离开南京，去了一个没人知道她是谁的小县城，靠做针线活维生。据说她出嫁时，枕头下面压着的，是蒋丽华多年前给她的一条旧头绳。那是她的嫁妆，也是她唯一随身带走的旧物。"
  roc.338.a: "继续"

  roc.339.title: "农工民主党 · 农工民主党是苏维埃政权最天然的同盟军"
  roc.339.desc: "农工民主党是苏维埃政权最天然的同盟军，也是转型最顺利的民主派系。\n\n它的社会基础——自耕农、产业工人、进步学生——与苏维埃政权的阶级基础高度重合。苏维埃路线确立后，农工民主党被定性为“劳动人民的政治代表”，在统一战线中占据重要席位。党主席赤羽被任命为劳动人民委员会委员长，负责协调工农群众组织的日常工作。她的职责不是制定政策，而是在工厂和农村传达、解释党的政策，同时收集基层反馈。她在就职讲话中说：“我们曾经在国会上为工人农民说话。现在我们还是在为她们说话，只是说话的地方从议会辩论厅换成了工厂车间和田间地头。地方变了，任务没变。”\n\n农工民主党原有的激进派在苏维埃路线下找到了更广阔的空间。部分前中共党员出身的激进成员重新加入或转入党的组织系统，在五年计划的各条战线上担任技术或行政职务。一位曾经的激进派议员被分配到武汉钢铁厂担任工会副主席。她在给赤羽的信中写道：“我以前以为革命就是在议会里拍桌子。现在我知道，革命是让高炉准时出铁。我在这里很好。”"
  roc.339.a: "继续"

  roc.340.title: "致公党 · 致公党是苏维埃政权统一战线中最特殊的成员"
  roc.340.desc: "致公党是苏维埃政权统一战线中最特殊的成员。它的政治主张——“强省弱央，因地制宜”——在苏维埃的集中统一体制下失去了原有的政治土壤，但它的侨商网络和地方经济经验被苏维埃政权视为宝贵资源。\n\n党主席钟岚珠被任命为华侨事务委员会主任。她以个人信用和家族背景为担保，为苏维埃政权的工业化建设吸引南洋华侨投资。她在就职演说中说：“我这一辈子都在和地方、和商人、和海外华侨打交道。现在你们让我继续做这件事——用我的人脉，为新中国的工业化服务。我接受。不是因为我相信集中统一优于地方自治，而是因为我相信，让中国强大起来，比我个人的政治观点更重要。”\n\n致公党原有的地方自治主张在苏维埃体制下被转化为“民族区域自治”的研究和实践。钟岚珠利用自己在联省自治运动中的经验，参与了几个少数民族自治地区的筹建工作。她在一次内部会议上说：“我追求的是自治，不是分裂。自治的定义可以改变，但自治的价值不会改变。让一个民族自己管理自己——不管在什么制度下，这都是好事。”"
  roc.340.a: "继续"

  roc.341.title: "公民自由联盟 · 公民自由联盟是苏维埃政权统一战线中最需要"
  roc.341.desc: "公民自由联盟是苏维埃政权统一战线中最需要被改造的成员。它的自由主义立场与苏维埃的党国体制存在根本性的哲学分歧，但它在文化界和知识界的广泛影响力使其成为统一战线必须争取的对象。\n\n洛天依在苏维埃路线确立后，主动解散了公民自由联盟作为独立政治团体的组织架构，将其转型为苏维埃文化工作者协会。她在解散声明中写道：“我们的名字里有‘自由’两个字。自由在不同时代有不同的含义。在革命战争年代，自由是推翻压迫的自由。在建设年代，自由是参与建设的自由。公民自由联盟完成了它的历史使命。现在，我将以个人身份，继续用我的笔为中国文化建设服务。”\n\n她被任命为全国广播事业局局长，继续主持她创立的“收音机进万家”项目。她将广播网从城市扩展到农村，使偏远地区的农民也能收听到新闻、音乐和教育节目。她在全国广播网的启动仪式上说：“文化不是少数人的奢侈品。文化是每一个劳动者在收工之后应该拥有的精神食粮。我的工作，就是让这份食粮送到每一个人手里。”"
  roc.341.a: "继续"

  roc.342.title: "公车党 · 公车党是统一战线中最沉重的那一页"
  roc.342.desc: "公车党是统一战线中最沉重的那一页。它的前身是维新变法的保皇立宪派，在帝国覆灭后失去了君主这个政治坐标。苏维埃路线确立后，公车党面临一个根本性的选择：是继续抱着“复古维新”的旧纲领沉没，还是在新制度中找到重新定位。\n\n党首符华做出了决断。她在党内大会上说：“师父一生所求，是为古老帝国寻一条新生之路。帝国已经死了。但师父的路没有死——那条路是从过去走向未来。我们可以在苏维埃制度中找到我们的位置——不是作为君主制的遗民，而是作为传统文化的保护者。”"
  roc.342.a: "继续"

  roc.343.title: "公车党 · 公车党被重新定位为“传统文化保护与研究协会"
  roc.343.desc: "公车党被重新定位为“传统文化保护与研究协会”，符华被任命为全国文化遗产委员会副主任。她主持了第一次全国文物普查，编撰了《中国传统村落保护名录》。她在普查报告的序言中写道：“革命是改造旧世界，不是消灭过去。过去是我们的根。一个没有根的国家，走不了远路。苏维埃不是不要根——苏维埃是要把根扎在劳动人民的土壤里。我的工作，就是证明这个根可以扎得更深。”\n\n部分不愿接受转型的旧派成员选择了集体隐退。她们中的一些人在南京城郊的旧宅里继续撰写立宪君主制论著，但已经没有读者。符华没有阻止她们。她让人定期给她们送去纸张和墨水，在纸包上附了一张字条：“师父生前说过——每一个认真思考过中国命运的人，都值得被尊重。哪怕她的答案已经不是这个时代的答案。”"
  roc.343.a: "继续"

  roc.344.title: "青年党 · 青年党是苏维埃政权最需要提防"
  roc.344.desc: "青年党是苏维埃政权最需要提防、也最不得不尊重的反对派。它的民族主义立场——摆脱一切外国束缚、实现民族完全独立——与苏维埃政权的亲苏路线存在根本矛盾，但它在国防工业领域的技术专家群体是五年计划不可或缺的力量。\n\n青年党的代表人物汉阳造在苏维埃路线确立后，拒绝了她认为“一边倒”的亲苏外交政策。她在一份内部意见书中写道：“我支持五年计划，支持工业化，支持一切让中国强大起来的政策。但我不支持让苏联人替我们设计兵工厂。我们的枪，必须我们自己造。”她在兵工厂的办公室里挂着一幅手书的横幅，上面是她自己写的八个字——“德意志械，华夏匠心”。这八个字没有政治倾向，但每一个看到它的人都知道它是什么意思。"
  roc.344.a: "继续"

  roc.345.title: "青年党 · 蒋巾帼没有因为她的政治立场而撤换她"
  roc.345.desc: "蒋巾帼没有因为她的政治立场而撤换她。她在她的意见书上批注：“汉阳造同志在政治上不对，但在技术上对。我们需要她的技术。给她空间，让她证明自己的观点——中国造的枪，能不能比苏联造的更好。”汉阳造后来主持了国产步枪的研制项目，她的设计图纸上从不标注任何苏联标准。她在项目验收时说了一句话：“这支枪，从头到脚都是中国造的。苏联人可以来看，但她们只能看。我们不欠她们什么。”"
  roc.345.a: "继续"

  roc.346.title: "立宪民主党 · 立宪民主党是苏维埃路线确立后最早解散的党"
  roc.346.desc: "立宪民主党是苏维埃路线确立后最早解散的党派之一。它的自由主义宪政理想与苏维埃体制完全对立，它的精英基础——城市中产阶级和温和知识分子——在统一战线中找不到明确的定位。苏维埃政权没有取缔它，但它自己选择了体面退场。\n\n党内的激进派曾试图继续维持组织存在，但温和派主导了最终决策。在最后一次中央委员会上，温和派代表发表了一篇简短声明：“我们曾经相信议会民主可以拯救中国。历史给了我们证明这个信念的机会，我们没有成功。不是信念错了，是我们没有能力实现它。今天，中国的道路已经由人民选择。我们尊重这个选择。立宪民主党从今天起停止活动。”"
  roc.346.a: "继续"

  roc.347.title: "立宪民主党 · 部分成员以个人身份加入了文化"
  roc.347.desc: "部分成员以个人身份加入了文化、教育或行政部门，在苏维埃体制内继续工作。他们没有成为反对派，也没有成为宣传工具。他们只是一群曾经相信另一种道路的人，在新的道路上继续做着他们擅长的事——教书、写文章、做行政。一位前立宪民主党成员在中学的历史课堂上被学生问到“老师你以前是哪个党的”，他沉默了片刻，然后说：“老师以前相信议会。后来议会没有了，老师就回来教书了。教你们怎么思考。不是教你们相信什么。”"
  roc.347.a: "继续"

  roc.348.title: "帝国宪政会 · 帝国宪政会的前身是尊王派"
  roc.348.desc: "帝国宪政会的前身是尊王派，在帝国覆灭后从“保皇护国”转向“君主立宪”，试图在宪政框架下为君主制保留一席之地。苏维埃路线确立后，君主立宪的任何可能性都彻底消失。帝国宪政会在统一后自行宣布解散，其解散声明只有一句话：“国体已定，宪政无君。帝国宪政会即日起停止一切活动。”\n\n部分成员加入了公车党转型后的文化保护团体，在文物保护、传统村落普查等非政治领域继续工作。大部分成员选择了完全的隐退。她们的最后一次集体露面是在蒋丽华正式放弃皇室身份的那一天。那天，一群白发苍苍的老人站在南京的细雨中，对着紫禁城的方向深深鞠了一躬。然后她们各自散入小巷，没有人知道她们的名字。其中一位老人走的时候，旁边的人听到她说了一句话：“先帝，臣等尽力了。”然后她撑开伞，消失在雨中。"
  roc.348.a: "继续"

  roc.349.title: "保皇救国同盟 · 保皇救国同盟是袁克定独揽帝国大权时期"
  roc.349.desc: "保皇救国同盟是袁克定独揽帝国大权时期，由仍效忠皇室的宗室、旧官僚和贵族组成的联合体。她们的核心诉求是驱逐北方军阀、恢复皇帝实权。苏维埃路线确立后，这个组织的性质被定性为“封建复辟势力”，主要头目被依法逮捕并判处监禁。她们的罪名不是“保皇”——苏维埃宪法不惩罚思想——而是“在帝国覆灭后继续组织非法武装、策划颠覆活动”。\n\n审判是公开的。法庭上宣读的证据包括她们与袁克定秘密联络的密电原文、她们在各地秘密囤积武器的清单、以及她们计划在统一后发动反攻的作战地图。主要头目在庭上认罪。她说：“我效忠的不是旧制度，是我的皇帝。皇帝已经不在了。我的罪，我认。”"
  roc.349.a: "继续"

  roc.350.title: "保皇救国同盟 · 基层追随者在登记悔过后被释放"
  roc.350.desc: "基层追随者在登记悔过后被释放，条件是不再参与任何政治活动。宋庆龄在内部批示中写道：“保皇救国同盟是旧时代的殉葬品。她们的皇帝已经成了纺织厂的学徒，她们的宫殿已经成了工人俱乐部。让她们回到各自的家乡，靠劳动养活自己。劳动会让她们明白——她们曾经效忠的那个制度，从来不需要她们。而新的制度，可以接纳每一个愿意诚实劳动的人。”"
  roc.350.a: "继续"

  roc.351.title: "土地赎买 · 公告是秋分那天贴出来的"
  roc.351.desc: "公告是秋分那天贴出来的。白纸黑字，盖着县苏维埃的大红印章，贴在打谷场边的布告栏上。布告栏以前是贴地租催缴单的，陈老爷家的管家每到秋收就骑着骡子来贴一张，上面写着“逾期不交，利滚利”。现在那张发黄的催缴单被新公告严严实实盖住了，只从纸边露出半个“利”字。李四蹲在布告栏前，他已经蹲了很久，手里捏着一根草茎，嘴里反复嚼着几个刚从公告上学到的词——“赎买”“贷款”“地契”。\n\n他今年三十出头，爹娘死在逃荒路上，留下三亩坡地，土改后一直种着。但那三亩地的地契上写的不是他的名字，是陈老爷的名字。土改工作队说，这地暂时分给他种，等以后政策明确了再说。这一“暂时”就是好几年。他每年秋天打下稻谷，总留出一小堆放在仓角最深处——那是他攒着准备交地租的，尽管土改后再也没有人向他收过租，但他总觉得这地还不是自己的，迟早有人要来收钱。现在公告上写得明明白白，政府出钱从地主手里把地买过来，再以低息贷款的方式转让给农民，分多年还清，还清后地契就改成农民的名字。"
  roc.351.a: "继续"

  roc.352.title: "土地赎买 · 李四，你还蹲在这儿呢"
  roc.352.desc: "“李四，你还蹲在这儿呢？”隔壁王婶挎着菜篮路过，见他蹲在那儿发愣，凑过来看了一眼公告。“这上面写的什么？你识字，念给我听听。”\n\n李四把嘴里的草茎吐出来，一个字一个字地念。念到“地契归农户所有”时，王婶把菜篮往地上一放，蹲下来仔细看那张纸，好像能从那些她不认识的字里看出花来。她问：“那就是说，地以后真是咱们的了？不是陈老爷的了？”李四说是。王婶又问：“贷款是什么？”李四说就是政府借钱给咱们，买地，以后慢慢还。王婶点了点头，站起来拍拍膝盖上的土，说：“我家那几亩地，我也想赎。你带我去信用社。”"
  roc.352.a: "继续"

  roc.353.title: "土地赎买 · 信用社设在乡公所隔壁"
  roc.353.desc: "信用社设在乡公所隔壁。李四走进信用社那天，手心全是汗。他从没见过信用社里面是什么样，只听说那里坐着穿中山装的人，手里有算盘，算盘一响就要收利息。他在门口站了很久，把裤腿上沾的泥巴蹭了又蹭，才敢推门进去。\n\n里面只有一张桌子，桌上放着一本厚厚的表格簿，一个年轻的女办事员正在埋头核对数据。她抬起头，冲他笑了一下，说老乡你有什么事。李四把公告摊在桌上，指指“赎地贷款”那几个字，说我想要这个。办事员从抽屉里拿出一份表格，一项一项问他——姓名、住址、几口人、几亩地、地主是谁、地契还在不在。他一一回答，说到地主名字时声音不自觉地压低了，几乎是耳语，好像陈老爷的鬼魂还蹲在墙角听。办事员在表格上逐项填写，然后把表格转过来，递给他一支笔，说在这里签个字。"
  roc.353.a: "继续"

  roc.354.title: "土地赎买 · 李四接过笔"
  roc.354.desc: "李四接过笔。他不会写自己的名字，但他上过几天扫盲班，知道怎么用笔。他用拇指蘸了印泥，在签名栏按下一个红手印。手印按得很重，印泥渗进了指纹的沟壑里，他抬起手时纸面上还留着一圈螺纹的印痕。他问什么时候能批下来，办事员说一周左右。他走出信用社时，天已经快黑了，晚霞映在水田里，满垄金光。王婶坐在田埂上等他，见他出来，站起来问：“你进去了那么久。”李四说：“表格多。”王婶问：“能批吗？”李四说：“她说一周左右。”王婶把手在围裙上擦了擦，说：“那我也去。”\n\n两人并肩往回走。田埂很窄，只能一前一后。暮色渐沉，远处村小的广播正播送晚间新闻，声音忽远忽近。王婶忽然问李四，等拿到地契，第一件事想干什么。李四想了想，说他想把地契贴在家里灶台上方，每天煮饭时看一眼。王婶说那油烟气会把地契熏坏的。李四说熏坏了也值，熏坏了说明他每天都有饭煮。"
  roc.354.a: "继续"

  roc.355.title: "土地赎买 · 一周后，李四拿到了贷款批复单"
  roc.355.desc: "一周后，李四拿到了贷款批复单。他把钱数了又数，每一张钞票都捻开看过，然后揣进怀里，手一直按着胸口的位置。他走进陈家大院时，陈老爷坐在堂屋的太师椅上，身后八仙桌上摆着笔墨和地契。这位昔日的大地主如今只剩下一座空荡荡的院子，佃户们早就不来了，田地也被政府登记在册。李四把钱放在桌上。陈老爷没有说话，只是慢慢地把地契推过来，然后拿起那叠钞票，一张一张地点。点完，他在登记簿上签了字，把地契递给李四。他的手枯瘦，指节微微发颤。李四接过来，低头一看，地契上“所有权人”那一栏填的是他的名字，他的住址，他的人口数，他那三亩坡地的面积和四至。他用手指沿着自己的名字一笔一划地摸过去——那些笔画他认不全，但他知道那两个字就是他。他把地契揣进怀里，转身走出陈家大院。走到院门口时他停了一下，但没有回头。他说：“陈老爷，地我还给你了——不是还，是买。是我自己买的。”陈老爷坐在太师椅上，望着空荡荡的院子，没有说话。"
  roc.355.a: "继续"

  roc.356.title: "土地赎买 · 李四回到家，没有把地契贴在灶台上方"
  roc.356.desc: "李四回到家，没有把地契贴在灶台上方。他找了一块旧木板，把地契平平整整地裱在上面，挂在堂屋正墙上——就是以前供祖宗牌位的位置。他站在门槛外望着那面墙，灶膛里的火光映在裱好的地契上，纸面微微发暖。他想起他爹，想起他娘，想起那些在逃荒路上倒下去就再没起来的人。他想跟他们说，地是咱们的了。不是陈老爷的，是咱们的。贷款他会还，每年还一点，还完了，地就永远是咱们的了。他还会让儿子继续还，孙子继续还——不是为了还债，是为了让这张纸上一直印着他们家的名字。窗外秋虫啾鸣，他搬了条矮凳坐在门槛上，看着暮色一寸一寸从田野上漫过来，手心里还留着印泥的那圈红痕。"
  roc.356.a: "继续"

  roc.357.title: "赎地 · 公告是秋分那天贴出来的"
  roc.357.desc: "公告是秋分那天贴出来的。白纸黑字，盖着国民政府的大红印章。李四蹲在布告栏前看了整整一个上午。公告上说，政府出台了《土地赎买条例》，地主手里的地由政府出面向地主赎买，再以低息贷款的方式转让给农民。贷款分多年还清，还清后地契就改成农民的名字。李四把嘴里嚼烂的草茎吐出来，站起来拍了拍膝盖上的土。他想起土改那年工作队把地分给他种，但地契上写的还是陈老爷的名字，工作队说等以后政策明确了再说。这一等就是好几年。现在政策终于明确了。\n\n他走进乡公所隔壁的信用社，手心全是汗。办事员是个戴眼镜的年轻人，递给他一份表格，一项一项问他。李四一一回答，然后用拇指蘸了印泥，在签名栏按下一个红手印。一周后，贷款批复下来了。他把钱揣进怀里，走进陈家大院。陈老爷坐在太师椅上，把地契推过来，然后拿起那叠钞票一张一张地点。李四接过地契，低头一看，“所有权人”那一栏填的是他的名字。他把地契揣进怀里，转身走出陈家大院。走到院门口时他停了一下，但没有回头。"
  roc.357.a: "继续"

  roc.358.title: "赎地 · 隔壁王婶也贷了款，赎了她家那几亩水田"
  roc.358.desc: "隔壁王婶也贷了款，赎了她家那几亩水田。村里好几户人家都贷了，大家都觉得这是好事——地是自己的了，贷款慢慢还，利息也不高。李四每天晚上睡觉前都要把地契从枕头底下拿出来看一眼，虽然他认不全上面的字，但他知道那张纸上的名字是他。\n\n然而，李四不知道的是，他赎地的那笔钱，并没有全部到陈老爷手里。\n\n《土地赎买条例》规定，地价由县土地评估委员会核定，赎买资金由县财政拨付，贷款由县信用社发放。从核定到拨付到发放，中间要经过好几道手。每一道手都有人在刮油。\n\n陈老爷拿到的那叠钞票，比土地评估委员会核定的价格少了一截。差额去了哪里，陈老爷心里清楚，但他没有说话——他能拿到这些已经是万幸了，至少比隔壁县那个一分钱没拿到还被关进大牢的地主强。他坐在太师椅上，把那叠钞票又数了一遍，然后锁进抽屉最深处，叹了口气。管家端茶进来时瞥了一眼抽屉，陈老爷说了一句“比以前收租子少多了”，然后起身走到堂屋门口，望着空荡荡的院子，院子里连个佃户的影子都没有了。"
  roc.358.a: "继续"

  roc.359.title: "赎地 · 县政府的办公室里，张科长正在算账"
  roc.359.desc: "县政府的办公室里，张科长正在算账。他是土地评估委员会的副主任，负责核定全县地主土地的价格。他核定的价格比省里建议的标准高出一截——高出那一截，他和几个经手的官员分了。他的理由是地有好坏，肥田当然要比瘦田贵，这是符合市场规律的。至于肥田和瘦田怎么区分，标准在他手里，他说了算。\n\n分钱的方式很隐蔽。银行放款时把一笔钱转到一家农机公司的账上，那家农机公司的法人代表是张科长的小舅子。公司没有卖过一台农机，但账面上显示“土地评估咨询服务费”，合法合规。张科长的小舅子每个月从公司账上取现金，分装进几个牛皮纸信封，分别送到几个官员家里。信封上不写名字，只写数字——每个人都有一个编号。张科长是“一号”。"
  roc.359.a: "继续"

  roc.360.title: "赎地 · 信用社的办事员也在分钱"
  roc.360.desc: "信用社的办事员也在分钱。每发放一笔赎地贷款，他就在利息上加点——不多，只加几厘。贷款合同上印的是标准利率，但他会在还款计划表里动手脚，把利息算高一点。来贷款的农民不识字，看不懂合同，也不会算利息。他们只知道贷款能让他们赎地，至于利息是多少，他们信政府。办事员把多收的利息单独记账，每个月和几个同事分一次。他分到的钱不多，但胜在细水长流——全乡那么多贷款户，每一户都多交一点，积少成多，比他的工资高多了。他每天下班时把分到的钱用橡皮筋扎好，塞进公文包最里面的夹层。回到家里，他把钱放在桌上，妻子问他今天怎么又多了一点，他说是奖金。"
  roc.360.a: "继续"

  roc.361.title: "赎地 · 省城的银行经理也在分钱"
  roc.361.desc: "省城的银行经理也在分钱。赎地贷款的资金来源是省财政拨款，但省财政一时拿不出那么多现金，就让银行先垫付。银行垫付的利息是向省财政收的，但银行经理在垫付协议里加了一条“资金占用费”，费率比正常利息高出一大截。省财政的人签协议时不是没看到这一条，只是负责人和银行经理是老同学，睁一只眼闭一只眼。多收的那部分资金占用费，银行经理和那位老同学按比例分成。他们的分成不谈具体数字，只是逢年过节互相送点礼品，送着送着，经理的新车就停在了银行大门口。同事问起来，他说是贷款买的——没有说是用谁的贷款。\n\n李四不知道这些。他只知道他赎了地，地契上写的是他的名字，他每年要还贷款。贷款利息比他当初在信用社看到的那个数字高了一些，他不知道为什么，只当是自己记错了。他每天天不亮就下地，天黑了才回来，一锄一锄地刨着那几亩坡地。秋天打下稻谷，他先把要还贷的那部分留出来，单独装在一个麻袋里，放在仓角最深处。那个麻袋比别的麻袋都重——不是因为稻谷多，是因为里面装着他不知道的债。"
  roc.361.a: "继续"

  roc.362.title: "赎地 · 风调雨顺又一年"
  roc.362.desc: "风调雨顺又一年。李四蹲在田埂上，看着坡地上的稻穗在秋风里翻着金浪。他把手伸进地里，抓了一把土，放在鼻子下面闻。土是好的，稻是好的，只是他不知道那把土下面埋着什么。一个老农扛着锄头从田埂上走过，对他点了点头，他也点了点头。地里的稻穗沉甸甸地垂着头，风从坡上吹下来，吹得稻浪沙沙作响。他站起来，把烟头摁灭在鞋底，扛起锄头往家走。堂屋里那块裱在地契上的木板还挂在正墙上，灶膛里的火光映在上面，把他的名字照得忽明忽暗。他这辈子只知道种地、还贷、种地、还贷。他只知道那张纸上有他的名字。别的，没人告诉他。"
  roc.362.a: "继续"

  roc.363.title: "外贸 · 南京国民政府外贸委员会的办公室里"
  roc.363.desc: "南京国民政府外贸委员会的办公室里，蒋巾帼站在一幅巨大的世界地图前，手指从北美划到南美，再划到东南亚。“我们缺粮。不是缺一点，是缺很多。工业化需要工人，工人不种地，粮食从哪里来？不能从地里变出来，那就从海外买进来。用外汇买。外汇从哪里来？用经济作物去换。我们种棉花，种茶叶，种桐油，种生丝，卖给外国人，换回来的外汇买粮食、买机器、买石油。这是唯一的路。”\n\n他的逻辑无懈可击。与会者纷纷点头，笔记本上沙沙地记着。宋姊雯代表财政部表态：“外汇储备目前还撑得住，但长期来看必须扩大出口。我建议在长江中下游几个产棉大县试点，把一部分粮田改种棉花，由农会统一收购，统一出口。”陈光甫扶了扶金丝眼镜，补充道：“进口粮食的渠道已经打通了。美国面粉、暹罗大米、澳洲小麦，价格比国内便宜。我们可以先签一年合同，如果国内粮食增产了再减少进口量。”\n\n文件很快变成政策。政策很快变成现实。"
  roc.363.a: "继续"

  roc.364.title: "外贸 · 半年之内，第一批外国粮食运抵上海港"
  roc.364.desc: "半年之内，第一批外国粮食运抵上海港。美国面粉、暹罗大米、澳洲小麦，麻袋在码头上堆积如山。各大城市的粮店里，进口大米的价格比本地米便宜一截。市民们起初将信将疑，后来发现这些洋米虽然口感不如本地米，但确实便宜，便开始排队购买。报纸上刊登着大幅照片——码头工人扛着印有英文标识的麻袋，标题写着“洋米入沪，市民争购”。社论说，这是国民政府为平抑粮价、保障城市供应采取的有力措施，是经济现代化的必经之路。"
  roc.364.a: "继续"

  roc.365.title: "外贸 · 李四在村里也听到了广播"
  roc.365.desc: "李四在村里也听到了广播。广播里说，政府号召农民多种经济作物，棉花价格好，种棉花比种稻子划算。县政府派了技术员下乡，在打谷场上给农民们宣讲。技术员说改种棉花政府给补贴、给种子、给化肥，统一收购，不愁销路。有人在人群里小声嘀咕说不种稻子吃什么。技术员显然有所准备，指着黑板上的数字解释道：“种一亩稻子，收几百斤谷，卖不了多少钱。种一亩棉花，政府统一收购，赚的钱能买更多的米。这叫比较优势，懂吗？你们只管种，粮食政府会从外国买，亏不了你们。”台下的农民面面相觑，“比较优势”这个词从县城来的技术员嘴里蹦出来，陌生得像一门外语。李四把手里的烟头摁灭在鞋底，站起来问：“那万一外国米涨价了呢？万一人家不卖给咱们了呢？”技术员被他问得愣了一下，但政策宣讲会不是辩论会，他很快恢复了职业的微笑，拍拍手上的粉笔灰说这个上头会考虑的，大家信政府就好。\n\n李四没有改种棉花。他还是种稻子。他把稻谷收进仓里，堆得满满的，然后蹲在田埂上看着邻居们把稻田翻了改种棉花。他不信政府会一直买外国米，他信自己的粮仓。但像他这样想的农民不多。更多人的想法很简单——种棉花能赚钱，赚了钱再买米。他们信了技术员的话，也信了那个在报纸上不断出现的外国面粉广告。"
  roc.365.a: "继续"

  roc.366.title: "外贸 · 改种经济作物的第一年，情况确实不错"
  roc.366.desc: "改种经济作物的第一年，情况确实不错。棉花价格高，统购款按时发放，农民手里有了闲钱，洋米也确实按时运到了。县城的粮店前排着队，大家拿现钞买洋面，粮店老板把成袋的面粉码在店门口当广告，口袋里多出来的钱还够扯几尺布、称两斤肉。\n\n但第二年就出事了。\n\n天时不好，棉花歉收，价格倒没有跌——因为全国的棉花都歉收，但农民手里没有多余的棉花可以卖，统购款自然少了。更要命的是，国际粮价偏偏在同年大涨。暹罗大米的到岸价比去年翻了一倍还多，美国面粉也涨了六七成。政府拿外汇去填，填了几个月就填不动了。财政部的官员们把算盘打得噼啪响，最后得出一个结论：补贴不起。\n\n粮店里的进口大米价格开始往上涨。先是涨了一点，后来涨得比本地米还贵。市民们发现排队也买不起，粮店门口的队伍越排越长，吵嚷声越来越大。广播里仍然在说“政府正在积极调配粮食”，但粮仓里的存粮确实在一天天减少。"
  roc.366.a: "继续"

  roc.367.title: "外贸 · 李四蹲在田埂上"
  roc.367.desc: "李四蹲在田埂上，看着邻居们把枯黄的棉秆从地里拔出来。今年棉花收成不好，统购款还不够买种子。他们想去买粮食，但粮店里的米面已经贵得让人手抖。一个邻居蹲在地里，用手扒拉着那些枯死的棉秆，嘴里念叨着说要是不听技术员的就好了，要是去年多种几亩稻子就好了。李四从他身后走过，把自己家的米袋子放在邻居的地头，什么也没说。那个人抬起头看着他，眼眶红红的，嘴唇嚅动了一下，又低下头去，把一根棉秆慢慢捋直，像是在做一件完全没有用但必须做的事。"
  roc.367.a: "继续"

  roc.368.title: "外贸 · 县政府大楼里，张科长的办公室烟雾缭绕"
  roc.368.desc: "县政府大楼里，张科长的办公室烟雾缭绕。他是农业局的副局长，去年推广棉花种植立了功——报上去的种植面积超额完成指标，省里表扬他是“经济作物推广先进个人”。今天他坐在办公桌前，刚收到省里发来的粮食调拨申请单。单子上的数字很大，但仓库里的存粮数字很小。他拿起电话打给县长：“县长，粮库里的存粮只够这个月的了。下个月如果再没有粮食调进来，咱们县就得饿死人。”县长沉默了片刻，说：“我知道了。你先把申请报上去，我去找省里。”张科长挂掉电话，把那张粮库报表翻过来扣在桌上。报表的背面是他去年写的经济作物推广总结报告草稿，末尾还有一行当时得意之下加的批注——“成效显著，可全县推广。”\n\n李四回到家里，把堂屋里那块裱着地契的木板看了很久。灶膛里的火光照在上面，把他的名字映得忽明忽暗。他走到后院粮仓，打开仓门，看着堆得满满的稻谷，然后关上门，插上门闩。他不需要买外国米。他种的是稻子。\n\n蒋巾帼站在总统府的会议室里，窗外梧桐叶落尽，冬日的阳光苍白地照在会议桌上。他刚刚签署了一份文件，标题是《地方自治促进条例》。这份条例的核心内容只有一条：在各县各乡组织乡贤会，由本地德高望重之士担任乡贤，协助政府管理基层事务。"
  roc.368.a: "继续"

  roc.369.title: "乡贤 · 中国太大了"
  roc.369.desc: "“中国太大了。”她放下笔，对坐在对面的内政部长说，“中央的政令到了县里，县里到了乡里，乡里到了村里，早就变了味。我们需要一群人——不是官僚，不是党员，是本地人。她们了解当地的风土人情，知道谁家几亩地、谁家几个娃，说的话比县长还管用。这就是乡贤。把基层的事交给乡贤去管，政府只需要管住大政方针和县长任命。这是训政时期最有效率的治理模式。”\n\n内政部长将条例草案带回部里，逐条细化后下发各省。乡贤会如雨后春笋般在全国各县乡成立起来。乡贤由当地推荐，县政府审核任命。乡贤的职责包括调解民间纠纷、协助征收赋税、组织公共工程、监督地方治安，以及在乡公所经费不足时先行垫付。作为回报，乡贤在地方事务中享有实际上的决策权，县政府对她们的日常管理一般不予干涉。"
  roc.369.a: "继续"

  roc.370.title: "乡贤 · 陈家大院的陈老爷便是首批被任命为乡贤的人"
  roc.370.desc: "陈家大院的陈老爷便是首批被任命为乡贤的人之一。任命书送到他手里那天，他把那张盖着县政府大印的纸看了又看，然后端端正正地挂在堂屋正墙上——就挂在蒋介石肖像的旁边。那张纸上的每一个字他都认识，但组合在一起的意思让他觉得有些不真实：他，一个土改后只剩下空荡荡院子的旧地主，现在又成了“乡贤”。他说不清这是时来运转还是风水轮流转，但他知道一件事：这个任命是县里张科长亲自送来的，而张科长是他的远房亲戚。\n\n乡公所设在旧祠堂里。乡贤们围坐在八仙桌前开会，讨论的都是实实在在的事。谁家儿子不孝，谁家地界不清，谁家偷偷在山上多开了几分荒地没上报。以前这些事归保甲长管，但保甲长要么是外乡派来的，要么是和某家有仇的，要么是一天到晚应付上级填表根本没空管事。乡贤不一样——他们就是本乡人，知道谁家几亩地、谁家几个娃、谁家和谁家是世仇又是姻亲。他们断的案子不一定合法，但一定合情。这种“情理治理”的效果，比县法院的判决更让本地人服气。"
  roc.370.a: "继续"

  roc.371.title: "乡贤 · 修路也是乡贤们牵头"
  roc.371.desc: "修路也是乡贤们牵头。乡贤们挨家挨户收钱，收的是“修路捐”。有钱的出钱，没钱的出力。路修好了，乡贤的名字刻在路碑上。那块碑立在村口的老槐树下，阳光好的时候孩子们把它当爬上爬下的玩具，但每逢清明，总有老人指着碑上的名字对年轻人说：“这条路，是陈老爷他们修的。以前这条路是泥巴路，下雨天连牛都陷进去。”\n\n赋税征收也比以前顺了。以前县里派人来收税，农民躲在山上装不在家。现在乡贤去收——不是以官差的身份，是以长辈的身份。谁家今年收成不好，乡贤心里有数，在摊派之前会替他说几句话，让他少交一些。拖欠税款的人家，乡贤先替他垫上，等他把猪卖了再还。欠税的人千恩万谢，逢年过节自然忘不了提两瓶酒去乡贤家坐坐。欠的人情不好用数字来算，但乡贤们心里都有本账。"
  roc.371.a: "继续"

  roc.372.title: "乡贤 · 陈老爷家的院子又热闹起来了"
  roc.372.desc: "陈老爷家的院子又热闹起来了。以前这院子冷清了很久，土改后佃户们不来了，地也没了。现在乡贤们在他家堂屋里议事，八仙桌上铺着新拟的乡规民约草稿，茶是今年的新茶，烟是县城买的好烟。他坐在太师椅上，听乡邻们汇报今年的收成和纠纷，偶尔插一句“这事我来办”，声音不大，但分量很重。他已经不是地主了，但他又成了“陈老爷”——不是地主的称呼，是乡贤的称呼。他自己有时也分不清这两者有什么区别，只是觉得堂屋里那张乡贤任命书越来越亮，亮过了旁边蒋介石肖像的铜版纸。\n\n然而，“乡贤”这两个字在不同的地方有不同的面孔。"
  roc.372.a: "继续"

  roc.373.title: "乡贤 · 在邻省某县，乡贤会的实权落在一个叫刘三泰"
  roc.373.desc: "在邻省某县，乡贤会的实权落在一个叫刘三泰的人手里。此人年轻时在上海滩混过帮会，后来回乡买了几百亩地，成了当地最大的地主。土改时他的地被分了，但不知为何县政府里有人替他说了话，只分了一部分。此次推行乡贤会，他自然被“推荐”为乡贤会长。他上任后做的第一件事，是把原来的保长和甲长全部换成自己的人。第二件事，是把乡公所的账目接手过来。第三件事，是向全乡农户按人头摊派“乡贤维持费”——每户每年交钱，不交钱的就“依法追缴”。他手下养着一批从县城雇来的“调解队”，穿着对襟短褂，腰间鼓鼓囊囊。谁家欠了维持费，调解队上门“调解”。调解不成的，这家人在村里就办不成任何事——路不让修，水不让放，孩子上学也会遇到莫名的困难。"
  roc.373.a: "继续"

  roc.374.title: "乡贤 · 王婶家就遇到了这种事"
  roc.374.desc: "王婶家就遇到了这种事。她男人前年病死了，她一个人拉扯两个孩子种几亩水田，日子过得紧巴巴的。今年她实在交不上那笔维持费了。第二天刘三泰的调解队就上了门，两个穿对襟短褂的人往她家堂屋一站，也不说话，只是把她家养的那只下蛋的母鸡从鸡笼里捉出来，说这只鸡抵这个月的维持费。王婶拦在门口说鸡还指着它给孩子换本子，调解队的人把鸡往背后一别，说那就早点交费。她追到门口，看着那两个人提着鸡沿着田埂扬长而去。那只鸡是她家唯一一只下蛋的母鸡，每天清晨都会准时蹲在鸡窝里，下完蛋咯咯地叫。今天早晨她推开鸡窝，空荡荡的，只有几根鸡毛粘在稻草上。她蹲在鸡窝前，把那些鸡毛一根一根捡起来，捏在手里。\n\n李四听说了这件事。他蹲在田埂上，闷着头抽了好一阵烟，然后说：“乡贤？什么乡贤。以前收租子的是陈老爷，现在收维持费的是刘老爷。换了个名字，还是那个人。不对——人换了，更狠了。”他把烟头狠狠摁灭在鞋底。他想起自己那张赎地贷款合同，想起张科长办公室里那个牛皮纸信封，想起王婶家那只被捉走的母鸡。他是幸运的——他乡里的乡贤是陈老爷那种人，虽然算不上什么好人，但至少不会明抢。但幸运这个词让他心里发苦。什么叫幸运？幸运就是碰到的乡贤不那么坏。"
  roc.374.a: "继续"

  roc.375.title: "乡贤 · 他站起来，拍拍膝盖上的土，往村里走"
  roc.375.desc: "他站起来，拍拍膝盖上的土，往村里走。他要去看看王婶，看看她家今天还有没有鸡蛋做饭。他口袋里揣着两个自家母鸡刚下的蛋，用旧报纸包着，还温热。走到王婶家门口时他看见她正蹲在门槛上缝补一件孩子的旧衣裳，针脚又细又密。她把那两个鸡蛋接过去，没有说谢谢，只是在围裙上擦了擦手，转过身去往灶膛里添了一把柴。火光照在她脸上，李四看到她眼角有细密的皱纹，像干涸的稻田里那些纵横交错的裂缝。"
  roc.375.a: "继续"

  roc.376.title: "乡贤 · 张科长坐在县城自己的办公室里"
  roc.376.desc: "张科长坐在县城自己的办公室里，手里拿着一份乡贤会的工作报告。报告是陈老爷写的，字迹工工整整，内容无非是今年调解了多少纠纷、修了多少路、收了多少捐。张科长没有细看，他只看数字——修路的经费数字和实际收到的捐款数字，中间有一截差额。他拿起电话打给陈老爷，语气很亲切：“老陈啊，报告我看了。辛苦了。你们乡贤会是全县的先进典型，下个月省里要开表彰会，你去发言。发言稿我让人给你写好，你照着念就行。另外那个修路捐，你留一半在乡里做日常开支，另一半交到县里来。账做好看些。”\n\n陈老爷挂掉电话，坐在太师椅上，端起茶杯喝了一口。茶已经不烫了，正好入口。他知道张科长在中间拿钱——修路捐被抽成，他比谁都清楚。但他已经不想多嘴了。他现在是“先进典型”，下个月要去省里开会。那张乡贤任命书在墙上闪着暗金的光。他忽然想起很多年前，他还是地主的时候，每年秋天收完租子也会去县城开会，坐在县商会的会议室里和别的士绅一起听县长训话。那时的县长姓什么他记不清了，只记得他说话时嘴角总是微微上翘，像是闻到了什么难闻的味道。现在县长姓什么他也不在乎。他只是端起茶杯，轻轻吹开浮在面上的茶叶，又喝了一口。茶是今年新采的明前茶，味道正浓。窗外，夕阳从梧桐枝桠间漏下来，把整座院子都染成了暖黄色。远处传来修路工地的号子声，那条路的路碑上很快就会刻上他的名字，和这块碑一起，被阳光照着，被孩子们踩着，被老人们指着。而账本上的那些数字，也会像秋天梧桐叶一样，悄无声息地落下，被风卷走。"
  roc.376.a: "继续"

  roc.377.title: "新生活 · 蒋巾帼站在南京中央军校的操场上"
  roc.377.desc: "蒋巾帼站在南京中央军校的操场上。他的身后是一幅巨大的标语——“新生活、新国民、新中国”。操场上站满了从各省市抽调来的青年干部，他们穿着统一的蓝布工装，左臂佩着袖章，上面印着“新生活运动指导员”几个字。风很大，吹得旗帜猎猎作响。他没有戴帽子，头发被风吹得有些乱，但他的站姿纹丝不动。"
  roc.377.a: "继续"

  roc.378.title: "新生活 · 新生活运动不是让你们把衣服穿整齐就完了"
  roc.378.desc: "“新生活运动不是让你们把衣服穿整齐就完了。衣冠整齐只是第一步。第二步是思想整齐，第三步是行动整齐。一个国民，要懂得礼义廉耻，要遵守公共秩序，要讲究卫生习惯。随地吐痰、大声喧哗、不排队、不讲卫生——这些不是小事，是国民素质的表现。一个连排队都不会的民族，怎么配当强国？”\n\n他亲自为新生活运动制定了行为规范。不随地吐痰，不在公共场所大声喧哗，排队购物，衣冠整洁。这些规范被印成小册子，在全国各地免费发放。各省各县都成立了新生活运动促进委员会，由县长亲自担任主任。街道上设立了“新生活劝导员”，戴着红袖章，看到有人随地吐痰就上前劝导，看到有人插队就当众纠正。学校、工厂、机关、军营，到处都在组织学习新生活运动的小册子。商店门口贴着“新生活运动示范店”的标牌，工厂里组织工人集体刷牙洗脸，军队里把整理内务列为日常训练科目。"
  roc.378.a: "继续"

  roc.379.title: "新生活 · 成效是显著的"
  roc.379.desc: "成效是显著的。南京的街道确实比以前干净了。随地吐痰的人越来越少，乱扔垃圾的也越来越少。公共场所的秩序比以前好了不少。外国记者在报道中写道，中国正在进行一场“国民素质的革命”。但在这整齐划一的秩序之下，渐渐也滋生出另一些东西。\n\n在武汉，一位老秀才因为在茶馆里大声谈论时局、嗓子粗了些，被新生活劝导员当场拦下，以“公共场所喧哗”为由带到派出所写了检讨。老秀才回家后气得摔了茶杯，第二天还是老老实实把检讨书交到了茶馆门口贴着的新生活运动宣传栏上。在长沙，一个女学生因为穿裙子骑自行车被学校通报批评，理由是“姿势不雅”，虽然行为规范里并没有关于骑自行车的条款，但校长认为骑自行车时裙子被风吹起来，影响风化。在上海租界边上，一户在弄堂里晾晒衣物的人家被邻居举报——衣架上女人的内衣正对着邻家窗口，举报者说不雅观，他母亲看了血压高。街道办的工作人员上门，把晾衣架移到了楼道另一侧。女人收衣服时发现衣架被人动过，嘀咕了好一会儿，但此后每次晾晒前都会探头看看衣架是不是正对着哪扇窗户。"
  roc.379.a: "继续"

  roc.380.title: "新生活 · 与此同时，教育军事化也在全国各级学校同步"
  roc.380.desc: "与此同时，教育军事化也在全国各级学校同步展开。蒋巾帼签署了《全国学校军事化实施方案》，规定所有初中以上学校必须设立军事训练处，每周至少安排若干课时的军事训练，内容包括队列操练、射击基础、战地急救和防空演习。高中生每年集中军训，大学生每年暑期集训，由国防部统一派遣教官。各校军训成绩纳入升学考核体系，不及格者不得毕业。\n\n他在视察南京中央大学军训成果时站在操场上，看着学生队列从面前走过，步伐整齐，口号震天。他问身边的校长：“他们的文化课成绩怎么样？”校长说没有下降。他问有没有学生抱怨训练太苦，校长想了想说，有的。蒋巾帼沉默了一会儿，说：“苦是暂时的。我们打了太多年仗，吃了太多亏。下一代人不能再不会打仗了。不会打仗的人，将来怎么守这个国家？”"
  roc.380.a: "继续"

  roc.381.title: "新生活 · 军训确实让学生的体魄增强了"
  roc.381.desc: "军训确实让学生的体魄增强了。许多原本体弱多病的学生，经过几个月的训练后能完成武装越野。许多原本沉默寡言的学生，在队列中学会了服从和协作。但问题也随之而来——训练强度逐渐加大，有些学校把军训当成了整治不听话学生的工具，个别教官对学生体罚训斥。广州一所中学的教官因为学生在队列中打了个哈欠，罚全班在烈日下站军姿；苏州一名学生因膝伤请假被拒，咬着牙跑完障碍赛后被直接送进了医务室。\n\n蒋巾帼接到了这些报告。她戴起老花镜把各地送来的军训总结逐份看完，然后将违规教官的处分令批示下去，又提笔在《全国学校军事化实施方案》的扉页加了一行字——“军事训练应以增强学生体魄、培养纪律观念和爱国主义精神为宗旨。严禁体罚，严禁超强度训练，严禁将军事训练用于惩戒。违者一律撤换。”"
  roc.381.a: "继续"

  roc.382.title: "新生活 · 然后她放下笔"
  roc.382.desc: "然后她放下笔，对着墙上的中国地图，自言自语般说了一句话：“我要的是能打仗的国民，不是被打怕的兵。”\n\n蒋巾帼站在总统府的办公室里，面前摊着一份刚刚起草完毕的法案。法案的标题很长——《国家总动员法之经济统制补充条例》，但她只关心其中一句话：“在训政时期，国家为促进生产、保障军需、安定民生，得对下列产业实行统制。”这句话里的“下列产业”，是她用红笔一个一个圈出来的。\n\n她的办公桌上放着两份报告。一份是陈光甫写的，措辞文雅，但核心意思很硬：民营资本需要空间，统制太严会把商人都吓跑。另一份是宋姊雯写的，同样措辞文雅，但核心意思更硬：财政部没有那么多钱来搞国有化，如果强行收购民营企业，财政赤字会飙涨。她把两份报告都看了，然后批了同一行字——“已阅。照此办理，国家无工业可言。”"
  roc.382.a: "继续"

  roc.383.title: "统制经济与国有化 · 随后他把胡宗南"
  roc.383.desc: "随后他把胡宗南、宋姊雯、陈光甫和交通部长俞大维叫到了总统府会议室。宋姊雯是宋庆龄的妹妹，哈佛毕业，主管财政多年，信奉预算平衡和市场调节，对统制经济一直持保留态度。陈光甫是上海商业储蓄银行总经理，中国最资深的银行家之一，他更倾向于政府引导而非强制国有化。俞大维是兵工署署长出身，对军工和重工业的供应链有切肤之痛，他是统制经济最坚定的支持者。胡宗南坐在靠窗的位置，他今天是代表军方来的。\n\n蒋巾帼开门见山。“今天要定下来，哪些产业必须由国家直接控制。这不是做生意，这是备战。我们没有时间让市场慢慢调节。钢铁、煤炭、石油、电力、铁路、电信、军工——这七类产业，必须由国家百分之百控制。现有的私营企业，政府以公债形式收购，原业主可以保留一部分股权，但控股权在国家手里。”他在黑板上写下这七类产业的名称，每一个字都写得很重。"
  roc.383.a: "继续"

  roc.384.title: "统制经济与国有化 · 宋姊雯的眉头拧得最紧"
  roc.384.desc: "宋姊雯的眉头拧得最紧，他推了推金丝眼镜，指出收购私营企业需要巨额资金，财政部目前赤字已经不低，如果全部以公债收购，公债的市场信誉会受冲击。蒋巾帼的回答只有一句话：“公债的信誉不是靠借钱来维持的，是靠打赢下一场战争来维持的。”\n\n陈光甫试图寻找折中方案，他站在那张列着七类产业的黑板前看了好一会儿，然后转过身来开口。他不像宋姊雯那样直接反对，而是用银行家的方式逐条分析：铁路和电信的国有化他赞成，基础设施本来就应该由国家来管；但煤矿和钢铁厂的情况比较复杂，有些是民营企业经营多年的产业，强制收购可能引发资本外逃。他建议分类处理——关系国防的，坚决收；关系民生的，暂缓收；关系出口的，只参股不收。蒋巾帼听完后转向俞大维，征询他的意见。"
  roc.384.a: "继续"

  roc.385.title: "统制经济与国有化 · 俞大维走到黑板上画了一个简单的供应链示意图—"
  roc.385.desc: "俞大维走到黑板上画了一个简单的供应链示意图——从铁矿石到钢材，从钢材到枪管，从枪管到前线士兵。他指着那张图说：“这条链子上任何一个环节不在国家手里，这根枪管就可能出不了厂。资本外逃可以慢慢追，但枪管出不了厂，仗就打不赢。”他说完后，会议室里沉默了片刻，然后胡宗南从靠窗的位置站起来，说了当天晚上分量最重的一句话：“军队支持统制经济。谁反对，我亲自跟他谈。”\n\n最终，蒋巾帼在宋姊雯和陈光甫的方案之间取了一个折中。钢铁、石油、军工、铁路、电信五类列入甲级统制，百分之百国有，以国防公债形式收购，原业主保留少量优先股。煤炭和电力列入乙级统制，国家控股，但不强制收购，允许原业主保留部分股权并参与经营。宋姊雯没有再说话，陈光甫也只是轻轻叹了口气，然后说了一句“至少还有乙级”。蒋巾帼合上文件夹，说：“今天的记录，存档。十年后翻出来看。”"
  roc.385.a: "继续"

  roc.386.title: "统制经济与国有化 · 《国家总动员法之经济统制补充条例》颁布后"
  roc.386.desc: "《国家总动员法之经济统制补充条例》颁布后，经济统制委员会随即成立。蒋巾帼亲自兼任主任，陈光甫担任副主任兼民营资本协调代表，俞大维担任副主任兼军工供应链总协调人。宋姊雯没有加入委员会，但仍然负责财政部配合公债发行。\n\n委员会的第一次全体会议在总统府东厅召开。长桌上铺着一张巨大的中国地图，上面用红蓝两色标注了全国主要工矿企业和交通线路。红色代表甲级统制——必须由国家百分之百控制；蓝色代表乙级统制——国家控股。俞大维站在地图前，用一根教鞭逐项讲解。\n\n“东北的钢铁厂和煤矿，全部划入甲级。这些厂矿原来由樱花人和满洲重工业株式会社控制，战争结束后被接收，现在由经济统制委员会直接管理。长江沿岸的机械制造走廊——从上海到武汉，沿江的造船厂、兵工厂、机车厂，全部甲级。”"
  roc.386.a: "继续"

  roc.387.title: "统制经济与国有化 · 汉阳铁厂，甲级"
  roc.387.desc: "“汉阳铁厂，甲级。这是中国最早的现代钢铁企业，张之洞创办的。现在设备老旧，产量不足，但它在中部工业基地的地位不可替代。国家注资改造，三年内产量翻番。”他的教鞭从长江中游继续往下划。\n\n“开滦煤矿，甲级。这是华北最大的煤矿，供应京津地区的工业和民用煤。原来由中英合办，国民政府以国防公债收购英方股份，改为完全国有。”教鞭继续向南移动。\n\n“沪宁铁路、津浦铁路、平汉铁路——这三条干线全部甲级。铁路是国家的命脉，不能有任何私人股份。原股东以公债形式补偿。”\n\n甲级统制清单逐一敲定后，委员会开始讨论乙级统制。乙级的争议比甲级更大。纺织、食品加工、日用化工、轻工机械——这些产业关系民生，但又不直接涉及国防，是否统制、统制到什么程度，委员们意见不一。陈光甫在乙级统制的讨论中据理力争，他建议纺织业只参股不控股，让民营企业保留经营自主权，政府通过调节棉花供应和出口配额来间接控制。蒋巾帼同意了。食品加工业也是如此——政府只控制粮食的收购和储备，加工环节留给民营。"
  roc.387.a: "继续"

  roc.388.title: "统制经济与国有化 · 最终，统制清单以文件形式下发全国"
  roc.388.desc: "最终，统制清单以文件形式下发全国。甲级统制企业由政府派驻厂长和财务监督，原业主在指定期限内办理股权转让手续，逾期不办者由军事机关强制执行。乙级统制企业由国家参股，派驻财务监督，但日常经营仍由原管理层负责。此外，所有统制企业必须定期向经济统制委员会报送生产数据，数据必须真实，瞒报者以渎职论处。\n\n汉阳铁厂是第一批被国有化的企业之一。"
  roc.388.a: "继续"

  roc.389.title: "统制经济与国有化 · 这座铁厂由张之洞在光绪年间创办"
  roc.389.desc: "这座铁厂由张之洞在光绪年间创办，历经战火，设备老化，产量远不能满足中部工业基地的需求。国有化命令下达的那天，铁厂的原业主——一位姓盛的买办资本家——坐在办公室里，面前放着国民政府发来的收购通知和国防公债认购凭证。他看了很久，然后拿起笔，在股权转让书上签了字。签字时他的手没有抖，但搁下笔时笔尖在纸上拖了一道墨痕。他把那张公债凭证翻来覆去看了几遍，最后锁进保险柜里，对身边的儿子说：“你爷爷当年跟张之洞办铁厂的时候，没想过有一天会被政府收走。也好，公债比枪炮强。”\n\n与此同时，新任命的厂长已经在铁厂的高炉前召集了全体工人。他是从鞍钢调来的老工程师，说话带着浓重的东北口音。他的就职演说很短：“从今天起，汉阳铁厂是国家的了。你们的工资由国家发，你们的任务是把产量提上去。国家给你们注资，给你们换新设备。我只有一个要求——三年内产量翻番。能不能做到？”工人们沉默了片刻，然后一个老炉前工站出来，说：“能。”"
  roc.389.a: "继续"

  roc.390.title: "统制经济与国有化 · 上海江南造船厂的国有化则平静得多"
  roc.390.desc: "上海江南造船厂的国有化则平静得多。这家厂本来就是官办出身，后来在军阀混战时期被私人资本控制了一段时间，现在收归国有，工人们几乎没有什么反应。新任厂长是一位从英国留学归来的船舶工程师，他在就职时说：“以后我们不造商船了。全部造军舰。国家需要海军，海军需要军舰。”他把设计图纸摊在桌上，工人们围过来看。那是一艘新型驱逐舰的设计图，铅笔线条干净利落，每一处尺寸都标得清清楚楚。有工人说没见过这种船型，厂长说这叫球鼻艏，能减少阻力、提高航速。\n\n最大的阻力来自开滦煤矿。\n\n开滦煤矿原为中英合办，英方股东对国有化令反应强烈。英国驻南京公使亲自登门拜访蒋巾帼，措辞客气但立场强硬——英方股东的权益是受条约保护的，国民政府无权单方面以行政命令收购英方股份。蒋巾帼坐在办公桌后，面前放着一份摊开的国防公债发行条例。他的回答只有一句话：“条约是用来修改的。”英国公使愣了愣，说这不符合国际法。蒋巾帼翻开那份国防公债发行条例，翻到最后的注释页，平静地补充道：“这份公债是国防公债。国防，不是生意。贵国在敦刻尔克撤退的时候，也没有先问股东同不同意。”"
  roc.390.a: "继续"

  roc.391.title: "统制经济与国有化 · 英国公使没有再说话"
  roc.391.desc: "英国公使没有再说话。几天后，一份关于“修约”的照会由外交部送出，措辞委婉得近乎刻板，但每个字都明白无误地指向同一个结论：开滦煤矿收归中国国有已成定局，英方股东可依账面价值加适度补偿获得国防公债作为对价。英国政府没有正式接受，但矿区的英方工程师在一个清晨提着行李默默登上了去往天津的火车，站台上只有几个中国矿工在远远地望着。他们走的时候矿区的汽笛没有响，但井口的卷扬机已经开始转动。"
  roc.391.a: "继续"

  roc.392.title: "统制经济与国有化 · 国有化完成后"
  roc.392.desc: "国有化完成后，经济统制委员会开始接收各企业报送的生产数据。蒋巾帼在总统府办公室里批阅完最后一份批复，把笔搁下，走到窗前。窗外暮色渐沉，长江两岸的工厂烟囱正在吐出最后一缕烟，码头上新装不久的探照灯正一盏一盏地亮起来，把江水映成流动的暗金色。她对着窗外站了很久，然后走回办公桌前，在《国有化完成情况汇总表》的扉页上加了一行字：“国家命脉已由国家掌握。告先母在天之灵。”\n\n蒋巾帼坐在总统府的办公室里，窗外梧桐叶正一片一片落下来。她面前摊着两份报告。一份是胡宗南送来的军内调查报告，报告的结论很简短——有几个管后勤的，胆子越来越大了。另一份是识之律者送来的安全简报，照例没有署名，只是在末页用红笔列了几行名字。她认得每一个名字，那些人都是党国要员，有几个还是她母亲在世时就身居高位的元老。她沉默了很久，然后拿起笔，在胡宗南的报告上批了一行字：“查。一查到底。”"
  roc.392.a: "继续"

  roc.393.title: "打虎 · 胡宗南接到批示后"
  roc.393.desc: "胡宗南接到批示后，连夜部署了军内突击审计。审计组直接进驻各部队后勤部门，封存所有账目。几天之内就查出某师后勤处长虚报军粮采购数量，将差价私吞。该处长被军事法庭判处死刑，立即执行。另有多名军需官被撤职查办，追缴赃款。与此同时，蒋巾帼对行政系统的清查也在同步推进。她约谈了监察院长于右任，明确表示反腐败不能只靠监察院按部就班地办案，需要一个专门机构。\n\n不久之后，总统府直属的“反贪污委员会”正式成立，蒋巾帼亲自担任主任，识之律者担任秘书长。委员会拥有独立调查权，可以直接传唤、拘留涉嫌贪污的官员，不受任何部门干预。消息传出后，南京官场一片震动。有人拍手称快，有人彻夜难眠，有人开始烧账本。一个老资格的财政部科长在办公室里烧了整整一夜的文件，天亮时被识之律者的人从办公室里带走，火盆里的灰烬还是热的。他临走时对同事说了一句：“我烧的不是账本，是我自己的命。”"
  roc.393.a: "继续"

  roc.394.title: "打虎 · 第一个落马的重量级人物是陈果夫和陈立夫兄"
  roc.394.desc: "第一个落马的重量级人物是陈果夫和陈立夫兄弟。陈氏兄弟长期控制党务系统，CC系在全国各级党部盘根错节，陈立夫更是被称为“党中之党”的掌门人。反贪污委员会掌握了他们挪用党务经费的证据，数额巨大，账目清晰。当识之律者的人敲开陈家大门时，陈立夫正在书房里整理文件。他把桌上的文件一份一份叠好，整整齐齐地放进抽屉里，然后站起来，对来人说：“我跟你们走。不要惊动老太太。她年纪大了，心脏不好。”陈果夫随后也被带走。兄弟二人被控多项罪名，最终被判处监禁，CC系的势力被彻底清除。\n\n接着落马的是财政部税务署长邹泰仁。他的罪名是利用税收审批权索取回扣。反贪污委员会从他家中搜出金条、外币和大量现金，堆满了整张办公桌。邹泰仁被判处死刑，他手下的多名税务官员被撤职查办，税务系统全面整顿。"
  roc.394.a: "继续"

  roc.395.title: "打虎 · 然后是中央储蓄会经理祝世康"
  roc.395.desc: "然后是中央储蓄会经理祝世康，他挪用储蓄会资金进行投机，导致大量储户蒙受损失。他在被带走时对太太说了一句“把存折还给他们”。他的资产被全部冻结，用于赔偿储户，他本人被判处终身监禁。他的太太后来搬回了老家，住在娘家老宅最里面的一间偏房里，逢年过节会去庙里烧香，别人问起她丈夫的事，她只说“死了”。\n\n再然后是上海青帮头目杜月笙的“门生”刘不同，他以黑社会手段垄断上海码头搬运业，同时又担任立法院委员。他在立法委员任上包庇走私、收受贿赂，反贪污委员会在他的办公室暗格里搜出大量账本。账本上详细记录了每一笔贿赂的来源和去向，还有他对手下“做事干净点，不要给上面抓到把柄”的手令。他被开除立法委员职务，移送司法审判，上海码头工人闻讯后自发在码头上放了好一阵鞭炮。"
  roc.395.a: "继续"

  roc.396.title: "打虎 · 识之律者向蒋巾帼呈递了一份阶段性总结报告"
  roc.396.desc: "识之律者向蒋巾帼呈递了一份阶段性总结报告。报告以她一贯的简洁风格列出了查办官员的层级分布和涉案金额，末尾附了一段分析：“问题不在她们个人，在制度。过去几年财政纪律松弛，税收和国企利润的监管存在系统性漏洞。建议在反贪污委员会下设立常设审计机构，对所有部门实行年度财务审计，审计报告直接呈送总统府。”\n\n蒋巾帼看完，在报告末尾批了一个字——“准。”\n\n然后是第二行——“审计机构由你兼任。我拨款。你担责。”\n\n处理完陈氏兄弟后，蒋巾帼在一次内部会议上说了一段话。当时有人委婉地提醒她，这样查下去会动摇党基。蒋巾帼打断了她：“动摇党基的不是反腐，是腐败本身。只要还有一个贪污犯坐在这个大楼里，这个大楼就不姓蒋。我母亲当年在黄埔军校的开学典礼上说过一句话——‘革命尚未成功，同志仍须努力’。现在革命成功了，但同志忘了努力，只记得贪污。我不杀鸡儆猴，我杀猴儆鸡。”"
  roc.396.a: "继续"

  roc.397.title: "打虎 · 散会后她独自留在会议室里"
  roc.397.desc: "散会后她独自留在会议室里，看着墙上蒋介石的遗像。遗像下放着那份《训政时期临时纲要》，封面上有她母亲亲笔题写的“革命尚未成功”几个字。她走过去，用手轻轻拂去封面上的灰尘，然后拿起电话，拨给了胡宗南。“宗南。军队那几个人的事，你办得不错。下一个，该政府这边了。”她停顿了一下，然后说了一句让胡宗南沉默许久的话——“我母亲打了几十年仗，抓了无数贪官污吏。但她到最后也没能把这件事做完。我要替她做完。”\n\n胡宗南在电话那头沉默了很久。然后她开口了，声音不大，但每一个字都很沉。她说：“你母亲如果在天有灵，会为你骄傲。也会为你担心。担心什么你清楚——你动的不是几个人，是几代人的盘根错节。你手里的剑很锋利，但这把剑也会伤到握剑的人。你准备好了吗？”"
  roc.397.a: "继续"

  roc.398.title: "打虎 · 蒋巾帼没有回答"
  roc.398.desc: "蒋巾帼没有回答。她把电话挂上，窗外的梧桐叶还在往下落，铺了一地金黄。她站起来走到窗前，看着那些被风卷起的落叶，忽然想起小时候在溪口老家，她母亲教她练字时说过的一句话——“巾帼，字要有骨。骨是字的魂。有骨的字，风再大也吹不倒。”她转身走回办公桌前，拿起笔，翻开下一份待批阅的文件。窗外，清洁工正用竹扫帚把落叶扫成一小堆一小堆。扫帚划过地面的声音很轻，沙沙的，像春蚕啃食桑叶。\n\n蒋巾帼坐在国防委员会的椭圆形会议桌前。她的左手边是胡宗南，右手边是何应晴。何应晴的头发已经全白了，她是北伐时期的老将，蒋介石最信任的参谋长之一，在军中德高望重，但此刻她坐在那里一言不发，只是用一块旧绒布慢慢擦着眼镜。长桌两侧坐满了将官，军衔最低的是少将，最高的是上将。黄埔系占了多数，但也有几个是从北洋旧部、地方军阀改编过来的，肩章上的星星和黄埔系一样亮，但坐姿明显更僵硬。"
  roc.398.a: "继续"

  roc.399.title: "整军肃政 · 今天这个会，只谈一件事——整军"
  roc.399.desc: "“今天这个会，只谈一件事——整军。”蒋巾帼的声音不大，但会议室足够安静，每个字都清清楚楚。“我们的军队，表面上统一了番号，统一了编制，统一了军装。但骨子里，还是几年前的旧军队。有的是黄埔的，有的是北洋的，有的是地方的。军令不统一，政令不统一，思想更不统一。”\n\n她翻开面前那份《整军肃政令》草案，开始逐条宣读。\n\n“第一条，全国军队的政治教育由国防委员会统一负责。各部队的政工人员，即日起接受中央考核。考核合格的留任，不合格的调离。第二条，各军事院校的政治课程由中央统一编写教材，教材由我亲自审定。第三条，各部队的军报、军刊、宣传队统一由国防委员会政训部管理。第四条，成立中央军事纪律检查委员会，对全军各级军官进行定期考核，考核结果纳入晋升评定。”\n\n会场里静得只剩下翻页的声音。那些北洋出身的将官们低着头，黄埔系的军官们则一个个坐得笔直。"
  roc.399.a: "继续"

  roc.400.title: "整军肃政 · 蒋巾帼宣布军队的政治工作从此只听中央的"
  roc.400.desc: "蒋巾帼宣布军队的政治工作从此只听中央的，各地方、各派系自行设立的政工部门即日起撤销。接着她宣布由胡宗南兼任国防委员会政训部主任，负责全军政治教育体系的统一整编。\n\n何应晴放下手里的绒布，把眼镜慢慢戴好。她环顾了一圈会议室，然后开口，声音不大，但在场的每一个人都听得清清楚楚。她没有讲年轻时的战功，也没有讲复杂的人事纠葛，只是说军队需要统一的指挥、统一的纪律，说她打了大半辈子仗，最痛心的不是打了败仗，是看到军队因为不团结而让敌人有机可乘。她的话很短，但分量很重。\n\n散会后，蒋巾帼把胡宗南单独留了下来。“宗南，政训部的事，你亲自抓。黄埔系的人可以多用，但不能只用黄埔系。那些北洋出身的人，只要真心愿意接受整编，也要给她们位置。军队不是一家的，军队是国家的。”"
  roc.400.a: "继续"

  roc.401.title: "整军肃政 · 胡宗南点了点头"
  roc.401.desc: "胡宗南点了点头。她想了想，又问了一句：“何总指挥今天说得不多，但说得很好。她在军中威望高，你看能不能让她也挂个名？”蒋巾帼同意了。\n\n整军令颁布后不久，蒋巾帼在中央执行委员会全体会议上正式提出了“一个主义、一个党、一个领袖”的政治纲领。\n\n“这不是我的发明。”她站在讲台上，身后是青天白日旗和蒋介石的巨幅画像。“这是我母亲生前留下的遗训。她在黄埔军校的开学典礼上说——‘革命尚未成功，同志仍须努力’。现在革命成功了，但同志忘了努力，只记得争权夺利。”\n\n她逐条阐述纲领的内容。“一个主义——三民主义是立国的根本，任何与三民主义相抵触的思想不得在党内传播。一个党——中国国民党是唯一合法的执政党，其她党派必须在国民党的领导之下参与政治，不得独立活动。一个领袖——在训政时期，党的最高领袖同时也是国家的最高领袖，全党全军必须服从领袖的领导。”"
  roc.401.a: "继续"

  roc.402.title: "一党专政 · 这一连串措辞逐条宣读完"
  roc.402.desc: "这一连串措辞逐条宣读完，会场里有人鼓掌，有人沉默，有人低头用笔在文件上反复画着线，笔尖戳破了纸面。但没有人站起来反对。\n\n戴姬桃——在这条时间线里保留了男性原名的国民党元老——在会场外为蒋巾帼撰写了一篇配套的理论长文，题为《三民主义与革命领袖论》。文章核心论点是：孙中山创立了三民主义的理论体系，蒋介石继承并实现了这一体系，将革命从理想推向实践；蒋巾帼则在蒋介石殉国后继续其遗志，将三民主义从革命的武器转化为建设的纲领。三代相继，道统一贯。任何一个环节缺失，三民主义都无法完成其历史使命。\n\n蒋巾帼读完了戴姬桃的文章，在文末加了一段话——“三代相继，道统一贯。失其一环，则三民主义无所成。”然后她签上自己的名字，让中宣部全文印发全党。"
  roc.402.a: "继续"

  roc.403.title: "忠诚档案 · 识之律者走进蒋巾帼的办公室时"
  roc.403.desc: "识之律者走进蒋巾帼的办公室时，手里拿着一个薄薄的文件夹。她现在是国家安全委员会的秘书长，负责政治审查、反间谍和意识形态监控。这份工作她做了很久，从广府时期就开始了。她从不穿军装，也不穿干部制服，总是一身深蓝色旗袍，头发一丝不苟地梳在脑后，脸上没有任何多余的表情。\n\n“这是第一批忠诚档案的样本。”她把文件夹放在蒋巾帼面前，翻开第一页，上面是某位中层干部的详细资料——姓名、年龄、籍贯、学历、政治面貌，以及“忠诚评估”一栏，用红笔写着“待审查”。\n\n蒋巾帼翻了几页，每一页的格式都一样，但“忠诚评估”那一栏的内容却五花八门——有的是“可靠”，有的是“有待观察”，有的是“曾发表不当言论，已纠正”，有的是“社会关系复杂，需进一步调查”。她合上文件夹，看着识之律者，问了她一个问题。\n\n“这个档案，可靠吗？”"
  roc.403.a: "继续"

  roc.404.title: "忠诚档案 · 识之律者用她那永远不会产生任何波澜的语调回答"
  roc.404.desc: "识之律者用她那永远不会产生任何波澜的语调回答：“可靠不可靠，不是我说了算。是证据说了算。每个人的档案里都附有原始材料，我的工作是整理材料，不是制造材料。如果你觉得某一份档案有问题，我可以把原始材料调出来给你看。”\n\n蒋巾帼重新翻开文件夹，逐页看过。她的目光在一个人的名字上停了一下，那是她在莫斯科中山大学时期的同学，如今在中央党部担任处长。档案里记录了她曾与留学期间熟识的苏联同学私下聚餐，席间谈及过一些对统制经济的不同看法。原始材料是一张便签，上面用钢笔写着聚餐的时间地点和参与人员，字迹很淡，像是很久以前随手记下的。她把这一页翻了过去，在文件夹末页的批示栏里写下了“先继续观察，暂不上报”。\n\n文件夹最后一页的底部附了一份完整档案的样本格式，档案编目栏旁边留着一行备注——“每份档案均须注明信息来源与核实日期，确保可追溯、可复查。”备注的署名是识之律者。蒋巾帼写完批示，合上文件，推回识之律者面前。她靠在椅背上，看着她的眼睛，忽然问了另一个问题。"
  roc.404.a: "继续"

  roc.405.title: "忠诚档案 · 这里需要被一直维护下去"
  roc.405.desc: "“这里需要被一直维护下去。你能做到吗？”\n\n识之律者接过档案，没有犹豫。“能。”她停了一下，嘴角似乎动了一下，但那也许只是光线在她侧脸上的错觉。她转身走向门口时，在文件柜的阴影里站了片刻，回过头，只说了两个字的告别。\n\n她走了以后，蒋巾帼在办公椅上坐了很久，然后拿起电话打给胡宗南。\n\n“宗南，军队的整编进度报告我看了。政训部的人选你安排得不错。还有一件事——忠诚档案的事，识之律者已经启动了。军队那边，你配合一下她的工作。不需要太紧张，只是正常的人事考核。你手下的军官，只要对党忠诚，对领袖忠诚，就不必担心。”"
  roc.405.a: "继续"

  roc.406.title: "忠诚档案 · 她放下电话，窗外梧桐叶还在往下落"
  roc.406.desc: "她放下电话，窗外梧桐叶还在往下落。秋天很深了，但她知道，春天总会来的。在那之前，她需要确保这片土地上不再有任何一根杂草能够绊倒这棵正在生长的大树。她拿起笔，翻开下一份待批阅的文件，窗外清洁工仍在用竹扫帚扫着落叶，每一片枯死的叶子都要被扫走，才能让新芽在来年春天从干净的泥土里长出来。这是园丁的职责，也是领袖的使命。她把视线重新投向桌面上那份《整军肃政令》的草案，提起笔，在扉页上缓缓写下四个字——“整军肃政”。笔迹端正，横平竖直，没有一丝犹豫。\n\n蒋巾帼站在中央执行委员会的讲台上，面前摊着一份只有三页纸的文件。文件很薄，但分量很重。它的标题是《训政时期临时纲要》。\n\n“这份纲要的核心只有一句话。在训政时期，国家权力由革命政党代表人民行使。宪政不是不搞，是现在不能搞。中国刚刚统一，内忧外患，文盲遍地，地方势力根深蒂固。现在搞普选，搞多党制，搞议会斗争，结果只有一个——被旧势力钻空子，把革命果实一口一口吃掉。军政已经结束，训政从今天开始。什么时候结束？等中国不再有文盲，不再有割据，不再有外国势力在中国领土上驻军。到那时，我们再谈宪政。”"
  roc.406.a: "继续"

  roc.407.title: "训政 · 她停顿了一下"
  roc.407.desc: "她停顿了一下，然后继续说下去：“这不是我一个人的决定。这是先母的遗训。先母说过，革命尚未成功，同志仍须努力。她说的革命，不只是推翻旧政权，是建设一个新国家。建设新国家，需要训练国民学会行使权利，需要训练干部学会治理国家，需要训练军队学会忠于宪法。训练需要时间，训政就是给训练以时间。至于这个时间是多久，有赖于全体国民、全体干部、全体官兵共同努力。训政不是拖延宪政，训政是创造条件让宪政真正能够实现。”"
  roc.407.a: "继续"

  roc.408.title: "训政 · 台下有人微微点头，也有人面无表情"
  roc.408.desc: "台下有人微微点头，也有人面无表情。宋娇仁坐在第三排靠窗的位置，一直没出声。她已经被软禁了一段时间，但仍被允许旁听，以示“宽大”。当她听到“宪政从今天起暂停”这句话时，慢慢摘下眼镜，用手帕擦了擦镜片，然后低下头，在笔记本上写了几个字。她旁边的座位是空的——那是佩丽卡的位子，她今天没有来。\n\n戴姬桃随后发表了支持训政的理论讲话。她从孙中山的建国方略讲起，论证军政、训政、宪政三阶段的必要性，又引用蒋介石关于革命纪律的论述，最后归结到蒋巾帼的历史使命。她说：“三代相继，道统一贯。失其一环，则三民主义无所成。”\n\n蒋巾帼在众人的注视下宣布：“我宣布，中华民国从今天起正式进入训政时期。中央执行委员会为训政时期国家最高权力机构。我以中央执行委员会主席的身份，行使国家最高权力。国会暂时休会，各级行政长官由中央直接任命。司法系统继续独立运作，但涉及国家安全的案件由军事法庭审理。言论自由、出版自由、集会自由受宪法保障，但在训政时期，一切以国家安全为优先。训政不是独裁——训政是革命政党对人民的承诺，是对未来的投资，是对那些用生命换来这个国家的人的最基本的尊重。”"
  roc.408.a: "继续"

  roc.409.title: "训政 · 散会后蒋巾帼走出会议室"
  roc.409.desc: "散会后蒋巾帼走出会议室，胡宗南在走廊上等她。胡宗南说：“巾帼，训政开始了。军队这边，你放心。”蒋巾帼拍了拍她的肩膀：“有你和汤汤在，我就放心。”\n\n她站在走廊尽头，看着窗外南京的梧桐树正在落叶。她想起先母在黄埔军校的开学典礼上说过的那句话，想起先母在郑州的洪水里喊出的最后一声，想起先母遗像前自己默默许下的誓言。然后她走回办公桌前，拿起笔，在《训政时期临时纲要》的扉页上写下了一行字——“这只是开始。宪政迟早会来，但不是今天。”她放下笔，把文件合上，放在桌角。窗外清洁工仍在用竹扫帚扫着落叶，夕阳的余晖把整个南京城都染成了金黄色。"
  roc.409.a: "继续"

  roc.410.title: "预防性清洗 · 蒋巾帼签署《预防性隔离暂行条例》时"
  roc.410.desc: "蒋巾帼签署《预防性隔离暂行条例》时，窗外南京的梧桐叶正纷纷扬扬地落下来。她的笔停顿了一下，然后落下去，签上了自己的名字。这份条例的核心内容是：国家安全委员会有权对任何被合理怀疑可能危害国家安全的人员进行预防性隔离和审查，无需经过常规司法程序，由军事法庭事后备案。她把签完字的文件递给识之律者，看着她那双永远波澜不惊的眼睛，说：“这份权力交给你。用的时候，手要稳。”识之律者接过文件，微微颔首，然后转身走出办公室。她的脚步声很轻，几乎听不见，但她走过的地方，走廊里的空气似乎都冷了半度。\n\n国家安全委员会的工作随即展开。他们的行动极为精准——每次只针对一个人，每次都在深夜或凌晨，每次都有完整的档案依据。被带走的人在出门前多半会回头看一眼自己家的门，然后被请进停在巷口的黑色轿车。第二天邻居发现他们家窗帘没有拉开，但没有人会多问。大家都知道，不该问的不要问。"
  roc.410.a: "继续"

  roc.411.title: "预防性清洗 · 第一批名单上的名字大多是旧军阀余部"
  roc.411.desc: "第一批名单上的名字大多是旧军阀余部、前帝国官僚、以及一些曾在公开场合对训政体制表示过不满的知识分子。她们的罪名各不相同——有的是“涉嫌与境外势力勾结”，有的是“散布不实言论动摇民心”，有的是“与旧政权残余势力保持联系”。但所有这些罪名都指向同一个结论：这些人可能危害国家安全，因此必须在她们造成实际危害之前将其隔离审查。识之律者把每一份隔离令都亲自审阅，在档案末页用红笔标注“已核实”，然后签上自己的名字。她签字时手腕从不悬空，每一笔都压得很实，力透纸背。"
  roc.411.a: "继续"

  roc.412.title: "预防性清洗 · 胡宗南最初对这个条例持保留态度"
  roc.412.desc: "胡宗南最初对这个条例持保留态度。她找到蒋巾帼，说军队里也有人被列入了名单，其中一个还是她当年在黄埔的同窗。此人只是私下表达过对统制经济政策的不同意见，并未有任何实际举动。蒋巾帼翻着那份档案，沉默了一会儿，然后把档案摊开放在两人面前的桌上，缓缓开口：“你的同窗，我认识。北伐的时候她救过我的命。但宗南，感情归感情，安全归安全。预防性清洗不是因为她已经犯了罪，是因为她将来可能犯罪。我们是在和时间赛跑——要么我们抢在危险发生之前清除它，要么等危险发生了再追悔莫及。你选哪个？”\n\n胡宗南没有回答。她把那份档案从桌上拿起来，放进自己的公文包里，说她亲自去跟她谈。蒋巾帼说可以谈，但隔离令必须执行。胡宗南点了点头，说我知道。她走到门口时停了一下，头也不回地说了一句：“巾帼，你信任我吗？”蒋巾帼说你是我最信任的人。胡宗南说那就好，然后推门出去了。"
  roc.412.a: "继续"

  roc.413.title: "预防性清洗 · 戴姬桃听说这些事后"
  roc.413.desc: "戴姬桃听说这些事后，特地从自己的办公室里踱过来，敲开蒋巾帼的门。她没有质问，只是用她一贯的、文雅而克制的措辞表达了她的担忧。她说：“巾帼，我支持训政，支持整军肃政，也支持清除腐败。但预防性清洗，等于是提前惩罚尚未发生的罪行。如果这项权力不受约束地使用下去，它迟早会反噬我们自己。”蒋巾帼反问：“如果我们的敌人正在磨刀，我们是等她举起刀再反击，还是在她磨刀的时候就把她的刀打掉？”戴姬桃说预防性打击需要有确凿的证据，否则就是暴政。蒋巾帼直视着她，一字一句地回应：“证据永远不可能百分之百确凿。但敌人已经蠢蠢欲动，我们不能坐以待毙。我宁可在将来承担过度预防的骂名，也不愿再看到第二个郑州。郑州那年先母面对的，就是‘证据还不充分’的犹豫。犹豫到最后，洪水替她做了选择。”"
  roc.413.a: "继续"

  roc.414.title: "预防性清洗 · 戴姬桃沉默了很长一段时间"
  roc.414.desc: "戴姬桃沉默了很长一段时间。然后她慢慢点了点头，不再争辩。她站起身时，蒋巾帼注意到她拄拐杖的手有些发抖，但她说出来的话仍然沉稳：“我只是不希望蒋介石的女儿变成袁世凯。你是你的母亲和孙中山的后继者，不能成为另一个军人独裁者。我给你写这篇文章，是因为我相信你。不要让我的信任变成历史对你的审判。”她挂着手杖站起来，慢慢往门口走去。蒋巾帼在她背后说：“姬桃，谢谢你提醒我。但你的担心，我记在心里。这条路不好走，但必须走。”\n\n与此同时，汤汤那边也接到了命令。她手下的清波寨子弟兵在南京市区执行了数次预防性隔离行动。行动结束后她坐在营房里，把佩枪放在桌上，对着枪发呆。然后她拿出纸笔，用她刚学会不久的歪歪扭扭的字，给胡宗南写了一封信。信不长，但每一笔都写得很用力，纸面上甚至有几处铅笔芯折断后又重描的痕迹。"
  roc.414.a: "继续"

  roc.415.title: "预防性清洗 · 识之律者向蒋巾帼呈递了一份阶段性报告"
  roc.415.desc: "识之律者向蒋巾帼呈递了一份阶段性报告，汇报预防性隔离条例的执行情况。报告以她一贯的简洁风格列出了被隔离审查的人员数量和主要类别，末尾附了一段简短的说明：预防性隔离有效震慑了潜在的不稳定因素，但也在社会上引起了一定的紧张情绪。建议适当控制隔离规模，并在条件允许时逐步释放经过审查确认无害的人员。蒋巾帼看完，在报告末尾批了一行字：“规模适当控制。已确认无害者逐步释放。已确认有害者依条例处置。继续执行。”\n\n她放下笔，走到窗前。窗外的梧桐叶已经快落光了，只剩下几片枯叶在枝头瑟瑟发抖。她想起母亲在黄埔军校的开学典礼上说的那句话——“革命尚未成功，同志仍须努力”。她觉得自己正在努力，但她不确定方向对不对。她只知道，如果不这样走，也许连“不确定”的机会都没有了。她拿起电话，打给胡宗南：“宗南，你那位同窗，谈得怎么样了？”胡宗南在电话那头沉默了一下，说她配合得很好，已经写了检讨，承认了自己在私下场合的错误言论。蒋巾帼轻轻吐了口气，说那就好，谢谢她，也谢谢你。"
  roc.415.a: "继续"

  roc.416.title: "预防性清洗 · 然后他挂掉电话，闭上眼睛，靠在椅背上"
  roc.416.desc: "然后她挂掉电话，闭上眼睛，靠在椅背上。窗外的夕阳正在缓缓沉入紫金山后，把整个南京城都染成了血红色。她想起胡宗南说过的关于那把剑的话——剑很锋利，但也会伤到握剑的人。她知道自己正在握着这把剑。她只是不知道，最终受伤的是那些被清洗的人，还是她自己的灵魂。\n\n“同志们，从今天起，你们有一个共同的名字——三青团员。三青团的全称是‘三民主义青年团’。这不是一个普通的青年社团，这是党的预备队，是革命的接班人。每一个三青团员都要做到三件事：学习、劳动、训练。学习是为了不盲从，劳动是为了不忘本，训练是为了不挨打。谁来当你们的团长？我。不是我坐在办公室里挂个名，是我亲自带你们。你们去哪，我就去哪。你们劳动，我跟你们一起劳动。你们训练，我跟你们一起训练。”"
  roc.416.a: "继续"

  roc.417.title: "三青团 · 操场上响起了掌声"
  roc.417.desc: "操场上响起了掌声，从方阵最前排开始逐渐蔓延到后排，越拍越响，越拍越密，像雨点打在铁皮屋顶上。有个年轻女学员把手掌都拍红了，但没有停下来。\n\n三青团的招募在全国各地展开。招募站设在各城市的工人文化宫、农村的扫盲夜校和师专的礼堂里，门口贴着标语——“革命需要你。”广州码头，一个装卸工青年蹲在货箱上填写报名表，手心全是老茧，铅笔在指缝间显得格外细，写到“特长”一栏时抬起头问：“力气大算不算特长？我能一个人扛两包米。”川北农村，一个刚从农技推广站下班的姑娘报名时，她母亲拄着拐杖站在门口满脸担忧，姑娘握着母亲的手轻轻按在自己刚领到的笔记本上：“我是去学技术，不是去打仗，等学完了还回来教咱们村里人。”上海纺织厂，一个青年女工站在宣传栏前看了很久，直到旁边的工友推了推她的肩膀才回过神来，她说我也想报名，但我每天上班十二个小时哪有时间训练，旁边已报名的工友告诉她厂里规定三青团员的训练时间计入工时不算请假，她沉默了一会儿，用力点了点头。"
  roc.417.a: "继续"

  roc.418.title: "三青团 · 三青团训练营设在南京郊外紫金山脚下"
  roc.418.desc: "三青团训练营设在南京郊外紫金山脚下，由旧军营改建。训练内容包括政治课、劳动课和军事课，每个科目都有严格的考核标准。军事课由国防军抽调教官负责，戴安澜来巡视训练营时站在靶场边看了一会儿新学员的射击训练，对一个正在教瞄准的年轻教官说安全要放在技术前面讲。蒋巾帼兑现了她的承诺，亲自来训练营讲课、劳动、和学员一起训练。\n\n她讲课的内容是她母亲的失败。“蒋介石的失败，不是因为她的军队不够多。她的军队装备比我们好，训练比我们强。但她失败了——她失败，是因为她的党和人民之间隔着一层厚厚的官僚。她的党员只对上负责，不对下负责。你们将来都会成为干部，记住我这句话——你们是人民的公仆，不是人民的主人。谁忘了这句话，谁就会重复我母亲的错误。”"
  roc.418.a: "继续"

  roc.419.title: "三青团 · 劳动课上，他和学员们一起在地里干活"
  roc.419.desc: "劳动课上，她和学员们一起在地里干活。她弯下腰，镰刀握得很稳，那是她少年时在溪口老家跟佃户家的孩子一起下田练出来的。一个从城里来的学生兵割了半天才割了一小把，手上已经磨出了水泡，疼得龇牙咧嘴。蒋巾帼走过去，把她的手翻过来看了看：“血泡破了好。破了以后会长新肉。新肉比旧肉厚。”\n\n结业典礼那天，蒋巾帼站在队列前一个一个给学员颁发结业证书。发到最后一个人时，她的手已经有些酸了，但她依然把证书先看了一眼名字，然后双手递出。那个学员挺起胸膛喊出自己的名字和来历，蒋巾帼微微颔首，将证书递到她手中：“你的名字我记住了。回去以后，把在这里学到的东西教给没来的人。”学员接过证书，眼眶红了。"
  roc.419.a: "继续"

  roc.420.title: "三青团 · 三青团在全国发展迅速"
  roc.420.desc: "三青团在全国发展迅速，团员人数在短短一年多的时间里从零增长到数十万。蒋巾帼的形象也随之发生变化——她不再只是“总统”，在青年群体中她逐渐被塑造成一个愿意亲自下地割稻、亲自授课、亲自给学员颁发证书的领袖。各地青年的信件涌入总统府，有人称她为“团长”。蒋巾帼每封都看，但从不公开。\n\n庄方宜做了详尽的统计分析，她在报告中建议各省市尽快建立分训基地以缓解南京的集中接待压力。蒋巾帼批阅后写上“同意，分步实施，先试点三省”，然后在扉页上又加了一行字——“你算的是数字，我算的是人。数字不能错，人更不能。”\n\n戴安澜站在蒋巾帼的办公桌前，手里拿着一份刚送来的情报。窗外春雨淅沥，雨点敲打着总统府的窗棂。情报显示，国防军内部的山头主义仍在蔓延，几个从地方军阀改编过来的师长私下聚会频繁，虽未到兵变的地步，但苗头已经不对了。“巾帼，这个问题不能再拖了。军队里山头太多，黄埔的、北洋的、地方的，各怀各的心思。表面上都听中央的，实际上各有各的算盘。”蒋巾帼接过情报，逐页翻看，然后放在桌上，用镇纸压住。"
  roc.420.a: "继续"

  roc.421.title: "军队整肃 · 我知道"
  roc.421.desc: "“我知道。你什么意见？”\n\n戴安澜的回答很简短：“保留番号，保留原有指挥官，但限时让她们自己表态，愿意接受改编的留，不愿意的调。调职不降衔，给足面子，但要她们离开自己的老部队。调完之后，她们的副手由中央直接任命，从黄埔系里挑。”\n\n蒋巾帼点了点头，随即拿起电话打给胡宗南。胡宗南赶到总统府时，军装上还沾着雨珠，她刚从汤汤的清波寨子弟兵驻地回来。“宗南，有件事交给你办。从黄埔系里挑一批年轻军官，下到各部队去当参谋长。参谋长不直接指挥部队，但部队的训练、后勤、情报全部归参谋长管。指挥官还是原来的指挥官，但参谋长是中央的人。”胡宗南听完，咧嘴一笑：“釜底抽薪。好。我马上去办。”"
  roc.421.a: "继续"

  roc.422.title: "军队整肃 · 参谋长制度推行之初，阻力不小"
  roc.422.desc: "参谋长制度推行之初，阻力不小。最激烈的冲突发生在某部，一个北洋出身的老将在接到调任通知后当场拍了桌子，指着前来传达命令的国防部参谋吼道：“老子在战场上流血流汗，现在你们一句话就想把老子调走？”命令传到蒋巾帼那里，她沉默了一会儿，对胡宗南说：“留一个观察期。告诉她，这是最后的观察。再违反，就不是调职的问题了。”几个月后，一百多名黄埔系的年轻军官被陆续下到各部队担任参谋长，她们大多只有二三十岁，军衔不高，但每个人都知道自己背后站着的是总统本人。与此同时，数百名拒绝接受改编的军官被调离原部队，其中包括不少曾立下战功的将领。调令下达后，有人沉默，有人抗议，有人托关系找到戴安澜求情。戴安澜的回应始终只有一句话——“这是命令。”"
  roc.422.a: "继续"

  roc.423.title: "军队整肃 · 清波寨子弟兵也在此时被正式扩编为总统卫队"
  roc.423.desc: "清波寨子弟兵也在此时被正式扩编为总统卫队。扩编仪式在南京总统府前的广场上举行，汤汤站在队列前，军装笔挺，腰间别着胡宗南送她的那支配枪。蒋巾帼在仪式上只说了几句话：“你们是清波寨子弟兵，是跟着先总统蒋公从战火里杀出来的老部队。今天你们成为总统卫队，不是因为我信任你们——是因为先总统信任你们。”汤汤站在队列前，没有说话，只是把右手缓缓举到帽檐边，敬了一个标准的军礼。\n\n与此同时，识之律者的工作也在同步进行。她的忠诚档案系统已经覆盖了全军所有团级以上军官，军队内部的任何风吹草动都会以简报的形式出现在蒋巾帼的办公桌上。某日，识之律者呈递了一份名单，名单上的人被标记为“关系复杂，建议进一步观察”。“这些人，有的和旧军阀有亲属关系，有的在私下场合发表过对整编政策的不满言论，有的只是社会关系比较复杂。没有直接证据表明她们有任何不轨行为，但按照忠诚档案的标准，她们属于潜在风险。”蒋巾帼接过名单，从头看到尾，然后拿起笔，在每一个名字旁边都批了同样的两个字。她放下笔，说：“调职。不降衔，不给实权。保留待遇，但不能再让她们带兵。”"
  roc.423.a: "继续"

  roc.424.title: "军队整肃 · 戴安澜得知这批名单的执行情况后"
  roc.424.desc: "戴安澜得知这批名单的执行情况后，再次求见蒋巾帼。她在办公桌前站定，说出了自己的担忧——其中一位将军曾参加过北伐，在战场上流过血。蒋巾帼从抽屉里取出那份忠诚档案，摊在桌上。她说她看过这位将军的全部档案，包括她的战功，也包括她与旧军阀的往来记录，然后盯着戴安澜的眼睛，一字一句地说：“安澜，你记住，军队里不能有两种声音。我宁可现在得罪人，也不愿将来在战场上被人从背后捅刀。”戴安澜沉默片刻，立正敬礼：“明白了。”然后转身走出办公室。"
  roc.424.a: "继续"

  roc.425.title: "军队整肃 · 国防大学也在此时正式开学"
  roc.425.desc: "国防大学也在此时正式开学，招收团级以上军官进修战略战术、政治教育和现代军事管理，蒋巾帼亲自担任校长。她在开学典礼上站了很久，最后只说了几句话：“你们来这里是学打仗的，更是学做人的。做人第一条——忠诚。不是对我个人的忠诚，是对国家、对党、对三民主义的忠诚。”台下有一个学员站起来提问：“蒋校长，请问忠诚和盲从的区别是什么？”蒋巾帼看着她，说：“盲从是别人说什么你做什么。忠诚是你知道自己为什么而做，但仍然愿意去做。军校教你们的是前者，国防大学要教你们的是后者。”\n\n冬去春来，又一批年轻军官从国防大学毕业，被下放到各部队担任参谋长。识之律者呈递的军内评估报告显示，经过整肃，军队的指挥链已基本统一，内部不稳定因素大幅下降，但非黄埔系军官的隐性不满仍在积累，建议在下一阶段加强政治教育。戴安澜巡视各部队后也写了一份简短的报告，她的评价比识之律者更直接——“部队确实比以前听话了。但听话和能打不是一回事。下一步，要让听话的部队也能打。”蒋巾帼读完两份报告，提笔在扉页上写下批示：“整军初见成效。下一步：政治教育与实战训练并重。军队不仅要听话，更要能打。”"
  roc.425.a: "继续"

  roc.426.title: "军队整肃 · 夜深了，蒋巾帼独自站在总统府办公室的窗前"
  roc.426.desc: "夜深了，蒋巾帼独自站在总统府办公室的窗前。窗外梧桐叶正一片一片落下来，她想起母亲生前常说的一句话——军队是国家的柱石，柱石不稳，大厦将倾。她不知道自己还能扶这栋大厦多久，但她知道至少现在柱石还是稳的。她拿起桌上那支旧佩枪，轻轻摩挲着枪柄上磨损的刻字，然后放回抽屉，关上灯，走出办公室。走廊里很安静，只有她的脚步声在回荡。她走过胡宗南的办公室，走过戴安澜的办公室，走过识之律者的档案室——她还在里面工作，灯还亮着。她没有打扰她，只是轻轻点了一下头，然后继续往前走。总统府外，南京城正在夜色中沉睡，远处紫金山上中山陵的白石台阶在月光下泛着柔和的光。这座城曾经是她的敌人的，现在是她母亲的，将来，她要把它完整地交到人民手里。在那之前，她还有很多事要做。"
  roc.426.a: "继续"

  roc.427.title: "东方列宁 · 蒋巾帼从苏联访问归来"
  roc.427.desc: "蒋巾帼从苏联访问归来，走下专机时，南京的梧桐叶正纷纷扬扬地落下来。她穿着一身深色中山装，左胸口袋上方别着两枚徽章——一枚青天白日，一枚红星。她站在舷梯上停了一下，然后走下舷梯，走向等候的车队。此行她参观了莫斯科的红场，瞻仰了列宁墓，在克里姆林宫与苏联领导人进行了会晤。她参观了斯大林格勒的拖拉机厂，参观了第聂伯河上的水电站，参观了集体农庄的麦田。苏联的五年计划给这个曾经落后的国家带来了巨大的变化，那些高耸的烟囱和轰鸣的机器让她看到了中国的未来。\n\n回国后她在总统府主持召开了一次特别会议。与会者包括胡宗南、戴安澜、陈光甫、俞大维等核心军政要员。她站在那幅巨大的世界地图前，手指从莫斯科划到南京，再划到东京。她开口说话时声音不大，但在场的每个人都听得清清楚楚。"
  roc.427.a: "继续"

  roc.428.title: "东方列宁 · 我在莫斯科参观列宁墓时忽然想明白了一件事"
  roc.428.desc: "“我在莫斯科参观列宁墓时忽然想明白了一件事。列宁领导了俄国的十月革命，建立了世界上第一个社会主义国家。她被称为世界革命的导师。但她不只是俄国的列宁——她也是东方的列宁。东方的革命需要东方的列宁，东方的三民主义革命同样需要一位导师。先总理孙中山是旧三民主义革命的导师，先母蒋介石是北伐战争的导师。而我，继承了她们的事业，领导了东方的三民主义革命。”\n\n她停顿了一下，把手指从地图上移开，转过身来面对所有人。然后她说出了那句经过反复斟酌的话：“如果列宁是西方革命的导师，那么我，就是东方的列宁。”\n\n会议室里安静了片刻。然后胡宗南第一个站起来，立正敬礼，说了四个字。接着在座的将官们一个接一个地站起来，重复着同样的四个字。"
  roc.428.a: "继续"

  roc.429.title: "东方列宁 · 不久之后，蒋巾帼在中央执行委员会全体会议"
  roc.429.desc: "不久之后，蒋巾帼在中央执行委员会全体会议上发表了长篇讲话。她从孙中山的革命理论讲起，详细阐述了蒋介石如何将三民主义从理想推向实践，最后归结到她自己的历史使命——“三代相继，道统一贯。”她提出三民主义革命分为三个阶段：旧三民主义革命以孙中山为导师，推翻了帝制、建立了民国；新三民主义革命以蒋介石为导师，统一了中国、驱逐了外侮；而东方三民主义革命以她本人为导师，将三民主义从中国推向整个东方，让亚洲所有被压迫民族都能在青天白日旗下获得解放。三阶段前后相继，道统一贯。她就是东方三民主义革命的列宁。\n\n中央执行委员会随即通过了相应的决议，正式授予蒋巾帼“东方列宁”的称号。各家报纸全文刊登了这一消息，全国各地举行了庆祝集会。南京的街头挂满了青天白日旗和大幅标语，标语上写着三民主义万岁、东方列宁万岁。三青团组织了盛大的火炬游行，青年们高举火把走过总统府前，高喊着口号。"
  roc.429.a: "继续"

  roc.430.title: "东方列宁 · 外交部长王世杰私下求见蒋巾帼"
  roc.430.desc: "外交部长王世杰私下求见蒋巾帼，委婉地提醒“东方列宁”这个称号可能会引起西方的警觉，英国人和美国人本来就对中国倒向苏联心存疑虑。蒋巾帼反问：“谁是我们的盟友？谁在抗战时给了我们援助？谁在东北出兵帮我们赶走了樱花人？是苏联，不是美国。西方世界从来没有把我们当作平等的伙伴，他们只把我们当作市场。我们不欠他们什么，也不必怕他们。”王世杰没有再说话。"
  roc.430.a: "继续"

  roc.431.title: "东方列宁 · 当三青团员们高呼着口号走过总统府前时"
  roc.431.desc: "当三青团员们高呼着口号走过总统府前时，他们的声音传进了陈光甫的寓所。这位哈佛出身的财政部长坐在窗边，手里握着一杯已经凉了的龙井茶。窗外火光跳跃，照亮了他消瘦的侧脸。他想起了很多年前在哈佛商学院读过的亚当·斯密，想起了凯恩斯，想起了那些关于自由市场、看不见的手、比较优势的理论。那些理论里从来没有提到过一个词——“东方列宁”。但这个词此刻就在窗外，在那些年轻人的嘴里，在火炬的光芒中，在总统府的红墙上。他低头看着杯中的茶叶，它们已经沉在杯底很久了。他不知道这个国家会走向哪里，但他知道今晚还有一份财政报表要批。他站起来，走到书房里，把茶杯放在桌上。窗外的口号声渐渐远去了，但他知道明天报纸的头版会再次出现那个词。他拿起笔，继续批阅那份报表，笔尖划过纸面时发出沙沙的声响，像秋风卷过梧桐叶。\n\n“党政必须合一。不能再分开。分开，就是两只手各做各的事；合一，就是把两只手握成一个拳头。行政院、立法院、司法院、考试院、监察院五院院长，全部由中央执行委员会任命。各级行政长官，必须同时担任同级党部主任。党就是国，国就是党。这不是独裁——这是效率。民主有民主的效率，训政有训政的效率。训政的效率就是命令从中央发出，到县里只用三天。”"
  roc.431.a: "继续"

  roc.432.title: "党国一体 · 表决以压倒性多数通过"
  roc.432.desc: "表决以压倒性多数通过。反对票只有零星几票，在满场高举的手臂中像退潮后搁浅在沙滩上的空贝壳。宋娇仁被软禁在城郊旧宅，消息传到时她正伏在书桌前写政论文章。她把笔放下，走到窗前，对着院子里那棵正在落叶的梧桐树站了很久。然后她回到桌前，在未完成的稿纸末尾加了一段话：“民主是需要土壤的。土壤没有了，种子只能放在抽屉里。总有一天，会有人打开这个抽屉。也许那时候，土壤又有了。”\n\n几天后，蒋巾帼签署了宋娇仁的调令，免去其一切实职，改任立法院法制委员会主任委员。她在调令末页又批了一行字：“宋先生是法学大家。法制委员会需要她。让她去写法案，比让她写政论更有用。”"
  roc.432.a: "继续"

  roc.433.title: "党国一体 · 陈光甫从上海赶来求见"
  roc.433.desc: "陈光甫从上海赶来求见。他走进总统府时西装笔挺，金丝眼镜后的目光带着银行家特有的审慎与疲惫。他开门见山：“总统，党国一体之后，中央银行的独立性怎么保证？货币发行权是不是也要归党管？”蒋巾帼没有绕弯子，说中央银行行长仍然由陈光甫留任，货币发行权仍然在中央银行，党只管战略产业——钢铁、军工、铁路、银行，其余轻工业、商业、农业，放手让市场去做。陈光甫听完没有立刻回答，只是推了推眼镜，然后说既然总统还信任我，我就继续干。他走出总统府时停了一下，裹了裹大衣，自言自语般说了一句——“至少他还知道钱的事不能乱来。”\n\n胡宗南在国防委员会上代表军方率先表态，说军队完全拥护党国一体，他的黄埔系将官们已经全部签署了拥护书。俞大维补充说，军工系统即日起全部纳入党的直接管理，所有兵工厂厂长由中央执行委员会直接任命。"
  roc.433.a: "继续"

  roc.434.title: "党国一体 · 识之律者随后走进蒋巾帼的办公室"
  roc.434.desc: "识之律者随后走进蒋巾帼的办公室，手里拿着一个薄薄的文件夹。她从不带厚文件夹——能用三页纸写完的东西，她绝不用四页。她汇报说安全系统已对党国一体后的权力架构进行了评估，建议对各级政府公务员分批进行忠诚审查，对于不愿接受党国一体原则的旧官僚，逐步替换。蒋巾帼接过文件夹，从头到尾翻了一遍，然后合上，看着识之律者，说那些不愿接受的人不要为难她们，让她们体面退休，但保留待遇。\n\n然后他颁布了《党国一体组织法》。总统府前的广场上举行了隆重的颁布仪式，蒋巾帼亲自将法案交到新任行政院长戴姬桃手中。南京的街道上挂满了青天白日旗，广播里反复播放着他的讲话录音——“党就是国，国就是党。三民主义万岁！中华民国万岁！”口号声传遍了南京的每一条街巷，传进了宋娇仁的书房，传进了陈光甫的银行办公室，传进了胡宗南的军营，传进了识之律者的档案室。"
  roc.434.a: "继续"

  roc.435.title: "党国一体 · 夜色降临"
  roc.435.desc: "夜色降临。蒋巾帼独自坐在办公室里，面前放着那份已经签完字的法案。窗外梧桐叶还在往下落，清洁工用竹扫帚把它们扫成一堆。她提起笔，在《党国一体组织法》扉页上加了一行字——“政令畅通，国家统一。仰无愧于先母在天之灵。”然后她放下笔，站起来走到窗前。远处紫金山上中山陵的白石台阶在月光下泛着柔和的光。她轻声说了一句——“母亲。我把你的江山，管住了。”窗外秋风卷起最后几片落叶，从她的视线里飘过。她转身回到办公桌前，翻开下一份待批阅的文件。台灯的光照在文件上，也照在她胸前那枚青天白日徽章上。\n\n蒋巾帼站在总统府的阳台上。这是她最后一次以总统身份出席双十节庆典。她的头发已经全白了，但腰杆仍然挺得笔直。中山装的领口扣得一丝不苟，左胸口袋上方别着青天白日徽章——那枚徽章她从就职那天戴到现在，从未换过。阳台下方是黑压压的人群，三青团的青年们举着青天白日旗和火把，排成整齐的队列，她们的口号声像潮水一样涌上来。她缓缓抬起右手，向台下致敬。广场上响起了整齐的回应，声音震天动地。"
  roc.435.a: "继续"

  roc.436.title: "一心一德，贯彻始终 · 他转过身，走回办公室"
  roc.436.desc: "他转过身，走回办公室。胡宗南、戴安澜、识之律者、陈光甫、俞大维——这些跟随他多年的老部下们已经等在那里。胡宗南站得笔直，军装上的勋章在灯光下微微闪烁；戴安澜手里握着那顶旧军帽，帽檐依旧磨损发白；识之律者站在最角落里，手里拿着一个薄薄的文件夹，这是她多年来不变的姿态，从不靠近中心，也从不真正离开。他看着他们，缓缓开口：“你们跟我这么多年，辛苦了。训政结束了，宪政开始了。这部宪法已经由国民议会通过。从今天起，中华民国是一个宪政国家。总统由选举产生，政府向议会负责，军队忠于宪法，法律保护每一个公民的权利。训政是暂时的，宪政是永远的。我说过的话，我做到。”"
  roc.436.a: "继续"

  roc.437.title: "一心一德，贯彻始终 · 他走到胡宗南面前"
  roc.437.desc: "她走到胡宗南面前，握了握她的手：“宗南，军队交给你了。记住，军队忠于宪法，不是忠于我个人。”她又走到戴安澜面前，接过那顶旧军帽，轻轻摩挲着帽檐：“安澜，这顶帽子跟了你大半辈子。以后，让它挂在纪念馆里。让后人知道，有人曾经戴着它，替她们守住了这个国家。”然后她走到识之律者面前。她抬起头，那双眼睛仍然深不见底。她看着她，停了一下，然后说：“安全委员会的工作，从今天起由宪法监督。你做了很多事，有些我知道，有些我不知道。但从今天起，每一份档案都必须合法。档案合法，权力才合法。这是我对你最后的要求。”识之律者没有回答，只是用细不可察的幅度微微点了一下头。然后她把那个薄薄的文件夹放在桌上——这是她多年来呈递的最后一份简报。简报的末页没有批注，没有建议，也没有那行熟悉的“待续”。只有一行字：“宪政已至，使命已达。安全委员会即日起依宪法重组。此致。”"
  roc.437.a: "继续"

  roc.438.title: "一心一德，贯彻始终 · 蒋巾帼走到办公桌前"
  roc.438.desc: "蒋巾帼走到办公桌前，拿起那把她母亲留下的旧佩枪。枪柄上的刻字已经磨损得几乎看不清，但她不需要看，她记得每一个字。她把佩枪放进一个锦盒里，盖上盒盖，交给胡宗南：“这把枪是我母亲在郑州战役中留下的。她死在洪水里，没能看到今天。把这把枪送到中山陵，放在她灵前。告诉她——训政结束了，宪政开始了。她交给我的枪，我还给了宪法。”\n\n她最后看了一眼墙上挂着的蒋介石遗像。遗像下面挂着那份《训政时期临时纲要》，封面已经泛黄，页角被她翻得卷了起来。她走过去，把那份旧纲要取下来，用手轻轻拂去封面上的灰尘，然后把它放在佩枪旁边。她说：“母亲，你欠人民的债，我替你还了一部分。剩下的，让她们自己还。我会看着她们。”"
  roc.438.a: "继续"

  roc.439.title: "一心一德，贯彻始终 · 窗外，双十节的烟花正一朵一朵地在夜空中绽放"
  roc.439.desc: "窗外，双十节的烟花正一朵一朵地在夜空中绽放。金色、红色、银色的光芒照亮了南京城，照亮了紫金山上中山陵的白石台阶，也照亮了总统府阳台上的青天白日旗。她转过身，对着所有人，说出了最后一句话：“一心一德，贯彻始终。”胡宗南立正敬礼，戴安澜立正敬礼，所有人都在敬礼。只有识之律者没有敬礼——她从来不行军礼。她只是站在角落里，用那双深不见底的眼睛注视着她，然后轻声说了两个字。没有第三个人听到，也许连蒋巾帼自己也没有听到。但她的嘴唇确实动了一下。然后她转过身，安静地走出了办公室。门在她身后轻轻合上。\n\n双十节的烟花还在绽放。南京城沉浸在节日的欢腾中，青天白日旗在夜风中轻轻拂动。蒋巾帼站在阳台上，看着这座她治理了大半辈子的城市。她想起母亲在黄埔军校的开学典礼上说的那句话——“革命尚未成功，同志仍须努力。”现在，革命成功了，努力也努力过了。剩下的，交给历史去评判，交给人民去选择。她转过身，走进办公室，把门轻轻带上。"
  roc.439.a: "继续"

  roc.440.title: "樱花国重建 · 击败樱花国后"
  roc.440.desc: "击败樱花国后，蒋巾帼在总统府召开最高国防委员会会议，讨论樱花国占领与重建事宜。胡宗南推荐了弭弗和汤汤。弭弗是文职官员，在行政院历练多年，精通樱花语，熟悉樱花国的政治架构；汤汤是清波寨子弟兵出身，从基层一步步做到卫戍司令，忠心耿耿且作风干练。蒋巾帼对她们说：“你们两个一起去。弭弗管政务，汤汤管安保。遇事商量着办，实在定不了的，报给我。”\n\n弭弗和汤汤到达东京后，在原市政厅设立了临时办公室。这栋楼在空袭中被炸塌了一半，剩下的一半勉强能遮风挡雨。弭弗上任第一天，把被轰炸震歪的眼镜扶正，将一沓文件放在桌上，对汤汤说：“这是樱花国临时政府的组织架构草案，我们需要尽快确定各部门的人选。”汤汤接过文件，翻了翻，皱着眉说：“这些字我认不全。你直接告诉我，谁是我需要盯着的人。”弭弗看了她一眼，用铅笔在几个名字下面轻轻划了线：“这几个是原来的旧官僚，背景比较复杂。你不用盯，但要留意。”“留意和盯有什么区别？”弭弗低下头继续划下一个名字：“盯是每天看，留意是偶尔看。这几个人，你偶尔看就行。”"
  roc.440.a: "继续"

  roc.441.title: "樱花国重建 · 樱花民国宪法通过的那天晚上"
  roc.441.desc: "樱花民国宪法通过的那天晚上，弭弗和汤汤在临时政府的阳台上站了很久。东京湾的渔火星星点点，海风带着盐味吹过来。汤汤忽然侧过头，看着弭弗的侧脸。弭弗今天换了一副新配的眼镜，镜框和她自己的很像，都是细细的银边。月光照在她低垂的睫毛上，投下两小片扇形的阴影。“弭弗，你那副眼镜什么时候配的？”弭弗扶了扶镜框，说：“来东京之前。原来那副腿歪了，你上次帮我修的时候说修不好。”汤汤想起来了——那天她在弭弗办公室修眼镜腿，用清波寨修枪托的手艺摆弄了半天，最后说不行，螺丝锈死了。“你后来配的这副，和我这副一样。”弭弗低下头，声音很轻：“嗯。看着你的，就照着配了。”"
  roc.441.a: "继续"

  roc.442.title: "樱花国重建 · 入夜，弭弗在办公室里批阅文件"
  roc.442.desc: "入夜，弭弗在办公室里批阅文件，窗外传来汤汤巡视防务回来的脚步声。那脚步声很重，像她这个人一样，从来不会轻手轻脚。弭弗没有抬头，但她的笔尖在纸上停了一下。汤汤推开门，手里拎着两盒从街角小摊买回来的饭团，往弭弗桌上一放：“吃了。你中午又没吃饭，别以为我不知道。”弭弗摘下眼镜，揉了揉鼻梁，轻声说：“你每天巡夜都绕远路走这条路。”汤汤没有否认，也没说话。弭弗拿起一个饭团：“谢谢你，汤汤。”\n\n樱花民国第一届国民议会选举结束后，弭弗和汤汤的任期也接近尾声。撤离前夜，她们站在办公室里，窗外东京湾的落日正缓缓沉入海平面，橘色的余晖把整个房间都染成了暖色调。汤汤把清波寨子弟兵的花名册摊在桌上，一个名字一个名字地核对，确保每一个弟兄都已登船。弭弗把最后一份交接文件签完，摘下眼镜，揉了揉鼻梁。然后她抬起头，看着汤汤。"
  roc.442.a: "继续"

  roc.443.title: "樱花国重建 · 汤汤"
  roc.443.desc: "“汤汤。你这些年，有没有想过退役之后做什么？”\n\n汤汤把花名册合上，想了一会儿。“回清波寨。”她顿了顿，“你呢？”\n\n弭弗没有立刻回答。她站起来，走到汤汤面前。夕阳的余晖照在她脸上，把她眼角的细纹都染成了淡金色。她伸出手，把汤汤领口那枚松了的扣子重新系好。动作很慢，很轻，系完之后手没有立刻收回来，而是在扣子上停了一下。\n\n“我也不知道。但我知道一件事——你回清波寨的时候，不用一个人回去。”\n\n汤汤看着弭弗。她不是不懂这句话的意思。她只是不知道该说什么。她这辈子会说很多话——骂过逃兵，训过新兵，在战壕里对重伤的弟兄说“撑着”。但此刻她的嘴张了张，又闭上了。然后她忽然倾过身，一把抱住了弭弗。抱得很紧，像在战场上拖回一个受伤的战友。"
  roc.443.a: "继续"

  roc.444.title: "樱花国重建 · 弭弗被她这一下扑得后退半步"
  roc.444.desc: "弭弗被她这一下扑得后退半步，后腰撞在桌沿上，眼镜歪到了鼻梁一侧。她没有去扶镜框，只是把脸埋进汤汤的肩窝里，闷声说：“你把我的眼镜撞歪了。”汤汤没有松手。她抱着弭弗，对着她耳边说：“歪就歪。我再给你修。螺丝锈了我也给你修，修一辈子。”窗外，东京湾的落日已经完全沉入海平面，渔火陆续亮起来，把漆黑的海面染成一片流动的光河。房间里那盏旧台灯发出昏黄的光，照在她们并肩站在桌前的身影上。汤汤把下巴搁在弭弗的发顶上，闻到一股淡淡的皂香味——和自己用的同一种皂角。弭弗没有推开她，只是慢慢抬起手放在她的后背上。\n\n特别军事法庭的审判长由何应晴亲自担任。这位北伐时期的老将已年过花甲，头发花白，但腰杆仍挺得笔直。她穿着全套上将军礼服，胸前佩戴着北伐纪念章和抗战胜利勋章。宣读起诉书时声音苍老而洪亮，每一个字都像子弹一样打进被告席。"
  roc.444.a: "继续"

  roc.445.title: "袁克定的审判 · 袁克定被带上法庭时"
  roc.445.desc: "袁克定被带上法庭时，旁听席上静得能听见窗外梧桐叶落地的声音。她老了，头发全白，但背仍然挺直。法警要扶她，被她轻轻挡开。她的眼睛扫过旁听席，那些面孔——有徐州战役的幸存者，有黄河决堤后失去家园的农民，有南京大屠杀的目击者——都死死盯着她。她收回目光，在被告席上站定。检察官宣读对她的指控：发动反革命内战、指挥军队屠杀平民、在帝国覆灭后继续组织武装抵抗、拒绝接受投降令导致不必要伤亡。审判持续多日，检方传唤了数十名证人，证词堆满了书记员的案头。她自始至终没有为自己辩护，只是沉默地听着。"
  roc.445.a: "继续"

  roc.446.title: "袁克定的审判 · 最后陈述阶段"
  roc.446.desc: "最后陈述阶段，她站起来，没有请求宽恕，只是缓缓扫视了一遍旁听席上那些普通民众的面孔。“你们打赢了。我是败军之将，败军之将没有资格谈条件。我只说一件事。我当年炸开花园口大堤，不是因为喜欢杀人，是因为我接到的命令是不惜一切代价守住郑州。我执行了那个命令，洪水淹死了很多人。这笔债，我背。我不求你们原谅我。但我请求你们，不要再让黄河决堤，不管是战争还是和平。那水太冷了。”\n\n旁听席上有一个老农站了起来，指着她，手指发抖，声音也发抖：“你炸堤那年，我一家数口人，只剩下我一个。你是杀人犯。”袁克定看着她，沉默了一会儿，说：“是。”老农没有再说话，慢慢坐下去，双手捂住了脸。\n\n法官最后问她还有什么要说的。她摇了摇头，然后忽然又开口，说了一句与审判无关的话：“我母亲在世时说过一句话——军人不问为什么，只问怎么做。现在我知道，她错了。军人必须问为什么。不问为什么的军人，和屠夫没有区别。”她向法官鞠了一躬，然后转向旁听席，对着那个老农的方向又鞠了一躬。脊椎受过伤，弯腰很慢，但每一寸都压得很深。"
  roc.446.a: "继续"

  roc.447.title: "袁克定的审判 · 何应晴在法官席上沉默了很久"
  roc.447.desc: "何应晴在法官席上沉默了很久，花白的眉毛微微抖动。她想起多年前在天津小站练兵时第一次见到袁克定——她还是个孩子，骑在袁世凯的马上，笑声清脆得像春天的风。她摘下老花镜，用手帕擦了擦镜片，然后把判决书缓缓合上，声音沙哑地宣布判决。\n\n战后数年，长江某水文站的年轻技术员在检修旧水位计时，在基座石缝里发现了一张泛黄的纸片。纸片上只有一行字，用铅笔写的，字迹潦草而有力——“黄河安澜。”落款处签着两个截然不同的笔迹：一个是用简体字写的“袁克定”，另一个是用繁体字写的，名字被水渍洇得模糊了，只依稀看得清偏旁。技术员把纸片小心夹进自己的工作日志里，继续检修水位计。窗外，黄河水正在桥墩下安静地流过，金色的浪头拍打着桥墩，溅起的水雾在阳光下映出一道虹。"
  roc.447.a: "继续"

  roc.448.title: "战犯管理所 · 帝国覆灭后，前帝国军将领被分批收押于南京"
  roc.448.desc: "帝国覆灭后，前帝国军将领被分批收押于南京战犯管理所。庭院里梧桐叶落了一层又一层，有人在放风时下意识地绕着院子走正步，口令卡在喉咙里没敢喊出声。还有人每天早晨对着东方行军礼，东方是紫金山，山上埋着他曾经的统帅。\n\n特别军事法庭陆续对在押的前帝国将领进行了审判。除袁克定被判终身监禁外，其余将领根据罪行轻重和认罪态度分别量刑：部分在战争末期主动率部起义、保护人民生命财产有功者，经审查后免予刑事处罚，转入地方安置或安排军事教学职务；大多数跟随袁克定继续抵抗的前帝国高级将领被判处监禁，刑期根据各自罪行核定，从数年到数十年不等。判决书逐一宣读，有人在被告席上低下头，有人面无表情，有人在听到刑期时轻轻闭上了眼睛。"
  roc.448.a: "继续"

  roc.449.title: "战犯管理所 · 何应晴逐一签署了这些判决书"
  roc.449.desc: "何应晴逐一签署了这些判决书。签到最后一份时，她停了很久，对身边的书记官说：“这里面的名字，有一半我都认得。有的是我保定军校的同窗，有的是我在天津小站练兵时的同僚。”她把笔放下，揉了揉手腕，又说：“但军法就是军法。”\n\n战犯管理所内设立了改造教育课程。课程包括三民主义基础理论、中国近代史、以及劳动技能培训。一位前帝国军参谋长在课堂上举手提问：“请问教官，三民主义中的‘民生’是否包括前帝国军人及其家属的基本生活保障？”教官回答：“包括。”他坐下去，在笔记本上工工整整地记下了这一条。他后来被转入地方编译局担任德文翻译，在交代个人历史时写道：“余半生从戎，未曾为民做一事。今译书数卷，聊以补过。”编译局负责人对他的评价是“工作勤恳，译文准确，从不迟到”。\n\n另一位中将则在监狱图书室里整理了一份帝国陆军编制沿革表，密密麻麻写满了蝇头小楷，从1895年天津小站练兵一直列到帝国覆灭前夕。他把这份手稿呈递给管理当局，说：“这是我毕生所见所学。现在不需要了，但也许对你们写战史有用。”"
  roc.449.a: "继续"

  roc.450.title: "战犯管理所 · 管理当局收下了手稿，把它存入军事档案馆"
  roc.450.desc: "管理当局收下了手稿，把它存入军事档案馆。若干年后，一位年轻的历史学者在整理资料时发现了它，翻开第一页，上面用工整的楷书写着：“此稿呈交中华民国军事当局。笔者曾任帝国陆军中将，谨以残生，为历史留一份记录。”\n\n战犯管理所的改造教育持续数年，陆续有服刑期满或表现良好的前帝国军官被转入地方安置。有人进了编译局，有人去了文史馆，有人在南京街头骑着一辆旧自行车，车后座绑着一兜青菜，慢慢穿过梧桐树荫。邻居们只知道他姓什么，不知道他曾经是什么。他每天早晨在院子里打一套太极，然后戴上老花镜，在窗下翻一本泛黄的《资治通鉴》。书上有一行批注，是他出狱那天写的：“半生戎马，半生牢狱，余生读书。足矣。”"
  roc.450.a: "继续"

  roc.451.title: "人物命运总纲 · 蒋巾帼选择的是母亲的剑"
  roc.451.desc: "蒋巾帼选择的是母亲的剑。这把剑落在所有人身上——落在敌人头上，落在盟友肩上，也落在她自己的影子里。她没有进行大规模清洗，但她建立了一套比清洗更持久的制度：三柱分立的忠诚体系。胡宗南握枪，戴姬桃执笔，识之律者掌眼。所有人都被纳入这个三角形，没有人能站在三角之外。"
  roc.451.a: "继续"

  roc.452.title: "革命委员会内部 · 宋庆龄在蒋巾帼赢得党内选举后"
  roc.452.desc: "宋庆龄在蒋巾帼赢得党内选举后，主动辞去了所有实职。她没有流亡，没有组织反对派，没有在公开场合批评新政权的任何一项政策。她只是回到了她在广东的旧居，每天读书、种菜、偶尔去中山陵献一束花。她不再是任何政治力量的代表，她只是一个沉默的象征——革命的良心，被革命留在了过去。"
  roc.452.a: "继续"

  roc.453.title: "革命委员会内部 · 她在离开南京前见了蒋巾帼最后一面"
  roc.453.desc: "她在离开南京前见了蒋巾帼最后一面。谈话是在宋庆龄的办公室里进行的，没有第三人在场。据宋庆龄后来在日记中记述，蒋巾帼走进来时没有带卫兵，自己拉了把椅子坐在她对面。她沉默了很长时间，然后说了一句让宋庆龄意外的话：“孙夫人。我母亲生前对您一直很尊敬。她说您是她认识的最有原则的人。”\n\n宋庆龄没有回答这句话。她只是说：“你选择了你母亲的路。我选择了另一条路。我们都没有走下去。以后的路，是后来的人走。”\n\n她站起来，把桌上的一盆兰花递给蒋巾帼。“这盆花我养了很多年了。现在你替我养。它不需要太多水，但需要阳光。你的办公室朝南，阳光好。”"
  roc.453.a: "继续"

  roc.454.title: "革命委员会内部 · 蒋巾帼接过兰花，双手捧着"
  roc.454.desc: "蒋巾帼接过兰花，双手捧着。她说：“我会养好的。”然后她站起来，微微鞠了一躬，转身离开。\n\n此后多年，那盆兰花一直放在蒋巾帼办公室的窗台上。识之律者在一次例行汇报中注意到它，问了一句：“宋主席送的那盆？”蒋巾帼没有回答。她在汇报结束后的附录中加了一行字，然后又划掉了。划掉的痕迹太深，后来整理档案的人无法辨认她写了什么。"
  roc.454.a: "继续"

  roc.455.title: "革命委员会内部 · 陈晖洁是蒋巾帼独裁路线确立后最早主动表态"
  roc.455.desc: "陈晖洁是蒋巾帼独裁路线确立后最早主动表态的派系领导人之一。\n\n她求见蒋巾帼时带了一份名册。这份名册比她在苏维埃线中交给蒋巾帼的那份更厚，因为里面不仅包含CC系的基层网络，还包括她对各地方党政干部的忠诚度评估。她把名册放在蒋巾帼桌上，然后说了很短的一段话：“这份名册是党所需要的组织基础。我把它交给你。你可以继续用我，也可以不用。用我，我留下来替你管组织。不用我，我就走。”"
  roc.455.a: "继续"

  roc.456.title: "革命委员会内部 · 蒋巾帼翻了几页名册，然后合上"
  roc.456.desc: "蒋巾帼翻了几页名册，然后合上。“你留下来。中央组织部常务副部长。你的工作不是管名册——是管人。哪些人可以用，哪些人不可以用，你比任何人都清楚。”\n\n陈晖洁没有笑，但她的眼神微微放松了一些。她站起来准备告辞，走到门口时忽然停住，转过身来。她似乎想说什么，但最终没有开口。她只是站在那里，微微低了一下头，像点头，又像鞠躬。然后她转身走了。"
  roc.456.a: "继续"

  roc.457.title: "革命委员会内部 · 陈千语在独裁路线下的命运与她姐姐不同"
  roc.457.desc: "陈千语在独裁路线下的命运与她姐姐不同。她没有接受任何行政职务。她继续担任都城卫戍司令，但她的权力被大幅度削减。胡宗南在改组京畿防务时，将原本由陈千语直接指挥的部分城防部队划入了清波寨独立旅的防区。陈千语没有抗议，只是在交接仪式上，把她用了多年的城防日志交给汤汤。她说：“这些日志记录了南京每一段城墙的检查记录。以后，这些城墙归你管了。希望你能记得每段城墙的名字。”\n\n汤汤接过日志，翻了翻。上面密密麻麻记录着陈千语的笔迹。她合上日志，看着陈千语：“我不认识这么多字。但你写的这些，我会让人念给我听。”"
  roc.457.a: "继续"

  roc.458.title: "革命委员会内部 · 陈千语仍然每天破晓策马巡视南京城"
  roc.458.desc: "陈千语仍然每天破晓策马巡视南京城。只是现在，她巡视的是她不再负责的城墙。她的马认得每一段路，她也认得每一块砖。但她不再做记录了。巡视结束后她会去姐姐的办公室坐一会儿，有时帮姐姐整理名册，有时只是看着窗外的梧桐树发呆。"
  roc.458.a: "继续"

  roc.459.title: "革命委员会内部 · 宋娇仁在蒋巾帼独裁路线确立后"
  roc.459.desc: "宋娇仁在蒋巾帼独裁路线确立后，被禁止在公开场合发表政治言论。她没有被捕，没有被驱逐，没有被软禁——只是不能再演讲了。她保留了国会议员席位，但国会已经不再拥有实际立法权，沦为纯粹的表决机器。她每天照常出席会议，照常坐在自己的座位上，但她不再发言了。\n\n她的日记仍在继续。她在一页写道：“国会还在。议员还在。我也还在。但说话的权利没有了。不说话不是最痛苦的。最痛苦的是发现——说话也没有用了。因为没有人听。没有人需要听。”"
  roc.459.a: "继续"

  roc.460.title: "革命委员会内部 · 她在另一页写道：“我不怪巾帼"
  roc.460.desc: "她在另一页写道：“我不怪巾帼。她是她母亲的后代，她选择了她母亲的方式。我只是有些遗憾——我曾经以为，革命是为了让人说话。现在我知道，革命结束以后，说话这件事，比革命本身还要难。”\n\n佩丽卡在独裁路线下继续留任法务部。她的工作范围被限制在民法、刑法和行政法规的技术性修订，她的工作成果不再需要经过国会辩论——蒋巾帼签署行政命令即可生效。她对此没有公开表达意见。她只是每天准时上班，准时下班，把每一条条文修改得严谨而精确。她的法务部同事说，她在办公室里只谈法律技术，从不谈政治。"
  roc.460.a: "继续"

  roc.461.title: "革命委员会内部 · 但她保留了一个习惯"
  roc.461.desc: "但她保留了一个习惯。每一份经她手修订的法案，她都会在扉页用铅笔写下一行小字：“本法案系依现行法律程序编制。”她把“依现行法律程序”这几个字写得格外用力。她的助手有一次问她为什么。她没有回答，只是继续写。也许她相信，总有一天，有人会翻看这些法案的原始档案，看到扉页上那行铅笔字。到那时，“现行法律程序”几个字，就是她对历史最克制的证词。"
  roc.461.a: "继续"

  roc.462.title: "黄埔中正社与军队 · 胡宗南是蒋巾帼独裁路线中获益最大的人"
  roc.462.desc: "胡宗南是蒋巾帼独裁路线中获益最大的人，也是内心最矛盾的人。\n\n她得到了军队的最高指挥权——国防委员会副主席兼联合总参谋部总参谋长，所有重要军区的指挥官都由她提名，所有重大军事决策都由她参与。她实现了黄埔系多年来的夙愿：军队听命于蒋家，黄埔嫡系掌握军权。但她在一次聚宴后，独自在办公室里坐到深夜。汤汤推门进来，发现她正对着墙上蒋介石的遗像发呆。她说：“你喝酒了？平时不喝。”"
  roc.462.a: "继续"

  roc.463.title: "黄埔中正社与军队 · 没喝"
  roc.463.desc: "“没喝。”胡宗南没有回头，只是看着那遗像。过了一会儿，她像是自言自语地说：“老校长如果在天有灵，会怎么看我们现在做的事。”她没有再说下去。汤汤也没有追问。她在她旁边的椅子上坐下来，把佩枪搁在桌上，陪她坐了半夜。\n\n何应晴在独裁路线下被任命为国防部长，但这个头衔的实际权力已被彻底架空。军队的指挥权在胡宗南的国防委员会，军队的政治审查权在识之律者的安全部门，国防部只是一个负责后勤和文书工作的行政机关。何应晴接受了这个安排，没有抗议，没有辞职。她继续每天准时上班，处理那些已经不再重要的公文。"
  roc.463.a: "继续"

  roc.464.title: "黄埔中正社与军队 · 她在办公室里保留了多年前那幅三军指挥体系图表"
  roc.464.desc: "她在办公室里保留了多年前那幅三军指挥体系图表，但图上的标注已经全部过时。她的副官问她为什么不换一幅新的。她看着那幅图，只说了两个字：“留着。”\n\n汤汤是独裁路线中命运变化最小的人。她的清波寨独立旅被纳入胡宗南的京畿防务体系，她本人继续担任旅长，军衔升至少将。她不在乎政治体制的变化，不在乎谁是总统谁是主席，不在乎训政和宪政有什么区别。她只在乎两件事：她的部队能不能吃饱，她答应过的事能不能做到。"
  roc.464.a: "继续"

  roc.465.title: "黄埔中正社与军队 · 她在一次军事会议上"
  roc.465.desc: "她在一次军事会议上，被问到对新的军队政治教育体系的看法。她站起来说：“我不懂政治教育。我的兵也不懂。但她们懂一件事——打仗的时候，我不跑，她们就不跑。这不叫政治教育，这叫清波寨的规矩。你们如果要改这个规矩，先问过我。”全场沉默。胡宗南看着她，没有批评她，也没有支持她。她只是说：“汤旅长的部队，政治教育方式保持不变。散会。”会后，她单独留下汤汤，说了一句话：“你说的那些，以后不要在会议上说。私下跟我说就行。”"
  roc.465.a: "继续"

  roc.466.title: "识之律者 · 识之律者是蒋巾帼独裁路线中权力最大的非军事人"
  roc.466.desc: "识之律者是蒋巾帼独裁路线中权力最大的非军事人员，也是与蒋巾帼关系最复杂的一个人。\n\n她的蓝衣社在定鼎南京后被正式改组为国家安全委员会，她担任秘书长。她的监控网络覆盖了军队、党政机关、文化教育系统和地方行政。她每天早晨向蒋巾帼呈递一份安全简报，内容包括过去二十四小时内所有值得关注的不稳定因素。简报的末页通常不需要任何操作，但她每次都会翻到最后一页，在空白处用红笔批注一行字，然后合上档案，放在蒋巾帼的办公桌上。"
  roc.466.a: "继续"

  roc.467.title: "识之律者 · 那行字几乎每次都是一样的"
  roc.467.desc: "那行字几乎每次都是一样的。只是偶尔，她会多写几句。比如胡宗南在国防委员会上公开反对某次人事调整的那个晚上，她的批注多了一句话。蒋巾帼看完，沉默片刻，然后把简报放在一边，继续批阅其她文件。她没有回应这句话。但在下一季度的例行人事调整中，她没有再触动黄埔系的利益。\n\n她在安全委员会大楼的地下档案库里保留了一套灰色档案柜，柜子上没有任何标签。她的副官曾在她整理档案时问过那些柜子装的是什么。她没有停下手中的动作，只是说：“备份。”她在那排柜子最深处的一个抽屉里放着一份未完成的档案，扉页上写着她自己的名字。最后一页没有任何文字。只有日期。她每天更新日期，但从不在后面写任何东西。"
  roc.467.a: "继续"

  roc.468.title: "识之律者 · 戴姬桃有一次在走廊上遇到识之律者"
  roc.468.desc: "戴姬桃有一次在走廊上遇到识之律者。两人都停下脚步。戴姬桃先开口，语气很平静：“我每周三下午在行政院办公室。你有空可以来坐坐。茶很干净。”识之律者看着她的眼睛，过了一会儿才回答。戴姬桃点了点头，没有再多说。此后每周三下午，她都会让秘书多备一盏茶。识之律者来了几次，都没喝，只是坐在椅子上看档案。戴姬桃也不介意。她坐在她对面，继续写她的字。"
  roc.468.a: "继续"

  roc.469.title: "中共各派系 · 毛润芝在独裁路线的处境远比苏维埃路线下艰难"
  roc.469.desc: "毛润芝在独裁路线的处境远比苏维埃路线下艰难。蒋巾帼不信任她，识之律者将她列为重点监控对象，她在党内的发言权被限制在农业技术咨询领域。但她没有离开南京。她在给川北旧部的信中说：“南京不是延安。但南京也是中国。如果革命必须经过一个蒋巾帼的阶段，那我们就在这个阶段里，做好我们能做的事。”\n\n她被安排在农业部担任顾问，负责农村经济调研。她每年有大量时间在农村调研，回来时带着厚厚的手稿，详细记录各省的土地分配、粮食产量和农民负担。这些报告被识之律者定期调阅。有一次她在查阅她最近几季的调研报告后，在简报里加了一句批注。蒋巾帼看到后，没有批示。但毛润芝在四川老区的一次实地调研申请，原本被安全部门卡了很久，次年忽然被批准了。"
  roc.469.a: "继续"

  roc.470.title: "中共各派系 · 千代桃在独裁路线下被免去了宣传部门的实职"
  roc.470.desc: "千代桃在独裁路线下被免去了宣传部门的实职，转任中央文史研究馆副馆长，负责党史文献编纂。她的政治影响力完全消失，但她在文化领域的专业地位得以保留。她在建国后编写的《中国革命文学史》被列为大学教材。\n\n她在被免去宣传实职的当天晚上，独自去了中山陵。她在孙中山的祭堂前站了很久。有一个守陵的老管理员后来回忆说，那天晚上有一个穿素色旗袍的女人，在祭堂里站了很久，出来时眼角有泪痕。但不能确定那是不是千代桃。"
  roc.470.a: "继续"

  roc.471.title: "中共各派系 · 张雯甜与陈独秀的处境类似"
  roc.471.desc: "张雯甜与陈独秀的处境类似，他们都失去了政治发言权，但保留了学术研究和文献编纂的工作。张雯甜在大学里讲授马克思主义哲学，他翻译的马列经典成为高校教材。他的课很受学生欢迎。他在讲台上从不掩饰自己的态度：“我是留苏派中最没有出息的一个——不会打仗，不会搞运动，只会读书。但我把书读通了。你们来听我的课，不是为了学我读过的书，是为了学会怎么读我没有读过的书。”陈独秀则继续整理中共早期文献，直到在书桌前去世。"
  roc.471.a: "继续"

  roc.472.title: "民主派系 · 农工民主党在独裁路线下被保留为“工人农民的政"
  roc.472.desc: "农工民主党在独裁路线下被保留为“工人农民的政治代表”，但失去了独立表达政治诉求的权利。党主席赤羽继续担任劳工部长，她的工作被限定在工厂安全标准和工伤保障基金的技术性管理。她不再提出新的政策倡议，她唯一能做的事是把已有政策执行得更好。她领导制定了全国工厂安全标准，推动建立了工伤保障基金。这份工作很具体，也很辛苦。她晚年接受采访时被问到独裁时期的经历。她想了很久，最后只说了一句话：“那时候我学会了做减法。不是我放弃了理想，是我学会了在螺丝壳里做道场。”"
  roc.472.a: "继续"

  roc.473.title: "民主派系 · 致公党在独裁路线下失去了所有联省自治的政"
  roc.473.desc: "致公党在独裁路线下失去了所有联省自治的政治平台。党主席钟岚珠继续负责华侨事务，她的工作是为工业化建设募集海外投资。她接受这个角色时对党内同僚私下表示：“联省自治的前提是有省可联。现在省都没有自主权了，我们还联什么？但我还能做事。我还能为这个国家的工业化拉来投资。这不是我最初想做的事，但这是我现在唯一能做的事。”"
  roc.473.a: "继续"

  roc.474.title: "民主派系 · 公民自由联盟在独裁路线下最早被边缘化"
  roc.474.desc: "公民自由联盟在独裁路线下最早被边缘化。其代表人物洛天依被免去《自由谈》主编职务，转任广播事业局副局长，不再负责内容审核，只负责技术推广。她对此没有公开抱怨。她继续工作——把收音机送到每一个偏远的村庄，让那些从未听过广播的农民第一次听到外面的声音。有人问她为什么要继续做这件事。她说：“我用了很多年练胆量——胆量不是不怕，是怕了还继续往前走。”"
  roc.474.a: "继续"

  roc.475.title: "民主派系 · 青年党是独裁路线下唯一一个保留了部分政治"
  roc.475.desc: "青年党是独裁路线下唯一一个保留了部分政治自主性的民主派系。它在国防工业领域的专业技术地位使其获得了一定的豁免权。代表人物汉阳造继续主持兵工厂的技术研发。她在苏维埃线中曾直接批评蒋巾帼亲苏，现在她不再批评——不是因为她改变了看法，是因为她正在完成国产步枪最后的设计图纸。她在内部会议上说：“我不想再谈政治。我只想造枪。枪造出来了，用的人就知道——中国的钢不比苏联的差。”\n\n公车党完成了从保皇立宪到文化遗产保护的转型。党首符华主持了全国文物普查，编撰了《中国传统村落保护名录》。她保留着康佑薇的遗墨，一直挂在办公室里。有人建议她换一幅更符合时代主旋律的题字，她在自己办公室的门上贴了一张字条。字条上写着：“师父的遗墨挂在我墙上。谁看不惯，可以进来告诉我为什么。但请先说出她的理论在哪一页有误。说不出来，就别进来。”"
  roc.475.a: "继续"

  roc.476.title: "民主派系 · 立宪民主党在独裁路线下最先解散"
  roc.476.desc: "立宪民主党在独裁路线下最先解散。其部分成员转入教育领域，以个人身份在大学任教。他们不再谈论政治，只是教书。一个前立宪民主党成员在中学教书时，被学生问起自己是否曾是党派人物。他沉默了片刻，然后说：“老师以前相信议会。后来议会没有了，老师就回来教书了。教你们怎么思考。不是教你们相信什么。”"
  roc.476.a: "继续"

  roc.477.title: "帝国旧人物 · 袁克定在独裁路线下的结局与苏维埃线相同"
  roc.477.desc: "袁克定在独裁路线下的结局与苏维埃线相同：战犯审判，死刑。蒋巾帼没有去拘留所看她。只是在审判结束后，她在办公室里对着那盆宋庆龄送的兰花坐了很久。识之律者在当晚的简报末页只写了一个字。她没有回复。\n\n蒋丽华在独裁路线下的命运与苏维埃线不同。她没有进工厂。宋庆龄在隐退前亲自为她向蒋巾帼求了情。蒋巾帼同意将蒋丽华安置在南京一处僻静的宅院里，以普通公民身份生活。她终生未婚，靠抄写古籍维生。她抄写的《金刚经》手稿多年后被人在旧书摊上发现，扉页上有一行小字——“愿来世不生帝王家”。"
  roc.477.a: "继续"

  roc.478.title: "帝国旧人物 · 黎星刻被编入胡宗南的国防军序列"
  roc.478.desc: "黎星刻被编入胡宗南的国防军序列，任命为军事教育处副处长。他的工作是在军校教授战术课程，不再直接接触部队。他终身申请调往一线部队均被驳回。他每年在蒋丽华生日那天去她宅院门外站一会儿。一次恰逢识之律者的车经过，他慌忙低头。车没有停。次日，他在办公桌上发现一个信封，里面是蒋丽华近期的生活照，背面只写了一个字。他认得，那是识之律者的笔迹。"
  roc.478.a: "继续"

  roc.479.title: "帝国旧人物 · 重岳的部队被改编为国防军第三十七步兵师"
  roc.479.desc: "重岳的部队被改编为国防军第三十七步兵师，他继续担任师长，但增派了政治委员。他在改编后把自己珍藏多年的佛珠送给戴安澜——与苏维埃线不同的是，戴安澜在独裁路线下接受了这串佛珠，戴在手上，在此后每次军事会议上，佛珠都在他的手腕上轻轻晃动。重岳晚年转向军事史研究，他撰写的《西北边防史》成为军校教材。他在序言中写道：“打仗不是好事。但研究打仗，可以让后人少打几场。”"
  roc.479.a: "继续"

  roc.480.title: "帝国旧人物 · 李舜生投案后被识之律者收编"
  roc.480.desc: "李舜生投案后被识之律者收编，安排在安全调查处档案分析科担任技术顾问。他是少数几个能在地下档案库里与识之律者长时间交谈的人。两人的对话从不记录。她的副官有一次送茶水进去，发现两人对坐在两排档案柜之间，李舜生在讲一个多年前的间谍案例，她在听，手里没有拿任何东西，只是听。\n\n千岱芷力战被俘，伤愈后被转送战俘营。她在战俘营中度过数年，拒绝接受改造。但她也不再反抗。她只是沉默地服从管理，完成分配给她的劳动。出狱后她在江南某小镇以刺绣为生。据说她的刺绣从不署名，但针脚极为考究。有人问她师从何人，她答：“宫里。”然后不再说话。"
  roc.480.a: "继续"

  roc.999.title: "[FROM.Getname]拒绝"
  roc.999.desc: ""
  roc.999.a: "行吧"



  ROC_inner.2.t: "忙碌的周恩莱"
  ROC_inner.2.d: "如果问国民政府中最具有真知灼见的人是谁，或许大家心中都有不同的答案，但如果问国民政府中最繁忙的人是谁那几乎所有人都会说是政治部主任——周恩莱。\n\n周恩莱作为国民革命运动中的最富盛名的青年才俊，她的组织能力是公认的优秀，就目前的情况来看她既要负责一部分行政、外交事务，还要负责部分军事上的决策，除了这些明面上的工作之外，情报工作上也有她的一份责任。\n\n但是能力再全面的人才精力也是有限的，为了能让周恩来同志能够更好的，更长远的服务于革命服务于人民，党内的部分同志提出了让周恩莱同志专注最重要的部分工作，而将其她工作交给其她人来负责的意见。\n\n尽管支持这个建议的不少人动机有待商榷，但她们说对了一件事，那就是人的精力是有限的，即便是那个人是周恩莱。\n\n经过一段时间的深思熟虑之后，宋主席最终决定……"
  ROC_inner.2.a: "让恩莱专注行政工作以保障党和政府高效运转！"
  ROC_inner.2.b: "让恩莱专注情报工作以挫败反革命分子的阴谋！"

  ROC_inner.4.t: "人民军队与人民"
  ROC_inner.4.d: "我们是人民的军队，要从群众中来来到群众中去。”这是毛润芝将军在数年前初创革命军游击队时做出的讲话。在那时，大部分人都觉得这只是毛将军发动群众动员军队的一种激励话术，很少有人把她当真，但是几年过去了，毛将军身体力行的证明了她并不是空谈。\n\n支部建在连上、士兵委员会、党指挥枪这几样如今革命军将士都耳熟能详的政策制度都是毛将军为了践行人民军队的理念而创立的，我们的部队的战士来自人民、热爱人民、帮助人民，而人民也同样拥护爱戴革命军，在过往的战争中，人民群众自发的为革命军运输寄养，提供情报，可以说没有人民群众的支持，我们根本无法以武器装备乃至兵力均占劣势的部队击溃装备精良的大兵团敌军。\n\n如今，人民军队的概念已经深入革命军将士的骨髓之中，军与民的关系也不再是过去的官兵压迫百姓的关系，而是一种如同鱼和水一样的互帮互助互利共赢的关系。\n\n虽然人民军队的理念博得了大部分革命军将士和人民群众的认可，但是那些有军校留学经历的少壮派将领却认为这中兵民不分的状态是对职业军人乃至军人职业的一种亵渎。"
  ROC_inner.4.a: "我们是工农的子弟，我们是人民的武装！"

  ROC_inner.17.t: "陈橙的首要任务"
  ROC_inner.17.d: "虽然陈橙在土改和整军方面都有不小的能力，但人的精力毕竟有限，我们应该让陈橙将军主要专注于一个方向。"
  ROC_inner.17.a: "让陈辞修专注于土改"
  ROC_inner.17.b: "让陈辞修专注于整军"




  ROC_navy_trade.1.t: "[FROM.GetAdjective]提议委托我们建造潜艇"
  ROC_navy_trade.1.d: "近日，[FROM.GetName]表示，他们需要扩充海军的规模以维护东亚海域的平衡，并由[FROM.GetName]曾留学于我国的海军军官们拟定了一份委托造舰方案——就像当年的北洋水师一样。\n该方案建议，由[FROM.GetName]出资，委托我国建造八艘潜艇。\n\n由于缺乏其他潜在的卖家，[FROM.GetAdjective]的出价十分可观，但说到底这件事情的决定权在我等而不是国府手中。"
  ROC_navy_trade.1.a: "同意该方案"
  ROC_navy_trade.1.b: "拒绝该方案"
  ROC_navy_trade.2.t: "[FROM.GetAdjective]提议委托我们建造驱逐舰"
  ROC_navy_trade.2.d: "近日，[FROM.GetName]表示，他们需要扩充海军的规模以维护东亚海域的平衡，并由[FROM.GetName]曾留学于我国的海军军官们拟定了一份委托造舰方案——就像当年的北洋水师一样。\n该方案建议，由[FROM.GetName]出资，委托我国建造四艘驱逐舰。\n\n由于缺乏其他潜在的卖家，[FROM.GetAdjective]的出价十分可观，但说到底这件事情的决定权在我等而不是国府手中。"
  ROC_navy_trade.3.t: "[FROM.GetAdjective]提议委托我们建造轻巡洋舰"
  ROC_navy_trade.3.d: "近日，[FROM.GetName]表示，他们需要扩充海军的规模以维护东亚海域的平衡，并由[FROM.GetName]曾留学于我国的海军军官们拟定了一份委托造舰方案——就像当年的北洋水师一样。\n该方案建议，由[FROM.GetName]出资，委托我国建造两艘驱逐舰。\n\n由于缺乏其他潜在的卖家，[FROM.GetAdjective]的出价十分可观，但说到底这件事情的决定权在我等而不是国府手中。"
  ROC_navy_trade.4.t: "[FROM.GetName]拒绝了提案"
  ROC_navy_trade.4.d: "经过多轮谈判磋商，[FROM.GetName]最终拒绝了我们的委托。"
  ROC_navy_trade.4.a: "行吧"
  ROC_navy_trade.5.t: "[FROM.GetName]同意建造潜艇"
  ROC_navy_trade.5.d: "经过了几轮谈判磋商，尽管[JAP.GetName]施压了不小的阻力，但我们最后成功说服了[FROM.GetName]。他们表示相关款项一到账就开始建造。"
  ROC_navy_trade.5.a: "太好了，快派人去汇丰银行！"
  ROC_navy_trade.6.t: "[FROM.GetName]同意建造驱逐舰"
  ROC_navy_trade.7.t: "[FROM.GetName]同意建造轻巡洋舰"
  ROC_navy_trade.8.t: "[FROM.GetName]寻求购买重型战舰"
  ROC_navy_trade.8.d: "近日，[FROM.GetName]表示，他们需要扩充海军的规模以维护东亚海域的平衡，并由[FROM.GetName]曾留学于我国的海军军官们拟定了一份委托造舰方案——就像当年的北洋水师一样。\n该方案建议，由[FROM.GetName]出资，委托我国建造重型战舰。\n\n显然他们也没觉得我们会同意这种提议，在我方拒绝了该提议后，他们又转而提议购买我方因经济危机停建的战舰或更老旧的重型战舰。\n战列舰自然是不能出售的，我国也几乎没有留着什么更旧的船，谈判一度陷入了僵持。\n不过在最近的一次讨论中，国府表示经过他们的查证，有一部分老旧的前无畏舰被我们送到了[EAS.GetName]并改称“缅因猫级”，这几艘战舰目前也遭废弃，在当地几乎成为了地标。\n\n前无畏舰这种老古董就不在不能出售的范围之内了，总之，出售与否的决定权依旧在我方。"
  ROC_navy_trade.8.a: "反正是堆废铁，报个高价还能挣点。"
  ROC_navy_trade.8.b: "就算是废铁也是有价值的废铁！"
  ROC_navy_trade.9.t: "[FROM.GetName]同意出售重型战舰"
  ROC_navy_trade.9.d: "经过多次磋商，由于[FROM.GetName]坚决不同意出售战列舰，我方便提议购买其荒废在[EAS.GetName]的前无畏舰，他们同意了。\n但要价昂贵，根据这份协议，我们预计要支出约伍佰亿元（单位为圣杯联邦货币）以购买两艘“缅因猫级”前无畏舰，但购买重型战舰机会难得，我们必须做出抉择。"
  ROC_navy_trade.9.a: "干了！"
  ROC_navy_trade.9.b: "……其实我们也不是很需要啊"
  ROC_navy_trade.10.t: "[FROM.GetName]同意购买"
  ROC_navy_trade.10.d: "[FROM.GetName]同意了购买前无畏舰。"
  ROC_navy_trade.10.a: "合作愉快"
  ROC_navy_trade.11.t: "[FROM.GetName]拒绝购买"
  ROC_navy_trade.11.d: "[FROM.GetName]拒绝了购买前无畏舰。"
  ROC_navy_trade.11.a: "那就不卖！"



