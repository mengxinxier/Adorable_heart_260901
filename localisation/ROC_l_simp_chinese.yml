  ROC_resolve_autonomy_issues: "审视中共自治区问题"
  ROC_resolve_autonomy_issues_desc: "依照先前的协议，中共在一部分地区拥有自治权和军权，完全融入政府需要多年的过渡。但如今时局有变，我们理应重新审视这一协议。"
  ROC_UP_local_autonomous_build: "推动地方自治"
  ROC_UP_local_autonomous_build_desc: "按照钟岚珠的方案，我们要在自己的控制区建立起完美的地方自治，好让她们无话可说。\n\n§Y若完成决议时未控制所有的中国省份，我们将在控制新省份的时候解锁决议以在当地推行自治。§!"
