  ROC_focus_War_criminal_SaiBan_tt_RC_song: "§L在§P民革§!和§Y宋庆龄§!的领导下，§4中央委员会§!决定：除穷凶极恶之战犯应立即处以极刑外，其他的战犯将送往特别设立的战犯管理所进行关押和改造。§!\n"
  ROC_focus_War_criminal_SaiBan_tt_RC_jiang: "§L在§P民革§!和§Y蒋巾帼§!的领导下，§4中央委员会§!决定：把这些战犯全部送去劳动改造！§!\n"
  ROC_focus_form_soviet_division_tt_1: "§L获得一个由§Y7步兵营 2炮兵营§!构成的师编制，并获得一个该编制的师\n\n若完成国策时§R苏联§!已经拥有科技§Y机械化步兵§!，获得一个§Y4机械化步兵营 4轻型坦克营§! 的编制，并获得一个该编制的师，若苏联未拥有机械化步兵，则将§Y机械化营§!改为§Y摩托化营§!。§!"
