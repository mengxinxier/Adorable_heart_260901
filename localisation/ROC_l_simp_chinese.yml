  roc_news.006.t: "$news_event_background$宋庆龄巩固权力"
  roc_news.006.desc: "在之前公开的宋庆龄-蒋巾帼的对抗中，宋庆龄很快整合了政治力量并取得了足够的支持，成功挫败了蒋巾帼政变的企图。\n\n如今，蒋巾帼的行政院院长职务已被撤职，而帮助宋庆龄良多的洛茜则是成为了新的行政院院长。现在的国民党内，已经没有了反对宋庆龄的声音。"
  roc_news.006.a: "宋主席万岁！"
  roc_news.006.b: "恭喜我们的朋友。"
  roc_news.006.c: "狗咬狗！"
  roc_news.006.d: "这位孙夫人会成为中国新的主人吗？"

  roc_news.007.t: "$news_event_background$蒋巾帼政变"
  roc_news.007.desc: "在之前公开的宋庆龄-蒋巾帼的对抗中，蒋巾帼很快整合了政治力量并取得了足够的支持，成功弹劾了宋庆龄。\n\n如今，宋庆龄已经被解除了一切实权职务，蒋巾帼成为了新的总统。现在的国民党内，已经没有了反对蒋巾帼的声音。"
