  roc.173.title: "樱花国的命运"
  roc.173.desc: "对樱花国的战争结束了。\n\n联合舰队覆灭的那天，宋庆龄在南京的办公室里收到了一封电报。电文只有一行字：“东京已下。樱花旗降。伤亡统计随后呈报。”她看完电报，把它放在桌上，走到窗前站了很久。窗外是紫金山的秋色，中山陵的白色石阶在夕阳下泛着金光。她想起辛亥革命时在东京度过的那些日子，想起那些与她并肩奋斗的樱花友人，想起孙中山在神户的演讲。然后她转过身，对洛茜说：“召集最高国防委员会。我们要讨论的不是怎么庆祝胜利，是怎么处置战败的樱花国。”\n\n最高国防委员会的会议开了整整三天。争论的焦点不是军事占领方案——真正的分歧在于占领之后的政治安排。宋庆龄提出了一个前所未有的方案：在樱花国建立一个由中华民国监管的临时政府，不吞并领土，不扶植傀儡，而是由中国人直接主导樱花国的民主化改造，直到樱花国人民能够自己建立一个和平、民主的政府。她把这个方案称为“樱花民国监管政府”。方案提出后，委员会陷入了沉默。然后，争论开始了。\n\n蒋巾帼认为应当彻底废除天皇制，在樱花国推行苏维埃式的土地改革和工业国有化，将樱花国改造为一个社会主义国家。胡宗南则说得更直接，她认为应当直接吞并樱花国，设置总督进行统治，她甚至在会上展开地图指出樱花国在太平洋上的战略位置和海空军基地对国防的价值。几个旧官僚出身的委员低声附和，但又不敢大声说出来。宋教仁则担心财政负担，认为长期驻军的费用会影响国内建设，她倾向于扶植一个亲华的地方政府后尽快撤军。她们各有各的道理，谁也不肯让步。\n\n宋庆龄听了所有人的发言，没有打断任何一个人。她点了点头，然后站了起来。\n\n“樱花国的人民和我们的战士一样，都是战争的受害者。我们不能用旧帝国的方式去统治她们。我们要建立一个新的政府——不是傀儡政府，不是殖民地政府，是一个由中国人民和樱花人民共同建设的民主政府。这是革命，不是征服。征服是把别人踩在脚下。革命是把手伸给别人。谁愿意去东京？”\n\n她的目光扫过会议室。所有人都知道，这不是一个简单的任命。樱花国刚刚战败，社会动荡，经济崩溃，旧势力盘根错节。去东京的人，不仅要面对这些困难，还要面对一个更难回答的问题：你怎么让一个昨天还在恨你的人，明天愿意和你一起建设未来？"
  roc.173.a: "暂且休会"

  roc.174.title: "毛遂自荐"
  roc.174.desc: "邓择笙是第一个主动请缨的人。她在北伐时期担任国民革命军总政治部主任，此后一直致力于平民教育和农工运动。会议结束后她没有立刻离席，而是等其她人都散了，单独留了下来。她走到宋庆龄面前，从怀里抽出一张纸放在桌上——那是一份她从国内农民运动实践中反复总结完善的土地改革路线图，纸面已经有些泛黄，页角被反复翻阅磨出了毛边。\n\n“我去。”她说，“我在国内搞了那么多年平民教育和农工运动，这些经验不能只在中国用。樱花国的农民和我们的农民一样，被地主剥削了几百年。她们的工厂被财阀控制，她们的工人住在贫民窟里，她们的孩子上不起学。我可以帮她们。”\n\n宋庆龄看着她。她迎着那道目光站得笔直，像是在接受检阅。她问了一个问题：“你想过没有——樱花国的农民可能不需要一个中国人来告诉她们怎么种地？”\n\n“想过。”邓择笙回答，“所以我不是去告诉她们怎么种地。我是去把地分给她们。地契上写的是她们自己的名字，不是我的名字。她们恨的是侵略者，不是把地给她们的人。我现在去，也许她们会恨我；但等她们的孩子在自己的地里种出第一季稻子，她们会知道谁是真正帮她们的人。”\n\n宋庆龄没有立即回答。她低下头，把邓择笙带来的那份土地改革路线图从头到尾翻了一遍。纸页沙沙地响着，那些她在国内农村改革中反复讨论过的条款和案例一一掠过她的眼前。片刻后她重新抬起头来，对邓择笙说：“你准备一下，明天在最高国防委员会上陈述你的方案。”\n\n冯焕章走进会议室时，手里拿着一本旧得泛黄的名册。那是她当年在北方带兵时记录各地士绅联系方式的本子，封皮磨得发亮，内页密密麻麻记着名字、住址和简短的批注。她把名册放在会议桌上，没有翻开，只是用手掌按着它。\n\n“我去樱花国。”她的声音不大，但很稳，“樱花国不比咱们简单。她们刚打完败仗，心里憋着屈。社会上头有财阀，下头有浪人，中间还有一批旧军人虎视眈眈。没有点手腕，镇不住那种场子。我有经验——不是搞土改的农运经验，也不是做民主宣传的讲台经验。我跟军阀打过交道，跟买办商人打过交道，跟旧派军官也打过交道。我知道怎么跟那些手里还握着刀的人谈判。我不跟她们谈主义，我跟她们谈利害。”\n\n宋庆龄问她：“如果旧势力不肯合作呢？”\n\n冯焕章翻开那本名册的第一页，上面的墨迹已经很淡了。她指着泛黄的纸页说：“不肯合作的，我让她们自己斗。我当年在北方就是这么做的——不是用枪逼着她们听话，是让她们明白，不合作的代价比合作更大。我在旧军队里混了很多年，我知道她们的底。樱花国财阀的底，我摸得清。她们怕什么？她们怕的不是枪，怕的是被排除在新秩序之外。”\n\n宋教仁在旁补充道：“对樱花国的民主化改造可能需要一个有政治手腕的人。冯将军在旧军队和旧官场里积累了丰富的经验，她知道怎么在复杂的局面中找到突破口。”她说完，把目光转向冯焕章，轻轻点了点头。"
  roc.174.a: "让邓择笙去"
  roc.174.b: "让冯焕章去"

  roc.175.title: "邓择笙的演讲"
  roc.175.desc: "邓择笙站在最高国防委员会的讲台上。她没有带讲稿，只是把那份土地改革路线图摊开，放在桌上。\n\n“樱花国的问题不是军事问题，是土地问题。谁控制了农村，谁就控制了樱花国的未来。我建议在樱花国推行彻底的土地改革。没收大地主和财阀控制的土地，分配给无地少地的农民。同时在农村建立平民教育体系，让每一个樱花孩子都会写自己的名字。我不需要很多军队。我需要的是土地改革工作队，是农业技术员，是乡村教师。”\n\n她停顿了一下，扫视了一圈台下。“有人说，樱花国人会恨我们。是的，她们会恨一个侵略者。但她们对侵略者的恨是暂时的，她们对自己地主的恨是几百年积累的。如果我们把土地分给她们，她们还会恨我们吗？也许一开始会。但当她们第一次在自己的土地上收割稻子，她们手里握着的不再是仇恨，是稻穗。”她拿起一支稻穗放在桌上的地图旁。那是她从自己在国内土改时保留的标本里取出来的，穗粒饱满，每一粒都鼓胀着。“这支稻穗是从我们自己的土地上长出来的。同样的稻种，可以在樱花国的土地上生长。土改不是恩赐，土改是偿还。偿还农民被剥夺的一切。”\n\n宋庆龄听完了她的陈述，然后问了一个问题：“如果樱花国人民不接受你，你准备怎么办？”邓择笙的回答很简单：“我不会强迫她们。我会蹲下来，和她们一起插秧。她们什么时候信我，我就什么时候开始。她们不信我，我就继续蹲着。我在苏北试点的第一批合作社就是这样建起来的——不是靠命令，是靠让农民看隔壁田里的产量。我觉得在樱花国，这个办法仍然管用。”"
  roc.175.a: "一路走好"

  roc.176.title: "冯焕章的演讲"
  roc.176.desc: "冯焕章站在最高国防委员会的讲台上。她没有讲稿，但她带了三样东西：一把旧式军刀，一本泛黄的名册，和一封已经拟好的致樱花国社会各界公开信。\n\n“樱花国刚战败，社会动荡，经济崩溃。但有一件事各位可能没注意到——她们的官僚体系还在运转。天皇宣布投降后，所有政府机构没有停摆，她们的户政、税务、邮政还在工作。这是个讲秩序的民族，即使吃了败仗也还在排队。我们可以利用这一点。我不主张撤换所有旧官僚。让那些愿意合作的留下来，我们派人进去，在关键岗位上监督她们。她们熟悉国情，我们负责把关。这样可以避免不必要的混乱。”\n\n她把旧军刀放在桌上。“这把刀，是我在战场上缴获的。现在它成了一件文物，但我把它带来了，是为了在谈判桌上还给她们。我会对樱花国的旧军人说——刀，你们已经交出来了。现在你们要做的事不是磨刀，是证明你们不配再拿刀。怎么证明？用你们的手去建工厂，去修铁路，去给孩子们办学校。”\n\n她把公开信展开，上面已经用工整的楷书抄好了最后一段——“本代表此来，非为征服，实为携手。贵国之未来，当归于贵国之人民；本代表之职责，乃扶助贵国人民建立和平、民主之新国家，使刀兵永不复起，使子孙永享太平。”\n\n“我会让这封信登在樱花国所有报纸的头版。同时我会派人去拜访那些愿意合作的人——财阀中的温和派、旧军人中的反战派、大学里的自由知识分子。让她们知道，新政权不会没收一切私有财产，不会羞辱战俘，不会强迫她们的孩子向中国磕头。我只要求一条：她们必须接受民主改造。不肯接受的，我也不杀。我会让她们自己选择——要么站到人民这一边，要么被人民抛弃。”\n\n宋庆龄问她：“如果樱花国人民不信任你，你准备怎么办？”\n\n冯焕章合上名册，说：“不信任是正常的。我也不信任她们。信任不是一天建起来的。但我知道怎么开始——从恢复她们最关心的东西开始。她们要粮食，我们调粮；要电力，我们修电厂；要秩序，我们维持治安。这些东西做得多了，信任自然会来。不是用嘴巴说的，是用一件一件的事做出来的。”她举起茶杯，慢慢地品了一口，然后放下说，“茶要慢慢泡，国要慢慢建。我有耐心。”"
  roc.176.a: "一路走好"

  roc.177.title: "战犯再教育基本完成"
  roc.177.desc: "此前，在北伐战争中被我方俘获的神州伪朝廷之战犯经中央决定，送往特别设立的战犯管理所进行关押和改造。起初不少死硬分子心里极度恐惧与抗拒，嚷嚷着“国民党一定是要杀咱们头的！”硬是不肯配合。然而在我们不懈的努力下，她们最终切身体会到了革命党的真正理想与胸襟：革命不是为了杀人，而是为了打碎旧世界；即便是曾经的敌手，只要能意识到自己对人民犯下的过错，也同样能够被改造，重新做人。\n\n在管理所里，我们不仅组织她们学习新思想，还安排她们深入基层参观工农建设。看着昔日贫苦的乡村在革命后焕然一新，不少本就心向进步的人深受触动，积极配合并深刻反省；连那些顽固不化的死硬分子，在铁一般的事实面前也不得不承认，我们远胜于腐朽的神州朝廷。如今，一部分和神州朝廷各派系本就没多大牵连、改造表现优异的进步派人士，已经达到了特赦标准。\n\n今天，[ROOT.GetLeader]正式颁布总统令，宣布特赦这一批战犯。虽然社会上仍有一些质疑的声音，但军队里的将领们普遍对此表示欢迎——我们期望她们扎实的军事经验和素养，能在往后的战争中帮到我们。"
  roc.177.a: "欢迎她们继续为国争光"

  roc.178.title: "飞来的手谕"
  roc.178.desc: "我叫张三，24岁，是个大头兵。\n\n最近上级说要搞现代化军队，宣传干事天天在食堂敲着饭碗，号召全军深入学习革命烈士蒋介石同志的带兵经验。之前蒋烈士在北伐中英勇牺牲，但他留下了不少手稿。听说蒋烈士当年能身处后方司令部，把指令直接下达给前线某一个重机枪掩体，连哪个班该守哪条沟都管得清清楚楚。为了把这种管到连排的经验发扬光大，总参谋部特地研制出了一套绝活——空投手令。\n\n上头这主意简单来说是这样的：一旦演习里无线电坏了、信号发不出去，后方的长官就亲自提笔写好手谕，让侦察机开到前线头顶直接空投下来，把指令精准砸到我们头上。这TM到底是个什么脑回路？用飞机来传纸条？我心里感叹道：总参谋部真是个大聪明！\n\n今天演习，我们连趴在泥水里打冷颤，战术电台里除了“沙沙”声啥也没有。突然头顶“嗡”的一声，真飞来了一架侦察机，舱门里扔出一个挂着红绸布的金属筒。\n\n结果这玩意儿当场就砸锅了，刚飘下来就被一阵妖风刮进了侧面的密林里，直接挂在了几十米高的大树杈子上。班长骂骂咧咧领着我们几个又是爬树又是砍刺藤，抓耳挠腮折腾了半个钟头，手都扎破了，才算把手谕掏出来。\n\n班长毕恭毕敬地展开那张字写得跟书法似的纸条，念道：“命该连向左移动五十步，重机枪摆放于左侧斜坡……”\n\n然而还没等班长念完，对面的兄弟部队早就靠着最基础的铜号和信号弹完成了包抄，几挺机枪直接贴着我们屁股架好了。演习裁判员掐着秒表过来掏出红旗，判定我们全连阵亡，还嘲笑道：“人家扫战场的扫帚都换了两把了，你们还在树上掏手谕呢！”\n\n我抹了抹身上的泥水，看着班长手里那张写得龙飞凤舞的纸条，心里又又又一次感叹道：能从蒋烈士故纸堆里翻出这种主意的，真是个大聪明！"
  roc.178.a: "至少字挺好看的……"

  roc.179.title: "黄埔第[GetYear]届"
  roc.179.desc.nanjing: "珠江浪涌，红旗猎猎。从当年仅凭广东一省苦苦支撑，到如今华南诸省全面肃清与统一，革命的火焰终于再次席卷了半个神州。珠江畔的黄埔陆军军官学校校场上，第[GetYear]届学员正排列着整齐的方阵，举行隆重的授旗仪式。\n\n校门两侧，“升官发财请往他处，贪生畏死勿入斯门”的对联在阳光下熠熠生辉。站在主席台上的军中老将们看着台下如林的枪刺与年轻面孔，心中百感交集——当年北伐未竟的遗憾，终于要在这代人手中画上句号了。\n\n这一期学员不再需要像前辈那样在守势中苦苦煎熬。他们将作为重新北伐的骨干与刀锋，踏上犁庭扫穴、推翻北方腐朽朝廷的漫漫征途。“怒潮澎湃，党旗飞舞”，激昂的校歌响彻江面，昭示着一场扫荡全国的狂风暴雨即将来临。"
  roc.179.desc.guangzhou: "自当年北伐受挫以来，广东省便成了革命最后且唯一的坚实堡垒。十余年来，黄埔军校在珠江畔的炉火从未熄灭，一批又一批青年在这里接受淬炼，在偏安一隅的压抑与守势中等待着转机。\n\n而到了如今，风暴终于轰然而至。全球经济危机的狂风席卷全国，远在北方的神州朝廷对华南的统治与控制力在一夕之间全面破产。军校门口那副著名的对联——“升官发财请往他处，贪生畏死勿入斯门”——在潮湿的江风中依旧熠熠生辉，但空气中早已不再只有沉闷，更弥漫着硝烟与决战的前奏。\n\n今日，黄埔第[GetYear]届学员的开学与授旗仪式在校场上隆重举行。与以往那些在守势中苦练本领的前辈不同，这一届年轻人的心里无比清楚：神州大地的秩序已经彻底松动，广东积蓄了整整十年的革命火种即将被再次点燃。他们中的大多数人，恐怕根本等不到毕业，就要直接拿着枪踏上见血的战场。\n\n“怒潮澎湃，党旗飞舞，这是革命的黄埔……”\n\n激昂的校歌声响彻珠江两岸，学员们的眼神中闪烁着久违的锐气与战意。风暴已至，而这群最年轻的军官们，已经做好了迎击天塌地陷的准备。"
  roc.179.desc.allcountry: "珠江滔滔，气象一新。昔日山河破碎、群雄割据的阴霾早已散尽，革命的旗帜如今已高高飘扬在神州大地的每一寸土地上。而作为革命圣地的黄埔陆军军官学校，也在和平与胜利的曙光中迎来了第[GetYear]届学员。\n\n与几十年前那些在危难中提枪赴死、甚至未毕业就要踏上战场的前辈不同，这一届的年轻人们不再带着“偏安一隅”或“孤注一掷”的沉重。他们站在浴火重生的新国家土地上，眼神中充满着自豪与自信。\n\n校场上，军乐响亮，军旗猎猎。对于这一期的黄埔学子而言，他们的使命已经发生了根本性的改变——他们不再是国民革命的破局先锋，而是守卫这来之不易的和平、保卫广大人民的钢铁长城。"
  roc.179.a: "亲爱精诚，继续永守！"

  roc.180.title: "铁路人偶！？"
  roc.180.desc: "在国军进入北京之后，西瓜偶然发现居然能共鸣到一位铁路人偶，在西瓜的追问下我们大致了解了原因：这位铁路人偶名叫19号，是神州政府从火车国雇佣来参与建设铁路的。\n\n考虑到她拥有丰富的铁路经验并且熟悉中国的地形，我们邀请她继续留在中国为铁路建设服务。"
  roc.180.a: "我想逸仙先生应该会很高兴吧。"

